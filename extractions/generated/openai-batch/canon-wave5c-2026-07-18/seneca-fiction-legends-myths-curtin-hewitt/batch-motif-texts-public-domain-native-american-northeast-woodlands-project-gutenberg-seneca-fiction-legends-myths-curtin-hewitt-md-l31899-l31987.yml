canonical_text:
  quote: ''
  summary: A young nephew of Okteondon meets a strange man in a canoe who claims shared
    kinship and likeness, tests their matching bows, arrows, and speed, then lures
    him into further play. The strange man summons wild geese, later leaves the youth
    stranded on an island, and offers his flesh to water-dwelling flesh eaters. The
    youth wanders among human bones and receives advice from a half-dead man who tells
    him to use his orenda and hide in sand at night to evade his enemy.
  language: English
  quote_policy: summarized
