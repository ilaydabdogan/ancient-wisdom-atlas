canonical_text:
  quote: ''
  summary: Hodadenon spends successive nights in hollow trees, is warned about dangerous
    beings, and kills them with an arrow. He crosses a lake inside an oak puffball
    propelled by wind, asks lodging from a poor widow and her grandson, hunts a bear
    with the grandson, shares and exchanges bear meat, and then hears a herald announce
    a gathering at the Long Lodge involving a man who sheds wampum instead of tears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hodadenon looks for and enters a hollow tree as a place to spend the night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man comes to the hollow tree and asks what Hodadenon would do if a Ganiagwaihe
    came to eat him; Hodadenon answers that he would have fun with it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A very large Ganiagwaihe comes, Hodadenon shoots it in the neck with an arrow,
    and the being runs away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The next morning Hodadenon finds trees torn up along the Ganiagwaihe's track,
    finds the being dead, retrieves his arrow, and leaves the carcass.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: On a second evening, Hodadenon enters another hollow tree; a man asks what
    he would do if a S'hagodiyoweqgowa came to kill him, and Hodadenon answers that
    he would have sport with it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A very large S'hagodiyoweqgowa comes to the tree; Hodadenon shoots it with
    his magic arrow and goes to sleep.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the morning Hodadenon follows a trail of broken and uprooted trees and
    finds the S'hagodiyoweqgowa dead, with a terrifying face; he retrieves his arrow
    and goes on.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hodadenon comes to a great lake with a village on the far side, enters an
    oak puffball at the water's edge, and causes wind to blow it across the lake.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the village Hodadenon reaches the last lodge, where an old widow named
    Yeqsinye and her grandson live, and asks to stay for the night.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Yeqsinye says they are poor and have only scraps of food; Hodadenon says he
    wants only a place to stay and not food.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The next morning Hodadenon and the widow's grandson go hunting; at a hollow
    tree frequented by a bear, Hodadenon calls the occupant out and shoots the bear
    dead.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The bear carcass is brought home, dressed, cooked, and eaten; a young girl
    receives meat for her mother, and then exchanges cornbread for more meat.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: A herald named Hadyuswus announces that people should come to the Long Lodge,
    where a man sheds wampum instead of tears from his eyes, and gathered wampum may
    be kept.
  category: speech
  evidence_refs:
  - ev:9
