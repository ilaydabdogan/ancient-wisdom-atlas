canonical_text:
  quote: ''
  summary: A youth repeatedly goes north despite his grandmother's warning and meets
    a man addressed as his uncle who sits in tied tree tops and threatens destructive
    showers of spears and stones. The youth hides with his grandmother by entering
    a spring and sheltering underground near a rock, then restores ruined lodges by
    command. On a later visit, the youth uses a mole helper and shrinks to flea size,
    challenges the uncle with a whirlwind, hides again, and later believes the uncle
    has been destroyed under uprooted trees. His grandmother then says the uncle has
    a brother farther north.
  language: English
  quote_policy: summarized
