canonical_text:
  quote: ''
  summary: Doonongaes enters a sequence of dangerous encounters. At an eastern lodge,
    four Odjieqda women try to kill him; after attacks rebound on the attackers and
    the women fight among themselves, he burns the lodge and they die. He then finds
    Tsodiqgwadon playing ball against two old Dagwennigonhge men; after Doonongaes
    helps win the game, the opponents are beheaded, their heads are burned, Dagwanoenyents
    rush out, and a cliff collapses. Doonongaes and Tsodiqgwadon then meet Hahnyusdais,
    identified as master of the dwellers under the cliff, and stretch him until Doonongaes
    says he will be Haunhdji.
  language: English
  quote_policy: summarized
