canonical_text:
  quote: ''
  summary: A woman comes to the nephew's room. The uncle detects her presence and
    later pretends to go hunting. The nephew warns his wife that the uncle is a man-eater
    who killed three earlier women, provides supplies so she need not go outside,
    and repeatedly tells her not to leave. After the nephew leaves, the uncle attempts
    by command to make her go out and to make her cooking water boil away, but she
    remains inside. The nephew returns, sees smoke from the lodge, thanks her for
    obeying, and the uncle returns empty-handed and resentful.
