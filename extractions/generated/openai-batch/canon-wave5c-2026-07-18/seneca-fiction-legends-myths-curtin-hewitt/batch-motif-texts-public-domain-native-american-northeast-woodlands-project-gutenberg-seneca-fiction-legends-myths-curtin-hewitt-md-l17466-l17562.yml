canonical_text:
  quote: ''
  summary: A magically powerful lad is thrown into an inescapable ravine, survives
    repeated attacks by a flesh-biting bird, receives dream instructions from an old
    woman, grows a hemlock tree from a vomited leaf, revives bones into living men,
    loses two men who look back during the ascent, then returns to confront the deceiving
    woman and her witch mother, completing an otter-killing ordeal by a hidden stratagem.
  language: English
  quote_policy: summarized
