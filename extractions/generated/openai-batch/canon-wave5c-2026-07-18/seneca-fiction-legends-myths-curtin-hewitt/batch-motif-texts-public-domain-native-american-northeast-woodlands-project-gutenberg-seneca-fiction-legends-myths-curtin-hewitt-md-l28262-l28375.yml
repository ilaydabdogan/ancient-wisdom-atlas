canonical_text:
  quote: ''
  summary: A chief named Daga'idon'dye' welcomes Dehaenhyowens and two surviving companions
    after a long absence, credits Deaunhyawa'gon or Hawenni'yo with forewilling their
    safe return, and leads a communal body-stroking greeting. The people promise equality,
    peaceful association, lacrosse, and the Pigeon Song dance to celebrate the return.
    A thanksgiving address then gives thanks for life and to Earth, sky, day and night
    light orbs, Thunderers, protective servants, and the Master or Finisher of Life;
    it introduces the Great Feather Dance and further ordained ceremonies, including
    festival attire, painted faces, feather headdresses, and officers who promote
    the Six Ceremonies.
  language: English
  quote_policy: summarized
