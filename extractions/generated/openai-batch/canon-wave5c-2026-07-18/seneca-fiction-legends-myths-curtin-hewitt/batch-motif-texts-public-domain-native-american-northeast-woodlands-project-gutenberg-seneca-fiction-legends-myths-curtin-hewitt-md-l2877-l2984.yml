candidate_motifs:
- id: motif:1
  label: Foretold slaying of an animal-like opponent
  taxonomy_refs:
  - culture_hero
  basis: The Buffalo-slayer kills the young Buffalo, fulfilling a prior statement
    by the Djogeon, and the people thank him.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage shows a successful slaying and public gratitude, but it does
    not explicitly call the slayer a culture hero.
- id: motif:2
  label: Killed Buffalo beings return after leaving edible carcasses
  taxonomy_refs:
  - death_rebirth
  - resurrection
  - dying_and_returning
  basis: The Buffaloes are thought to be killed and their carcasses eaten, but their
    spirits return to the old man and they become Buffaloes again.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage states return and renewed Buffalo form, but gives little mechanism
    beyond the separation of carcasses and spirits.
- id: motif:3
  label: Animal beings perceived as people
  taxonomy_refs:
  - shapeshifter
  basis: The man knows the beings are Buffaloes, yet in his eyes they seem like people;
    their spirits later become Buffaloes again.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage implies animal-person ambiguity but does not describe an explicit
    physical transformation scene.
- id: motif:4
  label: Released spouse directed to a humble caretaker bride
  taxonomy_refs: []
  basis: The mother-in-law releases the man, refuses other marriage options for him,
    and instructs him to marry the poor granddaughter who cares for her grandmother.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: This is a narrative pattern in the passage, but no supplied taxonomy family
    directly matches it.
- id: motif:5
  label: Secret animal lover revealed by imitated signal
  taxonomy_refs: []
  basis: The wife summons the Bear from a hollow tree by tapping and speaking; the
    husband later imitates the signal and kills the Bear.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The Bear is an animal lover, but the passage does not state that the Bear
    changes shape.
- id: motif:6
  label: Unwitting eating of the animal lover
  taxonomy_refs: []
  basis: The husband brings home the Bear's entrails, the wife eats them, and he tells
    her she is eating her lover or husband.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: No external comparison is made in the passage; the motif label is descriptive.
- id: motif:7
  label: Human woman bears animal offspring
  taxonomy_refs: []
  basis: After fleeing, the woman takes medicine and delivers two bear cubs.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage reports bear cubs as offspring but gives no further explanation
    of conception or transformation.
- id: motif:8
  label: Omen object indicates harm to absent traveler
  taxonomy_refs: []
  basis: Before following the woman, the father places feathers in water and says
    the feathers will be bloody if evil happens to him.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage introduces the omen but does not show its later outcome within
    the supplied excerpt.
