canonical_text:
  quote: ''
  summary: 'The passage concludes a Buffalo Man episode: an unnamed man kills the
    young Buffalo, later travels with his wife and mother-in-law to his mother during
    maple sugar making, is released from the marriage, is instructed whom to marry,
    and tells villagers about buffalo tracks. The villagers kill Buffaloes and eat
    the carcasses, while the Buffaloes'' spirits return to the old man and become
    Buffaloes again. The passage then begins ''A Woman and Her Bear Lover'': a husband
    discovers his wife meeting a Bear in a hollow tree, kills the Bear, brings home
    its entrails, and reveals that she has eaten her lover. She flees, aborts two
    bear cubs, leaves her breasts on an ironwood tree, and the husband prepares an
    omen with water and feathers before following her.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed man kills the young Buffalo/Buffalo Man by shooting from behind
    after finding that the side is one immense rib; the people thank him, and the
    words of the Djogeon are said to be fulfilled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the Buffalo Man is killed, the old man tells the people they may go
    where they like, and the man travels for ten days with his wife and mother-in-law
    toward his mother during maple sugar making.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wife and mother-in-law stay in the woods near the man's mother's lodge
    and secretly collect sap and wood so that the boiling place is supplied.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mother-in-law tells the man he may be free, says she will take her daughter
    home, warns him not to marry other women, and identifies the poor granddaughter
    at the last lodge as the one he should marry.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The mother-in-law also tells the man to report buffalo tracks in the swamp;
    the villagers then go out and kill Buffaloes, though the man sees them as people
    while knowing they are Buffaloes.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The villagers think they killed the Buffaloes and eat their carcasses, but
    the passage states that the Buffaloes' spirits return to the old man and become
    Buffaloes again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the next tale, a man, his wife, and two sons live in the woods; the elder
    son becomes sickly, and the husband suspects his wife and hides near the lodge
    instead of hunting.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The wife comes out dressed and groomed, goes to a large tree, taps it, says
    she is there again, and a great Bear comes out of the hollow trunk.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The husband later goes to the Bear's tree, repeats the wife's signal, shoots
    the Bear, leaves its skin, and carries home its entrails.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The wife cooks and eats the Bear's entrails with wild potatoes; the husband
    tells her she is eating her lover or husband, after which she vomits and runs
    west into the woods.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The woman takes medicine that causes an abortion resulting in two bear cubs,
    leaves the cubs on the ground, cuts off her breasts, and hangs them on an ironwood
    tree.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Before following the woman west, the father tells the elder boy to care for
    the younger child and places feathers in a bowl of water, saying the feathers
    will be bloody if evil happens to him; he later finds the cubs and breasts.
  category: object
  evidence_refs:
  - ev:12
