canonical_text:
  quote: ''
  summary: Two brothers live in a secluded forest lodge. The elder warns the younger
    not to show a hidden human skull and other sacred things. Visiting young women
    twice persuade or induce the younger to reveal the skull; a woman steals it and
    flies away. After the first theft the younger kills the women with a corn-pounder
    and recovers the skull. After the second theft the elder shoots an arrow after
    the fleeing woman, later disguises himself as an old man, finds her suffering
    with the arrow in her body, removes it with his teeth, and heals her. He then
    asks for corn, bean, and squash seed and calls mice to dig a tunnel toward the
    woman’s lodge; the excerpt breaks off before the action is completed.
  language: English
  quote_policy: summarized
