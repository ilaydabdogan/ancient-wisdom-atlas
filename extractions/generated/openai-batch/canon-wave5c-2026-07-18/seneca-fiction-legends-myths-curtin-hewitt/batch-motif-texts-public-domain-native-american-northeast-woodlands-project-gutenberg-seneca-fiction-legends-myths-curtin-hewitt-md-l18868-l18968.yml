canonical_text:
  quote: ''
  summary: 'The passage first recounts a Seneca war episode involving deception, pursuit,
    hiding, and an ambush against the Seoqgwageonon, followed by Cherokee comments
    on Seoqgwageonon divination and Seneca magical power. It then begins the Hatcinondon
    tradition: Hatcinondon, a Seneca warrior, raids Cherokee country, escapes pursuers
    in reed land, is summoned at night to the lodge of the Heron or Ne Hononhsot,
    receives self-restoring food, and witnesses the bright arrival and eastward departure
    of the Sun.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Seneca messengers approach a Seoqgwageonon village while the Seoqgwageonon
    are playing ball, throw sumach darts so they will be mistaken for local people,
    kill and scalp a man, and flee.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mounted Seoqgwageonon with dogs pursue the Seneca, but the Seneca hide in
    a dry creek with overhanging banks and the dogs and pursuers fail twice to find
    them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At an opening into a forest, Seneca people wait in a horseshoe formation;
    when the pursuers enter it, the Seneca close in and capture or kill all except
    one.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cherokee speakers tell the Seneca that the Seoqgwageonon are fortune-tellers
    who can foresee what other people will do, but cannot tell what the Seneca will
    do; they also say the Seneca are magically more powerful.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hatcinondon is described as a great Seneca warrior and leads a large company
    of warriors into Cherokee country on a raid.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hatcinondon leaves his men to scout ahead, is pursued after being discovered,
    and escapes into one of two large reed-covered sections while his enemies believe
    he is in the other.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The enemies set guards at the strip between the reed sections, burn the reeds
    they think contain Hatcinondon, and search for his charred body, while Hatcinondon
    has fallen asleep in the other reed stretch.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: During the night two men come to Hatcinondon, seize him by the arms, say they
    have come for him, and bring him to the one who sent for him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The two men point out a lodge and say it is where the Heron lives, the one
    who sent for Hatcinondon.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Hatcinondon cannot find a doorway in the lodge, but a voice inside says to
    come in and a door opens by itself.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The man inside the lodge says he sent for Hatcinondon, asks whether he is
    hungry, and knows Hatcinondon's unspoken thought about how food should be given.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The lodge host gives Hatcinondon half a loaf of corn-meal bread, half a wild
    apple, and half a pigeon; as Hatcinondon eats, the food becomes whole again and
    cannot be fully consumed.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Sun enters the lodge with such brightness that Hatcinondon lowers his
    head, speaks with Ne Hononhsot in words Hatcinondon cannot understand, then leaves
    toward the east.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Ne Hononhsot explains that the visitor is the one the Seneca call Endekha
    Gaahgwa, that it is night on earth, and that he is hurrying east; he also says
    the visitor reported a great battle that had ended.
  category: speech
  evidence_refs:
  - ev:9
