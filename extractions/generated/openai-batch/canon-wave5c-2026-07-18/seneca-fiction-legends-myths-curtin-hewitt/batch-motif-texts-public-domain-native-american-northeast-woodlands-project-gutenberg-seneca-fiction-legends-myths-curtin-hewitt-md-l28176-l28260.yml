canonical_text:
  quote: ''
  summary: Dehaenhyowens and his companions seek an elder who may recognize them.
    The elder recounts how thirty young men once organized a sworn war party, publicly
    announced their oath, and departed westward along the path of the Sun toward the
    place of sunset. After the elder is convinced of the returnees' identity, the
    current chief convenes a public assembly. Dehaenhyowens names the three survivors,
    says one member remained in skyland, and begins a full account of the expedition.
  language: English
  quote_policy: summarized
