canonical_text:
  quote: ''
  summary: A woman escapes from a lodge with her baby after her husband warns her;
    dogs report the husband has been killed and urge her to flee. She hides with the
    child in a hemlock while three bloody hunters pass beneath. Returning home, she
    tells the community; an old man stages a dance, reveals her testimony, and the
    accused men are killed by warriors. A new episode begins about a destitute orphan
    boy who claims to see Hinon in the clouds, obtains a red willow bow and arrow,
    shoots into the clouds during a storm, and later pulls the arrow from the ground,
    revealing a small feather-adorned dead body.
  language: English
  quote_policy: summarized
