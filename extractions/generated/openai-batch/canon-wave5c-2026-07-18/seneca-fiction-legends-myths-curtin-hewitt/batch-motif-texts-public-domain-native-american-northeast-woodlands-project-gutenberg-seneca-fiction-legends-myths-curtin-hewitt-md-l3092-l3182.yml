canonical_text:
  quote: ''
  summary: The passage contains the end of one pursuit tale in which a man-eater follows
    a fugitive who uses moving moccasins, a cord-maker disguise, and a tree transformation
    before escaping when the man-eater eats a dead body. A bracketed note identifies
    the fugitive as a rabbit and the man-eater as a fox. The next tale describes a
    boy who feeds a two-headed snake until it becomes enormous, eats his sister and
    many villagers, and is later killed by a surviving man using dream-prescribed
    arrows prepared with his sister’s hair and menstrual blood. The passage then begins
    another tale about four warriors on a hunting expedition by canoe, described as
    inventors of bark canoes.
  language: English
  quote_policy: summarized
