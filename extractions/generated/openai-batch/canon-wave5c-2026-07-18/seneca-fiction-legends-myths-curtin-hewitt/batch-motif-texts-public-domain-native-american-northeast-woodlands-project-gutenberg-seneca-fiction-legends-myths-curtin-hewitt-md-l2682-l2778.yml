canonical_text:
  quote: ''
  summary: The supplied passage first recounts a young chief's son-in-law who produces
    wampum after marriage, succeeds in hunting with Crow's aid, is magically sunk
    into the ground by jealous hunters, and is rescued by Crow and Turkey. The chief
    then relocates with good people to the son-in-law's grandfather's lodge. A second
    narrative begins with an early-rising boy meeting two Djogeon by a river; they
    warn of underground buffaloes full of witchcraft, later reporting that two were
    killed and one escaped west. The passage then follows a Seneca fast runner, sole
    survivor of a failed war party, who encounters a man-eating Ganiagwaihegowa in
    a hollow elm and escapes while the creature sinks in a deer lick.
  language: English
