canonical_text:
  quote: ''
  summary: In a lodge, a youth insists that a dream command be fulfilled exactly.
    His singing causes flames to rise around his old uncle until the uncle surrenders
    a very small woman kept in a bark case under his bed. The youth wraps the woman,
    identified as his sister, in furs and carries her away. He then consults another
    uncle associated with a skull protruding from the ground, who warns him about
    a coming evil dream, firebrands, a war club, and a bark-sledge ordeal. The next
    morning the old uncle prepares the bark sledge and binds the youth in stripped
    bark.
  language: English
  quote_policy: summarized
