canonical_text:
  quote: ''
  summary: A young man secretly meets the youngest of seven sisters while the sisters
    gather huckleberries. The youngest sister falls in love with him and repeatedly
    meets him despite her sisters' anger. The sisters detect her contact with him
    by the odor of a man, threaten to bar her from their lodge, and finally cast her
    out. She chooses the young man as her husband, hides a bundle of belongings in
    preparation, and leaves weeping after being denied entry to the lodge.
  language: English
  quote_policy: summarized
