canonical_text:
  quote: ''
  summary: Hahadodagwat'ha tries repeatedly to make a man clinging to his back dismount.
    Failed attempts include ordering him down, rubbing against a hickory tree, and
    lying near a large fire. Remembering a small black dog in his bosom, Hahadodagwat'ha
    strikes it with a red-willow rod until it grows to enormous size; the dog pulls
    off and kills the clinging man. Hahadodagwat'ha thanks the dog for saving him.
    The two travel homeward, hunt and eat together, and reach a lodge where a red-haired
    man and the young man's younger sister are found. The dog is identified as a returned
    lost brother, and the group makes a compact to live as one family. The passage
    then begins a new story about a boy who hunts birds and rests beside a large rock
    near sunset.
  language: English
  quote_policy: summarized
