canonical_text:
  quote: ''
  summary: A younger boy's elder brother is taken west by two women in a canoe. The
    younger boy uses red-willow bark thrown into fire to travel in smoke, overtakes
    the canoe, and compels it to return. The women bargain for the elder brother,
    and the boy receives body-part moccasins that give him power. He later travels
    west again, meets a nearly identical boy who becomes his brother, and learns from
    a grandmother that the chief's daughters have brought a man from the east whose
    tears become wampum when he is hung up and made to cry.
  language: English
  quote_policy: summarized
