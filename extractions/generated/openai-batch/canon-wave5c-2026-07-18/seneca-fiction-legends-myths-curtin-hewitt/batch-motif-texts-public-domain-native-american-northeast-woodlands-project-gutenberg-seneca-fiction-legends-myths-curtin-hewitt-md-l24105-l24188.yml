canonical_text:
  quote: ''
  summary: An aged chief and a young hunter attend a council in the Long-lodge, where
    the Fire-keeper chief formally opens and closes the council fire and gives thanks
    to the Master of Life. After the council, the young hunter leaves quickly, is
    pursued through the night by four young women, and escapes into a raised hut by
    drawing up a tree ladder. At daybreak he sees four female rattlesnakes where the
    women had been. Returning to his hosts, he sees the aged host in rattlesnake form
    while the old woman has resumed human form, then washes and joins the morning
    meal.
  language: English
  quote_policy: summarized
