canonical_text:
  quote: ''
  summary: The passage first describes a hierarchy of birds and an assembly of bird
    and animal sorcerers who use medicine, singing, and ritual instructions to restore
    a killed man to life and transmit healing practice to his people. It then begins
    the tale of the Seven Stars of the Dipper, in which six hunters pursue a bear,
    rise into the sky without noticing, and remain visible as stars near the Polar
    Star, with the kettle and bear also identified among the stars.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bird named S^hadahgeah is described as dwelling above the clouds and mists
    and as chief of all birds.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The assembly of bird and animal sorcerers chooses the chief of the crows to
    notify S^hadahgeah, and the passage links this to the crow's present-day caw.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The eagle is described as another chief under the great bird above the clouds
    and mists.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: When trees and plants put forth green leaves and buds, the presiding chief
    says the singing has been enough and that the medicine will act.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chickadee is chosen to put the medicine into the dead man's body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The chickadee drinks the medicine, enters the man's mouth and stomach, and
    releases the medicine there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Other birds and beasts rub the dead man's body with medicine while the chickadee
    acts inside the body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The birds and beasts sing for two days and two nights until the man's body
    becomes warm again and he comes to life.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After resuscitation the man hears the singing and sounds around him and understands
    the words of the sorcerers' chants.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The chief gives the medicine to the man and his people for healing injuries
    caused by falls, blows, or arrows.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The chief instructs that the medicine be renewed by feasts, burned tobacco,
    and words inviting birds and beasts to share the tobacco smell.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The birds and beasts teach the man how to use the medicine and songs, then
    send him home to inform his people through their appointed authorities.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The people had believed the man dead, gather around him on his return, and
    ask how he has returned alive.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The man says birds and animals made the medicine that brought him back to
    life in return for the kindness he had shown them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The man selects wise and experienced men, teaches them the medicine's use,
    and entrusts its preservation to them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The man warns that the songs must not be treated lightly, because they possess
    great orenda and could bring misfortune if disrespected.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: Six hunters go far from home, find no game for a long time, and one man claims
    sickness though the passage says he is lazy.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: Four men carry the supposedly sick man on a litter, while a sixth man follows
    carrying a kettle.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: When the hunters find a bear track, they drop the sick companion and their
    burdens and run after the bear.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: The formerly carried man follows, overtakes the others, and kills the bear.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:21
  text: The hunters do not notice they are going upward; people see them rising in
    the air, and they reach the heavens.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:22
  text: The hunters remain visible near the Polar Star, with the kettle-carrier, kettle,
    and bear identified as particular stars of or near the Great Dipper.
  category: setting
