canonical_text:
  quote: ''
  summary: 'Editorial notes identify motifs and interpretive details in a Seneca/Iroquoian
    mythic context: a Whirlwind son marrying a human woman; malign and beneficent
    Whirlwind aspects; cannibalistic devices; common incidents such as a robe of eyes
    and animal metamorphosis; guardians on the path to the Lodge of the Seven Sisters
    and to the Land of Souls; possible modernity of a wampum belt reference; sorcerers,
    witches, concealed death-immunity devices, Thunder Man eating serpents, named
    animals and beings, and a belief distinguishing animal life from fleshly body.'
  language: English
  quote_policy: summarized
