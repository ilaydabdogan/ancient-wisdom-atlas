canonical_text:
  quote: ''
  summary: An old uncle directs his young nephew to divide seed corn, beans, and squash
    seed into ten small baskets and plant them in clearings. While the nephew plants,
    the uncle twice sings that he has arisen; after the second time the roots holding
    him down break, and he disappears westward. The nephew follows his tracks for
    three days to a lake, where a canoe approaches, moved by twelve wild geese under
    the command of a man-like occupant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old man tells the youth to bring a basket from under the couch containing
    seed corn; beans for seed and squash seed are with it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man requests ten small baskets and places several kinds of seeds in
    them, making them into a basket girdle for the nephew's body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old man sends the young nephew to plant the seeds in clearings where logs
    lie one on top of another.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Before leaving, the nephew places beside his uncle a bark dish of hominy,
    a fire poker, a knife, and a cake of boiled corn bread.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the clearings, the nephew prepares the ground and plants a number of hills.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The nephew hears his uncle sing that he believes he has arisen, runs back
    to the lodge, seizes him, and restrains him from arising.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The uncle says he sang because he was thirsty; the nephew gives him water
    and tells him to lie quiet, and the uncle sends him back to plant seeds dropped
    from the baskets.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the second planting, the nephew hears the same song again, then hears
    a loud report caused by roots breaking; when he reaches the lodge, the uncle is
    absent.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The nephew mourns, examines the ground around the lodge, finds deep tracks,
    and learns that his uncle went directly westward.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The nephew takes his bow and arrows and follows his uncle's trail through
    forests for three days to the shore of a lake, where the visible trail ends.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A canoe approaches the nephew; it contains what appears to be a man and is
    propelled by six wild geese attached to each side.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The canoe occupant calls the geese his servants, tells them to seek food,
    and the geese obey by flying upward.
  category: speech
  evidence_refs:
  - ev:8
