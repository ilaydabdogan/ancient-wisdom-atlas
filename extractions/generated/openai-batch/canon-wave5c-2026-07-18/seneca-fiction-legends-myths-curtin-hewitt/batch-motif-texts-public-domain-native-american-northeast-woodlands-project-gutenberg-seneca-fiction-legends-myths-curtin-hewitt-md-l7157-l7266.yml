canonical_text:
  quote: ''
  summary: 'The passage first closes a preceding episode in which a young man restores
    his father, sister, and dog by spitting on his hands and rubbing them, then returns
    home. It then begins the tale of Dagwanoentent, Daughter of the Wind: a nephew
    lives with an uncle who withholds food, forbids him to go north, and secretly
    makes expanding chestnut pudding in a pot. The nephew learns the process, goes
    north, finds a Long Lodge containing meat, bear oil, a silent woman, and a boy,
    and repeatedly visits there. The boy later reveals that he and the nephew are
    cousins, that the uncle is his father, and that the silent woman is his mother.
    The nephew shoots a bag of bear oil so that oil falls on the woman; the uncle
    fears that the woman is an unkillable witch. The nephew then makes a great pot
    of pudding swell until it fills the lodge. After further warnings from the uncle,
    a destructive storm comes with the woman in its midst; she tears up the lodge
    and carries away the uncle while the nephew hides. At the Long Lodge, the cousin
    says the woman returned without the father and will come for the nephew the next
    morning.'
  language: English
  quote_policy: summarized
