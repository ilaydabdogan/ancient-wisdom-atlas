- id: motif:2
  label: stolen girl intended for forced marriage
  taxonomy_refs:
  - stolen_beloved
  basis: The Djogeon woman states that the Ganiagwaihegowa stole a young boy and girl
    and wanted the girl to marry her son.
  evidence_refs:
