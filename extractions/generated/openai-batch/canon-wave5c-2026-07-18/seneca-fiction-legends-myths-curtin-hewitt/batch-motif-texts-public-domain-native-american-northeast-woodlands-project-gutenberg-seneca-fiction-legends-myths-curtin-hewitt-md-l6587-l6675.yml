- id: motif:3
  label: monster destroyed and prevented from reviving
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: After killing the Ganiagwaihegowa, the boys burn her bones to powder so that
    she cannot come to life again.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage presents prevention of revival, not an actual resurrection.
- id: motif:4
  label: power transferred through a bodily token
  taxonomy_refs:
  - sacred_theft
  basis: A companion cuts off the dead boy's yellow hair tuft, fastens it to his own
    head, and gains the arrow-returning orenda held in the tuft.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage says the tuft was taken after the boy was killed but does
    not elaborate on the moral status of the act.
- id: motif:5
  label: tiny miraculous child survives abandonment
  taxonomy_refs:
  - miraculous_child
  basis: The newborn is no longer than one's hand, is placed in a hollow tree because
    the father thinks he cannot live, yet survives, feeds, grows stronger, and emerges.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage segment stops before the child's later potency is shown.
