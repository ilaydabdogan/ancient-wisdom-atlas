canonical_text:
  quote: ''
  summary: 'The passage continues a tale in which a pursuing Ganiagwaihegowa woman
    is delayed by helpers, trapped at a Djogeon lodge with boiling bear oil and red-willow
    arrows, killed, and burned so she cannot revive. The siblings she had stolen are
    guided home. A note then describes a yellow hair tuft containing orenda that gives
    arrows the power to return home. A new tale begins: a tiny newborn boy, thought
    unable to live, is placed in a hollow tree after his mother dies; his older brother
    feeds and clothes him, and their father later turns himself into an old stump
    full of mice to catch the timid child.'
  language: English
  quote_policy: summarized
