canonical_text:
  quote: ''
  summary: The passage argues for the comparative study and preservation of Indigenous
    and other ethnic religious systems as evidence for the history of the human mind.
    It describes ethnic religion as belonging to a people of shared blood and language,
    under the care of their gods, from whom they believe they received knowledge,
    customs, and practices. It discusses divine transformation traditions, including
    first people becoming plants or animals, maize as a transformed god who gives
    himself as food to save humans, and a harmful old personage transformed by a hero
    into wild parsnip.
  language: English
  quote_policy: summarized
