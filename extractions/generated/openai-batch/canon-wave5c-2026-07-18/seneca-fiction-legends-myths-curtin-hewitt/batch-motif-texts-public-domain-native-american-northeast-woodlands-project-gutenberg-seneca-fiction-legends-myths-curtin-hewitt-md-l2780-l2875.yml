canonical_text:
  quote: ''
  summary: A hungry and exhausted man receives help from a man who directs him twice
    to a fire and kettle of food, warning him not to give any portion to surrounding
    beggars. After obeying, he is told he will reach home safely and discovers the
    helper is S^hagodiyoweqgowa. He regains strength through hunting, later encounters
    two women who arrange his marriage to the younger woman, and goes to their village.
    A drum summons the people to a dance led by the little Buffalo, a jealous chief
    with two wives. After the man speaks to the Buffalo Man's wives despite warning,
    the Buffalo Man challenges him to a lethal foot-race around the hill.
  language: English
  quote_policy: summarized
