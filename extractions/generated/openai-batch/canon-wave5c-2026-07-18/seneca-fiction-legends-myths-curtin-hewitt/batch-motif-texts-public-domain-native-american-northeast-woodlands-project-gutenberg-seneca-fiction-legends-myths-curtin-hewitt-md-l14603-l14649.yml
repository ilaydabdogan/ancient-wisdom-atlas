canonical_text:
  quote: ''
  summary: A young man dreams that his party will meet a larger enemy force at noon,
    including a very large man with great magic power, and that they should hang up
    their bundles before fighting. The next day a speaking bear appears and disappears,
    after which the party encounters the enemy. The young man orders the bundles hung
    on a tree, recognizes the large enemy by his medicine-shield, and fights him in
    single combat. He disarms, throws down, and kills the large man; the enemy flees,
    many are killed, and none of the young man's twenty men are injured.
  language: English
  quote_policy: summarized
