canonical_text:
  quote: ''
  summary: A fragment in which two sisters flee from Doonongaes after the elder says
    she has been overpowered by his orenda. The younger uses a flint knife, retrieves
    a strip of Djainosgowa's skin described as a container of magic power, and the
    sisters escape from Doonongaes' tail. Doonongaes pursues them, then encounters
    the old man Gwidogwido, grandfather of the women, and fights him through forest
    and village. Village people called Djihonsdonqgwen kill Gwidogwido, while Doonongaes
    escapes and reaches another lodge.
  language: English
  quote_policy: summarized
