canonical_text:
  quote: ''
  summary: The passage ends a tale in which a boy joins his thunder-associated father
    and thereafter thunders with a young man's sharp voice. It then recounts a Crawfish
    settlement whose chief finds an apparently dead enemy; the Crawfish gather, dance,
    and are eaten when the enemy rises as part of a ruse. A longer tale follows in
    which a fat old man, later identified as a mud turtle, misleads a slim young man,
    later identified as a fox transformed into a bear, with false methods for getting
    fat; the young man loses his tail in ice, is changed, and is later defeated and
    beheaded in a rigged race. The passage closes with the beginning of another tale
    about a man, his wife, and daughter hunting in a distant region.
  language: English
  quote_policy: summarized
