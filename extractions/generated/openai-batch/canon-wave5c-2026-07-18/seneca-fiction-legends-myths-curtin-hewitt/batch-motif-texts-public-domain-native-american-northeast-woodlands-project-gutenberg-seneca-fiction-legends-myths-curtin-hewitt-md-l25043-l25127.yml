canonical_text:
  quote: ''
  summary: At sunset a young wife in a lodge hears someone approaching and sees a
    very large woman carrying an unusually large child. The visitor reassures her,
    sits on the opposite side of the fire, and later refuses ordinary food. When the
    husband returns with a deer, he gives the visitor raw venison, which she eats.
    The next morning she gives her child to the hunter, saying it is his own and that
    she came so he could look at it; he reluctantly accepts the child, then returns
    it and leaves to hunt.
  language: English
  quote_policy: summarized
