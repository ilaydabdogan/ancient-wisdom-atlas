canonical_text:
  quote: ''
  summary: 'A council debates whether to seek peace with enemies. A leading chief
    recommends burying weapons and sending two ambassadors. Two volunteers are instructed
    to approach unarmed and without face paint. They prepare to depart at night, discussing
    their orenda and the animal forms or manners in which they travel: one as a night
    owl and the other as a fox.'
  language: English
  quote_policy: summarized
