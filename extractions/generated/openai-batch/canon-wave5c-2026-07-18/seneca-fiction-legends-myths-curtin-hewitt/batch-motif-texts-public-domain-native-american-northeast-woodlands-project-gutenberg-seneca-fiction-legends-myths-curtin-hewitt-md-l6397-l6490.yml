canonical_text:
  quote: ''
  summary: The passage first concludes an episode in which a young man pursues his
    cousin who has become a Ganiagwaihe, is deprived of food when corn flour becomes
    ants, and spares the being after it promises to leave and stop harming the people.
    It then begins a tale in which a man murders his friend, hides the body under
    a fireplace, impersonates the dead man, sends his sister away inside an arrow,
    and the murdered man speaks from the fire to his mother, who finds the body, becomes
    a Ganiagwaihegowa, and follows the fugitives' tracks eastward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man goes to the pond with parched corn, new moccasins, a bow, and
    twelve arrows to try to kill the Ganiagwaihe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night the Ganiagwaihe appears to the young man in a dream in the form of
    a man and proposes that the young man pursue it at daylight.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the pursuit the young man sees the Ganiagwaihe's tracks and later finds
    that his corn flour has become ants; the passage states that the Ganiagwaihe caused
    this to deprive him of food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ganiagwaihe asks to be spared and promises to leave that part of the country
    forever and not injure the people anymore; the young man agrees if it is sincere.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young man returns home and tells the people they may fish in the pond
    without trouble; the Ganiagwaihe keeps its word.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: An old woman and her son live in one lodge, while a brother and sister live
    in another; the son and the brother are similar in height and appearance and are
    close friends.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The brother learns that his friend hopes eventually to marry his young sister,
    becomes displeased, kills the friend, buries the body in a deep hole under the
    fireplace, covers it with earth, and rebuilds the fire.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: When the mother searches for her son, the murderer says the son left for home,
    then goes to her lodge and impersonates her son closely enough that she does not
    detect the difference in voice.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The brother tells his sister there is impending danger and instructs her to
    go to the spring, leave her pail, make many trails in all directions, and return
    to the lodge.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The brother shakes his sister until she becomes very small, places her inside
    the cavity of an arrowhead, and shoots the arrow east through the smoke-hole;
    when it strikes a stone, the arrow bursts and the girl comes out and runs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The brother makes many tracks around the lodge, climbs through the smoke-hole
    to the roof, sees the long trail made by the arrow through the air, runs under
    it, and then follows his sister's tracks.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The old woman sits by the fire in the neighboring lodge and hears a voice
    from the flames saying that the speaker's friend killed him.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The mother digs under the hearth, finds her son's body, returns home, becomes
    a Ganiagwaihegowa, and follows the girl's tracks to the spring, back to the lodge,
    and then along the arrow trail toward the east.
  category: sequence
  evidence_refs:
  - ev:10
