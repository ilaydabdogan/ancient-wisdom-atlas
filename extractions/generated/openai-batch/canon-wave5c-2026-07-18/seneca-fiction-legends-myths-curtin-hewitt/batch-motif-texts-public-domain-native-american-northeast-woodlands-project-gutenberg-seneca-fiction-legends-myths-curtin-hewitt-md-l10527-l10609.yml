canonical_text:
  quote: ''
  summary: Two transformed young men return to their people, identify themselves as
    formerly despised youths who disappeared, report journeys to other worlds and
    to Hawenniyo, teach social and ritual rules, and then continue traveling among
    villages. Later, after traveling south of a hemlock tree and camping to hunt,
    one of them encounters a strange youthful being who calls him grandson and leads
    him to a rock-opening lodge below a cliff, where an old man warns that a powerful
    devouring enemy is approaching.
  language: English
  quote_policy: summarized
