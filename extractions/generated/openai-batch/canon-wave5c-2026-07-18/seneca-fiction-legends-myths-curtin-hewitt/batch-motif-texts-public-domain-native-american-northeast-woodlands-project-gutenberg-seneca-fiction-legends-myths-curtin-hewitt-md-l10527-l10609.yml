  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: One young man is to sing songs heard in the upper world, and the other is
    to teach the people how to dance to the songs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The second transformed young man becomes Hadent'heni, the Speaker, and the
