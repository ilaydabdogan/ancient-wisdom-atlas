  text: The people do not recognize the two young men and regard them as a different
    kind of people.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two young men ask whether two young men were lost from the old village,
    and an old woman says two despised and shunned young men disappeared.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: One transformed young man identifies the pair as the two who disappeared and
    says they went to the other world and the southern world before returning with
    a guide to their starting place.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young men criticize the abandonment of homeless children and propose that
    orphaned children should not be forsaken.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The men tell the assembly that they visited the Long Lodge, saw Hawenniyo,
    and were instructed to describe what they had seen to friends in the lower world.
  category: speech
  evidence_refs:
  - ev:3
