canonical_text:
  quote: ''
  summary: The passage first concludes an episode in which black wolves kill a great
    white deer and a man, while the man's grandmother sees a red western sky as an
    evil sign and later finds only bloody deerskin at the death site. It then gives
    the tale of a young hunter warned by his mother not to go northeast, where an
    evil woman magically squeezes hearts. After he is afflicted, a ritual dance of
    naked persons directed by an old man relieves him. The young man later uses a
    mole to approach the woman unseen, enters her body, squeezes her heart, and kills
    her during a similar ritual. The passage ends by beginning a separate tale in
    which a man challenges Hot'ho, the Wind God, about whether Hot'ho can make him
    freeze.
  language: English
  quote_policy: summarized
