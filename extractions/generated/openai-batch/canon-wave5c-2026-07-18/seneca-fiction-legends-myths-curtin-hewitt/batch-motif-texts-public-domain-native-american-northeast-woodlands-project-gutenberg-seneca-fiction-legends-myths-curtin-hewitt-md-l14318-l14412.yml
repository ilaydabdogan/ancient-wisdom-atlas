    Tsodiqgwadon sent him, and receives agreement that those people will attend the
    council.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Gainhdoya Tgawenot, five fishing men throw reeds at Haiwanenqgwi to bewitch,
