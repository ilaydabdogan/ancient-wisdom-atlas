canonical_text:
  quote: ''
  summary: Haiwanenqgwi carries Tsodiqgwadon's summons to a council at Broken Land.
    He visits distant peoples, survives an attack by fishermen using reeds, receives
    an orenda-bearing substance from Tsodiqgwadon, ascends to the Land in the Blue
    Sky, walks or passes through the air, and invites sky and cloud dwellers, including
    seven Hinon men, an old man at the Blue Sky door, and a light-giving runner.
  language: English
  quote_policy: summarized
