  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: With the substance in his mouth, Haiwanenqgwi mounts upward, reaches the Land
    in the Blue Sky, and says he came from below by walking on the air.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Westward through the air, Haiwanenqgwi enters a lodge on a cloud where seven
    Hinon men are smoking and the lodge is filled with smoke.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: At the middle of the Blue Sky there is a door; beyond it Haiwanenqgwi meets
