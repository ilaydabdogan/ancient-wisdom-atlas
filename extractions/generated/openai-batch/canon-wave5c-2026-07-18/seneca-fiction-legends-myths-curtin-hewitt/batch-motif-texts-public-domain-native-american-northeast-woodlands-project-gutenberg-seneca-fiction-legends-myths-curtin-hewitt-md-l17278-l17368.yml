canonical_text:
  quote: ''
  summary: 'Okteondon''s magic power animates bones into living men, who are sent
    home. Okteondon then returns with his wife and two friends to his uncle Haient''hwus,
    whose wampum belt had indicated the nephew''s danger or death and now hangs high.
    A second version begins: Okteondon is rooted beside a tall elm near Haient''hwus''s
    lodge. Haient''hwus feeds him, performs powerful work heard far away, and twice
    rushes home when Okteondon sings that he is rising, losing seeds or bark on the
    way, then giving Okteondon water and straightening the tree.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Okteondon's great orenda causes bones to spring up as living men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Okteondon tells the revived men that they have come to life and may go to
    their homes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Okteondon goes to the lodge of his uncle Haient'hwus with his wife and two
    friends.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Haient'hwus had hung a wampum belt in the lodge; its position was said to
    lower as Okteondon's trouble deepened, touch the ground if he died, and hang high
    again at this time.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Because others had pretended to be Okteondon, Haient'hwus tests the returning
    visitor by asking him to put an arm through the door opening and tying it before
    opening the door-flap.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Haient'hwus recognizes Okteondon with his wife and two friends, expresses
    delight, and cleans ashes and dirt inside the lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The second version places Okteondon and Haient'hwus in the forest, with a
    large tall elm beside the lodge and roots that grow over and around Okteondon's
    body, binding him to the ground.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Haient'hwus is fond of Okteondon and brings him food and drink, including
    venison, squashes, berries, fish, shellfish, and cornbread.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Haient'hwus crushes corn to fine meal with a single pestle blow, and people
    far and near hear it and comment that he is well-to-do and strong.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: When Haient'hwus burns logs into pieces and brings or drags them home, the
    sound they make on the earth is heard far away and prompts the same comment about
    his prosperity and strength.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: During planting, Haient'hwus hears Okteondon singing that he is going to rise,
    drops his planting stick, forgets his seed baskets, and loses the seeds along
    the trail as he runs home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the planting interruption, Haient'hwus finds Okteondon resting on one
    elbow, the tree leaning and its roots starting from the ground; Okteondon says
    he is thirsty, so Haient'hwus gives him water and pushes the tree upright.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: During bark stripping for cords, Haient'hwus hears the rising song again,
    runs home with a bark bundle, loses the bark along the trail until only the strap
    ends remain, then gives Okteondon water and straightens the tree.
  category: sequence
  evidence_refs:
  - ev:7
