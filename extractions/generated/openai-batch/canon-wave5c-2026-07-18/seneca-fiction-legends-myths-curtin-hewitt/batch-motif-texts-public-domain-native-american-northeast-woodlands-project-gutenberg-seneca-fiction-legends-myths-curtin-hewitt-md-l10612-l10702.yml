canonical_text:
  quote: ''
  summary: An old helper instructs two young hunters to kill Ganiagwaihegowa by using
    basswood manikins, felled trees, and shots aimed at white spots in the creature's
    soles. The hunters kill it, cut off and burn parts of its body, and smoke its
    hide to prevent it from coming to life again. A helper people later thank them,
    warn of another enemy, and the hunters discover Stone Coats planning to attack
    and eat the inhabitants of their village.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old helper says to make basswood manikins, place them before the brush
    lodge with bows and arrows, fell trees in the path, and shoot the white spot in
    Ganiagwaihegowa's sole because its life is assailable only there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man and his friend make two basswood manikins and wait in the brush lodge
    until they hear Ganiagwaihegowa roaring.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The hunters try to stay leeward of Ganiagwaihegowa so that it will not scent
    them, and they decide they cannot flee because it might follow their trail to
    the village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ganiagwaihegowa appears frightful, roars, tears trees apart, and makes the
    men weak when it roars.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: As Ganiagwaihegowa crosses the logs, the two men shoot the white spots in
    the soles of its feet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After being wounded, Ganiagwaihegowa bites the manikins, tears the lodge to
    fragments, goes a little farther, and dies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The men cut off Ganiagwaihegowa's hind legs and feet; the body quivers, and
    its ribs are described as one solid bone rather than ordinary animal ribs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The men burn the hind quarters and bones to ashes and smoke the hide thoroughly
    because they have been told that remaining bone or an unsmoked hide could let
    Ganiagwaihegowa come to life again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A person of the Oadjiqsa people says the hunters saved all people, and says
    Hawenniyo gave the Oadjiqsa power to aid men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The helper warns that there is another enemy to conquer and says the young
    men will come to a river where they should camp and remain on guard.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the river camp, one young man hears loud speech, sees many people in a
    valley, and understands them to be Stone Coats planning to go to his village and
    eat the inhabitants.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The two men flee ahead of the Stone Coats; one runs to warn the village, while
    the Stone Coats approach with a thunder-like sound and their chief says they must
    reach the village the next day.
  category: sequence
  evidence_refs:
  - ev:7
