canonical_text:
  quote: ''
  summary: In a watery setting, animal people seek a caretaker and a place for a pregnant
    woman. Earth is brought from the water, fastened to Turtle's carapace, and grows
    into land. The woman's daughter later has children by a husband seen as a turtle;
    twin sons are born, with the younger emerging through the armpit and killing the
    mother. Corn grows from the mother's buried body, and the younger twin later animates
    earth and clay forms into animals and birds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Water Serpent offers to carry the woman seated between his horns; Loon rejects
    the offer because Water Serpent has too much evil orenda, which would kill her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Turtle says he can care for the woman if earth can be placed on his carapace;
    Loon and the other leaders accept this if earth can be obtained.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Many water folk dive into the water to obtain earth and die; Hell-diver eventually
    brings up a small quantity of earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Beaver mounts Turtle's back and uses his tail like a trowel to fasten earth
    on Turtle's carapace as Duck people bring earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The earth begins to grow; Fishhawk and his men bring down the woman and place
    her on the newly made earth on Turtle's carapace.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Beaver and Duck people continue enlarging the earth, and bushes begin to grow
    on it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The woman gives birth to a girl soon after her descent; the child grows rapidly
    to womanhood and takes over inspecting the island's growth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The daughter meets a fine-looking young man, and they decide to live together
    as husband and wife; the passage says Day and Night came into the world by this
    union.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: After looking back when parting from her husband, the daughter sees a large
    turtle where she expected him to be and concludes that a turtle was deceiving
    her; afterward she remains at home and is seen to be pregnant.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The unborn children converse about how to leave their mother's body; one proposes
    the armpit route, and another says that would kill their mother.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: One child is born naturally; the other exits through the armpit on the third
    attempt, the mother dies immediately, and the child has a rough flint-shaped head
    and must be drawn out by the grandmother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Before the twins' birth, their mother foretells that she will die, should
    be buried, and that white and red corn stalks will grow from her breasts for the
    children; after burial the stalks appear.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The younger boy is described as awkward, ugly, disagreeable, ill-tempered,
    and often striking his brother in anger.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: The younger boy forms a grasshopper from earth and makes it jump by blowing
    on it; he then makes a red-clay bird, identified as the first land bird, and afterward
    makes the birds of the air.
  category: action
  evidence_refs:
  - ev:8
