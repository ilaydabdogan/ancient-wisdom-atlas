canonical_text:
  quote: ''
  summary: Gaqga encounters several camps and households. He eats children in two
    lodges, is beaten away by Ganogeshegea people, loses his camp, steals meat from
    four hunter brothers after wishing them asleep, and later has the stolen meat
    recovered by the hunters after a dream points them to him. He deceives another
    set of parents after eating their children. He then joins his own people at a
    dance, where Hanisheonon the Muckworm kills many until Gaqga follows him, is seized,
    and calls his people, who peck Hanisheonon to death. The passage then begins a
    new tale about two sisters living near a village clearing with their widowed mother,
    who uses deer droppings as a meat substitute and urges one daughter to marry the
    chief’s son for better provision.
  language: English
  quote_policy: summarized
