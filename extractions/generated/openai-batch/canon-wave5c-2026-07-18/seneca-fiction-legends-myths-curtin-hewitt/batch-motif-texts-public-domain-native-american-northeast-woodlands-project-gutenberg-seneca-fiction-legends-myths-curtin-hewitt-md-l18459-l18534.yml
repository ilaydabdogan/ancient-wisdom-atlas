canonical_text:
  quote: ''
  summary: A lad is taught by his grandfather how to hunt and prepare game, progresses
    from Ohsoon to Neogen and bear, is warned not to hunt eastward because wicked
    women dwell there, disobeys by turning east, encounters a raccoon-filled hollow
    tree and a beautiful young woman, escapes by changing into a red-headed woodpecker
    and sending an arrow as a decoy, then returns home and is warned again by his
    grandfather.
  language: ''
  quote_policy: summarized
