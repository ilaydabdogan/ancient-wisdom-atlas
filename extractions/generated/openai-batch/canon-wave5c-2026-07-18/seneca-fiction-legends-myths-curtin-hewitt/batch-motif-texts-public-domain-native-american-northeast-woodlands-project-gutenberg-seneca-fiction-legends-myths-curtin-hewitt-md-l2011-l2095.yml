canonical_text:
  quote: ''
  summary: A boy identified as Odegwiyo uses a mole to pass underground to a tree
    where a woman's dried skin hangs, bargains with the skin using a simulated wampum
    belt, and then secretly enters the lodge of the Mother and Seven Sisters. A voice
    from the fire reveals his presence, but the pursuers fail to find him after the
    dried skin gives contradictory songs. The boy takes tobacco from the lodge and
    escapes. The passage then begins another tale, in which Djogeon hunts, is lulled
    to sleep by a woman, carried away in a basket, and taken across a lake in a magically
    enlarged canoe toward the woman's family lodge.
  language: English
  quote_policy: summarized
