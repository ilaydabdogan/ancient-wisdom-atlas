canonical_text:
  quote: ''
  summary: The passage contains the close of one narrative and the opening of another.
    In the first, an uncle mourns a presumed-dead nephew and is repeatedly deceived
    by animal-form callers. The nephew/lad completes a task to kill a magical black
    eagle on a great tree, burns the old woman and others in fiery revenge, rescues
    kin from near a ravine, and is finally recognized by his mourning uncle. In the
    next narrative, Hadjowiski lives poorly with his wife and seven children; the
    smallest child, Deoyadastat'he, stays under a bed with a dog that is a flea. Hadjowiski's
    wife suspects him of hiding game and follows him, seeing him kill a large bear
    with a small stone.
  language: English
  quote_policy: summarized
