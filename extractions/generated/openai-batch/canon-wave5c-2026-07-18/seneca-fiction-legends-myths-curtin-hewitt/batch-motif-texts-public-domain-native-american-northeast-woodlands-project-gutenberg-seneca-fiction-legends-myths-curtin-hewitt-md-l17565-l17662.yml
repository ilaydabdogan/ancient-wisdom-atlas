  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The youth finds two of his brothers among those he has rescued, and the rescued
    men are described as related to one another as brothers or cousins.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The youth and his brothers approach the old uncle's lodge and hear the uncle
    weeping and singing that he will mourn for ten summers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The uncle initially refuses entry because of prior animal-form deceptions,
