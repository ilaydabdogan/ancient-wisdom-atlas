    in the heart.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The black eagle is identified as the old woman's third brother and as a being
    that had fed on men thrown into the ravine.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The lad takes his wife outside and commands the lodge to become flinty and
