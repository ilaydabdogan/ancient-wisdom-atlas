  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old woman asks the son-in-law for pity, but he refuses and says those
    inside should burn up.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Near the ravine, the lad presents a woman as the one who threw the men from
