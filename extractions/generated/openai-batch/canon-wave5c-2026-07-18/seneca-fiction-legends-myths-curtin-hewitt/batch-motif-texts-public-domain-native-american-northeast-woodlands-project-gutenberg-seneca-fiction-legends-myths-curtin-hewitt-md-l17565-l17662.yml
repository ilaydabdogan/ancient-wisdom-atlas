- id: obs:3
  text: After dreaming, the old woman says her son-in-law must kill the bird on the
    top of the great tree.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mother-in-law warns that if the son-in-law returns after the slammed door
    stops swinging, something strange will happen; he ties a hair to the door before
    running away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The son-in-law finds a black eagle at the top of a tall tree; the first arrow
