- id: obs:2
  text: At night the uncle repeatedly hears a rap and a voice saying the nephew has
    come, but on going to the door he finds a fox or an owl; later he says wizards
    in animal form have deceived him.
  category: sequence
  evidence_refs:
  - ev:1
