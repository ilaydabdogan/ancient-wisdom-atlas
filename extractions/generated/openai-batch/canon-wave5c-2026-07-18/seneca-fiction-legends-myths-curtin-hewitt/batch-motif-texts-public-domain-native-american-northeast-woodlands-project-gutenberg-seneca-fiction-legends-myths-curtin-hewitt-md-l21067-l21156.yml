canonical_text:
  quote: ''
  summary: A man is warned by a visiting helper that an envious monster will attack
    him. Following instructions, he goes to a rocky hill, is chased by a monster bear,
    and survives when the bear falls short and a rock crushes it. Later the same friend
    warns that the man and his wife are again in danger. He instructs the man to transform
    his wife into Os'hada, send her away, and flee south when necessary. The man performs
    the transformation, gives meat to flesh-eating woodland animals, climbs an elm
    tree, uses a tooth from Gaasyendiet'ha to see underground, and sees a Djainosgowa
    monster climbing through a subterranean tree toward him. The passage ends as the
    man leaps to another tree.
  language: English with Seneca terms
  quote_policy: summarized
