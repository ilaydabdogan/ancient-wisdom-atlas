  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hodadenon climbed a ladder to the upper room or attic and found Hadjisgwas
    lying there; Hadjisgwas ate the mush, breathed out, rubbed his limbs, and began
    to sing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When Hadjisgwas called for tobacco, Yenyent'hwus prepared a pipe with tobacco
