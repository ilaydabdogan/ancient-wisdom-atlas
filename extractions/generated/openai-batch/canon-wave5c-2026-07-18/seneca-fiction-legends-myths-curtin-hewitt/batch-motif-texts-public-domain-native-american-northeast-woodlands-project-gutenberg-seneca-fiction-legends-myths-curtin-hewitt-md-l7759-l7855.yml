canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which two transformed warriors
    use all their orenda against an enchanted rock, after which the old man who transformed
    them appears carrying the head of an enormous horned snake, and the warriors declare
    the snake dead. A new episode begins: Hodadenon lives in a bark lodge with his
    elder sister Yenyent''hwus, who keeps him inside while she plants. A hidden, ailing
    brother, Hadjisgwas, lies in the upper room and is fed chestnut mush and given
    tobacco. The sister’s small amount of chestnut meal and tobacco produces strengthening
    effects when prepared properly. While she is away, Hodadenon imitates her but
    uses all the chestnut and tobacco; Yenyent''hwus says this has endangered their
    brother.'
  language: English
  quote_policy: summarized
