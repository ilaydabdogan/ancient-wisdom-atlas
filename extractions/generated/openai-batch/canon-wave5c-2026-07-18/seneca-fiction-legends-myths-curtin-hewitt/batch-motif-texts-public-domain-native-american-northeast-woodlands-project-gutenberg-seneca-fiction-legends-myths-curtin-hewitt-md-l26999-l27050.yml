  summary: An old man wraps his nephew Gadjis'dodo' in a bark sledge during severe
    winter weather, drags him around a lodge while singing, and repeatedly asks whether
    he is alive. After nine circuits the youth feigns weakness; after the tenth, required
    by the old man's dream word, he answers strongly. The old man releases him and
    says the dream command has been fulfilled.
