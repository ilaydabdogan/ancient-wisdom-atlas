canonical_text:
  quote: ''
  summary: 'Editorial notes explain Seneca and Iroquoian terms and story motifs: human-like
    personifications and deities, ceremonial or story-language terms, a cannibalistic
    song reference, sorcerers’ protective pipe-smoking, an enchanted lake charged
    with orenda, several mythic monsters and snakes, reptile renewal, and the recurring
    pattern of sorcerers resuming their true natures when cornered.'
  language: English with Seneca terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes state that Seneca and other Iroquoian peoples apply the term for
    “man” or “human being” both to ordinary humans and to personified phenomena of
    nature and life that take human form and faculties.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The notes state that deities are classified with the human race of beings
    in this terminology.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:3
  text: A song gloss is given as meaning that a game animal has come in to visit,
    with the note identifying this as a cannibalistic reference.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Reputed sorcerers are described as smoking tobacco prepared with magic herbs
    to gain immunity from spells or enchantment in the presence of strangers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A lake is described as charged with magic power or orenda to defend its owner
