canonical_text:
  quote: ''
  summary: A lone orphan hunter is aided by a woman who lives with him as wife and
    helps him achieve exceptional hunting success. She instructs him to reject village
    marriage offers and return alone the next year, but he marries the chief's daughter
    out of fear. When he returns to the meeting lodge, the woman says he disobeyed,
    disappears, and his hunting luck ends; she is identified as a ghost woman. A new
    episode then begins in which Hahnowa, the Turtle, sets out by canoe on the warpath,
    sings as he travels, and tests would-be companions by requiring them to run to
    a mountain and back, rejecting Elk but accepting Sonon and Kahelxla.
  language: English
  quote_policy: summarized
