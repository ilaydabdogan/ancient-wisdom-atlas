canonical_text:
  quote: ''
  summary: White Pigeon, appearing as a man, makes a final visit to an old man and
    states that human death will continue because people disobeyed rules proclaimed
    by the Pigeon people, including rules against killing white pigeons and for hunting
    pigeons. The community remains divided about observing these rules. An Eagle stranger
    takes the old man to the mountaintop land of the Eagle people, where he lives
    for years. A Crow man leads a disbeliever to that land; the Eagle people reject
    him and a warrior throws him onto the moon, where he remains. Later the Eagle
    people reject the old chief Wild Cat and roll him down the mountain; at the bottom
    he becomes a wolf and lives among the Wolf people in a swamp. After conflicts,
    the Wolf people tear him apart and devour him. Wild Cat's grown grandson then
    sets out eastward to seek his grandfather and learns from a road encounter that
    his grandfather was seen among the Eagle people.
  language: English
  quote_policy: summarized
