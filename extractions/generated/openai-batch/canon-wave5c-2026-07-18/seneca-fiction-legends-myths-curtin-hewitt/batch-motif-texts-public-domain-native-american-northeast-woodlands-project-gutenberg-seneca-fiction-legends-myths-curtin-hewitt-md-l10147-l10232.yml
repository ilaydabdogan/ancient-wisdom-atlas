canonical_text:
  quote: ''
  summary: A traveling figure called Oanyadjigowa or Ganyadjigowa escapes pursuers
    by flying to the clouds, meets a cloud-dwelling man who can see over the world,
    is warned about a powerful lake-side figure and the Wind, descends, questions
    and names an underground winged being, visits Gaasyendiet'ha and strikes him with
    a mallet and a flag stalk, then names a rock-dwelling figure Gwiyee and tells
    him not to chase people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Oanyadjigowa says he would be glad if Genonsgwa and his people caught him;
    they pursue angrily but cannot catch him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Oanyadjigowa flies upward until he reaches the clouds, where he sees people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man in beautiful downy clothes greets Oanyadjigowa in the cloud-region and
    asks where he came from and how he arrived.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The cloud-dwelling man says he can see all over the world; when Oanyadjigowa
    looks down, he also sees all over the world.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The cloud-dwelling man warns that a man by the lake has great orenda, is chief
    of all gods, and should not be harmed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The cloud-dwelling man tells Oanyadjigowa to leave because the Wind is coming
    and will kill him if he remains.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After going down, Oanyadjigowa sees someone coming out of the ground and questions
    why he lives there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ground-dwelling figure says Hanisheonon is a great magical power and lives
    in the ground; he also says that he himself can kill people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Oanyadjigowa names the ground-dwelling figure Onoqgontgowa; the figure cries
    or buzzes and is identified as a winged Djihonsdonqgwen.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ganyadjigowa enters Gaasyendiet'ha's lodge, finds the old man asleep, and
    strikes him on the head with a mallet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Gaasyendiet'ha first thinks mosquitoes are biting his head, then recognizes
    Ganyadjigowa and questions why he was struck.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ganyadjigowa calls Gaasyendiet'ha his grandfather; Gaasyendiet'ha tells him
    to sit at the other end of the fire and be quiet.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Ganyadjigowa and Gaasyendiet'ha discuss who planted the trees; Gaasyendiet'ha
    says it was the man in the blue sky, while Ganyadjigowa claims he planted them
    all.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: Gaasyendiet'ha says a flag stalk from swamps can kill him; Ganyadjigowa finds
    such a stalk and strikes him with it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Because Gaasyendiet'ha's face is red from wild cranberries, Ganyadjigowa thinks
    the old man is bleeding and runs away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Ganyadjigowa sees a lodge in the side of a high rock and wonders how he can
    throw it down.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:17
  text: The rock-dwelling man says he always lives on rocks and that everyone hears
    him when he talks.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:18
  text: Ganyadjigowa names the rock-dwelling man Gwiyee and tells him to be quiet
    and not chase people; the passage adds that this is why Gwiyee never chases others.
  category: sequence
  evidence_refs:
  - ev:7
