canonical_text:
  quote: ''
  summary: The introduction classifies much of the collection as fictional narrative
    rather than myth, while noting mythlike elements such as personified natural powers,
    arenda or magic power, repeated narrative devices, revival of the dead from arranged
    bones, and a forbidden-direction ordeal involving wizards. It also records editorial
    circumstances, lost field notes, translation difficulties, informants, and a defense
    of the moral tone of the Seneca narratives.
  language: English
  quote_policy: summarized
