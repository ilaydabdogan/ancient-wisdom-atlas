canonical_text:
  quote: ''
  summary: The passage first describes Dagwanoenyentgowa and the Dagwanoenyent people
    using fire and tobacco smoke at the body of a dead Genonsgwa, after which a young
    girl emerges from the Genonsgwa's belly and regains strength. A Genonsgwa scout
    then visits, and Dagwanoenyentgowa summons relatives to face thousands of Genonsgwa.
    The Dagwanoenyents use stones and a mountain-ravine stratagem to destroy the Genonsgwa,
    leaving a lake named as their grave. The passage then begins another legend, in
    which a destitute old woman who has lost seven daughters hears crying at a grave,
    finds a naked baby who has crawled out of the earth, and takes the child home
    without knowing her dead daughter had been pregnant.
