canonical_text:
  quote: ''
  summary: 'A young woman receives instructions from the son of Dagwanoenyent for
    escaping a hostile old woman: she takes three white chert stones and sets up a
    doll as a decoy while drawing water. A young man arrives by canoe and carries
    her away. The old woman discovers the trick, pursues the canoe with fishhooks,
    then drinks up lake water to draw it back; the young man kills her with a knife,
    and the pair reach the mainland. He hides the woman in a hollow stump before introducing
    her to his mother, whose wolves detect a human smell. The woman later gives birth
    to male twins, who grow quickly and are given lacrosse sticks, bows, arrows, and
    a raccoon-foot target.'
  language: English
  quote_policy: summarized
