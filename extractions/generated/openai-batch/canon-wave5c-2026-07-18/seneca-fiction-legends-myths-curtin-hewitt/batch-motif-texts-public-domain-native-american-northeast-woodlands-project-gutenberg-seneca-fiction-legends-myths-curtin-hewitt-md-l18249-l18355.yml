canonical_text:
  quote: ''
  summary: A young orphan at a swing encounters a mother panther and cubs pursued
    by Dagwanoenyent, who is angry over a damaged owl-skin feather cap. The orphan
    gives Dagwanoenyent a killed owl, and the panther rewards him with hunting instructions
    that bring food to his starving wife and brothers-in-law. In the following narrative
    opening, a boy repeatedly feeds a many-colored worm, later joined by other boys,
    until it becomes a huge monster that swallows anything within reach.
  language: English
  quote_policy: summarized
