    made from the skin of a horned owl.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man tosses up a killed owl; Dagwanoenyent catches it, thanks him,
    says it is better than the old cap, and flies away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother panther thanks the young man for saving her life and her children’s
