  text: The panther tells the orphan that he must hunt and must never swing because
    he will kill much game.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The young man visits his brothers-in-law, finds them weak from hunger in a
    desolate lodge, feeds them venison, and invites them to live with him and his
    wife.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The brothers-in-law later live with their sister and brother-in-law, and the
