canonical_text:
  quote: ''
  summary: A man associated with Dehaenhyowens and his companions brings the visitors
    to an aged woman who is mistress of a large lodge, where she accepts them as grandchildren
    and guests. The visitors observe her making a mantle from human hair while a small
    dog unravels the work. Male household members return from hunting, greet the visitors,
    and are shown to take nourishment by absorbing the odor of food. The old woman
    provides human food by sending the hunters for deer and by causing corn and squash
    to grow from single seeds within a few hours. Later she burns corn husks around
    a round lake in a separate room, consuming its water, and warns the men not to
    injure any person as they depart on another trip.
  language: English
  quote_policy: summarized
