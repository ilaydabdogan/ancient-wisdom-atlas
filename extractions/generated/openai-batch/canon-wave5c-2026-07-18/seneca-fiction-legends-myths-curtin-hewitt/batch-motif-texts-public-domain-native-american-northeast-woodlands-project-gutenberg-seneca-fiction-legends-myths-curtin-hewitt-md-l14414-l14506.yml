canonical_text:
  quote: ''
  summary: Haiwanenqgwi completes a series of messenger journeys at Tsodiqgwadon's
    direction, summoning peoples from distant cosmographic regions to a council at
    Broken Land. Peoples from above, below, and the four quarters gather around a
    council fire and select chiefs. The passage then begins a new narrative about
    a strange boy of unknown origin in a warlike village who insists on joining a
    war party despite rejection.
  language: English
  quote_policy: summarized
