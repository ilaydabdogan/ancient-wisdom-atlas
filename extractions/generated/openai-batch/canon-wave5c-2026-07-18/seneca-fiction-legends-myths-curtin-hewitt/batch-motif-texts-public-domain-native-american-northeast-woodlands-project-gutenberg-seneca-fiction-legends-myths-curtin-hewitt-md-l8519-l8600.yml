canonical_text:
  quote: ''
  summary: Hodadenon follows a sound to a deserted village, finds an old man and the
    old man's hidden niece, and learns that an identical-looking companion has been
    destroying the people. Hodadenon instructs the young woman how to help him in
    a ten-day fight. The companion is found eating flesh from the old man while he
    is still alive, and the two fighters struggle westward and return reduced to skulls.
    The young woman identifies the correct skull by following Hodadenon's instructions
    and pours hot dog fat on it, restoring him. Hodadenon heals the old man with orenda,
    accepts the niece as wife, then gathers scattered human bones near a hickory tree
    and commands them to rise as living men.
  language: English
  quote_policy: summarized
