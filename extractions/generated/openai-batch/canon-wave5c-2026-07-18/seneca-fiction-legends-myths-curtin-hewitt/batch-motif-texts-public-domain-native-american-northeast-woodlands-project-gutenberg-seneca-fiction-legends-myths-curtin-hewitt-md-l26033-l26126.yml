canonical_text:
  quote: ''
  summary: Two companions, including Hodadenon, agree to travel together to obtain
    tobacco from evil-minded women. After camping near the remains of a fire, they
    perform a tobacco offering with food arranged around the fire and hidden in the
    dark, asking animals, forest inhabitants, and life-making beings for assistance.
    They travel by night to a lodge where an old man is pounding tobacco. Hodadenon
    strikes him, and the old man identifies himself as a slave working in tobacco
    and permits them to take some. Hodadenon sends a twist of tobacco to his sister’s
    lodge. The old man then directs the young men toward the very wicked women’s lodge
    across a slippery ice-covered lake, warning that a voice can turn those who step
    on the ice into piles of bones if they are sorcerers.
  language: English
  quote_policy: summarized
