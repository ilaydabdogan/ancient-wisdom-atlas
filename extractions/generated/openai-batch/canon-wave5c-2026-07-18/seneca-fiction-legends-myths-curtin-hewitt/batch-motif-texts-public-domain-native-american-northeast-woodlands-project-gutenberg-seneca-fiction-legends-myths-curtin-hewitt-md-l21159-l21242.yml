canonical_text:
  quote: ''
  summary: A man flees the monster Djainosgowa across trees, valleys, and mountains
    for many days. The monster uses power against his footprints, darkens the night,
    commands storm, and pursues him into a hole leading to another country. The man's
    friend, identified as Gaasyendiet'ha, the Meteor, repeatedly helps him rise and
    later leads him. The runner reaches a lodge where an old man calls him grandson,
    confronts Djainosgowa, heals from its bites, tears it apart, and cooks its meat
    while preparing separate food for the runner.
  language: English
  quote_policy: summarized
