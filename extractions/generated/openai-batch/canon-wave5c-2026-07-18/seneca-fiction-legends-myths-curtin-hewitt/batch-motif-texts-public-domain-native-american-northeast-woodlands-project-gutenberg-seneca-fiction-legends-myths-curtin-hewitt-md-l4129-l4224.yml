  quote: ''
  summary: Haiendonnis repeatedly deceives Yenongaa during her visits by assuming
    altered appearances or invisibility. Yenongaa later becomes his wife. Her mother
    instructs her in evil-working orenda to enslave him. Haiendonnis follows Yenongaa
    to her mother's lodge, fights the old woman, burns the lodge after the women are
    dead, and owls emerge from the embers. Sorcerers and enchanters across the world
    rejoice at the destruction of the wicked women.
