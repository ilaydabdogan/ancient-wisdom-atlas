canonical_text:
  quote: ''
  summary: 'A child explains that he lived among the Bear people and learned the use
    of a forked wooden rod, which reveals the origin of the Bear ceremony. The passage
    then recounts the origin of the Pigeon songs and dances: people gather at a pigeon
    roost, an upright young man is approached by an old white pigeon, and the pigeon
    instructs him to tell his people to remember the Creator, put away evil thoughts,
    join the pigeons in thanksgiving, sing and dance around fires, and make tobacco
    and other offerings as prayer for health and prosperity.'
  language: English
  quote_policy: summarized
