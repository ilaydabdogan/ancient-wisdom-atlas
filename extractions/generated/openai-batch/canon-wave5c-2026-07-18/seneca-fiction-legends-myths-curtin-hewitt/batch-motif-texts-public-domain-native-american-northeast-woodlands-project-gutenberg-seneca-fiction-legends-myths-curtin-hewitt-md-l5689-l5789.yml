canonical_text:
  quote: ''
  summary: A cast-out young woman accepts a young man's proposal and becomes his wife.
    The young man's mother becomes jealous, and the couple moves to the forest, where
    a son is born. After the husband makes repeated visits to his mother, he fails
    to return. Years later, the son finds his mother cut in half; she explains that
    her six sisters caused her lower body to be stolen so that wampum beads could
    be gathered from it. She gives her son orenda to recover the missing half and
    produces a tiny black dog as his helper.
  language: English
  quote_policy: summarized
