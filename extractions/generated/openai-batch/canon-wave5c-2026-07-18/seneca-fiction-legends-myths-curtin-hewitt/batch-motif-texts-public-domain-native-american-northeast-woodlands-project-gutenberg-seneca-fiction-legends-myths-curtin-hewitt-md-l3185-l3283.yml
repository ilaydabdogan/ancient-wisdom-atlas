canonical_text:
  quote: ''
  summary: A hunting party reaches Kingfisher's Place, camps, observes injunctions,
    invokes the Stars, Moon, and Sun, and hunts successfully. One stubborn hunter
    ignores the leader's warning and goes farther than usual. At night he camps by
    a stream and sees two figures appearing as women, one carrying and nursing a baby.
    They repeatedly ask how he crossed the stream. The hunter suspects they are Genonsgwa,
    avoids revealing or remaining accessible to them, and uses a fallen-log footbridge
    and a ford to keep the stream between himself and them while they become angry
    and handle his tomahawk.
  language: English
  quote_policy: summarized
