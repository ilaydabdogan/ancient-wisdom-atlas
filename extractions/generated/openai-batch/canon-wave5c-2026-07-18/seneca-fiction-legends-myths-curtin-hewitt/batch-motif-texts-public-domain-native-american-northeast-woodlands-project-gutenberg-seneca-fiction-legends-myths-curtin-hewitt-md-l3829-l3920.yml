canonical_text:
  quote: ''
  summary: A younger and elder brother fight while the woman cannot distinguish them.
    After the woman kills the elder brother, his body is burned and the younger brother
    flees west with her. The elder brother comes back to life and pursues them. The
    younger brother hides the woman as a stump, sends his moccasins ahead as decoys,
    and later creates obstacles by means of a beaver jaw and a pigeon feather. Helpers
    direct the fleeing pair toward an aunt, moving rock ledges, a river crossing,
    a nonhostile army, a dog guide, and the mother's lodge.
  language: English
  quote_policy: summarized
