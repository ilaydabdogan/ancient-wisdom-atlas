canonical_text:
  quote: ''
  summary: Two men approaching an enemy settlement see fires, conceal their weapons
    under moss and earth, remove face paint, and agree that any survivor should recover
    the buried outfits. They approach a temporary corn-husk shelter, reassure a frightened
    woman and children that they are unarmed peace messengers, and wait for an old
    man to return. The old man hears their proposal to end mutual slaughter by burying
    weapons deep in the earth, then goes to the Long-lodge, proclaims news, gathers
    the people and chiefs, and reports the peace proposal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The two men see the lights of several fires, stop on a log, and prepare before
    approaching the place where they believe enemies live.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: They leave scalping-knives, bows and arrows, and battle-axes behind, remove
    paint from their faces, and cover the items carefully with moss and earth on opposite
    sides of the log.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: One man says that if either man is spared alive, that survivor should dig
    up and carry home both buried outfits.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: They see a temporary shelter made of corn husks during the corn harvest, when
    strings of ears of corn are being dried.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: One of the men instructs the other not to speak because he will do the talking
    at the shelter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Children notice the approaching men and flee into the shelter; inside, the
    men see a deerskin doorflap, a woman, hidden children, and the woman’s fear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The spokesman tells the woman not to fear them, citing their lack of weapons
    and face paint and saying they have come on a good errand.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The woman tells the children that the visitors will not kill them; the children
    come out and the mother regains composure.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The woman says an old man has gone into the valley where they dwell and will
    return soon; the visitors decide to remain until he returns.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the old man returns, the spokesman says they are messengers who wish
    to talk in peace and again points to their lack of weapons and face paint.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The old man at first seems angry, but after hearing the statement asks the
    visitors to relate their message.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The spokesman proposes settling all differences, stopping mutual slaughter,
    and burying the scalping-knife, war bow and arrows, and battle-ax deep in the
    earth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The old man proposes going to the Long-lodge to tell the chiefs, while the
    two ambassadors remain behind because the chiefs may be angry on seeing enemies.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Near the village, the old man cries out in a manner described as proclaiming,
    causing people to come from their lodges and assemble in the Long-lodge.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: In the Long-lodge, a chief asks the old man to report his important news,
    and the old man repeats the visitors’ peace message to the assembly.
  category: sequence
  evidence_refs:
  - ev:8
