canonical_text:
  quote: ''
  summary: 'The passage contains several short tales and fragments: a preserved strange
    body whose feathers aid war, rain, and concealment; a medicine-man who kills a
    man by tying his hair to a buried snake; a man who gives tobacco to S''hagodiyoweqgowa
    or False Faces and visits their cave; a False Face mask episode in which a frightened
    child is cured by maskers with dance and ashes; and the beginning of a vampire-skeleton
    tale in which a dead wizard in a cabin kills a sleeping husband while his wife
    is cooking.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A strange person's body is laid reverently in a lodge with fine skins and
    furs, and people visit the lodge to view it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People take feathers from the body's arms when going to war, believing the
    feathers will secure success.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For rain, the feathers are dipped in water and carried along; the passage
    also says their trails are obscured in this manner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A medicine-man obtains a hair from a man he wishes to kill, ties it around
    a snake's neck, and seals the snake in a hole under a stone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: As the imprisoned snake grows weak, the man whose hair is tied to it also
    grows weak; when the snake dies, the man dies too.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A travelling man meets S'hagodiyoweqgowa or False Faces, gives tobacco to
    one of them, and is invited to see where they live.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man enters a cave in a rocky place and sees many old and young S'hagodiyoweqgowa;
    the tobacco is divided, thanks are given to Tobacco, and all dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Two young men carrying wooden masks put them on for a white woman after she
    offers cider; her young son becomes extremely frightened and unable to talk, and
    a doctor cannot help him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: An Indian shaman says the maskers must cure the boy; the maskers dance, rub
    him with ashes, blow ashes in his face, and he becomes well.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A husband and wife returning from a hunting trip find a cabin where all the
    people are dead and the owner’s body has been placed on a shelf in a bark box.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: While the husband sleeps and the wife cooks, she hears a chewing noise, makes
    the fire blaze, sees blood trickling from the bunk, and knows that the dead wizard
    has killed her husband.
  category: sequence
  evidence_refs:
  - ev:8
