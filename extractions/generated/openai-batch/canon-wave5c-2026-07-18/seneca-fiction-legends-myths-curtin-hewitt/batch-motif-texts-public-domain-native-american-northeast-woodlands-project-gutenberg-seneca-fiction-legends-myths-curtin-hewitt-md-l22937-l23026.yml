canonical_text:
  quote: ''
  summary: A named man commands an animate human or woman's skin to light his pipe,
    then smokes and disgorges wampum beads. His mother-in-law collects beads on buckskin
    while other people scramble for beads that fall away; a second production yields
    black wampum. After the public gathering ends, the man plans a return journey
    with his wife to his maternal uncle and proposes that his mother-in-law and uncle
    live together as husband and wife. The party travels, the man scouts ahead, finds
    his uncle alive, and the uncle accepts the proposal. The mother-in-law is received
    into the uncle's lodge, and the two couples sit on opposite sides of the fireplace.
  language: English
  quote_policy: summarized
