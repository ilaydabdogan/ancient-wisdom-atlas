canonical_text:
  quote: ''
  summary: The passage summarizes an early American myth cycle in which primordial
    nonhuman persons form good and bad camps, prepare the world for humans, struggle
    with immortal harmful beings, and then either become natural beings and phenomena
    or depart to remote deathless regions. It also presents an author's comparative
    theory that similar early myths arise from personified observed forces and include
    a primeval innocent or golden-age state followed by strife and transformation.
  language: English
