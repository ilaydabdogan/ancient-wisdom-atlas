canonical_text:
  quote: ''
  summary: Ot'hegwenhda defeats the old man Flea, rescues and cures his brothers,
    consults a fetish about directional trails, encounters an old Onweaunt woman connected
    with a deep lake, receives a tail-point object for dream divination, heals captive
    peoples hidden under her lodge, learns that her man-eater husband had imprisoned
    them, and then reaches another northeastern lodge where a man and woman play with
    large white flints.
  language: English with Indigenous names and terms
  quote_policy: summarized
