  quote: "“I was that toad.”"
  summary: Ne Hononhsot, identified as Hawenniyo, instructs Hatcinondon about warfare,
    protection from arrows, and returning home. Hatcinondon later fights the Cherokee,
    is captured and bound for death by fire, but is rescued during a rainstorm by
    an old woman who reveals that she was once a toad he saved. He escapes by stream
    and hollow tree, then later kills and scalps three sleeping men.
