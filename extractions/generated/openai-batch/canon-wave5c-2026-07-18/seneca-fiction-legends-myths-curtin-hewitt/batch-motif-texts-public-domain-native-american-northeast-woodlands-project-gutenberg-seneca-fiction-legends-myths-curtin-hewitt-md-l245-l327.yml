  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maryland is said to have bought land claims on both sides of Chesapeake Bay
    from the Minqua, Susquehanna, or Conestoga in 1652.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In 1668, Seneca and Cayuga warriors from the Five Nations were defeated by
    the Minqua with Marylander aid; later, famine and loss of Marylander alliance
    preceded the Conestoga being subdued by the Five Nations in 1675.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In 1744, the passage reports increasing French influence among the Seneca,
    British-aligned Mohawk under Col. Johnson's influence, and neutrality efforts
    by the Onondaga, Cayuga, and Oneida under pressure from Pennsylvania and Virginia.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In 1686, 200 Seneca warriors went west against the Miami, while the Illinois
    are described as having been overcome by the Iroquois in a war of about five years.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In 1687, Marquis Denonville assembled French, colonial, and allied Indigenous
    forces to attack and destroy the Seneca, reached Irondequoit, and built a stockade
    there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Seneca ambushed Denonville's advancing force, drove back colonial levies
    and Indigenous allies, and threw veteran regiments into disorder before Denonville
    was saved by superior numbers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In 1763, at Bloody Run and Devil's Hole near Niagara River, the Seneca ambushed
    a British supply train and then a British relief force, with only a few survivors
    in each case.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage attributes the 1763 violence to general unrest among the Six Nations
    and western tribes after British occupation of posts following French surrender
    of Canada.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: By the beginning of the American Revolution, the Seneca and a large majority
    of the Six Nations reluctantly supported Great Britain against the colonies; in
    1779 Gen. Sullivan defeated their warriors, burned villages, and destroyed crops.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that there is no historical evidence that the Seneca on
    the Ohio and south shore of Lake Erie in the 18th and 19th centuries were chiefly
    an outlying colony from the New York Seneca; it infers they were largely subjugated
    Erie and Conestoga remnants.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage lists population estimates for the Seneca from early estimates
    of about 5,000 through figures for the 18th, 19th, and early 20th centuries, while
    noting that some Quebec proportions cannot be estimated.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The following Seneca material is described as having two parts, with Part
    1 consisting of field-recorded matter collected by Jeremiah Curtin in 1883, 1886,
    and 1887 at the Cattaraugus reservation, including tales, legends, myths, and
    some editor-made translations.
  category: other
  evidence_refs:
  - ev:9
