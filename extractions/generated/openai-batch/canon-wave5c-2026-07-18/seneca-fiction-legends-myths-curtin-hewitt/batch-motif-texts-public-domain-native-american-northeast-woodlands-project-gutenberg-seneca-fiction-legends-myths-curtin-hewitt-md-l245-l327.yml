  summary: Historical introduction recounting Seneca, Iroquois, Conestoga/Minqua,
    French, British, Maryland, and other colonial-era conflicts and alliances, followed
    by demographic notes and an editorial description of the Seneca tales, legends,
    and myths collected by Jeremiah Curtin.
