canonical_text:
  quote: ''
  summary: Gaasyendiet'ha threatens Ganyadjigowa, sends him west through the air,
    and causes him to become S'hodieonskon. Ganyadjigowa travels north to a rock lodge,
    meets Djothowandon and Dagwanoenyent, learns of a servant sent to pacify churlish
    people at the southern end of the earth, is killed by Dahdahwat, and is restored
    to life by Djoniaik with root powder. He later says S'hodieonskon does not remain
    dead and accepts a mission to quiet the churlish people.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gaasyendiet'ha threatens to kill Ganyadjigowa, shakes him and throws him down,
    but then lets him go after thinking Hanisheonon may punish him for killing the
    man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Ganyadjigowa continues laughing, Gaasyendiet'ha catches him by the neck
    and sends him far west; Ganyadjigowa goes through the air and falls where the
    sun sets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gaasyendiet'ha follows by flying through the air when he hears Ganyadjigowa
    speak from the place where he has fallen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gaasyendiet'ha causes Ganyadjigowa to become S'hodieonskon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ganyadjigowa travels north, sees a great rock with a lodge on it, and visits
    a nearby hut where Djothowandon tells him to go first to his master.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the lodge on the rock, Ganyadjigowa sees an old man sitting by a fire;
    the man names himself Dagwanoenyent and allows Ganyadjigowa to stay.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Dagwanoenyent says his servant has gone to the southern end of the earth to
    make churlish people good and quiet, and says that if they do not obey the servant,
    he must go eat them all.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Dagwanoenyent says his servant travels very fast and can be in a place as
    soon as he thinks of it.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Dagwanoenyent tells Ganyadjigowa to leave because people are coming who will
    bewitch him if he remains there.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Dahdahwat comes near Ganyadjigowa, chases him, bites him, and kills him after
    Ganyadjigowa says he is not strong enough in orenda to fight.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Dahdahwat says he has killed S'hodieonskon, who has great magical power.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Djoniaik finds Ganyadjigowa's bitten body, digs many kinds of roots, makes
    powder from them, rubs the powder over the body, and Ganyadjigowa becomes alive
    again.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After returning to Dagwanoenyent's lodge, Ganyadjigowa says he will never
    die and says old people have said that if S'hodieonskon died he would soon come
    to life again.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Dagwanoenyent asks Ganyadjigowa to go to the churlish people because his servant
    says they will never be quiet and because old men say S'hodieonskon can make churlish
    people quiet; Ganyadjigowa agrees.
  category: sequence
  evidence_refs:
  - ev:8
