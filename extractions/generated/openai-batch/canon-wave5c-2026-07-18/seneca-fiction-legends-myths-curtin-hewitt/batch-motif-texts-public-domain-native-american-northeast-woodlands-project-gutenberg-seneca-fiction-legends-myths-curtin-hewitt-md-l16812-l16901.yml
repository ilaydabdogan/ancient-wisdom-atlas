canonical_text:
  quote: ''
  summary: Okteondon, a youth hidden from infancy under the roots of a large tree
    inside his maternal uncle Haient'hwus's lodge, repeatedly tries to rise at puberty
    until the tree falls. His uncle then prepares him for marriage. Wadi'oniondies
    women arrive, and three young men escort Okteondon on snowshoes through deep snow.
    Near four young women by fires, Okteondon overturns their kettles, summons and
    kills a bear from a tree, cooks the meat, warns his companions not to take meat
    to their wives, and later joins the youngest sister, while Hot'hoh chooses the
    eldest.
  language: English
  quote_policy: summarized
