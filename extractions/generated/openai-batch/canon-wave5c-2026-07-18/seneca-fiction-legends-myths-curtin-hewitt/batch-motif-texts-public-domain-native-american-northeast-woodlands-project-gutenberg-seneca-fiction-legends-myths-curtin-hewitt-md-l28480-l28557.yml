canonical_text:
  quote: ''
  summary: 'The passage first presents a thanksgiving speech in which an assembly
    gives thanks for the Creator''s decrees: the sky, the Sun, the Moon, the stars,
    protective persons, and the singers of the Great Feather Dance. It then begins
    a story titled as a corn legend and flood story: a three-month rain floods the
    dry land; one man survives by climbing a tree; a village on an unflooded tract
    suffers famine and eats slippery-elm bark; a young man hears heavy footsteps for
    thirty nights and predicts a visitor; a strange woman arrives despite the surrounding
    waters and enters his brother''s lodge.'
