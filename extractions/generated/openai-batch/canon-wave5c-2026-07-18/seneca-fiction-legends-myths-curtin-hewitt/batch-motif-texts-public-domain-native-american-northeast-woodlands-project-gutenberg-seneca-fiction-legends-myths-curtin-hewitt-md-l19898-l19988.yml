canonical_text:
  quote: ''
  summary: In the close of one episode, Gadata resists Djogeon's teasing, finds the
    hunter she was following, becomes his wife, and the hunter's luck improves. Later
    the hunter steals a tiny baby from a small lodge, causing a tempest; Djogeon claims
    the baby, receives it back, and gives the hunter a tiny arrow that brings success.
    A new tale begins with a man, wife, and child going into the woods to hunt. The
    man accumulates meat, refuses requests from unsuccessful hunters, and then his
    wife is visited by Genonsgwa, who asks for food, eats raw venison, and later seems
    to threaten the household as dogs bark and wind comes down the smoke-hole.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Djogeon comes to Gadata while she is sleeping or resting, tells her the hunter
    is nearby, shakes and teases her, and attempts to seduce her; Gadata keeps still
    with her face covered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After daylight Gadata resumes following the trail, finds the hunter's camp
    nearby, tells him her grandmother advised her to become his wife, and is welcomed
    by him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Gadata joins the hunter, he kills a deer that afternoon and thereafter
    has very good luck, which the passage attributes to having a wife.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hunter enters a small lodge, is welcomed by a small woman, receives green-corn
    hominy, sees a tiny baby, takes the baby into his bosom, and runs away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the hunter flees with the tiny baby, the small woman pursues him and
    a tempest arises, twisting and uprooting trees.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A small man on a fallen tree accuses the hunter of stealing his baby; the
    hunter admits the theft and returns the baby.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The small man is identified as Djogeon; after receiving the baby back, he
    takes a tiny arrow from the baby's wrappings and gives it to the hunter as a source
    of good fortune and success.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the baby is returned, the tempest ceases, the winds calm, and the hunter
    returns home with his wife and enjoys excellent fortune afterward.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A second tale begins with a man, his wife, and child leaving their village
    for the woods to hunt; they make camp, build a fire, cook samp with meat, and
    accumulate dried venison and bear meat.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The second hunter dreams of nearby hunters who can kill nothing; later he
    meets men who say they cannot find game and ask him for meat, but he refuses to
    give any away.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The wife returns from gathering wood and hears someone speaking to her baby
    in the lodge; she fears it may be Genonsgwa.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The wife sees a large naked woman by the swinging cradle; the visitor says
    she will not harm the wife and asks for meat.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The visitor eats raw venison, asks for more, says she eats a great deal once
    started, and identifies herself as Genonsgwa.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the wife tells her husband what happened, the dogs bark and become frightened
    at night; the husband says Genonsgwa may come to kill them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The husband urges his wife to go home with the child, but she says she will
    stay with him even if killed; bushes break around the lodge and wind blows down
    the smoke-hole.
  category: sequence
  evidence_refs:
  - ev:9
