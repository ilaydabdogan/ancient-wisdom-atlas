canonical_text:
  quote: ''
  summary: At dawn, Ongwe Ias revives dead dogs and leaves by canoe. Hodadenon returns
    to his uncle, described as bones, gives him tobacco to smoke, and receives instructions
    for escaping by burying himself near a landing and taking a duck-paddled canoe.
    Hodadenon escapes across the lake, invokes lake monsters against Shagowenotha,
    and Shagowenotha is later found in a tree and killed by Ongwe Ias. Hodadenon then
    travels to Ongwe Ias's lodge, where a woman uses bark pieces to prevent him from
    leaving tracks and hides him under her couch. Ongwe Ias returns with dogs, notices
    signs of another breath, but leaves to hunt elsewhere the next morning.
  language: English
  quote_policy: summarized
