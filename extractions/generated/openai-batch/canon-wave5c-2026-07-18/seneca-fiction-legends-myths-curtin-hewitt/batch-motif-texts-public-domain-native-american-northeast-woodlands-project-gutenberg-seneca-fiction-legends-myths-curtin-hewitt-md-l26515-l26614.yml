canonical_text:
  quote: ''
  summary: A youth prepares for demands from his old uncle by transforming a wild
    grapevine into bear entrails. In a long lodge, the old man sings a barter song
    naming Gadjis'dodo as nephew; flames surround the youth until he identifies and
    offers the bear entrails in exchange for meat. The next morning the youth consults
    a skull of another uncle, who warns him that the old man will next desire bear
    liver and instructs him to transform two fungi into bear livers. At night the
    old man has a violent dream-like episode involving the fire, and the youth defends
    himself with the old man's war club.
  language: English with Seneca terms in songs and names
  quote_policy: summarized
