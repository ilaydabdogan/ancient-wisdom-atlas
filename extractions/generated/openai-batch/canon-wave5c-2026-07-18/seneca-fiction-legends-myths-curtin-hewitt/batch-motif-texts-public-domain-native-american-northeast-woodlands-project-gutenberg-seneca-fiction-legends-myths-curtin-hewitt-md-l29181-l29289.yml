canonical_text:
  quote: ''
  summary: An ill man dreams of a beautiful short woman who promises aid from Corn,
    Bean, and Squash sisters because he formerly pitied them when he found them lost
    on trails. She instructs him to collect and drink rainwater, and to tell humans
    to perform Corn dances in thanksgiving. He recovers, hears and sees Corn women
    and Crop people singing and dancing, teaches the songs to his people, and the
    Elders establish the ceremony for the agricultural seasons. The passage then begins
    a new tale in which a community at the foot of a high cliff hears a mysterious
    woman on the mountain calling to an old respected man to become her husband.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An ill man dreams of a woman of low stature, fine appearance, and long hair
    who says she has been sent to aid him in his illness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dream woman tells the man that rain will come, that he must put out a
    receptacle to catch the raindrops, and that drinking the collected water will
    cure him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says the aid repays an obligation because the man had repeatedly
    taken pity on Corn, Bean, and the Seed of the Ancient Squash when he found them
    lying on trails; she calls them sisters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker says the crop beings sing and dance Corn dances when happy and
    give thanks at stages of human care, growth, harvest, drying, and storage.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker instructs the man to tell humans to sing and dance the Corn dances
    in thanksgiving when they are pleased to see the crops mature, because the crops
    furnish what humans live on.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After waking, the man sees an approaching rainstorm, places a bark bowl outside,
    drinks the rainwater it collects, and begins to recover.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the following night the man hears women's voices singing, sees strings
    of ears of corn on drying poles sway slightly, and observes that the singing comes
    from grains of corn in the guise of women.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The man returns to his people, relates his experiences, and sings the songs
    he heard from the Corn women; the Council of Ancients says the ceremony should
    be performed regularly.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Later the man hears singing in the planted field and sees a large company
    of Corn people, Bean people, and Squash people who appear as perfect human beings
    and dance slowly and gently like waving corn stalks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The man learns the songs, tells his people what he saw and heard, and the
    Council of Ancients declares this ceremony part of the earlier one.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that Corn dances and Corn songs have been used from that
