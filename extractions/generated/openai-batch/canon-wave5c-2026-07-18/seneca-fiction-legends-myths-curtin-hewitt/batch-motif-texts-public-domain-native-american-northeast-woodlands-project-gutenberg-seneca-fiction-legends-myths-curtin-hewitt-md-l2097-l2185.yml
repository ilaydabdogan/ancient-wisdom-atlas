canonical_text:
  quote: ''
  summary: The passage closes one Djogeon episode and begins another tale. Djogeon
    is received as a son-in-law, fulfills dangerous tasks arising from his mother-in-law's
    dreams, feeds the Dagwanoenyent beyond their capacity, traps the old woman and
    the Dagwanoenyent in a flint, red-hot lodge, and then carries his party across
    thin ice by shrinking them into puffballs moved by the west wind. The next tale
    opens with a proud daughter who rejects suitors, camps overnight in the forest
    with her mother, and is approached by a richly adorned beautiful stranger who
    says he has come to marry her; the section title names the tale as one about a
    woman who married a Great Serpent.
  language: English
  quote_policy: summarized
