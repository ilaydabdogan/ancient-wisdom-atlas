canonical_text:
  quote: ''
  summary: Ganon, a Seneca war chief, proposes a peace mission to the Cherokee. The
    male party purifies itself for ten days, then gathers special bird feathers by
    hiding a man beneath boughs and a deer carcass to pluck feathers from S'hadahgeah.
    After a journey to Cherokee country, feather-adorned Seneca dancers announce the
    errand. In council, the Seneca chief offers wampum as credentials for ending warfare.
    The Cherokee accept, share food, agree to bury weapons of war, hang white wampum
    between the groups, and invite adoption of Seneca relatives.
  language: English
  quote_policy: summarized
