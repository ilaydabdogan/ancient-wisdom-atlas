canonical_text:
  quote: ''
  summary: Skahnowa is told where Doonongaes's body lies and goes toward Broken Land,
    while two men retrieve a pouch from Doonongaes's lodge and deliver it. Another
    pair of men sent to their grandfather become disoriented while circling a lake,
    eventually orient themselves by the sun, and reach a remote lodge where an old
    grandfather, one of the Oanos or Spring-frog people, gives them a white flint
    canoe-form object containing black paint and medicine powder for reviving their
    fallen chief. They return to Broken Land, where the new chief identifies the lake
    as a delirium-making lake. A later pair passes a trail opening, shelters in a
    hollow tree, and is challenged by an unseen voice about Ganiagwaihegowa.
  language: English
  quote_policy: summarized
