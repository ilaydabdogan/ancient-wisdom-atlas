  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old man takes his pipe and smokes before receiving their message.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The messengers report that their people are in an important condoling council
    because their chief has fallen and they want to make him alive again.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The old man says their errand is important and gives them what he says is
    the only thing that can bring the chief to life again.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The old man brings from a hole in the ground a white flint in the form of
