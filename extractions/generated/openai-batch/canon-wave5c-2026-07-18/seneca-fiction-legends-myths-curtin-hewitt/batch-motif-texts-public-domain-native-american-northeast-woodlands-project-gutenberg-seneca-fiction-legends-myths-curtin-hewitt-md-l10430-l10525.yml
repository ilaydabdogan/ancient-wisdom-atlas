  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Many people are gathered in the Long Lodge to praise Hawenniyo and participate
    in the Green Corn dance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The assembled people do not notice the two human-flesh visitors because the
    young men have been purified.
  category: attribute
  evidence_refs:
  - ev:3
