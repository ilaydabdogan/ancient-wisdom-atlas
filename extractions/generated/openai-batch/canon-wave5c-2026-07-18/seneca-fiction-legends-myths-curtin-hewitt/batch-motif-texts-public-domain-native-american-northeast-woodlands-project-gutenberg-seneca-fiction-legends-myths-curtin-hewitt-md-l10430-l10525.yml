  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the young men return to the lower world, they are thirty years old, although
    the ten years seemed like only one day to them.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: At the hemlock tree where the trail began, the young men find their bows and
