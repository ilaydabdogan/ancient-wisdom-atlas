canonical_text:
  quote: ''
  summary: Two purified young men visit a settlement and Long Lodge associated with
    Hawenniyo, where good dead people gather, praise Hawenniyo, and take part in a
    Green Corn dance. Their guide tells them to return and report what they have seen.
    On the way home, the Sun explains that ten days in that place equal ten years
    below, restores their moss-covered bows and arrows at a hemlock tree, and directs
    them to their relocated people. The young men question elders, reveal they are
    the two who disappeared ten years before, and ask that an assembly be called so
    they can tell their journey.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The guide says the young men's sister and brothers have lodges in the settlement,
    but the young men cannot enter because they have not died and have not undergone
    the same change.
