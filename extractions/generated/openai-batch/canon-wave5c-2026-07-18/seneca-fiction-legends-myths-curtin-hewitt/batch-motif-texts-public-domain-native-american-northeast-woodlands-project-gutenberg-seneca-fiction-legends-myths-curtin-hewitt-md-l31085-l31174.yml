canonical_text:
  quote: ''
  summary: An old man brings two ambassadors into a village council. The ambassadors
    state that their chiefs sent them to propose settling the bloodshed between the
    two peoples. The village chiefs debate whether to accept peace or seek revenge.
    One chief rejects the proposal because of slain kinsmen, but another stops him,
    emphasizes shared human origin and appearance, accepts the peace proposal, and
    calls for burying the weapons of war. The sides agree to meet at a river boundary
    after ten nights, with both peoples present, and both communities begin preparing
    and traveling toward the meeting place.
  language: English
  quote_policy: summarized
