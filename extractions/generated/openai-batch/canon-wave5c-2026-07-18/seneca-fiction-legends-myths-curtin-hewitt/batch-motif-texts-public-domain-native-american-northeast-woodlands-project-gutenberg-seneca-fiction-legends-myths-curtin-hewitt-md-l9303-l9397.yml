canonical_text:
  quote: ''
  summary: A man has three dogs who are called his brothers. His wife secretly abuses
    and starves them. The smallest dog reports this and later, after a failed attempt
    to take a hidden food pouch, says the dogs will punish her. The woman withholds
    food, tastes her own blood after cutting herself, consumes her own blood and flesh,
    kills and eats her daughter, and becomes a man-eater through the orenda and influence
    of the dogs. The little dog warns the man, who warns a settlement; some people
    flee and others are eaten. The man and dogs escape across a river on a raft, and
    the pursuing woman misses the raft and drowns.
  language: English
  quote_policy: summarized
