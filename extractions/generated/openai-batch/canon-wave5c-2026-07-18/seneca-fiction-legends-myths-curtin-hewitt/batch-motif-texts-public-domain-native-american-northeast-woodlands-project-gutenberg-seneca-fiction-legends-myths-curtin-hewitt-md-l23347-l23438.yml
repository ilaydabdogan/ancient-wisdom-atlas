canonical_text:
  quote: ''
  summary: The passage describes brothers living in a long lodge and hunting daily.
    The youngest, Little Burnt Belly, is kept inside the lodge, given animal feet
    as targets, and warned not to leave while ashes are placed at the entrance. Honenhineh,
    the eldest brother, returns from hunting without game, fasts, announces a change
    in his life, and plans to hunt northward. At night he stirs the fire near Little
    Burnt Belly, whose legs are burned by sparks while he secretly watches. The next
    morning Honenhineh gives him a bear's foot target, repeats the warning not to
    leave, scatters ashes at the entrance, and travels north until he reaches clearings
    and sees a deep gorge or valley.
  language: English
  quote_policy: summarized
