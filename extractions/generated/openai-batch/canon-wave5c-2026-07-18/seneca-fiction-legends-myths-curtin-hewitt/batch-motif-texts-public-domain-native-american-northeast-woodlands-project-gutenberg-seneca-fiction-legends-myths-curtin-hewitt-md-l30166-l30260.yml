canonical_text:
  quote: ''
  summary: A young man named Hahadodagwat'ha prepares his sister to escape eastward
    with a magically enlarged black dog, whom he calls their brother. The dog carries
    and guides her by stopping near trees for rests. She is distracted by a bird and
    becomes separated from the dog. Hahadodagwat'ha later speaks with an old woman
    described as immune to sorcery and redirects her search.
  language: English
  quote_policy: summarized
