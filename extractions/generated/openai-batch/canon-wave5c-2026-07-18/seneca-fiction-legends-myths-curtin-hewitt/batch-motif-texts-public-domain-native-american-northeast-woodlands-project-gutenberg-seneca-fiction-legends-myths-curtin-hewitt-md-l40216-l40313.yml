canonical_text:
  quote: ''
  summary: An old uncle arranges his nephew's marriage to two women, cleans the nephew's
    dwelling and bedding, receives the customary twenty loaves of marriage bread,
    anoints and cleanses the nephew's diseased head with sunflower oil from a bear
    bladder, removes a cap of scabs and two forehead feathers, declares the nephew
    handsome, gives him the name Doadanegen, and instructs him to begin traveling
    over the earth.
  language: English
  quote_policy: summarized
