canonical_text:
  quote: ''
  summary: 'The passage closes a tale in which a man survives a night contest of extreme
    cold by keeping a large fire and drinking hemlock tea; at dawn Hot''ho concedes
    defeat and thaw begins. It then begins a tale about S''hagodiyoweqgowa and his
    brothers: three younger brothers unsuccessfully propose to Turtle''s sister; Turtle
    warns of danger; S''hagodiyoweqgowa attempts to take the sister by force, Turtle
    bites him, grows larger when struck, swallows him, and later the brother-sister
    pair flees when S''hagodiyoweqgowa revives and pursues them.'
  language: English
  quote_policy: summarized
literal_observations:
