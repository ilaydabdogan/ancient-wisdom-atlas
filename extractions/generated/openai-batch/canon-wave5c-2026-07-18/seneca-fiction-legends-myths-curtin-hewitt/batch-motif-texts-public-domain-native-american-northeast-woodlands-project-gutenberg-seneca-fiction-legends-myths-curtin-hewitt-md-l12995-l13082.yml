canonical_text:
  quote: ''
  summary: Doonongaes confronts Has'honyot over women whom Has'honyot refuses to release,
    recruits the Djihonsdonqgwen people to attack him, and the women are freed. The
    women then live with Doonongaes and bear children. Later Doonongaes visits the
    high rocks where Has'honyot lived, sees far across the earth, encounters Tsodiqgwadon
    killing people, loses a magical contest of commanding rocks to fall, and renounces
    the women after Tsodiqgwadon claims them. Doonongaes then returns to Ganyodaes,
    where his servant Skahnowa claims the lodge.
  language: English
  quote_policy: summarized
