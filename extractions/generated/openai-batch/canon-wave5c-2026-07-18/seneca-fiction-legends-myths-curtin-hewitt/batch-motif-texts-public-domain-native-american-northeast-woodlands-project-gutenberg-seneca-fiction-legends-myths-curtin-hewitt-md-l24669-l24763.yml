canonical_text:
  quote: ''
  summary: Two twin lads try to restore their blind uncle's sight by borrowing eyes
    from other beings and then by lending one eye each from their own heads. Their
    uncle tells them that his own bloodshot eyes are attached as ornaments to the
    swaddling wrappings of a female child in a fox-skin-marked lodge in cloudland,
    guarded by a sleepless warder. The twins ascend to cloudland on smoke from burning
    swamp grass, enter mice to approach the lodge, silence the warder with a promise
    of wild beans, become fleas, and cause their paternal aunts to fight with pestles.
    They then enter the lodge and find the child, the cradle board, and many eyes
    on the wrappings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The twins insert eyes borrowed from Ke'k^'howa into their uncle's sockets,
    but the uncle says he cannot see anything with them, and the twins return the
    eyes with thanks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The twins borrow eyes from Odonnyoii'da^, the Eagle; after insertion, the
    uncle can see only faint outlines, so the twins return the eyes to the Eagle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each twin removes one eye from his own head and places the two eyes in the
    uncle's head; the uncle can see the nephews and then returns the borrowed eyes
    to them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The uncle says his own eyes are partly bloodshot and are attached to the swaddling
    wrappings of a female child fastened to a cradle board, where they serve as breast
    ornaments.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The uncle says the lodge containing the child has a fox skin as its clan mark
    and stands far away in cloudland.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The uncle says no one can enter cloudland unseen by the sleepless warder Hane^hwa',
    who gives the alarm with three shouts when a stranger approaches.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The twins collect swamp grass, make a large pile, set it on fire, cast themselves
    into the flames, and are carried upward on smoke to cloudland, where they come
    down as cinders.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: One lad calls two mice and instructs them to burrow under leaves, grass, and
    rubbish toward the fox-skin-marked lodge; each lad enters one of the mice.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hane^hwa' knows why the two mice have come, but before he can give the alarm
    one lad tells him to keep silent and promises him wild beans; the warder lets
    them pass unheralded.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The lads assume the form and size of fleas, enter the porch, crawl up the
    legs of women pounding corn, and bite them so that the women begin fighting among
    themselves.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The women, described as sisters of the twins' father, use wooden pestles in
    the fight and fracture one another's skulls; after this, they are dead or unconscious.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The lads caution Hane^hwa' not to tell their father Degiyane'gen^ what he
    has seen, teach the warder a song, and then enter the fox-skin-marked lodge, where
    they find the cradle board, the female child, and many eyes on the swaddling wrappings.
  category: sequence
  evidence_refs:
  - ev:10
