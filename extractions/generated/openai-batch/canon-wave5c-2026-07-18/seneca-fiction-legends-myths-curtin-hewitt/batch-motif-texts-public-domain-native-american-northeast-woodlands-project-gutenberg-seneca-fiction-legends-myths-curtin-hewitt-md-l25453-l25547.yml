canonical_text:
  quote: ''
  summary: A young hunter returns home by means of a magically changing canoe and
    oars. At the chief's feast he reluctantly shoots a high-floating hen-harrier,
    the chief's tutelar deity and contest target, and is awarded the chief's daughter.
    Jealous rivals enlist sorcerers, and the bridegroom dies at dawn in his wife's
    arms. His widow follows his departing form and tracks for three days and nights
    to a narrow passageway in a land not for the living, where two men explain that
    further passage requires permission and a toll for fierce panther guardians.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young hunter enlarges a canoe and oars, crosses the lake to the shore
    from which he had been kidnapped, then strikes the canoe with an enchanted arrow
    to make it small again and swallows the canoe and oars.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After returning home, the young man is invited by friends to attend the chief's
    shooting match and venison feast, despite having been kidnapped from that place
    earlier.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief's tutelar deity is a hen-harrier hawk, which the chief causes to
    float high in the air as the target for invited shooters.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The contestants fail to hit the airborne hen-harrier, and the chief orders
    a final single attempt for each remaining candidate.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Djengo'se refuses to shoot at first, saying he does not want to kill the bird,
    but his friend places the bow and arrow in his hands and helps release the shot.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The arrow pierces the hen-harrier, and the chief declares that Djengo'se has
    won both the contest and the chief's daughter as the prize.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The disappointed competitors and suitors, moved by jealousy and malice, secure
    sorcerers to cause Djengo'se's death at dawn by a messenger of death piercing
    his heart.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the nuptial night, Djengo'se dies at dawn in his wife's arms.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The widow sees her dead husband leave the lodge and follows him for three
    days and nights, unable to overtake him and feeling neither fatigue nor hunger.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: At dawn on the fourth day she reaches a narrow passageway where two men question
    why she, not being dead, has come to a place that is not the land of the living.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: The two men decide to aid her and warn that a later passage is guarded by
    two fierce panthers, giving her two enormous roasted pheasants to throw to them
    as the toll.
  category: sequence
  evidence_refs:
  - ev:10
