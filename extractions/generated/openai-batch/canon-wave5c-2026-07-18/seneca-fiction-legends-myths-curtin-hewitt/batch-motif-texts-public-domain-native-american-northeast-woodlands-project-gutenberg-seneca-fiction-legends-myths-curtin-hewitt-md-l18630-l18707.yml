canonical_text:
  quote: ''
  summary: An old woman says a Dream Being requires her son-in-law to kill the Great
    White Beaver of the Lake of the Enchanted Waters and make a feast for dangerous
    guests. The son-in-law kills the Beaver, escapes pursuing enchanted waters, and
    learns the Beaver was the old woman's sorcerer son in animal form. The cooked
    Beaver is served at an eat-all feast to the Dagwanoenyent and Gaasyendiet'ha,
    and the guests taunt the old woman about eating her son's flesh. The old woman
    then tries to kill the son-in-law through a sweat-lodge ordeal, but he survives;
    when she enters, he makes the lodge intensely hot and she burns to death. His
    wife carries him back to his grandfather's lodge, where they are welcomed and
    live peacefully.
  language: English
  quote_policy: summarized
