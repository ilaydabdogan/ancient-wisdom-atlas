canonical_text:
  quote: ''
  summary: 'The excerpt first closes a Sgagedi narrative: Sgagedi travels on a lake
    by dividing himself in a canoe, marries a young woman, has twin sons who survive
    being thrown into the lake, and the twins later recover an old uncle and his stone
    dog. The excerpt then begins the tale of Dagwanoenyent: an overlooked man is warned
    by his Dream Spirit that his village will be destroyed, receives instructions
    to hide in a hollow rock with bow and arrows, and obeys by entering the mountain
    rock shelter.'
  language: English
  quote_policy: summarized
