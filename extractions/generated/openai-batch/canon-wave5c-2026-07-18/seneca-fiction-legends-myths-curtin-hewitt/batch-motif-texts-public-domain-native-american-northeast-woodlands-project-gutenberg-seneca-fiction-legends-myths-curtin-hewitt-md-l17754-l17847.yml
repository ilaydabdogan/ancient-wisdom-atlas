candidate_motifs:
- id: motif:1
  label: Tears transformed into valuable beads
  taxonomy_refs: []
  basis: The woman's tears fall to the ground and become beautiful wampum, drawing
    the people to gather them.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents the transformation literally; no broader exchange
    or ritual function is asserted.
- id: motif:2
  label: Rescue during bead-gathering distraction
  taxonomy_refs: []
  basis: While the people are on their knees gathering wampum, Deoyadastat'he unbinds
    and removes his mother.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not state that the wampum was intentionally produced
    as a planned distraction.
- id: motif:3
  label: Avenging heated enclosure kills persecutors
  taxonomy_refs: []
  basis: Deoyadastat'he commands the lodge to become flint and white-hot, trapping
    and killing the people inside.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a local lodge destruction; it should not be equated with world-destroying
    fire.
- id: motif:4
  label: Dead people give rise to owls
  taxonomy_refs: []
  basis: After the lodge occupants die, owls come from their burst heads and fly out
    through the smoke-hole.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage gives an animal emergence from dead bodies but does not explain
    whether this is transformation, origin, or punishment.
- id: motif:5
  label: Dismembered attacker prevented from reassembling
  taxonomy_refs: []
  basis: The blue lizard is torn to pieces, and the dog carries the pieces away so
    they will not fly back into place before cooling.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The attacker is called a blue lizard; the passage does not explicitly
    call it a monster or shapeshifter.
- id: motif:6
  label: Sacred light-giving tree at the center of the sky village
  taxonomy_refs:
  - sacred_tree_axis
  basis: Before earth exists, a sacred white-blossoming tree stands in the middle
    of the sky village, gives light through its flowers, and leaves a passage-like
    hole when uprooted.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The tree is central and sacred, but the passage does not explicitly name
    it an axis or world-center.
- id: motif:7
  label: Repeated dream-command to remove a sacred tree
  taxonomy_refs: []
  basis: The dream woman receives three dreams in which an Ongwe repeats the instruction
    to dig around and uproot the tree, promising better light.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not identify the Ongwe beyond the dream context.
- id: motif:8
  label: Sky woman cast down through tree-hole
  taxonomy_refs:
  - departure
  basis: After the tree disappears, the chief orders the dream woman cast into the
    hole, and she falls from the sky world into our sky.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The departure is forced rather than voluntary, so the taxonomy reference
    is provisional.
- id: motif:9
  label: Primeval water before land
  taxonomy_refs:
  - chaos
  basis: When the woman emerges below the sky hole, she sees a great expanse of water
    with water beings and no land.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage describes a pre-land water expanse but does not personify
    chaos or describe disorder.
- id: motif:10
  label: Animal and water-folk rescue of a falling human
  taxonomy_refs: []
  basis: Loon summons water beings to aid the falling woman; Fishhawk and warriors
