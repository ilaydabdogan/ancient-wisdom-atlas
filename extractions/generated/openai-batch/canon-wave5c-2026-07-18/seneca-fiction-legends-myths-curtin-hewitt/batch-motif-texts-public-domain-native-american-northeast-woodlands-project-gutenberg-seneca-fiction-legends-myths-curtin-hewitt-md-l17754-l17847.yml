canonical_text:
  quote: ''
  summary: 'The passage first concludes a legend in which Deoyadastat''he rescues
    his mother when her tears become wampum, destroys the occupants of a lodge by
    making it white-hot flint, kills a blue lizard attacker with help from his dog,
    reassures old Yeqsinye, and returns home. It then begins a Genesis tradition fragment:
    before earth existed, sky-dwelling people had a sacred white-blossoming tree that
    gave light. After a woman''s repeated dreams order the tree uprooted, the tree
    sinks away, the woman is cast into the dark hole, falls into our sky over a water-covered
    world, and water folk led by Loon and Fishhawk prepare to save her.'
  language: English
  quote_policy: summarized
