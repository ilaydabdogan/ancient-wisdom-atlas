canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode about Hinon Hohawaqk, the Son of
    Thunder: he returns from the western mountain, rescues a stolen uncle from a witch
    and an elm tree, marries, has a son who learns thunder, loses and regains the
    child, and finally carries his family by thunder, lightning, fire, and east wind
    to western mountains and rock caves where Hinon dwells. The passage then begins
    a separate episode about Hagowanen, a man with potent orenda, who travels west
    to hunt, kills many bears and deer, dries the meat, magically shrinks meat and
    skins into small bundles, and returns to find his canoe missing.'
  language: English
  quote_policy: summarized
