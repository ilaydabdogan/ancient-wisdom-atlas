  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: In 1622 the Montagnais, Algonkin, and Hurons sought peace with the Iroquois
    after long warfare, and an armistice was concluded in 1624.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The armistice was broken by continued Algonkin guerrilla warfare, after which
    the Seneca killed an embassy that included Pierre Magnan and three Algonquian
    ambassadors, leading to renewed war.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In September 1627 the Iroquois, including the Seneca, declared war against
    Indigenous groups and the French on the St. Lawrence and its northern tributaries
    by sending warrior parties.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After defeating the Hurons in spring 1634, the Seneca made peace with them;
    a Huron embassy later came to Sonontouan to ratify the peace and learned that
    other Iroquois divisions wanted to join the treaty.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage reports renewed Huron-Seneca war, Huron capture of twelve Seneca
    prisoners, and the Seneca being regarded as feared enemies of the Hurons.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage reports that 300 Seneca attacked the Aondironnon, killing or capturing
    many people, even though the Aondironnon were a dependency of the Neuters, who
    were then at peace with the Seneca.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Seneca are described as composing the larger part of Iroquois warriors
    in campaigns that destroyed and dispersed Huron tribes, sacked Tionontati towns,
    and contributed to the subjugation of the Neuters and Erie.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In 1651, while waging war against the Neuters, the Seneca were defeated so
    badly that their women and children fled from Sonoutowan to seek refuge among
    the Cayuga.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says that in 1652 the Seneca plotted with the Mohawk against French
    settlements on the St. Lawrence, but two years later sent an embassy to the French
