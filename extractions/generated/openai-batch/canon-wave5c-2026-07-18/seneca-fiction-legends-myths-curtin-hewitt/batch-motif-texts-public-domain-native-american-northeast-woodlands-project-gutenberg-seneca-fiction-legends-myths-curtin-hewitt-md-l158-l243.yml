literal_observations:
- id: obs:1
  text: The passage states that Seneca political history is largely that of the League
    of the Iroquois, while noting occasional independent action by the Seneca in dealings
    with outsiders.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Seneca independent action did not amount to a serious rupture
    of League bonds and presents tribal autonomy as part of the federal structure
