canonical_text:
  quote: ''
  summary: A youth reports to an advisory skull how he retaliated against his uncle
    by pulling him toward the fire while offering cooked turkey. The skull warns that
    the uncle is preparing a great fire and that an evil dream will make him arise;
    it instructs the youth to stay awake, strike the uncle with his war club, and
    ask about the dream command. At night the uncle pushes burning logs toward the
    nephew, but the nephew escapes, strikes him, and learns that the dream has commanded
    a life-risking challenge. The next morning the skull says the uncle is trying
    to outmatch the youth's orenda and instructs the youth how to transform a wild
    grapevine into bear entrails.
  language: English
  quote_policy: summarized
