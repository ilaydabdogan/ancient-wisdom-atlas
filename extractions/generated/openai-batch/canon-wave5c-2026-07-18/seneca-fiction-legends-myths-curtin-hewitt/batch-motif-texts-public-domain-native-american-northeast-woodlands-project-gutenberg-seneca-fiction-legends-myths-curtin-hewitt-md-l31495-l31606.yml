canonical_text:
  quote: ''
  summary: A grandson reaches the Eagle people on a mountain and learns that his grandfather
    was expelled and rolled down to the Wolf tribe. With the Eagle people's aid he
    is changed into a panther and sent into Wolf swamp. He finds and revives his grandfather's
    bones beneath a hickory tree, but the two later separate after conflict. The grandfather
    is killed and eaten again. The grandson wanders, escapes hunters' dogs, marries
    and has children, becomes alone again after family quarrels, encounters a Panther
    woman over refused deer meat, and is later shot by hunters. His dying words predict
    hostility between peoples. Panther kinsmen retaliate by killing and devouring
    the hunters and dogs, and the hunters' community prepares to destroy the Panther
    tribe.
  language: English
  quote_policy: summarized
