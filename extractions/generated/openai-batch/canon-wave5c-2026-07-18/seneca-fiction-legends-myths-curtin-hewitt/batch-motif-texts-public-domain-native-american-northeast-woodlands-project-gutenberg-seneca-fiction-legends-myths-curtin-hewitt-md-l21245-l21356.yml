canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which an old man eats the body of
    a great monster, shows his grandson enormous corn and squash fields, and the grandson
    later reunites with his wife, who had been sent away in vapor form. It then begins
    a tale about Dagwanoenyentgowa S'hagodigendji, an elder woman whose grandchildren
    are attacked by a Yenonsgwa. The Yenonsgwa swallows the younger child and carries
    the boy away on her back, but the boy clings where she cannot reach him. The grandmother
    tracks the Yenonsgwa, pursues in whirlwind form, exposes her hiding place, frees
    the boy, kills the Yenonsgwa by breaking her stone covering, and warns the boy
    to use his orenda. The Yenonsgwa's people later find her body and resolve to avenge
    her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man eats all of the great Djainosgowa, thanks his grandson, says the
    food will last many tens of years, and tells the grandson to remain until rested
    and cured because he has been infected by the monster's orenda.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man shows the young man fields with enormous corn called onenon, other
    varieties of corn, and large varied squashes.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: After leaving the old man, the young man travels for many days to a village,
    where the chief receives him well.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The chief's daughter asks whether the young man has heard of a man sending
    his wife away in the form of Os'hada, a vapor; he remembers that he did this,
    and she identifies herself as his wife.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Dagwanoenyentgowa S'hagodigendji, described as the eldest woman of her people,
    lives in the woods with two grandchildren, a boy and a girl.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: While the old woman is away, a Yenonsgwa comes to the lodge, speaks kindly
    to the younger child, swallows her, then invites the boy to climb on her back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The boy becomes fastened to the Yenonsgwa's back and cannot get off; the Yenonsgwa
    travels away from the grandmother's direction and wants to eat him but cannot
    reach him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: When the grandmother returns, she finds the children gone, discovers Yenonsgwa
    tracks around the lodge, and follows the trail intending to recover her grandchildren.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Yenonsgwa tries to dislodge the boy by rubbing him against a hickory tree,
    while the grandmother follows in the form of a whirlwind.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Yenonsgwa hides in a hole in a deep ravine and covers herself with earth,
    but the boy shouts to his grandmother, who returns and blows the earth off the
    hiding place.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The grandmother calls the boy off the Yenonsgwa's back, hurls great stones
    at the Yenonsgwa, rends her rock clothing, kills her, and takes the grandson home.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: On the way home, the grandmother tells the boy never to let himself be maltreated
    and says he can master those people if he uses his orenda because he is a Dagwanoenyentgowa
    like herself.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Some of the Yenonsgwa's people find her trail and body; her spirit says that
    the old woman killed her and tore her stone coating, and the Yenonsgwa men resolve
    to gather a company to kill the old woman.
  category: sequence
  evidence_refs:
  - ev:13
