canonical_text:
  quote: ''
  summary: A servant patrols Ganyodaes for Doonongaes and reports a fishing intruder.
    Doonongaes confronts, kills, cooks, and eats the intruder, then orders the servant
    to do the same to future trespassers. Doonongaes later travels west, steals a
    lodge occupied by two old Gwidogwido sisters, and the sisters discover and begin
    attacking his long body with clubs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Doonongaes has a servant, Skahnowa, whose work is to patrol Ganyodaes and
    keep off intruders.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skahnowa finds Djidjogwen at the water with a pole and fish; Djidjogwen says
    he is gathering fungus from hickory trees and washing it in the lake.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Skahnowa tells Djidjogwen that he thinks something has been stolen and says
    the owner of the lake will come and settle the matter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Skahnowa reports the intruder to Doonongaes, who prepares a kettle, takes
    a club, and goes to the place.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Doonongaes dives under the water and comes out in front of Djidjogwen, asking
    why he is meddling with his game animals.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Djidjogwen gives another explanation for the fish on the shore, saying a fish
    may have leapt after a bird; Doonongaes rejects this and strikes him on the head
    with a club.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Doonongaes carries Djidjogwen's body home, cooks the flesh, eats it after
    it cools, and thanks Skahnowa.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Before a long journey, Doonongaes tells Skahnowa to remain faithful and to
    kill and eat any trespasser he finds.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Doonongaes travels westward day and night for a month, reaches a broad opening
    with a lodge, goes underground to avoid being seen, and peers into the lodge.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Inside the lodge Doonongaes sees two very old women singing; he thinks he
    may be killed there and decides to steal the lodge.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: Doonongaes pushes his horns under the lodge, lifts it on his head, and runs
    into the woods with it.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The women inside think a terrible wind is blowing, sing a wind song, then
    discover that the lodge is moving and that a long black body is carrying it.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:13
  text: The two old women are Gwidogwido sisters with powerful orenda, take clubs,
    leave through the smoke-hole, and divide their attack between the tail and neck
    area of Doonongaes.
  category: sequence
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:14
  text: The younger sister pounds fin-like objects near the tail until a milklike
    fluid appears, turns to foam, and comes out more strongly; she becomes frightened
    and runs toward her sister.
  category: action
  evidence_refs:
  - ev:13
