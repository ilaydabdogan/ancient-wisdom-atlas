canonical_text:
  quote: ''
  summary: 'The passage closes a HUWITT narrative in which an old bald-headed chief
    repeatedly sends travelers toward the White Country and then accepts a world-circling
    report from a strong traveler whose tribe has surveyed many directions. The traveler
    is rewarded as second chief; the chief is identified as Bald Eagle, the new second
    chief as Mud Turtle, and the first traveler as Deer. The passage then begins “The
    Poor Hunter and Djogeon”: an unsuccessful hunter prepares with tree-bark medicines
    and provisions, is mocked by a young woman, praised by her grandmother, and is
    followed by the young woman, who hears an approaching pleasant voice at night.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old bald-headed chief and the people send successive men to learn more
    about the White Country because earlier reports do not satisfy them.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The White Country is described as a difficult region beyond ordinary land;
    later reports mention white houses, fur clothing that makes people look like animals,
    white rivers, and white lakes.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A fifth messenger crosses the White Country, reaches a rocky region, climbs
    up and down until his moccasins wear out, and returns by following the eastward
    lean of hemlock tops.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A strong man promises to go around the world; his tribe’s best travelers go
    separately in different directions for forty months, return, and report what they
    have seen to him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The strong man reports to the old chief that he has been around the world
    and seen many kinds of people, game, woods, and rivers; the chief rewards him
    with the office of second chief.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The narrative identifies the old chief as Bald Eagle, the new second chief
    as Mud Turtle, the first traveler as Deer, and the other travelers as different
    kinds of animals and birds.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Poor Hunter prepares before autumn hunts with ten days of fasting, medicines,
    and emetics made from the bark of various trees, but he is still not successful
    and carries parched cornmeal to avoid starvation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A granddaughter mocks the Poor Hunter with a nickname based on his tree-bark
    medicines; her grandmother rebukes her, praises him, and says she wishes he were
    the granddaughter’s husband.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The young woman prepares bread with her grandmother, follows the hunter’s
    trail, lies beside a log at night, and hears someone calling in a pleasant voice
    from a distance.
  category: sequence
  evidence_refs:
  - ev:8
