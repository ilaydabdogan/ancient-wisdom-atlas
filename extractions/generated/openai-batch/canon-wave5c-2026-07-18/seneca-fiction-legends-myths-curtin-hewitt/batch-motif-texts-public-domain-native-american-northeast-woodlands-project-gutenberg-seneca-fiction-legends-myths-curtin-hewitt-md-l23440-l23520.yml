canonical_text:
  quote: ''
  summary: Honenhineh hears tapping and a sung warning or announcement near a valley,
    descends, and is mocked by a speaking yellowhammer in a tree. After missing it
    with every arrow, he breaks his bow and continues to a smoky lodge. An elderly
    man invites him in, orders a young maiden to sit beside him as wife, and has her
    prepare corn soup with venison, maple sugar, and bear fat. After the guest eats
    and falls asleep, the old man chants the opening of a story about eight brothers,
    confirms that the guest is sleeping, kills him with a war club, cuts up the body,
    and cooks it while calling the victim a rare game animal.
  language: English
  quote_policy: summarized
