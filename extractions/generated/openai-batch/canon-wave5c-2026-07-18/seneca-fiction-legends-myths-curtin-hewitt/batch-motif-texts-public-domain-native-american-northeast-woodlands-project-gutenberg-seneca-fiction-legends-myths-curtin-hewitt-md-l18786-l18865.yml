canonical_text:
  quote: ''
  summary: Cherokee women assign kinship roles to men, while Ganon is claimed by a
    young man as father and is taken to the young man's mother's lodge. Later, Seoqgwageonon
    challengers from the East and Great Salt Water compete with Cherokee and Seneca
    in ball play and races with wagers. After contests and later fighting, the Seneca
    are told of a Seoqgwageonon boast of being a double man with two virile members;
    they organize an expedition with Cherokee guides, capture a hunter, examine him,
    and deny the boast. A further war challenge begins before the passage breaks off.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cherokee women select men and assign them kin terms such as uncle, mother's
    brother, and brother; Ganon the chief is left unselected at first.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ganon says that no one may take him away because a young man present will
    claim him as father.
