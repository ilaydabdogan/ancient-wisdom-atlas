  text: For a later long race, the Cherokee decide it is better to let the Seoqgwageonon
    win one contest so that they will not make trouble.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: A Seoqgwageonon messenger issues a second challenge, this time to meet halfway
