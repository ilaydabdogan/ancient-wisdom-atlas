canonical_text:
  quote: ''
  summary: During a hunt, brothers find deer killed by arrows and handle the arrows
    carefully so as not to remove their power. Little Burnt Belly, still at the lodge,
    decides to seek his missing brothers. He prepares with medicine and magical bow
    and arrows, follows their trail north through forest and valley, kills a speaking
    bird that pretends to be a flicker, and finds signs of his brothers' defeated
    weapons. He then reaches a lodge where an old cannibal man welcomes him, presents
    a granddaughter as his intended wife, and asks for the killed creature; Little
    Burnt Belly refuses until he sees his missing brothers.
  language: English
  quote_policy: summarized
