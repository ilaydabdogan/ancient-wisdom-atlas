canonical_text:
  quote: ''
  summary: A young man defeats an old ice-pond challenger by using an oak-tree ball,
    wind, and white flint, leaving the old man as a stone monument. He then travels
    to a marriage gathering where his mother, the chief's daughter, is torturing his
    father, sister, and dog. With his grandmother's advice and magical moccasins,
    he uses sympathetic fire magic to kill his mother, rescues his family and dog,
    and burns the Long Lodge, whose magical inhabitants' spirits emerge as ill-omen
    birds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man states a rule that when a nephew comes he races him on the ice,
    and whoever is beaten to the end loses his head.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man takes a ball from an oak tree, calls for a high wind, gets into
    the ball, and quickly crosses the ice ahead of the old man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man throws a white flint toward the pond and commands it to melt
    the ice and boil the water; the old man sinks and cries for mercy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ice melts, the water disappears, dry land appears, and the old man is
    left as a great stone monument; the young man sets fire to the cabin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A runner comes to the lodge of the two sisters announcing that the chief summons
    everyone to the marriage of a certain woman.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sisters know the boy has orenda, object to his attending the gathering,
    and finally tell him how to find his grandmother.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the journey with an increasing crowd, the youth kills game for hungry travelers,
    and the women prepare it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sisters had warned him of a woman in the crowd who seemed to have power
    over all men; he sees men crowd around her but passes on.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The grandmother says the chief's daughter is to be married and is going to
    torture her husband to death; he is hung up, struck with burning brands, and his
    tears become wampum beads.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The grandmother says the daughter is hanging over the fire and slowly roasting,
    while the dog is kicked, consumptive, and singed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the gathering, the boy pretends to be a little boy among children and sees
    his mother on a high seat, his father at a stake, his sister over the fire, and
    his dog coughing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The grandmother gives the boy moccasins made from the skin of a woman's private
    parts and explains that they have sympathetic power.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: When the mother orders the father to be branded, the boy puts his foot into
    the fire, and the mother screams in pain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The boy repeats this action until the mother dies, after which he removes
    his father, sister, and dog from the building.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The boy commands the building to become red-hot flint; the lodge burns, the
