canonical_text:
  quote: ''
  summary: A young man fleeing a pursuing young woman is aided first by his elder
    brother, who removes a fishhook from his neck, hides him in an arrow, and shoots
    him away. During the pursuit the young man uses decoys, transformations, a rock
    barrier, a pigeon-roost barrier, and a lake-side substitution. At the end of the
    passage, a man named Nosgwais begins to aid him by throwing him toward a hillside.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the young man starts for home, he finds himself returning toward the
    lodge he has just left and becomes disturbed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder brother identifies a fishhook caught in the younger brother's neck,
    removes it, and fastens it to a nearby bush.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The elder brother makes the younger brother small, places him inside an opened
    arrow, secures him there, and shoots the arrow into the air with instructions
    to get out when it lands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The young woman follows the fishhook line to the bush, becomes angry, searches
    lodges and trails, finds the arrow trail, and pursues the young man's tracks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: As the pursuer approaches, the young man removes his moccasins, tells them
    to run ahead to the end of the country, and transforms himself into a stump.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The pursuing woman notices that the stump looks like a man, but follows the
    apparent tracks onward, finds the moccasins at the end of the country, and returns
    to find fresh tracks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The young man casts a stone behind him and commands a high rock to extend
    from one end of the country to the other; a great ridge appears.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The young woman cannot pass through, over, or around the rock ridge, butts
    her head against it, falls back seemingly dead, later revives, and finds only
    a small stone where the ridge had been.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The young man casts down a pigeon's feather and commands a pigeon roost across
    the country with droppings so deep and high that nothing can pass through.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The woman cannot go through or around the pigeon roost and droppings, butts
    her head against the mass, falls back seemingly dead, later revives, and finds
    only a feather on the ground.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: At a lake where people are bathing and playing, the young man commands one
    man to become just like him and commands himself to become an old stump.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The people call to the woman to help catch the swimmer; she catches him after
    a chase, but he resumes his own form and she realizes she has been deceived.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A man named Nosgwais offers aid, tells the young man to get on his back, stretches
    his legs to an enormous length, and throws the young man a great distance toward
    a hillside.
  category: action
  evidence_refs:
  - ev:6
