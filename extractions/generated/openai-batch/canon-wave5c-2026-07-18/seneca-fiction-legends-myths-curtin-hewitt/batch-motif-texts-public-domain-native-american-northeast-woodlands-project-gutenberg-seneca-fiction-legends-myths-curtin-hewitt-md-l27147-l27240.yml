canonical_text:
  quote: ''
  summary: The passage first concludes a legend in which Gadjis'dodo' finds the old
    uncle frozen, completes a tenth circuit with a bark sledge, returns to his sister
    confined in a bark case, restores another uncle whose skull protrudes from the
    ground, restores his sister to normal size, and announces that the sorcerer has
    departed. It then begins a new legend in which Dehaenhyowens, from a land toward
    sunrise, announces a westward expedition along the path of the sun with his brother
    and twenty-eight young volunteers, after which the party attacks and scalps unknown
    peoples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The nephew receives no reply from his old uncle and sees that the uncle's
    upturned eyes are frozen hard.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The youth starts a tenth circuit with the bark sledge, drives it at great
    speed, swings it aside, and leaves it on the ice-cold ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gadjis'dodo' returns to the lodge where his sister is still fastened in a
    bark case, and she says she is thankful that both of them remain alive.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The brother carries the bark case on his back with a forehead strap to the
    place where another uncle's skull protrudes from the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Gadjis'dodo' says he has overcome the evil orenda of the old uncle, draws
    the other uncle up, and strokes his body to restore flesh withered by magic power.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Back at the lodge, Gadjis'dodo' unbinds his sister from the bark case and
    strokes her body to restore it to the size of a normal woman.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gadjis'dodo' says the group is united again in full number and will remain
    in the lodge in peace because the mighty sorcerer has departed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Dehaenhyowens resolves to travel into the distant West, through the path of
    the sun, to the end of the earth, intending to kill unknown men and take scalps
    as tokens of prowess in warfare.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At a feast in the public assembly lodge, Dehaenhyowens calls for young male
    volunteers who must renounce their lives and kin and continue despite obstacles;
    his brother has already volunteered, and twenty-eight others join.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The assembled war party sets out toward the place of sunset and later attacks
    two groups of unknown people, killing and scalping victims before continuing westward.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
