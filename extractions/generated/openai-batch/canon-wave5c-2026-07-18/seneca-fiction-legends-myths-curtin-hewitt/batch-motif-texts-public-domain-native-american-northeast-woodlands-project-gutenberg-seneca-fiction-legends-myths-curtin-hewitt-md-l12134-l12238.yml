canonical_text:
  quote: ''
  summary: A father intercepts two children and learns that an uncle killed and dismembered
    their mother. The children survived among her intestines in a hollow log by drawing
    milk from her severed breasts and have been taking meat to feed her remaining
    head. The head becomes insatiable and dangerous. The boys flee west on dogs, while
    the dogs warn the father to flee south because the Head will pursue him.
  language: English
  quote_policy: summarized
