canonical_text:
  quote: ''
  summary: 'Ganyadjigowa, also called S''hodieonskon in the passage, moves from encounter
    to encounter: he overturns Dagwanoenyent''s rock lodge, disturbs the earth lodge
    of churlish people, enters a cliff dwelling of seven Sigweont brothers and questions
    them about cosmological beliefs, tricks Disdis while he is making a mask, argues
    with Disdis about identity and the motion of water, and finally comes to Ganenaitha''s
    lodge, where he is invited in as a nephew.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ganyadjigowa/S'hodieonskon takes hold of a rock, turns it over, breaks Dagwanoenyent's
    lodge, and wounds Dagwanoenyent on the head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After seeing Dagwanoenyent bleeding, Ganyadjigowa laughs and says he is stronger
    magically than Dagwanoenyent.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the dwelling of the churlish people, Ganyadjigowa lifts one end of their
    earth lodge; the people bite him, pursue him, and he escapes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ganyadjigowa travels west at night, descends along a cliff, finds a hole in
    the cliff wall, and enters rooms where seven Sigweont brothers dwell.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ganyadjigowa tells the Sigweont that he goes around the world to make all
    quiet and happy; they say they do not believe him and do not want him there.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ganyadjigowa questions the Sigweont about Hanisheonon, Hayadagwennio, the
    earth standing on a Turtle, the making of the earth, and someone living covered
    in the earth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Sigweont state beliefs that differ from Ganyadjigowa's questions, including
    that Hayadagwennio made the world and that they are the fathers of Hanisheonon.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Ganyadjigowa sees Disdis in a lodge in the woods making a mask or wooden object
    by pounding something into a thin piece of wood and putting the object into his
    face.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ganyadjigowa removes the roof from Disdis's lodge and shakes his wings in
    a nearby spring so that water falls back onto the lodge like rain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Disdis claims the spring as his own and threatens to kill Ganyadjigowa; Ganyadjigowa
    replies that Disdis is old and no longer magically strong.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Disdis says he is Hani^conon himself and says he holds up the earth himself.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ganyadjigowa and Disdis argue about whether water always runs, with Disdis
    explaining that water goes into the ground and comes out in springs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Ganyadjigowa asks Disdis whether mud remains in swamps and whether old folk
    went all over the world; Disdis answers negatively or doubtfully, and Ganyadjigowa
    decides to leave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: After further travel, Ganyadjigowa comes to a lodge where Ganenaitha sits
    by the fire, calls him nephew, and invites him inside.
  category: relationship
  evidence_refs:
  - ev:6
