canonical_text:
  quote: ''
  summary: A weakened elder instructs a young man how to survive S'hagowenot'ha, a
    cannibal pursuer with dogs and wild geese. The youth makes three human-shaped
    bark-and-wood decoys with bows and arrows, lays misleading tracks across the island,
    hides himself in a sand trench near the landing place, and waits. S'hagowenot'ha
    arrives after midnight with his dogs, which follow the false trail to the decoys
    and are killed by arrows. The cannibal interprets the deaths as evidence of orenda
    or sorcery and flees toward the canoe landing.
  language: English with Seneca terms and vocalizations
  quote_policy: summarized
