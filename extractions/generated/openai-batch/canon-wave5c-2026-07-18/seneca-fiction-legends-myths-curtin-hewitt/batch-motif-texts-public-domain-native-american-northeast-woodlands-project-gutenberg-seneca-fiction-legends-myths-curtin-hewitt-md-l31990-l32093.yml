- id: obs:1
  text: A speaker instructs the young man to stay hidden while S'hagowenot'ha and
    his dogs follow his tracks from place to place, then to come out only when the
    pursuers sound distant.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man is instructed to make three human-shaped dolls from rough bark
