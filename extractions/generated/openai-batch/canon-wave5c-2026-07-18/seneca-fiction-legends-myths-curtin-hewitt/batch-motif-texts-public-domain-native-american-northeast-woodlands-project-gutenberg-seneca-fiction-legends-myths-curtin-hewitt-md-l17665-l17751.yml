canonical_text:
  quote: ''
  summary: Hadjowiski visits another lodge, where his wife overhears a woman asking
    him to stay there next time. The wife leaves home in a panther-skin robe. Hadjowiski
    follows her westward and is killed after S'hagoiyagent'ha sends him away in a
    living flint canoe that flies into a high rock. Hadjowiski's sons go out one after
    another and do not return, leaving Deoyadastat'he, who hears his mother crying
    in the far west. Deoyadastat'he and his flea-dog fly west to a village, where
    a messenger announces the torture of a woman whose tears yield wampum beads. At
    the assembly lodge Deoyadastat'he sees his mother tied to the war post of torture.
  language: English
  quote_policy: summarized
