canonical_text:
  quote: "“The bear is the mother who nursed and cared for me.”"
  summary: A hunter kills a she-bear and discovers a hair-covered boy who says the
    bear had raised him after his human mother abandoned him in a hollow tree. The
    hunter adopts the boy, whose knowledge improves the hunter’s success with bears.
    The boy rejects his birth mother when she tries to reclaim him. Later the boy
    gains a human playmate; the two boys see a westward-moving body of land with game
    and a coon upon it, and later help kill a bear brought home by the hunter.
  language: English
