canonical_text:
  quote: ''
  summary: The eldest daughter follows Doadanegen on a hunting trip, sees him in a
    tree causing raccoons to fall, is frustrated by a yellow hammer's cry, abandons
    her marriage bread, and returns home. Her mother rebukes her and prepares the
    youngest daughter with twenty cakes of marriage bread, hair dressing, and instructions.
    The youngest daughter tracks and conceals herself from Doadanegen, reaches the
    tree undetected, invites him to rest with his head in her lap, dresses his hair
    until he sleeps, places him in her bag, carries him away, and attempts to wake
    him at a steep rock.
  language: English
  quote_policy: summarized
