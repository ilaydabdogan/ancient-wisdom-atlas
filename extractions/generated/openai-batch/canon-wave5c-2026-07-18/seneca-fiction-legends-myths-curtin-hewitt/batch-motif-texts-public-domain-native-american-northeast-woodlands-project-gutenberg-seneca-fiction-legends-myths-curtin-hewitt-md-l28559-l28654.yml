canonical_text:
  quote: ''
  summary: During a famine after a great rainstorm and surrounding water, a young
    woman from the south says her mother has sent her to help the people obtain food
    and to become the wife of an elder son. After the marriage, she instructs the
    family to clear empty corn bins, and corn is heard falling into them. She sends
    her brother-in-law to catch a fish, though fish have been absent for months; he
    catches a large one. A small quantity of corn becomes a loaf, and the loaf, fish,
    and broth are divided among the whole village. The bridegroom and the people declare
    a custom of sharing good food equally with all neighbors.
  language: English
  quote_policy: summarized
