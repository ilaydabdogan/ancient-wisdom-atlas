canonical_text:
  quote: ''
  summary: 'A speaker associated with a rock tells a boy that he will relate stories,
    names the story-form as fable or tradition, requests a bird as a present, and
    teaches the boy how legends are to be heard. The boy brings others to the rock,
    and the passage explains that this is how legends came into the world; the boy
    later becomes an old storyteller who receives gifts for telling legends. The passage
    also states that legends are stories of former-world people with powerful orenda.
    A new legend then begins: a hunter camps in a forest with four dogs and a fire;
    a speaking dog warns him of large stealthy beings called Genonsgwa, instructs
    him to use three torches as delays, and the hunter flees while the dogs confront
    the pursuer.'
  language: English
  quote_policy: summarized
