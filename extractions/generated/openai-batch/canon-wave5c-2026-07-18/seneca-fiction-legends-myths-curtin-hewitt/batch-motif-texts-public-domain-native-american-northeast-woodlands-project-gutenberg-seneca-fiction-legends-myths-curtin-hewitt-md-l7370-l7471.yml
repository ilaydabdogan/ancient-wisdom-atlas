canonical_text:
  quote: ''
  summary: A hunter living with his uncle marries a woman who arrives with customary
    marriage bread. While hunting, he repeatedly encounters a mysterious woman who
    enchants him to sleep, carries him in a basket, and leaves him in dangerous rock-and-water
    places. He escapes once by becoming a bass, later defeats a fisherman on a rock
    ledge, grows a hemlock tree from a leaf to rescue trapped men, produces strawberries
    from a leaf to feed them, and confronts the woman at a lodge. His wife frees the
    woman and crosses a lake on bloodsuckers before the hunter returns home and finds
    her there.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An uncle and nephew live together in a forest lodge, and the nephew is described
    as a fine hunter.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A handsome young woman brings a basket containing customary marriage bread
    and says her parents sent her to marry the nephew; the uncle and nephew accept
    the marriage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The nephew regularly goes hunting and returns with heavy loads of game.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hunter finds raccoons in a hollow tree; while he is in the tree, a woman’s
    voice calls for him to come down, and the woman runs away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the tree episode, the hunter tells his wife what happened, and she laughs
    but says nothing.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A woman leads the hunter to a log, places his head on her lap while looking
    for vermin, causes him to sleep by orenda, puts him in a basket, and carries him
    to rocks in the middle of a lake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When awakened at the lake rocks, the hunter recognizes the place as one where
    he and his uncle used to fish; he jumps into the water, becomes a bass, and escapes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In a later hunting episode, the woman again puts the hunter to sleep, carries
    him in a basket, and leaves him on a narrow rock ledge where she disappears.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the rock ledge, a fisherman catches fish while singing and brings out baked
    squash to eat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The hunter commands the rock to stand back so he can string his bow; the rock
    moves, and he shoots the fisherman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the fisherman is shot, an enormous bat passes near the hunter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The hunter drops a hemlock leaf over the rocks, sings for a tree to grow from
    it, commands the tree to come near and have many limbs, and uses it to help other
    men descend from the rock shelf.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The hunter places a strawberry leaf on the ground, commands it to grow and
    bear berries, sings for the berries to ripen, feeds the men, and then makes the
    vines and berries disappear by putting a leaf into his pouch.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The rescued men and hunter make an adult-sized board from elk hide and go
    to a lodge where a woman pounding corn raises a corn pounder to fight them; the
    hunter commands the corn pounder to stop in the air.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The men strap the woman to the board and set it before the fire to broil her
    slowly.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The hunter’s wife arrives, becomes angry, frees the woman, says she will go
    home, and crosses the lake by calling bloodsuckers to stretch across it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: Each man returns to his own lodge, and when the hunter returns home, his wife
    is there.
  category: sequence
  evidence_refs:
  - ev:9
