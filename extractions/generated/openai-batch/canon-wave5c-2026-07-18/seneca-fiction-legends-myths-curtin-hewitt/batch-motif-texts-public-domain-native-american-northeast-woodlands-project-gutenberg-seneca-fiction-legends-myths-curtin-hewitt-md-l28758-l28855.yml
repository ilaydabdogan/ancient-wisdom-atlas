canonical_text:
  quote: ''
  summary: The passage contains two crop-origin-related narrative segments. In the
    first, a husband reaches his mother-in-law's lodge in an abundant cornfield, is
    welcomed and fed, receives warnings and seed-crops from his wife, and returns
    through dangers to distribute corn kernels to his foodless people. In the second,
    a grandmother rescues a young woman from midstream, later finds an ear of corn
    where the woman had been left, and receives dreams instructing her to plant and
    care for the corn, which identifies itself as the first corn delivered to earth.
  language: English
  quote_policy: summarized
