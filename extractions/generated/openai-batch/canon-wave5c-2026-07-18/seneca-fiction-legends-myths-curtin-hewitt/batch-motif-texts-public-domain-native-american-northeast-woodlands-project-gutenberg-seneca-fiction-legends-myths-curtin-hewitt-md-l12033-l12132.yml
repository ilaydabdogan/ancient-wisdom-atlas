canonical_text:
  quote: ''
  summary: An old uncle follows his nephew and daughter-in-law, whose trail appears
    in the air. The nephew and his wife flee across a lake by throwing a clamshell
    that makes the banks come together. The uncle hears the wife's unspoken thought
    about the shell, crosses, catches her, beheads her, finds twins in her body, and
    hides the children with part of the mother in a hollow tree. The nephew later
    discovers tracks, clothing, and speaking blood that reveals the murder. He then
    notices missing meat and eventually sees two little children carrying meat from
    his lodge to a hollow log, one calling him father.
  language: English
  quote_policy: summarized
literal_observations:
