  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The old man cuts open the body, finds twins, and hides the children with the
    mother's head and breast in a hollow tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The old man washes blood from the body in the lake, carries the body on his
    back, throws the shell again, and crosses when the banks close together.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The nephew returns, sees no smoke, finds the uncle's tracks and his wife's
