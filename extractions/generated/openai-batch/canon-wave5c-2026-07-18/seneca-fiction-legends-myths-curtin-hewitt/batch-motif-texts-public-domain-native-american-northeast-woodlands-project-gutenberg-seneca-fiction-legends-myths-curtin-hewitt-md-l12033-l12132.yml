- id: obs:4
  text: At the beach, the husband throws a clamshell toward the far side of the lake,
    causing the banks to come close enough for the woman to step over.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wife silently thinks that the old man should throw the shell; he hears
