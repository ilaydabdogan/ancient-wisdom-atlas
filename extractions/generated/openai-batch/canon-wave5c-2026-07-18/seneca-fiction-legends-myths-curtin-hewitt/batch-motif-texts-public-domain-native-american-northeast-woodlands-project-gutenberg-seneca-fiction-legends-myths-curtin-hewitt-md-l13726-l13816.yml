canonical_text:
  quote: ''
  summary: Doonongaes questions an old man who is a white bear and learns where Deanohdjes
    lives. He travels through extreme cold to an ice lake, summons Deanohdjes to a
    great council at Broken Land, then returns to Tsodiqgwadon. Doonongaes and Tsodiqgwadon
    travel southward, stretch a chief-like stranger and name him Gaisonhe, encounter
    a failing hunter whom Tsodiqgwadon changes into an owl after transforming an arrow,
    and then descend to lodges under a cliff where Doonongaes destroys an Odjieqda
    old man's lodge with his horns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Doonongaes speaks to an old man three times without receiving an answer, finds
    a club, and strikes the old man on the head; the old man remains unmoved.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man says Deanohdjes lives in the middle of an ice lake, says his own
    tracks form the trail, and is identified as a white bear.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Doonongaes travels in increasing cold and reaches an open space in the ice
    where a man with great teeth rises from the water.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man rising from the water is Deanohdjes, described in the passage as Tsodiqgwadon's
    father; Doonongaes says Deanohdjes' son sent him to a great council at Broken
    Land where all people of the world will be present.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Deanohdjes says he will start in 20 days; Doonongaes returns in 10 days to
    Tsodiqgwadon, and the two set out toward Broken Land with time to detour southward.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Doonongaes and Tsodiqgwadon meet a chief-like man with a large headdress,
    long feathers, much wampum, and a face painted red and black.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Doonongaes wrestles and throws the stranger; Doonongaes and Tsodiqgwadon pull
    him by head and feet until his legs and arms are greatly stretched, and Doonongaes
    says they will call him Gaisonhe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The pair later see an ugly-looking man with wampum around his body sitting
    on a stone and shooting arrows at deer without hitting them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tsodiqgwadon blows on the man's arrow; it goes into the ground, takes root,
    and turns to Ohohwa Ohnoh.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Tsodiqgwadon changes the unsuccessful hunter into an owl.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At midday Doonongaes and Tsodiqgwadon come to a cliff, descend, and find a
    plain or opening with three points and a lodge at each point.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the southern lodge, Doonongaes sees an old Odjieqda man making a wooden
