candidate_motifs:
- id: motif:1
  label: Death and return after dismemberment or flaying
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: Okteondon is killed, flayed, and divided into skin and flesh, but soon after
    the skin pouch escapes he returns alive and well.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not explain the mechanism of Okteondon’s return; it only
    narrates the killing, skin-pouch episode, and his reappearance alive.
- id: motif:2
  label: Dream-demand ordeal
  taxonomy_refs:
  - initiation
  basis: 'Both Kahenchitahonk and Okteondon frame major actions as dreams that require
    fulfillment: killing and skinning the son-in-law, then hunting Ganiagwaihe and
    holding a feast.'
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  confidence: medium
  cautions: The passage presents the dreams as narrative pretexts or demands, but
    it does not explicitly label the events as initiation.
- id: motif:3
  label: Helper spouse preserves the hero through a lethal trial
  taxonomy_refs: []
  basis: Okteondon’s wife warns him of the coming ordeal and performs his instruction
    by placing the bark bowl of flesh on top of the lodge.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The exact causal relation between placing the flesh bowl on the lodge
    and Okteondon’s survival is not stated.
- id: motif:4
  label: Body transformed into animated object
  taxonomy_refs: []
  basis: Okteondon’s flayed skin is sewn into a pouch, inflated, hung over fire, and
    becomes a singing moving object that escapes through the smoke-hole.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The object is animated in the narration, but the passage does not state
    whether it is an independent being or a vehicle for Okteondon’s survival.
- id: motif:5
  label: Retaliatory feast as trap
  taxonomy_refs: []
  basis: Okteondon prepares a feast, sends allies away, invites the old woman’s group
    in, and then traps them inside a magically transformed red-hot stone lodge.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: No external comparison is implied; this is a passage-level pattern.
- id: motif:6
  label: Magical song changes a dwelling into a lethal enclosure
  taxonomy_refs: []
  basis: Okteondon runs around the lodge singing that it and the ground beneath should
    become stone and red-hot; the occupants then cannot escape.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage attributes the transformation to Okteondon’s sung words but
    does not describe a formal ritual beyond the song and circling.
- id: motif:7
  label: Animals emerge from destroyed human bodies
  taxonomy_refs:
  - shapeshifter
  basis: After the trapped people die, their heads burst and owls and foxes spring
    out and run away.
  evidence_refs:
  - ev:11
  confidence: low
  cautions: The passage says animals spring out of the heads, not that the people
    consciously shapeshift; the taxonomy link is therefore uncertain.
- id: motif:8
  label: Luring victims to a cannibal village
  taxonomy_refs: []
  basis: The passage states that sisters in a canoe deceive men across the country
    and lure them to the village to be devoured by the inhabitants.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The provided passage gives this as a summary statement and does not include
    a full scene of the luring.
- id: motif:9
  label: Bones arranged and commanded to rise
  taxonomy_refs:
  - resurrection
  basis: At the lake, Okteondon and companions arrange a heap of men’s bones near
