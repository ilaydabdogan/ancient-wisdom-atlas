canonical_text:
  quote: ''
  summary: 'After an earlier feast, Okteondon’s wife warns him that her mother, Kahenchitahonk,
    will demand a severe ordeal by dreaming that she killed and skinned him and made
    his skin into a pouch. Okteondon tells his wife to place the bowl containing his
    flesh on the lodge roof. The next day Kahenchitahonk kills and flays him, puts
    his flesh in a bark bowl, and sews his skin into a pouch, but the pouch flies
    away through the smoke-hole and Okteondon returns alive. Okteondon then stages
    his own dream-demand: he kills the great Ganiagwaihe, prepares a feast, sends
    his wife and two friends away, and traps the invited villagers and the old woman
    in a lodge that becomes stone and red-hot. The trapped people burn; owls and foxes
    spring from their bursting heads. The passage says the sisters in a canoe had
    lured men to the village to be devoured. Okteondon, his wife, and two friends
    then find a heap of men’s bones by a lake, arrange them near a hickory tree, and
    call for the bones to rise as the tree is pushed toward them.'
  language: English
  quote_policy: summarized
