canonical_text:
  quote: ''
  summary: Gajihsondis practices shooting at a bear's foot as instructed by his uncle.
    Expecting his uncle's return, he tries to prepare the uncle's food with a small
    kettle and a scraped-down substance. By blowing on the kettle and then on the
    mush, he causes the food to expand until it fills the lodge and drives him onto
    the roof. The uncle returns, reduces the mush by blowing on it, and says the boy
    has consumed the food on which he lives. When the boy asks where more can be found,
    the uncle names it Chestnut and describes a dangerous westward path with demoniac
    creatures and beastlike personages possessing evil magic. The boy declares he
    will go to obtain Chestnut and leaves two fastened limbs as a sign of his fate.
  language: English
  quote_policy: summarized
