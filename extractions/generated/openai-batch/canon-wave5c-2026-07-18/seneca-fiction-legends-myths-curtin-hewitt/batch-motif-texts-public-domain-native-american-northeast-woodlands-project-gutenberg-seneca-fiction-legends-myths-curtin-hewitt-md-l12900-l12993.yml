  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: During the night Has'honyot goes to the place where Doonongaes's body lies,
    and the women accompany him because they are tied to him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Has'honyot cleans and washes the wound, puts pounded weed on it, pours water
