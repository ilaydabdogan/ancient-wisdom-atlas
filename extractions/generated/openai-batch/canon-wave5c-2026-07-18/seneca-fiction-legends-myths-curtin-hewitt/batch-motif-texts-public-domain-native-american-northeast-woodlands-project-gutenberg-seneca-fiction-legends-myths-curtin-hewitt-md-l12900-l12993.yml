canonical_text:
  quote: ''
  summary: A visitor asks Has'honyot to use his powerful thing or power to restore
    a killed chief, Doonongaes, to life. Has'honyot demands two beautiful women as
    payment. The community agrees, and the women are tethered to him by his bloodsucker
    attendants. At night he treats the corpse with washing, pounded weed, water, breath,
    tobacco burned to the Complete Power, and songs; after a second performance Doonongaes
    revives. In the morning Doonongaes learns the women were given in exchange for
    his restoration, declares this wrong, and confronts Has'honyot, who refuses to
    release them and draws a flint knife.
  language: English, with transliterated chant phrases
  quote_policy: summarized
