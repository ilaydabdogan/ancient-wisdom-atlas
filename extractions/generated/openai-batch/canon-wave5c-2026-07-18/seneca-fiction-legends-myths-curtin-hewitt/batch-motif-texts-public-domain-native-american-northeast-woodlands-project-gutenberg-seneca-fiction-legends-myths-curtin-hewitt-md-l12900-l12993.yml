- id: obs:2
  text: Has'honyot says he lives on top of rocks to be alone, but after going outside
    he sees level country with many people living around him.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The visiting chief says their chief has been overpowered and killed and asks
    whether Has'honyot will lend the thing with great magical power; Has'honyot says
    he can bring the killed chief to life quickly.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Has'honyot asks for two of the best-looking women as payment; the people discuss
    the demand, and the women say they consent because they want the chief to come
