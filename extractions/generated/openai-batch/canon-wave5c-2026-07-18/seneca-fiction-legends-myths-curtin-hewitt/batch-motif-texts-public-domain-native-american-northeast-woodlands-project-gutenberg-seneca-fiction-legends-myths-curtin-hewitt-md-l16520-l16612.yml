canonical_text:
  quote: ''
  summary: Ot'hegwenhda sees named skeletons destroyed after eating blossoms, consults
    a speaking fetish, follows trails into underground openings, restores groups of
    brothers whose flesh has been eaten, and sends them home. He then avoids and destroys
    winged snakes carried by whirlwinds using a tree, fire, and wind aid. The passage
    ends with his descent through an opening near a birch tree and encounter with
    an old man who intends to test his luck or orenda with a rattle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A skeleton identified as Tsodiqgwadon near the bowl eats a blossom, shakes,
    falls to pieces, and becomes a pile of bones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wind and dust cloud from the east contains the skeleton of Ganiagwaihegowa,
    which eats a blossom, trembles, becomes disjointed, and ends as a heap of bones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaking fetish tells Ot'hegwenhda that all the trails are clear and directs
    him to the end of the southern trail, where he may find his brother.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the southern trail end, Ot'hegwenhda finds an opening in a rock, descends
    underground, and reaches rooms where there is light but no fire.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the southern underground room he finds three brothers whose flesh has been
    eaten; after he rubs them with his spittle, their limbs are covered with flesh
    and they become well and strong.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The three restored brothers go home; their mother cries and drives them away
    because she thinks they are ghosts, while their father is glad to see them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The eastern trail leads to another opening in the ground and dark rooms, one
    lit by rotten wood; there Ot'hegwenhda finds three brothers too weak to move because
    their flesh has been eaten away, restores their limbs with spittle, and sends
    them home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At a northern opening, whirlwinds bring winged snakes; an Onwi strikes a maple
    tree and dies, and later a multitude of winged snakes rush past while Ot'hegwenhda
    shelters by a tree and its roots.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fetish advises making a large fire across the snakes' trail; Ot'hegwenhda
    asks the wind, addressed as his grandfather, to send and then still a breeze,
    and the snakes rush into the fire and are killed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Continuing north, Ot'hegwenhda finds an opening near a birch tree, enters
    an underground room, and meets an old man smoking who calls him nephew and says
    he will test what luck or orenda he has with a rattle made of Dagwanoenyent.
  category: sequence
  evidence_refs:
  - ev:8
