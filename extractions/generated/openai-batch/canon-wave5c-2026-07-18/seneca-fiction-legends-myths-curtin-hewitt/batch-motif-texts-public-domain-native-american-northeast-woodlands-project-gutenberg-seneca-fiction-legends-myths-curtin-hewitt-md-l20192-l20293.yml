canonical_text:
  quote: ''
  summary: 'The passage first recounts a woman escaping a dead man described as a
    vampire or man-eating skeleton, followed by explanations of changes in burial
    practice after frightening encounters with the dead and with a serpent beneath
    a burial chamber. It then begins a sky-world creation account: a chief''s ill
    daughter is placed beside a food-bearing tree, the tree is dug up, she is pushed
    through the opening into a watery world, waterfowl and Turtle receive her, and
    Toad brings soil from beneath the water to form earth on Turtle''s carapace.'
  language: English
  quote_policy: summarized
