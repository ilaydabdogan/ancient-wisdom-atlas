canonical_text:
  quote: ''
  summary: The supplied passage first concludes a previous tale in which Ongwe Hangesha
    hunts and a mother and daughter live peacefully. It then begins the tale of Gajihsondis,
    framed as a legend about control of game animals. An old man raises a very small
    grandson in a lodge, trains him with bow and arrows, sets a raccoon foot as a
    target, and teaches him to say “Gajihsondis” when he hits a target. The grandson
    asks about their kinsmen, learns that they perished at a distant spring where
    a great beast lives, and sets out with his weapons. On the way he crosses a mountain,
    reaches a lake, kills a white waterfowl, retrieves it with a cord made from his
    hair, and carries it home. His grandfather says this is not the proper object
    of vengeance, so the youth returns the animal to its place, commands it to live
    again, and resumes playing near the lodge.
  language: English
  quote_policy: summarized
