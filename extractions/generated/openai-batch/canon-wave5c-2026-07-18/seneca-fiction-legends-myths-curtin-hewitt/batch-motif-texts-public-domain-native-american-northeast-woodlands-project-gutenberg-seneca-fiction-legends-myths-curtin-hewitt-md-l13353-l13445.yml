canonical_text:
  quote: ''
  summary: After being warned by Hostoyowanen to go south to avoid dying, Doonongaes
    travels, sleeps in a hollow tree, sees the reflection of his wife in spring water,
    flees south, weakens from hunger, and changes from a man into a great snake. He
    enters the lodge of a poor old woman and her granddaughter, uses a bow and arrow
    to bring a bear, and later shoots a black eagle perched on a pole reaching to
    the clouds. His arrow proves ownership when only the granddaughter can pull it
    out, leading the chief to summon him to marry the chief's daughter, which he initially
    refuses.
  language: English
  quote_policy: summarized
