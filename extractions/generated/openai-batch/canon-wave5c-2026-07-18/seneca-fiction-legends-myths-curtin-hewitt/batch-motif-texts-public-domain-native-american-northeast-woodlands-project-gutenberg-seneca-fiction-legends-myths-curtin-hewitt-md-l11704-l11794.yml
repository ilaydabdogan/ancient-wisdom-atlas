canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which Turkey Brother sheds his
    turkey-skin disguise, summons his tutelary Moose, and has the Moose rescue his
    captive brother from an old woman and her daughters. It then begins the S''hodieonskon
    Trickster section, describing several deceptions: a false sexual cure for disease,
    a false plague-prevention act involving lodge walls and defecation, a hair-stretching
    trick that kills an imitator, and a fish-spearing trick using sharpened legs that
    wounds the men who imitate it.'
  language: English
  quote_policy: summarized
