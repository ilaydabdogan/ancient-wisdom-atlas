canonical_text:
  quote: ''
  summary: A rapidly growing boy returns from a thunderstorm and says his father Hinon
    took him home. As he grows, he makes thunder and helps Hinon. After learning that
    six aunts lost their heads in a distant dice game, he travels west to the gambling
    place. He defeats an old woman in a dice contest using his own plum-stone dice,
    which become ducks, while her dice become crows. He then defeats her son in ball
    play seven times, and the old woman and son are beheaded. He brings his grandmother
    and the people to live at the former gambling place; the grandmother dresses in
    the dead old woman's clothes and looks young. Later he goes away with Hinon for
    the winter.
  language: English
  quote_policy: summarized
