canonical_text:
  quote: ''
  summary: An old woman receives dream instructions from the Corn Maiden, plants and
    distributes corn seed, and is told to warn people not to waste or neglect corn.
    A Stone Giant abducts the Corn Maiden, but another brother pursues and rescues
    her. On return she orders a feast from a single grain of corn, teaches Corn dances
    and a song naming corn, beans, and squashes as mothers of peoples, departs back
    along the river to her home, and later marries Sumac Tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old woman treats a dream or vision as an instruction about the corn found
    on the riverbank, plants it, and follows the Corn Maiden's directions for tending
    it so weeds do not choke it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In autumn the old woman harvests the corn, divides it into portions matching
    the number of village families, and gives portions to chief matrons with instructions
    for spring seed, planting, and cultivation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Corn Maiden says human beings are her children and tells the old woman
    to warn them not to waste mature corn.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Corn Maiden says those who do not honor and care for her come to want
    and destitution, and that if they fail to act properly she will take away all
    corn and other seed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old woman warns her nephew that roaming beings can overcome and destroy
    men by orenda; the nephew denies that anything roaming about can kill men.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A very tall brother of the Corn Maiden comes to the lodge, asks her to come
    out, lifts her in his arms, examines a stone ax and flint arrowhead, asks whether
    such things can kill a person, and carries her away captive.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The captive Corn Maiden sings to the elder brother, challenging his earlier
    claim that nothing roaming about has the power to kill persons.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Another brother of the Corn Maiden takes a stone ax, bow, and arrows, asks
    his grandmother to follow, pursues the Stone Giant, shoots him with a flint arrow,
    and brings the younger sister back.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After being shot, the Stone Giant weeps with pain, confesses guilt in stealing
    the maiden from her home, and surrenders her to her brother.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After arriving home, the returned young woman tells her grandmother to make
    bread from one grain of corn, saying it will suffice to feed all human beings
    at a banquet celebrating her return.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Maiden announces a feast in her own honor and says the women shall dance
    the Corn dances.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The feast is held as she wishes, women dance the Corn dances, and all the
    people rejoice with her.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the thanksgiving feast, the Maiden says she is returning to her home,
    that corn will exist forever, and that mankind will never again die from starvation.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Maiden goes back along the river on which she had come, singing words
    to teach the people what to sing in their Corn dances.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Her song says that the varieties of corn, beans, and squashes are the mothers
    of the peoples of the whole world.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: After returning home, the Corn Maiden receives and accepts a marriage proposal
    from O'stawe'^sSn'to, identified as Sumac Tree, and the two are married.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: The Corn Maiden tells her husband to love or regard her as a precious thing,
    and he assures her that he will comply.
  category: speech
  evidence_refs:
  - ev:10
