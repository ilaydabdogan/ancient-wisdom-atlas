canonical_text:
  quote: ''
  summary: The passage is an introductory discussion of mythic thought, describing
    personification of natural bodies and forces, an example involving snow, the God
    of Winter, and the Master or God of Life, the socialization of such personifications
    into epic figures, named Seneca narrative groups, the dramatization of truth in
    narratives and ritual forms, and creation myths concerning elder or first people
    later called gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes mythic mentation as a mental process through which people
    apprehend life and nature and harmonize these with experience, subconscious activity,
    and visionary promptings.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The initial step described is the imagination personifying and ideally humanizing
    bodies, elements, and forces of surrounding nature.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage gives an example in which Iroquois and Algonquian people picture
    snow as the living body of a man formed by the God of Winter.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The God of Winter's breath is described as powerful enough to drive animals
    and birds into winter retreats, with some entering hibernation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The animals' seasonal retreat is represented as hiding from the brother figure
    called the Master or God of Life.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The next step described is the socialization of the personified company by
    imputing life, soul, purpose, and rational roles to them; the passage says this
    constitutes the epic.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that Seneca-Iroquoian myths and legends are treated as
    a basis of religious expression and argues that myths are fictitious in form but
    true in matter and spirit.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some personifications of nature are described as becoming so humanlike that
    they act as thaumaturgic fetishes of powerful sorcerers and perform feats of orenda.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Curtin collection is described as including narratives about Genonsgwa,
    Hi'no, Dagwanoenyent, Shagodiioweq, and Djogeon, with counts given for each group.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says it is probable that two wind-people groups arose from a single
    personage and that present-day storytellers created large bodies of fictitious
    people from single personages such as Thunder, Wind, and Cyclone or Whirlwind.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says truth was dramatized in saga, legend, myth, formulas, rites,
    ceremonies, customs, and material symbols based on narratives.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: A deity embodying a recurrent natural process or changeless feature of the
    universe is described as humanly conceived but limitless in power, incomprehensible
    in life and action, and enduring without beginning or end.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage describes American Indian Genesis or Creation myths as relating
    activities and exploits of elder or first people later called gods, explaining
    how the present order of nature arose.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage states that these creation narrations do not concern human beings
    as such and do not treat events since humans appeared on earth.
  category: other
  evidence_refs:
  - ev:9
- id: obs:15
  text: The gods and deities of ancient Seneca and other Iroquoian peoples are described
    as human in form and feeling and yet divine.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:16
  text: The passage says divine social and political organization is a close reflex
    or replica of human organization, that gods and humans derive descent from an
    original first parent, that the first divine ancestor is self-existing, and that
    the first man is the creature of one of the divine Powers.
  category: relationship
  evidence_refs:
  - ev:10
