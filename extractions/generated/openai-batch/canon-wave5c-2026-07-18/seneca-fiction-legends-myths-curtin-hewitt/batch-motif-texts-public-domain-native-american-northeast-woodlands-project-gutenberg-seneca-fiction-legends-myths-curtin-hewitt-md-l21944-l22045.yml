canonical_text:
  quote: ''
  summary: A younger brother who boasts of being fleet-footed tells his elder brother
    that a strange man has challenged him to a two-day race with life at stake. The
    elder brother laments that the boast has brought misfortune and fears the challenger
    may not be human. The younger brother prepares with moccasins and parched corn,
    meets the stranger at midday, chooses to run eastward, races through the day,
    camps at night with fires and food, devises a plan to run through thickets, and
    resumes the race the next morning.
  language: English
  quote_policy: summarized
