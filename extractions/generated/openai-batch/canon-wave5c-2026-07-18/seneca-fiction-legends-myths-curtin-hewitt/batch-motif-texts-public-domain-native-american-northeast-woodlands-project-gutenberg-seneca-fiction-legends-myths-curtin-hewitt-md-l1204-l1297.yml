canonical_text:
  quote: ''
  summary: 'The passage explains an interpretive framework for Seneca and related
    Iroquoian myths and legends: deities arise from attributing human mind and life
    to things and processes; gods or first people teach arts, crafts, culture, and
    faith through dreams, visions, and theophanies; nonhuman personified natural processes
    may later be represented as human heroes; named beings such as Flying Heads, Stone
    Coats, and the Wind God belong to mythic or legendary narratives; oral legend
    differs from written history; and sacred legends about first people or gods are
    subject to seasonal telling taboos whose violation is punished by the first people,
    though some storytellers attribute the penalty to animals.'
  language: English
  quote_policy: summarized
