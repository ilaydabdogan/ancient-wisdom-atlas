canonical_text:
  quote: ''
  summary: A youth rejects an artificial substitute for the object required by his
    dream word. By singing an exchange song he causes flames to rise around his uncle,
    forcing the uncle to reveal and give him a squash from a patch hidden under the
    uncle's bed. The youth then consults another uncle's protruding skull, which identifies
    the squash and reveals that the youth's sister is also hidden in a bark case under
    the living uncle's bed. The skull instructs the youth to repeat the dream-word
    demand with a large fire and strong orenda. The youth prepares the fire; the uncle
    tries to guess the desired object by naming possessions. The youth repeatedly
    sings, flames rise, and the uncle pleads while the youth controls the flames.
  language: English translation with transcribed Seneca song phrases
  quote_policy: summarized
