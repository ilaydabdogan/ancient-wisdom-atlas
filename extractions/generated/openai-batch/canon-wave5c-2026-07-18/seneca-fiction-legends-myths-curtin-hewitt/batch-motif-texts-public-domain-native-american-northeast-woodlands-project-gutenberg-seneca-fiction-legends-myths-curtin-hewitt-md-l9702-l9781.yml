canonical_text:
  quote: ''
  summary: Ganyadjigowa wakes from a dream in which Dahdahwat chases, seizes, and
    bites him. Hungry, he goes out on a lake in a canoe to fish, becomes disoriented
    after catching a fish, and reaches an unfamiliar shore. At night he finds a hut
    in the woods and overhears the old man Gaasyendiet'ha boasting of great magic
    power, world-knowledge, running, flying, and appointment as chief under the Blue
    Sky. Ganyadjigowa enters, denies and rephrases hostile remarks about stones, laughs
    when Gaasyendiet'ha partly believes him, insists on staying, and repeatedly questions
    the old man while he smokes by the fire. The passage ends as Ganyadjigowa asks
    cosmological questions.
  language: English
  quote_policy: summarized
