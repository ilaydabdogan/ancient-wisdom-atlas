canonical_text:
  quote: ''
  summary: Okteondon brings a bird to the lodge, has it cooked, and invites the Dagwanoenyents
    to an eat-all feast. The old witch Kahenchitahonk becomes angry and strikes the
    guests. After a dream concerning a second ordeal, Okteondon uses his wife's hair
    string to keep the door-flap swinging, challenges beings in a lake, kills the
    White Beaver, returns with it, and prepares another eat-all feast for the Dagwanoenyents.
  language: English
  quote_policy: summarized
