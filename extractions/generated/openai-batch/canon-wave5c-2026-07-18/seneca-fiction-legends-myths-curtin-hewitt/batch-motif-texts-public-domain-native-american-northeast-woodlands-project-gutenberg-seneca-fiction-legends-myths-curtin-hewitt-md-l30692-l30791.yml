  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'After the men lie down, the awake chief hears a midnight speaker say the
    prayers have been heard and give instructions: go to the ridge by the cliff edge,
    lie still, do not keep the valley agreement, watch for a running bear on the opposite
    cliff, shout the prescribed words, retreat a short distance, and listen for the
    enemy sound.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The men follow the instructions by going to the cliff and lying down as directed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The enemies, called Genonsgwa, come through the valley with their chief singing,
    and the warriors see a bear running along the opposite cliff edge.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the sight of the bear, the chief shouts the instructed formula, the men
    retreat a short distance, stop, and look back toward the valley.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the Genonsgwa have entered the valley, the sides of the valley fall into
    it, carrying forests with them; the marching sounds cease and are replaced by
    crashing trees.
  category: sequence
  evidence_refs:
  - ev:6
