canonical_text:
  quote: ''
  summary: A scout from a small party encounters nonhuman enemies with stone garments
    and is challenged to a fight in a deep valley. The party's chief offers native
    tobacco on the fire and prays to the maker of their lives for help. At midnight
    a divine voice gives tactical instructions involving a cliff, a bear as a signal,
    and a shouted formula. The men obey; when the Genonsgwa enter the valley, the
    valley sides collapse and bury them. The Creator, identifying himself as Our Master,
    says the request has been granted and instructs the Seneca people to cease their
    present violent course and settle differences.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A spy reconnoiters shelters or lodges and finds sleepers with garments hanging
    or set near the structures; in one case the garments are described as stone and
    set against nearby trees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One sleeper rises, asks the spy what he is doing and what he wants, and the
    spy answers that he wants peace and intends nothing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sleeper says the spy and his companions intend to kill people who fall
    into their power and arranges a midday fight in a deep valley with high cliffs,
    with each combatant entering from an opposite entrance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The spy reports to his companions that he saw beings who had human forms and
    actions but were not human, that their clothes were stone, and that they were
