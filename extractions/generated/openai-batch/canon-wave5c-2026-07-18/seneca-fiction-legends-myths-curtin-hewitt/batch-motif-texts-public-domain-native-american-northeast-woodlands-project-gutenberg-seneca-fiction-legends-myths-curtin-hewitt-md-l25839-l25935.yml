canonical_text:
  quote: ''
  summary: After a meal, Hodadenon is left alone while his elder sister fetches fuel.
    He hears a hidden man in the loft asking for tobacco, finds him with a large head
    and enormous hair, and gives him all the remaining tobacco in a pipe. Smoke fills
    the man's hair and many mice emerge. The sister returns, rebukes Hodadenon for
    using the tobacco, and explains that the man smoked only at long intervals and
    lived on it. She reveals that tobacco grows in a distant place full of female
    sorceresses where many of their kin and brothers have been lost. Hodadenon insists
    on attempting to get tobacco, asks for provisions and a wrapped bundle, delays
    his departure once, and then receives southward path instructions involving old
    fire sites and bread fixed to forked rods.
  language: English
  quote_policy: summarized
