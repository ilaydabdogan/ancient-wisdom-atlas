canonical_text:
  quote: ''
  summary: An old woman learns of an attack plan and goes with her grandson to recover
    his sister from the belly or body of a dead Yenonsgwa. She burns tobacco and calls
    Dagwanoenyentgowa relatives, whose collective tobacco ritual brings the girl out
    and restores her strength. Later a Yenonsgwa scouts the lodge, and the old woman
    summons more Dagwanoenyentgowa relatives. Armed with stones, they fight numerous
    Yenonsgwa, lure them to a mountain, attack from multiple sides, and drive them
    into a ravine and river while hurling trees, stones, and earth after them.
  language: English
  quote_policy: summarized
