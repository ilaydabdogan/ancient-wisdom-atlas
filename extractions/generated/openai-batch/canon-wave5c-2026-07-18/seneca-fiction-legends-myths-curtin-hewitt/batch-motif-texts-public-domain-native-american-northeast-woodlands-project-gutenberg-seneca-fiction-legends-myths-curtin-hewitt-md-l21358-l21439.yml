  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the tobacco ritual, the young girl starts up inside the Yenonsgwa's
    body, pants for breath, walks out, asks how long she has been there, smokes tobacco,
    and regains full strength.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A Yenonsgwa visits the old woman's lodge, speaks pleasantly, learns that only
