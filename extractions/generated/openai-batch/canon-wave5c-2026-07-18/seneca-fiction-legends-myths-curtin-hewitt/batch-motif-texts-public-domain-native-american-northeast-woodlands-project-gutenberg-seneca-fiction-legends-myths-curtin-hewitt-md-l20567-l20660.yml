canonical_text:
  quote: ''
  summary: A hunter stays with a young woman as her husband despite her troublesome
    grandmother. The grandmother beats the young woman, tries to smother the hunter
    under an airtight skin, and later strands him on an island where night waters
    rise and monsters wait. The hunter survives through a hidden false-face fetish,
    climbs a tree, prays to the Morning Star, and is saved when daylight comes and
    the waters subside. He then hides in sand, steals the grandmother's canoe when
    she returns seeking his bones, and leaves her on the island. As night waters rise
    around the grandmother, she climbs a pine and calls on the Morning Star; the passage
    ends before the answer is given.
  language: English
