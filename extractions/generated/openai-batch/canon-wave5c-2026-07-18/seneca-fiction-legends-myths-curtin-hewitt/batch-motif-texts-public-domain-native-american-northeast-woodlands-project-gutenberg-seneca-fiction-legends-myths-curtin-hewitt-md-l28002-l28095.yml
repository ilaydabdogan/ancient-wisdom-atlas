  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: The old woman says her preparations are complete and instructs the travelers
    to begin their homeward journey, accompanied partway by the men of the lodge.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The return route is to pass the place where the Light Orb that travels by
    day abides.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: The hosts identify a nearby lodge as the lodge of the Sun, from which he starts
