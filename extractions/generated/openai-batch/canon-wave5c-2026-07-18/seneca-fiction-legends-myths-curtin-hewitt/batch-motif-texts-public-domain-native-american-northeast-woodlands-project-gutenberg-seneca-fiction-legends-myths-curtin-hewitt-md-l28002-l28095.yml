canonical_text:
  quote: ''
  summary: An old woman in the upper world instructs Dehaenhyowens and his party to
    tour the upper world before returning home. She explains that she weaves a mantle
    from one hair sent to her whenever a human dies below, while a small cur undoes
    her work. The travelers view an abundant upper-world landscape, see shades, and
    learn of Dehaenhyowens's dead mother and relations. They are then sent home with
    Thunder escorts, visit the Sun's lodge, and, after a Thunder-associated singer
    begins his function, the returning humans see the earth below and hear people
    announce the beginning of spring.
  language: English
  quote_policy: summarized
