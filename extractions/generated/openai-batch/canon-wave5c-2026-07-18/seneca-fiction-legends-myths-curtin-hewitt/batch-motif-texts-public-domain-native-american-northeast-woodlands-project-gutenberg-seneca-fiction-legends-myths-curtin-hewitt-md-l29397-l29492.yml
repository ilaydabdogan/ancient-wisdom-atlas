canonical_text:
  quote: ''
  summary: A fugitive hiding at a cavern is discovered by two women from a lodge.
    Their brother welcomes him, gives him food and safety, and arranges his marriage
    to the elder sister. After about fifteen years and several children, the brother-in-law
    tells him to return with his wife and children to the place from which he fled.
    The family emerges into a forest, settles among hunters, and is recognized as
    Porcupine clan people of the Waii'dat. Their descendants become numerous and prosperous,
    skilled in hunting and seasonal gathering, including the harvest of wild pigeons,
    understood as nature's bounty and a gift of the Master of Life.
  language: English
  quote_policy: summarized
