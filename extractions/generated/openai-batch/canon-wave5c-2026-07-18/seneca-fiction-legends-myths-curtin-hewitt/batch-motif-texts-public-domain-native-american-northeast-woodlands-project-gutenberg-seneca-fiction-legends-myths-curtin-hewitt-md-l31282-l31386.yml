  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Near the pigeon roost, people collect ornaments and trinkets as gifts, place
    them in a bark bowl, carry them into a swampy forest place, spread them on elm
    bark, burn native tobacco, and make an invocation to the pigeons and their Maker.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the first hunting expedition, some people go around the painted rod and
    others withhold gifts from the offering; accidents, sickness, and deaths follow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After Wild Cat questions the people, he says they have brought the ills on
    themselves and urges strict observance of White Pigeon's rules; the next season,
