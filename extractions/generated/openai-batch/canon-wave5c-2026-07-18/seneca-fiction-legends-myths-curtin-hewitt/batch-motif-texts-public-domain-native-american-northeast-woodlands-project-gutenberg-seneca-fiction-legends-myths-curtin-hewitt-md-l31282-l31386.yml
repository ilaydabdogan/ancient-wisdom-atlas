  text: A White Pigeon visits old man Wild Cat's lodge, behaves quietly, and flies
    away; Wild Cat tells neighbors the visit portends something unusual, though a
    year passes without incident.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the same season the next year, the same White Pigeon visits again, and
    Wild Cat treats him as a man or one of his own kind of beings and converses with
