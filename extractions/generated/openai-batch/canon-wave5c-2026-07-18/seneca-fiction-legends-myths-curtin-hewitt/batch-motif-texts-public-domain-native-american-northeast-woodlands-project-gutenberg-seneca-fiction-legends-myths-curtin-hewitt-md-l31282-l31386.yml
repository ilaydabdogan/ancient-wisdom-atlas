- id: obs:3
  text: White Pigeon reports that the various tribes of birds held a council and decided
    that wild pigeons should furnish a tribute to mankind, with their Maker having
    selected the wild pigeons for this duty.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage explains that pigeons nest and rear young in a single community,
    and that they are to spare some of their young to humans for food.
  category: attribute
  evidence_refs:
