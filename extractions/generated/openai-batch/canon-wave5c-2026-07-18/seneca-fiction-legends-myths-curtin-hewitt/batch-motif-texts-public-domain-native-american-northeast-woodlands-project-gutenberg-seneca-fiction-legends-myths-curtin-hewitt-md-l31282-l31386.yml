canonical_text:
  quote: ''
  summary: A White Pigeon visits old man Wild Cat and later returns to explain that
    the bird tribes, with the Maker's selection of the wild pigeons, have decided
    that pigeons will provide some of their young as food for humans. White Pigeon
    gives rules for a seasonal communal pigeon hunt, including a master of the hunt,
    a painted rod boundary during halts, and offerings of ornaments and tobacco near
    the roost. The first expedition disobeys and suffers accidents, sickness, and
    deaths; later obedience brings orderly hunts for twenty years. Factions then reject
    the rules, kill pigeons indiscriminately, or refuse pigeon meat, after which disease
    and death increase among them.
  language: English
  quote_policy: summarized
