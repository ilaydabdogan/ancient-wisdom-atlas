canonical_text:
  quote: ''
  summary: 'The passage closes one narrative with the younger of two brothers killing
    a chief associated with man-eaters, freeing captive carnivorous animals under
    Hawenniyo''s authority, accepting chieftainship with his brother, and returning
    home after saying the western man-eaters are destroyed. A new tale headed as Bald
    Eagle sending Mud Turtle around the world begins: a bald-headed old man-chief
    lives on a mountain, fishes at a lake near his wife and children, wants to know
    the world''s size, calls a council, and sends a young volunteer who reaches an
    all-white country that hurts his feet and turns back.'
  language: English
  quote_policy: summarized
