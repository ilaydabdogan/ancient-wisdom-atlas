canonical_text:
  quote: ''
  summary: Doonongaes accepts an old man's head-wager footrace, secretly copies the
    old man's use of a milk-like fluid from a living lizard-shaped object, wins the
    race, and cuts off the old man's head. He travels north, changes into a long horned
    snake for travel and danger, avoids Hinon during a thunderstorm, and crosses water
    in snake form. He pursues an elusive woman to a lodge where her grandfather, named
    Cyclone, treats him as game and chases him with a flint knife while healing his
    self-inflicted wounds with spittle. Doonongaes turns into a snake, tears Cyclone
    apart, and turns his body parts into owls and other birds. He then lives for a
    month with the woman, Ganos, before continuing north to the cold edge of the earth,
    where another old man appears.
  language: English
  quote_policy: summarized
