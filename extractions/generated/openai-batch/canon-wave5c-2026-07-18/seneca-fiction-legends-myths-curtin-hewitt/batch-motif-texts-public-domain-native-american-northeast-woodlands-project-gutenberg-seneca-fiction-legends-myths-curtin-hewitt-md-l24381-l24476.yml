canonical_text:
  quote: ''
  summary: A young woman falsely accuses the youngest brother after he refuses her.
    His brothers try and fail to kill him; he says only his sister has enough orenda
    to kill him, instructs them to enclose his body and living sister in a massive
    log lodge, is beheaded by the sister, revives during a witch-caused storm, and
    is blinded despite his sister covering his eyes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young woman, angered by the youth's refusal, goes into briers and thorns
    and badly lacerates her legs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young woman tells her husband that his youngest brother attempted to assault
    her and shows her torn, blood-stained legs as confirmation.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The brothers decide that it is their duty to kill the youngest brother, and
    the youth, knowing he is innocent, lies down silently for them to kill him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The eldest brother and then the other brothers try to cut the youngest brother's
    throat with flint knives, but the knives do not cut him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The youngest brother says the brothers lack the orenda to kill him and that
    only his sister has such potency.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The youngest brother instructs the others to build a massive log lodge, place
    his body and living sister inside it, put his head in the correct position, and
    seal the lodge with logs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The sister beheads her brother with a flint knife in sorrow, and the six brothers
    enclose her alive with the body in the log lodge.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the brothers return to their camp, the eldest brother's bride has mysteriously
    disappeared without visible traces of enemy attack.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A terrific hurricane and windstorm arises and is attributed to the witch Gaho'dji'da'ho'k,
    mother of the missing bride.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: During the storm, the youngest brother's head reunites with his body and he
    comes to life.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The revived brother tells his sister to cover both his eyes with her hands;
    the storm destroys trees and the camp of the six brothers, while the log lodge
    remains intact.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: After the storm, the brother's eyes are gone despite the sister's hands, and
    he says Gaho'dji'da'ho'k has overmatched his sorcery and orenda.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The brother asks his sister to remove the roof of logs so they can leave the
    lodge.
  category: action
  evidence_refs:
  - ev:11
