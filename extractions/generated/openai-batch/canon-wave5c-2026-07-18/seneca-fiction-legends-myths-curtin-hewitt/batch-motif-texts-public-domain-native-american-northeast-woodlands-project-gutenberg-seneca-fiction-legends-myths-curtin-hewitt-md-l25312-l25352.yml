canonical_text:
  quote: ''
  summary: A boy and his sister continue traveling during a snowstorm, take shelter
    beneath interlocked fallen trees, make a fire, and obtain quail for food. A solitary
    old woman sees smoke from the snowbank, rescues the children, feeds them, and
    asks them to stay as her own children. The next morning the boy spits on an arrow
    three times, casts it through the smoke-hole, and commands it to hunt and kill
    a deer for food.
