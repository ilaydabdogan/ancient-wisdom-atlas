  summary: An old male figure directs a youthful male to go, look, turn, and return;
    he works upon or examines the youth in a passage whose interlinear gloss is partially
    unclear. The old one gives or announces the name Dooa'dane'ge' and says the name
    is famous in connection with peoples, hunters, and game. Two female figures, described
    as elder and younger maidens or sisters, respond to the handsome youth with gratitude,
    marriage language, and affection. Later the youth lies down between them; one
    female remains awake through the night watching him while he sleeps. At daybreak
    the two maidens arise, prepare food, cook it, and eat.
