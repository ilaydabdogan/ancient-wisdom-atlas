canonical_text:
  quote: ''
  summary: A boy receives permission and equipment for a journey with an old man.
    After several days they reach a broad lake, make a bark canoe, and are carried
    by a rapid current to dry land, where a decorated guide leads them to a long lodge
    of the Hinon. The Hinon identify themselves as rain-bringers for crops, say they
    have summoned the travelers because of their powerful orenda, explain that they
    take the spirit of crops from fields, and propose an expedition against a giant
    porcupine on a great hemlock tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy asks his mother whether he may go; she permits him and gives him new
    moccasins for the journey.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy's friend washes him, trims his hair, paints his face, adds new feathers
    to his headdress, and gives him a new bow and arrows.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy and his friend set out together, travel by day, and at night make
    a fire in the woods, eat, and sleep.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After five days of travel, they reach a lake so broad that the other shore
    cannot be seen.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old man strips bark from a large bitternut hickory tree and makes a large
    canoe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The travelers put bows, arrows, and fur robes into the canoe and cross the
    lake, with the boy in front and the old man paddling in the stern.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Near a low island, they fasten the canoe to bulrushes without landing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boy worries about safety on the water; the old man says there are fish
    and evil things in the water reaching from the bottom up to the home of the Master
    of Life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: At midnight the boy hears rushing water, senses the canoe moving quickly,
    finds the weather calm, and discovers that the water is running very fast.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old man tells the boy to lie down and says no harm will come to either
    of them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: At daybreak a voice speaks to the boy; he sees a decorated middle-aged man
    at the bow, and the canoe is on dry land.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The decorated man rouses the old man, tells him to come, and guides both travelers
    with their equipment to a long lodge containing many persons.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: An elder in the lodge says the people are Hinon, bring rain for corn, beans,
    and squashes, sent their young man to the island, and put the thought of coming
    east into the travelers' minds.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Hinon elder says the travelers are powerful in orenda and asks them to
    help kill enemies of both the travelers and the Hinon.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Hinon serve corn, beans, and squashes, and say they take the spirit or
    part of crops from many fields, leaving shells, husks, withered plants, or sometimes
    an entirely blasted field.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: The youngest warrior describes an immense hemlock tree on a hill where a terrible
    giant porcupine lives; its quills are as large as long darts and kill those who
    approach.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: The Hinon say they cannot kill the porcupine and are afraid to go near the
    tree.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:18
  text: The boy walks ahead with his little bow and arrows as the group approaches
    the tree; the others stop at a distance, and the old man jokingly suggests that
    the boy try first.
  category: sequence
  evidence_refs:
  - ev:11
