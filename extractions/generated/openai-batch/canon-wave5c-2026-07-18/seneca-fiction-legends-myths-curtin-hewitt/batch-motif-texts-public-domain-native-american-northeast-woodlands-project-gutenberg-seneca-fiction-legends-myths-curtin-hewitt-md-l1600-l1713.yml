canonical_text:
  quote: ''
  summary: Opening portion of “The Sister and Her Six Elder Brothers.” A sister and
    six elder brothers live in an east-west lodge. The eldest brother marries a young
    woman, gives her instructions about crossing the fire and using doorways, and
    after she disregards the instruction he suffers a hunting accident. The wife departs
    and blinds the pursuing brothers with her skin robe. The young sister cares for
    the blinded brothers until canoe-borne boys persuade her aboard and carry her
    far away to an island lodge, where another captive girl warns that they may be
    killed and eaten.
  language: English
