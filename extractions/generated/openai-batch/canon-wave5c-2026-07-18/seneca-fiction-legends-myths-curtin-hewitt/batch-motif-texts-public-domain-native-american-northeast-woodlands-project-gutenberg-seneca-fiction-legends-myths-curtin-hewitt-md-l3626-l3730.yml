canonical_text:
  quote: ''
  summary: The passage narrates two sisters being warned how to find a chief's son,
    an old uncle deceiving them by resembling him, the sisters discovering and outwitting
    the uncle, the uncle killing and replacing the nephew as chief, and the sisters
    escaping. It then begins a separate tale in which a hunter torments and burns
    a rattlesnake while challenging the snake people to fight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two sisters agree to go if both can be accepted, and they prepare the usual
    marriage bread before setting out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Their mother describes the intended young man as handsome, hook-nosed, magically
    powerful, and associated with living deer heads by the fire and many wild deer
    around his lodge.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother warns that the young man's uncle also has a hooked nose, closely
    resembles him, and will try to seduce the sisters on the way.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The sisters meet an old man near old stumps; a mouse tail protrudes from his
    mouth when he sees them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old man asks where the sisters are going and what the chief's son looks
    like, then points to his own hooked nose to persuade them that he may be the man.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The old man brings the sisters to an old, ugly-looking lodge and gets old
    deer heads that his nephew had cast away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The old man's little boy asks for bread, and the old man tells him to call
    him brother rather than father.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: When the sisters ask to see the live deer, the old man calls the deer, but
    they run away; he says the sisters are not mystically pure enough to approach
    them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The old man has a poor bed with few skins and explains this by saying his
    mother is washing a turkey-feather blanket in the creek.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: After the old man is summoned to his nephew's lodge, the sisters look through
    bark-wall crevices and see him dancing while mice roast on spits before the fire;
    he eats the hot mice as people laugh.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The sisters return to the old man's lodge and place rotten logs full of ants
    in their bed to make him think they are asleep there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The old man lies between the ant-filled logs, is bitten, speaks as if the
    sisters are in the bed, then discovers the logs and blames his mother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The sisters go to the nephew's lodge, and he willingly takes them as wives.
  category: action
  evidence_refs:
