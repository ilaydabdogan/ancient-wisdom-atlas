canonical_text:
  quote: ''
  summary: Ot'hegwenhda frees fleshless captives from a hidden room under a lodge,
    sends groups back toward their homes, erases deceptive trails, reconciles his
    family, crosses Rough Lake on a commanded piece of slate, defeats the blood-mouthed
    man-eater Djiniondaqses in a fight that reduces both combatants to skulls, reconstitutes
    his own body, and receives the chief's daughter for future marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man and his wife welcome Ot'hegwenhda and say they want him to be powerful
    because many people are under their lodge and need to be freed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ot'hegwenhda passes through an opening into a very large room and finds a
    multitude of people without flesh and almost dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: He rubs the captives with spittle, cures them, brings them out, and tells
    them they are free.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Several liberated parties name their places of origin and receive directions
    for travel away from the lodge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man and woman who had guarded the captives say Dewaqsent'hwus had forced
    them to capture and confine people for him to eat.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ot'hegwenhda commands that all trails disappear so that trails will not deceive
    people across the world, and the trails vanish.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At his own lodge, Ot'hegwenhda finds his father and nine brothers outside;
    his father says the mother drove them out, and after Ot'hegwenhda speaks with
    her, she invites them in.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ot'hegwenhda says he must visit his friends, the Djoqgweani, and his family
    lets him go because he possesses the most potent orenda.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Rough Lake, Ot'hegwenhda puts a piece of slate on the water, asks it to
    take him across, and the slate carries him quickly to the other side.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Dionondadenion, Honigoneowanen says an old man resembling Ot'hegwenhda
    is eating his people, and Ot'hegwenhda says he will kill that man.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Djiniondaqses enters with fresh blood on his mouth and fights Ot'hegwenhda
    until both have lost flesh, then fight as skeletons, and finally as skulls.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The skull of Djiniondaqses is crushed, while Ot'hegwenhda's skull remains
    sound and rolls until his bones, flesh, and blood reattach and he stands well
    again.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: Honigoneowanen thanks Ot'hegwenhda, gives him his daughter for future marriage,
    and Ot'hegwenhda takes her to Hetgen Tgastende.
  category: sequence
  evidence_refs:
  - ev:10
