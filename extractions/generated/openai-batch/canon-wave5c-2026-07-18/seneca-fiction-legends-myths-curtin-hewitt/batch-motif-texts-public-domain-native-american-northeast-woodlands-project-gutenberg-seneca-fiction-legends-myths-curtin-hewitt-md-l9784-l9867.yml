canonical_text:
  quote: ''
  summary: Ganyadjigowa repeatedly questions Gaasyendiet'ha about traditional claims
    concerning the Turtle supporting the world, Hawenniyo, named beings, wind, rain,
    water, trees, and consequences for refusing to answer. Gaasyendiet'ha grows angry,
    strikes and expels him, pursues him after he wishes for power to make wind damage
    the lodge, and continues debating the earth, water, and Turtle cosmology.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gaasyendiet'ha looks at Ganyadjigowa, does not answer, and keeps smoking while
    Ganyadjigowa asks about the world standing on the Turtle's back and Hawenniyo
    making things of the world.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ganyadjigowa asks whether old people say Dagwanoenyent is still alive, whether
    wind goes everywhere, whether Hinon makes rain, whether trouble comes to those
    who do not answer, and whether Hanisheonon is alive.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Gaasyendiet'ha repeatedly becomes angry, threatens to throw Ganyadjigowa out,
    picks up a club, and begins to strike him while Ganyadjigowa begs and promises
    quiet.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Ganyadjigowa laughs and says that whenever he says anything, people become
    cool.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the middle of the night, while Gaasyendiet'ha sits by the fire smoking,
    Ganyadjigowa asks whether water runs day and night and whether trees grow.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: When Gaasyendiet'ha questions him, Ganyadjigowa denies that Hawenniyo is alive
    or makes anything, denies that wind goes everywhere, and says water stops at night.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Gaasyendiet'ha says he believes Hawenniyo is alive, that Hawenniyo made the
    woods, that wind blows over the world, and that water runs all the time.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Gaasyendiet'ha points eastward to a high mountain and says Ganyadjigowa cannot
    stand there; Ganyadjigowa says he can.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ganyadjigowa asks whether trouble will come if he says something and is not
    heeded; Gaasyendiet'ha replies that Ganyadjigowa must die before him, and Ganyadjigowa
    says other things will make trouble.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Gaasyendiet'ha seizes Ganyadjigowa by the hair, pushes him outside, refuses
    to let him back in, and threatens to kill him if he does not go away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After leaving, Ganyadjigowa thinks that Gaasyendiet'ha treated him badly and
    wishes he had magic power to blow down Gaasyendiet'ha's lodge.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Gaasyendiet'ha follows Ganyadjigowa; Ganyadjigowa hides in a hollow tree,
    then comes out thinking he was not seen, but Gaasyendiet'ha follows again and
    says he will kill him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Gaasyendiet'ha and Ganyadjigowa dispute whether Ganyadjigowa had spoken of
    a heavy wind blowing away the lodge.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Gaasyendiet'ha questions Ganyadjigowa about whether the earth can go down
    into the water and whether the earth is on the Turtle's back; Ganyadjigowa first
    denies this and says the earth is very thick.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: Gaasyendiet'ha says he believes the Turtle is strong enough to keep the earth
    up and that, when the Turtle gets tired, the earth will sink down; Ganyadjigowa
    then says this is what he believes.
  category: speech
  evidence_refs:
  - ev:11
