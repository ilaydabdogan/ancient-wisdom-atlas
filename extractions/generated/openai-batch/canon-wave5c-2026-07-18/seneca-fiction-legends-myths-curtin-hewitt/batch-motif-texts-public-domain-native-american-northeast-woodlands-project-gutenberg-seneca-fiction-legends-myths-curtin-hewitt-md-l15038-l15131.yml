canonical_text:
  quote: ''
  summary: A youth secretly travels north to a fourth uncle's lodge, accepts a head-wager
    bone-dice game, borrows six ducks' right eyes as magical dice, wins, decapitates
    and burns the old man, and restores the eyes to the ducks. His grandmother says
    the uncles had killed his brothers and that he can now hunt freely. Later, after
    becoming a strong hunter, he makes white-ash arrows and sings to summon game while
    ordering his grandmother not to look. She looks through the smoke-hole; a great
    white deer carries the youth away on its antlers, followed by the animals, leaving
    the grandmother to find the killed game but not her grandson.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The youth begins southward, changes course northward after leaving sight of
    his lodge, circles his home, passes three prior uncle places, and reaches a fourth
    opening with a lodge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inside the fourth lodge is a man older than the other uncles, who challenges
    visitors to a bone-dice game with one throw each and heads as the stake.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The youth agrees to play, goes to the river bank, asks ducks to aid him with
    magic power, and requests six right eyes as a short-term loan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Six ducks remove their right eyes and give them to the youth, who instructs
    the eyes how to fall during the old man's throw and during his own throw.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dice are placed in a bowl on a deerskin; during the throws, the eyes rise
    as quacking ducks through the smoke-hole and return as dice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old man's throw yields mixed positions, while the youth's throw returns
    all dice right side up, and the youth declares that he has won.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The youth refuses the old man's request for one more smoke, cuts off the old
    man's head with a flint knife, puts the head and body in the lodge, and sets the
    lodge on fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the old man's head bursts open in the burning lodge, an owl flies out.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The youth returns the six eyes to the river, moistens them with spittle, replaces
    them in the ducks' heads, thanks the ducks, and dismisses them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The grandmother says she is pleased, says the youth can now hunt freely in
    all directions, and says the uncles had destroyed a number of his brothers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The youth becomes able to kill deer, bear, and other large game, but must
    travel far and return late, so he plans to sing the game to him instead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the forest the youth makes as many white-ash arrows as he can carry.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The youth seats his grandmother on a deerskin, covers her head with it, and
    warns that if she looks out he will leave and never return.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The youth sings calls to elk, bears, raccoons, and deer; many animals run
    toward him from every direction, and he shoots arrows at them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: When the grandmother looks through the smoke-hole, a great white deer carries
    the youth away on its antlers into the forest, with the other animals following
    while the youth continues singing.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The grandmother sees killed game outside but cannot find her grandson, and
    then remembers his warning too late.
  category: sequence
  evidence_refs:
  - ev:8
