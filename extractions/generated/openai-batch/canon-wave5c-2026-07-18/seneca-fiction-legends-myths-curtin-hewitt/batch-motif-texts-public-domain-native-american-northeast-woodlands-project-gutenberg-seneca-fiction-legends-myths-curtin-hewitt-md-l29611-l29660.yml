canonical_text:
  quote: ''
  summary: The passage gives ritual instructions for appealing to Bears for aid, including
    prepared berry drink, maple sugar, tobacco cast on fire, exsufflation, thanks,
    and songs. It then recounts that a strange man taught songs to a stolen child,
    who brought them back. The child's family meanwhile searched for him by the lodge,
    river, water, and forest, failed to find him, and considered preparing a reunion
    feast because they believed him dead.
  language: English
  quote_policy: summarized
