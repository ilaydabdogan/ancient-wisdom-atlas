canonical_text:
  quote: ''
  summary: An elder sends his nephew to sit and listen at a valley-cliff. The nephew
    hears a fish-hawk cry, returns to the lodge/fire, and reports the cry after the
    elder prepares and smokes a tobacco pipe. The elder then takes a bark paddle,
    dips up fire, applies it to the top of the nephew’s head, and the nephew weeps
    and says his uncle has overmatched his orenda or magic power. At dawn they eat.
  language: Seneca with English interlinear gloss/translation as OCR-transcribed
  quote_policy: summarized
