canonical_text:
  quote: ''
  summary: A grandfather sends a young man south to find a wife. The youth finds a
    vacant village and a dead, ornamented young woman in a Long Lodge, takes and then
    restores her ornaments after being repeatedly returned to the same place. He spends
    the night there, feeds an unseen eater, wrestles an unknown being until dawn,
    discovers a blood-clot, and uses its blood dissolved in water to revive the woman.
    She explains that rejected northern suitors enchanted her and that her father,
    the chief, and his people moved south. The young man accompanies her to the southern
    village, where Crow reports her return to life to her parents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The grandfather tells the young man he is old enough to marry, instructs him
    to go south to find a wife, and gives him moccasins before sending him off.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At noon on the first day the youth reaches an opening in the woods with a
    large village, but the lodges he checks are vacant.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Long Lodge the youth sees the dead body of a well-dressed young woman
    with bracelets and neck ornaments lying on a bench.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The youth removes the young woman's bracelets and neck ornaments, thinking
    they would be good presents for a future wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the youth tries to go home, he repeatedly returns to the same village
    and Long Lodge; he concludes the woman may be bringing him back because of the
    ornaments and replaces them on her body.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the way after replacing the ornaments, the youth kills a bear, puts selected
    meat into the skin, carries it with him, and again reaches the Long Lodge at dark.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The youth decides to spend the night in the Long Lodge, kindles a fire, cooks
    meat, throws bones behind him, hears gnawing sounds, and throws meat to the unseen
    eater.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: As the fire dies down, something pulls the bearskin at the youth's feet and
    later crawls over his body; he wraps it in the bearskin and wrestles with it until
    dawn, when the body drops still.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After breakfast the youth opens the bearskin and finds only a fist-sized blood-clot;
    he dissolves some blood in heated water and pours it down the skeleton woman's
    throat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After receiving the blood, the woman begins to breathe, says she is hungry,
    is fed thin corn gruel, sits up, and soon becomes well.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The revived woman says her father was the chief of the village, that he and
    his people had gone south, and that northern men enchanted her after she refused
    to marry them, leaving her there for dead.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The young man and woman go south to the village; the young man tells Crow
    the story, and Crow reports to the chief and his wife that their daughter has
    come to life.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The chief's wife initially calls Crow a liar and tries to drive him out with
    a club, while the chief says the report may be true and asks that the daughter
    be brought.
  category: speech
  evidence_refs:
  - ev:9
