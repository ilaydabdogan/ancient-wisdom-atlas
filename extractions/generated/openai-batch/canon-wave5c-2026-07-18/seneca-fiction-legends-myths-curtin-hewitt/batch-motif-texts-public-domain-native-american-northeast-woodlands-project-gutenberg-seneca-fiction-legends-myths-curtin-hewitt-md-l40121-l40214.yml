canonical_text:
  quote: ''
  summary: An uncle sends his nephew repeatedly to listen in a valley for approaching
    sounds. The nephew hears a woman singing about seeking a young male person first
    at the home of Doadanegen and then as He-who-listens. The uncle cleans and adorns
    himself, places the scabbed nephew among dirt, and tries to make himself appear
    noble. Two sisters enter the lodge; the younger carries marriage bread. The women
    identify and choose the young man called Hat'hondas / He-who-listens, while the
    uncle Doadanegen tries to deceive them and repeatedly pushes the nephew across
    the fire to take his place. The women repeatedly return to sit beside the nephew.
  language: English
  quote_policy: summarized
