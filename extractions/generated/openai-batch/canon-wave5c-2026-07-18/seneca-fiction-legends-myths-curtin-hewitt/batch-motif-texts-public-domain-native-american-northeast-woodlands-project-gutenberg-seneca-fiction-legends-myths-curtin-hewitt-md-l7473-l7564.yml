canonical_text:
  quote: ''
  summary: A man leaves his village to hunt and camps successfully for many days.
    At night his two dogs discover a dreadful creature in a broken hollow elm tree.
    The dogs warn the man, have him mark them with coal, lick his feet to give him
    speed, and send him fleeing toward the village. The monster pursues by leaping
    from tree to tree while the dogs repeatedly return to delay it. One dog is killed,
    then the other; the man cries out the death cry near the village, villagers come
    with torchlight, and he collapses when he reaches them.
  language: English
  quote_policy: summarized
