canonical_text:
  quote: ''
  summary: 'A young hunter finishes a meal with rattlesnake hosts, returns through
    a cavern passage to the surface, and reports to his family and a council that
    rattlesnake people can assume human form and live with human-like institutions.
    A new tale begins: a household of seven brothers and one sister is introduced;
    the youngest brother is a recluse. The daughter of a noted witch arrives with
    marriage-proposal bread, sits on the wrong beds despite her mother''s instructions,
    and is treated as having chosen the eldest brother, though she realizes she was
    meant to sit by the recluse.'
  language: English
  quote_policy: summarized
