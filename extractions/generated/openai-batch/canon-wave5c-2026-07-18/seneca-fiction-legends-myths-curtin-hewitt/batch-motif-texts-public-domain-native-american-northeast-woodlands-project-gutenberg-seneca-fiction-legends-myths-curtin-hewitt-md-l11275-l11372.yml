canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which a pursued young man is hidden
    by an old woman, whose kettle of boiling bear's oil kills the pursuing woman;
    the man later marries the old woman's daughter, and their twin sons retrieve his
    elder brother. The passage then begins the story of Bloody Hand, a famed hunter
    and war captain who feeds flesh-eating birds and animals; after he is killed and
    scalped in war, the birds and other powerful animals gather to recover his scalp
    and prepare medicine intended to restore him to life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pursuing young woman reaches a trail where the ground is soft and resilient,
    is thrown backward when trying to advance, and discovers that she is standing
    on a toad's back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man runs along the top of a hill, slips, and slides rapidly down
    until he strikes a lodge that a voice inside calls a trap.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young woman from the lodge lifts the young man and brings him inside; an
    old woman asks what troubles him and says she will help him keep out of sight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman fills a kettle with bear's oil, sets it over the fire, and says
    that the young man's face should be looking up from the bottom of the kettle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The pursuing woman enters, asks where the man is, sees his face in the kettle
    after being told he ran into it, plunges into the boiling oil, and dies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The old woman's daughter says she will take the rescued young man as her husband.
  category: speech
  evidence_refs:
  - ev:2
