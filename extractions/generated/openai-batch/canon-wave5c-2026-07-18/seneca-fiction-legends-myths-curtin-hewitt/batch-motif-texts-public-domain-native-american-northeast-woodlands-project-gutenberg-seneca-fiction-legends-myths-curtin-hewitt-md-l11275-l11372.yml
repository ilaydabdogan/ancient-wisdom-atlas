  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The twin boys find a man in a distant lodge, address him as uncle, and bring
    him home, where the younger brother greets his elder brother.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The twins ask their grandmother to marry their uncle, she agrees, and the
    group lives happily together.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Bloody Hand is introduced as a great man whose fame as a hunter is paired
    with his reputation as a bold and resolute war captain.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Bloody Hand loves and respects flesh-eating birds and animals and often gives
