candidate_motifs:
- id: motif:1
  label: Pursuer defeated by deceptive boiling-kettle stratagem
  taxonomy_refs: []
  basis: A helper hides the pursued man, makes his face appear in a kettle of boiling
    bear's oil, and the pursuer dies when she leaps in to seize him.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not explain the mechanism by which the face appears in
    the kettle.
- id: motif:2
  label: Twin offspring restore or rearrange kinship ties
  taxonomy_refs:
  - sibling_pair
  basis: Twin sons are born, sent to retrieve their uncle, and then arrange a marriage
    between the uncle and their grandmother.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The twins are active kinship agents, but the passage does not mark them
    as sacred or supernatural.
- id: motif:3
  label: Reciprocal aid between human hunter and animal persons
  taxonomy_refs:
  - sacred_exchange
  basis: Bloody Hand feeds flesh-eating birds and animals from his hunts; after his
    death, the birds mourn him as a friend and attempt to restore him.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: The reciprocal connection is strongly suggested by sequence but not stated
    as an explicit bargain.
- id: motif:4
  label: Resuscitation requires recovery of a severed body part
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: The birds say they must recover Bloody Hand's scalp before beginning to resuscitate
    his body.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage ends before the final result of the resuscitation is shown.
- id: motif:5
  label: Animal council prepares life-restoring medicine through self-flesh offering
  taxonomy_refs:
  - sacrifice
  - resurrection
  basis: Bird representatives put pieces of their own flesh into a pot to make medicine
    intended for restoring Bloody Hand to life.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The representatives are described as birds of an elder time, and the passage
    does not identify them individually.
- id: motif:6
  label: Plant growth and blood as proof of medicine's power
  taxonomy_refs:
  - death_rebirth
  basis: The medicine is tested by producing an unsown corn stalk containing blood,
    after which blood is obtained and the stalk disappears.
  evidence_refs:
