canonical_text:
  quote: ''
  summary: The English portion concludes a tale in which a young wife summons a great
    leech from a lake to carry herself and her injured husband, Doadanegen, home.
    On returning, Doadanegen finds his uncle mourning him with weeping and fire-based
    self-affliction; the uncle recognizes him, rejoices, and urges him to stay near
    home because an elder wife is about to become a mother. The following interlinear
    section begins a Seneca-language version headed as the legend of Doadanegen and
    Hotkwisdadeg, describing an uncle-nephew pair who live and hunt together and an
    instruction to go to a stream-washed bluff and listen, where an owl speaks.
  language: English; Seneca with English interlinear glosses
  quote_policy: summarized
