canonical_text:
  quote: ''
  summary: A young man escapes by canoe with the aid of wild geese that serve as paddlers.
    S'hagowenot'ha calls after him and pleads for his return, while lake monsters
    rejoice when the young man promises them meat. The young man reaches a landing
    at dawn, enters a lodge, and finds a young woman who identifies herself as his
    younger sister through their shared uncle Okteondon, who had stolen her long ago.
    She gives him back his garments, bow, and arrows, then helps him flee by laying
    bark strips to hide his tracks. Brother and sister board the canoe and are propelled
    by the wild geese. The sister breaks a fishhook by which her husband is pulling
    the canoe back, but the husband then drinks up the lake, swelling enormously and
    drawing the canoe toward his open mouth.
  language: English
  quote_policy: summarized
