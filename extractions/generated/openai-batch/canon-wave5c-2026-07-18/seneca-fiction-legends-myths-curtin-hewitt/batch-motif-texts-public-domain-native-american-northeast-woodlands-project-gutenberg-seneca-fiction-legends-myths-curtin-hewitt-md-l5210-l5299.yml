canonical_text:
  quote: ''
  summary: The passage first concludes an episode in which a youth changes the words
    of a song to make a canoe descend, then sings again and the canoe shoots upward
    and flies northward while he sees a woman's tracks ahead; he realizes he can command
    the canoe to stop. The next tale begins with a man and his nephew living in a
    forest lodge. The uncle secretly uses a tiny kettle, a small bundle containing
    chestnut substance, water, fire, a wand, and a song to enlarge the kettle and
    its mush. The nephew pretends to sleep, observes the secret process, later searches
    the uncle's bed after the uncle leaves, finds a small chestnut fragment and tiny
    kettle, and attempts to prepare food by imitating the uncle.
  language: English, with some Seneca song words transcribed
  quote_policy: summarized
