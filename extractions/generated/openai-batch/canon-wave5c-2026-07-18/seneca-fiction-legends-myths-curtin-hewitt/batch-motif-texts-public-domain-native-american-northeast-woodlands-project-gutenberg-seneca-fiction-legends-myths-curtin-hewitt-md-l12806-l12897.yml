canonical_text:
  quote: ''
  summary: Two men are guided away from a dangerous tree before Ganiagwaihegowa destroys
    it. They spend the night in another hollow tree, climb the world's highest rocks
    toward the lodge of the old man Has'honyot, and one companion dies after slipping
    and being struck by a stone kicked down by the other. The surviving man reaches
    the lodge, tries to overturn and burn it, but Has'honyot invokes Hasdeaundyet'ha
    with burned tobacco, causing rain to extinguish the fire. The survivor carries
    the lodge near Broken Land, reports to the chief, and the chief enters the lodge
    and addresses the old man.
  language: English
  quote_policy: summarized
