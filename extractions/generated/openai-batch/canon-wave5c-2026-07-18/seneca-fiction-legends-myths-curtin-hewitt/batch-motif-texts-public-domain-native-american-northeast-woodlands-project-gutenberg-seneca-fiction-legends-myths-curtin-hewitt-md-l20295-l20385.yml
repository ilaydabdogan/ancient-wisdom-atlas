canonical_text:
  quote: ''
  summary: 'A young woman who had been cast down from the upper world recovers, builds
    a shelter, and bears a daughter. The daughter, after a directional injunction
    connected with digging wild potatoes, conceives through the breath of the West
    Wind and bears twins: reddish Othagwenda, Flint, and light-colored Djuskaha, the
    Little Sprout. Their grandmother favors Djuskaha and rejects Othagwenda by placing
    him in a hollow tree, but he is later brought home. As adults, the twins enlarge
    and shape their island, separately making lands, animals, trees, and rivers; each
    alters the other''s work because of concern about conditions for future humans.
    Their disagreement becomes a fight in which Othagwenda is killed. The passage
    then begins another tale in which a mother instructs her two daughters to prepare
    green-corn bread and offer it as marriage bread to two brothers in a double lodge.'
  language: English
  quote_policy: summarized
