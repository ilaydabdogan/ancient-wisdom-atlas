canonical_text:
  quote: ''
  summary: A boy travels westward on a narrow path to obtain chestnuts. Along the
    way he encounters successive paired guardians—rattlesnakes, bears, and firedragons—who
    block or guard the path. He hunts prey, feeds each pair, commands them to leave,
    and states that they should not be enslaved by sorcerers. He then reaches a clearing
    with chestnut trees, a lodge with women, and the hanging skin of a dead woman
    that watches the pathway, guards the chestnut trees, and gives an alarm that a
    human being has arrived. Three women and their mother emerge, and the mother says
    someone may have come to rob them of their chestnuts.
  language: English
  quote_policy: summarized
