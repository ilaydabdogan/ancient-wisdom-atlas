canonical_text:
  quote: ''
  summary: A council debates leadership and sends Haiwanenqgwi to summon all peoples
    to a great council at Broken Land. After first missing the Dagwanoenyents, he
    notifies them at a mountain meeting place. Tsodiqgwadon then gives him a route
    to western and southern islands, including the Stone Coats and other named peoples.
    Haiwanenqgwi shapeshifts into a snake and then a Hahnowa to cross water amid thunder
    and lightning attributed to Hinon, resumes human form on islands, and delivers
    invitations to chiefs who agree to attend.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Deanohdjes says Tsodiqgwadon has more orenda than anyone else; Tsodiqgwadon
    says he does what the people wish and tells the meeting to take the person thought
    to have the greatest orenda.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The council is adjourned for ten days, and Haiwanenqgwi is sent to notify
    all peoples of every kind in the world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After returning from his first circuit, Haiwanenqgwi reports that he has not
    seen the Dagwanoenyents; Tsodiqgwadon directs him to Gaha Gastende, where high
    rocks are in the east.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the mountain region of Wind Cliff, a Dagwanoenyents chief gathers the people
    at a smooth treeless and grassless meeting place; hundreds appear and agree to
    attend the council.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tsodiqgwadon asks whether Haiwanenqgwi has notified the Stone Coats and then
    gives directions to several islands and named peoples, instructing him to notify
    them and return without delay.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: At the western end of the earth, Haiwanenqgwi changes into a snake, enters
    the water, is halted by thunder and lightning, thinks Hinon wants to kill him,
    changes into a Hahnowa, and the threats cease.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: On Stone Island Haiwanenqgwi resumes human form, is asked for wampum, and
    is directed to a large opening in the rocks where an old man, the chief, agrees
    to come with all his people.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Haiwanenqgwi again assumes the form of a Hahnowa to cross water, resumes human
    form, and invites Hoonkgowanen at Othegwenhda Tgawenot; the chief agrees to attend.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Haiwanenqgwi continues by Hahnowa-form travel over water to Oosah Tgawenot
    and then to Nitgawenosatieha, where he gives invitations to Shayades and Deanohsgwis;
    Deanohsgwis accepts.
  category: sequence
  evidence_refs:
  - ev:9
