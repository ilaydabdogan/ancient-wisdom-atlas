canonical_text:
  quote: ''
  summary: A grandmother warns twin boys not to go north. They disobey, encounter
    an old Dagwanoenyent in a pine-tree nest, survive a rain of darts, and later retaliate
    with fire-rain that kills him. The twins then find blind people in a cave-lodge
    whose eyes have been taken for a robe by false women, and whose younger sister
    has been robbed by Shagowenotha. One twin uses shapeshifting and deceptive birth
    to enter the eye-robe makers' lodge, steals the robe of human eyes, and returns
    the eyes to their owners. The reunited kin live happily and finally become rabbits.
  language: English
  quote_policy: summarized
