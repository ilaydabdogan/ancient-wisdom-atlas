canonical_text:
  quote: ''
  summary: 'A small boy called the Potent One defeats Stone Coat in a log-kicking
    contest, takes Stone Coat’s dog, disobeys warnings not to go southwest and east,
    wins a deadly dice game against a big-headed gambler, liberates people awaiting
    beheading, and wins eastern country in a ball game between clan sides. The passage
    then begins another tale: a hunter and his wife live in a forest lodge, have a
    son and daughter, and the mother develops a daily routine of forcing the son to
    fetch water, preparing herself, going into the woods, neglecting the boy, and
    being reported by him to his father.'
  language: English
  quote_policy: summarized
