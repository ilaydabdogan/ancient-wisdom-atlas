- id: obs:9
  text: One of the women tells Doonongaes that a great council will appoint another
    chief, remove Tsodiqgwadon's chieftaincy, and put someone else in Doonongaes's
    place as second chief because Doonongaes chases people living in the world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Doonongaes becomes sad, sits with his head down until night, and then resolves
