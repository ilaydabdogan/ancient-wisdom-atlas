canonical_text:
  quote: ''
  summary: Tsodiqgwadon and Doonongaes travel to Broken Land and discuss Doonongaes's
    past violence, death, revival, and women. Doonongaes returns to his mother-in-law's
    lodge and is reunited with two women who had waited for him but returned to former
    husbands. The next day, a council at Broken Land considers new leadership for
    the whole world; Deanohdjes is nominated, defers his answer, and later recommends
    Doonongaes for head chief, while Tsodiqgwadon objects on grounds of character
    and lack of orenda.
  language: English
  quote_policy: summarized
