canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which a woman is allowed to accompany
    a young husband only if she obeys him. He tells her to cover her head and not
    look while he summons wild animals; she looks, and an animal carries him away.
    His wife then calls a white deer, borrows its coat under conditions, becomes a
    white deer, overtakes the animals, rescues her husband from the bear carrying
    him, returns the coat, and all return safely. The passage then begins “The Horned
    Snake and the Young Woman”: a proud young woman near Cayuga Lake refuses suitors,
    is visited at night by a handsome glistening stranger who proposes marriage, consents
    to go with him, sleeps and behaves strangely afterward, and later follows him
    toward his home beyond a hill despite a moment of doubt.'
  language: English
  quote_policy: summarized
