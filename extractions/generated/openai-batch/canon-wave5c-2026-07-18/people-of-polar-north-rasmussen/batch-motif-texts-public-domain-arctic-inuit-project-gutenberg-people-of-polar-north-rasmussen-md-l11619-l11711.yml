canonical_text:
  quote: ''
  summary: During a winter sledge journey near Jakobshavn, Moses tells the narrator
    that rocks contain hiding places for poorly understood beings. He recounts Otto
    going to his seal-nets on New Year's Eve despite his mother's warning about unnatural
    things. On the return journey Otto's dogs panic, his whip is pulled upward by
    an unseen force, and a strange figure or spirit keeps pace with the sledge before
    disappearing near Angmalortoq. Moses asks what the being was, but the narrator
    gives no explanation.
  language: English
  quote_policy: summarized
