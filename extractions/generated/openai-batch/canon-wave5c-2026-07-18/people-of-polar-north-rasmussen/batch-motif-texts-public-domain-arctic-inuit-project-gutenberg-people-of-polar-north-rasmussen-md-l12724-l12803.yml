canonical_text:
  quote: ''
  summary: A raven married to a goose refuses to rest before a great sea crossing,
    then becomes exhausted while flying with the geese. His goose wife and another
    goose try to save him by making a bridge with their wings, but he sinks through,
    briefly reaches new ice, and drowns. After sinking, he appears to a great Angakoq
    who is summoning spirits and tells his story; the Angakoq passes it on. The passage
    then adds commentary on translation, oral storytelling, mimicry, and the setting
    of Eskimo legends.
  language: English
  quote_policy: summarized
