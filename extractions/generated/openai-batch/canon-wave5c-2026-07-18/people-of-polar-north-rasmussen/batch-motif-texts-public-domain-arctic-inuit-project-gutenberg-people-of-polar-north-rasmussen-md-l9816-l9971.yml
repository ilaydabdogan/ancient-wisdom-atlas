canonical_text:
  quote: ''
  summary: A boy stays with the one-eyed giant of Kingigtoq Peak, who carries him
    through the air to an Angakoq festival at Erqutit and later gives him meat on
    the condition that no one eat blubber with it. At home, one old woman secretly
    breaks the condition; the giant angrily withdraws his help and his house can no
    longer be found. The frame narration then turns to Kingigtoq itself, and Ajunge,
    an old woman, recalls former reindeer abundance and a remembered calf-catching
    episode from her youth.
  language: English
  quote_policy: summarized
