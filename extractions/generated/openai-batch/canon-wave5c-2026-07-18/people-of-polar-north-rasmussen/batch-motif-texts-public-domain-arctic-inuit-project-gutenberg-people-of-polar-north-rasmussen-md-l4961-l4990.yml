  summary: Papik hunts seals with his brother-in-law Ailaq, but Ailaq succeeds while
    Papik returns empty-handed and becomes increasingly envious. Ailaq later fails
    to return, and Papik says nothing. Ailaq's mother accuses Papik of killing him;
    Papik denies it. The mother declares that Papik has hidden the murder, threatens
