  summary: A cannibal woman with an iron tail kills sleeping guests by dropping onto
    them. A man avoids her attack, causing her tail to strike a stone and break. He
    flees in a kayak; she pursues and speaks a harmful wish whose words nearly capsize
    him. He answers with a spoken wish of his own, causing her to fall back on her
    tail. After this, she no longer murders people because the iron tail is broken.
