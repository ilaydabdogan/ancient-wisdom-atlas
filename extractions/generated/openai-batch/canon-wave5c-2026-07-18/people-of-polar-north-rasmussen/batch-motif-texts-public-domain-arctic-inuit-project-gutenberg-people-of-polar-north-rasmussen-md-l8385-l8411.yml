  summary: A reported tale says that the very old man Mitsima is seal-catching with
    others in midwinter when a snowstorm separates the hunters. After the storm he
    returns crawling on the ice with frozen hands and feet. His children see him but
    are afraid because he is almost dead; he collapses at the house entrance, is left
    to die outside, and is later covered with snow.
