canonical_text:
  quote: ''
  summary: A very fat man named Igimarasugssugssuaq eats wives and other people. His
    wife Arnaqa escapes when she realizes she is to be cooked, hides during snowfall,
    is taken in by another household, and reports her husband. The household binds
    him and has Arnaqa stab him. The people then mistakenly kill Arnaqa as a suspected
    cannibal, discover her body contains only lice, and regret the killing.
  language: English
  quote_policy: summarized
