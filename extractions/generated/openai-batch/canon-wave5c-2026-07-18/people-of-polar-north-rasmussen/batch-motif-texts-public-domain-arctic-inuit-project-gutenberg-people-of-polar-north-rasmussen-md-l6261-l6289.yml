  quote: the eye saw things which are hidden from us.
  summary: The passage introduces Part III and says earlier people had stronger vital
    sap, could do and see things no longer understood or visible, and that the experiences
    of old men were carried down by the tongue. A bracketed note explains that these
    Polar Eskimo fables and legends were told during the Polar Night in houses, often
    after late banquets, by storytellers who talked hearers to sleep; legends were
    taught by grandmothers to grandchildren and recorded here by K. R. with an aim
    of literal translation.
