canonical_text:
  quote: ''
  summary: The narrator receives hospitality, is delayed by local kayak-men because
    dangerous weather is expected, and goes with Anase to a lookout above Ikamiut.
    Anase describes the landscape, deadly sudden winds, deaths caused by squalls,
    a bereaved father who climbed the Peak of Forgetfulness, and cairns built for
    remembering a dead friend. As he speaks, winds, fog, and rain arrive; a human-like
    scream is heard from a rock cleft, and Anase challenges it by declaring that they
    are Christian people.
  language: English
  quote_policy: summarized
