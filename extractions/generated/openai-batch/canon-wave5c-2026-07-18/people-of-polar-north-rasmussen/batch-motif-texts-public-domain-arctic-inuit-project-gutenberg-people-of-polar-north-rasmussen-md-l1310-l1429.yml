  quote: ''
  summary: A first-person migration account describes adoption of a local sledge type,
    a long stay among people who receive the migrants as kin, an attempted return
    to the homeland led by Qitdlarssuaq, famine and cannibalism during wintering,
    flight into mountains under snowstorms, loss of dogs and family members, and later
    deaths in snowstorms and snow-huts during travel south for provisions.
  language: English
  quote_policy: summarized
