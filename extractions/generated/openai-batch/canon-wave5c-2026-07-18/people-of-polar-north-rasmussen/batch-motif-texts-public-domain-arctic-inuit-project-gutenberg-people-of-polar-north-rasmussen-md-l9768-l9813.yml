  quote: ''
  summary: A boy encounters a manlike one-eyed giant in a house. The giant feeds him
    with abundant dried meat, shelters him safely, gives him reindeer-meat to take
    home, and attaches a strict prohibition against eating blubber with the meat.
    The boy returns home, the people comply despite some old women asking for blubber,
    and the boy later revisits the giant, who shows evidence of a huge catch called
    Qapiarfik.
