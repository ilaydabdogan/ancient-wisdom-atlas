canonical_text:
  quote: ''
  summary: A man on the ice sees his brother arrive by sledge with his wife and child.
    Ilimageq guides the strangers to land. Poulineq's former wife invites him to eat
    dried meat and later gives the child's mother a turf-like item from a thimble-bag
    to feed the child. The child dies, the mother dies and is revived when Poulineq's
    brother removes dried meat from her throat. The revived woman asks to go home.
    Before departing, the husband releases a sled dog as an avenger. The dog spares
    the innocent people, finds the guilty pair, attacks the woman and then a hidden
    man, and the husband drives away.
  language: English
  quote_policy: summarized
