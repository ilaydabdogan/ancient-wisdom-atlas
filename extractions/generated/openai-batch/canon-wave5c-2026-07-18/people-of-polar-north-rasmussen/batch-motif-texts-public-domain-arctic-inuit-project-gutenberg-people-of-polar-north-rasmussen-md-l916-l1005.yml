canonical_text:
  quote: ''
  summary: Panigpak tells stories about his ancestor Qitdlarssuaq, described as an
    unmatched magician. In one episode, Qitdlarssuaq and a hunting companion are driven
    by storm along a mountain road to a house with two large women; the companion
    dies beside one woman and is revived by the other with a feather. In another episode,
    Qitdlarssuaq saves an orphan from broken sea ice by telling him to keep his eyes
    shut, transforming into a bear, and making ice wherever he steps until they reach
    land.
  language: English
  quote_policy: summarized
