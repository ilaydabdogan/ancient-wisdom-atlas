canonical_text:
  quote: ''
  summary: 'The passage frames Polar Eskimo ancestral oral tradition as authoritative
    wisdom, then gives Arnaluk''s creation account: earth falls from heaven, babies
    emerge from the earth among willow bushes, a woman clothes and raises them, dogs
    are summoned from mounds, deathless humans overpopulate the earth and a flood
    reduces them, two old women choose Light together with Death, the first corpse
    is kept in its stone grave, and the dead ascend to Heaven and become luminous.
    Aisivak gives a variant in which two male magicians are the first known inhabitants
    and one changes his body to bear children. Qilerneq begins a separate legend about
    two men wishing to travel around the world.'
  language: English
  quote_policy: summarized
