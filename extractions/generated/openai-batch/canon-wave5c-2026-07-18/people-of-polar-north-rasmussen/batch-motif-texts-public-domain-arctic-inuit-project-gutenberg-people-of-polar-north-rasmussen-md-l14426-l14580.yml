canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which Uase confronts but does not
    kill Qaratsuk after Nakuaq asks about revenge; old women in a church loft then
    react with regret that the killing did not happen. A second tale begins: an unnamed
    jealous husband controls and injures his wife, who flees to the hills, calls to
    the white men, and takes refuge on their ship. The husband tries unsuccessfully
    to reach her on the ship, then finds her placed on a high fjeld where she refuses
    him. She later hides in a cave-like subterranean passage; his lamp goes out when
    he tries to crawl in. The white men then set a rope ordeal between two peaks,
    promising to return the wife if he can cross it.'
  language: English
  quote_policy: summarized
