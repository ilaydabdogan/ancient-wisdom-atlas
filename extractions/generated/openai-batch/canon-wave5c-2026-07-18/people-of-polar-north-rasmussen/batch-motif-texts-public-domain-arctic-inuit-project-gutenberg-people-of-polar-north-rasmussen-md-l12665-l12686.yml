  summary: A tale explains why the raven is entirely black. In a time when birds were
    receiving their colours, the raven and the Great Northern Diver agree to decorate
    each other. The raven paints the Diver black with a white pattern, and the Diver
    paints the raven the same way. The raven becomes angry and calls the pattern ugly,
    so the annoyed Diver daubs him black all over.
