canonical_text:
  quote: ''
  summary: An unnamed half-grown girl recalls how the magician Qangatse interrupted
    girls playing shadows, drew them into a dark part of the house, rubbed a stone
    to the left, summoned helping spirits, invoked the child-stealing monster Amarsinioq,
    and offered to teach her magic. He described a dry-lake rite in which water would
    appear and a doglike monster would eat, grind, and restore them so that they would
    become greater magicians. The narrator realized he wanted her as an assistant
    and ran away.
  language: English
  quote_policy: summarized
