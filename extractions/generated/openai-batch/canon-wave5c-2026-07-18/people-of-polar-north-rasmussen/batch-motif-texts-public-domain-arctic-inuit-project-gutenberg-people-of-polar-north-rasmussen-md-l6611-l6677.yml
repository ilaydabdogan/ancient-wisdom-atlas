canonical_text:
  quote: ''
  summary: A man takes a fox as wife and discovers she can become a woman while retaining
    fox traits. After a wife exchange, she is rejected for smelling like a fox, flees
    to the hills, and stays with a worm in human shape who is an old enemy of the
    man. The man defeats the worm, leaves his wife, and visits small harmless strand-dwellers
    who live by the tide and treat an eider-duck wing as a walrus shoulder.
  language: English
  quote_policy: summarized
