canonical_text:
  quote: ''
  summary: A travel party on Polar Eskimo ground faces the serious illness of a comrade.
    The narrator and Jorgen Bronlund drive north by dog sledge to find people, discover
    fresh sledge-tracks and a seal cache, rest briefly, then encounter Maisanguaq
    and his wife Meqo. After mutual astonishment and laughter, the couple guide them
    toward Agpat, where more people live.
  language: English
  quote_policy: summarized
