canonical_text:
  quote: ''
  summary: A boat party sees and retrieves a drifting buoy, recognized as Samuel's,
    with its thong broken. The buoy is treated as a death omen. On reaching land,
    Samuel is found not to have returned. His mother Elina cries and collapses, women
    mourn with her, his brother Andrew howls and tells a younger child that Samuel
    will not return, and his father Abraham collapses when he understands the disaster.
    The family withdraws for several days before the need for food drives them back
    to the sea.
  language: English
  quote_policy: summarized
