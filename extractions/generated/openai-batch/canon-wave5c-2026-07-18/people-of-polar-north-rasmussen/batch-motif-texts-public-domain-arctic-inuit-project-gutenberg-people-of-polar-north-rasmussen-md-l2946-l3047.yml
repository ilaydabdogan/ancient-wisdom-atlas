  text: A low-water attempt along the beach failed; the bay had open water and broken
    ice, and the party described itself as under siege between glaciers, streams,
    and the open bay.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Qisunguaq found a way up a bare cliff about 2000 feet high, and getting the
