canonical_text:
  quote: '"It is the glacier bleeding!"'
  summary: A travelling party is blocked by open water and broken ice, climbs over
    cliffs and glaciers, runs short of food and usable footwear, searches for people
    at Natsilivik and Narssaq, sees red springs at the glacier, crosses a rapid stream
    after fog lifts, and finally sights five tents with people and food.
  language: English
  quote_policy: quoted
