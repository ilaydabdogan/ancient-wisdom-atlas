  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At about 2400 feet above sea level, the party found that Qana, where the boat
    was, could not be reached because the ice was broken into floes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At night after the hard journey, provisions were gone, the party lay down
    on sledges, and a storm howled on the hilltop.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The party could not return to Agpat and needed contact with people, food,
