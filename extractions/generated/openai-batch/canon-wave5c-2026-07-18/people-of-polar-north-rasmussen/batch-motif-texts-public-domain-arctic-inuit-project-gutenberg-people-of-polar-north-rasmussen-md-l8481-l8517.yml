  summary: Qitdlaq and a companion are driven by storm from a seal-catching expedition
    to an unknown coast. They travel along the coast, avoid one wary people, then
    encounter a naked feathered tribe. The companion approaches against counsel, is
    questioned, killed, and flensed. The tribe raises a wind from the rocks to scent
    out Qitdlaq, and Qitdlaq raises a snow-storm with piercing cold.
