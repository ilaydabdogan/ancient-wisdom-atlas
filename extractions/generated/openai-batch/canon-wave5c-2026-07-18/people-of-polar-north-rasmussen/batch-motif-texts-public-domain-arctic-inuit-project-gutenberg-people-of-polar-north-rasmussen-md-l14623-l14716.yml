- id: obs:1
  text: Rosine, an old woman from Igdlukasik, is named as the teller of the story,
    which she had heard from her mother.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the East coast, two winters occurred consecutively without spring, summer,
    or autumn between them, and famine caused many settlements to die out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before the sea normally froze, huge blocks of ice rose out of the water, making
    it seem as if the sea bottom were covered with ice.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Seals were initially numerous and near the surface, but later ice became too
    thick for seal holes, snow filled ravines and levelled the landscape, and travel
    by land or water ceased.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Stored provisions lasted through the first winter, but when warm weather normally
    should have come, snow did not melt and ice still covered the sea.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A more severe second winter followed, provisions ended, and starvation began
    among the East-coast dwellers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: People ate ordinarily inedible items, including clothing skins, kayak skins,
    and umiaq skins; some cautiously left the lower parts of umiaq skins attached
    for possible future use.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Most people thought summer would never return and that everyone would die.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: When no food remained, people ate corpses, including those of housemates and
    close kin; parents ate children and children ate parents.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Many people were seized with madness after eating loved ones; human liver
    is singled out as especially harmful, associated with madness and hair loss.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: As famine worsened, stronger people murdered those too weak to defend themselves.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After most people had died, the cold stopped, summer came, the remaining people
    were saved, and later people are said to descend from cannibals.
  category: sequence
  evidence_refs:
  - ev:10
