canonical_text:
  quote: ''
  summary: An oral account attributed to Rosine describes an East-coast catastrophe
    in which two winters came without intervening warm seasons. Sea ice, snow, and
    lack of hunting caused famine. People exhausted stored provisions, ate skins and
    boat coverings, then consumed dead relatives and later murdered the weak for food.
    Eating human liver is said to cause madness and hair loss. Eventually the cold
    ended, summer returned, and the remaining people survived; the narrator concludes
    that later people descend from cannibals.
  language: English
  quote_policy: summarized
