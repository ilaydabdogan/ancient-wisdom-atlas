canonical_text:
  quote: ''
  summary: An unnamed man says he will never be a man again and throws himself into
    the sea. The narrator then describes Katiaja as a dangerous, exceptional woman
    and skilled hunter who once returned before the men were active with a large bearded
    seal she had hauled herself. After marriage she stopped hunting. She is said to
    have murdered her husband and another wife, then attacked Ijajup's widow, probably
    Niarajuak, after falsely accusing her of harmful incantations. Katiaja wounded
    the widow with a gun and left her bleeding in the snow; another woman, moved by
    compassion, smashed the widow's skull with a stone.
  language: English
  quote_policy: summarized
