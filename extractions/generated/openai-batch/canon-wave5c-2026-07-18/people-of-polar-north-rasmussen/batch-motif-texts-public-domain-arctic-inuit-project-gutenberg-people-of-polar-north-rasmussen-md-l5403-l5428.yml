  quote: The Spirit of the Skin Hangings.
  summary: The passage describes a feared spirit said to live behind the skins hung
    on house walls. It harpoons sleeping people; one cry means the throw only grazed
    the victim, while another means the harpoon point is embedded and the victim will
    sicken and die. The narrator reports the old people’s fear and former generations’
    testimony while stating that he has not personally seen these spirits.
