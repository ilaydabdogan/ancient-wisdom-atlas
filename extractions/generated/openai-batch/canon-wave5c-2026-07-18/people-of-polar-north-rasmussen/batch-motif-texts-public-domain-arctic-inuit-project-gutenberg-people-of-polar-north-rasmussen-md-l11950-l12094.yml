canonical_text:
  quote: ''
  summary: 'The passage first recounts Sophie’s anger toward Emanuel and her sister
    after a marital separation, including Emanuel pursuing Sophie one winter evening
    when she fetched water. It then introduces Besuk’s narrated account from Lindenow’s
    Fjord: Oqartaqangitseq has three jealous wives; Katiaja causes a gunpowder explosion
    after being slighted; Atarajik and others are badly burned; the family leaves
    by umiaq, leaving Atarajik to die; her remains are later found ravaged by ravens.
    The injured husband is brought to Nunagssuk, asks to be taken to the sea, is dressed
    as for a corpse, and is placed near the surf in stormy winter weather.'
  language: English
  quote_policy: summarized
