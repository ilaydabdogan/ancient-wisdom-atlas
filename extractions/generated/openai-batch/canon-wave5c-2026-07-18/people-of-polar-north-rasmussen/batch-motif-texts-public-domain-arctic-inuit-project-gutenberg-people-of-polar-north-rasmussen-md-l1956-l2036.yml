canonical_text:
  quote: '"Death shows favour!"'
  summary: The passage portrays Sorqaq, called “Whalebone,” his friendship with Qilerneq,
    practical care and economical target shooting, Sorqaq’s account of surviving five
    days on an iceberg with eight dogs, a later near-fatal fall from a bird cliff
    and recovery, and a farewell gesture meant to strengthen the narrator for long
    life.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Sorqaq, interpreted as “Whalebone,” and Qilerneq, interpreted as “The Knot,”
    are described as devoted friends whose friendship dated from boyhood.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some people alleged that Qilerneq had bewitched Sorqaq’s son Tateraq and made
    him a cripple for life; others said Sorqaq feared Qilerneq’s greater witchcraft
    and age.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sorqaq prepared fried sealmeat in blubber on a hollow stone for Qilerneq,
    who had difficulty chewing sealmeat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sorqaq cleaned his old gun and arranged target practice using a walrus shoulder-blade
    set against an ice-covered cliff, sending a boy to cut out each ball so that ammunition
    was not used up.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sorqaq said he learned economy when a westward gale drove him far from land,
    the ice split and drifted, and he climbed with his eight dogs onto an iceberg
    for five days with only one small seal for food.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A southwest wind drove Sorqaq landward; people who saw him drifting on an
    iceberg nearly ran away, thinking he was a sea-monster or that he had been hunting
    in the grounds of the dead.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sorqaq stated that death follows men and is never farther from life than a
    man’s shadow.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: During autumn auk-shooting at a high bird rock, Sorqaq bound a leather thong
    about himself, jumped too far, the line broke, and he fell.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kayak-men found Sorqaq unconscious on a reef as the rising flood reached his
    body; his shoulder was broken and his head badly wounded.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sorqaq was towed home like a dead seal, laid on a bear-skin to die in peace,
    and his wife began mourning the breadwinner.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sorqaq recovered, later becoming one of the first sledge-drivers again and
    saying that death shows favour.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: At parting, Sorqaq stroked the narrator’s breast and said he did so to make
    the narrator strong for a long life.
  category: action
  evidence_refs:
  - ev:8
