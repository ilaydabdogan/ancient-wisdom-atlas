canonical_text:
  quote: ''
  summary: Navaranapaluk, a woman descended from cannibals and married into another
    group, visits her relations wearing mittens on her feet so they will believe she
    is badly treated. Her relations attack her new tribe when the men are away and
    kill the women, except for three who hide. The returning men prepare arrows, receive
    help from the surviving women, ambush the attackers, kill the men, take widows
    as wives, and then mutilate and kill Navaranapaluk because she lied. The passage
    also includes a transmission note naming Tateraq and his forefathers, followed
    by commentary on women in Eskimo society and recurring legends of mistreated women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tale names Navaranapaluk as descended from cannibals and says she was
    married to people who did not eat men.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Navaranapaluk wears mittens on her feet instead of boots when visiting her
    relations, intending them to believe her new compatriots treat her badly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Her relations pity her winter arrival on foot and agree to attack the tribe
    she now belongs to.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The attackers arrive when the men are absent and murder the women at home;
    only three women escape.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The three escaped women survive by hiding under a skin being dressed, under
    a dog-meat trough, and in a meat-storage shed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The returning men find their women killed, notice Navaranapaluk is missing,
    and see that the murdered women have been impaled on long stakes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The men prepare arrows for retaliation, and the three surviving women plait
    sinew-thread for the arrowheads until their fingertips are worn to the bone; one
    dies from loss of blood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The avenging group hides behind large stones above the enemies' houses.
  category: setting
  evidence_refs:
  - ev:8
