canonical_text:
  quote: '" Shut your eyes ! " he said to her, and then they drove up through the
    air.'
  summary: A wounded woman crawls away after her husband injures her feet. The Great
    Man in the Moon takes her upward on a sledge and makes her his wife. In the Moon's
    house she is warned not to look toward the Sun or smile at the Stealer of Entrails,
    a dancing cousin of the Moon who disembowels those he makes laugh. She later sees
    her children on earth, becomes homesick, and is returned when pregnant. The Moon
    sends animals down as food until an old woman observes him. Through this woman's
    narratives, humans learn about the inhabitants of the Moon.
  language: English
  quote_policy: quoted
