canonical_text:
  quote: ''
  summary: The passage presents Samik, called The Left-handed, as a wealthy and hospitable
    man who is nevertheless unhappy because he has no living child. His first wife
    dies after giving birth, the infant lacks milk and is strangled by Samik out of
    compassion. Samik later marries Eqariussaq, discovers she is barren, treats her
    with contempt and violence, falls in love with Arnaruniaq, and exchanges Eqariussaq
    to Alattaq the magician for the loan of a rifle. The excerpt ends as people say
    Alattaq will exercise his magic.
  language: English
  quote_policy: summarized
