  quote: ''
  summary: The narrator describes meeting members of a foreign Eskimo tribe who had
    migrated to the Cape York district, probably from around Baffinsland, about fifty
    years earlier. The migrants had merged into the Cape York tribe through wife-changing
    and intermarriage. One surviving immigrant, old Merqusaq, provided details of
    a years-long tribal migration between polar regions, which the narrator treats
    as evidence for how former Eskimo tribal migrations may have occurred.
