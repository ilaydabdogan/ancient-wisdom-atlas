canonical_text:
  quote: ''
  summary: L. Mylius-Erichsen introduces accounts gathered in 1904 from East Greenlandic
    families who had migrated west for baptism. The passage describes their partial
    Christianization, continued belief in older supernatural powers, memories of East-coast
    winter gatherings, seasonal work, conflict through insult-songs and duels, migration
    and cultural absorption, an accusation that Kunigsarfik stole souls, and Rosine's
    report of legendary extraordinary people farther north.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In 1904 the narrator met East Greenlandic families who had migrated in small
    groups to the West coast to be baptized.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The former East Greenlanders still spoke their own dialect and were described
    as only slightly changed spiritually after baptism.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: They acknowledged Christian teaching as better and wiser, but did not regard
    their former pagan beliefs as deception; they regarded those beliefs as forbidden
    by the new faith.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that pagan mysteries and supernatural forces formerly helping
    magicians were still believed to exist but no longer revealed themselves to converts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Former East-coast communities were said to have lived in large houses that
    could hold crews from several umiaqs.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Winter entertainments included spirit incantations, duet-singing, insult-songs,
    and telling old legends.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: During non-winter seasons people lived in separate tents near good hunting
    places; men hunted, and women dried meat and prepared skins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Winter abundance, idleness, old grievances, mockery, and public goading are
    described as leading to quarrels, insult-song challenges, duels, and murders.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The narrator says that murderous desire sometimes developed into mania and
    that the accounts he heard were presented as records of actual experience.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: All South-east Greenlanders except one family were said to have migrated to
    the West coast and been baptized.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The remaining family consisted of old Kunigsarfik, his wife, two sons, three
    daughters, and a son-in-law.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Autdaruta, leader of the new arrivals, challenged Kunigsarfik and accused
    him of stealing the souls of Autdaruta's brothers and sisters.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Kunigsarfik did not accept the challenge, fled north, and the later fate of
    his family was unknown.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Rosine said journeys from the East coast to the West coast had long occurred,
