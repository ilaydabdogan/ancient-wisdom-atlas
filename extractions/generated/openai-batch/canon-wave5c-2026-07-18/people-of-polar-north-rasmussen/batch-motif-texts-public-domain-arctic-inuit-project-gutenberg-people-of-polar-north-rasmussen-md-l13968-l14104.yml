  confidence: high
  cautions: The passage does not explain the mechanics of soul-stealing; it only states
    that he stole souls.
- id: motif:2
  label: weapon preparation as public sign of intended killing
  taxonomy_refs: []
  basis: The narrator explains that preparing a new iron point indicates murderous
    intent, and Ilisimartoq’s new harpoon point alerts others to watch him.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: This is presented as a social sign or practice, not as a supernatural
    event.
- id: motif:3
  label: magic song compels a dangerous magician to return
  taxonomy_refs: []
  basis: A kayak-man conjures Ilisimartoq back with a magic song or formula after
    he has nearly escaped.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage gives the effect of the song but not the exact words or ritual
    procedure.
- id: motif:4
  label: magical self-healing blocked by a material substance
  taxonomy_refs: []
  basis: Ilisimartoq draws his hand over the bullet wound and heals it, but blubber
    rubbed onto the wound prevents further magical healing.
  evidence_refs:
  - ev:15
  - ev:16
  confidence: high
  cautions: The passage does not state why blubber has this blocking effect beyond
    reporting that it prevents the magic.
- id: motif:5
  label: dismemberment to prevent revenge by the soul
  taxonomy_refs: []
  basis: After killing Ilisimartoq, the men dismember him at every joint specifically
    to keep his soul from revenging itself.
  evidence_refs:
  - ev:19
  confidence: high
  cautions: The passage concerns one feared magician and does not say whether this
    is a general funerary or anti-sorcery practice.
- id: motif:6
  label: containment of a dangerous dead person in a remote chthonic place
  taxonomy_refs: []
  basis: Ilisimartoq’s head is put in a hunting-buoy and dropped down a deep glacier
    crevasse because the killers still fear his power; later cries are reportedly
    heard from below.
  evidence_refs:
  - ev:20
  - ev:21
  confidence: medium
  cautions: The passage supports confinement of the head and posthumous cries, but
    broader interpretation as a containment motif should be reviewed.
