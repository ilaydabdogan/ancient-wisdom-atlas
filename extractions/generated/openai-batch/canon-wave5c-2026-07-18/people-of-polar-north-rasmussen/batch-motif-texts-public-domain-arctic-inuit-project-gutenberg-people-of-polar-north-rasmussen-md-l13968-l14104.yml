canonical_text:
  quote: ''
  summary: A narrator recounts Ilisimartoq, described as a soul-stealing murderer
    and powerful magician. After wintering at Igdluluarssuit, he kills two brothers
    returning from seal hunting. When he later prepares another weapon point, his
    brothers-in-law and other hunters decide to kill him first. A magic song compels
    him to return to shore, where he is shot. He nearly heals the wound by magic,
    but blubber placed on it prevents this. The men kill him, dismember him to stop
    his soul from taking revenge, and dispose of his head in a hunting-buoy down a
    glacier crevasse. Later passers-by are said to hear cries from below.
  language: English
  quote_policy: summarized
