  quote: ''
  summary: Kumagdlak, an ill man living alone with his wife, is warned of approaching
    enemies. As a magician, he uses living feathered arrows and a protective thong
    from his childhood carrying bag to defeat attackers, plunder their bodies, and
    raise a storm that destroys fleeing boats.
