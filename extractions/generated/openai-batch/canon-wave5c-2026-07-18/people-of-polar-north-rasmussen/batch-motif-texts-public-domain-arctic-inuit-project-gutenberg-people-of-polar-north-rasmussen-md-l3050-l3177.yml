canonical_text:
  quote: ''
  summary: The passage describes expedition members completing and celebrating a stone
    winter house called the "Cave in the Cliff," hosting local Eskimos with tea, biscuits,
    music, lamps, and magnesium fireworks. The narrator then encounters Arnaluk, who
    points out the approaching Polar night as the "Dark." The community welcomes the
    coming dark evenings and winter because they bring seasonal change, frozen sea,
    ice hunting, sledge travel, lamps, fires, and provisions.
  language: English
  quote_policy: summarized
