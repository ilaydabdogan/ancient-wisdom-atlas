canonical_text:
  quote: ''
  summary: 'The narrator describes a summer expedition problem caused by Count Harald
    Moltke''s illness, the failure of hoped-for transport by the whaler Vega, and
    a decision to travel north by dog-sledge to ask Samik for use of a whaling sloop.
    The party divides: some remain with Moltke, while the narrator travels with Jorgen
    Bronlund, Sitdluk, and Qisunguaq. They leave Saunders Island at midnight with
    minimal provisions, cross difficult thawing terrain, collect bird eggs, and haul
    sledges through icy glacier streams.'
  language: English
  quote_policy: summarized
