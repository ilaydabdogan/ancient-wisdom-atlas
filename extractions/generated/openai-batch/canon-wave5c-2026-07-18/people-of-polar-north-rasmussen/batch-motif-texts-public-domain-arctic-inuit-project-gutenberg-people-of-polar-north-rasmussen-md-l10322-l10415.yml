canonical_text:
  quote: ''
  summary: 'The passage describes activities around Habakkuk and Mary Magdalene''s
    prophecies: catches are brought to Habakkuk, the catechist Joseph records prophecies,
    followers abandon ordinary hunting and exhibit collective weeping, laughing, jumping,
    salutes, and hymns at graves. Shem refuses to join. Two women accused of witchcraft
    or sorcery die by water, one killed by villagers and one by suicide after asking
    her son Paul.'
