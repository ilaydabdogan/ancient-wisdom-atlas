canonical_text:
  quote: ''
  summary: 'Nikoline, a baptized East-coast woman living at Kangigdlinguaq, receives
    the narrator in her tent. Asked for old legends, she resists because she has tried
    to forget her pre-Christian practices. She recounts how old drum-songs and spirit-songs
    regained power over her after baptism, how Christian, an unbaptized magician,
    sang with accompanying women, and how she felt drawn back to her former life.
    She contrasts this with Christian comfort in seeing the dead again, especially
    her buried sister. She then explains that during baptismal instruction she could
    not understand the teaching or letters until she confessed drum-songs and remembered
    that Qangatse had once tried to teach her magic. The passage ends with the beginning
    of that confession: as children, she and Maja played at shadows in a dark empty
    house at Igdluluarssuit.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Majuvartariaq, baptized as Nikoline, is described as an unmarried woman of
    about forty living in a seal-catching camp north-east of Cape Farewell, with detailed
    physical description by the narrator.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator visits Nikoline after dark, bringing a light, matches, chewing-tobacco,
    and a biscuit, and finds her modest tent made from a disused umiaq cover stretched
    over oars.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After receiving the gifts, Nikoline takes tobacco, lights a candle, and the
    narrator asks her to speak about the time when she was a heathen on the East coast
    and to tell legends.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nikoline reacts with horror to the request and says that since becoming baptized
    and Christian she has tried to forget what belonged to her heathendom, including
    legends.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nikoline says that after baptism she once yielded to the desire to sing an
    old drum-song, after which the tune continued in her head even when her mouth
    was shut.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nikoline recounts that Christian’s umiaq came from the East coast to Qernertoq;
    Christian was then unbaptized and a magician, and he began singing spirit-songs
    with the women who had come with him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nikoline says she ran away when she heard the songs because the old melodies
    were gaining power over her, but other people persuaded her that they were only
    drum-songs and harmless to hear.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After listening at the tent door, Nikoline says she felt as if dreaming that
    she was again on the East coast, at home, still a heathen and never baptized;
    she attributes this to hearing the old drum-songs.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nikoline says her present ways and thoughts give her greater joy, especially
    the belief that she will see her dead ones again, which helps her forget the old.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Nikoline most misses a sister who died baptized and was buried at Qernertoq;
    she sometimes visits the grave and suppresses tears.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Nikoline says that when she was prepared for baptism she initially could not
    understand the teaching or learn letters, described as “those that one makes speak.”
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Her German Moravian priest teacher asked whether she had had anything to do
    with evil and told her to confess; she first confessed drum-songs and her pleasure
    in them.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: Nikoline then remembered that the old magician Qangatse had once tried to
    teach her magic, confessed this to her teacher, and afterward understood the teaching
    more easily and learned some letters.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: At the beginning of her confession, Nikoline says that at Igdluluarssuit on
    the East coast, in autumn, she and Maja played at shadows in a dark, large empty
    house, calling each other shadows and running about terrified.
  category: action
  evidence_refs:
  - ev:9
