canonical_text:
  quote: ''
  summary: A man loses his seal-hunting ability because of drowsiness, becomes unable
    to provide skins for his wife, and she runs away into a hillside fissure. He waits
    outside while several speaking insects or small creatures emerge from the hollow
    and offer themselves; he rejects each one. The wife then invites him in, he squeezes
    through the rock chink, and they are reunited. She caresses him and instructs
    him to sleep until the petrel cries and young birds are heard. He sleeps from
    winter until summer, wakes alone, finds his kayak skin aged, and returns to meagre
    fare.
  language: English
