canonical_text:
  quote: ''
  summary: Two men hunting reindeer see an inland-dweller carrying a bearded seal,
    secretly follow him to a plain, and see him descend into the earth. They follow
    into a passage and observe his wife flensing the seal inside a house; when they
    laugh at her partly dog-like lower body, the inland-dweller and his wife suspect
    outsiders. After consulting spirits, the inland-dweller identifies nearby coast-people
    carrying bows and causes the two men to lose bodily power, forcing them to crawl
    out and hide while he pursues them.
