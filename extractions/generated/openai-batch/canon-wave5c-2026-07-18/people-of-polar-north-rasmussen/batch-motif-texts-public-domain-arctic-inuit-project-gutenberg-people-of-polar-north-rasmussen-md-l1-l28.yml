canonical_text:
  quote: ''
  summary: In an author's preface, the narrator recalls hearing an old Greenlandic
    woman describe a far northern people at the end of the world, dressed in bearskins
    and eating raw flesh, in a land shut in by ice and darkened by high fjelds. The
    story says that anyone wishing to go there must travel with the South wind to
    the Lord of the wild northern gales. The narrator resolves from childhood to find
    these 'New People' and later joins an expedition to Greenland, spending the winter
    of 1903-1904 among the Polar Eskimos.
