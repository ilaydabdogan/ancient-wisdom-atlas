canonical_text:
  quote: There is a man-eating woman who lives on them.
  summary: A lone seal-catcher travels east to learn why kayakers do not return. A
    woman compels him to land, secure his kayak, enter her house, and remove his clothing.
    Inside he sees the face skins of former companions and finds a boiled human hand
    in a food bag. At night he feigns sleep, avoids her knife, escapes in his kayak,
    and reports that a man-eating woman kills eastbound travelers. He returns the
    next day, tricks or alarms her about a dangerous child in the bag on her back,
    and the thrown child becomes marine life and sea plants in the water. The man
    and woman exchange harmful wish-formulas involving knife and harpoon until he
    paddles away.
  language: English
  quote_policy: quoted
