  summary: The passage describes several amulets used by men, women, girls, and dogs.
    Animal parts, stones, hearth-stone fragments, and objects associated with urine
    are said to confer qualities such as cunning, strength, fleetness, fighting inclination,
    easier childbirth, long life, or protection from bad spirits. It also states that
    amulet use is rapidly declining among the Polar Eskimos.
