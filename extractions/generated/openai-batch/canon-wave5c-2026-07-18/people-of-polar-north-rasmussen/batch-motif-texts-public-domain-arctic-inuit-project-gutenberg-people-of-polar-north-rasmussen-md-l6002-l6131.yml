canonical_text:
  quote: ''
  summary: The passage describes Angakut magicians going beneath the sea to Nerrivik,
    called The Food Dish and Queen of the Sea, to arrange her hair so that she releases
    sea animals for people to catch. It then recounts how a petrel magician in human
    shape married a woman; after her brothers took her away, the petrel pursued them
    by raising a storm. The woman was thrown into the sea, her hand was cut off when
    she clung to the boat, and after drowning she became Nerrivik, ruler of sea-creatures.
    The passage also describes public incantations, helping spirits, indirect naming
    of endangered persons, communal response, conduct and dietary taboos, rules about
    clothing and drinking vessels, a case of illness attributed to a puppy wearing
    a child's fox-skin breeches, and special spirit-language used during incantation.
  language: English
  quote_policy: summarized
