canonical_text:
  quote: ''
  summary: Two men exchange wives. Talilarssuaq frightens the woman he has borrowed
    by driving a knife into skin on the sleeping-place. The woman runs to her husband,
    Navssarssuaq, and urges him to kill Talilarssuaq. Navssarssuaq dresses, takes
    a knife, stabs Talilarssuaq, drags him outside, and throws him on a dung-heap.
    Later Navssarssuaq spares his wife because their young son still needs her. After
    the murder, Navssarssuaq is followed and seized by an invisible avenging spirit
    keeping watch on him.
  language: English
  quote_policy: summarized
