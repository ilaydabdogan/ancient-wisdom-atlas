  summary: The passage is an ethnographic commentary on marital relations among the
    Eskimos/Polar Eskimos. It includes a heading identifying Arnaruniaq as wife of
    Alattaq, an anecdote about a man who beat his wife for refusing other men, general
    statements about polygamy, wife-choice, affection after cohabitation, and the
    narrator's statement that he pities only the woman with no children.
