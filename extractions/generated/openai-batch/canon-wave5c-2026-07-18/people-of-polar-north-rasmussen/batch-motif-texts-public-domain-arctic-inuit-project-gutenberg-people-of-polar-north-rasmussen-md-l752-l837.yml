canonical_text:
  quote: ''
  summary: A public scene of questioning links illness to a prohibition on eating
    dog flesh. Mikissoq, Sagdloq's wife, admits tasting dog meat. Sagdloq enters an
    ecstatic drum performance but cannot save her. After she dies, he withdraws, refuses
    food and speech, tells the narrator that he is too old to live without her and
    that it is best to follow her, and then starves himself while villagers' food
    offerings remain beside his body.
  language: English
  quote_policy: summarized
