  summary: The passage first concludes an episode in which Qisuk's bleached-bone amulet
    frightens pursuers and Qisuk reaches home safely. It then shifts to the first-person
    narrator preparing to leave an Eskimo community. An old woman called “The Sinew”
    speaks with him, compares him to the sea-king that arrives with spring and departs
    after summer, and advises him not to delay departure when eager to go. The passage
    closes with a reflection on the wide country, its hidden secrets, and the contrasting
    lives of summer and winter.
