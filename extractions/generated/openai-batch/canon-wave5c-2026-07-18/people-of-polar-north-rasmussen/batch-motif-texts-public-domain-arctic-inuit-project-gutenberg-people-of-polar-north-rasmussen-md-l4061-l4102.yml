canonical_text:
  quote: ''
  summary: The passage describes a belief that each person consists of soul, body,
    and name. The soul is immortal, outside the person yet life-sustaining, visible
    to great magicians, stealable and recoverable by magicians, and after death goes
    either to heaven or the sea. It also records Majaq of Cape York explaining the
    soul as the source of beauty, personhood, will, action, and life direction, followed
    by a brief story of an unkillable man whose soul moves through animals, visits
    the dead, returns as a man, and teaches what it saw.
  language: English
  quote_policy: summarized
