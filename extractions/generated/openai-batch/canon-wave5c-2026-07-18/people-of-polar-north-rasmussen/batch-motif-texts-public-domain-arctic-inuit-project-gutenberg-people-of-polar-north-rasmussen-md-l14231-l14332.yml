canonical_text:
  quote: ''
  summary: After a meal, Uase is challenged to race up Perserajuk Hill and reaches
    the top before the others. Angiamineq, Qaratsuk, and companions then ambush him
    near the kayaks after a false cry about a seal. Uase, described as a powerful
    magician, heals several wounds by stroking them with his palm, but cannot heal
    wounds he cannot reach or a stomach wound affected by spilled blubber. He gains
    time by spurting water at Angiamineq, casts him into the sea, and then saves himself
    with a false shout to an imagined kayak. Qaratsuk and Angiamineq flee to an island,
    Sorqiaq hides, and two passing kayaks later help bind Uase's wounds with watertight
    skins and tow him home.
  language: English
  quote_policy: summarized
