canonical_text:
  quote: ''
  summary: 'The passage recounts women rescuing Ere from water and then describes
    Ere''s relationship with Aleqasina, a widow with four children. An observed quarrel
    follows: Ere shouts about his unsharpened knife, drags Aleqasina by the hair,
    strikes her, and places his foot on her body. Aleqasina taunts him, invokes her
    unborn child, says she will not return, and finally strikes him in the side with
    both fists so that he falls. Her brother Sitdluk laughs and refuses to intervene,
    saying people do not interfere in quarrels between a man and his wife. The passage
    ends by noting that notable events attract hidden spectators.'
  language: English
  quote_policy: summarized
