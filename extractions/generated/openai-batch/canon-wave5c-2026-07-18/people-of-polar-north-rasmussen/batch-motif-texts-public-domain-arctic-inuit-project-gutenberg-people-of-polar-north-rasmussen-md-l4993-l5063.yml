canonical_text:
  quote: ''
  summary: An old woman associated with a bear-skin rug and the tide later avenges
    her son Ailaq. Papik resumes seal-hunting despite fear of her threat and is attacked
    by a monster amid fog on the ice. Villagers flee, an orphan boy accidentally leaves
    a blood trail, and the approaching evil spirit appears as a bear that is not a
    real bear. An old woman’s words release the dogs from enchantment; men harpoon
    the bear. When it is cut up, the old woman’s rug is found in its skin and its
    bones are human. Papik is found mutilated. The passage ends with a general saying
    that unjust killers may be attacked by a monster, and with source attribution
    to Inaluk.
  language: English
  quote_policy: summarized
