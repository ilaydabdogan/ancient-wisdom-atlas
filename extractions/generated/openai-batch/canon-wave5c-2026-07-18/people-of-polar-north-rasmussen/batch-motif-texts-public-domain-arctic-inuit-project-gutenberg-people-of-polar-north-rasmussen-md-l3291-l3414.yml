canonical_text:
  quote: '"The world is ill at ease, the sea does not freeze!"'
  summary: A first-person traveler and Qisunguaq discuss the unusually late freezing
    of the sea, which Qisunguaq attributes to the world being ashamed of strangers.
    They depart to reconnoitre the ice in Polar night, cross dangerous new ice, and
    take refuge from a gale in Pakitsoq, a narrow-entranced mountain cave, where they
    become weatherbound.
  language: English
  quote_policy: quoted
