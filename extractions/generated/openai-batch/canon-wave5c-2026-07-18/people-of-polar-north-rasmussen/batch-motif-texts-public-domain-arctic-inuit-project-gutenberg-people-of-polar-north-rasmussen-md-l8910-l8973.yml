canonical_text:
  quote: ''
  summary: Qisuk travels south from Cape York with his wife by sledge. He helps starving
    people by teaching seal-catching on slippery ice, then continues on a trade journey
    for wooden meat trays. A solitary man hosts them and warns that southern people
    are bad. Qisuk later stays among people who attack departing strangers, observes
    two drum-singing women and their rivalry over a husband, secretly sabotages sledges,
    prevents his own dogs from being overfed, and flees with his wife while pursuers'
    sledges fail. The passage ends as one remaining pursuer sees a large dog before
    his sledge.
  language: English
  quote_policy: summarized
