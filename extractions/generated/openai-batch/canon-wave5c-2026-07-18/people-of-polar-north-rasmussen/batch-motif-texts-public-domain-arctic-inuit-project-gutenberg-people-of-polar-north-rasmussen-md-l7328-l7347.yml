  summary: The passage tells of Iseraq, who has one natural leg and one leg made from
    a walrus rib, yet can run well. He steals meat from other people's meat-pits,
    hides it under stones, and retrieves it at night. A man hides in a meat-pit to
    catch the thief, seizes Iseraq by the wrist, and cuts off his hand. Iseraq remarks
    that his wrist tingles, and afterward stops stealing from meat-pits.
