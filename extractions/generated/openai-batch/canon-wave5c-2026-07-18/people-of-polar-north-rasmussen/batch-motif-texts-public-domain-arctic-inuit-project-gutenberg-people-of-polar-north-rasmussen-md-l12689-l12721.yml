canonical_text:
  quote: ''
  summary: A raven wants to marry a goose. The goose initially refuses because she
    says he is too heavy a flyer to follow the geese across the sea without rest and
    may drown. The raven repeatedly boasts that nothing can tire him. The goose becomes
    his wife, warns of grief if he is lost during the sea passage, and later urges
    him to rest before the geese depart. He refuses, flies about more, and joins the
    geese when they set out to cross the great sea.
