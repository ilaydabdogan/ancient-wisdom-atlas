canonical_text:
  quote: ''
  summary: A bachelor who refuses marriage catches a she-fox and keeps her under the
    window. While he is away hunting, domestic work is mysteriously done; he watches
    and discovers that the fox can become a woman. He catches her in woman form and
    makes her his wife. A visiting man proposes a wife exchange, is warned not to
    mention her fox smell, but does so; she screams, runs out, and is seen as a fox
    fleeing up a cliff. The husband searches for her, but she never returns. The passage
    then shifts to remarks about Christian, his past killings, his challenge songs
    against the magician Kunigsarfik, and a description of East coast Eskimo insult-song
    duels as public dispute settlement.
  language: English
  quote_policy: summarized
