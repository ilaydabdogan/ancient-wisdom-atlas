  summary: The passage recounts Uase's recovery from a severe stomach wound, the flight
    of his enemies, and a report that he later brought destruction on them by magic
    songs. It then shifts to a first-person account of trading journeys, sickness
    and deaths among boat-crews, abandonment of bereaved children and half-grown people,
    and a later tense encounter in a tent where Uase meets his old enemy Qaratsuk
    while Nakuaq works to prevent revenge violence.
