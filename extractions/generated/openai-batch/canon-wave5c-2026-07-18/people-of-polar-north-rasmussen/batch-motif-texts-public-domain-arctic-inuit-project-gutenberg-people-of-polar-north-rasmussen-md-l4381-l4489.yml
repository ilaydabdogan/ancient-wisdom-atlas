canonical_text:
  quote: The soul continues to live, and might require them.
  summary: The passage describes the body as mortal and distinct from the soul, gives
    rules for burial and post-funeral interdictions, and states that the dead person's
    soul may need implements and compensation placed by the grave.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The body is described as the mortal instrument of the soul; misfortune, sickness,
    and postmortem evil are said to remain with the body.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dead body must be buried quickly, handled only by nearest relatives, placed
    under stones with the head toward sunrise, fully dressed, and supplied with implements.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The soul is said to continue living and possibly to require the implements
    placed with the body.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The body is laced in skins and dragged to the cairn site; for five days no
    one may cross the footprints of those who dragged it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the deceased is a man, his dog team is killed and harnessed to his sledge
    by the grave; if the deceased is female, one dog is killed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The stated purpose of killing the dogs and placing them by the grave is that
    the deceased should not be alone in death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Persons who handled the corpse must remain quiet for five days and nights
    and observe restrictions on food preparation, cutting cooked meat, undressing,
    and pulling back fur hoods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the five days, the corpse handlers wash their hands and bodies; when
    the sun returns to the position it held at the death, they discard the clothes
    worn then.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: For five days after burial, at sunrise and sunset, the relatives go together
    to the grave and circle it once in the same direction as the sun's course.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: For five days and nights, no one may drive over land where a death has taken
    place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Hunting implements, other implements, sledges, kayaks, and unfinished objects
    are taken to the edge of the ice, set so that they do not point toward land, and
    left there for five days.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: During the five-day period no work may be done; if sewing is necessary, the
    eyebrows must first be blackened.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Men who have handled dead bodies may not disentangle traces themselves; if
    they must travel, they take a boy who can do what is forbidden to them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The first time such men go onto the ice or enter a kayak after a funeral ceremony,
    they must repeat a formula.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: For five days no hunting or fishing may be done from the village or dwelling
    where the death occurred.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: When anyone dies, the left nostril is plugged with straw during the funeral
    ceremonies to secure long life.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: Straw must not be plucked near a village where death has occurred, because
    the earth is described as a living thing that would feel pain if something of
    itself were killed soon after a person's death.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:18
  text: If straw is indispensable, it must be gathered on ground separated from the
    village by a glacier.
  category: action
  evidence_refs:
  - ev:12
- id: obs:19
  text: The interdictions are said to be observed out of fear of the dead man.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:20
  text: No one may take items placed by a grave unless compensation is put in the
    grave for the dead man's soul.
  category: action
  evidence_refs:
  - ev:14
- id: obs:21
  text: Compensation to the dead man's soul may be in miniature form, including model
    implements or a small piece of meat or blubber, because the soul can magnify it
    for itself.
  category: object
  evidence_refs:
  - ev:14
