canonical_text:
  quote: ''
  summary: After a brief fragment in which Navssarssuaq dies of sickness before an
    avenging spirit can tear him apart, the passage tells of Artuk, who after burying
    his wife refuses corpse-handler penances and performs forbidden acts involving
    meat, vermin on ice, and water from an ice-cliff. Later he binds his son to a
    sledge and goes onto the ice; his daughter hears two spirits laughing, searchers
    find Artuk torn to pieces, and the bound son is untouched but dead from fright.
  language: English
  quote_policy: summarized
