canonical_text:
  quote: ''
  summary: 'A household listens while Vittoralak describes beliefs about Qivitoq or
    hill-men: people who leave others in anger, may become subject to the Devil, gain
    powers such as speed, climbing, flight, disappearance into the earth, and animal
    transformation, and may become unable to die. Some dead Qivitoqs are said to have
    been found as Christians in rock clefts facing east with folded hands. Very old
    hill-men are said to travel north to a dark country after confessing their identity
    and sins to a human being. The passage ends with the listeners in an eerie mood
    and old Alina beginning an old song.'
  language: English
  quote_policy: summarized
