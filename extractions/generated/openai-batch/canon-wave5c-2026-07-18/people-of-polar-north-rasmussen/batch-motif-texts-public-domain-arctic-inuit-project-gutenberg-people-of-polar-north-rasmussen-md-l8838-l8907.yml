canonical_text:
  quote: ''
  summary: Neruvkaq abuses his wife Navarana, who belongs to the tuneq people and
    has many brothers. She flees to her inland-dwelling brothers, who attack Neruvkaq’s
    house. Neruvkaq arms himself with a walrus-tooth-covered protective fur-coat,
    tricks the attackers with a dog dressed in seal-skin fur, leaps onto a meat stone,
    and shoots them with walrus-tusk-barbed arrows while his mother charms strength
    into him. The survivors flee far south. Navarana hides under a sleeping-place,
    refuses to come out despite being fed and promised safety, and dies there.
  language: English
  quote_policy: summarized
