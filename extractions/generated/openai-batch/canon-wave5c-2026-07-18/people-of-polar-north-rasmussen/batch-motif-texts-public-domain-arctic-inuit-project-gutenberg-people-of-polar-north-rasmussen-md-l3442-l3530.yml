  quote: "“the weeping of those under the earth”"
  summary: The narrator and Qisunguaq are weatherbound in a cave during a storm. They
    make a blubber lamp and cooking fire, eat soup and walrus meat, sleep through
    the weather, wake to dogs barking at a possible bear, and later describe the grinding
    ice-foot as a sound Eskimos call the weeping of those under the earth. The passage
    also reflects on rest, endurance, shelter, and companionship during hardship.
