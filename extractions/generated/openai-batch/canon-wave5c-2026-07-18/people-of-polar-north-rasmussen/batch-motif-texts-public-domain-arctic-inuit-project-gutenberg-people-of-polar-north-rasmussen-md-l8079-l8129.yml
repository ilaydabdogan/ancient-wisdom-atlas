canonical_text:
  quote: ''
  summary: A tale in which noisy children do not believe the orphan Kavssagssuk's
    warning that the Great Fire is approaching. Kavssagssuk hides under drying skins
    while the Great Fire enters, burns the children, and flies away. Later, adults
    make noise to summon the being again and scald it with boiling train-oil hung
    over the doorway. The episode is followed by a prohibition on children shouting
    and making great noise.
  language: English
  quote_policy: summarized
