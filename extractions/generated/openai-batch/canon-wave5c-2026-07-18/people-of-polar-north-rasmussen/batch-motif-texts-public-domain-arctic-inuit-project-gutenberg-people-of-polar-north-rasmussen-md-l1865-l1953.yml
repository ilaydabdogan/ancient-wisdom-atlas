canonical_text:
  quote: ''
  summary: The passage describes spring camp life around fire and food, an offer of
    fresh seal meat and liver, Sorqaq's advice that the narrator should take a wife
    from the village, a planned bird-catching trip to Kiatak with Isigaitsoq as the
    narrator's partner, the cancellation of the trip by a gale, and two old men cooking
    seal meat in a stone hut during the storm.
  language: English
  quote_policy: summarized
