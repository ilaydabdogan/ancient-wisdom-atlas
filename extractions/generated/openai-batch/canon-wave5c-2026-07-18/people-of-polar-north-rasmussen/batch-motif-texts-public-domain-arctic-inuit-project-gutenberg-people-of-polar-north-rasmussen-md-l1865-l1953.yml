- id: obs:1
  text: An unnamed person reappears with half of a very fat seal and offers the narrator
    a blood-dripping liver to eat while waiting for the pot to boil.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In spring there are no regular sleep hours in the camp; an open fire gathers
    people at an outdoor eating place while men leave and return on fishing trips.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator and others sit around the fire for warmth and food and taste
    food from the pot several times.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Old Sorqaq says the narrator ought to take a wife among the village girls
    and names Isigaitsoq and Amimik as possibilities.
  category: speech
  evidence_refs:
  - ev:4
  - ev:10
- id: obs:5
  text: Sorqaq says a young unmarried traveling man will get a bad reputation and
