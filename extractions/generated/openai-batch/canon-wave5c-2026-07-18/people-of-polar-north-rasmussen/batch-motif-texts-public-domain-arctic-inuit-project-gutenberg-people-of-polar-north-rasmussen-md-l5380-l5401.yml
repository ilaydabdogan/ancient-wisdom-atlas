canonical_text:
  quote: ''
  summary: 'The passage names Inetlia as wife of Imerarsunguaq, then relates a child-stealing
    episode: a blind woman gives a child to the Child-stealer by mistake; the child
    is later seen on floes, caught with a seal-thong lasso, and then enchanted by
    the grieving Child-stealer so that it dies. The passage also reports that a spirit,
    or a dead mother herself, may come and frighten people to death when orphan babies
    scream; an example tells of a dead mother appearing in a doorway after an orphan
    baby was left unquieted.'
  language: English
  quote_policy: summarized
