canonical_text:
  quote: ''
  summary: A first-person expedition diary describes travel across a bay and broken
    ice, repeated storms, sheltering in a cave and under an improvised sledge-and-skins
    shelter, hunger and wet clothing, Bible reading and storytelling for comfort,
    an appeal to spirits in the rocks to stop the rain, an accusation that misfortune
    comes from the dead because grave goods were taken, and a failed attempt to cross
    storm-swollen streams.
  language: English, with a Greenlandic phrase translated in the passage
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party crossed the mouth of Iterdlagssuaq, became soaked by water over
    the sledges, and encamped by a small stream-bed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rain, a south-west gale, and driving sleet forced the party to shelter in
    a nearby cave for thirty-six hours.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the storm the party dried clothing and sleeping-bags, made tea, boiled
    seal skin as starvation food, and later shot seals after dogs had eaten their
    meat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Broken ice forced travel on floes, the ice-foot, and land; near the fjord
    head Jorgen went ahead and shot a reindeer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A violent storm among rocks and glaciers swept down sand and stones, and the
    party built a small shelter from sledges, blubber, and freshly flayed sealskins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: While weather-bound under dripping blubber, the companions told stories, read
    aloud from the Bible, and tried to forget that they were wet and hungry.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Their sleeping-bags were drenched, their clothes smelled musty, their feet
    were white and swollen from damp, and they were cold and near mental breakdown.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Jorgen urged Knud to talk and tell tales so that silence would not become
    unbearable.
  category: speech
  evidence_refs:
  - ev:6
  - ev:9
- id: obs:9
  text: Sitdluk called toward the rocks for the rain to stop, because he believed
    powerful spirits there could command wind and rain.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Qisunguaq reproached the narrator for taking objects from a grave and said
    the calamity was revenge of the dead.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The narrator said he had taken a scratching-pin, a needlecase, and a curved
    knife from an old grave, and that he had given tea, matches, blubber, and meat
    as exchange gifts to the soul.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the storm cleared, the party tried three places to cross a stream, but
