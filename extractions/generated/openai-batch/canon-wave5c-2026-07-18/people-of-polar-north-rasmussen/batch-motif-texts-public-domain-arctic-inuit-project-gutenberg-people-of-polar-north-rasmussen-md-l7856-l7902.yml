canonical_text:
  quote: ''
  summary: A kayak traveller removes moss from a speaking seal bone, ignores a shell-fish
    that calls him down into the sea in order to eat him, escapes a man-eating old
    woman, discovers that another man-eater has eaten his son and spread out the son's
    skin, kills that man-eater, and returns home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: While paddling, the man hears a seal's bone ask him to remove moss from the
    hole through it; he removes the moss and continues.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A shell-fish calls from down in the sea and invites him to paddle his kayak
    down through the water; the passage states that the shell-fish wanted to eat him,
    and he ignores it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man sees an old woman, paddles to her, and gets out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The old woman offers to dry his boots, takes them, and hangs them too high
    for him to reach; the man cannot sleep because of fear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the man asks for his kamiks, the old woman is identified as a man-eater;
    he seizes the kamiks and flees to his kayak while she pursues him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pursuing old hag voices a wish to flay the man, and the kayak nearly capsizes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The kayak-man voices a wish to send his arrow through the old woman; after
    this, she falls down and bends her knife.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The kayak-man sees another man, who calls attention to a spread-out skin;
    the kayak-man recognizes his son's kayak and learns that the stranger had eaten
    his son and spread out his skin.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The kayak-man goes ashore and tramples the man-eater to death, grinding every
    bone in his body to powder.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the killing, the kayak-man goes home again.
  category: sequence
  evidence_refs:
  - ev:7
