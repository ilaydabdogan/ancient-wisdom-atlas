canonical_text:
  quote: ''
  summary: A first-person speaker recounts how an old magician initiated him by leading
    him to a cave where a bear devoured and restored people, thereby increasing power
    over helping-spirits. The speaker later describes an encounter at sea with fire
    people, rescue by a dragon-prowed kayak, subsequent spirit assistance, and the
    loss of those spirit contacts after baptism. The passage then shifts to an evening
    storytelling scene in which Christian tells legends and animal fables, especially
    about the raven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man invites a fatherless boy to travel east with him and says he will
    teach him something.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a fjord near a cave, the old man removes his clothes, enters the cave,
    and tells the boy to watch what happens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A great bear swims ashore, approaches the old man, crunches him limb by limb,
    eats him, vomits him out, and swims away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old man says that each time he allows himself to be devoured alive by
    the bear, he gains greater power over his helping-spirits.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: On a later journey, the old man brings the boy to the cave so that the boy
    may be eaten by the bear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The bear attacks the boy and crunches him limb by limb and joint by joint;
    the only part said to hurt is the bite in the heart.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the bear ordeal, the speaker says he ruled his helping-spirits, acquired
    many new helping-spirits, and was protected from danger.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: While seal-hunting at sea, the speaker is surrounded by many kayaks and an
    umiaq, and the people in them try to take both him and his bearded seal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The hostile kayaks are identified as belonging to the fire people, who live
    in a country said to lie between the sea and the land.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: A remarkable kayak with a prow like a great opening and shutting mouth pursues
    the fire people, and those in its path are cut in two if they do not move away.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The speaker thinks the umiaq and kayaks sank or disappeared; he says fire
    people can appear suddenly and disappear just as suddenly.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The man with the dragon in his prow says he belongs to the fire people, helped
