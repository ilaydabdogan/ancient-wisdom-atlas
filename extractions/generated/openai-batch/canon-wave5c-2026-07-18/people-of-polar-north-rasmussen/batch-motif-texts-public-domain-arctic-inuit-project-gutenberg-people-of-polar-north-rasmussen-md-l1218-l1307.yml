canonical_text:
  quote: ''
  summary: 'In the section titled “MERQUSAQ,” a narrating group reaches Eta after
    a punishment, finds abundant reindeer, and encounters two sledges from a long-sought
    neighboring people. The arrivals, Arrutsak and Agina, come from Pitoravik. The
    group rejoices that Qitdlarssuaq, described as their great magician and leader,
    has brought them to new country and new people. Arrutsak is noted for a wooden
    leg made by his mother after an accident. During a shared meal, the groups misunderstand
    a food-sharing custom called Amerqatut, which the new people later adopt. Itsukusuk
    releases his wife Ivaloq from a snow-hut where she had been confined, saving her
    life. The migrants then teach the Pitoravik people several skills: snow-hut construction
    with lower entrances, bow-and-arrow hunting of reindeer, salmon spearing, kayak
    building, and kayak hunting. The Pitoravik people explain that their forefathers
    had once known kayaks, but disease killed the older knowledge-holders and the
    kayaks were buried with their owners, so the practice was forgotten.'
  language: English
  quote_policy: summarized
