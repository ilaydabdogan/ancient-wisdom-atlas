canonical_text:
  quote: ''
  summary: After a storm, the narrator and companion confirm that sea ice makes return
    travel possible. Qisunguaq cancels a planned journey south, saying gifts and life
    among strangers would mean death for him. In a night episode he speaks of spirits
    of the dead, hidden things, a spirit song, fear of the narrator, and a vision
    of the deceased Mijuk beckoning him upward. The narrator calms him by speaking
    as if he were Mijuk's spirit. Qisunguaq later disappears, is found in Umanaq,
    enters the young people's house, courts Kujapik, and avoids further travel south
    with the narrator. The passage also describes the young people's house as a village
    institution for unmarried people and possible marriage formation.
  language: English
  quote_policy: summarized
