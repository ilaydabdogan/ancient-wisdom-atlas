  summary: A man named Narrajina, a skilled reindeer-hunter, tightens his belly with
    thongs to run lightly while hunting. After returning, he unstraps his belly, cooks
    meat, and eats alone until his stomach grows so large that he digs a hole for
    it and warns passers-by not to come near. He repeatedly hunts, eats without stopping,
    buries surplus meat, and never gives any away.
