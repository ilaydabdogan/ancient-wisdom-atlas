  summary: The passage recounts a failed reindeer hunt with sledge-dogs, an evening
    in the tent where Manasseh describes a revelation that convinced him he should
    become a missionary, and the opening of a later story in which Habakkuk’s son
    accidentally kills his sister with a hooked arrow.
