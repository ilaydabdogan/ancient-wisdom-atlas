  quote: I was still stronger than death.
  summary: A speaker recounts that Qaingaq saved Aleqa and Pualuna by sledge, then
    describes frozen dead kin who could not be buried and would be carried by melting
    ice into the sea. The speaker asks a guest to repeat the account and points to
    his blinded eye, scars from bears, losses among his family, and continued will
    to live while still able to hunt.
