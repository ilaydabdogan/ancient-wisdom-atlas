canonical_text:
  quote: ''
  summary: The passage gives Otaq's first-person account of becoming a magician through
    repeated encounters with hill spirits, acquiring helping spirits, revealing himself
    during illness in the community, and using spirit knowledge to heal and predict
    illness. A closing editorial note compares Polar Eskimo spirit worship with Greenlandic
    forms.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Otaq is introduced as a man about twenty-five years old, one of the best hunters
    in the tribe, and narrator of an account about acquiring power over helping spirits.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The introductory commentary says young magicians use moments when others are
    alarmed by misfortune or illness to perform a first conjuration.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Otaq wanted to become a magician and went far up into hills and rocks to sleep
    there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the hills Otaq saw two great hill spirits, described as tall as a tent,
    and heard them sing drum-songs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Otaq remained silent while the hill spirits sang because he was ashamed and
    did not dare speak to them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the first encounter Otaq returned home, considered himself only a little
    of a magician, and told many people nothing about it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: On another outing in the hills while hare hunting, Otaq climbed a great rock,
    lay down, heard the same hill spirits, and heard one ask him for a wooden ladle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Otaq did not tell people what he had seen after the second encounter, but
    he carved a very beautiful and clean wooden ladle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The third time Otaq heard the hill spirits' song, he was in his house; the
    spirits sought him of themselves, and he says he was becoming more of a magician
    while people did not know it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When Otaq saw the hill spirits again, a great parti-coloured dog was running
    after them, and the dog became his helping spirit.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Otaq revealed himself as a magician only when many people fell sick, and he
    says he helped many who were ill.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Otaq says his helping spirits know his thoughts and will and help him when
    he gives commands.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Otaq says that when he was very ill he lost much magic power and his helping
    spirits despised him because he fell ill; later he says he is again a great magician.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Otaq says his wife can hear the spirits when they come to him and that he
    knows when people will become ill and when they can recover.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: Otaq says Meqo may die in the autumn, may perhaps be helped, and that his
    helping spirit told him she will be ill.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: The closing commentary states that Polar Eskimo spirit worship is simplified
