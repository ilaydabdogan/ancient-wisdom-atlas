canonical_text:
  quote: ''
  summary: The passage describes restrictions placed on a woman after miscarriage,
    including rules about sleeping, clothing, food, vessels, water, animal flesh and
    skins, fire, and drying clothes. It states that the restrictions end when the
    sun returns to the same heavenly position as at the miscarriage. It also lists
    dietary and vessel restrictions for children and young people, with release conditions
    tied to hunting achievement for young men and childbirth for women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the woman spends the night away from the village, her husband must build
    her a snow-hut.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman must not remove her clothes when sleeping in a snow-hut on the ice,
    but must remove her kamiks or boots when eating.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the woman eats in a strange house, she must receive food on a separate
    dish, and unfinished food must be thrown to the dogs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If she has no older children, she must take in a strange child as a helper
    because she must not do anything for herself.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman is restricted in cutting meat, especially freshly caught meat and
    boiled meat from the pot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Only her nearest relatives may eat from the same boiling of meat as she.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: She must not fetch snow or ice for water; someone else must pour water for
    her, and she must have her own drinking-vessel.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: She must not eat the flesh of bears, foxes, or rough seals, and she must not
    sew certain undressed skins or dress skins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: If a freshly caught fox is in the house and its nose has not been slit, she
    must have nothing to do with fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In summer she must dry her clothes on the hills in the sun rather than in
    the tent.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Her husband’s clothes must be spread in the sun by others, though she may
    hang them over the lamp-fire herself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: She is released from the interdictions when the sun is again in the same heavenly
    position as at the time of the miscarriage.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Children and young people must refrain from eating specified animals, organs,
