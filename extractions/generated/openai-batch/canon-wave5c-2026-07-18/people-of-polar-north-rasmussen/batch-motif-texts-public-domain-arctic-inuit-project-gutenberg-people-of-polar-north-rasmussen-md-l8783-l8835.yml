  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The inland-dwellers practice fast running because they often catch foxes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When an inland-dweller is to become a fast runner, he is placed in a bearded
    seal skin filled with worms, with only his head sticking out; the worms suck all
    his blood, and this is said to make him very fleet.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The narrator reports that his father saw a Little Auk skin stuffed with worms
