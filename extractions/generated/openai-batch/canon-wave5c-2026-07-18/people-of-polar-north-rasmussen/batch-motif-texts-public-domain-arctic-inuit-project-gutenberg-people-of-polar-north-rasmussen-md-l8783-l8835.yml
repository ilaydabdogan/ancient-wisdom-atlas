canonical_text:
  quote: ''
  summary: A sledge party near Eta follows dogs to an entrance in the ground leading
    to an inland-dweller house. The inland-dwellers panic at the dogs, push out an
    old woman who dies of fright, and later flee far inland. The passage describes
    inland-dwellers as timid and afraid of dogs, mentions a coast-dweller married
    to an inland-dweller whose eyes bleed at the sight of dogs, and describes a fast-running
    practice involving a bearded seal skin filled with worms that suck blood. A Little
    Auk skin stuffed with worms is reported as having been seen at Eta.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sledge travels inland east of Eta toward a big lake; the dogs sniff, run
    across a plain, stop, and put their noses down to the ground where an entrance
    to an inland-dweller house is found.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The inland-dwellers scream when they see the dogs, push out an old woman while
    escaping inside, and the old woman dies of fright.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man enters the house and says he is distressed at having caused the old
    woman's death; the inland-dwellers reply that it does not matter because her skin
    was wrinkled.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After the encounter, the sledges go home and the frightened inland-dwellers
    flee far inland; later only the remains of their house are found, and a narwhal
    tusk is dug up there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage explicitly characterizes the inland-dwellers as not dangerous,
    but timid and afraid of dogs.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A coast-dweller named Suagak has an inland-dweller husband; when he visits
