canonical_text:
  quote: ''
  summary: The narrator describes a phonograph concert at Kangeq, where Greenlandic
    listeners marvel at a small machine and funnel that produces speech, music, and
    many languages. Some listeners associate the speeches with black art, keep away
    from the funnel, and imagine a person inside. After explanations of the machine
    and a reverent viewing of Edison's portrait, preparations begin for an open-air
    christening dance on a rough board floor set on a flat rock, with music from a
    harmonica and three-stringed violin drawing the people together.
  language: English
  quote_policy: summarized
