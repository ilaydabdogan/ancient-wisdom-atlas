canonical_text:
  quote: ''
  summary: 'In a cave during a storm-bound journey, the narrator and Qisunguaq discuss
    masters, wisdom, possessions, and Qisunguaq''s wish to follow the narrator south.
    Qisunguaq is described as an orphaned, skilled hunter who lacks property and hopes
    to gain possessions and support his younger brother. During the night he tells
    a story about Alussaq, a man famous for loving his wife: while traveling by sledge
    with his wife and child, the child falls into the sea; later the wife, Inutaq,
    is killed in a sledge accident near a village. Alussaq embraces her, sews her
    body in skins, and buries it under stones. The passage ends with the storm abating
    and the narrator viewing the Igfigsoq Glacier and reflecting on the power and
    beauty of nature.'
  language: English
  quote_policy: summarized
