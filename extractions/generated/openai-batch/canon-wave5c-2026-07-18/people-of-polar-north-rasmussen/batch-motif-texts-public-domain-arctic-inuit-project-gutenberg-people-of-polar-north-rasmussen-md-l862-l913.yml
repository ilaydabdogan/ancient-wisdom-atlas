canonical_text:
  quote: ''
  summary: The narrator introduces Merqusaq’s account as an example of a life shaped
    by continual travel. Merqusaq says he was born on the ice during a winter journey
    across the sea and has spent his life journeying. He describes northern Inuit,
    occasional visits by large ships with white men, and news of distant Inuit across
    the Great Sea that impressed Qitdlarssuaq. Panigpak then begins to describe Qitdlarssuaq,
    his grandfather, as a powerful magician whom the Inuit obeyed and feared, and
    recalls being held on his knee while Qitdlarssuaq sang spirit songs.
  language: English
  quote_policy: summarized
