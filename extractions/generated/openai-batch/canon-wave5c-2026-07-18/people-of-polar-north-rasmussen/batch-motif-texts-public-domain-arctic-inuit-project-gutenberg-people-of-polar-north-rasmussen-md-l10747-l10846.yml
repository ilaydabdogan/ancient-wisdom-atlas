canonical_text:
  quote: ''
  summary: An experienced male speaker recounts years of summer reindeer-hunting,
    especially in South Stromfjord. He describes traveling inland by umiaq, camping
    with family groups, drying meat, enduring long marches, and the hardship and attraction
    of the seasonal hunt. Alafitdle adds that hunters are glad to return home when
    coffee and pipes are exhausted, though she still longs for the hills. A young
    girl evokes the far inland reindeer season near the iceblink, high hills, and
    large lakes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The male speaker says he hunted for twenty summers, began at about fourteen,
    went north with an uncle, later mastered his own umiaq, and hunted reindeer each
    summer until age thirty-six before turning to salmon-fishing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker contrasts North Greenlanders as more agile and competitive on
    land with Southerners as better in kayaks, attributing the northern difference
    to winter ice cutting them off from the sea.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: South Stromfjord is described as an especially good reindeer district, reachable
    by umiaq, with the upper fjord opening into a broad valley toward the inland ice.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: During reindeer-hunting from June to September, groups travel with wife and
    children, draw the umiaq onto the beach, and usually bring guns, coffee, tobacco,
    and sometimes a small sailcloth tent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At good reindeer pastures the party encamps; women and children stay behind
    while men range through neighboring country, bring game back to camp, and cut
    meat into thin cakes to dry on rocks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The hunters make deposits of dried meat at successive inland camps and carry
    the deposits back down to the umiaqs on the return.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Long marches from early morning until late at night are described as hard
    on children of five or six, yet as making them reindeer-hunters before they have
    stood before the priest.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Women carry heavy loads, may initially despair and vow not to return, but
    later become used to sleeping outside, walking long distances, and carrying loads;
    in later years they may be among the first to want to go.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The hunting life is described as a mixture of sunny days, rainy days in tents
    or caves, plentiful game or fruitless hunting, luck and ill-luck, and occasional
    danger, yet the group loves the season and is eager to start each spring.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Alafitdle says people are also glad to get home when coffee is gone and pipes
    are used up, but adds that when she sees the hills she wishes herself back at
    the reindeer grounds.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A young girl describes the reindeer season as far inland near the iceblink,
    behind high hills and large lakes compared to pots full of water.
  category: speech
  evidence_refs:
  - ev:7
