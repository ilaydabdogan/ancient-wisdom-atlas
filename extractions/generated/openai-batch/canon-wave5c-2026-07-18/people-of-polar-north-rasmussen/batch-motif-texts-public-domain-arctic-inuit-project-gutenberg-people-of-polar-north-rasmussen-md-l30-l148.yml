  summary: The narrator's expedition reaches a deserted Polar Eskimo settlement under
    severe strain. They inspect recently abandoned dwellings and tracks, recall an
    old Greenlandic tradition about a bear-hunter seeking unknown northern people,
    and examine houses, meal-stones, and a burial with possessions.
