canonical_text:
  quote: ''
  summary: Pautusorssuaq, Alattaq's nephew, desires Alattaq's wife and kills Alattaq
    when Alattaq is about to leave with her on a seal-catching journey. Pautusorssuaq's
    own wife flees to her parents, while Pautusorssuaq takes Alattaq's wife. She gives
    birth to a bearded monster and dies. Later, Alattaq's soul or spirit, associated
    with a fox amulet and appearing also in bear shape, avenges the murder by tearing
    Pautusorssuaq apart. The passage closes by saying that revenge comes upon murderers.
  language: English
  quote_policy: summarized
