canonical_text:
  quote: ''
  summary: The passage describes illness and death as caused by loss of soul, then
    recounts Nivigkana's soul-flight below the earth to recover the soul of a sick
    woman, Angina. It also describes animal souls, especially bear souls, precautions
    after killing a bear, and a tale in which bears appear in human shape and a killed
    bear's soul carries the offerings hung over its skin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person's illness and death are described as caused by loss of the soul,
    and a stolen soul is said to be recoverable by a magician.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nivigkana, an old woman, reports that she took a soul-flight below the earth
    to the dead to save a sick fellow-villager.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nivigkana's soul goes through a narrow opening in the ground while her body
    lies lifeless in the house; the sick woman she seeks to help is Angina.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The way to the underworld passes down a ravine with a great waterfall and
    opens into a country with a dark-blue sky, a smaller pale sun, winter without
    snow, and ice over the sea.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the ice Nivigkana sees three men pushing sledges without dogs and recognizes
    her deceased brother; Kale supplies the name Qajutaq because Nivigkana may not
    say the dead man's name.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The dead men say the underworld is pleasant and has seals, walruses, narwhals,
    and a brook with many salmon.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nivigkana's brother tells her to turn back unless she wants to remain below,
    while the other two men try to hold her back.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nivigkana sees the soul of sick Angina on the shore, seizes it, goes back
    up the ravine to people, and Angina later recovers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says animals also have souls, that the bear's soul is the most
    dangerous, and that precautions are needed after killing a bear so the soul will
    not return to avenge itself.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: After a bear hunt, the flayed skin is brought into the house and laid in a
    qimerfik, and offerings are hung over it according to whether the bear is male
    or female.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The offerings are kept hanging for five days; the bones are collected beside
    the head, which is turned inward, so that the bear's soul will have less difficulty
    getting home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Human equipment is provided to the bear soul because bears are said often
    to assume human shape.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A woman enters an unfamiliar house, finds that its residents are bears in
    human shape, and hides behind skin hangings.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: One bear carries a hunting-thong and harpoon like a man and notices the bulging
