canonical_text:
  quote: We observe our old customs, in order to hold the world up, for the powers
    must not be offended
  summary: 'The passage presents Polar Eskimo explanations of religious belief: rules
    around birth and death form a moral foundation; Angdkut are trusted for practical
    survival; a breach of custom by a recently bereaved young man is followed by a
    destructive gale; and a leading man explains that customs are observed to hold
    up the world, avoid offending powers, and avert illness, famine, storm, waves,
    and flood.'
  language: English with cited Eskimo terms
  quote_policy: quoted
