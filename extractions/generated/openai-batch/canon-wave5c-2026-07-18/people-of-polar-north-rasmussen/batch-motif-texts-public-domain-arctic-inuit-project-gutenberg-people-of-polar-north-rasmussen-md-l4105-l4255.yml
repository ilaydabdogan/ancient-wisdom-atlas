canonical_text:
  quote: It was the soul of the invulnerable Avuvang that had changed itself, first
    into a seal and then into a fox...
  summary: A man named Avuvang is invulnerable to attack, is later murdered through
    a seal breathing-hole, and his soul takes animal forms to destroy his enemies.
    He then passes through multiple animal existences, learning their ways, being
    killed or transformed, and finally returns to human birth by entering a woman
    during the flaying of his seal body.
  language: English
  quote_policy: quoted
