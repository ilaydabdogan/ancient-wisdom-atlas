canonical_text:
  quote: ''
  summary: 'A local West Greenlandic song and explanation tell of Pandna/Panona, a
    beautiful pregnant wife abused and pursued by her husband Ordlena, who leaps from
    Syltinde/Awl Rock; the red stones are said to be colored by her blood. The surrounding
    travel narrative describes hospitality during storm and rain: a wet young woman
    from an umiaq crew is taken in, old Alina stays awake to protect the guest from
    roof drippings, and Alina and Vittoralak give food, prayers, and a final gunshot
    farewell when the narrator departs by kayak.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An elderly singer or mother sings a song about approaching Ikamiut, seeing
    a great fjeld descending into the sea, and a woman who threw herself from its
    top, leaving the rock blood-red.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The singer says she has forgotten more of the song but can explain its subject,
    identifying the old-time figures Ordlena and his beautiful wife Pandna.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ordlena is described as fond of Pandna but behaving badly toward her, becoming
    jealous, torturing her, pricking her with a kayak-knife, and stabbing her with
    a jagged whale-knife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pandna, soon to become a mother, runs up Syltinde while Ordlena follows; he
    calls to her and promises better treatment, but she reaches the top and jumps
    before he can seize her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pandna is dashed to pieces, and her blood is said to run down the mountain;
    the red stones of Syltinde/Awl Rock are explained as colored by her blood.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:6
  text: The narrator is invited to Evali's house for boiled halibut; the house has
    no roof drippings, a stone lamp blaze, a steaming dish of halibut, and coffee.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Evali's wife notices someone at the window and brings in a young woman whose
    hair and body are wet and whose feet are swollen from water and cold.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The young woman says she belongs to an umiaq crew overtaken by a storm, forced
    to land inland, and then to walk to Ikamiut.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The young woman borrows dry clothes from Evali's household and the narrator's
    kayak-men, then eats the remaining food hungrily.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Old Alina stays awake at night to empty tin boxes placed under roof drippings
    so the guest will be protected from the rain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The kayak-men announce good weather after going to the Look-Out rock; Alina
    makes coffee, and the family gives the travelers dried capelin, cod, and a dried
    razorbill.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: At farewell, the two old people have tears in their eyes; Alina says she will
    think of the narrator and pray for safe return, and Vittoralak gives a final farewell
    by firing his last percussion-cap.
  category: sequence
  evidence_refs:
  - ev:8
