canonical_text:
  quote: ''
  summary: 'The passage moves from ominous signs left in a house and news that white
    men have arrived, into a spring scene at an Inuit settlement: thaw, returning
    animals and seabirds, first bird-catch fires, communal ease in warm weather, and
    then a sudden communal halt when Sagdloq, the oldest and greatest magician, announces
    that he will conjure spirits to cure his sick wife. Villagers gather in reverent
    stillness around the arrangement of sick woman, son, apprentice, and magician.'
  language: English
  quote_policy: summarized
