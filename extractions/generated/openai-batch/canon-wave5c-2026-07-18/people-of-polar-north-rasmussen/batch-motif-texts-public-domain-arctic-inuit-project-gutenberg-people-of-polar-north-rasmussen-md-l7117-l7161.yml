canonical_text:
  quote: ''
  summary: A giant of enormous size captures men from five kayaks, intending to use
    them as amulets, and places them on a shelf under his lamp. After eating polar
    bear and whale-beef, he sleeps. His fox-sized lice bite him, and he mistakes the
    disturbance for the men spilling lamp-black. The men lower themselves with sealskin
    thongs, cross a high threshold, return to their kayaks, and escape. The giant
    later regrets not tearing out their eyes.
