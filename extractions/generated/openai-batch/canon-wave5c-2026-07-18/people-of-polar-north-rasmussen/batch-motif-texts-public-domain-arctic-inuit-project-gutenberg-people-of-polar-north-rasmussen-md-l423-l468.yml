canonical_text:
  quote: '"The trail of giants!"'
  summary: A group of bear-hunters notices unfamiliar sledge and footprint tracks
    in the snow. The tracks appear much larger than their own and seem to come from
    the south toward Cape York. The men fear the unknown strangers may be hostile
    and hurry toward their settlement, where wives and children are alone. At the
    abandoned settlement they first see the place where the visitors' dogs had been
    loose, contrary to local Polar Eskimo practice.
  language: English
  quote_policy: quoted
