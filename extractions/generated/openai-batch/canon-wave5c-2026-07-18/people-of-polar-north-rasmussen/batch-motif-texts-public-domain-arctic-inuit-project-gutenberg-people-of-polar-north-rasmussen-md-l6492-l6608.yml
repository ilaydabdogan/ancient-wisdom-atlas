canonical_text:
  quote: ''
  summary: A man sees wild geese remove feather coats and become human. He hides coats,
    takes one goose-woman as wife, and she bears twin boys. She makes a new feather
    coat and flies away with the children. The man pursues by magic through obstacles,
    reaches her people with help from Kajungajorssuaq, reunites briefly, then kills
    her after she feigns death and lies about her identity. Her goose compatriots
    seek revenge, but the man kills the avenging flocks with a whip-lash and lives
    on their fat.
  language: English
  quote_policy: summarized
