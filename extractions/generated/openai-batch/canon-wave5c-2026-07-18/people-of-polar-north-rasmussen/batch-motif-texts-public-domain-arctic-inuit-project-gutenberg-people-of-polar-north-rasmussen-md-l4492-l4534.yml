canonical_text:
  quote: the name as a kind of soul,
  summary: The passage describes an older belief that a name functions as a soul carrying
    vitality and qualities. A deceased person is said to have no peace and not to
    pass to the land of the departed until the name is given again. The name enters
    a pregnant woman, is born with the child, and is identified through a magician
    or wise woman aided by helping spirits. The passage also records Nivigkana's support
    for the view, Majaq's skeptical explanation of naming, and Aisivak's rebuke of
    younger irreverence.
  language: English
  quote_policy: quoted
