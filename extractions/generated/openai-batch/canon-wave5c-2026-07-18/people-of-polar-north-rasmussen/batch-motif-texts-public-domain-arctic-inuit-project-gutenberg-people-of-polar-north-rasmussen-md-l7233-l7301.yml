canonical_text:
  quote: ''
  summary: The supplied passage contains two short tales. In the first, an abandoned
    pregnant widow catches ravens, makes raven-skin coats for herself and her son,
    magically matures her son and puppies, survives an arrow attack by using the thong
    of a baby-carrying bag, and her son kills the attackers. In the second, Isigkarssuaq
    refuses marriage, is hanged in a pit by her family, dies, becomes a hill spirit
    whose organs become bodily features and objects, and frightens her parents to
    death.
  language: English
  quote_policy: summarized
