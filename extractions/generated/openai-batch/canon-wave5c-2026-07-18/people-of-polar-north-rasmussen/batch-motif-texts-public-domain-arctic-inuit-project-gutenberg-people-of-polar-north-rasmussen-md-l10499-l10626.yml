canonical_text:
  quote: ''
  summary: The passage begins with a West Greenland young girl's first-person memory
    of steering a boat through a dark, dangerous current. It then describes a journey
    by kayak to visit Ojuvainath, a skilled hunter, at his summer camp. The visitors
    pass through calm fjord waters, see wildlife, and recognize smoke from the camp
    as a sign of welcome. Ojuvainath is described as strong, capable, commanding,
    and devoted to his wife and children. He tells how earlier deaths in his family
    left him in grief, and how he recovered happiness by seeking a new wife and new
    thoughts.
  language: English
