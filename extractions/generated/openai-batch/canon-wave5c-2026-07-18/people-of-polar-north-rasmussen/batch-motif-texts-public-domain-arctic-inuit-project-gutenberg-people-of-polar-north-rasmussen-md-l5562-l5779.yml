canonical_text:
  quote: ''
  summary: 'The passage records several charm formulae and their uses: a spell first
    used by a magic dog to cross from mainland to island while dragging a weighted
    seal-skin; a related speed formula for ship, kayak, and sledge; hunting charms
    for invisible animals, failed fishery, walrus hunting, and seal stalking; taboos
    and purifying formulae after death, childbirth, miscarriage, or bereavement; invocations
    of Nerrivik, ancestral grandmothers, the sea, and protective boundary spaces;
    and general instructions that charms are spoken softly and repeated.'
  language: English with Inuit-language formulae/transliterations
  quote_policy: summarized
