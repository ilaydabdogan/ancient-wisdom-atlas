canonical_text:
  quote: ''
  summary: After Qivioq marries into a family and goes seal-catching, Eqaitdloq kills
    and flays her daughter out of envy, then wears the daughter’s skin. When Qivioq
    returns and asks for the daughter, Eqaitdloq says she has gone to pick berries,
    while the body is hidden under the sleeping-place. Qivioq leaves, crosses a large
    sea, returns home, and finds his wife married to another man because of his long
    absence; he sleeps alone.
