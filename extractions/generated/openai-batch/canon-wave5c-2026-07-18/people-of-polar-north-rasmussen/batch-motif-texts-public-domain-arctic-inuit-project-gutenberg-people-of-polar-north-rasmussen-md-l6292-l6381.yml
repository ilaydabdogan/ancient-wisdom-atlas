canonical_text:
  quote: ''
  summary: 'The passage contains animal fables about lice: a worm and a louse race
    to a sleeping man, explaining why humans have lice; a childbirth-related prohibition
    against naming or complaining about lice is explained by a louse that becomes
    monstrous and kills a new mother; and a dialogue between two lice presents human
    skin, nails, and clothing from a louse’s perspective, ending with a note that
    Avuvang learned animal lives through soul migration as a louse.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fable states that earlier people had no lice, and that a man lying
    asleep on the ground was seen by a worm and a louse.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The worm challenges the louse to see which can reach the man first; both run,
    the worm falls down, and the louse arrives first.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The worm says that man does not taste good and that earth is the only food,
    while the louse continues to the man and finds both food and home there.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The fable gives an etiological ending: since the louse reached the man, men
    have had lice.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The next account states that forefathers had forbidden women who had just
    given birth to mention lice by name or complain about their irritation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A woman who had just become a mother is tormented by lice on her shoulder
    and remarks that tiny toothless animals can bite hard.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: After the woman looks toward her shoulder, she sees a frightful mouth with
    great teeth; the louse is said to have become angry and assumed the shape of a
    monster.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The woman dies from fright, and the childbirth-related prohibition against
    mentioning lice is reaffirmed.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The passage states that this happened in the days of the forefathers, when
    a thoughtless tongue could fashion monsters that caused misfortunes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the following legend, two lice, husband and wife, live in a reindeer skin;
    the hairs of the skin are described as the posts on which the husband’s mittens
    hang.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The husband louse wants to go out for food, while the wife louse asks him
    to stay because people may kill him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The husband louse says he chiefly fears two icebergs falling on him; the passage
    explains that he calls a man’s nails icebergs.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The husband louse says that if he is eaten he will come back, only reddened
    by passing through the man’s stomach; after leaving to find an armhole, he later
    returns red all over.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The closing note identifies this experience as what happened to Avuvang during
    soul migrations when he became a louse, and says that from him people know the
    lives of all animals.
  category: relationship
  evidence_refs:
  - ev:8
