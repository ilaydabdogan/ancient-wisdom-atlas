canonical_text:
  quote: ''
  summary: A September 9 diary passage describes a southwest storm that nearly overturns
    tents and drives umiaqs toward the water, forcing the camp to move shelters and
    boats. In the morning, the camp stays home, drinks coffee, and David jokes that
    his mother-in-law rules his household and manages what he hunts. Looking at the
    stormy sea, David recalls youth and tells of his comrade Ov£/Ov6, his constant
    hunting companion, who once survived being engulfed and expelled by a wave while
    towing walrus in a heavy sea.
  language: English
  quote_policy: summarized
