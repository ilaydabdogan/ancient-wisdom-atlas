canonical_text:
  quote: ''
  summary: 'Merqusaq recounts a migration led by Qitdlarssuaq. After hearing of Inuit
    across the sea, Qitdlarssuaq performs spirit-conjurations and soul-journeys through
    the air to find their country. Ten sledges with thirty-eight people travel north
    with belongings, dogs, kayaks, and hunting equipment, wintering along the route
    and living from sea mammals and birds. After two winters, old Oqe becomes homesick,
    accuses Qitdlarssuaq of deception, and the group splits: five sledges turn back
    and five continue.'
  language: English
  quote_policy: summarized
