  quote: ''
  summary: The passage describes North Greenlandic winter darkness and evening storytelling,
    then recounts a sledge journey in which Moses, a neglected orphaned youth, tells
    the narrator about a monster or giant magician in a cave, hill-spirit caves among
    loose stones, and a great white spirit-like man who swims up a lake and vanishes
    into the ground after being noticed by berry-pickers.
  language: English
  quote_policy: summarized
