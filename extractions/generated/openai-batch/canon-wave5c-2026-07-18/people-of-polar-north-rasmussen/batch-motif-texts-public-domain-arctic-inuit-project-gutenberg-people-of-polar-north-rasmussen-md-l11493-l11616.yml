  text: During the North Greenlandic winter, daylight is brief, lamps are needed for
    work even at noon, and hunters rely on moonlight and northern lights when traveling.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says subdued moonlight, high cliffs, shadows, silence, and loneliness
