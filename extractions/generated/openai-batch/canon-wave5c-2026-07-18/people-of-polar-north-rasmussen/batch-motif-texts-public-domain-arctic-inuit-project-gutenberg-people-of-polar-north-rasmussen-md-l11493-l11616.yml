  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Families gather in the evenings after the men return with their catch; after
    eating, women work on leather embroidery, men rest, and stories are told.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator lets Moses come on a sledge trip on condition that Moses show
    a good road in a new direction.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Moses is described as dirty, badly dressed, parentless, treated as superfluous
    by others in his house, and later found to be seventeen years old though he seemed
    about ten.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sledge route crosses Autdlariarfik Lake in freezing weather, among fog-veiled
