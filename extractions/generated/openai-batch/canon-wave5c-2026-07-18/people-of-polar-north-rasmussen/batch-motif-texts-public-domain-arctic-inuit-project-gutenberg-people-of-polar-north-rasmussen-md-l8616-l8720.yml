canonical_text:
  quote: ''
  summary: The passage ends one fragment in which unnamed people escape an inland-dweller
    by rolling away and returning home. The main tale tells of Suagak, a coastal woman
    carried off by an inland-dweller to the interior, where she becomes his wife.
    The inland-dweller has hidden food stores, can call or beckon prey, and lives
    in a ground-dug house with his grandmother. Suagak bears a child, later visits
    her coastal kin, and her husband is frightened by dogs but shows his hunting ability.
    The couple eventually returns to the inland-dweller’s home, where he describes
    dogs as dangerous monsters because he had never seen them before.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the opening fragment, an inland-dweller fails to find unnamed people; they
    roll farther away and escape home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Suagak lives on the coast before an inland-dweller comes to her while she
    is walking, carries her off, and takes her to his interior home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The inland-dweller tells Suagak that he has hidden stores of food in the rocks,
    that the two of them will have plenty to eat, and that he will make her his wife.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: On the journey inland, they stop at flesh-pits containing dried bearded seal
    and narwhal, and the inland-dweller is described as able to call prey to himself.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The inland-dweller’s house is a hole dug down into the ground, with no raised
    sleeping-place, and his very old grandmother is inside.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Suagak becomes the inland-dweller’s wife; his fellow-countrymen come to look
    at her, find her different from women they know, and think her beautiful.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Suagak hangs up cooking-pots that the inland-dwellers had kept standing on
    the ground, and the inland-dwellers are pleased and play with the hanging pots.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After Suagak gives birth to a child, she wants to see her own countrymen and
    brothers; when the child can be carried on the back, she and her husband set out.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Near the coastal houses, the inland-dweller refuses to go farther and waits
    in the hills because he is afraid of dogs, telling Suagak to come when she hears
    him call.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Suagak’s coastal community is delighted to see her because they thought she
    had died and had already named a small child after her.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Suagak’s brothers force her reluctant husband home with them; inside the house
    he flees to the sleeping-place in fright until the dogs are taken away and fastened
    up.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The inland-dweller hunts along the tide-line and returns with a whole bearded
    seal on his back.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Suagak’s brothers joke with the child by calling it a little inland-dweller
