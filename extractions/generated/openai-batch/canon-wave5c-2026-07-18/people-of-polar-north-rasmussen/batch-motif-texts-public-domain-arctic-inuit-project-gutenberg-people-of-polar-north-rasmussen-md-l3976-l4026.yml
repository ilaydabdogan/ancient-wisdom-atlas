canonical_text:
  quote: ''
  summary: The passage says the world is large, then introduces ideas about the origin
    and migration of men. It states that the first men are thought to have come from
    somewhere west beyond the sea and migrated eastward. A legend explains other races
    as descended from a girl who married a dog after refusing human husbands. The
    girl's father threatens to give her to his dog; dog dung appears in human form
    and speaks of thawing; the dog assaults and drags the girl outside. The father
    later takes the girl to an island and fastens the dog to a stone-filled sealskin,
    after which the dog uses magic and swims with only its nose above water.
  language: English
