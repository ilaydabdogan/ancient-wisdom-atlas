canonical_text:
  quote: ''
  summary: A figure called Tutuatue, the Midden Spirit, is described as a night-seen
    being covered with filth and living inside a midden. It entices a little girl
    with walrus-tusk toys to its house and kills her by putting a needle through her
    ear while pretending to pick lice. It later entices another girl, but releases
    her after learning that her large boots and coat belong to her parents. Before
    she leaves, it shows her the earlier victim’s body, and her report becomes the
    origin of the story.
  language: English
  quote_policy: summarized
