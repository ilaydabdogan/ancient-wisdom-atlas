  quote: ''
  summary: A grieving sparrow rejects a raven's marriage proposal. The raven then
    proposes to two wild geese and joins their flight despite being warned that he
    cannot rest on the sea. He tires, sleeps on the backs of the two geese, is shaken
    off into the sea, drowns, and afterward his soul becomes little sea ravens, identified
    as black pteropods.
