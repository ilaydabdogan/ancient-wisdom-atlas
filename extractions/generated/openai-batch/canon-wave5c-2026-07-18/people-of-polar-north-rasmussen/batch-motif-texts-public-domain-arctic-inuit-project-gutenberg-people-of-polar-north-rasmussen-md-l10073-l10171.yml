canonical_text:
  quote: ''
  summary: A conversation with Manasseh contrasts mutual aid among Greenlanders with
    hunger and wealth elsewhere. The narrator and Manasseh drink tea, exchange stories,
    sleep in a tent, wake at dawn, eat, and continue by sledge. Their route is blocked
    by open water, then severe cold and poor snow conditions accompany a south-westerly
    attempt. In a reindeer district, the dogs suddenly follow fresh reindeer tracks,
    pulling the sledge into a rapid chase until the herd is seen.
  language: English
