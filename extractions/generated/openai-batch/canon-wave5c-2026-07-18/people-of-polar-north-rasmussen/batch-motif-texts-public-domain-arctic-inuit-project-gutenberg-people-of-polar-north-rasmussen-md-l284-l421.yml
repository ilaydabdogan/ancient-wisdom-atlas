canonical_text:
  quote: ''
  summary: The narrator describes arrival by sledge at Agpat among Polar Eskimos.
    Maisanguaq and two young men announce the visitors as white men, drawing the settlement
    to the shore. The community feeds the dogs, offers meat, hosts the visitors, and
    builds a snow hut because a sick man is with them. A request that Aininaq remove
    the narrator's outer boots, made from a West Greenland custom, is later understood
    as a marriage proposal. The passage closes with bear-hunters returning with skins
    and meat.
  language: English
  quote_policy: summarized
