canonical_text:
  quote: ''
  summary: A story tells how Angusinaunguaq, envied for his beautiful wife, is abandoned
    on an island by other men who tow away his kayak. He returns before them by magical
    air travel, later avenges mainland kayak-men killed by hostile islanders who use
    fog, and delights the widows of the dead men.
  language: English
  quote_policy: summarized
