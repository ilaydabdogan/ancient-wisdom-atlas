literal_observations:
- id: obs:1
  text: Girls are described as generally marrying at about sixteen; the passage says
    there are more men than women among the Polar Eskimos, so a young seal-catcher
    must hurry to secure a wife.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wife is described as preparing animal skins, making and caring for clothes,
    bearing children, and contributing to the husband's future security.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women are described as indispensable to maintaining the social fabric and
    as knowing and taking pride in this.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Marriage may oblige a man to support a woman's aged parents or, if he marries
    a widow, to feed and clothe her children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says women have their own ways of getting what they want, and
    that someone seeking a man's action should first win over his wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Domestic life is described as cheerful, with talking and laughter heard from
    within huts.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage mentions men striking women and women sometimes receiving a black
    eye.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In sexual matters, the woman is described as having no voice; the passage
    says custom permits a man to lend her away for a night or longer without considering
    her wishes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Men are said to arrange wife exchanges on hunting expeditions without telling
    the women; a woman understands the exchange when another man lies on her couch
    and her husband goes to another house.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that women are not exchanged out of the house for a night;
    instead, the men change couches.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: If a man wants a woman on a long hunting expedition and his own wife is pregnant
    or unable to endure sledge travel, he may lend her to a man who remains and receive
    that man's wife in return.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: If a young wife is homesick, her husband may allow a travelling man to take
    her on a visit while leaving his own wife as hostage.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: When a marriage is described as disturbed, the man may exchange his wife for
    an indefinite period; the passage reports that the couple is soon said to want
    reunion.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Children born during an exchange remain with the mother until they no longer
    require her care.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: The passage says a woman rarely refuses exchange with tears, and that the
    husband then beats her as punishment.
  category: sequence
  evidence_refs:
  - ev:12
