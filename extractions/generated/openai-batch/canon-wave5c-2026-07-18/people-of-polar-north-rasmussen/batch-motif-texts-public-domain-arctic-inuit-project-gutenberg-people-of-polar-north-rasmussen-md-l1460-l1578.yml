canonical_text:
  quote: ''
  summary: An ethnographic narrative describes a springtime gathering in Sorqaq's
    tent, where Majaq and Ilanguaq perform a wordless duet with bodily movements,
    drum accompaniment, response singing, and a chorus. Sorqaq then hosts the guests
    with frozen rotten walrus-flesh. He is described as an old and renowned bear-hunter
    who rejects talk about bear-hunting, invokes scars from bears as a sign of real
    experience, and is known for breeding fast black hunting dogs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In late spring during a storm, the narrator hears shouting, laughter, and
    a monotonous song from a neighboring tent.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Little boys bring an invitation to Sorqaq's tent, where people lie on a bear-skin
    rug covering the sleeping-place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Majaq and Ilanguaq sing a wordless duet with bent knees, forward-tilted bodies,
    head-swinging, trunk contortions, and genuflections.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A little bladder drum accompanies the singing, and an opposite party stands
    facing the singer, sings without movements, and uses a stick at the singer's face
    to end a tune with shrieks.
  category: action
  evidence_refs:
  - ev:2
  - ev:8
- id: obs:5
  text: The passage says the melodies range over five or six notes; each singer has
    his own composed tunes, and songs for amusement have no words, unlike drum singing
    associated with spirit incantations, where a text is improvised.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: After about an hour, Majaq's tempo quickens, his torso movements become more
    pronounced, buzzing sounds come from his lips, his closed eyes tremble, and he
    perspires heavily.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The gathered people stop chattering, women join with high voices, and the
    chorus increases in voices and volume.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sorqaq offers his guests frozen rotten walrus-flesh, described as a valued
    delicacy, and chops up a side of walrus for distribution.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:9
  text: The meal proceeds in silence until hunger is satisfied, with the proverb-like
    statement that conversation and food belong separately.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:10
  text: Sorqaq says one must not sit indoors and talk about bear-hunting; if thoughts
    turn to bears, one should drive out and kill some.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:11
  text: When asked to show his back, Sorqaq replies that a boy's back will not look
    like a rugged ice-covered mountain because no bear will make a scar on him.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:12
  text: Sorqaq is described as a lover and skilled breeder of dogs, especially black
    animals, and as having produced an excellent hunting strain.
  category: attribute
  evidence_refs:
  - ev:13
