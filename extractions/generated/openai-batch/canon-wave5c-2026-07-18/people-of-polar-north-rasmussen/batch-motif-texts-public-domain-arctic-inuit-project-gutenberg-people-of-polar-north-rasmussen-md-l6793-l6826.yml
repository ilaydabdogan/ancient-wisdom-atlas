canonical_text:
  quote: "“received life and became a man”"
  summary: A fissure in an ice-hill produces a living man named Nut£ or Nute, who
    has a cracked face, lives in darkness, and keeps his mittens on. He marries a
    daughter in a household and is a skilled seal-hunter. After his mother-in-law
    teases him with lies, he says he is not a man and returns to the dark and to his
    glacier. The mother-in-law becomes a fox, and the daughter later bears a son who
    grows into a mighty hunter.
  language: English
