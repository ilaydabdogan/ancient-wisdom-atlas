canonical_text:
  quote: ''
  summary: On a late-summer evening, children shout a warning about mastless boats
    and run to hide. An elder explains that the game recalls old fears of qavdlunatsait
    or nakasungnaitsut, warlike white men said to arrive in mastless boats and sometimes
    be mistaken for dark icebergs. He recounts a tradition in which such men descend
    from the children of a girl who married a dog and were sent away in a boat made
    from a boot sole. He also tells of local people attacking a frozen ship, finding
    a hidden white boy in a box, fostering him, and later losing him when he disappears,
    leaving only a seal-bladder shirt; the old people suppose he flew back to the
    white men’s land.
  language: English
  quote_policy: summarized
