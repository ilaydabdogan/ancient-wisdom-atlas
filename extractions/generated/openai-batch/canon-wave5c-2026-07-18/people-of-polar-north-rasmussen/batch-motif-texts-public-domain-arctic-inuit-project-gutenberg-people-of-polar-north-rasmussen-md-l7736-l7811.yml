canonical_text:
  quote: ''
  summary: A woman fleeing a violent husband with her child enters a house where an
    old woman tends a lamp while her sons are away hunting. The old woman pursues
    her; the woman casts away the child, and the old woman strikes at the baby's throat
    with an axe. The woman returns to her husband, tells him what happened, and leads
    him to the house. He kills the old woman and then kills several of her returning
    sons, while three escape. The couple takes reindeer meat and returns home.
  language: English
  quote_policy: summarized
