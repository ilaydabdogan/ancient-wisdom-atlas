canonical_text:
  quote: ''
  summary: The passage describes Polar Eskimo conjuration practices, including qilaneq
    and Nivigkana's trance healing of a dog whose soul was said to have been stolen.
    It explains Angakut, dangerous ilisitsoq magicians, tupilak creatures made by
    magicians, Tateraq's killing of a seal-like tupilak and subsequent paralysis,
    accusations of soul-stealing, communal belief in magician powers, and the narrator's
    comparison of Polar Eskimo magic arts with more highly developed East coast practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Qilaneq is described as a mode of conjuration in which a medium lies still
    with closed eyes; another form uses a thong tied round one leg, pulled with cries
    until the leg becomes too heavy to lift, signaling that a spirit is present.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nivigkana entered a trance for an ill dog, saw a spirit pulling at the dog
    and stealing its soul, demanded the soul back, and the dog recovered.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that both men and women can become Angakut, while women
    are described by the Eskimos as rarely dangerous in that role.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A dangerous Angakoq who can call down misfortune is called an ilisitsoq and
    can kill a victim without showing himself by means of a tupilak.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A tupilak is described as an animal made by a magician, usually a seal, which
    appears to a person against whom the magician bears a grudge.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The tupilak can capsize a kayak or allow itself to be harpooned and killed;
    a person who kills such a seal loses bodily strength and becomes crippled.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tateraq encountered a seal surfacing in front of the kayaks while hunters
    were towing a walrus, became intensely excited, rowed forward, harpooned it, and
    killed it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After Tateraq's seal was cut up, its chest was found to resemble a human being's,
    and the rest of the bones were said to come from different animals.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: After killing the seal, Tateraq fell ill and later lay paralysed and helpless
    on a sledge among the houses.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Old Qilerneq was thought to have made the tupilak by assembling bones of various
    animals, covering them with turf and clots of blood, and singing a special magic
    song to bring the object to life.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Some magicians are described as soul-stealers; people affected by them fall
    ill and die, and Kajorapaluk had been murdered because he was accused of stealing
    souls.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states that most Polar Eskimos believe in magicians' capacity
    to use supernatural forces, and that even some sceptics adhere to the mysteries
    at crucial moments.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: The narrator states that Polar Eskimo magic arts are becoming simplified and
    less developed than those on the East coast, partly because the Polar Eskimos
    are described as having abundant food and less need for constant appeals to supernatural
    powers.
  category: other
  evidence_refs:
  - ev:12
