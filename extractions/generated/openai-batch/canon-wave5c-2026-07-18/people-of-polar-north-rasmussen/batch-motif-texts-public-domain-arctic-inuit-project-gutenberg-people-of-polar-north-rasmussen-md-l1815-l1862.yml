  quote: ''
  summary: The narrator reaches Sorqaq's camp beneath a mountain ridge called “The
    Curved Knife.” The camp reacts noisily to the arrival. Sorqaq greets the party,
    explains that he and Qilerneq have caught a seal, and says Alingnaluk has a pot
    over the fire. Sorqaq and Qilerneq exchange joking remarks about age, hunting
    skill, black and white hair, and the method by which Sorqaq killed the seal.
