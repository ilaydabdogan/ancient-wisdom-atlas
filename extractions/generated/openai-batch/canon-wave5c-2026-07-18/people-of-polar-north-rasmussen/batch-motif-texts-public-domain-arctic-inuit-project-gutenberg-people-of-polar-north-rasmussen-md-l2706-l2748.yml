canonical_text:
  quote: ''
  summary: The passage describes Eqariussaq, a barren woman, leaving Alattaq and repeatedly
    returning to her husband Samik, who refuses her appeals. During a village visit
    marked by meat-sharing and drum-songs, the narrator finds Eqariussaq crying in
    the snow. The next day people report that Samik threw an axe at her, breaking
    a bone in her foot. She suffers for weeks, and the narrator expects she will return
    to him again once she can walk.
