canonical_text:
  quote: ''
  summary: Atungait chooses a strong woman as travelling companion, journeys by sledge
    through strange places, climbs a cliff by superhuman strength, encounters left-handed
    people, cannibals, and lame Ajangait players, steals a copper game object, escapes
    enchanted stones, flies home as a magician, kills his wife for lying about a caress
    with another man, spares the truthful man, and returns to make the strong woman
    his wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Atungait wants to travel by sledge with a strong woman and has a thick bearded-seal
    skin prepared without scraping the fleshy side.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Atungait visits a football-playing tribe, identifies a small woman who repeatedly
    takes the ball from others, and gives her the thick skin to rub soft; she succeeds
    where others had not.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Atungait takes the strong woman on his sledge and drives to other countries.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a steep high cliff surrounded by open water, Atungait climbs the rock with
    steps that sink into it, calls his dogs up after him, loses one dog, and hoists
    up the sledge and the woman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Atungait and the woman encounter people who are all left-handed, then cannibals,
    and then people born with dislocated hips who play Ajangait with a beautiful copper
    game object.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before leaving the lame Ajangait players, Atungait steals their copper game
    object and destroys all their sledges.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The lame people enchant stones to pursue Atungait across the ice; Atungait
    uses bits of sole leather tied to a cord dragged behind the sledge, causing the
    stones to stop and sink through the ice.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When Atungait becomes homesick and does not know where he is, he tells the
    strong woman to wait and flies through the air; the passage states that he is
    a great magician.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Atungait finds his house and sees his wife rubbing noses with a strange man
    as a caress.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Atungait kills his wife after she denies kissing anyone, but lets the strange
    man live after he admits the kissing.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Afterward Atungait returns to the strong woman and makes her his wife.
  category: action
  evidence_refs:
  - ev:9
