canonical_text:
  quote: ''
  summary: A man owns an enormous dog that swims in the sea, hauls whales and narwhals,
    can be steered by thongs through its jaws, and carries the man and his wife. Because
    the man has no son, he gives the dog a wooden amulet meant for the child. The
    dog eats a person, threatens a kayak stranger, defeats three bear-sized dogs sent
    to kill it, and later attacks inland-dwellers. The passage explains inland-dwellers'
    fear of dogs by saying this giant dog appeared at their windows and dragged them
    out, while also noting that inland-dwellers carried off solitary people, especially
    women lost in fog.
  language: English
  quote_policy: summarized
