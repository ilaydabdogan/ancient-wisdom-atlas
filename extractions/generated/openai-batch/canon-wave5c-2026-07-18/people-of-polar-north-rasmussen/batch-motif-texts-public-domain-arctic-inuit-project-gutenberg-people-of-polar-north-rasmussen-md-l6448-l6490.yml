canonical_text:
  quote: ''
  summary: A man comes to a cave where owl, raven, gull, hawk, and arctic skua live
    in human shape. The inhabitants try to host him by bringing or offering food.
    The man rejects some offerings and eats others. The owl tries to catch two hares
    at once; when they run in different directions, he tries to go both ways, is torn
    in two, dies, and fails to bring food for the man.
  language: English
  quote_policy: summarized
