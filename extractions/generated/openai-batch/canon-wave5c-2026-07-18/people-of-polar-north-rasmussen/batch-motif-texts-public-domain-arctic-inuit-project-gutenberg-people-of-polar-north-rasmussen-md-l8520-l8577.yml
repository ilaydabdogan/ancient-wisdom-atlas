  summary: A fragment concludes with a boy escaping enemies when snow from cliffs
    freezes his pursuers. A second tale says that reindeer-hunters in Akilineq often
    vanished; one searcher encounters and wounds a strange man, while another hunter
    observes unusually large strangers who use a sound-making instrument and sit on
