canonical_text:
  quote: ''
  summary: Speakers recount old Evale and his wife hearing beautiful music from beneath
    a stone, learning a song, seeing a wonderful mist-borne country, and later forgetting
    the song. Another account tells of their discovery of a black polished stone covered
    with unreadable signs, which is later found shattered before it can be copied.
    Speakers interpret the loss of such valuable things as protective concealment,
    since wealth could draw destructive outsiders. The passage then shifts to night
    at the fjord and to a description of poor dwellings and hospitality at Ikamiut.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old Evale and his wife went inland to the reindeer country every summer and
    stayed high up the fjord, eventually alone after their children had died.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: While the couple were lying asleep under a large stone, Evale heard an unfamiliar
    sound from beneath it that grew into beautiful music; his wife also heard it when
    awakened.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A single singing voice became distinguishable from the music, accompanied
    by instruments, and repeated words until Evale learned the song.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Evale and his wife described the song being taught to them as a gift.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wife pointed out a wonderful and luxuriant country that seemed to float
    in mist through the air; when the couple tried to approach it, it vanished behind
    hills and the singing ended.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Evale sang the song again for his wife, but after they slept both forgot it
    by morning, remembering only that it was very beautiful.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: On another reindeer hunt, Evale and his wife discovered a large black, highly
    polished stone with one smooth side covered in signs they could not understand.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: When they returned the following year intending to draw the signs, the stone
    had been broken into tiny pieces and no letter or sign could be found.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Evale thought that beings lived inside the stone and meant good to the Greenlanders.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Speakers said valuable things are kept hidden because their discovery could
    bring foreigners and harm to Greenlanders, as had happened to other peoples with
    rich lands.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The sun set, a cold wind came over the fjord, and Ojuvainath spoke about the
    reindeer hunts as the group went inside his tent.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: Ikamiut is described as a very poor settlement with tiny turf-and-granite
    houses, low interiors, granite floors, and a soap-stone lamp as the only source
    of light and warmth in one house.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: The narrator stayed with Vittoralak; although the family was very poor, they
    gave the visitor their best food, and the eldest daughter cried with embarrassment
    at the unexpected arrival.
  category: action
  evidence_refs:
  - ev:11
