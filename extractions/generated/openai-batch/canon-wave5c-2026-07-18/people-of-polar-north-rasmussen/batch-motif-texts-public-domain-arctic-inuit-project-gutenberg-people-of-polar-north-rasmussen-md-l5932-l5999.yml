canonical_text:
  quote: ''
  summary: The passage compares East Greenlandic and Polar Eskimo Angakoq practices.
    It describes East Greenlandic seances, an arduous initiation in which a candidate
    is swallowed, chewed, and spat out by a bear-like monster, magical soul-flight
    to heaven or the sea bottom, ritual darkness and percussion, skull-song disputes,
    and present Polar Eskimo conjurations involving helping spirits, improvised spirit-songs,
    bodily trembling, apparent struggle with invisible powers, prophecy, drumming,
    and ecstasy.
  language: English
  quote_policy: summarized
