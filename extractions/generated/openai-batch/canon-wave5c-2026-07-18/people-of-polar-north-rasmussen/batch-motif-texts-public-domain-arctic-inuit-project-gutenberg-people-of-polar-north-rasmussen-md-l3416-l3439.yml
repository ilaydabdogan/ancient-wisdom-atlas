  summary: In a cold cave during a storm, the narrator and Qisunguaq rest in reindeer
    skins. A faint greenish noon light enters the cave. Qisunguaq remembers the dogs,
    and the two men light a blubber torch, cut frozen walrus meat, chew a little themselves,
    and carry mostly blubber out to the hungry animals, which have fasted for more
    than thirty-six hours.
