canonical_text:
  quote: ''
  summary: 'The passage closes a note about an unnamed murderer being restrained or
    tamed, then shifts to the narrator’s travels and conversations with Christian.
    Christian is described as a baptized convert who had formerly been a magician
    on the East coast and who recounts his training: after his father’s death he wandered
    among hills, heard unseen singing on two occasions, saw two inland-dwellers who
    said they had come to help him because he was an orphan, and regarded them as
    his first helping-spirits. He then began to be a magician in secret and later
    moved south, where he lived near an old venerated magician whom he helped with
    his kayak.'
  language: English
  quote_policy: summarized
