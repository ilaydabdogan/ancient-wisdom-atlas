canonical_text:
  quote: ''
  summary: The narrator describes living near her husband's brothers, including Christian,
    also called AutdarutS, who is described as a magician and dangerous man. Christian
    takes Sakua, a survivor of a house burning, as a second wife, alternately favors
    and repudiates her, reproaches her for not bearing children, then after a quarrel
    pursues and kills her with a gun and an arrow. He dismembers her, throws her head
    into the sea, eats her heart, leaves her body near the beach, and the narrator
    later sees the body lying in the snow before the group leaves the place.
  language: English
  quote_policy: summarized
