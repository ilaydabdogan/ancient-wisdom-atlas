canonical_text:
  quote: ''
  summary: The passage describes Sagdloq, a feared magician said to inherit ancestral
    wisdom and to be able to leave and re-enter his skin. Though ill, he performs
    a spirit-conjuring ceremony with drum, spirit song, audience silence, and supporting
    singers. During the rite he appears to struggle, speaks in a special spirit language,
    names an Evil Fate or misfortune-bringing spirit associated with the white men,
    and explains that it touched Harald Moltke's sledge and caused illness.
  language: English with quoted Greenlandic/Inuit phrases
  quote_policy: summarized
