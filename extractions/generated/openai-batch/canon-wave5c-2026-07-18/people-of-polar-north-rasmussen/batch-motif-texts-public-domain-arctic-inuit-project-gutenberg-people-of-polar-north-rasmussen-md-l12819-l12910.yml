canonical_text:
  quote: they took him out and brought him to the country and the house of revenants
  summary: A boy named Qalanganguase is repeatedly left alone and encounters spirits
    in the house. A first spirit drinks from a water bucket, after which the bucket
    is found half full of lice. Later, many spirits, including his dead sister, enter,
    play, and warn him not to tell tales if he wants bodily strength. He tells the
    villagers and loses the returning strength. After being left behind again, his
    dead parents come, invite him to journey with them, and take him to the country
    and house of revenants, where he becomes a revenant and is not found again by
    the villagers.
  language: English
  quote_policy: quoted
