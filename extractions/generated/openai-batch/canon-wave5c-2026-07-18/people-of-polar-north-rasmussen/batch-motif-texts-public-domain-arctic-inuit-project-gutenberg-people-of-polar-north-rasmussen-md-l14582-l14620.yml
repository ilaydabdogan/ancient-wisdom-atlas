canonical_text:
  quote: ''
  summary: At Iterdlagssuaq, a line or rope is suspended between two very high peaks
    above a large lake. White men bring a husband to the rope, demonstrate crossing
    it, and the husband attempts the crossing after throwing an axe into the lake
    because he fears they may cut the rope. When he reaches the middle, the white
    men swing the rope until he loses his hold and falls into the lake. The passage
    states that they killed him, then married his wife, and gives this woman and the
    white men's stay as explanations for East-coast mixed descendants and a dialect
    at Anorit6q.
  language: English
  quote_policy: summarized
