canonical_text:
  quote: ''
  summary: A pregnant woman’s husband is killed. After giving birth to a son, she
    places him in water, declares him a bearded seal, immerses him in the sea, and
    directs him to destroy his enemies. The son learns to dive and swim, then becomes
    a bearded seal before the enemy kayakers and lures them into open water where
    a storm rises. Qivioq escapes with a companion while his black guillemot amulet
    shrieks. After reaching land he marries, travels along the coast, leaves people
    who mishandle his hunting-buoy, and later settles with Eqaitdloq’s daughter; Eqaitdloq
    has a wooden husband who hunts whales.
  language: English
  quote_policy: summarized
