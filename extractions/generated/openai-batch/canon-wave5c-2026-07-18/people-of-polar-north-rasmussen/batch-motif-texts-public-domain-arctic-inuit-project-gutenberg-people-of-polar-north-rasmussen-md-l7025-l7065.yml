canonical_text:
  quote: ''
  summary: A woman who has miscarried runs away and stays with bears in human shape.
    A bear warns her not to speak of them to humans. She returns home and reveals
    that she has seen bears. People drive sledges toward the bear's house; the bear
    kills his young to prevent their capture, then kills the woman. Dogs surround
    and attack him, and the bear and dogs become luminous, rise into the sky as stars,
    and are identified as Qilugtussat. The passage concludes that people have since
    been cautious about bears because bears hear what people say.
