canonical_text:
  quote: ''
  summary: 'A tale explains fog: a man has himself buried alive to catch a hill spirit
    that steals corpses from graves. After being carried to the spirit''s house, the
    man kills the spirit and children, flees from the pursuing wife, raises mounds
    and overflows a stream to delay her, and finally tricks her so that she bursts;
    steam from her becomes fog among the hills.'
  language: English
  quote_policy: summarized
