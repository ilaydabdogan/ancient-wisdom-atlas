canonical_text:
  quote: ''
  summary: The passage contains the tale of a long-tailed duck and a ptarmigan who
    insult one another until the duck drags the ptarmigan into the sea; the duck dies,
    while the ptarmigan emerges with a fish and thereafter avoids looking over the
    sea. It then begins a second tale about a drowsy bachelor who is rejected by unmarried
    girls, rescues a capsized noseless fire person, follows him to his country, receives
    a hunting-related instruction and secrecy warning, returns with new hunting success,
    and becomes sought after by the girls.
  language: English
  quote_policy: summarized
