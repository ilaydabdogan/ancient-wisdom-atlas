canonical_text:
  quote: ''
  summary: Children playing in a rock cleft frighten animals away from the floes.
    An angry old man commands the hill to close over them, and the rock shuts like
    a mouth. People outside try unsuccessfully to feed the trapped children with meat
    and blood. A woman inside reports that a child on her back is sucking her neck.
    The old man admits his anger and promises to open the rock by magic song, but
    after an old woman pricks his conscience he refuses, and the children starve inside.
