canonical_text:
  quote: ''
  summary: 'A girl and a dog live on an island. Her father brings her food. She gives
    birth to ten children in paired kinds: dogs, dogs with men''s heads, Eskimos,
    white men, and warlike white men. She sends the white men to sea in the sole of
    a boot, and they become ancestors in the white men''s country. Angry at her father
    for making her take his dog as husband, she has her children tear him apart. The
    narrator cites a grave containing human and dog bones on the island as confirmation
    of the story.'
  language: English
  quote_policy: summarized
