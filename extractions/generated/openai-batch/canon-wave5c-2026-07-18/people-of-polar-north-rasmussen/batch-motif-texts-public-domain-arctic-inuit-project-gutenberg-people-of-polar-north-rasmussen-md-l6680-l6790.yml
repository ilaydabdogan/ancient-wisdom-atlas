canonical_text:
  quote: ''
  summary: A blind man is deceived by his mother, secretly helped by his sister, and
    has his sight restored by a speaking loon through repeated dives. He later avenges
    himself by harpooning a white whale that drags his mother into the sea, where
    she becomes the first narwhal. Traveling with his sister, he encounters long-clawed
    people who eat her; he kills them, gathers her bones, and as a magician restores
    her to life. The brother and sister later marry among another people and grow
    old.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who could not see is left with his mother and little sister when villagers
    go seal-catching.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother guides the blind man's shot at a bear, tells him he hit the window-sill,
    keeps the bear for herself, and gives him only shellfish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The little sister secretly gives lumps of bear meat to her brother under her
    fur-collar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In summer the sister leads the blind man to a lake, where a speaking loon
    tells him to hold its neck and carries him through repeated dives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the loon asks whether he can see, the man says he sees land and wide
    countries, and then has his sight again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the man returns home, he sees a bear-skin, and his mother falsely attributes
    it to Persoqaq.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The mother eagerly asks to be bound to the harpoon line when white whales
    are sighted, and the man catches a small white whale.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The next day the man decides to kill his mother in revenge, harpoons a large
    white whale, and the whale drags her into the sea while she calls for her curved
    knife to cut the line.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The mother does not return; she is changed into a narwhal, plaits her hair
    into tusks, and narwhals are said to descend from her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before the mother's transformation, the passage says there were only white
    whales.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The man grieves that he killed his mother and travels away with his sister.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The travelers encounter people with long claws who have no knives and use
    their claws to flay and cut up animals.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The long-clawed people admit the brother and sister, tear the sister to pieces,
