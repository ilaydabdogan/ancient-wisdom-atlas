canonical_text:
  quote: ''
  summary: The passage begins with a camp meal of walrus-beef and David's account
    of sea hunting, seasonal travel, and a youthful hunting companion. It then reports
    unusual tracks near Kingigtoq, fear of a ferocious animal called Qapiarfik or
    Kilivfak, plans for a hunt, and an evening storytelling scene in which Malanga
    begins the story of the One-eyed Giant of Kingigtoq. In that story, during a famine
    at Igdluerungneq, a little orphan boy hunts for everyone, reaches Kingigtoq near
    dark, sees an unexpected house, and enters through its passage.
