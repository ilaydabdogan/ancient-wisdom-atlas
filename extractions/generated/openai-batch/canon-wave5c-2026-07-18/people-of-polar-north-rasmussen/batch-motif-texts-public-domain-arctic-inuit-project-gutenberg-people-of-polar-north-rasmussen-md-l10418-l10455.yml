canonical_text:
  quote: ''
  summary: During a revival, Frederik Bertelsen remonstrates with his brother Joseph
    and villagers, but is ignored. Later, reports of Habakkuk's improper partiality
    toward young women cause people to fall away. Justus challenges Habakkuk's authority
    over a white whale catch, after which Habakkuk and Mary Magdalene lose their special
    status. Their dictated Bible and revelations are later lost when the manuscript
    is burned to cook a banquet for a first seal catch. The story is attributed to
    Old Sidse.
  language: English
  quote_policy: summarized
