canonical_text:
  quote: ''
  summary: The passage first reports Qitsuala killing the little girl Katiarajik.
    It then shifts to a night walk with Henrik, who identifies the northern lights
    as the dead playing ball and narrates the killing of Aviaja and the subsequent
    death of Aviaja's family during famine. Henrik says Aviaja was accused by a magician's
    helping spirits of stealing children's souls, murdered, dismembered, and ritually
    prevented from vengeance by removal of his eyes. Aviaja's widow later kills or
    directs her children into the sea and then drowns herself, explaining to the youngest
    that the dead live in plenty under the sea. The passage closes with Christian's
    appearance and later remarks about a priest's fear of him and the narrator's unease.
  language: English
  quote_policy: summarized
