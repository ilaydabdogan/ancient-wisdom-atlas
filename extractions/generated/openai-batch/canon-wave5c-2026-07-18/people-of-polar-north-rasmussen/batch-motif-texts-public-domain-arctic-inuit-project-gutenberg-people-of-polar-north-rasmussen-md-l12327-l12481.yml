- id: motif:2
  label: orphan vulnerability to murder
  taxonomy_refs: []
  basis: Henrik says he was never really safe on the East coast because he was an
    orphan and that murders were common once they began.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: This is presented as Henrik's personal fear and social memory, not as
    a fully developed tale pattern.
- id: motif:3
  label: soul theft accusation revealed by helping spirits
  taxonomy_refs:
  - forbidden_knowledge
  basis: A magician's helping spirits reveal that Aviaja stole the souls of the magician's
    dead children, leading to his murder.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The available taxonomy label is approximate; the passage concerns spirit-revealed
    hidden guilt rather than a quest for forbidden knowledge.
- id: motif:4
  label: dismemberment and disposal of a murder victim
  taxonomy_refs: []
  basis: Aviaja's body is cut to pieces, his head placed in a kayak bladder and thrown
