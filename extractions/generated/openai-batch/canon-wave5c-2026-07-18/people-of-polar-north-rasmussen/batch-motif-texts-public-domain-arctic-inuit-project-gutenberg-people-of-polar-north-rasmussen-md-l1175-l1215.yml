canonical_text:
  quote: ''
  summary: Qitdlarssuaq leads a northward migration toward a new country. His followers
    regard him as powerful, and some report seeing a white flame above his head at
    night. At a narrow sea channel he conjures spirits; his soul flies over the sea
    while his body lies lifeless, and he announces the place to cross. After crossing
    the frozen sea, the group finds empty human dwellings. Later, when hunting is
    poor and animals are said to be invisible, Qitdlarssuaq divines that his daughter-in-law
    Ivaloq secretly miscarried to avoid penance. He orders his son to confine her
    in a snow-hut without furs, where she may die, so that the innocent will not suffer
    for her fault.
  language: English
  quote_policy: summarized
