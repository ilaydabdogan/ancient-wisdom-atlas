canonical_text:
  quote: ''
  summary: A man arrives by boat and conceals from the settlement that he is the orphan's
    elder brother. After the people try to wall him inside a hut, he uses a magically
    revived lemming to break through and kill two men, revealing that he has come
    to avenge his brother. He then deceives escort boats, abducts two strong women,
    escapes magically prepared obstacles at sea, and returns home. There he beats
    his younger brother to harden him until he becomes very strong, gives the two
    women to him as wives, and the women are later abused, homesick, and bear children.
  language: English
  quote_policy: summarized
