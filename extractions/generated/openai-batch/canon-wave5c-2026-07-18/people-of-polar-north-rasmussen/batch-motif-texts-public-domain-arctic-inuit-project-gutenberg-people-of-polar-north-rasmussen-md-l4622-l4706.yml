canonical_text:
  quote: ''
  summary: The passage describes death and disease as producing fear and leading to
    inherited rules meant to avert danger. It lists rules for childbirth, including
    temporary seclusion, special food, new clothing, washing, clothing restrictions,
    and food taboos. It then gives a dying infant’s speech as the explanation for
    maternal avoidance of certain organs, and lists additional miscarriage-related
    taboos affecting a woman, her husband, hunters, animal names, and certain foods
    or formulae.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A disease is said to visit the people and demand victims; death appears among
    them as sudden, final, and inescapable.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people respond to terror and perplexity by drawing up rules of life for
    those who do not wish to die.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Traditional rules are said to apply to children, young people, women in childbirth,
    women who have had a miscarriage, and the husbands of such women.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator states that the Eskimos do not give theories for the customs
    but cling to old traditions described as the experience of their forefathers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A woman about to give birth must move out of the house she inhabits with her
    husband; a small tent is used in summer and a snow-hut in winter, and she may
    return when the birth is over.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the day her child is born, the woman may eat only Seralataq, described
    as meat fried in fat on a flat stone.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: After sleeping one night following confinement, the woman must begin making
    new clothes; her old clothes must be thrown away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After a birth, the woman must wash herself from head to foot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After birth, the woman must not push her hood back from her head outside or
    take off her mittens.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before she has had five children, the woman must not eat young rough seals,
    eggs, entrails, heart, lungs, or liver.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A tiny baby is described as beginning to talk while dying, speaking words
    glossed as heart, kidneys, intestines, and liver, and then dying.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The baby’s speech is explained as a reproach to its mother for having eaten
    heart, kidneys, intestines, and liver; since then mothers have refrained from
    these foods.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: A woman who has had a miscarriage is subject to the ordinary rules for mothers
