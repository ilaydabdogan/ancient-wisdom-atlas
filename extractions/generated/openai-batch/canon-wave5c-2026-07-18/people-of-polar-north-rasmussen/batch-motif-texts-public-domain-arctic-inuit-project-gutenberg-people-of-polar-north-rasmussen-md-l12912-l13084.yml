canonical_text:
  quote: '"I am going to take a soul-flight!"'
  summary: A story of two brothers, Ilimageq and Poulineq. Poulineq, a magician, prepares
    winter provisions, announces a soul-flight, flies away through a window, reaches
    a sharp mountain peak, descends to a distant household, and takes a young woman
    as wife. When he does not return, Ilimageq repeats the pattern, follows his brother's
    aerial trail, finds him, speaks with him, and receives a promised spring visit
    signaled by a circling falcon.
  language: English
  quote_policy: quoted
