canonical_text:
  quote: ''
  summary: Anase and the narrator investigate an unseen sound in the hills, which
    Anase identifies as a hill-man and possibly the Devil. They find a hole or cave,
    approach it cautiously, invoke Christ, throw in a stone, and block the entrance.
    Anase recounts a previous encounter with the Devil in the hills that he resisted
    by singing hymns and Bible verses. Back in the hut, others connect the bad weather
    with the hill-man, and the passage explains that a Greenlander who leaves society
    to live as a hill hermit becomes a Qivitoq and is feared.
  language: English
