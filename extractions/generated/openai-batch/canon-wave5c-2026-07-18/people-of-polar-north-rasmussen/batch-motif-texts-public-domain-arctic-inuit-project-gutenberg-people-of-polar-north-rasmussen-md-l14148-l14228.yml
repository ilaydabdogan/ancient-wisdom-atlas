- id: motif:4
  label: Unnatural long winter and cannibal famine
  taxonomy_refs:
  - seasonal_cycle
  basis: An elder sister of Ingersia is said to have lived through an uninterrupted
    winter lasting two years, during which hunger drove people to eat one another.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The prolonged winter is explicit; the passage does not explain its cause
    or connect it to a wider seasonal myth.
- id: motif:5
  label: Invulnerable magician survives attempted killing
  taxonomy_refs: []
  basis: Uase is described as a very great magician whom attackers could not vanquish
    when they tried to kill him.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage segment ends as the ambush begins, so the full account of
    the failed killing is outside the supplied text.
- id: motif:6
  label: Kinless target lacks avengers
  taxonomy_refs: []
  basis: The plotters consider Uase safe to murder because he has no brothers, relatives,
    or avengers.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is a social-revenge pattern in the narrative rather than a taxonomy-linked
