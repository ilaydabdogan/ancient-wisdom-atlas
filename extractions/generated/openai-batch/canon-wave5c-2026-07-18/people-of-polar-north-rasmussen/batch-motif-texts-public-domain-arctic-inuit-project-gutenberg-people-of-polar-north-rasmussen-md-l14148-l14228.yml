canonical_text:
  quote: ''
  summary: The passage introduces Old Susanne, formerly Qingajaq, and her family background.
    It recounts how Ingersia's sons dissuaded him from baptism with an end-time prophecy
    involving Jesus, baptized and heathen people, and powerful beings. It then shifts
    to memories of Ingersia as a giant, a two-year winter famine, and the beginning
    of the story of Uase, a powerful magician whom three envious men plot to kill
    after using a joking marriage remark as a pretext.
  language: English
  quote_policy: summarized
