candidate_motifs:
- id: motif:1
  label: End-time divine judgment opposed by powerful beings
  taxonomy_refs:
  - divine_judgment
  basis: The sons' speech says Jesus will appear at the end of the world to judge
    baptized and heathen people, after which powerful beings will fight and kill him.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: This is reported as speech within the passage and combines baptismal/Jesus
    language with named nonhuman or distant peoples; no external comparison is required
    to identify the local passage pattern.
- id: motif:2
  label: Contrasting vertical fates after judgment
  taxonomy_refs:
  - ascent
  basis: Baptized people are said to be abandoned in crevasses and at precipice bottoms,
    while heathen people make their way up to heaven.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage gives only a brief reported prophecy; the ascent element is
    explicit, but details of the journey are not elaborated.
- id: motif:3
  label: Sea threshold to a hidden people
  taxonomy_refs: []
  basis: The ingnerssuit are said to live between the sea and the earth, and their
    country is entered by going into the sea at the coast.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage describes access to the ingnerssuit realm but does not present
