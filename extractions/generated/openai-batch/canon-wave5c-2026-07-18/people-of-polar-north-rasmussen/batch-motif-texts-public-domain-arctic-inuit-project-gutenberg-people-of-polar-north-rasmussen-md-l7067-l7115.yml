canonical_text:
  quote: ''
  summary: An old man hunting seals on the ice is repeatedly disturbed by children
    playing in a cleft in the rock. He angrily commands the cleft to close over them,
    trapping them inside. People can only pour a little water down to them, and the
    children die of hunger. The old man is attacked and pursued, then becomes luminous,
    rises to the sky, and is identified as a low western star called Nalagssartoq,
    connected with standing and listening for seals.
