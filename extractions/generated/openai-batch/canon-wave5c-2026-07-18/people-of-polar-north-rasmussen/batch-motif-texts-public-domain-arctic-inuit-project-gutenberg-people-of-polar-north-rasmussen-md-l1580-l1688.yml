canonical_text:
  quote: ''
  summary: During a meal, Old Whalebone/Sorqaq tells how a bear killed his best lead-dog
    in an ice cave and how he entered the hole with a knife, wounded the bear, and
    finally killed it with a lance in revenge. The passage then describes him as a
    powerful hunter, eater, and host. In a later spring scene, he says that men should
    travel when the snow is gone, prepares dogs, sledge, rifle, and spears, gives
    a Polar Eskimo farewell, jokes about traveling without a wife, and departs over
    the ice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the end of a silent meal, the speaker says he will not tell bear stories
    but will tell how he once revenged his dog.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The embedded story is set when darkness and cold increase, the sun has disappeared,
    and new sea ice makes bear hunting favorable for a man with fast dogs.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The hunter follows a bear trail until it vanishes into a hollow wall of ice,
    cuts the traces, and the dogs rush baying into the cave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bear has squeezed into a corner where the dogs cannot reach it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The hunter’s best lead-dog comes out of the cave dragging the rear of its
    body and dies after the bear has hugged it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The hunter declares that the bear who killed his lead-dog must die.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Because a long lance cannot be used inside the hole, the hunter crawls inside
    with a knife in his mouth, hears the bear growling, feels his way toward its warm
    breath, and stabs something soft.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Something heavy falls on the hunter after the knife thrust, and he faints.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the hunter regains consciousness and leaves the cave, the dogs have
    stopped the fleeing bear near the entrance; the bear sits on the ice sneezing,
    with blood from its nose and the hunter’s knife through its snout.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Seeing the wounded bear, the hunter cries out with joy, says he has revenged
    his dog, and drives his lance through the bear’s heart.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The hunter drives home through the cold winter night with his bleeding back
    frozen to his clothes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Old Whalebone is described as the greatest hunter, the largest eater in the
    tribe, a lover of inviting people to meals, and a host who sometimes takes meat
    from others for banquets.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: After finishing the story, he lies face down, speaks to his wife, sleeps after
    a heavy walrus-meat meal, and the guests leave quietly when he snores.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: In spring, Old Bone says a man wastes life by idling indoors, notes that the
    sunny side has no snow, and says this is when men begin their travels.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Old Bone says seals on the ice are slow to flee and urges the narrator to
