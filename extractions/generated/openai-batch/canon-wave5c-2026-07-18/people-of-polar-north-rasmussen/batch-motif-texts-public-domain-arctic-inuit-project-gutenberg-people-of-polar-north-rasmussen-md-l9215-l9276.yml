canonical_text:
  quote: ''
  summary: The passage describes a Greenlandic dance gathering at Tasiussaq. Guests
    and musicians assemble, but custom delays the beginning while girls and men feign
    reluctance. The narrator and an artist observe the sea, ice, and dancers from
    a cliff, then join the dance. The dancing becomes energetic and continues until
    midnight, ending when the harmonica player's finger is numb. The passage closes
    with the next day's departure on an egg-collecting cruise.
