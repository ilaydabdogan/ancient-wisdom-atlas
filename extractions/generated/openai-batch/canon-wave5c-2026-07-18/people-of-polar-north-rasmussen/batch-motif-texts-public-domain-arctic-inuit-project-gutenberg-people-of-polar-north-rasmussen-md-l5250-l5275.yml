  summary: The passage describes changing Polar Eskimo attitudes toward hostile spirits
    called tornarssuit. It reports that some signs, such as dogs barking in the dark
    or avalanches, are still spoken of as supernatural, though not always literally.
    Osarqfcq explains an older belief that many unseen beings existed, that nearly
    everything had a spirit, and that such spirits had underground houses entered
    through holes in the earth and appeared to solitary people in human-like form.
