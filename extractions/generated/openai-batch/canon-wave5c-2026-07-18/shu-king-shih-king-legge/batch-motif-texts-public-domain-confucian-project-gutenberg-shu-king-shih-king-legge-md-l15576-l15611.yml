  quote: King Wan is on high. Oh ! bright is he in heaven.
  summary: The passage introduces the Major Odes and the first ode of the Wan Wang
    decade. It describes the ode as celebrating King Wan, dead and alive, as founder
    of the A'au/Zhou dynasty, whose virtues drew the favor of Heaven or God. The prose
    note attributes the composition to the duke of A'au for the young king Khding,
    explains Wan's posthumous royal title, and says Wan laid the foundations of kingly
    power. The opening stanza places King Wan on high in heaven and says a favoring
    appointment recently came upon A'au.
