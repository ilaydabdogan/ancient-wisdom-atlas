canonical_text:
  quote: ''
  summary: The passage comments on an infant exposure tradition associated with Hau-ji,
    describes Hau-ji's precocious agricultural activity, his promotion of grain cultivation,
    his appointment as lord of Thai, and his founding role in sacrifices continued
    by his descendants. It then describes sacrificial preparations, offerings, and
    divine acceptance. The passage begins the next ode, describing a royal feast for
    kin, protection of rushes as an emblem of shared ancestry, provision of mats and
    food, music, and an archery trial.
  language: English
