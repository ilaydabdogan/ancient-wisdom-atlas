canonical_text:
  quote: ''
  summary: An editorial note attributes a sacrificial piece to the duke of ^au/A'au
    after Wu's accession, during a royal progress asserting Heaven's appointment to
    succeed Shang. The ode petitions Heaven to treat the king as its son, says succession
    has come from Heaven to the House of A'au, portrays spiritual beings of rivers
    and hills as satisfied or at rest, and describes the king ordering princes, putting
    away weapons, cultivating virtue, and preserving the appointment.
  language: English
  quote_policy: summarized
