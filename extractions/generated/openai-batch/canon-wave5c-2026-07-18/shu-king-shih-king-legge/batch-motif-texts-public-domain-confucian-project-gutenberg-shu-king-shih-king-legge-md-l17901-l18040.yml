canonical_text:
  quote: ''
  summary: 'The passage gives background on the Wei-related odes, then presents and
    annotates several pieces: a marchioness of Wei complains against an unkind husband
    and appeals to the sun, moon, parents, and perhaps Heaven; an officer of Wei laments
    poverty and submits silently to Heaven; a widow protests pressure to remarry,
    swearing fidelity to her dead mate while invoking her mother and Heaven; and a
    stanza describes the splendor and beauty of Hsiuan Chiang while noting moral criticism
    of her.'
  language: English
  quote_policy: summarized
