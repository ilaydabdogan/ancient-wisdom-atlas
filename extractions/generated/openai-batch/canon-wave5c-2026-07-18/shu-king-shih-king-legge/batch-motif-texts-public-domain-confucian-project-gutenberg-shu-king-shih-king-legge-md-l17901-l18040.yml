candidate_motifs:
- id: motif:1
  label: mistreated wife appealing to celestial witnesses
  taxonomy_refs: []
  basis: Ode 4 presents a wife complaining of bad treatment and repeatedly addressing
    the sun and moon, with commentary noting the appeal to them as if they could take
    cognizance.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The commentary allows that the address to sun and moon may be prosopopoeia
    rather than a belief in literal celestial intervention.
- id: motif:2
  label: submission to Heaven in distress
  taxonomy_refs: []
  basis: The officer describes sorrow, poverty, and lack of recognition, then says
    Heaven has done it and asks what he can say.
  evidence_refs:
  - ev:5
  - ev:12
  confidence: medium
  cautions: The note cautions that Heaven is not simply equivalent to decree; the
    exact theological sense remains glossed rather than fully defined.
- id: motif:3
  label: widow's oath of lifelong fidelity
  taxonomy_refs: []
  basis: The widow protests pressure to remarry, calls the dead man her mate or only
    one, and swears until death to have no other or not do the evil thing.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The motif is explicitly moralized by the editor/commentary as refusal
    to marry again, not presented as a mythic union or sacred marriage.
- id: motif:4
  label: widowhood imaged as a drifting boat
  taxonomy_refs: []
  basis: The poem twice describes a cypress boat floating in the Ho, and the note
    says these lines probably indicate widowhood, leaving the speaker like a boat
    floating on the water.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage presents this as an allusive image; it should not be classified
    as an ark or salvific vessel motif.
- id: motif:5
  label: celestial or goddess-like beauty contrasted with vice
  taxonomy_refs: []
  basis: The heading announces a contrast between Hsiuan Chiang's splendor and viciousness,
    while the stanza says she appears like a visitant from heaven and like a goddess.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The comparison is aesthetic and moralizing within the ode; it does not
    establish that Hsiuan Chiang is divine.
