  summary: The passage introduces the Odes of Pin, attributes the first ode to the
    duke of A'au as instruction in ancestral ways, and gives a stanza describing seasonal
    ice collection, ice-house opening with sacrifice, autumnal preparations, and offerings
    with long-life wishes to the ruler. Notes explain the ice ritual as sacrifice
    to the Ruler of Cold, the Spirit of the Ice, and describe the final offering as
    an expression of loyalty.
