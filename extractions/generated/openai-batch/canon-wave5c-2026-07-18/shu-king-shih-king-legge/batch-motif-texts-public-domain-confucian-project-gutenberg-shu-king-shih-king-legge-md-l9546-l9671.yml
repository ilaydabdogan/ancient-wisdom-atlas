- id: obs:1
  text: The editorial introduction describes “The Officers of A'au” as a general outline
    of the dynasty’s official system, including names and functions of principal ministers
    and counsels addressed by the king.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king brings the myriad regions to tranquillity, tours tenures, punishes
    chiefs who refused to appear at court, secures the people’s repose, receives acknowledgement
    of his virtue, returns to the capital, and regulates officers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king states that former practice was to regulate government before confusion
    and secure the country before danger.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king cites Yao and Shun as rulers who studied antiquity, established a
    hundred officers, and thereby produced harmonious government and repose among
    the myriad states.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king says that Hsia and Shang doubled the number of officers and still
    secured good government, while early intelligent kings valued suitable men more
    than the number of offices.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The king describes himself as reverently cultivating virtue, concerned about
    his deficiencies, looking to former dynasties, and instructing his officers.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king appoints the Grand-Master, Grand-Assistant, and Grand-Guardian as
    the three Kung, whose functions include discourse on principles of reason, adjustment
    of states, and harmonizing heaven and earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king appoints the Junior Master, Junior Assistant, and Junior Guardian
    as the three Ku, who assist the Kung, diffuse transforming influences, and assist
    the One man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Prime Minister manages the regions, supervises other officers, and secures
    uniformity within the four seas; the Minister of Instruction presides over education
    and the five social relations.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Minister of Religion regulates ceremonies and services to spirits and
    manes; the Minister of War commands the six hosts; the Minister of Crime punishes
