canonical_text:
  quote: ''
  summary: The passage contains royal blessing stanzas in which Heaven establishes
    and enriches the addressee, seasonal offerings are made to former dukes and kings,
    ancestral spirits confer blessings, and dynastic continuity is wished through
    images of mountains, streams, celestial bodies, and evergreens. It then presents
    a wife using tortoise-shell and reed divination to learn that her absent warrior
    is near. A later palace ode describes a noble lord asking for dream divination;
    bears are interpreted as omens of sons, while cobras and snakes are interpreted
    as omens of daughters, followed by gendered birth-status expectations.
  language: English
  quote_policy: summarized
