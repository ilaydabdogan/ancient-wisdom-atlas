  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Offerings are presented with auspices and purifications in spring, summer,
    autumn, and winter to the dukes and former kings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The former dukes and kings are described in notes as ancestors; their spirits
    confer blessings, and the people universally practise the addressee's virtue.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The addressee's succeeding line is wished to be like the moon advancing to
    fullness, the sun ascending, the everlasting southern hills, and the luxuriance
