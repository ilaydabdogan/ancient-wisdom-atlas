canonical_text:
  quote: "“the grounds along the rivers were everywhere made habitable”"
  summary: The passage summarizes the Shu account of a destructive inundation in Yao’s
    time, Khwan’s failed nine-year attempt to control it, and Yii/Yu’s successful
    flood-control and civilizing works. It also describes Yu’s extreme dedication,
    including neglect of family life, and reports later scholarly interpretations
    that historicize the account as the attribution of long-term settlement and drainage
    works to an early chief.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Yao is described as suddenly confronted by a terrible inundation whose waters
    overtop hills and threaten the heavens, while the people groan and murmur.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The nobles recommend Khwan for the task of correcting the calamity; Yao delegates
    the task despite misgivings, and Khwan labours unsuccessfully for nine years.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Khwan’s son Yii then enters the work and is represented as tracking great
    rivers, burning woods, hewing rocks, cutting through mountains, and deepening
    channels so waters flow to the eastern sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yii forms lakes and raises embankments, after which grounds along rivers are
    made habitable, hills are cleared of excess wood, access to the capital is secured,
    and lands, soils, resources, and revenues are ordered.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yii says he mounted four kinds of conveyances suited to land, water, icy places,
    and hills.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Yii says that, with Yi, he hewed woods and showed the people how to obtain
    flesh to eat by capturing fish, birds, and beasts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Yii says he opened passages for streams through the nine provinces, conducted
    them to the sea, deepened channels and canals, and conducted canals to streams.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Yii says that, with K., he sowed grain, taught the people to obtain food of
    toil, urged exchange of surplus and lack, and thereby the people got grain and
    the regions came under good rule.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Yii reports remaining with his wife only four days after marrying at Tu-shan;
    Mencius says he passed his own door three times without entering, and Yii says
    he did not regard his wailing son while planning his work on the land.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The narrator states that Yii’s flood-control and civilizing works are incredible
    if taken as completed within a few years before Yao’s death, and cites Biot’s
    remark that such a Yii would be supernatural.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Biot’s reported conclusion is that the document preserves the progress of
    a great colony or settlement process, with Yu as first explorer, forest clearer,
    cultivator, and first chief to whom later drainage and clearing were attributed
    by Chinese tradition.
  category: speech
  evidence_refs:
  - ev:9
