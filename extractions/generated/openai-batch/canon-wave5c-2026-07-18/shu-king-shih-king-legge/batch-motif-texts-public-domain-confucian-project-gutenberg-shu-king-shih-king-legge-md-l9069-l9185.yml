canonical_text:
  quote: ''
  summary: 'After the king returns from suppressing rebellion in the east, the duke
    of A''au delivers the king''s announcement to former Yin officers and people and
    to many regions. The speech argues that dynastic displacement follows Heaven''s
    will: Hsia lost Heaven''s favor through corrupt rule, Heaven chose Thang, and
    the last Yin ruler likewise failed to continue Heaven''s favoring decree.'
  language: English translation
  quote_policy: summarized
