  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Heaven sought a true lord for the people and made its favoring decree light
    on Thang the Successful, who punished and destroyed the sovereign of Hsia.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Thang is described as the choice of the numerous regions, becoming lord of
    the people and attending to essential sovereign virtue so that the people imitated
