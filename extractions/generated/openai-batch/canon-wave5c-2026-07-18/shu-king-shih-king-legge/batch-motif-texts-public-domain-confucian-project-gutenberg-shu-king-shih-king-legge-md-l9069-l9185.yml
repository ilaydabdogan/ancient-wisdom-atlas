  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The duke of A'au speaks on behalf of the king to the four states, numerous
    regions, and former officers and people of the prince of Yin.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The announcement says the former Yin officers and people had been treated
    leniently with regard to their lives.
  category: speech
  evidence_refs:
