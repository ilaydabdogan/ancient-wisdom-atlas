canonical_text:
  quote: ''
  summary: The passage first gives a note about a drought demon named Po, then presents
    stanzas in which an afflicted sovereign addresses God and spirits during an excessive
    drought, recounting timely prayers and sacrifices and the distress of officials.
    It then introduces Ode 5, The Sung Kao, about King Hsiian appointing a relative
    as marquis of Shan and defender of the southern border. The ode describes lofty
    mountains sending down a spirit that produced the princes of Fu and Shan, their
    support for the royal house and the states, the chief of Shan’s appointment at
    Hsieh, the earl of Shao’s construction of walls and an ancestral temple, and royal
    investiture gifts of steeds and equipment.
  language: English translation
  quote_policy: summarized
