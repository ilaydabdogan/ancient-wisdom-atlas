canonical_text:
  quote: ''
  summary: 'A ministerial admonition to a young king: from a newly built central city
    he is to govern as Heaven''s representative, harmonize with the people, cultivate
    reverence, learn from the fall of Hsia and Yin, avoid violent rule, work with
    ministers, and present offerings and prayers to Heaven for a long-abiding decree.'
  language: English
  quote_policy: summarized
