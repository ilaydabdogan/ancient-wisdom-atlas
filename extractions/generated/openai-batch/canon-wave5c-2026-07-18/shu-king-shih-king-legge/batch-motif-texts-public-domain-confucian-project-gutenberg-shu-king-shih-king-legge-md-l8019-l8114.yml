- id: obs:3
  text: After the great city has been built, Tan says the king may be the mate of
    great Heaven, sacrifice to spirits above and beneath, and administer government
    from the central spot.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king is instructed to subdue former Yin managers of affairs and associate
