  quote: Heaven has given the charge to destroy him.
  summary: The passage introduces the Shang/Yin dynasty and Thang, then presents Thang
    addressing his people before an expedition against the sovereign of Hsia. He says
    the action is not rebellion, but a punishment appointed by Heaven because of Hsia's
    crimes and oppression. The people are described as reluctant and as quoting a
    wish that the sun associated with Hsia would expire. Thang asks them to assist
    him and promises reward.
