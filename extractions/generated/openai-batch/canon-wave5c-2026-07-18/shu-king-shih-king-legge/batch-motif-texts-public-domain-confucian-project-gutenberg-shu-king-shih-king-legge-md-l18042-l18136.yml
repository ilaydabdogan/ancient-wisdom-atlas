canonical_text:
  quote: ''
  summary: 'The passage praises Duke Wan of Wei as a restorer and second founder after
    Wei had nearly been destroyed. It describes his timed palace-building, surveying
    of the site, planting of useful trees, and tortoise-shell divination with a favorable
    result. The excerpt then introduces an ode in which a woman recounts a courtship:
    a suitor comes under the pretext of trading cloth for silk, makes proposals, later
    reports favorable tortoise-shell and stalk divination, and she agrees to depart
    with him.'
  language: English
  quote_policy: summarized
