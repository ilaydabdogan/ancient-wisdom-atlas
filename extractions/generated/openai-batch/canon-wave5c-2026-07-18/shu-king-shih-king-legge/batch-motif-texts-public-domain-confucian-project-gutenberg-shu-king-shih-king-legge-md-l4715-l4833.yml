canonical_text:
  quote: ''
  summary: 'The passage closes an admonition to a ruler about beginning difficult
    tasks carefully, attending to the people''s hardships, guarding against complacency
    on the throne, and testing counsel. It then introduces and presents I Yin''s instructions
    on pure virtue to the young king Thai Jia: Heaven''s appointments depend on constant
    virtue; Hsia fell through irreverence and oppression; Thang and I Yin possessed
    pure virtue; Heaven favored Thang; the king should renew virtue, employ worthy
    ministers, and secure the people''s welfare. It ends by linking ancestral-temple
    remembrance, popular acknowledgment, and mutual dependence between sovereign and
    people.'
  language: English
  quote_policy: summarized
