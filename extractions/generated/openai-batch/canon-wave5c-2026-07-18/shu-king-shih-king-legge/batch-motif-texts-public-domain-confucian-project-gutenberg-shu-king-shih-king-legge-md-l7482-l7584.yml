canonical_text:
  quote: At sacrifices spirits should be employed.
  summary: The passage introduces an admonition against drunkenness, saying that Shang
    society followed its sovereign into drunkenness and that Fang is charged with
    correcting the habit. It discusses the term jiu and cites a tradition in which
    I-ti makes jiu for Yu, who rejects it and predicts that later rulers will lose
    states through it. In the translated announcement, the king orders commands to
    be made known in Mei, invokes King Wan's precedent that spirits belong at sacrifices,
    and states that Heaven's terrors, social disorder, loss of virtue, and the ruin
    of states are connected with guilty indulgence in spirits.
  language: English
  quote_policy: quoted
