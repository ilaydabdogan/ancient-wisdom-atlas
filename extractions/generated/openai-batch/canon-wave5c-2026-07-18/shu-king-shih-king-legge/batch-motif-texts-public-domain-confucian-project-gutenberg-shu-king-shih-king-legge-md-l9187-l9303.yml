canonical_text:
  quote: ''
  summary: A royal speech explains the fall of Hsia and Yin/Shang as the result of
    rulers' excess and failed government, says Heaven tested and then chose the kings
    of A'au to rule, and admonishes regional peoples and officers to obey, harmonize,
    fulfill duties, and avoid punishment.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king announces to the numerous regions that Heaven had no fixed purpose
    to remove the Hsia or Yin sovereigns, but ruin followed the rulers' misconduct.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The last sovereign of Hsia is described as having plans of government that
    did not secure the kingdom, after which Heaven sent ruin and the chief of Shang
    ended the Hsia line.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The last sovereign of Shang/Yin is described as extremely luxurious and as
    having government without purity or progress, after which Heaven sent ruin.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A maxim states that the wise become foolish by not thinking and the foolish
    become wise by thinking.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Heaven is said to have waited kindly for five years for the descendant of
    Thang, but found nothing in him deserving regard.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Heaven sought among the numerous regions, using terrors to stir up a reverent
    person, but found none deserving of favor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The kings of A'au are described as treating the people well, sustaining virtuous
    government, and presiding over services to spirits and Heaven.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Heaven is said to have instructed, increased, chosen, and given the decree
    of Yin to the king's group so that they might rule the numerous regions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The king says he has dealt leniently with the lives of the people of the four
    states and asks why they do not obey and cooperate with the kings of A'au.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The king threatens severe punishment and death if the people do not take advantage
    of the leniency by which their lives were spared.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The king tells the officers that they have served his overseers for five years
    and urges them to fulfill duties and cultivate harmony in self, family, and cities.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The king says that if the officers are attentive to duties, Heaven will favor
    and compassionate them, and the A'au sovereigns will help, reward, and select
    them for royal service.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The king warns that failure to honor his charges will bring the terrors of
    Heaven, royal punishment, and removal far from their country.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The king closes by saying he gives commands in awe and that the addressees
    may make a new beginning if they reverently realize harmony.
  category: speech
  evidence_refs:
  - ev:7
