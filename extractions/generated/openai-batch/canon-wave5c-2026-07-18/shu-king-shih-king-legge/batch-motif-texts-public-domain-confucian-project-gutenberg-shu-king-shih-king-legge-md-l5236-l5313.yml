canonical_text:
  quote: ''
  summary: A king reports that, while silently considering the right way, he dreamed
    that God gave him a good assistant. A search by picture finds Yueh, a builder
    from a wild country, whom the king raises to be prime minister. The king charges
    Yueh to instruct and correct him through a series of practical metaphors. Yueh
    replies that a sovereign made receptive to reproof becomes sage, and later advises
    that government should accord with Heaven, serve the people, and appoint only
    able and worthy officers.
  language: English
  quote_policy: summarized
