canonical_text:
  quote: ''
  summary: The passage includes the end of a lament over political and agricultural
    ruin, then introduces and excerpts Ode 4, “The Yun Han,” in which King Hsuan,
    during a severe drought, addresses Heaven, God, and many spirits. He asks what
    crime has brought recurring famine, lists sacrifices and ritual measures already
    performed, laments that no divine help comes, fears the extinction of the Zhou
    people and ancestral sacrifices, appeals to ancestors, and describes the drought
    as parching hills, drying streams, and being enforced by a drought demon with
    fire-like oppression.
  language: English translation
  quote_policy: summarized
