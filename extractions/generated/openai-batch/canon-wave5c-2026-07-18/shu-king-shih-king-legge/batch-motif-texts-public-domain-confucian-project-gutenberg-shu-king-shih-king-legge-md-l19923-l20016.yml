canonical_text:
  quote: ''
  summary: The passage gives teachings attributed to the Master on loyal service to
    a ruler, filial mourning for parents, funeral and ancestral rites, and an appended
    note on household hierarchy as a model for government. It also includes editorial
    notes on textual transmission and cross-references to the Book of Poetry and ritual
    literature.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master says the superior man serves his ruler by concentrating on loyal
    duty at court, amending his own errors afterward, carrying out good measures deferentially,
    and correcting the ruler to keep him from evil.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A stanza from the Book of Poetry is quoted to express love kept in the heart
    and not forgotten.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A filial son mourning a parent wails without prolonged sobbing, neglects appearance
    in ceremony, speaks without elegance, does not enjoy fine clothes or music, and
    is not conscious of the flavor of delicacies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After three days of mourning the filial son may eat, so that the living are
    not harmed on account of the dead; the mourning period is limited to three years.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: An inner and outer coffin are made; grave-clothes and a shroud are put on
    the body; the body is lifted into the coffin.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Round and square sacrificial vessels are set forth; women beat their breasts,
    men stamp their feet, and mourners wail and weep while escorting the coffin to
    the grave.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A tortoise-shell is consulted to determine the grave and its surrounding ground,
    and the body is laid there in peace.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The ancestral temple is prepared to receive the departed person's tablet;
    offerings are presented to the disembodied spirit, and sacrifices are offered
    in spring and autumn.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that love and reverence toward living parents, and grief
    and sorrow toward dead parents, complete the filial son's service.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: An editorial note says the Classic of Filial Piety was published by emperor
    Hsiian in 722, and that Sze-ma Kwang later published a twenty-two chapter version
    with an additional chapter.
  category: other
  evidence_refs:
  - ev:11
- id: obs:11
  text: The additional chapter says that rules of government are found inside the
    smaller doors to the inner apartments, with awe for father and elder brother,
    while wife, children, servants, and concubines are compared to common people,
    serfs, and underlings.
  category: relationship
  evidence_refs:
  - ev:9
