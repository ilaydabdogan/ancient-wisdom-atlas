  quote: ''
  summary: The passage describes King Wan remaining at the capital while his forces
    advance, choosing and settling a central site near the Wei, receiving divine approval
    and a command to attack a foe state, and conquering Khwng after sacrifices to
    God and the Father of War. It then praises King Wu as the filial successor of
    wise royal predecessors who are in heaven, aligned with Heaven’s will, and the
    source of future dynastic blessing for his posterity.
  language: English translation
