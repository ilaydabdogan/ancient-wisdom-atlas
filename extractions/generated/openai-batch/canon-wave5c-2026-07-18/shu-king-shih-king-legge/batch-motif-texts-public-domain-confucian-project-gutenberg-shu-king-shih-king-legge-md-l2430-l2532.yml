canonical_text:
  quote: ''
  summary: After the Ti dies, the people mourn him and music ceases. Shun goes to
    the temple of the Accomplished Ancestor, deliberates with high officers about
    opening communication with the realm, instructs the twelve Pastors on government,
    and appoints or confirms ministers for regulation, agriculture, instruction, crime,
    and works.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After twenty-eight years, the Ti dies, and the people mourn him for three
    years as for a parent.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Within the four seas, eight kinds of musical instruments are stopped and hushed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the first day of the first month of the next year, Shun goes to the temple
    of the Accomplished Ancestor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Shun deliberates with the President of the Four Mountains about opening communication
    with the four quarters of the land and about seeing and hearing through all the
    people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Shun consults the twelve Pastors and instructs them about food, seasons, kindness
    to distant people, cultivation of nearby ability, honoring the virtuous, trusting
    the good, and discountenancing the artful.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The court identifies Po-yu, the Minister of Works, as one able to serve as
    General Regulator; Shun appoints him, noting that he has regulated water and land.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Po-yu bows with his head to the ground and tries to decline in favor of other
    named officials, but Shun tells him to undertake the duties.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Shun tells Khi that the black-haired people are suffering from famine and
    orders him, as Minister of Agriculture, to sow various kinds of grain for them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Shun tells Hsieh that the people lack affection for one another and do not
    observe the five orders of relationship; he assigns Hsieh, as Minister of Instruction,
    to set forth lessons of duty gently.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Shun tells Kao-yao that barbarous tribes, robbers, murderers, insurgents,
    and traitors trouble the land and assigns him, as Minister of Crime, to apply
    punishments and banishments with intelligence.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The court names Zui as one able to superintend works; Shun appoints him Minister
    of Works, and Zui bows and tries to decline in favor of others.
  category: sequence
  evidence_refs:
  - ev:8
