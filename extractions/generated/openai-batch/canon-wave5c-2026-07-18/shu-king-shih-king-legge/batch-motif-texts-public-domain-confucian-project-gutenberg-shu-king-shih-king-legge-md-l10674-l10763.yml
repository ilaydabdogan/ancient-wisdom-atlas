canonical_text:
  quote: ''
  summary: The passage frames punishment as requiring reverence, ancient models, virtue,
    and exact adaptation. A king at the age of one hundred considers punishments for
    the people of the four quarters and recounts an ancient account in which KJi^
    Y6 first produced disorder. The people of Miao use punishments rather than goodness,
    turn the five punishments into oppressive instruments, slaughter innocents, and
    apply mutilating penalties without distinction. The people become disorderly and
    violate oaths and covenants. The oppressed declare innocence to Heaven; God surveys
    the people and finds no fragrance of virtue but the odor of cruel punishments.
    The great Ti compassionates the innocent, terrifies and extinguishes the Miao,
    and commissions A'^ung and Li to end communications between earth and heaven,
    after which spirit-descents cease.
  language: English
  quote_policy: summarized
