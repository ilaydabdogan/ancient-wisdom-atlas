canonical_text:
  quote: ''
  summary: The passage recounts Hau-^i's agricultural teaching, the continuation of
    ancestral royal work by Thai, Wan, and Wu, Heaven's and God's support at Mu, Wu's
    victory over Shang, and the establishment of Lu through royal appointment and
    territorial grant. It then describes the present Lu descendant's sacrifices to
    God and ancestors, detailed seasonal sacrificial offerings, promised ancestral
    blessings of prosperity and longevity, and the prince's military resources against
    surrounding peoples.
