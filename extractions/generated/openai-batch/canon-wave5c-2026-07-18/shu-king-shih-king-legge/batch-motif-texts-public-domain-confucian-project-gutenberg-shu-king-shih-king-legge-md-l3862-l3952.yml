canonical_text:
  quote: ''
  summary: The passage introduces Book III, The Songs of the Five Sons, as instruction
    derived from lessons left by Yu for his posterity. It describes Thai Khang as
    an idle and dissipated ruler whose virtue failed and whose people wavered in allegiance.
    He went hunting beyond the Lo and did not return for a hundred days; I, prince
    of A7/iung, used the people's discontent to block his return south of the Ho.
    Thai Khang's five brothers, accompanying their mother and waiting north of the
    Lo, responded by singing the Cautions of the great Yu. The first song teaches
    that the people must be cherished as the root of the country and that a ruler
    must be reverent and vigilant. The second song begins by condemning a palace made
    wild by lust and a country made wild for hunting.
  language: English translation
  quote_policy: summarized
