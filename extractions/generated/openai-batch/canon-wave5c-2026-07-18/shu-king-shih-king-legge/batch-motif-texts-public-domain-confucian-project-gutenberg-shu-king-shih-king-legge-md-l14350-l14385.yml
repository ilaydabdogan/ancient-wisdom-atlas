  summary: The passage introduces Minor Odes concerned with religious views and practices.
    One festal ode uses birds moving from a dark valley to a lofty tree and crying
    for companions to illustrate the value of human friendship, adding that spiritual
    beings will hearken and harmony and peace will follow. A following responsive
    festal ode presents royal officers and guests praising the king after being feasted
    and desiring blessings from Heaven and ancestors; its opening says Heaven protects,
    establishes, and makes the addressee virtuous.
