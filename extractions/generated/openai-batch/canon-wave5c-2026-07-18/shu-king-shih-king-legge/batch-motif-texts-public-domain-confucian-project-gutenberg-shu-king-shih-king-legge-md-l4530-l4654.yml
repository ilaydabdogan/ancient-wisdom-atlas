  evidence_refs:
  - ev:4
- id: obs:7
  text: After the king still did not change, I Yin resolved to build a place at Thung
    where the king could be silent near the former king's grave.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The king went to the palace at Thung, dwelt there during mourning, and eventually
    became sincerely virtuous.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the twelfth month of the king's third year, I Yin escorted the young king
    in royal cap and robes back to Po.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: I Yin's return-writing states that sovereign and people depend on one another,
