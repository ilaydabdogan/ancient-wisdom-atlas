canonical_text:
  quote: ''
  summary: Book V describes I Yin/A-hang instructing the young Shang king, removing
    him to Thung near his grandfather's grave during mourning after he ignores counsel,
    the king becoming virtuous, his return to Po in royal attire, and the king's confession
    and request for continued guidance.
  language: English
  quote_policy: summarized
