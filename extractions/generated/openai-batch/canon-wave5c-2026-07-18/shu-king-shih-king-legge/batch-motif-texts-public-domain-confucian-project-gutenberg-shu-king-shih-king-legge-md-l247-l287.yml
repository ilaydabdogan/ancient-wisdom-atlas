  summary: The preface describes the transmission and abridgment of ritual books associated
    with the Li Ki, notes their relation to imperial canonical authority, discusses
    their value and limitations for understanding ancient Chinese religion and Confucius's
    views on sacrificial worship, and introduces Confucius's brief chronicle called
    the Spring and Autumn.
