canonical_text:
  quote: ''
  summary: The passage describes a royal administrative order in which ministers lead
    subordinate officials, princes appear at court and at quarter mountains, and the
    king conducts inspections, awards promotions and degradations, and admonishes
    officials to be reverent, public-minded, studious, economical, cautious, and discerning
    in appointments. It then introduces Kun-Chan as successor in the eastern capital
    after the duke of Chau and records the king appointing Kun-Chan to rule the eastern
    border because of his virtue and filial conduct.
  language: English
