canonical_text:
  quote: ''
  summary: The passage presents King Wan and King Wu as models for establishing government
    through virtuous officers, pastors, legal officials, and other functionaries.
    Tan, the duke of A'au, admonishes the young king to appoint good officers, avoid
    artful-tongued men, delegate litigation and precautionary matters properly, maintain
    military readiness, and continue the glory and achievements of Wan and Wu. A final
    note praises the duke of Su, Minister of Crime, for reverently handling criminal
    matters and preserving the kingdom’s fortunes.
  language: English
  quote_policy: summarized
