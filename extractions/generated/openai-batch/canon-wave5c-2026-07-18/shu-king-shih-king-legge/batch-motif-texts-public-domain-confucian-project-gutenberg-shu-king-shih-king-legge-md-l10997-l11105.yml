canonical_text:
  quote: ''
  summary: The passage gives royal instructions on criminal judgment, fines, impartial
    hearings, reverent use of punishment, and fear of Heaven's punishment. It then
    introduces the Charge to the Marquis Wan, recounting the fall of King Yu, the
    restoration of King Phing, rewards to supporting lords, and the opening praise
    of kings Wan and Wu as virtuous rulers favored by God.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fines are described as a chastisement short of death that can nevertheless
    produce extreme distress.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Criminal cases are to be determined by really good persons rather than by
    people with artful tongues.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Judges are instructed to examine discrepancies, reconsider rejected views
    when necessary, settle cases with compassion and reverence, consult the penal
    code, deliberate with others, and send complete reports.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: If a man is tried on two counts, both punishments are to be recorded.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The king says he speaks with fear and reverence about punishment because its
    end is to promote virtue.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The king states that Heaven, wishing to help the people, has made the rulers
    its representatives below.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The judges and princes are told to hear both sides impartially and not seek
    private advantage from legal pleas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Gain obtained through deciding cases is described as guilt that will be repaid
    with many judgments, and officials are told to stand in awe of Heaven's punishment.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: Future holders of dignities and offices are told to look to ancient wise men
    as models in the use of punishments, especially the five punishments hitting the
    due mean.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The introductory note says King Yu was attached to Pao-sze, degraded his queen,
    sent their son to Shan, and was later slain when barbarian tribes sacked the capital.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Feudal princes are said to have assisted the royal House, driven away the
    barbarians, brought back the heir from Shan, and hailed him as King Phing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: King Phing is said to have transferred the capital from Hao to Lo, marking
    the beginning of the Eastern Zhou period in the note.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The Marquis Wan is presented as one of the feudal lords rewarded for helping
    King Phing obtain the throne and as the recipient of a charge connected with appointment
    over other princes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: In the opening of the charge, the king praises Wan and Wu for making their
    virtue brilliant and says God caused a favoring decree to rest on King Wan.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Ministers after Wan and Wu are described as aiding and serving their sovereigns
    so that the king's fathers sat tranquilly on the throne.
  category: relationship
  evidence_refs:
  - ev:6
