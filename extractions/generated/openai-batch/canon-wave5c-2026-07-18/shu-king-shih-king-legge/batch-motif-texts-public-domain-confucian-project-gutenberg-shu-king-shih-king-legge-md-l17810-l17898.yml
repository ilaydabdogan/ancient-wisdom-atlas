  summary: 'The passage introduces the Odes of Shao and the South, then gives two
    odes and commentary about women gathering plants and preparing them reverently
    for sacrificial or ancestral ritual use: a prince''s wife gathers white southernwood
    for the prince''s business or temple, and a young wife of an officer gathers duckweed
    and pondweed, boils and arranges them in an ancestral chamber.'
