canonical_text:
  quote: ''
  summary: A scholarly preface discusses the meaning of the title or name Ti in the
    Shu, arguing that it originally denoted a Supreme Lord or Divine One and was later
    applied to earthly rulers. It reviews dynastic royal titles, legendary pre-Hsia
    accounts including Phan-ku and the separation of heaven and earth, the San Hwang
    or Three August Lines, the Wu Ti or Five Emperors, and the king of A'/zin's adoption
    of Hwang Ti after conquest. It also discusses the grammar of Ti before the names
    Yao and Shun and later references by Confucius and Mencius.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage presents two possible explanations of Ti: either as a high title
    applied by an earthly ruler to himself, or as a designation of the Supreme Lord
    and Ruler later applied to an earthly ruler.'
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that Ti is given in the Shu to Yao and Shun, and says he
    will retain the Chinese term rather than translate it as emperor.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that from the great Yu to B.C. 221 the rulers of Hsia, Shang
    or Yin, and Kau were styled Wang, and sometimes Hau, rather than Ti.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that pre-Hsia history, except the period of Yao and Shun,
    is described as fabulous and legendary, and that the oldest documents about Yao
    and Shun are not contemporary with them.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The earlier accounts are said to open with Phan-ku, in whose time heaven and
    earth were first separated.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The San Hwang or Three August Lines are described as consisting of twelve
    Celestial, eleven Terrestrial, and nine Human Sovereigns who ruled together about
    50,000 years.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the San Hwang and other lines, the passage says the accounts arrive
    at the Wu Ti or Five Emperors; Fuh-si is commonly named as the first, and Yao
    and Shun are sometimes included as the last two Tis.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king of A'/zin is said to have changed his title to Hwang Ti after subjugating
    the whole country and claiming to unite the virtues of the three Hwangs and exceed
    the merits of the five Tis.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage argues that Ti precedes Yao and Shun in the Shu, functioning adjectivally
    rather than as the normal Chinese title position for emperor.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says that if Ti in Ti Yao and Ti Shun means the Deified, then
    when used alone it means Divus or the Divine One.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that Confucius speaks of Yao and Shun in the Analects without
