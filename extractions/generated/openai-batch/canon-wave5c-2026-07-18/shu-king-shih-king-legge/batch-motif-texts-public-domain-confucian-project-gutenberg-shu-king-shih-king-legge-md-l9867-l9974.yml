  text: The prefatory note says the king, feeling that his end is near, calls principal
    ministers and officers around his bed and commits his son A'ao to their care and
    guidance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the fourth month, while indisposed, the king washes his hands and face,
    is dressed by attendants in cap and robes, and sits leaning on a gem-adorned bench.
  category: action
  evidence_refs:
  - ev:2
  - ev:9
- id: obs:3
  text: The king summons the Grand-Guardian Shih and a group of named nobles, officers,
    department heads, and superintendents of affairs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king states that his illness has greatly increased and that he is laying
    a charge about his successor because he may not have another opportunity.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king cites former rulers Wan and Wu as exemplary predecessors whose provisions
    and instructions supported the people and secured Heaven’s appointment; he also
    says he received Heaven’s decree and kept their instructions.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The king instructs the officials to watch over his eldest son A'ao, assist
    him in the difficulties of his position, care for distant and near peoples, promote
    tranquillity among states, and prevent A'ao from acting heedlessly from improper
    motives.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: After receiving the charge, the ministers and others withdraw; the tent is
    carried into the court; on the next day the king dies.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:10
- id: obs:8
  text: After the king’s death, the Grand-Guardian orders A'ung Hwan and Nan-Kung
