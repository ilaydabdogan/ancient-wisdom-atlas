canonical_text:
  quote: ''
  summary: Book XXII frames the closing act of a king’s life. The ill king ceremonially
    prepares himself, summons major ministers and officers, declares that death is
    near, invokes former kings Wan and Wu and Heaven’s decree, and lays a charge on
    the officials to guide and assist his eldest son A'ao. After the charge the king
    dies. The Grand-Guardian then orders arrangements for the prince to be met at
    the south gate and conducted to a side-apartment as chief mourner.
  language: English
  quote_policy: summarized
