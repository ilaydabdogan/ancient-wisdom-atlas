canonical_text:
  quote: ''
  summary: 'A didactic royal-counsel passage: Yueh gives maxims on preparation, humility,
    correct governance, restraint in ritual sacrifice, and service to spirits. The
    king praises Yueh and asks to be taught, recounting earlier learning and travels
    and using culinary and fermentation similes for cultivation. Yueh answers that
    a ruler should learn from ministers and the ancients, maintain humility and earnestness,
    survey the first king''s pattern, and appoint eminent men.'
  language: English
  quote_policy: summarized
