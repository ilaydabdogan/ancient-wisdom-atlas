canonical_text:
  quote: ''
  summary: The passage combines commentary on Zhou ritual ancestors with a discussion
    of filial piety in government. Hau-ji is described as an ancestor of the Zhou
    kings and correlate of Heaven, while King Wan is described as dynastic founder
    and correlate of God. The commentary states that Heaven and God have the same
    reference but are used with different emphases. The main ethical passage presents
    filial affection, reverence for parents, and the father-son relation as Heaven-conferred
    foundations for moral teaching, ruler-subject order, and effective government
    by the superior man.
  language: English translation with transliterated Chinese names
  quote_policy: summarized
