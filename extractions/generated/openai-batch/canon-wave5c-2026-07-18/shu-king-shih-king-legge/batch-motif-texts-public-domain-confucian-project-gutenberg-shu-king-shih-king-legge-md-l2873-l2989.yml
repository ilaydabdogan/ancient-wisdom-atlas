canonical_text:
  quote: ''
  summary: An introductory note identifies Kao-yao as Shun's Minister of Crime and
    a model administrator of justice, then explains that the book presents a conversation
    between Yii and Kao-yao. In the dialogue Kao-yao teaches that government depends
    on the ruler's virtue, knowing and employing suitable men, giving repose to the
    people, cultivating nine virtues, assigning offices properly, and recognizing
    social duties, ceremonies, rewards, and punishments as grounded in Heaven.
  language: English
