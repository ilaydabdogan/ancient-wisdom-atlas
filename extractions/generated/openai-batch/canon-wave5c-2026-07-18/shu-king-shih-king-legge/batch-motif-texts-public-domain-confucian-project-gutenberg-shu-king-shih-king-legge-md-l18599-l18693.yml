canonical_text:
  quote: ''
  summary: A historical-philological account of how the Hsiao King was reportedly
    endangered by Qin book destruction, recovered in modern and ancient textual forms,
    preserved through hidden copies and wall tablets, commented on by Khung An-kwo,
    and later debated through catalogues, memorials, and Sui-period reports.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Hsiao King suffered from the fires of Qin and that its
    later recovery resembled that of the Shu, with a shorter and longer copy and a
    modern and ancient text.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Liu Hin''s Imperial Library Catalogue is described as listing two Hsiao King
    copies: an old Khung-family text in twenty-two chapters and another copy in eighteen
    chapters later called the modern text.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pan Ku is cited as saying that four scholars had worked on the shorter Hsiao
    King text.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sui records are reported to say that when the Qin edict for destroying books
    was issued, a scholar named Yen K'ih hid his copy of the Hsiao King.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the edict was abrogated, a son of Yen K'ih brought the hidden copy out;
    the passage infers that it was then transcribed and preserved by officials charged
    with ancient books.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ancient-text copy is said to have come from tablets found in the wall
    of the Confucian house in Emperor Wu's time and commonly to have been deciphered
    by Khung An-kwo.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A note in the Sui Library is reported to say that An-kwo's work disappeared
    during Liang-dynasty troubles, was later found in the capital during Sui, and
    came into Liu Hsuan's possession.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Liu Hsuan made the recovered work public; the court acknowledged it, while
    many scholars argued that it was Liu Hsuan's own forgery ascribed to An-kwo.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A memorial by Hsu Kung says that the Hsiao King used by his father was a copy
    of one presented by a very old man of Lu to Emperor Kao.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The note explains that San lao can mean an old man from age classes over eighty,
    ninety, or one hundred, and reports another account naming Khung 3ze-hui as the
    Khung-family individual who hid the tablets during the Qin destruction edict.
  category: other
  evidence_refs:
  - ev:7
