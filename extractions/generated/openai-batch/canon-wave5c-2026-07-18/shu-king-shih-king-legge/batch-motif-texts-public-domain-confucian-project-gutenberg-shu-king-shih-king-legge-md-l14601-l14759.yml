candidate_motifs:
- id: motif:1
  label: lament over disorder under failing royal governance
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage repeatedly ties public misery to the king's disorders, lack of
    proper government, failure to employ the good, and harmful official action.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:13
  - ev:16
  - ev:17
  confidence: medium
  cautions: The passage criticizes royal and ministerial conduct; it does not explicitly
    narrate accession, succession, or formal legitimation.
- id: motif:2
  label: appeal to Heaven or the Great God during political calamity
  taxonomy_refs:
  - divine_judgment
  basis: Speakers address or look to Heaven and the Great God amid disorder, injustice,
    danger, and shaking, while celestial signs announce evil.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:7
  - ev:9
  - ev:12
  - ev:13
  confidence: medium
  cautions: The editorial material explicitly cautions that the true causes of misery
    are human conduct and not simply Heaven; divine judgment is therefore only a cautious
    motif alignment.
- id: motif:3
  label: cosmic and terrestrial portents accompanying social ruin
  taxonomy_refs:
  - chaos
  basis: The solar eclipse, sun and moon leaving proper paths, thunder and lightning,
    overflowing streams, falling crags, and hills and valleys changing places are
    presented with the ruin or misery of the kingdom.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The taxonomy reference is broad; the passage frames the signs as prodigies
    and omens rather than as a full cosmogonic chaos myth.
- id: motif:4
  label: rejected wise or exemplary counselor
  taxonomy_refs:
  - wisdom
  basis: The speaker says he was first sought as a pattern but later treated with
