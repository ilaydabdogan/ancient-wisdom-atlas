canonical_text:
  quote: ''
  summary: The passage contains laments over disorder in the kingdom. A speaker appeals
    to Heaven, describes distress across the four quarters, criticizes the king and
    ministerial factions, and identifies himself as the maker of the poem exposing
    the king's disorders. A following ode appeals to Heaven and the Great God amid
    danger, calumny, dubious counsel, and the speaker's rejection. A later ode interprets
    solar eclipse and other celestial and terrestrial prodigies as omens accompanying
    political ruin, while naming officials and criticizing Hwang-fu's disruptive and
    self-serving actions.
  language: English translation
  quote_policy: summarized
