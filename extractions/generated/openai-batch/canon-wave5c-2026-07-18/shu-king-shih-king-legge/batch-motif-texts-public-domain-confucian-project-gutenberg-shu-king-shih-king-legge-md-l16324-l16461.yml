canonical_text:
  quote: ''
  summary: 'The passage praises King Wan for seeking the people''s repose, receiving
    Heaven''s appointment, establishing himself at Fang, repairing its walls, and
    gaining the support of the four quarters. It praises King Wu for establishing
    Hao after divination by tortoise-shell, building a hall with a surrounding water
    feature, receiving homage from all directions, and showing wisdom in employing
    officers and planning for descendants. The passage then begins the legend of Hau-ki:
    Chiang Yuan makes a pure offering and sacrifice to remove childlessness, steps
    on a toe-print made by God, becomes pregnant, gives birth without harm, and the
    infant Hau-ki is preserved when placed in a lane, forest, and on ice.'
  language: English translation
  quote_policy: summarized
