  summary: 'A note describes early banquet seating without chairs or tables: guests
    sat on mats, while stools were provided for the aged. In the ode passage, guests
    are arranged according to propriety. A distant descendant presides over a feast,
    pours strong sweet spirits from a large vase into cups, and prays for aged guests
    that they may support one another in virtue and enjoy blessed old age and increasing
    happiness.'
