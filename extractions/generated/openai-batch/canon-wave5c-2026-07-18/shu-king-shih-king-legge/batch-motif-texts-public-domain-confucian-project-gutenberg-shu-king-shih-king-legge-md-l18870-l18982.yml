literal_observations:
- id: obs:1
  text: Hsiian 3ung's text is described as generally accepted as representing the
    modern-character text recovered in the second century B.C.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sze-ma Kwang presented explanations of the Hsiao King according to the old
    text in 1054 and argued for that text's correctness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fan 3u-yu produced an exposition according to the old text and stated that
    the ancient text deserved preference despite small differences from the modern
    text.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Hsiao King is said to have passed through skeptical criticism during the
    Sung dynasty, with Ku Hsi's expurgated edition named as the most notable result.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hu Hung had suggested that quotations from the Book of Poetry in the Hsiao
    King were probably later additions; Ku Hsi later judged that this suspicion had
    grounds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wang Y'mg-k/ia.n is described as having concluded that much of the Hsiao King
    had been fabricated or interpolated in the Han dynasty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ku Hsi divided the treatise into one chapter of classical text and fourteen
    chapters of illustration and commentary, and he expurgated both parts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ku Hsi treated the first six translated chapters as one continuous discourse
    by Confucius and denied that the rest of the treatise should be attributed to
    the sage.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ku Hsi considered much of the remainder to derive from 3ang-5ze or his school,
    while also attributing large interpolations to Han scholars and removing 223 characters
    from the old text.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ku Hsi's procedure is described as influenced by Khding 1's handling of the
    old text of The Great Learning, but more extensive and bolder.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Wu Khding followed Ku Hsi's general path but preferred the modern text and
    argued that the copy associated with Khung An-kvvo and Liu Hsiian was a fabrication.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Wu Khding used Hsiian 3ung's text as the basis of his revision, adopted Ku
    Hsi's division between classical text and commentary, and produced a revision
    with 246 fewer characters than the old text.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Kn l-tsun is said to list nearly 120 later works on the classic after Wu Khding's
