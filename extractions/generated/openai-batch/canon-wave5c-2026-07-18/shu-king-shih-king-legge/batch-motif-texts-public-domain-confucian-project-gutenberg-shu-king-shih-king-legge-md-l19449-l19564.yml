canonical_text:
  quote: ''
  summary: The passage teaches that ancient rulers governed all under heaven by filial
    piety, extending respectful conduct through political and household hierarchies
    so that people assisted joyfully in ancestral service. It states that living parents
    rested in their sons' honor, departed spirits enjoyed offerings, and peace prevailed.
    It then presents a dialogue in which the Master ranks filial piety as the greatest
    human action and identifies reverential awe of the father, especially making him
    a correlate of Heaven, as its highest expression, exemplified by the duke of Zhou's
    sacrifices to Hau-ji and King Wen.
  language: English
  quote_policy: summarized
