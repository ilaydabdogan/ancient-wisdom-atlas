  summary: A modern explanatory passage describes how to use a movable cardboard horizon
    on an astronomical chart to reconstruct the night sky at sunset during the equinoxes
    and solstices around B.C. 2300. It compares the resulting star positions with
    indications attributed in Chinese records to Yao and his astronomers Hsi and Ho,
    then discusses precession and a calculated table of principal star positions.
  language: English
