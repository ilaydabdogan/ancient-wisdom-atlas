canonical_text:
  quote: ''
  summary: The passage opens with an isolated warning about death and lack of forgiveness,
    then introduces the Book II announcement of A^ung-hui. Thang has overthrown and
    banished A'ieh, sovereign of Hsia, but worries that later ages may cite his act
    as precedent for rebellion. A^ung-hui argues that Heaven/God authorized Shang
    because the Hsia ruler was morally obscured and harmed the people. He praises
    Thang's restraint, rewards for virtue and merit, willingness to correct errors,
    and the confidence placed in him by the people.
  language: English
  quote_policy: summarized
