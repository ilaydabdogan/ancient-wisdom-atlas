canonical_text:
  quote: I dare not keep this by me, but offer it in sacrifice to king Wan and king
    Wu.
  summary: The king sends messengers, admonitory charges for Yin, and a sacrificial
    gift to the duke. The duke redirects the gift as sacrifice to King Wan and King
    Wu and prays for obedience, health, descendants, and Yin's prosperity. Later,
    in the new city, the king performs the annual winter sacrifice, offers red bulls
    to King Wan and King Wu, has Yi prepare and announce a prayer-like declaration
    concerning the duke's remaining behind, pours a libation, and charges the duke
    to remain.
  language: English
  quote_policy: quoted
