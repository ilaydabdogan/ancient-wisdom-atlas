- id: obs:3
  text: Yao’s astronomers are said to be able to determine solstices and the autumnal
    equinox by the culmination of specified stars, and the author assumes Hsing was
    used for the vernal equinox.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports that scholarly calculations and a star chart are used
