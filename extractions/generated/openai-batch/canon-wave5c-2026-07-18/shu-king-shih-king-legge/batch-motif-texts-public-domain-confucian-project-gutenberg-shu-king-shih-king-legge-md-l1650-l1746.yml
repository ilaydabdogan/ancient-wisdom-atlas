canonical_text:
  quote: ''
  summary: The passage discusses the twenty-eight Chinese lunar mansions, their grouping
    into four heavenly quarters, and Yao’s use of named stars to determine solstices
    and equinoxes. It uses these observations and a star chart to argue for Yao’s
    chronology. It also notes a later Shu reference to an ancient rebel, named in
    the OCR text as AV^ih Yu / AT/zih Yu, said to have first created disorder, and
    mentions later accounts of his struggle with Hwang Ti involving dragons, mists,
    and the invention of the compass.
  language: English
  quote_policy: summarized
