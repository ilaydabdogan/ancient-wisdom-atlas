canonical_text:
  quote: the floods assail the heavens
  summary: The ruler asks for capable officials to address urgent affairs and a destructive
    inundation. Hwan-tau recommends the Minister of Works, but the ruler rejects him.
    The court proposes Khwan for flood control despite the ruler's doubts; Khwan is
    employed and fails after nine years. The ruler then offers to resign his place
    to the President of the Four Mountains, who refuses for lack of virtue. The ruler
    asks for a candidate from among the illustrious or the poor, and Shun of Yu is
    named.
  language: English translation with transliterated Chinese names
