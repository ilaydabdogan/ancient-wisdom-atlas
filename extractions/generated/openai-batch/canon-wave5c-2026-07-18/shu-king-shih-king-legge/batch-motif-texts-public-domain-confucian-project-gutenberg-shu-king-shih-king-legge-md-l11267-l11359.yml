canonical_text:
  quote: ''
  summary: A historical introduction recounts Qin/Khm’s failed attempt to exploit
    treachery against Zheng/^ang, the defeat and capture of its commanders, and the
    duke’s decision to accept blame rather than execute them. In the preserved speech,
    the duke admonishes his officers, regrets rejecting old counsellors, contrasts
    good and dangerous ministers, and concludes that one person can bring either decline
    or tranquillity to a state.
