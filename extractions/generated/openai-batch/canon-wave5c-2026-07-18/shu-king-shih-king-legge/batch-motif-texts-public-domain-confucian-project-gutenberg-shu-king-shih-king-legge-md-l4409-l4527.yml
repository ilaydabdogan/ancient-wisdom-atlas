  summary: The passage introduces I Yin as Thang's chief minister and guardian-instructor
    of Thang's young successor. In the instruction, I Yin performs an ancestral rite,
    presents the heir before his grandfather's shrine, recounts how virtue or failure
    brought order or calamity to earlier dynasties, praises Thang's virtuous rule,
    and warns the young king that good conduct brings divine blessing while vice brings
    ruin to family, state, and ancestral temple.
