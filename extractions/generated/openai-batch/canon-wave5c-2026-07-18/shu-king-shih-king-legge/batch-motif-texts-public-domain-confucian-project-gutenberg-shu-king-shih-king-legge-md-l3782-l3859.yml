canonical_text:
  quote: ''
  summary: 'The passage closes a territorial account with the Wild Domain and Yu''s
    announcement that his work is complete. It then introduces and presents the Speech
    at Kan: before battle, the king assembles military leaders and troops, accuses
    the lord of Hu of disordering elements and calendrical commencements, says Heaven
    will end Hu''s appointment, and commands archers, spearmen, and charioteers under
    promised rewards and severe punishments witnessed by ancestral and land spirits.'
  language: English
  quote_policy: summarized
