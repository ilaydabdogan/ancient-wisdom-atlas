canonical_text:
  quote: ''
  summary: The passage introduces and begins an address by the duke of A'au to Prince
    Shih. The address says that Heaven sent ruin on Yin, that Yin lost the appointment
    to the throne, and that the House of A'au received it. The speaker warns that
    Heaven's favour is difficult to preserve and depends on human reverence and virtue.
    He cites earlier Shang/Yin rulers and their virtuous ministers as precedents for
    preserving a dynasty, then applies the same pattern to King Wan, whose virtue
    and ministers helped secure the favouring decree.
  language: English translation
  quote_policy: summarized
