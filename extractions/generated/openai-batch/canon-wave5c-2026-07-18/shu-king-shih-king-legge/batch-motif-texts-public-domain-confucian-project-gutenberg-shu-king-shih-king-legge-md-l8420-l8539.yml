canonical_text:
  quote: ''
  summary: An introductory note and the opening chapters of an announcement to officers
    of the former Yin/Shang dynasty explain that Zhou rule, the removal of Yin officers
    to Lo, and the loss of Yin's appointment are attributed to Heaven/God's decree
    and to Yin rulers' failure in virtue. The passage recalls earlier dynastic replacement
    of Hsia by Shang, frames punishment and removal as divinely warranted, and urges
    the Yin officers not to resist or murmur.
  language: English
  quote_policy: summarized
