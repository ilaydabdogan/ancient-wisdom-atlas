  summary: The passage introduces Book VIII, The Charge to Yueh, as belonging to the
    beginning of Wu-ting's reign and as a royal charge appointing Yueh chief minister.
    The headnote says Yueh had lived as a recluse in obscurity, was discovered among
    the Crags of Fu, became counsellor to the king, and is later compared with I Yin.
    In Section 1, the king completes three years of mourning in a mourning shed but
    still does not speak commands. The ministers remonstrate that the Son of Heaven's
    words form commands for the officers. The king responds by making a written communication.
