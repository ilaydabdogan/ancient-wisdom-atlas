canonical_text:
  quote: Now, I, Fa, am simply executing respectfully the punishment appointed by
    Heaven.
  summary: At dawn before battle, the king addresses his assembled army at Mu, denounces
    Shau of Shang, declares that he is carrying out Heaven-appointed punishment, and
    gives tactical instructions. The following section narrates the completion of
    the war, the return to Fang, the laying aside of warlike activity, sacrifices
    to ancestors, Heaven, hills, and rivers, and the issuing of appointments while
    invoking dynastic predecessors.
  language: English
