canonical_text:
  quote: ''
  summary: The passage includes parts of several odes and notes. A royal servant is
    charged to fortify an eastern city. The Marquis of Han comes from Liang to receive
    investiture, is charged by the king to continue ancestral services and support
    the sovereign, and then sacrifices to the spirit of the road before lodging for
    the night. Hu of Shao is praised and rewarded by the king with ritual gifts and
    territorial grants; the note explains that the gifts are for sacrificial use and
    that the grant is announced to the Accomplished One, understood as King Wan.
  language: English
  quote_policy: summarized
