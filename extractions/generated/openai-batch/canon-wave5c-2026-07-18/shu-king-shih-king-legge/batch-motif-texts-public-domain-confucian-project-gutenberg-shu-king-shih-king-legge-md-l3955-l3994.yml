canonical_text:
  quote: ''
  summary: 'Several speakers lament ruin: indulgence in spirits, music, and luxurious
    buildings is described as a prelude to ruin; abandonment of earlier rulers’ ways
    and laws is said to bring extinction; an intelligent ancestor’s canons, patterns,
    royal instruments, temple, and sacrifices have been neglected or destroyed; the
    final speaker expresses shame, hostility from the people, and regret that cannot
    change the past.'
  language: English
  quote_policy: summarized
