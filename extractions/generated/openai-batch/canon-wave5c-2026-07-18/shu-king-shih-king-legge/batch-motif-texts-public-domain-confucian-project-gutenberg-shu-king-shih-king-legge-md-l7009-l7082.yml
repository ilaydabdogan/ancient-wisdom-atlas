canonical_text:
  quote: ''
  summary: In a royal address, the king urges ministers, princes, and managers to
    continue the work and charge of the Tranquillizing king. He frames present distress,
    calamity, the destruction of Yin, counsel, and favorable tortoise-shell divinations
    as signs connected with Heaven, God, and the continuation of an inherited political
    task. He uses analogies of a son completing a deceased father's house-building
    and farming work to justify completing the predecessor's charge and undertaking
    an expedition east.
  language: English
  quote_policy: summarized
