canonical_text:
  quote: ''
  summary: 'Legge''s note and translated ode passage describe an ancestral sacrificial
    service: ritual personators of the dead are received, pure bulls and rams are
    prepared for seasonal sacrifices, an officer of prayer acts inside the temple
    gate, wives and guests handle food and cups, ancestral spirits enjoy offerings
    and confer blessings, bells and drums mark dismissal, the representatives withdraw,
    the spirits return, and relatives continue at a private feast. The range ends
    with the heading and prefatory note for the following ode on husbandry and ancestral
    sacrifice.'
  language: English
  quote_policy: summarized
