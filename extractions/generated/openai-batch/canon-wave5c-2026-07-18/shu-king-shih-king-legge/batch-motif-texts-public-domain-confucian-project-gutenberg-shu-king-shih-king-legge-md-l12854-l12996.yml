canonical_text:
  quote: ''
  summary: The passage explains a posthumous permanent temple for Wu-ting of Shang,
    presents an ode praising the king of Yin for subduing K'ing-K'u, enforcing tribute
    and royal order under Heaven's appointment, ruling impartially, preserving descendants,
    and completing a temple from pines and cypresses. It then introduces Zhou sacrificial
    odes, including an ode on a solemn ancestral-temple sacrifice to King Wan and
    an editorial link to red-bull offerings at Lo.
  language: English translation with romanized Chinese names
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An introductory note says that after Wu-ting's death his spirit-tablet would
    be placed in the ancestral temple and included in seasonal sacrifices, and that
    a later permanent temple was made so this cultic place would not be removed or
    discontinued.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king of Yin is described as attacking K'ing-K'u, entering dangerous passes,
    gathering its multitudes, and reducing the country under restraint.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king addresses the people of K'ing-K'u, tells them to dwell in the southern
    part of his kingdom, and cites offerings and formal acknowledgment under Thang
    as the regular rule of Shang.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Heaven is said to give appointments to princes, whose assigned capitals fall
    within the sphere of Yu's labours, and those rulers appear before the king each
    year saying their husbandry has not been neglected.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king is described as not partial in rewarding, not excessive in punishing,
    not indolent, and established over the states while Heaven inspects the kingdom.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The capital of Shang is described as orderly and a model for the kingdom,
    and the king is praised for fame, energy, long life, tranquillity, and preservation
    of descendants.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: People ascend the hill of King, cut pines and cypresses, carry them away,
    hew them square, and make pine beams and pillars for the completed temple.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The following section introduces thirty-one sacrificial odes of Zhou, associated
    mostly with King Wan and early Zhou kings.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: An editorial note associates the first Zhou sacrificial ode with King Chang's
    visit to Lo and red-bull offerings to Wan and Wu after the city's construction.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The first Zhou ode describes a solemn ancestral temple, reverent assistants
    and officers, their response to King Wan in heaven, and King Wan's continuing
    honour among people.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: The heading of the second Zhou ode says it celebrates King Wan's virtue as
    comparable to Heaven and looks to him for future blessing.
  category: attribute
  evidence_refs:
  - ev:10
