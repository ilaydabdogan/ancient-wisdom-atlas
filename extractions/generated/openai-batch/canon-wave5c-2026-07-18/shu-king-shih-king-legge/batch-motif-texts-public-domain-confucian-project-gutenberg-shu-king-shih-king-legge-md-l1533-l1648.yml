canonical_text:
  quote: ''
  summary: The passage discusses proposed chronological anchors for early Chinese
    dynasties and rulers. It uses eclipses, reign lengths, transmitted chronologies,
    and statements in the Shu, the Book of Poetry, Mencius, and later scholarship
    to assess dates for the Zhou, Shang, Hsia, and the period of Yao and Shun. It
    also reports Yao’s instructions to astronomers concerning seasonal stars and notes
    later assumptions about their meaning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage dates king Phing’s death by reference to Confucius’ Spring and
    Autumn chronicle and a solar eclipse recorded in B.C. 719.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that an eclipse mentioned in the Book of Poetry occurred
    in B.C. 776 during king Yu’s reign, and uses this to infer the start of king Hsuan’s
    reign and the approximate beginning of the Zhou dynasty.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage compares two chronological schemes for the Shang dynasty: a received
    chronology of twenty-eight reigns over 644 years and a bamboo-books scheme of
    thirty sovereigns over 508 years.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage reports that a book of Kao names three Shang rulers and gives
    the lengths of their reigns to illustrate that Heaven is likely to grant a good
    king a long period of rule.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that the Hsia dynasty lasted 439 years in the received
    chronology and 431 years in the bamboo books, with Yu’s first regnal year placed
    at B.C. 2305 in the former estimate.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage discusses an eclipse recorded in a Book of Hsia, noting that later
    calculations found an eclipse on the stated day but not visible to Chinese astronomers
    at the capital.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that Shun was thirty years on the throne with Yao, died
    fifty years later, and that Yao sought a replacement in the seventieth year of
    his reign.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage states that Yao instructed astronomers to determine equinoxes
