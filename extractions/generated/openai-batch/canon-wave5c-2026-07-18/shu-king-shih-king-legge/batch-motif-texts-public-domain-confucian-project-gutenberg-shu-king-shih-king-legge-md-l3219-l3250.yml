canonical_text:
  quote: ''
  summary: The Ti sings that Heaven's favouring appointment must be handled cautiously
    in every detail, then sings of the relation between joyful members, the rising
    head, and fully discharged offices. Kio-yao performs obeisance, urges the Ti to
    lead, attend to laws, act reverently, and examine officers' accomplishments, then
    sings contrasting outcomes when the head is intelligent or vexatious. The Ti affirms
    and tells him to go and be reverently attentive to his duties.
