  summary: Introductory material identifies Part II as the Books of Yu/Yii and Book
    I as the Canon of Shun. It explains Yu/Yii as Shun's dynastic designation, discusses
    traditions about his state, marriage to Yao's two daughters, hereditary patrimony,
    eastern origin, and descent from Hwang-Ti, and outlines the Canon's six chapters
    from Shun's virtues and advancement through Yao's death, Shun's accession, government
    organization, and Shun's death.
