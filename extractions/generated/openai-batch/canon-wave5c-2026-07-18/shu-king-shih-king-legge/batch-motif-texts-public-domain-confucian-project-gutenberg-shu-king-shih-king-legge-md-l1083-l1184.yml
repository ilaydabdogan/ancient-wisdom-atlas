canonical_text:
  quote: ''
  summary: The passage argues for the textual genuineness and historical credibility
    of portions of the Shu. It discusses Khung An-kwo's decipherment of recovered
    tablets, the relation of his text to Fu's books, support from A'au dynasty quotations,
    preservation and loss of dynastic records, the distribution of surviving documents
    by reign or dynasty, and a Hsia record mentioning a celestial phenomenon later
    interpreted as a solar eclipse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Khung An-kwo used the Books of Fu when deciphering obsolete characters, but
    the passage says he did not follow Fu's text servilely.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For books not present in Fu's copy, Khung An-kwo had to make out the tablets
    without that aid and may have supplied characters according to his understanding
    of the sense.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that many passages in Khung An-kwo's peculiar books are
    quoted in writings of the A'au dynasty.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tablets under discussion are described as having been discovered in the
    wall of the house of the Khung family.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author concludes that the portions of the Shu now possessed are substantially
    the same as those in the A'au dynasty collection before and after Confucius.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says allowance should be made for dynastic founders coloring the
    misdeeds of predecessor reigns and glossing over failures of a favored hero.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says statutes of A'au provided for preservation of previous dynasties'
    records, while many records nevertheless perished or suffered mutilation and corruption
    over time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'The passage lists surviving documents by period or dynasty: one for Yao,
    seven for Shun, four for Hsia, thirty-one for Shang, and thirty-eight for the
    first 500 years of Kau.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Books of A'au are described as contemporaneous with the events they describe
    and public not long after composition.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Books of Shang are presented as not open to suspicion and as reaching
    back to Thang the Successful, whose rule is placed at B.C. 1766.
  category: attribute
  evidence_refs:
  - ev:8
