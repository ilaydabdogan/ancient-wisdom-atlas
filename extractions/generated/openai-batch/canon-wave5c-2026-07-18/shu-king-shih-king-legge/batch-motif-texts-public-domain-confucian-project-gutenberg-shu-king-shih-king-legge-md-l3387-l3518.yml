  text: Yu-i has whitish rich soil, salt land along the sea shore, specified field
    and revenue rankings, and tribute including salt, cloth, sea products, silk, hemp,
    lead, pine trees, and strange stones.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wild people of Lai are taught tillage and pasturage and bring mountain-mulberry
    silk in baskets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For Hsu Kau, the sea, mount Tai, and the Hwai are given as boundaries; the
    Hwai and I rivers are regulated, hills are made fit for cultivation, Ta-yeh is
    confined as a marsh, and Tung-yuan is brought under management.
  category: sequence
  evidence_refs:
  - ev:3
