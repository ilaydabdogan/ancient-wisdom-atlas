  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: For Yang Kau, the Hwai and the sea form boundaries; Phang-li is confined to
    proper limits, sun-birds or wild geese have places to settle, three Kiang are
    led to the sea, and the marsh of Kan can be stilled.
  category: sequence
  evidence_refs:
  - ev:5
