  summary: The passage describes several regions or provinces by their boundaries,
    soils, watercourses, reclaimed marshes, agricultural condition, fields, revenue
    grades, and tribute goods. Rivers, lakes, marshes, and mountain areas are regulated
    or used as boundaries; different groups bring silk, pearls, fish, patterned fabrics,
    garments, fruits, and other goods by specified water routes.
  language: English
