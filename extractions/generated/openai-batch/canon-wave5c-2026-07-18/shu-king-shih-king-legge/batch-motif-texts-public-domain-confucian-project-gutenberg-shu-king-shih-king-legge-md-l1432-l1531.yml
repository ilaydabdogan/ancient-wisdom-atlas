canonical_text:
  quote: ''
  summary: A scholarly introduction discusses the limits of reconstructing early Chinese
    chronology from the Shu, describes Han attempts to systematize chronology with
    the sixty-year cycle, notes reign-list methods and recovered Bamboo Annals, and
    uses classical notices attributed to Mencius and another source to estimate broad
    chronological spans for Yao, Shun, Yu, Shang, and later figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chapter frames its purpose as addressing Chinese chronology only enough
    to show that the antiquity ascribed to the specified Shu documents is not chronologically
    impossible.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the Shu does not provide a detailed chronological
    scheme for its long period, but gives a sequence in which the dynasty of Kau followed
    Shang/Yin, Shang followed Hsia, and before Yu were Shun and Yao.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says systematic chronological schemes for national history were
    first attempted under the Han dynasty.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Han-period chronological work used a sixty-year cycle, which was assumed to
    have been devised by Ta-nao, an officer of Hwang Ti, in B.C. 2637.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage distinguishes use of the cycle for days in the Shu from later
    use of cyclic characters to chronicle years, which it says did not begin earlier
    than the time of the usurper Mang.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Before the Han dynasty, the passage says the Chinese method for determining
    the duration of national history was a list of sovereigns and the lengths of their
    reigns, though such a complete and reliable list was lacking.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sze-ma K'ien's father and Sze-ma K'ien are described as giving only the names
    and order of most Shang and Hsia rulers in their Historical Records because fuller
    chronological data were unavailable.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In A.D. 279, the grave of king Hsiang of Wei was opened, and bamboo tablets
    written in ancient seal characters were found there, including annals from Hwang
    Ti to the sixteenth year of the last king of Kau.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that chronology derived from the Annals of the Bamboo Books
    is more than 200 years shorter than the received system.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'The passage identifies two helpful classical notices: one saying Shang possessed
    the throne for 600 years, and one by Mencius giving three periods of 500 years
    and more from Yao and Shun to Thang, from Thang to king Wan, and from king Wan
    to Confucius.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Using Confucius's birth date and Mencius's broad statement, the passage calculates
    the era of Yao and Shun at 3100 years and more before the Christian era, while
    also noting that received chronology places Yu's accession in B.C. 2205.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage concludes that, apart from astronomical considerations, a more
    precise and definite length of early Chinese history cannot be determined from
    the discussed evidence.
  category: speech
  evidence_refs:
  - ev:8
