canonical_text:
  quote: ''
  summary: The passage praises king Wan as reverently serving God or Heaven, receiving
    divine appointment and blessing, and providing a model for later rulers and officers.
    It describes the transfer of Heaven's appointment from Yin/Shang to A'au, warns
    that the appointment is not permanently secure, mentions ancestral libations attended
    by Yin officers, and introduces an ode about the appointment passing from king
    Wan's father to Wan and then to king Wu. It also recounts Thai-Zan's marriage
    to king Ki, her pregnancy and birth of king Wan, and Heaven's provision of a mate
    for Wan.
  language: English translation
  quote_policy: summarized
