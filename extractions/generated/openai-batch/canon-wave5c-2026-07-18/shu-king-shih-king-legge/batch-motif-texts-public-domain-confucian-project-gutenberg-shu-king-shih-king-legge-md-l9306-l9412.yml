canonical_text:
  quote: ''
  summary: 'The passage introduces Book XIX as instruction on establishing good government
    by appointing proper men. The duke of Kau and other ministers caution the king
    about the importance of regular presidents, ministers, officers of justice, robe
    keepers, and guards. The text cites ancient rulers: the founder of Hsia sought
    able, God-honouring men for high offices, while Kieh employed cruel men and left
    no successor. Thang the Successful appointed able men, bringing harmony to Shang
    and influence across the kingdom, while Shau preferred violent and idle associates;
    God punished him and transferred possession of the land and decree to the speaker''s
    side.'
  language: English
  quote_policy: summarized
