canonical_text:
  quote: ''
  summary: The passage describes the duke of A'au beginning the foundations of the
    new great city of Lo and making an announcement for the work. A royal charge then
    addresses Fang, invoking king Wan as a model of virtuous government, careful punishments,
    and divine approval. Fang is instructed to learn from former wise rulers, protect
    the people of Yin, consolidate Heaven's appointment, and administer punishments
    without personal arbitrariness.
  language: English
  quote_policy: summarized
