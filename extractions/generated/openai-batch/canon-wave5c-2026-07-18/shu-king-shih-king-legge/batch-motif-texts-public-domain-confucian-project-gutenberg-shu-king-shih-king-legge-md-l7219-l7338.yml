- id: obs:1
  text: The duke of A'au commenced the foundations and proceeded to build the new
    great city of Lo; people from every quarter assembled in harmony, and officers
    encouraged the work.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king addresses Fang as head of the princes, younger brother, and little
    one, and identifies king Wan as Fang's greatly distinguished father.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: King Wan is described as illustrating virtue, being careful in punishments,
    not treating widowers and widows with contempt, employing the employable, revering
    the reverend, and awing those needing to be awed.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: King Wan's fame is said to have ascended to the high God; God approved, and
    Heaven gave him a grand charge to exterminate Yin and receive its appointment.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fang is instructed to follow Wan, use the former wise kings of Yin, study
