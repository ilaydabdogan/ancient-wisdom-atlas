canonical_text:
  quote: ''
  summary: The supplied passage introduces and gives part of Book XXIX, The Speech
    at Pi. A ruler of Lu, identified in the editorial material as Fo-k/im or Vo-khm,
    addresses his host before action against the tribes of Hwai and Hsu/Hsii. He orders
    silence, weapon readiness, care for army animals, restoration of lost animals
    or people, prohibitions on theft and unauthorized pursuit, preparation of provisions,
    posts, planks, intrenchments, and forage, with rewards and punishments attached
    to compliance or failure. Editorial notes also mention bow-and-arrow investiture
    as conferring limited punitive authority on a prince.
  language: English
  quote_policy: summarized
