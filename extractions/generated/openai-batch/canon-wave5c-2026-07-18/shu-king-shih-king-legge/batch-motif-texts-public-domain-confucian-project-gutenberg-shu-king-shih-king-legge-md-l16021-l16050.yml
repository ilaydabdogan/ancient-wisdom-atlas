canonical_text:
  quote: Pure and reverent was Thai Zan, The mother of king Wan.
  summary: The passage closes an image of luxuriant creepers clinging to branches
    and of a prince seeking happiness without crooked ways. It then introduces an
    ode praising Wan's virtue, filial piety, and reverence, and mentions Thai Zan
    as the pure and reverent mother of king Wan who is loving toward A'au A'iang.
    The notes compare Wan's character to a proper ritual vessel for yellow herb-flavoured
    spirits, describe his unconscious influence by natural images, and mention red
    victims in an ancestral temple and ancestral or spiritual beings blessing king
    Wan.
  language: English
  quote_policy: quoted
