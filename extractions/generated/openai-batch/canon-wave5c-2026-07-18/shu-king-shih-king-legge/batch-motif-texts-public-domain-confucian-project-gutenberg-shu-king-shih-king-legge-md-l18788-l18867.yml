canonical_text:
  quote: ''
  summary: 'A historical and editorial account of the preservation of the modern text
    of the Classic of Filial Piety: earlier commentarial works are enumerated, Emperor
    Hsuan 3ung uses earlier commentaries to prepare an imperial commentary, the text
    and commentary are engraved on stone at Hsi-an, and a later Sung annotated edition
    is completed under Hsing Ping.'
  language: English
  quote_policy: summarized
