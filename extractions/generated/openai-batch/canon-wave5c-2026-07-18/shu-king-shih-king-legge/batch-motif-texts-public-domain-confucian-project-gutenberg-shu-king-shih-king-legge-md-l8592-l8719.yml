canonical_text:
  quote: ''
  summary: The passage frames Book XV as an instruction by the duke of Kau/A'au to
    King K/ia.ng against luxurious ease. The duke teaches that rulers should understand
    agricultural toil, cites long-reigning Yin rulers and Zhou rulers as diligent
    and reverent models, contrasts later ease-born Yin kings with short reigns, and
    directly urges the successor to imitate King Wan’s restraint and avoid pleasure,
    excess, and burdensome exactions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The introductory note says the book is an Instruction addressed by the duke
    to King K/ia.ng after the duke resigned administration of the government into
    the king’s hands.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The duke says the superior man does not indulge in luxurious ease and first
    understands how sowing and reaping lead to ease and support the lower people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The duke observes that sons of parents who labored at sowing and reaping may
    fail to understand that toil, abandon themselves to ease and disorder, or speak
    contemptuously of their parents.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A'ung 3ung is described as grave, humble, reverential, cautious, measuring
    himself by Heaven’s decree, avoiding useless ease, and enjoying the throne for
    seventy-five years.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kao 3ung is described as having toiled among the lower people, remaining in
    a mourning shed and silent for three years after taking the throne, later speaking
    with harmonious wisdom, avoiding useless ease, and enjoying a fifty-nine-year
    reign without murmuring in Yin.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bu-i'ia is described as refusing unrighteous kingship, beginning among the
    lower people, knowing their dependencies, protecting the masses, not despising
    wifeless men and widows, and reigning thirty-three years.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Later Yin kings are described as born into ease, ignorant of agricultural
    toil and the lower people’s labors, seeking excessive pleasure, and having short
    reigns.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: King Thai and King K are described as humble and reverentially cautious.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: King Wan is described as dressing meanly, working at tranquillization and
    husbandry, protecting inferior people, showing kindness to wifeless men and widows,
    not taking leisure to eat from morning to sundown, restraining excursions and
    hunting, receiving only correct contributions, receiving Heaven’s appointment,
    and reigning fifty years.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: The duke directly tells the successor to imitate Wan’s avoidance of excess,
    avoid declaring a day for pleasure, receive correct contributions, and warns that
    indulgence would fail as a lesson to the people, fail to secure Heaven’s favour,
    and lead people to imitate evil.
  category: speech
  evidence_refs:
  - ev:10
