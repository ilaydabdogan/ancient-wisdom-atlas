canonical_text:
  quote: ''
  summary: 'The Ti appoints officials for harmonized governance: Yi as Forester over
    plants and animals, Po-i as arranger of ancestral temple ceremonies, Khwei as
    Director of Music and moral teacher, and Lung as Minister of Communication. The
    passage adds a charge to twenty-two men to assist the work entrusted by Heaven,
    describes periodic merit examinations, and closes with a chronology of Shun ending
    in his death described as going on high.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ti tells an appointee to undertake duties and effect harmony in all departments.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ti asks who can superintend grass, trees, birds, and beasts on his hills
    and in his marshes; the court answers by naming Yi.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yi is appointed Forester, bows with his head to the ground, asks to decline
    in favor of other named persons, and is told to manage the charge harmoniously.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ti asks the President of the Four Mountains about someone able to direct
    three religious ceremonies; the court answers by naming Po-i.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Po is appointed arranger in the Ancestral Temple and instructed to be reverent
    morning and night, upright, and pure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A note identifies the three ceremonies as observances in worship of the Spirits
    of Heaven, the Spirits of Earth, and the Spirits of Men.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Khwei is appointed Director of Music and told to teach the sons so that different
    temperaments are morally moderated.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Poetry, singing, notes, standard-tubes, and eight kinds of musical instruments
    are described as ordered together so that spirits and men are brought into harmony.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Khwei says that when he smites and gently strikes the sounding-stone, various
    animals lead one another to dance.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Lung is appointed Minister of Communication to issue the Ti's orders, report
    to him, and ensure that everything is true.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Ti says he abominates slanderous speakers and destroyers of right ways
    who agitate and alarm the people.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Ti addresses twenty-two men, commanding reverence so that they may help
    the business entrusted to him by Heaven.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Every three years merits are examined, and after three examinations the undeserving
