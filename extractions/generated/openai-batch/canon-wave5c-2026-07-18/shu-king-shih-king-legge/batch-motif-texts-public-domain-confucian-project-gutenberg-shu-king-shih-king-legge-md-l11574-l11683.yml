- id: obs:1
  text: Sze-ma TT/zien is reported as saying that more than 3000 old poems existed
    and that Confucius removed repetitions, selected 305 useful pieces, and sang them
    to his lute to align them with named musical styles.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Records of the Sui Dynasty are reported as saying that after royal benign
    rule ceased and poems were no longer collected, a Grand Music-Master of Lu arranged
    existing poems, after which Confucius expurgated and compiled 300 pieces.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ku Hsi is reported as saying that after royal methods ceased, extant poems
    were erroneous and disordered, and Confucius gathered and digested odes from Wei,
    Lu, and other states into a collection of 300 pieces.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author states that he has not found evidence sustaining the claims that
    Confucius compiled the collection, and instead holds that the Book of Poetry existed
    before Confucius in substantially the same form as at his death.
  category: speech
  evidence_refs:
  - ev:4
