canonical_text:
  quote: ''
  summary: A scholarly introduction reviews claims that Confucius selected, expurgated,
    arranged, or compiled the Book of Poetry from a larger body of old poems. The
    author rejects the stronger compilation claims, arguing that the anthology existed
    substantially before Confucius and that Confucius mainly encouraged its study,
    though he may have adjusted its arrangement. The passage cites earlier quotations
    and references as evidence for a pre-Confucian collection and ends with an ode
    mentioning singing the Ya and Nan with flute-dancing.
  language: English
  quote_policy: summarized
