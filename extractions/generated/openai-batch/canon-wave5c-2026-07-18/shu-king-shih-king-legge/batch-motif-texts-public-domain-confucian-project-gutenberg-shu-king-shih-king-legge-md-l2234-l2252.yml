canonical_text:
  quote: ''
  summary: A chief reports that an unnamed man, despite a morally difficult family,
    has maintained harmony through filial piety and has restrained them from great
    wickedness. The Ti decides to test him by marrying him to his two daughters, sends
    the daughters north of the Kwei to become wives in the family of Yu, and instructs
    them to be reverent. A note identifies the Kwei as a small stream in Shan-hsi
    flowing into the Ho.
