  summary: The passage explains the received composition of the Yi through early linear
    figures, King Wan's hexagram explanations, the duke of Kku/Ka.u's line explanations,
    and Confucian appendixes. It also describes the work's connection with divination
    in ancient Chinese religion and its survival because the tyrant of Khin exempted
    it from the flames that destroyed other Confucian literature.
  language: English
