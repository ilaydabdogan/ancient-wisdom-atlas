canonical_text:
  quote: ''
  summary: A young king, speaking in the context of rebellion after King Wu's death,
    announces to princes and officers that Heaven has laid a difficult charge on him.
    He describes his inherited royal burden, cites divinations by a precious tortoise-shell,
    reports favorable omens, answers officials who fear the expedition, and presents
    action against Yin/Shang rebels as obedience to Heaven and continuation of his
    father's plans.
  language: English translation
  quote_policy: summarized
