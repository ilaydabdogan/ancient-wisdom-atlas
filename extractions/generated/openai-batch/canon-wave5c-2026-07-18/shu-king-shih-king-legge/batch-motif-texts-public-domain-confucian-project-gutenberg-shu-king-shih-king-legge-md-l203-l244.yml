canonical_text:
  quote: ''
  summary: The preface describes the Yi as a source for later Sung dynasty philosophers,
    then introduces the Li Ki and related ancient Chinese constitutional and ritual
    books. It summarizes the Rites or Officers of Tau, the I Li, and a third Han-period
    ritual collection, noting their names, functions, attributed authorship or compilation,
    recovery, and organization.
  language: English
  quote_policy: summarized
