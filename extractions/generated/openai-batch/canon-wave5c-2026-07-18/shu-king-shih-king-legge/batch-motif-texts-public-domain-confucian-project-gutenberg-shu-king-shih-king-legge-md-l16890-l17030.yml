canonical_text:
  quote: ''
  summary: The passage contains admonitions that God or Heaven has reversed its usual
    course, is sending calamities, oppression, and anger, and is clear-seeing in human
    affairs. An old fellow-servant warns proud juniors that wrong speech, lack of
    sincerity, and disregard for advice distress the people and endanger the ruler.
    The text uses images of flames, musical response, joined half-maces, and defensive
    walls to describe escalating troubles, easy popular enlightenment, and the protective
    function of good men, people, states, families, and royal kin. A following ode
    is introduced as warnings to King Li through King Wan’s warnings to the last Shang
    ruler, blaming ruin on the ruler and his oppressive ministers rather than on Heaven
    alone.
  language: English
  quote_policy: summarized
