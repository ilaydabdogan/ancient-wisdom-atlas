  summary: The passage introduces the Shu document class called “Counsels” and Book
    II, then presents counsel exchanges involving Great Yii, the Ti, and Yi. The speakers
    discuss ordered government, the difficulty of rule and ministry, attention to
    worthy people, Heaven’s appointment of the ruler, caution, avoidance of excess,
    just action, popular welfare, and the regulation of resources such as water, fire,
    metal, wood, earth, and grain.
