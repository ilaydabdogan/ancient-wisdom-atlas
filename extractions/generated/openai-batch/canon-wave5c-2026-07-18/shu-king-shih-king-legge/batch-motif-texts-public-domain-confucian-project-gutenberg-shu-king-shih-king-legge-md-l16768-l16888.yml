canonical_text:
  quote: ''
  summary: The passage praises a courteous sovereign aided by virtuous helpers and
    admirable officers, describes them through images of wings, jade purity, and guidance
    of the four quarters, and includes an explanatory note on the sovereign as host
    of spirits through sacrifice. It then presents phoenix imagery with dryandra trees
    as a sign-like image of sage and prosperous rule, followed by a brief closing
    praise of chariots, horses, and song. The passage next introduces and excerpts
    an ode from a time of disorder, urging officials to relieve the burdened people,
    guard the kingdom's center, repress oppressors who disregard Heaven's clear will,
    help near and distant people, and establish the king. It ends with the introduction
    to another ode about misery, official duty, and Heaven's anger.
  language: English
  quote_policy: summarized
