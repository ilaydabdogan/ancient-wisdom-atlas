  quote: ''
  summary: 'The passage and accompanying notes describe events after a king''s death:
    a testamentary charge is ordered to be recorded, funeral materials are prepared,
    ceremonial screens, tents, mats, benches, regalia, relics, and royal carriages
    are arranged in palace spaces, and commentary explains these arrangements as part
    of proclaiming the successor and making the dead king''s charge known while presuming
    the king''s spirit might be present.'
