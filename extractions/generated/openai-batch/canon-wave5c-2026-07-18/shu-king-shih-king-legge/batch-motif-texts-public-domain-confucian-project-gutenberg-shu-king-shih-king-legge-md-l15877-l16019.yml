canonical_text:
  quote: ''
  summary: The passage describes the ordered building of a new settlement, including
    an ancestral temple, palace gates, and an altar to the spirits of the land. It
    then recounts clearing roads, the withdrawal of hostile Khwan groups, and the
    power of King Wan's virtue to reconcile disputing chiefs and attract submission.
    Later stanzas praise King Wan's dignity in ancestral temple rites, with ministers
    bearing libation cups, and describe natural abundance, a jade libation cup, a
    prepared red bull, offerings, sacrifice, and blessing or encouragement from spirits.
  language: English
  quote_policy: summarized
