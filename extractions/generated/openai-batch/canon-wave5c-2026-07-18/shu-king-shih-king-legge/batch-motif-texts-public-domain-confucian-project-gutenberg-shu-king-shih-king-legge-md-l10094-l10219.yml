canonical_text:
  quote: ''
  summary: A royal succession ceremony is described. Armed attendants stand at gates,
    steps, and in the hall. The king enters in ritual clothing with ministers, officers,
    and princes. The Grand-Guardian, Grand-Historiographer, and Minister of Religion
    bear ritual objects. The Grand-Historiographer reads the deceased sovereign's
    testamentary charge, commanding the king to continue the lessons, rule the kingdom,
    observe great laws, harmonize all under the sky, and display the instructions
    of Wan and Wu. The king bows, replies humbly, receives ritual objects, sacrifices
    three times to his father's spirit, and the Minister of Religion announces acceptance.
    The Grand-Guardian repeats sacrificial actions, and the ceremony closes with removal
    of sacrificial articles and the princes' departure.
  language: English
  quote_policy: summarized
