canonical_text:
  quote: ''
  summary: 'The passage summarizes and then narrates arrangements connected with building
    Lo: royal movement, site survey, tortoise-shell divination, sacrifices, orders
    to workers, and offerings brought by princes. It then presents an announcement
    urging the king to maintain reverence because Heaven has transferred its decree
    from Yin, because former dynasties rose through Heaven''s guidance and fell when
    the decree was lost, and because the king should heed aged and experienced ministers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The announcement is described as centered on the king's need to cultivate
    the virtue of reverence so that Heaven's favor and dynastic support may endure.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king proceeds in the morning from A'au to Fang, and the Grand-Guardian
    goes ahead to survey the locality of the new capital.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Grand-Guardian divines by tortoise-shell concerning several localities,
    receives favorable indications, and begins laying out the city plan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people of Yin are led to prepare sites north of the Lo, and the work is
    completed after several dated stages.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The duke of A'au comes to Lo, inspects the city plan, and offers sacrificial
    animals in the suburbs and at the altar to the spirit of the land in the new city.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Written specifications are used to give orders to the people of Yin and to
    chiefs from named domains, after which the people of Yin begin work vigorously.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Grand-Guardian brings offerings from hereditary princes, performs a prostrating
    gesture, and presents the offerings for the king and the duke of A'au.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The announcement says God in the great heavens has changed the decree concerning
    Yin and that the present king has received that decree.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The last king of Yin is described as keeping wise people in obscurity and
    vicious people in office, while common people carried children, led wives, cried
    to Heaven, and fled.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Heaven is described as having compassion on people of the four quarters and
    as causing its favoring decree to light on the founders of the current dynasty.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The founders of Hsia and Yin are each described as guided and protected by
    Heaven and obedient to it, while in later time each decree fell to the ground.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The young king is warned not to slight aged and experienced people who have
    studied ancient virtuous conduct and matured their counsels before Heaven.
  category: speech
  evidence_refs:
  - ev:8
