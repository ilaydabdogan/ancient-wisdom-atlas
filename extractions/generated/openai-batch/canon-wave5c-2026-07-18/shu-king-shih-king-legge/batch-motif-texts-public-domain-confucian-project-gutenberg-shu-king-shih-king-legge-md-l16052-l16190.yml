canonical_text:
  quote: ''
  summary: The passage praises Thai Sze and King Wan's domestic, ancestral, and public
    virtue, then presents the rise of the House of A'au through God's favor. God surveys
    the world, rejects earlier dynasties, favors the west, supports King Thai's settlement
    and land-clearing, raises proper rulers through Thai-po and King Ki, blesses King
    Wan and his descendants, instructs King Wan, and King Wan responds militarily
    to the disobedient people of Mi.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thai Sze is described as a wife becoming part of the House of A'au, inheriting
    excellent fame, and having a hundred sons ascribed to her; the note says she had
    ten sons herself and that the harem's sons are ascribed to her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A male ruler conforms to the example of his ancestors; their spirits have
    no occasion for complaint or dissatisfaction, and his example affects his wife,
    brethren, clans, and states.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ruler is harmonious in his palace and reverent in the ancestral temple,
    and while unseen by men he still feels under spiritual inspection.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: God beholds the lower world, surveys the four quarters of the kingdom, and
    seeks someone to establish the people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The earlier Hsia and Shang dynasties are said to have failed to satisfy God
    with their government; God turns kind regard toward the west and gives a settlement
    to King Thai.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: King Thai removes dead trunks and fallen trees, regulates clumps and rows,
    opens and clears various trees, and the Kwan hordes flee away; Heaven raises a
    helpmeet for him and his appointment is made sure.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: God surveys hills, thinned trees, and paths through firs and cypresses, and
    raises up a proper ruler for the state from the time of Thai-po and King Ki.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: King Ki is described as full of brotherly duty toward his elder brother, accepting
    his dignity without losing it, and his family later possesses the whole kingdom.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: King Ki is gifted by God with judgment and is able to lead and rule; when
    the sway comes to King Wan, his virtue is satisfactory, he receives God's blessing,
    and the blessing extends to his descendants.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: God speaks to King Wan, warning him not to reject this and cling to that,
    and not to be ruled by likings and desires; King Wan ascends to the height of
    virtue.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The people of Mi are disobedient, oppose the great country, and invade; the
    king rises in wrath, marshals troops, stops the invading foes, consolidates A'au,
    and meets the expectations of all under heaven.
  category: sequence
  evidence_refs:
  - ev:11
