canonical_text:
  quote: "“Heaven has no (partial) affection; — only to those who are reverent does
    it show affection.”"
  summary: 'I Yin prostrates himself and instructs the king to cultivate virtue, imitate
    the former king and grandfather, avoid idleness, practice filial piety in ancestral
    worship, respect ministers, and listen to moral instruction. He states that Heaven,
    the people, and the spirits respond only to reverence, benevolence, and sincerity,
    and that the Heaven-conferred royal seat brings difficulty: virtue leads to good
    government and prosperity, while disorderly conduct leads to ruin. The former
    king is presented as an exemplary ruler and as the fellow of God; the present
    king has inherited his line. The passage ends at the beginning of an unfinished
    comparison about ascending.'
  language: English
  quote_policy: quoted
