canonical_text:
  quote: ''
  summary: The passage presents editorial notes and two Shang sacrificial ode sections.
    One ode is framed as appropriate to sacrifice in the Shang ancestral temple and
    as honoring King Wu-ting; it traces Shang origins to a Heaven-commissioned swallow,
    Hsieh as the father of Shang, God's appointment of Thang, and ritual attendance
    by princes from the four seas. The following ode celebrates Hsieh, Hsiang-thu,
    Thang, and I-yin; it recalls Yu's ordering of the deluge, God's founding of Shang
    through Hsieh, Hsieh's effective rule, Hsiang-thu's acknowledged authority, and
    Thang's wisdom, reverence, and divine appointment as a model for the nine regions.
  language: English
  quote_policy: summarized
