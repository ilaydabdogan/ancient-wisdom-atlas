canonical_text:
  quote: ''
  summary: The passage describes Shun’s virtues, his appointment by the Ti to succeed
    Yao, his receipt of duties in an ancestral temple, his calendrical and ritual
    ordering, his sacrifices to divine and spiritual recipients, his inspection tours
    to the four directions, his standardization of ceremonies and measures, his division
    of the land, his penal regulations, and his punishment of four offenders, after
    which justice is acknowledged under heaven.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ti Shun is described as profound, wise, accomplished, intelligent, mild, courteous,
    sincere, and mysteriously virtuous, and he is appointed to office.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shun promotes the five cardinal duties, arranges official departments in proper
    seasons, receives princes from the four quarters, and does not go astray amid
    wind, thunder, and rain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ti tells Shun to ascend the seat of the Ti; Shun wishes to decline in
    favor of someone more virtuous, but receives Yao’s retirement in the temple of
    the Accomplished Ancestor.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Shun examines a pearl-adorned turning sphere with a transverse jade tube and
    brings the Seven Directors into harmony.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Shun sacrifices to God, the Six Honoured Ones, the hills and rivers, and the
    host of spirits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Shun calls in five jade symbols of rank, gives audiences, and returns the
    rank symbols to the princes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Shun makes inspection tours east, south, west, and north, reaches named directional
    mountains, offers to Heaven and to hills and rivers, and regulates seasons, months,
    days, measures, and ceremonies.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: After the directional tours, Shun returns to the capital, goes to the temple
    of the Cultivated Ancestor, and sacrifices a single bull.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In a five-year cycle, one tour of inspection and four court appearances of
    princes occur; their words are tested by works, and chariots and robes are given
    according to merit.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Shun divides the land into twelve provinces, raises altars upon twelve hills,
    and deepens the rivers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Shun displays statutory punishments, allows banishment as mitigation, prescribes
    whip and stick punishments, permits redemption by money for certain offenses,
    pardons inadvertent or unfortunate offenses, and applies death to repeated presumptuous
    transgression while exhorting himself to reverence and compassion.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Shun banishes or confines four offenders or offender groups, after which all
    under heaven acknowledge the justice of his administration.
  category: sequence
  evidence_refs:
  - ev:10
