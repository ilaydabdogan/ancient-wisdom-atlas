  summary: The passage introduces the Odes of Thang as connected with the state printed
    as 3in and gives an account of royal investiture. It then presents an ode in which
    men called to war by the king lament that they cannot farm or support their parents
    and appeal to Heaven for return. A second ode presents a wife mourning her dead
    husband, dwelling alone, recalling domestic objects, and declaring that after
    long years she will go to his abode or chamber, which the editorial note identifies
    with his grave.
