canonical_text:
  quote: ''
  summary: A royal instruction urges Kiin-Msin to continue the duke of A'au's lessons,
    govern through bright virtue rather than ease or oppression, consult the people,
    credit the sovereign, moderate punishments, advance the good, and transform the
    people through reverent observance of statutes.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The duke of A'au is described as having formerly acted as teacher and guardian
    of the myriads of the people, who remember his virtue.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressee is told to enter upon the duke's charge, follow his regular
    ways, illustrate his lessons, and thereby regulate the people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A saying attributed to the duke states that perfect government has a piercing
    fragrance influencing spiritual intelligences, and that this fragrance is bright
    virtue rather than millet.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The addressee is told to make the duke's lesson his rule, be diligent day
    by day, and not indulge in luxurious ease.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ordinary men are described as desiring to see a sage before seeing one, but
    still being unable to follow him after seeing him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The addressee is compared to wind, and the inferior people are compared to
    grass.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: In planning government, the addressee is told to acknowledge difficulty, abolish
    some things, enact new things, consult the people, and then use his own reflection
    after general agreement.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Good plans or counsels are to be laid before the sovereign in the palace and
    later attributed to the sovereign when acted upon abroad.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The king addresses Kiin-Msin and tells him to develop the duke's lessons fully,
    not to use power for oppression, and not to use laws for extortion.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The king prescribes gentleness with strict rule and harmony promoted through
    easy forbearance.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: For punishments among the people of Yin, Kiin-Msin is told not simply to punish
    or spare because the king says so, but to seek the due middle course.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Disobedient people uninfluenced by government and instruction are to be punished,
    with the stated end of punishment being to make an end of punishing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: 'Three classes are not to be spared even for small particular offences: those
    inured to villainy and treachery, those violating regular social duties, and those
    introducing disorder into public manners.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: The addressee is told not to cherish anger against the obstinate, to avoid
    demanding every quality in one person, to practice patience and forbearance, and
    to distinguish those who discharge duties well from those who do not.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The good are to be advanced so that others may follow their example.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The people are described as born good but changed by external things, and
    as able to be changed toward virtue through reverent observance of statutes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: If the people advance to excellence, the king says he will receive much happiness
    and Kiin-Msin's services will be famous for a long time.
  category: sequence
  evidence_refs:
  - ev:9
