canonical_text:
  quote: ''
  summary: The passage praises a ruler who receives rank-tokens and tribute from small
    and large states, receives Heaven's blessing and favour, spreads instructions
    gently, and unites dignities and riches in himself. A martial king displays a
    banner and axe and is compared to an unrepressible fire. Thang secures the nine
    regions after action against Wei, Ku, A'un-wu, and A'ieh of Hsia. A note explains
    the image of a root and three shoots as A'ieh and his helpers. In a former time
    of peril, Heaven treats the ruler as a son and sends the high minister A-hang
    to assist the king of Shang. The passage ends with the heading of the next ode.
  language: English
