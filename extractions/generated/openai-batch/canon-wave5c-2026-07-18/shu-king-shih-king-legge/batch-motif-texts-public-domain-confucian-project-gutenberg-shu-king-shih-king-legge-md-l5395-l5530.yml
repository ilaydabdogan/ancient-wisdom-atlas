canonical_text:
  quote: ''
  summary: The passage concludes a royal charge to Yueh by describing how a worthy
    minister forms and supports a sage king, with Pao-hang/A-hang given as an earlier
    model. Yueh accepts the charge. The next section describes a supplementary sacrifice
    connected with Kao Zong/Wu-ting, the appearance of a crowing pheasant, and 3u
    Ki's admonition that the king must be corrected, care for the people, and avoid
    excessive sacrifices to his father. The final section introduces the Chief of
    the West's conquest of Li and 3u I's warning that Heaven is bringing the Yin dynasty
    to an end because of the king's conduct; the king appeals to Heaven's appointment,
    but 3u I says his crimes are registered above and Yin will soon perish.
  language: English translation
  quote_policy: summarized
