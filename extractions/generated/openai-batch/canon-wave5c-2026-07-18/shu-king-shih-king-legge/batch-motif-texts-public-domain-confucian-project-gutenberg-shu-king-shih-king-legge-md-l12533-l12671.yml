  summary: The passage gives an account of the preservation and partial loss of Shang
    sacrificial odes, then presents two odes used in sacrifice to Thang, founder of
    the Shang dynasty. The odes emphasize music, ritual reverence, offerings of spirits
    and soups, assisting visitors and princes, seasonal sacrifices, ancestral presence,
    and blessings such as longevity, abundance, happiness, and Heaven-sent prosperity.
