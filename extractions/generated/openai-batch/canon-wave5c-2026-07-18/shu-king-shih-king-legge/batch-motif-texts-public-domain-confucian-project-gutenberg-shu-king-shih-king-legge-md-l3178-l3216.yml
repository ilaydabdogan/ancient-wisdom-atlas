  quote: ''
  summary: The passage reports meritorious officials and the Miao people's refusal
    of service, then has the Ti praise orderly services and Kao-yao's punishments.
    Khwei describes a ritual music service in which instruments accompany singing,
    the Ti's progenitors come, a guest is in place, princes yield to one another,
    animals move or dance, paired phoenixes appear, and official chiefs become harmonious.
  language: English
