  quote: ''
  summary: The passage is an introductory scholarly discussion of early Shu documents.
    It argues that some Yao and Yu materials are later compilations and that accounts
    of Yao and Shun have a legendary character. It summarizes a succession story in
    which Yao seeks a worthy successor, Shun is recommended for his filial conduct,
    Yao tests Shun through marriage to his two daughters, and Shun later assumes rule.
    The passage also discusses evidence for ancient source materials, including archaic
    official titles and astronomical directions concerning equinoxes, solstices, and
    culminating stars.
