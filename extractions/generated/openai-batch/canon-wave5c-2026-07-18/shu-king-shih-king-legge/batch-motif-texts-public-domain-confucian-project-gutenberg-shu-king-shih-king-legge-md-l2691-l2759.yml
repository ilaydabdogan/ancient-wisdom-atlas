canonical_text:
  quote: ''
  summary: The passage presents a ruler, the Ti, praising completed administrative
    order, asking Yu to take leadership because of the Ti's age and weariness, and
    hearing Yu recommend Kao-yao instead. The Ti praises Kao-yao's judicial administration,
    Kao-yao praises the Ti's clemency and life-loving virtue, and the Ti then recalls
    Yu's successful service against inundating waters and commends his humility and
    public toil.
