canonical_text:
  quote: ''
  summary: A king gives a charge about diligence, punishments, and judicial procedure.
    He tells his kin and territorial rulers to handle punishments reverently, to accord
    with Heaven, to select proper men, to hear both parties, to guard against corrupt
    influences, to forbear punishment or fines in doubtful cases, and to adjust punishments
    and redemption-fines according to the seriousness and circumstances of offences.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king addresses his uncles, brethren, cousins, sons, and grandsons, asking
    them to listen to an important charge and to be daily diligent.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king states that Heaven allows punishments for regulating the people and
    tells the audience to deal with cases so as to accord with the mind of Heaven.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king tells the audience not to put people to death or spare them merely
    because he would do so.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The audience is instructed to apportion the five punishments so as to exhibit
    the three virtues, with the expected result that the king will have felicity and
    the people will rely on them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king addresses rulers of states and territories and asks them to consider
    the selection of proper men, the reverent handling of punishments, and careful
    calculation of whom punishments will reach.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: When both parties are present with documents and witnesses, judges are to
    listen to the fivefold statements and then fit the case to punishments, redemption-fines,
    or cases of error.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The passage names five evils to guard against in cases of error: influence
    of power, private grudge, female solicitation, bribes, and applications.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king says that doubtful infliction of any of the five punishments or five
    fines should be forborne.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The judges are told to examine carefully, study the appearance of the parties
    when many things are clear, stop hearing a case if examination reveals nothing,
    and stand in awe of Heaven's dread majesty.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage lists redemption-fines in copper for cases that would otherwise
    involve branding, cutting off the nose, cutting off the feet, castration, or death.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage gives counts of redeemable crimes for the five punishments, totaling
    3000 crimes.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Unspecified offences are to be classed with higher or lower offences, obsolete
    laws are not to be used, and punishments or fines are to be adjusted for mitigating
