canonical_text:
  quote: ''
  summary: A duke instructs a young king about avoiding partiality, governing officers,
    regulating offerings, reverence, and public order. The king praises the duke as
    his guide, asks him to remain at Lo while the king returns to Aau, and charges
    him to preserve the people and settle ceremonial order. The duke accepts with
    formal obeisance, promises to protect the people received through Heaven's decree,
    urges the king to inspect the settlement and honour statutes and worthy men, and
    declares that government from the central spot will bring repose to the states.
  language: English
  quote_policy: summarized
