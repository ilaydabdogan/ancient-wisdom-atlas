- id: obs:1
  text: The speaker warns the young son not to indulge partiality and compares its
    later consequence to a spark that becomes an inextinguishable fire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker tells the young son to take officers from Aau to the new city
    and have them join their former associates while establishing merit and completing
    public manners.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The duke tells the young king that reverence will let him know which princes
    sincerely present offerings and which do not.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The duke states that offerings require proper observances and service of the
    will; otherwise the people may neglect offerings and affairs may be disturbed
    by errors and usurpations.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The duke instructs the young son to follow his example and says that he himself
    will study husbandry while the young son rules the people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king calls the duke the enlightener and sustainer of his youth and says
    the duke has set forth virtues so the king may display merit like Wan and Wu and
    respond to Heaven's decree.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The king says the duke's virtue shines above, beneath, and through the four
    quarters, and says his own task is to attend reverently to sacrifices early and
    late.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king charges the duke to remain at Lo while he returns to his sovereignty
    in Aau because honoured ceremonies are not yet settled and the duke's service
    is not complete.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The king says the duke's remaining will set an example for the officers, preserve
    the people received by Wan and Wu, and help the whole kingdom.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The king asks the duke not to interrupt the example he has provided and says
    that the kingdom will enjoy the benefit of the duke's virtue for generations.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The duke of Aau performs obeisance with his hands to his head and his head
    to the ground, accepts the king's charge, and promises to protect the people received
    by the king's ancestors through Heaven's decree.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The duke asks the king to come frequently to inspect the settlement and to
    honour old statutes and the good and wise men of Yin.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The duke says good government at the settlement will make the king the new
    sovereign of the kingdom and an example of royal respectfulness to successors
    of Aau.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The duke says government from the central spot will conduct all the states
    to repose and complete the king's merit.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Tan says that he and the numerous officers and managers of affairs will consolidate
