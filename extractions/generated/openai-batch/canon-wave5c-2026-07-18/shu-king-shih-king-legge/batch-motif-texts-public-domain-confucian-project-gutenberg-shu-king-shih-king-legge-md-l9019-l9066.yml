canonical_text:
  quote: ''
  summary: A king addresses Hu, acknowledges his departure from his father's conduct,
    and appoints him marquis in the east. The king commands him to be reverent, loyal,
    filial, to follow King Wan, and to avoid his father's disobedience. The speech
    teaches that Heaven aids only the virtuous and that people cherish the kind; goodness
    leads to order and evil to disorder. Hu is charged to think of the end from the
    beginning, seek harmony, protect the royal House, help the lower people, follow
    the Mean, preserve old statutes, heed what he sees and hears, and not neglect
    the king's charge.
  language: English
  quote_policy: summarized
