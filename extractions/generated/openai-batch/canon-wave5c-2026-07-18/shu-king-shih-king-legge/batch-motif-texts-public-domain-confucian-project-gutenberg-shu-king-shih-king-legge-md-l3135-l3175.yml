canonical_text:
  quote: ''
  summary: 'Yii addresses Ti with counsel on making royal virtue visible throughout
    the realm, attracting worthy ministers, appointing and rewarding them according
    to merit, and avoiding the haughty example of Kn of Tan. Yii then gives his own
    conduct as a warning-informed example: he left domestic life quickly after marriage,
    did not attend to his crying son Khi, and continued his work on the land, the
    five Tenures, and provincial Tutors.'
  language: English
  quote_policy: summarized
