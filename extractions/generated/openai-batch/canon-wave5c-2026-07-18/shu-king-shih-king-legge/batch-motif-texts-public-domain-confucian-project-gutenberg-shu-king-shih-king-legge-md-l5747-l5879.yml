  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Shau is accused of cutting through the leg-bones of people wading in the morning
    and cutting out the heart of a worthy man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Shau is accused of killing and murdering, honoring bad men, dismissing instructors
    and guardians, discarding statutes and penal laws, imprisoning an upright officer,
    neglecting sacrifices to heaven and earth, discontinuing ancestral offerings,
    and making extraordinary devices to please his wife.
  category: action
  evidence_refs:
