  text: Shau, king of Shang, is described as pursuing a lawless way, driving away
    aged elders, associating with wicked men, and having ministers who imitate him
    and contend against one another.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The innocent are said to cry to Heaven, and the condition of the state is
    said to be perceived on high.
  category: relationship
