  text: Heaven is said to love the people, and the sovereign is said to be responsible
    for reverently carrying out Heaven's mind.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A former sovereign of Hsia is described as failing to follow Heaven, after
    which Heaven aided Thang the Successful and charged him to end Hsia's appointment.
  category: sequence
  evidence_refs:
  - ev:2
