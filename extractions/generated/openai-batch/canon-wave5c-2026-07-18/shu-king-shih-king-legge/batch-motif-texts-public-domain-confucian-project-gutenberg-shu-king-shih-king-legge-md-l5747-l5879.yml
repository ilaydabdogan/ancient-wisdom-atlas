canonical_text:
  quote: ''
  summary: A royal speaker denounces Shau, king of Shang, as lawless, cruel, impious,
    and alienated from Heaven and the people. The speech compares Shau with the former
    ruler of Hsia, says Heaven aided Thang against Hsia, reports confirming dreams
    and divinations, rallies united ministers and hosts to punish Shau, and attributes
    possible victory to the virtue of the speaker's deceased father Wan.
  language: English
  quote_policy: summarized
