canonical_text:
  quote: ''
  summary: A prefatory note frames a conversation in the year when Shang perished.
    The Count of Wei, distressed by the impending ruin of Yin/Shang, consults the
    Grand-Master and Junior-Master. He describes the kingdom as unable to rule, corrupted
    by indulgence, lawlessness, and violence, and compares it to a person crossing
    a stream without ford or bank. The Grand-Master replies that Heaven is angrily
    sending calamities, that the king lacks reverence, that sacrificial victims are
    stolen and eaten without punishment, and that harsh exactions have left multitudes
    starving. He advises the Count to go away while declaring that he himself will
    remain and share Shang's ruin.
  language: English
  quote_policy: summarized
