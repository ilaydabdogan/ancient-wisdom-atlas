canonical_text:
  quote: let me Tan be a substitute for his person
  summary: The excerpt introduces the metal-bound coffer and recounts how, during
    King Wu's severe illness, the duke of A'au/^au, Tan, performs an altar rite, addresses
    three ancestral kings, prays to be accepted as a substitute for the king, consults
    tortoise-shell divination, and deposits the written prayer in the coffer. The
    king improves the next day. The introductory synopsis adds that, after later rumours
    against the duke, the coffer is opened, the prayer is found, and the young king
    recognizes the duke's devotion.
  language: English
  quote_policy: quoted
