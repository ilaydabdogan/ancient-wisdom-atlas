canonical_text:
  quote: ''
  summary: 'The passage gives prescriptive counsel on governing: the sovereign should
    recognize able and virtuous people, protect vulnerable people, avoid partiality,
    cultivate officials, and distinguish virtuous from non-virtuous recipients of
    favor. A poetic section describes the royal way as straight, level, broad, and
    free from deflection or selfish preference. The royal perfection is called a lesson
    of God, and the people are said to regard the Son of Heaven as their parent and
    universal sovereign. The passage then defines three forms of rule, reserves dignities,
    rewards, majesty, and revenues to the sovereign, and describes divination by tortoise-shell
    and plant stalks for resolving doubts, with appointed officers and interpreters.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People with ability to plan and act who keep themselves from evil are to be
    kept in mind, while those who are not fully excellent but avoid evil are to be
    received.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People whose countenances show placid satisfaction and who say their love
    is fixed on virtue are to receive favors and are said to advance toward the sovereign's
    perfection.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sovereign is instructed not to oppress the friendless and childless and
    not to fear the high and distinguished.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men in office with ability and administrative power are to cultivate their
    conduct, and this is linked with the country's prosperity.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that lack of desired family provision can lead people to
    crime, and that favoring those without love of virtue can involve the ruler in
    employing evil people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The royal righteousness, way, and path are described as free from deflection,
    unevenness, selfish liking, selfish disliking, partiality, perversity, and one-sidedness.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The royal way is described as broad and long, level and easy, correct and
    straight, and oriented toward perfect excellence.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The amplification of royal perfection is called an unchanging rule, the great
    lesson, and the lesson of God; the people instructed in it are said to approximate
    the glory of the Son of Heaven.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The people are said to call the Son of Heaven the parent of the people and
    the sovereign of all under the sky.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The three virtues or modes of rule are correctness and straightforwardness,
    strong rule, and mild rule, each applied to different political conditions and
    temperaments.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Only the sovereign is said to confer dignities and rewards, display the terrors
    of majesty, and receive revenues; ministers doing these things are said to injure
    clans and states and lead people into excesses.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Officers are appointed for divination by tortoise-shell and Achillea stalks
    in order to examine doubts, using seven indications, five from the shell and two
    from the stalks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Three men interpret the divination indications, and the agreeing words of
    two of them are to be followed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A translator note describes the tortoise and Khî plant as intelligent or spiritual
    things used in questioning spiritual beings; it also describes fire applied to
    the shell and repeated manipulation of stalks.
  category: other
  evidence_refs:
  - ev:8
