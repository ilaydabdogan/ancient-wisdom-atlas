canonical_text:
  quote: ''
  summary: The passage introduces the Announcement concerning Lo, describes the founding
    of the new city of Lo, reports the duke of A'au's divinations and map sent to
    the king, records the king's reverent response to Heaven's favour and auspicious
    divinations, and begins instructions for sacrifices and orderly inauguration in
    the new city.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The new capital Lo is presented as the central subject of the book, including
    its building arrangements, government, sacrifices, proclamation, and the duke's
    continued administration there.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the third month, as the moon began to wane, the duke of A'au began the
    foundations and construction of the new great city of Lo for the eastern states.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: People from every quarter assembled in harmony, and officers from several
    domains encouraged the people and introduced them to the work to be done for A'au.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The duke performed obeisance and reported the execution of his commission
    to the king, whom he calls his son and intelligent sovereign.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The duke says the king seemed unwilling to presume to be present at Heaven's
    founding and fixing of the dynastic appointment.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The duke followed the Grand-Guardian and surveyed the eastern region, seeking
    a place where the king should become the intelligent sovereign of the people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The duke used shell divination concerning several localities near named waters,
    and the ground near Lo was indicated.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The duke sent a messenger with a map and the results of the divinations.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The king performed obeisance and answered that the duke reverently acknowledged
    Heaven's favour and surveyed the locality where A'au could respond to that favour.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The king describes the divinations as favourable and always auspicious and
    says he and the duke must together sustain the responsibility.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The king says the duke has made provision for him and his successors for myriads
    and tens of myriads of years, so they may reverently acknowledge Heaven's favour
    there.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The duke instructs that the king first use the ceremonies of Yin and sacrifice
    in the new city in an orderly but not ostentatious way.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The duke says he will marshal the officers to attend the king from A'au, and
    he instructs the king to give the most meritorious ministers first place in the
    sacrifices and request sincere assistance.
  category: action
  evidence_refs:
  - ev:12
