canonical_text:
  quote: When a fire is blazing in the flames so that it cannot be approached, can
    it still be beaten out?
  summary: A royal speaker admonishes the addressed group about selfish speech and
    resistance to an intended removal. He warns that disorder may become uncontrollable,
    appeals to ancient sayings and ancestral precedent, describes sacrifices in which
    predecessors and forefathers are present, and commands effort toward a new city
    under impartial reward, punishment, and lawful speech.
  language: English
  quote_policy: quoted
