canonical_text:
  quote: ''
  summary: A prefatory note and speech describe King A^ung Khang commissioning the
    marquis of Yin to punish the astronomer-ministers Hsi and Ho, who neglected their
    offices, drank in their private cities, failed to observe a solar eclipse, and
    thereby incurred a death penalty established by former kings. The marquis exhorts
    his hosts to execute the punishment appointed by Heaven, invokes royal and heavenly
    authority, and says he will punish only the chief criminals while allowing coerced
    or morally stained followers to renew themselves.
  language: English
  quote_policy: summarized
