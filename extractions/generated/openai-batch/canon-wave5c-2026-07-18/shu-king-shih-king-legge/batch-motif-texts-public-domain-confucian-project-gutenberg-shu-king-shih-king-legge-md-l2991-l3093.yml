canonical_text:
  quote: ''
  summary: The passage links Heaven’s hearing, seeing, approval, and terrors with
    the people’s responses; records Kao-yao and Yu discussing practicable counsel;
    introduces Book IV; and presents Yu’s account of controlling overwhelming waters,
    securing food, and bringing regions under rule. Yu then counsels the Ti on stable
    rule, upright assistants, and Heaven’s renewed appointment, after which the Ti
    describes ministers as his bodily agents and lists ancient garment emblems.
  language: English
  quote_policy: summarized
