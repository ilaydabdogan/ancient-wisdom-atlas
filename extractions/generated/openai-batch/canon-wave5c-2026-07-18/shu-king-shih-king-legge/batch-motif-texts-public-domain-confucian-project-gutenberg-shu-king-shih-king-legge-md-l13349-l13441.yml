canonical_text:
  quote: ''
  summary: The passage includes a thanksgiving ode for a plentiful year, describing
    abundant millet and rice, full granaries, ritual drink, offerings to forefathers,
    and blessings sent down. It then presents an ode about blind court musicians and
    completed instruments performing in an ancestral temple, where ancestors give
    ear and visitors witness the performance. A third ode concerns winter and spring
    fish offerings in the ancestral temple, with the king presenting early-caught
    fish to ancestors in acknowledgment of food supplied from the waters.
  language: English
  quote_policy: summarized
