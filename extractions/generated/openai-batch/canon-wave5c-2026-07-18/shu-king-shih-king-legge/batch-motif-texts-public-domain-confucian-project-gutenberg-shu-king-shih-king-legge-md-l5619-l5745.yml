canonical_text:
  quote: ''
  summary: Introductory notes identify the Great Declaration as speeches by King Wu
    against the Shang ruler Shau-hsin. In Section 1, King Wu addresses allied hereditary
    rulers and officers at Mang-ching, accuses Shau of impiety, cruelty, and oppression,
    and presents his campaign as obedience to Heaven's command and as punishment appointed
    by Heaven. The passage closes with the beginning of Section 2, where the king
    halts north of the Ho, reviews assembled hosts, and begins another declaration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The editorial framing says King Wu made three speeches to officers and men
    against Shau-hsin, setting forth reasons for the enterprise and urging exertion
    in the cause of humanity and Heaven.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the spring of the thirteenth year, a great assembly is held at Mang-ching,
    where the king tells hereditary rulers and officers to listen to his declaration.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king states that Heaven and earth are the parent of all creatures, that
    man is the most highly endowed creature, and that the great sovereign is the parent
    of the people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king accuses Shau, king of Shang, of not reverencing Heaven, inflicting
    calamities on the people, drunkenness, lust, cruel oppression, collective punishment
    of relatives, hereditary appointments, extravagant building, and burning, roasting,
    and ripping up victims.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king says Great Heaven was moved with indignation and charged his deceased
    father Wan to display its terrors, but Wan died before the work was completed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The king says Shau does not serve God or the spirits of heaven and earth,
    neglects the ancestral temple and sacrifice, lets sacrificial victims and millet
    vessels become prey of robbers, and still claims the people and the heavenly appointment
    as his own.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The king says Heaven made rulers and instructors for the help of the people,
    so they could aid God and secure tranquillity in the four quarters of the kingdom.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The king contrasts Shau's many officers with many minds against his own three
    thousand officers with one mind, says Shang's iniquity is full, and says Heaven
    commands its destruction.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The king says he received the command of his deceased father Wan, offered
    special sacrifice to God, performed services to the great earth, and leads the
    multitude to execute the punishment appointed by Heaven.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The king says Heaven compassionates the people, that Heaven gives effect to
    what the people desire, and asks the others to aid him in cleansing all within
    the four seas.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: At the start of Section 2, on the day Wu-wu, the king halts north of the Ho,
    reviews the assembled hosts, and begins another declaration to the multitudes
    of the west.
  category: sequence
  evidence_refs:
  - ev:10
