canonical_text:
  quote: ''
  summary: After the conquest of Shang, the western tribe of Lii sends hounds as tribute
    to the king. The Grand-Guardian responds with an instruction warning the king
    that virtuous rulers attract submission and tribute through virtue, distribute
    useful goods to reinforce duty and attachment, avoid sensual bondage and trifling
    pleasures, and should not value strange foreign animals or objects over useful
    things and real worth. The instruction ends with a warning that neglect of small
    actions can harm great virtue, using the image of a mound unfinished for lack
    of one basket of earth, and promises stability and dynastic succession if the
    king follows the counsel.
  language: English
  quote_policy: summarized
