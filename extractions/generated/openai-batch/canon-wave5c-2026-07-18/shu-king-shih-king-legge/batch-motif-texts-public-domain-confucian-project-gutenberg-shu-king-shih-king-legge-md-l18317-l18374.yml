canonical_text:
  quote: ''
  summary: Historical preface to the Odes of Khm/Qin, followed by the opening stanza
    of a lament for three worthies buried in the same grave with Duke Mu. The stanza
    uses yellow birds resting in jujube trees, names 3ze-/('u Yen-hsi as one who followed
    Duke Mu into the grave, describes his fear, invokes azure Heaven, and says that
    a hundred ordinary men would have been given to redeem him.
  language: English
