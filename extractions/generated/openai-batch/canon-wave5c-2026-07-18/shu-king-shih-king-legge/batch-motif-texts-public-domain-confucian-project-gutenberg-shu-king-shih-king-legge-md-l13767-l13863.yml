canonical_text:
  quote: ''
  summary: The passage describes people bringing millet provisions, field workers
    clearing weeds, millet growing and being harvested, grain filling the hundred
    houses, and families resting. It then describes killing a black-muzzled tawny
    bull to transmit ancestral observances. A following ode concerns preparations
    and order at a feast after sacrifice, including an official inspecting animals,
    tripods, and a rhinoceros-horn goblet. The passage also includes an ode praising
    King Wu, his restrained martial action, his inherited accomplishment, and the
    duty to imitate his course.
  language: English
  quote_policy: summarized
