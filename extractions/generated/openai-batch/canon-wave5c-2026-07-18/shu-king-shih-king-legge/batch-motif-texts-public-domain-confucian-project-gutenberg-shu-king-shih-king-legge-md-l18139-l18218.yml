canonical_text:
  quote: ''
  summary: The passage includes notes on Fu-kwan and a disputed use of divination
    in a seduction context; an introduction to the Royal Domain odes and the movement
    from earlier Zhou capitals to the eastern capital; an ode in which an officer
    laments the desolation of the old capital amid millet and cries to Heaven; and
    an ode in which a lady says fear of a severe officer prevents her from going to
    her lover, then swears sincerity by the bright sun and imagines sharing a grave
    after death.
  language: English
