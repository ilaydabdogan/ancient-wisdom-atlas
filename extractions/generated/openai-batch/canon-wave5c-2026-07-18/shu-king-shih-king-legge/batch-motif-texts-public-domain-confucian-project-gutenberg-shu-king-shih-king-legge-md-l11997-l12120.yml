canonical_text:
  quote: ''
  summary: Introductory prose discusses how the Shih may have been collected, comparing
    European views about ballads as indicators of public disposition with a Chinese
    scholarly theory that rulers collected poems from states to assess government.
    It cites the Record of Rites on the Son of Heaven’s periodic progress and the
    Grand Music-Master presenting state poems, then evaluates the historical reliability
    of that account and tentatively reconstructs a Zhou/Kau system of collection through
    royal progresses, music officials, and court archives.
  language: English
