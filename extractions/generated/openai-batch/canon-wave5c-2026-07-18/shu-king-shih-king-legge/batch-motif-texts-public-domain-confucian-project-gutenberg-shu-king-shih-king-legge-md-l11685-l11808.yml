canonical_text:
  quote: ''
  summary: The passage argues that the Shih, or Book of Poetry, already existed in
    substantially recognizable form before Confucius. It cites early collections,
    a 544 B.C. performance of odes at Lu for a Wu envoy, sayings in the Analects,
    and later testimony. It limits Confucius' role to possible copying, musical reform,
    ordering of Ya and Sung pieces, and especially encouraging preservation and study
    through his authority and teaching.
  language: English
  quote_policy: summarized
