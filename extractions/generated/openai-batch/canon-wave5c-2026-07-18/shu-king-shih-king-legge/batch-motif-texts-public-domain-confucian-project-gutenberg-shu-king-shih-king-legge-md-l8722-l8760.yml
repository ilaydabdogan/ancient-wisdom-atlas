canonical_text:
  quote: ''
  summary: The Duke of A'au warns a newly succeeded king by contrasting Shau of Yin's
    drunken error with ancient rulers and ministers who accepted admonition, practiced
    knowledge, and corrected faults. He says refusal to listen will disorder former
    laws, encourage deceptive speech, lead to unjust punishment, and cause the people
    to murmur, rebel inwardly, and curse the ruler.
  language: English
  quote_policy: summarized
