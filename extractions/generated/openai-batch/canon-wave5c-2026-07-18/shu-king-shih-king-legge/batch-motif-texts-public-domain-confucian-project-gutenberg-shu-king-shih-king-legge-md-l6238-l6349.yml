  summary: The passage enumerates divisions of the Great Plan, including the five
    elements, personal matters, government objects, dividers of time, and royal perfection.
    It lists elemental qualities and tastes, human faculties and virtues, governmental
    concerns, time-reckoning bodies and calculations, and a model in which the sovereign
    embodies excellence, diffuses happiness to the people, and receives preserved
    perfection back from them.
  language: English
