canonical_text:
  quote: ''
  summary: A scholarly discussion evaluates the authenticity of a Japanese copy of
    the Old Text of the Hsiao with a commentary attributed to Khung An-kwo. It recounts
    a preface story about bamboo tablets in ancient characters found in the wall of
    Confucius' old lecture hall, copied into current script, and placed in imperial
    custody, then raises chronological and textual objections and describes later
    Han-era comparison and revision of old and modern text copies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Catalogue Raisonne is said to describe a Japanese copy of the Old Text
    of the Hsiao with commentary attributed to Khung An-kwo, while its editors give
    reasons for doubting the work's genuineness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Japanese edition printed in 1732 in the Chinese portion of the British Museum
    is reported to contain both the commentary attributed to Khung An-kwo and a purported
    original preface by him.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The purported preface says bamboo tablets in 'tadpole characters' were found
    in a stone case in the wall of Confucius' old lecture hall and presented to the
    emperor by Khung 3ze-hui, described as a very old man of Lu.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The emperor is said to have ordered two copies made in current characters
    by great scholars; one copy was given to Sze-hui and another to General Ho Kwang,
    who placed it in the imperial archives, where it was guarded.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author states difficulties with attributing the preface to Khung An-kwo,
    including the preface's failure to mention him, the lack of the emperor's name,
    and chronological problems involving the discovery of the tablets and An-kwo's
    lifespan.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author rejects the Japanese preface and the commentary before which it
    stands; the Catalogue Raisonne editors are also quoted as calling the commentary
    shallow, poor, and unlike the style of Han scholars.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The passage says that in the first century B.C. two copies of the Hsiao King
    were in the Imperial Library of Han and were catalogued by Liu Hin.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage presents a conditional claim that, if the catalogued copies were
    the actual presented text and a faithful Han-character transcript of the ancient
    text from the lecture-hall wall, the evidence for recovery of the Hsiao would
    be highly satisfactory, but it adds that considerations prevent such reliance.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: According to the records of Sui as summarized here, Liu Hsiang was charged
    by the emperor to compare the old text with an earlier recovered text, and he
    removed excessive and erroneous material from the modern text and fixed the number
    of chapters at eighteen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note by Yen Sze-ku appended to Liu Hin's Catalogue reports that some chapters
    of the modern text were divided differently in the old text and that the old text
    had one chapter absent from the other.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The copies catalogued by Liu Hin are said to have been made after Liu Hsiang's
    examination and revision, leaving the received texts second hand and making it
    impossible to know fully what liberties Hsiang took.
  category: sequence
  evidence_refs:
  - ev:7
