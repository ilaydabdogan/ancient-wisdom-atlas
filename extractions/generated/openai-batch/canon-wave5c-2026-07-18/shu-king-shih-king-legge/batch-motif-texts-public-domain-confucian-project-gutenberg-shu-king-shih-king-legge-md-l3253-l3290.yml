canonical_text:
  quote: ''
  summary: The passage introduces the Books of Hsia and Book I, The Tribute of Yii/Yij.
    It explains Hsia as the dynastic designation under which Yii and his descendants
    held the throne, reports the tradition that Yao appointed Yii earl of Hsia after
    his labours, and says the book’s account of Yii’s merit was the ground of his
    advancement to the throne. It defines “tribute” as revenue owed to a ruler and
    summarizes the book as describing Yii’s response to inundation, territorial divisions,
    soil quality, and revenue proportions, likening it to a kind of domesday book
    of ancient China.
  language: English
