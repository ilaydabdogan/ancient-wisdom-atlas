canonical_text:
  quote: ''
  summary: The passage introduces the religious odes of the Shih and summarizes ancestral
    worship as practiced by common people and especially in royal ceremonies. It describes
    fasting, purification, libations, animal sacrifice, food preparation, music, feasting,
    and the representation of dead ancestors by living relatives who receive honors,
    convey the ancestors' will, and pronounce blessings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fourth Part of the Shih is described as containing poems that are professedly
    religious, including Odes of the Temple and the Altar connected with ancestral
    worship.
  category: other
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Ancestral worship is described as binding on all social levels, with mourning
    and other duties to deceased parents not differentiated between noble and mean.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Filial duties are summarized as respect in ordinary intercourse, delight in
    supplying food, solicitude in illness, grief at death, and solemnity in sacrifice.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Royal ancestral ceremonies were preceded by fasting and purifications by the
    king and assisting parties.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A large gathering of feudal princes attended, the presence of former-dynasty
    representatives was important, and duties mainly fell on princes of the same surname
    as the royal House.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Libations of fragrant spirits were made to attract the Spirits, whose presence
    was invoked by a functionary stationed inside the principal gate.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The principal victim, a red bull in the temple of A'au, was killed by the
    king with a knife whose handle had small bells; its hair was exposed to verify
    color, and fat was burned with southernwood for fragrance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Other victims were numerous and were flayed, boiled, roasted, broiled, arranged
    on trays and stands, and set forth while palace ladies assisted, music sounded,
    and the cup circulated.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ceremonies are described as both feast and sacrifice, seasonal family
    reunions in which the dead and living met, the living worshipped the dead, and
    the dead blessed the living.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Departed ancestors were represented by living relatives of the same surname,
    who temporarily took the place of the dead and were supposed to be possessed by
    their spirits.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The personators ate and drank as the ancestors would have done, accepted homage,
    communicated the ancestors' will, and pronounced benediction with the help of
    a mediating priest.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: On the next day, after a summary repetition of the sacrifice, the personators
    of the dead were specially feasted; a cited allusion says a junior family member
    chosen as a personator was temporarily exalted above elders.
  category: sequence
  evidence_refs:
  - ev:7
