canonical_text:
  quote: ''
  summary: The king addresses the numerous officers of Yin, recalling that after coming
    from Yen he reduced penalties, spared lives, and relocated them under Heaven's
    appointed punishment so they could learn obedience near ministers. He states that
    he has built the great city at Lo as a central place for guests from the four
    quarters and as a place where the officers may serve. He promises continued dwellings,
    occupations, families, and prosperity if they reverently obey, but threatens loss
    of land and Heaven's inflictions if they do not.
