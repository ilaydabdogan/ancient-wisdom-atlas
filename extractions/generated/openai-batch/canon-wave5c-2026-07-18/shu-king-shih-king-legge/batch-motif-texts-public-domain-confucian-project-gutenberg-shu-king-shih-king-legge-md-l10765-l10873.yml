canonical_text:
  quote: ''
  summary: The passage combines editorial commentary and translated text. A minister
    explains that the statement that Chung and Li ended intercourse between heaven
    and earth means that appointed officers restored proper regulation between human
    duties and spirit worship, after disorder caused confusion and calamity. The translated
    royal instruction then describes a virtuous ruler hearing complaints against Miao,
    appointing ministers to order law, water, land, agriculture, and punishments,
    and admonishing judicial officers to imitate Po-i and avoid the corrupt example
    of Miao, whom God punished.
  language: English translation and commentary with romanized Chinese names
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king asks what it means that Chung and Li brought about no intercourse between
    heaven and earth, and asks whether people would otherwise have been able to ascend
    to heaven.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The minister replies that the statement does not mean literal ascent, and
    explains that ancient people left worship of spiritual beings and attempts to
    invoke their descent to appointed officers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When people attended to human duties and spirits to their own sphere, the
    result is described as regularity, tranquillity, and prosperity.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the time of Shao Hao, the lawlessness of A'iu-li is said to have led people
    to intrude into the functions of spirit regulators and to try to bring down spirits
    from above.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The spirits are described as appearing irregularly and disastrously when no
    longer kept in check and ruled.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Kwan Hsii appointed Chung, Minister of the South, over heavenly things and
    laws for spirits, and Li, Minister of Fire, over earthly things and rules for
    people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The appointments are said to have restored spirits and people to their former
    regular courses and ended improper interference between them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The great Ti carried inquiries among the people, and the solitary and widows
    laid complaints before him against the Miao.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The great Ti awed and enlightened the people by his virtue and charged three
    princely ministers to labour anxiously for the people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Po-i delivered statutes to prevent punishable conduct; Yu ordered water and
    land and named hills and rivers; Ki spread knowledge of agriculture and grain
    cultivation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Minister of Crime adapted punishment to each offence, taught reverence
    for virtue, and officers executed law against the powerful and wealthy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The king addresses those directing government and criminal cases as shepherds
    of Heaven, tells them to follow Po-i as a pattern, and warns them by the example
    of Miao.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The people of Miao are described as choosing violent and bribe-taking officers
    who oppressed the innocent, after which God sent calamity and their name was cut
    off from the world.
  category: sequence
  evidence_refs:
  - ev:8
