canonical_text:
  quote: ''
  summary: The king recounts the drunken excesses and moral failure of the last ruler
    of Yin/Shang, saying that resentment and drunkenness rose to Heaven and Heaven
    sent ruin on Yin. He tells Fang to use Yin's loss of appointment as a warning
    example, to admonish officials, to keep himself from drink, and to punish or instruct
    those addicted to communal drinking.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The last successor of the former kings is described as addicted to drink,
    devoted to conduct that provoked resentment, and abandoned to lewdness and dissipation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people are described as sorely grieved and wounded in heart while the
    ruler continued drinking without restraint until his mind was frenzied.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ruler's crimes are said to have accumulated in the capital of Shang while
    the dynasty's extinction was imminent.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ruler is said not to have caused sacrifices of fragrant virtue to ascend
    to Heaven.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The people's resentments and the drunkenness of the ruler's creatures are
    said to have gone up on high, after which Heaven sent ruin on Yin and showed it
    no love.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speech states that Heaven's action is not cruel oppression, because people
    accelerate their own guilt and punishment.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king cites an ancient saying that people should not look into water but
    into the glass of other people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king says Yin has lost its appointment and asks whether it should be used
    as a glass for learning how to secure repose in the present time.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Fang is commanded to warn ministers, domain princes, recorders, heads of houses,
    and key ministers, and especially to keep himself from drink.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Companies that drink together are to be apprehended and sent to Zhou, where
    the king may put them to death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Yin ministers and officers already led into drink are to be taught for a time;
    obedience brings bright distinction, while disregard of the lessons leads to being
    classed with those to be put to death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The king warns Fang that if officers are not rightly managed, the people will
    continue lost in drunkenness.
  category: speech
  evidence_refs:
  - ev:7
