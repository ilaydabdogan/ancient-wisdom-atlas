canonical_text:
  quote: ''
  summary: Introductory material and the opening of the Canon of Yao describe Yao's
    character and government, his appointment of calendar officials to observe heavenly
    bodies and regulate the seasons, the four seasonal stations assigned to Hsi and
    Ho brothers, the use of an intercalary month to complete the year, and the beginning
    of a search for a suitable man to employ while rejecting Yao's heir-son as morally
    unfit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies Part I as the Book of Thang and the single Book within
    it as the Canon of Yao, with Yao as its subject.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yao, styled Fang-hsun, is described as reverential, intelligent, accomplished,
    thoughtful, courteous, and complaisant, with influence extending through the four
    quarters and to heaven and earth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yao distinguishes able and virtuous persons, harmonizes his kindred, regulates
    the people, unites the myriad states, and produces universal concord.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yao commands the Hsis and Hos to observe the heavens, calculate the sun, moon,
    stars, and zodiacal spaces, and deliver the seasons to the people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The second brother Hsi is assigned to Yü-i in the Bright Valley to receive
    the rising sun and arrange the labours of spring, using medium day length and
    the star Niao to determine mid-spring.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The third brother Hsi is assigned to Nan-ziao, associated with the Brilliant
    Capital, to arrange summer transformations and observe the limit of the shadow,
    using the longest day and the star Hwo to determine mid-summer.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The second brother Ho is assigned to the west, in the Dark Valley, to convoy
    the setting sun and arrange autumn labours, using medium night length and the
    star Hsü to determine mid-autumn.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The third brother Ho is assigned to the northern region, in the Sombre Capital,
    to examine winter changes, using the shortest day and the star Mao to determine
    mid-winter.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Yao states that a round year has 366 days and tells the Hsis and Hos to use
    the intercalary month to fix the four seasons and complete the year, after which
    officers and works will be regulated.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Yao asks who can search out a man suited to the times whom he can raise and
    employ; Fang-i-Z^i recommends the heir-son Kii, but Yao rejects him as insincere
    and quarrelsome.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The introductory summary says a later chapter concerns Yao's search for someone
    able to cope with a terrible inundation and take his place on the throne, introducing
    Shun as Yao's successor.
  category: other
  evidence_refs:
  - ev:11
