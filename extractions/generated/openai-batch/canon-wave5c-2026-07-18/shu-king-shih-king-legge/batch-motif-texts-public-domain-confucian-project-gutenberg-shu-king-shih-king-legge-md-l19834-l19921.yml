canonical_text:
  quote: Perfect filial piety and fraternal duty reach to (and move) the spiritual
    intelligences
  summary: The passage first states that sons, ministers, and other associates must
    remonstrate when unrighteous conduct is involved, since mere obedience is not
    filial piety. Chapter XVI then presents the Master teaching that ancient intelligent
    kings served parents with filial piety and thereby served Heaven and Earth properly;
    this ordered human hierarchy and drew a response from spiritual intelligences.
    The Son of Heaven is described as honoring kin, showing reverence in the ancestral
    temple, avoiding disgrace to predecessors, and causing departed spirits to manifest.
    A cited poem expresses universal homage across the four directions.
  language: English
  quote_policy: quoted
