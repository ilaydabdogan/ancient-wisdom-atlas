canonical_text:
  quote: ''
  summary: Pan-kang addresses the people and officials concerning the removal to a
    new capital. He warns that refusal to move endangers life, invokes Heaven, God,
    royal ancestors, and divination as support for the relocation, threatens punishment
    for resistance or corrupt conduct, and after the removal urges officials to foster
    the people's enduring settlement rather than enrich themselves.
  language: English
  quote_policy: summarized
