  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Grand-Guardian, the earl of ^ui, and others address the king as Son of
    Heaven and say Great Heaven altered the decree formerly received by the House
    of Yin, while Wan and Wu received and carried out the decree.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The ministers advise the king to be reverent, maintain armies in great order,
    and not allow the appointment of high ancestors to come to harm.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The king says Wan and Wu were just, enriched the people, did not seek out
    people's crimes, were impartial and sincere, and had brave officers and loyal
    ministers.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The king says the former rulers received the true favoring decree from God,
    that Great Heaven approved their ways and gave them the four quarters of the land,
    and that they established principalities as bulwarks for successors.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The king asks the princes to continue the service rendered by their predecessors,
    keep their hearts in the royal House despite physical distance, share his anxieties,
    and prevent him from being put to shame.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: After hearing the charge, the dukes and others bow to one another and withdraw;
