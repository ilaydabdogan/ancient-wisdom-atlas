canonical_text:
  quote: ''
  summary: The passage introduces King Khang after his accession. Regional princes
    are led into the palace court, display horses and gifts, declare their offerings,
    and perform obeisance. Ministers address the king as Son of Heaven, recall Heaven's
    transfer of the decree from Yin to Wan and Wu, and advise reverent rule and ordered
    armies. The king replies by invoking the just rule of Wan and Wu, Heaven's favor,
    and the establishment of principalities as supports for successors. He asks the
    princes to keep their hearts with the royal house, after which they withdraw and
    he resumes mourning dress.
  language: English
  quote_policy: summarized
