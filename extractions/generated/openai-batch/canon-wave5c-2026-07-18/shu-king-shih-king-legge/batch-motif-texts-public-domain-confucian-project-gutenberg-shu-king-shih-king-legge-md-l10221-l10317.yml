  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The princes display teams of light bay horses with dyed red manes and tails,
    lift rank-symbols, and present other gifts.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The princes identify themselves as servants and defenders of the throne and
