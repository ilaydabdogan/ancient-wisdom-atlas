canonical_text:
  quote: ''
  summary: The preface discusses a curtly described ceremony that pairs a Ti with
    a Shan in the months, including an entry for the first month of spring naming
    Thai Hao as Ti and Kau-mang as Shan. The writer argues that Ti is being used in
    the sense of God, Shan in the sense of Spirit, and that the title Ti was later
    applied through deification to legendary names of antiquity and to the heroes
    Yao and Shun. The passage also explains the translator’s decision to leave Ti
    untranslated rather than render it as emperor in those cases.
  language: English
  quote_policy: summarized
