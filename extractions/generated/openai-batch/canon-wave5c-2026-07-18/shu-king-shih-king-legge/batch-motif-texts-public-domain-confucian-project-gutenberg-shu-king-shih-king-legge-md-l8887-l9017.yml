canonical_text:
  quote: ''
  summary: The passage presents the duke's address to Prince Shih, recalling virtuous
    men who aided kings Wan and Wu under Heaven's favour, urging Shih to share responsibility
    for the young sovereign and the dynasty's mandate, and warning against idleness
    by reference to the disorders of Yin. It then introduces the Charge to Kung of
    Zhai and narrates punishments of several royal relatives after an evil report,
    followed by the restoration and investiture of Hu because of his reverent virtue.
  language: English
  quote_policy: summarized
