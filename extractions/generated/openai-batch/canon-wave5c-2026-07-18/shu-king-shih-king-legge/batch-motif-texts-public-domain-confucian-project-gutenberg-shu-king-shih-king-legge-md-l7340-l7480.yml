literal_observations:
- id: obs:1
  text: The king tells Fang to set forth laws for matters beyond immediate supervision,
    to use the penal laws of Yin as ordered precedents, and to examine evidence over
    a prolonged period before deciding serious criminal cases.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king says punishments, especially death, must be righteous and not warped
    to match Fang's inclinations; he also urges caution about whether a decision is
    fully accordant with right.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage lists robbing, stealing, villainy, treachery, killing, and violent
    assault for property as crimes committed by people described as reckless and abhorred
    by all.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king describes unfilial and unbrotherly conduct through failed reciprocal
    duties between fathers, sons, elder brothers, and younger brothers, and says such
    conduct threatens Heaven-given laws among the people if not punished.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king says certain instructors, department heads, and lesser officers who
    propagate other lessons, seek popular praise, neglect duty, and distress their
    ruler lead people to wickedness and should be put to death according to right.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Fang is warned that ruling through terror and violence would set aside the
    royal charge and oppose virtue; he is told to reverence statutes and look to King
    Wan's reverence and caution.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The king says the people should be led by example to happiness and tranquillity,
    and he identifies the former wise kings of Yin as models whose virtue regulated
    the people.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The king says he does not dare murmur against Heaven's severe inflictions
    and that the report of crimes goes manifestly up to heaven.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The king tells Fang to be reverent, avoid bad counsels and unusual ways, imitate
    the active virtue of the ancients, use generous forbearance, and settle the people
    in what is good.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The king says Heaven's appointments are not unchanging, warns Fang not to
    cause the loss of his dignity, and says obedience to reverenced statutes will
    let Fang enjoy dignity among the people of Yin and transmit it to posterity.
  category: sequence
  evidence_refs:
  - ev:10
