canonical_text:
  quote: ''
  summary: A royal speaker addresses Fang with instructions on criminal judgment,
    righteous punishment, filial and official disorder, reverence for statutes, imitation
    of earlier virtuous rulers, accountability before Heaven, and the conditional
    preservation of Fang's dignity. The passage then transitions to the heading and
    introductory note for the Announcement about Drunkenness, identifying it as another
    announcement to Fang and associating drunken debauchery with dynastic downfall
    in earlier Shu materials.
  language: English
