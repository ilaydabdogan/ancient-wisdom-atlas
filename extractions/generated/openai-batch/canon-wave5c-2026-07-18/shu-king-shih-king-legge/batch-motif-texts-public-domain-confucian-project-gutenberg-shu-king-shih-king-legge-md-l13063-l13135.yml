canonical_text:
  quote: ''
  summary: 'The passage presents ritual and historical notes for several Zhou odes:
    a sacrifice to King Thai, who moved his followers and began cultivation around
    Mount Khî; an ode to King Khang, who preserves Heaven''s appointment through virtue;
    a sacrifice in the Hall of Audience to Heaven with King Wan associated; and the
    beginning of an ode about King Wu sacrificing to Heaven and to the spirits of
    hills and rivers after the Shang overthrow.'
