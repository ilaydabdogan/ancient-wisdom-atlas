  summary: The passage describes the emergence and dominance of Mao's recension of
    the Shih, its scholarly transmission and commentarial tradition, and an argument
    that multiple early recensions and oral recitation support the genuineness of
    the received Book of Poetry despite textual variation after the destruction of
    written materials in the Qin period.
