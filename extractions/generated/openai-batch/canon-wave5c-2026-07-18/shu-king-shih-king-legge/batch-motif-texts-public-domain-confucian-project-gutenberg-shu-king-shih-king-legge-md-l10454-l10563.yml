canonical_text:
  quote: ''
  summary: The passage contains the close of a royal charge about governing Yin officers
    and establishing Zhou power, followed by the introductory framing and text of
    a royal charge to A'iin-ya as Minister of Instruction. The charge emphasizes inherited
    dynastic government, ancestral service, ministerial assistance, instruction in
    the five social relations, personal correctness, concern for the people's hardships,
    and following the models of former kings and fathers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed king says that the kingdom's security or danger depends on the
    officers of Yin, and that neither excessive sternness nor excessive mildness will
    cultivate their virtue.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king credits the duke of A'au, A^un-/^//an, and the addressed duke with
    successive stages of an undertaking and says the three princes will have been
    united in aim and way.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king says the principles and governmental measures of the addressee will
    enrich the people, give support even to wild tribes described by left-buttoning
    coats, establish Zhou power at A7zang-/'au, and leave fame and a pattern for descendants.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The king commands the duke not to say he is unequal to the work or that the
    people are few, but to exert his mind, attend to business, follow former kings,
    and complete the government of predecessors.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The editorial framing states that the charge in Book XXV is attributed to
    king Mu and that A'iin-ya is appointed Minister of Instruction; it also says his
    father and grandfather are intimated or conjectured to have held the same office.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: King Mu says A'iin-ya's grandfather and father served the royal House with
    loyalty and honesty, and that their merit was recorded on the grand banner.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: King Mu says he inherited the line of government transmitted from Wan, Wu,
    K/iang, and Khang, and describes his anxiety as like treading on a tiger's tail
    or walking on spring ice.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: King Mu charges A'iin-ya to assist him and to be like his limbs, heart, and
    backbone, continuing the service of his grandfather and father without disgracing
    them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: King Mu commands A'iin-ya to spread knowledge of the five invariable social
    relations, seek harmonious observance of their duties, and guide the people by
    personal correctness and attainment of the right mean.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: King Mu describes the people's hardships in summer heat and rain and in winter
    cold, and tells A'iin-ya to think of those hardships so as to promote their ease
    and tranquillity.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: King Mu praises the plans of king Wan and the energy of king Wu as correct
    and helpful to descendants, and directs A'iin-ya to carry out instructions with
    reverence and wisdom and display the bright decree conferred on Wan and Wu.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: In a second brief speech, the king tells A'un-ya to make the courses of his
    excellent fathers his rule, saying the people's good or bad order depends on this
    and that it will make the sovereign's good government illustrious.
  category: speech
  evidence_refs:
  - ev:9
