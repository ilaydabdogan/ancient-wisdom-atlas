canonical_text:
  quote: ''
  summary: The passage combines translated speech and editorial commentary concerning
    the regulated use of spirits. A commentator says Heaven prescribes some uses of
    spirits for sacrifice and guests but attaches terrors to abusive use. King Wan
    is said to have instructed young nobles, people of Mei, and officers to avoid
    ordinary or excessive drinking, allowing spirits in sacrifices or family feasts
    only after filial, agricultural, commercial, and official duties are fulfilled
    and virtue is maintained. The king tells Fang that earlier followers of King Wan
    and earlier rulers and ministers of Yin avoided indulgence in spirits and thereby
    supported royal virtue and the transfer of appointment.
  language: English
  quote_policy: summarized
