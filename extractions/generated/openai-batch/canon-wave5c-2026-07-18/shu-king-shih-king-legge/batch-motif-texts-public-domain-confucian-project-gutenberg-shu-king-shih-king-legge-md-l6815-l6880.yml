canonical_text:
  quote: Now Heaven has moved its terrors to display his virtue.
  summary: The passage includes notes on divination and the metal-bound coffer, then
    narrates how the duke pursued criminals, remained in the east for two years, and
    was later vindicated when a Heaven-sent storm led the king and officers to open
    the coffer. The writings revealed the duke's earlier substitutionary act for king
    Wu. The king wept, recognized the duke's virtue, went to meet him, and Heaven
    sent rain and a contrary wind so that the flattened grain rose again and the year
    became fruitful.
  language: English translation
  quote_policy: quoted
