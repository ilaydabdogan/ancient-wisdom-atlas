canonical_text:
  quote: ''
  summary: 'The passage presents agrarian royal odes: Yu is credited with making the
    southern hill and surrounding lands manageable; fields are bounded and divided;
    clouds, snow, drizzle, and rain support grain; harvest products become food and
    spirits for departed representatives, guests, ancestors, and ritual offerings;
    the distant descendant receives blessing and long life. A second ode describes
    extensive fields, stored grain feeding husbandmen, field labor, sacrifices with
    millet and victim-rams to land and quarter spirits, invocation of the Father of
    Husbandry for rain, and a visit by the distant descendant and field surveyor while
    workers are fed.'
  language: English translation
  quote_policy: summarized
