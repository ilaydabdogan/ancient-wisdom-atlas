canonical_text:
  quote: ''
  summary: The passage presents Fa, king of A'au, declaring a Heaven-sanctioned punitive
    campaign against Shau of Shang, invoking Heaven, Earth, a hill, a river, God,
    and spirits. It recounts the crossing to Shang territory, the collapse and reversal
    of Shau's army at Mu, the overthrow of Shang, restorative acts toward imprisoned
    or disgraced worthies, redistribution of treasures and grain, and orderly government
    through ranked nobles, worthy appointments, social teaching, rites, sacrifices,
    virtue, and merit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A predecessor received the appointment of Heaven to soothe the regions, but
    the whole kingdom was not united in nine years, and the task fell to the speaker,
    who calls himself a little child.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fa announces to Great Heaven, sovereign Earth, a famous hill, and a great
    river that he is about to administer a great correction to Shang.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fa describes Shau, the present king of Shang, as without principle, cruel,
    destructive to Heaven's creatures, tyrannical toward the people, and surrounded
    by vagabonds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fa states that he has obtained virtuous men, complies reverently with God
    and Heaven's determinate counsel, and pursues punitive work eastward to give tranquillity
    to men and women.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The flowery and great land and the tribes of the south and north are said
    to follow and consent with Fa.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: People meet Fa with baskets full of dark-coloured and yellow silks and come
    with allegiance to the state of A'au.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fa asks the spirits to grant aid so that he may relieve the millions of the
    people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The army crosses the ford of Mang, arrays itself in the borders of Shang,
    and waits for the gracious decision of Heaven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Shau leads forward troops described as like a forest and assembles them in
    the wild of Mu, but they offer no opposition.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The front ranks invert their spears and attack those behind them, causing
    flight and bloodshed described as blood flowing until it floated pestles.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: King Wu dons armour once, overturns Shang rule, and makes government resume
    its old course.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After victory, he releases the count of KM from prison, raises a mound over
    Pi-kan's grave, bows at the gate of Shang Yung's village, disperses Stag Tower
    treasures, and distributes grain stores.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: He arranges nobles in five orders, assigns territories, gives offices to the
    worthy, gives employments to the able, teaches social duties, provides for food,
    mourning rites, and sacrifices, honors virtue, rewards merit, and the kingdom
    is orderly ruled.
  category: action
  evidence_refs:
  - ev:7
