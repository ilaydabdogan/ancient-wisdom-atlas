canonical_text:
  quote: ''
  summary: The passage recounts the attempted destruction of the Shu and other classical
    books under a B.C. 213 edict, punishments imposed on scholars, subsequent damage
    from the sack of the capital, and later recovery, teaching, cataloguing, deciphering,
    and presentation of Shu tablets by Fu and Khung An-kwo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Shu is described as having narrowly escaped entire destruction after a
    B.C. 213 edict against old classical books.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The edict commanded old classical books to be consigned to flames, with stated
    exceptions, and singled out the Shu and the Shih as especially targeted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Scholars who met to speak of the works faced death; people found with copies
    after thirty days were to be branded and sent to labor four years on the Great
    Wall.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The edict was said to be ruthlessly enforced; hundreds of scholars who refused
    obedience were buried alive, and the Shu nearly perished.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tyrant died in B.C. 210, his dynasty ended in B.C. 206, the Han dynasty
    dates from B.C. 202, and the edict against the ancient books was formally repealed
    in B.C. 191.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sack of the capital in B.C. 206 caused fires among palaces and public
    buildings for three months, destroying copies that might have survived at court.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A scholar surnamed Fu hid tablets of the Shu in a wall and later recovered
    only twenty-nine documents, counted as thirty-five books.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fu taught the recovered documents; scholars came to him, and Emperor Wan sent
    a court recorder to obtain the tablets or a copy for the capital.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Fu's recovered text was in the character form current at the time and became
    known as the Shu of the modern text.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the reign of Emperor Wu, tablets of the Shu and other classics were discovered
    in the wall of the Khung or Confucian family house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The discovered tablets were in an old character form difficult to decipher
    and were entrusted to Khung An-kwo.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Khung An-kwo used Fu's text and other resources to make out preserved tablets,
    bringing forty-six documents or portions of the old Shu to light.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Khung An-kwo presented the tablets and a current-character transcript to the
    emperor in B.C. 97, kept a second transcript, and was ordered to make a commentary;
    later troubles delayed attention to the work.
  category: sequence
  evidence_refs:
  - ev:6
