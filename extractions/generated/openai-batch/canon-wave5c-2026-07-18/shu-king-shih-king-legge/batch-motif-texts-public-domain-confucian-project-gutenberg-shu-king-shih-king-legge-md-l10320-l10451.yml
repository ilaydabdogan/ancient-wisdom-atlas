canonical_text:
  quote: ''
  summary: The passage introduces and begins Book XXIV, in which King Khang charges
    the Duke of Pi with continuing earlier work of governing and morally reforming
    the people of Yin. The king recalls the virtue of former kings, the relocation
    and transformation of Yin people, praises the duke's service, and gives instructions
    about distinguishing good from bad, regulating boundaries and guard-posts, avoiding
    corrupt customs, and instructing formerly privileged Yin officers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An editorial introduction identifies King Khang as the king giving the charge
    and states that the Duke of Pi receives a responsibility previously entrusted
    to another official and connected with reforming the people of Yin.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the sixth month of the king's twelfth year, the king walked in the morning
    from the honoured capital of Kau to Fang and charged the Duke of Pi to protect
    and regulate the eastern border with reference to the multitudes of Kang-Mu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king says that Wan and Wu diffused great virtue under heaven and thereby
    received the appointment that Yin had previously enjoyed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king says the Duke of Kau assisted the royal predecessors, established
    the kingdom, dealt cautiously with the refractory people of Yin, and removed them
    to Lo so they would be near the royal House and transformed by its lessons.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king says that thirty-six years have passed, the generation and manners
    have changed, the four quarters are without anxiety, and he enjoys repose.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The king praises the Duke of Pi as strenuous in virtue, attentive to small
    things, helpful across four reigns, and authoritative among inferior officers.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The king says he can let his robes hang down and fold his hands while looking
    for the complete effect of the duke's measures.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king charges the Duke of Pi with the duties of the Duke of Kau and tells
    him to signalize the good, separate the bad from them, and give visible tokens
    of approval in their neighborhoods.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The king instructs that if people do not obey lessons and statutes, boundaries
    of their hamlets should be marked off, borders and frontiers redefined, and guard-posts
    strengthened to secure tranquillity within the four seas.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The king states that measures of government should be consistent and constant,
    proclamations should be complete and brief, and there should not be love of what
    is extraordinary.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The king describes customs of Shang as including flattery of superiors and
