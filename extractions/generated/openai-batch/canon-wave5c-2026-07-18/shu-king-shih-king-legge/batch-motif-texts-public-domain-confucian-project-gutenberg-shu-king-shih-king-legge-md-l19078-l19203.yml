- id: obs:3
  text: The Master identifies the answer as filial piety and describes filial piety
    as the root of all virtue and the stem from which moral teaching grows.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Master says the body, including every hair and bit of skin, is received
    from parents and should not be injured or wounded; this is called the beginning
    of filial piety.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Master says establishing one's character, making one's name famous in
