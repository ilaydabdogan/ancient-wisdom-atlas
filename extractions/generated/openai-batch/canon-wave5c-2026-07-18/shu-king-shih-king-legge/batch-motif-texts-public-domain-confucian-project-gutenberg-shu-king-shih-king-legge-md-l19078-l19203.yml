canonical_text:
  quote: ''
  summary: 'The passage opens The Hsiao King with a teaching dialogue: the Master,
    identified in a note as Confucius, questions his disciple Sang/Shan about the
    ancient kings'' virtue and rule. The Master explains that filial piety is the
    root of virtue and moral teaching, begins with preserving the body received from
    parents, proceeds through service to parents and ruler, and culminates in established
    character that glorifies parents. Chapter II applies filial piety to the Son of
    Heaven, whose love and reverence for parents affect the people and make him a
    pattern within the four seas, with support from cited classical passages.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master asks Shan whether he knows the perfect virtue and all-embracing
    rule of conduct by which ancient kings brought accord, peace, harmony, and lack
    of ill-will between superiors and inferiors.
  category: speech
  evidence_refs:
  - ev:1
  - ev:10
- id: obs:2
  text: Sang/Shan rises from his mat and says he is too devoid of intelligence to
    know the answer.
  category: action
  evidence_refs:
