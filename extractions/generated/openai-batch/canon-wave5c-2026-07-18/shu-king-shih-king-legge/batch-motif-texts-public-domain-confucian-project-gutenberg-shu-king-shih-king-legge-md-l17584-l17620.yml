canonical_text:
  quote: Heaven beheld the ruler of A'au... And to maintain him, its Son, Gave birth
    to J^ung Shan-fu.
  summary: The passage praises A'ung/J^ung Shan-fu as a principal minister of King
    Hsuan. It states that Heaven gives birth to the people and assigns laws to faculties
    and relationships, that the people have a normal nature and love normal virtue,
    and that Heaven, seeing the ruler of A'au, produced Shan-fu to maintain Heaven's
    Son. Shan-fu then sets out after sacrificing to the spirit of the road, with strong
    four steeds.
  language: English translation
