canonical_text:
  quote: The happy and courteous sovereign / Is the parent of the people.
  summary: The Master teaches that complete filial service includes reverent conduct,
    nourishing parents, anxiety during illness, mourning, and solemn sacrifice. He
    links filial piety to social order, education, propriety, reverence, government,
    public reputation, and the question of whether simple obedience is sufficient
    when remonstrance may be required.
  language: English translation
  quote_policy: quoted
