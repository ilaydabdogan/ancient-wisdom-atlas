literal_observations:
- id: obs:1
  text: After sacrifice to ancestors, the king feasted his uncles, younger brothers
    or cousins, and other same-surname princes and nobles in another apartment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Musicians who had served during ancestral worship and entertainment followed
    the convivial party to provide further musical aid.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Viands from the temple were set out again for the guests, who ate and drank
    fully.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the conclusion of the feast, all guests performed obeisance while one declared
    the Spirits' satisfaction and favor toward the king and his posterity, conditional
    on continued observance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: During the feast the king gave special respect to aged relatives, repeatedly
    filled their cups, and wished their old age blessed and their happiness increased.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The seasonal ancestral sacrifices are described as related to filial piety
    and as designed mainly to maintain unity of family connection.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The rites are said to imply belief in continued existence of departed spirits,
    with royal and family ancestors becoming tutelary spirits of dynasty and family.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: Confucius is cited as explaining ancestral temple ceremonies as distinguishing
    royal kin by descent, rank, duties, talents, worth, and age.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that the Shih does not speak directly of worship paid to
    God except incidentally, and notes sovereign sacrifices at summer and winter solstices
    on different altars.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: A spring sacrifice to God is linked with seeking blessing on agricultural
    labours, with Hau Ki associated as ancestor of the House of Zhou and teacher of
    grain cultivation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: An autumn sacrifice to God in the Hall of Light is linked with a great audience
    to feudal princes, with King Wan associated as founder of the Zhou dynasty.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Sacrificial Odes of Shang are described as the oldest pieces in the collection,
