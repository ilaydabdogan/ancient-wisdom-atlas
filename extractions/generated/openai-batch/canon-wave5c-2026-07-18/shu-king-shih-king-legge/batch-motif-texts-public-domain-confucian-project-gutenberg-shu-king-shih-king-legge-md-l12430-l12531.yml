canonical_text:
  quote: ''
  summary: The passage describes seasonal ancestral sacrifices, post-sacrificial feasting
    of royal kin, declarations of ancestral spirit favor, the rites' filial and lineage-ordering
    functions, sacrifices to Shang-Ti at seasonal occasions, ancestor association
    in spring and autumn rites, and introductory notes on the Sacrificial Odes of
    Shang and Shang dynastic lineage.
  language: English
