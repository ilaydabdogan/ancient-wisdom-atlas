  quote: ''
  summary: The passage links an auspicious royal marriage to Heaven's appointment,
    the birth and victory of king Wu, and the defeat of Shang. It then presents the
    early growth of the house of Zhou under the ancient duke Than-fu, including primitive
    dwellings, movement by rivers to Mount Khi, selection of the Zhou plain through
    consultation and tortoise-shell divination, and settlement and division of the
    land.
