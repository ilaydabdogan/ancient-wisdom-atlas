- id: obs:4
  text: The oppressed people are described as protesting their innocence to the spirits
    of heaven and earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The announcement states that Heaven blesses the good, makes the bad miserable,
    and sent calamities on the House of Hsia to reveal its guilt.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Thang says he was charged with the decree of Heaven and did not dare forgive
