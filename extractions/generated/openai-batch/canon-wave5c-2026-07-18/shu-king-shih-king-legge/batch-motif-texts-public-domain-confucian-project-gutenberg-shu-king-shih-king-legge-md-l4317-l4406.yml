- id: obs:2
  text: The king says Great God has given even the inferior people a moral sense and
    that enabling tranquil pursuit of its course is the sovereign’s work.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king of Hsia is described as having extinguished his virtue, acted tyrannically,
    and oppressed the people of the myriad regions.
  category: attribute
  evidence_refs:
