  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The announcement says High Heaven showed favor to the people, the criminal
    was degraded and subjected, and the millions of people showed a true reviving.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Thang says he is fearful and trembling, as if in danger of falling into a
    deep abyss.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Thang instructs the princes not to follow lawless ways, insolence, or dissoluteness,
    and to keep their statutes so they may receive Heaven’s favor.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Thang says he will not conceal the good in the people or forgive the evil
    in himself, and will examine these things in harmony with the mind of God.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Thang says guilt found among the myriad regions should rest on him, while
    guilt found in him should not attach to the regions.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: A note reports a later tradition that during seven years of drought and famine
    Thang said he would be the human victim if one was required, fasted, cut his hair
    and nails, dressed as a sacrificial victim, prayed in a mulberry forest, and rain
    fell before he finished speaking.
  category: sequence
