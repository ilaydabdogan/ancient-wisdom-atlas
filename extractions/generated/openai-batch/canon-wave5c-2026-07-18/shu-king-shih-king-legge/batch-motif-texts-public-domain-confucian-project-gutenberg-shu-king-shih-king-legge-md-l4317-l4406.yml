canonical_text:
  quote: ''
  summary: After defeating Hsia and returning to Po, Thang issues an announcement
    to the regions. He presents the fall of Hsia as Heaven’s judgment on tyranny,
    states that he acted under Heaven’s decree after ritual appeal to the Spiritual
    Sovereign, credits Heaven with favoring the people, and urges princes and people
    to act lawfully. He declares that he will examine good and evil in accord with
    the mind of God and take responsibility for guilt found among the regions. A translator
    note adds a later tradition in which Thang offers himself as a sacrificial victim
    during drought and rain follows.
  language: English
  quote_policy: summarized
