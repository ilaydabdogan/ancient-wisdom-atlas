canonical_text:
  quote: ''
  summary: The passage comments on a water-associated royal or state college and describes
    the marquis of Lu as virtuous, filial, civil and martial, receiving submission,
    prisoners, trophies, and tribute from the Hwai tribes. It then introduces an ode
    praising Duke Hsi, repaired temples, sacrificial service, Lu military power, and
    an ancestral line reaching back to Jiang Yuan and the divinely favored birth of
    Hau-ji, who receives blessings connected with agriculture.
  language: English
  quote_policy: summarized
