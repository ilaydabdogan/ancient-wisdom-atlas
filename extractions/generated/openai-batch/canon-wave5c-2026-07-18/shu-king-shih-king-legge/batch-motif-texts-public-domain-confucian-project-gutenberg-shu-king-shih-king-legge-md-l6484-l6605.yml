canonical_text:
  quote: ''
  summary: The passage gives rules for deciding doubtful great matters by consulting
    the ruler's mind, ministers and officers, common people, and divinatory media.
    It describes outcomes according to agreement or disagreement among human and divinatory
    voices. It then lists meteorological and celestial 'verifications' associated
    with order, disorder, government, crops, and social well-being, and closes with
    catalogues of five sources of happiness and six extreme evils.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In doubts about any great matter, the addressee is told to consult his own
    mind, high ministers and officers, common people, the tortoise-shell, and divining
    stalks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Agreement among the addressee, shell, stalks, ministers and officers, and
    common people is called a great concord and is said to bring personal welfare
    and good fortune to descendants.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage classifies several combinations of agreement and opposition among
    human groups and divinatory media as fortunate or unlucky, including a case where
    stillness is fortunate when shell and stalks oppose human views.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The listed verifications are rain, sunshine, heat, cold, wind, and seasonableness;
    when the five arrive complete and in order, plants become luxuriant, but excess
    or deficiency brings evil.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Favourable verifications are paired with gravity, orderliness, wisdom, deliberation,
    and sageness, each emblemed by seasonable weather; unfavourable verifications
    are paired with recklessness, assumption, indolence, hastiness, and stupidity,
    each emblemed by constant weather.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The king is assigned to examine the year, high ministers and officers the
    month, and inferior officers the day.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Unchanging seasonableness through year, month, and day is linked with mature
    grains, wise government, distinguished heroic men, and peace in families; interrupted
    seasonableness is linked with the opposite outcomes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The common people are told to examine the stars; the passage states that some
    stars love wind and some love rain, that the sun and moon give winter and summer,
    and that the moon following the stars gives wind and rain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The five sources of happiness are long life, riches, bodily soundness and
    mental serenity, love of virtue, and fulfilling the will of Heaven; the six extreme
    evils are shortened life by misfortune, sickness, distress of mind, poverty, wickedness,
    and weakness.
  category: object
  evidence_refs:
  - ev:7
