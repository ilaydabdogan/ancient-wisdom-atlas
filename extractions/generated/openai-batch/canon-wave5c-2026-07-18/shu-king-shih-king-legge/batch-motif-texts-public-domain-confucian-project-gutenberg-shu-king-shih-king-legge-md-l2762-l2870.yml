canonical_text:
  quote: "“The determinate appointment of Heaven rests on your person.”"
  summary: The passage presents counsel about Heaven’s appointment, succession, divination,
    rulership, and the correction of the rebellious lord of Miao. Yu is appointed
    after consultation and divination; he first leads a punitive expedition, then
    withdraws after Yi advises that virtue and humility transform others. Peaceful
    ritual display follows, and the lord of Miao submits.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The opening counsel says that Heaven’s appointment rests on the addressee
    and urges careful, reverent maintenance of the throne, attention to the people,
    and caution in speech and counsel.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yu proposes that meritorious ministers be tested one by one through divination
    and that the favorable indication be followed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ti replies that a ruler should first settle his mind and then refer the
    judgment to the great tortoise-shell; he says ministers, people, spirits, tortoise-shell,
    and divining stalks concurred.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yu performs obeisance with his head to the ground and declines the position,
    but the Ti insists that Yu is suitable.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the first morning of the first month, Yu receives the appointment in the
    temple dedicated to ancestral spirits and takes the lead of the officers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ti orders Yu to correct the lord of Miao, who refuses obedience.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Yu assembles princes and addresses the host, calling the lord of Miao ignorant,
    disrespectful, rebellious, and destructive of virtue.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Yu says Heaven is sending calamities on the lord of Miao and commands the
    assembled men to punish his crimes with united heart and strength.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After three decades, the people of Miao remain rebellious against the commands
    issued to them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Yi tells Yu that virtue moves Heaven, that pride brings loss, and that humility
    receives increase.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Yi recalls that in the Ti’s early life near Mount Li, the Ti cried to Heaven
    and to his parents, took guilt on himself, and served Ku-sau respectfully until
    Ku-sau was transformed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Yu accepts Yi’s words and withdraws the army and troops.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Ti diffuses virtuous influences of peace, and dancers with shields and
