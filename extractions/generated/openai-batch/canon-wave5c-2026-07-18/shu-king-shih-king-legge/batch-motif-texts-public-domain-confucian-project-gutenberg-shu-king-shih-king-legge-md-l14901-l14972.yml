canonical_text:
  quote: ''
  summary: The line range contains notes and excerpts from several odes. One piece
    is identified as the composition of a banished son of King Yu, whose mother was
    degraded after Yu became enamoured of Sze of Pao; the son laments his solitary
    misery, invokes Heaven, and reflects on father, mother, birth, and reverenced
    trees near the farmstead. A later ode presents an unnamed sufferer from royal
    slander appealing to Heaven and asserting innocence. Another excerpt presents
    a eunuch, also a victim of slander, invoking azure Heaven to observe the proud
    and pity the troubled, then imagining slanderers cast to wolves, tigers, the north,
    and great Heaven.
  language: English
  quote_policy: summarized
