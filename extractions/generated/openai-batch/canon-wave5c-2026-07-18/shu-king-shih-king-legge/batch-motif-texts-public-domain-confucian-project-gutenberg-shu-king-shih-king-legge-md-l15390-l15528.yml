canonical_text:
  quote: ''
  summary: The passage describes abundant crops, field preparation, sowing, pest removal,
    rain for public and private fields, gleanings left for a widow, and field sacrifices
    to spirits of the quarters. It also includes a stanza on greenbeaks and feudal
    princes, and a passage contrasting regulated ritual drinking at archery and seasonal
    sacrifices with drunken excess, including music, ancestral rites, personators
    of the dead, and blessings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The crops of the distant descendant are described as thick, with stacks standing
    like islands and mounds, and with thousands of granaries and tens of thousands
    of carts sought.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husbandmen are said to rejoice and to wish the distant descendant great
    happiness, myriads of years, and life without end.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In large fields, seed is selected, implements are inspected, sharp ploughshares
    are taken, and grain is sown on south-lying acres.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The grain is described as earing, hardening, and being of good quality, without
    wolf's-tail grass or darnel.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Insects that eat the heart, leaf, roots, and joints of young plants are removed,
    and the Father of Husbandry is asked to seize them and put them in blazing fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dense clouds and slow rain are described, with a request that rain fall first
    on public fields and then on private fields.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Young grain, bundles, handfuls, and ears are left unreaped or ungathered for
    the benefit of the widow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The distant descendant comes while wives and children bring food to workers
    on the south-lying acres, and the surveyor of the fields comes and is glad.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Pure sacrifices are offered to spirits of the four quarters, with red and
    black victims and preparations of millet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Greenbeaks with variegated wings are described as flitting about, and the
    stanza expresses rejoicing in the princes and a wish that they receive Heaven's
    blessing.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: Guests approach mats, take places on left and right in orderly fashion, and
    bamboo and wooden dishes with sauces and kernels are arranged in rows.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The spirits are mild and good, the participants drink reverently, bells and
    drums are arranged, and pledge-cups are raised with order and ease.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A target is set up, bows and arrows are prepared, archers are arranged in
    classes, and a shooting exchange is spoken before drinking the cup.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Dancers move with flutes to the notes of the organ and drum, while instruments
    perform in harmony to please the meritorious ancestors and observe ceremonies.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Personators of the dead confer great blessings and wish happiness for descendants;
    a guest draws the spirits and an attendant fills the cup of rest.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: The heading frames the final ode excerpt as contrasting drinking according
    to rule at archery contests and seasonal sacrifices with drinking to excess.
  category: other
  evidence_refs:
  - ev:7
