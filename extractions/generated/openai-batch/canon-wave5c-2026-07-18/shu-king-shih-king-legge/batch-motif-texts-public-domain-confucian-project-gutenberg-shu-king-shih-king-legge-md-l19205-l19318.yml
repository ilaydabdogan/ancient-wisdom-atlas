canonical_text:
  quote: ''
  summary: The passage distinguishes forms of filial piety for princes of states,
    high ministers and great officers, and inferior officers. Princes preserve nobility,
    riches, altars, and harmony through humility, economy, and observance of rules.
    High ministers and great officers preserve ancestral temples by conforming in
    dress, speech, and conduct to ancient standards. Inferior officers extend filial
    service to mother, father, ruler, and superiors, preserving position and sacrifices
    through loyalty and obedience. Quoted verses from the Book of Poetry reinforce
    caution, ceaseless service, and not disgracing one's parents.
  language: English
  quote_policy: summarized
