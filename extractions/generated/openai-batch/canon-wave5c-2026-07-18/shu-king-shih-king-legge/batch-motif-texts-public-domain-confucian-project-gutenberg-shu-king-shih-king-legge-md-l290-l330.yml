canonical_text:
  quote: ''
  summary: 'The preface discusses Confucian canonical and para-canonical works: supplements
    to an earlier text, the Hsiao King or Classic of Filial Piety, the Five King,
    and the Four Shu or Four Books. It describes the Hsiao King as attributed to Confucius
    and formed as conversations with 3ang-jze, notes imperial attention to it, and
    lists the Lun Yu, Works of Mencius, Ta Hsio, and Chung Yung within the Four Books.'
  language: English
  quote_policy: summarized
