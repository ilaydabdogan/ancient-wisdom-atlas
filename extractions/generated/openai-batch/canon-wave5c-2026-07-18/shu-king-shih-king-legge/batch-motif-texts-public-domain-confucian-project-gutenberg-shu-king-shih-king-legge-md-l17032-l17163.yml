canonical_text:
  quote: ''
  summary: The passage contains King Wan's warnings against the sovereign of Yin-Shang,
    explaining political ruin as the result of abandoning ancient laws rather than
    an evil caused by God, and comparing Yin's danger to the fall of Hsia. It then
    introduces and excerpts Ode 2, attributed to Duke Wu of Wei, in which an elderly
    ruler admonishes himself about outward conduct, virtue, receptivity to counsel,
    attention to former kings, Heaven's approval, domestic discipline, military readiness,
    and caution in speech.
  language: English translation
  quote_policy: summarized
