- id: obs:1
  text: The opening note states that miseries ignorantly ascribed to God are actually
    due to human neglect of the law of Heaven.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: King Wan addresses the sovereign of Yin-Shang, describing clamour like cicadas
    or boiling soup, affairs approaching ruin, and indignation spreading through the
    Middle Kingdom and the demon regions.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: King Wan says the evil time is not caused by God, but by Yin's failure to
    use old ways and to listen to ancient statutes and laws; he says the great appointment
    is being overthrown.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: King Wan cites a saying about a tree that falls while its branches and leaves
    remain uninjured, saying it must first have been uprooted, and he links Yin's
    warning to the age of the last sovereign of Hsia.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The heading and introduction present Ode 2 as counsels made by Duke Wu of
    Wei to admonish himself in old age, including the idea that a ruler is under the
