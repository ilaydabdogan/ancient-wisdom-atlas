canonical_text:
  quote: ''
  summary: 'The passage introduces and presents the charge to the Count of Wei: after
    the fall of Shang and Wu-kang''s rebellion, the duke of Zhou, in the king''s name,
    invests the Count as Duke of Sung to preserve the line, rites, relics, and ancestral
    standing of Shang while serving the Zhou royal house. The charge praises Thang,
    Heaven''s favor, the Count''s filial and ritual conduct, and commands him to govern
    reverently. The passage then begins an introduction to the Announcement to the
    Prince of Khang, outlining his appointment and the theme of virtuous government
    with careful punishment.'
  language: English
  quote_policy: summarized
