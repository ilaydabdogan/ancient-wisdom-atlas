canonical_text:
  quote: ''
  summary: 'The passage first describes night life in an Amerindian settlement: women
    tend fires, men tell stories, youths play instruments, dogs and children repeatedly
    wake the settlement, and hunters make noise before dawn. It then describes childbirth
    and the couvade: the mother gives birth, often in a forest hammock, while the
    father observes restrictions before and after birth, lies in his hammock, is cared
    for by women, and avoids work, certain foods, washing, smoking, weapons, and scratching
    with his nails because his actions are believed to affect the newborn child.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At night, women gather enough wood for fires and then lie in hammocks while
    the group talks.
  category: action
  evidence_refs:
  - ev:1
