  text: Men tell stories late into the night, sometimes in a monotonous chant and
    sometimes with emphasis and gestures.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Boys and younger men march around the houses while blowing horns and playing
    flutes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Night rest in the settlement is repeatedly interrupted by women renewing fires
    or doing domestic work, dogs barking, children screaming, and men resuming stories.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: About an hour before dawn, some men going out to hunt wake others by playing
    flutes or beating drums as they go to bathe before leaving.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before the child is born, the father abstains for a time from certain kinds
    of animal food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The mother works as usual until shortly before birth, then retires alone or
    with other women to the forest, ties up her hammock, and gives birth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A cited account says Macusi cord-cutting tools differ by the sex of the newborn,
    and that among Warraus the mother’s teeth may be used instead of bamboo.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author reports that, in his observed cases, the mother left her hammock
    almost at once and resumed ordinary work, while Schomburgk reported a Macusi practice
    in which the mother remained in the hammock for a time and the father lay beside
    her.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the child is born, the father takes to his hammock and abstains from
    work, meat, most food except weak cassava gruel, smoking, washing, and touching
    weapons.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: During the father’s couvade, women of the place nurse and care for him.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The father may not scratch himself with his fingernails but may use a specially
    provided splinter from the mid-rib of a cokerite palm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The couvade restrictions continue for many days and sometimes weeks.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The author says the couvade appears to rest on a belief in a mysterious connection
    between the child and the father, so that the child suffers if the father breaks
    the rules.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Examples given are that if the father eats capybara the child’s teeth will
    grow like the animal’s teeth, and if he eats spotted labba the child’s skin will
    become spotted.
  category: relationship
  evidence_refs:
  - ev:9
