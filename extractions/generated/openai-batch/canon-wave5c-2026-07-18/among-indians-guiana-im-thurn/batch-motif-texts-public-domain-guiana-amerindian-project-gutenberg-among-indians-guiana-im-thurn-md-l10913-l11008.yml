canonical_text:
  quote: ''
  summary: The passage describes specialized manufacture, exchange, trade journeys,
    and ornamentation among several Indigenous groups in Guiana, including canoes,
    hammocks, poison, blow-pipes, cassava-graters, hunting dogs, pottery, weapons,
    and painted designs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Warraus are described as making the best canoes among the coast tribes
    and supplying neighbouring tribes; they also make a distinctive kind of hammock.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wapianas build boats for tribes in their interior district and serve as
    middle-men for distributing products made by the Tarumas and Woyowais.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: 'The Macusis have two products in demand among other tribes: ourali poison
    for arrows and blow-pipe darts, and cotton hammocks.'
  category: object
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:4
  text: The Arecunas grow, spin, and distribute cotton, and also supply blow-pipes
    made from palm stems procured beyond the Venezuelan boundary of their territory.
  category: action
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:5
  text: The Tarumas and Woyowais are described as having a monopoly on cassava-graters
    and as important breeders and trainers of hunting dogs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The True Caribs are described as the most skilful potters, while other groups
    sometimes make vessels for their own use but prefer Carib vessels when available.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: The Arawaks make a distinctive kind of fibre hammock and also make pottery
    for their own use.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Ackawoi are said to have no special product for exchange and are described
    as dreaded and disliked by other groups, with possible resulting self-dependence.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:9
  text: Manufacture exchange involves long journeys in which travellers carry goods
    outward and return with different goods; goods and news pass from district to
    district.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The passage reports a suggested pattern that ornamentation increases farther
    from the sea-coast, while also stating that coastal groups surpass inland groups
    in the neatness and strength of weapons.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Painted ornaments on pottery, weapons, posts, and walls are described as simple
    lines, irregular patterns, and occasional crude figures of a person or animal;
    the work is attributed to both men and women.
  category: object
  evidence_refs:
  - ev:5
