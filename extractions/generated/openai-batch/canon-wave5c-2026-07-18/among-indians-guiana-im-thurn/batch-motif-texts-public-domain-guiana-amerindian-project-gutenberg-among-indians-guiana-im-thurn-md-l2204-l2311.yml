canonical_text:
  quote: ''
  summary: The passage quotes an economic account of Brazilian cattle breeding, then
    applies it to savannahs near the upper Takootoo and Cotinga rivers. It describes
    proposed cattle farming, available food and labor, transport difficulties to Georgetown,
    and possible roads or river improvements. It then narrates a halt after leaving
    St. Joaquim at a farm where the travelling party obtains farine and purchases
    a young bull with gunpowder. The passage closes with a description of cattle-driving
    preparations, corrals with vultures, the surrounding savannah and mountains, and
    a note that stone axe-heads were found at a place called Toucana.
  language: English
  quote_policy: summarized
