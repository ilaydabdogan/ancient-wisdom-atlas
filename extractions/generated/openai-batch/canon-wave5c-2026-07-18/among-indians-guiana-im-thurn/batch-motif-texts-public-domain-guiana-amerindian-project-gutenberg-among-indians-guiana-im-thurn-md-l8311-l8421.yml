canonical_text:
  quote: ''
  summary: 'The passage describes the distribution of Indigenous settlements in forest
    and savannah regions of Guiana and distinguishes three main house types: Warrau
    pile-dwellings in swampy coastlands, wall-less forest houses used by Arawaks,
    Ackawoi, and True Caribs, and clay-walled savannah houses used by Macusis, Arecunas,
    and Wapianas. It gives details of a Warrau pile settlement, a forest clearing
    and house interior, household objects, hammocks, fires, and the comparatively
    cared-for Arawak house setting.'
  language: English
  quote_policy: summarized
