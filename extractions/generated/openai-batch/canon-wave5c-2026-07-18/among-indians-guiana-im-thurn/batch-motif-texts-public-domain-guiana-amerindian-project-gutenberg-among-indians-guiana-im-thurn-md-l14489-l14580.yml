canonical_text:
  quote: ''
  summary: The passage describes an ethnographic account of Guiana Indian attitudes
    toward spirits, distinguishing inactive harmless spirits from active harmful spirits.
    It lists avoidance practices meant to avert malignant spirits, including not naming
    or looking at certain objects, abstaining from certain meats, having a peaiman
    or old woman blow on taboo meat, and rubbing peppers or substitutes into the eyes
    at cataracts, new places, sculptured rocks, mountains, or stones. The author interprets
    eye-rubbing and eye-covering as an attempt to avoid attracting the attention of
    dreaded objects or spirits.
  language: English
  quote_policy: summarized
