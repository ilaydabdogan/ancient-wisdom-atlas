- id: obs:3
  text: The Indians are described as believing in harmless spirits and harmful spirits;
    the harmful spirits are active in affecting humans and other beings, while the
    harmless spirits are inactive in that respect.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that good events are accepted without inquiry or as results
