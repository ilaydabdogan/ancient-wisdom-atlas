  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Because of this view, the Indians are said to avoid actions that might bring
    the ill-will of spirits rather than trying to attract good-will from spirits.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports avoidance of mentioning or looking at certain rocks and
    other objects.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage reports avoidance of eating flesh from certain animals, with different
