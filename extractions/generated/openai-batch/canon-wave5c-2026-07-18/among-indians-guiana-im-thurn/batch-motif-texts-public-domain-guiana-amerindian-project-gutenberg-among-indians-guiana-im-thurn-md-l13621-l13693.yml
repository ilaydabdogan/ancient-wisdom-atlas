canonical_text:
  quote: ''
  summary: The passage recounts incidents in which Guiana Indian companions treated
    dreams as real events, including dream labor, dream assaults, and dream insults
    requiring waking punishment. The narrator explains these incidents as illustrating
    a belief that spirits can leave bodies during sleep, that other people's spirits
    can act in dreams, and that visions while awake are comparable to dreams, whether
    naturally occurring or deliberately induced.
  language: English
  quote_policy: summarized
