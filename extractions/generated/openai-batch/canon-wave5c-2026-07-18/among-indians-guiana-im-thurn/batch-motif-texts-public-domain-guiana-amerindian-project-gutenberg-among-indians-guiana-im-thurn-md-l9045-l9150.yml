  summary: The passage describes marriage arrangements, post-marital residence, a
    Macusi marriage ceremony, premarital meat abstinence, marital relations, polygyny,
    and the power of peaimen to acquire wives and travel with women carrying baggage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The nature of the wife-bargain is described as obscure, but sometimes involves
    purchase from parents or the giving of a girl in recompense for service.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: One stated proposed price for a wife included guns, cutlasses, an axe, razors,
    knives, blue cloth, and beads.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: After marriage is arranged, the husband moves his possessions to his father-in-law's
    house, lives there, works there, and obeys his wife's father as household head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A husband may make a final separation before children are born; after children
    are born, his departure is treated as desertion rather than lawful separation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the young couple's family grows too large, the husband builds a house
    beside his wife's father's house; after the head dies, house-fathers separate
    because it is considered uncanny to live where a man has died.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'In one Macusi marriage, the father required an orthodox ceremony: a small
    savannah area was cleared, eta-palm-pith mats were spread, the bride and bridegroom
    were placed there, and the village gathered around.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Macusi man abstains from meat for some time before marriage; one man refused
    venison during an expedition rather than break the marriage restriction.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Husbands and wives are described as generally faithful and affectionate, while
    the wife is also described as the man's property and as capable of exerting influence
    with him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Polygyny is described as varying among groups; where there is more than one
    wife, the first wife is generally favored, and later wives may serve as domestic
    helpers or successors.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Peaimen are described as using their influence to acquire many wives; an Indian
    asked by his peaiman for a daughter or wife is said not to dare refuse.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: When peaimen travel, women carry necessary baggage while the peaiman goes
    ahead adorned with feathers and paint and carrying his magic rattle and perhaps
    bow and arrows.
  category: action
  evidence_refs:
  - ev:8
