  summary: The passage describes preparation of cassava-based paiwari by burning cassava
    bread, mixing it with water, chewing fragments, boiling, and fermenting; an alternative
    drink, casiri, made from sweet-potatoes and sugar-cane; the importance of cassava
    in diet and reported bodily effects; salt procurement, barter, and use; and occasional
    foods, especially reptile eggs gathered seasonally from river sandbanks.
