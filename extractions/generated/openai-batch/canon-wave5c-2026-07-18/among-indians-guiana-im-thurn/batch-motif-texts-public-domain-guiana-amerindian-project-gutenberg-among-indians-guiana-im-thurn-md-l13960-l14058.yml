canonical_text:
  quote: ''
  summary: The passage describes beliefs attributed to Indians of Guiana concerning
    spirits in rocks and other material bodies, avoidance of remarkable rocks lest
    they cause misfortune, and ideas about diseases as mobile afflictions or bodily
    forms assumed by malicious kenaima spirits. It also recounts a reported 1856 epidemic
    in which True Caribs fled into the forest and blocked paths with felled trees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says a person’s own spirit is understood to move actively in dreams
    while the body lies motionless, and this is used to explain why a spirit within
    a motionless rock could also be active.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says injury by falling on a rock or by a rock falling on a person
    may be attributed to the rock as the immediate intentional instrument of the calamity.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says an abnormal or curious rock may be treated as cause and effect
    with a subsequent evil event, and the rock is then perceived as having a spirit.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage describes dry-season river-bed rocks with a glazed, vitrified,
    black appearance and says Indians asserted that mentioning this appearance would
    vex the rocks and make them send misfortune.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage identifies the mid-stream Essequibo rock paiwari-kaira as a curiously
    shaped rock that should not be mentioned or looked at, lest it be vexed.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says sculptured rocks are objects of awe, and that almost every
    first-seen or abnormal rock is believed to consist of body and spirit.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says many waterfalls, streams, and material bodies of every sort
    are supposed to consist of a body and a spirit as humans do.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author states that the primitive idea would be that all objects are animate,
    before later questioning whether stones have spirits and powers of action.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says the peaiman removes a body from a patient, and that the spirit
    causing the disease is supposed to be in that body.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says diseases are believed to move about the world much as men
    do.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage reports that during the 1856 buck-sickness epidemic on the Pomeroon
    river, True Caribs fled into the forest and cut down large trees to obstruct paths
    behind them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says Indians of Guiana also obstruct paths to prevent dangerous
    animals, such as jaguars, or hostile men from using them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The author interprets diseases not as distinct beings but as forms, visible
    or invisible, assumed by spirits of kenaimas, who are said to be capable of throwing
    their spirits into any body they please.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage says a disease-spirit may be situated in the bodily form of a
    stick or stone, and that a blocked forest path is blocked against the bodily form
    of a malicious kenaima.
  category: relationship
  evidence_refs:
  - ev:10
