canonical_text:
  quote: ''
  summary: The passage discusses ethnological classification and nomenclature for
    Guiana Indigenous groups. It explains that some apparent group names are settlement
    descriptors, proposes branch and tribe labels for Carib and Wapiana groups, treats
    Warrau and Arawak as branches for present purposes, compares languages and dialects
    among Warrau, Arawak, Wapiana, and Carib groups, and notes that physical differences
    among groups are subtle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Arawak companions are described as identifying some river settlements as “Caribisi,”
    which the passage glosses as indicating that True Caribs live there rather than
    naming a tribe.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author proposes using “True Caribs” for the tribe and “Carib” for the
    wider branch, and analogously “True Wapiana” for the tribe and “Wapiana” for the
    branch.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Warrau and Arawak groups may each be only of tribal rank,
    but are treated as complete branches represented by single tribes for the author’s
    present purpose.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The languages of the four branches named Warrau, Arawak, Wapiana, and Carib
    are described as distinct from one another, with any few shared words attributed
    to possible borrowing.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Within Warrau and Arawak respectively, the passage describes internal linguistic
    diversity as slight differences of pronunciation used by separate families.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says dialects of the Wapiana language are spoken by True Wapianas
    and Atorais, and possibly by Amaripas.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says four dialects of the Carib language are spoken by True Caribs,
    Ackawoi, Macusi, and Arecuna; it adds that Macusi, Arecuna, and Ackawoi speakers
    can understand one another, while the True Carib dialect is more distinct but
    recognisably related.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Physical differences among the groups are described as small; a stranger cannot
    readily distinguish groups by appearance, though the author says an accustomed
