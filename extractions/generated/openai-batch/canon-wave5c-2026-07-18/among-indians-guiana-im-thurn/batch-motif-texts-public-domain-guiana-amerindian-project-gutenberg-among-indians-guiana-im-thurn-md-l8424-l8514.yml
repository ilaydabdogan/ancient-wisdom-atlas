canonical_text:
  quote: ''
  summary: 'The passage describes house and settlement forms in Guiana: occasional
    windbreak walls in forest clearings; round or oval savannah houses with mud-plastered
    wattle walls, palm thatch, kitchens, and visitor sheds; clay preparation by women
    and children; dark interiors with hammocks, fires, stores, animals, and domestic
    activities; larger communal houses near the Brazilian border; and savannah pile
    houses compared with Warrau/coastal house forms.'
  language: English
  quote_policy: summarized
