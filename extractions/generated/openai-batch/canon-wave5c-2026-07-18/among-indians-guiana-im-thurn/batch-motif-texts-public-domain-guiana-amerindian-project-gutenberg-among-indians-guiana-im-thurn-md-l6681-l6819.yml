canonical_text:
  quote: ''
  summary: The passage presents an ethnographic classification of Guiana Indigenous
    groups by race, branch, tribe, and family. It emphasizes language as the primary
    basis for classification, supplemented by bodily features, customs, habits of
    thought, and degrees of hostility. It lists four branches—Warrau, Arawak, Wapiana,
    and Carib—describes tribes and sub-tribes within some branches, notes several
    unclassified groups, and explains the terminology of “True Carib.” It also compares
    the South American family system to the North American totem-system.
  language: English
  quote_policy: summarized
