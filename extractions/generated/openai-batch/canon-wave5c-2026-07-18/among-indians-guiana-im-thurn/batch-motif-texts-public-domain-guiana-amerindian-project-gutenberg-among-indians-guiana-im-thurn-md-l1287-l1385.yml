canonical_text:
  quote: ''
  summary: The narrator describes a quarrel with a peaiman, who threatens through
    Moé to kill the party in a stated order. After provisions run short and the peaiman
    begins preparing meals, the party falls ill in that same order. The narrator suspects
    intentional causation but says he cannot prove it, while Indians attribute the
    misfortune to disrespectful treatment of Paiwarikaira. The passage then describes
    fever and other illnesses, rest and resupply at Arinda, and a creek-path route
    toward the Demerara river used by savannah Indians.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The peaiman tied his hammock to the same tree as the narrator's, disturbed
    him at night, moved only after being told, and reacted angrily when laughed at.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Using Moé as interpreter, the peaiman said he would kill the whole party and
    stated the order in which he would do so.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The party's bread was exhausted, sickness began, Moé had been ill for several
    days, Moé and Woijeau were cooks, and the peaiman then undertook meal preparation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The party members became ill one by one in the same order as the peaiman's
    threat; the narrator suspected the peaiman but could not prove it, while Indians
    attributed the misfortune to disrespectful treatment of Paiwarikaira.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fever impeded the journey; the narrator describes the climate as hot by day,
    cold by night, and moist, and says such attacks are frequent and troublesome but
    rarely dangerous to temperate travellers of good constitution.
  category: setting
  evidence_refs:
  - ev:3
