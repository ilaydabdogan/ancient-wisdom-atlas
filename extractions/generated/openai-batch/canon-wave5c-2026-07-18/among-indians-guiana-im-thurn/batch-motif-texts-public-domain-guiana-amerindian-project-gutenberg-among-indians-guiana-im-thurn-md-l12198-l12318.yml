canonical_text:
  quote: ''
  summary: The passage describes feather shoulder and neck ornaments, tooth and seed
    necklaces, and several musical instruments used or made by Indigenous people in
    Guiana. It notes use contexts for feather collars, the construction and value
    of peccary-tooth necklaces, a Macusi refusal of a necklace attributed to a True
    Carib maker, and the use of animal skins, bones, reeds, bamboo, and palm fibre
    in drums, flutes, pan-pipes, trumpets, and an Aeolian-harp-like instrument.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shoulder ruff of macaw feathers is fastened so that the feathers stand out
    from the wearer’s body across the shoulders.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two feather collars are described, one made from white heron feathers and
    one from black powis feathers; their stripped feather webs form a fringe covering
    the shoulders and upper chest.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The heron-feather collar is especially worn by men running foot races, while
    the black-feather collar is worn when dancing and sometimes when paddling canoes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A valued necklace is made from many upper canine teeth of bush-hog or peccary,
    sometimes more than one hundred teeth, representing the spoils of many animals.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The peccary teeth are filed, pointed, embedded side by side in a fibre-woven
    cord, kept white, and occasionally reset for cleaning.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: A Macusi man refused to wear a necklace attributed to a True Carib maker,
    although the described differences in manufacture were slight to an outsider.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Other necklaces are made from teeth of acourie, caymans, jaguars, water-haas,
    deer, or from seeds; the passage states that none of these has the special value
    of the peccary-tooth necklace.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Drums are made from hollowed palm trunk sections with animal-skin heads, and
    one end may include a thread and wood splinter that produces a metallic sound
    when beaten.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The skin of the baboon or howling monkey is preferred for drums because it
    is supposed to possess the power of emitting rolling, roaring sounds.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: A related percussion instrument is made by stretching baboon skin over a hollow
    bamboo and striking it repeatedly against the ground.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Flutes are made by piercing holes in jaguar or deer bone, and less commonly
    human bone; some are engraved, colored, and fitted with white cotton tassels.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage also mentions wooden flutes used in pairs, pan-pipes of hollow
    reeds, rude wooden trumpets, and an Aeolian-harp-like instrument made from separated
    palm leaf-stalk fibres.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
