- id: obs:10
  text: Cooshie ant nests are described as bare heaps of yellow sandy earth, often
    many yards across.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Cooshie ants forage along narrow worn paths, especially for leaves, and can
    strip cultivated cassava and orange-trees.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Cooshie ants cut leaves into small pieces, each carried by a single ant, so
