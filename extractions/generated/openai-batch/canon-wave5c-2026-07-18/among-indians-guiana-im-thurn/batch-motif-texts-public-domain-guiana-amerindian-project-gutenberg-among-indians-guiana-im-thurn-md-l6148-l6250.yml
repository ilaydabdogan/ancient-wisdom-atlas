canonical_text:
  quote: ''
  summary: 'A descriptive passage on ants in the Guiana forest: their ubiquity and
    variety; the painful sting of the manoorie ant; the mass hunting behavior of Yackman/Eciton
    ants; the leaf-cutting and specimen-raiding behavior of cooshie ants; and the
    reported inseparability of a mauve orchid and an ant, with Indians warning that
    the plant cannot grow without the insect.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ants are described as extremely numerous, varied, and present on ground, tree-trunks,
    creepers, stems, and leaves throughout the forest.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some ants live in hollow, jointed plant-stems; some move singly or in pairs,
    while others move in vast bands.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The manoorie ant is a large black ant whose sting is described as very painful
    and sometimes fever-producing.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator was stung on the back of the neck by a manoorie while climbing
    a fallen palm-tree to measure it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Yackman/Eciton hunting party advanced as a broad moving mass of black ants
    that passed for nearly half an hour.
  category: action
  evidence_refs:
  - ev:3
