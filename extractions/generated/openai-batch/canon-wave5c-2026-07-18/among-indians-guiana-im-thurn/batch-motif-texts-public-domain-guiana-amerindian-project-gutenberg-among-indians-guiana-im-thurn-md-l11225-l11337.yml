canonical_text:
  quote: ''
  summary: 'The passage describes several Guiana Indigenous basket forms and related
    crafts: raised baskets, the suriana load basket, the quake provision basket, cotton-fibre
    baskets, iturite-stem basket construction, temporary baskets, leaf-lined provision
    packing, Nikari-karus pegalls, decline of basketry under outside influence, cassava-graters
    made by Woyowais and Tarumas and distributed by Wapianas, and string fibres used
    for lines, bow-strings, tying, and cloth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raised deeper baskets on wooden legs are described as made and used by Arawaks,
    True Caribs, and most other Indians of the forest.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The suriana is a common load basket used for carrying cassava and other roots,
    firewood, hammocks, cooking utensils, and travelling goods; it is slipper-shaped
    and supported by a broad bark band across the carrier's forehead.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The quake is a rounded-bottom basket of open wicker-work used for storing
    provisions, confining young birds and animals being tamed, and many everyday purposes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Special round baskets shaped like flat basins or saucers are made to hold
    cotton fibre after separation from seeds and before spinning.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Many baskets are made from iturite stems split into parallel pieces, used
    natural, bleached, or black-stained, and closely woven into dense walls with possible
    intricate coloured patterns.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Macusi make waist-belts for supporting the cloth lap from strips of iturite
    stems.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Rough surianas and quakes intended for brief or emergency use are woven from
    strong bush-rope, roughly prepared iturite strips, or leaflets of a single palm-leaf.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Quakes used to pack farine, salt, and cassava bread are lined with ordered
    iturite leaves in successive rows as provisions are added, then covered and tied
    to guard the contents against damp.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Nikari-karus, living on the Brazilian borders, make pegulls from leaves
    of a palm growing near the Oorooa rapids on the Roopoonooni; these pegalls are
    square or oblong like Arawak pegalls.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The author states that Indian basket-work is neat and that the art is dying
    out where white influence is felt, and suggests missionaries could help retain
    native arts.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: Cassava-graters are described as made only by the Woyowais and Tarumas and
    distributed through the interior by the Wapianas.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Cassava-graters are oblong curved boards with drilled holes holding angular
    fragments of granite or hard stone fixed by black karamanni pitch, producing a
    rough surface used to reduce cassava roots to pulp.
  category: object
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:13
  text: Grater boards are sometimes painted and carved, and makers pack each in a
    single layer of waterproof iturite leaves before handing them to the Wapianas.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Thread or string is used for fishing-lines, bow-strings, tying, and some cloth-making;
    the fibres named are cotton, tibisiri from the eta palm, and crowia from the silk
    grass-plant.
  category: object
  evidence_refs:
  - ev:11
