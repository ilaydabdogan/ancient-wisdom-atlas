canonical_text:
  quote: ''
  summary: 'The passage describes the construction of darts, arrows, bows, and poison
    use, then describes ornaments made from feathers, teeth, or seeds. It gives detailed
    procedures for two feather headdress forms: a crown-like form with a basket-like
    wicker frame, cotton band, feather rows, and upright macaw feathers, and a halo-like
    form with a narrow circular wicker frame and feather rows inserted into a groove.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dart apparatus is described as propelling the dart into the air with force
    and as simple but skilfully made.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ourali, also called curare or urari, is identified as a poison used for darts
    and for certain arrows shot from a bow.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Arrows are described as having long reed shafts, usually with a short hard-wood
    fore-shaft fastened with pitch and bound with cotton.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Arrow points may be formed by a sharpened and barbed fore-shaft, or by a distinct
    point of iron, hardened bamboo, or rarely turtle-bone.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The arrow notch is made by crossed slits in the reed end, removal of pith,
    insertion of a notched hard-wood plug, and cotton binding.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Arawaks, Ackawoi, and True Caribs are named as making the neatest arrows
    among the various tribes mentioned.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Bows are described as very long, straight, and made of hard wood, usually
    purpleheart or, for ornament, letter-wood; the bowstring is twisted from crowia-fibre.
  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: Ornaments are described as generally simple, made of feathers, teeth, or seeds
    tied together; feather ornaments chiefly include two kinds of headdress and shoulder
    ruffs or mantles.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: One headdress form has feathers standing crown-like around the head; another
    has feathers standing outward from the head and is compared to a saint's halo
    in an old picture.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: The crown-like headdress uses a light wickerwork frame, woven cotton band,
    sorted rows of feathers, a narrow cotton fillet coated with white earth, and three
    upright red macaw tail feathers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: When the crown-like headdress is not in use, the feather band can be slipped
    from the frame and rolled compactly, while the long feathers are removed and stored
    in a closely plaited wicker cylinder.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The halo-like headdress uses a narrow circular wickerwork frame with a groove,
    into which several rows of feathers are drawn base inward; the example described
    has white, green, red-and-green, and black rows.
  category: object
  evidence_refs:
  - ev:6
