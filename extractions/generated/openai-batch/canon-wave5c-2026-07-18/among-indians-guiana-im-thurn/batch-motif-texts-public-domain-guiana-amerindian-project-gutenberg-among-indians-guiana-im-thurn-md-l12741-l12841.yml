canonical_text:
  quote: ''
  summary: 'Ethnographic description of a multi-day feast or fair: visitors arrive
    by boat with provisions and barter goods, are received formally by a headman,
    are served paiwari and food, paint and ornament themselves, carry instruments,
    process around a liquor trough with chant and stamping, interrupt the procession
    for drinking, and eventually dance outside.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Liquor has been prepared before the guests arrive, and the entertainment lasts
    several days, often a week.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Visitors arrive in family parties by canoes, corials, or woodskins, bringing
    hammocks, provisions, and sometimes goods for barter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: As boats approach, men announce arrival with a cry peculiar to their tribe,
    and settlement people except the headman go to the landing-place to receive them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Arriving men go up to the houses while arriving women unload boats, carry
    goods, and sling hammocks for relatives and then themselves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The headman or captain remains in his hammock while each male newcomer addresses
    him in turn, gives news, and receives grunted assent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women of the house bring each seated man a calabash of paiwari, refill it
    when emptied, and set pepperpot and bread before him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: By daybreak for the feast, men, women, and children paint and ornament themselves;
    children and sometimes monkeys are dressed similarly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Feasters take weapons and instruments including seed-rattle sticks, hollow
    bamboos, feathered rattles, drums, bone and reed flutes, pan-pipes, and sticks
    topped with painted animal images.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: All form a procession around the liquor trough, chant, keep step, stamp their
    feet, and wave instruments in measured time.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The procession periodically breaks with loud cries; women bring paiwari for
    men, then women drink, and the procession reforms.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Drinkers consume large quantities, become increasingly excited, leave the
    house, and dance in the open space outside.
  category: sequence
  evidence_refs:
  - ev:8
