canonical_text:
  quote: ''
  summary: The passage summarizes evidence from shell-mounds near the Pomeroon and
    toward the Orinoco, including shell layers hardened by fire, stone implements,
    scarce pottery and ornaments, animal remains, fish and mollusc remains, and human
    bones interpreted as indicating cannibalism. The author argues from these observations
    that the mound-makers were not local permanent residents but sea-arriving strangers,
    identified by the author as Island Caribs who later became known in Guiana as
    True Caribs. Further reasoning connects repeated occupation, scarce mammal bones,
    absence of pottery, and swamp-island locations with temporary visits by travelers
    or marauders in hostile country.
  language: English
  quote_policy: summarized
