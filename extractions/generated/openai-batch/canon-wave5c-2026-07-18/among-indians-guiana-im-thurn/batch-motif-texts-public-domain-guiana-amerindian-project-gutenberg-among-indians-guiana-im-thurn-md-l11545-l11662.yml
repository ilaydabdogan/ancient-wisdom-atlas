canonical_text:
  quote: ''
  summary: 'The passage describes manufacture and use of Guianese hammocks, bands,
    and cloth: cotton and tibisiri-fibre hammocks by named groups; square-frame weaving
    with separate women''s and men''s tasks; Arawak and Warrau fibre variants; child-carrying
    shoulder bands; compact cloth bands, fillets, feast strips, garments, bark cloth,
    and Arecuna cotton aprons.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the principal hammocks in British Guiana are made of cotton
    or tibisiri fibre; cotton hammocks are attributed to Macusis, Wapianas, and sometimes
    True Caribs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cotton hammocks are made on an adjustable square frame formed from four wooden
    bars.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A continuous cotton thread is wound around the frame so that parallel, equidistant
    threads form the hammock's longitudinal bars.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cross-bars are formed from three plaited cotton strands, with each longitudinal
    bar inserted into the plaits in sequence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women perform the hammock work up to the point when the hammock is removed
    from the frame.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Men prepare and add the scale-lines, measuring loop lengths so the hammock
    hangs evenly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Arawaks make parallel-thread tibisiri fibre hammocks; similar hammocks are
    said to be probable among Woyawais and Tarumas, but the passage states uncertainty.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Warrau fibre hammocks are made of tibisiri fibre but are netted from one continuous
    string rather than arranged in straight lines.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Each tribe makes small hammocks or broad endless bands worn by women over
    the shoulder for carrying children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some True Caribs make close-woven Brazilian hammocks, and the passage says
    this art was copied from Brazilian-Indian half-breeds settled on some rivers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some tribes make compact cotton leg and arm bands woven directly onto the
    limbs, as well as narrow cotton fillets worn by women in the hair and by men on
    feather crowns.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Men's feast shoulder strips are described as patterned cotton cloth made with
    various stitches; the passage says the art of making them has been lost and surviving
    examples are rare.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Before European ready-made cloth, the passage says it is probable that some
    people wove men's and women's garments; in some tribes Lecythis inner bark was
    used, and remote Arecuna women still make cotton aprons adorned with seeds.
  category: sequence
  evidence_refs:
  - ev:9
