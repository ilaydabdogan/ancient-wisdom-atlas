canonical_text:
  quote: ''
  summary: The passage first describes a wrestling-shield contest in which two opponents
    push against one another until one is forced back. It then introduces kenaimas
    and peaimen as influential figures in Indian life, presenting kenaimas as sources
    of injuries and deaths and peaimen as doctors, priests, or magicians who cure
    or guard against such harms. The passage explains a belief that tangible things
    have separable body and spirit components, and that a kenaima uses voluntary separation
    of spirit and body to inflict vengeance. It further describes the kenaima as a
    retaliatory slayer bound by customary duty, compares this system to other retaliatory
    customs, and states that such recognized retaliation persists among Guiana Indian
    tribes.
  language: English
  quote_policy: summarized
