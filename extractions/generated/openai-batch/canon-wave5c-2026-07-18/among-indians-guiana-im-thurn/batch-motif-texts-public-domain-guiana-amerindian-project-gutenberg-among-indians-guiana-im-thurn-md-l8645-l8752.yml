canonical_text:
  quote: ''
  summary: 'The passage describes forms of authority and social order in Guiana Amerindian
    societies as reported by the author: household rule by fathers, influence of peaiman
    through supposed power over spirits and disease, settlement headmen as successful
    hunters and organizers, colonial appointment of district captains with certificates
    and staffs, and social norms of obedience, mutual rights, public opinion, and
    blood revenge.'
  language: English
  quote_policy: summarized
