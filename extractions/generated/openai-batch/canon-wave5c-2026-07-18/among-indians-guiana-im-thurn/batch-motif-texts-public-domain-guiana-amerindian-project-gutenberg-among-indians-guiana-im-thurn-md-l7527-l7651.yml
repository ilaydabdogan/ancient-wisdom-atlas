  summary: The passage lists numbered Arawak family names and gives reported meanings
    or disputed etymologies. Many names are explained as being 'from' or 'sprung from'
    animals, birds, insects, trees, palms, plants, or other referents. One Aramokéna
    account says representatives of different families once met to give names to their
    families, and each chose the name of a nearby object; the Aramokéna representative
    chose the arara tree because its leaves lay on the ground where he sat.
