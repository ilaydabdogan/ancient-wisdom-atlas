  summary: The passage describes the savannah landscape around Quatata, scarcity of
    food and water on arrival, the history of the nearby abandoned settlement of Pirara
    and its Anglo-Brazilian dispute, the later rise and house forms of Quatata, and
    a house-visit etiquette in which visitors are offered paiwari in a calabash and
    are expected to finish it before freely observing and asking questions.
  language: English
