  quote: ''
  summary: The passage describes personal cleanliness, bathing and swimming, exceptions
    to washing, practices of bodily modification and adornment, and ordinary clothing
    among several Indigenous groups of Guiana as represented by the author.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author says that, with exceptions, Indians are extremely clean in personal
    habits and that men and women go together to nearby water early in the morning
    and often during the day to bathe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author describes men and women as strong swimmers with a particular leg
    motion, and says they bathe immediately after every meal without apparent ill
    effects.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author connects frequent washing with fine and smooth skin.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Warraus and some Ackawoi families, especially on the Potaro river, are
    presented as exceptions who never wash.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A little-known tribe near the sources of the Essequibo is described as tying
    boards to young children's heads so that the skull becomes permanently flat; the
    same practice is reported as formerly existing among Caribs but no longer practiced.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the True Caribs, cotton bands are knitted around each ankle and below
    each knee of very young female children and are kept on through life, producing
    pronounced calf swelling between constricted areas.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Macusi and Arecuna women are described as having one constriction above each
    ankle, while other groups are said not to distort the legs in that fashion; all
    Indians are said generally to wear string, cotton, or bead bands around ankles
    and arms.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author says all Indians remove by the roots most hair not growing on the
    scalp, sometimes including eyebrows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: True Carib and Ackawoi women, and more rarely women of other tribes, are described
    as piercing the lower lip and inserting pointed pins or sharpened wood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Men are described as piercing the lower lip for a hanging chin ornament, piercing
    the nose septum for a half-moon ornament, and piercing the ears; women sometimes
    pierce the ears as well.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After babyhood, Indians are said not to be seen perfectly naked; men wear
    a lap, women wear a queyu, and very young children commonly have a waist string
    before wearing these garments.
  category: object
  evidence_refs:
  - ev:8
