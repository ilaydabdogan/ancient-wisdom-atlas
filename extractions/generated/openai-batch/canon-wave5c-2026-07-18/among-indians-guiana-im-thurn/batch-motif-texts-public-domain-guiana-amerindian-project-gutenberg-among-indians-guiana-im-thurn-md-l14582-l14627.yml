canonical_text:
  quote: ''
  summary: 'The passage summarizes the author''s account of Guiana Indian animism:
    humans and perceptible objects have bodies and separable spirits; spirits may
    survive after death, differ in activity or malice, and may be contacted by a peaiman
    in ecstasy. It also mentions belief in the reality of dreams, a country beyond
    the sky attainable by living people, spirits in natural phenomena such as water,
    and ancestral spirits.'
