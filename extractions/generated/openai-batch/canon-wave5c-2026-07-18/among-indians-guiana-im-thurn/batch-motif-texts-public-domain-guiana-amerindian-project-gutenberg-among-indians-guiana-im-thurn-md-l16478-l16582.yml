canonical_text:
  quote: ''
  summary: The passage describes stone implements in Guiana as occurring in shell-mounds,
    on the ground surface, and preserved in Indian houses. It compares shell-mound
    tools with more elaborate island Carib examples, proposes that simpler tools were
    carried on travel or raids, discusses surface finds near the Orinoco and Toocano,
    and explains retained stone implements as pottery-polishing tools and as objects
    with possible non-utilitarian or superstitious value. Notes mention a special
    arrow-maker in Hiawatha traditions and argue that so-called charm-stones are likely
    natural water-worn pebbles used for polishing clay.
  language: English
  quote_policy: summarized
