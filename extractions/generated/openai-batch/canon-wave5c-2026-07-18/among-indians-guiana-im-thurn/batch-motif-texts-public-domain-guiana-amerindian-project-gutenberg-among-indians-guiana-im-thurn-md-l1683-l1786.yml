  quote: ''
  summary: A travel narrative passage describes a crowded gathering of Indians with
    families, animals, fires, ornaments, babies, and necklace exchanges; subsequent
    canoe travel past settlements affected by scarcity; changing river and savannah
    scenery including a mountain; a camp near a pond of royal water-lilies and birds;
    arrival at Pirara after forty-nine days; and Macusi family parties arriving with
    music, bows, arrows, hammocks, and baggage-carrying duties.
  language: English
