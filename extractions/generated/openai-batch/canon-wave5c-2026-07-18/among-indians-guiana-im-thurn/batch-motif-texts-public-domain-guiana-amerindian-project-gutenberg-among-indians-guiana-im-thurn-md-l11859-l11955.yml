canonical_text:
  quote: ''
  summary: The passage describes wooden watercraft, paddles, sails, benches, and weapons
    made and used by several Indigenous groups in Guiana and neighboring regions.
    It emphasizes practical adaptation to rivers, use of tree materials, carving and
    ornamentation, animal-shaped benches, weapon finishing, and decorated war-clubs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Woodskins are chiefly made and used by the Ackawoi and Arecunas, and by other
    Indians living on rocky rivers with falls and rapids; their lightness allows portage
    around obstructions, and they are kept sunk under water when not in use.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Paddles are hewn with cutlass or knife from timber or from the board-like
    buttresses of the paddle-wood tree; most groups use broad oblong blades with round
    shafts and small semilunar handles.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Wapiana are described as an exception, using paddles with circular blades,
    rounded shafts, and straight cross-handles; similar paddles are said to be used
    by Brazilian Indians of the Rio Branco.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Paddles are often roughly ornamented with painted figures and patterns.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Square sails made from strips of eta-palm pith are rarely used on lower, broader
    rivers near the sea-coast; Warraus are described as especially apt at making and
    using them, while True Caribs and Arawaks sometimes use them.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Low wooden benches are used in houses, partly to raise the sitter above floor
    jiggers; they may be carefully scooped and shaped for comfort.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Benches are often carved as grotesque figures of tortoises, frogs, armadilloes,
    alligators, and other animals; one Carib example outside Guiana is shaped as a
    man on all fours, with the seat formed by the middle of his back.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Bright-coloured seeds, and sometimes pebbles, are inserted into carved benches
    to represent eyes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Weapons receive more time and care than larger wooden articles and are smoothed
    and polished; fish palate bones serve for rough smoothing, and rough leaves serve
    for final smoothing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The war-club, called tuki by Carib tribes, is described as the only war weapon
    now seen; it is probably no longer made and is carried more as an ornament than
    for use.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: War-clubs are made of hard heavy wood and may be decorated with engraved white-filled
    patterns, polished surfaces, red or white cotton bindings, fringes, streamers,
    tassels, and bright-coloured feathers.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: War-club shapes are said originally to have differed by tribe, though differences
    have become less distinct; one four-sided form appears to have been appropriated
    by the Macusis.
  category: relationship
  evidence_refs:
  - ev:6
