canonical_text:
  quote: ''
  summary: 'The passage describes several animals in Guiana: venomous and nonvenomous
    snakes, river turtles and tortoises, jaguars eating turtles, frogs and toads,
    and abundant fish. It includes a first-person near encounter with a labarria snake,
    a statement attributed to Indians that a second snake is usually found where one
    is found, and natural-history observations about animal abundance, food use, sounds,
    and habitats.'
  language: English
  quote_policy: summarized
