canonical_text:
  quote: ''
  summary: An Arawak account describes Carib attacks on the Arawaks of the Pomeroon.
    In one attack, the Arawaks hide noncombatants, set a concealed underwater tree-trunk
    barrier, lure pursuing Carib canoes into it, and ambush them. In a later attack,
    they capture and release the Carib chief, which the story presents as ending the
    feud. The narrator then qualifies this with notes on continued Carib oppression,
    Arawak source bias, continuing mutual dread and contempt, and a contrast with
    Warraus having no comparable war tale.
  language: English
  quote_policy: summarized
