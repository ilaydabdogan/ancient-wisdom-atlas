    of Jonah in the whale, Hiawatha in the sturgeon Nahma, Brer Rabbit and Mr. Fox
    in the Cow Bookay, and the seven kids in the wolf.
  claim_level: same_motif
  target: animal-belly entry and safe escape stories named by the narrator
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
