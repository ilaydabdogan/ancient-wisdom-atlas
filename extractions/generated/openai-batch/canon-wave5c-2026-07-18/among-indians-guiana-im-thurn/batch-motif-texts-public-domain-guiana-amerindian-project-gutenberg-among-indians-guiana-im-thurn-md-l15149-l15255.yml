canonical_text:
  quote: ''
  summary: The passage surveys Guiana Indian fireside tales about fictitious peoples
    and animals, including hidden mountain-dwellers, fish-human Hooronis, water-sleeping
    people, monsters of rocks and rapids, and an omar killed from within by an Ackawoi
    peaiman. The narrator then compares the omar tale to other animal-belly escape
    stories and closes with a historical Arawak account of warfare against Meyanow
    and Caribs.
  language: English
  quote_policy: summarized
