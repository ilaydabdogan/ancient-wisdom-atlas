canonical_text:
  quote: ''
  summary: A first-person travel narrative describes Gluck Island, a pond formerly
    known for Victoria regia lilies, the finding and eating of cayman eggs, a night
    alarm about alleged Ackawoi keneimas, camp eating practices, a pre-dawn chant
    connected by Moé to a heron identified as a peaiman or medicine man, a failed
    tapir hunt, and river scenery with forests, hills, islands, sandbanks, turtles,
    and razor-bills.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator visits a pond on Gluck Island, climbs a tree to see over dense
    vegetation, and reports that the Victoria regia lily has nearly disappeared there
    after dry weather.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cayman's nest is found in a dark, damp place among rotting leaves near the
    pond, with thirty-seven thick-shelled eggs on a heap of decaying vegetable matter
    attributed to a parent cayman.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The True Caribs take the cayman eggs as a delicacy, and the narrator later
    eats part of one boiled hard.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At night the Indians insist on loading guns near the hammocks because they
    say Ackawoi-keneimas, glossed as murderers, are nearby; the narrator states that
    this particular accusation is unfounded.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Indians sit in a circle around camp fires, continue eating late into the
    night, and later suspend meat above their hammocks near their mouths.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before dawn the narrator hears a monotonous chant with repeated syllables
    and grunts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Moé is identified as the singer and explains, while pointing to a heron flying
    high over the river, that the honuré or heron is a peaiman, a medicine man, singing
    as it flies.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator says no Macusi will eat the flesh of the heron.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: After all the meat is finished, the Indians wait while their best huntsman
    tries unsuccessfully to get the mother tapir.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The river banks are described as densely forested, with low land, rocky slopes,
    mountains, hilltop views over treetops, islands, sandbanks, turtle egg-laying,
    and razor-bill nesting.
  category: setting
  evidence_refs:
  - ev:7
  - ev:8
