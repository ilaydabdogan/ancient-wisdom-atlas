  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A boy of about five is described sitting on a large turtle-shell and smoking
    a long bark cigarette.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Stone hatchets and similar stone implements are said to occur comparatively
