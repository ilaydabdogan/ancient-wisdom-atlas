canonical_text:
  quote: ''
  summary: The narrator describes traveling across savannah and rivers to Euwari-manakuroo,
    arranging for the Nikari-karu headman Chirura to serve as guide and interpreter,
    staying at a mixed settlement near the Canakoo mountains and a waterfall, observing
    local social practices and stone implements, and then departing by canoe toward
    the Takootoo and Amazon watershed. Before departure, accompanying men give their
    wives knotted strings or quippus to count the days until the men return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that fear of capture and enslavement by Brazilians made
    people reluctant to cross the frontier, but the difficulty was eventually overcome.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator's party walked for three days across savannah, crossed several
    small rivers, and reached Euwari-manakuroo near the Takootoo river.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The party sought Chirura, a Nikari-karu headman, as guide and interpreter
    and also wanted to borrow a canoe from him; they succeeded after waiting several
    days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Euwari-manakuroo is described as three large multi-family houses on open savannah,
    high ground, near the Canakoo mountains and within hearing distance of a waterfall.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The settlement population is described as including Nikari-karus, several
