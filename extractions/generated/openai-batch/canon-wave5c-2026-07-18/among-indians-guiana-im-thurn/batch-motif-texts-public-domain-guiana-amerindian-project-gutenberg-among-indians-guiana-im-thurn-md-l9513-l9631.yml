canonical_text:
  quote: ''
  summary: 'The passage describes fish-shooting practices in Guiana: detachable harpoon-arrows
    for pacu at rapids, other arrow forms for smooth water, a high-water bait stratagem
    using lana fruit in a floating wicker basket, and trident-like arrows for shallow
    or spawning fish, followed by preservation of fish or roes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fish-arrow head is loosely inserted so that it detaches after striking a
    fish, while a line connects the arrowhead, floating shaft, and shooter's wrist.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Harpoon-arrows are used principally for shooting pacu in the large rivers
    of Guiana.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the dry season, low clear water, exposed rapids, and flowering pacu-grass
    draw pacu to feed at the falls.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Large numbers of Indians camp beside the falls to shoot pacu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A shooter stands on a rock, or sometimes in the force of the water, watches
    the turbulent surface, aims, and shoots at pacu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After a pacu is struck, the arrow shaft floats and the line allows the shooter
    to haul the fish onto the rock.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Caught pacu are loaded into a canoe, taken to camp, cut open, cleaned, salted,
    slit, and dried on rocks in the sun.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'In smooth river reaches, two other fish-arrow forms are used: one with a
    detachable head connected to a floating shaft as a marker, and another with the
    head permanently attached to the shaft.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Fish-arrow heads may have either double symmetrical barbs or a single side
    barb, according to the owner's preference.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: When high, rain-dulled water hides fish, an open wicker basket filled with
    lana fruit is floated downstream as bait while a shooter follows by canoe or wood-skin
    with another man paddling.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A trident-like fish-arrow with three singly barbed prongs is used for small
    fish in shallows and for larger spawning fish; fish roes are extracted, smoked,
