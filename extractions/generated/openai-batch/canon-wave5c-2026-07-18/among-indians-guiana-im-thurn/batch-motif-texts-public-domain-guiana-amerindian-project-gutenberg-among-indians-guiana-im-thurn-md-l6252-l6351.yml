canonical_text:
  quote: ''
  summary: 'The passage describes several insects in Guiana: methods for diverting
    or disrupting ant columns; termite tunnels and large savannah nests; bee and wasp
    nests in forests and sand; the homing behavior of sand-wasps; and the seasonal
    or local occurrence of mosquitoes, sandflies, kaboora, jiggers, and ticks as pests
    of travelers and Indians.'
  language: English
  quote_policy: summarized
