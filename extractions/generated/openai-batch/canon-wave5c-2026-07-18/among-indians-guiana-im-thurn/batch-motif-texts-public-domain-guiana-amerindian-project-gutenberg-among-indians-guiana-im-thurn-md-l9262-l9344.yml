canonical_text:
  quote: ''
  summary: 'The passage describes hunting as part of social life: boys learn to use
    small weapons, hunters travel for hunting or fishing and then rest at home, hunters
    avoid going alone, and pre-hunt practices are performed to secure success. These
    practices include charm plants given to dogs, smoke and insect ordeals for dogs,
    and painful self-treatments by the huntsman using a nose-string, ants held in
    a mat, or irritating caterpillars. The author says he has seen these practices
    among Macusis, Arecunas, and Ackawoi.'
  language: English
  quote_policy: summarized
