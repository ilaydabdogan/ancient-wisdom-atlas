  summary: The passage describes Guiana Indian manufacture of utensils, weapons, and
    ornaments; the decline of some older crafts under European manufactured imports;
    patterns of male work, hunting, rest, and craft-making; and an intertribal division
    of labor in which traders exchange specialized products, move safely through hostile
    territory, and carry news. It ends with an anecdote about Macusis seeing Arecunas
    arrive with cotton-balls and blow-pipes for exchange.
