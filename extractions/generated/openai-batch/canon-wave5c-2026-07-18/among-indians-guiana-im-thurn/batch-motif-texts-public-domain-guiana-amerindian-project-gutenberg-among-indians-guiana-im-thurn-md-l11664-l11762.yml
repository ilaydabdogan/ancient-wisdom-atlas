canonical_text:
  quote: ''
  summary: The passage describes plaiting, gendered craft work, woodworking, and canoe-building
    among Indians of British Guiana. It notes materials used for men's waist-belts,
    men's making of women's cotton head fillets, men's wood-working with simple tools,
    four types of boats, Warrau and Wapiana skill in boat-building, and the stages
    by which a tree is felled, hollowed, moved to water, widened with fire, wet sand,
    or running water, fitted with crossbars and planks, and caulked with bark, resin,
    pitch-like karamanni, and wild bee wax.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Plaiting is described as probably older than weaving and is chiefly used for
    making men's waist-belts that support the cloth worn between the legs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The waist-belts are said to be made from different materials by different
    tribes, including cotton, fibre, basketwork strips, and hair of men or monkeys.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Schomburgk is cited as saying human hair was frequently used for these belts
    about forty years earlier; the passage says monkeys' hair is now more commonly
    used, probably because intertribal war has almost ceased.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cotton fillets worn by women around their heads are said to be made only by
    men.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wood-working among the Indians of British Guiana is described as an admired
    simple art done only by men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says older stone axes, scrapers, and chisels are no longer used,
    and that the usual tools are an axe, a cutlass, and a knife, sometimes with a
    small adze or nails obtained from Europeans.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Boat-building is described as the most important form of carpenter's craft
    because much Indian life is spent on water.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Four kinds of boats are named: canoe, corial, buckshell, and woodskin.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Warraus on the coast and the Wapianas in the interior are described as
    especially apt boat-builders, and their canoes are a principal barter article
    with other tribes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: To make a canoe, a suitable tree is sought in the forest, sometimes far from
    the nearest river or creek, then felled and roughly shaped where it falls.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The canoe is hollowed partly with axe or adze and partly by burning out the
    interior.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A path is cleared and laid with wooden runners so the canoe can be dragged
    to the water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The unfinished canoe initially has close, parallel sides and gaps at bow and
    stern so the sides can later be forced apart.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The sides of the canoe may be spread by inverting it over fire, by filling
    it with wet sand, or by sinking it in running water and then driving wedges between
    the sides.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: After the sides are spread, hard-wood bars and benches are fixed inside to
    prevent the sides from closing again.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Triangular wooden pieces are fitted into the gaps at bow and stern, and an
    extra plank is added to raise the sides and squared ends.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: The junction between the plank and dug-out body is caulked with scraped inner
