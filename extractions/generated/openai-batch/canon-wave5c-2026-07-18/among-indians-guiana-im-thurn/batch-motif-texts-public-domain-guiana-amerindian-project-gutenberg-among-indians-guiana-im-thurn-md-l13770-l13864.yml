  quote: ''
  summary: The passage reports beliefs in which a spirit may pass from its usual body
    into animals or inanimate objects. It describes the kenaima as able to assume
    animal form, especially jaguar or tiger form, or to appear as an object extracted
    from a patient by a peaiman. It then states that, in the described worldview,
    humans, animals, and inanimate things are all beings with body and spirit, differing
    chiefly in bodily form, power, and cunning.
  language: English
