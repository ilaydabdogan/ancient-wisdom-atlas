canonical_text:
  quote: ''
  summary: The passage describes shallow and deep rock drawings in Guiana, including
    a large indistinct figure on Temehri rock, mapped and observed figures on Temehri
    island, a worn shallow engraving at the Cabalebo fall, and a general comparison
    between larger abstract shallow figures and smaller grouped deep engravings of
    humans, animals, snakes, and line patterns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Temehri rock figure is described as thirteen feet high and five feet seven
    inches wide, and as much larger than figures of the deep sculptures.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Temehri rock figure is very indistinct, becomes visible after water is
    poured over the rock surface, and had to be marked with white chalk for photography.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A note states that timinere or timehri signifies painted, and discusses its
    use in the name Paira temehri for marked heartwood.
  category: other
  evidence_refs:
  - ev:8
- id: obs:4
  text: 'Downer’s 1844 map of Berbice shows two supposed Temehri island rock drawings:
    one with an upright line and volutes, and another resembling a combination of
    straight-handled tridents.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author failed to find the trident-like figure on Temehri island but found
    the original of the six-volute figure; when carefully traced it differed from
    the map representation and was classed by depth as a shallow engraving.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Several other shallow drawings occur on Temehri island; some were too indistinct
    to decipher, and one common shallow-class figure was hidden by a tree until the
    tree was cut down.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A shallow rock drawing at the first fall on the Cabalebo is on the eastern
    face of a gneiss boulder at the edge of the fall, partly surrounded by shallow
    water and likely partly submerged when the river is full.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Cabalebo figure is very slightly incised and worn, but additional nearly
    obliterated strokes make it resemble the figure on Temehri rock.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Other shallow examples occur along the Corentyn and Berbice rivers, and the
    passage says they may be confined in Guiana to the eastern district.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Shallow figures generally occur on large smooth rock surfaces, are larger
    than deep engravings, consist of elaborate straight or curved line combinations,
    do not represent animals, and all examples seen by the author face more or less
    eastward.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Deep engravings consist of grouped small drawings depicting human forms, monkeys,
    snakes, other animals, and simple or occasionally elaborate line patterns.
  category: object
  evidence_refs:
  - ev:7
