canonical_text:
  quote: ''
  summary: The passage describes childcare, gendered childhood work and play, personal
    naming practices, avoidance of revealing proper names because names are regarded
    as part of the person, use of European-given names and written name documents,
    betrothal and marriage choice, return of durable betrothal gifts when a match
    is abandoned, and tests of courage and productive ability required of young men
    before marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Children are weaned at a late age, sometimes not until the third or fourth
    year.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Both father and mother show affection to young children; the mother commonly
    carries the child in a small hammock from her neck or shoulder, and the father
    brings objects, fondles the child, and makes ornaments.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When children are able to run about, they are largely left to themselves and
    begin to imitate adult activities.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Boys play with mimic bows and arrows, while girls begin early to assist older
    women with tasks such as peeling cassava, watching a pot on the fire, and collecting
    firewood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A proper name is given to a young child soon after birth; the medicine-man
    is said to be the proper person to choose it, though parents often do so.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Proper names are generally selected from plants, birds, or other natural objects.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Owners object strongly to telling or using their proper names because the
    name is considered part of the person, and one who knows it has part of the owner
    in his power.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: To avoid spreading knowledge of proper names, people generally address one
    another by kinship terms or other relational terms rather than by proper names.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When dealing with a European, an Indian may ask the European to give him a
    name and then continue using that name.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: If a European-given name is difficult to pronounce or remember, the named
    person may preserve a written paper bearing the name and show it when asked.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Boys and girls are often betrothed early; the boy or young man brings game
    and other presents to the girl.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At marriage age, a young man is free to choose his wife and does not necessarily
    have to marry the girl to whom he was betrothed.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: If a young man abandons a former betrothal, he reclaims durable presents such
    as beads and ornaments.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Before choosing a wife, a young man must prove he can do men's work by enduring
    painful tests and demonstrating productive capacity.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Examples of the young man's tests include suffering wounds without flinching,
    being sewn into a hammock full of fire-ants, clearing forest for cassava, and
    bringing in game and fish.
  category: action
  evidence_refs:
  - ev:8
