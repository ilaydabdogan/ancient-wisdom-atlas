- id: motif:3
  label: regulated intermarriage between named families
  taxonomy_refs: []
  basis: The Demarena family is said to intermarry lawfully with the Karobahana family
    according to an old legend, and the author treats this as possibly preserving
    an older marriage regulation.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage frames this as a legend and as a possible remnant of a former
    rule, not as a documented current rule.
