comparison_claims:
- id: claim:1
  claim: The passage itself compares the Demarena-Karobahana intermarriage legend
    to Iroquois clan marriage restrictions reported by Morgan, treating both as possible
    instances of marriage limited to particular permitted clans or families.
  claim_level: same_function
  target: Iroquois clan marriage regulation described in Morgan's Ancient Society
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is made by the author as a possibility; the passage
    does not demonstrate historical contact, common inheritance, or identical institutions.
