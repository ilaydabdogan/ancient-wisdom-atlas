canonical_text:
  quote: ''
  summary: The passage lists Arawak family names and proposed meanings, often deriving
    them from trees, animals, places, spirits, or transformed states. It also records
    an old legend of lawful intermarriage between the Demarena and Karobahana families,
    compares this to Iroquois clan marriage regulation, and notes traditions concerning
    magical transformation, including an ancestress and a plant transformed into a
    rapid.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Haiawafona family name is interpreted as meaning from the hyawa tree,
    a resin-producing tree used for fire-kindling, torches, and scented body oils.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the intervening syllable fo in Haiawafona and other names
    is puzzling.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Demarena name is variously interpreted, including as from the water-mama
    or from certain spirits, while other proposed meanings are judged unlikely by
    the author.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The water-mama is described as one kind of spirit, supposed to live under
    river water, and sometimes used as a general term for supernatural beings.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Demarena family is said, according to an old legend, to intermarry with
    the Karobahana family.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Wakuyana family is described as sprung from the redbreast bird.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Dakamokana family name is interpreted as from the dakama tree, whose nut
    kernel may be grated and baked with cassava meal when cassava is scarce.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Madayalena name is interpreted as from a treeless place, perhaps from
    a savannah.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Hekorowana family name is interpreted as from a tortoise.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Awarakana family name is interpreted as from the awara palm, whose fruit
    is eaten, whose oil is used, and whose young leaves are made into fire-blowing
    fans.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Katokana family name is interpreted by one account as from a rat and by
    another as from an unspecified tree.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Ebesowana name is connected with change or transformation, and family
    members derive it from a tradition of magical transformation undergone by an ancestress.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: An informant connects the word ebesoa with a legend in which the Lucadaia
    plant, from which the Arawaks sprang, was cut down and transformed into a rapid.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The same explanation notes that caterpillars are described as ebesoa when
    they are transformed into butterflies.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Babowna name is derived from a tree that produces milk-like juice used
    medicinally for ulcers.
  category: object
  evidence_refs:
  - ev:11
- id: obs:16
  text: The Eeyicono name is interpreted as the newly come family, and the family
    is said to be extinct in the Pomeroon district, with the last survivor dying in
    1876.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:17
  text: 'The Ebesoleno name has conflicting interpretations: faithful, truthful, or
    heedful family; or changed family with changed skin, meaning mixed blood and abnormal
    complexion.'
  category: speech
  evidence_refs:
  - ev:13
- id: obs:18
  text: The Warerokama family name is interpreted as from a wild plantain, identified
    as a species of Heliconia.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:19
  text: The Kamikathimikina and Ematana names are presented as having no satisfactory
    or traced interpretation.
  category: other
  evidence_refs:
  - ev:15
