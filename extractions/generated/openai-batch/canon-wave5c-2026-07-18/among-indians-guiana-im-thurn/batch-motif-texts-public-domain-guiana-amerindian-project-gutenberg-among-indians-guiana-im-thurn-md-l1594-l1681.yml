canonical_text:
  quote: ''
  summary: The travelling party moves slowly along a river obstructed by sandbanks
    while cassava bread runs out and the Indian crew weakens. A nearby settlement,
    Morai, is also famishing because of drought. When the canoes become stuck, Eddington
    goes to Quartama for help. During the wait, a storm soaks the narrator's hammock
    and a labba eats soup beneath it. Eddington returns with Macusi helpers and cassava.
    The party resumes, reaches more open savannah country, and camps near the waterside
    of Quartama under trees and climbing palms.
  language: English
