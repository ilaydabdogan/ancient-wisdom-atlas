canonical_text:
  quote: ''
  summary: An observer describes a peaiman curing performance in which terrifying
    continuous vocal sounds represent exchanges with kenaimas. The kenaimas are made
    to arrive and depart with wing-like noises, consume tobacco-water, answer questions,
    promise not to trouble the patient, and appear in animal and human forms. The
    narrator later explains the performance as ventriloquism and acting aided by leafy
    boughs, reports falling into stupor, and says the peaiman produced a caterpillar
    as the extracted cause of pain and accepted a looking-glass as payment. The passage
    ends by noting slight tribal variations in the curing performance.
  language: English
  quote_policy: summarized
