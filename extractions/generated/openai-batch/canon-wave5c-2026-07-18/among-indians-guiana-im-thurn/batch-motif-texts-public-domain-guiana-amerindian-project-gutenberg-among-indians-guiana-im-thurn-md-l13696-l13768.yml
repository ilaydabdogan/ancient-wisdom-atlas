canonical_text:
  quote: ''
  summary: 'An ethnographic passage describes a Macusi man''s reported vision of hostile
    Arecunas, then discusses peaiman practice: training through fasting, solitude,
    stimulants, and narcotics; an ecstatic condition in which the peaiman''s spirit
    is believed to leave the body, ascend through the roof, and communicate with other
    separated spirits, including those of patients or kenaimas.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In 1878 the narrator was living in a Macusi settlement when Macusi visitors
    from a neighboring settlement asked to borrow guns and have him accompany an attack
    on Arecunas about twenty-five miles away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tori reported that while alone on the savannah fashioning an arrow-head, he
    saw Arecunas he knew by sight standing over him with uplifted war-clubs as if
    about to strike him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tori's shouts brought his own people from their houses, but the Arecunas had
    vanished and no harm was done.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator says he found Tori's story incredible, but after questioning
    concluded that Tori himself believed it and treated it as a natural vision believed
    to be reality.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The peaiman is described as undergoing long training involving fasting, solitude,
    stimulants, and narcotics to enter an ecstatic condition.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the ecstatic condition the peaiman is said to be able to send his spirit
    where he wills and to commune with other spirits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator reports being told that the peaiman in practice passed up and
    outward through the roof, and he proposed tying a thread to the peaiman's body
    to test the ascent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The answer to the thread proposal was that the peaiman's body remained while
    'something inside him' went up.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that patients or kenaimas with whom the peaiman converses
    are communicated with as spirits separated from their proper bodies.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator compares his own condition under peaiman practice to mesmeric
    trance or a state between sleeping and waking, with little or no bodily control.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage concludes that Indians are being described as believing in a spirit
    within the human body and in the voluntary or involuntary separation of spirit
    and body.
  category: relationship
  evidence_refs:
  - ev:8
