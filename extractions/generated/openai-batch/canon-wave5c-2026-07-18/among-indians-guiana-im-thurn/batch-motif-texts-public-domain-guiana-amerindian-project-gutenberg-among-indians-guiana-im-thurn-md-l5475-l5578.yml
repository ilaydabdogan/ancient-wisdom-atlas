canonical_text:
  quote: The reptiles which I shall have to mention are alligators, lizards, snakes,
    and turtles.
  summary: The passage gives natural-history observations on reptiles in Guiana. It
    says snakes and other reptiles are generally not dangerous; describes alligators
    and caymans in coastal and interior waters; notes tail regrowth in lizards and
    a double-tailed alligator; and describes iguanas living near rivers, plunging
    from trees into water, being eaten, and laying eggs in sand-bank holes.
  language: English
