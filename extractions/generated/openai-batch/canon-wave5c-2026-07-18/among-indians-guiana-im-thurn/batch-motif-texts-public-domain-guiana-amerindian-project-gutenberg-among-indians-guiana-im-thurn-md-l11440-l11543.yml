  summary: The passage describes spindle-spinning cotton into strands, combining strands
    onto a larger spindle, storing prepared cotton, and assigning different fibres
    and thread thicknesses to arrows, bands, hammocks, ropes, ornaments, and other
    practical uses. It also presents the author's explanation that the coexistence
    of thigh-twisting and spindle-spinning in Guiana may reflect Carib migration,
    proximity between Carib and non-Carib groups, and mutual adoption of fibres and
    preparation methods.
