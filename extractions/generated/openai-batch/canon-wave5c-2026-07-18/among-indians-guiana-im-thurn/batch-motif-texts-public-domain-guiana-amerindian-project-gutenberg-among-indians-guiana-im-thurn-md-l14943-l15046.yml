canonical_text:
  quote: ''
  summary: The passage gives Carib and Ackawoi versions of a legend in which cultivated
    foods grow on a single tree that is discovered by animals and cut down; from its
    stump a flood issues and is later released again when a monkey lifts a basket.
    A man and animals survive in a palm, and several episodes explain animal bodily
    features. The passage then gives an Arawak story in which the Sun punishes an
    alligator, explaining its scales.
  language: English
  quote_policy: summarized
