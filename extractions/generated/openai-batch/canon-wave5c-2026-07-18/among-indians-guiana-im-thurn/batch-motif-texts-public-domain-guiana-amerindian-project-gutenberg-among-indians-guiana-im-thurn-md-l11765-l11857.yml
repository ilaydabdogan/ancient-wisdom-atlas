  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A canoe intended for long journeys may receive a tent made from bent sticks,
    cross-sticks, and a palm-leaf thatch; the tent is described as protecting goods
    rather than the Indians themselves.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: An alternate canoe-tent cover is made from two thin wickerwork mats with a
    layer of leaves between them; the passage says this waterproof method seems to
    have been learned from Brazilian Indians and is rarely seen far from the borderland.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A corial resembles the dug-out body of a canoe without the plank that raises
    canoe sides; it is generally smaller, less opened, and used for short excursions,
    fishing, hunting, or going to the field.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A buckshell is dug out like a canoe or corial but has pointed, closed ends;
