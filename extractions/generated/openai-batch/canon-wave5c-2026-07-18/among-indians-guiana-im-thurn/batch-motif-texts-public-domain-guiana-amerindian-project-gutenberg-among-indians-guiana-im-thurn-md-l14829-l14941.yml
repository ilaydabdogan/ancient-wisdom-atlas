canonical_text:
  quote: ''
  summary: 'The passage presents comparative comments on Guiana Indigenous stories,
    then summarizes Arawak, Warrau, and True Carib origin traditions: life arising
    from silk-cotton tree fragments, Warrau descent from sky-land to earth, a Carib
    variant of that descent, and a Warrau account of the first Carib born from Korobona
    and an animate tree stump, killed and re-emerging from a grave as a fierce ancestor
    whose descendants warred with the Warraus.'
  language: English
  quote_policy: summarized
