- id: obs:1
  text: Women build large casiri jars gradually with narrow clay strips and aim to
    keep the walls round.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women often fail before completing a large vessel, and completed vessels may
    crack or break during baking.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A perfected and ornamented casiri jar is described as highly valued.
  category: attribute
  evidence_refs:
