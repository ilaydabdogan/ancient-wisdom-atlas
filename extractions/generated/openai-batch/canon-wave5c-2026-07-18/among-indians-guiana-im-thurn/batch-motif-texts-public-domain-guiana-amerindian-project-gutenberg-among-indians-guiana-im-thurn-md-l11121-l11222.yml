- id: obs:4
  text: The passage says an Indian woman makes well only the two or three vessel shapes
    long customary to her and her ancestors.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women who encounter white people imitate European vessel forms such as teapots,
    cups, saucers, tumblers, and wineglasses, but the results are described as misshapen
    and inaccurate in curve.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Guiana vessels are similar in form to ruder vessels
    from North American earth-mounds, with buck-pot and goglet shapes exactly matched
    there.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Children imitate women shaping clay and make small pots and goglets that are
    seen around Indian houses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author proposes by analogy that small, impractical vessels in North American
    mounds were probably made by children of the mound-makers.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Men are described as skilful basket-makers, using split iturite stems for
    fine work and other iturite or mamoorie creepers for rougher work.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Pegalls are made to contain loose arrow-heads, cotton for binding, wax, unused
    beads and ornaments, and other small personal properties.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The pegalls of Arawaks, Ackawoi, and Warraus are generally square, with a
    larger lid of the same shape fitting over the basket.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Many True Caribs make oblong pegalls with curved lines and adorn them with
    white cotton strings bearing knots of colored feathers.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Indians of the savannah chiefly use round pocket-shaped baskets without lids,
