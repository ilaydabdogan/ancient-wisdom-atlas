canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Guiana pottery and basketry: women make
    and value large casiri jars, imitate European vessel forms, and are compared by
    the author with North American mound pottery; children make toy pots; men make
    baskets and pegalls; and basket-work implements are used in making cassava bread.'
  language: English
  quote_policy: summarized
