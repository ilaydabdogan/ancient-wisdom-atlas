canonical_text:
  quote: ''
  summary: 'The passage surveys notable fishes in the interior rivers, distinguishing
    food fish from three dangerous fishes: the perai, electric eel, and sting-ray.
    It describes the perai as voracious and dangerous to animals and humans, the electric
    eel as capable of severe shocks, and the sting-ray as a hidden shallow-water fish
    whose barbed spine can inflict severe wounds. It also notes several practical
    uses of fish parts by Indians.'
  language: English
  quote_policy: summarized
