  summary: A travel narrative passage describes a delay at Apooterie, a sudden storm
    over a forest clearing, a canoe journey through side streams, swamp, lake, and
    forest to obtain cassava from an isolated Wapiana man, and later travel through
    high-flood river reaches, flowering creepers, falls, rapids, and a rope-assisted
    descent at Etannime.
