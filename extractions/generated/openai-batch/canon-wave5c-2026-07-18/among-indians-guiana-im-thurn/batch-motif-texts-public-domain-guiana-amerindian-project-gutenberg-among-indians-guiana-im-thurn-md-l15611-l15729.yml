canonical_text:
  quote: ''
  summary: The passage describes rock engravings at Warrapoota cataracts and other
    river sites, including their placement on granite boulders near water, recurring
    human or monkey-like figures, geometric and spiral patterns, rare sun and arch
    forms, animal forms at other sites, and exceptional ship engravings compared by
    the author to European or Spanish vessels and possibly linked to Orellana's 1540
    shipbuilding episode.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Warrapoota cataracts, many engraved figures are scattered over granite
    boulders in the middle of the cataracts; the rocks are covered when the river
    is high and exposed in the dry season.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some engraved surfaces now rest against other rocks or are on multiple sides
    of blocks, leading the author to infer that the boulders have moved since the
    engravings were made.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The commonest Warrapoota figures are described as men, or perhaps monkeys,
    formed from simple straight lines for trunk, arms, and legs, with a dot or circle
    for the head and small radiating lines for fingers and toes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some of the line figures have a downward extension resembling a long tail;
    the author suggests that tail-less figures may represent men and tailed figures
    monkeys.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a few cases, the body is outlined by two curved lines and bisected by a
    row of dots, almost invariably nine in number, which the author says seem to represent
    vertebrae.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Other Warrapoota figures consist of simple straight-line combinations, curved-line
    combinations, and spiral lines; the author compares some to the Greek meander
    pattern and notes resemblance to present-day Indigenous body painting, while cautioning
    that the resemblance may be independent.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'At Warrapoota, two figures are said to occur only once: a rayed sun and the
    top of a rounded arch.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: At other places on rivers of the Essequibo system and probably the Berbice,
    engravings include lizards, alligators, birds, or other animals.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'Two engravings reported by Schomburgk are treated as unusual: an intricate
    line engraving near Camoodi rock and an engraving at Ilha de Pedra on the Rio
    Negro showing a large and a small ship of European build.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author compares the larger Rio Negro ship engraving to a Spanish galley
    and proposes that it may relate to Orellana's building of a ship in 1540, though
    this is presented cautiously.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The author states that shallow and deep engravings nearly always occur near
    water, especially near a waterfall or cataract, while noting reported exceptions.
  category: setting
  evidence_refs:
  - ev:7
