canonical_text:
  quote: ''
  summary: Ethnographic description of Guiana Indigenous clothing and adornment, including
    men's laps, women's queyus, palm-leaf sandals, ornament use, body painting, tattooing
    or scarring, pigments, and common male ornaments, with variants among Warrau,
    Arecuna, Pianoghotto, Ackawoi, and Macusi groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men's laps are described as generally made of blue salemporas cloth obtained
    from Europeans, with Warrau exceptions made from softened inner tree bark and
    possible earlier cotton use among some groups.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women's queyus are described as usually made from European beads, while Warrau
    women use bark, some Arecuna women use loose cotton strings in a deep fringe,
    and Pianoghotto women use small bright-colored seeds.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Bead queyus are described as varying by tribe: Ackawoi examples are generally
    dark blue with red and white rows at the bottom, while Macusi examples generally
    have a white ground with a simple red or blue pattern.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sandals are cut from the leaf-stalk of the eta palm, worn on stony savannah
    to protect the feet, held by a string passing between the great toe and the next,
    and quickly replaced when worn out.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that ornaments are used more abundantly by males than females,
    and that some people wear ornaments regularly while others reserve them for feasts
    or ceremonial visits.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Tattooing or other permanent alteration of the skin is said to be limited,
    chiefly producing small tribal marks at mouth corners or on arms; other incised
    straight lines are described as surgical scars rather than ornaments.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Body painting is described as common, using red faroah and blue-black lana
    among savannah groups, carmine caraweera and lana among forest groups, with white
    clay and a yellow substance used more rarely and oils as vehicles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A man dressing well may paint his feet red, stain or pattern his trunk blue-black
    or red, and add red lines, streaks, spots, or paint masses on his face.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Women, especially Ackawoi women, are described as favoring blue-black body
    paint, including a broad band around the mouth extending to the ears; some women
    use small unexplained figures compared in appearance to Chinese characters.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Two ornaments worn frequently by men of all tribes are identified as a necklace
    of bush-hogs' teeth and a pair of armlets.
  category: object
  evidence_refs:
  - ev:9
