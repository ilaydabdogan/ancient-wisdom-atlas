canonical_text:
  quote: ''
  summary: The passage introduces a chapter on Guiana family and marriage systems,
    describing tribal subdivisions into families, restrictions on intermarriage, an
    exception involving captured women, and the Arawak family-name system. It reports
    that Arawak family names occur in collective, masculine, and feminine forms, and
    gives examples whose proposed meanings derive from grassland, rain or water, deer,
    bloodwood tree, wild plantain tree, and black monkey.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Guiana tribes are described as subdivided into families, with traces
    of laws regulating intermarriage among members of those families.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage assumes that former intertribal marriage was absent except when
    a woman captured in war was taken as wife by her captor; it says intertribal marriage
    is still rare except at missions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Marriage is described as almost always occurring between members of different
    families, though the family lines and intermarriage rules have become difficult
    to trace and laxly observed in most tribes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Arawaks are said to have preserved lines of family descent more strictly
    than other tribes until recently, and their system is presented as a possible
    type for earlier systems among other Guiana tribes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says earlier writers repeated a count of twenty-three Arawak families
    from Hillhouge or Hillhouse, while McClintock supplied fifty names, reduced after
    duplicates to at least forty-seven distinct family names.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Each Arawak family name is said to have three forms: a collective form for
    the family, a singular masculine form for one man, and a singular feminine form
    for one woman.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The family name Karuafona is given a possible meaning connected with grass
    or grassy land, though the derivation is described as obscure.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The family name Onishéna is linked by informants or suggestions to rain, water,
    rainhead, or one who sends rain; the passage identifies a root meaning rain and
    water.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The family name Koiarno is described as having an irregular collective termination
    and as probably meaning from the deer.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The family names Urahkana, Hairéna, and Yobotana are respectively linked to
    the bloodwood tree, wild plantain tree, and black monkey.
  category: attribute
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
