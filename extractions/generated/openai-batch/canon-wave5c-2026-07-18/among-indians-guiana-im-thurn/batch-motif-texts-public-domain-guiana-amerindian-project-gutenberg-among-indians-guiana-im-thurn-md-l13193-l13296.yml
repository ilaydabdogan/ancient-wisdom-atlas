canonical_text:
  quote: ''
  summary: Ethnographic passage describing Guiana Indian understandings of pain, hostile
    spirits, kenaima attackers, and the peaiman’s protective and healing roles. It
    describes the peaiman as doctor-priest, herbal expert, keeper of traditions, and
    a ritual specialist trained through fasting, solitary forest wandering, tobacco-water
    draughts, voice control, and trance-like performance. The passage ends with preparations
    for a nighttime cure of the narrator in a dark closed house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that pains may be attributed to foreign bodies embedded
    in the sufferer’s flesh, and that among Guiana Indians this foreign substance
    is often regarded as a materialized hostile spirit.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says real and imaginary kenaimas are generally thought to belong
    to tribes different from their victims, fostering intertribal suspicion; the Ackawol
    are described as having a special reputation as kenaimas.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The peaiman is described as fighting these foes on behalf of the people of
    a settlement or district, especially by counteracting the imaginary attack of
    the kenaima.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The peaiman is said to have influence from knowledge of medicinal herbs and
    from being supposed able to identify places with game; he is characterized as
    dealing with both body and spirit, as doctor and priest.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: According to the passage, the peaiman’s office was formerly hereditary, but
    a father without a son could choose and train another boy, with epileptic tendency
    preferred.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A peaiman candidate undergoes severe endurance training, including long fasts,
    solitary forest wandering, lack of house and weapons, gathered food only, and
    drinking large quantities of tobacco-juice mixed with water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The candidate is trained in vocal control and is described as entering frantic
    excitement in which he is supposed to converse with and control kenaimas; the
    passage also mentions convulsions and fit-like performance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The second part of peaiman education consists of learning tribal traditions,
    medicinal and poisonous qualities of plants, and rules for finding game.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the cure episode, the narrator, living with Macusi Indians on the savannahs
    and suffering headache and fever, accepts a peaiman’s offer to cure him after
    dark.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The cure preparation includes a hammock, tobacco leaves steeped in a calabash
    of water, green boughs, a closed house, extinguished fires, and darkness.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: About thirty people are present in the house, lying in hammocks; the narrator
    is warned not to put a foot on the ground because kenaimas would be on the floor.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: Before the ceremony begins, the peaiman is hesitant to work before a white
    man, and the narrator reassures him by promising not to leave the hammock, look
    at anything, or grasp anything that might touch him.
  category: sequence
  evidence_refs:
  - ev:9
