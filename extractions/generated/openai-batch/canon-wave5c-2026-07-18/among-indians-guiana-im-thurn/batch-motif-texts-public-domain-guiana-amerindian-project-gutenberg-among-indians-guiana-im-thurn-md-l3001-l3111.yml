canonical_text:
  quote: ''
  summary: A travel account describes reaching the Kaieteur area, where boats cannot
    proceed because of rapids and falls. An Ackawoi party and other local Indians
    are described as avoiding the top and bottom of Kaieteur because of its supposed
    supernatural character. The narrator's party makes a difficult journey through
    forest, boulders, ravines, and river-edge rocks to view the fall, amphitheatre
    cliffs, dark pool, and cave behind the waterfall, then returns by an easier route.
  language: English
  quote_policy: summarized
