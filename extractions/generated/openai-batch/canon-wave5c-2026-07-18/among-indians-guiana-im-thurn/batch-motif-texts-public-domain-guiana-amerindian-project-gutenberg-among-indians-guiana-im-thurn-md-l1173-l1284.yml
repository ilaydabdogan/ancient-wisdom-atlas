canonical_text:
  quote: ''
  summary: A travel narrative describes Nikari-karu settlements, bat attacks on sleepers,
    Indian reactions to a sponge, turtle-egg collecting, engraved rock-pictures at
    Warrapoota cataracts, a night search for an omar or evil being that proves to
    be a labba, beliefs surrounding the Paiwarikaira boulder and its associated misfortune,
    and a report that God has shut a person inside another rock until he ceases swearing
    for a year.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Nikari-karus are described as people of mixed Brazilian and Indian descent,
    with settlements at Paripie, Yucarisi, Arinda, and near Anahee.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Nikari-karus are said to make cassava into farine rather than bread and
    to make closer-woven hammocks with colored cotton.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Several members of the narrator's party were bitten by bats while sleeping
    at Paripie, while the narrator says bats did not taste his blood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An Indian boy serving the narrator was repeatedly attacked by bats at night;
    his parents watched over him, and attacks resumed when they fell asleep.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator states that the bat bite seems painless and that danger comes
    from blood flowing afterward from an unnoticed wound.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: When the Indians noticed the narrator's sponge, Moé guessed that it was a
    hat, then a bird's nest, then a shoe; after its use was shown, the company laughed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The men hunted for turtle eggs in sand-banks, and the Indians are described
    as eating turtle eggs greedily while refusing fowl eggs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Rock-pictures are described as conspicuous figures engraved on granite boulders
    in the middle of the Warrapoota cataract.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: At night the narrator saw Indians moving around camp with a gun and blazing
    palm-branches while looking for an omar, described as an evil being.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tracks found in the morning showed that the noise attributed to the omar had
    been made by a labba.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Paiwarikaira is described as a large granite boulder resting on a slender
    columnar base, and a local report says a Dutchman with a hundred slaves failed
    to overturn it.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that no Indian, except a peaiman, willingly looks at Paiwarikaira
    because its sight is followed by misfortune.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The narrator approached and touched Paiwarikaira despite the Indians' entreaties,
    and the Indians later attributed rain and other evils to his disrespectful treatment
    of the rock.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Another rock is said by half-civilised Indians to contain a person whom God
    has shut up until he ceases to swear for one whole year.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: A fall stopped the loaded canoes, which were then unloaded, hauled up empty,
    and reloaded the next morning.
  category: sequence
  evidence_refs:
  - ev:9
