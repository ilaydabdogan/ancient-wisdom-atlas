canonical_text:
  quote: ''
  summary: The passage classifies and discusses several stone implement types from
    British Guiana, including common shell-mound tools, possible stone blades for
    wooden war-clubs, grooved or notched blades for lashing, an ornamented grooved
    implement compared to island Carib examples, and a human-foot-shaped hand-held
    implement possibly used as a chisel, adze, or close-quarters weapon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer states that stone implements classified by current mode of occurrence
    do not show a real difference in form or finish among the classes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The most common types are identified as Nos. 1 and 3; No. 3 is especially
    abundant in shell-mounds and is interpreted as likely domestic because it seems
    ill-suited as a formidable weapon.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: No. 2 is flatter and knife-like, and examples show a peculiar fracture at
    the narrow end that the writer identifies as the end attached to a handle.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage reports an Indian tradition that wooden war-clubs were formerly
    made more formidable by adding a stone blade, and notes a collection example with
    a similar stone blade inserted in one side.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The writer argues that the fracture pattern of No. 2 blades is consistent
    with breakage from a heavy wooden club and with socketing into wood.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: When asked to demonstrate handle fitting, some Indians fitted examples into
    a light wooden handle; the writer says the weapon looked impractical but the fastening
    resembled the proposed war-club attachment.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: No. 4 is a small, well-finished grooved blade whose notches would favor fastening
    to one side of a stick, but the writer says its small size makes its use hard
    to realize.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: No. 5 is a grooved form with projecting shoulders below the grooves; the writer
    describes the shoulders as certainly ornamental and compares the implement to
    elaborate island Carib stone implements.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: No. 6 resembles a human foot and leg to the knee; its hollowed sole fits the
    thumb when grasped, and the writer considers it likely hand-held rather than hafted.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Mr. Tylor is reported as saying that some Indians, believed to be in British
    Columbia, had been seen fighting with stones grasped in the hand.
  category: speech
  evidence_refs:
  - ev:9
