canonical_text:
  quote: ''
  summary: The passage describes beliefs about kenaimas as agents blamed for illness
    and death; a ceremony using pieces of a corpse boiled in water to locate a supposed
    killer; the real kenaima as a stalking human attacker using weapons or poison;
    and the imaginary kenaima as an invisible spirit or as a spirit entering animal
    bodies, small birds, worms, insects, or objects to harm victims.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Every death and every illness is described as being regarded as the work of
    a kenaima rather than as the result of natural law.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a kenaima is identified or suspected, the nearest relative of the injured
    person is described as devoting himself to retaliation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Relatives of a dead Macusi boy carried his body to open ground, raised a dirge,
    and formed a circle around it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy's father cut off thumbs, little fingers, great toes, little toes,
    and pieces of each heel from the corpse and put them in a new pot filled with
    water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A fire was kindled under the pot, and the side from which a body piece was
    first thrown out by boiling water was taken to indicate the direction of the kenaima.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The real kenaima is described as following an intended victim and killing
    with a hardwood club, an arrow, or more often poison.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A person who thinks he is followed by a kenaima tries to remain with friendly
    companions; if hidden from view, left behind, or caught asleep, he is said to
    be lost.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After striking down a victim, the kenaima is said sometimes to bind the victim
    alive, rub burning deadly poison into the flesh, or dislocate the limbs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The imaginary kenaima is described as working invisibly by separating spirits
    and bodies and sending spirits to obey his orders.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The kenaima is said to be able to put his spirit into the body of animals
    including a jaguar, serpent, sting-ray, bird, or insect.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Certain small birds with a shrill whistle are regarded with distrust; when
    shot, they are burned and their feathers are chased so that none escape.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Kenaimas in the form of worms, insects, or inanimate objects are said to enter
    enemies' bodies and cause headaches, toothaches, and other bodily pains.
  category: action
  evidence_refs:
  - ev:10
