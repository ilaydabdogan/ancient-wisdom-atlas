  summary: The passage discusses beliefs attributed to Guiana Indians about animal
    speech, peaiman communication with birds and beasts, tapir revenge connected with
    a destroyed meat-drying frame, spiritual similarity between humans and animals,
    water-dwelling monstrous beings such as the di-di or water-mama and the omar,
    and an extension of spirit-belief to plants, stones, and rivers.
  language: English
