canonical_text:
  quote: ''
  summary: The passage describes practical fishing and hunting techniques among Indigenous
    peoples in Guiana, including hook-and-line fishing with plant seeds as bait, Arecuna
    methods for catching small stream fish, a Macusi method of diving to catch fish
    by hand, turtle-shooting with a detachable arrow and line, iguana-shooting from
    canoes, and the use or preference of guns, bows, arrows, and blow-pipes for hunting
    game.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Travellers are advised to keep hooks and lines for barter, because hook-and-line
    fishing is frequently practiced and hooks may also be made by Indigenous people
    themselves.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Large hooks are used for large fish including low-low, aropaima, and haimara.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Haimara may be caught with a hook on a short line and spring rod, fastened
    to a rock and left overnight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Fish are observed to gather under certain trees and plants when ripe fruit
    falls, and seeds from such plants are used as bait.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Arecuna people in savannah areas around Roraima catch small stream fish using
    landing-net-like nets and small wicker-work traps.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Macusi Indian described by the narrator catches a fish by diving from a
    canoe, chasing it to the bank, driving it into a hole, seizing it by hand, and
    bringing it up.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Turtles are shot with a special arrow whose head slips from the shaft and
    remains connected by a long line.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: When turtle-shooting, the arrow is aimed upward so that it descends onto the
    turtle, pierces the shell, and leaves the shaft floating as a buoy for drawing
    the turtle to the canoe.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says Indians often keep a turtle-pen near the house as a living
    stock for use.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: Iguanas sun on high branches overhanging the river and are difficult for an
    unpractised eye to detect.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: When an iguana is spotted, the cry using its Carib name is made, and the surest
