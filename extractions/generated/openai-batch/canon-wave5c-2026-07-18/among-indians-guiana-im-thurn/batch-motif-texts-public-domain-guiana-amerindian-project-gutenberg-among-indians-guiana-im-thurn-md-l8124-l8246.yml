canonical_text:
  quote: ''
  summary: The passage describes personal ornaments and dress among Indigenous groups
    in Guiana, including tooth necklaces, armlets, seed and bead strings, feather
    and metal ornaments, gendered differences in adornment, children's ornaments,
    tribal variations, and individual differences in care for appearance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A necklace of bush-hog teeth is described as worn everywhere except in the
    house; each man is supposed to wear only teeth from bush-hogs he killed himself,
    so the number and quality of teeth indicate hunting success.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bush-hog teeth necklace is described as an ornament with special value
    to its owner, and the wearer parts with it only in extreme need.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Upper-arm armlets are described as low-value, frequently replaced ornaments
    made as broad cotton bands or string loops with a disc of bone, shell, or metal;
    the author suggests they may represent an earlier permanent constriction of the
    arm.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Other ornaments are said by the author to have no special significance and
    to be used according to individual taste, chiefly at feasts.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Men wind strings of seeds or beads around ankles and wrists, smooth the hair
    with palm oil, apply red paint at the forehead parting, and attach white curassow
    down to the paint.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Men wear ear ornaments made from straw or letter-wood, nose ornaments of silver
    or copper, and a small bell-like lip ornament made of white bone or shell with
    a cotton streamer.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Crescent-shaped nose-pieces are described as proper to Carib tribes, while
    round nose-pieces are described as proper to the Wapianas.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Men wear feather crowns whose colors vary by tribe, long cotton strings ending
    in bird skins or beetle-wing tassels, jangling seed strings, crossed shoulder
    strings, multiple necklaces, and sometimes a skirt of plaited young palm leaves.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Shoulder ruffs made of macaw tail-feathers, short cotton mantles with down
    tufts, and collars of heron or curassow feathers are described; feather collars
    are especially associated with people engaged in races.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'Women''s toilet is described as simpler than men''s: women wear no feathers,
    very seldom wear teeth except acourie teeth, wear many seeds and beads around
    the neck, waist, ankles, wrists, and upper arms, and wear a simple cotton fillet
    at festivals.'
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Children's ornaments are described as much like those of adults, but their
    necklaces mainly use special seeds or, when made of teeth, generally jaguar teeth.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Individuals differ in care for personal appearance; the Warraus are singled
    out by the author as distinguished by disregard of cleanliness and neatness, while
    male and female dandies are said to occur among other groups.
  category: attribute
  evidence_refs:
  - ev:10
