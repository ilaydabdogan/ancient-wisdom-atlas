canonical_text:
  quote: ''
  summary: The passage describes cotton, eta/tibisiri palm fibre, crowia/silk-grass
    fibre, and their preparation among Indians of Guiana, including extraction, washing,
    drying, twisting into string, gendered work roles, and cotton spinning with a
    spindle and bone whorl.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A small quantity of cotton is grown and spun by almost all Indians, while
    a larger part of the cotton used is prepared by the Arecunas and distributed among
    other tribes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ata palms are said to grow in swampy places; silk-grass is indigenous and
    cultivated in Indian fields; tibisiri and crowia are gathered and prepared as
    required.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Eta fibre, called tibisiri by the Arawak Indians, is prepared from the young
    folded leaf spike of the Mauritia flexuosa palm; fibre from young plants is described
    as stronger than fibre from old plants.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Eta/tibisiri fibre is obtained by rubbing and tearing off the outer skin of
    the leaf spike, then boiling, sun-drying, and twisting it into strings; fibre
    from about a dozen spikes is said to make a large hammock.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Crowia, called silk-grass fibre in the colony, is extracted from leaves of
    bromelia and sometimes anannassa plants by using a string with a noose and slip
    knot tied around a tree.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: For crowia extraction, a leaf is split along the midrib, bent back, passed
    through the noose, tightened, and pulled through the loop so that the green skin
    and soft matter are removed while the fibres remain.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Crowia fibre is washed, dried in the sun, becomes very white, and is said
    to wash well, unlike tibisiri, which turns yellow in water.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Among the Arawaks, men are said to peel the leaf from the bottom upward, while
    women peel from the extreme point downward to the base.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tibisiri and crowia fibres are twisted by holding one end in the left hand,
    laying the rest across the naked right thigh, and rolling them with the right
    palm; single strands are used for hammocks, triple strands for bow-lines, and
    three triple cords for hammock ropes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that Indians’ naked, smooth, hairless thighs make the thigh-rolling
    method possible, while a European’s skin hairs would catch in the fibres and hinder
    the work.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Indian women are said to prepare twine for hammock-making, but when they begin
    wearing dresses they must give up this work; eta string is strong but less even
    than silk-grass string, and silk-grass is reserved for more important uses.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Cotton is gathered and spun by women, who extract fibre from pods, remove
    seeds, pull it into a loose band, fasten one end to a spindle hook, and wind the
    remaining band around the right wrist.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Each spindle is a wooden stick with a circular bone whorl that acts as a guard
    and a hook at the other end for fastening the cotton band.
  category: object
  evidence_refs:
  - ev:7
