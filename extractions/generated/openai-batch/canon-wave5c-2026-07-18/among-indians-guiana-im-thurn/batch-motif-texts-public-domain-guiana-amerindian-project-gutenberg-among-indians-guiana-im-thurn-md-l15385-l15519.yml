canonical_text:
  quote: ''
  summary: The passage describes Guiana pictured rocks as antiquities bearing painted
    or engraved figures. It distinguishes painted rocks from engraved rocks, and further
    divides engravings into deep and shallow forms that differ in incision depth,
    possible technique, distribution, and represented figures. It reports red-painted
    rocks and similar drawings elsewhere in South America, discusses possible modern
    pigment use, and describes a shallow engraving on Temehri Rock as a rectangular
    figure crowned by a radiate semicircle and filled with straight-line patterns.
  language: English
  quote_policy: summarized
