  quote: ''
  summary: The passage describes Guiana wooden war-clubs and then gives a detailed
    material account of hunting equipment, especially the blow-pipe, quiver, poisoned
    darts, fibre basket, and the sourcing, making, storage, and use-preparation of
    these items.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One type of club has a rounded shaft and broad flat blade; the shaft tapers
    to a sharp point said to be used in the ear of an enemy as a coup de grace after
    a blow from the blade.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Different varieties of this club type are said to have been appropriated by
    the Wapiana and the Arecuna; a third wedge-shaped type is rare and not assigned
    to a tribe in the passage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some clubs from Guiana and nearby South America were made more formidable
    by fixing a stone or later iron axe-blade into the side.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hunting weapons are described as being made in greater number than war weapons
    because warfare is said to be almost at an end while hunting remains necessary.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A complete blow-pipe set includes the pipe, a quiver with darts, and a small
    basket of fibre used on the blunt end of the dart like feathering.
  category: object
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: The reed used for the blow-pipe is said to grow near the sources of the Orinoco;
    the Arecunas, living nearest that district among British Guiana tribes, procure
    the reeds and make or distribute blow-pipes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The blow-pipe barrel is made from a straight reed section dried by fire and
    sun, then inserted into a bored palm-stem tube as a sheath.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The blow-pipe may have an end fitting to keep dirt out, peccary teeth as sights,
    and sometimes decorative basketwork; when not in use it is generally hung horizontally
    to preserve straightness.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: The quiver is described as dice-box-shaped, made of coated wickerwork, with
    a tapir-hide lid and contents including a bundle of darts, a perai-fish jaw, and
    crowia fibre.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The darts are about eight inches long, made from sharp splinters of cokerite
    palm midrib, dipped in urari poison, tied in a bundle, and arranged with a guard
    to protect the hand from the poisoned points.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Before use, a single dart is slipped from the bundle and fibre is tied to
    its blunt end so that it fills the diameter of the blow-pipe when blown through
    the tube.
  category: sequence
  evidence_refs:
  - ev:5
