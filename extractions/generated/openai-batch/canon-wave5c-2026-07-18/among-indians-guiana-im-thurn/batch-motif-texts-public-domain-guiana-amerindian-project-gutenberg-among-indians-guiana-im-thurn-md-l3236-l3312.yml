canonical_text:
  quote: ''
  summary: 'The passage describes observations around Kaieteur: low water revealing
    a cave, pool, and possible outflow behind the fall; water-storing Bromeliads;
    an insect-eating sundew on dry rocks; swifts descending to roost behind the fall;
    a new bird species specimen; cold moonlit nights with cloud-filled valley; departure
    after six days; and a later February ascent of the Potaro during flood conditions
    with companions and boats.'
