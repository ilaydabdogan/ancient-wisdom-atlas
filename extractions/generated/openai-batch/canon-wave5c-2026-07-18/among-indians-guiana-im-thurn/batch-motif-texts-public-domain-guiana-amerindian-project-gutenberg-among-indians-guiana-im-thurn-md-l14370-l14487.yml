canonical_text:
  quote: ''
  summary: The passage argues that Guiana Indian beliefs do not show a hierarchy of
    authoritative spirits or gods in the sense used by higher religions. It records
    an Arawak response to a solar eclipse as a fight between sun and moon, mentions
    complaints against G@nicidu during rain or flood, lists terms once taken as names
    of a supreme being, and interprets those terms as referring to ancestors, makers,
    fathers, or tribal founders associated with sky-land.
  language: English
  quote_policy: summarized
