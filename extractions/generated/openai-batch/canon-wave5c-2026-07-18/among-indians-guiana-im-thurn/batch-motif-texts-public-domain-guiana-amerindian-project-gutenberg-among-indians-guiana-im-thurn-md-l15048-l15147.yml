canonical_text:
  quote: ''
  summary: 'The passage recounts several Guiana Indigenous folktales and explanations:
    an Arawak man marries a king-vulture woman, is stranded on a thorny palm, rescued
    by spiders and later by birds, and a war in sky-land leads to bird markings and
    the release of darkness; men and birds fight a huge water-snake and bird colors
    arise from the divided skin; a boy whose body kills fish dies from a collective
    fish attack and his blood becomes the haiarri fish-poison plant; an abandoned
    old man’s boat and basket at Kaieteur become an island and a rock; and Macusi
    statements identify dew as star-spittle and the Southern Cross as a being dwelling
    on the plain.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young Arawak chooses a king-vulture as his wife and goes to sky-land to
    live with the vulture’s people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the Arawak wishes to visit his own people, the vultures become angry
    and place him on a thorn-covered awarra-palm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Spiders pity the Arawak and spin a cord by which he descends from the palm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Other birds carry the Arawak back to sky-land, help him fight the vultures,
    and burn the vulture settlement after driving the vultures into their houses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the burning, quarrels over plunder explain the grey coloring of the
    trumpetbird and heron, and the owl opens a package from which darkness emerges.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Arawak is killed in combat by his own son, whose mother is the vulture
    wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The keskedie avoids the fight by pretending illness with a white cotton head
    bandage, and the big birds compel it always to wear that bandage-mark.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Combined forces of men and birds wage war on a huge water-snake, and a duckler
    first wounds the snake under water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The duckler claims the snake’s skin, the birds divide it, and most become
    bright-colored parrots and macaws while the duckler remains dingy.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: A boy’s swimming causes fish to die, and his father uses this to obtain wholesome
    fish for food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Fish take counsel and attack the boy with their spines; the sting-ray wound
    proves fatal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The dying boy’s blood falls on the ground and haiarri plants grow where it
    falls.
  category: sequence
  evidence_refs:
  - ev:6
