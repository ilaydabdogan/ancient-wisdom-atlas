canonical_text:
  quote: ''
  summary: 'The passage discusses explanations for rock-engravings in Guiana and elsewhere:
    their frequent placement near striking natural features such as cataracts and
    on apparently inaccessible rock faces; possible commemorative association with
    drownings, dangerous fishing expeditions, and other events at falls; a proposed
    technique for elevated engravings using stone wedges as steps; and the loss of
    the art and memory of its origin after the decline of stone-working under the
    influence of metal implements.'
  language: English
  quote_policy: summarized
