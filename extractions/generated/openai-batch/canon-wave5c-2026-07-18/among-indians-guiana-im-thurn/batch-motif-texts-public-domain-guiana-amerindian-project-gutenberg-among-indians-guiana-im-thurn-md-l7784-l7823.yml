  quote: ''
  summary: 'The passage opens a chapter on appearance and dress, then describes the
    author’s view of the physical appearance of Indigenous people in Guiana: minimal
    clothing, small stature with tribal variation, well-formed trunk and limbs, frequent
    protuberant stomachs attributed by the author to paiwari drinking, full flesh,
    little visible muscular definition, and dietary or bodily explanations involving
    cassava, fat, skin thickness, and exercise. A footnote contrasts Arecunas and
    Arawaks in height, hardship of life, and exposure to European influence.'
