  summary: Travel narrative describing Rappoo cataracts and bamboo arrow-heads said
    to be poisonous; an associated Indian story about a fatal plant-stick discovered
    during a jaguar attack; arrival at Apooterie where a headman's wife gives birth
    to twins; observations of animals, river conditions, sandbanks, and biting flies
    on the Roopoonooni.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rappoo cataracts are named for a bamboo growing on islands among them; savannah
    Indians use it for arrow-heads said to be as poisonous as those tipped with ourali.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator tested a Rappoo arrow on a fowl; the fowl showed no poison symptoms,
    and an Indian bystander said the arrow is poisonous only when it enters far enough
    into the body.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An Indian story says that a plant grows somewhere from which a stick is fatal
    to any living thing at which it is pointed.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The story says the plant's virtues were discovered by an Indian woman who
    was attacked by a jaguar, seized the nearest stick, pointed it at the animal,
    and the animal immediately fell dead.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Apooterie, a Carib settlement, the head man received the travelers into
    his house; within an hour his wife gave birth to twins.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The settlement contained many tame animals, including parrots, macaws, trumpet-birds,
    troupials, monkeys, powis or curassow birds, and a sunbird.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Roopoonooni river is described as opaque and yellowish-white, unlike the
    clear dark-red Essequibo; its banks are wooded less luxuriantly and include white-clay
    cliffs, water-guava bushes, and numerous palms.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the rainy season the Roopoonooni banks are often underwater, sand ridges
    lie far below the surface, and trees rising from floodwater mark where the river-banks
    were.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sandbanks obstructed the canoes; the travelers sometimes dragged the canoes
    over them and sometimes dug channels with paddles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Small black kaboori flies, also called pium, wounded exposed flesh and caused
    raised, blood-distended patches; paddling Indians were especially unable to protect
    themselves.
  category: action
  evidence_refs:
  - ev:8
