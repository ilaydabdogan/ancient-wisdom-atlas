  summary: The narrator enters a hut occupied by two Macusi women, eats farine boiled
    in milk despite the older woman's anger, observes cattle being corralled and a
    black bull slaughtered, spends a night near fires cooking beef that his Indian
    companions resist tending because they do not eat beef, travels through rain and
    flooded rivers toward Quatata, notes clothing being protected from rain, and sees
    a turtle on a floating dead tree trunk that he likens to a shipwreck survivor.
