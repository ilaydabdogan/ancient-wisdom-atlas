  quote: ''
  summary: The passage gives an ethnographic classification of Guiana Indian tribes,
    describes their distribution across coast, forest, and savannah regions, distinguishes
    forest and savannah Indians as residence-based terms, and proposes a native/stranger
    division marked partly by hammock materials and thread-spinning practices.
  language: English
  quote_policy: summarized
