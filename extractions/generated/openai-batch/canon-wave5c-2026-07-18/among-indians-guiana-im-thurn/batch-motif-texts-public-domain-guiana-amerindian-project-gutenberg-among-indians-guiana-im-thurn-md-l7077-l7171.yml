  text: 'For the passage''s classification, the country is divided into three parallel
    regions: coast-region, forest-region, and savannah-region.'
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Warrau are placed in the northernmost coast-region, the Arawaks in the
    rest of the coast-region, and True Caribs in scattered settlements without a distinct
    territory.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The forest-region is described as almost entirely inhabited by the Ackawoi,
    with a few scattered True Caribs.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The savannah-region is described as occupied, from north to south, by Arecunas,
    Macusis, Wapianas with Atorais and Amaripas, Tarumas with Maopityans, and isolated
    Pianoghottos.
  category: sequence
  evidence_refs:
  - ev:4
