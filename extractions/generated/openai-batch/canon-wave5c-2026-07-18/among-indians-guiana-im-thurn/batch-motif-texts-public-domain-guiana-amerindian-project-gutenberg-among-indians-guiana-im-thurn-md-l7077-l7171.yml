  text: The author contrasts several tribes by habits, perceived cleanliness, hostility,
    fear, contempt, seclusion, and degree of communication with other Indians.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that combined differences in language, physique, and habits
    are sufficient to distinguish groups and classify them as tribes or branches.
  category: relationship
  evidence_refs:
