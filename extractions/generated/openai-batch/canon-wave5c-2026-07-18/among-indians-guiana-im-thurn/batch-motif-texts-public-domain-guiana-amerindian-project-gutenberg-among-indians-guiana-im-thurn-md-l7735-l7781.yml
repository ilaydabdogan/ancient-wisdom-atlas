  summary: The passage contrasts marriage through the wife's family, including residence
    and labor in the father-in-law's household, with traces of bride capture in Guiana.
    It discusses Island Carib gendered vocabularies, a similar slight Guiana phenomenon,
    legends of Caribs carrying off women as wives, and two possible explanations for
    the coexistence of family-based marriage and bride capture.
  language: English
