canonical_text:
  quote: ''
  summary: 'Ethnographic description of cassava processing: poisonous juice is pressed
    from cassava pulp in a matapie and boiled into cassareep; dried meal is sifted,
    baked into round cakes, and sun-dried; several group-specific variants are noted,
    including farine and maize cakes; cassava bread may be further made into paiwari,
    a beverage used at drinking bouts, on hunters'' return, for strangers, and by
    women and children.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woven bark cylinder called a matapie is suspended, filled with cassava pulp
    containing poisonous juice, and stretched downward by a pole weighted by a seated
    woman to squeeze out the juice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The expressed juice falls into a buck-pot and, after boiling, becomes cassareep,
    described as thick, treacle-like, and no longer poisonous.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dried cassava pulp is removed from the matapie, broken into a sieve, and
    sifted into coarse flour for storage or immediate bread making.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A thin layer of cassava meal is spread on a heated iron griddle or, among
    some remote Indians, on a flat stone slab; a woman smooths and rounds the cake
    with a fan while it bakes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Finished cassava cakes are thrown onto the roof to dry in the sun; when fully
    sun-dried, the bread is hard, crisp, nut-flavoured, and durable if kept from damp.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A small starchy residue called Emoo by the Caribs is made into a separate
    cake with a gelatinous consistency when fresh and a leathery, uneatable consistency
    when cold.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some True Caribs pound the meal before sifting and slightly smoke bread intended
    for keeping, producing bread described as more friable and digestible.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: When cassava is scarce, chopped cassava leaves, pounded mora or greenheart
    tree seeds, or pounded rotten wood may be mixed with the meal to increase bulk.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Arecunas sometimes make cakes like cassava cakes from maize.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Wapianas, Atorais, and Tarumas make most cassava into farine rather than
    bread; the passage links this to their location on the frontiers of Brazil, where
    that bread-stuff is said to be nearly universal.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: 'Farine differs from bread in baking: the meal is continually stirred on the
    griddle so that it dries into small crumbs instead of forming a single cake.'
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Much cassava bread is further transformed into paiwari, described as the chief
    Indian beverage.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Paiwari is consumed in large quantities at special drinking bouts and is also
    kept ready when cassava is available.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: Paiwari is drunk when men return from hunting, when a stranger enters the
    house, and by women, children, and youngest babies.
  category: action
  evidence_refs:
  - ev:11
