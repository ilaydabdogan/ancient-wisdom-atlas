canonical_text:
  quote: ''
  summary: The passage describes iguanas nesting in river sandbanks, Indigenous methods
    for locating and digging out nests, dangers from snakes and iguana bites, predators
    such as jaguars and perai fish, and several observations and anecdotes about feared
    snakes, especially land- and water-camoodi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Iguanas go to exposed river sandbanks or swim to mid-stream sandbanks, dig
    narrow tunnels in the sand, lay oval eggs with a white elastic covering, and leave
    the eggs untended to hatch.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young iguanas emerge from eggs under a mass of sand and instinctively
    find their way upward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Indians locate iguana nests by following tracks, noticing slight sand disturbance,
    probing with a pointed stick, and digging where the sand is soft and yielding.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports that a poisonous snake may be encountered in the holes,
    shares a liking for the eggs, and is said to have bitten Indians fatally.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: An iguana may still be in the hole after laying eggs; when dug out, it may
    bite, dig deeper to escape, hold fast by the tail, lose the tail if pulled, and
    eventually be captured.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Indians assert that jaguars dig out iguana eggs; the narrator reports jaguar
    tracks mingled with iguana tracks and suggests jaguars more probably hunt the
    adult lizards during breeding time.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Perai or houma fish are described as sharp-toothed and voracious, frequently
    biting off the ends of iguana tails as iguanas swim between sandbanks.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Snakes are described as abundant but retiring; the most dreaded common kinds
    named are two boas, the labarria, and the rattlesnake.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The land-camoodi is described as seldom seen and doing little harm to humans,
    while the water-camoodi is more often noticed, can be very large, frequents water,
    swims, and is dreaded by Indian bathers.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A thirty-foot water-camoodi is reported to have been found coiled around a
    kitchen corner post after a cook tried to strike matches on it in the dark.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The narrator reports hearing a snake snore near a tree at night and detecting
    a moderate-sized snake curled around a branch; by morning it had disappeared.
  category: sequence
  evidence_refs:
  - ev:9
