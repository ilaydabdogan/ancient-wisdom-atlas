  quote: ''
  summary: The passage argues that traveller accounts can exaggerate impressions of
    tropical animal life by selecting unusual events. It then gives a natural-history
    description of Guiana mammals, especially labba, acouri, water-haas/capybara,
    and two kinds of peccaries, noting their habitats, habits, abundance, uses as
    food, and occasional danger.
  language: English
  quote_policy: summarized
