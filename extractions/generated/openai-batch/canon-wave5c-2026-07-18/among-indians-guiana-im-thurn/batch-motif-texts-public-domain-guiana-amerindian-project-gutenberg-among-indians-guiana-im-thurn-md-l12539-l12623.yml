canonical_text:
  quote: ''
  summary: 'The passage describes several resinous substances and dyes used by Indigenous
    groups in Guiana: karamanni and twara as adhesives; hyawa-tree resin for fire-lighting,
    torches, and scented oil; and red, purple, blue-black, white, and yellow pigments
    for body-painting, implements, hammocks, and related uses.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Karamanni is used like pitch or glue to fill crevices in woodwork, in boat-building,
    and to fix arrow heads into shafts; the passage emphasizes its strength with an
    example of repairing a saw handle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A similar whitish resin called twara by the Macusis is sometimes, but rarely,
    used in place of karamanni.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A scented white resin from the hyawa-tree is inflammable, collected for lighting
    fires, placed in hollow sticks as torches, and formed into balls to scent oil
    used on bodies and hair.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The dyes named for body-painting and occasional implement decoration are red
    faroah, purple caraweera, blue-black lana, white felspathic clay, and a rare yellow
    vegetable dye of unknown origin.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Faroah is a deep-red pulp around a seed; it is mixed with oil, stored dried
    or liquid in bamboo tubes, applied by hand or with a stick, and also used by True
    Caribs to stain hammocks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Caraweera is prepared from leaves and other plant ingredients by boiling,
    settling, drying the purple sediment on cloth, scraping it off, and packing it
    in small palm-leaf baskets.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Lana is the juice of Genipa americana fruit and is applied directly to draw
    blue-black lines or stain larger areas of skin; the stain lasts about a week.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: White and yellow pigments are used rarely and sparingly by some Savannah Indians;
    white clay is collected, dried, pierced, and threaded, while the yellow dye is
    said to come from a tribe beyond the Wapianas that extracts it from a local tree.
  category: relationship
  evidence_refs:
  - ev:8
