  quote: ''
  summary: The passage classifies several Guiana Indigenous groups by physical descriptions
    and stated habits. It discusses Warraus, Arawaks, Wapianas with allied Atorais
    and Amaripas, and Carib-branch groups including True Caribs, Ackawoi, Macusis,
    and Arecunas. It describes trade roles, canoe-building, pottery-making, cassava
    preparation, intertribal aversion, European contact, and settlement patterns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Warraus are described as the shortest group, with less developed muscles,
    thick build, short thick neck, long trunk relative to legs, broad flat feet, and
    a dark appearance attributed by the author to dirt.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Arawaks are described as slightly taller than the Warraus, better proportioned,
    lighter in appearance and slightly lighter in skin, and as having brighter and
    more intelligent facial expressions.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Wapianas are described as unusually tall for Indians, slight and well
    built, with more regular features and finer faces.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage describes Carib-branch groups as generally darker-skinned, then
