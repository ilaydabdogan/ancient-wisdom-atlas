  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Wapiana and allied groups are described as the great canoe-makers of the
    interior and as eating much cassava in the form of rough meal called farine.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Carib tribes are described as more warlike than other tribes and therefore
