canonical_text:
  quote: ''
  summary: 'The passage describes hunters returning from the savannah and signaling
    their approach with fire so that women at home can prepare food and drink. It
    then describes Indian agricultural fields: their locations for forest and savannah
    groups, their overgrown appearance, the making of fields by felling and burning
    vegetation, wet-season planting of cassava cuttings by women, later weeding and
    mixed planting, and vigorous regrowth during cassava maturation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In open savannah country, hunters still far from home make a large fire as
    a visible signal announcing their return.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women at home are expected to prepare a large amount of bread and drink before
    the hunters arrive.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the hunters arrive home, they hand the meat to the women and rest in
    hammocks for several days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Forest-dwelling Indians use clearings around their houses as principal provision
    fields and may also keep other fields in nearby forest.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Savannah Indians usually keep fields at a considerable distance from their
    houses, in moist and shady coppices rather than on stony, unproductive ground
    near the houses.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: An Indian field is described as a cultivated spot that may look to a stranger
    like an abandoned clearing, with cassava and other plants mixed among bushy regrowth,
    fallen trunks, and a narrow footpath.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: To make a field, men choose a suitable place, cut undergrowth, fell trees,
    and burn the fallen refuse when dry weather seems likely.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The field fire burns leaves, small branches, and withered undergrowth, while
    larger trunks and branches remain charred or prostrate; palms with edible fruit
    are left standing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the beginning of the wet season, women carry cassava sticks to the field
    and insert three or four cuttings into small loosened patches of soil.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: If the field is far from home, lean dogs accompany the women as guards against
    possible attacks by jaguars or snakes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: While cassava grows, women weed only as much as necessary and plant other
    crops wherever space allows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: During the roughly ten months before cassava maturity, wild shoots, creepers,
    razor-grass, passion-flowers, pea-flowers, convolvulus, and trumpet-wood grow
    vigorously in the clearing.
  category: sequence
  evidence_refs:
  - ev:7
