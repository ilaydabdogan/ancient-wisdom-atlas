  summary: 'The passage describes a reported food taboo involving pregnant women and
    hunting dogs, lists kinds of game sought in different habitats, and gives detailed
    accounts of fishing methods: poisoning dammed creeks with plant materials, baling
    water from pools with gourds, and shooting fish with arrows including a harpoon-arrow
    used by True Caribs.'
