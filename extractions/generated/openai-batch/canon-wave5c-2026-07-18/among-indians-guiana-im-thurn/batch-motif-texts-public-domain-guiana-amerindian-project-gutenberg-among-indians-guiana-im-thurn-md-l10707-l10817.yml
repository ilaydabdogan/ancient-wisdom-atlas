canonical_text:
  quote: ''
  summary: 'The passage describes foods and beverages among Indigenous groups in Guiana:
    edible insects and grubs, methods for gathering ants and termites, palm and wild
    fruits, famine foods, cultivated crops said to derive from Europeans, and drinks
    made from eta palm sap, fermented maize, cashew fruit, and honey.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that true ants, white ants or termites, grasshoppers, wasp
    and beetle grubs, and caterpillars are eaten.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the beginning of the rainy season, winged white ants and winged true ants
    are drawn to evening fires, lose or scorch their wings, fall to the ground, and
    are gathered and eaten.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At other seasons, an Indian may push a pointed stick into an ant or termite
    nest, withdraw it, and lick off the insects that have crawled onto the wood; the
    author compares this to ant-eaters inserting tongues into nests.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage describes eating a large black ant by biting off its abdominal
    segment, eating grasshoppers without preparation, knocking down wasps’ nests to
    eat grubs, eating the gru-gru worm, and boiling smooth-skinned caterpillars in
    famine.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
- id: obs:5
  text: 'Various palm fruits are heavily used: cokerite and Astrocaryum coverings
    and kernels are eaten, cokerite seeds may form famine food, eta palm seed covering
    is pressed into cake, and peach-palm seeds are boiled and eaten.'
  category: object
  evidence_refs:
  - ev:7
- id: obs:6
  text: Other wild fruits and nuts mentioned as eaten include bullet-tree fruit, small
    guavas called billicoes, and souari-tree nuts.
  category: object
  evidence_refs:
  - ev:8
- id: obs:7
  text: Yams, sweet potatoes, plantains, bananas, sugarcane, and maize are grown and
    eaten in small quantities; the passage says the Indians themselves regarded these
    as derived from Europeans.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:8
  text: Eta palm toddy is obtained where the tree is plentiful by cutting the tree,
    grooving the trunk, covering the groove with leaves, collecting the sap, and drinking
    it fresh or after fermentation.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:9
  text: Other beverages are made by fermenting boiled and crushed maize in water,
    crushing wild cashew fruit in water, and mixing wild honey with water.
  category: action
  evidence_refs:
  - ev:12
- id: obs:10
  text: 'The passage notes two naming relationships: the Arawak name for the gru-gru
    worm is described as identical with their name for tree heartwood, and the eta
    tree and its drink share names among the Macusis and Warraus.'
  category: relationship
  evidence_refs:
  - ev:10
  - ev:13
