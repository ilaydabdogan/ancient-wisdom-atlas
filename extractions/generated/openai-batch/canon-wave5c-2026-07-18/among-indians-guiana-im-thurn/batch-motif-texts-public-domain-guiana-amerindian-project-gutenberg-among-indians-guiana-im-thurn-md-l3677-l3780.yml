canonical_text:
  quote: ''
  summary: The passage gives practical advice for reaching Kaieteur, including route
    maintenance, use of Indian crews, season, paths to the foot and top of the fall,
    camping and viewing points, and then describes Roraima as a steep-sided sandstone
    table-land whose inaccessible summit is conjectured by some to preserve primitive
    animal forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author recommends improving existing portage paths and the path from Tookooie
    landing to the foot of Kaieteur rather than cutting new paths from the Essequibo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author proposes an annual present to Indians settled along the route on
    condition that they keep portages open, keep boats, and assist travellers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: For the expedition crew, the author recommends taking none but Indians, using
    a large boat up to Toomatoomari and smaller boats above it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author prefers visiting Kaieteur in the dry season because the journey
    is easier and the scenery of the Potaro River is then seen best, despite reduced
    water volume.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The walk to the foot of the fall is described as difficult and suitable only
    for a young and fairly active man; the author says the view below does not repay
    the toil.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The route to the foot of the fall follows a beaten track to a creek, continues
    by the creek or its southern side, then follows boulders near the river and enters
    forest near the Serikabaroo cataract.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The actual amphitheatre of the fall is difficult to enter; the traveller is
    told to camp at its mouth and may reach the pool edge by swimming from rock to
    rock.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The top of the fall is reached from Tookooie by a beaten path that is occasionally
    very steep.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A camping place is reached by crossing the savannah near the fall edge, while
    the best view is obtained by going left to the cliff edge of the amphitheatre.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Roraima is located on the extreme western edge of the colony near or beyond
    the Brazilian boundary and had been noticed or visited by several named travellers
    and collectors.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Roraima is described as a sandstone table-land rising from the plain, crowned
    by a flat-topped sandstone mass with perpendicular walls.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The flat top of Roraima appears to be forest-covered, and water falls down
    its sides at various points at least at some times.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: Some people hold that, if Roraima’s summit is inaccessible to men and unwinged
    animals, primitive animal forms may exist there cut off from communication with
    the rest of the world.
  category: speech
  evidence_refs:
  - ev:9
