canonical_text:
  quote: ''
  summary: The narrator's party enters the swollen Pirara, leaves the canoe when told
    it can go no farther, and crosses the flooded bed of Lake Amoocoo with Indian
    guides who follow a hidden path. After reaching Quatata and resting under a dry
    roof, the narrator describes delays in returning to Georgetown caused by scarce
    food, a rumor about English soldiers, a canoe removed by other Indians under a
    described local usage, and an outbreak of ophthalmia. The party then departs during
    the rainy season, carried rapidly downstream through rising water and flowering
    riverbanks.
  language: English
  quote_policy: summarized
