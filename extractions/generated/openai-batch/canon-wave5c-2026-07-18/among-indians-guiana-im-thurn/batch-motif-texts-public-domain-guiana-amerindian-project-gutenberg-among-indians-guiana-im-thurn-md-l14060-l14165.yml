canonical_text:
  quote: ''
  summary: 'The passage describes beliefs attributed to the Indians of Guiana: every
    perceptible object may have body and spirit; the world is full of potentially
    harmful beings; fire is carried after dark; a peaiman may temporarily clear beings
    away; spirits are regarded as part of the same order as material beings; and the
    dead are buried with dwellings or goods for continued use, though everlasting
    existence is not explicitly formulated.'
  language: English
  quote_policy: summarized
