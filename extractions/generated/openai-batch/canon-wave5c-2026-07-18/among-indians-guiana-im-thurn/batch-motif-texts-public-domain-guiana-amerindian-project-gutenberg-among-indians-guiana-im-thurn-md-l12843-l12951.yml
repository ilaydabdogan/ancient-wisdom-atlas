canonical_text:
  quote: ''
  summary: 'The passage describes several Guiana Amerindian dance and feast practices:
    linked-line dances with chanting and stamping; animal-imitation dances including
    monkey and jaguar/tiger dances; an Ackawoi animal-stick dance; paiwari drinking
    with quarrels and hammock restraint; renewal of revels until paiwari is exhausted;
    Macusi foot-races and ball games; an Arawak reciprocal macquarie whip dance; possible
    Maiongkong macquarie whips; and a fragmentary mention of Warrau wrestling.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dances are described as differing by tribe, with some tribes having several
    dances peculiar to them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: One simple dance form places men and women in opposite long lines, with linked
    arms, advancing and retreating for hours while chanting and stamping in time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At times a man and woman link arms and move slowly together, bending their
    bodies in multiple directions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some dances imitate animal movements, including a lively monkey dance and
    tiger-dances that imitate the jaguar's slow, stealthy gliding.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the tiger-dance, a man representing the jaguar creeps among the other dancers,
    springs with a roar on one, carries that person out of the circle, and repeats
    this until he remains alone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In an Ackawoi dance, each performer represents a different animal and carries
    a stick bearing the figure of that animal.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dances are accompanied by chants, and the end of each dance is marked by a
    loud discordant uproar that signals renewed drinking.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: During paiwari revels, intoxication can lead to abuse, quarrels, slapping
    blows, and both striker and struck person falling from loss of balance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: If a fallen intoxicated person continues to cause trouble, less intoxicated
    members sew the person into a hammock, leaving the person helpless but still shouting.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the night revel ends, participants retire to hammocks, and the revel
    is renewed the next morning until the available paiwari is exhausted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Among the Macusis on the savannahs, paiwari feasts are generally accompanied
    by foot-races; racers wear collars of white heron feathers or black powis feathers
    and start one behind another.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ball games are played on these occasions, using a ball made either from part
    of an ear of Indian corn or from native indiarubber.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Arawak paiwari feasts are described as formerly involving a painful male dance
    with macquarie whips, in which paired dancers lash one another's calves until
    weals and blood appear, then retire and drink together.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The reciprocal whipping is said to be borne and inflicted with good temper
    and is presented as probably originally devised to test endurance.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: Collections are said to contain simple canes identified as macquarie whips
