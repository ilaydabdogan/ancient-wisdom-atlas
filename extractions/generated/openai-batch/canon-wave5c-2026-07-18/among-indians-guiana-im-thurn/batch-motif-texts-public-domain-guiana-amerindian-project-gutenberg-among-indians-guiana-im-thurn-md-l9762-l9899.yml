canonical_text:
  quote: ''
  summary: The passage describes several forms of game arrows used by Indigenous groups
    in Guiana, including iron spear-headed arrows, older bone/shell/stone points,
    bamboo rappoo arrows thought by some to be poisonous, and ourali-poisoned arrows
    with varied point forms for different animals or purposes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Big-game arrows are described as having diamond-shaped or spear-like heads,
    now commonly filed from iron hoop or other old metal.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that earlier arrow points were probably made from turtle
    or other animal bone, mollusc shell, or stone.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A True Carib informant says he saw bone-, shell-, or stone-pointed arrows
    in common use as a boy and still uses a bone-pointed arrow to shoot iguanas.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Savannah tribes are described as using long lance-shaped rappoo bamboo arrow
    heads for big game instead of iron diamond-headed arrows.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rappoo bamboo arrow heads are cut, dried, shaped, and hardened in fire before
    being fixed into a reed shaft.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rappoo arrows are said by Indigenous informants and some named observers to
    be poisonous, but the narrator’s fowl experiments did not confirm a fatal effect
