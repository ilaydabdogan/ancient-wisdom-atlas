  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ourali arrows use long, narrow, flat strips of light wood smeared with a vegetable
    poison and inserted into the end of a reed shaft.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ourali arrow points may be carried separately in a small hollow-bamboo quiver
    or protected by a hollow-bamboo sheath when carried in the shaft.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The stated purpose of carrying or sheathing ourali points is to protect the
    user’s hand from contact with the poison.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ourali is described as a vegetable substance prepared by Indigenous people,
