canonical_text:
  quote: ''
  summary: The passage presents an ethnographic account of Guiana animism. It states
    that morality and religion are separate in this context, then describes a belief
    that each human consists of body and spirit. Death is explained as the spirit
    going while the body remains; a Macusi example links the vanished reflection in
    a dead person's eye to the departure of the emmawarri. Sleep and dreams are treated
    as analogous to death because the spirit leaves the body and acts in dream-life,
    which is regarded as continuous with waking life. The deceased may continue to
    appear and act in dreams.
  language: English
  quote_policy: summarized
