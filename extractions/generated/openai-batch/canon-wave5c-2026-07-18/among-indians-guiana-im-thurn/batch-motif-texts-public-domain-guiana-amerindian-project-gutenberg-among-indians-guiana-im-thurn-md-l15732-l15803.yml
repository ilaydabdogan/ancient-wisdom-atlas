canonical_text:
  quote: ''
  summary: The passage describes Guianese rock-pictures or petroglyphs, including
    figures of suns, curved snakes, spirals, and circles, often near water or sometimes
    high on cliffs. It reports several explanations attributed to Indigenous informants,
    including that women made them, that Makenarma Moomoo or God's Son drew them with
    his finger while wandering on earth, and that ancestors made high cliff engravings
    when water levels allowed canoe access. The author states that no satisfactory
    theory of their origin or intention exists, notes Richard Andrée's global comparison
    of petroglyphs, and rejects Andrée's conclusion that they are merely idle marks.
  language: English
  quote_policy: summarized
