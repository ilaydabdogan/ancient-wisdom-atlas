canonical_text:
  quote: ''
  summary: A natural-history passage describes several troublesome animals in Guiana—mosquito-worms,
    jiggers or chigoes, bush-ticks, spiders, scorpions, and centipedes—emphasizing
    how some enter or attach to flesh, the sensations and injuries they cause, and
    practical methods of removal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mosquito-worm or ssstus-worm is identified as the larval form of a gadfly
    and is described as occurring in the flesh of humans and other animals.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mosquito-worm’s presence is said to cause intermittent needle-like pricking,
    swelling like a tumour, and is described as a bristled worm-like larva about an
    inch long.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mosquito-worm is said to be removable by excluding air from the affected
    place with sticking-plaster or forest resins, after which the insect is drawn
    away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The jigger or chigoe is described as common in dust, huts, and especially
    loose sandy Indian settlements.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Female jiggers penetrate the skin of humans and domestic animals, often under
    the soft skin near nails, and take up position between skin and flesh.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage attributes the Indian habit of sitting on stools in houses to
    a desire to raise bodies out of reach of jiggers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Jiggers beneath the skin become full of eggs, enlarge to pea-like size, and
    if left undisturbed drop to the ground, where young hatch.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Jiggers cause sensations variously described as itching, tickling, or chilblain-like
    pain; boots are described as no real protection in places where they abound.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says native children suffer especially from jiggers, including
    feet and sometimes whole bodies when they roll in sand.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Jiggers may be extracted by lifting the skin with a needle and pulling them
    out, with the cavity treated by laudanum or tobacco ashes; untreated infestation
    in the foot can cause severe damage and eventual loss of the foot.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bush-ticks inhabit forest bushes, seize passing humans and animals with jaws,
    bury their heads in flesh, feed, and swell to several times their former size.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Bush-ticks may be made to drop from clothes or flesh by close exposure to
    fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Spiders, scorpions, and centipedes are said to be abundant by search but to
    attack human beings very rarely.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Spiders are described as abundant, varied in form, size, and colour; the bird-eating
    spider is described as large, black, hairy, and reputedly dangerous, though the
    narrator says he never knew such spiders to bite.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: A large spider identified as Phrynus reniformis is said to occur on the ground
    in mora forests near the upper Mazeruni River and is reported to have a poisonous
    bite and to attack men unprovoked.
  category: attribute
  evidence_refs:
  - ev:8
