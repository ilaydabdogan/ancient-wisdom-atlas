canonical_text:
  quote: ''
  summary: The passage describes lowering a canoe through Etannime falls, a hunt after
    a swimming herd of whinga or peccaries near the Potaro-Essequibo confluence, reported
    examples of killing peccaries during river crossings, the expedition’s return
    to Georgetown, and the chapter transition to Kaieteur Fall and Roraima with factual
    description and comparison of Kaieteur.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A narrow rapid at Etannime falls is described as about two miles long and
    hardly ten yards wide, with fast foaming water, overhanging trees, bends, rocks,
    and abrupt falls.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The canoe is lowered through reaches by a bow line; people aboard hold overhanging
    trunks and branches, while people on shore move the rope from point to point.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Where the channel is too crooked and rocky for shore-rope handling, everyone
    enters the canoe, lets it hurry down the rapid, and fends it from rocks with poles
    and tree-grasping.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At dawn near the Potaro and Essequibo confluence, the bowman notices a distant
    line of white foam and says the word “whinga.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage identifies whinga as the Macusi name for a bush-hog or peccary
    that lives in large herds, and says one herd was swimming the river.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The canoe crew paddles rapidly toward the herd while the narrator checks the
    guns; after a race of more than two miles, the hogs reach shore first.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the canoe reaches the shore where the animals disappeared, the party
    pursues them with guns or bows and arrows, and men later return with prey.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The passage says such herds often cross rivers, waiting on the bank at night
    until dawn and then plunging into the water for the opposite shore.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage reports that swimming whinga are easily killed and gives an example
    of one man killing fifty from a herd crossing the Mazaruni.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: In another reported case, Sassington swims from a timber punt with a rope,
    ties it to the legs of six hogs, returns to the punt, and hauls in the animals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The expedition ends with a return to Georgetown after six months away from
    the civilised world, in the author’s wording.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The chapter identifies Kaieteur Fall and Roraima as the two interior natural
    features of Guiana that have attracted the most outside attention.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: The author says he can write from personal experience about Kaieteur, but
    must rely on other travellers’ accounts for Roraima.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Kaieteur Fall is described as discovered and described in 1871 by C. Barrington
    Brown during a geological survey, and as formed by the Potaro dropping over a
    741-foot cliff.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Kaieteur is compared with Yosemite and Niagara in size, while its surrounding
    scenery is emphasized as especially remarkable.
  category: attribute
  evidence_refs:
  - ev:8
