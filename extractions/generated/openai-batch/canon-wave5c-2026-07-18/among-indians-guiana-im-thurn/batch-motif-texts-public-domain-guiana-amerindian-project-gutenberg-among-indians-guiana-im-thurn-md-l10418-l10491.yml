  quote: ''
  summary: The passage describes practical fire-making, cooking, and cassava preparation.
    It contrasts Warrau and Macusi fire-making woods, explains keeping fire-sticks
    dry during travel and making fire after rain, describes meat and fish boiled with
    peppers and cassareep into pepper-pot, and gives a domestic scene of women peeling,
    grating, and squeezing cassava roots.
