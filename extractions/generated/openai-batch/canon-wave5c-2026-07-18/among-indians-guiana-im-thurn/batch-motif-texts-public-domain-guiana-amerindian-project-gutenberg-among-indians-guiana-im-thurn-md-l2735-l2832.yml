  quote: ''
  summary: The narrator describes a journey from Georgetown up the Essequibo and Potaro
    rivers toward Kaieteur in October 1878. The passage recounts camps, portages,
    cataracts, rapids, deserted Ackawoi settlements, clear red river water, rock islands,
    sand banks, butterflies, a blooming tree, and the statement that Toomatoomari
    cataract is like a gate of Fairyland.
  language: English
  quote_policy: summarized
