canonical_text:
  quote: ''
  summary: The passage describes several Guiana shell-mounds, their dimensions and
    layered shell composition, burned strata, and contents including animal shells
    and bones, scattered split human bones, stone and quartz implements, charcoal,
    red pigment, ornaments, pottery, and a European tobacco-pipe stem. The author
    rejects a baking-slab explanation for the burned layers and proposes that fires
    were made periodically on the mounds.
  language: English
