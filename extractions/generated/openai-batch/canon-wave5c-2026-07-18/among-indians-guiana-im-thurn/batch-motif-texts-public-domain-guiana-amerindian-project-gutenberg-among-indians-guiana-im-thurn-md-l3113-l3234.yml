canonical_text:
  quote: ''
  summary: The narrator describes climbing from Tookooie to the savannah above Kaieteur,
    observing the bare rock plateau, unusual plant growth, the cliff, waterfall, pool,
    cavern, and surrounding valley. He records fear and later delight while viewing
    the falls, then describes camping near the edge and examining fissures and a geological
    explanation for the cave and ravine formation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party starts for the top of the fall by a beaten Indian track that is
    steep in places, climbs through forest for about two hours, and reaches the savannah
    from which the Kaieteur falls.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The savannah is described as a bare layer of hard conglomerate rock with soil
    only in cracks and fissures, where large Bromeliads, orchids, and fern growth
    occur.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the Kaieteur cliff, the narrator lies at full length with his head over
    the edge and looks down.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Below the cliff is a pool encircled by black boulders, receiving a column
    of white falling water; a black cavern is visible behind the fall through foam
    and mist.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The narrator first feels fear; when some men throw down a large Bromeliad,
    he says the act causes him unbearable pain, but these feelings later give way
    to wonder and delight.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The party camps in a clump of small trees at the edge of the fall and spends
    two days searching the place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The plateau near the cliff contains long, narrow, deep fissures parallel to
