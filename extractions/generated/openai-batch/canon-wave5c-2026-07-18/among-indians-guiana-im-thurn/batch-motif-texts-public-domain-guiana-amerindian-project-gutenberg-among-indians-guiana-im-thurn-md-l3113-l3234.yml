  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage explains the cave behind the waterfall as formed by backsplash
    washing softer sandstone from beneath harder conglomerate, and proposes that the
    fall retreats through occasional sudden collapses rather than only gradual wear.
  category: sequence
  evidence_refs:
  - ev:8
