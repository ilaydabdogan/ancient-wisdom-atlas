canonical_text:
  quote: ''
  summary: The passage explains Carib and Arawak hostility and slavery as the background
    for a Carib expectation that bravery or cowardice affects one's post-mortem status
    and location. It then describes Guiana Indian beliefs about a country beyond the
    sky, spirits associated with material bodies and natural places, and the absence
    of a spiritual hierarchy or supreme spirit. Particular rocks and water places
    are said to have spirits and to be feared according to perceived danger, malice,
    force, or cunning.
  language: English
  quote_policy: summarized
