canonical_text:
  quote: ''
  summary: The passage describes bird colour and sound in Guiana. It notes that many
    brightly coloured birds are difficult to observe clearly from the ground or in
    flight; humming-bird colours appear only at particular angles of light; sweet
    bird-notes are scarce, but many birds have striking or discordant calls; and the
    passage states that the Indian uses each bird cry as the bird’s name.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The cock-of-the-rock is occasionally seen in remote parts of the colony as
    a flash of orange light, and the scarlet curri-curri can be seen from far off
    on coastal mud-flats among white egrets.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The colours of many other birds are seldom apparent to the traveller because
    chatterers, parrots, and macaws are high in trees or in flight.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator disputes Waterton’s account of thousands of low-flying macaws
    and says macaws are generally in pairs or small groups, with larger flocks not
    confirmed by European or Indian informants known to him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Humming-birds are described as very brightly coloured, but their feather texture
    makes the colours appear only in certain lights.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A humming-bird held in the hand may look dull in some positions, while a slight
    movement can make one point of its body flash with intense colour.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator says a drawing of a single humming-bird cannot show all its colour
    points as visible at once, because each point glitters only when the light falls
    from a particular direction.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A flowering shrub may be surrounded by many humming-birds of the same species,
    each in a different position and showing different colour details.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: In nature, living humming-birds fly so rapidly that a colour flash reaches
    the human eye only rarely.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The traveller from temperate lands is struck by the almost entire absence
    of sweet bird-notes in Guiana, with the louis d’or and shik bird named as possible
    chief songsters.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'Striking notes are abundant: the pi-piyo calls its name, toucans yelp from
    high trees, bell-birds make metallic or drill-like notes, the quow makes a deep
    lowing sound, parrots and hawks have discordant cries, and goatsuckers moan at
    night.'
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
