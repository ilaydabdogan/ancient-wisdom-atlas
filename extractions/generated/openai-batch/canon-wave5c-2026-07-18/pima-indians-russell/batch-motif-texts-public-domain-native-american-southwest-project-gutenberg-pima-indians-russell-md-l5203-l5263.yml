canonical_text:
  quote: ''
  summary: 'The passage describes Pima objects and practices: magic tablets associated
    with medicine-men and a cache; turquoise ornaments and beliefs about illness caused
    by magically losing turquoise; a cure involving stones placed in water and drunk;
    and a stone pipe or tube used ceremonially and in healing by sucking and blowing
    to expel disease.'
  language: English
  quote_policy: summarized
