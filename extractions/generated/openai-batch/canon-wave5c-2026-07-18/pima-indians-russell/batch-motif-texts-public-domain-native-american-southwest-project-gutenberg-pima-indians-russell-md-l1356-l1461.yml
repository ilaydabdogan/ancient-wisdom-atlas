canonical_text:
  quote: ''
  summary: 'Calendar entries recount conflict episodes involving Pimas, Maricopas,
    Yumas, Apaches, Mohave Apaches, and Cocopas: a night alarm after a warming fire
    is seen, an ambush near Tucson, retaliation against an Apache captive, formalized
    combats with Yumas, and a campaign in which Apaches use signal smokes and form
    a circular attack line.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Oila Crossing on a cold spring night, a Pima irrigated a wheat field by
    moonlight and built a fire for warmth.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Apaches saw the fire, approached through a thicket, and the Pima ran to the
    village to give an alarm after hearing twigs crack underfoot.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pimas gathered, surrounded the Apaches, killed two riders whose horses stumbled
    into a gully, pursued the others, and killed them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A Pima party returning from Tucson was ambushed by Apaches; two men were killed
    and a boy was captured.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The captured boy is described as handsome and skillful with bow and arrow.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Later, Apaches came to steal horses near the villages; Pimas chased them,
    shot one, and captured an Apache called Slender Leg.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Slender Leg was taken to a plaza or open alkali flat, where people gathered,
    danced, and sang around him.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Two widows walked four times around the outside of the dancers' circle, entered
    when an avenue opened, and beat the captive with long mesquite clubs until he
    was insensible.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Maricopas accompanied by one Pima campaigned against Yumas; a Yuma messenger
    proposed fighting with sticks after setting aside knives and bows.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Maricopas agreed to the weapon rule, but the Pima said he had made his
    bow and arrows to use against the enemy and kept them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Four fighters from each side were to fight with sharp sticks or lances, and
    each squad ran or approached four times before combat began.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Named Maricopa combatants rode through or challenged Yuma lines, and the Pima
    and Maricopa Antoine escaped by using or keeping bows and arrows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: In an autumn battle, Yumas and Maricopas formed opposing lines; the war chiefs
    exchanged challenges, the Yuma chief was killed in personal combat, and the fight
    became general.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Mohave Apaches fought with bows and arrows on the Yuma side, then deserted
    when the Yuma line wavered.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: After the autumn battle, the Yuma chief refused immediate scalping because
    some Yumas might be scalped by mistake before their dead were gathered.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: In a spring campaign in the Verde valley, Maricopas, Pimas, and Cocopas saw
