canonical_text:
  quote: ''
  summary: 'The passage describes puberty and menstrual practices for Pima girls and
    women: a girl at puberty is placed for four days under a non-relative preceptress,
    taught household tasks and moral principles, follows restrictions, makes a basket
    gift, and may participate in a four-night puberty dance with songs intended to
    remove danger. It also describes four-day menstrual seclusion in bush shelters,
    food left at a distance, basket making, and bathing in the river before returning
    home.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl reaching puberty is described as an object of concern and distrust
    to elders because of newly acquired functional characteristics.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl's mother selects a favorite woman friend, not a relative, to take
    charge of the girl for four days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the four days, the older woman teaches household tasks and principles
    such as industry, honesty, and chastity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The girl and her preceptress cook and eat together apart from their families.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The girl makes a basket to give as a present to the elder woman.
  category: object
  evidence_refs:
  - ev:1
- id: obs:6
  text: The girl speaks little, uses a stick rather than her fingers to scratch her
    head, and is warned that using fingers would cause lice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The girl is forbidden to blow the fire, with the stated consequence that her
    teeth would come out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The passage states that there is danger in the girl that must be breathed
    out by songs to avert lightning stroke and other perils for her, her family, and
    the community.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: If a girl conceals her condition, a medicine-man is said to be able to discover
    her by magic and to attribute later accident to her.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: When parents have enough food for hospitality, they invite friends and neighbors
    to take part in a four-night dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The father and mother do not dance but select good girls to dance with their
    daughter for their good influence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Men and women form two facing lines on a hardened, swept plaza outside the
    house, with arms extended to embrace adjoining dancers.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: Blankets are stretched along the line to cover multiple dancers rather than
    wrapped around each individual.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: The lines advance and retreat rhythmically while puberty songs are sung.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The dance continues through the night without stopping for rest or food, and
    people return home in the morning to sleep.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: During menstruation women are secluded for four days in bushes near the village,
    where they make small shade shelters and baskets.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: Menstruating women live on pinole that is brought each morning and left at
    a short distance from their camp.
  category: object
  evidence_refs:
  - ev:6
- id: obs:18
  text: Women always bathe in the river before returning to their homes after menstrual
    seclusion.
  category: action
  evidence_refs:
  - ev:7
