canonical_text:
  quote: ''
  summary: A missionary expedition reaches San Juan Capistrano de Uturituc, where
    Gileño/Pima inhabitants greet the visitors formally, lodge them in a prepared
    hut with a cross, attend masses, dance, bring water, show cultivated fields and
    irrigation plans, and receive gifts. The passage later notes early nineteenth-century
    American beaver trappers and other American visitors who reached the Pimos Gileños
    and found them friendly.
  language: English, with Spanish names and phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Gileños attend mass and attempt to imitate Christian crossing gestures
    and other practices.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The expedition travels from the Laguna to San Juan Capistrano de Uturituc,
    described as a town of small lodges.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: About a thousand inhabitants are described as arranged in two rows, men on
    one side and women on the other, and they salute the visitors in turn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The inhabitants use handshakes, bowing, breast-touching, naming God, and a
    phrase glossed as meaning that God may aid them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The visitors are lodged in a large hut built for that purpose, and a large
    cross is placed in front of it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The local governor orders his wives to bring water from the river to his lodge
    for the people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After seeking permission, women dance from group to group with hands clasped.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some inhabitants offer their children for baptism, but the missionaries do
    not baptize them at that time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The fields are enclosed by stakes, cultivated in sections, and associated
    with five canals or drains near the river.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Because the river is low, sowing is delayed, and the inhabitants consider
    placing stakes and branches in the river to raise water into the drains.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage reports cotton spinning and cloak weaving, and also mentions sheep
    and Castilian fowl.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The commander distributes tobacco, beads, and glass trinkets, which please
    the recipients.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: On All-Souls day, two altars are erected and nine masses are said, with many
    Indians attending silently and decorously.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: A later section states that early American beaver trappers and named travelers
