literal_observations:
- id: obs:1
  text: Pat'anlkam at Gila Crossing is identified as a grave associated by name with
    the Bad One; the writer suggests it may be the grave of a Hohokam medicine-man
    taken for that of the son of Kakanyp. Other enclosed graves are called o'namtiksk,
    meaning unknown, and have beads strewn about them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ma'vit Va-ak or Tci'apatak is described as a heap of small stones over a shallow
    mortar containing partly broken beads, with fresh creosote branches mingled with
    decaying arrow-shaft fragments, indicating an old shrine still visited.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Evil spirits are said to dwell in the Picacho and Estrella mountains; the
    writer states this belief may be inherited from the Apache period and reports
    no shrines in those ranges.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: A tightly covered medicine basket was said to have been kept on a Santa Rosa
    mountain top by a Papago medicine-man who carried offerings to it, while all others
    were forbidden to touch it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: When an unnamed person lifted the cover of the Santa Rosa medicine basket,
    winds rushed out and blew away the people nearby.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A small cave near the summit of a lava-formed Santan hill is said to have
    held Hohokam sacrifices; later, Pimas deposited a child's body and other things
    there, and the cave was known as Va'rsa Va'-ak, Basket Lying, because it contained
    a medicine basket.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Two Pima warriors discovered the Santan cave basket while undergoing a sixteen-day
    lustration after killing Apaches; the basket contained deer-leg sinew and sticks
    that the finders associated with the sticks they were using to scratch their heads.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: When a medicine-man dies, his paraphernalia may be transmitted to descendants
    or hidden in an olla under a heap of stones; medicine-men may similarly sacrifice
    stock during life, and warriors' property may also be cached.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: One cache south of Casa Blanca contained concretions, crystals, shells, a
    stone-carved bird, and a war club deposited in an olla with an inverted bowl over
    it under a heap of stones at a hill spur summit.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: 'The passage distinguishes three classes of Pima medicine-persons: Si''atcokam,
    who treat disease by magic; Makai, who have power over crops, weather, and war;
    and Ilai''-itcottam, who use roots and simple remedies and are described as true
    physicians though less esteemed.'
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: Medicine power is described as obtainable through heredity, survival of a
    rattlesnake bite on the hand or near the heart, or dreams and trances; Kisatc
    reported nightly dreams in which someone endowed him with magic power until he
    began to practice.
  category: sequence
  evidence_refs:
  - ev:11
