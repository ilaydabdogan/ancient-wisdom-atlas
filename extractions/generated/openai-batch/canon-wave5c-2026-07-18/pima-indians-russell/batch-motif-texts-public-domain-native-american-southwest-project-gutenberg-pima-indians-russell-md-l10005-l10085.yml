canonical_text:
  quote: ''
  summary: 'The passage describes Pima-Apache warfare, Pima defensive organization,
    and an emerging war cult. It then describes Pima lustration for a warrior who
    has killed an enemy: sixteen days of seclusion, fasting, taboos, attendance by
    an old man, use and burial of a scratching stick, river bathing, a victory feast,
    acquisition of a hair fetish from the slain enemy, food and salt restrictions,
    and victory dancing with mourning for the dead.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage contrasts Apache raids for plunder with Pima warfare framed as
    revenge for prior injuries.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Pimas organized attack and defense, appointed runners to summon help,
    used smoke signals only to announce victory, and held sham battles for practice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that continual warfare affected Pima daily duties, arts,
    myths, religion, and the development of a war cult.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A Pima law required purification and expiation after killing an enemy, even
    though killing an enemy was praised.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The warrior who had killed an enemy fasted in seclusion for sixteen days and
    observed taboos.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: An old man attended the warrior during seclusion in groves near the river
    bottom or in nearby hills.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: During seclusion the warrior was not allowed to touch his head or face with
    his fingers; the stated consequences were white hair or wrinkles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The warrior used a stick to scratch his head; every four days the stick was
    buried at the root on the west side of a cat's claw tree, a new stick was made,
    and the warrior bathed in the river.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A victory feast was held in the villages and lasted eight days.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Halfway through the retirement period the warrior could go home to obtain
    a fetish made from the hair of the Apache he had killed, wrapped in eagle down,
    tied with cotton string, and kept in a long medicine basket.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The warrior drank no water for two days, fasted for four days, then received
    pinole from his attendant, who instructed him to stand back until others were
    served when food and drink were distributed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: If the warrior was married, his wife was not allowed to eat salt during his
    retirement; the passage says violation would bring owl disease causing stiff limbs.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The explanation given for the lustration law is that disobedience would stiffen
