canonical_text:
  quote: ''
  summary: The passage describes Pima illness categories, evil spirits and magical
    causes of disease, ritual cures using sticks, hair, feathers, water, slate tablets,
    masks, songs, smoke, sun-facing gestures, naming sponsorship, reciprocal gifts,
    and veterinary extraction rites. It also notes Navitco as a Papago-adopted spirit,
    a rainmaking claim by Navitco medicine-men, and prevalent diseases.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A throat disease named wheita is treated with a mesquite-root stick thrust
    down the patient's throat four times and passed four times over the heart.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tcunylm is described as an evil spirit that causes sickness in children, especially
    fretfulness; the cure includes a song, pressing the child's body with a strand
    of Apache hair, and using A'mina sticks tied with bluebird and redbird feathers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Another throat disease causing loss of flesh is treated by soaking A'mina
    in water, blowing through a feathered tube over parts of the patient's body, sweeping
    feathers downward, having the patient suck the A'mina four times, rubbing the
    bundle on the body, and repeating Siu-u's restoration-to-life speech while making
    passes toward the patient.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A disease attributed to harmful magic by evilly disposed persons or medicine-men
    is treated with slate tablets from ruins placed in water that the patient drinks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A child's sickness may be attributed to someone desiring to take it away from
    its parents; accusation of that person is said to result in the child's recovery.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Navitco is described as an evil spirit adopted from the Papagos, living in
    the mountain Papak, Frog, and causing swollen knees and inflamed eyes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the Navitco cure, masked medicine-men, singers, a corn-meal signal, a song
    with notched sticks, eagle-feather patting, mask touching, bodily rubbing with
    notched sticks, and a four-day salt avoidance are used.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Navitco medicine-men claim the power to bring rain.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: A child with dysentery is washed early in the morning, then a cross or medal
    is breathed upon, held toward the sun four times, passed in cross form over the
    infant, and associated with naming by godparents and annual reciprocal gifts.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Horses may be said to become sick when malicious medicine-men shoot live coals
    from an Apache fire into them; a healer diagnoses the direction, uses smoke, sucks
    out the coal, fills his mouth with water, and casts out the coal.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Sucking a hair from the body is said to occur in veterinary practice similarly
    to human ailment treatments.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage lists consumption, dysentery, and impetigo contagiosa among prevalent
    diseases, with brief notes on causes or former treatment.
  category: other
  evidence_refs:
  - ev:12
