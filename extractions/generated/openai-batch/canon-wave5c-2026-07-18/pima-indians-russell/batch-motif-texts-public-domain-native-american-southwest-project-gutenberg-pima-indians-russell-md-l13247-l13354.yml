candidate_motifs:
- id: motif:1
  label: Illness attributed to spirits or harmful magic
  taxonomy_refs: []
  basis: The passage attributes some child sickness to Tcunylm, knee and eye symptoms
    to Navitco, doctor's disease to harmful magic, child sickness to covetous desire,
    and horse illness to malicious medicine-men.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  - ev:10
  confidence: high
  cautions: This is a general ritual-medical pattern in the passage, not a single
    narrative episode.
- id: motif:2
  label: Fourfold healing gestures
  taxonomy_refs: []
  basis: Several procedures repeat actions four times, including the wheita stick
    treatment, A'mina sucking, sun-facing object presentation, and holding the child.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:9
  confidence: high
  cautions: The passage does not explain the significance of the number four.
- id: motif:3
  label: Healing through empowered objects and substances
  taxonomy_refs: []
  basis: Cures use mesquite root, hair, feathers, A'mina sticks, slate tablets in
    water, cross or medal, smoke, and extracted coal or hair.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: Objects are grouped by function in healing; the passage does not state
    a unified doctrine for all of them.
- id: motif:4
  label: Masked personation of illness spirit in a cure
  taxonomy_refs: []
  basis: The Navitco ceremony includes a masked medicine-man personating Navitco and
    a masked accompanying figure, Kakspakam, who interacts with patients.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives procedural details but not a mythic origin narrative
    for the personation.
- id: motif:5
  label: Extraction or drawing out of disease
  taxonomy_refs: []
  basis: Navitco pats patients with eagle feathers until disease is presumably drawn
    out; horse treatment removes a coal by suction; hair extraction is noted in veterinary
    practice.
  evidence_refs:
  - ev:7
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage includes the author's skeptical language for hair extraction;
    record retains the described practice without endorsing its efficacy.
- id: motif:6
  label: Restoration-to-life formula used for healing
  taxonomy_refs:
  - resurrection
  basis: A healing procedure repeats the speech of Siu-u from the time when that deity
    restored himself to life.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: Only the healing invocation is described; the underlying Siu-u restoration
    narrative is not included in this passage.
- id: motif:7
  label: Child naming and sponsorship exchange in a healing rite
  taxonomy_refs:
  - sacred_exchange
  basis: The dysentery treatment includes naming by godparents and annual reciprocal
    gifts of wheat or corn from godparents and baskets from parents.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage frames the exchange
    as part of an illness-specific christening practice rather than a general mythic
    exchange.
- id: motif:8
  label: Rainmaking power claimed by medicine specialists
  taxonomy_refs: []
  basis: The passage states that Navitco medicine-men claim the power to bring rain.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage only reports the claim and gives no rainmaking rite.
comparison_claims:
