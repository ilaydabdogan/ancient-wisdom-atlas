    a cautious cross-community contact or borrowing claim for this spirit figure.
  claim_level: historical_contact
  target: Papago-associated Navitco spirit tradition
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The passage does not describe the date, route, or circumstances of
    adoption.
- id: claim:2
  claim: The dysentery-child rite is characterized in the passage as combining Christian
    baptismal elements with sun worship and magic medical practice.
  claim_level: historical_contact
  target: Christian baptismal practice combined with local sun-facing and magical-medical
    elements
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The wording reflects the source's ethnographic framing; the passage
    does not independently document origins for each element.
