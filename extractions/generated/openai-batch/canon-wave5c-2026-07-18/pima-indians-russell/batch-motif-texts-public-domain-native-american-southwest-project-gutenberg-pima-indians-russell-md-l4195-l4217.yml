canonical_text:
  quote: ''
  summary: The passage describes Pima units of linear, land, distance, and value measurement,
    including a body-based “one stick,” a step-based distance unit, decimal equivalences
    involving calico, wheat, and horses, plot widths measured in steps, and long distances
    measured by days of walking. It also notes comparisons to Aztec, Cakchiquel, Maya,
    and English measures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The principal linear measurement is named humaka os, translated as “one stick,”
    and is defined as the distance from the center of the breast to the fingertips.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The writer regards the “one stick” measure as a primitive Pima measurement
    while noting its resemblance to the yard of the invading race.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the Pima measure corresponds with named Aztec, Cakchiquel,
    and Maya measures.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ten “sticks” make one “cut” of calico, which is equivalent to one “load” of
    wheat of about 150 pounds; ten cuts or loads equal one horse in value.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: One distance unit is humaka kuirspa, translated as “one step,” defined as
    a step with the same foot and estimated at about 5 feet.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Land is divided into plots 100 or 200 steps wide, depending on family size.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Long distances are measured by a day’s journey on foot; the passage gives
    seven days to Zuni as an example.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The term “step” is also applied to the English mile, but the passage says
    the people have had little opportunity to learn its definite meaning.
  category: speech
  evidence_refs:
  - ev:8
