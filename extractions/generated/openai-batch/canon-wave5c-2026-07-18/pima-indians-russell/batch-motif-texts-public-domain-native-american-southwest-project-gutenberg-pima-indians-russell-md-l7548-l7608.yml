canonical_text:
  quote: ''
  summary: The passage describes Pima face, body, and hair painting practices, including
    pigment storage, newborn face painting with red ocher and mother's milk, protective
    use of grease and color, festival and dress applications, gendered differences
    in color use, self-painting with water as a mirror, pigment sources through local
    collection and exchange, the decline of the practice, and the author's statement
    that any earlier symbolic meaning was no longer known.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bright-colored ochers and other minerals were kept in deerskin or cloth bags
    for painting the face and body.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Pima newborn's face was painted immediately after birth with red ocher mixed
    with the mother's milk, with the stated purpose of improving the skin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the newborn use, paint was mixed with grease or applied over grease;
    in cold weather grease and color were used to prevent chapping and provide warmth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Usually only the face was painted, but during festivals and other special
    occasions the entire body was painted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On dress occasions facial lines were made narrower and applied with a splinter
    or twig of arrowwood rather than with the hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Both men and women painted their bodies and used the same facial colors in
    different proportions; men used more black, and both sexes emphasized tattoo marks
    with black lines under the eyes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The designs consisted of simple vertical and transverse lines; paint was not
    often washed off, and additional lines were added as the design faded.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Each person painted his or her own face and used an olla of water as a mirror.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Men painted the frontal hair either white or red when preparing for a dance,
    while women painted their hair in white spots and bands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Pigments came from local hills and plant pollen, from Mohaves, Yumas, and
    Papagos, and later from diamond dyes; the author states that by the time of writing
    no Pima painted at all.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The author states that if the painted lines once symbolized thoughts or fancies,
    that knowledge had not survived; in the author's present they were considered
    meaningless and soon to be forgotten.
  category: other
  evidence_refs:
  - ev:6
