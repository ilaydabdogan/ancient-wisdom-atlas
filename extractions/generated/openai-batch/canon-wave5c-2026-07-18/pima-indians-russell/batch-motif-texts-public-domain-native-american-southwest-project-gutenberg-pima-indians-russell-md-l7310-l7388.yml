  summary: 'The passage describes Pima architectural forms and domestic spaces: ventless
    houses with low doorways, council houses, menstrual lodges, arbors used as open-air
    living and work areas, storehouses, and kitchen windbreaks. It also notes possible
    explanations or comparisons involving Apache attacks, Cocopa and other southwestern
    huts, and neighboring-tribe influence on kitchens.'
