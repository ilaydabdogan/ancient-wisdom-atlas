canonical_text:
  quote: ''
  summary: 'The passage describes Pima mortuary practices: friends flee at the moment
    of death to avoid dangerous magic; relatives cover and bind the corpse; earlier
    burials involved litters and shallow graves covered with timbers; later graves
    use a deeper round shaft with a west-side chamber, body placement with head south,
    and wooden supports; medicine-men receive distinct burial treatment, sometimes
    in isolated sacred places.'
