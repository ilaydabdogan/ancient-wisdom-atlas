canonical_text:
  quote: ''
  summary: 'A calendrical record lists events among Pima, Maricopa, and neighboring
    settlements from the late 1870s to early 1880s: killings after tizwin drinking,
    deaths from sickness, railroad construction, factional conspiracy and feud violence
    involving Blackwater and Santan, a revenge attack near the Government school,
    heavy snow, robbery-murder and execution, rattlesnake death, police action against
    Kwahadk''s, and a measles epidemic.'
  language: English
  quote_policy: summarized
