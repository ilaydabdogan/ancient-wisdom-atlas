  evidence_refs:
  - ev:5
- id: obs:8
  text: The escaped party and their friends attacked their Santan opponents early
    the next morning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Juan Thomas, his two brothers, father, and uncle were among those attacked;
