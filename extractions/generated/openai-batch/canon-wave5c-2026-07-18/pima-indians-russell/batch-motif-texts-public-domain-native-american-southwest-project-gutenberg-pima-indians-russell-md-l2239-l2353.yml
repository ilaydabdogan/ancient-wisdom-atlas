  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A feud originating in a previous quarrel led Blackwater and lower-village/Santan
    people to conspire to kill men of a certain faction on a planned night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A guard was set at Blackwater to watch the intended victims without revealing
    his purpose.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A brother at Casa Blanca decided he would be answerable if he did not warn
