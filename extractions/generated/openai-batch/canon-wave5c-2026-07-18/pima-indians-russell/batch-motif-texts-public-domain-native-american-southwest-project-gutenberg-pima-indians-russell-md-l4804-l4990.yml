literal_observations:
- id: obs:1
  text: Calendar sticks from Casa Blanca, Gila Crossing, and Blackwater are described
    as wooden sticks bearing symbols or records; the Blackwater stick was remade by
    the record keeper after the original was lost.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wooden spurs were made from crotched mesquite limbs and fastened to the foot
    with deerskin or maguey fiber attachments.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wooden saddletrees were sometimes made for riding and pack saddles and are
    described as crude imitations of saddles made by whites.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Pimas reported mesquite-wood awls were used in basket
    making before steel awls, while current awls used umbrella-rib points set in native
    handles.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The rope twister is described as a hardwood pin or handle passed through a
    spindle stick, used to twist maguey fibers or horse hairs into cord.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Operation of the rope twister involves one person spinning the spindle while
    stepping backward and a second person adding fresh fibers at the other end.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A'mina, or medicine sticks, are described as among the most important sacred
    objects in the medicine-men's paraphernalia.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A'mina bundles are usually of arrowwood and bound with native-spun cotton
    twine, with or without feathers attached to individual sticks.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: One A'mina bundle was made by Kd'm&l tk4k for use exclusively in the exorcism
    of Tcu'nylm, described as a spirit of disease.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Additional A'mina bundles are described with green or blue paint, sets of
    sticks, and attached turkey, small-bird, or red-bird feathers.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Wooden animal images representing a horned toad and a lizard are described
    as used by medicine-men in efforts to cure certain diseases.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The author reports hearing of two wooden masks among the Pimas and collecting
    one of them.
  category: object
  evidence_refs:
  - ev:8
