  summary: The passage describes Pima wooden and ritual objects, including calendar
    sticks, spurs, saddles, awls, a rope twister, A'mina medicine-stick bundles, animal
    effigies used in curing, and a wooden mask. It records materials, manufacture,
    use, and some comparative notes about European or white-made models.
  language: English
