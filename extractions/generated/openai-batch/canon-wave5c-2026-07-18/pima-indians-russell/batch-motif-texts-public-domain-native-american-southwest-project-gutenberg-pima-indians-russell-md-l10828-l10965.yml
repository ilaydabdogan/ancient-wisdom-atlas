candidate_motifs:
- id: motif:1
  label: Transformation after drinking prepared pinole
  taxonomy_refs:
  - shapeshifter
  basis: Vantre takes four drinks of the young woman's pinole, and feathers appear
    before he becomes a large eagle.
  evidence_refs:
