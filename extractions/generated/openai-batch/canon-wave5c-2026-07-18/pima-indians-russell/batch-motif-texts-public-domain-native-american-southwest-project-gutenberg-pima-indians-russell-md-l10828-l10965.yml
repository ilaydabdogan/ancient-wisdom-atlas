canonical_text:
  quote: ''
  summary: Elder Brother has a young woman prepare pinole at a pool for Vantre; after
    drinking four times Vantre becomes a large eagle. The eagle retreats to the mountains
    and abducts people. Elder Brother, also called Earth Doctor in the passage, enters
    Eagle's cliff dwelling, hides in fly form, is helped by Eagle's wife, kills Eagle
    and his son, and revives dead bodies with their blood. He then prescribes a post-killing
    seclusion rite. A separate episode at Casa Grande links a green lizard, rainbow-green
    earth, and the discovery of green stones used for ornaments.
  language: English
  quote_policy: summarized
