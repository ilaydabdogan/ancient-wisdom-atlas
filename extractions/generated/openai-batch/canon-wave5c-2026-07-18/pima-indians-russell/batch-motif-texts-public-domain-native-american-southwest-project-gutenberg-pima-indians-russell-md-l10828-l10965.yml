  cautions: The passage gives the sequence but does not explain the mechanism beyond
    the drink and Elder Brother's direction.
- id: motif:2
  label: Giant eagle predator in a mountain refuge
  taxonomy_refs: []
  basis: The transformed Eagle flees to the mountains, carries away men and women,
    and lives in a cliff house where bodies are kept.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: No external eagle-monster taxonomy is asserted beyond this passage.
- id: motif:3
  label: Rescuer infiltrates monster's dwelling in small animal form
  taxonomy_refs:
  - culture_hero
