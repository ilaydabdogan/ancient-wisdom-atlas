  text: Yumas attacked a Maricopa village, captured women, and were attacked by arriving
    Pimas; the captured women escaped during the confusion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A meteoric shower occurred in early winter and was followed by heavy rains
