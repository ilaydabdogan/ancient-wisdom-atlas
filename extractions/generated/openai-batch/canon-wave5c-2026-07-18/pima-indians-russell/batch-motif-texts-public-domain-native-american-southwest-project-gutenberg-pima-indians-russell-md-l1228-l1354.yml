canonical_text:
  quote: ''
  summary: The passage argues that Pima records are better understood as annals than
    calendars, lists categories of recorded events, and then gives entries from 1833-1837.
    These entries include a Yuma attack on Maricopas interrupted by Pimas; a meteoric
    shower followed by floods interpreted as disaster, punishment, or medicine-man
    magic; an alternative account in which the old goddess Takwa-artam stops her sons
    from drowning her people by asking them to return her milk; a bountiful year marked
    by worship and dancing; Apache raids; intoxication from cactus-fruit liquor leading
    to vulnerability; and later farming, war dances, songs, and martial practice.
  language: English
  quote_policy: summarized
literal_observations:
