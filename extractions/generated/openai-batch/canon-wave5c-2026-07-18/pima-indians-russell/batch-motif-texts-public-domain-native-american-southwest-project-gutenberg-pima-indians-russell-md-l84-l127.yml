  summary: The passage lists Pima and Papago consultants, calendar-record sources,
    and interpreters; notes Pima assistance to travelers and to whites against Apaches;
    and frames research questions about the Pimas' relationship to prehistoric ruins,
    earlier populations, culture movement, and migrations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Haliali, also called Juan Thomas, is described as a Christian Pima and former
    medicine-man who supplied information concerning the “occult,” a calendar record,
    and specimens illustrating medicine-man paraphernalia.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tco'kQt Nak, translated as Owl Ear, is described as an old man at the Salt
    River village and the first person from whom a calendar record was obtained.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Benjamin Thompson is described as keeping, so far as could be learned, the
    only calendar in the central group of villages about Casa Blanca and as relating
    the events commemorated by it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: K4enul-a, translated as Rattlesnake Head and known to whites as Joseph Head,
    is described as a chief who gave a calendar record and stick.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Jos<5 Lewis is described as the principal interpreter employed during the
    writer’s stay; he was a Papago raised among the Pimas and was engaged mainly in
    linguistic work.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Melissa Jones, the agency’s official interpreter, interpreted statements of
    Sika'tcu, her mother, known to whites as Old Mary, and also worked at intervals
    on calendars.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Jacob L. Roberts is described as speaking good English and being employed
    to secure Tco'kCit Nak’s calendar and revise linguistic material.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Carl Smart of Sacaton and Thomas AUi.son of Blackwater are named as temporary
    interpreters, along with several short-term interpreters from the lower villages.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states that friendly brown-skinned farmers on the Gila sometimes
    saved the lives of people in the days of transcontinental railroads.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Pimas are said to have rendered notable service as scouts in a long contest
    with the Apaches and to have fought on behalf of the whites.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Pimas are described as living in two river valleys strewn with ruins of
    prehistoric buildings and other evidence of a considerable earlier population.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage presents unresolved views that the present Pimas may descend from,
