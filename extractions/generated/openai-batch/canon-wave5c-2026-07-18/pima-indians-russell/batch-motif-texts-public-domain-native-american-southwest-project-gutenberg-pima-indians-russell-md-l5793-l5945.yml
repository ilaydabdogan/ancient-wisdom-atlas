canonical_text:
  quote: ''
  summary: The passage describes Pima pottery as largely plain, notes that decorated
    water vessels and smaller traded wares may bear designs copied from Hohokam potsherds
    whose symbolism is said to be unknown, identifies Sala Hina as a maker of illustrated
    vessels, and details clay sources, tempering materials, red ocher slip, black
    gum decoration from mesquite, and shaping and polishing tools.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pima ceramic ware is described as largely plain and undecorated, with cooling
    ollas for water being the vessels generally decorated.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The potters state that the designs are copied from Hohokam potsherds and that
    the symbolism is unknown to them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Many smaller decorated pieces are described as traded from the Kwahadk's and
    the Papagos; the Papagos bring them filled with cactus syrup to exchange for grain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The illustrated vessels were made by Sala Hina, described as one of the best
    potters on the Gila.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Common ware intended for heat is generally made from clay obtained among the
    Sk&s5wallk or Ska,s6wallk hills on the southern border of the Gila River reservation.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Ska,s6wallk clay is described as dry granular clay with quartz pebbles
    and feldspathic detritus, occurring in a place that looks more like a stone quarry
    than a clay pit.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Other clay sources include a clay pit on McClellen's branch, pits near the
    Casa Blanca ruin, and the river bottom near Rso'tdk.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sand and ground potsherds are used as tempering materials for some clays,
    while the Ska,s6wallk clay is coarse enough to require no tempering.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Red ocher is used as a slip on common utensils just before drying that precedes
    burning, while water coolers are usually made without this ocher coating.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Black gum for decoration is obtained by boiling mesquite chips from parts
    of the tree where gum has dried into hard scales.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The black gum dye is pale on dark clay before firing but appears deep black
    after the vessel receives slight burning.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: During vessel construction, the outside is struck with a paddle, the inside
    is supported by a flat circular stone, and other stones are used for polishing
    surfaces, necks, and sharp curves.
  category: action
  evidence_refs:
  - ev:9
