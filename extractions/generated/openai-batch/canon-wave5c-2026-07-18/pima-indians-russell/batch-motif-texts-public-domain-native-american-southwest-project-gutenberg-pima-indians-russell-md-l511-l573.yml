canonical_text:
  quote: ''
  summary: 'The passage combines a geographic and archaeological description of Picacho-area
    ruins with a reported Pima historical tradition: the Pimas claim local creation,
    survival after a destructive flood by one man, growth along the Gila, construction
    of Casa Grande by a chief, later settlement-building by his son, warfare, abandonment,
    a tale of a thorn hedge turned into snakes by medicine-men, plague, migration,
    and reduction from a formerly powerful sedentary people. It also notes a conditional
    scholarly comparison between Hopi or Zuni clans and the Hohokam of the Gila, questioned
    because of cremation customs.'
  language: English
  quote_policy: summarized
