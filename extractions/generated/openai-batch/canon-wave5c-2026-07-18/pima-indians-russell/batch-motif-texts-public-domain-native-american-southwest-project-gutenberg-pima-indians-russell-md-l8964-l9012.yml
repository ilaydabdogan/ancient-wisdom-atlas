canonical_text:
  quote: ''
  summary: The passage describes an infant naming or baptismal rite involving godparents,
    four dawn visits, ceremonial speech, touching the child, exposure to the first
    rays of the rising sun, naming, former use of beads, gifts, reciprocal naming
    obligations, later name practices, name taboos for youths and the dead, and comparative
    footnotes on similar baptismal or godparent naming customs.
  language: English; Spanish in quoted footnote material
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before a child is one year old, friends of the parents or godparents name
    the child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The godparents and other visitors come for four successive mornings and sit
    on the ground before sunrise outside the house where the child lives.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Members of the visiting company hold the child briefly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For a boy, the godfather gives a ceremonial speech, passes his hands across
    the infant’s limbs, holds the child aloft to receive the first rays of the rising
    sun, and gives the name.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: For a girl, the godmother delivers the speech and gives the name.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Beads were formerly held up to receive the first sunlight and then placed
    around the child’s neck.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Godparents gave gifts such as clothing, food, baskets, and similar items,
    and were said to care for the child very strongly afterward.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Parents reciprocate by naming the children of the couple who act as godparents
    to their own child.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Men’s later-life names are often derived from sexual organs, especially female
    organs, but such names are not given at baptism.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Unusual events or physical peculiarities may give an individual a name, as
    illustrated by names based on being fed by a missionary or on a gait.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: From about age ten until marriage, boys and girls are not allowed to speak
    their own names.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The stated penalties for speaking one’s own name are bad luck in losing arrows
    for boys and losing the rsallka or kiaha stick for girls.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: The name of a deceased person is not used; the person is referred to indirectly
    as the brother of another person, while the words in the name remain in the language.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: A footnote reports a Cherokee infant baptism custom at three days old, with
    a belief that without the rite the child cannot live.
  category: other
  evidence_refs:
  - ev:6
- id: obs:15
  text: A Spanish footnote describes a child having a peri or godparent who speaks
    to the newborn, touches and stretches the body and limbs, gives a name, and is
    then treated civilly as the same person as the child; women perform the corresponding
    act for girls.
  category: other
  evidence_refs:
  - ev:7
