canonical_text:
  quote: ''
  summary: 'The passage describes Pima beliefs about dreams: dreams may result from
    evil doing, communication with the spirit world, or the action of Darkness/Night;
    in dreams the soul wanders and has adventures; dreams of the dead cause sickness
    or death; persistent dreams may call a medicine-man; and a man named Kisatc believed
    that, in a swoon or trance, he traveled far away and received a bow and arrows
    from a stranger. An interleaved fragment also mentions prayer to Estsamiltehi,
    Goddess of the Sunset Land, and quotes a note about first man and first woman
    being banished east and becoming sources of evils from that direction.'
  language: English
  quote_policy: summarized
