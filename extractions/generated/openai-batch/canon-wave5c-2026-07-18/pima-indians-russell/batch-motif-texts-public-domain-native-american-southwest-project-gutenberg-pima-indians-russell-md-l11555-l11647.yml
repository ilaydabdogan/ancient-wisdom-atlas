candidate_motifs:
- id: motif:1
  label: dream omen before contest
  taxonomy_refs:
  - wisdom
  basis: Black Beetle's dream is explicitly treated by his party as a good-luck sign
    before the race he wins.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage presents the dream as an omen, but does not elaborate a doctrine
    of dream interpretation.
- id: motif:2
  label: competitive game deciding marital privilege
  taxonomy_refs:
  - sacred_exchange
  basis: The agreed race rule links victory in the ball game to the privilege of marrying
    after four days.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage states an exchange-like wager over marriage privilege, but
    does not characterize the marriage privilege as sacred.
- id: motif:3
  label: Coyote gambling, bad faith, and boundary violation
  taxonomy_refs:
  - trickster_boundary
  basis: Coyote figures gamble repeatedly; Sandy Coyote acts in bad faith, wins Yellow
    Coyote's body and soul, kills and eats him, and tries to draw the son into gambling.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The label uses the available Coyote-trickster taxonomy, but the passage
    itself does not use the word trickster.
- id: motif:4
  label: rival Coyote brothers in mirrored scenes
  taxonomy_refs:
  - sibling_pair
  - duality
  basis: The Coyote brothers compete over the race and marriage privilege and enact
    paired scenes in which each tries to build a fire to inspect the other's wife
    and then insults her.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: medium
  cautions: The brothers are not presented as sacred twins; the motif is limited to
    sibling rivalry and mirrored action in this passage.
- id: motif:5
  label: pregnant widow protects son from father's killer
  taxonomy_refs:
  - departure
  basis: After Yellow Coyote is killed, his wife bears a son, warns him against the
    gambling that killed his father, and removes him eastward from Sandy Coyote.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The departure is literal flight or removal; no larger journey cycle is
    completed in the supplied passage.
- id: motif:6
  label: fire preserved during rainy flight
  taxonomy_refs:
  - departure
  basis: The mother carries fire in a small olla while taking the boy away in the
    rain to a mountain refuge.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage gives the action but does not explain the ritual or cosmological
    meaning of preserving fire.
- id: motif:7
  label: youthful hunter's growth through graded weapons
  taxonomy_refs:
  - initiation
  basis: The boy begins with a little bow and arrows, kills increasingly larger animals,
    and receives larger bows and arrows from his mother as his hunting ability grows.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage does not explicitly call this an initiation; the classification
    rests on the staged development of skill.
- id: motif:8
  label: animal helper grants hunting success and equipment
  taxonomy_refs:
  - initiation
  basis: Mountain Lion kills the mule deer for the boy and gives him bow, arrows,
    quiver, and clothing, after which the boy kills plenty of deer.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The helper relationship is clear, but the broader consequence for the
    boy is only partially shown in this passage.
