canonical_text:
  quote: ''
  summary: 'A sequence in a Coyote narrative: Yellow Coyote seeks a winning game,
    Black Beetle dreams of a successful ball race, and wins a race against Duck, giving
    Yellow Coyote marriage privilege. The Coyote brothers then bring wives home in
    mirrored night scenes involving failed fires and insults. Later Yellow Coyote
    loses at gambling, wagers his body and soul, and is killed and eaten by Sandy
    Coyote. Yellow Coyote''s pregnant wife gives birth to a boy, protects him from
    Sandy Coyote''s gambling challenge, takes him east while carrying fire, and raises
    him in the Superstition mountains. The boy becomes a hunter and receives help
    and equipment from Mountain Lion.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yellow Coyote loses at many games before proposing a game he thinks his side
    can win.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Black Beetle reports a dream in which he carries a green ball, kicks it four
    times toward the east to the sunrise, then four times toward the west while darkness
    fails to catch him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Black Beetle's party interprets his dream as a sign of good luck.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Yellow Coyote and his brother agree on a ball-race rule: the first runner
    to kick his ball back over the starting line wins for his side, and the winner
    gains the privilege of marrying after four days.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Black Beetle defeats Duck in the race by kicking his ball over the line first,
    winning for Yellow Coyote.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After four days Sandy Coyote acts in bad faith by bringing home a wife at
    midnight from the Va-aki A-p; Yellow Coyote tries to build a fire to see her,
    but the fire does not burn, and he insults her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Yellow Coyote later brings home Ho-ony Of'l, Corn Woman, from people on the
    Gila River; Sandy Coyote repeats the failed-fire scene and insults her in similar
    terms.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Yellow Coyote resumes gambling, loses all his property, wagers his body and
    soul, and is won by Sandy Coyote, who kills him and eats his flesh.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Yellow Coyote's wife is pregnant when he dies and later gives birth to a boy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The boy hides fallen deer fat from Sandy Coyote and denies seeing it; Sandy
    finds it and proposes playing ki'ts with him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The boy's mother warns him not to gamble because gambling caused his father's
    death, then takes him east in the rain while carrying fire in a small olla.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The mother and boy live in the Superstition mountains on herbs and grass seed,
