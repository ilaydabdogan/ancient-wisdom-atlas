  summary: 'At home, a mother tells two boys about an eagle of theirs. The boys go
    to the place; the younger brother tries first to climb for the birds but cannot
    do it, and the older brother gets the birds and brings them down. The brothers
    quarrel over two birds: the older proposes an age-matched division, but the younger
