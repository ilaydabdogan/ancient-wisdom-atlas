canonical_text:
  quote: ''
  summary: 'The passage concludes a Sandy Coyote wagering episode in which a young
    man repeatedly defeats Sandy Coyote, wins all his possessions and Sandy Coyote
    himself, moves an allegedly immovable cane, kills Sandy Coyote, and returns home.
    It then describes a journey during which the young man’s mother and wives become
    spiders and the young man becomes a lizard. A brief note describes Coyote as wise,
    dangerous to harm, avenging, mischievous, and sometimes a warning of Apache danger.
    The passage then presents another version of a creation myth: before earth there
    are darkness and wind, a lone man wanders, makes earth, water, stars, moon, Milky
    Way, and sun, and later named beings make living creatures and people from hard
    mud. The text also mentions speech interpreted as foretelling wars, Mesa people
    making a ditch, a named ditch expert, a tree-derived spade, the beginning of war,
    and the making of bows and arrows.'
  language: English with Pima names and terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man proposes a wager about finding a moon; Sandy Coyote sees the supposed
    moon, concedes that the young man wins, and the young man repeatedly wins subsequent
    play.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During preparation to play ki'ts, Sandy Coyote tells the young man to sit
    in his father's place; the young man turns this into a carrying wager, and Sandy
    Coyote cannot move him because he is too heavy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man challenges Sandy Coyote's statement that no one can move the
    cane, moves it himself, wins the final wager, grasps Sandy Coyote by the hair,
    shakes him until he dies, takes the winnings, and goes home.
  category: sequence
  evidence_refs:
  - ev:3
