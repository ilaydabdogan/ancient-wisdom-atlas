  summary: An ethnographic list describes Pima food plants and preparation methods,
    including wheat processing, edible bulbs, leaves, seeds, cactus products, former
    cotton cultivation, seasonal gathering, food storage, and trade in certain foods
    from the Papagos. Some neighboring Mexican and white uses or terms are also noted.
  language: English
