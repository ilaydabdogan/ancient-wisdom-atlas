canonical_text:
  quote: ''
  summary: 'The passage describes several Pima/Gileño games: an archery game using
    opposed prickly-pear leaves as targets; an arrow-crossing shooting game; a children''s
    game with feathered corncobs; a women''s stone-tossing and pickup game; a stave-casting
    game with red and black sides and sand scoring; and a dart-and-ring game using
    gourd rings, maguey cord, and a sharpened stick.'
  language: English with Indigenous game terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The title XAOF TOWE K.IKRSA is glossed as “prickly-pear standing opposite.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In XAOF TOWE K.IKRSA, usually four players, or sometimes two, set prickly-pear
    leaves opposite each other about 30 yards apart and try to pierce a leaf with
    an arrow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When four play XAOF TOWE K.IKRSA, two partners share winnings or losses; arrows,
    bows, and similar property are wagered, and a bow is valued at 10 to 20 arrows
    according to quality.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: An embedded note describes an object called rsika, glossed as “slave,” 40
    or 50 mm in diameter, pitted in the center “to prevent cheating,” and made of
    pottery or stone.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: In KaORSA, two or four players shoot one arrow to lie on the ground about
    100 feet away and then shoot two more arrows in an attempt to cast them across
    the first.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In KWAITUSiwiKftT, children toss corncobs with one to three feathers stuck
    in them into the air; they do not shoot arrows at them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage introduces three games, in addition to the athletic game kldH,
    as games played exclusively by women.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: In MEKtjT TOAKUT, two women use five carefully selected rounded pebbles 3
    to 4 cm in diameter.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: In MEKtjT TOAKUT, the first player names one stone “my stone,” tosses it into
    the air, watches it, and snatches up other stones before it falls, progressing
    from one at a time to all at once; completing the sequence without mistake wins
    the game.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A more difficult MEKtjT TOAKUT sequence has the named stone tossed while the
    remaining stones are pushed under an arch formed by the fingers; in the one-plus-three
    combination the player names one stone as the opponent’s and says she will not
    pick it up first.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: KA-AMiSAKUT uses eight sticks in two sets of four, with black and red sides
    arranged oppositely on rounded and flat faces; two players each use a set and
    exchange sets alternately.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: In KA-AMiSAKUT, the sticks are held loosely in the right hand and thrown from
    a metate or other stone; all red scores one point, all black scores two, and four
    points wins.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: TCXlLIKIwiKfrr is identified as the Gileño form of a widespread dart-and-ring
    game; it is not exclusively a woman’s game but was sometimes played by women,
    and the younger generation is said to know nothing about it.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:14
  text: The TCXlLIKIwiKfrr apparatus consists of gourd rings of varied diameter strung
    on a maguey fiber cord, held by a rectangular gourd piece at one end and attached
    to a sharpened stick at the other.
  category: object
  evidence_refs:
  - ev:12
- id: obs:15
  text: In TCXlLIKIwiKfrr, the player tosses the rings upward by a swing and, while
    holding the butt of the stick, thrusts the dart through as many rings as possible;
    failure passes the apparatus to the opponent, while continued scoring allows continued
    throws.
  category: sequence
  evidence_refs:
  - ev:13
