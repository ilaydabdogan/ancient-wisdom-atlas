canonical_text:
  quote: ''
  summary: The passage describes reported Pima social morals before and after contact
    with Spaniards and Americans. It discusses honesty, secure property, anti-homicide
    instruction through fear of retaliation, an exception for killing a convicted
    sorcerer, suicide burial practices, adultery sanctions, prostitution and chastity,
    theft and intoxicants under post-contact disruption, work training, cleanliness,
    truthfulness, generosity, and chiefly expectations. Fragmentary included notes
    mention Papago social divisions and a Spanish report of Cocomaricopas capturing
    Nïjora boys and selling them as slaves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that earlier Pima moral standards were praised by multiple
    writers, with life and property described as secure and labor and sex relations
    adjusted in a creditable manner.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Elders instructed youth not to quarrel or kill a neighbor because killing
    would lead to retaliation.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Within the tribe, killing a convicted sorcerer is presented as the one exception
    to the abhorrence of bloodshed and is called meritorious.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Suicide is said to have carried no odium; the body was buried in the usual
    manner, and property was divided or destroyed in the usual way.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage lists several suicide cases, including a blind old man, a young
    man restricted from selling property, a deserted husband with children, and a
    deserted woman who starved herself and her baby in the desert hills.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Arson is described as unknown, although dwellings were often burned by accident.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Adultery was punished by sending the woman away from the home; in some cases,
    the husband shot the horse of the offending man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says prostitution had not depleted the Pimas as it had some surrounding
    groups, and that loose women were rare in earlier times according to elders and
    outside testimony.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: One informant is reported as saying that the infant daughter of a prostitute
    by an unknown father was destroyed to prevent her from becoming like her mother.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Theft is described as increasing with post-contact deprivation, including
    horse and cattle stealing involving Papagos, Pimas, Sonora, and Mexico.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: During a period described as demoralized, some people stole wheat to sell
    for whisky, while most of the tribe disapproved and public opinion remained powerful.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Intoxication was regarded as reprehensible, but the passage distinguishes
    drinking white men's whisky from getting drunk on native-brewed liquors during
    the saguaro harvest.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Laziness was condemned, and boys and girls were taught productive labor such
    as spinning and delving.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Cleanliness is described through swept house floors and yards, bundles of
    arrow bushes or mesquite branches, and daily bathing.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Public opinion strongly condemned lying and stinginess; chiefs were expected
    to distribute gifts liberally, and the present chief's thrift was said to reduce
    his popularity.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: A fragmentary included note states that the same divisions existed among the
