  summary: The passage recounts nineteenth-century travel, military movement, surveying,
    and emigration through the Gila valley and the Pima villages. It cites reports
    describing the Pimas as friendly, hospitable, protective toward American travelers,
    and hostile to Apaches. It also includes an earlier description of Pima settlement
    near the Gila River, wells dug in sand when the river was dry, cottonwood groves,
    and the relocation of a town for defensive reasons. The United States later recognized
    Pima assistance through land survey funds, gifts, and military enlistment.
