canonical_text:
  quote: ''
  summary: The passage lists medicinal plants and preparations used chiefly by the
    Pimas, including roots, leaves, bark, gum, flowers, and pulp prepared by pounding,
    boiling, drying, grinding, chewing, or combining with soot. Remedies are applied
    or consumed for earache, toothache, wounds, sores, sore eyes, diarrhea, biliousness,
    throat disease, consumption, syphilis, gonorrhea, and as emetics, cathartics,
    poultices, dressings, washes, styptics, and teas. One entry mentions Pihoj, an
    evil spirit in the east that causes certain diseases and has associated songs;
    the same name is also reported by one informant for a tree used to make a throat-healing
    medicine stick, though the author could not verify the statement.
  language: English
  quote_policy: summarized
