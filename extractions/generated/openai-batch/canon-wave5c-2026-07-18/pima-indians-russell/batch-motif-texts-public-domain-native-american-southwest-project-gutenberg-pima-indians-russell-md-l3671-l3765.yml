canonical_text:
  quote: ''
  summary: The passage surveys Pima animal food practices and includes notes on mountain
    sheep horns and tails in relation to winds, rains, springs, and Papago rain ceremonies;
    a reported Papago child sacrifice intended to increase water; fish availability
    under drought; occasional or past use of deer and burros; and avoidance of snakes
    and lizards as food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gopher hunts are occasionally arranged like hare drives; the animals are poked
    from retreats with sticks and roasted on coals without preparation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A 1607 Spanish diary extract reports a Pima-area town named for a great heap
    of wild sheep horns that appeared like a hill, and states that wild sheep were
    common subsistence there.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A later inquiry reports that mountain sheep horns were not brought home by
    hunters; each man deposited them in a separate place so they would exert no evil
    influence on winds or rains.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Papago medicine-men deposited mountain sheep tails together with eagle feathers
    at springs during rain ceremonies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The same tribe is reported to have sacrificed children in an effort to increase
    the water supply, with the reported result that the springs dried up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Fish appear in Pima traditions and traveler notes; the Pimas sometimes caught
    many fish, but drought could dry the river near villages and make fish unreliable
    as food.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says present Pima terminology had one name for all fresh fish,
