    travel.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Burros were eaten in the past but are rarely used as food at the time described.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Snakes are not eaten even in famine, and the idea of eating lizards is rejected
    with scorn.
  category: action
  evidence_refs:
  - ev:9
