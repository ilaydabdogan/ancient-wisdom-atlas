canonical_text:
  quote: ''
  summary: The passage describes several rattles, dance practices, annual saguaro
    harvest festivals involving saguaro liquor, and the Name song, a festival-charity
    practice in which visitors assume residents' names and receive food through a
    ritualized chase.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cocoon rattles are described as bombycid moth cocoons with outer coverings
    removed and gravel sewn inside; two strands contain 70 and 66 pairs of cocoons.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rustling sound of the cocoon rattles is compared to the warning sound
    of a rattlesnake.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Stu'aton Flats, a turtle-shell rattle is said to be used in treating “turtle
    disease,” though no specimen was seen.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hoof rattles, usually made of dewclaws, are described as once common among
    the Pimas, though absent at the time of observation.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dancing was performed by both sexes and accompanied by song, basket drum,
    and rattle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dancers stood in a circle with arms extended across neighboring shoulders,
    limiting movements to foot stamping and body bending.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When food was plentiful, dances could last all day; participants came painted,
    women brought food, and dancing and feasting proceeded continuously.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The saguaro harvest festival was annual when fruit was available and centered
    on preparing and drinking navait or saguaro liquor.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Saguaro fruit syrup was boiled for two days in large ollas while people gathered
    and danced nearby.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says the saguaro-liquor custom was declining under several influences
    and notes that Apache threats made warrior intoxication dangerous.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Name song is described as a social device combining organized charity
    with an ordinary festival, used when a food-scarce village visited a village with
    plentiful crops.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Visitors learned residents' names, arranged them in a seventy-stanza song,
    and each visitor assumed a resident's name as a seal of fellowship.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: When a name was called in the song, a resident's wife or daughter ran with
    a light object, was pursued by the wife or daughter of the visitor using that
    name, and then led captors to foodstuffs presented as the value of the name.
  category: sequence
  evidence_refs:
  - ev:7
