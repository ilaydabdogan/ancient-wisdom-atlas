candidate_motifs:
- id: motif:1
  label: ritualized war departure with divination
  taxonomy_refs:
  - departure
  basis: Before the party fares forth, the makai performs an owl-feather rite, songs
    are sung, and he foretells enemy deaths.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The taxonomy link to departure is literal and contextual; the passage
    is ethnographic warfare description rather than a mythic hero-departure narrative.
- id: motif:2
  label: smoke-borne prayer to a solar deity
  taxonomy_refs:
  - sacred_exchange
  basis: Tobacco is used in ceremonial smokes that carry individual prayers to the
    Sun god.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage describes prayer transmission through smoke; it does not explicitly
    describe a reciprocal exchange or offering returned by the deity.
- id: motif:3
  label: ritual destruction of a fallen warrior's weapons
  taxonomy_refs: []
  basis: When a comrade falls in battle, his bow is broken and arrow shafts are snapped
    and left at the place of death.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No explicit theological interpretation is given in the passage.
- id: motif:4
  label: fire rules around war death and return
  taxonomy_refs: []
  basis: Battle dead may be burned away from villages, while fires for warmth or cooking
    are banned on the homeward journey.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage offers possible historical explanations but does not state
    a ritual rationale for the homeward fire prohibition.
- id: motif:5
  label: warrior identification with predatory animals or birds of prey
  taxonomy_refs: []
  basis: Ceremonial speeches use the figure of predatory animals or birds of prey,
    associated with agility, fierceness, and rapid leaping movements.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage frames this as figurative speech and martial comportment,
    not literal transformation.
- id: motif:6
  label: bad dream before danger
  taxonomy_refs: []
  basis: A woman initially refuses to join the cactus-fruit gathering because of a
    bad dream, and the group is later captured.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage does not explicitly say the dream predicted the trap; it only
    records the sequence.
- id: motif:7
  label: captive escape by disarming relaxed guards
  taxonomy_refs: []
  basis: Two captive women gather all the party's bows and arrows, throw them over
    a cliff, try to strangle their guards, and escape after the guards' vigilance
    relaxes.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: No supernatural assistance is described.
- id: motif:8
  label: communal death dance around captive execution
  taxonomy_refs: []
  basis: A captive is placed at the center of a death dance, encircled first by old
    women and then by the wider community, before being killed.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: Although the scene is ritualized, the passage does not identify the killing
    as a sacrifice to a deity.
- id: motif:9
  label: body displayed as warning
  taxonomy_refs: []
  basis: After Hitalu'I is killed, her body is tied upright to a pole and left as
    a warning to Apache prowlers.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The stated function is warning; no further symbolic explanation is given.
comparison_claims:
- id: claim:1
  claim: The passage cautiously compares Pima battlefield burning of the dead with
    Maricopa cremation by suggesting it may have been recently adopted from Maricopas,
    while also offering an alternative Colorado-era survival explanation.
  claim_level: historical_contact
  target: Maricopa habitual cremation of the dead
  evidence_refs:
  - ev:4
  counter_evidence_refs:
  - ev:4
  confidence: low
  limitations: The passage itself presents competing possibilities and provides no
    direct evidence proving adoption from Maricopas.
