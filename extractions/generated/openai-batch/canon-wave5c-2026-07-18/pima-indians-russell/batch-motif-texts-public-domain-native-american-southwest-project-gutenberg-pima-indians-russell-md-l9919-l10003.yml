canonical_text:
  quote: ''
  summary: 'The passage describes Pima warfare practices and narratives: pre-battle
    rites by a makai, tobacco smoke prayers to the Sun god, weapons and shield symbolism,
    treatment of fallen comrades, fire restrictions on return, campaign accounts,
    a captive-women escape story, night or dawn attack tactics, and the capture and
    ritualized killing of an Apache woman named Hitalu''I.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A makai, described as a magician, swung an owl feather over the war party
    and after songs foretold how many enemies would be killed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The departing party carried roasted meal, a basket bowl, and tobacco for ceremonial
    smokes that carried individual prayers to the Sun god.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some warriors were armed with bows and arrows; when a comrade fell in battle,
    his bow was broken and his arrow shafts were snapped and left at the spot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The body of a man killed in battle was often burned, although this method
    was not used at the villages.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: On the homeward journey, fires for cooking or warmth were not allowed, while
    fires could be made with precautions on the outward trail.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Some members of the war party carried circular rawhide shields and heavy clubs;
    sun symbols on the shields expressed an appeal to the God of War.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The shield bearers kept the shields rotating on their forearms while advancing
    for hand-to-hand conflict.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Ceremonial speeches used the figure of being like predatory animals or birds
    of prey, and the passage connects this with agility, fierceness, side-to-side
    leaps, crouching, springing, feather headdresses, and battle colors.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says Pima raids usually ended with small losses, destruction of
    an Apache camp, some enemies killed, and sometimes a child taken prisoner.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Antonio Azul described a campaign involving friendly Apaches from San Xavier,
    Papagos, and Pimas; the enemy tied bushes to hinder mounted warriors, and the
    Pimas fought on foot before returning home.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Four Pima women were captured after going to gather cactus fruit; one had
    initially refused to go because of a bad dream.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Two captive women threw the captors' bows and arrows over a cliff, tried to
    strangle their guards, and escaped.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Pimas customarily attacked Apaches at night or at earliest dawn after
    scouting the enemy position during the preceding day.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Hitalu'I, an Apache woman captured in the Sierra Tortilla, was questioned
    through L^'lall and said she would tell the truth and would not return to her
    people.
  category: speech
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:15
  text: A death dance was held with Hitalu'I in the center, old women around her,
    and the wider community outside; she was killed by an old man and her body was
    tied upright to a pole as a warning.
  category: sequence
  evidence_refs:
  - ev:14
