  quote: "“a man by night and a skull by day”"
  summary: An introductory note reports a speaker saying he does not believe a story,
    though many others do, and that its origin is mysterious. In the tale headed “Skull
    and His Magic,” a girl who has rejected suitors chooses as husband a being who
    is a man by night and a skull by day. The community mocks the marriage. During
    a deer hunt in the northern mountains, Skull hides in a defile and the deer fall
    dead at the sight of him, bringing abundant venison and raising his standing.
    The next day Skull enters and wins a ball-kicking foot race, ending the community’s
    contempt.
