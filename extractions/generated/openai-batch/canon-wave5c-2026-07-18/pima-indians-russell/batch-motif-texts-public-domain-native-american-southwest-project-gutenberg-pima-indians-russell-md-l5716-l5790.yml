canonical_text:
  quote: ''
  summary: 'The passage describes Pima leather artifacts: a rawhide lariat whose use
    is said to have been learned from whites with the introduction of livestock, detailed
    construction of the rope and loop ring, and a life-sized deerskin horned toad
    effigy ornamented with white beads. The effigy was used in curing the toad disease
    by passing it over the affected part while toad songs were sung; an informant
    believed this effected a complete cure.'
