  summary: A river floods the land. An Indian woman carrying tortillas wades through
    the water. Coyote, afraid of the water and sitting in a cottonwood tree, asks
    her for tortillas and then threatens to shoot her if she does not come. She tells
    him to come down for them, falsely says the water is only ankle-deep while standing
    on a stump, and Coyote jumps down and drowns. The woman continues on.
