canonical_text:
  quote: ''
  summary: 'The passage describes Pima children''s play, training, and cautionary
    rules: girls make rag dolls, stage pretend funerals and parties, play puberty
    dances, and hear tales of elders and mythic animals; boys practice archery and
    follow rules about snakes, protected animals, birds, owl feathers, toys, and warnings
    about eating from an olla.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Younger girls make realistic rag dolls and carry them through make-believe
    dramas of life.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girls stage a make-believe burial of a whole family with accompanying
    destruction of make-believe property.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The girls hold make-believe parties, grind material as if making pinole, and
    mold mud dishes that dry in the sun.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Children play hide-and-seek in wheat fields, but the game is brief and likely
    to have unpleasant consequences.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the evenings they play puberty dances or listen to tales about elders'
    prowess and the adventures of mythic animals of ancient Pimeria.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: Boys practice with bows over long periods and become accurate shots at birds,
    squirrels, and fish when available.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Pima boys are not forbidden to kill rattlesnakes, but they must not use the
    same arrow again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: If rattlesnake rattles are wanted as ornaments, they must be taken from a
    living snake.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The Gila monster and horned toad are exempt from the boys' arrows.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:10
  text: There is no parental prohibition against destroying birds' nests, but a warning
    that touching quail eggs causes blindness protects quail eggs.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: The owl is described as a bird of mystery and death rather than simply as
    a bird of evil.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:12
  text: Owl feathers are sought for magic potency in medicine and ceremonies, and
    if a lad shoots an owl he must pluck its feathers before it dies or the plumes
    lose their magic power.
  category: action
  evidence_refs:
  - ev:3
- id: obs:13
  text: Pima youngsters possess a rawhide sling, later made from boot leg, and learned
    the use of stilts from the Mexican population with which they came in contact.
  category: object
  evidence_refs:
  - ev:4
- id: obs:14
  text: As they grow older, children are warned not to eat from an olla because the
    olla would obstruct their legs when they flee superior numbers of Apaches.
  category: speech
  evidence_refs:
  - ev:5
