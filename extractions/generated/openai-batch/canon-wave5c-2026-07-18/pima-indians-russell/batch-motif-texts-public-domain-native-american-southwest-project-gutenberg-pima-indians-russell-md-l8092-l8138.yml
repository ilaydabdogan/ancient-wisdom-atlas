canonical_text:
  quote: ''
  summary: The passage describes a ceremony involving singers, rewards, reciprocal
    visiting etiquette, and Pima-Papago entertainment or barter-like gift exchange.
    It then describes athletic activities, especially races and a women's double-ball
    game played with sticks, goals, and a rule forbidding hand contact with the ball.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When many participants join the ceremony, its performance may take nearly
    the whole day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When some resident villagers are destitute, the names used are only those
    of people with plentiful crops.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Visitors contribute services as singers and receive substantial rewards.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Etiquette requires a return visit within a reasonable time, either later in
    the same season or during the next year.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When nomadic Papagos come to entertain the Pimas, the return visit can seldom
    be made, so the gifts are described as more like barter exchanges, advantageous
    to the Papagos.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Pimas received the Papagos cordially but rarely returned their visits;
    in the last fifty years they had sung the name song in Papagueria only twice,
    both visits being to Suijotoa.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Men received training in speed and endurance during raids into Apache country,
    and had few sports for physical improvement except foot races.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'Sometimes a woman raced against a man: she threw a double ball with a long
    stick, while he kept a kicking ball before him.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Women seldom ran foot races, but their outdoor tasks kept them fit, and they
    had an athletic game that corresponded in some measure to men's races and developed
    running skill.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the women's game, two swift women acted as leaders and chose players alternately
    into two groups.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Two goals were set about 400 yards apart, identified by landmarks such as
    a trail and a mesquite.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Two lines were formed about 25 yards apart; the ball was tossed up, started
    toward the opponent's goal, and thrown with sticks until someone drove it beyond
    the goal and won.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: Touching the ball with the hands disqualified the player from further play.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The women's ball game was abandoned about 1885.
  category: sequence
  evidence_refs:
  - ev:7
