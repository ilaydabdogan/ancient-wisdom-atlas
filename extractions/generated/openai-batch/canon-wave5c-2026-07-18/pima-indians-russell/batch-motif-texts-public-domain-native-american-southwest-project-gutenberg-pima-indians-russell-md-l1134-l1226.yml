canonical_text:
  quote: ''
  summary: The passage describes an account in which Elder Brother, before leaving
    Pimeria, instructs the people to count the twelve tail feathers of the bird Gisap
    and divide the year into twelve parts. It then reports variable Pima month names,
    seasonal references, year notches on calendar sticks, mnemonic use of touch and
    sight, and common calendar-stick symbols including dots, pits, notches, human
    figures, a railway ideogram, and a T sign for liquor festivals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Elder Brother is said to have told the people, while leaving Pimeria for the
    last time, to count the twelve tail feathers of the little bird Gisap and divide
    the year into that number of parts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Elder Brother is said to have given names for the parts of the year except
    for the coldest and hottest months.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The writer regards recognition of the “moons” as recent and reports that many
    people lack names for them and that names do not agree even within the same village.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two month-name lists are attributed to K&'m&l tk&k and Antonio Azul, and the
    passage notes that a chief’s list differs from both and includes references to
    wheat.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The recorded month names include harvest, rainy, planting, dry grass, windy,
    winter, color, falling leaves, cottonwood flowers and leaves, mesquite leaves
    and flowers, saguaro seeds, and strength terms.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that the Pimas have no winters and therefore no “winter
    count”; the Gila valley is described as having torrid heat and ideal weather as
    its two main seasons.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The new year is described as coinciding with harvest season and the onset
    of the hot season, and the year mark on the calendar stick is described as a deep
    notch across the stick.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Early year records are described as memorized, with few minor notches, and
    a narrator could identify a year notch and tell its story without making a mistake.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The narrator and interpreter are described as touching or pressing into the
    same notch before narrating or translating the story connected with it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The writer says the stick and particular notch seemed to have a definite personality
    in the minds of the narrator and interpreter, with recall apparently aided by
    touch as well as sight.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Dots, shallow circular pits, and short notches are described as the most common
    symbols on the sticks, with no distinctive meaning and a wide range of possible
    recorded events.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: A human figure symbol may denote any event relating to a man, including killing
    Apaches, being killed by Apaches, being bitten by a rattlesnake, or being struck
    by lightning.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The date of railway building was recorded by an ideogram representing rails
    and ties.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: 'A T sign is described as the only symbol that had arbitrarily come to designate
    a single event: festivals called “hizwin drunks,” at which saguaro or agave liquor
    was brewed and imbibed.'
  category: object
  evidence_refs:
  - ev:7
