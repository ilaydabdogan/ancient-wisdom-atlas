  quote: ''
  summary: Ethnographic passage describing Pima family size, treatment of twins, preferences
    concerning children, reported exposure of infants classed as deformed or of certain
    non-Pima fathers, pregnancy taboos, birth and postpartum practices, nursing and
    abortion practices, and intermarriage with neighboring peoples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that Pima families could be large, with as many as twelve
    children known in a single family.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Twins are described as receiving general rejoicing, with every village inhabitant
    bringing gifts and the mother expecting future good fortune.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Male children are described as preferred because they were expected to grow
    up to fight Apaches.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: With parental consent, infants described as deformed were reportedly taken
    by the midwife and left to die from exposure and lack of nourishment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Infants of American or Mexican fathers were reportedly destroyed in the same
    manner as infants described as deformed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A pregnant woman was not allowed to eat food that an animal had touched, with
    examples involving a gopher-cut melon vine and mouse-nibbled wheat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that a pregnant woman avoided places where Apaches had
    been killed, that the husband killing a rattlesnake was believed to endanger the
    child, and that eating liver was associated with birthmarks.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: During confinement, the husband stayed away from the home while women friends
    attended the patient, who sat over a cloth-lined hole in the floor.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The placenta was buried in a hole and covered with ashes; the mother bathed
    in the river after delivery and avoided salt until the child's umbilicus healed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: If a mother died in labor and the child lived, the maternal grandmother took
    charge of the child.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Babies were nursed until the next child was born, and sometimes until six
    or seven years old.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: If a nursing mother became pregnant, she might induce abortion by abdominal
    pressure; the passage says the unborn was sacrificed for the welfare of the nursing
    child.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Illegitimate pregnancies were reportedly aborted at three or four months,
    and one seven-month abortion was reported with the aid of a medicine-man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage says no Pima explanation of sterility was obtained.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage reports intermarriage and foreign ancestry involving Apache, Maricopa,
    Kwahadk', Yaqui, Papago, and Sohaipuri connections.
  category: relationship
  evidence_refs:
  - ev:7
