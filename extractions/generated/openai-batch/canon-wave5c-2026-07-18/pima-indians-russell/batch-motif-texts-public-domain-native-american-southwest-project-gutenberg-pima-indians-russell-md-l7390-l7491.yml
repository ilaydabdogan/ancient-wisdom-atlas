literal_observations:
- id: obs:1
  text: 'The passage divides Pima clothing history into four periods: use of minimally
    modified natural products, native textiles, imitations of Mexican costumes, and
    purchased clothing from whites.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In primitive times, men wore breechcloths and women wore knee-length kilts
    made from soft flexible inner willow bark.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: During cold nights, men wore deerskin shirts; on stony trails they wore red-dyed
    deerskin moccasins, while both sexes used rawhide sandals at home.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: After weaving was adopted, cotton blankets were worn in winter and by women
    in summer as waist garments secured with cords, belts, or tucked edges.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cold winds are described as coming from sacred caves, and the blanket’s outer
    fold could be drawn around the neck for warmth.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A widow in mourning was not to raise the blanket above the armpits.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Men could convert a knee-length blanket into baggy trousers by looping a cord
    from the girdle between the legs and drawing it up in front.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some people who were poor or who lost possessions through gambling reverted
    to bark garments when they could not retain the single fabric used as both clothing
    and bedding.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Rabbit skins were cut into strips and braided together for winter blankets.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: During the Spanish and Mexican period, sombreros became favored, women adopted
    a sleeveless chemise, and some women used improvised mantillas.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: When summer heat began, older men stripped to the breechcloth while around
    their homes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage states that contemporary Pimas were rapidly adopting personal
    adornments of their civilized neighbors, while older beautification methods had
    mostly been abandoned except for hair treatment.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Men showed pride in care of the hair, painted designs on the skin, and the
    wearing of feathers and beads.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Associates used the saying “skulof,” glossed as “He smells like an old man,”
    for a man considered too filthy.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Men wore long hair; the old chief Tiahiatam’s hair is said to have reached
    his heels, while usual length was about to the waist.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: At about age 20, young men began braiding or twisting hair into skeins, and
    these skeins were cut squarely across at the bottom.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Men sometimes lengthened their hair with horse-tail hair or with women’s hair
    cut during mourning for relatives.
  category: object
  evidence_refs:
  - ev:8
- id: obs:18
  text: Hair skeins were usually wound around the head and held under a headband or
    colored cord; earlocks could be braided and ornamented with shell, bone, tin,
    and scarlet cloth, and the front hair was cut squarely across the forehead.
  category: action
  evidence_refs:
  - ev:9
