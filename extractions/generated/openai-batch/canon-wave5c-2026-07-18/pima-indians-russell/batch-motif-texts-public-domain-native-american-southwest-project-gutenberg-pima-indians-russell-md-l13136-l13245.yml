comparison_claims:
- id: claim:1
  claim: 'The passage supports a cautious comparison between Pima and Hopi rattlesnake
    beliefs: it says the rattlesnake has magic power in Pima thought but occupies
    a far less important place there than in Hopi thought.'
  claim_level: same_motif
  target: Hopi rattlesnake or serpent belief as referenced in the passage
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: low
  limitations: The passage provides no specific Hopi practices or narratives, only
    a contrast in relative importance.
- id: claim:2
  claim: 'The passage supports a cautious same-function comparison for snakebite treatment:
    Papagos and Mexicans are said to use Euphorbia marginata as a snakebite poultice,
    while Pima treatments described include sucking, ligature, and charcoal marking;
    possible Pima use of the plant is explicitly unverified.'
  claim_level: same_function
  target: Papago and Mexican Euphorbia marginata snakebite poultice practice
  evidence_refs:
  - ev:3
  counter_evidence_refs:
  - ev:3
  confidence: low
  limitations: The comparison concerns healing practice rather than a mythic narrative
    motif, and the writer could not verify that Pimas used the plant.
