canonical_text:
  quote: ''
  summary: The passage catalogs diseases or injuries attributed to birds, reptiles,
    insects, whirlwinds, the sun, Apache contact, and named evil spirits, along with
    remedies involving songs, feathers, images, rattles, smoke, sucking, plant substances,
    sticks, seclusion, or sale of a captured child. It also records omens and warnings
    connected with owls and rattlesnakes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Four birds are said to cause disease: eagle, hawk, owl, and vulture or turkey
    buzzard; remedies include specific songs and the use of feathers, down, smoke,
    or feather-mounted sticks.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eagle is said to cause hemorrhage and lice; remedies include singing an
    eagle song, passing eagle down over the affected part, and blowing cigarette smoke
    over the head.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hawk is said to cause hemorrhage in grown persons only, cured with the
    hawk song and wing feathers; touching a hawk requires four days of seclusion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The owl is said to throw people into trances and fits, and owl cries or human-like
    owl sounds are treated as bad signs or signs of expected sickness.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The vulture or turkey buzzard is said to cause sores, syphilis, and sore eyes
    in a baby if a parent eats a dead animal just before birth; the cure uses a buzzard
    song and buzzard wing feathers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: A Gila monster killed by a father just before a child's birth is said to make
    the baby's body red and feverish; the stated remedy is the Gila monster song.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The homed toad is said to cause rheumatism and hunchback; treatment uses a
    song and an image pressed on the patient, while accidental stepping on the toad
    is followed by tying a red string around its neck and addressing it to eat the
    person's blood.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: The large lizard, tcosokalt, is said to cause fever in children with whitening
    of the skin; treatment uses a lizard song with an image, or fat from a killed
    lizard rubbed on the child.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:9
  text: The rattlesnake is said to cause kidney and stomach troubles in children,
    cured by a rattlesnake song and a wood or stone image pressed on affected parts.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Rattlesnake bite treatment is described as sucking the wound, sometimes with
    a horsehair ligature or a charcoal circle; Papagos and Mexicans are said to use
    Euphorbia marginata as a poultice, though Pima use is not verified by the writer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The rattlesnake is described as dreaded, as possessing magic power in some
    circumstances, as less important in Pima thought than in Hopi thought, and as
    linked to unlucky encounters, child warnings, and wisdom about where to find the
    best mesquite beans.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: The turtle is said to cause large sores or crippled legs; treatment uses a
    turtle song and a rattle made from a river turtle shell cleaned in an ant-hill
    and filled with gravel.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: A striped-wing butterfly is said to cause internal pains; treatment uses a
    butterfly song and four or five deerskin butterfly images pressed on the patient's
    body.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: A dead dried worm, k&mm^lt, is ground and used as powder to cure sores around
    a baby's mouth; food crawled over by caterpillars is said to make one's teeth
    fall out.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: Pregnancy nausea is attributed to the woman's unfaithfulness and is cured
    by songs and striking two sticks over the patient.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: Whirlwinds are said to cause pains in the legs, treated by the wind song and
    okatilla gum; the sun may cause disease, and a small colored sun image with feather
    rays is used by the medicine-man.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:17
  text: A captured Apache child is said to cause lameness in a family member, cured
    by singing by someone who had killed an Apache, after which the child must be
    sold; the touch of an Apache woman is said to cause paralysis.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:18
  text: Piholt is described as once a man, now an evil spirit living in the east and
    causing a disease with songs; Nyavolt is described as an evil spirit that may
    make a horse throw and injure its rider, cured by the Nyavolt song and crossed
    sticks swung over the injury.
  category: relationship
  evidence_refs:
  - ev:7
