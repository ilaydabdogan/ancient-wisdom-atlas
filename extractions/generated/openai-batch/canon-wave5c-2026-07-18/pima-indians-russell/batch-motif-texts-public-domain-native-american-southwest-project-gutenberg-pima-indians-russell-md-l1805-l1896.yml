  text: After White was taken away, Pimas took possession of his store and quarreled
    over the distribution of wheat stock.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Blackwater account says Thomas took charge of White's store, Has Viakam
    came from the east and traded with the Pimas, and John Walker came from the west
    with the California Column and learned Pima while Thomas learned Maricopa.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Gila Crossing account, men of Rso'tuk went to the mountains about Prescott
