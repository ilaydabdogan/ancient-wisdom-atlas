canonical_text:
  quote: ''
  summary: The passage juxtaposes Bancroft's account of Civil War troop movements
    and the Picacho skirmish with Pima calendar notices. It reports the capture of
    White, the importance of White as trader and agent to the Pimas, the takeover
    of his store, Blackwater calendar references to traders and soldiers, Gila Crossing
    and Salt River accounts of encounters with Apaches, the tying of a dead Apache
    body to a post, a raid dated by saguaro fruit season, and the killing of two medicine-men
    accused of harmful actions.
  language: English
  quote_policy: summarized
