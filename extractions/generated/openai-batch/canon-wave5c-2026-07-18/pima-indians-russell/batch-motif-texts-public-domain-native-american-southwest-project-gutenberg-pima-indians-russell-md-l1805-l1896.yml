candidate_motifs:
- id: motif:1
  label: Local calendar memory prioritizes a trader-agent over large military events
  taxonomy_refs: []
  basis: The passage explicitly says White's capture was of more interest and importance
    to the Pimas than the Confederate or Union armies, while the calendrists lack
    definite information about Bancroft's military events.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a historical-memory pattern rather than a mythological motif.
- id: motif:2
  label: Enemy found asleep and identified only after awakening
  taxonomy_refs: []
  basis: The Rso'tuk men cannot tell whether the sleeping man is Apache or Pima by
    dress, wake him, identify him as Apache, and kill him.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage presents this as an historical calendar event, not as a mythic
    episode.
- id: motif:3
  label: Companion turns back to protect another during pursuit
  taxonomy_refs: []
  basis: In the Salt River account, the Apache farther away turns back when his companion
    is in danger, attacks the first pursuer, and is killed.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: Only one explicit instance is given; the label abstracts from a brief
    historical account.
- id: motif:4
  label: Enemy corpse displayed by tying it to a post
  taxonomy_refs: []
  basis: Both Gila Crossing and Salt River accounts describe a dead Apache body dragged
    to a prominent place and tied to a post.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The account is violent historical material; no ritual meaning is stated
    in the passage.
- id: motif:5
  label: Mourner or recovery party reaches the displayed body but leaves it in place
  taxonomy_refs: []
  basis: A friend of the dead Apache weeps at the tied body and leaves without removing
    it; in the Salt River account a recovery party turns back before reaching the
    spot.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The two accounts vary in whether the party reaches the body.
- id: motif:6
  label: Seasonal dating by saguaro fruit sign
  taxonomy_refs:
  - seasonal_cycle
  basis: The raid is placed in saguaro fruit season, or June 1862, by red visible
    on the dead Pima.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The seasonal-cycle taxonomy reference is limited to dating and environmental
    seasonality, not to a full mythic seasonal cycle.
- id: motif:7
  label: Killing of medicine-men accused of harmful machinations
  taxonomy_refs: []
  basis: The Blackwater note says two medicine-men, father and son, were killed because
    of supposed machinations against the people.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not describe the alleged machinations or any ritual process.
comparison_claims:
- id: claim:1
  claim: 'The Gila Crossing and Salt River accounts preserve a closely parallel pattern:
    Apaches near the villages are pursued, one Apache is killed, the body is dragged
    away and tied to a post, and an Apache party or friend later fails to recover
    it.'
  claim_level: same_motif
  target: Gila Crossing and Salt River calendar accounts of the killed Apache body
    tied to a post
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The accounts differ in details, including whether the recovery party
    reaches the body and whether a mourner weeps at it.
- id: claim:2
  claim: The Gila Crossing and Blackwater calendars share White's capture as a calendrical
    event, while the passage contrasts this local emphasis with the calendrists' lack
    of definite information about the Bancroft military narrative.
  claim_level: same_function
  target: Gila Crossing and Blackwater calendar references to White's capture
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The passage does not provide detailed wording from both calendar entries
    about White's capture.
- id: claim:3
  claim: The saguaro fruit-season notation functions as a seasonal-cycle dating device
    within the calendar account.
  claim_level: same_function
  target: seasonal_cycle motif family as a calendrical dating pattern
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supports seasonal dating, but not a broader mythic cycle
    of seasonal renewal.
