canonical_text:
  quote: ''
  summary: 'The passage describes Pima warfare conditions under Apache raiding pressure:
    constant guards, village consolidation, sentry tactics using brush shelters and
    smoldering fires, recruitment of war parties by chiefs through magic speeches,
    food-carrying by bereaved women, nighttime pickets, set ritual speeches modeled
    on creation-time divine speeches, and magic war songs intended to secure supernatural
    power against enemy magic.'
  language: English
  quote_policy: summarized
