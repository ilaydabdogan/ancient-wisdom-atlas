  summary: In a section on games, the passage mentions fear of provoking Navitco,
    described as the deity who gave the gourd to man. It states that the Pima, like
    other American Indians, did not understand gaming in terms of luck or chance,
    but as affected by supernatural beings. Assistance was sought through gifts of
    beads and sacrifices deposited on hill altars. A ceremonial hill northeast of
    Casa Blanca is named as a favorite prayer place for gamblers, and the text introduces
    games played by men.
