canonical_text:
  quote: ''
  summary: The passage combines historical and ethnographic notes on water shortage,
    starvation, road conditions, snakebite, calendar entries for 1900-1901, and Pima
    food supply. It describes upstream use of river water, famine deaths, a woman
    seeking mesquite beans during crop failure, rattlesnakes entering houses, calendar
    events including President McKinley's visit and a shooting, and a recurring pattern
    in which the Gila River failed in midwinter and forced reliance on wild foods
    and travel for subsistence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Water upstream of the reservation had been used by white settlers, leaving
    none for the Pimas; several starvation deaths were known and others were considered
    probable.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Specific reported starvation cases include a wood chopper found dead in the
    chaparral, an old couple found dead with no food in their storehouse, and a hungry
    rider to Salt River who fell and perished.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A free-wire arrangement required a lane for a road, but the lane was made
    very narrow; the passage also describes mud, dust, bridge neglect, and poor or
    temporary road remedies.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A woman went far into the desert to search for mesquite beans because she
    had no food, while the wider community was starving after crop failure caused
    by lack of river water for ditches.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rattlesnakes sometimes entered houses and bit occupants; the author reports
    not confirming any Pima remedies for snakebite despite inquiries.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The 1900-1901 calendar entries mention the President coming to Phoenix, a
    mail carrier who became insane and shot a white man and a Pima youth, and the
    start of a day school at the Gila Maricopa village.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Pimas are described as subsisting on a mixed diet in which vegetable food
    predominates, with meat formerly probably more common than at the time of writing.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: In primitive times, about every fifth year, the Gila River is said to have
    failed in midwinter, leaving fish in a few pools, causing water birds to depart,
    and drawing deer and antelope to known watering places.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the river and canals lacked water, crops could not be raised, and the
    Pimas sought native foods such as saguaro fruit and mesquite seed or beans, sometimes
    making long journeys into Apache country.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: KAemA-A was present during President McKinley's visit to Phoenix, made no
    calendar-stick mark for it, but related the circumstances as part of the history.
  category: speech
  evidence_refs:
  - ev:7
