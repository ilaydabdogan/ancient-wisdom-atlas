canonical_text:
  quote: ''
  summary: The passage describes Pima food preparation, including baking agave and
    cactus fruit, grinding and cooking maize and wheat flour, parching grains and
    seeds among coals, roasting or boiling meat, discarding broth because of an illness
    concern, household cooking cleanliness, outdoor kitchen arrangements, and adoption
    of some newer cooking equipment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Very few Pima diet items are eaten raw; agave and some cactus fruits are baked
    for many hours.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes Pima cooking as less elaborate than preparations reported
    at Zuñi.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: In earlier practice maize was ground on flat metates and made into loaves;
    wheat was later introduced by whites and used for heavy unleavened bread.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the Pimas had no knowledge of Pueblo wafer breads and instead
    baked flour as tortillas or loaves in ashes, fried it in suet, or boiled it as
    gruel, mush, or dumplings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A large part of cereal food is parched before grinding.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In one parching method, coals and grain are placed in a parching pan, tossed
    and turned, ashes are blown away, and coals are separated from the grain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Another parching method uses a broken olla set over the fire so that the contents
    can be stirred by hand while browning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Meat is roasted on coals or boiled; in the boiling method described by an
    informant, broth is discarded because it is feared to cause consumption.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Coarse-grained flour is sometimes boiled with meat, and the author compares
    the result to what a Canadian voyageur would call rubabu.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage describes variable household cleanliness in cooking, with dried
    dough on fingers and minimal vessel cleaning, but says dry air, sun-exposed outdoor
    cooking, and eating all prepared food reduce harmful effects.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The kitchen is described as an arrow-bush enclosure with pottery vessels and
    three central stones for the cooking pot; some households use adobe fireplaces,
    iron kettle stands, or modern stoves.
  category: setting
  evidence_refs:
  - ev:7
