canonical_text:
  quote: ''
  summary: Vulture finds a dead deer with an unfamiliar arrow and brings the meat
    and arrow home. Sandy Coyote recognizes the arrow and later returns it to the
    widow and son who had been driven away. The son rebukes Sandy Coyote for past
    neglect. The mother later tells her son that Sandy Coyote killed his father and
    that he may play ki°ts with him. On the way after his mother, the son appears
    beside a trail as a singing, winking decayed corpse, is taken home by a younger
    woman, and is later found as a handsome young man. He kills the husband of two
    women in a wager involving the husband's skin or shirt. He then returns with his
    mother and the women and goes to play ki°ts with Sandy Coyote, carrying wager
    goods, singing about payment for his father, and using fabricated signs such as
    stone eggs and a toenail made to resemble a new moon.
  language: English, with one song line in another language and an English gloss in
    the passage
  quote_policy: summarized
