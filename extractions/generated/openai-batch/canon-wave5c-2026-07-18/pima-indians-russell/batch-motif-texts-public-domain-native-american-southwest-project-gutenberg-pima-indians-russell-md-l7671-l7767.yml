canonical_text:
  quote: ''
  summary: The passage describes Pima personal ornaments, including beads, shell,
    bone, turquoise, bracelets, coyote-skin wrist guards, nose ornaments, feather
    hair ornaments, war headdresses, racing hair ornaments, and women’s hair coronets.
    It then comments on Pima ornamentation of implements, weapons, textiles, and other
    artifacts, contrasting personal decoration with comparatively limited carving,
    design, and symbolism in artifacts.
  language: English
