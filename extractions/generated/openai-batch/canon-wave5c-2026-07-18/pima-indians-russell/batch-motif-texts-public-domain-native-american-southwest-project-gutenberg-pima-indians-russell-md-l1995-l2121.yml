canonical_text:
  quote: ''
  summary: 'A calendrical annal section records Pima events from the late 1860s to
    early 1870s: campaigns and raids involving Pimas, Apaches, Papagos, soldiers,
    and named localities; cremation or burial of some Pima war dead; epidemics in
    which medicine-men were blamed and killed; heavy rains, floods, and canal construction;
    a measles outbreak; a successful dawn attack on an Apache camp; and a death from
    rattlesnake bite.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Pima campaign against Apaches resulted in one Pima being killed; his fellows
    burned the corpse with the bow and war gear, using dry ironwood in the cremation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A source note states that informants said burning the dead was used by the
