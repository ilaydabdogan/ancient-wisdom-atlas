canonical_text:
  quote: ''
  summary: 'Historical and calendrical notes concerning Pima and Kwahadk events in
    the 1880s: tizwin drinking and official violence, fiestas, train deaths, epidemics,
    executions of suspected medicine-men, government wagons and adobe houses, Christian
    conversion, rabbit hunts, a ceremonial dance, railroad construction, and Pima
    scouting during the pursuit of Geronimo.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Kwahadk people had been drinking tizwin and had not previously
    been interfered with by the agent, so they were not conscious of transgressing
    laws.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The agent ordered his police to bring in the Kwahadk people “dead or alive.”
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young Kwahadk man declared innocence and defied the police; he was shot.
    His father later approached the police, said he had nothing to live for after
    his son’s death, and was also killed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage cites Cremony as describing broader violence, including men being
    shot or bowie-knifed and a Tucson graveyard where most recorded white men had
    died by murder rather than natural causes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: For 1883-84, the calendar records Salt River Pimas going to a fiesta at Gila
    Crossing and a drunken Pima from Blackwater being run over and killed while riding
    on a Southern Pacific box car.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:6
  text: For 1884-85, the calendar records an epidemic among the Kwahadk people and
    the execution of two medicine-men suspected of bringing the visitation upon the
    tribe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: For 1884-85, the first Government wagons issued to the Blackwater people were
    received; a note says such wagons were issued to men who cut their long hair,
    built adobe houses, and provided sheds.
  category: object
  evidence_refs:
  - ev:4
  - ev:11
- id: obs:8
  text: For 1885-86, Hwela, named for Agent Wheeler, was baptized as the first Christian
    convert among the Pimas; a note adds that C. H. Cook had worked as teacher and
    missionary among the Pimas for nearly fifteen years.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:9
- id: obs:9
  text: Two youths were thrown from their horses and killed during a rabbit hunt;
    a note describes such hunts as mounted drives in which animals were shot with
    arrows or killed with clubs.
  category: action
  evidence_refs:
  - ev:5
  - ev:10
- id: obs:10
  text: For 1886-87, tizwin was made at Gila Crossing in quantities large enough to
    be passed around in bowl-shaped baskets, and one man was killed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: For 1886-87, the first adobe houses were built at Gila Crossing, and their
