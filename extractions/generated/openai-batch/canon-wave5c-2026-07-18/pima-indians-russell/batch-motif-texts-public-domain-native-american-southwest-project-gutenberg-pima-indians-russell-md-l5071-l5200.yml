canonical_text:
  quote: ''
  summary: The passage describes Pima stone implements and related objects, including
    mullers, pestles, axes, arrowheads, arrow-shaft straighteners, hammer stones,
    firestones, and crystals. It records practical uses, sources from ruins, Hohokam
    comparisons, and one reported account that axe material came from the underworld
    when Elder Brother led nether-world people upward to conquer people living above.
    It also notes crystals and unusual stones kept by medicine-men and cites a comparison
    to Zuni fetishes or amulets.
  language: English
  quote_policy: summarized
