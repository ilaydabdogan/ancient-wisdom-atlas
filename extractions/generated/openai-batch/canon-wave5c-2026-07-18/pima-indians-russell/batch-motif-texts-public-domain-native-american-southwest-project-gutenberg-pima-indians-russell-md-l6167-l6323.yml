  text: Basket making is described as practiced in nearly every Pima home, with the
    work done by women and requiring time and patience.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage links tribal poverty to the loss of river water and says this
    has led some women to produce baskets without earlier training or pride in the
    finished product because the baskets can be sold quickly.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Willow twigs are gathered before leaves appear, stripped of bark, split into
    strips, and kept in coils; the Pimas use willow for weft only, while willow bark
    is also used in some basketry items.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cat-tail stems are used as the foundation in common baskets; they are gathered
    green, split, dried, and stored in bundles.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Devil's claw pods provide a necessary material for ordinary baskets; their
    black surface is used in contrast with white willow to make designs.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Devil's claw is prepared by soaking and burying it in moist earth, after which
    a party of women may strip the fibers; some makers instead use hot water to hasten
    preparation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Other materials named include agave leaves, cottonwood branches, wheat straw,
