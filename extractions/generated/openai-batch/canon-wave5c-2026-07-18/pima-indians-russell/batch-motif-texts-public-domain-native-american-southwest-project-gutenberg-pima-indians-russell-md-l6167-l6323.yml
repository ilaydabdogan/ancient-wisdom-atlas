    basket or mat forms.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The only implements named for common basket manufacture are awls and knives;
    earlier awls were bone or mesquite wood, while later ones are steel with wooden
    or gum handles.
  category: object
  evidence_refs:
  - ev:6
