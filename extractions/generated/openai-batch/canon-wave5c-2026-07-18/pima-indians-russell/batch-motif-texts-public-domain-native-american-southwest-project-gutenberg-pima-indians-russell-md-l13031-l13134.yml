  - ev:13
  - ev:14
  - ev:15
  - ev:16
  - ev:17
- id: obs:16
  text: The bear is described as friendly to the Pimas, and a man who meets one is
    instructed to say, "I'm red," so the bear will not touch him.
  category: speech
  evidence_refs:
  - ev:10
