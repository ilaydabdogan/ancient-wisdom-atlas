canonical_text:
  quote: ''
  summary: The passage describes Pima curing practices in which songs, animal or object
    substances, rubbing, burning, sucking out evil, payment to ritual specialists,
    accusations against medicine-men, hidden charms, projected charcoal, magic stones
    in water, and named animal-associated diseases and remedies are reported.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Songs are described as important in treatment and are sung with repeated phrases
    after the cause of affliction is identified as an animal or object.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An image or part of the identified animal or object is pressed on or waved
    over the afflicted body part.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The practitioner performs a sucking-out procedure for the evil, and one named
    informant said he concealed objects under his thumbnail to pretend to extract
    them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ashes may be rubbed lightly on a sick person's skin regardless of the disease.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pledgets of cotton may be burned on the skin, sometimes several in one place,
    and the passage says this must have been painful.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Female Si'atcokam are said not to treat children and to limit their work to
    abdominal troubles, while men treat women for all diseases.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Payment to the Si'atcokam is promised when they are called and may include
    livestock, wheat, a basket, or similar property.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: If a contracted treatment is incomplete because the patient dies, the full
    promised payment may not be received, but some compensation remains owed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Human ailments are attributed not only to animals, birds, and reptiles, but
    also sometimes to superhuman causes or to a medicine-man accused of causing disease.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In epidemics, medicine-men are said to have been killed in large numbers after
    being blamed for disease.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: For sickness attributed to a medicine-man's malice, the treatment includes
    singing a medicine song and placing four magic stones in water, one at a time,
    so the patient inhales their power and drinks the water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: When a household believes a medicine-man has brought sickness, another doctor
    and four assistants search day and night for a hidden object understood as the
    charm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The discovered charm must not be touched for fear of death, but its discovery
    is said to make it harmless to the intended victim.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A medicine-man may cause sickness by shooting charcoal made from a burned
    enemy's body into someone, whose body then burns unless the charcoal is sucked
    out before it is fully consumed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Specific animals are named as causes of particular diseases, and their remedies
    involve species-specific songs and animal parts or associated materials.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
