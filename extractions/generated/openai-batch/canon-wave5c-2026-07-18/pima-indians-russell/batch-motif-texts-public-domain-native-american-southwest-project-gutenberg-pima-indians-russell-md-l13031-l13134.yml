candidate_motifs:
- id: motif:1
  label: Disease attributed to an animal or object and cured by its song and substance
  taxonomy_refs: []
  basis: The passage repeatedly describes ailments caused by particular animals or
    objects and treated with the corresponding song plus a part, image, or associated
    material of that cause.
  evidence_refs:
  - ev:1
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  - ev:14
  - ev:15
  - ev:16
  - ev:17
  confidence: high
  cautions: This is an ethnographic healing pattern in the passage; no supplied taxonomy
    family exactly matches it.
- id: motif:2
  label: Extraction of embodied evil or harmful substance from the patient
  taxonomy_refs: []
  basis: The passage describes sucking out evil generally and sucking out projected
    charcoal before it consumes the body.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: high
  cautions: The passage also reports deceptive performance in at least one informant's
    account, so the extraction is recorded as described practice rather than verified
    efficacy.
- id: motif:3
  label: Hostile practitioner sends sickness through charm or projected substance
  taxonomy_refs: []
  basis: A medicine-man may be accused of causing disease through malice, hidden objects,
    or shooting charcoal made from a burned enemy into a victim.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage frames accusations through the author's ethnographic and judgmental
    language; attribution should be treated as reported belief or accusation.
- id: motif:4
  label: Neutralizing a hidden charm by discovery without touch
  taxonomy_refs: []
  basis: The searched-for object must not be touched for fear of death, but discovery
    itself renders it harmless to the person against whom it was aimed.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No broader comparison is asserted.
- id: motif:5
  label: Transfer of power through numbered stones and water
  taxonomy_refs: []
  basis: Four magic stones are placed in water, taken out one at a time, held under
    the patient's nose for inhalation of power, and followed by drinking the water.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The number four may be culturally significant, but the passage does not
    explain it; no unsupported interpretation is added.
- id: motif:6
  label: Obligatory payment for ritual cure
  taxonomy_refs:
  - sacred_exchange
  basis: Payment in property is promised when the Si'atcokam is called, and death
    of the patient does not annul compensation obligations.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy reference is approximate because the passage describes practical
    compensation for curing rather than an explicitly sacred exchange myth.
