canonical_text:
  quote: ''
  summary: A pursued leader uses soot, tears, smoke, and a belt-rainbow ascent to
    evade Elder Brother's warriors; counter-deities undo each concealment, and spiders
    bring the rainbow down. Warriors find a green stone in the leader's heart, and
    a captured medicine basket or box is linked to stormy cold weather. The invaders
    continue against other pueblos, singing songs of magic power, and Vulture is captured
    and scalped, explaining the bare head of vultures. Some Salt River pueblo inhabitants
    flee and are said to become the Rio Grande pueblo tribes. Kâ'kânyip is later killed
    by Apaches while hunting for his pregnant wife, and his son Pat' A'-anukam begins
    to seek knowledge of Apache water sources and trails.
  language: English
  quote_policy: summarized
