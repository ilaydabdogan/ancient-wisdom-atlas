  basis: The leader throws his belt upward, climbs it, and lies against the clouds
    as a rainbow as his final chance to escape.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage supports ascent clearly; whether the rainbow is a full transformation
    is less explicit.
- id: motif:3
