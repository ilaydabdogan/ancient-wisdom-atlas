  quote_or_summary: The pursued Si'van uses soot to create darkness, tears to create
    mirage, smoke to create fog, and a belt to climb to the clouds as a rainbow; corresponding
    gods undo the darkness, mirage, fog, and rainbow, and spiders web the rainbow
    down to destruction.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:2
  type: summary
  locator: 11340-11352
  quote_or_summary: Warriors find a round green stone in the defeated leader's heart;
    the stone is kept in a medicine basket captured with his grandson. The grandson
    had been told to hide, touch the dead body, and swallow its odor to gain power,
    but S'hohany discovers him and later sells him to a Papago chief. The box is said
    to cause severe storm and cold if disturbed.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:3
  type: summary
  locator: 11353-11374
  quote_or_summary: After Sweetwater, the invaders move against Vulture's pueblo and
    sing of Raven-child power and mirage-like magic. Elder Brother orders Vulture
    captured alive; he is identified by white leggings, brought to Elder Brother,
    and scalped, which the passage says accounts for the naked head of vultures today.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:4
  type: summary
  locator: 11375-11393
  quote_or_summary: At Gila Crossing a song invokes a sacred pipe, magic power, downy
    feathers, and sleep upon the enemy; Tcu-unarsat Si'van is defeated. The party
    proceeds to Mesa and Tempe, with songs invoking Blue Eagle, a foretelling staff,
    and taking the distracted enemy; other pueblos are destroyed before the party
    returns to take the Gila valley.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:5
  type: summary
  locator: 11394-11400
  quote_or_summary: Some Salt River pueblo inhabitants flee during the war toward
    the Colorado, descend to the Gulf of California, then turn east and northeast,
    settle, and are identified as ancestors of the Rio Grande pueblo tribes.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:6
  type: summary
  locator: 11401-11417
  quote_or_summary: Kâ'kânyip marries Kold Ha-akam, daughter of Kâk Si'sivâlîkî. While
    she is pregnant and wants mountain plants and game, he hunts deer in the mountains,
    is surrounded and killed by Apaches, and his body is later found and burned to
    ashes.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:7
  type: summary
  locator: 11418-11436
  quote_or_summary: At Santa Rosa, Kâ'kânyip's son Pat' A'-anukam is born and becomes
    brave and noted. After hunters question him about his mother remarrying, his mother
    weeps and tells him how his father was killed; he then tells the council he wants
    to see Apache springs, drinking-water places, and trails.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
