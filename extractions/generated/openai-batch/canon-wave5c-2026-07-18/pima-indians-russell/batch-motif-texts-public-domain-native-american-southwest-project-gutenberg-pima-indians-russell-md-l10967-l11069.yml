candidate_motifs:
- id: motif:1
  label: Magic animal steals valuable stones for communal use
  taxonomy_refs:
  - sacred_theft
  basis: Tarsnamkam creates and sends the parrot to swallow Casa Grande turquoise;
    the bird returns and disgorges the stones, which are distributed to the people.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage frames the act as theft from Si'al Tcu'-utak Si'van but does
    not state an explicitly sacred rationale for the theft.
- id: motif:2
  label: Retaliatory rain defeated by counter-magic
  taxonomy_refs: []
  basis: Si'al Tcu'-utak Si'van sends sixteen days of rain to destroy Tarsnamkam,
    but Tarsnamkam is not injured because he also has magic power.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage does not identify the rain-sender as a deity or specify a
    wider flood pattern in this episode.
- id: motif:3
  label: Object-induced miraculous pregnancy
  taxonomy_refs:
  - miraculous_child
  basis: A football or many-colored ball is placed near Pia, hidden under her clothing
    or blanket, and then causes pregnancy or becomes a child in her womb; the variant
    repeats the ball-pregnancy sequence.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:13
  confidence: high
  cautions: The resulting child is monstrous and dangerous, so the motif should not
    be assumed to imply a beneficent sacred birth.
- id: motif:4
  label: Monstrous child-eater slain by Elder Brother
  taxonomy_refs:
  - culture_hero
  basis: Hâ-âk is a rapidly maturing child with claws and sharp teeth who kills and
    eats children; Elder Brother and the people prepare against her power, and Elder
    Brother kills her.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage gives little explanatory background for Elder Brother beyond
    his role in this episode.
- id: motif:5
  label: Flood survivor becomes ancestor
  taxonomy_refs:
  - flood_and_renewal
  basis: The embedded tale states that a great flood destroys the tribe except for
    Ci-ho, who becomes ancestor of the present Pimas; afterward the tribe grows and
    builds villages.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This motif occurs in an embedded quoted tale rather than in the main Hâ-âk
    narrative.
- id: motif:6
  label: Shapeshifting eagle abductor slain by liberator
  taxonomy_refs:
  - shapeshifter
  - culture_hero
  basis: The embedded eagle assumes old-woman shape, steals women and children, seizes
    a girl, and is slain by Ci-ho, freeing the people.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage reports this as an informant's tale within a footnote-like
    insertion.
- id: motif:7
  label: Marked monster-slaying site with offerings for luck
  taxonomy_refs:
  - sacred_exchange
  basis: After Hâ-âk is killed, the cave and a nearby stone enclosure remain; people
    formerly place offerings in the enclosure to bring good luck.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: No recipient of the offerings is named, and the exchange logic is only
    implied by the stated purpose of good luck.
comparison_claims:
- id: claim:1
  claim: The passage itself identifies a variant of the same story in which a many-colored
    ball from the Sun functions like the football in the main episode by causing Pia's
    pregnancy.
  claim_level: same_motif
  target: Main football-pregnancy episode and the Mosquito Hawk/Sun-given ball variant
  evidence_refs:
  - ev:9
  - ev:10
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: The variant changes the sender from Tarsnamkam and his messenger to
    Mosquito Hawk and the Sun, so only the ball-pregnancy motif is directly shared.
- id: claim:2
  claim: The passage explicitly compares the feast after Hâ-âk's death to a feast
    made when Eagle was killed, suggesting a shared ritual aftermath for monster slaying
    within the passage's narrative material.
  claim_level: same_function
  target: Feast after Hâ-âk's killing and feast after Eagle's killing
  evidence_refs:
  - ev:4
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The eagle-killing feast is mentioned only by comparison; its details
    are not narrated in the embedded tale excerpt.
- id: claim:3
  claim: The embedded eagle tale and the Hâ-âk episode both present a dangerous being
    who harms women or children and is defeated by a named liberating figure.
  claim_level: same_function
  target: Ci-ho versus the eagle and Elder Brother versus Hâ-âk
  evidence_refs:
  - ev:3
  - ev:4
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The two narratives differ in the monster's form, setting, and immediate
    cause; the claim is limited to functional similarity within the supplied passage.
