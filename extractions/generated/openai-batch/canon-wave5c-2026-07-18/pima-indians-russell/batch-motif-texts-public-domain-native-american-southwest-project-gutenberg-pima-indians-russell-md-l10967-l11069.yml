canonical_text:
  quote: ''
  summary: 'The passage recounts several connected narrative episodes: an embedded
    Gila Pima tale of a flood survivor and an eagle monster; Tarsnamkam''s creation
    of a green parrot to steal Casa Grande turquoise; Si''al Tcu''-utak Si''van''s
    retaliatory rain; a football that enters Pia Konlkam''s womb and becomes the monstrous
    child Hâ-âk; Hâ-âk''s predatory growth, flight, and death at Elder Brother''s
    hands; ritual remembrance at the killing place; and a variant in which Mosquito
    Hawk receives a many-colored ball from the Sun and causes Pia''s pregnancy.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People are said to live at tanks east of the mountains north of Picacho, including
    a man named Tarsnamkam, translated as Meet the Sun, who desires beautiful stones
    used at Casa Grande.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: An embedded tale says the Gila Pimas were created on the river banks and that
    a great flood destroyed the tribe except for one small man, Ci-ho, who became
    ancestor of the present Pimas.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The embedded tale describes a monstrous eagle that sometimes assumes the shape
    of an old woman, visits pueblos, steals women and children, and carries them to
    an inaccessible cliff.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the embedded tale, an abducted girl tells Ci-ho how to ascend the cliff;
    Ci-ho slays the eagle with a sword and liberates the people from it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tarsnamkam makes a fine green bird, identified as a parrot, and sends it to
    Casa Grande with instructions to swallow all the green stones it can find.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Si'al Tcu'-utak Si'van's daughter finds the parrot; after it swallows turquoise,
    her father orders that it be given all the turquoises in the house; the bird eats
    until full and flies away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The parrot returns safely to Tarsnamkam, vomits the stones, and Tarsnamkam
    gives them to the people so that there are enough for all.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Si'al Tcu'-utak Si'van becomes angry about the theft and sends rain for four
    periods, or sixteen days, to destroy Tarsnamkam, but Tarsnamkam's own magic power
    prevents injury.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Tarsnamkam sends a man with a fine football to Si'al Tcu'-utak Si'van's daughter
    Pia Konlkam; the messenger kicks the ball near her, and she hides it under her
    dress while denying that she has seen it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: When Pia later searches for the football, it cannot be found because it has
    entered her womb and become a child.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The child is born strange-looking, with long claws instead of fingers and
    toes and long sharp doglike teeth; the people want to destroy it, but the mother
    says it is her child and wants to care for it.
  category: attribute
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:12
  text: The child, named Hâ-âk, grows to maturity in three or four years, eats raw
    or cooked food, kills and eats children, and moves from Ta'-atdkam mountain to
    Baboquivari and then to Poso Verde.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: As Elder Brother and the people prepare to overcome Hâ-âk's magic power, they
    sing of Elder Brother's power, winds mastered by song, a mountain summit, a sleep-inducing
    sacred pipe, a great stone, and a blue owl.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: Elder Brother kills Hâ-âk; a feast is made, a cave remains at the place where
    she was killed, and a nearby stone enclosure formerly receives offerings for good
    luck.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: A variant says VaktcuktcXthap, the mosquito hawk, wants to marry a virgin
    at Casa Blanca; the Sun gives him a many-colored ball, he kicks it near Pia Konlkam,
    she places it in her blanket fold, and she becomes pregnant.
  category: sequence
  evidence_refs:
  - ev:13
