canonical_text:
  quote: ''
  summary: The passage describes rain petitioning through a small gray fly, ritual
    feats and cures performed by Si'atcokam, spirit-bearing crystals obtained after
    an apparition, and several disease treatments involving songs, smoke, feathers,
    water, sucking, and extraction of harmful objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During a season when rain is needed, a person may rub soot in the eyes of
    a small gray fly and instruct it to tell its grandmother to send rain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Si'atcokam place hot coals in their mouths or hands while using ash or
    mud as a protective layer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Si'atcokam may twist small pointed pieces of wood into a patient's flesh until
    the wood disappears; Jacob L. Roberts is described as having two pieces of creosote
    bush placed in his breast by his great grandmother, who also made predictions
    about his health and her own death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person with the necessary power may see a man approaching in a quiet place;
    the man disappears, and a transparent crystal can be found at the spot where he
    vanished.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The transparent crystal is said to contain a spirit that aids the holder and
    leaves the stone at the holder's death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: For a wounded man, the Si'atcokam sucks evil from the wound and uses a green
    strand resembling water plants, which the patient sucks crosswise four times before
    the practitioner pretends to swallow it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When called to treat sickness, the Si'atcokam carries a staff, sings cure
    songs or has them sung, and blows cigarette smoke over the patient in order to
    see the disease.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In Sala Hina's case, several medicine-men used cigarettes and smoke while
    attempting to identify the cause of her suffering after she had eaten a poisonous
    weed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Two medicine-men sang alternating sets of four songs, placed ashes in water
    while sweeping eagle feathers across the dish, sprayed water from the mouth over
    Sala, and identified the cause as the horn of a horned toad in her heart.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A medicine-man sucked out the horn, placed it in cotton, told Sala's brother
    to throw it into the river, and later sang further songs; the passage says this
    treatment brought recovery.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Sala's brother later had a throat disease; doctors sang, sucked, and smoked
    over him for a month before he died.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A footnote in the passage compares shamanic rock crystals to Huichol tevali
    crystals, described there as dead or living astral bodies and as potentially representing
    a person or relative according to the shaman's directions.
  category: other
  evidence_refs:
  - ev:10
