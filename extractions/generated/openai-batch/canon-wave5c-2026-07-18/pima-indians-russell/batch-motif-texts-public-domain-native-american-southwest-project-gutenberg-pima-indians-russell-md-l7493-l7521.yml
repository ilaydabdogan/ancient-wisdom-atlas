  quote: ''
  summary: 'The passage describes Pima hair practices: beard plucking; former burning-brand
    cutting of children’s hair, followed by applying the cut hair mixed with mud back
    to the head; an omen attached to a child touching the cut hair; women’s long hair,
    mourning cuts, work coils, trimming, brushing, and mud-and-mesquite-gum treatments;
    and widow mourning practices involving unwashed hair.'
