canonical_text:
  quote: ''
  summary: 'The passage describes Pima material objects and practices: bird cages,
    a carrying-basket frame, fire drills and later flint-and-steel fire-making, preservation
    of fire in stumps, saguaro-fruit hooks, willow tweezers, tree-derived household
    supports, cradles and child carrying, paint brushes for facial pigment, and calendar
    sticks carved with mnemonic symbols. It also gives limited comparisons with Papago
    saguaro-hook ceremonial usage and Mohave cradle frames.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pima bird cages are described as similar in character whether made for a large
    eagle or a small Sonora dove, and are constructed of arrowwood in log-cabin style
    or tied to transverse bars.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A peculiar carrying basket form is said to depend on the use of a wooden frame.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'In earlier times Pimas kindled fire with a two-part drill: the operator knelt
    on the hearth stick and twirled an upright stick between the palms.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fire-drill hearth was made of saguaro wood or another soft wood, and tinder
    was not used before the flame developed from smoking drill dust.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: After contact with whites, flint and steel with cotton tinder were carried
    in leather pouches, and fire was preserved in an old stump at villages or camps
    when possible.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Saguaro fruit is gathered with a long-handled hook made by fastening a straight
    piece of wood to a cactus rib with maguey fiber.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage reports that the angle of the saguaro hook is ceremonially important
    among Papagos, but that no such significance appears to be attached to it by Pimas.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Spiny Opuntia fruit is picked with willow tweezers whose arms are flexible
    and elastic.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: A branched post was formerly erected before the house door for hanging vessels
    or bags containing food.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Sections of mesquite trees called tree animals were set near buildings as
    seats and as objects for children to play on.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The cradle frame is a willow bow with crossbars; its hood is made of willow
    bark in checker-style weaving and ornamented with black and red geometric patterns.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Babies strapped in cradles are carried on their mothers' heads, and older
    children may be carried astride the hip or back.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Facial pigment lines were applied with short, slender pieces of arrowwood,
    and Kwahadk people gathered tufted arrow-bush branch ends for paint brushes.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Pimas keep records of passing events on sticks carved with arbitrary mnemonic
    symbols; one old stick is said to contain seventy years of history.
  category: object
  evidence_refs:
  - ev:11
- id: obs:15
  text: Earlier calendar sticks are said to have disappeared because of war, fire,
