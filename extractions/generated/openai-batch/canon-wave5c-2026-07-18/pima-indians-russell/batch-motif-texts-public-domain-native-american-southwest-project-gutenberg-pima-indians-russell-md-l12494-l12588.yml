canonical_text:
  quote: ''
  summary: The passage gives brief tale summaries and an ethnographic account of Pima
    deities. In one tale, a boy whose parents were killed is swallowed by a beast
    and cuts his way out with stones, killing it. In another, two grandchildren flee
    their grandmother and transform into a saguaro and a palo verde; the cactus kills
    the old woman. The religion section describes prayers to Sun and Darkness, Sun’s
    movement around a flat earth, Sun and Night as death-dealing powers, Moon as Sun’s
    wife, Coyote as their child and a trickster-like deity, Earth Magician and Elder
    Brother as major deities, directional and weather-related magicians, coyote powers,
    living stars, and a Milky Way account involving spilled flour and Coyote.
  language: English with Pima terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy’s parents are killed by Apaches, and the boy lives with his grandmother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A terrible beast frightens the boy from berry bushes, swallows him, and is
    killed when the boy cuts his way out with sharp stones.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A boy and girl quarrel with their grandmother, run away, and, when pursued,
    become a saguaro and a palo verde; the old woman grasps the cactus and is killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage describes Pima religion as having limited outward ceremony, with
    an occasional rain dance, curing ceremonies, belief in supernatural or magic animal
    power, and special emphasis on the Sun.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: People pray to the Sun in the morning and to Darkness at night; a weary traveler
    may puff the first cigarette smoke toward the Sun.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Sun’s disk is described as the actual person of the god, moving around
    the flat earth and passing below the western rim to rise in the east.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sun kills those who die during the day, Night kills those who die during darkness,
    Moon is Sun’s wife, and Coyote is the child of Sun and Moon.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Coyote is characterized by buffoonery and trickery and is said to resemble
    culture heroes of some other tribes.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Earth Magician and Elder Brother live in the east and divide control of the
    universe; Earth Magician governs winds and rains.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Sinking Magician and South Magician occupy paired directional points, and
    four minor gods along the Sun’s path cause lightning, thunder, wind, and river
    foam.
  category: setting
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: Coyote is classed with leading deities in myths; his descendants are considered
    wise; he can catch a chicken by pouncing on its moonlit shadow, has been said
    to steal a baby, and appears as a figure in the moon.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:12
  text: The stars are living beings; Morning Star is the daughter of a magician, Polaris
    is the Not-walking Star, and the Milky Way is explained as flour spilled in the
    sky, partly eaten by Coyote.
  category: sequence
  evidence_refs:
  - ev:13
