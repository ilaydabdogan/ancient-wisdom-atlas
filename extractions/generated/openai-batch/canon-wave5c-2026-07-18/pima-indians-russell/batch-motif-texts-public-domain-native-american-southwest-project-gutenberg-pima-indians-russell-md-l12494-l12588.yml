- id: ev:5
  type: summary
  locator: 12517-12527
  quote_or_summary: Pima prayers address Sun for help through the day and Darkness
    for help through the night; when weary on a journey, a person puffs the first
    cigarette smoke toward the Sun.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights status not specified in supplied metadata.
- id: ev:6
  type: summary
  locator: 12528-12531
  quote_or_summary: The solar disk is treated as the person of the god; Sun moves
    around the flat earth, passing below the western rim and rising in the east.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights status not specified in supplied metadata.
- id: ev:7
  type: summary
  locator: 12533-12538
  quote_or_summary: Sun kills those who die during the day, Night kills those who
    die in darkness, Moon is Sun’s wife, and Coyote is the child of Sun and Moon.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights status not specified in supplied metadata.
- id: ev:8
  type: summary
  locator: 12538-12540
  quote_or_summary: Coyote figures largely in myths; his buffoonery and trickery are
    said to resemble the character of culture heroes of some other tribes.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights status not specified in supplied metadata.
- id: ev:9
  type: summary
  locator: 12542-12549
  quote_or_summary: Earth Magician and Elder Brother are recognized deities living
    in the east and dividing universe control; Earth Magician governs winds and rains,
    and their names are used in sneeze-related exclamations or petitions for pity.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights status not specified in supplied metadata.
- id: ev:10
  type: summary
  locator: 12554-12558
  quote_or_summary: Sinking Magician lives at the northeast solstitial point and also
    has a house in the northwest; South Magician lives in the southeast and corresponding
    southwest point.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights status not specified in supplied metadata.
- id: ev:11
  type: summary
  locator: 12559-12568
  quote_or_summary: Lightning, Thunder, Wind, and Foam Magicians are houses of four
    minor gods along the Sun’s path, causing lightning without thunder, thunder, strong
    spring winds, and a rising foamy river.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights status not specified in supplied metadata.
- id: ev:12
  type: summary
  locator: 12570-12580
  quote_or_summary: Coyote’s pantheon position is difficult; he is classed with leading
    deities, his descendants are considered wise, he can catch a chicken by its moonlit
    shadow, has been said to steal a baby, and is figured in the moon.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights status not specified in supplied metadata.
- id: ev:13
  type: summary
  locator: 12582-12588
  quote_or_summary: Stars are living beings; Morning Star is a magician’s daughter,
    Polaris is the Not-walking Star, and the Milky Way is remaining flour spilled
    by a mule in the sky after Coyote ate part of it.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights status not specified in supplied metadata.
- id: ev:14
  type: summary
  locator: 12549-12554
  quote_or_summary: The author notes a puzzling mingling of old and new in the myths,
    suggests probable recent adaptation of Earth Doctor and Elder Brother from Christian
    religion, and reports divided Pima opinion about adoption from the Papagos.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
