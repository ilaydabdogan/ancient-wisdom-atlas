canonical_text:
  quote: ''
  summary: A set of Pima calendar-style historical entries recounts episodes involving
    Pimas, Apaches, Maricopas, whites, soldiers, scouts, trade, raids, ambushes, firearms,
    and attempted peacemaking. It includes a Piman account of a food-offering ambush
    and an embedded comparison with J. Ross Browne's account of King Woolsey's 'pinole
    treaty.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that peace existed for a short time between the Pimas and
    Apaches at Gila Crossing and Salt River.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: During that peace, Maricopas killed two old Apache men, captured an Apache
    boy, and sold the boy to Cyrus Lennan, known to the Pimas as Chin Beard.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cyrus Lennan took the captured boy on an expedition against Apaches, and a
    Mexican in the party who understood Apache opened communication with the enemy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The whites placed flour, sugar, and other rations on blankets, and the Apaches
    approached believing the food was a peace offering.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Three Pimas were concealed under blankets; the guns were stacked, side arms
    were kept concealed, and at a signal the Apaches were fired upon, killing nearly
    all of them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Lennan was killed during the encounter; the main account says he was killed
    while following escaping Apaches, while Owl Ear gives a variant in which Lennan
    and the man who struck him fell dead together.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The site of the ambush is said to have become known as Yat^kit ku Kfi,k(ita,
    translated in the passage as the place where the snare was set.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: A footnote cites J. Ross Browne's account of the same engagement, identifying
    it with Bloody Tanks and King Woolsey's 'pinole treaty.'
  category: other
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
- id: obs:9
  text: In a Salt River entry, Apaches came to trade goods for ponies, but one part
    of the group tried to steal horses; when the tracks were connected, Pimas killed
    many traders and several horse thieves.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: At Blackwater, a Pima was killed by Apaches while looking for his horses near
    the hill between Blackwater and the Sacatons.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: One entry states that this was the first year in which the Pimas were supplied
    with firearms by order of General Carleton and aided United States soldiers.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Pimas and Maricopas campaigned against Apaches, recovered army property
    from an Apache camp, and were later accused by whites until guides confirmed the
    dead Apaches at the battle ground.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: A Blackwater raid entry says two Apaches were killed and their ears were cut
    off and nailed on a stick.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: In an attempt to establish peace, soldiers and Pima scouts took a wagon of
    rations to the Superstition mountains; Apaches interpreted the move as hostile,
    attacked, killed the driver, and were pursued.
  category: sequence
  evidence_refs:
  - ev:13
