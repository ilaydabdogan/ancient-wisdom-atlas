canonical_text:
  quote: ''
  summary: The passage evaluates Pima basketry, pottery ornamentation, and musical
    instruments. It describes Pima basketry as recent and borrowed, notes repeated
    design elements such as coyote tracks, triangles, flower patterns, and scroll
    frets, and contrasts Pima work with Yavapai, Hohokam, Maricopa, and Kwahadk examples.
    It also rejects some explanations for perceived Pima artistic inferiority and
    lists four kinds of Pima musical instruments, including instruments said to have
    been adopted from the Maricopas.
  language: English
  quote_policy: summarized
