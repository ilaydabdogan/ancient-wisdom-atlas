canonical_text:
  quote: ''
  summary: The passage describes treatment of aged persons among the Pimas. It says
    sedentary life and mild climate prevented abandonment of the aged on marches,
    but old and helpless people were sometimes neglected until starvation or committed
    suicide by burning their houses. Youth sometimes threw stones at aged persons.
    A specific old blind man at Sacaton is described as living alone in a small brush
    shelter, limited by a rope tied to his doorpost, receiving cooked food from adult
    grandchildren, and boasting of past victories over Apaches.
  language: English
  quote_policy: summarized
