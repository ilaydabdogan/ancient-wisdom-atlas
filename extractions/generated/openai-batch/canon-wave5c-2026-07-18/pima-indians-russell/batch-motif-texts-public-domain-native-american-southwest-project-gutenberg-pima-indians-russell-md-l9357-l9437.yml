canonical_text:
  quote: ''
  summary: The passage describes Pima education through imitation, apprenticeship,
    and elder oral instruction. Boys receive daybreak teaching about the Sun god and
    later moral and warrior instruction, including vigilance, austerity, courage,
    silence under injury, unselfishness, and preparation for purification after killing.
    A young hunter gives away his first deer. Around age twenty, a youth receives
    ancient traditions from the keeper of legends for four days and nights while abstaining
    from salt. Girls receive domestic instruction, exemplified by Sala Hina's father's
    advice about cooking tools, water, and keeping the household fire alive. The passage
    also notes parental discipline, punishment for breaking a water olla, early cooking
    and basket-making training, and a basket required during puberty ceremonies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pima children are described as receiving education by imitation, apprenticeship,
    and careful oral instruction in moral, religious, and other matters from elders.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young Pima boy is held by his father at daybreak and told about the mysteries
    of the great Sun god; when older he must sit upright and attend to lectures on
    proper conduct.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the boy is inattentive, the father may strike the side of his nose with
    a stiffened middle finger to make him look directly at him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy is taught to be alert with bow and arrows against Apache attacks and
    to perform morning scout duty or livestock duties before eating.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Warrior instruction includes accustoming oneself to cold food, leftovers,
    cold, a small blanket, endurance on the war trail, and silent behavior if wounded.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The father's advice includes avoiding fights with comrades, preserving strength
    for Apaches, being unselfish, keeping silence before foolish counsel, not speaking
    foolishly, and bathing in cold morning water to prepare for purification after
    killing an enemy.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A youth's debut as a hunter is marked by giving away all of the first deer
    he kills; afterward he may choose his share before distributing meat to others.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Around age twenty, each youth is told the ancient traditions, or Ha-ak Aga,
    by the keeper of legends for four days and four nights, and during that period
    he is not allowed to eat salt.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sala Hina's father advises her to stay home with her mother, learn cooking
    tools and seed preparation, keep firewood ready, keep the fire alive, and ensure
    the drinking olla is never empty.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The same advice states that it is the office of man to kindle the fire and
    the part of woman to keep it burning.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says children may be scolded, slapped, or shaken, and that a girl
    who breaks an olla while fetching water may have her naked arm scratched with
    broken pieces.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Girls begin assisting in cooking at about seven or eight, begin making baskets
    at about nine or ten, and are required to make a single basket during puberty
    ceremonies.
  category: sequence
  evidence_refs:
  - ev:7
