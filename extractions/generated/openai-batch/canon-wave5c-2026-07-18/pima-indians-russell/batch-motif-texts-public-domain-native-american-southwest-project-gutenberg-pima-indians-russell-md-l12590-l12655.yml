canonical_text:
  quote: ''
  summary: The passage describes Pima views of the soul, including its location in
    the breast, varied beliefs about its destiny after death, owl associations, an
    eastern land of the dead beyond Earth Crack, funerary preparation for feasting
    and dancing in the other world, and accounts of ghosts troubling the living and
    being addressed by medicine-men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The soul is said to be in the center of the breast, to make people breathe,
    but not to be the breath itself; its appearance or color is unknown.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Pima views on the soul's destiny varied considerably.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some declared that at death the soul passed into the body of an owl, and that
    a hooting owl at a death might be waiting for the soul.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Owl feathers were given to a dying person and were kept in a long rectangular
    box or basket of maguey leaf; medicine-men also kept such feathers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: If possible, owl feathers were collected from a living bird, which might then
    be released or killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Short downy owl feathers falling on a person were said to cause blindness,
    and people were wary of abandoned buildings occupied by owls.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Another view says that after death souls go east to the land of the dead,
    called Morning Base or the place where the sun rises.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The land of the dead is separated from the land of the living by a chasm called
    Earth Crack.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The other world is described as a place of rejoicing, feasting, and dancing.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: A dead person's best clothing and carefully dressed hair are required because
    of the expected ceremony in the other world.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that there is no idea of spiritual reward or punishment
    for conduct in this life.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: Souls of the dead are also said to remain near the living and perform unpleasant
    pranks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Ghosts may present themselves to a living person who is alone at night; at
    such times the ghost never speaks, and only medicine-men may speak to ghosts.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: If seeing a ghost makes someone sick, a medicine-man goes to the grave of
    the offending soul and tells it to be quiet.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Kisatc of Santan thought the soul continued to reside in the body because
    the body was its house.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Kisatc reported that a medicine-man addressed a grave, and that the spirit
    in the grave replied that it sometimes went to the villages and felt unhappy.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: Medicine-men are said to claim communication with departed spirits and with
    supernatural beings capable of imparting magic power.
  category: relationship
  evidence_refs:
  - ev:7
