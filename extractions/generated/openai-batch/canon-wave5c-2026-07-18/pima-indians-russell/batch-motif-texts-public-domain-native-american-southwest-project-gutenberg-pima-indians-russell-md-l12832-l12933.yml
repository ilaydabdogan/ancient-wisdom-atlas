canonical_text:
  quote: ''
  summary: 'The passage describes accounts of medicine-man initiation and Makai crop
    and rain rites: instruction, tests with sticks, transfer of white power-balls,
    novitiate restrictions, dependence on dreams and visions, and ritual performances
    intended to increase wheat, melons, squashes, and rain.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Informants state that a man instructed by a medicine-man and able to perform
    some tricks could become a medicine-man.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The process of acquiring power is called va'Ikita, glossed as getting power
    and literally as pouring in olla.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: A novice may be tested on all fours while the medicine-man throws four short
    sticks at him; falling during the test means he has been shot with power and may
    proceed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The instructor produces white balls called tcu'tcaka and either rubs them
    into the novice's breast or the novice swallows them.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The novice commonly pays a fee, avoids a woman's menstrual lodge, keeps the
    learning secret, and does not practice until a novitiate of usually two years
    and sometimes four is complete.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A practitioner's later success is said to depend on developing dreams and
    visions, and the profession is not inherited by a medicine-man's son.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Makai are described as responsible for securing supernatural aid for good
    crops.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: In one crop rite an olla filled with earth is stirred with a willow stick,
    left before a clear fire all night during rain songs, and at dawn is found to
    contain wheat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Four grains of wheat from the olla are given to each person present to bury
    at field corners or together at the center.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: For a fee, the Makai performs rites in a wheat field, smokes at each corner,
    and buries a short stick at the center.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: For melons and squashes, the Makai brings a small mud-covered melon or squash
    from his mouth or body and buries it at the root of a growing plant.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Wheat germination and growth are imitated by using hidden grains in the hair
    and prepared young shoots, ending with the display of a developed plant.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Young men chew mesquite leaves, which are then ejected and seen as wheat or
    corn.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: During rain ceremonies, a reed first pours dry earth and then reveals water,
    after which rain is expected immediately.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: A magic slate in a cup of water, together with a shallow trench showing rivulet
    paths, is said to bring rain in four days.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: The Makai conceals reeds filled with water and appears to scatter water from
    dry eagle down or tail feathers over singers and spectators.
  category: action
  evidence_refs:
  - ev:12
