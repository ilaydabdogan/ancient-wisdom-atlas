canonical_text:
  quote: ''
  summary: 'The passage briefly identifies the Tze-kinne or Stone-house people in
    relation to the cliff-dwelling Sobaypuris and the Pimas. It then describes a Pima
    child purification ceremony performed when a child begins to creep: parents bring
    the child to a medicine-man, who uses water in a seashell with a sacred pebble
    and owl feather, waves an eagle feather, and has the parents and child drink the
    water and eat white ashes or mud. The rite is said to protect the child from harmful
    magic, demons, lightning, and accidents; the mother must avoid salt for four days
    afterward. The writer compares the ceremony with Christian baptism and with older
    Indigenous medicine-water purification customs, especially as discussed by Cushing
    for the Zuni.'
  language: English
  quote_policy: summarized
