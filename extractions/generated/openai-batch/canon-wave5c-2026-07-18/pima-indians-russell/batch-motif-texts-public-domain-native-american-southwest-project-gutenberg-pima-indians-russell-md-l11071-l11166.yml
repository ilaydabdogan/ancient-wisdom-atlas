canonical_text:
  quote: ''
  summary: A slain figure's blood is gathered by an excluded old woman and her two
    grandsons; after repeated four-day intervals it becomes eggs and then birds. The
    boys release the birds, bury their killed grandmother, and obtain tobacco from
    a plant growing from her grave. Elder Brother teaches the boys uses of tobacco
    and other charms, later causes mischief, is repeatedly killed and repeatedly reappears.
    The people consult Vulture, a flood survivor who can transform into a bird and
    lives in a magic house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Hfi,-^k/Hiplk was killed, the people held a feast, but one old woman
    and her two grandsons were not invited.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman told her grandsons to find drops of the slain figure's blood
    among the rocks and bring them to her; she put the blood into a dish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After successive four-day intervals, the contents of the dish became two eggs,
    then two little birds, then two beautiful birds.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people tried to destroy the old woman and the boys in order to get the
    birds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old woman instructed the boys to take the birds away at night to a distant
    land and set them free, and said the boys would find her dead when they returned.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boys released the parrots; the birds flew into the mountains and concealed
    themselves in the forest, and the boys hid there as well.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the boys returned home, they found their grandmother killed and buried
    her body in the sand.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Following their grandmother's instructions, the boys visited her grave at
    four-day intervals until a plant appeared, later gathered its leaves, and obtained
    tobacco.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Elder Brother told the boys that the tobacco leaves were to be rolled in corn
    husks and smoked.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Elder Brother showed the boys earth flowers for gaining women's favor and
    bark that could be powdered to induce sleep or overpower someone.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The youths used the love philter and sleeping powder, and the people later
    killed them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Elder Brother lived in the cave at Baboquivari, traveled from village to village
    doing mischief, sang a menstrual-period song, reviled families of young girls,
    and was driven away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The people killed Elder Brother repeatedly by clubbing, cutting and scattering
    his flesh, pounding his bones, and burning his body, but he reappeared the next
    day each time.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: The people held a council and called on Vulture because he had been saved
    with Elder Brother at the time of the flood.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Vulture was a man who transformed himself into a bird, went through openings
    in the sky, survived the flood, and later built a va'-aki or magic house.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: The people came to Vulture's va'-aki with complaints about Elder Brother,
    and Vulture said he would test his magic power in their presence.
  category: sequence
  evidence_refs:
  - ev:12
