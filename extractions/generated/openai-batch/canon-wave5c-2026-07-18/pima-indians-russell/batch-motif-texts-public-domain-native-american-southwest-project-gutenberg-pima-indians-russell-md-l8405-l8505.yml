canonical_text:
  quote: ''
  summary: 'The passage describes several Pima games: a reed-and-corn guessing game
    using sand, concealed beans or balls, blankets, sticks, and scoring; a team line
    game called Vaputta involving a hidden pottery disk and jumps toward a goal; boys’
    games using arrows, rag bundles, rag balls, curved sticks, and running; and an
    archery exercise with a grass bundle tied with willow bark.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the reed-and-corn game, one hundred grains of corn are placed in a hole
    between players, won grains are moved to each player’s hole, and a player who
    wins all the corn places a stick in the sand.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The number of sticks is set beforehand from one to ten, and each player cancels
    one opponent’s stick when winning one himself.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the reed guessing game, two players focus on guessing, one person on each
    side fills reeds, one on each side watches counting, and four men hold the blanket
    beneath which the filling occurs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Plain and marked reeds are kept together; pairs of reeds are filled with sand
    and a bean or ball is concealed in each pair before the reeds are exchanged and
    guessed.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Scoring in the reed game depends on whether guesses are right or wrong and,
    in one phase, whether the ball is in the under reed or the upper reed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that cheating occurs in various ways and suggests that
    this practice arose after contact with whites.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Vaputta, any number of players participate under two leaders selected by
    toss; the sides face one another in lines with a goal about fifty yards away.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Vaputta, a leader carries a small object, usually a circular pottery piece,
    behind the line and places it in a player’s hands while the opposite leader guesses
    who holds it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the opposing Vaputta leader guesses wrong, an end player on the object-holding
    line runs and jumps over the raised leg of the man at the opposite end, moving
    the line toward the goal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: In a boys’ arrow game, a runner drags a rag bundle on a string around the
    outside of a circle while boys shoot at it; the boy who pierces the bundle wins
    the heap of deposited arrows.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In Papaietcitakut, whose name is said to mean “cooking place,” a rag ball
    is tossed up, and a nearby player uses a slightly curved stick to try to throw
    it against another player.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In Papaietcitakut, the player who is hit must stand with head down to protect
    the face while others throw the ball at him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: In Okmaitceke, a grass bundle tied with willow bark is tossed upward with
    the left hand while the player holds a bow in the right hand and shoots before
    the bundle reaches the ground.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: When the Okmaitceke bundle is thrown forward instead of upward, the variant
    is called tcomalt maitcikg, glossed in the passage as shooting the bundle low.
  category: speech
  evidence_refs:
  - ev:7
