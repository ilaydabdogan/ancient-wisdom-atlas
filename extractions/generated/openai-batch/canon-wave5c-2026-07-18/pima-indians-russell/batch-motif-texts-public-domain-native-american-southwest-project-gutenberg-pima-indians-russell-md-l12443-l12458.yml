canonical_text:
  quote: ''
  summary: The passage gives two brief tale abstracts. In one, two brothers carry
    heavy game; one asks the other to help with a plan, is cut into four pieces, and
    the pieces are thrown into a lake; after four days, four horses are found. In
    the next, five orphaned children supported by their aunt return after a rabbit's
    warning to find the aunt dead; they keep a fire for her return, are frightened
    and pursued by her ghost, and all become stone.
