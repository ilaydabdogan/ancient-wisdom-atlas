canonical_text:
  quote: ''
  summary: 'The passage describes Pima animal husbandry and related practices: seasonal
    feeding of horses and livestock on mesquite, reported early introduction of cattle,
    scarcity and use of oxen, herding and guarding cattle against Apache raids, limited
    use of mules and donkeys, poultry obtained from Mexicans and later American breeds,
    and the keeping of eagles, red-tailed hawks, and Sonora doves, including raptors
    kept for feathers used by medicine-men.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mesquite leaves and beans are described as important seasonal nourishment
    for horses and livestock, with some owners storing beans for feed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sala Hina reports that her father and his brother, identified as two Kwahadk's,
    brought the first cattle to the Pimas about 1820.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Spanish missionaries in Papagueria had brought livestock
    to their stations for at least two centuries before the reported date.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The custom of killing and eating cattle at the death of their owners is said
    to have hindered the increase of Pima herds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Oxen were scarce for about half a century after their introduction and were
    used with head yokes and wooden plows; the passage says this practice had ended.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Cattle were driven and roped with the lariat, branded, and allowed to run
    at large, with lack of water away from the river limiting their straying.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Horses and cattle attracted Apache raiders until peace was declared in 1879,
    and Pima men sometimes encountered enemies while tracking strayed animals or waiting
    at water holes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Stock was customarily corralled inside the village at night to guard against
    thieves.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Mules were raised only in small numbers and were described as small and of
    little value; donkeys were not popular because they were slow and poorly suited
