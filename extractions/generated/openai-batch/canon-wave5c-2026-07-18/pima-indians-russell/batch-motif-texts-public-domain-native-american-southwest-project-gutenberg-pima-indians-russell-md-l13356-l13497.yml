canonical_text:
  quote: ''
  summary: The passage describes Pima beliefs and practices concerning smallpox, measles,
    inoculation, vaccine bandages, rheumatism, syphilis, diarrhea, wounds, burns,
    broken limbs, melancholia after killing Apaches, massage, and a table of diseases.
    Smallpox is described as an evil spirit or demon to be placated; diarrhea is attributed
    to touching ripe wheat and countered by a medicine-man blowing danger away with
    smoke.
