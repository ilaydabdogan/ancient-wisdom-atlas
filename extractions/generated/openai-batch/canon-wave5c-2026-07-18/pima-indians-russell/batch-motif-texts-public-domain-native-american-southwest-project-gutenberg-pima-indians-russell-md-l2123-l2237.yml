candidate_motifs:
- id: motif:1
  label: Water scarcity prompts migration to fertile river land
  taxonomy_refs: []
  basis: The passage links lack of irrigation water and want to Pima movement to Salt
    River, where water and crops are abundant.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is presented as a historical calendar event, not as a mythic migration
    story.
- id: motif:2
  label: Settlement used as a defensive buffer
  taxonomy_refs: []
  basis: The settlers' motive for inviting Pimas is described as wanting them to shield
    against Apache assaults.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The motif is political and historical rather than explicitly symbolic.
- id: motif:3
  label: Annihilating attack in mountain or canyon setting
  taxonomy_refs: []
  basis: The battle account describes soldiers and scouts surrounding Apaches at the
    Tanks and leaving no man alive, with a footnote giving numbers killed and captured.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: No divine or supernatural judgment is stated; avoid mapping to divine-judgment
    motifs.
- id: motif:4
  label: Hazardous river crossing with failed raft and safe ford
  taxonomy_refs: []
  basis: The campaign narrative centers on a high river, a raft that sank with possessions,
    and other party members finding a safe ford before continuing the raid.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The event is practical and military; it should not be treated as an ark
    or flood-renewal motif without more evidence.
- id: motif:5
  label: Disease attributed to magic and killing of suspected ritual specialists
  taxonomy_refs: []
  basis: Medicine-men were suspected of causing sickness by magic and were killed
    to stop the plague.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage reports suspicion and killing but does not give ritual details
    or a mythic frame.
- id: motif:6
  label: Race contest in which a woman defeats a man
  taxonomy_refs: []
  basis: During mescal gathering, a race between a man and a woman is recorded, with
    the woman winning.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage gives only the bare event; no symbolic meaning is explained.
- id: motif:7
  label: Intertribal athletic contest
  taxonomy_refs: []
  basis: The passage records village gathering for a kicking-ball race and a first
    relay race between Gila Crossing Pimas and Gila Maricopa villagers.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: medium
  cautions: Athletic events are calendrical notices; ritual or mythic status is not
    stated.
- id: motif:8
  label: Twin animal birth recorded as notable event
  taxonomy_refs: []
  basis: The calendar records a mare giving birth to twin colts during mescal gathering
    before wheat ripening.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: Although twin birth is notable, the passage does not mark the colts as
    sacred; do not map directly to sacred-twins taxonomy without corroboration.
- id: motif:9
  label: Exposure death with body found under tree
  taxonomy_refs: []
  basis: A man searching for horses died from cold, and his body was found sitting
    under a tree.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage gives no ritual or afterlife interpretation.
- id: motif:10
  label: Drinking gathering leading to quarrel and killing
  taxonomy_refs: []
  basis: Pimas went to drink tizwin at Kwahadk' village; a quarrel followed, and two
    Santan men were killed by Casa Blancas.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The text does not explain whether the drinking event was ceremonial or
    social.
comparison_claims:
- id: claim:1
  claim: The passage itself compares the 1875-76 sickness at Rsánĭk to an earlier
    1866 sickness, saying it was apparently the same and identifying shooting pains
    through the body as the principal symptom.
  claim_level: same_motif
  target: 1866 sickness episode in the same Pima calendar tradition
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: Only the present passage is supplied; the 1866 episode is not included
    here, and the source uses the cautious word 'apparently'.
