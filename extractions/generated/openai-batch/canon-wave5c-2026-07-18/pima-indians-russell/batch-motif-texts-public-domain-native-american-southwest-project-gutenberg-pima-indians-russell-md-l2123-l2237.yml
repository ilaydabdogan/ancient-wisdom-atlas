  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Rights metadata not supplied in request.
- id: ev:5
  type: summary
  locator: 2167-2176
  quote_or_summary: On a campaign after heavy rain, Pimas found Salt River too high
    to ford; a raft carrying saddles and blankets sank; others found a safe ford,
    killed several enemies, and captured an Apache lad near Four Peaks.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
