  quote_or_summary: Pimas had little irrigation water and suffered want; Salt River
    settlers invited them; a Rso'ttŭk Pima party cleared river-bottom fields, found
    plentiful water, and had an excellent crop; Mormon motive included using Pimas
    as a buffer against Apaches.
