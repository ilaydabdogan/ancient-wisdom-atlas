  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: While a party was gathering mescal before the wheat ripened, a mare gave birth
    to twin colts.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: A man who went far to search for his horses died from cold, and his body was
