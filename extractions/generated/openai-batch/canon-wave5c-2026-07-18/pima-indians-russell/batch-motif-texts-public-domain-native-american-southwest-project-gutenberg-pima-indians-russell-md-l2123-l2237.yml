canonical_text:
  quote: ''
  summary: 'A Pima calendar passage records events from about 1872 to 1878: movement
    to Salt River because of irrigation water, conflict with Apaches, settlement and
    telegraph construction, a failed raft crossing during a campaign, individual violent
    or accidental deaths, sickness attributed to magic, races, smallpox during a truce,
    the birth of twin colts, and quarrel killings after drinking tizwin.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For several years the Pimas had little water for irrigation and began to suffer
    want before a party accepted an invitation to move to Salt River, where water
    was plentiful and the first crop was very good.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The settlers on Salt River, identified in the passage as Mormons, wanted the
    Pimas to serve as a buffer against Apache attacks.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: United States soldiers with Pima, Maricopa, and Apache scouts surrounded Superstition
    Mountain Apaches at the Tanks and killed the men there.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:4
  text: Owl Ear is named as the narrator of the Salt River battle circumstances.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ku-ukŭmtikam, an Apache chief, and his band were killed by soldiers and Pima
    scouts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A village at Gila Crossing was settled, and a telegraph line was run from
    west to east during the winter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A note states that the Salt River reservation area included Hohokam ruins
    and a large canal, and that the Pimas secured a constant water supply through
    arrangements with canal companies.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: During a campaign after heavy rain, the Salt River was too high to ford safely;
    a raft sank with saddles and blankets, while other members of the party found
    a ford, continued the raid, killed several enemies, and captured an Apache lad
    near Four Peaks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A man trying to catch his pony tied one end of a lariat to his waist and the
    other to the horse's tail; the animal broke away and dragged him to death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Apache White Hat killed a Pima.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sickness prevailed at Rsánĭk with shooting pains through the body; two medicine-men
    were suspected of causing it by magic and were killed to stop the plague.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: While Pimas gathered mescal in the mountains, a race took place between a
    man and a woman, and the woman won.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Later in the season the villages gathered to watch a kicking-ball race.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: During a truce, an Apache village stood at the junction of the Gila and Salt
    rivers, and smallpox affected that village as well as Pima and Maricopa villages.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Gila Crossing Pimas and Gila Maricopa villagers ran a relay race, described
