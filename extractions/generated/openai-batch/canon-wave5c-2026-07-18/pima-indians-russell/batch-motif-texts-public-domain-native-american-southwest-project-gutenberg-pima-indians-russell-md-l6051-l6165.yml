canonical_text:
  quote: ''
  summary: 'Ethnographic description of Pima and neighboring pottery forms: water
    canteens, parching pans, tortilla plates, cups, plates, effigies, spoons or ladles
    from ruins, bowls, and pottery repair with creosote gum. The passage notes gendered
    water-carrying practices, trade with neighboring groups, human-figure decoration
    and effigies, and a restricted healing use for ruin-derived spoons.'
  language: English
  quote_policy: summarized
