canonical_text:
  quote: ''
  summary: A boy living poorly with his grandmother leaves to find his captive mother
    among the Apaches. He changes form into a saguaro to evade his grandmother, then
    into a dove so his mother can carry him into the Apache dwelling. When the Apaches
    smash the dove form, the pieces become hawks that kill them. The hawks become
    the boy again, but he and his mother cannot complete the journey home and turn
    into saguaros beside the road.
  language: English
  quote_policy: summarized
