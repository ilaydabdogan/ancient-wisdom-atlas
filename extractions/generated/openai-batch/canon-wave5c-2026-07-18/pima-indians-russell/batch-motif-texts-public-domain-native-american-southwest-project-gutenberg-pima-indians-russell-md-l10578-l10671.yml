canonical_text:
  quote: ''
  summary: 'The passage recounts a creation and etiological sequence: after a flood,
    figures create or place animals and beings; Earth Doctor''s disappearance is linked
    to the spread of sickness; human tribal groups awaken and receive distinctions;
    Maricopa irrigation aid is described; Elder Brother becomes mischievous; and Rattlesnake
    receives teeth and kills Rabbit after repeated provocation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lice that drop from a scratched head become ants and quickly dry one wet,
    muddy spot of earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Elder Brother, Coyote, and Earth Doctor sit facing west, south, and east respectively,
    each giving a direction of emergence as the reason.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The three agree not to look at or announce one another's creations until all
    are finished.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Coyote makes web-footed animals, snakes, and birds; Earth Doctor makes deformed
    humanlike beings, including beings with one leg, immense ears, imperforate bodies,
    or flames of fire in their knees.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Elder Brother orders Coyote's creations to be thrown into water and Earth
    Doctor's beings to be placed in the west; both obey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Earth Doctor sinks into the earth; Elder Brother fails to grasp him, gets
    dirt and blood on his hands, shakes them, and the scattered blood is said to cause
    sickness across land and water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Images made by Elder Brother are kept for four days; an Apache image is the
    first to come alive and says that it is cold.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Earth Doctor angrily gathers the Apaches and throws them over a mountain;
    the passage explains this as the cause of their fierceness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'Four Indian peoples are named: Wa-aki Ap, Apaches, Maricopas, and Pimas;
    the Pimas are described as receiving superior qualities such as knowledge of seasons,
    rain-bringing power, and curing ability.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Maricopas separate from the Yumas, join the Pimas, settle in the Salt
    River valley, and unsuccessfully try to build canals because of hard rocks and
    soil.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Elder Brother temporarily softens the ground for the Maricopas; White-eater-old-woman,
    his sister, later finishes the work in one night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Afterward Elder Brother refuses further aid and begins doing mischief, including
    marrying young women and deserting them; the people become jealous and plan to
    destroy him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: People and animals are confined together in a great house; Rattlesnake, called
