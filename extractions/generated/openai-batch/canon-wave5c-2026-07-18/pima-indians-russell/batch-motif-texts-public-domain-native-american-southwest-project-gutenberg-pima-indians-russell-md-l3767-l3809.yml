canonical_text:
  quote: ''
  summary: 'The passage describes dogs and horses among the Pimas: dogs as the only
    certainly attested domesticated animal at discovery, their former village-warning
    function, a treatment involving a burned cross for a dog bitten by a mad dog,
    and horse acquisition, use, trade, scarcity, condition, and winter fodder. It
    also notes that horse origins had become explained by myths, without giving those
    myths.'
