canonical_text:
  quote: ''
  summary: 'The passage describes Pima textile materials and techniques: a collected
    spindle, cotton drying and storage, spinning and weaving practices, uses of woven
    cloth, barter and trade for blankets and textile materials, limited dyeing, absence
    of sewing, and the construction and operation of a horizontal ground loom.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A collected spindle is described as made of arrowwood with a cactus-rib crossbar
    and measured dimensions.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that not all Pimas had cotton blankets, and that some
    obtained blankets by barter involving produce or horses.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bartlett’s quoted account describes warp stretched on the ground with sticks
    and stakes, a cane element functioning like a sley, a pointed-stick shuttle, and
    a hard-wood beating tool.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cotton was picked, dried on arbor roofs in the pod, separated from pods, and
    stored in large ollas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In winter, women spun cotton into thread and men wove it into cloth squares
    used as day robes, night blankets, waist girdles, and head bands.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that later, longer bolts of cloth were reportedly woven for
    barter with adjoining tribes, but presents this as not matching primitive custom.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Earlier accounts mention wool as well as native cotton, but the passage states
    that little information on wool use was available and that no sheep were present
    on the reservation during the writer’s visit.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The only dye described is a dark buff ocher obtained from the Papagos; it
    was used without mordant and applied only to selvage thread.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Scarlet thread for belts was obtained by unraveling bayeta after trade relations
    with Mexicans began.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sewing is described as unknown, and holes were patched by weaving in a new
    piece.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The loom is described as simpler than those of surrounding tribes and was
    spread horizontally rather than set upright.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The loom setup used four ground stakes, clean white river sand, saguaro-rib
    yarn beams, taut side cords, continuous warp, binding thread, an arrowwood lease
    rod, and an arrowwood heald rod.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The weaver sat on the ground or on the completed cloth, lifted upper warp
    threads, passed an arrowwood shuttle, struck the weft with a mesquite batten,
    and adjusted irregular warp threads with a short peg.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A note states that the Pima division of spinning and weaving labor differs
    from that of the Hopis and Zuñis.
  category: relationship
  evidence_refs:
  - ev:9
