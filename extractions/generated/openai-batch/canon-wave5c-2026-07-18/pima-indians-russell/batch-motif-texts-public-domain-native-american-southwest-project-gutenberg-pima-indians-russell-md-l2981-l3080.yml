canonical_text:
  quote: ''
  summary: Ethnographic catalogue of plants used for food, describing Pima gathering,
    processing, roasting, boiling, drying, storage, and consumption practices for
    saltbushes, cottonwood catkins, mescal, roots, seeds, nuts, mistletoe berries,
    pumpkins, squashes, and cactus fruit. The passage also notes intergroup use of
    some foods and one belief about failed mescal roasting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several saltbushes are boiled with other food for their salty flavor and are
    cooked in pits with cactus fruit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes saltbushes as abundant; young shoots of some are crisp
    and tender, herbaceous kinds are eaten by stock, and woody kinds are useful for
    fuel.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cottonwoods grow along the Gila and Salt rivers, and in February and March
    women send barefoot boys into the trees to throw down catkins that are gathered
    in baskets and eaten raw.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mescal was gathered in famine times, but travel away from villages was described
    as dangerous because of the Apaches.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mescal is described as a favorite plant among the Pimas, Papagos, Apaches,
    and many other tribes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men made digging sticks, pried out mescal heads, trimmed the leaves, and left
    one or two leaves so the heads could be tied in pairs and carried on a rope.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: While men brought in mescal, women gathered wood for fuel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Thin-leaved mescal specimens were rejected because they were said to contain
    little nourishment and to blister the mouth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Mescal was roasted in pits with fire, coals, stones, and an earth covering;
    it was checked after twenty-four hours and, if not done, left twelve hours longer.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: If mescal roasting was not complete when the pit was first opened, the cause
    was believed to be the incontinence of some party members.
  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: After roasting, mescal heads were opened, their centers cut out, dried in
    the sun, and made ready for use or storage.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Prepared mescal is chewed for its juice, used alone or with pinole, and boiled
    down into a black syrup described as inferior to saguaro syrup.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Monolepis roots are washed, boiled, cooled, squeezed, and cooked again with
    fat or lard and salt; the seeds are boiled, dried, parched, ground on a metate,
    and eaten as pinole.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Wild gourd seeds are roasted and eaten, and the root of a small plant is gathered,
    boiled, and eaten without peeling.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Ironwood nuts are parched in an olla or a broken half of one and eaten; the
    tree grows on mesas around the villages and is conspicuous in May when flowering
    purple.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Mistletoe berries growing on mesquite are gathered, boiled on the stem, and
    stripped into the mouth; the passage says only this mistletoe species is eaten.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Pumpkins and squashes are grown, cut into strips and dried, and their seeds
    are parched; dried pumpkin is softened in water and boiled before use.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: Cactus fruit is gathered with an enlarged wooden clothespin-like instrument
    and carried home in a carrying basket.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: Cactus fruit is roasted overnight in a pit layered with saltbush, fruit, hot
    stones, and earth, then dried, stirred until thorns are rubbed off, stored, boiled,
    salted, and eaten with pinole and greens.
  category: sequence
  evidence_refs:
  - ev:11
