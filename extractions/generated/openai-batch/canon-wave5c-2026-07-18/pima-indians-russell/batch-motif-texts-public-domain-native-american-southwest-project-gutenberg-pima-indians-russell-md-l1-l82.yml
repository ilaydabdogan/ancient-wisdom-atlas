canonical_text:
  quote: ''
  summary: Introductory ethnographic material describing fieldwork among the Pima
    at Sacaton and neighboring communities in 1901-1902, methods using interpreters
    and informants, collection of material culture and plant specimens, and brief
    sketches of several named informants and assistants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer was based at Sacaton on the Gila River reservation in southern
    Arizona from November 1901 until June 1902 while studying the Pima tribe.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Information was obtained with the aid of five native interpreters from ten
    Pima men and women selected for intelligence and special aptitude.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Overlapping work among multiple investigators was described as a check on
    information and as enabling a fuller account of Piman ethnology.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A house-to-house canvass brought the researcher into contact with nearly every
    household on the reservation, and visits were also made to Salt River Pimas and
    desert Kwahadk's.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: More than 300 specimens illustrative of Piman arts were collected.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: KA'mil tk&k, also called Thin Leather, is described as an old man and one
    of the remaining narrators of myths and speeches.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Thin Leather was an intimate friend of head chief Antonio Azul and had a prominent
    place in tribal councils.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: From Thin Leather the writer obtained the cosmogonical myth of the tribe,
    speeches, songs, and general information.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Thin Leather made a model of a loom and a few other specimens for the collection.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: Sala Hina, also called Sarah Fish or Hina, was described as one of the most
    intelligent older women and as willing to relate what she knew about tribal religious
    beliefs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Sala Hina had practical botanical training and knowledge of vegetal products
    and pottery skill.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: Sika'tcu, also called Dry, was an old woman, half sister of Antonio Azul,
    and one of the best known nurses and midwives near Sacaton.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: Sika'tcu remembered seeing covered wagons of emigrant trains on the Gila route
    and later provided information on Pima women's views of warfare and sex-specific
    customs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Professor J. J. Thomber accompanied an 80-mile round trip along the Gila River
    and contributed about 50 herbarium specimens.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: A list of plants used for food, medicine, and other purposes was made, and
    men and women were enlisted to point out plants in river bottoms and on hills.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Sets of seeds were collected and planted in summer 1902, but the season was
    too dry for germination.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: Antonio Azul is identified as the head chief of the tribe and a source of
    information on war customs and recent history.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:18
  text: Ki'satc, also called Cheese, is described as an old Santan pariah associated
    with the arts of the medicine-man.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:19
  text: William Blackwater was an elderly Pima connected with the later history of
    the village of Blackwater and provided information on history and customs.
  category: attribute
  evidence_refs:
  - ev:10
