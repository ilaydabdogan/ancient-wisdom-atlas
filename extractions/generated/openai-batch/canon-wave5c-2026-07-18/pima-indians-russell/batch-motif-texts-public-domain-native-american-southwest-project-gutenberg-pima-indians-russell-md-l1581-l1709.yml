canonical_text:
  quote: ''
  summary: The passage is a series of Pima calendar-related historical entries describing
    raids, ambushes, pursuits, killings, defensive actions, casualties, burned dead,
    trophy hair-taking, horse theft, calendar marks, and a final incomplete account
    of a Yuma-Mohave attack on Maricopas followed by Pima and Maricopa mobilization.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three Apaches approached the villages, fled to a hill near Tempe, built a
    stone wall, and were killed after a Pima led a party inside the breastwork.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yumas surprised a Maricopa village, killed several people, carried property
    to a nearby hill, sang and danced there, and were later routed by Pimas.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Yuma chief known to the Pimas returned with only a knife, said he did not
    wish to escape alone, and was killed with arrows.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A remnant of the Yuma party hid in a thicket near the Estrellas and was killed;
    hair was cut from each fallen Yuma, and the account gives 134 Yumas killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In 1851-52, a Maricopa warrior killed one of two Apaches near the Maricopa
    village; Pimas campaigned against Apaches on Salt River and lost one person; Apaches
    raided a Papago village near Quijotoa.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: For three years, the Gila Crossing calendar reportedly had only year marks,
    and the keeper recalled no event for that period.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: At a nose-shaped hill in the Santans, Apaches ambushed Pimas and Maricopas
    after killing women near the Maricopa village and luring pursuers into range of
    waiting archers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The dead from the Santan ambush were burned that day north of the Santan hills.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Pimas killed Apaches south of the villages and later north of the Santan hills
    when the wheat was ripe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Apaches came to steal horses and brought a live vulture with them; they were
    discovered and several were killed.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Papagos reported Apache horse theft and requested Pima aid; Apache horse thieves
    were overtaken in the Rincon mountains, and a horse-head mark indicated the purpose
    of the Apaches.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: One Apache fugitive hid in a sand hole after dropping his bow; Pimas shook
    live coals into the hole, causing him to leap out and escape after startling them.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Apaches were grinding mesquite beans from dry pods when arrows began to fall
    into their camp; a blind Apache was killed while others fled.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Pimas and Maricopas joined white soldiers against Apaches under White Hat;
    Pima casualties occurred, the Pimas burned their dead, and later killed Apaches
    raising corn on Salt River.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: An Apache band was chased about 30 miles to Tempe butte, surrounded at the
    summit, and all were killed except one who escaped into brush.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: Yumas and Mohaves killed Maricopa women gathering mesquite beans, kept one
    woman as a guide, compelled her to lead them to her brother's home, killed her
    with a club, chased the brother, burned the Maricopa village, and prompted Pima-Maricopa
    mobilization at night.
  category: sequence
  evidence_refs:
  - ev:14
