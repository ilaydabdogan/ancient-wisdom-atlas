candidate_motifs:
- id: motif:1
  label: raid followed by pursuit and counterattack
  taxonomy_refs: []
  basis: Multiple entries follow a pattern in which one group raids or approaches
    a village and another group pursues, surrounds, routs, or kills the attackers.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage presents historical calendar entries rather than mythic narrative;
    the motif label is descriptive, not a claim of mythological equivalence.
- id: motif:2
  label: enemy refuge on elevated or concealed terrain
  taxonomy_refs: []
  basis: Enemies repeatedly flee to or hide in a hill, stone breastwork, thicket,
    sand hole, brush, or butte before being killed or escaping.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:10
  - ev:13
  confidence: high
  cautions: This is a recurring narrative pattern in the entries; no broader comparative
    claim is made.
- id: motif:3
  label: ambush by decoy retreat
  taxonomy_refs: []
  basis: Apaches retreat slowly to lure Pima and Maricopa warriors within range of
    waiting Apaches' arrows.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: Supported by one explicit episode in this passage.
- id: motif:4
  label: hair-taking from fallen enemies
  taxonomy_refs: []
  basis: After the Yuma defeat, a strand of hair is cut from the head of each fallen
    Yuma.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explain the purpose or ritual meaning of the hair-taking.
- id: motif:5
  label: fire in contexts of death, expulsion, and destruction
  taxonomy_refs: []
  basis: The passage mentions dead being burned, live coals used to force a fugitive
    from a hole, and a village burned by attackers.
  evidence_refs:
  - ev:6
  - ev:10
  - ev:12
  - ev:14
  confidence: high
  cautions: The fire references are literal historical actions; they do not support
    the available world-destroying-fire motif family.
- id: motif:6
  label: captive guide compelled to lead attackers to kin
  taxonomy_refs: []
  basis: A Maricopa woman is spared to serve as a guide, compelled to lead attackers
    to her brother's home, and then killed.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The account is incomplete at the end of the passage, and this motif is
    supported by a single episode.
- id: motif:7
  label: calendar mark as compressed event record
  taxonomy_refs: []
  basis: The passage discusses year marks with no recalled events, a horse-head mark
    indicating Apache purpose, and a stick figure representing a mesquite root.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: high
  cautions: This is a recording or pictographic pattern in a calendar context, not
    a mythic narrative motif.
- id: motif:8
  label: warrior speech of resolve or defiance
  taxonomy_refs: []
  basis: A Yuma chief returns saying he does not wish to escape alone, and a pursued
    Maricopa warrior answers a taunt about dying like a man.
  evidence_refs:
  - ev:2
  - ev:14
  confidence: medium
  cautions: The two speeches occur in separate historical episodes and should not
    be treated as a formal motif without review.
