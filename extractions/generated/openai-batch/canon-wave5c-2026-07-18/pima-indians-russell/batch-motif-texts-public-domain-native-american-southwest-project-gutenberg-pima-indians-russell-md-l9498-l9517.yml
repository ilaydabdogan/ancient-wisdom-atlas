  summary: The passage reports Pima views that death is not natural but caused by
    magic, enemies, animals, or ceremonial neglect. It recounts a legend in which
    the first human death was caused by the venom of Soft Child, the rattlesnake,
    who received the power of death for self-protection. It also reports that daytime
    deaths were attributed to the Sun and nighttime deaths to Night, with the author
    interpreting this as a failure of protective prayer or divine attention.
