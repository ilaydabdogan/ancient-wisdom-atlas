canonical_text:
  quote: ''
  summary: The passage describes Pima mourning practices, including gendered hair
    cutting, burial of cut hair in river-bed sand, a stated danger from burning cut
    hair, burning blankets after the owner's death, and widow mourning restrictions
    with daily dawn lament. It then summarizes Pima political offices, named chiefs
    and predecessors, public criers, ceremony talkers, messengers, temporary war-party
    leaders, and relations with Apaches and Maricopas.
