canonical_text:
  quote: ''
  summary: The passage discusses Pima statements and terminology concerning ruined
    stone and adobe pueblos in the Gila and Salt river valleys. It notes uncertainty
    about the builders, defines Hohokam and va-aki in relation to ruins, records the
    term si'van for Hohokam chiefs, lists several ruins and associated chiefs preserved
    in myths, and includes footnote material on the 'houses of Montezuma' label and
    Casa Blanca ruins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Pimas are described as long accustomed to being questioned about the builders
    of ruined stone and adobe pueblos on mesas in the Gila and Salt river valleys.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that, although Pimas may previously have claimed relationship
    with the Hohokam or told supernatural-origin tales about the pueblos, they now
    state that they do not know about the matter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The term Hohokam is glossed as 'That which has Perished' and is said to designate
    the people who occupied the pueblos now reduced to ruins in the Salt and Gila
    river valleys.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:4
  text: A chief of the former Casa Grande pueblo is reported by earlier writers as
    called Siba; the passage says the present pronunciation is sivan and that the
    same name is given to all Hohokam chiefs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The meaning of sivan is said to be unknown to present informants.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author asks whether the similarity between sivan and names associated
    with the Zunis is coincidental.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Each ruin is called va-aki, meaning ancient house; in myths, a name is added
    to distinguish one ruin from another and si'van is added to distinguish chiefs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage lists several named places and gives associated chiefs or notes
    when a chief's name was not known to informants.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: When a single chief is referred to, he is usually called Si'van; when a full
    name is given, Si'van is always added.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A cited traveler reported that some Salt and Gila ruins were known as 'houses
    of Montezuma' and that an Indian guide said nobody knew who Montezuma was, except
    that he built the houses.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Casa Blanca is described in a note as one of the largest ruins south of the
    Gila, with adobe walls visible at mound level and two houses standing there in
    1744 according to Sedelmair.
  category: setting
  evidence_refs:
  - ev:10
