  quote: ''
  summary: The passage summarizes two narrative units. In “Children of Cloud,” twin
    boys born from Cloud’s marriage to a beautiful mat maker seek their father, meet
    Wind and Cloud, undergo weather-related tests, and are later transformed into
    mescal while avoiding Coyote. In “Skull and His Magic,” a being who is man by
    night and Skull by day marries a maiden, hunts successfully because deer die at
    his sight, and wins a football race.
