  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Players sit about ten feet apart and set the sticks in play by striking them
    from below with a flat stone held in the left hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sticks are held nearly vertical, inclined forward so that they fall between
