  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The score is kept on a rectangle marked on the ground, usually about twelve
    by eight feet, with holes or pockets along each side.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two alternate corners of the rectangle have quadrants called ki, translated
    as “houses,” and the corner holes are called ut'pa, translated as “doors.”
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Each player or side uses a marking stick called rsAika, translated as “slave”
    or “horse.”
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: When a player is “coming home” and the count carries the marker only to the
    last hole of the house, the marker is said to be “in the fire” and remains “burnt”
    until a number less than 14 or 15 is thrown.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage lists names for the rectangle’s corner, side, and house holes,
