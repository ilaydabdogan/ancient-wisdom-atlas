- id: motif:2
  label: Overpopulation and scarcity before world destruction
  taxonomy_refs: []
  basis: The first people multiply without death until food and water are scarce,
    killing and cannibalism begin, and Earth Doctor decides to destroy all.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The motive is described as pity and lack of another plan, not as explicit
    divine judgment.
- id: motif:3
  label: Cosmic marriage to produce helpers
  taxonomy_refs:
  - sacred_marriage
  basis: Earth Doctor frames earth and sky as female and male and sun and moon as
    spouses whose offspring should help him.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage reports the intention for helpers, but the expected offspring
    of earth and sky does not respond in this section.
- id: motif:4
  label: World destruction by collapse of sky followed by renewed cosmic order
  taxonomy_refs:
  - death_rebirth
  basis: Earth Doctor pulls down the sky, killing living beings, then emerges alone,
    calls forth sun and moon, recreates sky, stars, and milky way, and creates a new
    race.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage describes cosmic renewal after destruction, but not a full
    cyclic doctrine beyond this episode.
