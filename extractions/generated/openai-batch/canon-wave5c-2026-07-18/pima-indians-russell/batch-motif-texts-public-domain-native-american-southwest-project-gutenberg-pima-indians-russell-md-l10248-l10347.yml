canonical_text:
  quote: ''
  summary: Earth Doctor creates living beings and clay-made humans, then destroys
    an overpopulated first world by pulling down the sky. He reestablishes celestial
    order and creates another people. The moon gives birth to Coyote, the earth gives
    birth to Elder Brother, and Elder Brother shortens human life but later arranges
    a second destruction by flood through a miraculously reproductive young man and
    a flood-causing child. South Doctor attempts to defeat Elder Brother's plan through
    his daughter, thorns, and the handling of the young man's weapons. Earth Doctor
    warns his people of the coming flood and sings a lament.
  language: English
  quote_policy: summarized
