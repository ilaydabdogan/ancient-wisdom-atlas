canonical_text:
  quote: ''
  summary: The passage describes the first Pima school opened by Rev. C. H. Cook,
    later boarding-school changes, fire destruction of buildings, overcrowding, and
    additional day schools. It then discusses chronological records among several
    Native groups, including Delaware, Sioux, Kiowa, Iroquois, Santee Sioux, and Pima
    examples. The writer reports five Pima notched calendar sticks, dates their record
    from the season before the meteor shower of November 13, 1833, notes lost or buried
    older sticks, describes a shift by Juan Thomas from stick to pencil and paper,
    and explains that Pima years begin with the saguaro harvest season, comparable
    to Lower California year-counting by pitahayas.
  language: English
  quote_policy: summarized
