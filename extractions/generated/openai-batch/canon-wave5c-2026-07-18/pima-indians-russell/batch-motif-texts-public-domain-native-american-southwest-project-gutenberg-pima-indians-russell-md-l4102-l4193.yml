- id: obs:1
  text: Watermelons are preserved by burial in river-bed sand until after January
    1; pumpkins, squashes, and muskmelons are cut into strips, dried, and some are
    kept in storehouses until midwinter.
  category: action
  evidence_refs:
  - ev:1
