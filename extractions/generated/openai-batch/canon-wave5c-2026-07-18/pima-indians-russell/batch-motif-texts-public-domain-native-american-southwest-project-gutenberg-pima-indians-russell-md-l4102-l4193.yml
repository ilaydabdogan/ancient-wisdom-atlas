- id: obs:3
  text: The Papagos have a tradition that the cultivated gourd was introduced by Navitco,
    described as a deity honored by ceremonies at Santa Rosa at eight-year intervals,
    or four-year intervals if crops are bountiful.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Gourds are used as canteens, dippers, and especially rattles; cracked gourd
    canteens may be made watertight again by stretching rabbit skin over them, and
    rattles contain gravel and are mounted on handles.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that gourds are never used as forms for molding pottery.
  category: attribute
  evidence_refs:
