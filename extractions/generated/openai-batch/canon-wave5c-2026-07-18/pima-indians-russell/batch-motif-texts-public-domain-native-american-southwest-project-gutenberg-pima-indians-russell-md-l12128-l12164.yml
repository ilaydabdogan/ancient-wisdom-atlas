canonical_text:
  quote: ''
  summary: In the tale titled “Coyote and the Quails,” quails cut fat meat from a
    sleeping Coyote, cook it, and feed it to him. After they tell him he has eaten
    his own meat, he realizes his loss and pursues them. The quails flee into a hole
    after inserting a feather-covered cholla cactus branch. Coyote releases the quails
    one by one after questioning them, then mistakes the cactus branch for the guilty
    quail, bites it hard, and dies.
