    brother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Coyote instructed the two brothers to fetch logs, embark upon the sea, and
    seek land beyond it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Yellow Coyote traveled behind Sandy Coyote with his eyes closed; after opening
