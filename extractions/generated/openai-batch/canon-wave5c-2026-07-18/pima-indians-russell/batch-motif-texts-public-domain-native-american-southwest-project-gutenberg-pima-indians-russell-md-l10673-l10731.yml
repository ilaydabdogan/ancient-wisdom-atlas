canonical_text:
  quote: ''
  summary: The passage recounts blame for the first loss of life, the problem of disposing
    of Rabbit's body because of feared Coyote interference, the sending of Coyote
    away to obtain fire from Sun, Blue Fly's making of the first fire drill, the burning
    of the corpse, Coyote's return and seizure of the heart from the burning body,
    and place-name explanations involving the heart's ashes and grease. A note in
    the passage gives a similar Mohave account involving Matyavela, Mustam-ho, Blue
    Fly, Coyote, a funeral ring, and the seizure of a heart.
  language: English
  quote_policy: summarized
