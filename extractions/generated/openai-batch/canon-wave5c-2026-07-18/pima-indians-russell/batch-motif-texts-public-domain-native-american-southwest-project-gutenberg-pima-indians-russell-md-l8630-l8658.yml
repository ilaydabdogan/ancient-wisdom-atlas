canonical_text:
  quote: ''
  summary: The passage describes a cup-shaped lava stone found by a Pima person in
    Gila Valley ruins west of Casa Grande and notes Doctor Fewkes's comparison of
    it to wooden cups used by the Ilopis in a shell-game-like game. It also describes
    porous lava rings found around ruins, explains that they have been called head
    rings because they resemble Pima head rings, but argues that their size and material
    make head-ring use unlikely and that they were probably used in an unknown game.
    Captions and measurements for the cup stone and ring stone are included.
