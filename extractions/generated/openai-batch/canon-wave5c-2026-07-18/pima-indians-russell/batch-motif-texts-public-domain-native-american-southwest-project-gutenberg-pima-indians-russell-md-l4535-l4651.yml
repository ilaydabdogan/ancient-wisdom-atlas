canonical_text:
  quote: ''
  summary: 'The passage describes Pima and neighboring material culture: stone mortars
    and rock mortar cavities, a boulder with a mortar cavity regarded reverently,
    wooden pestles, bread trays, doughnut forks, ladles, pottery paddles, and multipurpose
    arrowbush rod objects used as doors, shelves, and bird traps. It also notes acquisition
    or transmission of some implements from Papagos and Mexicans, and the Pimas''
    amusement at the collector''s purchase of household objects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two or three rounded stone mortars were seen; they had been obtained from
    ruins and were little used.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Double buttes there are mortar cavities in solid rock ledges, and one mortar
    cavity in a large boulder is described as being regarded with superstitious reverence.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports that mortars in solid stone occur in multiple Arizona
    locations and that mortars are used for grinding seeds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A large wooden pestle, described as a mesquite club with a rounded head, is
    used for pounding mesquite beans in a mortar.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bread trays made chiefly of mesquite, rarely cottonwood, are described as
    prized household utensils used for mixing bread and other purposes; smaller trays
    and plates are sometimes obtained from the Papagos.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: A slender sharpened rod of arrowwood is used as a fork for removing doughnuts
    from fat.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'Ladles are said to be a recent introduction: the Pimas obtained them from
    the Papagos, and the Papagos are said to have derived the art of making them from
    the Mexicans.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The ladles are commonly made of mesquite, while Papago ladles are made of
    paloverde wood; their bowls are shaped as flattened cones because that form is
    easier to make with a straight-bladed knife.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: A cottonwood pottery paddle is used to shape the outer surface of pottery
    vessels; it is hollowed to fit a convex surface and is now often made from a barrel
    stave.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: A class of arrowbush rod objects is used variously as doors, hanging shelves,
    and bird traps.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: When used as bird traps, these objects are tilted, supported by a stick attached
    to a cord, baited with wheat, and dropped when the cord is jerked.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The owners of one object used as a door were astonished and amused that a
