canonical_text:
  quote: ''
  summary: The passage describes funeral practices in which water and pinole are placed
    on the grave for the soul in the other world, the deceased is verbally directed
    to the East and told not to return, ghosts are feared as beings who may take sleepers
    to the land of shades, property and dwellings of the dead may be burned or placed
    at the grave, names of the dead are avoided, a pauper's soul may wander until
    an offering is placed, and some medicine-man paraphernalia may be cached in an
    olla in the hills.
  language: English
  quote_policy: summarized
