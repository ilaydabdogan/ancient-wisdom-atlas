canonical_text:
  quote: ''
  summary: 'The passage tells of two grandchildren who disobey their grandmother,
    run away, and become the saguaro and palo verde, causing the grandmother''s death
    when she embraces the cactus. It then gives an abstract of a creation myth: Earth
    Doctor creates the world and living beings, destroys an overpopulated world by
    lowering the sky, makes a new creation, and later a flood caused by an abandoned
    child''s tears overwhelms the earth. Several beings survive by different means.
    After the flood, Elder Brother rules, a new creation occurs at the middle of the
    land, first death enters through a rattlesnake bite, Coyote is involved in theft
    and release of animals, monsters are defeated, and Elder Brother repeatedly dies,
    revives, descends to the underworld, and leads survivors above.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman prepares porridge for two grandchildren and warns them not to
    fight near an olla of water on an outdoor fire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grandchildren quarrel, spill the water, are whipped by the grandmother,
    become angry, and run away while she follows them by their whistling.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The older boy says he will become a saguaro that lasts forever and bears fruit
    each summer; the younger says he will become a palo verde and make bare rocky
    mountains green.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman recognizes the cactus by its whistling, tries to embrace it,
    and is killed by its thorns.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator presents the events as the origin of the saguaro and palo verde.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Earth Doctor develops out of primeval darkness and creates the creosote bush,
    ants, termites, the sky, and a gray spider that spins a web between earth and
    sky.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Earth Doctor makes the sun, moon, stars, large stars, and Milky Way from ice,
    water spray, magic crystal, and an ash-dipped walking stick.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Earth Doctor creates living things and human beings from clay images; when
    the earth becomes overpopulated because death does not yet exist, he pulls the
    sky down to crush everything and then makes a new creation after passing through
    a hole.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Elder Brother arises as a rival to Earth Doctor, and an abandoned child's
    tears cause a flood that overwhelms the earth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the flood, Elder Brother survives in an olla, Coyote on a log, a father
    and child by becoming birds, Earth Doctor by hiding in his staff, and some people
    by entering a hole in the earth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the flood, Elder Brother rules with Earth Doctor and Coyote as subordinates,
