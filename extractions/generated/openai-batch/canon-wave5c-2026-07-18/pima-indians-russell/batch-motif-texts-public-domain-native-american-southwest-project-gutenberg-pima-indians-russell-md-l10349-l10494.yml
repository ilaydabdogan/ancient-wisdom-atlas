canonical_text:
  quote: ''
  summary: A flood is announced as overwhelming the land and mountains. Survival is
    attempted through a hole made through the earth, a log, a sealed olla, transformation
    into birds, floating nests of down, and refuge on the Crooked mountain. South
    Doctor and Earth Doctor direct some people, while Elder Brother and Coyote use
    other means. A bird taboo is connected to the possible return of the flood. South
    Doctor's power is exhausted, a dog reports the water level, and people are turned
    to stone.
  language: English
  quote_policy: summarized
