  evidence_refs:
  - ev:4
- id: obs:11
  text: South Doctor announces that a flood is coming to destroy the earth and all
    things on it, and some people are saved by the hole made with his cane.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Earth Doctor tells late-arriving people that he has already sent those he
