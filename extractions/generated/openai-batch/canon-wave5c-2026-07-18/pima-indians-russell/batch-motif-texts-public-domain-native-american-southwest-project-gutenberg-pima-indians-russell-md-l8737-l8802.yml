canonical_text:
  quote: ''
  summary: 'The passage describes Pima marriage customs: spouse selection, proxy wooing,
    residence changes after marriage, a bride''s wheat-grinding task at the groom''s
    parents'' home, gifts to the bride, rare unmarried persons, a lethal hair-burying
    superstition involving a medicine-man, polygamy, residence arrangements, widow
    remarriage to a deceased wife''s sister, and marriage prohibitions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In most cases the girl chooses the spouse and seeks to avoid a lazy man; male
    and female physical preferences are described in general terms.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says unmarried women can be distinguished from married women by
    better-kept hair, but not by a special hairstyle like that said to be in use among
    the Hopis.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A suitor visits the chosen bride's home with a young married friend who speaks
    for him while he remains in the background.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After several nights of proxy wooing, if the suit is favored, the youth remains
    and is accepted as husband without further ceremony.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The newly married couple stay four days at the bride's home and then go to
    the home of the groom's parents.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At dawn after the couple arrive at the groom's parents' home, the mother-in-law
    gives the bride a large basket of wheat to grind on the metate by sunrise.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the bride runs away leaving part of the wheat unground, it is treated as
    a sign that she will not be a very good wife.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The groom gives the bride a new blanket, and his parents give her presents;
    the passage states that these gifts are not bride purchase and that no gifts are
    made to the bride's parents.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: A man may remain unmarried because no woman will marry him, and women more
    rarely remain unmarried.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: An unmarried woman at Blackwater is said to be regarded as possessing supernatural
    powers because of her spinsterhood.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A rejected suitor may seek help from a medicine-man; if the suitor steals
    a hair from the girl and the medicine-man buries it, the girl is said to die.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says disappointed hopes in love have been known to lead to suicide.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Polygamy is described as practiced to some extent, usually with no more than
    two or three wives, though one chief's son is said to have had six.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Plural wives live in separate houses, and the husband spends most of his time
    with the first wife.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: When a youth marries, he brings his wife to his parents' home if there is
    room; otherwise, a house is built nearby and the families eat together.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:16
  text: A widower is customarily expected to wed the sister of his deceased wife.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: Uncles and nieces are not permitted to marry; cousins do not marry out of
    respect for the parents; the passage reports no discovered marriage-prohibited
    groups within the tribe.
  category: relationship
  evidence_refs:
  - ev:10
