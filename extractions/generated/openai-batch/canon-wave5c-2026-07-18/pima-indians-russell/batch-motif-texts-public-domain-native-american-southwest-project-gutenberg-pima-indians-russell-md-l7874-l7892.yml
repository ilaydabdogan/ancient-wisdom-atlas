canonical_text:
  quote: ''
  summary: The passage describes Pima musical instruments. Flutes have three finger
    holes, a limited range, and low plaintive notes. They are usually decorated with
    geometric designs said to have no current symbolic significance among the Pimas,
    and may have cloth or ribbon attached. A shallow household basket can be turned
    upside down and used as a drum, beaten by hand or with a stick to accompany certain
    songs.
