canonical_text:
  quote: ''
  summary: The passage recounts Vulture's magical display and ascent by light to the
    sun, the solar heating and death of Elder Brother, Elder Brother's later revival
    and descent through the earth, the recruitment and partial emergence of people
    from below or the far side of the earth, Coyote's interruption of that emergence,
    and a subsequent campaign against named pueblos and chiefs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a closed house during daytime, Vulture brings heavy darkness, a beam grows
    as bright as sunlight, four colored threads of light reach the sun, and Vulture
    ascends each thread before remaining at the sun on the fourth night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vulture tells the sun to act against Elder Brother's house, four pools of
    water, and dwelling places; heat falls on Elder Brother, fountains become boiling
    water, and Elder Brother is suffocated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Elder Brother's death and long-exposed skeleton, boys hear a thunder-like
    noise without clouds and see Elder Brother regaining life and power; armed people
    surround him, and he sinks into the earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Elder Brother reaches people beyond or beneath the earth whom Earth Doctor
    had helped escape the flood, tells them of his treatment, and asks them to fight
    with him and take the land.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Gopher is instructed to bore a hole for the people, and makes a hole through
    the earth like a winding stair.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Coyote discovers the people emerging like ants, ignores Elder Brother's warning
    not to go near until all have come out, looks down the hole and laughs, causing
    the opening to close after five gentes emerge.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The emerging people sing and dance with rattles and feathered headdresses,
    and the song says the land and mountains tremble with their dancing and singing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: About half of the emerged people follow Elder Brother, kill his enemies, and
    capture young and old who do not resist.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Elder Brother's forces attack large pueblos in the Gila and Salt River valleys,
    including Casa Grande, Santan, Sweetwater, and Casa Blanca, defeating named chiefs
    or their forces.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
