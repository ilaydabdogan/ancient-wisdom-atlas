canonical_text:
  quote: ''
  summary: 'Ethnographic description of Pima pottery manufacture by coiling: clay
    is dried, sifted, mixed with water, kneaded, ripened, molded over an old vessel,
    coiled, paddled, smoothed, slipped with red shale, fired with wood, and decorated
    with black mesquite pigment. The passage then lists finished products, including
    water-cooling ollas, cooking pots, bean pots, and former pottery canteens.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pima fictile ware is described as made by coiling after clay is dried, sifted,
    mixed with water, kneaded, and left overnight to ripen.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The base of a new vessel is formed over the bottom of an old vessel and dried
    in the sun before the coiling process begins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The potter moistens the vessel edge, rolls clay into cylinders, lays them
    on the margin, and shapes the vessel with an outside paddle and inside circular
    stone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A potter may model three or four vessels at the same time so that one can
    dry while work continues on another.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lower coils are smoothed with a polishing stone, and water is applied to hard
    spots that have dried too much.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A dark red shale is ground in water, applied as a slip to the outer surface,
    and rubbed with a polishing stone until hard and smooth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The vessel is fired in a shallow pit after the earth is dried by fire; dry
    mesquite or decayed willow wood is placed beneath and around the vessel.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: If decorated, the vessel receives black mesquite pigment applied with a sharpened
    Baccharis glutenosa stick and is heated again until the decoration turns deep
    black.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Water reservoirs or coolers, called ollas in this context, are described as
    large porous round-bottomed pots that cool water by evaporation and are found
    at Pima homes.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Cooking pots are numerous, often retained even when broken for parching wheat
    or corn over the fire, and are undecorated and not carefully polished.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Bean pots are made with handles and are described as a distinct type; canteens
    were formerly made of pottery.
  category: object
  evidence_refs:
  - ev:10
