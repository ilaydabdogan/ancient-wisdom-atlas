canonical_text:
  quote: one large rain drop fell upon her; immediately twin boys were born
  summary: A woman who refuses human suitors gives birth to twin boys after Cloud
    passes above her and a large rain drop falls on her. The twins seek their father,
    are tested by Cloud, demonstrate lightning powers and survive a rain-flooded house.
    On their return westward they avoid several beings, are blocked by Coyote, and
    are finally transformed on a mountain trail into giant mescal, explaining mescal
    growth on mountains and rain connected with gathering it.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The story is set when the Hohokam lived on the Gila and farmed around the
    Great Temple called Casa Grande.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: An unnamed woman refuses the attentions of the young men, while Cloud comes
    from the east, sees her, and determines to marry her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: While the woman sleeps from fatigue at mat making, Cloud passes above and
    one large rain drop falls on her; twin boys are then born.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The men of the pueblo claim fatherhood, but in a council-circle test the babies
    do not climb onto any of them, and the woman rejects their claims.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boys ask their mother who their father is, and she identifies the white
    Cloud standing vertically in the east as their father.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mother tells the boys they may visit their father if they travel without
    stopping; she says they will first reach Wind, their father's elder brother.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boys travel four days to Wind, are sent to Cloud, and are turned away
    four times before Cloud acknowledges them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Cloud asks the boys to show they are his children; the younger sends chain
    lightning with a noisy peal, and the older sends heat lightning with distant tones.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Cloud places the boys in a house where rainwater had drowned others, but the
    boys remain unharmed and demonstrate power to survive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the boys want to return to their mother, Cloud gives them a different
    kind of bow and arrows, says he will watch over them, and warns them not to speak
    to anyone on the way.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the westward journey the boys avoid Raven, Roadrunner, Hawk, and Eagle;
    Eagle swoops over them to scare them and then says he only meant to tease them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Coyote prevents the boys from avoiding him by running around and standing
    in their way.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Cloud sends thunder and lightning, and the boys add bolts by their own magic
    power until Coyote flees.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: On a mountain top near Tucson, one boy stands on each side of the trail and
    both are transformed into the largest mescal ever known.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The story explains that mescal grows on mountains, that thunder and lightning
    go from place to place, and that rain falls when people gather mescal.
  category: other
  evidence_refs:
  - ev:8
