  summary: A sequence of Pima calendar entries for roughly 1893-1900 records deaths,
    epidemics, alcohol-related violence, dances, horse and relay races, church and
    school construction, railroads, barbed wire, weather, crop failure, lunar eclipse,
    lightning strikes, and rattlesnake bites at places including Blackwater, Gila
    Crossing, Salt River, Sacaton, Phoenix, and Maricopa.
  language: English
