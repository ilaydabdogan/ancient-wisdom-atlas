canonical_text:
  quote: ''
  summary: Two short tales are supplied. In the first, an old woman and her grandson
    survive an Apache attack; the boy disobeys her warning, is swallowed by a dangerous
    beast, kills it from inside with sharp stones, and thereby allows them access
    to berries. In the second, a quail and her many children search for water, drink
    muddy water found under a mesquite tree, become sick, and die.
  language: English
  quote_policy: summarized
