  quote: ''
  summary: Ethnographic description of Pima grain and supply storage baskets, including
    two main basket/bin types, their materials, construction methods, seasonal timing,
    use locations, and comparative notes about kiahá net distribution and archaeological
    basket remains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Large baskets for storing grain and other supplies are described as widespread
    in America and highly useful to the Pimas, who raised corn and later wheat.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Two storage types are identified: a circular arrow-bush bin covered with
    bushes and earth, and a globular coiled wheat-straw basket.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The kiahá net is described as worked in a buttonhole or half-hitch stitch,
    with its northern extension among the Piman stock and no occurrence in Pueblo
    tribal collections according to the cited museum evidence.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The same note states that the kiahá net occurs south of the Piman area in
    Central America and Latin South America as far as Tierra del Fuego.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: An old woman's kiahá and its helping stick are described with detailed measurements.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The arrow-bush bin has a willow-branch bottom and sides made by twisting rolls
    of arrow bush, with the butts thrust into the coil beneath to bind the structure.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Arrow-bush bins are used for storing mesquite beans on house or shed tops,
    and they may also be built on the ground in fenced groups to protect them from
    stock.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Arrow-bush bins are made before harvest begins, and a large bin can be built
    in about half a day because the coils are large and close work is not required.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Straw baskets have coils fastened with narrow willow-bark strips, with stitches
    through the upper margin of the last coil; their stated heights range from about
    one-half to one and one-half meters.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Straw baskets are covered with a circular disk of the same material or, more
    often, with a section of the bottom of an old worn-out basket.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: In making straw baskets, two rolls are carried around at once; they take longer
    to make than arrow-bush bins and are made after harvest when straw is available.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The writer reports finding remains of a basket of this type in cliff-houses
    south of the Salt River opposite the mouth of the Tonto.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage says those remains might suggest relationship with Pueblo cliff-dwellers,
    but qualifies this by noting possible later occupation and the prevalence of similar
    bins and arbors among southern California tribes.
  category: relationship
  evidence_refs:
  - ev:7
