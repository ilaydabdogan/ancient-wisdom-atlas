canonical_text:
  quote: ''
  summary: The passage recounts linked narratives in which Puma and Wolf summon Coyote,
    Coyote deceives a woman, magicians retaliate by imprisoning useful game animals
    in a mountain cave, and Coyote later opens the cave and releases the animals before
    fleeing west into water. It then describes Feather-breathing Sivan learning bow-making
    from the Cave of Winds, mishandling hunting instructions, later demonstrating
    magic hunting power, and creating magically marked gambling sticks for Vantre
    until Elder Brother begins a countermeasure involving bird feathers and pinole.
  language: English with brief Latin phrase
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tribes of men begin learning how to gather food, hunt, and till the soil.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Puma and Wolf hunt together, and Wolf summons Coyote by roasting a deer kidney
    so that its odor is carried south by the wind.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Coyote returns in distress because food falls from his body until Puma and
    Wolf stitch his skin so that it retains food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Coyote finds a woman who becomes Puma's wife, then pretends to be in pain
    and tells her to remove their clothing and carry him on her back as a cure.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says Coyote was able to copulate with the woman and treated her
    shamefully while they were going home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Because the woman belonged to a group with great magic power and Puma refused
    to restore her, the Rsarsdkatc A-tltam magicians drove deer, antelope, and other
    useful swift, soft-furred animals into a cave in Yellow Mountain.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The hiding of the animals deprived the human tribes of their chief support,
    and messengers failed year after year to liberate them.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:8
  text: Coyote is sent to the cave, receives meat from the cave inhabitants, roasts
    it in the fire, sees the cave gate, runs to the door, and opens it.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: When Coyote opens the cave door, deer and other game animals pour out; Coyote
    flees from pursuit and goes to live in the water in the west.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: As a boy, Feather-breathing Sivan goes to the Cave of the Winds, sees a bow,
    makes similar bows, and finds their power removed when other people handle or
    look at them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Feather-breathing Sivan fails to shoot deer when placed at a gap and later
    in a tree above a trail; instead he builds a brush fence at the gap.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: When instructed to shoot pregnant animals and then an old one, Feather-breathing
    Sivan shoots a pregnant woman and an old man.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Feather-breathing Sivan later shows magic power by bringing in deer quickly,
    builds a house called Va'-aki, marries, and settles down.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Vantre, described as a thief, gambler, liar, and profligate, visits Feather-breathing
    Sivan with four tobacco-filled reeds; Sivan does not speak to him for three nights.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: On the fourth night, Feather-breathing Sivan offers friendship if Vantre stops
    wrongdoing and makes marked sticks called kites whose magic power lets Vantre
    win at gambling.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: Elder Brother recognizes the power in the gambling sticks and begins arranging
    a countermeasure involving a man's son and daughter, large bird feathers, and
    pinole.
  category: sequence
  evidence_refs:
  - ev:14
  - ev:15
