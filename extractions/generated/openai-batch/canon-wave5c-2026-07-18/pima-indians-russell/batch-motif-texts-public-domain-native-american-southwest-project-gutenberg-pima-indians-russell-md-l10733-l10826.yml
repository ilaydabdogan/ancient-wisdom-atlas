- id: ev:8
  type: summary
  locator: 10787-10794
  quote_or_summary: Feather-breathing Sivan is mischievous as a boy, troubles his
    grandmother, goes to the Cave of the Winds, sees a bow, makes bows, and finds
    their power spoiled by others handling or looking at them; later he can kill rabbits
    and give them away.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Source path indicates public-domain Project Gutenberg material; rights_status
