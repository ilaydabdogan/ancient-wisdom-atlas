candidate_motifs:
- id: motif:1
  label: summoning an absent figure by roasted food scent
  taxonomy_refs: []
  basis: Wolf roasts a deer kidney so that its odor is carried by the wind toward
    Coyote, who recognizes the summons from his brothers and returns.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage presents this as an action within the story; no broader motif
    family is named in the passage.
- id: motif:2
  label: trickster deception causing wider social and ecological consequence
  taxonomy_refs:
  - trickster_boundary
  basis: Coyote deceives and mistreats the woman, after which her magically powerful
    people retaliate by hiding the useful animals in a mountain cave.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The label 'trickster' is a candidate classification based on Coyote's
    actions; the passage itself does not use that term.
- id: motif:3
  label: useful animals confined in a mountain cave and released by a boundary-breaking
    figure
  taxonomy_refs:
  - culture_hero
  - sacred_theft
  - trickster_boundary
  basis: Game animals useful to humans are imprisoned in Yellow Mountain; Coyote opens
    the cave door and releases them, restoring access to game.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: medium
  cautions: The animals are not explicitly called sacred, and Coyote's release is
    not described as theft, so the 'sacred_theft' taxonomy reference is tentative.
- id: motif:4
  label: power of a weapon lost through touch or gaze
  taxonomy_refs:
  - forbidden_knowledge
  basis: Feather-breathing Sivan's bows lose their power when other people handle
    or look at them.
  evidence_refs:
  - ev:8
  confidence: low
  cautions: The passage says power is removed by contact or looking but does not explicitly
    frame the knowledge or object as forbidden.
- id: motif:5
  label: literal or mistaken fulfillment of hunting instructions harms humans
  taxonomy_refs: []
  basis: Feather-breathing Sivan is instructed to shoot pregnant animals and an old
    antlered deer, but instead shoots a pregnant woman and an old man.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage does not explain whether the acts are misunderstanding, deliberate
    transgression, or comic violence.
- id: motif:6
  label: magic markings on gambling implements confer unbeatable success
  taxonomy_refs: []
  basis: Feather-breathing Sivan places magic power in the markings of sticks called
    kites so that no one can win from Vantre, until Elder Brother recognizes the power
    and starts a countermeasure.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  confidence: high
  cautions: No supplied taxonomy family directly matches this gambling-object episode.
