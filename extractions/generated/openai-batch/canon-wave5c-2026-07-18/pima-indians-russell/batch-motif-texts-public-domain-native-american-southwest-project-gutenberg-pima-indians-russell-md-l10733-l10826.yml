- id: ev:9
  type: summary
  locator: 10795-10802
  quote_or_summary: The people tell Feather-breathing Sivan to stand at two hills
    and close a gap; he builds a brush fence instead of shooting deer. They then tell
    him to perch in a tree over a game trail, but he does not shoot the passing game.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
