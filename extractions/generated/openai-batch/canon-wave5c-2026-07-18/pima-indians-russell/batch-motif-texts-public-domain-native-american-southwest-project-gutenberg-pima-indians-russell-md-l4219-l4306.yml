canonical_text:
  quote: ''
  summary: The passage describes barter relations among Pimas, Maricopas, Papagos,
    Yumas, Mohaves, Spanish/Mexican settlements, American traders, and reservation
    stores. It lists goods exchanged and gives a detailed account of Papago journeys
    to salt lakes below the Mexican boundary, including ritual conduct, circling salt
    deposits four times, collection of sacred salt, restrictions after return, and
    later use or trade of the salt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Maricopas formerly came at harvest time to trade with the Pimas and later
    settled beside them, making barter between them comparable to barter between Pima
    villages.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Papagos are described as a desert people who traded numerous vegetable,
    animal, and mineral products with the Pimas at the June harvest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Papago trade goods included saguaro products, cactus and agave products, plant
    seeds, baskets, mats, fibers, meats, tallow, buckskins, cheese, human hair cords,
    ochers, and weaving pigment.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Papagos made religious pilgrimages to salt lakes below the Mexican boundary
    to obtain sacred salt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the salt journey, the travelers lived on pinole and walked with their
    eyes fixed on the trail, looking neither right nor left.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Near the lagoon shore where the Great Spirit was said to reside, the salt
    gatherers ran at top speed and circled four times around the salt deposits before
    ritual specialists collected the salt.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The salt was treated as possessing magic power on the homeward journey; if
    a horse died, the whole load was discarded.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Returning salt gatherers were noisily welcomed but had to remain outside the
    home village for four days, while those at home sang for them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After four days, all could eat the salt and the salt could be brought to the
    Pimas.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In exchange for barter objects, the Pimas gave agricultural products, cotton
    goods, basket-making materials, and other items.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage also mentions later trade in colored earths and salt with Yumas
    and Mohaves, armed Pima trade expeditions to Sonora, Spanish and Mexican trading
    parties, American traders, and reservation stores.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Some Pimas are described as attempting to gain advantage over traders by offering
    damp wheat, placing sand in wheat sacks, or concealing inferior wheat beneath
    better wheat.
  category: action
  evidence_refs:
  - ev:8
