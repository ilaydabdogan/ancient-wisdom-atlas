canonical_text:
  quote: ''
  summary: The passage describes Pima coiled basket-making techniques, basket-bowl
    forms, common decorative designs, reported copying of patterns from Hohokam pottery,
    and plate descriptions of fret, cross, whorl, and combined designs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ordinary baskets are made by coiling, with a center of devil's-claw material
    and a foundation formed from split cat-tail stalks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Willow and devil's-claw splints are kept in water during use to make them
    flexible.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Splints are held in the teeth while scraped and trimmed with a knife, and
    the evenness of the finished basket depends partly on this operation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Basket margins were formerly wrapped smoothly, but are now usually given a
    braided appearance by passing a devil's-claw splint over the margin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After weaving, projecting splint ends are cut or broken off, and stains are
    rubbed away with saltbush leaves and twigs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Basket bowls range from flat disks to rounded-bottom bowls up to 20 cm deep.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Basket makers say they do not know the meaning of design elements and state
    that old women copied the patterns long ago from Hohokam pottery.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'Three common basket designs are identified: fret, equal-armed cross, and
    spiral; other designs are described as modifications of these.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says the fret was probably considered by the Pimas to be the oldest
    motive and that it leads almost directly into swastika and suavastika patterns
    in the illustrations.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A flower design based on the cross is compared with decoration on Hohokam
    water jars and with present-day Pima and Papago vessels.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The cross-based flower design includes four black radiating arms, petal-like
    areas, and encircling lines that follow the arms around the basket.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The volute or whorl is described as common in primitive art and especially
    frequent in Southwestern basketry.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Terrace-like enlargements occur in whorl lines and are combined with many
    other basket design elements.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Pima basket decoration is mostly black on a white ground; brown or other colors
    are rare.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: Some baskets have blue glass beads fastened at equal intervals on the border,
    and rare work or trinket baskets have open spaces in their sides.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: Plate descriptions identify examples of fret designs, a nearly swastika-like
    effect, an equal-armed cross, whorl lines, and a basket combining fret and whorl.
  category: sequence
  evidence_refs:
  - ev:9
