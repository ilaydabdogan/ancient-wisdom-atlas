canonical_text:
  quote: ''
  summary: 'The passage records Pima calendar events involving Apache, Yuma, Mohave,
    Maricopa, Papago, and related groups: raids, ambushes, attacks on gathering parties,
    thefts of corn and horses, counterattacks, casualties, a plague called black vomit,
    suspicion of medicine-men, concealment of women in a cave, captivity and rescue
    of two girls, a horseback escape, and a year with no calendar record.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman gathering cactus fruit with her daughter and guarded by her husband
    saw an Apache; she sent her daughter to warn the village men, who found no trace
    of the enemy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Apaches killed many Pimas at night near mescal pits in the mountains; one
    survivor escaped to tell the Kwahadk's, who followed the trail but did not overtake
    the attackers and buried the dead.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A large force of Yumas advanced against the Pimas and Maricopas; Maricopas
    fought them while women moved away, and two Maricopa warriors were killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yumas and Mohaves attacked a Maricopa village the next year; the fight was
    undecided, the attackers retreated, and one Pima plus several Maricopas were killed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A plague called black vomit swept through the tribes, killed several people
    daily, led to suspicion against medicine-men, and resulted in four medicine-men
    being killed while the surviving medicine-men guarded camps against the plague.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: During a winter with ice on the water and snow on the lowlands, Apaches came
    to Rstotlk, where one marauder was killed.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Apaches accompanied by the Pas)^i4 attacked the Papagos at Kihotoak with drums
    and coyote-like cries; the Papagos hid their women in a cave and fought outside,
    but all the Papagos fell because the attackers had firearms.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Apaches encamped on Mo'hattlk mountain came to steal corn from fields at Gila
    Crossing; three Pimas waited for the thieves, killed one, and the other escaped.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Pimas made night attacks against Apaches; several Apaches were killed, one
    Pima was killed, and one wounded Pima died after returning home.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Apaches waylaid Pimas returning from a mescal-gathering expedition; nearly
    all were killed, two girls were made prisoners, and the girls were rescued after
    the Apaches were pursued and most were killed.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Three Apaches traveling near the Gila River and Table mountain were tracked
    and killed by a Pima party; later K&'m^l tk^k's brother and another Pima were
    killed in a Santan hills ambush in which many Pimas were wounded.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Pima Kwakrs&n escaped enemies clinging to him and his horse by spurring
    the horse so that it reared and threw the man holding its head.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Apaches came by moonlight to steal horses, left their mounts in brush, were
    discovered, and were pursued to the river, where all were killed in a running
    fight.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: In 1847-48 Apaches ambushed deer hunters at a spring and shot two before they
    reached cover; in another attack at Santan, four Pimas were killed and five Apaches
    were killed during pursuit.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: The passage states that neither calendar stick has a record for 1848-49.
  category: other
  evidence_refs:
  - ev:15
