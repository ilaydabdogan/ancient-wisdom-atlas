candidate_motifs:
- id: motif:1
  label: resource-gathering party attacked
  taxonomy_refs: []
  basis: Several violent encounters occur while people gather cactus fruit, mescal,
    or deer, often away from the village in fields, mountains, or at a spring.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:10
  - ev:14
  confidence: high
  cautions: This is a repeated historical-calendar pattern, not necessarily a mythological
    motif.
- id: motif:2
  label: child or sole survivor gives warning
  taxonomy_refs: []
  basis: A daughter is sent to alert the village, and one survivor escapes a massacre
    to tell the Kwahadk's.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The two examples differ in age and circumstance; the linkage is functional
    rather than formulaic.
- id: motif:3
  label: women moved away or hidden during attack
  taxonomy_refs: []
  basis: Women are moved out of danger during the Yuma advance, and Papago women are
    concealed in a cave during the Kihotoak attack.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: The passage presents these as defensive actions in warfare, without explicit
    ritual or symbolic explanation.
- id: motif:4
  label: captivity and rescue of girls
  taxonomy_refs: []
  basis: Two girls are taken prisoner after an Apache ambush and then rescued by a
    pursuing party from the villages.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: Single clear episode; no broader comparative claim is made by the passage.
- id: motif:5
  label: epidemic suspicion of medicine specialists
  taxonomy_refs: []
  basis: During the black-vomit plague, medicine-men not in good repute came under
    suspicion; four were killed and survivors guarded camps against the plague.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage records social response to disease; it does not explain the
    beliefs behind the suspicion.
- id: motif:6
  label: night raid and counterattack
  taxonomy_refs: []
  basis: The passage includes a night massacre at mescal pits, Pima night attacks
    against Apaches, and a moonlight horse-theft attempt ending in pursuit.
  evidence_refs:
  - ev:2
  - ev:9
  - ev:13
  confidence: high
  cautions: This is a recurrent conflict pattern in the calendar account rather than
    a narrated mythic episode.
- id: motif:7
  label: horse-assisted escape from encirclement
  taxonomy_refs: []
  basis: Kwakrs&n escapes enemies who cling to him and his horse by spurring the horse
    to rear and throw one attacker.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: Vivid but single episode; no explicit symbolic meaning is supplied.
- id: motif:8
  label: theft punished by ambush or pursuit
  taxonomy_refs: []
  basis: Apache attempts to steal corn and horses are discovered and met with ambush
    or pursuit ending in deaths.
  evidence_refs:
  - ev:8
  - ev:13
  confidence: medium
  cautions: Although theft is explicit, the passage does not mark the stolen goods
    as sacred; no sacred-theft taxonomy reference is assigned.
