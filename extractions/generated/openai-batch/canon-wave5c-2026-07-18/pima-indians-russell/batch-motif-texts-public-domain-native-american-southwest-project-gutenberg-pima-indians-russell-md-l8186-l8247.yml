canonical_text:
  quote: ''
  summary: Ethnographic passage describing relay race tracks in Arizona, Pima village-to-village
    relay race procedure, preparation with bird songs and dancing, runner organization,
    race calls and markers, race resolution, vocal encouragement, and the absence
    of a closing feast. The passage also contains an interleaved figure caption for
    kicking balls made of stone, one covered with gum and one without.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer reports ancient race tracks near ruins in Arizona, including examples
    near the Babacomari and in the Sonoita valley, with stated widths and lengths.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described tracks are leveled, cleared of boulders, and one Sonoita-valley
    example has a square stone standing at its northern end.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage identifies the Sobaipuris as a tribe of Piman stock and says the
    example tracks served as tracks used by them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: When one village wished to race another, it sent a messenger to announce that
    in four or five days, according to council decision, it wished to test fortunes
    in a relay race.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Race preparation included singing bluebird or hummingbird songs, dancing,
    and young men practicing by running in groups of four or five.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Each village had about 40 or 50 runners; the swiftest was recognized as leader
    and ran first, and runners could run more than once if endurance allowed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: For the final race, each village placed half its runners at each end of the
    track; a crier called for leaders, and a starter gave the start signal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Markers stood beside the track with willow sticks bearing rags to mark the
    positions of opposing sides.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A race could end when one side admitted exhaustion, or when one side was so
    far ahead that its runner met the other runner at the center where the markers
    also met.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Women encouraged their friends with coordinated shouts from the throat ending
    in a tongue trill; after the race, the winning village shouted continuously for
    a time.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the close, visitors went home and there was no accompanying feast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: An interleaved figure caption identifies kicking balls as stones, one covered
    with gum and one without covering.
  category: object
  evidence_refs:
  - ev:6
