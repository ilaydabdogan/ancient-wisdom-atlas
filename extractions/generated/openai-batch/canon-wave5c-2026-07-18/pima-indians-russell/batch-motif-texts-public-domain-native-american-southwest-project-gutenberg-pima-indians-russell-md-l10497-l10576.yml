canonical_text:
  quote: ''
  summary: The passage gives flood-related traditions involving El Bebedor, Coyote,
    Earth Doctor, and Elder Brother. It describes floodwaters, refuge or survival
    in elevated places or floating objects, emergence after the flood, Elder Brother's
    recognition as ruler, a search for the land's center, and a song naming the center
    and central mountain. The quoted Pedro Font version also describes creation of
    people from mud, speech differences among groups, punishment by transformation
    into saguaros, and a threatened burning by the sun.
  language: English
  quote_policy: summarized
