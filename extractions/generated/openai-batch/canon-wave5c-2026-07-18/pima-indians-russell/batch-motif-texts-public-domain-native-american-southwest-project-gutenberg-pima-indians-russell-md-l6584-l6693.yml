canonical_text:
  quote: ''
  summary: 'Ethnographic description of the Pima kiaha as a women''s carrying device:
    its use for heavy loads, its association with girls, maidens, and older women,
    its materials and manufacture, the preparation of maguey fiber, barter with Papagos,
    communal spinning, and finishing of the net with dyes and cordage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that in the described earlier period of Pimeria, burdens
    were borne by women using either a head ring or the kiaha carrying device.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kiaha is distinguished from the conical carrying baskets of other tribes
    and is described as light, strong, and able to hold bulky loads such as wood.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A kiaha can be loaded while standing on the ground with its front frame sticks
    and a helping stick forming a tripod.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: An older woman is described rising with a nearly 100-pound load without assistance
    and unloading by bending forward so the burden falls clear of the head.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: If carrying a baby in a cradle, the woman would place the cradle horizontally
    on top of the wood load.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The kiaha is described as distinctively a woman's utensil and closely associated
    with her life history.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Girls around 8 or 10 begin using small or cut-down kiahas and learn loading,
    carrying, endurance for journeys, and care of the object from rain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: A maiden's kiaha has long spotted front frame sticks wound with hair cords,
    and her helping stick bears a long deerskin fringe that swings or flutters as
    she walks.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:9
  text: As an owner ages, the appearance of her kiaha is maintained less carefully,
    its cords become shorter and worn, and its front sticks are cut down, while her
    burdens do not diminish.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The kiaha frame uses saguaro ribs, the hoop is willow, the apron and headband
    use agave leaf, a bark or cloth roll may prevent chafing, and human hair cord
    attaches the hoop to the frame sticks.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Maguey and other fiber plants are gathered from higher hills and mountains,
    roasted overnight in fire pits, scraped with a deer's scapula, dried, and prepared
    as fiber for the kiaha net.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: A roll of prepared fiber is described as an article of barter between Pimas
    and Papagos, and the spinning of kiaha thread is described as a social event among
    women.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: After the net is attached to the hoop, it is colored with red and blue dyes
    to emphasize the pattern outlines, and the cord from headband to frame may be
    maguey fiber or horsehair.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: A cited note says the objects were highly prized by their owners because they
    were useful and labor-intensive to make.
  category: attribute
  evidence_refs:
  - ev:7
