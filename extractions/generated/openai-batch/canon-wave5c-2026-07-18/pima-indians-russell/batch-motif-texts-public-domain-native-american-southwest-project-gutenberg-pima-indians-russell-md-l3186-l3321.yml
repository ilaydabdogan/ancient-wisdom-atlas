canonical_text:
  quote: ''
  summary: The passage is an ethnographic catalogue of Pima food plants and plant
    foods, describing cultivation, gathering, seasonal availability, storage, and
    preparation methods such as beating, washing, boiling, parching, roasting, pounding,
    grinding, drying, and eating raw. It also notes introduced sorghum, Papago prickly-pear
    preparation, famine use of Malva, and older food knowledge no longer remembered.
  language: English with Pima plant names and Latin botanical names
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sorghum is cultivated when water permits and is described as recently obtained
    from whites who raise it extensively in the Southwest.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ki'ak heads are gathered, the seeds beaten out with a stick used as a flail,
    then moistened, parched, ground on a metate, and eaten with alternating pinches
    of meal and sips of water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mesquite beans are described as formerly among the most important Pima foods,
    harvested later than saguaro, sometimes subject to crop failure, reduced by livestock
    feeding, and stored in cylindrical rooftop bins.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mesquite beans and pods are pounded or separated, parched in live coals, ground
    into meal, and eaten as pinole; mesquite catkins, gum, and inner bark are also
    used.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Paloverde beans were formerly eaten as gathered or after pounding, were not
    eaten as pinole, and were sometimes mixed with mesquite meal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ko'rtMt heads are gathered, washed, boiled in an olla with a little water,
    combined with wheat flour and salt, and stirred until the heads fall apart.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: For Ko'-oku'paU'tik, tradition says the seeds were eaten in primitive times,
    but present knowledge of their preparation is absent; the plant is now boiled
    with meat as greens.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Screw beans are cooked in bush-lined pits in alternating layers with cocklebur
    leaves, covered with earth for several days, dried, stored in rooftop basket bins,
    pounded into flour for pinole, and partly consumed by sucking juice through the
    fingers after mixing with water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage lists additional plant foods eaten by boiling, raw eating, roasting
    in ashes, or seasonal consumption, including red berry, asparagus-like stems,
    and watermelons.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Pima prickly pear fruit is brushed, peeled, and eaten raw, while Papagos make
    syrup from the fruit and dry it; the passage says Pimas make no further use of
    it.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Malva liquid is used in making pinole during famine, and cat's-claw beans
    were eaten in primitive times although their preparation is no longer known by
    the present generation.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Black berries are beaten down into basket bowls and eaten raw, while Pap'l'am
    heads are dried, shelled, screened, parched, ground on the metate, and eaten as
    pinole.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: At least one common kidney bean variety is said to have been known before
    the Spaniards, with Venegas cited for red frixoles cultivated by natives of lower
    California that may have been the Pimeria variety.
  category: relationship
  evidence_refs:
  - ev:13
