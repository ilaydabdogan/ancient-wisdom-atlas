canonical_text:
  quote: ''
  summary: The passage describes Pima treatment of enslaved or captive children, chiefly
    from Apache groups or their allies. Captured Apache children were not killed but
    were sent to towns and sold to Spaniards or Mexicans. Captives were reportedly
    treated well, but their origin remained socially marked, and medicine-men sometimes
    attributed misfortunes to the presence of aliens. In rare cases, captive girls
    married into the tribe, introducing foreign ancestry.
