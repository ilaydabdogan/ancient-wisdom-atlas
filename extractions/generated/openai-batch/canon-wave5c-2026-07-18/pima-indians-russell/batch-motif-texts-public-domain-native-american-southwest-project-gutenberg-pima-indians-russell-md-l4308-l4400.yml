  text: The stone ax and knife are described as enabling woodworking, affecting architecture,
    and supporting agriculture dependent on irrigation.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: The bow and arrow are ranked first in importance among Pima weapons, and Pima
    bows are described as simple and undecorated.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: A bow long used, especially in successful warfare, is described as a highly
    prized possession.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Warrior bows were made of mulberry wood obtained in the Superstition and Pinal
    mountains; hunting bows could be made of osage orange or willow.
  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: Pima arrows were made from arrow-bush stems, while Kwahadk's and Papagos sometimes
    sold yucca-stem arrows to the Gileños.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hunting arrows are described as having two split feathers, while war arrows
    have three shorter, slightly curved feathers.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Arrow shafts were measured and cut according to the maker's body, from the
    forefinger tip to the nipple of the breast.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Bows and arrows could be stained with jack-rabbit blood, war arrows could
    be dyed with cochineal, and the quiver was made of wild-cat skin.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: The war club is described as scarcely less important than the bow, and some
    warriors fought with shield and club alone.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: A short sharpened stick or lance was adopted from the Yumas and Maricopas
