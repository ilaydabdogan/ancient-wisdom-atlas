  summary: The passage describes Pima uses of saguaro, yucca, and maize. It emphasizes
    the June saguaro harvest as the beginning of the Pima calendar year, details preservation
    and preparation of fruits and seeds, and includes observer accounts of saguaro-season
    intoxication, feasting, and comparison with California pitahaya harvest periods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Saguaro fruit is gathered in June, and the harvest marks the beginning of
    the new year in the Pima calendar.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Saguaro seeds and dried fruit may be preserved for use through the year; seeds
    that have passed through the body are sometimes gathered from dried feces, washed,
    and treated like other seeds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fresh ripe saguaro fruit is eaten without preparation and is described as
    crimson with many small black seeds and a fig-like taste.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fresh saguaro fruit can be boiled and fermented into an intoxicating liquor
    that is described as highly esteemed and associated with the new-year season.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Saguaro fruit is dried into balls; syrup is extracted by long boiling; residue
    is ground on the metate into paste; and seeds may be eaten raw, ground into meal,
    mixed with water as pinole, or baked with other meal into bread.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Yucca fruit is boiled, dried, ground, and boiled with flour; it is also eaten
    raw as a cathartic, while yucca stems are pulped and used as soap.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Husked corn is brought in by women, piled on brush, roasted by burning the
    brush, cut from the cob, dried, and stored.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A diary excerpt reports Pima rejoicing, a proposed feast, singing, shouting,
    and drunkenness in connection with a saguaro-season gathering.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The same diary excerpt reports that no women became drunk and that women led
    the horses of mounted husbands while gathering scattered clothing and beads.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A quoted California account describes pitahaya months as a period of feasting,
    dancing, neighboring-rancheria entertainments, buffooneries, comedies, and extended
    consumption of the fruit.
  category: action
  evidence_refs:
  - ev:7
