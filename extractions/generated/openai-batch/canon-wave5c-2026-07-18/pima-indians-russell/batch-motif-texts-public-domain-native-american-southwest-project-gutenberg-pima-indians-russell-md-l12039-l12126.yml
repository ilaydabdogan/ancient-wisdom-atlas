  summary: The passage gives two versions of the origin of horses through an elder
    brother's sacrifice, followed by a nursery tale in which orphaned children ignore
    a rabbit's warning, discover their aunt has been killed, and are later pursued
    by a suspected ghost before turning into stone.
  language: English
