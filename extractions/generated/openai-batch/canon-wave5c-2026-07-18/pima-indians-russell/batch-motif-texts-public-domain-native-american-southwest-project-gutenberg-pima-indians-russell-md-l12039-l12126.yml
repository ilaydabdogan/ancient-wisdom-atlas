literal_observations:
- id: obs:1
  text: Two brothers living apart from their kinsfolk are described as skillful deer
    and antelope hunters who carry game home on their shoulders.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder brother tells the younger to shoot arrows through his body, cut
    him into four pieces, throw the pieces into water, and return in four days.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'After obeying, the younger brother returns and finds four horses: two males
    and two females, in black, white, bay, and yellow or buckskin colors.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The younger brother ropes one horse, rides it home, and drives the others.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The account states that horses multiplied in Pimeria and that mounts came
    from the good brother's sacrifice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In another version, the Rs&rstlkatc A-&tam had confined game animals in a
    cave at Aloam mountain, while two brothers, one blind and one lame, lived among
    the people.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: A peal of thunder and a voice saying to take care frighten the brothers; the
    younger opens his eyes and the elder walks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the brothers fail to find game, the elder says he will die for the younger's
    sake; when the younger returns, he finds a male and a female horse.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Five orphaned children live with their aunt; while hunting, they meet five
    rabbits, and the oldest rabbit warns that Apaches have burned their home, but
    the children kill the rabbit.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The children find their aunt lying outside the ki with blood near her and
    cut hair; the passage says Apaches had killed her, but the children do not understand
    death and think their aunt has gone away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The children dig a hole, make a fire with hot stones, wait for their aunt,
    and later sleep with their sandals on so they can quickly leave if danger comes.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: At night the children hear her coming in sandals; one says it may be a ghost,
    the children run, then stand by the door and turn into stone, and the woman goes
    away.
  category: sequence
  evidence_refs:
  - ev:9
