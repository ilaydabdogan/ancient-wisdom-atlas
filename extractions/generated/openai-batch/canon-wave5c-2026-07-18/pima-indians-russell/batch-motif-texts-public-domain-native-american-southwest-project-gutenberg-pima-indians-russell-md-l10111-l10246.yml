canonical_text:
  quote: ''
  summary: The passage describes Pima myth transmission practices and a creation myth
    in which Earth Doctor/Earth Magician emerges from primordial darkness, shapes
    an earth-cake, establishes a creosote bush, enlarges and stabilizes the earth
    with insects and a spider web, creates sky and land features, and forms the sun,
    moon, stars, and Milky Way from water, ice, crystal, a walking stick, and ashes.
  language: English
  quote_policy: summarized
