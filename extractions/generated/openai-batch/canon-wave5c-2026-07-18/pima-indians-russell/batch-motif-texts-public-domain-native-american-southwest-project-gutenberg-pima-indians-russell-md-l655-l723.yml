canonical_text:
  quote: ''
  summary: The passage recounts Spanish missionary, military, and trade contact with
    the Pimas from Kino's 1702 expedition through later eighteenth-century visits
    and accounts. It notes Kino's bead-giving, the attribution of magic power to glass
    beads, old glass beads found on Piman shrines, the arrival of horses, later missionary
    attempts mediated by Indigenous messengers, military posts at Tubac and Tucson,
    trade with the Pimas, and a later description of unconverted Pimas along the Gila
    with irrigable land.
  language: English, with a German quoted excerpt
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In 1702 Kino made his sixth and last journey to the Pimas by way of Sonoita
    and the lower Gila; the passage says many Pimas were among those baptized, but
    his stay among them lasted only a few days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kino gave away many beads; the narrator says the Pimas already valued beads
    of their own manufacture and probably accepted Kino's statement that magic power
    resided in new glass beads.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The writer reports finding very old glass beads on all Piman shrines and believes
    some were brought by Kino.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that the first horses to reach Pimería were brought by
    these expeditions, while there is no record of cattle being brought so far north
    at that time.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: After Kino's death in 1711, no Spaniard is said to have reached the Gila or
    entered Arizona for more than twenty years; in 1731 Segresser and Grashoffer became
    the first permanent Spanish residents of Arizona.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Keller made trips to the Pima villages on the Gila, found that many rancherías
    from Kino's time had broken up, and later attempted to penetrate Apache country.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Native messengers communicated that the Hopis desired Jesuit missionaries
    from Sonora; Keller failed because of Apache hostility, and Sedelmair later could
    not induce Pimas or Maricopas to accompany him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Accounts of early missionaries preceded them through Papago messengers, who
    are said to have distinguished slave-hunting Spanish adventurers from Jesuits
    and Franciscans.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says the Pimas were remote from Sonoran settlements and beyond
    the reach of slave-hunting adventurers, so only especially devout and energetic
    friars reached them.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: A small garrison was stationed at Tubac and later Tucson, and the passage
    says its influence on the Pimas could not have been very great.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: Between 1768 and 1776 Garcés made five trips from San Xavier del Bac to the
    Pimas and beyond; later there was trade with the Pimas at Tucson or through small
    trading parties to the Gila villages.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The German excerpt from Pfefferkorn describes unconverted Pimas living on
    both sides of the Gila in three numerous communities and occupying land that could
    be watered and made fertile by conduits from the river.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage states that Padre Pedro Font accompanied Garcés in 1775 and wrote
    an extended diary with several pages on the Pimas.
  category: action
  evidence_refs:
  - ev:10
