  quote: ''
  summary: The passage summarizes two short tales. In the first, a boy seeks his mother
    after she has been captured by Apaches, transforms into a dove, is crushed by
    an Apache chief, and the pieces become hawks that kill the Apaches; the mother
    and son then become saguaros on the way home. In the second, a bird becomes blue
    by bathing in a lake and teaches Coyote to do the same, but Coyote's pride leads
    him to collide with a stump, fall into dust, and become gray.
