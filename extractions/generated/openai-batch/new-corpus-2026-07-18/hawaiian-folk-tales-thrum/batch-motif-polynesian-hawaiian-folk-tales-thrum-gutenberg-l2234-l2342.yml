canonical_text:
  quote: ''
  summary: King Kakuhihewa overhears the wishes of Kalelealuaka and Keinohoomanawanui,
    leaves his spear and stone hatchet outside their house, and consults soldiers,
    ritual experts, and the wise kahuna Napuaikamao. Napuaikamao judges Keinohoomanawanui's
    wish harmless but unproductive and Kalelealuaka's ambition beneficial for the
    government, prompting royal mobilization to fetch timber and prepare houses and
    food. Kalelealuaka is summoned by the marshal, undergoes a water bath and circumcision
    rite by ancestral shades amid thunder, lightning, and earthquake, is recognized
    by Kaopele as divine offspring going to meet the sovereign, then returns and supernaturally
    transports the lame marshal and his companions to Puuloa without their awareness.
  language: English
  quote_policy: summarized
