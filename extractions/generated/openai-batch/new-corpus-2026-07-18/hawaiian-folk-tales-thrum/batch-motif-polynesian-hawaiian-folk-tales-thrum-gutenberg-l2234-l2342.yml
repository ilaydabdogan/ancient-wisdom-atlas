- id: obs:1
  text: Kakuhihewa listens outside Kalelealuaka's house while the men are speaking
    and leaves his spear and stone hatchet outside the enclosure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Puuloa, Kakuhihewa commands a feast, summons chiefs and table companions,
    and tells them about the light in the mountains and the wishes of Kalelealuaka
