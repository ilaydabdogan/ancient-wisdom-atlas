canonical_text:
  quote: ''
  summary: Kamalo, priest of Kupa, seeks revenge after Kupa has Kamalo's two sons
    killed for allegedly reviling him by drumming on the temple drum. Kamalo carries
    a black pig and travels across Molokai seeking supernatural help, first from Lanikaula,
    then Kaneakama, then Kahiwakaapuu, and finally to the sea-level cave of Kauhuhu,
    the shark god. At the kapu cave, Waka and Moo hide Kamalo in a rubbish heap. Eight
    heavy breakers announce Kauhuhu's return. The shark god comes ashore, assumes
    human form, detects a human smell, discovers Kamalo after the pig squeals, begins
    to swallow him, then allows him to speak. Kamalo explains his grievance and presents
    the pig to Kauhuhu.
  language: English
  quote_policy: summarized
