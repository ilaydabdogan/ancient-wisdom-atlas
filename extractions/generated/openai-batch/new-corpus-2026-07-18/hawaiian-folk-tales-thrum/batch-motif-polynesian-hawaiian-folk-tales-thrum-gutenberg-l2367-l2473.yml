canonical_text:
  quote: ''
  summary: A messenger announces Kualii's war at Moanalua. Kalelealuaka sends his
    wives to gather shrimps and moss, secretly flies to Waianae and Napeha, carries
    the lame marshal Maliuhaaino to a lookout, and enters the battle. He kills the
    champion beside Kualii, takes his feather cloak and helmet, and cuts off his ear
    and little finger. He returns home and conceals the trophies. Soldiers wrongly
    credit Keinohoomanawanui, but Maliuhaaino later reports that an unmatched warrior
    from Waianae won the battle, fought without a spear, and resembled the king's
    son-in-law. A later messenger announces another war by Kualii at Kulaokahua.
  language: English
  quote_policy: summarized
