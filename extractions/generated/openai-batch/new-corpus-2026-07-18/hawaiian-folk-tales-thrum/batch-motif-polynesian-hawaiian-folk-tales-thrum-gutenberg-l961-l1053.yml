- id: obs:7
  text: Kawelu detains Hiku for several days and then confines him in a house; Hiku
    escapes by removing thatch from the roof.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After Hiku's escape, Kawelu refuses food, dies, and her spirit departs to
    the netherworld ruled by Milu.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hiku weeps over Kawelu's body and resolves to descend into the netherworld
    to try to bring back her spirit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: With help, Hiku gathers kowali vines, prepares a split hollow coconut shell,
    anoints himself with rancid coconut and kukui oil, and travels by canoe to a place
    in the sea where sky meets water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Hiku is lowered into Lua o Milu by a long rope of kowali vines while seated
    on a swing-like cross-stick and carrying the coconut shell.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Hiku enters a cavern where departed shades are gathered; the corpse-like odor
