canonical_text:
  quote: ''
  summary: Hiku, a demigod son of Hina living near the summit of Hualalai, leaves
    his mother's cave with the talismanic arrow Pua Ne. The arrow guides him down
    to Holualoa and selects the princess Kawelu. Kawelu detains Hiku, he escapes,
    and she dies of grief. Hiku prepares vines, a coconut shell, and a corpse-like
    odor disguise, then is lowered into Lua o Milu, the netherworld abyss, where Milu
    is deceived by the stratagem.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hina and her son Hiku live in a cave on the southern side of a ridge near
    the summit of Hualalai on Hawaii.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hiku has been kept from descending to the plains and seeing human settlements
    until his mother reluctantly permits him to go, warning him not to stay too long.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hiku carries the arrow Pua Ne, described as a talisman able to answer his
    call and direct his journey by its flight.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Hiku descends the mountain, shoots the arrow ahead of him, and follows its
    landings toward Kailua, Holualoa, and the waterhole Waikalai or Wai a Hiku.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Near Holualoa, the arrow enters the chief's courtyard, singles out Kawelu,
