canonical_text:
  quote: ''
  summary: After Oahunui is killed, his abandoned headless body is said to turn to
    stone as testimony to divine anger at his crime. Servants involved in killing
    and cooking the young princes are also turned to stone after Kilikiliula's death.
    Other retainers, chiefs, and guards flee, leaving the formerly sacred royal home
    deserted. The spot remains believed to be under Kane's curse, and no one has lived
    there since.
