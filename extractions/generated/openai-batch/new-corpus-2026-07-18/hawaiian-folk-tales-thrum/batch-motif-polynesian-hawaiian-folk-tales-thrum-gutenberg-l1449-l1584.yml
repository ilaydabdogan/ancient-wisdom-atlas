canonical_text:
  quote: ''
  summary: The passage describes the north Molokai cliffs, the Haupu headland, and
    nearby needle-like ocean rocks, then begins the legend of Kapeepeekauila. Kapeepeekauila,
    a hairy man of Haupu, seeks Hina as wife; Hina accepts, his hair is plucked out,
    and they live on top of Haupu. Hina's husband Hakalanileo mourns and seeks powerful
    helpers to recover her. Several famed strong men are judged inadequate, after
    which Niheu the Rogue intervenes and leads the search toward Kana, whose blazing
    eyes frighten Hakalanileo.
  language: English
  quote_policy: summarized
