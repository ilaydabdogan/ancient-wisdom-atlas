canonical_text:
  quote: ''
  summary: Opunui carries Kaala underwater into a sea cave and leaves her there after
    she refuses a condition that would make her appear with another chief. Kaaialii
    learns from Ua that Kaala has disappeared, tracks Opunui, pursues him, and is
    stopped when Opunui reaches a sacred wall of refuge guarded by priests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Opunui clasps the girl, leaps into a pool, swims underwater, and enters a
    sea cave whose mouth is beneath the sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sea cave contains a dry space, a salt-icicled roof, a moving green sea
    at the entrance, crabs, a biting eel, and a place described as where a dread sea
    god dwelt.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kaala, frightened by the eel and crabs, asks Opunui to kill her with a jagged
    stone rather than leave her to be attacked.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Opunui says Kaala may return to the sunny air and Palawai if she goes with
    him to the chief of Olowalu and lets her lord see her in another chief's arms.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kaala refuses any love-clasp except that of her own chief and says she would
    rather die or be torn by the eel than have another man press her face.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Opunui leaves Kaala in the cave, warns her not to try the swift channel because
    of jagged rocks, and says the chief of Olowalu will come for her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kaaialii waits for Kaala, sees Ua approaching, and asks why Kaala has delayed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ua reports that Kaala is not in the valley or at her mother's hut, and that
    men saw her father lead her through the forest of Kumoku before she disappeared.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Kaaialii runs after Opunui, finds prints he believes are Kaala's, sees Opunui
    alone, and demands Kaala or Opunui's life.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Opunui flees from Kaaialii toward a taboo refuge; Kaaialii pursues him down
    toward the sea.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Opunui reaches the sacred wall and enters it; priests stop Kaaialii with staves.
  category: action
  evidence_refs:
  - ev:11
