canonical_text:
  quote: '"If I shut my eyes now I see her best; therefore let me shut my eyes forevermore."'
  summary: Kaaialii declares that Kaala was his life and that he cannot live without
    her. He kills himself beside her body. The king orders the two lovers to be placed
    side by side on a ledge in the cave and wrapped in tapas. Ua laments them in a
    chant that names the sea, the gods of the deep, Kahiki, Wakea, and the cave where
    they sleep. Ua is then carried away, and the passage closes by saying the two
    lovers sleep side by side in the Spouting Cave of Kaala.
  language: English
  quote_policy: quoted
