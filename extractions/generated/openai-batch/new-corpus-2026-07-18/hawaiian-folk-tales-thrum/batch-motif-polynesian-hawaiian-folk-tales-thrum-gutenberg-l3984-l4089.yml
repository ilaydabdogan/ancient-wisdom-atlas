canonical_text:
  quote: ''
  summary: The passage describes Kaunolu on Lanai as an ancient refuge and temple
    site near a rich fishing ground. Kamehameha arrives there with his retinue and
    is honored by islanders with food, animals, and floral offerings. Kaala, a young
    maiden, is presented among the gathered people, and the warrior Kaaialii notices
    her. The passage closes by recalling Kaaialii’s violence in the battle of Maunalei.
  language: English
  quote_policy: summarized
