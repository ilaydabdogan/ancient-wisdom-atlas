canonical_text:
  quote: ''
  summary: Eleio prepares ritual offerings, invokes his gods, and performs kapuku,
    restoring a dead girl’s spirit to her body through prayer. After purification
    and a feast, the girl’s father offers her to Eleio, but Eleio refuses marriage
    and takes her, a newly finished feather cloak, and remaining awa back toward King
    Kakaalaneo. Eleio survives the king’s order to roast him alive, presents the unprecedented
    feather cloak, is pardoned, and the awa is reserved for royal offerings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eleio orders cooked hog, red and white fish, red, white, and black cocks,
    and bananas to be placed on an altar; he also orders women and children to pray
    indoors, animals to be kept quiet, and men to remember and invoke their gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eleio fetches medicinal awa from Kaeleku, prepares it, offers the completed
    feast to his gods, and asks for assistance in what he is about to perform.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The girl’s spirit is described as lingering near Eleio, attached to him, and
    invisible to everyone else.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: After his invocation, Eleio catches the spirit, holds his breath, invokes
    the gods, and carries the spirit to the puoa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The parents follow Eleio and understand that he intends to attempt kapuku,
    described in the passage as restoration to life of the dead, on their daughter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Eleio places the spirit against the girl’s insteps and presses it into the
    body; the spirit resists at several body points because the stomach is beginning
    to decompose, and repeated prayers overcome the resistance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the prayers overcome the spirit’s last resistance at the elbows and
    wrists, the spirit fully enters the body and the girl comes to life.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The restored girl undergoes purification by the local priest, is led to a
    prepared lanai, and joins Eleio, her parents, and relatives in a joyous reunion
    and feast.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that the gods are supposed to absorb the spiritual essence
    of the offerings, while the devotees eat the material portions as the gods’ guests.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: The father offers the restored woman to Eleio as a wife and says Eleio may
    remain as a son who shares in the parents’ love for her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Eleio refuses to take the girl as wife, accepts her as a charge, and says
    she is worthy to be queen of the island and should be taken to his master.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Eleio asks that the feather cloak be finished; feather-workers, including
    the restored girl, complete it, and Eleio learns that the girl is named Kanikaniaula.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Eleio returns toward Lahaina with Kanikaniaula, the feather cloak, and remaining
    awa; the girl travels more slowly in her body than she had as a spirit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: At Launiupoko, Eleio tells Kanikaniaula to hide in the bushes while he goes
    ahead alone, warning that if he has not returned by sundown he will be dead.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: At Makila, people are heating an underground oven to roast Eleio alive under
    the king’s orders; Eleio asks to die at his master’s feet and passes the oven.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Before King Kakaalaneo, Eleio says he has something that will make the king’s
    name renowned, displays a feather cloak previously unheard of on the islands,
    and is pardoned and restored to favor.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: The remaining awa from Hana is reserved for the king’s special use in offerings
    to the gods that evening.
  category: object
  evidence_refs:
  - ev:7
