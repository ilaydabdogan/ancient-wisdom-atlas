canonical_text:
  quote: ''
  summary: The passage introduces Kahalaopuna of Manoa through a genealogy involving
    a mountain spur, lehua, twins associated with Manoa wind and rain, and a foster-arranged
    sibling marriage. It describes her sacred residence, radiance, childhood betrothal
    to Kauhi, the spread of her fame, false boasts by two men, and Kauhi's jealous
    decision to kill her before he meets her and hesitates.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Akaaka is described as a projecting spur of the mountain range at the head
    of Manoa Valley and as united in marriage to Nalehuaakaaka, who is represented
    by lehua bushes on the ridge.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Akaaka and Nalehuaakaaka have twins: Kahaukani, a boy associated by name
    with the Manoa wind, and Kauakuahine, a girl associated by name with the Manoa
    rain.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The twins are adopted at birth by Kolowahi and Pohakukala, who are brother
    and sister, and later are raised separately and married in ignorance of their
    relationship.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Kahalaopuna is born to Kahaukani and Kauakuahine, and the passage links this
    birth to the union of Manoa rain and wind and to the beauty associated with Manoa
    girls.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kahalaopuna lives at Kahaiamano in a house surrounded by an auki fence, with
    puloulou placed by the gate to mark forbidden ground and high sacred rank.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kahalaopuna's face is said to emit a glow visible through the house thatch,
    and rays of light surround her when she goes to the spring to bathe.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage reports a belief that the bright light is still sometimes seen
    at Kahaiamano when Kahalaopuna's spirit revisits her old home.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kahalaopuna is betrothed in childhood to Kauhi, a young chief of Kailua, and
    his parents send food for her table because of the honor of the intended union.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: People visit the outer puloulou at the sacred precinct to glimpse Kahalaopuna
    as she goes to and from the spring, spreading news of her beauty.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Kumauna and Keawaa, described as disfigured makahelei men, fall in love with
    Kahalaopuna by hearsay without having seen her.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Kumauna and Keawaa wear leis at Waikiki and boast that the leis are love-gifts
    from Kahalaopuna.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Kauhi hears the repeated assertions, comes to believe them, becomes jealous,
    and determines to kill Kahalaopuna.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: On his way to Kahaiamano, Kauhi rests under a hala tree in a wiliwili grove
    and carries a bunch of hala nuts with him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Kahalaopuna recognizes Kauhi from descriptions, invites him in, and then obeys
    when he refuses and asks her to come outside.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Kauhi hesitates because of Kahalaopuna's obedience and beauty and tells her
    to bathe and prepare to accompany him into the woods.
  category: sequence
  evidence_refs:
  - ev:10
