canonical_text:
  quote: ''
  summary: Kauhi leads his betrothed Kahalaopuna through a sequence of named places,
    accuses her of being false, kills and buries her repeatedly, and is repeatedly
    thwarted by a divine owl-relative who restores her to life. At the final burial
    under a koa tree, the owl cannot reach her body because its claws become entangled
    in the roots.
  language: English
  quote_policy: summarized
