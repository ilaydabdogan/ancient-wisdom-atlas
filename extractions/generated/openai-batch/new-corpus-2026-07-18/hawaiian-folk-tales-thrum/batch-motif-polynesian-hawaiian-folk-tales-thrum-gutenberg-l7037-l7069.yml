canonical_text:
  quote: ''
  summary: The passage tells a myth of the hilu fish. Hilu-ula and Hilu-uli are male
    and female twins with human form and the power to assume hilu fish form. Hilu-uli
    leaves her family, enters the sea, travels to Heeia, and causes the hilu to multiply
    into a huge school. Local people catch and eat the fish. Hilu-ula arrives in human
    form, recognizes his sister's fish form broiling over coals, becomes angry, changes
    into a whirlwind, and blows the fish back into the sea. The passage explains the
    dark scales and wide knowledge of the hilu-uli.
  language: English
  quote_policy: summarized
