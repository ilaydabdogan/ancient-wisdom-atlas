canonical_text:
  quote: "“This land is the sea's.”"
  summary: King Kahahana's men seize the priest Kaopulupulu and his son Kahulupue,
    imprison them in an unfinished grass house, and kill the son after Kaopulupulu
    directs him toward the sea. Kaopulupulu predicts vengeance and the king's death
    before he is slain. His body is transported and displayed at Waikiki. King Kahekili
    of Maui later retakes Oahu; Kahahana flees with his wife and friend, is lured
    out, and is killed. The narrative states that Kaopulupulu's saying was fulfilled.
  language: English
  quote_policy: quoted
