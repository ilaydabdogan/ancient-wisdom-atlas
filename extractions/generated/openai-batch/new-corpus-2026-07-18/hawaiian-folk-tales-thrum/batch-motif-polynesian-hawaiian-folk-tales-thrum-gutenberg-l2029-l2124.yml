canonical_text:
  quote: ''
  summary: Part II describes Kaopele awakening from a dark watery couch during a storm
    and returning to his wife and child; his trance then ceases and his virtue is
    said to have gone to Kalelealuaka. Kaopele later trains Kalelealuaka in athletic,
    martial, running, and jumping arts. Kalelealuaka wins deadly contests against
    a king at Wailua and a chief at Hanalei, carrying their bodies as royal sacrifices
    to the altar of a temple built by him and his father. He then sees Oahu from Kauai,
    receives his father's geographical instructions, travels there by canoe with Kaluhe,
    is joined by another boy, and reaches Keahumoe, the site of his father's former
    plantation.
  language: English
  quote_policy: summarized
