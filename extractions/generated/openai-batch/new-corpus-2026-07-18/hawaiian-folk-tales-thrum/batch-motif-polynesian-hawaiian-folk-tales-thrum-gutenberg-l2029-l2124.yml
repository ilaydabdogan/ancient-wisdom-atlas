- id: obs:2
  text: Kaopele awakens in a dark watery couch, unbinds cords holding his feet, and
    reaches the water's surface with three powerful strokes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kaopele looks toward Kauai and Oahu, then goes to Kauai because of love for
    his wife and child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Kaopele appears at his wife's bedside at night; she initially cries out that
    he is the ghost of Kaopele and only believes he is her husband after a candle
    is lit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The step-parents flee and do not return; Kaopele is no longer visited by trance,
    and his virtue is said to have gone to Kalelealuaka.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: When Kalelealuaka is ten, Kaopele trains him in athletic sports, war, combat,
    running, and jumping, including jumping up or down a high pali and running on
    the water's surface.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Wailua, Kalelealuaka belittles chiefly games, accepts a boxing challenge
    from the king, wagers his own body, defeats the king, kills him, and carries the
    body to a temple altar as a sacrifice.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Hanalei, Kalelealuaka enters a spear-throwing contest with a strong chief,
    wagers life against life, shivers a coconut tree with his spear, and obtains a
    second royal sacrifice for his temple altar.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kalelealuaka sees Oahu from Kauai; Kaopele identifies Oahu, Kaena, and Waianae
    and prepares a canoe for his son's travels.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Kalelealuaka takes Kaluhe as a travelling companion, reaches Waianae with
