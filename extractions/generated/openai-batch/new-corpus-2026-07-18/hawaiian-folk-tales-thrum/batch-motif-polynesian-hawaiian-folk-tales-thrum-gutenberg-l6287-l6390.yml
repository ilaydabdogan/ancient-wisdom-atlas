canonical_text:
  quote: ''
  summary: Kikihale sees a child in a calabash, after hearing the child had had the
    form of an oopu, and asks her guardian to rear him until he is grown so she may
    marry him. The child, later named Puniaiki, grows up and marries her. After Kikihale
    reproaches him for not helping with fishing, he claims authority over fish and
    asks for canoes, gear, and paddlers. He burns the pearl fish-hooks supplied by
    Kou. At sunrise he sees his father Aiai in a rainbow and reddish mist, and Aiai
    shows him the fish-hook Kahuai. During a canoe trip Puniaiki opens Kahuai, and
    aku leap into the canoes in such numbers that the canoes become heavily filled.
  language: English
  quote_policy: summarized
