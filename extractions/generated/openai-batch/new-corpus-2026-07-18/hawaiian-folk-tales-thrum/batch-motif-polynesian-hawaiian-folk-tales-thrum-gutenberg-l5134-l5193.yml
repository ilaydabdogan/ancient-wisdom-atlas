canonical_text:
  quote: ''
  summary: Kapoi finds and takes seven owl eggs, nearly roasts them, but returns them
    after an owl pleads for them. The owl instructs him to build and dedicate a heiau
    named Manua. Because Kakuihewa, King of Oahu, has forbidden anyone to consecrate
    a heiau before the king's temple is kapued, Kapoi is condemned to death. The owl
    gathers owls from several islands; on the appointed day they cover the sky, attack
    the king's servants, defeat the king's people, and Kapoi is released. The king
    acknowledges Kapoi's Akua as powerful, and the owl is thereafter recognized as
    a deity venerated by Hawaiians.
  language: English
  quote_policy: summarized
