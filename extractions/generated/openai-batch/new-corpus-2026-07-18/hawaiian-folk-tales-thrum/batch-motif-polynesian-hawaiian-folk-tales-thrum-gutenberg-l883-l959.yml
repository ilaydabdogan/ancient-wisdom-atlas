canonical_text:
  quote: ''
  summary: Kahawali, chief of Puna, and a companion go sledding on a hill before spectators,
    musicians, and dancers. Pele, goddess of the volcano, comes from Kilauea in the
    form of a woman, challenges Kahawali, and loses. After Kahawali refuses to give
    her his sled, Pele becomes angry, causes an earthquake, summons fire and liquid
    lava, assumes her supernatural form, and pursues him. The fiery torrent overwhelms
    the crowd while Kahawali and his companion flee. Kahawali salutes his pig and
    family members, uses his broad spear to cross a chasm and rescue his companion,
    escapes by canoe while Pele hurls rocks after him, and travels with the help of
    the east wind to Maui, Lanai, Molokai, and finally Oahu, where he stays with kin.
  language: English
  quote_policy: summarized
