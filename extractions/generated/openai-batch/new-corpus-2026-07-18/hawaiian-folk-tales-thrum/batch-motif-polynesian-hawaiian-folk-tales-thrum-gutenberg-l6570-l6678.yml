canonical_text:
  quote: ''
  summary: The passage introduces Kamohoalii, a King-shark god able to take human
    form. He courts Kalei of Waipio by appearing as a handsome man and saving her
    from a dangerous wave. After marrying her, he reveals his shark nature and warns
    that their future child must not eat animal flesh because he will have a dual
    nature and a changeable body. Their son Nanaue is born outwardly human but with
    a shark mouth on his back. His family hides this mark. Despite the warning, his
    grandfather feeds him dog meat and pork. Nanaue grows strong, transforms into
    a shark in water, eats fish, hides his shark nature with a kapa scarf, and develops
    a ravenous appetite for meat.
  language: English
  quote_policy: summarized
