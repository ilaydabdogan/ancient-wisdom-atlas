canonical_text:
  quote: ''
  summary: Nanaue, lying bound on a sandy beach, reaches the incoming tide and changes
    into a monster shark. People block and wound him, then call the demigod Unauna,
    who conquers him and hauls him up Kainalu Hill to be burned. The passage explains
    visible landforms and the name Puumano, Shark Hill. Nanaue's burning body repeatedly
    quenches the fire, so sacred bamboo is cut into knives to strip and burn the shark
    flesh. The god Mohoalii/Kamohoalii is angered and permanently removes the cutting
    edge from that grove's bamboo.
  language: English
  quote_policy: summarized
