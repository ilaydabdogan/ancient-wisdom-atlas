canonical_text:
  quote: ''
  summary: A commentary passage quotes Judge Fornander on proposed relationships between
    Polynesian, Hawaiian, Marquesan, Hebrew, Chaldean, and other ancient traditions.
    It discusses hypotheses of Israelite contact, a counter-hypothesis of independent
    versions from a common body of legend, comparisons involving Joshua, Jonah, Genesis
    creation, tabooed apples and sacred trees, human sacrifice, Kanaloa as an evil
    spirit, and Hebrew scriptural evil figures.
  language: English
  quote_policy: summarized
literal_observations:
