  text: The passage reports a hypothesis that scattered Israelites may have arrived
    at the islands or Malaysia before the Polynesian family migrated and may have
    imparted doctrines, ancestral lore, and customs before being absorbed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The quoted commentary rejects simple copying and presents the compared legends
    as independent and original versions of a once common legend or series of legends.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says Polynesian legends are silent about Solomon's empire, temple,
    and wisdom.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage connects the legend of Hiiaka-i-ka-poli-o-Pele with discussion
    of the Hebrew legend of Joshua or a Cushite version, and connects Naulu-a-Mahea
    with Jonah and Joshua and the sun.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the creation comparison, the Hebrew legend is described as making Elohim
