canonical_text:
  quote: ''
  summary: Aiai disappears after instructing Kanemakua, who returns with a large fish,
    offers its eyes in thanksgiving, and hosts a feast. Aiai then establishes ku-ula
    fishing stations and fish stones around Maui and nearby islands, including ritual
    offering places. On Lanai he fishes aku from shore with a pearl and creates the
    first turtle from a carved stone. On Molokai he establishes local fishing practices,
    observes the cave of the eel Koona, removes oopu and opae from people fishing
    wastefully at Wailau, turns captured fish into lizards, and reveals the new location
    of the opae to Kahiwa, giving rise to local sayings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Aiai finished speaking, he suddenly disappeared, while Kanemakua retained
    a great fish in his canoe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kanemakua brought the large fish ashore, had it cooked, offered the fish eyes
    as a thanksgiving sacrifice, and shared the feast with family, friends, and neighbors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first ku-ula established in Maulili, Maui, was named after Aiai, and the
    fish of that place were thereafter given out freely without restriction or division.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Aiai established ku-ula stations and fish stones around Maui, including areas
    from Hana to Kipahulu, Kaupo, Kahikinui, and Honuaula.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Hakioawa on Kahoolawe, Aiai is said to have established a ku-ula on a high
    bluff, with square-placed stones and an interior space for first fish, awa, and
    kapa offerings to fish deities.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports and rejects an idea that Kamohoalii, the king shark of
    Kahoolawe, had a ko'a on the island.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Cape Kaunolu on Lanai, Aiai used his pearl Kahuoi to fish for aku from
    land; the passage calls this the first known case of such fishing with a pearl
    from shore.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Polihua, Aiai carved a figure on a stone, called on his parents during
    incantations, and the stone moved into the sea, returned, and became a turtle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Polihua event is described as the first introduction of turtles into Hawaiian
    seas and as the origin of turtles going onto beaches to lay eggs before returning
    to the sea.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: On Molokai, Aiai kicked mullet spawns onto the sand at Kaunakakau, and the
    passage says this foot-kicking fishing practice continued only at that locality.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Wailau, Aiai saw the cave of the eel Koona, who had gone to Hana and stolen
    fish from Aiai's father's pond.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Men, women, and children at Wailau were closing the stream, diverting its
    water, and catching oopu and opae, with some gourds full of the catch.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Aiai noticed that the Wailau fishers were catching all oopu and opae without
    reserving any for propagation; after he called on his parents, the creatures disappeared
    upstream or changed into lizards from the gourds.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Because of regard for Kahiwa, Aiai showed him where the opae were at Koki,
    and the place became associated with sayings about Kokio of Wailau and the Pali
    of Kahiwa.
  category: sequence
  evidence_refs:
  - ev:10
