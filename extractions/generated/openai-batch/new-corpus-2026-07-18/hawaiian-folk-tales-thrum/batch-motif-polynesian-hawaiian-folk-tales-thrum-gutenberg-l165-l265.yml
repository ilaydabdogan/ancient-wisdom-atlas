canonical_text:
  quote: ''
  summary: The passage is a dated Honolulu contents list for Hawaiian Folk Tales,
    naming twenty-five entries, subentries, contributors or translators, and page
    numbers. Titles include legends compared with Old Testament history, Maui exploits,
    Pele stories, a spirit-land visit, an origin of healing art, Menehune stories,
    a first feather cloak legend, Kamapuaa’s escape, fish-god legends, a shark-man,
    and fish superstitions.
  language: English
  quote_policy: summarized
