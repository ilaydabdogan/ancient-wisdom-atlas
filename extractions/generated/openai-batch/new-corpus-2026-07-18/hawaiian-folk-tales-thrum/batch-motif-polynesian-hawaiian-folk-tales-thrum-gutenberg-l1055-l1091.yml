canonical_text:
  quote: ''
  summary: Hiku uses a Hawaiian kowali swing to reach the shade of his sweetheart
    Kawelu. After mutual recognition and Milu's permission, Kawelu swings with him,
    but Hiku traps her in coconut shells when she tries to flee, and his friends draw
    them up to canoes above. Hiku returns to Holualoa, forces Kawelu's reluctant spirit
    through a hole in the great toe of her body, massages it upward, and Kawelu revives,
    breathes, speaks, loses memory of the Lua o Milu, and is welcomed home.
  language: English
  quote_policy: summarized
