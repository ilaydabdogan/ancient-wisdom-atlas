canonical_text:
  quote: ''
  summary: Maui, son of Hina-lau-ae and Hina, pities his mother Hina because short
    days make drying kapa difficult. After observing the Sun’s path, he makes cord
    from coconut fiber, ascends Haleakala, snares and breaks off the Sun’s strong
    rays, threatens to kill it, and accepts its promise to move more slowly. The story
    explains seasonal lengthening of days and the mountain name as meaning sun snarer.
    Maui later pursues and kills Moemoe, who had mocked him, and Moemoe’s body becomes
    a long rock.
  language: English
  quote_policy: summarized
