  label: TRADITIONAL ACCOUNT OF AN ANCIENT HAWAIIAN PROPHECY / KU-ULA, THE FISH GOD
    OF HAWAII / AIAI, SON OF KU-ULA / PART II OF THE LEGEND OF KU-ULA, THE FISH GOD
