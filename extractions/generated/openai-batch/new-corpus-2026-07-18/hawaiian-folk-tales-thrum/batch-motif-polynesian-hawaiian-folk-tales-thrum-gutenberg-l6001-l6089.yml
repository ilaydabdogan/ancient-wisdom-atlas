canonical_text:
  quote: ''
  summary: Aiai, after teaching fishing at Hana, sends his friend to kill a giant
    wonderful octopus using a kauri shell kept in a fishing gourd. The shell is lowered
    after invoking Ku-ula and Hina; its radiance draws out the octopus, which is killed
    when a stone is forced into its head and it sinks. Aiai then prepares to leave
    Hana to establish other fishing stations and teach fishing knowledge in obedience
    to Ku-ula's injunction. He takes named fishing objects, places fish stones at
    stations, and tests Koanui, where he gives the first fish to Kanemakua and instructs
    him to practice reciprocal generosity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aiai lived at his birthplace until grown, taught the people fishing arts,
    and prepared to visit other places once they were proficient.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before leaving, Aiai told his friend to kill the big hee kupua in the deep
    sea off Wailuanui, and the friend consented.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Aiai brought a hokeo containing the leho that Ku-ula his father had given
    him, and he gave it to his friend.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The canoe party sailed out near the palis by Kopiliula while Aiai watched
    their actions from the pali of Puhiai.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Aiai's friend called on Ku-ula and Hina for assistance before uncovering the
    gourd, taking out the rainbow-colored leho, attaching it to a line, and lowering
    it into the sea, where it emitted fiery light.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The hee came out from its hole, rose to the surface with very large arms,
    frightened the men, and entered the canoes intending to destroy the men and capture
    the leho.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Aiai's friend used a stone by shoving it into the squid's head, and the weight
    drew the squid to the sea bottom, where it died.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The men cut off one arm of the dead squid, loaded it in the canoes, and returned;
    the squid turned to stone and is identified with a stone formation near Wailuanui
    that resembles a squid with one arm missing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: After seeing his friend succeed, Aiai returned to Hana unseen, and the squid
    arm was divided among the people according to Aiai's directions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Aiai called a council, announced his intended departure, and said he would
    establish other fishing stations and instruct people according to Ku-ula his father's
    injunction.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: On leaving Aleamai, Aiai took the named hook manaiaakalani and the fish pearl
    Kahuoi from a little cave, then disappeared in the mysterious manner of his parents.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Aiai established ku-ulas and ko'a aina by placing three fish stones at various
    points as far as Kipahulu; one stone at Kikoo and Maulili is said to remain unmoved
    by freshets.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Koanui is described as an offshore fishing station and boundary where periodic
    fish catches have been divided between fishermen and the landowner.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: When Aiai first tested Koanui, he caught a fish with his noted hook and gave
    it to Kanemakua, an unsuccessful fisherman nearby.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Aiai told Kanemakua that the fish was the first caught at the station, gave
    him charge of the ko'a, and advised him to give a caught fish to a man he met
    in a canoe so that benefits would come to him and his relations.
  category: speech
  evidence_refs:
  - ev:9
