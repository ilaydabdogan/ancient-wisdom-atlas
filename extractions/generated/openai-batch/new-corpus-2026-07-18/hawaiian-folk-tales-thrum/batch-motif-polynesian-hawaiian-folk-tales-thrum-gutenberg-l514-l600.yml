canonical_text:
  quote: ''
  summary: 'The passage summarizes several Hawaiian legends that the compiler and
    cited authorities present as resembling incidents in Old Testament history: a
    hero obtains water of life to revive drowned brothers; oppressed Menehune are
    led from Honualalo toward Kane''s land; Hiiaka and Maui are associated with delaying
    the sun; and an Oahu prophet is swallowed by a whale and returned alive. It also
    reports Fornander''s and Dibble''s comments on possible Biblical coloring, antiquity,
    and contact hypotheses.'
  language: English
  quote_policy: summarized
