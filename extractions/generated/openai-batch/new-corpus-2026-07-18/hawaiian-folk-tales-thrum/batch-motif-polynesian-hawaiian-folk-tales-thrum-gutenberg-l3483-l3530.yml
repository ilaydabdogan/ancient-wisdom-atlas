canonical_text:
  quote: ''
  summary: Waahila Rain dives from the pond of Kanawai through an underground water
    passage opened by an old water god and emerges at Punahou Spring. The waters form
    a basin, and he banks and walls it, then excavates a pond for his sister with
    the god’s invisible help. Kauawaahila later makes kalo patches; people settle
    there and offer themselves as vassals to the twins, and the spring is named Ka
    Punahou, giving its name to the place. Kahaakea returns, kills Hawea and himself
    after hearing of the children’s persecution, and Rocky Hill is named after him;
    Hawea becomes a byword for a cruel stepmother. Mountain Mist and Waahila Rain
    continue to visit Kaala, Konahuanui, upper Manoa, and Punahou, but they leave
    Punahou after foreigners fail to honor them and defile the spring. The passage
    ends by explaining the dryness of Kanawai pond and the absence of gentle rain
    through the disappearance of shrubs and bushes that served as food for the twins.
  language: English
  quote_policy: summarized
