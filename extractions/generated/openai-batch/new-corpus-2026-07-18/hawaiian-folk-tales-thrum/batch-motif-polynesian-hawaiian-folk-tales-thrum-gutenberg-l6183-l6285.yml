canonical_text:
  quote: ''
  summary: Aiai travels through named Hawaiian coastal places establishing fish stones,
    fish stations, and spawning places. On Oahu he marries Puiwa and has a son, Puniaiki.
    After Puiwa refuses to stop fishing while the child cries, Aiai invokes his ancestors;
    a dark cloud brings a flood that breaks the dam and sweeps away the child with
    fish and shrimp. Later a guardian catches a large oopu, and Aiai recognizes it
    as his transformed child. The oopu is kept in a calabash, where it is later seen
    as a human child with the water gone.
  language: English
  quote_policy: summarized
