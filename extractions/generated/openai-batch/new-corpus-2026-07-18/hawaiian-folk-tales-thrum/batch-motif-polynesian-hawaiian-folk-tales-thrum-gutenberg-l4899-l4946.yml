canonical_text:
  quote: ''
  summary: Kauhuhu accepts Kamalo's sacred cause and promises revenge against Kupa
    the King, giving ritual instructions and signs involving a white cloud and rainbow.
    Kamalo performs the instructions and waits. When the signs appear, a storm and
    flood destroy Kupa and his people, while Kamalo and his family remain safe within
    a sacred enclosure. The event is linked to the name Ai Kanaka and a local proverb
    about the rainbow over Mapulehu Valley and the Waiakoloa storm.
  language: English
  quote_policy: summarized
