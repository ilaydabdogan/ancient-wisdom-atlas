canonical_text:
  quote: ''
  summary: Lehuanui is sent away to collect fish and, while sleeping, sees or dreams
    his dead sons revealing that the King has eaten them and hidden their remains
    at a lehua-tree. He returns, finds the skulls and bones where described, kills
    the sleeping King Oahunui with a stone adze, confronts his wife Kilikiliula, takes
    their youngest child, strikes her when she tries to stop him, and leaves. Kilikiliula
    is said to have fallen by the stream opposite the lehua-tree and turned to stone,
    a landmark still pointed out.
  language: English
  quote_policy: summarized
