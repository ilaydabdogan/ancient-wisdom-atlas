canonical_text:
  quote: ''
  summary: Kaaialii, seeking his lost beloved Kaala, leaps into the surf and dives
    through the sea into an ocean cave. Ua witnesses his leap, reports to Kamehameha,
    and with Keawe and Kamehameha goes by canoe toward the cave. In the cave Kaaialii
    finds Kaala wounded and dying; she describes marine dangers, asks for burial among
    flowers and mercy for her father, and dies in his arms. Kamehameha then offers
    Kaaialii Ua, land, fishing grounds, and lordship over Lanai.
  language: English
  quote_policy: summarized
