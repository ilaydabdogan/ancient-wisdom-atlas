canonical_text:
  quote: '"passage from the upper to the nether world"'
  summary: The passage gives variant locations for the Lua o Milu, describes an annual
    procession of ghosts entering it, summarizes traditions about Akea/Wakea and Milu
    as rulers or regions of the dead, and notes leaping places where souls descend
    after death, including comparisons with New Zealand and Marquesan Reinga traditions.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: 'The passage reports two locations for the entrance to the Lua o Milu: out
    to sea opposite Holualoa in the Hiku and Kawelu myth, and more commonly at Keoni
    near the mouth of Waipio valley, where sands concealed the passage.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: An annual ghost procession called Oio is said to march down the Mahiki road
    and enter the Lua o Milu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Waimea man is said to have seen the Oio while walking in the evening and
    hid behind a tree because he believed meeting them would cause his death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ghostly company included Kamehameha, chiefs, warriors, and many old-time
    heroes, all silent and keeping perfect step before disappearing toward Waipio.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Waipio is described as an abode of Akea and Milu, called the first kings of
    the island in the cited account.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: One account says some departed souls went to Po, where they were annihilated
    or eaten by gods, while others went to the regions of Akea and Milu.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Akea is said to have descended after death to a far-below region called Kapapahanaumoku
    and founded a kingdom there; Milu later descended and shared the government with
    him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The land of Akea and Milu is described as dark, with lizards and butterflies
    as food, streams of water, kahilis, and wide-spreading kou trees.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Another account says the ghost first went to Wakea; a soul that observed religious
    rites was entertained and allowed to remain, while a soul that failed was forced
    to leap into Milu below.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Several precipices are identified as places from which unhappy ghosts leap
    into the region of woe, including points on Hawaii, Maui, and Oahu.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: A rock near northwest Oahu called Leina Kauhane is described as a place where
    souls of the dead descended into Hades; the passage also notes New Zealand and
    Marquesan places called Reinga with similar associations.
  category: relationship
  evidence_refs:
  - ev:6
