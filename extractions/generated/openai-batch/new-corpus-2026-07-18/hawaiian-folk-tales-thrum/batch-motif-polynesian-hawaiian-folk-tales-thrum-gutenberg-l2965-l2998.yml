canonical_text:
  quote: Work was begun at the quiet of night, and at cock-crow in the morning it
    was finished.
  summary: The passage says the Menehunes are credited with building several heiaus.
    At Mookini, they pass stones from Pololu Valley to Honoipu in a line and complete
    the temple overnight. At Pepeekeo, after local people gather stones under a chief's
    direction, the Menehunes complete the temple in one night. A heiau on the pali
    of Waikolu is also attributed to them because it stands on an inaccessible cliff
    ledge with seashore stones apparently set in place.
