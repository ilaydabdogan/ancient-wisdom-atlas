canonical_text:
  quote: ''
  summary: Kalelealuaka tests whether to settle by shooting an arrow, sends his companions
    to recover it and gather awa, and remains to build shelter. The companions summon
    the named arrow, receive provisions from the local konohiki, and return to find
    that Kalelealuaka has built a large house. The youths are supplied with mats,
    bedding, girdles, awa, and food. Kalelealuaka then cultivates a long strip from
    mountain toward ocean in one day, while his companions take longer. One companion
    receives the nickname Keinohoomanawanui after an unclean meal and later loses
    sight in one eye after a kukui nut explodes in the fire. At their mountain house
    Lelepua, an all-night torch troubles King Kakuhihewa. Kalelealuaka and Keinohoomanawanui
    discuss wishing; Keinohoomanawanui wishes for food and awa, while Kalelealuaka
    wishes for the king's daughters as wives, royal food, a house, and personal service
    by the king. Keinohoomanawanui fears that such a wish would bring death if the
    king heard it.
  language: English
  quote_policy: summarized
