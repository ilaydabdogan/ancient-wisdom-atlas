canonical_text:
  quote: ''
  summary: The passage presents Kaliuwaa as a locality associated with traditions
    of Kamapuaa. Kamapuaa is described as a demigod or fabulous being able to become
    a hog. After stealing fowls from Olopana, King of Oahu, he is captured, breaks
    his bonds, kills most of the captors, and is later driven by Olopana's army into
    the gorge of Kaliuwaa. There he transforms into a hog, braces himself against
    a precipice, and becomes a ladder by which the remnant of his army escapes. Local
    channels, a rock, a brook place, and trees are identified with him. The passage
    also reports a tradition that Kamapuaa conquered the volcano and that Pele, its
    goddess, became his wife; their harmony is given as an explanation for fewer eruptions
    and no new islands. It ends with a report of visitors making a small stone-and-leaf
    offering to a presiding goddess at the falls for protection from falling stones.
  language: English
  quote_policy: summarized
