canonical_text:
  quote: ''
  summary: After recovering enough to speak, a woman tells relatives and friends that
    she died, left her body, traveled through populous happy settlements of the dead
    toward the volcano or Pele's pit, was told she must return to her body, was driven
    and beaten back, was forced into her body through the big toe, and revived while
    wishing she could have stayed among the happy dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After several days, the speaker was strong enough to call relatives and friends
    and tell them her story.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says she died, left her body, stood beside it, and saw a living
    form of herself looking at the dead body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: She left her house and village and reached another village that appeared enlarged,
    populous, and inhabited by many happy people, including some she knew to be dead.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: She continued through another similarly joyous village and says she seemed
    to be on her way to the volcano, Pele's pit, and could not stop.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Along the road she saw houses and happy people where she had not known anyone
    to live, and she felt joy and gladness at being dead.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: At South Point and through Kau she saw more crowded, happy settlements, and
    at the volcano people told her she had to go back to her body because she was
    not yet to die.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: She begged to stay, but the people said she must go back and would be made
    to go if unwilling.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: She says she was driven back along the same road, beaten when she stopped,
    and that the happy people helped drive her when they saw she was not allowed to
    stay.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the sixty-mile return to her home, she stood beside her body, hated
    it, called it loathsome, and refused to enter it.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Her tormentors pushed her headfirst into the big toe; after struggling until
    she passed the waist, she went the rest of the way herself, her body came to life,
    and she opened her eyes.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: She says she wished she could have stayed with the happy people and describes
    her other body as beautiful and happy.
  category: speech
  evidence_refs:
  - ev:11
