canonical_text:
  quote: ''
  summary: Kapeepeekauila uses plovers to touch Niheu's sacred locks and carry off
    Hina. Niheu and Kana respond; Kana stretches upward against Haupu while Kapeepeekauila
    makes the bluff grow by trimming the kamani tree. Kana first fails, recovers strength
    with his grandmother Uli in Kona, then returns after the kamani branches are destroyed,
    defeats Kapeepeekauila, restores Hina and Mo-i, and tears down parts of Haupu
    into the sea as the Rocks of Kana.
  language: English
  quote_policy: summarized
