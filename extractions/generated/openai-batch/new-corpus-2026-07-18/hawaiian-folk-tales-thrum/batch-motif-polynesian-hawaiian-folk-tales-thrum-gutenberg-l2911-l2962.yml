canonical_text:
  quote: ''
  summary: Kakae's wife wants to seek her brother in Tahiti, so Kakae orders Kekupua
    to find a tree and make a canoe. After an unsuccessful search, Kekupua and his
    men sleep in a cave at Waolani, hear unseen voices, and see a heiau-like stone
    mound at dawn. Kakae, identified as a descendant of the Menehunes, instructs Kekupua
    how to wait for and direct the Menehunes, who have finished the canoe. Kekupua
    sees the diminutive people, directs the canoe-hauling route, and the canoe is
    left in a ditch and named for him. The wife's desire remains unsatisfied.
  language: English
  quote_policy: summarized
