canonical_text:
  quote: ''
  summary: Kaopele is born not breathing, placed in a cliff cave, and later reappears
    alive amid storm, earthquake, and rainbows. He repeatedly enters death-like trances,
    explains that his spirit travels with the goddess Poliahu, departs among islands,
    and finally is carried as a corpse to a Kauai temple altar for sacrifice, where
    after six moons he revives and is received by nearby householders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kaopele is born in Waipio without breathing; after several days his parents
    place his washed and clothed body in a small cave in a cliff.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The body remains in the cave for six months, from the summer month Ikiki to
    the winter month Ikua.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A storm with thunder, lightning, and earthquake occurs, and eight rainbows
    appear over the mouth of the cave as the child's voice calls to his parents.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The father goes to the cave, does not find the body there, and sees the child
    perched in a tree braiding a wreath of scarlet lehua flowers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Six months after being brought home, Kaopele again lies without breath and
    appears dead; six moons later his parents hear him call during thunder, lightning,
    and earthquake.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: Kaopele tells his parents that the marvel is a trance and that, during deep
    sleep, his spirit floats in the upper air with the goddess Poliahu.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kaopele says he can circle Hawaii, Maui, Oahu, and Kauai in a day and intends
    to live on Kauai when grown.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: After growing up, Kaopele says farewell, sleeps, is gone, and alights at Kula
    on Maui, where people eat his crops while he is in deep sleep.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Kaopele plants at several Oahu places, but further intervals of sleep prevent
    him from eating the crops, which are wasted or neglected.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: At Lahuimalo, Kaopele enters trance while bathing in a river; his lifeless
    body is carried by stream and ocean to the sands of Maea in Waialua.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A man from Kauai seeking a human body for sacrifice obtains permission to
    take Kaopele's corpse by canoe to the temple of Kahikihaunaka at Wailua, Kauai.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Kaopele is placed on the temple altar with another corpse; after six moons,
    at midnight amid thunder and earthquake, he comes to life and descends from the
    altar.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:13
  text: After reviving, Kaopele walks toward a light shining through a neighboring
    house and is welcomed by the occupants.
  category: action
  evidence_refs:
  - ev:11
