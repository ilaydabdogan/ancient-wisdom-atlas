canonical_text:
  quote: ''
  summary: The lame marshal recognizes Kalelealuaka and identifies feather cloaks
    and helmets worn by the king’s daughters and Kalelealuaka as trophies taken from
    defeated captains. He praises Kalelealuaka and asks him to show the spear wound
    on his left arm. Kalelealuaka displays the wound before the assembly. Kakuhihewa
    then gives charge of the kingdom to Kalelealuaka and his daughters and says he
    will become a commoner. The lands are rearranged and the country remains peaceful
    until the deaths of Kakuhihewa and Kalelealuaka.
  language: English
