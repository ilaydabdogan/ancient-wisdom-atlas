canonical_text:
  quote: ''
  summary: Nanaue, a young man with a shark-mouth hidden under a mantle, spends time
    near pools and the sea while people begin to disappear. He warns beachgoers, follows
    solitary people into the sea, changes into a shark, and devours them. When King
    Umi orders compulsory labor, Nanaue is exposed in the field after others tear
    off his mantle. The king orders him burned, but Nanaue invokes his shark-god father,
    breaks his bonds, escapes to the sea pool, transforms into a large shark, defies
    the crowd, and swims away. The people then seize his mother Kalei and her brothers
    and demand punishment.
  language: English
  quote_policy: summarized
