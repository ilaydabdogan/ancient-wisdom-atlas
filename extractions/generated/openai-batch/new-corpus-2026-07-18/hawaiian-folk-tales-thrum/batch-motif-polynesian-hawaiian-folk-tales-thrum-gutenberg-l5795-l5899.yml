canonical_text:
  quote: ''
  summary: Aiai responds to failed royal fishing after Ku-ula and Hina have withdrawn
    the fish. He retrieves and installs the stone fish god Pohaku-muone, instructs
    his friend in its observances, establishes the first land ko'a ku-ula and the
    first-catch offering, summons hinalea fish into a pool, predicts King Kamohoalii's
    death by fish, and the prediction is fulfilled. The passage concludes that revenge
    is complete and that Aiai later establishes fishing ko'as across the islands and
    measures sea depths for deep-sea fishing sites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Kamohoalii orders the people of Hana to fish for hinalea, and they obey
    by going to the shore with fishing baskets.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fishers cannot find the usual bait or see fish in the sea; the passage
    explains this by saying Ku-ula and his wife had taken all fish and everything
    pertaining to fishing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Aiai takes his friend to the cave where he had stayed after his father's house
    was burned and shows him the stone fish god Pohaku-muone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aiai carries the stone to Lehoula, places it facing the pond made by his father,
    invokes Ku-ula as father and Hina as mother, and assigns care of the stone to
    his friend and the friend's descendants.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Aiai instructs his friend in duties connected with the stone, and the passage
    identifies this as the first establishment of the land ko'a ku-ula and the first-catch
    offering of two fishes to Ku-ula.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Aiai asks the unsuccessful fishers for two baskets, places them in a small
    pool near the beach, calls on his parents for hinaleas, and fish fill the pool.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Aiai directs his friend to bring his parents and relatives for the first pick
    of fish, gives two fish to be placed on the ko'a, and foretells that King Kamohoalii
    will die before sunset, choked by fish.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: People gather hinaleas in abundance, and when fish are brought to King Kamohoalii
    he puts one in his mouth; it lodges in his throat and he dies before sunset.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that the king's death completes revenge and retribution
    against Aiai's father's enemies.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After remaining at Hana for a time, Aiai travels among the islands establishing
    fishing ko'as and is described as the first to measure sea depth to locate deep-sea
    fishing ko'as.
  category: action
  evidence_refs:
  - ev:9
