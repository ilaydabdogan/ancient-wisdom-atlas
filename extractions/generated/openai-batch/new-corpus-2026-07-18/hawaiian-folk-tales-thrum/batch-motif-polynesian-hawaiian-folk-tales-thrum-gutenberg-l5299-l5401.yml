canonical_text:
  quote: ''
  summary: 'A Hawaiian priest, Kaopulupulu, counsels King Kahahana and foretells from
    clouds that the king''s reign will be short and that the king will kill him and
    his child. After the king ignores the priest''s admonitions, omens of death appear:
    a rainbow in the doorway, broken prayer, and a messenger marked by his manner
    of wearing kapa. Kaopulupulu and his son obey the royal summons despite a possible
    escape by canoe, travel toward Waianae, and at a sacred boundary by the sea the
    priest prophesies that sacred lands will be seized by a chief from the east.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king sets apart a house for conference with Kaopulupulu, who answers questions
    with wisdom according to his profession.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the conference Kaopulupulu sits in the doorway near sunset, sees short
    clouds in the sky, and says they reveal the manner of the king's reign.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kaopulupulu tells Kahahana that the king's road is broad, the kahuna's path
    is narrow, the king's reign will not be many days, and the king will slay him
    and his child.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Kaopulupulu says that if the king dies the lands will be desolate, that the
    kahuna's name will live on, and that his own death will come before the king's.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king later makes Kaopulupulu his priest and companion, and Kaopulupulu
    counsels him in the care of his subjects.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: After three years the king attempts a wrong against certain subjects; Kaopulupulu
    remonstrates, the king does not heed him, and Kaopulupulu returns to Waimea and
    tattoos his knees as a sign that the king has turned a deaf ear.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Rumors reach Kaopulupulu that he will be summoned because the tattooing has
    angered the king, and Kahahana sends messengers to fetch Kaopulupulu and his son
    Kahulupue.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the morning of the messenger's arrival, a rainbow stands in Kaopulupulu's
    doorway, his prayer to his god is broken, and the same result follows when his
    son prays.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kaopulupulu interprets the broken prayer and the approaching man with kapa
    fastened on the left side of the neck as signs of a death message.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: A man then appears as Kaopulupulu described and delivers the king's order
    that Kaopulupulu and his son go to Waianae.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Kaopulupulu tells his son to dress, put on the malo, eat, and go as commanded,
    saying that the journey will place them on the altar and that death should not
    be feared.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Kahulupue weeps for his relatives, the household voices distress, and Kaopulupulu
    remains unmoved while saying he sees the end that will befall the king and his
    court.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: During the journey Kahulupue finds a large canoe and proposes that he and
    his father flee by night to Kauai, but Kaopulupulu declines flight.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Kaopulupulu looks back toward the place of his birth and weeps because he
    expects not to see it again.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: At the temple of Puaakanoe, described as a sacred boundary, Kaopulupulu and
    his son swim in the sea along the coast of Makua.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Kaopulupulu says that because the high priests are drenched by the sea, sacred
    lands from Waianae to Kualoa will be seized by a chief from the east.
  category: speech
  evidence_refs:
  - ev:9
