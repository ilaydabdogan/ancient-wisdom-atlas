canonical_text:
  quote: ''
  summary: The passage presents a Hawaiian legend in which Pele, associated with volcanic
    phenomena, is also linked to an ancient flood. It gives Pele's genealogy, marriage,
    children, and deserted state after her husband is enticed away. Seeking him, Pele
    travels toward Hawaii with the sea given by her parents, pours the sea forth as
    she goes, and the waters rise until only high mountains remain visible before
    receding to their present level. The event is named the Sea of Kahinalii because
    Pele received the sea from her mother. Pele and her family later settle in Hawaii,
    and Pele moves through several islands and craters before remaining at Kilauea.
  language: English
  quote_policy: summarized
