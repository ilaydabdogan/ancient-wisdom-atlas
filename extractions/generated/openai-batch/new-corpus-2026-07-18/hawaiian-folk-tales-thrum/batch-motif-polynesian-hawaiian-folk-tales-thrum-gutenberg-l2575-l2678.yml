canonical_text:
  quote: ''
  summary: After soldiers praise Keinohoomanawanui and disparage Kalelealuaka, Kalelealuaka
    secretly goes to a new battle against Kualii, transports Maliuhaaino, kills slanderers,
    exposes and beheads Keinohoomanawanui, takes the enemy captain's feather cloak
    and helmet, spares Kualii after surrender, returns home, and is later identified
    by a left-arm wound when the king summons people for review. Kalelealuaka then
    displays hidden feather cloaks and helmets and proceeds with his household to
    the king.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Soldiers pass Kalelealuaka's door, praise Keinohoomanawanui, and say Kalelealuaka's
    two wives would be better given to Keinohoomanawanui.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cripple reports to the king that a third warrior showed great valor, killed
    those who spoke against him, killed Kualii's captain, took a feather cloak and
    helmet, and carried the cripple partway back.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A report says Kualii has an army at Kahapaakai in Nuuanu, and Maliuhaaino
    marshals forces for battle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kalelealuaka tells his wives to breakfast apart from him and tells Kaluhe
    to keep the dogs barking until he returns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kalelealuaka springs away, reaches Kapakakolea, overtakes the cripple, lifts
    him, and sets him down at Waolani.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the battle, Kalelealuaka kills those who reviled him and then makes a great
    slaughter among Kualii's soldiers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Kalelealuaka asks Keinohoomanawanui about his blinded eye; Keinohoomanawanui
    says it was lost by a spear in combat with Olopana, but Kalelealuaka says it came
    from a kukui nut bursting in the fire at Wailuku.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Keinohoomanawanui's spear wounds Kalelealuaka's left arm, leaving the spear-head
    in the wound; Kalelealuaka then kills and beheads him.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Kalelealuaka presents Keinohoomanawanui's head to Maliuhaaino, returns to
    the battle, kills the captain of Kualii's forces, and takes his feather cloak
    and helmet.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Kualii flees up Nuuanu Valley, surrenders to Kalelealuaka, offers the land
    to Kakuhihewa, and promises to live loyally; Kalelealuaka spares him with a warning
    against future rebellion.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Maliuhaaino carries the head of Keinohoomanawanui homeward, and Kalelealuaka
    alights at his house, disposes of his spoils, and calls his wives to rejoin him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Maliuhaaino reports the successful battle, says the head was placed on an
    altar mauka of Kalawao, and advises the king to summon people so he can identify
    the bravest warrior by a left-arm wound.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The runners Keakealani and Kuhelemoana summon men from the king's domain;
    men from several districts are reviewed, but the man with the sought mark is not
    found among them.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Maliuhaaino tells the king to summon his son-in-law, saying he is the man;
    the king goes to the house of his son-in-law and daughters.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: Kalelealuaka lifts the mats of his bed, takes out feather cloaks and helmets,
    arrays his two wives, Kaluhe, and himself, places them in line, and marches to
    obey the king's command.
  category: action
  evidence_refs:
  - ev:12
