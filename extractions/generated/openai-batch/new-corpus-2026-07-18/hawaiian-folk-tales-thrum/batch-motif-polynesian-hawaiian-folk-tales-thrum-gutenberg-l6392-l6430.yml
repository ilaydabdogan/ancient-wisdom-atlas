canonical_text:
  quote: ''
  summary: Puniaiki brings aku fish under Aiai's direction, first as an offering to
    Ku-ula at a ko'a and then as food for his mother Puiwa. Fish become abundant in
    the harbor and stream, and Puniaiki tells the people to take them freely. Kou,
    whose reputation as a fisherman is affected, responds without anger and yields
    the fishing work. Aiai and Puniaiki then establish ku-ulas, ko'as, and fish stones
    around Oahu and visit other islands for related fishing-site work. The passage
    ends by contrasting former fish abundance with reduced abundance in the present
    era.
  language: English
  quote_policy: summarized
