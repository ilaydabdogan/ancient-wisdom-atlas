canonical_text:
  quote: ''
  summary: Kaopele is welcomed into a household, arranged as husband for Makalani,
    and begins married life. He leaves at night and early morning to create a large
    plantation and to catch an enormous quantity of fish. When Makalani is pregnant,
    he instructs her to name a son Kalelealuaka, foretells a habitual six-month sacred
    sleep, warns that his body must not be buried, and then enters the Niolo-kapu
    sleep. On the sixth day, his father-in-law judges the rigid, cold, breathless
    body to be dead and urges burial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Food is set before the hero, and an old man who appears to head the household
    is impressed enough to seek him as husband for his granddaughter Makalani.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Makalani is awakened at night to hear the marriage proposal; her parents favor
    the suit, and she asks that the suitor be brought to her rather than that she
    first seek him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kaopele and Makalani find favor with each other, are assigned a separate house,
    and begin married life.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the bridal night, Kaopele leaves his sleeping bride, goes mauka to
    an upland plain, clears it, gathers shoots and roots, and makes the whole plain
    a plantation before day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Makalani wakes, alerts her parents that her husband is gone, and later questions
    Kaopele when he suddenly returns and says he had been working.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Makalani reproves Kaopele for interrupting their bridal night with agriculture
    and points to her father's nearby ground as an alternative to the wild-hog plain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Kaopele answers that his hand constrains him to plant, that idleness brings
    nothing, and that working the soil provides food for family and friends.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Very early the next morning, Kaopele borrows a fishhook and tackle, fishes
    in the ocean, catches an enormous quantity of fish, returns the tackle, and gives
    half the catch to the lender.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: When Kaopele throws the fish down at home, Makalani and her parents wake;
    Makalani says she had looked for him in the field and saw that the whole plain
    was covered by his plantation.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the crops are ripe and Makalani is pregnant, Kaopele tells her to name
    a boy Kalelealuaka, but to name a girl from her own side of the family.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Makalani suspects that Kaopele intends to desert her.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Kaopele says he will not forsake her in the ordinary manner, but foresees
    that a habitual deep sleep will fall upon him on the following night and last
    six months.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Kaopele commands Makalani not to cast him out or bury him, explains how he
    came from Oahu to Kauai and became her husband, and tells her to obey his commands.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: Friends and neighbors gather; some remark that Kaopele was the man placed
    on the altar of the heiau at Wailua.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: At evening Kaopele says he will be separated from them for six months but
    that his body will remain if they obey his commands; he kisses Makalani and falls
    into the sacred sleep of Niolo-kapu.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: On the sixth day, the father-in-law urges burial because he sees the body
    as rigid, cold, not breathing, and therefore dead.
  category: speech
  evidence_refs:
  - ev:13
