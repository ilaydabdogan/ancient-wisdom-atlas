canonical_text:
  quote: This was perhaps the origin of sickness and the art of healing with medicines
    in Hawaii.
  summary: The passage describes godly visitors from Kahiki whose travels through
    the Hawaiian Islands are followed by diseases and deaths, while Kamakanuiahailono
    follows with healing powers. He heals the chief Lono after a foot wound, transmits
    and teaches healing knowledge to him, and Lono, renamed Lonopuha, becomes a famous
    healer who cures Milu and prescribes convalescence in a leaf house.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A group of people with wives came from Kahiki, were described as of godly
    kind, traveled through the islands, and settled above Waipio.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Diseases and many deaths appeared on every island visited by the Kahiki group;
    chills, fevers, headache, and pani are named among the diseases.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The named death-bringing figures include Kaalaenuiahina, Kahuilaokalani, and
    Kaneikaulanaula; Kamakanuiahailono followed after them with healing powers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Kiolakaa, Kamakanuiahailono noticed Lono's red skin and identified him
    as very sick, while local people described Lono as healthy, a chief, and a farmer.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lono struck his own foot with an oo digger, causing it to be pierced, bleed
    freely, and making him faint.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man brought a pig to Kamakanuiahailono while reporting Lono's misfortune,
    and Kamakanuiahailono returned to treat Lono.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kamakanuiahailono gathered young popolo seeds and tender leaves, pounded them
    with salt, placed the mixture on the wound with a coconut covering, and the bleeding
    ceased by night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After being healed, Lono resigned his offices to successors and followed Kamakanuiahailono
    to be taught the art of healing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The kahuna lapaau told Lono to open his mouth and spat into it, after which
    the passage says Lono would become proficient in the calling he had chosen.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: As they traveled, Kamakanuiahailono instructed Lono, now called Lonopuha because
    of the foot accident, in diseases and medicines.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Kamakanuiahailono advised Lonopuha to live apart so that his healing practice
    could gain recognition through his own skill.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Lonopuha settled in Waimanu, practiced healing, and became famous as a skillful
