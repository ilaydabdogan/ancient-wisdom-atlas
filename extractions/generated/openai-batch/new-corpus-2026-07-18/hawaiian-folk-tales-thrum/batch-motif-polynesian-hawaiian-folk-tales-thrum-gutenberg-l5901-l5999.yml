canonical_text:
  quote: ''
  summary: Aiai, son of Ku-ula, travels through Hana and nearby places, raises or
    places stones and pebbles associated with fishing grounds, declares the return
    of sea foods, teaches fishing methods, appoints an unnamed friend as head fisherman,
    and is credited by local people with restoring or attracting abundant fish through
    these stones and stations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aiai leaves the people of Haneoo and goes to Kumaka, a place with freshwater
    springs near the surf of Puhele at Hamoa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Kumaka, Aiai raises a large long stone upright, places other stones around
    the spring, and names the raised stone Ku-a-lanakila.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Aiai declares that fishes, crabs, and sea-moss will again return in plenty
    throughout the seas of Hana.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Later people visit the stone Ku-lanakila, and some kahunas advise sick patients
    to bring offerings there and bathe in the spring and surf for relief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage identifies the Kumaka stone as the first ku-ula raised by Aiai
    at Hamoa, and old people of Hana attribute the return of fish to its influence.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: After Aiai follows his father's instructions and the fishes return, his fame
    spreads in the district.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Aiai teaches his friend and his friend's parents how to make fishing nets
    and fishing lines, then appoints his friend head fisherman of Hana with control
    over the fishing stations he established.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Aiai establishes named fishing stations, including Kapukaulua near Aleamai,
    a second station near Haneoo and Hamoa, and Koauli in the deep sea.
  category: setting
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The Koauli station must be located by shore bearings, and the passage says
    Aiai's stations avoid coral ledges that would catch hooks or entangle lines.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Wananalua and Kauiki, Aiai places a ku-ula and a fish stone, and people
    of Hana credit the stone with the appearance of akule, oio, moi, and other fish.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Honomaele, Aiai places three pebbles beyond the surf; the pebbles gather
    others into a ridge, and aweoweo gather there for people to catch.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At Waiohue, Aiai places a stone on the rocky islet Paka, and the passage says
    kala and other fish are attracted to the locality in abundance.
  category: sequence
  evidence_refs:
  - ev:9
