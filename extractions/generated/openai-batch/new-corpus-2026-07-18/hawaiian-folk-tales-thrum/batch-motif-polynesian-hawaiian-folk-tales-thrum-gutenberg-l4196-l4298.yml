canonical_text:
  quote: ''
  summary: Kaaialii and Kaala exchange a tender farewell while Opunui takes Kaala
    away under the stated pretext of visiting her mother. During the journey Opunui
    turns toward the sea, reveals that the mother was not sick, and says Kaala is
    to go down to the sea god's realm until Kaaialii leaves. He brings her to a dangerous
    spouting sea cave, where Kaala fears the sea snake within and begs not to be put
    there.
  language: English
  quote_policy: summarized
