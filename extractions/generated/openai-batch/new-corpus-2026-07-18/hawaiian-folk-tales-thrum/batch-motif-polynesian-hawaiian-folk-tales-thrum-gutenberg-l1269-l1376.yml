canonical_text:
  quote: ''
  summary: Lonopuha warns King Milu to remain quietly confined and not open the ti-leaf
    covering of his house in response to cheering or sports. Milu first resists commotion
    caused by birds, but later looks out at a large feathered bird, which strikes
    him and takes his life. Lonopuha follows the bird, retrieves blood from the place
    where it entered a sunken rock with Milu's liver, treats the wound, and Milu recovers.
    Lonopuha warns that another death remains. Later, Milu ignores restraint during
    high surf, goes surf-riding, disappears in the surf, and is presumed dead. The
    next section begins with Kalima, a woman in Kona, dying after illness; her family
    prepares her body for burial and mourns until she suddenly breathes, opens her
    eyes, revives, and says she has something strange to tell.
  language: English
  quote_policy: summarized
