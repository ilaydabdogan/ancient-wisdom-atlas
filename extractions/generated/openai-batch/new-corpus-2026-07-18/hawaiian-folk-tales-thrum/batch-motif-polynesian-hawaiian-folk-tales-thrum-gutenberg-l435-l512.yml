  text: Lua-nuu is described as a tenth-generation descendant of Nuu and as the first,
    by command of his god, to introduce circumcision among his descendants.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lua-nuu left his native home, traveled far away to Honua-ilalo, and received
    names connected with that journey.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: God ordered Lua-nuu to go up on a mountain and perform a sacrifice; Lua-nuu
    was directed eastward to a sharp-peaked hill projecting into the ocean.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Lua-nuu traveled eastward by boat with his son Kupulu-pulu-a-Nuu and his servant
