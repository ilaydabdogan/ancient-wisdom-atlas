  text: Nuu, also called Nana-nuu, built a large vessel with a house on top by command
    of his god.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nuu, his wife Lilinoe, his three sons, and the sons' wives were saved in the
    vessel.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the flood subsided, Kane, Ku, and Lono entered Nuu's vessel and told
    him to go out; he found himself on Mauna Kea.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nuu named a cave on Mauna Kea after his wife Lilinoe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Nuu brought a pig, coconuts, and awa from the vessel as an offering to Kane.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nuu saw the moon, mistook it for Kane, worshipped it, and made offerings;
    Kane descended on a rainbow, reproved him, and pardoned him after he asked forgiveness.
  category: sequence
  evidence_refs:
  - ev:3
