canonical_text:
  quote: ''
  summary: The passage summarizes Hawaiian legends about Nuu surviving a world-destroying
    flood in a divinely commanded vessel, his later offering and mistaken worship
    of the moon, the descendant Lua-nuu and commanded rites, sacrifice, migration,
    genealogy, and a separate account of Waikelenuiaiku, a beloved son cast into a
    pit by brothers who later interprets prison dreams and is elevated by a king.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A flood called Kaiakahinalii came upon the earth and destroyed all living
    beings.
  category: action
  evidence_refs:
  - ev:1
