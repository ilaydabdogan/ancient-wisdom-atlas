  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The legend identifies Lua-nuu as ancestor of twelve children through his grandson
    and as founder of the Menehune people from whom the Polynesian family descends.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Waikelenuiaiku was one of ten brothers with one sister, was beloved by his
    father Waiku, and was hated by his brothers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Waikelenuiaiku's brothers carried him and cast him into a pit belonging to
