canonical_text:
  quote: ''
  summary: The passage describes Kukaniloko as the ancient sacred birth site of Oahu
    rulers, with birth there required to preserve royal rank. It then introduces nearby
    Helemano and Oahunui, the settlement of the Lo Aikanaka cannibal strangers, and
    the young King Oahunui's household. The Lo Aikanaka cultivate the king through
    feasts, where a dish suspected to be human flesh is served as pork. The king becomes
    a frequent guest, ambushed travelers disappear to supply the food, and the people,
    chiefs, and high priest object. The king promises to stop visiting them; the passage
    ends with a domestic meal and his request for fish from Ukoa pond.
  language: English
  quote_policy: summarized
