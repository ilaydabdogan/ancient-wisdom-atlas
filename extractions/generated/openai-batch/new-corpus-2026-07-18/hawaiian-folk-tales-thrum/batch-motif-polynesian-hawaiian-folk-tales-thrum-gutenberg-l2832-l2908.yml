canonical_text:
  quote: ''
  summary: Laka-a-wahieloa is raised by his grandmother after his father Wahieloa
    goes to Hawaii for a toy and is killed in a cave. Laka asks how to search for
    his father, and his grandmother instructs him to find a mountain tree with moon-shaped
    leaves for a canoe. After Laka repeatedly cuts trees that disappear or are restored,
    he hides in a trench under a newly felled tree, hears a chant invoking Akua, and
    catches Mokuhalii and Kapaaikee among the tree-raisers. Mokuhalii offers to make
    and move the canoe if Laka spares them, builds a large halau, and prepares food.
    Laka does so; the Menehunes finish the canoe and carry it by hand at night to
    the halau, where food is laid out for them before they return home at dawn.
  language: English with Hawaiian names, terms, and chant
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wahieloa is identified as a chief living at Kalaikoi, Kipahulu, Maui; he takes
    Hinahawea as wife, and their son Laka-a-wahieloa is raised by Hinahawea's mother
    Hinahowana at Alaenui.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wahieloa goes to Hawaii seeking the Ala-Koiula a Kane as a toy for his son
    and is killed in a cave called Keana-a-Kaualehu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a long absence, Laka asks about his father; his grandmother says the
    father went to Hawaii and is supposed to be dead, and Laka asks for means to search
    for him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hinahowana tells Laka to go to the mountains and look for a tree whose leaves
    are shaped like the moon on the night of Hilo or Hoaka, saying that such a tree
    is for a canoe.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Laka finds and fells a suitable canoe tree, but when he returns the next day
    the fallen tree is gone; the same result happens with another tree, and he is
    tricked for several days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Laka cuts another desired tree after digging a large hole or trench where
    it will fall, then jumps into the trench and hides to wait for whoever is reerecting
    the trees.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: While hidden, Laka hears people talking about raising the tree and returning
    it to its former position, followed by a chant invoking Akua and mountain places.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the appeal, a hum and noise are heard, the place fills with a band of
    people, and they try to lift the tree, but it does not move.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Laka jumps from hiding, catches Mokuhalii and Kapaaikee, and threatens to
    kill them for raising the canoe trees he had cut.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Mokuhalii tells Laka that if the captured men are killed nobody will make
    or pull the canoe, but if spared they will do so if Laka builds a large halau
    and prepares enough food.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Laka releases the men, builds a halau at Puhikau, then goes to the woods and
    finds the canoe ready and complete; the Menehunes say it will be brought to the
    halau that night.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: At dead of night the Menehunes' voices hum as they lift the canoe; it is carried
    by hand, not dragged, and reaches the halau after three hums or stages.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Food and fish are spread out for the workers, including taro ha, opae, and
    oopu; at dawn the Menehunes return home.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The halau is named Kuahalau, and the passage says its foundation remains had
    been visible until ploughed over, while Laka's dug hole still exists.
  category: setting
  evidence_refs:
  - ev:11
