canonical_text:
  quote: ''
  summary: Pi, an ordinary man of Waimea, Kauai, commissions the Menehunes near Puukapele
    to prepare stones and build a dam and watercourse. The Menehunes work at night,
    complete the Waimea River dam and stone watercourse before dawn, and receive shrimps
    as food from Pi. Their return to Puukapele is linked to a saying about the hum
    of their voices. The watercourse is said to remain visible. A second project,
    a fish-pond wall at Huleia River, remains incomplete because dawn came before
    the walls met.
  language: English
  quote_policy: summarized
