canonical_text:
  quote: ''
  summary: Kana retrieves and comforts an old man, hears his grief, and takes up Hakalanileo's
    cause against Kapeepeekauila. Kana commands his younger brother Niheu to prepare
    for a canoe voyage, then himself produces twin canoes and sets out with a magic
    rod. On the voyage to Haupu, Niheu uses the rod at Kana's command to overcome
    rocks, a wall of water, a monster fish, a shark, and a turtle, while further obstacles
    entangle the mast. At Haupu, Niheu is sent to recover Hina, Kana's mother, fails
    twice at the shore, then reaches Hale-huki, enters a forbidden door, takes Hina
    by the hand, and leads her away. Kapeepeekauila notices her departure, and Mo-i,
    Kana's sister, challenges him to fight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kana reaches from the house, grasps an old man at a distance, brings him back,
    seats him on his lap, and weeps; his tears are described as winter rains soaking
    the plain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kana orders Niheu to light a fire so the old man can dry himself and then
    tell his story.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After hearing the old man's grief, Kana says he has found a worthy foeman
    and takes up the cause of Hakalanileo.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kana orders his younger brother Niheu to construct a canoe; Niheu toils unsuccessfully
    and complains that Kana destroys the canoe with his foot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kana tests Niheu by asking him to pull up a small bush, which Niheu cannot
    loosen.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kana stretches out his hands among the forests and produces two canoes, named
    Kaumueli, then provides paddles and appoints fourteen rowers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kana embarks with the magic rod Waka-i-lani, and the group sets out to wage
    war upon Kapeepeekauila.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the canoes ground on the reefs and ledges of Haupu, Niheu strikes with
    Waka-i-lani and the rocks crumble, freeing the canoes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A wall of water threatens the canoes; after Niheu strikes with the rod, the
    wall divides and the canoes pass safely through.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A monster fish approaches the canoes; Niheu strikes it, and it is brought
    aboard as food for all.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A sharp-toothed shark and then a great turtle, both described as defenses
    of Haupu, are killed by strokes of the magic rod.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: During the night and at morning, the canoes' mast becomes entangled first
    in tree branches and later in weeds above; Niheu frees the mast with a stone in
    one case, and Kana pulls down weeds and earth in the other.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:13
  text: Kapeepeekauila's people on top of Haupu look down at the canoes and mistake
    them for a load of opihis from Hawaii for Hina.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Kana sends Niheu to get his mother and tells him to go in friendly fashion.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: 'Niheu fails twice when landing: first he slips on smooth rocks, and then
    sand-crabs scratch sand into his eyes.'
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: Niheu succeeds on his third attempt, climbs to the top of Haupu, enters Hale-huki
    through a forbidden door, and finds Kapeepeekauila and Hina there.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: Niheu seizes Hina's hand, says they should go, and Hina rises and goes with
    him.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: Kapeepeekauila notices that the woman is gone, and Mo-i, Kana's sister, tells
    him that if he wants the woman, he and Mo-i should fight.
  category: speech
  evidence_refs:
  - ev:13
