canonical_text:
  quote: ''
  summary: An aged local resident recounts that after two men set up a strangely found
    stone, they dreamed of Kaneaukai, petitioned him for abundant fish, and learned
    that the stone they had honored was Kaneaukai himself at their shore. Continued
    faithfulness and offerings were said to ensure fishing success, and local fish
    runs were treated as confirmation. Later, a road supervisor broke part of the
    deified stone; local people interpreted his subsequent misfortunes and deaths
    among relatives as recompense for the sacrilegious act.
  language: English
  quote_policy: summarized
