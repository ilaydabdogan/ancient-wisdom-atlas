canonical_text:
  quote: ''
  summary: Eleio, a royal trained runner and kahuna serving King Kakaalaneo of Maui,
    is sent to fetch awa. On the way he pursues a beautiful young woman who leads
    him across difficult terrain to a mortuary puoa. She reveals herself as a spirit,
    asks for friendship, and directs him to her parents to receive a hog, kapas, mats,
    and an unfinished feather cloak with materials to complete it. Eleio verifies
    her body in the puoa, delivers the message to her parents, and directs the kin
    group to build a foliage-covered lanai with an altar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eleio is described as a kukini, a trained runner in the service of Kakaalaneo,
    King of Maui; kukinis are described as exceptionally swift royal messengers with
    special privileges.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eleio is sent to Hana to fetch awa for the king and is expected back by the
    king's supper while Kakaalaneo is living at Lahaina.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Eleio is also described as a kahuna initiated in observances that allow him
    to see spirits or wraiths, and as skilled in medicines and charms.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Eleio could return a wandering spirit to its body
    unless decomposition had begun.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: After leaving Olowalu and ascending Aalaloloa, Eleio sees a beautiful young
    woman ahead of him and tries to overtake her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The young woman keeps ahead of Eleio and leads him over rocks, hills, mountains,
    ravines, precipices, and dark streams to Hanamanuloa, where he catches her at
    a puoa entrance.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: A puoa is explained as a tower, generally of bamboo, with a platform where
    bodies of distinguished persons of certain families or classes were exposed to
    the elements.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: When caught, the young woman says she is not human but a spirit, says the
    enclosure is her dwelling, and asks Eleio to let her live.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The spirit asks to be friends and sends Eleio to her parents and relatives
    for a hog, kapas, fine mats, and an unfinished feather cloak with materials to
    finish it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Eleio enters the puoa, climbs to the platform, and sees the girl's dead body,
    which resembles the spirit and has apparently not begun decomposing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Eleio delivers the spirit's message to the parents; after hearing his description,
    they recognize it as truthful and agree to give him the things their daughter
    has given away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The parents say the people nearby are relatives of the spirit and that the
    spirit seems to have adopted Eleio either as husband or brother.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Eleio directs the relatives to build a large lanai covered with ferns, ginger,
    maile, and ieie, with a decorated altar at one end; the structure is completed
    within a couple of hours.
  category: action
  evidence_refs:
  - ev:9
