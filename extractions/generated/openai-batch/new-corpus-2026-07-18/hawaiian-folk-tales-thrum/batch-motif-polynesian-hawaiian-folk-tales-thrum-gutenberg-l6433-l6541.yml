canonical_text:
  quote: ''
  summary: A Waialua legend recounts how Kaneaukai, a fish-providing deity, is associated
    with wooden and stone images found by poor worshippers and kahuna-fishermen. Kaneaukai
    appears as a young man, validates the images, gives instructions that lead to
    fish abundance, sends young men to retrieve the wooden image with meteor guidance,
    and is later linked to surviving stone-idol offerings after anti-idol laws.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two old men at Mokuleia, Waialua, pray to Kaneaukai for a plentiful supply
    of fish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two old men find a log of wood resembling a human form, take it home,
    and set it in a corner of their hut.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A handsome young man enters the hut, identifies himself as Kaneaukai, and
    says the wooden object is his image.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kaneaukai tells the old men to pour the awa back into the bowl and divide
    it into three portions before the meal is shared.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After supper, Kaneaukai directs the old men to Keawanui; they obtain three
    fish, give one to an old sorceress, and later the Mokuleia fishermen secure an
    unusually large school of fish.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Two kahunas who are also fishermen at Waimea repeatedly catch a calcareous
    stone and a pilot fish in their net, three times in succession.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Waimea kahunas conclude that the stone represents a god, set it up as
    an idol, and build an enclosure around it on the bluff south of Waimea harbor.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kaneaukai appears to the Waimea kahunas as a young man, approves the stone
    image, and instructs them to bring his wooden idol from Mokuleia and set it beside
    the stone idol.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Two young men are sent to Mokuleia; a meteor goes before them and shows how
    to avoid quicksands while crossing the river.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The young men find the wooden idol in the hut, carry it back with dried fish,
    and the next day the kahunas set it in the same enclosure as the stone representative
    of Kaneaukai.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The passage reports that the wooden image later disappeared, probably during
    Kaahumanu's anti-idol burning campaign, while the stone idol survived and secretly
    received roast-pig offerings.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The closing note says accounts differ and that a Waialua deacon treated the
    story as true on the authority of an old man who identified one of the young retrievers
    as his grandfather.
  category: other
  evidence_refs:
  - ev:9
