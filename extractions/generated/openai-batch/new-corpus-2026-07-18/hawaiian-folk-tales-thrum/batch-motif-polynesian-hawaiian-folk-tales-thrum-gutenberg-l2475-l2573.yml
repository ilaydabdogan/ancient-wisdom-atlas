canonical_text:
  quote: ''
  summary: Kalelealuaka repeatedly sends his wives on difficult domestic errands to
    conceal his rapid journeys to battle. He disguises himself with local wreaths,
    aids the lame marshal, receives land in return, defeats enemy forces with miraculous
    speed and strength, takes martial trophies, and returns home before his wives
    understand where he has gone. The King doubts reports crediting another warrior
    and waits for the lame marshal, who reports an unknown Waialua hero resembling
    Kalelealuaka.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kalelealuaka asks his wives to fetch water with the calabash nozzle held downward,
    although he knows it cannot be filled that way.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated purpose of the water-fetching task is to keep the two young women
    from knowing of his miraculous flight to battle.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kalelealuaka adorns himself with Waialua wreaths of uki and hinahina, making
    himself appear middle-aged and unrecognizable to the lame marshal.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Kalelealuaka lifts the lame marshal and sets him down at Puowaina, receiving
    the land of Waialua as a reward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: In battle, Kalelealuaka defeats the enemy, kills the captain, strips him of
    a feather cloak and helmet, and takes his right ear and little finger.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Kalelealuaka returns to Puuloa with bird-like speed and disposes of the spoils
    and trophies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The wives try unsuccessfully to fill the water-gourd with its nozzle downward,
    then fill it in the usual way and return home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kalelealuaka refuses to drink the water, saying it had been dipped up; the
    elder wife complains that the task was tricky and heartless.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Returning soldiers boast of Keinohoomanawanui's deeds, but the King doubts
