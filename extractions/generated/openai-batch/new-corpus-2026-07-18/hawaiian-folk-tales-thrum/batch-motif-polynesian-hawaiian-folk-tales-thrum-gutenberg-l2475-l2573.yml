  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The lame marshal tells the King of a new hero from Waialua whose name he does
    not know but who resembles Kalelealuaka.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: When an attack by Kualii is reported, Kalelealuaka tells his wives to bake
    a fowl by a specific method without cutting it open.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Kalelealuaka flies to Kahuku and adorns himself with pandanus fruit and sugar-cane
    flowers, changing his appearance into that of a gray-haired old man.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Kalelealuaka again lifts the lame marshal to Puowaina and receives the district
    of Koolau in return.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the later battle, Kalelealuaka kills soldiers who had spoken ill of him,
    fights Kualii's warriors with miraculous power, kills the captain, and takes a
    feather cloak, helmet, little finger, and toe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Kalelealuaka flies while carrying the cripple as far as Waipio and drops him
