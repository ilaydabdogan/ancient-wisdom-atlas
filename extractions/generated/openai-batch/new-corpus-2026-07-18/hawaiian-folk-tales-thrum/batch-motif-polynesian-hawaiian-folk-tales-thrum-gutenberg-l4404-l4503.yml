canonical_text:
  quote: '"I will go and seek Kaala; and if I find her not, I die."'
  summary: After being defeated or frustrated, Kaaialii is cared for by Ua but vows
    to seek Kaala. He searches inland valleys, ravines, springs, and cliffs, meets
    a priest who directs him toward sea caves on the southern shore, and then laments
    at a bluff before seeing a form rise in the spray of a blowing cave.
  language: English
  quote_policy: quoted
