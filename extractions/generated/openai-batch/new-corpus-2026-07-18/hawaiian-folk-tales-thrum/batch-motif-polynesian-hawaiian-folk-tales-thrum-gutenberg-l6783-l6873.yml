canonical_text:
  quote: ''
  summary: Umi refuses to execute Kalei and her relatives and seeks Kamohoalii's will
    through ritual specialists. Kamohoalii, speaking through a medium, condemns Nanaue's
    human-eating, orders him away from Hawaii, and protects Kalei's family. Nanaue
    relocates to Maui and Molokai, repeatedly resumes shark predation while hiding
    his shark mouth, and is finally exposed after a shark kahuna instructs the people
    how to detect him. The people prepare to burn him, since the passage says a man-shark
    must be wholly consumed by fire to be destroyed.
  language: English
  quote_policy: summarized
