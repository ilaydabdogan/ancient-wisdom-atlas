canonical_text:
  quote: '"He foresaw thereby the purpose of the King in summoning him to dwell at
    court."'
  summary: The passage introduces Kaopulupulu, a famed Oahu priest, his son Kahulupue,
    the misrule and deposition of chief Kumahana, the installation of Kahahana as
    ruler of Oahu, Kahahana's marriage to Kekuapoi, and the summons of Kaopulupulu
    to court. Kaopulupulu divines the purpose of the summons, instructs his son, prays
    at a priestly temple, and journeys from Waimea to Waikiki, where he is welcomed
    by King Kahahana.
  language: English
  quote_policy: quoted
