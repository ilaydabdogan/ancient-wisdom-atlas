  basis: Kahulupue advises Kumahana that care for subjects through food, fish, and
    clothing would win their support, but the ruler disregards the counsel.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The counsel is practical and ethical; broader kingship interpretation
    should be reviewed.
