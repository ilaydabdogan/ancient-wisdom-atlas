canonical_text:
  quote: ''
  summary: The passage explains the anae-holo mullet’s route from Honouliuli around
    Oahu to Laie and back through a story in which Ihuopalaai, aided by the fish god
    Ku-ula, sends a school of fish to his sister after her husband requests food.
    The husband is instructed not to stop on the way, but when he rests the fish rest
    too and others catch some. The fish become the family’s supply and thereafter
    repeat the same annual course. The passage also states food restrictions involving
    anae-holo and aholehole for expectant mothers and young children.
  language: English
  quote_policy: summarized
