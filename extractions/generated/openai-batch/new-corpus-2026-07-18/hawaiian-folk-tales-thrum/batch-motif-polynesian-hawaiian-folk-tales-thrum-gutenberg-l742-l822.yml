canonical_text:
  quote: ''
  summary: In the episode titled “The Origin of Fire,” Maui and Hina’s four sons go
    fishing while the curly-tailed alae keep and conceal fire on shore. Maui-mua uses
    a calabash dressed in kapa as a decoy so the alae think all four sons are in the
    canoe. He captures an alae, compels it to reveal where fire can be found, finally
    obtains fire from a dry stick, and marks the alae’s head red.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Maui and Hina dwell together and have four named sons: Maui-mua, Maui-hope,
    Maui-kiikii, and Maui-o-ka-lana.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The four sons are fishermen who launch a canoe from the beach at Kaupo on
    Maui and go to a fishing ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: While the brothers are fishing, Maui-o-ka-lana sees the light of a fire on
    the shore they left.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The brothers decide to return after catching fish so that their food can be
    cooked.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The curly-tailed alae are identified as keepers of the fire; when they see
    Maui-mua approach, they scratch the fire out and fly away.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Maui-mua reports that the alae are proprietors of the fire and that the brothers’
    bananas have been stolen.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The fire appears only when the brothers are away fishing, and they cannot
    find it when they return.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The alae count the men in the canoe and light the fire only when they can
    count four.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Maui-mua plans to stay on shore while his brothers place a calabash dressed
    in kapa in his place in the canoe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The alae count four figures in the canoe, light the fire, and put bananas
    on to roast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Maui-mua approaches unseen, seizes an alae, and threatens to kill it for keeping
    fire from them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The alae says the secret will die with it if killed, then offers fire in exchange
    for being allowed to live.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The alae first directs Maui-mua to the a-pe plant and then to a green stick,
    but neither yields fire when rubbed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The alae finally says fire is in a dry stick, and Maui-mua obtains fire from
    the dry stick.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: After obtaining fire, Maui-mua rubs the top of the alae’s head until it is
    red with blood, and the passage says the red spot remains to this day.
  category: action
  evidence_refs:
  - ev:8
