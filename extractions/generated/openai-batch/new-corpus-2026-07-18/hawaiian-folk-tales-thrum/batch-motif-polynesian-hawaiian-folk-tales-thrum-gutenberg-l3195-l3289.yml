canonical_text:
  quote: ''
  summary: A bird reports Kauhi's violence against Kahalaopuna. Kahalaopuna's spirit
    reveals her buried body to passersby, and a young man recovers it. With help from
    his elder brother and two spirit sisters, she is restored to life and treated
    at an underground water-cave. She refuses the young man's marriage request while
    Kauhi lives. The brothers and her parents conceal her resurrection and arrange
    a public challenge by using her songs at a kilu house. Kauhi wagers his life against
    the young man's claim to produce the real Kahalaopuna. At the public test, priests
    advise using a-pe leaves to determine whether she is human or spirit, while her
    spirit companions warn her how to avoid detection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Elepaio, described as a little green bird and cousin to Kahalaopuna, saw that
    the owl had deserted Kahalaopuna's body and reported events to Kahaukani and Kauakuahine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spirit of the murdered girl revealed itself to passersby, and a compassionate
    young man uncovered her still-warm body at a tree indicated by the spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man wrapped the body in a shoulder scarf, covered it with maile,
    ferns, and ginger, made it into a back-load, and carried it to his home at Kamoiliili.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The young man's elder brother called on two spirit sisters, and with their
    aid the body was restored to life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: During the treatment, Kahalaopuna was frequently taken to the underground
    water-cave Mauoki for the Kakelekele cure; the cave was thereafter known as the
    Water of Kahalaopuna.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The young man wanted Kahalaopuna to become his bride, but she refused, saying
    that while Kauhi lived she belonged to him because her body had been nourished
    by his food.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The elder brother advised the younger to seek Kauhi's death, and they conspired
    with Kahalaopuna's parents to keep her last resurrection secret.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The young man learned Kahalaopuna's meles and sang them at kilu houses where
    Kauhi was present, provoking disputes.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
- id: obs:9
  text: Kauhi challenged the young man to produce the real Kahalaopuna, with the loser
    of the dispute to forfeit his life.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: On the appointed day Kahalaopuna went to Waikiki with relatives, servants,
    and two spirit sisters who had taken human form; Akaaka was appointed a judge.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Kauhi consulted family priests and sorcerers, and Kaea advised spreading a-pe
    leaves where Kahalaopuna and her party would sit as a test distinguishing spirit
    from human.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The spirit friends warned Kahalaopuna to trample the a-pe leaves because they
    themselves, being spirits, would be unable to tear their leaves and could be detected
    by spirit catchers.
  category: speech
  evidence_refs:
  - ev:12
