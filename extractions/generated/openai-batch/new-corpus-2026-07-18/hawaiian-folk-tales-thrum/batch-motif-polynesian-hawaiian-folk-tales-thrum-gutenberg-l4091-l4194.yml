canonical_text:
  quote: ''
  summary: Kaaialii asks Kamehameha for Kaala. Kamehameha orders him to wrestle the
    rival claimant Mailou, with the winner to take the maiden. Kaala fears Mailou
    and asks Kaaialii to save her. Kaaialii kills Mailou in the contest. Kamehameha
    orders celebration and union; hula is performed and Kaaialii carries Kaala away.
    Kaala's father Opunui laments, hides his hatred, plans to conceal her in the sea,
    and deceives her with a report that her mother is dying.
  language: English
  quote_policy: summarized
