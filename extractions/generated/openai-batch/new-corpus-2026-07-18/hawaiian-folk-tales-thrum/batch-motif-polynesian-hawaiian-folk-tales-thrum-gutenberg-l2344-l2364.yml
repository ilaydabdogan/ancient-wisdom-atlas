canonical_text:
  quote: ''
  summary: At the coast, prepared houses and food await the arrivals. Keinohoomanawanui
    enters his house and finds cooked eels and potatoes. Kalelealuaka refuses to enter
    his own prepared house until his companion Kaluhe is included and provided for.
    The King personally serves Kalelealuaka awa, water, and food. After Kalelealuaka
    becomes drowsy from the awa, a lame marshal leads him to the two daughters of
    Kakuhihewa, who become his wives.
  language: English
