canonical_text:
  quote: ''
  summary: The passage opens the legend of the Punahou Spring. A Kaala chief's twin
    children, named Waahila Rain and Mountain Mist, are persecuted by their jealous
    stepmother after their father leaves. Their deceased mother's empowered spirit
    protects them. The children flee through mountain and valley refuges, live in
    caves, divide cooking and dwelling spaces according to kapu/noa rules, and eventually
    settle near Punahou. When the sister wants water for bathing, the brother seeks
    aid from Kakea, a moo water god and maternal ancestor who controls local water
    sources and agrees to help open a watercourse.
  language: English
  quote_policy: summarized
