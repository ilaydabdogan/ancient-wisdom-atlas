canonical_text:
  quote: ''
  summary: Akaaka exposes and kills the seer Kaea by capturing his reflection, then
    acknowledges Kahalaopuna as his granddaughter. The king hears the accounts, condemns
    Kauhi and the false boasters Kumauna and Keawaa, and they and some followers are
    baked in ground ovens. A shark god sends a tidal wave to remove their bones; Kumauna
    and Keawaa become mountain peaks, and Kauhi and his followers become sharks. Kahalaopuna
    marries the young man who saved her, but after ignoring a warning not to enter
    the sea she is killed and eaten by shark-form Kauhi, preventing restoration. Her
    parents and grandparents then relinquish human form and become wind, rain, trees,
    mountain, and lehua bushes associated with Manoa.
  language: English
  quote_policy: summarized
