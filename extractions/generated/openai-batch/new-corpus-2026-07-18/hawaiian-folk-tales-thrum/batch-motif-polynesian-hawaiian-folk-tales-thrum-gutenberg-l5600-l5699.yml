canonical_text:
  quote: ''
  summary: Aiai locates an underwater cave, hooks a puhi with a named hook and rope
    after invoking his parents, and coordinates people on shore to pull it in. The
    Aleamai people land it, and Aiai kills it with three ala stones. Local rocks and
    heat-resistant stones are explained as remains or effects of the event. A keeper
    from Molokai dreams that the puhi, his aumakua, has been killed, comes to Hana,
    learns Aiai killed it, and seeks revenge. He deceives the king by altering Ku-ula's
    fish-preparation instructions into an insult, leading the king to order Ku-ula,
    his wife, and child burned in their house. Most people gather firewood, while
    Aleamai refuses; Ku-ula prepares three dry gourds and tells Aiai not to fear the
    coming burning.
  language: English
  quote_policy: summarized
