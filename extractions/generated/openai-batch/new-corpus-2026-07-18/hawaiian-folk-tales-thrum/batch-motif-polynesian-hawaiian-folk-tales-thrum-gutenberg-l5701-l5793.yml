canonical_text:
  quote: ''
  summary: Ku-ula instructs his son Aiai to follow smoke to a cave if the family house
    is burned, to take sacred fishing objects, and to inherit his power and knowledge.
    The King's people bind Ku-ula, his wife, and Aiai inside their house and set it
    on fire. Ku-ula and his wife miraculously leave unseen, transform, enter the sea,
    and remove marine food resources. Aiai escapes by ascending through flames and
    walking on smoke to a cave. He invokes his father, and fire selectively consumes
    the guilty while sparing those not involved. Aiai later leaves the objects in
    the cave and is hosted by a friendly household.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ku-ula tells Aiai that if the house and bodies are burned, he should watch
    for smoke going straight up toward Kaiwiopele Hill and follow it to a cave where
    he will live.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ku-ula instructs Aiai to take a hook named manaiaakalani, a fish-pearl named
    Kahuoi, a shell named lehoula, and a small sandstone.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ku-ula identifies the small sandstone as the progenitor of all fish in the
    sea.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ku-ula gives Aiai responsibility for making ku-ulas and fishing stations throughout
    the islands and confers power and knowledge on him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Ku-ula says he and Aiai's mother will go into the sea and abide there forever
    while Aiai remains on land.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: The King's people catch the family, tie their hands behind their backs, and
    the man from Molokai assists in carrying out Kamohoalii's orders.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ku-ula, his wife, and Aiai are tied to posts inside the house; the doorway
    is barricaded with wood and set on fire, though the ropes drop from their hands
    before the fire is lit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Ku-ula and his wife leave the burning house unseen, their bodies are changed
    by miraculous power, and they enter the sea taking fish, sea-mosses, crabs, crawfish,
    shellfish, and other edible sea things with them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The removal of edible sea life causes scarcity of fish and is described in
    the passage as Ku-ula's first stroke of revenge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Three gourds explode from the heat, and the onlookers believe the sounds indicate
    the bursting of the bodies of Ku-ula, his wife, and Aiai.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The smoke turns toward Kaiwiopele Hill, and Aiai ascends through the flames
    and walks on the smoke until he reaches a small cave that opens to receive and
    rescue him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Aiai calls on his father to destroy by fire those who caught and tied the
    family in the burning house.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: A wind-ripple and misty rain come from the sea, and the fire increases until
    flames reach the guilty people, including the man from Molokai, while those uninvolved
    are left uninjured.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Aiai stays in the cave overnight, leaves the hook, pearl shell, and stone
    there, then meets children on the road and is invited into a household where he
    remains for several days.
  category: sequence
  evidence_refs:
  - ev:7
