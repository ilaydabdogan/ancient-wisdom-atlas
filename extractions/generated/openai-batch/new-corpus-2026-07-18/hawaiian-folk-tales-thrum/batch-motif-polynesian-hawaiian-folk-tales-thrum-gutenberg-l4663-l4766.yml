canonical_text:
  quote: ''
  summary: The passage describes the Tomb of Puupehe, a lava sea-tower off Lanai with
    a stone enclosure on its summit. It recounts the love of Puupehe and Makakehau,
    Puupehe’s drowning in the sea-filled cave of Malauea during a kona storm, the
    mourning and burial preparations by the community, and Makakehau’s later appearance
    atop the inaccessible sea-tower building her grave, with local belief that deities
    helped him reach the summit with her body.
  language: English
  quote_policy: summarized
