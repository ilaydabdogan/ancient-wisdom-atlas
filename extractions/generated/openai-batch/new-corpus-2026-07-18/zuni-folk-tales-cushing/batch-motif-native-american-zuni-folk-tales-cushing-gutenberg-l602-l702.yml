canonical_text:
  quote: ''
  summary: A maiden of Mátsaki opens a covered water jar containing may-flies, gnats,
    and mosquitoes, sends them to bite a young man working in river-side corn-fields,
    and thereby drives him away. Other suitors mock the failures but also flee from
    the insects. A poor young man from Hálonawan, the Ant Hill, consults his grandmother
    before trying to approach the maiden; she warns that the maiden is wise, sends
    disguised beings to repel men, and gives him instructions for using bitter finger-root
    bark to protect himself.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a closed room, a brightly painted water jar stands in a corner and is covered
    with a stone lid that holds down many may-flies, gnats, and mosquitoes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maiden lifts the lid and addresses the little animals as though praying,
    calling them her children and sending them to a young man hoeing in corn-fields
    by the river.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The flies, gnats, and mosquitoes answer with sounds glossed as meaning yes,
    and the maiden orders them to bite the young man's body, drink his blood, and
    hum in his ears.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The insects fly out together, attack the first young man while he works, and
    he abandons his hoe, gathers his blanket and breakfast, and runs home.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: A young man from the Tented Pueblo to the north mocks the first lover, declares
    that he will visit the maiden of Mátsaki, and then fares no better.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A young man from the River Town brings a large bundle of presents but also
    runs away from the may-flies, gnats, and mosquitoes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After these failures, others delay trying to woo the maiden; the narration
    says they did not know she was a Passing Being.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: A handsome but poor young man from Hálonawan, son of the priest-chief, consults
    his very old and crafty grandmother.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The Hálonawan young man says he longs for the maiden, describes her as beautiful
    and wisely slow, and says she asks hard tasks of lovers because she thinks of
    the lovers themselves rather than their bundles.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The grandmother says the maiden sends the may-flies, gnats, and mosquitoes
    to drive men away and calls them disguised beings.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The grandmother says the maiden will test the young man and instructs him
