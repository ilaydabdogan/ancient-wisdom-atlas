canonical_text:
  quote: ''
  summary: Coyote boastfully plans to steal the children of the Kâkâ/K’yámakwe from
    Thunder Mountain. His wife advises him to enlist related coyote clans. He summons
    four tribes, claims leadership, and instructs them to form a tail-grasping chain
    up the steep mountain. After they climb, one coyote sneezes and the whole chain
    falls and is flattened. A Long Horn warrior of the Kâkâ comes from a sacred western
    lake to rescue the children; finding them already rescued, he punishes and skins
    the coyotes. The passage explains why Long Horn dancers have blue faces, coyote-skin
    collars, and hoarse bellowing voices.
  language: English
  quote_policy: summarized
