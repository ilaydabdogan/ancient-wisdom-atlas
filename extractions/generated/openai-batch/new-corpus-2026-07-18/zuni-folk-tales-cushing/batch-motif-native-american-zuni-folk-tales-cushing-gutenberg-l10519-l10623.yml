  category: object
  evidence_refs:
  - ev:15
- id: obs:16
  text: After conquering many enemies of men, the twins taught chosen followers songs,
    prayers, and orders of a warrior society called the Priests of the Bow, and breathed
    sawanikia into selected successors.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: The passage says that semblances of the twins are made anew each year and
