canonical_text:
  quote: ''
  summary: Two sisters go down a steep path from the mesa to a spring despite the
    younger sister's fear. A man-eating demon named Átahsaia lives in a cave above
    the Town of the Cliffs; he sees the maidens, calls them food, and descends with
    weapons. The passage then identifies Áhaiyúta and Mátsailéma as twin children
    of the Sun-father and Mother Waters, born from a foam-cup on the Great Ocean,
    deliverers and guides of humankind, later transformed into war medicine and remembered
    as warrior guardians of Zuñi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder sister dismisses the younger sister's fear, and the sisters gather
    garments and yucca-root before going down a steep, crooked path to the pool or
    spring at the foot of the mesa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A deep cave above the Town of the Cliffs is identified as the Cave of Átahsaia,
    where Átahsaia lived in the time described.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Átahsaia is described as an ugly demon with a huge animal-like body, shaggy
    hair, scales, glaring eyes, fangs, claw-like nails, a bow with arrows, a great
    flint knife, and skins of mountain lion and bear over his shoulders.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Átahsaia is said to have devoured men and women as meat and children as sweet-bread.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Átahsaia is called polite but also a great liar.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Átahsaia sees the two maidens from his cave, calls them a good meal, and howls
    a war-cry that the Echo-god Teshaminkia carries to the maidens.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The maidens are frightened by the sound, run away, then return to the spring
    when they hear nothing more and begin washing clothes on flat stones.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Átahsaia takes up his weapons and starts climbing down the mountain toward
    the maidens.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Twin Mountain is described as two towering buttes near the Great Mesa, and
    Áhaiyúta and Mátsailéma dwell high on its top.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: Áhaiyúta and Mátsailéma are identified as twin children of the Sun-father
    and the Mother Waters of the World.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Before men were born to the light, the Sun made love to the Waters of the
    World, and two wonderful boys were hatched from a foam-cup on the face of the
    Great Ocean.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: After the Sun dried the waters from earth's highlands, the Two delivered men
    from the bowels of Earth-mother and guided them eastward toward the Sun's home.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: When war and strange beings threatened the children of earth, eight Stern
    Beings changed the twins' hearts to sawanikia, the medicine of war, after which
    they were known as Boy-gods of War.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The twins are described as guardians who guided the ancients to the Middle
    of the World and became invincible guardians of the Corn-people of Earth.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:15
  text: The twins' weapon is the rainbow, and their arrows are thunderbolts described
