canonical_text:
  quote: ''
  summary: Coyote deceives the Demon into smashing his own limbs while pretending
    to treat him with medicine-water, then admits he intended the injuries to kill
    him. After the Demon dies, Coyote takes the Demon’s knife, heart, wind-pipe, and
    war-badge, goes to the Prey-gods’ home, and claims their youngest sister as his
    wife by citing a reported promise that whoever killed the speckled Demon would
    receive her. The sister reluctantly carries Coyote into the house and submits
    to his embraces. Her brothers return from hunting; Mountain Lion detects Coyote
    by smell and by seeing his nose, demands he be expelled, and the sister hides
    Coyote in another room.
  language: English
  quote_policy: summarized
