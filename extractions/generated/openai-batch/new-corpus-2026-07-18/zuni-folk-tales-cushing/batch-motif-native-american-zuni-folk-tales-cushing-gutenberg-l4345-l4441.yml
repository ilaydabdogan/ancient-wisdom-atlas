canonical_text:
  quote: ''
  summary: Páutiwa receives the Deer and the youth at the home of the Kâkâ. Shúlawitsi
    and the gods ritually awaken the youth to human speech, fire-prepared food, and
    mortal identity, then give him garments and ornaments. The gods identify him as
    child of the Sun and instruct the Deer to yield themselves in a hunt for his sake.
    The Deer purify and dress the youth, many Deer volunteer to die, and hunters kill
    them. The youth flees with his deer foster-family, loses his foster-siblings,
    obeys the divine instruction to submit, and addresses the pursuing old hunter
    as his uncle.
  language: English
  quote_policy: summarized
