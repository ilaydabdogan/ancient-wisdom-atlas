canonical_text:
  quote: ''
  summary: 'During a race, the old Gopher and his brothers use underground burrows,
    mud, water, and a shared red plume to make it appear that one gopher is repeatedly
    ahead of the K’iákime runners. The original old Gopher emerges near the goal before
    the runners, causing them to lose. The narrator connects this victory to later
    Zuñi racing practice: young runners make offerings and prayers to gophers around
    race-courses for aid against opponents’ kicked sticks.'
  language: English
  quote_policy: summarized
