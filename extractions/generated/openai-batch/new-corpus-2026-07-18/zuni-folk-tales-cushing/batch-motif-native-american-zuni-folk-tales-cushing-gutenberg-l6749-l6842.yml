canonical_text:
  quote: ''
  summary: 'The passage closes one Coyote episode with Mountain Lion crushing Coyote’s
    head with a stone and gives an explanation for coyotes entering baited deadfalls.
    A new story begins: in ancient Zuñi times an old Coyote of Cedar Cañon has a family
    and pups, while K’yámakwe, a god of the Sacred Drama Dance, lives on Thunder Mountain
    with many children. An explanatory note describes Kâkâ masks, costumes, demi-god
    characters, breath-transmitted ritual connection, and K’yámakwe dance regalia.
    The old Coyote hears and sees the K’yámakwe children near Thunder Mountain, admires
    them, and plans to capture them and raise them as Coyotes.'
  language: English
