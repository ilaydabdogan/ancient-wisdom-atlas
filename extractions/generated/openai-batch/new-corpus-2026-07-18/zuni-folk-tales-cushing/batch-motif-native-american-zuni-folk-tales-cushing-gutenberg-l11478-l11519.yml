canonical_text:
  quote: ''
  summary: The passage explains a Zuni classification of states of growth or being.
    It says the universe was generated from haze produced by the light of the All-container,
    Sun-father, out of darkness; beings pass through successive states from haze-being
    to finished or dead, while gods may take any state at will. The explanation is
    linked to analogies of spring mist, morning mist, fire-drill ignition, and plant
    or corn growth. The narrative then describes unnamed people whose bodies are soft
    and unfinished, who lack digestive organs, are harmed by solid food, and consume
    only the steam and savor of hot cooked food before throwing the food away.
  language: English
