canonical_text:
  quote: ''
  summary: A grandmother prepares fluid-filled cane arrows with an incantation. Two
    armed brothers depart at dawn, pass Amiwili the Worm and old Turtle, then approach
    Háwikuh. After chanting, they shoot medicine-water arrows into the plaza, rouse
    the people, lure pursuers, ambush them, and retreat. A water-shield loosens enemy
    bowstrings. Mátsailéma carries old Turtle on his back, and Turtle’s shell deflects
    arrows back into the attackers. Áhaiyúta reaches Amiwili, who is swollen from
    eating.
  language: English
  quote_policy: summarized
