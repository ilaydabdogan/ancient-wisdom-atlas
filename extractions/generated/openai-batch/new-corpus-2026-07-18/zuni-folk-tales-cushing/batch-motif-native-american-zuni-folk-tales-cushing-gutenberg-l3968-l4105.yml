canonical_text:
  quote: ''
  summary: Two War-god brothers use Field-mice to finish a vast skin-cleaning task
    set by a maiden. After the maiden verifies the work, she accepts them as husbands.
    Twin boys are born. The younger brother insists on taking the wife and children
    home to their grandmother despite the elder brother's warning that they have only
    been pretending to be human and that their father, the Sun, has forbidden them
    to be among mortals. On Thunder Mountain the Sun snatches the woman upward with
    her children; the younger brother shoots her, cutting the life power by which
    she is drawn up. The infants survive the fall, and the brothers carry them to
    their grandmother, who asks where the wife is.
  language: English
  quote_policy: summarized
