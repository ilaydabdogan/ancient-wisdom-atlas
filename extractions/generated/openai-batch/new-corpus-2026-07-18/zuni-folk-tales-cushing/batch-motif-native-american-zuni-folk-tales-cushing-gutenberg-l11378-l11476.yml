canonical_text:
  quote: ''
  summary: The passage closes an episode explaining crow blackness and eagle speckling,
    then describes old Mítsina's appearance in a Sacred Drama Dance carrying a pitch-pine
    light and wearing a bleeding-eyed mask. It then opens a new tale, framed by a
    translator's introduction and a storytelling exchange, about the Twins of War
    and Chance and the unborn-made people of the Underworld. The Zuni introduction
    describes Underworld villages inhabited by unfinished beings who are between the
    living and the dead, partly bodied and partly bodiless, smoke-like and shaped
    by outward contact.
  language: English
