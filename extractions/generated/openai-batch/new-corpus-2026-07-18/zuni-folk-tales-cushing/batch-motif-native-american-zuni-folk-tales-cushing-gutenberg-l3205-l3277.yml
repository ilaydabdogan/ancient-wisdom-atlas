  summary: A maiden who had feared a serpent companion sees him appear as a handsome
    young man. He identifies himself as the serpent, shows shriveled serpent scales
    as proof, says he loves her and dwells in all waters, and the maiden follows him
    into the Doorway of the Serpent of the Sea. The closing note says springs are
    therefore treated as precious and not used for profane purposes.
