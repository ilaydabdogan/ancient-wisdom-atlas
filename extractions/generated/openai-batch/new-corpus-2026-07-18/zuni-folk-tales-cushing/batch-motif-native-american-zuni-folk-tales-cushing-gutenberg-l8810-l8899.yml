canonical_text:
  quote: ''
  summary: A maiden trapped in a cave is forced to throw her rabbits and garments
    to a cannibal Demon, who devours them. Swollen from eating, he breaks the cave
    entrance with a flint axe to reach her. Two War-gods hear the pounding from afar,
    arrive with weapons, kill the Demon, recover and cleanse her garments, protect
    her overnight, instruct her, provide many rabbits, escort her toward her village,
    reveal their names, and disappear.
  language: English
  quote_policy: summarized
