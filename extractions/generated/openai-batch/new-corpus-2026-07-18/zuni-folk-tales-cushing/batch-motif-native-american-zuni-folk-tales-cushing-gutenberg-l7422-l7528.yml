canonical_text:
  quote: "“Ingenuity enabled me to kill a deer. Ingenuity enabled me to retain the
    deer.”"
  summary: The Coyote finds the Turtle in a tree with the deer meat. The Turtle persuades
    the Coyote family to lie below for ribs, drops the ribs onto them, and kills most
    of them. One cub escapes; another hungry cub is lured into the tree, eats, is
    sent toward pitch described as water, falls, and dies. The tale ends by explaining
    marks on the descendants of the escaped cub.
