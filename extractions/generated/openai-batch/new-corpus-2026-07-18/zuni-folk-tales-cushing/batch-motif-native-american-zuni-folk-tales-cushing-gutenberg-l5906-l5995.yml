canonical_text:
  quote: ''
  summary: A group of rejected suitors secretly plot to kill a feared youth during
    a rabbit hunt, but Dogs overhear them and warn him. The youth seeks help from
    an elderly Cave-swallow, who makes him an unusually effective boomerang. During
    the hunt the youth excels, provoking a rival to throw a boomerang at him. He avoids
    mortal injury, appears senseless, is abandoned, heals himself with medicine from
    his pouch, returns with many rabbits, and gains admiration. The passage closes
    by linking the event to a social expectation that a man seeking to marry a Moki
    maiden must prove himself.
  language: English
  quote_policy: summarized
