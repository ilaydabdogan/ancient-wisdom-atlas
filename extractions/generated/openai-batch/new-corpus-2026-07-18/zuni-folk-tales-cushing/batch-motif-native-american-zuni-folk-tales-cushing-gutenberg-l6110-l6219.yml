canonical_text:
  quote: ''
  summary: The old Owl tells Coyote he may join the Owls' dance if he fulfills the
    conditions. Coyote kills and decapitates his grandmother, wears her head, breaks
    his own hindlegs, and returns to imitate the dancing Owls. The Owls mock him for
    being tricked. Coyote threatens to smoke them from their holes; several named
    plants are dismissed by the Owls as food, but pitch-pine frightens them. Coyote
    laments his grandmother and crawls home in pain.
  language: English
  quote_policy: summarized
