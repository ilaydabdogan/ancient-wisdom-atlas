canonical_text:
  quote: ''
  summary: 'The injured Cock seeks hairs or bristles for a cure. Each helper requires
    payment or a prior service: the Dog asks for bread, the Food-maker asks for wood,
    the Trees ask for water, and the Beings of Water instruct the Cock to offer four
    plumes around a pool so clouds will bring rain. The exchange chain succeeds; the
    Cock receives bristles and is cured by the Grandmother, but permanent marks remain.
    The passage closes with etiological explanations for cocks'' crests and lack of
    breast bristles, and for field-mice traits and name.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Cock sees the Dog's muzzle-beard, asks for four hairs, and the Dog says
    he will give the hairs in exchange for fine bread.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Food-maker requires wood to bake bread, and the Trees require water before
    they will drop dry branches.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a spring, the Beings of Water say duties have been neglected and instruct
    the Cock to place four plumes from under his wings around the water so the Clouds
    will bring rain.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Cock places four plumes on the northern, western, southern, and eastern
    borders of the pool; winds breathe on the plumes, clouds arrive, rain falls, and
    the Trees drop branches.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Wind places Red-top Grass among the branches, making the bundle light
    enough for the Cock to carry to the Food-maker.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Food-maker gives bread, the Dog gives four bristles in exchange for the
    bread, and the Cock takes the bristles to the old Grandmother.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Grandmother says she will cure the Cock but that his delayed healing will
    leave lasting welts; she states that wrong must be made right through payment,
    like the sick paying those who cure them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After healing, the Cock has blood-red welts on his head and blue marks on
    his temples.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage explains that cocks have no breast bristles, have blood-red crests,
