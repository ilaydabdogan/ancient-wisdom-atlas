canonical_text:
  quote: ''
  summary: The passage opens an etiological Coyote tale. In ancient times the Gods
    of Prey live near Thunder Mountain, but a spotted Demon named Síuiuki eats human
    hunters and prevents sacrifices from reaching the Gods. The Gods discuss killing
    him and promise their sister in marriage to anyone who succeeds. Coyote overhears,
    prepares stones, animal leg-bones, and yellow medicine-fluid, then deceives the
    Demon by pretending to break and cure his own limbs in order to gain running speed.
    Convinced, the Demon asks to try the method, and Coyote instructs him to strike
    his own leg with a stone and bathe it in the medicine-water.
  language: English
  quote_policy: summarized
