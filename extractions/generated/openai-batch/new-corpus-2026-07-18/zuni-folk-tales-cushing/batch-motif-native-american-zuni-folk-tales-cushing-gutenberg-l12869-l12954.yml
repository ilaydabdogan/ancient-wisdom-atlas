canonical_text:
  quote: ''
  summary: The Sun tells two boys that he is their father and recounts how he visited
    their secluded mother, who was later shot by two gods while trying to escape on
    an Eagle; the boys were born after her fall and raised by Badgers. He then gives
    detailed instructions for proving their kinship to their aunts at the Home of
    the Eagles and for going to Acoma, where an old dance-priestess keeps and ritually
    distributes their mother's bones; he instructs them to kill and skin her so the
    younger brother can impersonate her.
  language: English
  quote_policy: summarized
