canonical_text:
  quote: ''
  summary: As arrows threaten an ascending group, the Sun protects them with a shield.
    The group rises by drawing up a mantle, while the people below quarrel and blame
    one another for attempting the life of a god. A young man declares that, because
    of their folly, peace and treasures will pass away with him and his own. The narrator
    connects the event with blue stars beside the setting Sun, the limited locations
    of jewels, and the origin of anger and violence among people, then closes with
    a blessing invoking divine shelter.
