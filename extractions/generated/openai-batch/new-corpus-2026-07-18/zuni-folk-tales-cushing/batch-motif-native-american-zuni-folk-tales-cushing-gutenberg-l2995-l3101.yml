canonical_text:
  quote: ''
  summary: An attendant named Waíhusiwa tells a tale set in old K’iákime under Thunder
    Mountain. A beautiful priest-chief’s daughter repeatedly bathes and washes clothing
    in a spring sacred to Kólowissi, the Serpent of the Sea. Angered by the defilement,
    Kólowissi appears in the spring as a beautiful abandoned child. The maiden carries
    the child to her private upper room, becomes absorbed in caring for it, and sleeps
    beside it. The child feigns sleep, becomes an enormous serpent, coils through
    the room, surrounds the maiden, and takes its tail in its mouth. In the morning
    the maiden does not descend.
  language: English
  quote_policy: summarized
