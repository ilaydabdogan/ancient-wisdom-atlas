canonical_text:
  quote: the skin burst and fell off
  summary: A Coyote repeatedly returns to the Badgers after being thrown out. The
    Badgers suspect and confirm that he is a youth changed into Coyote form. They
    administer an emetic, warm him by the fire, and use a heated sacred rock crystal
    with incantations to remove the animal skin and restore him. He returns to his
    people, and the narrator explains that his long life among the Deer and his teaching
    of their ways and words account for the Sacred Hunters' deer knowledge.
  language: English
  quote_policy: quoted
