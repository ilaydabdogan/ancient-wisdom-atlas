  quote: ''
  summary: A crowd asks the Twain to teach how enemies can be vanquished by eating
    them. In a council, half-finished people are altered by having vents cut and by
    being made to eat solid food, becoming hardened people of flesh rather than needing
    death to ascend to daylight. The passage then explains infant feeding, the fragility
    of the aged, and named worlds associated with birth and death.
