canonical_text:
  quote: ''
  summary: A Gopher confirms that the four-fold Bison is dead. The boy skins the beast,
    takes part of its hide, heart, and blood-filled intestine, and returns home. His
    mother warns him about child-stealing Eagles nesting in a cliff at Shuntekia.
    During the night he makes a smooth greased rawhide suit from the Bison hide, ties
    the blood-filled intestine around his neck, and goes near the Eagle nest. He feigns
    terror so the old Eagle attacks him; the Eagle’s talons slip from the greased
    suit, but eventually catch in a stitch and carry him to the nest. The Eagle tells
    the young Eagles to eat him and leaves to hunt. The boy frightens the young Eagles
    back with whispered sounds and tells them not to eat him.
  language: English
  quote_policy: summarized
