canonical_text:
  quote: ''
  summary: 'The passage first closes a prior etiological tale by explaining the small
    size of rainbow-worms and traits of turtles through ancestral events. A new tale
    then begins: a young son of the priest-chief of K’iákime runs around Thunder Mountain
    before sunrise in dance-like finery before prayers. An old Tarantula living in
    a den below Ak’yapaatch-ella covets the youth’s clothing and persuades him to
    exchange garments so the youth can see how handsome he looks. The Tarantula dresses
    in the finery, backs toward his den while asking how he looks, then plunges into
    the hole with the garments. The youth puts on the Tarantula’s gray-blue clothing,
    returns home late, and reports that the Tarantula stripped him of his garments.'
  language: English
  quote_policy: summarized
