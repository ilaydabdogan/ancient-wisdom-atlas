canonical_text:
  quote: ''
  summary: A successful young Zuni hunter, Héasailuhtiwa, lives apart with his sister
    but neglects to make sacrifices to the deer he kills. While tracking a great buck
    far north to a river, he encounters a richly dressed young man who reveals himself
    as the Deer. The Deer-being says the Sun-father has heard the slain deer’s supplications
    and orders the hunter to prepare ritual offerings and journey to the Sun-father’s
    house at the western end of the world.
  language: English
  quote_policy: summarized
literal_observations:
