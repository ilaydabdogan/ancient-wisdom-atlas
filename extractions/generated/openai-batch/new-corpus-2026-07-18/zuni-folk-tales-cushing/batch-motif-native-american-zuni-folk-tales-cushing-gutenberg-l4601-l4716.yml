  text: An old shíwani or priest-chief at Tâ′ia has a young son named Héasailuhtiwa,
    also called “Metal-hand,” who is known for successful hunting.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Héasailuhtiwa asks to leave his parents’ home and live by himself so he can
    travel and hunt deer in distant mountains.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: His parents allow him to live apart only on the condition that his younger
    sister Waíasialuhtitsa goes with him to manage the house and remind him of his
    forgetfulness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The brother and sister live in lofty rooms of a high house in the upper part
    of the pueblo.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The boy hunts daily and brings back slain animals, while his sister cooks
    and keeps the house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
