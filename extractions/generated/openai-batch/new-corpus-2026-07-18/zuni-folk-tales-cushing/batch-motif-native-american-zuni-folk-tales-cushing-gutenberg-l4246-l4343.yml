canonical_text:
  quote: ''
  summary: A hunter sees a mortal youth living among a council-like herd of Deer.
    After the village plans a hunt to see or capture him, the Deer tell the youth
    his mortal origin and advise that he return to human society. A splendid Deer
    leads him to the Lake of the Dead, where rush ladders carry them beneath the water
    into luminous halls of the Dead and Sacred Dance, where gods and sacred dancers
    are assembled.
  language: English
  quote_policy: summarized
