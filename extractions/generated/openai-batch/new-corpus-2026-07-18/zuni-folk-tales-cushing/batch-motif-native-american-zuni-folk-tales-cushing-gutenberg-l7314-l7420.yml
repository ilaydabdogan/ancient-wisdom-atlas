canonical_text:
  quote: ''
  summary: In this episode, Turtle remains trapped in sand while Coyote takes deer
    meat and plans a family feast. After Coyote leaves, Turtle frees himself, moves
    the meat high into a tree, fills the buried deer-stomach pudding with red fire-ants,
    and returns to concealment. The Coyote family arrives singing about deer meat,
    tears into the pudding, and is bitten by the ants while Coyote mistakes the pain
    for hot grease.
  language: English
  quote_policy: summarized
