canonical_text:
  quote: ''
  summary: Two rapidly growing boys, described as children of the Sun and cared for
    by old Badgers, ask for bows and arrows and go rabbit-hunting in the snow near
    Thunder Mountain. After they kill rabbits and stop to eat corn-cakes at noon,
    the Sun sees them, pities them, descends to earth in splendid dress, and tells
    them that he is their father and gave them life, though they do not yet believe
    him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The two boys grow at an accelerated rate: each day equals about a year of
    ordinary human childhood, so that after eight days they are like eight-year-old
    children.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies the boys as children of the Sun and says they can unfailingly
    kill small animals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old father warns the boys every morning not to go out of sight of the
    house, and the old woman watches them so they will not run off, get lost, or be
    claimed by someone else.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boys ask the old Badger to make bows and arrows so they can hunt rabbits
    and provide food for him and the old woman.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old Badger cuts oak and branches, brings them home, and makes each boy
    a bow and arrows with a flint; he attaches single split feathers awkwardly because
    badgers lack human fingers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Snow falls during the night, and the boys announce that they will go rabbit-hunting
    the next day.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The old woman warns that the boys have no clothing or wool and asks how they
    will carry food; the boys ask for corn-cakes strung on sticks, which she makes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the morning the old Badger weaves bark moccasins reaching halfway to the
    knees; the boys put them on and leave with corn-cakes, bows, and arrows.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The boys hunt near the foot of Thunder Mountain; their first arrow kills a
    rabbit, and they continue until they have many rabbits.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: At noon the boys carry the rabbits to the top of a high hill, clear snow from
    a space, place the rabbits there, and eat corn-cakes laid on grass.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Sun looks down, pities the boys, decides to help them, and descends by
    will alone to stand near them on earth.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Sun appears in ornate garments and ornaments, including embroidered cotton,
    fringed leggings, colored girdles, bright buckskins, wampum, turquoise earrings,
    plumes, and macaw feathers.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: The boys see the Sun approaching, are dazzled and frightened, huddle together,
    crouch, and tremble.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The Sun addresses the boys as his children, says he gave them both life, and
    says he came to speak with and help them; the boys respond but do not believe
    him.
  category: speech
  evidence_refs:
  - ev:13
