canonical_text:
  quote: ''
  summary: The translator introduces canyon stone columns, especially El Capitan in
    Cañon de Chelly, as features explained by Zuni tales. The tale begins with Häki
    Suto, a giant Cloud-swallower who eats humans and drinks cloud-breaths and souls
    associated with rain, causing drought and famine. The Twin Gods of War decide
    to destroy him and meet Grandmother Spider, who offers to sew up the giant’s eyes
    so they can strike him. The passage ends by describing how Häki Suto lies across
    a cliff trail, pretends politeness, and kills passing travelers for his young.
  language: English
  quote_policy: summarized
