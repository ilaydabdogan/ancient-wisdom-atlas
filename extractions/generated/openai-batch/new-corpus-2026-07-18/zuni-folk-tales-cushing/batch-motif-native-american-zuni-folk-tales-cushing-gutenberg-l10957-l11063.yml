canonical_text:
  quote: ''
  summary: Áhaiyúta and Mátsailéma use a skin effigy of Átahsaia to frighten their
    grandmother, who attacks it until exhausted and then discovers the prank. The
    brothers are then identified as morning and evening stars whose spirits guide
    games and guard warriors. A new tale begins with Mítsina the Hermit, an evil or
    unwise being whom the gods have assigned to solitary dwelling in the Cañon of
    the Pines until he becomes worthy; passersby hear him playing the game of sacred
    arrows or cane-cards alone.
  language: English
  quote_policy: summarized
