  summary: A neglected youth and allied Dogs defeat a Zuñi war party, take scalps,
    feast at a spring by the Black Mountains, and return triumphantly to Moki. The
    elders honor him, a maiden accepts him after initiation and purification, and
    jealous rejected suitors unite against him while other maidens demand heroic husbands.
  language: English
