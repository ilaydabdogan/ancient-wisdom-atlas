canonical_text:
  quote: ''
  summary: Two named brothers, repeatedly called the Twain, confront unusually soft
    and fearful villagers. They repel pursuers with a war-club, shield-feather, and
    dry plume-grass; accept food in the town court and shock the villagers by eating
    it directly; dismiss a wind alarm; feign death when villagers try to dispose of
    them; capture, roast, and eat deadly jays; and destroy an animate boiling cooking-pot
    with onion earrings by eating the earrings and mush and kicking the pot apart.
    A footnote explains the onion/leek-clove as a symbol of vigor and invincibility
    associated with the Twin gods.
  language: English
  quote_policy: summarized
