canonical_text:
  quote: ''
  summary: A youth identifies himself as the abandoned child of a maiden and the Sun,
    fostered by Deer. His relatives bring him back to Háwikuh, where his mother confesses
    and receives him. He becomes a deer-wise hunter whose rites and success feed the
    people. Envious sorcerers meet in a cavern with green fires; one uses a Coyote
    disguise to transform the youth into a coyote. The transformed youth wanders hungry
    and cold until he finds the house of an old Badger couple and falls inside.
  language: English
  quote_policy: summarized
