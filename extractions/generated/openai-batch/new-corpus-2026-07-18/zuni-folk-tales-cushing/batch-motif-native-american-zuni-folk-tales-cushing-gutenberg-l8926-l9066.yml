canonical_text:
  quote: ''
  summary: A frighteningly ugly wild-looking boy living with his grandmother near
    K’iákime goes to Southeastern Mesa, where an old Bear has claimed abundant piñon
    nuts, datila fruit, and grass-seed and has driven the people away. The boy disputes
    the Bear’s claim and proposes a test in which each tries to frighten the other.
    The Bear fails to scare the boy; the boy returns to his grandmother, who paints
    him with soot and ashes and gives him an ancient magic stone axe before he runs
    back to frighten the Bear.
  language: English
