canonical_text:
  quote: ''
  summary: A Zuni Folk Tales passage introduces a poor, despised Moki youth and a
    beautiful Walpi maiden who will marry only a hero. She requires suitors to go
    to enemy Zuni, kill warriors, and bring back scalps for Moki warrior societies.
    Ordinary suitors withdraw in fear. The outcast youth resolves to woo her, visits
    her father's house at night, is received politely, states his intention to attempt
    the task, accepts the maiden's harder terms, and departs into the dark.
  language: English
  quote_policy: summarized
