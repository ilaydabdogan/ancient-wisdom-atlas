canonical_text:
  quote: ''
  summary: A youth living among the Eagles receives an eagle-coat, learns to fly with
    help from his Eagle-maiden wife, is warned not to go south beyond a mountain range,
    hunts with the Eagles but cannot eat their uncooked food, receives cooked bean
    foods from Storks and Pelicans in the east, is warned again by Stork grandparents,
    and finally turns south to view a city beyond the mountains.
  language: English
  quote_policy: summarized
