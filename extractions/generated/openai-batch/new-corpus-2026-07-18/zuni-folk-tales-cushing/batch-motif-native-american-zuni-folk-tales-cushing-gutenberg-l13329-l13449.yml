canonical_text:
  quote: ''
  summary: A skull is washed into the fields of the priest-chief of K’yátik’ia. The
    priest-chief’s daughter finds it as a handsome young man among squash vines, promises
    to take it home, and keeps it in a covered water-jar. The being alternates between
    skull and young man according to sunrise and nightfall, is also seen with a rattlesnake
    over it, and is accepted by the priest-chief as his daughter’s husband. After
    raw cotton is brought and the room is closed, the young man remains in human form,
    marries the daughter, weaves fine textiles, and is identified as a child of the
    Sun-father and a god. The Sun-father laments that his son has not come to him.
    The daughter later gives birth to two boys who grow strong and wise and are seen
    by the people of K’yátik’ia.
  language: English
  quote_policy: summarized
