canonical_text:
  quote: ''
  summary: Two elder War-gods challenge Mítsina, a habitual gambler, after seeing
    their younger brothers suffering near the fire. They include the younger brothers
    among the stakes, win Mítsina’s possessions and body-parts in play, blind him
    instead of killing him, rescue the younger brothers, and take away the accumulated
    treasures to turn them into blessings for humans. Mítsina later lights pitch from
    the fire; its fumes restore a kind of vision, through which he sees the way to
    the City of the Gods and Souls and travels westward. Birds mock him and try to
    extinguish his light; the Eagles, formerly white like the Crows, singe and blacken
    their feathers in the attempt.
  language: English
  quote_policy: summarized
