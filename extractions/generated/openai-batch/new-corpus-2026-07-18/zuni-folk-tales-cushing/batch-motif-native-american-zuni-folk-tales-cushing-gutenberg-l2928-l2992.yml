canonical_text:
  quote: ''
  summary: An old woman with poor eyesight offers the boy things she has mistaken
    for cactus fruit, then warns him to carry his bundle of feathers around any fields
    of flowers if he wants to reach home with them. The boy first obeys but eventually
    enters a flower field, where wings fly out of the bundle until it disappears.
    The narrator identifies the wings as the Sacred Birds of Summerland and explains
    this as the origin of small birds that bring summer and hover over flowers. The
    storyteller closes by comparing Zuni oral knowledge to books kept as words in
    the heart from the ancients.
  language: English
  quote_policy: summarized
