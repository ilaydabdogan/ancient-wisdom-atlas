  summary: The maiden huntress returns home with rabbits, is admired by the town,
    reassures her mourning parents, recounts that two wondrous youths taught her a
    lesson about hunting and women's fireside roles, accepts a suitor who brings a
    bundle, and the tale explains a continuing custom whereby women hunt rabbits or
    deer by marrying men who hunt for them.
