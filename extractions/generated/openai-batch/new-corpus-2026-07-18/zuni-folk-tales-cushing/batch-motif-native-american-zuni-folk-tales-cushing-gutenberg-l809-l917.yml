canonical_text:
  quote: ''
  summary: The passage first explains why gnats and mosquitoes behave as they do after
    failed attempts to bite the young lover. The young man continues hoeing a corn-field,
    and the maiden prepares food and adorns herself to meet him. Her jealous, two-hearted
    elder sister uses magic to dress and appear exactly like her, creating two identical
    maidens before the young man. The sisters quarrel and fight; unable to distinguish
    them, the young man strikes the uppermost woman with his hoe. Only the dying maiden
    remains before him, while an ugly black Crow laughs and flies to its cave in Thunder
    Mountain.
  language: English
  quote_policy: summarized
