canonical_text:
  quote: ''
  summary: The excerpt ends an animal tale in which an old Owl uses a Tip-beetle's
    wind and pungent odor, captured in a buckskin bag, to disperse persistent rain
    and drive away the Rain-gods. Prairie-dogs praise the Owl, and the tale explains
    why prairie-dogs and burrowing-owls are friends and why burrowing-owls rear children
    in prairie-dog holes. The next tale begins by describing the famed runners of
    K’iákime, their victories in kicked-stick races, the losses of neighboring towns,
    and a council that decides to seek an old Gopher for wisdom and cunning.
  language: English
