canonical_text:
  quote: ''
  summary: A young man travels enclosed in a log downriver and out onto the Great
    Waters. The log lands on a mountain island that is the home of the Rattlesnakes.
    A Rattlesnake maiden finds him, leads him through a valley of serpents into a
    cavern council, and the elders offer him a companion for a long, fearful journey
    unknown to mortals. He chooses the maiden. The Rattlesnake people put on serpent
    skins and become serpents; the maiden extracts one fang from each, resumes human
    form, and guides the young man back toward his log.
  language: English
  quote_policy: summarized
