  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Rattlesnake maiden appears like a beautiful human young woman dressed
    in cotton mantles, with a rattlesnake-skin worn around her waist and open at the
    breast and crown of the head.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The maiden leads the young man over the mountain to a valley crowded with
    hissing and rattling serpents; when he recoils, she commands them to make a path
    and they obey.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In a cavern room, Rattlesnake people are assembled in council; serpent skins
    hang on pegs and racks around the walls, and the elders greet the youth.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: After feeding the young man, the elders tell him the way ahead is long, fearful,
    and unknown to mortals, and ask him to choose a companion; he chooses the maiden
    who found him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Rattlesnake people put on their serpent skins and become serpents; the
