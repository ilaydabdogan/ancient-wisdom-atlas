  text: An unnamed group sorrowfully pushes the log from a high river bank, watches
    it disappear into the water, later sees it moving toward the Western Waters, and
    returns home under the Mountains of the South.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inside the log, the young man removes a plug to check for water, observes
    sunlight and stars through the opening, eats meal, sleeps, and continues traveling
    for days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the tenth morning the log no longer moves; the young man sees rocks and
