canonical_text:
  quote: ''
  summary: A little sister and the household discover that the Serpent of the Sea
    has filled a room with its coils around the maiden. The old father, a priest and
    sage, prays to Kólowissi for the maiden's release and promises atonement. After
    rites and offerings are prepared, the maiden is ceremonially dressed and directed
    to yield the offerings and herself to the Serpent, leaving home for the Waters
    of the World. The Serpent descends, guides her westward, and after passing the
    Mountain of the Red Paint contracts into the form of a beautiful youth while retaining
    his serpent scales under a mantle.
  language: English
  quote_policy: summarized
