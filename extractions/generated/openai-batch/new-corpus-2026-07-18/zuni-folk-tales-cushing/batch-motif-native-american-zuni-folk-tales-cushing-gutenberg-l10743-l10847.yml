canonical_text:
  quote: ''
  summary: Átahsaia leads two girls to his cave while Áhaiyúta and Mátsailéma wait
    nearby. Mátsailéma restrains Áhaiyúta from attacking too early, explains the demon’s
    killing place by a chasm, and later uses an invisible net-and-cord shield given
    by the Sun-father to block the demon’s bite. Áhaiyúta wounds the demon with a
    thunderous, lightning-like arrow, the brothers finish him with war-clubs, and
    Mátsailéma revives the insensible elder maiden by breathing into her nostrils.
  language: English
  quote_policy: summarized
