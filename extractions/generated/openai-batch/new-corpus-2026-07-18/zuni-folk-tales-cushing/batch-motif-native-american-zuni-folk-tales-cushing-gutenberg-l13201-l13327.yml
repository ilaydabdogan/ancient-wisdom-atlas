canonical_text:
  quote: ''
  summary: Two brothers question an old woman about a ritual involving wood, a ceremonial
    chamber, dancers, and a maiden's bones. They kill and skin her so the younger
    brother can impersonate her, enter the chamber, and retrieve his mother's bones.
    He drops one eye while escaping, and his mother revives at a spring with one shrunken
    eye. During the return journey, the younger brother violates a paternal prohibition
    by shooting an antelope; the surrounding animals become angry, trample the mother,
    break the tree where the brothers hide, and destroy the brothers, leaving only
    the elder brother's head and later a skull.
  language: English
  quote_policy: summarized
