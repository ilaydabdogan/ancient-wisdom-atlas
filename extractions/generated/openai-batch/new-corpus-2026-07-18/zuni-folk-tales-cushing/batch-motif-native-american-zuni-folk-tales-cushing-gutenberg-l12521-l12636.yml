canonical_text:
  quote: ''
  summary: The Eagle instructs a maiden to prepare at dawn for a risky skyward journey
    toward the Sun. She sorts ritual trays by color and region, says farewell to her
    priest-chief father, dresses in many garments, leaves colored corn-meal as an
    inheritance to her children or mankind, mounts the Eagle, and ascends through
    the sky while a dance occurs below. The people hear her farewell song. During
    the later dance cycles, two gods armed with bows and arrows seek to destroy her
    as she and the Eagle near the Sun-father's home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Eagle tells the maiden to bathe at dawn, dress at sunrise in her finest
    garments, wait through the repeated dance, and then be carried by him toward the
    waiting Sun, with possible death if they fail.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'At night the maiden spreads out basket-trays by fire-light and divides them
    into heaps by color and region: yellow to north, blue to west, red to south, white
    to east, variegated to upper regions, and black to lower regions.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The maiden tells her father that he will see her no more on the next day,
    and the old priest-chief accepts this as the will of the gods.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: As morning approaches, the maiden bathes, the Eagle tells her to rest before
    a long journey, watches for dawn, and wakes her when the great star rises before
    the Sun.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two war-priests call from the house-tops for the children to hasten, prepare,
    and eat for the dance.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The maiden puts on many fine garments and places four snow-white embroidered
    cotton mantles on her shoulders.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The maiden leaves basket-bowls of yellow, blue, red, white, speckled, and
    black corn-meal as an inheritance to her children, saying the meal will beautify
    flesh, protect against evil, and help finish the roads of life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The maiden says she is going far away to an unknown region and may either
    reach it and live or fail to reach it and die.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the drum begins and the first dance is coming, the Eagle lowers himself,
    tells the maiden how to hold his shoulders and place her feet, spreads and raises
    his tail to keep her from falling, and rises with her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Eagle and maiden circle upward in the sky while those below do not see
    them as they dance in the shadows of the great houses.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The maiden asks the Eagle to slow down so she can sing a farewell song to
    her people and children of Earth; the people below hear and say their mother and
    child is going away through the skies.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: During the third dance cycle the people report that the Eagle and maiden are
    in the mid-heavens, and the Eagle says they may still reach the home of their
    father.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: During the fourth and last dance cycle, two gods lead the dance with blackened
    war-painted faces and bows and arrows intended to destroy the priest-chief's daughter.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: At the end of the passage, the people say the Eagle and maiden are in the
    skies and almost at their destination.
  category: speech
  evidence_refs:
  - ev:9
