canonical_text:
  quote: ''
  summary: The passage introduces a very poor girl in Mátsaki who herds Turkeys for
    wealthy families. She treats the Turkeys kindly, and they love and obey her. After
    a herald-priest announces the Dance of the Sacred Bird at Zuñi, the girl longs
    to attend but thinks her poverty and clothing make it impossible. When the townspeople
    leave for the festival, a large Gobbler speaks for the elder Turkeys, offering
    to help her become handsomely dressed and unrecognized if she brings them home
    early. He warns her not to forget the Turkeys in her enjoyment. The girl promises
    to obey their directions.
  language: English
  quote_policy: summarized
