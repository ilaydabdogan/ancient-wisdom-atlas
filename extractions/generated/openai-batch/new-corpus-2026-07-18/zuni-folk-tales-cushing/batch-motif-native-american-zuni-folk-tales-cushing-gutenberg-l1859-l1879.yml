canonical_text:
  quote: ''
  summary: The youth and his Eagle wife fly to a blue mountain summit and descend
    through the sky. When the youth falters, the wife first supports him, then remembers
    his faithlessness, removes the Eagle dress that sustains him, bids him farewell,
    and leaves. The youth falls into the center of his former town and dies. The narrator
    states that no mortal alliance can avoid Death and warns against becoming enamored
    of Death.
