canonical_text:
  quote: ''
  summary: An old Coyote hears an old Locust singing and playing a flute from a piñon
    branch. Coyote asks to learn the song so he can dance his children to it. After
    learning imperfectly and setting off for home, he is startled first by a Gopher’s
    hole trap and later by a flock of Pigeons or Doves, and each time he forgets the
    song.
  language: English
  quote_policy: summarized
