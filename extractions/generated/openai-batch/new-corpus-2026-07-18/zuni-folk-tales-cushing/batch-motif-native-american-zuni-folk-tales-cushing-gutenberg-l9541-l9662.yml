canonical_text:
  quote: ''
  summary: The passage describes an evening in which two boys preparing arrows are
    visited by Amiwili, an old Rainbow-worm who fears the fire, and Etawa, an old
    Turtle. The four discuss an expedition against Háwikuh-town, with the two elder
    helpers promising destructive aid if the boys are pursued. After the elders leave,
    the boys prepare to rest with arrows and a water-shield. Their grandmother dresses
    ceremonially, fills a bowl with water, and says she will make medicine in cane
    tubes for the boys to shoot into the plaza of Háwikuh, where its mist will make
    those it wets cease to be warriors. The boys pretend to sleep while watching her
    wash and rub flesh-substance from her arms into the water.
  language: English
  quote_policy: summarized
