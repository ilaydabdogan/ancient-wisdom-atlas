canonical_text:
  quote: ''
  summary: After a fallen Giant is consumed by the little Top-knots, the boy removes
    the Giant's heart, kills most of the young Top-knots, and transforms two into
    a falcon and an owl for future sacrificial use. He returns home with the heart.
    His mother eventually tells him of a fearsome four-fold Elk or Bison named Awiteli
    Wakashi near Cold-making Hill. The boy goes out with bow and arrows, meets his
    Gopher grandfather, and receives underground help. The Gopher tunnels to the Bison's
    vulnerable heart area, exposes a patch of skin, and instructs the boy to shoot
    it and flee. The boy shoots; the Bison roars, falls, rips open the tunnel with
    its horn, and the boy escapes into the Gopher's deeper hole.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The little Top-knots gather around the fallen Giant, eat until they reach
    the top-knot on his head, and then recognize him as their own father.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy cuts out the Giant's heart and carries it over his shoulder.
  category: action
  evidence_refs:
