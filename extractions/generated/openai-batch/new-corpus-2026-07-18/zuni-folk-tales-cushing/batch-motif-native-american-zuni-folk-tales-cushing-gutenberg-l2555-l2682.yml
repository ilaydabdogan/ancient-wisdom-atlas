- id: obs:3
  text: The boy kills all the young Top-knots except a pair.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: One of the remaining young Top-knots is wrung by the neck, thrown into the
    air, becomes a winged creature, and flies away crying like present-day falcons.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The other remaining young Top-knot is swung around, thrown into the air, flies
    away heavily, cries like an owl, and becomes an owl.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boy states that the transformed beings were born for evil and changed
    for good, and that they will be means by which future children sacrifice to the
    gods.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The boy returns home with the Giant's heart and hangs it on the ladder cross-piece
    beside other hearts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The mother says she was worried, says the boy went where she had warned him,
    and scolds him for not listening.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: After repeated questioning, the mother tells the boy of a fearful four-fold
    Elk or Bison called Awiteli Wakashi near the little Cold-making Hill.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The four-fold Bison is described as enormous, stamping and bellowing, and
    feared by people who avoid that region.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The next morning the boy leaves earlier than ever with bows and arrows and
    travels toward the Bison while crying or pretending fear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: An old Gopher, called the boy's grandfather, recognizes the crying as his
    grandson's and calls him into a hole that enlarges when the boy puts his foot
    in.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The boy tells the Gopher that he wanted to see the four-fold Bison and, in
    truth, intended to kill it; the Gopher offers to help.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Gopher digs a long reinforced tunnel under the ground to the Bison's heart
    area and cuts away hair so that a white patch of skin is exposed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Gopher tells the boy to crawl through the tunnel, shoot the light patch
    next to the Bison's heart, and run back immediately to the Gopher hole.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The boy shoots the exposed patch; the Bison roars, falls, rises, bellows,
    thrusts its horn into the tunnel, and rips the tunnel open as the boy escapes
    into the deeper Gopher hole.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: After the boy escapes, the Gopher says he will go see whether the Bison is
    dead.
  category: speech
  evidence_refs:
  - ev:10
