canonical_text:
  quote: ''
  summary: An editor's note explains that during a summer 1886 pilgrimage to the “Ocean
    of Sunrise,” three Zuñis and Mr. Cushing entertained friends at Manchester-by-the-Sea
    with folk tales. Cushing interpreted the Zuñi tellings, then told the Italian
    tale “The Cock and the Mouse” from Thomas Frederick Crane's Italian Popular Tales.
    About a year later at Zuñi, Waíhusiwa presented a Zuñi version of the Italian
    tale. Cushing translated it literally, and the note says it is reproduced with
    Crane's translation to show transformation, adaptation to Zuñi environment and
    thought, and a method of folk-tale making.
  language: English
  quote_policy: summarized
