canonical_text:
  quote: ''
  summary: After a destructive demon is dying, two brothers give thanks to the Sun,
    instruct rescued maidens to report the event, announce their future separation
    from human paths and guardianship from mountain and star stations, and later dismember
    the demon. The demon’s head becomes a red lying star, its intestines become the
    Milky Way, and its remaining flesh gives rattlesnakes poisonous yellow fangs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two brothers stand over a gasping, dying demon and say that an enemy who caused
    grief to children and adults has been looked upon by the Sun and laid low.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rescued maidens realize who delivered them, respond with thanks, and perform
    a hand-breathing gesture.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brothers tell the maidens that the last enemy of men was destroyed through
    the power of sawanikia and through the Sun-father acting through them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The brothers send the maidens home to Héshokta to tell their father to assemble
    priests and teach the brothers’ words.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The brothers announce that they will separate their life paths from those
    of humans and go to everlasting homes at the Mountain of Thunder and the Mount
    of the Beloved.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The brothers say they will guard the land of the Corn-priests of Earth and
    prevent foolish people from laying waste the Middle Country of Earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The brothers state that two stars at morning and evening will be seen before
    and after the Sun-father, one as herald and one as guardian.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: The old father identifies the brothers as Áhaiyúta and Mátsailéma, offers
    meal, shells, pollen, and war paints, and plans to place painted and feathered
    plume-sticks on high mountains.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the maidens leave, the brothers laugh, kick Átahsaia’s carcass, skin
    it, stuff it with dry grass and moss, and set it up against a cliff as a lifelike
    figure.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Áhaiyúta cuts off Átahsaia’s head, calls it a future lying star, casts it
    into the sky, and it becomes the red star Mokwanosana.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mátsailéma tears out Átahsaia’s intestines and throws them aloft, where they
    stretch across the sky and become the Great Snow-drift of the Skies, identified
    as the Milky Way.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The remaining carcass is thrown into a chasm, rattlesnakes eat it, and their
    descendants’ fangs are described as yellow and poisonous.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Mátsailéma proposes using the stuffed hide for fun while Áhaiyúta carries
    it about.
  category: speech
  evidence_refs:
  - ev:7
