canonical_text:
  quote: ''
  summary: In the valley north of Háwikuh, people ambush a flock of Turkeys, killing
    many with sticks and arrows. A young Long-leg Turkey flees to Twin Mountain and
    reports the slaughter to Áhaiyúta, his younger brother, and their grandmother.
    Some Turkeys later return in small groups. The brothers decide to recover their
    loss by gathering wood or arrow-sticks despite their grandmother’s warnings about
    war. She reluctantly names places where sprouts grow and tells them that their
    grandfather, the Rainbow-worm, lives near Rain-pond Basin.
  language: English
  quote_policy: summarized
