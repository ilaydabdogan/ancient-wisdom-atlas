canonical_text:
  quote: ''
  summary: Amiwili expels lizard leaves that blind the Háwikuhkwe, enabling two boys
    to defeat and scalp enemies. Old Turtle proclaims victory to the old woman at
    Twin Mountain. Turtle and the old woman then divide, in exaggerated form, many
    offices of a victory celebration. The boys return singing with strings of scalps,
    and the small household performs repeated dances and rites. The narrator concludes
    that this explains the many distinct offices in the present Ceremony of Victory.
  language: English
  quote_policy: summarized
