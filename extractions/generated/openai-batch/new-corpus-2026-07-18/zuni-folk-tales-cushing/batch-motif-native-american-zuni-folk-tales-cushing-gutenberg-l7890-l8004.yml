canonical_text:
  quote: ''
  summary: In Prairie-dog Land, prolonged summer rain first makes the prairie-dogs’
    favorite food abundant, then floods the food fields and causes hunger. The prairie-dog
    elders call a council and decide to ask their grandfather, the Burrowing-owl priest,
    to stop the rain. The owl promises four days of fasting, meditation, and sacred
    labors. He then tells his wife to cook ill-smelling small beans, captures an ill-smelling
    Tip-beetle, and feeds the beetle multiple bowls of bean soup until it swells and
    asks for more.
  language: English
  quote_policy: summarized
