canonical_text:
  quote: ''
  summary: The passage continues a tale in which two young Gods of War attempt to
    satisfy conditions set by a maiden. After the maiden releases game animals over
    the land, she refuses marriage until the brothers can prepare a large store of
    buckskins. While soaking the skins at the river, the brothers hear and enter an
    underground village of Field-mice in human form, who offer to help remove the
    hair from the pelts in exchange for receiving all the hair.
  language: English
  quote_policy: summarized
