canonical_text:
  quote: ''
  summary: A Mouse flatters a caged Tâkâkâ/Cock, shares nuts with him, frees him by
    gnawing the cage fastening, lures him to a nut-tree, drops a nut on his head,
    and gnaws off his breast bristles. The injured Cock returns to his grandmother,
    who refuses treatment unless he produces bristles, which are already gone.
  language: English with embedded Zuni terms
  quote_policy: summarized
