canonical_text:
  quote: "“Behold, not a Turkey was there!”"
  summary: A maiden finds the turkeys gone, pursues them, hears their song of departure,
    calls them in vain, and sees them fly away toward Cañon Mesa and the plains near
    the Zuñi Mountains. Her dress returns to its former poor condition, and she returns
    to Mátsaki. The closing narration explains turkey tracks, graven song-figures
    in the rocks, and the abundance of turkeys in that place, then adds a moral about
    divine disposition and poverty of spirit.
  language: English, with Zuni song text and approximate English translation
  quote_policy: quoted
