canonical_text:
  quote: ''
  summary: An old grandmother tells two mischievous boys that the Rainbow-worm and
    another pond-dwelling grandfather are powerful warrior-grandfathers whose help
    they need. She instructs the boys to rise early and follow a specified route,
    but they sleep late, fool her, leave with bows and quivers, and take the Master
    Cañon route toward Rain-pond Basin. There they find the giant Rainbow-worm Amiwili
    eating leaves. The boys decide to frighten him, tickle him with a stalk, and Áhaiyúta
    shouts; Amiwili jumps, recognizes them as his grandchildren, and the boys say
    they have come for advice.
  language: English
  quote_policy: summarized
