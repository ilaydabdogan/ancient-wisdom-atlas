canonical_text:
  quote: ''
  summary: Elders instruct the young man and the rattlesnake maiden on returning by
    hollow log and lightning-shaft, warning against embracing her during the journey.
    The log is cast into the river, and its fangs become living rattlesnakes. The
    young man and maiden travel south, reach his town, live with his kin, and have
    fast-growing twins. Because the twins are mistreated, the Rattlesnake woman returns
    with them to her fathers after teaching the young man rites, chants, prayers,
    and medicines for rattlesnake bites. He cures and initiates eight men, is later
    bitten by his serpent fathers, dies, and his breath and being are taken to the
    home of the Maiden of the Rattlesnakes. The narrator identifies this as the origin
    of the Society of the Rattlesnakes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elders tell the child and father to release the lightning-shaft at the
    riverbank, let the tube plunge into the river, travel three days with the maiden,
    and not embrace her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before entering the hollow log, the maiden places her rattlesnake skin on
    the fangs, and lightning draws the pair up the river.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The youth lands the hollow log among the forest trees and dashes it into the
    great river; the fangs become living serpents, identified as the origin of rattlesnakes
    and their children throughout the world.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The young man journeys south with the maiden, kills game with the bow and
    arrows given by the Sun-father, and follows the Sun-father’s commandments.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the forest camp, the maiden fears the fire, its light pains her eyes, and
    she at first eats only a little of the cooked food.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: On the fourth day the pair enters the town under the mountains of Shíwina,
    are welcomed by the young man’s kin, are blessed by the old priest-chief, and
    dwell with Waíasialuhtitsa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The maiden gradually becomes used to mortal food and ways and gives birth
    to twins who grow to the power of wandering in a single day and night.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Other children beat and quarrel with the twins; the mother tells the father
    that she must return to the country of her fathers with the little ones, and he
    consents.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: For four days the Rattlesnake woman teaches the young man the prayers and
    chants of her people and shows him medicines and preparations to assuage rattlesnake
    bites.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: At the great river, the Rattlesnake woman says her fathers will meet her,
    tells the man he cannot follow because he eats cooked food and is mortal, and
    disappears with the children.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The young man cures snakebitten tribal youths by sucking wounds, applying
    medicines, singing incantations and prayers, breathing sacred breath, and teaching
    secret rituals and chants.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: After curing and teaching eight men, the young man is bitten in the mountains
    by his fathers, crawls home swollen, cannot be cured by the eight, and dies after
    urging them to cherish his wife’s knowledge.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: After his death, his fathers meet his breath and being and take them to the
    home of the Maiden of the Rattlesnakes and his children.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The narrator states that this is why there are fathers among the people for
    whom rattlesnake bites need cause no sad thoughts, naming the Tchi Kialikwe, the
    Society of the Rattlesnakes.
  category: speech
  evidence_refs:
  - ev:14
