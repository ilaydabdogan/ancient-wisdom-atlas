canonical_text:
  quote: ''
  summary: Two boys say their Turkeys were killed by people near Háwikuh and seek
    allies for retaliation. Old Amiwili boasts that he is a warrior and agrees to
    attend a council. The boys then find their Turtle grandfather Etawa at a pool,
    shoot an arrow at his back as a prank, explain their grievance, and gain his agreement
    to help and attend the council. The boys gather branches, oak sticks, and obsidian,
    feign exhaustion before their grandmother, eat food she prepares, and make arrows
    and four bows.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boys report that they had a large drove of Turkeys, let them out to feed,
    and that people near Háwikuh killed many of them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boys state that they intend to get back their winnings and even matters
    with the Háwikuhkwe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Old Amiwili agrees with the boys, boasts that he is a warrior made to use
    up life, and says he will show the Háwikuhkwe.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old Amiwili accepts an invitation to come to the council using the word translated
    in the passage as an old-fashioned form of “Go ye but before me.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boys go to a pool at the wood border where their Turtle grandfather is
    paddling in scum and biting off heads of water-rushes.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boys decide to have fun with the Turtle and shoot an arrow at his back;
    the arrow strikes him, he ducks under the scum, and the arrow glances upward so
    that the boys must run.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Turtle curses the boys, and the boys answer that they shot because he
    did not hear them and they could not get at him.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The boys tell the Turtle they are “out sprouting” because the Háwikuhkwe killed
    nearly all of their Turkeys.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Turtle agrees to help, calls himself a great warrior, says enemies’ weapons
    will be worse for the enemies, and accepts the invitation to the council.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The boys cut branches and four dry oak sticks in Oak-wood Cañon, shoulder
    the bundles as “sprouts,” pick up obsidian, and return home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Near home the boys act very tired; their grandmother pities them and prepares
