canonical_text:
  quote: ''
  summary: A maiden-spirit emerges from the grave at night and tells her lover she
    must make a long journey and can be seen only in darkness. The young man insists
    on accompanying her. She instructs him to prepare prayer-sticks, food, prayer-meal,
    and a red-dyed eagle down feather to tie above her forehead, then to follow the
    feather after she fades at dawn. He prepares the ritual items, returns to the
    grave, ties the plume, and follows it westward through the day. After difficult
    travel, he reaches a red light on a hilltop at night and finds the maiden-spirit
    there.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At night a light appears and the maiden comes out of the grave-bed; she says
    spirits are seen in darkness and that her husband killed her because he did not
    know her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man declares that he loves the maiden and wants to go wherever she
    goes, even if the journey is long and difficult.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The maiden identifies herself as a spirit and instructs the young man to prepare
    prayer-sticks, a red ocher-dyed down feather, food for four daylights, and prayer-meal,
    then to return to her grave at midnight.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The young man gathers feathers, makes prayer-sticks bound with cotton as gifts
    to the Fathers, dyes an eagle down feather red with ocher, attaches cotton string
    to it, and returns to the grave with food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At midnight the maiden-spirit comes out through the glowing grave-sands and
    stands beside the young man; they talk about their journey until dawn.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The young man ties the bright red plume above the maiden-spirit’s forehead;
    at sunrise she disappears from sight and the plume remains moving before him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The plume moves westward through streets, fields, by the river, and across
    plains; the young man follows it, becomes weary, calls for his bride, and the
    plume stops and waits.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: After nightfall the plume disappears, but the young man continues westward;
    near midnight he sees a red light on a hilltop and finds the maiden-spirit sitting
    there.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The young man becomes so weary that he sleeps while talking to the maiden-spirit,
    but she does not sleep because she is a spirit.
  category: attribute
  evidence_refs:
  - ev:8
