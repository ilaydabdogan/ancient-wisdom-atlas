canonical_text:
  quote: ''
  summary: A Coyote threatens to bite a Tip-beetle on a pathway near Fat Mountain.
    The Beetle delays the Coyote by claiming to hear below-ground preparations to
    punish those who defile public trails. The Coyote, admitting he has defiled the
    trail, runs away. The narrator explains that the Beetle’s actions account for
    the Tip-beetle’s habit of kicking its heels and putting its head into sand or
    holes.
  language: English
