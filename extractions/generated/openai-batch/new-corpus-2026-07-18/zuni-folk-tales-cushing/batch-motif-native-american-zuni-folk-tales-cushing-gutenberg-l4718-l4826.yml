canonical_text:
  quote: ''
  summary: A Deer-being instructs a young hunter to build a sealed, padded hollow-log
    vessel, stock it with sacred food and offerings, and have his people roll it into
    the river so he may travel toward the great mountain where the Sun enters. The
    youth reports this to his family; his father and the Priest of the Bow authorize
    communal ritual preparations. After offerings and supplies are prepared, the youth
    travels with four uncles to the great river, constructs the log vessel, enters
    it, seals it from within, and signals readiness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Deer-being directs the youth to select a large knife and a smaller knife
    and use them to cut down and hollow a great tree into a vessel with a round end-door,
    a top hole, an inner closing mechanism, and cotton padding.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Deer-being tells the youth to put sweetened parched corn meal, plumed
    prayer-sticks, and sacred pollen inside the vessel, enter it, close it from the
    inside, and be rolled into the river by his people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Deer-being says the youth will meet strange beings, choose one as a companion,
    and proceed to the great mountain where the Sun enters.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The youth returns home without game, eats, summons his father through his
