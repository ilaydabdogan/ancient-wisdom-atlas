canonical_text:
  quote: ''
  summary: Two little War-gods, Áhaiyúta and Mátsailéma, go hunting and encounter
    old Mítsina playing cane-cards. He invites them to gamble, showing valuables won
    from earlier defeated and slain players. The War-gods lose their belongings, clothing,
    body parts, bodies, and heads in successive wagers. Mítsina confines them, ties
    them near a fire, and scorches them without killing them. Their elder brothers
    on Thunder Mountain become aware and set out to Mítsina’s house to teach him a
    lesson.
  language: English
  quote_policy: summarized
