canonical_text:
  quote: ''
  summary: The youth presents plumes to the Sun-father and Moon-mother, joins the
    Sun-father for a four-day journey through world regions, sees peoples and human
    suffering, receives gifts and instructions for returning with the Rattlesnake
    maiden, travels swiftly over the waters by means of a lightning shaft in a hollow
    log, and presents plumes to the Rattlesnakes, whose uneven face-painting is explained.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The youth unwraps a bundle and lays plumes before the Sun-father, who breathes
    on the plumes and on the youth and thanks him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The youth also presents plumes to the Moon-mother, who breathes on them and
    gives thanks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sun-father tells the youth to join him for four days in his journey around
    the world to see towns and nations of mankind.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Sun-father says the maiden will remain safely in his house until he and
    the youth return.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: After feasting, the Sun-father dresses the youth like himself and leads him
    down through four great apartments into the Lower Country of the Earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Lower Country, snow and cold fill the world, and strange people clear
    snow from house-tops and doorways.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: At another House of the Sun, the youth presents plumes of prayer and sacrifice
    to the Sun-father's aunts and receives thanks and blessings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Coming into the World of Daylight, the travelers see summer rain below them.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The youth sees cities, tribes, wars, famine, disease, misery, poverty, and
    less happiness among the nations of men.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Sun-father says these people are his children, brothers to one another,
    and that he is father of all.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Each evening, the Sun-father gives his grandmother treasure sacrificed to
    him, and each day casts treasures of bad and double-hearted people into great
    waters.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: On the fourth day, the Sun-father tells the youth his task is complete and
    that he must return to the home of his fathers below the mountains of Shíwina.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Sun-father gives the youth a strong lightning shaft, a quiver of unerring
    arrows, and a strong bow, and instructs him not to forget sacrifices made with
    true word and faithful heart.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: The Sun-father instructs the youth to take the Rattlesnake maiden as guide
    and companion, stop briefly at the country of her people, heed the Rattle-tailed
    Serpents' counsel, present plumes of the Prey-beings, and continue his journey.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: In the morning, the youth and maiden enter a hollow house, and the lightning
    shaft draws the log swiftly over the great waters toward the home of the Rattle-tailed
    Serpents.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: The little tube is thrown high above the banks of the great island they are
    seeking soon after sunrise.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: The youth and maiden enter the council of the Rattlesnakes; the Rattlesnakes
