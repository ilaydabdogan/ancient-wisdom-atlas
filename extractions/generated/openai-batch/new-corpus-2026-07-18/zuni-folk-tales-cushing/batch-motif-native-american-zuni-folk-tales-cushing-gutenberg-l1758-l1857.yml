canonical_text:
  quote: ''
  summary: At daylight the youth wakes in a ruined house filled with bones and remains.
    When a bone fragment sounds out, the dead rise and pursue him. Badger grandparents
    hide him in a hole, repel the ghosts with their odor, and treat him with heated
    medicinal water drunk four times. They rebuke him for becoming enamored of Death
    and send him to the Storks. The Storks and then the Eagles reproach or reject
    him. After the elder Eagles plead, the Eagle-maid gives him an old ragged Eagle
    dress and tells him to come with her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At daylight the youth sees that the fine room of the previous night is now
    an old, tottering, wind-broken, sand-filled room.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The room contains bones, skulls, mummified fingers and feet, and faces partly
    buried in sand; bones cling to the youth where maidens had lain or held him.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The youth removes the bones from himself, steps quietly toward the broken
    doorway, and trips against a bone splinter that makes a sound.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the bone splinter sounds, bones and fragments of the dead arise and
    pursue the youth noisily as he runs toward the home of the Storks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Badger identified as one of the youth's grandparents calls him grandson;
    the Badger and others catch him up and cast him into a hole.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Badgers turn toward the pursuing ghosts, cast off their strong odor, and
    the host of ghosts turns back toward the City of the Dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Badgers heat water, mix in nauseating herbs and medicines, and direct
    the youth to drink; he drinks four times and says he feels much better.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Badgers scold the youth as foolish and faithless, saying he became enamored
    of Death, forfeited life and love, lost his plumage, and cannot descend to his
    own people below without wings.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the home of the Storks, the youth is reproached and told there is little
    possibility of regaining the love and affection of his wife.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the home of the Eagles, the youth lingers outside the high-walled house;
    the Eagles do not greet him, and his wife tells him to go back because he has
    forfeited her love.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The elder Eagles implore the Eagle-maid to take the youth back to his own
    home; she says he has been polluted by being enamored of Death, but she acquiesces.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Eagle-maid brings an old Eagle dress with broken and thin feathers, tells
    the youth to put it on, and then tells him to come with her according to the knowledge
    he had been taught.
  category: action
  evidence_refs:
  - ev:9
