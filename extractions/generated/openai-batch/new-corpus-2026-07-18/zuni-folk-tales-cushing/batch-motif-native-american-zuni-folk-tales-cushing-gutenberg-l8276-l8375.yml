canonical_text:
  quote: "“When they all returned to life, behold, they could not arise, but went
    wriggling along the ground...”"
  summary: A tale explains that Rattlesnakes were once a people at Yathlpew’nan. Children
    take their baby sister to play on sand-banks; she is accidentally crushed and
    killed while one child slides down the sand-hill. The children carry her home
    singing a lament. The mother, grandmother, villagers, and children cry out and
    swoon. When they revive, they can no longer stand, but move and cry like rattlesnakes.
    The narrator concludes that rattlesnakes were once people and should not be killed
    needlessly.
  language: English
  quote_policy: quoted
