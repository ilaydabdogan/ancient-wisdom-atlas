canonical_text:
  quote: ''
  summary: An old Turtle kills a deer near the Highflowing River but needs a flint-knife
    to skin it. While he sings a magic song to find flint, Coyote overhears, deduces
    that Turtle has killed a deer, and insists on helping. After the deer is skinned,
    Coyote demands half the meat, threatens Turtle, and fails to bite through Turtle's
    shell. Coyote stuffs sand into the opening of Turtle's shell and leaves him for
    dead, then prepares the deer meat and a blood-pudding while Turtle silently listens.
  language: English
  quote_policy: summarized
