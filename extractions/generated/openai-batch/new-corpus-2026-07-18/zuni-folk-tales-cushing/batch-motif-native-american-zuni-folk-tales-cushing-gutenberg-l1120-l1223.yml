canonical_text:
  quote: ''
  summary: A young man follows a maiden whose visible form fades in daylight, leaving
    a red plume to guide him across lava crags, cactus, and a deep canyon. The maiden
    warns that she goes to the Council of Dead Ones and that the living cannot enter
    there. When the young man nearly drops into the canyon, a striped Squirrel and
    his mate grow a hemlock tree by song so he can climb down, cross, and continue
    following the plume.
  language: English
  quote_policy: summarized
