canonical_text:
  quote: "“if you truly love me, I would that you should hoe the whole in a single
    morning.”"
  summary: 'A young man follows his grandmother’s counsel, gathers finger-root, visits
    a maiden’s household, and is given a courtship test: he must hoe her corn-field
    in one morning. After praying and making a meal offering, he works rapidly, rubs
    himself with finger-root bark, and withstands the maiden’s released swarm of biting
    insects because they find him repellent. The passage ends with an explanation
    of why mayflies are careful whom they bite.'
  language: English
  quote_policy: quoted
