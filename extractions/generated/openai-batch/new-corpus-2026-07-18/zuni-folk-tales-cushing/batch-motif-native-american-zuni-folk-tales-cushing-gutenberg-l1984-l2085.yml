canonical_text:
  quote: ''
  summary: The Turkeys invite the poor maiden into their house, renew her ragged clothing,
    cleanse and beautify her, and provide ornaments. They warn her to remember them,
    leave the wicket open, and not stay away too long. She goes to the Zuñi dance,
    is admired and invited to dance, delays her return in her enjoyment, and comes
    back only after sunset. The Turkeys conclude she has forgotten them and leave
    their cage for the mountains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Turkeys return home of their own accord, enter their places, and an old
    Gobbler invites the maiden into their house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old Gobbler asks the maiden to give him and his companions her clothing
    one article at a time so they can see whether they can renew it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The maiden gives her ragged mantle to the old Gobbler, who picks at it, treads
    on it, struts over it, puffs, and returns it as a beautiful white embroidered
    cotton mantle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Other Gobblers renew the rest of the maiden’s garments until each article
    is new and beautiful.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Turkeys circle the maiden, sing, cluck, and brush her with their wings;
    afterward her person, skin, hair, cheeks, and eyes are described as transformed
    in appearance.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: An old Turkey says that only rich ornaments are lacking and explains that
    the Turkeys have gathered small valuable things lost by people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Turkeys produce a necklace, earrings, and other proper ornaments and lay
    them at the maiden’s feet.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Turkeys tell the maiden to leave the wicket open, remember them, and not
    tarry too long; the maiden answers that she will remember them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The maiden goes down the river path to Zuñi, enters the dance court, and is
    noticed by the crowd for her beauty and rich dress.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The chiefs of the dance invite the maiden to join the youths and maidens dancing
    around the musicians and the altar in the plaza.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The maiden dances, and the finest youths among the dancers compete for her
    hand.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In her enjoyment the maiden does not attend to the Turkeys’ warning and decides
    to stay longer before returning to them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After sunset the maiden breaks away from the dance and runs up the river path.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Turkeys, wondering at her absence, conclude that she has forgotten them
    and leave their cage toward the mountains by named places near Zuñi.
  category: sequence
  evidence_refs:
  - ev:9
