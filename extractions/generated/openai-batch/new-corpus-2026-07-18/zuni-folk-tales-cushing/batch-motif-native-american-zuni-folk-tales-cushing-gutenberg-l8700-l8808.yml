canonical_text:
  quote: ''
  summary: A young woman hunting rabbits in a snowstorm kills and carries many rabbits,
    thinking of feeding her old parents. She becomes lost after dark, finds Taiuma’s
    Cave with live coals inside, builds up a fire, dries her clothes, and eats. Hearing
    a distant distress cry, she answers, then hears a huge rattle and realizes a Cannibal
    Demon has been led to her refuge by the fire and her reply. The Demon comes to
    the cave entrance, cannot fit through, and demands food and rabbits.
  language: English
  quote_policy: summarized
