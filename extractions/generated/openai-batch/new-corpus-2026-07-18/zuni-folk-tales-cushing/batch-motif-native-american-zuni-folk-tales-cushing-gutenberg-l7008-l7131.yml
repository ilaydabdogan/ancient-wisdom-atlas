canonical_text:
  quote: ''
  summary: In late autumn, Blackbirds gather on the rocky slopes of Gorge Mountain
    to dance, sing, fly upward in a flock, dip into a spring at the mountain’s foot,
    and return. A Coyote sees them, praises their dancing, and asks to join. The Blackbirds
    plant their feathers into his body to give him wings. The first attempt uses feathers
    from only one side, causing him to fly crookedly and crash into the mountain.
    The Blackbirds then add feathers from the other side, strong wing-tip feathers,
    and tail feathers; Coyote successfully flies with them, returns to the spring
    and slope, and boasts that he can fly as well as they can.
  language: English
  quote_policy: summarized
