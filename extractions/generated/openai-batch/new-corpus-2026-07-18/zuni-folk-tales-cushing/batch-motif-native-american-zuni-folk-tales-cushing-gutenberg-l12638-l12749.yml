canonical_text:
  quote: ''
  summary: Divine figures oppose the arrival of an Eagle and a maiden at the Sun's
    home. Elder and younger twin children of the Sun shoot medicine-pointed arrows
    that strike the maiden; the Eagle releases her and she falls near a mountain and
    the Waters of the Coyote. Twin boys are born and concealed among refuse. Acoma
    visitors claim and remove the maiden's body. An old Badger finds the crying infants,
    searches for parents, cleans them, takes them home, and with Badger-woman feeds
    and shelters them.
  language: English
  quote_policy: summarized
