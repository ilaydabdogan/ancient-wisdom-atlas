canonical_text:
  quote: "“I will run the race for them, providing only that the runners of K’iákime
    will permit me to go my own way, on my own road, which as you know runs underground.”"
  summary: A young man asks the old Gopher for help against the runners of K’iákime.
    The Gopher agrees to race for the people of Shíwina and Mátsaki if he may travel
    underground and if his reward is red paint and sacred yellow pollen. The challenge
    is accepted with the condition that he surface occasionally. The Gopher visits
    several similar younger brothers along the race-course, instructing each to dig
    paired holes, wear a red plume like his, briefly appear when the racers approach,
    and disappear into another hole. On the fourth day the trained K’iákime runners
    and the opposing people gather; the Gopher appears with a red plume, sets down
    his stick to seize with his teeth, and explains that his short feet prevent him
    from kicking it.
  language: English
  quote_policy: quoted
