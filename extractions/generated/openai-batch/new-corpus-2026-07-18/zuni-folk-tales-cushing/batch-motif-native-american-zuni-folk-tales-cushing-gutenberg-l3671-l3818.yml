canonical_text:
  quote: "“went down the valley and presently ran into the river, leaving no trail
    behind”"
  summary: Two small, odd brothers bring rats as courtship gifts to a maiden’s father.
    The father ritually acknowledges the rats with prayer-meal and refers the marriage
    question to his daughter. The maiden, who despises the suitors, sends them to
    an upper room as she has done with others. The next day the brothers secretly
    watch her escape by a trackless river route, follow the route to a mountain corral
    full of game animals, kill deer there, and make her help skin and carry the meat.
  language: English
  quote_policy: quoted
