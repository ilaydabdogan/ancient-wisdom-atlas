canonical_text:
  quote: ''
  summary: A mature youth at Middle Place keeps and cherishes a pet Eagle, neglecting
    household and field duties. His brothers and male relatives plan to kill the bird.
    The Eagle reveals that it has heard the plot and must return to its home in the
    skies. The youth begs to accompany it despite warnings that he lacks wings, sky-knowledge,
    and the foodways of the Eagle's people. The Eagle finally instructs him to prepare
    provisions for a long journey and return the next morning.
  language: English
  quote_policy: summarized
