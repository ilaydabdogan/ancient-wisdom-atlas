canonical_text:
  quote: ''
  summary: A wealthy maiden of the ancient town called the Middle Ant Hill of the
    World owns many corn-fields troubled by animal pests and is also beset by suitors.
    She promises marriage to any suitor who can permanently remove the corn pests.
    A poor, ugly young man from an outer town comes as a suitor, is conditionally
    accepted, and builds a concealed baited pit in her fields. At night the animal
    pests descend; a Coyote leaps for the bait, falls into the pit, cannot escape,
    and howls until a Bear approaches and questions him.
  language: English
  quote_policy: summarized
