canonical_text:
  quote: ''
  summary: The community condemns the priest-chief’s daughter, her unknown husband,
    and their children. The husband ascends in mist to the Sun-father, who appoints
    him to future godhood and rain-giving, judges the people unwise, and instructs
    him to use sacred hoops, wands, and a cotton mantle to lift his family and valuables
    away. As armed people approach, the family grasps the blanket’s corners and rises
    through the sky-hole above the roof.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people convene a council and question the young men about whether any
    of them secretly married the priest-chief’s daughter; each denies it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The council decides that the daughter, the unknown husband, and the two little
    ones should die, and two war-priests command the people to prepare weapons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The priest-chief’s daughter hears the heralds and learns from her younger
    sister that they must all die.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The young man tells the old priest he knows what will happen; the old priest
    answers that the will of the gods should be done and calls the people foolish.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The young man tells his wife he must go to meet his father, asks her to open
    the sky-hole, then becomes a cloud of mist that whirls upward in sunlight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Sun-father receives the young man, rebukes him for not obeying commands
    given to him and his brother, and the young man acknowledges the rebuke.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Sun-father tells the young man that he will be a god at his left hand,
    be seen and worshipped in the evening, and cause rain to fall through his will.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Sun-father says he had intended the young man to enrich the people with
    shells, stones, knowledge, and good fortune, but that the people are unwise and
    ungrateful.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Sun-father instructs the young man to make four sacred hoops with cotton,
    four sacred wands, and to use an unembroidered cotton mantle.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Sun-father instructs the family to sit at the four corners of the mantle,
    lift the corners as the attackers approach, and thereby be raised to his country.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The old priest-chief continues the festival preparations without visible change,
    and the young man says they will dwell forever at the Sun-father’s home.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Priests of War summon the armed people, who gather with shields, lances,
    and war-clubs and make war-cries.
  category: action
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:13
  text: The husband, wife, and children place their belongings on the blanket, grasp
    its corners, rise toward the ceiling, approach the sky-hole, pass above the roof,
    and are seen by their shadows.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The young men shout that the family is escaping after seeing the shadow.
  category: speech
  evidence_refs:
  - ev:14
