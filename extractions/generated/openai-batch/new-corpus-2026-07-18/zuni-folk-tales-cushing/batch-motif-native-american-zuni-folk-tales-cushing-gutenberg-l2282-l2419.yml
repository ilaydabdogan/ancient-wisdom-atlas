canonical_text:
  quote: ''
  summary: A Bear supplies a boy with wood for a bow and arrows and instructs him
    how to make the bow. The boy tells his mother that he has sold her to the Bear.
    He makes the weapons, receives the Bear on the roof, and kills him with an arrow
    after the Bear dismisses the black arrowheads as coals. The boy skins the Bear
    and hangs its heart on the ladder as a sign that people may gather bow timber
    and arrows. Later, the boy repeatedly asks his mother about nearby monsters, and
    she describes venomous Misho Lizards in a valley den who politely invite visitors
    inside and then kill them with burning, blinding fluid from their mouths or breath.
  language: English
  quote_policy: summarized
