- id: obs:2
  text: The maiden says she will enter first, take on a form suited to the space,
    and instructs the young man to enter after her, kick the log to the shore waters,
    and close the door.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The maiden changes back into serpent form and crawls into the log; a wave
    carries the closed log out onto the waters.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The young man fears the rattlesnake maiden may bite him and devour his flesh
    while he sleeps.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: To reduce the young man's fear, the maiden removes her skin and hangs it on
    the fangs outside the door.
