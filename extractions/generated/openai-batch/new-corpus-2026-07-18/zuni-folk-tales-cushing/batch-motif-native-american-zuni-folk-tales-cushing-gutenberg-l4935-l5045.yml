canonical_text:
  quote: ''
  summary: A rattlesnake maiden prepares a fang-studded log as a vessel, resumes serpent
    form, and travels with a young man over the waters. She removes her serpent skin
    to ease his fear and feeds by gathering corn-flower pollen into her scales. After
    a long westward voyage, the vessel reaches the mountain where the Sun enters.
    The maiden and youth enter the Mountain of the Sea, meet the Sun-father and his
    grandmother, and witness the Sun-father sorting human offerings according to the
    sincerity of the givers. The Sun-father asks the youth to bring forth plumes and
    gifts for his mother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The maiden bores many holes in a log and inserts crooked fangs so that they
    slant toward the rear.
