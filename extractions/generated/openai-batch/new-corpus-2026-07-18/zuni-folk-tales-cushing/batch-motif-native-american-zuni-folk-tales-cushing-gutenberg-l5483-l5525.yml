canonical_text:
  quote: ''
  summary: The two boys lament killing their grandmother and bury her after the water
    recedes. A plant with red pointed pods grows from the burial place; the boys interpret
    it as arising from her heart and scatter its seeds, which become cultivated peppers
    at Zuñi. The passage also explains the name and storminess of Thunder Mountain
    and gives an alternate note that the boys blamed their grandfather Centipede for
    stolen thunder and lightning objects, after which the Rain Gods burned and shriveled
    him.
  language: English
  quote_policy: summarized
