canonical_text:
  quote: ''
  summary: A Moki youth travels with a large pack of Dogs, hides them in arroyos near
    the route to Zuñi, and instructs them to conceal themselves for an ambush. Before
    dawn he approaches Zuñi, kills and scalps several men near the town, takes valuables,
    and flees. The Zuñi people and Priests of the Bow arm themselves and pursue him.
    The youth reaches the arroyo and calls to his Dogs, who prepare to spring.
  language: English
  quote_policy: summarized
