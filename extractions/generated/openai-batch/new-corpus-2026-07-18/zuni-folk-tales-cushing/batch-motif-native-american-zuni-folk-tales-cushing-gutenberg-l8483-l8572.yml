canonical_text:
  quote: ''
  summary: A trapped Coyote deceives Bear into joining him in a pit, then the two
    lure many corn-pests into the same hole. Coyote climbs over the others and escapes.
    A young man later finds the pests in the pit and burns them with dry wood, but
    Coyote is absent. The young man reports this to the girl whose corn had been harmed,
    and she accepts him for his ingenuity. The ending explains that Coyote's escape
    is why coyotes remain abundant corn-pests in the land of Zuñi.
  language: English
  quote_policy: summarized
