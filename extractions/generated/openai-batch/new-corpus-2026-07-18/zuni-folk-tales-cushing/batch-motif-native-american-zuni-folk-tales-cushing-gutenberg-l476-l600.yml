canonical_text:
  quote: ''
  summary: The passage opens the tale of the Maiden of Mátsaki and the Red Feather.
    It describes Mátsaki, the beautiful daughter of a wealthy priest-chief, and a
    young man from the Pueblo of the Winds who comes with gifts to seek her. After
    formal household hospitality and a courtship discussion, the maiden privately
    requires him to prove his love by hoeing all her corn in a single morning. He
    accepts and begins the task at dawn while she watches from the rooftop and doubts
    him.
  language: English
  quote_policy: summarized
