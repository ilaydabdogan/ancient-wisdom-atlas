canonical_text:
  quote: ''
  summary: In ancient K’iákime, under Thunder Mountain, a priest-chief’s daughter
    remains unseen inside her house. The Sun visits her at noon by descending on his
    rays and is her lover and only companion. Townspeople try to see her through dances,
    but fail. The Sun has placed a wise old Eagle in a cage on the housetop to watch
    her. After repeated failures, the two Warrior Priests of the Bow order the Óinahe
    dance and consult the War Gods on Thunder Mountain, who agree that the girl must
    come forth or die.
  language: English
  quote_policy: summarized
