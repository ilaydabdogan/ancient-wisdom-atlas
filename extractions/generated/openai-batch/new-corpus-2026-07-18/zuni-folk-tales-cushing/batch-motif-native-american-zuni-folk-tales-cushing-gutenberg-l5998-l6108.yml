canonical_text:
  quote: ''
  summary: The passage describes a route to a basin called Sunken Country, where Prairie-dogs
    and other animals live near respected Burrowing-owls. The Burrowing-owls perform
    a sacred Foam-dance in which dancers balance white objects on their heads and
    limp in unison. A Coyote hears the music, approaches, questions the old Owl master
    of ceremonies, and asks whether he can learn the dance. The Owl explains that
    the dancers are initiated, that the white objects are their grandmothers' heads,
    and that the limp is attained by having their legs broken. The Owl then asks whether
    Coyote has a grandmother, and Coyote says that he does.
  language: English
  quote_policy: summarized
