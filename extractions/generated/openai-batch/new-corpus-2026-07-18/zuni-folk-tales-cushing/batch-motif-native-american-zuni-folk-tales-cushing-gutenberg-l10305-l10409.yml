canonical_text:
  quote: ''
  summary: After Lesser Falcon returns with only a head-plume from Old Tarantula,
    the town sends Swift-runner with offerings to the two War-gods on Thunder Mountain.
    Swift-runner asks for aid against Old Tarantula, who had stripped him and retreated
    to his den. The War-gods have their grandmother grind white sandstone into rock
    flour; they mold it into two deer and two antelope images, instructing Swift-runner
    to place them on a sacrificial rock-shelf so they will become beings and lure
    Old Tarantula from his den. The town prepares for war, and at dawn Swift-runner
    finds the animals alive and speaking.
  language: English
  quote_policy: summarized
