canonical_text:
  quote: ''
  summary: A maiden follows a plume to a lake and descends by a ladder of flags into
    the waters, where light, voices, music, and the Land of Spirits appear. Her mourning
    lover cannot enter. A great Owl leads him to a mountain cave, gives counsel through
    sleep-medicine, and directs owl-beings to retrieve the maiden from the Kâkâ home
    after placing prayer-plumes at an altar. At morning star and sunrise she wakes
    beside the young man, and they travel apart toward their ancestral home under
    the Owl's prohibition against approaching or kissing her before arrival.
  language: English
  quote_policy: summarized
