canonical_text:
  quote: ''
  summary: The Sun-father instructs two boys how to recover their mother's remains
    after a dance so that she may live again, warns them not to kill game, dresses
    and cleanses them so that they resemble him, identifies them as his children,
    and sends them back to their Badger foster parents. The boys return with tokens
    of their earlier identity, are recognized, recount their mother's killing and
    their own birth, and are told that the dance at the Home of the Eagles will occur
    in eight days.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sun-father says that after the dance one boy must pretend to sleep, then
    gather the mother's bones, two dried eyes, and heart while others sleep.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sun-father says the mother will come to life again if no bone or part
    is left behind.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boys agree to do what they have been told.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Sun-father says he has given the boys power to slay game, but forbids
    them to kill rabbit, deer, antelope, mountain sheep, or elk, warning that they
    and their mother would perish.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boys promise not to kill the forbidden game.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Sun-father removes the younger brother's bark moccasin and dresses him
    with fringed leggings, buskins, many-colored garters, a quiver, arranged hair,
    and plumes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Sun-father creates a warm cloud of mist and cleanses the boys; their skins
    become smooth and clear and their hair falls in wavy masses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Sun-father dresses the elder brother like the younger brother.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The boys observe that they look like the Sun-father, infer that he is their
    father, and thank him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Sun-father calls the boys his children, says he must go to his home in
    the heavens, and tells them to return to the Badgers with their bark moccasins,
    corn-cakes, and slain rabbits.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Sun-father passes his hands over the dead rabbits, after which they are
    light enough for the children to lift.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: When the boys look back after departing, the Sun-father is no longer visible.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The two Badgers are waiting near their hole and initially do not recognize
    the transformed boys.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The boys identify themselves to the Badgers by showing their bark moccasins
    and strings of corn-cakes.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: The boys report that their mother lived at the Home of the Eagles, was killed
    by the Twain while escaping on the back of an Eagle, fell into the Cañon of the
    Coyote, and that they were born there and reared by the Badgers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The old Badger says a dance will occur at the Home of the Eagles in eight
    days and that the boys will go there to see it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: The boys remove their new clothing inside the Badger home, lay it away carefully,
    eat with the family, and ask the old Badger to keep count until the dance.
  category: sequence
  evidence_refs:
  - ev:7
