canonical_text:
  quote: "“I am only a spirit”"
  summary: The young man realizes the maiden has died after he has harmed her, washes
    blood from her temples with river water, and mourns over her as his wife. The
    priest-chief father orders her burial near the House of the Sun. The young man
    keeps vigil at the grave, where a nocturnal light appears; the dead wife rises
    as a spirit, reproaches him for killing her through misrecognition, tells him
    to go home, and fades by morning. The grave-side vigil and apparition repeat the
    next night.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The young man cries aloud, beats his breast, brings water from the river,
    washes blood from the maiden’s temples, and the maiden becomes still and cold.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man weeps over the body, holds her, places his face near hers, and
    repeatedly addresses her as his beautiful wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people return from the fields, miss the maiden of Mátsaki, see the young
    man by the river, and report to the old father.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old father says his child is not well, refers to what the gods say, and
    orders the people to bring her to the plaza of Mátsaki and bury her before the
    House of the Sun.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The people take the maiden at sunset, wrap her in mantles, and bury her near
    the House of the Sun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The young man follows, makes or attends the grave, stays by the earth bed
    after sunset, and laments that he did not know her and killed her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator marks the continuation of the story and states that the young
    man killed the Maid of Mátsaki because he did not know his wife from the other.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After sunset the young man remains at the grave-side with his face in his
    hands, while the people stop trying to remove his sad thoughts and leave him to
    weep.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the moon has set and the night is half gone, the young man sees a light
    in the grave-sands like dying embers; the light grows and brightens.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The bride is seen beneath the grave-sands, tears off her mantles, raises herself
    in the grave-bed, and looks coldly and sadly at the young man.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The dead maiden says the young man did not know her from the other, did not
    love her, and therefore killed her.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The young man responds by burying his face in his hands and lamenting that
    he does love her, loved her, did not know her, and killed her.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The dead maiden tells the young man not to mourn, to go back to the home of
    his fathers, calls herself another being and only a spirit, and says the light
    by which he sees her will fade in the morning light.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the gray morning the young man sees only the dark sand of the grave where
    the light had appeared; he leaves in sorrow, remains silent during the day, and
    returns to the grave when dark comes again.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: On the next night the light in the grave-sands glows more brightly, the maiden’s
    spirit arises and sits in her grave-bed, reproaches him, and bids him go; he leaves
    only in the morning and returns again at dark.
  category: sequence
  evidence_refs:
  - ev:11
