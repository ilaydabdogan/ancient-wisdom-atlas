canonical_text:
  quote: ''
  summary: A maiden who has shut up the game animals continues testing suitors by
    requiring a deer. A poor hunter fails. Two small gods from Thunder Mountain, Áhaiyúta
    and Mátsailéma, decide to court her despite their grandmother's warnings. They
    discard a worthless bundle, kill wood-rats as a proposed gift, wait near the cliffs
    until evening, and approach the maiden's house by its tall ladder and bells.
  language: English
