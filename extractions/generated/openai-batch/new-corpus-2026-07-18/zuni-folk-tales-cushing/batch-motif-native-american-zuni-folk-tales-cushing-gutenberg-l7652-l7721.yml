canonical_text:
  quote: ''
  summary: A Locust, expecting trouble from Coyote, molts and makes a lifelike decoy
    by filling his shed skin with a quartz stone and sealing it to the tree. Coyote
    returns after forgetting a song, demands that the silent decoy sing, threatens
    it, then bites it and breaks his teeth on the stone. The narrator explains this
    as the origin of broken-looking coyote teeth and as a defensive custom of locusts
    leaving counterparts on trees.
  language: English
  quote_policy: summarized
