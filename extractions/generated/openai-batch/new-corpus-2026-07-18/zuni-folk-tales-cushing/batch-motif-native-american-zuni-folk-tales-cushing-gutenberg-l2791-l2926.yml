canonical_text:
  quote: ''
  summary: A boy in an eagle nest questions young eagles about when their parents
    return. The mother eagle brings a dead maiden and is killed by the boy; the father
    eagle brings a fair youth and is also killed, after which the boy kills the young
    eagles and takes colored plumes. Unable to climb down or up the cliff, the boy
    cries until old Bat Woman hears him. She agrees to carry him down in her basket
    if he keeps his eyes shut and joins her prayer in his heart. During the descent
    he becomes impatient with her song, opens his eyes, and they fall to the ground.
    Bat Woman scolds him as disobedient and unteachable.
  language: English
  quote_policy: summarized
