canonical_text:
  quote: ''
  summary: Coyote, married to the sister of a group of animal brothers, boasts and
    joins their hunt despite Mountain Lion's insults. He disrupts the game drive,
    is sent home with venison, forgets Wolf's instruction to take the right-hand trail
    at a fork, chooses the left-hand trail, and dies after Chimney-swallows harass
    him on a cliff. The sister and brothers later search and find his body.
  language: English
  quote_policy: summarized
