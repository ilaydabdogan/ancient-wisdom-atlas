canonical_text:
  quote: ''
  summary: In K’iákime under Thunder Mountain, a secluded maiden is secretly wooed
    and married by a Rain God who descends through rain and dew. She bears a rapidly
    maturing divine son who hunts birds and small animals. Wanting a bow and arrows,
    the boy asks where such wood grows; his mother warns him of a cave on the eastern
    side of Thunder Mountain guarded by a deadly Bear. The boy secretly goes there,
    ignores repeated lightning warnings from his Rain God father, enters the cave,
    and is seized by the Bear. When the boy tells the Bear that his mother is very
    beautiful, the Bear releases him, welcomes him, and offers to cut bow and arrow
    wood for him.
  language: English
  quote_policy: summarized
