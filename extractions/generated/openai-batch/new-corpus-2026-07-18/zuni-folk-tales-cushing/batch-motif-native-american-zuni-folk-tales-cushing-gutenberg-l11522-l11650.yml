canonical_text:
  quote: ''
  summary: Áhaiyúta and Mátsailéma, the Twain Little-ones, hear distress from beneath
    a deep pool, descend through the water by means of reversed cord-shields, and
    reach an Underworld village. There they observe people who consume the steam and
    savor of cooked food while avoiding the food itself. The villagers detect and
    pursue them; the Twain shoot arrows through the crowd, but no one falls.
  language: English
