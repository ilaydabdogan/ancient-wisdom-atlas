canonical_text:
  quote: ''
  summary: At Háwikuh, a secluded maiden devoted to sacred things is visited by the
    Sun-father, becomes his wife, and bears a son. Fearing she will not be believed,
    she exposes the baby near a stream. A Deer with two fawns finds and adopts the
    child, suckles him, carries him to her lair, and raises him. The child grows with
    miraculous speed, learns the language and ways of the Deer, is introduced to the
    herd, and becomes leader of the Deer of the Háwikuh country.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A beautiful maiden at Háwikuh had been devoted to sacred things by her father,
    a great priest, and was kept inside away from the gaze of men.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sun saw the maiden through beams of light entering her room, loved her,
    descended along a beam as a glorious youth, and was identified as the Sun-father.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sun-father and the maiden loved one another; he won her as his wife and
    visited her secretly at noon while she continued ordinary household activity such
    as weaving trays.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The maiden, knowing her sacred dedication and fearing disbelief about her
    motherhood, decided to put away her child after birth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The child was born at night as a baby boy; the maiden wrapped him in soft
    cotton-wool and placed him near a refuse heap beside the little stream below Háwikuh.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At daybreak, a Deer with two speckled fawns came to drink at the stream, heard
    the infant crying, and saw cotton-wool and other things disturbed around the refuse
    heap.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Deer declared that the human child would be hers, warmed and caressed
    him, rewrapped him, lifted him on her horns, and carried him south while her fawns
    followed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Deer's home was south of Háwikuh near the spring called Póshaan, in a
    sheltered clump of piñon and cedar trees used as a warm lair.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'After being suckled with the Deer''s milk, the infant grew rapidly: by the
    next day he was creeping, by the fourth day running with the fawns, and by the
    eighth day he was a fair youth.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The foster-child played with his deer brother and sister, grew strong and
    swift, and learned the language and ways of the Deer.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After the foster-child had learned what a Deer should know, the Deer-mother
    introduced him to the larger herd, which accepted him, and he became leader of
    the Deer of the Háwikuh country.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: 'The youth developed bodily traits compared with deer traits: hard soles like
    hoofs, strong dark skin, and long soft hair compared to deer side hair.'
  category: attribute
  evidence_refs:
  - ev:10
