  quote: ''
  summary: A younger brother explains that he shot his wife because he feared his
    father, the Sun, would take others away with her, then presents two grandchildren
    to their grandmother. The grandmother initially refuses to look at them but then
    accepts them, prepares beds and food, and raises them. The narrator states that
    even cruel gods succored helpless children, and that this is why the people care
    for abandoned children as their own.
