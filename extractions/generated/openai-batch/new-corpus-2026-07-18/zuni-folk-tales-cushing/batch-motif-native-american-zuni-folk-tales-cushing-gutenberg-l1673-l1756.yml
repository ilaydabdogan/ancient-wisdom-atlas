canonical_text:
  quote: "“do not laugh or even smile once”"
  summary: After the youth is seen in the fearful city, its inhabitants invite the
    Eagle people to a festival and dance. His Eagle-wife warns that the place is the
    city of the damned and that he must not laugh or smile. He attends with the Eagle
    people, watches beautiful dancers who chant that they are dead, finally laughs
    at one dancer, is drawn into the dance, and remains overnight among the maidens
    while his Eagle-wife flies away in sorrow.
  language: English
  quote_policy: quoted
