canonical_text:
  quote: "“woman though she was, she would set forth on the morrow”"
  summary: The passage opens a tale of a poor unmarried maiden at K’yawana Tehua-tsana
    who lives with her aged parents after her brothers have died. Because the family
    cannot obtain enough meat and the young male hunters do not share rabbits with
    her household, she resolves after a snowfall to hunt rabbits herself. Her parents
    warn her against the danger, but her father prepares deerskin stockings, rabbit-sticks,
    and a stone axe, while her mother prepares a string of corn-cakes. At dawn she
    dresses for the hunt, leaves eastward through the Gateway of Zuñi into the valley,
    and sees rabbit trails in the snow near cliffs and bushes.
  language: English
  quote_policy: quoted
