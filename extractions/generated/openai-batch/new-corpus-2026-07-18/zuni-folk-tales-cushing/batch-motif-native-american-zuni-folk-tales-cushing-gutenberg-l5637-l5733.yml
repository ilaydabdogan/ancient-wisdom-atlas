canonical_text:
  quote: ''
  summary: A seemingly poor youth, who has learned the ways and language of dogs and
    other captive animals through long association, gathers the Dogs of Moki in council.
    He proposes that they join his war expedition toward Zuni in exchange for feasting
    and the prospect of being left alone. He obtains abundant food from the maiden's
    family, makes simple weapons, instructs the dogs to follow him secretly after
    the people sleep, departs for a rendezvous near the Black Mountains and the Spring
    of the Night-hawks, lights a fire, cooks mush, and feeds the arriving dogs at
    the camp.
  language: English
  quote_policy: summarized
