- id: obs:11
  text: The youth knows that the provisions he receives will be tempting to Dogs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: By the fourth day, the youth has made weapons consisting of flint knives and
    a hard war-club.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The youth again calls at the places where the Dogs live and instructs them
