canonical_text:
  quote: ''
  summary: A petitioner says Old Tarantula has stolen his sacred apparel and sends
    Deer and Antelope to lure him from his den. A youth calls out that game is passing;
    Old Tarantula arms himself, shoots the animals, and tries to carry them home,
    but they become heavy white rock. The people seize him, strip away the stolen
    garments, and the old priests decide he must be roasted because of his power and
    craft. The people burn him; he bursts, and his scattered fragments become smaller
    tarantula-like beings, explaining modern tarantulas. The next tale begins with
    a heading naming Átahsaia, the Cannibal Demon, and introduces two chief's daughters
    at Héshokta, where the elder proposes washing clothes at a pool and the younger
    warns of fearful presences in shadows and sage-bushes.
  language: English
  quote_policy: summarized
