canonical_text:
  quote: ''
  summary: A youth prepares travel food and mounts his Eagle. The Eagle carries him
    upward while singing farewell, and the townspeople see them depart. They pass
    through an opening at the zenith into the sky-world and land on the Mountain of
    Turquoises. There the Eagle removes an eagle-coat and appears as a beautiful maiden.
    She leads the youth to the home of the Eagle people, where they are welcomed,
    and an old man asks that they be wife and husband. They agree and marry.
  language: English
