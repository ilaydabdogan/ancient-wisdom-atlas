  quote: ''
  summary: Blackbirds judge Coyote to be an unsuitable dance companion and plan to
    pluck him during flight. During a flying procession from a mountain slope, Coyote
    tires and calls for help. The Blackbirds pretend to support him while plucking
    out his feathers, causing him to fall to the ground. The remaining feathers on
    his forelegs and tail-tip shrivel into black fringes, explaining black markings
    on coyotes' forelegs and tails.
