canonical_text:
  quote: ''
  summary: After Great Kingfisher reports failure against Old Tarantula, the council
    sends Great Eagle, who also fails to seize Old Tarantula at his den. Old Tarantula
    retreats, boasts, dances, and sings. The council then sends Hatchutsanona, the
    Lesser Falcon, whose camouflaged plumage lets him approach closely enough to take
    the macaw plumes from Old Tarantula's head-dress. Old Tarantula laments the loss,
    then dismisses it, boasts of his remaining costume, and dances again.
  language: English
  quote_policy: summarized
