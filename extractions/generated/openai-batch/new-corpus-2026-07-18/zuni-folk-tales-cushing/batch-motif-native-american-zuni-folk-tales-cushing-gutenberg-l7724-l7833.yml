  quote: THE COYOTE AND THE RAVENS WHO RACED THEIR EYES
  summary: A Coyote wanders from his home near Face Mountain to Thunder Mountain,
    where two old Ravens sit on a standing rock and race their eyes around distant
    rocks. The Coyote watches, laughs, asks what they are doing, and wants to try
    the same feat. His eyes do not leave their sockets, and the Ravens offer to help
    by taking them out for him.
