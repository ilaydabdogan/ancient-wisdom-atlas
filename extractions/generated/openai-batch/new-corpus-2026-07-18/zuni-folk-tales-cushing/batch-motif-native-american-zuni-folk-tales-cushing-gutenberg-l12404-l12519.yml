canonical_text:
  quote: ''
  summary: A divine pair promises that a dance will achieve the people’s wish on its
    fourth occurrence. The Eagle warns the secluded daughter of the priest-chief that
    the people and war-priests want to draw her out and that the Twain have decreed
    she may be no more. She frees the Eagle, who ascends to the Sun for counsel. The
    Sun instructs him to return, have her bathe and dress finely, and carry her upward,
    though the decree of the Twain may still take effect. The maiden watches for the
    Eagle in a water-filled sacred bowl, and after the Sun’s exposed shield makes
    the earth intensely hot, she cools the returning Eagle and asks what the Sun advised.
  language: English
  quote_policy: summarized
