canonical_text:
  quote: Maybe had the young man not kissed her yonder toward the Lake of the Dead
  summary: A maiden asks her husband to watch while she sleeps under a cedar. He approaches,
    touches, and kisses her. She awakens, rebukes him as loveless, and he is shamed.
    An owl hoots mournfully, flies westward, and afterward the young man’s mind wanders.
    The narrator connects the kiss near the Lake of the Dead with human death, mourning,
    and the prevention of overpopulation, starvation, and war.
  language: English
  quote_policy: quoted
