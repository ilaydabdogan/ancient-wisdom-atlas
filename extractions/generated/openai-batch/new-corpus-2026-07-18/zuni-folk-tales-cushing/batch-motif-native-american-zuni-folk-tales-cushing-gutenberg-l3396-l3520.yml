canonical_text:
  quote: ''
  summary: A maiden requires suitors to prove themselves by hunting deer or antelope.
    While suitors hunt unsuccessfully, she travels upstream through water to a place
    where her deer are gathered, leaving no tracks. The first suitor and Hálona fail
    the hunting test and are sent away with their bundles. Another young man from
    the City of Salt prepares two bundles, believing previous suitors failed by bringing
    insufficient gifts.
  language: English
  quote_policy: summarized
