canonical_text:
  quote: ''
  summary: After Old Tarantula strips Swift-runner of sacred, precious garments, the
    town consults its warrior priest and attempts to dig Tarantula out of his den.
    The digging reaches the rock foundations of the mountain and a cave-like opening,
    but the people give up. The elders then summon Great Kingfisher, known for swift
    snatching. Kingfisher hides near Tarantula’s hole and dives, but Tarantula detects
    him with many sharp eyes, escapes into the hole, and dances while admiring the
    stolen finery.
  language: English
  quote_policy: summarized
