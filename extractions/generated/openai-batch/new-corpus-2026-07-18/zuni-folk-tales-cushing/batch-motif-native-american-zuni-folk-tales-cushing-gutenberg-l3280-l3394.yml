canonical_text:
  quote: ''
  summary: In ancient inhabited villages, a beautiful daughter of the high priest
    at the Village of the Yellow Rocks possesses magical knowledge of hunting and
    game animals. She selfishly charms and corrals the game on a mountain, leaving
    other hunters without meat or hides. A youth from the Village of the Winds brings
    courtship gifts to her ornamented priestly house. After ritual reception, food
    sharing, and the father's blessing/adoption, the maiden postpones full marriage
    and sets a morning deer-hunting test.
  language: English
  quote_policy: summarized
