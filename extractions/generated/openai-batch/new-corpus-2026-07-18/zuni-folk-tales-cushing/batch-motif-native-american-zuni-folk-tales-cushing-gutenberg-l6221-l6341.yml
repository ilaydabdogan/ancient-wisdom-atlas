canonical_text:
  quote: ''
  summary: The passage closes a Coyote tale. Coyote tries unsuccessfully to revive
    an unidentified dead female by washing her, sewing her head to her body, blowing
    into her throat, and pouring meal-and-water pap into her. He then grieves and
    intends revenge against the Owls, but a Horned-toad enters his throat unnoticed,
    sings from inside him, identifies and touches his vitals, and kills him by hooking
    a horn into his heart. The narrator explains this as an ancient origin for Coyote’s
    meddling nature, Coyotes’ avoidance of Horned-toads and Burrowing-owls, and the
    gray-and-white speckling of Burrowing-owls.
  language: English, with an embedded transliterated song
  quote_policy: summarized
