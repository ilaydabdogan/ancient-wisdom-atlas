canonical_text:
  quote: ''
  summary: The War-god brothers bring the lightning-shaft and thunder-stone to their
    grandmother’s house on Thunder Mountain. Their grandmother identifies the objects
    as stolen from the Rain-gods and orders them returned, but the brothers barricade
    themselves and play with the storm implements. The Rain-gods raise wind and heavy
    rain; the house floods, the fire is extinguished, and the grandmother drowns while
    trapped inside. The brothers finally throw the thunder-stone and lightning-shaft
    into the sky, after which the storm clears and they find their grandmother dead.
  language: English
  quote_policy: summarized
