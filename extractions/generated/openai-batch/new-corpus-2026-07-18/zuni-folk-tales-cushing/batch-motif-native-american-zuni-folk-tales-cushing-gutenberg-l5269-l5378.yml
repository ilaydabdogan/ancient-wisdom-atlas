canonical_text:
  quote: "“let us go to the Land of Everlasting Summer and steal from the gods in
    council their thunder and lightning.”"
  summary: Two brother War-gods, angered by rain and fascinated by thunder and lightning,
    set out for the Land of Everlasting Summer to steal storm powers from the Rain-gods.
    Unable to enter the gods’ high terraced house, they enlist their grandfather Centipede,
    who secretly climbs into the forbidden altar area and steals first the thunder-stone
    and then the lightning-shaft.
