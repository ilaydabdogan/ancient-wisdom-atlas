canonical_text:
  quote: ''
  summary: Two elder-and-younger brothers, Áhaiyúta and Mátsailéma, leave their grandmother
    on Twin Mountain to hunt. They hear the cry of the demon Átahsaia, infer that
    he is pursuing two maidens of Héshokta, and wait near his cave. Átahsaia confronts
    the sisters at the spring, first frightening them with a flint knife, then claiming
    to be their grandfather and inviting them to his home with promises of food and
    drink. The younger sister remains afraid, but the elder sister agrees to go, and
    Átahsaia leads them away.
  language: English
  quote_policy: summarized
