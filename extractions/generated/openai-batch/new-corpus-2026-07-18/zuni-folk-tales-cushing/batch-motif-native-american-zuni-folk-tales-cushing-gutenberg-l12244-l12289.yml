canonical_text:
  quote: ''
  summary: Spider secretly weaves a web around the giant Häki Suto’s eyelashes. The
    giant, expecting the War-gods, pretends to be harmless and urges them to pass
    beneath him. Áhaiyúta and Mátsailéma split to either side; Häki Suto tries to
    catch them but is blinded by the web. They beat him to death and push him over
    a cliff. The passage then gives explanations for a stone pillar and its white
    streaks, including a reported Navaho version and the narrator’s version in which
    birds caused the streaks. Storm-gods cover Häki Suto’s bloodied body with sand
    until it hardens to stone. Birds or young ones who come to devour him are attacked
    by the Twain; some become Owl and Falcon. The passage ends by saying cliff-dwelling
    ancients fled because they feared waters would not return, while earlier dead
    remained dried in cliff-towns like corn-stalks after long drought.
  language: English
  quote_policy: summarized
