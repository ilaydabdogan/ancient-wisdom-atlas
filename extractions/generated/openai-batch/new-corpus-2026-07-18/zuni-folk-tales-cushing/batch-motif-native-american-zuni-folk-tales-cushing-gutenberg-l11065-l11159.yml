canonical_text:
  quote: ''
  summary: Mítsina keeps a suspended basket-drum and a painted buffalo robe for a
    cane game, calling them his cloud canopy and sacred terraced plain and linking
    them to the gods' sky and earth game apparatus. Young men who hear his solitary
    play enter, gamble away possessions and body parts, submit as slaves, and are
    killed; the pattern repeats with other passersby.
  language: English
  quote_policy: summarized
