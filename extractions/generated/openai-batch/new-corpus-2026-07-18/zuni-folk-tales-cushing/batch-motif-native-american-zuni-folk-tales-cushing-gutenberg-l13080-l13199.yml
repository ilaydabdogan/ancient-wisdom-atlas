canonical_text:
  quote: ''
  summary: Two brothers prepare, travel to K’iákime, join a dance, and are recognized
    by maternal kin after recounting details about their secluded mother and her sacred
    trays. They return to their Badger foster parents, then set out toward Acoma to
    retrieve their mother, aided by the Sun-father lengthening the day. Near Acoma
    they meet an old dance priestess, who explains that the local dance is performed
    with the bones of a maiden shot from the back of an Eagle by the Gods of War.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The two boys decide to hunt so that their mother and they will have food,
    return with many rabbits, and the old mother prepares some to cook overnight before
    their journey.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At sunrise the boys dress carefully, put on plumes, travel around the mountain,
    pass K’yátik’ia, and enter the court of K’iákime by a described route.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At K’iákime they find the great house, tall ladder, two macaws, and young
    maidens on the housetop, as the Sun-father had told them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dance chief invites the boys to join the dance, and the young girls leave
    their assigned place to grasp the boys’ hands, as the Sun-father had predicted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Inside the house the brothers address the young women as mother-aunts, from
    eldest to youngest.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The brothers state that the women are their parents and describe rooms where
    their mother lived without going out, making sacred trays that hang by colors
    of the parts of the world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The people are convinced by the brothers’ story; the grandfather, a great
    priest-chief, embraces them, dresses them in ornaments their mother had worn,
    and they are feasted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At sunset the brothers refuse to stay, saying they promised to return to their
    mother and father, the Badgers.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The brothers say they will go to Acoma to get their mother, where people dance
    day after day in her memory.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: After returning to the Badgers, the elder brother announces that they will
    go to Acoma, requests a luncheon, and describes a three-day plan for going and
    returning with their mother.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Badger-mother prepares sweet corn-cakes in a blanket, and the two boys
    start on the eastern trail.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Sun-father helps the boys by lengthening the day and moving more slowly
    until they reach near the Acoma country.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Near the Acoma town on a mountain, the boys meet an old woman carrying wood,
    who says she carries it because she is the priestess of the dance.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: The old woman says the dance concerns a maiden from the Town of the Eagles
    who was shot by the two Gods of War from the back of an Eagle that was trying
    to run away with her.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: The old woman says one of her young men first grasped the fallen maiden and
    that they dance with her bones every night.
  category: speech
  evidence_refs:
  - ev:11
