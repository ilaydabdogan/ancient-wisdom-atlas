canonical_text:
  quote: ''
  summary: 'The passage describes events of Ragnarok: Odin fights the wolf and falls
    as Frigg''s beloved; Frey contends with Surt; Vidar avenges his father by striking
    the wolf; Thor fights and slays the serpent while near death; people abandon their
    homes; the sun darkens, earth sinks into the sea, stars vanish, and fire rises
    to heaven. It also names Vigrid as the vast plain appointed for Surt and a gentle
    god to meet in battle.'
  language: English
