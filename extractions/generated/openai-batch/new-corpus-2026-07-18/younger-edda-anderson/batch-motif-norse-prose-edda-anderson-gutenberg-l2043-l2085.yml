canonical_text:
  quote: ''
  summary: The passage describes Loke/Lopt as a deceitful and cunning figure counted
    among the asas, gives his family relations, names his children by the giantess
    Angerboda, and recounts how Alfather deals with the serpent and Hel. The Midgard-serpent
    is cast into the sea and grows to encircle the earth, while Hel is cast into Niflheim
    and given authority over abodes for those who die of sickness or old age.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Loke, also called Lopt, is numbered among the asas, but some call him the
    backbiter of the asas; he is described as the originator of deceit and a disgrace
    to gods and men.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Loke’s father is the giant Farbaute; his mother is Laufey or Nal; his brothers
    are Byleist and Helblinde; his wife is Sygin; and his son is Nare or Narfe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Loke is described as fair and beautiful in face, evil in disposition, fickle-minded,
    surpassing others in cunning, cheating in all things, and both causing trouble
    for the asas and helping them with cunning contrivances.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'Loke begets three children with Angerboda, a giantess in Jotunheim: Fenris-wolf,
    Jormungand the Midgard-serpent, and Hel.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The gods learn that the three children are being fostered in Jotunheim and
    know prophecies that woe and misfortune will come from them; Alfather sends gods
    to take the children and bring them to him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Alfather throws the serpent into the deep sea surrounding all lands; the serpent
    grows in the ocean until it surrounds the earth and bites its own tail.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Alfather casts Hel into Niflheim and gives her power over nine worlds so that
    she may appoint abodes for those sent to her, namely those who die from sickness
    or old age.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hel has a great mansion with very high walls and huge gates; her hall is named
    Eljudner.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hel’s table is named famine, her knife starvation, her man-servant Ganglate,
    her maid-servant Ganglot, her threshold stumbling-block, her bed care, and her
    bed-hangings gleaming bale.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Hel is described as half blue and half the hue of flesh, with stern and grim
    looks.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: A footnote says that the phrase rendered as nine worlds may perhaps mean the
    ninth world, and another footnote says Ganglate and Ganglot both mean sloth.
  category: other
  evidence_refs:
  - ev:6
