canonical_text:
  quote: ''
  summary: The passage ends a verse about the deaths connected with Jormunrek, Gjuke’s
    descendants, Swanhild’s husband, and Jonaker’s sons, then explains why gold is
    called Frode’s meal. It recounts Frode’s genealogy, his famed peace, his acquisition
    of the powerful maid-servants Fenja and Menja, and the magic mill Grotte, which
    grinds whatever is demanded. Frode makes the women grind gold, peace, and happiness
    with almost no rest. They sing the Grottesong and grind out an army against him.
    The sea-king Mysing kills Frode, takes Grotte and the women, commands them to
    grind salt, and the ship sinks, producing a whirlpool and making the sea salt.
  language: English
  quote_policy: summarized
