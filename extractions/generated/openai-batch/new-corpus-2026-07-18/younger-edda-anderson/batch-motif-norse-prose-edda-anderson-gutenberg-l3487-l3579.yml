canonical_text:
  quote: ''
  summary: 'Brage explains to Æger how skaldship originated: a peace-token between
    gods and vans becomes the wise Kvaser; dwarfs kill Kvaser and brew his blood with
    honey into a mead that grants poetry and wisdom; the mead passes to Suttung as
    ransom and is later obtained by Odin through trickery, shapeshifting, and flight,
    then distributed to the gods and poets.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Æger asks Brage where the art called skaldship originated, and Brage answers
    with an origin narrative.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods and the vans end a war by meeting for peace and both spitting into
    a jar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The gods shape the peace-token into a man named Kvaser, who is so wise that
    he can answer any question and who travels to teach men wisdom.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dwarfs Fjalar and Galar kill Kvaser and let his blood run into two jars,
    Son and Bodn, and a kettle, Odrarer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dwarfs mix honey with Kvaser’s blood, producing a mead that makes whoever
    drinks it a skald and sage.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The dwarfs tell the asas that Kvaser choked in his wisdom because no one was
    wise enough to ask him enough about learning.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Fjalar and Galar drown the giant Gilling by capsizing a boat and then kill
    Gilling’s wife with a mill-stone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Suttung, Gilling’s son, seizes the dwarfs and leaves them on a rocky island
    flooded at high tide; he accepts the precious mead as atonement for his father’s
    blood.
  category: action
  evidence_refs:
  - ev:4
