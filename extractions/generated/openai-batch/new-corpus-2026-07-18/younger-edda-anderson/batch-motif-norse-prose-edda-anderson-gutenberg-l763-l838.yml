canonical_text:
  quote: ''
  summary: The passage recounts Noah's division of the world among his sons, the rise
    of pride, conquest, and the building of a tower at Sennar/Babylon. God frustrates
    the tower by confusing speech, after which tongues and names multiply. Zoroaster
    is presented as a foremost figure connected with the tower, later kingship, and
    the origin of idolatry under names including Baal/Bel. The passage then describes
    a tripartite world geography, gives special qualities to Asia and the mid-world,
    and presents Troy as a central, highly ordered city from which northern rulers
    trace ancestry and whose rulers are placed among gods.
  language: English
  quote_policy: summarized
