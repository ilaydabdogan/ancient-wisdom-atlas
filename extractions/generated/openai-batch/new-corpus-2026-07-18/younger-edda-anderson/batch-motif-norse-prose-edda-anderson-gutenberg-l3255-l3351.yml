  evidence_refs:
  - ev:1
- id: obs:2
  text: Har states that there are many good and many bad abodes after the destruction.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gimle and Brimer are described as heavenly abodes, and Sindre is a red-gold
    hall on the Nida mountains for good and well-minded men.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nastrand is described as a terrible hall with north-opening doors, made of
    wattled serpents whose heads vomit venom into streams in the hall.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Perjurers and murderers wade through the venom streams in Nastrand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Hvergelmer, Nidhug tortures the bodies of the dead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The earth rises again from the sea and is green and fair; unsown fields produce
    harvests.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Vidar and Vale live after the sea and Surt’s fire and dwell on the plains
    of Ida, where Asgard formerly stood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mode and Magne, sons of Thor, come with Mjolner after the fight is ended.
  category: action
  evidence_refs:
  - ev:6
  - ev:8
- id: obs:10
  text: Balder and Hoder come from Hel and join the others in conversation about former
    events, including the Midgard-serpent and the Fenris-wolf.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The gathered gods find in the grass the golden tables that the asas once had.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Lif and Lifthraser are concealed in Hodmimer’s-holt during Surt’s fire and
    feed on morning dew.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A numerous race descends from Lif and Lifthraser and fills the whole world
    with people.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The sun gives birth to a daughter before Fenrer takes her, and the daughter
    rides in her mother’s heavenly course when the gods are dead.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: After Har says he knows no further fate of the world, Ganglere hears a terrible
    noise, finds himself outdoors on a level plain, sees neither hall nor burg, returns
    to his kingdom, and tells what he saw and heard.
  category: sequence
