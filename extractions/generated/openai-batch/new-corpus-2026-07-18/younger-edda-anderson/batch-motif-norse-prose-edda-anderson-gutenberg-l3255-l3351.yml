canonical_text:
  quote: ''
  summary: Har answers Ganglere’s questions about what follows the fiery destruction
    of heaven, earth, gods, einherjes, and humanity. He describes good and bad posthumous
    abodes, punishments involving serpents and Nidhug, the renewed earth rising from
    the sea, surviving and returning gods, a hidden human pair who repopulate the
    world, the sun’s daughter succeeding her mother, and Ganglere’s return to his
    kingdom after the vision ends.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ganglere asks what happens after heaven, earth, the world, the gods, the einherjes,
    and all men are dead or consumed in flames.
