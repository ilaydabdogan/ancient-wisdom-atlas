candidate_motifs:
- id: motif:1
  label: morally differentiated afterlife abodes and punishments
  taxonomy_refs:
  - afterlife_journey_map
  - divine_judgment
  basis: The passage distinguishes good abodes such as Gimle, Brimer, and Sindre from
    terrible abodes such as Nastrand and Hvergelmer, where perjurers, murderers, and
    bodies of the dead suffer.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage describes abodes and punishments, but it does not narrate
    an afterlife journey or an explicit judgment scene.
- id: motif:2
  label: world destruction by fire followed by renewal
  taxonomy_refs:
  - world_destroying_fire
  - death_rebirth
  basis: Ganglere frames the question around heaven, earth, and the world being consumed
    in flames; Har later describes Surt’s fire and the earth rising again green and
    fair from the sea.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  - ev:9
  confidence: high
  cautions: The destruction itself is assumed from the preceding context and the question,
    while the passage emphasizes what follows it.
- id: motif:3
  label: regenerated earth with returning or surviving gods
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The earth rises again; Vidar and Vale survive; Mode and Magne come with Mjolner;
    Balder and Hoder come from Hel; the gods gather and find former golden tables.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: Only Balder and Hoder are explicitly said to come from Hel; other gods
    are described as surviving or arriving after the fight.
- id: motif:4
  label: concealed survivor pair repopulates the world
  taxonomy_refs:
  - survivor_pair
  - death_rebirth
  basis: Lif and Lifthraser are hidden during Surt’s fire, feed on morning dew, and
    become the source of races that fill the whole world.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage identifies the pair and their descendants but gives few details
    about their concealment beyond the named holt.
- id: motif:5
  label: solar succession after cosmic death
  taxonomy_refs:
  - divine_parent_child
  - death_rebirth
  basis: The sun gives birth to a daughter before Fenrer takes her, and the daughter
    rides in her mother’s heavenly course when the gods are dead.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage gives a concise statement without further explanation of the
    daughter’s nature or later role.
- id: motif:6
  label: serpentine punishment of the dead
  taxonomy_refs:
  - serpent
  - divine_judgment
  basis: Nastrand is built of serpents that emit venom, perjurers and murderers wade
    in the venom streams, and Nidhug tortures bodies of the dead in Hvergelmer.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: Nidhug’s serpent identity is not stated in this excerpt; the serpent motif
    is directly supported for Nastrand and indirectly adjacent to Nidhug only through
    the punishment setting.
