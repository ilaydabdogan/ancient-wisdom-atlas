canonical_text:
  quote: ''
  summary: The introductory passage argues that Christian priests in continental Europe
    and England suppressed the asa-faith, while Iceland preserved Old Norse language,
    laws, sagas, customs, institutions, and religion. It presents Iceland as a refuge
    for the Teutonic spirit, praises Icelandic exploration and skaldic influence,
    compares Iceland's cultural role to Greece and Rome for southern Europe, and ends
    with an anti-Roman adaptation of Cato's phrase about Carthage.
