canonical_text:
  quote: ''
  summary: Thor and his companions reach an enormous burg, enter through the barred
    gate, and come before King Utgard-Loke in a hall of immense men. Utgard-Loke requires
    displays of exceptional skill. Loke loses an eating contest to Loge; Thjalfe loses
    a race to Huge; Thor repeatedly fails to empty a drinking horn and is mocked for
    falling short of his reputation. The passage ends as Utgard-Loke proposes that
    Thor try lifting his cat.
  language: English
  quote_policy: summarized
