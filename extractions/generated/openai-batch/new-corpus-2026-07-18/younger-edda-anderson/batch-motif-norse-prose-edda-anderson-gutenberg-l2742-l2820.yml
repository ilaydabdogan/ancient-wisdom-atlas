canonical_text:
  quote: ''
  summary: 'Thor tries and fails to lift a large gray cat, then wrestles an old woman
    named Elle and is brought to one knee. The next morning Utgard-Loke reveals that
    the contests and earlier events were illusions: Thor’s hammer blows struck a mountain,
    Loke’s opponent Loge was wildfire, Thjalfe raced against thought, Thor’s drinking
    horn was connected to the sea, the cat was the Midgard-serpent, and Elle was old
    age. Thor tries to strike Utgard-Loke, but Utgard-Loke and the burg vanish, leaving
    a plain. Thor returns and resolves to seek a later meeting with the Midgard-serpent.'
  language: English
  quote_policy: summarized
