canonical_text:
  quote: ''
  summary: The passage discusses proposed meanings of the name Edda, the structure
    and authorship of the Younger Edda, the relation of the Elder and Younger Eddas,
    and the need to value Norse ancestral religion. It uses images of a great ancestress
    teaching descendants, Eddas as an Odinic Bible, the labyrinth of Crete contrasted
    with Valhal and Gladsheim, Idun's apples compared with Ariadne's thread, foreign
    gods versus ancestral altars, and inherited tradition as treasure, fountain, Ygdrasil
    ash, and renewed coinage.
  language: English
  quote_policy: summarized
