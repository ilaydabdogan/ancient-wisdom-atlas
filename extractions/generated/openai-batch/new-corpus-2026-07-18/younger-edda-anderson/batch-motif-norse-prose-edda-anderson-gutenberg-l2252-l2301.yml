canonical_text:
  quote: ''
  summary: Frey sees Gerd from the holy seat Hlidskjalf and becomes grief-stricken
    with desire for her. Njord sends Skirner to question him. Frey asks Skirner to
    seek Gerd’s hand, and Skirner accepts on condition that Frey give him his self-wielding
    sword. Skirner obtains Gerd’s promise to wed Frey at Bar-Isle after nine nights.
    The passage then explains that Frey’s gift of the sword left him unarmed against
    Bele and will later disadvantage him when the sons of Muspel come to battle.
  language: English
  quote_policy: summarized
