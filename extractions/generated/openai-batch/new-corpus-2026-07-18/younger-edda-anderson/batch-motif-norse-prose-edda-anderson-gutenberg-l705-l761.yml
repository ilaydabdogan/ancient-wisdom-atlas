canonical_text:
  quote: ''
  summary: The foreword recounts creation by Almighty God, the descent of humanity
    from Adam and Eve, human disobedience, the flood and ark survival with Noah, post-flood
    repopulation, loss of God's name, and the human use of God-given wisdom to infer
    a living earth and a mighty ruler of heavenly bodies, seas, weather, and earthly
    things.
  language: English
  quote_policy: summarized
