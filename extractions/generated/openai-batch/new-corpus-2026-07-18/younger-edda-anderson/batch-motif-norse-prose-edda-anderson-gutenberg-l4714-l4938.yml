canonical_text:
  quote: ''
  summary: Fenja and Menja, two prescient and mighty maidens later called giantesses,
    are forced by King Frode to turn the mill Grotte. Their grinding song first produces
    wealth, happiness, gold, and peace for Frode, then recounts their giant upbringing,
    strength, and former battle deeds. As they continue grinding under compulsion,
    they foresee fire, an approaching host, Frode's loss of rule, revenge for Halfdan,
    and finally the breaking of the mill-stone while the old world shakes.
  language: English
  quote_policy: summarized
