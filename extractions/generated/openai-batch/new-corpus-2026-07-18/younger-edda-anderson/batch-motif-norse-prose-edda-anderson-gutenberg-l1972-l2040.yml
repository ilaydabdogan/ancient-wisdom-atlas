canonical_text:
  quote: ''
  summary: The passage catalogs several Asas and related divine figures. Brage is
    described as wise, eloquent, and master of poetry; Idun keeps apples in a box
    that restore youth to aging gods until Ragnarok. Heimdal is described as the white-asa,
    born of nine sisters, with gold teeth, a horse, a heavenly dwelling near Bifrost,
    extraordinary sight and hearing, and the Gjallarhorn trumpet. Hoder, Vidar, Vale,
    Uller, and Forsete are then described with their main attributes, kin relations,
    martial skills, or judicial function. Poetic citations from Elder Edda material
    are included for Heimdal and Forsete.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Brage is named as one of the Asas and is said to be famous for wisdom, eloquence,
    flowing speech, and mastery of poetry.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage connects Brage with the naming of song-craft as brag, or poetry,
    and with terms for eloquent men and women.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Idun is Brage's wife and keeps in a box apples that the gods eat when they
    grow old, after which they become young again until Ragnarok.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ganglere remarks on the importance of Idun preserving the apples, and Har
    replies that the gods once ran a great risk concerning them but postpones the
    story.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Heimdal is called the white-asa, great and holy, born of nine maidens who
    were sisters, and also called Hallinskide and Gullintanne because his teeth were
    gold.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: Heimdal's horse is called Gulltop, and he dwells at Himinbjorg near Bifrost.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Heimdal is the ward of the gods and guards the bridge at the end of heaven
    against the mountain-giants.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: Heimdal needs less sleep than a bird, sees a hundred miles by night and day,
    hears grass and wool grow, has the Gjallarhorn trumpet audible in all worlds,
    and the head is called his sword.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Hoder is an Asa who is blind and exceedingly strong, and the work of his hand
    is said to be remembered by gods and men.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Vidar is called the silent Asa; he has a very thick shoe, is strongest after
    Thor, and gives the gods help in hard tasks.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ale, or Vale, is the son of Odin and Rind and is described as daring in combat
    and a good shot.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Uller is son of Sif and step-son of Thor; he is an unmatched archer and skier,
