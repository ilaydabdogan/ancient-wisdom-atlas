canonical_text:
  quote: ''
  summary: The passage explains gold-kennings through the golden grove Glaser and
    through the story of Loke cutting Sif's hair, obtaining crafted treasures from
    dwarfs, wagering his head against Brok and Sindre, and losing after the gods judge
    Thor's hammer to be the best treasure. Loke evades literal payment of his head,
    but Brok sews his mouth shut with a strap called Vartare.
  language: English
