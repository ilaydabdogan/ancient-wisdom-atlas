candidate_motifs:
- id: motif:1
  label: Treasure-guardian slain from a hidden position
  taxonomy_refs: []
  basis: Sigurd hides in a ditch in Fafner's path and kills him with Gram as Fafner
    moves toward the water, after Regin has identified Fafner as lying on the gold.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not explicitly call Fafner a dragon or serpent in this
    excerpt, so the motif is limited to the literal treasure-guardian killing described
    here.
- id: motif:2
  label: Wisdom gained through heart-blood and bird speech
  taxonomy_refs:
  - wisdom
  basis: Heart-blood from Fafner touches Sigurd's tongue, causing him to understand
    the speech of birds, who advise him and expose Regin's plot.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage states comprehension of birds; broader initiatory or shamanic
    readings are not asserted.
- id: motif:3
  label: Animal warning reveals a trusted companion's treachery
  taxonomy_refs:
  - wisdom
  basis: The eagles say that Regin is contemplating deception and revenge against
    the man who trusts him; Sigurd then kills Regin.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The warning is embedded in bird speech after the heart-blood episode;
    no independent animal-helper relationship is described.
- id: motif:4
  label: Sleeping armored woman awakened on a mountain
  taxonomy_refs: []
  basis: Sigurd finds a helmeted, mailed woman asleep in a mountain house, cuts off
    her coat-of-mail, and she awakens and names herself Brynhild, a valkyrie.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage gives no further explanation here for why she sleeps.
- id: motif:5
  label: Bride promised to the rider through encircling flame
  taxonomy_refs:
  - sacred_marriage
  basis: Brynhild's hall is surrounded by Vafurloge, and she has promised to wed only
    the man who dares ride through the flame.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The taxonomy label is limited to the marriage condition; the passage frames
    the episode as a bride-quest rather than a formal ritual.
- id: motif:6
  label: Form exchange in deceptive bride-winning
  taxonomy_refs:
  - shapeshifter
  basis: Sigurd and Gunnar exchange forms and weapons so that Sigurd can ride through
    the flame in Gunnar's place and obtain Brynhild for Gunnar.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage states an exchange of forms but does not explain the mechanism.
- id: motif:7
  label: Sword placed between bride and disguised bride-winner
  taxonomy_refs: []
  basis: After the wedding with Brynhild, Sigurd draws Gram and places it between
    them in bed.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explicitly interpret the sword's purpose.
- id: motif:8
  label: Ring as bridal gift and proof of hidden identity
  taxonomy_refs:
  - sacred_exchange
  basis: Sigurd gives Brynhild Andvaranaut as a bridal gift; later Gudrun uses the
