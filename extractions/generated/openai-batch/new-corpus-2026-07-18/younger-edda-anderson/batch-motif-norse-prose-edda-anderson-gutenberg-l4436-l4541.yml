canonical_text:
  quote: ''
  summary: Regin fosters Sigurd, forges Gram, and urges him to win Fafner's gold.
    Sigurd kills Fafner from a ditch, roasts Fafner's heart, tastes the heart-blood,
    understands birds, learns of Regin's treachery, kills Regin, and takes the gold.
    Sigurd awakens the armored valkyrie Brynhild, later marries Gudrun, enters sworn
    brotherhood with Gunnar and Hogne, and wins Brynhild for Gunnar by exchanging
    forms and riding through the Vafurloge. A quarrel between Brynhild and Gudrun
    reveals the deception through Andvaranaut. Brynhild urges Sigurd's killing; Guthorm
    kills Sigurd and Sigurd's young son is also killed. Brynhild kills herself and
    is cremated with Sigurd, while Gunnar and Hogne inherit Fafner's gold and Andvare's
    Gift.
  language: English
  quote_policy: summarized
