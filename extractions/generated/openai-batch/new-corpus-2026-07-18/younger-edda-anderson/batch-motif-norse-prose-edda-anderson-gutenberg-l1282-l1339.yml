canonical_text:
  quote: ''
  summary: 'In dialogue form, Har, Jafnhar, and Thride describe how the sons of Bor
    made the world from Ymer''s body: earth, waters, rocks, stones, sky, trees, clouds,
    and Midgard. They also describe an encircling ocean, four dwarfs set under the
    sky''s corners, celestial fires ordered in heaven, lands for giants at the outer
    sea, and Midgard as a burg for humankind against giants.'
  language: English
  quote_policy: summarized
