candidate_motifs:
- id: motif:1
  label: wise culture hero who brings crafts, metals, and agriculture
  taxonomy_refs:
  - wisdom
  - culture_hero
  basis: Saturn invents crafts, practices foreknowledge, smelts gold, foretells harvests,
    and later teaches plowing and vineyard-planting.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: high
  cautions: The passage presents Saturn euhemeristically as a man later believed to
    be divine, not as an explicitly divine culture hero.
- id: motif:2
  label: prosperous golden-age rulership
  taxonomy_refs: []
  basis: Under Saturn’s rule Crete has abundant goods, gold coinage, and unfailing
    crops despite famine elsewhere.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not use the term golden age; the motif label is based
    on the described abundance and gold.
- id: motif:3
  label: self-deification through power and wonders
  taxonomy_refs:
  - royal_legitimacy
  basis: Saturn’s secret powers and prosperity lead people to believe him to be God,
    and he calls himself God; Jupiter also declares himself god after conquering and
    mutilating Saturn.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: medium
  cautions: The available taxonomy has no exact euhemerized self-deification category;
    royal legitimacy is only approximate.
- id: motif:4
  label: animal shapeshifting for seduction and abduction
  taxonomy_refs:
  - shapeshifter
  - stolen_beloved
  basis: Saturn takes a golden bull form to approach the king’s daughter and then
    carries her away to Crete; Jupiter is also said to take many animal forms.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The king’s daughter’s consent is not fully described beyond her response
    to the bull; the abduction is literal in the passage.
- id: motif:5
  label: human transformed into heifer and sent to river land
  taxonomy_refs:
  - shapeshifter
  basis: Saturn changes the king’s daughter into a heifer and sends her east to the
