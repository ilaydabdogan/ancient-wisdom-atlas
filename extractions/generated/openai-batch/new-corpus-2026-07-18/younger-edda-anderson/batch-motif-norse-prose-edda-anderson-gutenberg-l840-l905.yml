canonical_text:
  quote: ''
  summary: The passage gives a euhemerized account of Saturn in Crete as a wise inventor,
    magician, gold-smelter, agricultural foreteller, ruler, and self-declared god.
    It narrates his bull-shape abduction of a king’s daughter, her transformation
    into a heifer and dispatch to the Nile, the accomplishments and animal transformations
    of Jupiter, and Jupiter’s placement in Thor’s role. It then describes Saturn’s
    division of heaven, earth, and hell among Jupiter, Neptune, and Pluto; Cerberos
    as hell-guardian; Herakles dragging Cerberos from hell; Jupiter’s attack and emasculation
    of Saturn; Venus arising from the cast-off members in the sea; and Saturn’s flight
    to Italy under the name Njord, where he teaches agriculture and becomes chief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Saturn grows up in Crete and is described as greater, stronger, fairer, wiser,
    and more magically skilled than other men.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Saturn invents previously undiscovered crafts, smelts gold from a red substance
    in the earth, foretells harvests and secret things, and becomes chief of Crete.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During Saturn’s rule, Crete has abundant goods, gold coins, and unfailing
    crops while other lands experience famine.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: People believe Saturn to be God, and Saturn calls himself God and says he
    rules heaven, earth, and all things.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Saturn travels by ship to Greece because he desires a king’s daughter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Saturn takes the likeness of a bull with golden-hued hair, lies before the
    king’s daughter in a wood, then throws off the bull-likeness and carries her to
    a ship bound for Crete.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After Juno discovers the event, Saturn changes the king’s daughter into the
    likeness of a heifer, sends her east to the Nile region, and has the thrall Argulos
    guard her for twelve months before changing her shape again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Saturn has three sons named Jupiter, Neptune, and Pluto.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:9
  text: Jupiter is described as a warrior who wins many kingdoms, is crafty like Saturn,
    takes the likeness of many animals, accomplishes things impossible for mankind,
    and is held in awe by all nations.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:10
  text: The passage says Jupiter is put in the place of Thor because all evil wights
    fear him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:11
  text: Saturn builds seventy-two burgs in Crete and shares his kingdom with his sons,
    assigning heaven to Jupiter, earth to Neptune, and hell to Pluto.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: Saturn gives Pluto the dog Cerberos to guard hell, and the Greeks are said
