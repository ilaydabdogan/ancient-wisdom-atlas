- id: motif:7
  label: underworld guardian extracted by hero
  taxonomy_refs:
  - hero_descent
  basis: Cerberos is assigned to guard hell, and the Greeks are said to tell that
    Herakles dragged him out of hell and onto earth.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The descent itself is not narrated in detail; only the extraction of Cerberos
