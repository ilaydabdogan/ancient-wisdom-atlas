canonical_text:
  quote: ''
  summary: 'Æger questions Brage about the kinds of poetry and poetic diction. Brage
    answers that poetry has two classes, diction and meter, and that poetic diction
    has three sorts: naming by proper name, naming by pronoun, and kenning. He explains
    kennings by reference to divine names and gives appellative examples for Odin.'
