candidate_motifs:
- id: motif:1
  label: Protective oaths with an overlooked exception
  taxonomy_refs:
  - covenant
  basis: Frigg obtains oaths from many things to protect Balder, but mistletoe is
    omitted because it seemed too young.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: medium
  cautions: The passage calls these oaths rather than a formal covenant; the taxonomy
    match is broad.
- id: motif:2
  label: Invulnerability tested in public assembly
  taxonomy_refs: []
  basis: The asas repeatedly shoot, hew, and throw stones at Balder as a pastime after
    learning that he cannot be harmed.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No external comparison is asserted.
- id: motif:3
  label: Trickster shapeshifter obtains hidden vulnerability
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: Loke takes the likeness of a woman, questions Frigg, and learns that mistletoe
    has not sworn the oath.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage supports disguise and deception; broader trickster interpretation
    should remain under review.
- id: motif:4
  label: Fatal weapon from harmless overlooked plant
  taxonomy_refs: []
  basis: The un-oathed mistletoe becomes the wand or dart that pierces and kills Balder.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage treats mistletoe literally as a shrub and weapon; symbolic
    extensions are not asserted.
- id: motif:5
  label: Blind proxy guided to kill
  taxonomy_refs:
  - trickster_boundary
  basis: Hoder is blind and has no weapon until Loke provides mistletoe and guides
    his shot at Balder.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not state Hoder's intention beyond following Loke's instruction.
- id: motif:6
  label: Ride to the realm of the dead to seek return
  taxonomy_refs:
  - hero_descent
  - afterlife_journey_map
  - return
  basis: Frigg asks for someone to ride the way to Hel to find Balder and offer ransom
    for his return to Asgard; Hermod undertakes the journey on Sleipner.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: This excerpt begins the journey but does not narrate the arrival, negotiation
    outcome, or Balder's actual return.
- id: motif:7
  label: Ship-pyre funeral with grave goods and accompanying deaths
  taxonomy_refs: []
  basis: Balder's corpse is placed on Hringhorn; Nanna dies and is placed on the pile,
