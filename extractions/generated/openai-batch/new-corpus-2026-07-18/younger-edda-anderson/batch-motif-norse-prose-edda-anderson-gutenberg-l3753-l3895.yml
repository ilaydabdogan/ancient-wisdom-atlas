canonical_text:
  quote: ''
  summary: 'The passage concludes an episode in which Thor tells Groa how he carried
    Orvandel from Jotunheim and made Orvandel''s frozen toe into a star; Groa''s joy
    interrupts her magic songs, leaving a flint-stone in Thor''s head and grounding
    a taboo about throwing flint-stones. A poem recounts Thor''s fiery, earth-shaking
    journey to fight the giant Hrungner and the flint-stone wound. The passage then
    introduces Thor''s journey to Geirrodsgard: Loke, caught while flying in Frigg''s
    falcon-guise, is imprisoned and coerced into promising to bring Thor without his
    usual equipment. Grid warns Thor, lends him protective gear and a staff, and Thor
    confronts the swelling river Vimer on the way to the giants'' dwellings.'
  language: English
  quote_policy: summarized
