canonical_text:
  quote: ''
  summary: Ganglere asks whether Loke was punished for causing Balder’s death and
    preventing his release from Hel. Har narrates Loke’s flight, salmon-shape concealment,
    the gods’ discovery and net-capture of him, and his binding in a cave with serpent
    venom dripping on him while Sigyn catches it until he shakes the earth; he remains
    bound until Ragnarok.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ganglere describes Loke as having caused Balder’s death and obstructed Balder’s
    release from Hel, then asks whether Loke was punished.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Har answers that Loke was repaid and that the gods became very angry.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Loke fled, hid in a rock, and built a house with four doors so he could watch
    all sides.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Loke often took the likeness of a salmon in daytime and concealed himself
    in Frananger Force.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Loke made meshes from flax and yarn like later nets, then threw the net into
    the fire and leapt into the river when the asas approached.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Odin had seen from Hlidskjalf where Loke was staying.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kvaser saw the burned net’s ashes, recognized the design as a device for catching
    fish, and explained this to the asas.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The asas made a net based on the ashes of Loke’s net and dragged it through
    the river, with Thor holding one end.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Loke evaded the net by lying between stones and later by leaping over the
    net, but Thor eventually caught him by the tail.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:10
  text: The passage explains the salmon’s slim tail as resulting from Thor’s grip
    on Loke in salmon form.
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: The gods brought Loke to a cave, set up three rocks, transformed Vale into
    a wolf, and used Narfe’s intestines to bind Loke over the rocks; the fetters became
    iron.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Skade fastened a serpent above Loke so venom would drip onto his face, while
    Sigyn held a dish to catch the venom except when she emptied it.
  category: action
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:13
  text: When venom reaches Loke’s face, he twists violently, causing earthquakes,
    and he remains bound until Ragnarok.
  category: sequence
  evidence_refs:
  - ev:14
