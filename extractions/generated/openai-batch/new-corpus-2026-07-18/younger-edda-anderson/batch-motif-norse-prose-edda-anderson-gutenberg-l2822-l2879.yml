canonical_text:
  quote: ''
  summary: Ganglere asks whether Thor avenged himself after Utgard-Loke’s deceptions.
    Har recounts that Thor soon travels alone, disguised as a young man, to the giant
    Hymer. Thor accompanies Hymer on a fishing trip, takes the head of Hymer’s ox
    Himinbrjot as bait, rows beyond the normal fishing grounds into dangerous waters,
    hooks the Midgard-serpent, and pulls it up to the boat. As Thor raises his hammer,
    Hymer cuts the line, and the serpent sinks back into the sea. Thor then strikes
    Hymer into the sea and wades ashore.
  language: English
  quote_policy: summarized
