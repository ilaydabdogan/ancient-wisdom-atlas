canonical_text:
  quote: ''
  summary: Dialogue in which Ganglere asks Har about life in Valhal. Har describes
    the battle-dead in Odin’s hall, their inexhaustible food from the boar Sahrimner,
    Odin’s wolves and ravens, Heidrun’s mead, Eikthyrner and the rivers from Hvergelmer,
    Valhal’s many doors, the einherjes’ daily fighting and drinking, and a verse naming
    foremost beings and objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men who have fallen in battle are said to come to Odin in Valhal, where there
    is already a great throng and more are expected.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boar Sahrimner is boiled every day for food and is whole again in the
    evening.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Andhrimner is named as the cook, and Eldhrimner is named as the kettle used
    for cooking Sahrimner.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Odin gives the food placed on his table to his two wolves, Gere and Freke,
    and lives on wine as both food and drink.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two ravens, Hugin and Munin, sit on Odin’s shoulders, fly over the whole world
    at dawn, return at breakfast, and bring him what they hear and see.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The she-goat Heidrun stands in Valhal, eats leaves from the tree Lerad, and
    produces enough mead to fill a vessel from which the drinking horns are filled
    for all the einherjes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The hart Eikthyrner stands over Valhal, eats branches of the same tree, and
    drops from his horns fall into Hvergelmer, from which named rivers flow around
    the abodes of the asas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Valhal is said to have five hundred and forty doors, and eight hundred einherjes
    can go through one door at a time when they go to fight the wolf.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Every morning the einherjes arm themselves, fight in the court, slay each
    other, then ride back to Valhal at breakfast-time and sit drinking in peace.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A closing verse names the Ygdrasil ash, Skidbladner, Odin, Sleipner, Bifrost,
    Brage, Habrok, and Garm as foremost in their respective classes.
  category: speech
  evidence_refs:
  - ev:9
