canonical_text:
  quote: ''
  summary: An afterword instructs young skalds to preserve poetic diction and old
    periphrases while warning Christians not to believe the heathen sagas as true.
    It gives a euhemerizing explanation in which the Asas are men from Asia who altered
    Trojan stories into accounts of gods. The passage identifies several Norse mythic
    episodes and figures with Trojan-war figures and events, including Ragnarok, Thor
    and the Midgard-serpent, Fenris-wolf, Surt's flame, and postwar descendants.
  language: English
  quote_policy: summarized
