canonical_text:
  quote: ''
  summary: 'The passage recounts two examples concerning King Rolf Krake: first, Vog
    gives Rolf the name Krake, receives a gold ring, and vows vengeance against Rolf''s
    future killer; second, Rolf responds to King Adils'' refusal to pay Rolf''s berserks
    and surrender promised treasures by riding to Upsala, surviving a chamber fire
    challenge, receiving gold and the ring Sviagris from his mother Yrsa, escaping
    over Fyrisvold while scattering gold to delay pursuers, and humiliating Adils
    when he bends to pick up the ring. The passage ends by explaining a poetic name
    for gold as the seed of Krake or of Fyrisvold.'
  language: English
  quote_policy: summarized
