canonical_text:
  quote: ''
  summary: Ganglere asks Har for more information about the Asas. Har describes Balder,
    Njord, Skade, Frey, Freyja, and Tyr, including their dwellings, attributes, divine
    functions, kinship ties, invocations, and selected narrative episodes such as
    Njord's hostage exchange, Njord and Skade's incompatible dwelling preferences,
    Freyja's share of the slain, and Tyr's loss of his hand to the Fenris-wolf.
  language: English
  quote_policy: summarized
