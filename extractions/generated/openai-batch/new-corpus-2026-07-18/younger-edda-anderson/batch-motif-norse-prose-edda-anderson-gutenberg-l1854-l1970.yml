  text: Njord dwells in Noatun in heaven, rules the course of the wind, checks the
    fury of the sea and fire, and is invoked by seafarers and fishermen.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Njord can give broad lands and abundance to those who call on him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Njord was fostered in Vanaheim; the Vans gave him as a hostage to the gods
    and received Honer as an Asa-hostage in exchange, establishing peace between the
    gods and Vans.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Njord married Skade, daughter of the giant Thjasse; Skade preferred the mountains
    in Thrymheim, while Njord preferred the sea at Noatun.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Njord and Skade agreed to spend nine nights in Thrymheim and three nights
    in Noatun, but each complained about the other's preferred dwelling place.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Skade went up on the mountain, dwelt in Thrymheim, used snow-shoes and a bow,
