candidate_motifs:
- id: motif:1
  label: Radiant wise deity in a pure heavenly dwelling
  taxonomy_refs:
  - wisdom
  - divine_judgment
  basis: Balder is described as bright, wise, mild, eloquent, associated with unalterable
    judgments, and housed in Breidablik where nothing unclean can enter.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives a descriptive divine profile rather than a full narrative
    sequence for this motif.
- id: motif:2
  label: Hostage exchange establishing peace between divine groups
  taxonomy_refs:
  - sacred_exchange
  - covenant
  basis: Njord and Honer are exchanged as hostages between the Vans and the gods,
    and the exchange establishes peace.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not elaborate formal treaty terms beyond the exchange
    and peace result.
- id: motif:3
  label: Divine marriage across incompatible dwelling domains
  taxonomy_refs:
  - sacred_marriage
  - duality
  basis: Njord and Skade marry but prefer opposed environments, sea and mountain;
    their alternating residence agreement fails to satisfy either fully.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage states marital and spatial opposition but does not explicitly
    frame it as ritual or cosmic union.
- id: motif:4
  label: Agricultural weather deity invoked for harvest and peace
  taxonomy_refs:
  - seasonal_cycle
  basis: Frey rules rain, sunshine, and fruits of the earth and is invoked for harvests
    and peace.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: Seasonal cycle is inferred from rain, sunshine, fruits, and harvests;
    no explicit annual cycle is narrated.
- id: motif:5
  label: Division of the battle-slain between deities
  taxonomy_refs:
  - afterlife_journey_map
  - divine_judgment
  basis: Freyja chooses half of the slain each day, while the other half belongs to
    Odin.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives allocation of the slain but does not describe the dead's
    journey or criteria of selection.
- id: motif:6
  label: Animal-drawn vehicle of a goddess
  taxonomy_refs: []
  basis: Freyja travels in a car drawn by two cats.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives the vehicle image without a broader story attached to
    it.
- id: motif:7
  label: Self-sacrificial pledge to bind a dangerous beast
  taxonomy_refs:
  - sacrifice
  basis: Tyr places his hand in Fenrer's mouth as pledge during the wolf's binding
    and loses the hand when the wolf is not released.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The text presents the act as a pledge and loss of body part; it does not
    use the word sacrifice.
- id: motif:8
  label: Domain-specific divine invocation
  taxonomy_refs:
  - wisdom
  basis: The passage repeatedly states which gods should be invoked for seafaring,
