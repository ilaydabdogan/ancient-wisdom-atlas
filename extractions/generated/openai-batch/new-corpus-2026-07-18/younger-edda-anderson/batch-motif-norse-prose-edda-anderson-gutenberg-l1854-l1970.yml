- id: obs:1
  text: Ganglere asks for more tidings about the Asas, and Har answers by naming and
    describing individual gods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Balder is identified as Odin's second son and is described as fair, bright,
    wise, mild, eloquent, and associated with unalterable judgments.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Balder inhabits Breidablik in heaven, where nothing unclean can enter.
  category: setting
  evidence_refs:
  - ev:1
