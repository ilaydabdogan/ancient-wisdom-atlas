canonical_text:
  quote: ''
  summary: The passage explains why gold is called otter-ransom. Odin, Honer, and
    Loke travel, Loke kills an otter that is Hreidmar's son Otter, and Hreidmar demands
    a ransom of gold to fill and cover the otter skin. Loke obtains gold and a ring
    from the dwarf Andvare, who curses the ring. The ransom is paid with the ring
    covering the final exposed hair. The cursed gold then leads Fafner and Regin to
    kill Hreidmar; Fafner refuses to share, takes his father's helmet and sword, becomes
    a serpent or dragon, and broods over the gold at Gnita-heath.
  language: English
  quote_policy: summarized
