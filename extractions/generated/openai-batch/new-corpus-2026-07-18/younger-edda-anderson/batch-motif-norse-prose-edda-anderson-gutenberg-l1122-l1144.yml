canonical_text:
  quote: ''
  summary: In a question-and-answer exchange, Ganglere asks who is the highest and
    oldest god. Har identifies him as Alfather and lists twelve names, then describes
    him as everlasting ruler of all things. Jafnhar says he made heaven, earth, air,
    and their contents. Thride says he made man and gave him an imperishable spirit,
    and distinguishes the postmortem dwellings of the virtuous from the destinations
    of the wicked. Har also says that before heaven and earth were made, Alfather
    was with the frost-giants.
  language: English
  quote_policy: summarized
