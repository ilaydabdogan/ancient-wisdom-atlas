canonical_text:
  quote: In this hall the good and the righteous shall dwell through all ages.
  summary: Ganglere asks Har about remarkable places in heaven. Har lists dwellings
    including Alfheim, Breidablik, Glitner, Himinbjorg, Valaskjalf, and Gimle; contrasts
    light-elves and dark-elves; describes Odin’s high-seat Hlidskjalf; cites a stanza
    about Gimle; and explains higher heavens in relation to Surt’s fire.
  language: English
  quote_policy: quoted
