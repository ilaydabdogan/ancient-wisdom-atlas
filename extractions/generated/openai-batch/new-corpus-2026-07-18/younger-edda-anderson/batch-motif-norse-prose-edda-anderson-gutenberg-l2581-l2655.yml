canonical_text:
  quote: Then Thor saw that the glove was the hall in which he had spent the night,
    and that the adjoining room was the thumb of the glove.
  summary: Thor travels east into Jotunheim with Loke, Thjalfe, and Roskva. They lodge
    in what seems to be a large hall, but at dawn discover it was Skrymer's glove.
    Skrymer accompanies them, carries their provisions, and sleeps under oaks. Thor
    cannot open the provision sack and strikes Skrymer three times with Mjolner, but
    Skrymer treats the blows as if they were small falling objects. Skrymer warns
    Thor's party not to boast at Utgard, gives directions, and departs.
  language: English
  quote_policy: quoted
