canonical_text:
  quote: Hild went to the battlefield, and waked up with sorcery all the dead that
    had fallen.
  summary: Hedin takes King Hogne's daughter Hild as a prisoner of war while Hogne
    is absent. Hogne pursues Hedin by sea to the Orkneys; Hild and then Hedin offer
    reconciliation, but Hogne refuses after drawing the sword Dainsleif. The armies
    fight, Hild raises the dead by sorcery at night, and the battle renews from day
    to day until Ragnarok.
  language: English
  quote_policy: quoted
