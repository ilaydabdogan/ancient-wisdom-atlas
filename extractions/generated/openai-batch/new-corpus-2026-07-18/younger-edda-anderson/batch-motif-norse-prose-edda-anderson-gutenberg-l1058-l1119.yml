canonical_text:
  quote: He therefore undertook a journey to Asgard.
  summary: King Gylfe, wondering about the knowledge and power of the asa-folk, secretly
    travels to Asgard in the likeness of an old man. The asas foresee him and receive
    him with eye-deceit. He enters a high hall with a golden shield roof, meets a
    sword-playing door figure, sees rooms of people playing, drinking, and fighting,
    and is brought before three enthroned figures named Har, Jafnhar, and Thride.
    Har invites questions but warns that Gylfe will not leave hale unless he becomes
    wiser.
  language: English
  quote_policy: quoted
