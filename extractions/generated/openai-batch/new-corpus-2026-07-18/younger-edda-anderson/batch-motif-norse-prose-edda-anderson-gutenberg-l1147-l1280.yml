canonical_text:
  quote: ''
  summary: Ganglere asks how the world began. Har, Jafnhar, and Thride describe a
    primordial condition without earth or heaven, the existence of Ginungagap, Niflheim,
    Hvergelmer, and Muspelheim, the formation of ice and rime from venomous streams,
    the enlivening of melted drops into Ymer, the origin of frost-giants from Ymer,
    the cow Audhumbla and her milk, the emergence of Bure from salt-stones, the genealogy
    leading to Odin, Vile, and Ve, and the slaying of Ymer by the sons of Bor, whose
    blood drowns most frost-giants except Bergelmer and his household in an ark.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ganglere asks how the world came into existence and what existed before it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes an initial state without sand, sea, earth, heaven, or
    grass, while Ginungagap existed.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Niflheim existed before the earth, with the well Hvergelmer at its center
    and streams flowing from it, including Gjoll near the gate of Hel.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Muspelheim is described as a southern world that is light, hot, bright, and
    difficult for strangers to endure.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Surt stands on the border of Muspelheim with a flaming sword and is said to
    come at the end of the world to defeat the gods and burn the world.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The streams called Elivogs carry venomous matter that hardens into ice; rain
    from the venom freezes into rime, building layers into Ginungagap.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The northern part of Ginungagap is filled with ice, rime, rains, and gusts,
    while the southern part is lit by sparks from Muspelheim.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: When heated blasts from Muspelheim meet the rime, melted drops quicken into
    life and take the likeness of a man named Ymer, also called Aurgelmer by the Frost
    giants.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ymer is not treated as a god by Har; he and his offspring are called evil
    frost-giants.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: When Ymer sleeps, sweat under his left arm produces a man and a woman, and
    one of his feet begets a son with the other.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A cow named Audhumbla is formed from melted rime; four milk-streams from her
    teats feed Ymer.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Audhumbla licks rime-covered salt-stones, and over three days a man named
    Bure emerges from them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Bure begets Bor; Bor marries Bestla, daughter of the giant Bolthorn; Bor and
    Bestla have three sons named Odin, Vile, and Ve.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Har identifies Odin and his brothers as rulers of heaven and earth.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: The sons of Bor slay Ymer, and the blood from his wounds drowns the frost-giants
    except for Bergelmer and his household.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Bergelmer and his wife board an ark, save themselves, and become the source
    of new frost-giant races.
  category: sequence
  evidence_refs:
  - ev:8
