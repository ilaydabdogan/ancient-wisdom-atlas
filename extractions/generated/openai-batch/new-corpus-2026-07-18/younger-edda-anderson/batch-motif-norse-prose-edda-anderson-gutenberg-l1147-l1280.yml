- id: motif:8
  label: Flood-like destruction with ark survivor ancestry
  taxonomy_refs:
  - flood_and_renewal
  - ark_vessel
  - survivor_pair
  basis: Ymer's blood drowns the frost-giants except Bergelmer and his household;
