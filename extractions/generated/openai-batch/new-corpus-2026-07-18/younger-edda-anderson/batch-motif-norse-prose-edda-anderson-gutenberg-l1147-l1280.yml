candidate_motifs:
- id: motif:1
  label: Primordial void before formed world
  taxonomy_refs:
  - chaos
  basis: The passage states that before earth and heaven there was no sand, sea, cooling
    billows, earth, heaven, or grass, while Ginungagap existed.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not use a modern abstract term for chaos; the taxonomy
    reference is based on the described pre-creation absence and gap.
- id: motif:2
  label: Creation from the meeting of cold and heat
  taxonomy_refs:
  - duality
  basis: The cold, icy, rime-filled region from Niflheim and the hot, bright region
    from Muspelheim meet; heated blasts melt rime into drops that become Ymer.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The taxonomy label 'duality' is interpretive; the literal passage describes
    interacting thermal opposites.
- id: motif:3
  label: Primordial giant as ancestor of a race
  taxonomy_refs: []
  basis: Ymer/Aurgelmer is formed before later races and is said to be the source
    from whom the frost-giants descend.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: No specific available taxonomy ref exactly matches this ancestral giant
    motif.
- id: motif:4
  label: Body-generated offspring from a primordial being
  taxonomy_refs:
  - sacred_birth
  basis: Ymer's sleeping body produces a man and a woman from under his left arm,
    and one foot begets a son with the other.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage treats the being as non-divine and evil; the 'sacred_birth'
