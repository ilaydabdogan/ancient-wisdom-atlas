canonical_text:
  quote: ''
  summary: Brage recounts how Odin rides Sleipner to Jotunheim, provokes Hrungner
    into a horse pursuit, and Hrungner reaches Asgard. The gods invite Hrungner to
    drink; he becomes drunk, boasts that he will remove Valhal to Jotunheim, destroy
    Asgard, kill the gods, and take Freyja and Sif. Thor appears, Hrungner challenges
    him to a duel at Grjottungard, and the giants prepare by making a vast clay figure
    named Mokkerkalfe. Hrungner, described as stone-hearted and stone-headed, waits
    with a stone shield and flint weapon. Thjalfe deceives him about Thor's direction
    of attack. Thor arrives amid lightning and crashes, throws Mjolner, and Hrungner
    throws his flint-stone; the flint breaks, producing flint-mountains and wounding
    Thor, while Mjolner crushes Hrungner's skull. Hrungner falls with his foot on
    Thor's neck. Thjalfe defeats Mokkerkalfe. The gods cannot remove Hrungner's foot,
    but Thor's three-night-old son Magne throws it off. Thor grants Magne Hrungner's
    horse Goldfax, and Odin objects. Thor returns home with the flint-stone still
    in his head, and Groa sings magic songs until it loosens.
  language: English
  quote_policy: summarized
