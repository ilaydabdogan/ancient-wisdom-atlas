canonical_text:
  quote: ''
  summary: Skade arms herself and goes to Asgard to avenge Thjasse. The asas settle
    with her by allowing her to choose a husband by viewing only feet and by making
    her laugh. She mistakenly chooses Njord, thinking the beautiful feet indicate
    Balder. Loke makes her laugh through a goat-string performance. Odin turns Thjasse’s
    eyes into two stars. Æger asks about Thjasse’s kin, and Brage explains Olvalde’s
    sons and the mouthful-based division of gold that becomes a poetic/rune expression
    for gold.
  language: English
  quote_policy: summarized
