canonical_text:
  quote: ''
  summary: King Gylfe grants a wayfaring woman as much land as four oxen can plow
    in a day and night. The woman, Gefjun of the asa-race, uses four oxen, her sons
    by a giant, to tear land away and draw it westward into the sea, where she names
    it Seeland. The removed place becomes Lake Malar, and a skaldic stanza is cited
    for the episode.
  language: English
  quote_policy: summarized
