canonical_text:
  quote: ''
  summary: In a frame dialogue, Ganglere asks whether Thor has ever met anything stronger
    than himself. Thride begins an adventure in which Oku-Thor travels with Loke,
    lodges at a bonde's house, kills and cooks his goats, instructs the household
    to put the bones on the skins, and later hallows the skins with Mjolner so the
    goats arise. Because Thjalfe has broken one thigh-bone for marrow, one goat limps.
    Thor becomes angry, the household pleads for peace, and Thor accepts Thjalfe and
    Roskva as ransom-servants.
  language: English
  quote_policy: summarized
