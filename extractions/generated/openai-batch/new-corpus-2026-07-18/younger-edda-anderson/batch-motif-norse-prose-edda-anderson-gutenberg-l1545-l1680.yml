canonical_text:
  quote: This ash is the best and greatest of all trees; its branches spread over
    all the world, and reach up above heaven.
  summary: Ganglere asks about the gods’ holiest place. Har and Jafnhar describe the
    ash Ygdrasil, its roots, wells, divine council site, Bifrost, the norns, and creatures
    that dwell on or damage the tree. The passage also describes Odin’s eye pledge
    at Mimer’s well, the daily journeys of the gods, Thor’s river-wading, the fire
    of Bifrost, the shaping of human fates by norns, and the norns’ preservation of
    the ash with water and clay from Urd’s fountain.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Ganglere asks where the chief or most holy place of the gods is, and Har answers
    that it is by the ash Ygdrasil, where the gods meet in council every day.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jafnhar says Ygdrasil is the greatest of trees, with branches over all the
    world and above heaven, and with three widely separated roots reaching toward
    the asas, the frost-giants, and Niflheim.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Under the root extending to the frost-giants is Mimer’s well, where knowledge
    and wisdom are concealed, and Mimer drinks from it with the Gjallar-horn.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Alfather comes to Mimer’s well and receives a drink only after leaving one
    of his eyes as a pledge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The third root of the ash is in heaven; beneath it is Urd’s sacred fountain,
    where the gods have their doomstead and where the asas ride daily over Bifrost,
    while Thor goes on foot and wades rivers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Har explains that the red seen in the rainbow is burning fire, and that frost-giants
    and mountain-giants would go up to heaven if Bifrost were passable to all.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Three maids named Urd, Verdande, and Skuld come from a hall near the fountain
    beneath the ash and shape the lives of men; more norns come to each man at birth,
    from the races of gods, elves, and dwarfs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Har says good norns of good descent shape good lives, while evil norns cause
    misfortune.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: An eagle sits on a bough of the ash, a hawk named Vedfolner sits between the
    eagle’s eyes, Ratatosk carries envious words between the eagle and Nidhug, four
    stags bite the leaves, and many serpents are with Nidhug below.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The norns dwelling in Urd’s fountain take water and clay from around the fountain
    each day and sprinkle the ash so that its branches do not wither or decay.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Dew from Ygdrasil falls on the earth and is called honey-fall, the food of
    bees; two swans fed in Urd’s fountain are said to be the parents of the race of
    swans.
  category: relationship
  evidence_refs:
  - ev:10
