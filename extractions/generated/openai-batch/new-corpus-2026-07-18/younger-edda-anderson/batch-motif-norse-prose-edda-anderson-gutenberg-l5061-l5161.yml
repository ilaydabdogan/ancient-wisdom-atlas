  summary: Editorial notes identify Enea with Aeneas and Herikon with Erichthonios,
    then present a comparative discussion of the historical or anthropomorphized Odin.
    The note compares Odin with Aeneas, Romulus, Remus, and Ulysses, describing Odin
    as a wandering Teutonic race-founder whose story functioned like ancestral history
    and could furnish the basis for a Teutonic epic.
