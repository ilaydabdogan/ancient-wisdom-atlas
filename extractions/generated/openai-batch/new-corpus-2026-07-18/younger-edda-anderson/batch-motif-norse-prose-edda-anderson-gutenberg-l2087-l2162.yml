canonical_text:
  quote: ''
  summary: The gods try to bind a rapidly growing wolf who is prophesied to become
    fatal to them. The wolf breaks the fetters Lading and Drome, but a dwarf-made
    band called Gleipner, made from impossible substances, holds him when Tyr places
    his right hand in the wolf's mouth as a pledge. Tyr loses the hand. The gods anchor
    the bound wolf with named stones, gag him with a sword, and his saliva forms the
    river Von. He is to remain there until Ragnarok; the gods do not kill him because
    of the holiness of their peace-stead, despite prophecy that he will become Odin's
    bane.
  language: English
  quote_policy: summarized
