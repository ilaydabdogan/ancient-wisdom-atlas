canonical_text:
  quote: ''
  summary: In a dialogue, Ganglere asks about wind, seasons, and the gods. Har explains
    wind as arising from the wings of Hrasvelg, a giant in eagle guise, and explains
    summer and winter through named ancestral figures. Har, Jafnhar, and Thride describe
    the Asas and goddesses, Odin's rule, names, wife Frigg, and provision for fallen
    fighters, then describe Thor's realm, hall, goats, chariot, hammer, belt, and
    iron gloves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ganglere asks where wind comes from, noting that it moves seas and fans fires
    while remaining unseen.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Har says Hrasvelg sits at the northern end of heaven, is a giant clad in eagle
    plumes, and produces winds when he spreads his wings.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Har identifies Svasud as father of summer and says mild things are called
    sweet from him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Har identifies the father of winter as Vindlone or Vindsval, son of Vasad,
    and describes that race as grim and of icy breath.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dialogue states that there are twelve divine Asas and that the asynjes
    are no less holy or powerful.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Thride says Odin is the highest and oldest of the Asas, rules all things,
    and is served by the other gods as children serve a father.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Frigg is named as Odin's wife and is said to know the fate of men while not
    telling it.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Odin is called Alfather and Valfather; those who fall in fight are his chosen
    sons, and he prepares Valhal and Vingolf for them, where they are called einherjes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Odin is given a long catalogue of names, and Har explains that some names
    arise from different tongues and others from Odin's journeys and adventures.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Thor is described as foremost among the other Asas, strongest of gods and
    men, ruler of Thrudvang, and owner of the hall Bilskirner with five hundred and
    forty floors.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Thor has two named goats, Tangnjost and Tangrisner, who draw his chariot,
    leading to the name Oku-Thor.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Thor possesses Mjolner, Megingjarder, and iron gloves; the belt doubles his
    strength, the gloves are needed for the hammer, and the hammer has split the skulls
    of many giants' kin.
  category: object
  evidence_refs:
  - ev:9
