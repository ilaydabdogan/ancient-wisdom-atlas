canonical_text:
  quote: ''
  summary: Ganglere asks Har about Sleipner and then about Skidbladner. Har narrates
    how a builder, later revealed as a mountain-giant, bargains to build a secure
    burg for the gods in exchange for Freyja, the sun, and the moon. Loke's suggestion
    permits the builder to use the horse Svadilfare, whose labor nearly completes
    the work. Threatened by the gods, Loke causes a mare to lure Svadilfare away so
    the deadline is missed. Thor kills the giant with Mjolner, and Loke later bears
    the eight-footed foal Sleipner. Har also describes Skidbladner, a ship made by
    the sons of Ivalde for Frey, large enough for all the asas with their gear, always
    granted fair wind, and foldable into Frey's pocket.
  language: English
  quote_policy: summarized
