canonical_text:
  quote: ''
  summary: Har answers Ganglere by describing Alfather's appointment of rulers at
    Idavold, the building of Gladsheim and Vingolf, the making of a forge and tools,
    the golden age, and the gods' later counsel concerning the dwarfs. The passage
    says dwarfs first quickened in Ymer's flesh and the earth, were given understanding
    and human likeness by the gods, and dwell in earth and rocks. It then quotes and
    cites the Vala's Prophecy for the creation and naming of dwarfs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ganglere asks what Alfather did after Asgard had been built, and Har answers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Alfather appoints rulers at Idavold, a place described as in the middle of
    the burg, to judge disputes and decide the affairs of the burg with him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first work of the rulers is to erect a court with seats for the twelve
    and a high-seat for Alfather; the house is called Gladsheim and is described as
    like solid gold within and without.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Another hall, Vingolf, is built as a home for the goddesses.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The gods build a forge, make hammer, tongs, anvil, and other tools, and work
    in iron, stone, wood, and especially gold.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: All household wares are said to be of gold, and the age is called the golden
    age until it is lost by the coming of women from Jotunheim.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The gods sit in their high-seats and hold counsel concerning the dwarfs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The dwarfs are said to have quickened in the mould of the earth like maggots
    in flesh and first to have quickened in Ymer's flesh as maggots.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: By decision of the gods, the dwarfs receive understanding and the likeness
    of men, while still having to dwell in earth and rocks.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Modsogner and Durin are named as dwarfs.
  category: other
  evidence_refs:
  - ev:3
- id: obs:11
  text: The quoted Vala's Prophecy says the gods went to judgment seats, took counsel,
    and created the race of dwarfs from the bloody sea and Blain's bones, making many
    dwarfs in the earth in the likeness of men.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The passage gives lists of dwarf names and distinguishes some as dwelling
    in the mould and others as dwelling in rocks.
  category: attribute
  evidence_refs:
  - ev:5
