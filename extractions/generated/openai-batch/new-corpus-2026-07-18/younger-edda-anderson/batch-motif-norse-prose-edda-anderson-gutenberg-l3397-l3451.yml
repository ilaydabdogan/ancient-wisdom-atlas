canonical_text:
  quote: ''
  summary: Brage tells how Odin, Loke, and Honer travel hungry, encounter a large
    eagle that prevents their ox from boiling, and Loke is forced to promise to bring
    Idun and her apples out of Asgard. Loke deceives Idun into leaving Asgard, where
    the giant Thjasse in eagle guise abducts her to Thrymheim. The asas grow old without
    Idun, compel Loke to retrieve her, and he borrows Freyja's falcon-guise, turns
    Idun into a nut, and carries her back while Thjasse pursues in eagle guise. At
    Asgard, the asas ignite shavings so that Thjasse catches fire and is slain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Brage begins a tale in which three asas, Odin, Loke, and Honer, travel over
    mountains and heaths and cannot get food.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The three travelers take an ox from a herd of cattle and try to boil it, but
    the meat does not become cooked.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A voice from an oak above them belongs to a large eagle, who says he is the
    cause of the broth not boiling and demands his fill of the ox.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The eagle takes the ox's thighs and shoulders, angering Loke.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Loke strikes the eagle with a pole; the pole sticks to the eagle and to Loke's
    hands, and the eagle flies while dragging Loke over stones, rocks, and trees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The eagle declares that Loke will not be freed unless he pledges to bring
    Idun and her apples out of Asgard; Loke promises and is released.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the agreed time, Loke coaxes Idun out of Asgard into a forest, saying he
    has found apples and asking her to bring her own apples for comparison.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The giant Thjasse, in the guise of an eagle, seizes Idun and flies away with
    her to his home in Thrymheim.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The asas become gray-haired and old after Idun's disappearance, hold council,
    and learn she was last seen leaving Asgard with Loke.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Loke is seized, threatened with death or torture, and promises to bring Idun
    back from Jotunheim if Freyja lends him her falcon-guise.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Using the falcon-guise, Loke flies to Jotunheim, finds Idun alone while Thjasse
    is at sea, turns her into the likeness of a nut, holds her in his claws, and flies
    away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Thjasse returns, takes eagle-guise, and pursues Loke; the asas prepare plane-shavings
    at Asgard's walls, ignite them after Loke enters, and the eagle's feathers catch
    fire before Thjasse is slain within Asgard's gates.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
