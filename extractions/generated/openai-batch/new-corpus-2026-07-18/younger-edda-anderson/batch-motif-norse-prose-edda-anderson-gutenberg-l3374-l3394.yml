  quote: He made a journey to Asgard.
  summary: Æger, also called Hler, travels from Hler's Isle to Asgard. The asas receive
    him hospitably while using delusions. At an evening feast, Odin has bright swords
    brought into the hall as light. Twelve asa judges sit in high-seats, goddesses
    are present, the hall is decorated with shields, strong mead is drunk, and Brage
    converses with Æger about events concerning the asas.
