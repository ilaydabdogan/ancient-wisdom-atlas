canonical_text:
  quote: ''
  summary: Hermod rides to Hel through dark valleys, crosses the Gjallar-bridge, passes
    Hel’s gate, and finds Balder in Hel’s hall. Hel says Balder may return if all
    living and dead things weep for him. The asas send messengers, and nearly all
    things weep, but the giantess Thok refuses; the passage reports that Thok is generally
    believed to have been Loke.
  language: English
