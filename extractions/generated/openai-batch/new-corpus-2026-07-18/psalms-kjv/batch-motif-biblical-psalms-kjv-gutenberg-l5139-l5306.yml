canonical_text:
  quote: ''
  summary: Psalm 104 praises the LORD as provider and maker of an ordered world, including
    plants, animals, seasons, sea creatures, life, death, and renewal. Psalm 105 calls
    Israel to remember the LORD’s covenant with Abraham, Isaac, Jacob, and Israel,
    then recounts Joseph’s suffering and elevation, Israel’s stay in Egypt, Moses
    and Aaron’s signs, the plagues, and the people’s departure with wealth and strength.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The LORD causes grass, herbs, food from the earth, wine, oil, and bread to
    serve animals and humans.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Trees and cedars are described as planted by the LORD and used by birds and
    the stork; high hills and rocks provide refuge for wild goats and conies.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The moon is appointed for seasons, the sun has a going down, darkness becomes
    night, forest beasts come out, lions seek food, and humans work until evening.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The great wide sea contains innumerable creeping things, small and great beasts,
    ships, and leviathan, which the LORD made to play there.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Living creatures wait on the LORD for food; when he gives, they gather, and
    when he opens his hand they are filled.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the LORD hides his face creatures are troubled; when he takes away their
    breath they die and return to dust; when he sends his spirit they are created
    and the earth is renewed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The LORD looks on the earth and it trembles; he touches the hills and they
    smoke.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speaker vows to sing to the LORD while alive, to meditate on him, to be
    glad in him, and asks that sinners and the wicked be removed from the earth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The people are instructed to give thanks, call on the LORD’s name, sing, speak
    of his works, seek his face, and remember his works, wonders, and judgments.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The LORD is said to remember his covenant forever, made with Abraham, sworn
    to Isaac, confirmed to Jacob and Israel, and connected with the gift of Canaan
    as inheritance.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The ancestors are described as few, strangers, and moving among nations and
    kingdoms; the LORD prevents wrong against them and reproves kings on their behalf.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The LORD calls famine on the land and sends Joseph ahead; Joseph is sold as
    a servant, bound with fetters and iron, released by a king, and made ruler of
    the king’s house and substance.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Israel and Jacob come into Egypt, called the land of Ham; the people increase,
    their enemies come to hate them, and Moses and Aaron are sent to show signs and
    wonders.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The LORD sends or causes darkness, waters turned to blood, dead fish, frogs,
    flies, lice, hail, flaming fire, damaged vines and fig trees, locusts and caterpillars
    that eat crops, and death of the firstborn.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
- id: obs:15
  text: The LORD brings the tribes forth with silver and gold, and no feeble person
    is among them.
  category: action
  evidence_refs:
