comparison_claims:
- id: claim:1
  claim: 'The plague sequence in Psalm 105 fits the same motif pattern as a biblical
    plague-deliverance tradition: chosen servants are sent, signs occur in the land
    of Ham, and the people are brought forth afterward.'
  claim_level: same_motif
  target: biblical plague-deliverance pattern
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is based only on the events summarized in this passage;
    no external Exodus passage is supplied here for direct textual comparison.
- id: claim:2
  claim: The remembered covenant with Abraham, Isaac, Jacob, and Israel corresponds
    to an ancestral covenant-and-land-promise pattern within biblical tradition.
  claim_level: same_motif
  target: ancestral covenant and promised-land pattern
  evidence_refs:
