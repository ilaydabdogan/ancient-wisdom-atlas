candidate_motifs:
- id: motif:1
  label: ordered creation by divine wisdom
  taxonomy_refs:
  - wisdom
  basis: The passage states that the LORD made manifold works in wisdom and shows
    ordered provision for plants, animals, humans, sea creatures, seasons, and daily
    rhythms.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage is hymn-like praise rather than a narrative creation account.
- id: motif:2
  label: seasonal and daily cycle
  taxonomy_refs:
  - seasonal_cycle
  basis: The moon is appointed for seasons; sunset, darkness, night, sunrise, animal
    movement, and human labor form a repeated cycle.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: ''
- id: motif:3
  label: death and renewal of living beings
  taxonomy_refs:
  - death_rebirth
  basis: Creatures die and return to dust when breath is taken, and are created and
    the earth renewed when the LORD sends spirit.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The wording concerns creaturely and earthly renewal; it does not explicitly
    describe individual resurrection.
- id: motif:4
  label: covenant with ancestral figures and promised land
  taxonomy_refs:
  - covenant
  basis: The LORD remembers a covenant with Abraham, Isaac, Jacob, and Israel, tied
