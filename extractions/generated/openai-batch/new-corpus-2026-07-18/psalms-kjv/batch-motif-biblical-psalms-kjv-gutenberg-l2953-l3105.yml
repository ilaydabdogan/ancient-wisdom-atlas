  summary: A sequence of psalm passages praises God for watering and blessing the
    earth, making lands and nations rejoice, turning sea to dry land, preserving and
    testing the people, hearing prayer and receiving vowed offerings, judging nations,
    scattering enemies, protecting the vulnerable, marching through the wilderness
    with Sinai trembling, giving rain and victory, and choosing a hill as a lasting
    dwelling place.
