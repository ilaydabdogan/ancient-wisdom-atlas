candidate_motifs:
- id: motif:1
  label: Lamenting supplicant seeks divine healing and rescue from death
  taxonomy_refs: []
  basis: The speaker asks for mercy, healing, deliverance, and salvation while referring
    to death, the grave, and being lifted from the gates of death.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:24
  confidence: high
  cautions: The passage asks for rescue from death or death-like danger; it does not
    narrate an actual death and return.
- id: motif:2
  label: Divine judgment against wicked enemies
  taxonomy_refs:
  - divine_judgment
  basis: The LORD is invoked and described as judge of the speaker, peoples, wicked,
    nations, and world, with a throne and prepared weapons of judgment.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:19
  - ev:20
  confidence: high
  cautions: The material is liturgical-poetic rather than a single continuous mythic
    episode.
- id: motif:3
  label: Trap-maker caught in own trap
  taxonomy_refs:
  - divine_judgment
  basis: The wicked figure falls into the ditch he made, his mischief returns on his
    head, and the nations sink into their own pit and hidden net.
  evidence_refs:
  - ev:12
  - ev:26
  confidence: high
  cautions: The passage states the reversal but does not narrate detailed circumstances
    of the trap-making.
- id: motif:4
  label: Deity as refuge for oppressed seekers
  taxonomy_refs: []
  basis: The LORD is described as defense, refuge for the oppressed in trouble, one
    who does not forsake seekers, and one who remembers the humble cry.
  evidence_refs:
  - ev:9
  - ev:21
  - ev:23
  confidence: high
  cautions: This is a devotional protective pattern rather than a fully developed
    narrative motif.
- id: motif:5
  label: Unexpected strength from infants silences enemies
  taxonomy_refs: []
  basis: Strength is ordained from the mouth of babes and sucklings to still enemy
    and avenger.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The passage gives a compact poetic statement without extended narrative
    development.
- id: motif:6
  label: Humanity crowned with honour and given dominion over creatures
  taxonomy_refs:
  - royal_legitimacy
  basis: Humanity is made a little lower than angels, crowned with glory and honour,
    and given dominion over animals and works of the LORD's hands.
  evidence_refs:
  - ev:16
  - ev:17
  confidence: medium
  cautions: The crown and dominion language is applied to humanity generally, not
    to a named king; the royal-legitimacy taxonomy fit is therefore approximate.
- id: motif:7
  label: Sacred dwelling and praise at Zion
  taxonomy_refs:
  - world_center
  basis: The LORD is said to dwell in Zion, and the speaker will praise in the gates
    of the daughter of Zion.
  evidence_refs:
  - ev:22
  - ev:25
  confidence: medium
  cautions: The passage names Zion as divine dwelling and praise-place but does not
    explicitly develop a world-center cosmology.
comparison_claims:
- id: claim:1
  claim: The passage fits a divine-judgment motif family insofar as God judges the
    righteous, wicked, nations, and world and enacts reversal against persecutors.
  claim_level: same_motif
  target: divine_judgment motif family
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:19
  - ev:20
  - ev:26
  counter_evidence_refs: []
  confidence: high
  limitations: This is a motif-family classification, not evidence of historical contact
    with another tradition.
- id: claim:2
  claim: The pit and hidden-net passages fit a recurring self-ensnaring-trap pattern,
    where harm returns upon the one who prepared it.
  claim_level: same_function
  target: trap-maker caught in own trap pattern
  evidence_refs:
  - ev:12
  - ev:26
  counter_evidence_refs: []
  confidence: high
  limitations: The passage presents the pattern poetically and briefly, without a
    full folktale-style plot.
- id: claim:3
  claim: The description of humanity crowned with glory and given dominion over animals
    resembles a royal-dominion pattern, though generalized to humankind rather than
    a single monarch.
  claim_level: same_function
  target: royal_legitimacy motif family
  evidence_refs:
  - ev:16
  - ev:17
  counter_evidence_refs: []
  confidence: medium
  limitations: Because the passage speaks of humanity rather than a named ruler, the
    comparison is functional and approximate.
- id: claim:4
  claim: The reference to the LORD dwelling in Zion and praise at Zion's gates can
    be cautiously read alongside world-center or sacred-place patterns.
  claim_level: same_function
  target: world_center motif family
  evidence_refs:
  - ev:22
  - ev:25
  counter_evidence_refs: []
  confidence: low
  limitations: The passage does not explicitly describe Zion as the cosmic center;
    it only names it as the LORD's dwelling and a place of praise.
