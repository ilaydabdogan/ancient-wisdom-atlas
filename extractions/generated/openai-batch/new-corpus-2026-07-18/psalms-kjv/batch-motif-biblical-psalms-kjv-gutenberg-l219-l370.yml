  summary: A sequence of psalm passages presents a distressed speaker asking the LORD
    for mercy, healing, deliverance, and vindication; describes God as judge, defender,
    refuge, and ruler; reflects on human dignity and dominion within creation; and
    declares praise after enemies and nations are defeated or caught in traps of their
    own making.
