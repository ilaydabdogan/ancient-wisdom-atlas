candidate_motifs:
- id: motif:1
  label: Divine judgment against the wicked
  taxonomy_refs:
  - divine_judgment
  basis: God is described as scattering enemy bones, cutting off enemies, afflicting
    them, casting down peoples, and bringing bloody and deceitful men into the pit
    of destruction.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:16
  - ev:20
  - ev:24
  confidence: high
  cautions: The passage is poetic petition and trust language rather than a narrative
    account of a completed judgment in every instance.
- id: motif:2
  label: Covenant broken by a treacherous companion
  taxonomy_refs:
  - covenant
  basis: A former companion is associated with reproach and later with putting forth
    hands against one at peace and breaking covenant.
  evidence_refs:
  - ev:13
  - ev:17
  - ev:18
  confidence: medium
  cautions: The passage does not explicitly state that the equal and the covenant-breaker
    are the same person, though they occur in the same lament context.
- id: motif:3
  label: Sacrificial praise after deliverance
  taxonomy_refs:
  - sacrifice
  basis: The speaker promises to sacrifice freely and praise the LORD because God
    has delivered him from trouble.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The sacrifice is mentioned as a vow or declaration, not described as performed
    within the passage.
- id: motif:4
  label: Restoration or return from captivity
  taxonomy_refs:
  - return
  basis: The passage hopes for salvation from Zion and says Jacob and Israel will
    rejoice when God brings back the captivity of his people.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The restoration is expressed as hope and future expectation within a psalmic
    line.
- id: motif:5
  label: Flight from danger to wilderness refuge
  taxonomy_refs:
  - departure
  basis: The speaker wishes for dove-like wings to fly away, rest, wander far off,
    remain in the wilderness, and escape storm and tempest.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is a desired escape image, not an actual narrated journey.
- id: motif:6
  label: Deliverance from death and continued life before God
  taxonomy_refs:
  - death_rebirth
  basis: The speaker says God has delivered his soul from death and asks deliverance
    of his feet from falling so that he may walk before God in the light of the living.
  evidence_refs:
  - ev:26
  confidence: medium
  cautions: The passage states rescue from death but does not narrate literal death
    and rebirth.
- id: motif:7
  label: Divine refuge under wings
