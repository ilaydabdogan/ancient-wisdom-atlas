canonical_text:
  quote: ''
  summary: The passage contains laments and petitions in which the speaker describes
    corrupt people, enemies, oppressors, betrayal by a close companion, violence in
    the city, fear, and danger. The speaker asks God to save, judge, scatter, cut
    off, cast down, or bring enemies into destruction, while also expressing trust,
    prayer, praise, sacrifice, and refuge in God. It also mentions the hoped-for restoration
    of Israel from Zion, God's recording of the speaker's wanderings and tears, deliverance
    from death and falling, and shelter under God's wings.
  language: English
  quote_policy: summarized
