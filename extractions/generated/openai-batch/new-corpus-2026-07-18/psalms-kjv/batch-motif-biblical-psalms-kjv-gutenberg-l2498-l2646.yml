  source_text_path: texts/public-domain/biblical/project-gutenberg/psalms-kjv.md
  rights_note: Public domain King James Version text from Project Gutenberg metadata.
- id: ev:27
  type: summary
  locator: 19:057:001
  quote_or_summary: The speaker asks God for mercy, says his soul trusts in God, and
    makes refuge in the shadow of God's wings until calamities pass.
