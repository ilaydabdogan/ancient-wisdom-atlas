canonical_text:
  quote: ''
  summary: The passage presents the LORD as everlasting king, creator, judge, teacher,
    refuge, and object of worship. It describes floods and seas as powerful but subordinate
    to the LORD, laments wicked oppression, calls for righteous judgment, urges communal
    and universal praise, recalls the wilderness generation that was denied rest,
    and depicts creation rejoicing before the LORD's coming judgment.
  language: English
  quote_policy: summarized
