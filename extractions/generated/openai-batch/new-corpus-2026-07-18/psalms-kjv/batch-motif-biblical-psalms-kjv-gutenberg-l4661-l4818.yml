  - ev:8
  - ev:10
  - ev:12
  confidence: high
  cautions: The passage presents divine sovereignty rather than a human dynastic succession
    narrative.
- id: motif:2
  label: Waters surpassed by a high deity
  taxonomy_refs:
  - chaos
  basis: Floods and sea lift voice and waves, yet the LORD on high is mightier; the
    sea is also said to be made by him and called to roar before him.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:11
  confidence: medium
  cautions: The passage does not name a chaos monster or describe an explicit combat;
    the connection rests on turbulent waters subordinated to the deity.
- id: motif:3
  label: Divine judgment against wicked oppressors
  taxonomy_refs:
  - divine_judgment
  basis: The LORD is invoked as judge of the earth, asked to repay the proud, and
