candidate_motifs:
- id: motif:1
  label: Divine kingship stabilizing the world
  taxonomy_refs:
  - royal_legitimacy
  basis: The LORD reigns, has an ancient throne, establishes the world, is called
    a great King above all gods, and is proclaimed as ruler among the nations.
  evidence_refs:
