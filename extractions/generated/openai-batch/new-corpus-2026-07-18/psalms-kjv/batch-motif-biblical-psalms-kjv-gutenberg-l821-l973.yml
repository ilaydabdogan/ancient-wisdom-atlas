literal_observations:
- id: obs:1
  text: A servant asks to be kept from presumptuous sins and asks that the words of
    his mouth and meditation of his heart be acceptable to the LORD.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A prayer asks the LORD to hear in trouble, defend by the name of the God of
    Jacob, send help from the sanctuary, strengthen from Zion, and remember offerings
    and burnt sacrifice.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaking group says they will rejoice in salvation, set up banners in
    the name of God, and remember the LORD's name rather than trust in chariots and
    horses.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The LORD is said to save his anointed, hear him from holy heaven, and act
    with the saving strength of his right hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king is described as rejoicing in the LORD's strength and salvation, receiving
    his heart's desire, a crown of pure gold, life, honor, majesty, and stability
    through trust in the LORD.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Enemies are described as being found by the LORD's hand, made like a fiery
    oven, swallowed in wrath, devoured by fire, deprived of fruit and seed, and faced
    with arrows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: An afflicted speaker cries by day and by night, says God is far from helping,
    and recalls that the fathers trusted in God and were delivered.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Onlookers mock the afflicted speaker and ridicule his trust in the LORD.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The afflicted speaker describes being related to God from the womb and from
    his mother's belly.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The afflicted speaker describes being surrounded by bulls, a lion-like mouth,
    dogs, and an assembly of the wicked, while his body is depicted as poured out
    like water, with bones exposed or disjointed, heart like melted wax, dried strength,
    and tongue cleaving to jaws.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The afflicted speaker says his hands and feet are pierced, his bones can be
    counted, and his garments are divided by others who cast lots for his vesture.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The afflicted speaker petitions the LORD for rescue from the sword, the dog,
    the lion's mouth, and the horns of unicorns, and says the LORD has heard him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The speaker says he will declare the LORD's name among brethren and praise
    in the congregation; the afflicted is said to have been heard, vows will be paid,
    and the meek will eat and be satisfied.
  category: sequence
  evidence_refs:
  - ev:9
