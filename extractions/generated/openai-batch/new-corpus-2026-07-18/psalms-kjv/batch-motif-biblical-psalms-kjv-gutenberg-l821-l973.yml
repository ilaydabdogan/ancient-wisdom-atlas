  summary: A sequence of psalm passages moves from a servant's petition for moral
    restraint, to communal prayer for the LORD to aid and save the king, to royal
    thanksgiving and judgment against enemies, and then to an afflicted speaker's
    lament, rescue plea, and promised public praise.
