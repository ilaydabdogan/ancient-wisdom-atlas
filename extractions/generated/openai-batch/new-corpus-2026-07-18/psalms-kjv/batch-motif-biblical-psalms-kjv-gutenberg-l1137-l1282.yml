  text: The speaker desires to dwell in the house of the LORD, behold the LORD's beauty,
    and inquire in the temple.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In trouble, the LORD is said to hide the speaker in a pavilion and tabernacle,
    set him upon a rock, and lift his head above surrounding enemies; the speaker
    responds with joyful sacrifices and singing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker cries for the LORD to hear, have mercy, answer, not hide his face,
    and not leave or forsake him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker says that if father and mother forsake him, the LORD will take
    him up; he asks to be taught and led in a plain path because of enemies and false
    witnesses.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The speaker cries to the LORD as rock and says that divine silence would make
    him like those who go down into the pit; he lifts his hands toward the holy oracle.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The wicked and workers of iniquity are described as speaking peace to neighbours
    while having mischief in their hearts; the speaker asks that they receive according
    to their deeds, and the passage says the LORD will destroy them and not build
    them up.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The LORD is praised for hearing supplications and is described as strength,
    shield, and saving strength of his anointed; the speaker asks the LORD to save,
    bless, feed, and lift up his people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The mighty are called to give the LORD glory and strength, to give glory due
    to his name, and to worship in the beauty of holiness.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The voice of the LORD is upon the waters and thunder; it breaks cedars, makes
    Lebanon and Sirion skip, divides flames of fire, shakes the wilderness, makes
    hinds calve, uncovers forests, and is associated with glory in the temple and
    kingship over the flood.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The speaker extols the LORD for lifting him up, preventing foes from rejoicing
    over him, healing him, bringing his soul up from the grave, and keeping him alive
    so that he does not go down to the pit.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The speaker contrasts momentary anger with life-giving favor, night weeping
