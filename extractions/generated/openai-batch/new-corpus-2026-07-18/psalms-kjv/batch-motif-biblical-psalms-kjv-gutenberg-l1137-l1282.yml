  quote: The LORD is my light and my salvation; whom shall I fear?
  summary: Psalms 27-30 present first-person petitions and thanksgivings to the LORD
    for protection, guidance, judgment on wicked enemies, communal blessing, storm-kingship
    over waters and flood, healing, rescue from the grave or pit, and the reversal
    of mourning into joy.
  language: English
