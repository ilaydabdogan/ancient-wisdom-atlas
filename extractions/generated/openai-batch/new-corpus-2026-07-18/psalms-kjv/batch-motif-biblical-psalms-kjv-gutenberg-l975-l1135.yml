  summary: The passage includes the end of Psalm 22 and Psalms 23-26. It presents
    the LORD as universal ruler, shepherd, world-founder, King of glory, teacher,
    covenant revealer, judge, and redeemer. It describes worship by nations and future
    generations, divine guidance through danger, entry into the LORD's holy place,
    and prayers for mercy, instruction, vindication, and deliverance.
