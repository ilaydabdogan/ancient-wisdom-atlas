  quote: ''
  summary: The passage contrasts the righteous, whose speech and heart are aligned
    with wisdom and divine law, with the wicked who seek harm and are cut off. A first-person
    speaker describes affliction, divine chastening, social isolation, enemies, guarded
    silence, confession, reflection on human frailty, and petitions for help. The
    final verses recount the LORD hearing the speaker, raising him from a pit and
    miry clay to a rock, and giving him a new song of praise.
  language: English
  quote_policy: summarized
