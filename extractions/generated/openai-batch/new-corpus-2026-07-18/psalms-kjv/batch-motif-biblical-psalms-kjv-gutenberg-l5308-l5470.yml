candidate_motifs:
- id: motif:1
  label: Departure from oppressive land under divine guidance
  taxonomy_refs:
  - departure
  basis: The people depart Egypt, Egypt fears them, and the LORD guides the departing
    people with cloud and fire.
  evidence_refs:
  - ev:1
