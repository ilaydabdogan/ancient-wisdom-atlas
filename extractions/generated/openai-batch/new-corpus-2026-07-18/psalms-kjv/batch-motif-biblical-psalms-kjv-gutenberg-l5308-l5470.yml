  confidence: high
  cautions: The passage summarizes an earlier narrative rather than narrating the
    departure in extended detail.
- id: motif:2
  label: Wilderness provision by divine food and water
  taxonomy_refs: []
  basis: The LORD provides quails, bread of heaven, and water from an opened rock
    in dry places.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No supplied taxonomy motif family precisely names wilderness provision;
    water is captured as a symbol rather than a motif family.
- id: motif:3
  label: Water-crossing deliverance and enemy destruction
  taxonomy_refs:
  - departure
  - divine_judgment
  basis: The LORD dries the Red Sea, leads the people through the depths, saves them
    from enemies, and waters cover those enemies.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage calls it the Red Sea episode; broader water-chaos or flood
    readings are not required by this extract.
- id: motif:4
  label: Covenant remembrance and mercy after affliction
  taxonomy_refs:
  - covenant
  basis: The LORD remembers his holy promise to Abraham and later remembers covenant
    when he hears the people's cry in affliction.
  evidence_refs:
  - ev:3
  - ev:14
  confidence: high
  cautions: The passage emphasizes remembrance and mercy, not the original covenant-making
    scene.
- id: motif:5
  label: Rebellion followed by divine judgment
  taxonomy_refs:
  - divine_judgment
  basis: Rebellion episodes lead to earth swallowing rebels, fire burning the wicked,
    threatened destruction, plague, scattering, and oppression.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:13
  confidence: high
  cautions: Different judgments are compressed into a liturgical historical recap.
- id: motif:6
  label: Intercessor standing in the breach to avert destruction
  taxonomy_refs:
  - divine_judgment
  basis: Moses stands before the LORD in the breach to turn away wrath so the people
    are not destroyed.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not provide the full speech or ritual form of the intercession.
- id: motif:7
  label: Idol substitution of divine glory
  taxonomy_refs: []
  basis: The people make a calf in Horeb, worship a molten image, and exchange their
