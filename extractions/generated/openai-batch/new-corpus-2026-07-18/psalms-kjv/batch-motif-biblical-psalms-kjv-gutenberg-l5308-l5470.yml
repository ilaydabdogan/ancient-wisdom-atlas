  evidence_refs:
  - ev:8
  confidence: high
  cautions: No supplied taxonomy family directly names idolatrous image substitution.
- id: motif:8
  label: Righteous intervention halting plague
  taxonomy_refs:
  - divine_judgment
  basis: Phinehas executes judgment and the plague is stayed, and this act is counted
