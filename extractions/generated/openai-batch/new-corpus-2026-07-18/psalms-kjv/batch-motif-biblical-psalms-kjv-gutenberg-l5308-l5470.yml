canonical_text:
  quote: ''
  summary: The passage recalls the LORD bringing his people out of Egypt, guiding
    and feeding them in the wilderness, opening rock-water, remembering the promise
    to Abraham, and giving land so they might keep divine law. It then praises the
    LORD, confesses ancestral sin, recounts Red Sea deliverance, repeated wilderness
    rebellion, punishments by earth, fire, plague, scattering, idolatry, child sacrifice,
    oppression by enemies, renewed deliverance, covenant remembrance, and a plea to
    save and gather the people from among the nations.
  language: English
  quote_policy: summarized
