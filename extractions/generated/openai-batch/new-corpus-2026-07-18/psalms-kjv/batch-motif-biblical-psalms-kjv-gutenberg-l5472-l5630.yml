  text: A refrain calls people to praise the LORD for goodness and wonderful works,
    and the LORD is said to satisfy the longing and hungry soul.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some sit in darkness and the shadow of death, bound in affliction and iron
    because they rebelled against God’s words; after they cry to the LORD, he brings
    them out and breaks their bands, gates of brass, and bars of iron.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Fools are afflicted because of transgression and iniquity, draw near to the
    gates of death, cry to the LORD, and are saved when he sends his word, heals them,
    and delivers them; they are told to offer sacrifices of thanksgiving.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Those who go down to the sea in ships see the LORD’s works in the deep; the
    LORD raises a stormy wind and waves, the sailors cry to him, he calms the storm,
    and he brings them to their desired haven.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The LORD turns rivers and watersprings into dry wilderness and fruitful land
    into barrenness because of wickedness, and also turns wilderness and dry ground
    into standing water and watersprings so the hungry may dwell, build a city, sow
    fields, and plant vineyards.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: People are reduced through oppression, affliction, and sorrow; the LORD pours
    contempt on princes and makes them wander in a pathless wilderness, while setting
    the poor on high and making their families like a flock.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The righteous see and rejoice, iniquity is silenced, and the wise who observe
    these things understand the LORD’s lovingkindness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A speaker declares a fixed heart, calls psaltery and harp to awake, promises
    praise among peoples and nations, and asks God to be exalted and to deliver the
    beloved with his right hand.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: God is said to have spoken in holiness; the speaker rejoices and names Shechem,
