- id: obs:2
  text: The redeemed are described as gathered from east, west, north, and south;
    they wander in wilderness without a city, become hungry and thirsty, cry to the
    LORD, and are led by him to a city of habitation.
  category: sequence
  evidence_refs:
  - ev:2
