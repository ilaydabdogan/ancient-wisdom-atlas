canonical_text:
  quote: ''
  summary: 'The passage ends Psalm 106 with blessing and begins Psalm 107 with thanksgiving
    to the LORD, recounting several groups in distress who cry to the LORD and are
    delivered: wanderers led to habitation, prisoners freed from darkness and bonds,
    afflicted people healed, and seafarers rescued from storm. It then describes divine
    reversals of land, water, social status, and fertility, followed by a wisdom conclusion.
    Psalm 108 opens with a speaker’s vow to praise God, a petition for the beloved’s
    deliverance, and a divine territorial speech naming Israelite and neighboring
    lands.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The LORD God of Israel is blessed from everlasting to everlasting, and the
    people are called to say Amen, praise the LORD, and give thanks because his mercy
    endures.
  category: speech
  evidence_refs:
