canonical_text:
  quote: ''
  summary: The passage moves from an inward exhortation to hope in God into a communal
    Psalm recalling ancestral deliverance, lamenting present defeat and humiliation
    despite covenant loyalty, and petitioning God to arise and redeem. It then presents
    a royal poem praising a mighty, righteous, anointed king, a queen or royal daughter
    and her procession into the palace, and future dynastic remembrance. The excerpt
    closes by naming God as refuge amid earth, mountain, sea, and water upheaval,
    and by describing a river that gladdens the city of God.
  language: English
  quote_policy: summarized
