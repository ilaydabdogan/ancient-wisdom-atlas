canonical_text:
  quote: ''
  summary: The passage concludes Psalm 78 with Israel brought to a sanctuary mountain,
    then judged for unfaithfulness, followed by the choice of Judah, Zion, and David.
    Psalm 79 laments the defilement of Jerusalem and asks God for mercy, deliverance,
    and recompense against enemies. Psalm 80 addresses God as Shepherd of Israel,
    asks for restoration, and uses the image of a vine brought from Egypt, planted,
    ravaged, and needing divine visitation.
  language: English
