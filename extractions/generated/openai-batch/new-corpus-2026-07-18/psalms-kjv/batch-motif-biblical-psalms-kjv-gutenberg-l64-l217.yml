canonical_text:
  quote: ''
  summary: The passage includes Psalms 1:1 through 6:1. It contrasts the righteous
    person who delights in the law of the LORD with the ungodly who perish; presents
    rebellious nations and rulers opposed to the LORD and his anointed king; declares
    the LORD’s enthronement of his king on Zion and the king’s sonship; and gives
    prayers for help, protection, righteous sacrifice, guidance, judgment on wicked
    enemies, joy, safety, and mercy from divine anger.
  language: English
  quote_policy: summarized
