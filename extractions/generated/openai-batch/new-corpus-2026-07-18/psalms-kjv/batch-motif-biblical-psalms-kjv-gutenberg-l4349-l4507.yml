canonical_text:
  quote: ''
  summary: The passage begins with a lament of affliction, divine terrors, surrounding
    waters, and social darkness. It then praises the LORD's mercy and faithfulness,
    recalls a covenant sworn to David and his seed, describes divine rule over sea,
    Rahab, heavens, earth, and mountains, and presents David as chosen, anointed,
    strengthened, and made firstborn. The covenant includes discipline for disobedient
    descendants but promises continuing mercy. The passage closes with a lament that
    the anointed king, crown, defenses, and throne have been cast down, followed by
    questions about divine hiding, fiery wrath, human mortality, the grave, and remembered
    promises to David.
