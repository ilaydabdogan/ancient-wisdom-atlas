canonical_text:
  quote: ''
  summary: Psalm 18 describes the LORD attacking enemies, exposing waters and world
    foundations, rescuing the speaker from many waters and strong foes, rewarding
    righteousness, strengthening the speaker for battle, subduing nations, and granting
    deliverance to the king, David, and his seed. Psalm 19 describes the heavens and
    sun declaring God’s glory, then praises the LORD’s law as wise, pure, valuable,
    sweet, and cleansing.
  language: English
  quote_policy: summarized
