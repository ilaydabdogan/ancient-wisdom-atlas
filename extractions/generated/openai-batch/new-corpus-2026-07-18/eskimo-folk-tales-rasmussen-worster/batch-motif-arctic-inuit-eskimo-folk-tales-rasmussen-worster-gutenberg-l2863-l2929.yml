canonical_text:
  quote: ''
  summary: In a famine caused by sea ice frozen far out from the coast, Ikardlituarssuk
    calls helping spirits, enters a crack between land and ice, and walks along the
    sea bottom. He reaches a narrow-entranced underwater house where the weeping mother
    of Tornarssuk sits by a lamp containing birds, with seals inside the house. After
    he encourages her by tickling her, she releases birds and seals and marks one
    fjord seal by plucking hairs from its back. The next morning the ice is gone;
    a female speaker gives hunting instructions limiting each person to one seal and
    claiming the marked young fjord seal. A hunter who kills two seals never catches
    seals again, while others continue to catch them. Ikardlituarssuk and his little
    brother receive the paddle reward.
  language: English
  quote_policy: summarized
