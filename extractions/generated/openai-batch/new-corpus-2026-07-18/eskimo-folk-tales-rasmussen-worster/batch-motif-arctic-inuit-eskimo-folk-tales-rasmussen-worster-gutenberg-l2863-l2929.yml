  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Inside the underwater house sits the mother of Tornarssuk, weeping by her
    lamp; the lamp contains many diving birds, and the house contains many seals.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ikardlituarssuk tickles the weeping woman to encourage her; afterward she
