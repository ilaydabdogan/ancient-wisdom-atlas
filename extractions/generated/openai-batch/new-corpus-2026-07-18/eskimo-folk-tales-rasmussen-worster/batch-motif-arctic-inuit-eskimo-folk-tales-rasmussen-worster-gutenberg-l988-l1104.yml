canonical_text:
  quote: ''
  summary: A woman later named as Tugto's wife is driven far out over the ice by a
    bear and a walrus, survives breaking ice, is taken in a narrow kayak by a man,
    refuses water after a warning, passes a dangerous dog and river-like house passage,
    fights and then cleans an old woman, receives birds and black seal through the
    movement of a lamp, carries home a taboo instruction about facing the sea when
    emptying dirty vessels, and says the ice will not break until her wounds heal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bear and a walrus repeatedly propel the woman outward over the ice until
    land is no longer visible.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After she heads back toward land, wind and breaking ice leave her without
    a clear way to save herself on an iceberg.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man in a very narrow kayak offers to take her and warns that refusal would
    prevent her from tasting the good things Qujavarssuk has paid her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: She enters the kayak in rough sea, must sit in the middle, is rowed near land,
    jumps ashore, and the kayak disappears in a great wave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: When she is thirsty and reaches water oozing through snow, a voice tells her
    not to drink it or she will not taste the good things Qujavarssuk has paid her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A great dog lies on top of a house; it appears threatening when she passes,
    but later wags its tail kindly at her.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:12
- id: obs:7
  text: The house passage contains a great river, and the only place to tread is narrow
    as the back of a knife.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: She crosses the passage carefully, using her little fingers as wings, and
    struggles over a high inner-door step.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Inside the house, an old woman abuses her, fights with her, grows tired, and
    is then cleaned by Tugto's wife, who arranges the old woman's dirty loose hair
    into a knot.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The old woman thanks her for the cleaning and asks her to move the lamp.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: When the lamp is moved, birds enter through the passage; when it is moved
    again, many black seal appear after first seeming like long-haired men flying
    toward the passage.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The old woman tells her to report that people must not face toward the sea
    when emptying dirty vessels, because it goes over the old woman.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Tugto's wife returns home at night with a scratched face and says the ice
    will not break until the sores are healed.
  category: speech
  evidence_refs:
  - ev:12
