canonical_text:
  quote: ''
  summary: A childless strong seal hunter at Ikerssuaq arranges for an old wizard
    to be with his wife and rewards him with seals. The strong man later strikes his
    wife with a sea serpent, retrieves a cormorant skeleton and a sunless lamp-stone
    at the wizard's direction, and the wife bears a son.
  language: English
