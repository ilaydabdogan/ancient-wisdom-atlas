canonical_text:
  quote: ''
  summary: In an earlier time of skilled kayak travel, Angusinanguaq of Kangarssuk
    is envied because of his beautiful wife. Other men abandon him on a remote island
    and tow away his kayak, but he returns first by wizard power, moving through the
    air after binding and bending his body with hide strips. Later, fierce island
    people are said to kill mainland kayakers by calling down fog. Angusinanguaq avenges
    his fellow villagers by attacking those islanders, killing many men and displaying
    their heads. The widows of dead hunters rejoice and thank him.
  language: English
  quote_policy: summarized
