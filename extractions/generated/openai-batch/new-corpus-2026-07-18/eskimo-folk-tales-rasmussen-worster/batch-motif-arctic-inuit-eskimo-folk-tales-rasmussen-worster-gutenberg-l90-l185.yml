canonical_text:
  quote: ''
  summary: The introduction describes Knud Rasmussen’s collection of Greenlandic Inuit
    stories from oral storytellers, the editor’s selection and editing of variants,
    and illustrations by native Eskimo artists. It characterizes the stories as presenting
    daily life, thought, cosmology, and a spirit world, and notes narrative patterns
    such as storytelling as an endurance contest, journey stories with expandable
    episodes, a search for a son, Atungait’s journey among unusual peoples, a world-circling
    legend, a deluge tradition linked to mussel shells inland, and a fairy-tale statement
    connecting tides with the Moon Man.
  language: English
  quote_policy: summarized
