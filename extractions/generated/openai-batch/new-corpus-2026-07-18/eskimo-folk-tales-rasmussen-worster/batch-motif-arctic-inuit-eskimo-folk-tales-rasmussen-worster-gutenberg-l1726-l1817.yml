canonical_text:
  quote: And so they led him out, and bore him away to the land of ghosts, and so
    Qalaganguase became a ghost.
  summary: A lame orphaned boy named Qalaganguase encounters ghosts while alone, is
    warned not to tell of them, loses returning strength after speaking, is later
    abandoned during a singing contest, and is taken by his dead parents to the land
    of ghosts, where he becomes a ghost and is said to become a woman.
  language: English
  quote_policy: quoted
