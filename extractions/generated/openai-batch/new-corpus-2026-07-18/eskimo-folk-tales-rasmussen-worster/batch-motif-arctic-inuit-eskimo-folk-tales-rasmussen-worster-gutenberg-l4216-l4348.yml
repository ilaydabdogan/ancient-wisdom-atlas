canonical_text:
  quote: ''
  summary: A homeless boy, Kagssagssuk, warns noisy children that the Great Fire will
    come. The warning is ignored, and the Great Fire enters with a live ribbon seal
    whip and destroys the children while Kagssagssuk survives by hiding on a drying
    frame. Adults disbelieve him and accuse him, then reproduce the noise; when the
    Great Fire returns, they pour boiling oil over its whip, causing it to leave.
    Thereafter Kagssagssuk is mistreated and forced outside. He survives on scraps
    and with limited help from one grandmother. Later he meets a giant, obtains meat
    through a dead-like request and help from spirits, and is trained by the giant
    to push and twirl increasingly large stones until he can spin the largest stones
    in the air.
  language: English
  quote_policy: summarized
