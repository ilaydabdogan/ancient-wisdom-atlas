canonical_text:
  quote: ''
  summary: A sledge party near Etah follows dogs to the entrance of an inland-dweller's
    house. The inland-dwellers hide in fear and push out an old woman, who dies at
    the sight of the dogs. The visitor apologizes, but the inland-dwellers dismiss
    the death because she was old. They later flee farther inland and leave only house
    remains and a narwhal tusk. The passage describes inland-dwellers as shy and very
    afraid of dogs, notes a coast woman who married an inland man, and describes an
    ordeal in which inland-dwellers train swift runners by enclosing them in a worm-filled
    ribbon-seal skin to drain their blood.
  language: English
  quote_policy: summarized
