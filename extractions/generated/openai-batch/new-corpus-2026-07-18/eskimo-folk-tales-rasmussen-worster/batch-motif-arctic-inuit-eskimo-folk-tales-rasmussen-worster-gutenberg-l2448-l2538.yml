canonical_text:
  quote: ''
  summary: The passage first describes an old dwarf or old man who repeatedly avoids
    places with dogs and uses a magic song to calm a rough sea, yet remains troubled
    by fear of dogs. It then tells of an abused pregnant wife who flees into the sea,
    lives at the bottom, bears a marine-featured son, and later accompanies him upward.
    The son, after strength training, frightens the occupants of an upper shore house
    to death and returns to the bottom of the sea; people from the lower shore house
    discover seaweed-filled tracks and the dead household.
  language: English
  quote_policy: summarized
