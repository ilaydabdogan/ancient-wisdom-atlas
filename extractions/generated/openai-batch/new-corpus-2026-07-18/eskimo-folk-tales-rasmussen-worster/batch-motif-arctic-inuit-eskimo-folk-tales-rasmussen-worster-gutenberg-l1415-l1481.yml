canonical_text:
  quote: ''
  summary: Kunigseq, a wizard, prepares for a spirit-assisted descent to the underworld.
    He passes downward through the floor, crosses an obstacle with help from a spirit,
    sees the underworld landscape and inhabitants, meets his mother and dead brother,
    is warned not to eat underworld berries if he wants to return, receives a request
    from underworld people for ice, and returns to earth. After his son dies, Kunigseq
    no longer wishes to live and dies after eating a guillemot and a raven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kunigseq is introduced as a wizard who intends to call helping spirits and
    make a flight down into the underworld.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the descent, he orders the floor washed with salt water so that an
    evil smell will not frighten his helping spirits away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After calling his helping spirits, Kunigseq remains bodily unmoving while
    he passes downward through the floor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the way downward he reaches a slippery reef covered with weed, and a helping
