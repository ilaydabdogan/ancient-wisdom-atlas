canonical_text:
  quote: ''
  summary: Qujavarssuk calls spirits, travels in spirit flight, and brings his wife
    home. In a harsh winter, he continues hunting seals through a small ice opening.
    Two old kinsmen visit and are fed; one is offended by the food and by Qujavarssuk's
    rule about eating from the correct side, and later vows to make a Tupilak against
    him. The ice opening shrinks until Qujavarssuk cannot catch a seal. He sends meat
    to Tugto and Tugto's wife to ask that one of them magic away the ice. Tugto's
    wife gathers listeners, puts out the lamp, calls helping spirits, sees two flames
    in the west that come as a bear and a walrus, and warns the listeners not to yawn
    or wink through the night.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Many people enter the house; Qujavarssuk calls spirits, raises himself up,
    and flies toward his wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Qujavarssuk passes through the roof, follows his wife when she tries to escape
    through the floor, reaches her in the earth, and takes her home; they live together
    until old age.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: During a very hard frost, the sea is frozen except for a small opening far
    out on the ice; Qujavarssuk carries his kayak there each day and usually catches
    two seals.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Poor people come over the ice from the south seeking food, and two old men
    who are Qujavarssuk's mother's kinsmen visit; his mother serves them seal meat
    and blubber, later giving them the breast part of a newly caught seal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When one old man takes a piece from the shoulder side, Qujavarssuk says he
    should not begin from the wrong side and says that eating from that side will
    make his seal-catching cease.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old men leave with as much meat as they can carry; one complains angrily
    about the welcome and says he will make a Tupilak for Qujavarssuk, while the other
    tries to dissuade him by pointing to the large gifts.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: As the cold strengthens, the ice opening becomes too small for a seal to surface
    without striking the kayak and ice; Qujavarssuk returns home without a catch for
    the first time in his hunting life.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Qujavarssuk sits behind his mother's lamp, is too troubled to eat, and asks
    his mother to take meat to Tugto and his wife so that one of them will magic away
    the ice.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Qujavarssuk's mother brings half a black seal's meat and half its blubber
    to Tugto and his wife; Tugto says that in hunger they cannot send away given meat
    and tells his wife to magic away the ice.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tugto's wife summons listeners, puts out the lamp, calls on helping spirits,
    announces two flames in the west, receives a bear and a walrus, is blown under
    the bedplace by the bear, and warns everyone not to yawn or wink through the night
    before she goes out.
  category: action
  evidence_refs:
  - ev:8
