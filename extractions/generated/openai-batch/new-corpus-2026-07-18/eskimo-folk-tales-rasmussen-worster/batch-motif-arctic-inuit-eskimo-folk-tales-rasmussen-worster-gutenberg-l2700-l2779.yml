canonical_text:
  quote: ''
  summary: Asaloq’s foster-brother disappears. Asaloq builds a large umiak with three
    skin layers and rows south with his wife, passing through sea-lice and sea-serpents
    that strip away two layers. They reach a settlement with a strong man, where Asaloq
    is summoned, challenged, fed, and tested by arm-pulling. He overcomes the men
    there, leaves by umiak, camps on a small island, and uses magic songs from a hilltop
    to make searchers give up. He and his wife continue south to Aluk, where their
    bones are said to rest.
  language: English
  quote_policy: summarized
