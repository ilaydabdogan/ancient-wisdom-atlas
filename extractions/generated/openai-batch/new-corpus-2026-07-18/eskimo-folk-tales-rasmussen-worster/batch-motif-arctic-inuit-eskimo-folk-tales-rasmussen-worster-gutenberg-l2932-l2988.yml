canonical_text:
  quote: ''
  summary: A sparrow mourns her lost husband. A raven proposes to her and is refused.
    The raven then seeks wives among wild geese preparing to migrate over water. Despite
    being warned that travelers must be able to swim or rest on the water, he follows
    them, becomes exhausted, sleeps on two geese, is dropped into the sea, drowns,
    and is transformed after death into little sea ravens.
  language: English
  quote_policy: summarized
