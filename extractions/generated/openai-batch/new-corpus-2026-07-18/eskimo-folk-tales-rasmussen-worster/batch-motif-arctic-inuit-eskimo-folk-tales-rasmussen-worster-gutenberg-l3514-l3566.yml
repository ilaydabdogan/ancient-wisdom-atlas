canonical_text:
  quote: ''
  summary: A man owns a giant dog able to swim in the sea, haul whale and narwhal,
    and carry the man and his wife. The man controls it with thongs through its jaws
    and gives it an amulet intended for a son he never had, making it resistant to
    death. The dog eats a man, forcing relocation, and the owner repeatedly tries
    to protect a kayak stranger from it. A challenger arrives with three bear-sized
    dogs to kill the giant dog, but the giant dog kills them. The giant dog later
    attacks inland-dwellers and brings back their legs, explaining why inland-dwellers
    fear dogs; the passage adds that inland-dwellers themselves carry off people lost
    in fog.
  language: English
  quote_policy: summarized
