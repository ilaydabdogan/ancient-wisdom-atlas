canonical_text:
  quote: ''
  summary: Atungait seeks a strong woman as a sledge-travel companion, selects one
    from a football-playing people after she softens a thick seal skin, and travels
    with her through strange lands. They ascend a steep rock, encounter unusual peoples,
    steal a copper ajangat, and escape magically animated rocks with a dragged piece
    of sole-leather. Atungait then flies home as a wizard, finds his wife with another
    man, kills her after she denies kissing him, spares the man who admits it, and
    returns to make the strong woman his wife.
  language: English
  quote_policy: summarized
