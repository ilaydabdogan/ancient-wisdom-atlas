canonical_text:
  quote: ''
  summary: Neruvkaq cruelly wounds his wife Navarana, an inland-dweller with many
    brothers. She flees to them; they attack Neruvkaq's house, but one brother is
    maimed and dies. Neruvkaq protects himself with a walrus-tusk-covered tunic, uses
    his dog as a decoy, leaps to a meat stone leaving footprints, and shoots the attackers
    with walrus-tusk-barbed arrows while his mother strengthens him by magic. The
    surviving enemies flee. Navarana hides under a bench from fear, refuses to come
    out despite his promise not to hurt her, and dies there.
  language: English
  quote_policy: summarized
