canonical_text:
  quote: ''
  summary: Two parentless boys who hunt ptarmigan find a hidden house in a ravine,
    keep company with a solitary child, and are fed and paid with meat by the child’s
    mother in exchange for arrows. The mother warns them not to let others come selling
    arrows. Villagers ignore the warning, make arrows, and compel the boys to return;
    the house and the woman have vanished, and the boys no longer hunt ptarmigan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two little boys have no father or mother, hunt ptarmigan every day, and possess
    only a bow as a weapon.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men of the place are eager to take the boys’ ptarmigan catch.
  category: relationship
  evidence_refs:
