  text: The child sees his mother coming from the south; she appears very large and
    carries something on her back.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The woman throws down her burden, enters hot and tired, thanks the boys for
    staying with her son, and gives them dried fox meat, dried reindeer meat, and
    suet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The little boy asks for one of the boys’ sets of arrows through his mother,
    and the boys give it to him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The woman gives the boys a place to sleep, tells them not to fear evil, and
    later pays for the arrows with as much meat as they can carry.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The woman warns the boys not to let any others come selling arrows.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the boys return to the village, they say they have been in a house with
    one who was not a real man.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The villagers taste the food, want to sell arrows too, ignore the boys’ warning,
    make arrows, and order the reluctant boys to go with them.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: When the group reaches the ravine again, the house, sheds, and woman are gone,
    and the boys never again go hunting ptarmigan.
  category: sequence
  evidence_refs:
  - ev:10
