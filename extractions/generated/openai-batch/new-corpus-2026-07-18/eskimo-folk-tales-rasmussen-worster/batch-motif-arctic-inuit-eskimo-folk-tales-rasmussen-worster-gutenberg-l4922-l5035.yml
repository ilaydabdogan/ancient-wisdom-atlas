- id: obs:3
  text: On a day with no ptarmigan, the boys reach wild cliffs, look into a ravine,
    and find that something stone-like is a little house.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Through the roof air hole, the boys see a little boy playing at being a man
    in a kayak, using a cutting-board and a stick.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The child in the house hides and says his mother went out early and is away
    as usual; the two boys say they came to be with him because he is alone.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The inside of the house is covered with blue and white fox skins.
  category: object
  evidence_refs:
  - ev:4
