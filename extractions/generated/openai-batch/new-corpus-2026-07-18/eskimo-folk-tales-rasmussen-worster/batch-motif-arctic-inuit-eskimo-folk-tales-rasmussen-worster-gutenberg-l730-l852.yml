canonical_text:
  quote: ''
  summary: A child is named Qujavarssuk after a dead man from Amerdloq. He grows,
    receives a kayak and hunting equipment, and proves successful at seal hunting;
    seals appearing at his kayak trial are identified as a sign that he will become
    a strong man and chief. Hungry people later visit his place after hearing he never
    suffers want. Tugto and his wife, both wizards, quarrel; the wife leaves for the
    hills and Tugto cannot bring her back. Tugto sees a black seal with a red fish,
    prepares many bird feathers, fishes through deep ice water for a huge sea perch,
    and on his return experiences pursuing ice-noise, fainting, and increased wizard
    power. He encounters enormous bird-skin-covered monsters, tears the covering of
    one after recalling that this can give a wizard power to vanish into the ground,
    and returns home with heightened perception, calling the people to hear him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old one gives the child the name Qujavarssuk after one who died of hunger
    in the north at Amerdloq.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Qujavarssuk is grown enough, the strong man asks the old one to make
    a kayak for him, and the old one does so.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the kayak trial, little seals and others rise from the water; the passage
    calls this a sign that Qujavarssuk will be a strong man and chief.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old one makes hunting things, and the strong one rows out with Qujavarssuk
    to hunt seals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Qujavarssuk rows at a flock of black seals, throws his harpoon, strikes, and
    thereafter makes a catch each time he goes out in his kayak.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: People from a southern wintering place hear during a time of hunger that Qujavarssuk
    is a strong man who never suffers want, and they come to visit his place.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tugto and his wife are both described as great wizards; after they quarrel,
    the wife runs away to live alone in the hills, and Tugto cannot bring her back
    because she is the greater wizard.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: While hunting seal at Ikerssuaq, Tugto sees a big black seal rise from the
    bottom with a red fish in its mouth and takes bearings by the cliffs where it
    goes down.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After seeing the black seal, Tugto gathers bird wings and fastens pinion feathers
    together until the load is difficult for him to carry.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the ice is firm, Tugto travels to the fishing water, cuts a large hole
    in the ice, lets down a line whose weight reaches bottom only after the sun has
    crossed half the day, and catches a mighty sea perch.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: As Tugto crosses a lake with the fish, the ice makes a noise that seems to
    follow him; he runs, faints, wakes later, finds no break in the ice, and feels
    that he has become a much greater wizard.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Tugto sees enormous monsters covered with bird-skins, turns away from them,
    and then remembers that a wizard can gain power to vanish, even into the ground,
    by pulling apart such a monster's skin.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Tugto throws away his burden, wrestles with one monster, tears its covering
    to pieces, takes up his burden again, and goes homeward.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the monster encounter, Tugto feels he has become a great wizard and
    sees the door openings of all the villages in the countryside close together.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: When Tugto comes home, he causes words to be said calling the people to come
    and hear.
  category: speech
  evidence_refs:
  - ev:9
