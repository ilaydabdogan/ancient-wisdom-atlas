canonical_text:
  quote: ''
  summary: Qasiagssaq is introduced as a habitual liar and unsuccessful hunter. He
    steals another hunter’s black seal and tow-line, presents the seal as his own
    catch, and is exposed when the owner reports the missing seal and asks for the
    tow-line. Later, Qasiagssaq injures his own knees, damages his kayak, and stages
    an iceberg accident; witnesses reveal what they saw. After healing, he begins
    another staged hunting episode using a long stone, harpoon line, and bladder floats
    while other kayakers watch.
  language: English
  quote_policy: summarized
