canonical_text:
  quote: ''
  summary: Two men, Talilarssuaq and Navssarssuaq, exchange wives. Talilarssuaq frightens
    Navssarssuaq's wife by thrusting a knife through bench skins. She tells Navssarssuaq
    to kill him. Navssarssuaq stabs Talilarssuaq, disposes of the body on a rubbish
    heap, and spares his own wife because their youngest son Pualuna still needs her.
    Later Navssarssuaq is haunted by an avenging spirit, but a sickness kills him
    before the spirit can tear him apart.
  language: English
  quote_policy: summarized
