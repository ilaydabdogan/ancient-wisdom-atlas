canonical_text:
  quote: ''
  summary: Two sisters, angered by their father's scolding, run away to a high mountain
    with a few skins and a fire stone. They refuse to return, die of hunger, become
    evil spirits and thunder, and cause gales, heavenly fire, and rain through their
    objects and tears. As spirits they return among people, kill or frighten many,
    spare one woman with a child to report their terror, and are later warded off
    by a red dog whose blood is led around a house to prevent fire.
  language: English
  quote_policy: summarized
