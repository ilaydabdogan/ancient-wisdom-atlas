  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: When Isigaligarssik answers the wizard by mentioning that the wizard took
    his wife, the wizard stabs him with a knife as he tries to leave.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Isigaligarssik tells his wife's mother to fetch a small childhood dress from
    a chest and dip it in a water bucket; when the wet garment's lower lacing touches
    the wound, the wound is healed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The house-fellows follow a blood spoor expecting to find Isigaligarssik dead,
    but find him in the house with no wound.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Isigaligarssik takes a very small bow from his little chest and challenges
    the wizard to shoot with bows near a little river.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: During the bow contest, the house-fellows tell Isigaligarssik to make himself
    small; he becomes so small that only his head can be seen moving, and the wizard
    misses twice.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: After the wizard misses, Isigaligarssik breaks the arrow, tells the wizard
