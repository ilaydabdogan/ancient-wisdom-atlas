canonical_text:
  quote: ''
  summary: Isigaligarssik, a strong unmarried man, marries a widow's daughter. A wizard
    takes the wife during a spirit-calling gathering, mocks Isigaligarssik, and later
    stabs him. Isigaligarssik heals the wound with a small childhood garment dipped
    in water, challenges the wizard to a bow contest, avoids the wizard's arrows by
    making himself very small, kills the wizard with a tiny arrow, and regains his
    wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Isigaligarssik is introduced as a wifeless and very strong man, and another
    man in his village is identified as a wizard.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Isigaligarssik lives in a house with many brothers or house-fellows who are
    fond of him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the wizard calls upon his spirits, only married men are invited to hear;
    Isigaligarssik, a little widow, and her daughter remain behind in the house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The widow's daughter wants Isigaligarssik, and the two become man and wife
    before the others return.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the next spirit-calling, the wizard summons Isigaligarssik's wife, has
