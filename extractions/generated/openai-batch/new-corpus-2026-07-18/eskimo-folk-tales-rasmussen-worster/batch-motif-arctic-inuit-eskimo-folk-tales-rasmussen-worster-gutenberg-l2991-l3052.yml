canonical_text:
  quote: ''
  summary: A man takes a vixen as wife; she becomes a woman, travels with him, is
    exchanged with another man's hare-wife, is scorned, and flees to the hills. The
    husband finds her with a worm in human form, revealed as the soul of a worm he
    once burned; he defeats the worm in wrestling and leaves. He later visits small
    shore-dwelling dwarfs, makes himself small to enter their stone-roofed house,
    eats food they identify as walrus but which is an eider duck wing, and returns
    home.
  language: English
  quote_policy: summarized
