  text: The vixen-wife wanted to journey and see other people, so she and the man
    moved and settled elsewhere.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the new place another man had taken a little hare as wife, and the two
    men exchanged wives.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man who borrowed the vixen-wife came to scorn her because of her fox-like
    smell and taste.
  category: attribute
  evidence_refs:
