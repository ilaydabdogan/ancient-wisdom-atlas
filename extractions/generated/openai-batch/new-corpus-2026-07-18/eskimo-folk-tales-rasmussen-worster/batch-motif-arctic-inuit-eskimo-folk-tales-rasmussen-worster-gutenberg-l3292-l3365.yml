canonical_text:
  quote: ''
  summary: A man travels along the coast searching for his missing son. On the journey
    he survives several encounters with giants, man-eaters, speaking beings, and an
    old woman who tries to trap him. He calls killer whale helping spirits to destroy
    one giant, avoids other traps, discovers that a stranger has eaten his son, kills
    that man-eater, and returns home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man goes along the coasts searching for his son, who had gone out in a kayak
    and not returned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man sees a giant beside a great glacier and enters the giant's house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first giant has a drum whose skin was taken from the belly of a man, and
    the giant violently desires to eat the visitor.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Great salmon drop through a hole in the roof, the visitor is frightened, and
    he cannot get out of the place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man calls on killer whales as helping spirits; they appear, crush the
    house, and kill the giant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A second big man is described as eating men and throwing their kayaks into
    a ravine; when he tries to push the traveler into the ravine, the traveler throws
    him down instead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A seal bone calls to the traveler and asks him to remove moss that has stopped
    up its hole; he does so.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A mussel at the bottom of the sea calls the traveler to row down through the
    water, but the mussel wants to eat him and he does not heed it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: An old woman offers to dry the traveler’s boots, hangs them too high for him
    to reach, and is revealed as a man-eater.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The old woman's spoken wish to catch and cut him nearly upsets his kayak;
    his spoken wish to send a bird dart through her is followed by her falling on
    her back and breaking her knife.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A stranger shows the traveler a stretched skin; the traveler recognizes it
    as his son's kayak and understands that the stranger has eaten his son.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The traveler tramples the final man-eater to death and then goes home.
  category: action
  evidence_refs:
  - ev:9
