canonical_text:
  quote: ''
  summary: A southern man hears of a talking guillemot in the north and travels by
    boat to find it. With a local guide he reaches a large bird cliff and the guillemot's
    nest. The bird emerges, looks down, and speaks about the southern man who has
    come to hear it. The southern man dies of fright. The guide covers the body below
    the nest, later helps a crew of women travel south by catching fish, and is kept
    there as a husband; his skeleton is said to remain in the south.
  language: English
  quote_policy: summarized
