  quote: It is said that the great Imarasugssuaq was wont to eat his wives.
  summary: Imarasugssuaq fattens and tries to kill his wife Misana, who survives by
    licking snow, deceives him with a clothing dummy, transforms into a piece of wood
    by means of her amulet, escapes to her brothers, and later sees him die while
    her brothers hold him.
