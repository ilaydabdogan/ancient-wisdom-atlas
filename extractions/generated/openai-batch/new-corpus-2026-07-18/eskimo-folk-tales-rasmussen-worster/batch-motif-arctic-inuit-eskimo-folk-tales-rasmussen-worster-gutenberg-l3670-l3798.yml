candidate_motifs:
- id: motif:1
  label: unwoundable figure protected during attack
  taxonomy_refs: []
  basis: Avovang is said to be unwoundable; during an attack he stands on a childhood
    dog-neck skin and weapons fail to wound him.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The passage does not explicitly explain why the dog-neck skin provides
    protection.
- id: motif:2
  label: transformation to evade execution
  taxonomy_refs:
  - shapeshifter
  basis: When enemies try to cast Avovang from a cliff, he changes into another man
    who is not their enemy.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This episode involves change into another human identity rather than into
    an animal.
- id: motif:3
  label: murdered soul returns in animal forms to destroy enemies
  taxonomy_refs:
  - shapeshifter
  - death_rebirth
  basis: After being sent into the sea, Avovang's soul appears as a seal and then
    a fox, causing the deaths of those who attacked him.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage identifies the transforming agent as Avovang's soul, not a
    restored human body.
- id: motif:4
  label: life in all animal bodies to know their ways
  taxonomy_refs:
  - shapeshifter
  - wisdom
  basis: Avovang decides to be born in the shape of every beast to tell fellow humans
    about their lives, then lives successively as dog, reindeer, wolf, walrus, raven,
    and seal.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:14
  - ev:15
  - ev:16
  - ev:17
  confidence: high
  cautions: The tale says he lives as every beast, but the passage only narrates selected
    animal lives.
- id: motif:5
  label: animal companions teach animal skills and food
  taxonomy_refs:
  - wisdom
  - initiation
  basis: Reindeer, wolves, and walruses instruct Avovang how to move and what to eat
    in their respective forms.
  evidence_refs:
  - ev:11
  - ev:14
  - ev:15
  confidence: medium
  cautions: The passage presents practical instruction; any broader initiation reading
    should remain tentative.
- id: motif:6
  label: escape from killed animal body into new animal form
  taxonomy_refs:
  - death_rebirth
  - shapeshifter
  basis: After Avovang is killed as a reindeer and his meat is stored, he escapes
    when people eat him and crack the bones, then changes into a wolf.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: The exact mechanism of escape from the body or bones is not explained.
- id: motif:7
  label: wizard hides in a minute bodily place
  taxonomy_refs: []
  basis: As a great wizard in seal form, Avovang can hide under the nail of a man's
    big toe.
  evidence_refs:
  - ev:17
  confidence: medium
  cautions: The passage gives the ability briefly and without an episode showing its
    use.
comparison_claims:
- id: claim:1
  claim: The passage fits the supplied shapeshifter motif family at a taxonomy level,
    because Avovang changes into another man and into multiple animals, including
    seal, fox, dog, reindeer, wolf, walrus, raven, and seal again.
  claim_level: same_motif
  target: shapeshifter motif family
  evidence_refs:
  - ev:4
  - ev:9
  - ev:10
  - ev:11
  - ev:13
  - ev:14
  - ev:15
  - ev:16
  - ev:17
  counter_evidence_refs: []
  confidence: high
  limitations: This is only a motif-family classification; it does not imply historical
    contact or a specific external parallel.
- id: claim:2
  claim: The reindeer-to-wolf episode is comparable in function to a death-and-renewal
    pattern, since Avovang is killed in an animal body, remains as meat and bones,
    then escapes and assumes a new animal form.
  claim_level: same_function
  target: death_rebirth motif family
  evidence_refs:
  - ev:12
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not describe resurrection of Avovang's human body,
    and the transformation is framed as the action of his soul.
- id: claim:3
  claim: The stated purpose of becoming all beasts can be compared cautiously to a
    wisdom motif pattern, because Avovang seeks experiential knowledge of animal lives
    in order to tell fellow humans about them.
  claim_level: same_function
  target: wisdom motif family
  evidence_refs:
  - ev:9
  - ev:11
  - ev:14
  - ev:15
  - ev:16
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states the intended transmission of knowledge but does
    not narrate Avovang actually returning to teach humans.
