canonical_text:
  quote: ''
  summary: Avovang is described as unwoundable. After surviving an attack through
    a childhood dog-neck skin and by changing into another man, he is later killed
    by companions who desire his southern wife. His soul becomes a seal and a fox
    to bring about the death of those enemies, then chooses to be born in the bodies
    of beasts. He lives as dog, reindeer, wolf, walrus, raven, and seal, learning
    the ways of these animals and finally hiding magically under a man's big toenail.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Avovang is named as a man living at Kangerdlugssuaq and is said to be unable
    to be wounded.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Avovang's brother receives a warning from a man arriving by sledge that many
    sledges will come to kill Avovang, then tells Avovang and hides on a rocky slope.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When men attack Avovang, he places on the ground a piece of dog-neck skin
    used to wrap him in childhood, stands on it, and their weapons do not wound him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When enemies try to throw Avovang from a high cliff, he changes into another
    man who is not their enemy, and they leave without killing him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Avovang travels south with many sledges to buy wood and takes a wife from
    among the southern people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: While returning from the south, men desire Avovang's wife and try to kill
    him; Qautaq stabs him in the eyes and others send him through a seal breathing
    hole into the sea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Avovang's wife becomes angry at being made a widow, breaks the wood brought
    from the south into small pieces, and goes home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A great seal appears ahead of the sledges on thin slippery ice; many sledges
    fall through and people drown.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A fox later appears in the way of the travelers; in chasing it up a mountain
    of screw-ice, the pursuers are dashed down and killed, with only two men escaping
    to tell what happened.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The narrator identifies the seal and fox as Avovang's soul, which had changed
    forms to cause his enemies' deaths.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Avovang decides to be born in the shape of every beast on earth so that he
    can tell fellow humans the manner of their life.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: As a dog, Avovang lives on meat stolen from houses and on discarded food.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Avovang tires of being a dog because of beatings, becomes a reindeer, and
    learns from other reindeer how to gallop and what to eat.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: As a reindeer, Avovang is killed by a man in a kayak after the herd flees
    from a wolf into the sea.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: Avovang's reindeer body is cut up and stored in a stone cairn; when people
    later eat him and crack the bones for marrow, he escapes and changes into a wolf.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:16
  text: As a wolf, Avovang first cannot keep up with his comrades, then learns from
    them how to run and overtake reindeer.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:17
  text: As a walrus, Avovang first cannot dive to the bottom, then learns from other
    walruses how to dive and what to eat.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:18
  text: Avovang is once a raven and says ravens never lack food but often have cold
    feet.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:19
  text: After living the life of every beast on earth, Avovang becomes a seal again,
    watches men under the ice, and as a great wizard can hide under the nail of a
    man's big toe.
  category: sequence
  evidence_refs:
  - ev:17
