canonical_text:
  quote: ''
  summary: After a giant acknowledges Kagssagssuk as a strong man and promises to
    send three bears to his village, Kagssagssuk returns home and is still treated
    abusively. He secretly demonstrates his strength by freeing a frozen umiak, then
    openly kills three bears bare-handed. He punishes those who mistreated him, spares
    one grandmother who had helped him, humiliates Umerdlugtoq without killing him,
    and later leaves for the south. In a later episode, his strength turns destructive
    when he crushes children, and his fellow-villagers kill him with harpoons while
    he is in his kayak.
  language: English
  quote_policy: summarized
