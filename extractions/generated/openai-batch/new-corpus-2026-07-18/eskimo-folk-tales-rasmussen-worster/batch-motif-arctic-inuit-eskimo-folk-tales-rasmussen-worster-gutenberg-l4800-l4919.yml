canonical_text:
  quote: ''
  summary: Two sisters refuse ordinary husbands and are taken by an eagle and a whale
    after their brothers name those beings as possible spouses. Each sister lives
    with her nonhuman husband and seeks escape. The eagle’s wife lowers herself down
    a cliff to her brothers, who kill the eagle with arrows after a small homeless
    boy makes the first successful shot. The whale’s wife tricks the whale by tying
    his tethering string to a stone, flees with her brothers in a fast umiak, and
    delays the pursuing whale by throwing out personal garments until the boat reaches
    land and the whale is cast ashore as a bleached bone.
  language: English
  quote_policy: summarized
