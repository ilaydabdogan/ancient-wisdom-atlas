canonical_text:
  quote: ''
  summary: Patussorssuaq, desiring his uncle Alataq's wife, kills Alataq when Alataq
    plans to leave on a hunting journey with her. Patussorssuaq's own wife flees to
    her parents. He takes Alataq's wife, who soon dies. Later Alataq's soul or ghost
    appears in animal forms, first as a fox connected with Alataq's amulet and then
    as a bear, and Patussorssuaq is killed and torn apart. The passage ends with a
    statement that punishment falls on the killer.
  language: English
  quote_policy: summarized
