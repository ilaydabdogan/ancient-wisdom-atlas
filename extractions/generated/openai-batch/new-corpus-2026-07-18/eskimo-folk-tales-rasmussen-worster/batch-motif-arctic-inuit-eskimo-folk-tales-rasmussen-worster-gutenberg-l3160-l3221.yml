canonical_text:
  quote: ''
  summary: A Mountain Spirit steals and eats corpses. A man lets himself be buried
    alive to discover the thief, is carried to the Spirit’s house, kills the Spirit
    and its children, and flees. The Spirit’s wife pursues him. He raises hills and
    makes a stream overflow to slow her, then tricks her; when she bends to look at
    her tunic, her belly bursts and steam from her becomes the fog that remains among
    the hills.
  language: English
  quote_policy: summarized
