canonical_text:
  quote: ''
  summary: Atarssuaq, a man with many enemies, has a son whom he trains from infancy
    by repeated immersion in water and later equips with a dried fjord-seal skin for
    swimming. After enemies kill Atarssuaq and come in many kayaks to kill the household,
    the son puts on his swimming dress, lures the kayakers out to sea, climbs an iceberg,
    kills climbers by dropping ice on them, drowns others by overturning and holding
    down their kayaks, spares one poorly armed man, and sends him home with a warning;
    after this no enemies return.
  language: English
  quote_policy: summarized
