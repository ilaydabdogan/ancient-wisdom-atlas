canonical_text:
  quote: ''
  summary: Angangujuk vanishes while playing near the entrance as his mother works.
    His father threatens the mother, seeks ritual specialists, and finally uses a
    finder of hidden things who learns that the child is with inland folk between
    cliffs. The father and companions travel east, find the child in an inland house,
    put the inhabitants to sleep by magic, recover the child and his clothes, escape
    by umiak to distant islands, and thereafter avoid living on the mainland.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Angangujuk lives with his father and mother without other neighbours; his
    father is described as very strong.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: While the mother scrapes meat from a skin, Angangujuk plays at kayak outside
    in the passage near the entrance and answers when called.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a later call, Angangujuk gives no answer; the mother searches but cannot
    find him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The father returns from behind a rock dragging a seal and asks where his son
    is.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The mother says the child vanished while playing kayak-man, and the father
    accuses her of killing him and threatens to kill her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mother asks the father to wait and first find someone who can ask counsel
    of the spirits.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The father brings wizards, but when they cannot find the child he sends them
    away without meat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The father obtains a clever finder of hidden things, fastens a stick to his
    face, makes him lie on his back, and works with him until a spirit comes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The spirit finder says the child is up in a place between two great cliffs
    and is being looked after by two old inland folk.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The search party travels east, sees many houses with smoke or heat coming
    from smoke holes, and the father looks through a window.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Inside the house, people are quarrelling over who will look after the child,
    and the child is crying.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The people ask the child what he wants to eat and offer seal meat; he refuses
    and says he wants to go home.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: At the father’s request, a wizard calls down magic sleep on the people in
    the hut until they fall asleep one by one.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The finder of hidden things calls sleep over the last remaining awake person
    until that person also lies down.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: The father enters, takes up his son, and recovers the child’s clothes from
    a high drying frame by poking them down with poles.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: The rescuers cut the umiak’s moorings, prepare quickly, and row out to the
    farthest islands.
  category: action
  evidence_refs:
  - ev:14
- id: obs:17
  text: After the inland folk see the escape, they beat down the house; afterward
    Angangujuk’s parents never live on the mainland again.
  category: sequence
  evidence_refs:
  - ev:15
