canonical_text:
  quote: ''
  summary: Kanagssuaq lives on a small island with his wife and her brothers. During
    severe cold and hunger, he repeatedly goes out hunting seals and brings food home.
    He encounters Kiliteraq, a great hunter from another place, shares seal belly
    skin and blubber with him, and later helps him fasten a tow-line to a seal after
    waves prevent Kiliteraq from doing so. When fine weather and spring return, Kiliteraq
    comes during a guillemot hunt and gives Kanagssuaq a decorated walrus-hide tow-line
    and a bearskin kayak seat in thanks for the earlier help.
  language: English
  quote_policy: summarized
