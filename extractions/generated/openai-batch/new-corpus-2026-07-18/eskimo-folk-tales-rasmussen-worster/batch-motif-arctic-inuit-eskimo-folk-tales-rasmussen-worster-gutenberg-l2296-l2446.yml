  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: An old hag tries to ingratiate herself with the guest, but he whistles loudly
    and frightens her away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Other dwarfs invite the guest to eat foxes' liver; they cannot cut it easily,
    while he crunches it as if it were fresh meat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Young women adorn their hair with mussel shells, but the guest chooses the
    old dwarf man's daughter and says he will take her as wife.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The man and dwarf daughter live together happily and have a child.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The man longs for his mother and kin and announces a visit home; the dwarf
    family decides to go with him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The man's people are astonished to find him alive, and the dwarf people live
    among the real men for a while without fear.
  category: relationship
  evidence_refs:
  - ev:11
