canonical_text:
  quote: ''
  summary: A kayaker meets a frightened dwarf hunter, kills a small fjord seal for
    him, and visits the dwarf household. Among the dwarfs, the human guest appears
    enormously strong and capable. He marries the dwarf man's beautiful strong daughter
    and has a child. Later he returns with the dwarf family to his own people, where
    a dog eats the child; the horrified dwarf folk gather their belongings and leave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man in a kayak approaches another kayak and finds that its occupant is a
    very little man, identified as a dwarf, who is afraid of him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dwarf says he cannot hit a little fjord seal; the human man harpoons the
    seal and fastens a tow-line to it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dwarf invites the man to visit and describes having a wife and a beautiful,
    very strong daughter whom many men have wanted.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The two kayaks enter a great deep fjord and land at the dwarf man's house,
    where the household tries to please the visitor.
  category: setting
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The guest permits the seal to be cut up and shared with those who want to
    eat it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Two women and the old dwarf man cannot drag the seal from the shore; the guest
    carries it up by one flipper with one hand.
  category: action
  evidence_refs:
  - ev:5
