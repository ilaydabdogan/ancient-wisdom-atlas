canonical_text:
  quote: ''
  summary: A man-eating woman with an iron tail kills sleeping guests by dropping
    onto them. A visiting man stays awake, moves aside, and causes her to break her
    tail on a stone. She pursues him to his kayak; both utter hostile wishes whose
    words have power. His utterance makes her fall, and he rows away. With her tail
    broken, she kills no one afterward.
