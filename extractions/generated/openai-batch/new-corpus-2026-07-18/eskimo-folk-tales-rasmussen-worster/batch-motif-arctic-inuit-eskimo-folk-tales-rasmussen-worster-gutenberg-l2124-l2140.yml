canonical_text:
  quote: "“Do not wake until the fulmar begins to cry.”"
  summary: A wifeless man asks his wife to comb his hair. She speaks words over him
    telling him to sleep until the fulmar cries and young birds are heard. He falls
    asleep and later wakes alone in summer, though it had been winter when he entered
    through a crack. His kayak skin has rotted with age, and the narrator supposes
    he returns home and sits at ease.
