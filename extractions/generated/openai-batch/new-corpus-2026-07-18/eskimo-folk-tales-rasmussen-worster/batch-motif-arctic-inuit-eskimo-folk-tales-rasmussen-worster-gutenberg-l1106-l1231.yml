canonical_text:
  quote: ''
  summary: After a storm opens the sea and brings birds and black seals, Tugto's wife
    forbids hunting for five days and requires the first catches to be given to Tugto's
    house. Later an old man animates a Tupilak and sends it to eat Qujavarssuk. Qujavarssuk
    repeatedly vanishes from the Tupilak's sight and returns with seal. The Tupilak
    is thwarted by a changed shore, a falling stone, and a black bird near the house,
    then returns and eats its maker. Ashamed, it swims into the open sea and is never
    seen again. The passage ends with an old one telling Qujavarssuk that he is named
    after a man who died of hunger at Amerdloq.
  language: English
  quote_policy: summarized
