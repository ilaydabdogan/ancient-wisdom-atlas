- id: obs:3
  text: Tungujuluk teaches his son to paddle a kayak, after which Saunikoq becomes
    jealous and begins planning evil.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Saunikoq goes hunting, calls for his bearskin on an island, gets into it,
    and moves toward Tungujuluk's house intending to kill Tungujuluk's son.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tungujuluk is at home making a kayak for his son; the boy comes home weeping,
    and Tungujuluk sees a big bear close to them and runs toward it with a knife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bear laughs; Tungujuluk remembers that Saunikoq can take bear shape and
    restrains himself from stabbing him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After many days, Tungujuluk goes by kayak to an island, calls his other shape,
    crawls into it, becomes a walrus, and goes to the place where kayaks hunt seal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Saunikoq harpoons the walrus; Tungujuluk makes himself small inside the skin,
    swims away with the bladder float, deflates it, returns to land near his kayak,
    and removes the harpoon point.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tungujuluk kills a black seal, asks his wife to cook the breast piece, and
    makes a meat feast after the other kayaks come home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the feast Saunikoq says he struck a walrus and lost his bladder float;
    Tungujuluk places the bladder and line beside the meat dish and says he has paid
    Saunikoq back for coming in bear shape and mocking them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Those sitting there laugh greatly; Saunikoq gets up, leaves, rows northward
    in his umiak the next morning, and is not seen again; the passage says he felt
    great shame.
  category: sequence
  evidence_refs:
  - ev:9
