canonical_text:
  quote: ''
  summary: Tungujuluk and Saunikoq are wizard neighbors who can assume animal forms.
    Saunikoq, jealous because Tungujuluk has a son, takes bear form and approaches
    to kill the child but is recognized. Later Tungujuluk takes walrus form, lets
    Saunikoq harpoon him, carries off Saunikoq's bladder float and line, and publicly
    reveals the trick at a feast. Saunikoq is shamed and leaves northward, never to
    be seen again.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tungujuluk and Saunikoq are described as men from one village and as wizards;
    one changes into a bear and the other into a walrus when they hear a spirit calling.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tungujuluk has a son, while Saunikoq has no children.
  category: relationship
  evidence_refs:
