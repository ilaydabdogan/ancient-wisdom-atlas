canonical_text:
  quote: ''
  summary: Qujavarssuk harpoons a whale. Other hunters expect it to swim out to sea,
    but he says animals he strikes move inward toward his house. The whale appears
    near shore and is towed. Qujavarssuk forbids anyone to eat until his mother has
    eaten first. A strong man tries to eat anyway and suffers injury to his mouth.
    After Qujavarssuk's mother eats, the others eat safely. The strong man does not
    catch a whale until after Qujavarssuk catches another. Qujavarssuk later returns
    south to his home and dies there.
  language: English
  quote_policy: summarized
