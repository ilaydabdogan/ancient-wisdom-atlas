canonical_text:
  quote: ''
  summary: An extremely obstinate man forces his mourning wife to sew his kayak skin
    despite a work restriction. A monster dog rises from the sea and attacks him;
    he kills it. The Moon Man, owner of the dog, fights him and warns that if he is
    killed there will be no tides, seal breeding, or daylight. The man releases him.
    The Moon Man revives the dog, makes an airborne dog team, and allows the man to
    visit the Moon, warning him to avoid the sunny side of a rock. The man prepares
    his own dogs for flight, disobeys the warning, meets a woman singing and sharpening
    a knife, loses his heart, then reaches the Moon by the shady side. The Moon Man
    restores his heart, shows him his wife working in mourning with smoke rising from
    her body as evil thoughts, and shows him a place crowded with walrus.
  language: English
  quote_policy: summarized
