canonical_text:
  quote: ''
  summary: A wifeless man who is avoided by young women oversleeps and fails at hunting.
    After rescuing an overturned kayaker identified as one of the Noseless Ones, he
    receives a condition involving hunting and secrecy. He becomes a successful seal
    hunter and takes a wife, but after she repeatedly questions him, he discloses
    the encounter and loses his hunting success. His wife leaves through a rock crevice.
    Insects emerge and ask him to take them, but he rejects each. Finally his wife
    invites him inside, and he takes her as wife again.
  language: English
  quote_policy: summarized
