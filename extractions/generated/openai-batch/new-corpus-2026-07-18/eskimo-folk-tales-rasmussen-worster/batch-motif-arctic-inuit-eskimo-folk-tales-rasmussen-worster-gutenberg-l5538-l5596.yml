canonical_text:
  quote: ''
  summary: Anarteq, the only son of an old man with many daughters, hunts reindeer
    with his sisters near a fjord and lake. During one hunt a reindeer calf overturns
    his kayak, and he sinks after saying salmon are eating him. He wakes as a salmon,
    lives seasonally with other salmon, and years later approaches his father's umiak
    at the old hunting grounds. After seizing the father's steering paddle, he is
    drawn to the surface, becomes a man again, and resumes hunting for his kin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man has only one son, named Anarteq, and many daughters who often go
    reindeer hunting eastward in a fjord.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the hunting place, Anarteq sends his sisters up the hillside to drive reindeer
    into a large lake, where he rows in a kayak and kills them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a few days of this hunting, their umiak is filled with meat and they
    can return home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: During one hunt, Anarteq catches a reindeer calf by the tail and plays with
    it; the calf kicks the kayak, overturning it and filling it with water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The women on shore cannot reach Anarteq to help him, and they hear him say
    that salmon are beginning to eat his belly before he sinks slowly to the bottom.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: When Anarteq wakes to his senses, he has become a salmon.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Anarteq's father returns alone, has no son to hunt for him, and no longer
    rows to the former reindeer hunting grounds.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: As a salmon, Anarteq goes with other salmon in spring, when rivers break up,
    out into the sea to grow fat.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After many years, Anarteq's father returns as chief of a party to the old
    hunting grounds; his daughters row, and he weeps when he thinks of his son.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Anarteq, coming from the sea with other salmon, sees the umiak and his weeping
    father, swims to it, and takes hold of the father's steering paddle.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The father is frightened and says that Anarteq nearly pulled the paddle from
    his hand.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: A second time Anarteq holds the paddle; the father cannot move it at first,
    then slowly draws it to the surface and brings his son up with it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Anarteq becomes a man again and hunts for many years to feed his kin.
  category: sequence
  evidence_refs:
  - ev:10
