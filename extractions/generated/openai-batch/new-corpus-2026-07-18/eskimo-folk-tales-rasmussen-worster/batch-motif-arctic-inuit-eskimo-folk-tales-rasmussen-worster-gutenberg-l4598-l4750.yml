  text: Qasiagssaq's wife says that his actions cause shame, and Qasiagssaq responds
    by making a frightening sound at her.
  category: speech
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:4
  text: Qasiagssaq approaches a speckled seal on ice but repeatedly refrains from
    throwing his harpoon because he does not want to pierce the skin intended for
    his wife's breeches; the seal escapes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Qasiagssaq visits an old couple who are mourning a dead daughter and learns
