canonical_text:
  quote: ''
  summary: The passage presents several episodes in which Qasiagssaq makes false or
    dubious claims about hunting success, kinship, and abundance. His claims are exposed
    by returned bladder floats, visiting strangers, and the visible poverty of his
    household. His wife repeatedly reproaches him for causing shame, and he responds
    by frightening her. The passage ends with a further claim that he has found a
    dead whale.
  language: English
  quote_policy: summarized
