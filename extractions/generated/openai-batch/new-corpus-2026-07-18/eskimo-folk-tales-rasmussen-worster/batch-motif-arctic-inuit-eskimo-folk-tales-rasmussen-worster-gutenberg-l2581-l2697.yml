canonical_text:
  quote: ''
  summary: Makite, unable to catch seals and threatened with abandonment by his wife,
    leaves for the hills. He encounters a hostile lone-dweller who possesses knowledge
    about candle-like objects on a distant hill, escapes and kills him, then reaches
    a dwarf house. The dwarfs battle inland-dwellers with waves associated with barking
    dogs. Makite later builds a house, fetches the candle-like objects from the high
    hill, hangs them in his house, and lives there until death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Makite is married to the sister of many brothers; he catches no seals, while
    his wife's brothers catch many, and his wife says she will leave him because he
    catches nothing.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Makite decides to go up into the hills and live alone after hearing his wife's
    statement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Makite's father-in-law sees him leaving, calls the brothers to pursue him,
    and Makite escapes by making his steps longer until they stop chasing him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At dawn Makite comes to a house whose wall hangings are reindeer and fox skins.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: When Makite enters the house, the door hinge creaks, a deep strange sound
    is heard, and the house shakes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Makite asks about candle-like objects near the window; the lone-dweller says
    such things are on the farther of two hills and cannot be obtained by one who
    is not a lone-dweller.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: During the night the lone-dweller strings a bow while Makite pretends to sleep,
    and Makite avoids attack by pretending to wake.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Makite leaves near dawn; the door creaks again, the lone-dweller chases him,
    and Makite kills the pursuer by running around a rock three times and thrusting
    his harpoon backward.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Makite finds a dwarf house on a plain; many people go in and out, the passage
    is too small for him, but he is told to lift it with his back and then finds the
    interior large.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: An old creature in the dwarf house tells Makite to look west because inland-dwellers
    are coming; Makite sees a great black thing approaching.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The dwarfs go out to fight the inland folk, and the two parties take positions
    on the plain without speaking.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The dog with the inland folk barks, and a mighty wave of water rolls toward
    the dwarfs but becomes small when it is close to them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The dwarfs' dog barks, a wave rises from the dwarfs' side, washes over the
    inland folk, drowns them, and only a few escape alive.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Afterward Makite builds himself a house, fetches the candle-like objects from
    the high hill, hangs them in his house, and lives there until he dies.
  category: sequence
  evidence_refs:
  - ev:10
