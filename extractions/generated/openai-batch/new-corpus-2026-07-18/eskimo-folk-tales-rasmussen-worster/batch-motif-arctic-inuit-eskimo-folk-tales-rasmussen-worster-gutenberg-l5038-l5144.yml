canonical_text:
  quote: ''
  summary: Atdlarneq, a strong and successful seal hunter, paddles south instead of
    hunting and visits a little house near a cape. Three similarly dressed women receive
    him and feed him. Their master, a man with copper cheeks, returns, detects Atdlarneq,
    and forces him under threat to eat enormous quantities of fish, blubber, frozen
    meat, and seal. Atdlarneq survives because he had swallowed a small stalk of grass
    beforehand, returns home the next morning, and never goes southward again.
  language: English
  quote_policy: summarized
