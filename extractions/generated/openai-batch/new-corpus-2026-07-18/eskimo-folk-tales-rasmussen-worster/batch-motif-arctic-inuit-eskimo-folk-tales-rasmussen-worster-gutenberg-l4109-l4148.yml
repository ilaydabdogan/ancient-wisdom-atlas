canonical_text:
  quote: ''
  summary: A bird takes human shape, marries a woman, and brings her home. Her brothers
    remove her while he is away, and the bird-husband, described as a great wizard,
    raises a storm in pursuit. The boat occupants cast the woman into the sea, where
    her grandfather cuts off her hand as she tries to hold on. She drowns and becomes
    Nerrivik, ruler of sea creatures. When people catch no seal, wizards go down to
    comb her hair, and she sends sea animals to humans as thanks.
  language: English
  quote_policy: summarized
