canonical_text:
  quote: ''
  summary: Ukaleq, a strong hunter, kills and is killed by a Magic Bear. His mother
    performs a five-day fasting and hushing rite with his childhood dress in a carrying
    bag, during which Ukaleq revives. Later, at a crowded spirit calling, an old wifeless
    man publicly suggests that an old woman’s Magic Bear killed Ukaleq; the old woman
    denies it, then dies from shame. Ukaleq returns home and no longer hunts bears.
  language: English
  quote_policy: summarized
