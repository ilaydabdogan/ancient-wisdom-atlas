- id: motif:3
  label: origin of dogs from summoned earth-hummocks
  taxonomy_refs: []
  basis: A man summons dogs by stamping and calling, and the dogs come out from hummocks
    with sand in their coats.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No supplied taxonomy family specifically covers animal-companion origin.
- id: motif:4
  label: flood reduces a deathless overpopulated humanity
  taxonomy_refs:
  - flood_and_renewal
  basis: Deathless humans crowd the earth, and a mighty flood from the sea drowns
    many and makes humans fewer.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage emphasizes population reduction more than renewal or moral
    judgment.
- id: motif:5
  label: origin of death and daylight by spoken choice
  taxonomy_refs:
  - duality
  basis: Two old women contrast no day/no death with light/death; the wish for both
    light and death is fulfilled.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The duality taxonomy is supported by the paired opposition, but the passage
    does not present an abstract doctrine of duality.
- id: motif:6
  label: first death made permanent by refusal of return
  taxonomy_refs:
  - resurrection
  basis: The first dead body comes back and tries to get up, but an old woman thrusts
    it back under the stones.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The resurrection reference is partial because the return is incomplete
    and deliberately stopped.
- id: motif:7
  label: dead ascend and become celestial lights
  taxonomy_refs:
  - ascent
  basis: The passage states that when people die they go up into the sky and become
    brightly shining things, in connection with the sun, moon, and stars.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The available taxonomy captures the upward movement but not specifically
    celestial transformation.
- id: motif:8
  label: malicious making of a lethal animated being
  taxonomy_refs: []
  basis: The middle brother makes a Tupilak and instructs it to bite Nukunguasik to
    death.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: No available taxonomy family directly names Tupilak-making or animated
