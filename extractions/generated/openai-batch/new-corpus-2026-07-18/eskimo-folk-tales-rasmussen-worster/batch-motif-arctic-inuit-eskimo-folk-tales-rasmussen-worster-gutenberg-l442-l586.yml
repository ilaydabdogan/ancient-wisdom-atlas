- id: motif:2
  label: first humans emerge as children from the earth
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: Little children come out of the earth among willow bushes and are later clothed
    and brought home.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The taxonomy links are approximate; the passage describes collective human
