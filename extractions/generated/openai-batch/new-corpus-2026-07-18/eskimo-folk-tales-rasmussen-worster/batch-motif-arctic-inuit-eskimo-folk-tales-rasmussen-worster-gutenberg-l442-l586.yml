canonical_text:
  quote: Light came, and death.
  summary: The passage gives an origin account in which earth falls from the sky,
    children emerge from the earth, dogs are summoned from hummocks, a flood reduces
    an overpopulated deathless humanity, and light, death, and celestial bodies enter
    the world. It then begins a separate tale in which Nukunguasik discovers a man
    making a Tupilak to kill him; the maker dies from fright, the Tupilak remains
    alive, and the brothers later bury the dead maker.
  language: English
  quote_policy: quoted
