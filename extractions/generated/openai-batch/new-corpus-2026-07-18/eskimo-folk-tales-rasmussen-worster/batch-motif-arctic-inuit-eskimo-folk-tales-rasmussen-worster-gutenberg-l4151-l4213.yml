canonical_text:
  quote: ''
  summary: Navaranapaluk, said to come from a tribe of man-eaters and married into
    a tribe that did not eat men, falsely makes herself appear mistreated by wearing
    mittens on her feet when visiting her kin. Her kin attack her husband’s village
    while the men are away, kill the women there, and display the bodies on poles;
    three women escape. The returning men prepare arrows with the help of the survivors
    and later attack the killers, who have been warned by a dream, spirit-calling,
    and a barking dog. The avengers kill the men, take widows as wives, and execute
    Navaranapaluk by cutting through her arms, explicitly because she lied.
  language: English
  quote_policy: summarized
