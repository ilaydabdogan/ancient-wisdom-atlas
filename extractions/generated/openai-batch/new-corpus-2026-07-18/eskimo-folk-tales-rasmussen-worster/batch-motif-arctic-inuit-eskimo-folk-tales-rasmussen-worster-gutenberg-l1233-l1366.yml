canonical_text:
  quote: ''
  summary: Qujavarssuk lives at Amerdloq with an old man and repeatedly catches seals
    where others do not. His mother arranges a marriage for him to a woman chosen
    for her ability to eat much meat. A strong hunter challenges him over preparation
    for whale hunting. Guided by the old man, Qujavarssuk kills a speckled seal for
    whale gear; the prepared skin later makes unexplained noises. As whale season
    begins, Qujavarssuk hears whale breathing before the rival hunter claims to have
    heard it first. During the whale hunt, Qujavarssuk delays, watches the whale at
    close range, trembles at seeing such an animal for the first time, and finally
    tells the rowers to approach.
  language: English
  quote_policy: summarized
