canonical_text:
  quote: ''
  summary: The passage first concludes an episode in which Avovang is harpooned, taken
    home, enters a woman with thrown mittens, and is born again as a man. It then
    tells of Papik, who envies his successful hunting companion and wife's brother
    Ailaq. After Ailaq disappears, Ailaq's mother accuses Papik, vows revenge, and
    drowns herself under a bearskin coverlet so she may avenge her son as a ghost.
    Later a monster attacks Papik on the ice; the village is terrified, a fatherless
    boy leaves a blood trail, and the monster appears as a non-real bear or evil spirit.
    Dogs and men finally attack it. When it is cut up, its skin is recognized as the
    old woman's coverlet and its bones are human. Papik is found mutilated. The tale
    closes with a moral that causeless killing was condemned and could bring monstrous
    vengeance.
  language: English
  quote_policy: summarized
