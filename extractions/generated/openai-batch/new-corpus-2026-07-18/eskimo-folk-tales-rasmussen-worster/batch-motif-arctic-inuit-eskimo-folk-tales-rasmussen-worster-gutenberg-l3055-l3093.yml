canonical_text:
  quote: ''
  summary: A bereaved woman leaves home and enters a house whose inhabitants are bears
    in human form. A large bear hunts by putting on its skin and later warns her not
    to speak of them to humans because its cubs may be killed. The woman returns home
    and tells her husband she has seen bears. Men come by sledge; the bear kills its
    cubs to prevent their capture, then kills the woman. Dogs attack the bear, and
    all become bright and rise into the sky as stars called Qilugtussat, resembling
    barking dogs around a bear. The tale concludes that people beware of bears because
    bears hear what people say.
  language: English
  quote_policy: summarized
