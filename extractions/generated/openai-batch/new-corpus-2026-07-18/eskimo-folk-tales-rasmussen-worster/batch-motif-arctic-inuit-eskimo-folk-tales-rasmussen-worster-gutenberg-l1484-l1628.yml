canonical_text:
  quote: ''
  summary: An old woman receives a frozen bear cub, thaws and feeds it, and raises
    it as a foster-son. The bear gains a human-like mind through her speech, grows
    strong, plays with children and men, joins hunters, and becomes a successful seal
    hunter. A collar of plaited sinews marks it so other hunters will spare it. After
    conflict with a man from the north who would not leave it alone, the foster-mother
    tells the bear to depart to its own distant kin to avoid being killed.
  language: English
  quote_policy: summarized
literal_observations:
