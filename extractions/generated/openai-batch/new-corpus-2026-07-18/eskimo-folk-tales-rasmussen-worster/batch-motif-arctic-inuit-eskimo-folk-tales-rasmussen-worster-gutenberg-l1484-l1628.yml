  text: An old woman lives nearest the shore and receives meat and blubber from hunters
    living nearby.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife of a man who killed a bear offers the old woman a bear cub; the old
    woman brings it home, thaws and warms it, feeds it blubber and greaves, and lets
    it lie beside her at night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After sleeping beside the old woman, the bear grows quickly; she speaks to
    it in human speech, and it gains the mind of a human being.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bear asks its foster-mother for food by sniffing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Children come to play with the bear; the old woman instructs it to sheathe
    its claws, and it breaks toy harpoons but sheaths its claws when pushing children.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: As the bear grows stronger, adults begin to play with it, but eventually even
    grown men do not dare play with it because of its strength.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hunters invite the bear to go hunting and tell it to keep downwind so game
    will not scent it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the bear is nearly killed by hunters from the north, the old foster-mother
    makes it a broad collar of plaited sinews as an identifying mark.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The marked bear catches seal reliably, is known in other villages, and is
    released when hunters see its collar.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: People beyond Angmagssalik hear of the bear; one says he will kill it, while
    others warn that the foster-mother depends on its help and that its mark should
    be respected.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The foster-mother tells the bear to treat men as kin and not harm them unless
    they first attack; the bear obeys.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The bear hunts in the sea during summer and on the ice during winter, and
    other hunters receive shares of its catch.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: During a storm the bear returns with a dead man; the community identifies
