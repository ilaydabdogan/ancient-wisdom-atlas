canonical_text:
  quote: ''
  summary: Kumagdlak lives apart with his wife. When enemies arrive by boat, he uses
    living arrows made with human shinbone points and animated by his breath. His
    wife assists him by handing him arrows. Enemy arrows miss him, and he kills many
    attackers, plunders the bodies, and summons a storm that destroys the fleeing
    survivors.
  language: English
  quote_policy: summarized
