canonical_text:
  quote: ''
  summary: Ivan, a soldier promoted by the Tsar, is envied by officers who abandon
    him at sea. A storm carries him to a deserted island, where he descends into an
    underground serpent kingdom. He alters a book so that the six-headed serpent accepts
    him as a son. During the serpent's absence, Ivan opens a forbidden locked chamber
    and finds Yelena the Wise and her maid chained; after he gives them spring water,
    their chains break and they fly away on golden and silver wings. The serpent punishes
    Ivan, then gives him a self-flying carpet when Ivan asks to seek Yelena.
  language: English
  quote_policy: summarized
