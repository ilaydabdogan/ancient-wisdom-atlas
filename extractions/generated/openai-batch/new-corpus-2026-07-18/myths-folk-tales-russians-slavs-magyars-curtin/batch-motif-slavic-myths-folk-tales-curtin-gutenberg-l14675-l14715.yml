canonical_text:
  quote: ''
  summary: An aged learned man reveals that Kiss Miklos, the poor man's youngest son,
    is the true rescuer of the moon and sun from dragons and is arriving with his
    wife, the Green Daughter of the Green King. Kiss Miklos and his wife are honored
    in the king's white chamber, and the council declares that Kiss Miklos deserves
    the kingdom. Kiss Miklos refuses the kingdom because of other inheritances, asks
    that his elder brothers remain king and viceroy, reconciles with them, returns
    to the Lead Friend's domains, later inherits the Green King's dominions, and rules
    two kingdoms happily.
  language: English
  quote_policy: summarized
