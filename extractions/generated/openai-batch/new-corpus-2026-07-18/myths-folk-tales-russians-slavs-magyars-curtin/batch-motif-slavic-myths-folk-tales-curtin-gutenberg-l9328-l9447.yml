canonical_text:
  quote: ''
  summary: A fisherman who may fish only on Mondays for the king catches a sealed
    copper kettle from the sea. When opened, it releases black smoke that becomes
    a fiery man who threatens him. The fisherman tricks the fiery man into returning
    to the kettle, reseals it, then releases him after an oath not to destroy him.
    The fiery man gives him an herb and directs him by stone steps to a high mountain
    and a hidden lake. A mighty wind transports the fisherman to an unknown forested
    country with a broad lake, where he finds a boat and tackle and catches three
    unusual fish on his third cast. He returns by wind, brings the fish home, and
    his wife agrees to take them to the king.
  language: English
  quote_policy: summarized
