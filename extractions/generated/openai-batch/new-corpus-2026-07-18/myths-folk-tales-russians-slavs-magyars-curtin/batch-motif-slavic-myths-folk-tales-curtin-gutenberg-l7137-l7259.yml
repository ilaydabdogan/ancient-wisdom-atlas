canonical_text:
  quote: ''
  summary: An old couple pray for a child and receive seven sons in the seventh year,
    all named Simeon. After the parents die, the orphaned brothers farm their land
    until Tsar Ador notices them and brings them to court. Asked what arts they wish
    to learn, six brothers describe extraordinary crafts involving smithing, skyward
    sight, ship-making, hiding a ship in an underground kingdom, distant shooting,
    and catching a fallen bird. The seventh says his craft is theft; the Tsar is angered,
    but his counselors suggest that this skill may help obtain Tsarevna Yelena the
    Beautiful.
  language: English
  quote_policy: summarized
