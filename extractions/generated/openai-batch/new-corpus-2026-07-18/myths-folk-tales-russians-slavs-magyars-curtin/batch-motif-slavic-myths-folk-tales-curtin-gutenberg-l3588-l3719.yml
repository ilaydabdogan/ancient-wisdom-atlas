canonical_text:
  quote: ''
  summary: Ivan Tsarevich forces Raven son of Raven to give him the feather staff,
    returns with his mother and three Tsaritsas from the Pearl, Golden, Silver, and
    Copper Kingdoms, and is betrayed by his brothers when they cut the rope by which
    he is being raised. After summoning twelve youths with the staff, he returns to
    the free world. In his father's kingdom, the Tsaritsa of the Golden Kingdom delays
    an unwanted marriage to the old Tsar by setting tasks that Ivan secretly fulfills.
    She then requires Ivan to be boiled in milk; he emerges beautiful, while the old
    Tsar imitates him and dies. Ivan and the Tsaritsa are crowned.
  language: English
  quote_policy: summarized
