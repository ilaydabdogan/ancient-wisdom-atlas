canonical_text:
  quote: ''
  summary: Ivan the peasant's son changes into a cat, crosses a bridge over a fiery
    river, and overhears the serpent mother and daughters-in-law planning lethal transformations.
    He defeats their roadside traps, passes great jaws with the help of his wonderful
    horse, then loses the horse to a tiny mustached man. After ferrying without payment
    for three years, Ivan gains three supernatural helpers, who help him recover the
    horse by stealing the Tsar's daughter. The Tsar's daughter later follows Ivan
    by turning into a pin, and Ivan returns her to the Tsar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ivan leaves his companions, turns into a cat, crosses a bridge over a fiery
    river, enters the serpent house, and listens to the surviving serpent women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old mother of the serpents and her three daughters-in-law talk about how
    to destroy Ivan.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The daughters-in-law propose bringing hunger, thirst, and sleep and becoming
    an apple-tree, a well, and a bed; the old mother proposes opening her mouth from
    earth to sky to swallow the travelers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the road Ivan prevents his companions from using the apple-tree, well,
    and bed; when he cuts or slashes the first two, blood comes out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Jaws stretching from earth to sky block the way, and Ivan is carried out of
    the danger by his wonderful horse.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At a river hut, a little man one finger tall with a seven-verst mustache demands
    Ivan's horse, knocks Ivan down, mounts the horse, and rides away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A footless and handless man lying on a stove says the little man gnawed off
    his hands and feet because he ate bread at the little man's table.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mutilated man tells Ivan to ferry people for three years without taking
    money in order to win back the horse.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ivan ferries for three years without payment and refuses money from three
    old men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The three old men reveal themselves as the Freezer, the Devourer, and the
    Wizard and offer to help Ivan recover the horse.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Wizard draws a boat in the sand, commands it, and the boat rises into
    the air and carries the group to a stony mountain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The little man tells Ivan to steal the Tsar's daughter and bring her in exchange
    for the horse.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Tsar tries to suffocate the visitors in a red-hot bath, but the Freezer
    cools it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: At the Tsar's dinner, the Devourer eats all the food on the table.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The old helpers steal the Tsar's daughter at night, deliver her to the little
