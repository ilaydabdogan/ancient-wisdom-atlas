canonical_text:
  quote: ''
  summary: Ivan the Fool, a poor son living with his old mother, twice hires himself
    out and chooses a trained whelp and kitten instead of wages. After his mother
    laments the added burden, he leaves with the animals, rescues a burning snake
    from a fire, and the snake becomes a beautiful maiden. She instructs him to refuse
    deceptive money and ask her mother for a ring with twelve screws. Ivan obtains
    the ring, learns that loosening its screws summons twelve thousand obedient men,
    and commands them to create a splendid castle, golden beds, servants, and a noble
    household. He awakens transformed in appearance and status. The Tsar sees the
    new golden castle and summons its owner; Ivan identifies himself as Ivan Tsarevich
    and tells the Tsar to come to him.
  language: English
  quote_policy: summarized
