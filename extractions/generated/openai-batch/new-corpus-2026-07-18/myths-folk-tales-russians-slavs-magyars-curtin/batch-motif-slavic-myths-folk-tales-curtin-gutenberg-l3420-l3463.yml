canonical_text:
  quote: ''
  summary: A herdsman says he is taking cows to the royal castle for the princess
    to count. Uncle Katoma exchanges clothes with him and drives the cows instead.
    Ivan Tsarevich recognizes Katoma after Katoma reveals himself. At Anna the Beautiful's
    yard, Katoma pulls the skin off the last cow when it stops at the gate. Anna orders
    him seized, but he identifies himself as the man whose feet she cut off and whom
    she placed on a stump. Anna asks forgiveness and swears to love and obey Ivan.
    Ivan forgives her; the blind hero remains with them, and Katoma goes with his
    wife to live with a rich merchant.
  language: English
  quote_policy: summarized
