canonical_text:
  quote: ''
  summary: A discharged mounted soldier reaches a castle where a bear reveals herself
    as an enchanted princess and asks him to endure three nights to free her. He succeeds,
    marries her, later leaves to visit home with magical seeds that create wondrous
    trees. Disguised unclean beings drug him into a long sleep. The princess follows
    signs of withering trees, finds him unresponsive, angrily utters a spell, and
    a whirlwind carries him away.
  language: English
  quote_policy: summarized
