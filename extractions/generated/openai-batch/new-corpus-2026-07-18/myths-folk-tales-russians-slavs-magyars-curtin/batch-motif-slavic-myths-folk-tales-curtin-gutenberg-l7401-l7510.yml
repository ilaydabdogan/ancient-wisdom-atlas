- id: obs:4
  text: The bear-princess said that if the soldier endured three nights in the place,
    the enchantment would be broken and she would marry him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the nights the soldier experienced increasing sadness; by the second
