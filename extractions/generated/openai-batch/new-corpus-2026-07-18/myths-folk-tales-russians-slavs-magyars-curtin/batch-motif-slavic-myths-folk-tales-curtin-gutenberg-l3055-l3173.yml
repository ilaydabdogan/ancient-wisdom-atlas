canonical_text:
  quote: ''
  summary: The opening of the tale introduces Ivan Tsarevich, his dying parents' command
    that he obey the tutor Katoma of the Oaken Cap, Ivan's decision to seek Princess
    Anna the Beautiful, the princess's deadly riddle-marriage condition, Katoma's
    improvised riddle from a found purse of gold, Anna's inability to solve it with
    her magic book, and her subsequent attempts to delay the marriage by assigning
    difficult tasks involving an iron pillar and a magic horse.
