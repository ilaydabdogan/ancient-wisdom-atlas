canonical_text:
  quote: ''
  summary: Bulat uses food messages and a drinking pretext to take Vassilissa from
    a tower and flee with Ivan. Tsar Kirbit sends pursuers, whom Bulat defeats by
    twice turning back under pretexts of lost objects. During a night halt Ivan falls
    asleep on guard, and Koshchéi Without-Death carries Vassilissa away. Bulat and
    Ivan search, kill and impersonate Koshchéi's herdsmen, and signal Vassilissa by
    placing Ivan's ring in goat milk. Vassilissa recognizes the ring, receives them,
    and at Bulat's instruction asks Koshchéi where his death is. Koshchéi says it
    is in a broom at the threshold.
  language: English
  quote_policy: summarized
