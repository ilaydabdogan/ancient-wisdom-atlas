canonical_text:
  quote: ''
  summary: A poor man with two lean cows encounters the King of the Crows, who requests
    the cows for his starving army and promises replacement cattle at his northern
    black castle. The crow army consumes the cows, and the poor man leaves his family
    to seek the castle. After a long journey into a desert-like sand-plain, he is
    fed and guided by the king's shepherds and then horseherds, and the passage ends
    as he reaches the swineherds.
  language: English
  quote_policy: summarized
