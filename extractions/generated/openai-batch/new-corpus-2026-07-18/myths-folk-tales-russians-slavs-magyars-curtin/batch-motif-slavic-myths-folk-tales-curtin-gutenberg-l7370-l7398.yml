canonical_text:
  quote: ''
  summary: A Tsarevna is deceived aboard a ship after her attendants are dismissed.
    Simeon the Thief has the anchor cut and the ship sailed away while he distracts
    her with goods. She transforms into a swan and flees, but two Simeon brothers
    wound and retrieve her. Her attendants report the deceit, and her father sends
    a fleet in pursuit. Another Simeon hides the ship by conducting it to an underground
    kingdom. The brothers return to their own kingdom, deliver Yelena the Beautiful
    to Tsar Ador, and receive freedom, treasure, and reward; Tsar Ador marries her.
  language: English
  quote_policy: summarized
