canonical_text:
  quote: ''
  summary: Ivan uses a self-flying carpet to reach a garden pond where Yelena the
    Wise and her maid remove wings to bathe. He takes the wings, gives the maid her
    silver wings after she promises future service, locks Yelena's golden wings in
    a box, and takes Yelena home as his intended bride. Yelena later tricks Ivan's
    mother into giving her the key, recovers her wings, and flies away. Ivan seeks
    counsel from a six-headed serpent, who gives him flint and steel and explains
    Yelena's deadly hiding test for suitors. At Yelena's palace, Ivan sees the heads
    of failed heroes, accepts the test, hides first above the clouds on a blue-winged
    eagle and then in the sea inside a giant pike, but Yelena sees both hiding places
    in her mirror.
  language: English
  quote_policy: summarized
