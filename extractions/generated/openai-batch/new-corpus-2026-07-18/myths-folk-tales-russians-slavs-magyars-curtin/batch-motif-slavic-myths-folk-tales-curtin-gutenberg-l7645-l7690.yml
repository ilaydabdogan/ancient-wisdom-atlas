canonical_text:
  quote: ''
  summary: A mighty whirlwind identified with South Wind carries the soldier to the
    kingdom where the princess lives. South Wind warns that if he frolics in the soldier's
    kingdom he would overturn the town and gardens. The soldier uses a cap of invisibility
    to enter the castle. Trees in the garden, withered during his absence, revive
    and bloom when he appears. Invisible, he disrupts the drinking of assembled royal
    suitors. The princess recognizes his presence, poses a riddle about a lost golden
    key returning to a casket, calls him to show himself, and identifies herself as
    the casket and the soldier as her faithful husband. The other suitors depart,
    and the princess lives with her husband.
  language: English
  quote_policy: summarized
