canonical_text:
  quote: All at once such a mighty Whirlwind rose that, God save us! it caught the
    Tsaritsa and bore her it was unknown whither.
  summary: The tale opens with Tsar Bail Bailyanyin, his wife Nastasya Golden Tress,
    and their three sons. A mighty Whirlwind abducts the Tsaritsa from a garden. The
    youngest son, Ivan Tsarevich, insists on seeking her, receives guidance from an
    uncle through a rolling ball, reaches heavenly mountains and a cave, ascends with
    iron claws, and enters the Copper and Silver Kingdoms. In each kingdom he pacifies
    chained serpents with water and meets a captive Tsaritsa connected to the Whirlwind.
  language: English
  quote_policy: quoted
