canonical_text:
  quote: ''
  summary: A compressed Delaware tale recounts a hunted man whose wife becomes a flesh-devouring
    pursuer. He is aided by a talking dog, an old man who bridges a river with his
    neck, and two witch aunts who burn the pursuer's life-bearing stomach. Later,
    after marrying another woman, the man is stranded by her malicious grandmother
    on a lake island where rising waters and creatures threaten him. The Morning-star,
    remembering a dream-promise, brings daylight and saves him. The old woman is then
    stranded in the same place, falsely claims the same promise, is refused, and is
    devoured.
  language: English
  quote_policy: summarized
