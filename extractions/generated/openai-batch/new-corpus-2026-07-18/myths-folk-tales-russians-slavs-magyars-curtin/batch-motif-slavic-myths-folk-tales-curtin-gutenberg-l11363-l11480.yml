canonical_text:
  quote: ''
  summary: Jalmir is threatened by the king and sent to obtain wine. A kind steed
    carries him to a sorceress's castle, instructs him to make a rope and net from
    its hairs, and sends him down three hundred steps into a cellar to take a wooden-hooped
    vessel while ignoring more splendid vessels. Jalmir triggers an alarm but escapes
    in the net while the steed fights the sorceress and flees over the boundary. The
    vessel proves to be an enchanted cask producing abundant wine on command. The
    king adopts Jalmir as son and makes him viceroy. Jalmir's brothers, jealous of
    his success, find in books a new task involving a princess in a golden castle
    in the sea whose marriage to the king would renew his life.
  language: English
  quote_policy: summarized
