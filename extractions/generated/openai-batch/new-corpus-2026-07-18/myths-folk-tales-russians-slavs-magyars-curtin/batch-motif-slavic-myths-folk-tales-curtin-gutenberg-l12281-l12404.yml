canonical_text:
  quote: ''
  summary: A king repeatedly threatens his Useless Wagoner with death if he fails
    to complete extraordinary tasks. In the forest the Wagoner shares food with a
    little fox, who repays him by making a seamless cask, then a self-moving horseless
    chariot, and by giving him a whistle. When the king orders him to herd one hundred
    hares, the hares scatter, but the whistle summons them back and he drives them
    home.
  language: English
  quote_policy: summarized
