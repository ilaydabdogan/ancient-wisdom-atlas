canonical_text:
  quote: ''
  summary: Jalmir is sent by the king to bring a princess from a golden castle in
    the sea. Guided by his speaking white steed, he carries large provisions, helps
    a stranded fish and receives a whistle, feeds giants who build a dam across the
    sea, and gives meat to an eagle who promises future aid. The princess agrees to
    come, but when the king proposes marriage she first demands that her golden castle
    be brought as well, sending Jalmir on a new task.
  language: English
  quote_policy: summarized
