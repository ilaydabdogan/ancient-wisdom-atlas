canonical_text:
  quote: ''
  summary: A Tsar dreams of a marvelous horse and promises his daughter and half the
    kingdom to whoever can interpret the dream and obtain the horse. Ivan, a poor
    man’s son, explains that a twelve-headed serpent came on that horse to steal the
    daughter, waits until his fifteenth year, obtains a suitable colt through an old
    man’s advice, and travels with six men to a fiery river. At the bridge he defeats
    multi-headed serpents on successive nights, then battles the twelve-headed serpent;
    his comrades respond to a bowl filling with blood, cut off the last head, and
    pull Ivan from the earth.
  language: English
  quote_policy: summarized
