canonical_text:
  quote: ''
  summary: The queen gives the king's son sleeping-powder to prevent him from waking
    when the Reed Maiden visits at night. The Reed Maiden arrives at midnight in bird
    form, enters through a self-opening window, becomes a beautiful maiden, tries
    to wake the king's son, weeps, and says she will come only twice more. The servant
    Yanchi witnesses the visits and reports them. The king's son and Yanchi trick
    the queen by pouring the sleeping-draught into the bath, allowing the king's son
    to remain awake during the next visit. He embraces the Reed Maiden so she cannot
    fly away. The next day he convenes nobles, asks what punishment is deserved by
    someone who separates a couple, and the queen names a spiked-cask punishment that
    is then carried out on her.
  language: English
  quote_policy: summarized
