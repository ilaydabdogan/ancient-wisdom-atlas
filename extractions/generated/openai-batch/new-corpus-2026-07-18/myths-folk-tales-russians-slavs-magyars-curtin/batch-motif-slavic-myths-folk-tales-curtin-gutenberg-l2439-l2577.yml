canonical_text:
  quote: The simpleton crawled into one ear and out of the other.
  summary: A simpleton uses a wondrous horse to transform into a splendid hero, wins
    recognition as the man who kissed the Tsarevna, marries her, obtains a pig with
    gold bristles through magical aid, exacts the middle toes of rival sons-in-law
    as payment, returns in a grotesque disguise, and begins a second quest for a deer
    with golden horns and a golden tail.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The simpleton enters one ear of the steed and exits the other, becoming an
    extraordinary beauty; later he repeats the passage to return to his former simpleton
    appearance.
  category: action
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:2
  text: In his transformed state, the simpleton rides through the Tsar's court, breaks
    twelve windows, kisses the Tsarevna, and receives a mark on his forehead from
    her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The simpleton conceals the forehead mark by tying a rag around his head and
    lying on the stove.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Tsarevna asks permission to gather people of many ranks to a feast so
    she can identify the man who kissed her by checking for the forehead mark.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Tsarevna finds the mark under the simpleton's head binding and grows faint;
