  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the simpleton passes through the horse's ear, two youths appear and
    ask what he wants; he requests a tent, a bed, and the pig with gold bristles walking
    beside the tent, and these are provided at once.
  category: sequence
  evidence_refs:
  - ev:8
