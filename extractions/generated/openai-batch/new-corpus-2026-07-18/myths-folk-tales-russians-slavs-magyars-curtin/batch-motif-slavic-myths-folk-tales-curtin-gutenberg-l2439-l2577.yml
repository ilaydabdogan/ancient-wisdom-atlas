  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Tsar asks his sons-in-law to obtain a wondrous pig with gold bristles.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The simpleton goes into an open field, calls for the blue-brown cunning bay
