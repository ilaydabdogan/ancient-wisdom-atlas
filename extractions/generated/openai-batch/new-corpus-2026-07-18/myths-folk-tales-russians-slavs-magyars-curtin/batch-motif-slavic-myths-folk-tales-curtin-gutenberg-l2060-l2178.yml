canonical_text:
  quote: ''
  summary: The passage closes one tale by saying the Tsar takes a horse and gives
    his daughter to Ivan. It then begins a tale in which the youngest of three daughters
    asks her father to bring her a red flower. The father obtains the flower from
    an unknown old man only by accepting a condition that the youngest daughter marry
    the old man’s son, Bright Finist the Falcon. The daughter says she already knows
    Finist, who flies as a falcon and becomes a hero when he strikes the earth. At
    night she places the flower in water at the window; Finist enters as a falcon,
    becomes a young man, speaks with her, and gives her a wing feather that can summon
    splendid garments and conveyances. She uses the feather to appear at church in
    magnificent attire, then makes the carriage vanish when she returns home. Her
    sisters repeatedly see the mysterious beauty at church and eventually notice a
    diamond pin in their youngest sister’s hair matching the one worn by the supposed
    Tsar’s daughter.
  language: English
  quote_policy: summarized
