canonical_text:
  quote: ''
  summary: The passage opens the tale of Fedot, a skilled royal sharpshooter. In the
    forest he wounds a blue dove, which speaks and instructs him how to keep and strike
    her when she sleeps. The dove becomes a beautiful soul-maiden, identifies herself
    as a king's daughter, and marries Fedot. Later she uses a magic book to summon
    two unknown youths, who make a marvelous tapestry showing the whole kingdom. Fedot
    sells it; it passes from the mayor to the king. The mayor then visits Fedot for
    another tapestry, sees Fedot's wife, and is overwhelmed by her beauty.
  language: English
  quote_policy: summarized
