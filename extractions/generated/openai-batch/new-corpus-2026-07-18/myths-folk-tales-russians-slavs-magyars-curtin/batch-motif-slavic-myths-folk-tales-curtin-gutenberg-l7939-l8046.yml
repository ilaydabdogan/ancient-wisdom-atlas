canonical_text:
  quote: ''
  summary: A merchant opens a golden casket on the Tsar of the Sea's land and a palace
    appears. To have the palace put back into the casket, he swears to give the Tsar
    what he has at home but does not know, which turns out to be his newborn son.
    Years later the son Ivan dreams that the Tsar summons him, departs with his parents'
    blessing, receives directions from Baba-Yaga, and at a lake takes the many-colored
    wings of a dove-maiden who is Vassilissa the Cunning, daughter of the Tsar of
    the Sea. She accepts him as betrothed husband, shows him the way to her father,
    and flies away as a dove.
  language: English
  quote_policy: summarized
