canonical_text:
  quote: ''
  summary: Ivan Tsarevich, on foot after losing his horse to the Gray Wolf, is carried
    by the Wolf to the Fire-bird. He disobeys the Wolf's warning by taking the golden
    cage as well as the bird, is caught, and is ordered by Tsar Dolmat to obtain Tsar
    Afron's golden-maned steed. He repeats the pattern at Afron's stables by taking
    a forbidden golden bridle, is caught, and is ordered by Tsar Afron to bring Princess
    Yelena the Beautiful. The Wolf again carries him onward and brings him near Yelena's
    garden.
  language: English
  quote_policy: summarized
