canonical_text:
  quote: ''
  summary: Ivan Tsarevich follows his parents' dying instruction and lets three supernatural
    bird-suitors marry and carry away his sisters. After seeking them, he meets and
    marries the warrior Korolyevna Marya Morevna. When she goes to war and forbids
    him to look in a closet, he opens it, gives water to the chained Koshchéi Without-Death,
    and releases him. Koshchéi abducts Marya Morevna, and Ivan sets out to find her,
    visiting his bird brother-in-law Falcon and then Eagle.
  language: English
  quote_policy: summarized
