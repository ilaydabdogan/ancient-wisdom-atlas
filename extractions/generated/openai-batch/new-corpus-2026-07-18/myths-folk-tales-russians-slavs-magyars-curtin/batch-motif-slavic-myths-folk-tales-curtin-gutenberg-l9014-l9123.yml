canonical_text:
  quote: ''
  summary: Yanek and his brothers enter an empty castle with heaps of copper, silver,
    and gold. The elder brothers load gold and later beat Yanek when he refuses to
    return for food. Yanek survives, returns to the castle, is caught by two giants,
    and is spared on condition that he guard their treasures. The giants give him
    a little table that produces royal food when struck and commanded. Yanek leaves
    with the table, feeds a hungry old grandfather under a tree, and the old man offers
    a pack that can summon an army in exchange for the table.
  language: English
  quote_policy: summarized
