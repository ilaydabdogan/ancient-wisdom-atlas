canonical_text:
  quote: whoever would drink that water would become thirty years younger
  summary: An old Tsar dreams of a maiden in a distant kingdom whose flowing water
    restores youth. His elder sons set out but turn back after warnings about deadly
    ferries. The youngest son, Ivan Tsarevich, takes only a steed and the sword Kládyenets,
    accepts Baba-Yaga's warning, defeats ferrymen who demand body-part tolls, and
    reaches the boundary of the thirtieth kingdom where a giant confronts him.
  language: English
  quote_policy: quoted
