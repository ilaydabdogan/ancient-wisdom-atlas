canonical_text:
  quote: '"Whoever wishes to liberate me must carry me next to his body, and bathe
    me each day."'
  summary: A king sends his three sons abroad under a return-and-gift condition. Arrows
    assign the elder sons east and west, while the youngest, Yarmil, follows his arrow
    to a mouse-hole. The earth opens into an underground country with castles, a silent
    white lady, a white flying steed, a jeweled palace, a garden, self-opening doors,
    and chambers containing water and a diamond pan. Yarmil finds an inscribed instruction
    to carry and bathe the captive within, uncovers an ugly toad, carries it in his
    bosom, washes it daily, and lives in the palace with unseen hospitality.
  language: English
  quote_policy: quoted
