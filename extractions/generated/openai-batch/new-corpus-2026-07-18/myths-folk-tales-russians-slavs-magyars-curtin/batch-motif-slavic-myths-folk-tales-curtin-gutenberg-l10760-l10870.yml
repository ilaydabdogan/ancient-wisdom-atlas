canonical_text:
  quote: ''
  summary: After losing magic possessions to a princess and being held for debt, a
    man arranges for her to buy and eat enchanted pears that make horns grow on her
    head. Doctors fail to remove the horns, and the king promises his daughter and
    kingdom to whoever cures her. The man appears as a doctor, induces the princess
    to confess theft of the magic purse, cap, and mantle, retrieves them, and cures
    her with an apple cut into four parts. The horns fall off, and he marries the
    princess and receives royal status, with his friends remaining at court.
  language: English
  quote_policy: summarized
