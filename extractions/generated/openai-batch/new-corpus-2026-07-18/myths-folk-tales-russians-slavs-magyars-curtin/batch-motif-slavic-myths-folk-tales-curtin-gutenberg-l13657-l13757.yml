canonical_text:
  quote: '"they have stolen the sun and the moon from our bright heavens"'
  summary: A dying poor man tells his three sons that the kingdom is dark because
    the sun and moon have been stolen, and charges them to recover the lights. The
    king promises succession and support to the successful brother. The youngest,
    later named Kiss Miklos, chooses a despised colt and rusty sword that prove magical.
    After a long journey, he ambushes a twelve-headed dragon at a silver bridge, kills
    it with the sword, and recovers the moon-bearing steed.
  language: English
  quote_policy: quoted
