canonical_text:
  quote: ''
  summary: Mirko learns of a horn hidden in a seventh cellar, retrieves it, and sounds
    it toward the four directions. A herd of steeds arrives, including a shabby mare
    who proves magical. After being fed peas, beans, and glowing coals, the mare becomes
    a golden-haired steed, renews an old saddle, weapons, sword, and bridle into golden
    equipment, and carries Mirko on a supernatural journey across rivers, metallic
    bridges, lions, and a high glass mountain.
  language: English
  quote_policy: summarized
