canonical_text:
  quote: ''
  summary: Mirko, carried and advised by a speaking steed, crosses perilous otherworldly
    routes, reaches the Hero of the Plain, proves honorable by not killing him asleep,
    joins him in battle, pursues fleeing enemies through a glass mountain into the
    lower world, destroys a witch whose loom produces soldiers, receives but does
    not rely on her offered diamond horseshoe nails, and burns her so she cannot regenerate.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaking steed tells Mirko that they must cross a narrow glass road over
    bottomless emptiness, and instructs him to close his eyes and hold fast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After crossing the glass road, Mirko observes faint light behind him and dense
    darkness in front, and the steed carries him through it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mirko and the steed arrive among snow-covered mountains at a silken meadow
    with a dark tent that the steed identifies as belonging to the Hero of the Plain.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Inside the tent, Mirko sees a sleeping warrior protected by a sword cutting
    around above him, and decides it would be dishonorable to kill a sleeping man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mirko lies down outside the tent and commands his own sword out of the sheath,
    so that it cuts around above him and protects his body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Hero of the Plain wakes, sees Mirko's horse and Mirko sleeping under the
    moving sword, and concludes that Mirko is an honest warrior because he did not
    kill him in sleep.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Hero of the Plain says the silken meadow is filled with enemies every
    day and that he cuts them down daily.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mirko and the Hero of the Plain ride into the enemy host and command their
    swords from the sheath; the swords cut down the enemy multitude.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Twelve opposing warriors flee to a glass mountain; Mirko follows them to a
    breach with winding steps, and his steed carries him down into the lower world.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the lower world, Mirko sees a shining diamond castle that serves as the
    sun there, and he kills the twelve fleeing warriors before the castle.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'Inside the diamond castle, an old witch weaves armed men: two mounted hussars
    appear when she throws her shuttle right, and two armed footmen appear when she
    throws it left.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mirko's sword cuts down the newly made soldiers, but the witch continues weaving
    more.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Mirko has the sword cut the witch into pieces, burns the loom and materials,
