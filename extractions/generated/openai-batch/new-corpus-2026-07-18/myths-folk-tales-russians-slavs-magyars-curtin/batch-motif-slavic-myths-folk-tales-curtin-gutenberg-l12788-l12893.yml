  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The witch asks Mirko to spare her and offers four diamond horseshoe nails
    and escape instructions in return for her life.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Mirko decides that if the witch lives she will set up her loom again and continue
    producing enemies for the Hero of the Plain; he cuts and burns her pieces so she
    cannot rise again.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: After destroying the witch, Mirko mounts his steed and searches the underground
    world without finding a living soul.
  category: action
  evidence_refs:
  - ev:9
