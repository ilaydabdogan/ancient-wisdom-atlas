    third night he is all stone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ivan places stone Bulat in a separate chamber and goes there each day with
    Vassilissa to weep.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After years, Ivan hears a voice coming from the stone while he is weeping
