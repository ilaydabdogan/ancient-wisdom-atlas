canonical_text:
  quote: ''
  summary: Bulat kills three favorite animals that break loose and run toward Ivan
    Tsarevich. Ivan grows angry and orders Bulat's death. Bulat asks to speak three
    speeches, recounts three nights involving twelve doves, and becomes progressively
    stone. Years later a voice from the stone tells Ivan how to restore him by killing
    Ivan and Vassilissa's two children and rubbing the stone with their blood. Bulat
    revives; the children are then found alive, and a feast follows.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bulat sharpens his sword and stands at the porch; a dog tears away from its
    keeper, runs to the porch, and Bulat cuts it in two.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The next day Ivan orders his favorite horse brought out; the horse breaks
    its halter, tears away from the groom, gallops at Ivan, and Bulat cuts off the
    horse's head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ivan becomes more angry and commands that Bulat be seized and hanged, but
    Vassilissa Kirbítyevna intercedes and says Ivan would not have won her without
    Bulat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: On the third day Ivan orders his favorite cow led out; the cow tears away
    from the herder, runs at the Tsarevich, and Bulat cuts off her head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the cow is killed, Ivan orders the headsman to put Bulat to death on
