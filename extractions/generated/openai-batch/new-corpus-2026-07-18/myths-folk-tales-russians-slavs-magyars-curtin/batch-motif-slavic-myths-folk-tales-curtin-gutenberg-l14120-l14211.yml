canonical_text:
  quote: ''
  summary: 'Kiss Miklos asks for the Green King''s daughter. The Green King sets three
    tests, beginning with a race to fetch a wedding dress from Pluto''s. The king
    secretly sends his witch mother early. Miklos''s Swift Runner wins the dress but
    is tricked into sleep by the witch, who uses a horse-skull and steals the box.
    Far Seer locates him, Far Caster knocks away the skull, and Swift Runner recovers
    the dress before the witch can enter the Green King''s door. The first trial is
    accepted, and the Green King announces a second ordeal: spending a night in a
    heated iron furnace.'
  language: English
  quote_policy: summarized
