canonical_text:
  quote: ''
  summary: A fisherman's wife brings three wonderful fish to the king and receives
    gold. When the fish are placed in a pan, a violent invisible force knocks the
    cook and chamberlain unconscious; one fish speaks to the other two, and all three
    vanish. The king demands more fish. On Monday the fisherman, carrying a wonderful
    herb, is transported to a mountain and lake, catches three more fish on his third
    try, and returns. His wife delivers the fish, receives more gold, and the household
    rejoices while the fisherman thanks a fiery man.
  language: English
  quote_policy: summarized
