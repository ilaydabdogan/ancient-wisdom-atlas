canonical_text:
  quote: ''
  summary: Ivan Tsarevich refrains from taking honey and from eating a lion whelp
    after being promised future help. He comes to Baba-Yaga's house, where eleven
    heads stand on twelve stakes, and accepts a three-day task of herding her mares
    in order to earn a heroic steed. Birds, beasts, and bees bring the mares back,
    and a bee advises him to steal a mangy colt. Ivan escapes across a fiery river
    by means of a kerchief-created bridge; Baba-Yaga pursues and dies when the bridge
    breaks. The colt becomes a marvellous steed. Ivan retrieves Marya Morevna, and
    when Koshchei pursues, Ivan's horse strikes Koshchei, Ivan finishes him, burns
    him, and scatters the ashes. Ivan and Marya then visit the Raven, Eagle, and Falcon.
  language: English
  quote_policy: summarized
