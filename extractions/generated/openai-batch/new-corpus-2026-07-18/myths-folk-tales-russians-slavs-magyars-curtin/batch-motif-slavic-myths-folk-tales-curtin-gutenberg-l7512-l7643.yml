canonical_text:
  quote: ''
  summary: A poor soldier is carried by a whirlwind to a remote point between seas,
    wakes after a half-year sleep, encounters three devils fighting over inherited
    magical objects, tricks them into being crushed in pitch, and takes the objects.
    He travels by flying carpet seeking his princess, consults three Baba-Yaga sisters,
    and the eldest summons the winds. South Wind reports the princess is in a new
    kingdom and agrees to carry the soldier there in exchange for freedom to roam
    in the soldier's kingdom.
  language: English
  quote_policy: summarized
