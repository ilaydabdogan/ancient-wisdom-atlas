canonical_text:
  quote: ''
  summary: After a storm, an eagle finds Jalmir's body, remembers his earlier kindness
    to her young, carries him to an island, and revives him in a spring. The eagle
    helps him obtain the water of death, water of life, and water of youth from three
    springs, then her brother carries him to the old pear-tree where his white steed
    waits. The steed bears Jalmir toward the princess and warns him to judge justly
    when he is king. The princess uses the waters in an attempt to make the old king
    young, but she accidentally applies the water of death twice; Jalmir revives her
    with the water of life, but the king remains dead. The princess declares Jalmir
    king, and Jalmir calls her queen.
  language: English
  quote_policy: summarized
