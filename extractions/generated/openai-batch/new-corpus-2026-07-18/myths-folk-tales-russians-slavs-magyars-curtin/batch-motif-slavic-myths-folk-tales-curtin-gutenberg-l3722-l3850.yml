canonical_text:
  quote: ''
  summary: A royal infant, Ivan Tsarevich, cannot be quieted until his father promises
    him Peerless Beauty as bride. After repeated three-day sleeps, Ivan, only nine
    days old, asks for his father's blessing and sets out. An old man tells him Peerless
    Beauty lives in the Golden Kingdom at the sunrise edge of the world and instructs
    him how to choose a horse by a sign at the blue sea. Ivan obtains a heroic speaking
    steed and rides to two great houses inhabited by old women; the first has not
    heard of Peerless Beauty and directs him onward, while the second hosts him and
    asks his errand.
  language: English
  quote_policy: summarized
