canonical_text:
  quote: Though we are both maimed, we shall serve for one sound man.
  summary: Nikita helps the Tsar survive Yelena's wedding-night strength tests by
    taking the Tsar's place. After discovering the deception, Yelena mutilates Nikita
    and sets him adrift at sea, seizes the Tsar's kingdom, and has Nikita's brother
    Timofei blinded. The brothers meet at the shore; Timofei uproots an oak so Nikita
    can reach land, and they agree that Timofei will carry Nikita while Nikita guides
    him.
  language: English
  quote_policy: quoted
