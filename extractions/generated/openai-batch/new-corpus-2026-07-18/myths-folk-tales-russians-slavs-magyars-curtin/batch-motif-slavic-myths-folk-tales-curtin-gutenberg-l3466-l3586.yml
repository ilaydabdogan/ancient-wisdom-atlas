  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsar Goroh and Tsaritsa Anastasia the Beautiful have three sons, and an unclean
    spirit carries away the Tsaritsa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The eldest son asks his father for a blessing to search for his mother, departs,
    and is not heard from for three years.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The second son asks for a blessing to search for his brother and mother, departs,
    and also disappears.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ivan, the youngest son, receives his father's blessing, travels to a strange
    distant region, and reaches the blue sea.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the sea, three and thirty spoonbills strike the earth and become fair maidens;
    Ivan takes the girdle of the fairest maiden while she bathes and withholds it
    until she tells him where his mother is.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The maiden says Ivan's mother is at the house of her father, Raven son of
    Raven, and tells Ivan to follow a silver bird with a golden crest.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ivan meets his brothers, follows the silver bird with them to an iron plate
    and opening, receives his brothers' blessing, and lets himself down on a rope
    swing for three years.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ivan reaches the Copper Kingdom, where three and thirty spoonbill maidens
    embroider towels with towns and suburbs; the Copper Tsaritsa warns him about Raven
    son of Raven and gives him a ball to guide him to her second sister.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ivan reaches the Silver Kingdom; the Silver Tsaritsa remarks on the Russian
    odor, hears his quest, warns that Raven son of Raven will slay him, and gives
    him a ball to reach her youngest sister.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the Golden Kingdom, Ivan finds three and thirty spoonbill maidens and the
    exceptionally beautiful Tsaritsa of the Golden Kingdom, who directs him toward
