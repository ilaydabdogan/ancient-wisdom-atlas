canonical_text:
  quote: ''
  summary: 'The passage opens the tale of the Three Kingdoms: Tsar Goroh''s wife Anastasia
    is carried away, the elder sons vanish while searching, and the youngest son Ivan
    begins a quest. At the sea he encounters spoonbills who become maidens, takes
    a maiden''s girdle to learn where his mother is, follows a silver bird with a
    golden crest, descends through an opening, passes through Copper, Silver, and
    Golden Kingdoms, receives warnings and magical guidance from their Tsaritsas,
    falls in love with the Golden Tsaritsa, and reaches the Pearl Kingdom, where he
    follows instructions involving wine, a burnt crust, and jars of strength and weakness
    water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tale is set in an ancient marvelous world with wood-demons, witches, river-maidens,
    rivers of milk, banks of jelly, and roast partridges flying over fields.
