canonical_text:
  quote: ''
  summary: Ivan Goroh reaches the palace where his sister Vassilissa Golden Tress
    is watching for the Savage Serpent. After displays of strength, Ivan has a nine-ton
    iron club forged, confronts the fire-associated Serpent on his steed Whirlwind,
    and destroys him. The people acclaim Ivan, and he appoints the old blacksmith
    as their head. Ivan obtains the water of life and the water of death and revives
    his brothers. He returns with Vassilissa by ship on the Swan's river, rejuvenates
    an old woman with the serpent's water, is welcomed home by his parents, celebrates
    weddings, and later receives the crown.
  language: English
  quote_policy: summarized
