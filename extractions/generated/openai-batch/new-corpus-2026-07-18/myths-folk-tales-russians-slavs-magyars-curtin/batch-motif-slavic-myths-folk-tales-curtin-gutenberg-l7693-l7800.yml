canonical_text:
  quote: ''
  summary: The passage opens the tale of Vassilissa the Cunning and the Tsar of the
    Sea. A mouse deceives a sparrow over shared grain, leading the sparrow to appeal
    first to the lion and then to the eagle. The eagle summons birds against beasts,
    wins a battle, and is left wounded. A childless merchant later finds the wounded
    eagle in a forest, agrees to feed him for a prolonged period, profits by selling
    furs from the battlefield, and helps the eagle recover strength through repeated
    yearly tests against oak trees.
  language: English
