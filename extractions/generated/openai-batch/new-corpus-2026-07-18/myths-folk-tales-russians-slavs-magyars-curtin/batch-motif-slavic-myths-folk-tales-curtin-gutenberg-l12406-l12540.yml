canonical_text:
  quote: ''
  summary: The Useless Wagoner repeatedly herds one hundred hares that scatter but
    return when he sounds his whistle. The king tries to make him fail by sending
    the princess, the queen, and then himself in peasant disguise to obtain one hare.
    Each hare is recalled before the royal figure can bring it through the gate, and
    the full hundred are counted again. The king finally demands that three bags be
    filled with truth; when the Wagoner begins recounting the exchanges, the king
    stops him and is carried by a commandable chariot to the bottom of hell.
  language: English
  quote_policy: summarized
