canonical_text:
  quote: ''
  summary: After traveling across forty-nine kingdoms, Kiss Miklos and the Green Daughter
    of the Green King arrive at the Lead Friend's mansion. While the Lead Friend takes
    Kiss Miklos to his furnace, the princess enters a cellar through seven iron doors
    opened by her magic, removes gold from seven leaden vats, and has lead thresholds
    gilded. The miserly Lead Friend repeatedly rages and assaults her, but Kiss Miklos
    intervenes. The princess avoids pain by magically leaving her skin, into which
    a devil enters. She tries to make the Lead Friend reveal where his strength lies,
    but he refuses.
  language: English
  quote_policy: summarized
