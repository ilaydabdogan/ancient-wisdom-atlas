canonical_text:
  quote: ''
  summary: After three years, three months, and three days, an eagle regains his strength
    at the lofty oaks and carries a merchant over the sea. The eagle drops and catches
    the merchant three times to make him feel the terror the eagle had felt when the
    merchant aimed a gun at him. The eagle then takes the merchant beyond the sea
    to the copper, silver, and golden kingdoms of his three sisters. At each kingdom
    he becomes a human hero, asks that the merchant be honored, and instructs the
    merchant to request a casket rather than treasure. The first two sisters refuse
    and their kingdoms are seen burning after the eagle departs. The youngest sister
    gives the golden casket, and the eagle warns the merchant not to open it until
    he is home.
  language: English
  quote_policy: summarized
