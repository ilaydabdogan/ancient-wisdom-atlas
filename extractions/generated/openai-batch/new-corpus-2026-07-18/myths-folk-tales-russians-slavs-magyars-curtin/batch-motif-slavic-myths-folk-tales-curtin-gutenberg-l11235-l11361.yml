canonical_text:
  quote: ''
  summary: Jalmir escapes a sorceress's castle with a caged bird and, at the white
    steed's command, releases it beyond the castle boundary; at dawn the king's garden
    fills with birds and Jalmir gains royal favor. His jealous brothers then persuade
    the king to send him for beasts. The steed guides Jalmir back to the sorceress,
    warns him not to touch shining chained beasts in the first three chambers, and
    tells him to seize an ugly dog in the fourth. Jalmir escapes, releases the dog
    beyond the boundary, and at dawn many beasts appear throughout the garden, town,
    and countryside. The brothers, frustrated that Jalmir's favor has increased, next
    induce the king to demand wine.
  language: English
  quote_policy: summarized
