canonical_text:
  quote: ''
  summary: Boyislav obeys a speaking horse by throwing apples into the sea, causing
    roads to rise from the waves. He visits Green Island, where he follows the horse's
    instructions and obtains a poor-looking table cloth from a reluctant king. He
    then travels to White Island, where all inhabitants sleep because of an ever-burning
    taper in the palace. After seeing the sleeping princess, taking the taper, kissing
    her hand, and writing his name, Boyislav escapes when the taper is blown out and
    the city awakens; a final apple raises a road to firm land.
  language: English
  quote_policy: summarized
