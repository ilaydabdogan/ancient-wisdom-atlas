canonical_text:
  quote: "“in one tub is water of strength, in the other water of weakness”"
  summary: Ivan Tsarevich is guided by magical balls through kingdoms and serpent-guarded
    palaces to his captive mother. His mother instructs him to use switched tubs of
    strength-giving and weakening water to defeat Whirlwind, the being who abducted
    her. Ivan seizes Whirlwind’s club, survives an aerial ordeal, drinks the water
    of strength, cuts off Whirlwind’s head with one blow, and burns and scatters the
    remains.
  language: English
  quote_policy: quoted
