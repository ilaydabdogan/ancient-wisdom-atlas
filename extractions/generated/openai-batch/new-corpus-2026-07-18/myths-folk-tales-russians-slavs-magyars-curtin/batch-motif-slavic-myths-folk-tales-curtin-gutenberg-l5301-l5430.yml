- id: ev:11
  type: summary
  locator: lines 5376-5393
  quote_or_summary: Ivan sees a man flogged for owing ten thousand to a merchant;
    the people say Koshchéi Without-Death will carry away the wife of whoever redeems
    him, and Ivan pays the debt because he has no wife.
  source_text_path: texts/public-domain/slavic/project-gutenberg/myths-folk-tales-russians-slavs-magyars-curtin.md
