- id: ev:12
  type: summary
  locator: lines 5394-5403
  quote_or_summary: The redeemed man thanks Ivan, says Ivan could not otherwise have
    gained his bride, asks Ivan to buy him a horse and saddle, and gives his name
    as Bulat the hero.
  source_text_path: texts/public-domain/slavic/project-gutenberg/myths-folk-tales-russians-slavs-magyars-curtin.md
  rights_note: Public domain source; summarized evidence.
- id: ev:13
  type: summary
  locator: lines 5404-5412
  quote_or_summary: After they reach the thirtieth kingdom, Bulat tells Ivan to buy
    and roast chickens, ducks, and geese, and to cut off the right wing of a bird
    and hand it to him on a plate each time he returns.
  source_text_path: texts/public-domain/slavic/project-gutenberg/myths-folk-tales-russians-slavs-magyars-curtin.md
  rights_note: Public domain source; summarized evidence.
- id: ev:14
  type: summary
  locator: lines 5413-5430
  quote_or_summary: Bulat goes to Vassilissa's lofty gilded tower, lightly throws
    a stone and breaks its summit, returns to Ivan for a right wing, then brings Vassilissa
    a hen with greetings from Ivan.
  source_text_path: texts/public-domain/slavic/project-gutenberg/myths-folk-tales-russians-slavs-magyars-curtin.md
