  quote_or_summary: In the opening of 'Koshchéi Without-Death,' Ivan's nurses and
    maids sing of his future bride Vassilissa Kirbítyevna in the thirtieth kingdom
    beyond the thrice ninth land; at fifteen he asks leave to seek her, and his father
    blesses and announces the journey.
