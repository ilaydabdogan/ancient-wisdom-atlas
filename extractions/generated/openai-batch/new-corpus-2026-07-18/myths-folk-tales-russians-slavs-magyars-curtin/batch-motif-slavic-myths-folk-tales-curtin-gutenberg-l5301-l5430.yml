canonical_text:
  quote: ''
  summary: 'The passage closes the episode of the footless Nikita and blind Timoféi:
    the brothers enter Baba-Yaga''s forest cabin, use a whistle that makes everything
    dance, compel Baba-Yaga to provide healing and living water, regain legs and sight,
    return to the capital, expose Yelena, and are rewarded by the restored Tsar. The
    passage then begins the tale of Koshchéi Without-Death: Ivan Tsarevich sets out
    to seek his foretold bride Vassilissa Kirbítyevna, redeems a flogged debtor named
    Bulat the hero, and Bulat begins to help him approach Vassilissa in her gilded
    tower.'
  language: English
  quote_policy: summarized
