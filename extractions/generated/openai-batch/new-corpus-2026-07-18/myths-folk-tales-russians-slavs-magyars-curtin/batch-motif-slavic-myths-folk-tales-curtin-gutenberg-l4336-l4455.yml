canonical_text:
  quote: ''
  summary: Vassilissa recognizes her brothers at the serpent's castle, but the Savage
    Serpent returns, kills the two Tsareviches, and has their bodies thrown into a
    ditch. Vassilissa grieves and then learns from the serpent that his fated foe
    is Ivan Goroh, who will be born from a pea. The Tsaritsa later swallows a pea
    with spring water and gives birth to Ivan Goroh, who grows with extraordinary
    speed and strength. Ivan leaves to find his lost siblings, meets an old woman
    in a rotating cabin on hen's legs, learns that the whirlwind is the Savage Serpent,
    promises to bring her youth-restoring water, and travels toward the serpent's
    land, where a blind lame beggar confirms Vassilissa is in the town.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vassilissa sees and recognizes her brothers from the castle and quietly sends
    to bring them in while the Savage Serpent is absent.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the brothers enter, the silver pillar groans, stairways open, roofs glitter,
    and the castle begins turning; Vassilissa says this means the serpent is coming
    and tells her brothers to hide.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Savage Serpent flies in, asks what living man is present, and the Tsar's
    sons answer that they have come from home for their sister.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The serpent mocks the brothers as puny champions, strikes one against the
    other with his wing, and the castle guard throws the dead Tsareviches into a deep
    ditch.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Vassilissa mourns, refuses food and drink for a time, then eats and begins
    seeking knowledge by wheedling in order to free herself from the serpent.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Vassilissa asks the serpent whether he has a foe; he replies that it was fated
    at his birth that his foe would be Ivan Goroh, born from a pea, though he says
    this in jest.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Tsaritsa walks in a garden, drinks spring water drawn from a white marble
    well with a golden cup, and swallows a pea with the water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The pea bursts and grows within the Tsaritsa; she gives birth to Ivan Goroh,
    who grows by the hour and becomes a mighty champion by age ten.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ivan learns that his sister was carried away by a whirlwind and that his two
    brothers were lost while searching for her; he asks his parents' blessing to go
    find them, and after resisting they prepare him for the road.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: Ivan reaches a dark forest containing a cabin on hen's legs that shakes and
    turns in the wind; he uses a traditional formula to make the cabin turn its front
    toward him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The old woman in the cabin says the whirlwind is the Savage Serpent, warns
    Ivan that the serpent may swallow him, asks him to bring youth-restoring water
    from the serpent's castle, and directs him west toward a bald mountain and the
    serpent's kingdom.
  category: speech
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:12
  text: Ivan travels west through three kingdoms to the serpent's land; at the town
    gate he gives charity to a lame blind beggar with a crutch and asks whether Vassilissa
    is in the town, and the beggar says she is there but it is forbidden to say so.
  category: sequence
  evidence_refs:
  - ev:13
