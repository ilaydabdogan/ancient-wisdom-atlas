canonical_text:
  quote: ''
  summary: Nikita Koltoma pays fifty roubles to free an old man from blacksmiths;
    the old man, identified as a wizard, later thanks him and gives him a cap of invisibility.
    Nikita has a huge iron staff made, rejoins the terrible Tsar and companions, tears
    down the iron paling around Yelena the Beautiful's castle, and defeats the defenders
    she sends. When Yelena prepares a giant bow and arrow, Nikita wears the cap of
    invisibility and shoots off the top of her castle; afterward she receives the
    terrible Tsar and his men in her chambers for a feast.
  language: English
  quote_policy: summarized
