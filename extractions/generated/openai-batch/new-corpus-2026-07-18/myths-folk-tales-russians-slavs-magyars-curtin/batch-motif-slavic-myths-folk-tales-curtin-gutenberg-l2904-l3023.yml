candidate_motifs:
- id: motif:1
  label: quest for healing water from a distant maiden’s realm
  taxonomy_refs:
  - mystical_quest
  basis: Ivan explicitly travels to the thirtieth kingdom to obtain access to the
    maiden from whose hands and feet healing water flows, and he takes that water
    in a flask.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: The passage presents the quest midstream and does not include its initial
    commission.
- id: motif:2
  label: magical helper provides objects for overcoming a guardian
  taxonomy_refs:
  - wisdom
  basis: The old woman gives Ivan herbs and a ball, with instructions that let him
    put the giant guard to sleep and find the maiden’s realm.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The helper’s identity and origin are not further explained in this passage.
- id: motif:3
  label: sacred theft from a sleeping supernatural or royal woman
  taxonomy_refs:
  - sacred_theft
  basis: Ivan enters the palace while the maiden and her army sleep and takes a flask
    of healing water flowing from her hands and feet.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage labels the act as theft later through the maiden’s demand,
    but does not explicitly call the water sacred.
- id: motif:4
  label: death blow followed by healing and revival
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The maiden strikes Ivan so that he falls and his blood stiffens, then applies
    healing water and he rises unharmed.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage depicts apparent death or near-death, but does not explicitly
    state that Ivan is dead.
- id: motif:5
  label: bride gained after pursuit and revival
  taxonomy_refs:
  - sacred_marriage
  basis: After wounding and healing Ivan, the maiden asks whether he will take her
    as wife, and he agrees to a three-year waiting period.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The marriage is promised but not completed within the supplied passage.
- id: motif:6
  label: treacherous brothers steal the prize and cast the hero below
  taxonomy_refs:
  - sibling_pair
  - hero_descent
  basis: Ivan’s elder brothers drug him, take the healing water, and throw him into
    a pit that leads to the underground kingdom.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The brothers are a group rather than a pair, so the sibling-pair taxonomy
    is only approximate.
- id: motif:7
  label: hero shelters young animals and receives grateful animal transport
  taxonomy_refs:
  - sacred_exchange
  - return
  basis: Ivan protects the young birds from a storm; their mother rewards him by carrying
    him to the upper world after he provides food and water.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The exchange is practical and reciprocal; the passage does not call it
    sacred.
- id: motif:8
  label: ascent from the underworld on a giant bird
  taxonomy_refs:
  - ascent
  - return
  - hero_descent
  basis: After entering the underground kingdom, Ivan asks the great bird to bear
    him into the upper world, and she flies him there.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The text calls the destination the upper world but does not frame the
    underground kingdom as an afterlife.
- id: motif:9
  label: destructive bride’s demand for the true water-thief
  taxonomy_refs:
  - world_destroying_fire
  - royal_legitimacy
  basis: The maiden arrives by ship demanding the man who stole the water and threatens
