canonical_text:
  quote: ''
  summary: Ivan Tsarevich seeks healing water associated with a beautiful maiden in
    a distant kingdom. With aid from an old woman, magic herbs, and a guiding ball,
    he overcomes a giant guard and reaches the maiden’s golden palace. He takes healing
    water while the maiden and her all-female army sleep. The maiden pursues, mortally
    wounds him, then revives him with the water and betroths herself to him. Ivan’s
    elder brothers drug him, steal the flask, and throw him into a pit leading to
    the underground kingdom. There Ivan shelters young birds, and their great mother
    bird carries him back to the upper world. After three years of exile caused by
    his brothers’ lies, the maiden arrives by ship, demands the man who stole the
    water, and rejects the eldest brother through her two sons.
  language: English
  quote_policy: summarized
