  quote: ''
  summary: A male figure leads others up a diamond staircase into a castle, where
    a renowned beautiful princess welcomes them. She summons the old king's other
    sons and chief courtiers, commands a horse-shoe table that opens by itself and
    produces food and drink, and the guests feast. The old king becomes satisfied
    with Mirko, gives him the kingdom and possessions, retires with the Hero of the
    Plain, and remains joyful. The royal pair live happily and have beautiful children.
