canonical_text:
  quote: ''
  summary: Tsar Svaitozar’s daughter Vassilissa Golden Tress lives secluded in a chamber
    until she is permitted to enter the garden before choosing a bridegroom. A mighty
    whirlwind carries her away across lands and rivers into the dominions of the Savage
    Serpent. Her two brothers receive their parents’ blessing to search for her, travel
    for years into the Serpent’s land, learn from an old beggar that the Serpent forbids
    speech about the princess, and approach a marvelous golden castle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tsar Svaitozar has two sons and a daughter, Vassilissa Golden Tress, who has
    lived twenty years in a bright chamber and has not been seen by princes or champions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vassilissa has many dresses and jewels; her uncovered golden hair is bound
    in a tress and falls to her feet, giving rise to the name Bareheaded Beauty.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Many Tsars hear of Vassilissa’s fame and send envoys asking for her in marriage;
    Tsar Svaitozar later announces that she will choose a bridegroom and invites royal
    suitors to his palace.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Vassilissa asks her father to let her leave the chamber and walk in the garden
    with her nurses and maidens; the Tsar permits it.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: In the meadow before a steep mountain with trees, Vassilissa plucks blue flowers,
    steps away from her nurses, and has her face and beauty uncovered.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A mighty whirlwind rises, seizes Vassilissa, carries her through the air,
    and bears her over lands, rivers, and three kingdoms into the fourth, the dominions
    of the Savage Serpent.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The nurses report to Tsar Svaitozar that the whirlwind has carried away Vassilissa;
    the Tsar is sad and angry but pardons them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The visiting princes and kings’ sons suspect the Tsar may be refusing them,
    search Vassilissa’s chamber, do not find her, receive gifts, and depart.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Vassilissa’s two brothers ask their parents’ blessing to go seek their sister;
    the Tsar blesses them and the Tsaritsa prepares them for the journey.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The two Tsareviches travel for one or two years, pass three kingdoms, see
    mountains and sandy plains in the land of the Savage Serpent, and receive no information
    from those they ask about Vassilissa.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A decrepit old beggar tells the brothers that the Savage Serpent forbids speaking
    with foreigners and forbids telling how a whirlwind bore the beautiful princess
    past the town.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The brothers infer that their sister is near and approach a golden castle
    standing on a silver pillar, with a diamond curtain and mother-of-pearl stairways
    that open and close like wings.
  category: setting
  evidence_refs:
  - ev:10
