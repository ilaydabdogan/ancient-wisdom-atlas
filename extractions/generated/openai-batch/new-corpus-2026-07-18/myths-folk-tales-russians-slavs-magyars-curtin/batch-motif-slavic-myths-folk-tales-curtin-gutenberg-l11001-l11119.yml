canonical_text:
  quote: ''
  summary: Jalmir travels with his brothers, cares for his white steed, and receives
    a warning from the horse about a castle inhabited by a sorceress and seven daughters.
    At the castle Jalmir avoids wine served by an old woman, while his brothers fall
    asleep. The old woman tests the sleepers and plans to behead them, but Jalmir
    secretly switches the brothers with the princesses; in the dark the old woman
    kills the seven princesses instead. In the morning Jalmir and his brothers flee
    on horseback.
  language: English
  quote_policy: summarized
