canonical_text:
  quote: ''
  summary: In this excerpt, the simpleton conjures a tent, bed, and a deer with golden
    horns and golden tail, then sells the deer to rival sons-in-law for their middle
    fingers. The sons-in-law present the deer to the Tsar and receive a reward while
    the simpleton returns in a degraded disguise and is mocked. The Tsar then asks
    for a golden-maned steed with a golden tail. The simpleton summons a marvellous
    horse, transforms by passing through its ear, receives aid from two youths, conjures
    the steed, and sells it to the sons-in-law for straps cut from their backs. After
    the sons-in-law are rewarded again, the simpleton claims that he obtained the
    pig, deer, and steed, and asks that the sons-in-law remove their boots.
  language: English
  quote_policy: summarized
