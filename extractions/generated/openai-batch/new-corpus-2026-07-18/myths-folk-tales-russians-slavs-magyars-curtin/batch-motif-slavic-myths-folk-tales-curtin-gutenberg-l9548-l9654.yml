canonical_text:
  quote: ''
  summary: The king repeatedly tries to have three wonderful fish cooked, but each
    attempt is interrupted by violent shaking, unseen blows that knock witnesses senseless,
    and the fish speaking among themselves before vanishing. The king then travels
    with the fisherman by means of a herb and wind-borne flight to the mountain and
    lake where the fish are caught. Exploring beyond the lake, the king meets an old
    boatman, crosses the water, and sees a beautiful castle partly hidden in the forest.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the fish are buttered in the pan, the castle or palace shakes violently
    and those present are slapped by an unseen hand until they fall senseless.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: While the witnesses are unconscious, one fish stands on its tail in the pan
    and asks the other two whether they will be food for the king or serve it.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The two other fish answer that they will serve, and all three fish vanish.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The fisherman can catch the wonderful fish only on Mondays, and on Monday
    he catches three fish at the lake on the third cast of the net.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fisherman's wife takes the fish to the palace and receives two handfuls
    of gold from the king.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The fisherman gives the king some herb received from a fiery man, takes his
    hand, stands on a stone step, and a mighty wind carries the king and fisherman
    through the air.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The king and fisherman appear on the summit of a mountain, from which the
    king sees the whole country.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The king reaches a green meadow between forest and lake and sees an old white-haired
    grandfather sitting in a boat near the shore.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The old man rows the king over the lake, and in the middle of the lake turns
    to one side, after which the king sees a grand castle half hidden in the dark
    forest.
  category: sequence
  evidence_refs:
  - ev:7
