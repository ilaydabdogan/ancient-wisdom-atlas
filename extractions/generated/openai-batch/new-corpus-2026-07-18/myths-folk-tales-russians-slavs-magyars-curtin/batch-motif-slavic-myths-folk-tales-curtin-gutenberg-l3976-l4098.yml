canonical_text:
  quote: ''
  summary: Ivan Tsarevich repeatedly sleeps through prayer times and is roused by
    an old grandmother before attending church with Peerless Beauty. Rival champions
    arrive by ship in increasing numbers to seek Peerless Beauty and mock Ivan, who
    defeats them. Peerless Beauty calls Ivan her bridegroom, and they depart. In an
    open field Ivan sleeps for nine days and nights; during this sleep Koshchéi Without-Death
    carries Peerless Beauty away. Ivan reaches Koshchéi’s kingdom, visits Peerless
    Beauty while Koshchéi is away, and tells her to ask where Koshchéi’s death is.
    Koshchéi returns and suspects Ivan’s visit.
  language: English
  quote_policy: summarized
