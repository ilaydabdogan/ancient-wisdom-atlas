canonical_text:
  quote: ''
  summary: After the princess presents Jalmir as the new king and her husband, his
    brothers accuse the couple of poisoning the old king. The people reject the accusation
    after Jalmir recounts the brothers' attempt to kill him, and the crowd burns the
    six brothers. After the funeral and betrothal feast, Jalmir remembers his steed,
    thanks him, and obeys the steed's request to cut off his head in the garden. A
    white dove flies from the severed head. Jalmir and the princess live happily and
    very long because they possess the water of life.
  language: English
