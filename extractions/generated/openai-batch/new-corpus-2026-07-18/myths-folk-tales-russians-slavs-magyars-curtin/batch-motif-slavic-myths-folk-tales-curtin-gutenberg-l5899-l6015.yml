canonical_text:
  quote: ''
  summary: 'The mayor and then the king become obsessed with Fedot the sharpshooter''s
    beautiful wife. The king orders the mayor to remove Fedot so that he can marry
    her. A Baba-Yaga advises a death-trap quest: send Fedot on a rotten ship with
    drunken sailors to fetch a deer with golden horns from a distant island. The king
    commands Fedot to perform the task under threat of beheading. Fedot''s wife uses
    a magic book to summon two unknown youths, who bring the deer before dawn. She
    tells Fedot to place the deer in a cage on the ship, sail five days, and turn
    back on the sixth. Fedot boards the ship with the caged deer and begins the voyage.'
  language: English
  quote_policy: summarized
