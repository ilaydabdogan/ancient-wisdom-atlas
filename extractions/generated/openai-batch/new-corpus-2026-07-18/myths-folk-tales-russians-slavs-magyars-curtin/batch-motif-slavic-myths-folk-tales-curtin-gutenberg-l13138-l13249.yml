canonical_text:
  quote: ''
  summary: A king's younger son seeks the world-beautiful Reed Maiden after learning
    from his brother's wife that she is hidden in the middle of three reeds on the
    seventy-seventh island of the Black Sea. The reeds are guarded by a witch whose
    life depends on them. The prince sets out, receives directions from old women
    and animal guides, and is told that only a specially nourished steed can reach
    the place and that he has three golden hairs grown from one root.
  language: English
  quote_policy: summarized
