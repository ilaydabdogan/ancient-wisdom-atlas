canonical_text:
  quote: ''
  summary: The passage opens the tale of Jalmir, the weak youngest son of a king.
    His six older brothers leave home without farewell. A white-bearded old man appears
    three times at night, instructs Jalmir to go through the southern gate to an old
    pear-tree and mount a white horse. Jalmir wakes cured, obtains his father's permission
    to leave, meets a speaking white steed, flies after his brothers, and approaches
    them incognito.
  language: English
  quote_policy: summarized
