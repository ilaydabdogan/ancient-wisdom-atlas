canonical_text:
  quote: ''
  summary: The queen asks the King of the Toads to restore the kingdom before she
    marries him publicly. When he embraces her, he is struck three times with a twig
    and frozen; the king dismembers him and throws the pieces into the water, where
    frogs eat them. The lake drains, revealing trees, a park, a city, a castle, and
    multitudes of people. The queen is beheaded. The liberated ruler gives the kingdom
    to his deliverer and dies. The new king returns to his former palace and learns
    that years have passed. A former bodyguard recognizes him, and the fisherman later
    describes the same transformation and his delayed return home. The king takes
    the fisherman with him, and they return to the new kingdom.
  language: English
  quote_policy: summarized
