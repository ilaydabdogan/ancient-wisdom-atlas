canonical_text:
  quote: '"Take this twig; it will be of use to thee."'
  summary: A king enters an apparently deserted enchanted palace after receiving a
    green twig from an old boatman. Inside he finds an old king frozen in place, whose
    wife has betrayed him with the King of the Toads. The old king recounts that his
    city and garden became a forest and lake, his subjects became fish, and the King
    of the Toads seeks magic bird eggs to give the queen immortality and youth. The
    visiting king uses the twig to immobilize the queen, disguises himself in her
    garments, deceives the King of the Toads, and asks him to remove the old king's
    spell.
  language: English
  quote_policy: quoted
