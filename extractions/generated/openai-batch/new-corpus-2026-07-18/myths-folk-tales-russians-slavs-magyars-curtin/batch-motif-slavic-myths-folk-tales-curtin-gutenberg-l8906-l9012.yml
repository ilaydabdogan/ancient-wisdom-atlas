canonical_text:
  quote: ''
  summary: The passage opens a tale about an old father, his three sons Martin, Mihal,
    and Yanek, and the family cottage. Before dying, the father warns Martin not to
    cheat the mother and brothers, and praises Yanek’s heart despite his simplicity.
    After the funeral, Martin and Mihal set out to seek fortune and, at their mother’s
    urging, take Yanek. On the road the elder brothers repeatedly begrudge Yanek food,
    while strangers show him hospitality. The brothers then pass through a forest
    and see a great castle; Yanek heads toward it, while Martin insists on leading
    because he is eldest.
  language: English
