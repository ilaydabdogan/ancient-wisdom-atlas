canonical_text:
  quote: ''
  summary: A princess plays cards with a man whose purse produces ducats. She drugs
    him with wine, steals the magic purse, and replaces it with an ordinary purse.
    After he reports the loss to his companions, the companion with a magic mantle
    borrows an unseen-making cap, abducts the princess to wild mountains, and leaves
    her near a pear-tree. She tricks him into shaking the tree; the cap and mantle
    fall, and she escapes with them. He eats pears and grows gigantic horns. After
    reaching Wind and then the eldest Wind brother, he is told that an apple will
    remove the horns. The eldest Wind asks the Lord how strongly to blow, receives
    permission to blow mightily, and carries the cured man back to the inn.
  language: English
  quote_policy: summarized
