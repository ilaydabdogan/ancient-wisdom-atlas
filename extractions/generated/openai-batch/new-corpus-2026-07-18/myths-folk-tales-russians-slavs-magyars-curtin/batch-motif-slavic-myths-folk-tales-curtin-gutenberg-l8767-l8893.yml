canonical_text:
  quote: ''
  summary: Boyislav is sealed in a lions' den but survives for a year by using a taper
    and tablecloth to produce food, taming the lions. The princess of White Island
    searches for her liberator, exposes false claimants by asking about the taper,
    and threatens the city until Boyislav is brought out. She recognizes and betroths
    him. At the feast Boyislav seeks his neglected horse, which asks to be beheaded
    to be freed; after Boyislav cuts off its head, the horse becomes a prince and
    explains a witch's enchantment affecting him and the princesses of Black Island.
  language: English
  quote_policy: summarized
