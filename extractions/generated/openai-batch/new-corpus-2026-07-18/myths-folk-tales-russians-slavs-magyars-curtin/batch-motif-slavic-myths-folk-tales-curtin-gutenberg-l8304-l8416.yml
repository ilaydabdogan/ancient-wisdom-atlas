canonical_text:
  quote: ''
  summary: A gravely ill king receives repeated dreams and a vision that he must free
    three princesses on Black Island to recover. His youngest son, Boyislav, joins
    the quest despite hostile brothers. After a sea journey, Boyislav lands alone,
    discovers a hidden opening beneath a large stone, descends into a glorious garden
    with three golden castles, and receives instructions from a famished talking horse
    about how to approach the three princesses without speaking, sharing food, or
    accepting kisses.
  language: English
  quote_policy: summarized
