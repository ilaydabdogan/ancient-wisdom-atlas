canonical_text:
  quote: ''
  summary: Mirko returns from the upper world to the Hero of the Plain, brings him
    back toward the old king, and uses diamond nails to help the Hero's horse cross
    the glass mountain. The old king receives Mirko and the Hero with a feast; after
    hearing praise of Mirko, he suggests that Mirko may not yet dare to face Doghead.
    Mirko travels north to Doghead's radiant diamond castle. Doghead's daughter turns
    Mirko and his horse to stone with her gaze, restores them with a golden rod, falls
    in love with Mirko, and tells him that Doghead's strength is kept in wine in an
    unsealed cask in the seventh cellar. Mirko drinks and destroys the remaining wine,
    then pledges to marry the princess; she agrees on condition that he spare her
    father's life if he wins.
  language: English
  quote_policy: summarized
