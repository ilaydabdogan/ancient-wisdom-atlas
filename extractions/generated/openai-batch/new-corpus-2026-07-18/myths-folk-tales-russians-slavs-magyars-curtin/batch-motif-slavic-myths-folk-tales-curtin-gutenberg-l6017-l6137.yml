canonical_text:
  quote: thou must go to the verge of destruction and bring back Shmat-Razum
  summary: 'Fedot returns early with the golden-horned deer after keeping the sailors
    drunk. The king, unable to punish him for that success, consults through the mayor
    and Baba-Yaga to send Fedot on a harder mission: to go to the verge of destruction
    and bring back Shmat-Razum. Fedot''s wife uses a magic book, gives him money instructions,
    a towel, and a rolling ball. While Fedot is away, the king tries to take his wife,
    but she turns into a blue dove and escapes. Fedot follows the ball, which becomes
    a bridge and couch, until he reaches a splendid palace where three maidens meet
    him.'
  language: English
  quote_policy: quoted
