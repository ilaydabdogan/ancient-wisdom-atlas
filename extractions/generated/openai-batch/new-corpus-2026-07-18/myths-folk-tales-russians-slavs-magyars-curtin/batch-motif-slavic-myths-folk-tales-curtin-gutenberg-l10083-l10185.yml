canonical_text:
  quote: ''
  summary: A king compares portraits brought by his sons and declares Yarmil's bride
    unequaled. Yarmil returns to the golden castle, tends an increasingly ugly toad,
    then finds the toad gone and a beautiful lady in a transformed chamber. She sends
    him silently into a cellar to retrieve twelve shirts and extinguish twelve tapers
    while ignoring wailing and a tongue-nailed man. She explains that the shirts were
    her toad skins, the tapers burned her, a wizard changed her into a toad after
    she refused him, and Yarmil must keep the details secret, especially from his
    witch mother.
  language: English
  quote_policy: summarized
