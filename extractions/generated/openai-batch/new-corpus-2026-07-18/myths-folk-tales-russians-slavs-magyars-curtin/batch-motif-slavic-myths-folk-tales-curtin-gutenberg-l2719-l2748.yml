canonical_text:
  quote: ''
  summary: A simpleton asks the Tsar to have the other sons-in-law remove boots, gloves,
    and shirts, revealing missing toes, fingers, and strips cut from their backs;
    he produces these as proof and tells the whole story. The Tsar gives him the kingdom
    and has the deceiving sons-in-law shot. The simpleton then summons a blue-brown
    cunning bay horse in an open field, passes into one ear and out the other, becomes
    a hero and beauty, and returns to live with his Tsarevna and gain wealth.
  language: English
