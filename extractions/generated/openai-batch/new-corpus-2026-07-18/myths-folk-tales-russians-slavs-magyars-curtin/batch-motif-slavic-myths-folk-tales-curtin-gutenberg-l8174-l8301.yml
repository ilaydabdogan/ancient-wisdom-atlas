canonical_text:
  quote: ''
  summary: Ivan the merchant's son identifies Vassilissa among three sets of identical
    forms, marries her, and flees with her from the Tsar of the Sea. Vassilissa uses
    transformations and thrown objects to evade pursuit. Near home, Ivan disobeys
    her warning not to kiss his godmother and forgets her. Vassilissa appears at Ivan's
    later wedding feast as a beggar; two pigeons emerge from a cake and repeat the
    forgetting episode, causing Ivan to remember and acknowledge Vassilissa as his
    wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tsar presents three identical mares; Ivan identifies his bride by noticing
    that one bridle has a dim spangle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Tsar releases three similar doves and scatters buckwheat; Ivan identifies
    one dove by its continual wing-shaking.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Tsar presents three maidens alike in face, stature, and hair; Ivan identifies
    one by her waving handkerchief, and the Tsar gives Vassilissa to him for a wedding.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ivan and Vassilissa ride away at night toward Ivan's country; the Tsar discovers
    the flight in the morning and sends pursuers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Vassilissa repeatedly tells Ivan to put his ear to the damp earth; he reports
    hearing horses or louder pursuit.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
- id: obs:6
  text: Vassilissa turns Ivan into a garden and herself into a head of cabbage, and
