  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Tsar of the Sea breaks through the forest and the mountain, but turns
    home when the towel becomes a sea blocking the road.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Vassilissa warns Ivan to kiss everyone at home except his godmother; he kisses
    his godmother and forgets Vassilissa.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Vassilissa waits on the road for Ivan, then goes to town and hires herself
    to work for an old woman.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: When Ivan plans another marriage feast, Vassilissa comes to the merchant's
    house dressed as a beggar.
  category: action
  evidence_refs:
  - ev:7
