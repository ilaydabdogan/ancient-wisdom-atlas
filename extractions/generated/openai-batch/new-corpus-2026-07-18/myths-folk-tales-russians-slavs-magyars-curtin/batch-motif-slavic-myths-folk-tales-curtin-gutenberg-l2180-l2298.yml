canonical_text:
  quote: ''
  summary: The youngest sister’s secret meetings with Bright Finist the Falcon are
    discovered by her elder sisters, who set knives at her window. Finist is wounded
    and departs. The maiden grieves, receives her father’s blessing, equips herself
    with iron shoes, staves, caps, and cakes, and travels through dark forests. She
    encounters successive turning iron huts on hen’s legs and Baba-Yaga figures, who
    question her, give her food and lodging, tell her of Finist’s distant location
    and impending marriage, and provide magical objects to use when bargaining for
    a chance to see him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder sisters watch and listen at night outside the youngest sister’s
    chamber; they overhear her conversation with Bright Finist the Falcon and see
    him leave the window and fly beyond the dark forest at daybreak.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder sisters set hidden sharp knives on the youngest sister’s window
    so that Bright Finist the Falcon may cut his colored wings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The youngest sister places her red flower on the window, lies down, and sleeps
    without knowing about the knives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bright Finist the Falcon flies to the window, cuts his left foot while springing
    in, becomes angry, rises into the sky, and flies beyond the dark forest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the morning the maiden sees two crossed knives at the window, with red
    blood dripping from them to the flower.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The maiden weeps, spends sleepless nights at the chamber window, and waves
    the bright feather in vain; Bright Finist no longer comes or sends servants.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The maiden asks her father’s blessing, orders three pairs of iron shoes, three
