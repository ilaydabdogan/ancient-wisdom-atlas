  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The maiden comes to a turning iron hut on hen’s legs and commands it to turn
    its back to the forest and its front to her.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Inside the first hut lies a Baba-Yaga stretched from corner to corner, with
