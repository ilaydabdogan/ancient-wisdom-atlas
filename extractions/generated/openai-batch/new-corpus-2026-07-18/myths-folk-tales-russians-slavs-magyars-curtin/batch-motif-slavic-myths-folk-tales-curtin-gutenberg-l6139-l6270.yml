canonical_text:
  quote: ''
  summary: Fedot the sharpshooter is recognized as the son-in-law of an old woman
    through an embroidered towel made by his wife. The old woman tries to learn the
    way to Shmat-Razum by consulting beasts, birds, sea creatures, and finally an
    old frog. The frog guides Fedot to a flaming river and a mountain cave. Fedot
    hides, observes two old men command the unseen Shmat-Razum to provide food and
    drink, then imitates them, invites Shmat-Razum to eat with him, and persuades
    him to leave the old men and serve him.
  language: English
  quote_policy: summarized
