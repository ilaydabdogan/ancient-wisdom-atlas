canonical_text:
  quote: ''
  summary: 'The passage closes one tale by saying that the Useless Wagoner marries
    the king''s daughter and becomes king. It then begins the tale of Mirko: a king
    with three sons becomes angry when they abandon schooling and sits in an eastern
    chamber with one eye weeping and one laughing. The sons ask why; the elder two
    avoid a thrown sword, while Mirko draws it from the wall and returns it to his
    father. The king explains his grief over unfit heirs and his hope for the Hero
    of the Plain, who cannot come while he must fight innumerable enemies. The elder
    and second sons each set out to try their fortune and return after a year with
    the tops of copper and silver bridges, but the king dismisses them as soft heroes.
    Mirko then seeks a suitable horse; an old witch advises him to ask for the king''s
    horn, summon the golden-haired steeds, reject them, and choose a seemingly poor
    old mare whose tail can shake the palace. Mirko asks the king for the horn and
    says no man told him about it.'
  language: English
  quote_policy: summarized
