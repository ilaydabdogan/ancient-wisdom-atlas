  quote: ''
  summary: A threatening maiden demands the guilty man. After the Tsar sends the second
    son unsuccessfully, the youngest Tsarevich is found. He agrees to go to the maiden's
    ship only if a crystal bridge is built with food and drink set out on it. He brings
    his comrades, and while he is on the bridge, the maiden's little boys identify
    him as their father and lead him to her. After a reunion, the truth is reported
    to the Tsar, who expels his eldest sons and lives prosperously with Ivan.
