canonical_text:
  quote: ''
  summary: The king's son creates a marvelous rotating palace and lives there with
    the fair princess. A jealous merchant's daughter disguises herself as an old woman,
    gains access while the king's son is at war, removes the princess's newborn boy
    and girl, abandons them in a basket under a tree, and falsely reports that they
    were monsters thrown into the river. A white deer carries the basket to the Forest
    Maiden, who raises the children for seven years. After the children break green
    water-jugs while pursuing a golden bird at a well, the bird tells them their true
    parents live beyond green mountains and leads them away. On the journey the children
    find gold and dice, and the boy wins money from three lords at an inn; one lord
    then wagers a magic flower-garden and marble palace that can become a golden apple
    by means of a golden rod.
  language: English
  quote_policy: summarized
