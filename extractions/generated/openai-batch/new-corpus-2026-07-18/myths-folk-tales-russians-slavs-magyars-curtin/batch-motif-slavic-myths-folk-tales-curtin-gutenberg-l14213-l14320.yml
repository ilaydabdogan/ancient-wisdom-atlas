- id: obs:4
  text: 'The Green King states a third trial: by the next day Miklos and his companions
    must eat 366 cattle and drink 366 kegs of wine, or be put to the stake; if they
    succeed, the Green Daughter will be given to Miklos.'
  category: speech
  evidence_refs:
