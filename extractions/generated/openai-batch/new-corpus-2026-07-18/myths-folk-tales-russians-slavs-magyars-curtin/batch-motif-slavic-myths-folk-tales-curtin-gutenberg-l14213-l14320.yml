canonical_text:
  quote: ''
  summary: 'The Green King sets further ordeals for Kiss Miklos and his companions:
    surviving a superheated iron furnace, then eating 366 cattle and drinking 366
    kegs of wine. Great Freezer, Great Eater, and Great Drinker accomplish the tasks.
    The Green King gives his Green Daughter to Miklos, but on the road she questions
    whether Miklos is taking her for himself or another, then disappears from the
    coach. Far Seer searches the earth and sea and sees her hidden in the belly of
    a three-pound whale.'
  language: English
  quote_policy: summarized
