canonical_text:
  quote: ''
  summary: Yarmil repeatedly returns from a hidden castle realm to his father’s court
    with objects supplied from the pan where the toad is kept. A written message directs
    him to take a diamond-set casket as a gift; the casket contains riches and a magical
    mirror attended by a puppet, surpassing his brothers’ gifts. The king then commands
    his sons to return in a year and a day with portraits of their princesses. Yarmil
    goes back through the mouse-hole entrance to the golden castle, cares for the
    toad, and receives another written message saying that the portrait is in the
    pan.
  language: English
  quote_policy: summarized
