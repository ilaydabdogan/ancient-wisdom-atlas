canonical_text:
  quote: this terribly high mountain, which in front of my hut supports the heavens
  summary: An old woman gives the king's son three wondrous golden hairs and a latch-string,
    instructing him to climb a mountain that supports the heavens and summon a magic
    steed. The steed appears from a fiery cloud and says they must first seek a burning
    ray from the Sun's antechamber. On the journey, two bearded wolves at the portals
    of the earth demand flesh as toll, and the king's son cuts flesh from himself
    to pass. In the Sun's antechamber a subject-spirit blows him into a dark cavern
    where thunderbolts are made. At an iron gate guarded by a hundred-headed dragon,
    the king's son plays a magic flute; the dragon becomes gentle and lets him pass
    over its back.
  language: English
  quote_policy: quoted
