canonical_text:
  quote: ''
  summary: Boyislav rests with his speaking horse, returns toward his birthplace,
    and is warned that his father has condemned him. He enters the city, is seized,
    and is imprisoned. The passage explains that his brothers abandoned him, forced
    the three princesses of Black Island to swear a false account naming the brothers
    as liberators, and manipulated the king into ordering Boyislav's death. An old
    warrior risks punishment by asking mercy for Boyislav; the king is moved but changes
    the sentence from hanging to confinement with lions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The horse tells Boyislav to come down and rest; the horse goes to a green
    meadow while Boyislav lies on the grass, falls asleep, and thinks sorrowfully
    of the princess of White Island.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The horse and Boyislav travel until they see a great city; the horse identifies
    it as Boyislav's birthplace and warns that Boyislav's father has pronounced a
    death sentence against him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Boyislav disbelieves the warning and asks the horse to go quickly so he may
    embrace his father.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Boyislav enters his native place, an officer seizes the horse's bridle,
    the surrounding people seize Boyislav's arms, and Boyislav asks whether they know
    he is their prince.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The crowd says Boyislav will die the next day; by command of the king, Boyislav
    is cast into a dark dungeon and his horse is shut in a pen.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator explains that the king is enraged because Boyislav's other brothers
    told lies after leaving him behind when he returned for his horse.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brothers force the three princesses of Black Island to swear that the
    brothers were the liberators and that Boyislav had joined himself to a worthless
    woman and mocked his father.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The brothers agree to cast lots for the princesses; the princesses say they
    will not break their oaths but also will not become the wives of such men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The king recovers when the Black Island princesses are freed, welcomes his
    sons and the princesses, hears the forced story, orders Boyislav's death, and
    offers a reward for his capture.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The princesses pass their time in silent grief; when the king asks about their
    sorrow, the brothers evade the question and redirect his anger toward Boyislav.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: While Boyislav is imprisoned, his brothers continue to stir the king to forbid
    anyone to ask mercy for Boyislav under pain of death.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: An old warrior, formerly a commander and still a friend of the king, doubts
    Boyislav's guilt and resolves to ask pardon despite the danger.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The old warrior asks mercy for Boyislav, acknowledges that he is risking death,
    and tells the king that giving his own blood to the hangman would disgrace him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The old warrior questions whether Boyislav is guilty and points to the strange
    conduct of the Black Island princesses; the king decides not to give Boyislav
    to the hangman but orders him confined with lions to be torn.
  category: speech
  evidence_refs:
  - ev:10
