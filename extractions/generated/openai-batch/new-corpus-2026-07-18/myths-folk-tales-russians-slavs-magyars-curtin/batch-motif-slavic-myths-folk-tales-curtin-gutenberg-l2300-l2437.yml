- id: ev:12
  type: summary
  locator: lines 2300-2437, merchant's sons introduced
  quote_or_summary: 'A merchant has three sons: two elder crafty sons and a youngest
    simpleton. The elder sons set out for the Tsarevna; the fool also prepares and
    is mocked, then follows on a poor mangy little horse.'
  source_text_path: texts/public-domain/slavic/project-gutenberg/myths-folk-tales-russians-slavs-magyars-curtin.md
  rights_note: Public domain source; short summary from provided passage.
- id: ev:13
  type: quote
  locator: lines 2300-2437, simpleton summons steed
  quote_or_summary: '"Oh, blue-brown, cunning bay, stand before me as leaf before
    stem!" A splendid steed rushes up and the ground trembles.'
  source_text_path: texts/public-domain/slavic/project-gutenberg/myths-folk-tales-russians-slavs-magyars-curtin.md
  rights_note: Public domain source; brief quotation and summary from provided passage.
