canonical_text:
  quote: ''
  summary: 'The passage concludes an episode in which a maiden reaches Bright Finist
    the Falcon''s kingdom, repeatedly bargains with a Tsar''s daughter to see him,
    and finally wakes him by discovering a magic pin. Finist then asks an assembly
    to judge between the woman who sold him and the woman who bought him. The passage
    then begins another tale: a Tsar offers his daughter and half the kingdom to whoever
    can kiss her through twelve windows; a mocked youngest son summons a magical bay
    horse, is transformed into a beautiful hero, and attempts the challenge.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A maiden is given a swift steed, rides onward as the forest grows thinner,
    and comes before the blue sea and the distant golden summits above white-walled
    chambers identified as Bright Finist the Falcon's kingdom.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the sea shore, the maiden hammers diamond nails with a golden hammer; the
    Tsar's daughter wants to buy them, and the maiden asks only to look at Bright
    Finist the Falcon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Tsar's daughter takes the hammer and nails, places a magic pin in Bright
    Finist the Falcon's clothes so that he sleeps more soundly, and allows the maiden
    to be brought to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The maiden weeps over Bright Finist the Falcon but cannot wake him; after
    the Tsar's daughter removes the pin, he wakes and says he sensed someone weeping
    and speaking near him, while the Tsar's daughter denies anyone was there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: On the next day the maiden rolls a diamond ball on a golden plate and again
    exchanges the objects for access to Bright Finist the Falcon, while the Tsar's
    daughter again uses the magic pin to keep him asleep.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: On the third day the maiden feeds her steed glowing coals; the Tsar's daughter
    wants the fire-eating steed and agrees to another exchange for a look at Bright
    Finist the Falcon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Tsar's daughter puts the pin in Bright Finist the Falcon's hair; the maiden
    later looks in his head, the pin falls out, and he wakes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: After waking, Bright Finist the Falcon hears the maiden's account of her sisters'
    envy, her wandering, and her exchanges with the Tsar's daughter.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Bright Finist the Falcon calls boyars, princes, and people of every degree
    and asks whether he should live with the wife who sold him or the woman who bought
    him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The assembly decides that Bright Finist the Falcon should take the woman who
    bought him and that the one who sold him should be hanged on the gate and shot;
    the passage states that he did this.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A new tale begins with a Tsar who has a daughter, Tsarevna Priceless Beauty,
    and announces that whoever kisses her through twelve windows will marry her and
    receive half the kingdom.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: 'A merchant has three sons: two elder sons described as crafty and a youngest
    son called a simpleton; the elder brothers mock the youngest when he prepares
    to go to the Tsar''s palace.'
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: The simpleton rides into the field on a poor mangy horse and summons a 'blue-brown,
    cunning bay'; a splendid steed rushes up and the ground trembles.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The simpleton enters one ear of the splendid steed and exits the other, becoming
    an extraordinary beauty; he rides to the Tsar's palace and breaks six panes of
    glass.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: After the palace attempt, the simpleton returns to the field, passes again
    through the steed's ears, resumes his former simpleton appearance, goes home,
    and lies on the stove.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The brothers return home and report that a hero broke through six panes of
    glass; when the simpleton suggests it was he, they reject and mock the claim.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:17
  text: On the next day the brothers prepare again for the palace, mock the simpleton
    again, and he again goes to the field and calls the blue-brown bay.
  category: sequence
  evidence_refs:
  - ev:17
