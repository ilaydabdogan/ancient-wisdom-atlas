canonical_text:
  quote: ''
  summary: Ivan Tsarevich and the Gray Wolf seize Princess Yelena from a garden. Ivan
    and Yelena fall in love, but Ivan is expected to give her to Tsar Afron in exchange
    for a golden-maned steed. The Gray Wolf transforms into Yelena, is exchanged for
    the steed, escapes after Ivan remembers him, and then later transforms into a
    golden-maned steed so Ivan can obtain the Fire-bird and golden cage from Tsar
    Dolmat. The false steed throws Dolmat, becomes the Gray Wolf again, and rejoins
    Ivan.
  language: English
  quote_policy: summarized
