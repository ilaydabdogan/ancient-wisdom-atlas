canonical_text:
  quote: "“In the silken meadow under the seventh bush is a hare, under the tail of
    the hare an egg, in the egg a hornet, and in the hornet is hidden my strength.”"
  summary: The Green Daughter provokes the Lead Friend into revealing that his strength
    is hidden in a hornet inside an egg attached to a hare beneath the seventh bush
    in a silken meadow. She tells Kiss Miklos, who becomes a hound, finds the hare,
    breaks the egg, kills the hornet, and thereby causes the Lead Friend to lose strength
    and die. Kiss Miklos and the Green Daughter marry and return in a glass-and-gold
    chariot, after which the sun and moon shine joyfully.
  language: English
  quote_policy: quoted
