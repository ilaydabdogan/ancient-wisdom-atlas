canonical_text:
  quote: ''
  summary: Kiss Miklos destroys dragon-linked dangers hidden in a spring and a pear-tree,
    helps kill the mother of dragons by pouring boiling lead into her vast mouth,
    but is then overpowered and enslaved by the Lead-Melting Friend, who demands that
    he bring the Green Daughter of the Green King. Miklos's brothers return home with
    the steeds carrying the moon and sun, receive royal rewards, and release the celestial
    bodies, which shine sadly because Miklos remains unrewarded and enslaved.
  language: English
  quote_policy: summarized
