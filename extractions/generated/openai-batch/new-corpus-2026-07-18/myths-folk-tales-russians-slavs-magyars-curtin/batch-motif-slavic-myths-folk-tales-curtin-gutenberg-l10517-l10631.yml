canonical_text:
  quote: ''
  summary: Twelve cuirassiers desert and enter an open castle in the mountains where
    food, stabling, beds, and caskets are prepared for twelve. An old sorceress warns
    them not to look into the caskets. Nine disobey at midnight and die along with
    their horses; the three who obey are later permitted to open their caskets and
    receive a cap of invisibility, a flying mantle, and a purse producing ducats.
    They leave, reach a town, and learn of a princess who defeats all card players
    and has losers flogged; the man with the purse goes to challenge her.
  language: English
  quote_policy: summarized
