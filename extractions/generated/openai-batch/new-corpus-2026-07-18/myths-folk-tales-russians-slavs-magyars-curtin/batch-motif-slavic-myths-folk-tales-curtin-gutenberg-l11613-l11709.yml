canonical_text:
  quote: ''
  summary: Jalmir obtains supplies from the king and uses them to secure the giants'
    help in carrying the princess's golden castle to the king's garden. The princess
    then says the castle is useless without its key; Jalmir consults his steed, blows
    a fish-whistle, and fish retrieve the key from the sea. The princess next demands
    the water of death, the water of life, and the water of youth from her island.
    Sent again with his steed, Jalmir delays on the dam; the sea rises, destroys the
    dam, and Jalmir disappears while the steed cannot help him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jalmir receives what he asks from the king, travels with wagons, and gives
    loaves, wine, and meat to the giants while asking them to bring the golden castle
    to the princess.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The giants eat the supplied food, pull up three strong trees, move the golden
    castle from its foundations, carry it on oak-trees and their shoulders, and put
    it in the king's garden at night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At sunrise people in the castle shout that there is fire, but the princess
    says the object in the garden is her golden castle.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the king claims the princess, she answers that she is not yet his because
