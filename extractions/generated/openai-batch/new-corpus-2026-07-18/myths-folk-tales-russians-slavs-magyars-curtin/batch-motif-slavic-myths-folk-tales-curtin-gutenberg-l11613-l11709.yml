  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Jalmir consults his steed; the steed says the key is in the sea near the dam,
    and Jalmir flies to the island and blows a whistle associated with a fish he had
    helped.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Fish search under water; a little fish finds the key, brings it to the chief
    fish, and the chief fish gives it to Jalmir.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The princess says that life in the golden castle would require the water of
    death, the water of life, and the water of youth, and she says these are on her
    island.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The king first goes to the brothers instead of Jalmir, but the brothers convince
    him to ask Jalmir to perform the last service.
  category: relationship
  evidence_refs:
  - ev:8
