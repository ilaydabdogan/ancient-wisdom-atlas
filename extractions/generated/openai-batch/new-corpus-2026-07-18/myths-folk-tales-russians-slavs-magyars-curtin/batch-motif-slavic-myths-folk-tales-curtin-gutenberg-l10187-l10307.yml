canonical_text:
  quote: ''
  summary: Yarmil and the liberated princess leave a castle by carriage, pass a gate,
    and arrive at the king's castle, where the princess outshines the other brides.
    The queen questions Yarmil about the bride's origin, learns that she had been
    in toad form and in skins, then steals and burns twelve shirts and tapers from
    the bride's chamber. The bride says Yarmil has disclosed the forbidden matter,
    vanishes to the glass mountain, and Yarmil resolves to search for her despite
    uncertainty about the mountain's location.
  language: English
  quote_policy: summarized
