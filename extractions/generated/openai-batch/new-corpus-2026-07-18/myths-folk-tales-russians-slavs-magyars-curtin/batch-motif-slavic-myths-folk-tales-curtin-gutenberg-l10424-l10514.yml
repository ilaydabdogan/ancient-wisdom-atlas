canonical_text:
  quote: ''
  summary: 'Yarmil is assigned three deadly impossible tasks by an angry sorceress:
    clearing a forest, carrying away a mountain or hill, and bailing out a fish-pond
    with inadequate tools. A princess brings him food, comforts him, and secretly
    performs the tasks through powder, mysterious words, and invisible hands while
    he sleeps. She then warns him that the sorceress will appear as storm-darkness;
    he strikes the blackest spot with his sword, killing her. Yarmil returns to his
    father, where the queen is punished, and later travels with his wife to their
    kingdom, where a mouse-hole has become a gate to a city and golden castle, and
    the people thank him for their liberation.'
  language: English
  quote_policy: summarized
