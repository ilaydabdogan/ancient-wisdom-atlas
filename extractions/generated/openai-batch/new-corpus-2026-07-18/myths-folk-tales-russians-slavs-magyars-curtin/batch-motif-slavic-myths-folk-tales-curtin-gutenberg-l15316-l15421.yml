canonical_text:
  quote: ''
  summary: A king's son rejects the non-golden world-sweetly speaking bird and is
    turned to stone when he reaches for a golden-feathered bird. His sister Marishka
    searches for him, receives a golden rod from a devil guard, enters an enchanted
    castle, takes a rusty cage, strikes her brother with the rod, and escapes. The
    siblings place the sweetly speaking bird on a wondrous tree, where its song rejuvenates
    hearers and increases the garden's fame. An old witch prevents the king from visiting
    by making him sick, then visits the garden herself and urges the king's son to
    seek a world-silver lake with world-golden fish, beginning another quest through
    guarded enchanted castles.
  language: English
  quote_policy: summarized
