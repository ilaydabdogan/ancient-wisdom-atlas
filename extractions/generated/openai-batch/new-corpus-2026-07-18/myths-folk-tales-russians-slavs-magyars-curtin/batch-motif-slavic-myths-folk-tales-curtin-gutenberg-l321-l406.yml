canonical_text:
  quote: ''
  summary: The introduction argues that Indigenous and other oral traditions preserve
    extensive mythic, religious, and philosophical material. The author uses Morning-star
    traditions to illustrate parallel mythic development, describing Latin Lucifer
    as Light-bringer, a personal observation of the Morning-star as a possible source
    for a Prince of Darkness image, and a Modoc story in which the Morning-star summons
    a burned sky-sun personage back to life each morning from an indestructible golden
    disk.
  language: English
  quote_policy: summarized
