canonical_text:
  quote: ''
  summary: Kiss Miklos prepares his brothers for the arrival of the steed of the sun
    bearing a twenty-four-headed dragon and the shining sun. He fights the dragon
    on a golden bridge; after sword combat fails because the heads regrow, the two
    turn into red and blue flames. With his brothers' use of a sulphur stone, Miklos
    defeats the dragon. He then becomes a gray cat, enters the cabin of the dragons'
    mother and wives, and overhears their intended transformations into deadly obstacles.
    He escapes, returns to human form, rejoins his brothers, and the homeward journey
    reaches a moment of thirst near a bubbling spring.
  language: English
  quote_policy: summarized
