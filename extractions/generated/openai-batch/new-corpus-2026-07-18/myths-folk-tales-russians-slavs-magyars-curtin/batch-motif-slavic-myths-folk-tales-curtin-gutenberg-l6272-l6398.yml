canonical_text:
  quote: ''
  summary: Fedot returns from his mother-in-law with Shmat-Razum, who carries him
    by whirlwind, creates a sea island and golden pleasure-house, helps him exchange
    the servant temporarily for three magical objects, then returns to him. The merchants
    lose the servant and the island vanishes. Fedot reaches his kingdom, where Shmat-Razum
    builds a splendid palace and the magic box produces a garden around it.
  language: English
  quote_policy: summarized
