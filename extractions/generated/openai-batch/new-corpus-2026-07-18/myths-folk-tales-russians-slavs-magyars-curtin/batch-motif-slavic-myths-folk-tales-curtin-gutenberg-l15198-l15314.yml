canonical_text:
  quote: ''
  summary: A king's son uses a golden rod to enter an enchanted castle, avoids temptations,
    circles a wondrous sounding tree, and returns with the tree appearing in the home
    garden. An old witch drugs the king and induces the children to seek a world-sweetly
    speaking bird. The boy departs, consults devils at successive enchanted castles,
    receives instructions from the eldest lame devil, and enters another enchanted
    castle where the desired bird sits sadly in a rusty cage among splendid singing
    birds.
  language: English
  quote_policy: summarized
