canonical_text:
  quote: "“My death is in an egg, the egg is in a duck, and the duck is in a stump
    floating on the sea.”"
  summary: Peerless Beauty questions Koshchéi Without-Death about the location of
    his death. After false answers, he reveals a nested external death hidden in an
    egg, inside a duck, inside a stump on the sea. Ivan Tsarevich spares a hawk, a
    bear, and a pike; each later helps him obtain the egg. Ivan breaks the egg, Koshchéi
    dies, and Ivan returns with Peerless Beauty for a royal wedding.
