canonical_text:
  quote: ''
  summary: Ivan the Fool seeks the Tsar's daughter in marriage. The Tsar sets an apparently
    impossible task involving a golden road, a gold-and-silver bridge, rare birds,
    and a wax church with wax apple-trees. Ivan summons twelve thousand men from a
    ring with twelve screws, and the task is completed overnight. After marriage,
    the Tsarevna learns the ring's secret, conspires with a servant, steals the ring,
    and has the castle transported beyond the sea, leaving Ivan in an old cabin. The
    Tsar rejects and imprisons Ivan in a stone pillar. Ivan's cat and dog feed him,
    cross the sea, and the cat steals the ring from a glass box.
  language: English
  quote_policy: summarized
