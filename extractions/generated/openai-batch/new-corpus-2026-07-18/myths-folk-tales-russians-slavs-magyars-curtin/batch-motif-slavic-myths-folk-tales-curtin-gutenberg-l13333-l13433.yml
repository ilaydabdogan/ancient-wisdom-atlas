canonical_text:
  quote: ''
  summary: A king's son is aided by Dawn, daughter of the Sun, who carries him across
    celestial places, hosts him, and gives him a boxed burning ray. His speaking steed
    tells him to cut three reeds in one blow and not open them before reaching water.
    On the dark island of the Black Sea the ray lights his way; he cuts the reeds,
    killing the witch whose life depended on them, and the island is lit. Later curiosity
    makes him split the smallest reed, releasing the youngest attendant of the Reed
    Maiden, who immediately asks for water to avoid death.
  language: English
  quote_policy: summarized
