canonical_text:
  quote: ''
  summary: 'A merchant, a king, and a poor man each become lost in a dense wild wood.
    A speaking hedgehog leads each out after promises of reward: the merchant and
    king pledge daughters and coin, while the poor man pledges to adopt and care for
    the rescuer. The hedgehog later comes to the poor man''s house, claims the role
    of adopted son, asks for a bed, and insists on eating at the table rather than
    under a bench by the fire.'
  language: English
  quote_policy: summarized
