canonical_text:
  quote: ''
  summary: The king's son opens reeds before he has water, causing two reed-hidden
    maidens to die and be buried with black roses growing from their reed grave-marks.
    His steed prevents him from opening the final reed until they reach a lake, where
    the Reed Maiden survives after drinking water and pledges herself to him. While
    he goes for a glass and gold carriage, a gypsy girl discovers the hidden maiden
    in a willow, steals her robe, throws her into the water, and takes her place.
    The maiden becomes a golden duck, evades stones and arrows, and the king's son
    unknowingly brings the false bride home, surprising the wedding guests.
  language: English
  quote_policy: summarized
