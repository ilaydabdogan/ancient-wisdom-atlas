canonical_text:
  quote: ''
  summary: Boyislav rejects the advances and hospitality of three princesses at three
    castles, gathers the remnants of food, and returns to his speaking horse. The
    horse reveals that the princesses had been enchanted by a sorceress to alternate
    between horse and princess form, and Boyislav brings them to his brothers' boat.
    The horse then reveals the brothers have left and had plotted to kill him. Following
    the horse's instructions, Boyislav plucks exactly four golden apples, throws one
    into the sea to make a long road rise from the water, travels toward Red Island,
    and obtains a long slender rope from a king by refusing richer gifts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the first castle, a princess seats Boyislav at a table with food and drink,
    speaks of his home, and he ignores her, pushes her aside, takes the remaining
    food, and leaves.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the second castle, a more beautiful princess greets Boyislav, gives him
    food and drink, moves to kiss him, and he pushes her to the floor, takes the remaining
    food, and leaves.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the third castle, Boyislav is amazed by the princess's beauty but remembers
    the horse's words, pushes her away, eats and drinks, pushes her from the meal,
    gathers food remnants, and runs off while she calls after him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Boyislav spreads the food remnants on a rock, and the horse eats them eagerly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The horse says the three princesses are free, that they were the horses seen
    running around Boyislav, and that a wicked sorceress enchanted them to be horses
    for twelve hours and princesses for twelve hours.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Boyislav brings the three princesses to his brothers in the boat, and the
    princesses thank him with tearful eyes for their liberation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The horse tells Boyislav that his brothers have gone and that, if he had gone
    on the boat, his death would have been certain because they had conspired to kill
    him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The horse tells Boyislav to go to the garden of the first castle and pluck
    four golden apples, specifying only four.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Boyislav sees the garden and the tree with golden apples, plucks four, wants
    more, but the horse's fierce neighing makes his outstretched arm drop and he returns.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The horse carries Boyislav to the sea, commands him to throw in an apple,
    and after Boyislav obeys, a five-hundred-mile road rises out of the sea and they
    travel on it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The horse says they are going to Red Island, where a king has a very ugly
    daughter, and instructs Boyislav to say he seeks a bride, must consult his father,
    and should accept only a piece of rope for the horse's bridle.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: On Red Island, Boyislav is received at the king's castle, says he is searching
    for a bride, and is led to the king's daughter, whose ugliness frightens him.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The king offers Boyislav gold and silver, then a splendid bridle and saddle,
    but Boyislav asks only for a piece of rope to repair his horse's bridle and says
    rich road equipment attracts robbers.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The king gives Boyislav a very slender and very long rope; Boyislav wraps
    it around the horse, then the horse tells him to throw a second apple into the
    sea, and Boyislav expresses reluctance.
  category: sequence
  evidence_refs:
  - ev:14
  - ev:15
