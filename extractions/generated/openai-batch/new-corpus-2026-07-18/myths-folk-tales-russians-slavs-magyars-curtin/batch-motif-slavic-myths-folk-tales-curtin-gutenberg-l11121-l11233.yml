canonical_text:
  quote: ''
  summary: After Jalmir and his brothers escape beyond the sorceress's lands, Jalmir
    reveals himself as their brother and is met with growing coldness. His speaking
    white steed warns him about the results of this disclosure and promises advice.
    The brothers enter a king's service, become jealous of the king's favor toward
    Jalmir, and use books in the king's castle to learn that the kingdom lacks birds.
    They persuade the king to command Jalmir to bring birds. Jalmir seeks help from
    the white steed, who carries him at dusk back to the sorceress's castle and instructs
    him to ignore splendid cages and take a wooden cage containing a mean-looking
    bird.
  language: English
  quote_policy: summarized
