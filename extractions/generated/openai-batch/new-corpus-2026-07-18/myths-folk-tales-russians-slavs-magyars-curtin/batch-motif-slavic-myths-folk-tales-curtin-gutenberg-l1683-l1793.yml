canonical_text:
  quote: ''
  summary: Ivan parts from the Gray Wolf, then rests with Princess Yelena, the golden-maned
    steed, and the caged Fire-bird near his home. His brothers Dmitri and Vassili
    find him asleep, kill and dismember him, coerce Yelena to lie, and take the princess,
    steed, and Fire-bird. The Gray Wolf obtains the water of death and the water of
    life from a raven by holding a young raven hostage, tests the waters on the young
    raven, and revives Ivan. Ivan returns to his father’s kingdom, where Yelena recognizes
    him as her true bridegroom and tells the truth. Tsar Vwislav imprisons Dmitri
    and Vassili, and Ivan marries Yelena.
  language: English
  quote_policy: summarized
