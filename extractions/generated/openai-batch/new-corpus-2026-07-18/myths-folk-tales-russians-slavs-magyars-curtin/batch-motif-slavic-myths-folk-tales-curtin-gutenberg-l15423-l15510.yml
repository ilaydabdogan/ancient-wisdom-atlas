canonical_text:
  quote: ''
  summary: An unnamed speaker instructs the king's son to use a golden rod to enter
    an enchanted castle and avoid calls, maidens, food, drink, treasure, snakes, and
    toads while circling a silver lake three times. The king's son obeys, escapes
    just before the wall closes, and the silver lake appears in the home garden with
    golden fish. The king and queen visit the garden and palace wonders, see the brother
    and sister, receive golden apples, and later recognize the children as their own
    when a covered picture is unveiled. The king then seizes an old witch or sinner,
    ties her to a tree, and piles a sulphur fire beneath her.
  language: English
  quote_policy: summarized
