canonical_text:
  quote: ''
  summary: A cat and dog swim across the sea with a ring, lose it in the water, and
    later recover it from a fish. They bring the ring to Ivan, who unscrews its twelve
    screws and summons twelve thousand men. Ivan commands them to destroy a stone
    pillar and restore his castle from beyond the sea. He then elicits a judgment
    from the Tsar against a wife and her lover; the Tsar's daughter and the servant
    are found asleep in the restored castle and punished according to that judgment.
    Ivan marries a beautiful maiden whom he had saved from fire.
  language: English
  quote_policy: summarized
