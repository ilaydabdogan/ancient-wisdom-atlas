canonical_text:
  quote: ''
  summary: Ivan the merchant's son serves the Tsar of the Sea and is repeatedly endangered
    by Chumichka the cook's false reports. Vassilissa the Cunning secretly helps Ivan
    complete impossible overnight tasks, including clearing and cultivating a forest
    to make breakfast cakes and building a flying ship. Ivan kills Chumichka during
    the flight. The Tsar then orders Ivan to break an unridden stallion; Vassilissa
    reveals that the stallion will be the Tsar himself and tells Ivan how to subdue
    him. After the ride, the Tsar makes Ivan choose a bride, and Vassilissa gives
    him signs for recognizing her among transformed and identical sisters.
  language: English
  quote_policy: summarized
