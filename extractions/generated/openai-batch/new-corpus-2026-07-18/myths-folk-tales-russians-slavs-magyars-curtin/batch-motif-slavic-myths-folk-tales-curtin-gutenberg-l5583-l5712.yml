canonical_text:
  quote: ''
  summary: 'Vassilissa tricks Koshchéi Without-Death into revealing that his death
    is hidden far away inside nested containers and animals: an egg inside a duck,
    inside a hare, inside a chest under an oak on an island in the ocean. Vassilissa
    tells Ivan Tsarevich and Bulat the hero, who travel to find it. Along the way
    Bulat spares a dog, an eagle, and a lobster, each of whom later helps recover
    a stage of the hidden death. The egg is retrieved and used to kill Koshchéi. Ivan
    takes Vassilissa homeward. On three nights Bulat keeps watch and sees twelve doves
    become maidens who announce revenge prophecies involving Ivan’s favorite dog,
    horse, and cow, with warnings that anyone who tells Ivan will turn progressively
    to stone. Ivan returns home, marries Vassilissa, and prepares to show her his
    favorite dog.'
  language: English
  quote_policy: summarized
