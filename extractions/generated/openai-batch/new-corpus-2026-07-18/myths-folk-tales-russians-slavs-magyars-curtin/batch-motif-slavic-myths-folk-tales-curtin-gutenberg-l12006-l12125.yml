  quote: ''
  summary: A poor man seeking the black castle of the King of the Crows receives guidance
    from a reckoning swineherd, enters a dangerous whirling stone-walled castle using
    a shining axe, is hosted by the King, asks for a salt-mill as payment for two
    lean cows, refuses alternate gifts, sees a crow soldier transform into a young
    man, and finally receives the mill after three refusals; the King reveals that
    the mill accomplishes all wishes.
  language: English
