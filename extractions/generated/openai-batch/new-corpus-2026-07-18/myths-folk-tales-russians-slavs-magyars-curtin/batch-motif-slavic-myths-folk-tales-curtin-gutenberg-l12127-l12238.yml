canonical_text:
  quote: ''
  summary: A poor man returns from the King of the Crows with a wish-granting mill.
    He feeds herdsmen, meets a fat man in a wild wood, exchanges the mill for a deadly
    knotty club, and uses the club against the fat man. After seven years he reaches
    home, where the mill produces food, music, guests, and a palace. The king and
    nobles join the feast, but a sealed letter announces the approach of a destructive
    Turk-Tartar army.
  language: English
  quote_policy: summarized
