canonical_text:
  quote: ''
  summary: Yanek uses a magic pack to summon soldiers and recover a food-producing
    table after exchanging it with old men. He obtains a bag able to produce castles,
    returns to the capital in a ragged disguise, and secretly uses the bag, pack,
    and table at night while lodging in his brothers' stable. He later reveals the
    table to his brothers, and the king asks to borrow it for three days; Yanek agrees
    but threatens war if it is not returned.
  language: English
  quote_policy: summarized
