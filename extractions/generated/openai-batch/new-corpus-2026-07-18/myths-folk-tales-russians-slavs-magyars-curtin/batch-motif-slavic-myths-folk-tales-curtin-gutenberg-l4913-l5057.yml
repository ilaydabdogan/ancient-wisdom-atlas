canonical_text:
  quote: ''
  summary: A terrible Tsar announces a reward for anyone who can find him an extraordinarily
    beautiful bride. Nikita Koltoma boasts that he can do it, is summoned, and accepts
    the task under threat of death. After a month of carousing on a royal order, he
    asks for twelve matched youths and thirteen embroidered tents, then departs with
    the Tsar. On the road he tests massive iron staffs made at two forges; both break
    against his hand. At a third forge, blacksmiths are beating a gray-haired old
    man over unpaid debts.
  language: English
  quote_policy: summarized
