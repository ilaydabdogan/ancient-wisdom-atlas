canonical_text:
  quote: ''
  summary: 'The Lead Friend tells Miklos to bring the Green Daughter of the Green
    King in exchange for freedom and removal of a heavy ring and chain. Miklos travels
    across many kingdoms, gathering six extraordinary companions: Swift Runner, Great
    Drinker, Great Eater, Great Freezer, Far Seer, and Far Caster. The seven arrive
    at the Green King''s castle, where Miklos greets the king.'
  language: English
