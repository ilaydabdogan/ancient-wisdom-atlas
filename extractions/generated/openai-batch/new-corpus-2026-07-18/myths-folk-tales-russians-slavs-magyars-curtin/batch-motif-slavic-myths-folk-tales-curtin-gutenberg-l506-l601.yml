canonical_text:
  quote: ''
  summary: 'The passage first discusses comparative Morning-star myths, including
    the Morning-star as Light-bearer, as opponent or rebel against the sun, and as
    later moralized material associated with Milton. It then explains that myth-tale
    heroes were originally non-human forces of nature and gives a compressed Native
    American wind myth: Northeast winds defeat and kill Southwest winds, abuse surviving
    grandparents, and are later defeated by a posthumous, miraculously fast-growing
    Southwest hero.'
  language: English
  quote_policy: summarized
