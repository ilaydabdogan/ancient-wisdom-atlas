canonical_text:
  quote: ''
  summary: A Tsar asks Simeon the Thief to steal Tsarevna Yelena the Beautiful from
    a distant kingdom. The seven Simeon brothers depart together, using an iron pillar
    for distant sight, a large oak turned into a ship for sea travel, and a trained
    cat unknown in Yelena's kingdom to gain access to her. Simeon gives the cat to
    Yelena, visits her, invites her to his ship to see costly brocades, and asks her
    to dismiss her attendants.
  language: English
  quote_policy: summarized
