canonical_text:
  quote: ''
  summary: Yanek discovers that the king has kept his food-producing table and sent
    back a counterfeit. He threatens the king, summons vast infantry and cavalry from
    a pack, compels the king to return the table, marries the princess, and creates
    a splendid castle from a bag. Yanek becomes king, rules successfully, and preserves
    the table, pack, and bag as the foundation of his power. Later descendants hide
    the objects because they are ashamed of their peasant origins; the objects decay,
    and the kingdom collapses.
  language: English
  quote_policy: summarized
