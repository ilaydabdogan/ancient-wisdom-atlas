canonical_text:
  quote: ''
  summary: Uncle Katoma subdues a dangerous magic steed and instructs it to carry
    Ivan Tsarevich meekly at his wedding. Anna the Beautiful tests Ivan's strength,
    later deceives him into surrendering Katoma to her punishment, has Katoma's feet
    cut off, and leaves him on a stump while Ivan is dragged back and degraded to
    cowherd. Katoma remains stranded until a blind forest hero chasing a fox collides
    with the stump and knocks it from the ground.
  language: English
  quote_policy: summarized
