canonical_text:
  quote: ''
  summary: A boy and girl use a golden rod and golden apple to restore a marble palace
    and flower-garden. A golden bird tells them they are the king's children and gives
    them a covered picture showing their arms and name. An old woman drugs the king
    to prevent recognition, then deceives the children by urging them to fetch a world-sounding
    tree. The boy, Yanoshka, leaves his sister and passes successive enchanted castles
    guarded by hairy devils; the third guard reveals that the tree is in an enchanted
    garden and gives instructions for entering and escaping before petrification.
  language: English
  quote_policy: summarized
