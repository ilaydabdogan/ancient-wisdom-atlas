canonical_text:
  quote: ''
  summary: 'Ivan Tsarevich secretly uses a whistle to summon Lame and Crooked, who
    complete Yelena the Beautiful''s escalating commands: shoes, a jeweled wedding
    robe, and a Golden Kingdom with a bridge, trees, and birds. The shoemaker, publicly
    treated as the worker, repeatedly fears execution, drinks, sleeps, and delivers
    the finished marvels. After the Golden Kingdom appears on the sea, Ivan sends
    a letter to his father explaining his deeds and his brothers'' deception, and
    invites the royal family to come to him.'
  language: English
  quote_policy: summarized
