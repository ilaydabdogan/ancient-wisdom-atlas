canonical_text:
  quote: '"I will serve thee with my feet, and thou shalt serve me with thy eyes."'
  summary: A blind hero and the footless Uncle Katoma, both harmed by Anna the Beautiful,
    form a partnership in which one supplies movement and the other sight. They abduct
    a charitable merchant's daughter, then treat her as an adopted sister and housekeeper.
    Baba-Yaga comes to their forest hut and sucks the maiden's blood until the heroes
    trap her by her hair. Under threat, Baba-Yaga leads them first to a deceptive
    fiery well and then to a true well of healing and living water. The water restores
    the blind man's sight and Katoma's feet. The heroes kill Baba-Yaga in the fiery
    well, Katoma marries the merchant's daughter, and the group goes toward Anna's
    kingdom to liberate Ivan Tsarevich, whom they find herding cows.
  language: English
  quote_policy: quoted
