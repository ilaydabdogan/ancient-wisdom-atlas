canonical_text:
  quote: the daughter of three mothers, the granddaughter of three grandmothers, and
    the sister of nine brothers
  summary: Ivan Tsarevich is directed from one old woman to her elder sister, who
    summons fish, beasts, and birds to ask about Peerless Beauty. The creatures do
    not know, but the late-arriving Mogol bird says it has been attending Peerless
    Beauty and agrees to carry Ivan to her if supplied with food and water. During
    the flight Ivan feeds the bird with beef and, when the meat is exhausted, with
    the calves of his own legs. After landing, the bird restores the calves to his
    legs, and Ivan continues to a great town.
  language: English
  quote_policy: quoted
