canonical_text:
  quote: ''
  summary: 'The passage describes Boorah initiation proceedings: women are separated
    from further sight, boys are painted and taken by guardians, totem-marked trees
    or images are passed, sacred fire rites are performed, boys are forbidden to look
    up, two boys who look and laugh are ritually killed in the narrated episode, remaining
    initiates undergo frightening ordeals, and successful boys receive shoulder marks
    filled with charcoal.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the ceremony is ready, younger women are ordered into bough sheds around
    the ring while old women remain singing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boys, already painted red, are beckoned to the middle of the ring, daubed
    with white by their Munthdeeguns, lifted onto shoulders, and danced around the
    ring.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Oldest women relations sing farewell songs for the boys and then join the
    younger women in sheds, which the men pull down over them so they see nothing
    further.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Munthdeeguns leave down a track into the scrub with the boys; after they
    are out of sight, the women are released to prepare to travel to the Little Boorah.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: As the Munthdeeguns pass totem-marked trees or images belonging to the boys'
    totems, they perform feats such as producing gubberahs, charcoal, and gypsum while
    chanting about the totem.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: During this movement, each boy's eyes are closed and his head is bent down.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the sacred fire, the Munthdeeguns each throw in a weapon and place their
    charges in prepared scooped-out places in the inner ring.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The boys are ordered, on pain of death, not to look up, and a great whirring
    sound is said to announce that Gayandi, the Boorah spirit, is near.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: In an episode attributed to Yudtha Dulleebah, two boys look up and see men
    chant and corroboree around the fire, rub coals into their limbs, and trample
    near the fire without appearing burned.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The initiates march with hands on thighs and heads lowered while learning
    a Boorah song containing new words for common things, used later as pass-words
    for the initiated.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Two old men beat time with painted spears with tufted tops while the men and
    boys move around the ring.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The two boys who had looked up do so again and laugh; the old men display
    sacred gubberahs and declare that one who laughs in the Bunbul is dead.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After chanting and an answering voice from the scrub identified with Gayandi,
    the two boys tremble, fall apparently lifeless, are cut with stone knives, and
    a death cry is raised.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The old wirreenuns dip stone knives in the boys' blood and touch the lips
    of all present with them; the bodies are placed on the edge of the sacred fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Other initiates are taken farther into the scrub and tested with whistling
    and whizzing spirit sounds, pointed spears, scratches from stone knives and mussel
    shells, and sudden attacks by hideously painted figures.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: An initiate who shows fear may be returned to his mother as a coward, and
    the passage says sympathetic magic, a poison-stick, or a bone would later end
    him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: An initiate judged stupid or incapable may be humiliated, bound to the earth,
    killed, and burned.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: Boys who do not quail are told they are brave and will become boorahbayyi
    and afterward yelgidyi, carrying visible marks.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:19
  text: A round hole is made in each brave boy's shoulder with a pointed stone, checked
    by licking, and filled with powdered charcoal.
  category: action
  evidence_refs:
  - ev:9
