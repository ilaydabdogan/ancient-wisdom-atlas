canonical_text:
  quote: ''
  summary: The passage presents an authorial ethnographic discussion of Arunta, Kaitish,
    and other Australian Aboriginal beliefs about spirit incarnation, reincarnation,
    conception, and totem acquisition. It describes Arunta and Kaitish local ancestral
    spirits entering women, locality-derived child totems, and sacred Churinga Nanja
    stones associated with ancestral souls desiring reincarnation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports an Arunta view in which an immaterial animating principle
    or soul becomes flesh by entering women from outside rather than being the direct
    result of human action.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sexual union is described as a preparatory condition associated with incarnation,
    while material acts are said not to effect the incarnation of a spirit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Arunta philosophy described here, each child has existed since the
    Alcheringa and is reproduced by the current mother after preparation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among the Arunta and Kaitish, a child's totem is not inherited from either
    parent.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:5
  text: The passage says that in every district there is a place where first human
    ancestors, all of one totem in each case, died or went under the earth.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rocks or trees are said to mark the places where the first human ancestors
    went under the earth.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: These places and the associated sacred stones are described as haunted by
    ancestral spirits or souls desiring reincarnation.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'The passage gives examples of local totemic categories at these sites: Grubs,
    Eagle Hawks, Iguanas, Emus, and Cats.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a woman becomes aware of the child she bears, she supposes that a local
    spirit of the local totem has entered her, and the child's totem is the totem
    of that locality.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The stone amulet of the ancestral spirit who is the child is sought; if it
    cannot be found, a wooden Churinga is made to represent it and kept in a sacred
    storehouse.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Other northern tribes are said to believe in reincarnation but to lack the
    haunted sacred stones and to derive totems by inheritance rather than locality.
  category: relationship
  evidence_refs:
  - ev:6
