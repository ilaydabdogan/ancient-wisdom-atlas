literal_observations:
- id: obs:1
  text: The passage describes a two-phratry system in which each person is born into
    one of two divisions, exemplified by Eagle Hawk and Crow, and must marry someone
    from the other division.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that phratry names may be derived through mothers, excluding
    marriage between maternal siblings and also excluding marriage between unrelated
    persons who share the same phratry name.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Within each phratry are smaller sets named for an animal or other natural
    object, called totems; the same totem is not found in both phratries.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that tribes also exist in which phratry and totem names are
    derived through the father.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage reports that paternal descent tends to make totem communities
    local, giving examples such as Grub, Iguana, and Emu as paternal totem names.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Euahlayi are described as having four matrimonial divisions within their
    intermarrying phratries, arranged so that a member of the elder generation cannot
    marry a member of the succeeding generation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that central and northern tribes, including the Arunta
    of the Macdonnell hills, have an eight-class rule.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Arunta are described as practicing subincision and circumcision of males,
    rather than the knocking out of front teeth, and as having ceremonies that lasted
    four months during a large tribal gathering in Spencer and Gillen's experience.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says that the Arunta are reported to lack belief in a moral and
    kindly All Father such as Byamee, while that belief is described as potent among
    the Euahlayi and as found by Howitt among non-coastal tribes of the south-east.
  category: attribute
  evidence_refs:
  - ev:7
