  summary: The passage describes Australian Aboriginal marriage divisions, phratries,
    totems, maternal and paternal descent, four- and eight-class matrimonial systems,
    rites among the Arunta, and a contrast between Arunta lack of an All Father belief
    and the Euahlayi belief in Byamee.
