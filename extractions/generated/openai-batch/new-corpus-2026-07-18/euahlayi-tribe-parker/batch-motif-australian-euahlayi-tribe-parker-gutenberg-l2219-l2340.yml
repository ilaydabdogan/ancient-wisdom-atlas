canonical_text:
  quote: Lunatics, from their point of view, are only persons spirit-possessed.
  summary: 'The passage describes Old Bootha after the death of her granddaughter:
    severe mourning, withdrawal into an underground camp, altered speech and dancing,
    claims of spirit possession, later return as a witch/wirreenun, rainmaker, and
    healer who consults spirits and the dead for diagnosis.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bootha's favourite granddaughter dies, after which Bootha grieves intensely
    and cuts herself at the burial, especially around the head.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bootha stays around the grave, fixes upright posts around it, paints them
    white, red, and black, and continually sweeps around the grave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bootha increasingly isolates herself, discards her clothes, roams the bush,
    and digs a roofed underground camp with painted posts in front.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bootha collects objects from the outhouses and hides them in her underground
    camp; she mutters to herself and her dogs in an unknown tongue.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At a tennis game, Bootha approaches while muttering and dancing new corroboree
    steps, asks to see the narrator, and says that spirits are in her and that she
    will come back as a big wirreenun.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the tennis encounter, Bootha leaves dancing and crooning toward her
    camp and does not come near the house again until the spirits are said to give
    up possession of her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When a team of horses passes Bootha's camp, Bootha appears with objects in
    her arms and throws a tin plate, an old bill, and other utensils toward the horses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Other Aboriginal people tell the narrator that Bootha has food and is being
    looked after by spirits; the narrator states that, from their point of view, lunatics
    are spirit-possessed persons.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Bootha later returns clothed, and reports circulate that she has recovered
    from illness, seems rejuvenated, makes cures, consults spirits about illness,
    has spirits in some of her dogs, is a rainmaker, and is a fully fledged witch.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: For Matah's knee pain, Bootha sings to her spirits, says there is too much
    water there, and recommends steaming, a hot rag, and drinking cold water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A passing medical man later diagnoses a stoppage of fluid at Matah's knee
    joint and recommends hot fomentations, poultices, and a cooling draught.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: When Adelaide is ill, Bootha says she will ask the spirits what caused the
    illness and what will cure it; she clears the center of the room, squats, mutters,
    and receives replies in a whistling voice.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Bootha identifies one consulted voice as the dead man Big Joe, then says she
    will ask her dead granddaughter, and finally says she will ask Guadgee, a deceased
    girl from the camp.
  category: speech
  evidence_refs:
  - ev:10
  - ev:11
