canonical_text:
  quote: May your shadow never be less!
  summary: 'The passage describes powers attributed to wirreenuns: capturing or restoring
    Doowees, commanding Mullee Mullees, storing spirits in a Minggah, injuring people
    through their shadows, keeping animal familiars called yunbeai, observing food
    taboos tied to those familiars, assuming animal form, replacing one yunbeai with
    another, and conjuring visible animal familiars. It also recounts a Narran old
    man whose lizard and snake familiars were associated with him in life and at death,
    and briefly introduces Gooweera poison sticks or bones.'
  language: English
  quote_policy: quoted
