candidate_motifs:
- id: motif:1
  label: Capture or loss of personal spirit causing death
  taxonomy_refs: []
  basis: The Doowee can be captured and hidden; if it does not re-enter the body,
    the person without it is doomed to die.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage does not give a broader comparative label for Doowee loss.
- id: motif:2
  label: Magical repository of captive spirits
  taxonomy_refs: []
  basis: The self-moving dillee bag holds unclaimed Doowees, and the Minggah holds
    captured Doowees, shadow spirits, Wundah, and yunbeai.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage presents multiple repositories rather than a single standardized
    object.
- id: motif:3
  label: Servitor spirit sent to seize a personal spirit
  taxonomy_refs: []
  basis: A wirreenun sends a Mullee Mullee to capture a Doowee and secrete it in the
    Minggah.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not specify the independent nature or origin of the Mullee
    Mullee beyond its service to wirreenuns.
- id: motif:4
  label: Totem dream as omen of misfortune
  taxonomy_refs: []
  basis: Seeing one’s totem in a dream is described as a warning of coming evil for
    oneself or close kin.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: Only a brief omen statement is given.
- id: motif:5
  label: Life-linked shadow vulnerable to magical attack
  taxonomy_refs: []
  basis: The owner’s life and health depend on the shadow spirit, which can be stolen,
    injured, or shrunk by a wirreenun.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No available taxonomy reference directly corresponds to the shadow motif.
- id: motif:6
  label: Animal familiar grants strength with reciprocal vulnerability and food taboo
  taxonomy_refs: []
  basis: The yunbeai gives strength but creates danger because injury to the animal
    hurts the person, and the person must not eat that animal’s flesh.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage distinguishes yunbeai from hereditary family totem, so the
    motif should not be merged with general totemism without review.
- id: motif:7
  label: Animal-form transformation through familiar
  taxonomy_refs:
  - shapeshifter
  basis: A wirreenun can assume the shape of the yunbeai animal, such as changing
    into a bird to escape danger.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives a general example rather than a developed narrative
    episode.
- id: motif:8
  label: Replacement familiar restores health
  taxonomy_refs: []
  basis: An ill wirreenun recovers after two powerful wirreenuns give him porcupine
    as a new yunbeai to replace the vanished opossum.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage reports one example and does not state how common this procedure
    is.
- id: motif:9
  label: Conjured visible animal familiar
  taxonomy_refs: []
  basis: A wirreenun can make a yunbeai visible to chosen observers, and the Narran
    old man is described as producing a lizard beside him after muttering or singing.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The narrator explicitly allows that the lizard may have been a pet charmed
    from the bush.
- id: motif:10
  label: Animal familiars present at death and disappearing at coffin
  taxonomy_refs: []
  basis: The old man’s lizard and snake yunbeai are said to be seen beside him after
    death and to disappear when he is placed in his coffin.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: This is reported speech within the passage and not directly witnessed
    by the narrator.
