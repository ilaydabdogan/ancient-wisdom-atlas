canonical_text:
  quote: ''
  summary: The passage describes Bootha consulting a whistling voice named Guadgee
    about Adelaide's illness, attributing it to bathing in the shade of a tabooed
    Minggah or spirit-tree and to invisible spirit-bees. It then describes a cure
    involving cold water, spirit removal, wrist-rubbing, and incantation; beliefs
    about who can see or embody spirits; Bootha's commands from her father's spirit
    in the moon; protective and omen poles placed in a garden; and a rainmaking rite
    using a clever-stick, crystal, stone, water, twigs, a feathered stick, and singing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A whistling voice came from a third direction while Bootha's lips were visibly
    moving; Guadgee answered questions.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Guadgee said Adelaide became ill because she bathed in the creek under the
    shade of a Minggah, described as a spirit-tree tabooed to all except wirreenuns
    or those who commune with spirits.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that disturbing a shadow is understood as hurting the original;
    invisible spirit-bees in the Minggah resent insults to the tree or its shadow
    and were said to have entered Adelaide, leaving wax on her liver and bites on
    her back.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Adelaide confirmed that she had bathed in the shade of the identified big
    Coolabah and connected the alleged bee-bites with irritating pimples on her back.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The proposed cure required Adelaide to avoid hot or heating drinks, drink
    cold water freely, and receive a night-time removal of wax from her liver by Guadgee
    while asleep.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bootha rubbed Adelaide's wrist while muttering an incantation and said she
    would take all the spirits away inside herself.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Adelaide slept that night, looked better the next morning, and rapidly recovered.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says wirreenuns can sometimes make spirits visible to ordinary
    eyes, while babies and dogs may also see spirits in certain situations.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: A person may embody many spirits but must avoid hot or heating drinks; spirits
    are said not to enter a person defiled by grog.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Bootha was told by a powerful spirit that her father's spirit was in Bahloo,
    the moon, had cured her, and commanded her never to drink grog, wear red, or eat
    fish.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Bootha placed posts in the garden containing spirits of Kurreahs or crocodiles,
    saying these water-requiring spirits would keep the tanks from going dry.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Bootha said spirits helped her carry a heavy post after another woman found
    it too heavy.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Garden poles were described as painted, marked, or strung objects used to
