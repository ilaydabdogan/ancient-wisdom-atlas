    dead spirits away from the house.
  category: object
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:14
  text: Bootha used smoking Budtha twigs to clear the place of evil when protection
    was needed.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: For rainmaking, Bootha used a wi-mouyan or clever-stick, crystal, green twigs,
    sometimes a feathered stick, and a flat stone; she placed crystal and stone under
