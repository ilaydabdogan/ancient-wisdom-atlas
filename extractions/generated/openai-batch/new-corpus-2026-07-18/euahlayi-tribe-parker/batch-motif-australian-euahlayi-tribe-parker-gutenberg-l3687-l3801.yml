canonical_text:
  quote: watching to seize her fleeting spirit--a sure sign the end was near
  summary: 'The narrator describes the death and funeral of Beemunny: wailing, death
    omens involving whirlwinds, enemy spirits, Yowee, and an emu dream; guarding the
    deathbed and corpse from spirits; the Goohnai dirge naming the deceased''s totems;
    burial preparations in a bark coffin with smoking fires; a funeral procession
    to the burial-ground; and an explanation that a little bird called Durrooee is
    the shape in which spirits of dead women revisit the earth. The passage ends with
    a brief note on Numbardee, the first woman, as a food preparer.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Distant wailing from the camp is understood by the narrator as meaning that
    Beemunny, the oldest woman of the camp and long ill, has died.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Beemunny is described as blind and formerly led by her great-granddaughter
    Buggaloo to a tree where she told legends about a time when humans, animals, trees,
    and elements shared a common language.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Boolees or whirlwinds, said to contain the Mullee Mullees of Beemunny's enemies,
    are reported as watching to seize her spirit; the coming of Yowee, a skeleton
    spirit with a big head and fiery eyes, is said to mean death.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dreams of an emu are said to indicate misfortune for someone of that totem,
    which is identified as Beemunny's totem.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A boolee arises without wind, whirls leaves and dust into a spiral column,
    moves toward Beemunny's camp, and turns away after finding the deathbed guarded.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At sunrise the Goohnai or dirge is sung; it enumerates the deceased person's
    totems and is repeated by each new arrival at the camp.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Beemunny's daughter and nearest kin sit beside the body with hands on it to
    guard her from spirits; the body is placed in a bark coffin with blankets, and
    small Budtha fires are kept smoking until burial.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The funeral procession follows an ordered sequence of old men, young men,
    coffin bearers, nearest women relations, old women, and young women; women with
    babies and children are excluded.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The procession follows a winding track on a pebbly ridge under overarching
    pine trees toward the burial-ground.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: A bird note heard on the way is identified by Bootha as that of Durrooee,
    a little wren-like bird in whose shape the spirits of dead women revisit the earth.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Numbardee is described as the first woman and as a caterer who acquired the
    art of beating plant roots into flat cakes carried in a shoulder bag.
  category: attribute
  evidence_refs:
  - ev:9
