  quote: ''
  summary: The passage introduces Byamee/Baiame as a superhuman anthropomorphic All
    Father known in Euahlayi, Kamilaroi, and Wiradjuri contexts; explains the name,
    restricted naming, and father euphemisms; reports initiated testimony about Byamee;
    discusses arguments over whether the belief predates missionary influence; summarizes
    a broader All Father pattern described by Howitt; and notes restricted song and
    women's limited mystic access under another name.
  language: English
  quote_policy: summarized
