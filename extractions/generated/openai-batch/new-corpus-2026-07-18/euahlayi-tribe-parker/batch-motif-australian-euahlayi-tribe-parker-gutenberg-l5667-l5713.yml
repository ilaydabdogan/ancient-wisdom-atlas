canonical_text:
  quote: ''
  summary: The passage reports a Euahlayi-associated account in which a grey-speckled
    bird rules mosquitoes and sends them from swamp homes to attack people. In mythological
    days the bird was a woman whose sons were translated to the sky by a man who had
    treated her badly. After taking revenge on him, she vowed vengeance on all men
    and carries it out in the form of the mosquito bird, with mosquito servants bearing
    wing-spots like hers. The rest of the passage reflects on caution in interpreting
    Aboriginal beliefs and criticizes missionaries who ignore existing Indigenous
    religion.
  language: English
