  summary: The passage argues against explanations that link Australian social progress
    or coastal abundance to the rise of religious ideas such as belief in a benevolent
    or ruling All Father. It compares Arunta, Euahlayi, south-eastern, northern coastal,
    Central Queensland, European, and North American examples of social organization,
    All Father belief, rainmaking, totemic magic, and agricultural magic.
  language: English
  quote_policy: summarized
literal_observations:
