  text: Mr. Howitt, with Mr. Frazer's concurrence, is reported as asserting that regions
    where germs of religion appear also show progress toward a higher form of social
    and family life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Arunta are described as reckoning in the male line for some institutions,
    including hereditary magistracies and inheritance of the right to practise the
    father's totemic ritual, and as more socially progressive than the Euahlayi in
    that respect.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Arunta are described as having co-operative totemic magic for food supply
    but no developed belief in a benevolent or ruling All Father.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tribes northward from the Arunta to the sea are described as socially advanced
    but, except for one noted exception, lacking an All Father belief.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage explicitly concludes that social progress is not the cause or
    necessary concomitant of advance in religious ideas.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage argues that coastal environment and abundant food cannot explain
