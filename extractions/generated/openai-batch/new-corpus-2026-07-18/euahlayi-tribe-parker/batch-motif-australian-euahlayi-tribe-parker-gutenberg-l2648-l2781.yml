canonical_text:
  quote: ''
  summary: The passage describes Euahlayi child-care precautions against spirits,
    bird omens affecting how a baby is laid, charm actions using a centipede and a
    bustard wing, nose piercing and tribal marking, an exchange about nose bones and
    earrings, baby betrothal by transfer of swansdown feathers, marriage household
    relations, a reincarnation explanation for some marriages between young men and
    old women, and the beginning of a girl's initiation into womanhood involving seclusion,
    smoke, an earth hollow, instructions, and food restrictions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mother is expected to warm her hands and rub her baby's joints at night,
    and to keep the sleeping baby's mouth shut or head covered to prevent disease
    or an evil-working spirit from entering.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If certain birds cry while passing over the camp, the child must be placed
    on a specified side or on the stomach; the passage identifies these birds, in
    that setting, as evil spirits in bird form.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When a baby begins to crawl, the mother half-cooks a centipede, beats the
    child's hands with it, and croons words glossed as commands to be kind and not
    steal or touch what belongs to another.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A child must not touch large bustard wing feathers or bones; at about four
    years old the mother beats the child on the shoulders and under the arms with
    a bustard wing while crooning a charm glossed as making the child a good swimmer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wirreenuns see that a child's nose septum is pierced and tribal marks are
    cut at the right time; the nose piercing is done in midwinter with ice used to
    numb the septum and a bone needle used to pierce it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: An old Aboriginal woman with a pierced nose and nose bone contrasts her nose
    ornament with a laundress's earrings, saying the nose bone helps singing and blocks
    bad smells, while earrings pull the ears down like dogs' ears.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the baby betrothal called Bahnmul, the baby girl's granny puts white swansdown
    on the baby's head, takes her to a man, tells the baby to look at and remember
    him, and transfers some feathers from the baby's head to his head to make the
    betrothal formally binding.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage distinguishes girls who have merely been promised from girls formally
    betrothed, and notes disputes when girls resist old men whom they do not wish
    to marry.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: If a young girl marries a man who already has an old wife, the old wife may
    rule the young wife strictly, including reporting her conduct to the husband.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: One explanation given for young men marrying old women is that the young men
    had lived before, loved the same women, died before initiation, and could only
    marry them now in reincarnation.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: For a girl's initiation into womanhood, a granny or old female relation takes
    her from the main camp into the scrub and makes a bough shade.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: During the girl’s initiation, the elder burns a heap of Budtha leaves, makes
    the girl swallow the smoke, tells her to lie in a scooped-out earth hollow, gives
    conduct instructions, restricts sleep, provides food at dawn, and forbids honey
    for four moons.
  category: sequence
  evidence_refs:
  - ev:10
