canonical_text:
  quote: ''
  summary: 'The passage describes punitive treatment of a girl or woman accused of
    sexual misconduct: binding, encirclement by male kin or clan men, tossing until
    dazed or exhausted, and subsequent assignment to a husband or abandonment to men,
    with death described as an almost inevitable result in the more severe case. It
    ends with a reported claim that fear of such punishment affected women’s domestic
    relations in former times.'
