canonical_text:
  quote: ''
  summary: Introductory ethnographic passage in which the author defines the Euahlayi
    area of study, describes linguistic and social relations with neighboring groups,
    lists several Euahlayi beliefs and usages including Baiame, reincarnation, sub-totems,
    spirit-haunted trees, and a Dream Time form, and explains informant conditions
    and oral storytelling practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author presents the work as a study of manners, customs, beliefs, and
    legends, mainly among the Euahlayi of north-western New South Wales near the Narran
    River.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies the Euahlayi as neighbors of a group named by Howitt
    as Wollaroi, Yualloroi, or Yualaroi, and explains the name as derived from a tribal
    negative word meaning “No.”
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes Euahlayi social organization as including two phratries
    or exogamous moieties and four matrimonial classes named Ipai, Kumbo, Murri, and
    Kubbi.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Euahlayi dialect is described as allied with Kamilaroi, with some animal
    names shared with Kamilaroi and Wir djuri speech.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The term for the being called “The All Father” by Howitt is given as Baiame
    or Byamee and is said to be used by Wir djuri and Kamilaroi as well.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the Euahlayi have myths, beliefs, and usages not recorded
    as extant among the Kamilaroi and instead forming a link with groups farther west,
    including Lake Eyre tribes and southernmost Arunta.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Specific beliefs or usages listed for the Euahlayi include a limited and modified
    form of reincarnation belief, development of sub-totems, belief in spirit-haunted
    trees, and a form of the Arunta Dream Time myth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author states that her native informants were not, to her knowledge, under
    missionary influence, and describes using a lingua franca and interpreters in
    conversations.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author describes reciprocal gift exchange with informants, including a
    carved weapon and tobacco as examples.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'The author reports that older Aboriginal storytellers differed in style:
    some gave bare plots, while others added descriptive and poetic details, especially
    when speaking to a trusted interested listener.'
  category: speech
  evidence_refs:
  - ev:6
