canonical_text:
  quote: ''
  summary: The passage lists Euahlayi relationship and status terms, states that people
    of the same totem are reckoned as siblings and cannot intermarry, and then describes
    the Dhe or totem system. It names major totems such as Dinewan/emu, Bohrah/kangaroo,
    Beewee/iguana, Gouyou/bandicoot, Doolungaiyah/Bilber/bilby, Douyou/black snake,
    and Moodai/opossum, with multiplex or sub-totems drawn from animals, birds, plants,
    winds, weather, celestial bodies, fire, stones, and aquatic beings. It also notes
    kin-like relations among totems and differing local strength or decline of some
    animal and clan groups.
  language: English
  quote_policy: summarized
