canonical_text:
  quote: ''
  summary: 'The passage lists Euahlayi-associated local landmarks and legends: protected
    sacred trees and a shell brought by Wurrunnah; trees and stone works attributed
    to Byamee; stones identified with victims'' bones; Boogoodoogahdah''s death and
    rain-bird spirit; a guarded luminous stone; Byamee''s imprints, water hollows,
    family rescue, and resting places; Mullyan''s victims, tree, fiery death, and
    constellation; Birrahgnooloo''s caves and springs; and Yanta spirits who make
    springs during drought and die while trying to excavate a lake.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old hollow tree is said to contain a shell brought back by Wurrunnah, and
    people do not dare to touch it; local men formerly mustered to protect it from
    desecration.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Weetalibah, Byamee is said to have cut the first Gayandi from a tree; other
    trees from which Byamee cut and marked honey are treated as reserved property.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: An outcrop of white stones is identified as fossilised bones of Boogoodoogahdah's
    victims.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Boogoodoogahdah is described as a cannibal woman with hundreds of dogs who
    rounded up, killed, and ate people; after she was killed, her spirit flew from
    her heart as a bird.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bird associated with Boogoodoogahdah haunts burial grounds and is said
    to bring rain if made to cry out; drought episodes involving such a bird are recounted.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: A white or marvellous stone is described as glowing in darkness, appearing
    like solidified rain in daylight, needing guard, and having self-movement attributed
    to a devil within it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The stone fisheries in the bed of the Barwon at Brewarrina are attributed
    to Byamee and his giant sons.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: A stone at Boogira bears an imprint of Byamee's hand and foot, and the passage
    says this shows that giants existed in those days.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Boogira, Byamee is said to have brought to bay crocodiles who swallowed
    his wives, recovered the wives, and restored them to life.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Mildool, Byamee is said to have scooped out a rock to catch and hold water
    and hollowed a smaller stone for his dog to drink from.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At Dooyanweenia, two rocks are identified as resting places of Byamee and
    Birrahgnooloo, with hairs from Byamee's beard still sticking to the rocks.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: Huge bones emerging at Guddee are explained as remains of Mullyan's victims;
    Mullyan's camp was in a remarkable composite tree near the spring.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The relations of Mullyan's victims burned Mullyan and his wives out of the
    tree, and they now form the Northern Crown constellation; the tree's roots formed
    underground water-courses.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: At Eurahbah and elsewhere, hollowed-out caves or stones are places where Birrahgnooloo
    slept, with nearby springs made at her instigation; she is called patroness of
    water.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:15
  text: The Yanta spirits saw drought deaths, returned to earth, excavated springs,
    and after many became exhausted, springs bubbled up.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: The Yantas later tried to excavate a plain into a lake at Kinggle, but died
    before completing it; mud springs and their graves remain, and people avoid crossing
    the plains for fear of the spirits.
  category: sequence
  evidence_refs:
  - ev:13
