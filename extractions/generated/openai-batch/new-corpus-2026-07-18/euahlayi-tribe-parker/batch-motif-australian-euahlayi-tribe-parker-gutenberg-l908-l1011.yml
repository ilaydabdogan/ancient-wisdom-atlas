canonical_text:
  quote: ''
  summary: The passage summarizes Euahlayi beliefs about Byamee as an all-father,
    lawgiver, source of totems, maker of a fish-trap, recipient of limited prayers,
    and responder to rain petitions. It also describes Birrahgnooloo as mother of
    all, Cunnumbeillee as Byamee's other wife, weather-related actions involving floods
    and rain, and several authorial comparisons to Arunta, Wiradjuri, Greek, and Scottish
    legendary patterns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that Byamee is to the Euahlayi what the Alcheringa or Dream
    time is to the Arunta, while also distinguishing a subsidiary Euahlayi myth corresponding
    to it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A mythic age is described in which only birds and beasts were on earth before
    a colossal man and two women came from the remote north-east, transformed birds
    and beasts into humans, made other people of clay or stone, taught them, gave
    laws, and returned.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When asked about the origin of customs, the Euahlayi answer that Byamee said
    so; at Boorah initiations he is proclaimed Father of All whose laws are obeyed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Byamee is presented as a source of totems and of a rule forbidding people
    of the same totem to intermarry.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Byamee is said to have a totem name for every part of his body and to have
    given totems to kinship groups as he departed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Birrahgnooloo is described as Byamee's chief wife and mother of all, with
    a totem for each part of her body.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Birrahgnooloo and Byamee are said to be partly crystallised in a sky-camp;
    petitioners seeking floods go to Birrahgnooloo, who can instruct Cunnumbeillee
    to start a flood-ball down the mountains.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Cunnumbeillee is described as Byamee's other wife, a bearer of children and
    caterer, with one totem that her children derived from her.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: A large stone fish-trap at Brewarrina on the Barwan River is attributed to
    Byamee and his gigantic sons, and Byamee is also said to have established a common
    peaceful camping-ground during the fishing festival.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage reports that prayers for souls of the dead used to be addressed
    to Byamee at funerals.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: An orphan may call to the sky for rain, while the last possible child of a
    woman may stop excessive rain by burning Midjeer wood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Boottha reports sending a tutelary spirit to Boyjerh, after which Byamee throws
    crystal pebbles from the sky into water in a stone basin on a sacred mountain,
    causing water to splash into clouds and descend as rain.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: At some initiatory rites, the oldest Wirreenun present addresses a prayer
    to Byamee for long life because the group has kept his law.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage says the tribesmen do not profess to pray to Byamee except at
    funerals and at the conclusion of the Boorah.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage notes that later chapters will discuss future rewards and punishments
    and Byamee's troubles with Darramulun, described as a disobedient deputy.
  category: other
  evidence_refs:
  - ev:10
- id: obs:16
  text: The author states that the belief lacks temples, priests, and sacrifice, while
    Byamee has a relation of affection, reverence, or duty with humankind not attributed
    to other potent beings.
  category: relationship
  evidence_refs:
  - ev:11
