comparison_claims:
- id: claim:1
  claim: The passage itself compares Byamee's explanatory role for Euahlayi customs
    with the Arunta Alcheringa or Dream time as an origin-time explanation.
  claim_level: same_function
  target: Arunta Alcheringa / Dream time tradition
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The author says the Euahlayi have a subsidiary myth corresponding to
    the Alcheringa, but the passage also keeps Byamee and that mythic age partly distinct.
- id: claim:2
  claim: The passage reports that a Byamee myth about totems and the same-totem marriage
    prohibition is also told among the Wir djuri, and that the Darramulun deputy myth
    is current there too.
  claim_level: same_motif
  target: Wir djuri traditions concerning Byamee, totems, exogamy, and Darramulun
  evidence_refs:
  - ev:3
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supplies only brief cross-tribal notices and not the Wir
    djuri versions themselves.
- id: claim:3
  claim: The author's analogy treats the Brewarrina fish-trap attribution to Byamee
    and his gigantic sons as functionally similar to legends attributing large constructions
    to extraordinary builders such as the Cyclops or Picts.
  claim_level: same_function
  target: Cyclops building the walls of Tiryns and Pictish explanation of Glasgow
    Cathedral, as cited by the author
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: low
  limitations: This is an authorial analogy within the passage, not evidence for historical
    contact or common inheritance.
