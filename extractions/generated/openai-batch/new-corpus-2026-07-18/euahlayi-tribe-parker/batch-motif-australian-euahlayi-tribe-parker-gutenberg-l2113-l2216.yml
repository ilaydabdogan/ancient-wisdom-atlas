candidate_motifs:
- id: motif:1
  label: healing by steam, smoke, plants, and fire
  taxonomy_refs: []
  basis: The passage repeatedly describes treatments using coals or fire, leaves,
    water, steam, and smoke for strengthening, swelling, childbirth recovery, and
    disease prevention.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:13
  confidence: high
  cautions: The passage presents ethnographic description of practices; it does not
    explicitly identify a named mythic motif.
- id: motif:2
  label: strength gained through consuming substance from the dead
  taxonomy_refs: []
  basis: The passage states that mourners consume a small piece of flesh or drained
    liquid from a dead person to strengthen themselves mentally and physically.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The source author calls the practice cannibalism, but the extraction records
    only the passage’s stated ritual function.
- id: motif:3
  label: taboo separation after corpse-strength rite
  taxonomy_refs: []
  basis: Young people are excluded from the rite, and their shadows must not cross
    those who partook or evil is expected.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives the taboo but not a detailed explanation of the expected
    evil.
- id: motif:4
  label: postpartum uncleanness and seclusion
  taxonomy_refs: []
  basis: The woman after birth is described as unclean and apart, kept from camp,
    fed by an old woman, and forbidden to touch others’ belongings or food utensils.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No taxonomy family is assigned because the available list has no exact
    postpartum seclusion category.
- id: motif:5
  label: plague sent in winds and destined to return by curse
  taxonomy_refs: []
  basis: Smallpox is said to be sent by enemies in winds, dropped from trees onto
    camps, and cursed to return because the dead were not buried.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage frames this as a tradition about smallpox; it does not identify
    a divine agent or comparative plague-cycle category.
- id: motif:6
  label: poison made from stones and corpse bones
  taxonomy_refs: []
  basis: The passage describes ground poison-stones and pounded wrist bones of the
    dead as substances placed in food, honey, or water to cause lingering death.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The responsible poisoner is not specified in the passage.
- id: motif:7
  label: sickness expelled by noise around patient
  taxonomy_refs: []
  basis: A wirreenun strikes bark on the ground around the patient to make a great
    noise and frighten sickness away.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not specify whether sickness is treated as a being beyond
    the phrase 'frighten the sickness away.'
- id: motif:8
  label: unborn child coaxed into birth by speech and charm object
  taxonomy_refs: []
  basis: The unborn baby is addressed with invitations into the world, and a wi-mouyan
    stick is waved with a charm to bring the baby forth.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: Although the available taxonomy includes sacred_birth, this passage describes
    a birth ceremony without explicitly marking the birth as sacred or exceptional.
- id: motif:9
  label: smoke used to prevent carrying disease home
  taxonomy_refs: []
  basis: Visitors create a smoke fire and smoke themselves when leaving so they do
    not carry disease home.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage gives only a brief description and no further ritual explanation.
