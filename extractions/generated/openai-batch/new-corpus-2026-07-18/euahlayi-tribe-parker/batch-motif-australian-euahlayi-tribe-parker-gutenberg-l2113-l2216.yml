    and the newborn is washed in cold water.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/euahlayi-tribe-parker.md
  rights_note: Public domain source metadata; evidence summarized.
- id: ev:7
  type: summary
  locator: 2160-2170
  quote_or_summary: Dunnerh-Dunnerh, smallpox, is said to have been sent by enemies
