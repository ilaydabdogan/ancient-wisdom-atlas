  summary: The passage describes medicines, curing practices, funeral-strength rites
    involving a corpse, postpartum steaming and seclusion, traditions about smallpox
    as wind-sent and cursed to return, poisoning by stones or bones, noisy expulsion
    of sickness, ritual speech and charm for birth, death-related nursing ornaments,
    and smoke used after visiting to avoid carrying disease.
  language: English
  quote_policy: summarized
