canonical_text:
  quote: ''
  summary: The passage describes Euahlayi wirreenuns, spirit mediumship, multiple
    personal spirits, magical stones and spirit-trees, sanctuary at taboo spirit places,
    the contents of a medicine man's bag, and a series of healing practices for snakebite,
    pain, wounds, skin irritation, broken limbs, swollen eyes, rheumatism, and sleeplessness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wirreenuns sometimes hold meetings open to non-professionals, where spirits
    of the dead speak through living mediums.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage lists at least three spirits for a person: Yowee, Doowee, Mulloowil,
    and sometimes Yunbeai.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Yowee is described as remaining with the living body, taking judgment
    after death, and being able to assume the dead person's perishable shape unless
    reincarnated.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A strong medium may have spirits of many dead persons speak through him or
    her in a whistling spirit voice.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wirreenuns compete in meetings by producing magical stones; the one producing
    the most stones is considered the most powerful.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The magical stones are described as living spirits that may be swallowed or
    rubbed through the head and that breathe and grow in the owner's body.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: If stones falling from a rival's head or mouth are stolen, the original possessor's
    power is lessened; dying owners bequeath stones to a related living wirreenun.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A wirreenun's health and power depend on crystals, Yunbeai, and Minggah; an
    accident to the Minggah causes sickness or death unless another is possessed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Minggah and Goomarh function as refuges from humanly inflicted evil, but they
    are taboo and may expose a refugee to spirit wrath.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: A specific Minggah is identified as a great gaunt Coolabah near a river garden,
    avoided even by bird-collectors despite birds nesting there.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: A wirreenun's boondoorr or dillee bag contains gooweeras, poison-stones, bones,
    sacred stones, a crystal-gazing stone, a death-dealing stone, herbs, nose-bones,
    swansdown, shells, and woven opossum hair strands.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The crystal-gazing stone is said to send its spirit to observe a distant person
    and then show that person in the crystal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Snakebite is treated by sucking the wound and cauterising it with a firestick;
    the practitioners say they suck out young snakes injected into the bitten person.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: For headaches, pains, and rheumatic pains, wirreenuns use opossum hair string
    to draw blood or bind affected areas.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage describes herbal infusions, leaf pulp, steam baths, bird down
    for bleeding, heated saltbush, splinting with grass and bark, warmed leaves, Budtha
    infusions, heated earth, and pennyroyal as remedies.
  category: action
  evidence_refs:
  - ev:10
