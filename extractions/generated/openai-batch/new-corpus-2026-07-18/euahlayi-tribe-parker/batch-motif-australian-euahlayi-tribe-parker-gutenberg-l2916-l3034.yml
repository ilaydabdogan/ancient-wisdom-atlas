canonical_text:
  quote: ''
  summary: The passage describes boys' mythical origin at a boy-making place, their
    early training and movement to the bachelors' camp, the restricted making of fire,
    and preliminaries to the Boorah. The Boorah preliminaries include the sounding
    of the Gayandi/Gurraymi bullroarer, restrictions on who may hear it, ritual marching
    with a red-painted spear and waywah, calling creek and river names, sending protected
    messengers with spears and message-sticks to summon neighboring tribes, and preparation
    of sacred grounds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boomayahmayahmul, described as the wood lizard, is named as the principal
    worker at the boy manufactory; Bahloo sometimes assists him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Children taunt one another with mythical origins: a girl says a lizard made
    a boy, and a boy retorts that a crow made a girl.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Up to a certain age, boys receive training like girls, including sung charms
    intended to make them generous, honest, and good swimmers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At about seven years old, a boy's mother paints him daily for about a week
    with red and white colours before he goes to the bachelors' camp.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After entering the bachelors' camp, the boy may go hunting with boys and men
    and see traditional fire-making.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The passage states that no boy who had not been to a Boorah would dare to
    try to make fire.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fire-making is described as using a split Nummaybirah log, dry grass, and
    a flat piece rubbed across the opening until smoke and then flame appear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When game and grass are plentiful, old men draw apart and talk earnestly before
    Boorah preliminaries begin.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A whizzing, whirling boom is heard from the scrub; the passage identifies
    this sound with the Gurraymi, Gayandi, or Boorah spirit's voice, also described
    as the bullroarer.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:8
- id: obs:10
  text: Women young enough to bear children stop their ears when the sound is heard,
    because the passage says hearing it would make them mad and then kill them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Old women sing a Boorah song, and opossum rugs are thrown over children to
    deaden the sound; only boys old enough to be initiated may hear it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Men and boys gather while two old wirreenuns have earlier gone into the scrub
    after an apparent quarrel.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A man carries a red-painted spear topped with a waywah, described as an emblematic
    belt of manhood, while calling names of creek bends and rivers.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: At each named main stream, the men join in a crow-like cry of 'Wah! wah! wah!'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The two old wirreenuns return to camp and the bullroarer noise ceases, though
    it may recur during the night.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Gooyeanawannah messengers are sent in different directions to summon neighboring
    tribes to the Boorah.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Each messenger carries a spear with a waywah on top, and the passage says
    even hostile tribes will not molest a messenger bearing it.
  category: object
  evidence_refs:
  - ev:9
- id: obs:18
  text: A messenger gives a Doolooboorah message-stick to the chief wirreenun as a
    guarantee of good faith and tells where and when the Boorah will be held.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: The message-stick is sent onward by messengers of other tribes until all are
    summoned, and each tribe signals receipt by sounding the Gayandi.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:20
  text: Young boys chosen as messengers are held in high honour and are called Woormerh.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:21
  text: While messengers are away, old men prepare the sacred grounds in the hereditary
    hunting lands where the Boorah is to be held.
  category: setting
  evidence_refs:
  - ev:11
