candidate_motifs:
- id: motif:1
  label: Boorah initiation preliminaries for boys
  taxonomy_refs:
  - initiation
  basis: The passage describes boys' movement toward the bachelors' camp, the bullroarer
    sound revealing that initiation is at hand for eligible boys, and preparation
    of Boorah sacred grounds.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:7
  - ev:11
  confidence: high
  cautions: The passage covers preliminaries and training before Boorah rather than
    the full initiation ceremony.
- id: motif:2
  label: tabooed sacred sound restricted by age and sex
  taxonomy_refs:
  - forbidden_knowledge
  basis: Women of childbearing age and unready children must not hear the Gurraymi/Gayandi
    sound, while boys old enough for initiation may hear it as a signal.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The taxonomy link is interpretive; the passage frames the restriction
    specifically as forbidden hearing of a sacred sound, not as a general knowledge
    prohibition.
- id: motif:3
  label: ritually protected messenger summons
  taxonomy_refs: []
  basis: Messengers with a spear and waywah are not molested even by enemies, deliver
    a message-stick as guarantee, and summon tribes to the Boorah.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: No external comparison is made; this is recorded as a passage-level ritual
    pattern.
- id: motif:4
  label: restricted fire-making before initiation
  taxonomy_refs:
  - initiation
  basis: A boy who had not been to a Boorah would not dare make fire, and boys learn
    fire-making in the context of male training.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage describes ethnographic practice; the motif classification
    depends on its connection to Boorah status.
- id: motif:5
  label: mythic manufacture of children by non-human or named makers
  taxonomy_refs: []
  basis: The boy manufactory has the wood lizard as principal worker with Bahloo assisting,
    and children taunt one another about being made by lizard or crow.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives only a brief aside and child taunts, not a full origin
    narrative.
