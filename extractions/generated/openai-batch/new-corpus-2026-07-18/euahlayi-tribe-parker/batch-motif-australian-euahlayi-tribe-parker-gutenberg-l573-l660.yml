canonical_text:
  quote: ''
  summary: The passage summarizes and critiques an argument about Australian totemism,
    especially local or conceptional totemism, hereditary totemism, spirit-caused
    conception, reincarnation of ancestral spirits, sacred stones, and the Euahlayi
    belief that Moon and Crow make new children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The quoted argument describes Arunta local or conceptional totemism as assigning
    totemic identity from the place where the first sign of life in the womb occurs,
    rather than from sexual intercourse or blood ties.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Arunta, Kaitish, Umbaia, and Gnanji beliefs include
    conception caused by a disembodied totem spirit entering a woman from one of several
    totem centres.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Umbaia and Gnanji usually assign the father's totem
    to the child, even if quickening occurs at a place associated with a different
    totem.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: An example is given in which the wife of a snake man feels quickening at a
    tree haunted by goshawk spirits, but the child is classified as snake rather than
    goshawk.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A reconciling theory says that a spirit of the husband's totem follows the
    wife and enters her when an opportunity occurs, while spirits of other totems
    avoid trespassing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A hypothetical maternal-line version says that a pregnant woman of the bee
    totem would be followed by a bee spirit, which would enter her and make the child
    bee totem.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author says the central and northern belief in perpetual reincarnation
    of primal spirits is not primitive and that the Arunta method depends on this
    belief together with primal sacred stones.
  category: other
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:8
  text: The passage says that many south-eastern tribes have no known reincarnation
    doctrine and accept the father as the cause of procreation, except that the Euahlayi
    believe Moon and Crow make new children.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Urabunna are described as having female descent of the totem and a belief
    in reincarnation, while also intermarrying with the Arunta, borrowing sacred stones,
    and practicing similar rites.
  category: relationship
  evidence_refs:
  - ev:4
