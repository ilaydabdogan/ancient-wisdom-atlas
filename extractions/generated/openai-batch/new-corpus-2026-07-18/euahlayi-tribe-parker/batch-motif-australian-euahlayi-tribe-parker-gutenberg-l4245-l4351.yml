candidate_motifs:
- id: motif:1
  label: Eclipse as pursuit or attack between sun and moon
  taxonomy_refs: []
  basis: The passage gives eclipse accounts in which Yhi the sun overtakes or chases
    the moon/Bahloo and tries to kill him after rejected love.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents multiple accounts rather than a single fixed version.
- id: motif:2
  label: Ritual expulsion of evil spirits to end eclipse
  taxonomy_refs: []
  basis: One account says evil spirits are destroying the celestial enemies, and wirreenuns
    chant incantations to oust the spirits and claim success after the eclipse.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The text reports this as one of several eclipse explanations.
- id: motif:3
  label: Threatened cosmic support and darkness
  taxonomy_refs:
  - chaos
  basis: Yhi threatens sky-supporting spirits that if Bahloo escapes, a spirit holding
    Kurrajong ropes will fall and the earth will be hurled into everlasting darkness.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The available taxonomy term 'chaos' is broad; the passage specifically
    describes darkness and collapse rather than a general chaos myth.
- id: motif:4
  label: Moon descends in animal form for generative work
  taxonomy_refs:
  - shapeshifter
  basis: Bahloo sneaks to earth as an emu so that he can continue the creation of
    baby girls.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives the action briefly and does not elaborate the creation
    process.
- id: motif:5
  label: Celestial and atmospheric omens of weather, death, and drought
  taxonomy_refs: []
  basis: 'Moon halo, storm clouds, meteors, and comets are each assigned meanings:
    rain, hail, death, and drought.'
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: This motif groups several separate omen explanations from the passage.
- id: motif:6
  label: Invisible tribe transformed into winds through rage
