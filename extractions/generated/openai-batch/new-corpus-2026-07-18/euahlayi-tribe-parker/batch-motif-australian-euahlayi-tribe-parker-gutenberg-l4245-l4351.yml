  quote: ''
  summary: The passage reports accounts of eclipses involving Yhi the sun and Bahloo
    the moon, moon and weather omens, death and drought signs in meteors and comets,
    the origin of winds from the invisible Mayrah, gendered winds and tree fertility,
    landmarks associated with Byamee, and a Coolabah tree haunted by the spirits of
    armless women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One eclipse account identifies Yhi, the sun, as overtaking the moon and trying
    to kill him, while spirits intervene to prevent a return to darkness.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another eclipse account says evil spirits have entered the enemies and are
    destroying them; wirreenuns chant incantations to remove the evil spirits and
    claim magical triumph when the eclipse ends.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yhi chases Bahloo across the sky after he refuses her, and she threatens sky-supporting
    spirits that the earth will fall into everlasting darkness if they let him escape.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Spirits stand around the sky holding it up, while another spirit sits in the
    sky holding the ends of Kurrajong ropes guarded at the other end.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bahloo can sneak down to earth in emu form to continue creating baby girls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A halo around the moon is interpreted as a sign of rain because Bahloo is
    said to be building a house to keep himself dry.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Netted, dusky-green storm clouds are described as an old man with a net on
    his back who is going to drop hailstones.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Meteors are said to mean death; a trail after a meteor indicates that the
    dead person left a large family.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Comets are described as evil spirits that drink rain-clouds and cause drought,
    while their tails are thirsty families that draw river water into the clouds.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Mayrah are an invisible tribe whose voices and hunting accoutrements can
    be heard or seen although their bodies cannot be seen.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: A Mayrah man becomes enraged by curiosity about his invisible body, and the
    Mayrah tribe burst with rage, rush away in six directions, and return thereafter
    as formless winds.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Doolungaiyah man burrows into sand to escape the howling Mayrah, and his
    tribe are said to have burrowed ever since.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Three winds are described as masculine and three as feminine.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Crow controls Gheeger Gheeger and keeps her in a hollow log; the Eagle-hawk
    owns Gooroongoodilbaydilbay and flies with her in the shape of high clouds.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: Yarragerh is a male wind whose wives are the Budtha, Bibbil, and Bumble trees;
    when he breathes on them they produce shoots, buds, flowers, and fruits.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: Douran Doura woos the Coolabah and Kurrajong, which flower after the hot north
    wind kisses them.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: The women winds cannot make trees fruitful; they can moan through trees, tear
    them in rage, and meet stolen lovers twice a year at the corroboree of the winds.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:18
  text: Yarragerh and Douran Doura are honored as reliable rain-bringers, and Yarragerh
    ordinarily returns to heaven after tree flowers and fruit form.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:19
  text: Byamee's tracks in stone and old battle-fields are named as historical landmarks.
  category: setting
  evidence_refs:
  - ev:16
