- id: motif:1
  label: Female seclusion, adornment, and initiation transition
  taxonomy_refs:
  - initiation
  basis: The girl is secluded with an elder, instructed in required actions, stripped
    of mud, painted and ornamented, and presented as a wirreebeeun before approaching
    the main camp.
  evidence_refs:
  - ev:1
