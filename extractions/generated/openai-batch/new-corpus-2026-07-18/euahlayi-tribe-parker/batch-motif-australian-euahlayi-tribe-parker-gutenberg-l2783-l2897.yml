canonical_text:
  quote: ''
  summary: The passage describes instructions and staged ceremonies for a girl secluded
    with an old woman, her ritual adornment, approach to her betrothed, gradual movement
    into married life, rules about marriage gifts and obligations, gender-restricted
    Boorah knowledge, and the Kumbuy spirit-women who bring food gifts after boys'
    initiation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman instructs the girl to make a ringing lip-noise whenever she hears
    a new bird note or camp sounds, warning of grey hair, dull eyes, and a limp body
    if she fails.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Girls are described as spending a long time away with only the old woman before
    moving to a new camp nearer the main camp.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the new camp the old woman removes mud from the girl's limbs and paints
    her in red ochre and white gypsum designs, mainly spots.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The girl is adorned with a white-painted forehead band, white flowers, white
    swansdown, an opossum-sinew girdle, and opossum-hair armlets with flowers.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A sprig of Dheal tree is placed through the hole in the septum of the nose
    to show that the occasion is sacred, and the girl's toilet as a wirreebeeun is
    complete.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The old woman gives the girl a bunch of smoking Budtha leaves to carry toward
    the big camp.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women at the big camp sing to the approaching girl in a language strange to
    her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The girl's betrothed sits on a log with his back toward her because he must
    not yet look on her face.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The girl throws away the smoking Budtha twigs, places her hands on the betrothed
    man's shoulders, shakes him, runs back, and is pelted by women with dry twigs
    and small sticks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The girl is moved through successive camps nearer to the main camp, then camps
    in a dardurr where a fire separates her and her betrothed for one moon before
    she camps on the same side as him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The old granny tells the girl to be a faithful and obedient wife, while also
    stating that her relations may remove her if she is ill-treated and that separation
    may return her to her people.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Wedding presents are given by the bridegroom to the mother-in-law or nearest
    kin of the wife, and the bridegroom is not allowed to speak to the mother-in-law.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Black men are said to keep the inner mysteries of the Boorah, or initiation
    ceremonies, from women.
  category: other
  evidence_refs:
  - ev:9
- id: obs:14
  text: Kumbuy, also called Moonaibaraban, are unseen spirit-women whose dog-like
    voices are heard after the Boorah and who bring food gifts to women relations
    of initiated boys.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: Old men go toward the source of the Kumbuy voices and bring in gifts such
    as yams, honey, and fruit.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Kumbuy are described as beneficent spirits who comfort bereaved women with
    food, but they refuse to recognize the wife of an uninitiated man and signal displeasure
    with a thudding earth-noise.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:17
  text: The passage states that unchaste women were terribly punished and that a death
    penalty for wantonness was enforced after the narrator's group went west.
  category: other
  evidence_refs:
  - ev:12
