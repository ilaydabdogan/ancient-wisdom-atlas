- id: motif:2
  label: Ritualized betrothal and marriage transition
  taxonomy_refs:
  - sacred_marriage
  basis: The passage explicitly marks the occasion as sacred, stages the girl's approach
    to her betrothed, separates the pair by fire, and then moves them to the same
    side as married partners.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: This is a human marriage rite, not a divine marriage; the taxonomy reference
    is broad and needs review.
- id: motif:3
  label: Ritual gift transfer through affinal or spirit channels
  taxonomy_refs:
  - sacred_exchange
  basis: Marriage presents are given to the mother-in-law or wife's kin, and Kumbuy
    gifts of food are brought after boys' initiation to their women relatives.
  evidence_refs:
  - ev:8
  - ev:10
  - ev:11
  confidence: medium
  cautions: The marriage gifts and Kumbuy gifts occur in distinct contexts; they are
    grouped only by the shared pattern of ritually directed transfer.
