canonical_text:
  quote: ''
  summary: The passage argues against explaining All Father belief solely by climate
    or social advance. It compares Euahlayi, Arunta, Kaitish, northern Australian,
    south-eastern Australian, and Zulu cases; describes the Euahlayi All Father as
    obeyed, prayed to, and rain-causing; summarizes the Kaitish figure Atnatu as self-created,
    dwelling above the sky, maker of the Alcheringa, father of some humans, punisher
    and provider; and reports an Arunta account in which ancestral spirits enter women
    and are reincarnated as children.
  language: English
  quote_policy: summarized
