canonical_text:
  quote: ''
  summary: The passage describes Byamee granting a dutiful woman, and other dutiful
    women after her, the privilege of returning after death as the sacred Durrooee
    honey-eater bird. It then recounts a Durrooee nest incident and gives a detailed
    account of a woman's funeral, including smoke rites, sacred tree twigs, grave
    goods, laments, statements about a women's afterlife, mourning actions, grave
    covering, and an explanation that smoke keeps spirits away and disinfects mourners.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Byamee allows a woman who fed the hungry to revisit her old camp after death
    with her spirit in the form of the Durrooee honey-eater bird; women who do their
    duty in life may have the same privilege.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Durrooee birds are called sacred; people must not harm them or imitate their
    cry, and a would-be attacker may be knocked over by an unseen force while seeing
    only the bird.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A boy's fall from a tree is explained as caused by a Durrooee spirit associated
    with a nest in that tree, and the tree is thereafter avoided.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the grave, people of the same totem as the dead person must not dig; nearest
    women stay with the coffin while other women and some men go away in separate
    directions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Hippi burns Budtha twigs to make dense smoke over the open grave and old graves,
    and smokes himself in it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Women bring branches of the sacred Dheal tree, lay them beside the grave,
    break them into twigs, and old women wear twigs through bored nose holes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Men place pine saplings, bark, and Dheal twigs in the grave; a bag of the
    dead woman's belongings is used as a pillow, the coffin is lowered, and a rug
    and Beemunny's yam stick are placed over it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The daughter calls to her mother to come back and the women take up the death-wail.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hippi and the old man in the grave recite laments saying the deceased will
    not return as she was and will no longer perform former food-gathering or personal-care
    activities.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A recitative says that where the deceased goes there are no fires, that she
    goes to the dead women, and that there is fruit and grass seed but no birds or
    beasts in the woman's heaven.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Old women dance a dirge step around the grave while the men fill it; the oldest
    male relative guards the body until the coffin is covered, and the daughter strikes
    her head with a sharp stone until blood comes.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:12
  text: After the grave is filled, smoke is applied to men, women, and the narrator's
    party; Bootha explains that smoking keeps spirits away, disinfects from disease,
    and prevents spirits from following people home.
  category: action
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:13
  text: The grave is covered with logs and boughs and swept around; as the party leaves,
    screeching gilahs fly over the scene.
  category: sequence
  evidence_refs:
  - ev:13
