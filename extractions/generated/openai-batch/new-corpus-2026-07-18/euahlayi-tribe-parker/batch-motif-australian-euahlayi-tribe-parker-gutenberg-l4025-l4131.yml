canonical_text:
  quote: ''
  summary: The passage describes funeral investigation, corpse-assisted identification
    of a murderer, a weapon ordeal for the accused, fear of an unburied spirit, regional
    funeral variants, widow mourning rites involving mud, smoke, water, silence, white
    coverings, and ongoing taboos around the dead person's possessions and places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A relation of the deceased is blindfolded, led to the corpse held standing
    by men, then unblindfolded to examine the corpse for visible wounds.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If signs of violence are visible, an alleged murderer must be found and tried;
    he receives a shield, and every man may throw a weapon at him; successful defense
    removes stigma for that crime.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the offender is uncertain, men stand around the coffin while a head man
    names suspects to the corpse; the corpse is said to knock at the guilty one's
    name.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dead are usually buried quickly because the spirit is said to haunt its
    neighborhood or former camp until the body is buried; mysterious night lights
    and fear in camp are reported.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Funeral practices vary by place: some dead are placed in hollow trees, some
    on tree platforms, and some corpses are tied in a sitting posture.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Some graves are covered with copi lumps, and widow mourning can involve copi
    or gypsum head coverings that are renewed during the mourning term.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: A widow must cover herself with mud and sleep beside smouldering smoke; later
    she is chased to a creek, carries a smoking bush into the water, drinks smoky
    water, is smoked at a fire, calls toward the grave, and receives an answer attributed
    to the husband's spirit.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the smoke-and-creek rite the widow is allowed to speak again; she wears
    a widow's cap, keeps her face white for months, and smokes the camp when a stranger
    arrives.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The nearest kin of a dead husband may claim the widow as wife after mourning;
    a woman widowed multiple times is spoken of as having a 'white heart.'
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: Graves may be marked by carved trees or painted upright posts; a tabooed camp
    has a marked tree with bark removed and red markings indicating that the place
    is gummarl.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Possessions of the dead not buried with them are burned, except sacred stones,
    which pass to the nearest wirreenun; a widow and her mother refuse to use a dead
    man's horses before mourning ends.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:12
  text: A widow avoids a place recently associated with her dead husband until, after
    about a year, her mother smokes the buildings, garden, and yards with Budtha while
    crooning spirit songs.
  category: sequence
  evidence_refs:
  - ev:12
