canonical_text:
  quote: ''
  summary: The passage presents an anthropological argument about Arunta and Kaitish
    totemic marriage classes. It contrasts hereditary and accidental totem acquisition,
    summarizes Mr. Frazer’s theory that accidental totems preceded marriage restrictions,
    and gives the author’s contrary theory that hereditary totems were earlier and
    that later reincarnation beliefs involving sacred or haunted stones placed the
    same totems in both exogamous divisions. It also notes Kaitish customary avoidance
    of same-totem marriage and mentions an Arunta myth asserting former exclusivity
    of totems by division.
  language: English
  quote_policy: summarized
