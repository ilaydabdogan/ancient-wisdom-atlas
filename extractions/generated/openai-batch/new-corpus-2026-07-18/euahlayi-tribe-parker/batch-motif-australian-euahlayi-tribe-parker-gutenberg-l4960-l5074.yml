  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Women’s dress and adornment include a goomillah waist string, nose bone or
    twig, hair net or fillet, kangaroo tooth, gum balls, opossum-hair armlet, reed
    bead necklet, and ceremonial flowers or down feathers.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The principal men’s dress item is the waywah, a wide belt of twisted sinews
    and hair with four long tufts of skin strips hanging from it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Opossum-skin rugs are used for winter warmth, and both sexes are described
