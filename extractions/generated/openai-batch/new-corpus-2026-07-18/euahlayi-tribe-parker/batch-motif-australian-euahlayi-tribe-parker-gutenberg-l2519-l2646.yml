candidate_motifs:
- id: motif:1
  label: Moon being creates and governs birth spirits
  taxonomy_refs:
  - sacred_birth
  basis: Bahloo the moon creates girl babies, has a spirit-stone where baby girls'
    spirits are launched, and babies are under moon patronage.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:22
  confidence: high
  cautions: The taxonomy label is broad; the passage describes creation and patronage
    of babies rather than a single narrated birth myth.
- id: motif:2
  label: Spirit-babies incarnate by seizing passing mothers from trees
  taxonomy_refs:
  - sacred_birth
  basis: Spirit-babies hang on trees until a woman passes below, then seize a mother
    and become incarnated.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No available taxonomy ref specifically covers spirit-child conception
    from trees; sacred_birth is an approximate family-level fit.
- id: motif:3
  label: Birth spirits linked to sacred tree medium
  taxonomy_refs: []
  basis: Spirit-babies hang on trees, may be associated with Coolabah trees, and a
    Coolabah leaf in a newborn's mouth can carry the baby back to spirit-land if not
    removed.
  evidence_refs:
  - ev:6
  - ev:10
  - ev:18
  confidence: medium
  cautions: The available 'sacred_tree_axis' motif would overstate the evidence because
    the passage does not present the tree as an axis mundi.
- id: motif:4
  label: Twins as feared or stigmatized birth outcome
  taxonomy_refs:
  - sacred_twins
  basis: Two baby spirits may incarnate in one woman as twins; twins bring opprobrium,
    avoidance behaviors, paternal rejection, and a reported former killing of one
    twin.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  - ev:17
  confidence: medium
  cautions: The available taxonomy term 'sacred_twins' may not fit the negative social
    valuation in the passage; it is used only as a broad twin-birth motif family.
- id: motif:5
  label: Whirlwind-mediated conception or discrediting birth
  taxonomy_refs:
  - sacred_birth
  basis: Wurrawilberoo is said to whirl a baby spirit toward a woman to discredit
    her and cause incarnation of twins or one baby.
  evidence_refs:
  - ev:9
  - ev:17
  confidence: medium
  cautions: The passage does not classify Wurrawilberoo as wind or define the whirlwind
    beyond its role as a medium.
- id: motif:6
  label: Dead children return by reincarnation and choose a mother
  taxonomy_refs:
  - death_rebirth
  basis: Spirits of babies and children who die young are reincarnated and may choose
    the same mother again or another woman.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage distinguishes these reincarnated dead children from the newly
    created spirit-babies described earlier.
- id: motif:7
  label: Unmothered spirit-babies transformed into plants
  taxonomy_refs:
  - death_rebirth
  basis: Disappointed babies who fail to obtain mothers are transformed by spirits
    into mistletoe branches with red flowers made from baby blood.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage describes transformation into plant form, but the available
    taxonomy does not include a direct plant-transformation motif.
- id: motif:8
  label: Moon taboo and punishment through illness or twins
  taxonomy_refs:
  - divine_judgment
  basis: Mothers and babies avoid looking at the full moon to prevent thrush, and
    Bahloo is said to punish a woman who stares at him by sending twins.
  evidence_refs:
  - ev:23
