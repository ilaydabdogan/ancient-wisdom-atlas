canonical_text:
  quote: ''
  summary: The passage describes Euahlayi accounts and practices concerning the creation,
    dispatch, incarnation, treatment, protection, and social interpretation of babies,
    especially girl babies and twins, under the patronage of Bahloo the moon, with
    associated figures including Wahn the crow, Waddahgudjaelwon, Wurrawilberoo, spirit-babies,
    snakes of Bahloo, trees, water-holes, moon markings, charms, and smoke treatment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bahloo, identified as the moon, is described as a patron of women who creates
    girl babies, sometimes with assistance from Wahn the crow.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Wahn attempts to create women without Bahloo, the resulting women are
    described as noisy and quarrelsome.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A hole in a dry creek bed on the Culgoa is associated with a stone that rises
    with the water while keeping its top above the water.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The rising stone is called the Goomarh, or spirit-stone, of Bahloo, and is
    not to be touched because baby girls' spirits are launched there.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A clear water-hole named Dahn is described as the rendezvous of Bahloo's snakes;
    a man sees the snakes only after drinking the water.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Spirit-babies are usually sent to Waddahgudjaelwon, who sends them to hang
    on trees until a woman passes beneath them and they seize her as mother and become
    incarnated.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage distinguishes Euahlayi spirit-babies as newly created beings rather
    than reincarnations of ancestral souls, unlike the Arunta comparison given by
    the author.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A child must have an earthly father to live; absence of such a father is indicated
    by being born with teeth.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Wurrawilberoo is said sometimes to seize a baby spirit, whirl toward a woman
    he wishes to discredit, and cause through her the incarnation of twins or one
    baby.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Babies may also be sent directly to their mothers without a Coolabah-tree
    or whirlwind medium.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Bronze mistletoe branches with orange-red flowers are described as disappointed
    babies transformed by spirits after they wailed in vain for mothers; the red flowers
    are said to be formed from baby blood.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Spirits of babies and children who die young are reincarnated and may choose
    the same mother again or another woman they know.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Two baby spirits may hang on one branch and incarnate in the same woman, resulting
    in twins; the mother of twins is said to receive opprobrium in camp.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The passage reports that in earlier times one twin would have been killed,
    and includes a quoted statement approving the killing of one twin if the speaker
    had borne twins.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: The father of twins is described as treating his wife with contempt and refusing
    to acknowledge more than one baby.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:16
  text: The first-born twin is said to be born grinning with his tongue out, as if
    announcing another child to follow and mocking the mother.
  category: attribute
  evidence_refs:
  - ev:16
- id: obs:17
  text: Women cover themselves when they see a whirlwind and avoid drooping Coolabah
    trees because either may make them mothers of twins and objects of scorn.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: When a baby is born, an old woman removes a Coolabah leaf from its mouth if
    the baby was incarnated from a Coolabah tree; if not removed, the leaf would carry
    the baby back to spirit-land.
  category: action
  evidence_refs:
  - ev:18
- id: obs:19
  text: After the leaf is removed, the baby is bathed in cold water, and hot gum leaves
    are pressed on the bridge of its nose to flatten it, a trait described as beautiful.
  category: action
  evidence_refs:
  - ev:19
- id: obs:20
  text: When a baby clutches something as if offering it, an elderly woman receives
    it, makes a muffled clicking sound, and croons a charm to make the child a free
    giver.
  category: action
  evidence_refs:
  - ev:20
- id: obs:21
  text: The charm translated in the passage repeatedly instructs the baby to give
    to the speaker, to her, to him, to one, and to all.
  category: speech
  evidence_refs:
  - ev:21
- id: obs:22
  text: Mothers mark babies at every new moon with a white cross-like mark on the
    forehead and white dabs on cheeks and chin because babies are under the patronage
    of the moon.
  category: action
  evidence_refs:
  - ev:22
- id: obs:23
  text: Mothers avoid looking at the full moon and prevent their babies from doing
    so because thrush is said to result.
  category: action
  evidence_refs:
  - ev:23
- id: obs:24
  text: Bahloo is said to punish a woman who stares at him by sending her twins.
  category: action
  evidence_refs:
  - ev:24
- id: obs:25
  text: If babies do not sleep well, mothers rub red powder from the joints of the
    needlebush tree on their skulls and foreheads.
  category: action
  evidence_refs:
  - ev:25
- id: obs:26
  text: If babies cry too much, mothers say evil spirits are in them and smoke them
    with a fire of Budtha twigs.
  category: action
  evidence_refs:
  - ev:26
