canonical_text:
  quote: ''
  summary: The passage lists Euahlayi hereditary totem kins and their multiplex totems,
    then describes rules for hereditary totems, including maternal inheritance, permitted
    eating or use, prohibition on abuse or mimicry, and marriage-category associations.
    It also describes the individual totem called yunbeai, especially for wizards
    or prospective wizards, as an alter ego that must not be eaten, can be injured,
    may be assumed in shape during danger, and shares spirit with its possessor. Anecdotes
    describe loss or safeguarding of a yunbeai. A Minggah, a spirit-haunted individual
    tree, is also described as both danger and help.
  language: English
  quote_policy: summarized
