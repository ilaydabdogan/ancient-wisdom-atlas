canonical_text:
  quote: ''
  summary: The passage describes Euahlayi methods for hunting emu and birds, fishing
    with nets and stone traps, and gathering other foods. It includes a named setting-emu
    song, coordinated drives, feathered spear tactics, boomerang hunting, net fishing,
    Brewarrina fish-traps attributed to Byamee and his giant sons, tribal fish-yard
    rules, food restrictions, a star-spirit gift of ant larvae, fat-smearing, flood
    traps, and shrimp catching.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a setting emu is discovered, the discoverers return to camp singing the
    Noorunglely setting-emu song, and people in camp sing back a reply.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After learning where the emu nest is, the hunters take a net, camp near the
    nest, and hold an emu-hunting corroboree that evening.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At daylight the net, called mirroon, is erected as a triangular yard with
    one side open, with men stationed at the ends and along the net.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A wide circle of hunters frightens the emu from her nest toward the open side
    of the net; she enters the net, is seized, killed, and her eggs are taken.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: One hunting method uses a long spear with emu feathers fastened to its end;
    the hunter climbs a tree, hides with boughs if needed, lets the spear hang down,
    and throws it when the emu comes underneath.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a speared emu runs away, it can be tracked by a trail of blood, and sometimes
    is found dead the next day with the spear still in it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ducks, pigeons, gilahs, and plains turkeys are described as birds killed with
    boomerangs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fishing nets are described as about ten feet by five feet, with a stick through
    each end, preferably of Eurah wood.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: In one fishing method, two people hold a net upright in shallow creek water
    while others splash upstream to drive fish down into the net.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Fish are also caught with stone weirs and dams that include narrow stone passages
    leading into yards where fish are caught by hand or speared.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Brewarrina stone fish-traps on the Barwon are said to have been made by
    Byamee and his giant sons.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Byamee is said to have established a common camping-ground for various tribes
    and a rule of strict peace during the fishing festival.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Each tribe has particular fish yards; taking fish from another tribe's yards
    is described as theft, and each tribe repairs its own yards.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The stone fish mazes are described as about two hundred yards long, substantially
    built, labyrinthine, and successful in catching many fish.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: Dingo pups are described as a valued food, while eating dog is said to be
    dangerous for women because it increases birth-pangs.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: Ant larvae are described as a special gift from a spirit in the stars, and
    frogs are also said to be considered good food.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: People smear themselves with fat from fish or game, which is said to keep
    limbs supple and give the skin an admired gloss.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: After floods, bough breaks and a bag-like net are used as a fish-trap; crayfish
    and mussels are dug from mud holes, and women catch shrimps by letting them bite
    and then seizing them.
  category: sequence
  evidence_refs:
  - ev:9
