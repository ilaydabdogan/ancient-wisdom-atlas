candidate_motifs:
- id: motif:1
  label: Boorah initiation through staged smoke rites, seclusion, and instruction
  taxonomy_refs:
  - initiation
  basis: The passage describes repeated ceremonial stages for boys, including smoke
    rites, prescribed posture, senior ritual participants, seclusion, restrictions,
    and later access to sacred ceremonies and teachings.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  - ev:14
  confidence: high
  cautions: The account is an ethnographic description rather than a narrative myth
    episode.
- id: motif:2
  label: Restricted sacred knowledge revealed by initiation grade
  taxonomy_refs:
  - forbidden_knowledge
  basis: At the second Boorah a young man is allowed to see sacred fire rites, earthen
    figures, tree carvings, and to hear legends, Byamee's song, and prayer; access
    is tied to having passed through rites.
  evidence_refs:
  - ev:9
  - ev:14
  confidence: medium
  cautions: The passage presents knowledge as restricted and graded; it does not frame
    it as transgressively stolen or illicitly obtained.
- id: motif:3
  label: Eligibility for divine sky-camp through rite completion
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage states that only those who have gone through the Boorah rites
    can go to Byamee's sky-camp.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage gives a destination rule but not a detailed afterlife journey
    route.
- id: motif:4
  label: Postmortem divine judgment for breaches of sacred law
  taxonomy_refs:
  - divine_judgment
  basis: Breaches of Byamee's laws are reported by an all-seeing spirit at death,
    and the person is judged accordingly.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The judgment process is summarized briefly; procedural details are not
    given.
- id: motif:5
  label: Lower-world punishment of the guilty dead
  taxonomy_refs:
  - afterlife_journey_map
  basis: The spirit of a guilty person is committed to Eleanbah Wundah, described
    as a lower world of continual movement and potential darkness countered by fires.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage emphasizes punishment and location, not a mapped journey into
    the lower world.
- id: motif:6
  label: Weapon ordeal to resolve forbidden marriage transgression
  taxonomy_refs: []
  basis: A man who has taken a forbidden wife may retain her only after surviving
    a shield-only weapon trial by her male kin.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: This is presented as a legal or customary practice within the ethnographic
    account; no broader mythic comparison is supplied in the passage.
- id: motif:7
  label: Reciprocal compensation after marriage transgression
  taxonomy_refs:
  - sacred_exchange
  basis: After the man survives the trial, the passage says a woman of his family
    is given to a man of the woman's family to square things.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The exchange is described as customary compensation; the taxonomy label
    is only approximate because the passage does not explicitly call the exchange
    sacred.
