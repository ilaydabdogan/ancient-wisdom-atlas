canonical_text:
  quote: ''
  summary: The passage describes stages of Boorah training and ceremonies for boys,
    including smoke fires around or near a Dheal tree, chanting, dancing, boomerang-clicking,
    ritual seclusion, ornamentation, maternal removal of body paint, and later restricted
    revelations at a second Boorah. It also records teachings about Byamee, sacred
    figures, eligibility for Byamee's sky-camp, unforgivable sins, after-death judgment,
    punishment in a lower world, a trial connected with taking a forbidden wife, care
    for the old and sick, sacred tree carvings, songs, and prayer facing east.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Gayandi was heard at night in camp, and the passage states that another
    ceremony was at hand.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women at the big camp made a large fire, covered it with Budtha, Dheal, and
    Coolabah leaves to create thick smoke, and the fire was around a Dheal tree.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Boorahbayyi were brought out of the scrub by the Munthdeegun while the
    voice of the Boorah spirit sounded in the distance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The painted boys walked with heads down and hands on thighs, stood on logs
    on the fire, placed a hand on the central tree, and remained while smoke curled
    around them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Women past child-bearing sang while men danced outside the leaf-smoke and
    clicked boomerangs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: About four moons later, another leaf-smoke was made; the boys were smoked
    again, and old women put a large net over them while chanting.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: About another moon later, the boys were painted principally white and decorated
    with a waywah, yunbean, forehead bands, opossum-hair armlets, and feathers.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some old men added wongins with seaside shells and gum beads to their decorations,
    and women also arranged their hair with fresh gum beads.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The mothers of the Boorahbayyi put their hands on their sons' shoulders and
    rubbed all the paint off the boys' bodies while the boys did not look at them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After these rites the boys could camp nearer the general camp but still had
    no intercourse with its people and could not receive food from or speak to a woman
    for twelve months.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: At a second Boorah, a young man was allowed to see the sacred fire ceremony,
    thrown-in weapons, walking on burning coals, and huge earthen figures of Byamee,
    Birrahgnooloo, and Baillahburrah or Dillalee.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states that Byamee initiated the Boorah and that only those who
    have gone through its rites can go to his sky-camp.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: 'Three unforgivable sins are named: unprovoked murder, lying to tribal elders,
    and stealing a woman within forbidden degrees.'
  category: speech
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:14
  text: A guilty spirit is described as being committed to continual movement in the
    lower world of Eleanbah Wundah, where large fires are kept up against darkness.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: A man who had taken a forbidden wife could keep her if he survived a weapon-throwing
    trial using only a shield, followed by a reciprocal giving of a woman from his
    family to hers.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: Kindliness toward the old and sick is described as a command of Byamee, and
    breaches of his laws are reported by an all-seeing spirit at a man's death before
    judgment.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:17
  text: At a second Boorah, a man may see tree carvings, hear their legends, hear
    Byamee's Boorah song, and hear the oldest wirreenun pray to Byamee while facing
    east.
  category: sequence
  evidence_refs:
  - ev:14
