- id: ev:9
  type: summary
  locator: 3534-3540
  quote_or_summary: At his second Boorah a young man may see the sacred fire ceremony,
    weapons thrown in, walking on burning coals, and earthen figures of Byamee, Birrahgnooloo,
    and Baillahburrah or Dillalee; he is told Byamee initiated the Boorah and that
    only initiates can go to his sky-camp.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/euahlayi-tribe-parker.md
  rights_note: Public domain source; summary used.
- id: ev:10
  type: summary
  locator: 3542-3549
  quote_or_summary: Three unforgivable sins commit a guilty spirit to continual movement
    in the lower world of Eleanbah Wundah, where large fires prevent darkness.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/euahlayi-tribe-parker.md
  rights_note: Public domain source; summary used.
- id: ev:11
  type: summary
  locator: 3551-3554
  quote_or_summary: The three deadly sins are unprovoked murder, lying to tribal elders,
    and stealing a woman within forbidden degrees of totem, blood, or clan.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/euahlayi-tribe-parker.md
  rights_note: Public domain source; summary used.
- id: ev:12
  type: summary
  locator: 3556-3568
  quote_or_summary: A man who has taken a forbidden wife may keep her if he survives
    a trial in which her male kin throw weapons while he has only a shield; if successful,
    a woman of his family is given to a man of hers, and such a man is called a Booreenbayyi.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/euahlayi-tribe-parker.md
  rights_note: Public domain source; summary used.
- id: ev:13
  type: summary
  locator: 3570-3574
  quote_or_summary: Care for the old and sick is described as Byamee's command; breaches
    of his laws are reported by the all-seeing spirit at death and judged accordingly.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/euahlayi-tribe-parker.md
  rights_note: Public domain source; summary used.
- id: ev:14
  type: summary
  locator: 3575-3583
  quote_or_summary: At his second Boorah a man may see tree carvings, hear their legends,
    hear Byamee's Boorah song, and hear the oldest wirreenun pray to Byamee facing
    east; the dead are mostly buried facing east.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/euahlayi-tribe-parker.md
  rights_note: Public domain source; summary used.
