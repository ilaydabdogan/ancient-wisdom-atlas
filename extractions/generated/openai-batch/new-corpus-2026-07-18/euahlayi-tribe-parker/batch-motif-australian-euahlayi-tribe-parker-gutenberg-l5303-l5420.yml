canonical_text:
  quote: ''
  summary: The passage describes dances, muscular performance, a corroboree reenacting
    the first steamer on the Barwon, a legend about Goolahwilleel making a gum kangaroo
    instead of hunting, spirit-associated song and corroboree composition, intertribal
    song barter, and ghiribul riddles performed with song and pantomime.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Two admired dances are described: an in-and-out knee movement with feet close
    together, and a chest-shivering motion made by drawing breath in and out.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Performers give a timed muscular display, successively showing muscles of
    legs, arms, and sides of the chest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A corroboree is said to illustrate the coming of the first steamer up the
    Barwon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The steamer prop is made from logs with mud layered over them, painted, with
    a hollow log as a funnel and a hidden fire producing smoke through it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some performers represent birds disturbed by the strange sight, including
    cranes, pelicans, black swans, and ducks, and imitate each bird's traits and cries.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Armed men enter the staged scene, see what the birds have seen, show astonishment,
    hold a dumb-show palaver, and approach the object with weapons.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the fire is stoked, smoke and flame come through the funnel, and the
    armed men flee into the bush.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The performance setting is described as dark bush with Belah and Coolabah
    trees lit by flickering fires.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The soundscape includes sing-song, clicking boomerangs, and thudding rolled-up
    rugs.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Goolahwilleel legend, his family sends him to hunt for the daily meal,
    but he instead models a kangaroo in gum and returns expecting applause.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Goolahwilleel's family demands meat, rejects his kangaroo model, reviles him,
    and thereafter sends relations with him so he cannot go alone.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A maker of new songs or corroborees is said to be kept supplied with luxuries
    and may be feared because of supposed direct communication with spirits who teach
    the art.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Some poets and playwrights are described as seized by frenzy and dominated
