  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Some songs are said to come through barter, handed from tribe to tribe.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: Ghiribul, or riddles, are socially important; many are small songs in which
