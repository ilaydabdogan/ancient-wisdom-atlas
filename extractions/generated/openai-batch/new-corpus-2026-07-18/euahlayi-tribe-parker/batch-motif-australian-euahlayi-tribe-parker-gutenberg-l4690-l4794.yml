  summary: The passage describes foraging, cooking, fishing, bush-walk instruction,
    named places and legends, a narrated account of an eagle-hawk breaking emu eggs
    with a stone, honey gathering from native bees, an explanation of dead bees going
    to a sky paradise and returning with the seasonal flowers, and a drought-related
    account in which Byamee sends manna by birds and ants after humans respect trees
    marked as his own.
  language: English
  quote_policy: summarized
