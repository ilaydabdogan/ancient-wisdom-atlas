canonical_text:
  quote: ''
  summary: 'The passage describes Euahlayi funeral and mourning practices and beliefs:
    abandoning and tabooing a camp after death; using smoke fires and swept grave
    tracks; identifying a magical killer through totemic animal tracks; funeral adornment
    with Dheal twigs; prayers for an initiated man’s spirit to enter Bullimah through
    Byamee; uninitiated spirits wandering until reincarnation; the dead sending rain;
    blood offerings at graves; the spirit’s journey with dead relations to Oobi Oobi
    and ascent into Bullimah by means of Mooroobeaigunnil spirits; meteoric death
    omens; and older mortuary treatments involving bark, hollow trees, smoke, body
    preservation, and Dheal leaves.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a death, the old camp would be changed and made gummarl, a tabooed place,
    with smoke fires burned there to scare away spirits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grave area could be swept so that next morning tracks on the swept place
    would indicate the totem of a suspected magical murderer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Examples given for interpreting grave tracks include an iguana track indicating
    the Beewee or iguana totem, and an emu track indicating the Dinewan or emu totem.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Earlier funeral attendance included body painting and twigs of the sacred
    Dheal tree placed around waists, wrists, knees, and ankles.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: For an initiated dead man, a short prayer would commend his spirit to Byamee
    and ask that he be allowed into Bullimah because he had kept the Boorah laws.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Uninitiated spirits are said to wander until reincarnated and never enter
    Bullimah.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A dying woman was reported to have said she would send rain in three days
    if she could when her spirit breath went toward Oobi Oobi, and rain then fell
    after the stated interval.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A dead person is said always to send rain within a week of death to wash out
    earthly tracks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Blood shed over a grave is described as pleasing the dead because it proves
    the affection of the living.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: On emerging from the grave, the spirit finds dead relations waiting to accompany
    him to Oobi Oobi, a sacred mountain whose top nearly touches Bullimah.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The new spirit recognizes dead relations who had been visible to the dying
    person near the death-bed, though not to ordinary watchers.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The spirit carries Dheal twigs placed over and under the body and drops them
    along the path as a trail for followers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: At the top of Oobi Oobi, Mooroobeaigunnil spirits bridge the distance to Bullimah
    by lifting the spirit in a chain or ladder of spirits.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: When the spirit is lifted into Bullimah, the spirit ladder collapses to earth
    with a thunderclap-like sound heard by distant tribes.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Meteors, falling stars, and daytime falling stars are interpreted as signs
    of deaths or details about the deceased.
  category: other
  evidence_refs:
  - ev:11
- id: obs:16
  text: In older mortuary practice, some bodies were kept for days, treated by removing
    skin and internal parts, filled with Dheal leaves, and buried after placing removed
    parts in bark and hollow trees.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: Bodies could be kept so that small joint bones might be extracted for poison,
    or so distant relations could inspect whether death involved foul play.
  category: action
  evidence_refs:
  - ev:13
  - ev:15
- id: obs:18
  text: A baby’s body could be carried for years before burial, usually after being
    smoke-dried.
  category: action
  evidence_refs:
  - ev:14
- id: obs:19
  text: After a body was filled with Dheal leaves, it could be put into a bark coffin
    with smoke fires made around it.
  category: sequence
  evidence_refs:
  - ev:16
