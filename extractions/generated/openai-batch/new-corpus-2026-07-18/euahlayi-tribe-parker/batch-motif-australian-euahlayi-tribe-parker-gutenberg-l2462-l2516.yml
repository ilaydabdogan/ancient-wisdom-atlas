canonical_text:
  quote: ''
  summary: 'The passage describes Bootha''s rain-making with a wi-mouyan and rain-song,
    a localized storm over the narrator''s garden, an explanation that another wirreenun
    stopped rain by placing a rain-stone in fire, and incidents around Bootha''s witch-pole
    or witch-stick: its fall as a death omen, a subsequent death report, a taboo warning,
    and a note that wirreenuns formerly used totem wizard-sticks to guard camps.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman parades the creek bank with the wi-mouyan and sings a rain-song said
    to charm water from the creek into clouds and make it fall where she directs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator asked Bootha to make rain for a wilted garden; Bootha at first
    refused because she was offended with Matah after one of her dogs had been poisoned.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bootha agreed to make rain for the narrator by an appointed day, and a heavy
    storm fell over the garden, filled a nearly empty ground tank, and barely wet
    the dust within half a mile on either side.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the successful rain, the narrator gave Bootha a new dress and tobacco.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: During a later drought, Bootha failed and explained that a great wirreenun
    upstream had placed his rain-stone in a fire, so that no rain would fall while
    he did so.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The upstream wirreenun was described as angry with white people for driving
    away emu, kangaroo, and opossums while objecting when Aboriginal people’s dogs
    killed sheep.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Bootha had a witch-pole in the narrator's garden; its falling was said to
    foretell the death of a relative of someone in the house.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Matah and the narrator observed a western sky with a golden sun, grey clouds,
    a halo of golden light, and three shafts spreading like roadways upward into the
    heavens.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: As the observers waited for the sunset afterglow, Bootha's pole fell while
    the air was still; Matah said damp may have loosened it and advised leaving it
    alone because it might be taboo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: That evening a messenger reported that the narrator's cook's mother had died
    just before sunset, and the camp afterward believed in Bootha's witch-stick.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bootha said that if the observers had touched the stick, sores would have
    broken out over their bodies.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that long ago the wirreenuns used to have a sort of totem
    wizard-stick guarding the front of their camps.
  category: object
  evidence_refs:
  - ev:7
