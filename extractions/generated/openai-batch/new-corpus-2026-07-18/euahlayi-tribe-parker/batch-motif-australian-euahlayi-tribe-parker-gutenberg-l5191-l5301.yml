canonical_text:
  quote: ''
  summary: The passage describes Euahlayi amusements and competitive games, including
    rope-skipping with imitative variations, come-back boomerang throwing, rolling
    bark-target spearing, throwing-stick games, a sham fight, totem-based ball play,
    clan wrestling, a fireside leaf game, branch-swinging, hide-and-seek, and corroborees
    with women as orchestra and men generally as dancers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Brambahl is described as a favourite game of old men using a long rope swung
    by a man at each end while a skipper enters and performs variations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Brambahl variations include removing thorns from feet, digging for ant
    larvae or yams, grinding grass-seed, jumping like a frog, carrying a child, and
    lying flat while the rope continues without pause.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Brambahl, the performer with the most successful variations is victor,
    and old men over seventy are said to seem best at skipping.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: In Bubberah, each candidate has a little fire, rubs the come-back boomerang
    with charred grass and fat, warms it, checks its shape, and throws it on a circular
    flight that returns to the given spot.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Wungoolay, pieces of bark are rolled along the ground, and men stationed
    nearby try to spear them with pointed sticks called widyu-widyu; the player with
    the most hits wins.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Gurril Boodthul, men throw miniature waddies through the top of a bush
    or bushy tree branch, and the distance travelled beyond it is the test of throwing
    skill.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Yahweerh is described as a sham trial fight in which one man with a bark shield
    defends himself against bark toy boomerangs thrown by others.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Boogalah, all members of one Dhe or totem are partners, women join the
    game, a sewn kangaroo-skin ball is thrown and caught, and the totem keeping it
    longest wins.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Goomboobooddoo is a Boorah-time wrestling entertainment in which family clan
    competes against family clan around a mudgee, a painted stick with feathers at
    the top.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before Goomboobooddoo wrestling matches, bodies are greased to make them slippery.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Wimberoo is a fireside game in which a big fire of leafy branches creates
    an air current that carries warmed Coolabah leaves aloft, and players watch whose
    leaf goes highest.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Woolbooldarn uses a low overhanging tree branch, which old and young, men
    and women straddle and swing on while holding higher branches.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Whagoo is identified as being like hide and seek.
  category: other
  evidence_refs:
  - ev:9
- id: obs:14
  text: Gooumoorhs, or corroborees, are described as the greatest entertainment; women
    form the orchestra, men are generally the dancers, and dancers sometimes end a
    measure with loud cries.
  category: speech
  evidence_refs:
  - ev:10
