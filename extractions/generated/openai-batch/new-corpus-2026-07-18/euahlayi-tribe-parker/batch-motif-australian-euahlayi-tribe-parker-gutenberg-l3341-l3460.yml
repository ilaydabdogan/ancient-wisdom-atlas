candidate_motifs:
- id: motif:1
  label: Boorah initiation through seclusion, ordeal, new identity, and degrees
  taxonomy_refs:
  - initiation
  basis: The boys are removed from their mothers, fast, receive guardians, new names,
    sacred stones, possible tooth removal, further exclusion from higher ceremonies,
    two moons of instruction, and staged return.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:12
  confidence: high
  cautions: The passage is a settler-era ethnographic account; extraction records
    only the passage's description.
- id: motif:2
  label: Symbolic death and rebirth as a new social person
  taxonomy_refs:
  - death_rebirth
  basis: Each boy is told he will go to sleep as the boy he had been and wake in the
    morning as a new man with a new name and sacred stone.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The death-rebirth label is interpretive; the passage describes social
    transformation rather than literal death and resurrection.
- id: motif:3
  label: Restricted sacred knowledge and concealed ritual object
  taxonomy_refs:
  - forbidden_knowledge
  basis: The gubberah must be concealed from the uninitiated and women; the boys hear
    ceremonies from which they are not yet admitted because initiation has degrees.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The passage presents restriction within initiation rather than a narrative
    of illicit acquisition.
- id: motif:4
  label: Punishment of sacred transgressors by ritual destruction
  taxonomy_refs: []
  basis: The passage says Boorah victims who scoffed at sacred things are cooked,
    partly consumed by eligible men, and destroyed in the fire, while their spirits
    wander pending possible reincarnation.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: No specific taxonomy family exactly matches this passage-level pattern;
    avoid treating it as sacrifice unless corroborated elsewhere.
- id: motif:5
  label: Spiritual force contained in a sacred stone
  taxonomy_refs: []
  basis: The small white gubberah is linked to the initiate's life spirit and to the
    strength of the Boorah spirit, protecting him if kept and harming him if lost.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not state the stone is worshipped or used as an oracle.
- id: motif:6
  label: Body mark as recognition by a spirit
  taxonomy_refs: []
  basis: The chant says the missing front tooth is the Boorah spirit's sign and that
    the spirit will know the boy by it and not harm him.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage says this tooth removal is not universal across tribes.
- id: motif:7
  label: Prophetic divination in crystals
  taxonomy_refs:
  - wisdom
  basis: The oldest wirreenuns are said to see pictures of the past, distant present,
    and future in sacred crystals.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The taxonomy reference is broad; the passage specifically concerns ritual
    specialists' crystal visions.
- id: motif:8
  label: Ritual neglect bringing collective end
  taxonomy_refs:
  - divine_judgment
  basis: Byamee is said to remain in his crystal seat and preserve the people while
    they keep sacred laws and Boorah rites, but to move and bring their end if they
    fail.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage presents this as an explanation for a prophetic vision; the
    exact status of Byamee's action as judgment is interpretive.
- id: motif:9
  label: Conditional reincarnation after punishment
  taxonomy_refs: []
  basis: The chant says the victims' spirits should wander until reincarnated if the
    Boorah spirit gives them another chance, perhaps only in animals.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No available taxonomy reference directly corresponds to reincarnation
    in this list.
comparison_claims:
- id: claim:1
  claim: The passage's narrator explicitly compares the boys' sacred stones to Baetyli
    of pagan antiquity, noting a partial resemblance between sacred stones associated
    with divine or spiritual power.
  claim_level: same_function
  target: Baetyli of pagan antiquity
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: low
  limitations: This is the source narrator's analogy, not evidence of historical contact.
    The passage describes the gubberah mainly as concealed and life-spirit-linked,
    while the Baetyli description adds oracle use, suspension on the body, and round
    form.
