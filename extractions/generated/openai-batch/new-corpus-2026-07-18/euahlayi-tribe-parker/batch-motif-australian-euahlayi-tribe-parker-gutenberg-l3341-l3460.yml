canonical_text:
  quote: ''
  summary: 'The passage describes later stages of a Boorah initiation: destruction
    and ritual consumption of punished victims, chants about sacred transgression
    and reincarnation, the boys'' return to the ring, their new names and sacred stones,
    tooth removal in some groups, further seclusion, a Little Boorah reception by
    old women, instruction in sacred matters, prophetic crystal visions, and an account
    linking maintenance of Boorah rites to Byamee''s continued support of the people.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bodies of the Boorah victims are cooked; only men who have attended five
    Boorahs eat flesh from them; the bones and remains are placed in the fire and
    destroyed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A song states that people who scoff at sacred things should be treated in
    this way, that their wasted strength should pass into other men, and that their
    spirits may wander until reincarnated if the Boorah spirit allows it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boys are brought back to the ring with hands on thighs and heads lowered,
    and each is placed near the outer edge of the ring.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Each Munthdeegun tells his boy that he will sleep as the boy he had been and
    wake as a new man, and that a new name and sacred stone will be given in the morning.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Gayandi are said to settle the boys' names and tell the wirreenuns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the morning, the Munthdeegun chant and dance before the boys; the first
    boy is called to rise by a new name, and the men clap their thighs and shout.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: An old wirreenun gives each boy a small white gubberah, which must be concealed
    from the uninitiated and women and produced when required.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Loss of the sacred stone is described as fatal, weakening the boy's life spirit
    and turning the strength of the Boorah spirit against him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narrator compares the stones to Baetyli of pagan antiquity, described
    as round stones animated with a portion of deity and used as oracles or suspended
    on the body.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: In some tribes, a boy has a front tooth knocked off after receiving the stone.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A chant says that the missing front tooth is a sign by which the Boorah spirit
    will know the boy and not harm him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Some wirreenuns bury the extracted teeth by the Boorah fire; others wrap them
    up as charms or to send to other tribes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After marching and chanting around the fire, the boys are taken away and given
    food for the first time since leaving their mothers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The boys hear distant chants and understand that ceremonies continue from
    which they are not yet admitted, because initiation has degrees.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: On the fourth day the boys are taken about ten miles to camp near the Durramunga,
    or Little Boorah.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:16
  text: At dawn, each Munthdeegun takes his partially initiated boy to the Durramunga,
    where a ring is surrounded by heaped grass rather than earth.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:17
  text: Old women sing and corroboree toward the boys, inspect marks on their shoulders,
    embrace them, cry with joy, and dance around them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: For two moons the boys remain away, learning about sacred things.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: They are told that the oldest wirreenuns can see pictures of the past, distant
    present, and future in sacred crystals.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:20
  text: A future vision is described in which the colours of the blacks grow paler
