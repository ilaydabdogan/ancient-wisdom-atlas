canonical_text:
  quote: ''
  summary: The passage describes how Euahlayi medicine men or doctor-wizards are selected
    and trained through nocturnal ordeals, spirit visitations, sacred objects, instruction
    by spirits of the dead, later healing practices, consultation with spirit dwellings,
    and ideas about wandering dream spirits whose capture or failure to return causes
    illness or death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old wizards select a young boy, take him to a tribal burial-ground at night,
    tie him down, leave him, and light fat fires around him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An unnamed spirit comes to the bound boy and turns him over without undoing
    his fastenings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A large star falls from the sky beside the boy, and a Beewee or iguana emerges
    from it; the boy recognizes it as his totem and believes it will not hurt him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The iguana comes close, climbs on the boy, runs down his length, and departs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A snake approaches the boy while hissing; the boy cannot free himself, call
    out, close his eyes, or turn away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The snake crawls onto the boy, licks him, and goes away, leaving him as if
    paralysed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A huge figure carrying a gunnai or yam stick drives it into the boy's head,
    pulls it out through his back, and places a Gubberah sacred stone in the opening.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Gubberah stone is described as a small, lemon-sized, semi-transparent,
    crystal-like stone connected with later magical work.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The cleverest wizards are said to use such stones to see the past, distant
    present events, and the future, and to cause death by directing rays from them.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Spirits of the dead dance around the boy and chant songs containing sacred
    healing lore and instructions for calling on their aid.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The next day an old wizard releases the boy, keeps him away from camp, and
    at night ties him down again at a bower-bird's playground, where spirits of the
    dead again impart lore.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The stated reason for taking the boy to the weedah or bower-bird's playground
    is that the weedah was formerly a great wirreenun before being changed into a
    bird.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: Bower-bird playgrounds are described as grass, tent-shaped arches open at
    both ends, surrounded by heaps of white bones, black stones, glass, and sometimes
    European objects.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:14
  text: The medical student is tied down for several nights, then left without bonds,
    kept away from camp for about two months, and only allowed to practise years later.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The later wizard cures burns by sucking out charcoal and treats chest pains
    by claiming to suck out hair, bones, or other objects placed there by an enemy.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: If ordinary curing fails, the healer may conclude that a stronger wizard has
    bewitched the patient and consult spirits at a Minggah, usually a tree, or at
    a stone called Goomah for the greatest wizards.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:17
  text: A distant wirreenun can send his Mullee Mullee or dream spirit to interview
    friendly spirits.
  category: action
  evidence_refs:
  - ev:14
- id: obs:18
  text: A sick person's Doowee or dream spirit may be captured by an enemy, and the
    healer then tries to get it back.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:19
  text: Dream spirits can leave sleeping bodies and wander; dreams are explained as
    what the Doowees see while away.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:20
  text: Capture, injury, or non-return of a Doowee is said to cause sickness, tiredness,
    languor, or death in the body.
  category: relationship
  evidence_refs:
  - ev:16
