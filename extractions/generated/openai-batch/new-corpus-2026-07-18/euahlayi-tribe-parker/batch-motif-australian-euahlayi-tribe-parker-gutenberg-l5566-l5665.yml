literal_observations:
- id: obs:1
  text: Marmbeyah are described as tree spirits; one large spirit carries a green
    boondee or waddy and causes heat apoplexy by tapping people on the backs of their
    necks.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old black fellow is said to have waited for the heat-apoplexy spirit and
    flattened him out, after which there was no heat apoplexy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Boolees, or whirlwinds, are said to be animated by devil visitors, especially
    Wurrawilberos, and to fill houses with debris and dust when they come near.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wirreenuns sometimes use whirlwinds as transit media for Mullee Mullees or
    dream spirits sent against enemies or to capture a woman or incarnate child spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Great wirreenuns are said to remove evil spirits by eating the form in which
    those spirits appear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The plain of Weawarra is said to be haunted by the ghosts of two young widows
    who searched for their slain husbands, disappeared, and now silently enter camps
    at night before vanishing before dawn.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The high ridges above Warrangilla are said to be haunted by two women buried
    alive, whose spirits emerge from a huge fissure and whose cries are still heard.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Two beautiful white girls called Bungebah are said to have lived with the
    blacks before white people came, to have been killed as devils by an alien tribe,
    and to have produced two red-leaved trees where their blood was spilled.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Cookeran Lake, a woman who arrived late at the big Boorah after losing
    her children is said to have died cursing the tribes who deserted her, turning
    them into trees and Belah forests.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The same Cookeran Lake woman is said still to wander with her dead baby in
    the goolay on her back, with her voice mingling with the forest.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Noorahgogo, a bronze and peacock-blue beetle, is said to embody a spirit that
    answers the cry of a Noongahburrah in the bush.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Bright orange-red fungi on fallen trees are called devils’ bread, and a child
    who touches them is said to be spirited away.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Curlews, night herons, plovers, and passing swans are described as birds in
    which spirits or former men are embodied.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage says gum leaves appear silver in moonlight and that the blacks
    say the leaves laugh; it also says wirreenuns linger beneath trees to converse
    with spirit friends.
  category: attribute
  evidence_refs:
  - ev:9
