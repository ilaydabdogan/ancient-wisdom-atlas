  quote: ''
  summary: The passage says that iguanas remain in soft sand ridges during winter
    and come out after butcher birds, described as their sub-totems, sing loudly and
    call on thunder to help warn them that winter has ended. It then describes customary
    restrictions in which old men refuse certain foods prepared by women, though women
    may cook items prepared by men unless they have young children or are pregnant,
    in which case they are described as unclean.
