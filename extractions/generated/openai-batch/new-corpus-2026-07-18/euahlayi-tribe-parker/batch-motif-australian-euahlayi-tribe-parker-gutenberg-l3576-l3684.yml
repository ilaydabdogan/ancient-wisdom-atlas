canonical_text:
  quote: ''
  summary: The passage describes prayers or invocations connected with Byamee, the
    restricted chanting of Byamee's song, staged Boorah initiation with stones, food-taboo
    removals, message-sticks, bull-roarers, war and marriage status, and the destruction
    of ritual constructions. It also summarizes other ceremonial meetings, totemic
    corroborees, totemic ownership of winds, rain, storms, clouds, and narratives
    of crow restraining the cold west wind and north-west people singing up hurricanes.
  language: English
  quote_policy: summarized
literal_observations:
