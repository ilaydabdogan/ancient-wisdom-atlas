  summary: The passage moves from a brief comment on a drought-related legend to an
    ethnographic description of Euahlayi game-trapping methods, including waterhole
    bird traps, duck drives, noose yards, an emu-calling instrument, stalking methods,
    net-making materials, smoking of fishing nets, and charm songs sung over nets.
  language: English
