literal_observations:
- id: obs:1
  text: The narrator says the preceding legend shows the West as disheartening in
    drought and notes that even spirits gave in there.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Trappers used known game watering-holes, made rough breaks, laid a net along
    the track, placed sticks for birds to rest on, and hid men in holes beside the
    net.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the beginning of Dheelgoolee trapping, hunters on the first day brought
    home live game to give luck to the man at the Dheelgoolee; after the first day
    they could kill game while out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Birds and night-waterers were caught at the Dheelgoolee when men turned the
    sticks and net to entrap game on the net.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ducks were driven toward a net across a creek; bark pieces thrown high with
    hawk-like cries and duck-like whistles redirected frightened ducks into the net.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Murrahgul was a yard around a waterhole with an opening fitted with string
    nooses or overhead slip-knot strings to catch or strangle emu or kangaroo.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Boobeen was a hollowed Bibbil-wood cornet partly filled with pine gum, carved
    outside, and said to sound like an emu cry that could draw a solitary emu.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: For emu trapping on sandhills, a hidden man used a hole, a drain, bushes,
    scattered emu feathers, and a stringed branch with feathers as part of the lure.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: An emu answering the Boobeen call followed the feathered decoy until it stepped
    on a Murrahgul string trap; kangaroo could also be stalked behind boughs and surrounded
    by armed men.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Emu nets were made from thick string of Kurrajong bark or Burraungah grass,
    with bark stripped, beaten, chewed, teased, and rubbed into strands, principally
    by women.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Burraungah grass was softened in a covered ground hole using fire, coals,
    ordinary grass layers, sprinkled water, and earth, then chewed and worked.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Fishing nets were smoked before use, all nets had small charm songs sung over
    them, and an emu net was about five feet high and two to three hundred yards long.
  category: action
  evidence_refs:
  - ev:11
