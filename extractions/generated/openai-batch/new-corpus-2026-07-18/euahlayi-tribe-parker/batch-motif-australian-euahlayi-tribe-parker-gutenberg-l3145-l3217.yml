canonical_text:
  quote: ''
  summary: Byamee creates a voiced stone man-figure associated with Gayandi or Darramulun,
    but transforms the dangerous being into Nahgul. He then discovers a desired whirring
    sound from chips of a Coolabah tree, makes wooden Gayandi pieces, and hides them
    as the medium of Gayandi's voice. The passage then describes Boorah preliminaries,
    including processions, song, wrestling, sham fights, and tests of uninitiated
    boys before they may be judged worthy of full initiation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Byamee made a stone figure in the image of a man, and the figure had a voice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spirit known as Gayandi or Darramulun went to the Boorah, where he was
    to knock out the boys' front tooth, but instead began to eat the boys' faces.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Byamee transformed the spirit into a large piggiebillah-like animal with thick
    hair, later known as Nahgul, who went into the bush and haunts Boorah grounds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nahgul is described as a dreaded devil whose touch on a man's shadow causes
    incurable itching.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Byamee made a stone bull-roarer-like thing, but it was too heavy to make the
    noise he wanted.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: While chopping a Coolabah tree near Weetalibah water-hole, Byamee heard the
    whizzing sound made by flying chips and decided to make a Gayandi of wood.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Byamee shaped pieces of mubboo or beefwood and Noongah or Kurrajong, tied
    strings to them, and hung them in the Coolabah tree.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Byamee's wives heard strange voices in the Coolabah tree and asked what they
    were.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Byamee sent the women away, took down the wooden pieces, hid them until he
    made a Boorah, and the pieces became the medium for Gayandi's voice.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The wooden pieces are said to be kept hidden from all except the eyes of wirreenuns.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: After the tribes arrived and preparations were complete, fully initiated men
    entered in single file carrying a firestick and a green switch, then corroboreed
    around the mudgee in the big ring.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Old women answered the men's corroboree with a Boorah song.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Men tried to steal each other's boys, and wrestling contests occurred around
    the mudgee between boys and then elder men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Uninitiated boys, called eeramooun, were tested in sham fights with bark shields
    against bark boomerangs, and in boomerang, boodthul, sport, and warfare trials.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: A boy who did well in the trials was said by the men to be worthy to become
    a yelgidyi, or fully initiated young man.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: After wrestling and sham fights, corroborees began and continued all night,
    sometimes with day performances too.
  category: sequence
  evidence_refs:
  - ev:8
