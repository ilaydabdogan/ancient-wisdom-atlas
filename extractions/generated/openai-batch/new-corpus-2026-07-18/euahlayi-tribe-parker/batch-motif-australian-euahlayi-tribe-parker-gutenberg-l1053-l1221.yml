canonical_text:
  quote: ''
  summary: The passage describes Euahlayi social divisions, relationship categories,
    marriage rules, and naming practices. It presents two exogamous moieties, Gwaigulleeah
    and Gwaimudthen, associated with light and dark blood and said to originate in
    red ancestors from the west and dark ancestors from the east. It also describes
    matrilineal inheritance of phratry and local country name, matrimonial classes
    with permitted marriage pairings, night-name avoidance to keep devils from enticing
    children away, birth-circumstance naming, and daily use of relationship terms
    as names.
  language: English
  quote_policy: summarized
