canonical_text:
  quote: ''
  summary: 'The passage describes preparations and early proceedings for a Boorah
    initiation: rings, paths, carved trees, sacred fire, arrivals of initiate boys
    and attendants, women’s songs and actions, nightly ceremonies, earthen totemic
    and ancestral figures, and the invisible Gayandi/Boorah spirit represented by
    voice and bull roarers. Byamee is described as instituting the first Boorah and
    making the first Gayandi.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A large circle was cleared, banked with earth, and connected by a cleared
    path with low earthen embankments to a thick scrub.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Trees beside the path and around the Bunbul had bark stripped off and were
    carved with totems and multiplex totems.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some trunks around the Bunbul were lopped, carved, and painted as figures
    of men, including figures said to represent sons of Byamee's wives.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A heap of wood was placed in the middle of the Bunbul for the Yungawee, described
    as a sacred fire.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Initiate boys and the Munthdeeguns arrived from each tribe painted, with leafy
    twigs tied to wrists and ankles and green branches in hand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The men especially in charge of boys held a painted spear with a waywah on
    top.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A head man called out place names along creeks and watercourses, and the group
    answered with the cry 'Wah! Wah! wah!'.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Older women sang Boorah songs; some held their breasts to show sons among
    initiates, while others put hands on shoulders to show brothers being made young
    men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Newcomers and men who met them walked around a brush yard at a measured beat
    while the geographical names and cry continued.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the Boorah song, men, two oldest men with tufted spears, and Boorah
    boys marched out, followed by women who pelted the boys with leafy twigs until
    reaching camp.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The boys did not look at the women throwing leafy twigs, and the passage states
    that a Boorah boy must show no curiosity.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Nightly corroborees were held; fully initiated men helped prepare the inner
    sacred ground, and younger men collected food.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Old men made huge earthen animal forms along the path and around the Bunbul,
    including totems such as crocodiles, kangaroos, and emus, and plastered and painted
    them.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: An earthen figure of Byamee reclined on the right of the Bunbul holding a
    Boondee in each hand.
  category: object
  evidence_refs:
  - ev:11
- id: obs:15
  text: An earthen figure of Birrahgnooloo, described as Byamee's favourite wife,
    stood on the other side and held two spears.
  category: object
  evidence_refs:
  - ev:11
- id: obs:16
  text: A third earthen figure represented Baillahburrah, or according to others Dillalee,
    described as a supernatural son of Byamee or, in another account, his brother,
    not born of woman and living before the human race existed.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:17
  text: No figure was made of Gayandi, the Boorah spirit also called Wallahgooroonboooan,
    because he was said to be always present at Boorahs though invisible, with only
    his voice evidencing his presence.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:18
  text: Wirreenuns said Gayandi placed heaps of dry wood in tree forks around the
    big ring and would light them when ceremonies began.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:19
  text: A mudgee, described as a painted stick or spear with hawk feathers on top,
    was placed in the middle of the Boorah ring.
  category: object
  evidence_refs:
  - ev:14
- id: obs:20
  text: When Gayandi was heard at night, younger women and children stopped their
    ears and old women shrieked their BRUMBOORAH.
  category: action
  evidence_refs:
  - ev:14
- id: obs:21
  text: Old men went into the scrub and whirled Gayandi bull roarers, increasing the
    sound as more groups arrived.
  category: action
  evidence_refs:
  - ev:15
- id: obs:22
  text: The passage states that Gayandi's function is to inspire awe, that Byamee
