candidate_motifs:
- id: motif:1
  label: Boys' initiation into young men
  taxonomy_refs:
  - initiation
  basis: The passage repeatedly identifies the boys as initiates being made young
    men and describes restricted conduct, processions, sacred ground, and ritual specialists
    around the Boorah.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:16
  confidence: high
  cautions: The passage is an ethnographic description of ritual preliminaries rather
    than a complete initiation narrative.
- id: motif:2
  label: Culture hero institutes ritual and creates ritual sound object
  taxonomy_refs:
  - culture_hero
  basis: Byamee is said to have instituted the first Boorah in the district, to have
    travelled as Creator and culture hero, and to have made the first Gayandi.
  evidence_refs:
  - ev:2
  - ev:11
  - ev:16
  confidence: high
  cautions: The passage summarizes these claims within a ritual description and does
    not narrate the full mythic episode.
- id: motif:3
  label: Invisible spirit made present through voice and bull roarer sound
  taxonomy_refs: []
  basis: Gayandi is described as invisible and always present at Boorahs, with voice
    as evidence; old men whirl bull roarers called Gayandi, and the sound inspires
    awe.
  evidence_refs:
  - ev:12
  - ev:14
  - ev:15
  - ev:16
  confidence: high
  cautions: The passage also notes that old men whirl the bull roarers, so extraction
    should distinguish the reported spirit explanation from observed ritual action.
