  quote: ''
  summary: Hrothgar laments Æschere's death, says a female kin of Grendel killed him
    in revenge for Beowulf's slaying of Grendel, reports that local people had seen
    two uncanny moorland beings, describes their desolate watery dwelling, and asks
    Beowulf to seek the dangerous place for reward.
