canonical_text:
  quote: ''
  summary: Beowulf receives further gifts, including drink, gold, jewelry, armor,
    and a great collar. The narrator compares the splendor of the gift to the famed
    Brosingmen necklace and recalls its connection with Hama and Higelac. Wealhtheow
    addresses Beowulf and the war-band, urging him to enjoy the gifts, prosper, instruct
    the liegemen mildly, and be kind to her son. The banquet continues, but the warriors
    do not know the cruel fate ahead. Hrothgar leaves to sleep, the hall is guarded,
    and warriors lie down with shields, helmets, mail, and spears nearby; one beer-thane
    is marked as doomed.
  language: English
