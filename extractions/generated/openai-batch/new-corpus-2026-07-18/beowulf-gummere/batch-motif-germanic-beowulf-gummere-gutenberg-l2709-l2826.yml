canonical_text:
  quote: ''
  summary: Hrothgar enters the hall, sees Grendel's severed hand displayed, thanks
    God for deliverance, praises Beowulf, and promises a new father-son relationship
    and rewards. Beowulf recounts the struggle, explaining that Grendel escaped because
    God did not will his capture, but left behind his hand, arm, and shoulder. Beowulf
    says Grendel will face divine judgment. Unferth is silent, and the princes examine
    the monstrous clawed hand, judging that no sword could cut it away.
  language: English
  quote_policy: summarized
