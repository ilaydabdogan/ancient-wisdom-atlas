canonical_text:
  quote: ''
  summary: After the Danes fall asleep in Heorot, the poet explains that Grendel's
    mother, an avenger dwelling in cold waters and linked to the lineage of Cain,
    comes to the hall to avenge her son. She attacks while the retainers sleep, seizes
    and kills Hrothgar's beloved retainer, takes the bloody hand associated with Grendel,
    and flees toward the fen. Hrothgar grieves, and Beowulf is summoned at dawn to
    come with his companions.
  language: English
  quote_policy: summarized
