canonical_text:
  quote: ''
  summary: 'Beowulf speaks to Hygelac. He predicts that a Heathobard-Danish marriage
    settlement will fail when old war-gear displayed at a feast stirs memories of
    slain kin and provokes renewed violence. He then recounts Grendel''s attack on
    Heorot: Grendel kills Hondscio, grapples with Beowulf, and retreats wounded, leaving
    his right hand behind before going to the sea-bottom. Hrothgar rewards Beowulf
    with gold and ornaments, and the Danes feast with harp music and old stories.
    The passage then turns to Grendel''s mother, who seeks vengeance for her son by
    killing Æschere and preventing his cremation by the Danes.'
  language: English
  quote_policy: summarized
