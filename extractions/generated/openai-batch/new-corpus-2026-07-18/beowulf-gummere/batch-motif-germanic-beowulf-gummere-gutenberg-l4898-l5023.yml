canonical_text:
  quote: ''
  summary: A fugitive servant enters an earth-cave and finds an ancient treasure hoard.
    The hoard had been buried by the last survivor of a noble people, who lamented
    the loss of his warriors and entrusted the treasure to Earth before dying. An
    ancient fire-dragon later finds and guards the hoard for three hundred winters.
    The servant takes a plated beaker to his lord and obtains pardon. When the dragon
    wakes, it tracks the intruder, discovers the missing cup, and sets out in fiery
    anger, bringing fear to the land and grief to the gold-giver.
  language: English
  quote_policy: summarized
