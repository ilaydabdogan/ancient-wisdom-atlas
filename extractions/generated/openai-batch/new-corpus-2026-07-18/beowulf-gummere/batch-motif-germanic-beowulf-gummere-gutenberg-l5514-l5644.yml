canonical_text:
  quote: ''
  summary: Wiglaf, seeing Beowulf suffering under the dragon's heat, arms himself
    with inherited gear and remembers gifts and obligations. He rebukes the other
    retainers for failing to aid their ring-giving lord, declares he would rather
    burn beside Beowulf than return without him, and goes through the smoke to help.
    The dragon attacks again with fire, Wiglaf's shield fails, and he shelters under
    his kinsman's shield. Beowulf strikes the dragon with Nægling, but the sword breaks.
    On a third attack, the fire-drake bites Beowulf's neck.
  language: English
  quote_policy: summarized
