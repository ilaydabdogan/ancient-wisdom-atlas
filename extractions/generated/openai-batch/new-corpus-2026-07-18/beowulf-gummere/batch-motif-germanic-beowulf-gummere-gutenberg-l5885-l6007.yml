  summary: Beowulf and the dragon lie dead near the hoard. Ten retainers who had fled
    return ashamed. Wiglaf, exhausted and unable to revive Beowulf with water, rebukes
    them for deserting their gift-giving lord and declares the loss of honor, gifts,
    and land-rights that will follow.
