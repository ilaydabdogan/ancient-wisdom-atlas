  quote: ''
  summary: Beowulf, speaking for the Geatish visitors, identifies their lineage and
    friendly intent toward Hrothgar, names his father Ecgtheow, and says he can advise
    Hrothgar against the hidden night-destroyer afflicting the Danes. The coast-guard
    accepts their intentions, leads them toward Heorot, orders their ship protected
    by the shore, and returns to his sea-watch after blessing their mission. The passage
    also describes the anchored vessel, boar-marked helmets, and the gleaming, renowned
    hall of Heorot.
