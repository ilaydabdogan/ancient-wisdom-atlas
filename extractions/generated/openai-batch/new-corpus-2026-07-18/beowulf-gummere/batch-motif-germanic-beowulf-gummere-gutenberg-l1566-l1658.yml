  quote: ''
  summary: A company of armed Geats approaches Hrothgar's palace, sets shields and
    weapons against the wall, and is questioned by a Danish servant about origin and
    purpose. Beowulf identifies himself and his party as Hygelac's companions and
    asks to speak with Hrothgar. Wulfgar conveys the request to Hrothgar and urges
    courteous reception, noting the visitors' worthy appearance and Beowulf's rank.
  language: English
