canonical_text:
  quote: ''
  summary: The passage opens the poem by recalling the Spear-Danes' glory and Scyld
    Scefing's rise from wretched isolation to a tribute-receiving king. A son and
    heir, Beowulf, is born and described as sent by God to comfort the people. The
    passage states that a young ruler should win future loyalty by gifts. At Scyld's
    fated death, his comrades place him in a richly furnished ship with treasures,
    weapons, and a gold standard, send him out on the sea, mourn him, and say that
    no one knows the ship's final haven. The funeral also recalls that Scyld had once
    been sent alone over the sea as an infant.
  language: English
