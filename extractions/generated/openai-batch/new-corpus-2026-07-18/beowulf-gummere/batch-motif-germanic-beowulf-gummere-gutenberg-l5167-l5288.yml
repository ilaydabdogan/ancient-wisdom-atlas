canonical_text:
  quote: "“When he fate-driven fared to fight with the dragon.”"
  summary: Beowulf, after surviving many battles, goes with eleven companions to seek
    a fire-drake. A captive informer reluctantly points out an underground treasure
    cave near the ocean, guarded by an uncanny warden. Beowulf sits on a headland,
    salutes his companions, and speaks while death and Weird are near. He recalls
    being fostered by Hrethel, the accidental killing of Herebald by Hæthcyn, and
    an illustrative image of an old father grieving a hanged son and a desolated household.
  language: English
  quote_policy: quoted
