    Grendel suffers a fatal shoulder wound, his body bursts, and he flees toward fen-cliffs
    and marshes. The Danes' wish is fulfilled as Beowulf cleanses Hrothgar's hall
    of evil and suspends Grendel's hand, arm, shoulder, and claw beneath the hall
    roof.
