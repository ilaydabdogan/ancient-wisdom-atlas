canonical_text:
  quote: ''
  summary: Armed Geat retainers return to the shore, are recognized and welcomed by
    the coast-guard, and Beowulf gives the guard a gold-bound sword before the ship
    departs Denmark. The vessel reaches Geatish cliffs, where a port-warden secures
    it and directs that treasure be taken toward Hygelac. The passage then describes
    Hygelac's hall, Hygd's youthful generosity, and Thrytho's earlier violence, later
    marriage to Offa, reported virtue, and royal lineage through Eomær.
  language: English
