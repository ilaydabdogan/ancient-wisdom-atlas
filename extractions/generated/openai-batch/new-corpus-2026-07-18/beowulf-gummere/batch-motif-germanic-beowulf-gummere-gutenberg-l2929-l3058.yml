canonical_text:
  quote: ''
  summary: 'After Beowulf''s victory, a Danish lord gives costly gifts to Beowulf''s
    companions and orders gold compensation for a warrior killed by Grendel. Music
    follows in the hall, and Hrothgar''s singer performs the lay of Finn and Hnæf:
    Hnæf dies among the Frisians; Hildeburg loses close kin; Finn and Hengest make
    an oath-bound settlement with shared hall privileges and gifts; then Hnæf and
    Hildeburg''s son are burned on a funeral pyre with other fallen warriors.'
  language: English
  quote_policy: summarized
