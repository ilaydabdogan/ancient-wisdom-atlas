canonical_text:
  quote: ''
  summary: Beowulf, beneath the barrow, raises his shield and brandishes an ancient
    heirloom sword against a coiling dragon. The dragon advances in flames; Beowulf
    strikes it, but the sword weakens and then fails. The dragon renews the attack
    with fire, while Beowulf suffers encircled by flames. His companions flee to the
    forest, but one person is inwardly troubled by care and kin-love.
  language: English
  quote_policy: summarized
