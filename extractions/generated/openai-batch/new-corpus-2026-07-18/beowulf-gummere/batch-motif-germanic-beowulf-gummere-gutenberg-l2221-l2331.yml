canonical_text:
  quote: ''
  summary: Hrothgar leaves the hall and seeks Wealhtheow. The narrator says God has
    provided a watcher for the hall. Beowulf removes his armor and weapons, speaks
    defiantly, and declares that he will meet Grendel without sword-edge or other
    weapons, leaving the outcome to God. Beowulf and the Geatish warriors lie down;
    the men fear they may never return home because of Grendel's earlier slaughter
    in the hall. The narrator states that God grants aid through one man's strength
    and governs nations. In the night Grendel approaches while all warriors sleep
    except one warder.
  language: English
  quote_policy: summarized
