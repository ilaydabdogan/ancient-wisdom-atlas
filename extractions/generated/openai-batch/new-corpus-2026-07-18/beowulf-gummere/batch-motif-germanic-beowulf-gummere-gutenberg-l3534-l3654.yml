canonical_text:
  quote: ''
  summary: Beowulf urges Hrothgar to avenge the slain retainer rather than grieve.
    Hrothgar and an armed troop follow Grendel's mother's tracks through fen, cliffs,
    narrow passes, and mountain woods to bloody water where Æschere's head lies. Serpents
    and water-monsters appear at the mere, and Beowulf kills one with an arrow. Beowulf
    arms himself with armor, a helmet, and Unferth's sword Hrunting before entering
    the wave-deeps.
  language: English
  quote_policy: summarized
