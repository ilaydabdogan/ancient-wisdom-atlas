canonical_text:
  quote: ''
  summary: Hrothgar recalls Beowulf and his father, hears reports of Beowulf's extraordinary
    strength, and welcomes him as divinely sent help against Grendel. Wulfgar admits
    Beowulf and the Geats into Heorot. Beowulf identifies himself as Higelac's kinsman
    and vassal, recounts earlier monster-fighting deeds, asks to fight Grendel without
    weapons, describes the consequences if he dies, and orders that his armor be sent
    to Higelac if he falls.
  language: English
  quote_policy: summarized
