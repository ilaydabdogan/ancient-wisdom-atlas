canonical_text:
  quote: ''
  summary: At dawn, warriors gather at the hall and follow Grendel's tracks toward
    bloody waters where he has died in his lair. Riders and nobles praise Beowulf
    without diminishing Hrothgar. A bard sings Beowulf's venture alongside Sigmund's
    ancient exploits, including the slaying of a hoard-guarding dragon, and contrasts
    this heroic fame with Heremod's failed rule. Hrothgar, his queen, and attendants
    go to the hall to view the wonder.
  language: English
  quote_policy: summarized
