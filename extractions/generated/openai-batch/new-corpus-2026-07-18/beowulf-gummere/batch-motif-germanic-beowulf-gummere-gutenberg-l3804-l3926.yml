canonical_text:
  quote: ''
  summary: The passage describes Beowulf finding and wielding an ancient giant-sword
    in the underwater dwelling, killing Grendel's mother, cutting off Grendel's already
    lifeless head, and returning upward through the sea. Watchers at the shore see
    the water turn bloody and many assume Beowulf has died. The giant-sword melts
    from the monsters' blood, leaving the jeweled handle. Beowulf reaches land safely,
    and his companions carry Grendel's head on a spear to Hrothgar's hall.
  language: English
