  summary: Beowulf recounts that a female foe carried off a corpse beneath a mountain-brook
    flood. Hrothgar, deeply grieved, asked Beowulf to risk himself in the sea-currents
    and promised rewards. Beowulf found the cruel depth-warder, fought amid gore-filled
    waters, cut off Grendel's mother's head in a hall at the bottom with a sword-edge,
    escaped alive, and afterward received many jewels from the kinsman of Healfdene.
