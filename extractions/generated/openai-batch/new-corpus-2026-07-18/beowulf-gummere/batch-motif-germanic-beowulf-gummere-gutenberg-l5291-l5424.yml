  quote: ''
  summary: Beowulf continues recollections of grief, feud, and past battle service,
    then makes his last boast before facing the dragon. He says he will confront the
    fiery hoard-guardian alone, instructs his retainers to wait, approaches the stone
    barrow and cave, and calls out until the dragon's breath issues from the stone-cave.
  language: English
