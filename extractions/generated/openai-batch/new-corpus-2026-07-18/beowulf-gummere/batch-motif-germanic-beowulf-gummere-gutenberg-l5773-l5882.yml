canonical_text:
  quote: ''
  summary: Wiglaf obeys the wounded Beowulf, enters the dragon's barrow, sees an ancient
    hoard and a shining golden banner, and carries treasure back. He finds Beowulf
    near death and bathes him with water. Beowulf thanks the Lord for letting him
    win treasure for his people, asks for a memorial barrow at Whale's-Ness, gives
    Wiglaf his ring and war-gear, names him the last of their kin, and dies as his
    soul departs to glory.
  language: English
  quote_policy: summarized
