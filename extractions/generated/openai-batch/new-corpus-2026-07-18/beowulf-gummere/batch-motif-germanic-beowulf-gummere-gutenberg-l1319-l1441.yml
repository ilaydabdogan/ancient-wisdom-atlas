  summary: Hrothgar suffers under Grendel's attacks. Beowulf hears of the trouble,
    prepares a ship, selects fourteen companions, and sails from Geatland to Danish
    territory. The travelers land, thank the Wielder for a gentle sea crossing, and
    are challenged at the shore by a Danish coast guard who demands their identity
    and origin while noting Beowulf's exceptional appearance.
