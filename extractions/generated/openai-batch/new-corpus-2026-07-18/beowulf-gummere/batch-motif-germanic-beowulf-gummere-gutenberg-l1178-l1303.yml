canonical_text:
  quote: ''
  summary: Grendel attacks the sleeping Danes in Heorot after nightfall, carries off
    thirty thanes, and continues nightly violence for twelve winters. Hrothgar mourns
    and consults with his council. The Danes seek help through offerings at idol-shrines,
    while the narrator contrasts this with ignorance of the Christian God, who is
    said to oppose Grendel.
  language: English
