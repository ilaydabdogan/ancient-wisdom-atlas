canonical_text:
  quote: ''
  summary: 'A fire-spewing dragon ravages Beowulf''s land and returns to its hidden
    cavern and barrow. Beowulf hears that his own hall is burning, grieves, fears
    divine anger, orders an iron shield, and resolves to face the dragon without a
    large war-band. The passage then recalls earlier episodes: Beowulf''s fights against
    Grendel''s kin, Higelac''s death, Beowulf''s lone swim home with armor, Hygd''s
    offer of rule, Beowulf''s support of Heardred, the arrival of Ohthere''s sons,
    Heardred''s death, and Beowulf''s later rule over the Geatmen.'
  language: English
  quote_policy: summarized
