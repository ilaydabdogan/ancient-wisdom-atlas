canonical_text:
  quote: ''
  summary: 'The Finn episode continues: survivors go to Friesland; Hengest remains
    with Finn through an ice-bound winter, then vengeance is stirred, Finn is killed,
    and the Scyldings carry away treasures and Finn''s queen to Daneland. The lay
    ends and the hall-banquet resumes. Wealhtheow, crowned in gold, passes the cup,
    greets Hrothgar, urges generosity to the Geats, speaks of succession and Hrothulf''s
    expected loyalty, and turns toward her sons, beside whom Beowulf is seated.'
  language: English
  quote_policy: summarized
