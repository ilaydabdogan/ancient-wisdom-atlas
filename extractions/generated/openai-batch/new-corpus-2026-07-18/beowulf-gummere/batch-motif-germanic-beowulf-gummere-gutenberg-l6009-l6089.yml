  summary: A messenger reports Beowulf's death after the dragon fight to waiting Geat
    retainers. He says Beowulf and the dragon lie dead, with Wiglaf keeping watch
    over them, and warns that Beowulf's death will invite renewed attacks from old
    enemies. The speech recalls earlier conflicts involving Franks, Frisians, Hugmen,
    Merewings, Swedes, Higelac, Hæthcyn, and Ongentheow.
  language: English
