canonical_text:
  quote: ''
  summary: In the final combat, Wiglaf aids Beowulf against the dragon or worm. Wiglaf
    strikes the enemy and the fire lessens; Beowulf draws a knife and cuts the worm,
    and the pair destroy it. Beowulf's poisoned wound worsens. He sits by the stone
    earth-hall, is tended by Wiglaf, reflects on his rule and lack of an heir, invokes
    divine judgment, and asks Wiglaf to bring the hoard so he can see it before yielding
    his life and people.
  language: English
