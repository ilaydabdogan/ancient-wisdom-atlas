canonical_text:
  quote: ''
  summary: Beowulf announces his departure for Higelac, promises Hrothgar future aid
    if enemies threaten, and says Hrethric would find friends among the Geats. Hrothgar
    praises Beowulf’s wisdom, imagines him as a fitting future Geatish ruler if Higelac
    dies, describes peace and gift exchange between Geats and Danes, gives Beowulf
    jewels, and parts from him with kisses, tears, and grief before Beowulf goes to
    the waiting ship with treasure.
  language: English
  quote_policy: summarized
