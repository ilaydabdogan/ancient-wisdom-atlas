canonical_text:
  quote: ''
  summary: 'The preface describes the translator''s effort to render Beowulf in modern
    measures while retaining features of Anglo-Saxon verse. It then outlines the story:
    Hrothgar, king of the Danes or Scyldings, builds a mead-hall for feasting and
    gifts; Grendel attacks from a fen-dwelling and persecutes Hrothgar''s people for
    twelve years; Beowulf of the Geats hears of the trouble, sails with fourteen companions
    to Dane-land, persuades Hrothgar of his ability to help, and is given wardship
    of the hall for the night.'
  language: English
  quote_policy: summarized
