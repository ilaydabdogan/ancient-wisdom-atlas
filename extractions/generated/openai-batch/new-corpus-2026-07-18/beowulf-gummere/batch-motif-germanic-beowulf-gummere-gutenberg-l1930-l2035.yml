  summary: Unferth, jealous of Beowulf's fame, taunts Beowulf in Hrothgar's hall by
    recalling a dangerous swimming contest with Breca and predicting failure against
    Grendel. Beowulf replies that Unferth is drunk, explains the swim as a youthful
    pact, says currents separated him from Breca, and recounts being dragged underwater
    by a sea-creature that he killed with his weapon.
  language: English
