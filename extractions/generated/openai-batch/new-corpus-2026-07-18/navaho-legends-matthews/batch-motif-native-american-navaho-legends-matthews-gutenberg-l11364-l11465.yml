canonical_text:
  quote: ''
  summary: The passage lists male and female masked ceremonial characters and gives
    ethnographic notes on personators of Nayénezgani and To`badzistsíni in a night
    chant act of succor, including masks, body painting, body symbols, ritual objects,
    patient prayer, sacrificial cigarettes, and deposition under trees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thirteen male characters are listed, followed by female characters including
    Hastséoltoi and Hastsébaad, described as goddesses.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: For the male characters, the first seven each wear a different mask, while
    the last six wear masks of one yébaka pattern.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: All female characters are said to wear masks of one kind.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man dressed to personate Nayénezgani appears in an act of succor during
    the night chant, with body paint, a black mask, feathers, shell attachments, necklaces,
    and bow figures painted on the body.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The Nayénezgani personator carries a stone knife and makes motions at the
    patient and medicine-lodge to draw out disease; the patient prays to him and gives
    a black cigarette marked with bow-symbols.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The To`badzistsíni personator appears as the War God or Child of the Water,
    with red ochre body paint, white earth on the hands, queue-symbols on the body,
    and a red, black, and white mask decorated with queue-symbols.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: The To`badzistsíni personator carries cedar and piñon cylinders and makes
    motions at the patient and lodge; the sacrificial cigarette he receives is red
    and marked with queue-symbols.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: The cigarette for Nayénezgani is deposited under a piñon-tree, and the cigarette
    for To`badzistsíni is deposited under a cedar-tree.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:8
- id: obs:9
  text: For both Nayénezgani and To`badzistsíni, some painted body symbols are left
    open or unfinished.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:6
