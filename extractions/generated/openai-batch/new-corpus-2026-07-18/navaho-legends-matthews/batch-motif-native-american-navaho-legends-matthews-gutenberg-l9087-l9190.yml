  text: An ear of corn used for sacred purposes must be completely covered with full
    grains; for some female initiation implements it must also have a four-grain tip
    and is called tohonoti'ni.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The term nátli or nu'tle is translated in the note as hermaphrodite, while
    the author explains that it usually designates men who dress as women and do work
    allotted to women in camps.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The note says nátli are credited in the legend with inventing arts practiced
    by women and that a noted Navajo weaver was a nátli.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Masks made from deer-head and antelope-head skins, with or without antlers,
    are said to have been used in hunting to deceive animals and let hunters approach.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: First Woman thanks her vagina after eating deer meat; First Man objects that
    he killed the deer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: First Woman argues that women can live without men because women till fields
    and gather food; First Man becomes angry and jumps across the fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: During the separation of the sexes, the note says both men and women committed
