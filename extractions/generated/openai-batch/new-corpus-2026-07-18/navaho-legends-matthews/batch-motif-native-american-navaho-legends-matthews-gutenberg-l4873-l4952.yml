canonical_text:
  quote: ''
  summary: A warned woman enters a sunflower-covered dry lake bed, and the feathers
    in her basket change into many small birds. To`badzistsíni reports watching kethawns
    and seeing a black cigarette take fire and then go out as a sign of Nayénezgani's
    danger and safety. Nayénezgani then seeks Tse`tahotsiltá`li, a cliff-dwelling
    anáye who kicks travelers down a precipice; he kills the being with a stone knife,
    cuts hair rooted into the rock, kills most of the being's young, and spares one
    who is sent to Natsisaán and is named as progenitor of the Pahutes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The two Tse`na'hale are plucked; their feathers are put in a woman's basket,
    while Nayénezgani reserves the largest feather from one wing of each bird as trophies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nayénezgani warns the woman not to pass through either of two nearby dry lake
    beds; despite a repeated warning, she walks into the sunflower-covered place.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Birds of varied plumage fly out of the woman's basket; the feathers change
    into small birds such as wrens, warblers, and titmice until the basket is empty.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: To`badzistsíni says he watched the kethawns while Nayénezgani was absent,
    and that the black cigarette took fire at midday and later went out.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nayénezgani says the black cigarette's fire must correspond to the time when
    Tse`na'hale carried him up and threw him on rocks.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Nayénezgani hangs his trophies on the east side of the lodge, asks his mother
    where Tse`tahotsiltá`li dwells, receives the place-name Tse`tezá`, and is warned
    by her against seeking the enemy.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tse`tahotsiltá`li lives beside a high cliff where a trail passes at his feet,
    and he kicks travelers down to the bottom of the precipice.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The cliff-dwelling anáye kicks at Nayénezgani four times; Nayénezgani dodges
    each kick, and the anáye explains the movement as merely stretching his leg.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Nayénezgani strikes Tse`tahotsiltá`li repeatedly with his great stone knife;
    the body does not fall until Nayénezgani cuts hair that grows like roots into
    a cleft in the rock.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: After the body falls, voices from below quarrel over parts of the corpse,
    and Nayénezgani thinks they are the monster's children.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Nayénezgani descends, finds twelve young of the anáye who have just devoured
    their father's corpse, and kills all but one with his stone knife.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The one surviving young anáye is spared, sent to Natsisaán, and the passage
    states that he became the progenitor of the Pahutes.
  category: relationship
  evidence_refs:
  - ev:10
