canonical_text:
  quote: ''
  summary: Notes to several Navajo legend passages identify a lava plain as the blood
    of Yéitso, describe the brothers' return with ritual songs after encountering
    Yéitso, add details on horned and bird-like monsters, explain Winged Rock as a
    mythic home for Tse`na'hale, summarize Navajo male/female symbolic classifications
    in nature and ritual materials, and give variants concerning bird transformation
    and bird naming.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dark lava plain south and west of the San Mateo Mountains is said by Navajos
    to have once been the blood of Yéitso.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Places where the lava appears suddenly arrested are explained as points where
    the war god stopped the blood-flow with his knife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After their encounter with Yéitso, the brothers return by way of Azíhi and
    Kainipéhi and sing twenty Nidotátsogisin songs now used in hozóni hatál rites.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Near Dsilnáotil at daybreak, Hastséyalti and Hastséhogan meet the young heroes,
    embrace them, call them grandchildren, sing two songs, and conduct them home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Téelget has several name pronunciations, is described as an anáye, and is
    associated etymologically and genealogically with horns, including an antelope-horn
    father.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Arabis holböllii is identified with a Navajo plant name translated as scattered
    or lone medicine because the plants grow singly rather than in beds or clusters.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Version A says six Feather Songs were sung while work was done on kethawns,
    and these songs are now used in the hozóni hatál rite.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Version A says Téelget's horns resembled antelope horns and that Nayénezgani
    cut off the short branch of one horn as a trophy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tse`na'hale are described as mythic creatures, called harpies by the author
    by analogy with Greek mythology, believed in by many tribes of the Southwest,
    and said by Hatáli Nez to be offspring of eagle plumes.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Winged Rock is a high dark volcanic pinnacle likened by Navajos to a bird
    and treated as the mythic home of the bird-like Tse`na'hale.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The note states a recurring Navajo pattern in which the coarser, stronger,
    or more violent of two resembling things is male, while the finer, weaker, or
    gentler is female.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Examples of male/female classification include rivers, thunderous and non-thunderous
    rain, mountain mahogany and cliff rose, sunflower and Verbesina, north and south,
    and black and blue.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Version A describes young birds as blue-heron colored with eagle-like bills
    and very large eyes, and says Nayénezgani threw them to the bottom of the cliff
    and metamorphosed them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Version B says an unnamed female figure, after giving up her feathers for
    lost, names different kinds of birds as they fly out until her basket is empty.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The word Tse'-da-ni is glossed as an expression of impatience and contempt.
  category: speech
  evidence_refs:
  - ev:12
