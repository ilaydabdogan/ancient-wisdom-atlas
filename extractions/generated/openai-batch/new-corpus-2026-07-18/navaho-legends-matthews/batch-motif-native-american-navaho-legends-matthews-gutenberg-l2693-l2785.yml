canonical_text:
  quote: ''
  summary: After two young women are missing for three days, White Body and Blue Body
    lead a man and woman to the river, use white and blue shell bowls to open the
    water, and reveal a four-room house beneath it. The man, woman, and Coyote descend,
    find the water monster Tiéholtsodi with the stolen girls and his own two children,
    and leave with the demanded children while Coyote secretly steals Tiéholtsodi's
    children. Soon animals flee and Locust couriers report a vast flood from the east.
    The people attempt to escape rising waters by fast-growing seed trees, but the
    trees fail to grow high enough. An old man brings earth from seven sacred mountains,
    and his son plants thirty-two reeds that become one great hollow reed; the people
    enter it just before the flood reaches them.
  language: English
  quote_policy: summarized
