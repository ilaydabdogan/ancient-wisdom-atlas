canonical_text:
  quote: ''
  summary: After Nati'nesthani's bear-slaying, a chief and his people thank him and
    recount harms done by Deer Raiser and the bears. The chief gives Nati'nesthani
    food and two protective medicines against Deer Raiser's poison and witchcraft.
    Despite Deer Raiser's warnings, Nati'nesthani makes forbidden journeys to the
    south, west, and north, meeting colored, masked little men who instruct him in
    ritual cigarettes and their deposition. After the fourth journey, he confronts
    Deer Raiser, treats him in the first atsósi hatál, teaches his people what he
    learned, establishes the rite among the Navahoes, and returns to the whirling
    lake of Tó`nihilin.
  language: English
  quote_policy: summarized
