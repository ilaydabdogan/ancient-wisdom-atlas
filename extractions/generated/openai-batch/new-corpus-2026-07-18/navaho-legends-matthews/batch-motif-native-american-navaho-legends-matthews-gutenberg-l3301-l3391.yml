canonical_text:
  quote: ''
  summary: Nohoílpi flies to the sky home of Békotsidi, receives new domestic animals,
    cloth, and a newly made people, then returns to old Mexico and becomes associated
    with the Mexicans. A Navaho witness reports what he saw among the gods. Coyote
    marries a Navaho woman, visits Porcupine and Wolf, enjoys food made from unusual
    materials, then fails when he imitates their procedures. Coyote later visits Hummingbird
    maidens and boasts that he is the god of Tsisnadzi'ni Mountain and can kill game
    by willing it.
  language: English
  quote_policy: summarized
