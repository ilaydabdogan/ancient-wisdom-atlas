  quote: ''
  summary: The passage presents Matthews’s discussion of Navajo poetry and music,
    contrasting an earlier report that denied Navajo religion and traditions with
    Matthews’s claim that Navajo ceremonial life includes complex rites, extensive
    mythic traditions, many gods and heroes, and a large body of inherited songs.
    It describes songs for travel, farming, building, hunting, war, gambling, life-cycle
    occasions, and sacred rites, emphasizing exact ritual performance and the serious
    consequences of errors in sacred songs.
