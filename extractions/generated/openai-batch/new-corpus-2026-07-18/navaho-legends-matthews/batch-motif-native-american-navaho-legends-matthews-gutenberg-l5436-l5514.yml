canonical_text:
  quote: ''
  summary: Estsánatlehi negotiates with Tsóhanoai, agrees to go west only after he
    promises a floating house, planted gems, and animals. She travels west with divine
    escort tribes and multiplying herds; some animals leave eastward. She settles
    in a floating house beyond the western water, where the Sun visits at the end
    of his daily journey and sends lightning serpents on stormy days. A song describes
    the Sun God and Moon God approaching earth’s end and hearths. Nayénezgani and
    To`badzistsíni dwell at the San Juan river confluence, where warriors pray for
    success in war.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After four days, Estsánatlehi went to the top of Tsolíhi and sat on a rock.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsóhanoai came to her, sought to embrace her, and asked her to come west and
    make a home for him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tsóhanoai cited his gift of weapons to her boys and Nayénezgani’s promise
    as reasons; Estsánatlehi rejected these claims and repulsed him four times.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: On his fifth plea, Estsánatlehi said she would go west if he provided a house
    floating on water, planted gems around it, and animals to accompany her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tsóhanoai promised her requests and made elk, buffalo, deer, long-tail deer,
    mountain sheep, jack-rabbits, and prairie-dogs to go with her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Hadáhonestiddine` and Hadáhonigedine`, described as two tribes of divine
    people, went with Estsánatlehi and helped drive the animals.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the westward travel, the party crossed named mountains and valleys,
    trampled passes, halted for ceremonies, held a foot-race, and the animals became
    more numerous.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Buffaloes, elks, and some antelope, deer, and other animals left the herd
    at different points and went east.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Estsánatlehi arrived at the great water and dwelt in her floating house beyond
    the shore; the Sun visits her when his sky journey is done, while on dark stormy
    days he stays east and sends lightning serpents.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The song names the Sun God and the Moon God approaching earth’s end and the
    hearths of Estsánatlehi and Yolkaí Estsán while walking the beautiful trail in
    old age.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: After Estsánatlehi’s departure, Nayénezgani and To`badzistsíni went to To`ye'tli,
    where two rivers join in the San Juan valley, and Navahoes still go there to pray
    only for success in war.
  category: sequence
  evidence_refs:
  - ev:6
