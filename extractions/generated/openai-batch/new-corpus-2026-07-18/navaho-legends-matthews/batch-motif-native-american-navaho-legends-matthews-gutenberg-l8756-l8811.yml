canonical_text:
  quote: ''
  summary: The passage gives notes on Tsúskai/Chusca Peak as a prominent Navajo-named
    hill and landmark; describes Navajo ceremonial bathing with yucca suds, rinsing,
    and corn-meal drying; describes sacred pollen obtained chiefly from corn, carried
    in buckskin bags with stones or fetishes, used with prayer, applied to tongue
    and head, and ritually augmented through contact with living animals or ceremonial
    paintings; and introduces further observances about kethawns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tsúskai, also given as Tsó-is-kai, is identified as a prominent conical hill
    in northwestern New Mexico, rising 8,800 feet above sea level and about twenty-six
    miles north of Defiance Station.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hill rises abruptly above the neighboring ridge, is visible at a great
    distance from the south, and forms a prominent landmark.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Navajo limit the name Tsúskai to the knoll, while Mexicans and Americans
    apply related forms of the name to the larger mountain mass.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bath is described as an important part of Navajo rites and is often mentioned
    in the tales.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bath usually consists of suds made in a water-tight wicker basket by soaking
    yucca root in water.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: After application of the suds, the subject is commonly rinsed with plain water
    and dried by rubbing on corn meal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the cited myth of The Mountain Chant, a bath is described as part of a
