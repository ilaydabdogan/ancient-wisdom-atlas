    religious reasons.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Pollen for sacred uses is obtained from various plants, with Indian corn described
    as the chief source.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Pollen is carried in small buckskin bags that usually also contain sacred
    stones or small animal fetishes.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The administration or sacrifice of pollen is described as part of all witnessed
    rites and almost always follows or accompanies prayer.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A common use of pollen is to take a small pinch and apply portions to the
    tongue and to the crown of the head.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: For some purposes, a shaman immerses a live bird, insect, or other animal
    in a large bag of pollen and then allows the animal to escape.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that immersion and release of a living animal is supposed
