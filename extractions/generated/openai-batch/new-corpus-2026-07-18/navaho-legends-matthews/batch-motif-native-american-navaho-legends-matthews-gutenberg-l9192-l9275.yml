literal_observations:
- id: obs:1
  text: A small lake in the San Juan Mountains is said to be the place through which
    the people came from the fourth world to this world, and its names are translated
    as Place of Emergence or Land Where They Came Up.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described lake is surrounded by cliffs, has a small island near its center
    with something rising from it like the top of a ladder, and has four mountain
    peaks beyond the cliffs in the east, south, west, and north.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Navajos fear to visit the lake shore and instead view its
    waters from surrounding mountains; the exact lake identification is unknown, with
    Trout Lake, Island Lake, and Silver Lake discussed as possibilities.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: In one version Gánaskidi strikes cliffs with a wand and breaks them open;
    in another, He of the darkness of the east cuts the cliffs with a horn-shaped
    knife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: They pray to the four Winds, described in one version as black Wind of the
    east, blue Wind of the south, yellow Wind of the west, and white Wind of the north;
    a wind-song is also mentioned.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Kisáni set up a stone wall, while the others, representing the Navahoes,
    set up a brushwood shelter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tsi-di'l is described as a Navajo women's game using three sticks thrown onto
    a flat stone, a blanket overhead, small stones set in a square as counters, and
    movable sticks; other games are named.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Coyote and Hastsézini are named as partners in the theft of the young of Tiéholtsodi;
    when Coyote sees the water rising, he signals toward it, and First Man becomes
    suspicious and searches.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: In one restoration variant, a huge haliotis shell is filled with shells, precious
    stones, and pollen from the young; the offering is placed on Tiéholtsodi's horns,
    after which he disappears under the earth and the waters go down.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The pollen taken from Tiéholtsodi's young is described as made more holy by
    contact with their bodies and is distributed among the people, bringing rain,
    game, and good fortune.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: In another restoration variant, the young are thrown down to their father
    with shell ornaments as a sea-treasure sacrifice, and the waters rush down through
    a hole and away from the lower worlds.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Some variants name the dead hermaphrodite as Natliyilhátse and say she is
    now chief of devils in the lower world; another version says the first to die
    was the wife of a great chief.
  category: sequence
  evidence_refs:
  - ev:9
