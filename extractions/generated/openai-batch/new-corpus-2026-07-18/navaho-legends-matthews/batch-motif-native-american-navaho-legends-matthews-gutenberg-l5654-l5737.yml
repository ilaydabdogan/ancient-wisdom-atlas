canonical_text:
  quote: ''
  summary: A resident group sees a recurring distant night fire, uses a forked stick
    to locate it, and after Wind's whispered guidance finds another human camp beyond
    a mountain ridge. The newly found Tse`tláni are welcomed and named as ancestors
    of a Navaho gens. Hastséyalti privately visits Yolkaí Estsán, who then disappears
    after telling a favorite little girl she has been summoned by the gods of Tse`gíhi
    and will continue watching over the people. In a dream she tells the girl she
    is going to Depe'ntsa and will be in the she-rain. The people later move in search
    of food and plant prolific corn from ears previously given by Hastséyalti.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After thirteen years at Tse`lakaíia without signs of other people, the group
    saw a distant gleam of fire at night and failed to find it during repeated searches.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people used a forked stick and repeated body positions to align their
    sight toward the night gleam.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The guided sight pointed to a small wooded hollow on a distant mountain, but
    an exploration found no fire, ashes, human tracks, or water there.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Wind whispered that the light shone through a crack in the mountain at night
    and instructed the men to cross the ridge to find the fire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: After crossing the ridge, the men found footprints of men and children and
    then reached a camp where both parties greeted one another joyfully.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: The strangers said they had last stayed at To`i'ndotsos, where they lived
    on ducks and snakes, and that they were now living on ground-rats, prairie-dogs,
    and wild seeds.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: 'The new party consisted of twelve persons: five men, three women, one grown
    girl, one grown boy, and two small children.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Tse`dzinki'ni took the strangers home, Yolkaí Estsán welcomed them as
    children, and the strangers were named Tse`tláni or Tse`tlánidine` from the place
    where they had camped.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: Hastséyalti twice came to the lodge of the White Shell Woman and spoke with
    her privately; after each visit she did not tell the others what he said.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Yolkaí Estsán told her favorite little girl that she was going to leave because
    the gods of Tse`gíhi had sent for her, but that she would not forget the people
    and would remain near to watch over them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: After speaking to the little girl, Yolkaí Estsán disappeared from the girl's
    sight, and the people could not find her when they searched.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: On the fourth night after Yolkaí Estsán's departure, the little girl dreamed
    that Yolkaí Estsán said she was going to Depe'ntsa to dwell and would ever be
    in the she-rain.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: After Yolkaí Estsán's departure, the people moved to To`dokónzi and then to
    Tsa`olgáhasze, where they planted corn from two ears that Hastséyalti had previously
    given them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: 'The corn was described as prolific: several stalks sprouted from each grain,
    and one ground grain produced meal lasting many days.'
  category: attribute
  evidence_refs:
  - ev:5
