canonical_text:
  quote: ''
  summary: 'The passage recounts stages in the immigrants'' migration: division at
    Yótso, messengers pursuing fugitive bands and finding the Navahoes, later halts
    at a lone tree and at Deer Spring that become named gentes, recognition of relationship
    between Thá`paha and Hasli''zni, and the release of the last pet bear in the Chusca
    Mountains.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The wanderers traveled from Agála to Tse`hotsóbiazi and then to Yótso, camping
    often and sometimes staying to hunt in late autumn.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Yótso they saw old moccasin tracks and considered that these might be footprints
    of the people they sought.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The immigrants divided into two parties at Yótso: one remained there, while
    another group containing parts of several gentes continued the journey.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: People at Yótso sent two messengers and later two more to persuade the seceders
    to return, but the seceders were not overtaken.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: The fugitive group divided into two bands; one is said to be ancestral to
    the Jicarilla Apaches, and the other is said to have become part of the Diné`
    Nahotlóni.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: The first two messengers eventually turned toward the San Juan River and found
    the long-sought Navahoes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In spring, some To`ditsíni stopped at a place with a great lone tree, citing
    children's swollen knees and blistered feet; they became the Tsinsakádni, People
    of the Lone Tree.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Tsinsakádni are described as closely related to the To`ditsíni and unable
    to marry with them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: At Deer Spring, more To`ditsíni halted because their children were lame from
    walking; they formed the Pinbitó`dine`, People of Deer Spring.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A pet deer was urged to leave at Deer Spring but stayed with the people who
    remained there; its final fate is not known.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The main body reached Hyíetyin, where Thá`paha had farms and Big Knee was
    still alive but very old and feeble.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Thá`paha and Hasli'zni traced a relationship through similar names, headdresses,
    and accoutrements; the Hasli'zni stopped with Thá`paha and became friends with
    them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The immigrants released their last pet, a bear, in Tsúskai, saying they were
    safe among friends and no longer needed his services; bears have been numerous
    there ever since.
  category: action
  evidence_refs:
  - ev:6
