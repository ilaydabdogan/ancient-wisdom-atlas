canonical_text:
  quote: ''
  summary: The two brothers reach the sky-hole, identify their homeland below with
    Ni'ltsi's prompting, and are sent down by Tsóhanoai on lightning to Tsótsil. They
    meet four holy people in a cave who describe Yéitso. At Tó`sato they test a lightning
    arrow, then confront Yéitso as he appears, drinks from the lake, taunts them,
    and attacks with lightning. Warned by Ni'ltsi, the brothers use a rainbow to evade
    his bolts. Lightning from the sky strikes Yéitso, and the elder brother brings
    him down with four chain-lightning arrows.
  language: English
  quote_policy: summarized
