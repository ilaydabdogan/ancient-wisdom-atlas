canonical_text:
  quote: ''
  summary: 'The passage lists several origins and affiliations of Navaho gentes: migrant
    Apache, Zuñi, and western painted-face groups; captives and refugees from pueblo
    attacks; seven visitors who stayed permanently; people created by Estsánatlehi
    from skin under her right arm and given a white-shell wand; and a man and woman
    who emerged from Big Water and became ancestors of a gens.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Apache party lived among the To`dokózi, later lived with the Thá`paha,
    became closely related to them, and remained affiliated with Thá`paha while being
    called To`dokózi.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zuñi groups joined the Navahoes; one was admitted into Thá`paha, and another
    became the separate gens Nanaste'zin after leaving Zuñi villages because of food
    scarcity.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A western group with painted faces, identified in the passage as likely related
    to the Mohaves, became the Dildzéhi gens among the Navahoes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Navaho war party attacked Saíbehogan, captured two girls as slaves, and
    their descendants became the Ásihi, or Salt, gens.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Jemez girl captured on a raid and sold to a member of the Tse`dzinki'ni
    became the progenitor of the Maideski'zni gens.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the attack on Saíbehogan, famine led some people there to abandon their
    homes, seek the Thá`paha, and join that gens.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Seven people from Tse`yanató`ni came for a short visit, repeatedly delayed
    departure, stayed permanently, and formed an extinct gens of the same name.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Estsánatlehi created a people from the skin under her right arm and gave them
    a wand of white shell; after joining the Navahoes they were called Kinaá`ni.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: At Tó`tso, or Big Water, a man and a woman came up out of the water, joined
    the Bitá`ni, and became ancestors of the Tó`tsoni gens.
  category: sequence
  evidence_refs:
  - ev:9
