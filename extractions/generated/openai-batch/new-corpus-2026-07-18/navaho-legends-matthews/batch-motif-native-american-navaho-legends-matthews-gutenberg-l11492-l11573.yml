canonical_text:
  quote: ''
  summary: John Comfort Fillmore introduces and analyzes twenty-eight Navajo songs
    transcribed from phonographic records made by Washington Matthews. He emphasizes
    their scientific value for studying folk-song form, describing their rhythm, harmonic
    melodic relations, and especially their variable metrical groupings. He compares
    these metrical features with those of other Indigenous North American song traditions
    and notes the absence of recorded drum accompaniment in the collection.
