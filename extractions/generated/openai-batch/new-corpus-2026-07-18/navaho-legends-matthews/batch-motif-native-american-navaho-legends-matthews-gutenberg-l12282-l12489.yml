canonical_text:
  quote: ''
  summary: The passage contains Navajo song texts with interlinear English translations
    and explanatory notes. It includes stanzas about holy figures arriving or coming
    with knives from houses or chambers of knives, an explanation that Nayénezgani
    and his mother exchange divine compliments and that Sun-given treasures or weapons
    belong to her, a Song of the Sun naming several figures who come with ritual implements,
    another Song of the Sun in which the Sun God and Moon God approach together with
    images of the earth-border, houses toward the hearth, old age, and a beautiful
    trail, and opening lines of log songs in which a beautiful tree is felled, prepared,
    and carried.
