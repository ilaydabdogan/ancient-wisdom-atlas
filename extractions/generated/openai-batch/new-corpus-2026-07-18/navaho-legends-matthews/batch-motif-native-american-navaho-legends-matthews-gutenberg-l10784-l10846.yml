canonical_text:
  quote: ''
  summary: Scholarly notes enumerate eighteen sacred articles associated with Navajo
    rites, comment on turkey knowledge and food practice, describe rainbow iconography
    in dry-paintings, note a recurring magic cup, and detail the identity, implements,
    ritual actions, offerings, mask-removal, and variant accounts of Hastséoltoi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage enumerates eighteen sacred articles, including shells, turquoise,
    pászini, red stone, several bird feathers, turkey beard, cotton string, i`yidezná,
    jeweled baskets, rock crystal basket, and sacred buckskin.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sacred articles are said to be required by gods in the myths of klédzi
    hatál and atsósidze hatál; all are said to be used in the rites except the five
    baskets, which are described as legendary and replaced by ordinary sacred baskets.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that domestic or pet turkeys were known in the region,
    that Navajos say they formerly kept pet turkeys, and that a conservative Navajo
    will not eat turkey flesh although he may sell a wild turkey to a white man.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Navajo dry-paintings, the rainbow is usually depicted with a head at one
    end and legs and feet at the other; a square mask on the head marks it as a goddess,
    and the passage says it is apotheosized.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: One Mountain Chant dry-painting depicts the rainbow without limbs or head,
    ending with eagle-plumes at one end and magpie-plumes at the other, with bluebird
    and red-shafted woodpecker plumes near the middle.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A magic cup is said to figure in many other Navajo myths.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Has-tsé-ol-to-i means the Shooting Hastsé or Shooting Deity; the personator
    wears a female mask, and the author says this suggests a goddess or divinity of
    the chase.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Hastséoltoi personator is a man who carries a puma-skin quiver, a bow,
    and two headless reed arrows feathered with red-tailed buzzard feathers and tipped
    with moistened white earth and pollen.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: In a night chant rite of succor, the Hastséoltoi personator follows the personators
    of the War Gods and waves arrows at the patient in the east, south, west, and
    north while the patient stands on a buffalo robe before the medicine-lodge.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the arrow-waving, all enter the lodge; the patient prays and presents
    a cigarette to the personator after praying and sacrificing to the War Gods.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The three masqueraders go west of the lodge to deposit sacrifices; Hastséoltoi's
    sacrifice is placed under a weed if possible, after which the masqueraders remove
    masks, put on ordinary blankets, hide the masks, and return as ordinary Indians.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: 'The passage reports variant statements: some say there is one Hastséoltoi
    and that she is the wife of Nayénezgani; others say there is one wherever the
    yéi have homes.'
  category: speech
  evidence_refs:
  - ev:8
