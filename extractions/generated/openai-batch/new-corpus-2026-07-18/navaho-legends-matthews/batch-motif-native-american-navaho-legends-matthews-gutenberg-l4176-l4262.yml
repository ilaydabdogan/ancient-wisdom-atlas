canonical_text:
  quote: ''
  summary: Two women give birth with the aid of Hastséyalti and Tó`nenili. The children
    are placed in supernatural baby-baskets and rapidly grow. The two boys race the
    gods, first losing and then, after advice from Wind and practice, winning. They
    ask the women about their fathers and receive evasive answers. Given toy bows
    and arrows and warned not to wander, they travel east, south, and west, encountering
    Coyote, Raven, and Buzzard, each identified as a spy for dangerous beings.
  language: English
  quote_policy: summarized
