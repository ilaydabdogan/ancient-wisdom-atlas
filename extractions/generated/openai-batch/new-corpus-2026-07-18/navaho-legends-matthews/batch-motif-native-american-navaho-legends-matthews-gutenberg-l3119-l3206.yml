canonical_text:
  quote: ''
  summary: Hastséyalti appears to a childless couple, explains that Nohoílpi has refused
    the Sun the great shells won from Ki'ndotliz, and summons the young man to a divine
    mountain ceremony. At the ceremony, gods and discontented animals plot against
    Nohoílpi, ritually prepare Hastséhogan's son to match him at gambling, send Darkness
    and Wind to search Nohoílpi's sleeping mind, and assign Bat, Great Snake, Gopher,
    and a little bird to manipulate specific games. The pets request a gale from Wind,
    and Nohoílpi's two sign-bearing wives are introduced.
  language: English
  quote_policy: summarized
