canonical_text:
  quote: ''
  summary: A Navajo song or prayer invokes high-flying winged addressee(s) associated
    with mist, rain, lightning, rainbow, clouds, and darkness to come. The speaker
    states that sacrifice and smoke have been prepared, asks for restoration of feet,
    legs, body, mind, voice, senses, and movement, and asks that a spell be removed.
    The passage then expresses recovery in beauty, desires clouds, showers, plants,
    pollen, dew, corn, goods, and jewels, and closes with blessings around the addressee,
    social regard, and a pollen trail for getting home.
  language: Navajo with English interlinear translation
  quote_policy: summarized
