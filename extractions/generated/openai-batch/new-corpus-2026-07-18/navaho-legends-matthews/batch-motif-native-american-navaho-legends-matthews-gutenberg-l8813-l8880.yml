canonical_text:
  quote: ''
  summary: A technical note describes the manufacture, orientation, ranking, preparation,
    measurement, and placement of reed cigarettes or kethawns used as sacrifices.
    It also notes associated feathers, pollen, corn-husks, cardinal-direction arrangements,
    dedication to ranked gods, and examples from ceremonial figures including talking
    kethawns and Night Chant kethawns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Reed pieces for cigarettes are cut in order from the root or butt end toward
    the point or tip, and are notched so that their end relations are not forgotten.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During preparation, the butt end is kept nearer the operator and the tip end
    farther away; because the cigarette-maker sits in the west facing east, the cigarettes
    lie east-west with tips to the east.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Multiple cigarettes for one sacrifice are marked with increasing notches near
    the butt, and the piece nearest the butt is treated as senior and handled first.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The same order of precedence is followed when cigarettes are painted, fitted
    with feathers, filled with tobacco, sealed with pollen, symbolically lighted with
    rock crystal, placed in the patient's hands, applied to the patient, and finally
    sacrificed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sacrifices in a straight row are ordered from north to south; sacrifices in
    a circle are ordered from east around by south, west, and north back to east.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When gods have an order of precedence, the senior sacrifice is dedicated to
    the higher god and the junior sacrifice to the lower god.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Other sacrificial articles are placed in corn-husks with tips to the east;
    cigarettes and sacred feathers in the bundle also have their tips to the east.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Dry and moist pollen are applied to the cigarette from butt to tip.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Only the hollow internode of the reed is used; the solid node is discarded
    and split so that gods do not mistake it for a true cigarette.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Manufacturing debris is deposited north of the medicine-lodge, commercial
    tobacco is prohibited, and a feather plug is inserted from tip to butt to hold
    tobacco in place.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Kethawns have established sizes measured by finger-joints, spans, hand-widths,
    or widths of joined fingertips.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that this sacrificial system is common among Pueblo tribes
    of the Southwest and that traces have been found elsewhere.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Illustrated kethawns include a talking kethawn with a black male stick and
    blue female stick, Night Chant kethawns made by the dozen, and a set of fifty-two
    Night Chant kethawns with four central cigarettes on meal and forty-eight surrounding
    wooden sticks arranged by direction and wood species.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
