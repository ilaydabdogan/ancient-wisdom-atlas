canonical_text:
  quote: ''
  summary: 'Two boys traveling from Spider Woman''s house toward the house of their
    father encounter successive lethal obstacles: crushing rocks, sharp reeds, cane
    cactuses, rising sands, and paired sentinels at the Sun''s house. They use deception,
    self-identification as children of the Sun, and sacred words taught by Spider
    Woman to pass safely. At the turquoise house of the Sun God, residents wrap them
    in sky coverings and place them on a shelf. Tsóhanoai, bearer of the sun, returns,
    hangs up the sun, and angrily asks about the two strangers; the woman in the house
    questions whose sons they are.'
  language: English
  quote_policy: summarized
