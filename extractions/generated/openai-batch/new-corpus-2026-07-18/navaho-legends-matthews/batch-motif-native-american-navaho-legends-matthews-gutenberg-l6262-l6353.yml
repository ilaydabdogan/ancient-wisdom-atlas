canonical_text:
  quote: ''
  summary: A migrating party travels east from Coyote Spring with the Coyote People.
    During repeated waterless halts, different sacred or magic wands bring water from
    the ground, and several gentes receive names from comments or actions associated
    with the water. The travellers later pass named springs, mountains, and hunting
    places; animals in the party are judged useful or burdensome, the big snake and
    porcupine are released into particular landscapes, and Agála receives its name
    from a pile of deer hair blown up by the wind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The travellers tarry four days at Coyote Spring, persuade the Coyote People
    to join their eastern journey, and leave on the fifth morning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a waterless halt, a white shell wand is used like an earlier turquoise
    wand, water springs up, a woman calls it muddy, and the Hasli'zni or Mud People
    are named from that remark.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At another dry halt, the haliotis wand makes water spring up; a Coyote woman
    drinks first, calls it alkaline water, and she and her children receive the name
    To`dokónzi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the present To`dokónzi gens descends from the woman
    and children named at the alkaline water and that its members may not marry with
    the related Maitó`dine`.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At a later dry halt, the black stone wand produces a clear stream; a boy and
    girl of the wand-bearing gens do not drink, the girl stands with her arms folded
    under her dress, and Bitá`ni is given as a name connected with that posture.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The red stone wand also brings water from the ground, all drink, but no unnamed
    gens member says anything and no name is given.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The travellers later camp by Halkaíto`, travel twenty-five days to a river
    near San Francisco Mountain, hunt there, and Bainili'ni kills a large deer that
    is divided so everyone may taste it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Near San Francisco Mountain the travellers stop by an unnamed spring and build
    a stone wall around their camp.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The puma kills a deer, the bear sometimes kills rabbits, the snake and porcupine
    are described as useless burdens, and the deer runs among the crowd without doing
    good or harm.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Tsé`zintsidilya the travellers hold a council about the big snake and release
    him among the rocks; the passage says his descendants are numerous there.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Natsisaán, Navaho Mountain, the travellers release the porcupine, and the
    passage explains the many porcupines there by this act.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At Agála, hunters wearing deer masks as decoys kill many deer, dress many
    skins, and the wind blows hair from the skins into a great pile, prompting the
    place-name Agála.
  category: action
  evidence_refs:
  - ev:8
