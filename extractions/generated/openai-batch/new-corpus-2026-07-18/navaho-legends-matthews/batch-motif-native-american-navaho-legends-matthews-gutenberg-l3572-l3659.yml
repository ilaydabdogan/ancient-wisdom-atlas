canonical_text:
  quote: ''
  summary: Coyote tricks the giant Yélapahi inside a dark sweat-house by pretending
    to cut and heal his own thigh. Yélapahi imitates the act, cannot heal himself,
    and is killed by Coyote’s arrows. Coyote scalps him, takes his weapons, and presents
    them to a maiden as proof of victory. The maiden says that a suitor must be killed
    four times and return to life four times. She kills, scatters, and finally grinds
    Coyote’s body, but repeatedly misses the point of his nose and the tip of his
    tail; he returns each time. After the fourth return she consents to marry him,
    then hides him when her brothers approach.
  language: English
  quote_policy: summarized
