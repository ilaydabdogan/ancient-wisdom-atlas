  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The maiden next pounds Coyote to pieces and scatters the pieces; Coyote returns
    and says he has won two games.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The maiden then pounds Coyote into a shapeless mass, beats it further on a
