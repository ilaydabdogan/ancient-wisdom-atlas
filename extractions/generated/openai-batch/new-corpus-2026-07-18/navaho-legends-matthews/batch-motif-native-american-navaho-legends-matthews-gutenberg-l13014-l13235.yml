canonical_text:
  quote: ''
  summary: A prayer addresses a male divinity dwelling at Tse`gíhi in houses made
    of dawn, twilight, cloud, rain, mist, pollen, and grasshoppers. The speaker summons
    the divinity to come with dark cloud garments, thunder, rain, mist, lightning,
    rainbow, and wings; states that sacrifice and smoke have been prepared; asks for
    bodily and mental restoration and removal of a spell; requests weather, vegetation,
    corn, goods, and jewels; asks that people return home on a pollen trail; and closes
    with a beauty-walking formula.
  language: English
  quote_policy: summarized
