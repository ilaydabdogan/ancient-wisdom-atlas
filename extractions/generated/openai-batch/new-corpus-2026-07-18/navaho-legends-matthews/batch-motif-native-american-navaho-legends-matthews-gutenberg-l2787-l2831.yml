canonical_text:
  quote: ''
  summary: As waters rise, a reed grows upward with people inside it. Black Body steadies
    the reed with dark clouds and fastens it to the sky with a plume. Great Hawk scratches
    at the sky but does not break through. Locust reaches the upper world, meets colored
    Grebes from the four directions, survives their arrow-through-heart challenge,
    and secures passage. Badger enlarges the hole, and First Man and First Woman lead
    the people into the fifth world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The waters rose quickly while the reed grew faster and carried people upward
    inside it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people inside the reed feared that it might break and fall into the water.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Black Body blew through a hole in the top of the reed and formed a heavy dark
    cloud that steadied the reed; he repeated this action when the reed swayed again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the reed neared the sky, Black Body placed a plume from his head-band
    through the top of the cane against the sky, and the passage explains this as
    the reason reeds have plumes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Great Hawk flew upward and scratched at the sky until he could see light,
    but he did not get through it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Locust reached the upper world and emerged on a little island in the center
    of a lake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Black and yellow Grebes approached from east and west, claimed portions of
    the world, and challenged Locust to imitate them or die.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Grebes passed arrows made of black wind through their hearts; Locust imitated
    the act, after which the Grebes departed.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: Blue and shining Grebes approached from south and north, gave the same challenge,
    and departed after Locust passed the arrow through his heart.
  category: sequence
  evidence_refs:
  - ev:4
