canonical_text:
  quote: ''
  summary: The passage describes Navaho ceremonial dry-paintings, healing actions
    performed over and through the images, their obliteration after use, claims about
    their transmission, restrictions on viewing them, masked representation of gods
    and mythic persons, and the limited role of dance in certain nine-day rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a sacred picture is finished, ceremonies are performed over it, including
    placing pollen or corn-meal on parts of the figures, scattering these substances,
    and applying water or medicinal infusions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The patient is brought in and seated on the picture.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The shaman or an assistant moistens the patient’s palms, takes colored dust
    from parts of the divine figures, and applies it to corresponding parts of the
    patient’s body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Medicine is usually administered in four draughts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other ill persons in the lodge take dust from the picture and apply it to
    analogous parts of their own bodies, such as head dust for headache and foot dust
    for sore feet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After use, the picture is marred, then totally obliterated; the sand is removed
    and thrown away, and the lodge floor is swept.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that an uninitiated person entering afterward has no evidence
    of what took place.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage identifies dry-painting images as representations of gods or yéi
    and refers to a complete painting from the night chant.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Medicine-men say the pictures were transmitted unchanged from teacher to pupil
    since their revelation to prophets of the rites; the author questions strict unchangeability.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says many great ceremonies may be performed only in the coldest
    months, when snakes are dormant.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: No permanent copies of the pictures were preserved until the author made copies;
    the pictures were carried in memory, and no final tribal authority settled correctness.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Shamans brought young assistants to view the author’s copies and lecture on
    important points before ceremonies.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The author’s water-color copies were kept hidden at the forbidden season and
    were not shown to uninitiated tribal members.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: In rites, men appear representing gods or other mythic characters, sometimes
    by paint and equipment and sometimes also by masks.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The akáninili, or messenger of the mountain chant, is dressed to represent
    the prophet Dsi'lyi Neyáni as he appeared after transformation by the Butterfly
    Goddess.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: In the night chant there are twenty-one sacred buckskin masks for representatives
    of the gods and a yucca-leaf mask trimmed with spruce twigs for the patient.
  category: object
  evidence_refs:
  - ev:11
- id: obs:17
  text: Buckskin masks are kept by the shaman, carried to the rite location, freshly
    painted, and fitted with collars and plumes just before use.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:18
  text: 'The passage distinguishes male and female masks: female masks cover only
    the face and leave hair free, while male masks cover the entire head and conceal
    the hair.'
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:19
  text: When dressed in divine costume, a man does not speak, but makes motions and
    utters a special cry associated with the god represented.
  category: action
  evidence_refs:
  - ev:14
- id: obs:20
  text: The costumed representative may perform acts on the patient with a special
    weapon or talisman.
  category: action
  evidence_refs:
  - ev:14
- id: obs:21
  text: The passage reports that the masquerader is considered, for the time being,
    no longer a Navaho but a god, and prayers to him are prayers to a god.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:22
  text: When the masquerader enters and sits before the sick man, the sick man hands
    him a sacrifice and prays to him, despite knowing the disguised person may be
    a relative.
  category: action
  evidence_refs:
  - ev:16
- id: obs:23
  text: The passage says dancing is a minor element in Navaho ceremonies and may occur
    only on the last night of the mountain chant or night chant ceremonies.
  category: attribute
  evidence_refs:
  - ev:17
