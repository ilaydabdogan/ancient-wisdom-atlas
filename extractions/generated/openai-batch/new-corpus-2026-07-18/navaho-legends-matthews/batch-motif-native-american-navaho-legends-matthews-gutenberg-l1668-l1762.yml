  claim: The healing actions have the same broad ritual function as a sacred-exchange
    pattern, because sacred material from divine images is transferred to the patient
    and medicine is administered in a controlled ceremonial sequence.
  claim_level: same_function
  target: sacred_exchange motif family
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not explicitly state a reciprocal bargain in the dust-transfer
    sequence; the comparison is functional and limited to ritual mediation of healing.
- id: claim:2
  claim: The secrecy, teacher-to-pupil transmission, and exclusion of uninitiated
    viewers support a cautious functional comparison to initiation or restricted-wisdom
    patterns.
