candidate_motifs:
- id: motif:1
  label: Healing through contact with a sacred image
  taxonomy_refs:
  - sacred_exchange
  basis: The patient is placed on the sacred picture, and dust from divine figures
    is transferred to corresponding parts of the body; other ill persons repeat analogous
    applications for their ailments.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage describes ritual healing actions but does not explicitly frame
    them as an exchange except in the later sacrifice scene.
- id: motif:2
  label: Ephemeral sacred image ritually destroyed after use
  taxonomy_refs: []
  basis: The dry-painting is used in ceremony, becomes marred, is totally obliterated,
    and its sand is removed and thrown away, leaving no evidence for the uninitiated.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No broader taxonomy reference is assigned because the available taxonomy
    does not include a specific ephemeral-image motif.
- id: motif:3
  label: Restricted ritual knowledge transmitted from teacher to pupil
  taxonomy_refs:
  - initiation
  - wisdom
  basis: The passage reports teacher-to-pupil transmission of revealed pictures, instruction
    of young assistants, hiding of copies at forbidden times, and exclusion of the
    uninitiated.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: medium
  cautions: The text does not describe a formal initiation ordeal; the taxonomy references
    are functional rather than exact.
- id: motif:4
  label: Masked human as temporary deity
  taxonomy_refs: []
  basis: Men represent gods or mythic characters with costume and masks; once dressed,
    a man is said to be temporarily no longer Navaho but a god, receiving prayer and
    sacrifice.
  evidence_refs:
  - ev:10
  - ev:14
  - ev:15
  - ev:16
  confidence: high
  cautions: The passage frames the change as ritual representation and temporary sacred
    status, not as a literal narrative metamorphosis.
- id: motif:5
  label: Divine or mythic transformation represented in costume
  taxonomy_refs:
  - shapeshifter
  basis: The akáninili is dressed to represent Dsi'lyi Neyáni as he appeared after
    the Butterfly Goddess transformed him.
  evidence_refs:
