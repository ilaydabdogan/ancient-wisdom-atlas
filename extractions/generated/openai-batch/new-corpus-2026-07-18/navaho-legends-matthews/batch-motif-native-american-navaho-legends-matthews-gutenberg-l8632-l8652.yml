  quote: ''
  summary: The pueblo people hear a strange song and see the dancing Navaho rise from
    the ground toward the sky while carrying the great shell of Kintyél and wealth
    in shell-beads and turquoise. They plead with him to return, then try to obtain
    ropes and arrows, but he is lifted by the gods with white lightning from a dark
    cloud and disappears into the black cloud, never again seen on earth.
