canonical_text:
  quote: ''
  summary: A transformed Navaho returns unrecognized to Kintyél, where the pueblo
    people are afflicted by a disease connected with eaglet feathers. He proposes
    that his brother, a shaman, can cure them, but requires a particular ritual dancer
    costume of beads, turquoise, and enormous shell basins. Guided by Wind, he rejects
    smaller shells until the great shells of Kintyél and Ki'ndotliz are brought. Messengers
    invite Navaho participants; one brings Gánaskidi and his children, while another
    returns after exchanging bows and quivers with a messenger from Tsótsil. On the
    final evening, a branch enclosure is built, fires are lit, the dancer is dressed
    in shells, the Navaho dances, and his brother sings a corn song.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Navaho visits the pueblo of Kintyél and is not recognized by its people
    because he now appears well fed, finely dressed, and beautiful after Eagles molded
    his face and form.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many people in the pueblo are sore and lame from a new disease said to have
    been caught from eaglet feathers when they attacked the nest.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Navaho tells the pueblo people that he has a brother who is a potent shaman
    and knows a rite that can cure the disease.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The pueblo people decide to employ the Navaho's brother to perform the ceremony
    over the sufferers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Navaho says he must be one of the atsá`lei, or first dancers, and must
    be dressed with shell and turquoise beads, large shell basins, and long turquoise
    ear ornaments.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Wind tells the Navaho which shell basins are the greatest and how large they
    are.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: People gather from pueblos in Chaco Canyon and along the San Juan, and they
    collect shells and beads from various pueblos for the dancer's costume.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Navaho measures offered shell basins by clasping them in his arms and
    rejects them until the great shells of Kintyél and Ki'ndotliz are brought.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Messengers are sent to nearby Navaho camps to invite people to the last-night
    exhibition and to take part with dances or dramas.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: One messenger goes to Chelly Canyon and gets Gánaskidi, his son, and his daughter
    to come perform a dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Another messenger meets a messenger from Tsótsil; the two exchange bows and
    quivers as a sign of their meeting, and the messenger from Kintyél returns without
