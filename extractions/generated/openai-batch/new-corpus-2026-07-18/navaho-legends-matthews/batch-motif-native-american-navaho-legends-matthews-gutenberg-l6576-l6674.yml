canonical_text:
  quote: ''
  summary: Nati'nesthani, a gambler living near Dsilnáotil, loses nearly all family
    goods except a white bead necklace. His brother places the necklace with the grandmother
    and threatens to kill him if he gambles it away. Nati'nesthani repeatedly hunts
    in the four directions while considering leaving, but returns to his niece with
    food. Poor and rejected by family, he devises and begins making a hollow cottonwood
    log vessel at the San Juan River, using fire and mud, over four days.
  language: English
  quote_policy: summarized
