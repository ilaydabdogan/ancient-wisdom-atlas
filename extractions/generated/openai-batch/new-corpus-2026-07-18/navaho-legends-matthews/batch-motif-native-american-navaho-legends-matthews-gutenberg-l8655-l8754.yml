  text: The Carrizo Mountains are described as an isolated mountain mass in northeastern
    Arizona, called Dsilnáodsil, meaning mountain surrounded by mountains.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The San Juan River has Navaho names translated as Water of Old Age or Old
    Age River and Male Water; the latter is explained by contrast with the placid
    Rio Grande, called Female Water.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tu-in-tsá is explained as deriving from words for water and abundance, and
    the mountains so named are described as timbered and containing small lakes and
    ponds.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: One sacred basket is made of aromatic sumac, decorated with a red band with
    black zigzag edges, and includes an uncolored radial line used for orientation.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The basket must observe ceremonial rules for butt and tip ends of twigs, and
