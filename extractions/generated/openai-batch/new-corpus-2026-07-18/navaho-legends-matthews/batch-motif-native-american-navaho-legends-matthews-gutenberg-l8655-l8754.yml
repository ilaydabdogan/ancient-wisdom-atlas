literal_observations:
- id: obs:1
  text: The passage says the origin of the name Navajo is unknown, that Spaniards
    gave the name, and that the Navahoes call themselves Diné or Diné`, meaning men
    or people.
  category: speech
  evidence_refs:
  - ev:1
