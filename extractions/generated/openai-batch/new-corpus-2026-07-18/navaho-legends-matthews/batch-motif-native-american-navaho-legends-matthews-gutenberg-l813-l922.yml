canonical_text:
  quote: ''
  summary: The passage describes Navajo sacred songs as containing archaic words,
    meaningless vocables, characteristic preludes and refrains, and a fixed ceremonial
    order. It discusses oral transmission by shamans, the general absence of women
    singers with one noted exception, and examples of figurative language in songs,
    including Estsánatlehi’s symbolic ascent, a dove gambling song, and an antithetical
    mountain chant contrasting voices above and below.
  language: English
  quote_policy: summarized
