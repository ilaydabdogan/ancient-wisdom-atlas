canonical_text:
  quote: ''
  summary: 'Notes describe ritual and variant details related to the War Gods narrative:
    life-feathers from live eagles; pollen as a peace emblem; Spider Woman''s strengthening
    of the brothers with obsidian and turquoise; the brothers'' journey to the house
    of the Sun through encounters with a water monster, Old Age People, Daylight,
    Darkness, water, sentinels, and the daughter of the Sun; their search for their
    father; and their receipt of knife armor, lightning, sunbeam, rainbow, stone-knife,
    and thunderbolt weapons.'
  language: English
  quote_policy: summarized
