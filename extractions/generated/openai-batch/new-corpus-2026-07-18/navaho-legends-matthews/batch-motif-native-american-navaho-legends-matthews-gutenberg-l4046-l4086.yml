canonical_text:
  quote: ''
  summary: After a slain dangerous woman is prevented from reviving, the young hero
    transforms parts of her body into a bear and edible pine nuts, directs the bear
    to behave peaceably, and later has his dead brothers restored by holy helpers.
    The holy helpers name the hero Léyaneyani, Reared Under the Ground, and assign
    him a dwelling place.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ni'ltsi, the Wind, tells the young man that two streams of blood are approaching
    one another and that the woman will revive if they meet; the young man draws a
    mark with a stone knife, and the blood coagulates and stops flowing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man says Tsiké Sas Nátlehi will live again, but in other forms that
    may serve her kind rather than as a harmful being.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man cuts off the head, throws it at the foot of a piñon-tree, and
    it changes into a bear that begins to walk away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bear looks back and asks what to do if attacked; the young man permits
    self-defense, forbids starting quarrels, tells it to be a friend to the Diné,
    and sends it to Black Mountain.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that many bears in Black Mountain are descended from the
    bear made from the head.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The young man cuts off the nipples, throws them into a formerly fruitless
    piñon-tree, and they become edible pine nuts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Níyol and Pésasike lead the hero to the east, south, west, and north, where
    the corpses of his brothers lie, and restore those brothers to life.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The restored group returns to the former dwelling place and builds a new house,
    but does not return to the old home because it is a tsi'ndi hogán and accursed.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The holy ones give the young hero the name Léyaneyani, or Reared Under the
    Ground, because they had hidden him in the earth when his brothers fled from his
    sister's wrath.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The holy ones tell Léyaneyani to dwell at Atáhyitsoi, described as Big Point
    on the Edge and shaped like a Navaho hut; the narrator says he is thought still
    to dwell there.
  category: setting
  evidence_refs:
  - ev:5
