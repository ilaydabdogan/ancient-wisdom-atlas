literal_observations:
- id: obs:1
  text: Góntso had twelve wives from three named gentes and gave grain from abundant
    harvests to the gentes of his wives.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wives are described as unfaithful; Góntso complained to their relations
    and chiefs, who eventually told him they would not interfere with what he did.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Góntso mutilated several offending wives; three died, the fourth survived
    after her nose was cut off, and nose-cutting was then agreed on as the greatest
    punishment for a faithless wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The remaining wives were all made noseless, gathered to plot against Big Knee,
    and spoke openly enough that he slept alone outside their company.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The people prepared and held a nine-day ceremony for Big Knee.
  category: action
  evidence_refs:
  - ev:3
