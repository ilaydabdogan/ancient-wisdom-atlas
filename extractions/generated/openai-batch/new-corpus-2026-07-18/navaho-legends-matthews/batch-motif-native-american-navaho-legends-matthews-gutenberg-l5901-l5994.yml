  summary: The passage recounts Góntso or Big Knee, his twelve wives, their punishments,
    a nine-day ceremony in which the mutilated wives dance with knives, their curses
    and departure north, and several later accessions of Ute, Thá`paha-halkaí, Apache,
    Zuñi, Klógi, and Tó`hani people into Navaho gentes and alliances.
  language: English
