canonical_text:
  quote: '"Water all around they say; water not to be crossed, not to be climbed flowed
    all around they say."'
  summary: The passage reports conflict, failed attempts by a woman and a man to enter
    several directional places, and a rebuke by Tiéholtsodi commanding departure.
    After four nights, white appearances occur in the four directions, enclosing mountains
    and water surround the people, and they go in circles up to the sky. A blue-headed
    being calls them to an eastward hole through which they emerge on an upper surface
    among the Swallow People. A following song names figures who bring things and
    says that people are restored.
  language: Navajo with English interlinear translation
  quote_policy: quoted
