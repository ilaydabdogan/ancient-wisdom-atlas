canonical_text:
  quote: ''
  summary: The passage recounts several episodes in which wandering or unnamed groups
    encounter other peoples, receive names based on places or events, and are incorporated
    into Navaho gentes or affiliated with existing gentes. Episodes include the naming
    of the Overhanging Rocks People, the naming of the Honagá`ni after an old woman
    walks around them, the affiliation and marriage restrictions of related gentes,
    the water-fetching encounter that leads to the name To`baznaázi, and later adoption
    of Apache and Pah Ute bands by Thá`paha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A nameless gens from the west, associated with a turquoise wand given by Estsánatlehi,
    left the San Juan area and wandered south.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two hunters found fresh unshod human footprints at Tsé`nahapil, saw a man
    on a rocky pinnacle, and discovered that he spoke their language.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two groups met at the appointed place, camped together, and exchanged
    histories and adventures.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The strangers said they had been created at the meeting place seven years
    earlier, lived nearby, and called themselves Tsé`dine`, or Rock People.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The nameless group gave the Rock People the name Tse`nahapi'lni, Overhanging
    Rocks People, from the place where they met, and they became a Navaho gens.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: The Tse`nahapi'lni had cached corn and pumpkins, prepared corn-cakes for travel,
    and traveled south with the nameless group to visit Apaches at Tsóhanaa.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Apaches at Tsóhanaa recognized the visitors as friends and treated them
    well enough that the visitors remained for a time.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: After the nameless people had lived among the Apaches for seven years, an
    old woman walked around the whole band and named them Honagá`ni, Walked-around
    People.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After returning to the San Juan, the Honagá`ni formed close relationships
    with several named gentes, and five of those gentes are treated as one gens for
    marriage purposes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Two Thá`paha children sent to a spring for water returned with four wicker
    bottles instead of two, saying they had taken the other bottles from two little
    girls at the spring.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The parents went to restore the stolen bottles and met the strange girls,
    who said they belonged to wanderers camped on a mountain and had been sent two
    together to find water.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: The Thá`paha named the strangers To`baznaázi, Two Come Together for Water,
    hosted them, helped carry their water, and incorporated them as a new Navaho gens
    closely affiliated with Thá`paha.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Later Apache and Pah Ute bands were adopted by Thá`paha without being formed
    into new named gentes.
  category: relationship
  evidence_refs:
  - ev:7
