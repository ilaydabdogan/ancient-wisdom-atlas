literal_observations:
- id: obs:1
  text: 'From many myths and legends obtained from Navajos, three are selected for
    publication: one Origin Legend and two incomplete rite-myths told by men who were
    not priests of the associated rites.'
  category: sequence
  evidence_refs:
  - ev:1
