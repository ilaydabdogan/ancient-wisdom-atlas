  text: The passage states that Navajo legends have many variants and that no two
    tellers are expected to tell the same tale exactly alike.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Origin Legend is described as belonging to the tribe at large rather than
    to a special order or priesthood.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hatáli Nez is described as a learned old shaman who omitted an episode about
    the making of the stars, while Jake the silversmith related a version of that
    episode.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The Origin Legend is divided into four parts: The Story of the Emergence,
    Early Events in the Fifth World, The War Gods, and The Growth of the Navaho Nation.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The first part, The Story of the Emergence, ends when the people come out
