canonical_text:
  quote: ''
  summary: After four days, ten brothers leave in parties toward the four directions
    while the youngest remains. Whirlwind and Knife Boy prepare a concealed chamber
    under the hogan for him, with four directional tunnels, weapons, colored stones,
    and Wind and Darkness as monitors. The bear-woman tracks the departing brothers
    by pouring water on the ground and kills them, then finds the hidden youngest
    brother. Warned by Wind, he avoids her deceptions, refuses to re-enter the death-associated
    hogan, watches her attempted attack while she combs his hair, and destroys her
    external vital parts with a chain-lightning arrow after plants delay her pursuit.
  language: English
  quote_policy: summarized
