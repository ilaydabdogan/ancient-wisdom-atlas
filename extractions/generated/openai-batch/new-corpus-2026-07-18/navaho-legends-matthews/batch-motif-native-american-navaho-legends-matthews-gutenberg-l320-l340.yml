canonical_text:
  quote: ''
  summary: 'The passage describes Navaho subsistence and economy: limited agriculture,
    reliance on sheep and goats, wool trade with white traders, use of ponies, and
    a few cattle. It notes that sheep and goats were introduced after European contact
    and infers that Navahoes have not been shepherds for many centuries. It adds that
    legends portray them as recently prosperous, formerly poor hunters and foragers
    using wild seeds, small animals, and fall-traps.'
