- id: obs:2
  text: 'In the beginning origin passage, at or from Water with Hill Central, directional
    risings are described: east is white and associated with day, south is blue, west
    is yellow and associated with evening, and north is dark and associated with lying
    down and sleeping.'
  category: sequence
  evidence_refs:
