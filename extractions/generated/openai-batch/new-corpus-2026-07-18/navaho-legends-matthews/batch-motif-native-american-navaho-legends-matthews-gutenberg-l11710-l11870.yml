canonical_text:
  quote: ''
  summary: 'The passage first gives an asseveration attributed to Torlino, naming
    Earth, sky, dawn, evening, blue sky, darkness, sun, and an inward speaking presence
    as things before which the speaker is ashamed. It then begins an origin legend:
    at a central water-and-hill place, directions are associated with colors and times;
    waters flow outward; named places and early insect or animal inhabitants are listed;
    twelve people begin life; oceans lie in the four directions with named chiefs;
    social disorder leads to speeches saying the people should not remain and must
    depart.'
  language: Navajo with English interlinear translation
  quote_policy: summarized
