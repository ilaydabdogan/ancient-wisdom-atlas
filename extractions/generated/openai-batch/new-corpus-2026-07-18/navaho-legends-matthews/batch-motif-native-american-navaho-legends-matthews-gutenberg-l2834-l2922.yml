canonical_text:
  quote: ''
  summary: After the emergence into the Fifth World, the people drain lake waters,
    cross mud dried by Smooth Wind, test their fate by floating and sinking objects,
    confront Coyote over stolen young of Tiéholtsodi, encounter death and a ghost
    in the lower world, and dispute with the Kisáni over seed corn, producing explanations
    for mortality, ghost fear, crop differences, and separation from Pueblos.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The lake is bounded by high cliffs with a plain above, and mountains are said
    to exist around it now but to have been created after the emergence.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Blue Body throws four stones toward the four cardinal points, breaking holes
    in the cliffs so the waters flow away in four directions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After partial drainage, deep mud remains between the island and mainland until
    Smooth Wind blows a strong wind and dries it in one day.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The Kisáni camp on the east side of the island and build a stone wall for
    shelter from the wind; other people set up a brushwood shelter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women erect four poles, stretch a deerskin over them, and play the game of
    three-sticks, one of four games brought from the lower world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: On reaching the mainland, the people seek to divine their fate by throwing
    a hide-scraper into water; it floats, and they rejoice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Coyote repeats the fate test with a stone; it sinks, angering the people,
    and he argues that death is necessary so descendants will have room and cornfields.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Puma and Wolf visit the newly emerged people, saying they heard new people
    had come up out of the ground; Puma takes a bride from among them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the fourth day after emergence, water is seen welling up in the emergence
    hole and rising toward its top, prompting a council over the danger.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: First Man points to Coyote, calls him a rascal, and says Coyote may be carrying
    stolen property under his robe because he never removes it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: When Coyote’s robe is torn away, two strange small spotted objects drop out,
    described as resembling buffalo calves and identified as the young of Tiéholtsodi.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The people throw the young of Tiéholtsodi into the hole, after which the waters
    subside and rush back to the lower world.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: On the fifth night one of the twin hermaphrodites stops breathing; in the
    morning the people lay her among the rocks and wonder where her breath went.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Two men look down into the emergence hole and see the dead one seated by a
    river in the fourth world, combing her hair.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The two men who looked upon the dead one die within four days, and the passage
    states that Navahoes have since feared looking on the dead or a ghost.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The Kisáni are said to have brought an ear of corn for seed from the lower
    world.
  category: object
  evidence_refs:
  - ev:8
- id: obs:17
  text: Some young men demand the Kisáni corn; the corn owner breaks the ear in two
    and offers them a choice of halves.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: Coyote takes the tip end of the ear of corn, while the Kisáni keep the butt;
    the passage presents this as the reason Pueblo Indians have better corn crops
    than Navahoes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: The passage also explains that Pueblos moved away because they were alarmed
    by threats and angry language, which is why Navahoes and Pueblos live apart.
  category: relationship
  evidence_refs:
  - ev:8
