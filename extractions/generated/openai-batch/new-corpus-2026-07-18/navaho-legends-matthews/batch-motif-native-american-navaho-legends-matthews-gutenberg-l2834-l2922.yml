candidate_motifs:
- id: motif:1
  label: emergence or ascent from a lower world
  taxonomy_refs:
  - ascent
  basis: The passage repeatedly identifies the people as having come from the lower
    world or out of the ground into the Fifth World.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage is a continuation after the main emergence, so the emergence
    itself is mostly referenced rather than narrated in full here.
- id: motif:2
  label: waters threatening and receding after ritual or corrective action
  taxonomy_refs:
  - flood_and_renewal
  basis: Waters surround the people after emergence, are drained through openings,
    later rise dangerously in the emergence hole, and subside when the young of Tiéholtsodi
    are returned.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage concerns lake drainage and rising water rather than a complete
    world flood.
- id: motif:3
  label: trickster establishes or explains mortal limits
  taxonomy_refs:
  - trickster_boundary
  basis: Coyote’s sinking-stone divination contradicts the floating hide-scraper,
    but his speech explains why people should die after a time.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents the people as accepting the wisdom of his words,
    so the act is not only disruptive.
- id: motif:4
  label: stolen sacred or dangerous beings concealed by trickster
  taxonomy_refs:
  - sacred_theft
  - trickster_boundary
  basis: Coyote is accused of concealing stolen property, and the young of Tiéholtsodi
    fall from under his robe; their return to the hole ends the rising waters.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage calls the property stolen but does not narrate the theft itself
    in this line range.
- id: motif:5
  label: dead person visible in another world
  taxonomy_refs:
  - afterlife_journey_map
  basis: After death, the deceased is seen beside a river in the fourth world; witnesses
    die afterward, and the passage links this to fear of the dead or ghosts.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: Only one location in the post-death condition is described; no full journey
    itinerary is given.
- id: motif:6
  label: contest over seed corn explaining later agricultural difference
  taxonomy_refs:
  - sacred_exchange
  - sacred_theft
  basis: Seed corn brought from the lower world is demanded, divided, and partly taken
    by Coyote; the retained butt is used to explain why Pueblo Indians have better
    corn crops.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage frames the episode etiologically, but the taxonomy references
    are approximate because the corn exchange is partly a bargain and partly an impatient
    taking.
- id: motif:7
  label: etiology of social separation between neighboring peoples
  taxonomy_refs: []
  basis: The passage states that threats and angry language caused Pueblos to move
    away, explaining why Navahoes and Pueblos live apart.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No supplied taxonomy family directly names ethnic separation etiologies.
