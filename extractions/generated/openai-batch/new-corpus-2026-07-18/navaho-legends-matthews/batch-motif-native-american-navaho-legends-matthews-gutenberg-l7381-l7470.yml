canonical_text:
  quote: ''
  summary: After Nati'nesthani's marriage, the old man repeatedly tries to poison
    him through food prepared and presented by the daughter. The Wind People warn
    Nati'nesthani where the poison is, and he avoids it each morning by changing how
    or whether he eats. On the fourth day he announces he must go home and refuses
    new moccasins offered by the young woman.
  language: English
  quote_policy: summarized
