canonical_text:
  quote: ''
  summary: The passage recounts the incorporation of several peoples into Navajo gentes
    through migration, adoption, captivity, freedom of descendants, and marriage.
    It also describes a winter natsi'd ceremony for Big Knee at To`ye'tli, the arrival
    of strangers and couriers from the west, and Estsánatlehi's four directional mountains,
    where she dances to bring clouds, goods, plants, corn, and animals while following
    a sunlike but incomplete route.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A people from Tha`tsí, west of the San Juan settlement, joined the Navahoes
    after the Tó`hani; they were said to have escaped from alien gods and were regarded
    as holy people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Tha`tsí newcomers were divided into Thá`tsini and Kaídine`, or Willow
    People, but the passage says the division later disappeared among descendants.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Navahoes, formerly described as weak and peaceable, became numerous and
    began to talk of war.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Napaílinta led a war party against Kinlitsí, called Red House, and returned
    with captives, including a girl he had captured.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Captives from Kinlitsí were initially slaves; their descendants became free,
    increased, and were connected with the Kinlitsí and Tliziláni gentes and with
    intermarriage restrictions involving Tsinadzi'ni.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Two Apache gentes from the south, Destsíni and Tlastsíni, were adopted by
    the Navahoes as separate gentes and became close relations to Tsinadzi'ni.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Utes camped near the Navahoes with good arms and two varieties of shields,
    one round and one with a crescentic cut; they later merged into the Navahoes as
    Notá or Notádine`.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A Ute war party captured a Spanish woman near a Mexican settlement; she was
    their slave, and her descendants became free among the Navahoes and formed the
    Nakaídine`, or Mexican gens.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A winter natsi'd ceremony was held for Big Knee at To`ye'tli, described as
    the sacred place and home of the War Gods.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: During the natsi'd rites, strangers came from the direction of the river,
    joined the Navahoes, and were adopted as the gens To`yetlíni.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: A Thá`paha woman visited an Apache camp, secretly left with an Apache youth,
    and later returned as an old woman with her husband and three daughters.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The three daughters were described as handsome, light-skinned, and fair-haired;
    their grandmother insisted that a new gens be made of them, called Háltso, Yellow
    Bodies.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: Two strange men speaking the Navaho language entered the camp during the ceremony
    and said they were couriers for wanderers from the shores of the great waters
    in the west.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Estsánatlehi's home was surrounded by four mountains, one in each cardinal
    direction, placed like the mountains at the Place of Emergence.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:15
  text: Estsánatlehi danced on the east mountain to bring clouds, the south mountain
    to bring goods, the west mountain to bring plants, and the north mountain to bring
