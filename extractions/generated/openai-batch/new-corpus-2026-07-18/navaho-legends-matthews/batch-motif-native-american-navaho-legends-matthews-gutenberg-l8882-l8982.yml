canonical_text:
  quote: ''
  summary: Notes describe the ritual preparation of sacred buckskin for Navajo masks,
    a yucca-leaf mask used in the night chant and destroyed after use, Hatáli Nez's
    explanation that narrating lower-world portions of the creation myth places narrator
    and listener in the land of the dead until the people's emergence into the fifth
    world, terminology for sacred chant and chanter, and two color systems for the
    four cardinal directions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: "“Sacred buckskin” designates deerskins specially prepared for masks and other
    Navajo rites."
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deer used for sacred buckskin must not be shot or wounded; it is driven
    until it falls exhausted and then smothered with a pollen bag over its mouth and
    nostrils.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pollen lines are marked on the dead deer, incisions are begun with a stone
    knife along those lines, and the removed skin is placed east of the carcass with
    its head to the east.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The deer’s own ulnæ and fibulæ are placed with the skin and used as scrapers
    or awls; bones from another deer must not be used on that skin.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A mask made from Yucca baccata leaves is used in the night chant and is torn
    up by the shaman after it has served its purpose.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hatáli Nez said that while narrating the portions of the creation myth about
    the ancestors’ nether-world adventures, narrator and listener were travelling
    in the land of the dead among dangerous ghosts.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hatáli Nez said the danger ended when the tale reached the people’s ascent
    to the fifth and last world.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After recounting the subterranean wanderings and bringing the Navajos through
    the Place of Emergence in the San Juan Mountains, Hatáli Nez stopped speaking
