canonical_text:
  quote: ''
  summary: The passage recounts a version of the making of the Navajo sacred mountains
    after the people arrive in the fifth world. First Man uses earth brought from
    corresponding lower-world mountains, mixed with shells, turquoise, coal, goods,
    and precious stones, while the people prepare sacred buckskins and baskets and
    songs are sung. Four mountains are carried to the quarters of the world, two remain
    in the middle, and deity pairs are placed in the mountains. Notes identify Tsisnadzi'ni
    and Tsótsil and describe associated colors, materials, and deities.
  language: English
  quote_policy: summarized
