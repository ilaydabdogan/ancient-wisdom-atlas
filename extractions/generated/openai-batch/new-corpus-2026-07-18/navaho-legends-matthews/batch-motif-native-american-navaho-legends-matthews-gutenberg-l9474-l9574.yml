canonical_text:
  quote: ''
  summary: 'The passage gives notes on several Navajo mythic explanations: Sun and
    Moon require deaths as payment for their daily and nightly motion; the early world
    is widened by the four winds moving boundary mountains and seas; First Man and
    First Woman make stars from sparkling mica, while Coyote claims red stars and
    scatters the remaining fragments; named destroyers spring from blood and are associated
    with invisible cliff dangers; and Kintyél is identified as a Broad Pueblo ruin
    in Chaco Canyon.'
  language: English
  quote_policy: summarized
