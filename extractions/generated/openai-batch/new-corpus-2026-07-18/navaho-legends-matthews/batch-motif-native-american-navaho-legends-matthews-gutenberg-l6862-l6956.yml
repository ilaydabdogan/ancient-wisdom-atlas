canonical_text:
  quote: ''
  summary: The passage describes gods and helper beings carrying a log containing
    a man called the Navaho to a river, launching it, guiding it downstream, protecting
    it from Kisáni people at Blue House who try to take it for fuel, and freeing it
    when it becomes caught among rocks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A heavy log contains a man and must be carried to the river.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The log is prepared with ropes of crooked lightning, rainbow, straight lightning,
    and rainbow, and a sunbeam is attached to each end.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gánaskidi are stationed at each end of the log, Hastséhogan in the middle,
    and the Gánaskidi place their wands crosswise under it before the group lifts
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some of the bearers say that if they let the log fall they will not try to
    raise it again and the Navaho will not make his journey.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Black Wind and Blue Wind help in front, while Yellow Wind and White Wind help
    behind, and the log reaches the river margin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tó`nenili, the Water Sprinkler, makes fun and plays tricks while the gods
    work, and the Navaho sings songs for stages of the work and launch.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: After the log is put on the water, it does not initially go downstream; the
    gods cover it with black mist and cloud and push it with plumed wands until it
    enters the current.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Blue House, Kisáni people see the log, cannot see the gods, and try to
    seize or strand it for fuel.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The gods use rain, hail, lightning, thick cloud, rainbows, and zigzag lightning
    around the log; the Kisáni become afraid and their chief says the gods guard the
    log and that it is holy.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the log becomes entangled among upright rocks, two Fringe-mouths of the
    river lift it, align it with the current, and let it float away.
  category: action
  evidence_refs:
  - ev:9
