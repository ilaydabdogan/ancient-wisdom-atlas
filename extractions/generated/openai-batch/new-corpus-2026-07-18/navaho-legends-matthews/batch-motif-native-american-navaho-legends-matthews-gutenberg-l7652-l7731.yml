canonical_text:
  quote: ''
  summary: Nati'nesthani's wife opens a turquoise-adorned rock stopple with a wand,
    revealing steps into a square chamber with four crystal doors and rainbows. She
    shows him four beautiful animal-filled rooms associated with deer, antelope, Rocky
    Mountain sheep, and elk. Deer Raiser identifies ceremonial cigarettes placed by
    the doors and steps and instructs Nati'nesthani to remember their markings for
    later ceremonies. A deer is captured from the eastern room and slaughtered. Deer
    Raiser then plots to kill Nati'nesthani by luring him into a canyon containing
    four fierce pet bears, but the Wind People warn him not to enter.
  language: English
  quote_policy: summarized
