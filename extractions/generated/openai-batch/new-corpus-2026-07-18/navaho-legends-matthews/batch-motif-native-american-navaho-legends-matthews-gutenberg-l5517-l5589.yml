canonical_text:
  quote: ''
  summary: Yolkaí Estsán, the younger sister of Estsánatlehi, chooses to return to
    Depe'ntsa, the place from which the people came. She wanders among mountains and
    old ruins near the Place of Emergence, becomes lonely, and thinks about how people
    might be made. Hastséyalti hears of her loneliness, appears after four calls from
    the east, and promises to return with Estsánatlehi and other gods. On the fourth
    day Hastséyalti, Hastséhogan, mountain divinities, and other gods assemble in
    a circle east of her lodge according to cardinal directions. Estsánatlehi stands
    in the west, Yolkaí Estsán in the east, and sacred blankets, buckskins, and ears
    of corn are brought.
  language: English
  quote_policy: summarized
