canonical_text:
  quote: ''
  summary: The passage describes a klédzi hatál dry-painting of Bélahatini’s vision
    at a lake with sacred corn, crossed whirling logs, yéi figures, and the rainbow
    goddess; notes a related but distinct hollow-log river-journey story of Nati'nesthani;
    summarizes the Great Shell of Kintyél as a bead-chant rite-myth with a moral about
    the poor and humble being favored by gods; and explains the translator’s methods
    and limits of recorded texts.
  language: English
  quote_policy: summarized
