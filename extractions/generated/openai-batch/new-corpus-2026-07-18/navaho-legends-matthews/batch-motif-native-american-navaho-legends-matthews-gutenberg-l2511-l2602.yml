candidate_motifs:
- id: motif:1
  label: Primal humans created from paired corn and animated by wind
  taxonomy_refs:
  - sacred_birth
  basis: A white ear of corn becomes First Man and a yellow ear becomes First Woman
    after winds blow between the buckskins; the passage explicitly says wind gave
    them life.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: 'The taxonomy reference is broad: this is not ordinary biological birth
    but a ritualized transformation into the first human pair.'
- id: motif:2
  label: Primal ancestral pair joined by divine instruction
  taxonomy_refs:
  - sacred_marriage
  basis: The gods direct the construction of an enclosure and tell First Man and First
    Woman to live together as husband and wife; their descendants populate the land.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: The passage does not call the pair divine spouses; the sacred aspect rests
    on divine instruction and ancestral function.
- id: motif:3
  label: Rapid twin generation from the first pair
  taxonomy_refs:
  - sacred_twins
  basis: First Man and First Woman have five pairs of twins, with births and maturation
    occurring in repeated four-day intervals.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: Only the first generation is explicitly structured as twin pairs; later
    rapid reproduction is collective.
- id: motif:4
  label: Mountain visit as transmission of masks and hidden knowledge
  taxonomy_refs:
  - ascent
  - cosmic_mountain
  - forbidden_knowledge
  - initiation
  - wisdom
  basis: The gods take the primal pair and their children to the eastern mountain
    where the gods dwell; after their return, the children wear masks, pray for rain
    and crops, and are thought to have learned secrets of witchcraft.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage says the witchcraft connection is thought or inferred, so
    the hidden-knowledge portion should be reviewed carefully.
- id: motif:5
  label: Origins of crafts, agriculture, and hunting techniques
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: The descendants build irrigation works and tools; the hermaphrodites invent
    pottery and a wicker water-bottle; the gods teach deer-mask hunting, producing
    abundant meat and clothing.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The inventive roles are distributed among human descendants, hermaphrodite
    twins, and gods rather than a single culture hero.
- id: motif:6
  label: Ritual recurrence of four
  taxonomy_refs: []
  basis: 'The passage repeatedly uses fourfold acts and intervals: four circuits,
    four days for births, maturation, mountain stays, and four divine calls before
    appearance.'
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:6
  confidence: high
  cautions: No supplied taxonomy reference directly names sacred fourness, so no taxonomy
    ID is assigned.
- id: motif:7
  label: Animal beings emerge at the boundary of sky and earth
  taxonomy_refs:
  - trickster_boundary
  basis: When sky and earth touch, Coyote and Badger spring from the earth; Coyote
    rises first, is counted as elder brother, and moves among the camp while Badger
    enters the lower-world hole.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage does not explicitly call Coyote a trickster; the taxonomy
    reference is based only on Coyote's boundary emergence and later skulking behavior
    in this passage.
