evidence:
- id: ev:1
  type: summary
  locator: lines 2511-2537; paragraphs 163-164
  quote_or_summary: The gods arrange buckskins, corn, and eagle feathers; winds enter
    from east and west; eight Mirage People circle four times; the corn disappears
