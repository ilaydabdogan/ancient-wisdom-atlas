  quote: ''
  summary: The passage describes the creation of First Man and First Woman from paired
    ears of corn enlivened by wind, their marriage and rapidly multiplying descendants,
    a visit to the eastern mountain of the gods where masks and secret knowledge are
    associated, the origins of farming tools, pottery, water vessels, and deer-hunting
    masks, and the emergence of Coyote and Badger when sky and earth touch.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The gods placed two buckskins, two ears of corn, and two eagle feathers on
    the ground with specified east-west orientations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people were told to stand at a distance so wind could enter between the
    skins.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A white wind blew from the east and a yellow wind blew from the west between
    the skins.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Eight Mirage People walked around the objects four times, after which the
    protruding eagle feathers were seen to move.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: When the upper buckskin was lifted, the ears of corn were gone and a man and
    a woman lay there instead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: The white ear of corn became a man, the yellow ear became a woman, and the
    passage states that wind gave them life.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:7
  text: The passage connects the life-giving wind of the created pair with the breath
    that comes from human mouths and with trails visible in the skin at human fingertips.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:8
  text: The created pair are named First Man and First Woman, and the gods direct
    that a brushwood enclosure be built for them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The gods tell First Man and First Woman to live together as husband and wife.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:10
  text: First Man and First Woman have five pairs of twins; the first pair are hermaphrodites
    and barren, while later children grow to maturity in four days and marry one another.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:11
  text: The gods take First Man and First Woman, and afterward all their children,
    to the eastern mountain where the gods dwell for four days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:12
  text: After returning from the eastern mountain, the children sometimes wear masks
    and pray for abundant rain and crops.
  category: action
  evidence_refs:
  - ev:3
- id: obs:13
  text: The passage says it is thought that the visitors to the eastern mountain learned
    secrets of witchcraft there, and connects such masks with witches or wizards and
    with marriages among close kin.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:14
  text: The brothers and sisters later separate, keep their earlier marriages and
    mountain mysteries secret, and marry among the Mirage People.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:15
  text: The descendants multiply rapidly, marry among the Kisáni and others from the
    lower world, and become a multitude in the land.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:16
  text: The descendants make a large farm, build a dam, and dig a wide irrigating
    ditch.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: One hermaphrodite watches the dam and invents pottery; the other watches the
    lower end of the farm and invents the wicker water-bottle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:18
  text: Other people make weeding implements from split cottonwood boards, hoes from
    deer shoulder-blades, and stone axes, and obtain seeds from the Kisáni.
  category: action
  evidence_refs:
  - ev:5
- id: obs:19
  text: After an unsuccessful attempt to make a deer mask, the gods arrive with deer
    and antelope heads and teach the people how to make masks and imitate deer for
    hunting.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:20
  text: The use of deer masks leads to successful hunting, abundant meat, and garments
