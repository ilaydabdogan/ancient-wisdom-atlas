canonical_text:
  quote: ''
  summary: The passage describes the first world at To`bilhaski'di, its directional
    colors, waters, places, inhabitants, and four directional ocean chiefs. The inhabitants
    quarrel and commit adultery, are rejected by the chiefs, and are ordered to leave.
    Encircling water rises around them, so they move upward to the sky, are shown
    a hole by a blue-headed member of the Swallow People, and emerge into the second
    world, where Swallow People dwell.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'At To`bilhaski''di, in the middle of the first world, colors appear in the
    four directions and correspond to day, evening, and night: white in the east,
    blue in the south, yellow in the west, and dark in the north.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Water flows from a central source in different directions, with streams to
    the east, south, and west and dwelling-places along their borders.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Named places are located to the east, south, and west, including Corn, Standing
    Reed, One Pot, They Come Often for Water, Underground House, and houses made of
    red mountain or red rock.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Twelve peoples are said to live and start life there, including dark ants,
    red ants, dragonflies, beetles of several kinds, bats, locusts, and white locusts.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'Oceans extend in all four directions, and each direction has a chief: Tiéholtsodi
    in the east, Blue Heron in the south, Frog in the west, and White Mountain Thunder
    in the north.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The people quarrel and commit adultery; the directional chiefs say that they
    should no longer dwell there and command them to go elsewhere.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: When offenses continue, the chiefs refuse to speak; a man and a woman are
    driven out when seeking entry, a council reaches no decision, and Tiéholtsodi
    says they must not remain on that earth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: After four nights, a white appearance arises in all four directions like an
    unbroken chain of mountains, but it is impassable water surrounding them.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The people move upward in circles until they reach the sky, while below them
    the water has risen and only water is visible.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A blue-headed being thrusts his head out from the sky and announces a hole
    to the east; the people enter the hole and pass to the surface of the second world.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The blue one belongs to the Swallow People, who live in the second world in
    rough, lumpy houses tapering upward with entrance holes at the top; many gather
    silently around the strangers.
  category: setting
  evidence_refs:
  - ev:11
