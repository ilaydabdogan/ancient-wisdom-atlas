canonical_text:
  quote: ''
  summary: Spiders, Otters, and Cliff Swallows trap, kill or seem to kill, and dismember
    Coyote, producing an explanation for the cliff swallow's brow band. Coyote's partner,
    the sister of several brothers, secretly performs directional rites, replaces
    her canine teeth with bone-awl tusks, announces dream omens of kin loss, and gradually
    transforms into a bear. As a bear-woman she repeatedly goes to the fatal canyon,
    fights Coyote's slayers, returns wounded, heals herself by magic around a fire,
    and after four days defeats or disperses the animals, explaining their later habitats.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Spiders climb the bluff behind Coyote and weave strong webs in the trees
    and bushes before the Otters attack him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote lets the Otters come near because he trusts his swiftness, but he is
    caught in the spiders' webs and dragged down the hill.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Otters kill Coyote, or appear to kill him, and Cliff Swallows tear him
    apart, carry fragments to their nests, and leave only drops of blood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Cliff Swallows tear Coyote's skin into strips and make head bands from
    it, which the narrator says accounts for the cliff swallow's present brow band.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: When the brothers return, Coyote is absent; the sister looks into the lodge
    four times, asks what they have done with him, and leaves angrily after being
    told he may have gone to the warned canyon and been killed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The youngest brother secretly watches the sister as she pretends to sleep,
    sits facing east, south, west, and north in sunwise order, removes her upper eye-teeth,
    and inserts pieces of bone awls as tusks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The sister says that a future dream of losing the right upper eye-tooth means
    losing a brother, and a dream of losing the left upper eye-tooth means losing
    a sister.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The sister makes lower tusks and says that dreams of losing the right lower
    canine mean losing a child, while dreams of losing the left lower canine mean
    losing a parent.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: As the sister continues her rites, hair grows over her body, her ears wag,
    her snout grows long, her teeth gnash, and her nails become claws; she is covered
    with shaggy hair like a bear.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The brothers say that the transformation rites must be the mysteries that
    Coyote had explained to the sister on the first night.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Soon after the watcher reports, a she-bear rushes past the lodge door and
    follows the trail Coyote had taken toward the woods and fatal canyon.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The bear-woman returns at night wounded from fighting Coyote's slayers, walks
    around a fire, magically draws arrow-heads or missiles from her body, and heals
    her wounds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: For four days and four nights the bear-woman continues fighting and healing
    until she conquers her enemies, killing many and dispersing the rest.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the bear-woman's victory, swallows flee to high cliffs, otters hide
    in water, and spiders retreat into holes in the ground, where the narrator says
    these creatures have dwelt ever since.
  category: relationship
  evidence_refs:
  - ev:8
