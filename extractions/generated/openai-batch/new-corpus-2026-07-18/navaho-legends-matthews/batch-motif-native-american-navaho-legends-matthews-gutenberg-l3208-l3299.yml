canonical_text:
  quote: ''
  summary: A young son of Hastséhogan enters Nohoílpi the gambler's house after one
    of the gambler's wives returns from fetching water. Nohoílpi repeatedly challenges
    him to gamble. With the help of divine and animal powers, the youth wins successive
    contests, gains the gambler's wives, wealth, houses, slaves, and finally Nohoílpi
    himself. The released captives cross a boundary line and rejoin their people.
    The victor distributes shell wealth to Hastséyalti, the gods, and the Sun, then
    silences Nohoílpi's curses by shooting him into the sky with the Bow of Darkness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At sunrise one of Nohoílpi's wives goes to a neighboring spring with a water-jar,
    and the son of Hastséhogan follows her after descending into the canyon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife initially mistakes the youth for her husband because he is dressed
    and adorned to represent him, then remains silent and lets him follow her into
    the house.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nohoílpi asks four times whether the stranger has come to gamble and then
    recklessly proposes wagers involving himself and parts of his body.
  category: speech
  evidence_refs:
  - ev:1
