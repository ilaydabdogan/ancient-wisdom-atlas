- id: motif:5
  label: Punitive ascent or skyward banishment of a defeated being
  taxonomy_refs:
  - ascent
  basis: After losing and cursing, Nohoílpi is shot upward into the sky with the Bow
    of Darkness until he disappears.
  evidence_refs:
