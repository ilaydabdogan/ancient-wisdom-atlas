canonical_text:
  quote: ''
  summary: Nati'nesthani prepares a hollow log with cedar-bark plugs and provisions
    in order to leave his people by river. His attempts to enter the log are repeatedly
    interrupted by the cry of Hastséyalti, the Talking God, who appears, warns him
    that he would drown, denies his request to travel in the log, asks about sacred
    offerings, and instructs him to clean the house and wash with yucca before a later
    divine visit. Nati'nesthani has his niece steal needed items. At dawn, repeated
    calls signal the approach of the divine ones, and his grandmother comes to believe
    they are arriving.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nati'nesthani moistens shredded cedar-bark, pounds it into a soft mass, uses
    it to plug the hollow log, and prepares another plug to close the butt end from
    inside after entering.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: His niece cooks wood-rats and grinds tlo`tsózi seeds for him, placing the
    meal in a bag made of sewn wood-rat skins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nati'nesthani enters the log four times to increasing depth; each time he
    hears the cry “Wu`hu`hu`hú,” and on the fourth attempt the log is shaken and Hastséyalti
    is seen standing over him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hastséyalti first uses signs to forbid Nati'nesthani from entering the log,
    indicating that he would be drowned and should go home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nati'nesthani tells Hastséyalti that he is an outcast and wants the log to
    carry him far away on the waters of the Old Age River.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nati'nesthani pleads four times to go in the log, and Hastséyalti denies him
    four times.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hastséyalti asks whether Nati'nesthani has precious stones, white shell beads,
    turquoise, and the original eighteen sacred things offered to the gods for favor;
    Nati'nesthani answers yes, although he owns only his rags.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hastséyalti tells Nati'nesthani to remain home four nights, clean the house
    and surroundings, remove ashes, and have himself and his niece wash with yucca
    suds before the god returns.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Nati'nesthani asks his niece to steal needed goods from neighbors; over three
    days she steals the items, including baskets and sacred buckskins, which he wraps
    and stores in the lodge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At dawn Nati'nesthani hears Hastséyalti’s call four times, each time louder
    or nearer; his grandmother initially rejects his claim that divine ones are coming
    but eventually believes him.
  category: sequence
  evidence_refs:
  - ev:6
