canonical_text:
  quote: ''
  summary: The passage describes the people entering the blue second world, sending
    Locust couriers in all four directions, finding only barren land and the world
    edge, and forming a kinship alliance with the Swallow People. After an offense
    against the Swallow chief's wife, the strangers are ordered away; the Locusts
    lead an upward flight to the sky. Ni'ltsi, the Wind, reveals a southern slit through
    the hard sky, through which they enter the yellow third world. There they meet
    the Grasshopper People, repeat four-direction exploration, form another kinship
    alliance, and are again expelled after a comparable offense against a Grasshopper
    chief.
  language: English
  quote_policy: summarized
