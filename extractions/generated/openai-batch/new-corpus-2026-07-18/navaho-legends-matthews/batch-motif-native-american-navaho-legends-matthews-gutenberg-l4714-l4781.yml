canonical_text:
  quote: ''
  summary: Nayénezgani enters tunnels, shoots the beating heart of Téelget with a
    chain-lightning arrow, and flees while the monster tears open the tunnels before
    dying. Hazaí the Ground Squirrel confirms the death, and Nasi'zi/Gopher removes
    the skin; trophies are given to Nayénezgani. Nayénezgani returns home, asks where
    the Tse`na'hale dwell, and is warned about Winged Rock. He then leaves again,
    passes stone snakes near Tsúskai, reaches Tsé`bitaï, and is seized by the male
    Tse`na'hale after four swoops.
  language: English
  quote_policy: summarized
