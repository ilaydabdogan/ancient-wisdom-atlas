canonical_text:
  quote: ''
  summary: The passage explains the precedence of Nayénezgani over To`badzistsíni
    in legends, ceremonies, prayers, sacrifices, and song; describes the yéi as a
    numerous class of localized deities with named chiefs, families, and associated
    gods; defines digíni as holy people or divinities; and describes hostile alien
    gods and the water monster Tiéholtsodi, including his partial change from enemy
    to helper.
  language: English
  quote_policy: summarized
