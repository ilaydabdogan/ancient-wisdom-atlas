canonical_text:
  quote: ''
  summary: A Navaho displays two young bumblebees and tumbleweed seeds to the Eagle
    People as proof that he has slain their enemies. The Eagle People reward him with
    marriage promises, housing, ritual washing, food, robes, and instruction in Eagle
    rites. He casts the bees and seeds down through the sky-hole to the land of the
    Navahoes, learns the ceremonies of yói hatál, returns through the sky-hole with
    eagle plumage and wings, lands on Tsótsil, and later instructs his younger brother
    in a medicine-lodge.
  language: English
  quote_policy: summarized
