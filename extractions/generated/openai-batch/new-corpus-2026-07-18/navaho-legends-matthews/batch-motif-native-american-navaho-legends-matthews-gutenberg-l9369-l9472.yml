canonical_text:
  quote: ''
  summary: The passage gives explanatory notes on Navajo sacred mountains, directional
    color and material associations, named boy-girl figures connected with corn, pollen,
    goods, and jewels, a mirage-stone kept by medicine-men, and a ritually significant
    mixture of waters carried by Tó`nenili.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Do-kos-líd, identified with San Francisco Mountain, is described as a sacred
    mountain of the Navahoes and as the western boundary of their land; yellow and
    yellow-associated things, including Haliotis shell, are associated with it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: White Corn Boy and Yellow Corn Girl are named figures whose names are derived
    from Navajo words for corn, white or yellow, boy, and girl; the note says it is
    uncertain whether they are the same as the deities of Do-kos-líd.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Depe'ntsa, identified with the San Juan Mountains, is said to bound Navajo
    land on the north; the Place of Emergence is located somewhere among these mountains,
    and black things are associated with them.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pollen Boy and Grasshopper Girl are named; Grasshopper Girl is said to be
    depicted in corn pollen in a dry-painting.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Dsil-ná-o-til is rendered as Encircled Mountain; the note says Estsánatlehi
    and her people moved their camp to various places around its base, and that goods
    of all kinds are thought to belong to this mountain.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Boy Who Produces Goods and Girl Who Produces Goods are named; the term translated
    as goods originally referred to barterable items such as furs, skins, and textile
    fabrics, excluding food and jewels.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tso-lí-hi is described as one of the seven sacred mountains of the Navajo
    country, but its location, name meaning, and relation to jewels are stated to
    be uncertain or conjectural.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Tsoz-gá-li is identified only as a large yellow bird of undetermined species.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Boy Who Produces Jewels and Girl Who Produces Jewels are named; the term translated
    as jewels refers to hard, brittle materials such as shells, rough turquoise, cannel
    coal, and other stones considered precious by the Navahoes.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: A-ki-da-nas-tá-ni is the Navajo name for Hosta Butte, translated as one round
    thing sitting on top of another, and the butte is described as a prominent landmark.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: Mirage-stone is said to appear in the pollen bags of medicine-men; pieces
    were not sold, and a shaman feared exchanging one for a stone image believed to
    represent a Chinese god.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Tó`-la-nas-tsi is described as a mixture of spring water, snow water, hail
    water, and water from the four quarters of the world; Tó`nenili is supposed to
    have carried such water in jars, and ritual water approximates this mixture.
  category: object
  evidence_refs:
  - ev:12
