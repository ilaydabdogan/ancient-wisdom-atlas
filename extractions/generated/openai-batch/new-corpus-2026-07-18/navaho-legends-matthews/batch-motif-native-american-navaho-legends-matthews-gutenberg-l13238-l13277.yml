canonical_text:
  quote: ''
  summary: The remarks explain that the prayer is addressed to a mythic thunder-bird,
    described as a male divinity dwelling with other yéi at Tse`gíhi. The prayer is
    performed at the beginning of work on the last night of the klédzi hatál, with
    a shaman reciting each verse and a first dancer repeating it. The passage also
    discusses the semantic range of hozó-related words and identifies hozóna hastlé
    as a repeated closing expression for recorded Navaho prayers, analogous in function
    to the Christian Amen.
