canonical_text:
  quote: ''
  summary: The passage describes the Gán-as-ki-di/Gánaskidi as a numerous divine race
    connected with the Mountain Sheep People, able to appear as Rocky Mountain sheep,
    associated with the night chant, healing treatments, harvest and plenty, and a
    masked ceremonial personation bearing cloud, lightning, pollen, rainbow, and produce
    imagery. A separate note discusses the uncertain location of Ki'ndoliz, or Blue
    House.
  language: English
  quote_policy: summarized
