canonical_text:
  quote: ''
  summary: First Man names four directional mountains corresponding to the mountains
    bounding Navaho land. After a quarrel with First Woman, he calls the men to separate
    from the women by crossing a stream on a raft. The men, the hermaphrodites, and
    the Kisáni cross with tools and goods, while the women remain with what they helped
    make or raise. Over several years the men prosper agriculturally while the women’s
    crops decline and some women drown trying to cross. First Man recognizes that
    continued separation may end the race; the women are ferried over, bathed, dried
    with meal, enclosed until night, and then join the men’s feasts. Three missing
    women, a mother and two daughters, try to swim across in darkness; the mother
    reaches her husband, but the daughters are seized by Tiéholtsodi, the water monster.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: First Man names four mountains in the east, south, west, and north; the passage
    says they have the same names as the four mountains that now bound Navaho land
    and that a different race lived in each mountain.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: First Man is described as chief of all the people in the fourth world except
    the Kisáni, and as a great hunter; First Woman is described as his wife and as
    very corpulent.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: After First Man brings home a deer and he and First Woman eat, First Woman
    wipes her greasy hands on her dress and makes a remark that enrages him; he ends
    the quarrel by jumping across the fire and remaining silent for the night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The next morning First Man calls only the men, says the women believe they
    can live without men, and proposes that the males cross the stream and keep the
    raft on the far side.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The hermaphrodites come covered with meal because they had been grinding corn;
    they report having mealing-stones, cups, bowls, baskets, and other things, and
    First Man orders them to take those things and join the crossing.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The men and hermaphrodites cross to the north side on the raft with stone
    axes, farm implements, and everything they had made; the Kisáni also cross, six
    gentes of them, taking their women with them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some young men cry at parting with their wives but still obey their chief;
    the men leave the women everything that the women had helped make or raise.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: After crossing, some men hunt for food for the young boys, while others cut
    willows and build huts; all are sheltered in four days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: During the first winter the women have abundant food and taunt the men from
    across the river; over subsequent years the women plant less and harvest less,
    while the men clear more land and increase their crops.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the third autumn of separation many women jump into the river to swim across
    and are carried under the water; in the fourth year the men have excess corn and
    pumpkins while the women starve.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: First Man concludes that continued separation of men and women may cause the
    race to die out; when called, First Woman says the women cannot live without their
    husbands.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The women are ferried across on the raft, made to bathe, dried with meal,
    kept in a corral until night, and then let out to join the men in feasts.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Three missing women, a mother and her two daughters, call from the other side
    after dark and ask to be ferried over; when told to wait until morning, they jump
    into the stream and try to swim.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The mother reaches the opposite bank and finds her husband, but the two daughters
    are seized by Tiéholtsodi, the water monster, and dragged under the water.
  category: action
  evidence_refs:
  - ev:7
