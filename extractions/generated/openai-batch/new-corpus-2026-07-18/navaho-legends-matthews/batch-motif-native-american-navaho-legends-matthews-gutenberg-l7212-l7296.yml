- id: obs:3
  text: Following the direction indicated by the stick led him to a place on the eastern
    mountain, where he noticed a rock shelf and discovered two huts.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nati'nesthani removed his ragged blanket, wood-rat-skin garment, worn grass
    sandals, poor bow, and arrows, placing them in a juniper-tree before approaching
    a hut.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Inside one hut, a young woman was making and decorating a buckskin shirt with
    fringes and shells.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old man brought in Nati'nesthani's discarded possessions, called them
    his son-in-law's goods, and placed them on fine fabrics.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The old man spread fine sheep-skin and deer-skin seats and invited Nati'nesthani
    to sit beside the young woman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The old man asked four times to smoke Nati'nesthani's pipe, while Nati'nesthani
    initially answered that he was poor and had nothing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Nati'nesthani's tobacco pouch had pictures of the sun and moon; he used a
    tobacco mixture, a clay pipe, and sunlight to kindle the pipe.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: After smoking the pipe, the old man perspired violently and fell into a swoon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The mother gave goods to the young woman to offer Nati'nesthani if he restored
    the father to life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The old man was laid on his side in the middle of the floor with his head
    to the north and his face to the east.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Nati'nesthani put medicine in a pipe, lit it with sunbeams, and puffed smoke
    toward earth, sky, the patient, and the four directions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: After the fumigation, the old man showed signs of life, including twitching
