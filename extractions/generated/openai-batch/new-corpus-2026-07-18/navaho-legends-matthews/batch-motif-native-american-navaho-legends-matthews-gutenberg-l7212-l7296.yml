canonical_text:
  quote: ''
  summary: Nati'nesthani repeatedly seeks a distant fire, uses sticks to aim toward
    it, and follows the direction to an eastern mountain shelf where he finds two
    huts. After hiding his poor clothing and tools in a juniper-tree, he enters a
    hut with a young woman. Her father treats him as a son-in-law, seats him beside
    her, asks repeatedly for tobacco, smokes Nati'nesthani's pipe, and falls into
    a swoon. The women offer goods if Nati'nesthani restores him. Nati'nesthani uses
    medicine, smoke, directional actions, sun-lighting, water, and an earthen bowl
    to revive and treat the old man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After seeing the distant flame at night, Nati'nesthani set a forked stick
    in the ground and laid a long straight stick between forks, aiming it toward the
    fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before leaving on his final attempt to find the fire, he told his turkey to
    stay until he returned; the turkey turned its back and behaved angrily.
