canonical_text:
  quote: ''
  summary: The Eagles prepare the Navaho for removal from a cave or eyry using supports
    of lightning, sunbeam, and rainbow. Twelve Eagles carry him and the eaglets upward,
    release him when commanded by an unseen voice, and two Arrow-snakes then carry
    him through a sky-hole to an upper world. There he sees four colored directional
    pueblos with animal chiefs, receives a warning from Wind, observes war parties
    and Eagle people removing feather suits, tries to accompany warriors despite warnings,
    and finally finds a smoke-hole leading down to the house of Nastsé Estsán, the
    Spider Woman, who invites him inside.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Eagle brought an eagle-plume dress for the Navaho, but after argument the
    Eagles left without giving him the garment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Eagles laid the Navaho face down and placed crooked lightning, a sunbeam,
    straight lightning, and a rainbow under parts of his body as supports.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Twelve Eagles seized the ends of the six supports and flew away carrying the
    Navaho and the eaglets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Eagles circled while ascending, flew above Tsótsil or Mt. Taylor, nearly
    reached the sky, and then became weary.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: An unseen voice from above told the Eagles to let go of their burden, and
    the Navaho began descending swiftly toward the earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Two Arrow-snakes twined around the Navaho, carried him upward through the
    sky-hole, and landed him on the surface of the upper world above the sky.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: 'In the upper world the Navaho saw four pueblos: white in the east, blue in
    the south, yellow in the west, and black in the north.'
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Wolf, Blue Fox, Puma, and Big Snake were named as chiefs of the eastern, southern,
    western, and northern pueblos respectively.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Wind whispered to the Navaho that he might visit all pueblos except the northern
    one, where Chicken Hawk and other bad characters dwelled.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: A war party was organized, and returning warriors were mourned because many
    who had departed in the morning did not return at night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Inside their pueblos, the Eagles removed feather suits, hung them up, and
    wore white suits underneath.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Navaho wished to join a later war party, but the warriors repeatedly told
    him he was helpless against enemies who could move faster than they could.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Navaho repeatedly followed the war party after being told to remain behind,
    and at the camp he was given food and again scolded.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Navaho found smoke rising from a smoke-hole, saw an old smoke-yellow ladder,
    and looked down into a subterranean chamber.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:15
  text: In the subterranean chamber was Nastsé Estsán, the Spider Woman, described
    as an old woman with a big mouth and protruding curved teeth; she invited the
    Navaho into her house.
  category: attribute
  evidence_refs:
  - ev:6
