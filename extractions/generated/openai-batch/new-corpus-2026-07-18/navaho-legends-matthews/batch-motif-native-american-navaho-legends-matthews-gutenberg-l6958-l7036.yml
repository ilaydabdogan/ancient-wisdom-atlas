canonical_text:
  quote: ''
  summary: A floating log carrying the Navaho is pulled under the water by sacred
    underwater beings. Tó`nenili, Water Sprinkler, opens the water with two magic
    jars and finds the captive in a four-chambered underwater house ruled by Tiéholtsodi,
    who refuses to release him. After another council, Hastsézini, Black God, descends
    with Tó`nenili, challenges Tiéholtsodi, and sets the surrounding waters on fire
    with a fire-stick and fire-drill. Tiéholtsodi relents, and Tó`nenili extinguishes
    the flames with potent waters from his jars.
  language: English
  quote_policy: summarized
