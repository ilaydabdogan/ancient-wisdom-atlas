canonical_text:
  quote: ''
  summary: An old man repeatedly begs a Navaho young man for tobacco. After smoking
    it, the old man repeatedly falls into a deathlike swoon and is restored by the
    Navaho's medicines and ceremonies, for which women give goods. The Wind People
    warn the Navaho that the old man's tobacco will kill him, and he refuses it, instead
    smoking his own tobacco and later giving the old man a different mixture. The
    Navaho falsely explains the old man's earlier reactions as disease while concealing
    that the earlier tobacco was poisoned. At evening the old man asks him to stay,
    and the daughter prepares a bed of fur robes.
  language: English
  quote_policy: summarized
