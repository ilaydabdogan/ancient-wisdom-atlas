  summary: Editorial notes discuss food taboos, older hunting methods, place and gens
    names, an arrow-case, possible totemism, a notable tree, a winter moccasin guessing
    game with day/night animal myth, older clothing and arts, bow material, cave storehouses,
    adoption of arts from other tribes, an alternate naming account for a gens, and
    a caution about one statement's source.
