canonical_text:
  quote: ''
  summary: The passage describes San Juan lifeways, population dispersal, and successive
    additions of Tha`nezá`ni, Dsiltlá`ni, and Thá`paha groups to the Navaho nation.
    It records signs of strangers, kinship and marriage rules between gentes, transfer
    of practical arts, the marking of farming land, deliberate language unification
    by chiefs, agricultural abundance, cliff storehouses, and a later move.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people living at the San Juan are described as playing named games, lacking
    horses, domestic sheep, and goats, and hunting wild deer or Rocky Mountain sheep
    by several methods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Their clothing, headdresses, blankets, sandals, house curtains, bows, and
    arrows are described as made from local plant, skin, horn, wood, and reed materials.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: As the tribe became too numerous for the San Juan farming bottom-land, some
    people moved to bluffs and cliff storehouses, some gardened below the lower promontory,
    and some crossed the river to farm.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Night fires on a distant eminence north of the river led to spies being sent,
    and the spies reported finding strangers encamped at Tha`nezá`.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The strangers from Tha`nezá` joined the Navahoes as a new gens called Tha`nezá`ni
    and said they descended from the Mirage People.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Five years later the Dsiltlá`ni joined the tribe from Dsiltlá`; the passage
    says no one could tell what gods sent them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Because the Dsiltlá`ni had headdresses, bows, arrows, and arrow-holders similar
    to those of the Tha`nezá`ni, people concluded that the two groups were related.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Tha`nezá`ni and Dsiltlá`ni are described as close friends whose members
    cannot marry one another.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Dsiltlá`ni knew how to make wicker water-bottles, carrying-baskets, and
    earthen pots, and taught these arts to the rest of the people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Thá`paha came from White Valley among the Waters, traveled west toward
    the mountains where the Navahoes lived, later settled near them, exchanged visits,
    intermarried, and became a gens of the Navaho nation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: At Hyíetyin, the Thá`paha chief Góntso had stakes set around a smooth sandy
    plain to mark his people's claim to farming land.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Thá`paha are described as good hunters and skilled makers of weapons and
    beautiful buckskin shirts, and they taught these arts to the other gentes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: The chief of the Tsinadzi'ni and Góntso repeatedly visited one another at
    night to unite the two languages and choose preferred words; the resulting language
    resembled Thá`paha speech more than old Navaho speech.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Thá`paha had abundant crops at Hyíetyin, stored corn in stone cliff storehouses,
    remained there thirteen years, and then moved to Azdeltsígi.
  category: sequence
  evidence_refs:
  - ev:6
