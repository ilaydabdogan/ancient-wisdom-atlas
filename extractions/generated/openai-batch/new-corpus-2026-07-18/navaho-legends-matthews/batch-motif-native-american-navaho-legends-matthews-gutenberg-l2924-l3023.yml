canonical_text:
  quote: ''
  summary: First Man, First Woman, Black Body, and Blue Body build the seven sacred
    mountains of the present Navaho land from earth brought from the fourth world.
    The mountains are fastened, decorated, furnished with summit items or living creatures,
    and given named boy-and-girl dwellers. First Man and First Woman then make the
    sun and moon and assign them to named carriers. The Diné travel east, where a
    woman bears a malformed headless offspring; the people discard it, but it lives
    and becomes the monster Téelget.
  language: English
  quote_policy: summarized
