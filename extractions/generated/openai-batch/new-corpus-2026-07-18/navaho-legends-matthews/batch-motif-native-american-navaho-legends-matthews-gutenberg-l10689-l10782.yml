    their name to the spring.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage proposes that Ho-na-gá`-ni may mean People of the Walking Place
    and that the origin story for the name may be mythical.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage gives etymological explanations for Na-nas-te'-zin, the Navajo
