  summary: Notes discuss variant explanations for Navajo gens names, possible totemic
    interpretation of the Deer Spring People story, several Navajo or Pueblo-related
    place and people-name etymologies, a description of a female yéi/goddess as represented
    in dry-paintings and masquerade, and the uncertain etymology of Nati'nesthani
    as a self-teaching or self-discovering hero.
