canonical_text:
  quote: ''
  summary: Spider Woman shows the Navaho four directional hoops with old feathers
    and asks him to bring new eagle plumes from the coming battle. She identifies
    the Eagles' enemies as bumblebees and tumble-weeds, gives him a black cane, and
    instructs him how to defeat the enemies and collect materials. The Navaho watches
    the Eagles attack and retreat with many slain, then gathers seeds, burns the tumble-weeds,
    stuns and kills bees with tsildilgi'si juice, collects nests, honey, young bees,
    and eagle plumes. He returns the plumes to Spider Woman, then later returns to
    the Eagle towns where mourners say they had thought him dead.
  language: English
  quote_policy: summarized
