canonical_text:
  quote: ''
  summary: Tsóhanoai tests the boys through spikes, a sweat-house, and a smoking ordeal.
    With help from Wind/Ni'ltsi and Wasekede, the boys survive. They ask their father
    for weapons against the devouring anáye. Tsóhanoai gives them war clothing and
    lightning, sunbeam, rainbow, and stone weapons, then leads them to the edge of
    the world, where Wind makes a rainbow bridge and the brothers ascend by red stone
    wands chosen for war.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tsóhanoai unrolls four coverings or robes associated with dawn, blue sky,
    yellow evening light, and darkness, and the boys fall out onto the floor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsóhanoai throws the boys onto spikes of white shell in the east, turquoise
    in the south, haliotis in the west, and black rock in the north; they return unhurt
    while holding their life-feathers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tsóhanoai orders elder children to prepare a sweat-house and four hard boulders
    colored white, blue, yellow, and black.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wind says Tsóhanoai still seeks to kill the boys, digs a hidden hole behind
    the sweat-house, and tells the boys when to use it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tsóhanoai pours water onto the hot stones, producing bursting stones, heat,
    and steam; the boys survive by hiding and later answer him from inside the sweat-house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Tsóhanoai greets the boys as his children after the sweat-house trial, while
    still thinking of other possible ways to destroy them if they are not his children.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The four sky-blankets are spread on the ground, four young men sit on them
    facing east, and Tsóhanoai tells his daughters to make the strangers resemble
    his other sons.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The young women lengthen the strangers' hair and mold their faces and bodies
    so that they look like their brethren.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A spiny caterpillar named Wasekede spits two blue spits on the ground, and
    Wind tells each boy to put one in his mouth without swallowing it for a smoking
    trial.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Tsóhanoai takes a turquoise pipe from the eastern wall, fills it with tobacco,
    lights it from the sun on the wall, and gives it to the boys to smoke; they smoke
    it without being killed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The boys ask their father for weapons to fight anáye, naming Yéitso, Téelget,
    Tse`náhale, Bináye Aháni, and others as beings who devour people and have sought
    their lives.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Tsóhanoai says Yéitso at Tsótsil is also his son, says he will help kill him,
    and gives the boys clothing of pes, lightning arrows, a sunbeam arrow, a rainbow
    arrow, and a stone knife or knife club.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: When the boys put on the clothing of pes, streaks of lightning shoot from
    every joint.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: At the edge of the world, sixteen wands or poles lean from earth to sky, a
    deep stream lies between the party and the wands, Wind makes a rainbow bridge,
    and the brothers cross safely.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:15
  text: Wind identifies the red wands as being for war and the other wands as being
    for peace; the boys choose the red stone wands and ascend to the sky with Tsóhanoai.
  category: sequence
  evidence_refs:
  - ev:7
