  quote: ''
  summary: The author addresses poets and other literary borrowers, allowing that
    they may draw on the volume but requesting that they not distort the material
    or impose alien ideas, objects, clothing, or actions on Indigenous legendary figures.
    He gives an example from a retelling of Stephen Powers's Karok fire story in which
    Coyote is made to stroke a goatee, and he asks that no poet similarly put a beard
    on the Navaho Coyote God.
