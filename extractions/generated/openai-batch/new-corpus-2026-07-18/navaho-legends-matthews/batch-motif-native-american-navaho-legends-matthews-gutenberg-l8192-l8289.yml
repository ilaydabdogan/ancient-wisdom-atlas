canonical_text:
  quote: ''
  summary: A Navaho remains in an eagle nest in a cliff cave after Pueblo people demand
    that he throw down the eaglets. He refuses food, endures persuasion and fire-arrow
    attacks, asks the eaglets for help, and is abandoned to die. At night the male
    and female Eagles arrive, thank and name him, give him food and water from small
    sacred-looking objects, shelter him warmly, and reveal human-like forms beneath
    plume robes. At dawn many birds of prey gather and sing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Pueblo people saw the empty basket swinging, expected the Navaho to return
    to it, and called on him to throw down the little eagles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Navaho sat in the cleft, did not answer the Pueblo people, and did not
    throw down the little eagles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Around the nest in the cleft or cave lay four dead animals: a fawn to the
    east, a hare to the south, a young Rocky Mountain sheep to the west, and a prairie-dog
    to the north.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The eaglets sometimes left the nest to eat the meat, but the Navaho did not
    touch it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Pueblo people returned in a crowd, repeated entreaties and promises, used
    endearing terms, and displayed tempting food, but the Navaho did not heed or speak
    to them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the third and fourth days the Pueblo people came in anger, shot fire-arrows
    at the eyry or cave, and tried to burn out the Navaho or force him to throw down
    the nest and eaglets.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: When fire-arrows entered the cave, the Navaho seized them quickly and threw
    them out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Navaho asked the birds whether they could help him; the eaglets rose,
    shook their wings, and threw many little feathers down onto the people below.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Pueblo people said they would leave the Navaho where he was to die of
    hunger and thirst; by then he had been in the cave three nights and nearly four
    days.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After dark a rushing sound came and went four times, and then the male Eagle
    landed on the eyry; after repeated sounds the female Eagle also alighted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Eagles greeted the Navaho as their child, thanked him for not throwing
    down their younger brother, addressed him by the name Donikí, and later named
    him Kinníki after the chief of all Eagles in the sky.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Navaho told the Eagles only that he was hungry and thirsty.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The male Eagle brought out a small white cotton cloth with corn meal, a small
    white shell bowl, and a jointed plant filled with water; he gave the Navaho meal
    mixed with water and then water to drink.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The contents of the shell bowl were not diminished while the Navaho ate, but
    the Eagle emptied the vessel with one sweep of his finger after it was returned.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: The great Eagles slept one on each side of the Navaho, and he felt warm.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Before sleeping, each Eagle took off a robe of plumes and revealed a form
    like that of a human being; at dawn they put on their robes of plumage again.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:17
  text: At dawn many Eagles, Hawks, and other large birds of prey gathered near the
    cave and sang.
  category: action
  evidence_refs:
  - ev:9
