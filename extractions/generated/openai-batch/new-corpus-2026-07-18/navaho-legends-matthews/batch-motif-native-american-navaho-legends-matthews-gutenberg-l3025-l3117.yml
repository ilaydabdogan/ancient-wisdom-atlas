canonical_text:
  quote: ''
  summary: 'The passage recounts stages of early migration after emergence: several
    malformed beings are born, abandoned, and later become destructive monsters; the
    people settle repeatedly for thirteen years at named places while monsters begin
    to devour them; animals, birds, and snakes are described as people who became
    cliff-dwellers; and at Kintyél a heaven-descended gambling-god named Nohoílpi
    wins property and persons, enslaving losers to build the great house.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Tse`taiská, a misshapen creature with feather-like features on both shoulders
    is born, cast onto an alkali bed, survives, grows, and becomes Tse`na'hale.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Tse`bináhotyel, a headless pointed creature is placed in a cliff hole sealed
    with a stone, left to die, but grows into Tse`tahotsiltá`li; its hair grows into
    the rock.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Tse`ahalzi'ni, twins are born without visible limbs or heads, with eye-like
    depressions; they are abandoned, enter a natural hut-like rock, grow up, and become
    Bináye Aháni, who kill with their eyes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that these monsters resulted from women’s transgressions
    in the fourth world, and that other monsters came from births on the march and
    from blood shed during the first monster births.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The migrating people remain for thirteen years at To`intsósoko, farm corn,
    beans, and pumpkins, then remain for thirteen years each at Tse`lakaíia and Tse`pahalkaí;
    during this period monsters begin to devour people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Four-footed beasts, birds, and snakes are described as people who built houses
    near the human people and became cliff-dwellers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Kintyél, the Pueblos are building a great house because Nohoílpi, a divine
    gambler descended from the heavens, has won property, women, children, and men
    from them and has promised partial return in payment for building.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Groups from Ki'ndotliz repeatedly wager their own persons after four-day notices
    and lose their liberty to Nohoílpi; later victims also lose valuables, and enslaved
    labor completes Kintyél.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Kintyél is identified as Broad House in Chaco Canyon, where ruins of a great
    pueblo are said still to stand.
  category: setting
  evidence_refs:
  - ev:7
