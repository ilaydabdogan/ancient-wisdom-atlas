literal_observations:
- id: obs:1
  text: The note states that adultery punishments among many Indian tribes were formerly
    severe, while among the Navahoes the author knew of no contemporary punishment
    more severe than a rarely given light whipping.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The legend is said to imply that in the days of Góntso a husband who was a
    powerful chief did not punish his wives until he had consent from their relatives.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: For nine-day ceremonies, the Navahoes are described as building temporary
    medicine-lodges, usually for one occasion only, with no fixed lunar date for beginning
    a great ceremony.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A tradition is reported that when the Navahoes lived in a compact settlement
    on the San Juan River they had permanent medicine-lodges and exact dates for some
    ceremonies.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Mountain Chant is described as an important nine-day healing ceremony
    whose rites, until the last night, are held secretly in the medicine-lodge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After sunset on the last day, a large round corral or circle of evergreen
    branches called ilnásdzin, the dark circle of branches, is constructed with an
    eastern opening.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: From about eight at night until dawn, dances, dramatic shows, medicine rites,
    and legerdemain are performed in the corral before a large group of spectators,
    with no one refused admission.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the nahikáï performance, actors move close to a great central fire while
    heavily daubed with white earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Each actor carries a wand tipped with an eagle-down ball, burns off the ball
    in the fire, appears to restore it by sleight of hand, and then rushes out trumpeting
    like a sand-hill crane.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The name Tse`-zin-di-aí is glossed as Black Rock Standing and is said to refer
    to a locality with a trap-dyke formation.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The word translated as pet, lin, is said also to mean a domestic animal and
