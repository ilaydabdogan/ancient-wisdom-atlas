canonical_text:
  quote: ''
  summary: After earlier ascent attempts, the travelers are directed by Red Wind to
    a western, wind-made passage and fly upward into the fourth world with four colored
    grasshoppers. The fourth world is dark, without sun, moon, or stars, and has four
    snow-covered peaks at the cardinal horizons. Scouts explore in four directions;
    those sent north find the Kisáni, who are settled agricultural people living in
    ground houses. The Kisáni guide the travelers across a red stream on a four-log
    raft, feed them corn and pumpkins, and the travelers resolve to behave well. Later
    four colored divine beings arrive after four calls; after several days of signs,
    Black Body explains that the gods intend to make more people in their own form
    and instructs the people to cleanse themselves before the gods return. On the
    twelfth day the people wash, dry themselves with corn-meal, and the gods appear
    carrying sacred buckskins and ears of corn.
  language: English
  quote_policy: summarized
