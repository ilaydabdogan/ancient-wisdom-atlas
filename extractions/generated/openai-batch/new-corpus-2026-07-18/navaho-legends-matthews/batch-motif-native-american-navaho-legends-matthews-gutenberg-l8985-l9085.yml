  summary: Notes discuss Navaho directional color systems, compass order, sunwise
    movement, the sacred number four, variant details of the Origin Legend, lower-world
    color symbolism, a possible comparison with Moki symbolism, a deluge-and-reed
    flight between worlds, and the fourfold calls by which yéi announce their approach.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two directional color systems are described as the same except that black
    and white change places; the note associates one generally with overground lucky
    places and the other with underground dangerous places, while also noting exceptions.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The order for naming compass points or arranging objects that symbolize them
    is east first, south second, west third, north fourth; the sunwise circuit is
    said to be always followed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When zenith and nadir are included, zenith is fifth and nadir sixth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The north may be symbolized by all colors mixed or by red.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The note says only three streams and nine villages or localities are mentioned
    although twelve winged tribes are named.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that references to the sacred number four are introduced
    throughout Navaho legends.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Version B, First Man, First Woman, and Coyote dwell in the first world.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The lower worlds in this legend are assigned red, blue, yellow, and mixed
    colors in sequence.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Version B, First Man, First Woman, and Coyote ascend to the second world
    and encounter later carriers of the sun and moon as well as beings of darkness,
    blueness, yellowness, and whiteness at the directions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Sun and First Woman are named as transgressors who caused an exodus.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In Version B, the people of the mountains are already occupying the third
    world when the named beings arrive from the second world.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: In Version B, people are chased from the third world to the fourth world by
    a deluge and take refuge in a reed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: When yéi come to visit people, they announce themselves by four calls that
