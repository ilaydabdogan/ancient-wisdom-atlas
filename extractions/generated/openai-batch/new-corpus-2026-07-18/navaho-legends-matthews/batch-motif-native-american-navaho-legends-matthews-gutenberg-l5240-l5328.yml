canonical_text:
  quote: ''
  summary: After a destructive storm threatens the mountain lodge, Nayénezgani protects
    the house and its people with cloud and fog coverings fastened by rainbow, sunbeam,
    and lightning powers. The storm reshapes the land. Wind then tells Nayénezgani
    that Old Age, Cold Woman, and Poverty still live. Nayénezgani seeks Old Age and
    Cold Woman, intending to kill them, but spares each after she explains her necessity
    for human continuity or environmental balance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After intervals marked by four days, thunder is heard, a great white cloud
    descends, and whirlwinds uproot trees and toss rocks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Estsánatlehi fears that the winds may destroy the house because it is high
    among the mountains.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nayénezgani covers the house with layers of black cloud and black fog, fastening
    them with rainbows, sunbeams, sheet-lightning, and chain-lightning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For four days and four nights there is darkness, wind, hail, and sharp stones
    carried in the air, while the people remain safe inside the lodge.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the fifth day Nayénezgani removes the lodge coverings upward, and lightning,
    sunbeams, and rainbows appear from them; later rain settles the dust.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the storm, the people see a newly formed canyon, changed bluffs, and
    isolated rock pillars shaped by the winds.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Estsánatlehi says the storm must have destroyed the anáye, but Ni'ltsi whispers
    that Old Age still lives and later gives Old Age's dwelling place when Estsánatlehi
    does not answer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Nayénezgani finds Old Age as an old woman with a staff, bent back, white hair,
    and wrinkled face; he says he has come to kill her, but spares her after she says
    aging and death allow people to increase and make room for the young.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: Ni'ltsi tells Nayénezgani that Cold Woman still lives on the snow-covered
    summits of Depe'ntsa after Estsánatlehi does not answer his question.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Nayénezgani finds Cold Woman sitting on bare snow without clothing, food,
    fire, or shelter, surrounded by snow-buntings that serve as her storm couriers;
    he spares her after she says killing her would bring constant heat, drought, failed
    springs, and death for the people.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: Wind later tells Nayénezgani that Poverty still lives and says there are two
    who dwell at Dsildasdzi'ni, after Estsánatlehi again does not answer.
  category: speech
  evidence_refs:
  - ev:12
