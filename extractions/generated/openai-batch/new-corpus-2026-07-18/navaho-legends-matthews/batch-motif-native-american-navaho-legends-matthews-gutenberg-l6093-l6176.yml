canonical_text:
  quote: ''
  summary: Estsánatlehi, lonely in her western home, creates groups of people from
    epidermis taken from parts of her body; their descendants later receive gens names.
    She brings them to the mainland, where they multiply. The remaining Diné` Nakidáta
    visit and speak of eastern kin; Estsánatlehi restores their number with two people
    made of turquoise and offers treasures if the people stay. The people decide to
    depart eastward. Before they leave, she gives them five animal guardians and five
    protective magic wands. On the journey they see human beings moving on a treeless
    plain and camp under cover.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Estsánatlehi feels lonely in her western home because she has no companions
    there.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: After one of her dancing journeys, Estsánatlehi sits on the eastern mountain
    and uses epidermis rubbed from parts of her body to make people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Six groups of four people are created from epidermis taken from under her
    arms, under her breasts, the middle of her chest, and her back between her shoulders.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The created groups become ancestors of gentes later named Honagá`ni, Kinaá`ni,
    To`ditsíni, Bitáni, Hasli'zni, and Bitá`ni.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Estsánatlehi tells the created people they may live near her or go east, then
    takes them from her floating home to the mainland, where they live, marry, and
    have many children for thirty years.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Diné` Nakidáta, reduced from twelve to ten after losing a sister and younger
    brother, come among Estsánatlehi's people and speak about kindred in the far east.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: All cross on a rainbow bridge to Estsánatlehi's house on the sea; she makes
    two people from turquoise to complete the Diné` Nakidáta's original number of
    twelve and opens four doors to treasure rooms.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The camp discusses the eastern people for twelve days, decides to depart,
    and fixes the fourteenth day after that as the departure date.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'Before the departure, Estsánatlehi gives the travelers five pets: a bear,
    a great snake, a deer, a porcupine, and a puma; she warns them not to speak of
    evil deeds before the bear or snake.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Estsánatlehi gives five magic wands of turquoise, white shell, haliotis shell,
    black stone, and red stone to groups later associated with named gentes, saying
    these are for protection and that she will watch over them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the twelfth day of the journey, the travelers cross a high ridge, see a
    great treeless plain with dark moving objects, determine the objects are human
    beings, and camp in the woods under cover.
  category: sequence
  evidence_refs:
  - ev:7
