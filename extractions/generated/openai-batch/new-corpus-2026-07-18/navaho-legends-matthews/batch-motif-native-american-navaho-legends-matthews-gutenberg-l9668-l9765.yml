literal_observations:
- id: obs:1
  text: 'The Navaho game nánzoz is described as much the same as Mandan chungkee:
    a hoop is rolled along the ground and long poles are thrown after it; the Navaho
    pole is made of two overlapping alder pieces bound by a branching hide strap.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shells mentioned in the surrounding notes are said to be possibly non-mythical
    and possibly the same as those in the story of “The Great Shell of Kintyél.”
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Descriptions of Békotsidi are vague; he is not represented by masked ceremonial
    characters or dry-painting pictures, and his recorded appearance is only that
    he looks like an old man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person wanting a fine horse may sing the second and third songs connected
    with the Békotsidi myth and pray to Békotsidi, specifying the desired horse’s
    color and appearance.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Accounts vary about Békotsidi: some say he made all animals not otherwise
    accounted for; others say he and the Sun made animals together; others limit him
    to larger game animals and modern domestic animals; one passage names him as moon-carrier
    while another names Kléhanoai.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bayeta is identified as Spanish baize, usually crimson with a long nap, used
    in trade and formerly used for bright red figures in finer Navaho blankets.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The coyote is described as a standard of comparison among wild Canidae in
    Navaho terminology: mai means coyote, maítso means great coyote or great wolf,
    and maidotli''z means blue or gray coyote or kit fox.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some versions give the divine family as twelve brothers and one sister; this
    version explains another brother created by Estsánatlehi to replace Léyaneyani
    after he left. The Twelve People are described as divinities who once died, came
    to life again, are now immortal, and have superhuman powers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Navaho sweat-house is usually low; heat is produced by stones heated in
    an outside fire and placed on the floor, not by pouring water on stones; after
    a non-ceremonial sweat the person rolls in sand, while a ceremonial sweat is usually
    followed by yucca-suds bathing and drying with corn meal.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In one version, Coyote has eaten only bugs and worms while Yélapahi has eaten
    fat venison; after inducing emesis, Coyote swaps their bark dishes, tells Yélapahi
    the bugs and worms caused his sickness, then eats the contents of the other dish.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The word tóhe is shouted in an authoritative tone in rites when an object
    is intended to obey the conjurer’s will, such as when a standing arc is commanded
    to stand on a performer’s head.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The hair of friendly and alien gods is described as yellow in tales; ceremonial
    masks use reddish or yellowish hair, dry-pictures represent divine hair by red,
    and dull red tints are often called yellow by Navahoes.
  category: attribute
  evidence_refs:
  - ev:10
