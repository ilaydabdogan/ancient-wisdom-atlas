  summary: Notes 76-85 give ethnographic and mythological commentary on the Navaho
    hoop-and-pole game nánzoz, possibly non-mythical shells, variant accounts of Békotsidi,
    bayeta cloth, coyote terminology, the Twelve People as immortal divinities, sweat-house
