canonical_text:
  quote: ''
  summary: Notes on variants of the War Gods narrative describe earth-sky poles used
    to explain the sun's seasonal course; variants of the Sun or sun-bearer's ascent
    with sons or an animal; food of pollen and water at the sky-hole; named springs,
    lakes, hills, and mountains; alternate origins of monsters; details about Yéitso
    and other giants; the naming of the two brother gods; and landscape identifications
    of volcanic hills as giant heads.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note reports either sixteen poles or thirty-two poles on each side, east
    and west, joining earth and sky.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The annual progress of the sun is explained as movement from the southernmost
    rising pole at winter solstice northward to the northernmost pole at summer solstice,
    then back southward, with roughly equal time at each pole.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some versions say the bearer of the sun rode a domesticated or pet animal;
    Version A describes a turquoise animal larger than a horse and makes the sky dip
    down to earth so it can ascend.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Version B says the Sun put on a robe of cloud, took one son under each arm,
    and rose into the heavens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At or during the journey to the sky-hole, a meal is described; Version A specifies
    five kinds of pollen mixed with all kinds of water.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Warm Spring is located at San Rafael, New Mexico, with a nearby lake and with
    distances given relative to Mount Taylor.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: One version says the monsters or anáye were conceived in the fifth world and
    born of one woman, a granddaughter of First Woman; another says First Woman sent
    the monsters after becoming offended with man.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Version A names additional hills over which Yéitso appeared, giving eastern,
    southern, and western hills in addition to Tsótsil.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The expression Yiniketóko is reported as having no discovered etymology and
    as being believed equivalent to a giant formula in nursery tales.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The note reports that a bolt rent Yéitso's armor in Version B and that other
    versions commonly show dead demons becoming useful to humans in other forms.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The author states as conjecture that Yéitso's armor may have furnished flint
    flakes for knives and arrowheads, while noting that the narrator omitted this
    detail.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The brothers' names are said in other versions to have been given after their
    return home and a ceremony of rejoicing for their first victory.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Nayénezgani is etymologically explained as Slayer of the Alien Gods or Slayer
    of Giants.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: To`-ba-dzis-tsí-ni is etymologically explained literally as Born for the Water
    and freely as Child of the Water; Naídikisi is given as a rarely used second name.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: El Cabezon, a dark high volcanic hill, is identified by Navajo story-tellers
    as the head of Yéitso; other nearby volcanic peaks are identified as heads of
    other giants slain in a storm raised by the War Gods.
  category: setting
  evidence_refs:
  - ev:10
