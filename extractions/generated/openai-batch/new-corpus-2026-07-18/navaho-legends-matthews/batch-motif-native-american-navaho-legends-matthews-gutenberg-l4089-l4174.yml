canonical_text:
  quote: ''
  summary: After monsters have nearly destroyed the Diné, four survivors find a turquoise
    image of a woman and are summoned by Hastséyalti to Tsolíhi. At a mountain assembly,
    sacred objects are arranged under buckskins, a song is sung, and images and corn
    ears become living beings, including Estsánatlehi and Yolkaí Estsán. The two sisters
    remain on the mountain, seek contact with the sun and dripping water, and later
    become pregnant; Hastséyalti and Tó`nenili appear to prepare them for delivery.
  language: English
  quote_policy: summarized
