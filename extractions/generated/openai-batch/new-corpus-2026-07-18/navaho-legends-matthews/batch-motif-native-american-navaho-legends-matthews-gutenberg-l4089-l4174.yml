  text: The Diné moved to Tse`lakaíia and found and preserved a small turquoise image
    of a woman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Monsters described as anáye had been pursuing and devouring the people until
    only four persons remained alive: an old man, an old woman, a young man, and a
    young woman.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hastséyalti’s voice was heard four times, each time nearer and louder, before
    he stood before the four people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hastséyalti told the four people to come to the top of Tsolíhi after twelve
    nights, bringing the turquoise image.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the appointed morning, the four ascended Tsolíhi by a holy trail and found
    a waiting assembly of named divine beings and people groups.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: White Body stood in the east among the Daylight People and held a small white-shell
