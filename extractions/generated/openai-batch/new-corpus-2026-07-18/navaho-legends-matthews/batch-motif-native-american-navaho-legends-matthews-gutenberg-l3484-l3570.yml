canonical_text:
  quote: ''
  summary: Coyote returns to hunters with gum eyes that soften near the fire. After
    the hunters learn he is the trickster Coyote, they use Tsiké Nazi'li's rattling
    dress, carried by Chicken-hawk, to lure him over a canyon. He revives because
    his vital principle is kept in his nose-tip and tail-end. He then seeks service
    with Yélapahi, the Brown Giant, visits a beautiful maiden who requires a suitor
    to have killed an anáye, finds a large thigh-bone, and helps prepare a sweat-house
    with fire, hot stones, leaves, and four colored sky blankets.
  language: English
  quote_policy: summarized
