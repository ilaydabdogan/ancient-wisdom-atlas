canonical_text:
  quote: ''
  summary: Coyote is received as a fine-looking stranger who may be divine and useful
    to the hunters. After learning about neighboring people whom his hosts did not
    want him to visit, he helps in hunts by tying a burning cedar-bark bundle to his
    tail and driving antelope with fire. He then leaves, encounters birds in spruce
    and pine trees playing a game of removing and tossing their eyes, insists on joining
    despite refusals, succeeds four times, loses his original eyes on the fifth attempt,
    and receives yellow pine-gum substitute eyes, explaining why coyotes have yellow
    eyes.
  language: English
  quote_policy: summarized
