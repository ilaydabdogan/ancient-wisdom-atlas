- id: obs:4
  text: The younger maiden returns to serve Coyote; her bone and hoof ornaments rattle,
    and Coyote names her Tsiké Nazi'li, Young Woman Who Rattles.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The people tell the young woman not to tell Coyote about certain bad neighbors,
