canonical_text:
  quote: ''
  summary: 'The passage describes sources for studying Navajo religion, states that
    the pantheon has no supreme creator deity, and summarizes several deities: the
    limited Sun God, Békotsidi as maker of otherwise unaccounted-for animals, Estsánatlehi
    as a revered rejuvenating female deity associated with fruitful nature and the
    west, Yolkaí Estsán as her younger water-related sister, and Nayénezgani and To`badzistsíni
    as sacred brethren whose missions include destroying alien gods and aiding humans.'
  language: English
  quote_policy: summarized
