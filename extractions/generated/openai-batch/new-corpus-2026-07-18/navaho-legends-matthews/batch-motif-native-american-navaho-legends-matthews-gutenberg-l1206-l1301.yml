- id: motif:2
  label: Egalitarian pantheon without supreme creator
  taxonomy_refs: []
  basis: The passage explicitly says there is no Supreme God, that the gods stand
    largely on a level of equality, and that the Origin Legend lacks an original creation
    or Creator of all.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The claim is the author's analysis of Navajo religion as presented in
    this passage.
- id: motif:3
  label: Limited Sun God rather than omnipotent creator
  taxonomy_refs: []
  basis: The Sun God has some precedence but began as one of the people, is not a
    conspicuous creator, and is not omnipotent.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage confines this description to the version of the Origin Legend
    being discussed.
- id: motif:4
  label: Already-created world with no original creation account
  taxonomy_refs: []
  basis: The Origin Legend is said to begin with an already created world and no Creator
    of all.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The author adds that if the Navajo have a beginning-of-all-things story,
    he has not learned it.
- id: motif:5
