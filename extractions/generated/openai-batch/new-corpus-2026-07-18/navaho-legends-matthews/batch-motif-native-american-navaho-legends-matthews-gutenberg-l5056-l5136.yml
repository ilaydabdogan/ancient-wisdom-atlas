canonical_text:
  quote: ''
  summary: Nayénezgani fights and pursues Tsé`nagahi, the Travelling Stone, from a
    lake into the San Juan River. The stone pleads for mercy and promises to stop
    harming the people and to keep waters flowing; Nayénezgani spares it conditionally.
    After resting and recounting his battles, Nayénezgani and To`badzistsíni consult
    about remaining enemies and return to the house of the Sun, where lightning, Bat,
    Water Sprinkler, Wind, and the Sun are involved in their reception and seating.
  language: English
  quote_policy: summarized
