canonical_text:
  quote: ''
  summary: The passage describes Navaho sacrificial sticks or kethawns, their paired
    male and female forms, accompanying offerings such as feathers, beads, and pollen,
    and strict rules for depositing them. It also describes ceremonial dry-paintings
    made in sand with powdered pigments, under priestly direction, by initiated operators
    following fixed designs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Small sticks are used as sacrifices to the gods; their woods and painted forms
    vary according to deity and occasion.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sticks are usually made in pairs, one male and one female, because every
    deity is said to have a mate who must also be propitiated.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The female stick is commonly marked by a small facet at the tip to represent
    a square goddess mask, while the male stick’s round end represents the round cap-like
    mask of a god.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Feathers, stone or shell beads, and powdered vegetable and mineral substances,
    including pollen, may be sacrificed with the kethawns.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pollen is identified as the most sacred substance employed by Navaho priests.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Kethawns may be placed in tree branches, among rocks, at a cliff base, at
    a tree root, on level ground, or in a few cases thrown away almost at random;
    each method is said to have special symbolism.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Carefully deposited kethawns are placed with tips away from the lodge and
    directed toward particular compass points.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The bearer of a sacrifice goes to the chosen deposit place, returns by turning
    right in a sunwise direction, does not cross the outgoing trail, must not walk
    through an ant-hill, and runs both going and coming.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Ceremonial pictures are described as highly transitory dry-paintings or sand-paintings
    made in rites, usually on sand spread on the floor of the medicine-lodge.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The central fire of the medicine-lodge may be removed to make room for a ceremonial
    picture.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: The pigments used for dry-paintings are white, red, yellow, black, and gray-blue,
    made from sandstone, charcoal, and mixtures of black and white.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Large pictures may require several men working most of the day; the conducting
    priest directs and criticizes while initiated operators paint according to exact
    rules.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: If an error is made in a dry-painting, the faulty part is covered with sand
    and corrected on the new surface rather than erased.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the dry-paintings, the naked forms of mythical characters are drawn first,
    after which clothing and ornaments are added.
  category: sequence
  evidence_refs:
  - ev:6
