canonical_text:
  quote: ''
  summary: The passage describes brothers discovering Coyote hidden in their sister's
    lodge, expelling the couple, Coyote and the woman establishing a separate shelter,
    a night watch that reports the woman's four deaths and resurrections, and a later
    hunt in which Coyote is reluctantly allowed to help drive four mountain sheep
    after a rainbow-bridge crossing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The brothers enter the lodge, ask their sister to boil young venison, and
    describe the lodge as divided between the woman's north-side space and the men's
    south-side sleeping area.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the fire is replenished, a rank animal odor fills the lodge; the brothers
    test the wood, water, and snow, then repeatedly ask their sister about the odor
    while she remains silent.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the question is asked for the fourth time, Coyote jumps from hiding,
    identifies himself as their brother-in-law, and the brothers order both Coyote
    and the sister out of the lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Coyote takes a firebrand, lights a new fire, builds a shelter from boughs,
    and the woman transfers her household goods and property to the new home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An elder brother sends the youngest brother to hide near the couple's shelter
    and watch what happens at night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The woman puts her hand on Coyote's knee four times, and Coyote rejects it
    each time before saying he has sworn not to take a wife until he has killed her
    four times.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrative summarizes four deaths and resurrections of the woman, similar
    to Coyote's earlier deaths and resurrections, and the watcher later reports that
    what he heard and saw was evil.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The next morning Coyote repeatedly asks to join the brothers' hunt; after
    three refusals, the youngest brother supports him on the fourth request and the
    brothers allow him to come.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At a deep canyon, the party makes a bridge of rainbow to cross; Coyote jumps
    from the bridge to the opposite bluff and plays there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At a mesa with a narrow neck, the hunters see tracks of four Rocky Mountain
    sheep, send Coyote in to drive them out, kill all four sheep, and Coyote returns
    and lies down on the sand.
  category: sequence
  evidence_refs:
  - ev:6
