canonical_text:
  quote: ''
  summary: After the brothers defeat Yéitso, they gather trophies, receive or confirm
    warrior names, and stop the dead enemy’s blood from reaching beings who could
    revive him. They return home, prove the victory to their mothers, and celebrate.
    Nayénezgani then asks where Téelget lives, prepares danger-signaling kethawns
    with his younger brother, and departs alone. He meets Nasi'zi the Gopher, who
    offers underground help in exchange for Téelget’s hide and digs tunnels beneath
    the monster.
  language: English
  quote_policy: summarized
