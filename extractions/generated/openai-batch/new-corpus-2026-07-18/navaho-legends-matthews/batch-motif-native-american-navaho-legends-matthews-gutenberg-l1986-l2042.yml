  quote: ''
  summary: The passage explains the author's choice to replace the Bureau of Ethnology
    alphabet with a simplified spelling system for a wider readership. It describes
    values for Roman and italic consonants, vowels, diphthongs, and aspiration marks;
    says the system should make Indian words legible and approximately pronounceable;
    gives the word hogán as an example; and lists the values of italic consonants
    and unused letters.
  language: English
