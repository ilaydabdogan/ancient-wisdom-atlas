canonical_text:
  quote: ''
  summary: The hero takes trophies from defeated beings, seeks the Bináye Aháni who
    kill with their eyes, blinds and kills them with salt thrown into fire, and transforms
    two spared young ones into useful birds. Estsánatlehi receives the trophies with
    a restoration song. The hero then finds and kills Sasnalkáhi, Bear that Pursues,
    transforms the bear's head into useful plants, returns with a paw trophy, and
    sets out to seek Travelling Stone despite another warning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hero found that only bones and scalp remained of a previous foe's corpse
    and cut a piece of hair from one side of the head as a trophy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hero asked his mother where the Bináye Aháni lived; she warned him against
    further risk but named Tse`ahalzi'ni, Rock with Black Hole.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rock with Black Hole is described as having a side hole like a door and a
    top hole like a smoke-hole.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hero took a bag of salt, entered the rock house, and sat on the north
    side while the old couple of the Bináye Aháni and many children sat in other parts
    of the lodge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Bináye Aháni stared with great eyes, and flashes of lightning from their
    eyes glanced harmlessly off the hero's armor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The hero threw salt into the central fire; the spluttering salt struck and
    blinded the Bináye Aháni, and he killed all except the two youngest with his stone
    knife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The hero told the two spared young ones that he would make them useful to
    people, changing the elder into Tsidiltói and the younger into Hostódi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the hero returned with eye trophies, Estsánatlehi danced and sang a song
    naming several trophies and repeating that the people are restored.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The hero asked where to find Sasnalkáhi, Bear that Pursues; Estsánatlehi named
    Rock that Frightens and again warned him not to go.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Rock that Frightens, the hero found a bear den shaped like a cross with
    four entrances and cut off the bear's head when it looked out.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The hero spoke to the bear's head, cut it into three pieces, threw the pieces
    in three directions, and they became yucca and mescal plants; he took the left
    forepaw as a trophy.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: After returning with the bear trophy, the hero asked where to find Travelling
    Stone; Estsánatlehi named a lake near Tsé`espai, warned him not to go near it,
    and he went anyway.
  category: sequence
  evidence_refs:
  - ev:10
