canonical_text:
  quote: ''
  summary: Nati'nesthani misdelivers Deer Raiser's message, receives a warning not
    to go east, deliberately travels east, meets a deer-masked being who gives instructions
    for a cigarette offering, reaches tents and a southern lodge, and hears from the
    lodge owner that Deer Raiser kills his guests and suitors. Nati'nesthani says
    he has killed Deer Raiser with smoke four times and revived him four times.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before departing, the young man's father-in-law tells him to send the daughter
    with moccasins and food; the young man instead reports that the father-in-law
    wants his wife to come, and the old woman goes with moccasins, food, and a burning
    cedar-bark brand.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Deer Raiser becomes angry that the old woman came instead of his daughter,
    says his son-in-law cannot remember messages, then eats, puts on moccasins, and
    returns home with his wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Deer Raiser warns Nati'nesthani never to stray alone east of the lodge because
    there is a dangerous place there; Nati'nesthani decides during the night to do
    what he was told not to do.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nati'nesthani dresses for a journey, travels straight east, climbs a steep
    white ridge, and encounters a low-stature man identified as one of the Tsidastóidine`.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Tsidastóidine` man wears deer-associated clothing and a deer-mask, carries
    a turquoise wand, a black sinew-backed bow, and two eagle-feathered arrows, and
    speaks to Nati'nesthani as grandchild.
  category: attribute
  evidence_refs:
  - ev:4
