canonical_text:
  quote: ''
  summary: Nayénezgani survives being dropped on a ledge by a monster bird, deceives
    the monster young, learns where the parents will return, and kills the male and
    female Tse`na'hale with lightning arrows. He then transforms their young into
    an eagle and an owl for future human use. Unable to descend from the cliff, he
    bargains with Bat Woman, who carries him down in a basket under a prohibition
    against watching how she ascends or descends; he repeatedly disobeys and they
    fall near the bottom unhurt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tsé`bitaï has a broad, level ledge where the monster reared his young and
    dropped victims.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nayénezgani survives a fall that had killed others because he still has the
    life-feather given by Spider Woman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nayénezgani opens a bag of bowel and spreads the blood of Téelget on the rock
    so the anáye will think he is dead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The young approach to devour Nayénezgani, but stop when he says “Sh”; their
    father tells them the sound is only air escaping from the body.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The young say their father will return with a he-rain to a point on the right
    and their mother will return with a she-rain to a crag on the left.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Rain, thunder, and lightning accompany the male Tse`na'hale’s return, and
    Nayénezgani kills him with a lightning arrow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Rain without thunder or lightning precedes the female Tse`na'hale’s return;
    the body of a Pueblo woman falls on the ledge, and Nayénezgani kills the female
    with another lightning arrow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that the female Tse`na'hale preyed only on women and the
    male only on men.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Nayénezgani tells the young that if they had grown up they would have been
    evil and would have destroyed his people, but he will make them useful in the
    future.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The elder young is swung four times, changes into an eagle, and is assigned
    future use as a source of plumes for rites and bones for whistles.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The younger young is transformed into an owl whose voice will sometimes tell
    the truth and sometimes lie about the future, and its home is set in a cliff hole.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After completing his work at Tsé`bitaï, Nayénezgani finds that only a winged
    creature can reach or leave the ledge.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: Bat Woman initially hides and refuses Nayénezgani’s requests, but approaches
    after he offers her the feathers of the Tse`na'hale.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Bat Woman carries a large basket on strings as thin as spider web, and she
    demonstrates its strength by carrying stones while dancing.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: Bat Woman tells Nayénezgani to keep his eyes shut during ascent and descent;
    when he opens them during the descent, the descent becomes dangerously rapid,
    but after repeated disobedience both reach the ground unhurt.
  category: sequence
  evidence_refs:
  - ev:10
