canonical_text:
  quote: ''
  summary: The passage gives ethnographic notes on the pésdolgas serrate knife, the
    White House cliff-ruin in Chelly Canyon and its legendary association with divinities,
    and the ceremonial description of Hát-das-tsi-si, including the masked actor,
    yucca objects, whipping treatment of ailments, a black ritual cigarette, songs,
    prayer, yucca collection rules, and the divinity's principal home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pésdolgas is translated as a serrate knife; it is often mentioned in song
    and story, is said no longer to be used, and is described as somewhat like a many-bladed
    obsidian weapon of the ancient Mexicans.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The White House cliff-ruin is in Chelly Canyon, Arizona, and its Navajo name
    Kin-i-na-é-kai is glossed as Stone House of the White Horizontal Streak, referring
    to the white-painted upper story.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Navajo legends are said to abound in references to the White House and to
    represent it as once inhabited by divinities.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hát-das-tsi-si is identified as a divinity not depicted in dry-paintings;
    he appears rarely in ceremonies.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The actor representing Hát-das-tsi-si wears ordinary Navajo costume and a
