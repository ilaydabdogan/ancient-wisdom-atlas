canonical_text:
  quote: ''
  summary: 'The passage recounts several successive incorporations of new gentes or
    bands into the Navaho people: the Dsilnaoti''lni from a sacred mountain, the Yucca
    People who had long sought them and recognized kinship through matching arrow-holders,
    the Nahopáni attracted by many campfires at Kintyél, and a later band from Tsi''nadzin
    whose chief was Nabiniltáhi. It also describes settlement by the San Juan River
    at a place named for a white tree sweeping the water, and notes a change in language
    over time.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After fourteen years at Tsa`olgáhasze, the existing people were joined by
    people from the sacred mountain Dsilnáotil, called Dsilnaoti'lni or Dsilnaoti'ldine`.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Dsilnaoti'lni were regarded as diné` digíni, or holy people, because they
    had no tradition of recent creation and were supposed to have escaped alien gods
    through miraculous protection.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Dsilnaoti'lni first lived apart from the older settlers, borrowed pots
    and metates, and later joined with them as one people and close relations.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Dsilnaoti'lni dug among old ruins, found pots and stone axes, and used
    the axes to build huts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Seven years later, the Yucca People joined the Navahoes after seeking the
    Dsilnaoti'lni across the land and encountering traces such as old camps, shelters,
    and footprints.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Yucca People and the Dsilnaoti'lni carried similar red arrow-holders,
    which led them to believe they were related.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Fourteen years after the fourth gens joined, the Navahoes moved to Kintyél
    in Chaco Canyon, then a ruin, and their many night fires attracted strangers from
    a distant mountain.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The strangers from Nahopá were also called holy people and joined the tribe
    as the Nahopáni, camping near the Haskánhatso and Dsilnaoti'lni.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the fifth gens was received, the whole tribe moved to the San Juan River
    and settled at Tsintó`betlo, a place marked by a peculiar white tree whose branches
    swept the water.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Tsintó`betlo the people built warm winter huts and prepared bottom-land
    soil for spring gardens.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage states that the Navaho language of those days was not the same
