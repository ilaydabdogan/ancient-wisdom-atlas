canonical_text:
  quote: ''
  summary: Nayénezgani spares an old couple and the Hunger People after they explain
    their future value to human life. He concludes that the hostile anáye are dead,
    removes his armor and weapons, and sings. A voice from the east announces Tsóhanoai,
    who arrives, questions his elder son, arranges for the great enemy bodies to be
    hidden near Yéitso, and takes the trophies and armor back to his house in the
    east for safekeeping.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Dsildasdzi'ni, Nayénezgani finds an old man and old woman who are filthy,
    dressed in tattered garments, and without goods in their house.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nayénezgani tells the old couple he has come to kill them; they ask to live
    and say that, if they live, clothing will wear out and people will make new garments
    and gather goods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nayénezgani spares the old couple and returns home without a trophy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Tlóhadaskaí, White Spot of Grass, Nayénezgani finds twelve Hunger People;
    their chief is described as big and fat although he eats only little brown cactus.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nayénezgani says he intends to be cruel so that people will no longer suffer
    or die from hunger; the Hunger chief asks not to be killed and says hunger enables
    interest in food, cooking, eating, and hunting.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Nayénezgani spares the Hunger People and returns home without a trophy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After Nayénezgani returns from Hunger, Ni'ltsi no longer tells him of living
    enemies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Nayénezgani tells his mother he thinks the anáye are all dead because those
    he now meets address him as a relation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Nayénezgani removes his armor, including knife, moccasins, leggings, shirt,
    and cap, places it with weapons given by the Sun, and sings over them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The song names houses made of dark stone knives, serrate knives, all kinds
    of knives, and yellow knives, and says the treasures belong to a holy one, not
    to the singer.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: A loud voice is heard from the far east singing a related song of arrival
    with Slayer of the Alien Gods and other named beings or titles, from houses of
    knives, with an implement of sacred rites.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Estsánatlehi tells the youths to put on their usual clothes because Tsóhanoai
    is coming, and she leaves the lodge so she will not hear them talk about the anáye.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Tsóhanoai greets his children, sits down, and asks the elder brother whether
    he has slain all the anáye and brought home trophies.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The elder son says he has killed all that should die and has brought wing-feathers,
