canonical_text:
  quote: ''
  summary: Nati'nesthani and his turkey find a flat with running water that he wants
    to farm. The turkey performs directional movements, then provides corn and other
    crop seeds from its wings. Nati'nesthani plants the seeds in an ordered directional
    pattern, surveys the surrounding valley for other claimants, observes crop growth,
    and later investigates a recurring nighttime gleam or fire on an eastern mountain,
    using a forked stick to sight it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nati'nesthani and his turkey go to hunt wood-rats and come to a flat with
    a stream; he says it would be a good farm if he had seeds.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The turkey moves around the flat, the man walks around its edge, and then
    they walk together four times around the flat while approaching the center.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the center of the flat, the man sits down while the turkey gambols around
    him; he again speaks of wanting seeds, and the turkey gobbles and spreads its
    wings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nati'nesthani thinks the gods may have done something to the turkey while
    preparing a log for him, and he asks the turkey whether it can help him make a
    farm.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The turkey shakes four grains each of white, blue, yellow, and variegated
    corn from its wings at the east, south, west, and north respectively.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The turkey then comes from the east and shakes its wings four times, producing
    pumpkin seeds, watermelon seeds, muskmelon seeds, and beans.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nati'nesthani thanks the turkey after the seeds are produced.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Nati'nesthani makes two planting sticks, one of greasewood and one of tsintli'zi,
    and plants corn in four holes at each cardinal direction according to color.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: He plants pumpkin, watermelon, muskmelon, and bean seeds between the directional
    corn plantings, alternating the two planting sticks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After checking the farm, he camps to the west among the foothills.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Feeling uneasy about possible claimants, he walks sunwise around the valley
    for four days, widening the circle each day, and sees no people or signs of human
    life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: On the fourth morning, he sees that the corn has grown half a finger-length
    above the ground.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: At night he sees a faint gleam halfway up the eastern mountainside, though
