canonical_text:
  quote: ''
  summary: 'Paragraphs 260-265 recount episodes involving Coyote after a hunt: a dispute
    over Rocky Mountain sheep horns and their hardening; hunters compressing meat
    into a bundle and warning Coyote not to open it or enter a canyon; Coyote disobeying,
    losing part of the meat, and entering the canyon; Coyote joining dangerous games
    with birds and Otters; the stripping and replacement of Coyote''s fur; and Coyote
    taunting the Otters, who seek aid from Spider chiefs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Rocky Mountain sheep horns were once flat, fleshy, and edible,
    but became hard when Coyote repeatedly cried for them to turn to bone while the
    eldest brother tried to cut one.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eldest brother and Coyote each repeatedly claim the horns; the eldest
    brother begins cutting a horn with a knife, and the horn hardens so that the knife
    hacks it but does not sever it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hunters gather the meat, use mystic power to reduce it to a small bundle,
    give it to Coyote, and instruct him not to pass through the canyon and not to
    open the bundle until he gets home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Coyote opens the bundle after leaving his companions; the meat expands into
    a large heap, and he leaves portions in trees, bushes, rock crevices, and on the
    ground while carrying only a new smaller bundle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the canyon, birds roll stones down a slope while standing on them; Coyote
    joins and descends safely three times, but on the fourth request the birds hurl
    the stone forcefully and he tumbles down with it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Otters play the Navaho game nánzoz by a stream and wager their skins; when
    an Otter loses a skin, it jumps into the water and comes out with a new skin.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Coyote wagers and loses his skin; the Otters tear off his hide, and his attempts
    to recover it by jumping into the water fail.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the Otters place Coyote in a badger hole and cover him with earth, he
    digs out covered with coarse, rough hair rather than his former smooth fur.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Coyote continues to challenge and insult the Otters; the Otters decide they
    need help and send word to the chiefs of the Spiders farther down the stream.
  category: sequence
  evidence_refs:
  - ev:6
