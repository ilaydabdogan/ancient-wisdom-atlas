canonical_text:
  quote: ''
  summary: After a water passage, Tsal the Frog explains water-caused illness and
    color-specific sacred cigarettes used to remove it. The gods return Nati'nesthani
    to a hollow log, send it down the San Juan River, and aquatic helpers free it
    with zigzag lightning. The log reaches the whirling lake Tó`nihilin, circles four
    times, strands on the south shore, and four gods release the Navaho, remove his
    supplies, and seal the log with a black cloud. The gods rename him Áhodiseli,
    He Who Floats, then disappear, leaving him lonely. His pet turkey arrives from
    the east after four gobbles, approaches him sunwise through the four directions,
    and is embraced. At night the man and turkey sleep near cedars, with the turkey
    covering him with one wing.
  language: English
  quote_policy: summarized
