canonical_text:
  quote: ''
  summary: Two boys repeatedly leave home, are seen by a Magpie identified as a spy
    for hostile alien gods, and are then threatened by Yéitso, who comes seeking to
    eat them. The women hide the boys, deceive Yéitso about their tracks, and later
    use four colored hoops cast to the cardinal directions to raise a protective gale
    against approaching enemies. The boys depart before daybreak on a holy trail toward
    Dsilnáotil, find Spider Woman in a subterranean chamber, and learn that the way
    to their father, the Sun, is long and dangerous. Spider Woman gives them life-preserving
    feather charms and teaches them a pollen formula to calm enemies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the fourth day the boys travel north and see a black-plumed bird with white-edged
    plumes on a tree at a canyon edge; it speaks, then flies down the canyon before
    they can shoot it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The women identify the bird as the Magpie, a spy for the Bináye Aháni, and
    warn that spies of the anáye in all quarters have seen the boys and will tell
    their chiefs.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yolkaí Estsán sees Yéitso approaching, returns to warn the others, and the
    women hide the boys under bundles and sticks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yéitso sits at the door, claims the corncake is for him, says he would rather
    eat boys, asks where the boys are, and questions the tracks around the dwelling.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Estsánatlehi denies that boys are present and explains the tracks as marks
    she made for amusement; she demonstrates that she can make similar tracks with
    her fist, and Yéitso leaves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: When many anáye approach the lodge, Estsánatlehi throws four colored hoops
    to the four cardinal directions, and a strong gale prevents the enemies from advancing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The next morning the boys leave before daybreak; the women later find four
    footprints from each boy pointing toward Dsilnáotil and conclude that the boys
    have taken a holy trail.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Near Dsilnáotil the boys see smoke rising from the ground, find a smoke-hole
    with a smoke-blackened ladder, and descend into a subterranean chamber where Spider
    Woman welcomes them.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Spider Woman asks the boys repeatedly where they are going; after they say
    they would seek their father if they knew the way, she identifies their father
    as the Sun.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'Spider Woman warns that the route to the Sun contains four dangers: crushing
    rocks, cutting reeds, tearing cane cactuses, and overwhelming boiling sands.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Spider Woman gives the boys a charm made from a hoop with two living-eagle
    life-feathers, gives another life-feather to preserve their existence, and teaches
    a pollen formula to quiet enemies.
  category: action
  evidence_refs:
  - ev:7
