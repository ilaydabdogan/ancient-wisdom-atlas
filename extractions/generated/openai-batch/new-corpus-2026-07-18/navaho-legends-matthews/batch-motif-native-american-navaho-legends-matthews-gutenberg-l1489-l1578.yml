canonical_text:
  quote: ''
  summary: The passage describes Navaho ceremonies, especially great healing rites,
    minor rites for occasions such as planting, travel, war, marriage, and rain, discussion
    of possible ritual resemblances with Moki traditions, and six major ceremonial
    elements. It gives a detailed account of bloodless sacrifices in the form of painted
    reed cigarettes prepared with feathers, tobacco, pollen, and symbolic lighting,
    then offered to a god in exchange for requested favors.
  language: English
  quote_policy: summarized
