canonical_text:
  quote: ''
  summary: Near Kintyél, Ki'ndotliz, and the high cliff Tse`dezá` or Standing Rock,
    the bead chant is said to have first become known. Two hunters see a rare war-eagle
    and mark its apparent landing place with a forked stick. Four men use the marker
    to locate an eagle nest with two eaglets on Standing Rock. The two pueblo communities
    decide which eaglet each will receive. Because the nest can only be reached by
    a dangerous rope descent, they recruit the poor Navaho beggar Nahoditáhe with
    food and promises. He is lowered in a basket toward the nest, but Wind warns him
    that the Pueblo people will not pull him back up. Nahoditáhe has the basket swung
    closer and climbs into the eagle nest, leaving the empty basket hanging.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kintyél and Ki'ndotliz are described as pueblo houses in Chaco Canyon, and
    a high cliff near them is called Tse`dezá` or Standing Rock.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage frames the episode as the tale of how the yói hatál, or bead chant,
    first became known to humans and was first practiced by the Navahoes near these
    places.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two young men hunting deer see a war-eagle soaring overhead near sunset and
    later think it descends on the top of Standing Rock.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two hunters cut and place a forked stick so that sighting over it from
    a set position will indicate where they last saw the eagle.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Because eagles are said to be very scarce, the report causes discussion, and
    the people decide to send four men to use the forked stick to locate the eagle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The four men conclude that the eagle lives on the point of Tse`dezá`, climb
    to the summit, and see the eagle and its young in a cleft below them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The observers report two young eagles of different ages, and a council decides
    that Ki'ndotliz will receive the elder eaglet and Kintyél the younger.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The only described way to reach the nest is to lower a man by rope past an
    overhanging ledge, and no one volunteers because the undertaking is dangerous.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nahoditáhe is described as a poor Navaho beggar who searches kitchen refuse,
    ashes, and sweepings for bits of food.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The pueblo people summon Nahoditáhe, feed him generously, promise him lifelong
    abundance, and ask him to be lowered in a basket to the eagle nest.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nahoditáhe remains silent through repeated requests and then agrees, saying
    his life is poor, hunger makes existence bitter, and he must die sometime.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The next morning the people feed Nahoditáhe again, make a strong carrying-basket
    with four top corners and strings, and set out for Tse`dezá` with a large party.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: At the cliff top, the party ties a stout rope to the basket strings, instructs
    Nahoditáhe to remove the eaglets and drop them down, and lowers him to the level
    of the nest.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: When Nahoditáhe is about to take the eaglets, Wind tells him that the Pueblo
    people are not his friends, will not pull him up if he throws the eaglets down,
    and that he should enter the nest.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Nahoditáhe asks the people above to swing the basket closer to the cliff,
    then holds the rock, scrambles into the nest, and leaves the empty basket swinging.
  category: action
  evidence_refs:
  - ev:10
