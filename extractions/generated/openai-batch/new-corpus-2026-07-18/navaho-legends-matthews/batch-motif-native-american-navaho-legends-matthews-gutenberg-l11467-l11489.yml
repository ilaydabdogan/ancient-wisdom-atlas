canonical_text:
  quote: ''
  summary: The note explains the name and ritual representation of Has-tsél-tsi, the
    Red God. He is described as a rarely appearing yéi associated with racing. A fast
    runner represents him, challenges men to race, and whips losers with yucca-leaf
    wands under specified rules. His red-painted body, red domino mask, and ritual
    cigarette are marked with white designs and queue-symbols; the cigarette is prepared
    and sacrificed with song and prayer.
  language: English
  quote_policy: summarized
