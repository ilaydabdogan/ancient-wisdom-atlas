canonical_text:
  quote: ''
  summary: A Navaho man takes his wife to his cultivated field, shows her corn and
    other crops, explains corn pollen and preparation, and the harvested corn increases
    into abundant food. Her parents hear the report and thank him. The father, Deer
    Raiser, proposes a reciprocal showing of his own food domain connected with deer.
    At night the spouses exchange names, and in the morning the wife requires her
    husband to bathe and wear her people's clothing before visiting her father's farm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Navaho and his wife set out together toward his field.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: From a little hill they first see the field with sun shining, rain falling,
    a dark cloud above it, and a rainbow spanning the cloud.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the field they walk four times around it sunwise.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man identifies white corn, blue corn, yellow corn, corn of all colors,
    squashes, melons, and beans; bluebirds and yellowbirds sing in the corn.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wife asks questions about planting, preparing, and eating the food, and
    the man answers them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man shows her corn pollen and explains its sacred uses, along with the
    maturing, storing, grinding, preparation, and saving of corn for sowing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: They pluck one ear of each kind of corn; the wife also gathers three leaves,
    which become many leaves by the time the bundle is untied at home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The man instructs the wife to prepare different dishes from the four ears
    of corn; during cooking the food greatly increases and provides a large meal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old people question their daughter about the farm; she describes the field,
    plants, blossoms, tassels, silk, and pollen, and the old man praises the son-in-law's
    wealth and food knowledge.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old man thanks the Navaho for food, asks whether he knows how to make
    deer pemmican, and states that the daughter should now show him their farm.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: At night the wife asks the man his name; after three denials and a fourth
    request, he gives two names and asks for her father's name; she names her father,
    herself, and her mother.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: After a breakfast of mush and venison, Nati'nesthani receives no warning from
    the Wind People and does not fear to eat.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Before visiting her father's farm, the wife tells him to bathe in yucca-suds,
    rinse in pure water, and wear her people's clothing rather than his own.
  category: action
  evidence_refs:
  - ev:9
