canonical_text:
  quote: ''
  summary: A migrating band encounters the Kiltsói, receives food, forms marriage
    ties, and then departs despite efforts to make them stay. A bear keeps night watch
    against suspected pursuers, and Kiltsói men who had joined the travelers desert.
    After days without water, a turquoise wand is used to make bitter water spring
    from the ground, giving the Bitter Water People their name. The travelers later
    approach a mountain, find cottonwoods and a spring, and meet the Coyote People,
    who say they were created at that spring.
  language: English
  quote_policy: summarized
