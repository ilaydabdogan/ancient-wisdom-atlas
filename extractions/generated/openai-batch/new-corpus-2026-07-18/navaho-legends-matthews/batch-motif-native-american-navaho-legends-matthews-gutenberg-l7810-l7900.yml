canonical_text:
  quote: ''
  summary: Nati'nesthani reports earlier killed bears to his wife without naming them
    and refuses bear meat. Deer Raiser then asks him to help fight enemies, leads
    him to a mountain valley, abandons him, and sends twelve tracking bears against
    him. Nati'nesthani kills all the bears unharmed and confronts Deer Raiser, who
    pretends he merely lost sight of him. On the way home they camp at the Ridge of
    the Burnt Moccasins. Deer Raiser tries to burn Nati'nesthani's moccasins in the
    fire, but Nati'nesthani has swapped them, so Deer Raiser burns his own.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nati'nesthani told his wife that he had killed four animals for his father-in-law
    but did not tell her what kind they were.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nati'nesthani told his wife that her father wanted her mother to help skin
    the animals and cut up the meat; when the mother came, Deer Raiser was angry because
    he said he had asked for his daughter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The animals were bears, and Deer Raiser and his wife skinned, dressed, and
    carried them to his house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When offered meat, Nati'nesthani refused, saying he did not eat bear meat;
    Deer Raiser responded angrily.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The next morning Deer Raiser asked Nati'nesthani to help him fight nearby
    enemies, and Nati'nesthani agreed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: They went to a mountain edged on two sides by steep cliffs, with a round hole
    or valley on top where Deer Raiser said his enemies lived.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Deer Raiser stationed Nati'nesthani on one side of the valley, said he would
    drive the enemy from the opposite side, cried four times like a wolf, and then
    ran behind Nati'nesthani instead of helping him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Twelve ferocious tracking bears came toward Nati'nesthani over the hill; they
    were described as following a man's scent until they killed him.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: 'The tracking bears were said to be of the sacred colors: white, blue, yellow,
    black, and spotted.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: Nati'nesthani fought the tracking bears, killed them all, and suffered no
    harm.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Deer Raiser ran toward home believing Nati'nesthani had been killed and spoke
    of him as dead.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Nati'nesthani followed Deer Raiser's trail, found him, and asked why he had
    deserted him after promising not to do so.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Deer Raiser claimed he could not find Nati'nesthani and then praised him for
    killing all the bears and surviving.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:14
  text: At night the two camped at a rocky ridge called Kedidi'lyena`a`, translated
    in the passage as Ridge of the Burnt Moccasins.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:15
  text: They built a brush shelter and a fire, lay down on opposite sides of the fire,
    and each put his moccasins under his head.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: After hearing Deer Raiser's warning about taking care of his moccasins, Nati'nesthani
    stayed awake, then exchanged his moccasins for Deer Raiser's while Deer Raiser
    slept.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: Later that night Deer Raiser took the moccasins from under Nati'nesthani's
    head and buried them in the hot embers, intending to get home before him in the
    morning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:18
  text: At dawn Nati'nesthani pretended to search for his moccasins, pointed out that
    Deer Raiser was putting on Nati'nesthani's moccasins, reclaimed them, and said
