canonical_text:
  quote: ''
  summary: Hastséyalti performs a rite with sacred blankets, buckskins, and white
    and yellow ears of corn. The ears are oriented toward multiple directions and
    finally enclosed between skins; Wind enters and the ears become a man and a woman,
    who receive breath, mind, and voices. A later fourth-day return brings another
    sibling pair, and Yolkaí Estsán arranges cross-marriages between the corn pair
    and the newly arrived pair. Their descendants are identified as the gens of Tse`dzinki'ni.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hastséyalti lays sacred blankets and a buckskin on the ground, takes two ears
    of corn from the dish of the female Nalkénaaz, and hands the white ear to Rock
    Crystal Boy and the yellow ear to Yellow Corn Girl.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rock Crystal Boy and Yellow Corn Girl place the corn ears on the buckskin
    with the yellow ear tipped west and the white ear tipped east.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hastséyalti turns or nearly lays the ears toward east, south, west, north,
    and skyward directions, accompanying the acts with cries, then finally lays them
    with tips to the east.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The narrator states that the turning of the ears in every direction explains
    why the Navahoes wander from place to place rather than remaining in one home
    like the Pueblos.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hastséyalti covers the ears with another buckskin, Wind enters between the
    skins, and after four inspections the white ear has become a man and the yellow
    ear a woman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wind gives the new pair breath of life, Rock Crystal Boy furnishes mind, and
    Grasshopper Girl gives voices.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A dark cloud descends and covers the new pair; Yolkaí Estsán leads them into
    her hogán; the assembled gods disperse; Hastséyalti promises to return in four
    days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says no songs or prayers were used in the rites, the work was
    done in one day, and the hogán where it happened has become a little hill.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the fourth morning Hastséyalti returns, calling four times; White Shell
    Woman tells the young people to get up and make a fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Hastséyalti brings Mirage Boy and Ground-heat Girl and gives Yolkaí Estsán
    two ears of corn with the instruction to grind only one grain at a time.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Yolkaí Estsán says the corn boy and corn girl are brother and sister, and
    Mirage Boy and Ground-heat Girl are also brother and sister; she marries the corn
    boy to Ground-heat Girl and Mirage Boy to the corn girl.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Each couple later has a boy and a girl, and the family moves from Hadzinaí
    to Tse`lakaíia after living at Hadzinaí for four years.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage identifies the gens of Tse`dzinki'ni as descended from these people
    and explains the name through the cliff houses of Tse`gíhi, from which the gods
    brought the corn ears.
  category: relationship
  evidence_refs:
  - ev:9
