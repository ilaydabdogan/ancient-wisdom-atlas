canonical_text:
  quote: ''
  summary: The passage describes Navaho ceremonial dances as religiously symbolic
    public performances that also entertain spectators, especially on the final night
    of major ceremonies. It then summarizes Navaho prayer forms, including deity-addressed
    healing and blessing prayers led by a shaman and repeated by a patient, fourfold
    closing formulas, and other prayer types used by shamans, priests, and laypeople.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Navaho dances are described as accompanied by religious symbolism and sometimes
    performed by men wearing sacred costumes, while also serving largely to entertain
    spectators.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Large crowds gather for the last night of a great ceremony, and many spectators
    stay up all night to watch.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The last night of the mountain chant includes picturesque and varied dances,
    many borrowed from other rites; the last night of the night chant varies little
    to an ordinary observer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dancing is rhythmical and well-timed, includes figures likened to quadrilles,
    excludes round dances such as waltz or polka, and is preceded by private practice
    by dancers and drummers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A common long-prayer form names a god, gives flattering attributes, may mention
    the god's residence, states that sacrifices have been prepared, asks removal of
    a disease spell, immediately affirms its removal, and asks blessings for the supplicant
    and the supplicant's kin and people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the described prayer performance, the shaman gives the prayer one sentence
    at a time and the patient repeats each sentence.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The two-voice prayers are said to sound like litanies and end with the expression
    “hozóna hastlé,” analogous to amen, repeated four times.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The author states that these prayers show no indication of Christian teaching
    influence, except for occasional requests for wealth in the form of horses and
    sheep as evidence of modern influence.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Other prayer types include shamanic monologue prayers, silent and vocal prayers,
    formulated and extempore prayers, prayers used by priests and laypeople, and short
    devotional sayings classed as benedictions and ejaculations.
  category: speech
  evidence_refs:
  - ev:7
