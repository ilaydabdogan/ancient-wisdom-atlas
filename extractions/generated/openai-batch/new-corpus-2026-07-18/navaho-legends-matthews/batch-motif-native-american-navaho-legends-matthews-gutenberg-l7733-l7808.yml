canonical_text:
  quote: ''
  summary: Deer Raiser leads Nati'nesthani to a canyon hunt, sends four bears against
    him, and grieves when Nati'nesthani kills them. The narrator explains Deer Raiser
    is a man-eater and wizard seeking his son-in-law's flesh and body parts. Deer
    Raiser then tries to ambush Nati'nesthani in a serpent-skin disguise, but the
    Wind People warn Nati'nesthani, who confronts him and goes on to his wife's house.
  language: English
  quote_policy: summarized
