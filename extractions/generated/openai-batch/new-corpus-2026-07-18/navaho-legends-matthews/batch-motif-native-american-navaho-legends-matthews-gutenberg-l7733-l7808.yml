  evidence_refs:
  - ev:1
- id: obs:2
  text: Deer Raiser and Nati'nesthani repeat their disagreement four times before
    Deer Raiser tells Nati'nesthani to stay by the pool and not climb the hillsides.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nati'nesthani climbs a rocky eminence despite warnings, hears a wolf-like
    cry, and sees four bears approaching in single file, alternating female and male.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nati'nesthani speaks names of potent gods and a bear god, then shoots and
