canonical_text:
  quote: ''
  summary: Tsóhanoai asks his sons why they have returned. They say many anáye remain
    and seek help destroying them. Tsóhanoai offers help if Estsánatlehi will go west
    to make him a home. He gives the sons colored hoops, knives, and hailstones. On
    the return journey the gods show them a future vision of the Navajo land, and
    songs name holy figures. At home Estsánatlehi says she does not know the talismans
    but tries them, sending colored hoops and hailstones to the four directions and
    a shining hoop with knives toward the zenith; thunder is heard.
  language: English
  quote_policy: summarized
