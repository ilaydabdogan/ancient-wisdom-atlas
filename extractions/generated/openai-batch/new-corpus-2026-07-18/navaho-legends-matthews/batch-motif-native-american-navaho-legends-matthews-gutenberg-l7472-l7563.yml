canonical_text:
  quote: ''
  summary: Nati'nesthani returns to his farm, tracks his missing turkey to a northern
    mountain, ascends it sunwise in a spiral, and concludes the bird has flown east.
    He laments the turkey, naming in it clouds, mist, rain, lightning, rainbow, corn
    colors, and bean, and states that its feathers and beard will be used in rites.
    He then brings four kinds of corn to his wife, explains their names and preparations,
    and the corn increases when cooked for her parents. After questioning, he reveals
    that he plants the corn and it grows. His wife is permitted to go with him to
    see the farm, and the Wind People tell him the food is safe.
  language: English
  quote_policy: summarized
