canonical_text:
  quote: ''
  summary: Sections on Navaho houses describe ordinary hogáns, alternate lodge forms,
    adjacent shelters, summer houses, medicine-lodges, sweat-houses, and more recent
    rectangular stone houses. The passage also records a belief that a house in which
    a human being dies is haunted or accursed and is abandoned or destroyed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The common Navaho habitation is described as a conical frame of angled sticks
    with a doorway, covered with plant materials and earth, and left open at the apex
    for smoke from a central fire.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The doorway has a blanket curtain, a cross-piece lintel between the jambs,
    and filled space between the lintel and smoke-hole; the passage rejects depictions
    that make the doorway continuous with the smoke-hole.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some lodges are made of logs in polygonal form or partly of stone, and cold-weather
    structures may add a storm-door or portico with outer and inner curtains.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A rude shelter of branches is usually constructed next to the hut; in fair
    weather the family cooks and spends much of the day there.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Women use the adjacent shelter to erect looms and weave, or to set out metates
    and grind corn; some people also sleep there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Summer houses are quickly built with forked sticks and slanting poles as a
    windbreak, covered with grass, weeds, earth, or evergreen branches, and left completely
    open on one side.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Medicine-lodges are usually larger versions of ordinary hogáns where long
    poles can be cut; at low altitudes they may have separate walls and roof on a
    rude frame.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The low-altitude medicine-lodge plan is compared in the passage to lodges
    formerly used by Arickarees, Mandans, and other Missouri tribes, and to the Mandan
    earth-lodge.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sweat-house is a small form of the ordinary hogán, without smoke-hole
    or storm-door, sometimes partly underground and always thickly earth-covered.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Fire is not kindled inside the sweat-house; stones are heated outside and
    carried into the sudatory with improvised stick tongs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: When ceremonially used, the sweat-house frame uses different materials for
    different ceremonies and may be decorated with dry-paintings.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: A few more progressive Navahoes have recently built rectangular stone houses
    with flat roofs, glazed windows, wooden doors, and regular chimneys, like those
    of Mexican and Pueblo neighbors.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage says Navahoes believe a house where a human being dies is haunted
    or accursed; they abandon it, avoid entering it again, and usually destroy it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage proposes that this belief may explain hesitation to build permanent
    dwellings, while noting the superstition may have weakened or been ritually averted
    in recent years.
  category: relationship
  evidence_refs:
  - ev:8
