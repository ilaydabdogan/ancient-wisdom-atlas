canonical_text:
  quote: ''
  summary: Hastséyalti and Hastséhogan summon the Navaho from his grandmother's lodge,
    obtain consent for him to take the niece's pet turkey, and carry him on a rainbow
    to a distant rock house of divine people. There he receives inexhaustible food
    and water, explains his wish to travel to To`ye'tli where the rivers meet, and
    Nayénezgani grants the journey. The gods prepare a large spruce log as a hollow
    vessel using rainbow ropes, stone knives, lightning, winds, clouds, and rock-crystal
    windows. They place the Navaho inside with provisions and secretly prepare the
    turkey with clouds, rain, mist, seeds, corn, gourds, melons, squash, and beans.
  language: English
  quote_policy: summarized
