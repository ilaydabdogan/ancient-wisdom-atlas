canonical_text:
  quote: ''
  summary: The passage contains interlinear Navajo song texts and editorial notes.
    A fragmentary refrain says named figures bring items and that people are restored,
    with an editorial clarification that this means replacement rather than revival.
    Songs of Nayénezgani then present repeated formulas in which figures are told
    of, holy figures speak with Sun or Moon associations, voices are heard through
    sky, water, earth, and clouds, and Nayénezgani and To`badzistsíni arrive from
    houses made of knives.
  language: Navajo with English interlinear translation and English editorial notes
  quote_policy: summarized
