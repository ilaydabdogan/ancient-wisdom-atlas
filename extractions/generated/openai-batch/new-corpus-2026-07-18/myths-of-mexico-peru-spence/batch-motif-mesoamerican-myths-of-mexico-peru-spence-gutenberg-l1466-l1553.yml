canonical_text:
  quote: ''
  summary: 'The passage describes Mexican calendrical reckoning: a 365-day civil year,
    a fifty-two-year binding of years, a 260-day birth-cycle, twenty-day periods and
    named day-signs, five ominous nemontemi days, ecclesiastical and civil calendar
    distinctions, and the dread and rite at the end of each fifty-two-year period,
    when the Pleiades were watched, a human victim was sacrificed, sacred fire was
    kindled, domestic hearths were relit, and mankind was considered safe for another
    period.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Mexican year is described as a 365-day cycle without intercalary addition
    or other correction.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The nexiuhilpililztli, or binding of years, is described as containing fifty-two
    years and running in two separate cycles: fifty-two solar years of 365 days each
    and seventy-three groups of 260 days each.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The solar year is described as eighteen periods of twenty days plus five nemontemi,
    or unlucky days, which were included in the year but not intercalated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The 260-day birth-cycle is described as subdivided into groups of thirteen
    days.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:5
  text: Each day in a cempohualli was denoted by a sign, with examples including house,
    snake, and wind.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The cempohualli was subdivided into four periods of five days each, and these
    periods were sometimes called weeks by early Spanish writers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Four year-names—calli, tochtli, acatl, and tecpatl—are said to recur in sequence
    in the Mexican solar year.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: During the nemontemi, no work was done because the days were regarded as ominous
    and unwholesome.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: Ecclesiastical authorities are described as using their own reckoning and
    beginning the year on the first day of their calendar regardless of the civil
    day-sign.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Thirteen years constituted a xiumalpilli, or bundle, and four such bundles
    constituted a complete binding of the years.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: At the conclusion of each fifty-two-year period, the Mexicans feared that
    the world would come to an end, earthly time would cease, and the universe would
    be demolished.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Before the toxilmolpilia ceremony, the passage says the Mexicans abandoned
    themselves to prostration and the wicked went about in fear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: At the dawn of the first day of the fifty-third year, the people watched the
    Pleiades; if they passed the zenith, time would proceed and the world would be
    respited.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The gods were placated or refreshed by the slaughter of a human victim, on
    whose still-living breast fire was kindled by friction.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The heart and body of the victim were consumed by the flames kindled on the
    victim’s breast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: When the celestial bodies called planets of hope crossed the zenith, the people
