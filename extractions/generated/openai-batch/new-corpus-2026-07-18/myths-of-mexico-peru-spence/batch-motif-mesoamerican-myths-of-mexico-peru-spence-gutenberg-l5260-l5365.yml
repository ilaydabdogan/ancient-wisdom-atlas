canonical_text:
  quote: ''
  summary: The passage compares Maya and Nahua religion, discusses human sacrifice
    among the Maya, identifies the Maya Kukulcan and Guatemalan Gucumatz with the
    Feathered Serpent complex associated with Quetzalcoatl, summarizes scholarly uncertainty
    about Maya codex deities, and describes a Maya dualism between light-associated
    and darkness-associated divine powers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Maya pantheon resembles the Nahua pantheon but
    differs enough to suggest a period free from Nahua influence; it provisionally
    proposes a common centre or original identity followed by later differentiation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that human sacrifice is a key-note of Mexican mythology
    and that the Maya practiced human sacrifice less frequently than the Nahua but
    did practice it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that maidens were sacrificed to the water-god at spring
    florescence by being cast into a deep pool and drowned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Kukulcan means “Feathered Serpent” and translates
    the Mexican name Quetzalcoatl; it also says the Guatemalan name Gucumatz is identical
    in Kiche with the other native appellations.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage distinguishes Quetzalcoatl as, in Mexico, the Man of the Sun and
    original wind-god, while Kukulcan is described as having more attributes of a
    thunder-god.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage describes the tropical midday sun as drawing clouds around it
    in serpentine shapes, from which thunder, lightning, and fertilising rain emanate.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that several Yucatan stelae represent Kukulcan with wind
    issuing from his mouth, as in Mexican portrayals.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that the Dresden, Madrid, and Paris codices contain pictorial
    representations of Maya deities, that some names are uncertain, and that Schellhas
    proposed letter designations for fifteen deity figures from A to P, omitting J.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that Spanish accounts of Maya mythology do not agree with
    the codex representations, that the three codices share a mythology, and that
    comparison with carved and stucco bas-reliefs is difficult.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage describes Maya mythology as a dualism involving conflict between
    light and darkness, with light-side deities of sun, warmth, civilisation, and
    joy opposed to deities of death, night, gloom, and fear.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that, at the time Maya belief first came under European
    notice, gods of darkness were ascendant, while the cult of light persisted because
    benign agencies connected with it had promised to return in the future.
  category: sequence
  evidence_refs:
  - ev:7
