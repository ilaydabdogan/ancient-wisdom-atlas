canonical_text:
  quote: ''
  summary: The passage describes Kabah and Uxmal architecture, especially the Governor's
    Palace and the Casa del Adivino or Dwarf's House. It then recounts a legend in
    which a childless old woman incubates an egg, from which a tiny child emerges.
    The dwarf child challenges the king, matches his strength, produces a taller palace
    overnight, survives a head-striking ordeal through his mother's aid, kills the
    king in return, and is proclaimed sovereign. The old woman later disappears and
    is identified with a figure in a subterranean passage near Mani, sitting by a
    river under a tree with a serpent, selling water in exchange for babies devoured
    by the serpent.
  language: English
  quote_policy: summarized
