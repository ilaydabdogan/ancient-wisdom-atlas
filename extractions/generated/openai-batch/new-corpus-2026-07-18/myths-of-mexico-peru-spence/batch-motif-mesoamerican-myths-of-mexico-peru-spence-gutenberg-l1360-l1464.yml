canonical_text:
  quote: journey of the soul after death through the gloomy dangers of the Other-world
  summary: The passage describes Nahua pictorial manuscripts and interpretative codices,
    then summarizes a Vatican manuscript whose final pages depict a deceased soul
    leaving the body, receiving judgment before Tezcatlipoca, undergoing armed trials
    and monstrous obstacles on the road to Mictlan, and finally reaching the Lord
    of Hell before greeting previously dead friends. It then turns to the Mexican
    calendar system.
  language: English
  quote_policy: quoted
