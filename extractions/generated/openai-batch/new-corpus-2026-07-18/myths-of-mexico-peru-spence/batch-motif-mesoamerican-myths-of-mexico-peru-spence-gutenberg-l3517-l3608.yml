  quote: ''
  summary: The passage describes a penitential confession rite addressed to Tezcatlipoca
    in the form of Tlazolteotl, including confession, fasting, scarification, and
    pardon. It then reports a 1652 Zapotec ceremony observed by Burgoa, involving
    an altar, blood, copal, a stone idol, grass dishes, knotted maize-husk threads
    representing sins, bloodletting, and priestly petition for forgiveness. The final
    section introduces Chalchihuitlicue as wife of Tlaloc and describes her water-associated
    worshippers, attire, and rain-direction emblem.
  language: English
