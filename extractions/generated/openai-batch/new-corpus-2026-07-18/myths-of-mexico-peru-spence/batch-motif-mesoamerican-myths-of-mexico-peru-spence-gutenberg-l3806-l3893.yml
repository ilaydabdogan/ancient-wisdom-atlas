canonical_text:
  quote: ''
  summary: 'The passage presents Mexican and Mixtec creation traditions: a primordial
    dark, watery, orderless world; Nahua dual creator principles associated with sky
    and earth; a Toltec account in which Tloque Nahuaque creates the universe and
    first humans before successive elemental catastrophes; and a Mixtec account in
    which deer deities raise a heaven-supporting cliff and beget two magically skilled
    boys.'
