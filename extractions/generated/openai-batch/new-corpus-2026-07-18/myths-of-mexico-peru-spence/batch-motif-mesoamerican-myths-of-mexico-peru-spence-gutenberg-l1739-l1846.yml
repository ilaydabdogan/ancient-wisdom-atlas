canonical_text:
  quote: ''
  summary: The passage gives a historical sketch of Nahua, Acolhuan, Tlascaltec, Tezcucan,
    Tecpanec, Otomi, and Aztec political relations. It describes annual combat between
    Mexico and Tlascala for sacrificial captives, the ordeal and sacrifice of a captured
    Tlascaltec warrior, the lake cities and rivalry of Tezcuco and Azcapozalco, Tecpanec
    settlements, and an account of Aztec migration from Aztlan, enslavement, release,
    tribute, and settlement in swamp villages.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage frames the material as a historical sketch of Nahua history distinct
    from tradition and states that agricultural settlement was followed by a feudal
    system and by periods of city or city-group dominance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Acolhuans are described as holding supreme power after the Toltec period
    and ruling from Tollantzinco and Cholula; Cholula later maintained an alliance
    with Tlascala and Huexotzinco.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mexican and Tlascalan warriors met once a year on a prearranged battlefield
    to capture opponents for sacrifice rather than to kill them in combat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Combat groups pulled and tugged over a struck-down warrior, attempting either
    to drag him into captivity or rescue him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A secured Tlascaltec warrior was brought to Mexico in a cage and placed on
    a stone slab with one foot fastened by a chain or thong.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The captive received light weapons, faced celebrated Mexican warriors, and
    would be freed if he defeated six opponents; if wounded, he was taken to the altar
    of sacrifice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The wounded captive's heart was removed and offered to Huitzilopochtli, described
    as the implacable god of war.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The lake communities of the valley of Mexico included cities around Lake Tezcuco,
    with Azcapozalco and Tezcuco as rival nuclei; the rivalry ended in Azcapozalco's
    defeat.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tezcuco is described as later the most typically Nahuan of the lacustrine
    powers, while Xaltocan is described as an Otomi city-state at the northern end
    of the lake.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Tecpanecs are described as Nahua people whose settlements each possessed
    a tecpan or chief's house and whose state formed a buffer between northern Otomi
    and southern Nahua.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Aztecs are described as a Nahua people who, according to their own accounts,
    came from Aztlan or Crane Land, though the passage states that their true origin
    is uncertain.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The Aztecs are said to have sojourned at several places, been reduced to slavery
    by chiefs of Colhuacan, been released, gone to Chapoultepec, left after dissension
    with the Xaltocanecs, paid tribute to the Tecpanecs, and expanded their swamp
    villages into thriving communities.
  category: sequence
  evidence_refs:
  - ev:10
