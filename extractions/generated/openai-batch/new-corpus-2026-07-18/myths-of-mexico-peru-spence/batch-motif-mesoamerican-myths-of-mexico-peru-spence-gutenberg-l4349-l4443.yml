canonical_text:
  quote: ''
  summary: The passage describes monumental worked ruins on a mountain, then recounts
    the legend of the Tlascalan warrior Tlalhuicole, who refuses liberty after capture
    and ultimately dies in ritual combat and heart sacrifice to Huitzilopochtli. It
    also describes the Ciuapipiltin, spirits of women who died in childbed, as honored
    yet malevolent beings associated with illness, crossroads, possession, and placatory
    offerings.
  language: English
  quote_policy: summarized
