canonical_text:
  quote: '"an eagle of great size and majesty, grasping in its talons a huge serpent"'
  summary: The passage surveys Nahua-related groups and then recounts foundation legends
    for Mexico-Tenochtitlan. In the popular account, nomadic Nahua see an eagle on
    a cactus holding a serpent; soothsayers interpret this as a good omen and advise
    settlement. In an elaborated version, the Aztecs find a stone altar where Copal
    had been sacrificed, a nopal growing from it, the eagle on the nopal holding the
    serpent, and a priest who meets Tlaloc in a pool and receives permission to found
    the city.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Nahua peoples are described as tribes speaking Nahuatlatolli and occupying
    a sphere from the southern borders of New Mexico to the Isthmus of Tehuantepec.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Chichimecs are described as entering the Mexican valley after the Toltec
    occupation, having chief towns at Tezcuco and Tenayucan, and later allying with
    the Nahua and adopting the Nahua language.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Acolhuans are said, in Gomara's account, to have arrived from Acolhuacan
    about A.D. 780 and founded Tollan, Colhuacan, and Mexico itself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Tecpanecs are described as a confederacy of Nahua tribes dwelling in towns
    on Lake Tezcuco, chiefly Tlacopan and Azcapozalco.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Aztecs are described as a nomadic tribe that wandered over the Mexican
    plateau, settled in marshlands near Lake Tezcuco, founded Tenochtitlan or Mexico,
    paid tribute to the Tecpanecs for a time, and later surpassed them in power.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Huitzilopochtli is described as leading the Mexicans to the neighborhood of
    Mexico; he is called a traditional chief who was later deified as the god of war.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the popular foundation legend, the nomadic Nahua see an eagle perched on
    a cactus plant, grasping a huge serpent in its talons, and spreading its wings
    toward the rising sun.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The soothsayers or medicine-men read the spectacle as a good omen, advised
    the leaders to settle there, and the people drove piles into the marshy ground
    to found Mexico.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: In the elaborated legend, the Aztecs, about 1325, seek refuge on an island
    among the marshes on the western shore of Lake Tezcuco and find a stone where
    a priest had sacrificed the captive prince Copal forty years earlier.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: A nopal plant is said to have sprung from an earth-filled crevice in the rude
    altar, and the royal eagle alights on it while grasping the serpent.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A priest of high rank, urged by a supernatural impulse, dives into a nearby
    pool, meets Tlaloc, the god of waters, and after an interview obtains permission
    to found a city on the site.
  category: sequence
  evidence_refs:
  - ev:9
