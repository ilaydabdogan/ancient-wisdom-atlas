canonical_text:
  quote: ''
  summary: The passage first reviews early modern and later sources for Mexican mythology,
    then describes Nahua ritual language that applied universal divine attributes
    to multiple gods. It presents Tezcatlipoca as a mirror-bearing air or wind deity
    who rose toward supremacy, served as tutelary god of the Tezcucans/Nahua immigrants,
    and became linked with fate, fortune, conquest, and national destiny. It then
    introduces Tezcatlipoca’s rivalry with Quetzalcoatl in legends of Tollan’s overthrow
    and closes with a description of Quetzalcoatl’s reign as a time of peace, plenty,
    and abundant crops, birds, metals, and precious stones.
  language: English
  quote_policy: summarized
