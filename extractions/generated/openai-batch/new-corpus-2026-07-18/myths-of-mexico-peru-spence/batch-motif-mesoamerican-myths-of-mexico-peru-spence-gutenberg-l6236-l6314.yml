canonical_text:
  quote: ''
  summary: The passage describes Mitla as a ruined monumental complex with palaces,
    pyramids, stone columns, mosaic panels, lintels, burial rooms, idols, and an underground
    chamber. It identifies Mitla with Mictlan, described as the Mexican Hades and
    a place of the dead, and cites a suggestion that ancestors were imagined to have
    emerged from the underworld through caverns into daylight. It then quotes Father
    Torquemada’s description of Mictlan as an underworld village with impressive buildings,
    a temple of an evil spirit, ornamented halls, monumental doorways, and stone pillars.
  language: English
  quote_policy: summarized
