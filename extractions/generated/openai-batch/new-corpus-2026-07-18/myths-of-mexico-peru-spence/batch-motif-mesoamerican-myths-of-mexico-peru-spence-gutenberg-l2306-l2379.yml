canonical_text:
  quote: ''
  summary: The passage describes Tezcatlipoca as a widely worshipped Nahua deity associated
    with guidance, fate, compulsory prayer, cosmic danger, and the expiation of sin.
    It then summarizes the Teotleco festival, in which absent gods are said to return,
    altars are decorated, food is offered, a flour surface is watched for a divine
    footprint, musical instruments announce the sign, and victims are hurled into
    a sacrificial fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tezcatlipoca was supposed to have guided the Nahua, especially the people
    of Tezcuco, from a northern region to the valley of Mexico.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tezcatlipoca's worship is described as widespread, and he is said to have
