  text: His worship was regarded as compulsory and partly as a safeguard against the
    destruction of the universe, a calamity believed possible through his agency.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tezcatlipoca was known as Moneneque, 'The Claimer of Prayer,' and some representations
    showed a golden ear with small golden tongues straining toward it in appeal.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In times of national danger, plague, or famine, community leaders and the
