  summary: The passage summarizes Inca and local Peruvian creation beliefs involving
    Pachacamac, Pachacamama, creation by will or word, the sun as sub-creator, metal
    eggs producing social classes, a deluge followed by renewed creation at Tiahuanaco,
    emergence from the earth or caves, and a local Irma valley myth in which a sun-given
    son is slain and food plants grow from his body. It then describes Inca civilisation
    and the solar theocracy of the Inca ruler.
