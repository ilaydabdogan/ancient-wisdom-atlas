candidate_motifs:
- id: motif:1
  label: Post-deluge renewal and leader selection
  taxonomy_refs:
  - flood_and_renewal
  basis: The passage begins after a deluge, describes a leader chosen during a kingless
    period, and later includes another flood event.
  evidence_refs:
  - ev:1
  - ev:10
  confidence: medium
  cautions: The passage does not narrate the deluge itself; it only states events
    after it and later describes a localized flood sweeping away a house.
- id: motif:2
  label: Egg-born sacred figures on a mountain
  taxonomy_refs:
  - cosmic_egg
  - sacred_birth
  basis: Five eggs appear on a high mountain; Paricaca emerges from one, while four
    falcons from the others become warriors.
  evidence_refs:
  - ev:1
  - ev:10
  confidence: high
  cautions: The eggs produce sacred or heroic beings, but the passage does not present
    the eggs as creating the whole cosmos.
- id: motif:3
  label: Wisdom transmitted from divine father to poor son
  taxonomy_refs:
  - wisdom
  - divine_parent_child
  basis: Huathiacuri learns wisdom from his father Paricaca and repeatedly seeks or
    receives Paricaca's advice in contests.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage calls Paricaca Huathiacuri's father and source of wisdom,
    but does not explicitly label either as divine within this excerpt.
- id: motif:4
  label: Animal speech reveals hidden knowledge
  taxonomy_refs:
  - wisdom
  basis: Huathiacuri overhears two foxes and thereby learns about the rich man's illness
    and its cause.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage reports fox conversation but does not state how the foxes
    know the information.
- id: motif:5
  label: Cure through revelation of hidden wrongdoing and hidden creatures
  taxonomy_refs:
  - wisdom
  - divine_judgment
  basis: Huathiacuri cures the sick man by revealing the wife's unfaithfulness and
    the hidden serpents and toad, after which the creatures are killed and the man
    recovers.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The connection between illness, infidelity, and reptiles is presented
    narratively but not explained doctrinally in the passage.
- id: motif:6
  label: Poor suitor gains bride through healing exchange
  taxonomy_refs:
  - sacred_exchange
  basis: Huathiacuri offers to cure the girl's father if she gives him her love; after
    the cure, the daughter is married to him.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The marriage follows the cure, but the passage also notes the girl initially
    refuses, so the exchange is not straightforwardly consensual in the first proposal.
- id: motif:7
  label: Contests won through magical aid and resource acquisition
  taxonomy_refs:
  - initiation
  basis: Huathiacuri defeats his brother-in-law in dancing and drinking, festive attire,
    and house-building through Paricaca's advice, magically endowed objects, a special
    skin, and animal helpers.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage frames the contests as rivalry with a brother-in-law rather
    than explicitly as initiation.
- id: motif:8
  label: Shapeshifting and punitive transformation
  taxonomy_refs:
  - shapeshifter
  - divine_judgment
  basis: Huathiacuri is changed into a dead llama and resumes human form; later he
    turns his rival into a deer and the rival's wife into a stone because of bad advice.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: high
  cautions: The first transformation is strategic and temporary, while the later transformations
    are punitive.
- id: motif:9
  label: Animal helpers complete impossible building task
  taxonomy_refs: []
  basis: Huathiacuri obtains help from animals and birds of all kinds during the night
    to complete his house for the building contest.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No supplied taxonomy reference directly names animal-helper construction.
- id: motif:10
  label: Storm-flood as destruction of a proud household
  taxonomy_refs:
  - divine_judgment
  - flood_and_renewal
  basis: The falcon-born warriors perform miracles including raising a storm that
    sweeps the rich Indian's house in a flood to the sea.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage links the destroyed house to the rich Indian but does not
    explicitly state the flood is punishment, though the wider sequence follows the
    rich household's pride and rivalry.
