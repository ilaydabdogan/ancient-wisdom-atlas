canonical_text:
  quote: ''
  summary: 'Public-domain English retelling of a Peruvian myth: after a deluge, five
    eggs appear on a mountain; Paricaca emerges from one and aids his poor son Huathiacuri.
    Huathiacuri heals a wealthy sick man by revealing hidden wrongdoing and dangerous
    reptiles, marries the man''s daughter, defeats a brother-in-law in contests through
    Paricaca''s guidance and magical or animal aid, transforms the rival and his wife,
    and four falcon-warriors from the remaining eggs raise a storm and flood that
    sweep away the rich man''s house.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the deluge, the Indians chose the bravest and richest man as leader
    and called the period Purunpacha, the time without a king.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Five large eggs appeared on a high mountain-top; Paricaca later emerged from
    one, and the four remaining eggs later opened to release falcons that became warriors.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:10
- id: obs:3
  text: Huathiacuri is described as poor and as having learned much wisdom from his
    father.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A rich man had a curious house with a roof made of yellow and red birds' feathers,
    possessed many llamas, was esteemed for wealth, aspired to be the creator, and
    became ill.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Huathiacuri listened to two foxes talking and learned about the rich man and
    the cause of his illness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Huathiacuri met one of the rich man's daughters and said he would cure her
    father if she gave him her love; she refused because of his ragged and dirty appearance
    but brought him to her father.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Huathiacuri told the sick man that his wife had been unfaithful and that two
    serpents were above the house and a two-headed toad was under the grinding-stone;
    after the reptiles were found and killed, the man recovered and the daughter married
    Huathiacuri.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The brother-in-law challenged Huathiacuri to dancing and drinking; Huathiacuri,
    after Paricaca's advice, used a dead-llama disguise to frighten a fox and vixen
    and take their chicha jar and many-piped flute, then won the contest.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In a contest over festive attire, Huathiacuri, with Paricaca's aid, found
    a red lion-skin that made him appear to have a rainbow around his head and won
    again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In a house-building contest, Huathiacuri got animals and birds to help him
    during the night and used an animal's loud screams to frighten away llamas carrying
    straw for his rival's roof.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In a final dance contest, Huathiacuri made a loud noise, frightened his rival,
    turned him into a deer, and turned the rival's wife into an inverted stone because
    she had given bad advice.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Four falcons from the remaining eggs became four great warriors who performed
    miracles, including raising a storm that swept the rich Indian's house away in
    a flood to the sea.
  category: action
  evidence_refs:
  - ev:10
