canonical_text:
  quote: ''
  summary: The passage summarizes the Inca drama Apu-Ollanta, including Ollanta’s
    unlawful love for the princess Curi-Coyllur, rebellion, Curi-Coyllur’s imprisonment
    and reunion with her daughter Yma Sumac, and the final pardon and restoration
    of the lovers. It then describes Peruvian population origins, the coming of the
    Quichua-Aymara, their origin traditions, Lake Titicaca, the emergence of the sun
    from a sacred rock, and the beginnings of domestication, agriculture, irrigation,
    and terrace-building.
  language: English
  quote_policy: summarized
