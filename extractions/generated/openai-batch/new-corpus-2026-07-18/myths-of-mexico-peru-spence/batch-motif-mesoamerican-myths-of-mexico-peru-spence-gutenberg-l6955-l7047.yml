- id: obs:3
  text: Hunhun-Apu and Vukub-Hunapu play ball near Xibalba; the rulers Hun-Came and
    Vukub-Came send four owl-shaped messengers to challenge them to a ball game.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
