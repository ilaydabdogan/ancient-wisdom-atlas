canonical_text:
  quote: ''
  summary: The passage recounts the Popol Vuh background of the hero-gods Hun-Apu
    and Xbalanque. Their kin are associated with the ball game. Hunhun-Apu and Vukub-Hunapu
    accept a ball-game challenge from the rulers of Xibalba, descend to the underworld,
    are mocked, and are sacrificed. Hunhun-Apu's head is placed in a gourd-bearing
    tree. Xquiq, a princess of Xibalba, reaches for the fruit; the head spits into
    her hand and announces her future motherhood. Condemned by her father, she escapes
    when owl messengers substitute bloodwort sap for her heart. She seeks Xmucane's
    protection, proves her claim through a maize-gathering miracle, and gives birth
    to the twins Hun-Apu and Xbalanque.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage presents a divine genealogy: Xpiyacoc and Xmucane are father
    and mother gods; their sons include Hunhun-Apu and Vukub-Hunapu; Hunhun-Apu and
    Xbakiyalo have sons named Hunbatz and Hunchouen.'
  category: relationship
  evidence_refs:
  - ev:1
