canonical_text:
  quote: ''
  summary: 'The passage summarizes Kiche creation traditions: Hurakan calls forth
    earth from gloom; the chief gods create animals and then wooden mannikins, who
    are destroyed after angering the gods. Their destruction comes through flood,
    resinous rain, attacking birds, domestic animals, household objects, and refuges
    that reject them; monkeys are left as their remaining progeny. The passage then
    introduces the proud being Vukub-Cakix, his sons Zipacna and Cabrakan, and the
    heavenly twins Hun-Apu and Xbalanque, who are sent to chastise them. Hun-Apu wounds
    Vukub-Cakix at the nanze-tree, loses an arm in the struggle, and later consults
    the wise magicians Xpiyacoc and Xmucane, who devise a disguise as doctors to recover
    the arm.'
  language: English
  quote_policy: summarized
