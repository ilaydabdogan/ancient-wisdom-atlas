- id: ev:5
  type: summary
  locator: lines 6627-6636
  quote_or_summary: Vukub-Cakix, the Great Macaw, is described as proud, with emerald
    teeth and gold and silver brilliance; the author calls him a sun-and-moon god.
    His sons Zipacna and Cabrakan are described as earthquake-gods of the type of
    Jötuns or Titans, and the heavenly twins Hun-Apu and Xbalanque are sent to chastise
    the trio.
  source_text_path: texts/public-domain/nahua-maya-inca/project-gutenberg/myths-of-mexico-peru-spence.md
  rights_note: Public domain source; concise summary.
- id: ev:6
  type: summary
  locator: lines 6638-6649
  quote_or_summary: Vukub-Cakix owns the wonderful nanze-tree or tapal, whose round
    yellow aromatic fruit he eats; finding Hun-Apu and Xbalanque there, he is shot
    in the mouth by Hun-Apu’s blow-pipe dart, grapples with Hun-Apu, and tears off
    his arm.
  source_text_path: texts/public-domain/nahua-maya-inca/project-gutenberg/myths-of-mexico-peru-spence.md
  rights_note: Public domain source; concise summary.
- id: ev:7
  type: summary
  locator: lines 6649-6659
  quote_or_summary: Vukub-Cakix returns home to his wife Chimalmat, points to his
    injured mouth, hangs Hun-Apu’s arm over a blazing fire, and laments; Chimalmat
    turns and bastes the arm while Vukub-Cakix curses and threatens the intruders.
  source_text_path: texts/public-domain/nahua-maya-inca/project-gutenberg/myths-of-mexico-peru-spence.md
