canonical_text:
  quote: ''
  summary: 'The passage interprets a series of Maya tableaux: a rejected marriage-seeker
    consults a prophet; Aac angrily demands Móo''s hand and is refused by a priestly
    interpreter of the gods; Coh witnesses the scene while a spy watches him; Cay
    seeks divination about impending dynastic calamity; and Coh is later treacherously
    killed by Aac, prepared for cremation, and mourned by Queen Móo while the country
    is left without a chief.'
  language: English
  quote_policy: summarized
