  summary: The passage describes Peruvian worship of the sea, fish, whales, and celestial
    prototypes of animals; summarizes Viracocha as an Aymara-Quichua culture hero,
    creator, teacher, and westward disappearing deity; contrasts Peruvian and Mexican
    sun-worship; and describes the estates, attendants, offerings, and sacrifices
    associated with the Peruvian Sun cult.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ancient Peruvians are described as worshipping the sea as well as the earth;
    inland people regarded the sea as menacing, while coastal people revered it as
    benevolent Mama-cocha, or Mother-sea, because it yielded fish for subsistence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the whale was worshipped because of its great size,
    and that districts adored the fish species most abundant in their area.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fish and whale worship is explicitly distinguished from totemism because,
    according to the passage, a totem animal was not to be eaten.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each variety of fish was imagined to have a prototype in the upper world;
    the great fish-god engendered others of its species and sent them into deep waters
    for human use.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Birds and animals are said to have eponymous counterparts among the stars,
    and many South American constellations were named after beasts and birds.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Aymara-Quichua worshipped Viracocha as a great culture hero but did not
    offer him sacrifices or tribute, believing he already possessed all things and
    needed nothing from people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Viracocha is said to have made the sun and moon after emerging from Lake Titicaca,
    then made the earth and peopled it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: On westward travels from the lake, Viracocha was sometimes attacked by people;
    he retaliated with storms that destroyed their property, after which they humbled
    themselves and acknowledged him as lord.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: After forgiving the humbled people, Viracocha taught them everything and received
    the name Pachayachachic.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Viracocha ultimately disappeared in the western ocean.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Four beings were either created by Viracocha or born with him; they are said
    to have civilised Peru, received the four quarters of the earth, and were known
    as the four winds.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: One legend says the four beings came from the cave Pacari, called the Lodging
    of the Dawn.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:13
  text: The name Inca is glossed as People of the Sun, and the Incas regarded the
