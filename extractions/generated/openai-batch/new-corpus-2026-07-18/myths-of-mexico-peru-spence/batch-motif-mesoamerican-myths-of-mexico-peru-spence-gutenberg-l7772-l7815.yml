canonical_text:
  quote: ''
  summary: The passage recounts, through Spence’s presentation of Le Plongeon, that
    Queen Móo refuses suitors after widowhood, including Aac, whose humiliation becomes
    hatred and political-religious revolt. Aac promotes sun worship over serpent and
    ancestor worship, leads his vassals against Móo’s supporters, and Móo is captured.
    A further alleged Manuscript Troano account describes her people subdued, a lord
    seizing her by the hair and beating her, and her movement to the opposite sea-coast
    after defeat. The narrator then strongly cautions that Le Plongeon’s reading is
    fanciful because the Maya script was not completely deciphered and supporting
    historical manuscripts are lacking.
  language: English
  quote_policy: summarized
