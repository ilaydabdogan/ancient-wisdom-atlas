  text: The passage associates Quetzalcoatl's rule with unusually abundant fruits
    of the earth and accumulated gold.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Native pinturas are said to place solar discs or semi-discs in connection
    with the feathered serpent as attributes of Quetzalcoatl.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the Hopi symbolise the sun as a serpent with its tail in
    its mouth.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some images are described as showing Quetzalcoatl emerging or stepping from
