canonical_text:
  quote: ''
  summary: The passage presents a secondary interpretation of Quetzalcoatl as a solar
    Man of the Sun and civilizing teacher, describes solar and serpent imagery attached
    to him, recounts expectations of his return among peoples subject to the Aztecs,
    identifies related regional forms such as Gucumatz and Kukulcan, compares him
    with northern Pacific Coast figures, and lists titles linking him with the heavens,
    winds, dawn, and serpent attributes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Quetzalcoatl is described as the Man of the Sun who leaves his abode for a
    time to teach arts associated with early civilisation and is later displaced by
    deities of an invading race.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Quetzalcoatl is represented as a traveller carrying a staff.
  category: attribute
  evidence_refs:
