canonical_text:
  quote: ''
  summary: 'The passage first recounts an Aztec legend in which a royal princess from
    Colhuacan is requested as the symbolic mother of Huitzilopochtli, sacrificed in
    Mexico, and her skin worn by a priest representing the deity before her grieving
    father. It then turns to semi-legendary accounts of Nezahualcoyotl of Tezcuco:
    after seeing his father killed by Tecpanec invaders, he escapes, is captured and
    freed with help, receives asylum, faces plots by Maxtla, and finally escapes assassins
    through concealment by incense and an underground route.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the Aztecs built the city of Mexico, they raised an altar to the war-god
    Huitzilopochtli.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that Huitzilopochtli generally received prisoners of war
    but, in times of public calamity, demanded sacrifice of the noblest in the land;
    on one occasion an oracle required a royal princess for the high altar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Aztec king sent an embassy to the King of Colhuacan to request one of
    his daughters as the symbolic mother of Huitzilopochtli.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The King of Colhuacan delivered up the girl, who was escorted to Mexico and
    sacrificed with ceremony.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sacrificed princess's skin was flayed off and used to clothe the priest
    who represented the deity in the festival.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The father was invited to witness what was presented as his daughter's deification;
    by torchlight he saw the priest wearing her skin and receiving homage, recognized
    her features, and fled in grief and horror.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Tecpanecs defeated the Acolhuans of Tezcuco and slew their king; Nezahualcoyotl,
    the heir, watched from the shelter of a nearby tree and escaped.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nezahualcoyotl was later captured, brought back to his native city, imprisoned,
    and helped to escape by a governor who owed his position to the prince's father.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The governor was put to death for helping Nezahualcoyotl; the royal family
    of Mexico interceded for the prince, who was allowed asylum at the Aztec court
    and later lived in Tezcuco under the usurping Tecpanec chief's bounty.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Maxtla succeeded the earlier Tecpanec conqueror, rejected Nezahualcoyotl's
    friendship, and the prince was warned by a courtier to flee.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Maxtla set a snare for Nezahualcoyotl's life during an evening function, but
    the prince's preceptor frustrated the plot by substituting a similar-looking youth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Maxtla then sent a military force to Tezcuco with orders to kill Nezahualcoyotl;
    although warned, the prince decided to await them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: When the force arrived, Nezahualcoyotl was playing tlachtli, invited them
    in to eat, moved to another room, and escaped while incense from a large censer
    hid his movements.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Nezahualcoyotl entered a subterranean passage leading to a large disused water-pipe
    and escaped through it.
  category: action
  evidence_refs:
  - ev:8
