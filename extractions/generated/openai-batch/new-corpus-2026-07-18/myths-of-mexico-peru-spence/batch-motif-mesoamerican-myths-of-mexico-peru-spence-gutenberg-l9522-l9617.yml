canonical_text:
  quote: ''
  summary: The passage describes later Peruvian theological concepts of earth, thunder,
    and creative agency; explains Pachacamac and Pachamama as earth-related father
    and mother spirits, sometimes divine mates; describes creator names, images, and
    creation by word; and recounts a Pacari Tampu origin legend involving four siblings,
    mountains, stones, a sealed cave, and an official solar genealogy linking Manco
    Ccapac to Inca authority.
  language: English
  quote_policy: summarized
