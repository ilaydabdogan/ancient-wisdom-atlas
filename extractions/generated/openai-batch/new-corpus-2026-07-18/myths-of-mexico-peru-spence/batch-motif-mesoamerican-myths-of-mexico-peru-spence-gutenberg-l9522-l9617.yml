  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: In later Inca days the creator idea is said to have become a direct ruler
    of the universe named Pachayachachic.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Inca Pachacutic commanded a new temple for the creator-god at Cuzco and
