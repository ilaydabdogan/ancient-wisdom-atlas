- id: obs:1
  text: 'Later Peruvian mythology is said to recognize three first-rank gods: the
    earth, the thunder, and the creative agency.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mamapacha is identified as Earth-Mother, under whose name the ancient Peruvians
    worshipped the earth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pachacamac is described as a spirit of earth who animates things emerging
    from the earth, with spirits of plants and animals proceeding from him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Pachamama is described as mother-spirit of mountains, rocks, and plains; Pachacamac
    is described as father-spirit of grain-bearing plants, animals, birds, and man.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In some localities Pachacamac and Pachamama were worshipped as divine mates.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Conticsi-viracocha is glossed as 'He who gives Origin, or Beginning,' and
