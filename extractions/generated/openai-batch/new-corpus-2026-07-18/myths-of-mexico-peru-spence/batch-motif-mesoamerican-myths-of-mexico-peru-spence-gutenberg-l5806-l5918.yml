  summary: The passage describes structures and reliefs at Palenque, Aké, Itzamal,
    the House of Darkness, and the Palace of Owls. It notes subterranean rooms with
    stone tables interpreted as altars, palace bas-reliefs of priestly and mythological
    figures, a feathered serpent frieze, and the Temple of the Cross altar-piece showing
    a cross or tree rooted in an Earth-mother head, flanked by a priest and acolyte,
    with a sacred turkey at the apex receiving maize-paste offerings.
  language: English
