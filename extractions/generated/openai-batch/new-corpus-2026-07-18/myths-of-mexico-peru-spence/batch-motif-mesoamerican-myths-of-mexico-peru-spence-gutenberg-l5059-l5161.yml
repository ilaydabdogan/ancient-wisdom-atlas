canonical_text:
  quote: ''
  summary: The passage discusses the loss and partial modern recovery of knowledge
    about Maya manuscripts, inscriptions, and glyphic signs. It names surviving codices,
    describes the writing system, compares the absence of a Maya decipherment key
    with the Rosetta stone for Egyptian hieroglyphs, and summarizes proposed interpretations
    of signs for directions, sun/day, moon, month, night, beginning, end, union, division,
    and hand gestures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Native Maya manuscripts and inscriptions are described as presently undeciphered,
    although some early Spanish friars were formerly able to read and write the script.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Central America has no Rosetta-stone-like key and
    that proposed keys have mostly been unavailing.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The principal surviving Maya manuscripts named are the Codex Perezianus, the
    Dresden Codex, and the Troano Codex; they are said to deal principally with Maya
    mythology but not to be accurately decipherable.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The writing system is described as using square, pebble-shaped figures containing
    tangled faces and objects, read from top to bottom and two columns at a time.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bishop Landa attempted to set down a Maya alphabet from native sources, but
    the passage says he destroyed native literary treasures and was deliberately misled
    by natives in revenge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Léon de Rosny and Cyrus Thomas are credited with interpreting signs for the
    four cardinal points; a sign meaning sun is also said to mean day, and Förstemann
    and Schellhas are credited with signs for the moon and a twenty-day month.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Dr. Seler is credited with discovering the sign for night, and Förstemann
    with interpreting symbols for beginning and end.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The symbol for beginning is described as a head with the akbal sign for an
    eye and footsteps or footstep-like spots below it; the end symbol is described
    as a second head containing a sign meaning seventh.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Union is said to be denoted by the sting of a rattlesnake, with the coils
    of the reptile signifying tying together; a neighboring knife figure is said to
    mean division or cutting.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: A hand sign occurs often in manuscripts and inscriptions; a grasping hand
    is interpreted as tying or joining, while a pointing hand is discussed as representing
    lapse of time or futurity.
  category: object
  evidence_refs:
  - ev:9
