canonical_text:
  quote: ''
  summary: The passage describes Tlaloc as the Mexican god of rain and moisture, associated
    with mountains, thunder, lightning, serpents, water, agricultural fertility, offerings,
    sacrifices, festivals, and a watery paradise called Tlalocan. It also describes
    Chalchihuitlicue as his wife, the Tlalocs as his cloud offspring, Mictlan as a
    dark deathly destination, and several communal and household rites intended to
    secure or restore rainfall.
  language: English
  quote_policy: summarized
