canonical_text:
  quote: ''
  summary: The passage recounts traditions about Thonapa as a wandering divine preacher
    who curses communities, destroys an idol, escapes captivity with divine aid, and
    disappears toward the sea. It then begins a myth of Manco Ccapac Inca involving
    a golden staff, siblings, rainbow omens, and a speaking huaca stone that detains
    a brother and sister in the lower regions while foretelling Manco's honour.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thonapa is described as a divine personage, hero-god, or civilising agent
    who preaches in villages beginning in Colla-suya.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Yamquisupa, Thonapa is badly treated, sleeps outdoors wearing a long shirt
    and mantle, carries a book, curses the village, and the village is immersed in
    water and becomes a lake.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A woman-shaped idol on the high hill Cachapucara receives sacrifices; Thonapa
    burns the idol and destroys the hill.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Thonapa curses a wedding-banquet assembly after they refuse to hear his preaching,
    and the people are changed into stones.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Caravaya and Carapucu, Thonapa raises and carries a large cross, preaches
    with tears, and is later taken prisoner near Lake Carapucu after a ritual misunderstanding
    involving water on a chief's daughter's head.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A beautiful youth says he has been sent by Thonapa's divine guardian and releases
    Thonapa from imprisonment.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Thonapa escapes by going down into the lake, with his mantle keeping him above
    the water like a boat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Afterward Thonapa remains on the rock of Titicaca, goes to Tiya-manacu, again
    curses people and turns them into stones, then follows the river Chacamarca to
    the sea and disappears.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The narrator explicitly compares Thonapa's disappearance with Quetzalcoatl
    and interprets him as a solar deity or man of the sun.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: When Manco Ccapac Inca is born, a staff given to his father turns into gold.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Manco Ccapac has seven brothers and sisters and, after his father's death,
    gathers his people while preparing clothing, weapons, a golden staff called tapac-yauri,
    and two golden cups called tapacusi from which Thonapa had drunk.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Manco Ccapac and his companions go to the highest point of the country, a
    mountain where the sun rises; he sees rainbows, interprets them as signs of good
    fortune, and sings a song of joy.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Manco Ccapac finds a missing brother and sister nearly dead beside a huaca
    stone, and they say the stone prevents them from moving.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Manco Ccapac strikes the huaca stone with the golden staff; the stone speaks,
    says the staff gives him power over it, says the siblings sinned and must remain
    with it in the lower regions, and says Manco will be greatly honoured.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Manco Ccapac is grieved by his siblings' fate but receives comfort and strength
    from the rainbows when he returns to the place where he first saw them.
  category: sequence
  evidence_refs:
  - ev:10
