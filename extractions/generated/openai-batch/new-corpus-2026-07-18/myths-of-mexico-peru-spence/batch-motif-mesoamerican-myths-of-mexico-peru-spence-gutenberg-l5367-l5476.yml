candidate_motifs:
- id: motif:1
  label: Calendar-governed divine order
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage states that Maya mythology is based almost entirely on the calendar,
    with the ritual year divided into heavenly quarters and ritual weeks supervised
    by deities.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage describes a calendrical system rather than narrating a mythic
    episode.
- id: motif:2
  label: Four-directional cosmic support and rain distribution
  taxonomy_refs:
  - world_center
  basis: The Bacabs uphold the heavens in four sky quarters, with colours and directions,
    and the passage connects fourfold directionality with rain emanating from compass
    points.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The available taxonomy has no exact four-directions or sky-bearer motif;
    world_center is only an approximate family reference.
- id: motif:3
  label: Solar culture-hero from the east
  taxonomy_refs:
  - culture_hero
  basis: The passage says hero-gods from the east bring culture and enlightenment,
    naming Votan and Kabil as solar civilising men, with Kabil initiating writing
    and architecture.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage summarizes rather than narrates the deeds of these figures.
- id: motif:4
  label: Death realm journey obstructed by bat-god
  taxonomy_refs:
  - afterlife_journey_map
  - hero_descent
  basis: Zotzilaha Chimalman/Camazotz dwells in a cavern on the way to darkness and
    death and attempts to bar the journey of hero-gods across those realms.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The specific Popol Vuh episode is only summarized in this passage.
- id: motif:5
  label: Birth-death linkage in death-god imagery
  taxonomy_refs:
  - death_rebirth
  basis: God A, a death-god, wears a snail-symbol identified as a sign of birth, which
    the passage says may typify a connection between birth and death.
  evidence_refs:
  - ev:16
  - ev:19
  confidence: medium
  cautions: The birth-death interpretation is explicitly marked as tentative by the
    passage's wording.
- id: motif:6
  label: Westward departure of the dead with the setting sun
  taxonomy_refs:
  - afterlife_journey_map
  basis: God A presides over the west, described as the home of the dead and the region
    toward which the dead depart with the setting sun.
  evidence_refs:
  - ev:18
  confidence: high
  cautions: This is a cosmological statement rather than a full afterlife narrative.
- id: motif:7
  label: Sacrificial death insignia
  taxonomy_refs:
  - sacrifice
  basis: The hieroglyph of God A includes a corpse's head, skull, and sacrificial
    knife, alongside other death imagery.
  evidence_refs:
  - ev:17
  confidence: medium
  cautions: The passage mentions a sacrificial knife symbol but does not describe
    a sacrificial action.
