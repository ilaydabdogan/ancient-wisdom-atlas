canonical_text:
  quote: ''
  summary: 'The passage surveys selected Maya deities and cosmological patterns: a
    calendar-based ritual order; celestial gods such as Kinich-ahau and Itzamna; Chac,
    Ekchuah, Ix ch''el, Ix chebel yax, and the Bacabs; limited Maya polytheism and
    Hunabku; solar culture-heroes such as Votan and Kabil; the bat-god Zotzilaha Chimalman/Camazotz
    associated with caves, death, and the Popol Vuh; and a codex figure called God
    A, described as a death-god with corpse, skull, cross-bone, snail, Cimi, westward,
    and sacrificial-knife associations.'
  language: English
  quote_policy: summarized
