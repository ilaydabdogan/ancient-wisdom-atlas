canonical_text:
  quote: ''
  summary: 'The passage describes several Mexican/Nahua-associated deities and festivals:
    Totec as a borrowed solar deity honored at a spring equinox festival involving
    symbolic sacrifice, maize offerings, and solar imagery; Tepeyollotl as a mountain,
    earth, earthquake, jaguar, echo, and post-flood-associated deity; Macuilxochitl/Xochipilli
    as a flower-named patron of gaming luck with Zapotec iconography and a festival
    of fasting, dancing, offerings, and sacrifice; and Ometecutli with Omeciuatl as
    primordial father and mother gods, Lords of Duality, associated with human origins
    and male/female cosmic principles.'
  language: English
  quote_policy: summarized
