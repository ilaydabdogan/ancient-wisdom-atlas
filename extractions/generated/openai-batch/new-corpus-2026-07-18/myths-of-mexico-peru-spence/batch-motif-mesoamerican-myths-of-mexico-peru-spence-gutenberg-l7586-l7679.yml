canonical_text:
  quote: ''
  summary: The passage describes carved lintels and frescoes in Prince Coh's memorial
    or funeral chamber. The lintel shows the antagonism of the brothers Aac and Coh,
    with totemic signs, weapons, badges, a sun disk for Aac, and a feathered serpent
    associated with Coh. The chamber frescoes depict Queen Móo as a child consulting
    a h-men who reads fate from an armadillo shell heated on a brazier, and later
    as a young woman whose suitor seeks permission to marry her. Móo refuses, and
    the h-men states that royal custom requires her to marry one of her brothers.
  language: English
  quote_policy: summarized
