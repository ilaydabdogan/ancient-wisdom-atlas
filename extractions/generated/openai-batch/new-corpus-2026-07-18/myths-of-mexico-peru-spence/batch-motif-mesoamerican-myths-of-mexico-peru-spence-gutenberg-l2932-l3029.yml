canonical_text:
  quote: ''
  summary: The passage describes a snake-girdled image of Chicomecohuatl with a frog
    carved underneath, recounts its rediscovery and disputed identification as Teoyaominqui
    or Huitzilopochtli, and discusses duplicated divine features and two-prefixed
    deity names. It then describes offerings to Centeotl, including a sacrificed victim’s
    aloe-fibre ritual dress, blood offering, tasting of soil, the relation of Centeotl
    the son to the earth-mother Teteoinnan, and the wearing of the victim’s skin by
    priests.
  language: English
  quote_policy: summarized
