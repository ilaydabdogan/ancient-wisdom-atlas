canonical_text:
  quote: ''
  summary: The passage explains Huitzilopochtli through hummingbird, serpent, lightning,
    war, and crop-fertility associations; describes his iconography and relation to
    sacrificial combat; says he led the Aztecs to Mexico; describes his connection
    with Tlaloc and crop weather; summarizes a Toxcatl rite involving a dough image
    pierced to signify death until next year's resurrection; and notes the authority
    of his priesthood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Huitzilopochtli's name is explained as meaning “Humming-bird to the left,”
    because he wore hummingbird feathers on his left leg.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that, among American tribes especially in the northern
    continent, the serpent is venerated as a symbol of wisdom and magic, connected
    with success in war, lightning, the divine spear, and warlike might.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Atatarho is described as a mythical Iroquois wizard-king clothed with living
    serpents, and this is linked by the passage to Coatlantona, Huitzilopochtli's
    mother, whose name is glossed as “Robe of Serpents.”
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Huitzilopochtli's image is described as surrounded by serpents, resting on
    serpent-shaped supporters, holding a snake sceptre, and having a serpent-skin
    drum.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says that in American mythology the serpent is closely associated
    with the bird, gives Quetzalcoatl as “Feathered Serpent,” and places Huitzilopochtli
    among such bird-serpent unifications.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Huitzilopochtli is described as arising from the ideas of the serpent as warlike
    wisdom and might and of the hummingbird as harbinger of summer, the season when
    the snake or lightning god affects crops.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Huitzilopochtli is represented with a hummingbird-feather plume, blue-striped
    face and limbs, four spears in his right hand, a shield in his left, and a down-tipped
    spear.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The shield is described as reed-made, covered with eagle's down, and bearing
