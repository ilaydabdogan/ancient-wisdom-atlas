canonical_text:
  quote: ''
  summary: The passage describes the city of Mexico at the conquest, its lake setting,
    fourfold cardinal roadways, canals, residences, and temple pyramids. It gives
    an extended account of the great teocalli of Huitzilopochtli, including serpent-decorated
    walls, summit sanctuaries, sacrifice stones, blood, a carefully guarded fire,
    sacred braziers, and the Tzompantli or Pyramid of Skulls. It then surveys Nahua
    and related architectural ruins, including Mitla, Casas Grandes, and Quemada,
    with comparisons to Maya and Southwestern architectural contexts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the conquest, the city of Mexico is described as large, populous, situated
    amid Lake Tezcuco, and surrounded by other towns on islands or lake margins.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The city was intersected by four major roadways set at right angles and aligned
    four-square with the cardinal points; canals served traffic, and principal ways
    extended as dykes or viaducts across the lake.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Teocallis are described as high places: stone pyramids built platform on
    platform, with a staircase to a summit shrine containing a tutelar deity.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The great temple of Huitzilopochtli, attributed to King Ahuizotl, is described
    as the greatest of the votive piles.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The enclosing walls of the temple were decorated with carvings of intertwined
    reptiles and were called coetpantli, or walls of serpents.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The teocalli had multiple platforms, a circling flight of 340 steps, two three-storied
    summit towers, statues of tutelar deities, and jasper stones of sacrifice.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Conquistadores who entered the sanctuaries reported an appearance and odour
    like shambles, with human blood bespattered everywhere.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A fire burned in the sanctuary; its extinction was said to threaten the end
    of Nahua power, and it was tended with scrupulous care. Six hundred sacred braziers
    are said to have been kept alight in Mexico alone.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Tzompantli or Pyramid of Skulls held relics of victims to Huitzilopochtli,
    and Spanish conquerors are said to have counted 136,000 human skulls there.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The temple court contained dwellings of thousands of priests whose duties
    included careful maintenance of the temple precincts.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says Mexico is less rich in architectural antiquities than Guatemala
