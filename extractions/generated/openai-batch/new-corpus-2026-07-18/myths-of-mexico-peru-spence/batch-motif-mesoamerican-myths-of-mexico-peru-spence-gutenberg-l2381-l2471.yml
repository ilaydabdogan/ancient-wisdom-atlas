canonical_text:
  quote: ''
  summary: 'The passage describes the Toxcatl festival for Tezcatlipoca, in which
    a selected captive impersonates the god for a year, receives honors and companions,
    and is then sacrificed. It then recounts the birth myth of Huitzilopochtli: Coatlicue
    conceives after receiving a brightly colored feather ball from above, her children
    plot to kill her, the unborn Huitzilopochtli speaks and receives warnings, and
    the armed newborn defeats Coyolxauhqui and the Centzonuitznaua at Coatepec.'
  language: English
  quote_policy: summarized
