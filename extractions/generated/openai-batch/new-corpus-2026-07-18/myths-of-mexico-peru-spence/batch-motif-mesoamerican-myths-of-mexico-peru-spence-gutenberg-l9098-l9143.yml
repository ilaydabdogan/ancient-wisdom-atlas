canonical_text:
  quote: ''
  summary: After Huaina's death, his sons Huascar and Atauhuallpa contest rule. The
    passage discusses rival claims based on divided dominion, Quito, and maternal
    status, rejects some chronicler traditions about their mothers, describes revolt
    against Huascar and Atauhuallpa's military success, reports Huascar's capture
    and the landing of the Spaniards, and closes with an authorial criticism of Inca
    despotism.
  language: English
  quote_policy: summarized
