canonical_text:
  quote: ''
  summary: The passage surveys legends of early European or eastern contact with America,
    including St. Brandan's ocean voyage, Norse accounts of Greater Ireland or White
    Man's Land, the Welsh legend of Madoc, and an American belief that strangers from
    the east had once visited and returned to the Land of Sunrise. It then summarizes
    Quetzalcoatl as an eastern visitor who landed at Vera Cruz, taught arts and civilisation,
    departed on a magic raft with a promise to return, and was later associated by
    some Mexicans with Cortés and by some chroniclers with Apostle St. Thomas.
  language: English
  quote_policy: summarized
