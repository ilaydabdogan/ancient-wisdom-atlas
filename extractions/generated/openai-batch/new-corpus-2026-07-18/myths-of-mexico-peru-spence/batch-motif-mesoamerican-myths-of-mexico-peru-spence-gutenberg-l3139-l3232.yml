canonical_text:
  quote: ''
  summary: The passage describes Mexican fire worship centered on Xiuhtecutli, the
    underworld deity Mictlantecutli and Mictlan, worship and symbolism of Venus as
    Citlalpol or Tlauizcalpantecutli, and sun worship involving heart and blood offerings
    to sustain the sun's daily course.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fire deity is named Tata, Huehueteotl, and Xiuhtecutli.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Xiuhtecutli is represented with the colour of fire, a black face, green-feather
    headdress, a yellow serpent on his back, and a gold mirror.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the yellow serpent typifies the serpentine nature
    of fire and that the gold mirror shows connection with the sun as the source of
    heat.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mexican families offered Xiuhtecutli bread and drink in the morning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Xiuhtecutli is described as a deity of thunderbolts, conflagrations, and the
    domestic hearth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:6
  text: Once yearly the fire in every Mexican house was extinguished and rekindled
    by friction before Xiuhtecutli's idol.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A Mexican baby underwent a baptism of fire on the fourth day after birth,
    while a birth-kindled fire was kept burning to nourish its existence.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Mictlantecutli is described as God of the Dead and of the shadowy realm to
    which human souls go after mortal life.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Mictlantecutli is represented as a grisly monster with a capacious mouth into
    which spirits of the dead fall.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: Mictlan is also called Tlalxicco, meaning Navel of the Earth, and is generally
    located by the passage in the far north, associated with famine, desolation, and
    death.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: Those not drowned, not dead in warrior death, and women not dead in childbed
    are said to pass a dreary existence in Mictlan.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: Mictlan is surrounded by demons called tzitzimimes and is associated with
    a spouse named Mictecaciuatl.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: The passage says Mictlan was probably represented by the bat, described as
    an animal typical of the underworld.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage refers to a journey of the soul to Mictlan and ordeals the dead
    spirit had to pass before entering the realm.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The Mexicans designated Venus as Citlalpol, the Great Star, and Tlauizcalpantecutli,
    Lord of the Dawn.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:16
  text: Venus is described as the only star worshipped by the Mexicans and as highly
    venerated.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:17
  text: At the rising of Venus, chimneys were stopped so that harm would not enter
    with its light.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: A column called Ilhuicatlan stood in the great temple court with a symbol
    of Venus painted on it, and captives were sacrificed before it when Venus reappeared.
  category: object
  evidence_refs:
  - ev:6
- id: obs:19
  text: A myth states that Quetzalcoatl's heart flew upward from his funeral pyre
    and became Venus.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:20
  text: The passage states that the chronology of the Quetzalcoatl-Venus myth relative
    to Nahua adoption of Venus worship is uncertain.
  category: other
  evidence_refs:
  - ev:7
- id: obs:21
  text: Tlauizcalpantecutli is represented in the tonalamatl as lord of a ninth thirteen-day
    division beginning with Ce Coatl, One Serpent.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:22
  text: Tlauizcalpantecutli is represented with a white body, red stripes, black eye-surrounding
    paint, white circles, and vermilion lips.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:23
  text: The passage interprets Tlauizcalpantecutli's whiteness as the half-light of
    Venus, black facial paint as night sky, and the eye as light.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:24
  text: As evening star, Tlauizcalpantecutli is sometimes shown with a skull face
    to signify descent into the underworld following the sun.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:25
  text: The passage states that the Mexicans and Maya carefully observed the periods
    of Venus's revolution.
  category: action
  evidence_refs:
  - ev:9
- id: obs:26
  text: The sun is described as the supreme deity or principal source of subsistence
    and life for Nahua and other Mexican and Central American peoples.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:27
  text: The sun is called teotl and Ipalnemohuani, He by whom Men Live.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:28
  text: The heart is described as the sun's special sacrifice and the symbol of life.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:29
  text: Hearts of animals and human victims were held up to the sun before other ritual
    handling.
  category: action
  evidence_refs:
  - ev:11
- id: obs:30
  text: Blood is described as food that sustains the sun's daily journey through the
