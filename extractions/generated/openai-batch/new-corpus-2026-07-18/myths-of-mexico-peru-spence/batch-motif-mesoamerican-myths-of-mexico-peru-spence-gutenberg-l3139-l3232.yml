comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Xiuhtecutli with Vulcan in the shared function
    of deity of thunderbolts and conflagrations, while also stressing Xiuhtecutli's
    domestic hearth role.
  claim_level: same_function
  target: Vulcan
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: This is the author's analogy; the passage does not claim historical
    contact or common inheritance.
- id: claim:2
  claim: The passage anticipates an analogous Maya underworld deity and connects Mictlan
    with the bat as an underworld animal.
  claim_level: same_function
  target: analogous Maya underworld deity
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: low
  limitations: The Maya deity is not named or described in this passage, and the statement
    points to later discussion outside the excerpt.
- id: claim:3
  claim: The passage groups Mexican and Maya traditions as both carefully observing
    Venus's periods of revolution.
  claim_level: same_function
  target: Maya Venus observation
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The shared point is astronomical observation; the passage does not
    state identical Venus rites or myths for both groups.
- id: claim:4
  claim: The passage presents solar life-source worship as shared broadly by Nahua
    and other Mexican and Central American peoples.
  claim_level: same_function
  target: Mexican and Central American solar worship broadly
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The statement is broad and does not differentiate individual cultures
    or local variants.
