canonical_text:
  quote: Xibalba was thus the "Place of Phantoms."
  summary: The passage recounts Hun-Apu and Xbalanque passing through dangerous houses
    in Xibalba, Hun-Apu's decapitation and restoration, the brothers' staged deaths
    and returns, their killing and punishment of the Xibalban rulers, and the translation
    of Hunhun-Apu and Vukub-Hunapu to the sky as sun and moon. It then offers comparative
    and historical commentary on Xibalba as a place of the dead and on the Xibalbans
    as phantoms or former cave-dwellers rather than devils or gods.
  language: English
  quote_policy: quoted
