canonical_text:
  quote: ''
  summary: 'The passage first describes funerary treatment involving burial in an
    earthen vessel and, among the Roamaynas, later washing and reburial of bones.
    It then presents two Peruvian myths: Yupanqui sees a solar figure in a crystal
    at a fountain and later institutes worship of a sun statue; and a Canaris origin
    myth in which two brothers survive a deluge on a rising mountain, encounter bird-women
    who bring food, and become ancestors of the Canaris through a captured younger
    bird-woman.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A body with insignia is placed in a large earthen vessel or painted jar, buried,
    covered with potter's clay, and leveled with the ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the obsequies, visitors avoid the grave and the warrior's name is forgotten.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Roamaynas disinter their dead after the fleshy parts are thought consumed,
    wash the bones, and place the skeleton in a clay coffin adorned with symbols of
    death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Roamaynas carry the skeleton home for respectful memory, then after about
    a year inhumate the bones again and forget the individual forever.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before becoming sovereign, Inca Yupanqui travels to visit his father, Viracocha
    Inca, and arrives at the fountain called Susur-pugaio.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the fountain, Yupanqui sees a crystal fall into the water; within it is
    an Indian figure with three bright rays, Inca-like royal dress, serpents around
    the arms and shoulders, and lion imagery.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Yupanqui is frightened and begins to run away, but a voice calls him by name
    and tells him not to fear.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The voice identifies the figure as Yupanqui's father, the sun, foretells that
    he will conquer many nations, and commands sacrifices, revenues, and reverence.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The figure vanishes, the crystal remains, and Yupanqui later sees all he wishes
    in it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After becoming king, Yupanqui has a sun statue made to resemble the figure
    and orders conquered tribes to build temples and worship the new deity instead
    of the creator.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the Canaris origin myth, two brothers flee a deluge to the high mountain
    Huacaquan, and as the waters rise the hill rises too, allowing them to escape
    drowning.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the flood, the brothers build a tiny house, live on herbs and roots,
    and repeatedly find food and chicha prepared for them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The elder brother hides and sees two quacamayo birds, Aqua and Torito, dressed
    as Canaris; when he sees their beautiful faces and discovers them to be women,
    they become angry and fly away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The younger brother later hides, closes the door, and prevents the younger
    bird-woman from escaping.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The younger bird-woman lives with the brothers for a long time and becomes
    mother of six sons and daughters, from whom all the Canaris proceed.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: The Canaris revere quacamayo birds and use their feathers at festivals.
  category: action
  evidence_refs:
  - ev:11
