canonical_text:
  quote: ''
  summary: The passage describes Mexican beliefs about successive destroyed suns,
    the need to sustain the current sun with human sacrifice, Aztec warrior practices
    for obtaining captives, the Nauhollin rites in the House of the Eagles, the Quauhxicalli
    sacrificial stone and temalacatl ordeal stone, and a warrior afterlife in the
    service of the sun.
  language: English
  quote_policy: summarized
