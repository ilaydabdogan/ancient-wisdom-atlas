literal_observations:
- id: obs:1
  text: The Incas are described as rulers of Peru; the Inca is described as representative
    of the sun, and the moon as the mythic mother of the dynasty.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Several Peruvian entries name sun-related institutions or ritual settings:
    a building sacred to the sun, a date-marking device for sun-festivals, the Great
    Feast of the Sun, and a Field of the Sun.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ipalnemohuani is listed as a Mexican name of the sun-god.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Iqi-Balam and Mahacutah are listed as first men in the Popol Vuh myth, and
    Kiche creation and origin traditions are linked to the Popol Vuh.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Itzamna is described as a Maya moon-god, father of gods and men, tutelar of
    the west, founder of Itzamal, and also called Kab-ul, the Miraculous Hand.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage lists Maya and Mexican healing or medicine deities, including
    Ix ch'el and Ixtlilton.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Iztacmixcohuatl is listed as father of Quetzalcoatl; Quetzalcoatl is also
    connected with the title Man of the Sun, and Kukulcan is described as the Maya
    form of Quetzalcoatl.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Jaguar-Snake is listed as a Mixtec deer-goddess in a creation-myth, and a
    semi-historical Maya empire is called the Kingdom of the Great Snake.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The song called Kamucu is associated with the first appearance of the sun
    and with the death of the first men.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Kinich-ahau is listed as a Maya sun-god of Yucatan, and Kinich-Kakmo is identified
    with him.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Maize-gods are listed for both Mexican and Peruvian contexts, and Mamas are
    described as tutelary spirits of maize and other plants in Peru.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Mama-cocha is described as Mother-sea, Mamacota as a name for Lake Titicaca,
    and Mamapacha or Pachamama as the Peruvian earth-goddess.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: Manco Ccapac is described as a divine being, son of the Life-giver, sent to
    instruct the primitive Peruvians; he is also listed as the first Inca and regarded
    as son of the sun.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: Ki Pixab, meaning Corner of the Earth, is listed as the Kiche name for their
    land of origin.
  category: setting
  evidence_refs:
  - ev:14
- id: obs:15
  text: Izpuzteque is listed as a demon in the Mexican Other-world.
  category: attribute
  evidence_refs:
  - ev:15
