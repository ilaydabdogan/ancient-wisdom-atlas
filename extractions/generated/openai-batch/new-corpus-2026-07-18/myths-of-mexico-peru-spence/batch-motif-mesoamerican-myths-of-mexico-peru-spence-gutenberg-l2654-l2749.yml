canonical_text:
  quote: ''
  summary: The passage first compares Tlaloc with other indigenous American storm
    or rain deities. It then recounts Quetzalcoatl as a Toltec-associated deity and
    ruler who promotes the arts, is deceived and intoxicated by Tezcatlipoca, loses
    chastity with Quetzalpetlatl, is banished, alters the country during exile, and
    departs east on a raft of serpents. Variant accounts describe his self-immolation,
    transformation of ashes into birds, heart becoming the morning star, underworld
    wandering, resurrection, and divine enthronement. The passage also summarizes
    scholarly theories identifying him with the sun, air or wind, dual wind/fire/light
    qualities, dawn heroes, or a culture-hero tradition, while expressing caution
    about some of these theories.
  language: English
  quote_policy: summarized
