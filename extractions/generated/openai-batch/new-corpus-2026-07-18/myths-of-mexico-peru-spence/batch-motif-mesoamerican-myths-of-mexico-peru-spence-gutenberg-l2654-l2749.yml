  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Quetzalcoatl is described as probably a pre-Nahua deity, regarded by the Aztecs
    as somewhat alien, with especially flourishing worship in Cholula and older towns.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Legend calls Quetzalcoatl the Father of the Toltecs and the seventh and youngest
    son of Iztacmixcohuatl; his name is glossed as Feathered Serpent or Feathered
    Staff.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Quetzalcoatl became ruler of Tollan and promoted cultivated and liberal arts
    during his reign.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The magicians Tezcatlipoca and Coyotlinaual visit the country after Quetzalcoatl's
    reign has established the arts.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tezcatlipoca descends from the sky in the shape of a spider by a fine web
    and offers Quetzalcoatl a draught of pulque.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The draught intoxicates Quetzalcoatl, after which he forgets his chastity
    with Quetzalpetlatl and receives banishment as his doom.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: During exile, Quetzalcoatl hides gold and silver treasures, burns his palaces,
    transforms cacao trees into mezquites, and banishes birds from the neighborhood
    of Tollan.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Quetzalcoatl refuses the magicians' request to return because the sun requires
    his presence, then proceeds to Tabasco or Tlapallan and floats east on a raft
    made of serpents.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Other accounts say Quetzalcoatl casts himself on a funeral pyre, is consumed,
    his ashes fly upward and become brilliant birds, and his heart becomes the morning
    star.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Mexicans are reported to say that Quetzalcoatl is invisible for four days
    after death, wanders in the underworld for eight days, and then resurrects when
    the morning star appears.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Some authorities interpret Quetzalcoatl as a sun god, but the passage states
