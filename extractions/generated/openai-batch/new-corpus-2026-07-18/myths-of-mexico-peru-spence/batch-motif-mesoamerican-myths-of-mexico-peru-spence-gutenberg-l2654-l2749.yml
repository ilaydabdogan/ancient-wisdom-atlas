    nature.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Brinton is quoted as describing Quetzalcoatl as lord of eastern light and
    winds and as comparing him with dawn heroes.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage describes the theory of Quetzalcoatl as an actually existing culture-hero
