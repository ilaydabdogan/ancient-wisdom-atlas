candidate_motifs:
- id: motif:1
  label: American rain or storm deity resemblance
  taxonomy_refs: []
  basis: Tlaloc is explicitly compared with Hurakan, Pillan, and Con, with emphasis
    on rain-making rather than thunder.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage states resemblance but also notes a functional difference
    between Tlaloc's rain-making emphasis and the thunderous powers of the compared
    deities.
- id: motif:2
  label: Civilizing divine ruler or culture patron
  taxonomy_refs:
  - culture_hero
  basis: Quetzalcoatl rules Tollan and advances his people by encouraging cultivated
    and liberal arts.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage later rejects the theory that Quetzalcoatl derives from an
    actually existing culture-hero; the motif is extracted only as a narrative function
    in this passage.
- id: motif:3
  label: Trickster-like deception through intoxicating drink
  taxonomy_refs:
  - trickster_boundary
  basis: Tezcatlipoca descends in spider form and gives Quetzalcoatl pulque, which
    intoxicates him and leads to a chastity lapse and banishment.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage calls Tezcatlipoca a cunning magician but does not itself
    use the term trickster.
- id: motif:4
  label: Exile and eastward departure of a deity
  taxonomy_refs:
  - departure
  basis: Quetzalcoatl is banished, refuses to return, proceeds to Tlapallan, and floats
    east on a raft of serpents.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives this as one version and notes that a slightly different
