canonical_text:
  quote: ''
  summary: A colonial-era account describes a handed-down belief in a vast damp underground
    cavern with supporting pillars. Christian prelates enter the cave with torch-bearing
    companions, ropes, and firebrands; they descend steps, encounter buttresses, foul
    damp air, wind, and poisonous reptiles, withdraw, and wall up the entrance called
    a back door of hell. The passage then describes aboveground chambers associated
    with a high-priest, priests, the king, chieftains, temple furnishings, food, and
    restricted intoxicating drinks.
  language: English
  quote_policy: summarized
