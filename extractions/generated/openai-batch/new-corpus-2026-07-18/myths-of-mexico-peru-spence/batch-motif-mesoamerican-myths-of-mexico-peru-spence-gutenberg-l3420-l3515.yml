- id: ev:8
  type: summary
  locator: 3469-3475
  quote_or_summary: The moon is described as recorder of harvests with supremacy over
    water; Citatli and Atl are blended in Nahua myth; Metztli leads Nanahuatl the
    Leprous to a pyre, interpreted as dawn consuming the starry sky in the rising
    sun's fires.
