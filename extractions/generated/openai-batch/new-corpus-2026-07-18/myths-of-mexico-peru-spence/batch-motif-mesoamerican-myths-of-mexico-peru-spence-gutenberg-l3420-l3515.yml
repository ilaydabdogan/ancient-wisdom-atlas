canonical_text:
  quote: ''
  summary: The passage describes Mexican pulque deities associated with intoxication,
    rabbits, specific dangers of drunkenness, local patronage, soil fertility, harvest
    drinking, and iconographic marks. It then treats Metztli as a moon goddess linked
    with harvests, growth, water, night, and Nanahuatl's pyre. Finally it describes
    Tlazolteotl as an earth-goddess and eradicator of sin, together with a confession
    rite involving Tezcatlipoca, the Tonalamatl, offerings, incense, and an address
    to fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person intoxicated with pulque was believed to be under the influence of
    a god or spirit.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pulque is described as a native Mexican liquor made from the juice of Agave
    Americana.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The commonest worshipped form of the drink-god was the rabbit, and the rabbit
    is said to have been regarded as devoid of sense.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The desired scale of debauchery was indicated by the number of rabbits worshipped,
    with four hundred as the highest and most extreme degree of intoxication.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Specific drink deities were sacrificed to or placated in relation to feared
    consequences of intoxication, including accidental hanging, drowning, and punishment
    limited to a headache.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The calendar day Ometochtli means Two-Rabbit, was under special protection
    of the pulque-gods, and was believed to doom one born on it almost inevitably
    to drunkenness.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The pulque-gods are said to have been closely associated with the soil and
    the earth-goddess and to share the crescent yaca-metztli ornament and red-and-black
    coloring on faces and sacred objects.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: After harvesting maize, the Indians drank to intoxication and invoked one
    or another of the pulque-gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tepoxtecatl is described or depicted with a two-colored face, crescent-shaped
    nose ornament, bicolored shield, long necklace made from malinalli herb, and ear-pendants.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The drink-gods are described as of the same class as the food-gods and as
    patrons of fruitful soil, while the passage notes that the drink-gods are male
    and the food-gods mostly female.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Metztli, or Yohualticitl, is identified as the Mexican goddess of the moon
    and Lady of Night, with a beneficent phase connected to harvests and growth and
    another phase connected to dampness, cold, miasmic airs, ghosts, night shapes,
    and silence.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The moon is described as a recorder of harvests and as having supremacy over
    water, while Citatli and Atl are said to be confounded and blended in Nahua myth.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Metztli is said to have led Nanahuatl the Leprous to the pyre where he perished,
    which the passage presents as a reference to dawn consuming the starry sky in
    the fires of the rising sun.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Tlazolteotl, or Tlaelquani, is called an earth-goddess and eradicator of sins,
    and people went to her priests to confess and be absolved.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Sin is described as symbolized by excrement, and confession is said to cover
    sins of immorality.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: Tlazolteotl is also described as patroness of desire and luxury.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: In the described confession process, the confessor opened the Tonalamatl and
    selected a suitable day for confession.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: On the chosen day, the penitent brought a mat, copal gum, and wood; fire and
    incense were lit; and the penitent addressed the fire as lord, father and mother
    of the gods, and ancient one.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
