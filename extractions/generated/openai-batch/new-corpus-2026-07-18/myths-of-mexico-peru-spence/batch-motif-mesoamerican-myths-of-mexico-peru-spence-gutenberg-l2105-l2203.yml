canonical_text:
  quote: ''
  summary: The passage recounts a plot against Quetzalcoatl, the Toltecs, and Tollan.
    Tezcatlipoca, with other named deities, lays enchantments, deceives and intoxicates
    Quetzalcoatl, assumes the form of Toueyo to enter Uemac’s household and marry
    Uemac’s daughter, wins military honors, and later causes mass deaths through a
    frenzied dance, petrification, and an attack at Xochitla.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A formerly blissful state involving Quetzalcoatl and the Toltecs is said to
    become the target of three wicked “necromancers” who plot its downfall.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies the three “necromancers” with Huitzilopochtli, Tezcatlipoca
    or Titlacahuan, and Tlacahuepan, described as gods of invading Nahua tribes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The named deities lay evil enchantments on Tollan, and Tezcatlipoca is described
    as taking the lead in the conspiracies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Tezcatlipoca appears at Quetzalcoatl’s palace disguised as an aged white-haired
    man and asks to be presented to the king.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Quetzalcoatl is indisposed and initially unable to see visitors; Tezcatlipoca
    gains admittance after waiting outside.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Tezcatlipoca offers Quetzalcoatl a medicinal drink, presses multiple cups
    on him, and the drink is identified as pulque, causing Quetzalcoatl to become
    intoxicated.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tezcatlipoca then takes the form of an Indian named Toueyo or Toveyo and goes
    to the palace of Uemac, temporal chief of the Toltecs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Uemac’s daughter sees the false Toueyo, falls deeply in love with him, and
    becomes seriously ill from longing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Uemac orders Toueyo’s arrest and questions him about his origin, clothing,
    and effect on the daughter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Toueyo says he is a stranger who has come to sell green paint and that his
    scanty clothing follows the custom of his country.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Uemac decides not to kill Toueyo because his daughter would perish, and he
    permits the daughter to wed Toueyo.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The marriage of Toueyo to Uemac’s daughter causes discontent among the Toltecs.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Uemac attempts to distract the Toltecs by making war on Coatepec, and Toueyo
    is placed in ambush in the hope that he will be slain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Toueyo and his men kill many enemies, put them to flight, and Toueyo is honored
    with knightly plumes and red and yellow body paint.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Tezcatlipoca announces a great feast at Tollan, and assembled crowds dance
    and sing to the sound of a drum.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Tezcatlipoca sings to the people and forces them to accompany his rhythm with
    their feet until the dance becomes furious and maddening.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: Some dancers fall into a deep ravine and are changed into rocks; others fall
    from a stone bridge into water and are changed into stones.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: On another occasion Tezcatlipoca appears as a valiant warrior named Tequiua,
    invites inhabitants to the flower-garden Xochitla, attacks them with a hoe, kills
    many, and others crush one another in panic.
  category: sequence
  evidence_refs:
  - ev:8
