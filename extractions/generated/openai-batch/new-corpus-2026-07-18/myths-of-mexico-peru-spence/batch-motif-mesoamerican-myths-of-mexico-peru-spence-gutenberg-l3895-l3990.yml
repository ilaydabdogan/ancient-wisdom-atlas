canonical_text:
  quote: ''
  summary: The passage describes youthful gods making the first tobacco-smoke offering
    and blood sacrifice to their ancestors, a flood among the deer-gods' children
    followed by restoration by the Creator of All Things, Zapotec and Mixtec creator
    figures, a Nahua flood narrative in which Nata and Nena survive in a hollow cypress
    and later trigger divine intervention by making fire, and an Aztec belief that
    first men emerged from Chicomoztoc, the Seven Caverns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Youthful gods make an offering and sacrifice to their ancestors by filling
    clay incense vessels with tobacco, setting it alight, and letting smoke rise heavenward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The brothers make a garden and an adjoining grass-grown level place equipped
    for sacrifice, live there, till it, burn tobacco, and petition their ancestors
    for light, gathered waters, and earth freed from its covering water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: To strengthen their prayer, the brothers pierce their ears and tongues with
    flint knives and sprinkle blood on trees and plants with willow twigs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A flood kills many sons and daughters of the deer-gods; afterward the Creator
    of All Things forms the heavens and the earth and restores the human race.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Zapotec account names Cozaana as creator of beasts and Huichaana as creator
    of men and fishes, presenting separate creations for animals and for humans/fishes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says the names Nine-Snake and Nine-Cave allude to light and darkness
    or day and night, and tentatively compares them with Quetzalcoatl and Xolotl,
    who were regarded as twins.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the cited flood narrative, the mountain is submerged, and the water remains
    tranquil for fifty-two springs.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Titlacahuan forewarns Nata and Nena to stop making pulque, hollow out a large
    cypress, enter it when the water approaches the sky, and eat only one ear of maize
    each.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the water becomes tranquil, Nata and Nena leave the log, see many fish,
    make fire by rubbing wood, and roast fish; celestial gods notice the smoke, and
    Titlacahuan-Tezcatlipoca descends, scolds, and transforms the fish into dogs.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage states that the Aztecs believed the first men emerged from Chicomoztoc,
    the Seven Caverns, north of Mexico, and says similar stories occur among Kiche
    and Peruvian myths.
  category: setting
  evidence_refs:
  - ev:10
