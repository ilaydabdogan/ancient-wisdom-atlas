  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Aztecs had paid tribute to Azcapozalco, but after the conflict they withheld
    it and requested permission to build an aqueduct to bring water into their city.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Tecpanecs refused the aqueduct request, isolated Mexico with an embargo
