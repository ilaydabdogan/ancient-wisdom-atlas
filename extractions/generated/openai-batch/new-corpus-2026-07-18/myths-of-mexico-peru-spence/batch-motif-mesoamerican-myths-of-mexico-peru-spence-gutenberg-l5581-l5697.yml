  summary: 'The passage catalogues several Maya manuscript deities and architectural
    features: a dark old god associated by scholars with Votan or Tepeyollotl; a black
    travellers'' god identified with Ekchuah and compared with Yacatecutli; Uayayab,
    demon of the five unlucky year-end days; an old spinning goddess; a frog-bodied
    water and agricultural deity; and Maya temples raised on mounds or terraces, with
    corbelled openings and ornate façades.'
