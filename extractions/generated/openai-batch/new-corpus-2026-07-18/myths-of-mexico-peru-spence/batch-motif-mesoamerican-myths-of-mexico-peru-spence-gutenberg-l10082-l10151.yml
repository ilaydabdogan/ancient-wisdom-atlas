canonical_text:
  quote: ''
  summary: The passage recounts Coniraya Viracocha as a deceptive supernatural figure
    who disguises himself, impregnates Cavillaca through a lucma fruit, is identified
    as the child's father, pursues Cavillaca until she and the child become stone,
    blesses or curses animals according to their messages, encounters daughters of
    Pachacamac and a serpent, releases fish into the ocean, and resumes trickery.
    It then notes a comparison between Coniraya and Jurupari in impish qualities.
    A second myth tells of a llama warning a man that the sea will rise; the man and
    llama take refuge on Mount Villa-coto with other animals, the waters recede after
    five days, and the surviving man becomes ancestor of the present human race.
  language: English
  quote_policy: summarized
