  summary: The passage describes Nezahualcoyotl’s palace and villa at Tezcotzinco
    in highly idealized terms, including courts, poet halls, gardens, reservoirs,
    statues, carved rocks, waterworks, and royal recreation. It then shifts to a skeptical
    account of ruins, damaged carvings, carved basins, grooves, and possible astronomical
    features observed by a later visitor.
