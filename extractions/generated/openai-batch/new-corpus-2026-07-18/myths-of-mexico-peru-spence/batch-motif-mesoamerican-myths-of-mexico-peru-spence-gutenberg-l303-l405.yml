canonical_text:
  quote: ''
  summary: The passage argues for the indigenous origin and long isolation of the
    civilisations of Mexico, Central America, and Peru. It rejects theories of later
    Asian or European civilising influence, cites American art, language, arithmetic,
    time-reckoning, food plants, and animal domestication as evidence of native development,
    admits only a remote prehistoric Asiatic origin for American aborigines, and dismisses
    traditions of deliberate Asian contact such as the Fu-Sang identification and
    the Coronado ship anecdote.
  language: English
  quote_policy: summarized
