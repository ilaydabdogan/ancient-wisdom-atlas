canonical_text:
  quote: ''
  summary: The passage describes the Coricancha at Cuzco as the principal temple of
    the Peruvian sun-god, richly plated with gold and surrounded by precious-metal
    gardens. It describes a great altar with a jeweled golden plate bearing the sun-god’s
    features and mummified Inca kings seated around it. It also describes nearby temples
    of the moon, rainbow, and Venus, including a silver moon-goddess image and mummified
    Inca queens. The passage then surveys Peruvian mummification, rejects inferred
    Egyptian connection, and describes chulpa tombs, east-facing doors toward the
    rising sun, llama-skin wrappings, and occasional placement of mummies in houses.
  language: English
