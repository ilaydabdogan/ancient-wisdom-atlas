canonical_text:
  quote: ''
  summary: The passage describes Maya sites and monuments at Itzamal and Chichen-Itza,
    including pyramid temples, idols, priestly rites, healing and resurrection at
    Itzamna's temple, bearded deity imagery, colossal heads, animal-human reliefs,
    sacred women, inscriptions, rain-god images, and a drought propitiation well.
    It also recounts a story in which Canek of Chichen abducts a princess from her
    wedding feast and then flees with his vassals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Itzamal, the pyramid of Kinich-Kakmo is described as a chief object of
    interest, with a shrine and glittering idol on its summit.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In times of panic or famine, large numbers came to the Kinich-Kakmo shrine,
    where sacrificial smoke rose and white-robed priests and augurs chanted and prophesied.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: South of the Kinich-Kakmo pyramid stood the ruins of Ppapp-Hol-Chac, described
    as the abode of the chief priest.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Itzamna's temple at Itzamal stood on a lofty pyramid with four roads radiating
    from it toward named regions and Cozumel.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The halt, maimed, blind, and dead were brought to Itzamna's temple for succour
    and resurrection through the deity called Kab-ul, the Miraculous Hand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The road to Cozumel led to a sacred island where Spanish visitors found the
    Maya cross and interpreted it through a Christian St. Thomas tradition.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: A western pyramid was associated with the palace of Hunpictok and a formerly
    visible gigantic face of Hurakan, described as having large moustachios.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage notes frequent depiction of Mexican and Mayan gods and heroes
