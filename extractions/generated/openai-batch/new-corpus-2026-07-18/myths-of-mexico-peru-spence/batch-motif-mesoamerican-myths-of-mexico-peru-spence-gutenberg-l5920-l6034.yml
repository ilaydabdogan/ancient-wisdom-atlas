candidate_motifs:
- id: motif:1
  label: sacrifice at elevated shrine and drought well
  taxonomy_refs:
  - sacrifice
  basis: The passage describes sacrifice at the summit shrine and men cast into a
    well in drought as propitiation to the rain-god.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: high
  cautions: The Kinich-Kakmo rite is summarized generally, while the well rite is
    specifically described as drought propitiation.
- id: motif:2
  label: resurrection sought at a deity's temple
  taxonomy_refs:
  - resurrection
  basis: The halt, maimed, blind, and dead are brought to Itzamna/Kab-ul's temple
    for succour and resurrection.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage reports the faith attributed to worshippers rather than narrating
    a completed resurrection.
- id: motif:3
  label: divine founder of a people or empire
  taxonomy_refs:
  - culture_hero
  basis: Itzamna is called the legendary founder of the Maya Empire.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives only the title and does not narrate founding deeds.
- id: motif:4
  label: central temple with four radiating roads
  taxonomy_refs:
  - world_center
  basis: Itzamna's pyramid temple has four roads radiating from it toward major destinations,
    including the sacred isle of Cozumel.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage does not explicitly interpret the temple as a world center;
    the motif is inferred from spatial arrangement only.
- id: motif:5
  label: abduction of a bride by a rejected lover
  taxonomy_refs:
  - stolen_beloved
  basis: Canek, rejected or displaced by the princess's marriage to a stronger cacique,
    attacks the feast and carries off the bride.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The text presents the tale as reported by Cogolludo and notes uncertainty
    about whether it explains Chichen's abandonment.
- id: motif:6
  label: bearded divine or priestly marker
  taxonomy_refs: []
  basis: The passage repeatedly notes beards and moustaches on gods, heroes, and priests,
    and raises the possibility of artificial or symbolic beards.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: medium
  cautions: The passage itself frames explanations for the beards as speculative.
- id: motif:7
  label: rain propitiation through human offering
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Men are said to have been cast into a well during drought as a propitiation
    to the rain-god.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not describe the full ritual sequence beyond the casting
    into the well and the stated propitiatory purpose.
comparison_claims:
- id: claim:1
  claim: The passage reports that Spaniards interpreted the Maya cross at Cozumel
    through a Christian St. Thomas conversion tradition, but this is presented as
    their supposition.
  claim_level: visual_similarity
  target: Christian cross and St. Thomas discovery/conversion tradition
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: low
  limitations: The passage does not substantiate historical contact or conversion;
    it only reports an interpretation made by the Spaniards.
- id: claim:2
  claim: The human-headed tiger relief is cautiously linked in the passage to Balam-Quitze,
    an ancestor known from the Popol Vuh.
  claim_level: same_motif
  target: Popol Vuh figure Balam-Quitze
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The identification is explicitly qualified as probable, and the passage
    provides only a brief visual description.
- id: claim:3
  claim: The passage compares a possible artificial beard on a Quetzalcoatl priest
    relief to the false hirsute appendages worn by kings in ancient Egypt.
  claim_level: visual_similarity
  target: Ancient Egyptian royal false beard practice
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: low
  limitations: The comparison is framed as a question and a visual analogy; no historical
    contact or shared origin is asserted.
- id: claim:4
  claim: The passage notes that wind-god figures with projecting lips were visually
    mistaken by earlier antiquarians for elephant heads with trunks.
  claim_level: visual_similarity
  target: Elephant-head interpretation of wind-god images
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage treats the elephant interpretation as a mistaken antiquarian
    reading, not as evidence of actual elephant symbolism.
