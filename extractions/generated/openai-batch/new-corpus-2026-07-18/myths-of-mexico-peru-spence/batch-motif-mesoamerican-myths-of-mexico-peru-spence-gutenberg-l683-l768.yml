  quote: ''
  summary: The passage introduces Toltec legends, describes the founding and adornment
    of Tollan, the election of its first monarch, the city’s celebrated artistry,
    the ornate temple and House of Feathers, and later traditions about Huemac II’s
    decline, revolt, omens, sorcery, mass death, petrification, drowning, volcanic
    eruption, and threatening apparitions.
  language: English
