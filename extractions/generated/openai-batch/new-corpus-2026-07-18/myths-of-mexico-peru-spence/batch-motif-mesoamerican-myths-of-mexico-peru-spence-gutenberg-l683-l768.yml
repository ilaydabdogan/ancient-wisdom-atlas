  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A temple in which the high-priest officiated had four apartments decorated
    respectively with gold, precious stones, sea-shells in silver bricks, and red
    stone with shells.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The House of Feathers had four apartments decorated with yellow feathers,
    blue-bird plumage, dazzling white plumage, and brilliant red feathers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Huemac II first ruled with wisdom and attention to state and religion, but
    later lost public regard through deception, intemperance, and licentious habits.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The provinces revolted, and signs and gloomy omens foretold Tollan’s downfall.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Toveyo beat a magic drum late into the night and forced a crowd to dance until
