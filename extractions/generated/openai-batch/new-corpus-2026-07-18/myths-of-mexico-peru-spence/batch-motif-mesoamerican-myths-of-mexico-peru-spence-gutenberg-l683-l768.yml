  text: The narrator presents the Toltec material as native legends and names Zumarraga
    and Ixtlilxochitl as principal sources.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ixtlilxochitl is said to report that the Toltecs founded Tollan in the year
    566, on the site of modern Tula northwest of the mountains bounding the Mexican
    valley.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Toltecs were guided by Hueymatzin, called Great Hand and described as
    a powerful necromancer, and chose to build a city on their bivouac site.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Toltecs worked for six years to build Tollan, producing edifices, palaces,
    and temples of exceptional splendour.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The valley of Tollan was called the Place of Fruits because of its fertility;
    nearby rivers contained fish and surrounding hills sheltered game.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the seventh year of occupying the city, assembled chieftains resolved to
    transfer power to an elected monarch, and Chalchiuh Tlatonac was chosen to reign.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After settlement under a revered king, the Toltecs became widely known for
    craftsmanship, architecture, and pottery; the name Toltec became associated with
