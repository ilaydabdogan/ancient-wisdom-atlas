literal_observations:
- id: obs:1
  text: The passage identifies the Popol Vuh as a volume of Maya-Kiche mythology and
    history and lists its first through fourth books.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first book of the Popol Vuh is indexed as including creation, the downfall
    of man, the story of Vukub-Cakix, the undoing of Zipacna, and the overthrow of
    Cabrakan.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The second book is indexed as including the descent of Hunhun-Apu and Vukub-Hunapu
    to the Underworld, Hunhun-Apu and Xquiq, the birth and exploits of Hun-Apu and
    Xbalanque, and the hero-brothers in Xibalba discomfiting the Lords of Hell.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that a conception in the second book is common to other
    mythologies and links it with dread of death and the conception of death's vanquishment.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The third book is indexed as including the creation of man and woman, gods
    being vouchsafed to man, Tohil providing fire, speech being confounded, migration,
    the sun appearing, and the death of the first men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that the third-book myth resembles myths of other American
    peoples and that its migration story is similar to others.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Quetzalcoatl is glossed as Feathered Serpent or Feathered Staff, identified
    with the Maya Kukulcan, and described as a god of the sun, wind, and thunder common
    to Mexican and Maya mythologies.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Quetzalcoatl entry lists traditions of his Toltec kingship, plots against
    him, his departure from Tollan to Tlapallan, his title Father of the Toltecs,
    his exile, his morning-star connection, and conceptions of him as air, wind, fire,
    light, possible culture-hero, and liberator.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The human-sacrifice entry lists human sacrifice in relation to several festivals,
    deities, Venus worship, sun worship, Maya practice, Mitla, the Chibchas, and Peru;
    it also mentions displacement by substitution of part for whole.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Purunpacha is glossed as the period after the deluge when there was no king
    in Peru.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Quineveyan is glossed as a grotto mentioned in an Aztec migration myth.
  category: setting
  evidence_refs:
  - ev:8
