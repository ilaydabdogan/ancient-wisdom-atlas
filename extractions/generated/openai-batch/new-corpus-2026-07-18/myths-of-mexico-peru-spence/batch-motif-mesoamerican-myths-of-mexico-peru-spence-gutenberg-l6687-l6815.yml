canonical_text:
  quote: ''
  summary: Vukub is deceived by old magicians who remove his emerald teeth and eyes,
    causing his brilliance to vanish and his death; Hun-Apu's arm is restored. Vukub's
    sons Zipacna and Cabrakan are introduced as earth-giants. Four hundred young men,
    aided by Hun-Apu and Xbalanque, attempt to trap Zipacna, but he survives and hurls
    them into the sky, where they remain as the Pleiades. Hun-Apu and Xbalanque later
    lure Zipacna with an artificial crab, bury him beneath a mountain, and turn him
    to stone near Mount Meahuan.
  language: English
  quote_policy: summarized
