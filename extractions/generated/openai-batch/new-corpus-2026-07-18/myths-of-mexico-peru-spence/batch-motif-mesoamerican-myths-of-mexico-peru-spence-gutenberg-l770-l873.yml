canonical_text:
  quote: ''
  summary: The passage recounts the rulers of Tollan attempting to appease angry gods
    with sacrifice, followed by ominous failure, pestilence, divine threats, successive
    plagues, disputed royal succession, civil revolt, a shapeshifting destructive
    apparition at Teotihuacan, and the final collapse and flight of the Toltec state.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rulers of Tollan interpret portents as evidence of divine wrath and ordain
    a large sacrifice of war-captives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the first sacrificial youth is placed on the altar, the priest cannot
    find a heart, the victim's veins are bloodless, and the corpse emits an odor associated
    with a fatal pestilence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Huemac petitions the Tlalocs to spare him and preserve his wealth and rank;
    the Tlalocs reject his request and threaten the Toltec race with six years of
    plagues.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The plagues include killing frost, intense heat, dried streams, melted rocks,
    rain-storms, flooding, tempests, toads, drought, starvation, severe winter, locust
    swarms, hail, and thunder-storms; nine-tenths of the people perish.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Huemac resolves to live more uprightly but announces that Acxitl, his illegitimate
    son, should succeed him, which is described as an offense against the gods because
    early Toltec kings were regarded as divine and royal blood mattered.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Acxitl ascends the throne, initially rules wisely, then turns to dissipation;
    vice spreads through court, priesthood, and society, provoking revolt in outlying
    provinces.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Huehuetzin joins two other malcontent lords and marches on Tollan; Acxitl
    buys off the rebels, while Chichimec groups invade the lake region during Toltec
    civil conflict.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wise men meet at Teotihuacan to appease the gods, but a giant enters, seizes
    many of them, throws them down, and kills them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The same destructive being returns in different guises, including as a beautiful
    child whose head is corrupt and whose stench kills many observers.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The fiend tells the Toltecs that the gods will no longer hear their prayers,
    have resolved to destroy them, and advises them to flee.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Principal families leave the country, Huemac raises a force, Acxitl's mother
    organizes women into a regiment, and Acxitl leads the defense of Tollan.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After three years of defense, the Toltecs flee after a final battle into marshes
    and mountain fastnesses; their cities are destroyed and the Toltec empire ends.
  category: sequence
  evidence_refs:
  - ev:8
