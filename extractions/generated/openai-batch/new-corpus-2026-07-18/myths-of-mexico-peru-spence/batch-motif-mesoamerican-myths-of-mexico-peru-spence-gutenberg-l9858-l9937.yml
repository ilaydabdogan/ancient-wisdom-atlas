canonical_text:
  quote: ''
  summary: The passage describes reported curing and death customs involving mohanes
    or agoreros. A healer treats a patient in adjacent hammocks with rocking, animal
    invocations, powders, herbs, and sucking of diseased parts. If the illness worsens,
    the healer and people chant to the patient’s soul not to go. When death approaches,
    the healer flees; bands address a dying warrior and recount his deeds. Women then
    hasten death by closing the mouth and eyes, wrapping the person in the hammock,
    extinguishing the candle and smoke so the soul cannot find an escape hole, and
    surrounding entrances with filth to keep the soul out. The following section describes
    suffocation, lamentation, masato drinking, destruction or burning of the deceased’s
    possessions, extended exequies for chiefs or warriors, animal-like mourning cries,
    burning of the dwelling, and hair cutting by some relatives.
  language: English
  quote_policy: summarized
