canonical_text:
  quote: ''
  summary: The passage describes a stone monument with above-ground and underground
    chambers, including an underground chapel for idols, priestly rites with vestments
    and incense, human heart sacrifice, penance imposed on petitioners, burial chambers
    for priests and kings, and a rear dark chamber or cavern where bodies and voluntary
    living sacrifices enter the mountain interior in hopes of reaching ancestral feasting-places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The monument is described as having four chambers above ground and four below
    ground, with a front underground chamber serving as chapel and sanctuary for idols
    placed on a great stone altar.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: For important feasts, sacrifices, or the burial of a king or great lord, the
    high-priest descends with a retinue while common people are not allowed to see
    him or look at his face.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The high-priest is dressed in a long white cotton garment, an embroidered
    outer garment, a cap, and feather-woven footwear.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the altar the high-priest bows before the idols, renews incense, murmurs
    to the images, makes grimaces and writhing motions, and then reports a message
    attributed to the spirit or to his own invention.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In human sacrifice, assistants stretch the victim on a large stone, open the
    breast with a stone knife, remove the heart, and carry it to the high-priest so
    he can offer it to the idols by holding it to their mouths.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After a sacrifice, the high-priest may direct petitioners to remain indoors,
    do penance, fast, and avoid women until he declares the gods appeased.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: One underground chamber is described as the burial-place of high-priests,
    and another as the burial-place of the kings of Theozapotlan, who are buried richly
    dressed with ornaments, shield, and javelin.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: At royal burial rites, mourners use mournful instruments, wail, sob, and chant
    the life and exploits of the deceased lord.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The last underground chamber has a rear door leading to a dark room closed
    with a stone slab, through which bodies of victims and fallen great lords or chieftains
    are thrown.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some people oppressed by disease or hardship ask to be accepted as living
    sacrifices and allowed to enter the portal into the dark interior of the mountain
    to seek the feasting-places of their forefathers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After a living sacrifice enters the small door, the stone is rolled back over
    the entrance, and the person is said to die inside from hunger and thirst.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The village is said to be called Liyobaa because of the horrible abyss described
    in the passage.
  category: relationship
  evidence_refs:
  - ev:7
