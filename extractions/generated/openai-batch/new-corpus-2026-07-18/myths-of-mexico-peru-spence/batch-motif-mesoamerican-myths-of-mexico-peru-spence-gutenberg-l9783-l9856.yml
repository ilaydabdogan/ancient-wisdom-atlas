canonical_text:
  quote: ''
  summary: The passage describes Inca solar festivals at Cuzco, especially Intip-Raymi
    at the winter solstice and Citoc Raymi in June, including hilltop offerings, llama
    sacrifice, ritual fire, procession, fasting, and prayers to divine powers. It
    then notes that Peruvian human sacrifice was regular though less prevalent than
    in Mexico, describing selected female children, their removal from parents, training
    by mamacuna, and residence in aclla-huasi. It closes by introducing medicine-men
    of the Peruvian Andes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Intip-Raymi, called the Great Festival of the Sun, was celebrated by the
    Incas at Cuzco at the winter solstice.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Tarpuntaita-cuma, described as sacrificing Incas, had a duty connected
    with the festival, and worshippers journeyed eastward to meet one of them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On principal hill-tops between Cuzco and Huillcanuta, on the road to the rock
    of Titicaca, burnt offerings of llamas, coca, and maize were made to greet the
    arrival of the young sun from its ancient birthplace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At early dawn worshippers left the valley, carrying a sacrificial knife and
    brazier and leading a white llama laden with fuel, maize, and coca leaves wrapped
    in fine cloth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At sunrise the sacrificial pile was lit, the victim was slain, and the victim
    was thrown onto the fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: As the sun rose, Incas marched slowly around the burning mass, plucked wool
    from the scorched carcass, and chanted to Creator, Sun, and Thunder.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Citoc Raymi, called Gradually Increasing Sun, was held in June and involved
    nine days of ceremonial activity.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Before Citoc Raymi, a rigorous three-day fast was observed, during which no
    fire could be kindled.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: On the fourth day, the Inca and the people went to the great square of Cuzco,
    waited silently for the rising sun, greeted it, and processed to the Golden Temple
    of the Sun.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: At the Golden Temple of the Sun, llamas were sacrificed, a new fire was kindled
    with an arched mirror, and grain, flowers, animals, and aromatic gums were offered.
  category: action
  evidence_refs:
  - ev:3
