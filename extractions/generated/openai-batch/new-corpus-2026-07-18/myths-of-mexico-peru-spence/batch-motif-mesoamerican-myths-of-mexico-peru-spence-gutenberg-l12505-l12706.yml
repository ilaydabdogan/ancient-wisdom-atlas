canonical_text:
  quote: ''
  summary: Index and glossary entries list places, deities, figures, and cross-references
    from Nahua, Maya, and Peruvian mythological material, including Tlaloc as rain/water
    god, Titicaca as a sacred origin place, Thonapa as a Peruvian civiliser, Tohil
    as a Kiche deity who guides and gives fire, and Quetzalcoatl-related entries involving
    Tlapallan, Tollan, Venus, and departure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thonapa is identified as a son of the creator in Peruvian myth and is connected
    with stone-worship and myths at Tiahuanaco and Titicaca.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Tiahuanaco is described as a prehistoric Andean city with a great doorway
    and is linked to a legend of Manco Ccapac, an Inca creation-myth, and the legend
    of Thonapa the Civiliser.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lake Titicaca is associated with the descent to earth of Manco Ccapac and
    Mama Oullo Huaca and is described as a place where Peruvians held that men and
    animals were created.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Island of Titicaca is described as the most sacred of the Peruvian shrines,
    with a sacred rock called the paccarisca of the sun, sun-worship, pilgrimage,
    and an association with Thonapa.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tlaloc is identified as the Mexican rain-god or god of waters, represented
    in association with Chalchihuitlicue, Tlalocs, festivals, and human sacrifice.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Tlapallan is described as a legendary region from which the Nahua and Toltecs
    were said to have originated and to which Quetzalcoatl proceeds from Tollan.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tlauizcalpantecutli is identified as Lord of the Dawn, a name of the planet
    Venus, and is linked with Quetzalcoatl.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Tohil is identified as a form of Quetzalcoatl who guides the Kiche-Maya to
    their first city, is assigned to Balam-Quitze, gives fire to the Kiche, and is
    turned into stone.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Tollan is described as a Toltec city that was founded, became magnificent,
    was afflicted by the gods, experienced rebellions, was overthrown, and was left
    by Quetzalcoatl.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Tezcatlipoca is linked with plotting against Quetzalcoatl, opposing the Toltecs,
    and the overthrow of Tollan.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: Tlazolteotl, also called Tlaelquani or Filth-eater, is identified as a Mexican
    goddess of confession.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: Totec is identified as a sun-god whose feast is described as the chief solar
    festival.
  category: attribute
  evidence_refs:
  - ev:12
