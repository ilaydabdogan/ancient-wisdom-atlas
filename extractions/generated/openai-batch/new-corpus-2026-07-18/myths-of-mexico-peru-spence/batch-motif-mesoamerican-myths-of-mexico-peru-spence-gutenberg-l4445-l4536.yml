canonical_text:
  quote: You have seen me dead, buried, and now behold me alive again.
  summary: The passage recounts Papantzin/Papan, sister of Montezuma II, being buried
    in a palace vault, appearing alive near the royal baths, summoning Montezuma,
    and narrating an after-death vision of a valley, river boundary, luminous guide,
    bones, builders, foreign ships, and a mandate to warn her people.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Papantzin is described as the sister of Montezuma II and as returning from
    her tomb to prophesy his doom and the fall of his empire at the hands of the Spaniards.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After her death, Papantzin's body was interred in a subterranean palace vault
    near the royal baths, and the entrance was secured by a stone slab.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: At daylight the next morning, a royal child about six years old saw Princess
    Papan standing near the baths and was asked to bring her governess.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The governess followed the child, saw Papan sitting on the steps of the baths,
    and fell down in a swoon from terror.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The child's mother went to the baths with attendants, was frightened at seeing
    Papan, and was reassured by her; Papan asked to accompany her and to keep the
    affair secret for the present.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Papan sent for Tiçotzicatzin to inform the emperor, but he was terrified and
    begged to be excused; she then ordered that Nezahualpilli be contacted.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Montezuma asked whether the figure was truly his sister or an evil demon taking
    her likeness, and she answered that it was indeed she.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Papantzin told the assembled listeners that they had seen her dead and buried,
    and that she had returned from the dwellings of the dead to prophesy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: In her account of the moment after death, Papantzin found herself in a spacious
    valley without apparent beginning or end, surrounded by high mountains, with a
    road of many branching paths and a loud river nearby.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: By the river she saw a young man in a long robe fastened with a diamond, shining
    like the sun, with a cross-like sign on his forehead, wings, emerald-like eyes,
    and an imposing presence.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The young man took Papantzin by the hand and told her that it was not yet
    time for her to cross the river.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The guide conducted Papantzin through the valley, where she saw heads and
    bones of dead men and black horned folk with deer's feet building a nearly completed
    house.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Looking eastward, Papantzin saw many ships on the river, manned by people
    dressed differently from her own people, with grey eyes, ruddy complexions, banners,
    ensigns, helmets, and the name 'Sons of the Sun.'
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The guide explained that Papantzin was not yet to cross the river, that she
    would see the future and receive benefits from the faith brought by the strangers,
    that the bones were countrymen who died ignorant of that faith, and that the house
    was prepared for those who would fall in battle with the seafaring strangers.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: The guide said Papantzin was destined to return to her compatriots to tell
    them of the true faith and announce what she had seen.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: Montezuma listened in silence, became greatly troubled, left without a word,
    and returned to melancholy thoughts.
  category: action
  evidence_refs:
  - ev:12
