literal_observations:
- id: obs:1
  text: In the Totonac district north of Vera Cruz, some teocalli or pyramidal buildings
    are described as crowned by covered temples with massive roofs characteristic
    of Maya architecture.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Teotihuacan is described as a major religious center of the Nahua races, with
    sun and moon teocallis and extensive burying grounds where people of Anahuac were
    interred in hope of entering the paradise of the sun.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The summit of the sun teocalli held a temple containing a stone image of the
    sun with a gold star inlaid in its breast; the star was later seized by followers
    of Cortés.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A path from the moon teocalli toward the Citadel is called the Path of the
    Dead because it is surrounded by tombs and tumuli and runs through a large cemetery.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Charnay thought the Citadel was a large tennis or tlachtli court where crowds
    watched the Nahua national sport.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Teotihuacan is said to have been destroyed and then rebuilt by the Chichimec
