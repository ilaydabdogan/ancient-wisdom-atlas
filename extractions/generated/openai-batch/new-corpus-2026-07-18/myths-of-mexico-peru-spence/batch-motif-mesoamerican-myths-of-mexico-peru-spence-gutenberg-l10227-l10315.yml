canonical_text:
  quote: ''
  summary: Paricaca, after performing miracles, visits a festival village where he
    is ignored because of his poor clothing except by a young girl who gives him chicha.
    He warns her to seek safety before destroying the village with storm and flood.
    At San Lorenzo he encounters Choque Suso, whose maize is dying for lack of water.
    He offers irrigation water in return for her love; after she requires water for
    all farms, he uses a rill, dam work, birds, animals, snakes, lizards, and a cunning
    fox engineer to widen a channel and irrigate the land. Paricaca and Choque Suso
    live together at Yanacaca near the channel Cocochallo, and he eventually turns
    her into stone. The narrator adds that the myth likely accounts for the invention
    of irrigation in Peru, then concludes with general remarks on American civilisations,
    their isolation, and broad analogies with Greek and Indian myths.
  language: English
  quote_policy: summarized
