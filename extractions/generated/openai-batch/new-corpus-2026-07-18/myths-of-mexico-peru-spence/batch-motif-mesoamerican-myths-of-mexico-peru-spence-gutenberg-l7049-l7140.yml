canonical_text:
  quote: ''
  summary: 'The passage recounts episodes from the childhood and underworld challenge
    of Hun-Apu and Xbalanque: their mistreatment of and by relatives, the transformation
    of half-brothers into apes, their use of magic tools, animal helpers and messengers,
    the renewed ball-game challenge from Xibalba, the planting of canes as death tokens,
    and their successful evasion of several Xibalban ordeals.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The divine children are described as noisy and mischievous, are put out of
    Xmucane's house, and become skilled hunters using the serbatana or blow-pipe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hunbatz and Hunchouen mistreat the divine children, who retaliate by turning
    them into hideous apes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Xmucane asks that her transformed grandsons be spared, but she laughs at their
    antics on three occasions and the men-monkeys leave.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hun-Apu and Xbalanque use magic tools to clear a maize plantation while they
    are away hunting, then smear soil on themselves to make Xmucane think they worked
    in the fields.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wild beasts replace the roots and shrubs cleared by the magic tools; the twins
    set a net, the rat is caught, and the rabbit and deer lose their tails.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The spared rat tells the brothers about their father and uncle, their struggle
    with Xibalba, and the existence of clubs and balls for playing tlachtli at Ninxor-Carchah.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Hun-Came and Vukub-Came send a second ball-game challenge to Hun-Apu and Xbalanque;
    Xmucane sends a louse to warn them through a chain involving a toad, a serpent,
    and the bird Voc.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Before leaving, Hun-Apu and Xbalanque each plant a cane in the hut and say
    it will wither if a fatal accident happens to them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The twins go toward Xibalba on the road taken by Hunhun-Apu and Vukub-Hunapu,
    pass the river of blood, and send Xan ahead as a scout.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Xan pricks the Xibalbans with a hair from Hun-Apu's leg so the twins can identify
    wooden figures and learn names from the reactions of those pricked.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The twins ignore wooden images, avoid a red-hot stone, pass through the House
    of Gloom unharmed, and defeat the Xibalbans at the ball-game.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Lords of Hell demand four bouquets from the royal garden while ordering
    the gardeners to guard the flowers; ants obtain the flowers for the brothers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Hun-Apu and Xbalanque are imprisoned in the House of Lances, where spear-bearing
    demons attack them; they bribe the lancers and escape.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Xibalbans punish the owls that guarded the royal gardens by slitting their
    beaks.
  category: action
  evidence_refs:
  - ev:5
