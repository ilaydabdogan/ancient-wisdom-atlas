  - ev:4
  - ev:5
  confidence: high
  cautions: The passage names them as twins only in later sections, but the paired
    divine-brother pattern is explicit throughout.
- id: motif:2
  label: Tricksters outwitting hostile powers
  taxonomy_refs:
  - trickster_boundary
  basis: The twins transform their tormentors, simulate field labor, expose wooden
    substitutes and names through Xan, use ants to obtain guarded flowers, and bribe
    lancers to escape.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage does not itself use the word trickster for the twins; the
    label is based on repeated deceptive or counter-deceptive actions.
