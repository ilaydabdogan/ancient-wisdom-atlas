candidate_motifs:
- id: motif:1
  label: Divine or sacred twins facing underworld ordeals
  taxonomy_refs:
  - sacred_twins
  - hero_descent
  basis: Hun-Apu and Xbalanque are repeatedly described as divine brothers or twins,
    receive an underworld challenge, travel to Xibalba, and survive its tests.
  evidence_refs:
  - ev:1
