  basis: Hunbatz and Hunchouen are changed into hideous apes, then leave as men-monkeys
    after Xmucane fails the laughter condition.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The transformation is imposed by the twins rather than a voluntary shapeshift
    by the transformed figures.
