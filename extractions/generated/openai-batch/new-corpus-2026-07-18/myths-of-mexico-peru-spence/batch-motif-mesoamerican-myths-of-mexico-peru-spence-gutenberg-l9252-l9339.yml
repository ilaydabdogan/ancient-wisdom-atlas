canonical_text:
  quote: ''
  summary: The passage describes Peruvian huacas as sacred objects or relics, including
    portable fetishes and agricultural objects associated with irrigation, rain, maize,
    and food supply. It then describes plant-growth spirits called mamas, especially
    the maize-mother Saramama and her annually renewed images. It also describes Huamantantac,
    a spirit connected with seabirds and guano for maize cultivation; huaris, aristocratic
    ancestors connected with agriculture and offerings; and huillcas, oracular huacas
    such as serpents, trees, and rivers whose sounds were interpreted as speech.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Peruvians used huaca for what was sacred, of sacred
    origin, or relic-like; objects of reverence were called huacas, and higher-class
    ones could be called viracochas.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Portable huacas are described as usually stones or pebbles, often carved and
    painted, sometimes made to represent human beings; the llama and ear of maize
    are named as common forms.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Agricultural huacas were placed near irrigation canals to help prevent leaks
    or failures in supplying moisture to maize fields.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ccompas are described as important deities connected with irrigation, while
    chichics and huancas presided over maize fortunes and helped ensure rain.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The mamas are described as spirits instrumental in forcing the growth of maize
    or other plants and were named as mothers of particular plants or herbs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Named plant mothers include acsumama for potato, quinuamama for quinua, saramama
    for maize, and cocamama for coca-shrub.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Saramama is described as especially important because she governed the principal
    food supply, and she could be represented by a stone ear of maize or by a maize-stalk
    doll called huantaysara.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Saramama image was watched for three nights, received sacrifice, and was
    questioned by a priest or medicine-man about whether it could exist until the
    next year; if not, it was burned and replaced.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Huamantantac is described as responsible for gathering seabirds, producing
    guano deposits valuable for maize cultivation, and as a beneficent spirit receiving
    fervent sacrifice.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Huaris are described as aristocratic ancestors, sometimes called gods of strength,
    favorable to agricultural effort, and recipients of chicha libations and other
    food and drink offerings.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Huillcas are described as huacas with an oracular nature; many were serpents,
    trees, and rivers whose noises were treated as articulate speech.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Huillcamayu and Apurimac rivers at Cuzco are named as huillca oracles,
    and such oracles could sometimes oppose the mandate of the Inca.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage explicitly compares the plant-mother conception to a similar conception
    among many Brazilian tribes and compares the Saramama harvest image to Mexican
    corn-mother idols made at harvest-season.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
