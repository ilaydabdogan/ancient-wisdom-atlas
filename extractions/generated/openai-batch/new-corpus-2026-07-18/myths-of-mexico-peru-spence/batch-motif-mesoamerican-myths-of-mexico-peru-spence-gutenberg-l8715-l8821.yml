literal_observations:
- id: obs:1
  text: Chibcha law is described as severe, with death for murder, bodily punishment
    for stealing, gendered humiliation for cowardice, and a red-pepper ordeal for
    an unfaithful wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Chibchas are said to have used no cattle, lived on honey, and built clay
    houses within enclosures guarded by watch-towers, with conical roofs covered by
    reed mats.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Chibchas worked bronze, lead, copper, tin, gold, and silver, but not iron;
    examples include golden human masks, human statuettes, and images of monkeys and
    frogs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Chibchas traded rock salt for cereals and made small ornaments that might
    appear to function as money, though the passage says they are not thought to have
    understood coinage.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Chibcha-associated stone monuments include granite rocks with large tiger
    and crocodile figures and two high sculptured columns described as greatly revered
    by the natives.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the Peruvians lacked writing and numeration at the arrival
    of the Spaniards and used quipos, knotted strings or hide pieces of different
    lengths and colors, to record historical or mathematical information.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Quipos relating to Inca history were preserved by an officer called Quipo
    Camayol, while many were destroyed by Spanish monks as idolatrous monuments; Peruvians
    later continued to use them secretly.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A reported 1792 revolt against the Spaniards was organized through messengers
    carrying wood that enclosed colored threads whose knots and colors encoded timing
    and assent or refusal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Inca instructions were transmitted by quipos through a network of tambos and
    chasquis; orders from the sovereign were marked with a red thread of the royal
    llantu and were received with great respect.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Incan Peruvians are described as skilled in metallurgy, obtaining gold from
    river sands, extracting silver with blast-furnaces, and using copper for bronze
    tools and implements.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage mentions small perforated ornaments found under huacas and identifies
    them as probably talismans.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Peruvian spinning, weaving, dyeing, textile stamping, and feather decoration
    are described as highly accomplished and admired by the Spaniards.
  category: action
  evidence_refs:
  - ev:9
