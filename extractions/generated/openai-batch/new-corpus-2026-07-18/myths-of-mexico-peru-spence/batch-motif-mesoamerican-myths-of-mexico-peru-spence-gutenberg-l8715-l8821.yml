  summary: The passage describes Chibcha laws, housing, crafts, trade, and monuments,
    then turns to Peruvian/Inca quipos as knotted-cord records and messages, including
    their preservation, destruction by Spanish monks, secret continued use, a later
    1792 revolt organized through colored knotted threads, Inca courier transmission
    of sovereign orders, and Inca metallurgy, ornaments, tools, weaving, and textile
    decoration.
