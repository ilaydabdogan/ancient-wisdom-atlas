canonical_text:
  quote: ''
  summary: 'The passage describes recent Andean beliefs and practices concerning mohanes
    or agoreros, an evil being at the earth’s center, piripiri rites, and floripondium
    vision-divination for illness. It then describes Lake Titicaca worship: the lake
    as a creation place, Mamacota or Mother-water, the cult images Copacahuana and
    Copacati, and a legend in which the lake-goddess submerges an island shrine raised
    by Huaina Ccapac for Yatiri/Pachacamac.'
