candidate_motifs:
- id: motif:1
  label: Royal marriage choice tied to inheritance
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage states that daughters were sent to Nezahualpilli so he could
    choose a queen and lawful wife whose son might succeed to the inheritance.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a courtly-political setup rather than a fully developed mythic
    succession episode in the excerpt.
- id: motif:2
  label: Secret lovers killed and represented by effigies
  taxonomy_refs: []
  basis: Chachiuhnenetzin orders young men brought to her, killed, and reproduced
    as adorned effigies kept in her apartment.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage frames the deaths as crimes; it does not present them as formal
    ritual sacrifices.
- id: motif:3
  label: False divine explanation for concealed crime
  taxonomy_refs: []
  basis: When questioned about the statues, Chachiuhnenetzin says they are her gods,
    and the king believes her because of Mexican strictness in worship.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage reports the explanation as deception; it does not develop
    an independent theology of the figures.
- id: motif:4
  label: Concealed transgression revealed by a token
  taxonomy_refs: []
  basis: The king's suspicion begins when he recognizes a precious jewel he had given
    the queen on one of the young men.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The token is a clue in a court narrative; no broader comparison is asserted
    by the passage.
- id: motif:5
  label: Substitute effigy in the bed
  taxonomy_refs: []
  basis: The king enters the sleeping chamber and finds a statue in the bed adorned
    with the queen's hair and resembling her.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The statue functions literally as a decoy in this episode; the passage
    does not state magical animation or transformation.
- id: motif:6
  label: Public exemplary royal punishment
  taxonomy_refs: []
  basis: The king summons rulers, lords, families, enemies, and the public to witness
    the execution of the queen, her companions, and accomplices.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: This is a political-judicial pattern in the passage, not explicitly a
    divine or ritual judgment.
- id: motif:7
  label: Retributive disgrace for an earlier family wrong
  taxonomy_refs:
  - divine_judgment
  basis: The chronicler says the king's household disgrace was punishment for an unworthy
    subterfuge used by his father to obtain his mother as wife.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage uses moralizing language of punishment but does not name a
    deity or explicit supernatural agent.
- id: motif:8
  label: Resentful kin after public punishment
  taxonomy_refs: []
  basis: The queen's Mexican relatives are said to conceal resentment and meditate
    future revenge after the public execution.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The excerpt does not narrate the later revenge itself.
