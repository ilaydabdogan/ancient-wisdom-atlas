canonical_text:
  quote: ''
  summary: A chronicled tale recounts how Chachiuhnenetzin, a high-born wife of King
    Nezahualpilli, secretly had young men brought to her, killed, and represented
    by adorned effigies she called gods. The king discovers her through a jewel and
    a decoy statue in her bed, orders an inquiry, summons witnesses, and has her,
    three surviving young lords, and many accomplices publicly executed and burned.
    The passage adds resentment among her Mexican relatives, a moralizing explanation
    by the chronicler, and a brief note that Nezahualpilli had scientific tastes and
    a palace observatory.
  language: English
  quote_policy: summarized
