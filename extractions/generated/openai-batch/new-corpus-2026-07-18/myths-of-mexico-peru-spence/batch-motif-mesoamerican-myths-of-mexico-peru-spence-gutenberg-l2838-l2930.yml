comparison_claims:
- id: claim:1
  claim: The passage presents self-bloodletting in Quetzalcoatl worship as functionally
    analogous to sacrificial substitution of a part for the whole, comparing it broadly
    with early Palestine and other countries.
  claim_level: same_function
  target: Sacrificial substitution of part for whole in early Palestine and other
    countries
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is an authorial statement in the supplied passage and
    provides no detailed parallel texts or ritual contexts.
- id: claim:2
  claim: The passage states that Zapotec customs and beliefs formed a link between
    Mexican and Mayan civilisations and that Zapotec priestly worship appeared to
    be based on Quetzalcoatl worship.
  claim_level: historical_contact
  target: Zapotec priestly ritual in relation to Mexican and Mayan traditions
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The wording is cautious and general; the passage gives no independent
    historical evidence beyond this assertion.
