canonical_text:
  quote: ''
  summary: The passage describes Quetzalcoatl-related blood offerings and priestly
    practices, then summarizes Mexican maize deities and festivals for Chicomecohuatl,
    including offerings of maize, frog and water symbolism, sympathetic crop-growth
    gestures, and the Xalaquia dancer sacrifice before the eating of new corn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Quetzalcoatl's worship is described as partly antipathetic to that of other
    Mexican deities, with his priests forming a separate caste.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Human sacrifice is said to have existed in connection with Quetzalcoatl's
    worship, though not as prevalently as among other devotees; self-shed blood is
    described as a more acceptable sacrifice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A celebrant or devotee drew blood from under the tongue or behind the ear
    using a cord of thorn-covered agave fibres, and the blood was smeared on idol
    mouths.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Zapotec high-priests are said to have enacted the legend of Quetzalcoatl in
    their own persons, and their worship is described as strongly marked by blood-shedding.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A group of deities called Centeotl presided over Mexican agriculture and personified
    aspects of the maize plant.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Chicomecohuatl, named Seven-serpent, is identified as chief maize goddess;
    the passage explains the serpent as a Mexican symbol of water's fertilising power.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: As Xilonen, Chicomecohuatl typified the green ear of maize.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Teteoinnan or Tocitzin is described as an Earth-mother or growth-spirit and
    as mother of a male maize-spirit named Centeotl.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Chicomecohuatl's spring festival Hueytozoztli, there was a general fast,
    dwellings were decorated with blood-sprinkled bulrushes, household god statues
    were decorated, tender maize stalks were flower-decorated and placed in the village
    common house, and a mock combat occurred before her altar.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Girls presented Chicomecohuatl with bundles of maize from the previous harvest
    and later restored them to granaries for seed for the coming year.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A household offering to Chicomecohuatl included a basket of provisions topped
    by a cooked frog carrying a stuffed cornstalk.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The frog is said to symbolize Chalchihuitlicue, wife of the rain-god Tlaloc,
    and a frog was sacrificed as a water symbol to benefit the soil.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: During the Xalaquia festival, women wore their hair unbound and tossed it
    so that, by sympathetic magic, the maize would grow correspondingly long.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Xalaquia was a female captive or slave with her face painted red and yellow
    to represent maize-plant colours; she danced throughout the festival without knowing
    her fate.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: On the final morning, women, chiefs, headmen, and the exhausted victim danced
    a death-dance before the community ascended the pyramid of sacrifice.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: At the pyramid summit, the victim was stripped, killed with a flint knife,
    and her heart was offered to Chicomecohuatl.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The sacrifice is said to revivify and refresh Chicomecohuatl after her labour
    of inducing maize growth, and eating the new corn was unlawful until the victim
    died.
  category: sequence
  evidence_refs:
  - ev:9
