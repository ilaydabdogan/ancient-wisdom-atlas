canonical_text:
  quote: ''
  summary: The passage discusses a wooden cross found in the Chichas valley and later
    interpreted by some colonists and missionaries as miraculous evidence of St. Thomas
    in America, though the narrator rejects this. It then describes the Chibchas,
    their culture, beliefs about Bochica and the moon, sacrifices, sacred Lake Quatavita,
    political leaders, succession customs, funerary treatment of chiefs, grave goods,
    and a belief that death continued earthly life.
  language: English
  quote_policy: summarized
