canonical_text:
  quote: ''
  summary: The passage recounts the creation of four first Kiche men from yellow and
    white maize, the limiting of their sight and knowledge by Hurakan, the creation
    of four wives, the journey to Tulan-Zuiva, the granting of tribal gods and fire,
    the confounding of speech, migration through hardships including divided ocean
    waters, the first sunrise at Mount Hacavitz, the petrification of tribal gods
    and animal totems, warfare aided by wasps and hornets, and the disappearance of
    the first men into a bundle called the Majesty Enveloped. It closes with the author's
    comparison of emergence myths among American peoples.
  language: English
  quote_policy: summarized
