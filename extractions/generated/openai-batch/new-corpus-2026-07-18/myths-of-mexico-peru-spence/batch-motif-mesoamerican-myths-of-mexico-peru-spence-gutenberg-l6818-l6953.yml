  quote: '"I am the Overturner of Mountains!"'
  summary: Hun-Apu and Xbalanque encounter Cabrakan, a proud giant who moves mountains.
    They pose as hunters, shoot and cook a bird, secretly poison it with tizate earth,
    and give it to Cabrakan. The poison weakens him before a mountain challenge, and
    he dies at the foot of the mountain, ending the earth-giants of Guatemala.
