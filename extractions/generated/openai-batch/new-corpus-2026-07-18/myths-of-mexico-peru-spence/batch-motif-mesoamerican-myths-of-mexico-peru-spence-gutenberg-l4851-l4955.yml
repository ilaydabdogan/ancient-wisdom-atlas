canonical_text:
  quote: ''
  summary: 'The passage recounts Mayan political traditions about Mayapan, Chichen-Itza,
    Uxmal, Mani, and Zotuta: priest-kings of Mayapan claim descent from Kukulcan or
    Quetzalcoatl; the Itzaes and Tutul Xius migrate and found cities; the Cocomes
    dominate, oppress, and later fall after revolts; Hunac Eel campaigns against Chichen-Itza;
    and a remnant of the Cocomes survives and settles in Zotuta.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The priest-kings of Mayapan are said to have claimed descent from Kukulcan
    or Quetzalcoatl and to have raised their state to prominence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Itzaes are described as a warrior caste associated with founding Chichen-Itza,
    while their rulers, the Tutul Xius, are said to have migrated from western Maya
    states and founded Ziyan Caan before moving northward.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Cocomes of Mayapan overthrew the settlement of the Tutul Xius after about
    120 years and made it a dependency, allowing some governors and people to depart.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After expulsion, the Tutul Xius fled southward to Potonchan or Champoton,
    later expanded northward with Nahua mercenary aid, built Uxmal, and reconquered
    lost territory.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The passage describes roads and highways linking Chichen-Itza, Cozumel, and
    Itzamal so that pilgrims and people could reach temples and the chief shrine.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Cocomes imposed heavy demands on tributary Maya states, and the Tutul
    Xius in turn oppressed the people under their rule, producing widespread discontent.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Subject states revolted; the first revolt, led by the king or regulus of Uxmal,
    was defeated with the help of Nahua mercenaries, after which Uxmal was abandoned
    and the Tutul Xius founded Mani.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hunac Eel ruled over the Cocomes, held lesser Yucatan principalities in subjection,
    employed neighbouring Nahua assistance, marched against Chichen-Itza, and defeated
    its inhabitants.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Opponents of the Cocomes joined forces, including the people of Chichen-Itza,
