canonical_text:
  quote: ''
  summary: 'The passage surveys named figures and interpretive patterns in Kiche and
    Maya mythology: dual Father-Mother creator deities, Gucumatz as a feathered serpent
    figure, Hurakan as wind-god with lightning assistants, Hun-Apu and Xbalanque as
    hero-gods, Vukub-Cakix and his progeny as earth-giants, possible metrical and
    ritual-dance elements in the Popol Vuh, confused Kiche pseudo-history, and Le
    Plongeon''s rejected Queen Móo theory.'
  language: English
  quote_policy: summarized
