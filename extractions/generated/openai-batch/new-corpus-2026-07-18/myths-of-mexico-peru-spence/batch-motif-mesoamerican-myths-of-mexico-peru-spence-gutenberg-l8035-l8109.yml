canonical_text:
  quote: ''
  summary: The passage describes Quichua and Aymara groups, the four regional divisions
    of Peru, and Inca consolidation. It then recounts a Peruvian myth in which the
    Life-giver sends Manco Ccapac and Mama Oullo Huaca to earth to teach civilised
    arts, with a golden wedge marking Cuzco as their mission site. A quoted creation
    account says the creator at Tiahuanaco makes nations from clay, gives them life,
    language, songs, seeds, and foods, sends them under the earth, and has them emerge
    from caves, hills, fountains, and tree trunks; these origin places become huacas,
    and some first beings are transformed into stone or birds and animals.
  language: English
  quote_policy: summarized
