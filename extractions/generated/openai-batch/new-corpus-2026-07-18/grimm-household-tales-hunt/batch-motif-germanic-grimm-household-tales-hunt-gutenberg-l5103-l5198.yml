canonical_text:
  quote: ''
  summary: The passage contains the end of a Hans and Grethel episode, in which Hans
    misunderstands advice about treating Grethel and harms her with animal eyes, followed
    by the tale 'The Three Languages.' In that tale a count's son learns the languages
    of dogs, birds, and frogs; is rejected and nearly killed by his father; uses dog-language
    to free a castle district from bewitched treasure-guarding dogs; hears frogs foretell
    his papacy; and is chosen pope by the token and counsel of two white doves.
  language: English
  quote_policy: summarized
