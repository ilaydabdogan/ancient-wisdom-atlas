canonical_text:
  quote: ''
  summary: A soldier trapped in an underground cavern uses a blue light to light his
    pipe; smoke summons a small black dwarf who must obey him. The dwarf leads him
    out through an underground passage, reveals hidden treasure, executes the soldier's
    command against a witch, and remains summonable through the pipe and blue light.
    The soldier then uses the dwarf to abduct the sleeping princess at night and force
    her to do servant's work. The King devises tracking plans using peas and then
    a hidden shoe; the dwarf defeats the pea trail but cannot prevent the shoe from
    being hidden under the soldier's bed.
  language: English
  quote_policy: summarized
