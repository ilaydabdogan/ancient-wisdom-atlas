canonical_text:
  quote: ''
  summary: 'An unnamed speaker describes fragile wedding attire made of snow, cobwebs,
    and glass. The passage then begins “The Gold-Children”: a poor fisherman repeatedly
    catches a speaking golden fish that grants a castle and food under a secrecy condition.
    The fisherman twice reveals the secret under pressure from his wife and loses
    the riches. On the third catch, the fish instructs him to divide it into six pieces
    for his wife, horse, and the ground; golden lilies, golden foals, and two gold-bodied
    children result. The children depart, with lilies left as signs of their condition;
    one returns after mockery, while the other continues toward a dangerous forest.'
  language: English
  quote_policy: summarized
