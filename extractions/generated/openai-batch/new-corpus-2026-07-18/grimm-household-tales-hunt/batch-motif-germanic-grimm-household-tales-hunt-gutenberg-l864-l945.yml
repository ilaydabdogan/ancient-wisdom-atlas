- id: obs:3
  text: More men bring nine dead men's legs and two skulls, set them up as nine-pins,
    and play with them; the youth joins and rounds the skulls in a lathe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When it strikes twelve during the second night, everything vanishes, and the
    youth later tells the king that he made merry and still has not shuddered.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the third night, six tall men bring in a coffin; the youth opens it and
