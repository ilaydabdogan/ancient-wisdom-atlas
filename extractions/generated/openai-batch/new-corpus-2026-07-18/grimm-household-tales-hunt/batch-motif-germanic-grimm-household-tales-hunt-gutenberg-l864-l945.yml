canonical_text:
  quote: ''
  summary: A youth spends the second and third nights in an old castle trying to learn
    what it is to shudder. He confronts a body assembled from two halves, men playing
    nine-pins with bones and skulls, a coffin with a dead man whom he warms back to
    motion, and an old bearded spirit who challenges him at a forge. The youth remains
    unafraid, defeats the spirit, is shown treasure, and is told by the king that
    he has delivered the castle and will marry the king's daughter.
  language: English
  quote_policy: summarized
