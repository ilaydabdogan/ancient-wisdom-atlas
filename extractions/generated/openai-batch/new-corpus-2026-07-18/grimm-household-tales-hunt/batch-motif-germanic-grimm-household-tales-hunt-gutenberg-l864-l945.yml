  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: An old, terrible, tall man with a long white beard enters, threatens the youth
    with death, and leads him through dark passages to a smith's forge for a strength
    trial.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The youth splits an anvil with an axe, catches the old man's beard in it,
