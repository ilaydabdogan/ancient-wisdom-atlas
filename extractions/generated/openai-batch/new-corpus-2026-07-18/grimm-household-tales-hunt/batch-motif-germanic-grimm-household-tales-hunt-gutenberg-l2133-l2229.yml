canonical_text:
  quote: ''
  summary: 'The passage concludes the Rapunzel episode: the enchantress uses Rapunzel’s
    cut hair to lure the King’s son, he leaps from the tower and is blinded by thorns,
    wanders for years, then finds Rapunzel in the desert with her boy-and-girl twins;
    her tears restore his sight and he brings her to his kingdom. The passage then
    begins The Three Little Men in the Wood: a widower marries a widow after a water-and-boot
    test, the stepmother reverses promised treatment and mistreats the man’s daughter,
    sends her into the winter wood for strawberries in a paper frock, and the girl
    shares bread with three dwarfs, who grant her gifts.'
  language: English
  quote_policy: summarized
