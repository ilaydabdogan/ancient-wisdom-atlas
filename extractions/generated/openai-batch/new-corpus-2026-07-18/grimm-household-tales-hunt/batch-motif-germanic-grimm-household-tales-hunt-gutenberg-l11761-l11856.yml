canonical_text:
  quote: ''
  summary: The passage contains the tale of Gambling Hansel, who hosts the Lord and
    St. Peter, receives three gambling-related favors, traps Death in a magic fruit
    tree for seven years, is killed and rejected at Heaven and Purgatory, gambles
    in Hell, assaults Heaven with devils, is admitted and then cast down so that his
    fragmented soul enters living gamblers. The passage then begins the tale of Hans
    in Luck, in which Hans receives a large lump of gold after seven years of service
    and sets out toward his mother, encountering a rider on horseback.
  language: English
  quote_policy: summarized
