canonical_text:
  quote: ''
  summary: Snow-white and Rose-red live with their mother in a neat cottage. A speaking
    bear comes in winter seeking warmth and becomes a nightly hearth guest. In spring
    he leaves to guard treasure from dwarfs who emerge after the thaw. Snow-white
    glimpses possible gold beneath his torn coat. Later the girls find a dwarf whose
    beard is trapped in a felled tree; Snow-white frees him by cutting the beard,
    and the dwarf takes a gold-filled bag and leaves without thanks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Snow-white and Rose-red keep their mother’s cottage neat; Rose-red tends the
    house in summer and lays a flower wreath by the mother’s bed, while Snow-white
    lights the winter fire and tends the kettle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the evening the door is bolted, the family sits around the hearth, the
    mother reads aloud, the two girls listen and spin, and a lamb and white dove are
    nearby.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A knock at the door is interpreted by the mother as a traveller seeking shelter;
    Rose-red opens the door and sees a bear with a broad black head.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bear speaks, says he will do no harm, and asks to warm himself because
    he is half-frozen.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother permits the bear to lie by the fire; the children sweep snow from
    his coat, play roughly with him, and he tolerates the play while warning them
    not to beat him dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bear sleeps by the hearth, leaves at dawn, returns every evening, and
    the household becomes accustomed to leaving the doors unfastened until he arrives.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In spring the bear says he must go to the forest for the summer to guard his
    treasures from wicked dwarfs who come up after the thaw to pry and steal, taking
    things into their caves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the bear leaves, his coat catches on the bolt and tears; Snow-white thinks
    she may see gold shining through it, but is not sure.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The mother sends the children into the forest for firewood, where they find
    a felled tree and an old-faced dwarf whose long white beard is caught in a crevice
    of the tree.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The dwarf insults the girls, explains that his beard was trapped while he
    was splitting the tree, and Snow-white frees him by cutting off the end of the
    beard with scissors.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After being freed, the dwarf takes a bag full of gold from among the tree
    roots, curses the children, and leaves without thanking them.
  category: action
  evidence_refs:
  - ev:9
