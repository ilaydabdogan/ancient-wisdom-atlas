canonical_text:
  quote: ''
  summary: 'The passage concludes an Allerleirauh episode in which the disguised heroine
    repeatedly attends royal festivals in splendid dresses, returns to the kitchen
    to prepare the King’s soup, and conceals golden objects in it. On the third occasion
    the King marks her with a ring, discovers her under her fur disguise, and marries
    her. The passage then begins “The Hare’s Bride”: a hare repeatedly eats cabbages
    in a woman’s garden, invites the daughter to ride on his tail to his hut, and
    after the third invitation takes her away for a wedding attended and officiated
    by animals under a rainbow.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The King questions Allerleirauh about who she is, her usefulness in the palace,
    and the ring found in the soup; she says she is a poor girl without parents, good
    only for having boots thrown at her head, and knows nothing about the ring.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At another festival, Allerleirauh asks the cook for permission to look on
    and is told to return in half an hour to make the King’s favored bread soup.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Allerleirauh goes to her den, washes, puts on a dress described as silvery
    as the moon, appears like a princess, dances with the King, and disappears before
    he can see where she goes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the second festival dance, Allerleirauh returns to her den, makes herself
    a hairy animal, goes to the kitchen, and prepares the bread soup.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Allerleirauh places a little golden spinning-wheel in the soup bowl; the King
    eats the soup, the cook admits she prepared it, and she again denies knowing anything
    about the object.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: At the third festival, the cook calls Allerleirauh a witch because something
    is always in the soup and the King prefers it, but he lets her attend at the appointed
    time.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Allerleirauh wears a dress that shines like the stars, dances with the King,
    and the King secretly slips a golden ring onto her finger while prolonging the
    dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Allerleirauh flees to the den beneath the stairs, but because she is late
    she cannot fully remove the dress; she throws the fur mantle over it and leaves
    one finger white.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Allerleirauh cooks the King’s bread soup and puts her golden reel into it;
    the King finds the reel, summons her, sees the white finger, and recognizes the
    ring he had placed there.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The King holds Allerleirauh fast; her fur mantle opens, the star-dress shows,
    the mantle is torn off, her golden hair is revealed, she washes soot and ashes
    from her face, and the King declares her his bride.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In “The Hare’s Bride,” a woman and her daughter live in a garden with cabbages,
