canonical_text:
  quote: "“He who cuts wood for reels shall die, / And he who winds, shall perish.”"
  summary: 'An idle wife avoids spinning-related work by deceiving her husband: first
    she hides in the forest and repeats a fatal warning about cutting wood for reels,
    and later she substitutes tow for yarn in a kettle and makes him believe he has
    neglected it. A new tale begins with a poor father sending his four grown sons
    into the world to learn trades; the brothers depart together, reach a four-way
    cross-road, separate, and agree to reunite there after four years.'
  language: English
