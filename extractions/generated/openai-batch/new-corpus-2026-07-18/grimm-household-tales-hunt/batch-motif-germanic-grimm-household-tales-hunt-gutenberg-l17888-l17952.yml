canonical_text:
  quote: ''
  summary: Four brothers separate to learn trades. The eldest becomes a thief, the
    second an astronomer with a telescope, the third a huntsman with an unfailing
    gun, and the youngest a tailor with a needle that sews anything seamlessly. After
    four years they return to their father, who tests their abilities using a chaffinch
    nest, five eggs, a single shot, and the tailor’s repair. The eggs are replaced
    under the bird, and the young birds later hatch with red lines around their necks.
  language: English
  quote_policy: summarized
