canonical_text:
  quote: ''
  summary: The passage closes one tale with the Devil losing power over three persons
    who keep a magic whip, then begins “Ferdinand the Faithful.” A poor child receives
    a key from a beggar-godfather, later opens a castle on the heath and obtains a
    white horse. On his travels he is prompted to pick up a pen, rescues a fish that
    gives him a flute and promises help, meets Ferdinand the Unfaithful, gains royal
    service through an honest girl, and is commanded by the King to fetch the King’s
    absent love under threat of death.
  language: English
  quote_policy: summarized
