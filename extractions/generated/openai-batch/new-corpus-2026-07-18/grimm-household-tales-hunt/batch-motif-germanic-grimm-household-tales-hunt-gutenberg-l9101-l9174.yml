canonical_text:
  quote: ''
  summary: A goldsmith tries to eat a wondrous gold bird whose heart and liver give
    the eater daily gold. Two poor twin boys accidentally eat the heart and liver;
    the goldsmith's wife substitutes cock organs, and the goldsmith gains nothing.
    The boys begin finding gold each morning. The envious goldsmith falsely warns
    their father that they are in league with the Evil One, and the father abandons
    them in the forest. A huntsman adopts them, trains them, tests them with difficult
    shots at wild geese, declares them skilled huntsmen, and permits them to travel
    to prove themselves.
  language: English
