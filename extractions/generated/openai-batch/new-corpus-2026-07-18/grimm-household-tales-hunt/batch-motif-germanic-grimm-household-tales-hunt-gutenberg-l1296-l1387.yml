  quote: ''
  summary: The passage first concludes an episode in which a king sacrifices his two
    children to restore Faithful John from stone, after which John restores the children.
    It then begins “The Good Bargain,” where a peasant misreads frogs’ croaking and
    dogs’ barking as financial dealings, loses his money and meat, seeks justice,
    and makes the king’s daughter laugh, gaining her as wife.
