canonical_text:
  quote: ''
  summary: 'The luck-child travels through two towns and across a river, promising
    to learn why a wine-giving fountain is dry, why a golden-apple tree is barren,
    and why a ferryman is never released. He enters Hell, where the Devil''s grandmother
    hides him by changing him into an ant. While the Devil sleeps, she plucks three
    golden hairs and elicits answers: a toad blocks the fountain, a mouse gnaws the
    tree root, and the ferryman can be freed by handing his oar to another. The luck-child
    leaves Hell with the hairs and gives the ferryman the promised advice after being
    ferried across.'
  language: English
  quote_policy: summarized
