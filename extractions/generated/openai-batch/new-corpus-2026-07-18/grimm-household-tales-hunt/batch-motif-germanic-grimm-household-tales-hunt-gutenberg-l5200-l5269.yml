  quote: ''
  summary: A man and his wife discuss marrying their daughter Clever Elsie to Hans,
    who requires that she be wise. Sent to the cellar to draw beer, Elsie sees a pick-axe
    above the barrel and imagines a future child being killed by it. The servant,
    boy, mother, and father successively join her lament. Hans descends, hears the
    explanation, accepts her, and marries her.
