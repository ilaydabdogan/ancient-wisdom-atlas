  summary: A peasant pretends to have fallen from heaven, deceives a woman into giving
    him money for her dead husband, then deceives her son into giving him a horse.
    The passage then begins a snake story in which a child regularly eats milk and
    bread in the yard with a snake that emerges from a wall crevice.
