canonical_text:
  quote: ''
  summary: A king and his daughter try to dispose of a disbanded soldier and his companions.
    The king locks the six men in an iron room and has a fire made under it, but the
    companion with a cap summons frost and they survive. The king then offers gold
    if the chief renounces the daughter; the chief asks for as much as his servant
    can carry. A vast sack is sewn, and the strong companion carries away the king’s
    treasure and more. When the king sends regiments after them, the blower scatters
    the soldiers into the sky, spares one sergeant, and the king gives up. The six
    divide the riches and live contentedly.
  language: English
  quote_policy: summarized
