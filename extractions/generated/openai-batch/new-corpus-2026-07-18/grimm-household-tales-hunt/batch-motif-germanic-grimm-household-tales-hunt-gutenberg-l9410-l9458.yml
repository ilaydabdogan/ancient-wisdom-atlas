canonical_text:
  quote: ''
  summary: The huntsman returns after a year to the town where he had delivered the
    King's daughter from the dragon and finds it decorated for the wedding of the
    princess and the marshal, who is credited with killing the dragon. The huntsman
    wagers with the innkeeper that he will eat bread from the King's table. He sends
    the hare to fetch such bread. After escaping butchers' dogs, the hare reaches
    the King's daughter, is recognized by his collar, states that his master killed
    the dragon, and secures a loaf like the King's bread. The hare returns with it,
    and the huntsman claims the wager, then asks for the King's roast meat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The huntsman is sad, travels about the world, makes his animals dance before
    people, and returns after exactly one year to the same town where he had delivered
    the King's daughter from the dragon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The town is decorated with red cloth, whereas the previous year it had been
    hung with black crape.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The host says the King's daughter had been due to be delivered to the dragon,
    that the marshal fought and killed it, and that the marshal's wedding to her is
    to occur the next day.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the wedding day the huntsman wagers with the innkeeper that he will eat
    bread from the King's own table, with each side staking one hundred gold pieces.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The huntsman tells the hare to fetch bread that the King is eating.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The hare, described as the lowest of the animals, must carry out the order
    himself and fears the butchers' dogs.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The butchers' dogs chase the hare; the hare hides in a sentry-box, and the
    soldier drives the dogs away with the butt-end of his gun.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The hare enters the palace, sits under the King's daughter's chair, scratches
    her foot three times, and is recognized by her because of his collar.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The hare tells the King's daughter that his master killed the dragon and asks
    for a loaf like that eaten by the King.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The King's daughter is joyful, summons the baker, and orders a loaf like the
    King's bread.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The hare asks that the baker carry the loaf to the inn door to protect him
    from the butchers' dogs; the hare then carries the loaf to his master.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: After receiving the loaf, the huntsman declares the innkeeper's hundred gold
    pieces won and says he also wants some of the King's roast meat.
  category: action
  evidence_refs:
  - ev:6
