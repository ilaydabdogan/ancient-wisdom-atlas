canonical_text:
  quote: ''
  summary: A king’s daughter, facing her father’s intended wedding to her, asks for
    celestial dresses and an animal-fur mantle as delaying conditions. When the king
    fulfills them, she flees at night in disguise, hides in a hollow tree, is discovered
    by another king’s hunt, and is taken to his palace as Allerleirauh, a lowly kitchen
    servant. At a feast she secretly appears in her sun-bright dress, dances with
    the king, vanishes, returns to disguise, and places a golden ring in the king’s
    soup, prompting him to summon the hidden cook.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The daughter asks for three dresses like the sun, moon, and stars, and for
    a mantle made from pieces of every animal skin in the kingdom.
