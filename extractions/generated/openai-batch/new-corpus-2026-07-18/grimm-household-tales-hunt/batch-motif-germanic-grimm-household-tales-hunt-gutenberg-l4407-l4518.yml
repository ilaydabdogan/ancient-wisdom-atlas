canonical_text:
  quote: ''
  summary: 'The passage concludes the tale of the four Bremen musicians, in which
    the donkey, hound, cat, and cock frighten robbers from a house and keep it. It
    then begins “The Singing Bone”: a destructive wild boar ravages a country, the
    king offers his daughter as reward for killing it, two brothers attempt the task,
    the younger receives a black spear from a little man and kills the boar, but the
    elder murders him, claims the reward, and is later exposed when a bone of the
    victim sings the truth through a shepherd’s horn.'
  language: English
  quote_policy: summarized
