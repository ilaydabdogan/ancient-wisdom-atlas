canonical_text:
  quote: ''
  summary: A young king follows a snow-white hart into a haunted forest, becomes lost,
    is deceived by a witch, and is turned to stone with his animals. His look-alike
    brother discovers a half-rusted, half-bright knife token, travels west to rescue
    him, is mistaken for the king, and places a two-edged sword between himself and
    the queen at night.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young King and Queen live happily together, and the King often goes hunting
    with his faithful animals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A nearby forest is reported to be haunted, and people who enter it are said
    not to get out easily.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young King sees a snow-white hart, tells his followers to wait, and rides
    into the forest after it with only his animals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The attendants wait until evening, the King does not return, and the young
    Queen is told he followed a white hart into the enchanted forest.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The hart repeatedly escapes the King's reach and eventually vanishes; the
    King finds himself deep in the forest and receives no answer when he blows his
    horn.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: At night the King dismounts, lights a fire near a tree, and sits there with
    his animals lying beside him.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: An old woman in the tree says she is cold but will not come down because she
    fears the animals will bite her; she throws down a wand and instructs the King
    to strike the animals with it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: When the King strikes the animals with the wand, they become stone; the witch
    then touches him with a wand and changes him to stone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The witch laughs and drags the King and animals into a vault where many more
    stones already lie.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: The other brother checks the knife placed in a tree trunk at their parting
    and sees that his brother's side is half rusted and half bright.
  category: object
  evidence_refs:
  - ev:3
- id: obs:11
  text: The other brother interprets the knife's condition as a sign that a misfortune
    has happened but that his brother may still be saved.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:12
  text: The other brother travels west with his animals and is mistaken for the young
    King because he looks very much like him and has wild animals with him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: The other brother decides to pass himself off as the young King so that he
    can rescue him more easily.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: At night the other brother is taken to the royal bed and places a two-edged
    sword between himself and the young Queen.
  category: action
  evidence_refs:
  - ev:4
