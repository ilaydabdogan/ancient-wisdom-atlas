canonical_text:
  quote: ''
  summary: 'The first part concludes a tale in which a dismissed queen is allowed
    to take away what is dearest to her, gives the king a sleeping draught, carries
    him to her little house, and explains that he himself is her most precious possession;
    the couple is reconciled. The next tale begins with a village parson and a peasant
    woman arranging a deception: she feigns illness, the parson preaches that a pilgrimage
    to Göckerli hill in Italy for laurel leaves will cure the sick, and the peasant
    husband sets out with a bag and kreuzer while the parson comes to the house. The
    peasant then meets his gossip, an egg-merchant.'
  language: English
  quote_policy: summarized
