canonical_text:
  quote: ''
  summary: A poor shoemaker cuts leather for shoes at night and repeatedly finds the
    shoes completed by morning, enabling him to prosper. He and his wife secretly
    watch and discover two little naked men doing the work at midnight. In gratitude,
    the couple makes clothing and shoes for them; the little men dress, sing that
    they need no longer be cobblers, dance away, and do not return, while the shoemaker
    continues to prosper.
  language: English
  quote_policy: summarized
