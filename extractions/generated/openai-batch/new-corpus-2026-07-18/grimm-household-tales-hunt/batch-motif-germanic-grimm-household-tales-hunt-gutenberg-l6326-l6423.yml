canonical_text:
  quote: ''
  summary: 'The passage includes three Grimm tale segments: an unnamed man ascends
    a strange godfather’s house and sees uncanny household phenomena and a horned
    godfather; in “Frau Trude,” a disobedient girl visits a forbidden woman, sees
    strange figures and a fire-headed witch form, and is turned into burning wood;
    in “Godfather Death,” a poor father rejects God and the Devil as godfather for
    his thirteenth child, chooses Death, and Death later gives the grown child a healing
    herb and rules for knowing when a patient may recover.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man visits his godfather after succeeding with water and enters a strange
    house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the first flight of stairs, a broom and shovel dispute, strike each other,
    and direct the man one flight higher.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the second and third flights, heaps of dead fingers and dead heads direct
    the man farther upward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the fourth flight, fishes on the fire frizzle, bake themselves, speak,
    and later serve themselves up.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: At the fifth flight, the man looks through a keyhole and sees the godfather
    with long horns; when the man enters, the godfather hides in bed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The godfather explains the strange sights as ordinary people or foods, denies
    the report of horns, and the man flees in alarm.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: A little girl is described as obstinate and inquisitive and goes to Frau Trude
    despite her parents’ prohibition.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The parents describe Frau Trude as a bad woman who does wicked things and
    say the girl will no longer be their child if she goes to her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The girl reports seeing a black man, a green man, and a blood-red man; Frau
    Trude identifies them as a collier, a huntsman, and a butcher.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The girl says she looked through the window and saw a figure she believed
    to be the devil with a head of fire; Frau Trude says the girl has seen the witch
    in her proper costume.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Frau Trude changes the girl into a block of wood, throws it into the fire,
    warms herself by it, and comments on its brightness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A poor man with twelve children has a thirteenth child and goes to the highway
    to ask the first person he meets to be godfather.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The poor man rejects God as godfather because he believes God gives to the
    rich and leaves the poor hungry.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The poor man rejects the Devil as godfather because he says the Devil deceives
    people and leads them astray.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The poor man chooses Death as godfather because Death says he makes all equal
    and the man says Death takes rich and poor without distinction.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: Death stands godfather at the christening and promises to make the child rich
    and famous.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:17
  text: When the boy has grown up, Death leads him into a forest, shows him an herb,
