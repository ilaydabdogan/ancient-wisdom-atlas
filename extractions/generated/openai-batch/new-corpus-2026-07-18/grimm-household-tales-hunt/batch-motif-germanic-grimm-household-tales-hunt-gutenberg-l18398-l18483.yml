canonical_text:
  quote: ''
  summary: A failed prince and other suitors die after sleeping through the princesses'
    secret nightly dancing. A wounded poor soldier receives advice and an invisibility
    cloak from an old woman, avoids the wine brought by the eldest princess, pretends
    to sleep, and follows the twelve princesses through a bed-opening into an underground
    route with silver, gold, and diamond trees. He takes twigs as tokens, crosses
    a lake with the princesses and twelve princes to a brightly lit castle, observes
    the dancing until the shoes are worn out, repeats the surveillance, and brings
    the twigs and a cup to the King as proof while the daughters listen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prince falls asleep, wakes to find all twelve princesses have danced and
    their shoes have holes, and is executed after the same result on later nights;
    other suitors also forfeit their lives.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A poor wounded soldier, no longer able to serve, travels toward the town where
    the King lives and meets an old woman on the road.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old woman tells the soldier not to drink the night wine, to pretend to
    sleep, and gives him a little cloak that will make him invisible so he can follow
    the twelve princesses.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The soldier goes to the King as a suitor, receives royal garments, and is
    taken at bedtime into the ante-chamber.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The eldest princess brings the soldier a cup of wine, but he lets the wine
    run into a sponge tied under his chin and drinks none of it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The soldier lies down and snores as though deeply asleep; the twelve princesses
    hear him and feel secure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The princesses take dresses from storage and dress before mirrors for the
    dance; the youngest says she feels a coming misfortune, and the eldest dismisses
    her fear.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The eldest taps her bed, it sinks into the earth, and the princesses descend
    through the opening; the soldier puts on the cloak and follows last with the youngest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the stairs the invisible soldier steps on the youngest princess's dress;
    she is frightened, while the eldest says the dress caught on a nail.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the bottom they stand in an avenue of trees with silver leaves; the soldier
    breaks off a twig, the tree cracks loudly, the youngest reacts, and the eldest
    explains the sound as a gun fired for joy.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: They pass avenues with gold leaves and bright diamond leaves; the soldier
    breaks a twig from each, causing loud cracks that frighten the youngest while
    the eldest calls them salutes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: They come to a great lake with twelve little boats, each holding a handsome
    prince waiting for the twelve princesses; each prince takes one princess, and
    the invisible soldier sits by the youngest.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: The youngest princess's prince notices the boat is heavier than usual, and
