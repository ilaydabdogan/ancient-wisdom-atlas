canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which a rich man wastes three wishes:
    one kills his horse, one traps his wife on a saddle, and the last frees her, leaving
    him with loss and vexation while poor people remain happy. It then begins “The
    Singing, Springing Lark”: a father departing on a journey asks his three daughters
    what gifts they want, seeks a singing lark for the youngest, finds one in a tree
    by a castle in a forest, and makes a dangerous bargain with a lion who owns it.'
  language: English
