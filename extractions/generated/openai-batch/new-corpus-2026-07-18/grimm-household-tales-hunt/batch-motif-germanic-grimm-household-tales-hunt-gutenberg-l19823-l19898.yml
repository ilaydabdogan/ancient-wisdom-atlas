canonical_text:
  quote: ''
  summary: The passage first gives several speakers' accounts of extreme laziness,
    including refusing to move, work, eat, drink, care for property, or avoid injury.
    It then presents the tale of a shepherd boy whose wise answers to a king's three
    unanswerable questions win him residence in the royal palace as the king's own
    child.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The seventh speaker says he crawls slowly, needs four strong men to push him
    onward, slept beside six other men, and had to be carried home.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eighth speaker says he will not step over a stone and will lie in wet
    mud until the sun dries him, turning only to let the sun shine on him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ninth speaker says bread and a jug were before him, but he was too idle
    to take the bread or lift the jug, and lay like a log all day.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The tenth speaker says a cart ran over his outstretched legs because he did
    not draw them back, leaving him with a broken leg and swollen calf.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The eleventh speaker says he was dismissed after refusing to carry books and
    leaving his master's clothes in dust until they became moth-eaten.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The twelfth speaker says he slept on a cart, lost hold of the reins, had horse
    gear stolen, left the cart stuck in a quagmire, and would have remained there
    if the master had not pushed it out.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A shepherd boy is said to be famous far and wide because of his wise answers
    to every question.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The King promises to regard the shepherd boy as his own child and house him
    in the royal palace if he answers three questions.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: For the question about drops of water in the ocean, the shepherd boy says
    all rivers must first be dammed until he has counted them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: For the question about stars in the sky, the shepherd boy makes countless
    fine points on white paper and says the stars equal the points, asking others
    to count them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: For the question about seconds in eternity, the shepherd boy describes a Diamond
    Mountain worn down by a little bird that sharpens its beak on it every hundred
    years; when the mountain is gone, the first second of eternity is over.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the answers, the King says the boy has answered like a wise man and
    will dwell with him in the palace as his own child.
  category: speech
  evidence_refs:
  - ev:6
