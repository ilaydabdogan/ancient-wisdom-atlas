canonical_text:
  quote: ''
  summary: A king’s young son frees a caged wild man after retrieving a hidden key,
    is carried into the forest, and is set by Iron John to guard a bright gold well.
    The boy fails a threefold trial when parts of his body or hair touch the well
    and become gilded. Iron John sends him away to learn poverty but promises aid
    if called. The boy then enters service in another palace and hides his golden
    hair while doing humble work.
  language: English
  quote_policy: summarized
