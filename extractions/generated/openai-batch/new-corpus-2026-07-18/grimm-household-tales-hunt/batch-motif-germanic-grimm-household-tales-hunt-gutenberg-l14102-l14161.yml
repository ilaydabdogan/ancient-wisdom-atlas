canonical_text:
  quote: ''
  summary: 'An old king condemns his youngest son to be secretly shot, but the huntsman
    warns and spares the prince after exchanging clothes with him. Gifts sent by three
    grateful kings cause the old king to regret the sentence and proclaim that his
    son may return to favor. A princess makes a bright golden road to her palace as
    a test for the right wooer: the elder princes ride beside it and are rejected,
    while the third son rides straight along it without noticing and is accepted as
    her deliverer and lord of the kingdom. After the wedding, he returns to his forgiven
    father and reports his brothers'' betrayal; the brothers have gone to sea and
    never return.'
  language: English
  quote_policy: summarized
