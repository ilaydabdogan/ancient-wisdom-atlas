canonical_text:
  quote: "“with every word she spoke, gold pieces fell from her mouth”"
  summary: An obedient girl is rewarded after following the little men's instructions,
    while her envious stepsister refuses courtesy and service and is punished. The
    stepmother later sends the rewarded girl to a frozen river, where the King finds
    and marries her. After the girl becomes Queen and bears a son, the stepmother
    and daughter throw her into a stream and substitute the daughter in her bed. At
    night a speaking duck appears and asks about the King, the household, and the
    baby.
  language: English
  quote_policy: quoted
