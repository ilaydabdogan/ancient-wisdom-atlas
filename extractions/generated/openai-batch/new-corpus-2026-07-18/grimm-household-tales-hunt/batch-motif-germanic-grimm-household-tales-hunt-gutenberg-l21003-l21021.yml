  quote: ''
  summary: Fir-twister stays at home cooking while Hans and Rock-splitter hunt. A
    small old mannikin or dwarf asks him for meat; when refused, the dwarf beats him.
    Fir-twister conceals the incident. The next day Rock-splitter stays home, likewise
    refuses meat, and is beaten by the dwarf; he and Fir-twister keep silent and expect
    Hans to undergo the same experience.
