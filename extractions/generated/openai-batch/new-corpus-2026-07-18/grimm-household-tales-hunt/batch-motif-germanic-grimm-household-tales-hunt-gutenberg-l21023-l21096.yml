canonical_text:
  quote: ''
  summary: Hans gives meat to a begging dwarf, refuses a third request, defeats him,
    and follows him to a rock-hole. Lowered by his companions into the depths, Hans
    finds a chained king’s daughter guarded by the dwarf, kills the dwarf, and sends
    the maiden upward in a basket. His companions betray him by dropping the basket,
    but Hans discovers the dwarf’s shining ring, summons spirits of the air, and is
    carried upward. He pursues his companions to the sea, is saved from drowning by
    the spirits, punishes the companions, brings the maiden home, and marries her.
  language: English
  quote_policy: summarized
