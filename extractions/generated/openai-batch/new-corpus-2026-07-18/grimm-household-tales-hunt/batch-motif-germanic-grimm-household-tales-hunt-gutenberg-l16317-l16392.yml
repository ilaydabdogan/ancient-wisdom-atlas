  quote: The bright sun will bring it to light
  summary: The passage includes the end of a tale in which a tailor’s apprentice murders
    a Jewish man, later confesses after seeing sunlight reflected from coffee, and
    is condemned when the story spreads. It then begins “The Blue Light,” where a
    wounded discharged soldier enters a forest, accepts lodging from a witch in exchange
    for labor, is lowered into a dry well to recover a blue light, refuses to hand
    it over before reaching the ground, and is abandoned in the well.
