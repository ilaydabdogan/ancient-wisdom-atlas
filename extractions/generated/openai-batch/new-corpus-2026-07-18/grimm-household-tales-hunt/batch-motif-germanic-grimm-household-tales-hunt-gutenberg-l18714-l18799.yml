canonical_text:
  quote: ''
  summary: 'A woman, her daughter, and her step-daughter meet the Lord disguised as
    a poor man asking the way. The mother and daughter refuse help, while the step-daughter
    guides him and receives three granted wishes: beauty, an inexhaustible purse,
    and Heaven after death. The mother and daughter are made black and ugly and become
    more jealous. The step-daughter’s brother Reginer paints her likeness; the widowed
    King sees it, falls in love, and sends Reginer to fetch her as bride. The step-mother
    uses witchcraft to impair Reginer’s sight and the bride’s hearing, then deceives
    the bride during the carriage journey into giving her golden dress and hood to
    the black maiden.'
  language: English
  quote_policy: summarized
