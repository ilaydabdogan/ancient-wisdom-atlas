canonical_text:
  quote: ''
  summary: The passage closes an episode in which the Swabian allies attack what they
    think is a dragon or devilish monster, only for Master Schulz to discover it is
    a hare. They later reach the Moselle; Schulz misunderstands a distant man's words
    as an instruction to wade, drowns, and the other six follow after mistaking a
    frog's croak for his call. The next tale begins with three poor apprentices who
    meet a richly dressed man revealed as the Devil by his mixed human and horse feet;
    he promises money and status if they answer all questions only with three fixed
    phrases, which they then use at an inn.
  language: English
  quote_policy: summarized
