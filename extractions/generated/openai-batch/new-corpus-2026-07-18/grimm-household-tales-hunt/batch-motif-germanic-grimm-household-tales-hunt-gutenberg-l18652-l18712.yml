canonical_text:
  quote: ''
  summary: A proud maiden tries to avoid marrying the youth by imposing a fire ordeal,
    but the Frosty One survives it. The maiden is forced to marry; her mother sends
    warriors and knights after the bridal party, but the youth's extraordinary servants
    destroy the pursuers with water and a destructive gaze. After church blessing,
    the servants leave. The prince then deceives his wife into believing he is a swineherd,
    has her royal clothing removed, and makes her share lowly work until she repents
    her pride. She is then brought to the palace, recognizes her husband in kingly
    dress, and the wedding is celebrated.
  language: English
  quote_policy: summarized
