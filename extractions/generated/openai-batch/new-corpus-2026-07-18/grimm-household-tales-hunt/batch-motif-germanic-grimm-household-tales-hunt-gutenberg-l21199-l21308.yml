canonical_text:
  quote: ''
  summary: Two older daughters, lost after birds remove their trail markers, reach
    an old man's forest house, eat with him, neglect the household animals, and are
    let down into a cellar while asleep. The youngest daughter is also lost after
    wood-pigeons eat the peas marking her way, reaches the same house, cares for and
    feeds the hen, cock, and brindled cow before eating herself, receives their good-night
    blessing, prepares the beds, prays, and falls asleep.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A guest who has eaten and drunk with the old man but had no thought for the
    animals is told by them to find her own night lodging.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man tells the girl to prepare a room with two beds and clean white
    linen, later finds her asleep, opens a trap-door, and lets her down into the cellar.
  category: sequence
  evidence_refs:
  - ev:2
