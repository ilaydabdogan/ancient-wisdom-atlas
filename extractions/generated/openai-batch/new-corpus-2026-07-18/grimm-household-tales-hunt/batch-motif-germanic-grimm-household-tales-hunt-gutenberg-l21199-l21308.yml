  text: The youngest daughter thinks sorrowfully about her hungry father and grieving
    mother before seeing a light and reaching the forest house.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The old man asks the hen, cock, and brindled cow what they say about allowing
    the youngest daughter to stay, and they answer with the word “Duks.”
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The youngest daughter pets the cock and hen, strokes the cow, makes soup,
