canonical_text:
  quote: ''
  summary: Three underpaid soldiers desert during a war and hide in a cornfield, where
    a fiery dragon, identified as the Devil, rescues them in exchange for seven years
    of service. He gives them a whip that produces gold and makes them sign a book,
    promising release if they can answer a riddle at the end of the term. Near the
    deadline, one soldier is guided to the Devil's grandmother, who hides him beneath
    a stone and gets the Devil to reveal the riddle's answer. The soldier returns
    to his companions, and when the Devil comes with the signed book, the first soldier
    begins to answer.
  language: English
  quote_policy: summarized
