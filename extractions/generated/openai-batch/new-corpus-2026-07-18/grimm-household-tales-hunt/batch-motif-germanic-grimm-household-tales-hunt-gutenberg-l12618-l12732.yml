canonical_text:
  quote: ''
  summary: A princess traveling to her bridegroom loses a cloth bearing three drops
    of blood after her waiting-maid refuses to serve her water. The maid then forces
    an exchange of horse, clothes, and status, compels the princess to silence, and
    is received at court as the bride. The true princess is made to tend geese with
    Conrad. The maid has the faithful horse Falada killed, but the princess arranges
    for Falada’s head to be hung at a dark gateway, where it speaks to her. In the
    meadow, the princess’s golden hair attracts Conrad, and she commands the wind
    to keep him from taking it.
  language: English
  quote_policy: summarized
