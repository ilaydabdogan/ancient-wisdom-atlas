canonical_text:
  quote: ''
  summary: 'The passage concludes a riddle episode in which a mantle proves the King''s
    daughter''s nocturnal questioning of a youth. It then gives the tale of a mouse,
    a bird, and a sausage whose happy household fails after they exchange tasks: the
    sausage is eaten by a dog, the mouse dies in the cooking pot, and the bird drowns
    after causing a fire. The next tale begins with an oppressed stepdaughter who
    loses a blood-marked shuttle in a well, jumps in after it, awakens in a meadow,
    helps speaking bread and an apple tree, and approaches a frightening old woman.'
  language: English
  quote_policy: summarized
