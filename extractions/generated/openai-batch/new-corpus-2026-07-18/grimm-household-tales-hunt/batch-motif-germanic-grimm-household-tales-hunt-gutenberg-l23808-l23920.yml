canonical_text:
  quote: ''
  summary: The passage contains the conclusion of a tale in which a King's daughter
    uses a wishing-ring to obtain three celestial dresses and trades them for nights
    outside a bridegroom's door until he remembers her as his true bride. It then
    gives the tale of the Ear of Corn, explaining how divine anger at human misuse
    of abundant grain reduced corn ears to their present size, with partial mercy
    granted for birds. The final lines begin The Grave-Mound with a rich farmer surveying
    his wealth.
  language: English
  quote_policy: summarized
