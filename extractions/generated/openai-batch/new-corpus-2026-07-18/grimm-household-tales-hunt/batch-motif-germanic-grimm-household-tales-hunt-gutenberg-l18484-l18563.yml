canonical_text:
  quote: ''
  summary: The first segment concludes a tale in which a soldier reveals the princesses’
    underground nightly visit, produces tokens, receives the eldest princess in marriage,
    and is promised the kingdom. The next tale begins with a sorceress queen whose
    daughter attracts suitors; failed suitors are beheaded after impossible tasks.
    A king’s son, lovesick for the maiden, is allowed to seek her and recovers. On
    his journey he recruits a series of extraordinary servants with immense size,
    hearing, height, destructive sight, reversed heat and cold, and far-seeing vision.
  language: English
  quote_policy: summarized
