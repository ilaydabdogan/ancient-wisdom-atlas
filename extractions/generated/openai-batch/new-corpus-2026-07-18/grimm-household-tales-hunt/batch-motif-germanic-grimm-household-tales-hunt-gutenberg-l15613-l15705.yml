canonical_text:
  quote: ''
  summary: A servant receives from a dwarf a never-missing gun, a fiddle that compels
    dancing, and a power by which no one can refuse his requests. He uses the gun
    to shoot a bird desired by a Jewish man, forces the man to dance in thorn-bushes
    with the fiddle until he offers a purse of gold, is later accused before a judge
    and sentenced to hang, and secures permission to play the fiddle once more as
    a last request.
  language: English
  quote_policy: summarized
