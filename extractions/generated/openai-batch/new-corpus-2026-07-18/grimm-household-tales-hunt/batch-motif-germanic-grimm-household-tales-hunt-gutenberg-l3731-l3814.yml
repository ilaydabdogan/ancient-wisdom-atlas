canonical_text:
  quote: ''
  summary: Cinderella flees from the King’s son, leaving a golden slipper on a pitch-smeared
    staircase. The King’s son declares he will marry only the woman whose foot fits
    the slipper. The two sisters each mutilate a foot at their mother’s urging and
    are exposed by pigeons at the hazel-tree because of blood in the shoe. Cinderella
    is called, cleans herself, fits the slipper, and is recognized as the true bride.
    At the wedding, pigeons blind the two false sisters as punishment for wickedness
    and falsehood.
  language: English
  quote_policy: summarized
