canonical_text:
  quote: ''
  summary: 'A king refuses to give his youngest daughter until her elder sisters marry,
    so the king''s son flees with her. During pursuit, the daughter changes him and
    herself into successive forms: briar and rose, church and priest, fish-pond and
    fish. Her parents fail to recover her; her mother gives her three walnuts for
    times of need. The couple reaches the prince''s home territory, but after his
    mother kisses him he forgets his bride, who waits in the village and then takes
    service in the castle mill.'
  language: English
  quote_policy: summarized
