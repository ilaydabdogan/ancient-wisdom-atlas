canonical_text:
  quote: ''
  summary: A hungry little tailor repeatedly considers killing animals for food but
    spares a stork, young ducks, and bees after they plead or threaten and promise
    future help. He later prospers as court-tailor. A jealous shoemaker falsely tells
    the king that the tailor can recover a lost ancient gold crown; the king orders
    the task on pain of exile. The spared duck and her young retrieve the crown from
    the pond, and the king rewards the tailor. The shoemaker then makes a second false
    accusation, causing the king to demand a wax model of the entire palace on pain
    of underground imprisonment.
  language: English
  quote_policy: summarized
