  quote: ''
  summary: A mocked youngest brother named Simpleton receives magical aid from a fat
    toad and obtains a beautiful carpet, a jeweled ring, and a transformed maiden,
    winning a contested royal succession and the crown. The passage then begins “The
    Golden Goose,” introducing another mocked youngest son, Dummling; his two elder
    brothers refuse a grey-haired old man’s request for food and drink in the forest
    and are injured while cutting wood, after which Dummling asks to go himself and
    is given poor provisions.
