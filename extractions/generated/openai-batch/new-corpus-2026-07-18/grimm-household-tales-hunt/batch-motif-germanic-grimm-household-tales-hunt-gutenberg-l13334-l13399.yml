canonical_text:
  quote: ''
  summary: A deserted husband loses his wife, child, and ring while asleep; acquires
    a sword, cloak, and boots from three giants; returns invisibly to the Golden Mountain
    during his wife’s planned wedding to another; declares himself the true king;
    and uses the sword’s command to kill the assembled opponents and regain rule.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man leads the woman from the town to a field and stream, asks to sleep
    on her lap, and falls asleep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: While he sleeps, the woman removes a ring from his finger, withdraws herself
    while leaving a slipper behind, takes her child, and wishes herself back to her
    own kingdom.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When he wakes, the man finds his wife, child, and ring gone, with only the
    slipper remaining as a token.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The man decides he cannot return to his parents because they would call him
    a wizard, and he walks until he reaches his own kingdom.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At a hill, three giants are disputing over how to divide their father’s property.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The giants’ inheritance consists of a sword with a head-severing command,
    a cloak that makes the wearer invisible, and boots that carry the wearer to any
    wished-for place.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The man obtains the three inherited objects by asking to test them; the cloak
    makes him invisible and changes him into a fly, and the sword cuts a tree trunk
    in two.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After putting on the boots, the man wishes to be on the Golden Mountain and
    vanishes from the giants’ sight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Near his palace, the man hears music and celebration and is told that his
    wife is celebrating her wedding with another.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The man enters the palace unseen with the cloak and repeatedly takes food
    and wine that his wife serves herself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The wife withdraws to her chamber and weeps; the man follows, accuses her,
    strikes her, and makes himself visible.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The man declares in the hall that the wedding is over and that the true king
    has returned.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The assembled kings, princes, and councillors mock him, then try to seize
    him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The man uses the sword’s command; all heads except his own fall, and he becomes
    master and king of the Golden Mountain again.
  category: action
  evidence_refs:
