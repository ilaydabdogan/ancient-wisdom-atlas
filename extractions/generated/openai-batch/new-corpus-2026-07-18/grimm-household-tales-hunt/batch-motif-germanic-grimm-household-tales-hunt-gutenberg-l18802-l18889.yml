canonical_text:
  quote: ''
  summary: 'A bride is pushed from a carriage into deep water and appears as a white
    duck while a black substitute is taken to the King. The duck later visits a kitchen,
    is recognized and restored to maiden form, exposes the deception, frees her brother,
    and the witch and daughter are punished. The passage then begins “Iron John”:
    huntsmen vanish in a dangerous royal forest, a strange huntsman investigates,
    a dog is dragged into a pool by an arm from the water, and a wild man is found,
    bound, and caged.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bride is pushed from the carriage at a bridge, falls into deep water,
    and a snow-white duck arises from the water at the same time she sinks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The brother does not observe the fall and brings the black maiden to the King
    as his sister, partly because his eyes are dim and he sees the golden garments
    glittering.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The King orders the coachman thrown into a pit full of adders and nests of
    snakes, while the old witch deceives the King so that he keeps and marries her
    daughter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A white duck swims to the kitchen, asks the kitchen-boy to light a fire to
    warm her feathers, and asks what her brother Reginer and the black witch are doing.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The duck comes on three nights, and the kitchen-boy eventually reports the
    matter to the King.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The King cuts through the duck’s neck with his sword, and the duck suddenly
    changes into a beautiful maiden like the picture made by her brother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The restored maiden says she was betrayed by cunning and falsehood, thrown
    into the water, and asks first that her brother be brought out from the snake
    pit.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The old witch, unaware that the King is describing her own actions, states
    a punishment involving being stripped, put into a nail-studded barrel, and drawn
    by a horse; this is done to her and her daughter.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The King marries the white and beautiful bride and rewards her brother with
    wealth and distinction.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A King has a great forest near his palace, and huntsmen and hounds sent into
    it do not return; afterward people avoid the forest.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: A strange huntsman enters the dangerous forest with his dog despite the King’s
    warning, and the dog is seized and drawn under by a naked arm from a deep pool.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The huntsman brings three men with buckets to bale out the pool, and they
    find a wild man at the bottom whose body is brown like rusty iron and whose hair
    reaches to his knees.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The wild man is bound, led to the castle, put in an iron cage, and the Queen
    is given the key; afterward the forest can be entered safely again.
  category: sequence
  evidence_refs:
  - ev:9
