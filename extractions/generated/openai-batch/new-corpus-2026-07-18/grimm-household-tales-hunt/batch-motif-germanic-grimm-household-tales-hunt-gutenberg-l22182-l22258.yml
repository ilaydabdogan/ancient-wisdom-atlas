canonical_text:
  quote: ''
  summary: The passage first closes a preceding tale with the narrator’s uncertain
    beliefs about a princess, a count, snow-white geese who may have been maidens,
    and an old woman identified as wise rather than a witch. It then tells how Adam
    and Eve, after expulsion from Paradise, prepare their household for God’s visit.
    Eve presents only her beautiful children and hides the ugly ones; God blesses
    the first group with high social ranks. Eve then brings out the hidden children,
    and God blesses them with trades and service roles. When Eve protests the unequal
    gifts, God explains that different roles are necessary so all may support one
    another.
  language: English
  quote_policy: summarized
