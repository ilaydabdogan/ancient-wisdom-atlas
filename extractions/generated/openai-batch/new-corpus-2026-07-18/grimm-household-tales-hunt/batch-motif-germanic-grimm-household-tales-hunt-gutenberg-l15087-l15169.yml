canonical_text:
  quote: ''
  summary: A hungry tailor is mistreated by a shoemaker in a forest and gives first
    one eye and then the other in exchange for bread. The shoemaker abandons the now-blind
    tailor at a gallows. The tailor overhears two hanged men say that dew from the
    gallows can restore sight, washes his eye sockets with the dew, receives new eyes,
    thanks God, and continues on. He then meets a talking foal, releases it after
    it pleads that it is too young to carry him, and the foal hints it may later reward
    him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tailor remains in a forest for several days, exhausts his bread, becomes
    hungry, and continues to rely on God and luck.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shoemaker eats while the tailor watches, refuses him bread, mocks him,
    and is described as pitiless.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the fifth morning the shoemaker offers the tailor bread only if he may
    put out the tailor's right eye, and he does so with a sharp knife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The tailor remembers a saying formerly spoken by his mother: one should eat
    what one can and suffer what one must.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: When hunger returns, the shoemaker offers bread in exchange for putting out
    the tailor's other eye; the tailor prays to God, warns that the wrong will be
    requited, and asks not to be abandoned.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The shoemaker puts out the tailor's left eye, gives him bread and a stick,
    draws him behind him, and later abandons him at a gallows outside the forest.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: At daybreak the tailor is near two hanged men on the gallows, with a crow
    sitting on each man's head.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: One hanged man tells the other that dew fallen over them from the gallows
    restores eyes to anyone who washes with it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The tailor moistens his pocket-handkerchief with dew from the grass, washes
    his eye sockets, and immediately receives healthy new eyes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After his sight is restored, the tailor sees the sunrise, mountains, the royal
    city, leaves, birds, and midges, and successfully threads a needle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The tailor kneels, thanks God, says his morning prayer, prays for the hanged
    men, and leaves singing and whistling.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The tailor catches a brown foal and tries to ride it; the foal speaks, asks
    to be released because it is too young, and says it may later reward him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The tailor releases the foal, gives it a light touch with a switch, and the
    foal joyfully runs away across hedges and ditches.
  category: action
  evidence_refs:
  - ev:7
