canonical_text:
  quote: ''
  summary: The passage first recounts a comic marvel tale in which a peasant's oxen
    grow enormous horns, a lost turnip seed becomes a tree reaching the sky, and the
    peasant climbs to heaven, sees angels threshing oats, and returns with a heavenly
    flail after escaping a falling tree and a deep hole. It then begins the tale of
    a king's son foretold to die by a stag; while hunting he pursues a stag that is
    replaced by a tall man, is taken through a lake to a palace, and is subjected
    to death-staked night watches over three princesses and then to an impossible
    forest-clearing task with glass tools.
  language: English
  quote_policy: summarized
