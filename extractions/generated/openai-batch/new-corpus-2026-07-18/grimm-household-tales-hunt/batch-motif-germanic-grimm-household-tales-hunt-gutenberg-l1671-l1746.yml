canonical_text:
  quote: ''
  summary: A maiden plucks twelve white lily flowers in a bewitched garden, causing
    her twelve brothers to become ravens. An old woman tells her that only seven years
    of silence and no laughter can free them. The maiden keeps the condition while
    living in a tree, is discovered by a hunting king, marries him, and remains silent.
    The king's mother slanders her, and she is condemned to be burned. At the end
    of the seven years the ravens return, become her brothers again, extinguish the
    fire, and free her. She explains her silence, and the wicked stepmother is punished.
    The passage then begins another tale in which a cock and hen go to a hill for
    nuts and dispute over a nut-shell carriage.
  language: English
  quote_policy: summarized
