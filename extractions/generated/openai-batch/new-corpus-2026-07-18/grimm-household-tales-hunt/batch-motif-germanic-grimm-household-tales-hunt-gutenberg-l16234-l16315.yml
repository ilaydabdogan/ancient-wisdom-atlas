canonical_text:
  quote: ''
  summary: 'A princess tests three suitors with a riddle about the two colors of hair
    on her head. The little tailor gives the correct answer, but the princess imposes
    a further trial: he must spend the night in a stable with a deadly bear. The tailor
    tricks the bear with pebbles, music, and a vise, survives the night, and is taken
    to church for the promised marriage. Two envious tailors release the bear, but
    the tailor frightens it away by threatening to put it back in the vise.'
  language: English
  quote_policy: summarized
