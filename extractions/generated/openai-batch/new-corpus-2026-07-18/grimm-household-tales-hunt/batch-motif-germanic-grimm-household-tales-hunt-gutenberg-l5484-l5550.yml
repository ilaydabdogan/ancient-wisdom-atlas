canonical_text:
  quote: ''
  summary: A tailor grieves after his sons are gone. His eldest son becomes a joiner
    and receives from his master a plain wooden table that furnishes food and wine
    when commanded. The son uses it while traveling, feeds guests at an inn, and sleeps
    there. The innkeeper secretly substitutes a similar ordinary table. The son returns
    home to his father and publicly tries to demonstrate the table's power, but it
    fails, causing shame and mockery.
  language: English
  quote_policy: summarized
