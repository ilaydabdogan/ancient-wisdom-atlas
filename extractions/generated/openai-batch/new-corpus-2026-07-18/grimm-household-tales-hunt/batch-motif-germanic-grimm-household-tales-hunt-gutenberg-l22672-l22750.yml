canonical_text:
  quote: ''
  summary: 'A boy mistakes honey and wine for poison, goes to a grave expecting death,
    and dies there from wine and cold dew. The farmer''s household then burns and
    the farmer and wife live in poverty and remorse. A new tale begins: a motherless
    girl is oppressed by her stepmother, assigned an impossible task of picking twelve
    pounds of feathers, and aided by a kind old woman who completes the work while
    the girl sleeps; the stepmother then plans harder work.'
  language: English
  quote_policy: summarized
