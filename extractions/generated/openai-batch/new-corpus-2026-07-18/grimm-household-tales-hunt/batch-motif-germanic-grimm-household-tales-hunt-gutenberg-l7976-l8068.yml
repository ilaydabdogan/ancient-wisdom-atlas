canonical_text:
  quote: ''
  summary: Snow-white accepts the poisoned red half of an apple from the Queen in
    disguise and falls dead. The dwarfs mourn her, place her unchanged body in a glass
    coffin on a mountain, and keep watch. A king's son obtains the coffin; when it
    is carried away, a stumble dislodges the apple piece from Snow-white's throat
    and she revives. She agrees to marry him. At the wedding, the mirror names the
    young Queen as fairest, and the wicked stepmother is forced to dance in red-hot
    iron shoes until she dies.
  language: English
  quote_policy: summarized
