canonical_text:
  quote: ''
  summary: A poor peasant named Crabb adopts the title Doctor Knowall after following
    a doctor's instructions about books, clothes, and a sign. A lord summons him to
    find stolen money. At the castle, Crabb's ordinary remarks are misread by guilty
    servants as proof that he knows their crime, leading them to confess and reveal
    the hiding place. A fifth servant hiding in a stove also exposes himself after
    misunderstanding Crabb's words. Crabb reveals the money's location, keeps the
    thieves unnamed, receives rewards, and becomes renowned.
  language: English
  quote_policy: summarized
