canonical_text:
  quote: ''
  summary: 'The passage concludes a tale of four skilled brothers who rescue a king''s
    daughter from a dragon: the astronomer locates her, the thief removes her from
    the sleeping dragon, the huntsman kills the dragon, and the tailor repairs the
    shattered ship. The king judges their claims equal and gives each half a kingdom
    instead of marriage to the princess. The passage then begins the tale of One-eye,
    Two-eyes, and Three-eyes: Two-eyes is mistreated by her mother and sisters because
    she has ordinary eyes, weeps while tending a goat, and receives instructions from
    a wise woman for summoning food through the goat.'
  language: English
  quote_policy: summarized
