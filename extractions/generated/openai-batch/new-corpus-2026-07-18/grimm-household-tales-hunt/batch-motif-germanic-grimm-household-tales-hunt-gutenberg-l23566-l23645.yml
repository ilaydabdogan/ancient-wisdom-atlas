canonical_text:
  quote: ''
  summary: A young drummer finds white linen by a lake and later learns it is the
    dress of a king's daughter held by a witch on the glass-mountain. After returning
    the dress, he undertakes to reach the glass-mountain through a forest of man-eaters.
    He tricks giants by claiming a hidden army follows him, gains transport from three
    giants, and reaches the foot of the smooth glass-mountain, where he cannot climb.
  language: English
  quote_policy: summarized
