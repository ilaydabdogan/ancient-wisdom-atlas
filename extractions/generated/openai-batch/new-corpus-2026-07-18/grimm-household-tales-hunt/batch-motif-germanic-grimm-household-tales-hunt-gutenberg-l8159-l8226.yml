canonical_text:
  quote: ''
  summary: A young man uses summoned soldiers to recover a wishing-cloth after exchanges
    with charcoal-burners, obtains a cannon-firing hat and a horn that can destroy
    fortifications, returns home, is rejected by his wealthy brothers because of his
    ragged appearance, summons armed men to punish them, defeats royal troops with
    the hat, and demands the king's daughter and governing power as terms of peace.
  language: English
  quote_policy: summarized
