- id: obs:1
  text: At the young man's command, soldiers go to a charcoal-burner and bring back
    the wishing-cloth without extended questioning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A second charcoal-burner is preparing supper by a fire and invites the young
    man to eat potatoes with salt but without dripping.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man spreads out the cloth, which is immediately covered with fine
    dishes, and he and the charcoal-burner eat and drink together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The second charcoal-burner offers an old worn-out hat whose turning makes
    cannons fire and shoot down opposition; the young man trades the cloth for it
    and then has soldiers fetch the cloth back.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A third charcoal-burner offers a horn whose blowing makes walls and fortifications
    fall and towns and villages become ruins; after the trade the young man again
    has soldiers retrieve the cloth, leaving him with the knapsack, hat, and horn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the young man returns home, his brothers have a handsome house from silver
    and gold, but they refuse to acknowledge him because he appears in ragged clothing
    with a shabby hat and old knapsack.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In anger, the young man taps his knapsack until one hundred and fifty armed
    men appear, orders them to surround his brothers' house, and has two men beat
    his brothers with hazel-sticks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king sends troops against the man with the knapsack; the man summons more
    men and turns the hat so that heavy guns fire, causing the king's men to flee.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The young man states that he will not make peace unless the king gives him
    his daughter as wife and lets him govern the kingdom in the king's name; the king
    agrees out of necessity.
  category: speech
  evidence_refs:
  - ev:8
