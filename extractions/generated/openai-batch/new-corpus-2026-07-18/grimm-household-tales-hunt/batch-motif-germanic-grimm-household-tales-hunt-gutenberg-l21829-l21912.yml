canonical_text:
  quote: ''
  summary: The passage concludes a tale in which Master Pfriem dreams that he has
    died and entered heaven, where he is warned not to find fault but repeatedly judges
    heavenly arrangements by earthly standards and is expelled before waking. The
    passage then opens “The Goose-Girl at the Well,” describing an old woman living
    with geese in a mountain waste, feared as a witch, and encountered in the forest
    by a young man while gathering grass and fruit.
  language: English
