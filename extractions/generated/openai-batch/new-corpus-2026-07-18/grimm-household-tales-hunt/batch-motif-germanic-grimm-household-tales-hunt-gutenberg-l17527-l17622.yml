  quote: ''
  summary: The passage closes one tale by recounting Ferdinand the Faithful’s reliance
    on a speaking white horse to obtain a sleeping princess, recover her writings,
    retrieve a pen from the lake with help from a fish, survive and benefit from the
    Queen’s decapitation magic, and witness the white horse become a king’s son. It
    then begins “The Iron Stove,” where a bewitched king’s son speaks from an iron
