canonical_text:
  quote: ''
  summary: The second son is rewarded by his miller-master with an ass that drops
    gold when commanded. At a public-house, the host discovers the animal's power,
    steals it at night, and substitutes another ass. The son returns to his father
    expecting to enrich the family, but the substituted animal produces no gold and
    the deception is discovered.
  language: English
  quote_policy: summarized
