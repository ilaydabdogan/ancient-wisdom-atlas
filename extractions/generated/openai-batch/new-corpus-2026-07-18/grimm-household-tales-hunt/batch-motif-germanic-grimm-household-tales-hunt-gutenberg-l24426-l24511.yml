  quote: "“Scarcely were the words said than they all sat motionless as if made of
    stone...”"
  summary: A fearless discharged soldier meets a lost huntsman in a forest. They enter
    a robber’s stone house despite an old woman’s warning. Hidden behind the stove,
    they are discovered by twelve robbers. The soldier boldly asks for food and drink,
    then uses a bottle and a spoken toast to make the robbers sit motionless as if
    made of stone. He later brings comrades from town back to the house and begins
    to release or revive the motionless robbers, but the supplied passage ends mid-action.
  language: English
  quote_policy: quoted
