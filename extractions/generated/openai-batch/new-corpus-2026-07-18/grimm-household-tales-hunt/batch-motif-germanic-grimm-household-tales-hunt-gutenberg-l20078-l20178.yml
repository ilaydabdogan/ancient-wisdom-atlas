canonical_text:
  quote: ''
  summary: 'The passage includes adjacent short Grimm items: a Schlauraffen-style
    catalogue of impossible wonders and lies; ''The Ditmarsch Tale of Wonders,'' another
    catalogue of impossible actions, inverted abilities, dry-land sailing, and lies;
    ''A Riddling Tale,'' in which three women are transformed into flowers and a husband
    frees one by recognizing the flower without dew; and the opening of ''Snow-White
    and Rose-Red,'' introducing a poor widow, two rose-trees, two devoted daughters,
    harmony with forest animals, and a shining child identified as a guardian angel.'
  language: English
  quote_policy: summarized
