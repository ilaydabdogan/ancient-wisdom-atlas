  text: The eldest daughter goes into the forest with pancakes, bread, and cheese,
    and finds St. Joseph in his little hut.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When St. Joseph asks for food, the eldest daughter tells him to wait until
    she is satisfied and eats nearly all of the soup, leaving him to scrape the dish.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: St. Joseph offers the eldest daughter his bed and intends to lie on straw,
    and she takes the bed without opposition, leaving him the straw.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The next morning the eldest daughter looks for a money-bag but finds a second
    nose attached to her own; after she begs St. Joseph, he removes it and gives her
    two farthings.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The eldest daughter tells her mother that she had received a great bag of
    money but lost it, and the mother tries to go seek it with her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the way, lizards and snakes break loose on the eldest daughter and her
    mother; the reptiles sting the daughter to death and sting the mother in the foot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A poor mother with twelve sons prays that all her sons may be on earth with
    the promised Redeemer and sends them into the world to seek bread.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Peter, the eldest son, loses his way in a great forest and becomes so hungry
    and weak that he lies down believing death is near.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A small shining boy appears beside Peter, asks why he is troubled, hears that
    Peter seeks bread and wishes to see the promised Saviour, and tells him to come
    along so his wish will be fulfilled.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The shining child leads Peter between cliffs into a radiant cavern containing
    gold, silver, crystal, and twelve cradles standing side by side.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Peter lies in the first cradle and is rocked to sleep by the little angel;
