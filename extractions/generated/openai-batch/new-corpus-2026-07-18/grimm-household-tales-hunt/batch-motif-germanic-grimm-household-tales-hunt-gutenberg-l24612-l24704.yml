canonical_text:
  quote: ''
  summary: 'The passage contains the end of a St. Joseph episode in which one child
    receives money while an eldest daughter withholds food and bed-comfort from St.
    Joseph, is punished with a second nose, lies about receiving money, and is later
    killed by reptiles while her mother is stung. It then gives the legend of the
    Twelve Apostles: a poor mother with twelve sons prays that they may be with the
    promised Redeemer; Peter and then his brothers are guided by angelic children
    to a radiant cavern with twelve cradles, sleep there for three hundred years,
    and awaken at Christ''s birth as the twelve apostles. It also gives the legend
    of the Rose: a poor woman''s youngest child is helped in the forest by a strange
    child, receives a rose and a promise of return when it blooms, and dies happily
    on the morning the rose blooms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A child wakes after St. Joseph has vanished, finds a small sack of money behind
    the door, takes it to her mother, and secretly keeps two pieces.
  category: sequence
  evidence_refs:
  - ev:1
