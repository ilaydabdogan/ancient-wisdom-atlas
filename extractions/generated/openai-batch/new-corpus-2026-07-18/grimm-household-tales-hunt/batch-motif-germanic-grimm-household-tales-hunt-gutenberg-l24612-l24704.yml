candidate_motifs:
- id: motif:1
  label: Hospitality to a holy stranger brings material reward or bodily punishment
  taxonomy_refs:
  - sacred_exchange
  - divine_judgment
  basis: One child receives a money sack after sleeping at St. Joseph's hut, while
    the eldest daughter withholds food and comfort from St. Joseph and is punished
    with a second nose before receiving only two farthings after begging.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage begins after earlier parts of the St. Joseph episode, so the
    full contrast with the previous children is only partially visible in this line
    range.
- id: motif:2
  label: Reptiles execute a moralized punishment
  taxonomy_refs:
  - serpent
  - divine_judgment
  basis: Lizards and snakes attack the eldest daughter and her mother; the daughter
    is called wicked and is stung to death, while the mother is stung in the foot
    because she had not brought her up better.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage gives a moral explanation for the stinging but does not state
    that St. Joseph or another figure sends the reptiles.
- id: motif:3
  label: Angelic child guides a starving seeker to a hidden radiant cavern
  taxonomy_refs:
  - miraculous_child
  - departure
  basis: Peter leaves home seeking bread, becomes lost and weak in a forest, and is
    guided by a shining child to a cavern filled with gold, silver, crystal, and twelve
    cradles.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The guide is described both as a small shining boy and as a little angel;
    the extraction preserves both labels without resolving them beyond the passage.
- id: motif:4
  label: Long enchanted sleep until sacred birth
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: Peter and his eleven brothers sleep in golden cradles for three hundred years
    and awaken on the night the Saviour of the world is born, after angelic children
    have guided and rocked them.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage frames the awakening in Christian legendary terms; it does
    not provide further details of their later apostolic lives.
- id: motif:5
  label: Twelve poor brothers become the twelve apostles
  taxonomy_refs:
  - sacred_birth
  basis: The poor mother has twelve sons, prays for them to be with the promised Redeemer,
    and after their three-hundred-year sleep they awaken at Christ's birth and are
    called the twelve apostles.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: high
  cautions: This is an etiological legend in the passage; it does not match canonical
    apostolic call narratives in detail within the supplied text.
- id: motif:6
  label: Miraculous child helper gives a flower sign linked to death and promised
    return
  taxonomy_refs:
  - miraculous_child
  - return
  basis: A strange child helps the youngest child gather wood, disappears, gives a
    rose, and says he will return when it blooms; the child dies happily on the morning
    the rose is in full bloom.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The strange child's actual return is not narrated; the connection between
    the blooming rose and the child's death is presented by sequence rather than explicit
    explanation.
