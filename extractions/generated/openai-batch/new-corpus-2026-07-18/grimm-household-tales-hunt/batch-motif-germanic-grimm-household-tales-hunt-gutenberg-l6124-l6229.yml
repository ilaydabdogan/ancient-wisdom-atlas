canonical_text:
  quote: ''
  summary: 'A mother recovers her child from elves by following a neighbor’s advice
    to make the changeling laugh at water boiled in egg-shells. The passage then begins
    “The Robber Bridegroom”: a miller promises his daughter to a rich-seeming suitor
    whom she fears. She follows ash marks to his dark forest house while dropping
    peas and lentils. A caged bird and an old woman warn her that the house is a murderers’
    den. Hidden behind a hogshead, she witnesses robbers kill another girl; a severed
    finger with a ring falls into her bosom. The old woman drugs the robbers, helps
    the bride escape, and sprouted peas and lentils guide them back to the mill.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mother’s child has been taken from its cradle by elves, and a changeling
    with a large head and staring eyes has been laid in its place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The neighbor tells the mother to place the changeling on the kitchen hearth,
    light a fire, and boil water in two egg-shells so that the changeling will laugh.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The changeling says he is as old as the Wester forest, laughs at the egg-shell
    boiling, and a host of little elves brings back the right child and takes the
    changeling away.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: A miller promises his beautiful grown daughter to a rich-seeming suitor, but
    the daughter feels secret horror and lacks confidence in him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The bridegroom says his house is in the dark forest and promises to strew
    ashes for the maiden to follow; she also drops peas and lentils to mark the way.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The maiden reaches a solitary dark house in the darkest part of the forest,
    and a caged bird warns that it is a murderer’s house.
  category: setting
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: An aged woman in the cellar tells the maiden she is in a murderer’s den, that
    the inhabitants eat human flesh, and that a kettle of water has been prepared
    for her.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The aged woman hides the maiden behind a great hogshead and plans to escape
    with her when the robbers sleep.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The robbers bring another young girl, give her three glasses of wine, tear
    off her clothing, cut her body in pieces, and strew salt on it while the hidden
    bride watches.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A robber cuts off the murdered girl’s finger to get a gold ring; the finger
    falls into the bride’s bosom, and the aged woman diverts the search.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The aged woman puts a sleeping-draught in the robbers’ wine, after which the
    bride steps over the sleeping robbers and escapes with the aged woman.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The ash trail has blown away, but the peas and lentils have sprouted and show
    the bride and aged woman the way back by moonlight; in the morning they reach
    the mill, and the maiden tells her father what happened.
  category: sequence
  evidence_refs:
  - ev:12
