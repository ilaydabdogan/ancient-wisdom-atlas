canonical_text:
  quote: ''
  summary: A giant raises Thumbling by suckling him and repeatedly tests his strength
    by having him uproot increasingly large trees. Returned to his parents, the transformed
    youth is rejected, performs extreme farm labor, eats more than the household can
    supply, breaks several iron staffs, leaves home, and enters a smithy, where his
    first blow shatters the iron and sinks the anvil.
  language: English
  quote_policy: summarized
