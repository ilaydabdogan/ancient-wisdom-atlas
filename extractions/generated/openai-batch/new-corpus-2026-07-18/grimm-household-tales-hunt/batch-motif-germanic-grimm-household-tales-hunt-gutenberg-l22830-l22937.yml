canonical_text:
  quote: "“Keep true to me, and never let any one else kiss thee on this cheek.”"
  summary: A maiden who owns a magnificent castle becomes betrothed to a king’s son
    beneath a lime-tree. After he leaves and does not return, she seeks him, becomes
    a cow-herd, and hides her treasures. She later recognizes him on the road as a
    prince preparing for another marriage. At a three-day festival she appears successively
    in sun, moon, and star garments. On the third night she kisses his left cheek,
    he recognizes her as the true bride, and they return to the magic castle to be
    married.
  language: English
  quote_policy: quoted
