canonical_text:
  quote: ''
  summary: A king's son is repeatedly guided by a fox in quests for a Golden Bird,
    a Golden Horse, and a princess from the Golden Castle. In each acquisition attempt
    he is warned against a specific action, disobeys or yields, and is captured. His
    death sentences are converted into further conditions. At the end of the passage,
    the fox completes the impossible task of removing a hill, forcing the king to
    give his daughter as promised.
  language: English
  quote_policy: summarized
