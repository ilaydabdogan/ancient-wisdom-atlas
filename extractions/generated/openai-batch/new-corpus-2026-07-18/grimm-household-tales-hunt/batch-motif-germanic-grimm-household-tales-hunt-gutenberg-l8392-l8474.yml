canonical_text:
  quote: ''
  summary: A girl flees with Roland after her stepmother kills her own child by mistake.
    With a stolen magic wand and speaking blood drops she delays discovery, then uses
    transformations to evade and finally kill the pursuing witch. Roland later leaves
    to arrange a wedding but forgets her after falling into another's snares. The
    girl remains disguised as a landmark and then a flower, is taken by a shepherd,
    secretly keeps his house, is restored by a white cloth, and refuses marriage because
    she remains faithful to Roland.
  language: English
  quote_policy: summarized
