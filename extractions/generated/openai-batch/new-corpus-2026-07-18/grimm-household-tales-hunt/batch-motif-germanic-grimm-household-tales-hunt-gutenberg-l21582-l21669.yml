canonical_text:
  quote: ''
  summary: 'The passage first concludes a preceding tale episode in which a town burns
    a barn to destroy a feared owl or monster. It then gives the tale of the Moon:
    a dark land without moon or stars is visited by travellers who find another kingdom
    using a moon-like lamp fastened to an oak. They steal it, install it on a high
    oak at home, and maintain it for wages. As the four caretakers die, each has a
    quarter of the moon buried with him, causing darkness to return. In the world
    below the moon pieces reunite and awaken the dead, whose disorder reaches heaven.
    Saint Peter descends, subdues the dead, returns them to their graves, takes the
    moon, and hangs it in heaven.'
  language: English
  quote_policy: summarized
