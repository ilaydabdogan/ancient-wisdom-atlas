canonical_text:
  quote: ''
  summary: A pious miller’s daughter prevents the devil from taking power over her
    through washing, tears, and a chalk circle. Under demonic threat, her father cuts
    off her hands, but her tears cleanse the stumps and the devil loses all right
    over her. She departs, reaches a royal garden surrounded by water, prays, and
    is helped by an angel who makes a dry passage through the moat. She eats one counted
    pear with her mouth, is mistaken for a spirit, then is questioned by a priest
    and identified as a human sufferer. The king takes her to the palace, has silver
    hands made for her, and marries her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The miller’s daughter is described as beautiful and pious, and as having lived
    three years in the fear of God and without sin.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the Evil-one is to fetch her, she washes herself clean and draws a circle
    around herself with chalk; the devil appears but cannot come near her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The devil tells the miller to take away all water from her so that she cannot
    wash, and the miller obeys out of fear.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The next morning she has wept on her hands so that they are clean; the devil
    again cannot approach and orders the miller to cut off her hands.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Evil-one threatens to take the father himself if he does not cut off his
    daughter’s hands.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The daughter tells her father to do with her what he will, lays down both
    hands, and lets them be cut off.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the hands are cut off, she weeps so much on the stumps that they become
    clean, and the devil loses all right over her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The miller offers to keep her delicately because of the wealth he has received,
    but she says she cannot stay and will go forth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: She has her maimed arms bound to her back, sets out at sunrise, walks all
    day, and reaches a royal garden by night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The royal garden contains trees with beautiful fruit and is surrounded by
    much water, preventing her from entering at first.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: Hungry, she kneels, calls on God the Lord, and prays; an angel comes and makes
    a dam so that the moat becomes dry and she can walk through it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Inside the garden she sees a tree with counted pears and eats one pear with
    her mouth, and no more.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The gardener sees her but is afraid because an angel stands by her, and he
    thinks the maiden is a spirit.
  category: relationship
  evidence_refs:
