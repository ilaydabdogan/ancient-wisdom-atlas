canonical_text:
  quote: ''
  summary: The passage contains the end of one tale, all of “The Louse and the Flea,”
    and the beginning of “The Girl Without Hands.” A luck-child uses answers learned
    from the devil to restore a barren tree and a dry well, returns with the devil’s
    golden hairs and gold, and redirects a greedy king to a ferryman’s burden. In
    the next tale, a louse’s burning triggers a cumulative chain of reactions ending
    when a spring floods and drowns all participants. In the final excerpt, a poor
    miller accepts wealth from a stranger in exchange for what stands behind his mill,
    later learning from his wife that the bargain concerns their daughter rather than
    the apple-tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The luck-child tells a watchman that the mouse gnawing at an unfruitful tree’s
    root must be killed so the tree will again bear golden apples; he receives two
    asses laden with gold.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The luck-child tells another watchman that a toad beneath a stone in the dry
    well must be found and killed so the well will again give wine; he receives two
    more asses laden with gold.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The luck-child returns home to his wife, brings the King the devil’s three
    golden hairs, and the King says the conditions are fulfilled.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The King asks whether he too can fetch gold, and the luck-child directs him
    to a river and a ferryman.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The ferryman puts the oar in the King’s hand and leaves; the King must ferry
    as punishment for his sins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A louse and a flea keep house together and brew beer in an egg-shell; the
    louse falls in and burns herself, and the flea screams.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After hearing of the louse’s burning and the flea’s weeping, the door creaks,
    the broom sweeps, the cart runs, the ash-heap burns, and the tree shakes off its
    leaves.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A girl breaks her water-pitcher after hearing the cumulative report of the
    preceding events.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The spring begins to flow violently, and its water drowns the girl, tree,
    ash-heap, cart, broom, door, flea, and louse.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A poor miller has only his mill and a large apple-tree behind it, and meets
    an unfamiliar old man in the forest.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: The old man offers to make the miller rich if the miller promises what is
    standing behind the mill; the miller gives a written promise, thinking of the
    apple-tree.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The stranger says he will return after three years to carry away what belongs
    to him, and wealth appears in the miller’s house.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The miller’s wife says the stranger must have been the devil and that he meant
    their daughter, who was behind the mill sweeping the yard.
  category: speech
  evidence_refs:
  - ev:12
