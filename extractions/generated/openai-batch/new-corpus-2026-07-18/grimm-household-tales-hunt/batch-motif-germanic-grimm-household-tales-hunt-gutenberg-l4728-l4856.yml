candidate_motifs:
- id: motif:1
  label: Restoration of barren sources by killing hidden animals
  taxonomy_refs: []
  basis: A tree will again bear golden apples after a mouse at its root is killed,
    and a dry well will again give wine after a toad beneath a stone is killed.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage gives only the remedies and results, not a fuller explanation
    of why the animals cause the barrenness.
- id: motif:2
  label: Supernatural knowledge used to solve local problems
  taxonomy_refs:
  - wisdom
  basis: The luck-child transmits answers he heard from the devil to solve the watchmen’s
    problems and receives rewards.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The taxonomy link to wisdom is functional; the passage presents the answers
    as reported knowledge rather than a teaching scene.
- id: motif:3
  label: Greedy ruler trapped in ferryman’s task
  taxonomy_refs:
  - trickster_boundary
  basis: The King eagerly seeks more gold at a river ferry, receives the oar from
    the ferryman, and must ferry thereafter as punishment for his sins.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The boundary-crossing and deceptive transfer are clear, but the taxonomy
    label is broader than the literal wording of the passage.
- id: motif:4
  label: Cumulative chain reaction ending in drowning
  taxonomy_refs:
  - chaos
  basis: A small accident spreads through repeated reports and reactions until the
    spring flows violently and drowns all participants.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The tale’s cumulative structure is explicit; the taxonomy link to chaos
    is interpretive and should be reviewed.
- id: motif:5
  label: Bargain with a stranger for what stands behind the house or mill
  taxonomy_refs:
  - sacred_exchange
  basis: The old man offers riches for what stands behind the mill, and the miller
    gives a written promise while thinking only of the apple-tree.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The exchange is supernatural or demonic in context, but the available
    taxonomy label is approximate.
- id: motif:6
  label: Unintended pledge of a child
  taxonomy_refs: []
  basis: The miller thinks he has promised the apple-tree, but his wife says the devil
    meant their daughter, who was standing behind the mill.
  evidence_refs:
  - ev:10
  - ev:12
  confidence: high
  cautions: The excerpt ends before the stranger returns, so the later consequences
    of the pledge are outside this passage.
