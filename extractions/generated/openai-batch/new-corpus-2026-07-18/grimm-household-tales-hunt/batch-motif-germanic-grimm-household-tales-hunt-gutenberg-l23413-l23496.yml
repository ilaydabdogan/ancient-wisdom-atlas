canonical_text:
  quote: ''
  summary: 'The master-thief first disguises himself as an old peasant woman and uses
    wine mixed with a sleeping-drink to put the count''s soldiers to sleep, then steals
    a guarded horse. After returning with the horse, he undertakes a second theft:
    he uses a hanged body as a decoy so that the count leaves the bedroom, then imitates
    the count''s voice and obtains the countess''s sheet and wedding-ring.'
  language: English
  quote_policy: summarized
