  text: He raises the sleeping rider into the air while still on the saddle by fastening
    ropes to the saddle and wall ring.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: He wraps the horse's hoofs in old rags to prevent noise on the stony pavement,
