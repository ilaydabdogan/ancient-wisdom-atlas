  text: The master-thief buys old peasant woman's clothes, wears them, darkens his
    face, and paints wrinkles so that he is not recognized.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He fills a small cask with old Hungary wine mixed with a powerful sleeping-drink
    and carries it in a basket on his back.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: At night he reaches the count's castle, sits in the courtyard, and is invited
    by soldiers near the stable fire to warm himself.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The disguised master-thief gives or sells the wine to soldiers outside the
    stable and to soldiers inside the stable.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The soldiers who drink the wine fall asleep; some snore, and those outside
    lie motionless on the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Inside the stable, one soldier is on the saddled riding-horse, one holds the
    bridle, and one holds the tail before they fall asleep.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: The master-thief replaces the bridle with a rope in one sleeping soldier's
    hand and gives straw to the one who held the horse's tail.
  category: action
  evidence_refs:
  - ev:4
