    screens them by asking whether they have red stockings and a pointed mouth. The
    wolf and other animals are rejected, but a young fox with the desired traits is
    admitted. Mrs. Fox orders preparations for the wedding feast and has the old husband
    thrown out; the wedding with young Mr. Fox follows with rejoicing and dancing.
