canonical_text:
  quote: ''
  summary: Bearskin helps an impoverished old man, receives a promised bride from
    among the man's daughters, leaves a split ring as a betrothal token, endures the
    remaining years of his trial, is cleansed by the Devil on the final day, returns
    transformed and is recognized by the ring, reunites with the youngest daughter,
    while the two elder sisters die and the Devil claims their souls.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bearskin sits alone in the evening, wishes the seven years were over, hears
    loud lamenting nearby, and opens the door because he has a compassionate heart.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old man weeps, wrings his hands, first tries to escape from Bearskin, then
    explains that his property is gone, he and his daughters face starvation, and
    he cannot pay the innkeeper.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bearskin pays the innkeeper and also puts a purse of gold into the old man's
    pocket.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The old man offers Bearskin a choice of one of his daughters as wife; the
    eldest is frightened, the second rejects him because of his appearance, and the
    youngest says her father's promise must be kept.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bearskin breaks a ring in two, gives one half to the youngest daughter, keeps
    the other half, writes each name on the other's half, and says he must wander
    for three more years.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The betrothed bride dresses entirely in black, thinks of Bearskin with tears,
    and is mocked by her sisters with bear-related warnings and jokes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bearskin travels from place to place, does good where he can, and gives generously
    to the poor so that they may pray for him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the last day of the seven years, Bearskin sits beneath a circle of trees
    on the heath; the Devil appears, throws him his old coat, and asks for the green
    coat back.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Before returning the green coat, Bearskin requires the Devil to make him clean;
    the Devil fetches water, washes him, combs his hair, and cuts his nails.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the cleansing, Bearskin looks like a brave soldier and is handsomer
    than before.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bearskin goes into town in a magnificent velvet coat, rides in a carriage
    drawn by four white horses, and is not recognized at his bride's house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The two eldest daughters admire the unknown handsome visitor and prepare splendid
    dresses, each thinking she may be chosen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The bride, still dressed in black, receives wine from the stranger, finds
    his half of the ring at the bottom of the glass, joins it with her own half, and
    sees the pieces fit.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Bearskin identifies himself as the betrothed bridegroom, says he has received
    his human form again through God's grace, embraces the bride, and kisses her.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: After learning the handsome man is Bearskin and belongs to the youngest sister,
    the two elder sisters leave in anger and rage; one drowns herself in a well and
    the other hangs herself on a tree.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: In the evening, the Devil appears at the door in his green coat and says he
    has received two souls in place of Bearskin's one.
  category: speech
  evidence_refs:
  - ev:7
