canonical_text:
  quote: ''
  summary: Thumbling is swallowed with hay by a cow, speaks from inside the cow, and
    causes the cow to be killed after the maid and pastor think the animal is speaking
    or possessed. The cow's stomach containing Thumbling is swallowed by a wolf. Thumbling
    lures the wolf into his father's house for food, makes noise when the wolf is
    too large to escape, and is rescued when his parents kill and cut open the wolf.
    He returns to his parents, who promise not to sell him again.
  language: English
  quote_policy: summarized
