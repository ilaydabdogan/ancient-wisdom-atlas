  quote: ''
  summary: Three impoverished brothers set out to seek fortune. The eldest takes silver
    from a silver hill and returns home; the second takes gold from a gold hill and
    returns. The third continues through a larger forest, receives and tests a wishing-cloth
    that produces food, then trades it to a charcoal-burner for a soldier's knapsack
    that summons armed men when tapped.
