  quote: ''
  summary: The passage concludes one tale with a hidden sea-hare discovered under
    a woman's hair, restoration of true forms at a spring, the youth's thanks to the
    fox, and the youth's marriage to the princess and accession to kingship. It then
    begins “The Master-Thief,” where a richly dressed stranger arrives at a poor old
    couple's house, asks for rustic potatoes, and speaks with the peasant about an
    absent son who had run away and was known for sharpness and bad tricks.
