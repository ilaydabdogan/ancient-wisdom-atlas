canonical_text:
  quote: ''
  summary: An old witch compels a girl to help steal a huntsman's wishing-cloak. The
    girl lures him to Garnet Mountain, where he is put to sleep and robbed. Abandoned
    there, the huntsman overhears giants and uses a cloud to escape to a walled cabbage
    garden. He discovers one kind of cabbage changes him into an ass and another restores
    his human form, then takes both kinds and returns in disguise toward the girl's
    castle.
  language: English
  quote_policy: summarized
