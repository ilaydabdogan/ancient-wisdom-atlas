canonical_text:
  quote: ''
  summary: A transition moral advises imitating prudent John. A new tale begins by
    saying that a poor tailor can win honors with luck. A traveling tailor’s apprentice
    becomes lost in a forest, spends the night in an oak, follows a light to a hut,
    and is reluctantly sheltered by an old man. In the morning he sees a black bull
    and a stag fight; the stag kills the bull, carries the tailor on its horns to
    a rock wall, opens a rock door, and vanishes behind fire and smoke. A voice tells
    the tailor to enter a stone hall, then to stand on the middle stone, which sinks
    and carries him into a lower hall containing glass vessels, glass chests, and
    a miniature castle complex.
  language: English
  quote_policy: summarized
