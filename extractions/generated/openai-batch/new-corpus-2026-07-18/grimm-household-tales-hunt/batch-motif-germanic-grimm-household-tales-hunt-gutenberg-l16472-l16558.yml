canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which an imprisoned soldier uses
    a blue light and pipe to summon a black mannikin, who overpowers the judge, constable,
    and king, causing the king to surrender his kingdom and daughter. It then gives
    the tale of a willful child punished by illness and death, whose arm rises from
    the grave until the mother strikes it with a rod. It begins the tale of three
    army-surgeons who remove their own hand, heart, and eyes for later restoration
    by salve; after a servant leaves the body parts unattended, a cat steals them,
    and substitute parts are gathered from a hanged thief, the cat, and a pig.
  language: English
  quote_policy: summarized
