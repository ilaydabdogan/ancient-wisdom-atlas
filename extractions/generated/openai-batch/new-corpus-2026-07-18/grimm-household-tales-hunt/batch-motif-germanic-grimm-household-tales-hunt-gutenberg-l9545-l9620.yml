canonical_text:
  quote: ''
  summary: A huntsman arrives at court after wagering with an innkeeper that he will
    marry the king’s daughter despite her planned wedding to the marshal. The huntsman
    uses the dragon’s seven tongues, the princess’s handkerchief, and ornaments given
    to his animal companions as proof that he, not the marshal, killed the dragon.
    He accuses the marshal of cutting off his head while he slept and falsely claiming
    the victory. The princess confirms the truth and explains her enforced silence.
    The marshal is judged and executed; the huntsman marries the princess, receives
    royal office, rewards his family, and shows mercy to the innkeeper.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the inn, the huntsman declares that he will go to the king’s court and
    marry the king’s daughter; the host objects that she is already betrothed and
    that the wedding is set for that day.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The huntsman produces a handkerchief containing the monster’s seven tongues
    and stakes a thousand gold pieces against the innkeeper’s house and courtyard.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king asks his daughter why wild animals have been entering and leaving
    the palace, and she tells him to summon the master of the animals.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When invited, the huntsman requests royal clothing, a carriage with six horses,
    and attending servants before he will come to court.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king sends the requested apparel, carriage, horses, and servants; the
    huntsman puts on the royal garments, takes the handkerchief with the dragon tongues,
    and goes to the king with his animals following.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: At court, the huntsman is seated near the king and the king’s daughter, while
    the marshal sits as bridegroom on the other side and does not recognize him.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The seven heads of the dragon are brought in as a spectacle, and the king
    says that the marshal cut them off and will therefore marry the king’s daughter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The huntsman opens the seven dragon mouths, asks where the tongues are, produces
    the seven tongues from the handkerchief, and places each tongue into its matching
    mouth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The huntsman shows the princess’s embroidered handkerchief; the princess says
    she gave it to the one who killed the dragon.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The huntsman shows the animals’ collars and the lion’s golden clasp; the princess
    says these ornaments were hers and that she divided them among the animals who
    helped conquer the dragon.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: The huntsman says that while he slept after the fight, the marshal cut off
    his head, carried away the king’s daughter, and falsely claimed to have killed
    the dragon.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The huntsman reports that his animals healed him with a wonderful root, that
    he traveled with them for a year, and that he learned of the marshal’s treachery
    from the innkeeper’s story.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The king’s daughter confirms that the huntsman killed the dragon and explains
    that the marshal forced her to promise silence, which led her to delay the marriage
    for a year and a day.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The king summons twelve councillors, who sentence the marshal to be torn to
    pieces by four bulls, and the marshal is executed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The king gives his daughter to the huntsman and names him viceroy over the
    whole kingdom; the wedding is celebrated with joy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The young king brings his father and foster-father and loads them with treasures;
