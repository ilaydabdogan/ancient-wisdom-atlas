  quote: ''
  summary: Two-eyes, deprived of her goat, follows a wise woman's counsel to bury
    the goat's entrails. A tree with silver leaves and golden fruit grows from them,
    yields only to Two-eyes, exposes her sisters' false claim to a knight, and follows
    Two-eyes after the knight takes her away and marries her.
