canonical_text:
  quote: ''
  summary: At a royal feast, a huntsman is seated beside the King and reveals himself
    as the King's son, accusing the old cook of abducting him and framing the Queen.
    The cook is exposed from dog form, imprisoned, and later executed; a pink flower
    is restored to a maiden; the Queen is brought from the tower, dies after three
    days, and angelic doves attend her grave. The son marries the maiden. A new tale
    begins by introducing Grethel, a cook who admires herself, drinks wine, tastes
    food, and begins preparing two fowls for a guest before going to the cellar to
    drink while the guest is delayed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The King made a great feast for his entire household and required the huntsman
    to sit beside him despite the huntsman's protest that he was poor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The huntsman thought of his mother in the tower and wished that a principal
    servant would ask whether the Queen was alive or dead; the marshal then asked
    the King about her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The King said the Queen had let his dear son be torn to pieces by wild beasts
    and refused to have her named.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The huntsman addressed the King as father, said the Queen was still alive,
    identified himself as her son, and said the old cook had carried him away and
    sprinkled the Queen's apron with chicken blood.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dog with the golden collar was identified as the wretch, compelled to
    devour live coals until flames burst from its throat, and then wished back into
    the form of the cook, with a white apron and knife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The King became angry, ordered the cook cast into the deepest dungeon, and
    later ordered him torn into four pieces.
  category: action
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:7
  text: The huntsman said a maiden had raised him tenderly and had not murdered him;
    he brought out a pink flower and wished it into the maiden's own form.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Queen was fetched from the tower to the royal table, ate nothing, spoke
    of God supporting and delivering her, lived three more days, and died happily.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Two white doves that had brought food to the Queen in the tower and were angels
    of heaven followed her body and sat on her grave.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Grief consumed the aged King's heart and he soon died; his son married the
    beautiful maiden who had been brought as a flower in his pocket.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Grethel is introduced as a cook who wore shoes with red rosettes, admired
    herself, drank wine, and tasted the best of what she cooked.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Grethel prepared two fowls on a spit for an expected guest; when the guest
    was delayed and the master left to fetch him, she set the spit aside, went to
    the cellar, and drank.
  category: sequence
  evidence_refs:
  - ev:8
