canonical_text:
  quote: "“if thou pushest back the bolt of this glass coffin, then I shall be free.”"
  summary: A tailor, guided by a voice, finds a living maiden in a glass coffin and
    releases her. She tells him that a magician punished her refusal of his proposal
    by transforming her brother into a stag, enclosing her castle in a glass chest,
    confining her people in bottles as smoke, and imprisoning her in an underground
    cave. She asks the tailor to help restore what has been enchanted.
  language: English
  quote_policy: quoted
