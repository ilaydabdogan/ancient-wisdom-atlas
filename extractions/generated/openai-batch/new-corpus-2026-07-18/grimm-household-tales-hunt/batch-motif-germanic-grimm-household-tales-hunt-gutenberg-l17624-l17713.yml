canonical_text:
  quote: ''
  summary: A king's daughter promises to return to an iron stove in the forest, scrape
    it open with a knife, release the being inside, and marry him. Two substitute
    women fail the task and are rejected. The king's daughter releases a jeweled youth,
    a king's son, but then breaks a three-word speech restriction, causing the stove
    to disappear far away. She searches for him, reaches a house inhabited by toads,
    and tells them her story; a fat toad orders a great box to be brought.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king's daughter promises the speaker associated with the iron stove that
    she will return with a knife, scrape a hole in the iron, set it free, and marry
    it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A silent companion walks near the king's daughter and brings her home in two
    hours; she tells her father what happened in the forest.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old king sends the miller's daughter in his daughter's place; she scrapes
    the stove for twenty-four hours but removes no iron and is rejected after she
    refers to her father's mill.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old king then sends the swine-herd's daughter; she also scrapes for twenty-four
    hours without success and is rejected after she refers to her father's horn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The voice in the stove tells the swine-herd's daughter that the king's daughter
    must come and that the kingdom will be ruined if she does not.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king's daughter returns, scrapes the iron, makes a hole, sees a handsome
    youth adorned with gold and precious jewels, enlarges the hole, and releases him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The released youth declares the king's daughter to be his bride and permits
    her to visit her father on the condition that she speak no more than three words
    to him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king's daughter speaks more than three words; the iron stove disappears
    and is taken far away over glass mountains and piercing swords, while the king's
    son is no longer shut inside it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: She searches for the iron stove for nine days, becomes very hungry, climbs
    a small tree at night, sees a distant light, prays, and walks toward it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At a little old house surrounded by grass, she sees toads of different sizes
