canonical_text:
  quote: ''
  summary: A father sparrow is separated from his four fledged young after boys pull
    down their nest. In autumn he reunites with them and questions each about where
    he spent the summer. The older three describe gardens, court, roads, and mountain
    people, and the father gives practical warnings about traps, weapons, stones,
    and predatory birds. The youngest reports that he lived in a church, fed harmlessly
    on insects, heard preaching, and trusted God as creator and protector of birds;
    the father approves this reliance on divine protection, and a closing verse states
    the moral.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sparrow had four young in a swallow’s nest; after they fledged, boys pulled
    out the nest, but all the young birds escaped in a high wind.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father sparrow grieved that his sons had gone into the world before he
    had warned and instructed them about dangers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In autumn many sparrows assembled in a wheatfield, where the father met his
    four children again and took them home.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The eldest son spent the summer in gardens eating caterpillars, small worms,
    and later cherries; the father warned him about hollow green poles with holes,
    and the son recognized a concealed version from a merchant’s garden.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The second son spent time at court; the father listed courtly goods, equipment,
    predatory birds, and stable grain, while the son noted traps, gins, and snares
    set in straw by stable-boys.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The third son traveled on cart-roads and highways, broke up tubs and ropes,
    and found grain; the father warned him about people stooping to pick up stones,
    and the son added that mountaineers sometimes carry ore or rock in advance.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The father called the youngest son the silliest and weakest and advised him
    to stay nearby, avoid fierce birds, and feed on spiders and caterpillars from
    trees or the house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The youngest son answered that one who feeds without harming others and commits
    himself to God and lawful food will be protected from hawks, eagles, and kites.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The youngest son said the wind carried him to a church, where he ate flies
    and spiders from windows, heard preaching, and was fed and protected through the
    summer.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The father approved taking refuge in churches, clearing away insects, crying
    to God, and committing oneself to the eternal Creator; a closing verse states
    that God protects one who commits his ways to God, suffers, waits, prays, and
    keeps faith and conscience pure.
  category: speech
  evidence_refs:
  - ev:7
