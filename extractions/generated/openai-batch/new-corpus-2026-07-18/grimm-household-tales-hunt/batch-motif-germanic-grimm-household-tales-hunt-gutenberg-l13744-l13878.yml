canonical_text:
  quote: ''
  summary: 'The passage first completes an episode in which a peasant is sent on a
    false healing pilgrimage, returns hidden in an egg-basket, overhears song exchanges,
    and drives out the parson. It then begins “The Three Little Birds”: a king marries
    a cowherd girl; her childless sisters cast her first two sons and then a daughter
    into water, while a little bird sings over each child and the sons are rescued
    by a fisherman.'
  language: English
  quote_policy: summarized
