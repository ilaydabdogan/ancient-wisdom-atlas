canonical_text:
  quote: ''
  summary: 'The passage first recounts Dummling sharing poor food and drink with a
    little old grey man, receiving good luck, finding a golden goose at a tree root,
    and leading a chain of people stuck to the goose until the spectacle makes a serious
    princess laugh, leading to marriage and later kingship. It then begins the tale
    of Allerleirauh: a dying queen with golden hair makes the king promise to remarry
    only someone equally beautiful with the same hair; no such bride is found, and
    the king turns his desire toward his own daughter, whom the councillors condemn
    as a forbidden bride.'
  language: English
  quote_policy: summarized
