canonical_text:
  quote: ''
  summary: A king's son traveling with a faithful servant spends the night at a witch's
    house despite a warning. A poisoned parting drink kills his horse; a raven eats
    the poisoned carcass, is killed by the servant, and is later cooked at an inn
    where twelve murderers, the innkeeper, and the witch eat it and die. The king's
    son later enters a life-staking riddle contest with a proud princess and uses
    the poison-chain episode as his riddle; the princess attempts to discover the
    answer by sending nocturnal listeners and finally comes herself.
  language: English
  quote_policy: summarized
