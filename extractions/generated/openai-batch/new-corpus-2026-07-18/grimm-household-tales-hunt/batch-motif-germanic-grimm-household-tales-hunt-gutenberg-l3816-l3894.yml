- id: obs:1
  text: A king's son desires to travel around the world and takes only a faithful
    servant with him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In a great forest after dark, the travelers find a small house and a young
    maiden who warns that her stepmother practices wicked arts and is hostile to strangers.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The old woman sits by the fire, pretends friendliness, and is cooking or brewing
    something in a small pot; the daughter warns the travelers not to eat or drink
    anything.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the morning the old woman brings a parting draught; when the glass breaks,
    poison falls on the horse and kills it immediately.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A raven eats from the dead horse; the servant kills the raven and takes it
    with him to an inn, where it is prepared for supper.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The inn is a den of murderers; twelve murderers intend to kill and rob the
    strangers, but eat soup containing the raven with the innkeeper and the witch
    and all fall dead from the transmitted poison.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The innkeeper's daughter, described as honest and not involved in the crimes,
    opens the doors and shows the travelers the heaped-up treasures; the king's son
    refuses to take them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In a town, a beautiful but proud princess has proclaimed that any man who
    gives her an unsolved riddle will become her husband, but if she solves it his
    head will be cut off; nine suitors have already died.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The king's son poses the riddle, 'One slew none, and yet slew twelve'; the
    princess cannot solve it from thought or riddle-books.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The princess sends a maid, then a maid-in-waiting, and then comes herself
    at night to learn the answer; the servant thwarts the first two attempts, while
    the king's son answers the princess's questions when she visits in a misty-grey
    mantle.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
