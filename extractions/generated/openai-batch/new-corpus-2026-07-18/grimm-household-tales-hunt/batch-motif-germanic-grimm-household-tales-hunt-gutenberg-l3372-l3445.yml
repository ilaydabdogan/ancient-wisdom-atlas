  quote: Seven at one stroke.
  summary: A little tailor travelling with a giant turns accidents and misunderstandings
    into apparent feats of strength. He survives a giant’s attempted killing in a
    cave, reaches a royal palace, is taken for a great warrior because of his girdle
    inscription, enters the King’s service, and is commissioned to kill two destructive
    giants in exchange for the princess and half the kingdom.
  language: English
  quote_policy: quoted
