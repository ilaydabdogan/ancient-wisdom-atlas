canonical_text:
  quote: ''
  summary: 'The passage closes one tale with a poor-looking musician who learned music
    in hell, plays before a king, marries the willing youngest princess after the
    eldest refuses, and later gains the kingdom. It then begins ''Bearskin'': a dismissed
    brave soldier, rejected by his brothers, wanders to a heath, meets a green-coated
    cloven-footed stranger later identified as the Devil, proves courage by shooting
    a bear, accepts a seven-year condition of bodily neglect and prayer-abstention
    in exchange for wealth, receives a money-producing coat and bearskin cloak-bed,
    becomes monstrous in appearance while wandering, gives money to the poor for prayers,
    and obtains concealed lodging at an inn by paying ducats.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man in a shabby smock-frock, who had learned music while with the Devil
    in hell, plays before an old King and delights him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old King promises the man his eldest daughter in marriage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The eldest daughter refuses to marry the common fellow in the smock-frock
    and says she would rather go into the deepest water.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The King gives the youngest daughter to the man; she is willing to do it to
    please her father, and the man later receives the kingdom after the King dies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: A young soldier is brave during war, is dismissed when peace comes, and has
    no home because his parents are dead.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The soldier's brothers refuse to take him in and tell him to make a living
    for himself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The soldier goes to a wide heath with a circle of trees and reflects that
    he has no money and no trade except fighting.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:8
  text: A strange stately man in a green coat with a hideous cloven foot appears and
    offers gold and possessions if the soldier is fearless.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: At the stranger's command, the soldier looks behind him, sees a large growling
    bear, shoots it through the muzzle, and the bear falls dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: 'The green-coated stranger sets a seven-year condition: the soldier must not
    wash, comb beard or hair, cut nails, or say a paternoster; if he dies during the
    term he belongs to the stranger, and if he lives he will be free and rich.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Devil gives the soldier a green coat whose pocket always contains money,
    removes the bear's skin, makes it the soldier's cloak and bed, names him Bearskin,
    and vanishes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Bearskin wears the coat and bearskin, goes into the world, spends freely,
    and by the second year has hair over much of his face, a felt-like beard, claw-like
    fingers, and a dirt-covered face.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: People run away from Bearskin, but he gives poor people money to pray that
    he will not die during the seven years, and he can still obtain shelter because
    he pays well.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the fourth year, an innkeeper initially refuses Bearskin, then accepts
    ducats and gives him an outhouse room on condition that he remain unseen.
  category: sequence
  evidence_refs:
  - ev:8
