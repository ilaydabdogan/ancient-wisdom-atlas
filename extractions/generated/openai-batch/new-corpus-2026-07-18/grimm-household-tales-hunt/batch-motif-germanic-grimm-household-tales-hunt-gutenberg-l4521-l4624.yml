canonical_text:
  quote: ''
  summary: A self-singing horn reveals a murdered man's skeleton and leads to the
    punishment of the wicked brother. The next tale begins with a poor woman's caul-born
    son, prophesied to marry the King's daughter. The hostile King buys the child,
    casts him in a box into water, but the box floats to a mill where the boy is rescued
    and raised. Years later the King recognizes him and sends him with a letter ordering
    his death; the boy loses his way in a forest and sleeps in a thieves' den. The
    robbers read the letter, pity him, replace it with a command that he marry the
    princess, and the Queen carries out the wedding. The King then demands that the
    young man fetch three golden hairs from the Devil in hell, and the young man begins
    the journey.
  language: English
  quote_policy: summarized
