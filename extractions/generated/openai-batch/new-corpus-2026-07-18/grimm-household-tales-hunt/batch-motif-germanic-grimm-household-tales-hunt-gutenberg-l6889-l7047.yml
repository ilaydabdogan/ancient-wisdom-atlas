- id: obs:3
  text: The bird’s repeated song says that the speaker’s mother killed the speaker,
    the father ate the speaker, and Marlinchen gathered the bones, tied them in a
    silken handkerchief, and laid them beneath the juniper-tree.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the shoemaker’s house, the shoemaker calls his wife, daughter, children,
    and apprentices to see the bird; they observe its beauty, red and green feathers,
    gold-like neck, and star-like eyes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The shoemaker gives the bird a pair of red shoes in exchange for another performance
    of the song; the bird takes the shoes in its left claw.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the mill, twenty miller’s men are working on a stone while the mill makes
    repeated sounds; they stop working progressively as the bird sings the song line
    by line.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The bird asks for the millstone in exchange for another song; the twenty millers
    raise the stone with a beam, and the bird places its neck through the hole so
    that the stone sits like a collar.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After singing at the mill, the bird flies toward its father’s house carrying
    the chain in its right claw, the shoes in its left claw, and the millstone around
    its neck.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the father’s house, the father, mother, and Marlinchen sit at dinner; the
    father says he feels happy, the mother says she feels uneasy, and Marlinchen weeps.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the bird seats itself on the roof and then on the juniper tree, the father
