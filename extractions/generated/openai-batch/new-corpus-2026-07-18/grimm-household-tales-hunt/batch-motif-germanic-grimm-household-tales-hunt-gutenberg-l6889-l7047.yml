- id: obs:1
  text: A bird sits singing on a goldsmith’s roof while the goldsmith is making a
    gold chain in his workshop.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The goldsmith praises the bird’s singing; the bird refuses to repeat the song
    without payment and receives the gold chain in its right claw before singing again.
  category: action
  evidence_refs:
