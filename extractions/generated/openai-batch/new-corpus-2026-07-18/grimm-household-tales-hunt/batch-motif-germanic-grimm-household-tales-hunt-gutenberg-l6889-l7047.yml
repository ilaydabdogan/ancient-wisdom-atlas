canonical_text:
  quote: ''
  summary: A singing bird repeats a song about being killed, eaten, and having its
    bones gathered beneath a juniper-tree. It trades repeated performances of the
    song for a gold chain, red shoes, and a millstone, then returns with these objects
    to the father’s house, where the father, mother, and Marlinchen react differently
    as the bird begins to sing again.
  language: English
  quote_policy: summarized
