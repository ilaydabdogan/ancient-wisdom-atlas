canonical_text:
  quote: ''
  summary: A destitute disbanded soldier named Hans hires himself to the Devil for
    seven years, is led into hell, tends fires under kettles, and is forbidden to
    groom himself or look into the kettles. He disobeys by peeping into three kettles
    containing former military superiors, but he adds fuel beneath them. At the end
    of service the Devil gives him sweepings as wages, which become gold. A landlord
    steals the gold; Hans returns to hell, receives the Devil's help and cleansing,
    threatens the landlord with being taken to hell in his place, and recovers the
    money, becoming rich.
  language: English
  quote_policy: summarized
