canonical_text:
  quote: "“Whosoever wishes to go to heaven with me must creep into the sack.”"
  summary: After the count learns how the master thief escaped the previous trap,
    he requires a third task. At night the thief stages a false Last Day in the churchyard
    with candle-bearing crabs, disguises himself as a monk-like heavenly gatekeeper,
    tricks the parson and clerk into a sack, drags them while narrating a journey
    to heaven, locks them in a pigeon-house, and thereby wins his wager before being
    banished from the count’s land.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The count receives the sheet and ring, asks whether the master is a wizard,
    and asks who brought him out of the grave and to life again.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The thief says the count did not bury him but instead buried the poor sinner
    from the gallows, and he recounts how the exchange happened.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The count admits the thief is clever and crafty, but says he must still perform
    a third task or all previous success is useless.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: At night the master goes to the village church with a long sack, a bundle,
    and a lantern; the sack contains crabs and the bundle contains short wax-candles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the churchyard he fixes lit wax-candles onto crabs and lets the crabs creep
    about until the sack is empty.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: He puts on a long black garment like a monk’s cowl, attaches a gray beard
    to his chin, becomes unrecognizable, enters the church, and ascends the pulpit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: At midnight he cries from the pulpit that the end of all things has come,
    claims to be Peter who opens and shuts heaven’s gate, says the dead in the churchyard
    are gathering their bones, and calls hearers to creep into the sack because the
    world is about to be destroyed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The parson and clerk hear the cry, see moving lights in the churchyard, listen
    in the church, and agree to use the opportunity to find an easy way to heaven
    before the Last Day dawns.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The parson enters the sack first, the clerk follows, and the master immediately
    ties the sack tightly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: While dragging the sack down steps, through the village, through puddles,
    and up castle steps, the master says they are going over mountains, through wet
    clouds, and onto the steps of heaven.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the top of the castle, he pushes the sack into the pigeon-house, says the
    fluttering pigeons are glad angels flapping their wings, bolts the door, and leaves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The next morning the master tells the count he has carried the parson and
    clerk out of the church; the count finds them in the pigeon-house believing they
    are in heaven, frees them, names the thief an arch-thief, declares the wager won,
    and banishes him from the land.
  category: sequence
  evidence_refs:
  - ev:6
