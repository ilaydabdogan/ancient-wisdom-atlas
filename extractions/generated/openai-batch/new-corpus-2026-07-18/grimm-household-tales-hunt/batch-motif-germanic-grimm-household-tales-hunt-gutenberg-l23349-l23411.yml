canonical_text:
  quote: Trees must be trained while they are young.
  summary: An old peasant trains a young tree and explains that an old crooked tree
    cannot now be straightened. A stranger applies this lesson to the peasant’s runaway
    son, then reveals a bean-shaped birthmark and is recognized as that son. He says
    he has become a master-thief who can pass locks and bolts and steals from the
    rich rather than the poor. His parents react with joy and sorrow. The son goes
    to the count at the castle; the count, his godfather, offers mercy but sets three
    theft tasks whose failure will cost the master-thief his life.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The old man plants a young tree, sets a post beside it, and ties the tree
    to the post with straw rope above, below, and in the middle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stranger asks why an old crooked tree is not also tied to a post; the
    old man replies that an old misshapen tree cannot be made straight and that trees
    must be trained while young.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The stranger says the same was true of the old man’s son: if trained while
    young, he would not have run away, and now he too must have grown hard and misshapen.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The peasant says he could recognize his son by a bean-shaped birthmark on
    the shoulder; the stranger bares his shoulder, shows the mark, and the old man
    recognizes him as his son.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The son says he has become a master-thief, that neither locks nor bolts stop
    him, that he takes from the superfluity of the rich, and that he spares or gives
    to poor people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The father disapproves of his son’s trade; the mother weeps with joy at seeing
    him again and with sorrow when she hears he is a master-thief; the family eats
    together.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The father warns that the count in the castle, who held the son at the font,
    may cause him to swing from a halter; the son says he will go to the count himself.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The count receives the son civilly at first, then recognizes him as his godson
    and says mercy will take the place of justice, but he will test the son’s claimed
    skill as a master-thief.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'The count sets three tasks: steal his riding horse from the stable, steal
    the sheet from beneath himself and his wife along with his wife’s wedding-ring
    while they sleep, and steal the parson and clerk out of the church; he says the
    son’s life depends on it.'
  category: speech
  evidence_refs:
  - ev:9
