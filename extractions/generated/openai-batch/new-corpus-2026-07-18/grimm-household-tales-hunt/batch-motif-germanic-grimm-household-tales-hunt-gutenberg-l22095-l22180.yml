canonical_text:
  quote: ''
  summary: At the end of a three-year term, the old woman prepares the house, instructs
    the maiden to remove the skin from her face and put on her silken gown, and later
    receives the King, Queen, and count. The count observes the goose-girl at a well
    removing her skin and revealing golden hair. The old woman reveals that the King
    and Queen unjustly drove away their daughter, calls the princess forth, reunites
    her with her parents, gives her tears as pearls and the little house, then disappears
    as the house becomes a palace.
  language: English
  quote_policy: summarized
