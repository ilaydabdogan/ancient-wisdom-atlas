canonical_text:
  quote: ''
  summary: 'The passage concludes the Rumpelstiltskin episode: after the Queen bears
    a child, the manikin demands the promised child, grants three days for her to
    learn his name, is discovered through a messenger''s report, and destroys himself
    when named. The passage then begins Sweetheart Roland: a witch plans to murder
    her hated stepdaughter for an apron desired by her own daughter, but the stepdaughter
    overhears, changes places in bed, and the witch kills her own child by mistake.'
  language: English
  quote_policy: summarized
