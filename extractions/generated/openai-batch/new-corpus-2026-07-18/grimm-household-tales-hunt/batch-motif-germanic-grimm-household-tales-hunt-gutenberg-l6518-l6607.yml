canonical_text:
  quote: ''
  summary: Thumbling, a tiny tailor, joins robbers in stealing the King’s treasure
    by entering through a crevice, throwing out coins, and evading sentries by hiding
    under thalers and taunting them. He refuses to become the robbers’ captain and
    continues wandering. At an inn, maids resent his secret observation and reporting
    of their thefts, so one mows him up with grass and throws him to cows. A black
    cow swallows him alive. He speaks from inside the cow but is not understood. After
    the cow is slaughtered, he avoids the chopping knife, is enclosed in sausage-meat
    and then a black-pudding, is smoked in a chimney, and finally escapes when the
    pudding is sliced.
  language: English
  quote_policy: summarized
