canonical_text:
  quote: ''
  summary: The passage closes the Two-eyes episode with Two-eyes receiving her impoverished
    sisters and caring for them. It then gives a comic courtship dialogue in which
    Pif-paf-poltrie seeks fair Katrinelje’s hand through repeated family consent,
    dowry, and trade questions. Finally, in “The Fox and the Horse,” an old faithful
    horse is expelled by his master, aided by a fox, and restored after the fox tricks
    a lion into being bound and dragged to the master.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two poor women come to Two-eyes in her castle to beg for alms, and she recognizes
    them as her sisters One-eye and Three-eyes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two-eyes welcomes One-eye and Three-eyes, treats them kindly, cares for them,
    and they repent the evil they had done to her in youth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pif-paf-poltrie asks to have Father Hollenthe’s daughter; the answer depends
    on the willingness of Mother Malcho, Brother High-and-Mighty, Sister Käsetraut,
    and fair Katrinelje.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The courtship dialogue repeats through Mother Malcho, Brother High-and-Mighty,
    Sister Käsetraut, and fair Katrinelje, with each consent made conditional on the
    others’ willingness.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: 'The family members are shown in domestic tasks or settings: Mother Malcho
    in the cow-house milking, Brother High-and-Mighty chopping wood, Sister Käsetraut
    cutting cabbages, and fair Katrinelje counting farthings.'
  category: setting
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Fair Katrinelje states a dowry of fourteen farthings, three and a half groschen
    owed to her, dried apples, fried bread, spices, and other things.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: After several trade guesses, Pif-paf-poltrie identifies his trade as broom-maker.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A peasant’s faithful horse has grown old and can no longer work, so the master
    refuses to feed him and drives him from the stable unless he can bring a lion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The horse goes sadly to the forest and tells the fox that his master has forgotten
