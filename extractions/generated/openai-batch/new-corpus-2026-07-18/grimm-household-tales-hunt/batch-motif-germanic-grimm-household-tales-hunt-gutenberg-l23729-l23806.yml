canonical_text:
  quote: ''
  summary: A witch orders the drummer to make and burn a vast pile of wood. The maiden
    aids him, warns him to obey the witch without fear, and tells him to throw the
    witch into the fire. The drummer enters the flames unharmed, removes an unburnt
    log, and the log becomes the King’s daughter. He throws the witch into the fire.
    The King’s daughter pledges herself to him, takes precious stones from the witch’s
    treasure, and uses a wishing-ring to bring them to the town gate. She warns him
    not to kiss his parents on the right cheek, but he does so and forgets her. She
    waits, then withdraws to a forest hut and seeks to win him back when she hears
    of his coming wedding.
  language: English
  quote_policy: summarized
