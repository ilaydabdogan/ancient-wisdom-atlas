canonical_text:
  quote: ''
  summary: The small peasant uses a raven’s croak to claim that a devil is hidden
    in a cupboard, causing the parson to be exposed and gaining three hundred thalers.
    He later attributes his wealth to selling a cow skin, prompting other peasants
    to kill their cows for little return. Condemned to be drowned in a pierced barrel,
    he persuades an ambitious shepherd to take his place, takes the shepherd’s flock,
    and returns claiming he obtained sheep from under the water. The Mayor and villagers,
    misled by cloud reflections in the water, jump in and drown, leaving the small
    peasant rich.
  language: English
  quote_policy: summarized
