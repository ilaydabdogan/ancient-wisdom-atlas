canonical_text:
  quote: ''
  summary: In the first section, a huntsman uses bad salad to transform a witch, her
    maid-servant, and a maiden into asses, punishes them through a miller, then restores
    two of them with good salad; the maiden confesses, returns his wishing-cloak,
    and marries him. In the second section, a poor servant-girl survives a robbery
    in a forest and is aided by a white dove that gives golden keys to open trees
    containing food, a bed, and splendid clothing.
  language: English
  quote_policy: summarized
