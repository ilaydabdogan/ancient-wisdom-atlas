canonical_text:
  quote: ''
  summary: The passage first recounts a girl obeying a dove's instructions to retrieve
    a plain ring from a witch's house, thereby releasing an enchanted king's son,
    his servants, and his horses from tree-forms, after which the king's son marries
    her. It then gives the tale of three brothers whose father awards an ancestral
    house to the son who shows the greatest craft mastery after apprenticeship; the
    fencing-master wins by keeping himself dry with his sword during a torrent of
    rain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A little dove asks the girl to help and instructs her to enter a small house,
    ignore an old woman by the fire, pass on the right side, open a door, leave magnificent
    rings alone, and bring back a plain ring.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl reaches the house, does not answer the old woman's greeting, is seized
    by the gown, escapes silently, and goes into the room.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The room contains many gleaming rings, but the plain ring is in the bill of
    a bird inside a cage that the old woman is carrying away.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The girl takes the ring, waits by a tree for the dove, and the tree's branches
    twine around her and become two arms.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The tree is revealed as a handsome man who says the old woman is a wicked
    witch who had changed him into a tree and allowed him to be a white dove for two
    hours each day.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The man says that, while the old woman possessed the ring, he could not regain
    his human form.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The man's servants and horses, also changed into trees, are freed; he is identified
    as a king's son, leads them to his kingdom, and marries the girl.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A father with three sons owns only his ancestral house; because each son wants
    it, he orders them to learn trades and promises the house to the one who makes
    the best masterpiece.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The eldest son becomes a blacksmith, the second a barber, and the third a
    fencing-master; each trains with a skilled master.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The barber shaves the whiskers from a running hare without cutting its skin
    or injuring a hair on its body.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The blacksmith replaces all four shoes on a galloping coach horse without
    stopping it.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The fencing-master flourishes his sword above his head during increasingly
    heavy rain and remains dry; the father awards him the house.
  category: action
  evidence_refs:
  - ev:11
