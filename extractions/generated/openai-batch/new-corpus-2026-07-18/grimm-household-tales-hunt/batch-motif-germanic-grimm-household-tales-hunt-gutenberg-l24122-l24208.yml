canonical_text:
  quote: ''
  summary: An enchantress transforms two of her three sons into an eagle and a whale.
    The youngest son flees, seeks an imprisoned bewitched King’s daughter in the Castle
    of the Golden Sun, obtains a wishing-cap from giants, and reaches the castle.
    The King’s daughter tells him that a crystal ball hidden inside a burning egg
    carried by a fiery bird from a slain bull will destroy the enchanter’s power.
    With help from his eagle and whale brothers, the youth obtains the crystal ball,
    destroys the enchanter’s power, restores the King’s daughter, gains kingship,
    and exchanges rings with her.
  language: English
  quote_policy: summarized
