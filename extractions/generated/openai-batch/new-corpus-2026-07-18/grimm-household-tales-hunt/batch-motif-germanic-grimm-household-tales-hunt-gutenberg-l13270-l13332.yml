canonical_text:
  quote: ''
  summary: A boy in a boat reaches an unknown shore and enters a bewitched castle,
    where a snake is revealed as an enchanted maiden awaiting a deliverer. She instructs
    him to endure three nights of violent torment in silence; after he is killed on
    the third night, she is released, becomes a princess, and revives him with water
    of life. They marry, have a son, and he becomes King of the Golden Mountain. Years
    later he returns to his parents with a wishing-ring, is initially unrecognized,
    proves his identity by a birthmark, and breaks his promise to the Queen by using
    the ring to summon her and their child.
  language: English
  quote_policy: summarized
