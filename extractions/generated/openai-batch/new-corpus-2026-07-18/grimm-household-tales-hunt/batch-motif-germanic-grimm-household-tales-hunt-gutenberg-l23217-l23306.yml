canonical_text:
  quote: ''
  summary: 'A princess with twelve all-seeing windows requires any prospective husband
    to hide from her or be beheaded. After two elder brothers fail and die, the youngest
    spares a raven, fish, and fox while hunting. Each helper repays him by hiding
    him: first in an egg, then in a fish’s stomach, and finally through water-based
    transformation into a sea-hare hidden under the princess’s hair. On the final
    attempt she cannot find him and breaks the windows in anger.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The princess lives high in a castle apartment with twelve windows looking
    in every direction; from the twelfth she can see everything above and under the
    earth.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The princess proclaims that only a man who can hide from her so completely
    that she cannot find him may become her husband; discovered contestants are beheaded
    and their heads placed on posts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ninety-seven posts with dead men’s heads already stand before the castle before
    the three brothers arrive.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The eldest brother hides in a lime-pit and the second in the palace cellar;
    the princess sees both from the first window, and both are executed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The youngest brother asks for a day to consider and for the princess to overlook
    two discoveries; she grants this but warns that he will not succeed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: While hunting, the youth refrains from killing a raven, a fish, and a fox
    after each promises to make it worth his while; he also removes a thorn from the
    fox’s foot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The raven hides the youth inside an egg from its nest, but the princess sees
    him from the eleventh window and orders the raven shot and the egg broken.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The fish swallows the youth and descends to the bottom of the lake, but the
    princess sees him from the twelfth window and orders the fish caught and killed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fox dips into a spring and becomes a stall-keeper and animal dealer; the
    youth dips into the water and becomes a small sea-hare.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The transformed fox sells the sea-hare to the princess and instructs it to
    creep under her hair braids when she goes to the window.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: On the final search, the princess cannot see the youth from any of the twelve
    windows; in anger she shuts the window so violently that all the window glass
    shivers and the castle shakes.
  category: sequence
  evidence_refs:
  - ev:8
