canonical_text:
  quote: ''
  summary: An unnamed man enters a giant’s dwelling, avoids being eaten by offering
    inexhaustible food, and asks for the golden castle of Stromberg. Two giants consult
    maps; the second locates the castle and carries the man near it. The man reaches
    a golden castle on a glass mountain where a bewitched King’s daughter lives, but
    he cannot climb to her. After waiting a year, he encounters three robbers fighting
    over a door-opening stick, an invisibility mantle, and a horse that can ride anywhere.
    He takes the objects, rides up the glass mountain, enters the castle invisibly,
    drops the maiden’s ring into her cup, and is recognized as her liberator. She
    says he has set her free and that they will marry the next day.
  language: English
  quote_policy: summarized
