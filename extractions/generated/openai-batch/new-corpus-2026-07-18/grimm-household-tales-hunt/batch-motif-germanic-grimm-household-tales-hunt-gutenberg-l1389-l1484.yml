canonical_text:
  quote: ''
  summary: The passage concludes a comic tale in which a peasant refuses the king's
    daughter, redirects a promised counted reward toward a sentry and a Jewish bystander,
    gains access to the king's treasure chamber, and later uses a borrowed coat to
    turn an accusation against the lender. It then begins “The Wonderful Musician,”
    where a musician alone in a forest plays his fiddle, attracts a wolf who wants
    to learn, and traps the wolf's paws in a cleft oak-tree with a stone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The peasant refuses to take the king's daughter, says he already has a wife,
    and the king angrily promises him a different reward of five hundred to be counted
    out after three days.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sentry says the peasant has made the king's daughter laugh and asks for
    part of the expected reward; the peasant assigns him two hundred of the five hundred.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Jewish bystander overhears the conversation, offers to change part of the
    reward into small coins, and gives the peasant bad groschen in exchange for three
    hundred of the promised amount.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the king orders the peasant's coat pulled off so that the five hundred
    can be counted out, the peasant says the reward no longer belongs to him; the
    soldier and the Jewish bystander claim their shares and receive counted blows.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the counted blows, the king laughs, gives the peasant permission to
    take money from the treasure chamber, and the peasant fills his pockets and later
    counts the money at an inn.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The Jewish bystander overhears the peasant muttering that the king has cheated
    him and decides to inform the king in hope of a reward and the peasant's punishment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The king commands the Jewish bystander to bring the peasant; the peasant refuses
    to appear in his old coat, and the bystander lends him a coat so the summons can
    proceed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Before the king, the peasant rejects the accusation and says the bystander
    might even claim the coat is his; the bystander protests that he lent the coat,
    after which the king concludes the bystander has deceived either himself or the
    peasant and orders something counted out to him in hard thalers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A wonderful musician is alone in a forest, decides to fetch a companion, plays
    his fiddle, and a wolf comes toward him and asks to learn the music.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The musician tells the wolf to obey him, leads him to a hollow cleft oak-tree,
    instructs him to put his forepaws into the crevice, wedges the paws fast with
    a stone, and leaves the wolf imprisoned there.
  category: sequence
  evidence_refs:
  - ev:8
