canonical_text:
  quote: ''
  summary: 'The passage contains three adjacent Grimm tale excerpts: a poor peasant
    and a rich lord arrive at heaven''s gate and are admitted by Saint Peter with
    different levels of celebration; Lean Lisa quarrels with Long Laurence over an
    imagined plan to acquire a cow and control its milk; and the beginning of ''The
    Hut in the Forest,'' where a wood-cutter sends his eldest daughter through the
    forest, birds eat the millet trail, and she reaches a lighted house inhabited
    by an old man and three animals.'
