canonical_text:
  quote: ''
  summary: The passage concludes an episode in which a youth, aided by Iron John,
    wins golden apples in different knightly disguises, is recognized by golden hair
    and a wound, marries the King's daughter, and receives treasure when Iron John
    is restored from enchantment. It then begins another tale in which a fisherman's
    son is taken by an enemy during a siege, escapes to an opened mountain and an
    enchanted black castle, meets three black-clad princesses who set silence and
    non-looking conditions for their deliverance, returns home, is recognized by his
    father, and receives his mother's advice about holy water and boiling water.
  language: English
  quote_policy: summarized
