canonical_text:
  quote: "“Shiver and quiver, my little tree, / Silver and gold throw down over me.”"
  summary: Cinderella is twice aided by birds in sorting lentils from ashes, but her
    stepmother still refuses to let her attend the festival. After her family leaves,
    Cinderella goes to her mother’s grave beneath a hazel-tree, invokes the tree,
    receives splendid clothing from a bird, and appears at the festival as an unrecognized
    beautiful maiden. The prince dances only with her and tries to follow her, but
    she escapes and returns to the ashes. The sequence repeats with more splendid
    clothing, and on the third day she receives the most magnificent dress and golden
    slippers.
  language: English
  quote_policy: quoted
