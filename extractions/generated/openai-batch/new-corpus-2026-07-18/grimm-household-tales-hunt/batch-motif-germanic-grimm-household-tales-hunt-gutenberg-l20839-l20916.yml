canonical_text:
  quote: ''
  summary: Hans takes a feather from the Griffin and overhears the Griffin disclose
    the hiding place of a lost key, the cure for an ill daughter, and the way a forced
    ferryman may be released. Hans uses this knowledge to help the ferryman, cure
    the daughter, recover the key, and gain rewards. The King follows Hans toward
    the Griffin, is abandoned in the lake by the ferryman, and drowns; Hans marries
    the daughter and becomes king. The next tale begins with little Hans and his mother
    being seized by robbers in a forest and taken through a rock door and dark passage
    into a fire-lit cavern, where the robber captain tells the mother to keep house
    for them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At night, while the Griffin is snoring, Hans reaches out and plucks a feather
    from the Griffin's tail; the Griffin wakes and says he smells a Christian and
    thinks someone was pulling his tail.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Griffin''s wife tells the Griffin he has been dreaming and repeats three
    problems previously reported by Hans: a lost money-chest key, an ill daughter,
    and a man at a lake forced to carry people across.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Griffin states that the key is in the wood-house under a log behind the
    door, that the ill daughter would recover if she got back her hair from a toad's
    nest under the cellar steps, and that the ferry-man could end his burden by putting
    one man down in the middle of the lake.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the Griffin leaves, Hans comes out from under the bed with the feather
    and with the knowledge about the key, the daughter, and the ferry-man; the Griffin's
    wife repeats the information once more to him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Hans has the man by the lake carry him across before telling him the Griffin's
    answer, then tells him to set one person down in the middle of the lake so that
    he will not have to carry others across.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hans carries the ill daughter down the cellar steps, pulls out the toad's
    nest from beneath the lowest step, gives it into her hand, and she is cured and
    able to run up the steps.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The cured daughter's father and mother rejoice and give Hans gifts of gold,
    silver, and whatever else he wishes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Hans goes to the other castle, finds the key under the log behind the wood-house
    door, gives it to the lord of the castle, and receives gold and livestock as a
    reward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the King asks how Hans obtained his wealth, Hans says the Griffin gives
    everyone whatever they want; the King sets out toward the Griffin, reaches the
    lake, is put down in the middle by the man, and drowns.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the King's death, Hans marries the daughter and becomes King.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the beginning of 'Strong Hans,' a man and woman with an only child live
