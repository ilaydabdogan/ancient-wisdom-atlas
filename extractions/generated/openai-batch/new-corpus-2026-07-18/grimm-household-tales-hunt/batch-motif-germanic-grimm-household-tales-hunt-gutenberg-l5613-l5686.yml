canonical_text:
  quote: "“Out of the sack, Cudgel!”"
  summary: The younger brother, trained as a turner, receives a sack containing a
    cudgel that acts on command. He uses it at the inn to punish the innkeeper who
    tries to steal the sack, forces the return of the wishing-table and gold-ass,
    then returns home and shares food and gold with the family.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The third brother apprenticed himself to a turner; his brothers informed him
    by letter that the innkeeper had cheated them of their wishing-gifts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the turner completed his service and behaved well, his master gave him
    a sack containing a cudgel and explained the spoken commands that make it come
    out and return.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When people came too near and wished to attack him, the turner commanded the
    cudgel to come out, and it beat them until its action was stopped.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the inn where his brothers had been cheated, the turner spoke of marvelous
    things, including a self-covering table, a gold-ass, and a greater treasure in
    his sack.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The innkeeper thought the sack might contain jewels and tried to pull it away
    while the guest seemed asleep, intending to put another sack in its place.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The turner had been waiting for the attempt and commanded the cudgel to come
    out; it beat the innkeeper.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The host begged for mercy; the turner demanded the return of the self-covering
    table and gold-ass, and then commanded the cudgel back into the sack.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The next morning the turner went home to his father with the wishing-table
    and the gold-ass, and told him he had become a turner.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The father at first dismissed the value of a cudgel, but the son explained
    that this one sprang out at command against anyone who meant him ill and had enabled
    him to recover his brothers’ stolen gifts.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The relatives were gathered; the turner spread a cloth, led in the gold-ass,
    and the miller’s command caused gold pieces to fall until everyone had as much
    as could be carried.
  category: sequence
  evidence_refs:
  - ev:7
