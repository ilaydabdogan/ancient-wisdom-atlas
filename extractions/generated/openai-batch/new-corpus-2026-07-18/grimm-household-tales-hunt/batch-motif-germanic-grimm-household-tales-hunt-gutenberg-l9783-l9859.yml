canonical_text:
  quote: ''
  summary: A little peasant obtains a cow after a small calf left with the cow-herd
    is missing from pasture. The peasant and his wife kill the cow for lack of feed.
    Carrying the cow skin, the peasant shelters at a mill during a storm, observes
    the miller’s wife hide a feast and the parson when her husband returns, and presents
    a broken-winged raven in the skin as a soothsayer that reveals the hidden food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the morning the little peasant asks the cow-herd to carry a small calf
    to pasture because it is still too small to go by itself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cow-herd sets the calf among the grass; the calf remains standing as if
    it were eating.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At night the calf is missing from the returning herd; when the peasant and
    cow-herd go back to the meadow, the calf is gone and is described as having been
    stolen.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The mayor condemns the cow-herd to give the little peasant a cow for the missing
    calf.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The little peasant and his wife receive the desired cow, but because they
    have no food for it, it is killed and its flesh is salted.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the way to town with the cow skin, the peasant finds a raven with broken
    wings and wraps it in the skin out of pity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A storm of rain and wind forces the peasant to return to the mill and ask
    for shelter; the miller’s wife gives him bread, cheese, and straw to lie on.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: While the miller is absent, the parson arrives and the miller’s wife prepares
    roast meat, salad, cakes, and wine.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the miller knocks at the door, the wife hides the food in several places
    and hides the parson in the cupboard in the entrance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The miller invites the peasant to eat more and then notices the skin containing
    the raven.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The peasant says that the raven in the skin is a soothsayer, pinches the raven
    so that it croaks, and announces hidden wine, roast meat, salad, and cakes, each
    of which the miller finds.
  category: speech
  evidence_refs:
  - ev:7
