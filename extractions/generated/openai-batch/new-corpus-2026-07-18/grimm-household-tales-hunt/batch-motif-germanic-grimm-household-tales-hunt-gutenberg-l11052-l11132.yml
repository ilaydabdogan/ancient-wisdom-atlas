canonical_text:
  quote: ''
  summary: The passage contains the end of a fox and she-wolf animal tale, all of
    “The Fox and the Cat,” and the opening of “The Pink.” A fox accepts the role of
    godfather to a she-wolf’s young, misdirects the she-wolf into a dangerous sheepfold
    raid, pretends to be injured, is carried home by her, and then mocks her. In a
    second tale, a cat with one practical escape skill survives by climbing a tree,
    while an arrogant fox who claims many arts is seized by dogs. In the opening of
    “The Pink,” a childless queen prays, an angel foretells a son with wishing power,
    the child is stolen by an old cook, the queen is falsely accused and sealed in
    a tower, and angels in the form of white doves feed her until seven years are
    over.
  language: English
  quote_policy: summarized
