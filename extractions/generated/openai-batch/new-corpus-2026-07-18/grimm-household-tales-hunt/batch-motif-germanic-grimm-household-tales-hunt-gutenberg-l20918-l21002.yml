canonical_text:
  quote: ''
  summary: Hans grows up with his captive mother among robbers in a cave. He demands
    to know his father, is first struck down by the robber captain, then later defeats
    the robbers with a club. His mother takes the key, Hans carries treasure from
    the cave, and they return to his father. Hans helps rebuild the household, farms
    with extraordinary strength, then leaves with a very heavy walking-stick. In a
    dark forest he recruits Fir-twister, who twists a fir-tree like rope, and Rock-splitter,
    who breaks rock with his fist. The companions lodge in a deserted castle, where
    Hans kills a wild boar and they arrange hunting and cooking turns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman remains for many years with robbers in a cave while Hans grows tall
    and strong; she tells him stories and teaches him to read from an old book of
    knight tales found in the cave.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At nine years old, Hans makes a strong club from a fir branch, hides it behind
    the bed, and asks his mother who his father is.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Hans’s mother does not tell him his father’s identity because she fears homesickness
    and knows the robbers would not let him leave.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hans threatens the robber captain with the club, but the captain boxes his
    ear and knocks him under the table; Hans decides to try again after another year.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the robbers drink wine the next year, Hans again asks the captain about
