canonical_text:
  quote: ''
  summary: 'The passage closes one tale with a young king finally learning to shudder
    when cold water and small fish are poured over him while he sleeps. It then begins
    “The Wolf and the Seven Little Kids”: a mother goat warns her seven children against
    a disguised wolf; the wolf changes his voice and whitens his paws to gain entry,
    swallows six children, misses the youngest, and later the mother cuts open his
    belly to free the swallowed children alive before stones are put into the wolf’s
    stomach and it is sewn shut.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After gold is brought up and a wedding is celebrated, the young king remains
    happy with his wife but repeatedly says that he wishes he could shudder.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The waiting-maid proposes a cure; cold water with gudgeons from the garden
    stream is poured over the sleeping young king, and he wakes saying he now knows
    what it is to shudder.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old goat with seven little kids leaves for the forest to fetch food and
    warns the children against the wolf, saying he devours, disguises himself, and
    can be known by his rough voice and black feet.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wolf knocks at the house-door pretending to be the mother, but the kids
    refuse to open because his voice is rough.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wolf eats chalk to make his voice soft, returns, and is refused again
    because the children see his black paws at the window.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wolf has dough rubbed on his feet and then compels the miller by threat
    to whiten his paws with meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the third visit the wolf shows white paws, the kids believe his claim to
    be their mother, and they open the door.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The children try to hide in household places; the wolf finds and swallows
    six of them, while the youngest remains unfound in the clock-case.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mother goat returns, finds the house in disorder, calls her children,
    and hears the youngest answer from the clock-case.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mother goat and the youngest kid find the wolf sleeping under a tree;
    movement is visible in his gorged belly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: With scissors, needle, and thread fetched by the youngest kid, the mother
    goat cuts open the wolf’s stomach, and the six swallowed kids come out alive and
    uninjured.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The seven kids bring stones, put as many as possible into the wolf’s stomach,
    and the mother goat sews him up again while he remains asleep.
  category: action
  evidence_refs:
  - ev:8
