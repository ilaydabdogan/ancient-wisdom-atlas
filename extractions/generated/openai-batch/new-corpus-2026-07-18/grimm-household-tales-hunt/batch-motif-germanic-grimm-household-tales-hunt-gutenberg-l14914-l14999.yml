  quote: "“this princess was the little tabby-cat whom poor Hans had served for seven
    years.”"
  summary: An old miller sends three apprentices to obtain the best horse. The two
    other apprentices abandon Hans in a cave. Hans meets a speaking tabby-cat, serves
    her for seven years in an enchanted castle, returns home ragged and humiliated,
    and after three days the cat arrives as a princess with shining horses and asks
    for him.
  language: English
