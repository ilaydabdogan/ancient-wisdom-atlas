canonical_text:
  quote: ''
  summary: A maiden serving a miller uses dresses found inside three walnuts to interrupt
    a royal wedding. She trades the first two dresses for nights outside the King's
    son's door, where she laments the feats and transformations she performed for
    him. After a servant keeps the King's son awake, he hears her, remembers her,
    and marries her; the false mother and bride depart. The next tale opens with a
    proud princess who requires suitors to solve a riddle in order to marry her, and
    three tailors, including an underestimated little tailor, set out to try.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Queen comes from the castle, walks by a pond, sees a well-grown maiden
    there, and no one with the Queen recognizes the maiden.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maiden serves the miller honorably and faithfully for a long time.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Queen seeks a wife for her son, and a bride from a distant part of the
    world arrives for an immediate marriage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The maiden opens a walnut, finds a beautiful dress inside, wears it to the
    church, and stands by the altar; the bride refuses to proceed unless she has a
    dress as beautiful.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The maiden will not sell the dress but allows the bride to earn it by permitting
    the maiden to sleep one night outside the King's son's door.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Servants are ordered to give the King's son a sleeping-drink; the maiden lies
    on the threshold all night and laments, but the King's son does not hear her the
    first night.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: In her lament, the maiden says she had cut down a forest, cleaned a fish-pond,
    built a castle, and changed the King's son into a briar, a church, and a fish-pond.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the second walnut dress repeats the church scene, a servant gives the
    King's son something to keep him awake; he hears the maiden's lament, is troubled,
    and remembers the past.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The King's son goes to his beloved, explains what happened, and asks her not
    to be angry; she opens the third walnut, wears the most magnificent dress, and
    marries him in church while the false mother and bride depart.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A proud princess sets riddles for wooers and sends away those who cannot solve
    them, while promising marriage to whoever solves her riddle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Three tailors set out to attempt the princess's riddle; the two elder tailors
    trust their skill and discourage the little tailor, but he goes forth anyway.
  category: sequence
  evidence_refs:
  - ev:8
