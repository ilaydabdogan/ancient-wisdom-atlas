canonical_text:
  quote: ''
  summary: A cat exposes a hidden boar and the boar points out a wolf in a tree. In
    the opening of “The Six Swans,” a king loses his way while hunting in a forest.
    An aged witch offers guidance only if he marries her daughter. After the marriage,
    the king hides his six sons and daughter from their stepmother in a concealed
    forest castle, reached by a magical ball of yarn. The new queen learns the secret,
    makes charmed white silk shirts, reaches the children, and transforms the six
    boys into swans. The sister remains behind, reports what she saw, and fears the
    stepmother.
  language: English
  quote_policy: summarized
