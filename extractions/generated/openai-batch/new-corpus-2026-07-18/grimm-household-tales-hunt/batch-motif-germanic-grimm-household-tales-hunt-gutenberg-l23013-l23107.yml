canonical_text:
  quote: ''
  summary: 'The passage concludes the hedgehog-and-hare race: the hedgehog stations
    his look-alike wife at one end of the field, repeatedly makes the hare believe
    he has already arrived, wins the wager, and the hare dies from repeated running.
    The narrator gives an etiological comment about hares avoiding Buxtehuder hedgehogs
    and states two morals. The passage then begins “The Spindle, The Shuttle, and
    the Needle”: an orphaned girl is raised by a godmother who leaves her a small
    house and craft tools with a blessing; the girl prospers by spinning, weaving,
    and sewing. A prince seeks a bride who is both poorest and richest, passes by
    the rich girl, sees the poor girl spinning, and the girl later sings to her spindle
    to bring the wooer to her house.'
  language: English
  quote_policy: summarized
