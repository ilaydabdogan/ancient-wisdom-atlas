canonical_text:
  quote: ''
  summary: A young count agrees to carry an old woman's bundle and baskets to her
    house beyond a hill. The burden becomes unbearably heavy, cannot be cast off,
    and the old woman eventually rides on it while forcing him onward. At her house,
    where geese and her daughter are present, she lets him rest and then rewards him
    with a small emerald book that she says will bring good fortune.
