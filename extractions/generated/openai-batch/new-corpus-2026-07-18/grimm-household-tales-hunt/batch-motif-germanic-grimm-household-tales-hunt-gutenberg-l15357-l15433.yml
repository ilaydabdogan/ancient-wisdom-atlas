canonical_text:
  quote: ''
  summary: 'The passage first concludes an earlier tale in which a banished shoemaker
    is blinded by crows at a gallows and disappears in the forest. It then begins
    “Hans the Hedgehog”: a childless countryman angrily wishes for a child even if
    it is a hedgehog; his wife bears Hans, hedgehog-bodied above and boy-bodied below.
    Hans is christened, neglected behind the stove for eight years, asks for bagpipes
    and a shod cock, rides into the forest with swine and asses, lives in a high tree
    making music, and bargains with a lost king for a written promise of whatever
    first meets the king at home. The king writes a deceptive bond; his daughter is
    first to meet him and is glad she will not have to go away with Hans.'
  language: English
  quote_policy: summarized
