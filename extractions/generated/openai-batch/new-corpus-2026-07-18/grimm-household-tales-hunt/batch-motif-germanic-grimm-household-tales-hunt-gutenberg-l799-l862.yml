canonical_text:
  quote: ''
  summary: A youth seeking to learn shuddering is told of a haunted castle where a
    watcher may gain the king's daughter and treasure if he stays three nights. He
    asks to bring a fire, a turning lathe, and a cutting-board with a knife. On the
    first night he confronts black cats, black dogs, red-hot chains, and a moving
    bed, kills or drives off hostile creatures, sleeps by the fire, and is found alive
    in the morning, still unable to shudder.
  language: English
  quote_policy: summarized
