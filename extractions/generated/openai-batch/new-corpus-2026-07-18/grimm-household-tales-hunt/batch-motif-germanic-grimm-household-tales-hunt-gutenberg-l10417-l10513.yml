canonical_text:
  quote: ''
  summary: 'The passage first closes a tale in which a sad bride avoids the little
    hare by dressing a straw doll in her clothes and returning to her mother; the
    hare discovers the substitution and is sorrowful. It then begins “The Twelve Huntsmen”:
    a prince leaves his beloved with a ring, promises his dying father to marry another
    king’s daughter, and later must fulfill that promise. His first betrothed obtains
    eleven maidens exactly like herself, dresses all twelve as huntsmen, and enters
    the new king’s service. A truth-knowing lion says they are girls and proposes
    tests with peas and spinning-wheels, but a friendly servant warns them, allowing
    them to pass both tests.'
  language: English
  quote_policy: summarized
