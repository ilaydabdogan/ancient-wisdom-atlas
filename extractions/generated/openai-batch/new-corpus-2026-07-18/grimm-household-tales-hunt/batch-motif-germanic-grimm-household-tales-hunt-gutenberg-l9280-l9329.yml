  quote: "“Whosoever empties the cups will become the strongest man on earth”"
  summary: A huntsman ascends the dragon’s hill with his animals, gains strength by
    drinking three cups in a hilltop church, wields a buried sword, fights and dismembers
    a seven-headed dragon, rescues the King’s daughter, and receives tokens while
    preserving the dragon’s tongues as proof.
