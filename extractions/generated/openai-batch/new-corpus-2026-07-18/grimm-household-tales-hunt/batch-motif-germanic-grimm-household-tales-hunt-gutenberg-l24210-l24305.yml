canonical_text:
  quote: ''
  summary: A prince loves Maid Maleen, but her father rejects the match and walls
    her and her waiting-woman into a dark tower for seven years. After escaping through
    the wall, they find the kingdom devastated, wander in hunger, and become scullions
    in a palace where the prince is to marry another bride. The chosen bride coerces
    Maid Maleen to wear the bridal clothes and take her place in the procession, during
    which Maid Maleen speaks cryptic truth-statements to a nettle, a foot-bridge,
    and a church-door.
  language: English
  quote_policy: summarized
