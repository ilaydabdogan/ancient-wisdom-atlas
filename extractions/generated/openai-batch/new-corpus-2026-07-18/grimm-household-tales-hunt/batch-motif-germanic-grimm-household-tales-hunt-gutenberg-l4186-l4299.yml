canonical_text:
  quote: ''
  summary: Little Red-Cap meets a wolf in the wood while carrying cake and wine to
    her sick grandmother. The wolf learns the grandmother’s location, diverts Red-Cap
    from the path with flowers and birds, reaches the house first, devours the grandmother,
    and impersonates her in bed. Red-Cap arrives, questions the disguised wolf’s strange
    features, and is swallowed. A huntsman finds the sleeping wolf, cuts open its
    stomach, releases Red-Cap and the grandmother alive, and the wolf dies after stones
    are placed in its body. The grandmother revives, and Red-Cap resolves not to leave
    the path again when forbidden by her mother.
  language: English
  quote_policy: summarized
