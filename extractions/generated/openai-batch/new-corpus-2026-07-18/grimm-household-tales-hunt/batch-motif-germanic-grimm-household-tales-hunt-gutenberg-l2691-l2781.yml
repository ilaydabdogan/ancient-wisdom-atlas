canonical_text:
  quote: ''
  summary: A poor youth leaves home, wins a king's war, marries a princess who requires
    a mutual burial vow, and is entombed alive with her after she dies. In the vault
    he observes a snake revived by three green leaves and uses the leaves to restore
    his wife. Later she betrays him with a skipper and throws him into the sea, but
    his faithful servant uses the same leaves to restore him to life.
  language: English
  quote_policy: summarized
