canonical_text:
  quote: out of a tailor a king was made.
  summary: 'The little tailor completes three forest tasks: he incites two sleeping
    giants to kill each other by dropping stones from a tree, captures a unicorn by
    making it drive its horn into a tree, and traps a wild boar inside a chapel. The
    King, after repeatedly delaying his promised reward, gives him his daughter and
    half the kingdom; the tailor becomes king.'
  language: English
  quote_policy: quoted
