canonical_text:
  quote: "“No one shall give punishment here, but I alone, the Lord.”"
  summary: Hans sends Clever Elsie to cut corn, but she eats and sleeps instead. Hans
    surrounds her with a fowler’s net with bells, shuts the house, and answers that
    Elsie is inside; she doubts her identity, is refused entry elsewhere, and leaves
    the village. In the next tale, God leaves heaven with the apostles and saints
    and orders Saint Peter to admit no one. A lame tailor persuades Peter to let him
    in, explores heaven, sits in the Lord’s golden seat, sees an old woman stealing
    veils at a stream, and throws the golden footstool at her. The Lord returns, discovers
    the missing footstool, rebukes the tailor’s harsh judgment, and expels him from
    heaven.
  language: English
  quote_policy: quoted
