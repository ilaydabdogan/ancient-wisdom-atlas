canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which the youngest huntsman,
    trapped in three chambers, plays a flute that summons elves, who carry him back
    above ground. He reaches the king’s palace during a princess’s wedding; after
    the princesses faint and then plead for him, the king learns the hidden truth
    by listening while they speak to the stove, executes two brothers, and gives the
    youngest daughter to the third man. The passage then begins ''The King of the
    Golden Mountain'': a merchant loses his ships and wealth, bargains with a black
    dwarf for money in exchange for the first thing that rubs against his leg at home
    after twelve years, and unknowingly pledges his little son. The son later confronts
    the dwarf with priestly blessing and a circle; a compromise sends him away in
    a small boat on flowing water, which capsizes, leaving the father to believe him
    lost.'
  language: English
  quote_policy: summarized
