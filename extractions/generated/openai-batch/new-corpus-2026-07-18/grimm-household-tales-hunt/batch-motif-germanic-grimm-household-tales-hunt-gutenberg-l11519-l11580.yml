canonical_text:
  quote: ''
  summary: St. Peter and Brother Lustig cross a stream that St. Peter causes to flow
    across their path; as Brother Lustig is endangered by the rising water, St. Peter
    asks him to confess that he ate the lamb's heart and then helps him through. They
    come to a kingdom where the princess has died. St. Peter privately restores her
    to life by boiling her limbs, arranging her bones, and invoking the holy Trinity
    three times. The King offers a reward, which St. Peter refuses, but Brother Lustig
    receives a knapsack of gold. In a forest, St. Peter divides the gold into three
    shares, naming the third for the one who ate the lamb's heart; Brother Lustig
    confesses and takes the gold, after which St. Peter leaves him.
  language: English
  quote_policy: summarized
