canonical_text:
  quote: "“Bleat, my little goat, bleat, / Cover the table with something to eat,”"
  summary: Two-eyes uses a charm taught by a wise woman to make her goat produce and
    remove a table set with food. Her sisters notice she no longer eats their food.
    One-eye is sent to spy but is put to sleep by Two-eyes’s song. Three-eyes is then
    sent; because one eye is not named in the sleep song, it stays awake and sees
    the charm. Three-eyes reports the secret, and the mother kills the goat with a
    butcher’s knife.
  language: English
  quote_policy: quoted
