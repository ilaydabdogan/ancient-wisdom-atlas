canonical_text:
  quote: ''
  summary: A childless royal couple receives a child who appears as a little donkey.
    The mother rejects him, but the king names him son and heir. The donkey grows
    up, learns to play the lute, sees his donkey form reflected in a well, and leaves
    home with one faithful companion. In another kingdom he enters an old king’s court
    as a lute-player, insists on noble treatment, admires the king’s daughter, and
    receives her as wife. On the wedding night he removes an ass’s skin and appears
    as a handsome royal youth. A hidden servant reports this; the old king watches,
    takes the skin, and burns it in a fire. The excerpt ends as the youth wakes and
    seeks the skin.
  language: English
  quote_policy: summarized
