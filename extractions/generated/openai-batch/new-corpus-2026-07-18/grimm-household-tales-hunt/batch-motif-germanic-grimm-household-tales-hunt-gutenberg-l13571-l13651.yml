- id: obs:11
  text: Years later, peasants selling wood stop with wagons before the palace, some
    with oxen and some with horses.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: A horse gives birth to a foal, and the foal lies down between two oxen.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The peasant with the oxen claims the foal, saying an ox gave birth to it,
