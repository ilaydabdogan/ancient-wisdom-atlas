canonical_text:
  quote: ''
  summary: A poor peasant and his daughter receive land from the King and find a golden
    mortar. The daughter warns that giving it to the King will lead to a demand for
    the missing pestle; the father ignores her and is imprisoned when he cannot produce
    it. The King recognizes her wisdom, sets her a paradoxical riddle, and marries
    her when she fulfills the conditions. Later, as Queen, she helps a peasant expose
    an unjust verdict about a foal by staging impossible fishing on dry ground; the
    peasant is forced to reveal her involvement.
  language: English
  quote_policy: summarized
