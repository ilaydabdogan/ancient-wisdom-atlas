canonical_text:
  quote: ''
  summary: 'Three army-surgeons recover substituted body parts: a thief''s hand, cat''s
    eyes, and a pig''s heart. The replacements produce altered behavior or perception,
    leading the surgeons to return to the host and obtain money under threat. A new
    tale begins in which seven Swabians set out with a single spear, panic at a humming
    beetle or hornet, suffer a rake accident, and then confront a sleeping hare as
    if it were a monster.'
  language: English
  quote_policy: summarized
