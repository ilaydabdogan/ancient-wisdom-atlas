canonical_text:
  quote: ''
  summary: 'The passage presents three brief snake stories: a child shares food with
    a snake that gives treasures and later dies when the mother kills it, after which
    the child wastes away; an orphan girl receives a golden crown from a snake by
    using a blue silk handkerchief, takes it, and the grieving snake dies; a child
    and a snake briefly speak about the child’s missing little sister.'
  language: English
  quote_policy: summarized
