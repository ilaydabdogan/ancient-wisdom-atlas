canonical_text:
  quote: ''
  summary: 'The passage concludes an episode in which Thumbling is swallowed by a
    fox, bargains for release by promising the fowls in his father’s yard, and returns
    home. It then begins “Fitcher’s Bird”: a wizard disguises himself as a poor beggar,
    abducts the first two daughters of a household, gives each keys and an egg, forbids
    entry into one room, and kills them after they enter the bloody chamber. The third
    sister hides the egg safely, enters the forbidden room, finds her sisters dismembered,
    reassembles them, and they come back to life.'
  language: English
  quote_policy: summarized
