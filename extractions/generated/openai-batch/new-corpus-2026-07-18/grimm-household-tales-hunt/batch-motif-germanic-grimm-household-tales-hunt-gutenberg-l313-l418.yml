canonical_text:
  quote: ''
  summary: A frog bargains to recover a princess’s golden ball from the well in exchange
    for companionship at table and bed. The princess promises but resists fulfilling
    the promise until her father enforces it. When she angrily throws the frog against
    the wall, he becomes a King’s son, explaining that a witch had enchanted him and
    that only she could free him. The couple depart in a carriage, accompanied by
    Faithful Henry, whose iron heart-bands break from joy at his master’s release.
  language: English
  quote_policy: summarized
