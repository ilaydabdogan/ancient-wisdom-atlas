canonical_text:
  quote: "“Earth-workers, come forth.”"
  summary: 'The youngest King’s daughter repeatedly comforts the King’s son, persuades
    him to eat, combs his hair until he sleeps, and uses a knotted handkerchief struck
    three times on the earth to summon earth-workers. The earth-workers complete three
    tasks: clearing a forest, cleansing and stocking a fish-pond, and clearing a briar-covered
    mountain while building a furnished castle on it.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The King says that one of the girls must take food to the King’s son; the
    two eldest refuse, so the youngest is forced to go.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the forest, the youngest daughter asks the King’s son how he is doing,
    persuades him to eat despite his expectation that he will die, and offers to comb
    his hair.
  category: action
  evidence_refs:
