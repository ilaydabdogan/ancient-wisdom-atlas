- id: obs:4
  text: The King’s daughter knots her handkerchief, strikes the earth three times,
    speaks the command for earth-workers to come forth, and little earth-men appear
    asking what she commands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The earth-men gather their kindred, clear the forest, lay the wood in heaps
