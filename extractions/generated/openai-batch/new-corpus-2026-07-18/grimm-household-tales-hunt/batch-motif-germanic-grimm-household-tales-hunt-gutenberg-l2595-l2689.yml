canonical_text:
  quote: ''
  summary: The old woman is revealed as a cannibal witch who lures children with a
    bread house. She imprisons Hansel to fatten him and forces Grethel to serve. Hansel
    deceives her by offering a bone instead of his finger. Grethel later tricks the
    witch into entering the oven and burns her, frees Hansel, and the siblings take
    jewels from the witch's house. A white duck carries them across a great water,
    and they return to their father's house, where the household's anxiety ends.
  language: English
  quote_policy: summarized
