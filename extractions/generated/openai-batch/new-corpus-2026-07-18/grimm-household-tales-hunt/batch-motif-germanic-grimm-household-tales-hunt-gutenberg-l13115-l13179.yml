canonical_text:
  quote: ''
  summary: The disliked youngest brother, Hans, coerces an earth mannikin into revealing
    where the King’s daughters are hidden. The mannikin shows a dry well and warns
    that Hans’s companions will betray him. The elder brothers fail to descend, but
    Hans is lowered to the bottom, kills many-headed dragons guarding three princesses,
    sends the princesses up in a basket, and avoids betrayal by sending up a stone
    in his place. His brothers cut the rope, think him dead, take the princesses away,
    and claim the rescue before the King.
  language: English
  quote_policy: summarized
