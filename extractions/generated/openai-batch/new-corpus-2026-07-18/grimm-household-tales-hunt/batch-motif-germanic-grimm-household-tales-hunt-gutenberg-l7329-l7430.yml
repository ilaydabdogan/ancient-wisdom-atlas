canonical_text:
  quote: ''
  summary: 'The passage concludes one tale with a Queen saved at the stake when six
    swans become her brothers after she covers them with shirts; she is vindicated
    and the wicked stepmother is burned. It then begins “Briar-Rose”: a frog foretells
    a royal daughter, Wise Women give gifts, an excluded thirteenth Wise Woman curses
    the princess to die by a spindle, the twelfth softens this to a hundred-year sleep,
    and the princess later pricks her finger, causing the whole palace to sleep while
    thorns grow around the castle and trap would-be entrants.'
  language: English
  quote_policy: summarized
