canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a wandering maiden releases a dragon
    and lion from enchantment, is abandoned when a princess carries the youth away,
    wins access to the bridegroom through marvelous gifts, breaks a forgetfulness
    spell, flees with him on a griffin across the Red Sea, and returns home. It then
    begins 'The Goose-Girl,' where an old queen sends her betrothed daughter to a
    distant prince with a dowry, a maid, a speaking horse, and a blood-marked handkerchief.
  language: English
  quote_policy: summarized
