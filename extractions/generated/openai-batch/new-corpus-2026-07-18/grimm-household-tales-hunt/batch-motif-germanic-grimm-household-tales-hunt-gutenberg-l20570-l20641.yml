canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which a maiden and a tailor ascend
    from an underground cave on a rising stone, restore an enclosed castle and buildings
    to natural size, release servants and people from smoke-filled vessels, reunite
    with the maiden’s brother in human form after he has killed a magician while in
    bull form, and marry at an altar. It then begins “Lazy Harry,” where Harry seeks
    to avoid tending his goat by marrying Trina, Trina takes over both goats, and
    later proposes exchanging the goats for a beehive that will produce honey without
    daily herding. The honey is stored in the bedroom, with a hazel-stick kept by
    the bed to protect it without getting up.
  language: English
  quote_policy: summarized
