canonical_text:
  quote: ''
  summary: 'The passage concludes an episode in which a singing bird gives a gold
    chain to the father, red shoes to Marlinchen, and drops a millstone on the woman,
    after which smoke, flames, and fire subside and the little brother appears. The
    passage then begins “Old Sultan”: a farmer plans to shoot his old toothless dog;
    a wolf helps the dog stage a rescue of the farmer’s child, restoring the dog’s
    status; the dog later refuses to permit the wolf to steal sheep; the wolf challenges
    him, but flees with a boar after misreading the dog’s three-legged cat ally as
    armed and dangerous.'
  language: English
  quote_policy: summarized
