canonical_text:
  quote: ''
  summary: A giant meets personified Death on a highway, fights him, and leaves him
    defeated. A young man helps Death recover, and Death promises to send messengers
    before taking him. Later the man suffers illnesses but resumes merry living; Death
    comes, explains that the illnesses and Sleep were the promised messengers, and
    the man yields and goes with Death.
  language: English
