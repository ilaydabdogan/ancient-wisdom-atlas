canonical_text:
  quote: Eating the snake had given him power of understanding the language of animals.
  summary: 'The passage concludes one tale with a king exposing his daughter’s false
    report of her husband’s death and punishing her and her accomplice by sending
    them to sea in a holed ship. It then begins “The White Snake”: a wise king secretly
    eats from a covered dish; a curious servant tastes the white snake on the dish
    and gains the ability to understand animals. This power lets him discover that
    a duck swallowed the Queen’s lost ring, clearing him of theft. Rewarded, he leaves
    to travel, rescues three fishes, and avoids trampling an ant-king’s people; the
    animals promise future repayment.'
  language: English
  quote_policy: quoted
