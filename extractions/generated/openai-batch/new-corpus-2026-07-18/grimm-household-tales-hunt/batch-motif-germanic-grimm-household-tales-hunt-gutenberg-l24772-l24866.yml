canonical_text:
  quote: ''
  summary: A pious hermit who carries water up a mountain loses angelic favor after
    condemning a sinner going to the gallows. A speaking bird and an angel reveal
    his fault and prescribe penance with a dry branch. While begging, he shelters
    in a cave with an old woman and her robber sons; his example converts them. He
    dies after the dry branch sprouts three green twigs, showing restored divine favor.
    A separate short legend explains how Our Lady uses field bindweed as a little
    glass for wine and frees a stuck waggoner's cart, giving the flower its name.
  language: English
  quote_policy: summarized
