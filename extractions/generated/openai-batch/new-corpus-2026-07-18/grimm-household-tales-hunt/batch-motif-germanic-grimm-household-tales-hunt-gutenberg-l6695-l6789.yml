canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a bride outwits a wizard-bridegroom,
    rescues her sisters by hiding them in a gold-covered basket, escapes in a honey-and-feather
    bird disguise, and has her kin burn the wizard and his company in his house. It
    then begins 'The Juniper-Tree,' where a childless wife prays for a child, wishes
    beneath a juniper-tree for a child red as blood and white as snow, experiences
    a month-by-month pregnancy marked by seasonal changes and juniper berries, gives
    birth, dies, and is buried beneath the tree.
  language: English
  quote_policy: summarized
