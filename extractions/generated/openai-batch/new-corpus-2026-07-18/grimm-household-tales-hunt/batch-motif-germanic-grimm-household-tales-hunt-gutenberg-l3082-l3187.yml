canonical_text:
  quote: "“Flounder, flounder in the sea, / Come, I pray thee, here to me”"
  summary: The man reaches a great palace where his wife invites him in. After seeing
    the surrounding land, she demands to become King and sends him to the Flounder
    at the sea. The sea appears dark and putrid, but the Flounder grants the wish.
    The palace becomes a royal court, yet the wife then demands to be Emperor. The
    man again goes unwillingly to a more violent, black, boiling sea, and the Flounder
    grants the imperial title; the palace becomes an immense imperial court with elaborate
    regalia and attendants.
  language: English
  quote_policy: quoted
