canonical_text:
  quote: I am seeking the water of life, for my father is sick unto death.
  summary: The youngest prince courteously answers a dwarf and receives instructions
    and magical aids for obtaining the water of life from an enchanted castle. He
    opens the iron door, quiets lions with bread, takes a sword and loaf, meets a
    maiden who says he has delivered her and promises marriage and a kingdom, then
    narrowly obtains the water before the door closes at twelve. He secures the release
    of his imprisoned elder brothers, uses the magical bread and sword to relieve
    three kingdoms from famine and war, and is then betrayed by those brothers, who
    steal the true water at sea, replace it with salt sea-water, heal the father themselves,
    and threaten the youngest into silence.
  language: English
  quote_policy: quoted
