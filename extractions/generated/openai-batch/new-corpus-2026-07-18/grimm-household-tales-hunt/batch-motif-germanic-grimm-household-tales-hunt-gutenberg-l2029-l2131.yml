canonical_text:
  quote: ''
  summary: 'Opening portion of “Rapunzel”: a childless couple live beside an enchantress’s
    walled garden. The pregnant wife craves rampion from it, the husband steals the
    plant, and the enchantress demands the unborn child in exchange. The enchantress
    names and takes Rapunzel, later confines her in a doorless tower, and climbs up
    by her long hair. A king’s son discovers Rapunzel through her singing, learns
    the hair-call, visits her, and proposes escape. Rapunzel accidentally reveals
    him to Dame Gothel, who cuts off her hair and banishes her to a desert.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man and woman had long wished in vain for a child, and the woman hoped God
    was about to grant her desire.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A little back window of their house overlooked a splendid garden full of flowers
    and herbs, surrounded by a high wall and owned by a feared enchantress.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman saw rampion in the garden, developed an increasing desire to eat
    it, grew pale and miserable, and said she would die without it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband climbed over the garden wall in the evening, took rampion, and
    gave it to his wife, who made and ate a salad from it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the husband’s second descent into the garden, the enchantress confronted
    him for stealing rampion; after his plea, she allowed him rampion on the condition
    that he give her the child his wife would bear.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The frightened husband consented, and when the child was born the enchantress
    appeared, named her Rapunzel, and took her away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Rapunzel was twelve, the enchantress shut her in a forest tower that
    had no stairs or door and only a small window at the top.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The enchantress summoned Rapunzel by calling for her to let down her hair,
    and then climbed up the long hair into the tower.
  category: action
  evidence_refs:
  - ev:4
  - ev:8
- id: obs:9
  text: A king’s son riding through the forest heard Rapunzel singing, repeatedly
    returned to listen, observed the enchantress’s method of entry, and later used
    the same call to climb up by Rapunzel’s hair.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:8
- id: obs:10
  text: The king’s son spoke kindly to Rapunzel, asked her to marry him, and she agreed;
    she planned to weave a ladder from silk skeins he would bring on each visit.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Rapunzel mentioned the young king’s son to Dame Gothel, revealing the secret
    visits; Dame Gothel then cut off Rapunzel’s braids with scissors and took her
    to a desert.
  category: sequence
  evidence_refs:
  - ev:7
