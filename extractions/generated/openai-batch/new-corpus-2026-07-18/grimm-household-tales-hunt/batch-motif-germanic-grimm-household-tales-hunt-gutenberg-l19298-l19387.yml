canonical_text:
  quote: ''
  summary: A wise woman restores a lambkin and a little fish to human form and shelters
    them in a forest hut. In “Simeli Mountain,” a poor brother learns from twelve
    robbers the spoken formula that opens a treasure-filled mountain; he takes gold
    moderately and aids his family and others. His rich brother discovers the secret
    through a pitched bushel measure, greedily enters the mountain, forgets the correct
    formula, is trapped, and is killed by the robbers. The passage ends with the opening
    of “Going A-Travelling,” in which a poor woman's son wants to travel despite having
    no money.
  language: English
  quote_policy: summarized
