canonical_text:
  quote: ''
  summary: Faithful John overhears ravens foretell that the queen will fall as if
    dead at the wedding dance and can be saved only by drawing and spitting out three
    drops of blood from her right breast; anyone who reveals this will become stone.
    John silently prevents foretold dangers involving a horse and bridal garment,
    revives the queen, is condemned by the king, explains himself at the gallows,
    and turns to stone. The grieving king keeps the stone figure by his bed. After
    the queen bears twin sons, the stone says it can be restored to life if the king
    cuts off the children's heads and sprinkles it with their blood.
  language: English
  quote_policy: summarized
