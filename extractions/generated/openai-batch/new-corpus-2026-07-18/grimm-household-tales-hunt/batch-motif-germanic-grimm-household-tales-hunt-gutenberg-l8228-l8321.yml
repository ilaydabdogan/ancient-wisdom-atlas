canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which a king’s daughter repeatedly
    steals magical objects from her common-born husband, who uses a hat and then a
    horn to defeat her and become king. It then begins “Rumpelstiltskin”: a poor miller
    claims his daughter can spin straw into gold; a king tests her under threat of
    death; a little man performs the impossible spinning in exchange for her necklace,
    ring, and promised first child; the king marries her after the third success.'
  language: English
  quote_policy: summarized
