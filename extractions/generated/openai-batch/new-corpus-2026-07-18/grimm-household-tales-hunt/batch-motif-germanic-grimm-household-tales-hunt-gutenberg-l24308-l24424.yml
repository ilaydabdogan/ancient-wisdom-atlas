canonical_text:
  quote: ''
  summary: Maid Maleen, disguised as the bride, is married to the King's son and keeps
    the chain he gives her. The false bride later attempts to take her place, but
    fails to know the words spoken to the nettle, foot-bridge, and church-door, and
    lacks the chain. The King's son exposes the deception, rescues Maid Maleen from
    execution, recognizes her as the true bride, and she reveals her identity and
    seven-year imprisonment. The false bride is beheaded. The tower of imprisonment
    remains and is remembered in a children's song.
  language: English
  quote_policy: summarized
