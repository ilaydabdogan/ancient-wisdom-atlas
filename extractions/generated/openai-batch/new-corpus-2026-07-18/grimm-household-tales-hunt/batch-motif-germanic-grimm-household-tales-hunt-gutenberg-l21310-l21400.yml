canonical_text:
  quote: ''
  summary: The passage contains the end of an enchanted-hut tale in which a girl survives
    midnight disturbances, awakens in a royal palace, and learns that her kindness
    to humans and animals has freed a bewitched prince and his animal-form attendants.
    It then gives the tale of a violent tailor who abuses his wife, twists the phrase
    'share joy and sorrow,' and is punished by magistrates. It begins a tale explaining
    that tools and birds once had intelligible speech, and that the birds decided
    to elect a king while the green plover refused and withdrew.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At midnight the sleeping girl hears cracking, doors striking walls, groaning
    beams, and a crash as if the roof had fallen, but she is unharmed and sleeps again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the morning the girl finds herself in a vast hall with royal splendor,
    including golden floral wall decoration, an ivory bed, a red velvet canopy, pearl-embroidered
    shoes, and richly dressed attendants.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stranger in the old man's bed reveals himself as a king's son who had
    been bewitched into living as an old gray-haired man in the forest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The prince says his three attendants had been in the forms of a cock, a hen,
    and a brindled cow, and that the spell was broken because the girl showed love
    to both humans and animals.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The prince orders the attendants to fetch the girl's parents for a marriage
    feast and says the girl's two sisters are locked in the cellar and will serve
    a charcoal-burner until they become kinder.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The tailor repeatedly abuses his wife; authorities imprison him and require
    him to promise not to beat her and to share joy and sorrow with her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After release, the tailor avoids outright beating but pulls his wife's hair,
    chases her, and throws a yard-measure, scissors, and other objects at her until
    neighbors help her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Before the magistrates, the tailor claims he kept his promise by sharing joy
    when he hit his wife and sorrow when he missed; the judges reject the answer and
    punish him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The next tale states that in former days every sound had meaning, and gives
    examples of a hammer, plane, and mill wheel speaking intelligible phrases.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The birds also once had a language understood by everyone; they decide to
    choose a king, but the green plover opposes rulership, declares its desire for
    freedom, and withdraws to a solitary marsh.
  category: sequence
  evidence_refs:
  - ev:9
