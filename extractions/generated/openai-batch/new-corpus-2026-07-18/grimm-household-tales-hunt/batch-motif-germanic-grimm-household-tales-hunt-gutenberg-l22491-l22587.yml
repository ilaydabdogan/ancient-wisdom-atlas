canonical_text:
  quote: ''
  summary: 'The passage closes one tale with a greedy goldsmith finding that his gold
    has become coal and that he has been bodily marked with baldness and two humps.
    It then narrates ''The Giant and the Tailor'': a boastful tailor travels, meets
    a giant, frightens him with exaggerated replies to tasks, and is finally flung
    into the air from a willow branch. The passage then begins ''The Nail,'' in which
    a merchant returning from a fair ignores warnings that his horse lacks a nail
    and then a shoe.'
  language: English
  quote_policy: summarized
