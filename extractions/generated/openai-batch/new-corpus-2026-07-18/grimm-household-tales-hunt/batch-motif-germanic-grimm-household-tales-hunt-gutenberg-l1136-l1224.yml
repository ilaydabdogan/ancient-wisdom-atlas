canonical_text:
  quote: ''
  summary: The King has golden goods made, and he and Faithful John sail in merchant
    disguise to the town of the princess of the Golden Dwelling. Faithful John uses
    the gold to draw the princess onto the ship, which sails away while she views
    the treasures. After she discovers she has been carried away, the King reveals
    his royal identity and love, and she consents to be his wife. While they travel
    over the sea, Faithful John understands the speech of three ravens who foretell
    two dangers to the young King—a chestnut horse and a deadly bridal garment—and
    warn that revealing the knowledge will turn the speaker partly to stone.
  language: English
  quote_policy: summarized
