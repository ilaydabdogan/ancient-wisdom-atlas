canonical_text:
  quote: ''
  summary: A poor servant-girl finds an unreadable letter that proves to be an invitation
    from elves to stand as godmother at a child's christening. Three elves lead her
    to their hollow mountain dwelling, where she sees small but splendid furnishings
    and performs the godmother role. She stays what she believes to be three days,
    is entertained and given money, then returns home to find strangers in the house;
    seven years have passed and her former masters have died.
  language: English
  quote_policy: summarized
