canonical_text:
  quote: ''
  summary: 'The supplied line range contains four short Grimm tales: a destitute pious
    girl gives away her bread and garments and receives fallen star-money and a new
    linen shirt; a dead child appears at noon seeking hidden farthings that should
    have been given to a poor man; a shepherd chooses among three sisters by observing
    how they eat cheese; and an idle bride is rejected when her industrious servant
    turns discarded flax into a gown.'
  language: English
