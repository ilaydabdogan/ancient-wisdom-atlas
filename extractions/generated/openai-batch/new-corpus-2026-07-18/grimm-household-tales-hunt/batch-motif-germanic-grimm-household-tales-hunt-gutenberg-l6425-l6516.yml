canonical_text:
  quote: ''
  summary: The passage closes a tale in which a physician, Death's godson, twice saves
    royal patients by moving them in bed against Death's position and using an herb;
    Death then brings him to an underground cave of life-candles and extinguishes
    his candle. The passage then begins 'Thumbling as Journeyman,' where a thumb-sized
    tailor's son sets out with a needle-sword, is carried up a chimney by steam, and
    later evades an angry mistress by hiding in household objects before being expelled.
  language: English
