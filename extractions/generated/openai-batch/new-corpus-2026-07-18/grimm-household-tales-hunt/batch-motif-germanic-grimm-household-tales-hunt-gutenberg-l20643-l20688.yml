canonical_text:
  quote: ''
  summary: 'The passage closes one tale with Harry and Trina discussing exchanging
    honey for geese, imagining a future child, and accidentally breaking the honey
    pitcher while demonstrating punishment. It then begins “The Griffin”: a king’s
    only daughter is incurably ill, a prophecy says an apple will heal her, and the
    king promises marriage to her and kingship to whoever brings such an apple. A
    peasant sends his eldest son with a basket of apples to court.'
  language: English
  quote_policy: summarized
