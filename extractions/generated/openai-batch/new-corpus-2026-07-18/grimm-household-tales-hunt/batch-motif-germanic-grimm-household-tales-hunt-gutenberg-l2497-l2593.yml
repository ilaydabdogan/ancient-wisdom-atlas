canonical_text:
  quote: ''
  summary: After returning once to their father's house, Hansel and Grethel are again
    taken into the forest during scarcity. Hansel's attempt to mark the path with
    bread crumbs fails when birds eat them. The children wander hungry and exhausted
    until a snow-white bird leads them to a house made of bread, cakes, and sugar.
    They eat part of it, and an old woman comes out, welcomes them inside, feeds them,
    and gives them beds.
  language: English
  quote_policy: summarized
