  summary: A good servant plays his fiddle at the gallows, causing officials, a crowd,
    and dogs to dance uncontrollably. The judge offers him his life if he stops. The
    servant then threatens the Jew with more fiddling unless he confesses where the
    money came from; the Jew confesses theft, and the judge has him hanged.
