canonical_text:
  quote: ''
  summary: The Lord, traveling at night in common clothing, asks for lodging first
    at a rich man's large house and is refused, then is welcomed by a poor couple
    who share food and their bed. In the morning he grants the poor couple three wishes,
    including eternal happiness, health and daily bread, and a new house. The rich
    man later learns what happened, regrets refusing the traveler, pursues him, and
    asks for wishes too; the Lord warns him that such wishes will not be to his advantage
    but permits them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The Lord is described as walking on earth among humans, becoming tired and
    overtaken by darkness before reaching an inn, and seeing two houses facing each
    other: one large and beautiful, one small and poor.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lord, in common clothing, asks the rich man for a night's lodging; the
    rich man looks him over, refuses, gives reasons about full rooms and possible
    poverty, and shuts the window.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The poor man promptly opens his small house and invites the traveler to stay
    because it is already dark.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The poor man's wife welcomes the traveler, prepares potatoes on the fire,
    milks the goat, and the couple shares coarse food with the guest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The poor couple offers their own bed to the traveler and lies on straw on
    the ground after the traveler initially resists taking the bed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the morning the poor couple makes breakfast for the guest, and the Lord
    offers them three wishes because they are kind and good.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The poor man asks for eternal happiness, health for the couple during life,
    and daily bread; after the Lord suggests a new house as the third wish, the poor
    man accepts, and the Lord changes the old house into a new one and blesses them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The rich man sees a new clean-looking house with red tiles and bright windows
    where the old hut had stood and sends his wife to learn what happened.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The rich man's wife hears from the poor man that a traveler granted the poor
    couple wishes and a new house, then reports this to her husband.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The rich man regrets having sent the traveler away; his wife advises him to
    ride after the traveler and ask for three wishes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The rich man catches up with the Lord on horseback, speaks pleasantly, offers
    an excuse for not lodging him, asks for three wishes, and receives permission
    after a warning that it will not be to his advantage.
  category: sequence
  evidence_refs:
  - ev:8
