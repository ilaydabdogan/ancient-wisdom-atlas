canonical_text:
  quote: ''
  summary: 'The passage closes the wolf episode: the wolf wakes with stones in his
    stomach, goes to a well to drink, falls in because of the stones, drowns, and
    the seven kids celebrate with their mother. The passage then begins “Faithful
    John”: a dying king charges Faithful John to guide his young son and to keep him
    from seeing a dangerous portrait of the princess of the Golden Dwelling. After
    the king dies, the young king insists on entering the forbidden chamber, sees
    the portrait, faints, declares overwhelming love for the princess, and Faithful
    John proposes using crafted gold objects to approach her.'
