canonical_text:
  quote: ''
  summary: A twin hunts again in an enchanted forest, resists a witch’s trick, defeats
    her with silver buttons, and forces her to restore his petrified brother, animals,
    and other captives. The witch is burned and the forest clears. On the return journey,
    jealousy leads one brother to behead the other, but a hare retrieves the root
    of life and the dead brother is revived. The twins return by opposite gates, and
    the Queen identifies her true husband by a golden clasp on the lion. The passage
    then begins a new tale in which a poor peasant arranges for a carpenter to make
    a painted wooden calf.
  language: English
  quote_policy: summarized
