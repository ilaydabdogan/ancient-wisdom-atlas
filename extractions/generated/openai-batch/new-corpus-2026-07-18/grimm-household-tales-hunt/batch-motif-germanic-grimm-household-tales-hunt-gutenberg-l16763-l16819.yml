canonical_text:
  quote: ''
  summary: At an inn, three apprentices who answer only with fixed phrases are framed
    after the innkeeper and his wife murder a rich merchant for his gold. Their answers
    are treated as a confession, and they are sentenced to death. The Devil first
    promises them safety, then arrives at the scaffold in a fast coach, appears as
    a noble gentleman, declares them innocent, and lets them speak. The eldest apprentice
    identifies the innkeeper and directs officials to a cellar containing other victims.
    The innkeeper is executed, and the Devil says he has obtained the soul he wanted
    while the apprentices go free with money.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The three apprentices are served at the inn, pay the bill, and repeatedly
    answer with the phrases “All three of us,” “For money,” and “And quite right too,”
    while still seeing and knowing what is happening around them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A merchant with a large sum of money asks the host to keep it safe because
    he fears the three apprentices may steal it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The host carries the merchant’s trunk to his room and feels that it is heavy
    with gold, then lodges the apprentices below and the merchant upstairs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At midnight, when the host thinks everyone is asleep, the host and his wife
    come with an axe and kill the rich merchant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the morning, the merchant is found dead in bed and bathed in blood; the
    host accuses the three apprentices, and the lodgers confirm the accusation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When asked whether they killed the merchant, the three apprentices repeat
    their fixed phrases, and the host presents the replies as their own confession.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The apprentices are imprisoned and are afraid, but the Devil comes at night
    and tells them to bear it one more day and that not one hair of their heads will
    be hurt.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the trial, the judge questions the apprentices; their fixed replies are
    again treated as a confession, and the judge orders them led to death immediately.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: As the apprentices are about to be taken to the scaffold, a coach drawn by
    four blood-red chestnut horses arrives quickly, fire flashes from the stones,
    and a white handkerchief signals a pardon.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Devil steps out of the coach as a beautifully dressed noble gentleman,
    says the three apprentices are innocent, and tells them they may now speak.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The eldest apprentice states that the innkeeper is the murderer and says that
    proof can be found in the innkeeper’s cellar, where many others he has killed
    are hanging.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: Executioner’s men find the cellar as described, the judge has the innkeeper
    beheaded, and the Devil says he has obtained the soul he wanted while the apprentices
    are free and have money for life.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
