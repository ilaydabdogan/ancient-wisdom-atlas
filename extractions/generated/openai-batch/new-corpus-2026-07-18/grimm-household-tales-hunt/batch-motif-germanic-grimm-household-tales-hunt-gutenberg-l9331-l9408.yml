canonical_text:
  quote: ''
  summary: After the dragon battle, the huntsman, the King's daughter, and the animal
    companions all fall asleep. The marshal finds them, beheads the huntsman, carries
    off the maiden, and forces her to say that he killed the dragon. The maiden delays
    the wedding for a year and a day. The animals later wake after a humble-bee stings
    the hare; the hare fetches a life-giving root from a distant mountain, and the
    huntsman is revived after his severed head is reattached. When the lion has replaced
    the head backwards, he removes and turns it, and the hare heals the huntsman again
    with the root.
  language: English
  quote_policy: summarized
