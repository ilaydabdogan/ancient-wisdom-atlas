canonical_text:
  quote: ''
  summary: Brother Lustig spends his remaining money at an inn, uses a wish-working
    knapsack to take two roasted geese from the host's oven, eats one, and gives the
    other to two hungry journeymen. The journeymen are accused of stealing the goose
    and beaten by the landlord. Brother Lustig later comes to a magnificent castle
    near a wretched inn, is refused lodging at the inn, hears that no one survives
    a night in the castle, and says he will try it.
  language: English
