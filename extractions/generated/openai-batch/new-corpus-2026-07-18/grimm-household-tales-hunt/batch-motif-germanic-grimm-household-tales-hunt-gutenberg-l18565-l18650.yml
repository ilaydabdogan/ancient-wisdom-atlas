canonical_text:
  quote: ''
  summary: A king’s son asks an aged queen or sorceress for her daughter and is given
    three tasks. With the aid of specialized servants, he retrieves a ring from the
    Red Sea, consumes an impossible meal through a voracious helper, and recovers
    the daughter after she is magically removed to a distant rock during enchanted
    sleep. The sorceress is forced to give him her daughter but privately urges the
    daughter to resent the match.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king’s son with his servants comes to the town of the aged queen and asks
    for her beautiful daughter, offering to perform any task she sets.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The aged queen or sorceress sets three tasks as the condition for the king’s
    son becoming husband and master of her daughter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first task is to fetch the queen’s ring, which she says she has dropped
    into the Red Sea.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The sharp-sighted servant locates the ring on a pointed stone under the water;
    the Stout One drinks the sea dry, and the Tall One retrieves the ring by hand.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The second task requires the prince to have three hundred oxen eaten completely
    and three hundred casks of wine drunk completely, under threat of forfeiting his
    life if any part remains.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Stout One eats all three hundred oxen and drinks all the wine, leaving
    nothing behind.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The third task requires the prince to hold the queen’s daughter in his arms
    until midnight without falling asleep; if she is no longer in his arms when the
    queen comes, he is lost.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Before the third task, the prince orders the servants to keep watch; the Tall
    One winds himself around the prince and maiden in a circle, and the Stout One
    guards the door.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At eleven o’clock the old woman casts a spell that makes everyone fall asleep,
    and at the same moment the maiden is carried away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the magic loses power before midnight, the Listener hears that the maiden
    is on a rock three hundred leagues away, bewailing her fate.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Tall One carries the sharp-eyed servant to the enchanted rock; when the
    bandage is removed from the sharp-eyed servant’s eyes, his look shatters the rock
    into many pieces.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Tall One carries the maiden back before midnight so that she is again
    in the prince’s arms when the sorceress enters.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: Seeing her daughter in the prince’s arms, the sorceress says that someone
    knows more than she does and is forced to give him her daughter.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The sorceress whispers to her daughter that it is a disgrace to obey common
    people and not choose a husband according to her own liking.
  category: speech
  evidence_refs:
  - ev:8
