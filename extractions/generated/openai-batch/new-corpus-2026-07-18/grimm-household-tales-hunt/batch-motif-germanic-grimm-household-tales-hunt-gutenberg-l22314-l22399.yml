canonical_text:
  quote: ''
  summary: A huntsman is drawn under a dangerous mill-pond by a nix. His wife searches
    for him, dreams of a mountain cottage, and receives ritual instructions from a
    wise old woman. At successive full moons she offers a golden comb, a golden flute,
    and a golden spinning-wheel at the pond; each time the water returns her husband
    more fully until he escapes. The pond then floods after the couple, and the wife
    invokes the old woman, whereupon the couple are transformed into a toad and a
    frog. The supplied passage ends mid-sentence during the flood episode.
  language: English
  quote_policy: summarized
