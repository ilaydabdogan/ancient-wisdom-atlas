canonical_text:
  quote: ''
  summary: Brother Lustig, a discharged soldier, shares his small bread and money
    with St. Peter, who repeatedly appears as a beggar in different shapes. Later
    St. Peter appears as a discharged soldier and travels with him. St. Peter heals
    a dying peasant without asking reward, but Brother Lustig urges acceptance of
    a lamb. In a wood, Brother Lustig cooks the lamb, eats its heart before St. Peter
    returns, and falsely claims that lambs have no heart.
