canonical_text:
  quote: ''
  summary: A count emerges from a three-day wilderness wandering, reaches a royal
    palace, and gives an emerald book to the Queen. The Queen recognizes a pearl associated
    with her lost youngest daughter, recounts how the daughter was exiled for saying
    she loved her father like salt, and resolves with the King to seek the old woman
    from whom the count received the pearl. The scene shifts to the old woman’s lonely
    dwelling, where the daughter spins, follows an owl-signaled command to go out
    at night, removes an old skin at a moonlit well, appears as a radiant maiden,
    weeps, then hides herself again when disturbed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The count wanders in the wilderness for three days before reaching a large
    town and being led to the royal palace.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The count kneels, presents an emerald book to the Queen, and the Queen falls
    as if dead after opening it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Queen orders the count released from the King’s servants and speaks with
    him privately.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Queen says she had three daughters, and describes the youngest as extraordinarily
    beautiful, with tears that became pearls and jewels.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The King asks the three daughters to express how much they love him; the eldest
    compares her love to sugar, the second to a pretty dress, and the youngest to
    salt.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The King becomes angry at the salt comparison, divides the kingdom between
    the two elder daughters, and has the youngest led into the wild forest with a
    sack of salt on her back.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Queen says pearls from the youngest daughter’s eyes strewed the road when
    she left, and that later the King repented and searched the forest without finding
    her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Queen recognizes a pearl in the emerald book as the same kind as those
    from her daughter’s eyes; the count says he received it from the strange old woman
    in the forest.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The King and Queen resolve to seek the old woman, expecting to learn news
    of their daughter where the pearl had been found.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The old woman sits spinning in a lonely place at dusk, lit by a burning log
    on the hearth; geese return from pasture, and the daughter enters.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The daughter sits beside the old woman, spins thread for two hours, and neither
    speaks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: An old night-owl with fiery eyes peers in at the window and cries three times;
    the old woman tells the daughter it is time to go out and do her work.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The daughter walks through meadows into a valley and reaches a well beside
    three old oak trees, under a bright full moon over the mountain.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: At the well, the daughter removes a skin covering her face, washes herself,
    dips the skin in water, and lays it in the moonlight to bleach and dry.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: After the gray mask is removed, the daughter is described as a changed maiden
    with golden hair, star-bright eyes, and apple-blossom cheeks.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:16
  text: The maiden weeps; when she hears rustling in a nearby tree and a dark cloud
    covers the moon, she puts on the old skin and vanishes.
  category: sequence
  evidence_refs:
  - ev:7
