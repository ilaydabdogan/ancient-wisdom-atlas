canonical_text:
  quote: ''
  summary: 'The passage first concludes a Roland tale: a faithful maiden is compelled
    to sing at Roland''s wedding, Roland recognizes her voice as that of the true
    bride, remembers what he had forgotten, and marries her. The passage then begins
    "The Golden Bird": a king''s golden apples disappear from a tree; his elder sons
    fail as night watchmen; the youngest stays awake, wounds a golden bird, and obtains
    a golden feather. The king demands the whole bird. The elder sons ignore a speaking
    Fox''s counsel and choose the cheerful inn, forgetting the quest. The youngest
    spares the Fox, rides on its tail, and follows its advice by entering the humble
    inn.'
  language: English
  quote_policy: summarized
