canonical_text:
  quote: ''
  summary: Snow-white and Rose-red twice rescue a dwarf, first from being pulled into
    a brook by a fish and then from an eagle; each time he responds with insults while
    carrying pearls or precious stones. Later the girls see his jewels on the heath.
    A black bear appears, the dwarf offers his treasures and the girls to save himself,
    and the bear kills him. The bear then reveals himself as a king's son who had
    been bewitched by the dwarf and freed by the dwarf's death. Snow-white marries
    the prince, Rose-red marries his brother, the treasure is divided, and the mother
    keeps white and red rose-trees. The passage then begins another tale in which
    a master sends John to seek a lost cow, but John says he has instead found three
    blackbirds.
  language: English
  quote_policy: summarized
