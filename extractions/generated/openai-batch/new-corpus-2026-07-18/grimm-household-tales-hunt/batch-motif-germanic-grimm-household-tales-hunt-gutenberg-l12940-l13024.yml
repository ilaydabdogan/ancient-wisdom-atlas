canonical_text:
  quote: ''
  summary: An unnamed head-servant works for a covetous bailiff under an agreement
    that his yearly payment will be three blows. He outdoes the other servants through
    extraordinary strength, survives a plot in which a mill-stone is dropped on him
    in a well, and is then sent to a haunted mill at night, where a supernatural event
    begins as the passage breaks off.
  language: English
