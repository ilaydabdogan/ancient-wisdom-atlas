canonical_text:
  quote: ''
  summary: A gardener's boy with hidden golden hair is noticed by the King's daughter
    while working in the garden. He brings her wild flower wreaths, resists showing
    his hair, and rejects her ducats. When war comes, he calls Iron John in the dark
    forest and receives a strong horse and iron soldiers, wins the battle anonymously,
    then returns to his humble three-legged horse and is mocked. The King proclaims
    a three-day feast in hopes of finding the unknown victor; the youth again receives
    aid from Iron John and catches the King's daughter's golden apple.
  language: English
  quote_policy: summarized
