canonical_text:
  quote: ''
  summary: A foster-father equips two brothers with weapons, dogs, gold, and a knife
    that will show an absent brother's life or death when set in a tree. The brothers
    spare several animals and receive paired young animals as companions. They later
    divide the animals, part east and west, and the younger reaches a mourning town
    where a princess is to be given to a dragon unless someone conquers it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The foster-father gives each brother a gun, a dog, and as much saved gold
    as each chooses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The foster-father gives them a bright knife and instructs them to put it into
    a tree if they separate; the side pointing toward an absent brother will rust
    if he dies and remain bright if he lives.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two brothers enter a large forest, remain there beyond a day, and become
    hungry enough to seek prey.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: A hare, fox, wolf, bear, and lion each ask the huntsmen to spare their lives
    and each provides two young animals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The huntsmen do not kill the young animals; the animals follow them and later
    serve them.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The foxes guide the huntsmen to a village where the men buy food and have
    food given to their beasts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The brothers decide they cannot remain together, divide the animals equally,
    promise brotherly love until death, put the knife into a tree, and go east and
    west.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The younger brother arrives with his beasts in a town hung with black crape,
    lodges at an inn, and arranges food for the animals.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The innkeeper says the king's only daughter is healthy but is to die the next
    day.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The innkeeper explains that a dragon on a high hill must receive a pure virgin
    every year or it will lay waste to the whole country; the king's daughter is the
    only maiden left.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The innkeeper says many knights have died trying to kill the dragon, and that
    the king promises his daughter and future rule of the kingdom to whoever conquers
    it.
  category: speech
  evidence_refs:
  - ev:7
