canonical_text:
  quote: ''
  summary: A hungry sheep-dog leaves a master who lets him starve. A sparrow befriends
    him and gets him meat and bread. After the dog sleeps on the highway, a waggoner
    ignores the sparrow’s warning and kills the dog with his cart. The sparrow then
    retaliates by spilling the waggoner’s wine, causing the deaths of his three horses,
    gathering birds to eat his corn at home, and finally threatening the waggoner’s
    life.
  language: English
  quote_policy: summarized
