canonical_text:
  quote: ''
  summary: While the King is away at war, the young Queen gives birth to a son. The
    Devil twice substitutes false letters at a brook while the messenger sleeps, first
    claiming the Queen bore a monster and then ordering the Queen and child killed.
    The King's mother spares them by using a hind's tongue and eyes as tokens, sends
    the Queen and child into the world, and later reveals the deception to the King.
    In the forest the Queen is guided by an angel to a free refuge where she and her
    child are cared for seven years and her severed hands grow back by God's grace.
    The King vows to search without food or drink and, after seven years, reaches
    the same forest house, where the angel receives him and offers rest.
  language: English
  quote_policy: summarized
