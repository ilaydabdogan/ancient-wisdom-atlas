canonical_text:
  quote: ''
  summary: 'The passage concludes the tale of the straw, coal, and bean: the straw
    forms a bridge over a brook, the coal attempts to cross, the straw burns and breaks,
    the coal dies in the water, and the bean bursts from laughter but is sewn up by
    a tailor, explaining the black seam on beans. The passage then begins “The Fisherman
    and His Wife”: a fisherman catches a talking flounder who says he is an enchanted
    prince and releases him. At his wife Ilsabil’s urging, the fisherman returns to
    ask the flounder first for a cottage and then for a castle; each request is made
    with a repeated verse at the sea, whose appearance changes before the flounder
    grants the demand.'
  language: English
  quote_policy: summarized
