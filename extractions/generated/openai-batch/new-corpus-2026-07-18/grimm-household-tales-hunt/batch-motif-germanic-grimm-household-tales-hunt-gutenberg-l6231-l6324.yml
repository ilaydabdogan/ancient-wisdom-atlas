  summary: The passage includes the end of a tale in which a bride reveals a robber-bridegroom’s
    crimes through a dream-framed account and physical proof; the tale of Herr Korbes,
    in which animals and objects travel to his house and kill him; and the beginning
    of The Godfather, in which a poor man receives healing water whose use depends
    on where Death stands near a patient.
