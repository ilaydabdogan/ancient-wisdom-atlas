canonical_text:
  quote: ''
  summary: A queen warns Benjamin that twelve coffins have been prepared for him and
    his brothers if she gives birth to a daughter. The brothers flee to the forest,
    see the red flag announcing a daughter, and swear vengeance against girls. Years
    later the daughter learns of her brothers, takes their shirts, seeks them in the
    forest, is recognized by Benjamin, and is reconciled with all twelve brothers
    after Benjamin secures a promise that the first maiden they meet will not be killed.
    The siblings then live together in harmony in the forest hut.
  language: English
  quote_policy: summarized
