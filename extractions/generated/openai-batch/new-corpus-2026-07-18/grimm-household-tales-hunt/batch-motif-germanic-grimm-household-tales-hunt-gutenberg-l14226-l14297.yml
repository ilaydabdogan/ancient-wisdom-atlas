canonical_text:
  quote: ''
  summary: A poor woodcutter spends his savings on his only son's schooling, but the
    son must return home when the money is gone. The son accompanies his father to
    forest work, wanders during the meal break, and finds a voice under the roots
    of an ancient oak. He discovers a glass bottle containing a frog-shaped creature,
    uncorks it, and releases a spirit who grows enormous and threatens to strangle
    him. The spirit identifies himself as mighty Mercurius and says his confinement
    was punishment. The scholar tricks him into proving he can fit back into the bottle,
    then corks it and returns it to the roots.
  language: English
  quote_policy: summarized
