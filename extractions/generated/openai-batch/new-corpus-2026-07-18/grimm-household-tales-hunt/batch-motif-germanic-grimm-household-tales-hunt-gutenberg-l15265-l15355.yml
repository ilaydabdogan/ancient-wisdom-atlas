  quote: ''
  summary: The tailor faces escalating royal demands prompted by a malicious shoemaker.
    Bees copy the royal palace in wax for him; a chestnut horse repays a prior good
    deed by producing a clear spring in the castle courtyard; and a stork brings a
    baby prince to the queen. The tailor ultimately receives the eldest princess as
    wife.
  language: English
