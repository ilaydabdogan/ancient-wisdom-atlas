canonical_text:
  quote: ''
  summary: A poor wood-cutter gives his young daughter to the Virgin Mary, who takes
    her to heaven and raises her. At age fourteen, the girl receives the keys to thirteen
    heavenly doors, with permission to open twelve and a warning not to open the thirteenth.
    She opens the permitted doors, then secretly opens the forbidden one, sees the
    Trinity in fire and splendour, and acquires a golden mark on her finger after
    touching the light. When Mary returns, the girl denies opening the door three
    times; Mary detects the disobedience and lying and declares her no longer worthy
    to remain in heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wood-cutter, his wife, and their only child, a three-year-old girl, live
    near a great forest and are so poor that they lack daily bread.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A tall beautiful woman with a crown of shining stars appears to the wood-cutter
    and identifies herself as the Virgin Mary, mother of the child Jesus.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Virgin Mary asks the wood-cutter to bring his child to her and says she
    will be the child's mother and care for her; the wood-cutter obeys and gives the
    child to her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Virgin Mary takes the girl up to heaven, where the child fares well, eats
    sugar-cakes, drinks sweet milk, wears golden clothes, and plays with little angels.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the girl is fourteen, the Virgin Mary gives her the keys to the thirteen
    doors of heaven, permits her to open twelve, and forbids the thirteenth with a
    warning of misery.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After Mary departs, the girl opens the twelve permitted heavenly dwellings
    one by one and sees one Apostle in great light inside each.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The girl desires to know what is behind the forbidden door and proposes only
    to unlock it and look in; the little angels warn that this would be a sin and
    might cause unhappiness.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: When she is alone, the girl uses the key, opens the forbidden door, and sees
    the Trinity sitting in fire and splendour.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The girl touches the light with her finger, and the finger becomes golden;
    she is afraid, shuts the door, runs away, and cannot wash the gold off.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the Virgin Mary returns and asks for the keys, she questions the girl
    three times about whether she opened the thirteenth door, and the girl denies
    it three times.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Virgin Mary detects the girl's disobedience by her beating heart and golden
    finger, says she has disobeyed and lied, and declares her no longer worthy to
    be in heaven.
  category: sequence
  evidence_refs:
  - ev:8
