canonical_text:
  quote: ''
  summary: 'The passage contains three short tale episodes: the Lord rejuvenates an
    old beggar by placing him in a forge fire and cooling tub, while a smith''s failed
    imitation harms his mother-in-law and leads to the birth of ape-like boys; the
    Lord and the Devil dispute over the creation and damage caused by goats, explaining
    goats'' tails, eyes, and the Devil''s goat-shape; an enchanter''s illusion of
    a cock carrying a beam is exposed by a girl made wise by four-leaved clover.'
  language: English
  quote_policy: summarized
