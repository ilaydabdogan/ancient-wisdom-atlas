  text: The Lord places the old man in the forge fire, then in the quenching tub,
    blesses him, and the man emerges young and healthy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The smith later tries the same procedure on his old mother-in-law, but she
    screams, is burned, and lies distorted in the cooling tub.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Two pregnant women are frightened by the failed attempt, and that night give
