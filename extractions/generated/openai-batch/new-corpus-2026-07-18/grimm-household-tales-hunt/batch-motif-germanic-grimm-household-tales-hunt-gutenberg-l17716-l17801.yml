canonical_text:
  quote: ''
  summary: A girl receives magical objects from an old toad, crosses a glass mountain,
    sharp swords, and a lake to find the King's son she had freed. Disguised as a
    scullery-maid, she bargains with a rival bride for nights in the bridegroom's
    chamber using dresses found in nuts. After two drugged nights, the King's son
    stays awake on the third, recognizes her as the true beloved, and returns with
    her over the obstacles. The old house becomes a castle, the toads are disenchanted
    as King's children, and the couple marry and rule two kingdoms.
  language: English
  quote_policy: summarized
