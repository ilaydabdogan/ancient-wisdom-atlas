canonical_text:
  quote: ''
  summary: 'The passage contains the end of a tale in which a soldier outwits the
    Devil with an unfillable boot, the Devil flees at sunrise, and a soul is saved.
    It then gives the tale of Old Rinkrank: a king sets a glass-mountain bride test;
    the princess falls into the mountain and into an underground cave, where Old Rinkrank
    forces her into service for many years. She later traps his beard in a window,
    obtains the ladder by which he ascends the mountain, escapes to her father, and
    Old Rinkrank is found and punished while the princess marries her betrothed.'
  language: English
  quote_policy: summarized
