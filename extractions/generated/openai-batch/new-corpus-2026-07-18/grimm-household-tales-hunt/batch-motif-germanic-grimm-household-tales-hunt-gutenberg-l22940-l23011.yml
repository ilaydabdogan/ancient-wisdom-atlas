canonical_text:
  quote: "“I am here already!”"
  summary: A framed tale presents itself as true. On a bright Sunday morning near
    harvest time, a hedgehog leaves home to inspect his turnips and meets a haughty
    hare visiting cabbages. The hare mocks the hedgehog’s legs. Angered, the hedgehog
    wagers that he can beat the hare in a race, with a gold louis-d’or and a bottle
    of brandy as stakes. After returning home, the hedgehog recruits his wife and
    instructs her to stand at the lower end of a furrow and call out that he has already
    arrived when the hare reaches her.
  language: English
