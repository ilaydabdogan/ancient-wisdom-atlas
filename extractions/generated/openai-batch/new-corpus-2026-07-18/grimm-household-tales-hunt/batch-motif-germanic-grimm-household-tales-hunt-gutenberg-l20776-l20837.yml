canonical_text:
  quote: ''
  summary: 'Hans tends a hundred hares as a royal task. A little man gives him a whistle
    that recalls any hare, and Hans uses it when the king''s daughter carries one
    away. Hans returns the full flock, but the king sets another task: he must bring
    a feather from the Griffin''s tail. On the journey, people at two castles and
    a tall man at a lake ask Hans to question the Griffin about a lost key, an ill
    daughter, and the reason the carrier must carry everyone across the lake. At the
    Griffin''s house, the Griffin''s wife hides Hans under the bed, says the Griffin
    devours Christians, and plans to ask the questions herself while Hans plucks a
    feather. The Griffin returns and smells a Christian, but his wife says the visitor
    has gone.'
  language: English
  quote_policy: summarized
