canonical_text:
  quote: ''
  summary: 'In the end of one tale, Lina and Fundevogel evade an old cook and three
    servants through three paired transformations: rose-tree and rose, church and
    chandelier, fishpond and duck. The duck draws the cook into the water, where she
    drowns, and the children return home. The passage then begins “King Thrushbeard”:
    a proud king’s daughter mocks assembled suitors, especially a crooked-chinned
    king whom she names King Thrushbeard. Her father vows to marry her to the first
    beggar who arrives; a fiddler comes, is given her as wife, and leads her away
    from the palace past lands said to belong to King Thrushbeard, ending at a small
    hut.'
  language: English
  quote_policy: summarized
