canonical_text:
  quote: ''
  summary: A gold-child conceals his golden appearance under bear-skins, passes safely
    through a forest, marries a maiden, is nearly killed by her father because he
    appears ragged, and is later revealed as golden. After dreaming of a stag, he
    hunts into the forest, reaches a witch's house, threatens her dog, and is transformed
    to stone. His brother sees a golden lily droop, understands that misfortune has
    occurred, rides out, compels the witch to restore him, and the brothers return.
    A following tale begins with a fox threatening to eat geese; the geese obtain
    permission to pray before death and continue cackling without end.
  language: English
  quote_policy: summarized
