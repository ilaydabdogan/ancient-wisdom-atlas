canonical_text:
  quote: ''
  summary: The king imprisons the queen after being told she bore a cat. Three children
    raised by an old fisherman leave in turn to seek family. The daughter receives
    aid and instructions from an old woman at a water crossing, retrieves a caged
    bird and fountain water, reunites with her brothers, and transforms a black dog
    into a prince. A bird later reveals the children’s royal identity and the queen’s
    wrongful imprisonment. The queen is healed with the fountain water, the false
    sisters are punished, and the daughter marries the prince.
  language: English
  quote_policy: summarized
