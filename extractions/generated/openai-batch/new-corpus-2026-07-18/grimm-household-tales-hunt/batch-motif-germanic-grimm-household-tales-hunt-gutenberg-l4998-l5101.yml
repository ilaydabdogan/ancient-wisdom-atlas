canonical_text:
  quote: ''
  summary: An angel brings a queen and her son Sorrowful to a sleeping king. The child’s
    speech and the queen’s restored natural hands, together with the preserved silver
    hands, lead the king to recognize his wife and son; the family returns home, rejoices,
    and the king and queen marry again. The next tale, “Clever Hans,” begins with
    Hans repeatedly visiting Grethel, receiving gifts, mishandling each gift by applying
    his mother’s previous advice to the wrong object, and being corrected after each
    failure.
  language: English
  quote_policy: summarized
