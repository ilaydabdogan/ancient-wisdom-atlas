canonical_text:
  quote: ''
  summary: A huntsman kills three giants, keeps their tongues and other objects as
    proof, and leaves. A one-eyed captain claims the deed and is promised the King’s
    daughter, who refuses him and is forced into poverty and service at a forest hut.
    The huntsman later comes to the hut, shows the sword, tongues, slipper, and garment
    pieces, and is recognized as the true rescuer. The King exposes the captain by
    asking about the missing tongues; the captain pronounces a punishment that is
    applied to himself. The princess marries the huntsman, and he later receives the
    kingdom.
  language: English
  quote_policy: summarized
