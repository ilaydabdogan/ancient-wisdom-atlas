canonical_text:
  quote: ''
  summary: The passage concludes the tale of King Thrushbeard, in which a king's daughter
    is made to live in poverty, attempt manual work, serve as a kitchen-maid, and
    suffer public humiliation at a royal wedding before King Thrushbeard reveals his
    disguises and celebrates their marriage. The passage then opens Little Snow-white
    with a queen in winter wishing for a child with colors like snow, blood, and ebony;
    the child is born with those traits, and the queen dies.
  language: English
