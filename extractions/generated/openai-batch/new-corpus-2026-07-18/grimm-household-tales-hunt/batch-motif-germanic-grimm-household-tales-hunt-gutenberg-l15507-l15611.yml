canonical_text:
  quote: ''
  summary: 'The passage closes the tale of Hans the Hedgehog: the princess marries
    him, his hedgehog skin is burned after he removes it, he is restored to handsome
    human form, receives the kingdom, and later reconciles with his father. It then
    gives the tale of a grieving mother whose dead child appears until her tears cease
    wetting its burial shroud. The next tale begins with an honest servant underpaid
    by a miserly master; he gives his three farthings to a needy dwarf, who grants
    him three wishes.'
  language: English
  quote_policy: summarized
