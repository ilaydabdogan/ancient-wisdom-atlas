canonical_text:
  quote: ''
  summary: 'The passage begins with the close of a preceding tale, where Peter removes
    a tailor from heaven and the tailor goes to Wait-a-bit. It then gives the title
    of tale 36 and opens with a tailor, his three sons, and a milk-giving goat. Each
    son pastures the goat, but the goat gives contradictory reports: she says to the
    son that she has eaten enough, then tells the father she has had no food. The
    father beats and drives out each son. When the father pastures the goat himself
    and hears the same contradiction, he realizes he expelled his sons without cause,
    shaves the goat''s head as a mark, whips her, and she runs away.'
  language: English
  quote_policy: summarized
