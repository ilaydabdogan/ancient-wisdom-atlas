literal_observations:
- id: obs:1
  text: A poor but good little girl lives alone with her mother, and they have nothing
    left to eat.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The child goes into the forest and meets an aged woman who knows of her sorrow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The aged woman gives the child a little pot that cooks sweet porridge when
    addressed with one formula and stops cooking when addressed with another formula.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pot frees the girl and her mother from poverty and hunger because they
    can eat porridge whenever they choose.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the girl is away, her mother uses the cooking command, eats until satisfied,
    and then cannot stop the pot because she does not know the stopping word.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The porridge rises over the edge of the pot and fills the kitchen, the house,
    the next house, and the whole street.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The unchecked porridge causes great distress, and no one knows how to stop
    it until the child returns.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The child says the stopping formula, the pot ceases cooking, and anyone wishing
    to return to town must eat a way back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A peasant named Hans takes a hazel-stick, prepares to travel for three days,
    and instructs his wife Trina to sell their three cows only for two hundred thalers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Hans warns Trina that if she does anything foolish, he will beat her with
    the stick.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A cattle-dealer agrees to the stated price, drives the cows out, but says
    he has forgotten his money-belt when Trina asks for payment.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The cattle-dealer takes two cows and leaves one cow as security for later
    payment.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Trina believes she has managed the sale cleverly because she kept the smallest
    cow, which eats the least.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Hans becomes enraged, lifts his stick, then refrains from the promised beating
