canonical_text:
  quote: "“Cook, little pot, cook” ... “Stop, little pot”"
  summary: The passage contains the tale of a poor girl who receives a pot that produces
    porridge by command, and whose mother causes an uncontrolled overflow by not knowing
    the stopping command. It then begins the tale “Wise Folks,” in which a peasant
    named Hans leaves his wife Trina to sell three cows only for a fixed price, and
    she accepts a pledge that leaves her with only one cow and no money.
  language: English
