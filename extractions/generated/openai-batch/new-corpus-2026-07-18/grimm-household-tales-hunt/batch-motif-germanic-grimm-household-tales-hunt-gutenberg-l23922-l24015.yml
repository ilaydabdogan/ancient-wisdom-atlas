canonical_text:
  quote: ''
  summary: A rich man is morally questioned by the voice at the door of his heart
    and admits greed and lack of charity. A poor neighbor asks him for grain; the
    rich man gives more than requested on condition that the poor man watch his grave
    for three nights after death. The rich man dies soon after. The poor man keeps
    his promise; on the third night a fearless discharged soldier joins him. At midnight
    the Evil One appears to claim the dead man, threatens the watchers, then offers
    gold. The soldier negotiates for enough gold to fill one boot and secretly cuts
    the boot sole so it will not fill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rich man is standing and surveying his riches when a knock occurs at the
    door of his heart rather than at the door of his room.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A voice asks the rich man whether he has helped his family, considered the
    poor, shared bread with the hungry, and been content with what he has.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The rich man's heart answers that he has been hard and pitiless, has shown
    no kindness to his family, has turned away beggars, has neglected God, and has
    desired ever more wealth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A poor neighbor with many hungry children asks the rich man to lend him four
    measures of corn.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The rich man offers eight measures of corn as a gift rather than a loan, on
    condition that the poor man watch by his grave for three nights after his death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The rich man dies after three days, is buried, and the poor man decides to
    keep his promise because he accepted the corn and had given his word.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The first two nights of grave-watching pass quietly in the churchyard, with
    the moon above the grave and an owl flying past.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the third evening the poor man meets a scarred, discharged soldier who
    says he is afraid of nothing and has no shelter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The soldier agrees to help keep watch at the grave and says that whatever
    they encounter, good or bad, they will share between them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: At midnight the Evil One appears bodily before the two watchers, claims the
    man in the grave, and threatens to wring their necks if they do not leave.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The soldier refuses to obey or fear the Evil One and says that the watchers
    will remain seated there.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Devil offers a bag of money to make the watchers leave; the soldier asks
    instead for as much gold as will go into one of his boots.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: While the Devil is away fetching gold, the soldier cuts the sole from his
    left boot and places the boot in grass at the edge of a half-overgrown hole.
  category: action
  evidence_refs:
  - ev:7
