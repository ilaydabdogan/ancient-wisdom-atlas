canonical_text:
  quote: ''
  summary: A locksmith’s apprentice leaves home, learns hunting from a green-clad
    huntsman, receives an unfailing air-gun, encounters giants in a forest, agrees
    to help them reach an imprisoned princess, kills an alarm dog, enters the sleeping
    castle, takes a magical sword and identifying tokens, and then addresses the waiting
    giants at the gate.
  language: English
  quote_policy: summarized
