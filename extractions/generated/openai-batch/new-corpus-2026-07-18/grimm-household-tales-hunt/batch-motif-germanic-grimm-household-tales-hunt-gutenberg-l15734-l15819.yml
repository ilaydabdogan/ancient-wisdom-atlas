  evidence_refs:
  - ev:3
- id: obs:8
  text: The giants say that beyond the forest there is a great lake, behind it a tower,
    and in the tower an imprisoned lovely princess whom they want to carry off.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The giants say a tiny dog begins barking when anyone approaches and thereby
    wakes everyone in the royal palace.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The huntsman crosses the lake by boat, shoots the little dog dead before it
    can bark, and tells the giants to wait outside while he sees how matters stand.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Inside the quiet sleeping castle, the huntsman finds a pure silver sword with
    a golden star and the King’s name, reads a sealed letter saying the sword can
    kill everything opposing its holder, and takes the sword.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The huntsman sees the sleeping King’s daughter and thinks he cannot give an
