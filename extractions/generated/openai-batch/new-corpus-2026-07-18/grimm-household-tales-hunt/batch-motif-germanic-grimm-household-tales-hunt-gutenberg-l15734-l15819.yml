  text: The huntsman gives him an air-gun as payment, and the gun is described as
    hitting its mark without fail.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a large forest at evening, the young huntsman climbs a high tree, sees
    a distant little light, marks the direction with his hat, and follows it after
    descending.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The light proves to be an enormous fire where three giants sit roasting an
    ox on a spit.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The huntsman repeatedly shoots pieces of meat from a giant’s hand or mouth;
