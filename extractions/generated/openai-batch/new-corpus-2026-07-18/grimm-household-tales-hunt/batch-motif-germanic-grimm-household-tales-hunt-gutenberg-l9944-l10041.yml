  quote: ''
  summary: The first passage tells of a youngest prince called Simpleton who prevents
    his elder brothers from harming ants, ducks, and bees, later receives their aid
    in completing three tasks at an enchanted castle, releases sleepers and petrified
    people, marries the youngest princess, and becomes king. The second passage opens
    “The Three Feathers,” in which an old king sends his three sons to seek the finest
    carpet by following three blown feathers; the third son, also called Simpleton,
    descends through a trap-door and encounters toads.
