canonical_text:
  quote: ''
  summary: The passage closes one tale with a huntsman revealed as the returning king,
    who rewards a soldier after defeated enemies are sent to prison. It then gives
    the whole short tale of a poor boy who finds a golden key and an iron chest whose
    contents are deferred. It begins the legend of St. Joseph in the Forest, where
    a rejected youngest daughter is lost, hosted by St. Joseph, shares food generously,
    sleeps in his hut, and receives a money bag; the second daughter then begins a
    similar visit.
  language: English
  quote_policy: summarized
