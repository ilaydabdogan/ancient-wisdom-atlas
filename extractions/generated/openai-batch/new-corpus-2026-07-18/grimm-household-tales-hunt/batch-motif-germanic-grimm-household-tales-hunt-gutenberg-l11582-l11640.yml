canonical_text:
  quote: ''
  summary: Brother Lustig, separated from St. Peter and again without money, hears
    that a king’s daughter is dead and offers to revive her for payment. He imitates
    St. Peter’s earlier procedure with water, fire, dismemberment, boiling, bones,
    and a threefold invocation, but fails because the bones are in confusion. St.
    Peter appears, rebukes him, correctly orders the bones, invokes the Trinity three
    times, and the princess rises healthy. St. Peter forbids Brother Lustig to take
    payment, but Brother Lustig cunningly obtains a knapsack full of gold. St. Peter
    warns him and grants the knapsack the power to contain whatever he wishes, then
    departs.
  language: English
  quote_policy: summarized
