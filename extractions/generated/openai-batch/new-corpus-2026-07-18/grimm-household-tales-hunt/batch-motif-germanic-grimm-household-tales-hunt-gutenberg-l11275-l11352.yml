canonical_text:
  quote: ''
  summary: The passage first shows Grethel eating the two roasted chickens meant for
    her master and his guest, then deceiving the guest into fleeing by warning him
    that the master intends to cut off his ears, and deceiving the master by claiming
    the guest stole the chickens. The passage then gives the tale of an old grandfather
    mistreated by his son and daughter-in-law until their young child imitates their
    behavior by preparing a trough for them in old age, prompting them to restore
    the grandfather to the family table.
