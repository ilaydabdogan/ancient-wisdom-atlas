canonical_text:
  quote: ''
  summary: A sister cares for her bewitched brother in roebuck form, leads him into
    the forest, and lives with him in an empty cottage. The roebuck repeatedly joins
    the King’s hunt, is wounded and followed, and the King learns the cottage password.
    The King uses the call to enter, sees the maiden, proposes marriage, and accepts
    her condition that the roebuck accompany her. She becomes Queen, and the roebuck
    is cared for in the palace garden.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sister and the little roe weep, and the girl tells the roe that she will
    never leave him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sister puts her golden garter around the roebuck’s neck, makes a soft
    cord from rushes, ties him with it, and leads him deeper into the forest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sister and roebuck find an empty little house, where she makes a bed for
    the roe, gathers food for herself and grass for him, prays in the evening, and
    sleeps with her head on his back.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The King holds a great hunt in the forest; the roebuck hears the horns, dogs,
    and huntsmen, asks to join, and the sister lets him go after giving him a door-call
    to use on return.
  category: sequence
  evidence_refs:
  - ev:4
