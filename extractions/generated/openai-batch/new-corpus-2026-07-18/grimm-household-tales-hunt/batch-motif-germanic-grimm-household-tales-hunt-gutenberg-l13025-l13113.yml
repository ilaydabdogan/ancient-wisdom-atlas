canonical_text:
  quote: ''
  summary: 'A youth or young giant encounters an invisible meal and unseen blows at
    a haunted mill, retaliates through the night, and the mill is released. He refuses
    the miller’s money, returns to claim his agreed reward from the bailiff, and kicks
    the bailiff and his wife out of windows so that they hover in the air. The passage
    then begins “The Gnome”: a king’s three daughters eat from a forbidden apple tree
    and sink underground; the king offers one daughter in marriage to whoever restores
    them. Three huntsmen come to an empty castle with warm food, choose by lot who
    will stay, and the eldest and then the second are beaten by a small mannikin after
    a bread-dropping trick.'
  language: English
  quote_policy: summarized
