canonical_text:
  quote: ''
  summary: The passage closes one tale with a king recognizing his first bride by
    a ring, dismissing another bride, celebrating a wedding, and restoring a lion
    to favor. It then narrates Hans arranging for his son to learn thieving and witchcraft
    from a master-thief; the son is recognized in bird form with a dwarf's help, later
    changes into a greyhound and a horse for sale, escapes through further transformations,
    and finally kills the master-thief in a fox form after a magical pursuit. The
    passage then begins another tale by describing a witch in a forest castle who
    changes shape, immobilizes intruders, and transforms innocent maidens into caged
    birds.
  language: English
  quote_policy: summarized
