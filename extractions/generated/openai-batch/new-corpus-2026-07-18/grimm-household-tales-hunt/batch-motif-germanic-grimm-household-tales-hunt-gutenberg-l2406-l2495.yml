canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which a bride invites three
    strange aunts to her wedding; their spinning-related bodily features alarm the
    bridegroom, who forbids the bride from spinning. It then begins "Hansel and Grethel":
    famine afflicts a poor wood-cutter''s household near a forest, the wife proposes
    abandoning the children, Hansel gathers shining white pebbles, leaves a trail
    while pretending to look back at a cat, and later follows the moonlit pebbles
    with Grethel after the parents leave them by a fire in the forest.'
  language: English
  quote_policy: summarized
