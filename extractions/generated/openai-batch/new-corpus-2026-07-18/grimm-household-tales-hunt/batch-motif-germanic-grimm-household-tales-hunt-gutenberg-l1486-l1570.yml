canonical_text:
  quote: ''
  summary: The passage continues a tale in which a musician in the forest uses his
    fiddle to attract companions, traps a fox and a hare who wish to learn from him,
    and is later protected from the freed animals by a poor wood-cutter with an axe.
    The passage then begins “The Twelve Brothers,” where a king declares that his
    twelve sons must die if the queen bears a girl, prepares twelve coffins, and the
    grieving mother is questioned by her youngest son Benjamin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The musician repeatedly says that time is passing heavily in the forest and
    plays his fiddle to fetch another companion.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: A fox comes toward the musician, praises his playing, asks to learn it, and
