  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The musician leads the fox to a footpath, bends down a hazel-bush and another
    young tree, ties the fox’s front paws to the boughs, and releases the bushes so
    the fox hangs struggling in the air.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A little hare comes toward the musician, praises his fiddling, asks to learn
    it, and promises obedience as a scholar to a master.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The musician ties a string around the hare’s neck and to an aspen tree, orders
    it to run twenty times around the tree, and the hare becomes caught as the string
    twists around the trunk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The wolf frees its feet from a stone cleft and pursues the musician in anger,
    wanting to tear him to pieces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The fox calls the wolf “Brother wolf,” asks for help, and says that the musician
    has betrayed him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The wolf frees the fox by drawing down the tree and biting through the cord;
    the wolf and fox then free the tied-up hare, and the three animals seek the musician
    together.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The musician plays again; the sound reaches a poor wood-cutter, who gives
    up his work, comes with a hatchet, and listens to the music.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The musician calls the wood-cutter the right companion because he was seeking
    a human being and not a wild beast.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: When the wolf, fox, and hare approach with an evil design, the wood-cutter
    raises his axe before the musician, and the frightened beasts run back into the
    forest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: At the beginning of “The Twelve Brothers,” a king and queen have twelve children,
    all boys, and the king says that if the thirteenth child is a girl, the twelve
    boys shall die so that her possessions will be great and the kingdom will fall
    to her alone.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
