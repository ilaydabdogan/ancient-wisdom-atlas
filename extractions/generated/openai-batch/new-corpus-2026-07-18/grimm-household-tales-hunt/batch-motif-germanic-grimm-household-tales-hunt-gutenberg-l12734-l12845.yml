canonical_text:
  quote: Alas, young Queen how ill you fare!
  summary: The goose-girl uses a wind-address to keep Conrad away while she braids
    her hair. Conrad reports her conduct to the aged King, who secretly observes her
    and then contrives to hear her lament into an iron stove. She reveals that she
    is a king’s daughter displaced by a false waiting-maid. The aged King restores
    her royal garments, exposes the false bride, and the false bride pronounces her
    own punishment. The true bride marries the young King. The passage then begins
    “The Young Giant,” where a thumb-sized child named Thumbling is taken away by
    a giant.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The maiden asks a gentle wind to blow Conrad’s hat away until she has braided
    and bound up her hair; the wind does so and Conrad must chase the hat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Conrad tells the aged King that the maiden speaks to a horse’s head named
    Falada hanging at the dark gateway, and that the head answers her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The horse’s head addresses the maiden as a young Queen and says her mother’s
    heart would break if she knew of her condition.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The aged King hides first by the dark gateway and then in the meadow thicket,
    where he observes the maiden’s radiant unplaited hair and the wind carrying off
    Conrad’s hat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The goose-girl says she may not tell her sorrows to any human being because
    she has sworn not to do so and would have lost her life otherwise.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the aged King’s suggestion, she enters the iron stove and laments that
    she is a King’s daughter whose false waiting-maid forced her to remove her royal
    apparel and took her place with the bridegroom.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The aged King listens through the stove pipe, then has royal garments placed
    on the goose-girl and reveals to his son that she is the true bride.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At a feast, the bridegroom sits between the King’s daughter and the waiting-maid,
    but the waiting-maid does not recognize the princess in her dazzling array.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The aged King asks the waiting-maid, as a riddle, what punishment a person
    deserves for the acts he narrates; she declares a punishment, and he says she
    has pronounced her own sentence.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the sentence is carried out, the young King marries his true bride and
    they reign in peace and happiness.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A countryman has a son, Thumbling, who is as big as a thumb and does not grow;
    the father carries him in his pocket to the field and places him in a furrow.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: A giant comes over the hill, picks up Thumbling carefully with two fingers,
    and carries him away while the father stands terrified.
  category: action
  evidence_refs:
  - ev:9
