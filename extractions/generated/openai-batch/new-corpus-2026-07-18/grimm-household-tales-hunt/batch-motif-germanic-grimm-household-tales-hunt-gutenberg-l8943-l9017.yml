canonical_text:
  quote: ''
  summary: Catherine and Frederick set out to recover stolen gold. Catherine wastes
    their provisions by smearing butter on cart-ruts and rolling cheeses downhill,
    then misunderstands Frederick's instruction to secure the house by carrying away
    the lower door. At night they hide in a tree above thieves, while falling stones
    and pears are misinterpreted by the thieves as natural objects falling from the
    tree.
  language: English
  quote_policy: summarized
