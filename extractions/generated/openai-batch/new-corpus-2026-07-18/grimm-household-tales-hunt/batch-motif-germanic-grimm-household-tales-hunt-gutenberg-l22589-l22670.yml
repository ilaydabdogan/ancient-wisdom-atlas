canonical_text:
  quote: ''
  summary: 'The passage first concludes a brief misfortune sequence in which a merchant''s
    horse is disabled and he blames an unlucky nail, followed by the maxim "Hasten
    slowly." It then begins "The Poor Boy in the Grave": an orphaned shepherd-boy
    is placed with a harsh rich household, is repeatedly underfed and beaten after
    losing poultry to a hawk, is sent to a judge with grapes and letters, naively
    thinks a letter can see and betray him, and is later forced to chop straw under
    threat. After accidentally cutting his coat with the straw, he fears the farmer
    will kill him and says he will take his own life.'
  language: English
  quote_policy: summarized
