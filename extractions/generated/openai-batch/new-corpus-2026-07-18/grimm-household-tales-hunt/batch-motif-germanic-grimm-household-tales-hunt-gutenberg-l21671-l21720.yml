  quote: ''
  summary: After creation, God fixes the lifespans of creatures. The ass, dog, and
    monkey each complain that thirty years are too many, and God removes years from
    them. Man asks for more than thirty years, and God adds the years removed from
    the animals. The narrator explains the seventy-year human life as thirty human
    years followed by ass, dog, and monkey years.
