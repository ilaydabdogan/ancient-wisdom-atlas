canonical_text:
  quote: ''
  summary: The Queen learns from her truthful looking-glass that Snow-white is still
    alive with the seven dwarfs. Driven by envy, she makes repeated disguised visits
    across the mountains to the dwarfs' house, first using tight laces and then a
    poisoned comb to leave Snow-white deathlike or senseless. The dwarfs revive Snow-white
    by removing the harmful objects and warn her not to admit anyone. The Queen again
    consults the glass, vows Snow-white's death, prepares a beautiful poisonous apple
    in a secret room, and approaches Snow-white disguised as a country-woman offering
    an apple.
  language: English
  quote_policy: summarized
