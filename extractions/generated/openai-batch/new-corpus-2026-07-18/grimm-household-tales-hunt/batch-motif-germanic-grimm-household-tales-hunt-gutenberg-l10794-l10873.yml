canonical_text:
  quote: ''
  summary: 'A discharged soldier, angered by poor payment, recruits companions with
    extraordinary abilities: uprooting trees, shooting at extreme distance, blowing
    windmills from afar, running faster than birds, and causing deadly frost with
    a properly worn cap. In a town, he stakes his and his runner-servant’s heads on
    a race against the king’s daughter for marriage. The runner fetches water first
    but sleeps; the princess empties his pitcher. The sharpshooter sees this from
    the castle, shoots away the skull used as the runner’s pillow, and the runner
    refills the pitcher and returns before the princess.'
  language: English
  quote_policy: summarized
