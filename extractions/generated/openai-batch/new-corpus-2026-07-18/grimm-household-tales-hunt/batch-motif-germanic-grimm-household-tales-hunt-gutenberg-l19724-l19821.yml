literal_observations:
- id: obs:1
  text: A girl on her wedding day goes in procession toward the church and reaches
    what appears to be a swollen stream with no bridge or plank.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bride lifts her clothes to wade through the apparent water, and a man
    identified as the enchanter mocks her for mistaking it for water.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: After her eyes are opened, the bride sees that she is standing in a field
    blue with flowers of blue flax, and the people also see it and chase her away
    with ridicule and laughter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old woman begs and, when she receives something, says that God may reward
    the giver.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A boy standing by the fire invites the shivering old beggar-woman to come
    in and warm herself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The beggar-woman stands too near the fire, her rags begin to burn without
    her noticing, and the boy sees this; the narrator says he ought to have put out
    the flames, even by weeping water if no water was available.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A king with three sons, near death and uncertain about succession, declares
    that the laziest son shall have the kingdom.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The eldest son claims he is so idle that he would not open his eye if a drop
    fell into it while he was resting.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The second son claims he is so idle that he would rather let his heel burn
    off at the fire than draw back his leg.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The third son claims he would let himself be hanged rather than raise a knife
    to cut the rope, and the father awards him the kingdom.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Twelve servants who have been idle all day lie on the grass at night and boast
    of their idleness.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The first servant describes eating and drinking much, resting near midday,
    ignoring the master’s first call, and responding slowly to a second call.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The second servant says he neglects horse care, may leave the bit in the horse’s
