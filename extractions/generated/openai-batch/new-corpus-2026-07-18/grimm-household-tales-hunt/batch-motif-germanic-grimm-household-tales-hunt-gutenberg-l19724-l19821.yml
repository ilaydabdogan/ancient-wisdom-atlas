  quote: ''
  summary: The supplied passage contains the close of an enchanter episode in which
    a bride mistakes a blue flax field for a swollen stream and is publicly ridiculed;
    the tale of an old beggar-woman whose rags catch fire while a boy fails to extinguish
    them; the tale of a king who awards succession to the son claiming the greatest
    laziness; and the beginning of a related tale in which idle servants boast of
    avoiding work.
  language: English
