canonical_text:
  quote: ''
  summary: Hans exchanges a heavy lump of gold for a horse; after being thrown from
    the horse, he exchanges it for a cow. When the cow gives no milk and kicks him,
    a butcher offers a pig for the cow. A lad carrying a goose then warns Hans that
    the pig may be stolen, and Hans trades the pig for the goose.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hans says the lump he carries is gold, but it hurts his shoulder and prevents
    him from holding his head straight; the rider proposes exchanging a horse for
    it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hans rides the horse, urges it faster with the call taught by the rider, and
    is thrown into a ditch; a countryman driving a cow stops the horse.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hans says he prefers the countryman’s cow because one can walk behind it and
    have milk, butter, and cheese; he exchanges the horse for the cow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hans eats at an inn, continues toward his mother’s village, becomes thirsty
    on a hot moor, ties the cow to a withered tree, and tries to milk it into his
    leather cap.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The cow gives no milk and kicks Hans on the head; a butcher helps him up,
    gives him a drink, and says the cow is old and fit only for ploughing or slaughter.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: Hans praises the value of a young pig for meat and sausages; the butcher exchanges
    the pig for the cow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A lad carrying a fat white goose says he is taking it to a christening-feast.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The lad warns that a pig has been stolen from the mayor’s sty and that Hans
    may be imprisoned if caught with it; Hans, terrified, asks the lad to take the
    pig and leave the goose.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The lad takes the pig’s cord and drives the pig quickly away along a by-path.
  category: action
  evidence_refs:
  - ev:7
