canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which a separated husband and wife
    regain human form after waters recede, live for years as shepherds among strangers,
    and recognize each other through a sorrowful flute melody under the full moon.
    It then begins “The Little Folks’ Presents”: a tailor and a goldsmith encounter
    little people dancing on a moonlit hill. An old man shaves them, directs them
    to take coals, and the coals become gold overnight. The contented tailor refuses
    a second quest for treasure, while the greedy goldsmith returns with bags for
    more.'
  language: English
  quote_policy: summarized
