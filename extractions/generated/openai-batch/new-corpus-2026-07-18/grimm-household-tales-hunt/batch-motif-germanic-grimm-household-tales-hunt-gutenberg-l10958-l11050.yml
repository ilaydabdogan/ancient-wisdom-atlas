canonical_text:
  quote: ''
  summary: 'The passage contains an animal tale in which a fox warns a wolf about
    human strength and arranges for him to meet a hunter; the wolf attacks and is
    wounded by the hunter''s gun and hanger. It then gives the tale of the wolf and
    the fox: the stronger wolf compels the fox to obtain food. In three food raids
    involving a lamb, pancakes, and salted meat in a cellar, the fox obtains or finds
    food while the wolf''s greed leads to beatings and finally death when he becomes
    too fat to escape through the hole. The fox escapes and is glad to be rid of him.'
  language: English
  quote_policy: summarized
