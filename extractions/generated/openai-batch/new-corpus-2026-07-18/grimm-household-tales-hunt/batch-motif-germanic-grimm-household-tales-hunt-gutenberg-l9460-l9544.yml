canonical_text:
  quote: "“My master, who killed the dragon, is here”"
  summary: A huntsman, staying with a host, sends a sequence of animal companions
    to the royal palace to obtain the same foods and wine served to the King. The
    fox, wolf, bear, and lion are recognized by the King’s daughter and receive royal
    provisions through palace servants. The lion tests several wines until he reaches
    the King’s private wine. The huntsman dines with his animals and is glad because
    the King’s daughter still loves him.
  language: English
  quote_policy: quoted
