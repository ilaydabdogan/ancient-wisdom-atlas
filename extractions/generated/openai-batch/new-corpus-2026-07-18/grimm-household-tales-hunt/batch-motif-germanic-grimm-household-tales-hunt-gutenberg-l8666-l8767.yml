canonical_text:
  quote: ''
  summary: A king’s son, aided by a faithful fox, obtains the Golden Horse, the Golden
    Bird, and the maiden from the Golden Castle. After refusing the fox’s first request
    to be killed and dismembered, he ignores the fox’s warnings, saves his wicked
    brothers from hanging, and is betrayed by them at a well. The fox rescues him,
    he returns in disguise, is recognized as the true bridegroom, and becomes heir
    to the king. Later he fulfills the fox’s request, and the fox is transformed into
    the maiden’s brother, freed from an enchantment.
  language: English
  quote_policy: summarized
