canonical_text:
  quote: ''
  summary: A blinded King's son is twice led toward a precipice by a giant who wants
    his ring, but his faithful lion saves him and causes the giant's death. The lion
    then leads him to a tree and clear brook where water restores his sight after
    he observes a bird healed by bathing there. He arrives at an enchanted castle,
    where a black maiden asks him to endure three silent, fearless nights of torment
    in the great hall. Devils and hob-goblins torment him each night, but he remains
    silent; at dawn the maiden heals him with water of life and progressively becomes
    white. After the third night he swings his sword three times over the stairs,
    releasing the castle from enchantment; the maiden is revealed as a rich King's
    daughter, and they marry.
  language: English
  quote_policy: summarized
