canonical_text:
  quote: ''
  summary: A cook exploits a magically wishing king's son, urging him to wish for
    a palace and a girl companion. Fearing exposure, the cook orders the girl to kill
    the boy and bring his heart and tongue. She substitutes a hind's heart and tongue
    instead. The boy exposes the cook and transforms him into a black poodle with
    a gold collar, forcing him to eat burning coals. The boy changes the girl into
    a beautiful pink and returns home, where he reaches his imprisoned mother by a
    wished-for ladder, then presents himself to his father as a strange huntsman and
    magically summons deer for the royal table.
  language: English
  quote_policy: summarized
