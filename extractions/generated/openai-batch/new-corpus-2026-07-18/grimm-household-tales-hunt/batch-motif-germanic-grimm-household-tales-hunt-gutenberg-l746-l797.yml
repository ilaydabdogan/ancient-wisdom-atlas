canonical_text:
  quote: "“If I could but shudder! If I could but shudder!”"
  summary: A youth travels with fifty thalers, repeatedly wishing to learn how to
    shudder. A man directs him to spend the night beneath a gallows where seven men
    hang. The youth tries to warm the dead men by a fire, then hangs them up again
    when their clothes burn, and reports in the morning that he still has not learned
    to shudder. He continues on, meets a waggoner, and arrives at an inn where the
    host says there may be an opportunity to shudder, while the hostess warns that
    many inquisitive people have already lost their lives there.
  language: English
  quote_policy: quoted
