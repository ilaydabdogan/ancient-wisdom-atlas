canonical_text:
  quote: ''
  summary: 'The passage closes the Briar-rose episode: a king’s son reaches the castle
    when the hundred years have passed, the thorn-hedge opens as flowers, he finds
    Briar-rose asleep in a tower, kisses her, and the princess, court, animals, and
    household activity awaken; the prince and Briar-rose marry. The passage then begins
    Fundevogel: a forester rescues a child whom a bird of prey has carried to a high
    tree, raises him with Lina, and the two children flee after Lina learns that old
    Sanna plans to boil Fundevogel.'
