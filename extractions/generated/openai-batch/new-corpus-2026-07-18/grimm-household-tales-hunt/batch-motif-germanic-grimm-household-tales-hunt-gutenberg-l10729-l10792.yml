canonical_text:
  quote: ''
  summary: Three brothers profit by selling ordinary animals or tools to people who
    treat them as rare wonders. A cock is sold for an ass-load of gold, a scythe is
    sold on an island where grain had been shot down with cannon, and a cat is sold
    on an island overrun by mice. After the cat kills mice in the royal palace, her
    mewing frightens the king and his people; a messenger interprets the mew as refusal
    to leave, and cannon fire destroys the palace while the cat escapes.
  language: English
  quote_policy: summarized
