canonical_text:
  quote: ''
  summary: 'The passage concludes a tale in which the little tailor''s low birth is
    exposed, a royal plot is made to bind and exile him, and he prevents it by pretending
    to sleep and frightening the servants with boasts of earlier feats. It then begins
    ''Cinderella'': the heroine''s dying mother urges piety and promises heavenly
    nearness; after the father remarries, the stepfamily humiliates Cinderella and
    forces her into kitchen labor. Cinderella receives a hazel branch, plants it on
    her mother''s grave, waters it with tears, and a tree grows where a white bird
    grants wishes. A royal three-day festival is announced for the prince to choose
    a bride; Cinderella is denied attendance unless she sorts lentils from ashes,
    and she calls birds to help.'
  language: English
  quote_policy: summarized
