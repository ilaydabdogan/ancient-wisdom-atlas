canonical_text:
  quote: ''
  summary: A drummer obtains a wish-transport saddle by tricking two disputants and
    reaches the glass-mountain. There he finds an old stone house, a pond, and a dark
    forest. An old woman grants him lodging and food in exchange for three services,
    then imposes difficult tasks. A maiden from the house repeatedly brings him food,
    has him sleep with his head in her lap, and uses a wishing-ring to complete the
    pond-and-fish task and the forest-cutting task. She instructs him to answer the
    old woman by throwing an isolated fish in her face and later by using a remaining
    bough against her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two men struggle over a saddle lying on the ground, and one explains that
    whoever sits on it and wishes to be anywhere is transported there instantly.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The drummer proposes a race to a white rod as a way to decide the saddle dispute,
    then mounts the saddle himself and wishes to be on the glass-mountain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the top of the mountain there is a plain with an old stone house, a large
    fish-pond in front, and a dark forest behind; the place is quiet except for wind
    and nearby clouds.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old woman with a brown face, red eyes, spectacles, and a long nose opens
    the house and offers entrance, food, and a bed if the drummer performs three services.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first service is to empty the pond with a thimble before night and arrange
    all fishes by kind and size; the drummer works in vain and gives up at noon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A beautiful maiden brings food, tells the drummer to sleep with his head in
    her lap, turns a wishing-ring, and commands the water and fishes so that the pond
    task is completed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The maiden warns that one fish lies alone and tells the drummer to throw it
    in the old woman's face if questioned; in the evening he does so, while the old
    woman remains silent and looks at him maliciously.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The second service is to hew down the whole forest, split the wood, and pile
    it by evening; the old woman provides a lead axe and tin mallet and wedges, which
    fail when used.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The maiden again has the drummer sleep, turns the wishing-ring, and the forest
    falls, splits, and arranges itself as if unseen giants were doing the work.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the second task is completed, one bough remains; the maiden instructs
    the drummer to strike the old woman with it if she asks, and the old woman returns
    and asks about the remaining bough.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
