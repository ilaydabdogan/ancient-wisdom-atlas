canonical_text:
  quote: ''
  summary: The king remarries a proud queen who consults a truth-speaking looking-glass
    about beauty. When the mirror names Snow-white as more beautiful, the queen orders
    a huntsman to take Snow-white into the forest, kill her, and return her heart.
    The huntsman spares Snow-white, substitutes a boar's heart, and the queen eats
    it believing it is Snow-white's. Snow-white flees through the forest, finds a
    small cottage with seven sets of household objects and beds, eats and drinks small
    portions, prays, and sleeps. Seven dwarfs return from mining in the mountains,
    discover her, let her sleep, and later agree she may stay if she keeps house.
    They warn her not to let anyone in because her stepmother will learn where she
    is.
  language: English
  quote_policy: summarized
