canonical_text:
  quote: "“And now I wish myself inside my knapsack,”"
  summary: Brother Lustig spends a night in a haunted castle, traps nine devils in
    his knapsack, has the knapsack beaten at a smithy, later travels toward the afterlife,
    is refused entrance to Hell, and gains entry to Heaven by wishing himself into
    the knapsack after St. Peter takes it inside.
  language: English
  quote_policy: quoted
