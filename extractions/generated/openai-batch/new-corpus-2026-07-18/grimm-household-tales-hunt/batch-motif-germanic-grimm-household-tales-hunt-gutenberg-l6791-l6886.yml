canonical_text:
  quote: ''
  summary: A jealous second wife murders her stepson with a chest lid while tempting
    him with an apple, hides the killing, causes her daughter Marlinchen to think
    she knocked off his head, cooks the boy into black puddings, and serves them to
    the father. Marlinchen gathers the bones in a silk handkerchief and takes them
    to the juniper-tree, where mist and fire appear and a beautiful singing bird emerges,
    recounting the killing, eating, and gathering of bones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The household contains a father, his second wife, the second wife's daughter,
    and the first wife's little son, who is described as red as blood and white as
    snow.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman loves her daughter, views the boy as an obstacle to her daughter's
    fortune, and repeatedly abuses him after the Evil One fills her mind.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman uses an apple and a chest with a heavy lid and sharp iron lock to
    lure the boy into stooping inside, then shuts the lid so that his head comes off
    among the apples.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman sets the boy's head back on his neck, hides the injury with a white
    handkerchief, seats him by the door, and puts an apple in his hand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Marlinchen finds her brother pale and silent with an apple, strikes him as
    instructed by her mother, and his head falls down, leading Marlinchen to believe
    she knocked it off.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mother tells Marlinchen to keep quiet, chops the boy in pieces, cooks
    him into black puddings, and Marlinchen's tears fall into the pan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The father asks where his son is; the mother says he has gone away to a relative,
    while serving the father the black puddings made from the boy.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The father eats all of the black puddings and throws the bones under the table.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Marlinchen gathers the bones from beneath the table, ties them in her best
    silk handkerchief, carries them outside, and weeps tears of blood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The juniper-tree moves as if rejoicing, mist rises, fire appears in the mist,
    and a beautiful bird flies out singing; afterward the bones and handkerchief are
    gone.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The bird lights on a goldsmith's house and sings that its mother killed it,
    its father ate it, and its sister Marlinchen gathered its bones and laid them
    beneath the juniper-tree.
  category: speech
  evidence_refs:
  - ev:7
