canonical_text:
  quote: ''
  summary: 'The passage closes one tale by showing Hans washed, richly clothed, given
    the seventh horse, taken away by the King’s daughter, and married after his silver-built
    house appears as a castle of silver and gold. It then begins ''The Two Travellers'':
    a merry tailor and an ill-tempered shoemaker meet, reconcile over a drink, travel
    together, experience unequal luck in towns, and enter a silent forest after choosing
    different amounts of bread for an uncertain forked path.'
  language: English
  quote_policy: summarized
