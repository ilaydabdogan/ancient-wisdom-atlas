canonical_text:
  quote: ''
  summary: A king's son seeks the way to heaven, is told to live in poverty and humility
    for seven years, returns unrecognized, suffers neglect under the palace stairs,
    receives sacramental attention, dies holding a rose and a lily, and flowers grow
    on his grave. A second legend tells of a rich sister refusing bread to her starving
    widowed sister; a loaf then bleeds when cut, and the widow and her children die
    after prayer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king's son goes out into the world sad and asks a poor gray-haired man how
    to get to heaven.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The poor gray-haired man answers that the way to heaven is by poverty and
    humility, including ragged clothes, seven years of wandering, no money, and asking
    compassionate people for bread when hungry.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king's son removes his magnificent coat, puts on the beggar's garment,
    wanders through the world, suffers misery, takes little food, and prays to be
    taken into heaven.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After seven years the king's son returns to his father's palace, but servants
    and the king's children do not believe or recognize him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king's son writes to his mother describing his misery without saying that
    he is her son, and the queen assigns him a place under the stairs with daily food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: One servant keeps the good food or gives it to dogs and brings the beggar
    only water, while another servant honestly brings what was sent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: As the beggar weakens, he asks to receive the last sacrament; during the elevation
    of the host, bells in the town and neighborhood begin to ring.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After mass the priest finds the poor man dead under the stairs, with a rose
    in one hand, a lily in the other, and a paper containing his history beside him.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: After burial, a rose grows on one side of the grave and a lily on the other.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A poor widowed sister with five children asks her rich childless sister for
    a mouthful of bread because she and her children are suffering hunger.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The rich sister says she has nothing in the house and drives the poor sister
    away with harsh words.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: When the rich sister's husband cuts into a loaf of bread, red blood flows
    out.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The husband goes to help the widow and finds her praying with the two youngest
    children in her arms and the three eldest children lying dead.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: The widow refuses earthly food, says God has already satisfied the hunger
