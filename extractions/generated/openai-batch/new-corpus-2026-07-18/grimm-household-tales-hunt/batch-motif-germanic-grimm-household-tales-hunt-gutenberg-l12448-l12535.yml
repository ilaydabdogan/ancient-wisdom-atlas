canonical_text:
  quote: ''
  summary: A youngest daughter fulfills her father's promise by going to a lion who
    is an enchanted prince. After their marriage, a ray of candlelight transforms
    him into a white dove for seven years. She follows his blood-and-feather trail
    until it vanishes, then seeks help from the sun, moon, and winds. The south wind
    locates him at the Red Sea, where he has become a lion again and fights a dragon
    who is an enchanted princess; the night wind gives instructions involving an eleventh
    reed, a griffin, and a nut that will become a tree in the sea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The father returns home with a singing, soaring lark, and his youngest daughter
    is joyful when she sees it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father says he obtained the bird by promising his youngest daughter to
    a savage lion and fears the lion will tear and devour her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The daughter says the promise must be fulfilled, takes leave the next morning,
    and goes fearlessly into the forest.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: 'The lion is an enchanted prince: by day he and his people are lions, and
    by night they return to human form.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The daughter is kindly received at the castle, marries the prince at night,
    and the couple live awake at night and asleep during the day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: For her eldest sister's wedding, the woman visits her father's house accompanied
    by lions; her family had believed she was dead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: For the second sister's wedding, the woman wants her lion husband to accompany
    her, and they also take their little child.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The lion warns that a ray from a burning candle would transform him into a
    dove for seven years.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A protective chamber is built, but a crack in the green-wood door lets a hair-breadth
    ray from candles and torches fall on the king's son, transforming him into a white
    dove.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The white dove says that every seventh step will leave a drop of red blood
    and a white feather to show the way, and that following the trace can release
    him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The woman follows the trace through the wide world without resting until nearly
    seven years have passed; then the feather and blood signs stop and the dove disappears.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: The woman asks the sun, moon, and night wind whether they have seen the white
    dove; the sun gives a casket, the moon gives an egg, and the night wind asks other
    winds.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: The south wind reports that the white dove has flown to the Red Sea, become
    a lion again, and is fighting a dragon who is an enchanted princess.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The night wind instructs the woman to break off the eleventh reed on the right
    bank of the Red Sea and strike the dragon with it, after which the lion can subdue
    the dragon and both will regain human form.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The night wind also says a griffin can carry the woman and her beloved over
    the sea, but she must drop a nut at the sea's center so a nut-tree grows from
    the water and gives the griffin a resting place.
  category: speech
  evidence_refs:
  - ev:10
