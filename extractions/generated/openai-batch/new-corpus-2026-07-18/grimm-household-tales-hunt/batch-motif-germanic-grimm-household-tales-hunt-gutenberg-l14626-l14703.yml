canonical_text:
  quote: ''
  summary: A bear hears a willow-wren identified as the King of birds, visits the
    nest, and insults the young wrens and their dwelling. The young wrens refuse food
    until their status is vindicated. The willow-wren king declares war on the bear;
    four-footed animals assemble against birds and flying insects. A gnat spies on
    the enemy and learns that the fox's tail will be used as the battle signal. A
    hornet stings the fox under the tail, causing the signal to fail and the four-footed
    animals to flee. The bear is then forced to apologize to the young wrens, who
    finally eat and celebrate.
  language: English
  quote_policy: summarized
