canonical_text:
  quote: ''
  summary: Frederick leaves Catherine to prepare food and drink. Catherine loses a
    sausage to the dog, lets the beer cask empty into the cellar, and spreads flour
    over the spilled beer. Frederick then hides their gold under a cow's manger while
    calling it counters. Catherine tells pedlars where the counters are; they take
    the gold and leave earthenware, which she damages and displays as decoration.
  language: English
  quote_policy: summarized
