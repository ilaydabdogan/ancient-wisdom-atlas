canonical_text:
  quote: ''
  summary: 'A traveling youth repeats context-bound phrases taught to him after each
    encounter. Each phrase proves offensive or inappropriate in the next setting:
    among fishermen, at a gallows, by a knacker’s pit, and beside a cart of people.
    He is beaten repeatedly and finally crawls back to his mother, never traveling
    again.'
