canonical_text:
  quote: ''
  summary: 'Two older sons fail to bring healing apples to the King''s daughter after
    their answers to a little iron man are followed by baskets containing frogs''
    legs and hogs'' bristles. The youngest son Hans, mocked as stupid, answers that
    he carries apples; golden-yellow apples appear and cure the King''s daughter.
    The King withholds the promised marriage and imposes further tasks: first a boat
    faster on dry land than on water, then pasturing a hundred hares. The older sons''
    boat attempt produces wooden bowls, while Hans answers truthfully and completes
    the swift boat.'
  language: English
  quote_policy: summarized
