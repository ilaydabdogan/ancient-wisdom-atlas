canonical_text:
  quote: ''
  summary: 'A youth helps helpless young ravens by killing his horse to feed them.
    In a city he seeks the King''s daughter and faces deadly tasks: recovering a ring
    from the sea, gathering scattered millet, and obtaining an apple from the Tree
    of Life. Previously aided fishes, ants, and ravens repay him by completing these
    tasks. The princess and youth share the Apple of Life and live happily. The next
    tale begins with a straw, a coal, and a bean escaping destruction in a household
    cooking scene and resolving to travel together.'
  language: English
  quote_policy: summarized
