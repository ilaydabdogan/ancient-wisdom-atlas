canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a maiden’s spindle, shuttle,
    and needle move by themselves to guide a prince, weave a carpet, prepare a house,
    and lead to a royal wedding; the tale of a crafty peasant who tricks the Devil
    in a crop-share bargain and takes a treasure; and a brief animal anecdote in which
    puppies are persuaded to eat crumbs and are punished by their mistress.
  language: English
  quote_policy: summarized
