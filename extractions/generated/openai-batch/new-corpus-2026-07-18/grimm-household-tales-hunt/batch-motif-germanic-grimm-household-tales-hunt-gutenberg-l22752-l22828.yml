canonical_text:
  quote: ''
  summary: 'A stepmother sets a girl impossible tasks: emptying a pond with a holed
    spoon and building a castle by evening. A good old woman twice sends the girl
    to sleep and completes the tasks by touch and magical action. The stepmother inspects
    the completed castle, kitchen, and cellar; during the cellar descent a trap-door
    falls, and she is found lifeless below.'
  language: English
  quote_policy: summarized
