canonical_text:
  quote: ''
  summary: 'A queen''s impatient wish changes her young daughter into a raven. The
    bewitched king''s daughter tells a man how to deliver her: he must refuse food
    and drink from an aged woman and remain awake on a heap of tan for three appointed
    afternoon visits. The man repeatedly accepts drink or wine, falls asleep, and
    fails to wake when the raven arrives. On the third failed attempt, the raven leaves
    inexhaustible provisions, a named gold ring, and a letter directing him to the
    golden castle of Stromberg, then departs there.'
  language: English
  quote_policy: summarized
