canonical_text:
  quote: ''
  summary: A miller whose fortunes have declined encounters the Nix of the Mill-pond,
    who offers him restored wealth in exchange for the young thing newly born in his
    house. The miller assumes this means an animal and promises, but learns that his
    wife has given birth to a son. Prosperity returns, while the miller fears the
    Nix’s claim and warns the boy away from water. The boy later becomes a huntsman
    and marries a maiden.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The miller and his wife begin in contentment with money and land, but their
    prosperity decreases until the miller is distressed and nearly loses ownership
    of the mill.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before daybreak the miller goes outside, crosses the mill-dam, hears rippling
    in the pond, and sees a beautiful woman rising out of the water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman is identified as the Nix of the Mill-pond; she calls the miller
    by name and asks why he is sad.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Nix says she will make the miller richer and happier than before if he
    promises to give her the young thing just born in his house.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The miller thinks the promised object must be a puppy or kitten and agrees
    to the Nix’s demand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A maid-servant tells the miller that his wife has given birth to a little
    boy, and the miller realizes that the Nix knew this and had cheated him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The miller tells his wife about the promise and laments that riches and prosperity
    are useless if he must lose his child.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Prosperity returns to the miller’s house: his undertakings succeed, storage
    places seem to fill themselves, and money multiplies.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The miller remains troubled by the bargain and fears that the Nix may rise
    from the mill-pond and remind him of his debt.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The miller forbids the boy to go near the water and warns that if he touches
    it a hand will rise, seize him, and draw him down.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy grows into a youth, becomes an excellent huntsman, enters the lord
    of the village’s service, marries a maiden, and lives happily with her.
  category: sequence
  evidence_refs:
  - ev:7
