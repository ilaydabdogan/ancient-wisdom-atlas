  summary: A cat persuades a mouse to live with her and store a pot of fat beneath
    a church altar for winter. The cat repeatedly lies that she has been asked to
    serve as godmother, secretly eats the fat in three stages, and gives the supposed
    christening names as Top-off, Half-done, and All-gone. When winter comes, the
    mouse discovers the empty pot, accuses the cat, and is swallowed by her.
