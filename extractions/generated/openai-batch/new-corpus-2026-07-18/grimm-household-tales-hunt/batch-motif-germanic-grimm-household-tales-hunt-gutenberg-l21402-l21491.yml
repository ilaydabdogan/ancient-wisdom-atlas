canonical_text:
  quote: ''
  summary: Birds gather to choose a king by contests of height and depth. The eagle
    appears to win the height contest, but a tiny unnamed bird hidden in the eagle’s
    feathers rises higher and claims kingship. When the birds object, the tiny bird
    also wins a depth contest by entering a mouse-hole. The birds imprison him under
    owl guard, but the owl falls asleep and he escapes. The passage explains why the
    owl avoids daylight and hunts mice, why the little bird hides in hedges and is
    mocked as King of the hedges, and why the lark sings at sunrise. A following tale
    begins with fishes seeking a king to impose order, law, and justice, choosing
    by speed through water and aid to the weak.
  language: English
  quote_policy: summarized
