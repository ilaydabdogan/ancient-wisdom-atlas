canonical_text:
  quote: ''
  summary: A fearless king’s son leaves home, displays strength at a giant’s house,
    and is sent to obtain an apple from the tree of life for the giant’s bride. He
    enters a guarded garden, takes the apple through a ring that gives him strength,
    and gains a lion follower. After the giant’s bride demands the ring as proof,
    the giant tries force and deceit, steals the ring during a river bath, loses it
    to the lion, and then ambushes and blinds the king’s son.
  language: English
  quote_policy: summarized
