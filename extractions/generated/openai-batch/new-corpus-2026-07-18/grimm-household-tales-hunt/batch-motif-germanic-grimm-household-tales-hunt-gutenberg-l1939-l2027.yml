canonical_text:
  quote: ''
  summary: A wicked stepmother-witch envies the Queen and arranges her death by a
    deadly heated bath, then substitutes her one-eyed daughter as a false Queen. The
    dead true Queen returns at midnight to nurse her child and care for the roebuck.
    After repeated visits, the King recognizes her; she receives life again by God’s
    grace. The witch and daughter are judged and punished, and the roebuck regains
    human form.
  language: English
  quote_policy: summarized
