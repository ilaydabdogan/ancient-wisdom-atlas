canonical_text:
  quote: ''
  summary: The passage contains a tale of a little brother and sister who fall into
    a well, are captured by a water-nix, perform harsh tasks, and escape by throwing
    objects that become obstructing hills. It then gives the tale titled “The Death
    of the Little Hen,” in which a hen chokes on a nut, the cock’s attempt to fetch
    water is delayed by chained requests, and a funeral procession ends with repeated
    drownings and the cock’s death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A little brother and sister play by a well, fall in, and are taken by a water-nix
    living below.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The water-nix makes the girl spin dirty tangled flax and fetch water with
    a holed bucket, while the boy must hew a tree with a blunt axe; the children receive
    only stone-hard dumplings to eat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The children wait until a Sunday when the nix is at church, run away, and
    are pursued when the nix notices their escape.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The girl throws a brush that becomes a spiked bristle hill, the boy throws
    a comb that becomes a toothed hill, and the girl throws a looking-glass that becomes
    a slippery mirror hill; these barriers delay the nix until the children escape.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The little hen and little cock agree to share any nut-kernel they find, but
    the hen secretly tries to eat a large nut-kernel and begins choking.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The cock seeks water for the choking hen; the water source asks for red silk
    from the bride, and the bride asks for a wreath from a willow before the cock
    receives water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The hen dies before the cock returns with water; animals lament her, and six
    mice build a little carriage to carry her to the grave.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The fox, wolf, bear, stag, lion, and other forest beasts join the funeral
    carriage as passengers at the back.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: At a stream, a straw offers itself as a bridge but slips and the six mice
    drown; a coal offers itself, touches water, is extinguished, and dies; a stone
    then helps the cock cross with the dead hen.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: When the cock tries to bring the remaining passengers across, the overloaded
    carriage falls back into the water and they drown; the cock buries the hen, makes
    a mound, frets on it, and dies.
  category: sequence
  evidence_refs:
  - ev:10
