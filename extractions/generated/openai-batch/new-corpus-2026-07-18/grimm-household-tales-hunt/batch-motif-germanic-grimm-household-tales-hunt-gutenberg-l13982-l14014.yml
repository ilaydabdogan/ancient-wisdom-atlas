canonical_text:
  quote: ''
  summary: A dying king has three distressed sons. An old man tells them that only
    the water of life can cure him, though it is hard to find. The eldest son receives
    permission to seek it, hoping to become favored and inherit the kingdom, but insults
    a dwarf on the road and is trapped in a narrowing ravine. The second son then
    sets out with similar ambition, also insults the dwarf, and is likewise bewitched
    and trapped.
  language: English
  quote_policy: summarized
