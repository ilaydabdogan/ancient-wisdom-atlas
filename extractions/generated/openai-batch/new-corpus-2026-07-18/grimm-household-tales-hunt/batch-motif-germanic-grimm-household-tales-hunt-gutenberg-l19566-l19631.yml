canonical_text:
  quote: "“here I sit aloft in the Sack of Wisdom”"
  summary: A king rewards a poor brother lavishly for a turnip. The rich brother tries
    to gain a greater reward, receives the turnip instead, and plots to kill his brother.
    The hired murderers abandon the intended victim in a sack hanging from a tree
    when a singing rider approaches. The trapped man convinces a travelling student
    that the sack grants wisdom, has the student lower and untie it, then puts the
    student into the sack, rides away on the student’s horse, and later sends someone
    to release him.
  language: English
  quote_policy: quoted
