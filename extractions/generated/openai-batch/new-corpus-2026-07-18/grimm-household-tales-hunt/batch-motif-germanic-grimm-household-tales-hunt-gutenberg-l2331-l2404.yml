canonical_text:
  quote: ''
  summary: 'The passage closes one tale with a Queen returning in duck form, being
    restored to life by the King’s three sword swings, and the old woman and her daughter
    being punished in a nail-studded barrel. It then begins “The Three Spinners”:
    an idle girl is misrepresented by her mother as an excessive spinner, taken by
    the Queen to spin three rooms of flax for the promise of marriage to the Queen’s
    eldest son, and helped by three strange women who demand wedding recognition as
    her aunts.'
  language: English
  quote_policy: summarized
