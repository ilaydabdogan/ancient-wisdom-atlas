canonical_text:
  quote: ''
  summary: A girl flees into the forest to seek her brothers and finds six swans who
    shed their skins and are revealed as her brothers. They explain that they can
    be human only briefly each evening and can be freed only if she remains silent
    and does not laugh for six years while sewing six shirts of starwort. She undertakes
    the task, is discovered in a tree by huntsmen, and is brought to a king who marries
    her despite her silence. The king's mother steals the queen's newborn children
    and accuses her of being a man-eater; after the third accusation, the silent queen
    is sentenced to death by fire.
  language: English
  quote_policy: summarized
