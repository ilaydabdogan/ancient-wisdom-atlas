canonical_text:
  quote: ''
  summary: 'The passage contains three short legends: a bereaved old woman sees her
    dead relatives in church and learns her sons were spared worse fates by early
    death; a poor peasant-boy follows a priest’s instruction literally, stays in a
    church he thinks is heaven, feeds a sacred wooden image, and dies after being
    invited to an eternal wedding; Our Lady hides behind a hazel-bush from an adder
    and declares the hazel-branch protective against snakes and creeping things.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman in a large town has lost her husband, children, relations, and
    last friend, and in grief blames God for the loss of her sons.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: After hearing early-prayer bells, the old woman goes to church and finds it
    dimly lit, crowded, and occupied by her dead relations in old-fashioned garments
    with pale faces.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dead relations do not speak or sing, while a soft humming and whispering
    is heard throughout the church.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A dead aunt directs the old woman to look beside the altar, where she sees
    her two children, one on a gallows and the other bound to a wheel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The aunt says these would have been the sons’ fates if they had lived, and
    says God had taken them to himself as innocent children.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old woman returns home trembling, thanks God on her knees, and dies on
    the third day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A poor peasant-boy hears that whoever wants to enter the kingdom of heaven
    must always go straight onward, so he walks straight over hill and valley into
    a town and church.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The boy thinks the church is heaven, refuses to leave, and is allowed by the
    priest to remain inside.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The boy sees people pray to a wooden image of Our Lady with the blessed child
    Jesus, addresses it as God, and gives it half his dinner every day.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The image begins to enjoy the food and grows larger, stout, and strong; the
    priest witnesses the boy sharing food with the Virgin Mary and her accepting it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the boy has been ill for eight days, the image answers him and says
    he alone will go with it to the wedding next Sunday.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The priest gives the boy holy communion; when the host comes to him, the boy
    falls down dead and is at the eternal wedding.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Christ-child sleeps in his cradle while his mother goes into the wood
    to fetch strawberries for him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: An adder springs from the grass as Our Lady stoops to gather a strawberry,
    and the adder darts after her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Our Lady hides behind a hazel-bush until the adder creeps away, then gathers
    strawberries and returns home.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:16
  text: Our Lady declares that because the hazel-bush protected her, a green hazel-branch
    will protect others against adders, snakes, and creeping things.
  category: speech
  evidence_refs:
  - ev:8
