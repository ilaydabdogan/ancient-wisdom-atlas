canonical_text:
  quote: ''
  summary: The passage contains the tale of a father whose angry wish turns his seven
    sons into ravens after they fail to bring baptismal water for their newborn sister.
    When grown, the sister learns of them, departs with a few provisions, travels
    to the end of the world, encounters the sun, moon, and stars, receives and loses
    a key-like drumstick, sacrifices a finger to enter the Glass mountain, identifies
    herself by a family ring, and restores the ravens to human form. The passage then
    begins the next tale, introducing Little Red-Cap, her red velvet cap, and her
    mother’s instruction to take cake and wine to her ill grandmother while staying
    on the path.
  language: English
  quote_policy: summarized
