canonical_text:
  quote: ''
  summary: A girl awakens mute on earth in a wilderness, lives in a hollow tree, is
    found by a hunting king, taken to his castle, and married. As queen, she repeatedly
    denies opening a forbidden door when the Virgin Mary asks her to confess; Mary
    takes each of her three children. Accused as a man-eater and condemned to burning,
    the queen repents and confesses; rain extinguishes the fire, Mary returns the
    children, restores her speech, and grants happiness.
  language: English
  quote_policy: summarized
