canonical_text:
  quote: ''
  summary: 'The passage gives three animal tales: a fish race in which the herring
    wins and the envious sole is punished with a sideways mouth; a cow-herd''s explanation
    that the bittern and hoopoe were once shepherds whose immoderate pasture choices
    ruined their cattle and whose calls persist as bird cries; and a town''s panic
    over a horned owl in a barn, which is mistaken for a monster and approached by
    armed but frightened townsmen.'
  language: English
  quote_policy: summarized
