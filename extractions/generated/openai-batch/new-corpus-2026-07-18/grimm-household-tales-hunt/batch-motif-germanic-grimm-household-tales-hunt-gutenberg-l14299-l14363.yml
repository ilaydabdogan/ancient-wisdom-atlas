canonical_text:
  quote: ''
  summary: 'A scholar releases a spirit from a bottle after extracting a promise of
    reward. The spirit gives him a two-ended plaster-like object: one end heals wounds,
    and the other turns steel or iron into silver. The scholar tests the healing power
    on a tree, later changes an axe head into silver, sells the silver axe through
    a goldsmith, enriches his father, returns to school, and becomes a famous doctor
    through the plaster’s healing power.'
  language: English
  quote_policy: summarized
