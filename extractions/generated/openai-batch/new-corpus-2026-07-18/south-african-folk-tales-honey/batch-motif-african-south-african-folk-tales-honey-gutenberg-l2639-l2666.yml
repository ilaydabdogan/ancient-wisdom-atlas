canonical_text:
  quote: ''
  summary: After the Woman's heart comes from the fire, the Mother places it in a
    calabash. Lion speaks from the fire and says he has eaten the Mother's daughter.
    The Mother puts first milk from cows with calves into the calabash, which grows
    as the girl grows again inside it. Later, while the Mother is away, the girl comes
    out, cleans the hut, tells Hare to claim the work, and hides. The Mother notices
    the work resembles her daughter's, discovers the calabash empty, finds her daughter,
    embraces her, and the girl remains with her Mother unmarried.
  language: English
