canonical_text:
  quote: ''
  summary: Wild animals assemble at Lion's place. While Lion sleeps, Jackal persuades
    Little Fox to make a rope from ostrich sinews and use it to tie Lion's tail to
    a shrub. Lion wakes, calls the animals, and asks through a repeated conjuring
    formula who tied him. The animals deny it, but Little Fox admits it. Lion breaks
    the rope and chases Little Fox, but Little Fox outruns him.
