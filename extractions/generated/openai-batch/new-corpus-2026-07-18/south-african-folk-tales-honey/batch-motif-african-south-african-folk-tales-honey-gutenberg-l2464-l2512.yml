canonical_text:
  quote: ''
  summary: Lion quarrels with Gurikhoisip over going to the rain-field. Lion's mother
    warns him against the man with weapons, white dogs, and a tiger-tail tuft, but
    Lion ignores her advice and ambushes Gurikhoisip at Aroxaams. Gurikhoisip's dogs
    surround Lion and Gurikhoisip spears him. Lion is released so that he may be taught
    by his mother; weakened, he returns home lamenting, and his mother repeats the
    warning she had given.
  language: English
  quote_policy: summarized
