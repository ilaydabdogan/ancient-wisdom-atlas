  summary: Three created nations are appointed to appear before the Teco for apportionment.
    The Hottentots follow a honey bird and are denounced to live without stock; the
    Kaffirs shout over cattle and are denounced to possess only cattle; the Whites
    wait patiently and receive cattle, horses, sheep, and other property.
