canonical_text:
  quote: ''
  summary: The passage closes a Jackal episode with Mrs. Tiger finding Jackal's former
    house deserted and showing signs of Snake's residence. In the Tink-tinkje tale,
    the birds assemble to choose a king, reject several candidates, and agree that
    the highest flyer will rule. Vulture flies upward for days, but the small Tink-tinkje
    hides in Vulture's feathers and repeatedly claims to be higher. The angry birds
    pursue Tink-tinkje to a mouse hole, appoint Owl as guard, but Owl falls asleep
    in the warm sun and Tink-tinkje escapes to a tree. White-crow then declares silence,
    and the tale explains that White-crow has not spoken since.
  language: English
  quote_policy: summarized
