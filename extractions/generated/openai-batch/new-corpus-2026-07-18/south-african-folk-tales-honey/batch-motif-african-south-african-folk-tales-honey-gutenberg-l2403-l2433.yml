canonical_text:
  quote: ''
  summary: A footnote says that Lion came close upon Baboon while Baboon was doing
    an unspecified action. In the tale titled "The Zebra Stallion," Baboons disturb
    Zebra Mares at water. A foal is born and helped to grow by the mares' suckling.
    As a grown stallion, he brings the mares to water, confronts a Baboon, reveals
    a milky mouth, and sees gum in the Baboon's mouth. The Baboon licks milk from
    the Stallion's tongue; the Stallion angrily presses him onto a hot flat rock,
    explaining the bald place on the Baboon's back. The Baboon laments that the gum-eater
    has been outdone by the milk-eater.
  language: English
  quote_policy: summarized
