canonical_text:
  quote: ''
  summary: The hare asks a bushbuck whether he may take a piece of meat. After the
    bushbuck refuses, the hare takes and eats all the meat, whistles in a particular
    way, and a hailstorm kills the bushbuck. The hare makes a mantle from the bushbuck's
    skin. He then goes into the forest to get weapons; monkeys throw leaves on him,
    come down when called, and are killed by him.
