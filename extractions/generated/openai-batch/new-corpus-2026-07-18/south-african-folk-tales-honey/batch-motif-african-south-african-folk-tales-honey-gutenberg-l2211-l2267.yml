canonical_text:
  quote: ''
  summary: In the tale of Elephant and Tortoise, Elephant disputes with Rain, seeks
    rain through lot-casting, claims the last remaining lagoon, and leaves Tortoise
    to guard it. Many animals ask for water and are refused until Lion beats Tortoise
    and drinks. Elephant later swallows Tortoise, who kills Elephant from inside his
    body and escapes.
  language: English
  quote_policy: summarized
