canonical_text:
  quote: ''
  summary: Lion leaves a dead eland on a high bank in Jackal's care while going to
    drink. Jackal removes a stepping stone, eats the eland with his wife, and repeatedly
    offers Lion rotten ropes while pretending aloud that they are strong. Each time
    Lion nears the top, Jackal breaks or cuts the rope so Lion falls. Jackal beats
    a dry hide to feign blaming his wife, then leaves with his wife after Lion is
    fatally hurt.
  language: English
  quote_policy: summarized
