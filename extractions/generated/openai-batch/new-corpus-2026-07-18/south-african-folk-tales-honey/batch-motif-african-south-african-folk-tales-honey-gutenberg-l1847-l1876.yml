canonical_text:
  quote: ''
  summary: Jackal marries Hyena, steals and slaughters a cow belonging to the ants
    for the wedding, covers his bride with the cowskin, and prepares a raised cooking
    arrangement. Lion comes and is twice pulled upward by a thong supplied by Jackal's
    daughter; first Jackal cuts the thong and makes Lion fall, then he places a hot
    boiled piece of quartz into Lion's mouth, killing him. The ants pursue the stolen
    cow; Jackal flees, and the ants beat Hyena in the cowskin until she realizes they
    are not Jackal and escapes.
  language: English
  quote_policy: summarized
