canonical_text:
  quote: ''
  summary: During a drought, Lion calls animals to make a dam. Jackal refuses to work
    but uses and dirties the water. Baboon is deceived while guarding it, Tortoise
    captures Jackal with a sticky trap, and Jackal later escapes execution and deceives
    Lion under a rock.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A drought occurs, and Lion summons animals to plan how to retain rainwater.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Baboon, Leopard, Hyena, Jackal, Hare, and Mountain Tortoise attend Lion's
    summons.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The animals agree to scratch a large water-holding hole; Jackal does not work
    and says he will not scratch off his nails making water holes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After rain fills the dam, Jackal drinks first, fills his clay pot, and swims
    in the remaining water to make it muddy and dirty.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Lion orders Baboon to guard the water with a knobkirrie, and Jackal uses a
    pretended pot of honey to tempt him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Baboon gives up his knobkirrie and allows Jackal to bind him in exchange for
    the promised honey.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Jackal drinks, fills his pot, swims, mocks Baboon, says he has no honey, and
    strikes him with Baboon's own knobkirrie.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The animals find Baboon bound, and Lion has Baboon punished and denounced
    as a fool.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Tortoise proposes being coated with sticky black beehive substance and placed
    at the dam entrance so Jackal will step on him and stick fast.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Jackal steps on what he thinks is a black stepping-stone, becomes stuck, threatens
    Tortoise, bites him, and becomes fixed by both head and feet.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Tortoise carries Jackal up the bank, and the other animals praise Tortoise's
    successful capture.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:12
  text: Lion condemns Jackal to death and appoints Hyena to execute the sentence.
  category: action
  evidence_refs:
  - ev:12
