  text: Lion and the woman chase each other around a shrub; Lion asks to wear her
    beads and arm-rings and then refuses to return them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Lion and the woman alternately fall down, jump on each other, and speak a
    release formula; Lion ultimately refuses the formula and eats the woman.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Lion leaves the woman’s skin whole, puts on the skin with her dress and ornaments,
    looks like a woman, and goes to her kraal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The counterfeit woman refuses to pour milk for the little sister, later shares
