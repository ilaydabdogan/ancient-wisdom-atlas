canonical_text:
  quote: ''
  summary: A woman gathering wild food is separated from other women, quarrels with
    Hare over water, and is pursued by Lion. After a contest around a shrub, Lion
    eats her, keeps her skin whole, wears it with her dress and ornaments, and returns
    to her kraal as a counterfeit woman. The household notices abnormal behavior with
    milk, blood, cows, and visible Lion hair; they silently dismantle the hut around
    the sleeping Lion and set grass on fire over him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women go out to seek roots, herbs, and other wild food; the woman with sweet
    food is told to throw it away and gather more, and then cannot find the others.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the river, Hare refuses the woman water from a cup reserved for Hare and
    his uncle Lion; the woman snatches the cup and drinks.
