canonical_text:
  quote: ''
  summary: During a drought, Crocodile, foreman of the water creatures, plans to move
    the water animals to another river. After Otter scouts the destination, Crocodile
    sends Tortoise and Alligator to negotiate with Lion. Lion, Jackal, Wolf, Baboon,
    and other veldt animals meet Crocodile under a willow tree. Crocodile proposes
    peace and asks for safe escort past the Boer’s farm to deeper pools, offering
    reciprocal safety at water and relief from attacks by Elephant. Jackal is skeptical,
    Baboon recommends a written agreement, Wolf supports the pact, and Lion agrees.
    A document is drawn up, messengers summon the water animals, and Lion raises an
    escort before midnight.
  language: English
  quote_policy: summarized
