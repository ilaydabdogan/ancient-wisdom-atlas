  summary: The passage describes an animal trek arranged by Lion and Jackal. Crocodile
    secretly plots with Yellow Snake, the animals reach the sea-cow pool, and Crocodile
    gives a tearful speech before gunfire strikes Elephant and other animals. Jackal
    rebukes the animals for trusting Crocodile. Crocodile escapes into the water,
    and the passage ends with later punishment or retaliation involving dynamite and
    Elephant throwing crocodiles into trees.
