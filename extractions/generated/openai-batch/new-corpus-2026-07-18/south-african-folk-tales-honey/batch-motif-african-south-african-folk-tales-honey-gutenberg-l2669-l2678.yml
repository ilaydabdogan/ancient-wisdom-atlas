canonical_text:
  quote: Sun stuck fast to his back, and burnt Jackal's back black from that day.
  summary: The Sun is said to have been on earth by a wayside. Travelling men pass
    without noticing him. Jackal sees him, calls him a fine little child left behind,
    and carries him in an awa-skin on his back. When the Sun burns him, Jackal tries
    to shake him off, but the Sun sticks fast and burns Jackal's back black from that
    day.
