canonical_text:
  quote: ''
  summary: Jackal sees a fish-laden wagon, pretends to be dead in the road, is thrown
    into the wagon as a supposed useful hide, throws fish out, and escapes with them.
    Wolf later eats more than Jackal wants him to, so Jackal tells Wolf to imitate
    the method. Wolf lies in the road before another wagon but is kicked and beaten,
    then returns injured while Jackal only pretends to comfort him.
