canonical_text:
  quote: ''
  summary: The passage contains two adjacent Jackal tales. In the first, Jackal and
    Wolf work for a man; Jackal eats the household fat, smears Wolf's tail with fat,
    and shifts blame so that Wolf is beaten. In the second, Jackal leads boastful
    Lion to compare his strength with human beings, identifies a young hunter as the
    true strong man, watches from safety, and Lion is driven back by dogs, gunfire,
    and a knife before conceding the name of strongest to the man.
  language: English
  quote_policy: summarized
