  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Insect-king chooses Beetle as messenger, but Beetle never arrives at the
    ants, who remain discordant and prey to enemies.
  category: sequence
  evidence_refs:
  - ev:8
