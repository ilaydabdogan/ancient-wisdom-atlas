canonical_text:
  quote: ''
  summary: Ant varieties suffer attacks from birds, Anteater, Centipede, and other
    predators. They hold a council about safety but disagree on whether to live in
    holes, build dwellings, live in trees, or fly. Each faction acts separately and
    its chosen strategy fails. The Insect-king sends them the secret of unity and
    the message of Work-together by Beetle, but Beetle never arrives, leaving ants
    discordant and vulnerable.
  language: English
  quote_policy: summarized
