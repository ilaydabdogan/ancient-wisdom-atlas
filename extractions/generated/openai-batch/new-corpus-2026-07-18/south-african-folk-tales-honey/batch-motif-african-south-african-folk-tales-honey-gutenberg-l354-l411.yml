- id: obs:4
  text: Different factions propose living in a small hole in the ground, building
    a strong dwelling on the ground, dwelling in trees, or gaining wings and flying.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the failed deliberation, each party works in its own way; within separate
    factions, work is organized with appointed tasks, and some groups choose a king
    and divide labor.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'The separate strategies do not protect the ants: Anteater destroys or raids
    ground and underground dwellers, Centipede and birds attack tree dwellers, and
    Lizard, Hunting-spider, and birds outpace the flying ants.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Insect-king hears that the ants cannot agree and sends them the secret
