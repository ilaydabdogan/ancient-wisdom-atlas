- id: obs:1
  text: Ants are described as small, destructive, and subject to many slaughters by
    enemies including birds, Anteater, and Centipede.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some ants decide to hold council to find an arrangement for retreating to
    safety when attacked by birds and animals.
  category: action
  evidence_refs:
