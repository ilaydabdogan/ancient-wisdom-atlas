canonical_text:
  quote: ''
  summary: Jackal coerces Dove into giving up her young by claiming he can fly up
    to Dove's rock. Heron advises Dove that Jackal cannot fly. After Dove refuses
    Jackal again and names Heron as the adviser, Jackal tricks Heron into showing
    how he bends his neck in wind and rain, then strikes and breaks Heron's neck.
    The tale ends by explaining why Heron's neck is bent.
