  cautions: This is a passage-level pattern label, not a supplied taxonomy reference.
- id: motif:2
  label: Deceptive thief crossing a guarded boundary
  taxonomy_refs:
  - trickster_boundary
  basis: The inkalimeva repeatedly approaches the guarded kraal, distracts or exhausts
    the gatekeeper, enters the protected space, and eats or steals the fat.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The taxonomy link is interpretive; the passage calls the inkalimeva a
    fabulous animal but does not itself use the word trickster.
- id: motif:3
  label: Counter-trickster defeats the deceiver by pretending sleep
  taxonomy_refs:
  - trickster_boundary
  basis: Unlike the earlier keepers, the hare only pretends to sleep, interrupts the
    theft, mocks the inkalimeva, proposes tail-binding, and kills it after tying its
    tail tightly.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The hare's successful deception is explicit, but the taxonomy label is
    a broad comparative classification.
- id: motif:4
  label: Reserved trophy consumed and hidden
  taxonomy_refs: []
  basis: After killing the inkalimeva, the hare eats most of its tail, hides a remaining
    piece in the fence, and later denies that the inkalimeva had a tail, although
    the tail was expected to be kept for the chief.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No broader taxonomy reference is assigned because the passage only establishes
    the local narrative pattern.
- id: motif:5
  label: Animal fugitive escapes pursuit through a hole and snare
  taxonomy_refs: []
  basis: After the chief demands the hare, the animals chase him; he runs into a hole,
    avoids a snare at the mouth, remains there many days, and escapes uncaught.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage segment ends shortly after this escape, so the larger narrative
    function remains incomplete.
