candidate_motifs:
- id: motif:1
  label: Repeated failed guardians of communal food
  taxonomy_refs: []
  basis: The animals repeatedly appoint gatekeepers over fat in a kraal; five keepers
    are deceived, fall asleep or become distracted, and are killed after the fat is
    eaten.
  evidence_refs:
