canonical_text:
  quote: '"The fat belonging to all the animals has been eaten by the inkalimeva."'
  summary: The animals store fat in a kraal and repeatedly appoint gatekeepers. The
    inkalimeva deceives or distracts several keepers, eats the fat, and the animals
    kill each failed keeper. Hare becomes the sixth keeper, pretends to sleep, catches
    the inkalimeva, tricks it into tail-binding, kills it, eats most of its tail,
    lies about the tail, and then escapes pursuit through a hole and snare. The passage
    ends with Hare reaching a bushbuck who is building a hut, with meat cooking over
    a fire.
  language: English
  quote_policy: quoted
