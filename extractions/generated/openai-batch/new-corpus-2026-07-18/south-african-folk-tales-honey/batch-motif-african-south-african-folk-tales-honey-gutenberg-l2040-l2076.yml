  summary: A White Man frees Snake from beneath a large stone, but Snake then wants
    to bite him. The White Man asks Hyena and then Jackal whether this is right. Hyena
    gives a self-serving answer. Jackal demands to see the original situation, has
    Snake lie down under the stone again, and then stops the White Man from freeing
    her a second time. The White Man and Jackal leave Snake trapped under the stone.
