canonical_text:
  quote: with the fiddle he could force anything to dance
  summary: Monkey leaves his depleted home country to work elsewhere, receives a fiddle
    and bow and arrow from Orang Outang, uses the bow to kill a deer for Wolf, is
    falsely accused over the bow, and is sentenced by an animal court. As a last favor
    he plays the charmed fiddle, forcing the court to dance until Wolf confesses and
    Lion withdraws the sentence. Monkey retrieves the bow, climbs a camel thorn tree,
    and the animals disperse in fear that he may play again.
  language: English
  quote_policy: quoted
