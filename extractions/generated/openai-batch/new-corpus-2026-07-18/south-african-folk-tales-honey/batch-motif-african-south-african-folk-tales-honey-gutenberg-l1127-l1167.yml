canonical_text:
  quote: ''
  summary: Lion and Jackal hunt an eland. Jackal hits it, but Lion claims the shot.
    Jackal secretly creates a false blood trail, returns to the carcass, removes the
    fat, then evades Lion's accusation with deferential speech. Lion orders Jackal
    to deliver the fat to Lioness and take the lungs to his own family, but Jackal
    reverses the delivery, mocks Lion's children with the lungs, and leaves with his
    own family.
  language: English
  quote_policy: summarized
