canonical_text:
  quote: ''
  summary: A tailor named Itkler brings a complaint to Baboon after Mouse tears his
    clothes and the blame is passed through Cat, Dog, Wood, Fire, Water, Elephant,
    and Ant. Baboon holds a trial and orders the parties to punish one another in
    a chain. The judgment explains their continuing hostility, Itkler's satisfaction,
    Baboon's change of name, and Baboon's later walking on all fours.
  language: English
  quote_policy: summarized
