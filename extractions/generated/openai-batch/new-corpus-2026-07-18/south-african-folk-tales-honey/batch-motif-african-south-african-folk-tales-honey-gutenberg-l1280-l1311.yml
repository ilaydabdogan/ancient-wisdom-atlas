canonical_text:
  quote: The voices were equal. The lioness said to the ostrich, "You are my match."
  summary: A lioness and an ostrich compare their roars and are declared matched.
    They hunt together, but the ostrich kills more game with his leg claw. After eating
    and resting, the lioness's cubs discover that the sleeping ostrich has no teeth
    and report this to their mother as an insult. The lioness challenges the ostrich
    to fight; the ostrich uses an ant-hill in the fight and kills the lioness by striking
    a vulnerable spot near her liver.
  language: English
  quote_policy: quoted
