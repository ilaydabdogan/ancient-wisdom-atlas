canonical_text:
  quote: There was a frightful drought.
  summary: During a drought, the animals gather and dance in a dry river bed until
    water rises. Rabbit refuses to dance but later drinks the water and boasts. Tortoise
    traps Rabbit with a pitch-covered shell disguised as a stone. The animals condemn
    Rabbit to death, but when Lion swings him by the tail, Rabbit slips free, leaving
    only white skin and hair in Lion's paw.
  language: English
  quote_policy: quoted
