canonical_text:
  quote: ''
  summary: 'An origin account explains differing lifeways between Hottentots and Bushmen
    through two figures: a blind man and a hunter. The hunter discovers animals emerging
    from a hole in the earth; the blind man identifies them as cattle, later regains
    sight, encloses the cows and calves in a kraal, and anoints himself. When the
    hunter seeks to imitate him, the other tells him to throw ointment into the fire;
    the flames burn him, and he is sent to the hills with a knobstick to hunt for
    honey. The passage concludes that the Bushmen sprang from this outcome.'
  language: English
  quote_policy: summarized
