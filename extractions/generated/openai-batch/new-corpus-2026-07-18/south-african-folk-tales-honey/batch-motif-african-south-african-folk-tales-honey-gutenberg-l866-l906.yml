canonical_text:
  quote: ''
  summary: Mrs. Tiger visits Jackal to ask after the little tigers in his care. Jackal
    prevents the children from seeing her, arranges for Mrs. Tiger to view them one
    by one from a concealed position, and compensates for the missing firstborn by
    showing another cub twice. This repeated deception continues weekly until the
    youngest cub is shown seven times. On a later visit, Mrs. Tiger finds the estate
    deserted and a letter claiming that the Jackals have gone on a picnic with the
    children and then to Jackalsdance for New Year as part of their education.
  language: English
  quote_policy: summarized
