canonical_text:
  quote: ''
  summary: Lion and Jackal agree to hunt and store meat for winter. Jackal transports
    and controls the meat, deprives Lion’s family, and enriches his own. When Lion
    comes in anger, Jackal retreats to a cliff, deceives Lion with staged cries and
    explanations, twice cuts the hauling rope, and finally kills Lion by dropping
    a red-hot stone wrapped in fat into his mouth.
  language: English
  quote_policy: summarized
