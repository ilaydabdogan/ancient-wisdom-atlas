canonical_text:
  quote: ''
  summary: A footnote defines “wip” as a noose trap. In “Lion's Share,” Lion and Jackal
    hunt together; Jackal kills the game, shifts credit to Lion, misdirects Lion with
    false traces, eats the best part of the carcass, moves his family and goods to
    a stone tower, twice cuts the thong used to hoist Lion, then drops a fat-covered
    hot stone into Lion's mouth and escapes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The footnote defines “wip” as a Dutch word for a spring trap made from a bent
    green stick, a noose, and a cross stick trigger.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lion and Jackal go hunting together with arrows; Lion shoots first and misses,
    while Jackal's arrow hits the game.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Lion looks at him, Jackal says he meant that Lion had hit the game.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jackal passes Lion's fallen arrow without pointing it out, sends Lion to wait,
    follows a wrong track, makes his nose bleed, and presents the blood as traces
    of game.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Jackal finds the killed animal, crawls inside it, and eats the best portion;
    Lion later pulls him out by the tail.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Jackal takes portions of meat to the households, gives the worse portion to
    Lion's children, tells his own wife to move toward the killed game, and tells
    Lioness to wait for Lion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Jackal scratches his face in a thorn bush until it bleeds and tells Lion that
    Lion's wife scratched him when asked to come.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Jackal and his household build a stone tower and carry everything to the top
    before Lion returns.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Jackal lowers a thong for Lion, draws him near the top, and cuts the thong
    unseen; this happens twice, and Lion falls each time.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: Jackal has a stone made hot and covered with fat, draws Lion up again, tells
    him to open his mouth, throws the hot stone down his throat, and then escapes
    while Lion pleads for water.
  category: sequence
  evidence_refs:
  - ev:8
