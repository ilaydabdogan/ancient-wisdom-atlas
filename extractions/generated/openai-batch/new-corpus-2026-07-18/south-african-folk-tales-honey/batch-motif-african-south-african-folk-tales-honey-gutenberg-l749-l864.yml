  summary: The passage describes Jackal’s public reputation for being progressive
    despite being cunning and unlettered, his loss of his tail in a trap, his deception
    of other jackals by claiming Lion ordered all jackals to be tailless, and the
    beginning of a later episode in which Tiger entrusts his children to Jackal as
    a schoolmaster under conditions set by Jackal.
