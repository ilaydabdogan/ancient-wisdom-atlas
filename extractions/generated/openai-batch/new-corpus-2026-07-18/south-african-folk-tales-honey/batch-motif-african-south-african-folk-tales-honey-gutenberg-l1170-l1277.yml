  quote: ''
  summary: Little Jackal hunts with Lion under an agreement about dividing prey, repeatedly
    redirects meat to his own household, and escapes Lion through verbal ruses, disguise,
    inaccessible refuges, and a breaking rope at his rock home.
  language: English
  quote_policy: summarized
