canonical_text:
  quote: ingratitude is the world's reward
  summary: An old dog, threatened with being cast aside by his master, leaves and
    gathers six other animals. The seven animals frighten robbers out of a house,
    eat the food there, keep watch in assigned places, and drive away a returning
    robber, who misinterprets the animal attacks as attacks by traps, tools, and unseen
    persons.
  language: English
  quote_policy: quoted
