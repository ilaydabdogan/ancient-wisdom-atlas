- id: obs:7
  text: At dawn both sides perceive the error; the Minyan heroes and the Doliones
    lament for three days, circle Cyzicus' tomb three times in bronze armour, perform
    funeral rites, and hold games on the meadow-plain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Cleite, the bride of Cyzicus, hangs herself after his death; nymphs of the
    grove mourn her, and their tears become a fountain called Cleite.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Doliones are said to suffer terribly from Zeus on that day, avoid tasting
