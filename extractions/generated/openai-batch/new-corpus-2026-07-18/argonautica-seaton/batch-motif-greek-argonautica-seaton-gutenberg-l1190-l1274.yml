canonical_text:
  quote: ''
  summary: Earthborn monsters attack near Chytus and are slain by Heracles and the
    other heroes. The Argonauts sail away but are driven back at night to the Doliones,
    where mutual misrecognition causes a battle in which Cyzicus and many others die.
    At dawn both sides recognize the error, mourn, and perform funeral rites and games;
    Cleite dies by hanging, and nymphs' tears become a fountain named for her. The
    passage also links Dolionian grief and later Ionian ritual practice, then describes
    a twelve-day storm delay and a halcyon omen interpreted by Mopsus for Jason.
  language: English
  quote_policy: summarized
