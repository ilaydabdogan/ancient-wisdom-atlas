canonical_text:
  quote: ''
  summary: 'Mopsus reports a halcyon-borne prophecy instructing Jason to climb Dindymum
    and propitiate the mother of the gods so that the storm winds will cease. Jason
    and the Argonauts ascend, fashion a wooden image, build an altar, sacrifice with
    prayers, libations, armed dancing, and shield-clashing, after which signs of divine
    favor appear: fruit, flowers, tame beasts, a new spring, and the cessation of
    winds. The heroes depart, row through calm seas, Heracles breaks his oar, and
    the crew later receives Mysian hospitality and sacrifices to Apollo Ecbasius.'
  language: English
  quote_policy: summarized
