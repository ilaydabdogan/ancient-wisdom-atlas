canonical_text:
  quote: ''
  summary: 'Phineus receives neighbours and the Argonauts, explains Paraebius’ inherited
    curse from the cutting of a Hamadryad’s oak, and recounts its atonement by altar
    and sacrifice. The chiefs sacrifice to Apollo and are delayed by Etesian winds.
    An aetiological tale follows: Apollo carries off Cyrene, she bears Aristaeus,
    he is educated and later averts a Dog-star pestilence by founding sacrifices that
    explain the cooling Etesian winds and Cean ritual. The Argonauts then make offerings
    to the twelve gods, board ship with a trembling dove, and Athena swiftly travels
    by cloud toward Thynia with friendly intent toward them.'
  language: English
  quote_policy: summarized
