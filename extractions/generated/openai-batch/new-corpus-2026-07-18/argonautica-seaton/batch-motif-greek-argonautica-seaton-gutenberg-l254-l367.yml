candidate_motifs:
- id: motif:1
  label: sea quest for the golden fleece
  taxonomy_refs:
  - mystical_quest
  - departure
  basis: The opening states that Argo sails through Pontus and the Cyanean rocks in
    quest of the golden fleece, and the narrator frames the voyage as a long sea-path
    with heroic deeds.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The passage announces the quest but does not yet narrate the acquisition
    of the fleece.
- id: motif:2
  label: oracle-marked one-sandaled arrival and diverted doom
  taxonomy_refs:
  - divine_judgment
  - departure
  basis: Pelias hears an oracle about death from a one-sandaled man; after Jason appears
    in that condition, Pelias sends him on a dangerous voyage to avert his return.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The oracle is explicit, but the taxonomy labels are broad; the passage
    does not identify the divine speaker of the oracle.
- id: motif:3
  label: divinely guided wondrous vessel
  taxonomy_refs:
  - ark_vessel
  basis: Argo is repeatedly described as made by Argus under Athena’s guidance and
    as the most excellent ship tried by oars.
  evidence_refs:
  - ev:3
  - ev:9
  confidence: medium
  cautions: The ship is a divinely aided quest vessel, but the passage does not present
    it as an ark in a flood or preservation narrative.
