canonical_text:
  quote: ''
  summary: The narrator opens Book I by invoking Phoebus and announcing the voyage
    of Argo for the golden fleece. Pelias hears an oracle that he will be killed through
    a one-sandaled man; Jason appears after losing one sandal while crossing the Anaurus,
    and Pelias sends him on a dangerous sea quest. The poet then begins the catalogue
    of Argonauts, including Orpheus, several warriors, seers, exiles, and navigators,
    while noting Athena’s role in the making and guidance of the ship.
  language: English
  quote_policy: summarized
