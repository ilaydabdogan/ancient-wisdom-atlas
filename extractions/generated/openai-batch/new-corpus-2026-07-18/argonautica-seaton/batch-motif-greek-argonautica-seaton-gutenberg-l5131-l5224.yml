canonical_text:
  quote: ''
  summary: The Argonauts carry their ship across the Libyan desert to the Tritonian
    lake, suffer thirst, and reach the garden region of Atlas where the slain serpent
    Ladon lies by the apple-tree. The Hesperides lament and transform; Orpheus prays
    to them for water and promises offerings. The nymphs reveal themselves as trees,
    and Aegle tells how Heracles killed the guardian serpent, took the golden apples,
    struck a rock, and brought forth water. The Argonauts drink from the spring and
    recognize that Heracles has saved them from afar. Some then search for Heracles,
    but the search fails; the passage also recounts Polyphemus' later fate and monument.
  language: English
  quote_policy: summarized
