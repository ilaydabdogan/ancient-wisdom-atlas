canonical_text:
  quote: ''
  summary: Phineus, an aged blind prophet punished by Zeus after revealing divine
    will, is tormented by Harpies who steal and foul his food. When the Argonauts
    arrive, he recognizes them through prophecy, begs them for help, and says an oracle
    has declared that the sons of Boreas will restrain the Harpies. Zetes asks for
    assurance that helping will not anger heaven, and Phineus swears by Apollo, his
    doom, his blindness, and the gods below that no divine wrath will fall on them.
  language: English
  quote_policy: summarized
