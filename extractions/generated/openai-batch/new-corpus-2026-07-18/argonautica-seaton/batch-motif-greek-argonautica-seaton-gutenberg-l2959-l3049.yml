canonical_text:
  quote: ''
  summary: 'Argus tells Aeetes that his shipwrecked party was preserved and aided
    by Jason''s crew, explains Jason''s mission to recover the fleece, praises the
    divinely made ship and heroic lineages, and offers recompense. Aeetes reacts angrily,
    suspects a plot against his rule, and threatens the visitors. Jason answers gently
    as a suppliant and offers military aid. Aeetes decides not to kill the strangers
    immediately but to test Jason with a deadly task: yoke fire-breathing bronze-footed
    bulls, plough the field of Ares, sow serpent teeth that become armed men, and
    defeat them before receiving the fleece.'
  language: English
  quote_policy: summarized
