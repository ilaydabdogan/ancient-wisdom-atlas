candidate_motifs:
- id: motif:1
  label: Divine aid for a dangerous return voyage
  taxonomy_refs:
  - return
  - ark_vessel
  basis: Hera arranges aid from Thetis, the Nereids, Hephaestus, and Aeolus so the
    heroes’ ship may pass through dangerous waters toward home-return.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The vessel is not an ark in a flood story; the taxonomy reference is used
    only for the protected-vessel aspect.
- id: motif:2
  label: Narrow passage between annihilating sea hazards
  taxonomy_refs:
  - chaos
  basis: The ship must avoid rocks, waves, Charybdis’ swallowing danger, and Scylla’s
    jaws, with only a hair’s-breadth escape from destruction.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:10
  confidence: high
  cautions: The passage presents a dangerous route rather than a full underworld or
    labyrinth episode.
- id: motif:3
  label: Prophecy of a son mightier than his father
  taxonomy_refs:
  - divine_parent_child
  - royal_legitimacy
  basis: Themis reveals that Thetis is fated to bear a son mightier than his sire,
    and Zeus relinquishes Thetis to preserve his rule over the immortals.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The prophecy prevents Zeus from fathering the child; the passage does
    not narrate an actual overthrow.
- id: motif:4
  label: Divine-mortal marriage arranged by a goddess
  taxonomy_refs:
  - sacred_marriage
  - divine_beloved
  basis: Hera gives Thetis a mortal husband, Peleus, summons the gods to the feast,
    and raises the bridal torch.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The scene is recalled in speech; the marriage is troubled, and the taxonomy
    label is broad.
- id: motif:5
  label: Fated afterlife union
  taxonomy_refs:
  - afterlife_journey_map
  - sacred_marriage
  basis: Hera states that Thetis’ son will come to the Elysian plain and is fated
    there to be Medea’s husband.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage gives only a brief prophecy and does not narrate the afterlife
    scene itself.
- id: motif:6
  label: Attempted immortalization of a miraculous child by fire and ambrosia
  taxonomy_refs:
  - miraculous_child
  - initiation
  basis: Thetis surrounds infant Achilles’ mortal flesh with fire at night and anoints
    him with ambrosia by day to make him immortal and prevent old age.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The ritual is interrupted and fails; the passage does not describe a completed
    initiation.
- id: motif:7
  label: Interrupted divine rite by mortal witness
  taxonomy_refs:
  - forbidden_knowledge
  basis: Peleus sees Achilles gasping in the flame and cries out; Thetis reacts by
    casting down the child and leaving the household.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The passage does not explicitly call Peleus’ sight forbidden, though the
    interruption causes rupture.
- id: motif:8
  label: Secret divine appearance to a single mortal
  taxonomy_refs:
  - forbidden_knowledge
  basis: Thetis appears clearly only to Peleus and commands him not to show or reveal
    her when she comes with the Nereids.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The secrecy concerns Thetis’ visible presence, not a fully developed forbidden-knowledge
    episode.
- id: motif:9
  label: Withdrawal of divine wife into the sea
  taxonomy_refs:
  - departure
  - divine_beloved
  basis: After Peleus interrupts the treatment of Achilles, Thetis leaves like wind
    or dream, leaps into the sea, and does not return.
  evidence_refs:
  - ev:11
  - ev:13
  confidence: medium
  cautions: The passage frames the departure through marital anger rather than abduction
    or loss of a beloved.
