canonical_text:
  quote: ''
  summary: Hera instructs Thetis to aid the Argonauts through dangerous sea hazards.
    Hera recalls Thetis’ refusal of Zeus, the prophecy that Thetis would bear a son
    mightier than his father, and Thetis’ marriage to Peleus. Hera also foretells
    Achilles’ future union with Medea in the Elysian plain. Thetis accepts the task,
    summons the Nereids, appears secretly to Peleus, and orders the heroes to depart
    at dawn. The passage closes with the story of Thetis’ failed attempt to make infant
    Achilles immortal with fire and ambrosia, interrupted by Peleus, after which Thetis
    left him and returned to the sea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hera says she saved Aeson’s son and his companions when they passed between
    the Wandering Rocks, where fire-storms and foaming waves surround rugged reefs.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hera says the heroes must now pass the mighty rock of Scylla and Charybdis.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hera recalls that she tended Thetis from infancy and loved her because Thetis
    refused Zeus’ desire.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hera says Themis revealed that Thetis was fated to bear a son mightier than
    his father, causing Zeus to give up pursuing her so that he might keep his dominion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hera says she gave Thetis Peleus, a son of earth, as husband, summoned the
    gods to the feast, and raised the bridal torch herself.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hera says Thetis’ son is in Cheiron’s home, tended by water-nymphs and still
    craving his mother’s milk, and that he is fated to be Medea’s husband in the Elysian
    plain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hera asks Thetis to aid Medea as a daughter-in-law and to aid Peleus, despite
    Thetis’ anger at him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hera expects Hephaestus to stop kindling flame and Aeolus to restrain the
    winds except for the west wind until the heroes reach the Phaeacian havens.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hera fears the rocks, waves, Charybdis, and Scylla, and asks Thetis to guide
    the ship where there is only a hair’s-breadth escape from destruction.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Thetis promises to save the ship if the flame and winds cease and the west
    wind blows, and says she must seek her sisters and the ship’s mooring-place before
    dawn.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Thetis descends from the sky into the dark blue sea, summons the Nereids,
    relays Hera’s commands, and travels swiftly through the sea to the Aeaean beach.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Thetis finds the heroes beside the ship playing games and shooting arrows.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: Thetis touches Peleus’ hand, appears clearly only to him, and tells him that
    at dawn the heroes must loosen the ship’s hawsers in obedience to Hera.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Thetis says the daughters of Nereus will draw the ship through the rocks called
    Planctae and orders Peleus not to reveal her appearance.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Thetis vanishes into the sea, and Peleus is pained because she had not appeared
    to him since leaving their marriage bed in anger over Achilles.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: Thetis used flame at night and ambrosia by day on infant Achilles in an attempt
    to make him immortal and keep old age from his body.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: Peleus saw Achilles gasping in the flame and cried out; Thetis heard him,
    threw the child to the ground, left like wind or dream, leapt into the sea, and
    did not return.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:18
  text: Peleus reports Thetis’ instructions to his comrades, who stop their contests,
    prepare food and beds, and sleep through the night.
  category: sequence
  evidence_refs:
  - ev:14
