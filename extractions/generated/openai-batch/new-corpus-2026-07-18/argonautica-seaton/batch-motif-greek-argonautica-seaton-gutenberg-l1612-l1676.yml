canonical_text:
  quote: ''
  summary: After Amycus' death, the Bebrycians attack Polydeuces but are met by his
    comrades and routed. The heroes fight, the Bebrycian lands are also ravaged by
    Lycus and the Mariandyni, and a speaker laments Heracles' absence. The narrator
    attributes events to Zeus' counsels. The Argonauts spend the night tending wounds,
    sacrificing, feasting, and singing with Orpheus' lyre, then depart at dawn through
    the Bosporus, where Tiphys steers them safely past a mountain-like wave.
  language: English
  quote_policy: summarized
