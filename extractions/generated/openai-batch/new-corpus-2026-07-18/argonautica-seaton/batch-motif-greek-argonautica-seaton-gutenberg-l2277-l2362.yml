canonical_text:
  quote: ''
  summary: After Tiphys dies and is buried, the Argonauts despair of returning. Hera
    inspires Ancaeus, who offers to steer the ship; the company resumes its voyage.
    They pass rivers and landmarks associated with Dionysus, Sthenelus, Apollo, Orpheus,
    and Artemis. Sthenelus’ spirit appears from his barrow, and the crew honors his
    tomb with libations, sacrifice, and an altar to Apollo before continuing by sea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tiphys, son of Hagnias, dies of a short sickness far from his native land,
    and the heroes bury him near the seer with due honors.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the burials, the company lies silent on the seashore, neglects food
    and drink, and grieves because hope of return seems gone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hera kindles courage in Ancaeus, who is described as skilled in steering.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ancaeus urges that the crew should not linger in a strange land and states
    that Jason took him for his knowledge of ships.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Peleus tells the company that their dead comrades have met their fate, but
    that other steersmen remain, and urges them to resume the work.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Jason forebodes an evil doom if the crew can neither reach Aeetes’ city nor
    return to Hellas.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ancaeus undertakes to guide the ship; Erginus, Nauplius, and Euphemus also
    volunteer to steer, but the comrades grant the office to Ancaeus.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: On the twelfth day at dawn, the crew boards, passes through the river Acheron,
    raises sails, and moves through fair weather.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: At the river Callichorus, the passage recounts that the Nysean son of Zeus
    held revels and dances before a cave and spent sacred nights inside it.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The crew sees the barrow of Sthenelus, Actor’s son, a comrade of Heracles
    who died on the sea-beach after being struck by an arrow on his return from war
    against the Amazons.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: Persephone sends forth Sthenelus’ spirit, which rises on the edge of the barrow,
    looks at the ship, appears with a gleaming four-peaked helmet and blood-red crest,
    and then returns to the vast gloom.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Mopsus interprets the apparition prophetically and urges the crew to land
    and propitiate Sthenelus with libations.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The crew honors Sthenelus’ tomb with drink offerings and sheep sacrifice,
    builds an altar to Apollo as savior of ships, burns thigh bones, and Orpheus dedicates
    his lyre.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Argo is compared to a hawk borne swiftly on the breeze with outspread wings.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:15
  text: At the river Parthenius, the daughter of Leto is said to cool her limbs in
    the waters after the chase before mounting to heaven.
  category: setting
  evidence_refs:
  - ev:15
- id: obs:16
  text: The ship continues through the night and passes a sequence of named coastal
    places and rivers.
  category: sequence
  evidence_refs:
  - ev:16
