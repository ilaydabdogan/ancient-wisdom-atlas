candidate_motifs:
- id: motif:1
  label: death and burial of a companion during a quest
  taxonomy_refs:
  - death_rebirth
  basis: The voyage is interrupted by the death of Tiphys, burial with honors, and
    grief over whether the expedition can continue.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage emphasizes death and burial, but does not narrate rebirth;
    the taxonomy reference is approximate.
- id: motif:2
  label: divine encouragement restores a stalled expedition
  taxonomy_refs:
  - departure
  - mystical_quest
  basis: Hera inspires Ancaeus when the crew is overcome by grief, leading to renewed
    steering and continuation of the voyage.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The motif is passage-level and does not by itself prove a wider comparative
    pattern.
- id: motif:3
  label: new helmsman after loss of the former guide
  taxonomy_refs:
  - departure
  - return
  basis: After Tiphys’ death and the loss of hope of return, Ancaeus and others volunteer
    to steer; Ancaeus is chosen and the ship departs again.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:8
  confidence: high
  cautions: This is a narrative function within the voyage rather than a named traditional
    motif.
- id: motif:4
  label: sacred cave associated with divine revels and nights
  taxonomy_refs:
  - cave
  basis: The Nysean son of Zeus is said to have danced before a cave and passed sacred
    nights inside it, giving names to the river and cave.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: Available taxonomy lists cave as a symbol rather than a motif family;
    no initiation or mystery rite is explicitly described beyond sacred nights.
- id: motif:5
  label: spirit appearing from a tomb by divine permission
  taxonomy_refs:
  - afterlife_journey_map
  basis: Persephone sends Sthenelus’ spirit from gloom to the barrow so that it can
    see living men, after which it returns to the gloom.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage gives an apparition and return to gloom, but not a full map
    of the afterlife.
- id: motif:6
  label: propitiation of the dead with offerings and sacrifice
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Mopsus instructs the crew to propitiate Sthenelus; they pour drink offerings,
    sacrifice sheep, and honor the tomb.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage does not state an explicit benefit received in exchange, so
    sacred exchange is cautious.
- id: motif:7
  label: protective ship altar to a deity
  taxonomy_refs:
  - sacrifice
  basis: The voyagers build an altar to Apollo as savior of ships and burn thigh bones
    before resuming their sea journey.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The protective title is explicit, but the passage does not narrate a direct
    divine response.
- id: motif:8
  label: aition through dedicated object and place-name
  taxonomy_refs: []
  basis: Orpheus dedicates his lyre, and the passage explains that the place therefore
    has the name Lyra.
  evidence_refs:
  - ev:13
