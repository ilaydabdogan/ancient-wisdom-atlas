- id: motif:5
  label: God-given earth clod becomes island for descendants
  taxonomy_refs:
  - sacred_exchange
  - sacred_birth
  basis: Triton’s stranger’s gift, a clod of earth, is interpreted by Jason as destined
    to become an island; when Euphemus casts it into the sea, Calliste rises.
  evidence_refs:
