candidate_motifs:
- id: motif:1
  label: Supernatural darkness and chaos during sea return
  taxonomy_refs:
  - chaos
  - return
  basis: The passage describes a fatal starless and moonless night, black chaos, and
    heroes uncertain whether they are in Hades or on the water during their return
    voyage.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage uses the word chaos directly, but the Hades comparison remains
    a statement of disorientation rather than an actual underworld journey.
- id: motif:2
  label: Divine light reveals a safe island
  taxonomy_refs:
  - return
  basis: After Jason’s prayer, Apollo’s golden bow shines and reveals Anaphe, allowing
    the heroes to anchor and continue their return.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: No broader solar or initiation pattern is asserted beyond the literal
    rescue by divine gleam.
- id: motif:3
  label: Vow, rescue, and cult foundation
  taxonomy_refs:
  - sacred_exchange
  basis: Jason vows offerings to Phoebus; after Apollo reveals the island, the heroes
    build him an abode and altar and sacrifice.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The sacred-exchange taxonomy is applied cautiously to vow and offering;
    the passage does not formulate a formal covenant.
