canonical_text:
  quote: ''
  summary: On the return voyage, a fatal darkness over the Cretan sea leaves the heroes
    unsure whether they are in Hades or on the water. Jason prays to Apollo, whose
    gleaming golden bow reveals Anaphe, where the heroes establish cult and a ritual
    aetiology of joking speech. Euphemus dreams that a god-given clod of earth is
    suckled with milk, becomes a woman who identifies herself as Triton’s daughter,
    and foretells a home for his descendants. Jason interprets the dream; Euphemus
    casts the clod into the sea, and the island Calliste, later Thera, rises. At Aegina,
    a water-fetching contest is connected to a later Myrmidon custom, and the voyage
    ends peacefully at Pagasae.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A night called the Pall of Darkness covers the wide Cretan sea; neither stars
    nor moon give light, and black chaos or another darkness is described as descending
    or rising.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The heroes do not know whether they are drifting in Hades or on the waters,
    and they surrender their return to the sea in doubt.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Jason raises his hands, cries to Phoebus for rescue, weeps in distress, and
    promises many offerings at Pytho, Amyclae, and Ortygia.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Apollo comes down to the Melantian rocks, stands on one of the twin peaks,
    raises his golden bow, and its gleam shines around.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A small island appears to the heroes; they anchor there, dawn gives light,
    and they build an abode and altar for Apollo, naming him the Gleamer and the island
    Anaphe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: During sacrifice on a desolate shore, Medea’s Phaeacian handmaids laugh at
    water libations on burning brands, and the heroes answer with taunting words;
    the passage connects this to later ritual scoffing by women on Anaphe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Euphemus dreams that a god-given clod of earth held near his breast is suckled
    by white streams of milk and grows into a maiden-like woman, with whom he unites.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dream woman says she is the daughter of Triton, the nurse of Euphemus’s
    children, and the child of Triton and Libya; she asks to be returned to the daughters
    of Nereus in the sea near Anaphe and says she will prepare a home for his descendants.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Euphemus tells Jason the dream, and Jason says that if the clod is cast into
    the sea, the gods will make it an island where Euphemus’s descendants will dwell.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Jason identifies Triton as the giver of the clod, calling it a stranger’s
    gift from the Libyan mainland.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Euphemus casts the clod into the sea; from it rises the island Calliste, described
    as sacred nurse of the sons of Euphemus and later associated with the name Thera.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At Aegina the heroes compete in fetching water to see who can draw it and
    reach the ship first; the passage connects this with later Myrmidon youths racing
    with full jars.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After Aegina no further adventure or opposing tempest occurs, and the heroes
    reach the beach of Pagasae.
  category: sequence
  evidence_refs:
  - ev:8
