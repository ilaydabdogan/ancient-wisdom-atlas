canonical_text:
  quote: ''
  summary: Heracles goes into a wood to make an oar and uproots a pine. Hylas goes
    with a bronze pitcher to fetch water at the spring Pegae, where nymphs are honoring
    Artemis by night. A water-nymph, moved by desire when she sees Hylas, pulls him
    into the eddy. Polyphemus hears Hylas cry, searches, and reports the loss to Heracles,
    who rushes off in wrath and grief. Meanwhile the Argonauts sail with a favorable
    breeze and later realize they have unwittingly left comrades behind, causing turmoil
    among them.
  language: English
  quote_policy: summarized
