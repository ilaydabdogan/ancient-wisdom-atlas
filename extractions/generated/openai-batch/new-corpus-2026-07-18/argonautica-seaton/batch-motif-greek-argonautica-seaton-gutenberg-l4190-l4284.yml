canonical_text:
  quote: ''
  summary: Apsyrtus and the Colchians pursue and blockade the Argonauts near the Ister
    and the Brygean isles of Artemis. To avoid battle, the Minyae make a covenant
    about retaining the golden fleece and placing Medea under Artemis’s ward until
    a king judges her fate. Medea privately reproaches Jason for broken oaths and
    threatens curses and self-destruction. Jason answers that the covenant is a temporary
    stratagem and will become a guileful means to destroy Apsyrtus.
  language: English
  quote_policy: summarized
