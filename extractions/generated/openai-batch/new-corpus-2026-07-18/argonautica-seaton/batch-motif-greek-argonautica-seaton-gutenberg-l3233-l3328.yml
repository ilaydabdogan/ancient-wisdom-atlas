canonical_text:
  quote: ''
  summary: Medea awakens from fearful dreams about the stranger, the contest, marriage,
    and conflict with her parents. Torn between shame, desire, and concern for the
    stranger, she tries to approach her sister Chalciope. Chalciope, fearing for her
    sons, begs Medea for secret help, demands an oath by Earth and Heaven, and invokes
    an avenging Fury from Hades if she is refused. Medea answers that she will help
    as far as she can, calling Heaven and Earth as witnesses.
  language: English
  quote_policy: summarized
