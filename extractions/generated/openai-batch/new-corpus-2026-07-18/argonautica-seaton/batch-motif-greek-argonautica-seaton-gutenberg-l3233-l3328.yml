- id: obs:1
  text: A deep slumber relieves the maiden from love-pains, but fearful and deceitful
    dreams trouble her.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the dream, the stranger undertakes the contest not for the ram's fleece
    but to lead Medea away as his wedded wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the dream, Medea herself contends with the oxen and accomplishes the task
    easily; her parents reject their promise, a dispute arises, and Medea chooses
    the stranger over her parents.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After waking in fear, Medea says the heroes' voyage may bring evil, says her
    heart trembles for the stranger, affirms maidenhood and her parents' home, and
    plans to test whether Chalciope will ask her to aid the contest for her sons'
    sake.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Medea opens her chamber door barefoot and in one robe, crosses the threshold,
    repeatedly turns back because of shame, is urged on by desire, and finally falls
    face downward on her bed in pain.
  category: sequence
  evidence_refs:
  - ev:3
