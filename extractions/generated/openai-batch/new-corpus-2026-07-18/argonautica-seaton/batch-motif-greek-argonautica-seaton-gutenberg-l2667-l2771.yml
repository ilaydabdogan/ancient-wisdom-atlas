canonical_text:
  quote: ''
  summary: At the opening of Book III the narrator invokes Erato to tell how Jason
    obtained the Golden Fleece through Medea's love. Hera and Athena deliberate about
    aiding the Argonauts, decide to seek Cypris, and ask her to have her son inflame
    Aeetes' daughter with love for Jason. Cypris receives them in her palace, hears
    Hera's account of Jason's earlier kindness to her in disguise, and agrees to try
    to persuade her unruly son.
  language: English
  quote_policy: summarized
