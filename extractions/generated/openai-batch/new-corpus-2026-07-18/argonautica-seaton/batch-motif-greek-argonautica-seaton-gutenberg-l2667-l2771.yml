  evidence_refs:
  - ev:2
- id: obs:3
  text: Hera asks Athena whether to devise a scheme to seize the Golden Fleece of
    Aeetes, to bear it to Hellas, or to deceive and persuade the king with words.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hera proposes that they go to Cypris and urge her to order her son to shoot
    Aeetes' daughter, the enchantress, and charm her with love for Jason.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
