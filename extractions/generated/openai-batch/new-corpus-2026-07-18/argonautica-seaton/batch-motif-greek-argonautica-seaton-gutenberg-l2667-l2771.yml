  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Cypris is sitting alone, combing and preparing to braid her hair with a golden
    comb, and she receives Hera and Athena with couches and speech.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hera says Jason and his comrades are on the river Phasis in quest of the fleece,
    and that she fears especially for the son of Aeson.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Hera says Jason once pitied her when she appeared as an old crone during a
    flood at Anaurus and carried her on his shoulders through the rushing tide while
    she was testing human righteousness.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Hera asks Cypris to have her boy charm Aeetes' daughter with love for Jason,
