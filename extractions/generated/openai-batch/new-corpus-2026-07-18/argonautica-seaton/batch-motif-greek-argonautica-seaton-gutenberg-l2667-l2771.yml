- id: obs:1
  text: The narrator invokes Erato to tell how Jason brought the fleece back to Iolcus
    with Medea's love as aid.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The heroes wait hidden among thick reed-beds while Hera and Athena privately
    take counsel apart from Zeus and the other immortals.
