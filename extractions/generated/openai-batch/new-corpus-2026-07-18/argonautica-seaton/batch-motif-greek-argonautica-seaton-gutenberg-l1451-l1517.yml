canonical_text:
  quote: ''
  summary: 'A son of Aeacus, later identified as Telamon, angrily accuses Jason over
    the abandonment of Heracles and nearly causes a return toward Mysia before the
    sons of Boreas restrain him. The narrator foreshadows Heracles’ later vengeance
    on the Boreads. Glaucus rises from the sea, seizes the ship’s keel, and reports
    Zeus’s counsel: Heracles must not go to Aeetes but must perform labors for Eurystheus
    and dwell with the immortals; Polyphemus will found a city near Cius; Hylas has
    been made husband of a goddess-nymph. After Glaucus departs, Telamon and Jason
    reconcile. The passage then recounts the later oath-bound search for Hylas by
    the people of Cius and the ship’s wind-driven travel to a new landing.'
  language: English
  quote_policy: summarized
