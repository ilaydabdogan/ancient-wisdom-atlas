canonical_text:
  quote: ''
  summary: The Argonauts perform a sacrificial rite, Idmon reads the omen and foretells
    both the quest’s return with the fleece and his own death. At the feast Idas boasts
    against divine opposition and is rebuked by Idmon through the example of the sons
    of Aloeus. Their quarrel is restrained, and Orpheus sings a cosmogony describing
    the separation of earth, heaven, and sea, the ordering of celestial bodies, the
    rise of mountains and rivers, early divine rule by Ophion and Eurynome, their
    displacement by Cronos and Rhea, and child Zeus in the Dictaean cave before receiving
    thunder and lightning. The heroes remain enchanted by the song, then make libations
    to Zeus and sleep.
  language: English
  quote_policy: summarized
