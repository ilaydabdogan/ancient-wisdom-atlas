candidate_motifs:
- id: motif:1
  label: Sacrificial omen leading to prophecy
  taxonomy_refs:
  - sacrifice
  - wisdom
  basis: A sacrificial rite produces flame and smoke that Idmon interprets as a good
    omen before delivering a divine utterance about the expedition’s future.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not describe a formal technical method beyond Idmon’s
    response to flame and smoke.
- id: motif:2
  label: Destined quest, return, trials, and foretold death
  taxonomy_refs:
  - departure
  - return
  - mystical_quest
  basis: Idmon says the voyagers are destined to return with the fleece after many
    trials, while he himself has left his homeland and embarked despite foreknowledge
    of death abroad.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The broader quest context is only represented here through the fleece,
    voyage, return, and trials mentioned in the passage.
- id: motif:3
  label: Hubristic boast against divine opposition and warning by precedent
  taxonomy_refs:
  - divine_judgment
  basis: Idas boasts that his spear will succeed even if a god opposes him; Idmon
    rebukes this as dishonoring the gods and cites the sons of Aloeus, who were slain
    after similar taunts.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The actual punishment of Idas is not narrated in this passage; the divine
    judgment element appears through the cited precedent.
- id: motif:4
  label: Cosmic separation from primordial mingling
  taxonomy_refs:
  - chaos
  basis: Orpheus sings that earth, heaven, and sea were once mingled in one form and
    were separated after deadly strife, followed by ordered celestial paths and the
    emergence of mountains, rivers, nymphs, and creatures.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives a compact song-summary rather than an extended cosmogony.
- id: motif:5
  label: Divine succession and displaced older rulers
  taxonomy_refs:
  - royal_legitimacy
  basis: Ophion and Eurynome first rule snowy Olympus, then yield prerogative to Cronos
    and Rhea and fall into Ocean’s waves while the successors rule among the Titan-gods.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage states succession and displacement but does not elaborate
    legal or ritual legitimation.
- id: motif:6
  label: Child god hidden in a cave before receiving thunder weapons
  taxonomy_refs:
  - miraculous_child
  basis: Orpheus sings of Zeus as a child dwelling in the Dictaean cave before the
    earthborn Cyclopes arm him with the bolt, thunder, and lightning.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage mentions child Zeus in the cave and later arming, but does
    not narrate birth, concealment motive, or upbringing details.
- id: motif:7
  label: Enchanting song that pacifies or suspends conflict
  taxonomy_refs: []
  basis: After the quarrel is restrained, Orpheus begins to sing; when he ends, the
    heroes remain quiet, intent, and affected by the charm left in their hearts.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: high
  cautions: The passage implies the song follows the conflict but does not explicitly
    say the song alone ends the quarrel.
comparison_claims:
- id: claim:1
  claim: The passage itself compares Idas’ reckless speech against divine opposition
    with the earlier taunts of the sons of Aloeus, using that precedent as a warning
    about god-defying boastfulness and divine punishment.
  claim_level: same_function
  target: sons of Aloeus precedent within the passage
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is rhetorical and limited to taunting the gods and the
    cited punitive outcome; the passage does not narrate Idas receiving the same punishment
    here.
- id: claim:2
  claim: Orpheus’ song fits a chaos-to-cosmic-order pattern, moving from a mingled
    earth-heaven-sea state to separated realms, fixed celestial paths, and generated
    features of the world.
  claim_level: same_motif
  target: chaos motif family
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This is a motif-family classification based on the internal content
    of the song, not a claim of historical contact with another text.
- id: claim:3
  claim: The succession from Ophion and Eurynome to Cronos and Rhea functions as a
    divine-rule displacement pattern within the cosmogonic song.
  claim_level: same_function
  target: divine succession pattern
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only a brief succession notice and does not provide
    a full narrative of conflict, genealogy, or cultic legitimation.
