canonical_text:
  quote: ''
  summary: 'Medea prepares at dawn, summons twelve maidens, retrieves the Promethean
    charm, and drives to Hecate’s shrine. The passage explains the charm’s origin
    in Prometheus’s ichor and the ritual by which Medea gathered it. At the shrine
    Medea instructs her maids to keep her plan secret: Jason is to come apart from
    his comrades, receive aid, and give gifts. Argus brings Jason and Mopsus; Hera
    makes Jason extraordinarily beautiful. A crow in a poplar near the shrine speaks
    Hera’s counsel, mocking Mopsus for failing to understand that Medea will not speak
    affectionately while strangers are present.'
  language: English
  quote_policy: summarized
