canonical_text:
  quote: ''
  summary: A speaker counsels the Argonauts to seek aid from Medea, a maiden taught
    by Hecate to use powerful magic herbs. A dove fleeing a hawk falls into Jason's
    lap while the hawk is impaled on the ship, and Mopsus interprets this as a heavenly
    sign to seek the maiden and invoke the Cyprian goddess. Idas angrily rejects reliance
    on women, Cypris, and bird omens. Jason sends Argus to the city and brings the
    ship openly to shore. Aeetes convenes the Colchians to plot against the Minyae,
    threatens a deadly task, destruction of the oak grove, and burning of the ship,
    and invokes a prophecy about danger from his offspring. Argus reaches the palace
    and asks Chalciope to seek Medea's aid, while Chalciope fears Aeetes' wrath and
    exposure.
  language: English
  quote_policy: summarized
