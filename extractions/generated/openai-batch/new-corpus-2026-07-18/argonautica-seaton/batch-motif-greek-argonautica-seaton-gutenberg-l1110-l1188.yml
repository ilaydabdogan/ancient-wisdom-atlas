  quote: the rites that may not be uttered
  summary: Jason replies to Hypsipyle with a request about any future son, then the
    Argonauts depart by ship. They stop at Electra for secret rites, sail through
    named waters, reach the region of the Mount of Bears and the Doliones, exchange
    an anchorstone that later becomes sacred, receive hospitality from Cyzicus, build
    an altar to Apollo, and climb Dindymum to view sea routes.
  language: English
  quote_policy: quoted
