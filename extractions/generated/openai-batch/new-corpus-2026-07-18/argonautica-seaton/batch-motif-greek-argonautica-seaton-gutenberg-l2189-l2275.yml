canonical_text:
  quote: ''
  summary: Lycus and the Mariandyni welcome the Argonauts after Amycus has been slain,
    honor Polydeuces, and host a feast. Jason recounts the expedition, and Lycus recalls
    Heracles' former deeds before offering his son Dascylus as guide, gifts, and cult
    honors for the sons of Tyndareus. After departing, the seer Idmon is fatally gored
    by a hidden boar; the boar is struck by Peleus and Idas. Idmon is mourned, buried
    with rites and sheep offerings, and his tomb is marked by a wild olive trunk connected
    with a later civic cult command attributed to Phoebus.
  language: English
  quote_policy: summarized
