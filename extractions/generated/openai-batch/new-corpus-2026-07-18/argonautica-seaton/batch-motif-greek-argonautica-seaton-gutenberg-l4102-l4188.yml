canonical_text:
  quote: ''
  summary: An armed man cuts the ship’s stern hawsers and the heroes row away with
    Medea. Aeetes and the Colchians learn of Medea’s acts, arm themselves, and launch
    a pursuit after Aeetes invokes Helios and Zeus and threatens his people if they
    fail to bring her back. Hera sends a favorable wind; the ship reaches the Halys,
    where Medea orders a sacrifice to Hecate whose details the narrator withholds.
    The heroes then consider prophetic guidance about a different route, and Argus
    describes ancient route-knowledge, graven maps, and the river Ister. A divine
    sign of heavenly light confirms the path, and the ship sails toward Ister.
  language: English
  quote_policy: summarized
