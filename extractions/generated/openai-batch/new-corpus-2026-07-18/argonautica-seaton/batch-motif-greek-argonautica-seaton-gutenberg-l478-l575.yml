candidate_motifs:
- id: motif:1
  label: Heroic departure by sea
  taxonomy_refs:
  - departure
  basis: The passage centers on Jason and the assembled heroes leaving the city for
    the prepared ship Argo at Pagasae.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage covers the departure phase rather than the later voyage or
    return.
- id: motif:2
  label: Community and family lament at the hero's departure
  taxonomy_refs:
  - departure
  - return
  basis: Women pray for return, Alcimede laments the loss of her only son, Aeson groans,
    and Jason tries to comfort them before leaving.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The requested return is only prayed for; no actual return occurs in this
    passage.
- id: motif:3
  label: Dangerous quest for a fleece from a distant ruler
  taxonomy_refs:
  - mystical_quest
  basis: The crowd explicitly connects the expedition with Aeetes and the fleece and
    describes the path and toil as hard for those who venture.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage mentions the goal and danger in public speech, but it does
    not narrate the acquisition of the fleece.
- id: motif:4
  label: Divine and oracular encouragement before departure
  taxonomy_refs:
  - wisdom
  basis: Jason tells his mother to take courage from Athena's promises and Phoebus'
    favorable oracles, along with the help of the chieftains.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The specific content of the promises and oracles is not given in this
    passage.
- id: motif:5
  label: Portentous speaking animal in remembered backstory
  taxonomy_refs: []
  basis: The women recall the ram as a dire portent that sent forth a human voice
    and link it to later sorrows.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The ram episode is alluded to in lament rather than narrated fully.
- id: motif:6
  label: Heroic radiance likened to a god
  taxonomy_refs: []
  basis: Jason's movement through the crowd is explicitly compared to Apollo going
    forth from shrines, and the heroes as a group are compared to gleaming stars.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: high
  cautions: These are explicit poetic comparisons, not assertions that the heroes
    are divine.
- id: motif:7
  label: Lineage-based collective heroic identity
  taxonomy_refs:
  - royal_legitimacy
  basis: The chiefs are called Minyae because the bravest claim descent from the daughters
    of Minyas, and Jason's maternal lineage is given through Alcimede, Clymene, and
    Minyas.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage establishes descent and group identity; it does not explicitly
    present a political claim to rule.
comparison_claims:
- id: claim:1
  claim: Jason's beauty and motion through the crowd are explicitly likened to Apollo
    going forth from sacred places.
  claim_level: visual_similarity
  target: Apollo leaving Delos, Claros, Pytho, or Lycia near Xanthus
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: This is an explicit poetic simile within the passage; it should not
    be read as identity between Jason and Apollo.
- id: claim:2
  claim: The heroes' appearance is explicitly likened to gleaming stars among clouds.
  claim_level: visual_similarity
  target: star-like heroic radiance
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is visual and poetic; the passage does not claim an
    astral origin or astral identity for the heroes.
