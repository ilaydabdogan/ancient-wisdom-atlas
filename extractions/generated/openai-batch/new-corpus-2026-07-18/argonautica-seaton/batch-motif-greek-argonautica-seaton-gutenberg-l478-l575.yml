canonical_text:
  quote: ''
  summary: The helpers of Jason assemble and are identified as Minyae by lineage.
    With the ship prepared, the heroes pass through the city toward the Argo at Pagasae
    while the crowd speculates about Pelias, Aeetes, the fleece, and the dangerous
    toil ahead. Women pray for the heroes' return and lament the grief of Jason's
    parents, recalling Helle, Phrixus, and the speaking ram. Alcimede clings to Jason
    and mourns that her only son is leaving; Jason comforts her by invoking divine
    allotment, Athena's promises, Phoebus' favorable oracles, and the aid of the chieftains.
    Jason leaves the house, is compared to Apollo in beauty, receives a silent hand-kiss
    from aged Iphias, priestess of Artemis, and reaches the Argo, where Aeastus and
    Argus arrive and the company sits for assembly.
  language: English
  quote_policy: summarized
