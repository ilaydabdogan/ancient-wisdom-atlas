  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Medea, in deadly fear, supplicates the comrades of Aeson’s son and touches
    the knees of Arete.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Medea tells Arete that she fled from fear rather than wantonness, invokes
    Helios and the rites of the night-wandering daughter of Perses as witnesses, says
    her maiden’s girdle remains untouched, and asks Arete to persuade Alcinous to
    mercy.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Medea tells the chieftains that she helped them yoke bulls, reap the earthborn
