  summary: The passage describes Drepane and variant sacred traditions about the sickle
    or reaping-hook beneath it, then narrates Argo’s arrival among the Phaeacians,
    the arrival and threats of the pursuing Colchians, Medea’s supplication to Arete
    and the Argonauts, the heroes’ oath to defend her, Medea’s sleepless anguish,
    and the beginning of Alcinous and Arete’s private deliberation about her.
  language: English
  quote_policy: summarized
