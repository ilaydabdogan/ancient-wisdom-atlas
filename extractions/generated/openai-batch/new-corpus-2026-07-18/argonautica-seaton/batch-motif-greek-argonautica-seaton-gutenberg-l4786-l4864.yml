  text: An island facing the Ionian gulf in the Ceraunian sea is described as fertile,
    having a harbour on both sides, and being called Drepane.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports traditions that a sickle or reaping-hook lies beneath
    the island and is identified either with Cronos’ weapon against his father or
    with Demeter’s reaping-hook.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Demeter is said to have dwelt on the island and taught the Titans to reap
    corn for the love of Macris.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Phaeacians are described as connected by birth with the blood of Uranus,
    and Drepane is called their sacred nurse.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Argo arrives among the Phaeacians after many toils, and Alcinous and his people
    welcome the arrivals with sacrifice and public rejoicing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A large Colchian host arrives in pursuit and seeks either to carry Medea back
