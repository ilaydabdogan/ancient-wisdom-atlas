canonical_text:
  quote: ''
  summary: Hypsipyle explains to Jason that Lemnos is without its adult men after
    marital conflict involving captured Thracian women, invites the Argonauts to settle,
    and offers Jason her father’s prerogative. Jason thanks her but declines the sovereignty
    because his quest must continue. The Lemnian women host the Argonauts, and divine
    desire is said to promote the island’s repopulation. Heracles later rebukes the
    crew for lingering and urges them to resume the quest for the golden fleece. The
    Argonauts depart amid lamenting farewells, and Hypsipyle asks Jason to remember
    her and to leave instructions if she becomes a mother.
  language: English
  quote_policy: summarized
