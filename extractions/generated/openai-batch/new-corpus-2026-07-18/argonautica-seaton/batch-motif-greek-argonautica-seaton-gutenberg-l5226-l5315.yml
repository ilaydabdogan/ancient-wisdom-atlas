canonical_text:
  quote: ''
  summary: The passage recounts the deaths and burials of Canthus and Mopsus in Libya,
    including Mopsus’ fatal bite by a serpent said to descend from drops of the Gorgon’s
    blood. The Argonauts then search unsuccessfully for a passage out of the Tritonian
    lake until Orpheus instructs them to offer Apollo’s tripod to the local gods.
    Triton appears in youthful form, gives Euphemus a clod of earth as a guest-gift,
    and directs the crew to the sea outlet and onward route.
  language: English
  quote_policy: summarized
