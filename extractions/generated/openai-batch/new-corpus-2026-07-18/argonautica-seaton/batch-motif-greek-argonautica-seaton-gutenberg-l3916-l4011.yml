canonical_text:
  quote: ''
  summary: The narrator invokes the Muse to recount Medea’s fearful flight from Colchis.
    Aeetes plots against the heroes, while Hera drives Medea into terror and flight.
    Medea nearly chooses death by drugs, then leaves a lock of hair for her mother
    and departs by magic. The Moon observes her and compares Medea’s passion for Jason
    to her own love for Endymion. Medea reaches the river, calls to Phrontis, and
    meets Jason and the sons of Phrixus. She begs for rescue, promises to lull the
    guardian serpent and give the golden fleece, and asks Jason to confirm his vows.
    Jason raises and embraces her, invoking Zeus and Hera as witnesses that he will
    marry her in Hellas.
  language: English
  quote_policy: summarized
