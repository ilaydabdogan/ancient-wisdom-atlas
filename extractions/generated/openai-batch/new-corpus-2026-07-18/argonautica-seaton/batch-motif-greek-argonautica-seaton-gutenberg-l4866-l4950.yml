canonical_text:
  quote: ''
  summary: Arete persuades Alcinous not to surrender Medea if she has become Jason’s
    wife. Alcinous gives a conditional judgment, Arete sends word to Jason, and the
    Argonauts arrange an urgent wedding for Jason and Medea in a sacred cave associated
    with Macris. The scene includes offerings, a bridal couch, the Golden Fleece,
    nymphs, armed heroes, and Orpheus’ marriage song; the narrator notes that necessity
    and fear hastened the marriage.
  language: English
  quote_policy: summarized
