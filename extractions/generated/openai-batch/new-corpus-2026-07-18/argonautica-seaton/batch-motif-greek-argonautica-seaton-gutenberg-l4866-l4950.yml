  basis: Jason and Medea are brought together in marriage in a sacred cave, with a
    bridal couch, Golden Fleece, flowers, nymphs, armed guardians, and Orpheus’ marriage
    song.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
