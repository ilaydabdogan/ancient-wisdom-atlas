canonical_text:
  quote: ''
  summary: Jason, under pressure from Aeetes, accepts a deadly contest involving bronze-footed
    fire-breathing bulls, ploughing, serpent-derived seed, and earthborn armed men.
    Medea watches Jason with concealed longing and fears for his death. Argus proposes
    seeking help from a sorcery-using maiden guided by Hecate, and Jason reports the
    impossible task to his companions, who despair before several heroes volunteer
    to face the danger.
