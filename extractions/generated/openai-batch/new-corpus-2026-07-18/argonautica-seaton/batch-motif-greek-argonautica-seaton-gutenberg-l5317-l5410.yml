canonical_text:
  quote: ''
  summary: The Argonauts receive friendly aid from Triton after Jason sacrifices a
    sheep and prays for homecoming; Triton reveals his true hybrid sea form and guides
    Argo to the sea. After further sailing and rowing, the heroes reach Crete, where
    the bronze guardian Talos blocks their landing by hurling rocks. Medea claims
    she can subdue him, invokes Death-spirits and hounds of Hades, bewitches Talos
    with a hostile glance, and Talos dies when his vulnerable ankle vein is pierced
    and his ichor flows out. The heroes then spend the night in Crete, build a shrine
    to Minoan Athena, draw water, and depart.
  language: English
  quote_policy: summarized
