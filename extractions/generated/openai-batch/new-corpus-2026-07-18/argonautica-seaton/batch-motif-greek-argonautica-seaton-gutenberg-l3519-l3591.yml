canonical_text:
  quote: "“I come here to thee both a suppliant and a stranger, bending the knee in
    my sore need.”"
  summary: Mopsus advises Jason to approach Medea alone at the temple, relying on
    Cypris’ help. Medea anxiously awaits him and is overcome when he appears. Jason
    speaks as a suppliant and stranger in a hallowed place, asks for the promised
    charms, invokes Hecate and Zeus, promises fame, and cites Ariadne’s rescue of
    Theseus as a precedent. Medea, moved by praise and love, gives him the charm from
    her girdle.
  language: English
  quote_policy: quoted
