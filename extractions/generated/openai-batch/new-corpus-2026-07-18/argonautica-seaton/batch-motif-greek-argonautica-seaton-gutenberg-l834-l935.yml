canonical_text:
  quote: ''
  summary: The passage recounts the Lemnian women’s slaughter of the island’s males
    after their husbands rejected them and after Cypris’ wrath fell upon the people.
    Hypsipyle alone spares her father Thoas by setting him adrift in a chest. The
    women, now armed and performing labor formerly done by men, mistake the approaching
    Argo for a Thracian threat. Aethalides, herald of the Argonauts and son of Hermes,
    negotiates with Hypsipyle. In assembly, Hypsipyle first proposes sending gifts
    to keep the strangers outside the city, while Polyxo urges the women to accept
    the men as protectors and future householders. Hypsipyle then sends Iphinoe to
    invite the Argonaut captain and men into the land and city peacefully.
  language: English
  quote_policy: summarized
