canonical_text:
  quote: ''
  summary: After Apsyrtus’ death, Colchians pursue Argo but are checked by divine
    lightning and settle abroad. The heroes receive aid from the Hylleans in exchange
    for Apollo’s protective tripod. The passage recounts Hyllus’ descent from Heracles
    and Melite, asks why Argo’s tracks are known far west, and explains that Zeus’
    wrath over Apsyrtus’ blood requires purification by Circe. Hera then drives the
    heroes by storm to Electra, where Argo’s Dodonian oak beam speaks and instructs
    them about Circe and prayers to the gods.
  language: English
  quote_policy: summarized
