  text: Sinope is said to have deceived Zeus, Apollo, and the river Halys when they
    desired her; no man subdued her in love.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Deileon, Autolycus, and Phlogius, sons of Deimachus, meet the chieftains,
    identify themselves, and sail with them when Argestes blows.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The heroes leave behind the river Halys, another nearby river, the Assyrian
    delta-land, and round the headland of the Amazons.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In an earlier event at the Amazon headland, Heracles captured Melanippe by
    ambush, and Hippolyte gave him her glistening girdle as ransom for her sister.
  category: action
