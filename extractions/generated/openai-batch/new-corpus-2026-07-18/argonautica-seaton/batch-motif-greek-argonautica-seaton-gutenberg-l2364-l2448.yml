canonical_text:
  quote: ''
  summary: 'The Argonauts make a series of coastal passages: they land near Sinope’s
    home, take aboard the sons of Deimachus, pass Amazon territory and the Thermodon,
    avoid battle with the Amazons through a renewed wind, and encounter or pass peoples
    marked by iron-working, childbirth role reversal, and inverted public/private
    customs. Near the island of Ares, birds of Ares attack the ship with weapon-like
    feathers, wounding Oileus before another bird is shot by Clytius.'
  language: English
  quote_policy: summarized
