candidate_motifs:
- id: motif:1
  label: woman secures virginity from divine suitors by requested boon
  taxonomy_refs:
  - divine_beloved
  basis: Sinope is desired by Zeus and Apollo, requests virginity as the promised
    boon, and is said to remain unsubdued in love.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The available taxonomy term emphasizes divine desire; the passage emphasizes
    Sinope’s refusal and craftiness rather than mutual beloved status.
- id: motif:2
  label: captive sister ransomed by precious girdle
  taxonomy_refs:
  - sacred_exchange
  basis: Heracles captures Melanippe, and Hippolyte gives her glistening girdle as
    her sister’s ransom; the captive is released unharmed.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents the exchange as ransom, not as theft.
- id: motif:3
  label: warrior women of divine parentage
  taxonomy_refs:
  - divine_parent_child
  basis: The Amazons are described as daughters of Ares and Harmonia, organized in
    tribes, and arming for war.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The taxonomy reference covers divine parent-child descent; the specific
    warrior-women pattern is more specific than the listed taxonomy.
- id: motif:4
  label: divine wind averts imminent battle and enables departure
  taxonomy_refs:
  - departure
  basis: The heroes would have fought the Amazons if breezes of Argestes from Zeus
    had not arrived and carried them away.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This is a local departure within a larger voyage, not the initial departure
    of the whole epic.
- id: motif:5
  label: ethnographic inversion of ordinary social roles
  taxonomy_refs: []
  basis: The Tibareni reverse childbirth-bed roles, and the Mossynoeci reverse the
    narrator’s norms for public and private conduct.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No supplied taxonomy reference directly matches social inversion.
- id: motif:6
  label: people defined by iron-working in fire and smoke
  taxonomy_refs: []
  basis: The Chalybes are characterized by lack of farming or herding, work on iron-bearing
    land, and heavy labor amid sooty flames and smoke.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage is ethnographic in form; no supplied motif-family reference
    directly matches metallurgy.
- id: motif:7
  label: sacred island birds attack with projectile feathers
  taxonomy_refs: []
  basis: Birds of Ares haunt the island; one launches a sharp feather that wounds
    Oileus, and another is shot by Clytius.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The birds are associated with Ares by name, but the passage does not further
    explain their origin or sacred status beyond that association.
