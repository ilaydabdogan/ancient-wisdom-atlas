canonical_text:
  quote: ''
  summary: Chalciope asks Medea to help the stranger win a dangerous contest for the
    sake of her sons. Medea promises secret aid with charms at Hecate’s temple, then
    spends the night in shame, fear, love, and suicidal deliberation. She nearly chooses
    a killing drug from her casket, but fear of Hades, thoughts of life, and Hera’s
    prompting turn her back toward giving the charms at dawn. Argus then leaves his
    brothers to learn Medea’s plans and returns to the ship.
  language: English
  quote_policy: summarized
