candidate_motifs:
- id: motif:1
  label: Secret magical aid for a dangerous contest
  taxonomy_refs:
  - mystical_quest
  basis: Chalciope asks for a trick or wise thought to help the stranger win; Medea
    promises secret charms at Hecate’s temple to spell the bulls before the contest.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:6
  - ev:10
  confidence: medium
  cautions: The broader quest context is only partly present in this passage; the
    extraction is limited to the contest and promised charms described here.
- id: motif:2
  label: Kinship plea overriding parental loyalty
  taxonomy_refs: []
  basis: Medea promises to value Chalciope and her sons before anything, asks secrecy
    from her parents, and later fears acting for a man against her father.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage states kinship, secrecy, and conflict with parents, but it
    does not resolve the family conflict within this excerpt.
- id: motif:3
  label: Love-stricken nocturnal deliberation
  taxonomy_refs: []
  basis: Medea remains awake at night because of love for Aeson’s son, fears for his
    life, and wavers among aid, refusal, endurance, and self-destruction.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: This is a passage-level emotional and narrative pattern rather than a
    taxonomy-linked motif family.
- id: motif:4
  label: Poison casket and averted self-destruction
  taxonomy_refs: []
  basis: Medea brings out a casket of healing and killing drugs, begins to choose
    a murderous drug, then stops because of fear of Hades and renewed attachment to
    life.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage presents contemplation and avoidance of death, not an actual
    death-and-return episode.
- id: motif:5
  label: Divine prompting of mortal resolve
  taxonomy_refs: []
  basis: After Medea recoils from the killing drug and thinks of life, the passage
    says she is changed by Hera’s prompting and resolves to give the charms.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage names Hera’s prompting but does not describe a visible epiphany
    or spoken divine command.
- id: motif:6
  label: Erotic pain as divine shafts and inner fire
  taxonomy_refs: []
  basis: Medea’s anguish is described as a smouldering fire, and the Loves are said
    to direct shafts of agony against the heart.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The pattern is expressed through simile and personification; it should
    not be treated as a literal attack scene without review.
