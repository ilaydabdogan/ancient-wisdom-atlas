- id: obs:3
  text: Medea uses beguiling words and charms to induce her brother to come to the
    goddess's temple, presenting the meeting as a plan involving the golden fleece
    and return to Aeetes' home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator apostrophizes Love as a source of deadly strife, lamentation,
    groans, pains, and Medea's accursed madness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Jason lies in ambush while Apsyrtus, deceived by the promises, crosses the
    sea alone at night and sets foot on the sacred island to meet his sister.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Jason leaps from ambush with a bare sword and strikes Apsyrtus near the temple
    of Artemis, while Medea covers her eyes with her veil so as not to see her brother's
    blood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: As Apsyrtus dies, he catches his blood in both hands and stains his sister's
    veil and robe; the Fury beholds the deed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Jason cuts off the extremities of the corpse, thrice licks up blood and thrice
    spits it out as an atonement for treacherous murder, and hides the body in the
    ground.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Medea raises the blaze of a torch as a sign to pursue; the Argonauts bring
    their ship near the Colchian ship and slaughter the Colchian host so that none
    escape.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Peleus advises embarking while it is still night and taking an unguarded passage;
