canonical_text:
  quote: ''
  summary: Medea and Jason plan to lure Apsyrtus with gifts, words, and charms. Apsyrtus
    comes alone by night to the sacred island of Artemis, where Jason ambushes and
    kills him while Medea turns away. Jason performs a blood-related atonement for
    the treacherous murder and hides the body. Medea then raises a torch signal, the
    Argonauts slaughter the Colchian crew, and Peleus advises a night escape toward
    the isle of Electra near the Eridanus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Medea says she will beguile Apsyrtus into Jason's hands if heralds can bring
    him alone, and she tells Jason to slay him if the plan pleases him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Medea and Jason agree on a plan of guile and prepare gifts, including a sacred
    crimson robe of Hypsipyle with Dionysiac provenance and fragrance.
  category: object
  evidence_refs:
