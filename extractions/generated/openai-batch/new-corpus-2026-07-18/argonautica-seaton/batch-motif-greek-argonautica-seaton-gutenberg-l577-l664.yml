canonical_text:
  quote: ''
  summary: The Argonauts prepare for departure. Heracles is acclaimed as leader but
    refuses, directing leadership to Jason. Jason orders sacrifice to Apollo, the
    launching and outfitting of the Argo, and the allocation of rowing places. The
    crew launches the ship, assigns benches and helm, builds an altar, brings sacrificial
    materials, and Jason prays to Apollo for guidance, safe return, and favorable
    wind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The equipment for the ship is said to be ready; the speaker says departure
    should not be delayed when breezes are fair, names a shared return to Hellas and
    path to Aeetes' land, and asks the group to choose the bravest leader for dealings
    with strangers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young heroes look toward Heracles and acclaim him as leader, but Heracles
    refuses the honor and says the hero who brought them together should lead the
    host.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Jason rises and tells the company to propitiate Phoebus with sacrifice, prepare
    a feast, drag the ship to the sea, place the tackle within it, draw lots for rowing
    benches, and build an altar to Apollo Embasius.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The crew prepares and launches the ship with rope, trench, rollers, and coordinated
    pushing; Tiphys directs the timing, the Argo glides into the sea, and the oars,
    mast, sails, and stores are placed aboard.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The rowing benches are distributed by lot, except that the middle bench is
    reserved for Heracles and Ancaeus; Tiphys is entrusted with guarding the helm.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: An altar to Apollo Actius and Embasius is raised near the sea with dried olive-wood
    logs; two steers, lustral water, and barley meal are brought for the rite.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Jason prays to Apollo, recalls the oracle at Pytho, asks the god to guide
    the ship and comrades safely outward and back to Hellas, promises later offerings,
    and asks for acceptance of the sacrifice and a prosperous wind.
  category: speech
  evidence_refs:
  - ev:7
