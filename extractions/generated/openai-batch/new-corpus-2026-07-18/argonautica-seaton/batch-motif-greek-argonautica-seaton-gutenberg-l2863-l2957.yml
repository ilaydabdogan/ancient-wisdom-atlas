  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hephaestus made the wondrous works in Aeetes’ palace, including bronze-mouthed
    and bronze-footed bulls that breathe fire and a plough of unbending adamant.
  category: object
  evidence_refs:
  - ev:3
