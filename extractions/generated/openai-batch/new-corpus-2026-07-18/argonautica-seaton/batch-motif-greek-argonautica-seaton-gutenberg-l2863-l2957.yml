canonical_text:
  quote: Hera with friendly thought spread a thick mist through the city
  summary: Hera conceals the visitors with mist until they reach Aeetes’ palace. The
    palace contains wondrous fountains and divine-made objects, including fire-breathing
    bronze bulls and an adamant plough made by Hephaestus. Medea, priestess of Hecate,
    is present in the palace; Chalciope rejoices at the return of her sons. Eros enters
    unseen and shoots Medea with an arrow, producing painful love for Aeson’s son.
    After baths and a meal, Aeetes questions his grandsons about their return and
    their companions.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Hera spreads a thick mist through the city so the visitors can reach Aeetes’
