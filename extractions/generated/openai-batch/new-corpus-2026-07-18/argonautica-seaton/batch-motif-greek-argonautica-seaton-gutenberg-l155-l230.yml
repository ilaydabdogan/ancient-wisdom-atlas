  summary: The passage discusses Apollonius’ quarrel with Callimachus, Alexandrian
    literary taste, and the structure and sources of the Argonautica. It summarizes
    the poem as an episodic voyage narrative centered on Jason’s expedition to Colchis
    and return, with a major Jason-Medea love episode, Pelias’ command to retrieve
    the golden fleece, Hera’s aid to Jason, and earlier Argonaut traditions including
    Pindar’s account.
