  quote: "“Not everything is it lawful for you to know clearly...”"
  summary: The Argonauts aid Phineus against the Harpies. Zetes and Calais pursue
    the Harpies until Iris stops them and swears by Styx that the Harpies will not
    return to Phineus. The Argonauts cleanse Phineus, sacrifice sheep, feast, and
    hear his guarded prophecy about the clashing Cyanean rocks, a dove-omen test,
    and the route toward Pontus, Acherusia, Acheron, and the abode of Hades.
  language: English
