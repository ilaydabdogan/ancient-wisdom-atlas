    and Eros departs from Olympus with bow and quiver. Meanwhile Jason counsels the
    Argonauts to approach Aeetes first with words rather than force in seeking the
    golden fleece. Jason and selected companions leave the ship and pass into Circe’s
    plain, where the Colchian custom of suspending male corpses from trees and burying
    women is described.
