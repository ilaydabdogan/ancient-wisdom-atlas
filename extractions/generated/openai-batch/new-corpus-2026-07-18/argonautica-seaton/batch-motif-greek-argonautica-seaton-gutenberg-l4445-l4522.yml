canonical_text:
  quote: ''
  summary: Argo sails into Eridanus, where Phaethon is said to have fallen burning
    from Helios’ chariot, and where the daughters of Helios lament and shed amber-like
    tears. A Celtic account is reported that identifies the amber with Apollo’s tears.
    The heroes suffer from the stench and lamentation, then travel by Rhodanus toward
    a dangerous branch leading to Ocean, until Hera warns them and guides their return
    path under protective mist. They reach the Stoechades safely with the aid of the
    sons of Zeus, then Aethalia, and finally Aeaea, where Circe is washing after a
    terrifying blood-and-fire dream and is followed by mixed-limbed creatures from
    primeval slime; the heroes recognize her as Aeetes’ sister.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Argo cries through darkness, the sons of Tyndareus rise and pray to the immortals,
    and the other Minyan heroes remain dejected.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Argo enters Eridanus, where Phaethon is said to have fallen half-consumed
    from Helios’ chariot after being struck by a blazing bolt.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The deep lake associated with Phaethon emits steam from a smouldering wound,
    and birds attempting to cross its water fall into flame.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The daughters of Helios are enclosed in tall poplars, wail piteously, and
    shed bright amber drops that dry on the sand and later roll into Eridanus when
    waters cover the strand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage reports a Celtic story that the amber-like drops are Apollo’s
    tears, shed when he went to the Hyperboreans after leaving heaven under his father’s
    rebuke concerning his son by Coronis.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The heroes lose desire for food and drink and are afflicted by the stench
    from the still-burning Phaethon and by the nightly lament of the daughters of
    Helios.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Rhodanus is described as rising near the ends of the earth, where the portals
    and mansions of Night are located, and as having outlets toward Ocean, the Ionian
    sea, and the Sardinian sea.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: A branch of the river is carrying the heroes toward a gulf of Ocean, which
    they are about to enter in ignorance and from which they would not have returned
    safely.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hera leaps from heaven, cries out from the Hercynian rock, shakes the firmament,
    and frightens the heroes into turning back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Because of Hera, the heroes note the ordained path of return and eventually
    reach the surging sea unharmed through Celtic and Ligyan peoples while Hera surrounds
    them with a dread mist.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The heroes reach the Stoechades islands safely by the aid of the sons of Zeus,
    for whom altars and sacred rites are established; Zeus also grants them power
    to aid future sailors.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: On Aethalia the heroes wipe away abundant sweat with pebbles, and the passage
    explains skin-colored pebbles, quoits, wondrous armour, and an Argoan harbour
    as traces connected to them.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: At Aeaea the heroes find Circe washing her hair and garments in salt sea-spray
    because she has been frightened by night visions.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Circe’s vision shows her chambers and palace walls running with blood, flame
    consuming magic herbs used to bewitch strangers, and Circe quenching the flame
    with murderous blood drawn up in her hands.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Mixed-limbed creatures, neither like wild beasts nor like human beings, follow
    Circe in a throng like sheep following a shepherd.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage says such shapeless creatures were produced from primeval slime
    before the earth was solid or moistened, and that time combined and ordered their
    forms.
  category: other
  evidence_refs:
  - ev:9
- id: obs:17
  text: The heroes are filled with wonder and infer from Circe’s form and face that
