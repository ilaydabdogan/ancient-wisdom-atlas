  quote: the serpent was keeping watch and ward over the fleece
  summary: The crew rows into the river near Colchis, sees Caucasus, Aea, the plain
    and sacred grove of Ares, and the serpent guarding the fleece on an oak. Jason
    pours libations to Earth, local gods, and dead heroes for aid and favorable omen.
    Ancaeus proposes counsel about approaching Aeetes, and by Argus's advice Jason
    has the ship anchored in a shaded backwater overnight.
