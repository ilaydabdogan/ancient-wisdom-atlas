canonical_text:
  quote: ''
  summary: Alcinous, carrying a golden staff of justice, proceeds under covenant to
    announce his decision about Medea. The Phaeacians gather with sacrifices, bridal
    gifts, music, and song; Hera is credited with prompting Arete’s wise counsel.
    Alcinous confirms the marriage by judgment and oaths, while the Colchians, fearing
    Aeetes, become comrades among the Phaeacians. Medea’s altars continue to receive
    yearly sacrifices. The Minyae depart with gifts and a breeze from Zeus, but a
    north wind drives them into the Libyan Syrtis, a no-return gulf of shoals, seaweed,
    sand, and dead calm. The ship is thrust ashore by the tide, and the heroes, including
    Ancaeus the helmsman, despair of return.
  language: English
  quote_policy: summarized
