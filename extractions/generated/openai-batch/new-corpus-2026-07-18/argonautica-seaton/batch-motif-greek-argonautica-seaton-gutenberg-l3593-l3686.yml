canonical_text:
  quote: ''
  summary: Medea instructs Jason in a nocturnal rite to Hecate, the use of a charm
    for temporary strength and protection, and a tactic for defeating warriors sprung
    from serpent teeth. She weeps over his expected departure and asks him to remember
    her. Jason describes his homeland, invokes Ariadne and Theseus as a comparison,
    and promises remembrance, honor, and marriage. Medea rejects the Ariadne comparison
    and again asks remembrance. The narrator states that Hera planned Medea’s departure
    to Iolcus as a bane to Pelias.
  language: English
  quote_policy: summarized
