candidate_motifs:
- id: motif:1
  label: Nocturnal sacrifice for supernatural empowerment
  taxonomy_refs:
  - sacrifice
  - initiation
  basis: Medea prescribes a solitary night rite involving bathing, a pit, whole ewe
    sacrifice, honey offering to Hecate, and a prohibition on turning back, followed
    by a charm that empowers Jason.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage gives the ritual sequence clearly, but the taxonomy label
    'initiation' is interpretive because the text frames it as preparation for a contest
    rather than a formal initiation.
- id: motif:2
  label: Temporary invulnerability and strength for a heroic ordeal
  taxonomy_refs:
  - mystical_quest
  basis: The charm gives Jason boundless prowess and protection from spearheads and
    bulls’ flame, but only for one day of the contest.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The broader quest frame is present through the fleece, but the passage
    focuses on a specific day’s contest.
- id: motif:3
  label: Warriors born from sown serpent teeth
  taxonomy_refs:
  - serpent
  basis: The passage states that serpent teeth are sown on the clods and that Giants
    or earthborn men spring up from the furrows.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The taxonomy reference is to the serpent element in the teeth; the earthborn-warrior
    pattern itself is not separately listed in the supplied taxonomy.
- id: motif:4
  label: Hero defeats generated enemies by making them destroy each other
  taxonomy_refs: []
  basis: Medea tells Jason to cast a heavy stone among the earthborn warriors so that
    they fight over it and slay one another.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No supplied taxonomy family precisely matches this tactical motif.
- id: motif:5
  label: Foreign helper enables hero to obtain a quest object
  taxonomy_refs:
  - mystical_quest
  basis: Medea’s counsel tells Jason how to survive the tasks and bear the fleece
    away from Aea.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage supports helper and quest-object elements, but does not itself
    describe the actual taking of the fleece.
- id: motif:6
  label: Promise of remembrance and marriage after rescue-aid
  taxonomy_refs:
  - covenant
  basis: Medea asks Jason to remember her; Jason promises remembrance, honor in Hellas,
    a bridal chamber, and love until death.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: medium
  cautions: The promise is spoken as emotional assurance; the passage does not present
    a formal oath or ritual covenant.
- id: motif:7
  label: Divinely planned departure from homeland as future bane
  taxonomy_refs:
  - departure
  basis: The narrator says Hera devised that Medea would come to Iolcus as a bane
    to Pelias, forsaking her native land.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The departure is foreshadowed rather than narrated within this passage.
- id: motif:8
  label: Culture-founding ancestors in homeland account
  taxonomy_refs:
  - culture_hero
  basis: Jason says Deucalion first founded cities, reared temples to the gods, and
    ruled over men, while Minyas built Orchomenus.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This motif appears in Jason’s explanatory speech and is secondary to the
    Medea-Jason episode.
comparison_claims:
- id: claim:1
  claim: The passage itself creates a cautious analogy between Medea’s role beside
    Jason and the Ariadne-Theseus-Minoss tradition, but immediately limits that analogy
    through Medea’s objection that Aeetes is unlike Minos and she is unlike Ariadne.
  claim_level: same_function
  target: Ariadne, Theseus, and Minos as invoked within Jason and Medea’s dialogue
  evidence_refs:
  - ev:5
  counter_evidence_refs:
  - ev:6
  confidence: medium
  limitations: The passage names Ariadne, Theseus, and Minos and frames a comparison,
    but it does not recount Ariadne’s deeds; the comparison is explicitly contested
    by Medea.
