canonical_text:
  quote: ''
  summary: Jason and the maiden go by night from the ship to the sacred grove where
    the golden fleece hangs on a huge oak. A sleepless serpent guarding the grove
    hisses and coils; the maiden invokes Sleep and the queen of the underworld, uses
    a juniper spray and mystic brew, and charms the serpent into sleep. At her bidding
    Jason takes the fleece from the oak, returns to the heroes at dawn, covers the
    fleece, seats the maiden at the stern, and urges the crew to begin the return
    while defending against Aeetes.
  language: English
  quote_policy: summarized
