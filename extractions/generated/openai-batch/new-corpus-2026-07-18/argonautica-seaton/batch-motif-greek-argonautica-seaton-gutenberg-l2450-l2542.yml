canonical_text:
  quote: ''
  summary: The Argonauts approach the island of Ares and use a noise-making shield-and-spear
    device, modeled on Heracles’ earlier use of a bronze rattle against Stymphalian
    birds, to drive off dangerous birds. The birds attack with feather-shafts but
    flee. The sons of Phrixus are then shipwrecked by a Zeus-sent storm, cling to
    a beam, and reach the island, where Argus appeals for aid as a suppliant and stranger.
    Jason questions them, and Argus recounts their descent from Phrixus, who reached
    Aea on a golden ram made by Hermes, sacrificed it to Zeus, and married Chalciope,
    daughter of Aeetes.
  language: English
  quote_policy: summarized
