canonical_text:
  quote: ''
  summary: Jason completes the ploughing task, refreshes himself with river water,
    and faces armed earthborn men rising from the field. Remembering Medea's counsel,
    he throws a great boulder among them and hides; the earthborn warriors attack
    one another. Jason then cuts down the remaining warriors, filling the furrows
    with blood. Aeetes grieves and returns to the city, pondering further opposition,
    as Jason's contest ends with the day.
  language: English
  quote_policy: summarized
