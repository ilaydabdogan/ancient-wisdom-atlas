canonical_text:
  quote: ''
  summary: At dawn near Pelion and Pagasae, Tiphys wakes the Argonauts to board Argo.
    The ship, containing a divine Dodona oak beam fitted by Athena, gives a strange
    cry urging departure. The heroes take their rowing stations; Jason weeps for his
    homeland; Orpheus' lyre accompanies the rowing. Gods, nymphs, Chiron, and Chiron's
    household witness and bless the departure. Tiphys steers the ship, sail and mast
    are set, Orpheus sings to Artemis, and fishes follow the ship. The Argonauts pass
    coastal landmarks, sacrifice sheep at the tomb of Dolops, and continue by wind
    and oar until reaching Lemnos.
  language: English
  quote_policy: summarized
