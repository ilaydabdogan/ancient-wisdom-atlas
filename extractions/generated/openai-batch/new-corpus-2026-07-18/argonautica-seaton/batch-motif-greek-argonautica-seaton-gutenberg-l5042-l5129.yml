canonical_text:
  quote: ''
  summary: The Argonauts, stranded in Libya and despairing of escape, prepare to die
    while the women lament. Libyan heroine-nymphs appear to Jason, identify themselves
    as warders of the land, recall the golden fleece quest, and give a cryptic instruction
    about recompensing their mother when Amphitrite loosens Poseidon’s car. Jason
    summons the crew and reports the vision. A monstrous golden-maned horse leaps
    from the sea and runs inland; Peleus interprets the omen to mean that their mother
    is the ship, which they must carry across the sandy wastes by following the horse’s
    tracks toward a bay.
  language: English
  quote_policy: summarized
