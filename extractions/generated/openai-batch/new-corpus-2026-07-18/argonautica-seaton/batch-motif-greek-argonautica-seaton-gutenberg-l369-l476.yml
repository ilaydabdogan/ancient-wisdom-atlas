candidate_motifs:
- id: motif:1
  label: gathering and departure of heroes for a voyage
  taxonomy_refs:
  - departure
  - mystical_quest
  basis: The passage repeatedly lists heroes who come, set out, follow, or are ready
    to be numbered in Jason's host, and it refers to Jason's voyage and the Colchian
    destination.
  evidence_refs:
  - ev:3
  - ev:10
  - ev:16
  - ev:19
  confidence: high
  cautions: The passage is a catalogue rather than a full narrative of the voyage's
    departure.
- id: motif:2
  label: divine parentage and divine gifts marking heroic status
  taxonomy_refs:
  - divine_parent_child
  basis: 'Several heroes are identified as sons or descendants of gods, or as receiving
    divine gifts: Phlias from Dionysus, Idmon from Leto''s son, Augeias from Helios,
    Euphemus and others from Poseidon, Palaemonius from Hephaestus, and Zetes and
    Calais from Boreas.'
  evidence_refs:
  - ev:1
  - ev:5
  - ev:10
  - ev:12
  - ev:13
  - ev:15
  - ev:17
  confidence: high
  cautions: Some parentage is explicitly marked as report or repute, so individual
    genealogical certainty varies inside the passage.
- id: motif:3
  label: prophetic knowledge before the quest
  taxonomy_refs:
  - wisdom
  basis: Idmon has learned his fate by augury and is taught prophecy through birds
    and burning sacrifice; Jason is also recalled as going to Pytho for a response
    concerning his voyage.
  evidence_refs:
  - ev:5
  - ev:16
  confidence: high
  cautions: The passage does not state the content of the prophecy or response.
- id: motif:4
  label: battle-time shapeshifting gift
  taxonomy_refs:
  - shapeshifter
  basis: Periclymenus receives from Poseidon the ability to take whatever shape he
    desires in the stress of battle.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage states the power but does not narrate an actual transformation.
- id: motif:5
  label: heroic same-birth pair
  taxonomy_refs:
  - sacred_twins
  - sibling_pair
  basis: Polydeuces and Castor are Leda's dearly loved sons, born at one birth and
    sent together from Sparta.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage emphasizes same-birth pairing and heroic skill, but does not
    here narrate a twin myth episode.
- id: motif:6
  label: abduction and forced union by a divine wind figure
  taxonomy_refs:
  - stolen_beloved
