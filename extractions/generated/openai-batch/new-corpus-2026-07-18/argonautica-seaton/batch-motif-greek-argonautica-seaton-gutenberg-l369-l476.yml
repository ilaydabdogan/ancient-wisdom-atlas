canonical_text:
  quote: ''
  summary: A catalogue of heroes joining Jason's host names their origins, genealogies,
    divine parentage or gifts, special abilities, weapons, guardians, and reasons
    for departure. It includes Heracles and Hylas, Idmon the prophet, Castor and Polydeuces,
    Periclymenus the shape-changer, Euphemus who moves over the sea, the winged sons
    of Boreas, and others ready to be numbered among the company.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage repeatedly lists heroes who came from particular cities or regions
    to join the host gathered by Aeson's son/Jason.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  - ev:8
  - ev:13
  - ev:17
- id: obs:2
  text: Heracles hears of the heroes' gathering, puts down a chained live boar at
    Mycenae, sets out despite Eurystheus, and is accompanied by Hylas, who is to bear
    his arrows and guard his bow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: Nauplius is given a Danaid and Poseidon-linked lineage and is described as
    surpassing all men in naval skill.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:4
  text: Idmon knows his fate through augury but comes for renown; he is begotten by
    Leto's son and taught prophecy through birds and burning sacrifice.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:5
  text: Leda sends Polydeuces and Castor from Sparta; they are born at one birth and
    are skilled with swift-footed horses.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:6
  text: Lynceus and Idas come from Arene with great strength, and Lynceus is said
    to have sight that reaches beneath the earth.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:7
  text: Periclymenus is given boundless strength by Poseidon and the ability to take
    whatever shape he craves in battle.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:8
  text: Ancaeus son of Lycurgus joins after his father sends him; his armour has been
    hidden to delay departure, and he instead wears a Maenalian bear-skin and carries
    a two-edged battleaxe.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: Augeias, reputed son of Helios and ruler of the Eleans, desires to behold
    Colchian land and Aeetes.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:10
  text: Euphemus, son of Poseidon, is described as able to skim the grey sea without
    wetting his feet, touching only the tips of his toes to the watery path.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:11
  text: Erginus and Ancaeus, both called sons of Poseidon, leave their seats and boast
    skill in seacraft and war.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:12
  text: Oeneus sends Laocoon, an older brother of Oeneus, to guard the youthful Meleagrus,
    and Iphiclus accompanies them.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:13
  text: Palaemonius is reputed son of Lernus but said to have birth from Hephaestus;
    although crippled in his feet, his bodily frame and valor are not scorned.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:14
  text: Iphitus previously hosted Jason when Jason went to Pytho to seek a response
    concerning his voyage.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:15
  text: Boreas snatches Oreithyia from Cecropia near Hissus' stream, carries her to
    the rock of Sarpedon near the river Erginus, wraps her in dark clouds, and forces
    her to his will.
  category: action
  evidence_refs:
  - ev:17
- id: obs:16
  text: Zetes and Calais, sons of Boreas and Oreithyia, are described with dusky wings
    at their ankles that gleam with golden scales, and their hair is shaken by the
    wind as they rise.
  category: attribute
  evidence_refs:
  - ev:18
- id: obs:17
  text: Acastus and Argus are also ready to be numbered in the host; Argus is called
    a helper of Athena.
  category: action
  evidence_refs:
  - ev:19
