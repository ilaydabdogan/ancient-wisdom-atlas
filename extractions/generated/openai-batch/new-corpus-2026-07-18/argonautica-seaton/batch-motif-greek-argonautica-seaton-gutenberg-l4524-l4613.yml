canonical_text:
  quote: ''
  summary: Jason and Medea come to Circe’s hall as suppliants after the killing of
    Aeetes’ son. Circe performs rites to cleanse their murder-guilt, questions Medea,
    rebukes her shameful flight, but does not harm her because she is both suppliant
    and kinswoman. Medea and Jason depart. Hera then orders Iris to summon Thetis
    and to tell Hephaestus and Aeolus to restrain fire and winds so Argo may pass
    safely toward the Phaeacian isle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Circe leads the heroes by gesture, and Jason and Medea follow the same path
    to Circe’s hall.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jason and Medea sit silently at Circe’s hearth in the manner of suppliants;
    Medea hides her face and Jason fixes in the ground the sword with which he slew
    Aeetes’ son.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Circe recognizes the situation as involving suppliants and murder-guilt and
    begins a cleansing sacrifice in reverence for Zeus as god of suppliants.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Circe holds a young sow above their heads, cuts its neck, sprinkles their
    hands with blood, and makes drink offerings to Zeus the Cleanser.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Naiad attendants carry defilements from the palace while Circe burns atonement-cakes
    without wine and prays to avert the Furies and obtain Zeus’s favor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the rites, Circe seats Jason and Medea on polished seats and asks about
    their business, voyage, origin, and suppliant posture at her hearth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Circe recognizes Medea as belonging to the race of Helios by a golden gleam
    from the eyes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Medea speaks in the Colchian tongue about the heroes’ quest, their journeyings
    and contests, her wrongdoing, and her flight from her father, but she does not
    tell of Apsyrtus’ murder.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Circe perceives the omitted murder, pities Medea, and tells her that Aeetes
    will seek vengeance for his son’s blood.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Circe says she will devise no further ill against Medea because Medea is both
    suppliant and kinswoman, but orders her to leave and refuses approval of her flight.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Medea veils her eyes with her robe, laments, and Jason leads her out of Circe’s
    hall.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hera learns from Iris that Jason and Medea have left Circe’s hall and commands
    Iris to summon Thetis, to tell Hephaestus to still the blasts of fire, and to
    tell Aeolus to calm the winds except for the west wind.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Iris flies from Olympus, enters the Aegean Sea at Nereus’ dwelling, summons
    Thetis, has Hephaestus cease his hammering and bellows, delivers Hera’s message
    to Aeolus, and Thetis comes from the sea to Hera on Olympus.
  category: sequence
  evidence_refs:
  - ev:10
