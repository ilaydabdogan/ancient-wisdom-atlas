canonical_text:
  quote: ''
  summary: At the farm of Amycus, king of the Bebrycians, Amycus confronts the voyagers
    and declares that no stranger may depart without boxing him. Polydeuces accepts
    the challenge on behalf of his comrades. The combatants prepare with garments
    removed and raw-hide gauntlets bound. Amycus presses with violent force, while
    Polydeuces evades, studies him, and finally strikes him above the ear, killing
    him; the Minyan heroes rejoice.
  language: English
  quote_policy: summarized
