canonical_text:
  quote: ''
  summary: At dawn the heroes sail onward and encounter Anthemoessa, island of the
    Sirens. The Sirens’ song nearly draws the crew ashore, but Orpheus overcomes it
    with his lyre; Butes alone leaps into the sea and is rescued by Cypris. The ship
    then reaches Scylla, Charybdis, and the Wandering Rocks, where Thetis and the
    Nereids guide and lift Argo through the dangerous waves while gods look on. The
    heroes then pass Thrinacia, where Helios’ white cattle and sheep are tended by
    Phaethusa and Lampetia, and continue sailing by night and dawn.
  language: English
  quote_policy: summarized
