canonical_text:
  quote: ''
  summary: Jason is sent toward Hypsipyle after the Lemnian women infer that Thoas
    is dead and Hypsipyle is queen. Jason wears a splendid purple mantle given by
    Athena, decorated with several mythic scenes, and carries a spear given by Atalanta.
    He enters the city like a bright star, is admired by the women, and is led by
    Iphinoe to sit opposite Hypsipyle, who blushes and addresses him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hearers are pleased by the speech; they think Thoas is dead, regard Hypsipyle
    as queen, send Jason on his way, and prepare to depart.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jason wears a double-fold purple mantle made by the Tritonian goddess and
    given by Pallas when she laid the keel-props of the Argo and taught him to measure
    timbers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mantle is described as blazing, red in the middle, purple at the ends,
    and woven with many separate devices along each margin.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: One woven scene shows Cyclops forging a thunderbolt for Zeus; the thunderbolt
    still lacks one ray, and flame issues from it as they hammer it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another woven scene shows Amphion and Zethus laying the foundations of Thebe;
    Zethus lifts a mountain peak, while Amphion sings on a golden lyre and a large
    rock follows him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Another woven scene shows Cytherea holding the swift shield of Ares, with
    her reflected image visible in the bronze shield.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Another woven scene shows oxen in a wooded pasturage where Teleboae or Taphian
    raiders fight the sons of Electryon; the meadow is drenched with blood, and the
    many overpower the few herdsmen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'Another woven scene shows two chariots racing: Pelops drives in front with
    Hippodameia, while Myrtilus drives in pursuit with Oenomaus, whose axle breaks
    as he tries to strike Pelops.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Another woven scene shows young Phoebus Apollo shooting at Tityos, who is
    dragging Apollo's mother by her veil; Tityos is described as born of Elate and
    given a second birth by Earth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Another woven scene shows Phrixus the Minyan appearing to listen to a ram
    that appears to speak, creating the expectation of wise speech.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Jason holds a far-darting spear given by Atalanta as a hospitality gift; Atalanta
    had wanted to join the quest, but Jason stopped her because he feared strife on
    account of her love.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Jason walks to the city compared to a bright star seen by maidens; the women
    of the city follow behind him, he keeps his eyes on the ground, and Iphinoe seats
    him opposite Hypsipyle.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: Hypsipyle turns her eyes aside, blushes, and addresses Jason with crafty words.
  category: speech
  evidence_refs:
  - ev:11
