candidate_motifs:
- id: motif:1
  label: divine epiphany at dawn during voyage
  taxonomy_refs:
  - mystical_quest
  basis: Apollo appears to the voyaging heroes at twilight or dawn, with visible divine
    attributes and effects on island and sea.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The available taxonomy has no exact 'epiphany' category; 'mystical_quest'
    is a broad fit because the appearance occurs within the Argonauts' journey.
- id: motif:2
  label: propitiatory sacrifice and libation to a deity
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Orpheus directs sacrifices and libations to Apollo, and the heroes build
    an altar and burn thigh bones on it.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives a specific Greek ritual setting; broader classification
    should not erase the local cultic details.
- id: motif:3
  label: vow of future offering in exchange for safe return
  taxonomy_refs:
  - sacred_exchange
  - return
  basis: Orpheus says that if Apollo grants safe return to Haemonian land, the heroes
    will lay horned-goat thighs on his altar.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage states a conditional vow but does not narrate its later fulfillment
    in this excerpt.
- id: motif:4
  label: communal oath of mutual aid sealed by libations and sacrifice
  taxonomy_refs:
  - covenant
  basis: The heroes swear to help one another with concord of heart, using holy libations
    and touching the sacrifice.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The oath is among companions rather than a treaty between peoples; 'covenant'
