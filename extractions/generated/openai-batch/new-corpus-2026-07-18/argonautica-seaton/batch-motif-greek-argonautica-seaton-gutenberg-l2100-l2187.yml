canonical_text:
  quote: ''
  summary: The Argonauts row past several rivers and landmarks, reach Thynias at dawn,
    and witness Apollo passing overhead. Orpheus proposes naming the island for Apollo
    of the Dawn and offering sacrifice and libations. The heroes build an altar, sacrifice,
    dance, sing a hymn including Apollo's slaying of Delphyne, and swear mutual aid
    with libations, later associated with a temple of Concord. They depart and arrive
    at the Acherusian headland, described with cliffs, plane trees, a cave of Hades,
    icy vapors, and the outfall of the Acheron, before landing nearby.
  language: English
  quote_policy: summarized
