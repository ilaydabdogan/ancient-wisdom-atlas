canonical_text:
  quote: ''
  summary: Medea and Jason part after a private meeting; Medea returns distracted
    and tearful, while Jason reports her counsel and charm to the Argonauts. Envoys
    receive from Aeetes the dragon teeth connected with Cadmus and the earthborn people.
    At night Jason performs a sacrifice to Hecate Brimo with bath, robe, pit, sheep,
    fire, and libations; Hecate appears with serpents, torches, hell-hounds, trembling
    meadows, and shrieking nymphs. At dawn Aeetes arms himself and rides by chariot
    to witness the contest, compared to Poseidon in his chariot.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Medea's handmaids grieve silently at a distance while the time requires Medea
    to return to her mother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Medea delays departure because she delights in Jason's beauty and words; Jason
    proposes that they leave before being noticed and meet again.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Jason returns joyfully to his comrades and ship, while Medea returns by chariot
    to the city and palace without attending to her handmaids.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chalciope questions Medea in grief for her sons, but Medea is distracted,
    silent, seated low by her couch, tearful, and reflecting on the deed she has helped
    by counsel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Jason tells the assembled heroes the maiden's counsels and shows them a dread
    charm; Idas alone sits apart in anger.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At daybreak Telamon and Aethalides go to Aeetes to ask for the seed, and Aeetes
    gives them the teeth of the Aonian dragon for the contest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The dragon teeth are linked to Cadmus, who came seeking Europa, slew the warder
    of Ares' spring at Thebes, and sowed teeth that produced an earthborn people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At night Jason goes secretly to a deserted meadow beneath the open sky, after
    Argus brings a ewe and milk from the flock.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Jason bathes in the sacred river, dons a dark robe from Hypsipyle, digs a
    cubit-deep pit, slaughters the sheep, places the carcass above the wood, kindles
    fire, pours libations, and calls on Hecate Brimo for aid in the contests.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Hecate hears Jason from the depths and comes to the sacrifice with serpents
    among oak boughs, countless torches, howling hell-hounds, trembling meadows, and
    shrieking marsh and river nymphs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Fear seizes Jason, but he does not turn around as he returns to his comrades
    before dawn rises over snowy Caucasus.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Aeetes arms himself with Ares' corslet, a golden four-plumed helmet, shield,
    spear, and chariot, then drives with a multitude to the contest.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Aeetes' chariot appearance is compared to Poseidon riding by chariot to various
    sacred or contest places.
  category: relationship
  evidence_refs:
  - ev:9
