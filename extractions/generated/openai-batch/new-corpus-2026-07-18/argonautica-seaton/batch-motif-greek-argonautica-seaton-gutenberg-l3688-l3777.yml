candidate_motifs:
- id: motif:1
  label: hero assisted by maiden's counsel and charm before trial
  taxonomy_refs:
  - mystical_quest
  basis: Medea's counsels and dread charm are reported by Jason immediately before
    preparations for Aeetes' contest.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage shows aid and emotional attachment, but the full outcome of
    the trial is outside the excerpt.
- id: motif:2
  label: dragon teeth as seed producing or threatening earthborn warriors
  taxonomy_refs:
  - serpent
  basis: The teeth of the Aonian dragon are called seed for the contest and are linked
    to Cadmus' sowing of an earthborn people.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The excerpt recounts Cadmus' sowing but does not yet narrate Jason's use
    of the seed.
- id: motif:3
  label: nocturnal sacrifice to a dread goddess for contest-aid
  taxonomy_refs:
  - sacrifice
  - initiation
  basis: Jason performs a night rite with bathing, robe, pit, ewe, fire, libations,
    and invocation of Hecate Brimo for aid in the contests.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The initiation label is interpretive and rests on the rite's placement
    before the contest.
- id: motif:4
  label: epiphany of a chthonic or terrifying goddess with serpents, torches, and
    hounds
  taxonomy_refs:
  - serpent
  - fire
  basis: Hecate comes from the depths with serpents in oak boughs, countless torches,
    and howling hell-hounds, causing meadow and nymph reactions.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage supplies the imagery directly; broader cultic interpretation
    should be reviewed.
- id: motif:5
  label: divine or heroic gift transmission of potent dragon remains
  taxonomy_refs:
  - sacred_exchange
  - serpent
  basis: The Tritonian goddess removes the dragon teeth and bestows them as a gift;
    Aeetes then gives them for Jason's contest.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage uses gift language for the earlier divine bestowal; Aeetes'
    later giving is contest-related rather than a mutual exchange.
- id: motif:6
  label: dragon-slayer founder of an earthborn people
  taxonomy_refs:
  - culture_hero
  - serpent
  basis: Cadmus slays the spring-warder dragon, sows the teeth, and founds an earthborn
    people from those left after Ares' reaping.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is an embedded backstory rather than the main action of the excerpt.
comparison_claims:
- id: claim:1
  claim: The passage explicitly presents Aeetes' chariot procession to the contest
    as visually comparable to Poseidon riding by chariot to named places.
  claim_level: visual_similarity
  target: Poseidon as divine charioteer in epic simile
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is a narrative simile, not a claim that Aeetes and Poseidon
    share identity or cult function.
- id: claim:2
  claim: The passage connects Jason's coming contest with the Cadmus dragon-teeth
    tradition by identifying Aeetes' contest seed as the same kind of dragon teeth
    formerly sown by Cadmus to produce an earthborn people.
  claim_level: same_motif
  target: Cadmus' sowing of dragon teeth and earthborn people
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The excerpt gives the Cadmus precedent and the transfer of teeth but
    does not narrate Jason's sowing or the contest result.
