canonical_text:
  quote: ''
  summary: The Argonauts steer Argo through the clashing rocks after sending a dove
    ahead. The dove escapes with clipped tail-feathers, and Argo nearly founders amid
    waves and currents. Athena pushes back one rock and drives the ship through; the
    rocks then become fixed forever, as destined when a man should pass alive. Tiphys
    attributes the escape to Athena and recalls Phineus’ counsel. Jason voices fear
    for the quest and his comrades, tests their morale, and is strengthened by their
    cheering response.
  language: English
  quote_policy: summarized
