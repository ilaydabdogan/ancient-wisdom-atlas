canonical_text:
  quote: ''
  summary: The passage presents a royal exemplum about a Shah valuing executed bodies
    as proof of his law, a rebuke of the Ring-dove's repeated lament for Yusuf through
    the story of Jacob, and a bird's question to the Tajidar about how weak birds
    can reach the Symurgh on the Mountain. The Tajidar answers with teaching about
    creatures as shadows of divine essence, return to the Fount of Being, union with
    the central Soul of Things, and purification of the inner mirror.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Shah returns to his capital while subjects decorate the city, acclaim him,
    kneel, and throw jewels and gold before his horse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People in the public prison, lacking pearl or gold, throw severed heads and
    carcasses over the wall as their welcome.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Shah stops at the prison welcome, smiles, throws silver and gold to the
    prisoners, and explains that the severed bodies show his will and law done rather
    than merely spoken about.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: An unseen Ring-dove repeats the name Yusuf in a broken sorrowful note until
    it is checked for idle sighing and warned by an example concerning excessive mourning.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Jacob is described as forlorn after Yusuf is torn from his father's home,
    repeating Yusuf's name until a heavenly bird says God wearies of that word and
    Jacob's lips are sealed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Jacob sees Yusuf in a night vision, stops after sighing instead of uttering
    the forbidden word, but a sterner angel says the forbidden word was contained
    in the sigh; the excess of passion blinds his aged eyes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After many birds argue, inquire, and excuse themselves, a smaller modest bird
    asks the Tajidar how weak birds can reach the Mountain and whether the Symurgh
    will hear, see, or own them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Tajidar answers that the birds are long-exiled from the Fount of Being,
    from which they came and to which they must re-flow, and describes created beings
    as shadows quickened by one ray of divine creative will.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Tajidar warns against confusing copy and type, compares incorporation
    to water refined into wine, and contrasts lower forms tending to clay with one
    who springs to merge in the central Soul of Things.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Tajidar instructs the hearer to prepare the breast and the mysterious
    mirror set there, so the reflected image may be clear of distortion, doubleness,
    and sin.
  category: speech
  evidence_refs:
  - ev:10
