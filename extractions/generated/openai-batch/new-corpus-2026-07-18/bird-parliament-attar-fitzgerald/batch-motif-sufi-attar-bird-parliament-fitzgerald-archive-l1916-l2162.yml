canonical_text:
  quote: ''
  summary: The Tajidar addresses the birds' fear about approaching a great monarch
    and teaches that the true gift is the soul and self, with the sovereign's presence
    as the only reward. He tells a parable of Shah Mahmud, who visits a poor furnace-feeder
    in disguise and later offers him great reward; the poor man asks only for the
    Shah's continued presence. Encouraged, the birds call for the road and a guide,
    confirm the Tajidar by lot, crown him leader, and hear him proclaim a perilous,
    unprecedented road beginning with the Vale of Search, a maze of hazards where
    the command is to go forward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The birds respond to the Tajidar with fear and doubt, worrying about how they
    could approach a monarch greater than Mahmud without gold, jewels, or rich gifts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says that one who would engage with this monarch should bring
    the gold dust of pilgrimage, the ruby of a bleeding heart, and naked beggary,
    because the sovereign receives only the giver's soul and self.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the inserted story, Shah Mahmud walks through the streets in disguise,
    comes to the baths, and sits by a poor furnace-feeder with a water-jug, bread,
    loaf, and cup.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The poor furnace-feeder welcomes the unknown visitor, and after repeated meetings
    Mahmud reveals that he is the Sultan and offers the man any largess, even a throne.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The poor man asks only that the Shah continue to visit his lowly home, saying
    the Shah's presence makes it a palace.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After hearing the tale, the birds are stirred again, forget the danger of
    the long travel, and cry for the road and for a guide.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The birds choose the Tajidar by lot, then set a royal crown on his head and
    install him as captain and deputy of the lost Khalif.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Tajidar describes a road that no wing, foot, or heart had imagined, crossing
    waterless deserts, shoreless waters, valleys, cloud-high mountains, dust, fire,
    and hostile elements.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The road grows in self-sacrifice, contains cries and groans of those who have
    not prevailed, is marked by bones of those who failed, and may offer no return.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The first place named is the Vale of Search, described as an endless maze
    with many entrances but one right way, pitfalls, gulfs, precipices, fiery dust,
    predators, snake, ghoul, false fruit, and receding water.
  category: setting
  evidence_refs:
  - ev:9
  - ev:10
