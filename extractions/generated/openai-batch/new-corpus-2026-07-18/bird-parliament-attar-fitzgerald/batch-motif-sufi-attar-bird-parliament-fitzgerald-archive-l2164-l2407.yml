canonical_text:
  quote: "“He only knew the Flame who in it burn'd; / And only He could tell who ne'er
    to tell return'd.”"
  summary: 'The passage describes the pilgrim’s progress through darkness toward the
    Mountain Range of Knowledge, Kaf’s misted peak, the one sea into which worlds
    and forms dissolve, and the threshold of union. It then prescribes austerity and
    self-negation as a pyre of self-annihilation from which a phoenix-like spark blends
    with the One Eternal Essence. A concluding parable tells of moths seeking the
    flame: only the moth that burns in the sacred fire truly knows it and does not
    return to report.'
