canonical_text:
  quote: '"Thousands may knock for one that enters in."'
  summary: A heavenly voice and the Tajidar describe the Royal Road and Royal Palace
    as difficult and exclusive. The gathered birds respond with enthusiasm, though
    some begin to raise objections. The Pheasant questions the Tajidar's precedence
    and receives an answer about Sulayman's choice and the unpredictability of Allah's
    grace. The Tajidar illustrates royal favor through a story of Shah Mahmud and
    a poor fishing boy. The Nightingale then sings of its exclusive devotion to the
    Rose and questions why it should pursue another goal.
  language: English
  quote_policy: quoted
