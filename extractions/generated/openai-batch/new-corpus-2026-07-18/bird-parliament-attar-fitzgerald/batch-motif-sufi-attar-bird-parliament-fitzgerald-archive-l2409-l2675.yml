canonical_text:
  quote: ''
  summary: A vast host of birds is overcome by fear before a terrible journey. Many
    abandon the expedition or die along the way from harsh terrain, elements, hunger,
    predators, despair, or violence. A remnant reaches Kaf, and thirty battered birds
    arrive at the threshold of the Everlasting One. A fiery angel questions them;
    the Tajidar answers that they seek admission and the fount from which they flow.
    They are brought before a blazing throne, where a scroll reveals each soul's history.
    After confession and casting off the old self, they see in the glory a transfigured
    figure of themselves. A voice teaches that guide, road, sin, remorse, pilgrimage,
    arrival, and selves are all movements of the One toward itself, like drops returning
    to the sea and rays returning to the sun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the Tajidar ceases speaking from a high station, the prospect of the
    journey produces dread among the birds.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many birds slip away to woods and nests; others spend their remaining strength
    in preparation and never depart.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the first valley, a dark wilderness and a violent wind described as edged
    with flames or snow freeze the birds' feathers; a multitude rises briefly and
    then flees, reducing the caravan to less than half.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Further travelers stop, stray, turn back, fall behind, or die from travel,
    heat, cold, drought, drowning, famine, poison, predators, madness, self-killing,
    or fighting over grain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A handful reaches Kaf, described as having feet in the Seven Seas; only thirty
    damaged birds reach the threshold of the Everlasting One.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A winged harbinger of flame, also called an Angel and Tongue of Fire, asks
    who the arrivals are, where they came from, and why they have come.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Tajidar answers for the thirty, saying they are diminished and disfigured
    fractions of being seeking admission at the treasury door.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Angel says that the one they seek does not need a count of beings by quantity
    or kind, because he is the universal fount of being.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The spokesman asks to see the fount from which they flow and, in seeing it,
    to lose themselves there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The thirty are suddenly before a throne and a majesty wrapped in an insufferable
    blaze that forces down their gaze.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: A lightning-like scroll flashes back to each bird the half-forgotten story
    of its soul; the passage compares this to Yusuf giving his brethren a writing
    connected with their sale of their brother.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The thirty respond with confession and self-loathing, cast off the rags of
    carnal self, and are described as reclothed in the soul's integrity.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: When they raise their eyes again, they see in the center of glory a figure
    of themselves transfigured, and the passage blurs which is seer and which is seen.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A voice says that seeing and being pass through the sun or glass, that apparent
    selves are fractions of the All, and that drops, atoms, and rays return to their
    source.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:15
  text: The voice identifies sin, remorse, guide, obstacle, pilgrim, pilgrimage, road,
    and arrival as itself moving toward itself.
  category: speech
  evidence_refs:
  - ev:7
