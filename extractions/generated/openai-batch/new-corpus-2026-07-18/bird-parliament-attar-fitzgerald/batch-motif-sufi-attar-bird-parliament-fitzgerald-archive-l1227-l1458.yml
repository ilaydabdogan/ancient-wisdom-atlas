canonical_text:
  quote: Thyself to Self-annihilation give / That this false Two in that true One
    may live.
  summary: A spiritual leader teaches that the apparent duality of self and Self is
    false and that self-annihilation leads to conscious return into unity. The assembled
    birds react with awe and then present doubts about comprehension, sin, inconsistency,
    and love. The leader answers with illustrative stories about Shah Mahmud and a
    soldier, divine mercy toward repentance, Gabriel finding an accepted prayer from
    an idol-worshipper, and a Queen of Egypt testing a lover’s willingness to die.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker says the seeming Double is false, the One is true, and self-annihilation
    allows the false Two to live in the true One.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker uses images of heart, shadow, sun, mirror, centre, ray, and eternal
    All to describe recognition of the shadow-self and conscious return to unity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the speech, the feathered host is held in silence and amazement before
    timid murmurs arise from some who fear or pretend too much.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some birds say they are willing to go the indicated way but are slow to understand
    and fear failing on the long mysterious errand.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wise leader tells them to do their best in hope and faith, because the
    one who fixed the race also knows the runner’s strength.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Shah Mahmud story, the Sultan sends a soldier by the shortest road
    to reach the sick Ayas, and the soldier rides across desert, valley, mountain,
    and stream to the palace.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The soldier finds the Sultan already beside Ayas and fears death, but the
    Sultan says the soldier did his best according to the road he knew.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Other birds come bowed with penitence and shame, saying they are entangled
