candidate_motifs:
- id: motif:1
  label: self-annihilation into unity
  taxonomy_refs:
  - annihilation_union
  basis: The opening teaching explicitly urges self-annihilation so that the false
    Two may live in the true One.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is doctrinal and metaphorical; extraction keeps the motif
    at the passage’s own level of imagery.
- id: motif:2
  label: mystical quest under guidance despite limited understanding
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The birds fear they cannot understand the long errand, and the leader instructs
    them to do their best in hope and faith.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The actual destination of the quest is not described in this excerpt.
- id: motif:3
  label: sincere best effort accepted despite lesser knowledge
  taxonomy_refs:
  - wisdom
  basis: The Shah Mahmud story explains that the soldier is not condemned because
    he rode the nearest road he knew, although the Sultan knew a shorter one.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The story is used as an analogy within the passage, not as an independent
    quest narrative.
- id: motif:4
  label: repentance restored by mercy
  taxonomy_refs: []
  basis: The leader tells penitent birds that a broken weapon should not be cast away
    and that mercy can make a broken branch blossom if repentance is true.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No available taxonomy ref directly names repentance; no external category
    is added.
- id: motif:5
  label: divine mercy exceeds prophetic or angelic accounting
  taxonomy_refs:
  - divine_judgment
  basis: God reproves the Prophet over Karun’s denied pardon and later transfers angelic
    merit to rescue the spiritually bankrupt at judgment.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage emphasizes mercy within judgment rather than judgment alone.
- id: motif:6
  label: extinguished lamp of human fallibility relit
  taxonomy_refs: []
  basis: Man is compared to a child whose lamp is repeatedly put out by passion and
    relit by the sender.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is an explicit simile rather than a narrative event.
- id: motif:7
  label: sincere intention outweighs correct outward knowledge
  taxonomy_refs:
  - wisdom
  basis: Gabriel finds that Allah’s perfect acceptance answers the prayer of one bowing
    to an idol but worshipping the True as best he knows.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage frames the worshipper’s act as outwardly false but inwardly
    directed toward the True.
- id: motif:8
  label: divided allegiance causes spiritual forfeiture
  taxonomy_refs:
  - duality
  basis: Inconstant souls alternate between saint and sinner and are warned through
    images of patching truth’s garment and a scale wavering between rise and fall.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The motif is moral-allegorical and stated through images rather than a
    complete tale.
- id: motif:9
  label: lover tested by willingness to die
  taxonomy_refs:
  - sacrifice
  basis: The Queen of Egypt tests whether her admirer will accept death after union;
    his choice to flee proves, in her judgment, that he does not truly love.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The Queen is not identified as divine in the passage, so no divine-beloved
    taxonomy is assigned.
comparison_claims:
- id: claim:1
  claim: 'The Shah Mahmud story functions as an internal analogue to the birds’ fear
    of inadequate comprehension: both emphasize acceptance of sincere effort within
    limited knowledge.'
  claim_level: same_function
  target: the birds’ concern about failing the long mysterious errand
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: This is an intra-passage functional comparison, not a claim of historical
    relationship.
- id: claim:2
  claim: The Gabriel story repeats the passage’s pattern that good will can prevail
    over correct knowledge, as the narrative introduction itself states.
  claim_level: same_function
  target: pattern of good will beyond mere knowledge
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the supplied passage’s explicit framing.
- id: claim:3
  claim: 'The Queen of Egypt story has the same moral function as the warnings against
    inconstancy: divided or self-preserving commitment leads to loss.'
  claim_level: same_function
  target: warning against divided allegiance and forfeiture
  evidence_refs:
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not explicitly state the Queen story is an allegory
    of the preceding scale image, though the sequence supports a cautious functional
    connection.
