canonical_text:
  quote: ''
  summary: The birds assemble in a formal council to seek or choose a sovereign. Tajidar
    the Wise, marked as one who has traveled the road and reached the goal, tells
    them that he knows the Khalif and the way to him, but that they must undertake
    the journey themselves. He describes the hidden Presence of Symurgh on the world-hinging
    mountain Kaf, surrounded by the mingling seven seas, and warns that the road is
    long, dangerous, possibly lifelong, and requires courage, purification, and the
    sacrifice of worldly wisdom. The passage then begins a separate scene in which
    holy Bajazyd leaves the city at night to meditate alone under the moon and stars.
  language: English
  quote_policy: summarized
