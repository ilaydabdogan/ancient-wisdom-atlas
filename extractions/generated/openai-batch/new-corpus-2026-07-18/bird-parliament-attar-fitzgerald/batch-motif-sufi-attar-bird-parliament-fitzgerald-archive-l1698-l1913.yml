canonical_text:
  quote: ''
  summary: 'The passage gives a series of moral exempla: worldly glory and wealth
    end in ruin; the world is likened to a spider trapping its victims; the soul is
    burdened by sin and attachments; the Prophet learns that a clay vessel made from
    human remains turns sweet water bitter; Yusuf''s cup and God''s judgment reveal
    all deeds; Sultan Mahmud is warned to keep his vow to give battle spoils to dervishes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Several figures associated with power or wealth are said to have ended in
    downfall: Pharaoh''s chariots drowned, Karun went underground with his gold, Nembroth
    toppled, and Schedad vanished among his roses.'
  category: sequence
  evidence_refs:
  - ev:1
