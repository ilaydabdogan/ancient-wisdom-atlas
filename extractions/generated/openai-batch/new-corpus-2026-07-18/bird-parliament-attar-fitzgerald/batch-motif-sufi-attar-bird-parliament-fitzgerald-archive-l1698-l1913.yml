  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage describes stages of human life in which childhood, youth, mature
    sensual desire, ambition, and old-age greed are linked with sin or desire.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sin is compared to a hateful beast that can devour its feeder and to a plague
    hatched within and pampered by the soul.
  category: attribute
  evidence_refs:
  - ev:5
