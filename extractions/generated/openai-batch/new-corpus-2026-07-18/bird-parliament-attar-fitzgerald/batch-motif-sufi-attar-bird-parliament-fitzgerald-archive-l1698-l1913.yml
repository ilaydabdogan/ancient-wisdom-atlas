- id: motif:8
  label: postmortem disclosure of all deeds
  taxonomy_refs:
  - divine_judgment
  basis: After death, words, thoughts, and deeds rise into Heaven's cup, which God
    strikes to tell the story by which each person stands or falls.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The image of the cup is specific to the passage; the broader taxonomy
