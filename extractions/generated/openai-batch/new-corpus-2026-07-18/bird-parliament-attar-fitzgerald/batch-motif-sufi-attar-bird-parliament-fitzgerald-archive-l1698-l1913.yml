candidate_motifs:
- id: motif:1
  label: worldly power and wealth end in ruin
  taxonomy_refs:
  - wisdom
  basis: The passage lists rulers or wealthy figures whose glory, gold, structures,
    or pleasures end in disappearance or destruction.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The taxonomy reference is broad; the passage gives moral exempla rather
    than a single formal mythic episode.
- id: motif:2
  label: deceptive world as devouring trap
  taxonomy_refs:
  - wisdom
  basis: The world is depicted as a spider whose web traps and consumes victims until
    a superior master sweeps it away.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No available taxonomy symbol directly corresponds to spider or web.
- id: motif:3
  label: soul's descent into embodied struggle
  taxonomy_refs:
  - mystical_quest
  basis: The soul descends from heaven at birth, begins a race on earth, and struggles
    with a clinging imp of sin.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The larger quest context is not extracted from this passage alone; within
    this passage the focus is moral struggle.
- id: motif:4
  label: inner sin fed by the self
  taxonomy_refs:
  - wisdom
  basis: Sin is described as an inward plague or beast nourished by the soul and capable
    of consuming its feeder.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This is primarily an ethical image rather than a narrative motif.
- id: motif:5
  label: worldly attachments obstruct following the true master
  taxonomy_refs:
  - mystical_quest
  basis: The passage warns that even consecrated bonds may clog footsteps to the world
    beyond and gives the Arab chieftain's son and colt as attachments.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage's language supports spiritual detachment, but the exact quest
    structure remains implicit.
- id: motif:6
  label: dead human matter transformed into a speaking vessel
  taxonomy_refs:
  - death_rebirth
  basis: The vessel says its clay was once a man, returned to earth, was dug by the
    potter, and was recast as bowl and urn while retaining anguish.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage describes transformation of matter and memory, not literal
    personal rebirth.
- id: motif:7
  label: sweet water turned bitter by mortal anguish
  taxonomy_refs:
