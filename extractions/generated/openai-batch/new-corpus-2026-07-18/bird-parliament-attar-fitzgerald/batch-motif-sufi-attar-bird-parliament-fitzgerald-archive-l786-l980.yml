canonical_text:
  quote: ''
  summary: 'Several birds give reasons for attachment or self-importance: a bird values
    rubies, the Shah-Falcon values royal service, the Phoenix claims superiority to
    kings, and the Duck claims ritual purity. The Tajidar or Leader answers with warnings
    and exempla about jewels, Sulayman''s signet, dangerous royal favor, the accountability
    of kingship, and the difference between outward ritual cleanliness and inward
    purity.'
  language: English
  quote_policy: summarized
