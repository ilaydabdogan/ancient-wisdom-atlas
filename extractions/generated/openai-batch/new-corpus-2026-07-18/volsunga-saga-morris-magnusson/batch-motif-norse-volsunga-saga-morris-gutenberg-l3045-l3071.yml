  summary: Sigurd rides to Heimir's dwelling, where Heimir's family connections to
    Bekkhild and Brynhild are explained. The household marvels at Sigurd, welcomes
    him, receives and guards his treasure, and admires the valuable arms, armor, vessels,
    and rings. Sigurd stays there in honor while fame of his dragon-slaying spreads,
    and the people share recreations involving weapons, arrows, and falcons.
