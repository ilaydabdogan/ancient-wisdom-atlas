canonical_text:
  quote: "“I swore an oath to wed the man who should ride my flaming fire”"
  summary: Sigurd and Brynhild speak after a disputed marriage and remembered oath.
    Brynhild laments betrayal, rejects life with Gunnar while desiring Sigurd, and
    recalls her oath to wed the man who rode her flaming fire. Sigurd admits his love
    and grief, offers to wed her and put away Gudrun, and his byrny bursts from the
    force of his emotion. Brynhild then presses Gunnar to kill Sigurd and Sigurd’s
    son. Gunnar, though oath-bound to Sigurd, resolves to seek Sigurd’s death and
    proposes using young Guttorm, who is outside the oaths.
  language: English
