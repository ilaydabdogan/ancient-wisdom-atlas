canonical_text:
  quote: |-
    Rather dead warriors
    May wend their ways homeward.
  summary: Dag sacrifices to Odin for vengeance and kills Helgi with Odin's spear.
    Sigrun curses Dag and laments Helgi. Helgi is buried in a barrow and goes to Valhall,
    where Odin gives him high status. A bondmaid sees Helgi and dead warriors riding
    toward the mound; the dead say warriors may go homeward. Sigrun enters the mound,
    mourns Helgi's corpse, hears that her tears fall as blood on him, and prepares
    a bed beside him.
  language: English
  quote_policy: quoted
