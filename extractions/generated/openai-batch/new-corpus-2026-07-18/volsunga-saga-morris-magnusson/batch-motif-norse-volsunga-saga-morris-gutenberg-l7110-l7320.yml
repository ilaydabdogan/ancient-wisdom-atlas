canonical_text:
  quote: ''
  summary: The passage introduces Gudrun’s vengeance against Atli and his household,
    then narrates Atli’s sending of Knefrud to lure Gunnar to his hall with promises
    of wealth. Hogni interprets Gudrun’s wolf-wrapped ring as a warning, but Gunnar
    chooses to go. The brothers ride through wild terrain to Atli’s land, where Gudrun
    warns them of betrayal. After fighting, Gunnar is bound and asked to ransom his
    life with gold; he demands Hogni’s bleeding heart first.
  language: English
  quote_policy: summarized
