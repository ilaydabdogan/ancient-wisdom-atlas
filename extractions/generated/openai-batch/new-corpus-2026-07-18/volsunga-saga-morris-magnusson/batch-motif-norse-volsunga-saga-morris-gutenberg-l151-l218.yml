  text: Scando-Gothic peoples are described as moving southward and westward over
    Europe, shaking empires, founding kingdoms, meeting Greek and Roman peoples in
    conflict, and levying tribute.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the sons of earlier invaders, their own kin, stopped the
    landward march of the Northmen in the time of Charlemagne, closing the land road
