  text: The Vikings are said to have taken tribute from the Anglo-Saxons, who are
    described as nearer kin to them than is usually thought.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Ireland, Vikings are said to have founded kingdoms at Limerick and Dublin,
