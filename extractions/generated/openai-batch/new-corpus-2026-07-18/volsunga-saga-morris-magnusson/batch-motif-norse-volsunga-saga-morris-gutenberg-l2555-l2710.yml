canonical_text:
  quote: ''
  summary: After Fafnir has been slain, Regin returns to Sigurd, praises the deed,
    and laments that his own brother has been killed. Sigurd cuts out Fafnir's heart,
    and Regin asks him to roast it. When Sigurd tastes the heart-blood, he understands
    the speech of birds, who warn him that Regin intends treachery, advise him to
    kill Regin, take Fafnir's treasure, and seek Brynhild on Hindfell. Sigurd beheads
    Regin, eats part of Fafnir's heart, rides to Fafnir's underground lair, takes
    the gold and named treasures, and departs on Grani after mounting the horse.
  language: English
  quote_policy: summarized
