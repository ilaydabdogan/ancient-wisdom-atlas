  quote: ''
  summary: The excerpt presents a series of eleven counsels or redes addressed to
    a king. The speaker advises guiltless conduct, true oaths, caution at the Thing,
    avoidance of witches and dangerous women on the road, sexual restraint, avoidance
    of drunken fighting, preference for open battle over hall-burning, care for dead
    bodies found in the field, distrust of enemy kin, the need for wit and weapons,
    vigilance toward friends, and warns that trouble is already arising.
  language: English
  quote_policy: summarized
