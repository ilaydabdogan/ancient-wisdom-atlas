canonical_text:
  quote: ''
  summary: The passage narrates Volsung’s unusual birth after his mother’s prolonged
    pregnancy and fatal delivery; his marriage to Ljod; the birth of his children,
    including the twins Sigmund and Signy; the building of a hall around the Branstock
    oak; Siggeir’s betrothal to Signy; the arrival of an ancient one-eyed man who
    places a sword in the tree; Sigmund’s successful drawing of the sword; Siggeir’s
    anger; and Signy’s warning that the marriage will bring evil.
  language: English
  quote_policy: summarized
