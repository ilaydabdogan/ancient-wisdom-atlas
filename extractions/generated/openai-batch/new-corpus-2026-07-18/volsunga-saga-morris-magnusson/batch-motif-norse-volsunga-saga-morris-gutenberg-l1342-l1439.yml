canonical_text:
  quote: ''
  summary: Sigmund trains Sinfjotli for vengeance in the woods. They find enchanted
    wolf-skins, put them on, live and fight in wolf-shape, and later heal Sinfjotli
    with an herb revealed through animals before burning the skins. When Sinfjotli
    is grown, Sigmund and Sinfjotli hide at King Siggeir's hall with Signy's knowledge.
    Signy's children discover them; Sinfjotli kills the children after Sigmund refuses.
    Siggeir's men capture the two avengers, and the king prepares a stone-and-turf
    barrow with a dividing stone for their punishment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sigmund considers Sinfjotli too young for revenge and first trains or hardens
    him by ranging through woods and killing men for wealth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sigmund and Sinfjotli find a house containing two sleeping spell-bound skin-changers
    and hanging wolf-skins.
