canonical_text:
  quote: ''
  summary: After praise of Sigurd's unmatched worth, Gudrun laments his death, withdraws
    into the wild, and stays with Thora in King Alf's hall. She finds some solace
    in needlework depicting heroic scenes. Grimhild, Gunnar, and their company come
    to make atonement; Gunnar gives Gudrun a harmful drink whose ingredients and blood-reddened
    letters cause her to forget their guilt. Grimhild offers gifts and presses Gudrun
    to marry Atli. Gudrun resists, foretells evil and revenge, but is compelled to
    consent. She travels to Atli's hall, where a bridal feast is held, though the
    marriage is joyless for her.
  language: English
  quote_policy: summarized
