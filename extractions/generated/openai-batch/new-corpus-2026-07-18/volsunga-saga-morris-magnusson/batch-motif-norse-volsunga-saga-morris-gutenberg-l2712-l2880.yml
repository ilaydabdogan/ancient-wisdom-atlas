canonical_text:
  quote: ''
  summary: Sigurd rides to Hindfell, sees a fire-like light and a shield-hung castle,
    enters, and awakens an armed sleeping woman by cutting away her byrny. The woman,
    Brynhild, identifies Sigurd and recounts that Odin placed a sleep-thorn on her
    after she opposed his promised victory in battle. Sigurd asks her for lore, and
    she gives him a beaker called a drink of love while teaching several kinds of
    runes and their practical uses.
  language: English
  quote_policy: summarized
