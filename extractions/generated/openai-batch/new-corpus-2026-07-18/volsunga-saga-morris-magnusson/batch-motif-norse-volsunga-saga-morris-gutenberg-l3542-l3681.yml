canonical_text:
  quote: ''
  summary: Gudrun and Brynhild quarrel over Sigurd, Gunnar, the riding of the flaming
    fire, and the ring Andvari's-loom. Gudrun reveals that Sigurd, not Gunnar, rode
    the fire, lay beside Brynhild, and took the ring. Brynhild recognizes the ring,
    becomes grief-stricken and silent, accuses Gudrun and Grimhild of deceit, says
    Sigurd forgot her because of an evil drink, and later lies sick as if dead while
    Gunnar comes to question her.
  language: English
  quote_policy: summarized
