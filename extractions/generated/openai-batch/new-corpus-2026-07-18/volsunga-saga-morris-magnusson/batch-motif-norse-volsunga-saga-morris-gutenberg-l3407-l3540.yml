candidate_motifs:
- id: motif:1
  label: bride won by passing through encircling fire
  taxonomy_refs:
  - sacred_marriage
  - initiation
  basis: Brynhild's father and foster-father link marriage to her own choice, and
    Heimir says she will likely accept only the man who rides through the fire around
    her hall; Sigurd performs that deed in Gunnar's likeness and invokes Brynhild's
    oath.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage frames the act as a wooing ordeal and oath condition; broader
    ritual or sacred-marriage interpretation requires comparison beyond this passage.
- id: motif:2
  label: substitution of a disguised proxy in wooing
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: Gunnar cannot cross the fire, so Sigurd and Gunnar change semblances; Sigurd
    enters Brynhild's hall as Gunnar and wins her compliance with the condition.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:9
  - ev:14
  confidence: high
  cautions: The text calls it changing semblances, but does not explain the mechanism
    beyond Grimhild's teaching.
- id: motif:3
  label: fire as boundary and ordeal
  taxonomy_refs:
  - initiation
  basis: The fire physically surrounds Brynhild's hall and prevents Gunnar's approach,
    while Sigurd's successful crossing marks the decisive qualification for the wooing.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:8
  confidence: high
  cautions: The fire's origin and full cosmological meaning are not explained in this
    passage.
- id: motif:4
  label: chaste bed-sharing with a sword barrier
  taxonomy_refs:
  - sacred_marriage
  basis: Sigurd and Brynhild lie in one bed for three nights, but Sigurd places Gram
    between them and gives an explanation for doing so.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage states the action and Sigurd's explanation but does not explicitly
    interpret the sword's symbolic function.
- id: motif:5
  label: ring exchange in a concealed or ambiguous betrothal context
  taxonomy_refs:
  - sacred_exchange
  basis: Brynhild gives Sigurd Andvari's-loom, which he had previously given her,
    and Sigurd gives her another ring from Fafnir's hoard during the disguised wooing
    episode.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The exchange is explicit, but its full legal or emotional meaning depends
    on earlier and later saga context not included here.
- id: motif:6
  label: remembered prior troth conflicting with public marriage
  taxonomy_refs:
  - stolen_beloved
  basis: Brynhild tells Heimir that Sigurd is her first troth-plight and beloved,
    yet Gunnar is publicly wedded to Brynhild at the feast; Sigurd later remembers
    his oaths to Brynhild.
  evidence_refs:
  - ev:15
  - ev:17
  - ev:18
  confidence: medium
  cautions: The passage implies conflict between former vows and the later marriage,
    but does not yet narrate the consequences.
