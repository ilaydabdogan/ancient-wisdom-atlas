canonical_text:
  quote: ''
  summary: Gunnar seeks to woo Brynhild, whose father and foster-father say she must
    freely choose her husband and that only the man who rides through the fire around
    her hall is likely to win her. Gunnar fails to pass the fire, borrows Grani, and
    still fails. Sigurd and Gunnar exchange semblances; Sigurd, appearing as Gunnar,
    rides Grani through the flames, enters Brynhild's hall, claims her according to
    her oath, spends three nights beside her with the sword Gram placed between them,
    receives Andvari's ring from her, and gives her another ring. Sigurd returns through
    the fire, exchanges semblances back with Gunnar, and later Gunnar is wedded to
    Brynhild. Brynhild privately tells Heimir she believes only Sigurd could have
    performed the deed and entrusts Aslaug, her daughter by Sigurd, to him.
  language: English
  quote_policy: summarized
