canonical_text:
  quote: ''
  summary: 'Glaumvor tells Gunnar ominous dreams before his journey: a bloody sword
    pierces him while wolves howl, and sorrowful women choose him. Gunnar interprets
    or accepts these signs in terms of danger and fate. Despite warnings and weeping
    farewells, Gunnar, Hogni, and companions depart by ship and horse, reach a fortified
    burg filled with armed men, break through the shut gates, hear Vingi reveal the
    treacherous purpose of the invitation, and kill him.'
  language: English
  quote_policy: summarized
