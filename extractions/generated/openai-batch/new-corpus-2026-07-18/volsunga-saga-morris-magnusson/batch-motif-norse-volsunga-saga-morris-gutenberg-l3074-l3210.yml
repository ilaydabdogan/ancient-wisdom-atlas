  summary: Brynhild resides in Heimir's bower and embroiders Sigurd's deeds in gold.
    Sigurd's hawk leads him to a tower window where he sees Brynhild; he becomes joyless,
    then visits her. They share wine, embrace, discuss fate, warfare, and Gudrun,
    and exchange vows with a gold ring. The passage then introduces Gudrun and the
    Giuking family, and Gudrun reports a dream of a golden-feathered hawk on her wrist.
