canonical_text:
  quote: ''
  summary: King Volsung and his sons sail to Gothland at King Siggeir's invitation.
    Signy warns them of Siggeir's treachery, but Volsung refuses to flee. Siggeir's
    army defeats them; Volsung is slain and his ten sons are bound. At Signy's request
    they are placed in stocks, where a she-wolf devours one brother each night until
    only Sigmund remains. Signy sends honey to be put on Sigmund, enabling him to
    kill the wolf and break free. Some say the wolf was Siggeir's mother transformed
    by witchcraft. Sigmund then hides in the woods with Signy's help.
  language: English
  quote_policy: summarized
