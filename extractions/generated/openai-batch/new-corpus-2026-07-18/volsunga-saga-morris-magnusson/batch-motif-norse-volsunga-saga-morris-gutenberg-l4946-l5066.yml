canonical_text:
  quote: ''
  summary: After Atli mocks Gudrun over the deaths of her brothers, she proposes a
    funeral feast while concealing revenge. She kills the two sons she shares with
    Atli, tells Atli he has eaten their hearts and drunk their blood mixed with wine,
    then conspires with Niblung, son of Hogni, to kill Atli in his sleep. Atli dies
    after requesting honorable treatment of his corpse; afterward fire is cast into
    the hall.
  language: English
  quote_policy: summarized
