  quote: ''
  summary: 'The passage recounts the deaths of Hjalli and Hogni by heart-cutting,
    Gunnar’s refusal to reveal the Niblung hoard, Gunnar’s killing in a venomous worm
    enclosure while playing a harp, and Gudrun’s revenge on Atli: she serves him the
    hearts of their sons, gives out gold, wounds him in bed, and burns the hall and
    household.'
