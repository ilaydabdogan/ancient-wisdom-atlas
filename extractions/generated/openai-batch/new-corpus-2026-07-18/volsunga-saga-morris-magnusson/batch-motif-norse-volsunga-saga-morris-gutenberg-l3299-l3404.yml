canonical_text:
  quote: ''
  summary: Sigurd rides with treasure and war-gear on Grani to King Giuki's hall,
    where he is welcomed and admired. Grimhild sees his attachment to Brynhild and
    gives him a horn of drink after which his memory of Brynhild leaves him. Sigurd
    is incorporated into Giuki's family by oath, marries Gudrun, swears brotherhood
    with Gunnar and Hogni, and later gives Gudrun a serpent's heart, making her greater-hearted
    and wiser. Grimhild then urges Gunnar to woo Brynhild with Sigurd's help.
  language: English
  quote_policy: summarized
