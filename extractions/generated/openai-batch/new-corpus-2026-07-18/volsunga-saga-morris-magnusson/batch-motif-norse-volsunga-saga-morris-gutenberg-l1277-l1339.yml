canonical_text:
  quote: ''
  summary: Signy arranges to exchange appearances with a witch-wife, visits Sigmund's
    earth-house in disguise, and shares his bed for three nights. After changing back,
    she bears Sinfjotli, tests his endurance by sewing gloves through his flesh and
    skin, and sends him to Sigmund. Sinfjotli kneads a deadly worm or serpent into
    meal; Sigmund explains their differing capacities to withstand venom.
  language: English
  quote_policy: summarized
