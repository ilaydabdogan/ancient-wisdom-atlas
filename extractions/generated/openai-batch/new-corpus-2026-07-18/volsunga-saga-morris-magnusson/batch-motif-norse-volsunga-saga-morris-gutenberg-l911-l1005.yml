canonical_text:
  quote: ''
  summary: The passage begins the Volsung lineage with Sigi, called the son of Odin.
    Sigi kills the thrall Bredi after Bredi surpasses him in hunting, conceals the
    body in a snow-drift, lies about it, and is outlawed when the body is found. Odin
    accompanies Sigi away to war-ships; Sigi becomes a successful raider and king,
    with a son named Refir/Rerir. After Sigi is killed by his wife's brothers, Rerir
    regains the kingdom and kills his father's slayers. Rerir and his wife are childless
    and pray to the gods; Odin and Freyia hear them, and Freyia sends a maid in crow-gear
    with an apple. The apple reaches the king and is eaten partly by the queen, who
    becomes pregnant. Rerir later goes to war, falls sick, and dies intending to go
    to Odin.
  language: English
  quote_policy: summarized
