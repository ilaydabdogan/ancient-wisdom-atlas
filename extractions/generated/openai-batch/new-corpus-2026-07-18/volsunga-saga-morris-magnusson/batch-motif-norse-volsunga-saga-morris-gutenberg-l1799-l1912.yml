canonical_text:
  quote: ''
  summary: Hjordis chooses Sigmund as husband over King Lyngi. Lyngi later attacks
    Sigmund in Hunland. Hjordis is hidden in the wood with a bondmaid and wealth while
    Sigmund and Eylimi fight. In battle, a one-eyed man identified by an endnote as
    Odin breaks Sigmund's sword, after which Sigmund's fortune departs and he falls.
    Hjordis finds him wounded; he refuses healing, foretells her unborn son, and instructs
    her to preserve the sword shards for the future sword Gram. After Sigmund dies
    at dawn, Hjordis and the handmaid exchange clothing and names when Alf's ships
    arrive.
  language: English
  quote_policy: summarized
