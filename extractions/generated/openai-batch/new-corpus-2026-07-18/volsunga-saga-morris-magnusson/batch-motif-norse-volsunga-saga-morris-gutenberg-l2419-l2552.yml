canonical_text:
  quote: ''
  summary: Sigurd and Regin go to the great track by which Fafnir crawls to water.
    Regin advises Sigurd to dig a pit and stab the worm, but a bearded old man appears
    and tells Sigurd to make several pits so the blood can drain away. Sigurd follows
    this advice and wounds Fafnir fatally with his sword from beneath. As he dies,
    Fafnir questions Sigurd’s identity, warns that the gold and Regin will bring danger,
    answers questions about the Norns and a cosmological holm, and dies while Sigurd
    resolves to take the treasure.
  language: English
  quote_policy: summarized
