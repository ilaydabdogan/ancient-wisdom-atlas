canonical_text:
  quote: ''
  summary: 'After men drink and sleep, Kostbera examines runes and detects hidden,
    deceptive cutting beneath them. She warns Hogni against leaving home and reports
    several dreams: rivers breaking the hall and the brothers'' legs, a burning cloak,
    a bear destroying the king''s high-seat and gathering people into its mouth, and
    an erne drenching the hall in blood, which she takes as Atli''s double. Hogni
    dismisses each warning with mundane explanations and asserts that Atli is friendly.'
  language: English
  quote_policy: summarized
