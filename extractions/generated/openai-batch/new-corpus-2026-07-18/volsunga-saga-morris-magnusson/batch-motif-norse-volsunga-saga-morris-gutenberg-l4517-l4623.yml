canonical_text:
  quote: ''
  summary: Atli recounts ominous dreams to Gudrun, who interprets them as foretelling
    death and disaster. Atli then schemes to obtain Sigurd's gold, now held by Gunnar
    and his brethren, by inviting them to his hall. Gudrun suspects treachery and
    sends runes and a wolf-hair token, but Vingi alters the message. Gunnar and Hogni
    receive the messengers; Hogni notices the warning sign, but Gunnar, drunk and
    enticed by dominion, pledges to go, and Hogni reluctantly agrees to follow.
  language: English
  quote_policy: summarized
