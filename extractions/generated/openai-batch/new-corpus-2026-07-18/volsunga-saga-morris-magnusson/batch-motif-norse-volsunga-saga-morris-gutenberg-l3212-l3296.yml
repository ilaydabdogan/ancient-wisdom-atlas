canonical_text:
  quote: ''
  summary: Gudrun discusses a dream-image of a beloved hawk, then travels with women
    to Brynhild's gold-adorned hall on a high hill. Brynhild receives her, praises
    Sigurd above other heroes, and recounts the prophecy and fame attached to his
    birth and deeds. Gudrun then tells a troubling dream of a golden hart won by her
    and slain by Brynhild, followed by a wolf-cub that stains her with her brothers'
    blood. Brynhild interprets the dream as foretelling Sigurd's coming to Gudrun,
    Grimhild's harmful mead, strife, Gudrun's later marriage to Atli, the loss of
    her brothers, and Atli's death at Gudrun's hands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gudrun says she dreamed that nothing was so dear to her as a hawk, and that
    she would have cast aside all wealth rather than the hawk; an unnamed woman answers
    that the man Gudrun will have will be goodly and loved by her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gudrun says it grieves her not to know who the man will be and proposes seeking
    Brynhild because Brynhild may know about it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gudrun and her damsels array themselves in gold and fair things and travel
    to Brynhild's hall, which is gold-decked and stands on a high hill; their approach
    is seen as women coming toward the burg in gilded wagons.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Brynhild identifies the approaching woman as Gudrun, Giuki's daughter, says
    she dreamed of her the previous night, and goes out to meet and greet her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Inside Brynhild's hall, the women are received in a painted and adorned hall
    with silver vessels, cloths underfoot, servants, and sport.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gudrun is somewhat silent, and Brynhild asks her not to dampen the mirth but
    to converse about mighty kings and their deeds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: In conversation about notable men, Brynhild names Sigurd, son of King Sigmund,
    as far before Gudrun's brothers and recalls that as a young man he slew the sons
    of Hunding and avenged his father and maternal grandfather.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Brynhild recounts that Sigurd's mother found King Sigmund badly wounded among
    the dead; Sigmund refused healing, said he was too old for war, and foretold that
    she would bear the most famed of sons. Brynhild adds that Sigurd was later reared
    in honor and became renowned throughout the wide world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Gudrun says Brynhild's knowledge of Sigurd comes from love and says she came
    to tell dreams that have brought her grief.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Gudrun tells a dream in which she and many others left the bower, saw an exceptionally
    great hart with golden hair, all wished to take it, and she alone obtained it;
    in the same dream Brynhild shot and slew the deer at Gudrun's knees.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Gudrun says that after the deer was slain, Brynhild gave her a wolf-cub that
    besprinkled her with the blood of her brethren.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: 'Brynhild says she will interpret the dream as future events: Sigurd will
    come to Gudrun, though Brynhild has chosen him as her beloved; Grimhild will give
    him harmful mead that brings strife; Gudrun will have and quickly miss Sigurd,
    will wed Atli, will lose her brothers, and will finally slay Atli.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Gudrun responds that knowing such things brings grief and woe, and she and
    her companions go home to King Giuki.
  category: sequence
  evidence_refs:
  - ev:9
