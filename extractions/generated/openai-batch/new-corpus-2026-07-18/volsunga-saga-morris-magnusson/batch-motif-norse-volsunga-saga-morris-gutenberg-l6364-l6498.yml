canonical_text:
  quote: Brynhild drave in her chariot down along the way to Hell
  summary: After Brynhild's death, she is burned on a separate bale from Sigurd and
    in a chariot. Folk say she drives in that chariot toward Hell, passes the dwelling
    of a giant-woman, and answers accusations about bloodshed, betrayal, and the ruin
    of Giuki's house. From the chariot she recounts her former warrior identity, oaths,
    Odin's anger, her shield-and-fire enclosure, Sigurd's coming with Fafnir's gold,
    their chaste nights together, Gudrun's accusation, her discovery of deception
    in her betrothal, and her expectation that she and Sigurd will remain together
    through the ages.
  language: English
  quote_policy: quoted
