  - ev:2
  - ev:3
  confidence: high
  cautions: The passage describes a route and encounter but gives little geography
    beyond the road to Hell and the giant-woman's abode.
- id: motif:2
  label: threshold challenge by otherworldly female figure
  taxonomy_refs: []
  basis: The giant-woman at the stone-pillared stead refuses goodwill for Brynhild's
    passage and confronts her with accusations.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  confidence: medium
  cautions: The text does not explicitly call the giant-woman a gatekeeper; her threshold
    role is inferred from her speech at her dwelling on the way to Hell.
- id: motif:3
  label: divine punishment by enchanted confinement
  taxonomy_refs:
  - divine_judgment
  basis: Brynhild says Odin became angry, shut her in a shield-wall, set fire around
    her hall, and imposed rules about who could awaken her and cross the fire.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage presents Odin's anger and decrees, but does not use a formal
    judicial vocabulary.
- id: motif:4
  label: fire-encircled sleeping woman awakened only by the fearless gold-bringer
  taxonomy_refs:
  - initiation
  basis: Brynhild's slumber can be broken only by one who knows no fear, and the encircling
    fire can be crossed only by the one who brings Fafnir's gold.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: The initiation label is approximate; the passage frames the episode as
    Odin's imposed condition rather than explicitly as an initiation rite.
- id: motif:5
  label: posthumous union of lovers
  taxonomy_refs:
  - annihilation_union
  basis: The passage begins with Sigurd and Brynhild's funeral bales and ends with
    Brynhild saying that she and Sigurd shall be together through the ages.
  evidence_refs:
  - ev:1
  - ev:16
  confidence: medium
  cautions: The passage states lasting togetherness after death, but does not describe
    the metaphysical form of that union.
- id: motif:6
  label: betrayed betrothal and loveless life
  taxonomy_refs: []
