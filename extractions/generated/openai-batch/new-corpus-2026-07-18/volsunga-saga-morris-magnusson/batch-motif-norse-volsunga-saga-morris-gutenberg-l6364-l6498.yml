- id: motif:1
  label: journey of the dead to Hell by chariot
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage moves from cremation to the report that Brynhild drives in a
    chariot down the way to Hell and encounters a giant-woman's dwelling en route.
  evidence_refs:
