canonical_text:
  quote: ''
  summary: Helgi defeats King Hunding and later kills Hunding's sons when they seek
    vengeance. He meets Sigrun, daughter of King Hogni, who says she has been promised
    to Hodbrod but vows not to marry him and asks Helgi to oppose the match and take
    her away. Helgi musters a large fleet, survives a severe sea-storm, and is guided
    by Sigrun to a safe haven. On shore, Sinfjotli, armed and bearing a banner, exchanges
    abusive accusations with Granmar until Helgi rebukes the verbal contest. Granmar
    rides to Hodbrod with news of the approaching force.
  language: English
  quote_policy: summarized
