canonical_text:
  quote: ''
  summary: Gudrun hears of Swanhild's killing and urges her sons to avenge their sister
    against Jormunrek. Hamdir answers, but the sons accept the pressure; Gudrun gives
    them drink and war-gear, and Hamdir declares this their last parting before they
    depart. Gudrun then withdraws in grief and recounts the deaths and losses of Sigurd,
    Atli's children, Swanhild, Gunnar, and Hogni, ending with a wish that Sigurd might
    come from among the dead to meet her.
  language: English
  quote_policy: summarized
