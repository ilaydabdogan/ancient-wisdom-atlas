canonical_text:
  quote: ''
  summary: 'The passage first frames Norse religion as a composite tradition and cautions
    against assuming that similarities with Christianity or other religions prove
    borrowing. It then summarizes Prose Edda material: Allfather creates and rules;
    moral afterlife destinations are described; the primordial Yawning-gap precedes
    earth and heaven; Niflheim and Muspell provide cold and heat; Surtr guards Muspell
    and will burn the world; Ymir arises from melting rime, produces giant kin, and
    is fed by Audhumla’s milk; Audhumla licks a man from salt stones; the lineage
    of Bor leads to Odin, Vili, and Ve; Bor’s sons slay Ymir, whose blood drowns the
    frost-giants except a household escaping in a boat, and whose body becomes the
    world.'
  language: English
  quote_policy: summarized
