  summary: 'The passage summarizes Norse mythic cosmology: the sky, clouds, lights,
    earth, sea, Midgard, first humans, Asgard, major gods and divine figures, Loki
    and his monstrous children, the doom and renewal of the world, Yggdrasil and its
    springs and beings, the Norns, Odin''s wisdom and ravens, Valhall and its heroic
    dead, and a venomous punitive hall for murderers and oath-breakers.'
