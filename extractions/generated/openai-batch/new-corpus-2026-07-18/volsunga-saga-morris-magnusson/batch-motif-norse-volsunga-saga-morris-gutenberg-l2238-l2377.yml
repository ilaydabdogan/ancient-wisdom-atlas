canonical_text:
  quote: ''
  summary: After the forging of the sword, Sigurd seeks Grifir, a maternal uncle who
    knows future fate, and receives a prophecy of his life. Regin urges Sigurd to
    slay Fafnir, but Sigurd first undertakes vengeance for Sigmund and his kinsmen.
    Sigurd obtains support from kings, sails with an army, takes aboard a mysterious
    cliff-top man named Hnikar, Feng, or Fjolnir, hears battle omens and advice from
    him, reaches the realm of Hunding's sons, devastates the land, and enters battle
    with King Lyngi and his brothers.
  language: English
  quote_policy: summarized
