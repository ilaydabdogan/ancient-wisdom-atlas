canonical_text:
  quote: ''
  summary: Helgi speaks at the mound about Sigrun lying alive in the arms of a dead
    man and about his own ride on a pale horse to Windhelm's bridge. After Helgi leaves,
    Sigrun returns the next night, hopes for his coming from Odin's halls, and is
    warned by a bondmaid about the danger of dead warriors at night. The narrator
    then says Sigrun soon died from sorrow and reports an old belief that Helgi and
    Sigrun were born again as Helgi the Scathe of Hadding and Kara, a Valkyrie.
  language: English
  quote_policy: summarized
