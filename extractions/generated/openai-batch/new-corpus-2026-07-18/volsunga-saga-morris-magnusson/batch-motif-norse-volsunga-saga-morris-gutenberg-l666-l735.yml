canonical_text:
  quote: ''
  summary: The passage is an introductory discussion of the Volsung and Niblung story,
    its supposed common Teutonic or Scando-Gothic inheritance, its Eddaic and saga
    forms, and its later analogues or adaptations in Beowulf, Grettir, the Nibelungenlied,
    Faroese and Danish song, and modern works. It highlights alterations in the German
    medieval version, including dragon-slaying, renamed characters, replacement of
    named objects, weakening of mythological features, the changed role of Andvari's
    curse, and the presentation of Sigurd/Siegfried as an unstained hero overcome
    by fate.
  language: English
  quote_policy: summarized
