canonical_text:
  quote: ''
  summary: Gudrun is unable to weep or speak over the dead Sigurd until Gullrond uncovers
    Sigurd's corpse and urges her to look at and kiss him. Gudrun sees Sigurd's bloody
    hair, dead eyes, and sword-broken body, then collapses into tears and laments
    him. She praises Sigurd, accuses the sons of Giuki of oath-breaking, foretells
    Gunnar's death through the sworn-on gold rings, and recalls Sigurd's ride for
    Brynhild's wooing. Brynhild and Gullrond exchange accusations; Brynhild blames
    Atli and reacts with fiery eyes and venomous rage while gazing on Sigurd's wounds.
    An endnote identifies the chapter as the Eddaic poem called the First Lay of Gudrun.
  language: English
  quote_policy: summarized
