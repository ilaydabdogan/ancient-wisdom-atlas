  summary: 'The passage describes Icelandic learning and poetic inheritance, the arrival
    of a western Norse poetic school in Iceland, and cultural influences associated
    with viking life and Celtic contact. It then gives an example from the saga of
    Gunnlaug Worm-tongue: he travels to England, addresses King Ethelred, recites
    a praise song, and receives a richly adorned cloak and royal favor as reward.'
