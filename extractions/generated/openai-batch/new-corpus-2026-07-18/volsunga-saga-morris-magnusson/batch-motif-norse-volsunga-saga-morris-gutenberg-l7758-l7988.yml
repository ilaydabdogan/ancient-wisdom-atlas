  quote: '"Whetter her sons / To Swanhild''s avenging."'
  summary: Gudrun urges her sons Hamdir and Sorli to avenge Swanhild, who was trampled
    by Jormunrek's horses. The brothers set out, kill their kinsman Erp after rejecting
    his offered help, reach Jormunrek's hall, fight the Goths, maim Jormunrek, and
    are finally ordered to be attacked with stones because weapons will not bite them.
