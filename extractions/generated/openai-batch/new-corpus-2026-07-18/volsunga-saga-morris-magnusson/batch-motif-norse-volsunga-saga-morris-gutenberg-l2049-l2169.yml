canonical_text:
  quote: ''
  summary: Regin tells Sigurd that Fafnir lies on Gnita-heath with a great hoard,
    then recounts how Hreidmar's sons Fafnir, Otter, and Regin were connected to the
    gold of Andvari. Loki killed Otter, the gods paid Hreidmar a gold ransom taken
    from Andvari, Andvari cursed the ring and gold, and Fafnir later killed Hreidmar
    and became a worm brooding over the treasure. Sigurd asks Regin to forge a matchless
    sword for the slaying of Fafnir.
  language: English
  quote_policy: summarized
