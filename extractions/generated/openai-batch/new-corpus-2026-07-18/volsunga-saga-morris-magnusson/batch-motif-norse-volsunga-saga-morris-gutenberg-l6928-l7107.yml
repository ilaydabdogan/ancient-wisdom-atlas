canonical_text:
  quote: ''
  summary: Grimhild urges Gudrun to accept Atli with promises of gold, rule, lands,
    and future sons. Gudrun refuses and mourns Sigurd, then foretells deaths for Gunnar
    and Hogni and revenge against Atli. She later accepts Atli against her will and
    travels with warriors and women to his burg. Atli reports ominous dreams of Gudrun
    placing a sword in his heart and of bloodied saplings, hawks, and whelps being
    eaten; Gudrun gives dark interpretations involving fire, doomed men, and a deed
    she must do. An endnote states that the latter dream passage is fragmentary and
    obscure.
  language: English
  quote_policy: summarized
