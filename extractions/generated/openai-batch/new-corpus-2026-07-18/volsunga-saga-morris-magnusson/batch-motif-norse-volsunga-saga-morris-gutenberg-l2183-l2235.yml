canonical_text:
  quote: ''
  summary: Regin forges two swords that fail Sigurd's tests. Sigurd obtains the two
    pieces of Gram from his mother, has Regin reforge them, and proves the resulting
    sword by cleaving an anvil and cutting a lock of wool in a stream. Regin reminds
    him of his promise to meet Fafnir, but Sigurd says he must first avenge his father;
    Sigurd grows beloved by all.
