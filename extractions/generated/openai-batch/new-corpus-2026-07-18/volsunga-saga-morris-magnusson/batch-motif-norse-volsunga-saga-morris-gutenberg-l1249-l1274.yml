canonical_text:
  quote: ''
  summary: Signy sends each of her two sons by Siggeir to Sigmund in the wood so that
    they may help him in avenging his father. The eldest boy fails Sigmund's bread-making
    task because he fears something living in the meal-bag. Sigmund judges him unfit,
    and Signy tells Sigmund to kill him. The next winter the second son is sent and
    is slain in the same way by Signy's counsel.
