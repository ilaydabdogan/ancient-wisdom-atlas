canonical_text:
  quote: ''
  summary: After killing Atli, Gudrun tries to drown herself but is carried to Jonakr’s
    land, marries him, and bears sons. Swanhild, Sigurd’s daughter, is given to Jormunrek;
    after Bikki’s counsel and report, Randver is hanged and Swanhild is trampled by
    horses. Gudrun urges her sons to avenge their sister, arms them, and laments her
    many losses before invoking Sigurd and asking for a great funeral pyre.
  language: English
  quote_policy: summarized
