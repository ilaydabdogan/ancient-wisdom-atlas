canonical_text:
  quote: ''
  summary: Brynhild grieves and rebukes Gunnar and his kin as oath-breakers, recalling
    Gunnar's blood-bond with Sigurd and Sigurd's oath-keeping with a sword laid between
    them. Gunnar and others try to stop her from dying, while Hogni advises nonintervention.
    Brynhild offers gold, wounds herself with a sword, foretells future disasters
    for Gunnar, Gudrun, Atli, Swanhild, and their kin, and requests a great funeral
    pyre for herself, Sigurd, attendants, hawks, and a sword between herself and Sigurd.
    Sigurd's corpse, his young son, and Guttorm are placed on the pyre; Brynhild dies
    and is burned beside Sigurd.
  language: English
  quote_policy: summarized
