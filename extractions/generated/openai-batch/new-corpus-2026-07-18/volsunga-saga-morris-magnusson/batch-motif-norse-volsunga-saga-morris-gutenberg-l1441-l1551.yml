canonical_text:
  quote: ''
  summary: King Siggeir has Sigmund and Sinfjotli shut in a barrow, divided by a stone.
    Signy secretly provides straw and concealed food containing Sigmund's sword. The
    captives use the sword to cut through the stone and iron, escape, and burn Siggeir's
    hall. Signy reveals her long revenge plan, including the death of her children,
    her visit to Sigmund in a witch-wife's shape, and Sinfjotli's parentage, then
    chooses to die in the fire with Siggeir. Sigmund returns to his father's land,
    expels the occupying king, becomes ruler, and later fathers Helgi and Hamund by
    Borghild. At Helgi's birth the Norns foretell his future renown, and Helgi grows
    into a warrior leader with Sinfjotli as companion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sigmund and Sinfjotli are placed in a barrow on opposite sides of a stone
    so that they can hear but not reach one another.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Signy comes to the barrow with straw, casts it down to Sinfjotli, and asks
    the thralls to hide the act from the king.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sinfjotli finds swine's flesh wrapped with straw and discovers Sigmund's sword
    thrust inside it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
