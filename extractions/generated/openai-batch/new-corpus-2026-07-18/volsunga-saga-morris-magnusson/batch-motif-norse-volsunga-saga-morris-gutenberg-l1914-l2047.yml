canonical_text:
  quote: ''
  summary: Hjordis and her bondmaid are brought with treasure to King Alf's realm.
    Alf and his mother suspect that the less adorned woman is noble, and Alf tests
    the women by asking how they know dawn without seeing the sky. The bondmaid answers
    by habit, while Hjordis names a gold ring that grows cold at daybreak; Hjordis
    then reveals her identity and is honored and promised marriage. Hjordis bears
    Sigurd, who is named after water-sprinkling and is praised as exceptional. Sigurd
    is fostered in King Hjalprek's house, educated by Regin in arts, runes, and tongues,
    and later asks for a horse. In the woods, an old long-bearded man helps him choose
    a grey horse by driving horses into the river Busil-tarn. The stranger says the
    horse is of Sleipnir's kin and vanishes; the narrator identifies him as Odin and
    names the horse Grani.
  language: English
  quote_policy: summarized
