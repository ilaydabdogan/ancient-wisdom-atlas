canonical_text:
  quote: '"horses were driven at her to tread her down"'
  summary: Jormunrek sends his son Randver and the counsellor Bikki to woo Swanhild
    from King Jonakr. Swanhild is granted and travels with Randver. Bikki encourages
    Randver toward Swanhild and then tells Jormunrek that Randver and Swanhild have
    betrayed him. Jormunrek orders Randver hanged, but Randver sends a plucked hawk
    as a sign; Jormunrek relents too late, because Bikki has already caused Randver's
    death. Bikki then counsels Jormunrek to kill Swanhild. She is bound in the gate
    and horses are driven at her, but they will not trample her when her eyes are
    uncovered; after a bag is drawn over her head, she dies. An endnote reports a
    Prose Edda variant in which Jormunrek and his men ride over Swanhild after he
    sees her washing linen.
  language: English
  quote_policy: quoted
