  summary: Atli and his folk die amid fire and mutual slaughter. Gudrun does not wish
    to live but does not die. The Volsungs and Giukings are praised as mighty peoples
    of old songs. Gudrun later enters the sea with stones intending to end her life,
    but the billows carry and uphold her until she reaches King Jonakr, who marries
    her; their children are named, and Swanhild is raised there.
