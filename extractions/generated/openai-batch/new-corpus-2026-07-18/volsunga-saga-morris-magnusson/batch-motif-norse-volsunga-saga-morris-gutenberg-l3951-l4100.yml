canonical_text:
  quote: ''
  summary: Gunnar and the brothers incite Guttorm to kill Sigurd, using promises and
    a cooked mixture of worm, wolf-meat, and wine that makes him wild. Guttorm enters
    Sigurd's chamber three times and finally thrusts a sword through the sleeping
    Sigurd, who wakes and kills Guttorm with Gram. Gudrun wakes in Sigurd's blood;
    Sigurd speaks of fate, his loyalty, Brynhild's role, and his young son before
    dying. Brynhild laughs at Gudrun's grief; Gunnar, Brynhild, Hogni, and Gudrun
    speak over the murder. The passage then moves into an ancient-song lament in which
    Gudrun sits nearly speechless in grief while other women recount their own bereavements.
  language: English
  quote_policy: summarized
