canonical_text:
  quote: ''
  summary: In Atli's hall the Giuking brothers Gunnar and Hogni are overwhelmed after
    fierce fighting. Atli seeks the hidden gold and orders Hogni's heart cut out.
    A thrall's heart is first substituted, but Gunnar recognizes it as not Hogni's.
    Hogni is then killed while laughing under torment. Gunnar refuses to reveal the
    gold, saying the Rhine shall rule it, and is placed bound in a worm-close. Gudrun
    sends him a harp; he plays it with his toes until the worms sleep, but one adder
    stings his heart and kills him.
  language: English
  quote_policy: summarized
