canonical_text:
  quote: ''
  summary: Sigurd asks Brynhild for more wisdom, and she gives him a sequence of counsels
    about kinship, love, assemblies, travel, drunken quarrels, battle, oaths, dead
    bodies, vengeance, friends, and his wife’s kin. Sigurd and Brynhild mutually pledge
    troth. The following chapter describes Sigurd’s dragon-emblazoned golden arms,
    his identity as Fafnir’s slayer, his appearance, strength, sword Gram, knowledge
    of future things and bird-speech, eloquence, generosity to friends, and fearlessness.
    An endnote compares the chapter to the Wilkinasaga.
  language: English
  quote_policy: summarized
