  quote: ''
  summary: Atli confronts Gunnar and Hogni at his hall over Sigurd's former gold.
    Battle follows; Gudrun greets her brothers, speaks of unavoidable fate, seeks
    peace, then arms herself and fights beside them. After heavy losses, Atli and
    Hogni exchange accusations about broken peace, murdered kin, and seized wealth.
  language: English
  quote_policy: summarized
