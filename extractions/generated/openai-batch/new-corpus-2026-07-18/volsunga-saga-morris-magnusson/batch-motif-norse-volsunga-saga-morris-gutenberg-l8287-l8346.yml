canonical_text:
  quote: ''
  summary: Oddrun recounts that Hogni's heart was cut out and another man, identified
    as Gunnar later in the passage, was cast into a worm-close. Gunnar played his
    harp expecting Oddrun's help. Oddrun heard the harp, prepared bondmaids, and crossed
    the sound by ship toward Atli's dwelling, but Atli's mother came out and delivered
    a fatal sting to Gunnar's heart. Oddrun then laments her love for the slain hero
    and the ill-fates she has told.
