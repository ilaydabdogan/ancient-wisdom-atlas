canonical_text:
  quote: '"Smite them to the death with stones."'
  summary: Gudrun prepares her sons with war-gear that steel cannot pierce and warns
    them against stones and heavy objects. On the way, Hamdir and Sorli kill their
    brother Erp, then realize his answer about helping them like hand or foot was
    true. They attack King Jormunrek, cutting off his hands and feet, but regret Erp's
    absence because the head remains. Iron does not bite on them, but an old one-eyed
    man, identified in an endnote as Odin, advises that they be killed with stones.
    Stones are thrown from all sides, and Hamdir and Sorli die; the kin of the Giukings
    comes to an end.
  language: English
  quote_policy: quoted
