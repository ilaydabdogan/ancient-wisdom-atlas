candidate_motifs:
- id: motif:1
  label: conditional bride-winning by heroic ordeal
  taxonomy_refs:
  - sacred_marriage
  basis: Brynhild says she promised to wed only whoever rode Grani with Fafnir's hoard
    through her flaming fire and performed the killings she demanded; she says only
    Sigurd dared and succeeded.
  evidence_refs:
  - ev:2
  - ev:12
  confidence: medium
  cautions: The passage supports a marriage ordeal, but it does not present the union
    as explicitly divine or ritually sacred.
- id: motif:2
  label: fire barrier crossed by the true hero
  taxonomy_refs: []
  basis: The decisive distinction between Sigurd and Gunnar is repeatedly stated as
    riding through Brynhild's fire.
  evidence_refs:
  - ev:2
  - ev:12
  confidence: high
  cautions: The passage recalls the fire-crossing retrospectively rather than narrating
    the crossing itself.
- id: motif:3
  label: serpent or Worm slaying as heroic credential
  taxonomy_refs:
  - serpent
  basis: Brynhild twice identifies Sigurd with the slaying of the Worm and treats
    that deed as part of his superiority over Gunnar and the sons of Giuki.
  evidence_refs:
  - ev:2
  - ev:12
  confidence: high
  cautions: The slaying is only mentioned in retrospect in this passage.
- id: motif:4
  label: token ring tied to disputed marriage and parting
  taxonomy_refs:
  - sacred_exchange
  basis: Brynhild begins by asking Gunnar about a ring she gave him, which she says
    King Budli had given her at their last parting, in the context of the forced marriage
    dispute.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage identifies the ring as an exchanged object, but does not fully
    explain its legal or ritual function.
- id: motif:5
  label: oath-bound love broken by misdirected marriage
  taxonomy_refs: []
  basis: Brynhild says she vowed to love only the noblest man alive, identifies Sigurd
    as that man, and says her oath is broken because Sigurd is not hers.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The wording gives Brynhild's perspective within a conflict and does not
    independently establish all events behind the oath.
- id: motif:6
  label: false or obscured wooing through mistaken recognition
  taxonomy_refs:
  - stolen_beloved
  basis: Brynhild says Gunnar did not ride through the fire, that Sigurd came into
    her hall, and that she thought she recognized Sigurd's eyes but could not see
    clearly because a veil lay on her fortune.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage implies deception or obscured identity, but does not narrate
    the full substitution within this excerpt.
- id: motif:7
  label: grief expressed as social withdrawal and ominous sleep
  taxonomy_refs: []
  basis: Brynhild refuses hall-joys, tears needlework, wails publicly, drinks neither
    mead nor wine, gives no answer to visitors, and is described by Gudrun as sleeping
    seven days and seven nights.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: Sigurd denies that the condition is literal sleep and interprets it as
    dreadful intent, so the sleep motif is internally contested.
