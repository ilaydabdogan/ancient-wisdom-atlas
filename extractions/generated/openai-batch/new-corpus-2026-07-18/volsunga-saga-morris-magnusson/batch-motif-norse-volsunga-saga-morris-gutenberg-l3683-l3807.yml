canonical_text:
  quote: ''
  summary: Brynhild confronts Gunnar over a ring, a compelled marriage arrangement,
    and her vow to wed only the man who could ride Grani with Fafnir's hoard through
    her flaming fire and perform killings she required. She declares that only Sigurd
    met the test, laments that Sigurd is not hers, threatens Gunnar, is briefly restrained
    by Hogni, and withdraws into grief. Gudrun and others try to have Brynhild approached.
    Sigurd visits her; Brynhild accuses him of treason and says Gunnar did not ride
    through the fire, while Sigurd did so for her.
  language: English
  quote_policy: summarized
