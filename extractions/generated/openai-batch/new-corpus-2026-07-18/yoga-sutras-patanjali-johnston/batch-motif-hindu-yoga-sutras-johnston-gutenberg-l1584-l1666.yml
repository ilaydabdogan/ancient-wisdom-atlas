canonical_text:
  quote: ''
  summary: The introduction to Book III explains that spiritual powers arise only
    after moral discipline, purification, and liberation from psychic bonds. It contrasts
    the spiritual man with the personal man, describes consciousness as fundamentally
    one with the Oversoul, and warns that powers sought through self-seeking psychism
    are delusive. Entry into the pure world requires sacrifice, renunciation, self-conquest,
    and holiness.
  language: English
  quote_policy: summarized
