canonical_text:
  quote: ''
  summary: The passage describes the Master or Lord as free from sin, servitude, sorrow,
    and time, possessing the seed of omniscience and serving as teacher. It identifies
    OM as his word and symbol, recommends soundless repetition and meditation on OM,
    and links this practice to awakening interior consciousness and removing barriers.
    It then lists obstacles and disturbances of the psychic nature and recommends
    steady application to a principle, along with sympathy, compassion, delight in
    holiness, and disregard of unholiness, as means toward peace.
  language: English
  quote_policy: summarized
