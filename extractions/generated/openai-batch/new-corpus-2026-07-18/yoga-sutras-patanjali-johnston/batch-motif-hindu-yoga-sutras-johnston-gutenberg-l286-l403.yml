canonical_text:
  quote: ''
  summary: The passage explains restoration of fallen psychical powers through awakened
    spiritual will and purification of thought. It describes steady effort, non-indulgence,
    staged meditation, objectless spiritual consciousness, rebirth after death due
    to desire, a graded path to illumination, strength of will, and ardent service
    of the Master, who is identified as the free spiritual man.
  language: English
  quote_policy: summarized
