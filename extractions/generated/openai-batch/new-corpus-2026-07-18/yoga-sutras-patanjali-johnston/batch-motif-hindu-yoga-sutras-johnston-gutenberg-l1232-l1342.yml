canonical_text:
  quote: ''
  summary: The passage explains ethical transgressions and their remedies in Yoga
    Sutras II.34-40 with commentary. It describes suffering and loss as a way the
    Law teaches moral understanding, urges cultivation of contrary virtues, lists
    injury, falsehood, theft, incontinence, and envy as transgressions rooted in greed,
    wrath, and infatuation, and describes spiritual powers or fruits arising from
    perfected non-injury, truth, non-theft, continence, conquest of covetousness,
    and purity.
  language: English
  quote_policy: summarized
