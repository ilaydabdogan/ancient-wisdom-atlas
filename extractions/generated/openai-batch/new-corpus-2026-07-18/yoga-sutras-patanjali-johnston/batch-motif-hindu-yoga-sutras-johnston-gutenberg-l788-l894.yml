canonical_text:
  quote: ''
  summary: 'Book II opens by naming practices for union with the Soul: fervent aspiration,
    spiritual reading, and obedience to the Master. The commentary explains aspiration
    as fire that illumines and purifies, and says these practices bring soul-vision
    and wear away hindrances. The passage lists hindrances rooted in unwisdom, contrasts
    the psychical/personal man with the spiritual man or real Self, and defines self-assertion
    as confusing the Seer with the instrument of vision.'
  language: English
  quote_policy: summarized
