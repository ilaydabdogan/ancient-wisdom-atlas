canonical_text:
  quote: ''
  summary: The passage explains the Sankhya-Yoga distinction between the Seer or spiritual
    man and the psychical man, defines lust, hate, and attachment as hindrances, describes
    their removal through wisdom, aspiration, love, and meditation, and explains bondage,
    karma, rebirth, and discernment regarding personal life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Yoga is the practical side of Sankhya and identifies the
    Seer with the spiritual man and the instrument of vision with the psychical man.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes a mistaken attribution of reality to the psychical or
    personal self, treating servant as master and thinking the spiritual and psychical
    as one self.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lust is defined as resting in the sense of enjoyment, with examples involving
    taste, food, and reproduction.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hate is defined as resting in the sense of pain, and the commentary links
    pain to strife among personalities and separate psychic selves.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Attachment is described as desire toward life, even in the wise, carried forward
    by its own energy.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The desire of sensation and psychic life is said to reproduce itself and to
    produce a circle of death and rebirth rather than liberation of the spiritual
    man.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Subtle hindrances are to be removed by a countercurrent, including wisdom,
    spiritual aspiration, love, and realization of the One Self.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The active turnings of selfishness, lust, and hate are to be removed by meditation
    and stilling of heart and mind in spiritual life.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The burden of bondage to sorrow is said to have its root in unwisdom, selfishness,
    lust, hate, and attachment to sensation, and may be felt in this life or a future
    life.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: From the root of hindrances grow the fruits of birth, life-span, and all that
    is tasted in life; the commentary connects this with karma and the conditions
    of next birth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Holy and unholy works are said to bear fruits of rejoicing or affliction,
    whether in this birth or an unmanifested birth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: For one possessing discernment, all personal life is described as misery because
    it waxes and wanes, is restless, makes new impressions, and has activities that
    war with each other.
  category: attribute
  evidence_refs:
  - ev:10
