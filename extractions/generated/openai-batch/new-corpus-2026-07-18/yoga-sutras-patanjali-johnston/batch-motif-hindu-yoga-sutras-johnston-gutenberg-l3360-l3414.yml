canonical_text:
  quote: ''
  summary: The passage describes the removal of veils leading to knowledge, the completion
    of transformations of Nature's potencies, the distinction between Nature's changing
    eternity and Spirit's immortal eternity, the Spiritual Man's entry into eternal
    Being, and pure spiritual life as the return of pure Consciousness to its essential
    form. It concludes with imagery of an upward path toward everlasting hills radiant
    with light.
