canonical_text:
  quote: "“The ‘mind,’ once the tyrant, is now the slave, recognized as outward, separate,
    not Self...”"
  summary: The passage explains that the mind or psychic nature is not the true Self,
    cannot know itself fully, and must be observed by the Spiritual Man. It describes
    purification of the psychic nature so that it reflects spiritual intelligence,
    regeneration through the fiery power of the Soul, and the transformed mind serving
    the Spiritual Man in relation to both heaven and earth.
  language: English
