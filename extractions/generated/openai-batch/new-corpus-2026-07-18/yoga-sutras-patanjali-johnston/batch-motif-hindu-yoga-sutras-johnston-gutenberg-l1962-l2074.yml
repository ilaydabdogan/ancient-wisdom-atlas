canonical_text:
  quote: Past, present and future are all in the Eternal.
  summary: 'The passage explains a series of powers said to arise from perfectly concentrated
    meditation: knowledge of past and future, understanding the sounds of all beings,
    recollection of previous births, thought-reading with limits, invisibility, knowledge
    of the time of the end through karma, interior union through compassion, elephant-like
    power, and knowledge of subtle or hidden things through awakened inner light.'
  language: English
  quote_policy: quoted
