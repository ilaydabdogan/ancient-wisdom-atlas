canonical_text:
  quote: ''
  summary: The passage explains dynamic mind-images as organized by a ray from the
    Self across births into bodily circumstances, contrasts desire with aspiration,
    describes cessation of desire-driven reproduction of bondage, expounds the eternal
    Now beyond past, present, and future with supporting comparisons, and introduces
    the Three Potencies underlying manifest and latent properties.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ray of creative force sent down by the Self is said to exercise selective
    power on dynamic mind-images, compared to the light of a magic lantern projecting
    a picture.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same selective power is said to gather conformable mind-images from different
    births, times, and places into the frame of a single life or event, producing
    bodily conditions or outward circumstances by which the soul is taught and trained.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mind-images of desire are said to ripen into bodily conditions, while powers
    of aspiration toward the Eternal are said to have fruition in a finer world and
    build the vesture of the spiritual man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sutra 10 states that the series of dynamic mind-images is beginningless because
    desire is everlasting; the commentary says desire is to turn to the Eternal and
    become aspiration.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sutra 11 states that dynamic mind-images are held together by desire, wish
    for personal reward, mental habit, and outer desired things, and that their self-reproduction
    ceases when these cease.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The commentary asks how the current of self-reproductive mind-images can be
    checked so that bondage ends and liberation dawns, and answers that the driving-force
    is withdrawn and directed to building the spiritual body.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sutra 12 distinguishes past and not-yet-come by phases of properties; the
    commentary says the division of time into past, present, and future is largely
    an illusion and that all dwell together in the eternal Now.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'The passage says one name of the Enlightened is the one who has passed beyond
    the three times: past, present, and future.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage cites a Western Master, a Master of the writer's own days, and
    Bjorklund as voices supporting or restating the teaching about the eternal present
    and the inadequacy of past, present, and future as concepts.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
- id: obs:10
  text: Sutra 13 states that manifest and latent properties are of the nature of the
    Three Potencies, named as Substance, Force, and Darkness, or morally as Goodness,
    Passion, and Inertness.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:11
  text: Sutra 14 states that an object's external manifestation takes place when transformations
    are in the same phase.
  category: speech
  evidence_refs:
  - ev:12
