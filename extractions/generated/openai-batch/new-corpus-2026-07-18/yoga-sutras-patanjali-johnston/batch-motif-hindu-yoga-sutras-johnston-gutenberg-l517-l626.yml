canonical_text:
  quote: "“like a pure crystal, takes the colour of what it rests on”"
  summary: 'The passage presents several ways to still the psychic nature and steady
    consciousness: overcoming egotistic moods, regulating the life-breath, sustained
    attention, joyful spirit, purification from self-indulgence, contemplation of
    dreams and dreamless sleep, meditation on what is loved, and concentrated identification
    with the object of knowledge. It culminates in an image of stilled consciousness
    as a pure crystal taking the color of perceiver, perceiving, or perceived, followed
    by a description of perception that still mixes name, object, and idea.'
  language: English
  quote_policy: quoted
