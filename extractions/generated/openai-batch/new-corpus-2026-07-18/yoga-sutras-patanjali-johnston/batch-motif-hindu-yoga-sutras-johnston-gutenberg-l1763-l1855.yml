canonical_text:
  quote: This power is distributed in ascending degrees.
  summary: The passage describes spiritual perception as developing through graduated
    practice. It contrasts the triad of Attention, Meditation, and Contemplation with
    a higher unconditioned soul vision in which individual consciousness enters All
    consciousness. It then explains Control as the calming of excitation so that perception
    and insight can follow, illustrated by encounters with a charging elephant and
    a comet-like flaming sword.
  language: English
  quote_policy: quoted
