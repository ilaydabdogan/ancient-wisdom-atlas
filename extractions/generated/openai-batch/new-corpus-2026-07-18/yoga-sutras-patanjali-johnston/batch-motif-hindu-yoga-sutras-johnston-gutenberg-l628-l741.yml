canonical_text:
  quote: ''
  summary: 'The passage explains stages of yogic perception: beginning with an illustrative
    object, moving from names and ideas to direct inner apprehension, ascending from
    external objects to subtle substances and unity, passing through true perception
    and peace, and ending in pure spiritual consciousness after all impressions and
    separateness cease.'
  language: English
  quote_policy: summarized
