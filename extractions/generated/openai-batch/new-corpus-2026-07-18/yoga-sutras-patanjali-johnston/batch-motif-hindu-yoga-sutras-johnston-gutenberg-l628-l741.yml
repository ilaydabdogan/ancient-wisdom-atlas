  text: A commentator illustrates perception with a cow, distinguishing the cow's
    name, the animal itself, and the idea of the cow in the mind, then describing
    a deeper stage of entering the cow's inmost being and sharing its consciousness.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage defines a perception in which the object dwells in the mind without
    memory-pictures or mental colouring, as a pure luminous idea.
  category: attribute
  evidence_refs:
