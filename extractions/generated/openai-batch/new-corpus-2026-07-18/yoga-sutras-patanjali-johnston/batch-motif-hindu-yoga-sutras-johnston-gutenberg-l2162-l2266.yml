  quote: ''
  summary: The passage explains bodily and psychical centers of force in relation
    to the spiritual man. It discusses speech, hunger and thirst, throat and palate
    imagery associated with Indra, meditation on a tortoise-formed channel for steadfastness,
    mastery of fear in the chest, meditation on light in the head for vision of attained
    Masters, intuition as a divining power that knows, and meditation on the heart
    for knowledge of consciousness.
  language: English
