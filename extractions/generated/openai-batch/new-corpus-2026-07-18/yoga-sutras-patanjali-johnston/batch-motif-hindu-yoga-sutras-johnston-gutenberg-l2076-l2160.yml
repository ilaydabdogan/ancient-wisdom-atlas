canonical_text:
  quote: ''
  summary: 'The passage explains several Yoga Sutras in which perfectly concentrated
    meditation on the sun, moon, fixed pole-star, lower trunk center, and throat center
    yields specific knowledge or bodily mastery. The commentary interprets these objects
    both cosmologically and inwardly: the sun as Soul, the moon as analytic mind,
    the pole-star as eternal spirit, and the lower bodily center as a site for understanding
    and redirecting creative force toward the spiritual man. It concludes that spiritual
    vision, aspiration, sacrifice, and new birth from above cure spiritual blindness
    and enable mastery of bodily powers.'
