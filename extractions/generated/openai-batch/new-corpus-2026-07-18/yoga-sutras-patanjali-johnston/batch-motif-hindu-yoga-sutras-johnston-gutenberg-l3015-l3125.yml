  text: The passage suggests that past, present, and future visibility may also depend
    on phase, and that finer senses or a higher point of view may allow perception
    of past and future things.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that material things and states of consciousness have distinct
    paths, shown by one object producing different impressions in different minds.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
