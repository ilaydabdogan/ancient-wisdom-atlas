canonical_text:
  quote: ''
  summary: Sutras 51-55 and their commentary warn the disciple against allurements
    in spiritual or psychic realms, describe discernment-born wisdom arising from
    meditation on time, compare liberation to passing beyond past, present, and future,
    portray this wisdom as starlike and simultaneous in its vision, and conclude with
    the purification of the vesture and spiritual man before perfect spiritual life
    is attained.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The text says allurement or pride in invitations from different realms of
    life should be completely overcome to prevent renewed attachment to evil things.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The commentator divides disciples or seekers for union into four degrees:
    entering the path, being in the realm of allurements, gaining victory over matter
    and the senses, and standing firm in pure spiritual life.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The commentary says modern teachers would warn against delusions and fascinations
    of the psychic realm, which open around the disciple as he breaks through into
    unseen worlds.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The commentary describes the psychic dangers as an anteroom and says safety
    lies in passing swiftly into the inner chamber.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Perfectly concentrated meditation on the divisions of time and their succession
    is said to produce wisdom born of discernment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Upanishadic liberated person is described as having passed beyond the
    triad of time and as beholding all things in the quiet light of the Eternal.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The commentary describes distinctions of order, time, and space as creations
    of the mind and as a threefold prism that distorts the real object.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wisdom born of discernment is called starlike because it discerns all things
    and all conditions simultaneously, shines with its own light, rises on high, and
    illumines all things.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Columba is quoted as describing a few people who, by divine grace, can see
    the whole world with ocean and sky at one moment as if under one ray of the sun.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says perfect spiritual life is attained when both the vesture
    and the spiritual man are pure; the vesture is described as washed of stains and
    the seeds of future sorrow as burned up.
  category: sequence
  evidence_refs:
  - ev:6
