canonical_text:
  quote: ''
  summary: Commentary on sutras 4-9 describes the Self attaching to physical, finer,
    and causal vestures before the divine state; One Consciousness manifesting as
    many states; contemplative consciousness as free from future sorrow; works after
    Union as beyond pleasure and pain; and Karma as dynamic impressions from works
    ripening across rebirth, illustrated by a murderous blow producing a psychic wound
    that later manifests as bodily vulnerability.
  language: English
  quote_policy: summarized
