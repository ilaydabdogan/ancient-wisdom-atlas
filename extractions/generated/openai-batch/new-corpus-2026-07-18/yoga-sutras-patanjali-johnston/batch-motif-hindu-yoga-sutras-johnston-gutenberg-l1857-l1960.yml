    life, and Life itself.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: A day is described as containing events and circumstances, and also a lesson
    set for the soul by the Eternal.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: Every object is said to have past, present, and future characteristics, illustrated
