canonical_text:
  quote: ''
  summary: The passage explains repeated control of the mind, one-pointed contemplation,
    balanced perception of multiplicity and unity, discernment of beings' characteristics,
    and meditation on three stages of development as a means to know past and future.
    It uses examples from musical and martial practice, a distracted child, roses,
    trees, chrysalis and butterfly, and the animal-man-angel sequence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The order of knowledge is described as excitation of the mind by a new object,
    inward control of the mind, and then perception of the object's nature.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Living experiences are described as arriving first with pain; the Soul steadies
    and controls the pain, and the spirit perceives the lesson of the event.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Frequent repetition of the process habituates the mind and produces an equable
    flow of perceiving consciousness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Control of the mind by the Soul is compared to control of muscles by the mind
    and is said to come through practice and constant voluntary repetition.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: A musician mastering an instrument and a fencer mastering a rapier illustrate
    how small repeated efforts of attention accumulate into mastery.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The perceiving mind is described as a more wonderful instrument played by
    the Soul.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A daily effort to live for the Soul is called a gradual conquest, and the
    Master gives the crown of life to one faithful unto death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The mind's tendency to flit from one object to another is illustrated by a
    child doing arithmetic whose thoughts move to coins, candy, a store, a toy-shop,
    and games before returning to the lesson.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: One-pointedness is described as going back within oneself into the beam of
    perceiving consciousness, called a beam of the Oversoul, and focusing consciousness
    in the Soul.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: One-pointedness is said to balance perception of the manifold characteristics
    of an object with perception of the object as a unity or essence.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that things have sides of difference and unity, including
    individual and genus, matter and diversity, and oneness and spirit.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The described power makes inherent character, distinctive marks, and conditions
    of beings and powers clear through a twofold view of individual characteristics
    and essential character.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A rose is used as an example of something perceived both as a particular flower
