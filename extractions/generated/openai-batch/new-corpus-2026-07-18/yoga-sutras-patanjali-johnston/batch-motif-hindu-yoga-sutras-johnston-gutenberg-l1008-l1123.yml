canonical_text:
  quote: ''
  summary: The passage describes the psychic self as miserable because desire, fear,
    birth, death, and repeated mental impressions perpetuate dissatisfaction. It states
    that pain should be prevented by cutting the root of absorption in the psychical
    self. The cause of bondage is the association of the Seer with things seen; things
    seen consist of qualities and layers that provide experience and prepare liberation.
    The Seer is pure vision but looks through the mind. When unwisdom and this association
    end, the Seer attains pure being and great liberation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The psychic self is described as miserable because it waxes and wanes, birth
    entails death, expectation is shadowed by fear, and restlessness prevents satisfaction.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Desire is compared to fire that is not quenched by oil; the satisfaction of
    desire is said to seed renewed desire.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that pain should be warded off before it arrives, by cutting
    the root of absorption in the psychical self and fixing the heart on the eternal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The cause of what must be warded off is identified as the Seer’s absorption
    in things seen; the cure is named liberation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Things seen are said to have manifestation, action, and inertia as properties,
    to form the basis of elements and sense-powers, and to make for experience and
    liberation.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The Three Potencies are described as having grades or layers: defined, undefined,
    with distinctive mark, and without distinctive mark.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Seer is described as pure vision, yet as looking through the vesture of
    the mind while enfolded and enmeshed by the psychical man.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Things seen are said to exist for the Seer, while disaster comes when the
    psychical man attempts to live on his own account.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: For one who reaches the goal, things seen are said to have fallen away, but
    they continue for others who remain under illusion.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The association of the Seer with things seen is said to produce realization
    of both the nature of things seen and the nature of the Seer; life is described
    as educative across many lives.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The cause of the association is identified as the darkness of unwisdom, and
    ending this darkness is identified as great liberation and the Seer’s attainment
    of pure being.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
