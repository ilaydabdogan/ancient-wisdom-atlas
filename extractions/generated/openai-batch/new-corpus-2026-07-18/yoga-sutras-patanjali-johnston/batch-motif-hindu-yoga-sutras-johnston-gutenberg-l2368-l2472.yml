canonical_text:
  quote: ''
  summary: 'The passage explains transfer of individuality from the personal self
    to the spiritual man through detachment, then comments on sutras concerning upward-life,
    binding-life, spiritual hearing, and etheric traversal. It presents both exterior
    and interior meanings: freedom from water and thorns, ascent, radiance, hearing
    through the ether, and inhabiting psychic or etheric bodies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The transfer of individuality to the spiritual man is described as requiring
    weakening of bondage, detachment, and attention to the finer consciousness rather
    than to the personality.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mastery of the upward-life is said to bring freedom from water, morass, and
    thorny places, and to grant the power of ascension.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The surface meaning of upward-life is explained as a levitation-like power
    enabling walking on water or passing over thorns without injury.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The deeper meaning of upward-life is explained as aspiration or upward will
    that builds and awakens the spiritual man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The spiritual man is said to pass safely over the waters of death and rebirth
    and to avoid being pierced by thorns in the path.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A cited Katha Upanishad passage says that one of the heart’s one hundred and
    one channels passes to the crown, and going up it leads to the immortal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mastery of the binding-life is said to bring radiance and to involve life-currents
