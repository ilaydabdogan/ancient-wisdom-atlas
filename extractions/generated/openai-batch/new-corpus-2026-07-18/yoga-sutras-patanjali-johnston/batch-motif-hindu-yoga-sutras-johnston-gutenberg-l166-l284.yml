  quote: 'OM: Here follows Instruction in Union.'
  summary: The passage opens Book I by defining Union as the union of individual soul
    and personal consciousness with Oversoul and Divine Consciousness. It describes
    spiritual consciousness as gained by controlling the psychic nature, explains
    the Seer’s emergence into proper nature, classifies psychic activities, and defines
    sound and unsound intellection, predication, sleep, memory, and the control of
    these activities.
