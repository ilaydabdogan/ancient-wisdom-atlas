canonical_text:
  quote: ''
  summary: 'The passage closes a brief Ayopechcatl hymn addressing a newcomer or little
    jewel to cry out, followed by a note identifying Ayopechcatl as a goddess of child-bed
    and the newborn. It then gives the Nahuatl text, gloss, English translation, and
    notes for a hymn to Cihuacoatl/Quilaztli/Tonan: she comes from Colhuacan adorned
    with eagle feathers and serpents'' blood, carries a hoe, beats a drum, supports
    the fields, is called mother and war goddess, protects in war, and is interpreted
    in the notes as mythical mother of humanity, a fertility/reproduction goddess,
    and a twin-bearing figure. The passage then begins the next Nahuatl song, with
    no English translation included in this excerpt.'
  language: English and Nahuatl
  quote_policy: summarized
