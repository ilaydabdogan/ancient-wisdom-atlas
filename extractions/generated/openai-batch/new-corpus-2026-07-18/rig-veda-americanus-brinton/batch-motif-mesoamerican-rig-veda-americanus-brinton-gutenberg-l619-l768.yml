canonical_text:
  quote: ''
  summary: The passage contains the end of a Nahuatl gloss, Brinton's English translation
    of the Hymn of Tlaloc with notes, and the beginning of the Hymn to the Mother
    of the Gods. Tlaloc appears and returns to a place of blood-sacrifices, is associated
    with Tlalocan, clouds, mist, rain, thunder, lightning, and an afterlife return
    after four years. The notes explain Tlalocan as both a mountain and an earthly
    Paradise, and describe a house of mist ritually represented by four buildings
    facing the cardinal points. The Mother of the Gods is praised as coming from Paradise,
    producing flowers and maguey seeds, shining in a thorn bush like a butterfly,
    and sustaining wild beasts in the desert.
  language: Nahuatl with English translation and English notes
  quote_policy: summarized
