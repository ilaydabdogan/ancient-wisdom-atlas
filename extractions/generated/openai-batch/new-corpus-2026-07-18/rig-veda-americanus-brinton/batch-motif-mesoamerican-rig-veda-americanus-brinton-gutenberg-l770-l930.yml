canonical_text:
  quote: ''
  summary: The passage closes a hymn and notes on an earth goddess identified as Teteoinan,
    Toci, and the Heart of the Earth, describing her fertility and maternal functions
    and explaining Tamoanchan as a divine paradise and realm of departed souls. It
    then gives a hymn to Chimalipan in parturition, where a virgin mother gives birth
    to the adviser of battles on Coatepec, followed by notes identifying her with
    the mother of Huitzilopochtli and Chimalman. A further hymn to Ixcocauhqui describes
    the Hall of Flames, a magician descending by a rope fastened to a sacred tree
    into a magical house, song and dance, and a woman associated with mist and rain.
  language: English with Nahuatl hymn text and glosses
  quote_policy: summarized
