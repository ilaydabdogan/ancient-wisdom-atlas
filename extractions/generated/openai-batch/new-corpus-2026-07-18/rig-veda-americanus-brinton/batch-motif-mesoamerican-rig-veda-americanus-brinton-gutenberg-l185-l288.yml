canonical_text:
  quote: ''
  summary: The passage lists illustrations of named divinities or ritual figures,
    then introduces the manuscript history of Sahagun's collection of Nahuatl hymns.
    It describes the Florentine and Madrid manuscripts, notes the absence of translations
    of the hymns, quotes a Christian polemical comment interpreting the chants as
    obscure songs in which the Devil hides, and states that colored illustrations
    of divinities or symbols in the Florentine manuscript were probably copied from
    native hieroglyphic books that preserved ancient songs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The list of illustrations names Xippe Totec, a priest of Xippe Totec, Chicomecoatl,
    the Totochtin, and Atlaua, with brief attributes or actions for each.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The preservation of the collection is attributed to Father Bernardino de Sahagun,
    described as an early missionary to Mexico and author of a major work on ancient
    Mexican religion, manners, and customs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sahagun is said to have mastered Nahuatl, composed his Historia primarily
    in the native language, and then produced a Spanish translation that was partly
    abbreviated.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Florentine Nahuatl manuscript is described as a complete copy in three
    large volumes with 1,378 hand-drawn illustrations, mostly colored, concerning
    native mythology, history, arts, and usages.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Madrid manuscript is described as incomplete, older, and useful because
