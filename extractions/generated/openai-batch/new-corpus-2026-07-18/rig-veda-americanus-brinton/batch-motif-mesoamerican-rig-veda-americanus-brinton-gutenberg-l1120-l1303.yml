  quote: ''
  summary: The passage gives hymns and notes concerning Xochiquetzal, Amimitl, Otontecutli,
    and Ayopechcatl. It includes a water-side dance and search for Xochiquetzal, a
    Chichimec-style dance song for Amimitl with four noble companions, a war song
    associated with Otontecutli and Quetzalcoatl, and a birth-house hymn in which
    Ayopechcatl takes charge of a child during lying-in.
