canonical_text:
  quote: ''
  summary: The passage gives a Nahuatl hymn to Huitzilopochtli with gloss, English
    translation, and notes. The hymn praises Huitzilopochtli as unmatched, terrifying
    to enemy peoples, a battle commander and hurler, and summons Amanteca and Pipiteca
    to gather in a house of war. Editorial notes identify him as an Aztec war-god,
    connect the hymn with a feast chant, explain the ancestral garb as Quetzalcoatl
    insignia worn by the high priest, and connect the Hurler epithet with the lightning
    serpent. The passage then quotes a comparable Sahagun hymn describing Huitzilopochtli
    as a war-making figure who hurls a flaming serpent and fire stick and whose festival
    involves the slaying of captives and washed slaves.
  language: Nahuatl with English translation and notes
  quote_policy: summarized
