canonical_text:
  quote: ''
  summary: The passage contains the end and notes of a Nahua hymn sung every eight
    years during a bread-and-water fast, invoking divinities including Tonan, Tlazolteotl,
    Cinteotl, Quetzalcoatl, and Xochiquetzal, with imagery of flowers, water-birth,
    birdsong, markets, ball play, youth, death, and sleep. Editorial notes explain
    some metaphors and connect the festival with Sahagun's description of atamalqualiztli,
    including Mazateca swallowing living serpents and frogs. The passage then begins
    a hymn of the High Priest of Xipe Totec, describing golden garments, descent upon
    water, likeness to a water cypress and green serpent, Yoatzin's appearance to
    mortals, and strengthening people for war.
  language: English with Nahuatl titles, variants, and glosses
  quote_policy: summarized
