canonical_text:
  quote: ''
  summary: The passage gives notes on Ixcocauhqui as a Mexican fire god and on the
    tzonmolco temple place, then presents the Hymn of Mixcoatl with translation and
    notes connecting Mixcoatl to Chichimec worship, Chicomoztoc, migration leadership,
    hunting, and tornado. It then presents the Hymn to Xochipilli, in which a quetzal
    bird sings to Cinteotl and priests are sent to Tlaloc's house, followed by notes
    identifying Xochipilli as a flower and fertility deity associated with Tlaloc
    and Cinteotl. The excerpt ends at the beginning of a hymn to Xochiquetzal.
  language: English with Nahuatl hymn text
  quote_policy: summarized
