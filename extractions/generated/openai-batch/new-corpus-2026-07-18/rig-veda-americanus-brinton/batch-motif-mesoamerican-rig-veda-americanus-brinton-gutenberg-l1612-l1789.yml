canonical_text:
  quote: ''
  summary: The passage gives notes on Xipe Totec, including his bloody festival, temple,
    night-related epithet, and high priest's duty of heart extraction. It then presents
    hymns and notes for Chicomecoatl as a food, corn, seed, and vegetable goddess
    who guides petitioners to Tlalocan; Tezcatzoncatl Totochtin as a pulque-related
    deity associated with lamentation, fearful effects, drink-giving, rabbits, and
    drunkenness; and the beginning of the hymn of Atlaua, with Chalmecatl, Quilaztli,
    discarded sandals and helmet, shields, arrows, priestly garb, and a quetzal-bird
    simile.
  language: English with Nahuatl hymn text and glosses
  quote_policy: summarized
