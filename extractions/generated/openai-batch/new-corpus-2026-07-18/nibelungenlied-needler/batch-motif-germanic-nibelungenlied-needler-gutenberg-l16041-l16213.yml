canonical_text:
  quote: ''
  summary: After prolonged fighting in the hall, Hagen keeps watch while the Burgundian
    warriors rest among corpses. Etzel and Kriemhild send Hunnish warriors against
    them; Dankwart defends the door. The besieged Burgundian leaders ask for respite
    or open combat. Etzel refuses peace because his child and kin have been slain.
    Kriemhild blocks the near-granted exit, refuses mercy to her brothers, blames
    Hagen, and offers life only if Hagen is surrendered as hostage. The adventure
    heading says the queen ordered the hall set on fire, though the supplied stanzas
    stop before that action is narrated.
  language: English
  quote_policy: summarized
