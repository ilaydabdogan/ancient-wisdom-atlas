    that she will find it when going to early matins.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kriemhild wakes her maids for worship, asks for a light and clothing, and
    a chamberlain then finds Siegfried's corpse outside.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
