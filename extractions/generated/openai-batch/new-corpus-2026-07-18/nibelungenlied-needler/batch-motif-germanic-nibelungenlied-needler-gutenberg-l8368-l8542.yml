canonical_text:
  quote: ''
  summary: After the hunting party returns over the Rhine, Hagen has Siegfried's lifeless
    body secretly placed before Kriemhild's dwelling so she will find it on her way
    to matins. A chamberlain discovers the bloody corpse, Kriemhild recognizes Siegfried,
    accuses Brunhild and Hagen, collapses and laments, summons Siegfried's men and
    Siegmund, and vows vengeance. Siegmund and the warriors come armed to the sound
    of mourning, and grief echoes through Worms.
  language: English
  quote_policy: summarized
