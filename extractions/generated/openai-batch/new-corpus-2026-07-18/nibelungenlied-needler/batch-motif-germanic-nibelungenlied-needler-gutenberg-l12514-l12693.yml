canonical_text:
  quote: ''
  summary: After crossing the river, the Burgundians seek guidance through the land.
    Hagen reports a prophecy from two mermaids that none of them will return home
    except the chaplain, whom he had tried to drown. He warns the company to arm themselves,
    because he killed a ferryman and expects Gelfrat and Else to avenge him. Volker
    is made vanguard guide and carries a red banner. Gelfrat and Else gather warriors
    and pursue. At night Hagen and Dankwart guard the rear; Gelfrat confronts Hagen
    over the boatman’s death, Hagen admits the killing, and combat begins. Gelfrat
    unhorses Hagen, who rises again as the fighting continues.
  language: English
  quote_policy: summarized
