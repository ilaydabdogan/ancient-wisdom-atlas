  quote: My master now hath sent me / to woo him other wife
  summary: Ruediger states that Etzel has sent him to the Rhine to woo Kriemhild after
    Helke’s death. Gotelinde approves the mission and equips the travelers with rich
    garments and supplies. Ruediger and five hundred knights travel from Bechelaren
    to the Rhine, are recognized and formally welcomed at Gunther’s court, and Ruediger
    asks leave to deliver his message.
