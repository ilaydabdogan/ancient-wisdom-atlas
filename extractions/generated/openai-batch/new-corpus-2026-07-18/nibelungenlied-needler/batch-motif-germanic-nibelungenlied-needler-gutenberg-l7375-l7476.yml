canonical_text:
  quote: ''
  summary: After a quarrel involving Siegfried's and Gunther's wives, Brunhild grieves
    and Hagen vows that Kriemhild's husband, Siegfried, must atone. Several knights
    discuss killing Siegfried. Giselher and Gunther object on grounds that Siegfried
    has done them good and does not deserve death, while Hagen and Ortwein press for
    vengeance. Hagen then devises a secret plan involving unknown heralds bearing
    hostile tidings so that Siegfried will offer service and lose his life. Gunther
    follows Hagen's counsel, and the narrator states that treachery began and that
    many heroes died from the quarrel of two women.
  language: English
  quote_policy: summarized
