canonical_text:
  quote: ''
  summary: Siegfried and his retinue depart for Burgundian land amid sorrow and foreboding,
    arrive richly armed at Worms, and are received as unknown noble strangers. King
    Gunther seeks help identifying them; Ortwein recommends Hagen, who inspects the
    strangers and identifies the proud adventurer as likely Siegfried, recalling Siegfried's
    deeds among the Nibelungen and the hoard brought from a mountain hollow.
  language: English
  quote_policy: summarized
