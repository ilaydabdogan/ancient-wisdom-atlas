canonical_text:
  quote: '"As there the noble Siegfried / to drink o''er fountain bent, / Through
    the cross he pierced him"'
  summary: During a hunt, Hagen and Gunther use the absence of wine and the promise
    of a cold spring to draw thirsty Siegfried to a fountain. Hagen challenges Siegfried
    to a race; Siegfried wins, lays aside his weapons, and courteously lets Gunther
    drink first. Hagen removes Siegfried's weapons, locates a cross on his tunic,
    and spears him as he bends to drink. Wounded, Siegfried attacks Hagen with his
    shield, then weakens, sinks among the flowers, and condemns Hagen and Gunther
    for a faithless killing that brings shame on their kin.
  language: English
  quote_policy: quoted
