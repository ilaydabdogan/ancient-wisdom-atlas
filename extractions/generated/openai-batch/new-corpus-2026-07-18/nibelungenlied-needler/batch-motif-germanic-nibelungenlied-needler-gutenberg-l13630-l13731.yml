canonical_text:
  quote: ''
  summary: Kriemhild complains that little has been brought to her of something she
    once possessed. Hagen says he has brought nothing for her and names the arms he
    carries. Kriemhild orders that no weapons be borne into the hall and asks the
    warriors to give them to her for safekeeping, but Hagen refuses. She suspects
    that someone warned Hagen and her brother; Dietrich declares that he gave the
    warning. Kriemhild withdraws in shame and anger. Dietrich greets Hagen, and Etzel
    asks who he is. A knight identifies Hagen of Tronje, son of Aldrian. Etzel recalls
    Aldrian, Hagen and Walter as former hostages at his court, and Walter’s flight
    with Hildegunde. The narrator foreshadows Kriemhild’s treachery and the death
    of the visitors.
  language: English
  quote_policy: summarized
