canonical_text:
  quote: ''
  summary: The passage recounts Iring returning from a first clash with Hagen, being
    thanked by Kriemhild, taking up a renewed challenge, and dying from wounds inflicted
    by Hagen. Kriemhild laments him, and Iring warns the Danes and Thuringians against
    Hagen. Irnfried and Hawart then lead warriors against the Burgundians; their leaders
    fall, and Volker urges letting the attackers into the hall, where many are slain.
  language: English
