canonical_text:
  quote: ''
  summary: Ruediger, bound by service to Etzel and Kriemhild yet joined in friendship
    and marriage alliance with the Burgundians, decides he must fight the guests he
    loves. He commends his household to Kriemhild, arms his men, approaches the hall,
    and declares to the Nibelungen that their friendship is broken. Gunther and Gernot
    plead with him by friendship, hospitality, and gifts, but Ruediger says his vow
    cannot be released.
  language: English
