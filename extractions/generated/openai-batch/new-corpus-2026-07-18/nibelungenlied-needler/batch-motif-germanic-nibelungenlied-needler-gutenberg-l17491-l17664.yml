canonical_text:
  quote: ''
  summary: 'A sequence of deaths in the hall battle is narrated: Hildebrand kills
    Volker; Hagen grieves and attacks in vengeance; Dankwart is slain by Helfrich;
    Wolfhart and Giselher kill each other; Wolfhart gives dying instructions and a
    death-boast; Hagen wounds Hildebrand with Balmung; Hildebrand escapes to Dietrich
    with sad news while only Gunther and Hagen remain of their company.'
  language: English
  quote_policy: summarized
