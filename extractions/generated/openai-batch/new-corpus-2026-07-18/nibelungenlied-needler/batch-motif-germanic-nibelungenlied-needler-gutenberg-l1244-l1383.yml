canonical_text:
  quote: ''
  summary: The opening of the First Adventure introduces Kriemhild, her Burgundian
    royal family and court, then recounts her dream of a falcon killed by two eagles.
    Queen Ute interprets the falcon as a noble future husband. Kriemhild rejects love
    because joy can lead to sorrow, but the narration says she later marries the knight
    represented by the falcon; her kin later slay him, and her revenge causes many
    deaths.
