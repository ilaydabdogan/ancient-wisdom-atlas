canonical_text:
  quote: ''
  summary: 'The passage first summarizes the spread and preservation of the Nibelungen/Siegfried
    saga among Germanic peoples, especially in Icelandic Eddic and Volsung material.
    It then recounts a sequence in which Odin, Honir, and Loki incur a ransom for
    killing an otter-form son of Hreidmar; Loki obtains cursed gold and a ring from
    Andvari; Fafnir murders Hreidmar and guards the hoard as a dragon. The passage
    continues with the Volsung line: Sigmund draws a sword placed in an oak by a one-eyed
    stranger, Signy is unwillingly married to Siggeir, Volsung and most of his sons
    are destroyed, Sigmund survives, Signy engineers revenge through Sinfiotli, Sigmund
    and Sinfiotli burn Siggeir’s hall, and Sigmund later falls wounded after a one-eyed
    old man breaks his sword with a spear.'
  language: English
  quote_policy: summarized
