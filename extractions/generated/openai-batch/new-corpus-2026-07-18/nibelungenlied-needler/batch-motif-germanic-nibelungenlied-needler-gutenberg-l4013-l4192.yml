canonical_text:
  quote: ''
  summary: Gunther, Siegfried, Hagen, and Dankwart arrive by ship at Brunhild's land
    and approach her castle. Gunther sees maidens at the casements and, prompted by
    Siegfried, chooses the woman in snow-white clothing as the one he would take as
    wife; Siegfried identifies her as Brunhild. Siegfried performs service for Gunther
    by handling his horse. The richly dressed visitors ride to Brunhild's marble hall
    and castle, where attendants receive them and enforce the custom that strangers
    surrender weapons. Brunhild hears that unknown warriors have arrived over the
    sea and asks who they are; a servant describes the newcomers by appearance and
    bearing.
  language: English
  quote_policy: summarized
