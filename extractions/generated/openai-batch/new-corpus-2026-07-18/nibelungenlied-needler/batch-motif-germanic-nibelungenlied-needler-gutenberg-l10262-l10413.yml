canonical_text:
  quote: ''
  summary: Kriemhild prepares to leave for Hunland with rich clothing, horses, attendants,
    and treasure. Hagen prevents her from taking Siegfried's Nibelung treasure, fearing
    she will use it to gain support against him. Ruediger reassures her that Etzel
    will provide wealth. Gernot opens the treasure chamber and allows some wealth
    to be taken, though Ruediger refuses to touch the Nibelung treasure. Kriemhild
    gives gold as mass-money for Siegfried's soul, asks who will accompany her, receives
    Eckewart's pledge of loyal service with five hundred men, and departs amid weeping,
    accompanied by maidens, brothers, retainers, and escorts. Messengers go ahead
    to tell Etzel that Ruediger has won Kriemhild as bride for him.
  language: English
  quote_policy: summarized
