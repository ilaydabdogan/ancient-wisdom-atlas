canonical_text:
  quote: ''
  summary: Ruediger tells his wife and daughter that Kriemhild's royal brothers and
    their companions are coming to Bechelaren and instructs them to greet the guests
    courteously. The women prepare rich clothing and ornaments. Ruediger welcomes
    the Burgundian guests, promises lodging, protection, and compensation for any
    losses, and has tents raised. The margravine, her daughter, and many ladies and
    maidens receive the guests with formal greetings and kisses. Ruediger's daughter
    is frightened when commanded to kiss Hagen, but does so, then also kisses Dankwart
    and Volker. The guests are led into a spacious hall, given wine and a feast, admire
    the women, and later observe customary separation of knights and ladies at table.
    Volker jokes and praises Ruediger's blessed household.
  language: English
  quote_policy: summarized
