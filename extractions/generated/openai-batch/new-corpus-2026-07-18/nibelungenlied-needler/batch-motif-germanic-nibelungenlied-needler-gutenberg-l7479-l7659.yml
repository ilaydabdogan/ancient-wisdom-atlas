canonical_text:
  quote: ''
  summary: False messengers arrive at Gunther's court with a fabricated threat from
    Luedegast and Luedeger. Gunther and Hagen use the report in a plot against Siegfried.
    Siegfried volunteers to fight the supposed enemies, while Hagen approaches Kriemhild
    under the pretense of protecting him. Kriemhild, trusting Hagen, recounts that
    Siegfried slew a worm-like dragon by a mountain, bathed in its blood, and became
    unharmed by cutting weapons; she then begins to reveal where he can still be struck.
  language: English
  quote_policy: summarized
