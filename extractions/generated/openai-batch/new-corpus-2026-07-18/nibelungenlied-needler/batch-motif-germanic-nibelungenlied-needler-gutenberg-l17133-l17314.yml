canonical_text:
  quote: ''
  summary: Dietrich hears extraordinary lamentation in Etzel's hall and sends men
    to learn what has happened. Helfrich reports that Ruediger and all who entered
    with him have been slain by the Burgundians. Dietrich and his warriors mourn Ruediger;
    Wolfhart urges vengeance. Hildebrand is sent to question the Burgundians and,
    despite first intending to go without weapons, is accompanied by armed Dietrich-men.
    Volker warns the Burgundians of their approach. Hildebrand asks about Ruediger,
    Hagen confirms the report, and Dietrich's warriors weep for their fallen friend
    and benefactor.
  language: English
