canonical_text:
  quote: ''
  summary: 'Hagen leaves his companions by the water to seek a ferryman. He encounters
    wise mermaidens bathing, takes their clothing, and receives predictions about
    the journey to Hunland: an initial favorable promise is corrected by a warning
    of betrayal and death, with only the king''s chaplain foretold to return. The
    mermaidens advise Hagen how to find and summon the ferryman at the border. Hagen
    offers a golden armband and uses the name Amelrich to draw the ferryman across;
    the narrator foreshadows the ferryman''s death by Hagen''s sword.'
  language: English
  quote_policy: summarized
