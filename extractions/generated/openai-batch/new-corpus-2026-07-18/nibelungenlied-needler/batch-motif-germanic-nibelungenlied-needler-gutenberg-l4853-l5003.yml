canonical_text:
  quote: ''
  summary: Siegfried and companions arrive by ship in Brunhild's country. Brunhild
    sees the approaching vessels, greets the arrivals at Gunther's direction, and
    later prepares for departure to Burgundy. Her treasure is lavishly distributed
    by Dankwart, after which she orders coffers filled with gold, jewels, and garments.
    She entrusts her lands and castles to her maternal uncle until Gunther can govern
    there. Brunhild leaves with ladies, maidens, and warriors, takes leave of her
    kin, crosses the sea with rejoicing, and defers becoming Gunther's spouse until
    the festival at Worms.
  language: English
  quote_policy: summarized
