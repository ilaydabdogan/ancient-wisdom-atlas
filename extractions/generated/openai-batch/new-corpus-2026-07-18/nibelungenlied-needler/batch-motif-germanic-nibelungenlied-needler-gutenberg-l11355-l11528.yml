canonical_text:
  quote: ''
  summary: King Etzel sends Werbel and Schwemmel from Hunland to Burgundy with a summons
    to his festival. Along the way they receive gifts and greetings from Ruediger's
    household and Bishop Pilgrim. They reach Worms, where Hagen recognizes them as
    Etzel's fiddlers, they are formally received, and Werbel conveys greetings from
    Etzel and Kriemhild to Gunther and the Burgundian princes. The narrator foreshadows
    that the summons will bring death to many.
  language: English
  quote_policy: summarized
