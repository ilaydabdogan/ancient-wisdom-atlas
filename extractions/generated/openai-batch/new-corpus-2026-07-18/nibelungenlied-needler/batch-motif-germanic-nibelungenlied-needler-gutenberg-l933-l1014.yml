canonical_text:
  quote: ''
  summary: 'The passage surveys Scandinavian and German records of the Nibelungen
    saga, including the Northern Edda, the German Nibelungenlied, Saxo Grammaticus,
    the Thidrekssaga, Danish materials, Faroese songs, the Klage, Hurnen Seyfrid,
    later German poems, Hans Sachs, a prose Volksbuch, and selected fairy tales. It
    summarizes several narrative elements: Kriemhild''s treachery or revenge, mourning
    and burial after slaughter, Siegfried/Seyfrid''s youth, smith apprenticeship,
    dragon-slaying, invulnerability, dwarf hoard, rescue of Kriemhild from a dragon,
    marriage, fraternal jealousy, and Hagen''s killing of Seyfrid at a spring.'
  language: English
  quote_policy: summarized
