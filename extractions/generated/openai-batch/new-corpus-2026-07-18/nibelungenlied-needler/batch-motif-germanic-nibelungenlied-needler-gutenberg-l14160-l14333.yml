canonical_text:
  quote: ''
  summary: At night in Etzel's court, the Burgundian guests seek rest. Hunnish followers
    of Kriemhild crowd them, and Volker and Hagen warn them away. The guests are lodged
    in a richly furnished hall, while the narrative states that Kriemhild plans harm.
    Hagen promises to keep watch, and Volker joins him. Volker plays his fiddle at
    the portal until the anxious warriors sleep, then resumes guard. Near midnight
    he sees armed men approaching in the dark. The attackers abandon their stealthy
    plan after seeing Volker and Hagen guarding the door.
  language: English
  quote_policy: summarized
