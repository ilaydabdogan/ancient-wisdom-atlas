canonical_text:
  quote: ''
  summary: After Siegfried's death, Siegmund urges Kriemhild to return with him to
    his land, promising her power, crown, warriors, and care for her son. Kriemhild's
    Burgundian kin persuade her to remain with her mother and brothers, though she
    fears seeing Hagen. Siegmund and Siegfried's men depart sorrowfully for the Nibelungen
    land; some speak openly of vengeance if Siegfried's killer is discovered.
  language: English
  quote_policy: summarized
