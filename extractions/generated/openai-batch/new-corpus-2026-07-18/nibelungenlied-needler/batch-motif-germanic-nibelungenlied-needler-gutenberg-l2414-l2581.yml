canonical_text:
  quote: ''
  summary: Gunther sends enemy messengers home with gifts, safe convoy, and a defiant
    warning. The Danish and Saxon kings muster large armies, while Gunther’s forces
    prepare to march. Siegfried asks Gunther to remain at home, promises to protect
    his land and honor, and advances with the Burgundian host into Saxony. Siegfried
    rides ahead alone, discovers the enemy army, and enters single combat with King
    Luedegast, whose golden shield marks him in the van.
  language: English
