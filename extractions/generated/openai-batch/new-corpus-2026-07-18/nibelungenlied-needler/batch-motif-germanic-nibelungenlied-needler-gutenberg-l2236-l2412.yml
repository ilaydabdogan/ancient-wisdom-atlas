canonical_text:
  quote: ''
  summary: Messengers from the Saxon king Luedeger and the Danish king Luedegast come
    to King Gunther's court and announce that their masters intend to invade and devastate
    his land around Worms on the Rhine. Gunther delays his answer while consulting
    advisers, including Gernot and Hagen. Hagen recommends informing Siegfried. Gunther
    hosts the hostile messengers as guests. Siegfried notices Gunther's sorrow, asks
    its cause, hears of the threatened invasion, pledges faithful help, and proposes
    to defend the land with a thousand of Gunther's men, his own twelve knights, and
    named Burgundian companions, with Volker carrying the banner.
  language: English
  quote_policy: summarized
