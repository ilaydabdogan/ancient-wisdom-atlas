canonical_text:
  quote: ''
  summary: Siegfried, unseen in his sightless mantle, travels by boat to the Nibelungen.
    He reaches an island and a hilltop castle, where he disguises his voice at the
    gate. A giant porter attacks him, and Siegfried binds him. Alberich, a dwarf steward,
    hears the fighting, attacks with a gold scourge, and is also subdued. After Siegfried
    reveals his name, Alberich acknowledges him as lord. Siegfried orders Alberich
    to summon Nibelung warriors, selects a thousand, and prepares them in costly attire
    for the journey to Brunhild's country.
  language: English
  quote_policy: summarized
