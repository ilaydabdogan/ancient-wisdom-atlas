canonical_text:
  quote: ''
  summary: In the hall battle, the Burgundian warriors and Ruediger's men continue
    killing one another. Gernot confronts Ruediger, naming Ruediger's earlier gift
    as a bane, and the two warriors kill each other. The surviving Burgundians mourn,
    Kriemhild accuses Ruediger of failing in vengeance, Volker refutes her by showing
    Ruediger's death, and Etzel and the court lament Ruediger.
  language: English
