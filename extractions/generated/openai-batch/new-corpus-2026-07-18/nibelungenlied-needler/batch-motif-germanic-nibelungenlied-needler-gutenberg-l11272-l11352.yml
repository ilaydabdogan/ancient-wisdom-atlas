canonical_text:
  quote: ''
  summary: King Etzel sends friendly greetings and invites Kriemhild's kin and friends
    to a midsummer feast in Hunland. Kriemhild privately instructs the messengers,
    promises them wealth, tells them to conceal any sign of her sorrow, and asks them
    to urge specific relatives to come, including Hagen because he knows the way.
    The narrator foreshadows that this advice will bring destruction to many. The
    messengers receive letters and gifts and depart richly clothed.
  language: English
