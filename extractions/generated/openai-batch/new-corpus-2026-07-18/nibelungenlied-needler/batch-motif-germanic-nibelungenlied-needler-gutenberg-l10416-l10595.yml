canonical_text:
  quote: ''
  summary: Kriemhild travels toward the Huns. Gernot and Giselher escort her as far
    as the Danube at Vergen and part from her with weeping. Giselher promises aid
    if she needs it in Etzel's land. Kriemhild takes leave of friends and continues
    with many maidens and guarded attendants. The party passes through Bavaria and
    Passau, where Bishop Pilgrim greets her, but Eckewart urges onward travel to Ruediger's
    country. Gotelinde, her daughter, Ruediger, and many warriors prepare to receive
    Kriemhild, provide protection, tents, and lodging, and hold a ceremonious meeting
    with riding and jousting. Gotelinde greets Kriemhild with a kiss and welcome;
    Kriemhild thanks her, while the narrator notes that neither woman knows what is
    still to come.
  language: English
  quote_policy: summarized
