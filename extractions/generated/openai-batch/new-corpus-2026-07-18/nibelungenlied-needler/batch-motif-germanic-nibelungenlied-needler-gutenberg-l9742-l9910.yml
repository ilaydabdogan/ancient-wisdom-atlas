canonical_text:
  quote: ''
  summary: Ruediger reports Etzel's grief after Helke's death and conveys Etzel's
    wish to marry the widowed Kriemhild. Gunther consults his kinsmen. Most support
    the match, while Hagen warns that if Kriemhild gains Etzel's power she will bring
    harm to the Burgundians. Giselher rebukes Hagen and supports Kriemhild. The brothers
    decide not to oppose the marriage if Kriemhild wants it, and Gere goes to tell
    her of Etzel's proposal.
  language: English
  quote_policy: summarized
