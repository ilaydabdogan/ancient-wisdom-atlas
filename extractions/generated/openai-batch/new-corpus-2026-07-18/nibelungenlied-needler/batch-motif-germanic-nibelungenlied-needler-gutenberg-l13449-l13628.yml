canonical_text:
  quote: ''
  summary: The Burgundians arrive in Etzel's land and are ceremonially received by
    Dietrich of Bern and his companions. Dietrich warns them that Kriemhild continues
    to mourn Siegfried and may seek vengeance. At Etzel's court, Hagen is recognized
    as Siegfried's killer. Kriemhild arranges separate quarters for Gunther's serving-men,
    greets Giselher selectively and with false intent, and confronts Hagen about the
    Nibelungen treasure, which he says was sunk in the Rhine.
  language: English
  quote_policy: summarized
