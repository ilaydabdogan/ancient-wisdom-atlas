  quote: '"Unto Brunhild''s country / as suitor now we fare"'
  summary: Kriemhild receives Gunther and Siegfried, hears that Gunther, Siegfried,
    Dankwart, and Hagen will travel to Brunhild's land, and agrees to help by preparing
    rich courtly apparel. With thirty skilled attendants she makes garments from costly
    silks, jewels, furs, and gold. A ship is prepared on the Rhine for the journey.
    At parting Kriemhild weeps, warns that Gunther's life is endangered, and commends
    him to Siegfried, who pledges to bring him safely home if he lives.
