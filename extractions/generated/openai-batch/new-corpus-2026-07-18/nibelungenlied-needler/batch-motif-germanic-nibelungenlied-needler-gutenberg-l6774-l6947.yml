  quote: Where now was high rejoicing / they soon in sorest grief repined.
  summary: Kriemhild, Siegfried, Siegmund, and their company travel from the Nibelung
    land to the Rhine for a feast. Their child remains behind. The narrative repeatedly
    foreshadows future sorrow. Messengers announce their arrival; Gunther, Brunhild,
    and the Burgundian court prepare a formal welcome, receive the guests with honor,
    and lodge and feed the retinue generously at Worms.
