canonical_text:
  quote: ''
  summary: The Burgundian company fights a night battle with Gelfrat, Else, and Bavarian
    followers. Dankwart kills Gelfrat after Hagen calls for help, Else retreats, and
    both sides suffer losses. Hagen asks that the royal masters not be told until
    morning, but blood on armor reveals the battle to Gunther at dawn. The company
    travels onward, is received by Bishop Pilgrim at Passau, crosses the water to
    camp, rests, and continues toward Ruediger's land. At the border Hagen stealthily
    takes the sword of the sleeping guard Eckewart, then returns it with six armbands
    as a token of friendship after Eckewart laments his dishonor.
  language: English
  quote_policy: summarized
