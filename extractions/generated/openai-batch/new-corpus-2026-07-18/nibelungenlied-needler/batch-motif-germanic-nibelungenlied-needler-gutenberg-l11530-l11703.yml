canonical_text:
  quote: ''
  summary: Messengers from Hunland convey Etzel and Kriemhild's invitation for Gunther
    and his kin to come to Etzel's land. Gunther delays his answer for counsel. The
    messengers greet Ute with Kriemhild's friendship. In council, most advise going,
    while Hagen warns of Kriemhild's vengeance because he killed her former husband.
    Gunther recalls her renunciation of vengeance, Gernot and Giselher argue for the
    visit, Hagen offers to guide if they insist, and Rumold urges staying safely at
    home. Gernot refuses to abandon the journey.
  language: English
  quote_policy: summarized
