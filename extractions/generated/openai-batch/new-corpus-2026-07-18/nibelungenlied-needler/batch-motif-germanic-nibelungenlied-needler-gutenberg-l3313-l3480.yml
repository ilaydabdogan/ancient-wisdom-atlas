canonical_text:
  quote: "“By royal leave did Kriemhild / kiss then the stately knight”"
  summary: Siegfried is summoned to court to receive Kriemhild’s greeting. Kriemhild
    welcomes him, takes his hand, and later kisses him with royal permission, while
    mutual affection is described. A Danish king foresees that the loving greeting
    will bring woe through Siegfried’s hand. Kriemhild goes to the minster, Siegfried
    offers homage after mass, and he says his service to her brothers is done for
    her grace. The court celebrates for twelve days; wounded warriors recover, games
    and feasting continue, Gunther offers gifts, and former Danish and Saxon enemies
    seek lasting friendship while Gunther asks Siegfried’s counsel about captives.
  language: English
  quote_policy: quoted
