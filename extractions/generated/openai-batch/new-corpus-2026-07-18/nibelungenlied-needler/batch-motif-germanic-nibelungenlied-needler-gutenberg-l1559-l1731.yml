canonical_text:
  quote: ''
  summary: Siegfried hears of Kriemhild, the beautiful royal maiden in Burgundy, and
    resolves to woo her. His parents, Siegmund and Siegelind, fear the danger posed
    by Gunther’s court and try to dissuade him. Siegfried insists, rejects taking
    an army, chooses to ride with twelve companions, and asks for fitting apparel.
    His mother, father, and women of the court prepare garments, armor, shields, and
    loaded horses for the impending departure.
  language: English
  quote_policy: summarized
