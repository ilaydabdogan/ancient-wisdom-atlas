canonical_text:
  quote: "“Fell down between his shoulders / full broad a linden leaf. / There may
    he be smitten”"
  summary: The passage recounts that Siegfried bathed in a dragon’s blood, but a linden
    leaf left a vulnerable place between his shoulders. Hagen asks Kriemhild to mark
    that place on Siegfried’s clothing, claiming he will protect him there. Kriemhild
    plans to sew a secret cross, believing it will help Siegfried, while the narrator
    states this betrays him. Hagen views the mark, sends secret messengers to cancel
    the military pretext, and Gunther proposes a hunt in the Vosges forest, which
    Hagen had advised. Siegfried agrees to join the hunt.
