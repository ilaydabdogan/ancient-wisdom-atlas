canonical_text:
  quote: ''
  summary: After Ruediger's death, Wolfhart and other warriors mourn him. Hildebrand
    asks that Ruediger's body be yielded from the hall so they may render service
    to him in death. Gunther praises such service, while Wolfhart and Volker exchange
    provocative words. Hildebrand restrains Wolfhart, but the men of Bern become angry
    and fighting breaks out. Hildebrand fights Hagen; Wolfhart fights Volker; the
    wider battle involves Gunther, Giselher, Dankwart, and warriors of the Amelungen/Bern
    side. The Bern warriors take vengeance for Ruediger. Siegstab cleaves helmets
    until Volker, angered by his slaughter, attacks and kills him.
  language: English
  quote_policy: summarized
