canonical_text:
  quote: '"That to the Huns ye journey / armed full well in warlike guise."'
  summary: Hagen advises Gunther to travel to Etzel's land armed because of Kriemhild's
    anger. Gunther gathers warriors and equipment, while Hagen delays Kriemhild's
    messengers until preparations are made. The Burgundians accept Etzel's invitation
    to attend a summer high-tide. The envoys are offered rich gifts, visit Ute, and
    return toward Hunland with escort and news that the Burgundians will follow.
  language: English
