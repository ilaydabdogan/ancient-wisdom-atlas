canonical_text:
  quote: ''
  summary: At Etzel's court, several allied groups enter or avoid a chivalric tournament
    with Gunther's Burgundians. Dietrich and Ruediger counsel restraint. Kriemhild
    watches and hopes harm will come to the Burgundians. Volker provokes the contest
    and kills a richly dressed Hun with a lance. The dead man's kinsmen seek revenge,
    but Etzel intervenes as host, restrains them, treats the killing as accidental,
    and escorts the Burgundian guests inside while hostility remains.
  language: English
  quote_policy: summarized
