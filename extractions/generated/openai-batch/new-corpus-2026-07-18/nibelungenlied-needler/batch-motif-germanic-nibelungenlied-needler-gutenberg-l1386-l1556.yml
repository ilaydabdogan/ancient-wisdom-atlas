canonical_text:
  quote: ''
  summary: The passage introduces Siegfried as the son of Siegmund and Siegelind at
    Xanten by the Rhine, describes his noble upbringing, prowess, and education, then
    narrates the festival at which he and other young men receive knighthood. The
    celebration includes a minster ceremony, jousting, feasting, minstrelsy, and lavish
    distribution of gifts. Afterward, others wish Siegfried to become king, but he
    refuses the crown while his parents live, though he desires mastery over hostile
    powers nearby.
  language: English
  quote_policy: summarized
