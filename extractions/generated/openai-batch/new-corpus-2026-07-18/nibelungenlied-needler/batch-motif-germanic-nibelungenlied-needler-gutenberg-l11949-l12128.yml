canonical_text:
  quote: ''
  summary: The Burgundian/Nibelungen company prepares for a stately armed journey
    from the Rhine toward Etzel's land. Ute warns her sons after dreaming that all
    birds in the country are dead, but Hagen dismisses dream counsel and, after Gernot's
    provocation, agrees to go. The party takes tearful leave, Rumold warns against
    Kriemhild's message and is entrusted with the homeland, and the warriors travel
    through Frankish lands to the Danube. At the Danube, floodwaters and the absence
    of boats make crossing uncertain, and Hagen speaks of danger and future fighting
    in Etzel's country.
  language: English
  quote_policy: summarized
