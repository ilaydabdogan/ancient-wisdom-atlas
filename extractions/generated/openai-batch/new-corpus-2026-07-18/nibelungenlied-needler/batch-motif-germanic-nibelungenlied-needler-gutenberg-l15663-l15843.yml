canonical_text:
  quote: ''
  summary: Iring of Denmark declares that he will seek honor by fighting Hagen. Although
    companions come armed with him, he obtains leave to meet Hagen alone. He fights
    Hagen, then Volker, Gunther, and Gernot, kills four Burgundian men, and is struck
    down by Giselher without being mortally wounded. Iring recovers, escapes past
    the portal, wounds Hagen through the helmet with the sword Waske, and Hagen pursues
    him down the steps.
  language: English
  quote_policy: summarized
