canonical_text:
  quote: ''
  summary: Ruediger sees the destruction on both sides and tries unsuccessfully to
    seek peace. A Hunnish warrior publicly taunts him for not fighting, and Ruediger
    strikes the man dead. Etzel and the queen press Ruediger to fulfill his obligations
    to them, while Ruediger insists that he escorted and hosted the strangers as friends
    and cannot honorably attack them. He laments that either action or inaction will
    violate faith and honor, offers to surrender his lands and wander away, and cites
    hospitality as a barrier to killing his guests.
  language: English
  quote_policy: summarized
