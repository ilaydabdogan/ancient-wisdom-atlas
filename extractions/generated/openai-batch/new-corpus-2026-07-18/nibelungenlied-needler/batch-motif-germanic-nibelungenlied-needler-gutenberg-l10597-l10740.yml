  summary: The passage describes Kriemhild and her company being welcomed at Bechelaren,
    receiving lodging and hospitality, exchanging rich gifts and pledges of service
    with Ruediger's household, and then departing toward Hunland. Guides and Hunnish
    escorts meet the party near the Danube and Traisem. The text recalls Helke as
    a former bounteous mistress at Etzel's castle and presents Etzel's court as a
    generous gathering place for Christian and heathen knights.
