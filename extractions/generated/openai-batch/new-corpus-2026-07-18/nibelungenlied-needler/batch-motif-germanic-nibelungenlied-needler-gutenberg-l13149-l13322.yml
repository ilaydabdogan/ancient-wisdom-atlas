  quote: '"What thing is doomed to happen, / who may the same prevent?"'
  summary: The Burgundian guests praise Ruediger's daughter and arrange her betrothal
    to Giselher. Ruediger pledges wealth and hospitality, delays the guests with feasting,
    and gives rich departure gifts. Gunther receives armor, Gernot receives a blade
    ominously linked to future havoc and Ruediger's death, and Hagen asks Gotelinde
    for a shield, causing her to remember her slain son Nudung.
