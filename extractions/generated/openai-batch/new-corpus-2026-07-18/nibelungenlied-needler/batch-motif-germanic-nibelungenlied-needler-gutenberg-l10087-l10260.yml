canonical_text:
  quote: '"The death of my loved husband / perchance shall yet avenged be."'
  summary: Kriemhild is urged by her brother, mother, and the kings to marry Etzel.
    She resists because of grief, loss of beauty, and the thought of a Christian woman
    marrying a heathen. Ruediger privately promises that Etzel and his men will requite
    wrongs done to her, and he swears faithful service. Kriemhild then considers Etzel's
    warriors and riches, her lost treasure, and the possibility of avenging her dead
    husband, and she pledges to become Etzel's wife and depart for Hunland with an
    escort.
  language: English
  quote_policy: quoted
