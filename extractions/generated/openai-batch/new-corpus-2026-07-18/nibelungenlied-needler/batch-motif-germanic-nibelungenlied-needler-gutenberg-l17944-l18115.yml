canonical_text:
  quote: ''
  summary: Dietrich defeats and binds Hagen and Gunther, handing both to Kriemhild
    while asking that they be spared. Kriemhild imprisons them separately. She offers
    Hagen life if he restores what he has taken, but he refuses to reveal the hoard
    while any of his masters lives. Kriemhild has Gunther beheaded and brings the
    head to Hagen. Hagen then says only God and he know the treasure’s hiding place.
    Kriemhild claims the sword once borne by Siegfried and beheads Hagen with it,
    while Etzel grieves.
  language: English
  quote_policy: summarized
