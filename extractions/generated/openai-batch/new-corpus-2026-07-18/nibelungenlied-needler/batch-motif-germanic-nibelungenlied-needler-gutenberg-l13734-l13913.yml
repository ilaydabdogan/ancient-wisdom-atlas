canonical_text:
  quote: ''
  summary: Hagen chooses Volker as companion, and the two sit on a settle near the
    hall where Kriemhild dwells. Kriemhild sees them, weeps over remembered wrongs,
    and urges her warriors to avenge her on Hagen, also intending harm to Volker.
    After judging sixty men insufficient, she has four hundred warriors prepared and
    goes crowned to confront Hagen. Volker warns Hagen of the armed company, pledges
    to stand beside him, and suggests rising to honor the queen. Hagen refuses to
    rise because he will not honor one who hates him and does not want the act read
    as fear.
  language: English
  quote_policy: summarized
