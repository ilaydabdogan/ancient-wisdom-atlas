  quote: '"Evil sound his melodies, / his strokes of bow are red"'
  summary: Etzel describes Volker as a dangerous warrior and minstrel inside the hall.
    Volker's music and bow-strokes are associated with killing many knights. At the
    hall door and beneath the roof, the guests take vengeance; Volker breaks helmets.
    Gunther and Hagen hear Volker's battle-music. Hagen praises Volker's loyalty,
    courage, and martial skill, saying the fiddler cleaves hard steel and scatters
    helmet-crests. The fighting in the hall then ceases, and the exhausted warriors
    lay down their swords.
