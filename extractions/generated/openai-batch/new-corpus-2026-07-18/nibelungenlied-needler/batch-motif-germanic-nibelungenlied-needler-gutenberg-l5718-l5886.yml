canonical_text:
  quote: ''
  summary: Siegfried lies happily with Kriemhild, while Gunther attempts to approach
    Brunhild in the bridal chamber. Brunhild refuses him until she learns an unspecified
    story, uses her silken girdle to bind and suspend him until morning, and releases
    him only after he promises not to touch her garment. The next day royal garments
    and crowns are brought, the couples attend mass and are consecrated/crowned, and
    the court celebrates with knightings. Gunther remains sorrowful, tells Siegfried
    what happened, and Siegfried promises to help him with Brunhild that night.
  language: English
  quote_policy: summarized
