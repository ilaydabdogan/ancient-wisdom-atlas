canonical_text:
  quote: ''
  summary: Eckewart warns the Burgundians that they may face vengeance because Siegfried
    was slain, but Hagen says the company chiefly needs shelter, food, and a host.
    Eckewart recommends Ruediger at Bechelaren as a generous host and carries Gunther's
    request for hospitality. Ruediger receives the message gladly, lays aside his
    sword at the gateway, welcomes the prospect of the Burgundian guests, learns the
    size of their retinue, and sends his men to attend them while Gotelinde remains
    unaware in her chamber.
  language: English
  quote_policy: summarized
