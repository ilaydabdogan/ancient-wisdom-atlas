canonical_text:
  quote: ''
  summary: Mortally wounded Siegfried is surrounded by hunters and mourners. He rebukes
    the wrongdoers, hears Hagen rejoice at his release from Siegfried's power, laments
    the harm to Kriemhild and their son, and asks the Burgundian king to protect Kriemhild.
    Siegfried dies with his blood wetting the flowers. The lords place him on a red-gold
    shield and plan to conceal Hagen's deed by saying robbers killed him while he
    hunted alone; Hagen says he will bring the body home and is not troubled by Kriemhild's
    grief.
  language: English
  quote_policy: summarized
