  summary: In the battle inside Etzel's hall, Volker and Dankwart hold the doors while
    Hagen attacks. Kriemhild and Etzel fear death, and Dietrich negotiates safe passage
    for himself, Kriemhild, Etzel, and his followers. Ruediger is also granted leave
    with his men. A Hunnish warrior attempts to act as Etzel passes out, but Volker
    kills him before Etzel, who laments the deadly guests he has hosted.
