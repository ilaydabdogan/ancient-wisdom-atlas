  summary: A noble prince is honored for his deeds in battle and is not treated as
    a common paid warrior. He remains briefly in order to see a maiden, then joyfully
    rides home to his father’s country. The king orders tournaments and prepares seating
    near Worms for arriving guests. Kriemhild learns of the coming feast, maidens
    prepare dresses and wimples, and Queen Ute orders rich garments prepared for her
    children, courtly women, riders, and strangers.
