  summary: 'The passage describes the development of the Nibelungen saga: a nature-myth
    is said to become a hero-saga centered on Siegfried; Burgundian historical disaster
    and Attila''s death are reshaped into saga; and the Burgundian-Attila material
    is joined with the Siegfried-Nibelungen material before later transmission northward
    and eventual German written form.'
