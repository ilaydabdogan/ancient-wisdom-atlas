canonical_text:
  quote: ''
  summary: Kriemhild receives a vast treasure after Siegfried's death and gives from
    it so freely that Hagen fears she will gain armed followers. Gunther initially
    acknowledges her ownership and recalls an oath not to wrong her, but Hagen argues
    that she should not hold the hoard. The treasure is taken from the widow; Hagen
    obtains the keys and later, while Gunther and his kin are away, sinks the hoard
    in the Rhine near Loch. Kriemhild and her women mourn the wrong; Hagen is spared,
    the hoard remains concealed, and Kriemhild continues to mourn Siegfried and the
    loss until her death.
  language: English
  quote_policy: summarized
