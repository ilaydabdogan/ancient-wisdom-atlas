canonical_text:
  quote: ''
  summary: The Burgundian warriors prepare to depart by ship, while women weep with
    foreboding. Gunther asks who will guide the vessel on the Rhine, and Siegfried
    says he knows the waterways. The party sails toward Brunhild's land and reaches
    Castle Isenstein on the twelfth morning. Siegfried explains that Brunhild rules
    the land and counsels the company to present Gunther as his master and himself
    as Gunther's servant. Siegfried says he undertakes this service chiefly for Kriemhild,
    whom he hopes to win as wife.
  language: English
  quote_policy: summarized
