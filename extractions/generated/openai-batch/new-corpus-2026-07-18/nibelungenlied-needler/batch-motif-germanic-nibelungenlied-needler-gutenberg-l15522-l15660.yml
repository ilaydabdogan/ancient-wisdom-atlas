canonical_text:
  quote: ''
  summary: After battle inside the hall, the Burgundian defenders remove thousands
    of dead and wounded bodies, cast them down the stairway, and taunt the Huns outside.
    Volker kills a margrave attempting to carry away a wounded kinsman. Hagen and
    Volker provoke King Etzel and his warriors, while Kriemhild warns Etzel, calls
    for Hagen's death, and offers gold, lands, and castles as reward for Hagen's severed
    head.
  language: English
  quote_policy: summarized
