canonical_text:
  quote: ''
  summary: After Siegfried is laid on a bier, his warriors and Siegmund prepare for
    vengeance, but Kriemhild restrains them and asks for help with burial. The community
    mourns, a rich casket is made, and Siegfried is carried to the minster. Gunther
    and Hagen arrive; Kriemhild challenges any claimant of innocence to approach the
    bier. The wounds bleed again when the slayer is present, revealing Hagen's guilt.
    Gunther denies Hagen's guilt by blaming robbers, but Kriemhild accuses Gunther
    and Hagen. Gernot and Giselher mourn and offer comfort, which fails to console
    her.
  language: English
  quote_policy: summarized
