canonical_text:
  quote: ''
  summary: 'At Bechelaren, costly gifts are given to the Burgundian guests: a lamented
    shield to Hagen, dress to Dankwart, and twelve armbands to Volker. Ruediger offers
    to escort the guests safely toward Etzel''s land, but the narration repeatedly
    notes that Ruediger and his men will not return alive. The party departs with
    sorrowful farewells and rides by the Danube. Messengers announce the arrival of
    the Nibelungen from Worms in Hunnish country. Kriemhild watches for her kinsmen
    from a casement, rejoices at their coming, and links her gold to remembrance of
    her sorrow.'
  language: English
  quote_policy: summarized
