canonical_text:
  quote: ''
  summary: Hagen seeks passage across a river from a ferryman, is refused, is attacked,
    kills the ferryman, and takes control of the boat. He repairs and handles the
    boat, falsely denies seeing the ferryman when questioned about blood in the vessel,
    and ferries the Burgundian host, horses, treasure, and apparel safely to the unknown
    land. Remembering a story told by women of the sea, Hagen throws the chaplain
    into the water and tries to make him drown; the chaplain reaches the nearer shore
    with God's help, and Hagen concludes that the sea-women's warning about the warriors'
    doom is true.
  language: English
  quote_policy: summarized
