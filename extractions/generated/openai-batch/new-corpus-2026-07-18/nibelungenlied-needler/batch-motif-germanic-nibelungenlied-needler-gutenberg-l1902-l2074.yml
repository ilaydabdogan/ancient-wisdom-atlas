canonical_text:
  quote: ''
  summary: 'Hagen recounts Siegfried’s earlier deeds in Nibelungenland: a great treasure
    was to be divided by Siegfried, he received King Nibelung’s sword, slew many warriors
    and two kings, defeated Alberich, won the sightless mantle, took the treasure,
    appointed Alberich chamberlain, and bound him by oath. Hagen also reports that
    Siegfried slew a dragon and bathed in its blood, making his skin weapon-resistant.
    Gunther receives Siegfried at Worms; Siegfried says he has come to test the fame
    of Gunther’s court and challenges Gunther to combat for lands, castles, people,
    and sovereignty. Gunther, Hagen, and Gernot resist the proposal.'
  language: English
  quote_policy: summarized
