  quote: ''
  summary: 'The passage recounts extended funeral rites for Siegfried: Kriemhild delays
    burial, orders vigils, masses, offerings, and alms for his soul, asks for one
    last sight of his face, kisses the corpse, collapses, and Siegfried is buried
    amid communal mourning and fasting.'
