canonical_text:
  quote: '"Like as the bright moon beameth / before the stars of heaven."'
  summary: Before vespers, Kriemhild and Brunhild argue publicly over whether Siegfried
    is Gunther's peer or liegeman. Kriemhild rejects Brunhild's claim of service,
    announces she will prove her own free and noble rank by going to the minster before
    Brunhild, and appears with a richly dressed retinue. The people notice that the
    queens no longer proceed together, and the narrator foreshadows trouble.
  language: English
  quote_policy: quoted
