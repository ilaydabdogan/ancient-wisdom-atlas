  summary: A large body of knights enters the house and is cut down by the Burgundians.
    After the fighting stops, blood flows from the slain through holes and corbels.
    The Burgundians rest and put down their weapons, while the Fiddler remains at
    the door in case more combatants arrive. King Etzel, his spouse, maidens, and
    ladies lament, and the passage states that many more warriors are doomed to fall
    before the strangers.
