canonical_text:
  quote: ''
  summary: News reaches Gunther of Brunhild, a powerful queenly maiden across the
    sea whose suitors must defeat her in three contests or lose their heads. Gunther
    resolves to risk the quest. Siegfried warns him, but Hagen advises him to seek
    Siegfried's help. Siegfried agrees if Gunther will give him Kriemhild as wife
    after Brunhild is brought to the Rhine. Oaths are sworn. Siegfried brings a wondrous
    mantle won from the dwarf Alberich, which grants invisibility and great strength.
    The party decides to travel as four knights—Gunther, Siegfried, Hagen, and Dankwart—rather
    than with an army. They consult Kriemhild for fine clothing suitable for Brunhild's
    court.
  language: English
  quote_policy: summarized
