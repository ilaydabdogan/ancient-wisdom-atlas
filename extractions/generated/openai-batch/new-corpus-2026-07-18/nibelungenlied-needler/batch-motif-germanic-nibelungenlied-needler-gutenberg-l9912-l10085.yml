canonical_text:
  quote: ''
  summary: Kriemhild, still grieving her lost husband, resists remarriage but agrees
    to receive Ruediger, Etzel’s envoy. Ruediger arrives with a formal embassy, finds
    Kriemhild sorrowful and tearful, and delivers Etzel’s offer of love, fidelity,
    royal honor, land, power, and authority comparable to Helke’s former position.
    Kriemhild objects that death has made her joyless, while the Huns urge her to
    accept; she postpones her answer and summons Giselher and her mother.
  language: English
  quote_policy: summarized
