canonical_text:
  quote: ''
  summary: In the close of Brunhild's physical trial, Siegfried secretly performs
    the decisive feats so that Gunther appears to have won. Brunhild commands her
    attendants and kin to pledge faith to Gunther, takes him by the hand, and he receives
    honors. Siegfried hides the sightless mantle and pretends ignorance while Hagen
    gives him an alibi. Brunhild delays departure for the Rhine in order to summon
    her people to Isenstein; Hagen fears danger, and Siegfried promises to return
    quickly with a thousand chosen warriors.
  language: English
  quote_policy: summarized
