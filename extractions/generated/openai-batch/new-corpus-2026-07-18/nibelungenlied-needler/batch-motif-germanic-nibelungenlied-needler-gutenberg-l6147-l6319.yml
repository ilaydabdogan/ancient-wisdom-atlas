canonical_text:
  quote: ''
  summary: Siegfried prepares to return home with Kriemhild. Kriemhild seeks a share
    of Burgundian land or retainers from her brothers; Siegfried declines the land
    share, while Gernot grants an escort. Hagen refuses to leave his service to the
    Burgundian kings. Kriemhild and Siegfried depart with attendants, messengers announce
    their coming to Siegmund and Siegelind, and they are welcomed at Xanten with gifts,
    rich dress, and proclamation that Siegfried will wear the royal crown.
  language: English
  quote_policy: summarized
