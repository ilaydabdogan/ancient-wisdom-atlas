canonical_text:
  quote: ''
  summary: Brunhild sees Siegfried and speaks with him. Siegfried presents Gunther
    as his master and suitor. Brunhild offers perilous games—stone-putting, following
    the cast, and spear-hurling—where Gunther may win her as wife, but if she wins
    the visitors forfeit their lives. Siegfried secretly retrieves and wears his sightless
    mantle, becoming unseen. Brunhild arms herself for the contest with rich armor
    and a massive red-gold shield, causing Hagen to fear for Gunther’s life.
