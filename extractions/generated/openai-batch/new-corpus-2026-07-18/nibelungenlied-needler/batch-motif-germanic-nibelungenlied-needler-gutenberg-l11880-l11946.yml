canonical_text:
  quote: '"To death ''twere making journey, / to country of the Huns to fare."'
  summary: Messengers carry news that Kriemhild's Burgundian kinsmen are coming to
    Etzel's land. Ruediger, Gotelinde, Etzel, and Kriemhild react with joy. Kriemhild
    asks especially about who is coming and what Hagen said. The messengers report
    Hagen's angry warning that the journey to the Huns would be a journey to death,
    and that Volker will also come. Kriemhild expresses particular pleasure that Hagen
    will come. Etzel orders preparations for the guests, while the narration foreshadows
    that the king's joy will soon be taken from him.
  language: English
  quote_policy: quoted
