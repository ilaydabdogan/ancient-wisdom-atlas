canonical_text:
  quote: ''
  summary: Burgundian warriors refuse to give Hagen as a hostage and affirm loyalty
    to one another. Kriemhild orders Etzel's men to burn the hall with the strangers
    inside. The trapped warriors endure heat, smoke, thirst, and falling brands; Hagen
    advises them to drink blood from the fallen, which revives them. They survive
    through the night, are mistakenly thought dead, and face another attack at dawn.
  language: English
