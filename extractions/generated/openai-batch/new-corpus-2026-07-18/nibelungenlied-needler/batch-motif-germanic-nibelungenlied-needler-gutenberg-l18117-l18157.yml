  quote: Here hath the story ending, / --that is the Nibelungen woe.
  summary: After a foremost warrior is slain by a woman, the monarch calls for arms
    and laments him. Hildebrand vows revenge, attacks Kriemhild with his blade, and
    she is killed. The remaining warriors and the queen lie dead; Dietrich and Etzel
    mourn, the feast turns to sorrow, and the narrator closes the tale as the Nibelungen
    woe.
