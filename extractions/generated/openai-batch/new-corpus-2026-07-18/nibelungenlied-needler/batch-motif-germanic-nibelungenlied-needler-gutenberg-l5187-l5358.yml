canonical_text:
  quote: ''
  summary: A knight brings joyful news that the king and his bride are coming and
    conveys the king’s request that the noble guests be received and met at the Rhine
    near Worms. Kriemhild is consoled, thanks and rewards the messenger, and the court
    prepares an elaborate reception with seating, invitations, rich garments, horse
    trappings, noble maidens, and armed warriors.
  language: English
