canonical_text:
  quote: ''
  summary: Etzel receives Gunther and the other Rhineland guests in his hall with
    elaborate welcome. He names the principal visitors, recalls messages sent to the
    Rhine, takes the guests by the hand, seats them, and has mead and mulberry wine
    served in golden goblets. Etzel speaks of his joy and of the queen's sadness being
    relieved by their arrival. Ruediger praises the queen's kin. The passage closes
    with the summer arrival at Etzel's palace and an abundant shared meal for the
    renowned heroes.
  language: English
  quote_policy: summarized
