canonical_text:
  quote: ''
  summary: Ortwein and Hagen object to Siegfried's proud armed arrival, but Gernot
    restrains the quarrel and prevents combat. Giselher and Gunther then welcome Siegfried
    and his companions with hospitality, lodging, and honor. Siegfried becomes prominent
    in courtly games and tournaments. He loves Kriemhild though he has not seen her;
    she secretly loves him and watches him from a casement. He remains in Gunther's
    country for a year without seeing her, while the narrator foreshadows both joy
    and grief through her.
  language: English
  quote_policy: summarized
