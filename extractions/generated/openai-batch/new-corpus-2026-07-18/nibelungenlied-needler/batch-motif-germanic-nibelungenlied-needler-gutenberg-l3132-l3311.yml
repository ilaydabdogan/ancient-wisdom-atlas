canonical_text:
  quote: ''
  summary: At a Whitsuntide festival on the Rhine, Gunther receives many noble guests
    with gifts and seats. Ortwein advises that Gunther honor the guests by letting
    them see the courtly women, including Kriemhild. Ute, Kriemhild, and many richly
    dressed ladies process into court. Kriemhild's beauty is described through sun,
    moon, and rose imagery. Siegfried sees her for the first time and is moved by
    love, joy, anguish, and despair. Gernot advises that Kriemhild greet Siegfried
    in recognition of his service so that he may remain a loyal friend.
  language: English
  quote_policy: summarized
