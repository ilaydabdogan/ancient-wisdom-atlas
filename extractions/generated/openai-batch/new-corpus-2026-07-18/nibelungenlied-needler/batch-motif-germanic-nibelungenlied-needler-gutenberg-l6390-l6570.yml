  quote: ''
  summary: Brunhild privately questions Kriemhild's high standing and Siegfried's
    lack of service to Gunther. She persuades Gunther to summon Siegfried and Kriemhild
    to the Rhine for a feast. Gunther sends thirty men with greetings and instructions.
    The messengers travel to the Nibelungen castle in Norway, are joyfully recognized
    and received, and Gere begins to deliver greetings from the Burgundian court.
  language: English
