canonical_text:
  quote: ''
  summary: Kriemhild enters Etzel's realm for the wedding-feast. Diverse Christian
    and heathen peoples and named chieftains ride out to receive her. Ruediger instructs
    her in the hierarchy of greetings; Etzel meets and kisses her; selected nobles
    also receive kisses. A martial tourney accompanies the reception, after which
    the couple sit in a prepared pavilion while the guests are lodged and further
    entertainments continue the next morning.
  language: English
  quote_policy: summarized
