canonical_text:
  quote: ''
  summary: At dawn Volker and Hagen rouse the Burgundian warriors for mass. Hagen
    warns them to wear armor instead of festive clothing, pray and confess because
    death is near, and remain armed together in the churchyard. Volker and Hagen confront
    Kriemhild at the minster entrance, while Etzel asks why his guests are armed and
    offers redress. Hagen gives a misleading explanation, Kriemhild conceals what
    she knows, and the Huns are angered but do not attack before Etzel. After service,
    Kriemhild and Etzel watch a mounted martial display in the court, where the Burgundians
    ride in a mass melee and Dietrich's men come to oppose them.
  language: English
  quote_policy: summarized
