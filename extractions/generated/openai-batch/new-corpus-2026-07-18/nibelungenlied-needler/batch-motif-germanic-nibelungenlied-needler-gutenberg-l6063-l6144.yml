canonical_text:
  quote: ''
  summary: A queen or maiden asks the noble monarch not to kill her and promises no
    longer to resist him. Siegfried secretly takes a golden ring and a richly wrought
    girdle from her and later gives them to Kriemhild, while Gunther lies with the
    maiden and her former strength wanes. Siegfried departs and avoids Kriemhild’s
    questions. The court festivities continue for two weeks with lavish distribution
    of garments, horses, silver, and gold before the guests depart.
  language: English
  quote_policy: summarized
