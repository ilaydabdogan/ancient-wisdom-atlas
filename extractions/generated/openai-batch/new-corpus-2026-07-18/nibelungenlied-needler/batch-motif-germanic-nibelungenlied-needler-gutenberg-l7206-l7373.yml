canonical_text:
  quote: ''
  summary: Before the minster, Brunhild blocks Kriemhild and claims precedence. Kriemhild
    responds by accusing Brunhild of sexual dishonor involving Siegfried, then enters
    before her. Brunhild later demands proof; Kriemhild displays a ring and girdle
    as tokens, while Brunhild claims they were stolen and appeals to Gunther. Gunther
    summons Siegfried, who denies having boasted of the alleged act and swears an
    oath before assembled warriors; Gunther declares him blameless.
  language: English
  quote_policy: summarized
