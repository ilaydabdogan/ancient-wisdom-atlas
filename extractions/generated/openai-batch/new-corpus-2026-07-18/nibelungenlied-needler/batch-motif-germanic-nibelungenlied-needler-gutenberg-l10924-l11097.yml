canonical_text:
  quote: ''
  summary: Etzel's wedding journey with Kriemhild reaches Vienna, where guests are
    lodged and honored. The wedding at Whitsuntide is marked by a long feast, splendid
    apparel, and extensive gift-giving. Kriemhild remembers her former queenly life
    by the Rhine but conceals her grief. The royal party then travels into Hunland,
    crosses water by lashed boats, and comes to Etzelburg, where Helke's former household
    and high-born women await Kriemhild. Kriemhild distributes wealth and gains the
    service of Etzel's warriors and kin, taking Helke's former place.
  language: English
  quote_policy: summarized
