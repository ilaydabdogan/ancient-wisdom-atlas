canonical_text:
  quote: ''
  summary: After Siegfried's death, Kriemhild lives in grief at Worms near the minster
    and her husband's grave. Her kin attempt reconciliation with Gunther, but she
    identifies Hagen as Siegfried's killer and withholds friendship from him. The
    Nibelungen hoard, described as Kriemhild's bridal portion, is fetched from its
    guarded hiding place, transported from the mountain to the Rhine, and brought
    to Worms. The hoard includes vast gold and jewels, a sightless mantle formerly
    taken by Siegfried, and a golden wish-rod with dominion-granting power.
  language: English
  quote_policy: summarized
