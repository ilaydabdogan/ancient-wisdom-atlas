canonical_text:
  quote: ''
  summary: Brunhild appears richly clothed and is given a massive spear and later
    a huge stone for a martial contest. Gunther and the Burgundian warriors fear the
    trial. Brunhild allows them to take swords. During the spear contest, Siegfried
    comes unseen, tells Gunther to make the motions while he supplies the strength,
    and secretly bears the shield. Brunhild's spear blow is deadly, but the sightless
    mantle protects Gunther and Siegfried. Siegfried returns the spear with the edges
    reversed so as not to pierce Brunhild, and she believes Gunther has made the throw.
    The passage ends as Brunhild throws a great stone and leaps after it.
  language: English
  quote_policy: summarized
