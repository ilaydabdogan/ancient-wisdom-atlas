canonical_text:
  quote: ''
  summary: After nine days of travel, Hagen advises that news should be sent ahead
    to Worms. Gunther first asks Hagen, who refuses and recommends Siegfried. Siegfried
    declines until Gunther frames the errand as service to Kriemhild, after which
    he accepts. Gunther gives messages for Ute, Kriemhild, his brothers, kinsmen,
    Ortwein, and the household, including instructions to welcome Brunhild and prepare
    festivities. Siegfried rides to Worms with twenty-four warriors. Because Gunther
    is not with him, the household and royal kin fear disaster, but Siegfried reassures
    Giselher, Gernot, Ute, and Kriemhild that Gunther and Brunhild are well.
  language: English
  quote_policy: summarized
