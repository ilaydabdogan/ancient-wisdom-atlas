canonical_text:
  quote: ''
  summary: At Gunther's feast, Siegfried reminds Gunther of his promise to give him
    Kriemhild if Brunhild were brought to the land. Gunther summons Kriemhild, who
    agrees to the marriage. Siegfried and Kriemhild are publicly pledged and seated
    together. Brunhild becomes angry and weeps, believing Kriemhild dishonored by
    marriage to one she thinks serves Gunther; Gunther explains Siegfried's royal
    status. The festivities move toward the bridal chambers while hostility between
    Brunhild and Kriemhild remains silent.
  language: English
  quote_policy: summarized
