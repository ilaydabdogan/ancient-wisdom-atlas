canonical_text:
  quote: ''
  summary: Dankwart enters Etzel's hall at the doorway, covered with blood from others,
    and reports to Hagen that Burgundian knights and squires have been slain in their
    lodging by Bloedel and his men; Dankwart says he has killed Bloedel. Hagen places
    Dankwart at the door and stairway to stop the Huns from passing. Hagen invokes
    Kriemhild's unavenged sorrow and a 'memory-cup,' then kills the child Ortlieb,
    whose severed head rolls into Kriemhild's lap. Hagen also kills the child's tutor
    and cuts off the right hand of the minstrel Werbel. Hagen, Volker, Gunther, Gernot,
    Giselher, and Etzel's warriors then fight in the royal hall, while Dankwart blocks
    passage at the stairway and Hagen calls on Volker to help him.
  language: English
  quote_policy: summarized
