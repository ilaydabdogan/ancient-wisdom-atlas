canonical_text:
  quote: ''
  summary: A battle passage describes Burgundian warriors and Siegfried fighting Saxon
    and Danish opponents. King Luedeger recognizes Siegfried by a painted crown emblem,
    stops the fight, sues for peace, and is taken as a hostage to Gunther's land.
    After the victory, a messenger reports the outcome to Worms and secretly to Kriemhild,
    who asks about her kin and the warrior she loves; the messenger praises Siegfried
    above all others while also naming other Burgundian fighters.
  language: English
