canonical_text:
  quote: ''
  summary: After Lady Helke's death, King Etzel is counseled to seek Lady Kriemhild
    of Burgundy as a wife. Etzel raises the obstacle that he is heathen and Kriemhild
    is Christian. Ruediger of Bechelaren, who knows the Rhine court, agrees to act
    as Etzel's messenger, prepares a large honorable escort, and begins arrangements
    for the journey. News reaches Gotelinde at Bechelaren, where Ruediger and his
    men are later welcomed.
