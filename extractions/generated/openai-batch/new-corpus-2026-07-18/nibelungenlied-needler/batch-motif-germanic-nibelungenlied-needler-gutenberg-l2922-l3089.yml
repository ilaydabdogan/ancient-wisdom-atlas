canonical_text:
  quote: ''
  summary: A report to Kriemhild recounts Siegfried's victory, the capture of enemy
    kings and hostages, and the return of Burgundian warriors. Kriemhild rewards the
    bearer of good news. Gunther welcomes the victors and captives, cares for wounded
    men, grants conditional freedom to enemies under pledge, rewards healers and warriors,
    and is later advised by Gernot to send men home until a feast. Siegfried wishes
    to depart, but Gunther asks him to remain for Kriemhild's sake.
  language: English
  quote_policy: summarized
