canonical_text:
  quote: ''
  summary: Bloedel comes armed with many men to the hall where Dankwart and Burgundian
    squires sit at table. He declares that Dankwart and the others must atone for
    Hagen’s killing of Siegfried and that their lives are forfeit to Kriemhild. Dankwart
    denies responsibility, kills Bloedel, and then faces attacks by Bloedel’s men
    and the Huns. The Burgundian squires fight with improvised weapons but are all
    killed, leaving Dankwart alone as he fights toward Etzel’s court and seeks to
    carry word to Hagen.
  language: English
  quote_policy: summarized
