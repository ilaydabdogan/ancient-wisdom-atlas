canonical_text:
  quote: ''
  summary: At Worms, Gunther and Brunhild arrive across the Rhine with Isenland and
    Nibelungen companions. Ute, Kriemhild, and the Burgundian court receive Brunhild
    with escorts, hand-leading, kisses, verbal welcome, splendid dress, tents, and
    tournaments. Observers compare the beauty of Brunhild and Kriemhild. The party
    later proceeds toward the castle hall amid further knightly display and merrymaking.
  language: English
  quote_policy: summarized
