  summary: A woman distributes red gold as hire against the foe. Armed warriors advance;
    Volker says the defenders remain where they are and notes the eagerness of those
    who accepted the king's bounty. Many attackers call for immediate battle, saying
    all must perish and only the foredoomed will fall. Twelve hundred men repeatedly
    assault and are repulsed; the strangers remain unvanquished, blood flows from
    many mortal wounds, the king's warriors are slain, and their kinsmen lament.
