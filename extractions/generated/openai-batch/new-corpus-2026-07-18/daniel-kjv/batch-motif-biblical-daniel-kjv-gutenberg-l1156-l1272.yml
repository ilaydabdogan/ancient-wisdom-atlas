canonical_text:
  quote: ''
  summary: Daniel understands from books the Jeremiah prophecy concerning seventy
    years of Jerusalem’s desolation. He fasts and prays, confessing collective sin,
    invoking God’s covenant mercy, the Mosaic law’s curse, the exodus, and Jerusalem’s
    desolate sanctuary and holy mountain. While Daniel is praying, Gabriel arrives
    in flight, touches him, and says he has come to give understanding because Daniel
    is greatly beloved. Gabriel announces a seventy-weeks timetable involving the
    holy city, the end of sin, reconciliation, everlasting righteousness, rebuilding
    Jerusalem, Messiah being cut off, and a future destruction of the city and sanctuary
    with war and desolations.
  language: English
  quote_policy: summarized
