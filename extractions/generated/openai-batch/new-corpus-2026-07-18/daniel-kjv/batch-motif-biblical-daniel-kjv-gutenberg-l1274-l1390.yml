canonical_text:
  quote: ''
  summary: The passage moves from a statement about covenant, halted sacrifice, abomination,
    and desolation into Daniel’s three-week mourning and a river-side vision of a
    radiant linen-clad figure. Daniel collapses, is repeatedly touched and strengthened,
    and receives explanation that his prayers were heard, that angelic princes connected
    with Persia and Grecia are involved in conflict, and that Michael supports the
    speaker. The passage then begins a prophecy concerning Persian kings, a mighty
    king whose kingdom is divided, and a failed agreement between the king of the
    south and the king of the north through the south’s daughter.
  language: English
  quote_policy: summarized
