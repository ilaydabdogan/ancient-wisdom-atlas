  - ev:8
  - ev:10
  - ev:11
  confidence: high
  cautions: Motif label is based on the passage's explicit theological explanation;
    no external historical claim is made.
- id: motif:2
  label: World-spanning royal tree cut down but preserved as stump
  taxonomy_refs:
  - sacred_tree_axis
  basis: The dream tree reaches heaven, is visible to all earth, shelters animals,
    is identified with the king, and is ordered cut down while its stump remains.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage itself interprets the tree as Nebuchadnezzar's dominion; the
    sacred-tree-axis classification is typological and should be reviewed.
- id: motif:3
  label: Abasement of proud king into animal-like wilderness state
  taxonomy_refs:
  - divine_judgment
  basis: Nebuchadnezzar is sentenced to dwell with beasts, eat grass like oxen, be
    wet with dew, and later appears with hair and nails compared to birds until he
    acknowledges divine rule.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage describes animal-like condition and bodily comparison, not
