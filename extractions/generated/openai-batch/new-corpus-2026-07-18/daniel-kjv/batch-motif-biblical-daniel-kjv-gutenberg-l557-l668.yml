canonical_text:
  quote: those that walk in pride he is able to abase.
  summary: 'Daniel interprets Nebuchadnezzar''s dream of a world-spanning tree as
    referring to the king: he will be cut down from human society, dwell with beasts,
    and remain under heavenly judgment until he acknowledges that the Most High rules
    kingdoms. After boasting of Babylon, Nebuchadnezzar is driven out, lives animal-like,
    later lifts his eyes to heaven, regains reason and kingship, and praises the King
    of heaven. The passage then begins Belshazzar''s feast, where Jerusalem temple
    vessels are brought for drinking.'
  language: English
  quote_policy: quoted
