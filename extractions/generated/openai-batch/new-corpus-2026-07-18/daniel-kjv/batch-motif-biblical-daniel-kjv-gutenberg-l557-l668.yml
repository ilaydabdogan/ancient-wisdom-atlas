- id: motif:4
  label: Restoration after acknowledgment of divine rule
  taxonomy_refs:
  - return
  - royal_legitimacy
  basis: After lifting his eyes to heaven and praising the Most High, Nebuchadnezzar's
    reason, honor, counsellors, kingdom, and majesty return.
  evidence_refs:
