canonical_text:
  quote: ''
  summary: Nebuchadnezzar besieges Jerusalem and takes Jehoiakim, captives, and temple
    vessels to Babylon/Shinar. Selected Judean youths, including Daniel, Hananiah,
    Mishael, and Azariah, are trained in Chaldean learning and renamed. Daniel asks
    not to eat the king’s food and wine; after a ten-day test on pulse and water,
    the four appear healthier. God gives them knowledge and wisdom, and Daniel understands
    visions and dreams. They excel before Nebuchadnezzar. Later Nebuchadnezzar has
    troubling dreams and demands that court experts reveal both the dream and its
    interpretation under threat of punishment.
  language: English
  quote_policy: summarized
