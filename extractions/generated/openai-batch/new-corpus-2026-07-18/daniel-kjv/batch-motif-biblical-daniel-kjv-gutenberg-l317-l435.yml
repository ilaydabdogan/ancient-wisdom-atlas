canonical_text:
  quote: ''
  summary: Daniel's interpretation explains mixed iron and clay as a divided kingdom
    and announces that the God of heaven will set up an everlasting kingdom symbolized
    by a stone cut from a mountain without hands. Nebuchadnezzar honors Daniel and
    promotes him and his companions. The king later erects a golden image, commands
    all peoples to worship it at the sound of music under threat of a burning furnace,
    and is told that Shadrach, Meshach, and Abednego refuse. When confronted, they
    state that their God can deliver them but that they will not serve the king's
    gods or worship the image.
  language: English
  quote_policy: summarized
