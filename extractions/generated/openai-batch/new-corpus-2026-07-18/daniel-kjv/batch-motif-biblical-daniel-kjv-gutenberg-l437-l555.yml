canonical_text:
  quote: ''
  summary: 'Nebuchadnezzar angrily orders Shadrach, Meshach, and Abednego bound and
    cast into an overheated fiery furnace. The fire kills the men who carry them,
    but the king sees four figures loose and unharmed in the furnace, the fourth described
    by him as like the Son of God. The three emerge unharmed, and Nebuchadnezzar blesses
    their God, credits an angelic deliverance, decrees punishment for speaking against
    their God, and promotes them. The passage then opens Nebuchadnezzar''s proclamation
    about the high God''s signs and wonders and recounts his troubling dream: after
    Babylonian wise men fail to interpret it, Daniel/Belteshazzar is summoned. The
    dream shows a great tree in the midst of the earth reaching heaven and feeding
    all flesh; a watcher and holy one descends from heaven and commands the tree cut
    down, its stump left bound with iron and brass, wet with dew, with a beast''s
    heart for seven times.'
  language: English
  quote_policy: summarized
