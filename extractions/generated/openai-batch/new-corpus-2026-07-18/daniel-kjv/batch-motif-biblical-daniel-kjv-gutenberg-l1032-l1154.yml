canonical_text:
  quote: ''
  summary: The passage closes Daniel's prior vision with an everlasting kingdom granted
    to the people of the saints of the most High and Daniel's troubled reaction. A
    later vision, dated to Belshazzar's third year and set at Shushan by the river
    Ulai, shows a two-horned ram, a western he-goat with a notable horn, the goat's
    defeat of the ram, the breaking of the goat's horn, the rise of four horns, and
    a little horn that attacks the heavenly host, sacrifice, sanctuary, and truth.
    Heavenly speakers ask the duration of the desecration, and an answer gives two
    thousand three hundred days until the sanctuary is cleansed. Gabriel is commanded
    to make Daniel understand; Daniel falls, is touched and set upright, and receives
    an interpretation identifying the ram with Media and Persia, the goat with Grecia,
    the great horn with a first king, the four horns with four kingdoms, and a later
    fierce king who opposes the Prince of princes but is broken without hand. Daniel
    is told to shut up the vision, becomes sick, returns to royal business, and remains
    astonished. The next section begins with a date in the first year of Darius.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The kingdom and dominion under the whole heaven are said to be given to the
    people of the saints of the most High, whose kingdom is everlasting; Daniel is
    troubled and keeps the matter in his heart.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A later vision appears to Daniel in the third year of King Belshazzar; in
    the vision Daniel is at Shushan in Elam by the river Ulai.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A ram stands before the river with two high horns, one higher than the other
    and rising later; the ram pushes westward, northward, and southward, and no beast
    can stand before it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A he-goat comes from the west over the face of the whole earth without touching
    the ground and has a notable horn between its eyes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The he-goat rushes at the ram in fury, smites it, breaks its two horns, casts
    it to the ground, and stamps on it; no one can deliver the ram.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The he-goat becomes very great; when strong, its great horn is broken, four
    notable horns arise toward the four winds, and from one of them a little horn
    grows toward the south, east, and pleasant land.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The little horn grows to the host of heaven, casts down some of the host and
    stars, magnifies itself to the prince of the host, removes the daily sacrifice,
    casts down the sanctuary-place, casts truth to the ground, and prospers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: One saint speaks and another asks how long the vision of the daily sacrifice,
    transgression of desolation, sanctuary, and host being trodden under foot will
    last; the answer gives two thousand three hundred days and then the sanctuary
    will be cleansed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Daniel seeks the meaning of the vision; an appearance like a man stands before
    him, and a man's voice between the banks of Ulai calls Gabriel to make Daniel
    understand the vision.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Gabriel comes near; Daniel is afraid and falls on his face; Gabriel says the
    vision is for the time of the end, touches Daniel while he is in deep sleep face
    to the ground, and sets him upright.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The interpretation identifies the two-horned ram as the kings of Media and
    Persia, the rough goat as the king of Grecia, the great horn as the first king,
    and the four horns as four kingdoms arising from that nation without the first
    king's power.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: A later fierce king understanding dark sentences is described as mighty by
    another power, destructive, prosperous, crafty, self-magnifying, destructive by
    peace, opposed to the Prince of princes, and ultimately broken without hand.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: Daniel is told that the vision of the evening and morning is true and to shut
    up the vision because it is for many days; afterward Daniel faints, is sick certain
    days, rises, does the king's business, and remains astonished, with none understanding
    it.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: The next section begins by dating events to the first year of Darius, son
    of Ahasuerus, of the seed of the Medes, made king over the realm of the Chaldeans.
  category: setting
  evidence_refs:
  - ev:13
