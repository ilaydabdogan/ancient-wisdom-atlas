  summary: A prophetic account describes successive conflicts between kings of the
    north and south, shifting alliances, military campaigns, capture of fortified
    places, political deceit, covenant violation, pollution of the sanctuary, removal
    of the daily sacrifice, and suffering and instruction by the faithful wise.
  language: English
