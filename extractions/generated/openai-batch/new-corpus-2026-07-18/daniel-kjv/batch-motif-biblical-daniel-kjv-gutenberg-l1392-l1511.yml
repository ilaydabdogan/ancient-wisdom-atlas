candidate_motifs:
- id: motif:1
  label: covenant crisis under hostile rule
  taxonomy_refs:
  - covenant
  basis: The passage repeatedly names the holy covenant as the object of hostility,
    forsaking, corruption, and faithful resistance.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:16
  confidence: high
  cautions: The passage describes covenant conflict but does not give a doctrinal
    explanation of the covenant within this excerpt.
- id: motif:2
  label: sacrificial disruption and sanctuary desecration
  taxonomy_refs:
  - sacrifice
  basis: Forces pollute the sanctuary of strength, remove the daily sacrifice, and
    place the abomination that makes desolate.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: The identification of the abomination is not specified within the excerpt.
- id: motif:3
  label: illegitimate kingship gained by flattery
  taxonomy_refs:
  - royal_legitimacy
  basis: A vile person is not given the honor of the kingdom but obtains it peaceably
    by flatteries and then works deceitfully after a league.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage does not name the ruler or describe formal enthronement rites.
- id: motif:4
  label: deceptive alliance and false negotiation
  taxonomy_refs:
  - duality
  basis: The hostile ruler works deceitfully after a league, and two kings speak lies
    at one table with hearts set to mischief.
  evidence_refs:
  - ev:9
  - ev:12
  confidence: medium
  cautions: The duality reference is limited to paired kings and deceptive speech,
    not an explicit cosmic dualism.
- id: motif:5
  label: appointed apocalyptic end amid political violence
  taxonomy_refs:
  - divine_judgment
  basis: The passage says the deceptive table-talk does not prosper because the end
    remains at the appointed time, within a broader vision of kingdoms, covenant violation,
    and suffering.
  evidence_refs:
  - ev:12
  - ev:15
  - ev:17
  confidence: medium
  cautions: The excerpt refers to an appointed end but does not narrate the final
    judgment itself.
- id: motif:6
  label: wise instructors suffer persecution
  taxonomy_refs:
  - wisdom
  basis: Those who understand among the people instruct many, yet fall by sword, flame,
    captivity, and spoil for many days.
  evidence_refs:
  - ev:17
  - ev:18
  confidence: high
  cautions: The passage identifies understanding and instruction but does not elaborate
    their teachings.
- id: motif:7
  label: overwhelming army as flood image
  taxonomy_refs:
  - chaos
  basis: Military forces are repeatedly described with overflowing language, including
    arms of a flood and armies that overflow.
  evidence_refs:
  - ev:3
  - ev:9
  - ev:11
  confidence: medium
  cautions: The flood imagery is martial and metaphorical in this excerpt; it is not
    a literal cosmic flood narrative.
- id: motif:8
  label: fire as instrument of affliction
  taxonomy_refs:
  - fire
  basis: The understanding ones are said to fall by flame among other forms of suffering.
  evidence_refs:
  - ev:17
  confidence: medium
  cautions: The reference to flame is brief and paired with other sufferings; no developed
    fire symbolism is provided.
