  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
- id: ev:4
  type: summary
  locator: 27:011:011-012
  quote_or_summary: The king of the south fights the king of the north; a great multitude
    is given into his hand and many ten thousands are cast down.
  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
- id: ev:5
  type: summary
  locator: 27:011:013-014
  quote_or_summary: The king of the north returns after years with a greater army
    and riches; many oppose the king of the south, and robbers of the addressed people
    fall after exalting themselves to establish the vision.
  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
- id: ev:6
  type: summary
  locator: 27:011:015-016
  quote_or_summary: The king of the north casts up a mount and takes fenced cities;
    southern forces cannot withstand him, and he stands in the glorious land, which
    is consumed by his hand.
  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
- id: ev:7
  type: summary
  locator: 27:011:017-019
  quote_or_summary: A ruler tries to enter with the strength of his kingdom and gives
    the daughter of women, but she is not for him; he turns to the isles, meets a
    prince who turns reproach back, then turns to his own fort, stumbles, falls, and
    is not found.
  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
- id: ev:8
  type: summary
  locator: 27:011:020-021
  quote_or_summary: A raiser of taxes is destroyed within a few days; afterward a
    vile person, denied the honor of the kingdom, gains it peaceably by flatteries.
  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
- id: ev:9
  type: summary
  locator: 27:011:022-023
  quote_or_summary: Arms of a flood and the prince of the covenant are broken before
    the vile person; after a league, he works deceitfully and becomes strong with
    a small people.
  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
- id: ev:10
  type: summary
  locator: 27:011:024
  quote_or_summary: The vile person enters rich provincial places peaceably, scatters
    prey, spoil, and riches, and devises plans against strongholds for a time.
  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
- id: ev:11
  type: summary
  locator: 27:011:025-026
  quote_or_summary: The vile person and the king of the south prepare for battle with
    great armies; devices are made against the southern king, those who eat his meat
    destroy him, his army overflows, and many fall slain.
  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
- id: ev:12
  type: summary
  locator: 27:011:027
  quote_or_summary: Two kings, with hearts set on mischief, speak lies at one table,
    but it does not prosper because the end is at the appointed time.
  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
- id: ev:13
  type: summary
  locator: 27:011:028
  quote_or_summary: A ruler returns to his land with great riches and his heart is
    against the holy covenant.
  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
- id: ev:14
  type: summary
  locator: 27:011:029-030
  quote_or_summary: At the appointed time the ruler returns toward the south; ships
    of Chittim come against him, so he returns grieved, has indignation against the
    holy covenant, and has intelligence with those who forsake it.
  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
- id: ev:15
  type: summary
  locator: 27:011:031
  quote_or_summary: Arms on the ruler's part pollute the sanctuary of strength, remove
    the daily sacrifice, and place the abomination that makes desolate.
  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
- id: ev:16
  type: summary
  locator: 27:011:032
  quote_or_summary: The ruler corrupts those who act wickedly against the covenant
    by flatteries; the people who know their God are strong and do exploits.
  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
- id: ev:17
  type: summary
  locator: 27:011:033
  quote_or_summary: Those who understand among the people instruct many, yet fall
    by sword, flame, captivity, and spoil for many days.
  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
- id: ev:18
  type: summary
  locator: 27:011:034
  quote_or_summary: When the understanding ones fall they receive a little help, but
    many join them with flatteries.
  source_text_path: texts/public-domain/biblical/project-gutenberg/daniel-kjv.md
  rights_note: Public domain KJV text; summarized.
