canonical_text:
  quote: MENE, MENE, TEKEL, UPHARSIN.
  summary: At Belshazzar's feast, vessels from the Jerusalem temple are used for drinking
    while material gods are praised. A hand writes on the palace wall; Babylonian
    wise men fail to read or interpret it. The queen recommends Daniel, who refuses
    rewards, rebukes Belshazzar by recalling Nebuchadnezzar's humbling, and interprets
    the words as God's judgment that the kingdom is finished, weighed, divided, and
    given to the Medes and Persians.
  language: English
  quote_policy: quoted
