candidate_motifs:
- id: motif:1
  label: heavenly divine judgment court
  taxonomy_refs:
  - divine_judgment
  basis: The Ancient of days sits amid heavenly attendants, books are opened, judgment
    is set, and the beast's dominion is removed and destroyed.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:14
  - ev:15
  confidence: high
  cautions: The passage itself presents the scene as judgment, but detailed theological
    identification beyond the passage is not inferred.
- id: motif:2
  label: sea-born monstrous kingdoms
  taxonomy_refs:
  - chaos
  basis: Four winds stir the great sea, four monstrous beasts arise from it, and the
    interpretation identifies the beasts with kings or kingdoms, especially a destructive
    fourth kingdom.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:12
  - ev:15
  confidence: medium
  cautions: 'The chaos taxonomy is supported by stormy sea and beast imagery, but
    the passage''s explicit interpretation is political: kings and kingdoms.'
- id: motif:3
  label: everlasting dominion granted after judgment
  taxonomy_refs:
  - royal_legitimacy
  basis: The one like the Son of man receives dominion, glory, and an indestructible
    kingdom, and the saints later possess the kingdom after judgment.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:14
  confidence: high
  cautions: The passage does not specify institutional coronation rites; the motif
    is limited to divinely granted rule.
- id: motif:4
  label: persecuting ruler overthrown by judgment
  taxonomy_refs:
  - divine_judgment
  basis: The little horn speaks against the Most High, wars against and wears out
    the saints for a defined period, and then judgment removes and destroys its dominion.
  evidence_refs:
  - ev:8
  - ev:14
  - ev:15
  confidence: high
  cautions: The figure is interpreted as a king within the passage; no external historical
    identification is made.
- id: motif:5
  label: divine rescue acknowledged by a foreign king
  taxonomy_refs: []
  basis: Darius's decree praises the God of Daniel as the deliverer who rescued Daniel
    from the lions and commands reverence throughout the kingdom.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This motif is based only on the brief decree at the beginning of the supplied
    passage.
- id: motif:6
  label: prophetic vision explained by an interpreting attendant
  taxonomy_refs:
  - wisdom
  basis: Daniel is troubled by his vision, asks one standing by for the truth, and
    receives an interpretation of the beasts, horns, kings, saints, and final judgment.
  evidence_refs:
  - ev:12
  - ev:15
  confidence: medium
  cautions: The available taxonomy term 'wisdom' is applied cautiously to the acquisition
    of interpretive knowledge; the passage frames it as vision interpretation rather
    than general wisdom teaching.
