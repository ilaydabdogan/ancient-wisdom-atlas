canonical_text:
  quote: the judgment was set, and the books were opened.
  summary: Darius decrees reverence for the God of Daniel after Daniel is delivered
    from lions. Daniel then reports a night vision of four beasts arising from a storm-stirred
    sea, a heavenly judgment before the Ancient of days, the destruction or loss of
    dominion of the beasts, the arrival of one like the Son of man who receives everlasting
    dominion, and an interpretation identifying the beasts and horns with kings or
    kingdoms and the saints as eventual possessors of the kingdom.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Darius issues a decree that people in every dominion of his kingdom should
    tremble and fear before the God of Daniel.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The decree describes the God of Daniel as living, steadfast forever, possessing
    an indestructible kingdom, working signs and wonders, and delivering Daniel from
    the power of the lions.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Daniel prospers in the reigns of Darius and Cyrus the Persian.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Daniel has a dream and visions on his bed, writes the dream, and tells the
    sum of the matters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the night vision, four winds of heaven strive upon the great sea, and four
    diverse beasts come up from the sea.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The first beast is like a lion with eagle's wings; its wings are plucked,
    it is lifted from the earth, made to stand like a man, and given a man's heart.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The second beast is like a bear, raised on one side, with three ribs in its
    mouth, and is commanded to arise and devour much flesh.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The third beast is like a leopard with four fowl wings and four heads, and
    dominion is given to it.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fourth beast is dreadful, terrible, exceedingly strong, has great iron
    teeth and ten horns, and devours, breaks, and stamps the residue with its feet.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A little horn comes up among the horns, three first horns are plucked up before
    it, and it has eyes like human eyes and a mouth speaking great things.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Ancient of days sits amid thrones, with white garment and hair like pure
    wool; his throne is fiery, and a fiery stream comes before him.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: Thousands minister before the Ancient of days, the judgment is set, and books
    are opened.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Because of the horn's great words, the beast is slain, its body destroyed
    and given to burning flame, while the other beasts lose dominion but have their
    lives prolonged for a season and time.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: One like the Son of man comes with the clouds of heaven to the Ancient of
    days and is brought near before him.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Dominion, glory, and a kingdom are given to the one like the Son of man, so
    that all peoples, nations, and languages serve him; his dominion and kingdom are
    everlasting and indestructible.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: Daniel is grieved and troubled by the visions, approaches one who stands by,
    and asks for the truth of the matter.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: The interpreting figure says that the four beasts are four kings that shall
    arise out of the earth, and that the saints of the Most High shall take and possess
    the kingdom forever.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:18
  text: Daniel asks specifically about the fourth beast, its ten horns, and the other
    horn with eyes and a speaking mouth.
  category: action
  evidence_refs:
  - ev:13
- id: obs:19
  text: The same horn makes war with the saints and prevails until the Ancient of
    days comes, judgment is given to the saints, and the saints possess the kingdom.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:20
  text: The interpretation states that the fourth beast is a fourth kingdom that will
    devour, tread down, and break the whole earth.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:21
  text: The interpretation states that the ten horns are ten kings, that another king
    will arise after them, be different, and subdue three kings.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:22
  text: The later king will speak against the Most High, wear out the saints, attempt
    to change times and laws, and the saints will be given into his hand for a stated
    period before judgment removes and destroys his dominion.
  category: sequence
  evidence_refs:
  - ev:15
