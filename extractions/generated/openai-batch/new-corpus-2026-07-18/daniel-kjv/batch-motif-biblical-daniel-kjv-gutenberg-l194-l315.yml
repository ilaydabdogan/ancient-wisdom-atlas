  quote: ''
  summary: 'The passage narrates the crisis caused by Nebuchadnezzar''s demand for
    his dream and its interpretation, Daniel''s request for time and prayer with his
    companions, the revelation of the secret in a night vision, Daniel''s praise of
    the God of heaven, and Daniel''s report of the dream: a multi-metal image destroyed
    by a stone cut without hands, which becomes a mountain filling the whole earth.
    Daniel begins interpreting the image as a sequence of kingdoms, with Nebuchadnezzar
    as the golden head.'
