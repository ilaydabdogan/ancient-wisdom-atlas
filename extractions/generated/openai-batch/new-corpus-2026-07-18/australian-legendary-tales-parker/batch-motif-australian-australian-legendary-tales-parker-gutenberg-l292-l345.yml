  summary: An introductory prose passage characterizes Parker’s collection as mostly
    children’s folk tales that include aetiological myths explaining animal features,
    constellations, death, and fire. It compares the tales with the Metamorphoses,
    Kipling’s animal stories, Bushman and Indigenous American traditions as named
    by the author, European popular tales, Zulu stories, and the Prometheus fire myth.
    It also notes recurring concerns with food, water, hunting, rain-magic, and book
    illustrations by an Australian Aboriginal artist.
