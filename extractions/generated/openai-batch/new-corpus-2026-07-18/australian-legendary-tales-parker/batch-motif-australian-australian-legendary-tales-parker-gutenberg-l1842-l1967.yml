canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which Goomblegubbon's wives flee
    with their children across a river and evade his pursuit; a tale in which Mooregoo
    the Mopoke refuses Bahloo the Moon's requests for rugs or weapons and is drowned
    when rain floods the country; and the beginning of a tale in which Ouyan the Curlew,
    unable to kill an emu, cuts flesh from his own body to feed his mother and the
    women, who later discover the deception.
  language: English
  quote_policy: summarized
