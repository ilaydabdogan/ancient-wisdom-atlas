canonical_text:
  quote: ''
  summary: The passage begins the tale of Dinewan the emu and Goomblegubbon the bustard.
    Dinewan’s status among birds provokes Goomblegubbon’s jealousy. Goomblegubbon
    tricks the Dinewan pair into cutting off their wings, then escapes by flying.
    Dinewan then begins a retaliatory trick involving the apparent number of her young,
    leading Goomblegubbon to kill all but two of her own twelve young. The excerpt
    ends before the dispute is resolved.
