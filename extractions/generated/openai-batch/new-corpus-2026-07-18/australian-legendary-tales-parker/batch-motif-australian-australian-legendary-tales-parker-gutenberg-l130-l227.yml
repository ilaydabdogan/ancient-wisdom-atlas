canonical_text:
  quote: ''
  summary: The preface explains K. Langloh Parker's purpose in collecting and publishing
    Noongahburrah/Narran legends, names several Aboriginal contributors, frames the
    stories for child readers, and includes a remembered anecdote about early reactions
    to Major Mitchell's wheel tracks and the avoidance of tracks associated with harm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A neighbour asked whether Aboriginal people had legends; the compiler says
    she proposed a small collection and believed no prior collection had been made
    for Noongahburrah folklore.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The compiler argues that information should be gathered while possible because
    she describes the people as fast dying out.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The compiler says older knowledge holders are dying, younger people may not
    remember the stories, and knowledgeable speakers can be difficult to induce to
    talk.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The booklet is restricted to legends of the Narran tribe, known among themselves
    as Noongahburrahs, and the compiler notes diversity of language and custom among
    nearby groups.
  category: setting
  evidence_refs:
  - ev:4
