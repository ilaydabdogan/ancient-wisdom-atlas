canonical_text:
  quote: ''
  summary: The passage ends an Ouyan tale in which beaten Ouyan disappears and a bird
    bearing his name, red legs, and cry is seen. It then gives episodes about Dinewan
    tricking his Wahn wives in a rain shelter and being burned with hot coals in retaliation;
    Goolahwilleel deceiving his family with a gum kangaroo model and thereafter going
    in flocks; and Goonur's abused wives preparing a concealed water-filled pit as
    a trap for him.
  language: English
  quote_policy: summarized
