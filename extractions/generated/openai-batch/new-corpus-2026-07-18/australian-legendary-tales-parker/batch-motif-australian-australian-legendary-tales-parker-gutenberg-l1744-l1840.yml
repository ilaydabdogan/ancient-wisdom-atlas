  summary: The passage concludes a tale about Mullyan the cannibal eagle hawk, whose
    tree dwelling is reached by expert climbers and burned, after which the legend
    identifies him and Moodai with stars. It then begins a tale in which Goomblegubbon
    refuses his wives the grinding stone, prompting them to make opossum-skin water
    bags, empty the only water hole, take the children, and leave toward the river.
