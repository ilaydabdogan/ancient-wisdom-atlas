canonical_text:
  quote: ''
  summary: Byamee accuses women of lending dayoorl grinding stones, but they deny
    it and search other camps. They hear spirit-like cries and report that all tribes
    have lost their stones. Invisible Wondah move the stones away; the Dummerh follow
    them, the stones become a mountain at Dirangibirrah, and the Dummerh become pigeons.
    A separate episode tells how Wahn the crow protects himself from the Ooboon chief's
    killing light, deceives him, and kills him. The passage ends with preparations
    during a Borah ceremony, in which boys are carried toward the scrub and women
    are confined in bough humpies so they cannot see further.
  language: English
  quote_policy: summarized
