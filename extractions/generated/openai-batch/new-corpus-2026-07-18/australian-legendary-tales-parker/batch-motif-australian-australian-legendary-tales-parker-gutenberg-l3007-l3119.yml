canonical_text:
  quote: ''
  summary: The passage ends a tale in which Deegenboyah pleads for mercy after stealing
    emus and is speared by Mullyangah, whose people then feast. It then gives a seasonal
    account of Mayrah, the wind that blows winter away, describing hidden winter animals,
    thunder and bird-song as signs of spring, flowering, bees, nesting birds, abundance,
    and Yhi the sun driving Mayrah back until winter returns. It then tells of Wayambeh
    stealing Oolah and her children, being refused help by his own tribe, fighting
    the armed Oolahs with boreen shields, diving into a creek, and thereafter being
    seen as the first turtle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Deegenboyah saw his dead wives on the homeward path, offered the emus to Mullyangah,
    admitted stealing, and pleaded to be spared because his children and wives had
    hungered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mullyangah refused Deegenboyah's plea, said that no man steals twice from
    a Mullyan, speared Deegenboyah, and carried the emus back to camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Mullyans ate the emus at supper and praised the prowess and cunning of
    their chief.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the beginning of winter, iguanas, black eagle hawks, and garbarlee or shingle-backs
    hide in winter homes until Mayrah blows the winter away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mayrah first blows up a thunderstorm; the iguanas hear thunder, begin making
    a passage outward, and wait for the Curreequinquin or butcher birds to sing before
    coming out onto the green earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: When black fellows hear the curreequinquins singing, they know they can find
    iguanas again and that the iguanas are fatter than when winter came.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Piggiebillahs leave their young buried in the sand when the young ones' spines
    begin to prick them in the pouch, expecting to meet them later when grown.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: As Mayrah softly blows, flowers open, bees gather honey, birds wear bright
    plumage and sing to attract mates, birds pair and build nests, and the land becomes
    plentiful.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Yhi the sun chases Mayrah back, flowers droop, birds sing only early in the
    morning, Yhi rules until storms cool him, and winter returns to be blown away
    again by Mayrah.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Oolah, a lizard woman gathering yams with three children, was seized by Wayambeh,
    who said he would take her to his camp to be his wife and take the children too.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Wayambeh admitted to his tribe that Oolah had not been given to him but had
    been stolen.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Wayambeh's tribe told him that Oolah's tribe would come after her, that they
    would not fight for him, and that the consequences would be on his own head.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Oolahs approached the Wayambeh camp painted for war, armed with fighting
    weapons, and without women or peace boughs.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:14
  text: Wayambeh covered the front and back of his body with two boreens and drew
    in his arms and head between them when spears and boomerangs were thrown.
  category: action
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:15
  text: Forced back toward the creek, Wayambeh threw down his weapons, plunged into
    the water, was never seen again as a black fellow, and was afterward identified
    with a turtle-like creature in the waterhole.
  category: sequence
  evidence_refs:
  - ev:14
  - ev:15
