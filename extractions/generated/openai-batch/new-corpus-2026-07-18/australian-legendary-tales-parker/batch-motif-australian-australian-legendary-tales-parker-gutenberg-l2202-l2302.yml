  summary: The passage first recounts Goonur's wives dying on hidden stakes in water,
    their restoration by Goonur's mother through medicines and ants, and later celestial
    signs and star-transformation. It then tells of Deereeree, a frightened widow
    with four daughters, Bibbee's attempt to marry her, his creation of the rainbow
    Euloowirree as a sky-spanning roadway, her coerced marriage, and the posthumous
    transformations of Deereeree into a wagtail and Bibbee into a woodpecker or climbing
    tree bird.
