canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a mother forgets her baby,
    later returns, and is killed by the grown son; a tale in which bird figures organize
    fishing but an alligator kills the fishers and marks a place red; and the beginning
    of a tale in which Narahdarn the bat tracks a bee to honey, causing one wife to
    be trapped, mutilated, and killed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During a search, Bunbundoolooey's mother forgets the goolay containing her
    baby and wanders to a far country.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The baby crawls out of the goolay, becomes stronger, stands by a tree, walks,
    runs, grows into a big boy, and then grows into a man without seeing his mother.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mother remembers the child she left and travels back to the Dunnia clump.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mother follows tracks that show crawling, standing, walking, running,
    and then a man's tracks, until she reaches a camp.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the camp the mother sees a fire, many weapons, and many opossum rugs painted
    inside.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mother identifies herself to the man as the mother who forgot him as a
    baby and approaches with outstretched arms as if to embrace him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The son does not answer verbally, picks up a large stone, throws it at his
    mother, kills her, and then strides to his camp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Oongnairwah and Guinarey tell pelicans, black swans, cranes, and others that
    they will use a net to catch fish if the others drive fish toward it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The water beaters splash in the creek to scare fish toward the net, while
    Deereeree and Burreenjin sit on a stump and warn that they saw an alligator's
    back in the water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The diver and eagle hawk tell Deereeree and Burreenjin to go away because
    the wind blows from them toward the alligator and he will smell them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Deereeree and Burreenjin do not heed the warning; the alligator smells them,
    lashes with his tail, and drowns all the fishermen, including the two on the bank.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The creek bank and the stump are red with the blood of the slain, and the
    place is called Goomade and is said to be red forever.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Narahdarn wants honey, catches a bee, places a white feather between its hind
    legs, releases it, and follows the feather-marked bee.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Narahdarn orders his two wives of the Bilber tribe to follow with wirrees
    for carrying honey.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: When night comes before the bee reaches home, Narahdarn imprisons it under
    bark until morning, then releases and follows it to its nest in a gunnyanny tree.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Narahdarn marks the tree with his comebo and returns to hurry his wives so
    they can climb the tree and chop out the honey.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:17
  text: One wife climbs the marked tree, puts her arm into a split where the honey
    is, and cannot withdraw it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: Narahdarn climbs up and cuts off the trapped wife's arm to free her; she dies
    instantly from the shock.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: Narahdarn carries down the dead wife and commands her sister, his other wife,
