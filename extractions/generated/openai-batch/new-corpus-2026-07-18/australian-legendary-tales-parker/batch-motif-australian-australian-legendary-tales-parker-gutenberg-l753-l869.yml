canonical_text:
  quote: ''
  summary: The passage first concludes an episode in which men rebuke women for leaving
    children with Gooloo; the children remain lost and their wailing is heard. It
    then narrates how two Weeoombeen brothers kill an emu, lose it to the strong Piggiebillah,
    lead spear-armed men against him, reclaim the emu, and hide behind a secret movable
    stone in a hole while using the dead emu as a shield against spears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men rebuke the women for leaving their young with a stranger identified as
    Gooloo while the men were hunting.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The men search the surrounding bush for the lost Wahroogahs but find no trace
    of them, though wailing like children's voices is heard.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The women remain in camp for many days mourning the lost Wahroogahs and beating
    their heads because they had listened to Gooloo.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two Weeoombeen brothers go hunting, and the elder tells the younger to stay
    quiet so Piggiebillah will not hear and take the emu.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The elder Weeoombeen kills an emu with a thrown stone, and the younger brother
    cries out in joy despite the warning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Piggiebillah hears the cry, questions the brothers, threatens to kill them
    if they do not tell him, and is shown the dead emu.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Piggiebillah drags the emu to his own camp, accepts help making a fire to
    cook it, and refuses to give the Weeoombeens any share.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Weeoombeens tell nearby black fellows that Piggiebillah has a cooked emu,
    and the men promise them a share if they lead the way.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The black fellows form a circle and spear Piggiebillah until he is too wounded
    to cry out.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After spearing Piggiebillah, the black fellows cannot find the emu and then
    notice the Weeoombeens are missing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Weeoombeens move the emu and themselves into a big hole behind a stone
    at the entrance, a stone whose movement only they know.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The black fellows cannot move the stone, hear voices behind it, and drive
    spears through crevices at either side of the stone.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Weeoombeens place the dead emu before the crevices as a shield, so the
    spears intended for them enter the emu's body.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Weeoombeens' laughter repeatedly brings the attackers back to spear again;
    when the brothers become quiet, the attackers think they are dead and leave to
    get help moving the stone.
  category: sequence
  evidence_refs:
  - ev:8
