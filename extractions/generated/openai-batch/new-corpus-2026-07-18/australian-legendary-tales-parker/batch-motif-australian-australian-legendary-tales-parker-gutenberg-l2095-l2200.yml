canonical_text:
  quote: ''
  summary: Goonur is lured into a water-filled false nest by his wives and drowns.
    His mother tracks him, retrieves his body, revives him with the help of ant stings,
    hides him in a comebee, and warns him against his wives. The wives discover he
    is alive and feign joy. Goonur pretends to trust them while preparing a concealed
    water trap with pointed stakes.
