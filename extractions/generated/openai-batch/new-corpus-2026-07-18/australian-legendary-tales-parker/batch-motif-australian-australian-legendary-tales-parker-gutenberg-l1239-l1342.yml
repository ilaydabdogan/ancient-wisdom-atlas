canonical_text:
  quote: ''
  summary: 'During a severe storm, Gidgereegah and Quarrian seek shelter in a dardurr
    but are refused by Gwineeboo and the women because the men had withheld kangaroo
    meat and ignored a crying child. The men are changed first into birds and then
    into stars, with a kangaroo between them. A new tale begins: Wurrunnah leaves
    his people after being refused food, encounters an eyeless stranger named Mooroonumildah,
    sees a lagoon disappear by morning, is frightened by a named being under bark,
    and mistakenly spears what he thinks is an emu before discovering it is a member
    of a strange tribe.'
  language: English
  quote_policy: summarized
