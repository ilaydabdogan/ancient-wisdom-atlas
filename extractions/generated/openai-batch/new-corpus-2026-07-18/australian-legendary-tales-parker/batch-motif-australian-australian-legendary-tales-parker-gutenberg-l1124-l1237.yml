canonical_text:
  quote: ''
  summary: 'The passage closes the Weedah episode: Mullyan recognizes a fire trap,
    seizes Weedah, throws him into the fire, and later a mocking bird named Weedah
    rises from Weedah''s remains, explaining the bird''s head-mark and mimicry. The
    next tale begins with Gwineeboo and Goomai killing and hiding a kangaroo in a
    creek, denying it to two hunters, being exposed by Gwineeboo''s child, losing
    the meat to the hunters, and beginning a chant inside a dardurr to summon destructive
    storm weather.'
  language: English
  quote_policy: summarized
