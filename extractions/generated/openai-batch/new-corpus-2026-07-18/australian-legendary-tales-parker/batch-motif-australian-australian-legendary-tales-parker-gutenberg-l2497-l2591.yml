canonical_text:
  quote: ''
  summary: Tribes gather at Googoorewon for corrobborees, feasting, exchanges, and
    compacts. The Wirreenun secretly prepare a borah ground for initiating boys, excluding
    women from knowledge of the rites. A staged disturbance is followed by a whizzing
    noise identified by women and boys as the borah spirit. The camps are moved into
    the ring through a ceremonial procession. Byamee rebukes the noisy Mahthi for
    disrespecting the Wirreenun and decrees that they and their descendants will bark
    and howl rather than speak or laugh, with speech by a Mahthi turning hearers to
    stone. The Mahthi lose speech, and Byamee then asks the women why they are not
    grinding doonburr; they answer that their dayoorls are gone.
  language: English
  quote_policy: summarized
