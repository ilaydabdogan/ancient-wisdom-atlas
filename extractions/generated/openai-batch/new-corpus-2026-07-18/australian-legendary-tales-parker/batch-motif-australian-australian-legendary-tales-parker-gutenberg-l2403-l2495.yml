canonical_text:
  quote: ''
  summary: The passage tells of Bougoodoogahdah, an old woman living with many dingoes,
    who repeatedly lures men into ambush so she and the dogs can kill and eat them.
    Watchers discover the trick, and assembled tribes kill the old woman and her dogs.
    After death, her heart produces a night-calling bird associated with rain-making;
    the dead dingoes become poisonous snakes, while her two little dogs become a harmless
    small carpet snake. White stones at the killing places are explained as fossilized
    bones of victims. The passage then begins a new tale in which tribes gather at
    Googoorewon for a borah, kept secret from women, and Byamee prepares to take his
    two sons so they can be made young men.
  language: English
  quote_policy: summarized
