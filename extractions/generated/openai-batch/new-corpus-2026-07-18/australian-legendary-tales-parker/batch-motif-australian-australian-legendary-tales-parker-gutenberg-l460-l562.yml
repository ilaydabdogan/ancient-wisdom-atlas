canonical_text:
  quote: ''
  summary: The passage closes a tale in which Dinewan shows her young to Goomblegubbon
    and declares lasting consequences for emus and bustards. It then tells how Oolah
    the lizard injures Galah with a returning boomerang, after which Galah and Oolah
    impose lasting bodily marks on one another. A third tale begins with Bahloo the
    moon asking daens to carry his snake-dogs across a creek; when they refuse out
    of fear, he demonstrates rising or not rising after death with bark and stone,
    then declares that they have lost the chance of returning to life after death.
  language: English
  quote_policy: summarized
