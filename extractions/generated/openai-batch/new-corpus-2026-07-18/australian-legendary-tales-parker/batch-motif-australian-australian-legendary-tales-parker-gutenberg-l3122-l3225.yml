canonical_text:
  quote: ''
  summary: During a severe drought, young Noongahburrah men question why the old Wirreenun
    has not made rain. Wirreenun places a feathered stick and two clear stones in
    a waterhole, orders bark shelters and raised ant-bed floors prepared, leads the
    whole camp into the water, and removes lumps of charcoal from people’s heads into
    the water. Clouds gather, the people shelter, thunder and lightning frighten the
    camp, and Wirreenun stands before the storm singing to keep it away. Rain falls
    steadily for days; after the country is green again, the people hold a corrobboree
    praising his skill as rainmaker.
  language: English
  quote_policy: summarized
