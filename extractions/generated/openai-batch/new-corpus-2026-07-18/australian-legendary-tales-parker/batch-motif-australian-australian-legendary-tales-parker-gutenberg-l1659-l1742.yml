canonical_text:
  quote: ''
  summary: Narahdarn forces one of the Bilber sisters up a tree, cuts off her trapped
    arm, and she dies like her sister. He returns alone with blood on his arms and
    refuses to explain. The mother of the Bilbers reports this to her tribe; the chief
    sends young men to follow Narahdarn’s tracks, and they confirm the sisters’ fate.
    At a night corrobboree, women chant and men dance near large fires; Narahdarn
    is edged toward the largest fire, seized, thrown in, and killed, avenging the
    Bilbers. The following tale begins with Mullyangah/Mullyan the eagle hawk living
    high in a yaraan tree with his wife, mother-in-law, and Buttergah.
  language: English
  quote_policy: summarized
