canonical_text:
  quote: ''
  summary: 'The passage closes one episode in which Bahloo’s snakes become objects
    of fear and killing, then begins an origin account for the Narran Lake: Byamee’s
    wives are swallowed by kurreahs while bathing, the kurreahs drain waters through
    an underground passage, Byamee pursues and kills them, their writhing makes hollows
    that fill with water, and the wives are revived with the aid of red ants.'
  language: English
