canonical_text:
  quote: ''
  summary: An old man punishes his two sons for neglecting their parents by sending
    them to throw greased boomerangs and then, in whirlwind form, carrying them and
    two mubboo trees into the sky near the Milky Way. The mothers discover the loss,
    avenge their sons by pouring hot pine gum into the old man's eyes, and later identify
    him with the Mopoke night hawk. The women are later changed into Mooninguggahgul
    mosquito birds whose calls summon mosquitoes to bite.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man lives with two wives, the Mooninguggahgul sisters, and two sons,
    and spends his time making enough boomerangs to fill four nets.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two sons hunt opossums and iguanas, cook and eat them away from camp,
    and bring their father only iguana fat when asked for fat for the boomerangs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man becomes angry at his sons' greed and tells them to take the greased
    boomerangs to the plain and test them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the boys throw the boomerangs, the boomerangs do not touch the ground
    but whirl upward out of sight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A huge whirlwind approaches; the boys call out “Wurrawilberoo” and cling to
    nearby trees because they know there is a devil in the whirlwind.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The whirlwind uproots successive trees, then uproots two mubboo or beef-wood
    trees with the boys clinging to them and carries the boys and trees upward to
    the sky near the Milky Way; the boomerangs are scattered along the Milky Way.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After placing the boys, trees, and boomerangs in the sky, the whirlwind descends
    and resumes the natural shape of the old man, who has taken vengeance on his sons
    for neglecting their parents.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The mothers track the boys to uprooted tree sites, later hear their sons'
    cries from the sky, see the boys beside the mubboo trees there, and conclude that
    their husband was the devil in the whirlwind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The wives gather pine gum; while one soothes the old man by teasing his hair,
    the other melts the gum, and together they pour the hot gum into his eyes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old man runs away crying “Mooregoo”; the wives do not see him again, but
    they see a Mopoke night hawk whose cry matches his cry and identify him as turned
    into that bird.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After a time the women are changed into Mooninguggahgul, or mosquito birds,
    whose summer-night cry calls mosquitoes to come out, buzz, fly everywhere, and
    bite.
  category: sequence
  evidence_refs:
  - ev:8
