canonical_text:
  quote: ''
  summary: The passage recounts a story in which children left without water are rescued
    by an elder brother who splits a water-holding tree, releasing a stream that later
    drowns the adults who had neglected them. It then gives the story of the Mayamah,
    where enemies arriving at a deserted camp threaten an old dog, who speaks and
    causes them and their belongings to turn to stone, explaining marked stones near
    Beemery. The passage ends with the beginning of a Bunbundoolooey story, in which
    a pigeon mother carries her small child in a goolay while hunting for grubs near
    wattle trees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Googarh the iguana is married to Moodai the opossum and Cookooburrah the laughing
    jackass; Cookooburrah has three sons, including two small boys at camp and an
    older son living away.
  category: relationship
  evidence_refs:
  - ev:1
