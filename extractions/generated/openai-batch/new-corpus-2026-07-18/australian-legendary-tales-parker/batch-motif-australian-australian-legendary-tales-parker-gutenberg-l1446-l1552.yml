    marks on the bark.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Googarh and his two wives go hunting with water bags for themselves but leave
    no water for the two small Cookooburrahs, who become speechless from thirst.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The older Cookooburrah brother arrives, asks what is wrong, and the two small
