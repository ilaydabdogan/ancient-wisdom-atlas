canonical_text:
  quote: ''
  summary: Byamee foretells water and waterfowl at Narran Lake, and the narrator says
    this has come to pass. The passage then begins the tale of Gooloo the Magpie,
    an old wicked woman who persuades mothers to leave their children with her while
    they gather food, feeds the children, takes them to her hollow-tree home, and
    leaves the mothers returning to find both Gooloo and the children gone while hearing
    children wailing.
  language: English
  quote_policy: summarized
