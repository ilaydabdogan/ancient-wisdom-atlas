canonical_text:
  quote: ''
  summary: Wurrunnah encounters seven young Meamei sisters, later hides and steals
    two yam sticks to separate two of the sisters from the others. He seizes the two
    girls and compels them to travel with him as wives. When he orders them to cut
    bark from two pine trees despite their warning, the trees rise into the sky carrying
    them upward. Their five sisters call to them from the sky and draw them in, and
    the narrator identifies the seven sisters as the Pleiades, called Meamei.
  language: English
  quote_policy: summarized
