canonical_text:
  quote: ''
  summary: Bootoolgah and Goonur secretly use a fire stick kept in a comebee to make
    fire and cook fish. Boolooral and Quarrian observe them and report back. The tribes
    plan a large corrobboree to distract the fire makers so Beeargah can steal the
    comebee and fire stick for communal use. Many painted tribes gather, and the Bralgahs’
    dance absorbs the audience while Beeargah watches for an opportunity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bootoolgah and Goonur repeatedly disappeared after catching fish and returned
    with food that looked different from the food of others.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tribe appointed Boolooral, the night owl, and Quarrian, the parrot, to
    follow Bootoolgah and Goonur and learn where they went and what they did.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Boolooral and Quarrian climbed a high tree on the edge of a scrub and watched
    Bootoolgah and Goonur open a comebee, remove a stick, blow on it, and make a flame
    in leaves and twigs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bootoolgah and Goonur placed their fish in the ashes after the flame died
    down.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the discovery was reported, the tribes discussed how to get the comebee
    containing the fire stick and planned a large corrobboree to distract Bootoolgah
    and Goonur.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The plan specified that someone would seize the comebee, steal the fire stick,
    and start fires for the good of all when the fire makers were off guard.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Beeargah, the hawk, was told to feign sickness, lie near Bootoolgah and Goonur,
    watch them, and steal the comebee when they were distracted.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Surrounding tribes were invited to attend, and the Bralgahs were especially
    requested because of their celebrated dancing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The attending tribes prepared distinctive body painting and arrived in varied
    colors and designs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Bootoolgah told Goonur they should only watch the corrobboree and guard the
    comebee; Goonur seated herself beside him with the comebee over her arm.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Goonur became absorbed in the corrobboree and the comebee slipped from her
    arm, but Bootoolgah noticed, replaced it, and warned her, preventing Beeargah
    from seizing it at that moment.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: When the Bralgahs danced, every eye except Beeargah’s was fixed on them as
    their movements became faster and more comic and the audience laughed.
  category: action
  evidence_refs:
  - ev:9
