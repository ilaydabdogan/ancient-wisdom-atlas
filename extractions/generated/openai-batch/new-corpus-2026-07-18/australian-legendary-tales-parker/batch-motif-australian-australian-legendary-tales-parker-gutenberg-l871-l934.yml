canonical_text:
  quote: ''
  summary: 'The passage closes one tale by describing the Weeoombeens'' disappearance
    from a stone-blocked hole, the pursuers'' failure to find tracks, and their belief
    that the brothers became little white-throated birds. It also links Piggiebillah''s
    memory to a porcupine ant-eater with spear-like markings. A new tale begins: Bootoolgah
    the crane and Goonur the kangaroo rat live where there is no fire, discover fire-making
    by rubbing wood with bark and grass kindling, decide to keep the technique secret,
    cook fish, and give a disputed explanation to others at camp.'
  language: English
  quote_policy: summarized
