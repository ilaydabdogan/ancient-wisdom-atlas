    he determines to show that his powers are great.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wirreenun summons a rainmaker from a neighboring tribe, consults with him,
    and orders the tribes to go to Googoorewon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Googoorewon is described at this point as a dry plain surrounded by solemn,
    gaunt trees said to have once been black fellows.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The tribes camp around the edges of the plain, and Wirreenun with the other
    rainmaker makes heavy rain fall over the plain and fill it with water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the plain becomes a lake, Wirreenun tells the young men of his tribe
    to take nets and fish.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The young men question how there can be fish in a lake filled only by recent
    rain rather than by river flood water.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wirreenun commands the young men to fish and says that if their nets catch
