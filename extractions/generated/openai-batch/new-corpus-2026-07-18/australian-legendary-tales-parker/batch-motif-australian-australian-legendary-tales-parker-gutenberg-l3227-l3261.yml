canonical_text:
  quote: ''
  summary: Wirreenun summons a neighboring rainmaker, directs the tribes to the dry
    plain of Googoorewon, and with the other rainmaker makes rain fill the plain with
    water. The young men are told to fish in the new lake, doubt that fish can be
    present, but then catch many fish. The elders decide to hold a borah so boys may
    be made young men, and the borah is remembered as following Wirreenun the rainmaker's
    triumph.
  language: English
  quote_policy: summarized
