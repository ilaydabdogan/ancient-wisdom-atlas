    yams with the women.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The young men use the nets in the lake; the first draw is heavy with named
    fish, and all the tribes and their dogs have plenty.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The elders decide that, since there is plenty everywhere, they will hold a
    borah in which boys are to be made young men.
  category: action
  evidence_refs:
  - ev:5
