canonical_text:
  quote: ''
  summary: The passage closes a Byamee episode at Noondoo with the birth of dangerous
    hybrid pups and Byamee’s secluded immortal presence. It then tells how hardworking
    Wurrunnunnah gather and store honey while lazy Bunnyyarl waste time, after which
    the two groups become wild bees and flies. It begins the tale of Deegeenboyah,
    who falsely associates himself with the discovery of an emu nest and joins the
    Mullyan in trapping, killing, and cooking the emu and eggs.
  language: English
