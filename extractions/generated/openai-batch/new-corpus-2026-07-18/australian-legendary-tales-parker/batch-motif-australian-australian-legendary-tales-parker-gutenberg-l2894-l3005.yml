canonical_text:
  quote: ''
  summary: Deegeenboyah stays to cook an emu while Mullyan hunters spear more emus
    using feathered lures from a tree. After persuading the others to let him carry
    the cooked birds while they play with weapons, Deegeenboyah leaves by a hidden
    spider trap-door and takes the food through an underground route. Mullyangah,
    chief of the Mullyans, follows the tracks to Deegeenboyah's camp, questions Deegeenboyah's
    daughters, learns of the trap-door, kills the daughters by tricking them into
    jumping from a leaning tree, kills Deegeenboyah's wives, intercepts the cooked
    emus emerging from the trap-door, and confronts Deegeenboyah with weapons.
  language: English
  quote_policy: summarized
