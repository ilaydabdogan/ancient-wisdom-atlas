canonical_text:
  quote: ''
  summary: The passage first recounts Beeargah seizing a hidden firestick from a comebee
    and spreading fire until the former secret becomes common property. It then begins
    the tale of Weedah, who creates an apparently populated camp by building many
    grass huts, setting fires, and imitating voices, so that isolated passers-by approach
    and are thrown into the fire. Mullyan follows the trail of his missing cousin
    Beeargah to Weedah's camp, questions Weedah, notices trails entering but not leaving,
    and is edged toward the fire while Weedah denies knowledge.
  language: English
  quote_policy: summarized
