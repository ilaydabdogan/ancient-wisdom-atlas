canonical_text:
  quote: ''
  summary: The passage describes stages of boys' borah initiation, including removal
    from women, secrecy, a little borah, and months of isolation. It then tells how
    the widow Millindooloonubbah arrives accusing the tribes of abandoning her and
    drinking all water from the water holes, causing her children to die of thirst.
    After receiving water too late, she curses the assembled tribes to become trees
    and dies; those nearby become trees and others become birds or beasts corresponding
    to their names. The place is described as Googoorewon, with a lake, remains of
    the borah ring, birds, lizards, and wailing trees. Men and boys at the little
    borah escape the transformation, and Byamee urges departure to a far country.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women are held beneath boughs while men carry boys away into the scrub, and
    the women are later released.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The women are not informed about the initiation rites; after some months they
    may see boys return with missing front teeth, scarifications, and a period of
    not looking on women.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the little borah, a grass ring is made; the tribes camp and hold a corrobboree;
    young women are sent to bed early and old women are allowed a final farewell from
    the boys.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each boy is kept under the charge of a man for at least six months, may not
    look at his mother, and returns frightened and unable at first to speak to her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Millindooloonubbah says the tribes abandoned her with many children, drank
    the water from each water hole, and left only mud; her children died one by one
    for want of water.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A woman brings Millindooloonubbah a wirree of water, but Millindooloonubbah
    says it is too late, drinks enough to speak, curses the camps to turn into trees,
    and dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The tribes standing around the ring turn into trees, while tribes in the background
    change into birds or beasts corresponding to their names, including Mahthi into
    dogs, Byahmul into black swans, and Wahns into crows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The place is described as Googoorewon, the place of trees, where a lake covers
    the borah site, remains of the earth ring are visible, birds gather, and trees
    are said to give forth wailing voices.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The men and boys at the little borah escape the metamorphosis, wait for the
    absent tribes, and hear Byamee suggest enemies may have killed their friends and
    that they should go into a far country.
  category: sequence
  evidence_refs:
  - ev:7
