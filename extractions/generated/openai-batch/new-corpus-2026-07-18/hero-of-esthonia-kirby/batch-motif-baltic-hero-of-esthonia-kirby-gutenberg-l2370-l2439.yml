canonical_text:
  quote: ''
  summary: Kalevide wakes, finds the remains of his horse, keeps the skin as a relic,
    and pursues wolves and wild beasts through the wood until darkness stops him.
    While he rests on the horse skin, messengers report that war has broken out and
    a hostile army is ravaging the country. A second messenger, a white-bearded old
    man later recognized as Ukko, counsels him about the burdens of rule, the need
    for divine aid, destiny, and the danger of his sword. At dawn Kalevide gives instructions
    for conducting the war and defending the coasts, while saying he must rest before
    joining the war in person. The passage ends with an editorial note about an inserted
    ballad.
  language: English
  quote_policy: summarized
