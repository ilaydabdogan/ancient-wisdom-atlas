canonical_text:
  quote: ''
  summary: The passage summarizes the Estonian tale of Tuhka-Triinu, in which a motherless
    girl is mistreated by her stepfamily, receives counsel and magical aid connected
    with a rowan-tree on her mother's grave, attends the king's ball through transformations
    performed by a small witch-maiden, loses a gold shoe, is recognized when the shoe
    fits, and marries the prince.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies the tale as the Estonian story of Tuhka-Triinu, also
    glossed as Ash-Katie, and says it is closer to German Aschenputtel than to French
    Cendrillon.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dying mother instructs her daughter to plant a tree on her grave where birds
    can find food and shelter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father marries a widow with two daughters, and the widow's daughters mistreat
    the motherless girl and declare that she shall be their slave-girl.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A magpie cries from the summit of the tree and tells the child to complain
    to the rowan-tree and ask for counsel.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At night at the grave, a voice asks whom the girl should appeal to and trust;
    she answers, "God," and the voice tells her to call the cock and hen when she
    has work she cannot do alone.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the king's ball is announced, Cinderella dresses her sisters; the eldest
    throws lentils into the ashes and orders her to pick them up, but the cock and
    hen do the task.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A voice tells the weeping girl to shake the rowan-tree; light appears, and
    she sees a small golden-clothed woman on the tree's summit holding a basket and
    a gold wand.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The woman uses a hen's egg as a coach, six mice as horses, a black beetle
    as coachman, and two speckled butterflies as footmen.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The little witch-maiden dresses Tuhka Triinu magnificently, sends her to the
    ball, and warns her to leave before the cock crows for the third time because
    everything will resume its original shape then.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the second night Tuhka Triinu flees and loses a little gold shoe; the prince
    finds it, the sisters cannot fit it, Tuhka Triinu can, her guardian robes her
    again, and she marries the prince.
  category: sequence
  evidence_refs:
  - ev:7
