canonical_text:
  quote: The oak which the islander had planted sprang up... it reached the clouds,
    and almost touched the sun.
  summary: After the Kalevide kills a youth, the smith-father and mother lament; the
    smith restrains his sons and leaves vengeance to the gods and the sword. The drunken
    Kalevide goes to a waterfall and sleeps. An oak planted by the islander grows
    until it darkens the land; no one dares fell it until a captive dwarf agrees in
    exchange for release and a golden dish. The dwarf grows into a giant, fells the
    tree, and its wood becomes a bridge, ships, towns, boats, shelters, and a minstrel's
    room whose song-light appears splendid to travelers.
  language: English
  quote_policy: quoted
