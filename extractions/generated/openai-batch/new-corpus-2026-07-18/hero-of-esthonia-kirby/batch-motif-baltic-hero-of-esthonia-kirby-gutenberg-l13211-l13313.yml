canonical_text:
  quote: ''
  summary: A parson seeks a servant willing to toll the church bell at midnight after
    previous bell-ringers have disappeared. Crafty Hans accepts the position, enters
    the church at night, joins supernatural card-players until they vanish at cockcrow,
    then climbs to the belfry. He throws several headless little men down the stairs
    and spares another headless dwarf who had set a deadly trap in the bell. The dwarf
    promises not to trouble bell-ringers again, and Hans successfully tolls the bell.
  language: English
  quote_policy: summarized
