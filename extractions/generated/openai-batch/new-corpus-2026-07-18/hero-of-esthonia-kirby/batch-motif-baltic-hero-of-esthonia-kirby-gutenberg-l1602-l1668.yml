canonical_text:
  quote: ''
  summary: The youngest or third brother sings beneath a sacred oak, drawing animals,
    birds, natural forces, and nymphs into response. The brothers return home and
    find the fire out and their mother absent. The youngest finds traces at the beach
    and concludes that a Finnish sorcerer has carried her away. Rejecting delay, he
    goes to his father’s grave, where the father speaks but says he cannot rise; he
    prays for wind, zephyr, and stars to guide his son. The young hero follows his
    mother’s footprints until they vanish in the sea and receives no further sign.
  language: English
  quote_policy: summarized
