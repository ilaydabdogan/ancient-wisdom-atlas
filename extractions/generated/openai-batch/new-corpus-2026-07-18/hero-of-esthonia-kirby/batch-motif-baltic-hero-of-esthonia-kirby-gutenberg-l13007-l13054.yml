canonical_text:
  quote: ''
  summary: A fearless barn-keeper stops at a village inn to ask about old castle ruins.
    An old farmer recounts that a harsh wealthy squire once stored treasure in deep
    cellars there, disappeared from his bed amid signs of blood and a black cat, and
    was believed to have been taken by the Evil Spirit to Põrgu. Later treasure seekers
    failed or vanished in the caverns, and the castle fell into ruin. The barn-keeper
    nevertheless proposes to try for the treasure, rejects the villagers' warnings
    about death and soul-loss, and prepares to go alone with pine-splinters for light.
  language: English
  quote_policy: summarized
