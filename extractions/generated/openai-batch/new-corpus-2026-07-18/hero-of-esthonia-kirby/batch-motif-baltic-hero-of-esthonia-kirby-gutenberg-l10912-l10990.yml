  summary: An avaricious son-in-law accuses his poor father-in-law of sorcery because
    of the unexpected bridal portions given to the daughters. Officials investigate
    the labourer's woodland home, but find a splendid glass palace and an enthroned
    queen with twelve princesses. The queen orders the false accuser bound, identifies
    herself as the Lady of the Waters, and explains that she secretly married the
    eldest son of the King of the Winds and exchanged her children with the labourer's
    wife's children.
