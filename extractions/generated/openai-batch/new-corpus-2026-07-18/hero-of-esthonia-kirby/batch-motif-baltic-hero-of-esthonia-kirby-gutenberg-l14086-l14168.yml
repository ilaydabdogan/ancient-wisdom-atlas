canonical_text:
  quote: ''
  summary: A young man follows a raven's tactical advice to use an iron horse and
    spear against the Northern Frog. The spear fixes the monster's jaws, and after
    three days of struggle the young man kills it with a stone lifted by a magic ring.
    He is honored, marries the king's daughter, and is thanked by neighboring kings,
    but the unburied carcass causes disease. When he travels in bird form using the
    stolen ring, the Hell-Maiden becomes an eagle, seizes him, reclaims the ring,
    accuses him of betraying and robbing her, and imprisons him in a chained cavern.
  language: English
  quote_policy: summarized
