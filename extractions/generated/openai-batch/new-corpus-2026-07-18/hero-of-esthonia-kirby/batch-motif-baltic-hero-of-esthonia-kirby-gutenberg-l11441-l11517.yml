canonical_text:
  quote: ''
  summary: Hans questions the treasure master about unused gold and silver. The master
    says he is not human and that his race, by the Creator's decree, prepares and
    hides metals under the earth for limited human use. Hans explores the treasure
    chambers, cannot lift gold, dines with the transformed royal master and small
    attendants, is plied with drink, falls asleep, dreams of carrying gold, and wakes
    in a green wood.
  language: English
  quote_policy: summarized
