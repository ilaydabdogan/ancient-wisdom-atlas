canonical_text:
  quote: ''
  summary: The passage first concludes a treasure-raising tale in which a youth performs
    a midnight blood rite with black animals, sees a succession of fiery and golden
    animal apparitions with treasure, flees from a terrifying half-human, half-beast
    head, and later finds the treasure gone. It then introduces a tale in which a
    young man seeking secret nocturnal knowledge is instructed by a Finnish sorcerer
    to take heavenly goat's milk from the serpent king's court; after escaping the
    serpents, he sees wood-nymph maidens bathing by moonlight and afterwards pines
    for them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A youth obtains a black cock, a black dog, and a mole, and on St. John's Eve
    at midnight slaughters them in sequence at an appointed spot, ensuring the blood
    falls there and calling “Igrek” at the end.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the rite, fiery-red or red animal apparitions emerge from under the
    juniper; each is followed by money or silver being thrown up, with the largest
    amount following the bear.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A huge head, described as half man and half beast, appears from the juniper
    with golden horns, golden tusks, and flames from its mouth and nostrils.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The treasure-seeking youth flees in terror, faints in his farmyard, and on
    returning in the morning finds the hill, junipers, dead animals, and wand, but
    no sign of disturbed earth or treasure.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The next tale is introduced as one in which a young man who already knows
    the language of birds and other mysteries seeks further secret knowledge and consults
    a famous necromancer, also called a Finnish sorcerer.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:6
  text: The sorcerer says that on St. Mark's Day the king of the serpents will hold
    court every seven years, with a dish of heavenly goat's milk before him; the young
    man can gain the desired knowledge by dipping bread into the milk and putting
    it in his mouth before fleeing.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: At midnight on a moor, what had looked like hillocks become snakes, a bright
    light from one hillock serves as a signal, and the snakes gather into a heap around
    a huge crowned serpent.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: The young man leaps over the hissing serpents, secures the prize, flees while
    pursued, falls senseless, and wakes at sunrise several miles from the moor.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: On the following night in the woods, he sees golden bathing benches, silver
    bath whisks, silver basins, and lovely maidens bathing naked in moonlight; the
    passage identifies them as wood-nymphs and daughters of the Meadow-Queen.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The maidens disappear toward morning, and though the youth revisits the woods
    repeatedly, he never sees them or the bathing utensils again and pines away in
    longing.
  category: sequence
  evidence_refs:
  - ev:9
