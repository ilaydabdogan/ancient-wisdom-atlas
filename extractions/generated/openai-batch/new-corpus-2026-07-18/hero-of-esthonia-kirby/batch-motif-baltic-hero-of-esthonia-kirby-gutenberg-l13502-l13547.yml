canonical_text:
  quote: ''
  summary: The passage contains two brief treasure legends. In “The Golden Snakes,”
    two woodcutters encounter many snakes, kill some, strike a crowned snake-king
    who becomes gold, find further gold after the snakes vanish, divide it, and use
    half to build a church. An editorial note says this story is more Lithuanian than
    Esthonian in character and introduces the next as more diabolical. In “The Devil’s
    Treasure,” a Swedish shoemaker takes gold from an iron chest found by a night
    fire on Sand Mountain, later experiences nocturnal supernatural visitations in
    a castle, is found bruised with hand imprints, dies after confession, leaves his
    money for a church-bell, and the treasure is said to be carried off again by demons.
  language: English
  quote_policy: summarized
