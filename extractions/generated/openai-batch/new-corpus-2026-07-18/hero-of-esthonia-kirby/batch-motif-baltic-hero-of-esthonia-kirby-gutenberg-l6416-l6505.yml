canonical_text:
  quote: ''
  summary: Elsie enters a splendid household banquet with twenty-four ladies and a
    lady seated in a golden chair. The lady decides to keep Elsie as a foster-child
    and orders a little old man to make an image of her to send back to the village.
    The old man fashions a hollow clay doll, places food and a black snake inside
    it, and animates it with a drop of Elsie's blood taken by a gold needle. Overnight
    Elsie is given fine clothes, while her old clothes are placed on the doll, which
    grows into a living-looking image of her. The lady says the image will be sent
    to Elsie's stepmother to receive beatings in Elsie's place and may punish the
    stepmother if she does not reform.
  language: English
  quote_policy: summarized
