canonical_text:
  quote: ''
  summary: On Christmas Eve, a farm-house party mistakes a lit church at midnight
    for early service. At the church door the lights and people vanish, and a stranger
    says the service is not theirs. He secretly summons a youth to return before St.
    John's Eve. An old woman later reads the youth's hand and encourages him to go.
    At the appointed time, the stranger explains a buried treasure beneath the middle
    of three junipers on a grave mound and gives detailed ritual instructions involving
    black animal offerings, silver, a juniper stick, repeated circling, the word “Igrek,”
    courage before phantoms, and distribution of part of the treasure to the poor.
    At cockcrow the stranger vanishes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On Christmas Eve, the farmer saw the church lit up, thought he had overslept,
    called his people, and they set out for service.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The party found the church lit and full of people, with strange singing; when
    they reached the open door, the lights and people disappeared.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A stranger came out, told the party to return because this was “our service,”
    and privately told one youth to return at midnight three days before St. John's
    Eve while keeping the matter secret.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the way back, the cleared sky and stars showed the party that it was midnight;
    the pastor later tried to explain the event as a dream.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old woman by the roadside read the youth's hand, promised him good fortune,
    advised him to go with the stranger without fear, warned him about marriage, refused
    payment, and hurried away lightly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the youth set out before midnight, one voice told him he was not going
    right, while voices singing in the air urged him not to throw away his good fortune.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The stranger came from behind the left side of the church and said the church
    service was held at Christmas only once in seven years, when men were asleep.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The stranger described a meadow grave mound with three junipers and said a
    great treasure was buried beneath the middle juniper.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The stranger instructed the youth to propitiate treasure guardians by slaughtering
    three black animals, offering all their blood, scraping silver from his buckle,
    cutting a juniper stick, circling the juniper nine times, striking the grass,
    and saying “Igrek.”
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The youth was told that subterranean jingling and a gleam of silver would
    appear, and that after kneeling and crying “Igrek” nine times the treasure would
    rise.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The seeker was told to wait patiently and not be frightened by spectres described
    as soulless phantoms sent to test courage; failure would mean returning empty-handed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The stranger said the seeker must go on St. John's Eve while bonfires burned
    and people made merry, and that one third of the treasure must be given to the
    poor.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The stranger repeated the instructions three times; when the sexton's cock
    crowed, he vanished suddenly.
  category: sequence
  evidence_refs:
