  summary: 'Editorial footnotes identify terms and parallels: a malevolent spirit
    term distinct from Vana pois; Hans as a generic cunning fellow who outwits the
    Devil; a speech prohibition during a ceremony; a reversed word meaning rise up;
    Death-magician as necromancer; a serpent-gathering compared with the Mahabharata
    and Hasib/Jamasp; birch-twig bathing practice; a frog/toad creature; Põrgu neitsi
    and Olev; a falling giant church-builder and name-calling as death omen; plague
    and illness apparitions; war-horror symbols in Kalevipoeg; and Finnish-Estonian
    charms.'
