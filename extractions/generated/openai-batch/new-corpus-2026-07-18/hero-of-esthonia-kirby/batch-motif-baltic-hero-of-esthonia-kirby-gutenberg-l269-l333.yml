canonical_text:
  quote: ''
  summary: In the preface, the writer explains that study of the Kalevala led him
    to examine Esthonian literature. He expected the Kalevipoeg to be an Esthonian
    variant of the Kalevala but found it dissimilar and interesting enough to present
    in prose. He describes the selected folk-tales, ballads, notes, map, bibliography,
    and index, and frames Finnish and Esthonian oral literature as late-surviving
    primitive literature comparable, as a literary-historical process, to the growth
    of the Greek epics before editing.
  language: English
  quote_policy: summarized
