canonical_text:
  quote: ''
  summary: A blue-eyed maiden grows to the Kalevide's height. The Kalevide uses her
    hat to shrink to ordinary human size, and the maiden later uses it to regain her
    former giant stature. The Kalevide wants to keep the hat so he can recover his
    own size and strength in danger. The maidens and the hero sing, dance, and play
    while hiding their noise from an old woman. The Kalevide promises to deliver the
    maidens from Hades the next day and to arrange marriages for them, then they play
    games until the lights are put out.
  language: English
  quote_policy: summarized
