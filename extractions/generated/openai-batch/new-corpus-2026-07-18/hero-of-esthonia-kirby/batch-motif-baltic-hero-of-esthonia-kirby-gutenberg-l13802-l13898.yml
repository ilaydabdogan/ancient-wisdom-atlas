canonical_text:
  quote: "“Go where you are asked, but beware of giving any blood, lest you should
    sell your soul.”"
  summary: A young man follows speaking birds to a spring, where a Hell-Maiden performs
    a moonlit washing rite for imperishable beauty. She discovers him, forgives his
    spying, invites him to her mansion, and the birds warn him not to give blood lest
    he sell his soul. He enters a splendid house, sups with her, and a red-garmented
    woman announces bedtime.
  language: English
  quote_policy: quoted
