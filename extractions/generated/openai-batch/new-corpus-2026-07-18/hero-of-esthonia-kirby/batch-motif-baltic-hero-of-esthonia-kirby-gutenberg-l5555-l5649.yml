canonical_text:
  quote: ''
  summary: 'Opening of “The Gold-Spinners”: a lame old woman lives in a hidden forest
    cottage with three daughters, whom she keeps spinning golden flax into fine thread.
    She locks the finished thread in a secret chamber, makes unexplained journeys,
    and warns the daughters that a broken thread will lose its glitter and their good
    fortune. During one absence, a prince of the race of Kalev becomes lost while
    hunting, finds the cottage, and is befriended by the daughters; the youngest stays
    awake with him after her elder sisters sleep.'
  language: English
  quote_policy: summarized
