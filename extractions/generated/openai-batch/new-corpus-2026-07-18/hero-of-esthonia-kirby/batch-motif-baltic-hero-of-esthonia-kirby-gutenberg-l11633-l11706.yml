  quote: "“Let the hat become a man, and let the man and the sack go home!”"
  summary: A countryman who has become a cavalry soldier remembers an earlier supernatural
    encounter, summons the Humpback at a crooked birch tree, receives aid through
    the Humpback's sons, and is transported home with a sack of money while his hat
    becomes a substitute man. The passage then turns to Jannsen's heath legends, describing
    uncanny nocturnal phenomena on moors and a herd-boy dragged into the ground after
    defying the devil.
