canonical_text:
  quote: ''
  summary: The son of Kalev leaves a brook carrying boards and travels home through
    several forest zones. He finds a frightened man who asks for protection, places
    him in his wallet, and asks what scared him. From inside the bag, the man recounts
    being lost near Lake Peipus, receiving food and warning from an old woman in a
    hut, hiding under a table from her two dangerous sons, hearing one son smell a
    human presence, and escaping the next morning through the woods. The Kalevide
    laughs at the story.
  language: English
  quote_policy: summarized
