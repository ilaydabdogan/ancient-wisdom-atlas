canonical_text:
  quote: ''
  summary: 'The passage gives several short narratives: a fisherman cheats a supernatural
    fishing partner and is drowned, after which the water-sprite compensates his widow;
    a mermaid forced to raise deadly storms is freed by the lord of Pahlen and rewards
    him; and a coachman secretly observes his noble master joining radiant northern-lights
    spirits in a sky journey or wedding above the clouds.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fisherman sleeps on sand by the Baltic until a stranger wakes him and says
    the sea is full of fish.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fisherman and stranger fish together repeatedly; the boat is filled, and
    the stranger requires half the profits while the other half goes to the fisherman's
    wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After each arrangement, the stranger disappears behind a large stone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The fisherman becomes rich, builds a cottage, buys a new boat, and sometimes
    drinks a glass.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the fisherman gives his partner less than the agreed share, the next
    catch is smaller; after he does so again, the following day's nets take no fish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The stranger accuses the fisherman of cheating for two days, says he must
    die, throws him overboard, and the fisherman's body is later found and buried.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: At the grave, a tall strong man tells the widow that if he had not drowned
    her husband, the husband would have died on the gallows.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The tall strong man gives the widow a bag of money, says her husband gained
    it honestly, identifies himself as the water-sprite, and disappears.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The lord of Pahlen finds a maiden sitting on a stone by the sea-shore and
    lamenting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The maiden says her father, the king of the sea, compels her to raise storms
    in which many people perish, in order to please the Mother of the Winds.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The nobleman breaks with his teeth the ring by which the maiden raises storms;
    she rewards him with two large barrels of gold.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Another story is introduced as concerning spirits of the air; a nobleman secretly
    leaves his mansion every Thursday during hard winters and forbids anyone to accompany
    him or see the horse and carriage.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The coachman disobeys the prohibition, hides in the stable, and sees the stable
