  summary: Fugitives arrive at the city with news that war is near and that their
    youths' axes cannot withstand the swords of mail-clad warriors. The Kalevide has
    the weary men fed and housed, then goes to his father's grave seeking counsel.
    No voice answers; only wind, distant sea, and rain-clouds are heard or seen. He
    returns home sorrowful and uneasy.
