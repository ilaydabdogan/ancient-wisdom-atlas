canonical_text:
  quote: ''
  summary: Sarvik, confused after leaving hiding, drinks water of weakness while the
    Kalevide drinks water of strength. The Kalevide wrestles Sarvik for seven days
    and nights, receives a gestural hint from Linda's shade, defeats and chains Sarvik
    in an iron chamber, and returns upward to daylight with treasure after a mouse
    warns him not to overload himself. After recovery, feasting, sleep, and return
    to Lindanisa, the passage recounts city-building plans, feast songs, an invasion
    announcement, and Varrak the Laplander's request for a chained iron-covered book
    containing the recorded wisdom of the Kalevide's father, which the Kalevide gives
    him despite protests.
  language: English
  quote_policy: summarized
