canonical_text:
  quote: ''
  summary: The passage summarizes two Estonian tales. In the first, a princess sleeps
    in a glass coffin on a glass mountain and can be won by a suitor who rides to
    the summit after seven years and seven days. A despised youngest son, neglected
    by his elder brothers, receives bronze, silver, and gold horses and armour from
    his dead father, reaches the summit on the third attempt, receives the princess's
    ring, and is later revealed to be a stolen royal child. In the second, an ill-used
    youngest sister kindly keeps a kitten, receives ornaments through its pursuit
    of a magpie, is murdered by jealous elder sisters, and is restored to life by
    healing well water after a flute made from reeds reveals her fate. The elder sisters
    later perish in the reed-bed while sent to recover the kitten.
  language: English
  quote_policy: summarized
