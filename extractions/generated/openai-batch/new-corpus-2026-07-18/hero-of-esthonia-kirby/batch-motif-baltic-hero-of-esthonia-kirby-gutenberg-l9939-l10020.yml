candidate_motifs:
- id: motif:1
  label: sleeping maiden in glass coffin on mountain
  taxonomy_refs:
  - death_rebirth
  - mountain
  basis: The princess lies in deep sleep in a glass coffin on a glass mountain and
    awakens when the successful suitor reaches the summit.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: medium
  cautions: The passage summarizes rather than narrates the full tale, and the princess
    is asleep rather than explicitly dead.
- id: motif:2
  label: threefold ascent by despised youngest son
  taxonomy_refs:
  - ascent
  - initiation
  basis: The neglected youngest son makes three attempts with bronze, silver, and
    gold horses and armour, reaching the glass mountain summit on the third day.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The ascent is literal, but any initiatory meaning is not stated in the
    passage.
- id: motif:3
  label: recognition by token and marriage to princess
  taxonomy_refs:
  - royal_legitimacy
  - sacred_exchange
  basis: The princess gives the successful rider a ring; the man who produces the
    ring is to marry her, and the youngest son claims the prize.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents a royal marriage recognition pattern, not a formal
    sacred-marriage doctrine.
- id: motif:4
  label: hidden royal child raised in low status
  taxonomy_refs:
  - royal_legitimacy
  basis: The magician explains that the peasant-raised youngest son is actually the
    son of a powerful monarch stolen in infancy.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not give details of his biological parents or original
    kingdom.
- id: motif:5
  label: kindness to animal helper brings gifts
  taxonomy_refs: []
  basis: The youngest sister treats the kitten kindly, and the cat's pursuit of a
