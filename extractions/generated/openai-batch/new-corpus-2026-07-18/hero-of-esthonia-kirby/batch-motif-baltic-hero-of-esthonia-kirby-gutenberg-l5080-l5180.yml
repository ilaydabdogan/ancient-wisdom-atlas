canonical_text:
  quote: ''
  summary: The passage introduces the tale of Slyboots. A rich king of Kungla holds
    a midsummer feast every seven years, but two prior feasts failed when an unknown
    stranger tasted the provisions and all food and drink vanished. The king offers
    wealth and his youngest daughter to whoever can prepare the feast successfully,
    with death as the penalty for failure. Slyboots, the clever youngest son of a
    farmer and secretly nursed by the Meadow-Queen, is dispossessed by his elder brothers,
    travels away, solves a woman's riddle about a crab, receives food, and decides
    to go to the royal capital to try the banquet challenge.
  language: English
  quote_policy: summarized
