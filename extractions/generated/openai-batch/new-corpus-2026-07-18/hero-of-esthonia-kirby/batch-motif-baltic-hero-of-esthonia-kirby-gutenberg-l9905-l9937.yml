    mother protects the children on the stove with juniper twigs and the sign of the
    cross, tricks the Devil by tying her girdle to a log, and retreats to the roof
    with a three-pronged fork. After failed attacks, red, white, and black cocks crow,
    and both devils vanish as if into the ground.
