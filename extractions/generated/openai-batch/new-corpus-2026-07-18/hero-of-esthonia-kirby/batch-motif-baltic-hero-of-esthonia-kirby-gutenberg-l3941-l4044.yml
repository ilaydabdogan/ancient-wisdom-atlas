canonical_text:
  quote: ''
  summary: The canto titled “Armageddon” begins after news of invasion interrupts
    a feast. Kalevide hides treasure under Taara’s protection with ritual conditions,
    summons an army, fights successive battles, seeks magical treatment for the wounded
    Sulevide, drains a lake from thirst, pursues enemies after Olev builds a bridge,
    and after further fighting Alevide drowns while drinking from a lake.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: News of an invasion ends the feast, and Kalevide consults with friends about
    burying his treasure for security.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: At night Kalevide, Alevide, and Sulevide dig a deep pit in a secret place
    for the treasure.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kalevide delivers the treasure to Taara’s protection and states that only
    a son of a pure mother, arriving on St. John’s Eve and sacrificing specified black
    animals, may obtain it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kalevide murmurs secret spells over the treasure, and the passage says the
    man who will raise it has not yet been born.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the morning Kalevide takes spear and sword, mounts his war-horse, orders
    Alevide to follow as shield-bearer, blows his horn, and arrays his forces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: People come to the king’s summons; women lament while male kin and lovers
