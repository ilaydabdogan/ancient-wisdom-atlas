  text: In the first battle described, Kalevide fights mailed warriors for half a
    day and his horse is killed under him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sulevide is severely wounded, and a soothsayer or man of wisdom is summoned
    to charm the blood from flowing.
  category: action
  evidence_refs:
