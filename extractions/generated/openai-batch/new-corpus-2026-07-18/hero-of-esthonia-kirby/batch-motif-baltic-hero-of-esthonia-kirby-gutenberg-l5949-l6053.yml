canonical_text:
  quote: ''
  summary: A prince who understands bird language overhears birds discussing a maiden
    cursed into the form of a water-lily near a bridge. He sends swallows to ask the
    old sorcerer of Finland for help. An eagle returns with instructions for the prince
    to cover himself in mud, become a crayfish by a spoken formula, free the water-lily
    roots under the river, drift to a rowan-tree and rock, and speak another formula
    to restore both the maiden and himself. After hesitation, a crow urges him to
    trust the sorcerer and the language of birds; at the bridge he hears the maiden’s
    song of her mother’s curse and watery confinement.
  language: English
  quote_policy: summarized
