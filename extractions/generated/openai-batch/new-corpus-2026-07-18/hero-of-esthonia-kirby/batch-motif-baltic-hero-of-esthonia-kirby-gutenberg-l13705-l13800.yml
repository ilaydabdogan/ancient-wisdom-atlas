canonical_text:
  quote: ''
  summary: A commentator introduces the Seal of Solomon and compares it with other
    Solomonic and mystical traditions. The tale then describes a northern monster
    that devastates living beings and can be overcome only through King Solomon’s
    Seal, whose secret inscription must be read. A young man travels east, learns
    from a magician how to understand birds by means of a charm made from nine herbs,
    and overhears birds say that the Hell-Maiden may know where the ring is or who
    possesses it. The birds also say she comes monthly at the full moon to wash at
    a spring to preserve her youth.
  language: English
  quote_policy: summarized
