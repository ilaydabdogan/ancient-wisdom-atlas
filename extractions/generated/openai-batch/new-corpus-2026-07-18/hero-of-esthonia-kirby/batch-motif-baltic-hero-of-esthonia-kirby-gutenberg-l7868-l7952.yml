canonical_text:
  quote: ''
  summary: Pärtel grows from herd-boy to young farm-labourer while remaining attached
    to a stone beneath lime-trees, where he dreams of music and plays his flute. A
    milk-white snake with fire-bright eyes emerges from under the stone, listens to
    him, and becomes familiar. On Midsummer Eve, after he leaves the village St. John's
    fire, he sees a mysterious fire at the stone that proves to be the snake's eyes.
    After the snake withdraws, the lime-tree leaves rustle like a voice warning about
    the thin-shelled egg of Fortune. Pärtel laments his unhappiness and alienation
    from other people.
  language: English
  quote_policy: summarized
