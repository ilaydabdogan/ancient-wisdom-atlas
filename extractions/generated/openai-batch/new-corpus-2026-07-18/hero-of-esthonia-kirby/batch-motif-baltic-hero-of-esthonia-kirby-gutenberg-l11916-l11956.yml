  quote: ''
  summary: The passage recounts how Vanaisa created Emmu Lake for human refreshment,
    withdrew its water because of human wickedness, later restored water through springs,
    and how the Blue Spring near Villina hill is ritually opened or closed to affect
    rain and drought. It also describes failed attempts to measure the Blue Spring,
    ending with a bleeding human head and a warning voice from below.
  language: English
