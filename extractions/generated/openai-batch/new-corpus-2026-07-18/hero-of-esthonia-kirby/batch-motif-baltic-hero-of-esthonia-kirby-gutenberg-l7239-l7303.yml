canonical_text:
  quote: ''
  summary: A prince serving as a royal herd-boy sits by a roadside, tends animals,
    and speaks with passers-by. An old man remarks that he does not seem born to be
    a herd-boy, and the boy answers that he was born to rule. Later, a Saxon lady
    in a coach insults him while demanding his basket of strawberries, orders her
    footman to strike him and seize the basket, and is resisted by the boy with a
    stick. The footman withdraws, the lady departs with threats, and the boy later
    says he can speak for himself and would have given the strawberries if asked properly.
  language: English
  quote_policy: summarized
