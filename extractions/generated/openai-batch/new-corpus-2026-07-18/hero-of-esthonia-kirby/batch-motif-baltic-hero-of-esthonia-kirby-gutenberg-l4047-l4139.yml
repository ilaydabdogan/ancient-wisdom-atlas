canonical_text:
  quote: ''
  summary: Kalevide abandons his kingdom, lives as a hermit, displays immense strength
    against intruders, is maimed by his own cursed sword at a brook, dies, ascends
    to Taara's halls, is reanimated without his legs, and is assigned by the gods
    to guard the gates of Põrgu. Bound at the rocky portal, he will one day be released
    by fire and return to bring prosperity to the Esthonians.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kalevide, overcome by grief, abandons his kingdom, abdicates in favor of Olev,
    and retires to a cottage in the pine-forests by the river Koiva.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the hermitage Kalevide lives alone and supports himself on fish and crayfish.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A party of armed men comes to the hermitage, and Kalevide sees in the water
    the reflection of one of them advancing with a drawn sword.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kalevide seizes three foes and drives them into the ground to different depths.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A messenger sent by coastal merchants invites Kalevide to visit them, and
    Kalevide tells him to pull up the crayfish rod before further discussion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The crayfish rod is a tall fir-tree uprooted by Kalevide and baited with the
    carcass of a dead mare; the messenger cannot move it, but Kalevide lifts it with
    one hand.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Vexed by intrusions, Kalevide wanders from the hermitage through the forests,
    reaches Lake Peipus, and comes to the brook Käpä.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kalevide's lost sword, affected by both his injunction and the Finnish smith's
    curse, raises itself and cuts off both his legs at the knee.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The wounded Kalevide cries for help, drags himself to shore, lies bleeding,
    and his legless body covers a whole acre of ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kalevide's cries rise to heaven; heavenly powers try unsuccessfully to salve
    his wounds and soothe his pain; after he dies, his soul flies to Taara's halls.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In heaven Kalevide sits in firelight among the heroes of Taara and listens
    to bards singing of his deeds.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: The old father of the gods and the assembled gods decide that Kalevide should
    keep watch at the gates of Põrgu so Sarvik cannot free himself from his bonds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Kalevide's soul flies down from heaven to reanimate his body, but the gods
    cannot restore his legs; he is mounted on a white charger and sent to the gates
    of Põrgu.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: At the rocky portal Kalevide obeys a heavenly command to strike the rock,
    and his right hand is caught in the cleft.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Kalevide sits on his horse at the gates of Põrgu, watching the bonds of others
    while bound himself.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: Demons try to soften their chains by piling charcoal faggots around them,
    but their fetters grow thicker when the cock crows at dawn.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: When Kalevide struggles to free his hand, the earth trembles and the sea foams,
    but the hand of Mana holds him at his post.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: The passage states that one day a vast fire will break out on both sides of
    the rock, melt it, allow Kalevide to withdraw his hand, and lead to his return
    to earth and a new prosperity for the Esthonians.
  category: sequence
  evidence_refs:
  - ev:10
