canonical_text:
  quote: ''
  summary: Introductory passage describing the scholarly collection, compilation,
    publication, and literary comparison of the Estonian epic Kalevipoeg. It identifies
    the epic’s subject as the mythical son of Kalev and as a giant-hero, compares
    the poem’s metre and some legends with the Finnish Kalevala, states that the hero
    is the same as Kullervo, and names several related or occasionally referenced
    heroes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Estonian learned society was founded in 1838 to collect popular literature,
    and Dr. Fählmann undertook to collect fragments about the mythical hero of Esthonia,
    the son of Kalev.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fählmann did not complete the planned work; after his death Dr. Kreutzwald
    carried out the design, and the book was published with a German translation between
    1857 and 1861.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the materials were defective and were augmented and pieced
    together by Kreutzwald; the narrative is also said to be interrupted by long lyrical
    passages.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage notes German condensed abstracts of the poem and says little had
    been published on the Kalevipoeg outside Esthonia and Finland.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The poem’s metre is described as eight-syllable trochaic, common among Estonians
    and Finns; the Kalevipoeg is contrasted with the Kalevala in verse flow, repetition,
    and alliteration.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Longfellow is said to have adapted this metre in Hiawatha from Schiefner’s
    German translation of the Kalevala; Kenealy is said to have used a similar metre
    earlier.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Kalevipoeg is said to consist of twenty cantos and about 19,000 verses;
    some of its legends are also said to be found in the Kalevala, and its giant-hero
    is identified with Kullervo.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says Vanemuine and Ilmarine are occasionally referenced, and that
