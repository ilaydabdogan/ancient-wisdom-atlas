canonical_text:
  quote: ''
  summary: A maiden demonstrates a ring that grants protection from weapons and invisibility
    depending on which finger bears it. A youth tricks her into handing it over, tests
    its powers, breaks a stone, makes himself invisible, and flies away. He brings
    the ring to a sorcerer, who deciphers its inscriptions and gives detailed instructions
    for killing the Northern Frog with an iron horse, iron spear, chains, invisibility,
    and the ring’s strength-giving power. The youth returns home, learns that the
    Northern Frog is near, and offers to destroy it for the king, who promises part
    of the kingdom and his daughter in marriage to whoever succeeds. Craftsmen make
    the required iron implements, and the youth moves the otherwise immovable iron
    horse with the ring’s help.
  language: English
  quote_policy: summarized
