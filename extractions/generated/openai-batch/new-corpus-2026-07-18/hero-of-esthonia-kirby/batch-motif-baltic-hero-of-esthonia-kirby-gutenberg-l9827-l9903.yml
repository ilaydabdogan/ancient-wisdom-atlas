canonical_text:
  quote: ''
  summary: The passage gives two Estonian lunar tales and a brief Polyphemus-type
    tale. In the first, a pure maiden at the Vaskjala Bridge longs to leave the world
    and dwell with the Moon; she becomes visible in the Moon and seeks equally pure
    earthly maidens as companions, but hides her face sorrowfully when none are worthy.
    In the second, a woman fetching water late on Saturday mocks the Moon and is taken
    into the sky with her pails as a warning against late holiday work. In the final
    note, a locksmith tricks and blinds the Devil by claiming the name "Myself," and
    the narrator compares this to a Swedish Lappmark story involving a giant and the
    name "Nobody."
  language: English
  quote_policy: summarized
