canonical_text:
  quote: ''
  summary: A soldier traps the Devil in a knapsack, has a smith hammer the knapsack,
    and later, after death, is refused entry to hell but accepted by the Old God.
    The passage then introduces Vanemuine/Väinämöinen as a culture-hero, musician,
    and divine figure in Estonian and Finnish tradition, with references to the Kalevala
    and to Orpheus.
  language: English
