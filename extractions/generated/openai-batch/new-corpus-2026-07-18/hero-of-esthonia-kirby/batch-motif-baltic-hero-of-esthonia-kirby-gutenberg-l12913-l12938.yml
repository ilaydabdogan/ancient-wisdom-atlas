  summary: The passage closes a prior tale by identifying a sorcerer as responsible
    for sending a toad into a horse carcass because of a grudge against a farmer.
    It then introduces a section on hidden treasures, stating that Estonian treasure
    stories are often connected with devils and that hidden-treasure traditions are
    common in war-devastated countries. The narrator compares Estonian and Oriental
    tales in which treasures are guarded by non-human beings, and gives the example
    of stories about Kidd burying treasure and causing a ghost to guard it.
