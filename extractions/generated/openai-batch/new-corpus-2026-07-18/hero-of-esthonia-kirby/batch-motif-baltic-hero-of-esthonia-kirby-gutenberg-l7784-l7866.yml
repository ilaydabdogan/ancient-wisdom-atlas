canonical_text:
  quote: ''
  summary: A poor forest couple has a ninth son in old age and cannot find sponsors
    for his christening. On the way to church, the father asks a beggar and then a
    young Saxon lady to stand as sponsors. The child is baptized Pärtel. The lady
    pays fees and gives money, while the beggar gives a small box containing a bird's
    egg inherited from a magic-skilled aunt, saying it may bring fortune to its destined
    owner if kept unbroken. Pärtel later becomes a herd-boy, carries the gift, and
    favors a place beneath a lime-tree by a granite rock and brook, where the grass
    is unusually fine and renewed after grazing.
  language: English
  quote_policy: summarized
