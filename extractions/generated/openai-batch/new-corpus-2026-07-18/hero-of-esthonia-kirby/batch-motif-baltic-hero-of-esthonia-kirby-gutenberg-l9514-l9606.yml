canonical_text:
  quote: ''
  summary: Sharpeye uses three small spider-weavers to trap a yellow moth at a golden
    apple-tree. The captured being appears as an old grey-bearded man with a golden
    apple in an iron net. A magician compels the prisoner by singeing beard hairs
    until he confesses that he is the sorcerer Piirisilla, expands to ordinary human
    size, returns the stolen golden apples, and is burned in the cage. Afterwards
    three gifted brothers seek the daughter of a northern king, who is promised to
    whoever completes three feats. Because each brother can do one feat and they look
    alike, they impersonate one man. Swiftfoot completes the reindeer-watching task,
    and Quickhand defeats a witch who becomes the palace door-bar by offering her
    a red-hot iron hand and bolting the door.
  language: English
  quote_policy: summarized
