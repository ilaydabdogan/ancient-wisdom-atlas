canonical_text:
  quote: '"the first living thing that meets you when you return to your palace"'
  summary: A king lost in a forest accepts a stranger's demand that he surrender the
    first living thing to meet him on returning home. The first to meet him is his
    infant son, so the king exchanges the prince with a peasant girl; the Old Boy
    later takes the girl as the supposed royal child. When grown, the prince grieves
    over the substitution, resolves to rescue the girl or perish with her, disguises
    himself as a peasant, and returns to the forest carrying peas, where another bargaining
    stranger appears.
  language: English
  quote_policy: quoted
