canonical_text:
  quote: ''
  summary: Slyboots escapes the Old Boy across the sea with stolen gold and silver
    magic treasures, aided by a ring of strength. A grey-bearded friend warns him
    that his brothers will try to destroy him and advises him to have the princess
    secretly overhear them. The brothers boast falsely about the princess, are exposed,
    confess, and are executed; Slyboots becomes the king's councillor. Later, Slyboots
    defeats an invading army with a sword from the under-world and is made the king's
    son-in-law. The passage then summarizes Jannsen's related House-Spirit variant
    and introduces the next story by comparing its three spinning maidens with an
    episode of Kalevide in Sarvik's palace.
  language: English
  quote_policy: summarized
