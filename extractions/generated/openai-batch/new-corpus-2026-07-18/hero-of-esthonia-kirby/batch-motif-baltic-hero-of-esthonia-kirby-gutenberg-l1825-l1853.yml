  quote: ''
  summary: A copper man offers weapons to a woman if she will marry him. She refuses,
    preferring a husband from the land. After he laughs, her foot slips and she sinks
    into the sea. Her parents find only her ornaments on the beach and call her home.
    She answers that she cannot return because the water weighs her down, and says
    she now has a dwelling and resting-place at the bottom of the sea.
