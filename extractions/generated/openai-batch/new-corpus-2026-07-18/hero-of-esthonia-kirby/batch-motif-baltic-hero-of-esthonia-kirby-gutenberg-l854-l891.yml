canonical_text:
  quote: ''
  summary: 'The passage surveys Esthonian supernatural beings and mythology: the Devil
    and his underground realm, animal forms of his female relatives, minor devils,
    their enemies and outwitter, assorted spirits and sorcerers, the house-spirit
    Tont/Kratt/Puuk, a vampyre-like spectre, the divine descent and destruction of
    a gigantic hero-race, and Kalevipoeg’s enchanted bondage until a future restoration.'
  language: English
  quote_policy: summarized
