canonical_text:
  quote: ''
  summary: A poor herd-boy loses a cow, is beaten and threatened by his mistress,
    searches unsuccessfully, and runs away. After collapsing, he is revived by a little
    old grey-bearded man, who hears his story, advises him to follow the sunrise for
    seven years to a cloud-reaching mountain, gives him a wallet and flask with conditional
    daily food and drink, tells him to be kind to hungry or thirsty creatures, gives
    him a plantain-leaf that becomes a boat on water, blesses him, and vanishes.
  language: English
  quote_policy: summarized
