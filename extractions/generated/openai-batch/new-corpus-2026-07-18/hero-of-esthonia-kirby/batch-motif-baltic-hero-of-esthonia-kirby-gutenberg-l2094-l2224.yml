canonical_text:
  quote: ''
  summary: The Kalevide wakes without memory of the previous events, sails home in
    a sorcerer's boat, recovers awareness of a killing through blood on his sword
    and clothes, hears laments from the drowned maiden and his dead mother's spirit,
    reunites with his brothers, and joins them as they recount searches for their
    mother and propose a divinely sanctioned trial to decide kingship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kalevide wakes dazed, cannot remember whether he had been in Finland,
    on the island, or in battle, and has no remembrance of killing the smith's son;
    after three days he reaches the seashore, finds the sorcerer's boat, and sails
    homeward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes the Kalevide's body with comparisons to oak, elm, branches,
    boxwood, and hardened iron.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the return voyage the Kalevide sings of himself meeting three shiploads
    of enchantresses and resisting their blandishments.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: As the Kalevide nears Esthonia, the sea-breeze clears his memory, and the
    blood-stained sword and blood on his clothes attest to the murder he committed.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Near midnight, by the island where the maiden had fallen into the sea, the
    Kalevide hears her sad song beneath the waves.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The maiden's song laments her own fate and the evil lot of her brother, who
    had killed the son of his father's old friend; the sword's blood reddens her cheeks,
    and a long penance is said to await her brother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hero sits in thought, laments the past, then continues the voyage while
    singing a lament for his mother that names alder, aspen, pine, and birch in connection
    with sorrow, trembling, weeping, and suffering.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After reaching shore, the Kalevide passes Mount Iru, where his mother's form
    stood, and hears her unseen spirit in the wind singing that the young eagle left
    innocent and returned stained with crime.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Kalevide understands that his mother is dead, more fully recognizes two
    crimes weighing on him, goes home, and is received by his brothers, who had mourned
    him as dead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The eldest or first brother recounts searching for his mother across many
    regions, meeting metal maidens, being directed by the golden daughter of the Gold
    King, receiving no trace from a flesh-and-bone maiden, and refusing her invitation
    because he seeks his mother rather than a wife.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The second brother recounts encountering an unresponsive old couple, a mewing
    cat, a grinning wolf, a growling bear, a cuckoo that directs him onward, and four
    maidens who report no trace of his mother and recommend that he seek a wife; he
    refuses because a wife cannot replace his mother.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The youngest brother relates his adventures but does not mention the fatal
    brawl at the smith's feast or the sad songs of the island-maiden and his mother's
    spirit.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The eldest brother says their parents are gone and proposes a trial to decide
    which brother should rule as king; the second agrees, and the third proposes that
    the trial occur the next day according to the will of Taara.
  category: action
  evidence_refs:
  - ev:10
