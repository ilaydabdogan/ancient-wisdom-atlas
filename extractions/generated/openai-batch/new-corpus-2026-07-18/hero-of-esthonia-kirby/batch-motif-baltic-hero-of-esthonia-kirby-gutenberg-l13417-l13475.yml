canonical_text:
  quote: ''
  summary: After a headless dwarf saves Hans from other headless dwarfs, the dwarf
    reminds him not to despise small creatures and directs him to a hidden treasure
    behind a loose stone in the north corner of the church wall. Hans later retrieves
    the money, gives one-third to the parish poor, leaves the parson's service, and
    becomes prosperous. The narrator adds that older villagers had known Hans and
    attested the story.
  language: English
