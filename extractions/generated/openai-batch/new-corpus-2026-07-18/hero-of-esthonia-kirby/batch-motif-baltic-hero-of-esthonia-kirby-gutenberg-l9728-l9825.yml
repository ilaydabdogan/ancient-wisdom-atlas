canonical_text:
  quote: ''
  summary: The passage frames Estonian Man/Woman in the Moon traditions, then narrates
    the legend of Videvik, Koit, and Ämarik. Videvik meets the Moon at a stream, causing
    the Moon to neglect his nightly light and allowing a wolf to kill an ox. The Creator
    punishes the wolf, permits Videvik and the Moon to marry, and assigns Videvik
    to guard the night. The Creator then appoints Ämarik and Koit to tend the setting
    and rising sun. During long summer nights Koit and Ämarik meet as lovers but decline
    marriage, preferring their ever-renewed beloved state.
  language: English
  quote_policy: summarized
