canonical_text:
  quote: ''
  summary: 'The prince enters the Old Boy''s house, sees a beautiful silent maiden,
    eats with her from remnants that become a good meal, is ordered to keep silent,
    follows the maiden to his lodging, dreams of her aid, helps her with household
    work, surveys the animals and outbuildings, and receives his first task: mowing
    grass for the white mare and cleaning the stable under threat of punishment.'
  language: English
