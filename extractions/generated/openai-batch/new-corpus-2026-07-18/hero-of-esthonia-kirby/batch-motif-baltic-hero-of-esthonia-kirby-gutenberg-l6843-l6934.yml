canonical_text:
  quote: ''
  summary: A boy travels with a wallet and flask whose provisions do not fail, crosses
    a lake using a leaf that becomes a boat, and journeys for years until he reaches
    a cloud-high mountain. There he sees a giant serpent, a giant toad, and a great
    eagle, then meets a horseman who says they are his enemies and offers him service
    beyond the mountain. The youth crosses the mountain, enters the man's service,
    and is assigned to guard chained savage dogs in a rock cellar; if the dogs escape,
    they will destroy life on earth and bring the end of the world. Stones and oxen
    are kept ready to block holes the dogs dig.
  language: English
  quote_policy: summarized
