  quote: ''
  summary: 'Elsie lives happily in a mysterious household where an old man uses a
    silver wand and a golden cock to draw food, furniture, clothes, and household
    goods from a granite rock. A thirteenth dish is always served but never eaten;
    a black cat accompanies it, and the old man carries the dish, cat, and cock under
    the rock. The lady warns Elsie that the dish is a hidden blessing that must not
    be touched, connecting the rule to gratitude and the danger of avarice. Years
    pass: Elsie grows into a maiden and learns many skills, while Kiisike remains
    a little child and prefers play.'
