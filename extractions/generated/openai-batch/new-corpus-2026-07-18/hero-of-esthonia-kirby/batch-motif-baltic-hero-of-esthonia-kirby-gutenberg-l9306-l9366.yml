canonical_text:
  quote: ''
  summary: The passage summarizes two Estonian tales. In the dragon-slayer tale, Peter
    receives a magic returning rouble, obtains three named black dogs, rescues a princess
    from a scaled horned winged monster, is displaced by a false claimant, and later
    proves his deed with monster trophies and marries the princess while the dogs
    become swans. In the dwarf tale, a young lady spares a snake, becomes godmother
    to a dwarf child in a subterranean household, receives earth that becomes precious
    metal, and later escapes before her house burns after a maid pours boiling milk
    that kills the dwarf child.
  language: English
  quote_policy: summarized
