canonical_text:
  quote: ''
  summary: A lady complains to the royal authorities about the herd-boy. The youth,
    identified in the passage as a prince and later as an exiled prince, refuses to
    be bound as a prisoner but agrees to appear voluntarily. The judges and then the
    king find him innocent. The angry lady turns to the queen, who plans a covert
    punishment by sending the youth into service with a cruel peasant woman; the narrator
    adds that the queen would have killed him at once had she known his true identity.
