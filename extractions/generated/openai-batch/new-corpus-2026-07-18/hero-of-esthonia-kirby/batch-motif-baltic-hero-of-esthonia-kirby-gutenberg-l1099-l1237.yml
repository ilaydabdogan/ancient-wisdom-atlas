canonical_text:
  quote: ''
  summary: The passage introduces Kalev’s origin and founding of a kingdom in Viru,
    then tells how a widow finds a hen, a grouse egg, and a crow; the hen becomes
    Salme, the egg produces Linda, and the crow becomes an orphan servant. Salme receives
    many suitors, including the Moon, the Sun, and the Youth of the Stars. She rejects
    the Moon and Sun and accepts the Star as husband.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The race of Taara is said to have dwelt in the land and taken wives from among
    the daughters of men.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three sons leave a northern household near Taara’s sacred oak forest; one
    becomes a merchant in Russia, another a warrior in Lapland, and Kalev is carried
    to Esthonia on an eagle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The eagle carries Kalev across the Gulf of Finland and lands with him on the
    rocky shores of Viru, where Kalev founds a kingdom by the wise ordering of Jumala.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A young widow in Lääne follows her cattle’s footprints and finds a hen, a
    grouse egg, and a young crow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The widow brings the hen, egg, and crow home, makes a wool-lined basket nest
    for the hen and egg, and puts the crow behind boxes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The hen grows for more than three months while sitting on the egg.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the widow opens the basket, the hen has become Salme, the egg has produced
    Linda, and the crow has become an orphan maid-of-all-work.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Salme receives many marriage approaches from suitors; the Moon, the Sun, and
    the eldest son of the Pole Star are also named as suitors.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Moon arrives in a grand chariot with many horses and attendants, but Salme
    rejects him because of his varied duties and irregular appearances.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Sun arrives with fiery eyes and similar state, but Salme rejects him,
    blaming him for drought, rain, and harm to crops; he leaves angry.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Youth of the Stars arrives, and Salme orders his horse to receive exceptional
    care before accepting the Star as her husband.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Salme states that the Star’s eyes shine gently, his temper does not change,
    and he will not thwart sowing or destroy the harvest.
  category: speech
  evidence_refs:
  - ev:12
