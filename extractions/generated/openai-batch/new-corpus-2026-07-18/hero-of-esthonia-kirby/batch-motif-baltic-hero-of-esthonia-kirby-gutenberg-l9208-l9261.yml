canonical_text:
  quote: ''
  summary: 'A note introduces Esthonian cosmopolitan folk-tales and summarizes Kreutzwald''s
    Esthonian version of “Bluebeard”: a rich lord with many dead wives marries a young
    woman, leaves her a key to a forbidden chamber, she and her sister enter it and
    find evidence of murdered former wives, the lord returns to kill her, and Goose-Tony
    saves her by striking and binding him.'
  language: English
  quote_policy: summarized
