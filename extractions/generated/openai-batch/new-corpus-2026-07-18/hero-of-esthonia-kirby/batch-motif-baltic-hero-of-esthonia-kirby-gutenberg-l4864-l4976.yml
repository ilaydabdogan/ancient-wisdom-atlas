canonical_text:
  quote: ''
  summary: The prince kills a calf in the stall and takes a shining red reel from
    its brain. He gives the reel to the maiden, and they flee. The maiden says she
    is a princess stolen by the Old Boy. The Old Boy discovers the slaughtered calf
    and stolen reel and sends spirits after the fugitives. The reel warns the maiden
    of pursuit, and she uses it to transform herself and the prince first into a brook
    and fish, then into a wild rose-bush and rose, so that the spirits fail to capture
    them.
  language: English
  quote_policy: summarized
