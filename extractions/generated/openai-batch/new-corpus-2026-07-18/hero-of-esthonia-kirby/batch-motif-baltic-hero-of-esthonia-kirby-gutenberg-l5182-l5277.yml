canonical_text:
  quote: ''
  summary: Slyboots reaches the city, gains audience with the king, and is entrusted
    with organizing a very large feast. He builds a guarded feast compound, gathers
    provisions, and forbids any stranger to taste the food or drink. An unknown grey-haired
    old man asks to taste the soup; Slyboots demands his gold ring as a pledge. After
    the old man surrenders it, Slyboots strikes him, binds him, hangs him by the legs,
    and says he will keep the ring on which the old man's power depends.
  language: English
  quote_policy: summarized
