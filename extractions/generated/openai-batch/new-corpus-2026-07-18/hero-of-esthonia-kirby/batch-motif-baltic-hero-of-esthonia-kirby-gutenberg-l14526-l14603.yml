canonical_text:
  quote: ''
  summary: The passage contains the conclusion of one animal-and-trickster episode,
    in which a scheming man travels with a fox, wolf, and bear, loses his horse, falls
    with them into a wolf-pit, and all die in sequence. It then gives an etiological
    tale explaining why cats kill mice, why dogs are enemies of cats, and why dogs
    still search for a missing written license granted after divine adjudication.
  language: English
  quote_policy: summarized
