canonical_text:
  quote: ''
  summary: 'A prince serving an old man is assigned an impossible overnight task:
    grow barley, process it, and brew beer by morning. A maiden gives him a key and
    instructions for commanding the old man''s spirits, and the beer is produced.
    The old man then attempts a deadly handshake, which the maiden says is meant to
    lead to the prince being eaten; she tells the prince to offer a red-hot shovel
    instead. The old man later offers the maiden as bride, but she interprets this
    as a trap because her help has been discovered. She instructs the prince to prepare
    for flight by killing a white-headed calf and bringing her a shining red reel
    found in its brain.'
  language: English
  quote_policy: summarized
