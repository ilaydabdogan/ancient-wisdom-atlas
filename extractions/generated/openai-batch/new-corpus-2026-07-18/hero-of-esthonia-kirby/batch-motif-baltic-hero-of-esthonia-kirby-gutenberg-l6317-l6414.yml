canonical_text:
  quote: ''
  summary: Elsie meets a silver-belled black dog and a richly dressed girl who leads
    her deeper into the wood to a wondrous garden and shining house. The girl asks
    her mother to let Elsie stay. Elsie explains her mother is dead and her stepmother
    beats her, and she begs not to be sent home. While the mother considers, the girl
    Kiisike shows Elsie a box containing a leaf, mussel-shell, and fish-bones. Water
    from the leaf makes the garden vanish into a lake; the shell becomes a boat and
    the bones become oars. The children row among other singing boats until a voice
    calls them home, after which Kiisike reverses the enchantment and the garden returns.
  language: English
  quote_policy: summarized
