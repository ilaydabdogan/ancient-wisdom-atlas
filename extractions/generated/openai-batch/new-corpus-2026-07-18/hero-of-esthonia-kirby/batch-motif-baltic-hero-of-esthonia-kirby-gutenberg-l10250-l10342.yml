canonical_text:
  quote: ''
  summary: Sleepy Tony awakens in a luxurious glass-walled chamber and is treated
    as a lord by maids. He is fed richly, shown an extraordinary garden, and brought
    before a queen-like lady in a glass hall with twelve maidens and two golden thrones.
    The lady declares him her beloved bridegroom and consort. In a private twelfth
    chamber she reveals that she is the being he had called a mermaid, rejects that
    name, identifies herself as a daughter of the Water-Mother, and explains a weekly
    Thursday vow of fasting and seclusion during which Tony may not see her until
    evening cockcrow.
  language: English
  quote_policy: summarized
