canonical_text:
  quote: ''
  summary: At a lake, an unnamed traveler hears a herd-boy calling for help because
    a wolf is carrying off his favorite lamb; the traveler kills the wolf with a stone.
    He considers how to cross the lake, begins building a bridge, loses the unfinished
    structure in a storm, eats roasted crayfish, and sets out through the water. The
    passage then describes a poor orphan boy on Lake Peipus who is forced into hard
    service as a herd-boy; a wood-nymph pities him and sings from an oak-tree, promising
    good luck. The boy finds a lark's egg, keeps it warm near his heart, and a mouse
    hatches from it, later becoming a kitten, puppy, lamb, and finally a white-woolled
    sheep that consoles him.
  language: English
  quote_policy: summarized
