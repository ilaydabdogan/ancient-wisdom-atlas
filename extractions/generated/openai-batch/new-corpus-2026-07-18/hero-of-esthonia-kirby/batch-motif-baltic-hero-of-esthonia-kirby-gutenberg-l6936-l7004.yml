canonical_text:
  quote: ''
  summary: A young man serves a master in a remote stony place, using oxen and a crowbar
    to move stones and guarding a door against dangerous dogs or hell-hounds. After
    years of service and long periods of the master's sleep, a speaking eagle advises
    him to take the master's swift horse and his saved money and ride west back among
    humans. The youth follows the advice, ignores the master's plea to leave the horse,
    returns among mortal men, becomes wealthy, marries, and lives happily. A closing
    editorial transition notes Linda's egg-birth and says a princess in the following
    tale resembles Cinderella.
  language: English
  quote_policy: summarized
