canonical_text:
  quote: ''
  summary: Kalevide reaches the swamp of Kikerpärä, where two demon brothers dispute
    possession. He delegates the measurement of the swamp to the son of Alev. While
    Alevide works at the river, an old water-demon bargains to stop the damming and
    promises to fill Alevide's felt hat with silver. Alevide secretly makes the hat
    impossible to fill by placing it over a pit. After exhausting his money, the demon
    tries to lure Alevide to the underworld, but Alevide sends Kalevide's small cupbearer.
    The boy is led through a sunless torchlit underworld to the demon palace, faces
    frightening demonic hospitality and rough play, escapes by pretending to measure
    the room, receives advice from gate guards, avoids the demon mother in the form
    of a small bitch with two puppies, returns to find Alevide and the money gone,
    and is challenged by the water-demon to wrestle.
  language: English
  quote_policy: summarized
