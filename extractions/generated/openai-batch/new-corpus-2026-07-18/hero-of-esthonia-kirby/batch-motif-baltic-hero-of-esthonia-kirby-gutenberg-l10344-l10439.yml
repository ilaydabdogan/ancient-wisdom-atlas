canonical_text:
  quote: ''
  summary: Sleepy Tony's mermaid consort is absent every Thursday for a fast-day.
    After repeated refusals and warnings, Tony suspects a secret lover, isolates himself,
    and spies through a gap into her locked chamber. He sees that the chamber is a
    deep water tank and that she is a mermaid, woman above and fish below. She later
    returns in mourning, says his folly has ended their happiness, and after a crash
    he wakes on the sea-shore in his old ragged clothes.
