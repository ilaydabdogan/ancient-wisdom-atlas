canonical_text:
  quote: ''
  summary: A childless queen receives a bird's egg from a mysterious old woman. A
    tiny doll-like princess hatches from the egg and is later named Rebuliina by the
    same woman acting as godmother. The godmother gives protective and summoning objects,
    helps the princess during stepmother persecution, and later rescues and disguises
    her during war. The prince Villem eventually drives out the enemy and is proclaimed
    king.
  language: English
  quote_policy: summarized
