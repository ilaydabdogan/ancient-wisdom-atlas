canonical_text:
  quote: ''
  summary: The passage recounts city-founding around Kalev's burial mound, the Kalevide's
    battle against invading forces, the loss of his horse in a bog, and a subsequent
    journey with three companions through wild terrain. The heroes reach a cave where
    an old woman cooks cabbage soup and warns them about a strange youth. During three
    watches a dwarf-like being with a gold bell asks to taste the soup, grows enormously,
    vanishes, and empties the pot. On the Kalevide's watch, he takes the dwarf's bell
    as pledge, strikes him lightly, and the dwarf sinks into the earth amid thunder.
    At night the daughters of the Meadow Queen sing of the Kalevide's coming adventures.
  language: English
  quote_policy: summarized
