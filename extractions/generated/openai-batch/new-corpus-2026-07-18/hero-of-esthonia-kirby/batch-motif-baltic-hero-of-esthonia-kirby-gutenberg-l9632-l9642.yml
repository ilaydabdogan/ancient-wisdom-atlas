canonical_text:
  quote: ''
  summary: 'The passage summarizes an Estonian tale identified as a form of the despised
    younger-son story: a dying father leaves an ox to his simple third son, who misunderstands
    a noise in a tree as an offer to buy the ox, takes a log as security, later finds
    money inside the log, kills a shepherd who tries to cheat him, and the shepherd''s
    disappearance is attributed to the devil.'
