literal_observations:
- id: obs:1
  text: The Wood of Tontla is located in Alutaga, north of Lake Peipus, and people
    are said not to dare enter it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Reports about the wood describe an old tumbledown house among thick trees
    and many ragged, dusky, human-looking forms, including old women and half-naked
    children.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A peasant witness sees women and children gathered around a bright fire; an
    old woman scatters red-hot cinders, and the children fly upward in the smoke and
    descend again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A little old man with a long beard arrives carrying a sack, and the women
    and children shout, dance around him, and try to pull the sack from him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A black cat as large as a foal, with fiery eyes, leaps onto the old man's
    sack and disappears into the cottage.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator states that the peasant witness's report was unclear because
    his head ached and his senses were confused.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The King of Sweden orders the wood to be felled, but people refuse; when one
    man strikes a tree, blood flows and a cry like a man in pain is heard.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: No paths lead into or out of the wood, and no smoke is seen rising there;
    the narrator suggests hidden underground passages or night flight as possible
    means of movement.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: In a nearby village, Elsie is a seven-year-old girl whose stepmother beats
    and mistreats her, while her father cannot protect her.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Elsie and other village children accidentally reach the Wood of Tontla while
    gathering strawberries; the others flee when the place is recognized, but Elsie
    continues picking berries under the trees.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Elsie thinks that the dwellers in the Wood of Tontla cannot be worse than
    her stepmother at home.
  category: speech
  evidence_refs:
  - ev:7
