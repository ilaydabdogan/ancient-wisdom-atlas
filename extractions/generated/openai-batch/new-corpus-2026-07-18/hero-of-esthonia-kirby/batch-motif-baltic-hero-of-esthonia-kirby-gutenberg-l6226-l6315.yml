  summary: The passage introduces the feared Wood of Tontla, reports strange inhabitants,
    a nocturnal fire scene, a foal-sized black cat, and a tree that bleeds when struck.
    It then shifts to nearby village life, where the mistreated child Elsie goes berry-picking,
    reaches the dreaded wood with other children, and remains there after the others
    flee.
  language: English
