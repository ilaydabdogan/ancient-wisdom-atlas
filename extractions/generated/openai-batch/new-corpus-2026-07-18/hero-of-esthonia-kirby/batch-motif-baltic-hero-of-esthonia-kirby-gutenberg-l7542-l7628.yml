canonical_text:
  quote: '"We have now seen the inmost kernel of each, and I am not going to let myself
    be dazzled by the outer shell."'
  summary: 'At a royal feast arranged for bride selection, the king secretly brings
    the gardener''s daughter and publicly chooses her despite the queen-dowager''s
    contempt. A Finnish sorcerer reveals the inner nature of the assembled maidens
    by magical sleep and transformation: the rivals appear as animals or birds of
    prey, while the chosen maiden appears as a flowering rose-bush with two doves.
    After restoration, the king and the maiden join their matching half-rings, marry,
    and the subjects rejoice.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A magnificent feast is prepared in the royal palace to last a fortnight so
    the king can consider whether any lady surpasses the gardener's daughter.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Great ladies in the neighborhood are invited to bring their daughters, and
    the maidens hope the prize will fall to them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the last day, the highest councillors warn that if the king does not choose
    before evening an insurrection may break out, and the king agrees to announce
    his choice that evening.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king secretly sends a trustworthy messenger to bring the gardener's daughter
    away and keep her concealed until evening.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the evening gathering, the chosen young lady is muffled and wears fine
    white linen without silk, satin, or gold, unlike the other ladies in rich attire.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king loosens the maiden's head-gear, leads her to the queen-dowager, names
    her his chosen bride, and invites the assembly to the wedding.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The queen-dowager angrily objects, refers to the king as having been reared
    as a herd-boy, and calls the chosen maiden a peasant girl unfit for a king's consort.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king asserts his authority and says he will show the assembly that the
    maiden is the most suitable bride and is pure and good.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The king returns with an old man known since his herd-boy days, described
    as a famous Finnish sorcerer who knows many secret arts.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The sorcerer takes a bottle of wine-like liquid, mutters a spell, sprinkles
    drops on the maidens' heads, and they fall asleep while standing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The sleeping maidens are transformed from human shape into snakes, wolves,
    bears, toads, swine, cats, hawks, or other birds of prey.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Among the bestial forms is a beautiful rose-bush covered with flowers and
    two doves nestling in its branches; this is the gardener's daughter.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The king says the inmost kernel of each has been seen and that he will not
    be dazzled by the outer shell.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The sorcerer fumigates the maidens with magic herbs, waking them and restoring
