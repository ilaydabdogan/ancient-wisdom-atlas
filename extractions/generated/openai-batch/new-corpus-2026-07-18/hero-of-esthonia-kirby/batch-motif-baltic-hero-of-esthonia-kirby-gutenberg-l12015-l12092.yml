  quote: '"The best plan would be to steal the thunder-weapon from my old dad."'
  summary: The Thunder-God's son has made a seven-year compact with the Devil for
    his soul, but seeks to escape it. Exploiting the Devil's fear of thunder, he bargains
    for release from the soul claim in exchange for helping steal Kõu's thunder-weapon.
    The Devil carries him up from a mountain to the clouds; the son distracts his
    sleeping father with a louse, steals the weapon, and the Devil hides it in Põrgu
    behind seven locks.
