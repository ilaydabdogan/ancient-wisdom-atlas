canonical_text:
  quote: ''
  summary: 'A prince serving an old master completes three dangerous farm tasks through
    stratagems and the secret advice of a maiden: milking a black cow dry by threatening
    hot tongs, hauling an impossible haycock with a white mare by invoking wolves,
    and keeping a wild white-headed calf beside him with a silk thread. The master
    repeatedly questions whether the prince has help, grows angry, and the prince
    attributes his success to his own head and God.'
  language: English
  quote_policy: summarized
