canonical_text:
  quote: ''
  summary: After nine years with the lady, Elsie is told that she must leave because
    she is mortal and belongs among humankind; the lady, a higher-order being in human
    form, foretells a destined husband and combs Elsie's hair with a golden comb.
    The narrative then returns to the village, where a clay image has been beaten
    in Elsie's stead. The stepmother attacks the clay image, but a black snake comes
    from its mouth, bites the stepmother's tongue, and kills her. Elsie's father later
    finds the stepmother dead and the daughter gone; after eating, he too is found
    dead and swollen. The couple are buried, and the peasants do not pursue the vanished
    daughter.
  language: English
  quote_policy: summarized
