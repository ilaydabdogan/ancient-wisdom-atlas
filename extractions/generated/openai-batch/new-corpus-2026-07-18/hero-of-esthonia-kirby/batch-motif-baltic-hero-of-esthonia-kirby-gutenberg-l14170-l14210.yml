canonical_text:
  quote: ''
  summary: The king and his daughter wait anxiously for the absent traveller. The
    daughter dreams that her consort is in distress and asks the king to gather sorcerers.
    Most sorcerers can only say he is alive and distressed. A Finnish sorcerer says
    he is held captive in the East by a powerful nonhuman creature. Messengers sent
    east meet an old sorcerer who has learned hidden wisdom from inscriptions on Solomon's
    Seal. He identifies the prisoner's location and accompanies them. Guided by birds,
    they reach a rock cavern where the son-in-law has been chained for seven years.
    The sorcerer releases him by magic, nurses him, and sends him onward. He arrives
    on the day the old king dies, is chosen king, and lives happily, though the magic
    ring is never recovered.
  language: English
  quote_policy: summarized
