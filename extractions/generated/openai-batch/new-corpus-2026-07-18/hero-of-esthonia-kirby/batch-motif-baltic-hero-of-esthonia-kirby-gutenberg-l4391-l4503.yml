  quote: ''
  summary: The prince explains that his bag contains peas connected with funeral watchers
    for his dead aunt, accepts a year's service from a stranger called the Old Boy,
    secretly drops peas along the route, is led through a secret door under a stone
    into a silent subterranean land, and reaches the master's homestead, where he
    is told to observe, obey, and keep silent.
  language: English
  quote_policy: summarized
