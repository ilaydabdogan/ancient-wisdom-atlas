canonical_text:
  quote: My light must prevail over the darkness, and the darkness must flee before
    it.
  summary: The Devil sends a servant up a ladder to tar the moon. The servant blackens
    the moon's back and prepares to blacken its front, but the Creator sees the plot
    and condemns the servant to remain on the moon forever with his bucket as a warning.
    The story explains the moon's diminished brightness, dark side, and visible marks,
    and closes with an editorial transition to a following tale about the Kratt and
    Tont house-spirit.
  language: English
  quote_policy: quoted
