canonical_text:
  quote: ''
  summary: Kalevide plans a northern voyage to the world's end, receives raven guidance
    about an earth-mouth and guarded doors, commissions vessels from a great oak,
    builds a silver ship named Lennuk, and sails north with sailors and wise men.
    Storms raised by Finnish sorcerers drive the ship to Lapland, where a local wise
    man, later named Varrak, warns that the quest is dangerous and bargains to pilot
    them. Varrak steers through a whirlpool by using a red-wrapped barrel swallowed
    by a whale, and the voyage reaches the fiery island where mountains emit flame,
    smoke, boiling water, and lava.
  language: English
  quote_policy: summarized
