  - ev:6
  - ev:10
  confidence: high
  cautions: The passage gives only the outward journey segment and does not include
    arrival at the World's End.
- id: motif:2
  label: animal guide to a liminal route
  taxonomy_refs:
  - wisdom
  basis: A raven provides route instructions, and birds later supply crucial information
    about the coast.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:9
  confidence: medium
  cautions: The raven's advice is later qualified as leading toward Põrgu, so its
    function may be ambiguous.
- id: motif:3
  label: earth-mouth and guarded threshold
  taxonomy_refs:
  - hero_descent
  basis: The raven describes an opened mouth of the earth and guarded doors reached
    by a ritual foot-stamp; the local wise man identifies the raven's route with Põrgu.
  evidence_refs:
  - ev:1
  - ev:9
  confidence: medium
  cautions: Kalevide does not actually enter the earth-mouth in this passage.
- id: motif:4
