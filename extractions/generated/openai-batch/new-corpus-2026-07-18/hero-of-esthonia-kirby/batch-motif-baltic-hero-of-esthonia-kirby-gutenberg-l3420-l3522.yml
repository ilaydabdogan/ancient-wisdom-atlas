candidate_motifs:
- id: motif:1
  label: world-end northern voyage
  taxonomy_refs:
  - mystical_quest
  - departure
  basis: Kalevide undertakes a sea voyage northward to the uttermost end of the world,
    later seeking the door at the World's End.
  evidence_refs:
