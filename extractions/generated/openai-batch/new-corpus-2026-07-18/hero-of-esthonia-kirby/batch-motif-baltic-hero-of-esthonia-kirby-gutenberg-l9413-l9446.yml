canonical_text:
  quote: ''
  summary: 'The passage summarizes the beginning of the Estonian tale “The Gifted
    Brothers.” A childless wife receives instructions from a fairy-like girl, gives
    her husband three black-hen eggs, and later bears three sons. The fairy marks
    the boys with red thread and prescribes a christening-time ritual using the burned
    threads, ashes, and the mother’s milk; the boys receive swiftness, handiwork skill
    and strength, and sharp sight. As adults they separate to seek fortunes: Swiftfoot
    serves a king as groom, Quickhand becomes a remarkably productive craftsman, and
    Sharpeye’s adventures are deferred.'
  language: English
  quote_policy: summarized
