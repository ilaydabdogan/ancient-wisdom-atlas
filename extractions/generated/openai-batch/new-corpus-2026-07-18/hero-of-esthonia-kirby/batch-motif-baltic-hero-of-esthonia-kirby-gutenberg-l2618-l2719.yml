canonical_text:
  quote: ''
  summary: Kalevide travels to Lake Peipus, wades across it during a storm raised
    by a sorcerer, and carries planks intended for a refuge. After he sleeps with
    his sword beside him, the sorcerer steals the sword by magic but loses it in the
    brook Käpä. Kalevide finds the sword in the water, speaks with it, leaves it there
    after it recalls a murder in Finland, and gives it conditional commands for future
    heroes, singers, and the person who brought it there.
  language: English
  quote_policy: summarized
