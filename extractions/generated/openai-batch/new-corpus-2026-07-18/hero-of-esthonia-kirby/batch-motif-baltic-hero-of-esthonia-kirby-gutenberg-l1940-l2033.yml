canonical_text:
  quote: ''
  summary: After mourning his mother, the Kalevide travels toward a famous Finnish
    smithy to obtain a sword, guided first by a thrush and then by an old woman. At
    the smithy he destroys lesser swords in testing, is shown an unparalleled sword
    made over seven years with seven irons, seven charms, and seven waters, and proves
    it by cleaving an anvil. A seven-day drinking bout follows, during which a drunken
    quarrel over the story of a drowned maiden ends when the Kalevide beheads the
    smith's eldest son.
  language: English
  quote_policy: summarized
