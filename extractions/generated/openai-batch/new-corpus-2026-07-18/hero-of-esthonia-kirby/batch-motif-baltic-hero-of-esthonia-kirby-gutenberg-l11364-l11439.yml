canonical_text:
  quote: "“Man is created to sustain himself by toil and thrift.”"
  summary: Hans rests at a smokeless fire with three men in white garments, drinks
    from the man with the fir staff, and falls asleep. He wakes in a strange place,
    follows a noise to a cavern, and enters a huge smithy where small smiths work
    under the staff-bearing master. The master shows Hans vast gold and silver treasures
    in seven caverns; Hans cannot lift even one bar. When Hans asks why the treasures
    are kept underground, the master says mankind would perish from sloth if no one
    needed to work.
  language: English
  quote_policy: quoted
