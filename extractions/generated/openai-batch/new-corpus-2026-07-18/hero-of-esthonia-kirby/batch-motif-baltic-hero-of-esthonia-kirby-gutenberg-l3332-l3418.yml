canonical_text:
  quote: ''
  summary: Kalevide returns from Sarvik’s regions with three sisters and stolen goods
    while Tühi and his followers pursue him. The youngest sister uses a wishing-rod
    to create a bridge before the fugitives and water behind them. Tühi questions
    Kalevide about carrying off the daughters, defeating allies, locking up the old
    mother, and taking Sarvik’s sword, hat, treasures, and wishing-rod. Later Kalevide
    suffers a magic sleep and a flood raised by a sorceress, meets the son of Olev,
    and gives the sisters into others’ charge. The youngest and eldest sisters marry;
    the second sister is abducted by a sorcerer, then rescued when a magic bridge
    crosses a lake obstacle. She marries the son of Olev, and the three sisters become
    ancestors of many tribes.
  language: English
  quote_policy: summarized
