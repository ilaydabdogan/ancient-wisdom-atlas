canonical_text:
  quote: ''
  summary: 'A poor labourer and his wife have twelve daughters, including two pairs
    of twins. The mother''s earlier encounter with a white-robed lady at a village
    spring leads to a lasting hidden benefaction: at each child''s birth the mother
    throws a pebble into the well, the lady appears, later sponsors the baptism, gives
    a silver rouble, and promises protective help. The well water strengthens the
    children, and each daughter later receives a magically enriched bridal chest.'
  language: English
  quote_policy: summarized
