canonical_text:
  quote: ''
  summary: A good king and his first queen finally have a prince, but the queen dies
    soon after childbirth. The king remarries; the second queen fears the prince's
    succession and has an old woman abduct him secretly, strip him of his fine clothes,
    and place him with poor foster-parents in a remote woodland house. The king searches
    unsuccessfully and grieves. The prince grows up intelligent in the forest and
    later leaves his foster home to work as a herd-boy for a rich farmer.
  language: English
  quote_policy: summarized
