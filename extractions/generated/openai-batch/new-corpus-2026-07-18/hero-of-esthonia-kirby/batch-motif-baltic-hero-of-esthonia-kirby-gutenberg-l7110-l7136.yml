canonical_text:
  quote: ''
  summary: After mourning his father for a year, the prince seeks a bride and invites
    maidens to a feast. Rebuliina is instructed by her godmother in a dream, receives
    splendid clothing and restored beauty through a casket, travels to the palace
    in a coach, and has the forgotten casket brought by a swallow. At the feast she
    outshines the other ladies; the godmother appears at midnight, identifies her
    as the adopted child of the king's father's first queen, and disappears. The king
    marries the princess, and the casket is no longer seen.
  language: English
  quote_policy: summarized
