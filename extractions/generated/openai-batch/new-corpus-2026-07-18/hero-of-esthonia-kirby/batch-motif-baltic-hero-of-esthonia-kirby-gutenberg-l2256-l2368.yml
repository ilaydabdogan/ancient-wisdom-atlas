canonical_text:
  quote: ''
  summary: The three sons of Kalev travel south, refuse an offer of brides, and hold
    a stone-throwing contest at a lake to decide the heir. The youngest brother wins,
    is recognized as king, and offers a silver coin to the gods. As king, he ploughs
    and defends the land; his sweat becomes a healing spring. His hobbled white horse
    is killed by wild animals, and the horse’s body parts become lakes, hills, marsh,
    plants, and other landscape features.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The three sons of Kalev travel south before sunrise, rest under trees, pass
    a lighted house, and are invited by the father and mother there to choose brides
    from among their daughters; the brothers decline marriage.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the third day the brothers reach a small lake with steep banks; water-birds
    are in the lake, and the holy forest of Taara is visible on the opposite shore
    in the sunset.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The eldest brother says their lot must be decided at the lake; the agreed
    trial is that whoever casts his stone across the lake to firm ground will be the
    father’s heir, while the other two will seek fortunes elsewhere.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The eldest brother’s stone flies swiftly but changes direction and sinks in
    the middle of the lake; the second brother’s stone rises high and falls near the
    water, half sunk in mud.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The youngest brother throws his rock; it travels across the lake by skipping
    over the water and reaches firm ground beyond.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the brothers wade across the lake and inspect the stones, only the youngest
    brother’s stone is found on firm ground; the eldest declares that the gods have
    assigned the kingdom to the youngest, and the brothers bathe and adorn him as
    king before parting affectionately.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The youngest brother throws a silver coin into the water as an offering to
    the gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The new king’s duty is to plough and defend the country; he ploughs with his
    sword by his side and stocks the land with corn, grass, trees, and berries.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: On a hot noonday, the king unyokes his nearly exhausted white horse, hobbles
    it, leaves it to graze, and falls asleep with his head on a hill and his body
    and legs spread over the plain.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sweat from the sleeping king’s forehead sinks into the earth and becomes a
    spring whose water strengthens, heals sickness and sore eyes, refreshes the weary,
    and gives maidens rosy cheeks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: While asleep, the king dreams that his horse is torn apart by wolves; the
    horse has in fact strayed, and wolves, bears, and foxes emerge from the forest
    while the horse is hobbled and unable to escape.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The horse defends itself with hoofs and head and kills many beasts, but is
    overcome by their increasing numbers and falls.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The place where the horse falls becomes hollow ground; little hills represent
    the wolves killed in the struggle, and the horse’s blood, liver, entrails, bones,
    hair, mane, and tail become a red lake, a mountain, a marsh, hills, rushes, bulrushes,
    and hazel-bushes.
  category: sequence
  evidence_refs:
  - ev:6
