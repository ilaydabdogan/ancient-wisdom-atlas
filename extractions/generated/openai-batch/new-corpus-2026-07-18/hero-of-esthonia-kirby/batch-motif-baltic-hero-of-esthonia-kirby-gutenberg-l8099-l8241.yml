  summary: 'Footnotes giving editorial and comparative notes on Estonian and Finnish
    mythic material: the Great Oak Tree and Kalevide''s voyage; Hades/Hornie; Linda''s
    Bosom; Ukko/Taara; Väinämöinen and Vanemuine; the Eagle of the North and world-forming
    eggs; miraculous births and wooing of Salme and Linda; celestial suitors; Suometar''s
    duck-egg birth; and Muru eit as a tutelary grass-mother.'
