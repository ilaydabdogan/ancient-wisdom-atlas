canonical_text:
  quote: ''
  summary: 'After the world''s creation, nights lack light. The Creator commands Ilmarine
    to make night light; Ilmarine forges a gold-covered moon with fire inside and
    fixes stars in the firmament. The moon gives bright warmth at night, helping people
    work and frustrating the Devil''s evil activity. The Devil and two companions
    plan to smear the moon with tar using a ladder, bucket, and mop, but the attempt
    fails: the servant falls with the bucket onto the Devil, the ladder breaks, and
    the Devil remains blackened with tar and soot.'
  language: English
  quote_policy: summarized
