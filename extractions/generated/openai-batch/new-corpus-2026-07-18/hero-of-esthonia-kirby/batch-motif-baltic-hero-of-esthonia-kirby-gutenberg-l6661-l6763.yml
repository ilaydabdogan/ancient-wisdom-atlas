canonical_text:
  quote: ''
  summary: Elsie leaves the Wood of Tontla after receiving golden tokens; an old man
    transforms her into an eagle-like bird with a silver wand. She flies south, is
    shot, falls, and wakes in human form under a bush, where a prince who has dreamed
    of finding her discovers her. She marries him, receives treasure from her foster-mother,
    becomes queen, and later recounts her youth; the Wood of Tontla is never seen
    or heard of again. The passage then gives brief comparative summaries of 'The
    King of the Misty Hill,' 'The Orphan's Handmill,' and the opening of 'The Orphan
    Boy and the Hell-Hounds.'
  language: English
  quote_policy: summarized
