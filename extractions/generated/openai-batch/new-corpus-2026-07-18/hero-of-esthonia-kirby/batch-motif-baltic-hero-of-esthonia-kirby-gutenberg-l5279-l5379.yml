canonical_text:
  quote: Bridge before, water behind!
  summary: After a three-week feast, Slyboots postpones his reward to deal with the
    old stranger. He has the old man beaten; the old man falls, vanishes underground,
    and Slyboots follows through the opening. In the underground dwelling, Slyboots
    observes three maidens tending the old man, learns of a ring of strength, a magic
    sword, and a rowan-wood rod. He steals the sword and rod with the help of the
    youngest girl, escapes to a sea, uses the rod to form a bridge over the water,
    and returns toward the royal city while the old man questions him from the shore.
  language: English
  quote_policy: quoted
