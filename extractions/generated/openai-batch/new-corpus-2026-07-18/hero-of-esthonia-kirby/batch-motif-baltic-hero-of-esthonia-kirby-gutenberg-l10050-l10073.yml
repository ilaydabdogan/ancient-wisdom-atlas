  summary: A tale summary identifies two girls as half-sisters. The younger is veiled
    and married to the elder's suitor in deception. The husband discovers the deception,
    throws the false bride under a river's ice, and takes his intended bride. Later,
    the mother encounters a water-lily that identifies itself as her daughter. The
    mother and daughter are transformed into a black dog and black cat with a magician's
    aid, but their revenge attempts are stopped by a sorceress who had helped the
    young mother.
