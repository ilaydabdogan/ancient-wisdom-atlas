candidate_motifs:
- id: motif:1
  label: Giant culture hero and ruler
  taxonomy_refs:
  - culture_hero
  basis: The hero is described as a gigantic mythical ruler and is shown ploughing
    land, planning fortified towns, fetching timber, and overcoming supernatural opponents.
  evidence_refs:
  - ev:1
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage is an argument-summary, not a full narrative episode.
- id: motif:2
  label: Miraculous birth from found birds and egg
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: A widow finds a hen, a grouse's egg, and a young crow, from which Salme,
    Linda, and a slave-girl arise.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives a condensed outline and does not explain the nature
    or ritual status of the birth.
- id: motif:3
  label: Posthumous heroic birth
  taxonomy_refs:
  - miraculous_child
  basis: Kalev dies and is buried before the birth of his posthumous son, the Kalevipoeg.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No supernatural conception is stated in this passage.
- id: motif:4
  label: Rejected suitor abducts woman
  taxonomy_refs:
  - stolen_beloved
  basis: Linda is carried off by a Finnish sorcerer whose suit she has despised.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage states abduction and rejection but gives limited details.
- id: motif:5
  label: Divine rescue followed by transformation to stone
  taxonomy_refs: []
  basis: Linda escapes the sorcerer through the interference of the gods and is afterward
    changed into a rock.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not state why the transformation occurs.
- id: motif:6
  label: Counsel sought at the father's grave
  taxonomy_refs:
  - wisdom
  basis: The Kalevide seeks help and counsel at his father's grave.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not quote the counsel or describe the grave interaction.
- id: motif:7
  label: Hero's sea crossing to pursue an enemy
  taxonomy_refs:
  - departure
  basis: The Kalevide throws himself into the sea to swim to Finland and later arrives
    there to slay the sorcerer.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage gives the itinerary but not the full journey narrative.
- id: motif:8
  label: Fatal recognition after hearing the hero's name
  taxonomy_refs: []
  basis: The island maiden is horrified when she hears the Kalevide's name and falls
    into the sea.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The reason for the horror is not supplied in this excerpt.
- id: motif:9
  label: Smith's curse on weapon-bearing hero
  taxonomy_refs: []
  basis: After selling a huge sword, the smith curses the Kalevide because the hero
    kills the smith's eldest son in drunken fury.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The content and later effect of the curse are not given here.
- id: motif:10
  label: Succession decided by strength contest
  taxonomy_refs:
  - royal_legitimacy
  basis: The three sons of Kalev decide who will inherit by hurling rocks across a
    lake; the youngest wins the best cast.
  evidence_refs:
  - ev:9
