canonical_text:
  quote: adventures of a mythical hero of gigantic size
  summary: The passage introduces the Kalevipoeg as the Estonian national epic and
    gives a prose argument of its early cantos, covering the origins of Kalev, Salme,
    Linda, and Kalevipoeg; abductions, transformations, sea journeys, heroic contests,
    supernatural opponents, an enchanted sword, a long spell-induced sleep, and the
    hero's entry into a cavern leading to Sarvik's palace.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage identifies the Kalevipoeg as the national epic of Esthonia and
    describes its central hero as a mythical giant who ruled the country in a former
    period of independence and prosperity.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hero is called Kalevipoeg or Kalevide, meaning the son of Kalev, and the
    narrator compares him with Kullervo of the Finnish Kalevala while noting differences.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Canto I argument, three brothers travel in different directions; Kalev
    is carried by an eagle to Esthonia and becomes king.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A widow finds a hen, a grouse's egg, and a young crow; from the first two
    come Salme and Linda, and from the crow comes a slave-girl.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Salme chooses the Youth of the Stars as husband, while Linda chooses the young
    giant-king Kalev.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kalev dies and is buried before the birth of his posthumous son, Kalevipoeg.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: During a hunting absence, Linda is carried off by a Finnish sorcerer after
    rejecting him; she escapes through divine intervention and is later changed into
    a rock.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Kalevide seeks help and counsel at his father's grave.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Kalevide swims toward Finland, lands on an island, seduces a maiden, and
    continues after failing to save her when she falls into the sea.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The maiden's parents rake the sea and find an oak, a fir, and other things,
    but not their daughter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Kalevide arrives in Finland, slays the sorcerer, later buys a huge sword
    from a famous smith, kills the smith's eldest son in drunken fury, and is cursed
    by the smith.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: The brothers determine inheritance through rock-hurling; the youngest makes
    the best cast, after which the other two leave the country.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Kalevide ploughs the land, and wolves devour his horse while he sleeps;
    he later slaughters the wolves.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: In a dispute involving water-demons, Alevide begins draining a swamp; the
    water-demon begs the hero to stop, and the hero tricks the demon out of treasures
    before overcoming him in hurling and wrestling.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: A sorcerer steals the Kalevide's sword and sinks it in the brook Käpä, where
    the Kalevide commands it to cut off the legs of the one who brought it there.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: A spell cast by the sorcerer puts the Kalevide into a deep sleep for seven
    weeks, during which a vision of Ilmarine's workshop occurs.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:17
  text: On the return journey the Kalevide finds demons cooking at the entrance to
    a cave, enters a cavern leading to Sarvik's palace, breaks open its door, and
    finds three maidens in the antechamber.
  category: sequence
  evidence_refs:
  - ev:14
