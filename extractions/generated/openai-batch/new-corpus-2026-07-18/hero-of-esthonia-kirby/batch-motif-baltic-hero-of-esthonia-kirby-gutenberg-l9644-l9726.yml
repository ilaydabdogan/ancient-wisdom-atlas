canonical_text:
  quote: ''
  summary: An introductory note links the tale to a widely distributed story of a
    traveller appropriating magical objects disputed by a dead magician's heirs. In
    the Esthonian story, a man finds three dwarfs fighting over a magic hat, shoes,
    and stick. He uses the hat and stick to destroy them, travels to a wedding in
    Courland, sees invisible little guests stealing the feast, shows the host what
    is happening, seals the room, destroys the little guests with the cudgel, and
    later reads the secret thoughts of the wedding party.
  language: English
  quote_policy: summarized
