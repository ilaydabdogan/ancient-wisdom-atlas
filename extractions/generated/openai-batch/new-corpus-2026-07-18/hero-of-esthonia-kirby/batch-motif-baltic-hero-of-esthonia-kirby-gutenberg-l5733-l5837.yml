canonical_text:
  quote: ''
  summary: A raven returns with a prince's message telling the maiden to stay awake
    on the ninth night for rescue. She secretly meets the prince and his soldiers,
    who flee through the forest, but her mother discovers the escape and sends a cursed
    bundle of nine herbs and charmed salt on the wind. At a river bridge the wind-borne
    packet startles the prince's horse, and the maiden falls into an unfathomable
    river. The grieving prince becomes ill; an old Finnish sorcerer diagnoses a wind-caused
    loss of half his heart and prescribes exposure to the wind.
  language: English
  quote_policy: summarized
