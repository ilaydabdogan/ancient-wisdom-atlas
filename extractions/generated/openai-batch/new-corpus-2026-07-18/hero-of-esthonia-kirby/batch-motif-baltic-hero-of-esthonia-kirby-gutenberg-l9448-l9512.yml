  quote: ''
  summary: Sharpeye, the third brother, reaches a city where the king’s golden apples
    are being stolen nightly despite guards. He hides in a nearby tree to watch, sees
    a yellow moth settle near a fine apple, dozes briefly, and then finds both moth
    and apple gone. He consults a magician, who enchants three spiders so they can
    spin an inescapable cage around the thief.
