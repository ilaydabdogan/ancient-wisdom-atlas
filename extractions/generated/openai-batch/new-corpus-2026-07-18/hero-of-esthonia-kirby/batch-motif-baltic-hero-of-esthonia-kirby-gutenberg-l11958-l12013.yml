canonical_text:
  quote: ''
  summary: The passage recounts a legend of a black pool formed or marked by the drowning
    of a wartime noble household and coach, followed by hauntings, animal apparitions,
    water maidens, an uncanny fish, voices, and a dangerous wheel-hoop rising from
    the water. It then introduces a section on Estonian Devil and black-magic stories,
    including blood compacts, the outwitted Devil, northward-attributed magical skill,
    stolen sun and moon episodes in Finnish traditions, and the Son of the Thunder-God
    tale.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During wartime, a rich lord tried to leave the country with his family and
    goods in a coach drawn by six horses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The horses swerved from the path, and the people and goods were lost in a
    deep lake of black water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the loss, the pool is described as haunted; a black dog tries to entice
    boys in, and cats and birds are seen near it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man walking by the pool had his leg seized and was dragged down, but he
    saved himself by grasping a juniper bush.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The rescued man saw maidens sporting in the water like white swans, and then
    they vanished.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A fisherman caught a black tail-less pike, after which a voice of the old
    nobleman asked whether all the swine were safe and another voice answered that
    the old tail-less boar was missing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Many people have seen a great hoop from a coach-wheel, sharp like an axe edge,
    rise from the water.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The section introduction states that Devil stories are frequent in Estonian
    literature and that selling oneself to him is commonly imagined through three
    drops of blood or a blood-signed compact.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: The introduction says many such Devil stories are evidently pre-Christian
