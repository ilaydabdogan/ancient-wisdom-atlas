canonical_text:
  quote: ''
  summary: 'The passage relates church-foundation legends about Revel, Pühalepp, and
    the Church of the Holy Cross: Olaf builds a church at Revel and dies after placing
    the cross; the Devil fails to destroy churches with hurled rocks; oxen or white
    calves determine a church site; a golden cross heals a blind nobleman; and a holy
    tree from church ruins is felled by an overlord who is then struck blind.'
