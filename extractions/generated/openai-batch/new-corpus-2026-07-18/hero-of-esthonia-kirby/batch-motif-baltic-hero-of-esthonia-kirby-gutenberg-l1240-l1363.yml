canonical_text:
  quote: ''
  summary: Salme receives the Star as bridegroom, is adorned, and celebrates her wedding.
    Linda refuses several suitors, including the Moon, Sun, Lord of the Waters, Wind,
    and Prince of Kungla, but accepts the giant Kalev. Salme departs with the Youth
    of the Stars and says she will be hidden behind clouds or transformed into a star;
    Linda later leaves with Kalev, while Kalev names the moon, sun, birch-tree, and
    woodland cousins as her kin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Salme orders the Star to be brought into the hall, where a table is cleaned,
    covered, and supplied with meat, fish, wedding-cake, honey, beer, and mead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Star refuses to eat or drink until Salme appears and says that stars do
    not close their eyes in sleep.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Salme asks Linda to fetch garments and kerchiefs, and the Meadow-Queen and
    wood nymphs adorn Salme so much that her foster-mother does not recognize her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Guests gather for Salme's wedding, including oaks and alders, and dances are
    performed during the nuptials of the Star and Salme.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Moon and the Sun return to seek Linda's hand, and Linda refuses both of
    them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Lord of the Waters seeks Linda's hand, and Linda refuses him by speaking
    of waves, the sea, brooks, and floods.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Wind arrives on the Horse of the Tempest with a mounted retinue, asks
    for Linda's hand, and is refused because Linda says a delicate girl could not
    enjoy wind and tempest.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Prince of Kungla seeks Linda's hand and is approved by guests and Linda's
    sisters, but Linda refuses him because she fears the king's wicked daughters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The young giant Kalev appears as a suitor; the guests and widow oppose him,
    but Linda accepts him at once.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Kalev refuses to eat or drink until Linda appears, while Linda asks for time
    to adorn herself with help from her slave-sister.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Linda appears in the hall, is admired, and her wedding is celebrated with
    dances from every province of Esthonia.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Salme says farewell, declares that she will be hidden behind clouds or wander
    through the heavens transformed into a star, mounts her sledge, and is not heard
    from again.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: When Linda leaves with Kalev, Kalev reminds her that she has forgotten the
    moon as her father, the sun as her old uncle, the birch-tree as her brother, and
    cousins in the wood.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: Kalev and Linda travel in a sledge day and night across snow-fields and through
    pine-forests until they reach their home.
  category: action
  evidence_refs:
  - ev:11
