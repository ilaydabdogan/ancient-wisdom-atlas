canonical_text:
  quote: ''
  summary: A woodcutter spares trees that beg for mercy and receives a wish-granting
    golden rod from a bark-clad wood-god. The rod can command ants, bees, a kettle,
    trees, and a loom, but later misuse of the rod to demand the sun and stars brings
    divine fiery punishment. A Christian variant replaces Tapio with Jesus and explains
    why trees no longer speak and why fir resin and bugs exist. The excerpt then begins
    another story in which a countryman wakes a stranger before a storm and receives
    future instructions involving a crooked birch-tree.
  language: English
  quote_policy: summarized
