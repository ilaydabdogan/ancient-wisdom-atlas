canonical_text:
  quote: ''
  summary: Kalevide discovers the entrance to Põrgu, opens the hidden doors of Hades,
    and descends through an underworld path. A bell, repeatedly recommended by animal
    voices, removes smoke, darkness, snares, a miring brook, and mosquitoes. He then
    meets the forces of Sarvik at a blazing pitch river and iron bridge, fights through
    them, breaks into Sarvik's enclosure, receives water of strength from a shade
    resembling his mother Linda, rejects Sarvik's old mother's offer, and confronts
    Sarvik's accusations.
  language: English
  quote_policy: summarized
