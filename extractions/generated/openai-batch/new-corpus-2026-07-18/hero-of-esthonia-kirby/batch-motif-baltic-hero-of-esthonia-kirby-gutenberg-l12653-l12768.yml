candidate_motifs:
- id: motif:1
  label: blood compact with the Devil
  taxonomy_refs:
  - sacred_exchange
  basis: Several stories involve blood given or drawn in connection with a bargain
    or compact with the Devil.
  evidence_refs:
  - ev:2
  - ev:9
  - ev:10
  confidence: high
  cautions: The taxonomy label is broad; the passage itself uses bargain and compact
    language but not the term sacred exchange.
- id: motif:2
  label: devil-provided foodless servants revealed as plant remains
  taxonomy_refs: []
  basis: The Devil supplies a man-servant and maid who require only water; after their
    term they disappear, leaving a rotten stump and birch-bark.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: No exact supplied taxonomy family matches artificial wooden or bark servants.
- id: motif:3
  label: magical transformation of threatening claimants into animals
  taxonomy_refs:
  - shapeshifter
  basis: A Finnish sorcerer’s charm transforms three claimants of a Devil-dedicated
    horse into a bug, a wolf, and a rat.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The beings are transformed by an external charm; the passage does not
    describe self-willed shapeshifting.
- id: motif:4
  label: disguised divine visitor tests hospitality and rewards the compassionate
    host
  taxonomy_refs:
  - divine_judgment
  - sacred_exchange
  basis: God appears as a beggar, is refused by the farmhouse, is received by the
    shoemaker, and grants the shoemaker’s charitable wish.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage states the farmhouse burns through recklessness rather than
    explicitly as divine punishment; the divine reward is explicit.
- id: motif:5
  label: miraculous charity and inexhaustible daily bread
  taxonomy_refs:
  - sacred_exchange
  basis: The shoemaker wishes to give each poor person what is most required and never
    lack daily bread, and he later supplies displaced and needy people abundantly.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not specify the mechanism of the abundance beyond God’s
    granted wish.
- id: motif:6
  label: descent to hell and liberation of captive souls
  taxonomy_refs:
  - hero_descent
  - afterlife_journey_map
  - ascent
  basis: The shoemaker goes to hell, defeats the Devil, explores the underworld, releases
    imprisoned children’s souls, and goes with them to heaven.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The shoemaker goes to heaven rather than returning to ordinary life; the
    ascent taxonomy is used for the movement from underworld to heaven.
- id: motif:7
  label: protective or powerful juniper staff against hell
  taxonomy_refs: []
  basis: The hell warden and Devil object to the shoemaker’s juniper staff, and the
    shoemaker uses it to strike the Devil, making hell shake.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explain why juniper is dangerous to hell; symbolic
    interpretation should remain tentative.
- id: motif:8
  label: purchased magical healing from the Devil with postmortem loss
  taxonomy_refs:
  - forbidden_knowledge
  - sacred_exchange
  basis: A forester gives three drops of blood for a magic wound-healing powder, and
    after death his corpse disappears.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage calls the powder magic but does not explicitly call the knowledge
    forbidden.
- id: motif:9
  label: clever rescuer counters a Devil compact
  taxonomy_refs:
  - wisdom
  basis: A clever student rescues a dull schoolboy from a compact written in the boy’s
    blood; the student’s later death is linked to a “blood-vessel of wisdom.”
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage gives only a brief summary and does not detail how the rescue
    is accomplished.
