canonical_text:
  quote: ''
  summary: The passage summarizes several tales involving devil bargains, blood compacts,
    magical servants, transformation, divine hospitality, descent to hell, and rescue
    of captive souls. A stingy farmer bargains with the Devil for foodless servants
    and is later destroyed. Another farmer escapes devilish claimants through a sorcerer’s
    charm. A compassionate shoemaker receives God disguised as a beggar, is rewarded
    with the ability to aid the needy, defeats the Devil with a juniper staff, releases
    imprisoned unbaptized children’s souls from the underworld, and goes to heaven.
    The passage also mentions further devil compacts involving blood, healing powder,
    and a schoolboy.
  language: English
  quote_policy: summarized
