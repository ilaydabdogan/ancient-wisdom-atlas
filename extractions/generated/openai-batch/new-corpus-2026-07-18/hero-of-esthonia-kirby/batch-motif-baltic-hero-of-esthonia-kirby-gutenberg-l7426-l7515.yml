canonical_text:
  quote: ''
  summary: A prince who has wandered through trades and now works as a gardener is
    traced after a deathbed confession reveals his childhood removal. The king searches
    through farms and villages, aided by an old man who knows the prince's path, and
    finally recovers his son. The prince declares his love for the gardener's daughter
    and betroths her with a gold ring. The king cuts the ring in two, giving one half
    to each, and states that the halves will reunite if God created them for one another.
  language: English
  quote_policy: summarized
