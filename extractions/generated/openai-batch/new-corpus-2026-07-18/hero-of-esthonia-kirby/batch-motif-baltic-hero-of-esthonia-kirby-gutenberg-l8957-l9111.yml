  quote: '"what she would carry night and day under her heart"'
  summary: The passage consists chiefly of notes. The main narrative abstract describes
    a woman whose lost cow and enchanted disorientation on a moor lead to a bargain
    with a little white moor-dweller. He returns her home and restores the cow in
    exchange for an ambiguous promise. After she bears a son, the intruder demands
    the promised thing, but she gives him her apron instead, invoking the Trinity,
    and he vanishes with it. Other notes identify or compare motifs such as public
    feasts, magical weapons, shell boats, sacred trees, mystical numbers, water deity
    Ahti, house-spirit Tont, talking or bleeding trees, and beards as symbols of power,
    age, and wisdom.
