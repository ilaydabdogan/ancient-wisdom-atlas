canonical_text:
  quote: '"Even the depths of the sea restore the treasures which they have stolen"'
  summary: Tiidu, a poor and idle son who plays a willow-pipe, is advised by an old
    man to profit from music. He leaves home, becomes a prosperous flute-player, travels
    deceitfully to wealthy Kungla, loses his treasures in a shipwreck, survives on
    an island, is affected and cured by magical fruit and nuts, deceives the royal
    household to win a reward, returns home, supports his family, marries, and finds
    his lost treasures restored with a note praising care for parents and relatives.
  language: English
  quote_policy: quoted
