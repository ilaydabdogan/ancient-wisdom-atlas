canonical_text:
  quote: ''
  summary: Vanemuine distributes language and song among living beings on the Hill
    of Taara. Natural beings and animals receive different forms of sound; fishes
    fail to hear and remain dumb, while humans learn all notes. Vanemuine sings of
    heaven, earth, Ema, and human joy and sorrow, then ascends to God's abode. His
    song later remains among Estonians, especially in forests, brooks, birdsong, and
    bards' gatherings. At a singing festival, mockery of an old woman's harsh song
    interrupts a holy singer, who vanishes in anger amid fearful sounds; the passage
    identifies this as Vanemuine's last farewell, leaving only a few minstrels able
    to hear him from afar.
  language: English
  quote_policy: summarized
