canonical_text:
  quote: ''
  summary: The God of Song finds a girl child near Lake Endla, seeks divine permission
    to take her as his own, and she grows into Jutta under divine protection. She
    is taught speech, receives a silver-threaded veil made by Ilmarine that makes
    spoken or remembered things appear visibly, guides migratory birds, mourns her
    beloved Endla by the lake, and lends the veil to mortals so that old songs and
    legends become living. The narrator then turns to water nature-spirits among Finns
    and Esthonians.
  language: English
  quote_policy: summarized
