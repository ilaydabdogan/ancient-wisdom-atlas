  quote: ''
  summary: A drunkard's wife is weaving with her child on her lap when her husband
    comes home, destroys the loom, kills the child, and beats her senseless. Ukko
    takes pity on her and changes her into a swallow. As she escapes, the man strikes
    with a knife and cleaves her tail; since then she twitters her misfortunes and
    nests against human houses.
