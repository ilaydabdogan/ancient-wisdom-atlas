canonical_text:
  quote: ''
  summary: After a year of mourning his lost betrothed, the prince returns to the
    bridge where she disappeared and hears an unseen voice singing that she sank in
    the flood under her mother’s curse. He notices only a water-lily on the water.
    He visits the gold-spinning sisters in the forest, who infer that their mother’s
    witch’s coil transformed their sister into the flower. The eldest sister gives
    the prince a pie made with magic herbs; after eating it, he dreams he can understand
    birds. She tells him the herbs will let him understand the wise speech of birds
    on his return journey, and asks him not to forget the sisters’ own captivity at
    the spinning-wheel.
  language: English
  quote_policy: summarized
