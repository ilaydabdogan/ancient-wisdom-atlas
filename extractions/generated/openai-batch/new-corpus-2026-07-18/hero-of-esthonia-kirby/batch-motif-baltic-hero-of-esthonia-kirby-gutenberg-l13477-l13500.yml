  quote: ''
  summary: During a great war, the people of Kertell store their gold and silver in
    an iron chest and sink it in a river near an old bridge, but die without recovering
    it. Years later, a passer-by sees a small flame, loses his pipe on a stone, and
    finds money there instead, with more money appearing on later visits. A magician
    prescribes three Thursday visits, cock sacrifice, and secrecy for raising the
    treasure. On the third Thursday, after the cock is sacrificed, the chest rises
    and is dragged toward shore, but a party member cries out on seeing a little boy
    riding a pig over the bridge; the figures vanish, the ropes and stakes fail, and
    the chest sinks irrecoverably.
