canonical_text:
  quote: '"Let the man become a crayfish."'
  summary: A prince transforms into a crayfish to uproot a water-lily from the riverbed,
    restores the lily as a maiden, returns to human form, receives clothing and a
    chariot, and marries her. Later, a magpie rebukes him for neglecting two girls
    who helped him, reveals that they are captives of a witch and must spin gold thread,
    and the prince and his wife plan to aid them after the wife reports a dream.
  language: English
  quote_policy: quoted
