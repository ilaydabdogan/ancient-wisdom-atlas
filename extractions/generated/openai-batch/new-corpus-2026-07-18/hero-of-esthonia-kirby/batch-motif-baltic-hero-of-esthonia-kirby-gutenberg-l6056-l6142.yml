  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After drifting with the current, the crayfish reaches the area of a rowan-tree
    on the left bank and a nearby rock, then speaks a command for the water-lily to
    become a maiden and the crayfish a man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The youth and maiden are carried to the bank by the water and are naked; the
    maiden hides under the rowan-tree while the prince goes to find his horse and
    clothes.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The prince cannot find his horse or clothes and does not realize that he spent
    many days as a crayfish.
  category: sequence
  evidence_refs:
  - ev:4
