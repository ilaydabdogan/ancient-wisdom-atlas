  quote: the spirit of his dead father should follow him throughout his life
  summary: At twilight the youngest son climbs his father's cairn while grieving.
    His dead father speaks from below the grave but says he cannot rise because his
    body has decayed. The father reassures the son that his spirit will follow him,
    that good gods will protect him even through ocean wastes, and that the son should
    atone for faults and errors.
