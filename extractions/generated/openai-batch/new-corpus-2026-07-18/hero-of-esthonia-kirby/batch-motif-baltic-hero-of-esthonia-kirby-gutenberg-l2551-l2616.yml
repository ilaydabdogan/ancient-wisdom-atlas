canonical_text:
  quote: ''
  summary: The Kalevide encounters companions and a small boy associated with an unpaid
    promise of silver, takes over a contest, and defeats a demon in stone-throwing
    and wrestling. He then sends his cousin to Finland to settle a smith-debt, rests
    under a tree, and plans to fortify towns during war. On his journey he finds the
    Air-Maiden weeping at a lonely well because her ring has fallen in; he dives in
    to recover it. Young sorcerers throw a millstone after him, but he emerges with
    the millstone on his finger and offers it to the maiden as an oversized ring.
  language: English
  quote_policy: summarized
