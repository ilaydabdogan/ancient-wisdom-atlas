canonical_text:
  quote: ''
  summary: A brief tale of a deceptive magic egg is followed by an introduction to
    Estonian lake legends. One lake is said to stand where a castle sank after an
    attempted sibling marriage. The Lake Peipus tale begins with King Karkus, his
    childlessness, the divinely granted birth of twins, the death of the son through
    hostile powers, and the abduction of the daughter Rannapuura by the witch Peipa.
    The white gods send a dove with gifts and ordered instructions for Rannapuura's
    escape.
  language: English
  quote_policy: summarized
