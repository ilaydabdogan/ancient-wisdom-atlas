  summary: A royal maiden appears to Pärtel and says she has been enchanted into a
    white snake under a stone for centuries. She asks him to return at sunset and
    endure her coiling round him and kissing him three times without shrinking. Pärtel
    uses his lucky egg during the encounter, stands firm, collapses after thunder
    and lightning, and awakens after the enchantment is broken; the maiden offers
    him her kingdom, palace, treasures, and herself as bride.
