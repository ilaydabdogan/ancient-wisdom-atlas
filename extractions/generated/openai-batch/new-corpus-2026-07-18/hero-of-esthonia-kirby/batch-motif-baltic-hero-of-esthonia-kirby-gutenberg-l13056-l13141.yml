canonical_text:
  quote: ''
  summary: A bold barn-keeper enters an underground ruin at night, encounters a black
    cat with fiery eyes, chooses the seventh of twelve doors, cooks porridge in a
    hidden room, receives a coffin carried by four white-coated men, revives a little
    old man from the coffin, and is led through a trap-door into a deep cavern containing
    a large heap of gold and silver that he must divide exactly within three days.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The barn-keeper travels in darkness with a light, finds a low hole at the
    foot of a wall, clears it, crawls through, descends stone stairs, and reaches
    an iron door.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A large black cat with fiery eyes rushes through the iron door and up the
    stairs when the barn-keeper opens it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Behind the iron door is a wide hall with twelve doors in the walls.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The barn-keeper says seven is a lucky number and tries the seventh door, breaking
    its rusty lock by pushing hard.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the room behind the seventh door, the barn-keeper lights a fire, finds
    flour, salt, a pot, and a cup, and cooks porridge with water from his flask.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The black cat appears on the stove although the barn-keeper had earlier seen
