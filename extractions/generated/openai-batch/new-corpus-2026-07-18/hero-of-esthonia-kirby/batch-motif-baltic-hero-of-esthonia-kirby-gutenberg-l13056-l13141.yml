    and mouth, and four tall men enter carrying a bier and coffin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The four men are silent, set the coffin down, leave, and close the door behind
    them while the cat whines and scratches outside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The barn-keeper opens the coffin, finds a little man with a long white beard,
    carries him to the fire, warms him, and feeds him porridge until he revives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The old man thanks the barn-keeper, promises a princely reward, and warns
    that the furious cat must be kept out because it may break the barn-keeper's neck.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: The old man raises a square trap-door in the floor, revealing steps down into
    a cellar, and leads the barn-keeper into a very deep arched cavern.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The cavern contains an enormous heap of money, half silver and half gold,
