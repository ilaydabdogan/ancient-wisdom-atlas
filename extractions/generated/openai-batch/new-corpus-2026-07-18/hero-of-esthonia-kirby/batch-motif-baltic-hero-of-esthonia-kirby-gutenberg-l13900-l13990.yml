canonical_text:
  quote: ''
  summary: A maiden houses a young man in luxury, offers marriage and wealth, and
    later reveals a golden ring kept in a casket. She asks for three drops of blood
    from his left little finger in exchange for the ring and a lasting bond. The youth
    remembers warnings not to give blood, fears his soul is at stake, and tries to
    learn the ring's powers while concealing his alarm. The ring is said to grant
    flight, invisibility, invulnerability, creative power, and strength according
    to which finger bears it, and it is associated with King Solomon, secret inscriptions,
    and possible angelic origin. The youth plans to acquire the ring by craft.
  language: English
  quote_policy: summarized
