  summary: Pärtel remains apart from the world with his bride until death; the community
    searches for him and finds that Pärtel, the lime-tree, the stone, and the nearby
    spring have vanished or dried up. The passage then summarizes several other Kreutzwald
    tales in which young adventurers go into the world, receive aid from powerful
    protectors, disenchant royal figures, confront serpents or magic, and marry royal
    partners.
