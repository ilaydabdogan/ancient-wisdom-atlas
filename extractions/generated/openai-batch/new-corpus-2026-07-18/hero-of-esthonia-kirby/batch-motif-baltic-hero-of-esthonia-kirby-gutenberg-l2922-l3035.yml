canonical_text:
  quote: ''
  summary: The Kalevide continues homeward, learns he has lost seven weeks in a magic
    sleep, meets a witch, and reaches a cavern with a fire, caldron, and demonic attendants.
    He enters the cavern, reaches a chamber with two magical liquids and captive maidens,
    uses the dark liquid for strength, breaks down the doors, and is shown a sword,
    a willow wand, and a wish-fulfilling hat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kalevide is on a homeward journey, sleeps at the place where his sword
    had been stolen, and is told by a magpie that a sorcerer had held him in a magic
    sleep for seven weeks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lake Ilma is too deep for the Kalevide to wade through, forcing him to go
    around it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old witch related to the harmful sorcerer sits among bushes and sings magic
    songs, including a long charm against snake-bites.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kalevide breaks down trees to make himself a couch and later turns toward
    Lake Endla.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Near evening he comes to a cavern entrance where a great fire burns, a huge
    caldron hangs by iron chains, and three fellows stand nearby.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The three fellows describe the contents of the caldron and say Sarvik, the
    old mother, household animals, cooks, and workmen are to receive portions.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the Kalevide asks the way to their master's house, the fellows warn that
    he may not escape easily; after he enters, they laugh and describe him as caught
    in a trap.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Inside the cavern the passage is dark and narrow, forcing the Kalevide to
    creep and grope until he sees a faint light and reaches a larger space.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'In the larger cavern space there is a hanging lamp, great folding-doors,
    and two jars: one with a white liquid and one with a black liquid.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Behind the doors, maidens spin and sing, lament their former happiness, and
    hope for a deliverer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The maidens tell the Kalevide that dipping his hands in the dark liquid will
    give magic strength, while the white liquid will moderate the strength or remove
    enchantment.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Kalevide dips his hands in the dark liquid, feels his strength redoubled,
    and breaks down the door and door-posts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the doors fall, the maidens flee and tell him not to approach until
    he has dipped his hands in the white liquid.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the next room the Kalevide sees a naked sword, a small willow wand, and
    a ragged old hat hanging on the wall.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: One maiden warns him not to touch the sword because it belongs to Sarvik,
    but says the rod and hat are his and can work wonders.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: The Kalevide rejects the wishing-rod and cap as fit only for witches and wizards;
    the maiden then displays the hat, says it is made from fingernail cuttings, and
    says it can fulfill every desire.
  category: sequence
  evidence_refs:
  - ev:10
