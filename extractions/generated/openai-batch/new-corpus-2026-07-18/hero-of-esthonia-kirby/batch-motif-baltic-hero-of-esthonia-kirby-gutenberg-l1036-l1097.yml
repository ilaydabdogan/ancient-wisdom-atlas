canonical_text:
  quote: ''
  summary: Canto summaries describe the Kalevide's conflicts with Sarvik, escape with
    three sisters, pursuit by demons stopped by a flood, a voyage to the end of the
    world in the ship Lennuk, battles and encounters, entry through the gates and
    cavern of Põrgu, defeat and chaining of Sarvik, return to the upper world, later
    battles and abdication, maiming by his own sword in a brook, the flight of his
    soul to the halls of Taara, divine command to reanimate his body, and his final
    station as mounted guardian at the gates of Põrgu.
  language: English
  quote_policy: summarized
