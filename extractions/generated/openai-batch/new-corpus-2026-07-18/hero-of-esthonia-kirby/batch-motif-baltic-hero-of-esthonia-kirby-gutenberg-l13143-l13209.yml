canonical_text:
  quote: ''
  summary: A barn-keeper completes the exact division of a treasure by splitting a
    remaining silver coin. The old man guarding the treasure rejoices, says he has
    been released from centuries of oath-bound captivity, rewards the barn-keeper,
    commands that part of the money be given to the poor, and gives him a golden noose
    for a black cat. The old man vanishes; the barn-keeper returns through darkness,
    relights the hearth fire, finds the black cat in the coffin, hangs it with the
    golden chain, and later removes and distributes the treasure as instructed.
  language: English
  quote_policy: summarized
