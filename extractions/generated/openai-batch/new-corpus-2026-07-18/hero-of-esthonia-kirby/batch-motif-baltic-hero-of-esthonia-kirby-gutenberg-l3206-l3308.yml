canonical_text:
  quote: ''
  summary: In Sarvik's underground abode, captive sisters warn the Kalevide that entry
    is deadly and escape will become impossible. The sisters advise use of magic objects,
    secretly switch strength and weakness drinks, and secure a wishing-rod. Sarvik
    returns, drinks the weakening liquor, and wrestles the Kalevide. The Kalevide
    uses the wishing-hat to regain size and strength, drives Sarvik into the ground,
    but Sarvik shrinks and sinks away. The Kalevide takes treasure and a sword, carries
    the three sisters to the entrance gate by means of the hat, then rekindles a fire
    and burns the hat.
  language: English
  quote_policy: summarized
