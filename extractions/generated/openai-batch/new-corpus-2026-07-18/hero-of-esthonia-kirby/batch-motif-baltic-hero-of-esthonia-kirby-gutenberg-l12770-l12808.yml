canonical_text:
  quote: ''
  summary: 'The passage summarizes several Estonian tales of dealings with the Devil:
    a Devil coach with black stallions; a bath-house encounter in which a charitable
    orphan avoids being taken by following a mouse''s advice until cockcrow, while
    an envious daughter is carried away; a farmer aided and tempted by the Devil loses
    treasure after invoking God at a ford; and a peasant frightens away an imp by
    invoking the Trinity. The narrator then frames following stories as black-magic
    tales and compares the first to vampyrism.'
  language: English
  quote_policy: summarized
