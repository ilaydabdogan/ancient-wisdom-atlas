  text: A magician whom Linda had discarded tells his friends not to seek a wife in
    Kalev's house and directs them instead toward maidens in Finland.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The youngest son of Kalev sits on a cliff watching clouds and waves when a
