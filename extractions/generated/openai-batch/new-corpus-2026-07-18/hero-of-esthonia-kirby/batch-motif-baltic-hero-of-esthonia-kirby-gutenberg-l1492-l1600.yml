canonical_text:
  quote: ''
  summary: After Linda rejects a magician, he discourages others from seeking her.
    In the next canto, Kalev's youngest son helps the Thunder-God against demons during
    a storm, and the sons of Kalev later perform a prodigious hunt. While the sons
    are away, the Finnish sorcerer attempts to abduct Linda from Kalev's house. Linda
    calls to the gods; Pikker strikes the sorcerer, and the gods transform Linda into
    a rock on Mount Iru. The sons then pass through named forests, where two brothers
    sing songs that cause trees, flowers, crops, and fruits to flourish, moving distant
    listeners to tears.
  language: English
  quote_policy: summarized
