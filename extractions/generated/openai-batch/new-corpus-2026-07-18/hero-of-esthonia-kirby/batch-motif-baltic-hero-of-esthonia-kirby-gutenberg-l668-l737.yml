  text: Pastor Jacob Hurt and his coadjutors are described as having formed enormous
    collections of Esthonian folklore.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three volumes of the collections were edited by Hurt under the title Vana
    Kannel, translated as the Old Harp; an 1888 appeal brought new contributions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hurt is reported to have received contributions from 633 folk-tale collectors
    over three and a half years, most of them peasants or schoolmasters.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The collection totals are given as more than 20,000 epics, lyrics, wedding-songs,
    and related items; about 3000 tales; about 18,000 proverbs; about 20,000 riddles;
    and additional magical formulae and superstitions.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says that many tales and songs are variants and that many relate
    to legends belonging rather to the Kalevala than to the Kalevipoeg.
  category: relationship
  evidence_refs:
  - ev:5
