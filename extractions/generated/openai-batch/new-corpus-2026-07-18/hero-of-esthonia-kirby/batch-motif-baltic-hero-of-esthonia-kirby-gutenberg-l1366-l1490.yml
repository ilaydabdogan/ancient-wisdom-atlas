canonical_text:
  quote: ''
  summary: Kalev grows old, foretells the future greatness of his unborn youngest
    son, and dies despite Linda's attempt to summon magical aid. Linda prepares and
    buries his body, builds a cairn over the tomb, and her tears form a lake. She
    later gives birth to Kalev's posthumous son with divine aid; the child shows extraordinary
    strength and grows into a powerful youth. After Kalev's death, suitors seek Linda,
    and a wind-sorcerer from Finland vows revenge when refused.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kalev and Linda live happily together and have many children, most of whom
    leave home to seek their fortunes because Kalev has decided only one son will
    inherit his possessions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: As Kalev ages and senses his approaching death, he tells Linda that their
    still-unborn youngest son, Sohni or the Son of Kalev, will be glorious, great,
    and his heir.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Linda spins her brooch on a thread and sends the Alder-Beetle to summon the
    Wind-Magician and Soothsayer to Kalev's sickbed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Alder-Beetle makes repeated long journeys and encounters the Moon, the
    Evening Star, and the rising Sun, each of whom gives no helpful answer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: On a fourth journey the Alder-Beetle reaches the Wind-Magician, the old Soothsayer
    from Finland, and the great Necromancer; they answer that what has been parched,
    blanched, and withered cannot bloom again, and Kalev dies before the beetle returns.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Linda mourns by Kalev's bedside for seven days and nights, bathes the corpse
    with tears and several kinds of water, grooms it with a silver brush and golden
    comb, dresses it, and digs a deep grave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Grass, herbs, and flowers are described as springing from Kalev's grave and
    from parts of his dead body.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Linda mourns for months, heaps stones into a cairn over Kalev's tomb, drops
    one heavy stone when she becomes weak, and her tears form the Upper Lake.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: When Linda's childbirth approaches, she retires to the bathroom, calls on
    the gods, and Ukko and Rõugutaja attend her and prepare a bed before Kalev's posthumous
    son is born.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The infant son screams continuously for a month, bursts his swaddling-clothes,
    smashes the cradle, and begins to creep on the floor.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The child is suckled until he is three years old, learns to tend cattle and
    guide the plough, grows strong, and performs oversized play-feats with blocks
    and huge rocks.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: After Kalev's death, suitors seek to marry Linda; she refuses them, and a
    final wind-sorcerer from Finland vows revenge, while Linda says three young eagles
    in the house will protect their mother.
  category: sequence
  evidence_refs:
  - ev:10
