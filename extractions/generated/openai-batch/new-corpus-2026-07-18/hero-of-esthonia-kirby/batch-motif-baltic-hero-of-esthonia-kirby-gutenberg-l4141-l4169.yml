  summary: The passage closes the Kalevipoeg section and introduces Part II on Esthonian
    folk-tales. It states that Esthonian tales are numerous, that some resemble widely
    distributed tales while others are distinctive, that visible foreign elements
    appear Scandinavian or German, and that Esthonian tales show little Russian influence.
    It also notes Christian-origin names in many heathenish tales and suggests that
    the Gospel of Nicodemus may have influenced the name Nicodemus for Slyboots because
    it describes a descent into hell.
