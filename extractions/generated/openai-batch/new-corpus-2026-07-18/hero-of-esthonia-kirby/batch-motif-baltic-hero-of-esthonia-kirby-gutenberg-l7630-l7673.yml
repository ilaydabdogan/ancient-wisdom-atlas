  quote: ''
  summary: After wedding festivities, the young king consults judges about punishment
    for the person who stole the king's son and caused him to be raised as a peasant
    herd-boy. The queen-dowager is brought to trial, pleads for mercy, and is spared
    execution but banished from the kingdom. The king allows her innocent daughters
    to remain, rewards his bride's parents and foster-father with houses, and lives
    and rules happily with his low-born bride. The passage then introduces the following
    story of Tiidu the Flute-player, noting a mysterious old man and a cosmopolitan
    Nose-tree incident.
