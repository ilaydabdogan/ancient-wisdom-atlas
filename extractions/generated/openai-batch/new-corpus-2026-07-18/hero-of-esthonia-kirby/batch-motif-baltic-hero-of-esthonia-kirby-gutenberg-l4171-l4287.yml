canonical_text:
  quote: ''
  summary: The passage introduces Esthonian tales and then narrates the tale of Lindu,
    daughter of Uko and guardian of migrating birds. Celestial suitors seek her; she
    rejects the North Star, Moon, and Sun, but accepts the Northern Light. After the
    Northern Light delays returning for the wedding, Lindu grieves, and her tears
    become brooks while the birds lose guidance. Uko orders the winds to lift her
    to heaven. There her bridal veil stretches across the sky as the Milky Way, she
    resumes directing birds, and the Northern Light visits her in winter, though their
    wedding cannot be completed.
  language: English
  quote_policy: summarized
