  quote: ''
  summary: Sleepy Tony encounters a mermaid on the shore after sunset. She says she
    has expected him, has protected him before, and invites him to live with her.
    He hesitates and asks for three days; she gives him a gold ring as a pledge. After
    suffering in her absence, he accepts her offer. She blindfolds him, he is carried
    by strong arms into the sea, loses consciousness, and later awakens.
