canonical_text:
  quote: ''
  summary: A poor brother whose rye is destroyed by personified Frost seeks redress.
    Frost gives him a self-opening knapsack that supplies food and drink. The rich
    brother covets and obtains it, leaving the poor brother again in need. Frost then
    gives the poor brother a second, handsome knapsack that releases cudgel-bearing
    men who beat its opener. The poor brother exchanges this punitive sack with the
    rich brother; the rich brother and his feast guests are beaten, while the poor
    brother keeps the food-giving sack. Editorial notes compare versions of the tale
    across Europe and introduce the next tale, in which a soldier begins to carry
    the Devil through town in a knapsack.
  language: English
  quote_policy: summarized
