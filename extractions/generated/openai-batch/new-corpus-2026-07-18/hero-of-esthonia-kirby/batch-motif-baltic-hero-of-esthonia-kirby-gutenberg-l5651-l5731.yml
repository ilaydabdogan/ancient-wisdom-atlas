canonical_text:
  quote: ''
  summary: After a prince leaves the youngest daughter, searchers from the city eventually
    trace him toward the cottage. The prince has privately promised the maiden that
    he will return and make her his bride. The maiden discovers that her gold thread
    has broken and lost its lustre. Her mother detects that something has happened,
    questions the daughters, curses, and threatens to kill the young man if he returns.
    The youngest daughter, who knows the language of birds, asks a raven to carry
    a warning to the prince. Her mother then forbids her from spinning and sets her
    to winding thread under continual scolding.
  language: English
  quote_policy: summarized
