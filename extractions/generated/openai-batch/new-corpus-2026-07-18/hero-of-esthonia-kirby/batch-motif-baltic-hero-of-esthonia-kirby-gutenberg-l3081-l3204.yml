  quote: "“vast space in the centre of the earth where he rules over seven worlds”"
  summary: The Kalevide is shown through Sarvik's palace by three sisters. They pass
    through chambers and galleries of stone, iron, copper, silver, gold, silk, satin,
    and lace, as well as an enclosure with storehouses, barns, and bone cattle-stalls.
    The sisters describe Sarvik's severe rule over a subterranean realm of seven worlds
    or islands populated by the departed, the annual return of souls on All Souls'
    Day, and the forced labor and punishment of Sarvik's servants.
  language: English
  quote_policy: quoted
