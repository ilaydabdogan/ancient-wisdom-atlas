canonical_text:
  quote: ''
  summary: The passage contains a brief fable in which flies attack a cart-horse and
    are crushed when it rolls, followed by the ballad “The Herald of War,” where an
    envoy carrying a war mandate encounters birds, beasts, Famine, and Plague, all
    drawn by the scent of war and blood. The envoy halts, reflects on the harm of
    war, and sinks the mandate in the ocean so the battle-news is lost.
  language: English
  quote_policy: summarized
