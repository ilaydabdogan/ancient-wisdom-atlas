canonical_text:
  quote: ''
  summary: After failing to find further traces of his mother, Kalevide swims north
    toward Finland, rests on a rocky island, and encounters a maiden by a fire under
    an oak. After learning his lineage, the maiden is terrified and falls from a cliff
    into the sea. Kalevide searches for her unsuccessfully and departs. Her parents
    search the sea bottom with a rake and net, recovering unusual objects. A song
    from the deep describes the maiden seeing shining weapons beneath the sea and
    meeting an aged copper man who guards the weapons of the sons of Kalev, Alev,
    and Sulev.
  language: English
  quote_policy: summarized
