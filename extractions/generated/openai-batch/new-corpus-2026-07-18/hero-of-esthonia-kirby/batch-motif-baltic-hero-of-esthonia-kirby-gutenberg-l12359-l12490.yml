canonical_text:
  quote: ''
  summary: A ruined young farmer consults Michel, an old wanderer reputed to be a
    wizard. Michel explains how to make and animate a Kratt, a secret constructed
    familiar that brings wealth but entails selling one’s soul to the devil. He also
    describes ways a master might try to escape the familiar, a failed impossible-task
    example, and the need to feed the familiar. The passage ends with the farmer asking
    for the words and Michel asking what payment he will receive.
  language: English
  quote_policy: summarized
