- id: obs:3
  text: The farmer asks Michel for help, and Michel offers a way to become rich if
    the farmer has courage, can face darkness, and can keep silent.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Michel says a Kratt can be made secretly from a broomstick, a broken jug,
