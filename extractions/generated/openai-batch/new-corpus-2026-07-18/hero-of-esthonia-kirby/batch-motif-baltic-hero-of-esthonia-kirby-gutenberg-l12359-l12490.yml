  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Michel says the creature must be set up on three Thursday evenings at a cross-road
    and animated with taught words; on the third Thursday it comes to life.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Michel says the living creature becomes the maker’s servant, is visible only
    to its master, and can bring money, corn, and hay in loads no larger than a man’s
