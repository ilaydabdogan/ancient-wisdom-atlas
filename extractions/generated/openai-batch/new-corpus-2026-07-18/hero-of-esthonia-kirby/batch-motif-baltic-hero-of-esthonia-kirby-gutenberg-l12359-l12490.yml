- id: obs:1
  text: A young farmer’s crops, hay, and cattle have failed, leaving him unable to
    meet lawful obligations to his feudal superior.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Michel is an old wandering man with a bad reputation; people say he is a wizard
