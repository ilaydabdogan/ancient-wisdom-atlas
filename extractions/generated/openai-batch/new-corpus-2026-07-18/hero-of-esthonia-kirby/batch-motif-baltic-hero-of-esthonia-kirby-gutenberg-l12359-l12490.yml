  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Michel describes an attempted release in which a familiar is ordered to fill
    a barrel with water using a sieve, but the familiar completes the task by using
    drops from the sieve.
  category: sequence
  evidence_refs:
  - ev:8
