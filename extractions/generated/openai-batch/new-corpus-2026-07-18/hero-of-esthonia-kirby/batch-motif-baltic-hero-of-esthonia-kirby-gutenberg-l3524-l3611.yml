canonical_text:
  quote: ''
  summary: 'During the Kalevide''s voyage, a companion is lost near a volcanic region
    and a bird reports that he has gone beyond snow-mountains to live with water-nymphs.
    The voyagers enter strange northern lands: one with metal-eating birds and giant
    vegetation, where a giant''s daughter carries the men in her apron and a giant
    tests them with riddles; another where Northern Lights spirits fight in the sky;
    and another inhabited by dog-tailed half-men, where the Kalevide fights, repents
    after destroying land, prays to Ukko for compensation, and makes peace. A wise
    man tells him the raven sent him on an idle quest to the gates of Põrgu, and the
    Kalevide turns home toward Lindanisa.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The son of Sulev travels through ashes, snowfields, and red-hot stones to
    the mouth of a volcano; his coat catches fire, his hair and eyebrows are singed,
    and he returns scorched to the ship.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kalevide asks whether the son of Sulev has seen the cupbearer who had
    followed him, but the son of Sulev has not seen him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A white bird perches on the ship, and the wise Finn, who knows animal language,
    asks it about the missing boy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The white bird says the boy has gone to a beautiful country behind the snow-mountains,
    is with water-nymphs, will not return, and the ship should continue.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The voyagers reach a country where birds feed on gold, silver, and copper,
    and where herbage grows as high as pine-trees.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Kalevide sends part of the crew ashore under the magician's guidance,
    while the Kalevide and the Sulevide sleep on deck and the Alevide keeps watch.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The ship's company sleeps under a bush; a giant's little daughter finds them,
    puts them in her apron, carries them home, and describes them to her father as
    flea-like beings found in a cabbage.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The giant tests the strangers with riddles, and the magician answers them
    as the bee, the rainbow, and the rain.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the riddle answers, the giant tells his daughter to return the men;
    at the wise man's request she takes them to the ship, shakes them onto the deck,
    and blows the ship four miles out to sea.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Farther north, intense cold appears, and spirits of the Northern Lights fight
    in the air with silver spears and golden shields; the sailors are frightened,
    while the Kalevide is pleased by their use for directing the course after leaving
    the sun and moon behind.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: On an unknown shore, inhabitants described as half men and half dogs with
    long dog tails and great clubs confront the voyagers, and the Kalevide springs
    ashore to fight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The horse mounted by the Kalevide soon dies under him, after which he uproots
    an oak and lays the country waste.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The wisest man of the country admonishes the Kalevide; the Kalevide repents,
    prays to Ukko to send fish to replace the destroyed ground, and peace is concluded.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The wise man tells the Kalevide that the raven sent him on an idle quest to
