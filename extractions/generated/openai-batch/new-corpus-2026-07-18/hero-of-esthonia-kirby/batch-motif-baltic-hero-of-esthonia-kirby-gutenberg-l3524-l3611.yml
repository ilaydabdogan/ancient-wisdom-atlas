candidate_motifs:
- id: motif:1
  label: Voyage quest to the gates of Põrgu and return home
  taxonomy_refs:
  - mystical_quest
  - return
  basis: The passage frames the northern voyage as a quest sent by the raven to the
    gates of Põrgu, then has the Kalevide decide to return home.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage says the quest was idle and does not narrate an actual entry
    through the gates of Põrgu.
- id: motif:2
  label: Animal messenger reports a lost companion's otherworldly dwelling
  taxonomy_refs: []
  basis: A white bird communicates, through the wise Finn's animal-language knowledge,
    that the missing cupbearer is in a beautiful country behind snow-mountains with
    water-nymphs and will not return.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage reports the boy's location but does not show the journey there
    directly.
- id: motif:3
  label: Giant's riddle test of strangers
  taxonomy_refs:
  - wisdom
  basis: The giant tests the strangers with riddles, and the magician's correct answers
    please him and lead to the men's return.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: Only a short riddle exchange is included; no explicit wager or punishment
    is stated.
- id: motif:4
  label: Tiny humans carried by a giant maiden
  taxonomy_refs: []
  basis: The giant's daughter finds the sleeping men, compares them to fleas, carries
    them in her apron, and later returns them to the ship.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents the contrast of scale literally but gives no broader
    explanation of the giant society.
- id: motif:5
  label: Celestial battle as northern navigation sign
  taxonomy_refs: []
  basis: The Northern Lights are described as spirits fighting in the air, and the
    Kalevide is pleased because they can guide the course after the sun and moon have
    been left behind.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage links the spectacle to navigation, but it does not define
    a formal quest stage.
- id: motif:6
  label: Heroic violence followed by repentance and reparative prayer
  taxonomy_refs: []
  basis: After devastating the land of the half-men half-dogs, the Kalevide is admonished,
    repents, prays to Ukko to send fish in compensation, and peace follows.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The compensatory result is requested in prayer, but the passage does not
    explicitly narrate the arrival of fish.
