canonical_text:
  quote: ''
  summary: A prince and soldiers rescue maidens from a cottage in the wood. Hemlock
    is prepared for the old woman, who later eats it and dies. A captain finds golden
    thread in a secret chamber, and a fiery-eyed cat appears during the burning or
    destruction of the house. A bird instructs the men to trap the cat, who then speaks
    and confesses that she was once a royal housekeeper who helped the old woman steal
    a king’s three daughters and treasure. The cat is executed by fire. The elder
    princesses later marry kings’ sons, receive dowries from the golden thread, but
    never find their parents or birthplace.
  language: English
