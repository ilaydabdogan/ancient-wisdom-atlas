canonical_text:
  quote: ''
  summary: Slyboots returns to the king and learns that his elder brothers inherited
    his reward because he was thought dead; his brief stay in a subterranean dwelling
    has equaled years outside. Reduced to kitchen work, he tells of under-world birds
    with gold and silver plumage. His brothers prompt the king to send him after those
    birds and later after gold and silver vessels. A grey-bearded old man repeatedly
    gives him magical shells, instructions, and stones, enabling him to cross by a
    wand-made bridge, enter the under-world while its inhabitants are asleep or occupied,
    and carry off the birds and vessels.
  language: English
  quote_policy: summarized
