canonical_text:
  quote: ''
  summary: At daybreak the Kalevide reaches the Finnish coast after the sorcerer and
    falls asleep. Elsewhere, the islander and his wife mourn their missing daughter,
    plant trees, tend an egg, release a fish, and encounter a sky-reaching oak, an
    eagle, and a tiny axe-bearing man. The Kalevide later wakes, searches for his
    mother and the sorcerer, finds the sorcerer’s farm, defeats a magically conjured
    host, kills the sorcerer, fails to find his mother, and has a vision that convinces
    him she is dead.
  language: English
  quote_policy: summarized
