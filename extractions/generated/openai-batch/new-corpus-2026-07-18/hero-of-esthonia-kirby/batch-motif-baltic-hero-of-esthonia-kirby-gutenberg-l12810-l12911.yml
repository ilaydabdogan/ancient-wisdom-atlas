candidate_motifs:
- id: motif:1
  label: Living person mistaken for dead and traveling with a revenant
  taxonomy_refs:
  - trickster_boundary
  basis: Martin is addressed as dead by the deceased master, follows him, and survives
    by maintaining the false identity.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The taxonomy reference is broad; the passage presents deception at the
    life-death boundary but does not name a formal trickster figure.
- id: motif:2
  label: Frozen object used to counterfeit the coldness of death
  taxonomy_refs: []
  basis: Martin uses a frozen glove as his hand when the dead master tests whether
    he is dead.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No supplied taxonomy category directly matches this object-use motif.
- id: motif:3
  label: Cockcrow ends or constrains nocturnal supernatural activity
  taxonomy_refs: []
  basis: The dead master must return before the cocks crow, and the animated dead
    horse collapses when the cock crows.
  evidence_refs:
  - ev:4
  - ev:11
  confidence: high
  cautions: The passage states the timing effect but does not elaborate a cosmological
    explanation.
- id: motif:4
  label: Laying a dead being by three left-heel stamps on its grave
  taxonomy_refs:
  - trickster_boundary
  basis: The dead master himself gives the rite; Martin performs it on the master’s
    grave, and the farmer later performs the same action on the dead horse’s grave.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:11
  confidence: high
  cautions: The taxonomy reference is used for a boundary-controlling act; the exact
    rite is more specific than the available taxonomy.
- id: motif:5
  label: Dead owner reveals hidden treasure and the means to stop his haunting
  taxonomy_refs:
  - forbidden_knowledge
  basis: The dead master discloses both the hidden money’s location and the grave-binding
    procedure to Martin, not knowing Martin is alive.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The knowledge is dangerous and concealed, but the passage does not explicitly
    call it forbidden.
- id: motif:6
  label: Blood-sealed bargain for a magic bullet
  taxonomy_refs:
  - sacred_exchange
  basis: The hunter sells himself to the Devil with three drops of blood in exchange
    for a magic bullet.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The supernatural counterparty is demonic rather than sacred in a narrow
    sense; the taxonomy reference is applied as supernatural exchange.
- id: motif:7
  label: Violation of supernatural condition after drinking brings death or disappearance
  taxonomy_refs: []
  basis: The hunter drinks and violates the shooting condition, dying afterward; the
    nobleman drinks, reveals his secret, and disappears.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: The two episodes have different supernatural contracts and punishments.
- id: motif:8
  label: Oath-bound hidden workers with a supernatural enforcer
  taxonomy_refs:
  - forbidden_knowledge
  basis: The coiners in the vaults bind the nobleman by an oath of secrecy and warn
    that the dog will fetch him if he breaks it.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage summarizes rather than fully narrates the tale.
- id: motif:9
  label: Animated dead animal active by night and neutralized by cockcrow and burial
    rite
  taxonomy_refs: []
  basis: The dead horse enters the barn at night, collapses at cockcrow, and remains
    quiet after burial and three left-heel stamps on the grave.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: This is an animated corpse motif, not necessarily a full resurrection
    in the supplied taxonomy sense.
comparison_claims:
- id: claim:1
  claim: The passage presents the Estonian “Hunter’s Lost Luck” as an example of the
    free-shooter motif also known in Germany.
  claim_level: same_motif
  target: German free-shooter stories
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage explicitly mentions German free-shooters but gives no detailed
    German comparison beyond the motif label.
- id: claim:2
  claim: 'The Martin story and the bewitched-horse story use the same grave-stamping
    action for the same function: keeping a dead or animated being quiet in its grave.'
  claim_level: same_function
  target: Three left-heel grave-stamping in “Martin and His Dead Master” and “The
    Bewitched Horse”
  evidence_refs:
  - ev:4
  - ev:5
  - ev:11
  counter_evidence_refs: []
