canonical_text:
  quote: ''
  summary: The supplied passage tells of Martin, who sleeps in a church and is mistaken
    for dead by his deceased former master. Martin follows the spectre to the mansion,
    survives by tricking him with a frozen glove, learns where the hidden treasure
    is and how to keep the dead man in his grave, then uses the rite and later marries
    the lady. The passage then summarizes related Estonian tales involving a hunter’s
    pact with the Devil for a magic bullet, haunted coiners bound by secrecy, and
    a dead horse that moves by night until subdued by cockcrow and grave-stamping.
  language: English
  quote_policy: summarized
