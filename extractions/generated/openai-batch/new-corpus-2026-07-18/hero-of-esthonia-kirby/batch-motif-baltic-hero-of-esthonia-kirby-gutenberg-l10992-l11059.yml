canonical_text:
  quote: ''
  summary: The passage closes a tale in which a queen explains hidden bride substitutions,
    reveals her twelve daughters, rewards their foster-parents, and condemns a greedy
    chained son-in-law to view untouchable gold for seven hundred years. A thunderous
    upheaval follows, leaving the witnesses in the wood where a glass palace had become
    a spring. The passage then summarizes a tale of a water-spirit at Lake Peipus
    who gives four boys gifts that shape their adult callings, and begins another
    tale in which a water-god under lake ice keeps a father below the water, sends
    the boy home with silver, and is later suggested by cracking ice.
  language: English
  quote_policy: summarized
