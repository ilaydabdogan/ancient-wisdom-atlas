canonical_text:
  quote: ''
  summary: Sleepy Tony returns to his village and family farm, but all the people
    are strangers. An infirm old man tells him that the farmer he seeks has been dead
    for more than thirty years and that the sons must also be dead. Tony sees his
    aged face reflected in spring water and realizes that the few years he perceived
    in the mermaid's house have consumed most of his life. After wandering on the
    beach, he disappears and his body is later cast ashore by the waves. The mermaid
    thereafter avoids grown people and appears only sometimes to children, often in
    another form. The narrator notes that other stories of the Water-Mother, mermaids,
    and water beings occur later.
  language: English
  quote_policy: summarized
