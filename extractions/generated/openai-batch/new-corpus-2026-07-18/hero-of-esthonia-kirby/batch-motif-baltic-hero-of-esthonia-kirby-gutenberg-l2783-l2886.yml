canonical_text:
  quote: '"Dear son of Kalev, strike them with the edges!"'
  summary: Kalevide is ambushed near a waterfall by the sorcerer's three sons while
    carrying planks. A hidden hedgehog advises him how to use the planks effectively,
    and he repels the attackers. He later clothes the hedgehog but discovers the animal
    has been killed accidentally during the fight, buries it, and falls asleep. The
    sorcerer casts spells that prolong Kalevide's sleep. During the sleep, Kalevide
    dreams of a superior sword forged by Ilmarine's pupils in an underground smithy
    within a mountain at the earth's middle point, but an accuser appears and a nightmare
    prevents Kalevide from speaking. He wakes after seven weeks, unaware of the duration,
    and decides to fetch new planks.
  language: English
  quote_policy: quoted
