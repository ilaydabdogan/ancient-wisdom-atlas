canonical_text:
  quote: ''
  summary: The passage tells of a poor brother who gives three pike to his rich brother
    and receives only thanks. A roadside old man takes those thanks and instructs
    him to find Poverty under the stove and throw it into the river; the poor brother
    prospers, while the rich brother later fishes Poverty out and becomes poor. An
    editorial note identifies the tale as a well-known Sclavonic legend and suggests
    a connection with a tale in the Thousand and One Nights. The passage then introduces
    Estonian plague legends in which the masculine Plague appears in human form, travels
    by boat, marks victims, and can be turned away or induced to spare people through
    greeting or help.
  language: English
  quote_policy: summarized
