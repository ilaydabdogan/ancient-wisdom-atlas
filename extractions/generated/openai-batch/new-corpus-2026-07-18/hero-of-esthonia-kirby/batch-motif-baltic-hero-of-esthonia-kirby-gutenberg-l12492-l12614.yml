canonical_text:
  quote: ''
  summary: A poor farmer, following instructions from old Michel, secretly constructs
    a treasure-bringer figure and attempts to animate it at a wooded cross-roads.
    On the third Thursday night he uses three drops of blood and magic words. The
    creature comes to life, but the terrified farmer flees; the creature declares
    the compact broken, says the farmer has sold his soul to the devil without gain,
    and becomes his tormenting demon. The farmer’s property and household fail, Michel
    refuses further help, and the farmer considers destroying the creature as his
    own work of wood and potsherds.
  language: English
  quote_policy: summarized
