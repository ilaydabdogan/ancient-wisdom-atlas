canonical_text:
  quote: ''
  summary: An Estonian version of “The Envious Sisters,” titled “The Prince who rescued
    his Brothers,” is summarized. A sick young king marries a woman whose body coloration
    matches his own required cure. Her jealous elder sister and an old witch abduct
    the queen’s sons and substitute puppies, causing the king to exile the queen and
    one hidden child on an iron bed in the sea. The hidden prince rapidly grows, reaches
    an island with his mother, receives magical tools, builds and populates a city,
    spies in flea form, discovers his eleven captive brothers, rescues them by poisoning
    their guard and sharing milk cakes, and returns with them in dove form. The plot
    is revealed; the wicked queen and sorceress are executed, and the king settles
    with his restored family.
  language: English
  quote_policy: summarized
