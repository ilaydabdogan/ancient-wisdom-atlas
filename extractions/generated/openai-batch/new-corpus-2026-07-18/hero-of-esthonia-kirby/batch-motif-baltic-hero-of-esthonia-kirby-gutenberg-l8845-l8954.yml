canonical_text:
  quote: '"Don''t think to drown this man."'
  summary: The passage gives a variant in which the Kalevide crosses Lake Peipus seeking
    a horse, receives horse-shaped members of the devil's family as mounts, is carried
    by the devil's mother in the form of a white mare toward Põrgu, and is trapped
    at the doorpost after following a voice from heaven. The remainder consists of
    editorial footnotes noting related Estonian and wider folk-tale patterns, including
    returning guardian heroes, miraculously swift animals, hand-substitution incidents,
    altered time during visits to non-human beings, and forgotten companions after
    return.
  language: English
  quote_policy: quoted
