  summary: Hans recovers his memory and recalls wandering from his path in winter,
    sleeping by a fire with a stranger, and spending days as the stranger's guest.
    He finds himself in summer beside the remains of an extinguished fire, whose ashes
    are silver dust and whose sticks are gold. He gathers the treasure in his fur
    coat, later becomes wealthy, moves away, marries, and tells his descendants that
    he visited the master of underground treasures. The passage then transitions from
    gnomes to wood-spirits.
