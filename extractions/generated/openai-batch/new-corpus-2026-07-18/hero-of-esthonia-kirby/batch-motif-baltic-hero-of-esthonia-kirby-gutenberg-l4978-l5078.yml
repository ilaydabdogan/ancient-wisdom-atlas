canonical_text:
  quote: ''
  summary: The old man sends spirits to recapture the fugitives. The maiden uses a
    magic reel to transform herself and the prince into wind and a gnat, avoiding
    pursuit. She then uses the reel to open a rock passage back to earth. The prince
    returns to his country, learns his father the king has died, mourns him, becomes
    ruler, reports that the maiden saved his life, and marries her after the councillors
    approve her as queen.
  language: English
  quote_policy: summarized
