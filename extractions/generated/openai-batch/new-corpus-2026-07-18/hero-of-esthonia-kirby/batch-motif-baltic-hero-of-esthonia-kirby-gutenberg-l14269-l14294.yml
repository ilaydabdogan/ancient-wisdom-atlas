canonical_text:
  quote: ''
  summary: 'The passage recounts that the former church at Fellin stood by a lake
    and sank after a prophecy was fulfilled by seven brothers being present together.
    The site became a marshy meadow where, near midnight on New Year''s Eve, voices
    and an underground clock may be heard. A following Estonian story pattern concerns
    a wicked rich brother and poor brother: after the poor brother dies, the rich
    brother attempts to reclaim grave-clothing from the corpse, which then clings
    to his neck for life.'
