canonical_text:
  quote: ''
  summary: A drought follows the loss of the thunder-weapon. The Thunderer's son seeks
    a sorcerer's advice, and Father Kõu learns where the weapon is hidden. Kõu disguises
    himself as the boy Pikker, helps a fisherman trap the Devil, travels to Põrgu,
    retrieves the instrument from a locked chamber, and plays it so that hell shakes.
    He then opens the rain-gates and forgives his son.
  language: English
  quote_policy: summarized
