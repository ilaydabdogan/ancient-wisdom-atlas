canonical_text:
  quote: ''
  summary: 'The passage presents several Esthonian wolf-stories: the Devil creates
    the wolf with God''s permission but the wolf becomes the Devil''s enemy; the wolf''s
    food arrangement is broken after a farmer''s wife gives him a hot stone; wolves
    receive or pursue allotted food; a wolf chases a black cat identified as the Devil;
    wolves save a peasant who calls on ''St. George''s Dogs''; a man defeats wolves
    by a stratagem; were-wolves are briefly mentioned. The passage then begins the
    tale of a traveller with bast shoes who damages his own property and uses false
    compensation claims to obtain a cock and then a ram.'
  language: English
  quote_policy: summarized
