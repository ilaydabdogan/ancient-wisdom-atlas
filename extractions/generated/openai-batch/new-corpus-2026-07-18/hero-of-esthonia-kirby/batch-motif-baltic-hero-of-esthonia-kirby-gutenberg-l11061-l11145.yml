canonical_text:
  quote: For whoever comes to our kingdom must stay with us.
  summary: An old man enters a hidden water-world through a door at a lake's river
    mouth, is guided by a dwarf through a brilliant palace, learns that sunken mortals
    normally remain there and that his father must perform a recurring duty under
    the young ice until replaced. The dwarf gives him copper rods and lets him leave;
    later he disappears. A separate note reports a little grey man from Ülemiste järv
    whose displeasure would cause inundation and destruction of Tallinn.
  language: English
  quote_policy: quoted
