canonical_text:
  quote: ''
  summary: A prince serving as a herd-boy is transferred to a wicked old woman’s farm.
    She attempts to abuse and starve him, but he resists and takes food and milk.
    After weeks of conflict, he catches twelve wolves, confines and feeds them in
    a cave, then starves them and places them in the stall instead of the herd. The
    old woman enters to milk the cows and is devoured by the wolves, leaving only
    her poisonous tongue and heart. Her household is glad to be rid of her.
  language: English
  quote_policy: summarized
