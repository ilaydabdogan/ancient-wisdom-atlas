  summary: The passage argues that the manuscript was likely made for official or
    judicial use against heresy, explains the colophon “Part of the Books of the Saviour,”
    and then summarizes doctrinal differences among the First, Second, Third, and
    Fourth Documents concerning Jesus, Barbelo, the First Mystery, disciples, cosmic
    spheres, destiny, and the cause of sin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the manuscript appears to have been made for orthodox persons,
    but not for the orthodox public generally, and lacks the commentary, refutation,
    preface, or colophon expected of an ecclesiastical polemical work.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a first scribe took unusual pains over accuracy and
    later corrected the work of a subordinate scribe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage proposes that the copy was made for official or judicial use by
    a tribunal concerned with the suppression of heresy.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage explains the colophon “Part of the Books of the Saviour” as a
    possible indication of a manuscript collection, perhaps seized from a heretic’s
    library by Imperial authorities.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says the documents appear to concern one school or sect and share
    a general conception of the universe, Jesus, and salvation, while also being by
    different authors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage contrasts the First Document, where a power from Barbelo is Jesus’
    body in the Height and another power is his soul, with the Second Document, where
    a lesser power of the Middle acts in the Incarnation and produces the earthly
    body of the Saviour from the matter of Barbelo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage contrasts a First Document account spoken by Mary the Mother,
    in which the Holy Spirit comes down from the First Mystery in the likeness of
    Jesus’ earthly body and the two kiss and become one, with a Second Document account
    spoken by St. John, in which the First Mystery comes down upon Jesus in the form
    of a dove and in a vesture of light from Barbelo.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says the First Document has Jesus endow the disciples with twelve
    powers from the Treasure-house of Light instead of ordinary souls from the Rulers,
    while the Second Document says their souls have undergone transmigration into
    different bodies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage reports differing descriptions of the Sphere of Destiny across
    the First, Third, and Fourth Documents, including identifications with the Second
    Sphere, Great Destiny in the head of the Æons or Zodiac, the Kingdom of Adamas,
    and the visible firmament.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says the Third Document assigns the cause of sin to the Five Rulers
