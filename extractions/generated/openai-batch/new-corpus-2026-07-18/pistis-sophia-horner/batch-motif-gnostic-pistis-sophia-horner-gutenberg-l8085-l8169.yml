canonical_text:
  quote: ''
  summary: The passage describes a soul leaving the body, loosening the bonds and
    seals that bind the counterfeit spirit to it, dismissing Fate and the counterfeit
    spirit, passing through rulers and places by speaking mysteries, defences, and
    seals, being examined and sealed by light figures, and finally being received
    into the Treasury of the Light and going to its inheritance. The Saviour then
    addresses his disciples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A soul is brought out of the body while Fate and the counterfeit spirit follow
    it because the counterfeit spirit has been bound to the soul with seals and bonds
    of the Rulers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The soul says the mystery of loosening the bonds and seals, and the bonds
    that bound the counterfeit spirit to the soul are loosened.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the counterfeit spirit is loosened, it ceases coming against and allotting
    the soul; the soul says a mystery, holds down the counterfeit spirit with Fate,
    and dismisses them from following her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Receivers of the soul and the mysteries she received come and snatch the
    soul from the Contentious Receiver.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Receivers of the Light become a wing of light for the soul, and the soul
    becomes a vesture of light for herself.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The soul is not taken directly out of the Chaoses but is taken by the road
    of the Rulers of the Middle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Rulers of the Middle come to meet the soul in great fear, with a fierce
    flame of varied faces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The soul says the mystery of their defence, and the Rulers fear greatly and
    fall on their faces before the mystery and the defence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The soul tells the Rulers to receive their Fate, declares she will no longer
    come to their place, and says she is going to the place of her inheritance.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Receivers of the Light fly with the soul to the Height and take her out
    of the Aeons of the Destiny while she gives the defence of the place with its
    seal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The soul gives the counterfeit spirit to the Rulers and speaks the mystery
    of the bonds with which they bound it to her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Receivers take the soul up through the Aeons and places, while she gives
    defences and seals associated with those places and rulers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: The Receivers take the soul to the Virgin of the Light; the soul gives seals
    with the glory of the hymn.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Virgin of the Light and seven other Virgins of the Light prove the soul
    and find their signs in her, together with their seals, baptisms, and chrisms.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The Virgin of the Light seals the soul; the Receivers of the Light baptise
    the soul and give her spiritual chrism; each of the Virgins of the Light seals
    her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: The Receivers deliver the soul to Sabaoth the great good, who is at the gate
    of the Life in the place of those of the Right and is called the Father.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:17
  text: Sabaoth seals the soul; the soul gives knowledge, hymns, and seals of the
    places of those of the Right, and those places seal her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: Melkhisedek the great Receiver of the Light and his Receivers seal the soul
    and receive her into the Treasury of the Light, after which she goes to the place
    of her inheritance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:19
  text: After saying these things, the Saviour speaks to his disciples.
  category: speech
  evidence_refs:
  - ev:7
