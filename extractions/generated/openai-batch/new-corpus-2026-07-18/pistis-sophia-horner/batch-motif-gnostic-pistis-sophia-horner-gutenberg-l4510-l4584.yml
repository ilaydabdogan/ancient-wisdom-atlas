canonical_text:
  quote: ''
  summary: Andreas interprets Pistis Sophia's twelfth repentance through a Davidic
    psalm describing slander, judgment, curse, and a plea for mercy. Jesus then narrates
    Pistis Sophia's confession that she transgressed in the twelve Aeons, descended
    from them, forsook the Place of Height, and dwelt in the Place of Chaos. In a
    thirteenth repentance she addresses the Light of the Lights, asks for deliverance,
    forgiveness, baptisms, and cleansing, and identifies her transgression with the
    power of the face of lion. Martha then interprets these words through David's
    fiftieth psalm on mercy, sin, washing, and judgment.
  language: English
  quote_policy: summarized
