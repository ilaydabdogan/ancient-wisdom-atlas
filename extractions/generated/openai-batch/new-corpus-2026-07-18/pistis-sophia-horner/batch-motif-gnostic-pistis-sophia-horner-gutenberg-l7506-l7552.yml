canonical_text:
  quote: ''
  summary: The passage warns of severe punishment in outer darkness for those who
    forsake the teaching of the First Mystery, then instructs that people of the World
    should practice virtues, receive the mysteries of the Light, and go to the Height
    of the kingdom of the Light. It further commands that the mysteries not be withheld
    from repentant sinners, because they are brought for forgiveness and are the free
    gift of the First Mystery.
  language: English
  quote_policy: summarized
