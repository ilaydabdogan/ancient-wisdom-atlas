canonical_text:
  quote: ''
  summary: Jesus hymns in the great name, remains with his disciples upon air of light,
    performs a blessing and breathes into their eyes so that they see a great light
    and the elements fire, water, wine, and blood. He explains the light-realm origins
    and saving functions of these elements, the sending of the holy spirit in the
    type of a dove, the spirit's guidance of souls to the Place of Light, and the
    relation of these mysteries to purification, covenant blood, living water, and
    forgiveness of sins through the names of the Light.
  language: English
  quote_policy: summarized
