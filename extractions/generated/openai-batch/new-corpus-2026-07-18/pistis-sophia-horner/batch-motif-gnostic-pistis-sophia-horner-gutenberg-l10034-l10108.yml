canonical_text:
  quote: ''
  summary: Jesus answers disciples' questions about postmortem punishments for several
    named transgressions. Souls are taken by receivers through cosmic regions such
    as the World, Amente, Chaos, the road of the Middle, the Sphere, and the outer
    Darkness; punishments include demonic torment, purifying or consuming substances,
    forgetfulness before re-embodiment, judgment, and dissolution.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the continuation of a punishment for a robber, Ialouham brings a cup of
    forgetfulness; the soul drinks, forgets every place it visited, and is cast into
    a lame, maimed, and blind body.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Andreas asks what will be done to a proud despiser after leaving the body;
    Jesus says the Receivers of Ariel take the soul and spend three days going through
    the World teaching her its creatures.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The proud soul is taken to Amente for Ariel to punish her for twenty months,
    then to Chaos to Ialdabaoth and his forty-nine demons for another twenty months,
    and then to the road of the Middle for punishment by its rulers for another twenty
    months.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The proud soul is brought to the Virgin of the Light for judgment, cast into
    Aeons of the Sphere, taken to water beneath the Sphere that becomes boiling smoke
    and purifies her, given the cup of forgetfulness by Ialouham, and cast into a
    dumb and deformed body.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Thomas asks about a continual blasphemer; Jesus says the Receivers of Ialdabaoth
    bind the soul by the tongue to a great demon with a horse face and punish him
    while going through the World for three days.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The blasphemer is taken to a place of cold and snow for eleven years, then
    to Chaos near Ialdabaoth and his forty-nine demons for further punishment, then
    to the outer Darkness until a judgment involving the great ruler with a dragon
    face; the soul becomes numb, wastes away, and is dissolved.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bartholomaios asks about a man sleeping with a male; Jesus says the men involved
    receive the same measure as the blasphemer, including punishment by Ialdabaoth
    and his forty-nine demons for eleven years.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The souls of the men sleeping with males are taken to rivers of smoke and
    boiling seas of pitch full of swine-faced demons that eat into and punish them;
    afterward they are taken to the outer Darkness until judgment and are dissolved
    and perish.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Thomas reports people on earth who take male sperma and a woman's menstruum,
    put them with lentil food, eat it, and say they believe Esau with Jakob.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Jesus becomes angry with the World and says that this sin surpasses every
    sin and unlawfulness; those souls are taken immediately to the outer Darkness,
    are not returned to the Sphere, and perish and dissolve in a place without mercy
    or light, with weeping and gnashing of teeth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage repeatedly gives fixed durations and numbers, including three
    days, twenty months, eleven years, and forty-nine demons.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
