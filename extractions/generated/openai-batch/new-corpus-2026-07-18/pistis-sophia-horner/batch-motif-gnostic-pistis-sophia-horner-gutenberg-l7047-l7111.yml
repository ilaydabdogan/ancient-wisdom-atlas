canonical_text:
  quote: ''
  summary: 'Maria the Magdalene asks Jesus to explain how the First Mystery and the
    Ineffable possess their mysteries. Jesus answers by describing one mystery that
    manifests as three or five mysteries with different types and ranks. He then describes
    effects of completing or receiving these mysteries: the soul leaving the body
    becomes light, passes through cosmic Places, avoids judgment and fire, is conveyed
    to the Virgin of the Light, is tested and sealed, and may be cast into a righteous
    body to find the Godhead of truth and inherit Light.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Jesus finishes speaking to the disciples, Maria the Magdalene comes
    forward, kisses his feet, asks him not to be angry, and asks him to reveal what
    they seek.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maria asks how the First Mystery has twelve mysteries while the Ineffable
    has one mystery.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Jesus says the one mystery can do three mysteries and five mysteries, while
    remaining one, and that the types of these mysteries differ.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jesus describes the five mysteries as equal with one another in the kingdom
    in the Inheritances of the Light, but not equal to the one mystery of the First
    Mystery in the kingdom of the Light.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Completing the first mystery in all its figures is said to make the soul a
    great overflow of light as it comes out of the present body.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The soul associated with the first mystery passes through every Place of the
    Rulers and the Places of the Light, with all fearing before its light, until it
    reaches the Places of its kingdom.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: For the second mystery, a person who completes it says the mystery over the
    head and into the two ears of a man coming out of the body.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man who has received the mystery and the word of truth becomes a great effluence
    of Light when he leaves the body of matter and passes through every Place to the
    kingdom of that mystery.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A man who did not receive the mystery or communicate in the word of truth
    is nevertheless not judged or punished in the Places of the Rulers when the mystery
    is said over him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that fire will not touch the man because of the great mystery
    of the Ineffable that becomes with him.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The man is rapidly delivered and steered from Place to Place and from array
    to array until he is taken close to the Virgin of the Light.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Virgin of the Light sees the sign of the mystery of the kingdom of the
    Ineffable with him, wonders at it, and proves him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Virgin of the Light does not cause him to be taken to the Light until
    he completes the duties of the Light of that mystery, including purifications
    and renunciation of the World and its matter.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Virgin of the Light seals him with a more excellent seal; the form of
    the seal is not given in the passage.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Virgin of the Light causes him to be cast, in the month in which he left
    the body of matter, into a body that is to become righteous and find the Godhead
    of truth with high mysteries.
  category: sequence
  evidence_refs:
  - ev:7
