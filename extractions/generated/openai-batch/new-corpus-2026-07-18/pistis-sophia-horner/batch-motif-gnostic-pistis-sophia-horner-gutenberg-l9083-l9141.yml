canonical_text:
  quote: ''
  summary: The speaker promises to disclose, in the Distribution of the Universe,
    how soul, power, Fate, counterfeit spirit, Rulers, Dekans, and different kinds
    of souls are constituted and named. The passage then describes cosmic Rulers breathing
    into the soul, placing and binding a counterfeit spirit to it with seals and bonds
    so that it is compelled toward passions and subjection. The speaker says that
    the mysteries brought into the World loosen these bonds, free and purify the soul
    as Light, and raise it to the kingdom of the Father, the First Mystery. A saying
    about forsaking father and mother is interpreted as forsaking Ruler parents and
    becoming a son of the First Mystery.
  language: English
  quote_policy: summarized
