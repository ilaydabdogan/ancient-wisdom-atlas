canonical_text:
  quote: ''
  summary: Jesus narrates bringing Pistis Sophia to the thirteenth Aeon and into the
    place of the twenty-four Invisibles. Sophia rejoices among them and hymns the
    Light as saviour and redeemer for delivering her from rulers, lightless places,
    Chaos, bonds, gates, and loss of power. Jesus identifies the hymn and invites
    interpretation. Philippos says David prophesied about it in a psalm describing
    redeemed people delivered by the Lord from enemies, wilderness, darkness, bonds,
    gates, and the shadow of death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jesus tells his disciples that he took away Pistis Sophia, brought her into
    the thirteenth Aeon, and came into the place of the twenty-four Invisibles while
    shining greatly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The twenty-four Invisibles were disturbed, recognized Sophia, did not recognize
    Jesus, and thought of him as an emanation from the land of the Light.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sophia rejoiced when she saw her fellow Invisibles and wished to show them
    the wonders Jesus had done with her below in the land of mankind until he delivered
    her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sophia hymns to the Light, calling it a saviour and redeemer, and says it
    delivered her from the hand of the Rulers, her enemies, and from the Chaoses and
    Aeons of the Rulers of the Sphere.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sophia says she came out of the Height, went astray in places without light,
    and could not return to the thirteenth Aeon because she lacked light and power.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sophia says she was in darkness with the shadow of Chaos and bound in cruel
    bonds of Chaos because she transgressed the precept of the Light by coming out
    of her place.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sophia says the Light heard her hymn, delivered her from afflictions, burst
    her bonds, brought her from darkness and Chaos, broke gates and bars, and dispatched
    an effluence that gave her power.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Jesus identifies the preceding speech as the hymn Sophia said in the midst
    of the twenty-four Invisibles and says she wanted them to know the wonders done
    with her and that he went to the world of mankind and gave the mysteries of the
    Height.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Philippos comes forward and says he understands the explanation of Sophia's
    hymn, adding that David the prophet once prophesied about it in the hundred and
    sixth psalm.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The psalmic passage quoted by Philippos describes people redeemed by the Lord
    from enemies, gathered from several directions, wandering in a waterless wilderness
    without a road to their dwelling city, hungry and thirsty, and delivered when
    they cried to the Lord.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The psalmic passage also describes people sitting in darkness and the shadow
    of death, bound with poverty and iron after exasperating the word of God, then
    delivered by the Lord, who burst bonds and broke gates and bars.
  category: sequence
  evidence_refs:
  - ev:6
