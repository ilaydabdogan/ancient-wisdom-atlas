canonical_text:
  quote: ''
  summary: Maria interprets Pistis Sophia’s words through Davidic prophecy and the
    image of eagle-like renewal in the Height. The First Mystery recounts bringing
    Pistis Sophia upward from Chaos to a place below the thirteenth Aeon, giving her
    a new mystery and hymn of light, and placing her there until he returns for her.
    Pistis Sophia sings of rescue by the Light; Andreas interprets her hymn through
    Davidic words about being raised from pit and mire, set on rock, and given a new
    song. Pistis Sophia then fears renewed attack by Adamas, the Self-willed, their
    rulers, and a lion-faced emanation. The First Mystery promises to seal their places
    until the appointed time and gives the opening of the gate of the Treasury of
    the Great Light as a sign.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maria comes forward and says that David prophesied the words hymned by Pistis
    Sophia, including blessing, forgiveness, healing, redemption, crowning with mercy,
    and renewal like an eagle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maria explains the eagle image by saying that eagles dwell in the height and
    that the Invisibles are also in the Height; she applies this to Sophia becoming
    light like the Invisibles as she was from her beginning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The First Mystery praises Maria and tells the disciples that he took Pistis
    Sophia away, brought her to a place below the thirteenth Aeon, gave her a new
    mystery of light, and gave her a hymn of light so that the Rulers of the Aeons
    could not prevail against her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pistis Sophia sings that she believed the Light, that the Light remembered
    and heard her, and that her power was brought up from Chaos with darkness below
    all matter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pistis Sophia says she was put in an exalted and firm Aeon, set on the road
    to her Place, and given a new mystery and hymn of light.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Andreas comes forward and interprets the meaning of Pistis Sophia’s hymn through
    Davidic words about patient waiting, being raised from a pit and mire, feet set
    on rock, directed steps, and a new song.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pistis Sophia fears that when the Light leaves her, Adamas the tyrant, his
    Rulers, the Self-willed, and the Self-willed’s lion-faced emanation will come
    to oppress her and take away her light.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The First Mystery answers that the Father has not yet commanded him to take
    away the adversaries’ light, but he will seal the places of the Self-willed, Adamas,
    and their rulers so that they cannot war with Pistis Sophia until the appointed
    time.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Pistis Sophia asks how she will know when the three times are fulfilled, and
    the First Mystery says the sign will be the opening of the gate of the Treasury
    of the great Light toward the thirteenth Aeon, causing great light to appear in
    the Aeons.
  category: speech
  evidence_refs:
  - ev:7
