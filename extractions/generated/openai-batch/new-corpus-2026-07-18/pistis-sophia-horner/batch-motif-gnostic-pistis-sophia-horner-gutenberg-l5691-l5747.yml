canonical_text:
  quote: ''
  summary: The speaker tells Pistis Sophia that after a set time hostile powers will
    oppress her and try to take her light, but that she will have authority to ascend
    to the twelve Aeons and return to her place below the thirteenth Aeon, though
    not to enter the gate of the Height. The speaker promises aid when she hymns the
    Light. Pistis Sophia rejoices, and the First Mystery narrates the matter to the
    disciples on the Mount of Olives. The predicted time is said to be fulfilled when
    Adamas sees his demonic power darkened in Chaos, becomes angry at Pistis Sophia,
    and emanates dark and chaotic powers to disturb her.
  language: English
  quote_policy: summarized
