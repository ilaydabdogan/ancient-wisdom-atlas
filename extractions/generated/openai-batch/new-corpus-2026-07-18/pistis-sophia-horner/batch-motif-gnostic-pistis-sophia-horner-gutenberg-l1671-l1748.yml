canonical_text:
  quote: ''
  summary: A scholarly introductory passage argues that the Third Document of Pistis
    Sophia is not by Valentinus but by a later Valentinian author. It describes the
    document as a dialogue between Jesus and his disciples about mysteries used to
    avoid sin's consequences, escape postmortem punishments, and inherit the Kingdom
    of Light. The passage compares these elements with Egyptian funerary texts, Pagan
    Egyptian ideas of the Ka and Fate, and possibly Plato's cup of oblivion, and notes
    signs of later ritual organization.
  language: English
  quote_policy: summarized
