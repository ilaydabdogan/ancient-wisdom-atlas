canonical_text:
  quote: ''
  summary: The passage describes souls being taken by the Angels of Ieou to Ieou,
    who examines whether they have completed their cycles. Souls with incomplete cycles
    are retained until a mystery is performed and they are turned toward a good body.
    Souls that have completed their cycle but lack the sign or seal of the Ineffable
    are mercifully brought to the seven Virgins of the Light, baptized, placed apart
    in the Treasury of the Light, later purified, given mystery, placed in the last
    array, and delivered from punishments and judgments.
  language: English
  quote_policy: summarized
