canonical_text:
  quote: '"ye will go unto the Height"; "many members are, but one body it is."'
  summary: The Saviour tells Andreas and the disciples that after renunciations, tribulations,
    bodily changes, and purification mysteries, they will become purified light and
    enter the Height and the kingdom of Light. He describes their future passage after
    leaving the body through cosmic Places whose rulers and beings respond with shame,
    glory, and hymns. The disciples repent on behalf of Andreas, and the Saviour declares
    forgiveness. The following fragment explains the mysteries of the Ineffable through
    an analogy of members in one body and praises those who find the words of the
    mysteries in successive Spaces.
  language: English
  quote_policy: quoted
