canonical_text:
  quote: ''
  summary: 'The passage recounts the modern scholarly reception of the Pistis Sophia
    manuscript: its initial neglect, copying and attempted translations by several
    scholars, publication of Schwartze’s text and translation by Petermann, limited
    reception, later classifications by scholars, and increased English attention
    through Lipsius and C. W. King, including King’s claim about Madame Blavatsky’s
    use of Gnostic relics.'
