canonical_text:
  quote: ''
  summary: Jesus identifies the preceding material as Pistis Sophia's fourth repentance
    and authorizes Iohannes to explain it. Iohannes interprets it through a psalm
    attributed to the power of Light in David. Jesus praises Iohannes, then narrates
    how material emanations of the Self-willed afflicted Pistis Sophia in the Chaoses,
    sought to take her light, and how deliverance awaited a command from the First
    Mystery. Pistis Sophia then utters a fifth repentance to the Light from both Height
    and Chaos, lamenting darkness, loss of light, abandonment by helpers, and surrounding
    fears.
  language: English
  quote_policy: summarized
