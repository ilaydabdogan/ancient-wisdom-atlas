canonical_text:
  quote: ''
  summary: A scholarly introduction argues that patristic authors may have known the
    main documents of the Pistis Sophia manuscript despite suppression of heretical
    writings. It lists verbal and thematic parallels in Tertullian, Irenaeus, Hippolytus,
    and Origen, including dove-form descent, shedding earthly souls, the dregs of
    earth, soul-answers before truth-powers, named Aeons, Sophia among twenty-four
    Aeons, and self-opening doors in Jesus' upward journey. It then proposes an early
    date and possible Valentinian authorship for the main documents while treating
    the interpolated fragment as uncertain and perhaps connected with Jesus' upward
    flight toward the Ineffable One.
  language: English
  quote_policy: summarized
