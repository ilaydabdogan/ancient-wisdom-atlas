canonical_text:
  quote: ''
  summary: The passage gives a cosmological explanation in which rulers of aeons,
    destiny, and sphere lose power; Melkhisedek the Receiver purifies and takes light
    to the Treasury of the Light; the rulers swallow purgation matter to prolong their
    rule and prevent souls from coming into the world; Jesus, by command of the First
    Mystery, ascends among the tyrants with a luminous vesture, alters their paths
    and times, and enables the perfect number of souls to be saved; the disciples
    worship after receiving the revelation.
  language: English
  quote_policy: summarized
