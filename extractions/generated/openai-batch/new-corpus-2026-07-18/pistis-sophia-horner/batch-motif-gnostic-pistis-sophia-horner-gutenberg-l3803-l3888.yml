canonical_text:
  quote: ''
  summary: Jesus invites an explanation of the fifth repentance of Pistis Sophia.
    Philippos rises from his scribal work and asks to speak; Jesus explains that Philippos,
    Thomas, and Maththaios are appointed by the First Mystery to write and witness.
    Mariham interprets this as the Mosaic two-or-three-witness principle, and Jesus
    approves. Philippos then explains the fifth repentance by citing a psalm attributed
    to David, applying its images of prayer, pit, darkness, death, abandonment, water,
    and Chaos to Pistis Sophia. Jesus approves and Philippos returns to writing.
  language: English
  quote_policy: summarized
