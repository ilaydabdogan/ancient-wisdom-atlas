canonical_text:
  quote: ''
  summary: The First Mystery praises Mathaios's explanation of a hymn by Pistis Sophia,
    then recites further lines in which Pistis Sophia says the Light delivered her,
    brought her power up from Chaos, and protected her from hostile emanations. Maria
    asks to explain but says she fears Petros; the First Mystery authorizes anyone
    filled with the spirit of light to speak. Maria interprets the words through a
    Davidic passage about being raised from Amente and saved from the pit. The First
    Mystery praises Maria and adds further lines about light turning darkness to light
    and rending Chaos. Martha then gives another Davidic interpretation. The First
    Mystery continues with a hymn about forgiveness, deliverance from the emanations
    of the Self-willed, a crown of light, purification, and renewal.
  language: English
  quote_policy: summarized
