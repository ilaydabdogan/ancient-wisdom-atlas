canonical_text:
  quote: ''
  summary: Maria asks Jesus whether a completely righteous and sinless person is punished
    or admitted to the heavenly kingdom. Jesus answers that a righteous person without
    the mysteries of the Light is escorted after death through cosmic regions, partly
    molested by fires and judgments but shown mercy, examined by the Virgin of the
    Light, sealed, and sent into another body rather than admitted to the kingdom
    of the Light. He concludes that entry into the Light is impossible without the
    mysteries of the kingdom of the Light.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maria addresses the Saviour and asks about the fate of a man who is righteous,
    complete in righteousness, and without sin.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Saviour answers that such a righteous and sinless person may nevertheless
    have never received any mystery of the Light.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the person's time of coming out of the body occurs, Receivers of one
    of the great Triple powers come and carry the soul away from the Receivers of
    Contentious ones.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The soul is moved around for three days in all creations of the World.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After three days the soul is taken down to the Chaos and through punishments
    and judgments.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The fires of Chaos and of other Places molest the soul only partly and for
    a little time, and mercy is shown to it quickly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The soul is taken on the road of the Middle through rulers and to the Place
    of Iakhthanabas the unmerciful.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The soul is taken through the road of the light of the sun to the Virgin of
    the Light.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Virgin of the Light proves the soul and finds it free from sin, but does
    not cause it to be taken to the Light because it lacks the sign of the kingdom
    of the Mystery.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Virgin of the Light seals the soul with an excellent seal and causes it
    to be cast into a body among the Aeons of righteousness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Jesus states that it is impossible to take a soul into the Light without the
    mysteries of the kingdom of the Light.
  category: speech
  evidence_refs:
