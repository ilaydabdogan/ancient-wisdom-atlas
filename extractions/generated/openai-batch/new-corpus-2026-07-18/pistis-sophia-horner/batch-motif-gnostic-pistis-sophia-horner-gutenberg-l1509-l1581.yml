  text: In a Coptic Book of Resurrection example, Judas Iscariot is in Amente with
    his mouth filled with thirty snakes intended to devour him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The snakes in Judas’ mouth are given names such as Remoteness from God, Haughtiness
    of Heart, Hypocrisy, and Treachery.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some Valentinians are said to have explained the names of the Supreme Ogdoad
    as a figure of speech showing stages by which the Divine Nature became appreciable
    by humans.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In that Valentinian explanation, God’s thinking of offspring gives the name
