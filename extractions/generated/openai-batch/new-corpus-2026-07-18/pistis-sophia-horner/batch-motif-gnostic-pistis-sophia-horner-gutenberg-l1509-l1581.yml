canonical_text:
  quote: ''
  summary: 'The passage discusses whether Valentinian doctrine reported by Church
    Fathers should be read literally or allegorically. It gives examples of Egyptian
    and Coptic allegory: Isis’ tear causing the Nile to swell, and Judas Iscariot
    in Amente with his mouth filled by thirty named snakes. It then summarizes Valentinian
    themes: divine manifestation in successive stages, the story of Sophia’s fall
    through disobedience and emulation and her restoration through repentance, Sophia’s
    relation to the Demiurge, Matter, and the divine spark in humanity.'
  language: English
  quote_policy: summarized
