- id: obs:2
  text: The passage says ancient Egyptians knew the Nile rose because of seasonal
    rains and water from Abyssinian highlands, but also described the rise as Isis
    dropping a tear into the river until it swelled to the sea.
  category: sequence
  evidence_refs:
  - ev:2
