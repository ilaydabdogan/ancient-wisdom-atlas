  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'The passage notes that heresiologists give differing numbers for beings within
    the Pleroma: thirty, twenty-eight, and thirty-three.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that Valentinus believed the Godhead manifested itself
