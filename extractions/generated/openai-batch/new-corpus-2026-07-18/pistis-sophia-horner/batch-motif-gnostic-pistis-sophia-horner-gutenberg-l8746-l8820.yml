canonical_text:
  quote: ''
  summary: Maria questions the Saviour about souls taken to the outer Darkness. The
    Saviour describes unrepentant sinners being brought through the tail-mouth of
    a dragon into chambers of outer Darkness, where the dragon closes them in. He
    describes the dragon’s twelve names and the severity of punishments by cold, hail,
    and fire, including a hierarchy of fires in Amente, Chaos, the Rulers’ judgments,
    and the outer Darkness. Maria and the disciples lament. Mariham prostrates before
    Jesus and asks leave to question him more exactly. Maria then asks how a good
    person who has completed the mysteries may help an impious kinsman after death,
    deliver him from the dragon’s punishments, and move him toward a righteous body
    and the kingdom of Light.
  language: English
  quote_policy: summarized
