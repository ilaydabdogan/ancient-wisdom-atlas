canonical_text:
  quote: ''
  summary: The passage describes the postmortem condition of people who receive mysteries
    of the First Mystery. Their souls are brought out of the body by the Receivers
    of the Contentious, become overflowing light, ascend to the Height, pass through
    the Places of the Rulers and of Light without giving answer, defence, or symbol,
    and reign over the Places of the First Saviour or the twelve Saviours according
    to the mystery received. A higher status is attributed to recipients of the one
    Mystery of the Ineffable.
  language: English
  quote_policy: summarized
