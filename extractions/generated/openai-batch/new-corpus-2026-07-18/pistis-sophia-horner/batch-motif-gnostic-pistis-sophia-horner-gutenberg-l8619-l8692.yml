canonical_text:
  quote: ''
  summary: 'The Saviour teaches Maria and the disciples that one who knows the Godhead
    and receives the mysteries of the Light but sins without repentance will receive
    greater punishment than one who did not know. Maria interprets this through a
    parable about servants who knew or did not know their lord''s wish. She asks whether
    souls who postpone receiving the mysteries across cycles risk failing to receive
    them. The Saviour commands preaching urgency: receive the mysteries now, because
    when the number of perfect souls is complete he will shut the gate of the Light.
    He describes a purifying fire, late-arriving souls who knock at the closed gate,
    refusal of entry, and their being sent to outer Darkness. He concludes with an
    exhortation to renounce the world and matter and receive the mysteries before
    the completion.'
  language: English
  quote_policy: summarized
