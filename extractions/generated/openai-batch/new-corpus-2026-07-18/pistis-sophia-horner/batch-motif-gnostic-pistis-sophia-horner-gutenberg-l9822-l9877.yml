canonical_text:
  quote: ''
  summary: Jesus remains with his disciples on a mountain in Galilaia after commanding
    the powers of the Left to return to their places. The disciples ask when their
    sins will be forgiven and when they will be made worthy of the kingdom of his
    Father. Jesus promises purification and a mystery of forgiving and binding on
    earth with heavenly effect. He prepares an oblation with fire, vine wood, wine,
    water, cakes, linen garments, and tickets bearing the Father's name. He invokes
    his Father and named forgivers and purifiers, asks for the disciples' sins and
    unlawfulness to be forgiven and blotted out, requests a sign in the oblation,
    and announces after the sign that the disciples have been forgiven and numbered
    in the kingdom.
  language: English
  quote_policy: summarized
