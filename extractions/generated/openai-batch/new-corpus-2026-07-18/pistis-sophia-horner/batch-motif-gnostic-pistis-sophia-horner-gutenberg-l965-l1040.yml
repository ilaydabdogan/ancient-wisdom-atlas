canonical_text:
  quote: ''
  summary: 'Introductory discussion of the Fifth Document: its lacuna, sin-specific
    punishments in multiple hells, named underworld torturers and receivers, cups
    of oblivion and counter-oblivion, the treatment of uninitiated righteous souls,
    astral determination of righteous and wicked bodies, reincarnation according to
    previous sins, links and contrasts with other documents, and the presentation
    of some pagan gods as fiends.'
  language: English
  quote_policy: summarized
