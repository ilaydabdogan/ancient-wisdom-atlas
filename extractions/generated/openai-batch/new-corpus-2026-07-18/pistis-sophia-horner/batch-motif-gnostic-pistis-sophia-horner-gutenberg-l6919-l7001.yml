canonical_text:
  quote: ''
  summary: The Saviour teaches that recipients of the Mystery of the Ineffable will
    become fellow-rulers with him in the kingdom of Light and will be identified with
    him. He describes cosmic ranks over which he will rule, the thrones of the disciples,
    the special excellence of Maria Magdalene and Iohannes the Virgin, and the knowledge
    granted by the word of the Ineffable. Maria asks whether this word is identical
    with knowledge of the Universe and whether inheritance of the kingdom requires
    it; the Saviour answers that mysteries grant inheritance according to rank, while
    the one word of the Ineffable grants knowledge of the Universe.
  language: English
  quote_policy: summarized
