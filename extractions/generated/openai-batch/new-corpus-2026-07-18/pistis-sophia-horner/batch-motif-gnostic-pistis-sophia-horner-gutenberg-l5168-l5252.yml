canonical_text:
  quote: ''
  summary: 'The First Mystery asks the disciples whether they understand. Iakkobos
    comes forward and cites a psalm attributed to David, then explains its protective
    imagery as referring to Pistis Sophia: her trust in the Light, her shelter under
    the effluence of Light, her deliverance from hostile emanations of the Self-willed
    One and Adamas, and her lack of fear before threats associated with Chaos, darkness,
    the thirteenth Aeon, and the twelve Aeons.'
  language: English
  quote_policy: summarized
