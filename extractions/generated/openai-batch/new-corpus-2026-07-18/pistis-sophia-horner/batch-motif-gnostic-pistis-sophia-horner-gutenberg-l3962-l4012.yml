canonical_text:
  quote: ''
  summary: Jesus tells his disciples that, after Pistis Sophia completes her sixth
    repentance, she turns toward the Height to see whether her sins have been forgiven
    and whether she will be brought up from Chaos. She is not yet received; the Rulers
    of the twelve Aeons mock her. She then utters a seventh repentance to the Light,
    asking for forgiveness, guidance, deliverance from Chaos and darkness, and restoration
    of her powers from the emanations of the Self-willed.
  language: English
  quote_policy: summarized
