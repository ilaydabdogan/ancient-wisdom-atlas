canonical_text:
  quote: ''
  summary: Iohannes asks the Saviour what will happen to people who receive mysteries
    with hypocrisy, guile, and derision. The Saviour instructs the addressees to give
    a mystery to receptive worthy households, but to appeal to the first mystery of
    the First Mystery if recipients prove unworthy, so that the mystery returns and
    the recipients are alienated from the kingdom. He connects this to a parable about
    peace returning from an unworthy house, commands shaking dust from the feet as
    witness, describes a dwelling in the mouth of the dragon of outer Darkness for
    such persons, and states that repentance and forgiveness are possible only through
    the one mystery of the Ineffable.
  language: English
  quote_policy: summarized
