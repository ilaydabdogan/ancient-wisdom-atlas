canonical_text:
  quote: ''
  summary: Jesus tells his disciples that when he goes to the Light they must preach
    to the world, urge continual seeking of the mysteries of the kingdom of Light,
    and command renunciation of the world, matter, cares, sins, and many specific
    vices. The passage repeatedly links renunciation and worthiness for the mysteries
    of Light with deliverance from named judgments, fiery punishments, animal-faced
    punitive powers, Ialtabaoth, Ariel, Amente, and the outer Darkness. It ends with
    a warning to teachers of error and their learners to repent and forsake error
    or face the punishments of the great dragon with the Darkness.
  language: English
