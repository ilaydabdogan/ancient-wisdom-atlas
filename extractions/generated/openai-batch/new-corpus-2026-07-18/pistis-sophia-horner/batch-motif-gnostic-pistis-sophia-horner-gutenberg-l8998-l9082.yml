canonical_text:
  quote: ''
  summary: A dialogue in which the Saviour answers Maria about the dragon of the outer
    Darkness, deliverance by knowing and saying one of its names, the world’s inability
    to endure the dragon’s true darkness, the Rulers of Destiny who compel sin, the
    cup of forgetfulness given to souls, the formation of new souls from rulers’ emanations
    or light-dregs, the counterfeit spirit outside the soul, and the breathing of
    a portion of the Saviour’s power into the soul.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Saviour asks the disciples whether they understand his speech, and Maria
    answers by citing a prior parable about making a friend from unrighteous mammon.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maria identifies the unrighteous mammon with the dragon of the outer Darkness
    and says that one who knows and says a name of the dragon may be delivered from
    the Darkness and taken to the Light of the Treasury.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Saviour affirms Maria’s explanation and calls her a pure spiritual one.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Maria asks whether the dragon of the outer Darkness enters the world, and
    the Saviour answers that its darkness is covered when the sun is out and appears
    as darkness, cloud, or smoke at night when the sun draws in its rays.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Saviour says the world cannot endure the true shape of the dragon’s darkness
    and would be dissolved and perish at once.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Maria asks who compels a man to sin, and the Saviour answers that the Rulers
    of Destiny compel the man until he sins.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Saviour says the Rulers do not come down into the world in that manner,
    but act in connection with a soul coming down from them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Rulers associated with the head of the Aeons, the kingdom of Adamas, and the
    presence of the Virgin of the Light give an ancient soul a cup of forgetfulness
    from the seed of wickedness, filled with lusts and forgetfulness.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: When the soul drinks from the cup, it forgets every place and punishment through
    which it has gone.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The cup of water of forgetfulness becomes a body outside the soul, like the
    soul in every form, and is called the counterfeit spirit.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: New souls may be taken from the sweat of the Rulers, the tears of their eyes,
    the breath of their mouth, or the dregs of the purifying of the Light.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The great Rulers of the great Destiny knead and divide these materials to
    make souls, so that each Ruler of the Aeons puts a portion into the soul.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Melkhisedek, called the great Receiver of the Light, takes the dregs of the
    purifying of the Light from the Rulers.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: A Ruler among the heads of the Aeons mingles the cup of forgetfulness with
    new souls, and the cup becomes a counterfeit spirit, vesture, or sheath outside
    the soul.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The five great Rulers of the Destiny of the Aeons, together with the rulers
