canonical_text:
  quote: ''
  summary: The disciples respond to the Saviour's teaching with distress and a desire
    for their souls to go to the Height. The Saviour commissions them to preach the
    search for the mysteries of the Light, warns against false teachers, directs that
    mysteries be given according to worthiness, and restricts the mystery of raising
    the dead and curing sickness until faith is established. He then answers Maria's
    question about what compels a person to sin, describing the growth of a child,
    the power, soul, counterfeit spirit, body, Fate, Rulers, and witnessing ministers;
    the power moves the soul toward Light, while the counterfeit spirit becomes the
    soul's enemy and compels sin.
  language: English
  quote_policy: summarized
