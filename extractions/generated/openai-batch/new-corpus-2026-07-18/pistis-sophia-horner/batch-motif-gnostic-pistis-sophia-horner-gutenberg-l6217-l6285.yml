canonical_text:
  quote: the Consummation of the Aeon, namely, the dissolution of the Universe
  summary: Jesus describes events deferred until the Consummation of the Aeon, when
    the numbering of perfect souls is complete. Souls who receive mysteries of the
    Light pass through ranked Places, receive baptism, unction, and seals, and enter
    the Inheritances of the Light. Maria the Magdalene interprets the teaching through
    the saying that the first will be last and the last first, and Jesus praises her
    understanding.
