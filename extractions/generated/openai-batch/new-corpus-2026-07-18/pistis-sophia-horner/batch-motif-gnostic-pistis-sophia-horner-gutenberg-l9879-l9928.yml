canonical_text:
  quote: ''
  summary: Jesus describes hidden mysteries and baptisms that forgive sins and guide
    souls to the Place of Truth and Light. The disciples ask about baptisms of Fire
    and Spirit and a spiritual anointing. Jesus explains that these mysteries take
    souls to higher light realms, but a still greater mystery involves Seven Voices,
    forty-nine powers, tickets, and a supreme Name. Knowledge and utterance of this
    Name prevent cosmic powers from holding the soul after bodily death and overcome
    fire, darkness, demons, receivers of darkness, receivers of evil judgments, and
    named divine powers. The disciples then cry and weep; the manuscript notes four
    missing leaves.
  language: English
  quote_policy: summarized
