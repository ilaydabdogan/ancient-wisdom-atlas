  quote: ''
  summary: A first-person speaker teaches that those who renounce the World, its cares,
    and its matter, and submit to the Godhead, can receive and understand a Mystery.
    He addresses disciples, friends, and brothers, promising knowledge of the Mystery
    of the Ineffable and the Distribution of the Universe. The passage then catalogues
    many lights, mysteries, arrays, and other cosmic groups whose self-despoiling,
    proceeding from the Fatherless ones, separation, and arrangement are known by
    that Mystery.
