canonical_text:
  quote: ''
  summary: 'Jesus recounts Pistis Sophia''s sixth repentance: she cries upward to
    the Light from darkness and Chaos, asks forgiveness, and expresses trust in redemption.
    Andreas interprets the repentance through a Davidic psalm, and Jesus affirms him.
    Jesus then promises the disciples mysteries, knowledge, perfected status, and
    a place with him in his Father''s kingdom. He also foretells judgment of tyrant
    gods by a discerning fire at the dissolution of Confusion. Maria interprets this
    judgment through another Davidic saying, and Jesus affirms her.'
  language: English
  quote_policy: summarized
