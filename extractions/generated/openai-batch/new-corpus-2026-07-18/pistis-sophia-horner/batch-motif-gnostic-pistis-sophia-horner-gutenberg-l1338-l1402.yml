canonical_text:
  quote: ''
  summary: The introduction characterizes the Fourth Document as a post-Resurrection
    scene in which the disciples, ignorant of higher worlds, make an upward flight
    with Jesus to view a Place of Punishment, receive astrological information, and
    receive magical sacraments involving remission, secrecy, baptismal water, and
    the Great Name. It then characterizes the Fifth Document as focused on hell and
    torments, naming fiends including pagan deities, and describing an astrological
    allotment of souls as explained by Jesus to Mary Magdalene.
  language: English
  quote_policy: summarized
