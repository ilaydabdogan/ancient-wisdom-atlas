canonical_text:
  quote: ''
  summary: 'The passage describes post-mortem handling of souls: Contentious Receivers
    extract a soul from the body, guide it through cosmic places, and may bring it
    to Chaos and to judging or punishing powers. The counterfeit spirit and Fate accompany
    the soul and accuse or bind it. A sinful soul is judged by the Virgin of the Light
    and sent into another body according to its sins. A good soul possessing the mysteries
    can loosen the seals and bonds of the counterfeit spirit, dismiss Fate and the
    counterfeit spirit, become light, and pass through the realms to its kingdom.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Rulers bind souls by Destiny, and the Contentious Receivers bring a soul
    out of the body after death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Contentious Receivers spend three days going about with the soul through
    Places and Aeons while the counterfeit spirit and Fate follow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the three days, the Contentious Receivers bring the soul down to Amente
    of the Chaos and deliver it to those who punish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The counterfeit spirit becomes a Receiver of the soul, allots and convicts
    her according to sins, and is described as hostile toward the soul.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The soul is brought on the road of the Rulers of the Middle, where mysteries
    of the Fate are sought from her and punishment is given according to sins.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The soul is brought before the light of the sun by command of the first man
    Ieou and taken to the Virgin of the Light as judge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Virgin of the Light proves the soul sinful and casts a power of light
    into her for setting up the soul, body, and perception.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Virgin of the Light seals the soul, places her on one of her Receivers,
    and causes the soul to be cast into a body worthy of the sins done.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sinful soul is not released from changes of the body until her last cycle
    is given according to what is worthy for her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A good soul that has received mysteries of the Light is followed by the counterfeit
    spirit and Fate on the road toward the Height after leaving the body.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The good soul says the mystery for loosening seals and bonds, and the bonds
    of the counterfeit spirit are loosed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the bonds are loosed, the soul dismisses Fate and the counterfeit spirit
    to their respective places.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The liberated soul becomes a great effluence of light; the Contentious Receivers
