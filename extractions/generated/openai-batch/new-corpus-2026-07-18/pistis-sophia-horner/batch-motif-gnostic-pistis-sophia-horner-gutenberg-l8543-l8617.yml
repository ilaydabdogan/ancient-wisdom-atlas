canonical_text:
  quote: ''
  summary: Jesus baptizes a repentant woman three times, but she does not act worthily
    of the baptism. He tests Petros by commanding him to perform a mystery that would
    cut her soul away from the inheritances of Light. Petros asks that she be given
    another opportunity through higher mysteries, and Jesus recognizes his mercy.
    Jesus then asks for the meaning of the episode, and Maria explains it by reference
    to a parable of a fruitless fig-tree in a vineyard whose gardener asks for one
    more year before cutting it down. Maria then asks doctrinal questions about recipients
    of mysteries who sin, repent, transgress, remain faithful, or die after knowledge
    or ignorance of the Godhead; Jesus answers that higher mysteries, and in some
    cases the First Mystery and the Ineffable, receive repentance and forgive sins.
  language: English
  quote_policy: summarized
