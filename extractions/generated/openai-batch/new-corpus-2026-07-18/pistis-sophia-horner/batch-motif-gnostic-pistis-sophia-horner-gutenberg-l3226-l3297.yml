canonical_text:
  quote: ''
  summary: 'Jesus tells his disciples of events among the rulers of the twelve Aeons:
    they see his vesture of light, recognize mysteries of their names in it, worship,
    and the tyrants among them become weakened. Jesus then orders the movements and
    works of those in the twelve Aeons, comes to the Height and the veils of the thirteenth
    Aeon, and finds Pistis Sophia below the thirteenth Aeon, alone and grieving. Pistis
    Sophia sees his light and the mystery of her name in his vesture. The passage
    also describes her relation to other emanations and ends with Mariham asking Jesus
    about Pistis Sophia''s place among the twenty-four emanations.'
  language: English
  quote_policy: summarized
