canonical_text:
  quote: ''
  summary: Jesus invites a sober disciple to explain the preceding words. Iakobos
    comes forward, kisses Jesus' breast, and interprets the ninth repentance of Pistis
    Sophia through a psalm attributed to David. Jesus approves the explanation and
    says those who perform his mysteries will enter the kingdom of the heavens before
    the Invisibles, Gods, and Rulers. Mariham interprets this as the last becoming
    first and the first last. Jesus then narrates that after Pistis Sophia's ninth
    repentance, the lion-faced power oppressed her again; she cried to the Light,
    her repentance was accepted, and the First Mystery sent Jesus to help her secretly
    and bring her up from Chaos.
  language: English
  quote_policy: summarized
