  quote: ''
  summary: Jesus tells the disciples that hostile emanations oppressed Pistis Sophia
    in Chaos. Pistis Sophia speaks a repentance to the Light, saying her light and
    power have been diminished and asking for deliverance. Maththaios interprets her
    repentance through a psalm attributed to David. Jesus then promises a future cosmic
    completion, seats in the Treasury of the Light, and restoration of the twelve
    Saviours. Maria recalls an earlier parable about a kingdom, a table, twelve thrones,
    and judgment of the twelve tribes of Israel.
