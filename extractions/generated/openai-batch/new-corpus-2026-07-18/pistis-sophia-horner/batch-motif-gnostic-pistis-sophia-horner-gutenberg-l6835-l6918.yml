canonical_text:
  quote: "“the soul which receiveth this mystery of the Ineffable will fly unto the
    Height becoming a great effluence of light.”"
  summary: The speaker describes the Mystery of the Ineffable as a single word and
    source of knowledge, types, and figures. A person or soul that receives this mystery,
    when released from the body by the Receivers of Contentious ones, becomes a great
    light, cannot be seized, passes through cosmic places without answering or giving
    a symbol, is hymned by those places, reaches the Place of Inheritance of the mystery,
    and is joined to its members. The passage also says that a living person who receives
    and completes the mystery excels and is exalted over many cosmic ranks.
  language: English
  quote_policy: quoted
