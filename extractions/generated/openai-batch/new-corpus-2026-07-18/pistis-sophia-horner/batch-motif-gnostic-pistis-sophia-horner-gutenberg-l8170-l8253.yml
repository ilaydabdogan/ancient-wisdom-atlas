canonical_text:
  quote: ''
  summary: Maria tells the Lord that she understands and presents four meanings of
    his words. She interprets sayings about a mixed coin, tribute, household enemies,
    and reconciliation on the road as teachings about the soul receiving mysteries,
    giving defences and honours to cosmic rulers and light-places, resisting or being
    bound to the counterfeit spirit and Fate, and being judged by the Virgin of the
    Light if it lacks the mysteries that loosen bonds and seals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maria says she understands the Lord's manner of speaking and that four meanings
    arise within her; her Light-dweller is glad and wishes to go to the Lord.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the first meaning, a soul that has received mystery gives defence with
    seal to the Rulers in the Place of the King, the Adamas, and gives honour, glory,
    seals, and hymn to the Places of the Light.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Maria connects a stater of silver and brass bearing the King's image and the
    instruction to give the King's part to the King and God's part to God with the
    soul giving defence to the Rulers and honour and glory to the Places of the Light.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The silver of the mixed stater is identified as the choice power of the Light,
    and the material brass is identified as the counterfeit spirit.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the second meaning, the soul that receives mystery comes to the Place of
    the Rulers of the road of the Middle; the rulers come out before her in great
    fear, and the soul gives them the mystery of fear.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The soul gives Fate to her place and the counterfeit spirit to its place,
    gives defence with seals to Rulers on the roads, and gives honour, glory, respect,
    seals, and hymns to those of the Places of the Light.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A saying through Paulos about giving tribute, fear, custom, honour, and respect
    is explained as referring to the soul that has received mystery giving defence
    to all the Places.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the third meaning, the counterfeit spirit is described as an enemy to the
    soul, causing sins and passions and convicting her in punishment for the sins
    it caused.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The domestics of the soul are identified as the counterfeit spirit and Fate,
    which are enemies to the soul and cause sin and wickedness.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the fourth meaning, a soul that leaves the body and walks on the road with
    the counterfeit spirit but lacks the mystery loosening bonds and seals is taken
    by the counterfeit spirit to the Virgin of the Light, the judge.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Virgin of the Light examines the soul, finds sin and lack of the mysteries
    of the Light, and gives the soul to one of her Receivers, who casts her into a
    body.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The soul does not come out of the changes of the body or Sphere of Aeons until
    it has given the last Cycle reckoned to it.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The saying about reconciling with an enemy on the road, being delivered to
    judge and officer, being cast into prison, and not coming out until paying the
    last smallest coin is explained as an account of the soul's road with the counterfeit
    spirit and subsequent judgment.
  category: relationship
  evidence_refs:
  - ev:9
