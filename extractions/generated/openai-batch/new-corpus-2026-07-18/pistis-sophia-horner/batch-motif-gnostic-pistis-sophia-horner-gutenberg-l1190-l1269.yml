  summary: The introduction argues for the priority of the First Document, describing
    it as an orderly account of a heavenly hierarchy and its places, then summarizes
    the Pistis Sophia episode as an allegory of transgression, repentance, deliverance
    from Chaos, loss and restoration of light, blocked return without divine aid,
    and the condemnation of magic and astrology as unlawful knowledge from sinning
    angels.
