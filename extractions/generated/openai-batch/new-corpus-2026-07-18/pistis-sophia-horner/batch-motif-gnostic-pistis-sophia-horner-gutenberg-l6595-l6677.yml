  quote: ''
  summary: The passage first catalogs what the Mystery knows concerning the becoming
    of moral oppositions, cosmological entities, places, gates, saviors, Amens, and
    trees. Jesus then tells the disciples to prepare to hear about the Place of truth
    and the Ineffable. The disciples fall silent; Maria Magdalene supplicates Jesus
    and asks how anyone can understand such a Mystery. Jesus reassures the disciples
    and says the Mystery belongs to them and to those who hearken and renounce the
    world, matter, evil thoughts, and cares of the Aeon.
