canonical_text:
  quote: ''
  summary: Salome asks the Saviour how a Mosaic law about forsaking father and mother
    applies if human parents are the Rulers. Maria the Magdalene, moved by the power
    of light within her, is authorized by the Saviour to answer. She says the law
    concerns the power from the Saviour, the Light-dweller within, and warns against
    remaining outside the Saviour and his mysteries. The Saviour then explains that
    Rulers bind a counterfeit spirit with the soul, command it to accuse the soul
    after death in places of judgment, and allow release only if the soul speaks mysteries
    and loosens seals and bonds. Otherwise the soul is punished and sent again into
    the cycle. The passage also describes cosmic Rulers, Ministers, Fate/Moira, and
    the placement of soul, power, counterfeit spirit, and fate into bodies and into
    the world.
  language: English
  quote_policy: summarized
