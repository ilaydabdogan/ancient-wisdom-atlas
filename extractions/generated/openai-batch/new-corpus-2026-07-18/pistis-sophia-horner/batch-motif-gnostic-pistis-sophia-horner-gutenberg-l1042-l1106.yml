  quote: ''
  summary: The passage summarizes the manuscript as a composite and imperfect collection
    of documents, then discusses why the miscellany may have been made. It notes customary
    Coptic religious headings and cross imagery, compares the Bruce Papyrus with the
    Oxford manuscript in passages about sacraments or baptisms, and argues that seals,
    diagrams, passwords, and names were omitted to prevent magical use. It then compares
    this precaution with secrecy warnings in recensions of the Book of the Dead and
    with a Christian homily describing the continued use of magical writings and names.
  language: English
  quote_policy: summarized
