  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Saviour says these higher mysteries forgive sins in the Places of the
    Rulers, and says the First Mystery and the mysteries of the Ineffable forgive
    every sin and unlawfulness of the soul.
  category: speech
  evidence_refs:
  - ev:8
