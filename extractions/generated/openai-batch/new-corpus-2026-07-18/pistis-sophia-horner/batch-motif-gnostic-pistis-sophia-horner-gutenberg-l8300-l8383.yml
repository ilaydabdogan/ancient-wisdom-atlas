canonical_text:
  quote: ''
  summary: The passage explains how sinful souls are witnessed against, sealed with
    their sins, and judged. The mysteries of the baptisms are described as a fierce
    wise fire that burns sins, enters soul and body, separates counterfeit spirit/Fate/body
    from soul/power, and purifies. Maria interprets the Saviour's sayings about fire,
    baptism, and division in this sense; the Saviour approves her explanation and
    then contrasts other higher mysteries' modes of forgiving sins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sinful souls in the World are said to be observed by Contentious Ministers
    who bear witness to their sins for judgments outside the Chaoses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The counterfeit spirit bears witness to the soul's sins, seals and affixes
    the sins to the soul, and makes the number of sins known to the Rulers of the
    judgments.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mysteries of the baptisms become a great, fierce, wise fire and burn sins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The baptism mysteries enter the soul in concealment and consume the sins affixed
    by the counterfeit spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The baptism mysteries enter the body in concealment, pursue the pursuers,
    and separate the counterfeit spirit and Fate from the power and the soul.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The mystery of baptism remains between the separated parts so that it can
    cleanse and purify them from defilement by matter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Maria cites sayings about fire cast on earth, a baptism to be baptized in,
    absence of peace, division, and five in one house divided three against two and
    two against three.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Maria interprets the fire cast on earth as the mysteries of the baptisms brought
    into the world to consume and purify the sins of the soul.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Maria interprets the division saying as the separation of counterfeit spirit,
    body, and Fate on one side from soul and power on the other side.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Saviour praises Maria as a spiritual one of pure Light and states that
    her explanation is correct.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Maria asks whether the mysteries of the three Spaces, the First Mystery, and
