canonical_text:
  quote: ''
  summary: The passage describes two array-rulers, Ariuth the Ethiopian-woman and
    Hecate the three-faced, their subordinate demons, the human vices they provoke,
    and the postmortem punishments of souls in their places. In each case, an astral
    configuration involving the Sphere, little Sabaoth/Zeus, Bubasti/Aphrodite, and
    zodiacal houses leads to veils between Left and Right being drawn back; a higher
    figure looks out, the punitive places dissolve, and the souls are returned to
    the Sphere.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ariuth the Ethiopian-woman is named as the ruler of the second array, described
    as a black woman ruler with fourteen demons under her who rule over many other
    demons.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The demons under Ariuth enter quarrelsome people, excite wars and killings,
    and give hardness and anger to their hearts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Souls taken by Ariuth by robbery spend one hundred thirteen years in her places,
    where she torments them with smoke of darkness and evil fire until they draw near
    destruction.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the Sphere turns, little Sabaoth the good, called Zeus in the world,
    comes to the fourth Aeon called the Crab, and Bubasti, called Aphrodite in the
    world, comes to the tenth House called the He-goat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After that configuration, veils between those of the Left and those of the
    Right are drawn back; Ieou looks out on the Right, the world and Aeons are disturbed,
    Ariuth's places are dissolved and destroyed, and the souls in her punishments
    are returned to the Sphere.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hecate, described as three of face, is named as the ruler of the third array,
    with twenty-seven demons under her authority.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The demons under Hecate enter people and cause them to swear falsely, lie,
    and love what is not their own.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Souls taken by Hecate by robbery are delivered to her demons, tormented by
    smoke of darkness and evil fire, afflicted greatly, and punished for one hundred
    five years and six months before beginning to be destroyed and perish.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the Sphere turns again, little Sabaoth the good, called Zeus, comes to
    the eighth House called the Scorpion, and Bubasti, called Aphrodite, comes to
    the second House called the Bull.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After that configuration, veils between Left and Right are drawn back; Zorokothora
    Melkhisedek looks out from the Height, the world, mountains, and rulers are disturbed,
    Hecate's places dissolve and perish, and the souls in her punishments are returned
    to the Sphere.
  category: sequence
  evidence_refs:
  - ev:9
