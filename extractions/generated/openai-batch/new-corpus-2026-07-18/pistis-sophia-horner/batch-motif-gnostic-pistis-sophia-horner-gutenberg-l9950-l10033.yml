canonical_text:
  quote: ''
  summary: The passage gives question-and-answer descriptions of post-mortem punishments
    for a curser, a continual slanderer, a murderer, and a thief or robber. Souls
    are removed from bodies by named receivers, taken through places such as the World,
    Amente, Chaos, the road of the Middle, and the Virgin of the Light, punished by
    rulers and demons, judged, purified or destroyed, and in some cases made to drink
    a cup of forgetfulness before being put into another body.
  language: English
  quote_policy: summarized
