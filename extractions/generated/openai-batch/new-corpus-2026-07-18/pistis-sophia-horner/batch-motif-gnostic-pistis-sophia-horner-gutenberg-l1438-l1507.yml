canonical_text:
  quote: ''
  summary: 'The passage summarizes reported Valentinian teaching: a Supreme God generates
    divine powers and syzygies forming the Pleroma; Sophia falls outside the Pleroma,
    is restored by Christ and the Holy Spirit, and becomes Sophia Without; Jesus is
    emanated to console her and remain with her as spouse; her passions become cosmic
    substances, a path for repentance, and rulers or domains of the cosmos, heavens,
    material world, and chaos.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that little is known directly of Valentinus’ own teaching
    because later writers mainly report the doctrines of his successors or opponents’
    summaries.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hippolytus is reported as saying that Valentinus declared the Supreme God
    to be “all Love” and to have created subsequent things in order to have something
    to love.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Supreme God’s first and greatest creation is described as Nous or Mind,
    also called Monogenes, Only One, or Father; from Nous came Logos or Word, and
    from Logos came Anthropos or Man.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that these powers produced offspring with female assistance,
    either as beings both male and female or as beings with named spouses such as
    Aletheia, Zoe, and Ecclesia; the Supreme God or Abyss is also said in some accounts
    to have Sige or Charis as spouse.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Groups of syzygies or pairs are said to form a Hebdomad or Ogdoad, then a
    Decad and a Dodecad, and the collection of divine beings is called the Pleroma
    or Fulness of the Godhead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The lowest member of the Pleroma is said to fall away from the Godhead and
    stray outside the Pleroma, requiring Christ and the Holy Spirit to restore her
    and Horos or Stauros to preserve the Pleroma from contact with the Kenoma or Void.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before returning to the Pleroma, Sophia gives birth without male assistance
    to a being compared to Genesis’ “earth without form and void,” and Christ and
    the Holy Spirit fashion this being into a perfect Æon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sophia Without suffers fear, grief, perplexity, and supplication, and prays
    to the syzygy that had given her form for deliverance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In answer to Sophia’s prayers, Jesus, the Great High Priest, emanates from
    the Godhead, consoles Sophia Without, strips her of her passions, and remains
    with her as spouse in the Heavenly Jerusalem.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'Sophia’s passions are transformed rather than destroyed: fear becomes the
    essence of soul, grief becomes the essence of matter, perplexity becomes the essence
    of demons, and supplication becomes a path for repentance.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The essence of soul becomes the Architect of the Cosmos, rules in the Heavenly
    Jerusalem or Ogdoad over the Seven Heavens, and is unaware of superior powers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The material cosmos is said to be ruled by Diabolos, and the Chaos below all
    is ruled by Beelzebub.
  category: relationship
  evidence_refs:
  - ev:8
