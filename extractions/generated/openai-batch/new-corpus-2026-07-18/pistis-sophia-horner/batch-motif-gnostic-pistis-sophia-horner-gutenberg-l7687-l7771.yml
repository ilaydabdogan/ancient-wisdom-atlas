- id: obs:1
  text: A man whose repentance is no longer received is said not to have his soul
    cast back to the World on the Height, but to have a dwelling place in the dragon
    of outer Darkness.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The instruction describes reproving a sinning brother first privately, then
    with another, then before the ecclesia; persistent failure makes him a scandal
    and transgressor.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two or three witnesses are identified with three mysteries that become witnesses
    to a person's last repentance.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The First Mystery of the First Mystery and the mystery of the Ineffable alone
    are said to receive a certain repentance and forgive sins at every time.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:8
- id: obs:5
  text: Iohannes asks whether a greatly sinful brother who has renounced the World,
    its matter, sins, and cares, and who is not acting in guile or hypocrisy, may
    receive mysteries of the second or third Space.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Saviour says that if such a person is known exactly to have renounced
    worldly cares and sins and to desire God in truth, the mysteries of the second
    and third Space should not be hidden from him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
