canonical_text:
  quote: ''
  summary: The Saviour teaches Iohannes and the disciples rules for giving mysteries
    to sinners and penitents. Repeated failure after receiving mysteries makes the
    three mysteries witnesses against the person; the person becomes a transgressor
    and is assigned to the dragon of outer Darkness. Only the First Mystery and the
    Ineffable receive and forgive a final repentance. Iohannes then asks about preaching
    to people whose sincerity is unknown.
  language: English
  quote_policy: summarized
