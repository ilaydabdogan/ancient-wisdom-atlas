  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If a recipient of mysteries in the second or third Space sins again, giving
    may continue until the third time; after that, the mysteries are not to be given
    again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A person who sins after the threefold limit is described as having a dwelling
