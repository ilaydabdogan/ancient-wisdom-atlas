canonical_text:
  quote: ''
  summary: After Jesus draws the glory of his light back to himself, the disciples
    worship him and ask about his absence and the disturbances. Jesus says he has
    returned from the Places from which he came and now has authority from the Ineffable
    and the First Mystery to speak openly about the Truth, the Height, and the Pleroma.
    He explains that while on the Mount of Olives, at sunrise, the First Mystery commanded
    that his vesture of light be sent to him from the Last or twenty-fourth mystery.
    He says this enables him to reveal the Truth to mankind and to the chosen disciples.
    He further says he brought twelve powers from the twelve Saviours of the Treasury
    of Light, placed them in the disciples, and that these powers will help them save
    the world and endure the Rulers. He then describes coming among the Rulers in
    the likeness of Gabriel, sowing a power from little Iao into Elisabeth before
    John’s conception, and bringing the soul of Helias through the Virgin of Light
    and her Receivers into Elisabeth’s womb, so that the power of little Iao and the
    soul of Helias are bound in John the Baptist.
  language: English
  quote_policy: summarized
