canonical_text:
  quote: ''
  summary: Jesus explains that Helias came and that the soul of Helias is bound in
    Iohannes the Baptist. He then tells his disciples that, by command of the First
    Mystery, he looked down on the world, found Maria, spoke with her in the form
    of Gabriel, and cast heavenly powers into her and into the sphere of the rulers,
    resulting in the disciples being produced in the world without souls of the rulers.
    On the Mount of Olives he tells the disciples to rejoice because the time has
    come for him to put on his vesture, receive authorities, and reveal all mysteries.
    At sunrise a great power of light descends with his vesture, bearing writing whose
    interpretation summons him upward to fellow members at the last Boundary and instructs
    him to put it on, with two further vestures to follow.
  language: English
  quote_policy: summarized
