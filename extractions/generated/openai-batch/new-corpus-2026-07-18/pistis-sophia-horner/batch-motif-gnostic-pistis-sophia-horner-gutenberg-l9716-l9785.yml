canonical_text:
  quote: ''
  summary: Jesus describes two hostile cosmic arrays and their rulers, the demons
    under them, the moral disorders they cause among humans, the fixed punishments
    imposed on souls, and periodic cosmic alignments in which veils are drawn back,
    punitive places dissolve, and souls are thrown back to the Sphere. The disciples
    respond with prostration and a plea for mercy and deliverance, and Jesus reassures
    them that he will give them authority and the keys of the kingdom of the heavens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fourth array is ruled by the Assessor of the Typhon, described as a strong
    ruler with thirty-two demons under his authority.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The demons under the fourth ruler are said to enter men and cause lust, fornication,
    adultery, and continual intercourse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Souls connected with the fourth ruler's punishments spend one hundred thirty-eight
    years in his places and are tormented by smoke of darkness and evil fire until
    they waste away and perish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the Sphere turns, the little Sabaoth, also called Zeus, comes to the
    ninth Aeon called the Archer, and Bubasti, also called Aphrodite, comes to the
    third Aeon called the Twin; veils between those of the Left and those of the Right
    are drawn back.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Zarazaz, also called Maskelli, looks upon the dwelling places of the Assessor
    of the Typhon; those places dissolve and perish, and souls in the punishments
    are taken away and thrown back to the Sphere.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The fifth array is ruled by Iakhthanabas, described as a strong ruler with
    many demons under him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The demons under Iakhthanabas are said to enter men and cause partiality,
    wronging of the righteous, favoring sinners, bribery against true judgment, forgetting
    the poor and needy, and forgetfulness of life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Souls connected with Iakhthanabas's punishments spend one hundred fifty years
    and eight months there and are wasted away by smoke of darkness, evil fire, and
    flame.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In another turning of the Sphere, Sabaoth/Zeus comes to the eleventh Aeon
    called the Water-bearer and Bubasti comes to the fifth Aeon called the Lion; the
    veils are drawn back, the great Iao looks down on Iakhthanabas's places, the places
    dissolve, and the souls are thrown back to the Sphere.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Jesus identifies these events as actions of the roads of the Middle.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The disciples prostrate, worship, and ask Jesus for help, compassion, salvation
