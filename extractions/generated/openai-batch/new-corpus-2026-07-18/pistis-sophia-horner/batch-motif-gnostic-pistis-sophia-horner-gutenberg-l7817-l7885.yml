canonical_text:
  quote: ''
  summary: Maria worships at Jesus' feet and asks about using mysteries to rescue
    a deceased sinner or kinsman from punishments and judgments. The Saviour explains
    a rite involving the third mystery of the Ineffable, removal of the soul from
    the punishments of the Rulers, sealing by the Virgin of the Light, reception by
    her Receivers, and casting into a righteous body that will inherit the kingdom
    of the Light. Maria then asks about mysteries that avert cruel destined deaths
    and persecution; the Saviour says that one who completes and names the first mystery
    is delivered from the Rulers of Destiny, leaves the body, becomes an effluence
    of Light, and ascends to the Place of its Kingdom without needing answer or defence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maria worships at the feet of Jesus, kisses them, asks permission to seek
    from him, and is told by the Saviour to ask what she wishes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mariham asks what should be done when a good brother filled with mysteries
    of the Light grieves for a brother, kinsman, or other man who has died and is
    in cruel judgments and punishments.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Saviour instructs the disciples to perform the third mystery of the Ineffable
    and to speak a request that the soul of the man they have in mind be taken from
    the punishments of the Rulers and brought quickly to the Virgin of the Light.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Virgin of the Light is said to seal the person with a more excellent seal
    and cast him into a body that will become righteous and good, after which he will
    go to the Height and inherit the kingdom of the Light.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those who work in the array of the judgments of the Rulers pass the soul from
    hand to hand until it reaches the Virgin of the Light; the Virgin seals it with
    a sign of the kingdom of the Ineffable and gives it to her Receivers, who cast
    it into a righteous body.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Maria asks about mysteries that would prevent or bypass deaths reckoned by
    the Rulers of Destiny, including death by sword, waters, torture, torment, violence,
    or other evil deaths, especially amid persecution for Jesus' name.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Saviour says that anyone who completes the first mystery with its figures,
    types, and positions, and later names that mystery, will be delivered from what
    the Rulers of Destiny have reckoned for him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: At that hour the person comes out of the body of the matter of the Rulers;
    his soul becomes a great effluence of Light, flies to the Height, passes through
    every Place of the Rulers and every Place of the Light, and reaches the Place
    of its Kingdom.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The soul in the ascent does not give answer or defence in any Place because
    it is described as one without symbol.
  category: attribute
  evidence_refs:
  - ev:7
