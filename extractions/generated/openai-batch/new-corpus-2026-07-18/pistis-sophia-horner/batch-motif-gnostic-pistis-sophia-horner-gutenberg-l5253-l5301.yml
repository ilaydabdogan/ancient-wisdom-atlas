canonical_text:
  quote: ''
  summary: The passage explains words attributed to David as applying to Pistis Sophia.
    Her enemies, the emanations of the Self-willed, fall around her and in Chaos;
    the First Mystery removes their power as recompense. Because Pistis Sophia believes
    in the Light and hymns while oppressed, she is protected. Gabriel and Mikhael
    guide and lift her through the Places of Chaos so she does not touch the darkness
    below. Coming up from Chaos, she tramples serpent-, basilisk-, lion-, and dragon-faced
    hostile powers and is delivered.
  language: English
