  summary: The passage repeatedly describes a Mystery that knows why various transcendent
    groups despoiled themselves, were arranged into places, spaces, and arrays, and
    proceeded from Fatherless ones, triple spirits, or the Ineffable. It lists Incorruptible
    ones, Boundless ones, Uncontainable ones, hymners, triple-spirit mysteries, five
    Trees, and Pre-Uncontainable ones, then announces a coming revelation of the Distribution
    of the Universe according to places and arrays.
