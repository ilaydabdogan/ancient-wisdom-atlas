canonical_text:
  quote: ''
  summary: 'Maria Magdalene asks Jesus for exact clarification about those who receive
    the mysteries of the Light and their rank relative to the emanations of the Treasury.
    Jesus promises exact revelation and describes, for the consummation and catching-up
    of the Universe, a ranked arrangement in the Inheritances and Treasury of the
    Light: twelve Saviours, seven Voices, five Trees, Amens, Twin-saviours, and nine
    Guards stand in ordered places around him and in relation to the souls who received
    successive mysteries.'
  language: English
  quote_policy: summarized
