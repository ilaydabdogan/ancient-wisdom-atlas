canonical_text:
  quote: the mystery of the raising of the dead
  summary: Maria prostrates at Jesus' feet, kisses them, and asks him to reveal and
    not hide. Jesus says he will reveal boldly and without parable. Maria asks whether
    the mystery was brought so that, when people do not believe or listen, performing
    it would show the truth of their preaching. The Saviour, speaking among the disciples,
    says he had given this mystery before and repeats that anyone who completes the
    mystery of raising the dead can cure demons, pain, sickness, disabilities, and
    bodily conditions, and that requested effects will happen instantly.
  language: English
