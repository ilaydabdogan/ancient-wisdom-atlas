canonical_text:
  quote: the First Mystery dispatched to thee through us the mystery of all his glory,
    being two vestures
  summary: A speaker reports that the First Mystery has sent the addressee two vestures
    containing the glory and names of many mysteries, emanations, powers, and celestial
    orders. The hidden light within the vesture is unknown to lower spheres and places.
    The addressee is urged to come quickly, put on the vestures by command of the
    First Mystery, complete the appointed service, ascend to the speakers, cease being
    in the world, and receive glory.
  language: English
