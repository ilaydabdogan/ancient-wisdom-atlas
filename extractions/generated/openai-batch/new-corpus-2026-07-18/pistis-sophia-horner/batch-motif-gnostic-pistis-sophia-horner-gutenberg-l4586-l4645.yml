canonical_text:
  quote: ''
  summary: Jesus praises Martha, then tells the disciples that the time had come to
    raise Pistis Sophia from Chaos. He says he sent a power of light from himself
    down into Chaos to bring her upward, though the final command from the First Mystery
    had not yet come. The emanations of the Self-willed pursue her, and Pistis Sophia
    hymns the Light for deliverance, asking that her pursuers be cast down, darkened,
    and prevented from taking her light. Jesus asks for an explanation; Salome says
    her power compelled her to explain and cites a prophecy attributed to Solomon
    with parallel language of deliverance, obscuring persecutors, and failed plots.
    Jesus confirms Salome’s explanation.
