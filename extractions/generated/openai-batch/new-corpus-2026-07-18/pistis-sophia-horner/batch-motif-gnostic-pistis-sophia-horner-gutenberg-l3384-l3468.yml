canonical_text:
  quote: ''
  summary: A hymn of Pistis Sophia's first repentance recounts affliction by cosmic
    rulers and emanations, loss of light and power, distress in darkness, Chaos, and
    matter, and an appeal to the Light for mercy, deliverance, and judgment against
    hostile powers. The hymn turns to praise, purification, and the deliverance of
    souls into a city in the Light. Jesus then identifies the hymn to his disciples
    as Pistis Sophia's first repentance.
  language: English
