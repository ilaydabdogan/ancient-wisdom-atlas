canonical_text:
  quote: ''
  summary: Pistis Sophia is restored to light, angering the emanations of the Self-willed.
    The Self-willed sends a great power of light down to Chaos to aid them. The emanations
    persecute Pistis Sophia, some taking serpent, seven-headed basilisk-serpent, and
    dragon forms, while a lion-faced power joins them. Pistis Sophia flees within
    Chaos. Adamas the tyrant sees her, is angry because she wishes to go to the Light
    of Lights, and his power thrusts her down. Surrounded and threatened, Pistis Sophia
    cries and hymns to the Light for help and deliverance.
  language: English
  quote_policy: summarized
