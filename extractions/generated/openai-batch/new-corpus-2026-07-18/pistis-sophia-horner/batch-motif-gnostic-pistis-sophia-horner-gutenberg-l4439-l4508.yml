canonical_text:
  quote: ''
  summary: Jesus praises Salome, promises completion in the mysteries of the kingdom
    of light, and narrates to the disciples how he approached the Chaos. The lion-faced
    power fears his illumination and calls on the Self-willed God, who looks down
    from the thirteenth Aeon and seeks to help it. The lion-faced power and its emanations
    oppress Pistis Sophia and try to take her light. Sophia cries to the Height and
    to Jesus, then speaks her twelfth repentance, appealing to the Light for judgment
    against the Self-willed and his powers, for the purification and removal of their
    lights, and for rescue from her own weakened and mocked condition.
  language: English
  quote_policy: summarized
