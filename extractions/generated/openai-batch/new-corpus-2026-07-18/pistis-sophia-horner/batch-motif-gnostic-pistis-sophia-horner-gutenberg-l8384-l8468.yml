canonical_text:
  quote: ''
  summary: In a dialogue, the Saviour answers Maria about the effects of receiving
    the mysteries of the First Mystery and of the Ineffable. Maria interprets the
    teaching through words attributed to David about forgiven and unreckoned sin.
    The Saviour teaches that recipients of the First Mystery may be forgiven after
    repeated repentance up to a stated limit, while the mysteries of the Ineffable
    forgive at every time if repentance occurs while living. For recipients who transgress
    and die unrepentant, the passage describes severe judgment, outer Darkness, consumption,
    and non-return to bodily changes.
  language: English
  quote_policy: summarized
