canonical_text:
  quote: ''
  summary: The passage describes how the Ministers of the Rulers arrange conception,
    bring parts into the womb, knead blood and build the embryo’s members over specified
    periods, call the counterfeit spirit, soul, and mixture of power into the body,
    seal the human form at several locations, transmit seal-information to punitive
    authorities, and describes Fate following the embodied soul until the appointed
    kind of death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ministers of the Rulers cast a part into the woman and a part into the
    male and compel them to harmonize, even from a great distance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The counterfeit spirit in the male comes to the part deposited in the matter
    of his body, takes it away, and casts it into the womb of the woman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Three hundred and sixty-five Ministers of the Rulers enter and lodge in the
    woman’s belly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Ministers hold back the blood from the woman’s food and drink in her belly
    for forty days and knead it in the womb.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the forty days, the Ministers spend thirty more days building the members,
    and the body is completed with all its members in seventy days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After building the body, the Ministers call the counterfeit spirit, then the
    soul, then the mixture of the power into it; Fate is placed outside and follows
    at a distance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Ministers seal the body and its components with seals given by the Rulers
    at the left hand, right hand, skull, behind the head, cerebellum, heart, and forehead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Ministers give the speciality of the seals to the Contentious Rulers and
    their Receivers so they know the times for bringing souls out of bodies and bringing
    forth bodies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Receivers’ agents are to follow the soul and witness every sin done by
    the soul with the counterfeit spirit, in relation to punishments in judgments.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: When the months of childbearing are complete, the child is brought forth with
    the mixture of power, soul, and counterfeit spirit small within him, while Fate
    remains great and not mixed into the body.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Fate follows the soul with the body and counterfeit spirit until the soul
    comes out of the body, according to the death reckoned by the Rulers of the great
    Destiny.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Possible deaths named include death by wild beast, creeping thing, falling
    into a pit, strangling, water, and other worse deaths.
  category: other
  evidence_refs:
  - ev:5
