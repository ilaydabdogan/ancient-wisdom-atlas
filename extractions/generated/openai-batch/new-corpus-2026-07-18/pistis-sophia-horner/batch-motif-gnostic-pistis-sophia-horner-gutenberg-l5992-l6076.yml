canonical_text:
  quote: ''
  summary: Maria Magdalene asks Jesus to reveal the nature and light of the twenty-four
    Invisibles. Jesus says they cannot be compared with anything in the world, describes
    their light and scale by comparison with the sun and higher lights, and promises
    to take Maria and the fellow-disciples through successive higher regions where
    lower realms will appear dark, tiny, and distant.
  language: English
  quote_policy: summarized
