canonical_text:
  quote: ''
  summary: The passage is a scholarly introductory discussion of dating and sources
    for the Third, Fourth, and Fifth Documents of Pistis Sophia. It notes a royal-pardon
    analogy in the Third Document, magic, astrology, unintelligible divine language,
    and the Great Name in the Fourth Document, and demonic punishment, hell torments,
    and reincarnation-linked infirmities in the Fifth Document. It compares several
    features with late antique, Coptic, Egyptian, Cabalistic, Pauline-apocalyptic,
    and Manichaean-related materials, then summarizes the author’s view that the documents
    belong to the school of Valentinus with differing dates.
  language: English
  quote_policy: summarized
