  text: Petros comes forward, addresses his Lord, and says the Lord’s power of light
    had prophesied by Solomon in his Odes about an effluence that became a wide river.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the quoted Ode, the effluence draws all things toward the Temple and cannot
    be held by strong banks, built places, or arts of those who hold waters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the quoted Ode, those on dry sand drink, thirst is quenched, dry lips are
    turned, souls giving up breath are preserved from death, fallen limbs are set
    up, eyes receive light, and all are delivered through water of life eternal.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
