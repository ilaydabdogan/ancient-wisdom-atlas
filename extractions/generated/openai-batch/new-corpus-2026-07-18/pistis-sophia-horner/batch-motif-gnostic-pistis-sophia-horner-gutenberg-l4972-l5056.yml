canonical_text:
  quote: ''
  summary: Petros comes forward and interprets a passage attributed to Solomon’s Odes
    about an effluence becoming a great river and water of life. He explains it as
    an effluence of Light from the First Mystery that enters Chaos, recovers the lights
    taken from Pistis Sophia by the emanations of the Self-willed, restores her body
    and powers, gives perception and mutual recognition, and returns to the First
    Mystery, identified as the Temple. The First Mystery praises Petros’ explanation.
  language: English
  quote_policy: summarized
