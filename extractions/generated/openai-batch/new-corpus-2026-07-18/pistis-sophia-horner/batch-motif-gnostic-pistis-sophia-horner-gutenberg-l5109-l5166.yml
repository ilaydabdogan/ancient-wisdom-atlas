  quote: and it became a crown of light unto her head.
  summary: The speaker recounts that, by command of the Father, Gabriel and Mikhael
    are sent with effluences of Light to aid Pistis Sophia in Chaos. Light surrounds
    and crowns her, hostile emanations lose the ability to approach or harm her, the
    First Mystery descends and strips powers of their light, and Pistis Sophia is
    brought out of Chaos while trampling serpent, basilisk, lion, and dragon-faced
    powers.
  language: English
