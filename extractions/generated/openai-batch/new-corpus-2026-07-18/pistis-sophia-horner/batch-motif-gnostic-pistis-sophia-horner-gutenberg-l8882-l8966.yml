canonical_text:
  quote: ''
  summary: Maria asks the Saviour about souls who receive mysteries and pass in beams
    of light through the Places to their inheritance. The Saviour explains that certain
    sinners or negligent initiates may be removed from punishments, escorted to the
    Virgin of the Light, or restored toward light. Maria presents the case of a person
    who received mysteries, failed further mysteries and purifying prayer, died unrepentant,
    and was taken into the dragon of outer Darkness. She petitions for mercy. The
    Saviour says that the mystery of one of the twelve names connected with the dragon’s
    chambers can, when spoken within the punishments, shake the dragon, open chamber
    doors toward heaven, and cause a chamber ruler to cast the souls out.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maria recalls that receivers of the mysteries of the Ineffable or First Mystery
    make beams with effluence of light and pass through every Place to the Place of
    their inheritance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Saviour confirms that those who receive the mystery while alive and then
    come out of the body pass through every Place to their inheritance in beams of
    light.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: For sinners who leave the body unrepentant, the passage says a mystery of
    the Ineffable can remove them from punishments and cast them into a righteous
    body or take them to the last array of the Light, but they cannot pass through
    the Places by their own action.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Receivers of Melkhisedek and Ministers of the Judges of the Rulers are described
    as taking souls and delivering them onward until they are brought close to the
    Virgin of the Light.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Maria describes a man who received mysteries of the Light, failed to receive
    further interior mysteries, neglected a prayer concerning food and drink, was
    bound to the Pole of the Destiny of the Rulers, sinned again, and died before
    repenting.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The negligent man is said to have been taken into the midst of the dragon
    of the outer Darkness because of his sins and to lack a helper in the World to
    perform the mystery for him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Maria asks that such a soul not be forsaken, asks mercy for souls of this
    kind, and calls the Saviour the key that opens and shuts the door of the Universe.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Saviour calls Maria happy and, in mercy, instructs that people of this
    type should be given the mystery of one of the twelve names of the chambers of
    the dragon of the outer Darkness while alive.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Saviour says that even great sinners, transgressors, or people who did
    no mystery may, after bodily cycles and unrepentant death, be left in the punishments
    in the midst of the dragon.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: If such souls know and say one of the names while within the punishments of
    the dragon, the dragon is shaken and disturbed, the chamber doors open toward
    heaven, and the chamber ruler casts the souls out.
  category: sequence
  evidence_refs:
  - ev:7
