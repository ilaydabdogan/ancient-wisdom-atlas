canonical_text:
  quote: ''
  summary: Maria asks Jesus about the nature of the outer Darkness and its places
    of punishment. Jesus describes the outer Darkness as a great encircling dragon
    containing twelve punishment chambers, each associated with rulers of differing
    animal-faced forms and names. The passage ends by describing doors of the chambers
    open toward the Height, angels guarding those doors, and Ieou appointing those
    guards to restrain the dragon and its rulers.
  language: English
  quote_policy: summarized
