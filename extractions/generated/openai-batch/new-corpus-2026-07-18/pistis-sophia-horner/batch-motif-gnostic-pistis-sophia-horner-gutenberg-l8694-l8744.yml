    Khremaor.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The rulers in the twelve chambers have names according to the hour and change
    face according to the hour.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Each of the twelve chambers has a door open to the Height, and an Angel of
