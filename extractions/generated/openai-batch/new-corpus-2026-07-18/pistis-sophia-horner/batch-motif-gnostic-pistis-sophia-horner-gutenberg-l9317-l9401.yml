candidate_motifs:
- id: motif:1
  label: saving mysteries as initiation and purification
  taxonomy_refs:
  - initiation
  - wisdom
  basis: The passage repeatedly says that mysteries are necessary for sinners and
    righteous people to be purified, made Light, and taken to the Light.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:7
  - ev:11
  confidence: high
  cautions: The passage does not describe a formal ritual sequence beyond seeking,
    receiving mysteries, and purification.
- id: motif:2
  label: liberation from cosmic bonds into a realm of Light
  taxonomy_refs:
  - ascent
  basis: The Saviour says he unlooses believers from the bonds and seals of the Aeons
    of the Rulers and binds them into the arrays and inheritances of the Light in
    the Height or land of Light.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage emphasizes transfer to Light and release from rulers; it gives
    little itinerary detail for an ascent journey.
- id: motif:3
  label: purifying judgment by winnowing and fire
  taxonomy_refs:
  - divine_judgment
  basis: John’s prophecy describes a coming figure purifying a threshing-floor, burning
    chaff in unquenchable fire, and gathering wheat into a barn.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The Saviour reinterprets the prophecy in terms of mysteries and purification
    of sinners, so the judgment image is embedded in a Gnostic explanatory frame.
- id: motif:4
  label: discernment of true and false teaching
  taxonomy_refs:
  - wisdom
  basis: The Saviour tells seekers to act like wise money-changers, accepting the
    good and casting out the bad, and to test whether teachings agree with his words
    and cosmic knowledge.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: This is an instructional motif rather than a narrative action pattern.
- id: motif:5
  label: flood-protected hidden books of revelation
  taxonomy_refs:
  - flood_and_renewal
  - wisdom
  basis: The Saviour says the Books of Ieou containing mysteries were written by Enokh,
    placed in the rock of Ararad, and guarded because of the Flood so that no Ruler
    would destroy them.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage mentions the Flood as the reason for preservation but does
    not narrate the Flood itself.
- id: motif:6
  label: revelation from trees of knowledge and life
  taxonomy_refs:
  - wisdom
  basis: The Saviour says he spoke with Enokh out of the Tree of Knowledge and the
    Tree of Life while causing him to write the Books of Ieou.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage names the trees as the source or setting of speech but does
    not elaborate their cosmological function.
comparison_claims:
- id: claim:1
  claim: The passage itself links the Saviour’s mystery-based purification to a John
    the Baptist prophecy involving water baptism, winnowing, wheat and chaff, and
    unquenchable fire, supporting a cautious same-motif comparison with the cited
    baptism-and-judgment pattern.
  claim_level: same_motif
  target: John the Baptist baptism, winnowing, and fire judgment pattern cited within
    the passage
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to the intertextual link stated in the passage;
    the passage reinterprets the cited pattern through its own language of mysteries
    and Light.
- id: claim:2
  claim: The placement and guarding of the Books of Ieou in the rock of Ararad because
    of the Flood supports a cautious same-function comparison with flood-preservation
    traditions in which sacred knowledge survives a world-threatening flood.
  claim_level: same_function
  target: flood-preserved sacred knowledge pattern
  evidence_refs:
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not narrate the Flood or explicitly compare itself
    with another flood text; it only states that the books were guarded because of
    the Flood.
