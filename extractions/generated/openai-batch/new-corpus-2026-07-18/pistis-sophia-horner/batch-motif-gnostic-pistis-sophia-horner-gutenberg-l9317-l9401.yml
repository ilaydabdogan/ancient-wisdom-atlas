canonical_text:
  quote: ''
  summary: Maria asks about destiny, good and evil works, and how seekers can recognize
    true teaching. The Saviour answers that destiny’s reckoning comes upon people,
    but he has brought the keys and mysteries of the kingdom of Light to free sinners
    and righteous alike from the bonds and seals of the Aeons and bring them into
    the Light. He cites John the Baptist’s prophecy of water baptism, purification,
    winnowing, and unquenchable fire, then instructs hearers to test teachings by
    whether they agree with his words and cosmic knowledge. He also says the righteous
    must find the mysteries in the Books of Ieou, which he caused Enokh to write in
    paradise while speaking from the Trees of Knowledge and Life, placed in the rock
    of Ararad, and guarded because of the Flood.
  language: English
  quote_policy: summarized
