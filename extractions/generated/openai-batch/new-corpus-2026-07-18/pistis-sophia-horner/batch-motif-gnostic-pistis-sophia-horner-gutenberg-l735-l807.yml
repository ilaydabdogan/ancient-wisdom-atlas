canonical_text:
  quote: ''
  summary: The passage summarizes lesser mysteries that grant postmortem ascent to
    heaven through a defence, password, and symbol; Andrew questions the danger of
    the after-death journey among cosmic powers and Jesus answers with a shared-origin
    statement. It also describes repetitive rhetorical lists about the Mystery of
    the Ineffable One, cosmic antitheses and hierarchies, compares this practice to
    Egyptian funerary naming scenes, and briefly describes an interpolated fragment
    about the Ineffable One and Jesus' revelations.
  language: English
