canonical_text:
  quote: ''
  summary: Introductory commentary describes the Fourth Document as an independent
    post-resurrection revelation narrative. Jesus invokes the Father beside the sea,
    the heavens open, Jesus and the disciples ascend to the Middle Way, cosmic and
    astrological arrangements are explained, punishment chambers are shown, and Jesus
    later returns with the disciples to the Mountain of Galilee to perform a sacrament
    involving fire, water, wine, blood, bread, baptismal water, and remitting of sins.
    The passage also notes magical, astrological, Bruce Papyrus, and Fourth Gospel
    parallels or connections.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Fourth Document is described as coming from a book written independently
    of the preceding documents rather than as their continuation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The document places Jesus after rising from the dead on the third day, with
    disciples gathered around him and recalling that they left the world to follow
    him.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Jesus stands by an altar beside the sea called Ocean and invokes his Father
    using words described as a mixture of Hebrew, Egyptian, and perhaps Persian elements.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Jesus calls on the name of the Father of the Treasurehouse of Light,
    the heavens open, the true shapes of the sun and moon are revealed, and Jesus
    and the disciples are uplifted to the Middle Way below the Sphere.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Middle Way the arrangement of the stars is explained, and rebellious
    Rulers are said to be bound to the Sphere in zodiacal numbers under the sway of
    five planets.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The five planets are described as strengthened by Powers from several named
    higher beings or sources, with Jupiter receiving a Power from the Little Sabaoth
    the Good and being given rule over the others.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Jesus shows the disciples five torture-chambers of the Middle Way, each presided
    over by an Authority chosen from among rebellious Rulers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Authorities and their assistants punish particular sins, and the sins
    are said to have been caused by ministers who entered into man.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Among the presiding demons or related figures the passage names triple-faced
    Hecate, merciless Iakhthanabas, and the Egyptian god Typhon.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says terms of punishment for sinful souls are given and that these
    places of torment will dissolve when Venus and Jupiter take certain zodiacal positions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Jesus restores the heavens to their normal condition and returns with the
    disciples to the Mountain of Galilee.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: On the Mountain of Galilee Jesus celebrates a sacrament involving fire, water,
    wine, blood, and bread, accompanied by a sign involving the conversion of a cup
    of wine into baptismal water.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The sacrament is said to remit all sins of the disciples, and Jesus tells
    them to perform the same ceremony for those who will listen to their preaching.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Other baptisms of Fire and of the Holy Spirit of Light are mentioned, as are
    the Seven Sounds and the Great Name of God, which are said to destroy any demon
    and its tortures when spoken to it.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The document is said to end abruptly because four pages have been torn away.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: The passage notes that Mary asks only one question, without specifying whether
    she is Jesus' mother or Magdalene.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: The passage says the planet Venus is called Bubastis and that Egyptian, Greek,
    and Hebrew magic and astrology are present in nearly every line, with some Persian
    influence also noted.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:18
  text: The passage reports close connection with documents of the Bruce Papyrus and
    notes mentions of the Samaritan woman and the spear thrust at the Crucifixion
    as quotations from the Fourth Gospel.
  category: relationship
  evidence_refs:
  - ev:13
