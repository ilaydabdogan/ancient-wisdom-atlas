canonical_text:
  quote: ''
  summary: Maria the mother of Jesus cites a Solomonic ode about a living crown of
    truth, branches, fruits, and salvation. Jesus praises her and says the pledge
    of the First Mystery dwelt with her and will enable deliverance. Jesus then tells
    the disciples that Pistis Sophia's thirteenth repentance completed the ordered
    afflictions, that the time came to deliver her from Chaos and darkness, and that
    powers of Light from the Height and from Jesus met and produced a great effluence
    of light. Mariham interprets this through a Davidic psalm about mercy, truth,
    righteousness, and peace, identifying these as powers that deliver, steer, restore
    lights to, and reconcile Pistis Sophia. Jesus praises Mariham, and Maria asks
    permission to speak again.
  language: English
  quote_policy: summarized
