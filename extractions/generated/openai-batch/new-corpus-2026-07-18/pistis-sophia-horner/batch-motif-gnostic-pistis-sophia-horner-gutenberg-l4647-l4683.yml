canonical_text:
  quote: "“The Light becometh for a crown unto my head, and I shall not become outside
    it...”"
  summary: Jesus tells his disciples that after Pistis Sophia spoke in the Chaos,
    he caused the power of Light sent to deliver her to make a crown of light on her
    head. The crown protects her from the emanations of the Self-willed, evil matter
    within her is purged and perishes in the Chaos, and her true light combines with
    the light of Jesus’s power. Pistis Sophia hymns the protective light. Jesus then
    invites an explanation; Maria, the mother of Jesus, asks to speak, and Jesus authorizes
    her to explain Sophia’s words.
  language: English
  quote_policy: quoted
