canonical_text:
  quote: ''
  summary: Jesus speaks after praising Maria, and the passage introduces Pistis Sophia's
    ninth repentance. Pistis Sophia, oppressed in Chaos by emanations of the Self-willed,
    addresses the Light. She asks for deliverance, judgment against those who took
    away her power and light, and protection from the power with the face of a lion.
    She describes being compelled to reveal mysteries she does not know, sitting in
    darkness and lamentation, and seeking the Light. She asks that her enemies be
    cast into darkness and Chaos, and ends by desiring the thirteenth Aeon, the Place
    of righteousness, where she will hymn the Light.
  language: English
  quote_policy: summarized
