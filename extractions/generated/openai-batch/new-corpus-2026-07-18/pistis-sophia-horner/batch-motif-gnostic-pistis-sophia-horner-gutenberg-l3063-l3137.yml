canonical_text:
  quote: ''
  summary: Jesus says he altered the path of cosmic powers for the salvation and quicker
    purification of souls. Maria prostrates and asks how souls delay outside the place
    and how they are purified quickly. Jesus praises her question and explains that
    the Rulers of the Aeons, Destiny, and Sphere were bound by Ieou, while Melkhisedek
    and other receivers periodically remove, purify, and transfer light, and ministers
    use remaining matter to make souls sent into the world of mankind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jesus tells Philippos and all the disciples that he altered the rulers' path
    for the salvation of all souls.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jesus says that without the alteration the rulers would have destroyed many
    souls and delayed the completion of the number of perfect souls destined for the
    inheritance of the Height and the Treasury of the Light.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Jesus says the altered path confuses and disturbs the rulers, removes their
    power, purifies souls quickly, lifts up those who will be saved, and quickly dissolves
    those who will not be saved.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Maria comes forward, prostrates at Jesus' feet, asks leave to speak, and says
    she does not wish to anger him by repeated inquiry.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Maria asks how souls delay outside the place and how they are purified quickly.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Jesus answers Maria compassionately, praises her inquiry, and says he will
    reveal everything to the disciples accurately and boldly.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: Jesus says that before he preached to the rulers, the Rulers of the Aeons,
    Destiny, and Sphere were bound in bonds, spheres, and seals as Ieou the overseer
    of the Light had first bound them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each bound ruler remains in an array and walks according to a course established
    by Ieou.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: At the time of the number of Melkhisedek, the great Receiver of Light comes
    into the midst of the Aeons and bound rulers and takes away purgation of light
    from the Rulers of the Aeons, Destiny, and Sphere.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Melkhisedek removes what disturbs the rulers, puts a task-master over them
    in motion, causes them to turn quickly in orbit, and takes away their power through
    breath, tears, and sweat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Melkhisedek purifies the powers and carries their light to the Treasury of
    the Light; ministers gather the remaining matter and make souls of humans, beasts,
    creeping things, wild-beasts, and birds, sending them into the world of mankind.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Receivers of the sun and moon look at the courses of the Aeons, Destiny, and
    Sphere, take away the power of light, prepare it for the Receiver of Melkhisedek,
    and send material purgations to the lower Sphere to become souls.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The soul-making and casting into the world occur according to the cycle and
    turning of the rulers of the Sphere.
  category: sequence
  evidence_refs:
  - ev:6
