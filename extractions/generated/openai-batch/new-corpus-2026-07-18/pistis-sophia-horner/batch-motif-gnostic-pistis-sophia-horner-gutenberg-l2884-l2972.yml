canonical_text:
  quote: ''
  summary: The Saviour describes how the beings of the twelve Aeons and the Tyrants
    were disturbed by a great light, warred against it, burned and fell, and had a
    third of their powers removed. He says the Destiny and Sphere ruling them were
    removed and their influences were reorganized into left- and right-hand periods.
    Mariham asks to speak, interprets the teaching through a prophecy attributed to
    Esaias concerning Egypt, and is praised by Jesus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Those in the twelve Aeons see a great light coming from the speaker, become
    disturbed, run about, and the Aeons and heavens are moved because they do not
    know the mystery that has occurred.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Adamas the great Tyrant and the Tyrants in the Aeons begin to war against
    the light without knowing whom they are fighting, since they see only the surpassing
    light.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After warring against the light, the opposing beings burn one another, fall
    down in the Aeons, and become like dead earth-beings without breath.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker removes a third part of the powers of the opposing beings so they
    will not be able to accomplish their evil deeds or the magical works invoked by
    humans.
  category: action
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:5
  text: The speaker removes the Destiny and the Sphere that were lords over the opposing
    beings and sets them to spend six months turned left and six months turned right
    while fulfilling their influences.
  category: action
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: Ieou, called the overseer of the light, is said to have acted through the
    command of the First precept and the First Mystery in setting the beings to look
    left every hour while fulfilling their influences.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Jesus tells the disciples, "He who hath ear to hear let him hear"; Mariham
    hears this, gazes in the air for an hour, and asks permission to speak boldly.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Jesus addresses Mariham as happy, says he will complete her in the mysteries
    of the Height, and grants her permission to speak because her heart strains toward
    the Kingdom of the heavens more than her brothers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mariham restates the teaching about the removal of the rulers' power, Destiny,
    and Spheres, including the inability of hour-setters, enquirers, and revealers
    to show future events.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mariham cites a saying attributed to the power in Esaias concerning the vision
    of Egypt and interprets it as a prophecy about Jesus taking away the power of
    the Rulers of the Aeons, who are called Egypt because they are of matter.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Jesus praises Maria as happy beyond every woman on earth and says she will
    become the Pleroma of all Pleromas and the completion of all completions.
  category: speech
  evidence_refs:
  - ev:7
