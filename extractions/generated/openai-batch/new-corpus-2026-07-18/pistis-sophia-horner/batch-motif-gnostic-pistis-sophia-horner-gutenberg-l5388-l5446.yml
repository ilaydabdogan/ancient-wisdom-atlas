canonical_text:
  quote: "“thou struckest the serpent of basilisk, that of the seven heads”"
  summary: 'Thomas explains Pistis Sophia’s repentance as a deliverance from afflicting
    emanations, Chaos, and bonds through light. The First Mystery praises Thomas and
    reports Pistis Sophia’s hymn: she is brought from a high Aeon to lower Places,
    delivered from below, freed from hostile emanations, empowered to loosen bonds,
    rescued from material darkness, and renewed by purified light after the defeat
    of a seven-headed basilisk-serpent.'
