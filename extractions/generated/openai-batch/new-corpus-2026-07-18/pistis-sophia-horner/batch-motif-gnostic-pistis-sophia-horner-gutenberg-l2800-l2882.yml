canonical_text:
  quote: ''
  summary: A first-person speaker puts on a dispatched vesture after seeing mysteries
    in it, becomes immeasurably luminous, and ascends through the firmament, the first
    Sphere, the second Sphere called Destiny, and the twelve Aeons. At each level,
    gates or veils open, cosmic rulers and powers become afraid and disturbed, see
    their names or mysteries in the vesture, have their bonds or ordered places loosened,
    and prostrate, worship, and hymn toward the inward part of the inward parts. The
    passage closes by stating that the world could not have endured the speaker’s
    true light without dissolving.
  language: English
  quote_policy: summarized
