canonical_text:
  quote: ''
  summary: The Saviour answers Maria with instructions for using the mystery of the
    Ineffable and prayer to remove a sinner's soul from outer Darkness, judgments,
    or the dragon. Depending on whether the soul has completed its cycles, it may
    be sealed and sent into a righteous body, or taken through the Virgin of the Light
    and the seven Virgins of the Light for sealing, baptism, chrism, purification,
    and placement among the arrays or Treasury of the Light.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Saviour speaks in answer to Maria.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Unrepentant sinners who come out of the body are said to be taken to the outer
    Darkness and its punishments.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mystery of the Ineffable is described as forgiving sin and as a means
    by which souls may be removed from punishments and judgments.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: A prayed-for soul in the chambers of the outer Darkness or in punishments
    of the dragon is to be removed from them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the soul has not completed the number of cycles in bodily changes, it is
    taken to the Virgin of the Light, sealed with the seal of the Ineffable, and cast
    into a righteous body.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:6
  text: If the soul has completed the cycles of changes, it is taken to the seven
    Virgins of the Light, associated with baptism, sealing, and the arrays of the
    Light.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:7
  text: A soul in the dragon of the outer Darkness is said to be vomited out by the
    dragon after the prayer or mystery is performed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Receiver or Receivers of Melkhisedek carry the soul away from the dragon
    or from places of the judgments of the Rulers and take it to the Place of the
    Middle near the Virgin of the Light.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The Virgin of the Light proves the soul, looks for the sign of the kingdom
    of the Ineffable, and routes the soul according to whether its cycles are complete.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The seven Virgins of the Light prove the soul, baptise it, give it spiritual
    chrism, and take it to the Treasury of the Light.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the veils of the Place of those on the Right are drawn away, the soul
    is purified again, cleansed, and placed in the arrays of the first Saviour in
    the Treasury of the Light.
  category: sequence
  evidence_refs:
  - ev:8
