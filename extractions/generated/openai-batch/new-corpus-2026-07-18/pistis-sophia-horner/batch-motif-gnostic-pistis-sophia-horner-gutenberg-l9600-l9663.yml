canonical_text:
  quote: ''
  summary: Jesus, also named Aberamentho, answers Mariham's question about how souls
    are taken by robbery. He describes Ieou binding unbelieving Rulers, the female-shaped
    Ruler Paraplex and her demons stealing and punishing souls with smoke, darkness,
    and evil fire, Zorokothora Melkhisedek and Ieou transporting purified lights to
    the Treasury of Light, and a later celestial event in which the great good Sabaoth
    looks down and Paraplex's places dissolve, after which souls are returned to the
    Sphere.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ieou takes away three hundred and sixty Rulers among the Rulers of Adamas
    who did not believe the mysteries of the Light and binds them in aery Places below
    the Sphere.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ieou places five other great Rulers over the bound Rulers on the road of the
