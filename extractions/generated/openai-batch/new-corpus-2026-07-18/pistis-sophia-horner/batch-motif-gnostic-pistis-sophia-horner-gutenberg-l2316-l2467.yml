  summary: The passage moves from introductory footnotes into the opening of the literal
    translation. It states that after Jesus rose from the dead he spent eleven years
    teaching his disciples, but only up to certain mysteries and places. The disciples
    misunderstand the First Mystery as the head and completion of the universe. The
    passage then lists many cosmic entities, places, ranks, guardians, lights, marks,
    helpers, trees, and voices whose distributions Jesus had not yet revealed.
