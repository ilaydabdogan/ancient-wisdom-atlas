  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After tribulations, the hearers renounced the world and its matter, sought
    the mysteries of the kingdom of Light, and were purified into pure light.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Saviour says he despoiled himself and brought the mysteries of Light to
    material mankind so that they might be purified, saved, and inherit the kingdom
    of Light.
  category: action
  evidence_refs:
  - ev:4
