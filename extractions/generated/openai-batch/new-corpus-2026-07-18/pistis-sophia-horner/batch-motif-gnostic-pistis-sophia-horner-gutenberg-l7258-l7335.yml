  text: The Saviour tells Andreas to seek what he wished and promises to reveal it
    directly, without parable.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Andreas asks how people who are in the world and in the body of matter can
    leave the world, pass over firmaments and many ranks of cosmic beings, and inherit
    the kingdom of Light.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Saviour rebukes the hearers for not understanding and for being without
    knowledge.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Saviour says the addressed hearers, angels, archangels, gods, lords, rulers,
    invisibles, beings of the Middle and Right, and emanations of Light are from the
    same lump, matter, substance, and Confusion.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Confusion is said to have been compelled by command of the First Mystery
    until the great emanations of Light were purified, according to the arrangement
