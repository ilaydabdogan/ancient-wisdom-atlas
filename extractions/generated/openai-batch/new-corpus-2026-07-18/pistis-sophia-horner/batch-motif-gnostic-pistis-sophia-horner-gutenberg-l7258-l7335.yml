canonical_text:
  quote: ''
  summary: The Saviour answers Andreas's question about how human beings in material
    bodies can pass beyond cosmic powers and inherit the kingdom of Light. He explains
    a shared origin in matter and Confusion, distinguishes purified emanations from
    material humanity, says he brought the mysteries of Light for human purification
    and salvation, and instructs his hearers to preach continual seeking and renunciation
    of the world.
  language: English
  quote_policy: summarized
