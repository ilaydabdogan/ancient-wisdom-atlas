canonical_text:
  quote: ''
  summary: The First Mystery praises Iohannes, then recounts how a power from the
    Height, joined with another power and a soul from Sabaoth, became an effluence
    of light. Gabriel and Mikhael carry this effluence down into Chaos to help Pistis
    Sophia, recover her powers of light from the emanations of the Self-willed, restore
    and vivify her body of matter, and the effluence then returns upward from Chaos.
    The First Mystery asks the disciples whether they understand.
  language: English
  quote_policy: summarized
