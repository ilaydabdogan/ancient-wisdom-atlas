canonical_text:
  quote: ''
  summary: Jesus teaches the disciples about the glory and immeasurable hierarchy
    of the Helpers and the Light. Maria Magdalene asks for exact explanations so that
    humanity may repent, avoid cruel judgments and powers of Darkness, and inherit
    the kingdom of Light. Jesus answers with mercy, describes the second Helper and
    succeeding Helpers as immeasurably greater and brighter than those below, and
    states that recipients of mysteries of the Light will be placed after leaving
    the material body according to the mysteries they received.
  language: English
  quote_policy: summarized
