  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Iohannes asks whether a brother who has received many mysteries of the beginning
    but does not act worthily should be passed inward to mysteries of the second Space.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Saviour permits advancement to the first mystery in the second Space if
    the brother is not hypocritical, truly wishes for God, and has failed because
    of the compulsion of the elements of Destiny.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After further transgression followed by true repentance and renunciation of
    the World, the Saviour instructs the disciples to forgive again and give the second
    mystery in the second Space.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After another repentance, the Saviour says the First Mystery is compassion
    of mercy and instructs that three mysteries in the second Space be given one after
