canonical_text:
  quote: Forgive him as far as seven times of a multitude of times
  summary: Iohannes asks Jesus how often a repeatedly sinful but repentant brother
    should be forgiven and given mysteries. Jesus instructs forgiveness many times,
    continued giving of mysteries to gain the soul, conditional advancement into mysteries
    of the second Space, and a final refusal of forgiveness after further transgression
    following three mysteries.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Iohannes describes a man who is a sinner and lawbreaker, renounces the World
    and its matter, receives mysteries, transgresses again, and repeatedly returns
    to repentance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Iohannes asks whether the disciples should forgive the repeated transgressor
    up to seven times and give him mysteries from the first Space.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Saviour answers that the brother should be forgiven not only seven times
    but a multitude of times, and that mysteries from the outward part of the first
    Space should be given each time.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Saviour says the purpose may be to gain the brother’s soul so that he
    inherits the kingdom of the Light.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Saviour says one who vivifies and delivers a soul receives additional
    glory in the kingdom of the Light; one who delivers many souls receives a multitude
