canonical_text:
  quote: ''
  summary: The passage is an introductory assessment of later documents in Pistis
    Sophia. It describes a shift from Jesus’ upward journey to inquiries about heavenly
    hierarchies, Light, magical or initiatory means, astral rulers who punish souls,
    speculation on unmanifested Members of the Supreme Being, and a Third Document
    focused on after-death punishments, escape through formulas and names, four hells,
    and final annihilation for the worst sinners.
  language: English
  quote_policy: summarized
