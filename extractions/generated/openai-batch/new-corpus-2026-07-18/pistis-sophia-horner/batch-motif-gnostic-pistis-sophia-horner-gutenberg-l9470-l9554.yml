canonical_text:
  quote: ''
  summary: Jesus stands with his disciples at the water of the Ocean, invokes the
    Father with vowels and divine names, positions disciples by directions, and turns
    at an altar to the four corners. After another invocation, cosmic powers and celestial
    regions shift to right/left and west; the sun and moon are described with dragons,
    animal-drawn forms, and steering figures. Jesus and the disciples remain in an
    aerial middle region below the Sphere, where Jesus explains the binding and separation
    of rulers by Ieou, the division between Iabraoth and Sabaoth the Adamas, and the
    assignment of five great rulers called Kronos, Ares, Hermes, Aphrodite, and Zeus,
    with Zeus receiving a steering power to keep the world and Aeons from destruction.
  language: English
  quote_policy: summarized
