  text: The Second Document begins with a caption naming it the Second Tome of Pistis
    Sophia and is described as intended to continue the First Document, without proving
    common date or authorship.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: John offers an interpretation of the same Psalm text for which Mary Magdalene
    had previously given an interpretation approved by Jesus.
  category: speech
  evidence_refs:
  - ev:1
