  text: Gabriel and Michael are summoned to assist Pistis Sophia during the continuation
    of her rescue story.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Self-willed God is named as Pistis Sophia's chief persecutor, and the
    powers of Chaos make another assault upon her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Jesus orders Gabriel and Michael to bear Pistis Sophia out of Chaos on their
    hands, while he descends into Chaos, smites her tormentors, and makes them powerless
    to follow her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Jesus leads Pistis Sophia to the Place below the thirteenth Aeon, warns her
    of future torment when the Gate of the Treasure-house opens, later routs her enemies,
    restores her to her original Place in the thirteenth Aeon, and she sings a final
    song of praise.
  category: sequence
  evidence_refs:
  - ev:3
