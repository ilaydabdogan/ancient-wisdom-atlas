canonical_text:
  quote: ''
  summary: 'The passage summarizes the contents and themes attributed to the Second
    Document of Pistis Sophia: its continuation of the first document, the rescue
    and restoration of Pistis Sophia, teachings on heavenly realms and progressive
    beatitudes, the identity of Jesus as First Mystery, initiatory mysteries culminating
    in the One Word of the Ineffable One, and renunciation as the way to the mysteries.'
  language: English
  quote_policy: summarized
