canonical_text:
  quote: ''
  summary: The Saviour tells Maria that all humans are subject to sin and that he
    brought the mysteries into the world. He says no soul entered the Light before
    his coming, but he has opened the gates and roads to the Light for those worthy
    of the mysteries. He discusses prophets, Helias, John the Baptist, patriarchs,
    righteous persons, the Virgin of the Light, forgiveness, reembodiment, and inheritance
    of the kingdom of the Light. Maria recognizes the keys of the mysteries as forgiving,
    purifying, and taking souls to the Light. A new section begins by stating that
    Jesus rose on the third day after crucifixion and gathered his disciples, who
    pray to him after forsaking family and the world.
  language: English
  quote_policy: summarized
