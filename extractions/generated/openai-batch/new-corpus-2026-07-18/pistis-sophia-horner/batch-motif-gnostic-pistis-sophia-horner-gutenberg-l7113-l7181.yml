canonical_text:
  quote: ''
  summary: 'The passage describes the third mystery of the Ineffable and its effect
    for a person coming out of the body: when the mystery is named for him, he is
    removed from the Rulers'' punishments and brought to the Virgin of the Light,
    sealed, and cast into the body of a righteous person. It then outlines hierarchical
    mysteries and spaces of the Ineffable, rules about answers, defences, symbols,
    and Receivers, and a future dissolution of the Universe after the completion of
    the perfect souls.'
  language: English
  quote_policy: summarized
