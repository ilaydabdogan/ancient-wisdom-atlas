canonical_text:
  quote: ''
  summary: Maria and the Saviour discuss people who have received the mysteries of
    the Ineffable and the First Mystery. The Saviour distinguishes repentant sinners,
    who may be forgiven repeatedly while alive, from those who die unrepentant, who
    are assigned to outer Darkness and the mouth of the dragon. The passage uses sayings
    and analogies involving salt, a thief in the night, a worldly king's pardon, and
    a royal vesture to explain forgiveness, vigilance, and the authority of the mysteries.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A soul or person who received mysteries and then transgresses without useful
    return is described as cast into the outer Darkness, consumed there, and becoming
    without existence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maria asks whether people who received the mysteries, sinned under the compulsion
    of Destiny, turned, repented, and prayed in their mysteries will be forgiven,
    and how many times.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Saviour answers that such people are forgiven every time if, while alive,
    they turn, repent, and remain in their mystery.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Saviour states that recipients of the mysteries who die without repentance
    become like unrepentant transgressors; their dwelling place is the mouth of the
    dragon in the outer Darkness, where they consume away and become without existence.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Saviour says that if people knew the time when they would come out of
    the body, they would govern themselves, avoid sin, and inherit the kingdom of
    the Light.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Maria cites the saying about a householder who, if he knew the hour the thief
    would come at night, would keep vigil and prevent the house from being dug through;
    the Saviour affirms her explanation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Saviour instructs the disciples to preach to receivers of mystery in the
    Light that they should take heed and not sin, lest they come out of the body unrepentant
    and become alien to the kingdom of the Light.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Maria says that the mercifulness of the mysteries is great because they forgive
    sin at every time.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Saviour compares the forgiveness of the mysteries to a worldly king who
    gives a free gift and forgives murderers and other grave sinners worthy of death.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Saviour compares a soldier wearing a king's vesture, against whom others
    cannot do evil, to those who wear the mysteries of the vestures of the Ineffable
    and the First Mystery.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Ineffable and the First Mystery are described as lords over the Universe,
    the Height, and the Depth, and as having authority in everything to do what they
    will.
  category: attribute
  evidence_refs:
  - ev:10
