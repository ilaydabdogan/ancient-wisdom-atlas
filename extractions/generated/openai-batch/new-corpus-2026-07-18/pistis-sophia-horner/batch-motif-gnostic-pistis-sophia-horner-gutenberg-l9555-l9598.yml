canonical_text:
  quote: ''
  summary: Jesus reveals incorruptible names of five great Rulers. The disciples worship
    him and ask about the roads. Mariham asks how souls can escape the roads of the
    Middle, their punishments, and the Receivers of judgments. Jesus answers with
    compassion and promises to give mysteries, seals, tickets, baptisms, and invocations
    for the Aeons, the Middle, the Right, and the Treasury of the Light, so that the
    disciples may be called sons of the complete Pleroma and sons of the Light.
  language: English
  quote_policy: summarized
