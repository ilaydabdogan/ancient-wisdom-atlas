canonical_text:
  quote: ''
  summary: The disciples misunderstand the scope of a Mystery and rejoice on the Mount
    of Olives over what the Saviour has revealed. On the full-moon day of Tōbe, an
    immeasurable power of light comes from the Light of lights and the Last Mystery,
    surrounds Jesus, and obscures him from the disciples’ sight. Jesus ascends or
    flies to the Height. The heavens, aeons, places, arrays, earth, and inhabitants
    are disturbed; angels and powers hymn inwardly. The disciples fear that the Saviour
    may overturn all Places. The heavens open, and Jesus descends in greater, differentiated,
    threefold light.
  language: English
  quote_policy: summarized
