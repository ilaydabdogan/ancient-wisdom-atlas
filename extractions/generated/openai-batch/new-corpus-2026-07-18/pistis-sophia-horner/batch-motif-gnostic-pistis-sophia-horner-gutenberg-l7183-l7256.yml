canonical_text:
  quote: ''
  summary: Maria Magdalene asks Jesus how World years correspond to a year of the
    Light. Jesus explains the time scale of the Light, describes his reign in the
    kingdom of Light, and sets out ranked lots and places for those who receive different
    mysteries. He says many mysteries are in the two books of Ieou written by Enokh
    while Jesus spoke with him from the Tree of Knowledge and the Tree of Life in
    Adam's paradise. Jesus promises to give the disciples the great mysteries with
    their figures, types, tickets, seals, answers, defences, and symbols, after which
    Andreas asks for clarification.
  language: English
  quote_policy: summarized
