canonical_text:
  quote: ''
  summary: Jesus tells his disciples how Pistis Sophia, in the thirteenth Aeon, saw
    the light near the veil of the Treasury of the Light and desired to ascend to
    it. The rulers of the twelve Aeons and the Self-willed power hated her. The Self-willed
    emanated a lion-faced power and cruel material emanations to waylay her in Chaos
    and take her light. Sophia mistook the lower light for the higher light, left
    her place, descended through the Aeons into Chaos, was surrounded and weakened,
    and cried a repentance to the Light of Lights for deliverance.
  language: English
  quote_policy: summarized
