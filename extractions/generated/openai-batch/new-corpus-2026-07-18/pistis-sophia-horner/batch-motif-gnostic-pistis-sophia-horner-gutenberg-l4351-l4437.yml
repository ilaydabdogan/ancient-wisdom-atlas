canonical_text:
  quote: ''
  summary: Jesus recounts entering Chaos to aid Pistis Sophia, whose light had been
    taken and who is oppressed by the lion-faced power. Sophia offers her tenth repentance,
    asking the Light of Lights for deliverance from violent and guileful powers and
    from alien dwelling in Chaos. Petros explains this repentance by citing a Davidic
    psalm, and Jesus approves. Jesus then says the lion-faced power grows angrier
    and emanates fierce multitudes. Sophia's eleventh repentance denounces the power's
    attempt to take or swallow her light, predicts judgment by the Light, and foresees
    the twenty-four emanations fearing and responding. Salome explains this repentance
    by citing another Davidic psalm.
  language: English
  quote_policy: summarized
