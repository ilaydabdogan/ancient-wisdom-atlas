- id: obs:3
  text: Maria asks whether people who know the magic of the Rulers of the Aeons, Destiny,
    and Sphere, as taught by transgressing angels, can still use it to hinder good
    works.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jesus says they will not accomplish these works as before because he took
    away a third part of their power, but he says the magic of those in the thirteenth
