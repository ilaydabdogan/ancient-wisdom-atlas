canonical_text:
  quote: Every thing which thou seekest after I shall reveal to thee.
  summary: Maria reverently asks Jesus about the Places to which he went and about
    whether magic and divination connected with the Rulers, Destiny, Sphere, and Aeons
    still operate. Jesus says he has removed a third of some powers, altered left
    and right orientations and cycles, and caused confusion among Rulers and diviners.
    Philippos is described as writing Jesus' words, then asks permission to question
    why Jesus removed bindings and confused the Rulers, asking whether this was for
    the salvation of the World.
  language: English
  quote_policy: quoted
