  summary: The passage summarizes the Third Document as a section titled “Part of
    the Books of the Saviour.” It describes preaching renunciations, four named places
    of punishment, tormenting beings including a world-encircling dragon, questions
    about mysteries, a doctrine of the soul and its components, transmigration, formulas
    of release, and Jesus’ statement that he came to bring mysteries enabling entry
    into the Light.
