canonical_text:
  quote: ''
  summary: Adamas fashions a dark and chaotic place and sends rulers and two dark
    emanations to persecute Pistis Sophia, strip her light, and cast it into Chaos.
    Pistis Sophia hymns to the Light of Lights for rescue, recalling a promised help.
    The First Mystery, speaking to the disciples on the Mount of Olives, invites interpretation;
    Iakkobos explains the hymn by citing David's seventh psalm. Pistis Sophia then
    warns her pursuers that the Light is a true judge who can take their light and
    powers, sees the dark place and emanations again, and asks the Light to turn Adamas's
    intended deprivation back upon him.
  language: English
  quote_policy: summarized
