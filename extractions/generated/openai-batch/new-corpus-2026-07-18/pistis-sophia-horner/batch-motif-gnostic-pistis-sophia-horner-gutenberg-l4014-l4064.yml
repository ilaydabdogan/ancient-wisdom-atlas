  quote: ''
  summary: Thomas comes forward after Jesus' saying, declares himself sober and spiritually
    ready, and gives an explanation of the seventh repentance of Pistis Sophia by
    citing a psalm attributed to David. The cited prayer asks the Lord for guidance,
    mercy, forgiveness, rescue from enemies, and redemption. Jesus praises Thomas,
    confirms the interpretation, blesses the disciples for receiving revelation, and
    promises to fill them with light and spiritual power so they may understand further
    teachings about the Height.
