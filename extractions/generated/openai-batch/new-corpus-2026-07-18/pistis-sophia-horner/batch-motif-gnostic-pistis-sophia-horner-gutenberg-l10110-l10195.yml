canonical_text:
  quote: ''
  summary: Iohannes and Mariham ask Jesus about souls after bodily death, punishment,
    and salvation through the mysteries of the Light. Jesus describes a good soul
    without the mysteries being escorted by Receivers, shown punishment places, judged
    by the Virgin of the Light, purified, given forgetfulness and then watchful understanding,
    and cast into a body to seek the mysteries. He also describes punishments for
    sinners without the mysteries, salvation for a sinner who later completes the
    mysteries and ceases sin, astral arrangements affecting souls sent into the world,
    the disciples' lament in Amente, and a fragment about righteous ones preaching
    to the four regions with Christ working signs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Iohannes asks Jesus what happens to a man who has not sinned and has become
    good, but has not found the mysteries needed to pass through the Rulers after
    leaving the body.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jesus says the Receivers of Bainkhoookh take such a soul with joy and spend
    three days going around with her while teaching her the creatures of the World.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The Receivers take the soul to Amente and to the road of the Middle to show
    punishment places and punishments; the passage states she is not punished there,
    though the steam of the flame touches her a little.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The soul is taken to the Virgin of the Light to be judged before little Sabaoth
    the good, he of the Middle, in relation to the turning of the Sphere and the positions
    of named astral figures.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Virgin of the Light delivers the righteous soul to Receivers and casts
    her to the Aeons of the Sphere, where Ministers of the Sphere take her to water
    under the Sphere that becomes boiling smoke and purifies her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ialouham, the Receiver of Sabaoth and the Adamas, gives the soul water or
    a cup of forgetfulness, causing her to forget every place she visited.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Receiver of little Sabaoth brings a cup full of understanding, wiseness,
    and watchfulness; after receiving it the soul is cast into a body, cannot sleep
    or forget, and continually seeks the mysteries of the Light until she finds them
    and inherits eternal Light.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mariham asks whether a person who has committed every sin and has not found
    the mysteries of the Light receives all punishments at one time, and Jesus answers
    that he does, with multiple punishments corresponding to multiple sins.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Iohannes asks whether a person who has committed every sin but finally finds
    the mysteries of the Light can be saved; Jesus says that if the person does, completes,
    and continues the mysteries without further sin, he will inherit the Treasury
    of the Light.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Jesus describes two arrangements of Kronos, Ares, Zeus, and Aphrodite around
    the Virgin of the Light; one arrangement is associated with souls becoming righteous
    and good and finding the mysteries, while the reverse is associated with souls
    becoming evil and wrathful and not finding the mysteries.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: While Jesus speaks in the Middle of Amente, the disciples cry out, weep over
    sinners and punishments, ask for mercy, and confess that they too have sinned.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: After a marked vacant section, a fragment says that the righteous came out
    by threes to the four regions of heaven, preached the evangel of the Kingdom in
    all the world, and that Christ worked with them through strengthening, signs,
    and wonders.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
