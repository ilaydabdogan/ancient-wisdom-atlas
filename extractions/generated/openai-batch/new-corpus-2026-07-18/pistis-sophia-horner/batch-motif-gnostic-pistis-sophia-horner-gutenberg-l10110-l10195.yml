- id: motif:2
  label: Divine judgment and punishment according to sin
  taxonomy_refs:
  - divine_judgment
  basis: The Virgin of the Light judges the soul before little Sabaoth, and Jesus
    states that a sinner without mysteries receives punishments corresponding to sins.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:10
  confidence: high
  cautions: The passage distinguishes the good soul's instructional exposure to punishments
