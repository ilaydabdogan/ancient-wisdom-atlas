- id: motif:3
  label: Purification before embodiment
  taxonomy_refs:
  - death_rebirth
  basis: The soul is sent to water beneath the Sphere that becomes boiling smoke and
    purifies her, then receives cups and is cast into a body.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage says the soul is cast into a body; the broader doctrinal meaning
    should not be expanded beyond the text.
- id: motif:4
  label: Saving mysteries and watchful wisdom
  taxonomy_refs:
  - wisdom
  - initiation
  basis: The passage repeatedly links finding, doing, and completing the mysteries
    of the Light with inheritance of eternal Light or the Treasury of the Light; the
    watchfulness cup makes the embodied soul seek those mysteries.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: No ritual details of the mysteries are described in this passage.
- id: motif:5
  label: Paired drinks of forgetfulness and wakeful understanding
  taxonomy_refs:
