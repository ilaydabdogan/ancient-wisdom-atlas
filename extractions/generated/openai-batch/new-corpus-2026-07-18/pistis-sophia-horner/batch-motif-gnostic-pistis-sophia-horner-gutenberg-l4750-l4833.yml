canonical_text:
  quote: ''
  summary: Jesus commands Maria his mother to explain a prophetic saying attributed
    to David about mercy, truth, righteousness, peace, earth, and heaven. Maria recounts
    an episode from Jesus' childhood in which a spirit from the Height, looking like
    Jesus and calling him brother, came to her house; she bound it to the bed until
    she found Jesus and Joseph in the vineyard. Jesus and the spirit met, embraced,
    kissed, and became one. Maria then interprets the saying through the spirit from
    the Height, powers from Barbelo and Sabaoth, Jesus' material body, baptism, forgiveness,
    mysteries, and inheritance of the kingdom of light. Another Maria offers a further
    interpretation centered on Jesus' baptism by Iohannes and the power of Sabaoth.
    Maria the mother then begins another explanation linking herself with Elisabet
    and Jesus with Iohannes.
  language: English
  quote_policy: summarized
