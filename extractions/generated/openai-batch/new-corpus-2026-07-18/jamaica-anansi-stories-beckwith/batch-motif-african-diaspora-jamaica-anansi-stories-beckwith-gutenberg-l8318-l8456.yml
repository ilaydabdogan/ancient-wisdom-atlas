  summary: The excerpt contains the end of a tale in which White Belly uses a box
    and his mother to produce money, while Hanansi's imitation kills his own mother;
    a tale in which Monkey pursues and repeatedly finds Hanansi until Hanansi kills
    Monkey with a cut rope; and the opening of a cumulative-chain tale in which Anansi
