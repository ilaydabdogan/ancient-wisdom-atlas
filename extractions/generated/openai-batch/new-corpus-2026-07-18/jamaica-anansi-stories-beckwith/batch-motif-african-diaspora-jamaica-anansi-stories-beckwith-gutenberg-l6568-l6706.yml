canonical_text:
  quote: ''
  summary: 'The passage contains several Jamaican Anansi-related narratives: Old Conch
    moves a mile-long timber by song while Anansi falsely claims the work; a Grass-quit
    fragment repeats a timber-following song with a grass-straw implement; a boy escapes
    Anansi by disguising himself as Anansi''s mother after killing and cooking her;
    and a child found at the river returns to the river and becomes a crayfish after
    being struck.'
  language: English with Jamaican Creole forms
  quote_policy: summarized
