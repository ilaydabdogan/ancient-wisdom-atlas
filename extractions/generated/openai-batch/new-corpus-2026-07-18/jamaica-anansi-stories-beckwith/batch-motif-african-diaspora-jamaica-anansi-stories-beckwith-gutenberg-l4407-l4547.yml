canonical_text:
  quote: ''
  summary: The passage contains a pea-fowl and gold-chain fragment; the Contavio story,
    in which locked-up Miss Nancy asks animals to call her husband and a peacock fetches
    him, producing an explanation for peacock head feathers and missing spurs; The
    Barking Puppy, in which a woman kills a barking puppy but its ashes, river-water,
    and shadow continue to bark before the visiting man kills her; and The Singing
    Bird variants, where servants cast a master or a king's daughter into a well and
    a bird or song discloses the act and leads to punishment.
  language: English with Jamaican Creole dialect transcription
  quote_policy: summarized
