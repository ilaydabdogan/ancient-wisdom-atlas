  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Contavio marries Miss Nancy, goes to market, and locks Miss Nancy up before
    leaving; when he does not return, hungry Miss Nancy asks passing animals to call
    him in exchange for gold.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bra Sheep and Bra Billy each make animal sounds, but Miss Nancy says their
    attempts will not do.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bra Peacock flies to Contavio, pecks and spurs him home, loses his spurs,
    receives a lump of gold on his head, and the story explains peacock head feathers,
    peacock lack of spurs, and a crow's bare head through these events.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old lady lives with a little puppy whose barking prevents a gentleman from
    visiting; she makes a large fire and burns the puppy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the puppy is burned, its ashes bark like the puppy, and the old lady
    throws the ashes into the river.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The puppy's ashes bark in the river; the old lady throws the river water into
    the sea, but later a dog shadow comes back, and the visiting gentleman tears the
    old lady to pieces.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Collin harnesses his master's buggy, accompanies him to a well, throws him
    into the well, returns with the buggy, and lies to the mistress about the master's
    absence.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A little bird sings that the fine waiting boy threw his master into a well;
    after the mistress seeks someone who understands the bird, the master's body is
    found and Collin is hanged.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In The Golden Cage, two servants who dislike the king's daughter take her
    to the well and cast her into it; after three days the daughter returns home,
    and the king throws the servants into the well.
  category: sequence
  evidence_refs:
  - ev:8
