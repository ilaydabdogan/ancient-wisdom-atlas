  quote: ''
  summary: The passage contains the end of an Anansi-Rat-Tiger tale, a Goat-and-Anansi
    tale, a “New Names” tale, and the opening of “Long-Shirt.” Across the episodes,
    Anansi redirects Tiger’s anger, aids hiding in holes, uses a renaming bargain
    to protect his own mother while others are eaten, and steals a talking shirt that
    identifies its wearer.
