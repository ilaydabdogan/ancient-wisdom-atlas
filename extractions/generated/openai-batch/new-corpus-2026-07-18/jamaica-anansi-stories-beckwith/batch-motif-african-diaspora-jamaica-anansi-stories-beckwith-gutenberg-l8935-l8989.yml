literal_observations:
- id: obs:1
  text: A man traveling on an errand is caught by night on the road, sees a horse,
    strikes it, and the horse runs after him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the man reaches a bridge, he runs under it and collides with or crushes
    a Rolling Calf; the scene includes speech about being frightened.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The horse says that the striking did not hurt it, but being called a brute
    did.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Louse and Dog-flea quarrel and ask each other how they manage when caught;
    Louse describes hiding in knots, seams, and lying flat during combing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: When Louse asks Dog-flea how he manages hot water, Dog-flea refuses to answer
    and the quarrel ends.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ground-lizard and Ground-rat are described as friends who discuss people;
    Ground-rat says people notice it, name it, and take stones to kill it, so it leaves
    their sight.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ground-lizard says that when people come upon it suddenly, it jumps away,
    then turns back to look at them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Puss and Dog go journeying, find a thruppence, divide it, and debate what
    to buy with their portions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Dog chooses to buy a small amount of 'look,' while Puss chooses to buy lizards;
    the narrator says this is why cats chase lizards and dogs keep looking and doing
    nothing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Hand goes to market after Ear asks Hand to buy meat; Hand cuts a piece of
    the meat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mosquito sees Hand cut the meat and repeatedly tries to tell Ear, but Hand
    repeatedly knocks Mosquito, represented by striking the ear with the hand.
  category: action
  evidence_refs:
  - ev:5
