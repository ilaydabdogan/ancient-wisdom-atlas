    stories in which a child demanded by a monster repeatedly escapes entrapment and
    finally kills the enemy from a tree.
  claim_level: same_motif
  target: African parallels cited from Rattray, Torrend, and Junod
  evidence_refs:
  - ev:2
  - ev:3
