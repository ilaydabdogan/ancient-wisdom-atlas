canonical_text:
  quote: ''
  summary: 'Notes on several Jamaica Anansi-story entries summarize episodes and parallels:
    a cow taken to a lonely place; the story of Cunnie-more-than-father, in which
    a clever child repeatedly escapes a parent’s attempt to hand him to an enemy;
    fire-stick, ant-bag, hidden-enemy, coffin-exchange, and undersea-pasture tricks;
    the Duckano Tree story, in which a son discovers a hidden food supply by ashes,
    charms a remaining fruit, and Dog swallows it; and Food and Cudgel, compared with
    related folktales including Grimm’s wishing-table cycle.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cow is carried into a lonely place so that one figure can enjoy it alone,
    but Dry-head gets it away from him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Cunnie-more-than-father note identifies repeated attempts by a parent
    to turn an adroit child over to an enemy, with the child outwitting the would-be
    captor each time.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In cited African parallels, a woman steals from a monster, the monster demands
    her unborn child, and after birth the parent tries to send the child to where
    the monster is concealed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the cited African parallels, the child finally climbs a tree and drops
    fruit or wood into the enemy’s open mouth, choking and killing him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The note states that Parkes’s version contains five episodes, of which three
    belong to the regular cycle and the first and last are indeterminate.
  category: sequence
  evidence_refs:
