canonical_text:
  quote: ''
  summary: 'The passage contains the end of a tale in which Andrew repeatedly sings
    and wakes or summons his sisters while an old witch tries to kill them; he delays
    the witch through claims about being washed in animal blood, then kills her in
    a boiling copper and takes her property. It then gives two Hunter variants: in
    one, a cow-killing hunter can turn to stone, a surviving bull becomes a man and
    courts the hunter''s daughter, learns the transformation secret, attacks her,
    and she escapes through transformations. In the second, a young hunter marries
    a cow-woman, tells her most of his transformation secrets despite his mother''s
    warning, and later escapes attacking cows by a final undisclosed trick. The passage
    ends with a heading for a man-snake bridegroom tale.'
  language: English with Jamaican Creole dialogue
  quote_policy: summarized
