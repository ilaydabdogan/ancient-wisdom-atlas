- id: motif:2
  label: deceptive delay before defeating a witch
  taxonomy_refs:
  - trickster_boundary
  basis: Andrew gives repeated explanations about sores and animal-blood washing,
    causing the witch to delay, then kills her in the boiling copper.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The text does not label Andrew a trickster; the taxonomy link is based
    only on deceptive boundary-crossing behavior in the episode.
- id: motif:3
  label: animal-human spouse or suitor
  taxonomy_refs:
  - shapeshifter
  basis: A bull becomes a man and courts the hunter's daughter; in the second variant,
    a cow becomes a beautiful woman and marries the hunter.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The two examples occur in adjacent Hunter variants, but the passage gives
    them as separate tellings.
- id: motif:4
  label: revealed transformation secret creates danger
  taxonomy_refs:
  - wisdom
  basis: In both Hunter variants, a mother warns against telling all secrets; disclosure
    of transformation methods to a new spouse is followed by danger from cattle.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The wisdom taxonomy is supported by explicit warnings, but the passage
    frames the warning in practical rather than doctrinal terms.
- id: motif:5
  label: pursuit through serial transformations
  taxonomy_refs:
  - shapeshifter
  basis: The bull attacks the daughter, and she survives by changing from dry trash
    to tree to needle before becoming human again.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: Only the daughter's side of the chase uses multiple transformations in
    this scene; the bull mainly attacks in bull form.
- id: motif:6
  label: withheld final secret preserves survival
  taxonomy_refs:
  - wisdom
  basis: The young hunter tells many secrets but withholds the cow-tail method, and
    that undisclosed method lets him escape when the cows later attack.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not state that he intentionally withheld the secret because
