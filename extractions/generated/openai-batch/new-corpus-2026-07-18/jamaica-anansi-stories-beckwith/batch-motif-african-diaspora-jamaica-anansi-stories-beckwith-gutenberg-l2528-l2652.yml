canonical_text:
  quote: ''
  summary: The passage contains several Anansi episodes. Tumble-bug feigns death after
    Anansi strikes him, eats the abandoned food, then frightens Anansi into flight.
    In “Horse and Anansi,” Anansi tricks Horse by sending him to fetch distant fire
    while Anansi secretly roasts and eats plantains; Goat later observes the trick
    and takes the food from Anansi. In two “Anansi in Monkey Country” variants, Anansi
    uses a hot pot or oven and a release cry to kill and eat monkeys, but a survivor
    warns another Monkey country, whose monkeys use the same method to kill Anansi.
    In the opening of “Curing the Sick,” Anansi offers to cure a sick mother fish,
    asks for a frying-pan and oil, and eats her instead.
  language: English with Jamaican Creole dialogue
  quote_policy: summarized
