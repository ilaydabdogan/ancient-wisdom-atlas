canonical_text:
  quote: ''
  summary: 'The passage contains three narrative units: a tale of wise and foolish
    brothers whose errors lead to death, dispossession, and the frightening of robbers;
    a tale of abandoned children led by a witch in bird form to an edible house, where
    a girl kills the witch in an oven and escapes with her brother; and the opening
    of a tale in which a boy goes to bathe in a river and is swept to sea.'
  language: English
  quote_policy: summarized
