canonical_text:
  quote: ''
  summary: 'The passage contains the end of an Anansi and Tiger episode, the full
    story “The Gub-gub Peas,” and the opening of “Tiger as Riding-Horse.” Anansi repeatedly
    escapes danger or obtains food through verbal deception: he misdirects Tiger with
    talk of a hunter, uses a false letter to gain access to peas, frightens a watchman
    with a threat, substitutes Lion for himself before punishment, and begins another
    trick by calling Tiger his father’s old riding-horse.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Anansi ties Tiger and hides by a grass-root; young women heat water at the
    fireside and throw it on Tiger, causing him to break the rope and fall near Anansi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tiger threatens to burn Anansi’s back and sends him to cut dry wood from a
