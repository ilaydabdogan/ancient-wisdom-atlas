- id: obs:3
  text: While on the cotton-tree, Anansi tells Tiger that a hunter is looking for
    his track and then calls out directions that send Tiger away toward hillside,
    river, and sink-hole.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man plants a large field of gub-gub peas and places an illiterate watchman
    there to guard it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Anansi presents an old envelope as if it were a message from the master and
    claims it instructs the watchman to tie Anansi at the fattest peas until he is
    full and then release him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the first pea incident, the master tells the watchman that no letter
    was sent and that Anansi should not be released if he returns.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: When Anansi returns and is held, he threatens that if the watchman does not
    release him, he will spit on the ground and the watchman will rot; the watchman
    becomes frightened and unties him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: On a later return, the watchman keeps Anansi tied in the peas until the master
    arrives.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The master carries Anansi to his yard, ties him to a tree, and heats a large
    iron in the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Lion passes by, sees Anansi tied under the tree, and asks why he is tied there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Anansi tells Lion that people want him to hold knife and fork, and Lion offers
    to take Anansi’s place because he can hold them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Anansi unties himself through Lion’s help, ties Lion to the tree, and goes
    into the bush to watch from another tree.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The master returns, finds Lion instead of Anansi, and pushes the hot iron
