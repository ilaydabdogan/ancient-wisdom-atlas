canonical_text:
  quote: ''
  summary: 'Notes summarize the structure and comparative variants of several Jamaica
    Anansi story types: a bully is tied after monopolizing food; a captured trickster
    substitutes another victim; an animal is tricked into serving as a riding-horse;
    and Anansi steals Monkey’s clothes and shifts blame to Bone. The passage also
    lists African, American, and other comparative analogues.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes say that in “Tying Tiger” Parkes heard the story in St. Ann Parish,
    and that Milne-Home tells a version with Anansi and Lion, with Lion taking the
    place of Tiger in earlier Jamaica storytelling.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The summarized “Tying Tiger” plot has three parts: a bully takes a weaker
    figure’s food supply; the bully is tricked into being tied and then tormented
    or robbed of the food; and the bully either dies or is rescued, after which further
    retaliation or deception may occur.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The tying trick is described in variants involving hair or tail fastened into
    thatch or ground, mutual tying play, hanging for tooth filing, and tying under
    pretense of a storm made plausible by shaking trees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The tied victim may be tormented by remnants of a feast, salt and pepper,
    or beating.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The tied victim may be released by White-ants, Bush-rat, Snail, or Crab; in
    some cited variants the released victim falls upon or eats the rescuer.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: For “Tiger as Substitute,” the notes state that the two episodes are not known
    to the author from African collections and in American collections belong to a
    single story.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Mexican Rabbit cycle summarized here, Rabbit is caught in a woman’s
    chile garden by a tar-baby, hung in a net while water heats, pretends he is to
    marry, and persuades Coyote to take his place.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The notes state that “Tiger as Riding-Horse” is common in Jamaica and has
    no local variations from the American form familiar to the editor.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: One Jamaica version has Tacoomah as the horse and ends by explaining why a
    saddle is fastened on Tacoomah’s back; another explains why gungo-peas are covered
    with Tacoomahs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Comparative riding-horse variants include Spider persuading Hyena to be saddled
    and bridled, Tortoise riding Elephant into town, a little animal tied on for safety,
    and Rabbit riding Tiger across a river.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: For “Tiger’s Sheep-Skin Suit,” the notes say Parkes heard the story in St.
