canonical_text:
  quote: ''
  summary: The passage contains several short Jamaican Anansi-related tales and one
    non-Anansi domestic trick tale. Molly May deceives a visitor and the master about
    a turkey. Anansi uses fiddle music at a water-hole to make Assono dance, then
    kills him. Anansi claims a dinner by giving himself a phrase-like name. Anansi
    obtains money by claiming to come from heaven and later by calling himself Mr.
    Rainy Day. A wife hides a lover in a pannier-jar, and the man carrying it drops
    it when the hidden man speaks. Anansi uses his dead grandmother to frighten a
    shopkeeper into paying him, while Tiger imitates him foolishly. Anansi gives White
    Belly destructive advice about putting fire at the roots of peas.
  language: English with Jamaican Creole dialogue
  quote_policy: summarized
