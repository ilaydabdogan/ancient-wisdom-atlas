candidate_motifs:
- id: motif:1
  label: animal contest causing death and inheritance transfer
  taxonomy_refs: []
  basis: The bull-tossing episode ends with the woman's fatal injury and the girl
    taking possession of all she owned.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The tale is fragmentary at the start of the passage, so the broader narrative
    function of the contest is unclear.
- id: motif:2
  label: life-threatening demand to know a hidden name
  taxonomy_refs:
  - forbidden_knowledge
  basis: The bad woman threatens her daughter with death unless she can tell the woman's
    name, and the girl's survival depends on learning and remembering that name.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The available taxonomy label is broad; the passage presents a dangerous
    name-knowledge task but does not explicitly state a taboo against knowing the
    name.
- id: motif:3
  label: animal helper gives saving knowledge
  taxonomy_refs:
  - wisdom
  basis: Crab supplies the needed name and then gives the practical instruction to
    sing it all the way back.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The 'wisdom' taxonomy reference is general; the passage shows helpful
    instruction rather than an explicit wisdom quest.
- id: motif:4
  label: helper punished or pursued for revealing information
  taxonomy_refs: []
  basis: After Crab admits telling the girl the name, the bad woman attacks Crab with
    a machete and Crab escapes into a hole.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No larger etiological explanation is stated beyond Crab remaining in the
    hole.
- id: motif:5
  label: reckless companion violates hospitality and helper-protection
  taxonomy_refs:
