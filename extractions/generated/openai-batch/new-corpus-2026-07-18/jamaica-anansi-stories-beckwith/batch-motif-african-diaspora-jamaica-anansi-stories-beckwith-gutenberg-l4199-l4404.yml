canonical_text:
  quote: ''
  summary: 'The passage presents several Jamaican oral tales or tale segments: a bull-tossing
    contest ending in a woman''s death and a girl''s inheritance; a threatened girl
    who learns and sings the dangerous woman''s name from Crab; Jack repeatedly harms
    helpers who shelter him and Harry; and a pea-fowl chosen to carry a message to
    the absent gambler John Studee when his wife is near childbirth.'
  language: English with Jamaican Creole dialogue
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman and a bull alternately toss one another; the bull remains unhurt while
    the woman suffers broken arms and finally a broken neck.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the woman's death, a girl becomes mistress of all the woman's possessions,
    and the narration links this to land passing by legacy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A bad woman sends her only daughter to the river for water and threatens to
    destroy her if she cannot tell the woman's name when she returns.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Crab tells the girl that the woman's name is Grandy Do-an-do.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the girl forgets the name, Crab instructs her to sing it all the way
    back, and the girl returns singing the name.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bad woman questions Cow, Sheep, Horse, Duck, and Crab about who told the
    girl her name.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Crab admits telling the girl the name; the woman chops after Crab with a machete,
    and Crab sinks into a hole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Jack and Harry ask an old man for coffee, and Jack takes and drinks the old
    man's own coffee despite Harry's warning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A hen hides Jack and Harry under her wing as if they were her chicks; Jack
    then damages the hen's wing despite Harry's warning.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A poor lady covers Jack and Harry with her coat; Jack chokes the lady despite
    Harry's warning, and she shakes them out and runs after them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A kyan-crow carries Jack and Harry into the sky to escape the lady; Jack damages
    the crow's wing, causing them to fall and lose consciousness.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: When Jack and Harry regain consciousness, a land turtle approaches; Harry
