canonical_text:
  quote: ''
  summary: 'Four brief duppy anecdotes: a man twice flees a duppy with fiery teeth;
    two duppies suck molasses from a sugar dray and are driven off by the drayman;
    two duppies warm themselves at a fire and exchange comic remarks about Cubba’s
    marriage; and duppies in a house look at the moon and debate how to describe it.'
  language: English with Jamaican Creole forms
  quote_policy: summarized
