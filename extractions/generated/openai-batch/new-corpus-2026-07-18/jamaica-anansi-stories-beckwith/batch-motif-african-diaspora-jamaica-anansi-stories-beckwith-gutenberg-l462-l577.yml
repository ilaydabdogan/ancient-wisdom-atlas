canonical_text:
  quote: ''
  summary: The passage presents Jamaican Anansi animal stories. In two variants under
    “Tying Tiger,” Anansi gains food and tricks Tiger into being tied to a tree; in
    one version Tiger is later killed by a hunter, and in the other Tiger is freed
    by Duck-ants before Anansi exploits Tiger’s gratitude by posing as Duck-ants’s
    brother. The passage also begins a “Tiger as Substitute” tale in which captured
    Anansi persuades Tiger that Tiger should take Anansi’s place.
  language: English with Jamaican Creole dialect representation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During a hungry time, Anansi takes a basket and pot to the sea-side, makes
    a fire, catches fish, boils and eats a potful, hides the pot in the bush, and
    carries the basket homeward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tiger is described as rough, and Anansi is afraid of him; Tiger asks what
    is in Anansi’s basket, and Anansi answers that it contains nothing.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Tiger secretly watches Anansi unpack fish from the basket, Tiger demands
    the fish, eats them all, and spits up the bones; Anansi eats the bones and complains
    indirectly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Anansi draws attention to a fruit-tree, climbs it at Tiger’s order, then comes
    down and claims he must lean on the tree to remove lice from Tiger’s head; Tiger
    falls asleep while Anansi handles his hair.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Anansi wraps Tiger’s long hair around the tree, refuses to release him, sings
    about tying Tiger like a hog, leaves him there, and a hunter later kills Tiger.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In “The Storm,” Tiger owns a mango-tree; Anansi wants mangoes and tells Tiger
    that a law requires every man with a tree to be tied to it because a heavy storm
    is coming.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After tying Tiger to the mango-tree, Anansi eats mangoes, strikes Tiger on
    the head with mangoes, shakes down ripe mangoes, takes them away, and leaves Tiger
    tied.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Brer But and Brer Ant pass Tiger without freeing him; slow Brer Duck-ants
    releases Tiger, and Tiger thanks him and grants favor to Duck-ants’s friends.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Anansi listens from a cotton tree, later visits Tiger’s yard claiming to be
    Mr. Duck-ants’s brother, is welcomed and served tea, but is exposed when his bald
    head is seen after he removes his hat and is then run out.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the opening of “The King’s Two Daughters,” Anansi courts and deceives two
    daughters of the king; they tie him and seek wood for a fire under a copper to
    burn him with hot water, after which Anansi tells Tiger a misleading account and
    Tiger proposes that Anansi be untied and Tiger tied instead.
  category: sequence
  evidence_refs:
  - ev:7
