canonical_text:
  quote: ''
  summary: The passage finishes one Jack tale in which Jack stages prepaid whiskey
    purchases to make his hat seem able to pay bills, sells the hat to three men,
    then stages a false resurrection with a stick and sells that stick to them. Their
    later attempt to raise the king's dead daughter fails and they are burned in a
    furnace. The passage then begins 'Uncle Green and Jack,' where a poor Jack, seeking
    money from rich Uncle Green around his wedding, prepares cooked food in hidden
    fashion and presents a shell and whip as if they can make pots boil without visible
    fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jack uses three dollars to buy three bottles of whiskey at three different
    shops and asks each clerk to keep the bottle until he returns.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jack meets three men who had robbed him of his wife's cow and invites them
    to drink with him at the shops.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At each shop, after the whiskey is drunk, Jack claps his hat on the counter
    and says the drink is paid for; the clerks accept this.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The three men ask to buy the hat, and Jack sells it to them for one hundred
    pounds, which he carries to his wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the three men try to use the hat at shops, it does not succeed and they
    have to pay; they then threaten to catch and kill Jack.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Jack tells his wife he is going to set up a trick, lies in bed as if dead,
    and his wife cries and says her husband is dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: One of the three men strikes Jack with a stick beside the bed; Jack starts
    up and says it is the 'stick of life' that raised him from the dead.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The three men buy the stick from Jack for one hundred fifty pounds because
    it is called the 'stick of life.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The three men advertise that they can raise the dead and try to raise the
    king's dead daughter by beating her with the stick and calling for her to arise.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The king becomes angry, orders a furnace heated, and has the three men thrown
    into it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the next story, Uncle Green is described as a rich old unmarried man, while
    Jack is poor, preparing to marry, and thinks of getting something from Uncle Green.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: For the wedding feast, Jack arranges for food to be cooked in the kitchen,
    then places the pots on stones outside with no fire underneath and with the covers
    shut close.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Guests notice that it is near dinner-time and the pots are on stones with
    no fire under them; chief men tell them to keep quiet because dinner will soon
    come.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: Jack announces that he has a shell and a whip that know their duty, blows
    the shell, cracks the whip, and commands the pots to boil.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: When the pot covers are lifted, steam comes out of every pot and the food
    is well cooked.
  category: sequence
  evidence_refs:
  - ev:6
