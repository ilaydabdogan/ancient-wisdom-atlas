canonical_text:
  quote: ''
  summary: Notes to witticisms in Jamaica Anansi Stories give provenance, cross-references,
    and comparative summaries. The passage includes brief variants involving Massa
    Peter frightened at a crossroads by long-toothed men, a roadside duppy who cannot
    blow fire because he is dead and toothless, Rolling Calf episodes, and abbreviated
    comparative animal stories from Cundall, Tremearne, and Koelle.
  language: English, with Jamaican Creole in quoted speech
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Witticisms I and II are identified as old-fashioned slave stories from Vassel
    Edwards at Retirement in the Cock-Pit country and are grouped with trick stories
    quoted by Lewis.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note for III states that the label “Congo” is used as a term of ridicule
    based on an asserted stereotype about wit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note for IV says the witticism is common, gives a variant location of
    Kingston, and attributes one version to Mrs. Elizabeth Hilton, learned from Henry
    Roe.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: Massa Peter is described as going out after hours despite his mother’s warning
    that, if she died before him, she would show him a token to frighten him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: While returning at night, Massa Peter reaches a crossroads, smells something
    strange, and meets a man carrying a little fire who gives him a light and has
    very long teeth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Massa Peter meets a second man, describes the first man’s long teeth, and
    the second man asks whether the teeth are like his; Peter runs until he reaches
    his mother’s bed and afterwards stops going after girls.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In one version, a man finds a boy by the roadside, takes him home, asks him
    to blow the fire, and the boy, identified as a duppy, says he cannot because he
    has long been dead and dirt has eaten out his teeth; after being beaten, he runs
    away saying he is dead a second time.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In another version, Rolling Calf takes possession of a house; while he is
    asleep, the owner heats an iron fork red hot and catches him about the neck.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A Cundall comparison has Rolling Calf afraid of the moon, tumbling into a
    stream, spraining his foot, and making a comic complaint about the wet and the
    sprain.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A Tremearne comparison has Lizard and Mouse both courting a woman; Mouse tells
    her Lizard is blind, and Cock says Rat is a thief who cannot be seen in the market.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: A Koelle comparison has Toad and Rat wager over whether one can do what the
    other cannot; Toad passes a crowd unharmed, while Rat is pursued with sticks and
    stones.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Several other notes in the passage provide cross-references, informant names,
