canonical_text:
  quote: ''
  summary: The passage contains the end of a mermaid episode, the tale 'Difficult
    Tasks,' the tale 'The Grateful Beasts,' and the opening of 'Jack and the Bean-Stalk.'
    A boy avoids death by answering a mermaid's food questions and is returned home.
    Another boy survives murderous tasks set by a rich guardian through the aid of
    his dead mother, steals a duppy-man's bell, and gains the guardian's fortune after
    a sword contest. A poor traveller divides prey among fighting animals, receives
    animal powers, uses them to defeat a seven-headed giant, opens hidden treasure
    in a hill, and marries the giant's daughter. The Jack fragment begins with poverty,
    the sale of a cow for beans, the mother's anger, and an old woman's direction
    toward a high hill where a man who stole Jack's father's riches lives.
  language: English
  quote_policy: summarized
