- id: motif:2
  label: Dead mother returns for her child and belongings
  taxonomy_refs: []
  basis: The dead Miss Grace comes at night and asks Doggie for her baby and domestic
    items such as water, bowl, comb, and clothes.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No external comparison is asserted; this is a passage-level motif candidate
    only.
- id: motif:3
  label: Restoration of the dead woman through milk, hot water, and sheet
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The narrative calls the visitor a dead woman; after she steps or falls into
    hot water and milk under a sheet, she is wrapped, looks up, and speaks to identify
    her murderer.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The exact mechanism is compressed in dialectal narration; resurrection/death-rebirth
    classification is plausible but requires human review.
- id: motif:4
  label: Wrongdoer punished by burning in a barrel
  taxonomy_refs: []
  basis: After the husband learns what Miss Wheel did, he puts her in a barrel and
    rolls it into the fire of a lime-kiln.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage presents human punishment rather than explicit divine judgment.
- id: motif:5
  label: Threatening monster visits children while parents are away
  taxonomy_refs: []
  basis: Asoonah comes while the mother is at work; the children know its arrival
    time, sing, and answer its questions.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: Asoonah is described as a big skin thing, but the passage does not explain
    its species or origin.
- id: motif:6
  label: Hidden watcher kills household-threatening monster
  taxonomy_refs: []
  basis: The husband hides in the loft with a gun and shoots Asoonah, which falls
    and breaks its neck.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No supernatural slayer role beyond the narrated action is inferred.
- id: motif:7
  label: Child identifies mysterious monster and gains royal reward
  taxonomy_refs: []
  basis: The king cannot identify Asoonah and offers money; a little boy names it,
    causing fear, and is rewarded with money, clothes, and work.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The relation between this boy and the earlier children is not made explicit.
- id: motif:8
  label: Withheld food leads to danger at a water crossing
  taxonomy_refs: []
  basis: One child refuses to share breakfast with the old river-crosser; when the
    river rises, the old man refuses that child passage until the mother pays.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The moral of reciprocity is strongly suggested by sequence, but no sacred
