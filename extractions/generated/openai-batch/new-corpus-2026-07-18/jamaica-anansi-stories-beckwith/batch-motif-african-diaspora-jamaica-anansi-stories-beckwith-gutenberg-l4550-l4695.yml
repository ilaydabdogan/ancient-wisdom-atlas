- id: motif:1
  label: Sister murders and replaces wife or mother
  taxonomy_refs:
  - stolen_beloved
  basis: Miss Wheel pushes Miss Grace into a hole, returns home, takes the baby, and
    functions in the household while Busha at first does not notice his wife.
  evidence_refs:
