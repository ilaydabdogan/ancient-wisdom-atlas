canonical_text:
  quote: ''
  summary: 'The passage contains three narrated episodes: a woman named Miss Grace
    is killed by her sister Lady Wheel, returns after death to tend her baby with
    the help of a dog, is restored through hot water, milk, and a sheet, and identifies
    her murderer; an entity called Asoonah, described as a big skin thing, repeatedly
    visits children and is later shot, named, and displayed for a king’s reward; and
    a child who refuses to share breakfast with an old river-crosser is left amid
    rising water until the mother pays for passage, after which the child shares food
    daily.'
  language: English/Jamaican Creole
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two sisters are named Miss Grace and Lady Wheel or Miss Wheel; Busha is associated
    as husband to Miss Grace, and Miss Wheel is described as servant to her sister.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Miss Wheel calls Miss Grace to pick peas, and Miss Grace carries her baby
    during the outing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: While they are picking peas, Miss Wheel has Miss Grace remove her dress, shoves
    her into a hole, returns home, washes her breast, takes the baby, and suckles
    it at night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A neighbor tells Busha that harm has occurred in his house and warns him not
    to drink even cold water there that night; Busha lies down appearing asleep but
    remains awake.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A dead woman comes and calls to a little dog named Doggie, asking for her
    baby, water, bowl, comb, clothes, and other items; the dog answers her as Miss
    Grace, my fair lady.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the last night, a pail of milk and a pail of hot water are placed at the
    doorway and covered with a white sheet before the dead woman arrives.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: After stepping into the hot water and falling into the milk under the sheet,
    the woman is wrapped up, looks up, and tells the gentleman that her sister pushed
    her into the ball or hole while they were picking peas.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After learning what happened to his wife, the gentleman takes Miss Wheel,
    builds a lime-kiln, puts her in a barrel, and rolls it down a hillside into the
    fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Asoonah is described as a big skin thing that can sink the whole place when
    it enters a yard.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Asoonah comes while a mother is away at work, and the children sing and answer
    questions about their mother, another child, guinea corn, and a mortar.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The mother tells her husband about the visits; the husband waits with a gun
    in the kitchen loft, sees Asoonah, fires, and Asoonah falls into a gully and breaks
    its neck.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The king offers three hundred pounds to anyone who can identify Asoonah; a
    little boy holds it up, names it as Asoonah skin, frightens the people, and receives
    money, clothes, and work.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Children going to school are taken across a river each day by an old man,
    who asks them for some of their breakfast.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: All the children give the old man breakfast except one; when the river rises,
    the old man carries the others across but refuses to carry that child.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The refused child sings to the mother that he will die that day, and each
    time he sings the water rises higher.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: The mother pays the old man two pounds, the old man carries the child across,
    and afterward the child offers the old man breakfast every day.
  category: sequence
  evidence_refs:
  - ev:10
