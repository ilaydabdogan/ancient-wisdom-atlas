canonical_text:
  quote: ''
  summary: 'The passage contains several Jamaican animal tales: Brer Rabbit escapes
    Brer Fox through a misleading prayer; Brer Rabbit exposes Brer Fox pretending
    to be dead; Turtle defeats Horse in a race by placing his children at mile-posts;
    Parrot wins a bride from Pigeon by using another parrot to mislead him; a fragment
    describes a hunger contest between Jumping Dick and White Belly; and Tiger learns
    fatally that Man, represented by a hunter with a gun, is stronger than beasts.'
  language: English with Jamaican Creole dialogue
