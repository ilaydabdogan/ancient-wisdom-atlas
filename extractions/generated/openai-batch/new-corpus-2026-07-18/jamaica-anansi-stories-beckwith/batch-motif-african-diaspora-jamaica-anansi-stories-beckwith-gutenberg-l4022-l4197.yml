canonical_text:
  quote: ''
  summary: The passage contains the end of a tale about Sammy de Comferee, whose arrow
    enters Massa Jesus's yard, after which Massa Jesus's wife detains him and rain
    wets the clothes. Massa Jesus, angered by a comparison of Sammy's beauty with
    his own, orders Sammy to climb a heated iron rod; Sammy melts away, leaving fat
    that becomes the source of beauty for some men. The passage then begins the tale
    of Grandy Beard-o, a wealthy witch who withholds food from a little girl unless
    the girl can name her. Speaking animals refuse or fear to reveal the name until
    a bull tells the girl. After the girl names the witch and is fed, the witch interrogates
    the animals; the bull admits it and defeats the witch in a tossing contest.
  language: English, including Jamaican Creole dialogue
  quote_policy: summarized
