  summary: Supplementary notes summarize Seidel’s “Miracle of the Sidi,” in which
    a devil challenges the Sidi to arrange a slave’s marriage to a princess and an
    impossible out-of-season hyacinth task is fulfilled by miraculous transformation
    of stones. Other notes cite a Dog proverb, define the Jamaican term “water table”
    as a roadside drain or gutter, point to music for songs, and state that “Leap,
    Timber, Leap” involves a trickster falsely claiming magical powers, a theme said
    to be common in American Indian hero cycles.
