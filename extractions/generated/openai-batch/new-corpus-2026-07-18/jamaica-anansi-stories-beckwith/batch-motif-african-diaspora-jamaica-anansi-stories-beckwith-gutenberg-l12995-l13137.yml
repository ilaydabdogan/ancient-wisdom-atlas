  summary: 'Scholarly notes on Jamaica Anansi Stories compare several tale episodes
    and variants: Pea-fowl as messenger, the barking puppy as warning substitute,
    warning or singing birds, the Two Sisters or false bride complex, Assonah and
    the fatal-name pattern, a water spirit requiring food for river crossing, and
    color/place exchange leading to the wrong victim''s death.'
