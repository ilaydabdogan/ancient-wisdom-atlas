canonical_text:
  quote: ''
  summary: The passage contains the end of one Anansi tale involving a tarred stump
    set by Tacoomah, a gourd-and-water alibi, Anansi becoming stuck, and Goat being
    tricked into taking his place and being killed. It then gives the tale “The Grave,”
    in which Anansi pretends to die so he can be buried in a peas-walk and steal peas
    nightly, until an eldest son sets a tarred stump with a hat and Anansi becomes
    stuck. The passage closes with the beginning of “Inside the Cow,” where Anansi
    secretly eats beef-fat supplied by Tacoomah while pretending to despise it, then
    asks how to obtain more.
  language: English with Jamaican Creole dialogue
  quote_policy: summarized
