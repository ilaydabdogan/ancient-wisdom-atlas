  quote: ''
  summary: 'Editorial notes compare several Jamaica Anansi tale episodes and related
    traditions: an incriminating song and sheep-skin intrigue; the sheep-thief and
    disguised watchman plot; Tiger’s Breakfast parallels; Eggs and Scorpions variants;
    Tiger’s or John-Crow’s bone-hole; and The Christening as a widespread tale.'
  language: English
  quote_policy: summarized
