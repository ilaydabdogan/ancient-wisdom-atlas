canonical_text:
  quote: ''
  summary: 'Jack searches for the Devil Errant under a three-month limit. Animal keepers
    summon fish and birds; a bird named Quack carries Jack partway after being fed.
    At a riverside an old man tells Jack to hide the clothing of the Devil Errant’s
    third daughter. The daughter falls in love with Jack, reveals traps and secrets,
    and helps him survive a gate trap and several tasks: recovering a ring from a
    water-filled well, shingling a house with dove feathers, and beginning the capture
    of a horse from a sea-like pasture.'
  language: English
  quote_policy: summarized
