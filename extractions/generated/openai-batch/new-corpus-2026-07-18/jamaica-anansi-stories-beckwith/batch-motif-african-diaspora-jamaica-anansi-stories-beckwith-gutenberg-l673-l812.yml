canonical_text:
  quote: ''
  summary: The passage contains the end of one Anansi-Tiger tale, the full tale “Tiger’s
    Sheep-Skin Suit,” and the opening of “Tiger Catching the Sheep-Thief.” Anansi
    first tricks Tiger into being saddled, bridled, whipped, spurred, and ridden like
    a horse. In “Tiger’s Sheep-Skin Suit,” Anansi steals Mr. Mighty’s sheep, dresses
    Tiger in sheepskin clothing, uses a ball song to identify Tiger as the supposed
    thief, and receives the reward after Tiger is imprisoned. In the next tale, Anansi
    repeatedly takes sheep from Mis’ Madder by demanding compensation for a hen’s
    imagined offspring, while Tiger puts on the last sheep’s skin to catch him.
  language: English
  quote_policy: summarized
