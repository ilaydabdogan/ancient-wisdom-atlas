  label: trickster causes death and restores victims by fire
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: In the Ba-ronga version, Piti’s reproachers fall dead and are later restored
    to life by fire.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: This is a comparative version cited in the note, not the complete Jamaican
    tale.
- id: motif:3
  label: serial victim trap disguised as instruction or initiation
  taxonomy_refs:
  - trickster_boundary
  - initiation
  basis: Turtle catches one animal after another by pretending to teach trap use;
    Pangolin kills animals one by one by offering initiation and directing them to
    a lethal tree-and-rock action.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The taxonomy term “initiation” is explicit only for the Pangolin variant;
    Turtle’s trap is instructional rather than initiatory.
