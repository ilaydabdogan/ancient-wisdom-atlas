canonical_text:
  quote: ''
  summary: Editorial notes compare several Jamaican Anansi tales with other African,
    Caribbean, American, European, and Jataka parallels. The passage describes story
    elements including taboo disclosure, deaths caused by reproach and later restoration
    by fire, traps that kill or capture sequential victims, revenge by weaker animals
    against Anansi or Spider/Tortoise figures, tricks involving fire or forgotten
    utensils to monopolize common food, cooking-and-eating victims, a false cure that
    becomes cannibalistic predation, and a feigned-dead avenger dragging the trickster
    into water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The yam-hill story is described as very common in Jamaica, with versions learned
    in Kingston and reported by Pamela Smith; its number of yam-hills varies and it
    may include a song.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The yam-hill story is said to depend on the idea that revealing a marvel one
    has seen or repeating certain taboo words is unlucky.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Explanations of the taboo include statements that Anansi had six legs, that
    Anansi’s mother’s name was Six, and in another version that the Queen’s name is
    Five.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: For “The Law Against Back-biting,” the note says Parkes learned the story
    on board a ship coming from Africa and that it is common in Jamaica.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Junod’s Ba-ronga version, Piti the fool stays by the roadside instead of
    herding cattle; those who reproach him fall dead, and he later restores them to
    life by means of fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In a Bulu tale, Turtle catches successive animals by pretending to teach each
    one how to use a trap, until Turtle himself is caught.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In another Bulu tale, Pangolin offers to initiate animals one by one, makes
    them climb a tree and jump onto a concealed rock that kills them, and Turtle finally
    circumvents the trick.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In a Jamaica version from Mandeville, Anansi holds a butchering at a place
    where a tree seizes anyone who leans against it and flings the person onto a lance
    set up by Anansi.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The note identifies the Butterfly revenge story as very popular and calls
    it a somewhat obscured version of an older theme.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Tumble-bug revenge story is said to be even more common than the Butterfly
    revenge story.
  category: other
  evidence_refs:
  - ev:9
- id: obs:11
  text: In Wona’s Tumble-bug story, Tumble-bug carries butter and Anansi carries lard;
    Anansi proposes putting their loads together, arranges that Tumble-bug’s is on
    the bottom, and rules so that he gets the butter while Tumble-bug gets the lard.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In a Tremearne version, Tortoise and Spider share a bull; after Tortoise eats
    the liver, Spider claims the whole bull as compensation, but Tortoise pretends
    to be dead and frightens Spider into giving him everything.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: For “Horse and Anansi,” the passage notes a trick of sending another after
    fire in order to enjoy all of a common store.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The passage notes a related trick of leaving a knife or spoon behind, and
    also mentions a fire-test.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: The note says the storyteller imagines Horse as an animal even when the actors
    behave like human beings.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:16
  text: For “Anansi in Monkey Country,” the passage reports a collector’s opinion
    that Jekyll’s second version is not a true negro form because of Jamaican respect
    for established church rites.
  category: other
  evidence_refs:
  - ev:14
- id: obs:17
  text: The “Anansi in Monkey Country” story is described as related to other collection
    numbers as a device for getting victims cooked and eaten.
  category: action
  evidence_refs:
  - ev:15
- id: obs:18
  text: For “Curing the Sick,” the passage says a human-for-fish victim substitution
    in Parkes’s version obscures its relation to Anansi’s visit to fish-country.
  category: other
  evidence_refs:
  - ev:16
- id: obs:19
  text: 'The “Curing the Sick” story is analyzed in two parts: Anansi pretends to
    cure a sick relative and eats her; then Mule offers to avenge her, plays dead
    outside Anansi’s door, and when Anansi tries to use her for food she drags him
    into the water and drowns him.'
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:20
  text: The passage gives parallels in which Rabbit pretends to cure Leopard’s children
    and eats them, and Tortoise pretends to bring children out of Crocodile’s eggs
    and eats them all.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:21
  text: In Parsons’s Portuguese negro story, Lob abandons Horse-fish after she carries
    him across water; when he thinks she is dead and starts to cut her up, she drags
    him into the sea and drowns him.
  category: sequence
  evidence_refs:
  - ev:18
- id: obs:22
  text: The passage notes similar speech in the Jamaica and Portuguese versions concerning
    the victim or avenger only playing or making fun.
  category: speech
  evidence_refs:
  - ev:19
- id: obs:23
  text: In both Jamaica versions, Mule turns Anansi over to the vengeance of the fishes;
    in the Portuguese version, he is drowned.
  category: sequence
  evidence_refs:
  - ev:19
- id: obs:24
  text: In Jekyll’s story, an old lady touches a forbidden jar; once her hand is inside,
    the jar drags her to the sea and drowns her.
  category: sequence
  evidence_refs:
