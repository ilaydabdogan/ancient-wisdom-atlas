- id: claim:2
  claim: The “Fling-a-mile” note presents Bulu tales and a Mandeville Jamaica version
    as variants sharing a serial trap pattern in which a trickster catches or kills
    victims one by one until the trick is reversed or circumvented.
  claim_level: same_function
  target: Bulu Turtle trap, Bulu Pangolin false initiation, and Jamaica Mandeville
    seizing-tree trap
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: 'The specific trap mechanisms differ: teaching a trap, false initiation,
    and a seizing tree with lance.'
- id: claim:3
  claim: The Butterfly revenge story is explicitly linked by the editor to an older
    theme represented by the Jataka “Quail’s Friends,” Wide Awake Stories, a Russian
