canonical_text:
  quote: ''
  summary: The passage contains the end of a William-and-Witch story, the complete
    Lucy-and-Janet story, and the beginning of Andrew and his Sisters. William leaves
    a blood-boiling basin as a danger signal, is trapped in an apple tree by an Old
    Witch and her axe-men, summons three named dogs, and survives when the dogs destroy
    the attackers. Lucy kindly shares food with three escort dogs and is rescued by
    them from an Old Witch man; Janet treats the same dogs rudely and is killed when
    they do not answer her call. In the opening of Andrew and his Sisters, three sisters
    ignore their afflicted brother Andrew, accept lodging at an Old Witch woman's
    house, are drugged, and Andrew secretly follows because he knows their danger.
  language: English with Jamaican Creole forms
  quote_policy: summarized
