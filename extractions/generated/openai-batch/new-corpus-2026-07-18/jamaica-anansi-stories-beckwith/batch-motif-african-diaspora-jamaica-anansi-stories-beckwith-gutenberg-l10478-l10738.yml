  quote: ''
  summary: The passage records numbered riddles 226-263, many with supplied answers.
    The riddles include a liminal invitation solved by arriving between day and night
    and standing on a threshold, personified household objects and natural phenomena,
    repeated egg riddles, biblical and historical names used as riddle subjects, alphabetic
    and wordplay riddles, and a hypothetical about one tree, one man, one ax, and
    women left to tell the tale.
  language: English
