canonical_text:
  quote: ''
  summary: The passage gives several Anansi episodes. In speech-taboo/work-ground
    variants, Anansi pretends to work rocky ground and animals who comment on him
    die and are eaten, but Duck and Guinea-chick reverse the pattern so that Anansi
    dies after speaking. In another variant, Anansi violates an agreement not to talk
    about But and is eaten. In the Fling-a-mile tale, Anansi discovers a being in
    a river hole that throws people a mile, then uses forks at the landing place to
    kill Hog and Goat for food while Monkey watches.
  language: English with Jamaican Creole dialogue
  quote_policy: summarized
