canonical_text:
  quote: ''
  summary: The passage contains two complete Jamaican Anansi-story items and the heading
    of the next. In the first, Jack, also named If-you-can, seeks the girl Catch ’em
    after fairy people steal her. He buries three mistreated dead men, serves the
    fairy, finds the girl in a forbidden room, rescues her, is betrayed at sea, and
    is saved by pelicans identified as the three dead men. The girl recognizes him
    by their exchanged names, and the betrayer is punished. In the second, titled
    “The Boy and His Master,” a boy learns witchcraft from an Old Witch, uses transformations
    to earn money for his poor parents, escapes when children remove a rope from his
    mare form, and defeats the Old Witch in a sequence of transformations ending with
    cat killing rooster.
  language: English, with Jamaican Creole dialect forms
  quote_policy: summarized
