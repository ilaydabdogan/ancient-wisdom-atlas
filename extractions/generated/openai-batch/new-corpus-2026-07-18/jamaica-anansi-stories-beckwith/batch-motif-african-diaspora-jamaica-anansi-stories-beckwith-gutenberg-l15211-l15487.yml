  summary: The passage is a set of supplementary comparative notes to riddles, citing
    parallels from Scottish, Catalan, West African, Swahili, Nandi, Puerto Rican,
    Mexican, Irish, Gaelic, Welsh-Gypsy, Canadian, Filipino, and other collections.
    It records brief riddle formulas and some answers, including parallel roads, a
    nail in a brogue, the wild banana plant, rat, baking plate on fire, earth and
    sky, train or ship, wind, fire/griddle/oatcake, blackberries, milking a cow, coconut/eater,
    and a fox stealing a goose.
