canonical_text:
  quote: ''
  summary: 'The passage contains a red-yam naming-and-reward episode followed by numbered
    Jamaican animal and dance-song stories: Anansi and Tacoomah steal rum while Monkey
    and Baboon dance; Fowl invites Pretty Poll and Kyan-crow to chapel; an old couple
    hear and dance the Cumbolo; John-crow and Fowl dispute a substituted baby before
    a judge; Wooden Ping-ping hides from Cock; and several animals speak characteristic
    sayings, ending with an endurance wager between Hopping Dick and White Belly.'
  language: English with Jamaican Creole dialogue and songs
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A little boy follows his father, hears the yam identified as red yam, gives
    the name when asked, receives a large dinner, and sings about his full belly and
    the red yam.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tacoomah, Monkey, and Baboon are carrying rum to a wharf for a master; Anansi
    and Tacoomah use a dance as the occasion to steal three puncheons of rum from
    Monkey and Baboon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dance-song in the Guzzah Man story names Anansi as drinking rum and also
    mentions Tiger being tied and Tom being drunk but not a fool.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fowl invites Pretty Poll to chapel; Pretty Poll refuses because of bare feathers,
    and Kyan-crow refuses because of a bald head.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old man and his wife hear sweet music; the wife says it was old Cumbolo
    singing, and the passage directs singing and dancing the Cumbolo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Crow takes Fowl’s pretty baby and leaves Crow’s own baby with Fowl; at court
    the judge awards the prettier baby to the one who sings the sweetest song, and
    Fowl gets her baby back.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Wooden Ping-ping hides in the earth while Cock searches; they sing back and
    forth, but Cock cannot find Wooden Ping-ping.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Animal Talk section assigns characteristic utterances to Fowl, Cock, Horse,
