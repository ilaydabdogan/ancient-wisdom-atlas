canonical_text:
  quote: ''
  summary: The preface describes the collection and recording of Jamaican Anansi stories,
    explains the scope of Anansi storytelling, links Anansi with trickster and culture-hero
    roles, notes beliefs about dead spirits taking animal form and magical songs,
    and describes Jamaican riddling practice and its African and English connections.
  language: English
  quote_policy: summarized
literal_observations:
