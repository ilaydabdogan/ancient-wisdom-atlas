canonical_text:
  quote: ''
  summary: The passage contains the end of a punitive dinner episode involving Anansi
    and a horse-whip; the story “The Riddle,” in which Anansi helps the condemned
    Tacoomah win release by posing an engineered riddle to the king; “Brother Dead’s
    Wife,” in which Anansi takes food from silent Brother Dead, brings his daughter
    Sindy, and is pursued until he drops into the dirt; and the beginning of “Goat
    and Plantain,” in which Goat retaliates after Anansi steals a plantain.
  language: English with Jamaican Creole dialectal narration and dialogue
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A host invites people who eat with knife and fork to a great dinner, puts
