- id: motif:2
  label: Life saved by an unanswerable riddle
  taxonomy_refs:
  - wisdom
  - trickster_boundary
  basis: Anansi obtains a promise of release from the king and engineers a riddle
    whose unlikely statements are literally satisfied by staged objects and actions.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage frames the success as clever lying; it does not make a broader
    moral interpretation explicit.
- id: motif:3
  label: Death as the one who can fool the trickster
  taxonomy_refs:
  - trickster_boundary
  basis: The passage states that only Brar Dead can fool Anansi, and the Brother Dead
    episode shows Anansi’s actions in Dead country leading to pursuit and loss of
    control over his household.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The exact manner in which Brother Dead fools Anansi is implied by the
