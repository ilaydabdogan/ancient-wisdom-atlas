canonical_text:
  quote: "“Anansi is a smart one, very smart, likes to do unfair business.”"
  summary: The passage contains the end of one Anansi episode and two titled Anansi
    animal stories. Anansi escapes Tiger after weak binding and being thrown into
    the sea; in “The Substitute,” he tricks a woman into compensating a spoiled bird
    with a sheep, steals more sheep, and escapes while a friend is captured; in “In
    the House-top,” Tiger disguises himself as a big barrow, pursues Anansi home,
    swallows Anansi’s children and wife after Anansi pushes them down from the housetop,
    and is finally evaded when Anansi jumps into dry trash.
  language: English with Jamaican Creole/dialectal transcription
