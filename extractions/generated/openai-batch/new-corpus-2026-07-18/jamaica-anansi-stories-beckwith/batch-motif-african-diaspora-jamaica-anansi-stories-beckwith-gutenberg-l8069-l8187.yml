canonical_text:
  quote: ''
  summary: 'The passage contains several short Jamaican oral tales: an untitled courtship
    tale in which a man falsely presents others'' properties as his wealth; two variants
    of a tale about body-named brothers whose body parts fail disastrously; a goat
    mother who escapes a lion''s den with her two kids through clever speech; a donkey
    and cat who frighten lions with a single lion head by pretending to have many;
    and the beginning of a Molly May tale in which Anansi leaves her to prepare a
    turkey dinner and she eats the turkey and drinks the wine.'
  language: English with Jamaican Creole dialogue
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man courting a young lady takes her riding and claims that three properties
    with logwood, livestock, horses, and mules are his.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After marriage, the wife asks for money for household supplies, and the husband
    says he has no property, explaining that when he wiped his face he meant his whiskers
    rather than the displayed properties.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In one version of the body-name tale, three sons named Big-head, Big-belly,
    and Little-foot go walking; Big-head tastes a berry and his head drops off, Big-belly
    laughs until his belly bursts, and Little-foot breaks his foot running home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In another version, three hungry brothers see a tar-apple tree; Maugre-Neck
    climbs and eats fruit, his head breaks off while tempting the others, Big-Belly's
    belly pops from laughing, and Maugre-Foot's foot breaks while carrying news home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A mother goat and two kids travel until evening in the rain and shelter under
    a great rock, not knowing it is the lion's house.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The mother goat greets the lion as a minister and says she seeks baptism and
    names for the two kids; the lion names the goats as meals.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The mother goat persuades the lion to let the kids go outside for air, whispers
    for them to escape, then gains permission to go fetch them and does not return.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The stated meaning of the goat tale is that a woman has more knowledge than
    a man.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A donkey and a cat find a lion head while traveling, and the cat puts it into
    the donkey's hamper.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The donkey and cat meet two lions working on the road and pretend to select
    among many lion heads for eating, though they have only one.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Anansi leaves Little Molly May, his servant, to roast a turkey for dinner
    while he goes out to invite a friend; he fills the wine-jug and lays the table
    before leaving.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Molly May tastes the turkey repeatedly, drinks wine, and by the end of the
