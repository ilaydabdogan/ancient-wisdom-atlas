canonical_text:
  quote: ''
  summary: The passage contains the end of a Devil tale in which visitors are hidden,
    instructed how to pass the Devil, and one child is killed after misreciting the
    required words; the tale explains sea moss from the Devil's hair. It then gives
    'Alimoty and Aliminty,' where a jealous woman uses a Lion to kill Alimoty, but
    dress-swapping causes her own daughters to be killed; Alimoty is aided by a dead
    mother and saved when Aliminty kills the Lion. It begins 'The Fish Lover,' where
    Lydia, burdened by her stepmother with a heavy water jar, receives help from a
    Jack-fish named Timbo Limbo after agreeing to be his wife; her family discovers
    and kills the fish by imitating Lydia's song, and a scale flies to Lydia, who
    recognizes it and calls him without answer.
  language: English with Jamaican Creole dialect representation
  quote_policy: summarized
