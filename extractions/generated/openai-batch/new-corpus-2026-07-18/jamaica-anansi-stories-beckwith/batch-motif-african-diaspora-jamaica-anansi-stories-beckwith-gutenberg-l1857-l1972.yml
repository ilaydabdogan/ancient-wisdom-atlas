canonical_text:
  quote: ''
  summary: The passage contains the end of a Cunnie-mo'n-father episode in which Anansi
    is deceived into being drowned for supposed sheep under the sea; the tale of the
    Duckano tree, where Tacoomah discovers Anansi's hidden food tree and Dog's body
    is etiologically marked; and two Food and Cudgel variants in which magic food-producing
    objects are followed by whipping objects.
  language: English with Jamaican Creole dialect forms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cunnie-mo'n-father returns after Tiger says he threw him into the farthest
    part of the sea, driving a flock of sheep and claiming the place where he was
    thrown supplied them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Anansi asks to be thrown where he can get sheep; Cunnie-mo'n-father has a
    coffin made, puts Anansi in it, carries him by boat far out to sea, and drowns
    him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During hard times, Anansi secretly eats from a Duckano tree at night and brings
    food back in a bag while refusing his wife's small dinner and giving it to the
    children.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tacoomah has Anansi's traveling bag punctured and filled with ashes, follows
    the ash trail to the Duckano tree, harvests it, and commands the remaining Duckano
    to evade Anansi; the tale states only Tacoomah can pick the Duckano.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Dog eats a fallen Duckano, hides in a deep hole, and Anansi pulls him out
    and squeezes the Duckano from him; the tale explains two sunken places in Dog's
    side by this squeezing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In one Food and Cudgel variant, Anansi distributes seven plantains so that
    each family member gives him a piece, leaving him with more than anyone else.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A speaking packey produces a table full of food when praised and commanded;
    Anansi hides it in the loft and feeds privately until his wife and children find
    it and crack it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The same or another packey later produces a cow-whip that flogs Anansi; Anansi
    places it for his family, and it lashes the wife and children, after which the
    tale explains Anansi living in crevices.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In another Food and Cudgel variant, Anansi loses a hatchet near water, dives,
    finds a knife and fork instead, and the utensils lay out requested food for him
    and guests.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Ants spoil the knife and fork; Anansi deliberately repeats the water-diving
    action and finds a horse-whip, which flogs him when he commands it to make food.
  category: sequence
  evidence_refs:
  - ev:10
