canonical_text:
  quote: ''
  summary: 'The passage contains several animal tales: Anansi avoids a weeding obligation
    by claiming fever; animals make a skin drum and Roach plays it before being eaten
    by Puss; Guinea-hen exploits Hunter''s field, borrows Fish''s wing, abandons Fish,
    and Fish escapes by singing while being carried to the sea; Brer Fox catches Brer
    Rabbit with a tar-pole, but Rabbit tricks Fox into throwing him into the bramble.'
  language: English
  quote_policy: summarized
