canonical_text:
  quote: ''
  summary: 'Scholarly notes compare several Jamaica Anansi story episodes with African,
    Afro-diasporic, and other cited versions: fire possessed by a monster; swallowed
    victims rescued by cutting open the monster; witch tests and dangerous transformations;
    life-token episodes; tree-climbing flight and rescue by dogs; the tale of Andrew
    and his sisters; a hunter tale about withholding secret transformations; and the
    Man-Snake bridegroom pattern in Jamaica monster-marriage stories.'
  language: English
  quote_policy: summarized
