candidate_motifs:
- id: motif:1
  label: Fire possessed by a dangerous monster
  taxonomy_refs: []
  basis: The passage explicitly says possessing fire is a sign of magic power and
    summarizes a worm that has fire and swallows those who try to fetch it.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The note summarizes cited variants rather than giving a full primary narrative
    in this passage.
- id: motif:2
  label: Swallowed victims rescued by cutting open the monster
  taxonomy_refs: []
  basis: The father is swallowed by the worm, cuts it open from within, and rescues
    all swallowed people.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The motif is present in the summarized Edwards version, not necessarily
    in every cited comparison.
- id: motif:3
  label: Danger follows seeing what should not be seen
  taxonomy_refs:
  - forbidden_knowledge
  basis: The witch proposes a test because the hunter has seen more than he should.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not describe the full test in detail.
- id: motif:4
  label: Escape from witch’s teeth or razor through helper or transformation
  taxonomy_refs:
  - shapeshifter
  basis: The horse wakes the boy as the witch sharpens her teeth, and another version
    has the boy evade the witch’s razor by turning into a bucket of water.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The helper episode and transformation escape are reported from different
    cited variants.
- id: motif:5
  label: External life-token or danger sign
  taxonomy_refs: []
  basis: The note discusses life-token forms including knife in tree, flute warning,
    and water in a saucer turning to blood.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The collector states the attachment of the life-token episode to the story
    is unclear and not found by the collector in African versions.
- id: motif:6
  label: Tree-climbing escape with tree-cutting pursuit and dog rescue
  taxonomy_refs: []
  basis: The passage describes climbing a tree to escape an enemy, an axe-chopping
    contest, and dogs that rescue by attacking the pursuer.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage also notes that tree-cutting can occur independently of rescuing
    dogs.
- id: motif:7
  label: Secret final transformation withheld from a confidant
  taxonomy_refs:
  - shapeshifter
  - wisdom
  basis: The Hunter note states that the story’s point is not to reveal all thoughts
    and cites variants where a protagonist reveals transformation resources but not
    the last one.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: Specific transformations vary across cited versions.
- id: motif:8
  label: Witch obtains or burns a personal power object, triggering hawk escape
  taxonomy_refs:
  - shapeshifter
  basis: In Barker, the witch gets the man’s god and burns it; before it is consumed,
    it turns him into a hawk and he flies away.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is one cited variant and may not be part of the core Jamaica version
    summarized here.
- id: motif:9
  label: Monster marriage with Snake husband disguised as handsome suitor
  taxonomy_refs:
  - shapeshifter
  - stolen_beloved
  basis: The Snake husband pattern includes a Snake dressed as a handsome man, borrowed
    parts falling away, the bride taken home, and rescue before swallowing.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage distinguishes Snake husband from other monster-marriage types
    but does not describe the Devil husband or Bull husband patterns in detail.
- id: motif:10
  label: Rescue by brothers after distress song
  taxonomy_refs: []
  basis: The bride’s brothers hear her song of distress and rescue her just as the
    Snake is about to swallow her.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: This is described as part of the Snake husband pattern, not as an independent
    tale in the passage.
- id: motif:11
  label: Imitative danger song as audience performance device
  taxonomy_refs: []
  basis: The note says the imitative “Sharpen me razor” song makes Andrew and his
