candidate_motifs:
- id: motif:1
  label: Trickster wins musical rivalry through verbal food-song
  taxonomy_refs:
  - trickster_boundary
  basis: In two ball episodes, Anansi uses sung or fiddled food phrases to redirect
    favor away from rival fiddlers.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: The exact meaning of the dialect food phrases is partly glossed in the
    passage but not fully explained.
- id: motif:2
  label: Living or unstable garment made from insects exposes wearer
  taxonomy_refs: []
  basis: A suit made of maggot-flies runs away at dinner when the flies smell meat,
    leaving the wearer naked.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The antecedent of the naked wearer is not fully clear in the excerpt.
- id: motif:3
  label: Bride won by guessing a concealed name
  taxonomy_refs:
  - trickster_boundary
  basis: Monkey sets a long secret name as the condition for marrying his daughter;
    Spider learns the name from Green-lizard and succeeds.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage supports the name-guessing pattern, but no external tale type
    is named.
- id: motif:4
  label: Trickster’s boastful song reveals deception
  taxonomy_refs:
  - trickster_boundary
  basis: Spider sings to the baby that his cunning won the baby’s mother; the revelation
    is overheard and leads to punishment.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage presents the song as both lullaby and confession; interpretation
    beyond that should be reviewed.
- id: motif:5
  label: Etiological warning against killing a spider
  taxonomy_refs: []
  basis: After Monkey kills Spider and the baby falls dead, the narrator states that
    one should never kill a Spider because whatever is in hand will break.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives the rule directly but does not expand its range beyond
    the stated warning.
- id: motif:6
  label: Trickster evades creditors through a chain of victims
  taxonomy_refs:
  - trickster_boundary
  basis: Hanansi borrows from multiple animals, summons them at the same time, directs
    them against one another, and kills the final creditor by a pit trap.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: Some intermediate deaths are explicit, while the full fate of every animal
    in the room is not equally detailed.
comparison_claims:
- id: claim:1
  claim: 'The two fiddling-at-a-ball episodes in this passage appear to be variants
    of a similar trickster performance pattern: a rival initially competes for attention
    or a bride, and Anansi gains advantage through food-word song.'
  claim_level: same_motif
  target: The opening ball episode with Quit-quit and the following “Fiddlers” episode
    with Tiger
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The first episode’s rival structure and outcome differ from the Tiger
    variant, and the maggot-fly suit element appears only in the first episode.
- id: claim:2
  claim: The Spider-and-Monkey story fits a name-guessing bride-contest pattern within
    the passage’s own evidence.
  claim_level: same_function
  target: Name-guessing marriage-task pattern
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: No external tale type or parallel is cited in the passage; the claim
    is limited to structural similarity.
- id: claim:3
  claim: The “Chain of Victims” tale fits a trickster chain pattern in which sequential
    arrivals are manipulated into becoming prey or killers.
  claim_level: same_function
