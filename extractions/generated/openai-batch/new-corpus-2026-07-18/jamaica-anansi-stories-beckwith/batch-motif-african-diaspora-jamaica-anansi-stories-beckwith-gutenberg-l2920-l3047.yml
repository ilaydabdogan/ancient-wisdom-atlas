canonical_text:
  quote: ''
  summary: 'The passage contains several Anansi/Spider animal tales: a fiddling-at-a-ball
    episode involving rival songs and a maggot-fly suit; a variant in which Anansi
    defeats Tiger in a fiddling contest for the king’s daughter; a tale in which Spider
    wins Monkey’s daughter by learning her secret name, later reveals his cunning
    in a lullaby, and is killed; and a tale in which Hanansi borrows from several
    animals, manipulates them into killing one another, and traps Lion in a hole.'
  language: English with Jamaican Creole dialogue
  quote_policy: summarized
