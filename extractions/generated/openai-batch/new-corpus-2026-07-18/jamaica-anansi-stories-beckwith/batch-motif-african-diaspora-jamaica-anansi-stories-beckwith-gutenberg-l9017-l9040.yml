  quote: ''
  summary: 'The passage contains two brief ''Lies'' anecdotes involving water: one
    in which a duck eats a gourd and leaves the water hanging on a tree, and another
    in which the speaker passes through a ten-barbed-wire fence with a pan of water
    on the head without spilling a drop. It then gives a ''Philosophy'' saying that
    if life could be bought with money, the rich would live and poor people like the
    speaker would have to die.'
