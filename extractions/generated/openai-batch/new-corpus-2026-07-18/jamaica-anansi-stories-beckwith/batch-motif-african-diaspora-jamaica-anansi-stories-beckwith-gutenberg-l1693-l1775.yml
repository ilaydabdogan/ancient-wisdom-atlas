canonical_text:
  quote: ''
  summary: The passage contains the end of one Anansi episode and the beginning of
    another. In the first, Tacoomah teaches Anansi words that open and shut a cow’s
    belly so fat can be cut from inside; Anansi later goes alone, cuts the forbidden
    back-string, causes the cow to die, hides in the remains, deceives the master’s
    daughter, obtains a cow as compensation, and then loses the roasted cow to Dry-head.
    In the second, Anansi withholds yam from his family by requiring them to know
    the yam’s secret name, until his child Cunnie-mo’-than-father tricks him into
    revealing it.
  language: English
  quote_policy: summarized
