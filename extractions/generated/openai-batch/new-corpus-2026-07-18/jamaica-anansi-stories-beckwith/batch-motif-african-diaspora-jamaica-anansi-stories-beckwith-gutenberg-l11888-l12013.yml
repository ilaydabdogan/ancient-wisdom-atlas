canonical_text:
  quote: ''
  summary: 'Scholarly notes summarize and compare several Jamaica Anansi-story episodes:
    Dog and Dog-head, Tacoomah’s Corn-piece, Anansi and the Tar Baby, and Inside the
    Cow. The notes describe story structures, distribution, theft-detection devices,
    escape by substitution, magic passes and passwords, violated prohibitions, mock
    sunrise tricks, and comparative parallels in Afro-Caribbean, African, Bahamian,
    Louisiana, Spanish, and Uncle Remus materials.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Dog and Dog-head story is described as widespread in Jamaica, with no
    African version found by the editor and with reported presence in South Carolina
    but not North Carolina.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Dog and Dog-head story is summarized as having two friends, one with a
    dog and one with a dog-head, who go hunting; the dog-head owner claims the spoils.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The companion who does not openly dispute the dog-head owner later recovers
    the spoils by pretending that the owner has come to punish the theft.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One introductory variant says each friend receives a dog, but one greedy man
    eats his dog from the tail until only the head remains.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the tar-baby notes, the tar-baby story is identified as a popular Jamaican
    device for catching a thief.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Jamaican thief stories are said to emphasize the unexpected identity of the
    thief, including cases where the thief is the watchman, an intimate friend, or
    the father of the family.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Anansi is said to establish an alibi by playing all night at a dance while
    his gang robs the field.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The notes identify an escape by means of a substitute and connect the ending
    with Boukee and Rabby-cycle equivalents from Bahama and Louisiana traditions.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'The Inside the Cow notes describe four forms of a lost-pass story: across
    water, inside a tree, to the sky, and inside the cow.'
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: A magic pass is attached to the listed lost-pass passages, and a violated
    prohibition or forgotten password traps the intruder until the master of the place
    appears.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: A recurring pattern begins with a trickster discovering food in a neighbor’s
    possession.
  category: action
  evidence_refs:
  - ev:12
- id: obs:12
  text: The trickster’s impatience can produce a mock sunrise by burning a roof, setting
    a tree on fire, simulating cock-crowing, or making children rattle spoons and
    sweep the floor.
  category: action
  evidence_refs:
  - ev:13
- id: obs:13
  text: In Parkes’s version, Anansi wakes at the cow-boy’s bell, learns the trick
    from his friend, and goes alone for supplies without calling his neighbor.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:14
  text: In the inside-the-cow pattern, the trickster cuts meat from inside the cow
    despite a warning and in some versions cuts a vital organ.
  category: action
  evidence_refs:
  - ev:15
- id: obs:15
  text: In another episode of the pattern, when the owner of the dead cow comes to
    cut it up, the trickster hides in an organ that the owner’s daughter takes to
    the brook to wash.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:16
  text: After jumping out near the brook, the trickster pretends he was bathing, complains
    of insult, and obtains the cow as damages.
  category: action
  evidence_refs:
  - ev:16
