- id: ev:2
  type: summary
  locator: lines 11895-11900
  quote_or_summary: 'The story has two parts: two friends with a dog and a dog-head
    go hunting, the dog-head owner claims the spoils, and the companion recovers them
    by pretending the owner has come to punish the theft.'
  source_text_path: texts/public-domain/afro-caribbean/project-gutenberg/jamaica-anansi-stories-beckwith.md
  rights_note: Public domain source; summary provided.
