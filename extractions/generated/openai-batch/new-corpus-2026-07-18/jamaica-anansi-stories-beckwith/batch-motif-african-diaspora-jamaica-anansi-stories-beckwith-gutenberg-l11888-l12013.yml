comparison_claims:
- id: claim:1
  claim: The editor suggests the complete Dog and Dog-head story may have a fairly
    modern origin based on its reported distribution in Jamaica and South Carolina
    and absence from identified African and North Carolina versions.
  claim_level: historical_contact
  target: Distribution of Dog and Dog-head in Jamaica, South Carolina, and North Carolina
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an editorial inference from reported distribution, not direct
    historical evidence.
- id: claim:2
  claim: The dog-head claim to hunting spoils is cautiously related to stories where
    a man places a newborn calf beside his bull and declares that the bull mothered
    it.
  claim_level: same_function
  target: False paternity or false ownership claim involving bull and calf in Basset
    2:88
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage says the trick may be related; it does not assert identity
    of motif or transmission.
- id: claim:3
  claim: The notes compare the revenge portion of Dog and Dog-head with Rivière and
    Harris parallels.
  claim_level: same_motif
  target: Revenge episodes in Rivière 11 and Harris, Nights 131–132
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: low
  limitations: The passage names comparanda but gives no details of the compared revenge
    episodes.
- id: claim:4
  claim: The tar-baby story is explicitly compared across negro folk-lore, negro practices,
    Bahamian, Sea Islands, Spanish, and other cited materials.
  claim_level: same_motif
  target: Tar-baby story distribution in cited Afro-diasporic and Spanish collections
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The passage summarizes bibliography and distribution; it does not present
    all parallel texts.
- id: claim:5
  claim: The passage states that the escape into habitat is uncommon in Jamaica and
    is more amusing when associated with Rabbit, suggesting functional variation by
    animal figure.
  claim_level: same_function
  target: Escape into habitat motif associated with Rabbit
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is editorial and briefly stated; no full Rabbit version is
    included here.
- id: claim:6
  claim: The passage compares Anansi’s alibi device with a Junod Rabbit story where
    Rabbit is fastened under a mortar, escapes, and returns to the trap.
  claim_level: same_function
  target: Alibi or trap-evasion device in Junod 102 Rabbit story
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The compared devices are summarized as analogous diversion or alibi
    strategies, not identical plots.
- id: claim:7
  claim: The passage derives the Goat substitute ending from the Boukee and Rabby
    cycle of Bahama and Louisiana equivalents.
  claim_level: historical_contact
  target: Boukee and Rabby-cycle Bahama and Louisiana equivalents
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The derivation is an editorial assertion; the passage does not provide
    a transmission history.
- id: claim:8
