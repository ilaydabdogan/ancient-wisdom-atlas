  - ev:9
  - ev:10
  - ev:11
- id: obs:9
  text: In several variants, the boy calls the bull or monster by name, and the bull
    or monster remarks on the unusualness of hearing that name called.
  category: speech
  evidence_refs:
  - ev:6
  - ev:8
  - ev:10
- id: obs:10
  text: In several variants, the boy climbs a tree and uses a formulaic song or saying
    asking the tree to bear up against attack.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
  - ev:9
  - ev:10
  - ev:11
  - ev:12
- id: obs:11
  text: The standardized seven-episode outline says a bull or monster kills a woman,
    her newborn son is saved and raised by a woman-friend or relative, schoolboys
    mock him as fatherless, he learns his parentage, takes objects for slaying the
    monster, sings a name-song challenge, climbs a resistant tree, slays the beast
    with missiles from the tree, and Anansi claims the deed.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:12
  text: One version has a boy peg down Grandezee and remove golden tongue and teeth
    before the false claim follows.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: One version makes the mother’s slayer a giant named Tako-rimo and continues
    with imprisonment by the brother Giant Despair and escape like the tale of Jack
    the Giant-Killer.
  category: sequence
  evidence_refs:
  - ev:8
