canonical_text:
  quote: ''
  summary: 'Scholarly notes compare variants of several tale groups: flight episodes
    with obstacles, transformations, water crossings, riddles, and secret doors; the
    Jamaican beast-spouse story in which a bull or other beast is transformed by song;
    the Two Bulls/Tangalimlibo material involving a river woman and a challenge story;
    and Ballinder Bull variants in which a hidden son learns his parentage, challenges
    a bull or monster by name from a tree, slays it, and may have the deed falsely
    claimed by Anansi.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several cited versions develop a flight episode into an obstacle race, an
    escape by transformation, a divided sea, a crocodile crossing, riddling questions,
    or a secret-door episode.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Jamaica version named in the note is described as bare of incident, centering
    on imitative songs of swallowing and running and on a boat-call rather than on
    further development of the flight theme.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note says the story of a beast-husband transformed by means of a song
    is common in Jamaica.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Andros Island variants summarized here, the transformed beast is the
    wife and has the form of a bird; in the versions heard by the collector and in
    Milne-Home, the wooer is a bull.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A story from Theal is summarized as involving a mysterious beautiful woman
    who goes to the river only at night, is persuaded by enemies to go out by day,
    is taken by the river, returns to suckle her child, and is ransomed by sacrificing
    an ox.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the challenge story note, a bull has killed the mother’s sons and has unknowingly
    fathered the successful antagonist, who was brought up in secret and apparently
    learns the father’s secret name from the mother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ballinder Bull is described as one of the best-known stories in Jamaica, with
    multiple Jamaican versions following about the same pattern.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Variant accounts list objects taken by the boy, including arrows, water, rum,
    eggs, tobacco, a pone, an iron crowbar, pegs, lances, a loaf, and a bottle of
    water.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
