- id: obs:8
  text: In a related example, Boukee shoots Elephant, brings him home to the family,
    and is brought to justice when children are overheard singing about Elephant’s
    gut.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A story episode involves leaving behind or throwing away an implement needed
