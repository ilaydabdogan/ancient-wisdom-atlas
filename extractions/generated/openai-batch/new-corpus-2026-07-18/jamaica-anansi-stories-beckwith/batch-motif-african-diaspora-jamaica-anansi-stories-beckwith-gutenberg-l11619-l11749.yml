canonical_text:
  quote: ''
  summary: 'Notes compare several Jamaican Anansi-story episodes and their analogues:
    theft of a shared butter or food supply, framing an innocent companion by smearing
    him with food, tests for detecting a thief, a diving plot in which a trickster
    eats food while another is in the water, throwing away implements needed for food,
    escape by saying grace, a story of learning what trouble is, and rescue from a
    hole by blinding the watcher.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A rascal leaves his companion three times under the pretext of being summoned
    to a christening, in order to rob a tub of butter held in common.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rascal smears the innocent companion with butter so that the companion
    appears guilty.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The notes identify stolen food-supply as a common episode in trickster stories
    and list tests to detect the thief, including taking a purge, jumping over fire,
    walking or jumping over a string, and crossing a river.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The notes say the trick of incriminating another person regularly involves
    smearing an innocent sleeping victim with food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rabbit steals the key to a granary, eats the stored common food, and scatters
    the remains in the house of Hyena, who is the guardian.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the diving plot, a trickster proposes diving and eats a store of food while
