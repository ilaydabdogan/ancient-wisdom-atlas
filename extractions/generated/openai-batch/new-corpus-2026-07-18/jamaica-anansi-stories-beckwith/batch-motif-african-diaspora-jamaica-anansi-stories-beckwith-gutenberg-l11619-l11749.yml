  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The notes mention Monkey helping Tiger out of a hole, followed by Tiger’s
    ingratitude.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The notes identify an escape by saying grace.
  category: action
  evidence_refs:
