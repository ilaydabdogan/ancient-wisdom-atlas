- id: obs:14
  text: 'A complete ''Seeing Trouble'' story is described as having three parts: an
    inexperienced animal wants to know what trouble is, the rascal gets him into difficulty,
    and the rascal helps him out again.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: 'Several plots are listed as ways to teach wisdom: releasing a bulldog from
    a bag, setting deep grass on fire, imitating a supposed killing of young animals
    or mothers, and imitating a pretended self-disembowelment.'
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Escape into a hole is described as very common, and the usual rescue method
