canonical_text:
  quote: ''
  summary: 'The passage contains several short Jack and Robin tales: Jack climbs a
    bean-tree to a giant’s house, is hidden by the giant’s wife, steals the giant’s
    money, and returns to his mother; Jack helps a locked-up woman against the Devil/master
    by using a coded song and a heated oven until her father arrives; a boy frames
    a riddle from poisoned dumplings, a dead donkey, dead John-crows, and oranges
    before challenging a king’s daughter; Jack succeeds as a supposed fortune-teller
    when servants mistake his comments about meals for knowledge of their theft and
    he recovers a ring from a turkey; Robin, called Mr. Fox Robin, twice succeeds
    in identifying hidden dinner contents through accidental self-referential sayings.'
  language: English
  quote_policy: summarized
