canonical_text:
  quote: ''
  summary: 'A sequence of Jamaican animal tales explains present traits or conditions:
    Woodpecker bores wood because he buried his mother in wood rather than stone;
    Crab is denied a head by God after muddying water in premature celebration and
    is afraid after dark; mice remain small after Robin Mice-rat kills his oldest
    uncle in pursuit of becoming big; Rat is killed after returning to scrape burnt
    rice from a pot; and Cockroach is twice swallowed by a fowl after deceptive behavior,
    explaining why cockroaches avoid fowl yards.'
  language: English, with Jamaican Creole-inflected transcription
  quote_policy: summarized
