canonical_text:
  quote: ''
  summary: The passage contains several Jamaican Anansi animal-story episodes. Anansi
    or Hanansi repeatedly uses speech rules, pretexts, concealment, and theft to get
    food from Tiger or others; in some episodes he is punished, exposed, or forced
    to flee. The episodes include breakfast deception, a cow-meat imitation that explains
    Anansi’s white belly, egg-taking and scorpions, theft of a food-producing sheep,
    hiding in Tiger’s bone-hole, false christening names to cover eating butter, and
    stealing Tiger’s insides at the river.
  language: English with Jamaican Creole dialogue
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Hanansi eats breakfast at Tiger’s house every day and sets a rule for Tiger’s
    visit to his own house: Tiger should come when he hears noise and stay away when
    it is still; Tiger arrives after Hanansi has eaten.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hanansi tells Tiger to answer a set phrase during breakfast, and Hanansi eats
    everything while Tiger gets none.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tiger says he gets meat by putting his hand inside a cow; Hanansi imitates
    this, and the cow traps his hand, runs downhill, and drags him over stones, which
    the story gives as the reason for Hanansi’s white belly.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Anansi and Blinkie search for bird eggs; Anansi arranges that he will claim
    the big eggs, and Blinkie later leaves Anansi in the bush and flies away with
    the light.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Anansi comes to Tiger’s house at night and offers eggs for dinner; Tiger commands
    a sheep to lay out food, and the sheep provides roast fowl, roast duck, and other
    foods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tiger places scorpions around the eggs; when Anansi reaches for them, a scorpion
    bites him, and Anansi explains his cry by referring to his wife and children;
    later he steals the sheep.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Anansi, his wife, and three children go to Tiger’s house, eat from Tiger’s
    pot of meat, and hide in Tiger’s bone-hole when Tiger approaches.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tiger throws bones into the hole, striking Anansi’s children, wife, and finally
    Anansi; Anansi silences the others until he is hit, then tells all to cry out,
    frightening Tiger away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Anansi and Tiger hide a keg of butter; Anansi repeatedly claims to attend
    christenings and reports names that mark stages of removal from the butter: “Top
    take off,” “Catch in de middle,” and “Lick clean.”'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After tiring Tiger and letting him sleep, Anansi scrapes butter from the keg,
    smears some on Tiger’s mouth and tail, climbs a tall tree, and raises an alarm
    accusing Tiger of eating the butter.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At the river-side, Anansi tells Tiger to remove and wash his insides and dip
    his head in the water; while Tiger’s head is in the water, Anansi takes the insides
    to his wife Tacoomah to boil.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After Tiger is dead, Anansi rehearses his children’s funeral cries; one child
    states that the thing brought home and boiled was Tiger’s gut, so Anansi locks
    that child up, but another man releases the child, and Anansi flees to the house-top
    when he sees the child coming.
  category: sequence
  evidence_refs:
  - ev:8
