canonical_text:
  quote: ''
  summary: 'The passage contains several Jamaican Anansi animal stories: Hanansi enters
    Kyan-crow’s house by imitating its spoken key and later scalds Kyan-crow during
    a dance; Tacoomah lures and kills visitors in hard times, while Goat observes
    the danger and flees to the hillside; Hanansi falsely claims a cow caught by Tacoomah’s
    dog using a dog-head; Hanansi uses a dance and fiddle tune to cover the theft
    of Tacoomah’s corn; Tiger catches Hanansi stealing peas with a tarred stump, but
    Hanansi tricks Tiger into the fire; the final excerpt begins a story in which
    Anansi steals from Tacoomah’s ground.'
  language: English, with Jamaican Creole dialect representation
  quote_policy: summarized
