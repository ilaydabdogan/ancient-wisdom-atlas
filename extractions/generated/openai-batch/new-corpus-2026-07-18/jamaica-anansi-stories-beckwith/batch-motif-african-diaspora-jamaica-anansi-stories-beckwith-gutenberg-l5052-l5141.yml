canonical_text:
  quote: ''
  summary: The passage contains the end of one tale about a mother-in-law sending
    her own daughter to repeat another woman's journey for water and riches; the daughter
    insults strange beings, fails the old woman's tests, takes the wrong eggs, and
    is killed by a being released from an egg. It then begins 'The Three Dogs,' in
    which two brothers forget fire while herding cattle; William observes an Old Witch
    woman whose hidden household emerges from her body, obtains fire without taking
    the forbidden fire-stick, is claimed by the witch as husband, and is protected
    at night by his three dogs when she tries to cut his throat with a razor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mother-in-law, thinking another woman had gained riches from an Old Witch,
    sends her own daughter to Bosen Corner for water so she may also get riches.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sent girl meets a disembodied head and then a disembodied foot, speaks
    contemptuously of them, and each tells her to go on because a better day is before
    her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the old lady's house, an old bone and four grains of rice become a pot
    full of rice and meat.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: After sharing dinner, the old lady is described as turning into a puss; when
    the puss begs for rice, the girl throws it out the door.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old lady asks the girl to scratch her back, but the girl withdraws her
    hand and complains that the thing cuts the hand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The old lady tells the girl to take eggs behind the house; the big eggs ask
    to be taken and the little eggs say not to take them, but the girl takes four
    big eggs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At successive crossroads, the big eggs release snakes, insects, and finally
    a big Old Witch man who tears up and kills the girl in the road.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In 'The Three Dogs,' two brothers herding cows carry food but forget fire,
    see smoke on a hillside, and seek fire there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: William watches an Old Witch woman knock and bring out many people, including
    men, women, and children, who eat and later return into her back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Old Witch tells William to take fire but not her fire-stick; William instead
    lights rotten wood from the steam of the fire, and the narrator says William was
    a witch himself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Old Witch comes to William's home and says she will take as husband whoever
    knocks the packey from her head; William succeeds and she declares him her husband.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At night the Old Witch tries three times to cut William's throat with a razor,
    and each time one of William's three dogs grumbles and the razor's mouth turns
    over.
  category: sequence
  evidence_refs:
  - ev:8
