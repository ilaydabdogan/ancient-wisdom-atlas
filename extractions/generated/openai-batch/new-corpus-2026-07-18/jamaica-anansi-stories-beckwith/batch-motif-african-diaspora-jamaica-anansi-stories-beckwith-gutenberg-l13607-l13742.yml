canonical_text:
  quote: ''
  summary: Scholarly notes compare Jamaica Anansi story variants involving transformed
    bulls or buffaloes, magic weapons, fatal or hidden names, revealing songs, voice-changing
    abduction, bird and tooth motifs, and dumb-child or dumb-wife song episodes with
    African, Caribbean, European, Jataka, and Maori parallels.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Soundita variant is described as a contest with a witch turned buffalo using
    three magic eggs and three magic arrows; a Fortier variant has a boy fight a bull
    with flap-jacks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'A bull story comparison is said to contain two episodes: exposing a bull
    husband by means of a song and issuing a challenge to conflict.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note says a bull appears surprised that someone knows enough to challenge
    him by name, and that knowledge of the name is connected with defeat.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Jekyll version is summarized in which a son challenges his father by name,
    a cow reports that someone is calling the name, and the bull denies that any man
    can call his name.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says a fatal-name motive may have dropped out and been replaced
    by a magic song.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bird Arinto is linked to Man-Crow, to episodes in Zeltner and Tremearne, and
    to golden tongue and teeth references.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: In Bahama variants of Tiger Softens His Voice, the plot is described as rescue
    of a lost girl through song; in Jamaica, it turns on a voice-changing trick by
    which she is stolen.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hidden Names and Anansi and Mr. Able are described as plots turning on tricks
    to discover a hidden name.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Variants of the hidden-name tales conceal a listener so that secret keepers,
    described as girls, betray each other.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: In a Dayrell variant, Tortoise frightens wives into calling out a husband's
    name; the husband is ashamed and takes to the water.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: In a Barker variant, Anansi drops honey-sweetened bananas to girls, causing
    them to call to each other in surprise.
  category: action
  evidence_refs:
  - ev:10
