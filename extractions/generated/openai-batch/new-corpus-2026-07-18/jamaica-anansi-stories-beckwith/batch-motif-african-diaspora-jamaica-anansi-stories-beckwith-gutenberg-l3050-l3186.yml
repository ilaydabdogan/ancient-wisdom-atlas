- id: motif:3
  label: Container substitution in courtship challenge
  taxonomy_refs: []
  basis: The suitors’ similar jars allow Anansi to substitute a dung-filled jar for
    Tumble-bug’s money jar in a marriage contest.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: Limited to one tale in this passage.
- id: motif:4
  label: Scalding or hot substance removes feathers or threatens skin
  taxonomy_refs: []
  basis: John-crow’s baldness is attributed either to boiling-water baptism or hot
    pop thrown on the head; Toad is threatened with boiling water after felling the
    cotton tree.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:8
  confidence: medium
  cautions: The John-crow examples explain baldness directly; the Toad example concerns
    an escape from threatened scalding and explains croaking rather than a burned
    trait.
- id: motif:5
  label: Removal or injury of body part explains animal sound
  taxonomy_refs: []
  basis: Dove’s ears are struck and his cry is rendered as an ear complaint; Dog steals
