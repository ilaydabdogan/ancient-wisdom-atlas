canonical_text:
  quote: ''
  summary: 'A sequence of Jamaican animal tales explains present-day traits or habits:
    Tumble-bug rolling in filth, John-crow’s bald head in two variants, Dog’s looking,
    moss on river rocks, Ground-dove’s complaint, Hog’s grunting, and Toad’s croaking.
    Anansi appears in several tales as a deceiver or antagonist; other animal figures
    also deceive, steal, punish, or escape.'
  language: English with Jamaican Creole dialect forms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king’s daughter is offered in marriage to whoever brings a jar of money;
    Tumble-bug obtains money, while Anansi fills a similar jar with cow dung and horse
    dung.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the king’s yard Anansi pours out money from the swapped jar, while Tumble-bug
    pours out dung; the tale says this is why Tumble-bug rolls in filth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Anansi holds a grudge against John-crow because Crow disrupts his nest, then
    invites Crow to a wedding dinner followed by a baptism with boiling water.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the baptism variant, Anansi dips heads into boiling water, and the tale
    explains John-crow’s bald head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the dance variant, Anansi becomes angry because John Crow dances better
    than he does and throws hot pop onto John Crow’s head, burning off the head feathers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Anansi tells Dog that yams once grown on a desired plot of land were as big
    as Anansi’s leg; Dog replies that he would rather walk around and look than plant
    yams that small.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A river rock begs Anansi for food; Anansi refuses, the rock holds him, and
    a man pulls him free, leaving part of Anansi’s skin on the stone.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tiger asks Dove to watch the corn, but Dove later destroys it; Tiger catches
    Dove and slaps his ears, after which Dove’s song is described as a complaint about
    his ears.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Dog and Hog dive in the river; Dog comes up first, takes Hog’s mouth, and
    Hog afterward grunts about the missing mouth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Toad cuts down a cotton tree by throwing ashes on each cut so the chips cannot
    fasten back to the tree.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After Toad succeeds, the master prepares hot water as if to strip Toad’s skin;
    Toad jumps into wild pine, and the tale links his cry to present-day toad croaking.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage ends by introducing a following story titled “Why Woodpecker Bores
    Wood,” but no narrative for that story is included in this line range.
  category: other
  evidence_refs:
  - ev:9
