  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The body part affected differs between the tales.
- id: motif:6
  label: Impossible or self-repairing tree-cutting challenge overcome by ashes
  taxonomy_refs: []
  basis: Men fail to win the daughter because chips fasten back onto the cotton tree,
