  evidence_refs:
  - ev:9
  confidence: high
  cautions: No broader comparison beyond the passage is asserted.
- id: motif:8
  label: destructive guest after ignored warning
  taxonomy_refs: []
  basis: Ground Dove warns Anansi not to invite Fire; Anansi ignores her, prepares
    Fire's path, and Fire burns Anansi and his house.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: Although Fire is literal and personified, the passage does not frame the
    event as cosmic or world-destroying.
- id: motif:9
  label: trickster tricked or punished by intended victims and associates
  taxonomy_refs:
  - trickster_boundary
  basis: Anansi loses Goat and Turtle, is eaten by Assono after the failed dance trap,
