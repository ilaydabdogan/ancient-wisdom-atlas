candidate_motifs:
- id: motif:1
  label: false kinship used to exploit hospitality
  taxonomy_refs:
  - trickster_boundary
  basis: Anansi claims Fish as cousin, passes Fish's food test, then exploits the
    Fish household by eating eggs and deceiving the count.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not state a general rule for kinship tests; the motif
    label is derived from this episode only.
- id: motif:2
  label: single object repeatedly counted to conceal theft
  taxonomy_refs:
  - trickster_boundary
  basis: Anansi repeatedly presents the one remaining egg, wiping away marks each
    time, so Fish appears to count a full barrel.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No external tale-type comparison is asserted.
- id: motif:3
  label: misreported message during escape
  taxonomy_refs:
  - trickster_boundary
  basis: When Fish calls for Anansi to be brought back, Anansi tells the children
    she said to row quickly because a squall is ahead.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The extraction treats this as a trickster escape pattern without assigning
    a formal tale-type number.
- id: motif:4
  label: etiological explanation for eating fishes
  taxonomy_refs: []
  basis: After Anansi eats the Fish children, the tale states that from that day fishes
    are eaten.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The etiological claim is local to this tale as presented in the passage.
- id: motif:5
  label: prey escapes by becoming stone or rock
  taxonomy_refs:
  - shapeshifter
  basis: Goat turns into a white little stone in the rain variant and into a big rock
    in the dance variant; in both cases Anansi throws the transformed Goat across
    the river.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage gives no mechanism or ritual explanation for the transformation.
- id: motif:6
  label: song or dance as trap for prey
  taxonomy_refs:
  - trickster_boundary
  basis: Anansi uses fiddle and song when Goat enters during rain, and Anansi with
    Assono stages a dance while guarding the doors to catch Goat and Dog.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:8
  confidence: medium
  cautions: The second dance variant is fragmentary in this line range and does not
