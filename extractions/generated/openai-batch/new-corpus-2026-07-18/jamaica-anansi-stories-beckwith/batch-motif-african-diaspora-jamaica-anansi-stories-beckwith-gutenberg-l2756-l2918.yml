canonical_text:
  quote: ''
  summary: 'The passage contains several Jamaican Anansi animal tales: Anansi deceives
    a Fish household, eats their eggs and children, and the story explains why fishes
    are eaten; Goat escapes Anansi in rain and dance variants by becoming a stone
    or rock; Turtle escapes being cooked by fooling Anansi about boiling water; and
    Fire, invited by Anansi despite Ground Dove''s warning, burns Anansi and his house.'
  language: English with Jamaican Creole dialogue
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fish takes Anansi home; Anansi calls Fish cousin, and Fish tests the claim
    with hot rice-pop, which Anansi drinks after it has cooled.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Anansi asks to sleep in the kitchen where Fish has a barrel of eggs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Anansi poaches the eggs in the ashes, leaves one egg, and later repeatedly
    presents the same egg while wiping off each mark to make it seem that the whole
    barrel is being counted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fish sends two children to row Anansi across the river in a canoe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When Fish calls for the children to bring Anansi back because the eggs are
    gone, Anansi tells the children that Fish said to row quickly because a squall
    is ahead.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Anansi puts the Fish children in his bag, takes them home, and eats them;
    the tale adds that fishes are eaten from that day.
  category: sequence
  evidence_refs:
  - ev:3
