  text: In the rain variant, Goat is afraid of rain and enters Anansi's house during
    drizzle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Anansi plays the fiddle and sings thanks to Rain for driving wild meat from
    the bush into the house.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Goat flees Anansi, cannot cross the river, and turns into a white little stone
    at the riverside.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Dog tells Anansi to throw the stone across the river; Anansi does so, and
    Goat lands on four feet and escapes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the first dance variant, Assono and Anansi arrange a dance and plan to
    sit at separate doors when Goat and Dog enter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Dog and Goat escape through the other door before Assono catches them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: At a big river, Dog swims across, Goat turns into a big rock, and Dog persuades
    Anansi to throw the rock over the river.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After Anansi throws the rock, Goat resumes movement and cries out; Assono
