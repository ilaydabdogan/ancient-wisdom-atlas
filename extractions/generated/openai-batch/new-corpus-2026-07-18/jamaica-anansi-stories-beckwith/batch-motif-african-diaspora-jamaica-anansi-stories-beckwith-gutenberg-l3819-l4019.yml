canonical_text:
  quote: ''
  summary: The passage contains a Simon Tootoos narrative in which a dead mother is
    connected with a singing snake that directs her son to cook and eat it, followed
    by the mother's emergence from his belly and Simon's end. It also contains the
    tale 'The Tree-Wife,' in which a hunter's wish turns a Jessamy tree into a wife,
    another man takes her away, and the husband follows a singing, answering spit-trail
    to reclaim her.
