canonical_text:
  quote: ''
  summary: The passage contains the ending of an Anansi episode in which Mr. Able
    falls from a cotton-tree and Anansi takes his house and daughters, followed by
    three numbered stories. In “The King’s Three Daughters,” Anansi wins a bet by
    making and playing a fiddle so that the king’s daughters invite him into their
    house. In “The Dumb Child,” Anansi uses repeated fiddle music to make a child
    with golden tongue and teeth smile, laugh, hum, and sing before the king, winning
    a reward. In “The Dumb Wife,” Anansi stages Goolin’s false funeral and uses a
    mournful song to make Goolin’s silent wife sing; Goolin emerges alive from the
    coffin.
  language: English
  quote_policy: summarized
