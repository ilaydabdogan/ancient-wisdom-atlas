candidate_motifs:
- id: motif:1
  label: Withering plant as sign of sibling's fate
  taxonomy_refs:
  - sibling_pair
  basis: A tree branch withers immediately, after which Bob says mischief has befallen
    his brother and sets out to find him.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives the sign and Bob's interpretation but does not explain
    the mechanism or prior agreement associated with the branch.
- id: motif:2
  label: Forbidden final door brings dangerous transport and injury
  taxonomy_refs:
  - forbidden_knowledge
  basis: Bob receives keys and a prohibition involving the hundredth door, opens it
    anyway, mounts the black horse found there, and is carried to a palace where he
    loses an eye.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The wording of the prohibition is dialectal, but the later statement that
    Bob should have heard the lady supports reading it as a warning or prohibition.
- id: motif:3
  label: Sibling repeats missing sibling's path
  taxonomy_refs:
  - sibling_pair
  - departure
  basis: Bob leaves to find Adam, and in “Bird and Hunter” the second brother goes
    to find the first brother and follows the same route.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: high
  cautions: The Bob episode is only partially present in this line range, so its larger
    tale structure is incomplete.
- id: motif:4
  label: Golden bird lure to perilous place
  taxonomy_refs: []
  basis: The king's sons are drawn by a pretty golden bird despite warnings, and the
    path leads to the old hut where the old woman attacks.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:4
  confidence: high
  cautions: The passage does not explicitly state that the bird is controlled by the
    old woman; only the repeated attraction and danger are shown.
- id: motif:5
  label: Old woman immobilizes helpers and enchants victims into stone
  taxonomy_refs: []
  basis: The old woman binds horse and dog with hair or withes, kills the first son,
    fights the second, and identifies black stones as people and animals she enchanted
    and turned into stone.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The tale gives the old woman's actions and confession but not an origin
    or broader explanation of her powers.
- id: motif:6
  label: Animal helpers defeat the enchanter when bindings fail
  taxonomy_refs: []
  basis: In the second encounter, the dog breaks the withe and bites the old woman,
    and the horse tramples her, enabling the brother to overpower her.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The dog and horse are helpers in the second encounter; the first encounter
    emphasizes their helplessness while chained.
- id: motif:7
  label: Deadly wager with a devil requiring an impossible search
  taxonomy_refs:
  - mystical_quest
  basis: After gambling with the Devil Errant, Jack must find him within three months
    or the Devil Errant will take Jack's head; Jack seeks supernatural or world-spanning
    help.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: Only the opening of the Jack tale is included, so the search outcome and
    full quest pattern are not present.
- id: motif:8
  label: Keeper summons all beasts for hidden knowledge
  taxonomy_refs:
  - wisdom
  basis: The keeper of the world, keeper of all beasts, rings a bell to summon all
    beasts and asks whether they know the Devil Errant.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The beasts do not possess the sought knowledge in this passage, and the
    taxonomy link to wisdom is broad.
