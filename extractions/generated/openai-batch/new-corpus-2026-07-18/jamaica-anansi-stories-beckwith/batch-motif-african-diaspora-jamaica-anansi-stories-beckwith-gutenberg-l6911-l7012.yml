canonical_text:
  quote: ''
  summary: The passage contains the end of one tale in which Bob sees a withered tree
    branch as a sign of his brother Adam's danger, rides out to find him, ignores
    a prohibition involving a hundredth door, mounts a black horse, and is transported
    to a palace where he loses an eye. It then gives the tale “Bird and Hunter,” in
    which one king's son follows a golden bird despite a warning, is trapped and killed
    by an old woman after she binds his dog and horse, and a second brother repeats
    the journey, defeats the old woman with help from dog and horse, and restores
    people enchanted into black stones. The passage begins “Jack and the Devil Errant,”
    in which Jack wins and loses card games against the Devil Errant and must find
    him within three months; a keeper of the world summons beasts for information
    and sends Jack toward the keeper's brother by following a rolling barrel.
  language: English
  quote_policy: summarized
