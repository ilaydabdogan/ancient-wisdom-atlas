canonical_text:
  quote: ''
  summary: The passage contains three complete Jamaican stories and the opening heading
    of a fourth. In one tale, an old woman’s planted pea is eaten and a chain of compensations
    leads from a goat horn to a cow that makes her rich. In another, a son answers
    a creditor’s questions with riddling descriptions, explains them, and has the
    debt settled. In a third, Mr. Lenaman rents a burial ground for farming; an unseen
    voice repeatedly summons ghosts to help complete his actions, first beneficially
    in agricultural work and then destructively when corn is broken, when he beats
    his wife and boy, and when he scratches his head.
  language: English, with Jamaican Creole dialogue in parts
  quote_policy: summarized
