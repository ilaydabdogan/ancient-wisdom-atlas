canonical_text:
  quote: ''
  summary: The passage ends one Jack and Uncle Green tale and gives the full tale
    of Big Begum and Little Begum. Uncle Green buys a shell and whip from Jack, misuses
    them at a wedding meal, and finds the food raw. He has Jack bagged for drowning,
    but Jack tricks a shepherd into taking his place, gains the shepherd's sheep,
    and later persuades Uncle Green that deeper water would yield gold and diamonds;
    Uncle Green is drowned and Jack takes his riches. In the next story, envious rich
    Big Begum discovers that poor Little Begum has money, imitates a false story about
    selling horse meat, and then tries to kill Little Begum in a bag. Little Begum
    tricks a sheep-herder into taking his place, gains the sheep, and later persuades
    Big Begum that being chopped and buried more deeply would yield cows; Big Begum
    is killed.
  language: English
  quote_policy: summarized
