canonical_text:
  quote: ''
  summary: The passage contains the end of one Anansi episode, all of “But-but and
    Anansi,” and the beginning of “Tumble-bug and Anansi.” Anansi first tricks Dog
    into putting his hand in a river-side hole where a being called Fling-a-mile flings
    Dog to death; Monkey later reverses the trick and causes Anansi to be flung to
    death. In the next tale, Hanansi deceives But-but over food, but But-but transforms
    into objects, enters Hanansi’s basket, consumes his goods, and then causes Hanansi
    to kill his own sons and wife before Hanansi breaks his own neck. The final fragment
    begins with Anansi and Tumble-bug earning pay and buying plantain and butter for
    a meal.
  language: English with Jamaican Creole dialogue
  quote_policy: summarized
