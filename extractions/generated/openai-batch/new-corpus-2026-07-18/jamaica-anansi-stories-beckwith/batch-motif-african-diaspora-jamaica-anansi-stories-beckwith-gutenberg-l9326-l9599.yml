canonical_text:
  quote: ''
  summary: A catalogue of Jamaican Anansi-story riddles, numbered 45-81, gives metaphorical
    clues and answers. Many use the formula of a father or mother possessing, sending,
    planting, or giving things; answers include plants, household objects, body parts,
    celestial phenomena, writing materials, food-preparation items, and animals.
  language: English with Jamaican Creole forms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several riddles use a repeated father-formula in which the father has, sends
    for, plants, gives, or owns the object described by the clue.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
- id: obs:2
  text: Riddles 45-52 describe housefuls or shiploads of children, people, men, or
    soldiers with colored heads, turned heads, feet, arms akimbo, or one eye; the
    answers include annatto, ackee, nails, castor-oil beans, bottles, cooking-pots,
    coffee-pots, and needles.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The moon is identified through food and light images, including yam or cassava
    cake serving the whole world and a lamp shining over the whole world; it is also
    identified as a grey horse in a hill encounter riddle.
  category: object
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:4
  text: Stars are identified through nightly tree, flower, plate, apple, money, and
    counting images; one clue says the tree does not ripen until night.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Cloud is identified as a sheet that covers the whole world and, in one variant,
    as the sheet paired with uncountable stars.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Several object riddles use paradoxical forms, including a house on one post,
    a well with neither top nor bottom that holds water, a ring or tub without a bottom,
    a cocoanut shell with three doors, and a hole that grows larger as it is pared.
  category: object
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:7
  text: Fire is identified by a clue describing something going upward in a chimney-like
    motion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A corn-grain is described as something held and thrown that supports the whole
    of Jamaica.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: A louse is described through the image of ten men or policemen catching one
    thief or prisoner; variants identify the two that bring it down and connect the
    sentence with the fingernail.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: An ackee riddle says the speaker must choose laughing or split-open fruits
    and avoid others that may kill him; the explanatory note links this to the warning
    that ackee is safe only after ripening and splitting in the sun.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Food-preparation and household riddles identify a cassava grater, an egg whose
    shell keeps out salt, a clock cutting chips that do not fly, and a pipe whose
    top boils before the bottom.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: A writing riddle identifies black ink on white paper as black seed sown on
    white ground.
  category: object
  evidence_refs:
  - ev:4
- id: obs:13
  text: The final group uses going-to-town or hill-journey frames to identify climbing
    a tree, sun-warmed trash, an orange, a rooster, the moon, dew and sweat, fingers,
    and an ants' nest.
  category: sequence
  evidence_refs:
  - ev:5
