canonical_text:
  quote: ''
  summary: The passage gives several Jamaican Anansi animal episodes. Anansi repeatedly
    uses instructions, feigned actions, or staged situations to make Tiger, Sheep,
    Monkey, Rabbit, Rat, or others lose food, prey, safety, or blame. Episodes include
    Tiger losing his tripe and attacking monkeys, Tiger discarding a knife, Sheep
    leaving a spoon, Tiger releasing Monkey or Goat through gestures prompted by Anansi,
    Rabbit being shown 'daytime trouble,' and Rat being tricked into killing Tiger's
    children while Anansi keeps his alive.
  language: English with Jamaican Creole dialogue
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Anansi tells Tiger to take out his tripe, eats Tiger's tripe, and directs
    Tiger to Monkey town to learn what happened.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Anansi tells monkeys to sing about eating Tiger's gut; when Tiger hears them,
    he kills monkeys and learns Anansi had taught the song.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Anansi appears to throw something away and tells Tiger to throw away his knife;
    Tiger discards his knife, while Anansi still has a knife and eats pine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Anansi tells Sheep to leave his spoon behind, then sends Sheep back for it
    and eats the available meals while Sheep is gone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Anansi asks Monkey about his cunning, urges Monkey to use his tail to help
    Tiger out of a deep hole, and climbs a tree while Tiger seizes Monkey.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Anansi tells Tiger to clap with joy over catching Monkey; when Tiger opens
    his hands to clap, Monkey escapes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After Tiger catches a wild goat, Anansi tells Tiger to place it under his
    arm and thank the Lord while knocking his hands; Tiger does so and the goat escapes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Rabbit asks Anansi to show him 'daytime trouble'; Anansi kills a young tiger,
    gives Rabbit a basket with tiger meat to hand to Tiger, and runs away when Tiger
    attacks Rabbit.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Rabbit hides in a stone-hole; Anansi gives him a razor and tells him to cut
    off Reindeer's head when Reindeer tries to dig him out, which Rabbit does.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Anansi tells Rabbit that this is how 'daytime trouble' is, and warns him not
    to ask anyone to show it again.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Rat and Anansi encounter Tiger's four children; Anansi pretends to kill his
    assigned young tigers but keeps them alive, while Rat kills his two and puts them
    in his basket.
  category: sequence
  evidence_refs:
  - ev:7
