canonical_text:
  quote: ''
  summary: Anansi, wanting to get rid of Cunnie-mo’n-father, conspires with Brar Tiger
    in several traps. Cunnie-mo’n-father repeatedly overhears or anticipates the plans
    and foils Tiger with a fire-stick, red ants, and a trick involving a supposedly
    speaking yam. When Cunnie-mo’n-father finally falls asleep and is caught, Anansi
    and Tiger place him in a coffin to be thrown into the sea. During Tiger’s rest,
    Cunnie-mo’n-father persuades an old man to take his place in the coffin by saying
    that others want him to go to heaven. Tiger throws the coffin containing the old
    man into the sea and reports that Cunnie-mo’n-father has been drowned.
  language: English
  quote_policy: summarized
