canonical_text:
  quote: ''
  summary: The passage contains two tales in the section headed “Modern European Stories.”
    In “Ali Baba and Kissem,” Ali Baba learns the opening word of a treasure cave,
    takes money, and later survives a concealed robber plot through Margiana’s action.
    In “Bull-of-all-the-Land,” King Henry alternates between bull and man through
    bull clothing, leaves after the clothing is burned, and is found again by the
    woman who knows his secret name and blood-token.
  language: English, including Jamaican Creole/dialect transcription
  quote_policy: summarized
