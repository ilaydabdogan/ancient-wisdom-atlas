canonical_text:
  quote: ''
  summary: The passage concludes a tale in which David Lawrence and Anansi present
    different body parts of the dead bird Arinto to claim a royal marriage reward;
    Anansi is exposed as a usurper and David marries the king’s daughter. It then
    gives the tale “Tiger Softens His Voice,” in which a mother hides her daughter
    Tom Jones in a locked many-doored house opened by a song. Tiger learns and alters
    his voice to imitate the mother, enters, and swallows the girl. The mother returns,
    has Tiger killed and opened, and the daughter is removed and revived.
  language: English
  quote_policy: summarized
