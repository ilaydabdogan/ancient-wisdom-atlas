canonical_text:
  quote: ''
  summary: 'This passage is a notes section for numbered Jamaican Anansi and animal
    tales. It gives brief plot summaries and comparative references for tales about
    woodpecker, crab, mice, rat, cockroach, hunter/guinea-hen/fish, rabbit, animal
    race, and fasting trial. The notes identify several recurrent folk patterns: weak
    beings requesting greater power, dangerous gifts withheld, animal thieves escaping,
    slow animals defeating swift ones, and birds competing in fasting trials.'
  language: English
  quote_policy: summarized
