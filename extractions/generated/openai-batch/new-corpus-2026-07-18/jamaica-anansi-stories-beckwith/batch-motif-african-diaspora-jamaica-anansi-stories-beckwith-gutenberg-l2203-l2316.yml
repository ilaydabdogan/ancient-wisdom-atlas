canonical_text:
  quote: ''
  summary: The supplied passage contains several Jamaican Anansi story episodes. Anansi
    cooks meat alone but is coerced by Go-long-go, then traps him in fire. In another
    episode Dry-head falls from a tree and warns Anansi about trouble and luck; Anansi
    later uses a spoon rule to eat a barrow alone. In a Brother Dead episode, Anansi
    gives a cock as payment, steals it back, and has Hawk carry Dead away. In 'The
    Yam-Hills,' Anansi uses a fatal count to kill Hog and Goat, but Monkey avoids
    the word and tricks Anansi into saying it himself. In 'The Law Against Back-Biting,'
    Anansi exploits a law against speaking about others so that Hog comments on him
    and dies.
  language: English with Jamaican Creole dialect forms
  quote_policy: summarized
