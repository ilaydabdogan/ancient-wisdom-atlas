  quote: ''
  summary: The supplied passage contains the end of one tale in which a shepherd boy
    carries a snake to its father, receives knowledge of animal speech under a death
    warning, finds money through pigeons, and later avoids disclosing the secret after
    a rooster advises him. It then gives “The Three Pieces of Advice,” where a poor
