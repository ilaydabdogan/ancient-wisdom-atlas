canonical_text:
  quote: ''
  summary: The passage contains two narrative units. In the first, Ballinder Bull,
    also called King Bymandorum, attacks a pregnant woman; the surviving child is
    raised by an old woman, learns his origin, vows to kill the bull, uses a responsive
    cotton-tree during the fight, kills the bull with arrows, and keeps the bull's
    golden tongue and teeth as proof. Hanansi falsely claims the kill by presenting
    the bull's head, is exposed by the boy's proof tokens, beaten, sent to gather
    wedding wood under Dog's watch, and escapes by distracting Dog and hiding. In
    the second, Bird Arinto feeds on human flesh; David Lawrence, lame in both feet,
    is refused help by his sister, hides in an underground passage, sings to draw
    the bird down, and exhausts it by moving through the passage until night.
  language: English with Jamaican Creole forms
  quote_policy: summarized
