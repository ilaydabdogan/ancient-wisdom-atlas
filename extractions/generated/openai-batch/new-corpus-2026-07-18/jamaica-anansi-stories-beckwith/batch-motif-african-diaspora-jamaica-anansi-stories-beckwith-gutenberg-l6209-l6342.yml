canonical_text:
  quote: ''
  summary: The passage collects several Anansi episodes about secret or dangerous
    names. Anansi learns Zegrady's hidden name by using Mosquito to disturb her until
    her mother speaks it, then wins the reward and cheats Mosquito. Three variants
    of “Anansi plays baby” show Anansi or an accomplice disguised or transformed as
    a baby in order to provoke people into revealing hidden names. The passage also
    begins an episode in which Anansi exploits Mr. Able's sensitivity to hearing his
    name after using ripe plantains to obtain Able's daughters.
  language: English with Jamaican Creole dialectal transcription
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman has a daughter whose name is kept from public hearing, and she
    offers one hundred pounds to anyone who can tell the name.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Anansi says he must get the money and arranges with Mosquito for Mosquito
    to enter the girl's room while Anansi listens under the mother's room.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mosquito repeatedly sings at the sleeping girl's ear, causing her to strike
    at him and tell him to go away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mother, hearing the disturbance, calls the daughter by the name Zegrady.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Anansi plays a fiddle and sings the revealed name, then receives the money
    from the old woman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Anansi gives Mosquito none of the money, and the passage explains present
    mosquito ear-noise as resulting from Anansi robbing Mosquito.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In one baby variant, Anansi turns a young man into a baby and himself into
    the baby's mother, then asks three sisters to mind and bathe the baby.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The three sisters reveal the names Santa Cruka, Aminta or Aminty, and Amata
    while reacting to the baby's adult male anatomy.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the baby reports the names, Anansi addresses each sister by her right
    name; the sisters die, and Anansi takes their riches.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In another baby variant, Anansi becomes or pretends to be a baby placed under
    a shady tree; the women see that the baby has a mouth full of teeth and call out
    names that Anansi catches.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the Tommy Goody variant, a man has lived in a town for eight years without
    his name being known, and Anansi's baby disguise leads the man to speak the name
    Tommy Goody.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Mr. Able has two daughters whom Anansi wants, and Able becomes dangerously
    disturbed whenever he hears his name spoken.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Anansi gives Able's daughters ripe plantains and later sings Able's name repeatedly,
    causing Able to leave the house, go to a sucker-root, and climb a breadfruit tree.
  category: sequence
  evidence_refs:
  - ev:7
