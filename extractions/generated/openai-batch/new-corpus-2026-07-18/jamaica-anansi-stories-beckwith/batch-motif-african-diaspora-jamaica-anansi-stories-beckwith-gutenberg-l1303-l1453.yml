  summary: The passage contains the end of an animal tale explaining the goat's smell,
    followed by Anansi stories in which Anansi deceives Tiger and Tacoomah into being
    cooked in a pot, and several 'House in the Air' variants involving elevated dwellings
    or ascent to heaven by rope, merit, or sling, with trickery, recognition, falling,
    punishment, or death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ram-goat hides in a hole with one horn protruding; a man with a wooden leg
    trips on it, cuts at it, sees blood, and others dig Ram-goat out.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After being drenched with dirty slops and left for dead, Ram-goat rises and
    wrings out his clothes but not his beard; the tale states this is why goats smell
    offensive.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Anansi tells Tiger and Tacoomah that his wife and children have not eaten,
    though the visitors later hear dinner being called and receive fresh beef at Anansi's
    house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Anansi demonstrates entering a pot of water on the fire and instructs that
    the pot be opened when he knocks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Anansi then has Tiger and Tacoomah enter the pot, places a heavy weight on
    the lid, has the fire increased, and they are cooked.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Anansi sings while preparing to eat Tiger and Tacoomah, saying that they thought
    they had him but he has them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Anansi lives in a tree with wife and children and robs others, who cannot
    find where he lives.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Tiger tracks Anansi, learns that a rope is lowered and used to swing provisions
    up to Anansi's family, and tries to imitate Anansi's voice to get the rope lowered.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Tiger first fails because his voice is coarse, then obtains a voice like Anansi's
    and is pulled up; Anansi sees this and tells the mother to cut the rope.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: When the rope is cut, Tiger falls, breaks his neck, and Anansi takes him for
    dinner.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Rabbit and children are going up to Heaven using a 'merit'; Anansi wants to
    go along to get food.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Anansi is recognized by his voice during the ascent, and Rabbit commands that
    the merit be cut down, leaving Anansi's waist cut off from that day.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Duppy has a house in the air and uses a sling, commanded by words, to go down
    and return up.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:14
  text: Anansi secretly learns the sling command, rides up to Duppy's house, searches
    it, and eats what he finds.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: Anansi cannot remember the command to descend; Duppy finds him, hears his
