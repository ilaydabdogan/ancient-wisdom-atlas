canonical_text:
  quote: ''
  summary: The passage contains the end of one tale and the complete tale numbered
    81, "Bosen Corner." In the first tale, a hostile Old Witch mother-in-law accuses
    a daughter-in-law of taking one grain of peas, brings her to a river for a drowning
    ordeal, and is killed by the girl's sweetheart William, who then marries the girl.
    In "Bosen Corner," a mistreated daughter-in-law is sent for water into Old Witch
    country, courteously greets strange beings, endures painful service to an old
    woman, treats a cat kindly, receives instructions about magical eggs, and gains
    property and a prince as husband after breaking the eggs at crossroads.
  language: English, with Jamaican Creole-influenced dialect
  quote_policy: summarized
