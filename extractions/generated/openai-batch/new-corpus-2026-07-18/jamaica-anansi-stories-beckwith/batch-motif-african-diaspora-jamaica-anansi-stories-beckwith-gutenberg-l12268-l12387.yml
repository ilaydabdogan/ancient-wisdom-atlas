canonical_text:
  quote: ''
  summary: 'Scholarly notes compare Jamaican Anansi-related episodes with variants
    and analogues: endurance or tree-chopping tests for marriage or reward, tricks
    to secure an entire food animal, the Dry-head episode in which Anansi tries to
    keep food for himself and then must get rid of Dry-head, and related tales involving
    pursuing stones, inescapable objects, transforming figures, birds carrying victims
    away, and ingratitude toward helpers.'
  language: English
  quote_policy: summarized
literal_observations:
