canonical_text:
  quote: ''
  summary: The passage contains the end of a plantain-tree trick in which Anansi blinds
    Goat with ashes; the tale of Brother Dead and the Brindle Puppy, where Anansi
    steals dried meat and is tracked, caught, and burned; the tale of the Cowitch
    and Mr. Foolman, where Anansi wins a cow by disguising scratches as description
    but is outwitted by Foolman; and the beginning of Dry-Head and Anansi, where Anansi
    feigns illness and impersonates a doctor to obtain his wife's pig.
  language: English
  quote_policy: summarized
