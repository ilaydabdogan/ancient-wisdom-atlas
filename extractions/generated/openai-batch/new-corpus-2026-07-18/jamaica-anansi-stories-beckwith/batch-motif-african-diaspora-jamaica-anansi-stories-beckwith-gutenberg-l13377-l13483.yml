- id: obs:7
  text: 'The Devil-husband story is summarized in three parts: a girl marries a handsome
    man against her little brother’s warning; the man, usually the Devil, takes her
    home, locks her up, and sets a cock to watch her; an old woman helps her escape
    over a river in the Devil’s magic boat after feeding the cock grains.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'The Snake marriage is contrasted with the Devil-husband story: it lacks a
