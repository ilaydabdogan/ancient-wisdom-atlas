canonical_text:
  quote: ''
  summary: Editorial notes compare Jamaican monster-marriage and Devil-husband flight
    stories with variants from other collections. Recurrent elements include a girl’s
    selective marriage choice, borrowed or handsome clothes, snake or beast husbands,
    confinement in a den or hole, songs for help, rescue by brothers, a little brother’s
    warning, a guardian cock, feeding or throwing grain to delay a watcher or pursuer,
    river escape in a magic boat, and helper figures such as an old woman or friendly
    animal.
  language: English
  quote_policy: summarized
