canonical_text:
  quote: ''
  summary: The passage contains the end of an Anansi episode in which a mule carries
    Anansi to fish who try to burn him, the full tale 'The Six Children' in which
    Anansi falsely promises to cure a blind mother, kills and eats her, and is later
    trapped by Jack-ass and burned by the children, and the opening of 'Anansi, White-belly
    and Fish' in which White-belly gives Anansi false wings, removes them after Anansi
    misbehaves at feeding-trees, and Anansi falls into a river.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mule offers to catch Anansi for the fish in exchange for their peas, lies
    down at Anansi's gate, carries Anansi in his belly, and delivers him to the fish
    at the sea-shore.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Anansi tells the fish to put him under trash and burn him, but he runs under
    a stone and hides while the fish think he has been burned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old woman has six grown children, three sons and three daughters; she becomes
    blind, and the children cry by the roadside because they cannot cure her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hog, Goat, Cow, and initially Jack-ass pass the crying children and say they
    cannot cure the mother.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Anansi tells the children he can cure the mother and instructs them to put
    water, yams, butter, lard, meat, and other food in the kitchen before he returns.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Anansi shuts himself in the kitchen with the old woman, kills her, cooks the
    provisions, fries the old woman with butter and lard, makes a sound that the children
    interpret as a sign of cure, eats her and the food, leaves the bones by the fire-side,
    and tells the children not to open the door for nine days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the seventh day the children open the door and find their mother's bones
    by the fire-side.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the mother's death, Hog, Goat, and Cow again refuse to help the children
    catch Anansi, while Jack-ass says he will catch him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Jack-ass lies near Anansi's gate pretending to be dead with a swollen belly;
    when Anansi cuts into him and reaches in for fat, Jack-ass holds him and carries
    him to the children's yard.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The children make a big fire, put Anansi in it, and burn him until his belly
    bursts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the next tale, Anansi asks White-belly to take him to the feeding place;
    White-belly agrees on the condition that Anansi behave himself and fits him with
    a pair of wings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At the feeding-trees over a river, Anansi claims each tree White-belly visits,
    eats heavily, falls asleep, and then falls into the river after White-belly removes
    the false wings.
  category: sequence
  evidence_refs:
  - ev:6
