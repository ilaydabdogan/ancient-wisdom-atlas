canonical_text:
  quote: ''
  summary: A numbered sequence of Jamaican riddles, nos. 82-134, presents paradoxical
    or personified statements and then gives their answers. The answers identify natural
    phenomena, plants, tools, foods, animals, body parts, household objects, writing
    materials, and cosmic pairs. Recurring riddle-images include travel to town or
    Kingston, kinship figures, house-building, bodily lack, color-coded Black/White/Red
    figures, fire and water, Miss Nancy, and heaven and earth.
  language: English with Jamaican Creole forms
  quote_policy: summarized
