  quote: ''
  summary: The passage contains a closing fragment about Lydia and Timbo Limbo, two
    fish-related narratives in which girls summon or feed fish by song and the fish
    is killed, restored, or mourned, and the tale of Juggin Straw Blue, where a niece
    is taken by an Old Witch man and rescued by her suitor through egg-based magical
    combat.
  language: English with Jamaican Creole passages
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a repeated song, water turns to blood; when Timbo Limbo is not found
    in the water, Lydia drowns herself in the water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In “Fish fish fish,” one daughter goes to the riverside to worship a little
    fish, sings to it, plays with it, and lets it return to the river.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mother sends the other daughter to the river; this daughter repeats the
    song she has heard, catches the fish, brings it home, and the fish is cooked for
    dinner.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first daughter does not eat the fish, sings again, and the fish come up
    and turn into a big fish which she returns to the river.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In “Dear Old Juna,” a girl is engaged both to a fish and to another young
    man, cooks breakfast for both, and carries the fish’s breakfast to the river.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The girl summons the fish with a song, and the fish replies before coming
    out to eat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The young man goes early with a gun, imitates the song, shoots the fish, has
    it prepared and eaten, and the girl drops dead after recognizing it as the same
    fish.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In “Juggin Straw Blue,” an aunt favors her own daughter over her niece and
    sends the niece to the river with a large tub for water.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: An Old Witch man helps the niece lift the tub and tells her not to tell who
    helped; after the aunt learns the secret, she locks the niece in an iron chest
    because the Old Witch man will come for her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The niece cries inside the iron chest, her tears pass through the keyhole,
    and the Old Witch man tastes them, comments on the sweetness of fat and flesh,
    breaks the door open, and takes her out.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: As the Old Witch man travels with the girl, his knock-knee makes a musical
    sound, he assigns parts of her body to his dog and supper, and she sings to Juggin
    Straw Blue.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Juggin Straw Blue’s mother, also called an Old Witch, gives him eight eggs;
    Juggin uses eggs in alternation against the Old Witch man, bringing daylight and
    cutting off seven heads, while the Old Witch man uses eggs to bring night back.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After Juggin cuts off the Old Witch man’s seven heads, he takes away the girl,
    goes home with her, and marries her.
  category: sequence
  evidence_refs:
  - ev:8
