canonical_text:
  quote: ''
  summary: 'Three brief animal jests: Monkey sells an unwanted jacket to Goat after
    urging him to try it on and praising the fit; Anansi and Tiger travel through
    a stream, where Anansi steps on a stone and makes a fish-related claim that Tiger
    answers; Tacoomah tells Anansi that his mother is dead and then awake, and Anansi
    replies with short pragmatic sayings.'
