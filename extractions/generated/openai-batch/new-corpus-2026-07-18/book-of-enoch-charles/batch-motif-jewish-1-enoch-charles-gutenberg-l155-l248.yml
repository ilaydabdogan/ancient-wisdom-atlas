  quote: ''
  summary: The introduction characterizes apocalyptic literature, and especially 1
    Enoch, as future-oriented writing shaped by hope for a New Age amid despair over
    the present world. It describes the expected removal of the wicked, protection
    and blessing for the righteous elect, the overthrow of earthly powers, destruction
    of the current order before a new order, supernatural intervention, and visionary
    messages received by seers.
