canonical_text:
  quote: ''
  summary: 'Enoch recounts to Methuselah a first dream-vision in which heaven collapses,
    the earth is swallowed by an abyss, and mountains, hills, and trees are destroyed.
    Mahalalel wakes him, interprets the dream as grave destruction connected with
    sin, and urges prayer for a remnant. Enoch prays to the divine king and creator,
    asking that not all flesh be destroyed and that righteous flesh be established.
    He then begins a second dream-vision using animal figures: a white bull, a heifer,
    black and red bulls, and later many bulls and cows.'
  language: English
  quote_policy: summarized
