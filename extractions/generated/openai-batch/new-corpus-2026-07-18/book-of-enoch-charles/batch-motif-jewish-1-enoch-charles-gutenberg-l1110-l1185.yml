canonical_text:
  quote: ''
  summary: Angels desire human women, bind themselves by oath on Mount Hermon, descend,
    take wives, beget giants, and teach forbidden arts. The giants consume human goods
    and then devour humans and living creatures. Azazel and other angelic leaders
    teach weapons, ornamentation, enchantments, astrology, and heavenly or earthly
    signs. As bloodshed and lawlessness fill the earth, Michael, Uriel, Raphael, and
    Gabriel appeal to the Most High on behalf of the souls crying to heaven.
  language: English
  quote_policy: summarized
