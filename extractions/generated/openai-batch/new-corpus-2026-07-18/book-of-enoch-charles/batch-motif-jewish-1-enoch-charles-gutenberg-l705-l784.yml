canonical_text:
  quote: ''
  summary: The passage is an introductory overview of sections of 1 Enoch. It summarizes
    the Dream-Visions, including Deluge judgment, fallen angels, animal symbolism
    for patriarchs, Israel, and Gentiles, and an eschatological close with judgment,
    New Jerusalem, resurrection, Messiah, and Messianic Kingdom. It then discusses
    textual dislocations in the Concluding Section, its teaching on reward and punishment,
    final judgment, destruction of the former heaven and earth, creation of a new
    heaven, resurrection of the righteous dead, and the Noah fragments concerning
    fallen angels, sin, the Deluge, and Noah’s preservation.
  language: English
  quote_policy: summarized
