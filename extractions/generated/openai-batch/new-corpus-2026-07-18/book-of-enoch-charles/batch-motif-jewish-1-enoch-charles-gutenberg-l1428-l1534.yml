canonical_text:
  quote: ''
  summary: 'Enoch reports a visionary journey through cosmic regions: treasuries of
    winds, foundations of earth and heaven, seven jeweled mountains, fiery abysses,
    chaotic places, prisons for transgressive stars and angels, and the beginning
    of an underworld scene with hollow places in a western mountain. Uriel and other
    holy angels are named with their functions, and Uriel explains the punishment
    of fallen angels and their spirits.'
  language: English
  quote_policy: summarized
