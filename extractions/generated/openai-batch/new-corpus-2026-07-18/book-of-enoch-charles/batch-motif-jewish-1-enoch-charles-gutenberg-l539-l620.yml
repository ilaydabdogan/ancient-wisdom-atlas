canonical_text:
  quote: ''
  summary: Introductory résumé of portions of 1 Enoch, especially chapters xii-xxxvi,
    describing Enoch’s dream-vision, his intercession for the Watchers, the refusal
    of their petition, his angel-guided journeys through earthly and otherworldly
    regions, places of punishment and blessing, sacred trees, Jerusalem as the earth’s
    center, and the destruction of evil with the triumph of righteousness. The passage
    then introduces the Parables as sharing the same underlying theme.
