  quote: ''
  summary: The passage describes disorder among the moon, sun, and stars; Enoch’s
    reading of heavenly tablets and the book of deeds; his return to earth by seven
    holy ones; his charge to instruct Methuselah and preserve written wisdom; and
    calendrical teaching about intercalary days, the 364-day year, and Uriel’s governance
    of the heavenly host.
