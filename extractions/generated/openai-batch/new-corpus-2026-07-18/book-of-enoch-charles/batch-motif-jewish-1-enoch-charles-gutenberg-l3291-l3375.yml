canonical_text:
  quote: ''
  summary: The passage opens the Book of the Courses of the Heavenly Luminaries. Uriel,
    a holy angel and guide of the luminaries, shows the narrator the laws of the sun,
    moon, stars, portals, seasons, months, and years. The sun moves through six eastern
    and six western portals, with windows and flames, on a wind-driven chariot. Its
    movement through the portals regulates the changing lengths of day and night across
    a 364-day year.
  language: English
  quote_policy: summarized
