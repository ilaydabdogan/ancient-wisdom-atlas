  quote: ''
  summary: The passage lists named leaders who regulate heavenly/calendar entries
    by times, orders, seasons, months, dominions, and positions. It describes leaders
    for the four parts of the year, months, 360 days, and four intercalary days, then
    gives two 91-day seasonal dominions with signs visible on earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Named leaders watch that the heavenly courses enter at their appointed times,
    orders, seasons, months, periods of dominion, and positions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The calendar is divided among four leaders for the four parts of the year,
    twelve leaders for the months, heads over thousands for 360 days, and leaders
    for four intercalary days.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The four ordained leaders dividing the four parts of the year are named Mîlkî’êl,
    Hel’emmêlêk, Mêl’êjal, and Nârêl.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Adnâr’êl, Îjâsûsa’êl, and ‘Elômê’êl are named as followers of the leaders
    of the orders; another follows the three leaders of the orders connected with
    the station-dividing leaders.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the beginning of the year Melkejâl rises first and rules for ninety-one
    days; the passage also gives the variant naming phrase “†Tam’âinî, and sun†.”
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: During Melkejâl’s dominion, signs on earth include sweat, heat, calms, fruit-bearing
    and leaves on trees, wheat harvest, rose-flowers, field flowers, and withering
    winter-season trees.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Berka’êl, Zêlebs’êl, and Hîlûjâsěph are named as leaders under the first dominion,
    and the passage marks that dominion as ending.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Hêl’emmêlêk is the next leader after Melkejâl; he is named “the shining sun,”
    and his light lasts ninety-one days.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: During Hêl’emmêlêk’s dominion, signs on earth include glowing heat, dryness,
    ripening fruit, sheep pairing and becoming pregnant, gathering of the fruits of
    the earth, field produce, and the winepress.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: Gîdâ’îjal, Kê’êl, Hê’êl, and Asfâ’êl are named in connection with the heads
    of thousands under the second dominion, and that dominion is also marked as ending.
  category: relationship
  evidence_refs:
  - ev:9
