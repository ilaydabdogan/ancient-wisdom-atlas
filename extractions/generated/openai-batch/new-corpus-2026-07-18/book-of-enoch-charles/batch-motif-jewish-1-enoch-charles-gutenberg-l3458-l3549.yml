  quote: ''
  summary: The passage describes the ordering of heavenly luminaries, intercalary
    days, solar doors, heavenly chariots, twelve wind portals, and four world quarters.
    Uriel discloses laws of signs, times, years, days, winds, plagues, and benefactions;
    the world is divided into directional regions, including a south associated with
    divine descent and a north containing human dwelling, watery and dark regions,
    and the garden of righteousness.
  language: English
