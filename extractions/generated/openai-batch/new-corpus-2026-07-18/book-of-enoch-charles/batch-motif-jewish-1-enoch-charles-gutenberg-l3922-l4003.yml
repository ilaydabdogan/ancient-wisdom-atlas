canonical_text:
  quote: ''
  summary: In a dream-vision, the seer watches stars fall from heaven, become bulls
    among oxen, mate with cows, and produce elephants, camels, and asses who terrify
    and devour. Heavenly beings appear; three raise the seer to a lofty place, and
    others punish the fallen stars by binding and casting them into abysses. A white
    bull is instructed in a secret, becomes a man, builds a great vessel, and survives
    a deluge with three bulls while other animals perish; the waters recede, light
    appears, and the survivors emerge.
  language: English
  quote_policy: summarized
