canonical_text:
  quote: ''
  summary: The passage describes the chosen Son of Man or Elect One overthrowing kings
    and sinners, the prayer and blood of the righteous coming before the Lord of Spirits,
    the Head of Days seated with books opened, an inexhaustible fountain of righteousness
    and fountains of wisdom, the pre-existent naming and hiddenness of the Son of
    Man, and the final judgment and destruction of oppressive rulers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Son of Man is chosen by the Lord of Spirits and is described as raising
    or putting down kings, mighty ones, and the strong from their seats and thrones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The condemned rulers and sinners are said not to praise or acknowledge the
    source of their kingdoms; darkness is their dwelling, worms are their bed, and
    they have no hope of rising.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The same opponents are described as relying on riches and handmade gods, denying
    the Lord of Spirits, and persecuting the houses of His congregations and the faithful.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The prayer and blood of the righteous ascend from the earth before the Lord
    of Spirits.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Holy ones dwelling above in the heavens unite in one voice to supplicate and
    pray on behalf of the shed blood of the righteous and for judgment.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Head of Days sits on the throne of His glory, the books of the living
    are opened before Him, and the heavenly host and counsellors stand before Him.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hearts of the holy are filled with joy because the prayer of the righteous
    has been heard and their blood required before the Lord of Spirits.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The seer observes an inexhaustible fountain of righteousness and many fountains
    of wisdom; the thirsty drink from them, are filled with wisdom, and dwell with
    the righteous, holy, and elect.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Son of Man is named before the Lord of Spirits and the Head of Days before
    the creation of the sun, signs, stars, and world; he has been chosen and hidden
    before Him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Son of Man is described as a staff for the righteous, the light of the
    Gentiles, and the hope of those troubled in heart.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kings and the strong cannot save themselves on the day of anguish; they are
    given into the hands of the elect, burn like straw in fire, sink like lead in
    water, and leave no trace.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Elect One possesses wisdom, insight, understanding, might, and the spirit
    of those who have fallen asleep in righteousness; he judges secret things and
    prevents lying speech before him.
  category: attribute
  evidence_refs:
  - ev:10
