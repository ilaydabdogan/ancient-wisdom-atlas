canonical_text:
  quote: ''
  summary: Enoch presents a book of wisdom and admonishes his descendants to walk
    in righteousness. He foretells the increase and destruction of unrighteousness,
    divine chastisement, judgment by fire and sword, the awakening of the righteous,
    and a sequence of historical weeks learned from heavenly vision, angels, books,
    and tablets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A book written by Enoch is described as a complete doctrine of wisdom for
    his children and future generations who observe uprightness and peace.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Holy and Great One is said to have appointed days for all things; the
    righteous one is said to arise from sleep, walk in righteousness, receive uprightness
    and power, and walk in eternal light, while sin perishes in darkness.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Enoch tells Methuselah to call his brothers and gather the sons of his mother
    because the word calls him and the spirit is poured out upon him so that he may
    show what will befall them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Methuselah summons his brothers and assembles Enoch's relatives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Enoch exhorts his children to love uprightness, avoid a double heart, avoid
    those of a double heart, and walk in righteousness rather than violence.
  category: speech
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:6
  text: The passage predicts that violence, unrighteousness, blasphemy, apostasy,
    transgression, and uncleanness will increase before a great chastisement comes
    from heaven and the holy Lord executes judgment on earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says the roots of violence, unrighteousness, and deceit will be
    destroyed; idols will be abandoned; temples will be burned with fire; and the
    heathen will be cast into judgment fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A bracketed section says sinners, blasphemers, planners of violence, and those
    who commit blasphemy will perish by the sword; Enoch then again contrasts paths
    of righteousness with paths of violence.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Enoch says he speaks from what appeared to him in heavenly vision, from the
    word of the holy angels, and from what he learned from the heavenly tablets.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Apocalypse of Weeks sequence mentions Enoch's birth in the first week;
    wickedness, deceit, a first end, and a saved man in the second; an elected man
    as the plant of righteous judgment in the third; visions, law, and enclosure in
    the fourth; a house of glory and dominion in the fifth; and blindness, forsaken
    wisdom, an ascending man, a burned house, and dispersion of the chosen root in
    the sixth.
  category: sequence
  evidence_refs:
  - ev:6
