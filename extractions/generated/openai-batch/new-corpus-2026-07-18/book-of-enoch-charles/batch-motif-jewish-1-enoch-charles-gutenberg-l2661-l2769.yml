canonical_text:
  quote: ''
  summary: The passage describes an angelic revelation of hidden cosmic structures
    and natural phenomena, including chambers, divisions, and measures for winds,
    celestial lights, thunder, lightning, water, rain, and other meteorological spirits.
    It then describes angels departing with cords to measure for the righteous, the
    return of those destroyed, the enthronement of the Elect One to judge deeds, and
    unified praise of the Lord of Spirits by heavenly hosts.
  language: English
  quote_policy: summarized
