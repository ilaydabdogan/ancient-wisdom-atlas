canonical_text:
  quote: ''
  summary: The Most High sends angelic messengers with commands concerning Noah, the
    coming deluge, the punishment of Azazel, Semjaza, the Watchers, and their children,
    followed by promises of cleansing, righteousness, fertility, blessing, and peace.
    Enoch is hidden and then called the scribe of righteousness, commissioned to announce
    the Watchers' doom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Most High sends Uriel to Noah, son of Lamech, to tell him to hide and
    to reveal that a deluge will destroy the whole earth and what is on it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Noah is to be instructed so that he may escape and his seed may be preserved
    for all generations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raphael is ordered to bind Azazel hand and foot, cast him into darkness in
    an opening in the desert at Dudael, cover him with rough rocks and darkness, and
    reserve him for a future fiery judgment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The earth is described as corrupted by angels and by secret things that the
    Watchers disclosed and taught to their sons; all sin is ascribed to Azazel.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Gabriel is ordered to proceed against the children of the Watchers and cause
    them to destroy one another in battle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Michael is ordered to bind Semjaza and his associates, who united themselves
    with women and defiled themselves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Semjaza and his associates are to see the destruction of their sons, be bound
    for seventy generations in the valleys of the earth, and later be led to the abyss
    of fire and an everlasting prison.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wrong and evil works are to be destroyed from the earth, while the plant of
    righteousness and truth is to appear and be planted in truth and joy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The righteous are said to escape, live in peace, and beget thousands of children.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The cleansed earth is described as tilled in righteousness, planted with desirable
    trees, vines, seed, and olives, and yielding abundant wine, grain, and oil.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: All children of men are said to become righteous, all nations are to adore
    and worship the Lord, and punishment and torment will not again be sent upon the
    earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The heavenly store chambers of blessing are to be opened so that blessing
    descends upon the labor of humankind, and truth and peace are to be associated
    throughout the generations.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Before these events Enoch is hidden; his activities concern the Watchers and
    his days are with the holy ones.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Watchers call Enoch the scribe of righteousness and ask him to declare
    to the Watchers of heaven that they have left the high heaven, defiled themselves
    with women, caused destruction, and will have no peace or forgiveness.
  category: speech
  evidence_refs:
  - ev:8
