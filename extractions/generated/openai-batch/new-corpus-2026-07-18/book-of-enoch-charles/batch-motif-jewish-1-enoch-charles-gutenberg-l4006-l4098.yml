  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A sea divides before the sheep; the Lord leads them and places himself between
    them and the wolves; the sea returns and drowns the pursuing wolves.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After escaping the water, the sheep enter a wilderness without water or grass;
    their eyes open, and the Lord gives them water and grass while a sheep leads them.
  category: setting
  evidence_refs:
  - ev:6
