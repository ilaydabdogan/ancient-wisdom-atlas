  summary: A dream-vision sequence presents animal lineages, the rise of sheep among
    wolves, oppression and rescue, a divided sea in which pursuing wolves drown, wilderness
    provision, ascent to a lofty rock with an overwhelming divine appearance, falling
    away and restoration, construction of a house for the Lord of the sheep, leadership
    succession, and arrival in a pleasant land.
