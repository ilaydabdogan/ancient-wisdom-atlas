canonical_text:
  quote: ''
  summary: The passage reports a vision of seven mountains, rivers, and islands, then
    gives laws and names of the sun and moon, especially the moon’s waxing and waning.
    Uriel shows Enoch the ordered courses, portals, times, and departures of the heavenly
    luminaries and stars. The passage then says that in the days of sinners years,
    seed, rain, and fruits will be delayed, shortened, or withheld.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The seer sees seven high mountains, higher than all mountains on earth; from
    that region hoar-frost comes forth and days, seasons, and years pass away.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seer sees seven large rivers on earth, with waters flowing toward the
    Great Sea, the Erythraean Sea, and, in a variant note, the desert.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The seer sees seven great islands, two on the mainland and five in the Great
    Sea.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The sun is given two names and the moon four names; the sun and moon are called
    the two great luminaries and are described as alike in circumference.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sun has seven portions of light in its circumference, more than the moon,
    and these are transferred in definite measures until the seventh portion is exhausted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The luminaries set and enter the western portals, make their revolution by
    the north, and come forth through eastern portals on the face of heaven.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The moon’s light increases by measured portions until it is full and then
    decreases by measured portions until the remaining light disappears.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: Uriel shows another law concerning when and from which side light is transferred
    to the moon by the sun.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The first day is called new moon; the full moon occurs when the sun sets in
    the west and the moon rises from the east at night, shining until sunrise.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage gives varying month lengths and period counts, including months
    of twenty-nine, twenty-eight, and thirty days, and a period of one hundred seventy-seven
    days.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
- id: obs:11
  text: Uriel the archangel is described as the leader of the luminaries and as showing
    the picture and sketch of every luminary.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Uriel tells Enoch that he has shown and revealed the sun, moon, leaders of
    the stars, those who turn them, and their tasks, times, and departures.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the days of sinners, years will be shortened, seed will be tardy on lands
    and fields, earthly things will alter, rain will be kept back, and heaven will
    withhold it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: In those times the fruits of the earth and of the trees will be backward or
    withheld in their proper time.
  category: sequence
  evidence_refs:
  - ev:9
