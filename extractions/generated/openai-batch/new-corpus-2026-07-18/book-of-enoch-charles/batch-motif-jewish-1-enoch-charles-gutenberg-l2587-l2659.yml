canonical_text:
  quote: ''
  summary: The passage describes unending light after the destruction of darkness;
    visionary disclosure of the secrets of lights, lightning, and thunder as agents
    of blessing or curse; a cosmic quaking of heaven before an enthroned Head of Days;
    the narrator’s terror and restoration by an angel sent by Michael; Michael’s speech
    about mercy, punishment, judgment, covenant for the elect, and inquisition for
    sinners; and the separation of the monsters Leviathan and Behemoth into oceanic
    abyss and wilderness, ending with an angelic statement that the narrator seeks
    hidden knowledge.
  language: English
  quote_policy: summarized
