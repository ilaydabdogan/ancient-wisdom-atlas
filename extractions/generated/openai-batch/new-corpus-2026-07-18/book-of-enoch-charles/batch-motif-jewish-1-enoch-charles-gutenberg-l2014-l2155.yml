canonical_text:
  quote: ''
  summary: 'The passage describes a visionary disclosure of heavenly, meteorological,
    astronomical, moral, and eschatological secrets: the seer observes heavenly mansions,
    sinners expelled, chambers and paths of celestial phenomena, Wisdom’s heavenly
    dwelling, Unrighteousness dwelling among humans, stars and lightnings with parabolic
    meaning, the lot of deniers, renewal of heaven and earth, and a vision of the
    Head of Days with the Son of Man.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first-person seer sees heavenly secrets, the division of the kingdom,
    and human actions weighed in a balance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seer sees mansions of the elect and holy, and sinners who deny the Lord
    of Spirits being driven and dragged away because of punishment from the Lord of
    Spirits.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The seer sees secrets of lightning, thunder, winds, clouds, and dew, including
    closed chambers from which winds and other phenomena are divided.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The seer sees chambers, paths, returns, orbits, and mutual faithfulness of
    the sun and moon.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the sun goes by the commandment of the Lord of Spirits, and
    that light and darkness and the spirits of men are separated.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A judge is appointed for all, and the judge judges all before the Lord of
    Spirits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wisdom is personified as seeking a dwelling among humans, finding none, returning
    to her place, and sitting among the angels.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Unrighteousness is personified as going forth from her chambers and dwelling
    with those she found, with similes of rain in a desert and dew on thirsty land.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Stars and lightnings are seen; stars are called by names, hearken, are weighed
    by light, and keep faith with each other.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The angelic guide explains that the stars’ parabolic meaning is the names
    of the holy who dwell on earth and believe in the Lord of Spirits.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some stars arise, become lightnings, and cannot part with their new form.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Those who deny the name of the dwelling of the holy ones and the Lord of Spirits
    are said to be unable to ascend into heaven or come upon earth, and are preserved
    for suffering and tribulation.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Elect One sits on a throne of glory, tries works, dwells among the elect,
    and the heaven and earth are transformed into blessing and light while sinners
    are excluded and destroyed.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The seer sees the Head of Days with a white head like wool and another being
    with the appearance of a man and a gracious face; the angel identifies this being
    as the Son of Man who has righteousness and reveals hidden treasures.
  category: sequence
  evidence_refs:
  - ev:11
