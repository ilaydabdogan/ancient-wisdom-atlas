canonical_text:
  quote: ''
  summary: A visionary animal allegory describes sheep whose eyes are opened and blinded,
    leaders raised as rams, predatory animals attacking the flock, a house and lofty
    tower for the Lord of the sheep, sent witnesses rejected by the sheep, the flock
    handed over to beasts and seventy shepherds, and a hidden record of the shepherds'
    excess destruction before the burning of the tower and demolition of the house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sheep's eyes are sometimes opened and sometimes blinded until another
    sheep leads them back and their eyes are opened.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dogs, foxes, and wild boars begin to devour the sheep.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Lord of the sheep raises a ram from among the sheep; the ram butts the
    predatory animals until destroying them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first ram forsakes its glory, butts the sheep, tramples them, and behaves
    unseemly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Lord of the sheep sends one lamb to another lamb and raises the latter
    to be a ram, prince, and leader of the sheep in place of the first ram.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The first ram pursues the second ram; the second ram flees, and dogs pull
    down the first ram.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The second ram leads the little sheep; the sheep grow and multiply, while
    the wild beasts fear and flee, and the ram kills them so that they no longer rob
    the sheep.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A little sheep later becomes a ram, prince, and leader after the previous
    ram begets many sheep and falls asleep.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A broad house is built for the sheep, a lofty tower is built on it for the
    Lord of the sheep, the Lord stands on the tower, and a full table is offered before
    Him.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The sheep err, go many ways, and forsake their house; the Lord sends some
    sheep to them, and the sheep begin to slay the sent ones.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: One sent sheep is saved from being killed, cries aloud over the sheep, is
    saved by the Lord, brought up to the narrator, and caused to dwell there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Many other sheep are sent to testify to and lament over the sheep; after the
    flock forsakes the house and tower, their eyes are blinded and slaughter occurs
    among them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Lord gives the sheep into the hands of lions, tigers, wolves, hyenas,
    foxes, and other wild beasts, which tear and devour them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The narrator cries aloud and appeals to the Lord concerning the devoured sheep;
    the Lord remains unmoved and leaves the sheep to the beasts.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Lord calls seventy shepherds and commands them to pasture the sheep and
    destroy only those sheep identified and numbered for destruction.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: The Lord calls another figure to observe and record the shepherds' actions,
