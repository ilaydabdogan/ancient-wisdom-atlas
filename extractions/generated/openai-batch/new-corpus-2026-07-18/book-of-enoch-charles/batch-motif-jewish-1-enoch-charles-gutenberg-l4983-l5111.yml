canonical_text:
  quote: ''
  summary: The passage warns sinners of fiery punishment, cosmic testimony, withheld
    rain and dew, and the terrors of judgment. It contrasts sinners' lack of fear
    with the fear shown by sailors and by nature before the Most High. It addresses
    the righteous dead, describing their grief in Sheol and promising that heavenly
    records disclose future joy, glory, and enduring life for their spirits, while
    sinners may die prosperously but remain under woe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sinners are addressed with woe because of their words, deeds, and godlessness,
    and are told they will burn in blazing flames.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deity will inquire from angels, the sun, the moon, and the stars about
    the deeds and sins of sinners.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cloud, mist, dew, and rain are summoned to testify against sinners and are
    described as being withheld from descending because of them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage tells sinners to give presents, gold, and silver to rain and dew
    so that they may descend.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hoar-frost, snow, snowstorms, chilliness, and plagues are said to fall upon
    the sinners so that they cannot stand before them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The children of heaven are told to observe heaven and the works of the Most
    High, to fear him, and to do no evil in his presence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the deity closes the windows of heaven, withholds rain and dew, and sends
    anger because of deeds, sinners cannot petition him and will have no peace.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Sailors are described as fearing when their ships are tossed by waves, shaken
    by winds, and threatened by the sea swallowing them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The sea, its waters, and its movements are called the work of the Most High,
    who has set limits for it and confined it by sand; at his reproof it fears, dries
    up, and its fish die.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: On the day described, grievous fire, the divine word, terrified luminaries,
    trembling earth, angelic commands, and the cursing of sinners accompany a command
    that righteous souls should not fear.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The righteous dead are said to have descended into Sheol in grief, while sinners
    say that righteous and sinners die alike, in grief, darkness, and without future
    light.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The first-person speaker swears by the Great One, says he knows a mystery
    and has read heavenly tablets and holy books, and reports that goodness, joy,
    glory, recompense, life, and enduring memorial are prepared for the righteous
    dead.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Sinners are addressed with woe when they die in the wealth of their sins,
    while people like them call them blessed for dying in prosperity, wealth, honor,
    and without judgment in life.
  category: speech
  evidence_refs:
  - ev:9
