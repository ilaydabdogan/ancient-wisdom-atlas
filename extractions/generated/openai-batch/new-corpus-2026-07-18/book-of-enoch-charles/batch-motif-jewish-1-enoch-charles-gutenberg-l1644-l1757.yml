canonical_text:
  quote: ''
  summary: 'Enoch journeys through extraordinary earthly regions: a fiery mountain
    range, seven mountains with a highest central throne-like mountain encircled by
    fragrant trees, and a unique non-withering tree. Michael explains that the high
    mountain is the throne of the Holy Great One and that the tree is reserved until
    the great judgement, after which it will be given to the righteous and elect.
    Enoch then sees a blessed middle-earth region with mountains, ravines, streams,
    and an accursed valley. Uriel explains that the valley is the gathering and judgement
    place for those who speak against the Lord. The passage closes with further eastward
    travel through wilderness, watercourses, aromatic trees, and watery valleys.'
  language: English
  quote_policy: summarized
