- id: obs:2
  text: Beyond the fiery range, Enoch sees seven magnificent mountains, arranged toward
    the east and south with deep rough ravines between them; the seventh mountain
    is central, tallest, and resembles the seat of a throne.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fragrant trees encircle the throne-like mountain, and among them is a unique
    tree with exceptional fragrance, non-withering leaves, blooms, and wood, and fruit
    resembling dates of a palm.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Enoch asks about the tree, and Michael, described as one of the holy and honoured
    angels and their leader, replies to him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Michael identifies the high mountain as the throne where the Holy Great One,
