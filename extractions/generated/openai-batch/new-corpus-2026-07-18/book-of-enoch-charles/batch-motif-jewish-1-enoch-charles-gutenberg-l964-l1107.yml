canonical_text:
  quote: ''
  summary: The passage opens the Book of Enoch with Enoch blessing the elect and righteous,
    reporting a heavenly vision shown by angels, and announcing the coming of God
    with holy ones to judge the ungodly. It contrasts ordered heavenly and earthly
    cycles with human disobedience, and ends by describing curse and destruction for
    sinners and peace, light, wisdom, and extended joy for the elect.
  language: English
  quote_policy: summarized
