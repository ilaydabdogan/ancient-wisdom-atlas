canonical_text:
  quote: ''
  summary: 'The passage describes the seventh through tenth weeks: an apostate generation,
    election and instruction of the righteous, judgment on oppressors, a house for
    the Great King, world destruction, eternal judgment among angels, departure of
    the first heaven, appearance of a new heaven, and endless righteousness. It then
    exhorts the righteous to walk in righteous paths and pronounces woes against sinners,
    the rich, lying witnesses, and persecutors, with Enoch grieving over them.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the seventh week an apostate generation arises, and the elect righteous
    of the eternal plant of righteousness receive sevenfold instruction concerning
    creation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage asks who among humans can hear the Holy One's voice, understand
    heavenly things, ascend and see their ends, or know the measures of earth, heaven,
    stars, and luminaries.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the eighth week, a sword is given so that righteous judgment may be executed
    on oppressors, and sinners are delivered into the hands of the righteous.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the close of the eighth week, the righteous acquire houses through righteousness,
    a house is built for the Great King, and humanity looks to the path of uprightness.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the ninth week, righteous judgment is revealed to the whole world, the
    works of the godless vanish, and the world is written down for destruction.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the tenth week, great eternal judgment occurs, vengeance is executed among
    the angels, the first heaven passes away, a new heaven appears, heavenly powers
    give sevenfold light, and sin is no longer mentioned.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The speaker exhorts his sons and the righteous to love righteousness, avoid
    paths of wickedness and death, choose an elect life, and walk in paths of peace.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The speaker says sinners will tempt people to mistreat wisdom so that no place
    may be found for her.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Woes are pronounced on those who build unrighteousness, oppression, deceit,
    and houses with sin; they are said to be overthrown, to fall by the sword, and
    to have no peace.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Woes are addressed to the rich for trusting in riches and forgetting the Most
    High; they are associated with blasphemy, unrighteousness, the day of slaughter,
    darkness, and great judgment.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The speaker wishes his eyes were like a cloud of waters so that he could weep
    over the sinners, and says judgment shall overtake them.
  category: speech
  evidence_refs:
  - ev:10
