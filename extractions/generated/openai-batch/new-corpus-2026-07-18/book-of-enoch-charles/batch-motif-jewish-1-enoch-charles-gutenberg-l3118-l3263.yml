canonical_text:
  quote: ''
  summary: The passage describes a cosmic oath that orders waters, sea, depths, sun,
    moon, stars, winds, thunder, lightning, hail, frost, mist, rain, and dew; the
    revelation and enthronement of the Son of Man for judgment; Enoch's being raised
    aloft and separated from earthly dwellers; and Enoch's heavenly ascent, guided
    by Michael, to fiery and crystalline heavenly structures, angelic guardians, and
    the Head of Days.
  language: English
  quote_policy: summarized
