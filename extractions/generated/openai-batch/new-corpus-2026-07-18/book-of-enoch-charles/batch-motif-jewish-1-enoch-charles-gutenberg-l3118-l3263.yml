  cautions: The passage uses the word oath, but it does not explicitly describe a
    covenant between parties.
- id: motif:2
  label: Watery foundation and bounded sea
  taxonomy_refs:
  - chaos
  basis: The earth is founded upon water, and the sea is restrained by sand so it
    does not pass beyond its limit in anger.
  evidence_refs:
  - ev:1
