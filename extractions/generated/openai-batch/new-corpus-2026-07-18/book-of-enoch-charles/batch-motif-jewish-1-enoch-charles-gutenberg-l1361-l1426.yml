canonical_text:
  quote: ''
  summary: A heavenly speaker tells Enoch to address the Watchers, condemning them
    for leaving heaven, taking human wives, and begetting giants. The giants' spirits
    become earthbound evil spirits who afflict humans until a final judgment. The
    Watchers are also condemned for revealing harmful mysteries to women and humans,
    and are told they have no peace. The passage then begins Enoch's first journey,
    in which he is brought to fiery beings, darkness, a mountain reaching heaven,
    cosmic treasuries, living waters, a river of fire, great rivers, and the sources
    of the deep.
  language: English
  quote_policy: summarized
