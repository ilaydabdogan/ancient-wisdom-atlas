canonical_text:
  quote: ''
  summary: The passage announces punitive descent into Sheol for sinners, voices the
    complaint of oppressed righteous people, assures the righteous of heavenly remembrance
    and vindication, warns sinners that their sins are recorded and witnessed, condemns
    the falsification of upright words, promises truthful books and wisdom to the
    righteous, and concludes with the Lord and his Son united with the children of
    uprightness in peace.
