canonical_text:
  quote: ''
  summary: In a dream-vision, Enoch sees records opened before the Lord of the sheep,
    judgment carried out upon stars, shepherds, and blinded sheep, and the guilty
    cast into fiery abysses. The old house is removed and a greater new house is set
    up. Surviving and restored animals assemble, the sheep become white, the sword
    is returned and sealed, eyes are opened, and a white bull and later transformed
    white bulls appear. Enoch awakens, blesses the Lord, and weeps over the vision.
  language: English
  quote_policy: summarized
