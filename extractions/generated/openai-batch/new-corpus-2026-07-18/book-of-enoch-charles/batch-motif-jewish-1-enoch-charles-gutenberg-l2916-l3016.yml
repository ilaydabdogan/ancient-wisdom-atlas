canonical_text:
  quote: ''
  summary: The passage describes judgment before the Son of Man, identifies fallen
    angels who revealed hidden things and led humanity into sin, and recounts Noah’s
    appeal to Enoch as the earth approaches destruction. Enoch explains that ruin
    has been decreed because humans learned angelic secrets, sorceries, and illicit
    crafts. Noah is declared pure and destined for preservation with righteous seed.
    Angels of punishment are prepared to release subterranean waters but are commanded
    to hold them back. God promises Noah preservation through a wooden building made
    by angels, so that life will continue on earth. The passage also describes the
    imprisonment of misleading angels in a fiery valley among mountains of metals,
    with convulsing waters, molten fire, sulfur, and streams of fire.
  language: English
  quote_policy: summarized
