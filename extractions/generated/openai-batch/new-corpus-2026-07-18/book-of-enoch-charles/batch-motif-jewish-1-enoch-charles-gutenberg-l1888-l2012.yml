canonical_text:
  quote: ''
  summary: The passage describes a judgment scene in which the righteous and elect
    receive light while sinners and earthly rulers are condemned. Enoch is carried
    by a whirlwind to the end of the heavens, sees the dwelling-places of the holy
    and righteous, sees the Elect One, joins heavenly praise, and then sees four angelic
    presences identified as Michael, Raphael, Gabriel, and Phanuel with their functions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Righteous One appears before the righteous, and light appears to the righteous
    and elect who dwell on the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sinners are judged, the godless are driven from the presence of the righteous
    and elect, earthly possessors lose power, kings and mighty ones perish, and mercy
    is no longer sought because their life is at an end.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that elect and holy children descend from high heaven, their
    seed becomes one with the children of men, and Enoch receives books of zeal, wrath,
    disquiet, and expulsion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A whirlwind carries Enoch from the earth and sets him down at the end of the
    heavens.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Enoch sees dwelling-places of the holy and resting-places of the righteous
    with righteous angels.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The holy and righteous petition, intercede, and pray for the children of men;
    righteousness is described as flowing like water and mercy like dew upon the earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Enoch sees the Elect One of righteousness and faith, whose dwelling-place
    is under the wings of the Lord of Spirits.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The righteous and elect are described as without number before the Lord of
    Spirits and as strong as fiery lights, with mouths full of blessing.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Enoch praises the Lord of Spirits, sees those who sleep not standing before
    divine glory and blessing, and his face is changed because he can no longer behold.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Enoch sees an innumerable multitude before the Lord of Spirits and four presences
    on the four sides of the Lord of Spirits; the angel accompanying him makes their
    names and hidden things known.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The four presences utter praises; one blesses the Lord of Spirits, one blesses
    the Elect One and the elect, one prays and intercedes for earth-dwellers, and
    one fends off the Satans from accusing earth-dwellers.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The angel identifies the four presences as Michael, Raphael, Gabriel, and
    Phanuel, and states their respective functions.
  category: speech
