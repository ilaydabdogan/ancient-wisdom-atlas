canonical_text:
  quote: ''
  summary: The passage describes a future change for the holy and elect, the victory
    of the righteous, possible repentance of others, and judgement on the unrepentant.
    It then depicts earth, Sheol, and hell giving back what they hold; the Elect One
    arising, choosing the righteous, sitting on a throne, and revealing wisdom. A
    visionary narrator is carried westward and sees hidden heavenly things, including
    mountains of various metals, which an angel interprets as serving the dominion
    of the Anointed but becoming powerless before the Elect One. The passage also
    describes a deep valley, sinners’ oppression and destruction, angels preparing
    instruments of punishment for kings and mighty ones, and the appearance of the
    house of the Elect One’s congregation with rest for the righteous.
  language: English
  quote_policy: summarized
