  summary: A visionary narrator sees fiery places of punishment, angelic chains, judgment
    on Azazel and his hosts, a water judgment followed by a sworn heavenly sign, a
    final conflict involving eastern powers, Sheol devouring sinners, wagons arriving
    on winds, and a blessing of the righteous and elect in light and eternal life.
  language: English
  quote_policy: summarized
