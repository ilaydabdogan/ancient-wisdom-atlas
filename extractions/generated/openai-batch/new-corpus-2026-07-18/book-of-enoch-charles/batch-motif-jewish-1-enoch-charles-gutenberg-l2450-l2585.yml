candidate_motifs:
- id: motif:1
  label: divine judgment of wicked powers and sinners
  taxonomy_refs:
  - divine_judgment
  basis: 'The passage repeatedly depicts divine punishment: fiery condemnation, water
    destruction, the Elect One’s judgment of Azazel, punishment angels, and Sheol
    devouring sinners.'
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage combines several judgment episodes, so individual sub-scenes
    may have distinct narrative settings.
- id: motif:2
  label: flood-like destruction and renewal pledge
  taxonomy_refs:
  - flood_and_renewal
  basis: Upper and lower waters are opened and joined to destroy earth-dwellers, followed
    by an oath not to repeat the destruction against all and a sign in heaven.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The body of the passage does not name Noah or identify the heavenly sign.
- id: motif:3
  label: heavenly sign as covenant pledge
  taxonomy_refs:
  - covenant
  basis: The Head of Days swears by his great name and sets a sign in heaven as a
    perpetual pledge of good faith between himself and earth-dwellers.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage calls the sign a pledge of good faith but does not use the
    word covenant in the excerpt.
- id: motif:4
  label: visionary map of punishment places
  taxonomy_refs:
  - afterlife_journey_map
  basis: The seer is shown a fiery valley, an abyssal chasm, a burning furnace, and
    Sheol’s jaws as places or images of condemnation.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage is an apocalyptic vision of judgment rather than a full narrated
    journey through the afterlife.
- id: motif:5
  label: return from dispersion
  taxonomy_refs:
  - return
  basis: The section heading names the return from dispersion, and the scene depicts
    wagons with riders coming on winds from east, west, and south before worship of
    the Lord of Spirits.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The identity of the riders as returnees rests largely on the supplied
    heading; the body text describes wagons and riders but does not explicitly call
    them dispersed people.
- id: motif:6
  label: seeking secrets of righteousness
  taxonomy_refs:
  - wisdom
  basis: The holy are told to seek the secrets of righteousness and the heritage of
    faith, while the righteous seek light and find righteousness.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage emphasizes righteous knowledge and light but does not narrate
    a separate wisdom quest.
- id: motif:7
  label: paired oppositions of above/below and light/dark
  taxonomy_refs:
  - duality
  basis: The waters above and beneath are described as masculine and feminine, and
    the blessed state contrasts light with darkness that has passed.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: medium
  cautions: The paired imagery is explicit, but the passage does not develop a systematic
    dualist doctrine in this excerpt.
