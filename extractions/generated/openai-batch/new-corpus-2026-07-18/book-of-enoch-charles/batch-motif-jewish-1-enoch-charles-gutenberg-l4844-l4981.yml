canonical_text:
  quote: ''
  summary: The passage pronounces woes on sinners, liars, oppressors, idol worshippers,
    and persecutors of the righteous. It describes prayers of the righteous placed
    before angels and the Most High, a day of destruction and bloodshed, mutual slaughter
    among kin, angelic gathering of those who brought down sin, divine judgement by
    the Most High, and angelic guardianship for the righteous and wise.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sinners and godless persons are said to love unrighteous deeds, write lies,
    pervert upright words, transgress the eternal law, and receive no peace or happy
    life.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The righteous are instructed to raise prayers as a memorial and testimony
    before angels, who place the sin of sinners as a memorial before the Most High.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nations and families are said to arise on a day of destruction, and destitute
    persons abandon their children and sucklings without pity.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some worship stones, graven images, impure spirits, demons, and idols, and
    the passage says these objects of worship will provide no help.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Those who accept and understand words of wisdom, observe the paths of the
    Most High, and walk in righteousness are said to be saved.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage condemns spreading evil to neighbours, making false measures,
    building houses through others' toil, rejecting ancestral heritage, helping oppression,
    and slaying neighbours.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Most High is described as casting down the sinners' glory, bringing affliction
    on their hearts, arousing indignation, and destroying them with the sword.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Fathers, sons, and brothers are described as slaying one another until streams
    flow with blood and horses and chariots are submerged in blood.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Angels descend into secret places and gather into one place those who brought
    down sin, while the Most High arises to execute judgement among sinners.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Most High appoints guardians from among the holy angels over the righteous
    and holy, who are guarded until wickedness and sin end.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Sinners who afflict the righteous and burn them with fire are told they will
    be requited according to their works, and the obstinate are told fear will come
    with no helper.
  category: sequence
  evidence_refs:
  - ev:11
