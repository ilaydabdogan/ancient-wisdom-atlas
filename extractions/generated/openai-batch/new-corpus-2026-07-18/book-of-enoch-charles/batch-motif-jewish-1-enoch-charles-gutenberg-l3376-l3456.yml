canonical_text:
  quote: ''
  summary: 'The passage describes laws governing the sun and moon: the sun’s course,
    brightness, and unceasing motion; the moon’s chariot, measured light, phases,
    monthly course, and movement through portals; and calendrical calculations in
    which the sun and stars complete 364-day years while the moon falls behind. Uriel
    shows the observer these celestial positions, and the observer writes them down.'
  language: English
