canonical_text:
  quote: ''
  summary: Enoch writes for Methuselah and later law-keepers. The passage exhorts
    the good to await the end of evil, describes a fiery chaotic place where sinners
    are cast, records Enoch’s question to a holy angel about the vision, and contrasts
    the fate of sinners with the recompense, transformation, shining light, and thrones
    of the faithful righteous.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Enoch is said to have written another book for his son Methuselah and for
    later people who keep the law in the last days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those who have done good are told to wait until an end is made of evil workers,
    transgressors, and sin.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the names of the wicked will be blotted from the book of
    life and holy books, their seed destroyed, their spirits slain, and they will
    lament in a chaotic wilderness and burn in fire where there is no earth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The visionary sees something like an invisible cloud, a depth he cannot look
    over, a blazing flame of fire, and things like shining mountains circling and
    sweeping to and fro.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Enoch asks a holy angel with him what the shining thing is, saying it is not
    heaven but a blazing fire with voices of weeping, crying, lamentation, and strong
    pain.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The holy angel identifies the place as where spirits of sinners, blasphemers,
    wicked workers, and perverters of the Lord’s prophetic words are cast.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some matters are written and inscribed above in heaven so that angels may
    read them and know what will happen to sinners and to humble or afflicted spirits.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The humble and faithful are described as loving God, not loving gold, silver,
    or worldly goods, giving their bodies to torture, not longing for earthly food,
    and being found pure after being tried by the Lord.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The faithful are assigned blessings and recompense because they loved heaven
    more than worldly life and blessed God despite being abused, reviled, trodden
    underfoot, and put to shame by wicked people.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A divine speaker says the spirits of the good who belong to the generation
    of light will be summoned and that those born in darkness, who were not recompensed
    with deserved honour in the flesh, will be transformed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Those who loved the holy name are to be brought forth in shining light, seated
    each on a throne of honour, and made resplendent for times without number.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The righteous are said to see those born in darkness led into darkness, while
    the righteous are resplendent; sinners cry aloud, see them resplendent, and go
    where prescribed days and seasons are appointed for them.
  category: sequence
  evidence_refs:
  - ev:8
