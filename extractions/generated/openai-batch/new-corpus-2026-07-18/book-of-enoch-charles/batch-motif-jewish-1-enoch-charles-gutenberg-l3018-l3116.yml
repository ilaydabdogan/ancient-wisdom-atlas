canonical_text:
  quote: ''
  summary: The passage describes waters that heal the bodies of earthly rulers while
    also functioning as judgment; punished angels affect the waters, which will become
    everlasting fire. Michael and Raphael respond to the severity of the angelic judgment.
    Enoch transmits secrets in a book. A catalogue names angels and describes their
    roles in leading heavenly beings and humans astray by revealing weapons, writing,
    harmful knowledge, and an oath associated with a hidden name and cosmic power.
  language: English
  quote_policy: summarized
