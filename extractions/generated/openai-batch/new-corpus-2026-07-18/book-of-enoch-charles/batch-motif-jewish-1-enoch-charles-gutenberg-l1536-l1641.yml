canonical_text:
  quote: ''
  summary: Raphael explains to the narrating seer that hollow places have been made
    for the souls of the dead until judgment. A petitioning spirit is identified as
    Abel, slain by Cain. Raphael describes separated divisions for classes of dead
    spirits, including the righteous with a bright spring of water and sinners awaiting
    punishment. The seer blesses the Lord of righteousness. The seer then travels
    west to the ends of the earth, sees a restless burning fire, and Raguel explains
    it as the western fire that pursues the luminaries of heaven.
  language: English
  quote_policy: summarized
literal_observations:
