- id: obs:3
  text: Raphael identifies the petitioning spirit as Abel, whom his brother Cain slew,
    and says Abel makes suit against Cain until Cain's seed is destroyed or annihilated.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hollow places are separated, and Raphael says three have been made to
    separate the spirits of the dead.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: One division is for the spirits of the righteous and contains a bright spring
    of water.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A division is made for sinners who die and are buried before judgment is executed
    on them; their spirits are set apart in pain until the great day of judgment,
    punishment, torment, and binding.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Another division is made for spirits who make suit and disclose their destruction
