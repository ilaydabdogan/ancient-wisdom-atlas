  text: Raphael says the hollow places were created so that the spirits or souls of
    the dead could assemble there until their appointed period and the great judgment.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dead spirit's voice goes forth to heaven and makes suit.
  category: action
  evidence_refs:
