canonical_text:
  quote: ''
  summary: In a dream-vision, shepherds hand sheep over to wild beasts and exceed
    the destruction assigned to them. A recorder writes the destructions in a book,
    presents it to the Lord of the sheep, and later testifies against the shepherds.
    Some sheep return and rebuild a fallen house, tower, and table, though the bread
    is polluted. Later shepherds, birds, and beasts devour and scatter the sheep.
    Lambs arise among white sheep, open their eyes, and are attacked by ravens. Horns
    grow on lambs, a great horn appears on one sheep, and the rams gather to it. Birds
    and beasts fight against the horn. A great sword is given to the sheep, and the
    beasts and birds flee. The Lord of the sheep comes in wrath, and those who see
    him flee and fall before him.
  language: English
  quote_policy: summarized
