  source_text_path: texts/public-domain/jewish-pseudepigrapha/project-gutenberg/book-of-enoch-charles.md
  rights_note: Public domain source; summary generated from provided passage.
- id: ev:16
  type: summary
  locator: XC.9
  quote_or_summary: Horns grow on the lambs; ravens cast down the horns; a great horn
