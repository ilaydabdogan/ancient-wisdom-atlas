    receiving Wisdom after calling on God. Wisdom is praised above wealth, power,
    beauty, health, and light; she brings all good things, teaches cosmic and hidden
    knowledge, is described as pure emanation and mirror of God, orders all things,
    and is sought by the speaker as a spouse and companion who grants virtue, honor,
    judgment, memory, rule, and joy.
