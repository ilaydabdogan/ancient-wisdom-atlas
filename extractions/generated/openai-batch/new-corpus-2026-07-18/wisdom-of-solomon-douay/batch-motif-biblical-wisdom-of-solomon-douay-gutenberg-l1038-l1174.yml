canonical_text:
  quote: ''
  summary: The passage presents God as judging wicked peoples gradually and justly,
    allowing opportunity for repentance, teaching God's own people justice and hope,
    and punishing idolaters through the same things they worshipped. It then argues
    that people should recognize the Creator through visible created things rather
    than treating natural forces, celestial bodies, or handmade images as gods. The
    final section describes a carpenter making useful objects from a tree and then
    carving, painting, installing, and fastening an otherwise helpless idol from leftover
    wood.
  language: English
  quote_policy: summarized
