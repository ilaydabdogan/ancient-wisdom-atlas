canonical_text:
  quote: ''
  summary: The passage introduces the Book of Wisdom, exhorts earthly judges to love
    justice and seek God sincerely, describes wisdom and the Spirit as incompatible
    with deceit and sin, warns that God hears hidden speech and thoughts, denies that
    God made death, and says wicked people call death to themselves. It then presents
    the wicked reasoning that life is brief and irrecoverable, urging pleasure and
    oppression, and plotting to test, torture, and condemn the just man who claims
    God as father.
  language: English
  quote_policy: summarized
