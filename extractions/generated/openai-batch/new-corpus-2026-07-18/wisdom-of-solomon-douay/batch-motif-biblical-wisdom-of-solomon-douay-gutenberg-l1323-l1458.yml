canonical_text:
  quote: ''
  summary: The passage contrasts mortal idol-making from clay with the true Maker
    who gives soul and breath, condemns enemies who worship lifeless idols and creatures,
    and then contrasts punishments of oppressors with divine care for God's people.
    Animals, serpents, insects, water, hail, rain, and fire become instruments of
    correction or judgment, while God's word heals, God holds power over life and
    death, and the people receive quails and heavenly bread.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A potter tempers soft earth and shapes vessels from the same clay for different
    uses, with the potter judging their use.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: From the same clay a human artisan makes a god by vain labour, although the
    artisan is himself made of earth, has lent life, and will return to earth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the human maker does not know the Maker who inspired the
    working soul and breathed a living spirit.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Enemies of God's people are described as holding them in subjection and as
    foolish, unhappy, and proud beyond measure.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The idols esteemed as gods are described as lacking functional eyes, noses,
    ears, hands, and feet.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A mortal human with borrowed breath fashions dead things with his hands and
    then worships them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The enemies are punished and destroyed by beasts, while God's people receive
    quails and a new, desirable food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Serpents bite the people during a short correction; a sign of salvation is
    given, and those who turn to it are healed by God, not by the visible object itself.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Locusts and flies kill the enemies without remedy, while venomous serpents
    do not overcome God's children, who are healed by mercy and by the Lord's word
    rather than herbs or plaster.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Lord is said to have power over life and death, to lead down to the gates
    of death, and to bring back again; a malicious human killer cannot recall the
    departed spirit or soul.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The wicked who deny God are scourged by waters, hail, rain, and fire; fire
    is said to have greater force in water, and the world fights for the just.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: God feeds the people with food of angels and bread from heaven, prepared without
    labour and containing sweetness and every taste.
  category: object
  evidence_refs:
