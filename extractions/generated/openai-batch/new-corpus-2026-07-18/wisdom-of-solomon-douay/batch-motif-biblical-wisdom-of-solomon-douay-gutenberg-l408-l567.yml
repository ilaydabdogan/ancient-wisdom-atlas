- id: obs:4
  text: The just are said to live forever, to have their reward with the Lord, and
    to receive a kingdom of glory and a crown of beauty from the Lord, who covers
    and defends them.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Lord's zeal is described as taking armor, and the creature and the whole
