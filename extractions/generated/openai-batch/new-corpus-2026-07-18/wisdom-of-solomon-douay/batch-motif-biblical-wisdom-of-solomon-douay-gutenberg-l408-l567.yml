  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Kings, judges, and rulers are addressed and told that power and strength are
    given by the Lord, who will examine their works and thoughts.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says severe judgment is prepared for rulers, mercy is granted
    to the little, God cares for little and great alike, and greater punishment awaits
    the more mighty.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Wisdom is described in feminine terms as glorious, unfading, easily seen by
