canonical_text:
  quote: ''
  summary: The passage presents a speech attributed to sinners in hell, who confess
    that they erred from truth while the just are counted among God's children and
    saints. It contrasts the passing hope of the wicked with the eternal reward of
    the just, depicts the Lord arming creation and natural forces for judgment, and
    addresses kings and rulers, urging them to seek personified Wisdom, whose love
    leads to incorruption, nearness to God, and an everlasting kingdom.
  language: English
  quote_policy: summarized
