  text: Speakers say the just are numbered among the children of God and saints, while
    they themselves erred from the way of truth and did not know the way of the Lord.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speakers describe pride and riches as unprofitable and compare their vanished
    life and hope to transient images, including a shadow, a running post, a ship's
    vanished trace, a bird's unmarked flight, an arrow's passage, dust, froth, smoke,
    and a one-day guest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The text identifies the preceding speech as words spoken by sinners in hell.
  category: setting
  evidence_refs:
