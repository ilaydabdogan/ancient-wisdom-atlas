canonical_text:
  quote: ''
  summary: The passage contrasts the deceived wicked with the just. It states that
    God created man incorruptible, that death entered through the devil’s envy, that
    the souls of the just are protected by God and rewarded after testing, and that
    the wicked, their works, and unlawful offspring come to shame and judgment. It
    also praises chaste and undefiled life, describes the early death or translation
    of a just man as divine protection, and depicts the wicked recognizing the unexpected
    salvation of those they had derided.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Those who thought wrongly are described as deceived and blinded by their own
    malice, and as not knowing the secrets of God.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: God is said to have created man incorruptible and in the image of his own
    likeness; death is said to have come into the world by the envy of the devil.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The souls of the just are described as being in the hand of God, untouched
    by the torment of death, appearing to die to the unwise, yet being in peace and
    having hope full of immortality.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The just are described as afflicted in few things, rewarded in many, tried
    by God, proved like gold in a furnace, and received like a victim of a holocaust.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The just are said to shine, move like sparks among reeds, judge nations, rule
    peoples, and live under the Lord’s everlasting reign.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Those who trust and are faithful are said to understand truth, rest in God,
    and receive grace and peace as God’s elect.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The wicked are said to be punished according to their own devices, to have
    neglected the just, revolted from the Lord, rejected wisdom and discipline, and
    to have vain hope and fruitless labors.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The barren and undefiled person is called happy, and the eunuch who avoids
    iniquity and wicked thoughts against God is promised faith and an acceptable lot
    in the temple of God.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The children of adulterers and the seed of the unlawful bed are said not to
    reach perfection, to be rooted out, to lack hope in the day of trial, and to have
    dreadful ends.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The chaste generation is described as beautiful with glory, having immortal
    memory, being known by God and men, being imitated and desired, and triumphing
    crowned forever.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The brood of the wicked and bastard slips are described as not thriving, lacking
    deep root or firm foundation, being shaken or rooted out by wind, and bearing
    broken branches and unprofitable fruit.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: A just man who is prevented with death is said to be in rest; venerable old
    age is defined by understanding and a spotless life rather than by many years.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: The just man is said to have pleased God, to have been beloved, translated,
    and taken away so that wickedness or deceit would not alter his understanding
    or soul.
  category: action
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:14
  text: The dead just person is said to condemn the living wicked, and the wicked
    are said not to understand what God designed for the wise man or why the Lord
    set him in safety.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:15
  text: The wicked are said to be laughed to scorn by the Lord, fall without honor,
    become a reproach among the dead, be shaken from foundations, and be convicted
    by their own sins.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:16
  text: The just are said to stand with great constancy against those who afflicted
    them, while the afflicters are troubled by fear, amazed at unexpected salvation,
