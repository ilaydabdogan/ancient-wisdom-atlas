candidate_motifs:
- id: motif:1
  label: purified survivors sheltered before the divine throne
  taxonomy_refs: []
  basis: The passage links a group emerging from great tribulation with washed robes,
    service before God's throne, divine shelter, absence of hunger and thirst, living
    waters, and tears wiped away.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage does not specify whether this is an afterlife journey, earthly
    survival, or another state within this excerpt alone.
- id: motif:2
  label: blood-associated purification
  taxonomy_refs:
  - sacrifice
  basis: The group's robes are said to have been washed and made white in the blood
    of the Lamb.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The excerpt mentions the Lamb's blood but does not narrate a sacrificial
    act within this passage.
- id: motif:3
  label: heavenly liturgy preceding earthly upheaval
  taxonomy_refs:
  - sacred_exchange
  - divine_judgment
  basis: Incense with the prayers of saints ascends before God, then the angel casts
    altar fire into the earth, followed by thunder, lightning, voices, and earthquake.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage places these actions in sequence but does not explicitly state
    a causal explanation for the earthly upheaval.
- id: motif:4
  label: sequential trumpet judgments on earth, sea, waters, and heavens
  taxonomy_refs:
  - divine_judgment
  - chaos
  basis: The trumpet sequence brings repeated partial devastation to land vegetation,
    the sea, fresh waters, and celestial lights, followed by a woe announcement.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The events are partial in the excerpt, often affecting a third, rather
    than complete destruction.
- id: motif:5
  label: world-damaging fire from heaven and burning cosmic objects
  taxonomy_refs:
