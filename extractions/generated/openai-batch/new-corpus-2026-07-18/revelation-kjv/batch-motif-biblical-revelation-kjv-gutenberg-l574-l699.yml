  quote_or_summary: Seven angels standing before God receive seven trumpets and prepare
    to sound.
  source_text_path: texts/public-domain/biblical/project-gutenberg/revelation-kjv.md
  rights_note: Public domain King James Version text from Project Gutenberg metadata
