canonical_text:
  quote: ''
  summary: 'The passage identifies those who have come out of great tribulation and
    describes their service before God''s throne and the Lamb''s care for them. The
    seventh seal is opened, seven angels receive trumpets, incense and prayers ascend
    before God, and altar fire is cast to earth. The first six trumpet events begin:
    earth, sea, waters, and heavenly lights are struck; a woe is announced; the bottomless
    pit is opened and locust-like tormentors emerge; and four bound angels at the
    Euphrates are released, followed by a vast horsemen army.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An interpreting figure says that a group has come out of great tribulation
    and has washed robes white in the blood of the Lamb.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The group stands before God's throne, serves God day and night in the temple,
    and the one on the throne dwells among them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The group will no longer hunger, thirst, suffer sun or heat; the Lamb feeds
    them, leads them to living fountains of waters, and God wipes away their tears.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the seventh seal is opened, heaven is silent for about half an hour.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Seven angels standing before God receive seven trumpets and prepare to sound
    them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Another angel with a golden censer offers incense with the prayers of the
    saints on the golden altar, and the smoke ascends before God.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The censer is filled with altar fire and cast into the earth, followed by
    voices, thunderings, lightnings, and an earthquake.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: At the first trumpet, hail and fire mingled with blood are cast on the earth,
    burning a third of the trees and all green grass.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: At the second trumpet, something like a great mountain burning with fire is
    cast into the sea; a third of the sea becomes blood, a third of sea creatures
    die, and a third of ships are destroyed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: At the third trumpet, a burning star called Wormwood falls on a third of rivers
    and fountains; waters become bitter and many people die from them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: At the fourth trumpet, a third of the sun, moon, and stars is darkened, reducing
    day and night light by a third.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: A flying angel announces three woes to the earth's inhabitants because of
    the remaining trumpet voices.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: At the fifth trumpet, a star falls from heaven to earth, receives the key
    to the bottomless pit, opens it, and smoke from the pit darkens the sun and air.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Locusts emerge from the smoke with scorpion-like power and are commanded to
    harm only people without the seal of God in their foreheads, tormenting them for
    five months without killing them.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: The locusts are described as battle-horse-like beings with gold-like crowns,
    human faces, women's hair, lion teeth, iron-like breastplates, loud wings like
    chariots, and scorpion-like tails with stings.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:16
  text: The locusts have a king over them, the angel of the bottomless pit, named
    Abaddon in Hebrew and Apollyon in Greek.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:17
  text: At the sixth trumpet, a voice from the four horns of the golden altar before
    God commands the sixth angel to loose the four angels bound in the great river
    Euphrates.
  category: speech
  evidence_refs:
  - ev:17
- id: obs:18
  text: The four angels are released at an appointed hour, day, month, and year to
    slay a third of humanity; the army of horsemen is numbered as two hundred thousand
    thousand.
  category: action
  evidence_refs:
  - ev:18
