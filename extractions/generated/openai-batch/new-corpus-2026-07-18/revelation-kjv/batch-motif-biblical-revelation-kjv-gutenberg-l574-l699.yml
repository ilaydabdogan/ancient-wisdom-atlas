- id: ev:6
  type: summary
  locator: 66:008:003-004
  quote_or_summary: An angel with a golden censer offers incense with the prayers
    of saints on the golden altar, and the smoke ascends before God.
  source_text_path: texts/public-domain/biblical/project-gutenberg/revelation-kjv.md
  rights_note: Public domain King James Version text from Project Gutenberg metadata
    supplied in request.
- id: ev:7
  type: summary
  locator: 66:008:005
  quote_or_summary: The angel fills the censer with fire from the altar and casts
    it into the earth, followed by voices, thunderings, lightnings, and an earthquake.
  source_text_path: texts/public-domain/biblical/project-gutenberg/revelation-kjv.md
  rights_note: Public domain King James Version text from Project Gutenberg metadata
    supplied in request.
- id: ev:8
  type: summary
  locator: 66:008:007
  quote_or_summary: The first trumpet brings hail and fire mingled with blood cast
    on earth; a third of trees and all green grass burn up.
  source_text_path: texts/public-domain/biblical/project-gutenberg/revelation-kjv.md
  rights_note: Public domain King James Version text from Project Gutenberg metadata
    supplied in request.
- id: ev:9
  type: summary
  locator: 66:008:008-009
  quote_or_summary: The second trumpet brings something like a great burning mountain
    cast into the sea; a third of the sea becomes blood, sea creatures die, and ships
    are destroyed.
  source_text_path: texts/public-domain/biblical/project-gutenberg/revelation-kjv.md
  rights_note: Public domain King James Version text from Project Gutenberg metadata
    supplied in request.
- id: ev:10
  type: summary
  locator: 66:008:010-011
  quote_or_summary: The third trumpet brings a great burning star called Wormwood
    falling on rivers and fountains; a third of waters become bitter and many people
    die.
  source_text_path: texts/public-domain/biblical/project-gutenberg/revelation-kjv.md
  rights_note: Public domain King James Version text from Project Gutenberg metadata
    supplied in request.
- id: ev:11
  type: summary
  locator: 66:008:012
  quote_or_summary: The fourth trumpet darkens a third of the sun, moon, and stars,
    and a third of day and night light is absent.
  source_text_path: texts/public-domain/biblical/project-gutenberg/revelation-kjv.md
  rights_note: Public domain King James Version text from Project Gutenberg metadata
    supplied in request.
- id: ev:12
  type: summary
  locator: 66:008:013
  quote_or_summary: A flying angel announces three woes for earth's inhabitants because
    of the remaining trumpet voices.
  source_text_path: texts/public-domain/biblical/project-gutenberg/revelation-kjv.md
  rights_note: Public domain King James Version text from Project Gutenberg metadata
    supplied in request.
- id: ev:13
  type: summary
  locator: 66:009:001-002
  quote_or_summary: The fifth trumpet sounds; a star falls from heaven, receives the
    key to the bottomless pit, opens it, and smoke from the pit darkens sun and air.
  source_text_path: texts/public-domain/biblical/project-gutenberg/revelation-kjv.md
  rights_note: Public domain King James Version text from Project Gutenberg metadata
    supplied in request.
- id: ev:14
  type: summary
  locator: 66:009:003-006
  quote_or_summary: Locusts come from the smoke with scorpion-like power and are commanded
    to torment people without God's seal for five months, not harming vegetation and
    not killing their targets.
  source_text_path: texts/public-domain/biblical/project-gutenberg/revelation-kjv.md
  rights_note: Public domain King James Version text from Project Gutenberg metadata
    supplied in request.
- id: ev:15
  type: summary
  locator: 66:009:007-010
  quote_or_summary: The locusts are likened to battle horses with crown-like heads,
    human faces, women's hair, lion teeth, iron breastplates, wings sounding like
    chariots, and scorpion-like tails with stings.
  source_text_path: texts/public-domain/biblical/project-gutenberg/revelation-kjv.md
  rights_note: Public domain King James Version text from Project Gutenberg metadata
    supplied in request.
- id: ev:16
  type: summary
  locator: 66:009:011-012
  quote_or_summary: The locusts have as king the angel of the bottomless pit, named
    Abaddon in Hebrew and Apollyon in Greek; the first woe is past.
  source_text_path: texts/public-domain/biblical/project-gutenberg/revelation-kjv.md
  rights_note: Public domain King James Version text from Project Gutenberg metadata
    supplied in request.
- id: ev:17
  type: summary
  locator: 66:009:013-014
  quote_or_summary: At the sixth trumpet, a voice from the four horns of the golden
    altar before God commands the sixth angel to release the four angels bound in
    the great river Euphrates.
  source_text_path: texts/public-domain/biblical/project-gutenberg/revelation-kjv.md
  rights_note: Public domain King James Version text from Project Gutenberg metadata
    supplied in request.
- id: ev:18
  type: summary
  locator: 66:009:015-016
  quote_or_summary: The four angels are released for an appointed hour, day, month,
    and year to slay a third of humanity; the horsemen army is numbered two hundred
    thousand thousand.
  source_text_path: texts/public-domain/biblical/project-gutenberg/revelation-kjv.md
  rights_note: Public domain King James Version text from Project Gutenberg metadata
    supplied in request.
