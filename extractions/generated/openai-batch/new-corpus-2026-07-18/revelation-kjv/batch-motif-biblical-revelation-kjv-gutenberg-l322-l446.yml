candidate_motifs:
- id: motif:1
  label: Divine rebuke of lukewarmness and call to repentance
  taxonomy_refs:
  - divine_judgment
  basis: The speaker rejects the lukewarm state, states that loved ones are rebuked
    and chastened, and commands zeal and repentance.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The passage emphasizes rebuke and correction; final judgment is not narrated
    in this excerpt.
- id: motif:2
  label: Threshold invitation and shared meal
  taxonomy_refs:
  - sacred_exchange
  basis: The speaker stands at the door and knocks; if anyone hears and opens, the
    speaker will come in and dine with that person, and the person with him.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The taxonomy fit is based on reciprocal hospitality language; the passage
    does not explicitly call it an exchange.
- id: motif:3
  label: Victory rewarded with throne-sharing
  taxonomy_refs:
  - royal_legitimacy
  - divine_parent_child
  basis: The overcomer is promised a seat with the speaker in his throne, paralleling
    the speaker's having overcome and sat with his Father in his throne.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The divine parent-child element is limited to the speaker's reference
    to his Father.
- id: motif:4
  label: Visionary ascent through an opened heaven
  taxonomy_refs:
  - ascent
  basis: A door is opened in heaven, a trumpet-like voice commands the narrator to
    come up, and the narrator immediately enters the spirit and sees a heavenly throne.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The movement is visionary and spiritual rather than described as bodily
    travel.
- id: motif:5
  label: Heavenly throne court as ordered center
  taxonomy_refs:
  - world_center
  basis: The throne is spatially central to elders, living creatures, lamps, a glassy
    sea, angelic hosts, and universal praise.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  - ev:12
  confidence: medium
  cautions: The term world center is not used in the passage; the classification rests
    on the scene's spatial and liturgical organization around the throne.
- id: motif:6
  label: Sealed book opened only by a worthy figure
  taxonomy_refs: []
  basis: The seven-sealed book cannot be opened or even looked upon by anyone in heaven,
    earth, or under earth until the elder announces the figure who has prevailed,
    and the Lamb takes the book.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: No provided taxonomy family exactly names the sealed-book motif.
- id: motif:7
  label: Slain Lamb whose blood redeems
  taxonomy_refs:
  - sacrifice
  basis: The Lamb is described as slain and is praised as worthy because he was slain
    and redeemed people to God by blood.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage presents the Lamb standing after being slain, but it does
    not narrate the death event itself in this excerpt.
- id: motif:8
  label: Universal cosmic praise
  taxonomy_refs: []
  basis: Angels in vast number and every creature in heaven, on earth, under earth,
    and in the sea praise the enthroned one and the Lamb.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: No specific provided motif-family taxonomy ref is assigned.
