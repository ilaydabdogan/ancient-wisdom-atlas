canonical_text:
  quote: ''
  summary: The passage moves from an admonition to a lukewarm addressee through a
    visionary summons into heaven. The seer beholds a heavenly throne, elders, living
    creatures, lamps, a glassy sea, worship, a sealed book, and a Lamb described as
    slain who is found worthy to take and open the book, after which heavenly and
    cosmic praise is offered.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A first-person speaker says the addressed party is neither cold nor hot, but
    lukewarm, and says he will spue the addressed party out of his mouth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says the addressed party claims to be rich and in need of nothing,
    but is actually wretched, miserable, poor, blind, and naked; the speaker counsels
    purchase of gold tried in fire, white raiment, and eyesalve.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says he rebukes and chastens those he loves, calls for zeal and
    repentance, and describes himself as standing at a door, knocking, and offering
    to eat with anyone who opens.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker promises that the one who overcomes may sit with him in his throne,
    as he overcame and sat with his Father in his throne; the passage also says to
    hear what the Spirit says to the churches.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The visionary narrator sees an opened door in heaven, hears a trumpet-like
    voice say to come up, is immediately in the spirit, and sees a throne in heaven
    with one seated on it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The enthroned figure is described by gemstone likenesses, and a rainbow like
    an emerald is around the throne.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Around the throne are twenty-four seats with twenty-four elders in white raiment
    and gold crowns; from the throne proceed lightnings, thunderings, and voices;
    seven lamps of fire burn before the throne; a glassy crystal-like sea is before
    the throne; four beasts full of eyes are around the throne.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The four beasts are described as lion-like, calf-like, human-faced, and flying-eagle-like;
    each has six wings and many eyes, and they do not rest day or night while praising
    the Lord God Almighty.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the beasts give glory, honour, and thanks to the enthroned one, the twenty-four
    elders fall down, worship, cast their crowns before the throne, and speak of the
    Lord as creator of all things.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The enthroned one holds a book written within and on the backside and sealed
    with seven seals; a strong angel asks who is worthy to open it; no one in heaven,
    earth, or under earth is able, and the visionary narrator weeps.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: One elder tells the narrator not to weep and says the Lion of the tribe of
    Juda, the Root of David, has prevailed to open the book and loose its seven seals.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The narrator sees a Lamb as if it had been slain, standing amid the throne,
    beasts, and elders, with seven horns and seven eyes; the eyes are identified as
    the seven Spirits of God sent into all the earth, and the Lamb takes the book
    from the enthroned one's right hand.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: After the Lamb takes the book, the four beasts and twenty-four elders fall
    before the Lamb with harps and golden vials of odours, identified as the prayers
    of saints, and sing that the slain Lamb redeemed people by blood and made them
    kings and priests.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Many angels around the throne, beasts, and elders, and every creature in heaven,
    on earth, under earth, and in the sea, speak praise to the enthroned one and to
    the Lamb.
  category: speech
  evidence_refs:
  - ev:12
