candidate_motifs:
- id: motif:1
  label: Divine judgment on a corrupt city
  taxonomy_refs:
  - divine_judgment
  basis: Babylon is judged, burned, desolated, thrown down, and charged with deception
    and bloodshed; heavenly voices praise God's righteous judgment.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage names Babylon and its charges internally; no external historical
    identification is inferred here.
- id: motif:2
  label: Angelic symbolic act of destruction
  taxonomy_refs:
  - divine_judgment
  basis: A mighty angel casts a millstone-like stone into the sea and declares that
    Babylon will be violently thrown down and found no more.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The millstone action is treated only as a passage-internal sign of downfall.
- id: motif:3
  label: Heavenly liturgy after judgment
  taxonomy_refs:
  - divine_judgment
  basis: Heavenly multitude, elders, and beasts praise God with Alleluia after the
    judgment of the great whore and vengeance for servants' blood.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Classified by function in the passage rather than by comparison to an
    external liturgical tradition.
- id: motif:4
  label: Sacred marriage and marriage supper
  taxonomy_refs:
  - sacred_marriage
  basis: The passage announces the marriage of the Lamb, the readiness of his wife,
    her white linen, and the blessing of those called to the marriage supper.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage itself identifies the linen symbolically as the righteousness
    of saints; further ecclesial interpretation is not added.
- id: motif:5
  label: Rejected worship of a messenger
  taxonomy_refs: []
  basis: The seer attempts to worship the angel, but the angel refuses and directs
    worship to God.
  evidence_refs:
  - ev:7
