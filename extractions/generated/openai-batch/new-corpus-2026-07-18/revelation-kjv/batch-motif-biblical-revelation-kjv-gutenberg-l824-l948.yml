  quote: ''
  summary: The passage describes the seventh angel’s sounding, heavenly proclamation
    of divine reign and judgment, the heavenly temple and ark, a celestial woman giving
    birth while threatened by a dragon, war in heaven and the dragon’s expulsion,
    the woman’s wilderness flight and rescue from a flood, and the rise of a dragon-empowered
    beast from the sea who receives worship, blasphemes, and makes war on the saints.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The seventh angel sounds, and voices in heaven announce that the world’s kingdoms
    have become the kingdoms of the Lord and of his Christ, who will reign forever.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Twenty-four elders fall on their faces, worship God, and give thanks because
    God has taken great power and reigned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A heavenly speech states that wrath, judgment of the dead, reward for servants
    and saints, and destruction of those who destroy the earth have come.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The temple of God is opened in heaven, the ark of his testament is seen, and
    lightning, voices, thunder, earthquake, and hail occur.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A woman appears in heaven clothed with the sun, with the moon under her feet
    and a crown of twelve stars, and she cries out in labor.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A great red dragon with seven heads, ten horns, and seven crowns appears;
    its tail casts a third of the stars to earth, and it stands ready to devour the
    woman’s child.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The woman gives birth to a male child destined to rule all nations with a
    rod of iron, and the child is caught up to God and to his throne.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The woman flees into a wilderness place prepared by God, where she is to be
    fed for one thousand two hundred sixty days.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Michael and his angels fight the dragon and its angels in heaven; the dragon
    does not prevail and is cast to earth with its angels.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The dragon is identified as the old serpent, the Devil, Satan, and the deceiver
    of the whole world.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A heavenly voice announces salvation, strength, the kingdom of God, and the
    power of Christ because the accuser has been cast down.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The brethren overcome the accuser by the blood of the Lamb and by the word
