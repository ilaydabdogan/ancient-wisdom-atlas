candidate_motifs:
- id: motif:1
  label: heavenly enthronement and divine judgment
  taxonomy_refs:
  - divine_judgment
  basis: The passage announces the Lord’s reign, wrath, judgment of the dead, reward
    of servants and saints, and destruction of those who destroy the earth.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage frames judgment in apocalyptic proclamation rather than narrating
    the full judgment scene.
- id: motif:2
  label: ark or covenant object revealed in heaven
  taxonomy_refs:
  - ark_vessel
  - covenant
  basis: The opened heavenly temple reveals the ark of his testament.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The ark is seen as a heavenly temple object; the passage does not narrate
    an ark voyage or transport episode.
- id: motif:3
  label: celestial birth of an endangered ruler-child
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: A celestial woman labors and gives birth while a dragon waits to devour the
    child; the child is destined to rule all nations.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not state the child’s father or describe ordinary birth
    details.
- id: motif:4
  label: ascent of the newborn to divine throne
  taxonomy_refs:
  - ascent
  basis: The male child is caught up to God and to his throne immediately after birth.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The text uses passive divine removal language; it is not described as
    a voluntary journey.
- id: motif:5
  label: serpent-dragon adversary
  taxonomy_refs:
  - serpent
  - chaos
  basis: The dragon is explicitly called the old serpent, Devil, Satan, deceiver,
    and accuser, and it threatens the child, fights in heaven, persecutes the woman,
    emits a flood, and makes war on her remnant.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The chaos classification is based on the dragon’s cosmic conflict and
    flood actions; the passage’s own names are Devil, Satan, serpent, deceiver, and
    accuser.
- id: motif:6
  label: heavenly combat and expulsion of adversary
  taxonomy_refs:
  - chaos
  basis: Michael and his angels wage war against the dragon and its angels, who lose
    their heavenly place and are cast to earth.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The combat is celestial and angelic; no creation battle is narrated in
    this excerpt.
- id: motif:7
  label: wilderness refuge with divine nourishment
  taxonomy_refs:
  - departure
  basis: The woman flees to a wilderness place prepared by God, where she is fed and
    later nourished away from the serpent.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: medium
  cautions: The departure is a flight from persecution rather than a quest departure.
- id: motif:8
  label: flood attack and earth-aided rescue
  taxonomy_refs:
  - flood_and_renewal
  basis: The serpent casts water as a flood after the woman, and the earth helps by
    swallowing the flood.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: This is a localized flood weapon and rescue, not a world flood or explicit
    renewal narrative.
- id: motif:9
  label: dragon-empowered beast from the sea
  taxonomy_refs:
  - chaos
  basis: A beast rises from the sea with monstrous composite features and receives
    power, seat, and authority from the dragon.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The chaos association is inferential from sea emergence, monstrosity,
    and dragon empowerment; the passage primarily presents political-religious authority
    and blasphemy.
- id: motif:10
  label: deadly wound healed
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: One of the beast’s heads appears wounded to death, its deadly wound is healed,
    and the world wonders after the beast.
  evidence_refs:
