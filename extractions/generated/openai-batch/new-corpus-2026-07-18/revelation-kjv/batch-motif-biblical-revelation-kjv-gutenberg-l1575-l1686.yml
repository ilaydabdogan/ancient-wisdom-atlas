  summary: The passage describes the adorned holy city, its pearl gates, gold street,
    lack of temple, divine light, open gates, purified entry, river and tree of life,
    throne of God and the Lamb, and servants who see God’s face and reign. It then
    presents angelic and divine testimony, a refusal of angel worship, commands about
    the prophecy, declarations of imminent coming and reward, invitations to take
    the water of life, warnings against altering the prophecy, and a closing blessing.
