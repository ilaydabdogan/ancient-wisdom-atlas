candidate_motifs:
- id: motif:1
  label: jeweled luminous holy city with purified entry
  taxonomy_refs:
  - world_center
  basis: The city is richly adorned, contains divine temple-presence and throne-linked
    life symbols, needs no external light, receives nations and kings, and excludes
    defilement and falsehood.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage does not explicitly call the city a world center; the taxonomy
    link is based on the concentration of throne, river, tree, light, and gates in
    one sacred city.
- id: motif:2
  label: tree of life with recurring fruit and healing leaves
  taxonomy_refs:
  - sacred_tree_axis
  basis: The tree of life is placed by the river and street, bears twelve fruits monthly,
    heals the nations, and is accessed by commandment-keepers.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage explicitly names the tree of life, but an axis function is
    not directly stated.
- id: motif:3
  label: water of life from divine throne freely offered
  taxonomy_refs: []
  basis: The river of water of life flows from the throne of God and the Lamb, and
    the thirsty and willing are invited to take the water of life freely.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: No more specific available motif-family reference is applied beyond the
    literal water symbol.
- id: motif:4
  label: divine judgment through reward, exclusion, and loss from life-book and city
  taxonomy_refs:
  - divine_judgment
  basis: The passage links recompense to works, limits entry to those in the Lamb’s
    book of life and commandment-keepers, excludes named wrongdoers, and warns of
    plagues or loss for altering the prophecy.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage combines judgment language with city-entry rules and textual
    warnings; these are treated together as one candidate motif.
- id: motif:5
  label: divine illumination replacing cosmic lights
  taxonomy_refs: []
  basis: The city needs no sun, moon, or candle, because God gives light and the Lamb
    is its light; there is no night.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No available taxonomy reference precisely matches this image.
- id: motif:6
  label: unsealed urgent prophecy guarded by penalties
  taxonomy_refs:
  - divine_judgment
  basis: The angel commands that the prophecy not be sealed because the time is near,
    and the closing warning attaches plagues or loss from the book of life and city
    to adding or removing words.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: medium
  cautions: 'The motif combines two related passage elements: unsealing because of
    urgency and punitive protection of the prophecy.'
- id: motif:7
  label: imminent divine return with reward
  taxonomy_refs:
  - return
  basis: The speaker repeatedly says he comes quickly and brings reward to give each
    person according to work; the closing response asks Lord Jesus to come.
  evidence_refs:
