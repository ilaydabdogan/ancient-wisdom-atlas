  summary: The passage describes destructive visionary horses, human non-repentance,
    a mighty angel with an open book and sealed thunder-utterances, the eating of
    the book and renewed prophecy, the measuring of the temple, the ministry and death
    of two witnesses, their revival and ascent, and an earthquake that kills many
    in the city.
