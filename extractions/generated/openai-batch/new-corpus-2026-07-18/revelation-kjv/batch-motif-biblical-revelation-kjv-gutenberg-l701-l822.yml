literal_observations:
- id: obs:1
  text: Horses and their riders appear in the vision with fiery, jacinth, and brimstone-colored
    breastplates; the horses have lion-like heads and mouths issuing fire, smoke,
    and brimstone.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fire, smoke, and brimstone from the horses' mouths kill a third part of men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The horses' power is in their mouths and tails; their tails are like serpents,
    have heads, and hurt with them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The people not killed by the plagues do not repent of idol worship or of murders,
    sorceries, fornication, and thefts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A mighty angel descends from heaven clothed with a cloud, with a rainbow on
    his head, a sun-like face, fiery-pillar feet, and an open little book in his hand.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mighty angel sets his right foot on the sea and left foot on the earth
    and cries loudly; seven thunders then utter their voices.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator is told by a voice from heaven to seal up what the seven thunders
    uttered and not write it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The angel standing on sea and earth lifts his hand to heaven and swears by
    the eternal creator that there should be time no longer and that God's mystery
    would be finished in the days of the seventh angel's voice.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The narrator is instructed to take and eat the little open book; it is sweet
    in his mouth and bitter in his belly, and he is told he must prophesy again before
    many peoples, nations, tongues, and kings.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A reed like a rod is given to the narrator, who is told to measure the temple
    of God, the altar, and the worshipers, but to leave out the outer court because
    it is given to the Gentiles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The holy city is to be trampled forty-two months, and two witnesses are to
    prophesy 1260 days clothed in sackcloth.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: The two witnesses are identified as the two olive trees and the two candlesticks
    standing before the God of the earth.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The two witnesses have fire proceeding from their mouths to devour enemies,
    power to shut heaven from rain, power to turn waters to blood, and power to smite
    the earth with plagues.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the witnesses finish their testimony, a beast ascending from the bottomless
    pit makes war against them, overcomes them, and kills them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The witnesses' dead bodies lie unburied in the street of the great city, which
