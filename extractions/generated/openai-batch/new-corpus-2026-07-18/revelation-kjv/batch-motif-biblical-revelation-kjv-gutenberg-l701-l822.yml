candidate_motifs:
- id: motif:1
  label: destructive plague as divine judgment
  taxonomy_refs:
  - divine_judgment
  basis: The passage presents fire, smoke, and brimstone as plagues killing a third
    of men; later an earthquake kills seven thousand and the remnant gives glory to
    God.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:11
  confidence: high
  cautions: The passage names plagues and woes, but the extraction does not infer
    a full theological explanation beyond the immediate text.
- id: motif:2
  label: serpent-tailed hybrid plague creatures
  taxonomy_refs:
  - serpent
  basis: The horses' tails are described as like serpents, with heads, and as instruments
    of harm.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The wording is simile-like; the passage does not say the horses are themselves
    serpents.
- id: motif:3
  label: sealed revelation and withheld writing
  taxonomy_refs:
  - forbidden_knowledge
  basis: The seven thunders utter voices, but the narrator is commanded to seal up
    their words and not write them.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage supports hidden or restricted revelation; it does not explicitly
    describe the knowledge as forbidden to all beings.
- id: motif:4
  label: ingested book and prophetic recommissioning
  taxonomy_refs: []
  basis: The narrator takes and eats an open little book that is sweet in the mouth
    and bitter in the belly, then is told to prophesy again before many peoples, nations,
    tongues, and kings.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No exact supplied taxonomy family matches this motif, so no taxonomy reference
    is assigned.
- id: motif:5
  label: measuring sacred space and excluding an outer zone
  taxonomy_refs: []
  basis: The narrator measures the temple, altar, and worshipers with a reed but leaves
    out the outer court because it is given to Gentiles.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage provides the measurement action and boundary distinction but
    does not explain their symbolic meaning.
- id: motif:6
  label: paired witnesses as sacred trees and lamps
  taxonomy_refs: []
  basis: The two witnesses are explicitly identified as two olive trees and two candlesticks
    standing before the God of the earth.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not state that the pair are siblings, twins, or spouses;
    related taxonomy refs for such relations are not applied.
- id: motif:7
  label: prophetic control of fire, drought, water, and plagues
  taxonomy_refs:
  - divine_judgment
  basis: The witnesses can devour enemies by fire, shut heaven so it does not rain,
    turn waters to blood, and strike the earth with plagues.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The text attributes these powers to the witnesses without explaining the
    mechanism beyond granted power.
- id: motif:8
  label: abyssal beast overcomes holy witnesses
  taxonomy_refs: []
  basis: A beast ascends from the bottomless pit, makes war on the witnesses, overcomes
    them, and kills them after their testimony is finished.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No supplied taxonomy ref exactly captures the bottomless-pit beast adversary
    pattern without adding interpretation.
- id: motif:9
  label: slain witnesses revive and ascend to heaven
  taxonomy_refs:
  - resurrection
  - ascent
  - death_rebirth
  basis: The witnesses are killed, lie dead for three and a half days, receive the
    spirit of life from God, stand, and ascend to heaven in a cloud.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage describes revival and ascent directly; broader death-rebirth
    classification remains a motif-level abstraction.
- id: motif:10
  label: earthquake judgment following heavenly ascent
