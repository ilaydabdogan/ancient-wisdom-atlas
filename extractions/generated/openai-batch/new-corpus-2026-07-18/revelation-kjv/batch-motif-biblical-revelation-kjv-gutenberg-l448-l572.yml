candidate_motifs:
- id: motif:1
  label: Sequential opening of sealed judgments
  taxonomy_refs:
  - divine_judgment
  basis: The Lamb opens seals, and each opening produces a new vision involving conquest,
    violence, scarcity, death, slain petitioners, or cosmic upheaval.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage does not explicitly name the seals as judgments until the
    language of judging, avenging, and wrath appears in the fifth and sixth seal material.
- id: motif:2
  label: Four mounted calamity figures
  taxonomy_refs:
  - divine_judgment
  basis: The first four seals reveal four horses and riders associated respectively
    with conquering, removal of peace, measured food scarcity, and Death with Hell.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage gives distinct powers and objects but does not supply a collective
    title for the four riders.
- id: motif:3
  label: Slain witnesses awaiting vindication
  taxonomy_refs:
  - divine_judgment
  basis: Souls slain for the word of God and their testimony cry out asking when their
    blood will be judged and avenged, then receive robes and are told to wait.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage contains petition and delay, not the completed act of vengeance
    within this range.
- id: motif:4
  label: Cosmic dissolution at the day of wrath
  taxonomy_refs:
  - chaos
  - divine_judgment
  basis: The sixth seal features earthquake, darkened sun, blood-like moon, falling
    stars, rolled heaven, and displaced mountains and islands, followed by fear of
    the great day of wrath.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The taxonomy reference to chaos is based on cosmic disorder in the passage,
    while the passage itself frames the event as wrath.
- id: motif:5
  label: Protective sealing before harm
  taxonomy_refs: []
  basis: An angel with the seal of the living God commands that earth, sea, and trees
    not be hurt until God's servants are sealed in their foreheads; the sealed are
    then numbered.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: No specific taxonomy family supplied matches this motif exactly without
    adding interpretation.
- id: motif:6
  label: Universal multitude in heavenly worship
  taxonomy_refs: []
  basis: An unnumbered multitude from all nations stands before the throne and Lamb
    with white robes and palms and cries out salvation, followed by angelic worship.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage presents the scene of worship but does not yet explain the
    multitude's origin within the provided range.
