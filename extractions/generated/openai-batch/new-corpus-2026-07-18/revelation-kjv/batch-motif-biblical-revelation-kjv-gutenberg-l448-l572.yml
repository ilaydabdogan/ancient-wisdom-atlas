canonical_text:
  quote: ''
  summary: The passage moves from heavenly worship into the opening of six seals by
    the Lamb. The first four seals reveal four horses and riders associated with conquest,
    violence, scarcity, and death. The fifth seal reveals slain souls under the altar
    petitioning for judgment. The sixth seal brings cosmic upheaval and fear among
    the people of the earth. Four angels then restrain the winds until servants of
    God are sealed, followed by the numbering of 144,000 from the tribes of Israel
    and the appearance of an unnumbered white-robed multitude worshipping before God
    and the Lamb.
  language: English
  quote_policy: summarized
