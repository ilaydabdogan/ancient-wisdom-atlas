comparison_claims:
- id: claim:1
  claim: The passage itself compares the condemned teaching at Pergamos to Balaam
    teaching Balac to place a stumblingblock before the children of Israel, especially
    in relation to idol-sacrifice food and fornication.
  claim_level: same_function
  target: Balaam-Balac stumblingblock pattern within biblical tradition
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: Only the comparison supplied in this passage is used; no outside Balaam
    narrative details are added.
- id: claim:2
  claim: The Thyatira message uses the name Jezebel for a woman who calls herself
    a prophetess and leads servants into fornication and idol-sacrifice food, making
    her function within this passage parallel to the condemned teacher pattern used
    for Balaam.
  claim_level: same_function
  target: Condemned prophetic teacher leading to idolatrous or sexual transgression
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not explicitly explain whether Jezebel is a personal
    name, title, or typological reference.
- id: claim:3
  claim: The phrase key of David links the Philadelphia speaker's authority to open
    and shut with a Davidic access-control pattern within the passage's own wording.
  claim_level: same_function
  target: Davidic key and open-door authority pattern
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage names David and describes opening and shutting, but does
    not quote or narrate another Davidic source.
