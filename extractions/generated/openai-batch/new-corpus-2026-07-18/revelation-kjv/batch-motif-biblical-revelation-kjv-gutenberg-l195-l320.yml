candidate_motifs:
- id: motif:1
  label: Divine judgment according to works
  taxonomy_refs:
  - divine_judgment
  basis: Across the messages, the speaker commands repentance, threatens combat, tribulation,
    death, or sudden arrival, says he searches hearts, and promises to give to each
    according to works.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents judgment within direct ecclesial address rather than
    a full narrative trial scene.
- id: motif:2
  label: Overcoming rewarded with sacred gifts and status
  taxonomy_refs:
  - sacred_exchange
  basis: Those who overcome or hold fast are promised hidden manna, a white stone
    and new name, authority, the morning star, white raiment, preservation in the
    book of life, a crown, pillar status, and written divine names.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The exchange structure is explicit as promise-for-overcoming, but the
    taxonomy label is broader than the passage's specific wording.
