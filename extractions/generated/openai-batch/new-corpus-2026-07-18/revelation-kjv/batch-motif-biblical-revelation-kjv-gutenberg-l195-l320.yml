canonical_text:
  quote: ''
  summary: A sequence of messages is directed to the angels of the churches in Pergamos,
    Thyatira, Sardis, Philadelphia, and the opening of Laodicea. The speaker identifies
    himself through images such as a sharp two-edged sword, fiery eyes, brass-like
    feet, seven Spirits and stars, the key of David, and faithful witness. The messages
    praise endurance, rebuke false teaching and impurity, command repentance and watchfulness,
    threaten judgment, and promise rewards to those who overcome, including hidden
    manna, a white stone with a new name, authority over nations, the morning star,
    white raiment, preservation in the book of life, an open door, a crown, and being
    made a pillar in God's temple with divine names written upon him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The message to Pergamos is addressed to the angel of that church and is spoken
    by one described as having a sharp sword with two edges.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Pergamos community is said to dwell where Satan's seat is and where Satan
    dwells, yet it has held fast the speaker's name and faith, including during the
    killing of Antipas.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Pergamos community is rebuked for having people who hold the doctrine
    of Balaam and the doctrine of the Nicolaitanes; it is commanded to repent and
    threatened with combat by the sword of the speaker's mouth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The one who overcomes in the Pergamos message is promised hidden manna, a
    white stone, and a new name written in the stone known only to the receiver.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: The message to Thyatira identifies the speaker as the Son of God, with eyes
    like a flame of fire and feet like fine brass.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Thyatira community is praised for works, charity, service, faith, and
    patience, but rebuked for tolerating a woman called Jezebel who calls herself
    a prophetess and teaches servants to commit fornication and eat things sacrificed
    to idols.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Jezebel is said to have been given time to repent but not to have repented;
    she, those committing adultery with her, and her children are threatened with
    bed, tribulation, and death unless there is repentance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The speaker says he searches reins and hearts and will give to each according
    to works; those in Thyatira who overcome and keep his works are promised power
    over nations, rule with a rod of iron, and the morning star.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: The Sardis community is told it has a name that it lives but is dead; it is
    commanded to be watchful, strengthen what remains, remember, hold fast, and repent.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: If Sardis does not watch, the speaker says he will come like a thief at an
    unknown hour.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: A few in Sardis are described as not having defiled their garments and as
    walking with the speaker in white; the overcomer is promised white raiment, preservation
    of his name in the book of life, and confession before the Father and angels.
  category: object
  evidence_refs:
  - ev:3
- id: obs:12
  text: The Philadelphia message identifies the speaker as holy and true, having the
    key of David, opening what no one shuts and shutting what no one opens.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: Philadelphia is told that an open door has been set before it, that it has
    little strength, has kept the speaker's word, and has not denied his name.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:14
  text: Those called the synagogue of Satan, who say they are Jews and are not, are
    said to be made to come and worship before Philadelphia's feet and know that the
    speaker has loved it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: Philadelphia is promised preservation from an hour of temptation that will
    come upon all the world to try those dwelling on the earth, and is told to hold
    fast so no one takes its crown.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:16
  text: The overcomer in the Philadelphia message is promised to be made a pillar
    in the temple of God, to go out no more, and to have written upon him the name
    of God, the name of new Jerusalem, and the speaker's new name.
  category: object
  evidence_refs:
  - ev:4
- id: obs:17
  text: The repeated formula says that whoever has an ear should hear what the Spirit
    says to the churches.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
- id: obs:18
  text: The opening of the Laodicean message addresses the angel of the church of
    the Laodiceans and identifies the speaker as the Amen, the faithful and true witness,
    and the beginning of the creation of God.
  category: speech
  evidence_refs:
  - ev:5
