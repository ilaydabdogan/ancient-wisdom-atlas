candidate_motifs:
- id: motif:1
  label: Sevenfold divine plague judgment
  taxonomy_refs:
  - divine_judgment
  basis: The passage centers on seven angels with seven last plagues and seven vials
    of God's wrath poured upon earth, sea, waters, sun, the beast's seat, Euphrates,
    and air.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: This identifies the passage's explicit judgment pattern without inferring
    sources outside the passage.
- id: motif:2
  label: Victors praising divine judgment on a fiery glass sea
  taxonomy_refs:
  - divine_judgment
  basis: Victors over the beast stand on a sea of glass mingled with fire, hold harps,
    and sing that God's works are great and his judgments manifest.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The exact symbolic meaning of the glassy fiery sea is not explained in
    the passage.
- id: motif:3
  label: Blood-for-blood retributive judgment
  taxonomy_refs:
  - divine_judgment
  basis: Waters become blood, and the angelic speech says that those who shed the
    blood of saints and prophets have been given blood to drink.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage states the retributive rationale, but does not name a broader
    legal or ritual category.
- id: motif:4
  label: Cosmic scorching by fire and heat
  taxonomy_refs:
  - world_destroying_fire
  - divine_judgment
  basis: The fourth vial is poured on the sun, which is given power to scorch people
    with fire and great heat.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The scene is a plague of scorching heat; the passage does not say that
    the world is destroyed solely by fire.
- id: motif:5
  label: Dried sacred river as preparation for hostile kings
  taxonomy_refs:
  - divine_judgment
  basis: The sixth vial dries the Euphrates so that the way of the kings of the east
    may be prepared.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage does not explain the river's wider symbolic status beyond
    its role in preparing a way.
- id: motif:6
  label: Unclean spirits gather rulers for final battle
  taxonomy_refs:
  - chaos
  - divine_judgment
  basis: Three unclean spirits like frogs, called spirits of devils working miracles,
    go out to gather kings of the world to battle on the great day of God Almighty
    at Armageddon.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage supports the gathering-to-battle pattern; details of the battle
    itself are not narrated in this excerpt.
- id: motif:7
  label: Collapse of city and landscape under divine wrath
  taxonomy_refs:
  - chaos
  - divine_judgment
  basis: After the seventh vial, a massive earthquake divides the great city, cities
    fall, Babylon receives wrath, islands flee, mountains vanish, and hail falls from
    heaven.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage depicts severe cosmic and urban upheaval but does not provide
