canonical_text:
  quote: ''
  summary: A heavenly vision introduces seven angels with the seven last plagues,
    victorious worshipers on a glassy sea, the opening of the heavenly temple, and
    the pouring out of seven vials of divine wrath. The vial judgments affect earth,
    sea, rivers, sun, the beast's seat, the Euphrates, and the air, leading to disease,
    bloodied waters, scorching heat, darkness, gathered kings at Armageddon, earthquake,
    hail, and the remembrance of Babylon. The passage ends with an angelic invitation
    to see the judgment of a woman seated on many waters and on a scarlet beast in
    the wilderness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The speaker sees a great and marvellous sign in heaven: seven angels have
    the seven last plagues, in which the wrath of God is filled up.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Victors over the beast, its image, mark, and name-number stand on a sea of
    glass mingled with fire, hold harps of God, and sing the song of Moses and the
    song of the Lamb.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The heavenly temple of the tabernacle of testimony is opened; seven angels
    come out clothed in pure white linen and golden girdles.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: One of the four beasts gives seven golden vials full of the wrath of God to
    the seven angels.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The temple is filled with smoke from God's glory and power, and no one can
    enter it until the seven plagues are fulfilled.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A great voice from the temple commands the seven angels to pour out the vials
    of God's wrath upon the earth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first three vials produce grievous sores on beast-marked worshipers, turn
    the sea into blood with death in the sea, and turn rivers and fountains of waters
    into blood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The angel of the waters and another voice from the altar declare God's judgments
    righteous, connecting the blood given to drink with the shed blood of saints and
    prophets.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fourth vial gives the sun power to scorch men with fire; the fifth vial
    darkens the beast's kingdom, and the afflicted people blaspheme God and do not
    repent.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The sixth vial dries the Euphrates to prepare the way of eastern kings; three
    unclean frog-like spirits from the dragon, beast, and false prophet gather kings
    of the world to battle at Armageddon.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A warning voice says that the speaker comes as a thief and blesses the one
    who watches and keeps his garments.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The seventh vial is poured into the air; a voice from the temple and throne
    says, 'It is done,' followed by voices, thunder, lightning, a great earthquake,
    the division of the great city, the fall of cities, Babylon receiving wrath, disappearing
    islands and mountains, and great hail.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: One of the vial angels speaks to the visionary speaker, promises to show the
    judgment of the great whore who sits on many waters, and carries him in spirit
    into the wilderness, where he sees a woman on a scarlet beast.
  category: sequence
  evidence_refs:
  - ev:10
