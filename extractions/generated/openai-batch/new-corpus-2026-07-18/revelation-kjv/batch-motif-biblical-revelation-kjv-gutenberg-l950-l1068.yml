canonical_text:
  quote: ''
  summary: The passage describes an earth-rising beast that deceives earth-dwellers,
    enforces worship of the first beast and its image, and imposes a mark tied to
    commerce and the number 666. It then shows the Lamb with the redeemed on Mount
    Sion, angelic proclamations of gospel, judgment, Babylon's fall, and warning against
    beast-worship, followed by a blessing on the dead in the Lord and two harvest
    scenes culminating in the winepress of God's wrath and flowing blood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A saying states that one who leads into captivity shall go into captivity,
    and one who kills with the sword must be killed with the sword; this is linked
    with the patience and faith of the saints.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another beast is seen coming up out of the earth, with two horns like a lamb
    and speech like a dragon.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The earth beast exercises the power of the first beast and causes earth-dwellers
    to worship the first beast, whose deadly wound was healed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The earth beast performs wonders, including making fire come down from heaven
    to earth in the sight of people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The earth beast deceives earth-dwellers by miracles and tells them to make
    an image to the beast that had a sword-wound and lived.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The image of the beast is given life and speech, and causes those who do not
    worship it to be killed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: All social groups are caused to receive a mark in the right hand or forehead,
    and buying or selling is restricted to those with the mark, the beast's name,
    or the number of his name.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The number of the beast is presented as the number of a man and is given as
    six hundred threescore and six.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A Lamb stands on Mount Sion with one hundred forty-four thousand who have
    his Father's name written in their foreheads.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: A heavenly voice is compared to many waters and great thunder, harpers are
    heard, and a new song is sung before the throne, the four beasts, and the elders.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The one hundred forty-four thousand are described as redeemed from the earth,
    virgins, followers of the Lamb, firstfruits to God and the Lamb, without guile,
    and without fault before God's throne.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: An angel flying in mid-heaven has an everlasting gospel for all nations, kindreds,
    tongues, and peoples, and announces that the hour of judgment has come.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Another angel announces that Babylon, the great city, has fallen because she
    made all nations drink of the wine of the wrath of her fornication.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: A third angel warns that worshippers of the beast and its image, and receivers
    of its mark, will drink the wrath of God, be tormented with fire and brimstone,
    and have smoke of torment ascending forever with no rest.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: A voice from heaven declares blessed the dead who die in the Lord, saying
    they may rest from their labours and their works follow them.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: One like the Son of man sits on a white cloud, wearing a golden crown and
