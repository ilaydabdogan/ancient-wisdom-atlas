canonical_text:
  quote: ''
  summary: The passage opens Revelation as a disclosure given by God to Jesus Christ,
    mediated by an angel to John, and addressed to seven churches in Asia. John describes
    a visionary encounter on Patmos with a figure like the Son of man among seven
    golden candlesticks, holding seven stars, with fiery, watery, solar, and sword
    imagery. The figure identifies himself as the first and last, formerly dead and
    now alive forever, holding the keys of hell and death, and explains the seven
    stars and candlesticks as the angels and churches. The passage then gives messages
    to Ephesus and Smyrna, including calls to repentance or endurance and promises
    of the tree of life, crown of life, and safety from the second death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The revelation is described as given by God to Jesus Christ, signified by
    an angel to John, and concerned with things that must shortly come to pass.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: John is said to bear record of the word of God, the testimony of Jesus Christ,
    and the things he saw; readers and hearers of the prophecy are called blessed
    because the time is at hand.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: John addresses seven churches in Asia with grace and peace from a figure described
    as existing in past, present, and future, from seven Spirits before a throne,
    and from Jesus Christ.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jesus Christ is described as faithful witness, first begotten of the dead,
    prince of the kings of the earth, one who loved and washed people from sins in
    his blood, and one who made them kings and priests to God his Father.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage announces that he comes with clouds, that every eye will see him
    including those who pierced him, and that all kindreds of the earth will wail
    because of him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: John locates himself on Patmos because of the word of God and testimony of
    Jesus Christ; he says he was in the Spirit on the Lord's day and heard a great
    voice like a trumpet behind him.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The voice commands John to write what he sees in a book and send it to seven
    named churches in Asia: Ephesus, Smyrna, Pergamos, Thyatira, Sardis, Philadelphia,
    and Laodicea.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: When John turns, he sees seven golden candlesticks and, among them, one like
    unto the Son of man clothed in a long garment and golden girdle.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The figure among the candlesticks is described with white head and hair, eyes
    like a flame of fire, feet like fine brass burning in a furnace, a voice like
    many waters, seven stars in his right hand, a sharp two-edged sword coming from
    his mouth, and a face like the sun in strength.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: John falls at the figure's feet as dead; the figure lays his right hand on
    John and tells him not to fear.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The figure identifies himself as the first and the last, as one who lives,
    was dead, is alive forevermore, and has the keys of hell and death.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The figure instructs John to write what he has seen, what is, and what shall
    be hereafter.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage explains that the seven stars are the angels of the seven churches
    and the seven candlesticks are the seven churches.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The message to Ephesus commends works, labour, patience, resistance to evil,
    testing of false apostles, endurance for the speaker's name, and hatred of the
    deeds of the Nicolaitanes, but rebukes the church for leaving its first love.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The message to Ephesus commands remembrance, repentance, and first works,
    and warns that the candlestick will be removed from its place unless repentance
    occurs.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The message to the churches promises that the overcomer will be given to eat
    of the tree of life in the paradise of God.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: The message to Smyrna identifies the speaker as the first and last, formerly
    dead and alive; it acknowledges works, tribulation, poverty described as richness,
    and blasphemy by those called the synagogue of Satan.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:18
  text: The message to Smyrna says the devil will cast some into prison for testing,
    that they will have tribulation ten days, and commands faithfulness unto death
    with a promise of a crown of life.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:19
  text: The message to the churches promises that the overcomer will not be hurt by
    the second death.
  category: speech
  evidence_refs:
  - ev:10
