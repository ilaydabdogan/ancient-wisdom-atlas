candidate_motifs:
- id: motif:1
  label: Mediated apocalyptic revelation to a visionary witness
  taxonomy_refs:
  - wisdom
  basis: The passage describes a revelation given by God to Jesus Christ, mediated
    by an angel to John, who records what he sees and is commanded to write to the
    churches.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:6
  confidence: medium
  cautions: The available taxonomy has no exact 'apocalypse' or 'prophetic commission'
    category; 'wisdom' is only an approximate reference to disclosed divine knowledge.
- id: motif:2
  label: Resurrected divine figure with authority over death
  taxonomy_refs:
  - resurrection
  basis: Jesus Christ is called first begotten of the dead, and the visionary speaker
    says he was dead, is alive forevermore, and has the keys of hell and death.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:10
  confidence: high
  cautions: The passage states death and present life but does not narrate the resurrection
    event itself in this excerpt.
- id: motif:3
  label: Divine coming and judgmental response of the earth
  taxonomy_refs:
  - divine_judgment
  basis: The announced cloud-coming is visible to every eye, including those who pierced
    him, and all kindreds of the earth wail because of him.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage implies judgmental or fearful response through universal wailing
    but does not narrate a formal judgment scene in this excerpt.
- id: motif:4
  label: Visionary encounter with overwhelming radiant figure
  taxonomy_refs: []
  basis: John beholds a figure among candlesticks with white hair, fiery eyes, brass-like
    feet, water-like voice, stars, sword, and sun-like countenance; John falls at
    his feet as dead and is told not to fear.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: No specific supplied taxonomy family exactly matches the radiant epiphany
    pattern.
- id: motif:5
  label: Mystery objects explained as communal-heavenly correspondences
  taxonomy_refs: []
  basis: The seven stars and seven candlesticks are explicitly called a mystery and
    are explained as the angels and churches.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This is a localized symbolic interpretation within the passage; no broader
    comparison is asserted.
- id: motif:6
  label: Repentance under threat of loss of sacred standing
  taxonomy_refs:
  - divine_judgment
  basis: Ephesus is called to remember, repent, and do first works, or the speaker
    will come quickly and remove its candlestick from its place.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The threatened removal is symbolic within the passage and should not be
    expanded beyond the stated church context without additional evidence.
- id: motif:7
  label: Tree of life as reward for the overcomer
  taxonomy_refs:
  - sacred_tree_axis
  basis: The overcomer is promised food from the tree of life in the midst of the
    paradise of God.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage names the tree of life and paradise but does not elaborate
    an axis or world-tree structure; the taxonomy reference is approximate.
- id: motif:8
  label: Faithfulness through suffering rewarded with life
  taxonomy_refs:
  - initiation
  basis: Smyrna is warned of prison, testing, ten days of tribulation, and faithfulness
    unto death, with the promise of a crown of life and no harm from the second death.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The suffering functions as testing in the passage, but the supplied 'initiation'
    taxonomy may be only partial; the passage frames it as endurance and faithfulness.
