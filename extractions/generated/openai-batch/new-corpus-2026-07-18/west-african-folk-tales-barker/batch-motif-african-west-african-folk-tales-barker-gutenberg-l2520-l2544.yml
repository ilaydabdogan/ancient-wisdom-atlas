  summary: Elephant throws away the load containing Quarcoo, and the animals flee
    to a huge tree to rest. Quarcoo has already escaped, taken a short cut, and hidden
    in the tree. When Goat denies responsibility for Quarcoo and asks that he appear
    if Goat is to blame, Quarcoo jumps down. The frightened animals scatter to different
    habitats, which the tale gives as the reason they no longer live together.
