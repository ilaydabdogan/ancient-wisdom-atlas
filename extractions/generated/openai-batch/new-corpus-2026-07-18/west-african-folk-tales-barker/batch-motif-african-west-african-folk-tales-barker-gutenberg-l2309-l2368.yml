canonical_text:
  quote: "“From that time leopards have made their abode in the woods while rams have
    remained at home.”"
  summary: A ram and a leopard unknowingly build the same house and agree to live
    together. Their sons exchange demonstrations of how their fathers hunt. The leopard
    learns that the ram’s backward movement precedes a headlong charge. Later, when
    the ram slips backward on a wet floor, the leopard thinks he is about to attack,
    flees to the woods, and thereafter leopards live in the woods while rams remain
    at home.
  language: English
  quote_policy: quoted
