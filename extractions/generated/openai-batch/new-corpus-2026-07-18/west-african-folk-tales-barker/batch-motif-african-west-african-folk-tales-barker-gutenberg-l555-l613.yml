canonical_text:
  quote: ''
  summary: Anansi and the wealthy man Nothing travel to seek wives. Anansi tricks
    Nothing into exchanging clothes, gains wives by appearing wealthy, and later loses
    them when Nothing’s true wealth is revealed. Angered, Anansi prepares a lethal
    trap at Nothing’s palace; Nothing ignores his wife’s warnings, falls into the
    trap, and dies. Nothing’s wife distributes mashed yams to children so they will
    help mourn him, explaining why children are said to be “crying for nothing.”
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Anansi lives in a miserable little hut near the fine palace of a rich man
    called Nothing; both set out to a neighboring town to get wives.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nothing wears a fine velvet cloth and Anansi wears a ragged cotton cloth;
    Anansi persuades Nothing to exchange clothes temporarily and delays returning
    the fine cloth until they reach the town.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Anansi, appearing in the fine garment, obtains many wives, while Nothing,
    appearing ragged, is treated with contempt until a woman gives him her daughter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Anansi’s wives laugh at the daughter who becomes Nothing’s wife, but she does
    not respond to their scorn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the crossroads on the return journey, the road to Anansi’s house is only
    half cleared, while the road to Nothing’s palace is wide, prepared with skins
    and carpets, and attended by servants with fine clothes.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Nothing’s wife becomes queen over the district and has abundance; Anansi’s
    wives lack proper food, are invited to a palace feast by Nothing’s wife, and refuse
    to return to Anansi’s hut.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Anansi becomes angry, tries to kill Nothing, and persuades rat friends to
    dig a deep tunnel in front of Nothing’s door; he lines it with knives and broken
    bottles and smears the palace steps with okro.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Anansi calls Nothing out at night; Nothing’s wife repeatedly warns him not
    to go, but he eventually goes out, slips on the steps, falls into the hole, and
    dies from his wounds.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: Nothing’s wife grieves, prepares mashed yams, gives them to children so they
    will help her cry for her husband, and the tale explains the expression “crying
    for nothing.”
  category: sequence
  evidence_refs:
  - ev:9
