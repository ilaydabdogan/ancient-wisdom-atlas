canonical_text:
  quote: ''
  summary: Ohia overhears animals speaking about buried gold and later about mice
    stealing food. His unexplained laughter provokes the jealousy of his second wife,
    leading to a public demand that he reveal the cause despite his promise to King
    Tiger. After arranging his affairs and publicly explaining the secret, he dies
    as warned. The jealous wife is burned as a witch, and her scattered ashes are
    given as the reason jealousy and selfishness became widespread.
  language: English
  quote_policy: summarized
