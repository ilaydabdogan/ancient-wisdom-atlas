canonical_text:
  quote: ''
  summary: The passage explains how stories once attributed to Nyankupon became Anansi
    stories. Spider asks Nyankupon for the tales, is required to bring live bees in
    a jar, a boa-constrictor, and a tiger, and obtains each through deception. Nyankupon,
    impressed by Spider’s cleverness, grants him permission to call the old tales
    Anansi tales.
