canonical_text:
  quote: ''
  summary: A youngest son, later named Kwesi, promises to place the tail of the princess
    elephant in his dead mother's coffin. With help from an old woman he steals the
    tail from the elephant village. Pursued by elephants, he is protected by his juju
    Depor, which makes obstacles and later transforms him to hide him from the princess
    elephant, who becomes a maiden and marries him in order to punish him. After she
    burns the juju, it still instructs Kwesi to raise his arms, and he turns into
    a hawk.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman has three sons who try to please her; before her death each son promises
    a funerary gift or act, and the youngest promises to get the tail of the princess
    elephant for her coffin.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the mother dies, the youngest son travels for three weeks and reaches
    a village where an old woman says no human creature has been there before.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old woman says the village is the home of all elephants and that the princess
    sleeps there every night; she hides the young man in a pile of wood.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman instructs the young man to walk boldly to the eastern corner
    when the elephants sleep, cut off the princess's tail, and return the same way.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At night the young man cuts off the sleeping princess elephant's tail and
    leaves, carrying it carefully.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After elephants report dreams that the tail was stolen, the elephants check,
    find the loss, wake the princess, and chase the young man.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When pursued, Kwesi calls on his juju Depor; a thrown branch becomes a huge
    tree, and a thrown corn-cob becomes a large field of maize, delaying the elephants.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The princess elephant changes herself into a beautiful maiden, announces an
    archery challenge involving a calabash cymbal, and marries Kwesi after he strikes
    the cymbal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: On two nights after marriage, the princess becomes an elephant and tries to
    kill Kwesi; the juju changes him first into a grass mat and then into a needle.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The princess removes the juju from Kwesi's hair while he sleeps and throws
    it into a prepared fire; from the flames the juju tells Kwesi to lift his arms,
    and he turns into a hawk.
  category: sequence
  evidence_refs:
  - ev:8
