canonical_text:
  quote: ''
  summary: Mauri plans a yam festival and sends Klo the tortoise to obtain palm wine
    from Koklovi. Koklovi requires Klo to fight for the wine; Klo wins, drinks the
    surplus, and carries wine and palm trees back. Rain and intoxication delay him,
    and he is locked outside the palace, where he dies under his load. After the rain
    stops, people uncover him; an earthenware pot and dust have formed a hard covering
    on his back. Medicines restore him to life, but he thereafter creeps with a shell.
  language: English
  quote_policy: summarized
