canonical_text:
  quote: ''
  summary: During a long famine, Kweku Tsin follows lost palm-kernels down a hole
    into a silent hidden town. An old woman gives him counterintuitive instructions
    about a speaking yam and a drum; he obeys and receives a drum that produces food,
    which he uses to feed his household and village. His father Anansi envies him,
    enters the hidden town by imitation and deception, rudely disobeys the old woman,
    chooses the forbidden drum, and on beating it summons beasts and serpents, said
    not to have been seen on earth before.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A famine had lasted nearly three years, and Kweku Tsin searched daily in the
    forest for food.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kweku found three palm-kernels, but each slipped into a hole when he tried
    to crack it, so he decided to go down the hole.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hole proved to be an entrance to an unknown, silent town where an old
    woman answered Kweku's call.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman told Kweku to choose the yam that said not to dig it out, to
    discard the inside and boil the rind, and not to look at her while she ate.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kweku obeyed the yam instructions, and the boiled rind became yam that they
    ate.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old woman told Kweku to choose a drum that sounded 'Ding-ding' and avoid
    one that sounded 'Dong-dong'; she said the chosen drum would bring him food when
    beaten.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kweku beat the drum at home and at the village Assembly Place, and food appeared
    for his household and then for every family.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Anansi, Kweku's father, envied Kweku's ability to feed the village, learned
    the story, pretended to crack a nut, threw it into the hole, and entered the hidden
    town.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Anansi spoke rudely to the old woman, rejected her yam instructions, cooked
    the inside of the yam so that it became stones, and later ate both his own meal
    and hers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After being warned not to take a drum that sounded 'Dong-dong,' Anansi deliberately
    chose that drum and left without thanking the old woman.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: When Anansi beat his drum before the villagers, beasts and serpents rushed
    toward him instead of food, and the passage states that such creatures had never
    been seen on earth before.
  category: sequence
  evidence_refs:
  - ev:9
