  quote: ''
  summary: An etiological tale explains that repeated sea floods once killed many
    people. A wise turtle advised humans to plant rows of palms along the coast so
    their roots would bind the sand and stop the sea from advancing. The plan saved
    lives, but humans nevertheless catch and kill turtles when they come ashore to
    lay eggs. The turtle beats its breast when caught because of this ingratitude.
