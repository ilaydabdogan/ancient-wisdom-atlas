canonical_text:
  quote: "“Spider, spider, put me down,” said the stone."
  summary: During a famine, Anansi’s cousin Kofi finds a self-grinding flour stone
    beside a stream of honey and takes only enough food for his family. Anansi tricks
    and follows him, seizes the stone, sells flour from it, and is crushed when it
    will not leave his head; the tale explains tiny spiders found under large stones.
    A second tale tells how Morning Sunrise’s father tests three suitors by falsely
    reporting her death and asking for funeral help; the first two refuse, while Thinker
    comes to mourn with money and is chosen as her husband.
  language: English
  quote_policy: quoted
