canonical_text:
  quote: ''
  summary: In a famine, Kweku Tsin finds a forest place with animals and hides the
    discovery from his father Anansi. Anansi secretly marks Kweku’s route with ashes,
    follows him, and claims the hunting place. Kweku then makes a bell-hung image
    moved by a thread, places it on a tree branch, and frightens Anansi into abandoning
    loads of meat until Kweku becomes rich. At a feast Kweku publicly tells how Anansi’s
    cunning was overcome. In the next tale fragment, another famine leads a hungry
    Spider to conceal a dead antelope as a corpse; Wolf and Leopard expose the trick
    by frightening him at a tree, take the meat, and Spider sends a sharpened-toothed
    lizard to spy on them by borrowing fire.
  language: English
  quote_policy: summarized
