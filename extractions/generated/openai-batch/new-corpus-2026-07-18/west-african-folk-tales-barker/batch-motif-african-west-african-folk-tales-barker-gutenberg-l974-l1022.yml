canonical_text:
  quote: ''
  summary: A hard-working squirrel cultivates a farm reachable by trees rather than
    by a road. Spider finds the farm, fabricates a roadway and false traces, steals
    the corn, and wins a court dispute by arguing that a farm must have a road. Later,
    while Spider and his family carry the remaining harvest to market, a storm forces
    them to leave the bundles by the roadside. Father Crow keeps the bundles dry,
    then claims them by a similar argument and carries them away, leaving Spider and
    his children empty-handed.
  language: English
  quote_policy: summarized
