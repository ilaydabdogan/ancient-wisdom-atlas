canonical_text:
  quote: ''
  summary: 'Two indebted brothers become robbers, then return to farming to repay
    their debts. A bushfowl eats their planted seed and is made responsible for the
    debts. The burden then passes through a chain of beings and objects: bushfowl,
    silk-cotton tree, elephant, hunter, tree-stump, and white ants. The ants devise
    a plan to weave linen thread for sale; people later see this linen spread on ant-hills,
    call it mushroom, and gather it as food.'
  language: English
  quote_policy: summarized
