  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kwofi never complains and never tastes any of the meat he has hunted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: One evening, after the usual denial of food, one of the gods appears in the
    village carrying a great bag over his shoulder.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The god summons all the villagers and announces that he comes with a bag of
    death for them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The god distributes the contents of his bag among the villagers, but tells
