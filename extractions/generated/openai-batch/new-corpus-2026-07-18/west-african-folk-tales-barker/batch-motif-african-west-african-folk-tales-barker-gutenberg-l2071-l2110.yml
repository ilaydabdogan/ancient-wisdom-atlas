  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kwofi’s father dies when Kwofi is about ten, leaving him with no relative
    but his stepmother, for whom he has to work.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The stepmother becomes jealous when she sees that Kwofi is cleverer and handsomer
    than her own children.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kwofi is a good hunter and repeatedly comes home with meat or fish.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The stepmother cooks and portions the meat, gives others large helpings, tells
