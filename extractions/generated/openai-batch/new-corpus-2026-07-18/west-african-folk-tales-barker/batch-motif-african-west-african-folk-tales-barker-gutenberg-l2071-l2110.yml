canonical_text:
  quote: ''
  summary: An etiological coda says hawks fly in the smoke of fires because they are
    looking for their lost juju. The following tale introduces Kwofi, an orphaned
    eldest son whose stepmother denies him the meat he hunts; a god arrives with a
    bag of death, distributes death to the villagers but not to Kwofi, and Kwofi survives
    to reign peacefully.
  language: English
  quote_policy: summarized
