canonical_text:
  quote: ''
  summary: A chief's three sons travel. The first two reach a town ruled by an Omanhene
    who requires strangers to defeat him in riddles or be beheaded; both fail and
    die. The third son travels despite his mother's attempt to stop him by poisoning
    his food. He detects the poison through a vulture, panthers, and robbers who die
    after eating linked food. He later turns this sequence into a riddle. The riddle-loving
    Omanhene secretly obtains the answer by disguise and bribery, but the young man
    uses the ruler's ceremonial costume as proof of cheating. The Assembly executes
    the ruler and appoints the young man Omanhene.
  language: English
  quote_policy: summarized
