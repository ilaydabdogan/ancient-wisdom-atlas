canonical_text:
  quote: ''
  summary: A childless woman wishes for a daughter. A well-shaped yam answers her
    wish on condition that she never reproach it for having been a yam, then becomes
    a beautiful girl named Adzanumee. After the mother angrily calls her only a yam,
    a bird reports the words to Adzanumee. Adzanumee returns weeping, goes to the
    yam-field, and changes back into a yam despite her mother’s pleas.
