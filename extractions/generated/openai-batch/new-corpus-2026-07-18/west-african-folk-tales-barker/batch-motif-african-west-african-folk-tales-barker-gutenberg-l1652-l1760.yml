canonical_text:
  quote: ''
  summary: A poor man, Ohia, and his wife Awirehu attempt to earn money by making
    palm wine from a farmer's palm-trees. Their wine is repeatedly stolen and their
    pots broken. Ohia keeps watch, discovers a bush-deer stealing the wine, chases
    it to a hilltop gathering of quadrupeds ruled by King Tiger, and explains his
    case. The animals judge Deer guilty. King Tiger compensates Ohia with the ability
    to understand animal speech, under a prohibition against revealing the power,
    and Ohia returns home to prosperity.
  language: English
  quote_policy: summarized
