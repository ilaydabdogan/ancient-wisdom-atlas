canonical_text:
  quote: "“The wisdom contained in it escaped and spread throughout the world.”"
  summary: Father Anansi possesses all the world's wisdom and hides it in a sealed
    pot after being offended. His son Kweku Tsin observes him trying to place the
    pot in an inaccessible tree and suggests carrying it on his back. Anansi recognizes
    that his son has shown greater practical wisdom, throws the pot down in anger,
    and the broken pot releases wisdom throughout the world.
