canonical_text:
  quote: "“It is man who forces himself on things, / Not things which force themselves
    on him.”"
  summary: A hunter hears a tortoise singing and playing a harp in the forest. He
    takes her home under the condition that she will sing only to him, but he tells
    others and boasts before the Assembly. When he brings her to perform publicly,
    she remains silent; the hunter is executed under his wager. Afterward the tortoise
    speaks and explains that his punishment came from exposing a secret that did not
    concern him.
  language: English
  quote_policy: quoted
