canonical_text:
  quote: ''
  summary: A childless couple has a son while the father is away. At one week old
    the child names himself Quarcoo Bah-boni, speaks, and goes to the farm. He later
    beats other boys, is expelled by his mother, joins a household of five animals
    as a servant, overpowers the animals one by one at their farm, and then hides
    in their food basket when they try to flee, punishing each animal who secretly
    opens the basket for food.
  language: English
  quote_policy: summarized
