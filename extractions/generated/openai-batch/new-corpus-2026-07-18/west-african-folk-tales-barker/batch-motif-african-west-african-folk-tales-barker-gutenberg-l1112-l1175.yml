canonical_text:
  quote: ''
  summary: Egya Anansi farms a rich crop with his wife and son, then deceives them
    so he can eat the harvest alone. His son discovers the loss, and villagers set
    a sticky rubber-man in the field. Anansi strikes the figure and becomes stuck
    to it. When he is found, he is ashamed, changes into a spider, and hides in a
    ceiling corner; the tale concludes that this is why spiders are found in dark,
    dusty corners.
  language: English
  quote_policy: summarized
