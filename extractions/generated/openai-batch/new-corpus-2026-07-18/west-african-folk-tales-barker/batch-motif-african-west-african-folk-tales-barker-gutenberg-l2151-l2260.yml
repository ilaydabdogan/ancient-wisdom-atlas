canonical_text:
  quote: ''
  summary: Two close friends use private names meaning that one will die God’s death
    and the other the King’s death. A king favors the man called Maku Fia and tries
    to punish Maku Mawu, but the friends exchange the king’s gifts, causing Maku Mawu
    to receive ornaments hidden in a stone. The king then gives Maku Mawu a ring and
    demands its return under penalty of beheading. Maku Mawu hides it, but his wife
    retrieves it for the king. The ring is then accidentally lost in a pool when servants
    wash dishes. Facing death, Maku Mawu goes fishing in the same pool and finds the
    lost ring inside a fish.
  language: English
  quote_policy: summarized
