canonical_text:
  quote: ''
  summary: A poor hunter rescues a leopard, a serpent, a rat, and a man from a pit.
    The animals repay him with a snake-poison antidote, food, and wealth, while the
    rescued man envies him and falsely accuses him of theft. When the king's son is
    bitten by a serpent, the hunter uses the serpent's antidote, requiring a traitor's
    blood; the false accuser is identified, executed, and the prince is cured. The
    hunter is honored and sent home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A poor hunter walking in the forest finds a leopard, a serpent, a rat, and
    a man in a deep hole or trap, unable to get out, and they beg him for help.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hunter first wants to release only the man, saying the leopard has stolen
    his cattle, the serpent often kills men by biting them, and the rat does no good.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the animals plead for life, the hunter frees them from the pit; each
    animal promises a reward, but the man does not, and the hunter takes the poor
    man home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The serpent gives the hunter a powerful antidote for snake poison and tells
    him to ask for a traitor's blood to mix with it when he uses it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The leopard shows gratitude by killing animals for the hunter and supplying
    him with food for many weeks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The rat gives the hunter a bundle containing native cloths, gold dust, and
    ivory, saying these will make him rich.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The hunter becomes comfortable and builds a fine new house, while the rescued
    man continues living with him and envies his good fortune.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: After a proclamation about stolen royal valuables, the rescued man asks the
    king about a reward, then falsely accuses his host, knowing the hunter is innocent.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The hunter is imprisoned, brought into court, disbelieved when explaining
    his wealth, and condemned to die at noon the next day.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Before the execution, the king's eldest son is reported to have been bitten
    by a serpent and to be dying; anyone able to cure him is asked to come.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The hunter receives permission to use the serpent's powder, asks for a traitor's
