canonical_text:
  quote: ''
  summary: Farmer Mybrow prepares a secret field near a forest inhabited by fairies.
    When he answers their repeated questions, the fairies help clear, burn, dig, sow,
    and plant the field. Mybrow tells his wife the field’s location only after warning
    her not to answer any question there. She plucks unripe maize and a yam, answers
    the fairies angrily, and the fairies help her pluck all the green crops, ruining
    the harvest.
  language: English
  quote_policy: summarized
