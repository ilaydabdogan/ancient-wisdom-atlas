canonical_text:
  quote: ''
  summary: Anansi becomes blind in old age but continues fishing with two helpful
    men. He repeatedly responds to their assistance with rudeness and claims he already
    knows what they tell him. The helpers decide to punish his ingratitude. While
    still away from shore, they tell him they have reached the beach; Anansi jumps
    out, sinks in deep water, cannot find land because of his blindness, becomes exhausted,
    and drowns.
