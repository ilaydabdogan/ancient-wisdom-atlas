canonical_text:
  quote: ''
  summary: The passage first concludes an episode in which Maku Mawu finds a ring,
    the people rejoice that the death appointed for him is the only death he will
    die, and the king lets him go. It then tells of a rich gentleman robbed of two
    bags of money by a thief. The owner suspects the thief but cannot prove the theft.
    The thief seeks help from a wise old man, who advises him to feign madness by
    dressing in rags and answering every question with “Moo” in return for half the
    stolen money. The thief follows the advice, the court is dismissed, and he later
    uses the same answer to avoid paying the old man, who regrets saving him from
    punishment.
