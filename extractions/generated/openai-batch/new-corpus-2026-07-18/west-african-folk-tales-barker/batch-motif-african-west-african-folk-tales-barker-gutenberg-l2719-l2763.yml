canonical_text:
  quote: ''
  summary: A hunter meets a tiger in the forest, and the two become friends and exchange
    visits. The tiger later comes with his cub to comfort the man after the man's
    father dies, bringing money. Two of the man's friends ambush and shoot the tiger,
    who survives and tests whether the man was involved by pretending to be dead.
    The man mourns and guards the tiger's body all night. Satisfied of the man's innocence,
    the tiger rises and promises that, for the man's sake, he will not attack a man
    unless first provoked.
  language: English
  quote_policy: summarized
