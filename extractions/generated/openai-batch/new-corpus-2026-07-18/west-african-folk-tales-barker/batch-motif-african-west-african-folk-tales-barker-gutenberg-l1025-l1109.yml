canonical_text:
  quote: ''
  summary: Kweku Anansi and his son Kweku Tsin are farmers during a drought. A tiny
    hunchbacked dwarf helps Kweku Tsin obtain rain through a light tapping action
    and a water song. Anansi imitates the action with excessive force, kills the dwarf,
    and tries to shift blame to his son. The son’s reply induces Anansi to admit responsibility
    and carry the body to the King, who punishes Anansi with an enchanted box that
    cannot be set down. Anansi later tricks Ant into taking the box, and the tale
    concludes that this explains why ants carry large bundles.
  language: English
  quote_policy: summarized
