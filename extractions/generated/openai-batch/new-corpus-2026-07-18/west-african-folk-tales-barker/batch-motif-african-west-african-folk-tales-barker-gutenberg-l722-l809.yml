  summary: Anansi learns the secret names of a king’s three daughters by tricking
    them with honeyed fruit. He tells the names to Lizard so Lizard can announce them
    at court, but the king awards the daughters to Lizard. Anansi retaliates by killing
    the king’s cock, planting evidence at Lizard’s house, and making Lizard unable
    to speak. Lizard is judged guilty, loses the wives to Anansi, and the tale explains
    why lizards move their heads backward and forward.
