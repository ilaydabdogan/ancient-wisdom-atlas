canonical_text:
  quote: ''
  summary: Spider’s plan leads Wolf and Leopard to ask for teeth like Lizard’s; Spider
    hangs them on a tree, mocks them, and takes the antelope for a village feast.
    White Ant frees them and is promised a return feast, but Spider impersonates the
    ants with his children and receives the food. When the real ants arrive, Wolf
    and Leopard mistake them for Spider’s family and kill nearly all with boiling
    water. White Ant vows to stop helping and to harm property, explaining white ants
    as pests to humans.
  language: English
  quote_policy: summarized
