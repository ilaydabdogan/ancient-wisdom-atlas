canonical_text:
  quote: ''
  summary: Leopard asks Cat to teach him how to catch animals. Cat teaches Leopard
    to hide by the roadside, move noiselessly, and spring with his left paws and side,
    then tells him to practice and return for more instruction. After initial success,
    Leopard becomes hungry, goes to Cat's home while she is absent, and eats all her
    kittens. Cat refuses further association with Leopard, and the tale explains that
    leopard therefore never learned to catch animals passing on his right side.
  language: English
