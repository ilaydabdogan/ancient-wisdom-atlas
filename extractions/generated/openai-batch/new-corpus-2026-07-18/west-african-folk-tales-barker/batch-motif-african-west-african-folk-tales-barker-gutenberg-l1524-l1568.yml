canonical_text:
  quote: ''
  summary: The passage first states that people flee, Anansi is punished for disobedience,
    Kweku escapes with his mother and sisters, and the animals scatter into forests
    where they have roamed wild ever since. It then tells of a poor Akim-man traveling
    to Accra, where his language is not understood. Each time he asks who owns cows,
    buildings, and a vessel, people answer “Minū,” meaning they do not understand;
    he mistakes this for the name of a very rich owner. When he later hears the same
    reply after asking about a funeral, he concludes that the wealthy Minū has died
    like anyone else and returns home content with his own small hut and little money.
  language: English
  quote_policy: summarized
