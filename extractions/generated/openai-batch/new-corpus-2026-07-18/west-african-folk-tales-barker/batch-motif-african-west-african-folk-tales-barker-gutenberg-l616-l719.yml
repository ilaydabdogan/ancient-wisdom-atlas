canonical_text:
  quote: ''
  summary: During a famine, Anansi crosses the sea to a palm-tree, loses the nuts
    into the water, and descends to Thunder’s sea-bottom cottage. Thunder gives him
    a cooking-pot that produces food, but Anansi hides it from his starving family.
    His shape-changing son discovers the pot, the family eats, and Mrs. Anansi uses
    it to feed the village until it melts. Anansi returns to Thunder seeking another
    gift and receives a stick that beats him when he tries to use it.
  language: English
  quote_policy: summarized
