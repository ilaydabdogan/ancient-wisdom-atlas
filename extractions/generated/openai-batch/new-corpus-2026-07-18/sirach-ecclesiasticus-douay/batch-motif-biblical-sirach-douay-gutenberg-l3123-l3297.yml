canonical_text:
  quote: ''
  summary: The passage gives didactic counsel on disciplining a son, valuing bodily
    and spiritual health, resisting sadness and anger, avoiding trust in riches and
    gold, behaving modestly at a table, sharing bread liberally, and drinking wine
    with moderation rather than excess.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker warns that indulging a son, laughing with him, or giving him liberty
    in youth will bring fear, sorrow, stubbornness, and offence; the son is to be
    instructed and disciplined while young.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A poor man who is sound and strong is said to be better than a rich man who
    is weak; health of soul and body is said to be better than gold, silver, revenues,
    and riches.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says not to give the soul to sadness, to drive sadness away, and
    that sadness, envy, anger, and pensiveness are harmful, while joyfulness and a
    cheerful heart are associated with life and feasting.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Watching for riches is said to consume flesh and drive away sleep; loving
    gold and following corruption are linked with falling, ruin, woe, and perishing.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A rich man without blemish who has not followed gold or trusted in money is
    blessed; one tried and made perfect is said to receive everlasting glory, with
    goods established in the Lord and alms declared by the church of the saints.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: At a great table, the addressee is told not to be first to open the mouth,
    stretch out the hand, eat hastily, eat too much, or ask first for drink.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A moderate person is associated with sufficient wine, wholesome sleep, and
    delight, while an intemperate person is associated with watching, choler, gripes,
    and bodily sickness.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Many lips are said to bless the person liberal with bread, while the city
    murmurs against the person niggardly with bread.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Wine is said to have destroyed many; taken moderately it brings joy, sobriety,
    and health, while drunken excess brings quarrels, wrath, bitterness, weakened
    strength, wounds, and ruin.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Fire trying hard iron is used as a comparison for wine drunk to excess rebuking
    proud hearts.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: An offering to an idol is said to do no good because the idol can neither
    eat nor smell; this is compared with a person persecuted by the Lord while bearing
    the reward of iniquity.
  category: relationship
  evidence_refs:
  - ev:11
