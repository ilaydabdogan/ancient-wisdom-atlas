  summary: The passage gives didactic instructions about shame, discipline, secrecy,
    covenantal law, fair dealing, household vigilance, and sexual caution, then turns
    to praise of the Lord’s works, omniscience, cosmic order, the firmament, and the
    sun’s light and heat.
  language: English
