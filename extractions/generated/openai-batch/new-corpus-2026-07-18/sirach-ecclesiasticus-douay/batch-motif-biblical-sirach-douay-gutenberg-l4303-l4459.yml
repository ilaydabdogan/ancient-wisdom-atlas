literal_observations:
- id: obs:1
  text: A good life is described as having a limited number of days, while a good
    name is said to continue forever.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker addresses “my children” and tells them to keep discipline in peace.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hidden wisdom and an unseen treasure are described as unprofitable, and hiding
    folly is contrasted with hiding wisdom.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage lists actions or conditions for which one should be ashamed, including
    fornication, lying, iniquity, injustice, theft, deceit in exchange, neglecting
    greetings, looking on a harlot, turning from kin or neighbor, taking without restoring,
    gazing at another man’s wife, pursuing a handmaid, approaching her bed, and upbraiding
    after giving.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker says not to repeat what has been heard or disclose a secret, while
    also saying not to be ashamed of the law of the Most High, the covenant, judgment,
    social affairs, inheritance gifts, exact measures, buying and selling, correction
    of children, or instructing the foolish and aged.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Where many hands are involved, the passage advises shutting up goods, delivering
    all things by number and weight, and putting outgoing and incoming items in writing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A father is described as losing sleep over care for his daughter, with concerns
    about her youth, marriage, possible corruption, pregnancy in her father’s house,
    misconduct, or barrenness.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage instructs the addressee to keep watch over a shameless daughter
    to avoid public reproach and also warns not to behold everyone’s beauty or remain
    among women.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speaker announces that he will remember the works of the Lord and declare
    what he has seen, stating that the Lord’s works come by his words.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The sun is described as giving light and looking upon all things, and the
    Lord’s work is said to be full of glory.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Lord is said to have made the saints declare his wonderful works, which
    are firmly settled for his glory.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Lord is described as searching the deep and human hearts, knowing all
    knowledge, beholding the signs of the world, declaring past and future things,
    and revealing hidden traces.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: No thought or word is said to be hidden from the Lord, and he is described
    as eternal, undiminished, and needing no counsellor.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Lord’s works are described as desirable, only partly knowable by humans,
    living and remaining forever, obeying him, and existing as doubled things set
    one against another.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: The firmament on high and the beauty of heaven are presented as divine beauty,
    and the sun at its rising is called an admirable instrument and work of the Most
    High.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:16
  text: At noon the sun is said to burn the earth and mountains, breathe fiery vapours,
