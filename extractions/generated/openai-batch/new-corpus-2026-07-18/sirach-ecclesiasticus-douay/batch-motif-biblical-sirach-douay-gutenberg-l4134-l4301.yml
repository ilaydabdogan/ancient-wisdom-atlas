  summary: The passage closes a reflection on the Lord's ordered works, then describes
    the universal burden of human life from birth to burial, the intensified troubles
    of sinners, punitive calamities including the flood, the return of earth and waters
    to their places, contrasts between unjust and faithful outcomes, sayings on wisdom,
    mercy, fear of the Lord, poverty, death, descendants of sinners, and the enduring
    value of a good name.
