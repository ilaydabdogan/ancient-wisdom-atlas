  summary: The passage gives wisdom instruction warning against wicked company, deceptive
    enemies, unequal association with the rich or powerful, and avarice. It contrasts
    rich and poor social treatment, uses animal and household analogies, urges humility
    and love toward God, recommends worthy offerings, and concludes with remembrance
    of death and the covenant of hell.
