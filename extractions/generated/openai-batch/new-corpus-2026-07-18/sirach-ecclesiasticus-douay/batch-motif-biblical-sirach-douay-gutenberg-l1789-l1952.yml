  text: God is described as patient toward human beings, pouring out mercy, showing
    the way of justice, and having mercy on all flesh.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: God is said to teach and correct as a shepherd does his flock.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The addressee is told not to spoil good deeds or gifts with complaint or an
    evil word; a good word is compared favorably with a gift.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The addressee is instructed to prepare justice before judgment, learn before
    speaking, examine himself before judgment, pray always, and remember the last
    day and time of repayment.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A wise person is said to fear in everything, know wisdom, praise the one who
