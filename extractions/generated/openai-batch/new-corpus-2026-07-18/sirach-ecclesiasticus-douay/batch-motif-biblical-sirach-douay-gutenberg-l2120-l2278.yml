canonical_text:
  quote: The perfection of the fear of God is wisdom and understanding.
  summary: The passage presents wisdom sayings contrasting sinners, fools, sluggards,
    talebearers, and faithless companions with prudent, wise, silent, and faithful
    persons. It uses repeated images of paths, water, vessels, restraints, weights,
    foundations, wind, bodily injury, and friendship rupture or reconciliation.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The way of sinners is said to end in hell, darkness, and pains, while keeping
    justice and fearing God are linked with understanding and wisdom.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wise man's knowledge and counsel are compared to abundant water and a fountain
    of life, while a fool's heart is compared to a broken vessel that cannot hold
    wisdom.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wise person receives and applies wise words, while the luxurious person
    hears them with displeasure and casts them away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The passage contrasts foolish and wise speech: foolish talking is a burden,
    wise lips have grace, the prudent mouth is sought, and wise words are weighed.'
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Instruction and learning are described as burdensome restraints for a fool
    but as gold ornament and bracelet for the prudent.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The fool is described as intrusive in another's house, peeping through a window
    and listening at a door, while the well taught stands outside and the wise grieves
    at the disgrace.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ungodly person who curses the devil is said to curse his own soul, and
    the talebearer is said to defile his own soul and be hated.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sluggard is pelted with a dirty stone and with ox dung, and those who
    touch him shake their hands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: An ill-taught son and foolish or bold daughter bring confusion, loss, shame,
    or disgrace to family members, while a wise daughter brings inheritance to her
    husband.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Untimely speech is compared to music in mourning; teaching a fool is compared
    to gluing a potsherd and to speaking to someone asleep.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The dead are to be mourned briefly because they are at rest, while the wicked
    life of a wicked fool is said to be worse than death and a lifelong cause for
    mourning.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The listener is told not to talk much with or go with a fool, but to keep
    away in order to avoid trouble, defilement, and weariness.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A foolish and wicked person is compared with heavy substances such as lead,
    sand, salt, and iron, which are easier to bear.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: A heart established by advised counsel is compared to a wooden frame bound
    in a building foundation, while a fearful fool's heart is compared to structures
    unable to withstand wind or fear.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: Injury to a friend is described through images of pricking the eye or heart,
    throwing a stone at birds, drawing a sword, opening a sad mouth, disclosing secrets,
    and making a treacherous wound.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage states that some offenses against a friend may allow returning
    or reconciliation, but upbraiding, reproach, pride, disclosure of secrets, or
    a treacherous wound cause a friend to flee away.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The listener is told to keep fidelity with a friend in poverty and trouble,
    so as to rejoice in prosperity and share in inheritance.
  category: action
  evidence_refs:
  - ev:9
