  summary: The passage gives wisdom instructions on restrained speech, proper conduct
    by rulers, elders, and younger people, fear of the Lord, counsel, obedience to
    law and commandments, divine ordering of days and human stations, paired moral
    oppositions, and prudent control over one’s household and estate.
