  quote: ''
  summary: The passage gives wisdom-instruction on alms, mercy to the poor, truthful
    speech, justice, and avoidance of presumptuous sin. Wisdom is personified as a
    feminine guide who gives life, protects, tests, disciplines, strengthens, reveals
    secrets, and forsakes the one who goes astray. The passage also warns that divine
    mercy and wrath come from God, and that sudden vengeance can fall on sinners who
    delay conversion.
  language: English
