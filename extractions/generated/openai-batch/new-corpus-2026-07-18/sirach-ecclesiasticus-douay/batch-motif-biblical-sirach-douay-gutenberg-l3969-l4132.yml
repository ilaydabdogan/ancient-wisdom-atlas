canonical_text:
  quote: ''
  summary: The passage contrasts manual workers and artisans, who sustain civic life
    through skilled labor, with the wise man, who studies ancient wisdom, prophets,
    proverbs, and parables, prays to the Lord, receives understanding, and gains lasting
    praise. It then exhorts the divine offspring to flourish and praise the Lord,
    declares all the Lord's works good, describes divine command over waters, blessing
    and wrath, lists necessities of life, and names destructive agents created for
    vengeance against the ungodly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The holder of the plough uses a goad, drives oxen, speaks about cattle, turns
    furrows, and cares for feeding kine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A craftsman or workmaster labors night and day, makes graven seals, varies
    the figure, attends to a picture's resemblance, and finishes the work by watching.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The smith sits by the anvil, considers ironwork, is exposed to fire and furnace
    heat, hears the hammer, looks to the vessel pattern, and polishes the work to
    completion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The potter sits at work, turns a wheel with his feet, fashions clay with his
    arm, attends to glazing, and makes clean the furnace.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The named workers trust their hands, are wise in their own art, and are said
    to be necessary for a city to be built.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The same workers are said not to sit on the judges' seat, understand judgment
    ordinances, declare discipline and judgment, or be found where parables are spoken,
    yet they strengthen the state of the world and have prayer in their craft work.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The wise man seeks the wisdom of the ancients, studies prophets, keeps sayings
    of renowned men, enters the subtleties and secrets of parables and proverbs, serves
    among great men, appears before a governor, and travels to strange countries.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The wise man prays early to the Lord, supplicates for sins, may be filled
    with the spirit of understanding, pours forth words of wisdom like showers, meditates
    in secrets, and glories in the law of the covenant of the Lord.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The wise man's wisdom is praised by many, his memory and name endure through
    generations, and nations and the church declare his praise.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: A speaker says he is filled as with a holy transport and addresses divine
    offspring, telling them to bud like a rose by brooks of waters, give fragrance
    like frankincense, flower like a lily, bring forth leaves, and praise the Lord
    with canticles, lips, mouths, and harps.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage states that all the Lord's works are exceedingly good, that waters
    stand as a heap at his word, that nothing is hidden from his eyes, and that his
    blessing has overflowed like a river.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage compares divine wrath toward nations that have not sought him
    to a flood, recalls waters turned into dry land for a journey, and says the same
    ways become stumblingblocks to sinners in wrath.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: Water, fire, iron, salt, milk, flour bread, honey, grapes, oil, and clothing
    are listed as principal necessities for human life; the passage says these are
    good for the holy but turn to evil for sinners and the ungodly.
  category: object
  evidence_refs:
  - ev:12
- id: obs:14
  text: Spirits are said to be created for vengeance and to inflict grievous torments;
    fire, hail, famine, death, beasts' teeth, scorpions, serpents, and the sword are
    named as created or acting for vengeance upon the ungodly.
  category: sequence
  evidence_refs:
  - ev:13
