    mountains, hearts, works, and iniquities as visible to him, teaches wisdom to
    a son, recounts God's ordering of creation and creation of humanity from earth
    in his image, describes human dominion, faculties, wisdom, law, covenant, and
    commandments, and exhorts the penitent to return to God, pray, praise while living,
    and remember human mortality before the eternal creator and king.
