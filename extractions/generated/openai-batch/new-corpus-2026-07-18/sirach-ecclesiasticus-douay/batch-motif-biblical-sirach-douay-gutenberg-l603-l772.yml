literal_observations:
- id: obs:1
  text: The addressee is told to answer a neighbor only if he has understanding; otherwise
    he should put his hand on his mouth to avoid an unskilful word and confusion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts the word of the wise with the tongue of the fool and
    warns against being a whisperer or double-tongued.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage warns that a person should not become an enemy instead of a friend
    and describes self-exaltation as leading to loss of strength, leaves, fruit, and
    a dry-tree condition in the wilderness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says a sweet word multiplies friends and appeases enemies, but
    also advises testing a friend and not trusting too easily.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Several kinds of friends are described: one for his own occasion, one who
    turns to enmity, one who is a table companion, and one who remains steadfast.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A faithful friend is described as a strong defense, a treasure, and the medicine
    of life and immortality; those who fear the Lord are said to find such a friend.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The addressee, called my son, is told to receive instruction from youth to
    old age and to come to Wisdom as one who ploughs, sows, waits, and eats fruits.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wisdom is described as unpleasant to the unlearned, as a mighty stone of trial
    to them, and as not manifest to many.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The addressee is told to put his feet into Wisdom's fetters, his neck into
    her chains, bow his shoulder, bear her, search for her, and not let her go.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Wisdom's fetters, chains, and bands are said to become defense, foundation,
    glory, healthful binding, and a crown of joy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The addressee is told to listen, join himself to wise ancients, go early to
    a man of understanding, meditate on God's precepts, and receive from God a heart
    and the desire of wisdom.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage instructs the addressee to avoid evils and the unjust and not
    to sow evils in the furrows of injustice, lest they be reaped sevenfold.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage warns against seeking preeminence, self-justification before God,
