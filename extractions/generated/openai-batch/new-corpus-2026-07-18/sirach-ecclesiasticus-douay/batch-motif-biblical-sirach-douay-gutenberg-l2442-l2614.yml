  - ev:6
  confidence: high
  cautions: The passage is explicit about covenant and law, but it does not narrate
    covenant-making events.
- id: motif:4
  label: Sacred tree and fruitful Wisdom imagery
  taxonomy_refs:
  - sacred_tree_axis
