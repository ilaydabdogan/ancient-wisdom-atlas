canonical_text:
  quote: 'The prayer of him that humbleth himself, shall pierce the clouds:'
  summary: The passage gives instructions on joyful and just offerings, describes
    God as an impartial judge who hears the poor, widow, fatherless, and humble, prays
    for divine mercy, renewed signs, judgment on enemies, and restoration of Israel,
    Jerusalem, and Sion, then gives wisdom sayings about discerning speech, wives,
    friends, and counsellors.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Gifts and tithes are to be given cheerfully to the Most High according to
    what has been given and according to one’s ability; the Lord is said to recompense
    sevenfold.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wicked gifts and unjust sacrifice are rejected, and the Lord is called judge
    without respect of person.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Lord is said to hear the wronged and not despise the prayers of the fatherless
    or the widow; the widow’s tears and cry go up to heaven.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Joyful worship is accepted, and the humble person’s prayer approaches and
    pierces the clouds until the Most High beholds.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Lord is described as judging for the just, repaying according to deeds,
    crushing the proud or unjust, and breaking unjust sceptres.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The mercy of God in affliction is compared to a cloud of rain in drought.
  category: attribute
  evidence_refs:
