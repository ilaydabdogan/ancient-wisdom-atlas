canonical_text:
  quote: ''
  summary: The passage warns that injurious speech precedes violence, asks for restraint
    over mouth, thoughts, and heart, instructs hearers against swearing and corrupt
    speech, describes sexual sin hidden from human sight but visible to the Lord,
    declares public punishment and disgrace for such conduct, condemns adultery and
    its lineage consequences, praises fear of God and obedience, and begins a section
    where Wisdom praises herself in the assembly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vapour and smoke rising before fire are compared to injurious words, reproaches,
    and threats coming before blood.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says he will not be ashamed to salute a friend, will not hide
    from the friend's face, and will bear evil if it happens through him; hearers
    will then beware of that person.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker asks for a guard before the mouth and a sure seal upon the lips
    so that the tongue will not cause a fall or destruction.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker addresses the Lord as father, sovereign ruler, and God of life,
    asking not to be left to harmful counsel or devices.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker asks for scourges over thoughts and the discipline of wisdom over
    the heart, and asks that haughtiness, coveting, greediness, fleshly lusts, and
    a shameless foolish mind be turned away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Children are told to hear the discipline of the mouth; the one who keeps it
    will not perish by the lips or fall into wicked works.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The sinner, the proud, and evil speakers are said to be caught or to fall;
    habitual swearing and naming God or saints are described as bringing falls, iniquity,
    scourge, and punishment.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A kind of speech is described as opposite to death and as not to be found
    in the inheritance of Jacob; indiscreet and opprobrious speech are warned against.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A hot soul is compared to a burning fire that is not quenched until it devours
    something; a man wicked in the mouth of his flesh is said not to stop until he
    has kindled a fire.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A fornicator is described as finding all bread sweet and not growing weary
    of sinning to the end.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: A man who passes beyond his own bed says that darkness surrounds him, walls
    cover him, no one sees him, and the Most High will not remember his sins.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Lord's eyes are described as brighter than the sun, seeing all human ways,
    the bottom of the deep, human hearts, and hidden parts.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The hidden sinner is said to be punished in the city streets, chased like
    a colt, taken where he did not suspect, and disgraced among all people.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A woman who leaves her husband and brings in an heir by another is described
    as unfaithful to the law of the Most High, offending against her husband, and
    committing adultery.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The woman is to be brought into the assembly, inquiry is to be made about
    her children, her children will not take root, her branches will bear no fruit,
