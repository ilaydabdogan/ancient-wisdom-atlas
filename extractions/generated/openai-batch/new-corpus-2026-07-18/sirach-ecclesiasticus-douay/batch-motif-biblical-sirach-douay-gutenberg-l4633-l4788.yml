canonical_text:
  quote: ''
  summary: 'The passage praises ancestral and biblical figures: Isaac and Jacob receive
    blessing and covenantal inheritance; Moses is beloved, chosen, brought into a
    cloud, and given commandments and law; Aaron receives an everlasting priesthood,
    sacred vestments, sacrifice, anointing, and priestly inheritance; rebels against
    him are consumed by divine wrath and fire; Phinees appeases God and receives a
    covenant of peace; David receives a covenantal inheritance and wisdom to judge;
    Jesus/Josue son of Nave is praised as Moses'' successor, a saving war leader aided
    by stopped sun and hailstones, with Caleb also commended for resisting sin and
    murmuring.'
  language: English
  quote_policy: summarized
