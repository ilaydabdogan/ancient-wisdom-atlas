  quote: ''
  summary: The passage praises Caleb, the judges, Samuel, Nathan, David, Solomon,
    and Elias. It recounts inheritance, obedience, prophetic authority, sacrifice,
    heavenly intervention, royal victory, worship, covenant kingship, wisdom, Solomon’s
    fall, division of the kingdom, divine mercy toward a remnant, and Elias’s famine
    and fire from heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two appointed men are delivered from danger among six hundred thousand men
    on foot and are connected with bringing the people into an inheritance in a fertile
    land.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Caleb receives strength from the Lord that continues into old age; he goes
    up to the high places of the land, and his seed obtains it as inheritance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The children of Israel are to see that obedience to the holy God is good.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: The judges are described as uncorrupted in heart and as not turning away from
    the Lord; their memory, bones, name, and descendants are blessed or continued.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Samuel is described as a prophet beloved by the Lord; he establishes a new
    government, anoints princes, judges the congregation by the Lord’s law, and is
    proved a prophet by fidelity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Samuel calls on the Lord Almighty while fighting surrounding enemies and offers
    a lamb without blemish; the Lord thunders from heaven and crushes enemy rulers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before his death Samuel protests that he has taken nothing from anyone; after
    he sleeps, he makes known a king’s end and lifts up his voice from the earth in
    prophecy.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nathan the prophet arises in the days of David, and David is described as
    chosen from among the children of Israel.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: David is depicted in youth as handling lions and bears like lambs, killing
    the giant Goliath with a stone in a sling, calling on the Lord, and receiving
    strength in his right hand.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: David destroys enemies, gives thanks and praise to God, appoints singers before
    the altar, orders festivals and solemn times, receives forgiveness, and receives
    a covenant of the kingdom and a throne of glory in Israel.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Solomon reigns in peace, builds a house and sanctuary in God’s name, is filled
    like a river with wisdom, and becomes famous for canticles, proverbs, parables,
    interpretations, and peace.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Solomon gathers gold and silver in abundance, bows himself to women, stains
    his glory, defiles his seed, brings wrath upon his children, and causes the kingdom
    to be divided.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: God does not utterly destroy the offspring of his elect, but gives a remnant
    to Jacob and David; Roboam is described as having little wisdom, and Jeroboam
    causes Israel to sin before vengeance comes.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Elias stands up as fire, his word burns like a torch, he brings famine, shuts
    heaven by the word of the Lord, and brings down fire from heaven three times.
  category: action
  evidence_refs:
  - ev:11
