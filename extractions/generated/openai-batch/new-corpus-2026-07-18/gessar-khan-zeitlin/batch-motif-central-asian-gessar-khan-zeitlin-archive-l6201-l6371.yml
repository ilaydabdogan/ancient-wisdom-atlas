canonical_text:
  quote: ''
  summary: Kormuzda receives a golden chalice of blessed arshaan and entrusts it to
    three sisters, who deliver Buddha's instruction to Gessar on the battlefield.
    Gessar sprinkles the bones of his thirty heroes three times, restoring their bodies,
    breath, and life. Shikeer, in a man-hawk form, declines restoration to mortal
    form and ascends to the abode of the high gods, where Kormuzda receives him and
    he dwells on Sumeru. Gessar then holds a long feast and concludes the tale ruling
    from his golden throne with the sword of righteousness and balm of peace.
  language: English
  quote_policy: summarized
