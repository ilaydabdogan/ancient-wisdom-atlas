canonical_text:
  quote: ''
  summary: Gessar discovers Chotong hidden in a sack, wounds him, accuses him of betraying
    kin, and spares him after Sanglun intercedes. Gessar then has his wonder-steed
    swallow and release Chotong nine times to drain his power. Led to the battlefield,
    Gessar laments the bones of his thirty slain heroes. His wonder-steed advises
    him to appeal to his sisters on Sumeru. After offerings, the sisters petition
    Kormuzda, who petitions the supreme divine authority. Buddha grants blessed arshaan
    and instructs that it be sprinkled on the heroes' bones to restore body and breath.
  language: English
  quote_policy: summarized
