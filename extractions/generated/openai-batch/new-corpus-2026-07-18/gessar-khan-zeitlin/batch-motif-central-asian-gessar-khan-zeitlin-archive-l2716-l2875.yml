canonical_text:
  quote: ''
  summary: Chotong deceives swineherds into placing troughs of blood, brandy, and
    sour milk at Lady Aralgo's portal. When Aralgo is awakened and crosses her threshold,
    she overturns the troughs, and their fumes are carried to Tibet, causing pestilence
    and afflicting Gessar Khan. Soothsayers identify the scourge as coming from the
    Valley of Pleasant Winds and say Aralgo must be driven out. Rogmo sends couriers
    to expel her; Aralgo rejects their claim that Gessar sent them, then leaves alone.
    She wanders through white, blue, and rainbow-colored realms, guided by a white
    hare, blue wolf, and magpie, and reaches a dark sea where burning and icy winds
    strike her. After she calls for protection, the winds cease and a twelve-headed
    giant appears; Aralgo recognizes him and begins to address him with guile.
  language: English
  quote_policy: summarized
