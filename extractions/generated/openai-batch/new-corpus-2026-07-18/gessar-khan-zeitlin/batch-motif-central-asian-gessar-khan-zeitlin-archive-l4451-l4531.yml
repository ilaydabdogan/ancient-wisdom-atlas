canonical_text:
  quote: ''
  summary: Shikeer stops the warriors from seeking vengeance for wounded Nantsong
    and takes Kinggen the Healer to find him by following ravens. Nantsong is found
    powerless while his dappled steed guards him; the steed attacks wolves, and Kinggen
    heals Nantsong with herb juices. The company returns to the Mountain of Sand,
    where Rogmo and Chotong arrive. Rogmo says she has come to join the fighters;
    Chotong claims concern for her safety, but Shikeer rebukes him as one who avoided
    danger and sought spoils. Captured herds and steeds are distributed through offerings,
    tribute, and rewards, while Chotong receives none. Night falls on the mountain
    camp.
  language: English
  quote_policy: summarized
