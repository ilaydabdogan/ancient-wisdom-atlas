canonical_text:
  quote: ''
  summary: 'The smith gives Gessar three animal horns and Gessar travels with him
    to China to aid Keeme Khan. In Keeme Khan’s palace, Gessar finds the Khan holding
    the body of his dead wife and urges funeral rites, cremation, charity, and remarriage.
    Keeme refuses. At night Gessar removes the body and leaves an ape in its place
    while a sentinel is unable to cry out. Keeme orders Gessar into lethal pits: first
    the Hole of Wasps, then the Pit of Serpents. Gessar destroys the wasps with tears
    of the black fledgling and the serpents with milk of the black eagle’s mate, then
    sings of his survival. Keeme next orders him cast into the Den of Wild Beasts;
    the passage ends as the beasts begin to attack.'
  language: English
  quote_policy: summarized
