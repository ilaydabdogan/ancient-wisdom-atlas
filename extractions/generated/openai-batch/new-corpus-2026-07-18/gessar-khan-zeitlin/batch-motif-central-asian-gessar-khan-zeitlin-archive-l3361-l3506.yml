canonical_text:
  quote: ''
  summary: Gessar receives counsel and golden and silver nets for reaching a giant’s
    mist-shrouded castle. He passes allied human sentinels, calls on the gods to destroy
    giant sentinels with storm and hail, ignores deceptive forest apparitions, snares
    the sun and moon to light his ascent, enters the castle with the aid of his wonder-steed,
    sends the steed back to Sumeru, and reunites with Aralgo before vowing to challenge
    the giant and hold Chotong accountable.
  language: English
  quote_policy: summarized
