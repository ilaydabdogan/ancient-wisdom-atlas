canonical_text:
  quote: ''
  summary: Gessar kills the giant’s sister by disguising bowstrings as a necklet,
    after which she becomes reptilian and is burned with a tree. He then rides west,
    shoots a yellow hind that becomes a yaksha, tricks the yaksha into revealing a
    beetle described as the giant’s soul, tramples it, kills and burns the yaksha
    and beetle. When the twelve-headed giant returns in pain, gold and silver fish
    emerge from his nostrils during sleep and Gessar kills them. Gessar severs eleven
    heads, hears his sisters warn him not to spare the giant, overcomes the giant’s
    bronze-hardening body by stabbing the heart through the belly, severs the last
    head, burns the body, and is praised by Aralgo.
  language: English
  quote_policy: summarized
