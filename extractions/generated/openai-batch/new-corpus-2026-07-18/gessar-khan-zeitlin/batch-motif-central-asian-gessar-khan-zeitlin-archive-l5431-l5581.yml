  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: After the maidens depart, Lady Rogmo declares that the figure is not an ancient
    lama but Gessar Khan, son of Kormuzda and her well-loved lord.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Gessar asks Rogmo to unveil herself; when she does, the grove is described
    as being lit by the sun, moon, and stars.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Gessar says the enchanted arrow will bear Rogmo to the Chatun Stream while
