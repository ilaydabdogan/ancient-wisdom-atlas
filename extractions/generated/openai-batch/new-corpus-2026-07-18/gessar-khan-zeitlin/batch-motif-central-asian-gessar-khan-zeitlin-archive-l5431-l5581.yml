canonical_text:
  quote: ''
  summary: Gessar approaches Shiraigol, sends Lady Rogmo's enchanted arrow ahead to
    destroy three extraordinary border sentinels, then disguises himself as an aged
    lama beside a spring in a grove. Lady Rogmo recognizes him, unveils herself, and
    is carried to the Chatun Stream by the enchanted arrow. Gessar releases a golden
    spider that circles the Shiraigol castle three times and announces vengeance,
    causing the three Khans to tremble.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gessar draws an enchanted arrow sent by Lady Rogmo and commands it to go before
    him to destroy the Shiraigol border sentinels.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Three sentinels guard the Shiraigol borders: one can see farther than a falcon
    can fly in three days, one can hear farther than a fox can run in three days,
    and one can reach farther than an army can march in three days.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Far-Reaching One instructs the other two sentinels to shelter behind him
    so he can seize the approaching arrow from the sky.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The enchanted arrow lifts the three sentinels aloft, plunges them into a rushing
    river, leaves them to perish, and later waits for Gessar on the river bank.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Near the Shiraigol castle, Gessar stops by a spring in a grove, transforms
    himself into an aged lama, transforms his steed into a beggar's oaken staff, and
    lies down as if asleep.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The daughters of the three Shiraigol Khans come to the grove and spring, play
