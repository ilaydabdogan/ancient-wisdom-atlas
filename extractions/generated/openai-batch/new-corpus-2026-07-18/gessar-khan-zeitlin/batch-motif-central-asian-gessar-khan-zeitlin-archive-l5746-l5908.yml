canonical_text:
  quote: ''
  summary: Gessar returns into Tibet with Lady Rogmo and the brown wonder-steed, disguises
    himself, Rogmo, and the steed, and learns that Chotong occupies his yurta and
    throne. Gessar creates a splendid encampment; Chotong sends Sanglun to demand
    tribute. Rogmo receives Sanglun hospitably and magically provides fodder for his
    weary speaking steed. Hidden behind a hanging, Gessar watches Sanglun recognize
    Gessar's blade and horn bowl and weep because he believes Gessar dead.
  language: English
  quote_policy: summarized
