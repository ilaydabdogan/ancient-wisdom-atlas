canonical_text:
  quote: ''
  summary: Shikeer learns that the Shiraigol Khans, through Chotong's treachery, have
    slain the thirty heroes and taken Lady Rogmo captive. Sanglun offers to join Shikeer
    in battle, but Shikeer tells him to await Gessar. From the Mountain of Sand, Shikeer
    sees the huge retreating host and Rogmo among them. Rogmo urges him to seek Gessar,
    who can restore the dead heroes, and promises to veil herself from her captors
    for a year before being forced to wed Prince Gereltu. Tsagan Khan taunts Shikeer
    into attacking. Shikeer slaughters many enemies, but the related horses of Shikeer
    and Tsagan refuse to fight one another. After Shikeer swoons from drinking blood-defiled
    water, Tsagan traps him with a felled pine and beheads him; Shikeer's life enters
    a hawk that flies away.
  language: English
  quote_policy: summarized
