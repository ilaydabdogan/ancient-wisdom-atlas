canonical_text:
  quote: ''
  summary: Gessar travels toward the realm of the twelve-headed giant who has stolen
    Lady Aralgo. He ascends a mountain and calls on his three sisters for counsel;
    they appear in cuckoo guise and warn him that he must first slay a huge wild bull.
    After darkness falls, the bull strips Gessar’s steed and arrows of their adornments.
    The sisters rebuke Gessar’s lament, restore the arrows, and tell him how to restore
    the steed. Gessar and his wonder-steed pursue the bull; Gessar shoots the mark
    on the bull’s brow and kills it.
  language: English
  quote_policy: summarized
