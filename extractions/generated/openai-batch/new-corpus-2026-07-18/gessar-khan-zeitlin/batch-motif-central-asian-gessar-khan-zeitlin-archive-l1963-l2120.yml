canonical_text:
  quote: ''
  summary: 'A smith reports to Gessar that the wife of China’s lord has died and that
    the grieving ruler refuses to release her body for funeral flames, imposing a
    kingdom-wide mourning edict. Gessar sets the smith an arduous threefold task:
    obtain blood from an eagle’s beak, milk from the eagle’s mate, and tears from
    the fledgling, each in a horn, within three days. Guided by a dream, the smith
    sets a snare at cow carrion near the River Nyrandsa, captures a black eagle, collects
    blood from its beak, and secures milk and tears from the eagle’s mate and fledgling
    as ransom for the captive eagle’s release. The smith then returns to Gessar.'
  language: English
  quote_policy: summarized
