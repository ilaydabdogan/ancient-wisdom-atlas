canonical_text:
  quote: ''
  summary: The passage narrates how Lady Rogmo, having pledged to wed the one who
    defeated her champions, is compelled to accept Yoro. Yoro seals the troth with
    blood from his finger and three horse-tail hairs tied at her throat. Rogmo flees
    by night toward her father’s realm, but Yoro is discovered sitting behind her
    in darkness. Near Sengeslu Khan’s kingdom, Yoro raises a dust cloud that leads
    Sengeslu to expect an eminent suitor; when Rogmo arrives with Yoro, her father
    mocks him and his knights abuse him. In Tibet, Chotong gathers nobles, accuses
    Yoro of guile, rides to Sengeslu Khan, and demands that Rogmo be yielded up, threatening
    violence. Sengeslu, though recognizing Yoro’s victory in the challenge, consults
    his ministers in fear.
  language: English
  quote_policy: summarized
