canonical_text:
  quote: ''
  summary: Gessar drinks a draught of forgetfulness from Lady Aralgo. On the same
    day, the three Shiraigol Khans seek a bride for Prince Gereltu and send animal
    couriers to foreign lands. The raven reports the surpassing beauty of Lady Rogmo,
    Gessar’s wife, and advises seizing her while Gessar is away. The Khans transform
    into a huge vulture and arrive at Rogmo’s yurta. Rogmo summons the Tiger-hero,
    but he loses courage; his shot only strikes the vulture’s wing, and the bird circles
    above Rogmo before vanishing.
  language: English
  quote_policy: summarized
