canonical_text:
  quote: ''
  summary: Chotong finds Aralgo in the Valley of Pleasant Winds, twice attempts to
    persuade her to pledge herself to him, and is rejected. Aralgo’s servants beat
    and expel him. Seeking revenge, Chotong performs a long vigil at the Cavern of
    Curses, receives dream guidance from its spirit, returns under that spirit’s protection,
    and begins to recruit the discontented swineherds of Aralgo’s household.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aralgo, called the Lady of Ten Thousand Joys, dwells in the Valley of Pleasant
    Winds, described as a month’s journey from Tibet.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chotong learns Aralgo’s hiding place, mounts his russet mare, travels there,
    and finds her at the threshold of her yurta watching her flocks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chotong tells Aralgo that Gessar has forsaken her for Lady Rogmo and asks
    her to pledge herself to him, promising her authority over his household and wives.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aralgo rejects Chotong’s proposal, invokes the blue heavens and mother earth
    as witnesses, and declares that many Chotongs would be less to her than Gessar’s
    shadow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Aralgo invites Chotong into the yurta, gives him food and sweet tea, and sends
    him away in peace.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: After seven days Chotong returns to the Valley of Pleasant Winds and again
    asks Aralgo to pledge herself to him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Aralgo says Chotong alone has offended against her and orders her vassals
    and herdsmen to beat him from the Valley with staff and scourge.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The servants beat Chotong, take his russet mare, and drive him from the Valley
    on foot; his injuries delay his return to Tibet for three full moons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After healing, Chotong equips himself with weapons and food for a hundred
    days and goes to the Cavern of Curses to ask its spirit for dream-guidance in
    taking revenge on Aralgo.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Chotong waits before the Cavern of Curses for thrice three and thirty days,
    then complains that no sign has come and that his food and patience are gone.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Spirit of the Cavern appears to Chotong in a dream and reveals how he
    should take vengeance on Aralgo.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: When Chotong returns to the Valley, herdsmen gather their flocks and place
    themselves among them; Chotong asks about the condition of the flocks.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A leader of the herdsmen rallies Aralgo’s servants, saying that Chotong has
    come to rob the herds and carry away their mistress.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: The herdsmen beat Chotong again, but their blows do not harm him because he
    is guarded by the Spirit of the Cavern; they then release him and drive him out.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: At night Chotong goes to the marshland where Aralgo’s swineherds tend swine
    and asks whether they are content with their lot.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: The swineherds complain that they must remain in a foul morass while other
    herdsmen pasture animals in better places or travel freely.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:17
  text: Chotong promises the swineherds that if they obey him, other herdsmen will
    bow before them and none of the tribe will be exalted above them.
  category: speech
  evidence_refs:
  - ev:14
