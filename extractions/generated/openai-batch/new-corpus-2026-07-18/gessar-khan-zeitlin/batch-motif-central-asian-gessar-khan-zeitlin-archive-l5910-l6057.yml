canonical_text:
  quote: ''
  summary: Gessar privately reveals to Sanglun that he lives and will return to avenge
    wrongs. Sanglun departs with a transformed speaking steed, then denounces Chotong,
    who has occupied Gessar's throne and has Sanglun beaten. Sanglun tells Amurtsheela
    of signs of Gessar's survival. Amurtsheela visits the stranger camp and recognizes
    Gessar as her son, citing his divinely granted power of transformation and his
    unhidden forty-five teeth. Gessar sends Amurtsheela and Rogmo to watch from a
    height, confronts Chotong, casts off a merchant disguise, appears armed and splendid,
    and summons colliding clouds whose whirlwind removes Chotong's yurta to the mountain
    ridge.
  language: English
  quote_policy: summarized
