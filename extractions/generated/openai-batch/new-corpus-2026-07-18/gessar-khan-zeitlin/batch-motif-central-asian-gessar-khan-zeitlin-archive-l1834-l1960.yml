canonical_text:
  quote: ''
  summary: Keeme Khan's wife dies, and his grief produces a harsh mourning edict for
    the kingdom. His ministers propose cremation, Buddhist rites, almsgiving, and
    remarriage, but cannot identify anyone able to comfort him. A meddlesome baldheaded
    smith overhears, names Gessar Khan as the only healer, gains authorization to
    travel, and reaches Gessar's yurta in Tibet, where Gessar frightens him and asks
    his purpose.
  language: English
  quote_policy: summarized
