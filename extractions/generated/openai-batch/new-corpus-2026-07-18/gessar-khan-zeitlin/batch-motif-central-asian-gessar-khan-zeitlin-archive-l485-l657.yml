canonical_text:
  quote: ''
  summary: A heavenly council considers which son of Kormuzda should descend to earth.
    Ameen declines, while Weele praises Tagus as the strongest and most worthy. Tagus
    accepts the task and asks for celestial armor, weapons, guardian dakeeni, a chosen
    companion, lesser gods as comrades, and a wonder-steed. Kormuzda grants these
    and declares that Tagus will be born on earth as Yoro, later Gessar Khan, son
    of heaven and minister of Buddha. The passage then shifts to Tibet, where Chotong
    betrays his brother Sanglun, attacks Bayan, captures Amurtsheela, seizes spoils,
    slanders Sanglun and Amurtsheela, and banishes them to the place where three rivers
    meet. In exile, Amurtsheela hears a voice announcing that at the full moon she
    will bear three daughters and a son destined for lofty deeds.
  language: English
  quote_policy: summarized
