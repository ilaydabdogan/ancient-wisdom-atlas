canonical_text:
  quote: ''
  summary: 'Chotong, angry with his countrymen, plunders enemy herds but is captured
    by Ulan of the Red Eyes. Before the Shiraigol Khans he begs for his life and proposes
    a deception: he will return with old Shiraigol steeds and falsely report that
    the enemy has retreated, causing Shikeer to disband the armies and Lady Rogmo
    to hold a victory feast. Chotong carries out the lie. Lady Rogmo warns Shikeer
    not to trust him, citing Gessar''s earlier warning, but Shikeer dismisses the
    warning. The hosts disband, the thirty heroes feast and sleep, and Arigon, sent
    to scout, sees the Shiraigol forces advancing but is killed by an arrow before
    he can give warning.'
  language: English
  quote_policy: summarized
