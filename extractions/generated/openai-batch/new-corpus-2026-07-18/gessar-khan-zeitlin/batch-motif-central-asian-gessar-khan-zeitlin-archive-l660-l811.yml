canonical_text:
  quote: ''
  summary: Amurtsheela asks Sanglun to remain because of forebodings, but he leaves
    to hunt and pasture animals. She gives birth first to three radiant daughters,
    who are carried upward to Sumeru by three richly adorned elephants amid drums,
    cymbals, and incense. She then gives birth from beneath her arm to a marked son
    who speaks at once and explains his bodily signs as powers against evil, shimnus,
    and unrighteousness and as signs of Buddha’s law. Sanglun returns, hears the commotion,
    and, after seeing an extraordinary catch of hares, proposes to shelter and name
    the child Yoro. Yoro grows, tends herds, ritually strikes animals with plants,
    and commands their multiplication. Sanglun’s sons Shikeer and Rongsa return from
    Chotong’s bondage. Later, Yoro slaughters nine wethers, arranges their flesh,
    bones, and skins, builds a fire with incense, invokes several divine groups, and
    identifies himself as Tagus born among men before the passage breaks off.
  language: English
  quote_policy: summarized
