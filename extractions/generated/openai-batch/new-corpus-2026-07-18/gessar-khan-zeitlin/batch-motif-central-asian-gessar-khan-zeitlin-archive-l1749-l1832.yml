canonical_text:
  quote: "“Bow down before me, for I am Kormuzda’s son!”"
  summary: Gessar recounts a series of extraordinary deeds, presents them as signs
    that he was marked by the gods, proclaims himself Kormuzda’s son and Buddha’s
    servant, and commands all people to bow. He describes himself as righteous judge,
    war leader, conqueror, and healer. The people bow in awe, and Lady Rogmo rejoices
    at his glory.
  language: English
  quote_policy: quoted
