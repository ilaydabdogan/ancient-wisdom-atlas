canonical_text:
  quote: ''
  summary: Gessar reaches a pleasant valley and then a high mountain, where he wishes
    to rest and look upon the world. His three sisters appear and remind him of his
    sacred identity, divine parentage, and duty. Gessar descends, sends a dream to
    Lady Rogmo announcing his approach, and is welcomed by Rogmo, Arigon, his kin,
    heroes, and chieftains with gifts and a feast. He remains among his people and
    rules wisely according to Buddhist law.
  language: English
  quote_policy: summarized
