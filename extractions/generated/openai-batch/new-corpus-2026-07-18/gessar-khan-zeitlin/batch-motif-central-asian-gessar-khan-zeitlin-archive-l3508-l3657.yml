canonical_text:
  quote: ''
  summary: Aralgo warns Gessar about a fearful giant, hides him beneath a jewel-covered
    pit, and induces the giant to reveal the conditions of his death. The giant says
    Gessar must first kill his younger sister in the Tree of Delight, his elder yaksha
    sister in the west, destroy a beetle that is his guarded soul, kill golden and
    silver fish that emerge from his nostrils during sleep, and cut off his twelve
    heads. After the giant departs, Gessar summons the brown wonder-steed from heaven,
    rides east to the Tree of Delight, and begins to entice the giant’s tree-dwelling
    younger sister with praise and a talisman-necklet.
  language: English
  quote_policy: summarized
