    slain him and that they should retaliate against the Khan’s kingdom.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Gessar releases the parrot but does not release the silken thread, instead
    binding the thread to his wrist.
  category: action
  evidence_refs:
  - ev:5
