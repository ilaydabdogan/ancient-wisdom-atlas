  text: The chief minister says Gessar has survived the wasp’s sting, the serpent’s
    fang, and the jaws of the wild beast, and argues that this shows the gods cherish
    him and will not let evil approach him or his followers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Keeme Khan and the people ask Gessar to recall the parrot and promise him
    whatever boon lies nearest his heart.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Gessar demands that Keeme Khan burn the body of his khanin, take another spouse,
    and give him Aralgo, the Khan’s daughter called Ten Thousand Joys, as his second
    wife; Keeme Khan agrees.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Gessar calls the parrot back, draws in the silken thread, and the crimson
    parrot returns from the western sky to his hand.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Keeme Khan has the khanin’s body delivered to the flames; lamas read the holy
    word of Buddha over her ashes for forty-nine days, alms are given, the Khan takes
    another wife, and Aralgo is bestowed on Gessar.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A feast is held with gongs and drums, and the people rejoice that Gessar has
    healed the spirit of Keeme Khan.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: After three years in China with Aralgo, Gessar says he has healed her father’s
