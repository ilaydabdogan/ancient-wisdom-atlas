canonical_text:
  quote: ''
  summary: After surviving Keeme Khan’s Den of Wild Beasts, Gessar is ordered to the
    ramparts for execution. He releases a crimson parrot toward Tibet with a threatened
    message of revenge, while secretly retaining a long silken thread tied to it.
    Ministers and people persuade Keeme Khan to bargain for the parrot’s recall. Gessar
    demands the cremation of the khanin’s body and the hand of Aralgo, the Khan’s
    daughter. The parrot returns, the rites and marriage are carried out, and after
    three years Gessar prepares to return toward Tibet while settling Aralgo in the
    Valley of Pleasant Winds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gessar kills or overcomes beasts in the Den of Wild Beasts, uses the blood
    of a black eagle so that others perish from its odor, and makes a saddle from
    the skin of a mighty tiger for his brown wonder-steed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At dawn Gessar declares that the Khan of China sought to kill him in the Den
    of Wild Beasts, but that Gessar killed the wild beasts instead.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Keeper of the Den reports Gessar’s words to Keeme Khan, who becomes angry
    and orders Gessar taken to the ramparts where twenty-four spearmen are to execute
    him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: As Gessar is led to the ramparts, a crimson parrot alights on his hand; he
    fastens to its leg a thousand-fathom silken thread that is visible only to him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the ramparts Gessar instructs the parrot to go to Tibet and tell Shikeer,
