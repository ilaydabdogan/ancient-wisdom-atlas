    gods as his mate.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Gessar plans to return to his country and to settle Aralgo in the Valley of
    Pleasant Winds with vessels, household goods, flocks, and vassals if she pledges
    constant faith; Aralgo pledges this and they depart from Keeme Khan.
  category: sequence
  evidence_refs:
  - ev:10
