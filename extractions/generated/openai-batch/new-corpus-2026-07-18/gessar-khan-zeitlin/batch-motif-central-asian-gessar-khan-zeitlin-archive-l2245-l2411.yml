candidate_motifs:
- id: motif:1
  label: Hero survives repeated lethal ordeals
  taxonomy_refs: []
  basis: The passage states that Gessar survives the Den of Wild Beasts and recalls
    earlier failed death attempts involving a wasp, serpent, and wild beast.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  confidence: high
  cautions: The passage summarizes some prior ordeals rather than narrating all of
    them in full within this line range.
- id: motif:2
  label: Animal messenger controlled by hidden tether
  taxonomy_refs:
  - trickster_boundary
  basis: Gessar sends a parrot as if it will carry an irreversible message to Tibet,
    but secretly keeps a long silken thread tied to it and later recalls it.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:8
  confidence: medium
  cautions: The trickster_boundary taxonomy fit is functional and tentative; the passage
    does not label Gessar as a trickster.
- id: motif:3
  label: Boon exchange averts retaliatory destruction
  taxonomy_refs:
  - sacred_exchange
  basis: Keeme Khan promises any boon if Gessar recalls the parrot, after the threatened
    message invokes transgression against the gods and Gessar; the recall prevents
    the threatened invasion.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The exchange is also explicitly political and coercive; the sacred element
    comes from the passage’s references to gods, Buddha, and atonement.
- id: motif:4
  label: Royal daughter given in marriage after conflict
  taxonomy_refs: []
  basis: Gessar demands Aralgo, Keeme Khan’s daughter, as his second wife, and Keeme
    Khan grants her hand during the settlement.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage does not explicitly frame the marriage as dynastic legitimacy
    or sacred marriage.
- id: motif:5
  label: Funerary fire and Buddhist rite restore social peace
  taxonomy_refs: []
  basis: The khanin’s body is burned, lamas read over her ashes for forty-nine days,
    alms are distributed, and the people rejoice that Gessar healed Keeme Khan’s spirit.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The causal relation between rites and healing is implied by sequence and
    public rejoicing, but not analytically explained by the narrator.
- id: motif:6
  label: Divinely sanctioned peace-bringing hero
  taxonomy_refs:
  - culture_hero
  basis: Gessar’s message describes him as sent by Buddha to uproot tenfold evil and
    bring peace, while others call him chosen of the gods.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: Some statements occur in Gessar’s strategic speech or in appeals by others,
    so the extraction treats the motif as passage-supported but rhetoric-inflected.
- id: motif:7
  label: Hero’s return after foreign sojourn
  taxonomy_refs:
  - return
  basis: After three years in China, Gessar says his heart hungers for his people
    and Lady Rogmo and announces that he will return to his country.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage begins the return movement but does not narrate arrival back
    in Tibet.
