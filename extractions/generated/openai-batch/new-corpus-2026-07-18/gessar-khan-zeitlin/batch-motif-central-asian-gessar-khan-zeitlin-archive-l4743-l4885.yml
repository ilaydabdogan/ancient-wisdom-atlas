canonical_text:
  quote: ''
  summary: The Shiraigol forces attack Gessar’s sleeping heroes. The heroes fight
    on foot but are killed, including the Tiger-hero, Nantsong, Shumar, and finally
    Bodotshi the Fire-hero, who destroys many enemies before being consumed by his
    own fire. Lady Rogmo arms herself with Gessar’s enchanted golden arrows and a
    steel sabre, kills many attackers, attempts to escape by transforming into a wasp,
    but is overcome when the three Shiraigol Khans transform into hawks. Taken captive,
    she sends an eyebrow hair on the wind to Shikeer, reporting Chotong’s betrayal,
    the deaths of the heroes, and her capture.
  language: English
  quote_policy: summarized
