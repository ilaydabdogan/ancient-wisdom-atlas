canonical_text:
  quote: "“Gessar’s Falcon-hero perishes of thirst and a bitter wound in his side.”"
  summary: After a bargain involving a stallion, Nantsong the Falcon kills many enemies,
    returns to the battlefield to take queues from the dead, is treacherously wounded
    by Teergen, mortally wounds Teergen in return, then collapses on the way to the
    Mountain of Sand. His dappled steed guards him from wolves and ravens, negotiates
    with the ravens, and sends them to warn Shikeer and the Tibetan warriors, who
    cry out for vengeance.
  language: English
  quote_policy: quoted
