candidate_motifs:
- id: motif:1
  label: deceptive contest used to wound a hero
  taxonomy_refs: []
  basis: Teergen frames the encounter as an archery wager involving geese but shoots
    Nantsong when he looks upward.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage supports deception in a martial contest, but no external motif
    index is supplied.
- id: motif:2
  label: wounded hero who still defeats the attacker
  taxonomy_refs: []
  basis: After being pierced through the body, Nantsong binds his wound and shoots
    Teergen through the skull.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: Nantsong is gravely wounded but not described as dead or resurrected.
- id: motif:3
  label: enemy kept alive long enough to report defeat
  taxonomy_refs: []
  basis: Nantsong’s arrow leaves Teergen with enough life to return to the Shiraigol
    camp, tell the story of his downfall, and then die.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage presents this as Nantsong’s declared intention and its fulfillment;
    broader comparative placement is not asserted.
- id: motif:4
  label: faithful horse supports and guards wounded master
  taxonomy_refs: []
  basis: The dappled steed supports Nantsong in the saddle, guards his fallen body
    from wolves and ravens, and refuses to abandon him.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The horse is a speaking and fiery guardian in this passage; no separate
    taxonomy family is available for loyal animal helper.
- id: motif:5
  label: animal scavengers turned into messengers
  taxonomy_refs: []
  basis: Ravens that initially approach to pluck out Nantsong’s eyes are persuaded
    by the steed to carry a warning to Shikeer.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: Only the ravens, not the wolves, become messengers.
- id: motif:6
  label: call for vengeance after a hero’s injury
  taxonomy_refs: []
  basis: After the ravens announce Nantsong’s condition, the warriors draw swords
    and shout for vengeance.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage ends with the cry for vengeance and does not show the subsequent
    retaliatory action.
- id: motif:7
  label: martial return to a mountain stronghold
  taxonomy_refs:
  - return
  basis: Several movements in the passage are directed back to the Mountain of Sand,
    including Shumar’s withdrawal, Nantsong’s attempted return, and the ravens’ warning
    to Shikeer there.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  - ev:10
  confidence: medium
  cautions: The available taxonomy term 'return' is broad; the passage shows movement
    toward a named mountain base rather than a completed heroic homecoming.
