canonical_text:
  quote: ''
  summary: 'After killing the Wild Bull, Gessar is stopped by his sisters from eating
    its flesh before making sacrifice. He offers the flesh with fire and incense,
    then proceeds alone through supernatural obstacles toward the twelve-headed giant’s
    mountain castle: an enchanted river, crushing rock walls, and guarded ridges.
    He encounters a herdsman and then the sons of the shining gods, who say they were
    seized by the giant and forced to guard the pearly ridge.'
  language: English
  quote_policy: summarized
