  text: Sheera warns that Gessar is said to be a god in mortal skin and that his thirty
    heroes are formidable warriors.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Chara warns that capturing the chosen wife of Kormuzda’s son would be a deed
