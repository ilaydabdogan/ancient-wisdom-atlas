canonical_text:
  quote: ''
  summary: Yoro offers a sacrifice that summons divine visitors, is falsely accused
    by Rongsa, restores the slaughtered wethers, and resists Sanglun's punishment.
    After the household prospers and relocates to Nulumtala, Chotong sends Yoro and
    his mother toward the seven man-devouring alwins. Shikeer pledges loyalty, and
    Yoro privately reveals that he is Gessar Khan, son of heaven, sent by Buddha to
    uproot evil.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A divine assembly identifies the caller as Tagus, puts off divine shining
    forms, takes mortal appearance, and attends Yoro's sacrificial feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rongsa reports to Sanglun that Yoro killed nine wethers, placed flesh in an
    earthen vessel, called on gods, buddhas, and dragons, and welcomed horsemen to
    a feast.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the guests eat and return skyward, Yoro swings each slaughtered ram's
    skin three times around his head, and the rams stand again among the flock.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Sanglun comes in anger, Yoro takes the lash from him and throws it into
    the earth, where it is said to lie fifty fathoms deep.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Amurtsheela defends Yoro by saying the herds multiplied after his arrival;
    Sanglun counts the animals and finds none missing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sanglun punishes Rongsa for false reporting and says Yoro has guarded the
    herds while they increased across the mountainside.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sanglun leaves the place where the three rivers meet and reaches the border
    of Nulumtala after nine days of travel.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Chotong sees Sanglun's snowy yurta and abundant cattle; Yoro tells Chotong
    that the gods blessed Sanglun because Chotong had wronged him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Chotong orders Yoro to go to the country of the seven alwins, who devour large
    numbers of humans and animals, and tells him to take his mother too.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Yoro accepts Chotong's task; Amurtsheela protests the danger, while Shikeer
    asks to go with Yoro whether the journey leads to death or life.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: Yoro privately tells Shikeer that he is Gessar Khan, son of heaven, sent by
    Buddha to uproot tenfold evil and restore human gladness, but that he must remain
    unrevealed until his fifteenth year except to Shikeer.
  category: speech
  evidence_refs:
  - ev:12
