canonical_text:
  quote: ''
  summary: The passage first gives contents headings about Chotong's treachery, Lady
    Rogmo's capture, Gessar's rescue, punishment of Chotong, and return to rule. It
    then opens the narrative with Kormuzda, father of the gods, worshipping Buddha.
    Buddha commands him to send one of his three sons to earth in mortal guise after
    five hundred years to end human disorder. Kormuzda forgets the command; a wall
    of his heavenly kingdom collapses, which he understands as divine chastisement.
    He sends a messenger to his sons Ameen, Weele, and Tagus. Ameen and Weele refuse;
    Tagus wishes to obey but hesitates out of deference to his elder brothers. Kormuzda
    rebukes the three sons before the gods.
  language: English
  quote_policy: summarized
