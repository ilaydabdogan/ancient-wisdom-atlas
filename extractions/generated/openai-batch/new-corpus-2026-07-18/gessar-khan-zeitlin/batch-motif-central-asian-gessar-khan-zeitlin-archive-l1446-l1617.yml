canonical_text:
  quote: ''
  summary: Sengeslu Khan decrees a horse race for Lady Rogmo’s hand. Yoro invokes
    Kormuzda, receives the brown wonder-steed in the humble form of a shrunken foal,
    wins the race, and is proclaimed winner a second time. The Tibetan princes then
    require the slaying of the Wild Boar of the Wilderness as another bridal test.
    Yoro kills the boar, but Chotong persuades him to hand over the boar’s tail and
    then falsely claims the deed and Rogmo.
  language: English
  quote_policy: summarized
