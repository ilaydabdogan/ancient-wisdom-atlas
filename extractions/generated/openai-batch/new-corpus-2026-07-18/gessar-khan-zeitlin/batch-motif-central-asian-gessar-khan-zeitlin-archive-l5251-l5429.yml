canonical_text:
  quote: ''
  summary: Gessar confronts Aralgo at the giant's castle, destroys the castle with
    a world-shaking cry and fire, retrieves his armor, and departs with Aralgo. He
    finds the brown wonder-steed, hears of its harsh captivity by Aralgo, and punishes
    Aralgo by giving her false food and drink and transporting her to the Lonely Desert.
    In the wilderness, Gessar encounters a human-headed, hawk-bodied figure who identifies
    himself as Shikeer, Gessar's brother, and says his spirit cannot rest until Gessar
    avenges him. Gessar departs to win repose for Shikeer's spirit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
