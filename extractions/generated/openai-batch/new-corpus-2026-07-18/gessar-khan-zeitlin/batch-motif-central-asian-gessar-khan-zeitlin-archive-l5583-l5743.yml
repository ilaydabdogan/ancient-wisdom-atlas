canonical_text:
  quote: ''
  summary: Tsagan Khan orders ten thousand warriors to assemble against Gessar, but
    Gessar's lightning-sword destroys them in the castle court. Gessar appears on
    his wonder-steed, accuses the Shiraigol Khans of invading his realm, killing his
    heroes, scattering his people, and taking his wife captive, then challenges them.
    He kills Tsagan Khan in a sword duel, Sheera Khan in an archery exchange, and
    Chara Khan in a wrestling contest. After taking vengeance, he leaves the Shiraigol
    land, rejoins Lady Rogmo at the Chatun Stream, and they travel toward Tibet.
  language: English
  quote_policy: summarized
