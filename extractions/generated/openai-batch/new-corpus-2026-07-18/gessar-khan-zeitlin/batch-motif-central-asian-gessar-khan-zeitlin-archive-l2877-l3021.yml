canonical_text:
  quote: ''
  summary: Aralgo tells the twelve-headed giant that she sought him after Gessar withdrew
    favor. The giant claims her as wife, carries her to his mountain castle, devours
    most of his existing wives, and seats Aralgo beside him. Gessar, restored after
    disease and suffering, learns Aralgo has left the Valley of Pleasant Winds, rejects
    counsel against leaving, declares he will punish betrayal or rescue her if taken
    by force, and arms himself with his wonder-steed while Rogmo provisions and exhorts
    them.
  language: English
  quote_policy: summarized
