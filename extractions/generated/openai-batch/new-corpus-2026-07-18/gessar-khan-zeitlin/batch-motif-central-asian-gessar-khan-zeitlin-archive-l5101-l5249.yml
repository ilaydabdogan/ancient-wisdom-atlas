canonical_text:
  quote: ''
  summary: While captive, Lady Rogmo sends Gessar Khan a blood-written message on
    a golden arrow. Gessar remains at the giant’s castle under Lady Aralgo’s watch
    while his wonder-steed is imprisoned. Warnings from an old woman and a rook trouble
    him; the arrow arrives and reveals Shikeer’s disappearance, the death of the thirty
    heroes, and Rogmo’s captivity by the three Shiraigol Khans. Gessar’s awareness
    returns, the wonder-steed breaks free and rebukes him, and Gessar prepares to
    depart on a copper-green mule after asking Aralgo for his war gear.
  language: English
  quote_policy: summarized
