canonical_text:
  quote: ''
  summary: Yoro travels with his mother to the country of the seven alwins, makes
    seven magic wands, uses an inexhaustible hare-and-tea feast to weigh the alwins
    down, and persuades them to ride the wands. The wands carry them through sky,
    mountain, and sea, then throw them into the ocean depths where dragon-princes
    capture them. Yoro returns with his mother and the alwins' steeds. At Chotong's
    betrothal feast for Altantu and Lady Kimsun, Yoro and his mother are not welcomed
    or fed. Chotong refuses Yoro food, curses him, and sends a wasp from his nostril
    to kill him. Yoro captures the wasp, which contains Chotong's soul, causing Chotong
    to collapse and rise according to the wasp's condition. Lady Kimsun pleads for
    Chotong, but Yoro rebukes her unveiled appearance and turns away.
  language: English
  quote_policy: summarized
