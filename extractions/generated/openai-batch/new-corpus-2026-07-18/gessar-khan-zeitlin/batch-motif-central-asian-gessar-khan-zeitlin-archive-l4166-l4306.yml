canonical_text:
  quote: ''
  summary: Shumar and allied Tibetan heroes encounter wounded forest animals driven
    by the Shiraigol forces, hold counsel at the Mountain of Sand, divide their army
    into three attacks, and rout parts of the enemy host. After Shumar captures steeds
    from Sheera Khan's forces, Mergen of the Six Thumbs pursues him. Shumar demonstrates
    a marvelous archery feat by sending an arrow through a mountain to kill three
    eagles and return. Mergen asks for horses, and Shumar demands Mergen's anvil-bound
    stallion, threatening force when Mergen refuses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the Mountain of Sand, Shumar sees what first appears as a monstrous northern
    cloud but is then identified as a horde of forest beasts, some whole and some
    wounded.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A buzzard with a torn wing says the Shiraigol hosts encamped on the Chatun
    Stream drove the forest beasts before them, killing and wounding many.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shumar looks toward the Chatun Stream and says the enemy cannot be overcome
    because their numbers are like stars fallen to earth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nantsong rebukes Shumar's fear and questions whether their own power is scant.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lord Shikeer praises Nantsong and orders the army divided into three parts,
    assigning himself to Tsagan Khan, Shumar to Sheera Khan, and Nantsong to Chara
    Khan.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Shikeer specifies different trophies for enemies slain: sundered heads, right
    thumbs, and right ears.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The allied forces divide into three parts and command their steeds to rush
    like torrents and leap like wolves into the foe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The steeds answer with three yawns, three tail-waves, and three strikes of
    their forefeet before charging.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The battle is described with swords like flame, arrows like those of angry
    gods, chargers snorting dense smoke, enemy standards struck into dust, riders
    unhorsed, and foot soldiers trampled.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Shikeer and his warriors kill many men of Tsagan Khan's army and drive captured
    steeds back toward the Mountain of Sand.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Shumar and his warriors kill many men of Sheera Khan's army and drive captured
    steeds toward the Mountain of Sand.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A horseman riding a stallion with anvils bound to its feet overtakes Shumar
    and identifies himself as Mergen of the Six Thumbs, who can shoot six arrows at
    once.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Mergen demands the return of the captured steeds and threatens to shoot six
    arrows into Shumar and take Shumar's head to Sheera Khan.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Shumar refuses to return the steeds, insults Mergen's archery, and accepts
    a trial of skill by pointing to three eagles over a mountain.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Shumar's arrow enters the foot of the mountain, emerges at the crest, kills
    each of the three eagles, and returns to Shumar.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Mergen declines to challenge Shumar after witnessing the arrow feat and asks
