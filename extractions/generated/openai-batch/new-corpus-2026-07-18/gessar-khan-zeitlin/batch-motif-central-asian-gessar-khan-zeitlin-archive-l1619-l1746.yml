canonical_text:
  quote: ''
  summary: Yoro exposes Chotong’s false victory claim by producing missing strands
    from a boar-tail token. A messenger reports the Garuda Bird in a pine; a soothsayer
    interprets this as a heavenly omen that Sengeslu Khan’s daughter should be given
    to the one who can pluck the bird’s golden plumage. The assembled heroes fail
    by force, while Yoro flatters the bird into coming near and plucks two golden
    feathers. He binds them in Lady Rogmo’s headdress, after which divine signs occur
    and Yoro is revealed as Gessar Khan, heaven-sent and armed in splendor.
  language: English
  quote_policy: summarized
