  quote: My kingdom is not of this world
  summary: Pilate declares that he finds no fault in Jesus. The Jews reject this and
    say Jesus was brought because he is wicked, while also saying they cannot lawfully
    put anyone to death. Pilate questions Jesus privately about kingship. Jesus says
    his kingdom is not of this world and that he came to bear witness to the truth.
    Pilate asks what truth is, and Jesus says truth is from heaven and is also on
    earth among those who judge rightly.
