canonical_text:
  quote: ''
  summary: The passage exhorts the addressees to remain united with their bishop and
    the church, avoid deceptive teachers and perverse doctrine, confess Jesus Christ
    as the one Physician with divine and human attributes, and understand themselves
    as temple stones drawn upward by the Cross, with the Holy Ghost as rope, faith
    as support, and charity as the way to God.
  language: English
  quote_policy: summarized
