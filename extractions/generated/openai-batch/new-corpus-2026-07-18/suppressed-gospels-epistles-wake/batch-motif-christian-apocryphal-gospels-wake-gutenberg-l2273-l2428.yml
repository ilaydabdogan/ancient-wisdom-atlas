canonical_text:
  quote: O mountain of the Lord, receive the mother with the child.
  summary: Herod orders the killing of young children in Bethlehem. Mary hides her
    child in an ox-manger. Elizabeth takes John to the mountains; after she asks the
    mountain to receive them, it opens and an angel appears to preserve them. Herod
    seeks John through Zacharias, who refuses to reveal his son and is murdered at
    the temple. Priests discover congealed blood, hear a heavenly voice, and find
    the body gone while the blood has hardened like stone. Israel mourns for three
    days, and Simeon is chosen by lot to succeed Zacharias. A closing note attributes
    the history to James.
  language: English
  quote_policy: quoted
