  quote: ''
  summary: An angel appears to Anna and announces that she will bear a daughter named
    Mary, blessed above all women and devoted to temple service. The angel also foretells
    that Mary, remaining a virgin, will bring forth the Lord, the Saviour of the world.
    Anna is told to go to Jerusalem's golden gate as a sign, where she meets Joachim.
    They rejoice, praise the Lord, return home, and Anna conceives and bears Mary.
