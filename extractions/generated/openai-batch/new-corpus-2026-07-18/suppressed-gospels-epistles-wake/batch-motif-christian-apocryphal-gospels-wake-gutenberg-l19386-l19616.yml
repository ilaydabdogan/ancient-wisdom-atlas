- id: obs:3
  text: Hermas sees the old woman from the previous year walking and reading in a
    book; she asks whether he can tell these things to the elect of God and gives
    him the book after he asks for it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
