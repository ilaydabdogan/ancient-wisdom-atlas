  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The writing exhorts workers of righteousness to continue so that their departure
    may be with the holy angels, warns of a great trial, and states consequences for
    denying the Lord and his Son.
  category: speech
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:11
  text: Hermas is told not to remember the evils done by his sons, to care for the
