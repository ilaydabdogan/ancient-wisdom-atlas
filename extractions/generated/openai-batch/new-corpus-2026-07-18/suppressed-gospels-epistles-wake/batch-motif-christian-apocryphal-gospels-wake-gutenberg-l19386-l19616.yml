  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The writing states that Hermas's wife will obtain mercy if she refrains herself,
    and that his household and the saints who have sinned will be forgiven if they
    repent with all their hearts and remove doubts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The writing says the Lord has sworn concerning his elect, sets an end to repentance
