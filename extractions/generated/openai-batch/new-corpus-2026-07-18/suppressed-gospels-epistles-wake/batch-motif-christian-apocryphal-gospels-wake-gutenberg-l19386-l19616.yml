canonical_text:
  quote: ''
  summary: Hermas recounts a second vision in which a spirit brings him back to the
    place of a former vision. An old woman gives him a book to copy; the book is then
    taken away by an unseen agent, and after fasting Hermas receives understanding
    of the writing. The revealed message rebukes his household, calls for repentance,
    warns of a coming trial and judgment, and exhorts church leaders and the righteous.
    A young man later explains that the old woman is not a Sibyl but the Church of
    God, ancient because she was first of creation. In a further home vision, the
    old woman instructs Hermas to write and distribute books to Clement, Grapte, and
    the elders.
  language: English
  quote_policy: summarized
