canonical_text:
  quote: ''
  summary: Charinus and Lenthius report that, after being raised from the dead with
    Jesus Christ, they were allowed only three days on earth and were commanded by
    the archangel Michael to pray, remain silent until permitted, testify to Christ's
    resurrection, and go beyond Jordan. They write separate accounts that agree exactly,
    hand them to named recipients, change into white forms, and disappear. The Jewish
    assembly reacts with fear and praise; Joseph and Nicodemus report the events to
    Pilate, who records them publicly.
  language: English
  quote_policy: summarized
