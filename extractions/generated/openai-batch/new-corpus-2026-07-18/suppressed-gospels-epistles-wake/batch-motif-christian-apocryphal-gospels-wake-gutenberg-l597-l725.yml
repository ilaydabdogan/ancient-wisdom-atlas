canonical_text:
  quote: ''
  summary: Mary, described as the Virgin of the Lord, grows in perfection under divine
    care and daily angelic visitation. At age fourteen, a high-priest orders temple
    virgins to leave and marry according to custom, but Mary refuses because she and
    her parents have devoted her to the Lord and she has vowed virginity. The high-priest
    summons leading persons to seek divine counsel. A voice from the ark and mercy
    seat directs them to use Isaiah's prophecy of a rod from Jesse, a flower, and
    the resting Spirit. The high-priest commands unmarried marriageable men of David's
    house to bring rods to the altar; the man whose rod flowers and upon whose rod
    the Spirit rests in the appearance of a dove is to be betrothed to Mary.
  language: English
  quote_policy: summarized
