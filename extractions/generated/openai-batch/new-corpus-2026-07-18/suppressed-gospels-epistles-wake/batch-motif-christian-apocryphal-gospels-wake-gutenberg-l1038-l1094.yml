  quote: "“prayer shall be my meat and drink.”"
  summary: Joachim, a rich man, makes offerings to the Lord. At a feast, Reuben the
    high priest opposes his offering because Joachim has not begotten issue in Israel.
    Joachim checks the tribal records, remembers that Abraham received Isaac late
    in life, becomes distressed, avoids his wife, withdraws to the wilderness, pitches
    a tent, and fasts forty days and nights while waiting for God to look down upon
    him.
