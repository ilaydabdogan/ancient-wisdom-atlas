  quote: I will cause you both to drink the water of the Lord, which is for trial
  summary: Annas sees Mary pregnant and reports Joseph to the priest. Mary and Joseph
    are tried; both deny sexual wrongdoing. The priest invokes Mary's sacred upbringing
    and orders a water ordeal. Joseph drinks the water, is sent to a mountainous place,
    returns unharmed, and the priest releases them. Joseph takes Mary home rejoicing
    and praising God.
