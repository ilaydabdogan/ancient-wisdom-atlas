canonical_text:
  quote: ''
  summary: In the same city two wives of one man each have a sick son. Mary, mother
    of Caleb, gives Lady St. Mary a carpet and receives a swaddling cloth, from which
    she makes Caleb a coat; Caleb is cured, while the other wife's son dies. The rival
    wife twice tries to kill Caleb, first by casting him into a hot oven and then
    into a well, but Caleb is preserved. Mary appeals to Lady St. Mary, who says God
    will vindicate her. The rival later falls into the well and dies, and the narrator
    frames this as fulfillment of a saying about falling into the pit one prepared.
  language: English
  quote_policy: summarized
