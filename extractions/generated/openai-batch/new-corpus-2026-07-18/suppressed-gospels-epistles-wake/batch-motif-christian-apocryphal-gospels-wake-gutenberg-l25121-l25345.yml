  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The virgins use besoms to cleanse the area around the tower, remove rubbish,
    and throw water on it; afterward the palace and tower are described as delightful
    and beautiful.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator asks the shepherd to explain what he has shown, but the shepherd
    says he has business and leaves the narrator entrusted to the virgins.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The virgins tell the narrator that he may not depart from them and that he
    will sleep with them as a brother, not as a husband.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The chiefest virgin embraces and kisses the narrator; the other virgins also
    kiss him as a brother, lead him around the tower, and play with him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some virgins sing psalms and others form a chorus; the narrator walks around
    the tower with them, rejoices silently, and feels as though he has grown young
    again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At night the virgins spread linen garments on the ground, place the narrator
    in the middle, and do nothing else except pray; the narrator prays with them until
    the next day.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After worship, the shepherd returns, asks whether the virgins injured the
