canonical_text:
  quote: "“this rock, and this gate, are the Son of God.”"
  summary: 'After a tower is inspected, repaired, and cleansed, the narrator is left
    with virgins who keep him overnight in a chaste, prayerful vigil. The shepherd
    returns and explains that the rock and gate signify the Son of God: ancient in
    relation to creation, newly appearing in the last days, and the sole way by which
    one enters the kingdom of God.'
  language: English
  quote_policy: quoted
literal_observations:
