  evidence_refs:
  - ev:7
  confidence: high
  cautions: The image is brief and appears within moral instruction.
- id: motif:6
  label: Liberation from bonds through Christ
  taxonomy_refs: []
  basis: The speaker is in bonds, and later expresses trust that Jesus Christ will
