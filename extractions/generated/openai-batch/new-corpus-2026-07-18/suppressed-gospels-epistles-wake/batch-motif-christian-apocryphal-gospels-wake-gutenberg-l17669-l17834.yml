candidate_motifs:
- id: motif:1
  label: Death and resurrection of Christ as Gospel center
  taxonomy_refs:
  - resurrection
  basis: The passage names Christ's cross, death, and resurrection as undefiled monuments
    and says the Gospel is above other dispensations because of the Saviour's appearance,
    passion, and resurrection.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage gives doctrinal summary rather than narrating the resurrection
    episode.
- id: motif:2
  label: Sacred mediator as High Priest and doorway to divine access
  taxonomy_refs: []
  basis: The High Priest receives the Holy of Holies and secrets of God, and Christ
    is called the door of the Father through which patriarchs, prophets, Apostles,
    and the church enter.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage states the mediating role in theological language; it does
    not describe a journey scene in detail.
- id: motif:3
  label: Community preserved by unity around sacred officers
  taxonomy_refs: []
  basis: The community is told to attend to the bishop, presbytery, and deacons, do
    nothing without the bishop, love unity, flee divisions, and return to the unity
    of God and the bishop's council.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: This is an ecclesial exhortation rather than a mythic narrative.
- id: motif:4
  label: Deceptive adversary setting snares
  taxonomy_refs: []
  basis: The speaker warns against the wicked arts, snares, and cunning of the prince
    of this world, which may oppress the addressees and cool their charity.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage names the adversarial danger but does not narrate an encounter
    with the figure.
- id: motif:5
  label: Body as temple of God
  taxonomy_refs: []
  basis: The spirit's instruction includes the command to keep bodies as temples of
