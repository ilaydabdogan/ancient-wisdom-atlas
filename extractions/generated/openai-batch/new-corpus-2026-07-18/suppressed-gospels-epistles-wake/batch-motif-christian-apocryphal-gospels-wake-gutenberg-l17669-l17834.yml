canonical_text:
  quote: 'Do nothing without the bishop: Keep your bodies as the temples of God: Love
    unity; Flee divisions'
  summary: The speaker exhorts the addressed brethren to rely on prayer, the Gospel,
    Christ, the prophets, the apostles, and church officers; warns against Judaizing
    teaching, deceit, and division; and presents Jesus Christ as High Priest, door
    of the Father, and the center of Gospel faith in his passion and resurrection.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker says his love and joy toward the brethren make him speak more
    fully, that he seeks to secure them against danger, and that he is bound in Christ
    while on the way to suffering.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker asks for the addressees' prayer to God so that he may be made
    perfect and attain the portion allotted to him, and he describes fleeing to the
    Gospel as to Christ's flesh and to the Apostles as to the church presbytery.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prophets are said to have led people to the Gospel, hope in Christ, and
    expectation of him; they are also described as saved in the unity of Jesus Christ
    and numbered in the Gospel of common hope.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker tells the addressees not to listen to anyone preaching the Jewish
    law, values doctrine concerning Christ over Judaism, and likens speakers who do
    not speak concerning Christ to monuments and sepulchres of the dead.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker commands the addressees to flee the wicked arts and snares of
    the prince of this world and to come together in the same place with an undivided
    heart.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The spirit from God is described as not deceived, as knowing whence it comes
    and whither it goes, and as reproving the secrets of the heart.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker recounts that he cried aloud for the addressees to attend to the
    bishop, presbytery, and deacons; he says the spirit instructed them to do nothing
    without the bishop, keep their bodies as temples of God, love unity, flee divisions,
    and follow Christ as Christ followed his Father.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Division and wrath are associated with God not dwelling there; repentance
    and return to the unity of God and the bishop's council are associated with forgiveness,
    and Christ is said to free the addressees from every bond.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage reports a dispute about believing only what is written in the
    originals and about corrupted copies; the speaker sets Jesus Christ, his cross,
    death, resurrection, and faith by him in place of uncorrupted monuments.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The High Priest is said to be better than the priests, to have the Holy of
    Holies committed to him, to be entrusted with the secrets of God, and to be the
    door of the Father by which patriarchs, prophets, Apostles, and the church enter.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Gospel is said to be above other dispensations because of the appearance,
    passion, and resurrection of the Saviour, and it is called the perfection of incorruption.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: The speaker says he has a good conscience toward the addressees and that no
    one among them can claim that he has been burdensome.
  category: speech
  evidence_refs:
  - ev:12
