  summary: Mary, Joseph, and the infant Jesus travel from city to city. Mary’s sight
    delivers a possessed woman; a dumb bride is restored after taking and kissing
    the infant; a gentlewoman is freed from Satan in serpent form after holding the
    infant; and water used to wash Jesus cleanses a leprous girl, who later tells
    a prince’s wife about the remedy.
