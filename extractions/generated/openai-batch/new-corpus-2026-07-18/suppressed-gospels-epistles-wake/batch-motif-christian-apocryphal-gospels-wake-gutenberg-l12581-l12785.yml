canonical_text:
  quote: ''
  summary: The speaker rebukes contentious brethren, urges them to consult Scripture,
    recalls righteous sufferers such as Daniel and the three youths, warns against
    schism and offences, cites Paul’s earlier admonition to Corinthian factions, and
    calls for repentance, reconciliation, brotherly love, entry through the gate of
    righteousness, humility, and concern for the common good.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressees are called contentious brethren and are told that they are
    zealous for matters not pertaining to salvation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressees are instructed to look into the Holy Scriptures, which are
    described as true words of the Holy Ghost with nothing unjust or counterfeit in
    them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says righteous men were persecuted, imprisoned, stoned, and killed
    by wicked, unholy, transgressing, or accursed people, and that they underwent
    these things gloriously.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Daniel is mentioned as having been cast into the den of lions, and Shadrach,
    Meshach, and Abednego are mentioned as having been cast into the fiery furnace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Most High is described as protector and defender of those who serve his
    holy name with a pure conscience.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Those who endure sufferings with full persuasion are said to become partakers
    of glory and honour and to be exalted and lifted up by God as a memorial through
    all ages.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker exhorts the brethren to follow holy examples, join themselves
    to the innocent and righteous, and remember their shared one God, one Christ,
    one spirit of grace, and one calling in Christ.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The passage describes the community’s conflict as rending and tearing in pieces
    the members of Christ and forgetting that they are members one of another.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Words of Lord Jesus are recalled: woe comes to the one by whom offences come,
    and it would be better for such a person to have a millstone tied around his neck
    and be cast into the sea than to offend one of the little ones.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The schism is said to have perverted many, discouraged many, caused diffidence
    in many, caused grief in all, and continued still.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage recalls that Paul wrote to the Corinthians and admonished them
    concerning himself, Cephas, and Apollos because they had begun to fall into parties
    and factions.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: One or two persons are said to have led the ancient Corinthian church into
    sedition against its priests, bringing shame, blasphemy of the Lord’s name, and
    danger.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The speaker calls for haste in ending the sedition, falling down before the
    Lord, beseeching him with tears, and being restored to a holy course of brotherly
    love.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The gate of righteousness is described as opening unto life, as the gate of
    the Lord, and as the gate in Christ through which the blessed enter while directing
    their way in holiness and righteousness.
  category: setting
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:15
  text: A person who is faithful, knowledgeable, wise in judging words, and pure in
    actions is instructed to be humble-minded and seek what benefits all people rather
    than personal advantage.
  category: speech
  evidence_refs:
  - ev:9
