canonical_text:
  quote: ''
  summary: 'The passage narrates two miracle episodes during the travels of Mary,
    Joseph, Jesus, and a servant girl: a newly married man is freed from a sorcery-related
    disorder after hosting them, and a bewitched young man who had been changed into
    a mule is restored to human form when Mary places Jesus on the mule and petitions
    him. The restored man is then married to the formerly leprous girl who had directed
    the grieving family to Mary and Jesus.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The travelers lodge at the house of a newly married man who, because of sorcerers,
    could not enjoy his wife; after that night he is freed from his disorder and provides
    an entertainment for them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In another city, three weeping women are seen coming from a grave and invite
    the travelers to lodge with them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Inside the house, the women continue weeping beside a mule covered with silk
    and wearing an ebony collar, which they kiss and feed.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The women say the mule is their brother, born of the same mother, and that
    jealous women bewitched him and changed him into a mule while the house doors
    were shut.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The family had consulted wise men, magicians, and diviners without success,
    and repeatedly went with their mother to the father's tomb to weep.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The servant girl says she had been leprous and was made well after sprinkling
    herself with water in which Mary had washed the infant Jesus.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The girl tells the women that a remedy is near and instructs them to petition
    Mary about their case.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The women petition Mary, explaining that they lack a father or brother to
    act as head of their family because their brother is in mule form.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mary is grieved, places Jesus on the mule's back, and asks Jesus to restore
    the mule to the form of a man and rational creature.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Immediately after Mary's request, the mule becomes a young man without deformity.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The restored man, his mother, and his sisters worship Mary, lift and kiss
    the child, and bless Jesus as Saviour of the world.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The sisters propose that their restored brother marry the servant girl; after
    Mary consents, a splendid wedding is held and mourning becomes celebration.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Joseph and Mary remain there ten days before leaving with great respect from
    the people.
  category: sequence
  evidence_refs:
  - ev:9
