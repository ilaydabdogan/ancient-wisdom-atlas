canonical_text:
  quote: ''
  summary: The passage lists the contents of the volume and opens a preface defending
    the publication of suppressed or excluded Christian writings. The narrator argues
    for private judgment, free inquiry, and the restoration of texts said to have
    been removed from the New Testament by ecclesiastical authorities. The preface
    credits William Hone with an earlier complete publication, discusses the title
    “Forbidden Books,” and introduces Hone’s question about what happened to writings
    rejected when the New Testament was compiled.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage begins with a contents list naming works such as Mary, Protevangelion,
    Infancy, Nicodemus, Christ and Abgarus, Acts of Paul and Thecla, Clement, Barnabas,
    Ignatian epistles, Polycarp, Philippians, and Hermas.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The preface states aims including upholding private judgment, Christian liberty,
    investigation, inquiry, and restoration of a “mutilated Testament.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator describes himself as an advocate of free thought and disputes
    the authority of ecclesiastics said to have suppressed and later excluded these
    writings.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The preface asserts that the excluded gospels and epistles had formed part
    of the New Testament and were venerated by Primitive Churches during the first
    four hundred years of the Christian Era.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator bases his opposition partly on the right of every rational being
    to become a “Priest unto himself” and use enlightened reason in judging natural
    and spiritual things.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The preface says bishops extracted the books from the original New Testament
    under the pretense that they were apocryphal and forbade the people to read them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says the Nicene Council suppressed the books, that several were
    later reissued by various translators, and that William Hone published them together
    in one volume around 1820.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator says he republished Hone’s edition in revised form and changed
