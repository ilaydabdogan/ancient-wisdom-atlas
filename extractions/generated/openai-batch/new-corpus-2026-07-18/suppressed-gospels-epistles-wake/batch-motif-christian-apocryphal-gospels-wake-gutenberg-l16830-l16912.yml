canonical_text:
  quote: ''
  summary: An epistolary speaker commends the addressees' faith, humility, and possession
    of Jesus Christ in their hearts; exhorts them to remain in the doctrine of the
    Lord and Apostles; instructs them to be subject to their bishop, one another,
    and church officers by analogy with Christ's relation to the Father and the Apostles'
    relation to Christ, the Father, and the Holy Ghost; requests prayers and charity
    for himself and the church in Syria; sends greetings from Smyrna, Polycarp, and
    other churches; and closes with a farewell in the concord of God.
  language: English
  quote_policy: summarized
