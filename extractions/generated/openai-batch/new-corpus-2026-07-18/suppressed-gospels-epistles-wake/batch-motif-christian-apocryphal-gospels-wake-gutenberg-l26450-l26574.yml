canonical_text:
  quote: ''
  summary: The shepherd exhorts the addressees to unity, peace, repentance, and restoration
    of the Spirit as whole as it was received. He warns that shepherds must answer
    for scattered sheep and that those who continue in malice and remembrance of injuries
    will not live unto God. He explains that spaces among stones in the tower-building
    represent sins of those who have repented, and that the Lord has blotted out those
    sins so the spaces no longer appear.
  language: English
  quote_policy: summarized
