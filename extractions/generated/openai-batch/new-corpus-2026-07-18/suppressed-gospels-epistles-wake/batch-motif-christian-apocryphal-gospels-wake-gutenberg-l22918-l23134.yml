canonical_text:
  quote: The farm before mentioned denotes the whole earth.
  summary: A household and farm similitude is followed by instruction on commandments,
    voluntary fasting, and almsgiving. The narrator asks for explanation, and the
    messenger gives an allegorical mapping of the farm, lord, son, servant, vineyard,
    stakes, weeds, food, friends, and the master's absence.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The master of the family calls friends together and sends several kinds of
    supper food to a servant.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The servant keeps enough food for himself and divides the remainder among
    his fellow-servants, who rejoice and wish him greater favour with his lord.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The lord rejoices at the servant's action, recounts it to his friends and
    son, and they assent that the servant should be made heir together with the son.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The narrator says he cannot understand the similitudes unless they are expounded,
    and the instructor agrees to expound what has been shown or said.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The instructor says that keeping the Lord's commandments brings approval,
    and that adding good things or stations brings greater dignity and favour.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The proper fast is described as including avoidance of wicked acts, filthy
    words, hurtful desires, and purification from the vanity of the present world.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the fasting day, the person is told to taste only bread and water, calculate
    the ordinary food expense, set it aside, and give it to the widow, the fatherless,
    and the poor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The fast is described as humiliation of the soul, acceptable sacrifice, and
    something written in the Lord's book; those who perform it with their household
    are promised happiness and answered petitions.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The narrator asks for the meaning of the farm, lord, vineyard, servant, stakes,
    weeds, son, and friends; the instructor says servants of God seek and receive
    understanding, then agrees to unfold the parable.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The instructor identifies the farm as the whole earth, the lord of the farm
    as the creator, the son as the Holy Spirit, the servant as the Son of God, the
    vineyard as the people saved, the stakes as messengers, the weeds as sins, the
    food as commands, the friends as holy angels, and the master's absence as the
    time until his coming.
  category: relationship
  evidence_refs:
  - ev:5
