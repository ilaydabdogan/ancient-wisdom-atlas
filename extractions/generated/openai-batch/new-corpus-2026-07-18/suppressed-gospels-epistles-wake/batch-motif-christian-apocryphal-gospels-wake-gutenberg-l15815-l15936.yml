  quote: '"the way of darkness is crooked, and full of cursing"'
  summary: Chapter XV describes the way of darkness as a path of eternal death and
    punishment, lists sinful behaviors and social injustices, warns of destruction,
    resurrection, retribution, and judgment, and exhorts the recipients to do good,
    seek divine wisdom, fulfill the commandments, and remain in love and peace.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The way of darkness is described as crooked, cursed, and a way of eternal
    death with punishment, where walkers encounter things that destroy their souls.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists faults associated with this way, including idolatry, pride,
    adultery, murder, deceit, witchcraft, covetousness, and lack of fear of God.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Those who walk in this way are described as persecutors of the good, haters
    of truth, lovers of lies, and persons who do not know the reward of righteousness.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says such persons do not administer righteous judgment to the
    widow and orphan, lack compassion for the poor, turn away from the needy, oppress
    the afflicted, advocate for the rich, and judge the poor unjustly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Learning and walking in the Lord's just commands is said to lead to glorification
    in the kingdom named in the passage heading as the kingdom of God.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Choosing the other part is said to lead to destruction together with one's
    works, and the passage states that there will be resurrection and retribution.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage warns that a day is near when all things will be destroyed together
    with the wicked one, and says the Lord is near with his reward.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: The addressed persons are urged to do good to those with them, to be good
    lawgivers and faithful counsellors to one another, and to remove hypocrisy.
  category: speech
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:9
  text: The speaker asks that God give wisdom, knowledge, counsel, and understanding
    of his judgments, and tells the recipients to seek what the Lord requires so that
    they may be saved in the day of judgment.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:10
  text: The body is called a beautiful tabernacle, and the recipients are urged to
    seek and fulfill every command while in it.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:11
  text: The closing addresses the recipients as children of love and peace and invokes
    the Lord of glory and all grace to be with their spirit.
  category: speech
  evidence_refs:
  - ev:13
