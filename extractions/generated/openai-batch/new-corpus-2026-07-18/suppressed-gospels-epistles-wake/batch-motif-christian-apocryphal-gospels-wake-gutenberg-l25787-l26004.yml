canonical_text:
  quote: ''
  summary: 'The passage explains a vision of mountains as categories of believers
    or nations. A purified church becomes one body after wicked members are cast out.
    The Son of God rejoices among the purified people. An interpreting speaker explains
    the meanings of several mountains: a black mountain for apostates without repentance;
    a smooth barren mountain for hypocrites and corrupt teachers with possible repentance;
    a thorny and brambly mountain for the rich and busy who are entangled; a mountain
    with green tops and dry roots for doubtful believers who speak of the Lord but
    lack works; a craggy mountain with green grass for self-conceited believers; and
    a cleft mountain for quarrelsome believers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The church of God is described as becoming purified after wicked, counterfeit,
    mischievous, doubtful, and sinful persons are cast out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After purification, the church becomes one body with one understanding, one
    opinion, one faith, and the same charity.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Son of God is said to rejoice among the purified people and receive them
    with a pure will.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The questioner asks for the effect and force of every mountain, and the interpreting
    speaker identifies the variety of mountains as the twelve nations.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first black mountain is assigned to believers who revolted from faith,
    spoke wickedly against the Lord, and betrayed servants of God; they are condemned
    to death and have no repentance.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The second smooth and barren mountain is assigned to hypocrites and teachers
    of naughtiness, who have the Christian name but are empty of faith and fruit of
    truth; repentance remains possible if pursued quickly.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The third mountain with thorns and brambles is assigned to rich believers
    and believers occupied with many affairs; the brambles are identified as riches
    and the thorns as affairs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The rich and busy believers are described as wandering, being choked by affairs,
    having difficulty entering the kingdom of God, and either living through repentance
    or being delivered to women who take away their lives.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The fourth mountain, with green upper herbs, dry roots, and plants withered
    by the sun, is assigned to doubtful believers who carry the Lord on their tongues
    but not in their hearts.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The doubtful believers are described as neither dead nor living; when they
    hear of persecution, they return to idols and are ashamed to bear the Lord's name,
    but may live if they repent.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The fifth craggy mountain with green grass is assigned to believers who are
    faithful but believe with difficulty, are bold and self-conceited, claim knowledge,
    and would seem to be teachers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: For the fifth-mountain group, knowledge has departed because of confidence,
    some are cast away, and others repent and submit to those who are knowing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The sixth mountain with greater and lesser clefts is assigned to believers
    involved in controversies and quarrels, through which they languish in faith.
  category: relationship
  evidence_refs:
  - ev:8
