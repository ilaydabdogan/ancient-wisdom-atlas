canonical_text:
  quote: ''
  summary: An interpreting speaker explains differences among symbolic fruits, mountains,
    and stones. Those who suffer for the Lord's name are honored, with steadfast confessors
    receiving fairer fruit than doubtful sufferers. The twelfth white mountain represents
    innocent, childlike believers. White stones and round stones are explained as
    different classes of believers being fitted, cut, or delayed for incorporation
    into the tower. The angel of repentance exhorts the sealed to keep simplicity
    and avoid malice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Those who suffered death for the name of the Son of God are said to have their
    offences blotted out and to be honorable before the Lord.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those brought before magistrates who did not deny the Lord and suffered readily
    are assigned the fairest fruits.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Those who feared, doubted, and deliberated whether to confess or deny Christ
    but still suffered are assigned smaller fruits.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The twelfth mountain is described as white and is identified with believers
    like sincere children, without malice and undefiled in the commandments.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Stones brought from the plain into the tower are identified as roots of the
    white mountain and as young believers of an innocent kind.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Round and bright stones from the white mountain are said to have riches that
    darkened them from truth and dazzled their eyes, though they did not depart from
    the Lord.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The riches of the round and bright stones are pared away only partly, so that
    what remains may be used for good, after which the stones are put into the tower.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Other round stones are not yet fit for the tower because they have not received
    the seal and must have the present world and vanities of riches cut away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The angel of repentance addresses those who have received the seal and tells
    them to keep simplicity, not remember offences, and not remain in malice or bitterness.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The devil is named as a tempter, but those of the innocent kind who offend
