canonical_text:
  quote: ''
  summary: The passage praises the Lord as creator through invisible power, wisdom,
    counsel, and word, and as founder of the blessed Holy Church. It says he will
    remove heavens, mountains, hills, and seas so all is made plain for the elect,
    who receive the promised reward if they keep God’s commandments. After a woman
    finishes reading, four young men carry her chair east. She speaks with Hermas,
    touches his breast, explains that the pleasant final matters concern the righteous
    and the severe preceding matters concern revolters and heathen. Two men then carry
    her east, and she departs cheerfully, encouraging Hermas.
