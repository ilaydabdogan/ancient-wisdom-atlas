canonical_text:
  quote: ''
  summary: After writing the commands and similitudes, the first-person narrator is
    visited by the Angel of Repentance, who says he will show the things spoken by
    the Spirit under the figure of the Church. The angel leads the narrator to a mountain
    in Arcadia, where he sees a plain surrounded by twelve differently formed mountains.
    In the middle of the plain stands a huge white square rock with a newly hewn radiant
    gate. Twelve virgins stand around the gate. Six venerable men call a multitude
    and command that a tower be built over the gate; stones are lifted from a deep
    place, carried by virgins through the gate, and placed into the tower.
  language: English
  quote_policy: summarized
