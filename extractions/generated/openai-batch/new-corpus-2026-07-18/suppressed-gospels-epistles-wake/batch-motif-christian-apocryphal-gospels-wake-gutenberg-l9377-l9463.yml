canonical_text:
  quote: ''
  summary: Thamyris accuses Paul before the governor of teaching against matrimony,
    with Demas and Hermogenes urging that Paul be identified as a Christian. Paul
    defends his teaching as a divine commission centered on Jesus Christ and revelation
    from God. The governor orders Paul bound and imprisoned. At night Thecla gives
    jewelry and a silver looking-glass to prison officials to gain access, sits at
    Paul’s feet to hear divine teaching, and kisses his chains as her faith increases.
