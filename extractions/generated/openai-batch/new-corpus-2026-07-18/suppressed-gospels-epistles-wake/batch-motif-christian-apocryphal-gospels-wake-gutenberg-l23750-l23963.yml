canonical_text:
  quote: ''
  summary: A visionary passage describes a willow covering fields, mountains, and
    eventually all the earth. An excellent angel cuts boughs from it and gives rods
    to people under its shadow, then examines the rods when returned, separating them
    by condition and rewarding green, branch-bearing, and fruitful rods with crowns,
    seals, white garments, and entry into a tower. A shepherd plants and waters the
    poorer rods in hope that they may live again. The shepherd explains that the tree
    is the law of God, identified with the Son of God preached worldwide; those under
    its shadow are believers; and the angel is Michael, who governs the people and
    checks whether they have kept the law.
  language: English
  quote_policy: summarized
