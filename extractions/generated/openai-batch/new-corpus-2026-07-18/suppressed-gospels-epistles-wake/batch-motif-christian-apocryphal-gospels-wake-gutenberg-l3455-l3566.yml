canonical_text:
  quote: ''
  summary: Chapter VIII recounts Joseph, Mary, and Jesus passing through robber territory;
    Titus, a robber, pays Dumachus to let them pass; Mary and Jesus speak of Titus
    receiving pardon and paradise and foretell Jesus' crucifixion with the two thieves.
    The travelers approach a city of idols that turns into sand, go to the sycamore
    of Matarea where Jesus causes a well to spring up and Mary washes his coat, and
    balsam grows from Jesus' sweat. They stay in Egypt, Jesus performs many miracles,
    and after return toward Judea an angel directs Joseph to Nazareth.
  language: English
  quote_policy: summarized
