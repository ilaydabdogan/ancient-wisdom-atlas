canonical_text:
  quote: "“My love is crucified; and the fire that is within me does not desire any
    water.”"
  summary: The speaker warns the addressees not to aid the prince of this world or
    covet the world, declares a desire to die and suffer, describes an inner fire
    calling him to the Father, rejects corruptible pleasures, longs for the bread
    and drink identified with Jesus Christ’s flesh and blood, asks for prayer and
    consent, commends the church of Syria to divine oversight, and closes with travel
    notices, greetings, and an exhortation to endure in the patience of Jesus Christ.
  language: English
  quote_policy: quoted
