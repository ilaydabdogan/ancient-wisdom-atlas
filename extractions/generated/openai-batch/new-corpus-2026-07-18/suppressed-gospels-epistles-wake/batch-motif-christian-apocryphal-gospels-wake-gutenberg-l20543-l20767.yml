canonical_text:
  quote: ''
  summary: Hermas reports a fourth vision concerning approaching trial and tribulation.
    While walking alone and praying, he hears a voice telling him not to doubt, sees
    a dust cloud and a huge whale-like beast with fiery locusts from its mouth, and
    passes safely by it through faith. A white-clad virgin, identified as the Church,
    explains that the beast figures the coming trial, that an angel named Hegrin restrained
    it, and that its four colors signify the present world, destruction by fire and
    blood, the tested elect, and the world to come. The passage ends with her departure
    and the arrival of a man dressed as a shepherd.
  language: English
  quote_policy: summarized
