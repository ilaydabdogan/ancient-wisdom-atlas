canonical_text:
  quote: ''
  summary: 'Ignatius addresses the church at Smyrna, praises its faith, charity, and
    wisdom, and summarizes claims about Jesus Christ: Davidic descent, divine sonship,
    virginal birth, baptism by John, crucifixion under Pontius Pilate and Herod, true
    suffering, resurrection, and post-resurrection bodily presence verified by touch
    and by eating and drinking.'
  language: English
  quote_policy: summarized
