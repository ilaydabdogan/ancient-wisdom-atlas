canonical_text:
  quote: ''
  summary: At Jesus' birth in Bethlehem, wise men from the East come according to
    a prophecy attributed to Zoradascht/Zoroaster, bring gold, frankincense, and myrrh,
    worship the infant, and receive one of his swaddling cloths from Mary as a blessing.
    An angel appears to them in the form of the guiding star and leads them home.
    After returning, they show the cloth, hold a feast, make and worship a fire according
    to their country's custom, cast the cloth into the fire, and later find it unburned.
    They venerate the cloth and store it among their treasures.
  language: English
  quote_policy: summarized
