  summary: A shepherd sent by a venerable messenger identifies himself as the narrator's
    appointed guardian, changes shape, reassures the narrator, and commands him to
    write Commands and Similitudes. The passage states that those who observe these
    teachings with a pure mind will receive what the Lord promised, while those who
    do not repent and continue in sin will be punished. The shepherd is identified
    as the angel of repentance.
