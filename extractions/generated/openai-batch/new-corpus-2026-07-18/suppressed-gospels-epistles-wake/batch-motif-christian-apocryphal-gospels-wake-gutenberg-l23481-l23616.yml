canonical_text:
  quote: ''
  summary: A questioner asks a teacher about the duration and force of punishment
    for those who leave the fear of God and pursue false pleasures. The teacher explains
    that worldly pleasure is brief and easily forgotten, while punishment remains
    in memory and is experienced as much longer. Harmful pleasures are catalogued,
    contrasted with pleasure in doing good, and linked respectively to torment, death,
    salvation, and life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Those delivered to the speaker serve God with a pure mind, succeed in their
    undertakings, receive what they desire from the Lord, give thanks, and no longer
    suffer cruelty.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The questioner asks whether people who depart from the fear of God are tormented
    for the same time that they enjoyed false delight and pleasures; the speaker answers
    that they are tormented for the same time.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The questioner suggests that such punishment is too little and that offenders
    should endure seven times as much; the speaker calls the questioner foolish and
    says he does not understand the efficacy of the punishment.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says an hour of pleasure ends within its own span, but an hour
    of punishment has the efficacy of thirty days, and one day of punishment is equivalent
    to a whole year.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker concludes that as many days as someone pursues pleasures, so many
    years that person is punished, while worldly enjoyment is short and pain and torment
    last much longer.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker urges the questioner to purify his mind and serve God, warning
    that he may be found unwise when his time is fulfilled.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker says a day of self-indulgence is full of folly and is forgotten,
    while a day of pain and torment troubles a person for the whole year because punishment
    remains fixed in memory.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The punished person remembers the punishment with sorrow and recognizes that
    it occurred because of vain pleasure and delight.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Those who give themselves over to such pleasures are punished because, while
    alive, they made themselves liable to death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Hurtful pleasures include gratification of anger, adultery, drunkenness, slander,
    lying, covetousness, fraud, and similar actions done with satisfaction.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The listed pleasures and delights are said to be hurtful to the servants of
    God and to cause torment and punishment.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Pleasure in doing good is said to bring salvation and life, while continuing
    in harmful pleasures without repentance brings death.
  category: relationship
  evidence_refs:
  - ev:6
