canonical_text:
  quote: ''
  summary: Thecla is sought by her family and Thamyris, found at the prison where
    Paul is held, and brought with Paul before the governor. After accusations against
    Paul and Thecla's refusal to answer about marrying Thamyris, Thecla is sentenced
    to be burned and Paul to be whipped out of the city. At the stake Thecla sees
    the Lord Jesus in Paul's likeness, makes the sign of the cross, and is preserved
    when rain, hail, and an eruption from the earth extinguish the fire.
  language: English
  quote_policy: summarized
