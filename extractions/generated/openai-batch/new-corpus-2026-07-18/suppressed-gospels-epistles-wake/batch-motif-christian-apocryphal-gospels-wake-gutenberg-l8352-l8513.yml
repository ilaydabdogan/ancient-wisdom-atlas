canonical_text:
  quote: "“after my ascension I will send one of my disciples, who will cure your
    disease”"
  summary: The passage gives Jesus’ written answer to Abgarus, blessing belief without
    sight, declining to visit Edessa, and promising after his ascension to send a
    disciple who will cure Abgarus and give life. It then provides editorial notes
    on the Jesus-Abgarus correspondence. The passage next gives the Epistle of Paul
    to the Laodiceans, in which Paul greets the Laodicean brethren, exhorts them to
    good works, truth, prayer, moral conduct, and fear of the Lord, interprets his
    bonds as leading to salvation, and instructs reciprocal reading with the Colossians.
    Editorial notes on the Laodicean epistle follow.
  language: English
  quote_policy: quoted
