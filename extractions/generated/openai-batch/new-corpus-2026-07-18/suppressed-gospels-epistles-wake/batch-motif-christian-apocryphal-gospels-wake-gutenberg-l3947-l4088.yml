canonical_text:
  quote: ''
  summary: A girl afflicted by Satan, who appears to her in dragon form and has drained
    her blood, seeks deliverance. A prince's daughter formerly healed by Mary directs
    the girl's mother to Mary. Mary gives water used to wash Jesus and one of Jesus's
    swaddling cloths. When Satan returns as a dragon, the girl shows the cloth; fire
    and burning coals issue from it, strike the dragon, and Satan flees. The girl
    is delivered and those present praise God.
