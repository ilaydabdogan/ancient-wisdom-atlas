canonical_text:
  quote: ''
  summary: 'The passage teaches that evil days and the adversary require diligence,
    fear, patience, and moral understanding. It argues that God, through the prophets,
    has abolished reliance on legal sacrifices, burnt offerings, oblations, ritual
    fasts, and Jewish-law observance, replacing them with the new law of Jesus Christ:
    a spiritual offering of persons themselves, contrition, ethical conduct, mercy
    to the hungry, poor, naked, and oppressed, and sincere belief among the people
    purchased for the beloved Son.'
  language: English
  quote_policy: summarized
