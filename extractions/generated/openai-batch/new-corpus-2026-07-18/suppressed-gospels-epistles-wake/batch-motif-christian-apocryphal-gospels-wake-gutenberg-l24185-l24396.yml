canonical_text:
  quote: ''
  summary: An interpreting speaker explains successive classes of rods—dry, green,
    cleft, or partly dry and partly green—as corresponding to different moral and
    communal states. Repentance can lead to a place in the tower or within the walls,
    while continued dissension, denial, worldly attachment, or refusal to repent leads
    to loss of life or death.
  language: English
  quote_policy: summarized
