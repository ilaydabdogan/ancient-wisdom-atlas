canonical_text:
  quote: ''
  summary: An instructor teaches the narrator how to distinguish prophets and spirits
    by their life and works. The passage contrasts the Spirit of God, described as
    humble and powerful from above, with an earthly empty spirit associated with false
    prophecy, hidden places, self-exaltation, reward-taking, and lack of virtue. Several
    similitudes compare empty prophets to empty vessels and contrast impossible upward
    reaching toward heaven with small things descending from above that have great
    force.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The heading states that spirits and prophets are to be tried by their works
    and refers to a twofold spirit.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The instructor shows men sitting on benches and one sitting in a chair; those
    on benches are identified as faithful, and the one in the chair as an earthly
    spirit.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The earthly spirit is said to avoid the assembly of the faithful and to join
    doubtful and empty people in corners and hidden places.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the earthly-spirit figure comes among just people full of the Spirit
    of God and they pray, the earthly spirit flies from him and he becomes dumb.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage compares empty prophets among the just to an empty jar placed
    among vessels of wine or oil and later found empty.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator asks how a person may discern the prophets, and the instructor
    says to prove the prophet of God and the false prophet.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Spirit from above is described as humble, quiet, separated from wickedness
    and vain desires, and not speaking whenever a human wishes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: When a person with the Spirit of God enters the church of the righteous and
    they pray, the holy angel of God fills that person with the blessed Spirit, and
    he speaks in the congregation as moved by God.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The man falsely supposed to have the Spirit is described as self-exalting,
    desiring the first seat, wicked, full of words, pleasure-seeking, and taking reward
    for divination.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The instruction says to prove the claimant to the Holy Spirit by life and
    works, to believe the Spirit from God, and not to believe the earthly empty spirit
    from the devil.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: A stone thrown toward heaven and a spout of water mounted upward are presented
    as impossible means of reaching heaven; this is compared to the earthly spirit
    being without virtue and effect.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: Small grains of hail falling on a person's head and little drops from a house
    hollowing stones are used to illustrate that small things from above can have
    great force.
  category: object
  evidence_refs:
  - ev:11
