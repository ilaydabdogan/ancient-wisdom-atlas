canonical_text:
  quote: ''
  summary: The speaker exhorts the recipients to follow the bishop, presbytery, and
    deacons; restricts baptism and communion to episcopal approval; urges repentance,
    charity, prayer, and honor; thanks the community for hospitality to named companions;
    reports peace for the church at Antioch and proposes sending a delegate and epistle;
    and closes with greetings, blessings, and a formula invoking Jesus Christ's flesh,
    blood, passion, and resurrection.
  language: English
  quote_policy: summarized
