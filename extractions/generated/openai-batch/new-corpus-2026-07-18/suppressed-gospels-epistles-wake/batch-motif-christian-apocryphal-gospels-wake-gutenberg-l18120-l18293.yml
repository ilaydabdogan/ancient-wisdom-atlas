- id: motif:6
  label: Honored bonds of sacred service
  taxonomy_refs: []
  basis: The speaker's bonds and chains are presented as becoming God and as not despised
    by the recipients.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage does not elaborate a martyrdom scene; the motif is limited
    to the honor attached to imprisonment or chains.
