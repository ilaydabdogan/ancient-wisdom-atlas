  cautions: This is a doctrinal salutation rather than a narrated resurrection episode.
- id: motif:2
  label: Return to God through timely repentance
  taxonomy_refs:
  - return
  basis: The speaker urges repentance while there is time to return unto God.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage uses return as exhortative religious language, not as a developed
    journey narrative.
- id: motif:3
  label: Sacred authority centered in the bishop
  taxonomy_refs: []
  basis: The bishop's presence and consent organize the church gathering and authorize
    eucharist, baptism, and communion.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is an ecclesial-order pattern rather than a mythic narrative motif.
- id: motif:4
  label: Restored communal body reaches harbour
  taxonomy_refs: []
  basis: The Antioch church is described as restored to former state, receiving its
