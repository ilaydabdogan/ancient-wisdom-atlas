  summary: Paul, Onesiphorus, and Onesiphorus's household fast in a cave. A child
    sent to buy bread meets Thecla, who says she is pursuing Paul after being delivered
    from flames. Thecla finds Paul praying for her protection from fire; she and Paul
    give praise for her preservation. The group shares joy and simple provisions.
    Thecla asks to follow Paul, asks for the seal of Christ, and Paul tells her to
    wait for the gift of Christ.
