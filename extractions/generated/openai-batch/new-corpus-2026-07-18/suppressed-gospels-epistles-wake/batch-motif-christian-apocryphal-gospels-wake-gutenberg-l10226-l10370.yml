canonical_text:
  quote: ''
  summary: Opponents of Thecla plan to have drunken men violate her chastity, believing
    this will end her divine favor. The men go to her cave on the mountain and seize
    her. Thecla prays to God, recalling earlier deliverances and asking protection.
    A voice from heaven tells her not to fear and points to an opened place. A rock
    opens wide enough for her to enter, then closes without a visible crack. The attackers
    are astonished and retain only a torn piece of her veil, which the narrator says
    will confirm faith and convey blessings. The passage closes by summarizing Thecla’s
    age, cave life, translation, and feast day.
  language: English
  quote_policy: summarized
