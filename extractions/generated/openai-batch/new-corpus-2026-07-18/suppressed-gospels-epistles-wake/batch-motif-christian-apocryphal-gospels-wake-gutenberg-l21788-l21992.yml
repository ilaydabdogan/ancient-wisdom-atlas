  quote: ''
  summary: A teacher instructs a questioning hearer to remove sadness because it is
    linked with doubting and anger, grieves the Holy Spirit, weakens prayer, and draws
    doubtful people toward lying prophets. The teacher contrasts false spirits with
    the Spirit from God, urges fear of the Lord and understanding, and commands the
    hearer to put on cheerfulness.
