canonical_text:
  quote: ''
  summary: The passage presents Lot and Rahab as examples of redemption connected
    with faith, hospitality, and obedience. Lot is saved from Sodom while the surrounding
    country is destroyed by fire and brimstone; his wife becomes a pillar of salt
    as a warning sign. Rahab receives and hides Joshua’s spies, misdirects the king’s
    messengers, obtains a promise of safety for her household, and is given a scarlet
    rope as a sign interpreted as pointing to redemption by the blood of the Lord.
  language: English
  quote_policy: summarized
