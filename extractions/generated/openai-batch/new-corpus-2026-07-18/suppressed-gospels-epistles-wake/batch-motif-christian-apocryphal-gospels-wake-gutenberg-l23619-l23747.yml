  quote: ''
  summary: A narrator asks that a punishing shepherd or messenger be removed from
    his house. An interlocutor explains that affliction has been commanded because
    of sins in the household, that repentance requires humility and appointed suffering,
    and that obedience may lead to purification, moderated punishment, and restoration.
  language: English
  quote_policy: summarized
