canonical_text:
  quote: ''
  summary: Joseph and Mary fear retaliation after hearing that an idol has fallen
    and been destroyed. They recall Herod's attempt to kill Jesus and the slaughter
    of infants, then go toward robbers' secret places. The robbers hear a great noise
    like a king with an army, horses, and trumpets, flee in fear, and leave prisoners
    and booty behind. The prisoners free one another, take their bags, see Joseph
    and Mary, and ask where the king is whose approach frightened the robbers. Joseph
    replies that he will come after them.
