canonical_text:
  quote: ''
  summary: Jewish leaders accuse Jesus before Pilate of claiming divine sonship and
    kingship, breaking Sabbath law, and performing cures and exorcisms by wicked means.
    Pilate summons Jesus. The messenger honors Jesus by worshipping him and spreading
    a cloak before him, then recounts an earlier acclamation with a she-ass, tree
    boughs, garments, and cries of Hosannah. When Jesus enters, the standards bow
    and worship him; after a retest with strong Jewish elders holding the standards,
    the standards bow again.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Annas, Caiphas, and other Jews go to Pilate and accuse Jesus of many crimes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The accusers say Jesus is the son of Joseph and born of Mary, and that he
    declares himself the Son of God and a king.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The accusers say Jesus attempts to dissolve the Sabbath and ancestral laws
    by curing various afflicted people on the Sabbath day.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The accusers call Jesus a conjurer and say he casts out devils by the prince
    of the devils.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pilate replies that casting out devils appears to proceed from the power of
    God rather than an unclean spirit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Pilate sends a messenger to bring Jesus; the messenger worships Jesus and
    spreads a cloak on the ground for him to walk upon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The messenger says he previously saw Jesus sitting on a she-ass while Hebrew
    children cried Hosannah and held tree boughs.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The messenger reports that others spread garments in the way and uttered a
    blessing on the one coming in the name of the Lord.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The text explains Hosannah as a cry meaning, in effect, 'O Lord, save.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: When Jesus enters by the ensigns carrying standards, the tops of the standards
    bow down and worship him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The ensigns say they are Pagans who worship gods in temples and that the standards
    bowed themselves while they merely held them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Pilate has twelve strong old men chosen from the elders of the Jews to hold
    the standards for a second test.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Jesus is brought in again after the messenger again entreats him to walk on
    the cloak; the standards bow as before.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
