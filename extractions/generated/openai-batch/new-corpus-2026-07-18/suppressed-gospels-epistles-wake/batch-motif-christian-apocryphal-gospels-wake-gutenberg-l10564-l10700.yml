canonical_text:
  quote: Ye see, brethren, how envy and emulation wrought the death of a brother.
  summary: The passage presents envy and emulation as the origin of strife and disorder,
    citing Cain and Abel, Jacob and Esau, Joseph, Moses, Aaron and Miriam, Dathan
    and Abiram, David and Saul, Peter, Paul, other apostles, women sufferers, marital
    alienation, and the ruin of cities and nations as examples of harm caused by envy.
  language: English
  quote_policy: quoted
literal_observations:
