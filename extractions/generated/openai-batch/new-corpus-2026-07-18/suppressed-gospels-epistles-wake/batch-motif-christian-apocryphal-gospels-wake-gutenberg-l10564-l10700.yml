candidate_motifs:
- id: motif:1
  label: envy-driven sibling violence
  taxonomy_refs:
  - sibling_pair
  basis: The passage presents Cain and Abel as brothers, narrates Cain’s killing of
    Abel, and explicitly says envy and emulation caused the death of a brother.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage’s own emphasis is moral causation by envy rather than a developed
    sibling-pair typology.
- id: motif:2
  label: accepted and rejected offerings before a divine evaluator
  taxonomy_refs:
  - sacred_exchange
  - divine_judgment
  basis: Cain and Abel bring offerings to the Lord, who respects Abel’s offering but
    not Cain’s, producing Cain’s sorrow and the Lord’s admonishing speech.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage does not explicitly call the Lord’s differing regard a formal
    judgment; taxonomy refs are broad.
- id: motif:3
  label: flight from hostile kin or ruler
  taxonomy_refs:
  - departure
  basis: Jacob flees from Esau, and Moses is forced to flee from Pharaoh; both are
    placed in the catalogue of harms caused by envy.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The examples are brief and not developed as journeys.
- id: motif:4
  label: persecution of the righteous through envy
  taxonomy_refs: []
  basis: Joseph, David, Peter, Paul, other apostles, and women are described as persecuted
    or made to suffer through envy, often with endurance and reward.
  evidence_refs:
  - ev:5
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: This is a moral-exemplary pattern in the passage; no specific supplied
    taxonomy ref exactly covers it.
- id: motif:5
  label: martyrdom followed by glory or holy place
  taxonomy_refs:
  - sacrifice
  - departure
  basis: Peter is martyred and goes to the place of glory; Paul suffers martyrdom,
    departs from the world, and goes to his holy place; women suffer cruel punishments
    and receive a glorious reward.
  evidence_refs:
  - ev:10
  - ev:12
  - ev:14
  confidence: medium
  cautions: The passage describes martyrdom and reward, but does not explicitly frame
    martyrdom as sacrifice; the taxonomy refs are approximate.
- id: motif:6
  label: seditious opposition ending in grave punishment
  taxonomy_refs: []
  basis: Dathan and Abiram raise sedition against Moses and are sent quick into the
    grave.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage attributes the event to emulation; it does not give further
    details about agency or ritual significance.
- id: motif:7
  label: envy as force of social dissolution
  taxonomy_refs:
  - chaos
  basis: The passage says envy alienates women from husbands and that envy and strife
    overturn whole cities and root out great nations.
  evidence_refs:
  - ev:15
  - ev:16
  confidence: medium
  cautions: The link to the chaos taxonomy is broad; the passage concerns social and
    moral disorder rather than cosmogonic chaos.
comparison_claims:
- id: claim:1
  claim: The passage itself groups Cain-Abel and Jacob-Esau as sibling-pair examples
    in which envy produces lethal or flight-inducing conflict.
  claim_level: same_function
  target: sibling_pair motif family within cited ancient examples
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states the shared moral cause, envy, but gives full narrative
    detail only for Cain and Abel.
- id: claim:2
  claim: 'The passage compares ancient scriptural examples with nearer apostolic and
    martyr examples as serving the same moral function: showing the harms caused by
    envy and emulation.'
  claim_level: same_function
  target: ancient examples and apostolic/martyr examples in the passage
  evidence_refs:
  - ev:4
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  - ev:14
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal rhetorical comparison, not evidence of historical
    contact between separate traditions.
- id: claim:3
  claim: Peter, Paul, other apostles, and persecuted women are presented as parallel
    examples of steadfast suffering that results in glory, holy place, reward, or
    exemplary memory.
  claim_level: same_function
  target: apostolic and female martyr-sufferer pattern in the passage
  evidence_refs:
  - ev:10
  - ev:12
  - ev:13
  - ev:14
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives named detail for Peter and Paul, but treats other
    apostles and women collectively.
