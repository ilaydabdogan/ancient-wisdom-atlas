canonical_text:
  quote: ''
  summary: 'An interpreting speaker explains a visionary tower: the builders are angels,
    the gate and foundation are the Son of God, the tower is the church, and the virgins
    who clothe entrants are holy spirits or powers. Some stones are rejected after
    turning from the virgins to black-clad women, but repentance and return to the
    virgins can restore entry into the house of God. The virgins are named as virtues
    such as Faith, Continence, Power, Patience, Simplicity, Innocence, Chastity, Cheerfulness,
    Truth, Understanding, Concord, and Charity.'
  language: English
  quote_policy: summarized
