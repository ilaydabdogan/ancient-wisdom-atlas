canonical_text:
  quote: ''
  summary: The passage gives moral warnings about feeding the needy, wealth, judgment,
    church leaders, and peace. A female visionary figure is carried to the tower,
    and the narrator asks about her three appearances. After fasting, a young man
    explains that the woman’s changing age and posture represent the narrator’s spiritual
    weakness, renewal, strengthening in faith, and refreshment through revealed good
    things.
  language: English
  quote_policy: summarized
