canonical_text:
  quote: ''
  summary: Herod seeks the birthplace of Christ and plans his death. An angel warns
    Joseph in a dream to take the child and his mother into Egypt. In an Egyptian
    city, an idol through which Satan speaks recognizes the arrival of the unknown
    God and Son of God, then falls. Mary washes Christ's swaddling clothes and hangs
    them on a post; a demon-possessed priest's son puts one cloth on his head, and
    the devils leave him in the shapes of crows and serpents. The boy is healed, his
    father recognizes the child's greater power, and the passage cites the prophecy,
    “Out of Egypt I have called my son.”
  language: English
  quote_policy: summarized
