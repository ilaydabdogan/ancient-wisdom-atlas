canonical_text:
  quote: ''
  summary: Ignatius, also called Theophorus, addresses the church at Philadelphia
    in Asia. He praises its concord and its bishop, warns against division, false
    doctrine, schism, deceptive wolves, and evil herbs, and urges unity through repentance,
    the same holy eucharist, one flesh, one cup, one altar, one bishop, presbytery,
    and deacons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ignatius, also called Theophorus, addresses the church of God the Father and
    Jesus Christ at Philadelphia in Asia and salutes it in the blood of Jesus Christ.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The church is described as fixed in the concord of God, rejoicing in the passion
    of the Lord, and fulfilled in mercy through his resurrection.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Unity with the bishop, the presbyters with him, and the deacons appointed
    according to the mind of Jesus Christ is especially commended.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The bishop is said to have obtained his ministry not by himself, by men, or
    vain glory, but by the love of God the Father and Jesus Christ.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The bishop is praised for moderation, silence, constancy, freedom from passion,
    and fitness to commands, with a comparison to a harp fitted to its strings.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The addressees are told, as children of light and truth, to flee divisions
    and false doctrines and to follow where their shepherd is as sheep.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Many wolves are described as seeming worthy of belief and leading captive
    with false pleasure those who run in the course of God.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The addressees are told to abstain from evil herbs that Jesus Christ does
    not dress, because such herbs are not the plantation of the Father.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ignatius states that he has found no division among the addressees, but rather
    purity.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Those who return with repentance into the unity of the church are said to
