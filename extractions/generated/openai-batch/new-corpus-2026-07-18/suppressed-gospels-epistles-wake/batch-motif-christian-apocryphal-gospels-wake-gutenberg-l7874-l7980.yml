canonical_text:
  quote: ''
  summary: Christ delivers Adam to Michael, who leads him and others into Paradise.
    Enoch and Elijah identify themselves as deathless translated figures and describe
    their future return against Antichrist. A thief carrying the sign of the cross
    recounts being crucified with Jesus, receiving the cross as a token for entry,
    and being admitted through the gates of Paradise by its angelic guard. The patriarchs
    praise God for mercy shown to sinners.
  language: English
  quote_policy: summarized
