canonical_text:
  quote: Do we not know that the saints shall judge the world, as Paul teaches?
  summary: The writer laments Valens, a former presbyter who has fallen into covetousness,
    warns the community against covetousness and evil, invokes divine judgment and
    Pauline teaching, urges restoration of erring members rather than enmity, blesses
    the recipients through God and Jesus Christ, asks prayers for saints, rulers,
    persecutors, and enemies, and gives instructions concerning letters of Ignatius,
    Crescens, and Crescens's sister. The line range ends with a heading introducing
    the Book of Hermas called His Vision.
  language: English
  quote_policy: quoted
