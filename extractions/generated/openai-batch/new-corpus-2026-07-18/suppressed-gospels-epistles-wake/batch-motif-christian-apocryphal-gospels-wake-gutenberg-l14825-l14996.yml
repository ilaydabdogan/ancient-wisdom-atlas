canonical_text:
  quote: ''
  summary: The passage presents Moses' commands about clean and unclean animals as
    spiritual instruction rather than merely dietary law. It interprets forbidden
    animals as signs of kinds of sinful people or conduct, interprets permitted animals
    as signs of those who know and meditate on the Lord's command, relates the threefold
    command to David's wording about the ungodly, sinners, and scorners, and concludes
    that God has circumcised ears and hearts so that the commandments may be understood
    rightly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says Moses' prohibitions concerning swine, birds of prey, certain
    fish, hare, hyena, and weazel were spoken in a spiritual sense rather than as
    God's command about meat alone.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
- id: obs:2
  text: The sow is said to signify persons who forget God while living in pleasure
    and acknowledge the Lord only when pressed by want.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The eagle, hawk, kite, and crow are said to signify people who do not labor
    for food but take what belongs to others and lay snares while appearing innocent.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The lamprey, polypus, and cuttle-fish are said to signify altogether wicked
    people adjudged to death; these fishes are described as wallowing in mire and
    dirt at the bottom of the deep.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The hare, hyena, and weazel are each connected with warnings against adultery,
    corruption, impurity, or wickedness of the mouth.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker says David rightly understood a threefold command, linking the
    ungodly with deep-dwelling fishes, sinners with the sow, and scorners with watching
    birds.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:7
  text: Animals that divide the hoof and chew the cud are interpreted as signifying
