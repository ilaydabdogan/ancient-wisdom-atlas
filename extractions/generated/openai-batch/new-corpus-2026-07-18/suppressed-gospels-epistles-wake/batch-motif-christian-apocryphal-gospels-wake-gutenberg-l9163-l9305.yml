canonical_text:
  quote: "“Nor would she depart from the window, till with exceeding joy she was subdued
    to the doctrines of faith.”"
  summary: Thecla, a virgin betrothed to Thamyris, listens from her window to Paul
    preaching in Onesiphorus’s house. She remains there for days, neglecting food
    and drink, and her mother and betrothed unsuccessfully try to make her respond.
    Thamyris then questions Demas and Hermogenes, who describe Paul as teaching chastity,
    discouraging marriage, and linking future resurrection with bodily purity.
