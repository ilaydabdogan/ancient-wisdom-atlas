canonical_text:
  quote: ''
  summary: The Church of God at Rome addresses the Church of God at Corinth, recalls
    delays caused by dangers and calamities, condemns a sedition caused by a few men,
    and praises Corinth's former faith, order, humility, obedience, hospitality, prayer,
    mutual care, and inward keeping of God's commandments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Church of God at Rome addresses the Church of God at Corinth as elect
    and sanctified through Jesus Christ, and wishes grace and peace from Almighty
    God by Jesus Christ.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The writers say sudden and unexpected dangers and calamities made them slower
    in considering the Corinthians' inquiry.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A few headstrong and self-willed men are said to have fomented a wicked and
    detestable sedition that caused Corinth's name to be blasphemed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Corinthians are described as formerly known for firmness of faith, fruitful
    good works, moderation in religion, hospitality, and knowledge of the Gospel.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Corinthians are described as having acted without respect of persons,
    walked according to God's laws, been subject to rulers, and honored the aged.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Young men were commanded to think modest and grave things.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women were exhorted to act with pure conscience, love their husbands, keep
    due obedience, and order their houses gravely and discreetly.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The community is described as humble-minded, preferring subjection to rule
    and giving to receiving, and content with the portion God dispensed.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A firm, blessed, and profitable peace, an unsatiable desire of doing good,
    and a plentiful effusion of the Holy Ghost are said to have been upon all of them.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Corinthians are described as stretching forth their hands to God Almighty
    and asking mercy if they had unwillingly sinned.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Corinthians are described as contending day and night for the whole brotherhood
    so that the number of God's elect might be saved.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Corinthians are described as sincere, without offence toward one another,
    not mindful of injuries, regarding sedition and schism as an abomination, bewailing
    neighbors' sins, and having God's commandments written on the tables of their
    heart.
  category: attribute
  evidence_refs:
  - ev:9
