  quote: ''
  summary: An editorial note introduces the seven Epistles of Ignatius, describing
    Wake’s translation from Vossius, problems of differing and corrupted editions,
    earlier printed Latin and Greek versions, the supposed Polycarp collection, ancient
    witnesses, controversy over authenticity, and Wake’s defense of their utility.
    It then introduces the Epistle of Polycarp to the Philippians, noting its disputed
    genuineness and translations by Wake and Dr. Cave.
