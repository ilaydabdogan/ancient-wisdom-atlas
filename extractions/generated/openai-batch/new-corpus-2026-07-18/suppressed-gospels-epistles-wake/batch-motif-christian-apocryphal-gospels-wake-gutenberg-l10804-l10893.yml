canonical_text:
  quote: ''
  summary: 'An exhortation urges obedience, appeal to divine mercy, and rejection
    of vanity, contention, and envy. It then presents scriptural examples: Enoch is
    righteous and translated without known death; Noah is faithful and associated
    with regeneration and the ark that saves living creatures; Abraham obeys God,
    departs from his homeland, receives promises of land, blessing, and innumerable
    descendants, believes God, receives a son in old age, and offers that son in sacrifice
    on a mountain.'
  language: English
  quote_policy: summarized
