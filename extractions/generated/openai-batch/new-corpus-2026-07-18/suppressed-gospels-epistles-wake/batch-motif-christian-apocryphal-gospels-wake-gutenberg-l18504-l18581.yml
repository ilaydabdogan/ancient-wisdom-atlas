canonical_text:
  quote: A Christian has not the power of himself; but must be always at leisure for
    God's service.
  summary: The letter-writer reports peace at the church of Antioch in Lyria through
    Polycarp's prayers, asks Polycarp to appoint and send a messenger to Syria, explains
    that he must suddenly sail from Troas to Neapolis and cannot write to all churches,
    instructs Polycarp to coordinate letters and messengers, and closes with salutations
    and blessings.
  language: English
