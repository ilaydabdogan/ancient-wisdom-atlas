canonical_text:
  quote: ''
  summary: In a trial scene before Pilate, Pilate is afraid and receives a warning
    from his wife, who reports suffering because of a night vision about Jesus. Jewish
    accusers call Jesus a conjuror and charge him with illegitimate birth, while other
    Jewish witnesses defend the betrothal of Mary and Joseph. Annas and Caiphas reject
    those witnesses as followers of Jesus and repeat charges that he is basely born,
    a conjuror, and claims to be Son of God and king. Pilate questions the witnesses
    under an oath formula invoking Caesar; they refuse to swear because of their law.
    Pilate asks why the Jews want Jesus killed, and the answer given is that he performed
    cures on the Sabbath.
  language: English
  quote_policy: summarized
