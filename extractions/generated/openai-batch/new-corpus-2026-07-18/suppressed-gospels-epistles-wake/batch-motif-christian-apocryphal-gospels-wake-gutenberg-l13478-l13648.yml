literal_observations:
- id: obs:1
  text: The speaker exhorts the brethren to leave their sojourning in this world,
    do the will of the one who called them, and not fear departure from the world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lord says the hearers will be as sheep among wolves; Peter asks what happens
    if the wolves tear the sheep; Jesus answers that the sheep should not fear the
    wolves after death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Jesus tells the hearers not to fear those who kill them, but to fear the one
    who after death can cast soul and body into hell-fire.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sojourning of the flesh in the present world is described as brief, while
    Christ’s promise is described as the rest of the coming kingdom and eternal life.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage instructs the hearers to order their conduct in holiness and righteousness
    and not desire the things of this world.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A saying of the Lord contrasts service to God and Mammon and asks what profit
    comes from gaining the whole world while losing one’s soul.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The present world and the world to come are called two enemies; the present
    world is associated with adultery, corruption, covetousness, and deceit, while
    the world to come renounces these things.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says one cannot be friends with both worlds and must forsake one
    in order to enjoy the other.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Noah, Job, and Daniel are cited as righteous men who would not deliver their
