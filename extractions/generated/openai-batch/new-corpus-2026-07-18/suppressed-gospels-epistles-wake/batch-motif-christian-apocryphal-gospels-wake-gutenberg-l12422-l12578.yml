  quote: the rod of Aaron was found not only to have blossomed, but also to have fruit
    upon it.
  summary: The passage argues that church ministry was orderly established by God
    through Christ and the Apostles. It uses Moses' handling of a dispute over priesthood,
    especially the sealed rods and Aaron's blossoming rod, as a precedent for divinely
    sanctioned office and for avoiding division. It then applies this precedent to
    apostolic appointments, succession, and the impropriety of removing approved ministers.
