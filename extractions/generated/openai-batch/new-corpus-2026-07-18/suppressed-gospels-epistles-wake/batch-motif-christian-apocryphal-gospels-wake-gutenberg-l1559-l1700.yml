canonical_text:
  quote: ''
  summary: Priests commission a new temple veil and assign its materials by lot among
    seven virgins; Mary receives the true purple. Zacharias becomes dumb and Samuel
    temporarily replaces him. Mary hears a greeting while drawing water, then an angel
    announces that she will conceive by the Holy Ghost and bear Jesus, the Son of
    the Living God. Mary accepts the message, finishes the purple, receives a priestly
    blessing, visits Elizabeth, and is blessed by Elizabeth after Elizabeth's unborn
    child leaps. Mary later becomes visibly pregnant, fears exposure, hides herself,
    and is said to be fourteen years old.
  language: English
  quote_policy: summarized
