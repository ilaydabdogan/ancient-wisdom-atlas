canonical_text:
  quote: There are two angels with man; one of righteousness, the other of iniquity.
  summary: An instructor explains that each person has two angels, one of righteousness
    and one of iniquity. The righteous angel is associated with mildness, modesty,
    chastity, forgiveness, charity, and piety, while the angel of iniquity is associated
    with bitterness, anger, foolishness, harmful works, desire, drunkenness, pride,
    and ambition. The hearer is told to follow the angel of righteousness, reject
    the angel of iniquity, and walk the right way rather than the evil way.
  language: English
