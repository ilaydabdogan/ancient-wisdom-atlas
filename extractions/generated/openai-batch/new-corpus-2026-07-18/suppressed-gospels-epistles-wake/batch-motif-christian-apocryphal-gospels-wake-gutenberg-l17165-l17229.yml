canonical_text:
  quote: ''
  summary: 'An epistolary exhortation sent from Smyrna: the speaker greets the addressees,
    says that his bonds for Christ urge them toward concord and mutual prayer, asks
    them to support their bishop and presbyters, requests prayer for himself and for
    the church of Syria, and closes with confidence that the Father in Jesus Christ
    will fulfill their petitions.'
  language: English
  quote_policy: summarized
