  summary: 'The passage interprets prophetic sayings and Mosaic narratives as types
    of Jesus: a fallen and rising blood-dropping tree as the cross; Moses'' stretched
    arms as the cross-sign connected with Israel''s victory; serpents and the raised
    brazen serpent as judgment and healing; Joshua son of Nun as a manifestation of
    Jesus by name and type; and David and Isaiah as witnesses that Christ is Lord
    and Son of God.'
