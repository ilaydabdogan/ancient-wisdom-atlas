canonical_text:
  quote: ''
  summary: Ignatius, also called Theophorus, addresses the church at Magnesia. He
    greets them in God the Father and Jesus Christ, rejoices in their charity, mentions
    his bonds, and wishes unity in Christ. He names Damas the bishop, Bassus and Apollonius
    the presbyters, and Sotio the deacon. He exhorts the church to reverence and obey
    their young bishop, warning that disobedience to the visible bishop affronts the
    invisible God who knows the heart. He contrasts merely being called Christians
    with truly acting as Christians gathered according to God's commandment.
  language: English
  quote_policy: summarized
