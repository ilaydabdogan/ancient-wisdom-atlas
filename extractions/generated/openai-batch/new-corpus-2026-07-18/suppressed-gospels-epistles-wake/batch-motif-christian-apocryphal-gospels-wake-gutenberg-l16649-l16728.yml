canonical_text:
  quote: ''
  summary: The speaker teaches that all things have an end and sets death and life
    before the audience. He contrasts coins of God and of the world, identifies unbelievers
    with the world and the faithful with the character of God through Jesus Christ,
    and exhorts readiness to die after the likeness of Christ's passion. He then urges
    divine concord under bishop, presbyters, and deacons, mutual love without division,
    common prayer and hope, and a gathering as one temple and one altar in relation
    to one Jesus Christ and one Father.
  language: English
  quote_policy: summarized
