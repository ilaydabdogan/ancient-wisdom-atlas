canonical_text:
  quote: This Gospel is ascribed to James.
  summary: An editorial notice says the Protevangelion is ascribed to James, was often
    alluded to by ancient Fathers, and had broad credit in the Christian world. It
    identifies controversies about Joseph’s age at Christ’s birth, Joseph’s alleged
    prior widower status and children, and later claims of Joseph’s virginity. It
    also summarizes claims about the text’s Hebrew origin, manuscript transmission
    from the Levant by Postellus, Latin translation, printing at Basel in 1552, eastern
    canonical use as reported by Postellus, and apocryphal status according to some
    Protestant and Catholic divines. The next heading introduces the First Gospel
    of the Infancy of Jesus Christ.
  language: English
  quote_policy: quoted
