canonical_text:
  quote: ''
  summary: An apocryphal nativity passage attributes the account to Joseph the high-priest/Caiphas.
    The infant Jesus speaks in the cradle and identifies himself as Son of God and
    saviour. Joseph and Mary travel for taxation; Mary gives birth in a cave near
    sunset. Joseph brings an old Hebrew woman, who witnesses the cave filled with
    extraordinary light, sees the infant wrapped and nursing, is made whole after
    touching him, and vows service. Shepherds arrive, make a fire, rejoice, and the
    heavenly host appears praising God; the cave seems like a glorious temple where
    angels and humans adore God because of Christ's birth.
  language: English
  quote_policy: summarized
