canonical_text:
  quote: ''
  summary: Pilate convenes Jewish temple authorities in a closed chapel, demands the
    temple book, and requires truthful testimony about Jesus. Annas and Caiaphas state
    that Jesus was crucified in ignorance, that witnesses reported him alive after
    death and ascending into heaven, and that two raised witnesses reported his deeds
    among the dead. The authorities interpret a sacred book, an Adamic prophecy, ark
    measurements, and chronological genealogies as testimony that Jesus is the Son
    of God, Lord and King of Israel, and true Almighty God.
  language: English
  quote_policy: summarized
