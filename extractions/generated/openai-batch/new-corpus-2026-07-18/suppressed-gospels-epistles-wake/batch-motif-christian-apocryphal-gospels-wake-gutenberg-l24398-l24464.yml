canonical_text:
  quote: ''
  summary: A speaker explains the meaning of rods that are dry except for green tops,
    identifying them with believers who lived wickedly but did not abandon God. After
    hearing, they repent and live righteously, some suffering death or trials. The
    speaker commands the narrator to tell all people to repent, saying the Lord mercifully
    sent him to preach repentance. Those who repent, cleanse themselves, and follow
    the commands will receive cure of former iniquities and live unto God; those who
    continue transgressing condemn themselves to death. The speaker promises further
    revelation later.
  language: English
  quote_policy: summarized
