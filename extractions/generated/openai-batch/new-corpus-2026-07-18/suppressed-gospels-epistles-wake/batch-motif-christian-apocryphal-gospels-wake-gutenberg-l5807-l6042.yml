canonical_text:
  quote: ''
  summary: In a hearing before Pilate, Nicodemus defends Jesus as a worker of miracles
    from God and compares his works to Moses' signs before Pharaoh. Several witnesses
    then testify to healings, a cure connected with the sheep-pool, restoration of
    sight, cleansing and straightening by word, Veronica's cure by touching Jesus'
    garment, water changed into wine at Cana, exorcism and mass healings at Capernaum,
    and the healing of Centurio's servant at a distance.
  language: English
  quote_policy: summarized
