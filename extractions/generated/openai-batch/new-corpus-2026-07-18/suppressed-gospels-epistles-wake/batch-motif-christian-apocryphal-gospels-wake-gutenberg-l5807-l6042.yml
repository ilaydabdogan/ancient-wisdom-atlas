  evidence_refs:
  - ev:1
- id: obs:3
  text: Nicodemus cites Moses' God-commanded miracles before Pharaoh and contrasts
    them with the magic of Jannes and Jambres, which he says was not from God.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Jews accuse Nicodemus of becoming Jesus' disciple and wish him to have
    his lot with Christ; Nicodemus accepts the doctrine and lot named by them.
  category: speech
  evidence_refs:
  - ev:3
