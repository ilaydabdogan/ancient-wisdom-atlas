canonical_text:
  quote: darkness was upon the face of the whole earth until the ninth hour
  summary: At Jesus’ death, darkness and an eclipse occur, the temple veil and rocks
    are rent, graves open, and bodies of saints arise. Jesus cries out, commends his
    spirit to the Father, and dies. The centurion and bystanders react; the governor
    questions the Jews, who call the eclipse natural. Joseph of Arimathaea obtains
    permission to take Jesus’ body, and with Nicodemus prepares it with spices and
    places it in a new rock-cut tomb sealed by a great stone.
  language: English
  quote_policy: quoted
