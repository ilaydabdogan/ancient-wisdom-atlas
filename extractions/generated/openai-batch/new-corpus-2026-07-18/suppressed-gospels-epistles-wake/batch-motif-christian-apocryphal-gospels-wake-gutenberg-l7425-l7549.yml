canonical_text:
  quote: ''
  summary: Christ, called the King of Glory and the mighty Lord, arrives at the gates
    of hell. A thunder-like voice commands the gates to lift. The prince of hell expels
    Satan and orders the gates barred, while the saints, David, and Isaiah demand
    their opening and cite prophecies about broken gates, resurrection, and the defeat
    of death. David identifies the King of Glory as the Lord of heaven and earth.
    The Lord appears in human form, lights the darkness, breaks fetters, and visits
    those in deep darkness and the shadow of death.
  language: English
  quote_policy: summarized
