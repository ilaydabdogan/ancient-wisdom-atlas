canonical_text:
  quote: ''
  summary: Jewish leaders and Levites react with astonishment to reports about Jesus.
    Witnesses say they saw Jesus talking with his disciples on Mount Olivet and ascending
    to heaven. Annas and Caiaphas examine the witnesses and cite the rule of two or
    three witnesses. Joseph recounts Jesus' death, burial, and being seen alive, then
    reports that Simeon's two sons, Charinus and Lenthius, have risen from their tombs.
    The leaders find the two men praying in Arimathaea, bring them to a shut synagogue
    in Jerusalem, swear them by God and the law to tell what they saw and how they
    were raised, and the two request paper to write their account.
  language: English
  quote_policy: summarized
