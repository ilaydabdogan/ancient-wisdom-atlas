- id: obs:3
  text: A sun-coloured golden and purple-coloured light suddenly appears and illuminates
    the place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Adam, with the patriarchs and prophets, rejoices and identifies the light
