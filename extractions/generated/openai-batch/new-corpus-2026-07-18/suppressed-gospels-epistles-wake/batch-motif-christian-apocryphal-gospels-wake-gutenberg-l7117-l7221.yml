canonical_text:
  quote: ''
  summary: First-person narrators ask Jesus to permit disclosure of mysteries seen
    after death in hell. In the depth of hell a great golden and purple light appears.
    Adam, Isaiah, Simeon, and John the Baptist identify or announce Jesus as light,
    salvation, Son of God, Lamb of God, and coming visitor to those in darkness and
    the shadow of death. John recalls Jesus' baptism in the Jordan, the Holy Ghost
    descending like a dove, and a heavenly voice naming Jesus as the beloved Son.
  language: English
  quote_policy: summarized
