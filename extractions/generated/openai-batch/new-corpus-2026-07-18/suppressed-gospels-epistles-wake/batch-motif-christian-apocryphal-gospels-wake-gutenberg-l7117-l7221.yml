  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: John says he identified Jesus as the Lamb of God who takes away the sins of
    the world.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: John reports baptizing Jesus in the river Jordan, seeing the Holy Ghost descend
