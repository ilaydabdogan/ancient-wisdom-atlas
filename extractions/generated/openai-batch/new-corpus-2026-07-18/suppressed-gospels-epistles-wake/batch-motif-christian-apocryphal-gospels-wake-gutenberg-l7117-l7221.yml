- id: obs:1
  text: The narrators ask Jesus for permission to declare mysteries they saw after
    death, while noting that he had forbidden disclosure of secret things wrought
    in hell.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrators say they were placed with their fathers in the depth of hell,
    in black darkness.
  category: setting
  evidence_refs:
