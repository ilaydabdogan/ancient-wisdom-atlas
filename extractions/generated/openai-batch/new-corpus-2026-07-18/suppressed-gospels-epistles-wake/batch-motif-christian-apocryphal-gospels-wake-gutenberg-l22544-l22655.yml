canonical_text:
  quote: As the vine is supported by the elm, so is the rich man helped by the prayers
    of the poor.
  summary: 'An angel explains to the narrator that the vine and elm form a pattern
    for servants of God: the vine bears better fruit when supported by the elm, just
    as the rich and poor mutually benefit when the rich provide material aid and the
    poor pray for them. Those who do this are promised not to be forsaken and to be
    written in the book of life.'
