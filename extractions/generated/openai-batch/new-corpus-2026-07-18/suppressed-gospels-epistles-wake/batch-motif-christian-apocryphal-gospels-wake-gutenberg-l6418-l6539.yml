canonical_text:
  quote: ''
  summary: After Joseph of Arimathaea buries Jesus, Jewish authorities seek Nicodemus,
    witnesses, and other supporters of Jesus. Nicodemus accepts association with Christ.
    Joseph defends his burial of Jesus, accuses the authorities of injustice in the
    crucifixion, is seized, threatened with denial of burial, and imprisoned in a
    sealed windowless chamber while Annas and Caiaphas arrange guards and deliberate
    his death. An editorial note says a portion is missing and surmises Joseph's miraculous
    escape from the next chapter.
  language: English
  quote_policy: summarized
