canonical_text:
  quote: ''
  summary: 'A female revelatory figure explains the parable of a tower: the tower
    is the church, it is built on water because life is saved by water, angels build
    it and bring stones, and the different stones signify different categories of
    people according to faith, service, repentance, discord, sin, or exclusion.'
  language: English
  quote_policy: summarized
