canonical_text:
  quote: ''
  summary: Thecla returns to Paul and reports that she has been baptized and aided
    in Antioch. Paul sends her to teach at Iconium. She visits the house of Onesiphorus,
    prays where Paul had preached, tries unsuccessfully to persuade her mother Theoclia,
    and then goes to Daphne, Seleucia, and a mountain called Calamon or Rodeon. A
    bright cloud conducts her journey and leads her to the mountain, where she endures
    temptations of the devil with Christ's help, instructs women, attracts monastic
    followers, and performs miraculous cures and exorcisms. The physicians of Seleucia
    become envious because their trade loses value.
  language: English
  quote_policy: summarized
