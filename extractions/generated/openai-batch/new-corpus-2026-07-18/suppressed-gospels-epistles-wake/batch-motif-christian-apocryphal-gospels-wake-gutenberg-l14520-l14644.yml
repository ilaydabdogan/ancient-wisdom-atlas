canonical_text:
  quote: ''
  summary: The passage interprets Jesus' suffering and crucifixion through temple
    fasting rites, the offering of Isaac, and a ceremony involving two goats. One
    goat is offered on the altar while the other is accursed, mocked, marked with
    scarlet wool, and sent into the wilderness; the passage presents these actions
    as figures of Christ's passion, future recognition, and the difficult path to
    his kingdom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that the good God has manifested all things so that thanks
    and praise may be given.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Son of God is described as Lord of all, future judge of the living and
    dead, one who suffered, was crucified, and was given vinegar and gall to drink.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that priests of the temple foreshowed later events through
    written commands about an appointed fast, death for non-observance, offering a
    body for sins, and the offering of Isaac upon an altar.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A goat is said to be offered on the day of the fast for sins; the priests
    alone eat the inwards not washed with vinegar while the people fast and lament
    in sackcloth and ashes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two fair and alike goats are commanded to be taken and offered; the high priest
    takes one for a burnt offering, and the other is declared accursed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The congregation spits upon and pricks the accursed goat, places scarlet wool
    around its head, and has it carried into the wilderness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The appointed person leads the goat into the wilderness, removes the scarlet
    wool, and places it upon a thorn bush whose young sprouts are said to be eaten
    and whose fruit is sweet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage interprets the accursed and crowned goat as a type of Jesus and
    links it with seeing Christ in a scarlet garment after crucifixion, contempt,
    piercing, and mockery.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Jews are said to have been commanded to take two fair and equal goats
    so that, when the Saviour comes in the clouds of heaven, they may be amazed at
    the likeness of the goats.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The scarlet wool placed among thorns is called a figure of Jesus set out to
    the church, and the passage says that those who would come to Christ's kingdom
    must pass through many afflictions and troubles.
  category: speech
  evidence_refs:
  - ev:6
