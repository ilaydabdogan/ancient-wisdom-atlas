canonical_text:
  quote: ''
  summary: A visionary narrator is reassured about divine commands and repentance,
    then shown two shepherds and their sheep. A finely dressed young shepherd represents
    delight and pleasure, whose sheep are divided between those beyond return and
    those still capable of repentance. A stern rustic shepherd, identified as a holy
    angel appointed for punishment, drives the repentable sheep into a thorny, painful
    place; the pains are explained as worldly afflictions that can instruct sinners
    and lead them to repentance and acknowledgment of God as just Judge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator sits at home, praises God, reflects that the commands are good
    and salvific, and says that walking in them brings happiness and life unto God.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A familiar figure appears beside the narrator, answers his doubt, says the
    commands are good, and says strength will be given to fulfill them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker instructs repentant people to cast away worldly naughtiness, put
    on virtue and righteousness, keep the commands, and avoid future sin.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: In a field, the guide shows a young shepherd finely arrayed in purple garments,
    feeding large flocks whose sheep are joyful, delighted, and skipping or running
    about.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The guide identifies the young shepherd as the messenger of delight and pleasure,
    saying he corrupts servants of God, turns them from truth, and leads some to death
    and others to falling away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The guide says the exceedingly joyful sheep are those who have departed from
    God, given themselves to present lusts, blasphemed the Lord's name, and have no
    return by repentance unto life.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The guide says the sheep that were not leaping but feeding in one place are
    those who gave themselves to pleasures but did not speak wickedly against the
    Lord, and that they still have hope of repentance and renewal.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A great shepherd is shown with a rustic appearance, white goat's skin, shoulder
    bag, hard knotted stick, whip, and stern countenance.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The great shepherd takes the non-leaping pleasure-sheep, drives them into
    a steep craggy place full of thorns and briars, where they become entangled, feed
    on thorns and briars, are whipped, and receive no rest.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator grieves over the afflicted sheep and asks who the cruel shepherd
    is; the guide answers that he is one of the holy angels appointed for punishing
    sinners.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The guide explains that the pains include losses, poverty, sicknesses, unsettledness,
    injuries from unworthy people, and other trials in present life.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The guide says that after vexation the sinners are delivered for good instruction,
    confirmed in faith, serve the Lord with a pure mind, remember their wrong works,
    honor God, and confess him as a just Judge.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
