  quote: ''
  summary: Polycarp and the presbyters address the church at Philippi, praise the
    Philippians for receiving and accompanying those in bonds, affirm the firm root
    and fruit of their faith, recall Jesus Christ's death and resurrection, exhort
    moral discipline and obedience, describe Christ as enthroned and future judge
    of the living and dead, and repeat teachings on mercy, forgiveness, reciprocal
    judgment, and the blessedness of the poor and persecuted.
  language: English
  quote_policy: summarized
