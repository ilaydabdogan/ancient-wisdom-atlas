canonical_text:
  quote: a great tower, which is built upon the water with bright square stones
  summary: Hermas fasts and prays for a promised revelation. The old woman directs
    him to a private field, arrives with six young men, instructs him about prayer,
    seating, martyrly suffering, and cleansing, and then shows him a vision of a tower
    built upon water from stones brought by many men. Some stones fit into the building;
    others are rejected and fall or are cast into various places, including desert,
    fire, and near water. Hermas asks for the meaning so he can tell the brethren.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Hermas fasts and prays for the revelation promised by the old woman, and she
    appears at night to tell him to choose a good and private place in a field where
    she will appear about the sixth hour.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the chosen field Hermas finds a prepared seat or bench with a linen pillow
    and fine linen covering; being alone, he is frightened, then kneels and confesses
    his sins.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old woman arrives with six young men, touches Hermas, tells him to stop
    praying only for his own sins and also pray for righteousness, lifts him, brings
    him to the seat, and tells the young men to build.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The old woman does not allow Hermas to sit on the right side, makes him sit
    on the left, and explains that the right-hand place belongs to those who have
    attained unto God and suffered for his name, while the left belongs to the rest.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The old woman says that gifts and promises belong to both right and left,
    but those on the right have greater glory; she also says Hermas has many defects
    but will be purged, as will all who do not doubt.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: Holding a bright wand, the old woman shows Hermas a great tower built upon
    water with bright square stones, built by the six young men.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'Many thousands of other men bring stones: some are drawn from the deep, some
    carried from the ground, and they give them to the six young men for the building.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The stones drawn from the deep are all placed into the building; they are
    polished and fit together so exactly that the tower appears as if built of one
    stone.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Among stones taken from the ground, some are rejected and some fitted into
