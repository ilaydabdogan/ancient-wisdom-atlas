  summary: Joseph takes the Lord Jesus with him while doing carpentry work. Jesus
    alters the dimensions of objects by stretching his hand toward them. After Joseph
    makes a royal throne too small, Jesus comforts him, has him pull one side while
    Jesus pulls the other, and the throne becomes the proper size. Witnesses praise
    God. The throne is said to be made of wood from Solomon's time.
