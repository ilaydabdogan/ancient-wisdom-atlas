  summary: Mary grows from age two to age three. Joachim and Anna discuss bringing
    her to the temple to fulfill their vow. At age three, Joachim arranges for undefiled
    daughters of the Hebrews to carry lighted lamps so Mary will not turn back. They
    ascend to the temple, where the high-priest receives and blesses Mary, places
    her on the third step of the altar, and Mary receives grace, dances, and is loved
    by all the house of Israel.
