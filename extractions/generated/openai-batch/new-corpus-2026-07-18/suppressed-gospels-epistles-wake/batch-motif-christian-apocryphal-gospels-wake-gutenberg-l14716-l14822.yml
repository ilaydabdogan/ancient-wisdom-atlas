canonical_text:
  quote: ''
  summary: The passage argues that scriptural commands to hear and to circumcise the
    heart or ears refer to inward obedience rather than fleshly circumcision. It contrasts
    Jewish reliance on physical circumcision with other circumcised peoples, denies
    that the outward sign alone establishes covenant status, and interprets Abraham’s
    circumcision of 318 household men as a mystical numerical-letter prophecy of Jesus
    and the cross.
  language: English
  quote_policy: summarized
