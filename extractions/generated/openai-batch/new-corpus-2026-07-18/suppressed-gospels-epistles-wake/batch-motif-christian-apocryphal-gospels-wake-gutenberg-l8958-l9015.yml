canonical_text:
  quote: ''
  summary: Paul greets Seneca, says divine discoveries have been granted to few, describes
    his teaching as seed in fertile soil and as the durable word of God, urges Seneca
    to avoid Jewish and Gentile superstitions, and instructs him to make known what
    he has attained to the emperor, his family, and faithful friends. Paul says many
    will not comprehend at first, but the infused Word of God will make them new men
    aspiring toward God. A following reference note summarizes learned opinions for
    and against the genuineness of the Paul-Seneca epistles.
