canonical_text:
  quote: ''
  summary: The speaker writes to the churches asking them not to prevent his death
    for God. He desires to be devoured by wild beasts, describes himself as God's
    wheat to be ground into Christ's bread, asks for prayer that he may become God's
    sacrifice, contrasts himself with Peter and Paul, describes his guarded journey
    from Syria to Rome, welcomes torments including fire, cross, beasts, and bodily
    destruction, rejects worldly rule, seeks Jesus Christ who died and rose, asks
    to go to God and enter pure light, and asks permission to imitate the passion
    of his God.
  language: English
  quote_policy: summarized
