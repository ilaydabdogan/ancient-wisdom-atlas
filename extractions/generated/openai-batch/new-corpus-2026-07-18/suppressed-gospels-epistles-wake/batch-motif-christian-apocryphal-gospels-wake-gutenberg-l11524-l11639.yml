  summary: The passage exhorts hearers to faith in Christ, moral conduct, fear of
    the Lord, and freedom from doubt. It describes the Lord as attentive to the righteous
    and opposed to evildoers, urges confidence in divine gifts, answers skepticism
    by pointing to vine and fruit maturation, and presents future resurrection through
    the examples of Jesus Christ raised as first fruits, the alternation of day and
    night, and seed that dissolves in the earth and rises again fruitfully.
  language: English
