canonical_text:
  quote: ''
  summary: Seneca writes to Paul expressing concern over Paul's long absence, asking
    what obstructs his coming, and suggesting that Paul may fear Caesar's anger because
    he abandoned his former religion and made proselytes. Paul replies to Seneca and
    Lucilius that he should not write certain matters with pen and ink because writing
    leaves marks and reveals things, especially since people near both parties may
    understand his meaning. He counsels deference to all people, especially those
    likely to quarrel, and says a submissive temper can overcome them if they can
    acknowledge their error.
  language: English
  quote_policy: summarized
