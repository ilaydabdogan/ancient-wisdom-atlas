  summary: The passage reports Joseph’s unexplained absence from a sealed chamber,
    soldiers’ testimony that an angel opened Jesus’s sepulchre and announced his resurrection,
    attempts by Jewish authorities to discredit or suppress these reports through
    payment, and a separate testimony by three men from Galilee that they saw Jesus
    instructing his eleven disciples on Mount Olivet and ascending to heaven.
  language: English
  quote_policy: summarized
