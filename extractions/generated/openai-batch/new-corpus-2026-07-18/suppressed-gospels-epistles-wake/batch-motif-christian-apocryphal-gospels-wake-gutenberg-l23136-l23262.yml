canonical_text:
  quote: ''
  summary: A questioner asks why the Son of God appears in a servant-like position
    in a parable. The respondent explains that the Son is not a servant but has authority
    from the Father, labors to blot out sins, gives the law and paths of life, and
    sets messengers over the people. The passage then explains the Holy Spirit dwelling
    in a chosen body, the body’s pure service to the Spirit, the reward of a pure
    body, and the need to keep body and spirit undefiled; God can remedy past ignorant
    wrongdoing if future purity is kept.
  language: English
  quote_policy: summarized
