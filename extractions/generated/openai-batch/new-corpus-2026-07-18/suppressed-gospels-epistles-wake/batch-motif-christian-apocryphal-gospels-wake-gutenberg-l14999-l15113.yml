  summary: The passage argues that water and the cross were foretold in figures under
    the law. It cites prophetic images of living water, broken cisterns, Zion, mountains,
    faithful water, a tree planted by streams, judgment of the wicked, and a river
    with life-giving trees, then interprets these as referring to baptism, trust in
    the cross, conversion, fruit-bearing, hope in Jesus, and everlasting life.
