canonical_text:
  quote: "“A virgin hath brought forth, which is a thing contrary to nature.”"
  summary: Joseph seeks a Hebrew midwife for Mary in a cave. A bright cloud and then
    a great light overshadow the cave until the infant appears and suckles Mary. The
    midwife reports to Salome that a virgin has given birth. Salome doubts, receives
    proof, and her hand withers. After she prays, an angel tells her to touch and
    carry the child; she is cured. A voice warns her not to declare what she has seen
    until the child comes to Jerusalem.
  language: English
  quote_policy: quoted
