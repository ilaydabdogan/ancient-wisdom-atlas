  quote: There are two ways of doctrine and power; the one of light, the other of
    darkness.
  summary: The passage presents a moral instruction called the way of light. It contrasts
    two ways, one of light under angels of God and one of darkness under angels of
    Satan, then lists commands concerning devotion to God, humility, sexual purity,
    neighbor-love, care for children, generosity, righteous judgment, peacemaking,
    confession, and prayer.
  language: English
