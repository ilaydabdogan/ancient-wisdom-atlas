canonical_text:
  quote: ''
  summary: A female interpreter explains different classes of stones related to a
    tower, identifying them with different moral and spiritual conditions. She then
    shows seven women who support the tower and names them as virtues. The passage
    ends with teaching about the tower's completion, cleansing, repentance, peace,
    mutual reception, and shared use of God's creatures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The lady says the white and round stones not proper for the tower are people
    who have faith but also worldly riches, and who deny the Lord when troubles arise
    because of riches and traffic.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lady compares cutting a round stone so it can be made square with rich
    people having their riches pared off so they can be profitable for the Lord's
    building.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Stones cast far from the tower, running in the way, and tumbled into desert
    places are identified as believers who doubt, forsake the true way, wander, and
    become miserable in desolate ways.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Stones that fall into fire and are burnt are identified as people who have
    departed from the living God and do not repent because of attachment to lusts
    and wickedness.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Stones that fall by the water but cannot roll into the water are identified
    as people who heard the word and were willing to be baptized, but withdrew after
    considering the holiness required by truth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The lady says rejected stones may repent, but cannot enter the tower; they
    can be placed in a lower rank after affliction and the fulfillment of the days
    of their sins, and salvation depends on a true sense in their hearts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hermas sees seven women about the tower, and the lady says the tower is supported
    by them according to the Lord's command.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The seven women are named Faith, Abstinence, Simplicity, Innocence, Modesty,
    Discipline, and Charity, and are described as proceeding from one another.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The lady says whoever serves these women and holds fast to their works will
    dwell in the tower with the saints of God.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The lady says the end has not yet come because the tower is still being built;
    when the tower is finished and built, it will have an end.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Hermas is told that after three days he must understand the words and speak
