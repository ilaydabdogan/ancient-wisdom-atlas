canonical_text:
  quote: ''
  summary: The speaker exhorts the beloved addressees to avoid certain doctrinal opponents
    while praying for their repentance. He presents his own impending suffering by
    death, sword, fire, and wild beasts as a way of approaching God and suffering
    with Jesus Christ. The passage rejects denial of Christ's true humanity, passion,
    blood, eucharistic flesh, and resurrection, warns of condemnation for unbelief,
    criticizes the opponents' lack of charity, and urges the community to flee divisions.
  language: English
  quote_policy: summarized
