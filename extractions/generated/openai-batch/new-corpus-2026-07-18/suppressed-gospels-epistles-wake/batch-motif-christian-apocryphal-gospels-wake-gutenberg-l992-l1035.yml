canonical_text:
  quote: '"a man standing in the form of an ass"'
  summary: The passage gives an editorial account of a Gospel bearing Mary's name,
    its attribution and ancient witnesses, variant uses of it in arguments about Christ's
    sonship and lineage, Collyridian offerings to Mary and a belief that Mary was
    born of a Virgin, an Epiphanius-cited story about Zacharias seeing an ass-formed
    being in the temple, being deprived of speech, later declaring the vision and
    being killed, and an explanation of high-priestly bells as warning the worshipped
    being to hide. It closes by linking the principal part of this Gospel to the Protevangelion
    of James, a birth account of Christ and perpetual Virgin Mary.
  language: English
