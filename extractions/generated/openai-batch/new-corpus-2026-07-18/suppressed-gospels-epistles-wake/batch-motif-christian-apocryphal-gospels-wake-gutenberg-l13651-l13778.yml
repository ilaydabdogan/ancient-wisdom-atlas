canonical_text:
  quote: We shall rise, and be judged, in our bodies;
  summary: The passage exhorts its audience to live well in the flesh because the
    flesh will be raised, judged, and rewarded. It presents God as judge, physician,
    heart-searcher, father, and promise-giver; urges repentance, love, virtue, and
    service; warns against present pleasures, evil doctrines, doubt, and double condemnation;
    compares the people to a vine or tree that moves through loss and growth toward
    ripe fruit; and concludes with expectation of the kingdom of God and the unknown
    day of God's appearing.
  language: English
  quote_policy: quoted
