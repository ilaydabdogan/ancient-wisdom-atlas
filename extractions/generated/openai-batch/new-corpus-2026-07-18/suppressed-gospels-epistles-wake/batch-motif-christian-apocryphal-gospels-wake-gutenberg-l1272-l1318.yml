  summary: Joachim remains at home for a day, then brings offerings and consults the
    plate on the priest's forehead to learn whether the Lord is propitious. No sin
    is found in him; he says the Lord has taken away his sins and returns from the
    temple justified. After nine months Anna gives birth to a girl, responds with
    praise, later nurses the child after her purification, and names her Mary.
