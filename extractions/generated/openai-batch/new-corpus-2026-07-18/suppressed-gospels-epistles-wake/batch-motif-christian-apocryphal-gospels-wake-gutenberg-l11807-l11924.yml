canonical_text:
  quote: ''
  summary: The passage exhorts the addressed community to holiness, humility, concord,
    restraint in speech, and good actions rather than self-praise. It cites Abraham,
    Isaac, and Jacob as ancestral examples of faith, sacrifice, humility, departure,
    service, and divine blessing, then states that Jacob’s line produced priests,
    Levites, Jesus according to the flesh, and rulers in Judah. It concludes that
    glorification and justification come through God’s will and faith, not through
    one’s own works or wisdom.
  language: English
  quote_policy: summarized
