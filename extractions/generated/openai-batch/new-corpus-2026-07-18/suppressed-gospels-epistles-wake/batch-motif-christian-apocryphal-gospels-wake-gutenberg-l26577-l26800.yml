canonical_text:
  quote: ''
  summary: An angel visits the narrator after the writing of the book, affirms that
    the narrator and his house have been entrusted to the shepherd, exhorts obedience
    to the shepherd's commands, identifies the shepherd with the authority of repentance,
    appoints virgins as helpers who require a pure dwelling, urges the narrator to
    proclaim God's works and practice alms-deeds, warns that failure to aid the needy
    incurs guilt, and warns that delay in doing good may result in exclusion when
    the tower is completed.
  language: English
  quote_policy: summarized
