canonical_text:
  quote: ''
  summary: Beelzebub, prince of hell, reproaches Satan for causing Christ to be crucified
    and brought into hell. He says Jesus' divine brightness has routed darkness and
    death, broken hell's prisons, released captives, and ended hell's dominion over
    humanity. Beelzebub contrasts Satan's gains through the forbidden tree and loss
    of Paradise with their loss through the wood of the cross. The King of Glory then
    declares that Satan will be subject to Beelzebub forever in place of Adam and
    his righteous sons, who belong to Christ.
  language: English
  quote_policy: summarized
