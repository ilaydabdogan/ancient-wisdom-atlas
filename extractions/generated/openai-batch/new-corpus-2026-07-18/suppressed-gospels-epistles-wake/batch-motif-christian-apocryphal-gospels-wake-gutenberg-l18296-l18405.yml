  summary: Ignatius, also called Theophorus, opens a letter to Polycarp, bishop at
    Smyrna. He gives thanks for Polycarp's steadfast faith and urges him to preserve
    unity, support others, pray, seek understanding, remain watchful, treat different
    people with fitting remedies, stand firm against other doctrines, endure suffering,
    and expect the eternal one who suffered for salvation.
