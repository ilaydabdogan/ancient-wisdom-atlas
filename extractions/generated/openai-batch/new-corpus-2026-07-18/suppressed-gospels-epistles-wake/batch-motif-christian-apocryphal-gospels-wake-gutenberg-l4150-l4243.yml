  summary: At seven years old, Jesus plays with other boys who make clay animal figures.
    Jesus commands his clay figures and birds to move, fly, stop, eat, and drink.
    The boys report this to their parents, whose fathers warn them that Jesus is a
    sorcerer. Later Jesus enters Salem's dyer's shop, throws cloths into a furnace,
    and then makes each cloth emerge dyed in the desired color; witnesses praise God.
