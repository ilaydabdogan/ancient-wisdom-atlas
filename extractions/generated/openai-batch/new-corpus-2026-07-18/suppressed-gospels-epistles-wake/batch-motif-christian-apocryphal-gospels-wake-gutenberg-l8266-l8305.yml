canonical_text:
  quote: ''
  summary: 'An editorial note surveys competing views on the Gospel''s authorship
    and antiquity: some attribute it to Nicodemus, others to a late third-century
    Christian forgery intended to support Christian claims about the Acts of Pilate.
    The note cites Jeremiah Jones and Eusebius, mentions a Pagan forgery under the
    same title, states that the text was appealed to by ancient Christians, identifies
    the translation source, and then introduces epistles of Jesus Christ and Abgarus
    king of Edessa.'
  language: English
  quote_policy: summarized
