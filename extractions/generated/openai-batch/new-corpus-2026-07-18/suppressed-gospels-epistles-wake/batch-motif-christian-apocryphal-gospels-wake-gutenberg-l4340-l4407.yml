  summary: Jesus joins boys at play in the street. The boys hide, and women deny that
    anyone is present, but Jesus identifies beings in a furnace whom the women call
    three-year-old kids. Jesus calls the kids to their shepherd; boys come out like
    kids, and the women tremble, worship Jesus, call him the good shepherd of Israel,
    and ask him to restore the boys. Jesus calls the boys to play, and the kids return
    to the shape of boys.
