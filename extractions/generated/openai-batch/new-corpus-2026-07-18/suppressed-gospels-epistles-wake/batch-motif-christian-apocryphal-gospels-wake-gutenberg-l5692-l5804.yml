canonical_text:
  quote: I find not any one fault in Jesus.
  summary: Pilate questions the accusations against Jesus, repeatedly states that
    he finds no death-worthy fault, and resists crucifixion. The Jews and their authorities
    accuse Jesus of blasphemy, cite his saying about destroying and rebuilding the
    temple, demand crucifixion, and say he deserves death because he declares himself
    Son of God and King. Jesus says Moses and the prophets prophesied his suffering
    and resurrection.
  language: English
  quote_policy: quoted
