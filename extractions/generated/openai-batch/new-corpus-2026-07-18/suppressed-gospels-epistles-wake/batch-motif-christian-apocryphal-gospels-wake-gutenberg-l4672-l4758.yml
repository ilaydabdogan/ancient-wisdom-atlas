canonical_text:
  quote: ''
  summary: Jesus is sent to school in Jerusalem, where Zaccheus and then another schoolmaster
    attempt to teach him the alphabet. Jesus asks for the meaning of Aleph before
    pronouncing Beth, explains matters of letters unknown to the master, and is judged
    to need no learning. A second master who lifts his hand to whip him has his hand
    withered and dies, after which Joseph says Jesus should not be allowed out of
    the house because those who displease him are killed.
