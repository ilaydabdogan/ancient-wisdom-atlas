canonical_text:
  quote: ''
  summary: 'The writer gives practical and ecclesiastical advice: widows, servants,
    assemblies, married persons, virgins, and clergy are to be ordered under God and
    the bishop. The passage urges unity, submission to the bishop with presbyters
    and deacons, mutual endurance, and uses military imagery in which baptism, faith,
    charity, and patience are compared to equipment for service.'
  language: English
