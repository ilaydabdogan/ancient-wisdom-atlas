canonical_text:
  quote: ''
  summary: The passage exhorts the recipients to watch for events soon to occur, flee
    evil, and interpret the present as the consummation of sin. It cites Daniel’s
    prophecy of ten kings, a fourth beast with ten horns, and a little horn that humbles
    or uproots three. It argues that the covenant belongs to the author’s community,
    recounting Moses’ forty-day fast on the Mount, his receipt of two stone tables
    written by God, the people’s idolatry, Moses’ casting down of the tables, and
    the breaking of that covenant. The passage urges resistance to iniquity, communal
    inquiry, becoming a spiritual temple, keeping commandments, and awaiting God’s
    impartial judgment according to works, while warning against falling asleep in
    sin and being shut out of the Lord’s kingdom.
  language: English
  quote_policy: summarized
