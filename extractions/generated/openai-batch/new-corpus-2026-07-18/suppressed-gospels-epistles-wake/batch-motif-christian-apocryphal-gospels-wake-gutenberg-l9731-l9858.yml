canonical_text:
  quote: ''
  summary: Thecla is received by the rich widow Trifina, brought before wild beasts,
    and placed with a fierce she-lion that licks her feet. Trifina's dead daughter
    Falconilla appears in a vision requesting that Thecla be treated as a daughter
    and asked to pray for her happiness. Thecla prays for Falconilla and later for
    Trifina. Officials demand Thecla's return to the amphitheatre, while Trifina and
    the women in the crowd denounce the judgment as unjust.
  language: English
  quote_policy: summarized
