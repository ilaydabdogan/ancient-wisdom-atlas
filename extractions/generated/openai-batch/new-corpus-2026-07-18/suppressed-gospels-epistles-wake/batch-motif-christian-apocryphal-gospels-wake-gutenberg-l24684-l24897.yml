canonical_text:
  quote: ''
  summary: A visionary tower is built on a great rock and over a gate from stones
    brought through the gate, stones rising from the deep, and stones cut from twelve
    mountains. Stones carried by virgins through the gate change color and become
    fit for the tower, while stones bypassing them remain unchanged and are removed.
    The building is paused until its Lord arrives; a very tall man identified as the
    Lord examines every stone with a rod, removes defective stones, and orders replacements
    dug from a nearby field and carried through the gate by the virgins.
  language: English
  quote_policy: summarized
