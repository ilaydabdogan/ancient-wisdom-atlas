canonical_text:
  quote: ''
  summary: The passage introduces Mary’s Davidic parentage and temple upbringing,
    names Joachim and Anna as her parents, describes their pious household practices
    and childlessness, recounts their vow to devote any child to the Lord, and narrates
    Joachim’s reproach by the high priest Isachar at Jerusalem because he has no children,
    after which Joachim withdraws in shame to the shepherds and pastures.
  language: English
