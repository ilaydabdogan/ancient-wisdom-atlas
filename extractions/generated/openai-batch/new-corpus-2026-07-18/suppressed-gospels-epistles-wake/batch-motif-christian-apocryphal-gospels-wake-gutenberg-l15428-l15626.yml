canonical_text:
  quote: ''
  summary: 'The passage interprets the Sabbath commandment, the creation week, and
    the temple through an eschatological and spiritual reading: six creation days
    are identified with six thousand years, the seventh day with final divine rest
    after judgment and renewal, the eighth day with Jesus'' resurrection and ascent,
    and the true temple with believers renewed as an incorruptible dwelling of God.'
  language: English
  quote_policy: summarized
