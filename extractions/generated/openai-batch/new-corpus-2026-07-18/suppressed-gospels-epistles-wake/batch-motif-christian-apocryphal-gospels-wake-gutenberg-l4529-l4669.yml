canonical_text:
  quote: ''
  summary: 'Chapter XIX presents a sequence of child-Jesus miracle episodes: Jesus
    cures James after a viper bite; answers an accusation by questioning a dead boy;
    carries water in his mantle after a pitcher breaks; makes sparrows that fly; and
    pronounces deaths on two boys after destructive or injurious acts.'
  language: English
  quote_policy: summarized
