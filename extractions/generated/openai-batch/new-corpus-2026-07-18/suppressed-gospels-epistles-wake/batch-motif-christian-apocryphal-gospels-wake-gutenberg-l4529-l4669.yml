- id: obs:1
  text: Joseph sends his son James to gather wood, and the Lord Jesus goes with him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A venomous viper bites James while he is gathering wood; Jesus blows on the
    bitten place, and it becomes instantly well.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some boys are playing on a house-top; one boy falls down and dies, while the
    other boys run away and Jesus is left alone there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dead boy's relations accuse Jesus of throwing the boy down, and Jesus
    denies the charge.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Jesus proposes asking the dead boy; he addresses the boy as Zeinunus, and
    the dead boy answers that Jesus did not throw him down.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mary commands Jesus to fetch water from a well; the full pitcher breaks, and
    Jesus gathers the water in his mantle and brings it to her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mary is astonished by the water episode and keeps this and other things she
    has seen in memory.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Jesus and other boys are by a river, drawing water through little channels
