  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Jesus has made twelve sparrows and placed them around his pool, three on each
    side.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the Sabbath, the son of Hanani objects to making clay figures and breaks
    down the boys' fish-pools.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Jesus claps his hands over the sparrows he made, and they fly away chirping.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: When the son of Hanani comes to destroy Jesus' fish-pool, the water vanishes;
