canonical_text:
  quote: ''
  summary: Rejected and defective stones around a tower are examined by a shepherd
    under higher authority. Some stones are cleansed, cut, squared, and fitted into
    the tower by virgins; others are cast away or returned to their places of origin.
    The work is urgent because the master of the house may arrive suddenly and find
    the stones unclean.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Round white stones are initially not put into the tower because they are hard
    and would require too much time to cut, but they are placed around the tower for
    possible later squaring and inclusion.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief in dignity and lord of the tower gives rejected stones to the shepherd
    and commands him to cleanse them, fit suitable ones into the tower, and cast unsuitable
    ones far away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the chief departs, the virgins remain around the tower to keep it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The shepherd says he will cut away parts of rejected stones so they can agree
    with the rest of the building; smaller stones will be put in the middle and larger
    ones outside to hold them in.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The shepherd plans to return after three days to cleanse and place stones
    in the tower before the master of the house might arrive suddenly and find them
    unclean.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'After three days, stones of different conditions are examined: black, rough,
