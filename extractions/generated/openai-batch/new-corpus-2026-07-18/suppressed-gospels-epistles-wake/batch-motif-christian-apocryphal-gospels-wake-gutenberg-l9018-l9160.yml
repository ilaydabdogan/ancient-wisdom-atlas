canonical_text:
  quote: ''
  summary: The passage opens the Acts of Paul and Thecla. Paul travels to Iconium
    after leaving Antioch; Demas and Hermogenes accompany him and are characterized
    as hypocritical. Onesiphorus and his family go out to meet Paul, identify him
    by a description from Titus, and host him. Paul is described in bodily terms and
    as sometimes appearing angelic. In Onesiphorus's house Paul teaches and delivers
    a series of blessings concerning purity, chastity, baptism, wisdom, renunciation,
    resurrection, judgment, and the reward of virgins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Paul went up to Iconium after his flight from Antioch, and Demas and Hermogenes
    became his companions; they are described as full of hypocrisy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Paul loved Demas and Hermogenes and instructed them in the oracles and doctrines
    of Christ and the Gospel of God's well-beloved son.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Onesiphorus, with his wife Lectra and sons Simmia and Zeno, went out to meet
    Paul and invite him to their house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Titus had given Onesiphorus's household a description of Paul's person, and
    they waited on the highway to Lystra comparing passersby with that description.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Paul is described as short, bald, with crooked thighs, handsome legs, hollow
    eyes, and a crooked nose; the passage says he was full of grace and sometimes
    appeared as a man and sometimes had the countenance of an angel.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Onesiphorus greeted Paul as a servant of the blessed God, and Paul replied
    with a blessing of grace for Onesiphorus and his family.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Demas and Hermogenes were moved with envy and questioned why they had not
    been greeted; Onesiphorus answered that he had not perceived in them the fruits
    of righteousness but would welcome them if they were of that sort.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Onesiphorus's house there was joy; the family engaged in prayer, breaking
    of bread, and hearing Paul preach concerning temperance and resurrection.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Paul's sermon pronounces blessings on the pure in heart, those who keep their
    flesh undefiled, the temperate or chaste, those who abandon worldly enjoyments,
    those who have wives as though they had them not, and those who tremble at the
    word of God.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Paul's sermon says that those who keep baptism pure will find peace with the
    Father, Son, and Holy Ghost; those who pursue the wisdom or doctrine of Jesus
    Christ will be called sons of the Most High; and those who observe Jesus Christ's
    instructions will dwell in eternal light.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Paul's sermon says that those who abandon the glories of the world for love
    of Christ will judge angels, be placed at the right hand of Christ, and not suffer
    the bitterness of the last judgment.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Paul's sermon blesses the bodies and souls of virgins, says they will not
    lose the reward of virginity, and promises salvation in the day of the Son and
    rest forevermore.
  category: speech
  evidence_refs:
  - ev:9
