canonical_text:
  quote: ''
  summary: Nicodemus advises the Jews to search the mountains for Jesus, citing Elijah’s
    being taken up to heaven as a precedent. Searchers do not find Jesus but find
    Joseph of Arimathaea, previously locked away and missing. The authorities invite
    Joseph back, acknowledge wrongdoing, and ask him to recount what happened. Joseph
    says that during midnight prayer four angels surrounded the house, Jesus appeared
    in brightness, lifted him up, comforted him, led him to the tomb to show the burial
    cloths, then led him home to Arimathaea and told him to remain there until the
    fortieth day.
  language: English
  quote_policy: summarized
