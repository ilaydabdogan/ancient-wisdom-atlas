canonical_text:
  quote: ''
  summary: A visionary guide examines rods belonging to different people, explains
    their conditions as signs of keeping or transgressing the Lord's law, and sorts
    their holders. After planted rods are brought back, some remain dry or rotten
    while others become green, branch, or bear fruit. The guide interprets these changes
    in relation to repentance, salvation, purity, deceit, and denial of the Lord;
    the worst rods signify deserters and betrayers who remain dead unto God.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A guide examines everyone's rod, notes many weakened rods, and the passage
    states that the rods are the law of the Lord.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those who transgressed the law are left in the guide's power for repentance,
    while those who fulfilled and kept the law are said to be under the Lord's power.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Those who entered the tower crowned are described as having striven with the
    devil, overcome him, and suffered hard things in order to keep the law.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Green rods with young branches but no fruit are linked to enduring trouble
    without suffering death or denying the holy law; rods returned green as received
    are linked to modesty, justice, purity, and keeping God's commandments.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After a few days, the narrator returns to the same place, is told by the glorious
    angel to gird himself with a clean coarse towel, and is instructed to serve and
    call the men whose rods had been planted.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The men pluck up their rods and bring them to the guide; the rods appear in
    different conditions, including dry, rotten, green, cleft, branched, and fruitful.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The guide separates the rod-bearers into ranks or proper places according
    to the observed condition of their rods.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Some rods that had previously been damaged or partly dry are found green,
    un-cleft, with young shoots, with boughs, or with fruit; the shepherd rejoices
    at these changes.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The shepherd says that the tree loved life and that many have repented and
    attained salvation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The shepherd says that the Lord gave his spirit to those found worthy of repentance,
    but denied return to repentance to those whose deceit and wickedness he foresaw.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narrator asks to know the place and portion of those who wasted their
    seal, so that they may hear, repent, receive their seal again, and glorify God
    for renewing their spirits.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Dry, rotten, moth-touched rods are identified as belonging to deserters and
