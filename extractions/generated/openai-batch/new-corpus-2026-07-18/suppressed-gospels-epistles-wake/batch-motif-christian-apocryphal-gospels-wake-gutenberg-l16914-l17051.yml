canonical_text:
  quote: ''
  summary: Ignatius, called Theophorus, addresses the church at Tralles, praises its
    patience and obedience, commends subjection to bishop, presbyters, and deacons,
    refers to Christ's death and resurrection, warns against pride, expresses desire
    to suffer while fearing unworthiness, and says he withholds teaching on heavenly
    matters because the recipients may not yet be able to receive it.
