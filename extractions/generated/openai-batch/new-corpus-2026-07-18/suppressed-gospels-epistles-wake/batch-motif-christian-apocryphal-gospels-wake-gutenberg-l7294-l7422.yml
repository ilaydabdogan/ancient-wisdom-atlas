canonical_text:
  quote: ''
  summary: Satan and the prince of hell quarrel over the expected arrival of Jesus
    in hell. Satan recounts Jesus's healings, raisings of the dead, and the preparation
    of the crucifixion instruments. The prince of hell fears Jesus's power, recalls
    Lazarus being raised, identifies Jesus as divine and savior, and predicts that
    Jesus will free prisoners held in hell.
  language: English
  quote_policy: summarized
