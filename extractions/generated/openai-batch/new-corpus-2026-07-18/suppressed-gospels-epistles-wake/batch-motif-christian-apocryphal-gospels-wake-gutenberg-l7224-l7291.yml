  summary: Adam asks Seth to recount what Michael the archangel told him at the gates
    of Paradise. Seth reports that Michael denied immediate access to the oil of the
    tree of mercy, saying it would be granted only in the last times, when Christ,
    the Son of God, would come to earth, be baptized in Jordan, raise Adam and the
    dead, anoint believers with mercy, and introduce Adam into Paradise.
