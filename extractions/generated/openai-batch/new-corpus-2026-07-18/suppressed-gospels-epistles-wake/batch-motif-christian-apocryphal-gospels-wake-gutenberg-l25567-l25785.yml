canonical_text:
  quote: ''
  summary: An interpreter explains black-garmented women as named vices, identifies
    stones from the deep as earlier righteous groups and apostolic teachers fitted
    into a tower, explains baptismal water as the seal by which the dead ascend to
    life, interprets twelve mountains as the nations of the world unified by one name
    and seal, and warns that polluted or rejected stones face punishment and wicked
    spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The interpreter names women clothed in black garments: four principal names
    are Perfidiousness, Incontinence, Infidelity, and Pleasure; the others include
    Sadness, Malice, Lust, Anger, Lying, Foolishness, Pride, and Hatred.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A servant of God carrying these spirits is said to see the kingdom of God
    but not enter it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Stones taken from the deep and fitted into the tower are explained as numbered
    groups: ten foundation stones as the first age, twenty-five as a second group
    of righteous men, thirty-five as prophets and ministers, and forty as Apostles
    and doctors of the preaching of the Son of God.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The virgins put the stones into the building after carrying them through the
    gate because the men and their spirits had remained joined until death and were
    useful for the tower.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dead figures represented by the stones needed to ascend by water, lay
    aside the mortality of their former life, and enter the kingdom of God.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The seal of the Son of God is identified as the water of baptism, into which
    people go down under an obligation to death and come up appointed to life.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Apostles and teachers preached to those who had died before them and gave
    them the seal; the living went down into the water alive and came up alive, while
    the previously dead went down dead and came up alive.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Those formerly dead received life, knew the Son of God, came up with the Apostles
    and teachers, and were put entire into the tower because only the seal had been
    lacking.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The twelve mountains are explained as twelve nations or peoples that make
    up and possess the whole world, to whom the Son of God was preached by those sent
    to them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Although the mountains and nations differ, they heard and believed the same
    name of the Son of God, received the same seal, shared understanding, knowledge,
    faith, and charity, and the tower appeared one colour and bright like the sun.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some who had agreed in one mind polluted themselves, were cast off from the
    righteous, returned to their former state, and became worse than before.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Those who know the Lord and live wickedly are said to be doubly punished and
    to die forever; rejected stones are delivered to wicked and cruel spirits, and
    the cleansed tower appears as if made of one stone.
  category: sequence
  evidence_refs:
  - ev:8
