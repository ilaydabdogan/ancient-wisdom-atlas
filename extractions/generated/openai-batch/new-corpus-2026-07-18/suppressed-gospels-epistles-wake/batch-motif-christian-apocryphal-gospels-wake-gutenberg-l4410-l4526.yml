canonical_text:
  quote: ''
  summary: In Adar, Jesus gathers boys and is treated as a king by them. A boy later
    identified as Simon the Canaanite is carried near death after a poisonous serpent
    bites him at a mountain nest. Jesus commands the serpent to remove its poison,
    curses it so that it dies, then touches and restores the boy and declares that
    he will be his disciple.
  language: English
  quote_policy: summarized
