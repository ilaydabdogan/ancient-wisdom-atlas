canonical_text:
  quote: ''
  summary: 'The chapter presents the phoenix of Arabia as a type of resurrection:
    a single bird lives five hundred years, dies in a nest of spices, produces a worm
    from its decaying flesh, and the grown feathered being carries the parent’s bones
    to Heliopolis and the altar of the sun. The author then argues that God can raise
    faithful servants, cites scriptural sayings about being raised, and affirms God’s
    creative, destructive, and all-knowing power.'
  language: English
  quote_policy: summarized
