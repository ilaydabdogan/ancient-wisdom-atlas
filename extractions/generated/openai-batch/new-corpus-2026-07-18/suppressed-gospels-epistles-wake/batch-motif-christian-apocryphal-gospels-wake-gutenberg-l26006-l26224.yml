canonical_text:
  quote: ''
  summary: An angel appointed over repentance interprets several symbolic mountains,
    stones, springs, trees, cattle, serpents, and the tower as figures for moral and
    ecclesial conditions among believers. The passage contrasts repentance, mercy,
    sincere teaching, and protection of the vulnerable with anger, covetous ministry,
    denial, deceitful speech, and death if repentance is refused.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Many people have repented, and others are expected to return to repentance
    because their controversies are described as small.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those with greater clefts are likened to stiff stones, full of grudges and
    anger, and are cast from the tower and refused for its building.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker identifies himself as the angel set over repentance and admonishes
    the audience to lay aside anger, repent, and purge themselves from an evil spirit;
    refusal leads to being delivered to death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The seventh mountain has green flourishing grass, cattle feeding on it, and
    grass that flourishes more as it is eaten.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The seventh mountain is interpreted as believers who are good, upright, united,
    merciful, generous, and granted increase and a dwelling with the Son of God.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The eighth mountain has many springs watering all kinds of creatures and is
    interpreted as those who believed the Apostles and as teachers who preached purely
    and walked in righteousness and truth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ninth mountain is a desert full of serpents and is interpreted as stained
    believers and corrupt ministers who misuse their ministry by taking goods from
    widows and fatherless persons.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Those called rough are described as people who denied the Lord, became savage
    and wild, separated from God's servants, and are compared to a forsaken vine choked
    by weeds.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says repentance must be hastened before the tower is finished,
    otherwise the person will be delivered by women unto death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Maimed stones are identified with deceitful people, and mixed serpents are
    linked to people whose words infect and destroy like deadly serpent poison.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The tenth mountain has trees covering cattle and is interpreted as bishops,
    hospitable believers, and ministers who protect the poor and widows and may have
    a place among angels if they continue to obey.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The eleventh mountain has trees loaded with various fruit and is interpreted
    as believers who suffered death for the Lord's name and gave up their lives wholeheartedly.
  category: relationship
  evidence_refs:
  - ev:8
