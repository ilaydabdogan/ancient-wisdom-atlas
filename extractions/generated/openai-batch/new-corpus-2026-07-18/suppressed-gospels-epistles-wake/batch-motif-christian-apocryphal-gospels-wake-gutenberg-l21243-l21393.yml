canonical_text:
  quote: ''
  summary: A messenger instructs the hearer to practice patience, long-suffering,
    and equanimity, warning that anger grieves the Holy Spirit, admits evil spirits,
    corrupts the soul like wormwood spoiling honey, and can lead to loss of hope.
    Repentance, obedience, and departure from anger are presented as the way to live
    unto God.
  language: English
  quote_policy: summarized
