canonical_text:
  quote: This heifer is Jesus Christ;
  summary: 'The passage presents the red heifer rite as a figure of Christ: an offered
    and burned heifer, ashes in vessels, scarlet wool and hyssop on a stick, and sprinkling
    for purification are interpreted as referring to Christ, sinners who brought him
    to death, Gospel preachers, the twelve tribes, the patriarchs, the cross, salvation,
    and the obscurity of these figures to Jews who did not heed the Lord.'
  language: English
  quote_policy: quoted
