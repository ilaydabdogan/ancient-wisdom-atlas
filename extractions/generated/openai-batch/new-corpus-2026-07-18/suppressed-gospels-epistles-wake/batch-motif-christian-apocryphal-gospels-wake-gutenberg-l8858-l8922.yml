  summary: A letter attributed to Annaeus Seneca addresses Paul, expresses grief over
    Paul’s innocent suffering, says Christians and Jews are blamed and punished for
    Rome’s burnings, invokes a higher court for innocence, names tyrants, describes
    a hidden culprit, predicts that one culprit will be sacrificed and burned, and
    reports the scale and duration of the fire in Rome.
