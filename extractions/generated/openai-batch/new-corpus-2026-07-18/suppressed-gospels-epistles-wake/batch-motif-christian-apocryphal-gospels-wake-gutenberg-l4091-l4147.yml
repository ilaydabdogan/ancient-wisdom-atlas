canonical_text:
  quote: Satan went out of the boy, and ran away like a mad dog.
  summary: A woman brings her Satan-possessed son Judas to Lady Mary. While the infant
    Lord Jesus is sitting with other children, Judas sits at Jesus's right hand, tries
    to bite him, then strikes his right side. Satan leaves the boy and flees like
    a dog. The narrator identifies the boy as Judas Iscariot and links the struck
    side to a later spear-piercing.
  language: English
  quote_policy: quoted
