canonical_text:
  quote: ''
  summary: Paul sends Onesiphorus and his family home and travels with Thecla to Antioch.
    In Antioch, the magistrate Alexander sees Thecla, falls in love with her, tries
    to enlist Paul with gifts, then seizes and kisses Thecla in the street. Thecla
    protests, identifies herself as a servant of God and as a woman who left Iconium
    rather than marry Thamyris, then tears Alexander's coat and removes his crown.
    Alexander brings her before the governor, who condemns her to be thrown to wild
    beasts.
