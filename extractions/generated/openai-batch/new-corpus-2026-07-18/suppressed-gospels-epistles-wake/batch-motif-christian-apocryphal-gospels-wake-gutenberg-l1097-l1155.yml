  quote: ''
  summary: Anna, wife of Joachim, mourns her barrenness and widowhood. Her maid Judith
    urges her not to mourn during a feast, offers her a hood, and reproaches her barrenness
    as God having shut her womb. Anna, troubled, puts on her wedding garment, goes
    into her garden, sits under a laurel-tree, and prays that God bless her as Sarah
    was blessed with Isaac.
