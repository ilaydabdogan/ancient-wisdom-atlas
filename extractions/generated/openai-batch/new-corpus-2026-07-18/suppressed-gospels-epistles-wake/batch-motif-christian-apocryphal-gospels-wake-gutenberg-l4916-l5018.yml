canonical_text:
  quote: This is my beloved son, in whom I am well pleased
  summary: Jesus begins to conceal his miracles and secret works, studies the law
    until age thirty, and is publicly acknowledged by the Father at Jordan while the
    Holy Ghost appears in the form of a dove. A doxology praises Jesus as giver of
    life, incarnate redeemer, and source of mercy. The following paratext summarizes
    reception history and related infancy traditions, including Egyptian idols falling,
    a sycamore-tree well and balsam, a commemorative lamp and balsam garden at Matarea,
    Persian dyer legends, schoolmaster and carpentry stories, and a note defending
    the infancy miracle narratives as filling a gap left by the canonical Evangelists.
  language: English
  quote_policy: quoted
