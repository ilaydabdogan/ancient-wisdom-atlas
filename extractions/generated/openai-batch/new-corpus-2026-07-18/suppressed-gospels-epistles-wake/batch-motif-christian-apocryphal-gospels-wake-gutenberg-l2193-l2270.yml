canonical_text:
  quote: ''
  summary: Wise men from the east come to Bethlehem after seeing an extraordinary
    star that they interpret as announcing the birth of the King of the Jews. Herod
    is troubled, consults priests about the birthplace, and asks the wise men to report
    back if they find the child. The star leads the wise men to the cave where the
    child is with Mary. They offer gold, frankincense, and myrrh, then, warned in
    a dream by an angel, return home by another route instead of going back to Herod.
  language: English
  quote_policy: summarized
