canonical_text:
  quote: ''
  summary: Hermas recounts seeing a woman he had once known, forming a private desire
    for her, and then entering a vision. A spirit carries him through an impassable
    rocky place to a plain where he prays and confesses. Heaven opens and the woman
    accuses him before the Lord for the desire that arose in his heart. After heaven
    closes, an old woman in a bright garment appears with a book, explains the seriousness
    of inward sin, rebukes Hermas for failing to admonish his household, promises
    healing and repentance, and reads from the book.
  language: English
  quote_policy: summarized
