canonical_text:
  quote: ''
  summary: Ignatius reports that the church of Antioch in Syria is at peace and urges
    the addressee church to send a deacon as an ambassador of God to rejoice with
    Antioch and glorify God's name. He notes precedents from neighboring churches,
    names Philo and Rheus as ministering companions and witnesses, thanks God for
    the addressees' reception of them, conveys greetings from Troas, and ends with
    a blessing in Christ Jesus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he has been told that the church of Antioch in Syria is in
    peace through the addressees' prayers and compassion in Jesus Christ.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressee church is directed to ordain a deacon to go to Antioch as the
    ambassador of God, rejoice with the gathered church, and glorify God's name.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker declares that the man found worthy of this ministry will be blessed
    in Jesus Christ and that the addressees also will be glorified.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker says the task is possible by the grace of God and cites other
    neighboring churches that have sent bishops, priests, and deacons.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Philo, a deacon of Cilicia, ministers to the speaker in the word of God; Rheus
    of Agathopolis followed the speaker from Syria without regarding his life; both
    bear witness to the addressees.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker thanks God for the addressees' reception of Philo and Rheus and
    asks that those who dishonored them be forgiven through the grace of Jesus Christ.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The brethren at Troas send greetings; the speaker says he writes from there
    by Burrhurs, who was sent with him by people of Ephesus and Smyrna.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The closing blessing asks Jesus Christ to honor them and describes their hope
    in flesh, soul, and spirit, and in faith, love, and unity.
  category: speech
  evidence_refs:
  - ev:8
