canonical_text:
  quote: ''
  summary: Joseph returns from his work building houses and finds Mary, called the
    Virgin, six months pregnant. Distressed, he suspects she has been defiled and
    compares his situation to Adam, Eve, and the serpent. Mary denies knowing any
    man and says she does not know how she became pregnant. Joseph considers the law
    and resolves to dismiss her privately. At night an angel appears to him in a dream,
    says the child is of the Holy Ghost, and instructs him that Mary will bear a son
    named Jesus who will save his people from their sins. Joseph wakes, glorifies
    the God of Israel, and preserves the Virgin.
  language: English
  quote_policy: summarized
