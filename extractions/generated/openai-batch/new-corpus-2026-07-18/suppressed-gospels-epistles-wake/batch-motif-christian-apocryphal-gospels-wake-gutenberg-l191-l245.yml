canonical_text:
  quote: ''
  summary: The preface discusses the supposed formation of the New Testament at the
    Council of Nice, recounts disputes involving Alexander, Arius, Constantine, and
    bishops, reports a legend in which books placed under a communion-table were sorted
    by divine sign into inspired and spurious writings, and urges readers to examine
    the forbidden apocryphal books as part of a complete Testament.
  language: English
  quote_policy: summarized
