canonical_text:
  quote: ''
  summary: The passage cites a story said to appear in both the Jerusalem and Babylonish
    Talmud. Zacharias is killed in the court of the priests; his blood is left uncovered
    on a rock and later bubbles. Nebuzaradan tests whether the bubbling blood is animal
    blood, receives a confession that Zacharias was a priest, prophet, and judge who
    had been slain, and kills successive groups upon the blood in an attempt to appease
    him. The blood stops bubbling only after Nebuzaradan addresses Zacharias and asks
    whether all the people should be killed.
  language: English
  quote_policy: summarized
