canonical_text:
  quote: ''
  summary: Thamyris hosts Demas and Hermogenes, asks about Paul's teaching because
    Thecla is drawn to Paul's discourses and no longer wishes to marry him, and receives
    advice to bring Paul before Governor Castellius as a promoter of the Christian
    religion. Demas and Hermogenes also propose to teach Thecla a different account
    of resurrection. Thamyris, angered, goes with officials and a crowd to Onesiphorus's
    house, accuses Paul of perverting Iconium and Thecla, and the crowd denounces
    Paul as an impostor.
  language: English
  quote_policy: summarized
