canonical_text:
  quote: ''
  summary: At age twelve, Jesus remains in the Jerusalem temple among learned men
    after the feast. He questions and answers doctors, a rabbi, an astronomer, and
    a philosopher on scripture, law, astronomy, physics, metaphysics, and the human
    body and soul. A philosopher worships him and declares discipleship. Mary and
    Joseph find him after three days of searching; Jesus speaks of being in his father's
    house, returns to Nazareth, obeys them, and grows in wisdom and favor.
  language: English
  quote_policy: summarized
