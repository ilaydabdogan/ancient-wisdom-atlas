canonical_text:
  quote: ''
  summary: Mary remains in the temple and is fed by an angel. When she is twelve,
    the priests consult about what should be done with her. Zacharias prays in the
    Holy of Holies, receives angelic instruction to summon widowers with rods, and
    a dove emerges from Joseph’s rod and lands on him. Joseph is declared chosen to
    take Mary, objects because he is old and has children, then accepts after the
    high-priest warns him by citing divine punishment of Dathan, Korah, and Abiram.
  language: English
  quote_policy: summarized
