  quote: ''
  summary: A decree from Emperor Augustus requires taxation of Jews connected with
    Bethlehem. Joseph worries how to register Mary, then takes her on an ass toward
    Bethlehem with Simon following. On the way Mary alternates between sorrow and
    laughter, explaining that she sees two people, one mourning and one rejoicing.
    As birth approaches she asks to be taken down, and Joseph finds a cave and brings
    her into it.
