canonical_text:
  quote: ''
  summary: A speaker teaches the narrator to reject evil desires and put on good desires,
    lists destructive desires, and says evil lusting comes from the devil. The speaker
    says faithful resistance, fear of the Lord, and service to good desire lead to
    victory and life unto God. After completing twelve commands, the speaker commissions
    the narrator to exhort repentance, rebukes doubt that the commands can be kept,
    explains that God empowers humans to keep them, and teaches that the devil has
    no power over trusting servants of God and flees when resisted.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker tells the narrator to remove evil desires and put on good and
    holy desires, describing evil desire as dreadful, wild, hard to tame, and destructive.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Evil desire is said to ruin servants of God who fall into it without wisdom
    and to deliver those lacking the garment of good desire unto death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the narrator asks which works of evil desire bring men to death, the
    speaker lists coveting another spouse, desire for riches and dainties, superfluous
    meats, drunkenness, and many delights.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says such lusting is from the devil, that those who depart from
    evil desires live unto God, and that those subject to them die forever.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker instructs the narrator to put on the desire of righteousness and
    to resist wicked lusting while armed with the fear of the Lord.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Evil coveting is said to flee from and fear the armour of one armed with the
    fear of the Lord.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The person who resists is promised victory, a crown, attainment of the good
    desire, and dominion over wicked lustings.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Serving the good desire is described as fearing God, trusting him, loving
    truth and righteousness, and doing what is good.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After fulfilling the twelve commands, the speaker tells the narrator to walk
    in them and exhort hearers to repent and keep repentance pure for the rest of
    their lives.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The speaker commits a ministry to the narrator, promises advantage and favor
    with repentant hearers, and says he is with the narrator and will force them to
    believe.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The narrator says the commands are great but doubts whether any person can
    observe them; the speaker replies that they are easy if one does not let the thought
    of impossibility enter the heart.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The speaker warns that if the narrator neglects the commands, neither he,
    his children, nor his house will be saved.
  category: speech
  evidence_refs:
  - ev:6
