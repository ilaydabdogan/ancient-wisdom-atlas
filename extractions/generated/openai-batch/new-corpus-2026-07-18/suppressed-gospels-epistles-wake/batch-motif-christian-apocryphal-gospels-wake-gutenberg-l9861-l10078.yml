  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The governor asks Thecla who she is and why no beast touches her; Thecla answers
    that she is a servant of the living God and a believer in Jesus Christ his Son.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The governor orders Thecla's clothes to be brought and publicly releases her
