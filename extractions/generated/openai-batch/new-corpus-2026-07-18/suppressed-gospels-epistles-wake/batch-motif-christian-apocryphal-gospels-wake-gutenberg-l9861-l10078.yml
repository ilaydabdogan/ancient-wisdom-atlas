canonical_text:
  quote: ''
  summary: Thecla is exposed naked to wild beasts, but animals repeatedly fail to
    harm her. She baptizes herself in a pit of water; lightning, fire, and a cloud
    of fire protect and conceal her. Further beasts and bulls also fail to kill her.
    After questioning her, the governor releases her. Trifina revives, professes belief
    in resurrection, hosts Thecla, and many young women are converted. Thecla then
    seeks Paul in Myra, dressing in male clothing for the journey.
  language: English
  quote_policy: summarized
