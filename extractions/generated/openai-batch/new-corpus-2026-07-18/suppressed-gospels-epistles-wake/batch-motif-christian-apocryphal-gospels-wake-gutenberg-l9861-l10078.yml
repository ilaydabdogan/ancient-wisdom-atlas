  text: Thecla is stripped, girded, and thrown into an arena where lions and bears
    are released upon her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A fierce she-lion falls at Thecla's feet, kills a she-bear, and later dies
    while fighting a he-lion that runs toward Thecla.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Thecla stands with hands stretched toward heaven, prays, sees a pit of water,
    and declares that it is a proper time to be baptized.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Thecla throws herself into the water in the name of Jesus Christ; fish or
    sea-calves are killed when they see lightning and fire, and a cloud of fire surrounds
    Thecla.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: People scatter aromatic substances, after which the beasts lie as if asleep
