  text: The word of the LORD tells the son of man to wail for Egypt's multitude and
    cast Egypt and the daughters of famous nations down to the nether parts of the
    earth with those who go down to the pit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Egypt is described as delivered to the sword, lying with the uncircumcised,
    and among those slain by the sword; strong figures speak from the midst of hell.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Asshur, Elam, Meshech, Tubal, Edom, the princes of the north, and the Zidonians
    are described with graves or in the pit, nether parts, or hell, and as slain by
    the sword.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Several fallen groups are said to have caused terror in the land of the living
    but now bear shame among those who go down to the pit.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Fallen mighty warriors are described as going down to hell with weapons of
    war, with swords laid under their heads and iniquities upon their bones.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Pharaoh is said to see the slain groups, be comforted over his multitude and
    army, and be laid among the uncircumcised slain by the sword.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When a sword comes upon a land, the people may appoint a watchman; if he sees
    the sword, blows the trumpet, and warns the people, hearers are responsible for
    responding.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: If a hearer ignores the trumpet warning, his blood is on his own head; if
