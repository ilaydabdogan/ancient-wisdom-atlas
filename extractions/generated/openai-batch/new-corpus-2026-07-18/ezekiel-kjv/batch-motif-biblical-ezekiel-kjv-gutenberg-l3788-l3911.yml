  quote: ''
  summary: The LORD says he will act for his holy name by gathering Israel from the
    nations, cleansing them with water, giving them a new heart and spirit, restoring
    their land and cities, and making desolate land like Eden. The prophet is then
    carried by the spirit to a valley of dry bones; at the LORD's command he prophesies
    until the bones assemble, receive breath, live, and stand as a great army. The
    LORD identifies the bones as the whole house of Israel and promises to open their
    graves, give them spirit, and place them in their own land.
