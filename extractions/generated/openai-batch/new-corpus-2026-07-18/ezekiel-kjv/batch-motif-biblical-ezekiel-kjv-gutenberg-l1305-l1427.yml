canonical_text:
  quote: ''
  summary: The LORD addresses a female figure as an abandoned newborn whom he made
    to live, nurtured, entered into covenant with, washed, anointed, clothed, adorned,
    fed, and made renowned. The figure then uses her beauty, gifts, and children in
    acts described as harlotry, idolatrous offering, and sacrifice, including causing
    children to pass through fire. The passage accuses her of building high places,
    taking foreign lovers, paying lovers rather than receiving hire, and being like
    an adulterous wife; it also states that the LORD has diminished her food and delivered
    her to enemies.
  language: English
  quote_policy: summarized
