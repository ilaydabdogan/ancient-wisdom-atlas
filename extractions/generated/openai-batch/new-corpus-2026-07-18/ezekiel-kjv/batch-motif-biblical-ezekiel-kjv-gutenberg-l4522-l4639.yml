  summary: The passage describes temple chambers, priestly holy chambers, garment
    rules, and measurements around the sanctuary. A wall separates the sanctuary from
    the profane place. The guide brings the narrator to the east gate, where the glory
    of the God of Israel comes from the east, enters the house, and fills it. A divine
    voice identifies the house as the place of the divine throne, feet, and everlasting
    dwelling among Israel, condemns prior defilement, commands the house pattern and
    laws to be shown and written, and declares the mountain-top limit most holy.
