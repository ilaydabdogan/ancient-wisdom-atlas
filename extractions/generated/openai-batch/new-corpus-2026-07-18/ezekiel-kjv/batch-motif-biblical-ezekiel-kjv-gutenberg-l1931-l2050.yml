canonical_text:
  quote: ''
  summary: 'The LORD, through the son of man, indicts the house of Israel for ancestral
    and continuing defilement through offerings, idols, high places, and making sons
    pass through fire. The oracle announces that the LORD will gather Israel from
    scattered countries, plead with them in a wilderness setting, bring them under
    the covenant bond, purge rebels, and later accept Israel’s service and offerings
    on the holy mountain in the land. A further oracle commands prophecy against the
    south: an unquenchable fire will devour green and dry trees. Another oracle turns
    toward Jerusalem and the land of Israel, where the LORD’s sword will cut off righteous
    and wicked.'
  language: English
  quote_policy: summarized
