canonical_text:
  quote: ''
  summary: A cherub takes fire from between the cherubim and gives it to a linen-clothed
    figure. Ezekiel describes the cherubim, their faces, wings, hands, and wheels
    full of eyes; the glory of the LORD departs the temple threshold and stands over
    the cherubim at the east gate. The spirit brings Ezekiel to the east gate, where
    twenty-five men, including Jaazaniah and Pelatiah, are accused of wicked counsel.
    An oracle rejects their caldron-and-flesh saying, announces sword and judgment,
    and Pelatiah dies as Ezekiel prophesies. The LORD then speaks concerning the scattered
    house of Israel and promises to be a little sanctuary to them among the countries.
  language: English
  quote_policy: summarized
