canonical_text:
  quote: ''
  summary: The LORD tells the son of man to address Israel about idols held in the
    heart, false inquiry through prophets, and punishment for both inquirer and prophet.
    The oracle then describes judgments on a sinful land and on Jerusalem by famine,
    beasts, sword, and pestilence, while Noah, Daniel, and Job would deliver only
    themselves by righteousness. A remnant will be brought out. A parable compares
    Jerusalem’s inhabitants to useless vine wood cast into fire. The next oracle begins
    by addressing Jerusalem’s abominations and assigning her birth to Canaan, with
    an Amorite father and Hittite mother.
  language: English
  quote_policy: summarized
