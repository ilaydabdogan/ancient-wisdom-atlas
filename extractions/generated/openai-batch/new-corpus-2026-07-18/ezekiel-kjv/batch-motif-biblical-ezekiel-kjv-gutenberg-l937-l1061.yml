candidate_motifs:
- id: motif:1
  label: Return from scattering to the land
  taxonomy_refs:
  - return
  basis: The LORD says he will gather people from scattered countries and give them
    the land of Israel.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage states divine gathering and return; no broader migration pattern
    is inferred beyond this oracle.
- id: motif:2
  label: Covenant renewal with transformed heart
  taxonomy_refs:
  - covenant
  basis: The passage links one heart, new spirit, removal of a stony heart, obedience
    to statutes, and the formula that they will be his people and he will be their
    God.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The heart language is presented as divine transformation within an Israelite
    covenant formula.
- id: motif:3
  label: Purging abominations from the restored land
  taxonomy_refs: []
  basis: The returned people are said to remove detestable things and abominations
    from the land.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No supplied taxonomy reference exactly names this purification action.
- id: motif:4
  label: Departure of divine glory from the city
  taxonomy_refs:
  - departure
  basis: The glory of the LORD goes up from the midst of the city and stands on the
    mountain east of the city.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage states movement of glory; larger theological or temple-symbolic
    conclusions are not added here.
- id: motif:5
  label: Visionary transport by spirit
  taxonomy_refs:
  - ascent
  basis: The spirit takes Ezekiel up and brings him in a vision by the Spirit of God
    to Chaldea, after which the vision goes up from him.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The wording includes being taken up, but the scene is also a horizontal
    visionary transport to Chaldea; the ascent taxonomy is approximate.
- id: motif:6
  label: Enacted sign of forced departure into captivity
  taxonomy_refs:
  - departure
  basis: Ezekiel carries removal-stuff, digs through a wall, departs in twilight,
    and covers his face; the LORD explains that as he has done, so it will be done
    to them as they go into captivity.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The provided taxonomy has no specific label for prophetic sign-act, so
    the departure reference captures the forced-removal aspect.
- id: motif:7
  label: Divine judgment through captivity, scattering, and desolation
  taxonomy_refs:
  - divine_judgment
  basis: The passage announces recompense, the prince’s capture in the LORD’s snare,
    scattering of helpers, sword, famine, pestilence, and desolate land and cities.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: Judgment is explicit in the passage; specific historical identification
    beyond the named places is not expanded.
- id: motif:8
  label: Remnant survivors who testify among nations
  taxonomy_refs: []
  basis: A few men are left from sword, famine, and pestilence so that they may declare
    their abominations among the nations where they go.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The text says a few are left, but it is not a survivor-pair motif.
- id: motif:9
  label: Vindication of prophetic vision over denial
  taxonomy_refs: []
  basis: The proverb that every vision fails is to cease, and the days and effect
