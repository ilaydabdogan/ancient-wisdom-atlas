canonical_text:
  quote: ''
  summary: The passage closes a lament over Tyrus as a wealthy maritime trading power
    broken in the seas, then gives oracles against the prince and king of Tyrus for
    pride, wealth, and corrupted wisdom. The king is described with imagery of Eden,
    precious stones, a covering cherub, the holy mountain of God, stones of fire,
    and being cast down after iniquity is found.
  language: English
  quote_policy: summarized
