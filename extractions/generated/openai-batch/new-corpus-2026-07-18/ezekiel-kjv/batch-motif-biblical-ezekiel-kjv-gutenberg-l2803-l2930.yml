  text: Tyrus's rowers bring it into great waters, and the east wind breaks it in
    the midst of the seas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tyrus's riches, fairs, merchandise, mariners, pilots, calkers, traders, men
    of war, and company are said to fall into the midst of the seas in the day of
    ruin.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:5
  text: Those who handle the oar, mariners, and pilots come down from ships, stand
    on land, cry bitterly, cast dust on their heads, wallow in ashes, make themselves
    bald, wear sackcloth, and weep for Tyrus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In their wailing, the mourners take up a lamentation asking what city is like
    Tyrus, the destroyed in the midst of the sea.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tyrus's wares filled many people and enriched kings of the earth, but its
    merchandise and company are said to fall when it is broken by the seas in the
    depths of the waters.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The inhabitants of the isles are astonished, their kings are afraid and troubled,
    and merchants among the people hiss at Tyrus, which is called a terror that will
    be no more.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The LORD tells the son of man to speak to the prince of Tyrus because his
    heart is lifted up and he has said he is a god seated in the seat of God in the
    midst of the seas.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The prince of Tyrus is told that he is a man and not God, though he sets his
    heart as the heart of God.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The prince is described as wiser than Daniel, as having no hidden secret from
