canonical_text:
  quote: ''
  summary: 'The passage first presents an oracle in which the LORD says the nations
    will see his judgment, Israel will understand its captivity as caused by trespass,
    and Jacob/Israel will be gathered back to its own land with mercy and spirit poured
    out. It then begins a dated vision: the speaker is brought in visions of God to
    the land of Israel, set on a very high mountain near a city-like structure, and
    shown a brass-like man with measuring implements who instructs him to observe
    and declare what he sees. The man measures the wall, east gate, chambers, porch,
    posts, windows, palm-tree features, outward court, pavement, and north gate.'
  language: English
