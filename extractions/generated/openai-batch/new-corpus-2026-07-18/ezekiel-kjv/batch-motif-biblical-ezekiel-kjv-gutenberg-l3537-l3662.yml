canonical_text:
  quote: ''
  summary: In Ezekiel 34:5-35:5, the LORD speaks against shepherds who failed the
    flock, promises to search for and restore the scattered flock to Israel, judges
    within the flock, appoints David as one shepherd and prince, establishes a covenant
    of peace with safety and fertility, identifies the flock as the house of Israel,
    and then commands prophecy against Mount Seir for hatred and bloodshed against
    Israel.
