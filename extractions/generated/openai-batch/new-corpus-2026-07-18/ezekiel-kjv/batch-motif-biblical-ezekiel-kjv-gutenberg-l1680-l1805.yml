canonical_text:
  quote: ''
  summary: The passage teaches that a righteous person lives, a violent and idolatrous
    sinner dies for his own iniquity, and a son does not bear a father's guilt. It
    calls the house of Israel to turn from transgression, make a new heart and spirit,
    and live. It then begins a lamentation for Israel's princes using the image of
    a lioness whose whelps become young lions; one is captured and taken to Egypt,
    and another devastates the land before the nations trap him.
