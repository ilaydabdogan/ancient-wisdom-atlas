  summary: 'The passage describes divine instructions to the son of man/Ezekiel: he
    is bound and muted except when given divine speech; he enacts Jerusalem''s siege
    on a tile; he lies on his sides for numbered days bearing Israel''s and Judah''s
    iniquity; he eats rationed and defiled bread with measured water; and he shaves,
    weighs, divides, burns, strikes, scatters, and preserves portions of hair as an
    enacted sign of judgment on Jerusalem and Israel.'
  language: English
  quote_policy: quoted
