  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The son of man is commanded to lie on his left side for three hundred ninety
    days for the iniquity of the house of Israel, and on his right side for forty
    days for the iniquity of the house of Judah, with each day appointed for a year.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The son of man is told that bands will prevent him from turning from one side
    to another until the days of the siege are ended.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wheat, barley, beans, lentils, millet, and fitches are to be put into one
    vessel and made into bread to be eaten during the numbered days.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Food is to be eaten by weight and water by measure; bread is associated with
    care, and water with astonishment, in Jerusalem.
  category: action
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:8
  text: The bread is first ordered to be baked with human dung in the sight of the
    people, and this is connected with Israel eating defiled bread among the Gentiles;
    after the son of man objects, cow dung is allowed instead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Lord says he will break the staff of bread in Jerusalem so that the people
    want bread and water and consume away for their iniquity.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The son of man is commanded to shave his head and beard with a sharp knife
    or barber's razor, then weigh and divide the hair with balances.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: One third of the hair is burned in the midst of the city, one third is struck
    with a knife, and one third is scattered in the wind, with a sword drawn after
    them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A few hairs are bound in the son of man's skirts; some of those are later
    cast into fire and burned, and a fire is said to come forth into all the house
    of Israel.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Jerusalem is described as set in the midst of surrounding nations and countries,
