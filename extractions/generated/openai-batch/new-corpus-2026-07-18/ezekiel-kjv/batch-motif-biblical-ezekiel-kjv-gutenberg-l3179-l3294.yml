  quote: This is Pharaoh and all his multitude, saith the Lord GOD.
  summary: A towering tree by abundant waters shelters birds, beasts, and nations,
    but because it exalts itself the Lord GOD hands it to foreign destroyers, casts
    it down to the pit, and identifies it with Pharaoh and his multitude. A later
    lament portrays Pharaoh as a young lion and a whale that fouls waters, is drawn
    up in a divine net, exposed for birds and beasts, darkened under the heavens,
    and destroyed by Babylonian swords.
