canonical_text:
  quote: ''
  summary: The passage presents a prophecy against Gog. Gog comes against Israel in
    the latter days, and the Lord responds with wrath, cosmic shaking, internal violence,
    pestilence, blood, rain, hailstones, fire, and brimstone. Gog and his forces fall
    on the mountains and open fields of Israel, their weapons are burned for seven
    years, their dead are buried to cleanse the land, and birds and beasts are summoned
    to consume the bodies as a great sacrifice. The result is that Israel and many
    nations know the Lord and his holy name.
