  quote: ''
  summary: 'Ezekiel 7:7-27 announces an imminent day of wrath against the land, with
    judgment according to ways and abominations, sword, famine, pestilence, mourning,
    failed wealth, polluted sacred places, invading outsiders, and collapse of counsel.
    Ezekiel 8:1-8 begins a vision: while the prophet sits with elders, the hand of
    the Lord falls on him; he sees a fiery, bright likeness, is lifted between earth
    and heaven to Jerusalem, sees the image of jealousy near the north gate, and is
    brought to a wall with a hidden doorway.'
