    the land while practicing violence and idolatry; describes desolation by sword,
    beasts, pestilence, and ruined mountains; criticizes hearers who enjoy the prophet’s
    words without obeying; and begins an oracle against Israel’s shepherds who feed
    themselves while neglecting the flock.
