  summary: The passage closes a lament over a captive taken to Babylon and a mother
    likened to a vine whose ruling rods are broken, burned, and left without a sceptre.
    It then recounts elders of Israel coming to inquire of the LORD, the LORD refusing
    their inquiry, and a divine speech rehearsing Israel's choice in Egypt, departure
    into the wilderness, repeated rebellion, sabbath signs, threatened judgment, restraint
    for the divine name, and threatened scattering among the nations.
