  summary: The passage gives altar measurements and ordinances for altar consecration
    through blood, sin offerings, burnt offerings, salt, and a seven-day purification
    followed by accepted offerings from the eighth day. It then describes the closed
    east gate because the LORD entered by it, the prince eating bread before the LORD
    there, the glory of the LORD filling the house, and laws excluding uncircumcised
    strangers while judging Levites who went astray after idols.
  language: English
