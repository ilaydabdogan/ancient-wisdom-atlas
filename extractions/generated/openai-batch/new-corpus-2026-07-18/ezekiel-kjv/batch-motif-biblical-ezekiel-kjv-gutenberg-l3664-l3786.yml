canonical_text:
  quote: ''
  summary: 'A prophetic passage announces judgment on Mount Seir and Idumea for bloodshed,
    hatred, boasting, and rejoicing over Israel’s desolation. The prophet is then
    told to address the mountains and land of Israel: surrounding enemies have claimed
    and mocked them, but the LORD promises that the enemies will bear shame while
    Israel’s mountains will become fruitful, inhabited, rebuilt, and no longer bereave
    their people. The passage closes by recalling that Israel defiled its land with
    bloodshed and idols, was scattered among nations, and profaned the LORD’s name
    there.'
