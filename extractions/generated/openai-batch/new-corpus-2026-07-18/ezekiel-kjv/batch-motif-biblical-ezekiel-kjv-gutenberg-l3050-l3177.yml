  summary: A sequence of divine oracles declares that Egypt will be given to Nebuchadrezzar
    of Babylon, that Egypt and its allies will suffer sword, fire, desolation, captivity,
    and dispersion, that Pharaoh’s arms will be broken while Babylon’s arms are strengthened,
    and that Pharaoh is addressed through an image of the Assyrian as a great cedar
    nourished by waters.
