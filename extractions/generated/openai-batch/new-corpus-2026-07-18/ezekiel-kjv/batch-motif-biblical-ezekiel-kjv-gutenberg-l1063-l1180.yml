canonical_text:
  quote: ''
  summary: The LORD says his word will no longer be delayed. The son of man is commanded
    to prophesy against prophets who speak from their own hearts, offer vain visions
    and lying divination, and proclaim peace where there is none. Their wall daubed
    with untempered mortar will be destroyed by storm, shower, and hail. Women who
    prophesy from their own hearts and use pillows and kerchiefs to hunt souls are
    condemned; the LORD says he will tear away their implements and deliver his people.
    Elders of Israel sit before the prophet, and the LORD says they have set up idols
    in their hearts.
  language: English
  quote_policy: summarized
