canonical_text:
  quote: ''
  summary: 'The passage contains prophetic oracles of judgment and restoration: an
    unnamed addressee is to be consumed by fire because of defiled sanctuaries; Zidon
    is threatened with pestilence, blood, and sword; Israel is to be gathered and
    dwell securely in the land given to Jacob; Pharaoh and Egypt are addressed as
    a great river dragon and an unreliable reed-staff, punished with sword, desolation,
    scattering, and later return as a diminished kingdom; Nebuchadrezzar and his army
    are said to have served against Tyrus without wages.'
  language: English
  quote_policy: summarized
