candidate_motifs:
- id: motif:1
  label: divine judgment on cities, rulers, and nations
  taxonomy_refs:
  - divine_judgment
  basis: The Lord GOD announces and executes fire, pestilence, blood, sword, desolation,
    scattering, and humbling against the addressee, Zidon, Pharaoh, and Egypt.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:8
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage presents several linked judgment oracles; the first judged
    addressee is unnamed within the supplied excerpt.
- id: motif:2
  label: return from scattering or captivity
  taxonomy_refs:
  - return
  basis: Israel is gathered from scattered peoples to dwell securely, and Egyptians
    are gathered after forty years and returned to Pathros.
  evidence_refs:
  - ev:5
  - ev:11
  - ev:12
  confidence: high
  cautions: Israel's return is described as secure restoration, while Egypt's return
    is explicitly diminished and subordinate.
- id: motif:3
  label: river dragon humbled by divine action
  taxonomy_refs:
  - chaos
  basis: Pharaoh is described as a great dragon in the rivers; the Lord GOD hooks
    his jaws, draws him from the waters, and casts him into the wilderness.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The dragon image is applied to Pharaoh in a political judgment oracle;
    the passage does not narrate a cosmogonic combat or explicit creation myth.
- id: motif:4
  label: fire arising from within to consume the offender
  taxonomy_refs: []
  basis: Fire is said to come from the midst of the addressee, devour it, and reduce
    it to ashes in public view.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is a localized judgment image, not a world-destruction scene.
- id: motif:5
  label: broken reed-staff as failed support
  taxonomy_refs: []
  basis: Egypt is described as a reed-staff for Israel that breaks when grasped or
    leaned on, wounding those who rely on it.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage itself gives the metaphor but does not expand it beyond Israel's
    reliance on Egypt.
- id: motif:6
  label: judgment leading to recognition of the LORD
  taxonomy_refs:
  - divine_judgment
  basis: Repeated formulas state that people will know the LORD when judgments are
    executed or after desolation and restoration.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:10
  - ev:12
  confidence: high
  cautions: This is a theological pattern within the passage rather than a separate
    narrative episode.
