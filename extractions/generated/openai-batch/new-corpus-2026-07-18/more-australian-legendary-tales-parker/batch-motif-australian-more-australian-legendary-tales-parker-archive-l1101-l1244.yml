canonical_text:
  quote: ''
  summary: The Bullai Bullai reach a river and find Beereeun in the canoe. Beereeun
    says he has made mirages and has altered Weedah by stealing his doowee and replacing
    it with a mad spirit. He spears Weedah, then points to a new star and identifies
    it as Womba, formerly Weedah. The Bullai Bullai mourn as widows. Beereeun and
    Goolayyahlee plan to seize them, but the sisters call on their dead tribe and
    escape into the sky toward Womba. Beereeun constructs a skyward roadway from linked
    spears and climbs after them.
  language: English
  quote_policy: summarized
