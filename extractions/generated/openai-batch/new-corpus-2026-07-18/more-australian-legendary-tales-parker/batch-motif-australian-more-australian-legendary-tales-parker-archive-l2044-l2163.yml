canonical_text:
  quote: ''
  summary: Purleemil fears danger despite earlier spirit promises concerning the Little
    Chief. Tirlta leads a night attack on the sleeping camp, killing Wimbakobolo and
    spearing the Little Chief. Purleemil kills herself with the same spear, joining
    herself and the child to Wimbakobolo in death. Tirlta's vengeance destroys the
    sheltering tribe. Later, Tirlta's people return, see strange lights, find the
    lake turned to salt, and Tirlta sees red flowers covering the massacre site instead
    of bones. A spear descends from the sky, catches him, and an unseen voice accuses
    him of murdering women and children and profaning a blood-made sacred place.
  language: English
  quote_policy: summarized
