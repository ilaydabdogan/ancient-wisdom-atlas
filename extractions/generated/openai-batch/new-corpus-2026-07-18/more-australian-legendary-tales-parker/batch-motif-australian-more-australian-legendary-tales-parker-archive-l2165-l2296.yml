canonical_text:
  quote: ''
  summary: The passage closes a tale in which blood becomes a red desert flower and
    Tirlta with a spear becomes stone. It then tells how Piggiebillah, a man-eating
    porcupine figure, is attacked by the Daens; spears remain in his back and his
    tribe’s later bodily habits are explained. The Guineeboo redbreasts mourn and
    stain their breasts with blood. The passage then opens a tale in which a young
    duck ignores warnings about a water devil, is seized by Biggoon the water rat
    as a wife, is imprisoned, and escapes while he sleeps.
  language: English
  quote_policy: summarized
