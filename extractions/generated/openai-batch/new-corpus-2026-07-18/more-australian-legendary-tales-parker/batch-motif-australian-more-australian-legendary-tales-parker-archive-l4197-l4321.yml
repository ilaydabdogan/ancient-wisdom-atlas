canonical_text:
  quote: ''
  summary: The passage describes smoke and communal mourning after Eerin's death,
    followed by the discovery that Eerin's spirit inhabits a small grey owl whose
    cry warns his old camp against enemies and a wundah. It then recounts the legend
    of Ngroondoorie, a lawgiver associated with Nar-oong-owie, whose runaway wives
    are drowned by rising water and become rocks, and who creates features on the
    island before departing to a sky home promised to law-keepers after death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A widow returns to camp, where smoke is made; she repeats the smoke-making
    whenever a stranger comes until a husband's kin may claim her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For months after Eerin's death, the arrival of a stranger is followed by early-morning
    singing of the goohnai or dirge, communal singing, movement into a smaller circle,
    rocking, crying, and wailing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After mourning ends, enemies attack the camp, but the old cry of "Mil! Mil!
    Mil!" saves them more than once.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: An enemy dies, carries hatred to another world, and returns as a wundah or
    evil spirit to attack the camp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The warning cry is found to come from a little grey owl with black rings around
    its eyes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The wundah asks the owl to remain silent during the next attack and offers
    it a share in a feast of the victim's flesh.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Although the bird promises silence, it follows the wundah into camp and cries
    in a sleeper's ear as the wundah raises a boondee to strike.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The owl says it will always warn the tribe, as it did when it was Eerin the
    man, and will rest by day and guard the camps by night.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that Eerin the light sleeper's spirit is in the little
    grey owl, which is also called Eerin and warns its old tribe at night.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ngroondoorie is presented as giver of laws, customs, and religion to the Southern
    tribes of South Australia, and his promise about the spirits of law-keepers after
    death is believed.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Ngroondoorie's two wives run away, and he follows them across named places
    until he sees them wading across the channel toward Nar-oong-owie.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Ngroondoorie commands the water to rise and drown the wives; a tidal wave
    carries them back, they drown, and their bodies become rocks called Rine-jool-ang,
    the Pages, or the Two Sisters.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: After the drowning, Ngroondoorie enters the water, dives toward the island,
