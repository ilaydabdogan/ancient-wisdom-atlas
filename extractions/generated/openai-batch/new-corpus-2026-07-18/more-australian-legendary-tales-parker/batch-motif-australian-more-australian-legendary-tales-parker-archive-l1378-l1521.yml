canonical_text:
  quote: ''
  summary: Wahn the crow visits Durroon, is fed cooked cod, and sleeps so that his
    dream spirit can learn the hidden trap in a hollow log. Durroon tries to spear
    Wahn through the log, but Wahn survives and later kills Durroon. Wahn then captures
    Gheeger Gheeger, the destructive cold west wind, in the hollow log, releasing
    her only sometimes after she promises to be gentler. The passage explains her
    continuing unrest through her desire to meet Yarrageh, the spring east wind, and
    describes periodic corroborees of paired directional winds. A following tale begins
    with Bilber, a sandhill rat once a man, living with Mayrah, an invisible wind
    mate whom he can hear but not see.
  language: English
  quote_policy: summarized
