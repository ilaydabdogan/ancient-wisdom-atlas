canonical_text:
  quote: ''
  summary: Wayambeh the turtle and Gougourgahgah the laughing jackass quarrel over
    where Wayambeh should lay her eggs. Wayambeh returns to her own people at the
    creek. Messengers, a mother-in-law avoidance rule, an old black-snake lover, and
    Gougourgahgah’s killing of the snake follow. Wayambeh flees from Gougourgahgah’s
    laughter, lays eggs in sand by another creek place, and Woggoon the brush turkey
    observes the method and considers trying it.
  language: English
  quote_policy: summarized
