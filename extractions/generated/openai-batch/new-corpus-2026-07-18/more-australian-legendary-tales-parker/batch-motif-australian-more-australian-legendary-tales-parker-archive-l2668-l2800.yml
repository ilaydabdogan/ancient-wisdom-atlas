canonical_text:
  quote: ''
  summary: 'The passage closes a Wurrunnah sea-journey tradition: shells become contested
    ceremonial objects, Wurrunnah returns with salt water, his journey becomes tradition,
    he dies after breaking Byamee''s law, and later boys verify the tradition by seeing
    and tasting the sea and bringing back shells. It then begins the tale of Walloobahl
    the Bark Lizard, a strange childlike visitor who steals food, grows taller to
    evade capture, and is killed by the camp adults with spears.'
  language: English
  quote_policy: summarized
