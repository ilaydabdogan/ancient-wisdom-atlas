canonical_text:
  quote: ''
  summary: 'The passage first recounts how Woggoons imitate Wayambeh mound incubation,
    successfully hatch strong chicks, and become known as Mound Builders. It then
    tells where frost comes from: the Meamei, identified as the Pleiades and described
    as seven icicle-covered sisters, are courted by the Berai-Berai, two are stolen
    by Wurrunnah, and all are translated to the sky. The grieving Berai-Berai die
    and are also placed in the sky as Orion''s Sword and Belt. The Meamei periodically
    throw ice down to earth, which the Daens identify as frost and as a sign of remembrance.'
  language: English
  quote_policy: summarized
