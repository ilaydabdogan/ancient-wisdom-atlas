canonical_text:
  quote: ''
  summary: 'The passage first notes drought signs and the expected return of flowers
    and bees. In the flood narrative, Byamee has returned to Bullimah by stone steps
    up Oobi Oobi; only wirreenuns communicate with him through messengers. Birrahgnooloo
    is named as flood maker. When creeks dry, wirreenuns request a flood; the Bungun
    Bungun prepare hot stones, smash a blood-red ball entering a dry river, and their
    cries accompany and warn of the flood as the blood becomes flood water. The passage
    then begins the Eerin narrative: Eerin, a light sleeper, warns his camp of enemies;
    after his death, the Daens mourn him and conduct burial rites with a red-ochre
    bark coffin, chants, and ceremonial adornment.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Daens identify a time of drought and say that goonbean and wahlerh will
    depart, the drought will go, and flowers and bees will return as they have since
    wirreenuns brought blossoms from Bullimah.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Byamee leaves earthly sojourn and returns to Bullimah by a circuitous ladder
    of stone steps to the summit of Oobi Oobi; only wirreenuns may communicate with
    him, and only through Wallahgooroonbooan.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Byamee and Birrahgnooloo are described as fixed to a crystal rock in Bullimah,
    with upper bodies as on earth and lower parts merged into the rock.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wallahgooroonbooan, Baillahburrah, and Cunnumbeillee are the only figures
    allowed to approach Byamee and Birrahgnooloo; Birrahgnooloo is called the flood
    maker.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: When creeks dry and wirreenuns want a flood, they climb Oobi Oobi, wait in
    a stone circle, and make their request through Wallahgooroonbooan; Byamee tells
    Birrahgnooloo, who may send Cunnumbeillee with instructions to warn the Bungun
    Bungun tribe that a blood ball will soon be sent.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The Bungun Bungun station themselves along both banks of the dry river, make
    big fires, heat huge stones, and set heated stones on bark before each man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When a blood-red ball of great size rolls into the river entrance, the Bungun
    Bungun throw hot stones at it, smash it, and a stream of blood gushes down the
    river bed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: As the Bungun Bungun follow the stream, throw stones, and cry aloud, the blood
    stream is said to be purified by hot stones and changed into flood water; their
    cries warn other tribes to move camps to high ground.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The Daens say that present-day cries of the Bungun Bungun, or flood-frogs,
    mean flood water is coming or has arrived, and that red thick flood water means
    the Bungun Bungun did not purify it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Eerin is a light sleeper who cries out when an enemy nears the camp, warning
    his tribe to look out for danger.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After Eerin dies, the Daens grieve and say no one can hear as Eerin did.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Daens place Eerin in a bark coffin painted with red ochre; the oldest
    wirreenun marks divisions forming a cross, the people corroboree and sing death
    chants, and the coffin is carried to the grave.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The mourners are painted and wear leaves, feathers, and dheal tree twigs on
    the body and through nose-cartilage holes, and carry bunches of dheal twigs.
  category: attribute
  evidence_refs:
  - ev:11
