canonical_text:
  quote: ''
  summary: 'The passage closes a tale in which a mother gives a magical grunting stone
    to a wirreenun so that her frog-transformed daughters will never be eaten; the
    wirreenun changes them into stone frogs. The passage then begins a flower legend:
    after Byamee leaves earth for Bullimah beyond Gobi Gobi mountain, flowers and
    bees disappear except at three branded sacred trees. Because the people do not
    touch Byamee''s trees despite hunger, Byamee sends sweet manna-like food during
    drought. The wirreenuns then travel toward Gobi Gobi mountain to ask for flowers
    to return and begin climbing a stone ladder up the mountain.'
  language: English
  quote_policy: summarized
