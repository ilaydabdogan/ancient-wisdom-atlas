canonical_text:
  quote: ''
  summary: Wirreenuns climb the sacred mountain Oobi Oobi, hear Wallahgooroonbooan,
    the spirit messenger of Byamee, and are lifted through an opening in the sky to
    Bullimah. There they gather fadeless flowers and return with a promise that the
    earth will never again be bare of blossoms. They bring the flowers to their tribes
    and scatter them, after which flowers grow where they fell. The passage also explains
    seasonal rain, blossoms, honey, manna, bees, wind, and drought messengers.
  language: English
  quote_policy: summarized
