canonical_text:
  quote: ''
  summary: The passage first describes Daens piercing children's nose septums so they
    may sing like the Meamei, then explains a laughing star identified as Venus and
    winter thunder as the Meamei bathing and splashing rain down. A second tale tells
    how Butha, promised to Murree, takes eggs from a Bubburr nest and is killed by
    a mammoth snake. Murree, prompted by Gubbee to avenge her before seeking her in
    Weebulloo, leads the Daens in trapping Bubburrs with Mubboo gum, after which he
    cuts off their heads and the Daens cook them.
  language: English
  quote_policy: summarized
