canonical_text:
  quote: ''
  summary: Wurrunnah questions Earmoonan, who answers only with a spluttering sound
    and flees at the name of Byamee. Wurrunnah travels to Doogoonberh by the sea,
    tastes the salt water, compares the sea to flood water and sky, and tries to understand
    its noise, waves, and horizon from a tree and a mountain. He makes opossum-skin
    water-bags, fills them with sea water, collects shells, and returns to tell his
    tribe. On the way he meets an old Daen or wirreenun, who connects Wurrunnah's
    account with ancestral reports of vast dangerous water beyond the mountains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wurrunnah questions Earmoonan about whether someone has gone away, and Earmoonan
    answers only with a repeated spluttering sound rendered as “Phur-r, phur-r.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wurrunnah dismisses Earmoonan, saying he wants him there no more and that
    Earmoonan tells him nothing of Byamee.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the sound of Byamee's name, Earmoonan jumps away and returns toward sand-ridges
    where a strange litter is said to live in huge caves and imprison travellers;
    only Byamee's name frightens them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wurrunnah reaches Doogoonberh on the sea, sees a wide expanse of water, tries
    to drink it, finds it salty, and spits it out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wurrunnah describes the sea as salt water with no trees or bushes in it, unlike
    ordinary flood water, and says it looks like the sky with white clouds except
    that it moves and is water.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Wurrunnah returns to fresh water-holes, quenches his thirst, kills two opossums,
    and skins them to make water-bags.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: While camping away from the sea at night, Wurrunnah hears its booming noise
    after the wind has risen and does not know what the noise is.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The next morning Wurrunnah climbs a high tree near the beach, sees only dark
    troubled water on the horizon, and interprets the sea as the camp of Dooloomai
    the Thunder and the roaring winds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Seeing the tide and waves rushing onto the beach, Wurrunnah says there must
    be Wundah-devils in the water trying to get him; he climbs a high mountain but
    still sees only water.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Wurrunnah makes the opossum skins into water-bags, fills them with sea water
    when the water is still, picks up shells, and intends to return to his tribe with
    proof of what he saw.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: On the return journey Wurrunnah meets an old Daen or wirreenun, who tastes
    the salt water and says ancestral accounts of vast dangerous water beyond the
    mountains must have been true.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The old wirreenun reports ancestral claims that the water pursues men to its
    banks and contains monsters bigger and deadlier than Kurreahs; Wurrunnah says
    he saw only salt water but heard what he interprets as the monsters' voices.
  category: speech
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:13
  text: Before continuing, Wurrunnah gives the old wirreenun some salt water for his
    tribe to taste and also gives him a shell from the beach.
  category: action
  evidence_refs:
  - ev:11
