canonical_text:
  quote: ''
  summary: In a dry plain, Weedah repeatedly claims that water lies ahead and is beaten
    by the Bullai Bullai sisters after disappointing them. The sisters sing a rain
    song learned from their grandmother to Dooloomai the Thunder, whom they call their
    cousin; a thundercloud comes, rain fills the gilguy holes, and the travelers drink.
    The next day they again see a water-like semblance that is not water. At the Big
    River, Goolayyahlee the pelican ferries Weedah across first, then tries to make
    the Bullai Bullai live with him; they respond by throwing white ashes from an
    old fire at him.
  language: English
  quote_policy: summarized
