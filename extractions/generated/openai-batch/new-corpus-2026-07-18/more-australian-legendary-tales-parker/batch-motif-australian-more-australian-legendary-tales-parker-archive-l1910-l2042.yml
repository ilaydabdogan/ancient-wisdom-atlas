canonical_text:
  quote: ''
  summary: Wimbakobolo flees with Purleemil, who had been promised to Tirlta. Pursuers
    from the river tribe demand their return, but the back-country tribe connected
    with Wimbakobolo's father shelters them. Wimbakobolo challenges Tirlta, who does
    not come. Wimbakobolo and Purleemil live with the sheltering tribe, have a son
    called the Little Chief, and Purleemil sings spirit-taught songs about him before
    later warning that spirits foretell misfortune if they leave the winter camp.
  language: English
  quote_policy: summarized
