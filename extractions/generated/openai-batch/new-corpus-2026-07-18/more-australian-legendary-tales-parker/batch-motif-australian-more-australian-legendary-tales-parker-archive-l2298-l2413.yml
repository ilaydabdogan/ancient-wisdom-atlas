canonical_text:
  quote: ''
  summary: 'The passage concludes an account of the Gayardaree, or platypus: a duck
    returns to her tribe after captivity, later hatches two anomalous young with duck
    and non-duck traits, is rejected with them by the ducks, travels upstream to the
    mountains, dies there, and the young reproduce as a separate platypus tribe in
    mountain creeks. A second account explains how mussels came to creeks: a sea-gull
    drops a mussel while pursued by Wahn the crow; Wahn eats one side, throws the
    shell into a creek, and the remaining mussel multiplies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The duck hears a sound behind her, fears it may be Biggoon or Mulloka, and
    flies the remaining distance back to her tribe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old mother ducks warn younger ducks to swim upstream in future because
    Biggoon may seek vengeance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the laying season, ducks choose nesting places in hollow trees and
    mirrieh bushes, lay eggs, and hatch young ducks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The duck formerly imprisoned by Biggoon hatches two young who differ from
    ordinary ducklings: they have soft fur, four feet, duck bills, webbed feet, and
    points on the hind feet compared with Biggoon''s spear.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The other ducks reject the two young, say they resemble Biggoon more than
    ducks, and threaten to kill them if they remain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The mother duck leaves with the two rejected young and reasons that Biggoon
    might also reject or kill them because of their duck-like traits and egg origin.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The mother duck travels upstream to the mountains, hides there with her children,
    becomes lonely and miserable, and dies far from her hereditary hunting-ground.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The two children survive, reproduce, and their descendants spread through
    the mountain creeks as the Gayardaree, or platypus, a separate tribe.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A sea-gull flies over the Western plains carrying a mussel; Wahn the crow
    pursues her, and she drops the mussel.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Wahn pecks and eats the fish in one side of the shell, fails to notice another
    fish in the other side, and throws the shell into the creek.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The mussel in the creek thrives and multiplies, producing mussels with one
    fish enclosed between two shells.
  category: sequence
  evidence_refs:
  - ev:11
