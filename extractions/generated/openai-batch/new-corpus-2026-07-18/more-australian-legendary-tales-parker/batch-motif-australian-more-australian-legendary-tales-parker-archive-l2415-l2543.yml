canonical_text:
  quote: ''
  summary: The passage first explains how Wahn the crow pursues and coerces Mungghee
    wurraywurraymul, after which her sea-gull tribe brings Mungghee, or mussels, from
    salt-water country into the creeks. The introduced mussels adopt creek habits,
    and the Daens later cook and eat them while crediting Wahn and the mussel-bringer.
    The passage then begins Wurrunnah's journey after the Meamei are translated to
    the sky and describes his encounter with Earmoonan, a strange dog-like creature
    associated with Byamee.
  language: English
  quote_policy: summarized
