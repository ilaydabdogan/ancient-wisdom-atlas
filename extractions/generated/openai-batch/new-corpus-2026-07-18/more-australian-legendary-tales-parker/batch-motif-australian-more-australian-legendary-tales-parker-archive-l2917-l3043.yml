canonical_text:
  quote: ''
  summary: 'The passage first explains present pelican pouches and fishing behavior
    as inherited from Goolayyahlee, a great fishing wirreenun associated with nets.
    It then begins a tale set when animals were larger: Mungoongarlee the iguana has
    a poisonous bite or hidden poison bag and kills Daens. Other animal tribes meet
    at a water-hole to discuss stopping him. Ouyouboolooey the black snake vows to
    save his Daen relations without fighting, plans to use cunning, follows Mungoongarlee
    after a feast, and creeps into his camp while he sleeps.'
  language: English
  quote_policy: summarized
