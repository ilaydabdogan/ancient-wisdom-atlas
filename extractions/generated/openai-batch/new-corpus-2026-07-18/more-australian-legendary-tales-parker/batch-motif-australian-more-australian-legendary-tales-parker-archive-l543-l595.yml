canonical_text:
  quote: ''
  summary: 'The passage gives preface notes and additions to several legends: a spring
    below Mullyan''s tree-camp is said to produce bones of his victims; Galah''s coloring
    is explained by blood and dust after Oolah''s thrown weapon wounded her; Bahloo''s
    moon halo is explained as a rain sign; Bibbee''s rainbow is guarded by snakes;
    some stories are sacred and not for young listeners; the Sacred Island story is
    described as indirectly transmitted; and Dinewan the Emu''s burnt wing stumps
    are explained by hot coals thrown by his crow wives.'
  language: English
  quote_policy: summarized
