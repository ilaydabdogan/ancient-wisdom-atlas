canonical_text:
  quote: ''
  summary: 'The passage describes Eerin''s funeral rites: burial preparation, grave
    goods for an afterlife journey, dirges, blood offering, smoke protection, prayer
    to Byamee for admission to Bullimah, divination by tracks around the grave, and
    the widow''s mourning and speech-release ritual involving smoke and water.'
  language: English
  quote_policy: summarized
