canonical_text:
  quote: ''
  summary: The Daens pursue the Wurrawilberoo after an attempted capture of Bralgah.
    Wirreenuns send Mullee Mullees in whirlwinds to chase the Wurrawilberoo, who return
    to the camp, seize young Bralgah and her mother, and flee. The whirlwinds uproot
    balah trees to which the Wurrawilberoo cling and place them in the sky near the
    Milky Way/Warrambool, where the two cannibals remain as dark spots. After young
    Bralgah is released, she vanishes; the Daens see only a tall crane-like bird and
    its tracks, mourn her as dead, fear her spirit will haunt the camp, and move away.
  language: English
  quote_policy: summarized
