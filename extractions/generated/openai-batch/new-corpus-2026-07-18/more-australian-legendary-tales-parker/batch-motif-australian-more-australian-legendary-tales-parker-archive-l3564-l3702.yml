canonical_text:
  quote: ''
  summary: The passage opens with a brief note that Bubburrs have become scarce and
    feared after Biitha was avenged by Murree. In the main tale, an old wirreenun
    changes a family of girls into Youayah, or frogs, after they offend him. Their
    mother searches for them after rain has washed away tracks; an animate rain-making
    stone, Oodoolay, is described. The mother mistakes an answering beetle call for
    her daughters, then finds unusually large frogs and intends to eat them. Their
    cries become speech identifying them as her lost daughters and explaining the
    transformation. She confronts the old wirreenun, who confirms what he did, explains
    the insult and his old grievance against her, and refuses her plea to change them
    back.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bubburrs are said to be scarce in the land after Biitha was avenged by Murree,
    though their name still causes fear.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A family of girls offended an old wirreenun, who changed them into Youayah,
    or frogs, while they were out hunting in the bush.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the girls were missing, their mother and relations thought they had
    been stolen by men of a strange tribe; rain had washed out tracks except the track
    of the Oodoolay stone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Oodoolay is described as a round rain-making stone containing spirits
    of past rain-makers; it can move, change camp, and laugh before rain in anticipation
    of mud.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The mother searched in the direction the girls had gone and called out, but
    the answering call came from Noorahgogo, an orange and blue beetle that could
    answer a lone Noongahburrah in the bush.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Weak and hungry, the mother found tracks of earth frogs, dug out large Youayah,
    and said she would eat them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The frogs cried unusually and gazed at the mother; their piteous behavior
    made her suspect something strange about them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The frogs' cries formed words saying that she must not eat them because she
    was their mother and they were the girls she had lost.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The speaking frogs said the old wirreenun changed them into frogs because
    they laughed at the mah of his tribe and compared its humped emu back to his.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mother fled back to camp, frightened by the frogs' speech and appearance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The mother asked the old wirreenun whether he had changed her girls into crying
    Youayah, and he confirmed that he had done so.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The old wirreenun said the woman had chosen the girls' father over him, said
    scoffing at a man's mah was to make war with his tribe, and told the mother to
    eat the transformed daughters as food.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The mother refused the idea of eating her children, begged the old wirreenun
    to change them back, promised they would not scoff again, and offered to come
    to his dardurr; he refused and continued carving a boomerang.
  category: sequence
  evidence_refs:
  - ev:9
