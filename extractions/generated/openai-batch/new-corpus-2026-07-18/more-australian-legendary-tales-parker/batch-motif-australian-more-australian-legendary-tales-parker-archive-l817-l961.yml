canonical_text:
  quote: ''
  summary: The passage contains an etiological tale in which a crane and a crow injure
    one another, explaining the crow's coloration and the crane's cry. It then begins
    a tale in which Beereeun the lizard claims the Bullai Bullai green parrot sisters
    as pledged brides; the sisters prefer Weedah the mocking-bird, flee with him,
    burn their trail, and suffer thirst while apparent sheets of water recede and
    disappear.
  language: English
  quote_policy: summarized
