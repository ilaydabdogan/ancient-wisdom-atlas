canonical_text:
  quote: ''
  summary: 'The passage records several reported beliefs and anecdotes: a spear-bearing
    man becomes a plover after death; red sunsets and yellow winter moons are linked
    with gum and frost; misplaced trees are explained as wrongly married beings transformed
    by wizards; stolen hair may be burned to cause death; wirreenuns restore a baby''s
    breath; a ghost blamed for heat deaths is killed; an old woman acts as a spirit
    medium; and the death of Beemunny is linked with rain after drought.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who carried poison-tipped spears is said to have become a plover after
    death, retaining his spears as wing spurs that can injure fatally.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A fiery red summer sunset is explained as the reflection of wattle gum on
    the sun, and is treated as a sign that gum will be found in quantity.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A very yellow winter moon is treated as a sign of frost; the Meamei are said
    to tell Bahloo they will send frost, and Bahloo is described as keeping warm by
    a bright fire.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A tree growing outside its usual place is explained as one of two beings who
    married wrongly and were turned into trees by wirreenuns.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A young woman fears death because a rejected young man has stolen a lock of
    her hair and is taking it to wirreenuns to be burned.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The woman's Beewees totem clan may intercept the man carrying her hair; if
    he succeeds and she dies, a feud between groups is expected to continue through
    generations.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A baby reported dead is said to have revived after wirreenuns caught its departing
    breath, put it back through the mouth, and sucked sickness from its body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Marmbeyah, a ghost with a green boondee, is blamed for deaths by striking
    people on the back of the neck during heat-apoplexy weather.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A man is said to have killed Marmbeyah by striking and flattening him with
    a boondee, thereby saving people from further heat-apoplexy sickness.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: An old woman in the camp is said to call up spirits and to avoid hot tea or
    any internally heating liquid so that the spirits will not be driven out.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The same old woman foretells rain three days after Beemunny's death, saying
    Beemunny had told her she would send rain when her yowee went along Oobi Oobi;
    rain comes during the night and the following day.
  category: sequence
  evidence_refs:
  - ev:8
