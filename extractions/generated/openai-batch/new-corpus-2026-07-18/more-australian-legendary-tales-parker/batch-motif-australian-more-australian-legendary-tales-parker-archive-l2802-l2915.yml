canonical_text:
  quote: ''
  summary: The passage begins with a fragment in which a little bark lizard is named
    Walloobahl because it is said to be the spirit of a killed boy. The main tale
    says that before nets the Daens caught fish with plant-and-grass barriers, while
    Byamee later made stone fisheries. Goolayyahlee the Pelican, a great wirreenun,
    is the first seen with a fishing net. He hides the net inside himself, draws it
    out through his mouth, uses it with eurah sticks and smoke in creek fishing, and
    later teaches people how to make nets from bark fibre, though his own internal
    method is said to belong to his wirreenun power.
  language: English
  quote_policy: summarized
