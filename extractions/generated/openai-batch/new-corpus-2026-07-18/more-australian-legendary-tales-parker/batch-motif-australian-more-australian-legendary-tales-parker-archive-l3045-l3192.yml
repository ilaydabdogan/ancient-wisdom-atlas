canonical_text:
  quote: "“Cunning I brought with me, and cunning has done it.”"
  summary: Ouyouboolooey seeks Mungoongarlee’s hidden poison bag. By claiming to know
    a plot against Mungoongarlee, he persuades Mungoongarlee to hand over the bag
    as a pledge of safety. Ouyouboolooey then reveals that obtaining the bag was itself
    the plan. The passage explains that snakes have been poisonous since then, while
    iguanas retain a secret plant antidote and remain in feud with snakes.
  language: English
  quote_policy: quoted
