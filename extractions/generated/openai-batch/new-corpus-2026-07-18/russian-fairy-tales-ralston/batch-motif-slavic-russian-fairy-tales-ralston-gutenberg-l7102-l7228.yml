canonical_text:
  quote: ''
  summary: Prince Ivan seeks shelter from two old women and two giants, each of whom
    says death will come when a set task is completed. He reaches the Sun's Sister,
    who receives him as a son. Wanting to learn about home, he obtains permission
    to leave and receives a brush, a comb, and youth-giving apples. On his return
    journey he uses or gives these objects to renew mountains, forests, and the old
    women, receiving in return a handkerchief that can create a lake. At home, a mouse
    warns him that his sister is sharpening her teeth; the mouse deceives the sister
    by playing the lute while Ivan flees. The sister, called a witch in the passage,
    pursues him and is delayed by a lake, by oaks piled by Vertodub, and by mountains
    piled by Vertogor.
  language: English
  quote_policy: summarized
