canonical_text:
  quote: '"That horse is your father."'
  summary: Petrusha, whose father has disappeared, rebukes a woman for blaming the
    Devil when she stumbles on the way to church. The Devil later thanks Petrusha
    and invites him to visit. Petrusha travels for three days to a dark forest palace,
    where a stolen maiden warns him and tells him to ask for a wretched horse rather
    than wealth. She says the horse is Petrusha's father, seized by devils after drunkenly
    falling into water and made to work as a beast of burden. Petrusha obtains the
    horse, performs the maiden's cross-and-circle instructions near his village, and
    the horse becomes his father again. The father returns home, recovers speech after
    three days, prospers, and gives up drinking. The passage then shifts to editorial
    commentary on Russian humorous tales and their broad parallels in other regions.
  language: English
  quote_policy: quoted
