literal_observations:
- id: obs:1
  text: Nedelka is described, according to Wenzig, as the personified first Sunday
    after the new moon.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The role attributed to St. Nedelka is said to be played by a Vila in one of
    the Songs of Montenegro.
  category: relationship
  evidence_refs:
