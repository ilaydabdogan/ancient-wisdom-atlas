- id: obs:3
  text: An ancient Indian tradition says the Aswattha tree should be touched only
    on Sunday.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The same Indian tradition says Poverty or Misfortune abides in the Aswattha
    tree on every day except Sunday, while Lakshmi resides in it on Sunday.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The name Leshy or Lyeshy is stated to derive from lyes, meaning a forest.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A note describes a Buddhist belief that treasure belonging to someone in a
    former existence may come to him in the form of a man who turns to gold when killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A related Panchatantra example says a man is told in a vision to kill a monk;
    after he does so, the monk becomes a heap of gold.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the Panchatantra example, a barber imitates the act by killing several
    monks, but without obtaining the same result.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The ovin is associated with respect paid either to it or to demons supposed
    to haunt it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Vikhr or Vikhor is glossed as deriving from a verb meaning to whirl or twist.
  category: attribute
  evidence_refs:
