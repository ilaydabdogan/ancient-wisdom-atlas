canonical_text:
  quote: ''
  summary: A Soldier is advised by his grandfather to accept a merchant's request
    to read the psalter over the merchant's dead daughter, despite mortal danger.
    On the first two nights the merchant offers brandy, locks the Soldier in the corpse
    room, and the Soldier reads until midnight. At midnight wind rises, the coffin
    rocks, the dead daughter appears as a witch, and devils search for the Soldier
    while he hides in or near the stove. Cockcrow makes the devils vanish and the
    witch collapse; the Soldier returns the body to the coffin and is paid. After
    the second night the merchant asks him to come a third time, and the grandfather
    advises a new hiding strategy involving a frying-pan and the stove-pipe.
  language: English
  quote_policy: summarized
