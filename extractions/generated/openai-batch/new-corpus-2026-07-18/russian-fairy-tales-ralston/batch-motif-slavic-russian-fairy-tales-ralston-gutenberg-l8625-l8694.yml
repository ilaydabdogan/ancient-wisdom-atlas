canonical_text:
  quote: ''
  summary: 'The passage summarizes several Russian folk-tale examples about personal
    Luck, Fortune, Misfortune, and Fate: a poor man improves his condition by relying
    on a lucky niece; Ivan the Unlucky gains luck through marriage; a poor man encounters
    personified Fortune and Misfortune and receives aid that eventually brings wealth
    through a fish; and a merchant''s son named Luckless is marked and made a compulsory
    wanderer who receives brief hospitality everywhere.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A poor man wanders in search of a female figure and sees a grey-haired old
    woman asleep under an oak in a great forest; she proves to be his Luck.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The poor man's Luck tells him that Fate gave him his poor Luck.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fate is found living at ease in a large house, while her riches wane and her
    house contracts day by day.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Fate says that her condition at a given hour affects the whole lives of children
    born at that time, and that the poor man was born at an unpropitious moment.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Fate advises the poor man to take his niece Militsa, who was born at a lucky
    time, into his house and to call anything he acquires her property; after he follows
    this advice, things go well with him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: When a stranger asks who owns a splendid cornfield, the poor man says it is
    his, and the crop begins to burn; when he corrects himself and says it belongs
    to Militsa, the fire goes out and the crop is saved.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:7
  text: Ivan the Unlucky, a peasant, goes to the king for advice about his continual
    lack of success; the king's nobles and generals cannot solve the matter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The king's daughter says that if Ivan were married, the Lord might allot him
    another sort of Fortune; the king orders her to marry him, and the marriage brings
    Ivan good luck.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: In a Grodno story, a poor man meets two ladies, one Fortune and the other
    Misfortune; they give him money twice, but his wife unwittingly gives the money
    away both times.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The two ladies then give the poor man two farthings and tell him to give them
    to fishermen and ask them to make a cast for his luck; a fish is caught and brings
    him wealth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: A wealthy merchant's son is so unlucky that after losing his inheritance he
    works as a laborer and herdsman but causes heavy losses to his masters.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: After the merchant's son nearly burns down the royal distillery, the king
    pardons him, names him Luckless, orders a stamp set on his forehead, exempts him
    from tolls and taxes, and orders that he receive food, drink, and lodging wherever
    he appears but never stay more than twenty-four hours in one place.
  category: sequence
  evidence_refs:
  - ev:4
