canonical_text:
  quote: ''
  summary: 'The passage gives two variants of a heavenly ascent by a plant: an old
    man climbs an oak grown from an acorn and brings back a magic mill and golden-combed
    cock; in another variant an old woman climbs a pea-stalk to a food-made heavenly
    cottage guarded by goats, later falls with her family when the stalk breaks. The
    passage then introduces Russian tales of the underground world and begins “The
    Fiddler in Hell,” in which a fiddler accidentally sinks into hell, meets a rich
    moujik punished for buried wealth and failure to give to the poor, hides from
    fiends, is discovered, and is made to play for three years until his blessing
    causes his fiddle-strings to snap.'
  language: English
  quote_policy: summarized
