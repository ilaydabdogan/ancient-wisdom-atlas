  limitations: 'The plant forms and later plot events differ: one involves taking
    a mill and cock; the other involves a food cottage, goats, gifts, and a fatal
    broken stalk.'
- id: claim:2
  claim: The passage explicitly links the name of the subterranean Ad with Byzantine
    Hades, while limiting the claim to the name rather than necessarily the nature
    of the underworld.
  claim_level: historical_contact
  target: Byzantine Hades and the Russian folk-tale Ad
