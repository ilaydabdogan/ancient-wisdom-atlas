canonical_text:
  quote: ''
  summary: In Baba Yaga’s house, Vasilissa serves the hag, receives difficult domestic
    and seed-cleaning tasks under threat of being eaten, feeds her doll, and is helped
    by it. Baba Yaga travels in a mortar with a pestle and broom. White, red, and
    black riders are identified as Day, Sun, and Night, all servants of Baba Yaga.
    Disembodied hands process wheat and poppy seed. Vasilissa asks only about outdoor
    sights, avoids asking about the hands, and, when she says her mother’s blessing
    assists her, Baba Yaga expels her.
  language: English
  quote_policy: summarized
