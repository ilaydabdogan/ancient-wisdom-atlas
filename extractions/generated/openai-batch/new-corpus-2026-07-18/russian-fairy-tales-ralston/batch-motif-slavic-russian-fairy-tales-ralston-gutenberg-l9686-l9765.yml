  summary: 'The passage summarizes three tale episodes: Prince Vasily reaches the
    hilltop palace of his mother and Vikhor, follows his mother''s instructions, seizes
    Vikhor''s finger, and destroys him after he falls into sand; a general obtains
    the magical cook Morfei, uses him to feed shipwrecked crews, and gains magic objects
    that help him win a princess; and a father accidentally summons the magician Oh
    while seeking a teacher for his son, with narrator commentary comparing Oh to
    demoniacal figures in other Russian variants.'
