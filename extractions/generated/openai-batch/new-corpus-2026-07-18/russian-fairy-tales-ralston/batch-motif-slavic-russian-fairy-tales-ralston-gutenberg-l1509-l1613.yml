    him home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Semiletka, the heroine marries a Voyvode under an agreement that if she
    meddles in his affairs she will be sent back to her father but may take whatever
    belonging to her she prizes most.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: After Semiletka says the Voyvode has judged unfairly, he demands a divorce;
