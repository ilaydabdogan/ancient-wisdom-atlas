  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: In the story of the Purchased Wife, Princess Anastasia tells Ivan to take
    an embroidered piece to market and accept, instead of money, enough liquor to
    make him drunk.
  category: speech
  evidence_refs:
  - ev:4
