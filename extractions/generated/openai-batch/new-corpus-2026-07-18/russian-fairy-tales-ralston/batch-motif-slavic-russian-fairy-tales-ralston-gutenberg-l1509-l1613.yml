canonical_text:
  quote: ''
  summary: 'The passage discusses drunkenness as a recurring feature in Russian Skazkas
    and related genres, then gives several tale examples: a condemned shoemaker drinks
    before expected hanging; Ivan follows Princess Anastasia''s instruction to accept
    liquor as payment and wins a wager; Semiletka intoxicates her husband and carries
    him away as the thing she prizes most; and an old drunkard drowns while crossing
    a river after leaving a kabak.'
  language: English
  quote_policy: summarized
