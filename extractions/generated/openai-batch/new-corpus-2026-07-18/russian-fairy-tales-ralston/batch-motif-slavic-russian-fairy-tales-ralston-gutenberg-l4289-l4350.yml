  summary: 'The passage narrates Prince Ivan’s final defeat of Koshchei the Deathless
    with help from Ivan’s horse, followed by the burning and scattering of Koshchei’s
    remains, Marya Morevna and Ivan’s visits to the Raven, Eagle, and Falcon, and
    their return home. The surrounding commentary notes related recurring elements:
    Baba Yaga as a counterpart of Koshchei and the Snake, Waters of Life and Death,
    warrior heroines, forbidden closets or chambers, grateful animal helpers, and
    multiple variants in which Koshchei’s role is taken by a Snake or Koshchei is
    found confined in a forbidden chamber.'
