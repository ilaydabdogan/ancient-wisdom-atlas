- id: motif:2
  label: nested containment of the vulnerable life-token
  taxonomy_refs: []
  basis: Several variants hide the life-token through nested layers, such as egg in
    duck in well, light in egg in duck on pond in mountain, egg in animal chains,
    sparrow within successive animals, and parrot under stacked jars of water.
  evidence_refs:
