  - ev:4
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The exact nesting sequence differs by tradition and by object.
- id: motif:3
  label: sympathetic injury between animal life-token and antagonist
  taxonomy_refs: []
  basis: Punchkin loses limbs when the parrot's limbs are removed and dies when its
    neck is wrung; Greek and Servian variants also link a being's life or strength
    to hidden animals.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: Only the Punchkin example explicitly describes one-for-one bodily correspondence.
- id: motif:4
  label: detachable hearts removed nightly
  taxonomy_refs: []
  basis: The Samoyed brothers take out their hearts every night, sleep without them,
