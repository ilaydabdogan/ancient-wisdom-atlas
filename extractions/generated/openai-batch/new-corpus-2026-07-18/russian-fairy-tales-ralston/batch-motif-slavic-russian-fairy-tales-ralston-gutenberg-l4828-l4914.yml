canonical_text:
  quote: '"One of the strangest of the stories which turn on this idea of an external
    heart"'
  summary: The passage surveys variants from several traditions in which a being's
    heart, life, strength, or vulnerability is located outside its body, often hidden
    in nested animals or objects. It includes Norse, Transylvanian-Saxon, Bohemian,
    Gaelic, Modern Greek, Servian, Indian, Samoyed, and Egyptian examples, ending
    with Satou's death after his acacia-held heart falls and his revival when Anepou
    restores the heart with mystic fluid.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage introduces the episode as occurring in folk-tales of many lands
    and traces several forms of it.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In one Norse story, a Giant's heart lies in an egg inside a duck, and the
    duck swims in a well located in a church on an island.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In another Norse tale, a Haugebasse or Troll who has carried off a princess
    says he and his companions will burst when a specified grain of sand from a dead
    dragon passes above them; when the grain is brought, the Troll brood is destroyed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In a Transylvanian-Saxon story, a Witch's life is a light burning in an egg
    inside a duck on a pond inside a mountain, and she dies when the light is put
    out.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the Bohemian story of "The Sun-horse," a Warlock's strength lies in an
    egg within a duck within a stag under a tree; after a Seer finds and sucks the
    egg, the Warlock becomes weak.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Gaelic story of "The Sea-Maiden," a three-headed beast haunting a loch
    cannot be killed until an egg is broken; the egg is in the mouth of a trout, which
    comes from a crow, which comes from a hind living on an island in the loch.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: In Modern Greek variants, the life of a dragon or other baleful being ends
    when three pigeons, hidden either in an inaccessible chamber or in a wild boar,
    die.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the Servian story, a dragon's strength lies in a sparrow nested within
    a dove, hare, boar, and dragon in a lake; the hero fights the lake-dragon, is
    strengthened by the heroine's kiss, obtains a charm from the sparrow, and wrings
    its neck.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the Indian story of Punchkin, Punchkin's life depends on a parrot in a
    cage beneath six jars of water in a desolate jungle; injuries to the parrot cause
    corresponding injuries to Punchkin, and wringing the parrot's neck kills him.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the Samoyed tale, seven brothers remove their hearts nightly; a captive
    damsel hangs them on a tent-pole, and her brother later obtains the hearts, throws
    them on the floor, and the brothers die.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: In the Egyptian tale, Satou places his heart in the flowers of an acacia tree;
    after his wife tells the secret and the tree is cut down, the heart falls and
    Satou dies.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Anepou searches for Satou's heart, eventually finds it under the acacia, places
    it in a vase of mystic fluid, pours fluid down Satou's throat, and Satou returns
    to life.
  category: sequence
  evidence_refs:
  - ev:12
