canonical_text:
  quote: ''
  summary: The passage recounts a poor old man paying a priest in gold to bury his
    dead wife, revealing that a treasure came to him, and then being tricked by the
    greedy priest, who disguises himself as the Devil in a goatskin to extort the
    pot of gold. When the priest returns home, the goatskin cannot be removed and
    has united with his body, which the narrator attributes to God's punishment for
    greed. The passage then adds editorial comments about money-related Skazkas, peasant
    reverence for religion, and the unreliable use of folktale clergy as evidence
    for relations between clergy and parishioners.
  language: English
