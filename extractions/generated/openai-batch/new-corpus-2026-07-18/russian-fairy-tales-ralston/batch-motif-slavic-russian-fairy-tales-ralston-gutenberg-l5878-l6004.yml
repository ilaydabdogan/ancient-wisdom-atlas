canonical_text:
  quote: ''
  summary: The passage introduces Baba Yaga as a major female malevolent enchantress
    in Russian fairy tales, describes her appearance, dwellings, travel apparatus,
    powers, and links with the Snake. It then begins the tale “The Baba Yaga,” in
    which an evil stepmother sends a girl to Baba Yaga for needle and thread. Warned
    by a real aunt, the girl appeases dangerous threshold beings and objects, is threatened
    with being eaten, bribes a servant to delay the bath, receives escape instructions
    and magical objects from a Cat, and begins to flee while the Cat delays Baba Yaga
    at the loom.
  language: English
  quote_policy: summarized
