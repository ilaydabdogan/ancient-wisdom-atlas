canonical_text:
  quote: "“At last the prince breaks the egg. Koshchei falls on the floor and dies.”"
  summary: 'The passage first concludes a tale in which Prince Ivan secretly supplies
    a ring, wedding-dress, and seamless shoes through an old woman, reveals his princely
    identity, marries the bride before his elder brother arrives, and is made heir
    after his brothers'' treachery is exposed. It then summarizes related variants:
    in “Prince Arikad,” a Queen-Mother is carried off by the Whirlwind, rescued by
    her youngest son, and the rescuers are betrayed by brothers who cut a rope and
    enforce an oath by eating earth. Finally, it compares variants of Koshchei’s or
    a Snake’s death, where the fatal object is hidden in a nested egg-chain and breaking
    or striking with the egg or its contents kills the antagonist.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The old woman offers to make the wedding ring for the King, and the King threatens
    her with beheading if she fails.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prince Ivan remains unconcerned because the ring is already present, then
    tells the old woman to deliver it, take only one ducat, and conceal his involvement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bride is pleased with the ring, and the old woman refuses a dish full
    of gold, taking only one ducat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: With Prince Ivan's aid, the old woman also brings the requested wedding-dress
    and seamless shoes, taking one ducat each time and saying she made the items herself.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the wedding day, Prince Ivan asks the old woman to tell him when the bride
    is about to be married, puts on princely raiment, and reveals his true appearance
    to her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Prince Ivan enters the church before his brothers arrive, stands beside the
    bride, and marries her; the eldest brother sees them being escorted together and
    turns back.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After learning of the elder brothers' treachery, the King banishes the two
    elder princes and makes Ivan heir to the throne.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In “Prince Arikad,” the Queen-Mother is carried off by the Whirlwind; her
    youngest son climbs a hill with iron hooks, kills Vikhor, and lowers his mother
    and three other ladies by a hide-strip rope.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The brothers cut the rope to prevent the youngest son from descending and
    oblige the ladies to swear not to betray them, with the oath accompanied by eating
    earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The narrator states that the sacred nature of such an obligation may explain
    reticence in similar stories.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: One description says Koshchei is killed by a blow on the forehead from the
