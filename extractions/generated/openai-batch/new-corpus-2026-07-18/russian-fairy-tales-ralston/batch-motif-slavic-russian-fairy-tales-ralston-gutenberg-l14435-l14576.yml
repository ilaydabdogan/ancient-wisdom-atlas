canonical_text:
  quote: ''
  summary: 'The passage concludes a tale in which St. Nicholas repeatedly advises
    a peasant so that Elijah''s destructive or limiting actions become profitable:
    a ruined crop is bought back, grows abundantly, and yields grain despite a threshing
    restriction. Nicholas then has the peasant carry unequal votive tapers, causing
    Elijah to be appeased and the peasant to honor both saints. The passage then comments
    that powers once attributed to Perun are now ascribed to more than one Christian
    saint, giving examples of St. George with a lance and St. Andrew with a mace;
    in a Chernigof legend Andrew destroys a witches'' village that had stolen the
    holy stars, leaving a swamp.'
  language: English
  quote_policy: summarized
