canonical_text:
  quote: ''
  summary: A ruined Russian merchant borrows fifty thousand roubles from a Tartar
    merchant, naming the life-giving cross as surety. After prospering, he is caught
    in a storm and sends the repayment in a barrel through the water. The barrel miraculously
    reaches the Tartar, who later recognizes the repayment and is baptized with his
    household after a thanksgiving service.
  language: English
  quote_policy: summarized
