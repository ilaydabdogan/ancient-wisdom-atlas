canonical_text:
  quote: ''
  summary: 'The passage introduces Russian tales of water-dwelling maidens who can
    become birds and are often daughters of the Water King. It summarizes a common
    pattern in which the Water King seizes a human boy, who later marries one of his
    daughters and escapes to the upper world. The tale then begins: a hunting king
    spares and feeds an Eaglet for three years. The grown Eagle carries the king over
    seas, drops him into water three times and rescues him, explaining that this repays
    the king’s earlier threat to shoot it. The Eagle then flies with the king beyond
    distant lands to the house of its youngest sister, who rejects the king and sets
    greyhounds on him; the Eagle carries the king away and later points out the sister’s
    house burning behind them.'
  language: English
  quote_policy: summarized
