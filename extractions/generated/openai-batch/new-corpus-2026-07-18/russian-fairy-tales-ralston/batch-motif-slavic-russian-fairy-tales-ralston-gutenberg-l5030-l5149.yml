canonical_text:
  quote: '"Osip, Osip, come here!"'
  summary: A woman returns from an underwater life with her husband Osip to visit
    her mother. After learning Osip's name and the call by which he can be summoned,
    the mother goes to the dike and beheads him. The wife later discovers his severed
    head in the water and transforms her daughter, son, and herself into birds. The
    surrounding note and commentary compare the tale to serpent-spouse, Naga, and
    European water-spirit traditions while stressing the unusual tragic ending.
  language: English
  quote_policy: quoted
