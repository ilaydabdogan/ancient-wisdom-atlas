canonical_text:
  quote: ''
  summary: Vasilissa feeds and petitions her doll, which advises and assists her.
    Her stepmother and stepsisters mistreat her and later contrive to send her into
    the forest to Baba Yaga for fire. Guided and reassured by the doll, Vasilissa
    enters the forest, sees white, red, and black riders associated with daybreak,
    sunrise, and nightfall, reaches Baba Yaga’s bone-fenced dwelling, and encounters
    Baba Yaga, who threatens to eat her unless she stays and works for a light.
  language: English
  quote_policy: summarized
