canonical_text:
  quote: we turn old folks into young ones.
  summary: A smith copies a Last Judgment demon image onto his smithy door. After
    his son inherits the smithy and repeatedly insults the demon image, the Demon
    takes the form of a youth, becomes the son's apprentice, and performs a rejuvenation
    on an old lady by burning her to bones and placing the bones in milk. The transformed
    woman sends her husband to the smithy, but the Demon has vanished and the Smith
    denies knowing how to make him young.
  language: English
  quote_policy: quoted
