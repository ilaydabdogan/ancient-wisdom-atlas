literal_observations:
- id: obs:1
  text: A Little-Russian belief says a vampire with numb crossed hands uses steel-like
    teeth to gnaw through obstacles, then kills babies before older household members.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fine salt scattered on a room floor can reveal the vampire's footsteps leading
    back to its grave, where it is found with rosy cheeks and a bloody mouth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Kashoube Vieszcy wakes in the grave and gnaws its own hands and feet;
    as it gnaws, its relatives and neighbors sicken and die.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Vieszcy may rise at midnight, destroy cattle, sound a belfry bell whose
    hearers soon die, or suck blood from sleepers, leaving a small wound over the
    heart.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Lusatian Wends hold that when a corpse chews its shroud or sucks its own
    breast, its kin will soon die.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Wallachian murony can take the form of a dog, cat, toad, or blood-sucking
    insect, and when exhumed shows recent nail growth and blood streaming from facial
    openings.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: In a Russian story, a stranger takes blood from a youth and an old man into
    pails by striking their backs open, then drinks the blood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Anti-vampire directions include driving a stake through the corpse, with aspen
    or thorn named as materials in different places.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says fire and decapitation with a grave-digger's shovel are the
    only certain methods of destroying a vampire, while some staked vampires resist
    or remove the stake.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Possible causes of vampirism include being a wizard, witch, suicide, violently
    killed person, cursed person, vampire victim, corpse crossed by an animal, bird
    flying over a corpse, or offspring of an unholy union.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A stake must be driven through the vampire by a single blow; a second blow
    would restore it to life, and this is linked to folk-tale warnings not to strike
    magic foes more than once.
  category: sequence
  evidence_refs:
  - ev:8
