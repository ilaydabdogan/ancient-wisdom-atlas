canonical_text:
  quote: ''
  summary: 'The passage summarizes several Baba Yaga tale episodes: four heroes reach
    a rotating hut in a dense forest; Baba Yaga beats and mutilates three heroes but
    is defeated by the youngest, Ivan, who restores his companions. The continuation
    includes an abyss descent, maidens, a magic sword, Baba Yaga’s beheading, betrayal
    by companions, and Ivan’s revenge. The passage then compares the tale to wider
    versions, discusses the recurring practice of cutting strips from backs, and describes
    Baba Yaga as cannibalistic and sometimes petrifying victims, including a tale
    in which Prince Ivan reverses her petrifying spell and restores Ivan Devich.'
  language: English
  quote_policy: summarized
