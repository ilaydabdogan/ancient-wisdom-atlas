canonical_text:
  quote: ''
  summary: Vasilissa and the Prince flee the Water King. Vasilissa repeatedly transforms
    herself, the Prince, and the horses to mislead pursuers; the Water King later
    dies after consuming a transformed river of honey with kissel banks. Near the
    Prince's home, Vasilissa warns him not to kiss his sister, but he does and forgets
    her. Disguised as a beggar, Vasilissa attends the Prince's planned remarriage
    with a pie containing curds and live doves; the doves' speech reminds the Prince
    of her, and he restores her to his side.
  language: English
  quote_policy: summarized
