canonical_text:
  quote: ''
  summary: Prince Ivan seeks Koshchei's death, spares several animals, receives their
    later aid, finds and destroys the egg that contains Koshchei's death, rescues
    his mother and a Princess, is betrayed by his brothers at a ladder, and then uses
    a ring to summon helpers who carry him down from the hill before he returns to
    his father's city in disguise or unrecognized.
  language: English
  quote_policy: summarized
