canonical_text:
  quote: ''
  summary: 'A dog remembers an offense by its master, later attacks him, and is killed.
    The passage then introduces “The Soldier and the Vampire.” A soldier on furlough
    visits a miller near his home village at night. The miller warns that a dead warlock
    rises from his grave and haunts the village. The soldier proceeds, finds the warlock
    by a graveyard fire, follows him to a wedding, and witnesses him put the bridal
    pair into a deathlike sleep by drawing their blood into phials. The warlock explains
    how the blood can restore them and also boasts of the only way to destroy him:
    burning him on a large aspen pyre while preventing any creatures from escaping.
    At the grave the warlock attacks the soldier, but cockcrow makes him fall lifeless;
    the soldier takes the phials and later learns the bridal pair have died that night.'
  language: English
  quote_policy: summarized
