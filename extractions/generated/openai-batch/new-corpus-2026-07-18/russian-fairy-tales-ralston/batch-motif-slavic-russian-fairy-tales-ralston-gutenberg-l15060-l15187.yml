canonical_text:
  quote: ''
  summary: The passage describes vestiges of Slavic belief in a White God-like figure,
    Byelun, and a Black God, then discusses beliefs and tales in which cursed, suffocated,
    unbaptized, or improperly baptized children become subject to demons. It summarizes
    a church ritual for recovering a suffocated babe, an Onega tale in which an old
    hunter recovers a merchant's son from devils after a maternal curse, and a Vladimir
    tale in which a cursed son lives through an ice-hole in a water realm connected
    with Satan's hall.
  language: English
  quote_policy: summarized
