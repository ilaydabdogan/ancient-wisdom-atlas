comparison_claims:
- id: claim:1
  claim: The passage presents Moravian tales as close analogues to the Russian stolen-crust
    episode, especially in the pattern of an evil spirit stealing food and then undergoing
    earthly service as expiation.
  claim_level: same_motif
  target: Moravian tales cited as "Der schwarze Knirps" and "Der boese Geist im Dienste"
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The cited Moravian material is summarized in a footnote; no full Moravian
    texts are included in the passage.
- id: claim:2
  claim: The passage explicitly identifies a Bhaunagar/Kathiawad Naga story as a striking
    parallel to the Russian and Moravian stolen-food stories.
  claim_level: same_motif
  target: Bhaunagar/Kathiawad legend of a female Naga eating rice boiled in milk
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The parallel is thematic and narrative; the passage does not claim
    historical contact, common inheritance, or identical ritual meaning.
- id: claim:3
  claim: The passage states that the evil spirit of the legenda sometimes closely
    resembles the snake of the skazka, introducing the midnight princess episode as
    an example.
  claim_level: same_function
  target: snake of the skazka compared with the nocturnal evil spirit troubling a
    princess
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not provide the full snake tale, so the resemblance
    rests on the author's brief comparative framing.
- id: claim:4
  claim: The passage interprets the soldier-and-devils legend as an adaptation of
    older tales about dull demons, with Christian storytelling transforming them into
    Satan and subject fiends.
  claim_level: same_motif
  target: older tales about dull demons transformed into Satan and fiends
  evidence_refs:
