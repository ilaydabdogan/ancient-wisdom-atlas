canonical_text:
  quote: ''
  summary: 'The passage recounts several linked legend materials: a demon restores
    a stolen crust and serves a peasant with profitable agricultural foresight; notes
    compare this with Moravian and Bhaunagar/Naga stories of stolen food and supernatural
    response; a soldier defeats devils troubling a princess, traps them in a cross-marked
    knapsack, and they end in a mill-pool; and a poor peasant sorcerer visits the
    devils, arranges a bride for his son, receives a receipt for a sold child, and
    flees after learning of the fiery Gossip''s Bedstead used to punish devils and
    their kin.'
  language: English
  quote_policy: summarized
