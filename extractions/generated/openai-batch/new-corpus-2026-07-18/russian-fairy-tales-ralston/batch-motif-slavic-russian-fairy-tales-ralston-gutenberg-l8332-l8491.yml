canonical_text:
  quote: ''
  summary: A peasant and Woe uncover gold under a stone in an open plain. The peasant
    tricks Woe into entering the pit and seals it under the stone, becoming prosperous.
    His rich brother learns the story, releases Woe out of envy, and Woe clings to
    him, causing renewed drinking and loss. The merchant then tricks Woe into a wheel,
    wedges it shut, and throws it into a river, where Woe is drowned. A Tula variant
    replaces Woe with Nuzhda, or Need, whose voice joins a poor couple's song after
    they drink water.
  language: English
  quote_policy: summarized
