canonical_text:
  quote: ''
  summary: A witch has a smith make her voice like Ivashko's mother, lures Ivashko
    to the waterside, seizes him, and orders her daughter Alenka to bake him. Ivashko
    tricks Alenka into sitting on the shovel and puts her into the oven instead, then
    hides in an oak. The witch and her guests eat Alenka's baked body, believing it
    to be Ivashko's, until he calls down from the tree. The witch gnaws at trees to
    reach him and has iron teeth forged, but Ivashko appeals to passing swans and
    geese; a later flock carries him home to his parents, who find him in the upper
    room and rejoice.
  language: English
  quote_policy: summarized
