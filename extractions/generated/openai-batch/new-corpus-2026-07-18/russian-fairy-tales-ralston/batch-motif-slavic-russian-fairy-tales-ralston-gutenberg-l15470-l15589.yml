canonical_text:
  quote: ''
  summary: A youth and a fair maiden escape from devils at a lake by walking backwards,
    causing the pursuing devils to misread their tracks. The youth brings the maiden
    to her village, where she is recognized as the priest's daughter and says he has
    brought her back from “down there” into the “white world.” She carries gold and
    silver dishes taken from the devils; a merchant recognizes them as dishes lost
    after he angrily invoked the devil. The youth marries her and returns home after
    three years, though his time with the devils seemed no more than a day. A note
    compares the legend with medieval European and Grimm variants involving hasty
    words or imprecations, and the commentary generalizes that folk-tale devils are
    often powerful but foolish antagonists.
  language: English
  quote_policy: summarized
