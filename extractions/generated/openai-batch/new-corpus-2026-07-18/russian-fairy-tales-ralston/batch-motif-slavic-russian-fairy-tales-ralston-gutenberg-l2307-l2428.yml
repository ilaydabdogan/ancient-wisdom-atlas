canonical_text:
  quote: ''
  summary: A Simpleton believes a withered Birch-tree has bought his ox and repeatedly
    demands payment from it. After the ox has been eaten by wolves, he chops the tree
    with a hatchet and discovers gold hidden inside its hollow. His brothers help
    carry away the gold and warn him to keep silent, but he reveals the money to a
    Diachok, who tries to take some. The Simpleton kills the Diachok with his hatchet.
    His brothers first hide the body in a cellar, then replace it with a dead goat
    and bury the Diachok elsewhere. When questioned, the Simpleton admits the killing
    and leads searchers to the cellar, where they find the goat’s head and dismiss
    his statement.
  language: English
  quote_policy: summarized
