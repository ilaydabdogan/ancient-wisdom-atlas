canonical_text:
  quote: ''
  summary: Ralston describes several Slavic tale variants involving magic waters reached
    through opening or grinding mountains, then summarizes a tale in which Queen Anastasia
    helps Prince Ivan use the Water of Strength and Water of Weakness to defeat Vikhor,
    the whirlwind abductor. The passage ends with Ralston's comparison of the Water
    of Strength to Soma in Indra myths.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In one variant, a prince endangered by his sister and her demon lover, the
    Snake, is sent to obtain healing and vivifying water kept between two mountains
    that open only briefly each day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prince Ivan rides between the parted mountains, fills two flasks, escapes,
    and the horse's hind legs are crushed by the closing cliffs before being restored
    by the magic waters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Slovak variant has a murderous mother send her son to two mountains, one
    opening at midday to reveal the Water of Life and the other opening at midnight
    to reveal the Water of Death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Ukrainian version mentions healing and life-giving springs guarded by iron-beaked
    ravens, with the route lying between grinding hills; the Hare's tail is jammed
    by the cliffs, explaining why hares have no tails.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Queen Anastasia has been carried away by Vikhor from Tsar Byel Byelyanin,
    and her sons go in search of her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The youngest son finds three palaces containing princesses held captive by
    Vikhor and then a fourth palace where he discovers his mother, Queen Anastasia.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Vikhor's cellar, two tubs hold the Water of Strength and the Water of Weakness;
    Queen Anastasia instructs Prince Ivan to drink from the right-hand tub and then
    switch the tubs' positions.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: After drinking from the right-hand tub twice, Prince Ivan says he is strong
    enough to upset the palace and then to jolt the whole world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Queen Anastasia explains that Vikhor normally drinks the Strong Water from
    the right-hand side and that deceiving him is necessary for Prince Ivan to survive
    against him.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Vikhor arrives as the day darkens and the palace quivers; after stamping on
    the ground he becomes a noble gallant holding a battle mace.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Prince Ivan seizes Vikhor's battle mace and struggles with him as Vikhor flies
    over seas and into the clouds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Vikhor drinks from the right-hand tub, now containing the Water of Weakness,
    while Prince Ivan drinks from the left-hand tub, now containing the Water of Strength.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Prince Ivan beheads the weakened Vikhor with a single blow, refuses to strike
    again, burns the head and trunk, and scatters the ashes to the winds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Ralston explicitly compares the Water of Strength with Soma's role in strengthening
    Indra and compares Vikhor's debility with Indra's loss of strength in the Namuchi
    episode.
  category: other
  evidence_refs:
  - ev:8
