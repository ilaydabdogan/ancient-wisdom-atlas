canonical_text:
  quote: ''
  summary: 'A priest''s daughter disappears in the forest and is later found in a
    hidden hut after a hunter shoots a Leshy. The hunter returns her to her parents,
    and the Leshy''s hut cannot be found again. The passage then presents river-personification
    traditions: Desna and Dnieper dispute precedence; Vazuza and Volga compete in
    a race to the Caspian and assume a younger-sister/elder-sister relation; Lake
    Ivan''s sons Shat and Don follow contrasting paths, with Don aided unsuccessfully
    by a raven in an attempted sea-crossing feat.'
  language: English
  quote_policy: summarized
