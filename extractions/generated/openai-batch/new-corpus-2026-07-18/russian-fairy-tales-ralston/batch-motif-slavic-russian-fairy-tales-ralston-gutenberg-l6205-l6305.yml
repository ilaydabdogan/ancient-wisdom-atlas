candidate_motifs:
- id: motif:1
  label: miraculous birth from gathered eggs
  taxonomy_refs:
  - miraculous_child
  basis: Forty-one boys are born from forty-one eggs gathered from the village and
    placed under a hen by a childless couple.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage summarizes a tale rather than giving the full narrative context
    of the birth.
- id: motif:2
  label: weak youngest becomes saving hero-adviser
  taxonomy_refs: []
  basis: The forty-first boy remains weak for a long time but later becomes a mighty
    hero and gives the advice that saves the sons-in-law.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not describe the process by which the weak figure becomes
    heroic.
- id: motif:3
  label: death avoided through clothing exchange
  taxonomy_refs:
  - trickster_boundary
  basis: The sons-in-law exchange clothing with their brides before sleep, causing
    Baba Yaga's servants to kill the daughters instead of the intended victims.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy reference is used cautiously for deception and role-boundary
    reversal; the passage does not call the act trickster behavior.
- id: motif:4
  label: fiery pursuit by supernatural mother-in-law and magical escape object
  taxonomy_refs: []
  basis: Baba Yaga pursues the fleeing sons-in-law with a burning shield, while a
    magic bridge-creating kerchief enables their escape.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No broader cosmological meaning is stated in the passage.
- id: motif:5
  label: impossible tasks solved by animal helper
  taxonomy_refs:
  - initiation
  - wisdom
  basis: The girl must heat a bath with unsuitable fuel and fetch water in a sieve,
    but the sparrow gives practical advice that lets her complete the tasks.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage frames the tasks narratively but does not explicitly call
    them initiation.
- id: motif:6
  label: respectful service rewarded and abusive imitation punished
  taxonomy_refs: []
  basis: The girl who washes Baba Yaga's children properly receives a blue coffer
    of money, while the girl who fails the tasks and harms the children receives a
    red coffer that releases fatal fire.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The reward and punishment are clear, but no explicit moral interpretation
    is supplied by the passage.
- id: motif:7
  label: secret maternal helper doll fed for advice
  taxonomy_refs:
  - wisdom
  - sacred_exchange
  basis: Vasilissa's mother bequeaths a doll with a blessing and tells Vasilissa to
    feed it in misfortune and ask its advice; the doll later helps with her work.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: medium
  cautions: The exchange and wisdom functions are explicit, but 'sacred' is inferred
    only cautiously from the maternal blessing and deathbed bequest.
- id: motif:8
  label: jealous stepfamily persecutes beautiful stepdaughter
  taxonomy_refs: []
  basis: Vasilissa's stepmother and stepsisters are jealous of her beauty and burden
    her with labor.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: Only the opening portion of the Vasilissa tale is included in this passage.
