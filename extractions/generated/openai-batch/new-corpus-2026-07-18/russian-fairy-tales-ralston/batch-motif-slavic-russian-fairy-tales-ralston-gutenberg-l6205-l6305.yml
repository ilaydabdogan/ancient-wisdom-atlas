canonical_text:
  quote: ''
  summary: 'The passage summarizes several Baba Yaga tales: one in which forty-one
    boys are born from eggs, marry Baba Yaga''s daughters, escape an intended murder
    by exchanging clothes with their brides, and flee a fiery pursuit; another in
    which a girl respectfully washes Baba Yaga''s strange children and is rewarded,
    while a failed imitator is punished by fire from a coffer. It then introduces
    ''Vasilissa the Fair,'' where Vasilissa receives a secret advisory doll from her
    dying mother and is later mistreated by a jealous stepfamily while the doll helps
    her.'
  language: English
  quote_policy: summarized
