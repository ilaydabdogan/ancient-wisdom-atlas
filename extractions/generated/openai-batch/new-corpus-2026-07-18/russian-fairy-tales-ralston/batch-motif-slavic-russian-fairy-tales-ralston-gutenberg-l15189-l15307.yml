canonical_text:
  quote: ''
  summary: 'The passage closes one tale in which a wife rescues her husband from devils,
    then summarizes and quotes a Russian version of a widespread soldier-and-devil
    tale: an unwashed soldier receives wealth after a term of devil-service, seeks
    a king''s daughter in marriage, is refused by two elder princesses whose words
    give the devil claim to their souls, is accepted by the youngest, and is magically
    cut apart, boiled, reassembled, and restored with the Waters of Life and Death.
    A demon superior later judges the little devil''s conduct. The footnote compares
    German versions and an Indic story transmitted to China about an ascetic suitor
    and royal daughters.'
  language: English
