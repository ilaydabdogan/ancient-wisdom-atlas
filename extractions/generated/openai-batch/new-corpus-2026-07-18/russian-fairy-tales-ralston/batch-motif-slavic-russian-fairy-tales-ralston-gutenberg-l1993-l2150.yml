canonical_text:
  quote: ''
  summary: A poor orphan serves for very small wages, tests his earned coins in a
    well, and uses the three returned coins to buy a tormented kitten. The cat later
    kills vermin in a foreign inn and is sold for a great quantity of gold. The merchant
    who sold it is tempted to keep the money, but a storm arises at sea; after he
    repents, the sea calms and he returns the gold to the orphan. The orphan trades
    the gold for incense, burns it in honor of God, and is offered a choice between
    riches and a good wife by a mysterious old man. After a childlike elder adviser
    tells him to choose the wife, a beautiful woman appears as his wife. The passage
    then transitions into commentary on avarice tales and begins the next tale about
    the miser Marko seeing an old beggar.
  language: English
  quote_policy: summarized
