canonical_text:
  quote: Koshchei the Deathless carried off their mother.
  summary: A king's youngest son, Prince Ivan, sets out to recover his mother from
    Koshchei the Deathless after his elder brothers disappear. A helpful old woman
    directs him to an underground heroic steed. Ivan opens a mountain path by throwing
    an iron rock, leaves a blood-token with his brothers, reaches a captive king's
    daughter, proves his strength with Koshchei's sword, reunites with his mother,
    and learns from Koshchei that his death is hidden beneath an oak inside a sequence
    of nested containers and animals ending in an egg.
  language: English
  quote_policy: quoted
