  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: In these skazka patterns, elder brothers almost always try to kill the prince
    when he is about to cross back between the separated realms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In one instance, Ivan has killed a Snake in the underground world and carries
    its head on a lance while his brothers are hoisting him up.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ivan's brothers, frightened by the Snake head and thinking the Snake itself
    is coming, let him fall back into the pit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Ralston says oriental tales often explain elder brothers' hostility by making
