canonical_text:
  quote: ''
  summary: Ralston summarizes Indian tale parallels to Russian skazkas involving younger
    princes, hostile elder brothers, demons in animal form, pursuit into forest castles
    or otherworldly caverns, helper maidens, serpent or demon killing, and blocked
    ascent or descent between worlds. He also offers an explanation that half-brother
    rivalry in oriental tales may have become generalized brother rivalry or stepmother
    hostility in Christianized western versions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Sringabhuja summary, elder sons of a king want to get rid of their
    younger half-brother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Rakshasa appears as a gigantic crane; the youngest prince wounds it after
    the other princes fail to shoot it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The youngest prince pursues the wounded crane and the valuable arrow fixed
    in it, wanders for a long time, and reaches a castle in a forest.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the forest castle, a maiden says she is the daughter of the wounded Rakshasa
    and sides with the hero against her father.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In two Indian stories, a hero chases a gigantic boar into a cavern and finds
    himself in a different world where he meets a beautiful maiden.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In one boar story, the maiden is the daughter of a Rakshasa who is vulnerable
    only in the palm of his left hand.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The maiden instructs Chandasena how to kill her father, and the Rakshasa is
    killed by a well-aimed shaft.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the other boar story, a princess says a fiery-eyed demon carried her off
    and imprisoned her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The princess says the demon has died from a wound inflicted while he was transformed
    into a boar, and Saktideva identifies himself as the archer.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that adventures of a youngest prince lowered into an underground
