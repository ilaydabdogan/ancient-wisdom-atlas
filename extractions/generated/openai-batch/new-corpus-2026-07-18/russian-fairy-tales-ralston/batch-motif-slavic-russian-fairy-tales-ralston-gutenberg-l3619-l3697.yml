comparison_claims:
- id: claim:1
  claim: Ralston presents Indian fiction as offering parallels to Russian skazkas
    of the Norka type, especially in the younger royal hero, hostile elder brothers,
    an animal-form demon, and a maiden who aids or joins the hero.
  claim_level: same_motif
  target: Indian Sringabhuja-type summary compared with Russian Norka-type skazkas
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage is a scholarly summary and does not quote complete Indian
    or Russian tale texts; the exact degree of motif identity requires checking the
    cited stories.
- id: claim:2
  claim: The Indian boar-cavern stories are presented as corresponding to the Russian
    pattern of a hero crossing into an underground or otherwise enchanted realm and
    encountering a maiden after pursuing a monstrous animal.
  claim_level: same_motif
  target: Indian gigantic-boar cavern stories compared with Norka-type Russian skazka
    realm-crossing stories
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The Indian summaries specify a cavern and different world; the Russian
    summary separately mentions underground and upper realms, so the spatial mapping
    is similar but not identical.
- id: claim:3
  claim: Ralston cautiously explains hostile elder brothers in western tale versions
    as possibly deriving from oriental half-brother rivalry in polygamous royal households,
    with such distinctions later suppressed in Christian transmission.
  claim_level: historical_contact
  target: Oriental tale kinship structure and Christian western tale adaptations
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: This is Ralston's proposed explanation; the passage does not provide
    independent transmission evidence beyond his statement.
- id: claim:4
  claim: The passage compares the hatred of a favored younger or later-born son by
    his half-brothers to the Joseph story as a similar family-jealousy pattern.
  claim_level: same_function
  target: Joseph and his half-brothers as an analogue for sibling hatred caused by
    paternal favoritism
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The Joseph reference is used as an explanatory analogy, not as a direct
    source claim for the skazkas.
