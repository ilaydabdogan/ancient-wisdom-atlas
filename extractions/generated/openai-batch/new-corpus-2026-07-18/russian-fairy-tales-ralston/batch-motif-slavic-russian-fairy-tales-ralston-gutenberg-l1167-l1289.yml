canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a dying witch orders her
    daughter to wash her corpse with boiling water; after her death, demons remove
    her skin, one demon occupies the skin, and the boiling-water washing exposes and
    drives off the demon. The prose commentary then describes Russian funeral wailing
    and summarizes a comic “Fox-wailer” tale involving an old man, his dead wife,
    animal wailers, and a beanstalk to heaven. The excerpt then begins “The Treasure,”
    in which a poor widower is refused help and clerical burial service for lack of
    money, digs a grave himself, finds a pot of gold, and tries to pay the priest.
  language: English
  quote_policy: summarized
