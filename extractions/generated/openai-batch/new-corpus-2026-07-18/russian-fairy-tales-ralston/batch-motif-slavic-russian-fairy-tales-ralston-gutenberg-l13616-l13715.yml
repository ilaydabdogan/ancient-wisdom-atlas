canonical_text:
  quote: ''
  summary: A Soldier, following a Warlock's instructions, restores young people to
    life and is rewarded. He then has the Starosta assemble peasants and aspen wood,
    exhumes the Warlock's corpse, and burns it in the graveyard while villagers prevent
    emerging creatures from escaping; the ashes are scattered and peace returns. The
    surrounding commentary explains these stories as part of a belief in material
    revenants or vampires, especially in Slavonic traditions, and compares them with
    corpse-spectres in other European traditions.
  language: English
  quote_policy: summarized
