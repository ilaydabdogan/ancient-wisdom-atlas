candidate_motifs:
- id: motif:1
  label: Giant grain as memory of a more righteous and abundant former age
  taxonomy_refs:
  - wisdom
  basis: The unusually large grain is explained by the oldest man as something once
    sown and reaped in his youth; he links his vigor to righteous, non-covetous living.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The taxonomy link to wisdom is broad; the passage does not present an
    explicit formal doctrine of decline beyond the grain becoming smaller and the
    elder's moral explanation.
- id: motif:2
  label: Earth formed from underwater soil with hills and mountains arising from an
    adversary's concealed portion
  taxonomy_refs: []
  basis: The Lord orders the Devil to retrieve soil from the watery depths; the Devil
    hides soil in his mouth, then produces hills and mountains while choking, coughing,
    fleeing, and leaping.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: No exact available taxonomy ref for an earth-diver creation motif was
    supplied.
- id: motif:3
  label: Divine judgement explaining animal traits, taboos, and omens
  taxonomy_refs:
  - divine_judgment
  basis: The Lord forbids the disobedient bird from approaching open waters, curses
    the sparrow, and animal conduct explains food taboos, luck, ill omen, and physical
    traits.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: Several examples are grouped under a shared etiological pattern; individual
    legends vary in setting and cause.
- id: motif:4
  label: Animal helper saves the Ark from demonic damage
  taxonomy_refs:
  - ark_vessel
  - serpent
  basis: The Devil, in the form of a mouse, gnaws a hole in the Ark, and the snake
    stops the leak with its head, preserving Noah and his family.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage states the tradition briefly and does not elaborate the wider
    flood narrative.
- id: motif:5
  label: Half-eaten fish revived as a sign at the Annunciation
  taxonomy_refs:
  - resurrection
  - sacred_birth
  basis: In the Kherson legend, the Blessed Virgin says she will believe Gabriel if
    a partly eaten fish comes to life, and it immediately does so.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The sacred-birth connection is contextual, through the Angelical Salutation;
    the passage's immediate focus is also etiological explanation of the fish or sole.
- id: motif:6
  label: Birds aiding or opposing Christ receive lasting moral status
  taxonomy_refs:
  - divine_judgment
  basis: The sparrow is blamed for betrayal and assisting the crucifixion, while swallows
    are credited with protective acts; resulting customs and omens are explained.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The motif groups Kharkof and other Russian variants cited side by side
    in the passage.
