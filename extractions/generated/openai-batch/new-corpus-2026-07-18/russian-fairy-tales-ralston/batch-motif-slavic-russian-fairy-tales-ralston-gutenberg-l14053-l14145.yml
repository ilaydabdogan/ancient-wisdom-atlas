canonical_text:
  quote: ''
  summary: 'The passage gives several Russian and neighboring folk legends: a king
    consults increasingly older men about an unusually large grain of corn, and the
    oldest explains past abundance and his own vigor by righteous living; hills and
    mountains arise when the Devil, after carrying soil in his mouth during the creation
    of the earth, coughs and leaps while fleeing thunder and lightning; several animal
    traits and taboos are explained by their origins or actions, including crayfish,
    the snake that saves Noah''s Ark, the horse and ox at the manger, the sole or
    half-eaten fish, a water-denied bird, sparrows, and swallows.'
  language: English
  quote_policy: summarized
