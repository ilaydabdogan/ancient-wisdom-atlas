  summary: 'The passage first summarizes Russian peasant beliefs about the dead: the
    soul may remain with the coffin, near the home, or travel, and grave goods and
    memorial feasts preserve traces of older beliefs. It then gives the tale “The
    Fox-Physician,” in which an old man climbs a sky-reaching cabbage-stalk to a land
    with a food-producing mill, tries unsuccessfully to carry his wife there, and
    is deceived by a fox who claims to cure the shattered wife but eats her remains
    and the supplies.'
