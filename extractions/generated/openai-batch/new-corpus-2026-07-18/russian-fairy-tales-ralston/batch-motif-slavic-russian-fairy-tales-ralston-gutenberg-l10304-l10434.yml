canonical_text:
  quote: ''
  summary: 'The passage first comments on opposed magical waters, including a true
    Water of Death contrasted with healing, vivifying, weakening, and strengthening
    waters, and notes a variant in which Baba Yaga is replaced by a Snake. It then
    begins the tale “The Blind Man and the Cripple”: Prince Ivan is instructed by
    his dying parents to obey his tutor Katoma. As an adult he seeks Princess Anna
    the Fair, whose suitors must pose an unanswerable riddle or be beheaded. Katoma
    devises a riddle from a purse found on the road. Anna cannot solve it with her
    magic book, so her council rules that she must marry Ivan. She tries to delay
    or eliminate him by assigning an impossible task involving an iron pillar, which
    Ivan says should be handled by Katoma.'
  language: English
  quote_policy: summarized
