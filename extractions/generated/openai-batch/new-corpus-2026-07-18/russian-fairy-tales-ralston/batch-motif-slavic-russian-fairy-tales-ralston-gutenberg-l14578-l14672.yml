canonical_text:
  quote: ''
  summary: 'The passage surveys legends and rites associated with St. George/Yegory
    in Russian and related Slavic traditions: his patronage over wolves and livestock,
    dragon-slaying and saintly roles, spring field and cattle rituals, wolf legends
    involving allotted prey and miraculous bread, a Gypsy trickster episode involving
    a golden stirrup, and the beginning of a Bulgarian legend in which pagan Troyan
    receives gold and silver in place of drinking water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: St. George is named as Georgy, Yury, and Yegory the Brave, and is described
    as patron of wolves, flocks, and herds, a Christian Confessor, and a destroyer
    of snakes and dragons.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that differing representations of St. George are explained
    as legendary ideas from separate sources becoming associated with his name.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In some Russian areas, when cattle first go to spring pastures, a sheep-shaped
    pie is cut by the chief herdsman and its fragments are kept as a remedy for sheep
    diseases.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On spring St. George's Day, fields are sanctified and sprinkled with holy
    water; in the Tula Government, a similar service is held over wells.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A youth called Green Yegory is dressed in foliage and flowers, carries a lighted
    torch and a pie to the cornfields, and is followed by singing girls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Green Yegory rite, a circle of brushwood is lit, the pie is placed
    in the center, participants sit around the fire, and the pie is divided among
    them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Little Russia, the wolf is called St. George's Dog, and sheep killed by
    wolves are not eaten by humans because they are regarded as divinely assigned
    to beasts of the field.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man doomed by St. George tries to hide behind a stove, but a wolf transforms
    into a cat, enters at midnight, and seizes him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A hunter doomed by St. George kills wolves and hangs their skins, but at the
    fatal hour one skin becomes a wolf and kills him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A poor brother climbs a tree at night and sees St. George and the Lisun with
    wolves and bread; St. George gives him a remaining loaf that continually renews
    itself.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A rich brother imitates the poor brother by climbing the tree, but when no
    bread remains for one wolf, St. George gives the rich brother to the wolf instead.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A Gypsy asks Yegory the Brave to ask God how he should support his wife and
    seven children; after forgotten promises, he keeps Yegory's golden stirrup as
    a pledge.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: God's reply is that the Gypsy's business is to cheat and swear falsely; after
    hearing this, the Gypsy denies having taken the stirrup and Yegory loses it.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: A Bulgarian legend says that pagan Troyan did not believe in Christ but in
