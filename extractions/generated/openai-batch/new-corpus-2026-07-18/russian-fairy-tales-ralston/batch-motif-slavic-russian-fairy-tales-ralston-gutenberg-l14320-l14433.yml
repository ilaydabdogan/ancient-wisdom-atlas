canonical_text:
  quote: ''
  summary: The passage explains Slavic traditions connecting the Prophet Elijah/Ilya
    with thunder, lightning, rain, fire, harvest protection, and punishment, including
    comparisons to Perun, Thor, Indra, and Nicholas. It then begins a tale in which
    a peasant honors Nicholas but not Elijah; Elijah threatens the peasant’s crops,
    Nicholas warns the peasant to sell the standing corn to Elijah’s priest, and a
    hailstorm destroys the crop after it has changed ownership.
  language: English
