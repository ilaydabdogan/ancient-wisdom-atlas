canonical_text:
  quote: there was never any day, but always night. That was a Snake's doing.
  summary: 'The passage first describes the Russian fairy-tale Snake as mutable, sometimes
    mixed human-serpent, winged, polycephalous, mountain-associated, cave-dwelling,
    a captor of prey, and sometimes a concealer of cosmic light. It then recounts
    the South-Russian story of Ivan Popyalof: Ivan rises after twelve years among
    ashes, tests heavy maces, goes with his brothers to the Snake''s hut on fowl''s
    legs, kills three-headed and six-headed snakes, battles a twelve-headed snake,
    gains aid through a raven and his brothers, destroys the snake heads, and bright
    light returns throughout the land.'
  language: English
  quote_policy: quoted
