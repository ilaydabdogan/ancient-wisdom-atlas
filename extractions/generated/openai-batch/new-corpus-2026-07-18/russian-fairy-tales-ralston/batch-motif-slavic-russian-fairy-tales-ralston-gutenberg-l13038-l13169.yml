canonical_text:
  quote: ''
  summary: The passage ends one ghostly riding episode, then gives the tale “The Two
    Friends,” in which a bridegroom keeps a promise to invite his dead friend to his
    wedding, enters the grave at the dead friend’s invitation, drinks three cups,
    and returns to find that three hundred years have passed. An editorial note compares
    the tale with several time-loss and otherworld-visit traditions, and the passage
    then introduces a contrast between harmless grave-dwellers and more terrifying
    corporeal revenants in Russian tales.
  language: English
