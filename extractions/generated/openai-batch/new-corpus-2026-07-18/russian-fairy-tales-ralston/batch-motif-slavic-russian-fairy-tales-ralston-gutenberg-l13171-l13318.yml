canonical_text:
  quote: ''
  summary: A lazy girl at a village spinning party boasts that she fears nothing,
    steals and returns a holy picture from a church, then removes a shroud from a
    corpse seated on a tomb. The corpse comes at night demanding that she restore
    the shroud to its place; cockcrow ends the visits. After priestly consultation,
    a whirlwind during church service carries off the girl, leaving only her back
    hair. The narrator then describes Slavonic night-wandering corpses and vampires,
    and introduces a second tale in which a moujik at a graveyard takes a corpse's
    coffin-lid and forces the dead man to say where he has been and what he has done.
  language: English
  quote_policy: summarized
