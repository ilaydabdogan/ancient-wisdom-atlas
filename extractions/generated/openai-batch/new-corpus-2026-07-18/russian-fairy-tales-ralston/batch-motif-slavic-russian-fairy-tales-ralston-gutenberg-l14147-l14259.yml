  quote: ''
  summary: 'The passage introduces Russian legends in which Christ and the Apostles
    visit households in disguise and then summarizes two legends: one about a poor
    widow whose hospitality is contrasted with a rich moujik''s refusal, and another
    about a charitable young man who hosts Christ disguised as a beggar and later
    sees punishments and Paradise.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says many Russian legends describe Christ and his Apostles visiting
    houses, especially between Easter Sunday and Ascension Day, disguised as indigent
    wayfarers asking for food and lodging.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that tales of this kind are common in Christian lands and
    that Russian stories of this class resemble German and Scandinavian collections.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the legend of the poor widow, Christ and the twelve Apostles enter a village
    and ask a rich moujik for lodging, but he refuses and directs them to a widow.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The widow is described as very poor, with only a crust of bread, a handful
    of flour, and a cow that gives no milk, yet she offers the wayfarers food and
    shelter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The widow's small store of bread and flour is wonderfully increased so that
    the guests are fed and satisfied.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A wolf begs the Lord for food; the Lord sends it to the widow's cow-house,
    where it kills her cow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the cow is killed, the widow says that the Lord gave and the Lord has
    taken away, accepting the event as holy will.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A barrel full of money rolls toward the sacred wayfarers, and the Lord orders
    it to roll into the rich moujik's farmyard.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The rich moujik finds and stores the barrel of money while grumbling that
    the Lord might have sent twice as much.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Apostles are sent to a first well, but its water is foul, impure, and
    full of snakes, frogs, and toads, so they cannot drink.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Apostles are later sent to a second well with pure cool water, wondrous
    trees, and heavenly birds, where they drink.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Lord says that what seemed to the Apostles like about three minutes at
    the second well was actually three whole years.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Lord explains that the first well represents the rich moujik's state in
    the other world and the second well represents the poor widow's state in the other
    world.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the story of Christ's Brother, a young man goes to church on Easter Day
    with red eggs for beggars and brings home the one miserable beggar to whom he
    has no gift left to offer.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: After dinner, the beggar exchanges crosses with the young man, gives him a
    cross that blazes like fire, and invites him to visit on the following Tuesday.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: On his journey, the young man hears suffering children asking him to ask Christ
    how long they must suffer.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:17
  text: The young man sees girls ladling water from one well into another, and they
    make the same request for intercession.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: The beggar is recognized as Jesus Christ, who explains that the children suffer
    because their mothers cursed them before birth and that the girls are doomed to
    pour water eternally because they diluted milk with water when selling it.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:19
  text: The young man is taken into Paradise and shown the place prepared for him.
  category: action
  evidence_refs:
  - ev:12
