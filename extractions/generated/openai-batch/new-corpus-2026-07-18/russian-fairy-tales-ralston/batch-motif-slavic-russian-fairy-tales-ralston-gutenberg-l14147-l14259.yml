- id: claim:3
  claim: The passage cautiously links these Christian household-visit legends with
    older beliefs in gods who walked the earth and dispensed justice among humans.
  claim_level: same_function
  target: Pre-Christian or heathen-god visitation-and-justice pattern mentioned by
    the editor
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: low
  limitations: This is an editorial statement within the passage, not a demonstrated
    historical argument from the supplied legend summaries alone.
