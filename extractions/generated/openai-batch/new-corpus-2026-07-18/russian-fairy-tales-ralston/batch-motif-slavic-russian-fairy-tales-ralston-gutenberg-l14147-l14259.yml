  limitations: The passage gives a broad editorial comparison and does not provide
    specific non-Russian examples in the supplied text.
- id: claim:2
  claim: The passage states that many Russian stories of this class closely resemble
    similar stories in German and Scandinavian collections.
  claim_level: same_motif
  target: German and Scandinavian collections of sacred-visitor legends
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The supplied passage does not name the German or Scandinavian texts
    and notes a shared unfavorable portrayal of St. Peter that is not developed in
