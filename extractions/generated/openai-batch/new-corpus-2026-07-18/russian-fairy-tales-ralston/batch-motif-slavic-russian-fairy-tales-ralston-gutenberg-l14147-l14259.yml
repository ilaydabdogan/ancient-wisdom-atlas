candidate_motifs:
- id: motif:1
  label: Sacred visitors in disguise test household hospitality
  taxonomy_refs:
  - divine_judgment
  basis: Christ and the Apostles appear as needy wayfarers asking for food and lodging;
    the rich man refuses, while the poor widow receives them and later receives a
    favorable otherworldly comparison.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:8
  confidence: high
  cautions: The passage does not explicitly call the visit a test, but the sequence
    of refusal, hospitality, and revealed consequences supports the pattern.
- id: motif:2
  label: Miraculous increase of food for a hospitable poor person
  taxonomy_refs:
  - sacred_exchange
  basis: The widow gives all the food she has, and her bread and flour are wonderfully
    increased so that the sacred guests are satisfied.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explain the mechanism of the increase beyond calling
    it wonderful.
- id: motif:3
  label: Contrasting afterlife conditions shown through two wells
  taxonomy_refs:
  - afterlife_journey_map
  - divine_judgment
  basis: The foul well and the pure well are explicitly interpreted by the Lord as
    images of the rich moujik's and poor widow's states in the other world.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The wells are visited during the journey rather than during a full descent
    into the afterlife.
- id: motif:4
  label: Worldly loss paired with pious acceptance
  taxonomy_refs: []
  basis: The widow's cow is killed after the Lord sends the wolf to it, and the widow
    responds by accepting that the Lord gave and took away.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage later favors the widow, but it does not directly state that
    her acceptance causes the favorable outcome.
- id: motif:5
  label: Unmerited wealth given to the inhospitable rich man
  taxonomy_refs:
  - divine_judgment
  basis: The Lord sends a barrel of money to the rich moujik after he has refused
    lodging, and the rich man responds with dissatisfaction.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: medium
  cautions: The immediate gift appears paradoxical; its judgment function becomes
    clearer only through the later otherworld interpretation.
- id: motif:6
  label: Sacred exchange of crosses creates kinship with Christ
  taxonomy_refs:
  - sacred_exchange
  basis: The beggar exchanges crosses with the charitable host, gives him a fiery
    cross, and is later revealed as Jesus Christ, making the young man 'Christ's brother.'
  evidence_refs:
  - ev:10
  - ev:12
  confidence: high
  cautions: The passage assumes the significance of exchanging crosses but does not
    fully explain the ritual.
- id: motif:7
  label: Charity to a disguised beggar leads to access to Paradise
  taxonomy_refs:
  - sacred_exchange
  - afterlife_journey_map
  - mystical_quest
  basis: The young man hosts the miserable beggar, follows his directions by invoking
    the Lord's blessing, recognizes him as Christ, and is taken into Paradise to see
    his prepared place.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:12
  confidence: high
  cautions: The journey's geography is not described in detail, so the afterlife-map
    aspect is limited to the arrival at Christ and Paradise.
- id: motif:8
  label: Otherworldly punishment mirrors earthly misconduct
  taxonomy_refs:
  - divine_judgment
  basis: The girls who watered milk are doomed to pour water from well to well eternally;
    the children suffer because their mothers cursed them before birth.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The children suffer for their mothers' curses rather than for their own
    actions, so the mirroring pattern applies most directly to the girls.
- id: motif:9
  label: Heavenly or otherworldly time dilation
  taxonomy_refs:
  - afterlife_journey_map
  basis: At the pure well, the Apostles think they stayed only about three minutes,
    but the Lord says they spent three whole years there.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The pure well is interpreted as corresponding to the widow's otherworld
    state, but the scene itself occurs during the travelers' earthly journey.
comparison_claims:
- id: claim:1
  claim: The passage explicitly presents Russian legends of Christ and the Apostles
    visiting households as part of a broader Christian tale pattern involving sacred
    visitors seeking hospitality.
  claim_level: same_motif
  target: Christian legends of sacred visitors or angels received unawares
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
