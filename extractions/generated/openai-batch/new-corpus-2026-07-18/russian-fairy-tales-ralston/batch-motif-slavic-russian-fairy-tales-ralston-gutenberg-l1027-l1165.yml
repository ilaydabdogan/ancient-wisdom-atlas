canonical_text:
  quote: ''
  summary: The passage concludes an episode in which Marusia is compelled to attend
    church, sees the Fiend, suffers the deaths of her husband and son, destroys the
    Fiend with holy water, and revives her family with water of life. It then summarizes
    a peasant courtship involving Aunt Melania, Trofim, a widow, bean divination,
    prayer before Holy Pictures, and marriage. The passage next gives the tale of
    the Dead Mother, in which a dead mother returns at midnight to nurse her infant
    until she is exposed by light, after which the child dies. It ends by introducing
    the Dead Witch, an old witch with a daughter and granddaughter who summons her
    daughter before death.
  language: English
  quote_policy: summarized
