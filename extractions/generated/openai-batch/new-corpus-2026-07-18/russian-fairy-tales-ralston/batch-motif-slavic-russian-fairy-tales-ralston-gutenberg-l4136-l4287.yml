canonical_text:
  quote: ''
  summary: Prince Ivan, after sparing a lioness, reaches Baba Yaga's house, where
    human heads stand on poles. Baba Yaga promises him a heroic steed if he can watch
    her mares for three days, threatening to put his head on the last pole if he fails.
    The mares flee each day, but a bird, the lioness, and a bee cause them to return.
    The bee advises Ivan to hide, steal a sorry colt, and flee at night. Ivan steals
    the colt, crosses a fiery river by means of a magical bridge made with a handkerchief,
    and leaves a thin bridge behind him. Baba Yaga pursues in her mortar, the bridge
    breaks, and she dies in the river. Ivan fattens the colt until it becomes a wondrous
    steed, returns to Marya Morevna, and carries her away. Koshchei the Deathless
    learns this from his speaking horse and decides to pursue.
  language: English
  quote_policy: summarized
