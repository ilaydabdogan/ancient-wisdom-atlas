canonical_text:
  quote: ''
  summary: A Pope travels with an old man, steals the old man's undiminishing loaves,
    and denies the theft. In one kingdom the pair cure a dying princess by cutting
    her apart, washing the pieces, reassembling them, and having the old man breathe
    life into her. After receiving royal rewards, the Pope greedily tries to repeat
    the cure alone in another kingdom, fails, faces execution, seeks the old man's
    help, and again denies having eaten the loaves when questioned.
  language: English
  quote_policy: summarized
