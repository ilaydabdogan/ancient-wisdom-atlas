canonical_text:
  quote: ''
  summary: The passage describes variants in which hostile women transform themselves
    or use disguise in revenge; Ivan is taken underground to an Aged One with hidden
    eyes; another variant has Ivan Koshkin oppose snakes and Baba Yaga, who swallows
    and disgorges two brothers. The passage then summarizes a recurring tale pattern
    of three brothers, descent or ascent to another realm, and betrayal. It begins
    the South-Russian tale “The Norka,” where a king’s youngest son fights a huge
    beast that ravages the royal park, wounds it repeatedly, and follows it to a white
    stone through which it escapes into another world.
  language: English
  quote_policy: summarized
