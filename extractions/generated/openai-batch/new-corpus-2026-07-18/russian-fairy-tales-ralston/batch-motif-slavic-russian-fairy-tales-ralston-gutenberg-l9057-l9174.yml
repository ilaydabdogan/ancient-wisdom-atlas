canonical_text:
  quote: ''
  summary: The passage presents White-Russian legends in which personified rivers
    are siblings or other living beings. In one tale, a blind father is deceived into
    blessing the younger brother Dnieper instead of the elder Sozh, leading both brothers
    to become or act as rivers and race until Sozh falls into Dnieper. In another,
    the Dnieper, Volga, and Dvina are orphan siblings who choose to transform into
    rivers; the sisters begin first, and Dnieper pursues them angrily, explaining
    features of his course. A final fragment tells of fish asking the Black Brook
    for aid against a mill, and a black-clad stranger instructing an angler to carry
    a petition to Uncle Ilmen.
  language: English
  quote_policy: summarized
