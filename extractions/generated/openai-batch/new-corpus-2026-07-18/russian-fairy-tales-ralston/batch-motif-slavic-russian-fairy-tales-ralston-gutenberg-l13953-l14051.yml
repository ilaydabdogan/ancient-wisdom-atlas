canonical_text:
  quote: ''
  summary: The passage introduces Russian religious legends as a mixed body of apocryphal,
    saintly, biblical, and possibly older heathen material, then gives etiological
    legends about the dog at Paradise, the origin of windows in cottages, the composition
    of the first human body, and the reduced form and preservation of grain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Russian popular memory preserves legends about biblical and
    ecclesiastical persons and incidents, with sources including apocryphal books,
    saints' lives, Indian adaptations, and older heathen traditions recast as Christian
    narratives.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage states that Russian religious tales show a dual effect: pagan
    elements entering Christian narratives and Christian names and language being
    given to manifestly heathen legends.'
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: In one legend, the Lord places the dog, then a clean beast, at the gates of
    Paradise and orders it not to admit the Evil One.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Evil One gives the dog bread, the dog lets him into Paradise, and the
    Evil One spits over Adam and Eve.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After Adam and Eve are expelled, the Lord declares the dog an unclean hound,
    barred from dwellings and churches, while the story concludes that it is unclean
    skin-deep but clean within.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In another story, early people ask the Devil how to build warm houses; he
    teaches them to make windowless wooden cottages, which are warm but dark.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the people pray to the Lord, he tells them to cut out a window, and the
    cottage becomes light.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Dukhobortsui are said to hold that man was made from earthly materials
    and animated when God breathed the breath of life into the body.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: One rye story says rye once bore ears from top to bottom, but after lazy harvest-women
    cursed God's corn, the Lord stripped the ears until pity left a single ear.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A Little-Russian variant says Ilya began destroying all corn because of a
    woman's misuse of God's corn; a dog begged for and received a few ears, from which
    mankind later obtained seed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage explicitly says some Russian traditions about creation of man
    are closely connected with Teutonic myths, and that the rye story is also current
    in Western Europe.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
