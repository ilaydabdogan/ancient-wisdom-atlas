canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a Fiddler escapes fiends by obtaining
    leave to return home under escort, delaying at a wedding until cockcrow makes
    the fiend disappear. He then relays a dead rich peasant's order that buried money
    be distributed to the poor; the money proves inexhaustible until used to build
    a public bridge, after which a miraculously preserved child blesses the builder
    and God orders the rich peasant released from hell. Ralston then compares the
    bridge episode with another Russian story about alms, bridge-building, and a promised
    child, notes parallels with German and Bohemian tales, transitions to Russian
    ghost stories, and begins a tale in which a drunken artisan meets an old friend
    who has been dead ten years.
  language: English
  quote_policy: summarized
