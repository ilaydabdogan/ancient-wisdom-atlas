comparison_claims:
- id: claim:1
  claim: The passage itself identifies the jealous stepmother who exposes a stepdaughter
    to danger as a tale pattern known in many lands and represented by many Russian
    variants.
  claim_level: same_motif
  target: international and Russian variants of the persecuted stepdaughter tale pattern
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not name the non-Russian lands or provide details
    of those external variants.
- id: claim:2
  claim: The passage compares the Frost tale with the Vasilissa tale, in which Vasilissa
    is sent to Baba Yaga for a light, as another specimen of the same class of stepdaughter-peril
    skazkas.
  claim_level: same_motif
  target: Vasilissa sent to Baba Yaga for a light
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: Only a brief reference to the Vasilissa story is included in this passage.
- id: claim:3
  claim: The passage presents the Khudyakof Head tale as still more closely connected
    with the Frost story than the previously mentioned Vasilissa example.
  claim_level: same_motif
  target: Khudyakof variant with abandoned maiden and human Head
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The Frost story itself is only summarized in this passage, so the exact
