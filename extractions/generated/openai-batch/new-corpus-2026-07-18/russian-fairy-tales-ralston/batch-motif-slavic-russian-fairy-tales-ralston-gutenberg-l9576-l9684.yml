literal_observations:
- id: obs:1
  text: Frost is described as a mighty smith who forges strong chains to bind the
    earth and waters, explaining a frozen river as a bridge made without tools.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Moroz-Treskun, the Crackling Frost, preserves a hero ordered into a red-hot
    bath by entering and cooling it with icy breath.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator states that tales of a jealous stepmother exposing a stepdaughter
    to peril are known in many lands and have many Russian variants.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In one variant, a woman orders her husband to make away with his daughter
    from a previous marriage, and he leaves the girl in a forest hut.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The father ties a log to a tree so that the wind makes it rattle, causing
    the girl to think he is still cutting wood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A human Head comes to the hut, asks the maiden to open the door, lift it over
    the threshold, and serve dinner, and she complies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the maiden and the Head dine, the Head summons servants; the house becomes
    larger and horses, servants, and other things appear.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The maiden takes a cock with her in a carriage with the Head and has it crow
    three times; after the third crow, the Head falls to pieces and becomes golden
    coins.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the stepmother sends her own daughter into the forest, the daughter refuses
    to serve the Head, and the Head eats her while she sleeps.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In another story, a stepdaughter is sent at night to watch rye in an ovin,
    or corn-kiln, where a stranger asks her to marry him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The stepdaughter asks for wedding items one at a time until the cock crows;
    the stranger disappears, and she takes the presents away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The stepsister in the ovin asks for all desired items at once, dresses before
    the cock crows, agrees to marry the stranger, and is torn to pieces by him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The narrator identifies Vikhor, the whirlwind, as a heroine-stealer in Russian
    tales.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the Vikhor tale, a gale arises in the garden, the Vikhor-bird is in the
    gale, and Vikhor seizes the Queen and carries her off.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Queen’s three sons ask their father where their mother is and receive
    his blessing to go in search of her after learning that Vikhor carried her off.
  category: sequence
  evidence_refs:
  - ev:10
