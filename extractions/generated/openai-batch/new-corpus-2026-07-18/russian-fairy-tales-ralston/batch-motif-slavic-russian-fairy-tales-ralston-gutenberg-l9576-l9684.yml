candidate_motifs:
- id: motif:1
  label: personified frost as smith and rescuer
  taxonomy_refs: []
  basis: Frost is explicitly personified as a smith binding earth and waters, and
    as a rescuer who cools a red-hot bath for an imperiled hero.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage gives brief examples rather than a full tale context for the
    bath episode.
- id: motif:2
  label: persecuted stepdaughter sent into supernatural peril
  taxonomy_refs: []
  basis: The narrator describes a jealous stepmother exposing a stepdaughter to peril
    and provides variants in which stepdaughters are sent to the forest hut or the
    ovin at night.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  confidence: high
  cautions: The passage summarizes variants and does not provide complete tale texts.
- id: motif:3
  label: courteous or cautious girl rewarded, stepsister punished
  taxonomy_refs:
  - sacred_exchange
  basis: The abandoned maiden serves the Head and receives gold, while the stepsister
    refuses service and is eaten; in the ovin tale, the stepdaughter delays the stranger
    and keeps gifts, while the stepsister agrees too soon and is torn apart.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage presents exchange-like
    service and gift episodes but does not call them sacred.
- id: motif:4
  label: cockcrow ends or limits supernatural danger
  taxonomy_refs: []
  basis: The Head collapses after the cock crows three times; in the ovin tale, cockcrow
    causes the stranger to disappear or marks the deadline before the fatal marriage.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage does not explicitly interpret why cockcrow has this effect.
- id: motif:5
  label: dangerous supernatural suitor at night
  taxonomy_refs: []
  basis: A stranger appears at night in the ovin, asks maidens to marry him, supplies
    wedding items, and tears apart the stepsister who agrees before cockcrow.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The stranger’s identity is not specified in the passage.
- id: motif:6
  label: whirlwind abductor of queen or heroine
