canonical_text:
  quote: ''
  summary: The Eagle carries the King through visits to his kin, gives him a ship
    and two coffers with instructions not to open them until home, and the King opens
    one early on an island, releasing a vast herd. A man from the water repacks the
    cattle in exchange for what the King has at home but does not know of, which proves
    to be his newborn son. Years later the water man claims the debt; the Prince is
    left at the river mouth, reaches Baba Yaga’s forest hut, and receives instructions
    involving twelve spoonbills who become maidens, the eldest maiden’s shift, the
    Water King, and three named helpers.
  language: English
  quote_policy: summarized
