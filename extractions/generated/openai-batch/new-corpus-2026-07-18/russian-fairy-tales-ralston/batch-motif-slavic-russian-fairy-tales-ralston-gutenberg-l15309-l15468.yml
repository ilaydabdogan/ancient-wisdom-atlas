canonical_text:
  quote: "“If the devil himself would give me a bride, I'd take even her!”"
  summary: An editor introduces a Russian legend about a hasty word giving the Evil
    One power, noting its similarity to Water King bride stories. In the tale, a poor
    youth unable to obtain a wife leaves home, speaks rashly that he would accept
    a devil-given bride, and is met by an old man. The old man leads him to an underwater
    palace and offers him a choice among twelve maidens. One maiden warns that the
    old man is a fiend, tells the youth to choose her by a fly above her right eye,
    and says she was seized by fiends after her father angrily cursed her. The youth
    successfully chooses her three times.
  language: English
  quote_policy: quoted
