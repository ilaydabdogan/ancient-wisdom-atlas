canonical_text:
  quote: ''
  summary: The blind man and Katoma trap Baba Yaga, force her to reveal healing water,
    expose her first false fiery fount by testing it with a branch, then find a true
    fount that restores sight and feet. They kill Baba Yaga in the fiery fount. Katoma
    then helps recover Prince Ivan from service as a cowherd under Anna the Fair,
    confronts Anna as the man she had mutilated, and Ivan forgives her after her confession
    and oath.
  language: English
  quote_policy: summarized
