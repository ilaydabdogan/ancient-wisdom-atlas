canonical_text:
  quote: ''
  summary: The passage surveys Russian and European tales in which mortals outwit
    devils, demons, snakes, giants, or wolf-fiends. It summarizes recurring trick
    devices, then gives episodes involving Zachary the Unlucky obtaining a fiddle
    from a wolf-fiend, Vanka receiving a magic lute after helping carry turnips, and
    a moujik whose forgiving blessing after a demon steals his bread causes the demon
    to serve him and teach him to make corn-brandy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that stories about outwitting evil spirits use recurring
    devices and that characters may change while their mutual relations remain constant.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A German example has a schoolmaster deceiving the devil; a Slavonic counterpart
    has a gypsy deluding a snake; a Baltic Kashoubian counterpart substitutes a giant.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Kashoubian giant is described as so large that the thumb of his glove
    can shelter the tale's hero.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Russian tales of devils tricked by mortals are said to resemble tales current
    in many parts of Europe.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Stock devices include passing cheese or curd off as a stone, setting a hare
    against a fleet demon, setting a bear against a strong demon, threatening to throw
    a fiend's magic staff irretrievably high, and making opponents pour gold into
    a perforated hat or sack.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Zachary the Unlucky is sent by his tailor master to fetch a fiddle from a
    wolf-fiend, who requires three years of net-weaving without sleep.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Zachary repeatedly claims not to be asleep but to be thinking about numerical
    questions; the wolf-fiend leaves to investigate, allowing Zachary to sleep until
    the three years pass.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the three years pass, the wolf-fiend has to give Zachary the fiddle,
    and Zachary returns with it to the tailor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Vanka watches his father's turnip-field at night, helps a boy carry two huge
    sacks of turnips to a cottage, and is received by an old greybeard with horns.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The horned greybeard offers Vanka gold, but Vanka takes the greybeard's lute,
    whose sound has magic power over all living creatures.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: A moujik with a wife and seven children takes a single crust of bread to the
    field, then sets it aside after thinking of his children.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: A little demon steals the bread; when the moujik cannot find it, he says a
    blessing for whoever took it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The little demon reports the stolen bread and the moujik's blessing to the
