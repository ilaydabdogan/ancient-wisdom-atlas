  quote: ''
  summary: In the passage, Katoma uses iron pieces from a chopped pillar to subdue
    a dangerous magic horse intended for Prince Ivan's wedding ride. The horse obeys
    Katoma's commands and makes Ivan appear powerful before the crowd. After the marriage,
    Princess Anna tests Ivan's strength, realizes Katoma has helped him, later slanders
    Katoma during a journey, and has Katoma's feet cut off when Ivan gives him into
    her power.
