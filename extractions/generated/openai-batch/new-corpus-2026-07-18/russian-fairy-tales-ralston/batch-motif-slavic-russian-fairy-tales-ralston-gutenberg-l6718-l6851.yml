  quote: "“All this is said three times, and then the earth opens, and the girl sinks
    ‘into that world.’”"
  summary: The passage finishes a tale in which a spoken formula repeated three times
    causes the earth to open and a girl to sink into another world, then notes Russian
    and Polish variants of the sister’s escape. It next summarizes a South Russian
    story about the monster Verlioka, who kills two orphan girls and their grandmother
    before the grandfather avenges them with helpers. The passage then introduces
    the Witch or Vyed'ma as a female supernatural antagonist resembling Baba Yaga
    and begins the tale “The Witch,” in which the boy Ivashko fishes from a canoe,
    obeys his parents’ calls to shore, and avoids a witch who imitates the call in
    a hoarse voice.
  language: English
