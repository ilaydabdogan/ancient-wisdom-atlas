canonical_text:
  quote: ''
  summary: Ivan Popyalof returns for his gloves, changes into a cat, and overhears
    the Snake's wife and daughters. On the homeward road he prevents his brothers
    from using a meadow with cushions, an apple-tree, and a spring; each bleeds when
    struck with his mace and is identified as one of the Snake's daughters. The Snake's
    wife pursues him, is deceived with salt, and is finally killed in the forge of
    Kuzma and Demian when her tongue is caught through twelve doors with heated pincers,
    hammered, burned, and scattered as ashes. A commentary then summarizes a variant
    in the skazka of Ivan Buikovich, where Ivan fights six-, nine-, and twelve-headed
    Chudo-Yudo monsters; the twelve-headed monster's severed heads reattach until
    Ivan awakens his brothers, and the Chudo-Yudo wives correspond to the Snake's
    daughters.
  language: English
  quote_policy: summarized
