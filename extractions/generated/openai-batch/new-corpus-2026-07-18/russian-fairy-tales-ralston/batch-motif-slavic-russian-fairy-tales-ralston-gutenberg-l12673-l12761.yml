canonical_text:
  quote: ''
  summary: Ralston discusses Russian variants of a beanstalk or heaven-tree tale.
    In these variants a bean or pea grows from the ground or cottage to heaven, allowing
    an old man, grandfather, or moujik to climb upward. Some variants end with an
    old woman’s death, while others continue with a heavenly hut or house, abundant
    food, goat guardians with many eyes, a sleep charm, expulsion from the upper house,
    loss of the stalk, a descent by cobweb cord, a fall into a swamp, and rescue by
    a duck.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentator states that the Beanstalk myth is found among many peoples
    and mentions American and Malayo-Polynesian versions of a heaven-tree story.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentator states that European forms are usually crude and fragmentary
    and that Russian versions are generally preserved as introductions to other stories.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In one Russian version, a girl drops a bean, and the bean grows up to heaven.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the same version, the old man climbs to heaven, then tries to carry his
    wife up the beanstalk, drops her, and she is killed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the wife is killed in the first variant, the old man calls in the Fox
    as a wailer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In a Vologda variant, a pea sprouts, grows higher than the house, and produces
    peas that the old man climbs to gather.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Vologda variant, the old man’s bundle of peas falls and kills the old
    woman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In another variant, a bean sown under a table grows through the table area,
    ceiling, and roof until it reaches heaven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The grandfather climbs to heaven and finds a hut with pancake walls, white-bread
    benches, and a stove of buttered curds.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Twelve sister-goats enter the hut; they have increasing numbers of eyes from
    one to twelve.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The grandfather repeatedly uses a charm commanding eyes to sleep, but with
    the twelfth goat he charms only eleven eyes and is seen and caught by the remaining
    eye.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: In a Munchausen-style variant, a cock finds a pea, the cottager waters it,
    and the pea grows through the cottage and up to heaven.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The moujik climbs to heaven hoping to see what is there, including sugar and
    mead, and enters a large wooden house with abundant food.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: A seven-eyed goat guards the stove; the moujik charms six eyes to sleep but
    overlooks the seventh.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:15
  text: The house-master learns what happened, becomes angry, calls servants, and
    has the intruder turned out of the house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: When the moujik returns to the place of the pea-stalk, the stalk is gone;
    he makes a cord from floating cobwebs, fastens it to the edge of heaven, and begins
    to descend.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: The moujik reaches the end of the cobweb cord before reaching earth, lets
    go after crossing himself, and falls into a swamp.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: A duck builds a nest on the moujik’s head, lays an egg in it, and then pulls
    him out of the swamp when he catches its tail.
  category: sequence
  evidence_refs:
  - ev:7
