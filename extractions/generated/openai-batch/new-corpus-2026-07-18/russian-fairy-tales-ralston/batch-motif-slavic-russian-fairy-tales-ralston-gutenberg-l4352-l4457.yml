canonical_text:
  quote: ''
  summary: A comparative note surveys forbidden-chamber and prohibited-room tales
    across Russian, Oriental, German, Wallachian, Neapolitan, Estonian, Gaelic, Greek,
    Sanskrit, and Arabian Nights examples, then introduces Russian Koshchei tales
    in which the antagonist's death depends on an external object whose destruction
    causes his death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies the forbidden chamber motif with Bluebeard's chamber
    of dead wives and states that Russian and Oriental examples usually assign the
    fatal curiosity to a man, while Western European examples more often assign it
    to a woman.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several cited European variants contain different forbidden-chamber contents,
    including a view of home, the Trinity in fire and glory, the Holy Mother healing
    Christ's wounds, golden-clothed maidens on thrones, and Bluebeard-like dead wives
    and rescuers.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: In cited Gaelic versions, two daughters enter a forbidden chamber full of
    dead gentlewomen, are stained with blood, refuse milk to a cat, and are beheaded;
    a third daughter befriends the cat, has the blood licked off, and escapes detection.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In cited Greek variants, a prohibited fortieth or forty-first room contains
    items or beings such as a magic or golden horse, swan-maiden-like fairies bathing
    in a lake, a golden dog, and a maiden hung by her hair.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Kathasaritsagara example, Saktideva is warned not to ascend the central
    terrace, does so, finds chambers containing lifeless fair maidens, is kicked by
    a horse into water, and comes up in his native land.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Hitopadesa example, Kandarpaketu disobeys the command of his semi-divine
    queen by touching a picture of a Vidyadhari, and the pictured demigoddess kicks
    him back to his own country.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage cites Cox and de Gubernatis as sources for an explanation of the
    myth said to lie at the root of these stories.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage introduces Koshchei the Deathless tales in which his death is
    brought about by destroying an extraneous object on which his existence depends;
    the incident is described as prominent in stories of this class across Europe
    and Asia.
  category: relationship
  evidence_refs:
  - ev:7
