canonical_text:
  quote: ''
  summary: The passage recounts Princess Anna the Fair leaving the footless Katoma
    on a stump and taking Prince Ivan back to her kingdom as a cowherd. Katoma is
    freed when a blind forest hero collides with and uproots the stump. The blind
    hero and Katoma discover they were both harmed by Princess Anna, agree to live
    together, and form a partnership in which the blind man supplies feet and Katoma
    supplies sight. They abduct a charitable merchant's daughter, make her their adopted
    sister and housekeeper, and later learn that a Baba Yaga has been visiting the
    hut in their absence and draining her strength by sucking her breasts. The heroes
    plan to remain home and trap the Baba Yaga.
  language: English
