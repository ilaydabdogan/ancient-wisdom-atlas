canonical_text:
  quote: ''
  summary: The passage concludes a tale in which Marko the Rich borrows a copeck from
    a poor moujik, repeatedly evades repayment, and feigns death to avoid the debt.
    The moujik treats the false corpse as real, scalds it with boiling water, has
    it taken to a church, and later uses it to frighten robbers away from their booty.
    Marko and the moujik divide the abandoned money, but Marko still refuses to repay
    the copeck. The passage then introduces the Russian simpleton or durak tale type
    and begins “The Fool and the Birch-Tree,” in which a foolish third son inherits
    only a skinny ox and mistakes the creaking of a birch tree for bargaining over
    the ox.
  language: English
  quote_policy: summarized
