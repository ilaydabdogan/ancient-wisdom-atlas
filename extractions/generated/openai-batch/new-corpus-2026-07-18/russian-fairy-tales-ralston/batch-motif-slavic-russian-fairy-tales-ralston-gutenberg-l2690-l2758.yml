canonical_text:
  quote: ''
  summary: A seigneur forces the Smith to make him young after hearing that the Smith's
    journeyman made the lady young. The Smith imitates the reported method by putting
    the seigneur in a furnace and then into milk, but only charred bones remain. The
    lady orders the Smith taken to the gallows. The journeyman, identified as the
    Demon, offers to restore the seigneur alive and young if the Smith swears never
    again to strike him and to treat him respectfully. The Smith swears, the seigneur
    is brought back alive and young, the Smith is released, and the journeyman disappears.
  language: English
  quote_policy: summarized
