  quote: ''
  summary: The passage recounts a corpse's instructions for reviving two dead youths
    with smoke from a shroud fragment and live coals; the later exposure and staking
    of the corpse; a narrative comment about animated corpses or vampires near cross-roads
    and cemeteries; the tale of a soldier pursued by one corpse into a chapel where
    two corpses quarrel over eating him until cock-crow; and the tale of a hunter
    whose dog fights a shrouded floating corpse until cock-crow, then attacks its
    master for abandoning it.
  language: English
  quote_policy: summarized
