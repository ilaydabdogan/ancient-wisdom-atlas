canonical_text:
  quote: ''
  summary: A fool summoned to the king uses the formula "By the Pike's command" to
    make a stove carry him, to bring a tarred tub ashore after he and the king's daughter
    are cast into the sea, and to create a marble palace. The king later pardons them.
    The passage then gives comparative notes on pikes in northern, Scandinavian, Lithuanian,
    and Finnish contexts, introduces Russian tales of witchcraft and vampires, and
    begins "The Witch Girl," in which a Cossack keeps watch in a doomed cottage and
    cuts off the arm of a white-clad witch at midnight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king's runners come for the fool and tell him the king will give him red
    boots, a red caftan, and a red shirt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fool, while seated on the stove, invokes the Pike's command and asks the
    stove to go to the king; the stove goes and brings him there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king plans to put the fool to death, but the king's daughter likes the
    fool and begs her father to marry her to him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king angrily has the daughter and the fool married, then orders them placed
    in a tarred tub and thrown into the water.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The tub floats on the sea for a long time; after the wife asks for help, the
    fool invokes the Pike's command to have the tub cast ashore and torn open.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The wife asks the fool to build a house; he invokes the Pike's command, and
    a marble palace is instantly built opposite the king's palace.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The king sees the new palace, learns his daughter lives there, summons her
    and her husband, pardons them, and they live together prosperously.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The commentary states that Afanasief regarded the pike as a fish of great
    repute in northern mythology and cites an old Russian Christmas song about a richly
    adorned pike.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The commentary connects the Russian fish with a Scandinavian pike form of
    Andvari, a Lithuanian monstrous pike named Strukis, and a gigantic pike in the
    Kalevala.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The author turns from pike stories to tales of magic powers wielded by modern
    dealers in the Black Art, saying Russia is rich in stories of witches, wizards,
    turnskins, and vampires.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The commentary describes the witch or wizard in the following group as a human
    being who has compacted with evil spirits, gained strange powers, terrified the
    district, and after burial may become a vampire.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: In "The Witch Girl," a Cossack rides into a village late in the evening, stops
    at the last cottage, and asks to spend the night there.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The cottage household is sobbing, crying, praying, and putting on clean shirts
    because they believe Death visits cottages at night and kills all inside; they
    say it is their turn that night.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:14
  text: At midnight, a white-clad witch appears at the window with a sprinkler; the
    Cossack cuts off her arm with his sabre, and she flees howling.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: After severing the witch's arm, the Cossack hides the arm under his cloak,
    washes away the bloodstains, and lies down to sleep.
  category: sequence
  evidence_refs:
  - ev:14
