canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a wife falls into a bottomless pit,
    a peasant releases a demon from the pit, and the peasant profits by curing demonic
    possessions before tricking the demon back into the pit by invoking fear of the
    Bad Wife. It then presents and comments on the tale of the Golovikha, in which
    a woman elected as village head abuses office, hides from a tax-enforcing Cossack,
    is beaten while concealed in a sack, and renounces the office. The passage closes
    with an authorial transition to a tale about a good and wise wife, noting a claimed
    relation to Whittington and his Cat and to a Buddhist source.
  language: English
  quote_policy: summarized
