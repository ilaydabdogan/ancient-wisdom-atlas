canonical_text:
  quote: ''
  summary: A note outlines an Indian Panchatantra tale of a blind husband, a hunchback
    companion, an adulterous wife, a snake-broth poisoning plot that restores sight,
    and a violent blow that changes bodily deformities. The passage then summarizes
    a Russian variant in which Nikita Koltoma helps a king obtain Helena the Fair,
    receives a Cap of Invisibility from a rescued old man, defeats Helena’s forces
    and fiery-arrow trap, substitutes himself for the king during Helena’s crushing
    bridal strength tests, is later mutilated in revenge, and is ultimately restored
    along with his blinded brother by healing and vivifying waters obtained from Baba
    Yaga.
  language: English
  quote_policy: summarized
