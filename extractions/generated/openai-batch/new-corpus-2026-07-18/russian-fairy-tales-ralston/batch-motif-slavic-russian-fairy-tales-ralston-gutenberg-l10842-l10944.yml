comparison_claims:
- id: claim:1
  claim: The passage explicitly proposes that the Panchatantra story may be compared
    with the part of the Russian Skazka concerning a blind man and a cripple in the
    forest.
  claim_level: same_motif
  target: Panchatantra v. 12 tale of blind man and hunchback compared with Russian
    Skazka episode of blind man and cripple
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage says the comparison is offered in default of other parallels
    and gives only an outline of the Panchatantra story.
- id: claim:2
  claim: The passage reports Benfey’s connection of the Panchatantra story with Buddhist
    legends.
  claim_level: historical_contact
  target: Buddhist legends connected by Benfey with the Panchatantra story
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: low
  limitations: The passage only reports Benfey’s connection and does not summarize
    the Buddhist legends or provide independent evidence for contact.
- id: claim:3
  claim: The passage states that the story also occurs in the Tuti-Nameh, but notes
    that the replacement of the hunchback by a comely youth weakens similarity with
    the Russian story.
  claim_level: same_motif
  target: Tuti-Nameh version of the blind husband / wife’s lover story
  evidence_refs:
  - ev:4
  counter_evidence_refs:
  - ev:4
  confidence: medium
  limitations: The passage itself says the similarity with the Russian story disappears
    in the Tuti-Nameh form because the hunchback is replaced.
- id: claim:4
  claim: The passage compares Helena’s discovery of the bridal-chamber trick and revenge
    to Brynhild.
  claim_level: same_function
  target: Brynhild pattern of discovering a trick and seeking revenge
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: low
  limitations: The passage gives only the phrase 'like Brynhild' and does not elaborate
    the Brynhild narrative details.
