canonical_text:
  quote: ''
  summary: A soldier keeps watch with a merchant's dead daughter. At midnight she
    emerges from the coffin as a witch with devils. The soldier hides on the stove-pipe
    under a frying-pan and uses the sign of the cross, but the devils try to burn
    him with unblessed fire until cockcrow ends the attack. The merchant then asks
    him to carry the coffin to the graveyard. An elder advises him how to survive
    when the three iron hoops snap. During the funeral drive the soldier escapes by
    jumping through the horse's wooden arch and running backwards; the witch follows
    the misleading tracks until cockcrow. The soldier buries her, and the merchant
    marvels at his knowledge.
  language: English
  quote_policy: summarized
