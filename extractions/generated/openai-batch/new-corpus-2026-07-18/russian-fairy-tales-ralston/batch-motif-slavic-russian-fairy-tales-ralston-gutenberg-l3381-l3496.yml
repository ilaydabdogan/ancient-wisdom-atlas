canonical_text:
  quote: ''
  summary: Prince Ivan prepares a long rope, descends beneath the earth into the other
    world, visits three sisters in copper, silver, and golden palaces, receives aid
    against the beast Norka, kills Norka at the blue sea, returns with the sisters
    and their palaces transformed into eggs, is betrayed by his brothers during the
    attempted ascent, and later shelters nestlings during a storm, prompting their
    giant mother bird to offer him a reward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Prince asks his father to have a leather rope made long enough to reach
    the other world, and the father orders it made.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Prince, his brothers, servants, and provisions go to the place where the
    Beast disappeared beneath a stone and build a palace there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brothers cannot move the large stone, but the youngest brother moves it
    away as soon as he touches it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The youngest brother asks who will go into the other world to overcome the
    Norka; when the others do not offer, he has them lower him by the rope.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After reaching the other world underneath the earth, Prince Ivan encounters
    a richly trapped horse that says it has long awaited him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In a copper palace, a beautiful lady offers to classify the unknown visitor
    by age and sex as kin or husband; when she sees Prince Ivan, she calls him her
    dear husband.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The lady in the copper palace says the beast he seeks is her brother, that
    he is with her second sister, and that she bound three of his wounds.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The second sister in the silver palace tells Prince Ivan that Norka is with
    the youngest sister.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The youngest sister in the golden palace says Norka is asleep on the blue
    sea and gives Prince Ivan a steel sword and a draught of the Water of Strength,
    instructing him to cut off Norka's head in one stroke.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Norka sleeps on a stone in the middle of the blue sea; its snoring agitates
    the water for seven versts around, and Prince Ivan beheads it with the sword.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After Norka is killed, Prince Ivan returns with the three sisters, who each
    turn her palace into an egg, teach him how to reverse the transformation, and
    give the eggs to him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Prince Ivan fastens the maidens to the rope; his brothers haul them up, then
    conspire to lower the rope again, pull him partway up, and cut it so they can
    keep the maidens as wives.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Prince Ivan guesses the brothers' plan, ties the rope to a stone, and the
    brothers hoist the stone high before cutting the rope; the stone falls and breaks,
    and the Prince goes away weeping.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: During a storm, Prince Ivan shelters drenched young birds under his coat beneath
    a tree; their giant mother bird arrives, sees what he has done, thanks him, and
    offers to do anything he asks.
  category: action
  evidence_refs:
  - ev:10
