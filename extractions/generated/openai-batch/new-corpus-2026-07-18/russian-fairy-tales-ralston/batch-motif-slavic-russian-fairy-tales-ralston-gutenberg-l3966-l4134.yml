canonical_text:
  quote: ''
  summary: Prince Ivan leaves a silver snuff-box with the Raven, reunites with Marya
    Morevna, and repeatedly flees with her from Koshchei the Deathless. Koshchei's
    speaking horse detects the escapes; Koshchei twice recaptures Marya and finally
    dismembers Prince Ivan, seals the pieces in a barrel, and casts it into the sea.
    The blackening of the silver alerts Ivan's avian brothers-in-law, who recover
    and revive him with the Waters of Death and Life. Ivan then learns from Marya
    how Koshchei obtained his steed from Baba Yaga beyond a fiery river, receives
    a bridge-making handkerchief, crosses the river, and encounters hungry temptations
    involving animals and bees on the way to Baba Yaga.
  language: English
  quote_policy: summarized
