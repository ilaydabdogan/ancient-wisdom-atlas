  summary: A sequence of editorial footnotes gives source references, variant notes,
    brief plot summaries, lexical explanations, and comparative remarks for Russian
    folk-tale material, including demon/plague variants, Servian and Indian analogues,
    a wise-wife comparison, animal/insect beast-epos material, and a chort/devil/blacksmith/St.
    Nicholas comparison.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note says the story is known to the Finns, where the Russian chortenok,
    described as a little chort or devil, has become the Plague.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note says that in the original Indian story a demon had formerly lived
    in a Brahman's house but was frightened away by the Brahman's cantankerous wife.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Servian version is said to begin with the 'Scissors-story,' in which a
    vixen falls into an unseen hole while intent on contradicting her husband.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One cited Afanasief story is said to continue only a little further, with
    a conclusion the same as that of 'The Wise Wife,' described as a tale of magic;
    a Servian version is also cited.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The phrase literally glossed as 'has bid to live long' is identified as a
    conventional euphemism for 'has died,' sometimes followed by 'Remember what his
    name was.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The note contrasts a miser who endures pain with a scalded demon who was unable
    to bear it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: In one variant, a clerical figure or priest appears and claims a share of
    spoil; the Simpleton then uses his hatchet.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: Russian peasants are said often to nickname priests goats, perhaps because
    of their long beards.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The mizgir is glossed as a venomous spider like a tarantula, found in the
    Kirghiz Steppes.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:10
  text: In another story with the same title, the spider waits for prey on its back;
    a widow wasp falls into the trap; the spider beheads her; gnats and flies assemble,
    hold a funeral service, and carry the remains to Komarovo.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:11
  text: The chort in the legend is described as akin to the devil; traditions are
    said to connect the devil with blacksmiths; the chort's prototype is described
    as probably a demigod or demon; St. Nicholas plays the same part in another legend.
  category: relationship
  evidence_refs:
  - ev:12
