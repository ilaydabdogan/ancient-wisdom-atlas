canonical_text:
  quote: ''
  summary: A poor peasant asks his rich brother for help, works for him, and receives
    only a loaf. Invited with his wife to the rich brother's name-day feast, he is
    ignored while other guests eat and drink. On the way home he sings to conceal
    his humiliation, and an unseen voice named Woe joins him and promises never to
    leave. Woe then urges him into the pot-house, where he progressively drinks away
    his possessions; when nothing remains, Woe tells him to borrow a cart and oxen
    from a neighbor.
  language: English
  quote_policy: summarized
