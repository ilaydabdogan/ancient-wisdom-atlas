canonical_text:
  quote: ''
  summary: 'The Prince, after leaving the Yaga, encounters twelve spoonbill-maidens
    at the seashore and steals the shift of the eldest, Vasilissa the Wise. After
    he returns it, she promises help. At the Water King''s house, the Prince is given
    dangerous tasks: building a crystal bridge, planting a full garden overnight,
    identifying Vasilissa among twelve identical daughters, consuming a vast feast
    and drink, and surviving a red-hot iron bath. Vasilissa and three companions,
    Obedalo, Opivalo, and Moroz Treskum, enable him to complete the tasks, marry Vasilissa,
    bathe safely, and go home.'
  language: English
  quote_policy: summarized
