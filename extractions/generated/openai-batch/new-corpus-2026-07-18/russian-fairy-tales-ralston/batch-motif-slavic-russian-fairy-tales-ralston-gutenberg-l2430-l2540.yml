  summary: The passage surveys simpleton-tales, especially variants involving foolish
    grief over imagined future grandchildren and the Russian figure Lutonya seeking
    people more foolish than his family. It lists several absurd actions encountered
    by Lutonya, then introduces the animal story “The Mizgir,” in which a Spider sets
    snares for biting insects, releases a pleading Gadfly, and later spreads a false
    report of his own death so that gnats and flies emerge and are caught.
