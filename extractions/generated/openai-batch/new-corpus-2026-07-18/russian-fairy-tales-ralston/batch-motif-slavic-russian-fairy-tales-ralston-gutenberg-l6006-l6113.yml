canonical_text:
  quote: ''
  summary: The escaped girl is protected by beings and objects she had treated kindly.
    Baba Yaga pursues her in a mortar with pestle and broom. The girl throws down
    a towel that becomes a river and a comb that becomes a dense forest, blocking
    pursuit. She returns home, tells her father, and the stepmother is punished. Ralston
    then notes variants and compares the magic comb, towel, brush, and related obstacle-producing
    objects with analogous items in other folk-tale traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After discovering the girl gone, Baba Yaga beats and abuses the Cat; the Cat
    says Baba Yaga never gave it a bone, while the girl gave it bacon.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dogs, doors, birch-tree, and servant-maid each say Baba Yaga neglected
    them, while the girl gave them rolls, oil, a ribbon, or a handkerchief.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Baba Yaga jumps into her mortar, flies with the pestle, sweeps away traces
    with a broom, and pursues the girl.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The girl listens to the ground, throws down a towel, and the towel becomes
    a wide river.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Baba Yaga fetches oxen, and the oxen drink up the river before Baba Yaga resumes
    the pursuit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The girl again listens to the ground, throws down a comb, and a thick forest
    springs up; Baba Yaga gnaws at it but cannot get through and goes back.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The girl returns home and tells her father that her mother sent her to Baba
    Yaga, who wanted to eat her; after hearing the account, the father shoots his
    wife and lives prosperously with his daughter.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A variant sends the heroine to Baba Yaga by her husband’s mother; advice comes
    from her husband, and the girl escapes after spitting under the threshold on the
    Cat’s advice.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the variant, the spittle answers for the girl in her absence, and the passage
