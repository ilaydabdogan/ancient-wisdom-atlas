canonical_text:
  quote: ''
  summary: 'The passage concludes a tale in which Frost addresses abandoned girls
    in a tree-side winter setting; their abusive replies are followed by their freezing
    death and return home as corpses. A Kursk variant is summarized: a praying stepdaughter
    greets Frost humbly and receives warm clothing, rich garments, and a dowry chest,
    while the stepmother’s daughter later fails to speak wisely and is killed by Frost.
    The note then describes Moroz/Frost as a living personage in Russian peasant belief,
    with Christmas Eve food offerings and petitions to spare crops, parallel Tcheremiss
    fear of angering Frost, and other tales in which Frost has an ice cottage, gives
    magic objects, or appears alongside Sun and Wind.'
  language: English
  quote_policy: summarized
