candidate_motifs:
- id: motif:1
  label: personified Frost tests human speech and conduct
  taxonomy_refs:
  - wisdom
  basis: Frost addresses abandoned girls; insulting replies precede death, while the
    stepdaughter’s humble and wise words in the variant please Frost and bring rewards.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The taxonomy reference to wisdom is based on the explicit phrase “wise
    words” in the variant; the main passage itself frames the contrast through speech
    and behavior rather than abstract doctrine.
- id: motif:2
  label: cold-weather being rewards the humble and punishes the rude
  taxonomy_refs:
  - divine_judgment
  basis: Frost rewards the praying, welcoming stepdaughter and kills the insulting
    or wordless daughters.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:8
  - ev:10
  confidence: medium
  cautions: The passage calls Frost a living personage but does not explicitly call
    him divine; the taxonomy reference is functional and should be reviewed.
- id: motif:3
  label: abandoned stepdaughter gains marriage wealth from supernatural encounter
  taxonomy_refs: []
  basis: In the Kursk variant, the stepdaughter is left in the open plain, receives
    splendid garments and a dowry chest from Frost, and is announced by the dog in
    bridal terms.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage summarizes a variant rather than narrating a full independent
    tale.
- id: motif:4
  label: animal announces hidden or approaching fate
  taxonomy_refs: []
  basis: The dog under the table repeatedly barks reports about the stepdaughter’s
    bridal glory and the stepmother’s daughter’s death despite being fed and ordered
    to change its words.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage does not explain whether the dog is magical or merely formulaic.
- id: motif:5
  label: food offering to personified Frost for crop protection
  taxonomy_refs:
  - sacred_exchange
  basis: The Christmas Eve practice offers kissel to Frost and petitions him not to
    kill oats and to drive flax and hemp deep into the ground.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The passage describes folk custom, not a tale episode; “sacred_exchange”
    is a cautious functional match.
- id: motif:6
  label: quest to Frost’s wintry dwelling for compensation or gifts
  taxonomy_refs:
  - mystical_quest
  basis: A peasant seeks Frost after crop damage, travels through a forest path, reaches
    an ice cottage, and receives magic objects from Frost.
  evidence_refs:
  - ev:15
  confidence: medium
  cautions: The summarized tale is brief, and the path to Frost is practical compensation-seeking
    as much as a quest.
- id: motif:7
  label: weather powers contend over human safety
  taxonomy_refs:
  - duality
  basis: Sun threatens burning, Frost threatens freezing, and Wind offers to temper
    both heat and cold for the peasant.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The motif involves three powers rather than a simple dual opposition;
    the taxonomy reference captures the opposed heat/cold functions only partially.
