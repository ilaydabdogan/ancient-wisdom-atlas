canonical_text:
  quote: ''
  summary: 'A set of Russian Christianized folk legends: St. George rescues a royal
    maiden from a lake monster and converts Troyan; St. Nicholas helps a peasant where
    St. Kasian refuses and receives more frequent thanksgiving; St. Nicholas is invoked
    through an image as surety, later aids a merchant in disenchanting a dangerous
    princess; and the beginning of a tale describes a poor priest striking Nicholas''s
    picture and meeting an unknown companion.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the Lord takes pity, a deep lake appears near the city, and the inhabitants
    go there for water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lake is guarded by a terrible monster that daily devours a maiden given
    by the inhabitants in exchange for permission to use the lake.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After three years, the lot falls on the king's daughter, who is exposed on
    the shore of the lake.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: St. George arrives to save the exposed princess; while he sleeps with his
    head on her knees, her tears wake him, and he kills the monster before converting
    the inhabitants of Troyan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A peasant's cart sticks in the mire; St. Kasian refuses to help, while St.
    Nicholas stops and assists him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In heaven, the Lord questions Kasian and Nicholas and decrees that Kasian
    will receive thanksgiving only once every four years, while Nicholas will receive
    it twice each year.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A poor man borrows twenty roubles from a rich man, naming a picture of St.
    Nicholas as surety, but he cannot repay at the appointed time.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The rich man tears down the picture of St. Nicholas, puts it on a cart, flogs
    it, and demands payment; a young merchant pays the debt, ransoms the picture,
    honors it, and keeps a lamp before it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: An old man becomes the merchant's manager, after which the merchant prospers;
    the narrator later identifies this old man as St. Nicholas.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: An evil witch enchants a king's daughter, who lies dead by day but rises at
    night and eats people; she is placed in a coffin in a church, and the merchant
    succeeds in disenchanting her with his manager's instructions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The narrator states that the legend titled 'The Priest with the Greedy Eyes'
    closely resembles the story of 'The Smith and the Demon' in some incidents.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: A priest of St. Nicholas, reduced to having nothing for board or lodging,
    strikes Nicholas's picture with church keys, leaves his parish, and encounters
    an unknown man who asks to travel with him.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
