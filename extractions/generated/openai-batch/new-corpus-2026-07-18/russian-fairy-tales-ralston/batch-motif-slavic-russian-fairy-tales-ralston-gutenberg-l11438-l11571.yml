canonical_text:
  quote: ''
  summary: 'The passage concludes a tale in which a Cossack exposes a witch or Death
    figure by finding an ill girl whose arm has been cut off, after which the commune
    orders her drowned. The editor then compares similar arm-cutting episodes from
    Polish and Indian stories. A new tale begins: a priest''s son sees an enchantress-princess
    remove, wash, comb, and replace her head. After he tells others, she dies and
    requires him to read the psalter over her for three nights. An old woman gives
    him protective instructions involving a knife-drawn circle. On the first night,
    the dead princess rises from her coffin, attacks him, cannot cross the circle,
    conjures horrors, and returns to the coffin at daybreak. The second night is similar;
    the old woman then gives him a hammer and four nails for the coffin.'
  language: English
  quote_policy: summarized
