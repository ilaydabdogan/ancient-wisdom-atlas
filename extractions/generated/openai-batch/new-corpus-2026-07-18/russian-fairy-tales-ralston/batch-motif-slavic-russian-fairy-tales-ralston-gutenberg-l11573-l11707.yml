canonical_text:
  quote: ''
  summary: The passage closes a church-night episode in which a princess rises from
    her coffin, conjures apparent fire, and is later disposed of with an aspen stake.
    It then introduces and begins “The Soldier's Midnight Watch,” where a returning
    soldier meets a merchant's daughter identified by his grandfather as a witch.
    The grandfather gives him a bridle, an aspen cudgel, and a spoken counter-formula.
    At midnight the soldier speaks first, the witch becomes a mare, and he rides and
    beats her to death before returning by daybreak.
  language: English
  quote_policy: summarized
