canonical_text:
  quote: ''
  summary: A prince is carried by a bird between worlds in a provisioned divided enclosure,
    enters service in disguise, uses magical eggs to recover other-world robes for
    princesses, is recognized by rings while among beggars, exposes his brothers,
    and three weddings follow. An editorial note adds variant-ending and comparative
    tale references.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bird asks for a large zasyek with a partition, with game placed in one
    half and water poured into the other for meat and drink.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bird carries the zasyek on her back with the Prince sitting in the middle
