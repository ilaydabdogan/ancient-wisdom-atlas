- id: obs:3
  text: After the journey, the Prince enters the service of a tailor while so altered
    in appearance that no one would suspect him of being a prince.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tailor says two princes have brought brides from the other world and want
    to marry them, but the brides refuse until exact other-world wedding clothes are
    made without measurements.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Prince tells the tailor to undertake the royal commission and says he
    will answer for everything.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: At midnight the Prince goes into the fields, turns eggs given by the maidens
    into three palaces, enters them, takes the maidens' robes, and turns the palaces
