canonical_text:
  quote: ''
  summary: The preface dedicates the book to Alexander Afanasief and explains Ralston's
    source collections, limited use of South-Russian materials, avoidance of most
    Russian chap-book tales, awareness of foreign adaptations and parallels, reference
    to contemporary scholarship on Russian popular tales, and deferral of chapters
    on animal tales, historical tales, epic-poem heroes, and mythological interpretation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The book is dedicated to Alexander Afanasief.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stories in the volume are drawn from collections published by Afanasief,
    Khudyakof, Erlenvein, and Chudinsky; the South-Russian collections of Kulish and
    Rudchenko were used only little because the author lacked a complete dictionary
    of their language or dialect.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Afanasief's work is described as the most important source, with nearly 3,000
    pages, 332 distinct stories, several variants, a separate volume of 33 legends,
    and additional stories in a work on Old Slavonian views of nature.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The preface explains that lub or lubok refers to soft bark of the lime tree
    once used instead of paper, and that lubochnuiya came to denote cheap-press productions
    even after paper replaced bark.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The preserved chap-book stories are said to have interest but not to be fair
    illustrations of Russian folklore, because compilers often borrowed from eastern
    or western sources and adapted the material to Russian forms of thought and speech.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Russian stories of Eruslan Lazarevich and Bova Korolevich are presented
    as likely adaptations rather than original creations of the Slavonic mind.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: German versions and periodical accounts or translations of Russian popular
    tales are mentioned, including a German version introduced by Jacob Grimm and
    later scholarship by Angelo de Gubernatis.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: De Gubernatis is said to have summarized much of the Afanasief and Erlenvein
    material and described the role of animals so fully that Ralston omitted a prepared
    chapter on the Russian Beast-Epos.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ralston says he suppressed a chapter on the origin and meaning of Russian
    folk-tales, leaving most quoted stories to speak for themselves except where giving
    chief parallels from foreign folk-tale collections.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The preface refers readers interested in the esoteric meaning of skazkas and
    the solar theory of myth-explanation to De Gubernatis and Cox.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ralston says he has also left aside skazkas about animals, historical events,
    and heroes of Russian epic poems or metrical romances, reserving the bylina-related
    material for a later volume.
  category: sequence
  evidence_refs:
  - ev:8
