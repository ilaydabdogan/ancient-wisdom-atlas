canonical_text:
  quote: ''
  summary: Prince Ivan's youngest sister Anna marries the Raven, a bird who becomes
    a youth. Ivan later sets out to find his sisters, meets the warrior Princess Marya
    Morevna, marries her, violates her prohibition against looking into a closet,
    and releases the chained Koshchei the Deathless by giving him water. Koshchei
    breaks his chains, carries off Marya Morevna, and Ivan begins searching for her,
    visiting his sisters and their bird-form husbands at palaces marked by oaks.
  language: English
  quote_policy: summarized
