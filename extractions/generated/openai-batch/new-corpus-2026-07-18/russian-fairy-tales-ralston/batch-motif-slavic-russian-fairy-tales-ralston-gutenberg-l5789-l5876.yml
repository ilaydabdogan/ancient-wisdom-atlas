canonical_text:
  quote: ''
  summary: The passage surveys several tales and variants in which a father or traveler
    makes a rash promise to a supernatural being, often near water, resulting in a
    child or unknown-at-home object being claimed. It describes the King-Bear's abduction
    of boy-and-girl twins, their failed animal-assisted escapes and eventual rescue
    by a bull-calf; variants involving a Water Chudo, an underwater Idol, devils,
    a swan-maiden, and a hunter's son; and comparative Indian examples of cobra or
    Rakshasa-haunted waters and Buddha as a monkey preserving other monkeys from a
    demon in a tank.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunting king becomes thirsty at a spring and is seized by the beard by the
    Tsar-Medved, a King-Bear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king promises as ransom what he does not know of at home, which proves
    to be boy-and-girl twins born during his absence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The twins are hidden underground, but the King-Bear finds the hiding place,
    digs them up, and carries them to a distant region where no man lives.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The twins twice attempt escape on helpful birds, first a falcon and then an
    eagle, but the King-Bear defeats both attempts and takes them to inaccessible
    mountains.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A bull-calf rescues the twins; afterward it tells the young prince to cut
    its throat and burn its carcass, and from its ashes come a horse, a dog, and an
    apple-tree.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In a Water King variant, the beard-seizer is called Chudo Morskoe, a Water
    Chudo, and a prince must surrender himself because of his father's promise.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The surrendered prince finds a stolen enchantress in the Water Chudo's palace;
    she turns herself into a ring, accompanies him, and later becomes his bride.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In another story, a merchant loses a magic snuff-box in a river; it is found
    on the knees of an Idol beneath the waters, and the Idol returns it in exchange
    for what the merchant does not know of at home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Some variants give Christianized names to the supernatural actors, including
    a devil's imp, Adovna daughter of Ad or Hades, and a man identified as a devil.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: A hunter who warms himself at a devil-guarded fire makes the usual promise,
    loses a son, dies, is denied priestly burial, is placed in a hole at a crossway,
    and is turned by the same devil into a horse until his son releases him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the Hindoo story of Brave Seventee Bai, the heroine kills a large Cobra
    from a lake, uses a magic diamond from the snake to make the waters roll back,
    and enters a splendid garden where she finds the Cobra's daughter.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that demon-haunted waters are common in oriental fiction
    and gives examples of a Rakshasa lake devouring a king's escort and Buddha as
    a monkey saving other monkeys by having them drink through hollow reeds.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
