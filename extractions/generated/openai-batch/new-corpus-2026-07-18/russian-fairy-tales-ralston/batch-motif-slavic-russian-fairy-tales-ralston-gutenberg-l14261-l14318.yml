canonical_text:
  quote: Sometimes the sacred visitor rewards with temporal goods the kindly host
    who has hospitably received him.
  summary: A poor man, unable to prepare beer for a Church feast or obtain credit
    from a rich neighbor, prays before the sacred image in his cottage. An old man
    is lodged as a guest and instructs him to borrow malt and put it into his well.
    The next morning the well yields extraordinary beer, which the neighbors drink
    with rejoicing. The rich neighbor imitates the act with his own malt but obtains
    only malt and water. The passage then introduces peasant legends about saints
    and explains that the Slavonic thunder-god Perun was functionally compared with
    Donar or Thor, and that after Christianization attributes formerly associated
    with Perun became attached to the Prophet Ilya or Elijah.
  language: English
  quote_policy: quoted
