canonical_text:
  quote: ''
  summary: 'Marusia is repeatedly questioned by the Evil One or Fiend about whether
    she was in the church and saw what he was doing; after each denial he foretells
    a death, first her father, then her mother, then Marusia herself. Her blind grandmother
    tells her to arrange an unusual burial: her body is to be passed under the threshold
    and buried at a four-road crossway. Marusia dies, is buried as instructed, and
    a wondrous flower grows on her grave. A young seigneur has the flower transplanted
    to his home, where it transforms at night into a beautiful maiden and then back
    into a flower. He catches her, seeks to marry her, and Marusia agrees on condition
    that she not go to church for four years.'
  language: English
  quote_policy: summarized
