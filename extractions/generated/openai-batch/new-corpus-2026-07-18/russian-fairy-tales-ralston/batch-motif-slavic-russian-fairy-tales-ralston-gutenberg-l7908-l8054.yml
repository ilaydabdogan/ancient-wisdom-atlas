canonical_text:
  quote: ''
  summary: The passage introduces Likho as a personification of evil in Russian fairy
    tales, presents the tale “One-Eyed Likho,” and then summarizes a Little-Russian
    variant. In the main tale, a smith and tailor set out to find evil, encounter
    a one-eyed female Likho in a forest cottage, and the tailor is eaten. The smith
    blinds Likho’s remaining eye, escapes disguised among sheep, later loses a hand
    to a golden-handled hatchet in a tree, and returns home as proof that he has seen
    Likho. The variant has a seeker of evil entering an iron castle, finding a blind
    giant Likho with Woes and Care, fleeing, and losing a right hand to an iron door.
  language: English
  quote_policy: summarized
