canonical_text:
  quote: ''
  summary: A stepmother orders an old man to take Marfa into the forest and leave
    her under a pine as a bride for Morozko, or Frost. Frost questions the freezing
    girl, who answers respectfully, and he rewards her with warmth and gifts. Seeing
    this, the stepmother sends her own two daughters to the same pine for the same
    bridegroom; they quarrel and complain of the cold as Frost approaches.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old woman tells the old man to drive Marfa to Morozko, identified parenthetically
    as Frost, by turning into the forest to a big pine on a hill.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman describes the intended bridegroom as rich, associating his possessions
    with firs, pine-tops, and birches in snowy covering, and calls him a bogatir.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old man takes Marfa by sledge into the forest, leaves her basket under
    the tall pine, tells her to await the bridegroom, and drives home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Marfa sits in the cold, shivering and losing strength, while Frost cracks,
    snaps his fingers, leaps from fir to fir, and appears on the pine above her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Frost repeatedly asks Marfa whether she is warm, and she repeatedly answers
