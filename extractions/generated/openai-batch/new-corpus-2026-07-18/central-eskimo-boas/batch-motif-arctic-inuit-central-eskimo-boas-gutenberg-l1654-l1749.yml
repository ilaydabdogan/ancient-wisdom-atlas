canonical_text:
  quote: ''
  summary: Boas describes limited intertribal travel and knowledge around Fox Basin,
    Iglulik, and adjacent regions; Talirpingmiut routes between Cumberland Sound,
    Nettilling Fjord, and Lake Nettilling; dangers from rapids, tides, tide holes,
    and ice; a remembered boating disaster at Sarbaqdualung in which one woman survived
    on deerskins; and a seasonal round of sealing, inland travel, deer, birds, salmon,
    freezing, and winter return by sledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Regular intercourse between tribes along the shore of Fox Basin is described
    as never having existed, and Oqomiut knowledge of the Iglulik region is described
    as indefinite.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old man is reported as the only person found who knew Iglulik by name,
    remembered Ingnirn and Piling, and mentioned Augpalugtijung as another inhabited
    region beyond Iglulik.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Talirpingmiut are said not to have traveled over the country south of
    Koukdjuaq, and no hunting excursion in that direction is reported.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A part of the Talirpingmiut stayed in Cumberland Sound until the ice was gone
    and left in the latter half of July.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Passage through fjord rapids was dangerous because whirlpools and overfalls
    could capsize bulky boats; tide changes had to be considered, and men often carried
    kayaks over passes to avoid danger.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A tradition recounts that a stubborn boat owner ignored friends' warnings,
    tried to pass Sarbaqdualung during a swift spring tide, and the boat upset.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Sarbaqdualung disaster, the crew drowned except for one woman who was
    saved on a bundle of deerskins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: From Kangia, boats were carried over several portages, rapids at Angmartung
    were avoided, Lake Nettilling was reached, huts were erected on the shore, and
    the party returned in fall before the cold season.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Only a few people stayed at Lake Nettilling for the entire year, and some
    descended to the sea in March for young sealing because young seal skins could
    not be altogether replaced by deerskins.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the time described, year-round inland residence was exceptional; in fall
    boats and unneeded articles were left at Isoa, snow houses were built at Kangia,
    and in December people moved toward the entrance of Nettilling Fjord for sealing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Seals were hunted by harpoon near favored places, and Sarbaqdualung was sometimes
    visited to shoot seals near tide holes, though the ice there was rough and treacherous.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: In March and April, young seals were caught near islands, and older settlements
    were left when large water holes began to appear.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: After young sealing, the basking seal hunt opened; the passage reports large
    numbers of seals and says that by early May people had enough sealskins for summer
    clothing.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: In the first week of May, the natives traveled from Qarussuit by way of Kangia,
    Isoa, and the southern shore and islands of Lake Nettilling to Tikeraqdjung, where
    they settled for summer.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The summer district is described as rich in deer, returning birds, moulting
    birds, abundant geese, southern plains with many lakes, and a river where deer
    were caught while crossing.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:16
  text: Salmon were caught in abundance near Padli, and the Talirpingmiut stayed in
    the district until the eastern part of the lake froze.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: In November, once floe formed more quickly among the islands than in open
    western water, the natives returned by sledges to Isoa.
  category: sequence
  evidence_refs:
  - ev:13
