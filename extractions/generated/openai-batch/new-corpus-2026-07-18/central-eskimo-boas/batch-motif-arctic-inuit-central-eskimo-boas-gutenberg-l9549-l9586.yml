canonical_text:
  quote: ''
  summary: Savirqong lives with his daughter Niviarsiang, who refuses suitors but
    marries the dog Ijirqang. She has ten children, five Adlet with canine lower bodies
    and five dogs. Savirqong exiles the family to an island, kills Ijirqang by filling
    boots with stones, and retaliatory maiming follows between grandfather, daughter,
    and dog-children. Niviarsiang’s severed fingers become seals and whales. She sends
    the Adlet inland, where they become ancestors of many people, and sends the dog-puppies
    across the ocean, where they become ancestors of Europeans.
  language: English
  quote_policy: summarized
