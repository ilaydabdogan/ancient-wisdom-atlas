candidate_motifs:
- id: motif:1
  label: children trapped inside closing rocks
  taxonomy_refs: []
  basis: The tale centers on girls and infants entering a rock opening that closes
    and cannot be reopened in time to save them.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No further interpretation is supplied in the passage.
- id: motif:2
  label: deception by false animal sighting before murder
  taxonomy_refs: []
  basis: One enemy falsely announces a whale, distracts the other, and kills him from
    behind with a spear.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not frame the killer as a named trickster figure.
- id: motif:3
  label: pursued animals transformed into landmark stones
  taxonomy_refs: []
  basis: Bears pursued in water escape to land and become two bear-like stones at
    Qognung.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The transformation is reported without explaining the agent or cause.
- id: motif:4
  label: dead child transformed into animal ancestor
  taxonomy_refs:
  - death_rebirth
  basis: A buried dead boy becomes a hare, and all hares are said to come from that
    animal.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy reference is approximate because the passage describes metamorphosis
    after death rather than a full return to ordinary human life.
- id: motif:5
  label: animals born from an egg in the earth
  taxonomy_refs: []
  basis: Albino seals and deer are said to spring from a half-foot egg that forms
    in the earth and to emerge through underground passages.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Although the motif includes an egg, the passage does not present it as
    a cosmic egg.
- id: motif:6
  label: fabulous neighboring or prior peoples
  taxonomy_refs: []
  basis: The passage enumerates tribes described as former neighbors, expelled people,
    hybrids, dwarfs, inland people, sea-depth dwellers, or women-only people.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: Several entries are brief ethnographic notices rather than full narratives.
- id: motif:7
  label: gender and size inversion in a tribe
  taxonomy_refs: []
  basis: The Ardnainiq men are tiny and carried by wives, while women are normal-sized
    and perform hunting and provisioning.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives no plot beyond the descriptive inversion.
- id: motif:8
  label: enormous or dangerous animals known by report
  taxonomy_refs: []
  basis: Foreign-reported animals are described as fierce, enormous, devouring, or
    requiring special collective fishing methods.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The collector explicitly states uncertainty about whether the idluk report
    is altogether fabulous.
comparison_claims:
- id: claim:1
  claim: 'The Tornit/Tuniqdjuait notice supports a cautious regional comparison: the
    same or related people are presented as former co-residents expelled by Eskimo
    in some areas and as enormous fabulous beings in Greenland.'
  claim_level: same_motif
  target: Tornit/Tuniqdjuait traditions in Labrador, western Eskimo country, Baffin
    Island, and Greenland
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives the collector's summary comparison rather than parallel
    full narratives.
- id: claim:2
  claim: The Adlet/Erqigdlit notice supports a linguistic and semantic comparison
    between names used for interior Indians in Labrador or west of Hudson Bay and
    names used for a dog-legged, human-bodied fabulous tribe in Baffin Land and Greenland.
  claim_level: linguistic_similarity
  target: Adlet/Erqigdlit terminology across Labrador, west of Hudson Bay, Baffin
    Land, and Greenland
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage itself notes that the relation has been forgotten in some
    areas and that the different uses are difficult to account for.
