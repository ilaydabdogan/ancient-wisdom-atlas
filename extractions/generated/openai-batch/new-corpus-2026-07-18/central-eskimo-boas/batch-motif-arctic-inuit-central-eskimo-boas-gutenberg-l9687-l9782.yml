canonical_text:
  quote: ''
  summary: 'The passage gives several short tales and ethnographic notices: children
    trapped in a cliff opening; a murder by deception near a boot-shaped rock; bears
    transformed into stones; a dead boy transformed into a hare; albino seals and
    deer arising from an egg in the earth; lists of fabulous tribes; and reports of
    large or fabulous animals.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two little girls with infants in their hoods enter an opening between rocks
    near Aivillik, and the opening closes before they can escape.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rescue attempts fail; meat and water are passed to the trapped children for
    a time, but the children die in the cliffs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A diorite vein opposite Niutang resembles a boot and is called Kamingujang.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: One enemy points toward Kamingujang, claims a whale is blowing, induces the
    other to look, and kills him from behind with a spear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Qognung there is a large white stone on each side of the fjord; the stones
    resemble bears.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bear-like stones are said to have been bears pursued by an Eskimo in the
    water; after reaching land they were transformed into stones.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A dead boy buried under a large stone is transformed into a hare that jumps
    from the tomb.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that all hares come from the hare into which the dead boy
    was transformed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Albino seals and deer are said to spring from an egg about half a foot long
    that forms in the earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The seal and deer associated with the earth-formed egg dig underground passages,
    respectively to the sea and to a distant part of the country, where they rise.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Tornit or Tuniqdjuait are described as a people similar to the Eskimo,
    formerly living with them and later expelled; in Greenland the group is described
    as entirely fabulous and enormous.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Adlet or Erqigdlit are identified in some regions with Indians of the
    interior, while Baffin Land Eskimo and Greenlanders use the terms for a fabulous
    tribe with dogs' legs and human bodies.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Ardnainiq are described as a northwestern tribe whose men are tiny, childlike,
    hair-covered, and carried in their wives' hoods, while the women are normal-sized
    and do the hunting and providing.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: 'Other fabulous peoples are listed: cliff-dwelling dwarfs, bandy-legged inland
    people, sea-depth dwarfs, the Ijirang, and a people consisting only of women.'
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: Animals known by reports of foreign tribes are described as fabulous creatures,
