canonical_text:
  quote: ''
  summary: The passage describes three sisters who produce lightning, thunder, and
    rain. Ingnirtung makes lightning with red stones, Kadlu makes thunder with sealskins
    and song, and an unnamed sister makes rain by urinating. They live in a whale-rib-supported
    house in the far west, avoid the sea, and Ingnirtung kills intruders with lightning.
    The passage also reports a Kakī´joq offering of dried small-seal skins to Kadlu
    for thunder-making.
