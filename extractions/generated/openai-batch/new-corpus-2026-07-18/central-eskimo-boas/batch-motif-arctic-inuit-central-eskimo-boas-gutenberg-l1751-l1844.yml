canonical_text:
  quote: ''
  summary: The passage describes seasonal travel, settlement, hunting, and route choices
    among named Inuit groups and communities around Nettilling, Cumberland Sound,
    Imigen, Qingua, Anarnitung, and adjoining lakes, islands, sea ice, rivers, valleys,
    and water holes. Movement is conditioned by boats, portages, ice breakup, rough
    ice, deep snow, dog-sledge use, snowshoes, sealing seasons, deer hunting, salmon
    rivers, and return to sea or fall settlements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Travelers carrying heavy loads of deerskins make slow progress and generally
    reach their destination after six days; sometimes they make short March or April
    trips to Isoa to hunt deer or retrieve things left behind.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Cumberland Sound natives visit Nettilling by boat after the ice breaks
    up, carrying boats over portages between Kangia and Isoa, and leave the lake at
    the beginning of October to return to fall settlements in the sound.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Talirpingmiut are said to have no boats and therefore stay at Tikeraqdjuaq
    while other natives sometimes change habitations and visit other parts of the
    lake.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The winter settlement on Imigen is described as being in a productive winter
    hunting ground, but hunting is made difficult by rough ice caused by strong currents.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: In some springs deep soft snow west of a line from Imigen to Anarnitung prevents
    the use of dog sledges, leading people to settle on sea ice between Augpalugtung
    and Imigen or farther north from mid-March to late April.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The natives hunt deer at Issortuqdjuaq or Eχaluqdjuaq, but dislike hunting
    farther northwest because irregular hills and disconnected valleys would require
    carrying skins and meat up and down hills.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Eχaluaqdjuin and Eχaluqdjuaq are described as productive salmon rivers connected
    to valleys, lakes, glaciers, rivers, isthmuses, and overland routes suitable for
    sledging or foot travel.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the fall the natives resort to Saunirtung or Saunirtuqdjuaq and remain
    there until January, when they return to the sea.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Anarnitung and Igdlungajung are described as important Cumberland Sound settlement
    places, and the island has a number of very old stone foundations on its southern
    and eastern slopes.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: When upper-sound ice is smooth, families settle on Kilauting and hunt seals
    with the harpoon; when ice is rough, they remain in Anarnitung, where some go
    to water holes and shoot blowing seals while others hunt on nearby ice.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: During the young sealing season the people usually leave the island for Sakiaqdjung,
    but heavy snowfalls may force movement toward the open sea; if they remain, snowshoes
    are used for travel in deep soft snow.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: In 1878 many natives remained near the ship Florence in Anarnitung Harbor
    because some were in the ship’s service and others stayed to barter seals and
    skins.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Passes around water holes at the head of Cumberland Sound are important; the
    island of Nudnirn offers a passage through a deep valley, while enlarged water
    holes at Sarbuqdjuaq require avoidance by way of the isthmus of Itidliaping.
  category: setting
  evidence_refs:
  - ev:9
