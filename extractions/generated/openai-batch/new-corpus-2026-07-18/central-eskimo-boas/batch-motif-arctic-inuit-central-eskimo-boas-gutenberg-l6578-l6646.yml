canonical_text:
  quote: ''
  summary: 'The passage describes winter, spring, and summer visiting practices among
    Central Eskimo communities: short winter hospitality visits, longer spring sledge
    journeys to neighboring groups, return journeys, shorter seasonal visits, use
    of snow goggles, and summer boat travel with household goods, children, dogs,
    provisions, and recurring camping places.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After winter ice consolidates, settlements have frequent visits, trading excursions,
    and visitor arrivals.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hosts unload the visitor's sledge, feed the dogs, lead the visitor into the
    hut, serve choice meat, and the hostess arranges the visitor's clothing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Longer journeys are deferred until spring, planned in advance, and may involve
    moving household goods from winter villages while leaving boats in a friend's
    care.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: On spring sledge journeys, tent poles and goods are loaded on the sledge;
    the driver walks alongside; women lead the way; and dogs pull more willingly when
    someone is ahead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At night, only items needed for a small tent and cooking are removed, and
    the pitu is fastened to an eye cut in the ice to protect the sledge from dogs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After about three days of travel, travelers make a longer halt, unload the
    sledge, unharness dogs, and men hunt for food for dogs and people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Travelers may settle with visiting friends for a whole year, establish their
    own hut, and retrace the journey home the following spring.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: During spring travel, snow goggles are used to protect against snow blindness;
    modern wooden goggles have a shade and narrow eye slits, and an older design is
    described as ivory.
  category: object
  evidence_refs:
  - ev:9
- id: obs:9
  text: Summer long journeys may be made by several families traveling together in
    boats, though spring journeys are said to be more frequent because the open season
    is short.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: In boat travel, women pull the oars, a man steers with a paddle, kayaks are
    towed, children and dogs lie in the boat, and provisions are kept in a central
    tub.
  category: action
  evidence_refs:
  - ev:11
- id: obs:11
  text: Night camps during boat travel are made at known recurring places with smooth
    sloping beach, fresh water, and dry gravelly tent sites.
  category: setting
  evidence_refs:
  - ev:12
