canonical_text:
  quote: ''
  summary: Ethnographic account of seasonal fishing, whaling, skin and blubber processing,
    sledge-based winter trade around Qeqerten, and the effects of whalers and trading
    stations on intertribal trade and access to European goods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fall fishing begins when ice starts to form; boats seek whales along the eastern
    shore of the sound, but must return when ice forms quickly near late October or
    early November.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Because whale catches have recently been poor, stations collect seal blubber
    and skins bought from the Eskimo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When ice is strong enough for sledges, station sledges travel settlement to
    settlement exchanging European goods for skins and saved blubber, while natives
    also travel to Qeqerten with hides and blubber to obtain useful articles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In spring, frozen skins are brought from storage and exposed to the sun; women
    cut blubber from the skins with crescent-shaped knives, then clean and salt the
    skins for packing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After young sealing, men prepare whale boats, oars, sails, and harpoons for
    spring fishing, and crews are expected to remain away from shore for about six
    weeks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the beginning of May, boats are carried on sledges drawn by dog teams under
    native drivers to the floe edge, unloaded, and launched.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the floe edge, seals and birds are hunted, skins and meat are sent back
    to Qeqerten, and blubber is packed in casks kept nearby.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The whale is described as the expedition’s most important object; harpoons
    and lines remain ready, the boats return north as the ice breaks up, and the fishing
    ends in July.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Contact between Eskimo and whalers is said to have transformed trade between
    Eskimo tribes, with regular traffic and movements connected to changing whale
    catches and ship visits.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Named regional groups are described as having different routes of access to
    whalers, European manufactures, Hudson Bay Company stations, or Aivillirmiut mediation.
  category: relationship
  evidence_refs:
  - ev:7
