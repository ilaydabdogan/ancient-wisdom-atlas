  summary: A young man carries his wounded sister wrapped in hares’ skins and wanders
    for many days. They reach the hut of Iqignang. The hungry young man asks to eat
    from deer meat at the entrance, but Iqignang tells him not to, and he stops. Iqignang
    treats the siblings kindly, marries the recovered girl, and gives his former wife
    to the young man.
