  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Lyon reports that after six months, widows may eat raw meat, dress their pigtails,
    and marry.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Lyon reports that a widower and his children remain three days in the hut
