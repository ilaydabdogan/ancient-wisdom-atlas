  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Lyon reports that a widower is not allowed to fish, hunt, or marry again for
    a whole season.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: During three days of lamentation, relatives are careless of dress, have wildly
