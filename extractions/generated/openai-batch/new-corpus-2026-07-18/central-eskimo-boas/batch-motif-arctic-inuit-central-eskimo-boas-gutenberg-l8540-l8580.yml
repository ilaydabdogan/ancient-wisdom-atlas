canonical_text:
  quote: ''
  summary: The passage describes mourning regulations after death, including timed
    restrictions on ice travel, hunting, dogs, festivals, songs, use of clothing,
    and hut entry. It gives rules for a widower's first seal catch after his wife's
    death, cites Lyon on Iglulik mourning practices for widows, widowers, relatives,
    and visitors, and states that souls of those who die by violence go to Qudlivun,
    the happy land, a belief linked here to suicide and killing aged parents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the fourth day after a death, relatives may first go upon the ice, but
    men are not allowed to hunt.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the next day, the relatives must go sealing without dogs and sledge, walking
    to the hunting ground and dragging the seal home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the sixth day after death, relatives may use their dogs again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: For a whole year, the relatives must not join any festival and are not allowed
    to sing certain songs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If a married woman dies, the widower may keep only the flesh of the first
    seal he catches after her death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The skin, blubber, bones, and entrails of the widower's first seal after his
    wife's death must be sunk in the sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: All relatives must have new suits of clothes made.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Before old clothes are cast away, relatives may not enter a hut without asking
    and obtaining permission.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lyon reports that Iglulik widows are forbidden for six months to taste unboiled
