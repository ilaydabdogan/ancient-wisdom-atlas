canonical_text:
  quote: ''
  summary: The passage describes the seasonal movements, hunting practices, winter
    food stores, settlements, roads, and limited external contacts of the Aivillirmiut,
    drawing on Boas’s synthesis of observations by Klutschak, Hall, and Rae. It emphasizes
    movement between sea ice, mainland, inland deer grounds, Wager River, Depot Island,
    and other named settlements according to season and available animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Later in the season the Aivillirmiut live in tents and continue hunting seals
    and walrus while ice remains present.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Winter stores are deposited near Depot Island, Cape Fullerton, and the northern
    entrance of Chesterfield Inlet.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the ice is gone, the group resorts to the mainland to hunt deer that
    descend to the shore; when snow begins covering the country, they move inland
    and continue deer hunting.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: In October they settle near a deer pass or a lake crossed by southward-migrating
    herds, and in December they live on stores deposited in the fall.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Around the beginning of the new year, some return toward the sea for walrus
    stores or seal hunting on the land floe, while others go to hills near Chesterfield
    Inlet and Wager River for musk ox; they return to the bay in March or April to
    hunt seals.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: When walrus meat supplies are very abundant, the Eskimo gather in one large
    settlement.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:7
  text: Klutschak’s observations include a December return of deer hunters to Depot
    Island, winter walrus hunting at the floe edge, summer whale hunting by kayak
    with immediate storage, and one family spending a year inland living mostly on
    musk ox.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Klutschak’s chart marks a winter settlement on Wager River, where the inhabitants
    probably lived on seals caught at breathing holes.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Hall’s account places some of the people at Wager River and about forty at
