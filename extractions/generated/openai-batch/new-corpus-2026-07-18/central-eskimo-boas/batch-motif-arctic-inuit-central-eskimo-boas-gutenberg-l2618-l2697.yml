canonical_text:
  quote: ''
  summary: 'The passage summarizes Ross’s information about the Netchillirmiut of
    Boothia Felix, King William Land, and Back River: their territory, winter settlements,
    first encounter with the ship Victory, seasonal hunting and fishing movements,
    use of kayaks, snow-house settlement evidence, and estimated population.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Netchillirmiut are described as an important tribe inhabiting Boothia
    Felix, King William Land, and the mouth of Back River.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Their district is described as including the southern part of Boothia Felix,
    the narrow isthmus, adjoining coasts, Bellot Strait, Owutta Island, and probably
    parts of King William Land and Shepherd Bay.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Ross’s account is summarized as giving three winter settlements: the eastern
    shore of the Isthmus of Boothia, Lake Netchillik, and Owutta Island.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two accounts are reported for the first meeting with the Victory; the passage
    treats as more probable the account that two natives saw the ship near Victoria
    Harbor in September 1829 and traveled to Netchillik in fear to inform others.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A woman who had been aboard Parry’s ships told stories that led the natives
    to watch for Europeans; on January 9, 1830, thirty-one men approached the ship.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: During January and February the people lived on seals killed with harpoons
    and also had stored venison, seal blubber, and fish.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In early March the people scattered over the ice to improve sealing opportunities
    and to catch young white-coated seals.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that the Netchillirmiut are the only tribe on the continent
    of America pursuing young seals, enabled by extensive land floe in large bays.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Late in March some natives went to Sarvaq and Netchillik to fetch kayaks left
    there from the preceding season, because boats would be needed when the ice broke
    up for northern lake deer hunting.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: As spring advanced, settlements broke up; some families moved to Netchillik,
    while musk ox and returning reindeer were hunted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Some families remained near the ship until early July, sealing, catching salmon,
    and hunting musk ox before going inland to hunt deer and fish for trout; Lindsay
    River and Sarvaq are named as principal summer fishing stations.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Lake Netchillik part of the tribe is described as more numerous, with
    twenty-one winter snow houses, an estimated village population of about 170, and
    a probable total tribal population of 350.
  category: attribute
  evidence_refs:
  - ev:8
