canonical_text:
  quote: ''
  summary: 'The passage describes Central Eskimo methods and implements used in seal-hole
    hunting: the hunter’s long wait at a breathing hole, wind shelter, leg restraint,
    placement of tools, listening for the seal, striking the hole, optional use of
    a qipekutang warning rod, closing wounds with plugs, attaching lines with toggles,
    preventing line disorder with a whirl, dragging and securing the seal to a sledge,
    and firearm hunting at winter water holes during spring tides.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a long wait is expected and famine is impending, a sealer may wait at
    a seal hole for a whole day or longer despite cold and wind.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sealer builds a semicircular wall of snow blocks against the wind and
    makes a seat in its center.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A skin is placed under the hunter’s feet, and his legs are tied with a thong
    fastened by a two-holed buckle called tutareang; the restraint helps keep him
    quiet but can be opened quickly by force.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The hunter arranges a snow knife, an unang placed on two pegs, and a coil
    of line in his lap; his left arm is kept out of its sleeve for warmth until action
    is needed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: After hearing the seal breathe, the hunter puts his arm back into the sleeve,
    takes the line coil, picks up the unang, rises, and strikes the center of the
    hole.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ross and Rae are reported as saying that sealing at the hole is more difficult
    in daylight than in darkness, while Boas notes that Davis Strait Eskimo do not
    complain of daylight when snow is deep.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'A qipekutang warning implement may be used: a thin rod with a knob is stuck
    through the snow into the water, and its movement indicates that a seal has risen
    to breathe.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The qipekutang is generally made of whalebone, may have a string attached
    for easier detection of motion, and is avoided by some because it can scare seals.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: After a seal carcass is drawn from the water, its wounds are closed with ivory
    plugs called tuputang, carried in wooden or leather cases.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A hole is cut beneath the lower jaw, a thong is passed through the hole and
    mouth, and a qanging toggle is used to fasten the line to the seal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Some qanging toggles are made in decorative forms, including seal shapes;
    simpler examples may be plain ivory pieces with drilled holes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: A qidjarung whirl may be used to prevent the hunting line from getting out
    of order.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: After capture, the seal is dragged to the sledge, covered with bearskin, lashed
    securely, allowed to freeze quickly, and the hunter sits on it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Winter water holes are visited by Eskimo hunters, especially those with firearms,
    who wait on the lower tide side, shoot a seal when it blows, and secure it with
    a harpoon after it drifts to the ice edge.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The winter water holes can be visited only at spring tides because a treacherous
    floe partly covers the opening between those tides.
  category: setting
  evidence_refs:
  - ev:8
