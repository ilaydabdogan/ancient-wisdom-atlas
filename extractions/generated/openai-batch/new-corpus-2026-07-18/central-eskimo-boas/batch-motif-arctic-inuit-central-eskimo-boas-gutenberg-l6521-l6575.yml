canonical_text:
  quote: ''
  summary: 'The passage describes Inuit rope-jumping games played by women and children,
    including a sequence of jumps and a second variant involving two jumpers. It then
    describes domestic life during plenty and during storm-enforced hunger: lamps
    are extinguished, people sit in dark huts and hum, a daring hunter may go sealing
    in a storm, and a successful return brings meat, blubber, relit lamps, and cooking.
    If hunting fails, famine may lead to killing dogs and, in rare and horrified cases,
    cannibalism involving children.'
  language: English
  quote_policy: summarized
