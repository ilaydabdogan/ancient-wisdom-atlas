canonical_text:
  quote: ''
  summary: A tradition explains the emigration of the Sagdlirmiut. After men of Eχaluqdjuaq
    murder men of Qerniqdjuaq during a depot journey, a boy hears the spirits of the
    dead and kills a visiting young man from Eχaluqdjuaq. The women and children of
    Qerniqdjuaq flee with dogs that have rapidly grown after the old angakoq's instruction.
    Pursuers are stopped when the old angakoq cuts the ice, opening water between
    the groups. The fugitives drift to Sagdlirn and become the mothers of the Sagdlirmiut.
  language: English
  quote_policy: summarized
