canonical_text:
  quote: "“all kinds of sea animals have risen from the fingers of their supreme goddess”"
  summary: 'The passage describes winter daily life in snow houses: hunters prepare
    sledges, dogs, weapons, and food before leaving to hunt seals; women maintain
    lamps, cook, sew, visit, sing, and care for children; hunters return with seals
    or stored meat; a religious custom requires women to stop working until a seal
    is cut up, explained by a tradition that sea animals originated from the fingers
    of a supreme goddess and are her offspring; the passage then describes meal practices,
    utensils, and communal eating.'
