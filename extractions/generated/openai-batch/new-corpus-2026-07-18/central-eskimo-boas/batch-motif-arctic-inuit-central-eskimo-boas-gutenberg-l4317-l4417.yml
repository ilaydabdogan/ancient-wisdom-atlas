canonical_text:
  quote: ''
  summary: 'The passage describes Central Eskimo deer-hunting practices: the seasonal
    start of the summer hunt, driving deer into ponds or lakes, using cairns to make
    deer think hunters are approaching, pursuing swimming deer by kayak and spear,
    ambushing deer in narrow valleys, waiting at recurring migration passes, driving
    reindeer onto treacherous ice near Simpson Strait, and stalking scattered deer
    with bows and arrows. It also notes a frequently told tradition about deer hunts
    of a fabulous tribe, but gives no details of that tradition here.'
  language: English
  quote_policy: summarized
