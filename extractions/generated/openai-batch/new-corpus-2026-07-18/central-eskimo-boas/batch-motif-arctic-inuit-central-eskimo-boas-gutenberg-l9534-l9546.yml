canonical_text:
  quote: ''
  summary: Three men take a young boy on a bear hunt by sledge. During the pursuit,
    the bear and sledge rise upward; the boy falls from the sledge while trying to
    retrieve a mitten and sees the men ascend and become stars. The bear, pursuers,
    and sledge are identified with named stars or parts of Orion, while the boy returns
    to the village and reports the loss of the men.
