canonical_text:
  quote: ''
  summary: The passage describes seasonal hunting movements, overland and water-crossing
    routes, inland and coastal settlements in the Cumberland Sound and Nettilling
    region, the unusual inland residence of the Talirpingmiut, former Lake Nettilling
    settlements, and contested oral-historical claims about the lake’s discovery by
    Kadlu and Sagmu. It also notes that a tale about Igimarasugdjuqdjuaq the cannibal
    is reported in Greenland and Labrador in nearly identical form.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Winter settlements are described as nearly breaking up at this season, and
    some Naujateling people go bear hunting instead of young sealing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Polar bears are said to be rare in Cumberland Sound, and unusual bear appearances
    are remembered and discussed for years.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When water washes the foot of the cliffs between Kautaq and Sulung, people
    cross an isthmus by sledge road and hunt among islands south of Qaχodluin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Summer settlements are located at the heads of Qasigidjen and Kangertlung
    Fjords, from which people ascend the Nugumiut plateau and hunt on highlands.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Qimissung is used as a fall gathering place after deer hunting, and people
    move to Idjorituaqtuin after the sea freezes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A large, deep, wide river empties into Auqardneling and interrupts migrations
    from Kangertlung and Eχaluin unless it is crossed with some kind of vessel.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: To cross the river, the natives fill a deerskin with shrubs, sew it up, and
    float themselves across.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Talirpingmiut inhabitants of Nettilling Fjord are described as one of
    only two known Eskimo tribes in the stated geographic range whose residence is
    not limited to the seashore throughout the year.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Former Talirpingmiut settlements on Lake Nettilling are listed, and the lake’s
    seals are said to have allowed year-round residence there.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Kadlu and Sagmu are named by natives as the men who first reached Lake Nettilling,
    but the narrator questions the reliability of this recent-discovery claim.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: A tale about Igimarasugdjuqdjuaq the cannibal is said to be treated locally
    as a comparatively recent event, yet also to be told almost word for word in Greenland
    and Labrador.
  category: speech
  evidence_refs:
  - ev:8
