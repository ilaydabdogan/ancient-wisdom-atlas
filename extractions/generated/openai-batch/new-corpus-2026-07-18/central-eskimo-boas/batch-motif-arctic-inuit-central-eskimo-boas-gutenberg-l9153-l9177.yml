canonical_text:
  quote: ''
  summary: A malicious old witch envies the hosts of a visiting hunter and angakoq.
    She prepares a poisonous soup of wolf and human brains and sends her grandson
    to invite the visitor, warning him not to reveal the ingredients. The boy repeats
    the warning and thereby reveals them. The visitor understands the plot, eats while
    his tornaq causes the soup to pass through him into a vessel, then compels the
    witch to eat the soup; she dies at the first spoonful.
