canonical_text:
  quote: ''
  summary: 'The passage first tells of Igimarasugdjuqdjuaq, a murderous cannibal whose
    wife escapes him by leaving a heather-stuffed jacket as a decoy; Inuit villagers
    conceal her and later kill him with his own spear and cut up his body. It then
    describes the Tornit as a former people living alongside the Inuit: taller, long-limbed,
    very strong, similar in subsistence but different in hunting methods, clothing,
    lamps, stone tools, houses, food preparation, and games.'
  language: English
  quote_policy: summarized
