  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Tornit hunted walrus, seals, and deer like the Eskimo, but their hunting
    methods differed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In winter sealing, Tornit wore a long deerskin coat fastened to the snow with
