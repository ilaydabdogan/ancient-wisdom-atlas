canonical_text:
  quote: ''
  summary: The passage describes Central Eskimo walrus, whale, narwhal, and white
    whale hunting methods, including cooperative and solitary walrus hunting on ice,
    dangers of being dragged into the sea, Hall’s Frobisher Bay observation, whaling
    from kayaks and skin boats with harpoons, lines, floats, and lances, and driving
    white whales into shallow water with stones.
  language: English
