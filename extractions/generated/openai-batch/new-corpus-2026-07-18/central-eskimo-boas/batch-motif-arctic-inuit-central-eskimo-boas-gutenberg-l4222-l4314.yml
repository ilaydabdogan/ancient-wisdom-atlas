literal_observations:
- id: obs:1
  text: Two hunters may approach a walrus with one hidden behind the other so that
    they appear as one.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the spear is thrown, hunters hold the line wound around their arms to
    create friction and exhaust the walrus.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A hunter can secure the spear and line in the ice and brace it with the foot,
    but the line may cut on sharp ice, the thin ice may break, or the line may entangle
    the hunter’s arm and pull him into the sea.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A lone hunter who strikes a walrus may brace his feet against a hummock, creating
    a direct contest of strength with the animal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In solitary walrus hunting, the hunter may be dragged to the edge of the ice
    or under the ice before giving up the hold.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hall’s Frobisher Bay description has the hunter hide among broken drifting
    ice, throw the spear, slip the line coil from his head, fasten the line to the
    ice, and lance the walrus when it resurfaces.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Walrus swimming under extensive new ice may drown when repeatedly frightened
    down each time they try to surface to breathe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Whales are hunted from kayaks with a large float attached to the harpoon head;
    many kayak boatmen try to harpoon the whale, which is then tired by blood loss
    and resistance from attached gear and killed with lances.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In skin-boat whaling, the crew consists entirely of men; a skilled boatman
    steers, and a harpooner stands in the bow watching for a chance to strike.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The described whaling weapon has a long heavy shaft, bone point, and a heavy
    harpoon head with an iron edge; when the whale is struck, the head and edge disengage
    from the shaft and enter the flesh.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: In skin-boat whaling, a long line, the niutang, and five large floats are
    kept ready and thrown overboard after the harpoon is fast to the whale; the whale
    is followed and lanced when it comes up to breathe.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Narwhal and white whale are hunted in the same way as walrus and right whale.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: When white whales enter shallow summer bays, people in boats and kayaks throw
