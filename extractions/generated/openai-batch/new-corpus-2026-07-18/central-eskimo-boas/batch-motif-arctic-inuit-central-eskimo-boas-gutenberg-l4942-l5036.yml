literal_observations:
- id: obs:1
  text: Sewing thread is made from deer or white whale sinews; steel needles are generally
    used, while ivory needles are used where steel ones are lacking; needles are kept
    in ivory needle cases.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thimbles are made from ground sealskin, and women sew by pulling the thread
    toward themselves and making an overcast seam.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: Whalebone is used for elastic thongs and as a substitute for wood, including
    kayak parts and boxes; bones of large animals and the walrus penis bone are used
    instead of poles.
  category: object
  evidence_refs:
  - ev:4
- id: obs:4
  text: Wood and deer horn are made pliable in boiling water, and small pieces of
    bone are straightened after steaming with a specific implement.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: The drill for working ivory and bone has a bow with string, a drill, and a
    mouthpiece, and it is operated by setting the drill against the material and moving
    the bow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: A second drill arrangement uses a string with handles; usually one man pulls
    the string while another holds the mouthpiece.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:7
  text: The same drilling instrument can be used to make fire by rotating hard wood
    against driftwood, applying moss to the glowing wood, and gently blowing it; flint
    and pyrite are also used where available.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: Ivory implements are cut from tusks, shaped by chipping, finished with files,
    and some knives and harpoons are made from repurposed saw blades or Scotch whale
    harpoons.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: Engravings in bone and ivory are scratched with an implement consisting of
    a point inserted into a wooden handle; the point is iron in the described form
    and was formerly quartz.
  category: object
  evidence_refs:
  - ev:10
- id: obs:10
  text: Stone implements are made from flint, slate, or soapstone, and soapstone fragments
    may be cemented with a mixture of seal blood, clay, and dog hair.
  category: action
  evidence_refs:
  - ev:11
- id: obs:11
  text: Lyon is cited for the report that hair from a bitch was believed to spoil
    the soapstone cement mixture and prevent it from sticking.
  category: speech
  evidence_refs:
  - ev:11
