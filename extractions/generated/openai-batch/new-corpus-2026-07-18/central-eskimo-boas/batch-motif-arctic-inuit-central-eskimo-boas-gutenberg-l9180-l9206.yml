canonical_text:
  quote: "“two women without the company of any men lived all by themselves and were
    never in want”"
  summary: Two pregnant women quarrel with their husbands, leave their kin, settle
    at Igdluqdjuaq, build a house from whale ribs, sod, and turf, and sustain themselves
    through trapping, scavenged sea-mammal carcasses, deer, and salmon. Their fathers
    later find them living comfortably and return home with the story. The visible
    house remains explain the place-name Igdluqdjuaq, “The Large House.”
