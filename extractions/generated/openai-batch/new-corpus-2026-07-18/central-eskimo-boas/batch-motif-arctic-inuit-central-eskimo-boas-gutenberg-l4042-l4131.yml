literal_observations:
- id: obs:1
  text: A harpoon line is attached so that the teliqbing holds shaft and head together
    until lateral strain on the tusk causes the teliqbing to slip off and disengage
    the line with the harpoon head from the shaft.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some teliqbing have two holes, one for a wet and longer line and one for a
    dry and shorter line.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Iglulik the spear called qatilik is described as the same pattern as those
    of Akudnirn and Oqo, with differences in the straight toung, a notch near its
    socket, and a harpoon head with a single point at its lower end.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The harpoon is placed on the right side of the kayak prow, the line and tokang
    lie before the hunter in the asedlun receptacle, and the line end is fastened
    to a seal float behind the hunter.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The avautang float is made from a whole sealskin, inflated through an inserted
    pipe and closed with a stopper; holes can be closed by a button.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: For large animals such as walrus or whales, a niutang hoop with skin stretched
    over it can be inserted between the line and float; when dragged, it resists motion,
    slows the animal, and helps exhaust it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The float prevents a struck animal from escaping by being too buoyant to be
    drawn under water, so the animal cannot dive and the hunter keeps sight of the
    prey.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: For small seals a smaller weapon, the agdliaq, is used with a seal bladder
    float attached to the shaft; its head is tied to the shaft, which acts as a drag.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: A walrus lance called anguvigang is used to dispatch an animal after it has
    been harpooned with the igimang.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The lance joint prevents the shaft from being broken by the animal’s struggles;
    the lance is carried behind the hunter on the right side of the kayak, often with
    a second lance on the left.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: A slender shaft with a long inserted point, called kapun or ipun, is especially
    used for hunting deer in lakes and ponds.
  category: object
  evidence_refs:
  - ev:9
