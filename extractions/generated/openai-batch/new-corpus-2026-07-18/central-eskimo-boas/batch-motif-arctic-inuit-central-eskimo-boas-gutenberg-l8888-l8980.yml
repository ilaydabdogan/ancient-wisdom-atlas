canonical_text:
  quote: ''
  summary: An old woman angakoq avenges her abused grandson by transforming him into
    a seal who lures his persecutors out to sea, where a storm destroys them. Kiviung,
    who had been kind to the boy, survives and drifts at sea, escaping whirlpools
    before reaching a stone house. There Arnaitiang receives him but secretly intends
    to eat him; she withholds his footwear by means of a rising frame. Kiviung summons
    his white-bear tornaq, recovers his things, and escapes while Arnaitiang threatens
    him with a knife made of freshwater ice.
  language: English
  quote_policy: summarized
