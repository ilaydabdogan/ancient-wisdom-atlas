canonical_text:
  quote: ''
  summary: The passage describes Baffin Island Inuit beliefs and practices concerning
    illness, ritual diagnosis, curing, weather conjuring, angakoq performances, spirit
    invocation and soul flight, ritual language, payment for cures, and faint traces
    of witchcraft. It also notes Sedna’s regulations, the role of tornaq spirits,
    and several ceremonies described by Hall.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Disorders of women are described as punishment for neglecting behavioral regulations
    that were established by Sedna.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: One diagnostic method ties a thong around the head of a sick person or relative
    while the angakoq asks the tornaq about the cause and remedy; an affirmative answer
    is indicated by easy lifting, while a negative answer is indicated by heaviness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A related diagnostic method uses a boot or stone placed under the patient’s
    pillow, which becomes heavy and cannot be lifted when the tornaq answers the incantations
    negatively.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the beginning of some performances, an angakoq crawls in the hut passage,
    howls and shouts, while people inside keep singing; he then enters and continues
    incantations on the back part of the bed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: One cure for sickness involves placing a burning wick on the diseased body
    part and blowing it into the air, or simply blowing on the affected part.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Long-lasting storm and bad weather causing want of food are conjured by making
    a large seaweed whip, going to the beach, striking toward the wind, and crying
    that it is enough.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In some performances, lamps are extinguished, the angakoq hides behind a screen,
    and the invoked tornaq is heard approaching and shaking the hut.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The angakoq believes that the hut is unroofed and that his spirit flies to
    another destination, including to propitiate a hostile tornaq or to visit the
    moon or Sedna’s abode.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Hall’s described performance, an angakoq uses walrus spears, wrestles with
    men, and later displays two spear points apparently covered with fresh blood.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the Sedna feast, some angakut pierce their bodies with harpoons and enter
    the hut bleeding, with the passage noting that blood-filled bladders were evidently
    fastened under their jackets beforehand.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: In another ceremony described by Hall, a long-haired man crawls into the hut,
    searches where knives are usually kept, withdraws when none are found, and would
    have stabbed himself in the breast if he had found a knife.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A favored performance has the angakoq’s hands tied and a thong fastened around
    his knees and neck; after invoking the tornaq, the body lies motionless while
    the soul flies away, and the thongs are later found untied.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The angakut use a sacred language in songs and incantations, including symbolic
    words and archaic roots no longer used in ordinary speech.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: The passage states that many angakut believe in their performances, fall into
    ecstasy through shouting and invocation, and imagine they accomplish flights and
    see spirits.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:15
  text: An angakoq must be paid at once for curing a sick person and receives sizable
    fees for such services.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:16
  text: The passage reports faint traces of witchcraft belief in Baffin Land, specifically
    the opinion that a man can injure a distant enemy by means not learned by the
    author.
  category: other
  evidence_refs:
  - ev:14
