canonical_text:
  quote: ''
  summary: The passage describes Central Eskimo and neighboring groups' bows, arrows,
    quivers, and deer-hunting methods. It notes regional weapon-construction differences,
    quiver design, animal-form details, deer stalking through imitation of deer appearance
    and sounds, concealment behind stones or walls, and two-person luring tactics.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Cumberland Sound bow is described as resembling the Iglulik pattern, while
    differing in sinew-line fastening and lacking a central strengthening bone piece.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wooden bows made from a single piece were not very rare in Cumberland Sound
    and farther south, with wood brought from Resolution Island to more northern districts.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Antler bows generally consist of a stout central piece and two side pieces,
    strengthened with plaited sinews and secured at the joints by strings.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A described Pelly Bay antler bow has a straight-cut central part and additional
    pieces tied with sinews; one piece prevents separation and another gives spring.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Arrows are made from rounded wooden shafts with feathers attached, and their
    heads may be joined by different methods depending on material and regional practice.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage contrasts Mackenzie and western arrow points inserted into shafts
    with Central Eskimo arrow points that are slanted and lashed to the shaft; it
    also contrasts wedge and mortise spear-socket bases.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Slate heads were formerly common, iron or tin heads are now widespread, flint
    heads are found in ancient graves, and stone heads are still reported on Southampton
    Island.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The quiver is made of hair-removed sealskin and has separate divisions for
    bow, arrows, and a small pouch for tools and extra arrowheads.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: When traveling, the quiver is carried by an ivory handle; when in use, it
    is hung over the left shoulder, and one handle is fashioned in imitation of an
    ermine.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: When deer cannot be driven into water, Eskimo hunters stalk them or shoot
    from a stand; two hunters may approach with one hidden behind the other.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Hunters carry bows or guns on their shoulders to resemble deer antlers, imitate
    deer grunting, stop and stoop, and may sit or lie down so that they resemble the
    animals from a distance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: If terrain is level, hunters make stone heaps or circular or semicircular
    walls to conceal themselves and lure deer by grunting; they approach from the
    lee side because of the deer’s scent.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: In one described two-person method, men walk away from a deer so that it follows;
    one hides behind a stone with a bow while the other leads the deer within arrow
    range.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Hall is reported as confirming a similar method in which one hunter hides
    behind a stone while another attracts the deer with grunting sounds.
  category: action
  evidence_refs:
  - ev:9
