literal_observations:
- id: obs:1
  text: Many eating and working regulations are said to be connected with the Sedna
    tradition, and the angakut watch their observance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sea animals are said to have originated from Sedna’s fingers, and an Eskimo
    must make atonement for every animal killed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a seal is brought into the hut, women stop working until it is cut up;
    after the capture of a ground seal, walrus, or whale, women rest for three days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mending sealskin articles is allowed under certain restrictions, but making
    new articles and working new deerskins are restricted according to the formation
    of ice, the first seal, the first walrus, and the following fall.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Deer and sea-animal foods and materials are kept apart through rules about
    same-day eating, placement in the hut, washing before changing foods, and excluding
    walrus hide from Lake Nettilling.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the Ukusiksalirmiut, salmon must enter a hut by a separate entrance
    from seal oil, and fish must either be cooked away from the catching place or
    eaten raw on the spot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Rules concerning bones include not breaking deer bones while skinning, burying
    bits of the deer, preventing dogs from gnawing seasonal deer or seal bones, and
    not breaking deer bones while walrus are hunted.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hunting-related practices include placing a cup on the shore, throwing seal
    blubber on a hunter’s kayak, using whale bones and blubber instead of shrubs after
    a whale capture, not eating a fetus from a pregnant animal, and fastening a bear
    bladder to an upright stick for three days.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When a house is deserted or a village is largely abandoned, people move bones
    onto the ice, bury clothing before moving, or build new houses to avoid bad hunting
    luck.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: During menstruation, women do not eat raw meat, cook in separate pots, and
    do not join festivals.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A traveling party visiting a neighboring tribe must adopt that tribe’s customs
    and regulations.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: At named places, people buy potstone from a rock by giving something in exchange,
    bid farewell to a large rock when passing, and shake their heads with a murmur
    at a dangerous cape.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
