  quote: ''
  summary: Ethnographic description of several Baffin Land Inuit groups, their settlements,
    seasonal travel routes, intergroup contact, whaling-station influence, winter
    sealing and walrusing, and a religious requirement among the Nugumiut that deerskins
    be worked up before the walrus hunt begins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sikosuilarmiut are described as inhabitants of the southwestern part of
    Baffin Land, settled at Nurata and Sikosuilaq.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In summer the Sikosuilarmiut visit upper parts of a long fjord to hunt deer
    on plains reaching toward Fox Basin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator knows of only one meeting, in 1883 south of Lake Nettilling,
    between Eskimo visiting Lake Nettilling and others supposed to have come from
    Hudson Strait.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Akuliarmiut have a winter resort on the northern shore of Hudson Strait
    and travel in summer by sounds, lakes, and portages to Lake Amaqdjuaq, where they
    erect summer tents.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Qaumauangmiut live east of the Akuliarmiut and have their principal residence
    near Lake Qaumauang.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that reliable charts help Eskimo informants explain points,
    islands, settlements, and migrations in detail.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sikosuilaq and Akuliaq maintain moderate intercourse despite a wide uninhabited
    stretch between them, and members of each tribe have settled among the other.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: An American whaling station at Akuliaq may have influenced the distribution
    and life of the tribes, though the passage does not attribute Akuliaq’s importance
    to whalers alone.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Qaumauangmiut are said to be probably closely related to the Nugumiut
    of Frobisher Bay.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Nugumiut are described as inhabiting several places almost every winter,
    including locations in Frobisher Bay, Countess of Warwick Sound, Field Bay, and
    Grinnell Bay.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Because the bays open into Davis Strait, ice formation is retarded and its
    extent diminished, affecting the life of the Eskimo there.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: The only occupation of the Nugumiut and the inhabitants of Ukadliq is described
    as sealing with the harpoon on the floe of the inner bays.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Near Ukadliq, tide holes east and west of Allen Island abound with seals;
    in winter the village is established near Roger’s Island when seals move to open
    ice.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: During autumn the Nugumiut stay in Field Bay, where women prepare deerskins.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage says religious requirements prevent beginning the walrus hunt
    until the summer deerskins have been worked up for use.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: After the deerskins are worked, the Nugumiut travel across Bayard Taylor Pass
    to Frobisher Bay and settle on Operdniving or Tuarpukdjuaq in late December or
    early January.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: If the bay is frozen beyond Operdniving, the settlement may move to Aqbirsiarbing;
    travelers avoid tide holes of Ikerassaqdjuaq by using the pass of Chappell Inlet.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: At Aqbirsiarbing and Tornait the natives go sealing on the ice or walrusing
    at the edge of the floe.
  category: action
  evidence_refs:
  - ev:9
