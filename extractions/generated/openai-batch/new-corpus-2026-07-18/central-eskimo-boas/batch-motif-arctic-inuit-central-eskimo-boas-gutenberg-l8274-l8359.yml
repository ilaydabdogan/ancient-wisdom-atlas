canonical_text:
  quote: ''
  summary: The passage first records several greeting formulas, then describes ethnographic
    customs and regulations concerning birth, sickness, and death among different
    Central Eskimo/Inuit groups. It discusses childbirth isolation, treatment of the
    navel string, infant washing and clothing, post-birth ceremonies reported by Kumlien
    and Lyon, preservation and ritual disposal of the child's first clothing, amuletic
    use of birdskin at the Sedna feast, abnormal birth presentation rules at the feast,
    seasonal bird associations, and a sealskin strip worn while the navel string remains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage records greeting words used on Davis Strait, Hudson Strait, among
    the Netchillirmiut, and among the Ukusiksalirmiut.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that regulations connected with birth, sickness, and death
    are difficult to ascertain and vary greatly among different tribes.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before childbirth, a small hut or snow house is built for the mother, and
    sick persons are isolated in the same way.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The stated reason for isolating sick persons is that, if death occurs, everything
    that had been in contact with the deceased must be destroyed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: When parturition takes place, visiting friends must leave; the mother cuts
    the navel string herself, with methods differing between Davis Strait and Iglulik
    accounts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The newborn is cleaned with a birdskin and clothed in a small gown of the
    same material; an Iglulik account says the infant is swathed with dried animal
    intestines.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kumlien reports a post-birth custom in which an aged female angakoq leads
    mother and child in circular marching on ice and through snowdrifts; the author
    says he could find no trace of this custom, even by direct inquiry.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lyon reports a ceremony called qoqsiuariva in which an angakoq uses a vessel
    and the mother washes the infant with urine while others offer good wishes; the
    author says he heard of urine washing but not the rest of the ceremony in Cumberland
    Sound and Davis Strait.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A few days after birth, the child's first dress is exchanged for a hare-head
    hood, fawn-skin jacket, and fawn-skin boots, with the left boot wreathed in seaweed;
    the first clothing is fastened to a pole secured to the hut roof.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: After two months, the child receives a third suit; the second gown is exposed
    on the hut, the first and second garments are preserved for a year, then exposed
    on a pole and sunk in the sea, except for a portion of birdskin kept as an amulet
    and worn at the Sedna feast.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Those born in abnormal presentations are said to wear women's dresses at the
    Sedna feast and make their round opposite to the movement of the sun.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Captain Spicer reports that the bird used for first clothing is selected according
    to a monthly rule; the author says waterfowl are used in summer and ptarmigan
    in winter, and that men at the autumn feast are called ducks or ptarmigans according
    to birth season.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: As long as any portion of the navel string remains, a strip of sealskin is
    worn around the belly.
  category: object
  evidence_refs:
  - ev:11
