canonical_text:
  quote: ''
  summary: The passage describes Baffin Land and neighboring Arctic travel routes,
    settlement reports, intertribal relations, seasonal movements, hunting resources,
    crossings over ice and isthmuses, and reported contact between groups around North
    Devon and Ellesmere Land.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Isthmuses and low peninsulas facilitate travel between settlements, and travelers
    cross them to shorten journeys and avoid rough ice near headlands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several named passes connect fjords, bays, isthmuses, and peninsulas, including
    routes near Padli Fjord, Kangertloaping, Tessiujang, Qivitung, Home Bay, Koukteling,
    Niaqonaujang, Aqojang, and Aqojartung.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: River Clyde and Aqbirtijung are reported as irregularly visited by Akudnirmiut,
    and Aqbirtijung and Kangertlualung may sometimes be visited by Tununirmiut of
    Pond Bay.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Aggomiut are described as having two subtribes, the Tununirmiut and Tununirusirmiut,
    with scanty reports about them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Aggomiut are reported to winter near Navy Board Inlet and Eclipse Sound,
    and they pursue seals, white whales, and narwhals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Aggomiut connection with the Iglulirmiut is described as important because
    it maintains regular intercourse between the American continent and the eastern
    shore of Baffin Land.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Routes are described between Kangertlukdjuaq and Anaulereëling, possibly to
    Eχaluin, and from Kangertlung through Angmang toward Tununirusirn.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: In favorable winters the Aggomiut cross Lancaster Sound by way of Uglirn and
    winter on eastern Tudjan, while keeping some intercourse with inhabitants of Umingman
    Nuna.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Informants say travelers cross the ice-covered island on sledges, reach the
    northern shore in four days, and continue toward Nedlung, where swift tide keeps
    a water hole open through winter.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The area around the open water hole forms a spring basin with many seals.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: After reaching Umingman Nuna, the informants say they met a small tribe residing
    on that shore and lived there for some time because seals were abundant year-round.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Eskimo are said not to visit land beyond Kangertluksiaq because bears
    there are reported to be very numerous and large.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage states that migrations to Jones Sound continue, including examples
    of a known family visiting Smith Sound and another person returning from a long
    stay on Tudjan and Nedlung.
  category: sequence
  evidence_refs:
  - ev:10
