canonical_text:
  quote: ''
  summary: Ethnographic description of Central Eskimo sledges, runners, shoeing, antler
    backs, thongs, clasps, dog harnesses, sealing use of dogs, substitute sledge materials,
    and regional variations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For much of the year, ice and snow provide the main passable road, so sledges
    are used for travel.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hudson Strait and Davis Strait model has two long runners, cross bars,
    and a back made from deer antlers with the skull attached.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The runners may be shod with whalebone, ivory, or whale jawbone; wider shoeing
    near the front helps the sledge move through soft snow.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Sledge shoes may be tied or riveted to the runners, with recessed drill holes
    used to avoid friction when lashed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cross bars have notched projecting ends used for fastening load lashings;
    thongs and wedges tighten the fastenings to the runners.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The antler back functions as a steering and pulling handle, a lashing point,
    and a place to hang the snow knife and harpoon line.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: A stout thong called the pitu passes through the foremost runner holes and
    fastens the dogs’ traces to the sledge by a loop and clasp arrangement.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: One artistic clasp design is described as representing an animal head with
    a gaping mouth.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Dogs wear sealskin or deerskin harnesses with bights under the forelegs, straps
    over the breast and neck, and traces running from the back to the sledge.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: During sealing, a dog may be detached from the sledge so it can lead the hunter
    to a breathing hole.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Other sledges are made from whale bone, frozen walrus or seal skin bags, frozen
    salmon, slabs of freshwater ice, or hollowed ice blocks.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: In Boothia, frozen salmon used as sledge material in winter may be eaten in
    spring.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Parry reports that Iglulik people detach antlers from the sledge in winter
    for sealing, while Davis Strait groups generally keep antlers on their sledges.
  category: relationship
  evidence_refs:
  - ev:10
