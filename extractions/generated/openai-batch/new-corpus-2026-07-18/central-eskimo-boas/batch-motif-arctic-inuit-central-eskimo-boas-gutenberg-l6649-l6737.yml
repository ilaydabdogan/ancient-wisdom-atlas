canonical_text:
  quote: ''
  summary: 'Ethnographic account of summer customs among the Central Eskimo: seasonal
    movement from snow houses to tents, summer fishing and hunting, drying and caching
    food, travel to deer passes and lakes, communal cooking and eating, post-meal
    performance and games, a religious restriction on working summer deerskins before
    ice forms, fall movement toward winter settlements, winter hut preparation, deerskin
    preparation, and winter religious feasts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: As the sun grows warmer and snow-house roofs collapse, families live in uncomfortable
    temporary shelter until enough sealskins are obtained for tents.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women split large skins, dry them on snow, and later sew and put up the large
    tent at the summer village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In summer salmon and venison are staple foods; salmon and birds may be eaten
    raw, while surplus salmon and venison are dried for later use or travel.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: When men go deer hunting, they carry dried salmon and butcher killed deer
    by removing the skin, tying the paunch, cutting off parts, and covering piled
    remains with stones when needed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: People visit deer passes and lakes and establish huts near them during the
    summer season.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tents and household goods are packed in heavy bundles carried by dogs and
    by men and women using straps over the forehead and breast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In summer settlements a single woman, by turn, cooks for the whole settlement
    rather than each family cooking separately.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The cooking place consists of three stones near the hut with the opening facing
    the wind; a kettle is set on top and the fire is fed with shrubs and blubber.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the meal is ready, the master of the house calls “Ujo! Ujo!” and people
    come from the hut with knives.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the shared meal, men sit in one circle and women in another; meat and soup
    are passed around.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Evening dinners are commonly accompanied by mimic performance, including singing,
    dancing, face-making, and a favored act involving a blackened face, head thong,
    writhing, and grimaces.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After dinner men chat or gamble before the huts, while women and children
    run about, play ball, or dance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A religious custom forbids working summer-obtained deerskins before ice has
    formed; the skins are dried and tied in bundles instead.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: In fall the people travel quickly toward winter settlements with boats loaded
    with the summer hunt’s spoils.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: When it becomes colder, several families may join to build a common hut from
    tent poles, cover it with a double roof, raise beds and lamp platforms, and move
    cooking indoors.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: After the first seals are harpooned, deerskins are brought in if cached, distributed
    for winter clothing, and dressed; the passage reports regional differences in
    distribution and skin-dressing labor.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The great religious feasts are celebrated at this season and are described
    as announcing the commencement of winter.
  category: sequence
  evidence_refs:
  - ev:9
