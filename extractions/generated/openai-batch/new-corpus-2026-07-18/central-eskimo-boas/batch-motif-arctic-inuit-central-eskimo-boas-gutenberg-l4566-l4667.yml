canonical_text:
  quote: ''
  summary: The passage describes Central Eskimo methods for hunting or trapping wolves,
    foxes, hares, ermines, lemmings, waterfowl, gulls, partridges, ducks, swans, geese,
    and one goose species called kango. The techniques include snow and ice pit traps,
    baited knives, whalebone devices, snares, nooses, snow houses, kayaks, and stone
    enclosures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wolves are pursued when they become troublesome around winter villages, where
    they attack store rooms or dogs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wolf pit trap is dug in snow, covered with a snow slab bearing bait, and
    surrounded by a wall that forces the wolf to leap and break through the roof into
    the narrow pit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: One wolf-killing method uses a blood-smeared knife edge protruding from snow;
    another uses a coiled whalebone strip wrapped in blubber or meat that opens inside
    the wolf after the sinews dissolve.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A described ice-house trap has a sliding ice door held by a line attached
    to bait; when the animal pulls the bait, the door falls and closes the trap.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Foxes are caught in an ice house with a roof hole, blood sprinkled near the
    hole, and bait on the floor, so that the fox jumps in and cannot escape.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Other fox traps include a falling ice slab and a lime-kiln-shaped trap in
    which a bending whalebone lets foxes drop into confinement.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Hares are killed with small shot or arrows, and hares, ermines, and lemmings
    are caught with whalebone snares.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Waterfowl are caught with whalebone nooses set along lake edges, across shallow
    water, or on nests; ducks, swans, and geese are included among the birds taken
    this way.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Gulls are caught from a flat snow house by placing bait on a thin translucent
    roof block and pulling the bird through the roof when it lands.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: During molting season, partridges can be caught by hand, while waterfowl are
    pursued by kayak, repeatedly frightened into diving, and eventually drowned.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Kango geese are driven toward a circular stone wall with one entrance, follow
    one leading man inside, and are then shut in and slaughtered; on water they may
    be encircled by kayaks and driven shoreward first.
  category: sequence
  evidence_refs:
  - ev:11
