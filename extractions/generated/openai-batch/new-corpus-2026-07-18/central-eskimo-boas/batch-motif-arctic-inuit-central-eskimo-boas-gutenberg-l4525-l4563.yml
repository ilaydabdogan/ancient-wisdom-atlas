canonical_text:
  quote: ''
  summary: 'The passage describes Central Eskimo winter hunting methods for deer,
    musk ox, and polar bear: snow pit traps and lures for deer; dogs, close-quarters
    weapons, and herd encirclement for musk ox; sledges and released dogs to bring
    polar bears to bay; seasonal pursuit of bears and winter den killing; and the
    later easing of dangerous hunts through firearms.'
