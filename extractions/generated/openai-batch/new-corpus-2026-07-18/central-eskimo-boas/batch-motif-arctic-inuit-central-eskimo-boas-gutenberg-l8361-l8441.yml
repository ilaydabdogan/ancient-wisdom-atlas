canonical_text:
  quote: ''
  summary: The passage describes regulations after childbirth, observances following
    the death of an infant, naming practices before and after birth, ritual name changes
    for sickness, consecration of a sick person to Sedna as a dog, isolation of the
    fatally ill, disposal of belongings when death occurs in a hut, and a dying girl's
    request for tobacco and bread to take to her deceased mother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After childbirth, the mother must observe numerous food and work regulations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a year after childbirth, the mother may not eat raw meat or part of an
    animal killed by a shot through the heart; in Cumberland Sound a shorter rule
    is described for eating only meat killed by her husband or by a boy on his first
    hunt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two months after delivery, the mother must call at every hut, while before
    that time she may enter only her own; she must also throw away her old clothing
    at the end of the period.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the western shore of Hudson Bay, the mother may re-enter the hut a few
    days after delivery but must enter by a separate opening cut through the snow
    wall.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:5
  text: The mother keeps a small skin bag near her and puts a little food into it
    after each meal, a practice called laying up food for the infant, although the
    infant is not given the food.
  category: object
  evidence_refs:
  - ev:1
- id: obs:6
  text: Parents are not allowed to take part in the Sedna feast during the first year
    after a child's birth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:7
  text: After an infant dies, the mother must cover her head outside the hut for a
    year, and if a ground seal is caught she must replace the old cap with a new one.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The parents carry the deceased child's boots while traveling and bury the
    boots in snow or under stones when they stop.
  category: object
  evidence_refs:
  - ev:2
- id: obs:9
  text: After an infant's death, neither parent may eat raw flesh for the following
    year, and the woman must cook in a small pot used only by her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: If the bereaved mother enters a hut, men sitting inside must first come out;
    if she leaves the hut, she must walk around any men present.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:11
  text: A child may be named before birth when a relative or friend lays a hand on
    the mother's stomach and decides the infant's name; the names described can serve
    either sex.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: On Davis Strait, a child is named after persons who have died since the last
    birth, and if a relative dies while the child is still young, the relative's name
    is added to the child's earlier names.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:13
  text: When a person falls sick, the angakut may change the person's name to ward
    off disease or consecrate the person as a dog to Sedna, giving a dog's name and
    requiring a harness over the inner jacket throughout life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: Friends sometimes exchange names, and dogs may be called by a friend's name
    as a token of regard.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:15
  text: When a disease is feared fatal, a small snow house or hut is built, the patient
    is carried in through a back opening, some food is placed inside, and the patient
    is left without attendants.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: When death is impending, the sick person's house is shut and the person is
    left alone to die.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: If a person dies in a hut among its inmates, everything belonging to the hut
    must be destroyed or thrown away, although tent poles may be used again after
    a year.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: If a child dies in a hut and the mother immediately rushes out with the child,
    the hut contents may be saved.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:19
  text: The passage says the Eskimo feel great awe in touching a dead body, but that
    the sick await death calmly.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:20
  text: A young dying girl asked for tobacco and bread to take to her mother, who
    had died a few weeks before.
  category: speech
  evidence_refs:
  - ev:7
