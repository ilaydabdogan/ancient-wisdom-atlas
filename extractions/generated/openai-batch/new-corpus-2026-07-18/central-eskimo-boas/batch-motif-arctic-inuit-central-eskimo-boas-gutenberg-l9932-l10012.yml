literal_observations:
- id: obs:1
  text: The Eskimo are described as having detailed geographical knowledge, including
    distances reckoned by day journeys or sleeps and directions by cardinal points.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Directional names are associated with weather or winds, and the passage lists
    regional directional terms for Cumberland Sound, Nettilling, Akudnirn, and Iglulik.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: In clear weather, steering uses the sun, dawn, moon, and stars; in thick weather
    it uses wind; in calm weather travel stops; after gales, snowdrift direction is
    observed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:4
  text: 'The passage names several constellations distinguished by the Eskimo: Tuktuqdjung
    as the deer or Ursa Major, Sakietaun as the Pleiades, and Udleqdjun as Orion''s
    belt.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:5
  text: For travel to a less familiar country, a knowledgeable person may draw a map
    in the snow for the traveler.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: The map-drawing method begins with well-known relative points, may use a hilltop
    view, and then adds details.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Eskimo charts are described as accurate enough to compare with maps; one chart
    represents a distance of about five hundred miles.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The calendar divides the year into thirteen months and occasionally omits
    the month called siringilang, associated with the period without sunrise.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Days of the month are designated by the moon's age, while years are not reckoned
    for more than two years backward or forward.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage describes drawings, carvings, animal representations, tale illustrations,
