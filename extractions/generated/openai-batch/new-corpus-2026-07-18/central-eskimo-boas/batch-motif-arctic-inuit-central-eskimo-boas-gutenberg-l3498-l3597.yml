  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The modern unang in Baffin Land and on the western shore of Hudson Bay has
    a wooden shaft with an iron rod sunk into it and additional fittings including
    an ivory ring or string, a bent nail eye, an ivory hand support, a loop, and an
    iron point.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The unang is carried on winter excursions, kept within reach on the sledge,
    and used for cutting hummocks, cutting holes through ice, breaking frozen meat,
    testing ice strength, and testing snow depth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The harpoon head belonging to the unang is called naulang.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The old naulang was made of bone or ivory, had a metal insert, and turned
    at a right angle under strain so that it acted as a toggle.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Two lower points called uming, or beard, pressed into the animal's flesh or
    skin and helped prevent the harpoon head from slipping back.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The modern naulang is about the same length as the old form but more slender,
