  text: The seal, particularly Pagomys foetidus, is described as the staple food of
    the Central Eskimo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Seal hunting methods differ by season because the animal's life depends on
    the state of the ice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In winter the seal uses smooth floe ice several miles from the coast and scratches
    breathing holes through the ice.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Where the ice edge is far from settlements, seals are obtained by watching
    for them at breathing holes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A light harpoon called unang is used in the pursuit of seals.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The older unang had a shaft with an ivory point attached by thongs and rivets,
    and another ivory piece at the opposite end, generally forming a knob.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The shaft material of the older unang varied by region and could include wood,
