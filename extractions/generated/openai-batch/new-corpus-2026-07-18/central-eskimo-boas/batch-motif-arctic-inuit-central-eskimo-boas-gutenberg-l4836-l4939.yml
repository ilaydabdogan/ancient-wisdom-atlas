canonical_text:
  quote: ''
  summary: Ethnographic description of Central Eskimo methods for scraping, washing,
    softening, cutting, chewing, drying, and using seal, walrus, whale, deer, bear,
    fox, ermine, bird, salmon, and seal-intestine materials for clothing, lines, boat
    covers, bags, sails, windows, and kayak jackets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dried skins are cleaned with a sharp scraper called tesirqun; the modern form
    has a tin scraping piece, while the old form was made of deer shoulder or other
    bone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After scraping, skin is soaked in salt water, washed, dried, and softened
    with a straight scraper called seligoung.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Very old stone scrapers were found in graves; the author states that their
    sharpened stones make it probable they were used for cleaning skins.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Skins of Phoca annellata, Phoca cristata, and Phoca grœnlandica are prepared
    in the same way as the preceding skins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Skins intended for kayak covers, boots, mittens, quivers, and similar uses
    are treated with hot water or placed in a brook until the hair loosens, then worked
    on both sides with the ulo.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: For maximum softness, a skin may be allowed to become putrid before the hair
    and blubber are removed and the skin is hung in the sun until light-colored.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The large ground seal has a very thick and durable skin suitable for lines,
    traces, lashings, harpoon lines, soles, drinking cups, and boat covers.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Ground seal hide for lines is cut in cylindrical rings around the body and
    then cut spirally to make a long strip, which is stretched taut between rocks
    while drying.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Walrus hide is cut up as soon as the walrus is killed, divided into as many
    parts as there are hunt partners, rolled in skin, and carried home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Walrus and ground seal hide become board-stiff when dry and are chewed until
    thin and pliable before further scraping, softening, or stretching.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Lines made from white whale hide are shorter because the hide must be slit
    along the spinal column; lines from Pagomys fœtidus skins are described as weak
    and inferior to ground seal hide lines.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Deerskins are dried in summer and dressed after the ice forms; they are curried
    rather than tanned.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: In Oqo and Akudnirn women prepare deerskins, while in Hudson Bay men are said
    to do this work.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Deerskin preparation includes hanging, scraping, drying, wetting the flesh
    side, wrapping, scraping again, chewing, rubbing, and scraping until the skin
    becomes pliable, soft, and light-colored.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: In spring, bear and seal skins may be dried on large sun-exposed frames and
    tied to the frames with thongs.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:16
  text: Foxes and ermines are skinned by stripping the whole animal through the mouth
    without cutting the skin, while birds are opened or stripped in smaller cuts and
    cleaned by sucking out fat and chewing.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Salmon skins are used for waterproof bags, and dried, sewn seal intestines
    are used for sails, windows, and kayak jackets.
  category: object
  evidence_refs:
  - ev:11
