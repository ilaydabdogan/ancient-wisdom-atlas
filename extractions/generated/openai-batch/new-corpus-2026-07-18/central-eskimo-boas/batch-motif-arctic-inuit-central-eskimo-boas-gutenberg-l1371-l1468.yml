  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Food is generally plentiful from April to October, while winter sealing is
    harder but usually sufficient except during continuous bad weather.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: At Naujateling, fall huts are erected on the mainland or nearby islands because
    seals enter narrow channels and fjords, and islands provide shelter from gales
    for frail boats.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: After pack ice consolidates, the people move their huts toward the sea, leaving
