canonical_text:
  quote: ''
  summary: The passage discusses causes of famine among Baffin Island Inuit groups,
    emphasizing weather, ice conditions, inability to reach game, interruption of
    hunting, travel mishaps, and mourning restrictions rather than absolute lack of
    animals. It then describes seasonal settlement movements and seal-hunting practices
    around Cumberland Sound, including spring hunting of young seals in rough ice,
    snowbank excavations, and ice caves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage rejects the view that the Eskimo are dying out because hunters
    have reduced the seal population; it states that seals remain numerous and the
    human population is small relative to seal territory.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Famine may occur when autumn floe formation is delayed, preventing hunters
    from using boats or hunting at the floe edge before seals open breathing holes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Niaqonaujang in late 1883, gales broke the floe, new ice prevented sealing,
    blubber ran out, and inhabitants killed and ate most of their dogs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The loss of dogs made the following hunting season poor because dogs were
    used to scent seal breathing holes and allowed travel away from the settlement.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In winter, prolonged bad weather prevents hunters from leaving huts and can
    cause privation.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: If someone dies during such a time, famine is described as inevitable because
    a strict mourning law forbids work during the mourning days.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author states that known famines arose from inability to reach game, not
    from absolute want of game.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: Traveling parties unfamiliar with a region may lack food; examples include
    boat crews on the eastern shore of Fox Basin and women and children on islands
    of Nettilling.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Some families traveling from Akuliaq to Nugumiut were left near Qairoliktung
    while men went by kayak to borrow boats; storms delayed the men, and the families
    starved and resorted to cannibalism.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A woman named Megaujang is singled out as having eaten all her children and
