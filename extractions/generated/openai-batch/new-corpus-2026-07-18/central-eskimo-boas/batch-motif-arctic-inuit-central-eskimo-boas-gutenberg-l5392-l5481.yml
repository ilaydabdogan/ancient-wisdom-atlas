canonical_text:
  quote: ''
  summary: The passage describes practical handling of dog teams and sledges, including
    discipline, stopping and steering, harness and trace hazards on rough ice, seasonal
    care of dogs’ feet, crossing cracks in floe ice, raising and training young dogs,
    feeding practices, self-provisioning dogs, and regional dog disease.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a named lazy dog is to be lashed, the driver must strike that dog; striking
    another can trigger conflict among the dogs and leader, resulting in a fighting
    team that must be waited out before traces are cleared.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The driver places mittens and whip carefully on the sledge because the leader
    may start the team as soon as the traces are strung, before the driver is ready.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: To stop or recover a dropped object, the driver may drive in a wide circle,
    dig heels into the snow, stand before the sledge, and make the dogs lie down by
    gently lashing their heads.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sledge is steered with the legs, usually the driver’s right foot, and
    can be pulled aside by the head or by deer’s antlers when avoiding a large hummock.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two riders on a long drive are instructed not to speak to one another because
    the dogs will stop, turn around, sit down, and listen.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The described harnessing method is defended as effective on rough ice, where
    other arrangements would cause cross pieces to break against hummocks.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Traces can catch on projecting ice or sledge runners, pulling dogs back or
    dragging them; the driver must lift or reposition traces, including traces caught
    between a dog’s hind legs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sledges are not used until ice is well covered with snow, because autumn salt
    crystals hurt dogs’ feet; in late spring sharp ice needles require leather foot
    coverings tied to the dogs’ legs.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Cracks in the floe are crossed by narrow snow bridges or by floating across
    on a drifting piece of ice.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Eskimo rarely raise more than three or four young dogs at once; pups are
    nursed, may lie on the couch or hang over the lamp in skin, and are put to the
    sledge at about four months old.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Dogs are fed small portions every other day when food is plentiful, receive
    seal parts in winter, eat leather when possible, and may go without food for five
    or six days during travel.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: In some regions dogs are taken in summer to small islands where they feed
    on beach foods; the narrator recalls two runaway dogs that lived independently
    from April to August and returned fat.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: Dog disease troubles the Arctic regions described, though it is said to be
    unknown in Davis Strait and Aggo; team numbers and losses differ by region.
  category: other
  evidence_refs:
  - ev:9
