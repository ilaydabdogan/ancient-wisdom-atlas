canonical_text:
  quote: "“New sun--new light”"
  summary: 'The passage describes several Inuit feast and greeting practices: annual
    extinguishing and rekindling of lights, Akudnirn masked performers called mirqussang,
    singing and pairing ceremonies, a shooting match, and formalized combat games
    used to welcome strangers. It also records the text’s own cautious comparisons
    with Oqomiut, Akudnirn, Ungava Bay, Hudson Bay, Davis and Hudson Strait, and Greenland
    practices.'
  language: English
