literal_observations:
- id: obs:1
  text: At a time corresponding to New Year’s day, two men, one dressed to represent
    a woman, go to every house in the village and blow out the light in each house;
    the lights are later rekindled from a fresh fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Taqulitu explained the act with the phrase “New sun--new light,” implying
    a belief that the sun was renewed for the year at that time.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author notes that Hall did not see the feast himself and relied on an
    Eskimo description into which Hall introduced points of similarity with Christian
    feasts.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Akudnirn, the qailertetang do not act a part; masks called mirqussang take
    their place and represent a man and his wife.
  category: object
  evidence_refs:
  - ev:5
- id: obs:5
  text: The mirqussang wear ground-seal-skin masks, have gender-differentiated hair
    arrangements, have their left legs tied so that they hobble, and carry a skin
    scraper.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Inuit hold a long sealskin thong before the mirqussang to keep them from
    entering huts; if the mirqussang fall while crossing it, they are beaten with
    a whip or sticks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the mirqussang enter the huts, they blow out all the fires.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Akudnirn, the conjuration of Sedna and the exchange of wives are said to
    be practiced, while other previously described parts of the Cumberland Sound feast
    are not customary.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When it is dark, Inuit run around the settlement crying, climb onto the roofs
    of houses where anyone is asleep, and rouse people until all assemble outside.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A mirqussang man sits in the snow holding a knife and sings, while the mirqussang
    woman moves her body and arms to keep time and throws snow on bystanders.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The company enters the singing house for dancing and singing; later the mirqussang
    lead each woman to one of the men outside.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Each paired man and woman re-enters the singing house, walks around the lamp
    while others cry out, and then goes to the woman’s hut for the night.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: On the following day, men may hold a shooting match; when a man hits the target,
    women rush forward and rub noses with him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Among southeastern tribes, an unknown visiting stranger is welcomed with a
    feast in which a host strikes the stranger on the right cheek and then awaits
    the stranger’s reciprocal blow.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: During the southeastern greeting contest, other men play ball and sing until
    one of the combatants is vanquished.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Among western tribes, greeting ceremonies include boxing, wrestling, knife
    testing, and the game of hook and crook, in which two men try to stretch out each
    other’s bent arm.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: The stated meaning of the duel is that the two men wish to know which of them
    is the better man.
  category: speech
  evidence_refs:
  - ev:12
