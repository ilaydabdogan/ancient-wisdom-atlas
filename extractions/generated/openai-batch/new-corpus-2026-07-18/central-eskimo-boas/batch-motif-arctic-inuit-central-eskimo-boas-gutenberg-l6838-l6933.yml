  quote: ''
  summary: The passage describes inheritance after death, voluntary adopted dependents,
    seasonal visitors, household arrangements, limited settlement leadership, a newcomer
    duel ceremony, hunting distribution rules, lost-object and escaped-game rules,
    blood vengeance, reconciliation, and consensus-sanctioned killing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A great part of a man's personal property is destroyed at death or placed
    by his grave, leaving only certain listed objects for inheritance.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first inheritor is the eldest son living with the parents; sons and daughters
    with households of their own do not inherit, and an elder adopted son has preference
    over a younger son born in the marriage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some men are adopted into servant-like but voluntary positions, performing
    minor occupations, sometimes hunting, and following the household head when he
    moves.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Strangers visiting friends for a season may occupy a similar household position;
    if the host has more than one wife the visitor may receive a wife, and if the
    visitor has hunting gear, sledge, and dogs, he may arrange a separate fireplace.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In summer most families have their own tent, while in fall two to four families
    may join in building a house.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: A shared fall house may place parents on one side, a son-in-law's family on
    the other, and a friend or relative in a recess; some houses share entrances or
    communicating passages.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The inhabitants of connected or shared house sections usually live independently,
    while the oldest man of each house has some influence over housemates.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Where distance or specialized knowledge of game is important, a pimain or
    issumautang may be recognized, but his authority is limited and nonbinding.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Every family may settle where it likes except when visiting a strange tribe,
    in which case the newcomer undergoes a ceremony chiefly consisting of a duel with
    a local person.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: If the newcomer in the duel is defeated, he risks being killed by those among
    whom he has come.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: When food is scarce and a seal is brought to the huts, everyone is entitled
    to a share of meat and blubber, distributed by the hunter or carried to huts by
    his wife.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In times of plenty, only housemates receive a share of a seal.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A ground seal belongs to all men who take part in the hunt; a walrus is divided
    into parts for the hunters, with the first striker choosing first and receiving
    the head; a whale belongs to the whole settlement and is celebrated by a feast.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: A bear or young seal belongs to the man who first saw it, regardless of who
    kills it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Lost objects must be restored to a known owner, but game is excepted; an escaped
    animal later found by another man belongs to the finder, and in Hudson Bay the
    finder may also keep the harpoon and line.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage states that unwritten laws have no enforcement and no punishment
    for transgressors except blood vengeance.
  category: other
  evidence_refs:
  - ev:9
- id: obs:17
  text: The nearest relative of a murdered victim has both the right and the duty
    to kill the murderer; in some cases a relation of the murderer is killed if the
    murderer cannot be apprehended.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: A feud may last a long time, may pass to a succeeding generation, and may
    sometimes be settled by mutual agreement.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: As a sign of reconciliation, both parties touch each other's breasts and say
    Ilaga, translated as 'my friend.'
  category: speech
  evidence_refs:
  - ev:9
- id: obs:20
  text: A man regarded as a murderer or as odious by other outrages may be killed
    after the intended avenger asks countrymen individually whether the offender deserves
    death and all agree.
  category: sequence
  evidence_refs:
  - ev:10
