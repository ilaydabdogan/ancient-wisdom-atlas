canonical_text:
  quote: ''
  summary: Ititaujang is refused by an orphan girl because of his name and leaves
    his country. In the land of birds he steals boots from geese and returns one bird’s
    boots only after she agrees to become his wife. With the boots on she becomes
    a woman; they settle by the sea and have a son. She later refuses whale meat and
    work, gathers feathers, and transforms herself and the child into geese who fly
    away. Ititaujang pursues her inland and meets Eχaluqdjung, a salmon-maker with
    a dangerous hollow back, who tells him that his wife lives on an island with another
    husband and gives him a salmon backbone that will become a kayak if he keeps his
    eyes shut.
  language: English
  quote_policy: summarized
