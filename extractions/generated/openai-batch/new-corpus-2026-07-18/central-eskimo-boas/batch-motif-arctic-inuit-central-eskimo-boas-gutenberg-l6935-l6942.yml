  quote: ''
  summary: The passage describes a feud custom in which a murderer may visit and temporarily
    live with the relatives of his victim, despite their right to kill him in revenge.
    After being welcomed, he may later be challenged to wrestle and killed if defeated;
    if he wins, he may kill someone from the opposing party. He may also be ambushed
    and killed while hunting.
