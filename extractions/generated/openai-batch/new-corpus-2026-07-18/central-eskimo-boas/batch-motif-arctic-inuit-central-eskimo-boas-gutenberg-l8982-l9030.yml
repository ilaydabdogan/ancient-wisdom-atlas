canonical_text:
  quote: ''
  summary: Kiviung continues traveling along the shore, encounters a hut where a driftwood
    son-in-law provides seals until it disappears, marries the widow, flees after
    the widow's mother murders her and wears her skin, avoids another hut after seeing
    Aissivang's alarming behavior, and finally returns to his own country where his
    grown son has become a whale hunter and his wife returns to him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kiviung travels for many days and nights along the shore, reaches a hut with
    a burning lamp, and enters because he is wet and hungry.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inside the first hut are a woman and her daughter; the daughter's son-in-law
    is a log of driftwood with four boughs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The driftwood is carried to the beach at low water, swims away when the tide
    comes in, and returns at night with eight large seals fastened two to each bough.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The driftwood provides food for its wife, her mother, and Kiviung, but one
    day after being launched it leaves and never returns.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Kiviung marries the young widow, becomes a successful seal hunter, and secretly
    accumulates mittens by pretending each night that he has lost them while actually
    hiding them in his hood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The old woman becomes jealous of her daughter, murders her while Kiviung is
    away, removes the daughter's skin, and enters it, changing her shape into that
    of the young woman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Kiviung returns, the disguised old woman meets him without immediate
    suspicion, but he sees his wife's bones in the hut, recognizes the murder and
    deception, and flees.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kiviung resumes traveling along the shore, reaches another lamp-lit hut, and
    looks through a peephole before entering.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the second hut, an old woman named Aissivang, identified parenthetically
    as spider, sees Kiviung's dark figure at the window, thinks it is a cloud, becomes
    angry, cuts off her eyebrows with a knife, eats them, and continues sewing despite
    the blood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kiviung decides Aissivang must be a bad woman and turns away from the hut.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After more travel, Kiviung reaches land that seems familiar, recognizes his
    own country, and sees boats coming to meet him while towing a whale carcass.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: A stout young man in the bow of one boat had killed the whale; he is Kiviung's
    son, left as a small boy but now grown and a great hunter, and Kiviung's wife,
    who had taken a new husband, returns to him.
  category: relationship
  evidence_refs:
  - ev:5
