candidate_motifs:
- id: motif:1
  label: Related sea-woman or underworld-mistress mythic cycle
  taxonomy_refs: []
  basis: The passage explicitly states that Arnaquagsaq, Sedna, and Nuliajoq most
    probably proceed from the same myth and that central traditions give this figure
    strong religious importance.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage notes that traditions differ as related by travelers; the
    exact identity relations are not fully resolved.
- id: motif:2
  label: Overlap between Sedna cycle and Adlet/European origin legend
  taxonomy_refs: []
  basis: The passage reports nearly identical elements between Sedna's myth and the
    origin legend of Europeans and Adlet, including maiming of an elder, the name
    Savirqong, and the dog as progenitor.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage says the myths are confused and in part almost identical,
    but does not provide the full origin legend here.
- id: motif:3
  label: Creation of game animals during famine by magical transformation
  taxonomy_refs: []
  basis: Both local versions describe a woman creating deer/reindeer and walrus during
    famine by transforming fat or clothing through magic.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The woman's identity with Sedna is probable in the passage but not certain
    across all versions.
- id: motif:4
  label: Etiological explanation of animal anatomy and hunter danger
  taxonomy_refs: []
  basis: The traditions explain deer teeth and tail, and the distribution of horns
    and tusks between deer and walrus, through actions taken after the created animals
    prove troublesome or dangerous.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The two local versions explain different anatomical arrangements.
- id: motif:5
  label: Taboo separating sea animals and reindeer under Sedna's authority
  taxonomy_refs: []
  basis: The passage says the use of sea animals and reindeer in the same period is
    forbidden through fear of offending Sedna and that observances concerning walrus
    and deer are commanded by Sedna.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: The passage states that Boas could not learn any other reason for the
    prohibition.
- id: motif:6
  label: Upper and lower afterlife map
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage contrasts Adlivun/Adliparmiut below with Qudlivun/Qudliparmiut
    above and describes different conditions and destinations for the dead.
  evidence_refs:
  - ev:9
  - ev:11
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage notes that a more detailed conception of a series of places
    was not found.
- id: motif:7
  label: Guardian dog at the threshold of the dead
  taxonomy_refs:
  - afterlife_journey_map
  basis: The dog lies across Sedna's threshold and moves aside only enough to allow
    souls to pass into the dwelling.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage does not describe any test by the dog beyond guarding and
    limited passage.
- id: motif:8
  label: Temporary detention of souls in a dark underworld dwelling
  taxonomy_refs:
  - afterlife_journey_map
  basis: Souls seized by Anguta are carried to Sedna's dwelling and must remain in
    the dismal abode for a whole year, lying beside Anguta while he pinches them.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage does not specify what happens to these souls after the year.
- id: motif:9
  label: Moral and circumstantial criteria for happy afterlife
  taxonomy_refs:
  - afterlife_journey_map
  basis: Hall's quoted account says good Inuit, those kind to the poor and hungry,
    those happy in life, and those killed by accident or suicide go to the happy place.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: This criterion appears in Hall's quoted observation; the passage does
    not further explain the mechanism of assignment.
comparison_claims:
- id: claim:1
  claim: The passage supports a cautious same-motif comparison between Arnaquagsaq,
    Sedna, and Nuliajoq as related forms of one mythic figure or cycle.
  claim_level: same_motif
  target: Arnaquagsaq, Sedna, and Nuliajoq traditions
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The source explicitly says the traditions differ in travelers' reports,
    so the claim is probable rather than definitive.
- id: claim:2
  claim: The passage supports a cautious same-motif comparison between the Sedna myth
    and the origin legend of Europeans and Adlet because they share named figures
    and maiming episodes.
  claim_level: same_motif
  target: Origin myth of Europeans and Adlet / Uinigumisuitung tradition
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: Only selected overlapping details are supplied in this passage; the
    source describes the traditions as confused and only partly almost identical.
- id: claim:3
  claim: The passage supports treating the walrus-and-reindeer origin legend as closely
    related to the Sedna tradition.
  claim_level: same_motif
  target: Sedna tradition and walrus/reindeer origin traditions
  evidence_refs:
  - ev:3
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The woman's identity with Sedna is argued as probable from observances
    and Sedna's dislike of deer, but direct identification is not available for every
    version.
- id: claim:4
  claim: The Akuliarmiut and Akudnirmiut accounts can be cautiously compared as variants
    of the same animal-origin pattern involving famine, a woman, magical transformation,
    and the creation of deer and walrus.
  claim_level: same_motif
  target: Akuliarmiut and Akudnirmiut walrus/reindeer origin traditions
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The versions differ in the materials transformed and in the anatomical
    explanations attached to the animals.
