canonical_text:
  quote: ''
  summary: The passage compares Sedna with related figures and traditions, describes
    variants of a legend in which walrus and reindeer are created during famine by
    magical transformation, and summarizes beliefs about Sedna's underworld house,
    the dead who are brought there, and contrasting upper and lower afterlife lands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Arnaquagsaq, Sedna, and Nuliajoq most probably proceed
    from the same myth, though reported traditions differ.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sedna myth is said to be confused with another myth about the origin of
    Europeans and the Adlet, with shared details involving maiming a father or grandfather
    and the name Savirqong.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A dog associated with Nuliajoq's dwelling is variously described as her husband
    or merely her dog and is generally considered the father of Erqigdlit/Adlet and
    Qadlunait/Europeans.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The simultaneous use of sea animals and reindeer is described as forbidden
    because of fear of offending Sedna; Sedna is represented as disliking deer.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In one Akuliarmiut tradition, a woman, probably Sedna, creates a reindeer
    during a famine by removing belly fat, carrying it to the hills, and transforming
    it by magic.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the reindeer resists leaving, the woman knocks out its teeth and kicks
    off its tail, explaining the deer's missing teeth and short tail.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The same woman throws another piece of fat into the water, where it becomes
    a walrus that swims away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In an Akudnirmiut variant, a woman transforms boots into deer in the hills
    and breeches into walrus at the sea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Akudnirmiut variant, deer first have tusks and no horns while walrus
    have horns and no tusks, until an old man transfers the horns to deer and tusks
    to walrus.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sedna is described as mistress of Adlivun, one of the countries to which souls
    go after death, and when invoked as such is named Idliragijenget.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Sedna's house contains no deerskins; Sedna and her father each occupy one
    side, and a dog lies at the entrance across the threshold.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: Sedna's father Anguta is unable to move, has one eye like Sedna, lies on a
    ledge under old skins, and seizes the dead.
  category: attribute
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:13
  text: The dead seized by Anguta are carried to Sedna's dwelling; the dog moves aside
    just enough for souls to pass, and the souls stay there for a year beside Anguta,
    who pinches them.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The happy land is called Qudlivun or Qudliparmiut, is upward, abounds with
    easily caught deer, and lacks snow and ice.
  category: setting
  evidence_refs:
  - ev:11
  - ev:13
- id: obs:15
  text: Adliparmiut is described as downward, dark, cold, stormy, snowy, icy, and
    a place of continual trouble.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:16
  text: The passage records names distinguishing inhabitants beneath and farthest
    below, and uppermost and farthest above, while noting that no detailed description
    of a series of places was found.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:17
  text: Hall's quoted account states that good Inuit, including those kind to the
    poor and hungry, and those killed by accident or by suicide, go to the happy place.
  category: relationship
  evidence_refs:
  - ev:14
