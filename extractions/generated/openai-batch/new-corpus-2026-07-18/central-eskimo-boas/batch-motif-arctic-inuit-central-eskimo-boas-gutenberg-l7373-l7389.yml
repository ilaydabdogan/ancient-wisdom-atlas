  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The tupilaq is not allowed to enter houses.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the angakoq perceives and announces the tupilaq’s presence, people do not
