canonical_text:
  quote: ''
  summary: The passage contrasts Iglulirmiut and Davis Strait beliefs about the soul
    after death. It describes the soul’s descent, its temporary state as a feared
    tupilaq in Adlivun, the angakoq’s role in detecting its presence, and the soul’s
    later rest as an adliparmio. It also notes a different Greenlandic use of the
    name tupilaq for a man-made destructive supernatural being, while stating that
    this idea was not found among the Central Eskimo.
  language: English
  quote_policy: summarized
