canonical_text:
  quote: ''
  summary: A woman raises a polar bear cub as her son. The bear, Kunikdjuaq, becomes
    a successful hunter and provider. Envious Inuit decide to kill him, so the woman
    warns him to leave while remaining near enough to help her. Later she meets him
    on the sea ice, asks for food, and he kills another bear for her. She skins the
    dead bear, feeds Kunikdjuaq blubber, and continues receiving his help for a long
    time.
