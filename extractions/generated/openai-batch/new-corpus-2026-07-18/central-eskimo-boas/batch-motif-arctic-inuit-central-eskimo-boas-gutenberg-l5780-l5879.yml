canonical_text:
  quote: ''
  summary: 'The passage describes Central Eskimo house and tent construction: side
    rooms, shared entrances, above-ground houses, whale-rib winter huts, elevated
    storehouses, unidentified kayak-like stone structures, spring roof changes, summer
    tents, and regional tent variants using poles, bone, skins, thongs, and stones.'
  language: English
  quote_policy: summarized
