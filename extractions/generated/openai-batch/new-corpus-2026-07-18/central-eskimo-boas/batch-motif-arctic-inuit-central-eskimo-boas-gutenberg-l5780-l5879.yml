  text: A small side room called qareang is built with poles and bones, and its ceiling
    is sewn to the ceiling of the main room.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A large slab in front of the window is used as a storeroom for two families,
    with an opening left in the middle for a spy hole.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some house plans indicate that several houses may share a common entrance.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Anarnitung, the observer found houses without passages, with above-ground
    walls made of boulders and sod and entrances made of snow.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: One winter house type uses whale ribs as wall elements, crossed at the ends,
    with poles tied over them, a double roof, snow-vault entrances, and a front rib
    serving as the door.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Ukiadliving, storehouses called ikan are made of granite pillars topped
    with flat slabs and are used to keep blubber and meat high enough to be safe from
    dogs.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Pairs of pillars near huts may support a kayak in winter to keep it from snowdrifts
