  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: In spring, warming sun causes snow-house roofs to fall, and people build only
    the lower half of a snow vault, covering it with skins.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Later in the season, people live in tents called tupiq, built with pole frameworks,
    skin coverings, an overlapping door, light-admitting membrane, and stones to steady
