canonical_text:
  quote: ''
  summary: A youngest brother named Qaudjaqdjuq is mistreated while his elder brothers
    are away. When the elder brothers return, they prepare a swift boat, provoke conflict
    around a singing house and an ermine, flee with their mother and two girls, overcome
    land and seaweed barriers through angakoq art and the mother's hair lace, settle
    in their country, give the two women to Qaudjaqdjuq, and strengthen him by whipping
    him until he can lift and throw a huge stone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three brothers lived long ago; the two elder brothers were grown and had traveled
    away for many years, while the youngest, Qaudjaqdjuq, lived with his mother in
    their native village.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Qaudjaqdjuq had no supporter and was abused by the men of the village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After returning home and hearing of the abuse, the elder brothers became angry,
    thought of revenge, and built a boat for escape.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elder brothers made and rejected two swift boats before building a third
    boat that satisfied them.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The three brothers entered the village singing house, shut it, danced and
    sang, asked their mother to bring a seat, and an ermine hidden inside escaped
    when the door opened.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Villagers pursued the ermine; one man stumbled over a boulder and died, and
    the ermine became sprinkled with blood, especially around its mouth, before hiding
    again in the singing house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the ermine escaped a second time, the villagers believed the brothers
    were inducing pursuits that would make them perish one by one, so they attacked
    the singing house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the villagers prepared to spear the brothers, the brothers opened the
    door, ran to the beach, and reached their prepared boat while the other boats
    were farther away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The brothers embarked with their mother, pretended that they could not move
    the boat, asked young women on shore for help, and took two girls aboard before
    rowing away quickly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The other Inuit manned boats and pursued them, but the brothers' boat was
    much swifter.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A high, bold land blocked their route; an angakoq brother told the passengers
    to close their eyes and keep pulling, and afterward they found that the boat had
    passed through the land, which had opened for them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A dense black mass of seaweed blocked the boat; the eldest brother told his
    mother to whip it with her hair lace, and when she did so the seaweed sank and
    opened the way.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the obstacles, the party traveled safely, went ashore in their country,
    erected a hut, and the elder brothers gave the two women taken from their enemies
    to Qaudjaqdjuq.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The elder brothers tried to make Qaudjaqdjuq strong by ordering him to lift
    a huge stone and whipping him when he failed; after the last whipping he lifted
    the boulder and threw it over the hut.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The brothers gave Qaudjaqdjuq the whip and told him to beat his wives if they
    disobeyed him.
  category: speech
  evidence_refs:
  - ev:11
