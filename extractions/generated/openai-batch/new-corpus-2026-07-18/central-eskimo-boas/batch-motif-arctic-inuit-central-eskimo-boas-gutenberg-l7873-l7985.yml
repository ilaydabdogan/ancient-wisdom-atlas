  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Singing and dancing alternate with wrestling matches and a game called hook
    and crook.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Great hunting successes, especially the capture of a whale, are celebrated
