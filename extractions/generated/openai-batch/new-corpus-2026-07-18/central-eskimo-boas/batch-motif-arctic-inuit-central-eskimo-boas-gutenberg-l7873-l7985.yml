canonical_text:
  quote: ''
  summary: The passage describes Inuit religious and secular feasts, especially winter
    gatherings in a qaggi or singing house. It details the qaggi layout, the drum
    and its performance, seating and dress, songs and dances, whale-capture celebrations,
    dedication of each singing house to a tornaq, and fall feasts connected with the
    Sedna tradition.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Feasts are described as closely connected with religious notions; summer feasts
    occur in the open air, while winter feasts use a qaggi or singing house.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eastern qaggi is described as a large unlined snow dome with a central
    snow pillar on which lamps stand.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: During assembly, married women stand next to the wall, unmarried women form
    an inner circle, men sit in the innermost row, and children stand in two groups
    by the door.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the beginning of the feast, a man takes up the drum, steps into the open
    space near the door, and begins singing and dancing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The drum is described as a skin stretched over a hoop and played with a handle
    and a wooden drumstick, with the performer keeping it in motion and striking the
    rim.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women are described as maintaining their own Inuit songs during the drum performance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women at a feast are described as wearing large pigtails, shining ornaments,
    and red apron-like decorated garments.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Every singing house is said to be dedicated to a tornaq, called the qaggim
    inua, and on this basis the performances are considered religious feasts.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Songs are composed by the singer, satiric songs are favored, and women join
    in the chorus phrase amna aya.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dancer remains on one spot, stamps rhythmically, swings the upper body,
