canonical_text:
  quote: ''
  summary: Ethnographic description of Central Eskimo burial practices, grave construction,
    grave goods, mourning restrictions, visits to the tomb, speech to the deceased,
    food offerings, and related regional variants reported by Lyon, Hall, Parry, and
    Klutschak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Only relatives are allowed to touch the body; they clothe or wrap it in deerskins
    and bury it at once.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Former tombs were often short and vaulted; a stone or snow resting on the
    body was believed to burden the soul of the deceased.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Burial orientation is described by age: the young may have their feet toward
    the rising sun and the aged in the opposite direction, with Lyon reporting more
    detailed southeast, south, and southwest orientations for different ages.'
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Objects associated with the deceased are placed by graves: hunting implements
    and utensils for men, pots, lamps, knives, and similar objects for women, and
    toys for children; models may sometimes replace the objects themselves.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Grave objects are respected and not removed while the grave’s owner is known.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage notes that graves opened by dogs or wolves and bodies devoured
    by animals are not recovered.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The body must be carried by nearest relatives; if a sledge is used, it must
    be left with the deceased, and dogs are never allowed to draw it on this occasion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After burial, relatives shut themselves in the old hut for three days, do
    not dress their hair, close their nostrils with deerskin, then leave the hut forever
    and let dogs devour what is inside.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: For a time after burial, mourners cook meals in a separate pot.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hall reported Hudson Bay mourning signs including not smoking, wearing hoods,
    attaching skin and feathers of Uria grylle to the hood and feathers to the arms,
    and male relatives wearing belts and mittens.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states it is probable that mourners avoid European-manufactured
    implements and suspend tobacco use, and that women who have lost a child keep
    their heads covered.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Some sources state that on first hearing of a relative’s death, the Eskimo
    throw themselves on the ground and cry as a mourning ceremony rather than from
    grief.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: For three or four days after a death, village inhabitants must not use dogs
    and must walk to hunting grounds; for at least one day they may not hunt, and
    women must stop all work.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: On the third day after death, relatives visit the tomb, travel around it three
    times in the direction of the sun, speak to the deceased, and promise food.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Lyon reports that Iglulirmiut inquire ceremonially whether the departed soul
    has reached Adli and whether it has plenty of food.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: Visits to the grave are repeated a year after death and when passing the grave
    in travel; food may be carried to the deceased and is expected to be returned
    greatly increased.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: Hall describes Nugumiut visitors placing deer skin, fat, and deer meat at
    a woman’s grave, eating part, placing part under a stone, shifting a knife behind
    the person, speaking to the dead, and saying the offering is food and warmth.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: The Nugumiut grave offering described by Hall excludes seal, polar bear, and
    walrus.
  category: object
  evidence_refs:
  - ev:13
- id: obs:19
  text: Klutschak reports that Hudson Bay natives avoid staying a long time on salt
    water ice near a relative’s grave.
  category: setting
  evidence_refs:
  - ev:14
