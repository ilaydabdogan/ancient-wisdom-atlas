  summary: 'The passage describes domestic technologies and dwelling arrangements:
    seasonal blubber-oil preparation, lamp and fireplace apparatus, kettles, drying
    frames, storage niches, snow-house occupancy by families, regional house-plan
    differences, and the construction and reuse of stone qarmang houses with long
