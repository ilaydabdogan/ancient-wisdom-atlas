literal_observations:
- id: obs:1
  text: Salmon are described as the most important fish and are caught abundantly
    in summer when they descend from lakes to the sea along a narrow lead between
    land floe and water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kakivang is a fishing spear with a widening handle, a central bone or
    iron prong, and two larger side prongs made of deer antler or musk-ox horn.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: When salmon are very plentiful, no bait is needed, and fishers spear them
    as they swim along.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the ice is gone, fishers catch salmon in shallow rivers using an ivory
    fish lure or bear teeth bait moved on a line, then spear the salmon with the kakivang.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A fisherman holds an ivory quqartaun in the left hand to string or kill caught
    salmon by passing its point through the gills and mouth or into the neck.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Stone dikes or weirs are built across creeks or river forks so that salmon
    pass over at high water but are cut off and speared as the water falls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In autumn some salmon remain too long in small ponds as rivers dry up; some
    ponds freeze to the bottom, and frozen fish are removed through holes cut in the
    ice in spring.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In early spring, salmon are caught through holes cut in lake ice using hooks,
    bait, and plaited deer-sinew lines held by hand or tied to short rods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that the author did not personally see fishing nets, but
    other observers reported nets among the Utkusiksalik tribe, Anderson River natives,
    and Labrador Eskimo.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
