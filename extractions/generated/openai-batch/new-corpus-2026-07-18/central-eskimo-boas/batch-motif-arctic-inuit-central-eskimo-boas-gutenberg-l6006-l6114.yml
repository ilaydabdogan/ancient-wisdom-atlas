  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women’s winter garments are described as uniformly cut and neatly sewn, with
    flaps ornamented by deerskin borders, alternating white and dark fur, and fringe;
    similar fringe also appears on some men’s outer jackets.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: During seal-hunting, jacket tails are fastened up behind with a button.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Men’s breeches and foot gear are compared with those of the Akudnirmiut, and
    pieces of hide are sewn across the soles to prevent wear.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women’s boots are described as loose around the leg, high or pointed in front,
    full on the outer side, ornamented with alternating dark and white strips, and
    supplemented in winter by a moccasin.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The dress of the Aivillirmiut is said to be similar to that of the Igiulirmiut,
    and traces from graves and Frobisher’s description are said to indicate that this
    style formerly occurred throughout Baffin Land.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: All Eskimo are said to wear mittens, with winter mittens made from young seal
    skin or deerskin and summer mittens sometimes made with two thumbs so they can
    be turned when wet.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Men’s hair practices vary by region, including long hair, short-cut forelocks,
    bands made from deer-antler skin, partial shaving, shaved tops, and short hair.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Women’s hair is parted on top and arranged either as a back bunch or knot
    with side plaits, or as small pigtails held by an ivory or brass ring.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Iglulirmiut hair arrangement described by Parry uses a tugliga, consisting
    of a deerskin strap and bone piece, wound around side locks in spiral turns.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Southampton Island hair is arranged in a bunch protruding from the forehead,
