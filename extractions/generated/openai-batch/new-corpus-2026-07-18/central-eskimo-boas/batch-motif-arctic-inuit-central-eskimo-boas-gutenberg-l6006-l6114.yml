  summary: The passage describes Inuit clothing, footwear, mittens, hair dressing,
    ornaments, and regional variations. It emphasizes gendered jacket and boot forms,
    child-carrying features in women’s jackets, seasonal and functional clothing adaptations,
    hair arrangements among different groups, feast-related hair dress, ivory combs,
    and an amulet worn on the back beneath outer clothing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women’s jackets are described with a broad long rear flap and a shorter front
    flap, while men’s jackets have a smaller rear tail and a straight or scalloped
    front.
  category: attribute
  evidence_refs:
  - ev:1
