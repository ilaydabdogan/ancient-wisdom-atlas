  quote: ''
  summary: The passage describes seasonal movements around Nettilling Fjord and Lake
    Nettilling, practical routes across ice, water holes, lakes, rivers, and passes,
    the use of cairns and cached boats, hunting activities, rare expeditions toward
    Iglulik, and reports of a failed journey inspired by accounts of a land of abundance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Most natives are described as spending winter in Nettilling Fjord, starting
    inland around the beginning of May, and returning to the sea around December.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Neqsiang, who had two wives, is described as an exceptional case of a man
    living on a small island near Koukdjuaq and not descending to Cumberland Sound.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Talirpingmiut are described as gathering in Isoa in November, descending
    toward the sea, wintering at the entrance of Nettilling Fjord, and hunting seals
    at breathing holes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In spring the Talirpingmiut hunted young seals and then traveled westward
    on sledges, using passes to avoid large tide holes and water holes.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The route includes named fjords, branches, lakes, rivers, isthmuses, tide
    holes, and land crossings, including the pass Tunukutang and the branches Qasigidjen
    and Sarbaqdjukulu.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cairns are described as erected on prominent points as way marks.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Isoa the travelers recovered skin boats and household goods left the preceding
    fall, lashed them onto sledges, and continued westward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Koukdjuaq the party established tents on the left bank of the river opposite
    Nikosiving and stayed until the ice broke up.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the ice broke up, men descended the river in kayaks, followed the coast,
    ascended Qudjitariaq, and hunted deer among lakes in Majoraridjen.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Women and old men arrived at Qarmang in large boats at the beginning of summer,
    and the whole party stayed there until the lake froze, then returned by sledge
    to Isoa and the sea.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Reports say expeditions to Iglulik were very rare, including one about 1750
    under Makulu and another about 1800 under Kotuko.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Kotuko traveled alone by kayak to Sagdlirn, found a hut, a large dog, deerskins,
    and walrus tusks, and nearly failed to find his kayak in fog on returning.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Amaroq and Sigjeriaq returned after three years and praised Piling as a land
    of plenty and abundance, encouraging three boat crews in 1835 to leave Nettilling.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The 1835 crews were disappointed, suffered misfortunes, perished on the narrow
    isthmus of Ipiuting, and were later reported by Iglulik Eskimo to have resorted
    to cannibalism.
  category: sequence
  evidence_refs:
  - ev:8
