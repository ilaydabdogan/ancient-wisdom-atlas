canonical_text:
  quote: ''
  summary: The passage describes Nuliajoq/Aiviliajoq, identified by Boas with Sedna,
    as a female being connected with sea animals who can confine them and cause scarcity
    until an angakoq visits and cuts or removes the charm in her hand. It also describes
    her dwelling, guard dog, appearance, father, and compares the account with Greenland
    and Baffin Land traditions of Arnaquagsaq/Nanoquagsaq, a spirit associated with
    the food-animal supply and visited by shamans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A female being is described as the mother, protectress, and sometimes monopolist
    of sea animals, which she may confine below, causing scarcity in the upper world.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When sea animals are withheld, an angakoq is persuaded to visit the female
    being and attempt to release the animals on which the tribe subsists.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The spell holding the animals is said to lie in the female being's hand, and
    the conjuror attempts to cut it off.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Different degrees of cutting or amputation are associated with the release
