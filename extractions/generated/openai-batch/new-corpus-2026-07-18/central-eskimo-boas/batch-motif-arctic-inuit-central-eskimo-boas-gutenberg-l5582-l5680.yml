literal_observations:
- id: obs:1
  text: A window is cut through the wall directly above the entrance; it is generally
    covered with sewn ground-seal intestines and has a central viewing hole, sometimes
    fitted with fresh-water ice.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rear half of the interior forms the bed platform, side bench areas hold
    lamps, and meat and refuse are heaped on both sides of the entrance.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The snow house is often built on a sloping face, with the entrance on the
    lower side facing the beach.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before furnishing, the vault may be lined with skins fastened by small ropes
    and toggles; the lining lies close to the lower wall and forms a lower flat roof
    in the upper part.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A small ventilation hole near the top helps the lamps draw air; cold air enters
    through the door, warms, rises to the lamps, and escapes through the skin cover
    and hole.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Moisture forms ice needles on the inside roof and can form a high ice funnel
    around the ventilation hole.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Eastern tribes use lining in permanent houses, while western and southern
    tribes are described as rarely lining snow houses or leaving walls bare and heaping
    loose snow over the building except at the window and ventilation hole.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In unlined houses, dripping from the roof is countered by applying cold snow
    to freeze drops in place, giving the roof a stalactitic appearance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The bed is made from a snowbank foundation covered with wood pieces, oars,
    paddles, tent poles, shrubs, and heavy deerskins.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A cited Iglulik arrangement uses stones, paddles, tent poles, whalebone, whalebone
