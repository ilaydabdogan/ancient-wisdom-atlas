  quote: ''
  summary: 'The passage describes the construction and furnishing of an Inuit snow
    house: the entrance window, interior banks and bed platform, skin lining, ventilation
    and heat management, regional differences in lining practices, bed construction,
    sleeping arrangement, and the soapstone lamp/fireplace with wick, fuel, and trimming
    practices.'
  language: English
