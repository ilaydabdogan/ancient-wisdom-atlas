canonical_text:
  quote: ''
  summary: The passage describes Baffin Land travel routes, former and current settlements,
    subtribal distribution, seasonal hunting grounds, weather constraints, summer
    and winter habitation patterns, and the movements of deer and other game among
    the Kingnaitmiut, Saumingmiut, Padlimiut, Qinguamiut, and related local groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In spring, tide holes between Kangidliuta and Surosirn prevent sledges from
    passing to Issortuqdjuaq or Tessiujang, so alternate routes through Qaχodlualung
    by Naqoreang or Tappitariaq are used.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A former road used by natives of Anarnitung to Nettilling crossed the entrance
    of Qaggilortung, ascended Tarrionitung, passed by two lakes, and reached Missirtung,
    thereby avoiding a longer route around a peninsula.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ruins of a third settlement of the Qinguamiut are located at Tulukan on
    Qeqertelung.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Kingnaitmiut are described as now living on Qeqerten, though formerly
    they lived in several places, including near Pangnirtung and on Miliaqdjuin.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Qeqerten is a major settlement and is favored in fall and early winter; hunting
    grounds shift from east of the islands to west of the islands as the sound ice
    consolidates.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fohn-like winds from Kingnait Fjord can confine the natives to huts for many
    days, and following weather conditions may either improve packed-snow hunting
    or contribute to want and hunger.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Young seals are pursued around Qeqerten.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Large ancient settlement ruins are reported in Pangnirtung and Niutang.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Kingnaitmiut go deer hunting at several named places, including Kitingujang,
    Nirdlirn, Pangnirtung, Eχaluaqdjuin, and Kangertlukdjuaq.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mountains and highlands near Nirdlirn and Pangnirtung are visited, while a
    deep glaciated valley connecting Cumberland Sound and Davis Strait is rarely visited.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Kitingujang is a favored settlement because salmon are caught in its river
    and neighboring highlands offer hunting excursions; deer are found on mountains,
    where they avoid mosquitoes in the valleys.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Summer travel includes movement through valleys, along the eastern shore of
    Davis Strait, and by boat to brooks entering Kingnait Fjord; fjord heads and interior-reaching
    valleys are used for tents.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The ice-covered interior is not visited because no game is found there, so
    the Eskimo are described as limited to peninsulas formed by fjords.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Saumingmiut visit southern fjords of Cumberland Peninsula to pursue deer
    and polar bears, and named summer settlements are associated with the Saumingmiut
    and Padlimiut.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Deer numbers on Cumberland Peninsula vary by season; in early spring deer
    regularly pass through Itidlirn during migrations from Narpaing to Qarmaqdjuin.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: The Saumingmiut separate in fall, with part wintering on Qeqertaujang in Ugjuktung
    and the remainder at Ukiadliving on Davis Strait.
  category: sequence
  evidence_refs:
  - ev:12
