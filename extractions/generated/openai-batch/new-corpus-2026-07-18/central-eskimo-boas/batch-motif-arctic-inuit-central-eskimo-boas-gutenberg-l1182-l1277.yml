canonical_text:
  quote: ''
  summary: The passage describes seasonal travel, hunting grounds, and routes connecting
    Inuit groups around Frobisher Bay, Lake Amaqdjuaq, Hudson Strait, Cumberland Sound,
    Davis Strait, and related regions. It also explains regional and tribal names
    such as Oqomiut, Aggomiut, and Akudnirmiut, including older Oqomiut subtribal
    divisions and the decline of separate subtribal identity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Part of the Eskimo begin traveling up Frobisher Bay in the latter half of
    March; in April, seals are hunted near islands and some people move northwest
    toward basking seals, intending to reach the head of the bay in July.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lake Amaqdjuaq is identified as an important hunting ground for inhabitants
    of Tiniqdjuarbiusirn, with routes from Hudson Strait and from the head of Frobisher
    Bay.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men and women are described as taking different routes toward the Lake Amaqdjuaq
    area; summer huts are erected near Aqbeniling, and birds and deer are killed in
    abundance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Access to Lake Amaqdjuaq allows Akuliarmiut and Nugumiut to meet, opening
    immediate intertribal intercourse.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Inhabitants of Hudson Strait leave Tuniqten in spring, reach the head of Frobisher
    Bay in fall, and after ice forms reach Nugumiut settlements by sledge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Sikosuilarmiut traveling party is reported to have reached Field Bay after
    covering the distance from King Cape in one year.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A boat-only route connects Qaumauang with Nugumiut along Hudson Strait, through
    a dangerous passage near Resolution Island, and across Frobisher Bay.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In intercourse with Nugumiut, inhabitants of Cumberland Sound generally follow
    the coast between Ukadliq and Naujateling through numerous sounds formed by long,
    narrow islands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Eskimo of Davis Strait call the tribes of Cumberland Sound and Saumia
    Oqomiut; the land is divided into Aggo, Akudnirn, and Oqo, corresponding to weather
    side, center, and lee side, with related tribal names.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The inhabitants of Padli are described as intermediate between Akudnirmiut
    and Oqomiut, with an arbitrary boundary between Oqo and Akudnirn.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Oqo, Akudnirn, and Aggo are said to denote directions and intervals rather
    than strictly bounded regions, and their application changes with vantage point.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Oqomiut were formerly divided into four named subtribes based on districts
    of Cumberland Sound and Saumia.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The old Oqomiut settlements remain inhabited, but the separate tribal identity
    of the four former subtribes is described as gone.
  category: attribute
  evidence_refs:
  - ev:10
