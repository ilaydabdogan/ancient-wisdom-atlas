canonical_text:
  quote: ''
  summary: Ethnographic passage describing Central Eskimo social order as founded
    on family ties, marriage and residence rules, polygamy and divorce, wife exchange,
    gendered labor, treatment and adoption of children and dependents, and kinship
    arrangements after death or divorce. It includes a comparative note about a Greenland
    belief that a murdered child becomes an avenging evil spirit called angiaq.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Social order is described as founded on the family and on consanguineal and
    affinal ties between individual families.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children may be betrothed young, but such engagements are not strictly binding
    and may be broken off.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Marriage requires the consent of the bride's parents, or of her brothers if
    the parents are dead.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The bride is said to be bought from her parents by a present, even when betrothal
    occurred in childhood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Newly married couples usually begin housekeeping with the wife's family, and
    a man from another tribe must join his wife's tribe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: Marriages between specified relatives are forbidden, while no rule is reported
    against a man marrying two sisters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:7
  text: Polygamy is allowable, but monogamy is described as more frequent; one wife
    is considered the chief wife when multiple wives are present.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: As long as a mother-in-law lives with the young family, the wives are subordinate
    to her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:9
  text: The property needed to establish a new family is listed as the man's hunting
    gear and the women's knife, scraper, lamp, and cooking pot.
  category: object
  evidence_refs:
  - ev:2
- id: obs:10
  text: A man may lend his wife to a friend for a season or longer and may exchange
    wives as a sign of friendship; the passage says this is sometimes commanded by
    religious law.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The husband is not allowed to maltreat or punish his wife; if he does, she
    may leave, and the wife's mother can command a divorce.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:12
  text: Both husband and wife are allowed to remarry soon after separation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:13
  text: Men's work is described as providing for the family by hunting, driving the
    sledge, feeding dogs, building the house, and maintaining hunting implements.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: Women's work is described as household work, sewing, cooking, tending lamps,
    making and mending tent and boat covers, preparing skins, and caring for young
    dogs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: Children are treated kindly and are not subjected to scolding, whipping, or
    corporal punishment.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: Infanticide is reported as having been practiced to some extent among all
    the tribes discussed, probably mainly affecting females or children of widows
    or widowers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: The passage states that in Greenland the spirit of a murdered child is believed
    to become an evil spirit called angiaq and to revenge the crime.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:18
  text: Adopted children, widows, and old people are considered part of the family,
    and adoption is described as extensive.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:19
  text: If parents cannot provide or perform household work, children may be adopted
    by a relative or friend who treats them as his own children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:20
  text: Widows with children may be adopted by a nearest relative or friend and belong
    to that family, though the woman retains her own fireplace.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:21
  text: After a spouse dies, the surviving spouse's residence and the children's placement
    depend on kinship ties; after divorce, children generally remain with the mother.
  category: sequence
  evidence_refs:
  - ev:7
