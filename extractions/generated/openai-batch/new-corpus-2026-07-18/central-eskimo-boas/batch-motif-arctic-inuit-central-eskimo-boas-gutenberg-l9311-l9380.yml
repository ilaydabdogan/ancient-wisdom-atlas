canonical_text:
  quote: ''
  summary: A mistreated orphan boy named Qaudjaqdjuq is helped by the man in the moon,
    who whips and tests him until he grows large and strong. After the man in the
    moon promises three bears, Qaudjaqdjuq kills the bears and takes revenge on his
    persecutors, sparing those who had been kind to him, and later becomes a great
    hunter.
  language: English
  quote_policy: summarized
