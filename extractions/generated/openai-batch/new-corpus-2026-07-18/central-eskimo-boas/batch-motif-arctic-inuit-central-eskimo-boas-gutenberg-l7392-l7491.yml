  text: The bear tornaq is represented as a huge animal with hair only on the points
    of the ears, tail, and mouth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man wishing to obtain a bear tornaq must travel alone to the edge of the
    land floe and summon bears.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a herd of bears approaches, the man falls; falling backward means death,
    while falling on his face allows one bear to ask whether he wants it as his tornaq.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: After accepting the bear as his spirit, the man returns with it; the bear
