  text: These protector spirits are said to be kind to their own angakut but dangerous
    to strangers who see them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Stone tornait are said to live in large boulders believed to be hollow houses
    with entrances visible only to the angakoq whose genius lives there.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: One stone tornaq is described as a woman with one eye in the middle of the
    brow.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Another stone tornaq is associated with stones that roll down hills in spring
