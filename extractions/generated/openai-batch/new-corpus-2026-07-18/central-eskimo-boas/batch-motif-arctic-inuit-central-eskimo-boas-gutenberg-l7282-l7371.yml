canonical_text:
  quote: After death, human souls either go to the upper or to the under world.
  summary: The passage surveys Inuit and Greenlandic accounts of postmortem destinations,
    contrasting Adliparmiut, Adli, upper worlds, qilaq, Sedna's abode, and variant
    Greenland traditions about happy and unhappy dead. It emphasizes that Baffin Land
    traditions differ from Greenland traditions and that Kumlien's transference of
    Greenland material to Cumberland Sound is unreliable.
  language: English
  quote_policy: quoted
