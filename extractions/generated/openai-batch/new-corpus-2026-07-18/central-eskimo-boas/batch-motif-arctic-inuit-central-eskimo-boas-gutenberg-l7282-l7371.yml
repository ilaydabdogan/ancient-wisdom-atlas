candidate_motifs:
- id: motif:1
  label: mapped afterlife with upper and lower destinations
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage repeatedly maps destinations for souls after death, including
    Adliparmiut, Adli, qilaq/heaven, upper worlds, Sedna's abode, and Greenland variants.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage reports multiple traditions and warns that they should not
    be collapsed into one uniform system.
- id: motif:2
  label: postmortem sorting by conduct, social offense, or mode of death
  taxonomy_refs:
  - divine_judgment
  basis: Destinations depend on being unkind, murder, offending Sedna, offending human
    laws, dying by accident or violence, dying in childbirth, good work, hunting success,
    laziness, or witchcraft.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage does not describe a formal judgment tribunal; sorting is inferred
    from stated destination rules.
- id: motif:3
  label: descent through staged lower worlds
  taxonomy_refs:
  - afterlife_journey_map
  basis: Lyon's account describes a four-day descent through successive lower worlds,
    and one Greenland tradition describes souls sliding down a steep blood-sprinkled
    rock for five days or longer.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: These are reported accounts from different sources and should not be treated
    as identical.
- id: motif:4
  label: ascent or upper-world route for souls
  taxonomy_refs:
  - ascent
  - afterlife_journey_map
  basis: Some souls are wafted to qilaq or the upper world, and one Greenland tradition
    has souls travel on the rainbow to the moon.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:8
  confidence: high
  cautions: The moral value of the upper world varies across the traditions summarized.
- id: motif:5
  label: afterlife abundance versus scarcity
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage contrasts lands of perpetual summer, warmth, water, food, and
    game with upper-world cold, famine, food scarcity, ice, and snow.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  - ev:9
  confidence: medium
  cautions: The seasonal-cycle label is approximate because the passage emphasizes
    afterlife conditions rather than an annual ritual cycle.
- id: motif:6
  label: cosmic explanation of aurora by play of the dead
  taxonomy_refs: []
  basis: Rink's account says the arssartut play ball with a walrus head, and this
    gives rise to the aurora borealis.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No available taxonomy reference directly matches this etiological aurora
    motif.
comparison_claims:
- id: claim:1
  claim: The passage explicitly cautions that Greenland tales should not be transferred
    wholesale to Cumberland Sound or Baffin Land traditions.
  claim_level: same_motif
  target: Greenland tales compared with Cumberland Sound and Baffin Land traditions
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: This is an ethnographic caution by the author; it does not identify
    a single shared motif, but warns against assuming identity across traditions.
- id: claim:2
  claim: The surveyed traditions share the function of mapping destinations for souls
    after death, but differ on whether the preferred realm is above or below.
  claim_level: same_function
  target: Baffin Land, Lyon/Iglulirmiut, Oqomiut, and Greenland afterlife accounts
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  counter_evidence_refs:
  - ev:2
  confidence: high
  limitations: The text includes several reported traditions from different authors
    and explicitly says conceptions do not coincide.
- id: claim:3
  claim: 'Greenland accounts in the passage contain variant afterlife maps: one places
    the good land below under tornarsuq, another places it in heaven reached by rainbow,
    and Rink''s account prefers the underworld.'
  claim_level: same_function
  target: Variant Greenland afterlife traditions
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The variants are summarized through older authors and Rink; the passage
    does not harmonize them.
