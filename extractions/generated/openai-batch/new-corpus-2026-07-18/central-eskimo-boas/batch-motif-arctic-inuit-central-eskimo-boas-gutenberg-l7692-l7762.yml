canonical_text:
  quote: ''
  summary: 'The passage describes several tornait and other supernatural beings: a
    sea spirit, a dog-shaped phantom, a dangerous master of the dancing house, and
    owners of celestial and meteorological phenomena. It then gives traditions in
    which sun and moon are brother and sister, including a Repulse Bay account of
    a conjurer, his sister, fire, and a celestial chase, and an Akudnirmiut/Oqomiut
    account in which a brother violates his sister, is marked with soot, pursues her,
    and both become moon and sun.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kalopaling or Mitiling is described as a spirit of the sea; the passage notes
    that Mitiling is glossed as a ghost and that its literal translation is connected
    with eider ducks.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Qiqirn is described as a huge dog-shaped phantom, almost hairless except at
    the mouth, feet, ear-points, and tail.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When Qiqirn comes near dogs or men, they fall into fits and recover only after
    it leaves; Qiqirn is also said to flee when an angakoq sees it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The qaggim inua is identified as master of the dancing house, a large house
    used for feasting, singing, and dancing and devoted to spirits.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The qaggim inua is described as a bandy-legged, hairless man with outward
    and forward bending knees and no bones at the back of his head; touching him is
    said to cause immediate death.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: More powerful supernatural beings are described as owners, or inua, of stars,
    constellations, and meteorological processes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Moon and sun are said to be considered brother and sister, and the passage
    states that this tradition corresponds with Greenland traditions and is also known
    or traced in other Eskimo groups.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Rae's reported Repulse Bay account, a mighty conjurer ascends to the heavens
    with his sister and a fire, adds fuel to the fire to form the sun, later quarrels
    with and scorches his sister, and she runs away and forms the moon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Rae's account explains lunar appearance by saying the brother still chases
    the sister and that the burnt or unburnt side of her face faces observers at different
    moon phases.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the Akudnirmiut and Oqomiut form, a brother violates his sister in a dark
    singing house; she marks the unknown man with soot and later sees that the marked
    man is her brother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In anger, the sister cuts off her breasts, offers them to her brother, seizes
    a burning piece of wood, and flees; the brother pursues with another piece of
    wood, falls, and his light becomes faint.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the Akudnirmiut and Oqomiut form, the sister is transformed into the sun
    and the brother into the moon; at new moon she sings to her brother, the moon,
    as he begins to shine and comes up.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
