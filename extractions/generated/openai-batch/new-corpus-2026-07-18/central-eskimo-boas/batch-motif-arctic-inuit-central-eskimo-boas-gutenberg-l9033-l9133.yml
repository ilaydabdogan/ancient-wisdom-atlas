canonical_text:
  quote: ''
  summary: A widow’s blind son is maltreated and deprived by his mother, though his
    sister helps him. A loon restores his eyesight by diving with him in a lake. After
    discovering that his mother hid the bear he had killed, the young man becomes
    a whale hunter and takes revenge by fastening his mother to a harpoon line so
    that a white whale drags her into the sea, where she becomes a narwhal. The brother
    and sister then leave in remorse and later encounter Qitua´jung, a long-nailed
    man who attacks the sister before the brother kills him.
  language: English
  quote_policy: summarized
