canonical_text:
  quote: ''
  summary: 'The passage describes several Central Eskimo domestic amusements and performance
    games: a woman’s face-distortion act, vocal performances using repeated word-pairs
    and guttural throat sounds, an alternating-knee agility game, a circle catching
    game with a lookout, and a common singing/dancing recreation called mumipoq with
    women in a circle and a male center leader.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When most men were away from the huts on a sealing excursion, women joined
    in playing, with one woman acting as chief performer.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief performer unbound her hair, plaited it, tied both ends together,
    stepped into the middle of the hut, and began the performance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The performance called ajokitarpoq involved extreme facial distortions, including
    altered lips, chin, eyes, and head movement, and was described as an accomplishment
    possessed perfectly by few.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that this performance is identical with another performance
    later described as practiced during summer meals.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Another performance involved gravely repeating paired words, producing sound
    from the throat in a manner compared to ventriloquism, pointing toward the body,
    saying angakoq, pausing, and then laughing with the others.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women sometimes produced a more guttural sound, repeated ikeri-ikeri, stared
    intensely, and in pairs or groups responded to each other so exactly that the
    sound seemed to come from one throat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A part called kaitikpoq consisted of falling on each knee alternately; the
    same woman also bent forward, shook violently as if convulsed, and uttered unnatural
    sounds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In a circle game, ten or twelve women formed a circle, a boy was sent to look
    out at the hut door, and the center woman shut her eyes and ran until she caught
    another woman, who then took the center place.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narrator inferred from the lookout and unspecified signs that the circle
    game was usually followed by conduct not meant to be known by husbands.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Winter Island, ten or twelve women formed a circle around a man in the
    center; he half-howled or half-sang while the women sang the Amna Aya song, and
    repeated acts followed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the first center leader retired, a young man described as specially
    qualified took his place as master of ceremonies, and men and children gradually
    entered the hut to watch.
  category: sequence
  evidence_refs:
  - ev:5
