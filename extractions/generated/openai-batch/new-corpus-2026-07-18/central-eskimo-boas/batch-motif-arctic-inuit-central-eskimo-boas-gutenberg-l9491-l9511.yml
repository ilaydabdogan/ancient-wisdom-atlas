canonical_text:
  quote: ''
  summary: 'The passage recounts traditions about the Tornit and Inuit: the Tornit
    did not make kayaks but stole them from Inuit hunters; a young Tuniq damaged a
    young Inung''s kayak and was killed while sleeping; fearing revenge or extermination,
    the Tornit left the country after disguising themselves. A variant says a young
    Inung died accidentally while playing with the Tornit, prompting the Tornit to
    leave from fear of revenge. The passage also notes old songs associated with the
    Tornit.'
