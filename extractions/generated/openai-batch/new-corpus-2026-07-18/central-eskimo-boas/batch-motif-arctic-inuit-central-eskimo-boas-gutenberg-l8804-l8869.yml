canonical_text:
  quote: ''
  summary: The passage describes Kalopaling, a sea-dwelling fabulous being feared
    by Inuit, and tells a tradition in which an old woman gives her crying grandson
    to Kalopaling, later regrets it, and the boy is eventually rescued by a man and
    his wife after they cut a seaweed tether. The boy then lives with them and becomes
    a great hunter.
