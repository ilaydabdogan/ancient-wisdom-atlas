  quote: ''
  summary: A woman enters a dark singing house despite warnings because she wants
    to see the house spirit. She summons the spirit, who answers while remaining invisible.
    She asks where each part of his body is, moving upward from feet to head. When
    she touches the head, she dies; the head is described as having no bones and no
    hair.
