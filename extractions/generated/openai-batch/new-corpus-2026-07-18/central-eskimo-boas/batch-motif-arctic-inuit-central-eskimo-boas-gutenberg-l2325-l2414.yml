canonical_text:
  quote: ''
  summary: The passage describes seasonal movements, hunting, fishing, food storage,
    and winter settlement patterns among Aivillirmiut and related Eskimo families
    around Repulse Bay, Lyon Inlet, Akugdlit, and Hudson Bay, including reliance on
    seals, walrus, whales, deer, musk ox, salmon, trout, blubber, and stored provisions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the last deer was killed in October, most natives returned to the bay;
    during winter almost no hunting occurred, and in late March the settlement broke
    up for hunting and fishing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In spring and summer, salmon, trout, deer, seals, walrus, and salmon were
    obtained, with some movement toward Pitiktaujang, Lyon Inlet, and Repulse Bay.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the winter of 1867-1868, a village east of Fort Hope lived on previously
    deposited stores; after the ice broke up, several whales were killed and supplied
    meat and blubber.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: People near the head of Lyon Inlet came to Repulse Bay after hearing that
    a whale had been taken, increasing the village population to 120.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that this was the only winter in which sealing began in
    January; in March huts were built on the ice and people scattered in early spring
    for sealing and salmon catching.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In spring, tents were established on the Repulse Bay floe, large winter settlements
    broke into smaller ones, blubber was stored in sealskin bags, and reindeer were
    killed in deer passes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In July and August, many people went to salmon rivers, sealing continued until
    the ice broke up, walrus and seal were taken in large numbers, and winter provisions
    were collected; some seasons also included whales being caught and stored.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In September, many people moved to lakes or rivers to hunt deer and musk ox,
    made venison deposits, and later built snow houses on lakes to have water nearby.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Around January, most people gathered in one settlement; winter sealing was
    undertaken only in need, and people subsisted on stores from the preceding summer
    until settlements broke up again in late March.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Akugdlit, families hunted musk ox, walrus on pack ice, and salmon in creeks;
    packed ice was described as unfavorable for chase and dangerous for boats.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Some families stayed at Repulse Bay in early summer, went to Akugdlit in autumn
    to hunt musk ox and deer, transferred blubber deposits in winter, and likely returned
    to Repulse Bay when deposits were exhausted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Klutschak’s reported statement says that in spring these Eskimo lived on the
    land floe of Hudson Bay near moving pack ice, pursued walrus, and settled near
    islands close to shore.
  category: sequence
  evidence_refs:
  - ev:7
