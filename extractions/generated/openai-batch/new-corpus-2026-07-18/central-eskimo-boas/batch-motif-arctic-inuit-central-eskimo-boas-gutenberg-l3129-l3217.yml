canonical_text:
  quote: ''
  summary: The passage describes degrees of travel, migration, intermarriage, distrust,
    and ceremonial greeting practices among named Inuit tribal groups. It contrasts
    neighboring or closely connected groups, whose contact may be regular and who
    may dispense with greeting ceremonies, with stranger groups, for whom greeting
    performances can include duels that may be fatal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Present intercourse between the Nugumiut and the Oqomiut is described as insignificant,
    though a former whaling period produced reciprocal settlement and intermarriage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A long uninhabited shore between Nugumiut and Oqomiut settlements is described
    as unfavorable to intimate intercourse; some families are not acquainted despite
    intermarriage.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Birthplace patterns are used to detect former Oqomiut subtribal divisions:
    eastern shore inhabitants are related to Padlimiut and Akudnirmiut, while western
    shore inhabitants are related to Nugumiut.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that brisk intercourse formerly existed between Padli and
    the sound, probably involving winter sledge crossings, and that the Kingnaitmiut
    mediate regular intercourse between Saumia and Padli.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Akudnirmiut are described as closely connected with the Padlimiut but
    considered strangers by the Oqomiut; Akudnirmiut-Aggomiut intercourse is described
    as infrequent.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Inhabitants of the northern sounds and Fury and Hecla Strait frequently visit
    one another, and the passage treats these tribes as one group because of active
    intercourse and settlement among one another.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The inhabitants of North Devon are assigned to the Tununirusirmiut, and some
    families settle temporarily on the island before returning to their former home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Reports classify the Aivillirmiut as closely related to the Iglulirmiut, while
    the Agutit or Kinipetu of Chesterfield Inlet are described as a separate group.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Between Hudson Bay tribes and more western tribes, deep distrust is said to
    prevent frequent and unlimited intercourse; the Aivillirmiut fear the Sinimiut
    and Netchillirmiut despite intermarriage and removals.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Sinimiut, Netchillirmiut, and Ugjulirmiut are grouped together because
    they hold frequent intercourse, while occasional meetings with the Qidneliq are
    marked by mutual distrust.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Between tribes that are strangers to one another, greeting ceremonies are
    customary; these ceremonies may include duels between a stranger and a man of
    the tribe, sometimes ending in the stranger's death.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Neighboring tribes dispense with these greeting ceremonies, but an unknown
    Nugumio or Akudnirmio in Oqo must undergo the whole performance; the exemption
    is attributed to frequent intermarriage and maintained acquaintance.
  category: sequence
  evidence_refs:
  - ev:9
