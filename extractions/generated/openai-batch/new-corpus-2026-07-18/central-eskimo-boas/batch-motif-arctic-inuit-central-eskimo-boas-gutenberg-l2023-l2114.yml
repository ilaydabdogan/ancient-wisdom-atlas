canonical_text:
  quote: ''
  summary: Ethnographic passage describing former Inuit whale fishery around Cumberland
    Sound and Davis Strait, seasonal movements of the Padlimiut and Akudnirmiut, summer
    and winter settlements, hunting and fishing resources, overland routes, and interactions
    with whalers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Oqomiut formerly pursued whales in bulky skin boats, and a single whale
    capture could supply food and fuel for a long time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Padlimiut and Akudnirmiut on Davis Strait erected tents near the floe edge
    in June and sent whale products to the main settlement.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Akudnirmiut are described as more migratory than the Oqomiut, visiting
    different winter stations rather than spending every winter at the same place.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Summer habitation and hunting are tied to places such as Qarmaqdjuin, Eχaloaping,
    Qivitung, Niaqonaujang, Pamiujang, Nudlung, Eχalualuin, Ijelirtung, and Inugsuin.
  category: setting
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: Deer hunting is facilitated by later ice breakup, because deer visit islands
    along the mainland that are easily reached.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bird and egg resources are unevenly distributed; Avaudjelling is singled out
    as an island visited by birds, and eider ducks are caught in July near Itirbilung
    Fjord.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Known overland routes connect Itirbilung Fjord to Piling and Nudlung or Eχalualuin
    to Majoraridjen and Nettilling, though at least one route is described as passing
    into disuse.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: In early August Akudnirmiut move to Niaqonanjang, and southern families gather
    at Qivitung, to meet whalers traveling south.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the sea freezes, some people from Qivitung move south to Qeqertuqdjuaq,
    later shifting toward Qeqertaq or Padli Fjord, where spring bear hunting and June
    salmon fishing occur.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: People who remain at Qivitung in winter go sealing and also live on walrus
    meat stored in summer and autumn.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Akudnirmiut from Niaqonaujang winter at Ipiutelling, move to Avaudjelling
    in May, and hunt bears in spring where she-bears dig snow holes for whelping.
  category: sequence
  evidence_refs:
  - ev:11
