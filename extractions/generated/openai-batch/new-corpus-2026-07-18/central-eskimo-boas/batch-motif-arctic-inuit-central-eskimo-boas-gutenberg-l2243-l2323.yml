literal_observations:
- id: obs:1
  text: The passage states that customs of western continental tribes differ markedly
    from those of Baffin Land and Melville Peninsula tribes, chiefly because of territorial
    surroundings and frequent musk ox hunting.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that continental tribes do not hunt seal in winter but
    instead lay up meat and blubber in the fall.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage identifies the Aivillirmiut and Netchillirmiut as two tribes for
    which information is comparatively complete, while information about several other
    named groups is less complete.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Aivillirmiut mode of life is presented through abstracts of observations
    by Rae, Hall, and Schwatka, whose journals are said to show migrations and favorite
    resorts at different seasons.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: In late July 1846, Rae met twenty-six people deer hunting among the lakes
    of Rae Isthmus; another part of the tribe hunted musk ox near Point Hargrave,
    and walrus were hunted in kayaks at Akugdlit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Where deer or musk ox were killed, meat deposits were made, and walrus blubber
    was put in sealskin bags for winter use.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the end of September, with deer moving southward and new ice forming, people
    settled near their summer hunting grounds and depots; during winter most gathered
    east of Fort Hope and went out to bring in deposits.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Around February 20 people scattered over the bay; in March and April deer
    appeared, trout was procured but was insufficient, and venison caches were visited
    until late June.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sealing began in early May; later salmon creeks were visited, deer were caught,
    seals were pursued on the ice, and principal deer hunting began after the ice
    broke up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Rae’s second winter at Repulse Bay no natives were there; they had wintered
    farther south and came to the bay in May 1855 to catch seals on land ice. Hall
    also found Repulse Bay deserted in 1864.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In June 1865 a traveling party arrived at Repulse Bay, erected tents on Uglariaq,
    pursued seals, and began making blubber deposits for winter provisioning.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Some of the 1865 party used boats at the floe edge to follow seal and walrus,
    others sledged on the land floe to shoot basking seals, whales were later pursued
    after ice breakup, and in September most returned to North Pole Lake to hunt deer
    and deposit meat for winter use.
  category: sequence
  evidence_refs:
  - ev:8
