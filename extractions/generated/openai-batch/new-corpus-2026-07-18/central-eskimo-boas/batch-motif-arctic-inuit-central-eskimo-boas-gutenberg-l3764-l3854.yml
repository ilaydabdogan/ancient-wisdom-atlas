canonical_text:
  quote: ''
  summary: 'The passage describes several spring seal-hunting methods among Central
    Eskimo groups: locating seal-pupping holes with dogs, taking pups with a hook,
    luring dams with a distressed pup, stalking basking seals through imitation and
    concealment, using guns, harpoons, or clubs, and managing sled dogs during paired
    hunts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pregnant female seals make snow excavations five to ten feet long with a diving
    hole at one end, preferring snowbanks, rough ice, cracks, and cavities of grounded
    ice for pupping.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eskimo hunters travel on light sledges drawn by dogs that scent and locate
    seal holes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a seal hole, the hunter breaks down the roof of the snow excavation, tries
    to block the seal’s retreat, draws out the pup with a hook called niksiang, and
    kills it by stepping on its breast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The passage notes three hook patterns: an old pattern, one made from a bear’s
    claw, and a modern pattern.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: To catch an old seal, hunters may tie a thong to a pup’s hind flipper, throw
    the pup into the hole, push it back when it surfaces, and harpoon the dam when
    she returns toward the pup.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Foxes also pursue young seals, drag them from their excavations, and may leave
    skins that Eskimo people find useful.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: As weather warms, seals break down snow roofs and bask beside their holes,
    while young seals remain with dams until late June.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A hunter stalking a basking seal approaches from windward, lies down with
    a piece of skin under his left arm, and creeps forward on his side and arm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the seal looks around, the hunter lies still or imitates seal movements
    by raising his head and rolling or playing with hands and feet like flippers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Some hunters imitate the sound of a blowing seal or use a small sledge with
    a white screen for concealment; sealskin clothing makes humans and seals hard
    to distinguish at a distance.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the stalking method, the hunter tries to kill the seal with a first shot
    to the head before it can escape into its hole.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states that the harpoon formerly replaced the gun and is still
    preferred by some hunters because it helps prevent the seal’s escape.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: After shooting or harpooning, the hunter jumps up to stop the wounded animal
    from reaching its hole; an expert hunter is said to kill ten to fifteen seals
    in a day.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Women at Repulse Bay are described as skillful and, without a harpoon, may
    kill a seal by striking it on the nose with a small wooden club.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: 'Usually two men go sealing together: one creeps toward the seals while the
    other keeps the dogs quiet; after a kill, the dogs rush to the victim, which is
    lashed onto the sledge.'
  category: relationship
  evidence_refs:
  - ev:13
