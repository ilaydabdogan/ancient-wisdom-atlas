canonical_text:
  quote: ''
  summary: Boas summarizes historical and ethnographic reports on a westward shift
    in Netchillirmiut territory after the loss of the Franklin expedition, their contact
    and intermingling with the Ugjulirmiut, later observations of their range, and
    seasonal hunting, fishing, sealing, and storage practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that earlier intercourse between the Ugjulirmiut and Netchillirmiut
    was limited, though some Netchillirmiut knew individuals from Ugjulik through
    trading excursions and an adoption case.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the time of the Franklin expedition's destruction in 1848, the Netchillirmiut
    had not yet visited the relevant part of King William Land, according to the passage's
    synthesis of earlier information.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Franklin's ships were destroyed, the Ugjulirmiut obtained a large supply
    of metals and wood, and the Netchillirmiut began visiting King William Land to
    share in these materials.
  category: action
  evidence_refs:
  - ev:3
  - ev:9
- id: obs:4
  text: The passage says the Netchillirmiut moved westward by degrees and became intermingled
    with the Ugjulirmiut.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage reports fewer women than men among the Netchillirmiut and says
    men sought wives among neighboring tribes, especially the Ugjulirmiut.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Because clothing and tattooing did not distinguish the Ugjulirmiut from the
    Netchillirmiut, Boas says the tribes were difficult to separate, though the terms
    remained in use.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Schwatka's 1879 observations placed Netchillirmiut settlements on the mainland
    opposite King William Land, around Simpson Strait, along northern Adelaide Peninsula,
    and included the eastern shore of the Back River estuary.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hall's 1869 observations included a sledge track at Shepherd Bay, snow huts
    and natives near Point Acland, a village at Point Booth, and fresh salmon from
    Netchillik.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'Klutschak''s journal describes summer dispersal: some Netchillirmiut went
    sealing near Montreal Island, many hunted deer inland, and another party frequented
    southern King William Land until September before returning to Adelaide Peninsula.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage reports that salmon were caught in spring, dried, and stored for
    winter; blubber and deer meat were also stored; and winter fishing occurred through
    holes in the ice.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Boas concludes that King William Land and Adelaide Peninsula became favorite
    hunting grounds after the Franklin expedition was lost, and that the migration
    was caused by abundant metals and wood from wrecks and starved traveling parties.
  category: sequence
  evidence_refs:
  - ev:9
