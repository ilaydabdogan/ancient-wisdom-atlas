canonical_text:
  quote: ''
  summary: 'Ethnographic description of Central Eskimo dog-sledge travel: dog teams
    are ordered by strength and leadership, dogs may resist strange teams or return
    home, restraints and harness practices are used, and sledges are iced, loaded,
    lashed, and equipped for travel according to snow and ice conditions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dogs’ traces are strung on a thong so that the dogs all pull at one point,
    but the team is arranged with care rather than randomly.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The strongest and most spirited dog is given the longest trace and runs ahead
    as leader; selection is based chiefly on strength rather than sex.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Strong dogs follow next to the leader, while weaker or less manageable dogs
    are placed nearer the sledge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A dog team may be unmanageable if the dogs are not accustomed to one another;
    the leader must be acknowledged by the team to maintain order.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The leader dog takes choice food morsels and stops quarrels by biting both
    disputing dogs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: A second dog is commonly ranked below the leader but feared by the other dogs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Leaders of different teams may be rivals, though teams accustomed to traveling
    together show some regard for each other’s leaders.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: Dogs placed in strange teams may refuse to pull, lie down, struggle, howl,
    endure lashing, or try to return to their own team; other dogs may work willingly
    with strangers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: Dogs sold or lent from one team may return to their former homes, with reported
    cases of dogs traveling thirty to sixty miles back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: To prevent dogs from running away during travel, the left fore leg may be
    tied up by a loop passing over the neck; some dogs are customarily tied at night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Harnesses are sometimes left on at night, and dogs that strip off harnesses
    may have the trace tied around the body.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The driver is warned not to punish dogs too severely because fear of the whip
    may make them stop working.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: In winter the shoes of sledge runners are covered with a thick ice coating
    to reduce friction on snow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Good bone, ivory, or whalebone shoes are iced with water; poor shoes or skin
    runners may first receive frozen moss-and-water or clay-and-water, and blood-and-water
    or urine-and-water mixtures may be used because they adhere better.
  category: object
  evidence_refs:
  - ev:5
- id: obs:15
  text: The driver removes icicles from the runner with a snow knife, smooths the
    bottom with the same implement, and polishes it with a mitten.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: In hard winter snow, small sledges with narrow shoes are preferred and the
    bulk of the weight is placed behind.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:17
  text: In soft snow or where floe cracks are wide, long sledges with broad shoes
    are preferred and the heaviest load is placed near the middle or head.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:18
  text: When crossing cracks, forward load placement is said to reduce the risk that
    a failed jump will draw the sledge and dogs into the water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:19
  text: The load is fastened with a long lashing called naqetarun, worked over notches
    and tightened by two men.
  category: object
  evidence_refs:
  - ev:7
- id: obs:20
  text: Travel implements are hung on the antlers at the back of the sledge, and in
    spring travelers may carry a drinking tube in a pouch.
  category: object
  evidence_refs:
  - ev:7
