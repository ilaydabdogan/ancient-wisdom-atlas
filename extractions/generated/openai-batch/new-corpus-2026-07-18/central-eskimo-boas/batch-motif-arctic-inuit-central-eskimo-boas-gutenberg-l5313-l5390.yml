  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The driver begins with a whistling guttural sound represented as h!h!, which
    can be heard at a considerable distance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Well-rested, strong dogs rise and start at once, while lazy dogs require stimulating
    and lashing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: For a heavy load, the driver may rock the sledge backward and forward, draw
    the traces tight, pull at the sledge, and then let go so the team gives the sledge
    a sudden pull.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Travel with a heavy load over rough ice or soft snow is described as extremely
    hard work requiring constant stimulation of the dogs.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Many exclamations are used for driving, and individual Eskimo drivers may
    have favorite words.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Drivers may call attention to a seal, a deserted snow hut, or going home when
    the dogs are already moving well.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Specific words are used for turning right, turning left, and stopping, and
    the whip lash is thrown to the opposite side of the dogs when directing turns.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The leader is the first dog to obey a turning order, but the turn is made
    slowly and in a long curve.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: In difficult travel the driver walks along the right side of the sledge and
    directs it around hummocks by pushing the front or pulling at the deer's skull
    at the back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: When the sledge sinks into soft snow or stops against ice, it may need to
    be lifted out, unloaded, reloaded, or moved through a road cut with the end of
    a spear.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: When the sledge stops, the dogs lie down, and the leader may look back if
    the team cannot start again despite pulling.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: With a light sledge and strong dogs, the team may start at full speed and
    become nearly unmanageable.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: During rapid light-sledge travel, dogs may play, quarrel, cross over or under
