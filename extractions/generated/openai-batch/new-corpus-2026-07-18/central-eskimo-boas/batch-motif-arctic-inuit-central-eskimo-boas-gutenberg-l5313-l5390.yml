  text: After the sledge is loaded, the dogs are hitched to it and the driver takes
    up the whip to start.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The whip has a short handle made of wood, bone, or whalebone and a long lash
