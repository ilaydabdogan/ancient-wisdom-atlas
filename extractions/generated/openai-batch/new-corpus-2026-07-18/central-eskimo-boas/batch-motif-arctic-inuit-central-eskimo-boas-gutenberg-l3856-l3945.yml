canonical_text:
  quote: ''
  summary: The passage describes several Central Eskimo seal-hunting methods, including
    winter hunting near holes and floe edges, a reported Netchillirmiut group hunt
    using shouting and a spear strike, a settlement-wide hunt at seal holes after
    the snow is gone, and the beginning of summer kayak hunting. It then describes
    the regional use, dimensions, frame, skin covering, and attachments of the kayak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hunters searching for another seal may stop the dogs; when they plan to remain
    out only a few hours, they leave dead animals at their holes and load them on
    the sledge on the return journey.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A single hunter is limited to sealing near the village and to killing no more
    animals than he can drag back himself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When seals are asleep, a hunter can approach without precaution and kill them
    immediately; even a fast-running dog team can surprise them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In winter, when the floe edge is close to land, seals lying on the ice are
    pursued by the same described method.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A reported Netchillirmiut method has eight men approach a basking seal; the
    front men stop and shout when it raises its head, three others run up, and the
    leader spears it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the snow is gone, men, women, and children from the settlements occupy
    seal holes over a large area.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the settlement-wide hunt, men wait with harpoons while women and children
