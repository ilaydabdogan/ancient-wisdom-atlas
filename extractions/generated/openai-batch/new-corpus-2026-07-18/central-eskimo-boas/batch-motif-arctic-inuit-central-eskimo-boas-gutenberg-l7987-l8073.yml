  summary: The passage describes late-fall storms and the activity of dangerous spirits,
    especially the dead, qiqirn, Sedna, and Sedna's father. Angakut perform trance
    and exorcistic rites, including a ritual luring and harpooning of Sedna, followed
    by protective amulets, a communal festival, sunwise processions, gift distribution,
    a winter-versus-summer rope contest, and a water/name/birthplace ceremony.
  language: English
