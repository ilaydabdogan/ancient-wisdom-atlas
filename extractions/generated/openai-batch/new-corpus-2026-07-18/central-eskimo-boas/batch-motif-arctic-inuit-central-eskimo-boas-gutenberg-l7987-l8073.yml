  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The qiqirn pursues dogs, which die with convulsions and cramps when they see
    him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Evil spirits are described as bringing sickness, death, bad weather, and failure
    in hunting.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sedna is named as mistress of the underworld; she rises from under the ground,
    and her father is associated with the dead Inuit falling to his share.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Wizards or angakut sing, pray, conjure spirits, sit in low lamplight, cover
