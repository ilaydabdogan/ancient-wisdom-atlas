  summary: The passage describes Central Eskimo games and amusements, including dice-like
    image pieces, a suspended target game, a roulette-like selector, stake exchange
    among winners, string-figure making, several ball games, children’s toys and recitations,
    summer exercises, and formal winter storytelling with fixed narrative conventions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dice-like game called tingmiujang uses about fifteen small figures, some
    representing birds and others men or women; figures are thrown upward and those
    landing upright are assigned to the player they face.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In tingmiujang, players throw by turns until the last figure is taken up,
    and the player with the greatest number of figures wins.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The nuglutang uses a small rhomboidal ivory plate with a central hole, hung
    from the roof and steadied by a lower weight; participants try to hit the hole
    with sticks after a signal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sāketān uses a rounded-bottom leather cup with a nozzle, turned on a board;
    when it stops, the nozzle points to the winner, with a tin-cup variant also noted.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A stake practice is described in which the first winner fetches an object
    from his hut for the next winner, who receives it but must bring a replacement
    stake; the first winner loses and the last winner gains.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Women are described as especially fond of making figures from a loop or thong,
    with a deer-shaped device described step by step.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A summer ball is made of sealskin stuffed with moss and trimmed with skin
    straps; one man throws it among players, who try to keep it in motion and off
    the ground.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: A men-only ball game uses a leather ball filled with hard clay and whips with
    coiled lashes, each man trying to hit the ball and keep others from reaching it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The ball game called igdlukitaqtung uses small balls tossed alternately from
    right to left, with one ball always in the air, and songs accompany the game.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Women and children play an amusement by pointing successively to the forehead,
    cheek, and chin while rapidly pronouncing a sequence of words naming those parts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Young children play with toy sledges, kayaks, boats, bows and arrows, and
    dolls; the dolls have wooden bodies clothed with deerskin scraps cut like men’s
    clothing.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: In summer, children and grown people exercise by kneeling in a large circle
    and jumping up and down, or by running while kneeling and holding their toes.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: During long winter nights, tale-telling and song-composition are described
    as favorite amusements.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: 'Old traditions are narrated ceremoniously: the narrator removes the outer
    jacket, pulls the hood over the head, sits in the rear of the hut facing the wall,
    and tells the story slowly and solemnly.'
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: Stories are said to be related in abbreviated and fixed form, and listeners
    correct the narrator if a customary word is changed.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: Children tell fables, sing short songs, and favor comic songs that make fun
    of a person.
  category: speech
  evidence_refs:
  - ev:12
