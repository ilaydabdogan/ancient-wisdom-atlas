canonical_text:
  quote: ''
  summary: Sedna, living with her widowed father, rejects Inuit suitors but follows
    a fulmar spouse across the sea after hearing promises of abundance. In the bird
    country she finds poverty and laments for her father. Her father later kills the
    fulmar and takes her away by boat. Pursuing fulmars raise a storm; the father
    throws Sedna overboard and cuts off her finger joints when she clings to the boat.
    The severed parts become whales, whalebone, seals, and ground seals. After returning
    ashore Sedna has her dogs maim her father; his curse causes the earth to swallow
    the hut, father, daughter, and dogs, who thereafter live in Adlivun, where Sedna
    is mistress. A song variant adds a brother, Sedna’s pierced eye and death, a dogskin
    covering, and flood waters. Angakut describe Sedna and her father as maimed supernatural
    beings, and the author notes a resemblance to a Lyon account of Iglulirmiut spirits.
  language: English
  quote_policy: summarized
