canonical_text:
  quote: ''
  summary: The passage describes the Book of Traversing Eternity as a funerary work
    empowering the deceased soul to travel through Egypt, holy places, festivals,
    earth, and heaven, while securing bodily resurrection and restored faculties.
    It then summarizes Osirian festival texts, especially the Lamentations and Festival
    Songs of Isis and Nephthys, including ritual performers, implements, priestly
    setting, and speeches in which Isis and Nephthys call the dead Osiris home, lament
    him, guard his bier, and declare his enemies defeated.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Book of Traversing Eternity is described as a late work whose fullest
    known form is on a Vienna papyrus.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The work says the deceased soul, when armed with the book's power, can travel
    throughout Egypt, visit holy places, attend festivals, and commune with gods,
    spirits, and living acquaintances.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The object of the Book of Traversing Eternity is stated to be securing resurrection
    of the deceased person's body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The opening of the book locates the soul in heaven with Ra, the Ka in a divine
    condition, the body in the tomb before Osiris, descendants on earth before Keb,
    and the deceased joined to the Sun-god Aten.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The deceased is said to breathe, speak, eat, drink, see, hear, walk, and have
    bodily organs in their proper places and functions.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The deceased is said to float in the air, hover in shadow, rise in the sky,
    follow the gods, travel with stars, dekans, and planets, and move on earth and
    in heaven by night and day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'Three popular Graeco-Roman period works connected with Osiris festivals are
    named: the Lamentations of Isis and Nephthys, the Festival Songs of Isis and Nephthys,
    and the Book of making splendid the Spirit of Osiris.'
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Lamentations of Isis and Nephthys were recited on the twenty-fifth day
