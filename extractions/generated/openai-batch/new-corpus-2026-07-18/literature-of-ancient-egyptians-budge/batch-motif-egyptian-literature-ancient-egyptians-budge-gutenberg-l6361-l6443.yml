canonical_text:
  quote: ''
  summary: A first-person traveler reports a robbery to a local prince, then continues
    through ports toward Byblos. At Byblos, Unu-Amen seizes silver as security for
    his stolen money, conceals the divine image Amen-ta-mat and its amulets, endures
    repeated orders to leave the harbor, hears a possessed young chief command that
    the god and messenger be sent away, attempts to prepare an Egypt-bound departure,
    and is then detained and interrogated by the governor about missing letters and
    possible threats against him and the god.
  language: English
  quote_policy: summarized
