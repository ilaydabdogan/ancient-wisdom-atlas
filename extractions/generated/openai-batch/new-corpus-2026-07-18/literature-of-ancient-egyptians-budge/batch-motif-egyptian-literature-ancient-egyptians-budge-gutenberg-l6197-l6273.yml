  summary: The educated peasant comes before Rensi for the seventh and eighth times
    to complain. He praises and rebukes the steward as a judge, compares proper judgment
    to Thoth, denounces avarice and corrupt officials, describes his own compelled
    speech with images of water escaping a breached dam, and invokes enduring Truth,
    Ra's command, and the balance or scales as standards of just judgment.
