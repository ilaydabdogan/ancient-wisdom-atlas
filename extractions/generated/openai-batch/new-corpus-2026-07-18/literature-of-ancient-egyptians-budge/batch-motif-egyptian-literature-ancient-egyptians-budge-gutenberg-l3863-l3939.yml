canonical_text:
  quote: ''
  summary: A translated Egyptian royal summary presents Rameses III addressing officials
    and military groups. He describes an earlier period of disorder, foreign domination,
    rule by Arsu, and neglected temples; the gods then restore proper order by establishing
    Set-nekht, who pacifies Egypt, restores offerings, and receives Osirian funerary
    rites. Rameses III says Amen, Ra, Tem, and Ptah crowned him, compares his rule
    to Horus on Osiris’s throne, displays royal regalia including a serpent-crowned
    Atef crown, and recounts conquests, captives, taxation, and dedications to the
    temples of the Nine Gods.
  language: English
  quote_policy: summarized
