canonical_text:
  quote: ''
  summary: A narrative introduction and royal letter describe Herkhuf’s return from
    Amam/Sudan with offerings and a dancing dwarf or pygmy from the Land of the Spirits.
    King Pepi II/Neferkara praises Herkhuf, orders the living performer brought quickly
    by river to the capital, commands special protection and provisioning, and promises
    Herkhuf exceptional honors if the performer arrives alive and healthy.
  language: English
