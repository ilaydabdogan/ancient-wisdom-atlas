candidate_motifs:
- id: motif:1
  label: Divine combat against rebel enemies
  taxonomy_refs:
  - chaos
  - divine_judgment
  basis: Horus repeatedly defeats Set, Set's followers, and rebels under Ra's authority,
    with executions performed before Ra.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage frames the opponents as enemies of Horus or Ra; broader cosmological
    interpretation should be reviewed against the surrounding text.
- id: motif:2
  label: Serpent adversary confined by divine guardian
  taxonomy_refs:
  - serpent
  - chaos
  basis: Set, after being slain in human form, reappears as a great hissing serpent
    in a hole, and Ra orders Horus to guard the hole so the monster cannot reappear
    among men.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives a specific Set-Horus episode; comparison to wider serpent-combat
    traditions is not asserted here.
- id: motif:3
  label: Shapeshifting divine warrior
  taxonomy_refs:
  - shapeshifter
  basis: 'Horus takes or is described in multiple forms: hawk-associated man, hawk-headed
    staff, winged disk, and lion with a man''s face.'
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The forms are stated in the passage, but their ritual or theological meanings
    require external corroboration.
- id: motif:4
  label: Mother and son acting against the divine enemy
  taxonomy_refs:
  - mother_goddess
  - divine_parent_child
  basis: Ra hands Set over to Isis and her son Horus; Isis later lives with Horus
    at the guarded hole and protects Osiris's body with spells.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage identifies Isis as mother and Horus as son, but the combat
    action is mostly assigned to Horus.
- id: motif:5
  label: Magical protection of a divine body and tomb
  taxonomy_refs:
  - wisdom
  basis: Horus guards Osiris's tomb and Isis recites spells and incantations to keep
    enemies from Osiris's body.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The available taxonomy has no exact tomb-protection category; 'wisdom'
    is used only for the spell/words-of-power element.
- id: motif:6
  label: Divine boat expedition against enemies
  taxonomy_refs: []
  basis: Horus unmoors the Boat of Ra to pursue enemies who fled by boat, and the
    Boat of Ra later traverses Egypt and reaches Nubia while Thoth recites weather
    spells.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage presents a travel and pursuit vessel; no available taxonomy
    ref precisely fits this function.
- id: motif:7
  label: Apotropaic temple emblem established by divine decree
  taxonomy_refs:
  - serpent
  basis: Ra orders the winged disk with a serpent on each side to be placed in every
    temple of Ra so that it protects the building and drives away fiends and devils.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The motif is iconographic and etiological within the passage; broader
    architectural distribution is stated by the passage but should be checked materially.
- id: motif:8
  label: Fear-induced submission before divine manifestation
  taxonomy_refs:
  - divine_judgment
  basis: In Uauatet, rebels confronted by Horus as the winged disk with the two serpent-goddesses
    cast themselves to the ground in submission and die without fierce fighting.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not specify a separate trial or verbal sentence in this
    episode.
comparison_claims:
- id: claim:1
  claim: The passage explicitly connects Horus's winged disk form with the winged
