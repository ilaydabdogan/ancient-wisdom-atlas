canonical_text:
  quote: ''
  summary: Horus defeats Set and Set's followers in several episodes under Ra's authority.
    Set is killed but reappears as a serpent and is confined. Horus repeatedly takes
    powerful forms, including hawk, hawk-headed staff, winged disk, and lion with
    a man's face, to defeat remaining enemies in Egypt and Nubia. Isis protects Osiris's
    body with spells, Thoth recites weather spells for Ra's boat, and Ra rewards Horus's
    blacksmiths. At the end, Ra orders the winged disk with two serpents to be placed
    on temples as a protective emblem.
  language: English
  quote_policy: summarized
