  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: King Merenra sent Herkhuf with his father Ara to Amam to open a road; Herkhuf
    says the journey took seven months and he returned with gifts and received great
    praise.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Merenra sent Herkhuf a second time by himself; Herkhuf says he returned after
