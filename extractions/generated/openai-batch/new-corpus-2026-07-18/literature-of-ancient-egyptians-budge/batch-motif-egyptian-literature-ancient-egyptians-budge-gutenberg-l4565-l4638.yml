literal_observations:
- id: obs:1
  text: The inscription is described as cut in hieroglyphs on a slab originally in
    Herkhuf's tomb at Aswân and on parts of the tomb walls; titles and offering prayers
    are cut above the tomb door.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Herkhuf is introduced with high-status titles including Duke, smer uat, Kher-heb
    priest, judge, royal seal bearer, shekh of the caravans, and high administrator
    in the South.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Herkhuf says he built a house, set up doors, dug a lake, planted sycamore
    trees, was praised by the king, favored by his father, and loved by his family.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Herkhuf says he gave bread to the hungry, clothing to the naked, and ferried
    over the river a person who had no boat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Herkhuf addresses living men and women passing by the tomb on the river and
    asks them to speak an offering formula of bread-cakes and beer for the lord of
    the tomb.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Herkhuf says he will offer for those passersby in Khert Nefer, glossed in
    the passage as the Other World.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Herkhuf identifies himself as a perfect spirit equipped with spells and as
    a Kher-heb priest whose mouth has knowledge.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: Herkhuf warns that if a young man enters the tomb as if it were his own property,
    he will seize him like a goose and the Great God will judge him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Herkhuf says he spoke good words, repeated what was loved, avoided evil speech
    about servants to powerful men, and did not judge between brothers so as to deprive
    a son of his father's property.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: A title sequence describes Herkhuf as bringing things from every desert to
