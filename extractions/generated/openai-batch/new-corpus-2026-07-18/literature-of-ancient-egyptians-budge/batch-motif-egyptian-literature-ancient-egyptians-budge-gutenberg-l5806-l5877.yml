canonical_text:
  quote: ''
  summary: The passage introduces the manuscript setting of the story, then recounts
    how Khuenanpu, a peasant of Sekhet-hemat, prepares grain with his wife Nefert
    and travels toward Egypt with asses loaded with goods. At a narrow river-bank
    path, Tehutinekht blocks the way with linen between the stream and a growing crop,
    accuses the peasant of trespass after an ass bites corn, beats him with a cudgel,
    seizes his asses, threatens him with silence, and hears the peasant protest that
    he has been beaten, robbed, and denied even his complaint.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The story is introduced as written in hieratic on papyri preserved in the
    British Museum and the Royal Library at Berlin, and is dated by the editor to
    the period after the twelfth dynasty.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Khuenanpu is named as a peasant of Sekhet-hemat, with a wife named Nefert,
    and he announces that he is going down into Egypt to bring back food for his children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nefert measures the remaining grain and finds eight measures; Khuenanpu assigns
    two measures for her and the children and six measures for bread and beer for
    his journey.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Khuenanpu loads his asses with many products, including plants, soda, salt,
    wood, animal skins, stones, birds, and seeds, and travels south toward Hensu and
    the region of Perfefa north of Metnat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tehutinekht, identified as son of Asri and a serf of Rensi son of Meru, sees
    the peasant's asses and wishes for divine help to seize the peasant's goods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tehutinekht's house stands by a narrow sloping river-bank path, with the stream
    on one side and a growing crop on the other.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tehutinekht orders his slave to bring a sheet of linen and spreads it over
    the narrow path so that one edge touches the water and the fringed edge touches
    the crop.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When Khuenanpu tries to pass along the public path, Tehutinekht warns him
    not to walk on his clothes and then objects when the peasant turns toward the
    crop side.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Khuenanpu replies that the river-bank is steep, the road is covered by Tehutinekht's
    corn and linen, and Tehutinekht appears to be preventing passage.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After one ass bites a mouthful of corn, Tehutinekht claims the ass is eating
    his corn; Khuenanpu answers that the road was made impassable and invokes Rensi's
    estate as a place where robbers should not be tolerated.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: Tehutinekht cites a proverb about the poor man's name and his master, takes
    a green tamarisk cudgel, beats Khuenanpu, and takes his asses into his compound.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Khuenanpu weeps and cries out; Tehutinekht tells him not to howl or he will
    depart to the domain of the Lord of Silence, and Khuenanpu protests that Tehutinekht
    has beaten him, robbed him, and now seeks to steal his complaint.
  category: speech
  evidence_refs:
  - ev:10
