canonical_text:
  quote: ''
  summary: The peasant returns to complain before Rensi. In a long address he praises
    Rensi with images of steering and measuring, then accuses officials and law-keepers
    of injustice, robbery, false judgment, lying, and role inversion. Rensi asks whether
    the case is so serious that his servant Tchutinekht should be seized. The peasant
    continues with images of corrupt measures, blind guides, divine warning, bread
    and beer, boat steering, refuge, a safe quay, drowning, and rescue, asking Rensi
    not to let him perish.
  language: English
  quote_policy: summarized
