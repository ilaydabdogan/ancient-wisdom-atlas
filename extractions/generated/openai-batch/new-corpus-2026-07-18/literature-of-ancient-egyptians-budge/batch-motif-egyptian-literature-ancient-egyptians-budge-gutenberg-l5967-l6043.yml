  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The peasant says that a great lord takes from one without a master and steals
    from one who is alone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The peasant names as evils a leaning balance, an inaccurate balance pointer,
