  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The peasant says truth is driven from its place and officials commit injustice;
    he describes judges, law-enforcers, protectors, and dividers as doing the opposite
    of their proper tasks.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Rensi asks whether the peasant's case is so serious that Rensi must have his
    servant Tchutinekht seized.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The peasant says those who measure and fill corn measures steal, and that
    one who should execute the Law gives orders to rob.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The peasant wishes for a destructive moment in which Rensi's vines are laid
    low and his geese and waterfowl diminished.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The peasant says one who should see has become blind, one who should hear
    has become deaf, and one who should guide justly leads into error.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The peasant calls Rensi strong and powerful but says his heart is avaricious
    and compassion has removed itself from him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The peasant compares Rensi to the messenger of the god Henti, identified as
    the Crocodile-god, and mentions the Lady of the Plague, identified as Sekhmet.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The peasant says stealing from a beggar by a man who is not in want is an
    absolute crime, and says Rensi is full of bread and beer and rich beyond count.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: 'The peasant uses a boat image: when the steersman looks ahead the boat falls
    out of course, and when the King is in his house and Rensi works the rudder, injustice
    occurs around him.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The peasant says Rensi should make himself a refuge for the needy and that
    his quay should be safe, but says Rensi's town is in commotion.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The peasant warns Rensi not to speak lies and to ensure that his high officials
