canonical_text:
  quote: Thy death must not take place in a foreign land
  summary: A royal letter from Amenemhat summons Sanehat back to Egypt, urging him
    to leave foreign honours and return to his birthplace for homage, old age, and
    proper burial. The letter promises Egyptian embalming, funerary procession, offerings,
    and a tomb, and rejects burial in a foreign land. Sanehat receives the letter
    with prostration and joy, says the king’s Ka will allow his body to end in his
    native land, and replies with praise of the king and a prayer to Egyptian gods
    for the king’s life, eternity, and dominion.
  language: English
  quote_policy: quoted
