canonical_text:
  quote: ''
  summary: A hymn addresses Osiris as a sleeping divine mummy and lord of the earth,
    child of the Earth Serpent, illumined by Ra-Khepera while lying in the form of
    Seker. The passage describes the earth and human works resting on him, the Nile
    and breath of life coming from his body, vegetation and crops depending on him,
    and humans living by his breath and flesh. It concludes that Osiris' nature and
    attributes exceed the writer's understanding.
  language: English
  quote_policy: summarized
