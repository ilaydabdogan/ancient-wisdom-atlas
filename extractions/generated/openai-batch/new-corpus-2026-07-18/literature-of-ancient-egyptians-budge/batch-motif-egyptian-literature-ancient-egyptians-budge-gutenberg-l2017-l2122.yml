canonical_text:
  quote: ''
  summary: A deceased speaker addresses the Great God in the Hall of Truth, declares
    knowledge of the Forty-two gods, makes a negative confession of sins not committed,
    asks the gods of Maati to declare him innocent in the Great Judgment, cites charitable
    and cultic deeds, and refers to Herfhaf, the Persea tree, and the Balance in Aukert.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker addresses the Great God, Lord of Maati, says he has come before
    him, and says he knows the names of the Forty-two gods in the Hall of Truth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Forty-two gods are said to live with the Lord in the Hall of Truth, keep
    ward over sinners, and feed on sinners' blood when human lives are taken into
    account before Un-Nefer, identified as Osiris.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says he has brought truth and destroyed wickedness, and denies
    doing evil to people or family, murder, causing pain, causing hunger, and making
    anyone weep.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker denies cultic and ritual offenses, including robbing temple offerings,
    stealing cakes of gods or spirits, committing impurity in holy places, violating
    offering times, taking cattle from divine property, and repulsing the god in his
    manifestations.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker denies economic and environmental offenses, including false measures,
    encroaching on fields, falsifying scales, taking milk from children's mouths,
    driving away cattle, snaring divine fowl, stopping water, breaching a canal, and
    extinguishing a fire when it should burn.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The speaker repeats the declaration that he is pure four times.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the second part of the chapter, each declaration of innocence is coupled
    with the name of one of the Forty-two Judges; examples include figures from Heliopolis,
    Kheraha, Hermopolis, the Qerti, Rastau, and Hensu.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage note states that the Forty-two gods represent Egypt's forty-two
    nomes and were probably local gods or spirits whose names made the Forty-two Judges
    represent all Egypt.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The heart described as righteous and sinless asks the gods in the Hall of
    Maati not to bring its wickedness before the god they follow, not to let evil
    come upon it, and to declare it innocent before Nebertcher.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The gods in the Hall of Maati are described as without taint of sin, living
    upon truth and feeding upon truth before Horus, and the speaker asks them to deliver
    him from Baba on the day of the Great Judgment.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The speaker says he lives and feeds upon truth, has performed commandments,
    has given bread to the hungry, water to the thirsty, clothing to the naked, and
    a ferry boat to one without one, and has made offerings to gods and funerary meals
    to spirits.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The speaker says he has testified before Herfhaf and been approved, has seen
    things beneath the Persea tree in Rastau, and has come to declare truth and set
    up the Balance in Aukert; the footnote identifies Herfhaf as the ferryman of righteous
    souls to the Island of Osiris.
  category: sequence
  evidence_refs:
  - ev:6
