canonical_text:
  quote: ''
  summary: Royal children perform with menats and sistra before the king, praise his
    divine favor and royal power, and intercede for Sanehat. The king tells Sanehat
    not to fear, grants him court rank, and orders provisions. Sanehat receives palace
    lodging, cleansing and fine clothing, a noble house with rations and gifts, a
    marked pyramid site with funerary furnishings, a funerary lake and estate, and
    a gold-plated statue made by royal command.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Royal children bring musical instruments, including menats and sistra, rattle
    the sistra, and pass before the king.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The royal children address the king with praise, naming the Lady of Heaven,
    Nubt, and the Lady of the Stars as favoring or joining him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The praise speech says the king sails south wearing the Crown of the North
    and north wearing the Crown of the South, and it attributes wisdom and health
    to him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speech says the king terrifies those who seek mercy, is propitiated like
    Ra, is acclaimed like Nebertcher, conquers and slays, and gives breath to the
    afflicted.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The royal children ask the king to grant a boon to Sanehat, described as a
    traveller, desert warrior, and Egyptian-born man who fled to a far country because
    of fear of the king.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king says Sanehat should not fear, appoints him among palace officials,
    and orders that rations be provided for him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sanehat leaves the king's privy chamber, the royal children clasp his hands,
    and he is lodged in the furnished house of one of the king's sons.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The lodging contains a bath, representations of the heavens, objects from
    the Treasury, royal linen, fine myrrh used by the king, and chambers overseen
    by favored officials.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sanehat says the years slide off his body; he cuts and combs his hair, casts
    away foreign dirt and nomad apparel, wears fine linen, anoints himself with costly
    ointments, and sleeps on a bedstead.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Sanehat receives the house of a smer nobleman; workmen labor on it, its garden
    and groves are replanted, palace rations arrive daily, and the royal children
    continue giving him gifts.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A site for a stone pyramid among the pyramids is marked for Sanehat, and royal
    or necropolis officials prepare its site, designs, inscriptions, and funerary
    furniture.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Sanehat maintains the building, acquires surrounding land, makes a lake for
    funerary ceremonies, and provides gardens, groves, and dwellings on the estate.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Sanehat's statue, made for him by the king, is plated with gold and has a
