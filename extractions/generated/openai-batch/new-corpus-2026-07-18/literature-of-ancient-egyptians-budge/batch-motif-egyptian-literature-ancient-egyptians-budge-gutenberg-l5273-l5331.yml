canonical_text:
  quote: ''
  summary: A first-person speaker addresses Ur-kherp-hem and urges enjoyment of life.
    The speaker describes Amentet and the valley of the dead as dark and restrictive,
    contrasts living or running water with stagnant water, and longs for water and
    north wind. Arniau is described as a feared death-god who calls and takes all
    without distinction and does not heed supplication or offerings. The speaker then
    asks arrivals at the funeral mountain to provide offerings, incense, and libations
    at festivals of Amentet. The inscription is attributed to Imhetep, and footnotes
    explain funerary offering formulas and the Tet pillar's resurrection symbolism.
  language: English
  quote_policy: summarized
