canonical_text:
  quote: ''
  summary: A hymn praises Amen as healer, deliverer, hearer of petitions, controller
    of fate and lifespan, and protective power over water, crocodile, storm, anger,
    and battle. It identifies all gods as three, Amen, Ra, and Ptah, and describes
    their cities and heavenly messages written in the letters of Thoth. It then maps
    Amen to cosmic deities and phenomena, makes the Nile arise beneath his sandals
    and dwell in his body, and describes earth as his wife whose union produces the
    tree of life and grain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Amen is described as driving away evils and diseases, healing the eye without
    medicaments, opening the eyes, and driving away inflammation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Amen is said to deliver whom he pleases even from the Tuat and to save a man
    from what is ordained for him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Amen is described as having eyes and ears on every path of the one he loves,
    hearing petitions, and coming quickly from afar to one who calls.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Amen is said to lengthen or shorten a man's life and to give a beloved person
    more than was fated for him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: When Amen casts a spell on water and his name is on the waters, uttering his
    name is said to make the crocodile have no power.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The winds are driven back, the hurricane is repulsed, remembrance of Amen
    calms wrath, and he speaks a gentle word in strife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Amen is described as a pleasant breeze to one who appeals to him, as delivering
    the helpless one, and as more helpful than millions to one who sets him in his
    heart.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: One warrior fighting under Amen's name is said to be better than hundreds
    of thousands.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:9
  text: 'All the gods are said to be three: Amen, Ra, and Ptah; Amen''s name is hidden,
    Ra belongs to him as his face, and his body is Ptah.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Thebes, Anu, and Hetkaptah are named as established cities; a message from
    heaven is heard in Anu, repeated in Memphis to Ptah, written in the letters of
    Thoth, sent to the City of Amen, and answered in Thebes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: Amen's heart is called Understanding, his lips Taste, and his Ka all the things
    in his mouth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: Two caverns are beneath Amen's feet, and the Nile appears from a hollow beneath
    his sandals.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:13
  text: Amen's soul is Shu, his heart is Tefnut, he is Heru-Khuti in the upper heaven,
    his right eye is day, his left eye is night, and his body is Nu.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:14
  text: The Nile is described as dwelling in Amen's body, producing and nourishing
    all that is.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:15
  text: Amen breathes breath into all nostrils, and the Luck and Destiny of every
    man are with him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:16
  text: Earth is called Amen's wife; he unites with her, his seed is the tree of life,
    and his emanations are grain.
  category: relationship
  evidence_refs:
  - ev:4
