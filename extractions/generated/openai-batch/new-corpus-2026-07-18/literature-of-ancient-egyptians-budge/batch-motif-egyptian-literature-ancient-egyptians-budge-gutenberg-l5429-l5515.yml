canonical_text:
  quote: His son shall save us.
  summary: Ammuiansha asks what will happen to the land without the beneficent god.
    The narrator answers by praising the royal son as successor, divine ruler, wise
    decree-maker, warrior, conqueror, beloved king, and ruler predestined from birth.
    The Shekh of Upper Thennu then favors the narrator with marriage, land, rank,
    food, and military office. The narrator describes years of prosperity, children,
    hospitality to travelers, protection of the thirsty, suppression of robbers, and
    military campaigns. A renowned warrior of Thennu challenges him for spoil, and
    the narrator answers by denying any prior relation and comparing the challenger
    to aggressive bulls and a braggart, while invoking God’s knowledge.
  language: English
  quote_policy: quoted
