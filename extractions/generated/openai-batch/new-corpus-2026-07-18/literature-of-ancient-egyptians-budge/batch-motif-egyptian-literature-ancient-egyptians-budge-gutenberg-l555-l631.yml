canonical_text:
  quote: ''
  summary: The passage describes the Pyramid Texts as Egyptian funerary writings intended
    to secure the dead king’s resurrection, continued life, royal power in the Other
    World, offerings for his ka, restored faculties through the opening-of-the-mouth
    rite, servants and protection in the afterlife, and help through prayers and offerings.
    It also describes a religious development toward prayer and the influence of Osiris
    religion, which promised life beyond the grave through Osiris’s suffering, death,
    and resurrection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Pyramid Texts and older texts within them were
    written for the benefit of the king to effect his resurrection, happiness in the
    Other World, and everlasting life.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the dead king was intended to become a king in the
    Other World, reign over gods, control heavenly powers, and command righteous spirits
    and souls.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that Egyptians feared the resurrected king might die a
    second time in the Other World, and that prayers, spells, hymns, and incantations
    in the Texts aimed to preserve his life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that daily offerings were made in the pyramid’s funerary
    temple and that a priest uttered a formula believed to convert material food into
    spiritual food for the king’s ka.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that failure to perform the offering service was counted
    as a sin against the dead king’s spirit.
  category: relationship
