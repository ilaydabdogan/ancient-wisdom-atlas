canonical_text:
  quote: ''
  summary: The passage introduces and translates part of a rock inscription of Thothmes
    II. A messenger reports revolt in Kash/Nubia; the king swears by Ra and Amen to
    destroy the male rebels, sends soldiers in his first war, receives captives after
    the campaign, and the text concludes by attributing the outcome to his bravery
    and divine favor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The extract is presented as an example of an inscription in which a king describes
    a successful expedition into hostile territory; it is from a hieroglyphic rock
    inscription dated to the first year of Thothmes II.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The opening lines enumerate the king's names and titles and proclaim sovereignty
    over several named regions, including Upper and Lower Egypt, Nubia, the Eastern
    Desert, Sinai, Syria, and southern countries.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A messenger salutes the king and reports that the people of Kash are in revolt,
    that the king's subjects have become hostile, and that fighting has begun.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The messenger says Egyptians in Nubia are driving cattle down from the shelter
    of a stronghold built by Thothmes I to hold back southern and Eastern Desert tribes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On hearing the report, the king becomes furious like a panther or leopard
    and swears by Ra and Amen that he will leave no male alive among the rebels.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king sends many soldiers into Nubia in what the passage identifies as
    his first war, with the purpose of overthrowing rebels and disaffected persons.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The soldiers arrive in Kash, overthrow the people described as rebels, and
    leave no male alive except one son of the Prince of Kash, who is carried alive
    with servants to the king.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king sits on his throne, and captured prisoners are placed under his feet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The land is said to return to its former state of subjection, and the people
