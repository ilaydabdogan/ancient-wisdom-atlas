canonical_text:
  quote: ''
  summary: The passage presents hymnic and litany material addressed to Osiris. Osiris
    is praised as eternal ruler, son of Nut and Keb, holder of royal regalia, and
    lord of Abydos and the Other World. The scribe Ani petitions for afterlife splendor,
    travel to Tatu and Abydos, passage through otherworld pylons, offerings, and a
    homestead in Sekhet Aru. A second hymn describes gods bowing before Osiris and
    a speaker declaring truth, purity, and freedom from sin. A further address praises
    Osiris as guide of the Other World; Isis drives away fiends from his paths, and
    the dead rise, breathe, and behold his disk.
  language: English
  quote_policy: summarized
