canonical_text:
  quote: ''
  summary: Prince Baiufra tells King Khufu a story from Seneferu's reign. The gloomy
    king Seneferu summons the magician and scribe Tchatchamankh, who arranges a pleasure
    outing on a lake with a boat rowed by maidens. When one maiden loses a malachite
    hair ornament in the water, Tchatchamankh recites spells that divide and pile
    up the lake water, allowing him to recover and return the ornament. He then restores
    the lake to normal. Seneferu rewards him, and Khufu orders funerary offerings
    for Seneferu and Tchatchamankh.
  language: English
  quote_policy: summarized
