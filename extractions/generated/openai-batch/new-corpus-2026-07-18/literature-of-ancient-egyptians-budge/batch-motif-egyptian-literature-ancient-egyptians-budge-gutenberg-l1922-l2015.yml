canonical_text:
  quote: ''
  summary: 'The passage describes several Book of the Dead prayers and rubrics: petitions
    for offerings and forgiveness, a prayer to four Ape-gods who judge and admit the
    deceased through afterlife places, a heart-address prayer for the weighing of
    the heart before Osiris and divine officials, instructions concerning green stone
    heart scarabs, and an introduction to the declaration before Osiris and the Forty-two
    Judges in the Hall of the Two Maati goddesses.'
  language: English
  quote_policy: summarized
