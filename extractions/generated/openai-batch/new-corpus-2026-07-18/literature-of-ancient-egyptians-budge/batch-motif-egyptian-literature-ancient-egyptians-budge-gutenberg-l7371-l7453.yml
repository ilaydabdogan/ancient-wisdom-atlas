canonical_text:
  quote: Men and women proceeded from his two eyes. His utterance became the gods.
  summary: A hymn praises Amen/Amen-Ra as the one creator of humans, gods, animals,
    food, land, sky, and precious substances. Gods, animals, countries, and divine
    beings adore him. The hymn describes his many names and forms, his daily rising
    and setting, his journey in solar boats over Nu, and the overthrow and burning
    of a serpent-like enemy. It closes with further praise of Amen-Ra, including crowns,
    serpent-goddesses, rejoicing beings, and Thebes loving him when he rises.
  language: English
  quote_policy: quoted
