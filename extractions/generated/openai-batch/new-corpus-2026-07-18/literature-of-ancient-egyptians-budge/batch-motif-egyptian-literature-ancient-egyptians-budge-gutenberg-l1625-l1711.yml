canonical_text:
  quote: ''
  summary: The passage summarizes major chapters of the Theban Recension of the Book
    of the Dead, emphasizing funeral recitations, mummy-chamber rites, judgment before
    Osiris, mapped regions of the Osirian afterlife, protective and restorative spells,
    transformations, boat passage in the Tuat, amulets, resurrection, and the perfected
    spirit-soul's celestial powers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Theban Recension is described as containing about one hundred and ninety
    chapters, many with rubrics stating effects produced by recital and ceremonies
    performed during recital.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some chapters provide funeral formulas, describe the mummy chamber, and prescribe
    magical ceremonies and power objects placed in niches in its four walls.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chapter 125 depicts the Judgment Hall of Osiris and gives declarations of
    innocence made by the deceased before Forty-two Judges.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Several chapters describe Halls, Pylons, and Divisions of the Kingdom of Osiris,
    identify the gods guarding them, and provide formulas for the deceased to say
    at each.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Chapter 110 depicts the Elysian Fields and identifies towns and places in
    them.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: One spell helps the deceased avoid doing work, and another makes a figure
    work for him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Chapters restore the deceased's mouth, enable it to open, provide words of
    power, restore memory, restore the heart, and protect the heart from stealers
    or injury.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Spells are listed for driving away crocodiles, snakes, and serpents and for
    protecting the deceased from slaughter, decapitation, second death, bodily decay,
    the headsman, stumbling, lack of air and water, and boiling water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Some chapters enable the deceased to leave the tomb, overthrow enemies, and
    come forth by day.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Chapters 76-89 allow the deceased to transform into divine beings, birds,
    a lotus, a serpent, a crocodile, or any being or thing he pleases, and also allow
    the soul to rejoin its body.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The deceased is made an associate of Thoth and is given use of a magical boat
    and the services of a celestial ferryman across a river in the Tuat to the Island
    of Fire where Osiris lived; other chapters provide access to the Boat of Ra.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Other chapters enable the deceased to know the Souls or gods of the East,
    West, and named towns, and to find his way through Rastau in the kingdom of Seker,
    god of Death.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The deceased is given power to return to earth, escape a fiend who takes souls
    in a net, and receive amulet spells that confer divine powers and restore his
    heart and head.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Final chapters keep heat in the body until resurrection, give everlasting
    life, allow escape from the second death, raise the dead body and spirit-soul,
    perfect the spirit-soul, and grant celestial powers and equal intercourse with
    gods.
  category: sequence
  evidence_refs:
  - ev:12
