canonical_text:
  quote: ''
  summary: The passage introduces Egyptian legends of the gods, stating that gods
    and goddesses once lived on earth and ruled Egypt beneficently like Pharaohs.
    It describes the gods as divine yet humanlike in emotions, bodily condition, aging,
    and death. Ra is presented as the greatest god, an ideal just king, and the divine
    father claimed by later Egyptian kings. The passage also states that Alexander
    the Great sought acknowledgment from Amen/Ammon at Siwah and thereby became rightful
    lord of Egypt.
