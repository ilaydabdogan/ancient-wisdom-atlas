canonical_text:
  quote: ''
  summary: The passage recounts Piankhi’s ritual visit to the solar temple, his reception
    of submissions and gifts, Tafnekht’s rebellion and plea for peace, an oath of
    allegiance sworn in a temple, further submissions from Egyptian towns and rulers,
    Piankhi’s return south with loot, public praise, and the later inscription of
    his conquest on a granite stele at Gebel Barkal.
  language: English
  quote_policy: summarized
