canonical_text:
  quote: ''
  summary: 'The passage describes ancient Egyptian writing materials and document
    storage: pupils and teachers used limestone slabs or whitened boards because papyrus
    was costly; masons and sculptors used slab copies and scale lines for temple and
    monument work; potsherds served for writing practice and later administrative
    documents; Copts later used similar materials for Scripture drafts and letters;
    papyrus rolls were tied, sometimes sealed, and valuable rolls were kept in book
    boxes in a library or “house of books.”'
  language: English
