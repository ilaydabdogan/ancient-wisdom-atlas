canonical_text:
  quote: I was as cool water and fire in the house of my Lord.
  summary: An Eleventh-Dynasty autobiographical inscription presents Thetha as a trusted
    servant, seal-bearer, administrator, and body-companion of King Uahankh/Antef.
    Thetha stresses royal favor, correct management of offerings, tribute, and accounts,
    moral conduct, travel in the royal retinue, and continued service under the king's
    son and successor. The passage then introduces the next text, the autobiography
    of Aahmes/Amasis the naval officer.
  language: English
  quote_policy: quoted
