canonical_text:
  quote: '"Wake up, Horus! Thy protection is established."'
  summary: Isis gives birth to Horus in hiding, conceals him from Set, and later finds
    him lifeless from a poisonous wound. A local woman, Nephthys, and Serqet respond
    to Isis's grief; Nephthys advises an appeal to Ra. Isis supplicates the solar
    boat, Ra stops its course, and Thoth descends with powerful spells. Thoth recites
    healing commands, Horus returns to life, the solar boat resumes its journey, and
    Horus is later fostered at Buto and grows up to defeat Set and avenge his father.
  language: English
  quote_policy: quoted
