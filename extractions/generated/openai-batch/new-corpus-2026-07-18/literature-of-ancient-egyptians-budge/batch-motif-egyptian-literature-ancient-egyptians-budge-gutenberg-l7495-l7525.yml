canonical_text:
  quote: ''
  summary: A hymn addresses Horus as a fiery solar child who sails the sky, destroys
    darkness, wakes beings, travels by boat over a fiery lake, and is aided by divine
    figures in the defeat of the fiend Neka. The hymn then describes Horus transforming
    into Tem, bringing light to the dead before darkness returns to them, and being
    invoked as a judge who establishes truth, removes sin, and may restore a stolen
    office to the speaker.
  language: English
  quote_policy: summarized
