canonical_text:
  quote: The poor have become rich, and the rich poor.
  summary: The passage presents Apuur's account of social disorder, legal rejection,
    royal displacement, exposed royal secrets, reversals of wealth and status, neglected
    or endangered tombs, hunger, family violence, exhortations to destroy enemies
    of the sacred palace and restore divine service, and an anticipated king described
    as a shepherd of mankind who would restore order and prosperity. The editor notes
    a resemblance to Hebrew prophetic descriptions and to Psalm lxxx. 1's Shepherd
    of Israel.
  language: English
  quote_policy: quoted
