canonical_text:
  quote: ''
  summary: Una recounts how King Merenra appointed him Duke and Governor of the South
    because the king was pleased with him. He describes his effective administration,
    royal missions to obtain stone, wooden, and funerary materials for the Queen's
    pyramid Khanefer Merenra, river and canal transport works, obedience to the king's
    orders and divine Ka, and concludes with familial praise and the title vassal
    of Osiris.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Una says King Merenra made him Duke and Governor of the South and related
    districts because the king's heart was satisfied with him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Una says he was a Palace official and royal sandal-bearer and was praised
    for watchfulness at court concerning official appointments.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that this rank had not previously been bestowed on any
    servant.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Una reports that, while governing the South, no one complained or quarrelled
    with a neighbour, and he counted palace dues and labour obligations twice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: King Merenra sent Una to Abhat and Abu to bring back a sarcophagus with cover,
    a pyramidion, granite doors, offering tables, and related stonework for the Queen's
    pyramid Khanefer Merenra.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Una sailed down the Nile to the pyramid Khanefer Merenra with six lighters,
    three barges, three floats, and one war boat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: King Merenra sent Una to Het-nub to bring back a large stone offering table,
    which was quarried, floated downriver in a lighter, and made to reach the king
    in seventeen days.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Una cut acacia planks sixty cubits long and thirty cubits broad, had them
    assembled in seventeen days, and says the work arrived at the pyramid in peace
    despite there being no water in the basins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: King Merenra sent Una to excavate five canals in the South and to make three
    lighters and four barges from acacia wood of Uauat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The governors of Arthet, Uauat, and Matcha brought wood for Una's work, and
    the completed vessels were loaded with large granite slabs and passed through
    the five canals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Una says he acted according to the order given by the king's divine Ka and
    ascribed majesty, praise, and worship to the Souls of King Merenra.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Una describes himself as beloved by his father, praised by his mother, gracious
    to his brethren, Duke and true Governor of the South, and vassal of Osiris.
  category: attribute
  evidence_refs:
  - ev:8
