  summary: The royal speaker recounts defeating and enslaving foreign groups in Egypt,
    dedicating their herds to Amen, building a fortified desert well, sending maritime
    and desert expeditions to Punt, Aataka, and the turquoise desert, receiving precious
    goods and foreign homage, and presenting offerings to Egyptian deities including
    Hathor.
