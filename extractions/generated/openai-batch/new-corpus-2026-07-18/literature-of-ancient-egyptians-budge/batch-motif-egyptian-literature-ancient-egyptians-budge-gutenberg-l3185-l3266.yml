canonical_text:
  quote: "“The child shall live! The poison shall die!”"
  summary: The passage introduces the legend of Isis after Set kills Osiris and seeks
    power. Isis escapes Set’s house with her unborn child under Thoth’s protection.
    Thoth foretells that the child will grow strong, sit on his father’s throne, and
    avenge him. Isis travels with seven named scorpions. At Teb, Usert shuts her door
    against Isis, while the peasant woman Taha admits her. The scorpions retaliate
    by concentrating their poison in Tefen, who stings Usert’s son; fire breaks out
    and unseasonal rain falls. Isis pities the child, declares her power over death
    through spells, lays hands on him, and commands the poisons to leave. The spell
    invokes Isis’s words of power, Ra, and the saving of Horus through his mother.
    The fire is extinguished, Usert brings gifts, and the passage says the spell has
    the desired effect on the poison and assumes the child’s life is restored.
  language: English
  quote_policy: quoted
