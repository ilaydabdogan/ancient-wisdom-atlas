canonical_text:
  quote: ''
  summary: Bata tells Anpu that he will take the form of a wonderful bull and be brought
    before the king. The king rejoices at the bull and rewards Anpu. The bull later
    speaks to the August Lady, identifying himself as Bata and saying he lives despite
    the destruction of the acacia that held his heart. The August Lady obtains the
    king's oath and asks for the bull's liver. The king orders the bull offered up.
    When the bull is slain, two drops of blood fall by the royal doorway and become
    two mighty acacia trees. Later, an acacia speaks to the August Lady as Bata and
    again declares that he is alive.
  language: English
  quote_policy: summarized
