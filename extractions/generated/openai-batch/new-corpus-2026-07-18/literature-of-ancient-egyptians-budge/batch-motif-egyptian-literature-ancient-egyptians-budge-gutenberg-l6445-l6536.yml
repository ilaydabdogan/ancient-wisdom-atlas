  quote: ''
  summary: An Egyptian envoy negotiates with a foreign ruler for cedar wood needed
    for the holy Boat of Amen-Ra. The ruler demands payment and cites former transactions,
    while the envoy argues that the sea, ships, and cedars belong to Amen, that Amen
    sent him with the god's figure, and that obedience to Amen will bring life, strength,
    health, and good rule.
  language: English
  quote_policy: summarized
