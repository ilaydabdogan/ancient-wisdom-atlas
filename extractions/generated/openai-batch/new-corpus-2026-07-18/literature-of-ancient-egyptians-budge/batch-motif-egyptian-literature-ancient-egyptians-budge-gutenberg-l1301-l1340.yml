canonical_text:
  quote: There is a box made of flint in a house called Sapti in Heliopolis.
  summary: 'King Khufu questions Teta about the numbers of the Apet chambers of Thoth’s
    shrine. Teta says he does not know the number but knows where it may be found:
    in a flint box at Heliopolis. He says the oldest of three children soon to be
    born to Rut-tetet, wife of a priest of Ra, will bring the box. These children
    are described as children of Ra and are predicted to attain high dignity, with
    the oldest becoming high priest of Heliopolis. Khufu is saddened, asks when they
    will be born, and later plans a visit to Ra’s temple at Sakhabu; Teta says he
    will ensure sufficient canal water for the royal barge. Khufu then orders lodging
    and provisions for Teta.'
  language: English
  quote_policy: quoted
