canonical_text:
  quote: ''
  summary: The passage introduces the Story of Sanehat and narrates Sanehat's account
    of a king's death and heavenly ascent, palace mourning, secret messages to the
    royal son Usertsen, Sanehat's frightened flight from the palace, covert travel
    through borderlands and desert, a near-fatal thirst ordeal, rescue by a desert
    caravan with water and warmed milk, and his later reception by Ammuiansha of Upper
    Thennu, to whom he gives a deceptive account of his arrival.
  language: English
  quote_policy: summarized
