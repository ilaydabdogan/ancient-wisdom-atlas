  text: The king is described as drawing near to his horizon, ascending into heaven,
    being invited to the Disk, and causing public mourning at the King's House.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before the king's death, an army had been sent to the Land of the Themehu
    under the command of the king's eldest son Usertsen, who was returning with captives
    and animals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: High officers send messengers to the royal son in the western country and
    advise him to return secretly with his bodyguard without letting the army know.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sanehat hears the speaking voice, becomes afraid and physically shaken, and
