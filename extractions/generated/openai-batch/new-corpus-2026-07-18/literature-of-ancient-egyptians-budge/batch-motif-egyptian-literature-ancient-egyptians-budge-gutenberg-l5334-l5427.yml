  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sanehat hides in scrub during the day to avoid watchmen and marches again
    at night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the Lake of Kamur, Sanehat is overwhelmed by thirst, suffers intensely,
    and says that this is the taste of death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Desert Satiu see Sanehat; a caravan master who had been in Egypt recognizes
