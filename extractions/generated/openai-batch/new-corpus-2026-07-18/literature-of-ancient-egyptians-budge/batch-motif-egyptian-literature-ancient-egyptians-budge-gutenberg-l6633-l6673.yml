canonical_text:
  quote: ''
  summary: After the speaker's painful words are reported, a governor sends food,
    drink, and a singer to comfort him and postpones further business until morning.
    The next day the governor addresses the Tchakaru about broken ships and missing
    sailors, then sends the speaker away by ship. Winds drive the speaker to Alasu,
    where local people intend to kill him and drag him before Queen Hathaba. Through
    someone who understands Egyptian, the speaker appeals to the queen as an ambassador
    of Amen and warns of reprisals. The queen calls off her people and tells him to
    lie down and sleep before the narrative breaks off.
  language: English
  quote_policy: summarized
