canonical_text:
  quote: ''
  summary: The passage introduces the Tale of the Two Brothers and begins the narrative
    of Anpu and Bata. Anpu is the elder brother with a house and wife; Bata is the
    younger brother, an exceptional farmer and herdsman with divine power in him.
    Bata works for Anpu, listens to speaking cattle, and helps with ploughing after
    the Inundation. When Anpu sends Bata to fetch seed corn, Anpu's wife propositions
    Bata; he rejects her words by invoking family relationships and returns to the
    field.
  language: English
  quote_policy: summarized
