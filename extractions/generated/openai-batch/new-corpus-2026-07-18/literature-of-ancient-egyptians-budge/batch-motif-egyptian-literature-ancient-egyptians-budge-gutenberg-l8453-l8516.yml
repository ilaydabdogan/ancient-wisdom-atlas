canonical_text:
  quote: ''
  summary: 'The passage summarizes three Egyptian compositions: the daily Ritual of
    the Divine Cult for Amen-Ra, a funerary work called "May My Name Flourish," and
    the Book of Aapep, in which priestly rites strengthen the Sun-god against the
    serpent enemy of dawn.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ritual of the Divine Cult is described as a sixty-six chapter work recited
    daily by the high priest of Amen-Ra in the temple at Thebes during symbolical
    ceremonies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ritual was originally intended for daily recitation by the king, but the
    high priest personified the king when performing it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stated object of the ritual was to place the king in direct daily contact
    with Amen-Ra and renew the divine power and wisdom associated with kingship.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king entered the temple in the early morning, purified the sanctuary and
    himself, advanced to the shrine, opened it, and knelt before a small gilded wooden
    figure of the god.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king embraced the divine figure, and the passage states that Amen-Ra's
    divine power passed from the figure into the king during the embrace.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the embrace, the king offered items said to symbolize Truth, dressed
    and decorated the divine figure, closed the shrine, sealed it with mud seals,
    and left the sanctuary.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Book "May My Name Flourish" is described as a popular Roman Period funerary
    work derived from a long prayer in the Pyramid Texts and used as a spell for the
    deceased's name to flourish eternally in heaven and on earth.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: Aapep is described as a god of evil who could become incarnate in many forms,
    especially wild animals, monster serpents, and venomous reptiles.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Aapep is said to take the form of a huge serpent lying near the portals of
    dawn to swallow the sun as it is about to rise.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Aapep is accompanied by devils, fiends, and powers of storm, and is described
    as the deadly foe of order and good in heaven and earth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Priests recited chapters and performed magical ceremonies intended to strengthen
    the Sun-god against Aapep.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The chapters act as spells that paralyze Aapep; the Sun-god shoots fiery darts
    into him, attendant gods hack his body to pieces, and the sun rises while heavenly
    beings rejoice.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
