canonical_text:
  quote: ''
  summary: 'The passage concludes a tale in which an August Lady persuades the king
    to cut down two acacia trees; a splinter enters her mouth, she conceives, bears
    a son, and the child receives royal titles before becoming king as Bata. Bata
    judges his wife, appoints Anpu as heir, dies after twenty years, and Anpu succeeds
    him. The passage then introduces the Story of the Shipwrecked Traveller as an
    Egyptian fairy story: a servant encourages a prince after a safe return, and the
    shipwrecked traveller begins recounting a voyage to the king''s copper mines that
    ended in a violent storm, the loss of the ship and crew, and his own survival
    by seizing a plank.'
  language: English
  quote_policy: summarized
