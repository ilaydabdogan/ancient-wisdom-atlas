  quote: ''
  summary: The passage first notes that late scribal interpolations explaining names
    have been omitted. It then introduces the Legend of Khnemu and a seven years'
    famine, describing its Sahal granite inscription and dating. The legend concerns
    a famine in King Tcheser's reign, attributed to neglect of Khnemu, god associated
    with the Nile springs. Tcheser sends Meter a dispatch describing seven years without
    a proper Nile rise, scarcity, social distress, empty granaries, and his wish to
    consult sacred authorities and temple books about the Nile's source and presiding
    deity.
