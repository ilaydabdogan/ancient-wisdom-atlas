comparison_claims:
- id: claim:1
  claim: The passage explicitly presents the Book of Breathings as a later substitute
    for the Book of the Dead, selecting portions considered necessary for resurrection
    of the body and salvation of the soul.
  claim_level: same_function
  target: Book of the Dead
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the passage's description of function and textual
    derivation, not to all versions of either work.
- id: claim:2
  claim: The passage connects the resurrection function of these later funerary texts
    to the cult of Osiris, described here as the first man who had risen from the
    dead.
  claim_level: same_motif
  target: Osirian resurrection pattern within the funerary corpus
  evidence_refs:
  - ev:1
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives a brief explanatory statement and a footnote, not
    a full Osiris myth narrative.
- id: claim:3
  claim: The passage states that Part II of the Book of Breathings has the same fundamental
    ideas as Part I, though expressed in different forms.
  claim_level: same_function
  target: Part II of the Book of Breathings
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is based on the translator's summary in the footnote
    and not on the full text of Part II.
