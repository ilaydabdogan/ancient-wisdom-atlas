canonical_text:
  quote: ''
  summary: The passage introduces the Book of Breathings as a later abridged funerary
    substitute for the Book of the Dead, then gives translated sections addressed
    to the deceased Kersher. The text describes purification, entry into the Tuat,
    divine protection, restored breath and bodily life, offerings, vindication by
    Truth before Osiris, moral innocence, and identification of the deceased with
    Osiris and other gods.
  language: English
  quote_policy: summarized
