canonical_text:
  quote: ''
  summary: The passage introduces the Edfu temple legend of Horus of Behutet and the
    Winged Disk, then narrates Ra-Harmakhis travelling by boat while Horus repeatedly
    defeats enemies. Horus takes the form of a winged disk, the enemies take forms
    including crocodiles and hippopotami, the Followers of Horus use iron spears and
    chains, and Nekhebet and Uatchet accompany Horus as serpents. The narrative ends
    with further pursuit, slaughter, capture, dismemberment, and distribution of enemy
    bodies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The legend is said to be cut in hieroglyphs on the walls of the temple of
    Edfu, with some incidents illustrated by bas-reliefs; the presented form is dated
    to the Ptolemaic Period while the subject matter is described as older.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage frames the legend as having an underlying historical fact: the
    conquest of Egypt by an early king invading from the south.'
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the 363rd year of Ra-Harmakhis, Ra is in Nubia with soldiers, and the enemy
    has reviled him.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ra sails from Nubia to Edfu with Horus of Edfu; Horus warns Ra that the enemy
    is plotting, and Ra tells Horus to go out and slay them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Horus takes the form of a great winged disk, flies into the air, attacks the
    enemy, and the enemies become unable to see or hear and kill each other.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Horus returns to the Boat of Ra-Harmakhis as a shining, many-coloured winged
    disk and tells Ra to advance and look at the defeated enemies.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ra travels with Ashtoreth, sees enemies lying on the ground fettered, and
    tells the gods to sail because their enemies have been overthrown.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Enemies on the river banks take the form of crocodiles and hippopotami and
    open their jaws to try to swallow the Boat of Ra and the gods inside it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Followers of Horus of Edfu, described as skilled metalworkers or Blacksmiths,
    use iron spears and chains to entangle, drag, spear, and kill crocodiles and hippopotami.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the slaughter, the bodies of 651 crocodiles are brought and laid before
    Edfu.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Thoth tells gods of heaven and earth to rejoice, says Young Horus has come
    in peace, and connects his deeds with the Book of slaying the Hippopotamus.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: From that day, figures of Horus are made in metal.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Horus again takes the form of the winged disk and sets himself on the prow
    of the Boat of Ra.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Horus takes Nekhebet and Uatchet with him in serpent form so that enemies
    of the Sun-god in the South and North may quake.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Horus and his Blacksmiths pursue fleeing foes, carrying spears and chains,
    and slay many near Thebes and during further pursuit.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Enemies flee into Lower Egyptian swamps and try to escape in the forms of
    crocodiles and hippopotami; Horus spends four days in the water slaying them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Horus captures 142 enemies and a male hippopotamus, takes them to the front
    of the Boat of Ra, hacks them in pieces, and gives body parts to followers and
    deities.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: The remnant of the enemy tries to reach the Mediterranean by boats, leaves
    the boats in fear of Horus, and joins worshippers of Set in the Western Delta.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:19
  text: Horus pursues the remnant for one day and one night, finds them, kills many,
    captures 381 alive, slays them, and gives their carcasses to his followers or
    bodyguard.
  category: action
  evidence_refs:
  - ev:12
- id: obs:20
  text: The narrator adds that the custom of eating enemy bodies is very old in Egypt
    and survives in some parts of Africa.
  category: other
  evidence_refs:
