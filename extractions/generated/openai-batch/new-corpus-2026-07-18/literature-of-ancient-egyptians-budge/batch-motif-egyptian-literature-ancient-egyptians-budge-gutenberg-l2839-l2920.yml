candidate_motifs:
- id: motif:1
  label: Divine champion transforms into a winged form to destroy enemies
  taxonomy_refs:
  - shapeshifter
  basis: Horus repeatedly takes the form of a winged disk and uses that form in battle
    against Ra's enemies.
  evidence_refs:
  - ev:4
  - ev:9
  confidence: high
  cautions: The literal form is a winged disk rather than an animal or human disguise;
    the taxonomy label is used only for the explicit change of form.
- id: motif:2
  label: Enemies take dangerous aquatic animal forms
  taxonomy_refs:
  - shapeshifter
  basis: Enemies take the forms of crocodiles and hippopotami on the river banks and
    again in the Delta swamps while trying to escape or attack.
  evidence_refs:
  - ev:6
  - ev:10
  confidence: high
  cautions: The passage says they take these forms but does not explain the mechanism
    or whether it is magical, divine, or symbolic.
- id: motif:3
  label: Divine boat endangered on water
  taxonomy_refs:
  - ark_vessel
  basis: Ra and the gods travel in the Boat of Ra, which enemies in crocodile and
    hippopotamus forms try to swallow.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The boat is a divine travel vessel, not explicitly an ark of survival
    or rescue; the taxonomy connection is functional and should be reviewed.
- id: motif:4
  label: Protective serpent goddesses of North and South
  taxonomy_refs:
  - serpent
  basis: Nekhebet and Uatchet accompany Horus in serpent form to make the Sun-god's
    enemies quake in the South and North.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives the serpent form and protective/terrifying function
    but does not elaborate beyond this episode.
- id: motif:5
  label: Divine victory as conquest narrative
  taxonomy_refs:
  - royal_legitimacy
  basis: The introduction states that the great historical fact underlying the legend
    is conquest by an early king from the south, while the narrative presents Ra and
    Horus defeating enemies throughout Egypt.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:9
  - ev:10
  - ev:12
  confidence: medium
  cautions: The royal-legitimacy reading depends partly on the translator-editor's
    framing in the passage, not solely on direct narrative speech.
- id: motif:6
  label: Aetiology for metal images of Horus
  taxonomy_refs: []
  basis: After Thoth praises Horus's deeds, the passage states that from that day
    figures of Horus were made in metal.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No provided taxonomy family directly matches cult-image aetiology.
- id: motif:7
  label: Dismemberment and distribution of defeated enemies
  taxonomy_refs: []
  basis: Horus hacks captured enemies and a hippopotamus in pieces and gives parts
    to followers, gods, and goddesses; later he gives carcasses of slain captives
    to his followers or bodyguard.
  evidence_refs:
  - ev:10
  - ev:12
  confidence: high
  cautions: The passage does not explicitly call this a sacrifice or ritual meal,
    though the narrator comments on enemy-body eating.
comparison_claims:
- id: claim:1
  claim: The episode of Horus's slaughter of crocodiles and hippopotami is explicitly
    connected in the passage with a named tradition, the Book of slaying the Hippopotamus.
  claim_level: same_motif
  target: Book of slaying the Hippopotamus
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only the title and Thoth's statement; it does not
    quote or summarize the contents of that book.
- id: claim:2
  claim: The enemies' final alliance with worshippers of Set connects this episode's
    opposing forces with a Set-associated hostile group in the Western Delta.
  claim_level: same_function
  target: Set-associated opposition in the Western Delta
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: low
  limitations: The passage only states that the fugitives joined Set's worshippers
    and calls Set the god of evil; no fuller comparison to other Set traditions is
    supplied.
