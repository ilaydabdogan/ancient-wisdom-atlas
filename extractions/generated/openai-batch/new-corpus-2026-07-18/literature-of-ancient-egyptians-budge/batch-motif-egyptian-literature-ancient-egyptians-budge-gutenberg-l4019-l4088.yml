canonical_text:
  quote: ''
  summary: A first-person royal speaker describes peace, security, welfare, restored
    land, and benefactions to gods and people during his reign. He then states that
    he has entered Akert like Ra and that Amen-Ra has established his son Rameses
    IV on the throne of Horus. The passage commands subjects to give homage, offerings,
    labor, and obedience to the new king, whose sovereignty and long life are said
    to be decreed by Amen. The closing lines introduce the next text, a stele narrative
    about Piankhi, King of Nubia, and his invasion and conquest of Egypt.
  language: English
  quote_policy: summarized
