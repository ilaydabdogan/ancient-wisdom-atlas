  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Bata tells Anpu that he will spend seven years seeking the heart, and that
    when he finds it he must place it in a vessel of cold water so that the heart
    will live again and answer an attacker.
  category: speech
  evidence_refs:
  - ev:3
