canonical_text:
  quote: ''
  summary: At dawn Bata confronts Anpu about the pursuit and explains that Anpu's
    wife misrepresented events. Bata wounds himself, separates from Anpu, and announces
    that he will place his heart on an Acacia flower, with instructions for its recovery
    and signs of danger. Anpu grieves and kills his wife. Bata lives alone in the
    Valley of the Acacia, where his heart rests on the tree's flowers. The gods encounter
    him; Ra-Harmakhis orders Khnemu to fashion him a wife. The Seven Hathor Goddesses
    prophesy that she will die by the sword, and Bata warns her not to go out lest
    the River carry her away.
  language: English
  quote_policy: summarized
