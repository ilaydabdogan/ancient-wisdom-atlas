canonical_text:
  quote: ''
  summary: 'The passage summarizes two Egyptian funerary compositions: the Book of
    the Two Ways, a coffin text guide for dead souls crossing the Tuat to Osiris,
    and the Book Am Tuat, a guide to the nocturnal journey of the Sun-god through
    the Tuat and to souls who seek passage with him.'
  language: English
  quote_policy: summarized
