canonical_text:
  quote: ''
  summary: The passage introduces Chapter I on Thoth and Egyptian writing. It describes
    Egyptian scripts, attributes writing, numbers, astronomy, arts, books, record-keeping,
    and wisdom to Thoth, and states that sacred hieroglyphic religious texts were
    believed to help the dead. It recounts Thoth as judge in the heavenly trial of
    Osiris and Set and as presider over the weighing of the heart at the Great Judgment.
    It also describes the Books of Thoth, inspired scribes, Thoth’s ibis-headed form,
    his companion Asten, and Thoth’s enduring role as righteous judge and law-framer.
  language: English
  quote_policy: summarized
