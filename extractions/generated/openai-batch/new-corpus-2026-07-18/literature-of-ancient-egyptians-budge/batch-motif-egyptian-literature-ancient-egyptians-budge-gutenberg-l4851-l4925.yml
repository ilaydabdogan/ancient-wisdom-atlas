canonical_text:
  quote: ''
  summary: Aahmes son of Abana recounts his childhood, military service, repeated
    acts of bravery under King Nebpehtira, captures of enemies and prisoners, and
    royal rewards of gold, slaves, and land. The passage includes sieges and battles
    at Avaris and Sharhana, campaigns against southern and desert peoples, and the
    defeat of named enemies Aatti and Tetaan.
  language: English
  quote_policy: summarized
