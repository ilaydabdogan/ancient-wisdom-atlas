  source_text_path: texts/public-domain/egyptian/project-gutenberg/literature-of-ancient-egyptians-budge.md
  rights_note: Public domain source; metadata permits full text use.
- id: ev:16
  type: summary
  locator: 7801-7810
  quote_or_summary: The messenger of death comes to carry the person away; there will
    be no opportunity for speech; death seizes both the babe at the breast and the
    old man, and the advice should be meditated upon.
