canonical_text:
  quote: ''
  summary: The passage gives ethical and practical maxims concerning farming, humility,
    labor, household conduct, council speech, leadership, festivals, offerings, prayer,
    filial duties to parents in tombs, avoidance of drunkenness and dangerous companions,
    and readiness for death. It also comments that later Egyptian scribes supplemented
    the older Precepts of Ptah-hetep with Maxims of Ani.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A farmer is instructed to till the field given by the great God and not to
    eat excessively near neighbours.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man of substance who seizes prey like a crocodile among field labourers
    is said to bring curses on his children and grief to his parents.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A clan leader trusted and followed by his people is said to become a god.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The addressee is instructed to humble himself, obey a wise man, and fear the
    one who has power.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The addressee is told to be diligent, do more than commanded, avoid wasting
    labor time, and increase household riches through work.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A wise man is instructed to beget a son who will be pleasing to God.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A wise man who is master of his house is instructed to love his wife, provide
    her food, clothing, unguents, happiness, persuasion, embraces, fond names, and
    loving treatment.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The wife is called the man's field and is said to reflect credit on her possessor.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Dependants are to be treated as well as possible by those whom God has blessed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A man seated in his lord's council chamber is instructed to concentrate, keep
    silence, and speak only with skill and experience.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A man who has risen from poverty to city headship is warned not to exploit
    his position or be harsh about grain, since he is only an overseer of the food
    of God.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The addressee is told to think much, keep his mouth closed, align his opinion
    with his lord's, and obey so that the lord may call him 'my son.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The prose commentary says the Precepts of Ptah-hetep were for highly placed
    young men and that later scribes wrote supplementary precepts, including the Maxims
    of Ani.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Maxims of Ani instruct the addressee to celebrate the festival of his
    God in its season, bear testimony after offering, and note that God is angry with
    a transgressor of this law.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: God is said to magnify the name of the man who exalts his Souls, sings praises,
    bows, offers incense, and does homage in his work.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: The addressee is warned to avoid the drunkard, the unknown woman in the street,
    and common men.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: The unknown woman in the street is compared to a deep stream whose windings
    are unknown.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:18
  text: At an inquiry, the addressee is told not to multiply speech and not to act
    as a chatterer.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:19
  text: The sanctuary of God is said to abhor noisy demonstrations; prayer should
    be with a loving heart and hidden words, and God will hear and receive the offering.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:20
  text: Water is to be placed before the father and mother who rest in their tombs,
    and the son will do likewise for the addressee.
  category: action
  evidence_refs:
  - ev:14
- id: obs:21
  text: The house where men drink beer is to be avoided because speech may be repeated,
    the drunk person may fall, break bones, be refused help, be thrown out, and be
    found helpless.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:22
  text: When the messenger of death comes to carry the addressee away, he should be
