- id: ev:10
  type: summary
  locator: 7760-7766
  quote_or_summary: The Maxims of Ani command seasonal celebration of God's festival
    and offerings; God is angry with transgression and magnifies the name of the one
    who praises, bows, offers incense, and does homage.
  source_text_path: texts/public-domain/egyptian/project-gutenberg/literature-of-ancient-egyptians-budge.md
  rights_note: Public domain source; metadata permits full text use.
- id: ev:11
  type: summary
  locator: 7768-7775
  quote_or_summary: The addressee is warned not to enter the presence of a drunkard,
    follow an unknown woman in the street, or go with common men; the woman is compared
    to a deep stream with unknown windings.
  source_text_path: texts/public-domain/egyptian/project-gutenberg/literature-of-ancient-egyptians-budge.md
  rights_note: Public domain source; metadata permits full text use.
- id: ev:12
  type: summary
  locator: 7777-7780
  quote_or_summary: At an inquiry, the addressee should not multiply speech and should
