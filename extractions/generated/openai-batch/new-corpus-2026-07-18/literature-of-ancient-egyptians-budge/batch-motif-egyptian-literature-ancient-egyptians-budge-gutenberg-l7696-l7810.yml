- id: ev:13
  type: summary
  locator: 7782-7785
  quote_or_summary: The sanctuary of God abhors noisy demonstrations; prayer should
    be loving and hidden, and God will hear the words and receive the offering.
  source_text_path: texts/public-domain/egyptian/project-gutenberg/literature-of-ancient-egyptians-budge.md
  rights_note: Public domain source; metadata permits full text use.
- id: ev:14
  type: summary
  locator: 7787-7790
  quote_or_summary: Water should be placed before the father and mother who rest in
    their tombs; as the addressee does this for them, so his son will do for him.
  source_text_path: texts/public-domain/egyptian/project-gutenberg/literature-of-ancient-egyptians-budge.md
  rights_note: Public domain source; metadata permits full text use.
- id: ev:15
  type: summary
  locator: 7792-7799
  quote_or_summary: The house where men drink beer is to be avoided because words
    may be repeated, the drunk person may fall, break bones, receive no help, be thrown
