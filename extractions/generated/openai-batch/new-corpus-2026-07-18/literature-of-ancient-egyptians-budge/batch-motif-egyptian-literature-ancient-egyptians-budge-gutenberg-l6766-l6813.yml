canonical_text:
  quote: ''
  summary: Anpu's wife, fearing exposure after speaking to Bata, fabricates evidence
    that she has been assaulted and accuses Bata to her husband. Anpu prepares to
    kill Bata, but two cows warn Bata of the ambush. Bata flees and appeals to Ra-Harmakhis
    to judge between right and wrong. Ra creates a crocodile-filled stream separating
    the brothers. Bata declares he will seek judgment before the Sun-god, will no
    longer live with Anpu, and will go to the Valley of the Acacia.
  language: English
  quote_policy: summarized
