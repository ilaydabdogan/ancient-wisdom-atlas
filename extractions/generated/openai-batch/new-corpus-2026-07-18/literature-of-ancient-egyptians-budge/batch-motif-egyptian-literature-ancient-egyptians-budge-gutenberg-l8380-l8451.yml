  summary: The passage summarizes the Book of Gates as a guide to the Tuat, describing
    guarded gates, the nocturnal Sun-god's boat journey, and the daily judgment of
    souls by weighing. It then summarizes the Ritual of Embalmment and gives an extract
    on embalming the head with oil, linen bandages associated with deities, and a
    spoken invocation for restored faculties and truth in the afterlife.
  language: English
