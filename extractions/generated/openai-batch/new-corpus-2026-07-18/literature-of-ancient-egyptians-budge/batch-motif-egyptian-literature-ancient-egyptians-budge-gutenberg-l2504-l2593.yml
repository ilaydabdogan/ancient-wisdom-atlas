candidate_motifs:
- id: motif:1
  label: Multiple local creator-god traditions
  taxonomy_refs: []
  basis: The passage explicitly says worshippers of each great god proclaimed him
    Creator of All and lists different creator deities by town.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage summarizes local theologies rather than narrating each creation
    myth.
- id: motif:2
  label: Primeval watery condition before heaven and earth
  taxonomy_refs:
  - chaos
  basis: At the beginning only NU, the primeval watery mass, exists; heaven and earth
    do not yet exist and the creator has no place to stand.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage calls NU a watery mass with germs of later things, not a hostile
    agent.
- id: motif:3
  label: Self-created creator from primeval matter
  taxonomy_refs: []
  basis: Nebertcher/Khepera forms himself from primeval matter and exists alone before
    other created things.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: No taxonomy reference supplied for autogenesis or self-creation.
- id: motif:4
  label: Creation by spoken name or word of power
  taxonomy_refs: []
  basis: The creator's visible form, soul, and later created things appear when names
    or words of power are uttered.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage describes this mechanism through Budge's summary rather than
    a full translated spell sequence.
- id: motif:5
  label: Divine generation from body and shadow
  taxonomy_refs:
  - divine_parent_child
  basis: Shu and Tefnut are produced from the creator's body and shadow and form a
    first triad with him.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The parent-child relation is implied by production from the creator but
    the passage does not use modern kinship terms here.
- id: motif:6
  label: Solar battle with a sunrise-obstructing monster
  taxonomy_refs:
  - chaos
  basis: Aapep waits before sunrise to battle the Sun-god; the Sun-god disables and
    burns him, and the ritual aims to keep sunrise unobstructed.
  evidence_refs:
