  - ev:12
  confidence: medium
  cautions: The passage states union and descent but does not explicitly call the
    relationship a marriage.
comparison_claims:
- id: claim:1
  claim: The passage presents Heliopolitan, Memphite, Hermopolitan, and Theban traditions
    as assigning the same creator function to different local gods.
  claim_level: same_function
  target: 'Egyptian local creator-god traditions: Atem/Tem or Ra, Ptah, Thoth, and
    Amen/Ammon'
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: Only a brief summary of the local traditions is provided; their narrative
    details are not compared.
- id: claim:2
  claim: The passage states that the tradition of the begetting of Shu and Tefnut
    is also attested in the pyramid-era text of Pepi I.
  claim_level: same_motif
  target: Pyramid Text of Pepi I, line 466, as referenced by Budge
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The Pepi I text is mentioned but not quoted or summarized in this passage.
- id: claim:3
  claim: The passage notes a variant identification in which the second version names
    Nebertcher as Ausares, Osiris.
  claim_level: same_function
  target: Second version of the creation account in the papyrus identifying Nebertcher
    with Ausares/Osiris
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The variant is given only in a footnote and does not include the surrounding
    wording of the second version.
