- id: motif:7
  label: Apotropaic destruction of an enemy effigy
  taxonomy_refs: []
  basis: Priests burn waxen figures of Aapep in prepared fires while cursing, trampling,
    and defiling them.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No supplied taxonomy reference directly matches ritual effigy destruction.
- id: motif:8
  label: Cosmic eyes regulating day and night
  taxonomy_refs:
  - duality
  basis: The greater Eye rules the day and the lesser Eye, identified as the Moon,
    rules the night after the first Eye becomes obscured.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage presents the Eyes as cosmological regulators; symbolic interpretation
    beyond day/night duality is not added.
- id: motif:9
  label: Earth-sky divine union and nightly descent
  taxonomy_refs:
  - sacred_marriage
  basis: Shu and Tefnut produce Keb the Earth-god and Nut the Sky-goddess, and Nut
    descends to Keb each evening.
  evidence_refs:
