canonical_text:
  quote: ''
  summary: The passage introduces Egyptian creation traditions and a Theban anti-Aapep
    liturgy, then summarizes a creation account in which Nebertcher/Khepera self-forms
    from primeval matter in the watery mass NU, creates by words and names of power,
    produces Shu and Tefnut, brings forth the Eye/light, and accounts for Keb, Nut,
    darkness, the Moon as a second Eye, and the daily/nightly order.
  language: English
  quote_policy: summarized
