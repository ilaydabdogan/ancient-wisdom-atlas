canonical_text:
  quote: ''
  summary: 'The passage summarizes part of an Egyptian creation account: five deities
    are created and paired in marriages; Osiris is identified as an ancestor-god and
    reincarnation; humans arise from tears from the Eye of Khepera/Sun-god; vegetation
    arises from moonlight on earth; creeping things and other living creatures are
    created and reproduce; and the editor comments on Heliopolitan influence, ancient
    creator gods, and the absence of Ptah and Amen.'
  language: English
  quote_policy: summarized
