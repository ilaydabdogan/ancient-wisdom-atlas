- id: obs:3
  text: At Illahun the town gates are first shut, then opened; Piankhi enters with
    troops, receives tribute, and kills no one.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Memphis keeps its gates shut; Piankhi sends a message telling the Memphites
