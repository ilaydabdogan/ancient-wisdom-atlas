canonical_text:
  quote: "“O men, Unas flieth up into heaven.”"
  summary: The passage describes Unas as a purified, imperishable star and divine
    son who ascends to heaven by flight and by ladders set up by Ra and Horus. It
    invokes Nut, Septet, Ra, Upuatu, Osiris, Horus, Hathor, Keb, Set, and groups of
    gods. It also introduces a following passage in which the king hunts, kills, and
    eats gods to absorb their powers.
