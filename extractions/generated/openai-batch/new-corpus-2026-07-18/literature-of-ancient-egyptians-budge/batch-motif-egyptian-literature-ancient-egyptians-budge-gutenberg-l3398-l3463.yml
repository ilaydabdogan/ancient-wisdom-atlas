canonical_text:
  quote: ''
  summary: A second messenger from Bekhten asks the Egyptian king to send a god to
    free Princess Bentresht from an evil spirit. The king petitions Khensu Nefer-hetep,
    whose statue gives a fourfold portion of power to Khensu Pa-ari-sekher-em-Uast.
    The travelling god is carried to Bekhten, heals the princess, negotiates a festival
    with the departing spirit, and remains there until the prince sees a vision of
    Khensu as a hawk returning to Egypt. The statue and gifts are then sent back to
    Thebes. A closing note discusses Bekhten's uncertain location and compares such
    divine progressions with Isis leaving her temple for people seeking boons.
  language: English
  quote_policy: summarized
