canonical_text:
  quote: ''
  summary: The speaker recounts being given in marriage to Pa-sher-en-Ptah, bearing
    three daughters, and praying with her husband to Imhetep for a son. The god appears
    to the husband in sleep, commands the building of a large hall at the place of
    his concealed body, and promises a male child in return. The husband reports the
    dream to ritual specialists, has the hall made, performs rites and offerings,
    and the speaker later bears a son named Imhetep, also called Peta-Bast. The passage
    ends with the speaker’s death, mummification, funerary rites, and burial in her
    husband’s tomb.
  language: English
  quote_policy: summarized
