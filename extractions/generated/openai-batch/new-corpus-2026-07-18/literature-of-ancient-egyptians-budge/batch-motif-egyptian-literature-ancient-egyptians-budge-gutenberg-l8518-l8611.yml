- id: obs:1
  text: Two copies of the Instructions or Precepts of Tuauf are identified in British
    Museum papyri, and the work is also described as a hymn in praise of learning.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Instructions are presented as advice from a father to his son Pepi, whom
    he is sending to school for training as a scribe.
