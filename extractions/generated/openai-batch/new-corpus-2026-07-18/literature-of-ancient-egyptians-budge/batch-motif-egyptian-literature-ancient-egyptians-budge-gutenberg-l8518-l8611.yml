canonical_text:
  quote: ''
  summary: The passage summarizes the Instructions or Precepts of Tuauf to his son
    Pepi, emphasizing learning and the scribal profession through contrasts with difficult
    trades. It then describes Egyptian medical papyri, magical papyri used for legitimate
    protective purposes, and a Papyrus Sallier IV list of lucky and unlucky days involving
    Ra, Hathor, Uatchet, divine protection, and an unlucky voyage day.
  language: English
  quote_policy: summarized
