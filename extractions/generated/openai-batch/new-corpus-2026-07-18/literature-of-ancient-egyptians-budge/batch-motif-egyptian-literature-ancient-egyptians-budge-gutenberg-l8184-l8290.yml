    century B.C., though many songs are said to be earlier.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The songs in Harris 500 are classed as Love Songs in which a lover compares
    the chosen lady to beautiful flowers and plants and describes pain and grief caused
    by her absence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says the songs' effect depended chiefly on the singer's voice
    and harp accompaniment.
  category: action
