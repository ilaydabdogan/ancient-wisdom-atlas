- id: obs:5
  text: A Leyden papyrus contains three compositions involving a pomegranate tree,
    a fig tree, and a sycamore tree; the trees lament, express gratitude and readiness
    to serve, or invite a lady and promise secrecy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Song of the Harper is said to survive in two papyrus copies, with extracts
    on the tomb walls of Nefer-hetep at Thebes; the papyrus copy locates the poem
    in the hall of Antuf's tomb in front of the harper.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Song of the Harper says human bodies pass away while others remain, and
    it describes old gods, Masters, and Shining Ones as lying in sepulchres and tombs
    whose place is no more.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The poem says the words of Imhetep and Herutataf are treasured, but asks what
    became of their tombs and states that their walls have been thrown down and their
    places are no more.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The poem says none of the departed comes back, and no one can describe their
    condition, surroundings, or guide the living to the place where they have departed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The poem instructs the addressee to comfort the heart, follow the heart's
    desire while alive, anoint the head, wear perfumed byssus, enjoy life, pursue
    happiness, and order earthly surroundings for the heart's desire.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The poem says the dead cannot hear lamentation, daily pleasure should not
