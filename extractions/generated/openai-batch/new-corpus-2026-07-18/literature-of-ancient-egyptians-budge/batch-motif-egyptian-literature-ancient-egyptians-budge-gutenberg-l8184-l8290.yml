canonical_text:
  quote: ''
  summary: The passage introduces Egyptian poetic compositions, summarizes love songs
    and three personified tree songs, then presents the Song of the Harper from papyrus
    and tomb witnesses. The Song of the Harper reflects on the disappearance of earlier
    dead, ruined tombs, the inability of the departed to return, and advises the living
    to pursue present enjoyment because possessions and persons do not come back from
    death.
  language: English
  quote_policy: summarized
