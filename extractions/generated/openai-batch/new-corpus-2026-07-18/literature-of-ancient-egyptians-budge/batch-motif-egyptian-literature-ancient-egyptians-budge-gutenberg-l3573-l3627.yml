  summary: The passage presents an edict dated to the eighth year of Usertsen III
    restricting southern peoples from crossing a southern frontier marker except for
    trade or embassy, followed by a Semnah boundary inscription in which the king
    proclaims the extension and defense of Egypt’s southern border, compares his attack
    to a crocodile, describes punitive actions, and declares that future sons prove
    their sonship by preserving the boundary.
