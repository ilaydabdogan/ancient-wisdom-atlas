canonical_text:
  quote: ''
  summary: While Bata is hunting, the young woman goes near the Acacia tree. The River
    desires her, pursues her, and receives a lock of her hair from the Acacia; the
    hair is carried to Pharaoh's washermen and leads Pharaoh to seek her. Pharaoh's
    agents bring her to Egypt, where she is made Chief Wife. At her request the Acacia
    is cut down, including the flower that holds Bata's heart, and Bata dies. Anpu,
    Bata's elder brother, travels to the Valley of the Acacia, finds Bata dead, searches
    for his heart for years, finds it as a seed, places it in cold water, and restores
    Bata to life.
  language: English
  quote_policy: summarized
