    to the Valley of the Acacia.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Anpu finds Bata lying dead on his bed, weeps, and searches under the Acacia
    for Bata's heart for three years.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the fourth year of searching, Anpu finds a seed, and the passage identifies
