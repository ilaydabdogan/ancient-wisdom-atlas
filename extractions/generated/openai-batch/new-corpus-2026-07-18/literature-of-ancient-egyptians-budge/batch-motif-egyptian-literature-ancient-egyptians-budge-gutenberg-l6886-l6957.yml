  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When Pharaoh asks about her husband, the young woman asks him to cut down
    and destroy the Acacia; royal agents cut the flower that holds Bata's heart, and
    Bata dies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the Acacia is cut down, Anpu receives beer that froths over and wine
