canonical_text:
  quote: ''
  summary: The first-person narrator prepares for combat, defeats an armed adversary
    before assembled tribes, receives approval and spoils, reflects that God has prospered
    him after exile, prays to return to Egypt before old age and death, and reports
    that King Kheperkara sends gifts and a document instructing him to return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator spends the night preparing his bow, arrows, dagger, and other
    weapons for combat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At daybreak, tribes of Thennu and people living on both sides of the land
    gather around the narrator because of concern about the combat.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men and women cry out, and the crowd questions whether any man could be a
    mightier fighter than the narrator.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The adversary grasps a shield, battle-axe, and spears, hurls weapons at the
    narrator, and the narrator avoids the short spears.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator hurls a javelin that remains fast in the adversary's neck; the
    adversary cries out, falls on his face, and is slain with his own weapons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The narrator stands on the adversary's back, shouts a cry of victory, receives
    applause from Aamu men, gives thanks to Menthu, and the adversary's slaves mourn
    their lord.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Shekh Ammuiansha takes the narrator in his arms and embraces him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The narrator carries off the opponent's property, seizes cattle as spoil,
    takes the contents of his tent, strips his compound, and increases his wealth
    and cattle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The narrator states that God prospered the man who made Him his support and
    that the fugitive's integrity was proven before the Court.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The narrator contrasts former hunger, naked flight, and self-service with
    present ability to give bread, possess fine raiment, command servants, and own
    a beautiful house and spacious estate.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The narrator addresses the Lord of the gods, promises propitiatory offerings,
    and asks to be restored to Egypt and to cleanse his body in the land of his birth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The narrator asks for peace from God, peace with the King of Egypt, life upon
    the king's offerings, and contact with the Queen and her children.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The narrator describes old age and bodily infirmity, and says funerary mourners
    approach to bear him to the City of Eternity, where he will become a follower
    of Nebertcher.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: King Kheperkara sends a messenger with royal gifts, the palace princes send
    salutations, and a document instructs the narrator to return to Egypt.
  category: sequence
  evidence_refs:
  - ev:7
