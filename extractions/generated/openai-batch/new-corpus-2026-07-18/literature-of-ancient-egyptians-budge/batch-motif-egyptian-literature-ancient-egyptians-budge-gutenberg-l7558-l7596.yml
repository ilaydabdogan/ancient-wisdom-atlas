canonical_text:
  quote: '"Thou dost stretch out the heavens on high, and dost establish them with
    thine own hands."'
  summary: The passage introduces and gives a hymn to Shu. Shu is praised as son and
    heir of Ra, linked also with Temu, self-created and motherless, a powerful divine
    form who defeats fiends, protects the divine boat, works with Tefnut’s fire against
    enemies, conducts the Eye of Ra, calms the Great Goddess during storms, stretches
    and establishes the heavens, and receives homage from gods and mariners. Thoth
    is said to have written a permanent will in the temple context of Heliopolis.
  language: English
  quote_policy: quoted
