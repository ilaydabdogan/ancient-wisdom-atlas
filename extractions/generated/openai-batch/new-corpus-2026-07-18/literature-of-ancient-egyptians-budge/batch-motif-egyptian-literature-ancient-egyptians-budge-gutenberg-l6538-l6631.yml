canonical_text:
  quote: ''
  summary: A first-person Egyptian envoy in Syria recounts the shipment and cutting
    of cedar for the Boat of Amen, diplomatic gifts, a confrontation with the Governor,
    a warning involving former detained envoys and their tombs, the envoy's persuasive
    proposal for a commemorative stele promising afterlife benefits to the Governor,
    and a later obstruction of the envoy's departure by sea, followed by his lament
    comparing his situation to birds returning to Egypt and cool water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A letter is given to an ambassador, and cedar wood, including seven trunks,
    is loaded onto a ship and dispatched to Egypt for the Boat of Amen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nessubanebtet and Thent-Amen send vessels of gold and silver, byssus, papyrus,
    hides, ropes, lentils, and dried fish, including items for the narrator's personal
    use.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Governor rejoices and sends three hundred men and three hundred oxen to
    Lebanon to cut cedar trees; the trunks remain through winter and are dragged to
    the seashore in summer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the narrator approaches the Governor, the shadow of the Governor's umbrella
    falls on him; Pen-Amen steps between them and speaks of the shadow of Pharaoh
    falling on the narrator.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Governor says he has carried out old orders of Pharaoh, gives the cedar
    trunks as a gift, and warns the narrator to fear the Governor if he delays more
    than the sea voyage.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Governor says earlier envoys of Kha-em-Uast were kept in the country for
    many years and died there, then orders that the narrator be taken to see their
    tombs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator refuses to look at the tombs and argues that the earlier ambassadors
    differed from him because no god was with them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator proposes that the Governor should make a stele saying Amen-Ra
    sent a divine ambassador and Unu-Amen, a human ambassador, to obtain cedar for
    the Great and Holy Boat of Amen-Ra.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The proposed stele would record that the Governor cut cedar, loaded and crewed
    ships, brought the wood to Egypt, and obtained a petition for ten thousand years
    of life.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator says a later Egyptian ambassador could read the Governor's name
    on the stele and pray that he receive water in Amentet like the gods who subsist.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the beach the narrator sees eleven ships ready for sea, but an order is
    issued to stop him and prevent any ship carrying him to Egypt.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The narrator sits down and weeps, then speaks to the Governor's scribe about
    kashu birds flying repeatedly to Egypt and flocking to cool water brooks while
    he remains cast aside.
  category: speech
  evidence_refs:
  - ev:10
