  quote: ''
  summary: 'The passage first concludes an official''s autobiographical account: he
    reports registering royal and foreign products offered to Amen, holding treasury
    authority, and seeking afterlife access, offerings, water, memory, and good repute.
    It then introduces Thaiemhetep''s funerary stele and gives the opening offering
    formula invoking Memphite gods to provide offerings for her KA, followed by her
    titles, parentage, address to tomb entrants, and birth date under King Ptolemy.'
