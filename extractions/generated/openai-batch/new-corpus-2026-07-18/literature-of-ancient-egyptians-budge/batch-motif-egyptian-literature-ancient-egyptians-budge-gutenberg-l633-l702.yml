canonical_text:
  quote: ''
  summary: 'The passage describes the Egyptian Opening of the Mouth rite for a dead
    king, first performed on his statue with water, incense, anointing, eye paint,
    washing, dressing, and offerings. A Pesh Kef instrument is applied to the statue’s
    lips to free the mouth. Priests recite purification formulae invoking Horus, Set,
    Thoth, Sep, and Keb, and present or invoke the Eye of Horus. A later ceremony
    represents the king’s rebirth: a priest personifying the king feigns death in
    a bull’s skin, emerges, and is declared alive and similar to Horus. The ritual
    speech identifies the officiant as the son and as Horus, and the final explanation
    says the king is delivered from the jaws of death while Set is wounded.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Opening of the Mouth ceremony for the dead king is described as having
    been performed on a statue under the earliest dynasties, with water, incense,
    seven unguents, eye paint, washing, dressing, and sepulchral offerings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The essential ceremony applies the Pesh Kef instrument to the lips of the
    statue; the instrument is said to cut the bandages over the mouth of the dead
    king and set the mouth free to open.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In later times the liturgy is described as enlarged and called the Book of
    Opening the Mouth, performed by the Kher-heb priest, the son of the deceased,
    named priests or ministrants, and assistants called Mesentiu.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The priest burns incense, says a purity formula four times, sprinkles water
    over the statue, and repeats a purification formula with the names of Horus, Set,
    Thoth, and Sep.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The priest says that the deceased has received his head and that his bones
    have been brought to him before Keb.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: During five incense ceremonies, the text mentions the two eyes of Horus, the
    two vases of Thoth, seman incense that opens the mouth, censing with natron, establishment
    among divine brethren, and a mouth compared to that of a newborn sucking calf.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Eye of Horus is said to be given to the deceased, and a footnote states
    that Horus gave his eye to Osiris and thereby restored life to him.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The ninth ceremony is described as representing the rebirth of the king, who
    is personified by a priest wrapped in a bull’s skin lying on a small bed and feigning
    death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the chief priest says 'O my father' four times, the priest representing
    the king comes forth from the bull’s skin and sits up; the passage says this act
    symbolized the resurrection of the king as a spirit-body.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chief priest asserts that the king is alive, will never be removed, and
    is similar in every way to Horus.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The priest personifying the king puts on a special garment, takes a staff
    or sceptre, speaks of loving his father and his transformation, says he has made
    a statue of him, presses the lips of the statue, and identifies himself as the
    son and as Horus.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The final ritual words are explained as meaning that the king has been delivered
    from the jaws of death and that a grievous wound has been inflicted on Set, called
    the god of death in this context.
  category: relationship
  evidence_refs:
  - ev:8
