canonical_text:
  quote: ''
  summary: 'The peasant makes a ninth complaint before Rensi, using images of balances,
    truth, falsehood, boats, and divine appeal. Rensi recalls him, reassures him,
    records the complaints on papyrus, and sends them to King Nebkaura, after which
    the thief is said in a mutilated ending to be punished and made to restore the
    stolen goods. The passage then begins the Journey of Unu-Amen: the priest sets
    out to obtain cedar wood for Amen-Ra’s holy boat, receives support at Zoan, sails
    toward Syria, is provisioned at Dhir, and suffers theft by a crewman.'
  language: English
  quote_policy: summarized
