  text: The humans flee to the mountains, and the Eye of Ra, Hathor, pursues them
    there and slays them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hathor says the work of vanquishing humans is dear to her heart, Ra says he
    will be master of humans and destroy them, and Hathor-Sekhmet wades in human blood
    for three nights beginning at Hensu.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ra orders messengers to Abu to fetch mandrakes; Sekti crushes them; the crushed
