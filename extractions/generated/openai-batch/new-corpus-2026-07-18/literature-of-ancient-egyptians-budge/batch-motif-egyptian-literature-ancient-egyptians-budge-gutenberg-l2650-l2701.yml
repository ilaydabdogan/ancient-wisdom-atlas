canonical_text:
  quote: ''
  summary: Ra hears humans complain against him, secretly summons a divine council,
    and accepts advice to send his Eye, identified with Hathor, against the blasphemers.
    Hathor-Sekhmet slaughters humans until Ra has beer mixed with blood and mandrakes
    poured out; she drinks it, becomes merry and sleepy, forgets humans, and stops
    killing. The passage concludes with an etiology for sleepy beer at Hathor’s festivals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the legend is cut in hieroglyphs in a small chamber of the
    tomb of Seti I, dated about 1350 B.C.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ra is described as self-begotten and self-formed, ruling gods and humans;
    humans complain that he has become old and describe his bones as silver, flesh
    as gold, and hair as lapis-lazuli.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ra commands that his Eye, identified parenthetically as Hathor, along with
    named gods and elder gods connected with the watery abyss of Nu, be summoned secretly
    to the Great House in Heliopolis.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The assembled gods range themselves along the sides of the Great House, bow
    to Ra, and invite him to speak.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ra tells Nu that the humans he created are murmuring against him and asks
