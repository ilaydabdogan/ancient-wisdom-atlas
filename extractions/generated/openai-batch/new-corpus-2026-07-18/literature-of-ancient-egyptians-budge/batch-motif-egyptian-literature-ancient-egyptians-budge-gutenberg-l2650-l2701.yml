  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Ra orders the beer taken to the scene of slaughter and poured out on the meadows
    of the four quarters of heaven.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Hathor drinks the beer mixed with blood and mandrakes, becomes merry and sleepy,
