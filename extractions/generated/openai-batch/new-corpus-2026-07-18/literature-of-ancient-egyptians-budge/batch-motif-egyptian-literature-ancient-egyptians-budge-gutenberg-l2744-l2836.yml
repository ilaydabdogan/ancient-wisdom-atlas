canonical_text:
  quote: ''
  summary: The passage summarizes the Egyptian legend in which Isis, seeking Ra's
    hidden name and greater divine power, fashions a serpent from Ra's spittle and
    dust. The serpent bites Ra, causing severe poisoning. Isis offers to cure him
    if he reveals his name. After Ra's descriptions of his creative powers fail to
    relieve him, his secret name passes from his body into Isis, who then pronounces
    a spell that expels the poison. The passage ends by noting later magical use of
    the legend as a charm against snake bites.
  language: English
  quote_policy: summarized
