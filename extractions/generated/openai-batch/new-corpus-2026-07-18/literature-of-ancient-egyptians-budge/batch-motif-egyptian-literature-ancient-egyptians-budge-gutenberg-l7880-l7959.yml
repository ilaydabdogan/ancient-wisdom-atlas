canonical_text:
  quote: ''
  summary: The passage describes an Egyptian moral-philosophical text in which a man
    weary of life debates suicide with his soul. The soul argues about burial, funerary
    rites, fire, the kingdom of the dead, and the uncertainty of offerings after death,
    then urges the man to pursue happiness and banish care. The man rejects this advice,
    says death is preferable to life, compares his name to foul smells, and laments
    a society without loyalty, righteousness, contentment, or true friends.
  language: English
  quote_policy: summarized
