canonical_text:
  quote: '"overran it like a water-flood"'
  summary: Nemart, a rebel prince, flees by boat to Un/Hermopolis and is besieged
    by Nubian forces. Piankhi reacts angrily, invokes Ra and Amen, plans to visit
    Thebes for the New Year Festival, and proceeds with campaigns against northern
    towns. At Un he conducts a siege until envoys, Nemart's wife, and her ladies seek
    peace through supplication. Nemart submits, swears fealty, and presents tribute.
    Piankhi offers animals to Thoth and the Eight Gods, inspects the palace and stables,
    rebukes Nemart for starving horses, and reserves part of the goods for Amen's
    temple at Thebes.
  language: English
  quote_policy: quoted
