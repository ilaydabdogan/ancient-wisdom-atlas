canonical_text:
  quote: ''
  summary: The passage contains invocations to a beloved divine king and to Osiris,
    including calls for the deity to come home, references to protection, royal unity,
    the defeat of fiends and Set, Isis’s creation of a child for Osiris, the healing
    and revivification of Osiris, the Nile and vegetation flourishing at his command,
    and Osiris’s association with truth, life, and death. It also notes that such
    texts were sung at an Osiris festival and later abridged for salvation use.
  language: English
  quote_policy: summarized
