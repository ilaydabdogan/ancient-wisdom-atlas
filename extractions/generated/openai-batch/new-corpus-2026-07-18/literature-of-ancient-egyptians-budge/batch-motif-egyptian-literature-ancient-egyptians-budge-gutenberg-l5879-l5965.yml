canonical_text:
  quote: ''
  summary: After Tehutinekht ignores ten days of entreaties, the peasant travels south
    to Hensu to complain before Rensi, son of Meru. Rensi investigates but remains
    silent. The peasant delivers an eloquent plea for justice using imagery of safe
    navigation on the Sea of Truth. Rensi reports the case and the peasant's eloquence
    to King Nebkaura, who orders Rensi not to answer the peasant, to have the speeches
    written down, and to provide food secretly for the peasant and his household.
  language: English
  quote_policy: summarized
