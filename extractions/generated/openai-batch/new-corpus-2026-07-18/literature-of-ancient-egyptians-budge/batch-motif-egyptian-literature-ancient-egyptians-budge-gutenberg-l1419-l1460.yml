canonical_text:
  quote: ''
  summary: Rut-tetet quarrels with and slaps her handmaiden. The handmaiden threatens
    to tell King Khufu that Rut-tetet has given birth to three kings, expecting that
    Khufu may kill the children and perhaps their parents. The handmaiden's maternal
    uncle refuses to support her, beats her with a rope of flax, and later she is
    carried away by a crocodile while fetching water. The uncle reports this to the
    grieving Rut-tetet. The passage then adds an editorial explanation linking the
    three sons to later kings and to Egyptian solar kingship, and comments that the
    named magicians were probably remembered historical persons.
  language: English
  quote_policy: summarized
