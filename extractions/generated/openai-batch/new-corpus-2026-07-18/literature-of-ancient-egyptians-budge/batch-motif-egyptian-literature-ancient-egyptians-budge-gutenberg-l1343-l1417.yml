- id: obs:6
  text: The goddesses send rain and storm through the heavens, return to Rauser's
    house with the barley, and have it placed in a sealed room.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After fourteen days of seclusion, Rut-tetet sends a handmaiden to get barley;
    the handmaiden opens the sealed chamber and hears cries, music, singing, dancing,
    and noises made for the birth of a king.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Rut-tetet locates the sounds inside a box, places that box inside other boxes,
    seals the containers, wraps them in leather, and places them in a sealed chamber
    with barley drink.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: When Rauser returns from the fields, Rut-tetet tells him what happened; Rauser
