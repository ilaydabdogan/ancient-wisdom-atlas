canonical_text:
  quote: ''
  summary: Ra commands Isis, Nephthys, Meskhenet, Heqet, and Khnemu to oversee the
    birth of Rut-tetet's three sons of Ra. The goddesses arrive disguised as dancing
    women, assist the birth, proclaim or confer royal destiny and health, receive
    barley from Rauser, hide royal crowns in the barley, and cause the barley to be
    sealed in a room. Later a handmaiden and Rut-tetet hear sounds of royal celebration
    coming from a box, which Rut-tetet seals inside further containers.
  language: English
  quote_policy: summarized
