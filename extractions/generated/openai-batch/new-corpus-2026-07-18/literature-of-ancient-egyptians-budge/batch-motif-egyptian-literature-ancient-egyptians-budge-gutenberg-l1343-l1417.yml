- id: obs:3
  text: Isis, Nephthys, and Heqet assist in bringing the three boys into the world;
    Meskhenet prophesies sovereignty for each; Khnemu gives health to their bodies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Rauser offers barley from his granary as recompense to the divine visitors,
    and Khnemu brings the barley.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The goddesses make divine crowns belonging to kingship and hide them in the
    barley.
  category: object
