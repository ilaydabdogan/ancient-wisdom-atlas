canonical_text:
  quote: ''
  summary: The passage introduces Egyptian moral and philosophical literature, comparing
    it to biblical wisdom books, and contrasts it with funerary guide literature for
    the dead. It then presents Ptah-hetep as an old sage authorized by the king to
    instruct the king’s son in ancient wisdom. The quoted precepts advise humility,
    humane conduct, respect for social hierarchy, careful speech at meals, and faithful
    transmission of messages, with divine punishment invoked against oppression.
  language: English
  quote_policy: summarized
