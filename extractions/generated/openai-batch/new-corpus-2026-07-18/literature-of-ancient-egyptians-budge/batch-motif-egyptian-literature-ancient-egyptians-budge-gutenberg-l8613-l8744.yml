canonical_text:
  quote: ''
  summary: The passage gives calendrical unlucky-day prohibitions, then surveys Egyptian
    legal documents, historical romances, mathematics, and a bibliography of editions
    and translations. Notable items include prohibitions involving fire, bathing,
    and work; the will of Ra giving inheritance and the Egyptian throne to Horus;
    prosecutions for royal tomb and treasury robbery; a conspiracy against Rameses
    III; examples of historical romances; and the practical character of Egyptian
    mathematics as represented by the Rhind Papyrus.
  language: English
