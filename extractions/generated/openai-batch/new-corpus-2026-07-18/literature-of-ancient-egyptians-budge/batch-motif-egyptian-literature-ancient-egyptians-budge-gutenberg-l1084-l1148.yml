canonical_text:
  quote: ''
  summary: 'In a framed tale, Prince Khafra tells King Khufu about an event in the
    reign of King Nebka. The magician Ubaaner learns from his steward that his wife
    has been meeting a young field worker in a garden lodge. Ubaaner makes a wax crocodile,
    empowers it with magical words, and has the steward throw it into the lake when
    the young man bathes. The wax crocodile becomes a large living crocodile and swallows
    the young man. After seven days, Ubaaner shows the marvel to King Nebka: the crocodile
    brings up the young man, becomes wax in Ubaaner''s hand, then at the king''s command
    becomes living again and carries the young man away. Nebka orders Ubaaner''s wife
    burned and her ashes scattered in the river; Khufu later orders offerings for
    Nebka and gifts for Ubaaner.'
  language: English
  quote_policy: summarized
