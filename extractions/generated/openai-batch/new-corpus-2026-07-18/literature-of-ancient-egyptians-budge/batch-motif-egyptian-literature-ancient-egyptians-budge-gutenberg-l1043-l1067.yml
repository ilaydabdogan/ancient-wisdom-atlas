canonical_text:
  quote: Pepi appeareth in heaven among the imperishable stars.
  summary: The passage describes Pepi as brought forth by Nu before heaven and earth
    were established, identifies him with unconquered Great Offspring of Anu, states
    that gods will lift and support him if he falls into water or onto earth, places
    him among imperishable stars, has Sothis and the Morning Star lead him to the
    Field of Offerings, and depicts him enthroned with regalia as judge among the
    gods.
  language: English
  quote_policy: quoted
