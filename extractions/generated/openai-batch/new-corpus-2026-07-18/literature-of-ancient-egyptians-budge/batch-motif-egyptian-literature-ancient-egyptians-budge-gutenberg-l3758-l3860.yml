canonical_text:
  quote: ''
  summary: A divine speaker addresses Menkheperra/Thothmes as beloved son, grants
    him life, strength, conquests, fear among foreign lands, and rule over enemies.
    The passage repeatedly describes conquered regions seeing the king in solar, stellar,
    animal, serpent, and divine-pair imagery. It ends with protective goddesses placed
    near the king, praise of his sanctuary works for Amen-Ra, and establishment on
    the throne of Horus.
  language: English
  quote_policy: summarized
