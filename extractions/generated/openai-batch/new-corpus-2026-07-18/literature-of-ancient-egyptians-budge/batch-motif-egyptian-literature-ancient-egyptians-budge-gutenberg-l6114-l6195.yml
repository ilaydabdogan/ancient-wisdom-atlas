canonical_text:
  quote: ''
  summary: The peasant comes repeatedly before Rensi to complain. In his fourth, fifth,
    and sixth complaints he praises and rebukes the steward through analogies involving
    a temple, ferrying across a stream, hunting, fishing, judging, boats, nourishment,
    shade, refuge, goods of the poor, a dam, a lake, satiety, clothing, calm heavens,
    fire, water, offerings, unloading a boat, and a wicked gardener. He urges Rensi
    to hear the plaintiff, judge rightly, suppress robbers, avoid harming the poor,
    and declare decisions without delay.
  language: English
  quote_policy: summarized
