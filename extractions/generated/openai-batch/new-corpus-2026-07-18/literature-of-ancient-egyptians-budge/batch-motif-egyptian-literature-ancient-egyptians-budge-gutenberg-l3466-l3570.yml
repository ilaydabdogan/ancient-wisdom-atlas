  quote: ''
  summary: The passage introduces Egyptian historical literature, explaining the scarcity
    of native historical writing in the modern sense, the role of royal and scribal
    records, the ideological tendency to glorify individual kings, and the preservation
    or destruction of records. It then gives sample annalistic entries from the Palermo
    Stone for the reign of Seneferu, listing shipbuilding, a raid, captives and livestock,
    construction, imported cedar ships, and Nile-height measurements.
  language: English
  quote_policy: summarized
