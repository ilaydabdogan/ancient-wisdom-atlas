  text: The chapter frames the Egyptian historical period as the period ruled by kings,
    each called NESU-BATI, translated as “King of the South, King of the North.”
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that no native Egyptian work is known that can be regarded
    as a history of Egypt in the modern sense, and that Manetho’s history survives
    only through a king list transmitted in later authors.
  category: action
  evidence_refs:
  - ev:1
