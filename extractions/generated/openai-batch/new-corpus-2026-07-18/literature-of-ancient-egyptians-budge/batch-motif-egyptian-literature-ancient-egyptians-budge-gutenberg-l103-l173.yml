canonical_text:
  quote: ''
  summary: The preface presents the book as an elementary public introduction to Egyptian
    literature, with translated specimens from tombs, papyri, stelae, and monuments.
    It explains the translator's methods and uncertainties, then characterizes Egyptian
    literature as heavily religious, mythological, and moral. The passage summarizes
    ancient Egyptian concern with the Other World, salvation of the soul, preservation
    of the body, funerary books, moral conduct, divine judgment, the Day of Judgment,
    and a royal instruction to Merikara warning that Osirian judges consider a person's
    works after death.
  language: English
  quote_policy: summarized
