canonical_text:
  quote: ''
  summary: A traveller humbly addresses a serpent, promising to tell the king of its
    power and to bring cultic offerings. The serpent, identifying itself as the Prince
    of Punt, says the proposed gifts are already its own products and predicts that
    the island will vanish after the traveller departs. A ship arrives as predicted;
    the serpent sends the traveller home with costly goods, asks that its name be
    honored, and foretells his return to his children. The traveller returns to the
    king, presents the island goods, and receives royal praise and appointment. A
    frame exchange with a prince and a scribal colophon conclude the passage.
  language: English
  quote_policy: summarized
