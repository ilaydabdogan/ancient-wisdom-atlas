canonical_text:
  quote: ''
  summary: After the punishment of blasphemers, Ra remains dissatisfied with mankind
    and decides to withdraw from earth. Nut takes the form of a cow and carries him
    upward; repentant humans are forgiven, but Ra ascends to heaven. He creates blessed
    heavenly regions, stars, and beings to praise him. Nut is stabilized by Shu and
    other gods. Ra then orders Thoth to compose protective spells against serpents
    and reptiles, gives Keb authority over beings on and in the earth, and appoints
    Thoth as his representative and administrator in the Other World.
  language: English
  quote_policy: summarized
