canonical_text:
  quote: ''
  summary: 'The passage summarizes the textual history and physical forms of the Egyptian
    Book of the Dead, describes how copies were placed with the deceased, and explains
    its religious purpose: to equip the dead with spells, prayers, charms, words of
    power, and amulets needed to traverse the dangerous Tuat, reach the Elysian Fields,
    and join the subjects of Osiris.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chapters of the Book of the Dead are said to have been written in several
    Egyptian towns, including Khemenu, Anu or Heliopolis, Busiris, and other Delta
    towns.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many chapters of an eleventh- and twelfth-dynasty recension are described
    as written in cursive hieroglyphs on wooden sarcophagi.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: From the beginning of the eighteenth dynasty, the Book of the Dead was commonly
    written on papyrus rolls laid with the dead in coffins rather than written on
    coffins themselves.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Theban Recension is described as written in black ink in vertical hieroglyphic
    columns, with chapter titles, opening words, and rubrics in red ink.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Brightly painted vignettes were added to chapters around the middle of the
    eighteenth dynasty and are said to sometimes explain obscure parts of the text.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Later copies included hieratic manuscripts, the Saite Recension, condensed
    priestly works, and eventually very abbreviated texts on small scraps of papyrus.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Papyrus rolls containing the Book of the Dead were placed in niches in mummy
    chambers, in coffins near the deceased body, or inside hollow wooden divine figures
    or their pedestals.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Egyptians believed that souls leaving this world had to traverse the Tuat
    before reaching the Elysian Fields and appearing before Osiris.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Tuat is described as a vast, difficult, roadless region inhabited by gods,
    devils, fiends, demons, spirits, wicked souls, snakes, serpents, savage animals,
    and monsters.
  category: setting
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Souls were believed to need spells, incantations, prayers, charms, words of
    power, and amulets in order to reach the Kingdom of Osiris.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Spells and incantations are said to be used against hostile beings; prayers,
    charms, and words of power to gain help from powerful beings; and amulets to give
    the soul strength, power, will, and knowledge.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The stated object of the Book of the Dead is to provide the dead with ritual
