canonical_text:
  quote: ''
  summary: Sanehat addresses the Egyptian king, praises him in divine and solar terms,
    explains his flight as ignorant and divinely ordained rather than disloyal, asks
    to return to Egypt, transfers his foreign possessions to his children, journeys
    south with official escort and royal gifts, is brought before the enthroned king,
    reacts with fear to the king's harsh speech, and is recognized despite his Asiatic
    or nomad appearance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he was afraid to declare the matter and praises the king
    as a great god, counterpart of Ra, like Horus, and victorious over the whole world.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker asks the king to summon Maka, Khentiaaush, and Menus as governors
    who can testify about the events and about Thenu's obedience.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:3
  text: The speaker says his flight was caused by ignorance, was not deliberate, seemed
    like a dream of geographical displacement, and was ordained and guided by God.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker denies disloyalty and rebellion, asks to enter his native land
    and return to Egypt, and says the Sun Disk, Nile water, and air of heaven are
    available at the king's will or command.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The speaker says he will transfer his possessions in the foreign land to his
    kinsfolk and obey the king's embassy.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the country of Aa, the speaker transfers possessions to his children; his
    eldest son manages the settlement, people, cattle, fruit trees, palm plantations,
    and groves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker journeys south to Heruuatu; a frontier captain informs the Court;
    the king sends an overseer and boats carrying gifts for the desert soldiers who
    escorted and guided the speaker.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Five officials bring the speaker to the Great House, where he bows until his
    forehead touches the ground; princes, princesses, and officials receive him and
    conduct him toward the king's privy chamber.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The king is seated on the Great Throne in a silver-gold chamber; he speaks
    harshly, orders the speaker raised, and asks why he will not speak and declare
    his name.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The speaker becomes terrified and disoriented before the king, with quaking
    limbs and uncertainty whether he is dead or alive.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The speaker answers that the matter was done by God's hand and by bodily terror,
    and says that he is in the king's presence.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The king tells the queen that Sanehat has come in the guise of an Asiatic
    and has become a nomad warrior of the desert; the queen laughs, the royal children
    doubt that he is Sanehat, and the king affirms that it is he.
  category: speech
  evidence_refs:
  - ev:7
