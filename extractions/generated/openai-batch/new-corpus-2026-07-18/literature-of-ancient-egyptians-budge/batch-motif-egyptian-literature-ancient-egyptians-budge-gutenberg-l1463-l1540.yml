canonical_text:
  quote: '"Book of the Dead" ... "deal almost entirely with the dead, and ... were
    written entirely for the dead."'
  summary: The passage explains the Book of the Dead as a collection of religious
    chapters written, carved, or painted on tomb, coffin, sarcophagus, and papyrus
    media for the benefit of the dead. It attributes the chapters to Thoth, describes
    their antiquity and royal use, connects them with funerary rites, resurrection,
    immortality, offerings, reward and punishment after death, and compares Osirian
    beliefs with Heliopolitan solar doctrine associated with Ra.
  language: English
  quote_policy: quoted
