canonical_text:
  quote: ''
  summary: 'The passage introduces Egyptian autobiographical literature, especially
    inscriptions by military and administrative officials, as valuable historical
    sources often found on tomb walls. It then gives Ptah-shepses as an example: he
    was born under Menkaura, educated with royal children, married to Shepseskaf''s
    daughter Maatkha, honored under later kings, and his autobiography helps arrange
    a sequence of reigns.'
  language: English
  quote_policy: summarized
