  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Teta greets Herutataf, says Khufu will reward and promote him, and blesses
    his Ka and soul in relation to enemies and the Other World.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: Teta asks for a boat for his children and books; Herutataf provides two boats
    with crews, and Teta travels in the prince's boat to Khufu's palace.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When Khufu asks whether Teta can rejoin a severed head to its body, Khufu
    proposes using a condemned prisoner, but Teta asks that no man be brought and
    that another living creature be used.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A goose is decapitated; its body is laid on the west side of the hall and
