canonical_text:
  quote: ''
  summary: Prince Herutataf tells King Khufu about the living sage Teta, an aged peasant
    reputed to know how to reunite severed heads to bodies, control a lion, and know
    the number of the Apet chambers of Thoth. Herutataf travels to Teta, invites him
    to court, and escorts him with his children and books. Before Khufu, Teta refuses
    to demonstrate on a condemned prisoner and instead restores decapitated animals
    by spells; he also makes a lion follow him with its rope trailing.
  language: English
  quote_policy: summarized
