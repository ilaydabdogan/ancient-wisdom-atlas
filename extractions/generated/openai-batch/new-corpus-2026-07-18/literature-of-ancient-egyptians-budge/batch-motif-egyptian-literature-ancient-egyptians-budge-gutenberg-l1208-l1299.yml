  text: Herutataf presents Teta to Khufu as a living sage, in contrast to earlier
    reports about dead magicians.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Teta is described as a peasant living in Tet-Seneferu, one hundred and ten
    years old, with unusually large daily food and drink consumption.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Herutataf says Teta knows how to reunite a cut-off head to its body, make
    a lion follow while its rope drags on the ground, and know the numbers of the
    Apet chambers of Thoth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Khufu has been seeking the number of the Apet chambers of Thoth because he
    wants to make something like it for his horizon.
  category: action
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:5
  text: Khufu sends Herutataf to bring Teta, and Herutataf travels first by boat and
    then overland in an ebony sedan chair with decorated bearing poles.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Herutataf finds Teta lying on a bed, attended by servants who fan him, hold
