canonical_text:
  quote: ''
  summary: A discussion of a man tired of life presents death as a deliverer through
    a sequence of favorable similes and states that beyond death is a place called
    “there,” ruled by Ra, where wrong is punished and suffering is rewarded. The passage
    then introduces Khakhepersenb, also called Ankhu, a priest of Heliopolis, who
    laments social corruption, the displacement of justice by injustice, widespread
    grief, unrest, and the abandonment of truthful speech.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man tired of life concludes that, because society is unlikely to improve,
    death is the only remaining deliverer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man addresses his soul and repeatedly says that death stands before him
    “this day,” comparing death to recovery from sickness, fresh air, myrrh, a sailboat
    in a breeze, lotus flowers, rain-filled water, return home, a brightened sky after
    storm, and release after imprisonment.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the man looked beyond death to a happier state of
    existence in which wrong would be righted and earthly suffering rewarded.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The just place beyond death is described as ruled by Ra and is called “there”
    rather than “heaven.”
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The one who is “there” is said to be like a loving god, to punish wickedness,
    to stand in the Boat of the Sun, to give the best offerings to temples, and to
    become a man of understanding who prays to Ra.
  category: attribute
  evidence_refs:
  - ev:4
