canonical_text:
  quote: ''
  summary: A shipwrecked royal-mission traveller is cast by a sea wave onto an abundant
    island, makes a fire offering, and encounters a huge gold-covered speaking serpent.
    The serpent questions and threatens him, then carries him unharmed, hears his
    shipwreck account, reassures him, foretells rescue and return home, and recounts
    how its own kin were burned when a star fell with fire.
  language: English
  quote_policy: summarized
