  quote: '"Righteousness (or truth) is the breath of the nostrils."'
  summary: A peasant comes a third time to complain before Rensi, the steward, using
    praise, rebuke, divine comparisons, and images of water, scales, steering, predation,
    and failed governance to demand justice against a robber. Rensi has him seized
    and beaten by two men with leather whips, after which the peasant accuses Rensi
    of blindness, deafness, forgetfulness, and corruption.
  language: English
  quote_policy: quoted
