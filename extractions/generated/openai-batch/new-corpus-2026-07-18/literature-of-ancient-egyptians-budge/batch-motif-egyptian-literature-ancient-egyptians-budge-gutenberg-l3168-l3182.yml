canonical_text:
  quote: ''
  summary: After leaving the god's chamber, the king issues a decree endowing Khnemu's
    temple with lands and gifts, imposing dues and tithes on farmers, fishermen, hunters,
    goods, and artisans, with exemptions for temple image-makers. He orders the decree
    to be copied onto a sanctuary stele bearing figures of Khnemu and companion gods,
    and prescribes punishment for anyone who spits on it.
