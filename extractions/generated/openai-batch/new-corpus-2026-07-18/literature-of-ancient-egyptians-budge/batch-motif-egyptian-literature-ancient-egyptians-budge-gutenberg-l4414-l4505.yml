- id: obs:1
  text: The text is introduced as a hieroglyphic inscription cut on a limestone slab
    from Una's tomb at Abydos, now in Cairo.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Una identifies himself with multiple titles, including Duke, Governor of the
    South, judge belonging to Nekhen, prince of Nekheb, and vassal of Osiris Khenti
    Amenti.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Una says he was a child under King Teta and later held offices under King
    Pepi, receiving further ranks and judicial responsibilities from the king.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Una repeatedly states that the king's heart was satisfied with him more than
    with other officials, nobles, or servants.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
- id: obs:5
  text: Una asked the king for a white stone sarcophagus from Raau, and the king sent
    royal agents, workmen, a barge, and a royal boat to bring the sarcophagus and
    related funerary items.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Una says that such a royal provision had not previously been done for any
    servant.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: During a secret inquiry in the royal household concerning Chief Wife Amtes,
    Una was made to hear the case with exceptional privacy and wrote it down despite
    his comparatively lower rank.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king gathered a large army from many southern, northern, and foreign or
    border regions to suppress a revolt of the Aamu dwellers on sand, and sent Una
    at its head.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Although many high officials commanded companies, Una says he planned tactics
    for them and maintained order so that soldiers did not quarrel or steal food,
    sandals, bread, or goats.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The army is said to have returned in peace after raiding the land, destroying
    fortresses, cutting fig-trees and vines, setting fire to temples of gods, killing
    many soldiers, and taking many living prisoners.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Una says the king sent him five times to lead the army against the dwellers
    on sand, and that he later sailed in large transports toward Thest and attacked
    rebels connected with Shert.
  category: sequence
  evidence_refs:
  - ev:8
