  - ev:2
  confidence: medium
  cautions: The passage does not name the speaker; the motif identification rests
    on the internal sequence of suffering and asserted vindication.
- id: motif:2
  label: Self-kindled light ending in sorrow
  taxonomy_refs: []
  basis: Those who kindle fire and surround themselves with sparks are told to walk
    in that light, but the announced result is lying down in sorrow.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives a compact admonition rather than an extended narrative.
- id: motif:3
