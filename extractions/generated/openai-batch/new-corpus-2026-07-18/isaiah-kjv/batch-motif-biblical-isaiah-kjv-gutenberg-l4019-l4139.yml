canonical_text:
  quote: ''
  summary: The passage moves from an unnamed servant-like speaker enduring humiliation
    while trusting the Lord GOD for vindication, to exhortations addressed to those
    who seek righteousness. It recalls Abraham and Sarah as origins, promises Zion’s
    wasteland will become like Eden, contrasts perishable heavens and earth with enduring
    salvation, invokes the arm of the LORD that defeated Rahab, wounded the dragon,
    and dried the sea for the ransomed, and promises the redeemed will return to Zion
    with joy. It then addresses afflicted Jerusalem as one who has drunk the cup of
    divine fury, announces that the cup will be removed from her, and says it will
    be placed into the hands of her afflicters.
  language: English
  quote_policy: summarized
