canonical_text:
  quote: ''
  summary: The LORD speaks of a servant formed from the womb to restore Jacob and
    Israel, to be a light to the Gentiles, and to be given as a covenant for the people.
    Prisoners and those in darkness are told to go forth; the people are led without
    hunger or thirst by springs of water, and mountains become a way. Zion laments
    being forgotten, but the LORD answers with maternal compassion and says Zion is
    graven on his hands. Zion’s children return, foreign rulers carry them and bow,
    captives are delivered from the mighty, and oppressors are judged. The LORD also
    states that the people’s separation resulted from their own iniquities, asserts
    power to redeem and to dry seas and darken heavens, and describes the obedient
    learned speaker whose ear is opened morning by morning.
  language: English
  quote_policy: summarized
