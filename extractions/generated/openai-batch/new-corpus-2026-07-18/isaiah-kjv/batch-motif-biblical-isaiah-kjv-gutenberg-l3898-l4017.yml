candidate_motifs:
- id: motif:1
  label: Servant as covenant mediator
  taxonomy_refs:
  - covenant
  basis: The passage explicitly says the servant is preserved and given for a covenant
    of the people, in connection with restoring desolate inheritances.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage states the covenant role but does not narrate a covenant ceremony.
- id: motif:2
  label: Return and restoration of dispersed people
  taxonomy_refs:
  - return
  basis: Jacob and Israel are to be restored; prisoners go forth; people come from
    far directions; Zion’s children gather and return; captives are delivered.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage is prophetic speech rather than a completed travel narrative.
- id: motif:3
  label: Divine parental compassion toward a remembered child-city
  taxonomy_refs:
  - divine_parent_child
  basis: The LORD compares his remembrance of Zion to a woman’s compassion for her
    nursing child and speaks of saving Zion’s children.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: medium
  cautions: The maternal language is presented as an analogy; it does not state literal
    divine motherhood.
- id: motif:4
  label: Divine judgment on oppressors
  taxonomy_refs:
  - divine_judgment
  basis: The LORD says he will contend with those who contend with Zion, save her
    children, and make oppressors consume their own flesh and blood.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The judgment imagery is vivid and punitive; the passage does not describe
    a separate trial scene.
- id: motif:5
  label: Divine power over waters and heavens
  taxonomy_refs:
  - divine_judgment
  basis: The LORD asserts power to dry the sea, make rivers a wilderness, kill fish
    through lack of water, and clothe the heavens with blackness and sackcloth.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The action demonstrates divine power and may signal judgment, but the
    immediate passage frames it as proof of ability to redeem and deliver.
- id: motif:6
  label: Learned speech and opened ear
  taxonomy_refs:
  - wisdom
  basis: The Lord GOD gives the speaker the tongue of the learned and awakens his
    ear morning by morning to hear as the learned.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage describes instruction and obedience, not an extended wisdom
    discourse.
comparison_claims:
- id: claim:1
  claim: At the motif-family level, the passage fits a return/restoration pattern
    in which dispersed children, prisoners, and captives are gathered back to a personified
    community.
  claim_level: same_motif
  target: motif_family:return
  evidence_refs:
  - ev:1
  - ev:3
  - ev:6
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage is a prophetic oracle and does not present a full journey
    episode with named travelers.
- id: claim:2
  claim: The servant’s explicit appointment as a covenant for the people supports
    comparison with covenant-mediator patterns.
  claim_level: same_motif
  target: motif_family:covenant
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: No ritual ratification, oath exchange, or covenant document is narrated
    in this passage.
- id: claim:3
  claim: The maternal remembrance image supports a same-function comparison with divine
    parent-child patterns, especially protection and refusal to forget the child-community.
  claim_level: same_function
  target: motif_family:divine_parent_child
  evidence_refs:
  - ev:5
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage uses maternal analogy for the LORD’s memory and compassion;
    it does not explicitly identify Zion as the LORD’s biological child.
- id: claim:4
  claim: The punishment of oppressors and the drying of waters can be cautiously compared
    with divine-judgment patterns in which divine power reverses hostile conditions
    and displays sovereignty.
  claim_level: same_motif
  target: motif_family:divine_judgment
  evidence_refs:
  - ev:8
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The two judgment images occur in separate rhetorical units, and the
    water-drying image is also used as proof of redeeming power.
