  - ev:5
  - ev:6
  confidence: high
  cautions: The contrast is theological and prophetic; ritual details are sparse.
- id: motif:4
  label: Divine judgment on false supports and wickedness
  taxonomy_refs:
  - divine_judgment
  basis: The divine speaker declares works unprofitable, says false companies will
