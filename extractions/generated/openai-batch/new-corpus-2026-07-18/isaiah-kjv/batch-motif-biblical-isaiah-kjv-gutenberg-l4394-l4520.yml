  confidence: high
  cautions: The passage is an oracle of inclusion rather than a narrative of covenant-making.
- id: motif:2
  label: Sacred mountain as divine place and inheritance
  taxonomy_refs:
  - cosmic_mountain
  basis: The LORD brings worshipers to the holy mountain; the one who trusts in him
    inherits the holy mountain; the high and lofty One dwells in a high and holy place.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage identifies a holy mountain and high divine dwelling, but does
    not present a full cosmographic mountain myth.
- id: motif:3
  label: Acceptable and unacceptable sacrifice
  taxonomy_refs:
  - sacrifice
  basis: Accepted burnt offerings and sacrifices on the LORD's altar are contrasted
    with offerings to smooth stones and sacrifice on a lofty high mountain by the
    accused group.
  evidence_refs:
