canonical_text:
  quote: ''
  summary: The passage moves from affliction, darkness, and the promise of light to
    the birth of an exalted Davidic ruler whose government and peace endure. It then
    announces judgment on Israel/Ephraim/Samaria for pride, unrepentance, corrupt
    leadership, wickedness, civil violence, and injustice against the poor, widows,
    and fatherless. Assyria is described as the rod of divine anger sent against a
    condemned nation, but the king of Assyria’s own proud boasting will also be punished
    after the Lord’s work on Zion and Jerusalem.
