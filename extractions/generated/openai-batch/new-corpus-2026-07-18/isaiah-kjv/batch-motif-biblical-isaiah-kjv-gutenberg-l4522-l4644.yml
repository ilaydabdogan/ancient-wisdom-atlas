canonical_text:
  quote: ''
  summary: 'The passage contrasts violent or merely self-afflicting fasting with the
    fast chosen by the LORD: releasing oppression and caring for the hungry, poor,
    naked, and afflicted. It promises light, healing, guidance, water-like renewal,
    rebuilding, Sabbath blessing, and Jacob''s heritage. It then describes sin as
    separation from God, with defiled hands, lies, serpent eggs, spider webs, crooked
    paths, darkness, confession of transgression, failed truth and justice, and the
    LORD arming himself with righteousness, salvation, vengeance, and zeal to repay
    deeds.'
  language: English
  quote_policy: summarized
