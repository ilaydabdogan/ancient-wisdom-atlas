    and to kindle a burning like fire under his glory.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The light of Israel and Holy One are described as fire and flame that burn
    thorns and briers and consume forest and fruitful field.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
