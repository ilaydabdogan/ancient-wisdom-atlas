canonical_text:
  quote: ''
  summary: The passage presents an arrogant conqueror boasting of his power, followed
    by divine judgment depicted as fire and forest-cutting. A remnant of Israel returns
    and trusts the LORD. Zion is told not to fear the Assyrian, whose burden and yoke
    will be removed. An advancing force moves through named places toward Jerusalem,
    but the LORD cuts down the proud like trees. A ruler from Jesse’s root is described
    as endowed with the spirit of the LORD, judging righteously, defeating wickedness
    by speech, and bringing peace among animals and children on the holy mountain,
    where knowledge of the LORD fills the earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker boasts that by his hand, wisdom, and prudence he has removed boundaries,
    robbed treasures, subdued inhabitants, and gathered the earth’s riches like eggs
    from an abandoned nest.
  category: speech
  evidence_refs:
  - ev:1
