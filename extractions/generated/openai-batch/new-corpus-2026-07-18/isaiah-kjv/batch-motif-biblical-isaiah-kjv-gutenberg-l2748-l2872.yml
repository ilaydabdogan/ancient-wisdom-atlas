canonical_text:
  quote: ''
  summary: Rabshakeh and later Assyrian messengers challenge Hezekiah's trust that
    the LORD can deliver Jerusalem. Hezekiah responds with mourning, seeks Isaiah's
    prophetic counsel, spreads the Assyrian letter before the LORD in the temple,
    and prays to the sole creator God for deliverance. Isaiah answers with oracles
    promising the Assyrian king's return and fall, mocking Sennacherib through personified
    Zion, and declaring that the LORD has power over Assyria's conquests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rabshakeh warns the people not to be persuaded by Hezekiah's claim that the
    LORD will deliver them and compares Jerusalem's situation with nations whose gods
    did not deliver them from Assyria.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people do not answer Rabshakeh because the king commanded silence; Eliakim,
    Shebna, and Joah then report Rabshakeh's words to Hezekiah with torn clothes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When Hezekiah hears the report, he tears his clothes, covers himself with
    sackcloth, and enters the house of the LORD.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hezekiah sends Eliakim, Shebna, and sackcloth-clad elders of the priests to
    Isaiah, describing the day as one of trouble, rebuke, and blasphemy and asking
    for prayer for the remaining people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Isaiah tells the messengers that the LORD says not to fear the Assyrian words;
    the LORD will send a blast, the Assyrian king will hear a rumor, return to his
    land, and fall by the sword there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After Rabshakeh returns, Assyrian messengers bring Hezekiah another warning
