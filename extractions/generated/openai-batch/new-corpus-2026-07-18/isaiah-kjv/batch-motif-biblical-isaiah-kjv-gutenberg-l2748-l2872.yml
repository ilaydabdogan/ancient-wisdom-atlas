  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hezekiah receives and reads the letter, goes up to the house of the LORD,
    spreads the letter before the LORD, and prays.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Hezekiah addresses the LORD as the God of Israel dwelling between the cherubims,
