canonical_text:
  quote: ''
  summary: The passage moves from a prophecy about Tyre being forgotten for seventy
    years and later visited by the LORD, to an earthwide judgment in which the land
    is emptied, social ranks share the same fate, covenant-breaking brings curse and
    burning, city joy collapses, and the earth shakes and falls. It then depicts the
    LORD punishing high powers and earthly kings, reigning in Mount Zion and Jerusalem,
    receiving praise as refuge for the poor, and making a feast for all people on
    the mountain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tyre is said to be forgotten for seventy years and afterward to sing as a
    harlot, return to hire, and have merchandise and hire made holiness to the LORD
    for food and clothing for those before him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The LORD is described as making the earth empty and waste, turning it upside
    down, scattering inhabitants, and causing the land to be emptied and spoiled.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the same fate applies across paired social positions
    such as people and priest, servant and master, buyer and seller, and lender and
    borrower.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The earth is described as mourning, fading, and being defiled under its inhabitants
    because they transgressed laws, changed ordinance, and broke an everlasting covenant.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: A curse is said to devour the earth; inhabitants become desolate, are burned,
    and few people remain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Wine, vine, mirth, tabrets, rejoicing, and harp music cease or become bitter,
    while the city of confusion is broken and its gate is destroyed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The remaining people are compared to the shaking of an olive tree and to gleaned
    grapes after vintage.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Voices are said to sing for the majesty of the LORD from the sea, fires, isles,
    and the uttermost part of the earth, while a speaker laments treacherous dealers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Fear, pit, and snare are placed upon the inhabitant of the earth; one who
    flees fear falls into the pit, and one who rises from the pit is caught in the
    snare.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Windows from on high open, foundations of the earth shake, and the earth is
    described as broken, dissolved, moved, reeling like a drunkard, falling, and not
    rising again.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The LORD is said to punish the host of the high ones and the kings of the
    earth, gather them like prisoners in a pit and prison, and visit them after many
    days.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The moon is confounded and the sun ashamed when the LORD of hosts reigns in
    Mount Zion and Jerusalem before his ancients.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: A speaker praises the LORD for wonderful things, for making a fortified city
    into a ruin, and for being strength and refuge to the poor and needy.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: On this mountain the LORD of hosts makes a feast of rich food and refined
    wines for all people.
  category: action
  evidence_refs:
  - ev:11
