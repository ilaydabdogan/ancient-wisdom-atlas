candidate_motifs:
- id: motif:1
  label: Universal divine judgment and earth desolation
  taxonomy_refs:
  - divine_judgment
  basis: The LORD empties and spoils the earth, the curse devours it, inhabitants
    are burned, traps overtake them, the earth collapses, and high powers and kings
    are punished.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage is prophetic poetry/oracle; the motif label summarizes repeated
    judgment imagery rather than a narrative plot.
- id: motif:2
  label: Broken everlasting covenant brings curse
  taxonomy_refs:
  - covenant
  basis: The earth is defiled because inhabitants transgress laws, change ordinance,
    and break the everlasting covenant, after which the curse devours the earth.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not specify the covenant's detailed terms within this
    excerpt.
- id: motif:3
  label: Cosmic disorder and world collapse
  taxonomy_refs:
  - chaos
  basis: The earth is turned upside down, the city of confusion is broken, windows
    from on high open, foundations shake, the earth reels like a drunkard, and sun
    and moon are shamed at divine reign.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The text attributes the disorder to divine judgment, so the chaos motif
    should not be separated from the judgment context.
- id: motif:4
  label: Burning of earth's inhabitants with few survivors
  taxonomy_refs:
  - world_destroying_fire
  basis: The curse devours the earth, the inhabitants are burned, and few people are
    left; fires also appear in the call to glorify the LORD.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: medium
  cautions: Fire is not the only or primary destructive image in the passage; earth-shaking,
    curse, desolation, pit, and snare also appear.
- id: motif:5
  label: Sacred mountain reign and feast for all peoples
  taxonomy_refs:
  - cosmic_mountain
  - world_center
  basis: The LORD reigns in Mount Zion and Jerusalem, and on this mountain makes a
    feast of rich food and refined wine for all people.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: medium
  cautions: The passage names Mount Zion/Jerusalem and the mountain feast, but does
    not explicitly use the terms cosmic mountain or world center.
- id: motif:6
  label: Consecration of commerce to divine provision
  taxonomy_refs:
  - sacred_exchange
  basis: Tyre's merchandise and hire become holiness to the LORD and are directed
    toward sufficient food and durable clothing for those dwelling before him.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is an economic consecration image rather than an explicit exchange
    bargain or ritual transaction.
- id: motif:7
  label: Divine refuge for the poor and needy
  taxonomy_refs: []
  basis: The LORD is described as strength to the poor and needy, refuge from storm,
