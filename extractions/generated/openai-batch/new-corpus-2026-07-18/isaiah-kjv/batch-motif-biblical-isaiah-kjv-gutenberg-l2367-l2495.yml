  summary: The passage describes Tophet as a prepared fiery place, condemns reliance
    on Egypt and military strength instead of the LORD, depicts the LORD defending
    Zion and Jerusalem, calls Israel to turn back and discard idols, announces the
    Assyrian's fall, envisions righteous rule and moral clarity, warns careless women
    of harvest failure and urban desolation, and then describes renewal through spirit
    from on high, peaceful habitation, and reciprocal judgment on a spoiler.
  language: English
  quote_policy: summarized
