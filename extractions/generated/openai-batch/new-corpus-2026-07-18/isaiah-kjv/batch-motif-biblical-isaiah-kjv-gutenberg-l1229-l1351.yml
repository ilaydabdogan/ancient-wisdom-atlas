  summary: Isaiah 15:2-17:9 contains oracles concerning Moab and Damascus. Moab mourns,
    flees, suffers desolated waters, ruined fields, failed prayer, and a predicted
    reduction to a small remnant. A counsel of refuge and a merciful Davidic throne
    are mentioned. Damascus is declared destined to become a ruin; associated cities
    and fortresses are forsaken, while Jacob/Israel is reduced like gleanings, and
    people are described as turning from handmade cult objects to the Maker and Holy
    One of Israel.
