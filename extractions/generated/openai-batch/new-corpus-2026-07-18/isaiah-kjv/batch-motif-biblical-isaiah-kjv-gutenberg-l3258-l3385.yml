  summary: The passage contrasts powerless images with the LORD, presents the LORD's
    servant as upheld and commissioned to bring judgment, light, and release, calls
    many regions to praise, depicts the LORD as warrior and destroyer of landscapes,
    rebukes blind and deaf servants or people, explains Jacob/Israel's spoiling as
    punishment for disobedience, and then promises Israel redemption, protection through
    waters and fire, ransom, and gathering from the ends of the earth.
