candidate_motifs:
- id: motif:1
  label: Commissioned servant as covenant and light
  taxonomy_refs:
  - covenant
  basis: The LORD upholds a servant, gives him spirit, sends him to bring judgment,
    and gives him as a covenant for the people and a light of the Gentiles to open
    blind eyes and release prisoners.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage later uses servant and messenger language for a blind and
    deaf figure; the relation between these servant descriptions is not resolved here.
- id: motif:2
  label: Divine judgment through warrior action and landscape devastation
  taxonomy_refs:
  - divine_judgment
  basis: The LORD goes forth as a man of war, prevails against enemies, destroys and
    devours, wastes mountains and hills, dries waters, and gives Jacob/Israel to spoil
    because of disobedience.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: high
  cautions: The devastation is described in prophetic speech; the passage does not
    specify a single narrative battle event.
- id: motif:3
  label: Liberation from blindness, darkness, and prison
  taxonomy_refs: []
  basis: The servant is associated with opening blind eyes and freeing prisoners from
    darkness, and the LORD promises to guide the blind through unknown paths and make
    darkness light.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage blends literal social captivity language with blindness and
    deafness imagery; the degree of literal versus figurative reference is not resolved
    in the extraction.
- id: motif:4
  label: Protected passage through water and fire
  taxonomy_refs: []
  basis: The LORD promises to be with Israel through waters, rivers, fire, and flame,
    with waters not overflowing and fire not burning or kindling upon them.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: No available motif-family reference exactly matches this protected-passage
    pattern; it is therefore left without a taxonomy motif ref.
- id: motif:5
  label: Return and gathering from the ends of the earth
  taxonomy_refs:
  - return
  basis: The LORD promises to bring Israel's seed from east and west and commands
    north and south to release sons and daughters from far away and the ends of the
    earth.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage describes gathering rather than a detailed travel itinerary.
- id: motif:6
  label: Ransom or exchange of peoples
  taxonomy_refs:
  - sacred_exchange
  basis: The LORD says he gave Egypt, Ethiopia, and Seba as ransom for Israel and
    will give men and people for Israel's life.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage uses prophetic divine speech; whether the exchange is literal,
    political, or theological is not determined within this extraction.
- id: motif:7
  label: Divine creation, naming, and children claimed by the deity
  taxonomy_refs:
  - divine_parent_child
  basis: The LORD says he created and formed Jacob/Israel, called them by name, claimed
    them as his own, and commands the release of 'my sons' and 'my daughters' from
    the ends of the earth.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The parent-child language is collective and covenantal in form; the passage
    does not narrate a biological divine birth.
- id: motif:8
  label: Polemic against powerless images
  taxonomy_refs: []
  basis: The passage says images are vanity, wind, and confusion; the LORD refuses
    to give glory or praise to graven images; and those who trust images are ashamed.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:7
  confidence: high
  cautions: No supplied motif-family taxonomy ref directly corresponds to anti-idol
    polemic.
