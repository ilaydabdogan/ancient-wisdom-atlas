- id: motif:1
  label: Divine judgment for injustice and rejected law
  taxonomy_refs:
  - divine_judgment
  basis: The passage links corrupt judgment and rejection of the LORD's law to fire
    imagery, divine anger, smiting, and the summoning of a destructive foreign force.
  evidence_refs:
