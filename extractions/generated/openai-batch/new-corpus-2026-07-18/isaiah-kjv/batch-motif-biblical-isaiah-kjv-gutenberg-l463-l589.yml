- id: motif:2
  label: Divine throne vision with heavenly attendants
  taxonomy_refs: []
  basis: Isaiah sees the LORD high on a throne in the temple, attended by six-winged
    seraphim whose cry shakes the doorposts and fills the house with smoke.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: No broader taxonomy reference is assigned because the available motif
    list does not contain a direct throne-vision category.
- id: motif:3
  label: Fiery purification before prophetic mission
  taxonomy_refs:
  - initiation
  basis: After Isaiah confesses unclean lips, a seraph touches his mouth with live
    altar coal and declares his sin purged before Isaiah accepts the sending commission.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: medium
  cautions: The initiation classification is interpretive; the passage explicitly
    states purification and commissioning.
- id: motif:4
  label: Desolation followed by remnant seed
  taxonomy_refs:
  - divine_judgment
  - death_rebirth
  - return
  basis: The oracle extends until cities and land are desolate and people removed,
    yet a tenth remains or returns, compared to trees retaining substance, with the
    holy seed as that substance.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: medium
  cautions: The 'death_rebirth' and 'return' taxonomy links are cautious because the
    passage uses tree and return language but does not narrate a full rebirth cycle.
- id: motif:5
  label: Threatened royal house and divine sign offer
  taxonomy_refs:
