candidate_motifs:
- id: motif:1
  label: Sacred birth as divine sign
  taxonomy_refs:
  - sacred_birth
  basis: A virgin conceives and bears a named son as a sign given by the Lord.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage states the sign in oracle form and does not narrate the birth
    beyond the announcement.
- id: motif:2
  label: Child as prophetic sign and time marker
  taxonomy_refs:
  - miraculous_child
  basis: Immanuel and Mahershalalhashbaz are named children whose early development
    is used to mark coming political events; the narrator's children are also called
    signs and wonders.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:8
  confidence: high
  cautions: Only Immanuel is explicitly introduced as a sign in the passage; Mahershalalhashbaz
    functions as a timed prophetic sign through the oracle.
- id: motif:3
  label: Divine judgment through foreign invasion
  taxonomy_refs:
  - divine_judgment
  basis: The LORD brings the king of Assyria, describes devastation through shaving
    and flood imagery, and foretells stumbling, hunger, cursing, and darkness.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:7
  - ev:10
  confidence: high
  cautions: The passage presents judgment imagery but does not give a full historical
    account of the invasion.
- id: motif:4
  label: Overwhelming waters as invasion
  taxonomy_refs:
  - flood_and_renewal
  basis: The king of Assyria and his glory are described as strong waters of the river
    overflowing channels, banks, and Judah.
  evidence_refs:
  - ev:5
  confidence: low
  cautions: The passage uses flood-like imagery for invasion, but it does not describe
    a world flood or renewal.
- id: motif:5
  label: Discernment and revealed instruction
  taxonomy_refs:
  - wisdom
  basis: The child will know to refuse evil and choose good, and the passage directs
    people to the law and testimony as the standard for speech and light.
  evidence_refs:
  - ev:1
  - ev:9
  confidence: medium
  cautions: The passage is primarily prophetic warning rather than a wisdom discourse.
- id: motif:6
  label: Divine dwelling on sacred mountain
  taxonomy_refs:
  - cosmic_mountain
  - world_center
  basis: The LORD of hosts is said to dwell in Mount Zion.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage contains only a brief statement about Mount Zion and does
    not elaborate a cosmic geography.
