canonical_text:
  quote: ''
  summary: A sequence of prophetic oracles announces a child named Immanuel as a sign
    to the house of David, warns of Assyrian devastation through images of insects,
    shaving, thorns, and overflowing waters, records the naming of Mahershalalhashbaz
    before witnesses, and instructs reliance on the LORD, the law, and testimony rather
    than confederacies or consultation with the dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The house of David is addressed and accused of wearying men and God.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Lord announces a sign: a virgin will conceive, bear a son, and call his
    name Immanuel.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The son will eat butter and honey and will come to know how to refuse evil
    and choose good; before that stage, a land will be forsaken by both its kings.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The LORD will bring unprecedented days by means of the king of Assyria, summon
    a fly from Egypt and a bee from Assyria, and shave head, feet, and beard with
    a hired razor associated with Assyria.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A remaining man will nourish a young cow and two sheep; those left in the
    land will eat butter and honey, while valuable vineyards become briers and thorns.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The LORD commands the narrator to take a great roll and write concerning Mahershalalhashbaz
    with a man's pen; Uriah the priest and Zechariah son of Jeberechiah are taken
    as faithful witnesses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator goes to the prophetess; she conceives and bears a son, and the
    LORD commands that the son be named Mahershalalhashbaz.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Before the child can cry 'My father' and 'My mother,' the riches of Damascus
    and the spoil of Samaria will be taken away before the king of Assyria.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The people refuse the soft waters of Shiloah and rejoice in Rezin and Remaliah's
    son; the Lord will bring upon them the strong waters of the river, identified
    with the king of Assyria and his glory.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The river will overflow Judah, reach to the neck, and its wings will fill
    the breadth of Immanuel's land.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Peoples may associate, gird themselves, take counsel, and speak a word, but
    the oracle says they will be broken and their counsel will not stand because God
    is with us.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The narrator is instructed not to walk in the people's way, not to fear their
    confederacy, and to sanctify the LORD of hosts as fear and dread.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The LORD will be a sanctuary, but also a stone of stumbling, rock of offence,
    gin, and snare to the houses of Israel and inhabitants of Jerusalem; many will
    stumble, fall, be broken, be snared, and be taken.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: The testimony is to be bound and the law sealed among disciples; the narrator
    and the children given by the LORD are signs and wonders in Israel from the LORD
    of hosts who dwells in Mount Zion.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage rejects seeking familiar spirits, wizards, or the dead, and directs
    speech to the law and testimony; those not speaking according to this word have
    no light in them.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: Hungry people will curse their king and their God, look upward and to the
    earth, and encounter trouble, darkness, dimness, anguish, and being driven to
    darkness.
  category: sequence
  evidence_refs:
  - ev:10
