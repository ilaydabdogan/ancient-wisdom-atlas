canonical_text:
  quote: ''
  summary: The passage presents the LORD as creator of the heavenly host and the ends
    of the earth, giver of strength to the faint, chooser and helper of Israel/Jacob,
    judge over peoples and rival claimants, provider of water and trees in wilderness,
    and raiser of unnamed agents who subdue nations and princes. It includes images
    of eagle-like renewal, divine hand-holding, mountains threshed to chaff, desert
    waters and trees, artisan-made objects fastened with nails, and good tidings to
    Zion/Jerusalem.
  language: English
  quote_policy: summarized
