canonical_text:
  quote: ''
  summary: The passage announces fear of the LORD across the earth, a Redeemer coming
    to Zion, and a covenant preserving the divine spirit and words through descendants.
    Zion is told to rise in divine light while nations, kings, returning children,
    wealth, animals, and ships come to it. The city is rebuilt, beautified, named
    as the LORD's city, protected from violence, and lit by the LORD rather than sun
    or moon. An anointed speaker proclaims good news, liberation, comfort, restorative
    exchanges, and rebuilding of desolations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People from west and east are said to fear the LORD's name and glory; when
    an enemy comes like a flood, the Spirit of the LORD lifts up a standard against
    him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Redeemer is said to come to Zion and to those in Jacob who turn from transgression;
    the LORD calls this a covenant in which his spirit and words remain in the mouths
    of the addressee and descendants forever.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The addressed figure is told to arise and shine because its light has come
    and the LORD's glory has risen upon it; darkness covers earth and peoples, while
    Gentiles and kings come to its light and brightness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sons and daughters gather and come from far away, while abundance from the
    sea and the forces of Gentiles come to the addressed figure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Camels, dromedaries, people from Sheba, gold, incense, flocks, and rams come;
    the rams minister and come with acceptance on the altar, and the LORD says he
    will glorify his house.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Isles wait, ships of Tarshish bring sons from far with silver and gold, strangers
    build the walls, kings minister, and gates remain open day and night to receive
    Gentile resources and kings.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A nation or kingdom that will not serve the addressed figure is said to perish
    and be utterly wasted.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Lebanon's trees come to beautify the sanctuary and the place of the LORD's
    feet; descendants of afflicters and despisers bow and call the city the city of
    the LORD and Zion of the Holy One of Israel.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The formerly forsaken and hated city is to become an eternal excellency and
    a joy of many generations; it is described as sucking the milk of Gentiles and
    the breast of kings and knowing the LORD as Saviour and Redeemer.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The LORD promises substitutions of materials, such as gold for brass and silver
    for iron, and says officers will be peace and exactors righteousness; violence,
    wasting, and destruction will no longer be heard in the land, and walls and gates
    are named Salvation and Praise.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sun and moon no longer serve as the city's light, because the LORD is its
    everlasting light; mourning ends, the people are righteous and inherit the land
    forever, and a little one becomes a thousand and a small one a strong nation.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: A first-person speaker says the Spirit of the Lord GOD is upon him because
    the LORD has anointed him to preach good tidings, bind the brokenhearted, proclaim
    liberty to captives, open prison to the bound, proclaim the acceptable year and
    day of vengeance, and comfort mourners.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Mourners in Zion receive beauty for ashes, oil of joy for mourning, and a
