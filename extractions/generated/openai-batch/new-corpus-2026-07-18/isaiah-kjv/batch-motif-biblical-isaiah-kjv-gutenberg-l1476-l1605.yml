  summary: The passage contains oracles concerning Egypt, Assyria, Israel, Ethiopia,
    Babylon, Dumah, Arabia, Kedar, and the valley of vision. It describes worship
    of the LORD in Egypt, a highway between Egypt and Assyria, Isaiah’s enacted sign
    of nakedness and barefoot walking, visions of invasion and Babylon’s fall, a watchman’s
    answer about night and morning, aid to fugitives in Arabia, Kedar’s decline, and
    rulers fleeing from a tumultuous city.
