  summary: The passage pronounces sudden desolation on an arrogant addressee that
    trusted in wickedness, sorceries, astrologers, and merchants. It then addresses
    Jacob/Israel as a people named by the LORD yet obstinate, describing the LORD’s
    foreknowledge, refusal to share glory with idols, delayed anger, and refining
