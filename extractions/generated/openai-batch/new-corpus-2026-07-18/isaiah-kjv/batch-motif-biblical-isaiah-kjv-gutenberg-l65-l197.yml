candidate_motifs:
- id: motif:1
  label: Divine indictment and judgment of a rebellious people
  taxonomy_refs:
  - divine_judgment
  basis: The LORD accuses nourished children of rebellion, rejects corrupt worship,
    threatens the sword, and announces destruction or consumption of transgressors
    and sinners.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage is a prophetic oracle rather than a narrative myth; motif
    labeling should remain functional and descriptive.
- id: motif:2
  label: Rejected sacrifice without justice
  taxonomy_refs:
  - sacrifice
  - divine_judgment
  basis: The LORD says he does not delight in sacrifices, offerings, incense, feasts,
    assemblies, or prayers while the people's hands are full of blood, and then commands
    justice for vulnerable groups.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not reject ritual in the abstract; it rejects the rituals
    of the addressed people in their stated moral condition.
- id: motif:3
  label: Ritual washing and moral purification
  taxonomy_refs: []
  basis: The people are commanded to wash and make themselves clean; their sins are
    compared to scarlet and crimson becoming white like snow or wool.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The purification language is figurative and ethical within the oracle;
    no separate ritual procedure is described.
- id: motif:4
  label: Conditional obedience with blessing or sword
  taxonomy_refs:
  - covenant
  basis: The oracle states that willingness and obedience lead to eating the good
    of the land, while refusal and rebellion lead to being devoured by the sword.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The word covenant does not appear in this passage; the taxonomy reference
    is based only on the conditional blessing-and-judgment structure.
- id: motif:5
  label: Corrupt city purified and restored
  taxonomy_refs:
  - divine_judgment
  basis: The faithful city is described as corrupted; the LORD promises to purge away
    dross, remove tin, restore judges and counsellors, and rename the city as righteous
    and faithful.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The city is personified; the passage does not describe a literal metallurgical
    act.
- id: motif:6
  label: Small remnant spared from total destruction
  taxonomy_refs: []
  basis: The passage says the LORD of hosts left a very small remnant, without which
    the people would have been like Sodom and Gomorrah.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No named survivor pair or detailed survival narrative appears.
- id: motif:7
  label: Withered tree and waterless garden as images of shame and decline
  taxonomy_refs:
  - sacred_tree_axis
  basis: The hearers are told they will be ashamed of desired oaks and chosen gardens
    and are compared to a fading oak and a garden without water.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: Although tree and garden imagery is explicit, the passage does not present
    the oak as a world tree; the taxonomy reference is therefore tentative.
- id: motif:8
  label: Unquenchable burning of offenders
  taxonomy_refs:
  - divine_judgment
  basis: The strong and its maker are compared to tow and spark, and both are said
    to burn together with none to quench them.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The fire is directed at offenders in the oracle and is not described as
    world-destroying.
- id: motif:9
  label: Exalted divine mountain as center of instruction for nations
  taxonomy_refs:
  - cosmic_mountain
  - world_center
  - ascent
  - wisdom
  basis: The mountain of the LORD's house is established above other heights; nations
    flow to it, and many people go up to receive divine teaching, law, and the word
    from Zion and Jerusalem.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage describes an eschatological or future exalted mountain in
    prophetic terms; it does not narrate an individual ascent quest.
comparison_claims:
- id: claim:1
