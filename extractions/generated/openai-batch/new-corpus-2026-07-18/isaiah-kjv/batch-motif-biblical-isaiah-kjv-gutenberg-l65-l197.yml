canonical_text:
  quote: ''
  summary: Isaiah's vision concerns Judah and Jerusalem. The LORD calls heaven and
    earth to hear an accusation against rebellious children and a sinful nation. The
    land is desolate, cities are burned, and Zion remains like a besieged city, with
    only a small remnant. The LORD rejects sacrifices, offerings, feasts, and prayers
    because the people's hands are full of blood, and calls them to wash, cease evil,
    and seek justice for the oppressed, fatherless, and widow. Obedience is linked
    with eating the good of the land, while rebellion is linked with the sword. Jerusalem
    is lamented as a formerly faithful city now corrupt; the LORD promises to purge
    away dross, restore judges and counsellors, redeem Zion with judgment, and consume
    sinners. Those attached to oaks and gardens are compared to a fading oak and a
    waterless garden, and the strong and its maker are said to burn together. A later
    vision says the mountain of the LORD's house will be exalted and that nations
    will go up to it to receive divine teaching, law, and the word from Zion and Jerusalem.
  language: English
  quote_policy: summarized
