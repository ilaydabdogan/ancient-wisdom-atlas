candidate_motifs:
- id: motif:1
  label: Divine wisdom as practical instruction and hidden understanding
  taxonomy_refs:
  - wisdom
  basis: The passage attributes agricultural discretion to God's teaching and later
    states that the wisdom of the wise will perish while erring people will come to
    understanding.
  evidence_refs:
  - ev:1
  - ev:9
  - ev:14
  confidence: high
  cautions: The motif is broad; the passage contains explicit wisdom and instruction
    language but not a narrative quest for wisdom.
- id: motif:2
  label: Divine judgment on city, enemies, and unjust actors
  taxonomy_refs:
  - divine_judgment
  basis: The LORD announces distress and siege for Ariel, visits with cosmic disturbance
    and fire, frustrates attacking nations, and cuts off oppressors and unjust accusers.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:13
  confidence: high
  cautions: The judgment is prophetic and poetic rather than a fully developed mythic
    battle narrative.
- id: motif:3
  label: Sealed revelation and impaired perception
  taxonomy_refs:
  - wisdom
  basis: The vision becomes a sealed book; prophets, rulers, and seers are covered,
    while later the deaf hear the book and the blind see out of darkness.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:11
  confidence: high
  cautions: Classified under wisdom because available taxonomy lacks a specific revelation-blindness
    category.
- id: motif:4
  label: Reversal and restoration of the lowly
  taxonomy_refs: []
  basis: Lebanon becomes fruitful, the deaf and blind receive hearing and sight, the
    meek and poor rejoice, and oppressors are removed.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: No specific available motif-family reference cleanly captures this restoration
    pattern.
- id: motif:5
  label: Creature challenging maker
  taxonomy_refs: []
  basis: The passage uses potter's clay and a framed thing to question whether a made
    work can deny or accuse its maker of lacking understanding.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: This is a prophetic analogy, not an independent creation narrative in
    this passage.
- id: motif:6
  label: Rebellious children reject divine counsel
  taxonomy_refs:
  - divine_parent_child
  basis: The LORD calls the addressees rebellious children who take counsel and covering
    not from him or his spirit.
  evidence_refs:
  - ev:15
  confidence: medium
  cautions: The parent-child relation is metaphorical within the oracle.
- id: motif:7
  label: False refuge in a foreign shadow
  taxonomy_refs: []
  basis: The addressees go down to Egypt and trust Pharaoh's strength and Egypt's
    shadow, which are said to become shame and confusion.
  evidence_refs:
  - ev:15
  - ev:16
  confidence: high
  cautions: The passage presents a political-theological oracle rather than an extended
    journey motif.
- id: motif:8
  label: Sacrificial continuity before announced distress
  taxonomy_refs:
  - sacrifice
  basis: Ariel is addressed as the city where David dwelt, with years added and sacrifices
    killed, immediately before announced distress.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: Sacrifice is mentioned briefly and not elaborated as a sacrificial myth
    or ritual episode.
