candidate_motifs:
- id: motif:1
  label: Prophetic judgment after royal treasure display
  taxonomy_refs:
  - divine_judgment
  basis: The narrative places Hezekiah's display of all his treasures to Babylonian
    visitors before Isaiah's oracle that those stored goods will be carried to Babylon
    and nothing will be left.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage sequence supports the association, but this excerpt does not
    explicitly name Hezekiah's motive or state a causal formula beyond the prophetic
    response.
- id: motif:2
  label: Royal descendants taken into foreign palace service
  taxonomy_refs:
  - divine_judgment
  - departure
  basis: Isaiah says some sons issuing from Hezekiah will be taken away and become
    eunuchs in the palace of the king of Babylon.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage forecasts removal and palace service but does not narrate
    the later event within this excerpt.
- id: motif:3
  label: Post-punishment comfort and pardon of a city
  taxonomy_refs:
  - divine_judgment
  basis: Jerusalem is told that her warfare is accomplished, her iniquity pardoned,
    and that she has received from the LORD's hand for her sins.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage emphasizes comfort and pardon; it does not here give a detailed
    restoration narrative.
- id: motif:4
  label: Wilderness highway for divine arrival
  taxonomy_refs: []
  basis: A wilderness voice commands preparation of the LORD's way and a straight
    desert highway for God, with valleys raised and mountains lowered before divine
    glory appears.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No specific available taxonomy family directly matches the road-preparation
