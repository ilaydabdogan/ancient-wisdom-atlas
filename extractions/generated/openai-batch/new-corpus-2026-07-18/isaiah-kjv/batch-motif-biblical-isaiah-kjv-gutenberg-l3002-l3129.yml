- id: motif:6
  label: Human frailty contrasted with enduring divine word
  taxonomy_refs:
  - wisdom
  basis: All flesh and human goodliness are likened to grass and a fading flower,
    while the word of God is said to stand forever.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The wisdom classification is based on the didactic contrast in the passage
    rather than an explicit genre label.
- id: motif:7
  label: Divine shepherd-ruler
  taxonomy_refs: []
  basis: The Lord GOD comes with ruling strength and is also described as feeding
    a flock, gathering lambs, carrying them, and gently leading those with young.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage itself combines rule and shepherd imagery; it does not identify
    a separate named mythic shepherd tradition.
- id: motif:8
  label: Incomparable cosmic sovereign
  taxonomy_refs:
  - wisdom
  basis: Rhetorical questions deny that anyone taught or counseled the LORD, describe
    God measuring waters, heavens, earth, mountains, and hills, and ask what likeness
    can compare to God.
  evidence_refs:
  - ev:9
  - ev:11
  - ev:12
  confidence: high
  cautions: The taxonomy link to wisdom is general and rests on rhetorical instruction
    and divine incomparability.
- id: motif:9
