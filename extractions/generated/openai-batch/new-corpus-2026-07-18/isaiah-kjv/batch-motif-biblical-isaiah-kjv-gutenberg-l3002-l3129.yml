canonical_text:
  quote: ''
  summary: Isaiah 39 narrates a Babylonian embassy to Hezekiah, Hezekiah's display
    of his treasures, Isaiah's inquiry, and a prophetic word that the stored goods
    and some royal descendants will be taken to Babylon. Isaiah 40:1-25 begins with
    comfort for Jerusalem, a wilderness command to prepare the LORD's way, terrain
    leveling and revelation of divine glory, a contrast between withering flesh and
    the enduring word of God, good tidings to Judah, imagery of God as ruler and shepherd,
    declarations of divine cosmic measure and wisdom, the smallness of nations, a
    critique of crafted images, and the LORD seated above the circle of the earth
    bringing rulers to nothing.
  language: English
  quote_policy: summarized
