- id: motif:5
  label: Universal revelation of divine glory
  taxonomy_refs: []
  basis: The passage says the glory of the LORD shall be revealed and all flesh shall
    see it together.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a strong internal motif, but no external comparison is asserted
