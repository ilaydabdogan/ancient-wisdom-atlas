canonical_text:
  quote: ''
  summary: The passage moves from judgment on Zion's finery and warriors, to a promise
    that survivors in Zion will be made holy and sheltered by cloud, fire, and tabernacle.
    It then presents a vineyard song in which a beloved owner prepares a vineyard
    that yields wild grapes; the vineyard is identified as Israel and Judah, whose
    injustice leads to desolation, captivity, hunger, thirst, and descent into hell.
    Further woes condemn land accumulation, drunken feasting, moral inversion, pride
    in wisdom, and strength in drink.
  language: English
  quote_policy: summarized
