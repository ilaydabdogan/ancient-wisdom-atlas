candidate_motifs:
- id: motif:1
  label: Divine judgment through reversal and desolation
  taxonomy_refs:
  - divine_judgment
  basis: The passage repeatedly depicts the LORD or Lord judging social and moral
    failure through reversal of beauty, war losses, desolation, captivity, famine,
    thirst, humiliation, and the vineyard's ruin.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  - ev:11
  - ev:12
  - ev:13
  - ev:15
  - ev:17
  confidence: high
  cautions: This is a broad motif-family assignment based on repeated explicit judgment
    language and consequences within the passage.
- id: motif:2
  label: Purified remnant under divine protection
  taxonomy_refs:
  - divine_judgment
  basis: Those left in Zion are called holy after washing and purging; cloud, smoke,
    flaming fire, and a tabernacle provide defence and refuge.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The taxonomy reference captures the judgment/purification aspect; the
    protective remnant pattern is more specific than the available motif family labels.
- id: motif:3
  label: Sacred mountain protected by cloud and fire
  taxonomy_refs:
  - cosmic_mountain
  basis: Mount Zion is the setting for created cloud, smoke by day, flaming fire by
    night, and protective glory over dwellings and assemblies.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage names mount Zion and divine protective phenomena, but does
    not explicitly describe a cosmic mountain or world axis.
- id: motif:4
  label: Beloved owner's vineyard as judged people
  taxonomy_refs:
  - divine_beloved
  - divine_judgment
  basis: The song addresses a beloved with a vineyard; the vineyard is cultivated,
    fails to produce expected grapes, is judged with waste and withheld rain, and
    is identified as Israel and Judah failing to produce justice and righteousness.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  confidence: medium
  cautions: The beloved language is explicit in the song, but the available taxonomy
    label 'divine_beloved' may not exactly match the vineyard-owner relationship;
    human review should verify taxonomy fit.
- id: motif:5
  label: Devouring underworld mouth
  taxonomy_refs:
  - hero_descent
  basis: Hell is personified as opening her mouth without measure, and the glory,
    multitude, pomp, and rejoicing person descend into it.
  evidence_refs:
  - ev:16
  confidence: low
  cautions: The passage depicts descent into hell, but not a heroic descent or afterlife
    journey; taxonomy fit is weak and should be reviewed.
- id: motif:6
  label: Moral inversion of paired opposites
  taxonomy_refs:
  - duality
  - wisdom
  basis: A woe condemns calling evil good and good evil, putting darkness for light
    and light for darkness, and bitter for sweet and sweet for bitter; the next woe
    condemns those wise in their own eyes.
  evidence_refs:
  - ev:19
  confidence: medium
  cautions: The passage supplies paired opposites and false wisdom, but the assignment
    to broad duality and wisdom families is interpretive.
