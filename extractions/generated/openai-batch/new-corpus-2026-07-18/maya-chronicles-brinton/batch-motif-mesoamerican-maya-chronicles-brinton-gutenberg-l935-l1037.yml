canonical_text:
  quote: ''
  summary: The passage discusses conflicting accounts of Maya numerals, defends Beltran's
    system using manuscript evidence, lays out an ancient vigesimal sequence of higher-number
    terms, gives etymologies connecting numeral terms with bundles, cords, garments,
    sacks, cacao or corn measures, deerskin, and possible time-period terms, and quotes
    a native explanation of calendar numerals written with dots and lines.
  language: English, with Spanish and Yucatec Maya quotations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator reports that Pio Perez severely criticized Father Beltran's numeral
    system, yet Perez's own dictionary and autograph manuscript give numerals above
    40 according to Beltran's form.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three manuscript dictionaries composed before 1690 are said to affirm Beltran's
    system, leading the narrator to regard it as authentic and current among native
    speakers before later scholarly grammatical reshaping.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The higher-number computation is presented as vigesimal: 20 units form one
    kal, 20 kal one bak, 20 bak one pic, 20 pic one calab, 20 calab one kinchil or
    tzotzceh, and 20 kinchil one alau.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Spaniards are said to have obscured the ancient system by using pic for
    1000 and kinchil for 1,000,000 rather than their original values.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The narrator connects several number terms with physical actions or objects:
    kal with fastening or bundling, bak with tying around with cords, and pic with
    a short petticoat sometimes used as a sack.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Grains of corn or cacao are described as common counters, and related Kiche
    and Cakchiquel terms are discussed as possible quantity measures.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Calab is explained as possibly deriving from a verb meaning to stuff or fill,
    while Cakchiquel cala is described as related to bag, sack, countless number,
    and specifically 20 loads of cacao beans.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tzotzceh is stated to mean deerskin; kinchil, alau, and hunhablat are tentatively
    connected with terms for day, month, and year.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The narrator suggests that the objects named by higher numeral terms may have
    influenced the graphic representation of Maya hieroglyphic numerals.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The first nineteen numerals are described as written by combinations of dots
    and lines, with examples in the Codex Troano and other manuscripts.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'A native writer explains calendar numerals in which dots and lines stand
    for years: dots count single years and a line counts five years, with combinations
    making larger numbers.'
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage closes by stating that the plan of using numerals in Maya differs
    somewhat from English usage.
  category: other
  evidence_refs:
