  summary: The passage is a linguistic introduction to Maya, describing grammar, word
    order, genitive marking, compounds, phonetics, particles, manuscript style, intelligibility
    of older writings, homonyms, and the author's warning against superficial comparisons
    between Maya and other languages.
  language: English
