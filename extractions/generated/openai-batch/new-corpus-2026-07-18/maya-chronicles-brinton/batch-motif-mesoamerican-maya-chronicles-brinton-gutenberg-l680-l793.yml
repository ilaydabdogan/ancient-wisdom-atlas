literal_observations:
- id: obs:1
  text: The passage describes Maya as lacking a dual, inclusive/exclusive plurals,
    articles, a substantive verb, transitions, and many irregular verbs, and states
    that its forms are quickly learned.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Maya word position is not dissimilar from English,
    with adjectives before nouns and sentences usually following subject-verbal-object
    order, while allowing transposition.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage explains that Maya can indicate genitive relation with a possessive
    pronoun and can use the ending il, sometimes al or el, for genitive, ablative,
    or material relations.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The passage distinguishes ownership from use in examples involving a father's
    well and mentions water as the thing obtained from a well not owned by the father.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that Maya compound words are frequent and that their members
    usually undergo no change except occasional syncope.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The passage gives examples of compounds: midnight as a union of words for
    middle and night, and dawn as a union of words for awaken and world.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage identifies six Maya phonetic elements that were new to the Spaniards
    and says that the k sound is especially difficult.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that particles are numerous in Maya and express relations
    of space and time as well as finer shades of meaning.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says native writers often adopted an elliptical and obscure style,
    partly from limited skill in composition and partly from imitation of priestly
    mysterious expression.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says older manuscripts contain words and forms unfamiliar to a
