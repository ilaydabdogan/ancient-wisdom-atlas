  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage rejects Waldeck's claim that Maya had changed so much that century-old
    writing would be unintelligible to contemporary natives.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that a Conquest narrative written more than three hundred
    years earlier by chief Pech could be read without much difficulty by an educated
