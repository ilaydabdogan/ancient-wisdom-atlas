canonical_text:
  quote: ''
  summary: A katun-based chronology recounts departures, migrations, discoveries,
    foundations, periods of rule, abandonments, invasions, and depopulations involving
    Tutulxiu, Itza, Chichen Itza, Chanputun, Uxmal, and Mayapan. It then records Spanish
    arrival, Christianity and baptism, pestilence and smallpox, named deaths, bishops,
    colonial officials, public works, hangings, and town registration through later
    dated years.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chronology begins from a departure from Nonoual and Zuiva in the west,
    involving four Tutulxiu from Tulapan who had formed a league.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The travelers are said to have journeyed for four katuns and 81 years before
    arriving in Chacnouitan; Holon Chantepeuh and his followers and Ahmekat Tutulxiu
    are named in connection with this arrival.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The province Ziyan caan or Bakhalal is discovered and ruled for 60 years;
    during that period Chichen Itza is discovered.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Itza holy men rule at Chichen Itza for 120 years, then abandon Chichen Itza
    and go to Chanputun, where they have houses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After Chanputun is seized and abandoned, those of Itza are described as being
    under trees, boughs, and branches, in sorrow, while searching for their houses
    a second time.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ahcuitok Tutulxiu founds Uxmal, and a 200-year rule with the governor of Chichen
    Itza and Mayapan is recorded.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The governor of Chichen Itza, associated with Chac Xib Chac, is driven out
    because of plotting against Hunac Eel, governor of Mayapan; seven men of Mayapan
    are named in connection with depopulation.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Thirteen divisions of warriors go to the fortress of the ruler of Ulmil and
    are dispersed by Hunac Eel.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The fortress land of Mayapan is invaded by men of Itza and their ruler Ulmil,
    and Mayapan is later depopulated by foreigners from the mountains.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Spaniards first pass to and come to Yucatan sixty years after the fortress
    is depopulated.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Pestilence and smallpox occur in the fortresses; Ahpula dies on a specified
    day in the year 1536.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Spaniards described as mighty men arrive from the east; Christianity begins,
