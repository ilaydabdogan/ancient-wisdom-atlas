canonical_text:
  quote: ''
  summary: Brinton introduces the Series of the Katuns from the Book of Chilan Balam
    of Mani, gives a historical tradition about the destruction of Mayapan and the
    founding of Mani, summarizes the chronicle’s manuscript and publication history,
    describes a suggested oral mnemonic function for the text in relation to painted
    records and katun stones, and corrects Brasseur’s invented title by explaining
    the phrase u tzolan katun.
  language: English, with quoted Maya and French phrases
  quote_policy: summarized
