canonical_text:
  quote: ''
  summary: A Yucatec Maya recital attributed to the priest Chilam is given with English
    translation, describing a charged day of food and water, dust, blight, rising
    cloud and mountain, land seizure, ruin, a marked tree, battle flag, and scattering
    in forests. The accompanying notes discuss the founding and later ruin of Uxmal,
    Mayapan political conflict, Nahuatl-looking names among Mayapan figures, and the
    sacred and social significance of the number thirteen.
  language: English translation with Yucatec Maya text and lexical notes
  quote_policy: summarized
