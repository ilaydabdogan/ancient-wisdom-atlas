canonical_text:
  quote: ''
  summary: A colonial Maya chronicle frames the Spanish arrival, conversion, local
    alliances, reception of bearded eastern newcomers bearing the sign of the one
    God, naming of Yucatan through language misunderstanding, and a later episode
    in which envoys are blinded in a cave before returning to the Adelantado.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator says the chronicle was collected for books so that people who
    wished to know it could know it, according to what God had decreed from the beginning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The arrival of the Spaniards is described as occurring by the will of God
    and by the orders of Don Juan de Montejo and Don Francisco de Montejo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Montejos are said to have ordered churches, a town house, a temple for
    the ruler, and a public house for travelers to be built.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ah Naum Pech tells those he commanded that the one true God and the sign of
    the true God are coming to the town and country.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ah Naum Pech instructs his people to receive the newcomers joyfully, not make
    war, and provide maize, fowls, pheasants, honey, and beans if food or drink is
    lacking.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The people described by Ah Naum Pech do not make war and instead aid the Spaniards
    in the conquest, marching with the foreigners.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Nachi Cocom and Ah Cahuot Cocom deliver their standards and banners for the
    conquest, receive the Adelantado and priest, abstain from injury, and lay out
    churches and town-houses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Naci Mabun Chan is said to understand that eternal life has come to his village
    and to wish that several named groups and districts be delivered to God.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The land is described as having been given by God to be redeemed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ah Naum Pech announces that on the day called 1 Ymix, bearded men will come
    from the eastern lands with the sign of the only God.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The youths go to receive the arriving guest, pass under trees and branches,
    and reach the house of Ah Naca Cab of Canul at Campeche.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ships appear in the port of Campeche, with banners waving and a white standard
    visible; after anchoring, the Christians and the Adelantado ask in Castilian whether
    the locals have been baptized.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The locals do not know the Castilian language and answer that they do not
    understand the words; the passage connects this exchange with the naming of the
    land as Yucatan.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Spaniards travel toward Mani, and chiefs named Ikeb, Caixicum, and Chuc
    are appointed to invite Ah Cuat Cocom.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The appointed envoys are taken by followers of Ah Cuat Cocom, placed in a
    cave, blinded in the cave of weasels, and sent groping back to the Adelantado
    at Mani.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Ah Cuat Cocom says he had not seen or heard of the blinding, says he had gone
    to Chichen Itza, and gives permission for those who did it to be taken.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: A later section mentions Spaniards passing on after a massacre of foreigners,
    local governors returning to their districts, and war among serving men on account
    of labor obligations.
  category: sequence
  evidence_refs:
  - ev:9
