  summary: The passage is a translated katun-count chronicle. It lists events by ahau
    periods, beginning with the discovery of Chichen Itza and continuing through abandonment,
    migration to Chakanputun, expulsions connected with Hunac Ceel, seizure and fighting
    at Mayapan, pestilence and smallpox, named deaths, eastern arrivals who bring
    sickness, and notices of Christianity, baptism, and bishops.
