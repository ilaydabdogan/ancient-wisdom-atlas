canonical_text:
  quote: ''
  summary: Sections 9-14 of the Chronicle of Chicxulub present a first-person colonial
    Maya account centered on Nakuk Pech/Don Pablo Pech. The passage names Spanish
    officials, baptism and Christian naming, noble and batab status, receipt and transfer
    of a vara of justice, service to God and the king, the arrival and settlement
    of local officeholders at Chac Xulub Chen, the coming of Spaniards, wartime service,
    tribute obligations or exemptions, and title/proof claims for descendants.
  language: Yucatec Maya with Spanish names and colonial administrative terms
  quote_policy: summarized
