  summary: The passage describes a thirteen-katun cycle or doubling that ends at the
    tenth Ahau Katun, is marked on a katun circle or wheel, and then begins again.
    The commentator explains the counting of these repetitions, names the circle or
    wheel terms, notes the lack of verified original examples, and introduces a chronological
    table arranged by Great Cycles and Katuns.
  language: English
