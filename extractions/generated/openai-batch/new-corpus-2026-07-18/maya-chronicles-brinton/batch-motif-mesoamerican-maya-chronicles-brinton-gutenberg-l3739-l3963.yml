canonical_text:
  quote: ''
  summary: An annalistic sequence of ahau/katun entries records arrivals, discoveries,
    rulership, destructions, migrations, foundations, plots, warfare, foreign incursions,
    epidemics, Christianization, colonial officials, hangings, and town registration
    in Yucatan and named Maya centers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is organized as a chronological sequence of named ahau periods
    and later dated years.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:15
- id: obs:2
  text: Mekat Tutulxiu arrived at Chacnabiton, and entries mention learning about
    Chichen Itza and discovering the province of Zian can.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The men of Itza ruled Chichen Itza for ten score years; Chichen Itza was then
    destroyed, and they went to live at Chakanputun, where the houses of the Itza
    holy men were located.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chakanputun was seized, later abandoned, and the men of Itza came in search
    of their houses a second time; they lost the road to Chakanputun and were under
    trees, boughs, and branches to their sorrow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A later entry says they came and established their houses a second time when
    they lost the road to Chakanputun.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ahzuitok Tutulxiu founded Uxmal, and the territory of Uxmal was established
    after ten score years had passed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: An unnamed ruler deserted or depopulated Chichen Itza on account of Hunac
    Ceel's plot; seven men are named, a banquet with Ulil is mentioned, and thirteen
    divisions of warriors were driven out by Hunac Ceel.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Another entry says the ruler seized land on account of Hunac Ceel's plot,
    and fighting took place in the fortress Mayapan because of the seizure of the
    castle and joint government in the city.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Foreigners first passed to Yucatan according to one entry, and Mayapan was
    later depopulated by foreigners from the mountains.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: The passage records pestilence, general death, smallpox, and the death of
    Ahpulha with calendrical details and the year 1536.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Foreigners described as mighty men from the east arrived in the land; Christianity
    began, baptism took place, and the first bishop Toral came in the katun associated
    with 1544.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Later entries report bishop Landa's death, the Fathers settling at Mani and
    upon the water, the building of a Hospital, the arrival of Doctor Quixada as first
    governor, hangings, Mariscal's arrival, smallpox, the hanging of those of Tekax,
    and towns being written down by the Judge.
  category: sequence
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
