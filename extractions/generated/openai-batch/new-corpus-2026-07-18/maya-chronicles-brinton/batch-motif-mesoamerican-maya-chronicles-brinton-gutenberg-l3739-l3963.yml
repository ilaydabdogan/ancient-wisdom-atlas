  - ev:3
  - ev:6
  confidence: medium
  cautions: The passage presents annalistic political history rather than an explicitly
    mythic departure narrative.
- id: motif:2
  label: Return to former houses after displacement
  taxonomy_refs:
  - return
  basis: The Itza come in search of their houses a second time and later establish
    their houses a second time after losing the road to Chakanputun.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage does not describe a completed heroic return or supernatural
