canonical_text:
  quote: ''
  summary: The passage recounts movements of Spaniards and Maya leaders around Mani
    and other towns; names Francisco de Montejo, Tutul Xiu, Ah Cuat Cocom, Ah Naum
    Pech, and Pech figures; frames the account as a history of conquest, hardship,
    and Christianization; describes the establishment of a holy church and houses
    at Chac Xulub Chen; and records royal and Oidor-authorized measurement of lands
    and forests, boundary marking, the first encomendero, and Santiago as town patron
    and guardian.
  language: Yucatec Maya with Spanish names and ecclesiastical/legal terms
  quote_policy: summarized
