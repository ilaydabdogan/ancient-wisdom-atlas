candidate_motifs:
- id: motif:1
  label: Daily opposition of light and darkness
  taxonomy_refs:
  - duality
  basis: The author explicitly calls the Quetzalcoatl-Tolteca-Tezcatlipoca material
    a mythic conception of the daily struggle of light and darkness.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is the editor's interpretation of the myth in the passage, not a
    full mythic narrative quoted here.
- id: motif:2
  label: Mythic place outside ordinary geography
  taxonomy_refs: []
  basis: The passage says the Tula of Quetzalcoatl is not to be sought in terrestrial
    geography.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage only states the author's negative geographical interpretation;
    it does not provide a detailed sacred geography.
- id: motif:3
  label: Myth mistaken for ancestral history
  taxonomy_refs: []
  basis: The author says writers err by making Toltecs historical ancestors or instructors
    and by mistaking myth for history.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a scholarly interpretive motif rather than a narrative motif enacted
    by characters.
- id: motif:4
  label: Foreign founders and ruling ancestors
  taxonomy_refs:
  - royal_legitimacy
  basis: The 1618 testimony presents lords from Mexico as founders of settlements,
    rulers obeyed in Yucatan, and ancestors of Don Juan Kahuil.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The surrounding author treats related traditions cautiously and distinguishes
    them from secure history.
- id: motif:5
  label: Monumental building attributed to outside rulers or instructors
  taxonomy_refs: []
  basis: Sanchez de Aguilar and the testimony connect monumental buildings at Yucatan
    sites with Aztec or Mexican-origin groups.
  evidence_refs:
  - ev:3
  - ev:9
  confidence: medium
  cautions: The author describes the tradition as vague and rejects broad claims that
    Yucatan civilization came from Toltecs.
- id: motif:6
  label: Genealogical descent from prestigious external royalty
  taxonomy_refs:
  - royal_legitimacy
  basis: The testimony links named settlers to Moctezuma and connects Don Juan Kahuil's
    lineage to Mexican-origin lords.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage records lawsuit testimony, not an independently verified genealogy.
comparison_claims:
- id: claim:1
  claim: The passage states that the Quetzalcoatl myth appears not only in the Maya
    chronicle but also in the Kiche Popol Vuh and the Cakchiquel Memorial de Tecpan
    Atitlan.
  claim_level: same_motif
  target: Kiche Popol Vuh and Cakchiquel Memorial de Tecpan Atitlan
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The passage does not quote the parallel passages; it only reports their
    presence.
- id: claim:2
  claim: The passage interprets the recurrence of the Quetzalcoatl myth in Maya-family
    traditions as indicating long and early intercourse between Maya and Nahuatl-speaking
    groups.
  claim_level: historical_contact
  target: Maya and Nahuatl-speaking traditions
  evidence_refs:
  - ev:2
  counter_evidence_refs:
  - ev:1
  confidence: medium
  limitations: The same passage warns that the myth is valueless as direct history
    and rejects the idea that Yucatan civilization derived from Toltec dispersion.
- id: claim:3
  claim: The 1618 testimony and Sanchez de Aguilar passage both preserve traditions
    connecting Yucatan settlement, lordship, or monument-building with Mexico or the
    Aztec/Mexican sphere.
  claim_level: same_function
  target: Colonial Yucatecan traditions of Mexican-origin rulers and builders
  evidence_refs:
  - ev:3
  - ev:6
  - ev:9
  - ev:10
  counter_evidence_refs:
  - ev:1
  confidence: medium
  limitations: The author frames such traditions as vague or historically problematic;
    the claim is limited to similarity of reported tradition, not factual migration
    history.
