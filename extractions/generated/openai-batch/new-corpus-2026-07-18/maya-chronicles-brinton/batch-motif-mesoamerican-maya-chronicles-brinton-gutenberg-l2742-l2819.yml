canonical_text:
  quote: daily struggle of light and darkness
  summary: The passage argues that the Tula of Quetzalcoatl and the Toltec story should
    be read as myth rather than terrestrial history. It notes that the Quetzalcoatl
    myth appears in Maya-related traditions such as the Kiche Popol Vuh and the Cakchiquel
    Memorial, and treats this as evidence of early Maya-Nahuatl intercourse. It then
    cites colonial Yucatecan accounts and 1618 testimony claiming that people or lords
    from Mexico settled parts of Yucatan, built monuments, ruled local provinces,
    and were ancestors of named persons.
  language: English with quoted Spanish documentary material
  quote_policy: quoted
