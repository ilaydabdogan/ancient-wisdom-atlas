    of the Aztecs, Tarascos and other nations.
  summary: 'The passage explains Maya calendrical reckoning: rotating named years
    yield a 52-year cycle; the Mayas also use a longer vigesimal reckoning with uinal,
    katun, tzuc divisions, and an ahau Katun of 260 years. It describes directional
    placement of years, completion stones for katuns, and scholarly uncertainty over
    whether some sources treated a katun as twenty or twenty-four years.'
