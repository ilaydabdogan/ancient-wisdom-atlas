canonical_text:
  quote: ''
  summary: A colonial Maya chronicle recounts war and Spanish arrival, tribute obligations
    and exemptions, Pech lineage claims before God and the king, the capture and reported
    death of Jeronimo de Aguilar, cessation of town-stone placement, repeated Spanish
    entries into Cuzamil and Chichen Itza, the nickname anona-eaters for Spaniards,
    the conquest of Mexico, the settlement of Merida, submission by local leaders,
    and later procurement of Maya servants with increased tribute.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator says that when war against the Spaniards began, he and his companions
    went to war with his father Ah Macan Pech and Ixkil Y[c]am Pech.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that tribute obligations to Spanish governors began in
    connection with the war, while the narrator claims he and his children do not
    pay tribute.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The narrator says his title and evidence were given by Our Lord God and the
    reigning king, and that he had been willing to deliver himself and his town into
    Spanish hands before seeing the Spaniards.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Spanish foreigners were not seen until Jeronimo de Aguilar
    was captured by natives of Cozumel, after which the country became known because
    it was marched over.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pech leaders and principal men are described as going before the king in Spain;
    the king is said to require tribute and an account and boundary fixing for the
    land.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The land is said to have been discovered by Aguilar, who is also said to have
    been eaten by Ah Naum Ah Pat at Cuzamil in 1517.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A katun ended in 1517, and the former practice of placing town stones at each
    twentieth stone is said to have ceased after the Spaniards came to Cuzamil.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In 1519 Fernando de Cortes and Espoblaco Lara are said to have come to Cuzamil,
    and those able to speak true words arrived there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says the eaters of anonas first arrived at Chichen, and that Chichen
    Itza became known to Don Francisco de Montejo and other Spaniards.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:9
- id: obs:10
  text: In 1521 the territory of Mexico is said to have been taken by the Spaniards,
    and attacks and killings involving towns of Cupul are mentioned.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In 1542 the Spaniards settled Merida permanently; local religious and political
    figures humbled their heads, and tribute began again.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: In 1543 Spaniards went north of the Chels to procure Maya men as servants,
