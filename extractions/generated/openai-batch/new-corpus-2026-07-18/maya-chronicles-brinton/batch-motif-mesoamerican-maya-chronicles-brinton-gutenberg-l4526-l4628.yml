canonical_text:
  quote: The Record of the Katuns by the men of Itza called the Maya Katuns.
  summary: 'A translated Itza record lists successive ahau katuns and attaches events
    to them: expulsions, town destruction, the depopulation of Chichen, a remnant
    founding Zaclactun Mayapan, the fiery destruction of Chakanputun, foreign intruders
    seeking men to eat, depopulation and political loss at Mayapan, named stones being
    taken, pestilence, deaths, the arrival of Spaniards, the beginning of Christianity,
    and later bishops.'
  language: English
  quote_policy: quoted
