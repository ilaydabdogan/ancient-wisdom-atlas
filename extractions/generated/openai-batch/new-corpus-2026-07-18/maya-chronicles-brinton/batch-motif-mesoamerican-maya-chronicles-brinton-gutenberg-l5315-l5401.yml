  summary: The passage records dated events concerning the arrival and authority of
    Spanish clergy, officials, conquistadores, and Maya leaders in Yucatan. It describes
    baptism or water placed on heads, Christian teaching, church and monastery establishment,
    tribute and local governance, acceptance of Christianity by named Maya nobles,
    obedience to God and the Spanish king, cessation of war, and an episode in which
    messengers sent by Ah Naum Pech reach Campeche and see ships with white banners.
  language: Yucatec Maya with Spanish names and phrases
  quote_policy: summarized
