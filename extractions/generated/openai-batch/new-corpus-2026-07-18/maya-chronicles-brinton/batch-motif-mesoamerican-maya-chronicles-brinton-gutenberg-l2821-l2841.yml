canonical_text:
  quote: habian venido de Mejico à poblar esta tierra de Yucatan
  summary: An unnamed witness says he knows Don Juan Kahuil and Doña Maria Quen and
    explains that his knowledge came through Don Juan Camal, former cacique and governor
    of Sisal. The testimony recounts that four relatives or kinsmen came from Mexico
    with followers to populate Yucatan, founding or settling Chichinica, Bacalar,
    the northern coast, and the area toward Cozumel. They became lords of these provinces
    for many years, and one, Tanupolchicbul, was reportedly related to Moctezuma,
    king of Mexico.
  language: Spanish
  quote_policy: quoted
