  summary: The passage is a set of philological and geographical notes on Maya chronicle
    names and terms. It discusses peten as island or bounded province, Holon Chan
    Tepeuh as a first leader or ruler, Chacnouitan and related Peten-area place names,
    the Itzas' remembered return to Peten, a migration arriving in northern Yucatan
    and discovering Chichen Itza already present, the place-name imagery of Ziyan
    Caan as 'birth of the sky,' the naming and religious status of Chichen Itza, the
    term paxi for ruin or depopulation, and competing derivations of Chanputun or
    Champoton.
  language: English with Maya, Spanish, and Nahuatl terms
  quote_policy: summarized
