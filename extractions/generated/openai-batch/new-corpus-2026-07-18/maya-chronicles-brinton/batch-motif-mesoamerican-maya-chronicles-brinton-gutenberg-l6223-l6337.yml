candidate_motifs:
- id: motif:1
  label: shipwrecked foreign arrivals
  taxonomy_refs: []
  basis: The passage identifies Aguilar and companions as shipwrecked in 1511 and
    as the first whites known to Yucatan natives.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is a historical-conquest pattern in a chronicle note, not a mythic
    voyage episode by itself.
- id: motif:2
  label: shipwreck survival and companion consumption
  taxonomy_refs: []
  basis: The editor distinguishes Aguilar, who was not eaten and was later rescued,
    from companions who were eaten by natives; an alternate reading changes the meaning
    to maintenance by Ah Naum.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The key phrase is textually disputed, and the passage itself presents
    competing readings.
- id: motif:3
  label: delegation to a distant monarch with service and tribute
  taxonomy_refs:
  - royal_legitimacy
  basis: The Spanish rendering describes Pech nobles and fifty native great men going
    to or being taken to Spain to serve the reigning monarch, with tribute obligations
    mentioned.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage is a colonial historical report and translation note; the
    royal-legitimacy taxonomy link is functional rather than explicitly mythological.
- id: motif:4
  label: authoritative sacred speech and ritual display
  taxonomy_refs:
  - wisdom
  basis: Catholic priests are glossed as those who speak 'true words,' and religious
    services held by Cortes' expedition are said to have strongly affected the natives
    of Cozumel.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage identifies Christian priests and services historically; it
    does not develop a native mythic doctrine of sacred speech.
- id: motif:5
  label: cyclical calendrical anchoring of historical events
  taxonomy_refs:
  - seasonal_cycle
  basis: The note relates historical years to katun cycles, town-named stones, 13
    Kan, the 11th Ahau, and the 9th Ahau Katun.
  evidence_refs:
  - ev:6
  - ev:12
  confidence: high
  cautions: The pattern is calendrical and historiographic; 'seasonal_cycle' is an
    approximate taxonomy fit because the passage concerns year and katun cycles rather
    than seasons alone.
- id: motif:6
  label: destruction of a great capital as region-wide report
  taxonomy_refs: []
  basis: The destruction of Tenochtitlan is said to have spread as tidings far into
    Yucatan and Central America and to have made a profound impression.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage frames this as historical news, not as divine judgment or
    cosmic destruction.
