canonical_text:
  quote: ''
  summary: Scholarly notes to the Chronicle of Chicxulub discuss translation uncertainties,
    food and heart terms, the 1511 shipwreck of Geronimo de Aguilar, a reported deputation
    of indigenous nobles to Spain, katun and year-count reckoning, Spanish visits
    and Catholic religious services, the destruction of Tenochtitlan, attacks at Cupul,
    the founding of Merida, and references to princely families and towns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note defines kah or pinole as a drink made by mixing roasted maize meal
    with water; tuce or tuze is unidentified, and the passage about these foods is
    called obscure.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note explains puczikal as a term for the heart of humans and animals,
    also mind or soul, desires, and the interior of certain growths.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The year 1511 is identified with the shipwreck of deacon Geronimo de Aguilar
    and his companions, described as the first whites known to the natives of Yucatan.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The note reports a reference to a deputation of fifty natives to Spain, involving
    Ahmacan Pech, Don Pedro Pech, their relatives, descendants, and captains, before
    a reigning monarch.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A translation dispute concerns whether people vomited at a feast or remained
    in obedience as serving-men; tribute obligations are mentioned in the quoted Spanish
    rendering.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Aguilar himself is said not to have been eaten, while some companions were
    eaten by natives; an alternative reading would state that Aguilar discovered the
    land and was maintained by Ah Naum.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The note describes an ancient chronological practice in which the last stone
    in a katun pillar was placed in turn by towns, with each town giving its name
    to the stone and cycle.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that Pech counted katuns as twenty-four years each, with
    1541 as the close of the 11th Ahau.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The two previous visits are identified as probably those of Cordova in 1517
    and Grijalva in 1518; 'those who knew to speak the true words' is glossed as referring
    to Catholic priests.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The note states that historians of Cortes' expedition dwell on the effect
    of religious services on the natives of Cozumel.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The first arrival of Spaniards at Chichen Itza is dated to either late 1526
    or early 1527, while the Maya year is said to begin on July 16.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The destruction of Tenochtitlan is said to have been rapidly reported among
    tribes into Yucatan and Central America and to have made a profound impression.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A quoted translation says the Spaniards were attacked for a third time at
    Cupul and found Ah Ceh Pech dying in an unfinished house with his companion King
    Cen Pot.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The founding of Merida is dated officially to January 6, 1542; Spaniards sucking
    anona or custard-apples is described as strange to the natives.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:15
  text: A translation reading says the captain Cupul was burned, but the editor prefers
    a reading referring to the house of Nacom Cupul and says there is no account of
    a Cupul leader being burned.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: The year 1542 is identified as 13 Kan and as the first year of the 9th Ahau
    Katun, fixing the date by Kin Katun and Ahau Katun methods used by Pech's family.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: Tikom is said still to exist, Popce is not found on maps by the editor, and
