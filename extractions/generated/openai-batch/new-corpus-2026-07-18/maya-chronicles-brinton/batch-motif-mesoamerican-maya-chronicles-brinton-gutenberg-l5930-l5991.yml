canonical_text:
  quote: ''
  summary: A colonial Maya chronicle passage recounts the Spanish conquest and reception,
    the introduction of Christianity, the measuring and possession of towns, forests,
    fields, and boundaries under royal and auditor authority, the construction of
    church and houses, the naming of Pech lineage figures, and the establishment of
    Chac Xulub Chen under Santiago as patron guardian.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator states that he is giving a complete history of the Spaniards'
    passage, the reception of the first fathers, and the names of the first conquerors
    according to a register.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes labor over two or three years in the distribution of
    towns, with people working under trees, branches, and bushes and finding food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Towns and forests were measured by Auditor Tomas Lopez, who held the Cedula
    of the king authorizing forest cutting by settlers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Before the Spaniards arrived to establish Christianity, the people were described
    as natives of official houses, with Naum Pech as governor of all.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the Spaniards arrived in Yucatan, the narrator's group received them
    with a friendly heart; Christianity was introduced, and the group was appointed
    to guard villages before there was a church.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The narrator says he recounts the conquest and the sufferings endured with
    the Spaniards from natives who were unwilling to deliver themselves to God.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The group descended to Chac Xulub Chen; after the Holy Church at Cumtal was
    finished, they measured its sides and took possession so their children would
    remain there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The possession is presented as protection against native obstruction, enchantment
    by throwing stones, and future challenge, with authority attributed to God, the
    lord, and the ruling king.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage lists a prepared church for worship, a public house east of the
    church, a temple of the great king, and a residence.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Don Pablo Pech states that he built his stone house north of the church and
    records named Pech relatives or associates so that natives may not later claim
    the property.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narrator says royal commissions and a license from the ruling king through
    Tomas Lopez authorized measuring forests and uncultivated fields so boundaries
    could be known and maintained by parents and children.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Don Julian Doncel, the first Encomendero at Chac Xulub Chen, ordered chiefs
    to mark forest-land limits; boundaries were measured toward the east, south, and
    west, and Santiago is named as the patron who guards the town.
  category: sequence
  evidence_refs:
  - ev:8
