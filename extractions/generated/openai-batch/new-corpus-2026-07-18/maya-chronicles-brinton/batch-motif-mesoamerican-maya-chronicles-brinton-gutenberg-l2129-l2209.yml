canonical_text:
  quote: ''
  summary: A synopsis of Maya chronology arranged by Great Cycle and Katun lists migrations,
    discoveries and removals among places such as Nonoual, Chacnouitan, Chichen Itza,
    Champoton, Uxmal, and Mayapan; the arrangement of the calendar month Pop; foundations
    and political league activity; wars, plots, burnings, seizures, depopulations,
    destructions, pestilence, smallpox, Spanish arrival, and the death of Ahpula.
  language: English
