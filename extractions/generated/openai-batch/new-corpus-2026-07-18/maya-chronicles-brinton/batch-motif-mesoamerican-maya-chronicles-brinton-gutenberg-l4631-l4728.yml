  summary: Editorial notes explain entries in a Maya katun chronicle, including an
    early displaced group, the Itzamal idol or deity Kinich Kakmo, fire descending
    at midday to consume sacrifice, offerings and priestly replies during sickness
    or famine, princely and local lineages, Itza departures, place-name etymologies,
    naked foreign cannibals possibly identified with Caribs, the taking or setting
    up of a Katun-stone, and the death of Ahpula Napot Xiu.
