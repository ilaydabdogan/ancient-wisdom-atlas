canonical_text:
  quote: ''
  summary: Chronicle entries for 1544-1553 describe Spanish posting, tribute, imprisonment
    and later elevation of a Sisal priest, the introduction of the cross and Christianity,
    war associated with conjurors, destruction of a ship at Ecab, Franciscan settlement
    and teaching, baptism, monastic building, reforms by the auditor Don Thomas Lopez,
    local capture of priest Chuuc, and Don Pablo Pech's retrospective claim that his
    lineage received Spaniards and Christianity and was baptized by Bishop Francisco
    Toral.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In 1544 Spanish Captain Asiesa was posted in Cauaca, and chiefs from Cauaca
    were gathered for tribute consisting of honey, pheasants, and maize.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The priest Caamal/Kamal of Sisal was placed in prison for one year, later
    served as guide to the Spaniards, entered Valladolid as a chief under the name
    Don Juan Caamal de la Cruz, and first introduced the cross in Cauaca.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In 1545 the Spaniards were posted at Valladolid, and Christianity is said
    to have begun with fathers of the order of San Francisco at the port of Champoton,
    proceeding toward Merida and later Cupul.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The passage names several fathers who began Christianity in Yucatan: Fr.
    Juan de la Puerta, Fr. Luis de Villarpando, Fr. Diego de Becal, Fr. Juan de Guerrero,
    and Fr. Merchol de Benavente.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In 1546, after four months of peace, war began when people were gathered for
    a second tribute of wax; conjurors from the west are described as deceiving the
    people and setting the war in order.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The 1546 war account says Spaniards and two sons of Spaniards were killed,
    Surusano was killed by Camal Tipakan, and war occurred in all the towns for a
    day and a night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In 1547 a ship was destroyed by Ex Box at Ecab, after which the Spaniards
    went to make him fear and made war against Box of Ecab, son of Ek Box.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Between 1548 and 1552 the passage reports the arrival of Father Ermitanyo,
    a general reunion of towns at Mani, the baptism of people by Fr. Fernando Guerrero,
    the beginning of a monastery at Valladolid-Sisal, and the teaching and singing
    of mass and vespers at Sisal with organ, flute, and canto llano.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In 1553 Don Thomas Lopez arrived from Castilla as auditor and messenger of
    the king of Castilla, and the passage says he protected local people from being
    burned by Spaniards and bitten by dogs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The auditor introduced the appointment of chiefs in each village by giving
    a baton and adjusted the Spanish tribute of mantles, wax, pheasants, maize, buckets,
    salt, peppers, beans, jars, pots, and vases.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage reports the capture of priest Chuuc by Ah Macan Pech in connection
    with a dispute involving Ah Ceh Pech and Cupul.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Don Pablo Pech states that he set forth the days, months, and years from the
