canonical_text:
  quote: ''
  summary: The passage reports a tradition that Cuculcan came from the west, ruled
    with the Itzas at Chichen Itza, founded and organized Mayapan, governed justly,
    then departed toward Mexico after leaving instructions. Brinton comments that
    the tradition resembles a widespread American hero-myth pattern, cites a Maya
    variant in which Cuculcan rises to heaven and descends annually to Mayapan to
    receive offerings, and discusses possible historical migration and Maya-language
    names.
  language: English
