canonical_text:
  quote: ''
  summary: The passage is a set of dictionary and footnote materials. It includes
    a Motul dictionary gloss for ÇAT; notes on Maya writing, characters, bark books,
    calendars, ceremonies, sacrifices, and prophecy records; reports that only priests
    and some elites understood the characters; a note that friars later learned to
    read and write them; a statement that the books were burned and caused distress;
    and a colonial comment that later Maya readers continued to read ancestral writings
    characterized as sorcery, charms, cures, and spells.
  language: English with Spanish quotations
  quote_policy: summarized
