canonical_text:
  quote: ''
  summary: The passage is a scholarly note on Maya and Nahuatl names connected with
    Tutulxiu, Nonoual, Zuiua, and Tulapan. It argues that several names are Nahuatl
    in origin and are connected with the Quetzalcoatl myth. It summarizes traditions
    about Zuiven as an uppermost heaven and divine birthplace, Tulan Zuiva/Chicomoztoc
    as the Seven Caves origin place, Tula/Tollan as the place of the Sun destroyed
    through Tezcatlipoca’s wiles, Quetzalcoatl’s eastward journey to the home of the
    Sun, and a Nonohual episode in which Tezcatlipoca gives Quetzalcoatl an intoxicating
    drink.
  language: English
  quote_policy: summarized
