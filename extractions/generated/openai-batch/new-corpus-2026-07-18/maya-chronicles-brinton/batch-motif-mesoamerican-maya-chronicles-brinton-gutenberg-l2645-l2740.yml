  text: Tula or Tollan is explained as the place of the Sun, inhabited by the Tolteca,
    servants and messengers of Quetzalcoatl as Light-God and ruler.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: A common tradition says Tula was destroyed by Tezcatlipoca’s wiles; the Toltecs
