canonical_text:
  quote: ''
  summary: The passage recounts Nakuk Pech/Don Pablo Pech’s account of colonial tribute
    distribution, encomienda assignment, Christian baptism and name change, recognition
    of chiefly status and hidalgo descent, receipt and transmission of the rod of
    justicia, lineage-based appointment to govern Chac Xulub Chen, and the arrival
    of Spaniards, priests, chiefs, captains, and ensigns to take possession and gather
    the town.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Adelantado distributed towns to conquerors, a secretary wrote tribute
    lists, Nakuk Pech’s companions and kinsmen paid tribute, and Nakuk Pech was given
    to Don Julian Doncel as chief and began taking tribute for the holy fathers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nakuk Pech states that he served as chief during the administrations of Alvarez,
    Alvara de Carvayor, and Auditor Thomas Lopez, entered water for baptism, received
    the name Don Pablo Pech, and ceased to be called Nakuk Pech.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first chiefs are said to have been created hidalgos by the captains, to
    have first paid tribute to foreigners, and to have received possession from God
    and the ruling king; their descendants are also described as hidalgos.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nakuk Pech says he received the Holy Oils and Holy Faith to teach his subjects
    and was the first to receive the rod of the justicia; he later gave the rod to
    his son Don Pedro Pech in 1552.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Don Pedro Pech states that he received the rod from his father, Nakuk Pech/Don
    Pablo Pech, and Ursula Pech, in Chac Xulub Chen, to serve God and the reigning
    king and govern the town.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Descendants of named Pech and Chel lineages came or returned to towns with
    priests, chiefs, ministers, companions, and rulers; Nakuk Pech says his father
    Ah Kom Pech appointed him to govern Chac Xulub Chen.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When Spaniards came to the towns, the towns were accounted for assignment;
    Nakuk Pech says he first received Chac Xulub Chen when chiefs, captains, priests,
    soldiers, and ensigns came with orders to take possession.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Nakuk Pech says he came by order of the governor to strengthen Chac Xulub
    Chen, that old men had shown no sign the Spaniards would come, and that he and
    his father Don Martin Pech gathered the town after Christianity was received in
    the province.
  category: sequence
  evidence_refs:
  - ev:8
