canonical_text:
  quote: The Mayas had a mathematical turn, and possessed a developed system of numeration.
  summary: The passage discusses Maya linguistic relations with Aztec/Nahuatl and
    then explains the Maya vigesimal numeral system, including number terms, methods
    of counting above forty, Beltran's proposed system, Rosny's analysis, and Juan
    Pio Perez's critique based on native usage.
  language: English
  quote_policy: quoted
