  summary: 'The passage explains Maya numeral particles used in counting classes of
    objects and time, then outlines the Maya calendar: the year begins with the sun’s
    zenith transit, has eighteen twenty-day months plus five extra days, uses named
    days and months, marks four recurring year-bearer days, counts days in thirteen-day
    periods, and reaches a fifty-two-year recurrence of the same year-bearer name
    and number.'
