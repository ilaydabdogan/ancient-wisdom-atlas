    and Caamal is described as still being a family name in Yucatan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The notes enumerate early Franciscan missions to Yucatan: Testera’s mission
    at Champoton, a later group of five friars who returned after two years, a third
    mission under Luis de Villalpando, and five additional missionaries arriving with
    Juan de la Puerta in 1548.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The term ahetzil is treated as uncertain; the editor proposes conjuring or
    sorcery, or possibly dwellers in the sierra, and says the following line is corrupt.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
