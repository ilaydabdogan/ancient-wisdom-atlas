    to agree substantially with Cogolludo’s account.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Auditor Tomas Lopez is said to have come from Guatemala to Yucatan in 1551
    or 1552 and to have promulgated laws for governing the natives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fr. Lorenzo de Bienvenida’s 1548 letter attributes the 1547 uprising to Spanish
