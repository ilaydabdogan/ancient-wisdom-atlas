canonical_text:
  quote: ''
  summary: Editorial notes identify named colonial-era figures, missionary expeditions
    to Yucatan, a 1546 native insurrection, Spanish abuses reported by Fr. Lorenzo
    de Bienvenida, legal action by Auditor Tomas Lopez, place-name explanations for
    Conah Itza and Yocol/Yucalpeten, and a prophecy attributed to the priest Pech
    that is said to appear in several Chilan Balam books and later historical versions.
  language: English with quoted Spanish
  quote_policy: summarized
