  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bienvenida reports that Manso Pacheco was made captain and committed violence
    in Chatemal, including robbery, consuming local provisions, causing flight and
    hunger, killing, mutilation, and drowning women in lagoons with gourds tied to
    their feet.
  category: action
  evidence_refs:
  - ev:6
