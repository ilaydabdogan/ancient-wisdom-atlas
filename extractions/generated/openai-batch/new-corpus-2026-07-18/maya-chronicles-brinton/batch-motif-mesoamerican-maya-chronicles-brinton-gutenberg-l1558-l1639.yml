literal_observations:
- id: obs:1
  text: Father Gabriel de San Buenaventura composed an Arte de la Lengua Maya that
    was printed in Mexico in 1684; few copies are known, and Brasseur later reprinted
    it without desirable fidelity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Father Pedro Beltran is described as the leading authority on Maya grammar,
    a Yucatan native, and an instructor in Maya at the Merida convent around 1740.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Don Juan Pio Perez and Dr. Berendt collected notes toward Maya grammars but
    did not complete such works; the compiler used their notes and other grammatical
    sources for the present study.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first printed Maya dictionary was issued in Mexico City in 1571 under
    Father Luis de Villalpando's name, probably based on his vocabulary because he
    had been dead nearly twenty years.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Don Juan Pio Perez's Diccionario de la Lengua Maya was completed at Merida
    in 1877, contains about 20,000 Maya-Spanish entries, and is praised while also
    being criticized for specific omissions.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Brasseur's Vocabulaire Maya-Francais-Espagnole is described unfavorably, with
    about ten thousand words, doubtful sources, incorrect entries, and unscientific
    derivations and analogies.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'The compiler used three important anonymous manuscript dictionaries obtained
    by Dr. Berendt from former Franciscan convents in Yucatan: San Francisco in Merida,
    Ticul, and Motul.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Ticul dictionary is dated 1690 and has Spanish-Maya and Maya-Spanish parts;
    the San Francisco de Merida dictionary is undated, likely older than Ticul by
    about half a century, and also has two parts prepared by different hands.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Motul dictionary is called the most valuable of the three; a copy was
    found by Brasseur, sold to John Carter Brown, carefully copied by Dr. Berendt
    in 1864, expanded with additions, and used by the compiler.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Motul dictionary's value is said to include rich vocabulary, many construction
    examples, and representation of Maya as spoken when the Spaniards first arrived;
    its anonymous author mentions seeing a comet in 1577.
  category: attribute
  evidence_refs:
  - ev:10
