canonical_text:
  quote: ''
  summary: A 1618 Valladolid record preserves witness statements saying that noble
    founders came from the kingdom of Mexico to Yucatan, divided among Chichen Itza,
    Bacalar, the northern coast, and Cozumel, built monuments, ruled local populations,
    and formed the ancestry of Don Juan Kahuil. A related account attributed to Herrera
    says three brother lords came from the west, ruled peacefully at Chichen Itza,
    built impressive structures, and were later overthrown after one brother disappeared
    and the other two became unchaste and partial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed witness says he learned from his father, formerly an ahkin or native
    priest before baptism, that the named parties came from the kingdom of Mexico
    and established towns in Yucatan.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The migrants are described as warlike, valiant people, prominent people, and
    lords.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: The testimony places some of the founders at Chichen Itza, others at Bacalar,
    others on the northern coast, and another toward Cozumel.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
- id: obs:4
  text: The founders at Chichen Itza are credited with building sumptuous or stately
    edifices there.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The testimony gives kinship links connecting Don Juan Kahuil to named founder-line
    figures and to the Mexican royal line associated with Montezuma or Moctezuma.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
- id: obs:6
  text: One account says Cacalpuc went to found towns on the coast and that Don Juan
    Kahuil proceeds from him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: One account says a Cocom was chosen to rule at Chichen Itza, was obeyed as
    lord, and had Cozumel subject to him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Chichen Itza group is said to have later passed to Zotuta, where they
    were when the conquerors came.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: Don Juan Carnal is cited as saying that four relatives came from Mexico with
    friends and people, founded towns, and governed the provinces for many years.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: Herrera's related account says three brother lords came from the west, gathered
    many people, reigned in peace and justice, and constructed large, beautiful edifices.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Herrera's related account says the three brother lords lived unmarried and
    chaste.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Herrera's related account says one brother went missing; afterward the other
    two became unchaste and partial, the people hated and slew them, scattered abroad,
    and deserted the edifices.
  category: sequence
  evidence_refs:
  - ev:6
