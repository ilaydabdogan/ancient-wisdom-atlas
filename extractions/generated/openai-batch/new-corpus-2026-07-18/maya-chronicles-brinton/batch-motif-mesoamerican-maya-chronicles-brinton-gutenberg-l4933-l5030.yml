canonical_text:
  quote: ''
  summary: The passage is an editorial introduction to the Chronicle of Chac Xulub
    Chen/Chicxulub by Nakuk Pech. It describes the related Chicxulub land documents,
    the missing accompanying map, typical Yucatan town-title maps with a central church
    and boundary landmarks, Nakuk Pech's lineage and baptismal name, the meaning of
    the town name, and later translation/copying history.
  language: English
  quote_policy: summarized
