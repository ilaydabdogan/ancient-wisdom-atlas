canonical_text:
  quote: ''
  summary: 'A Yucatec Maya katun chronicle lists successive Ahau katuns and attaches
    historical notices: the appearance and dispersal of Chichen Itza, occupation and
    conflict involving Chakanputun and Mayapan, hardship and return of the Itza people,
    named deaths, fire or conflagration language, and the arrival of Christian religious
    figures from the east with Spanish-era dates.'
  language: Yucatec Maya with Spanish annotations
  quote_policy: summarized
