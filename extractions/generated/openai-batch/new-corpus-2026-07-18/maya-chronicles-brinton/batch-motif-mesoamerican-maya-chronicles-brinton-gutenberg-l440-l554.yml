canonical_text:
  quote: ''
  summary: Brinton discusses Huastec presence near Panuco as evidence in traditions
    about Maya-family migration and possible remote connection with Aztec ancestors.
    He summarizes an Aztec origin-migration account involving Mexicans, Olmecs, Huastecs,
    Mixtecs, named leaders, arrival by sea, travel to Guatemala and Tamoanchan, the
    invention of pulque by Mayauel, and Huastecatl's drunken shame leading to separation
    and settlement near Panuco. The passage also describes later Aztec-Huastec conflict,
    Spanish treachery against Huastec chiefs, Yucatan's independent provinces at conquest,
    and hereditary rulership and genealogy among provincial chiefs.
  language: English
  quote_policy: summarized
