canonical_text:
  quote: ''
  summary: The Caribs come in force to avenge themselves. The narrator's men meet
    them on the Waiini, while the Waraus refuse to fight but assist as scouts and
    spies, helping draw the Caribs into an ambush. The narrator's side wins. Bohirasiri,
    a famed champion, shoots the Carib chieftain in the face with a three-pronged
    barbed shaft, defeats warriors around him, and drags the chieftain away. The wounded
    chieftain removes the weapon but can no longer fight. After the battle, the victors
    ask what doom Manarwa should receive and whether he should remain alive.
  language: English
  quote_policy: summarized
