canonical_text:
  quote: ''
  summary: The passage describes Christian praise and prayer offered at a grisly chasm,
    school-banners bearing the Lamb and the Dove, the filling of the cutting the next
    day, and the removal of human bones found there. The narrator then seeks an old
    man known for a bright toucan-feather crown. The old man is uneasy about photography,
    partly because the camera seems magical or gun-like. The passage ends with the
    narrator finding Cornelius and other leaders, and noting that old men spoke of
    national wars and legends.
