canonical_text:
  quote: ''
  summary: The passage describes an early harmonious state under a gentle first man,
    the making of a cloud-capped fruit-bearing tree by Makonamia, and a later episode
    in which Ahkoo finds the tree, the first man brings it down, and animals help
    plant around it. Iwarreka the brown monkey neglects work through mischief, is
    sentenced to fetch water from a spring in a basket, and after the tree is cut
    down the master finds swelling waters and fish within. He intends to spread the
    fish into all rivers, while the waters are found to be preparing to run over the
    world.
  language: English
  quote_policy: summarized
