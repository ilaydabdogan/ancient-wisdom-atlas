canonical_text:
  quote: "“My blood will take root, and avengers abound.”"
  summary: A father discovers that fish die wherever his son swims. The fish conspire
    to kill the boy on a log after he leaves the water. Spined fish wound him, and
    a sting-ray’s wound is fatal. As the father carries him through the forest, the
    dying youth says his blood will become strange plants and avengers. The Haiarri
    root is then found; when bruised and washed in pools or small streams, it makes
    fish prey.
  language: English
