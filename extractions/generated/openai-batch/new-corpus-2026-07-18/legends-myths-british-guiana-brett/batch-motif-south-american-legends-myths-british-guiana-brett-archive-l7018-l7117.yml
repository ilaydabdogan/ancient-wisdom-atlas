  summary: A verse section headed "Blood Revenge" introduces vengeance as a hereditary
    cycle. The narrative then describes Wahmoro, a good chieftain, and his unnamed
    brother, who kills men by poison, takes their wives, seeks refuge with Wahmoro,
    secretly proposes to make Wahmoro's daughters his wives, threatens to kill opposing
    kin, and later poisons old Orubu after demanding Orubu's young wife.
