canonical_text:
  quote: "“She fills up the hole ; and, good friends, that is why / We never can get
    a fair peep through the sky !”"
  summary: A Warau legend recounts a descent to the ground from above. All arrive
    safely except a woman who becomes wedged in the hole. Her husband fails to free
    her, others refuse the dangerous task, and she remains blocking the opening, explaining
    why people cannot see through the sky.
  language: English
  quote_policy: quoted
