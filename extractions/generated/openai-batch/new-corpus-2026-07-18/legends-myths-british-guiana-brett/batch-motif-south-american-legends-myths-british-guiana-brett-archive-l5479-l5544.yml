canonical_text:
  quote: "“Manarowa was calm. / Nor limb nor muscle moved he then.”"
  summary: In Demerara, Manarowa appears before white rulers. Young officers arrange,
    with the governor’s consent, to test his nerve by firing a cannon near him without
    warning; although others are startled, he remains unmoved. He returns to his tribe
    loaded with gifts and wearing a gold crescent. Later, after Great Britain suppresses
    the slave-trade, his business is gone. When the governor refuses a Carib slave
    offered as a present, Manarowa kills the young captive and orders that no more
    captives live. After a sale is found in Surinam, Manarowa is dead; smallpox and
    rum consume his clan, and he dies grieving as he sees them die.
  language: English
  quote_policy: quoted
