  summary: A verse passage explains a satirical origin for the white race. It says
    the whites did not spring from the Komaka tree, but rose from wood cast on the
    sea and found land far away. The passage contrasts useful local forest trees with
    the worthless castaway stock of the white man, and frames the tale as mild revenge
    by Indigenous people who suffered pursuit by armed Europeans and hounds.
