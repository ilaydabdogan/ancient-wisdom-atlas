canonical_text:
  quote: ''
  summary: A group refuses to release a woman, saying she deserves punishment because
    she drove away a highly skilled young man who could make useful things, including
    a canoe and woven clothing for the Warau. After the people leave, she sees a small
    opening and escapes through it in frog form. Long afterward, she is said to move
    through the swamps and to be recognized near evening fires by her sad croak, which
    the speakers interpret as grief for her runaway slave.
