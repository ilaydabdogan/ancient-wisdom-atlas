canonical_text:
  quote: ''
  summary: A legend identifies Adaili as the sun, called Arawidi when he came to earth
    in human form. While fishing, he made a dam in a stream, but otters broke it.
    He appointed the woodpecker as guardian. Hearing the woodpecker’s tapping from
    the sky, he descended and found an alligator, whom he seized and struck on the
    head and tail. The alligator begged for life and promised a maiden bride. Water-sprites
    then provided the maiden. The passage ends by explaining that the alligator’s
    head and tail still show marks from Arawidi’s blows.
  language: English
  quote_policy: summarized
