canonical_text:
  quote: ''
  summary: The passage describes Abore as a long-lived maker and sender of goods by
    large ships, explains his continued absence in the white people's land through
    a spirit's claim on him, recounts annual presents formerly received by the Waraus
    and attributed to Abore, and then gives the narrator's explanation that these
    presents were payments for Indian assistance that ended after slavery. The frame
    narrative then describes the old Warau storyteller called McLeod, missionary attempts
    to teach him Christian words, his return to Barima, and a contrast between older
    Warau spirit traditions, haunted Waramuri, and Christian Warau settlement and
    customs.
  language: English
  quote_policy: summarized
