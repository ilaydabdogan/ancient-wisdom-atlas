canonical_text:
  quote: ''
  summary: A verse appendix describes two white men who try to learn the practices
    of piai-men by feigning illness. A famous piai-man is summoned and performs a
    curing rite with implements, a rattle called shok-shok, exclusion of women, sacred
    fire, sacred weed, incantations, tobacco smoke, rubbing, and sucking at the affected
    part. The passage says he would have displayed a nail, thorn, claw, or pin as
    the thing drawn from the patient and attributed to Yauhahu.
  language: English
  quote_policy: summarized
