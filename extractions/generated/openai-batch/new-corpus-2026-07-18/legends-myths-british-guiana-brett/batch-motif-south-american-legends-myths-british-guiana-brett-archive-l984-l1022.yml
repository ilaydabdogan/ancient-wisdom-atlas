  quote: ''
  summary: 'The passage recounts Columbus being warned by an elderly man in Cuba that
    after death the soul has two possible ways: kind-hearted people go to light and
    life, while cruel and unkind people go to dark woe. The narrator then states that
    a similar belief was found among the Arawaks, who are also described as knowing
    one eternal and supreme Lord.'
