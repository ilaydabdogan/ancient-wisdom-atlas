canonical_text:
  quote: ''
  summary: Marerewana continues building a large canoe while nearby people blame and
    mock him. He roofs and thatches it to protect his loved ones from an expected
    storm and flood. Fearing that the flood may carry them into salt water, he receives
    advice from a voice to moor the craft to a nearby great tree. Using bush-ropes,
    he and his people endure the flood and later land near their former home when
    the waters recede.
  language: English
  quote_policy: summarized
