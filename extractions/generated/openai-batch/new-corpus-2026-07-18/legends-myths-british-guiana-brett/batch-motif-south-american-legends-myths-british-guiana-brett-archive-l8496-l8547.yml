    attacking the sun and moon. Humans cry and pray upward for him to stop, and spirits
    of the air come to aid them by driving him away and restoring the moon’s bright
    face. The passage then turns to constellations, naming Serikoai and noting star-lore
    identifications of the Southern Cross, Beta Centauri, and Alpha Centauri as a
    bird, hunter, and torch or second hunter.
