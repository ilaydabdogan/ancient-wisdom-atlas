canonical_text:
  quote: ''
  summary: After being freed from foes, the Caribs hold a feast and revelry. A large
    canoe is brought ashore and filled with paiwari. Warriors and women are described
    with bodily adornments. Women watch and join the dance. Men play drum and flute,
    the flute being described as made from the thigh-bone of a human foe. At length
    all become silent, and the canoe is empty.
  language: English
  quote_policy: summarized
