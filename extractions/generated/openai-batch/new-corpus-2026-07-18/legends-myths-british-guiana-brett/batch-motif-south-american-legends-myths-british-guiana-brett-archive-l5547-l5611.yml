  quote: ''
  summary: The conclusion describes a remnant clan forced to flee by Brazilians after
    receiving Christian teaching, their grief-filled arrival in Georgetown, a youthful
    chief walking with his pastor while wearing an ancestral crescent, Macusis displaced
    from their land, the fate of a Christian teacher, and Caribs on other rivers who
    are courted by missionaries. The passage contrasts Christian teaching and love
    with older weapons and the conquering sword.
