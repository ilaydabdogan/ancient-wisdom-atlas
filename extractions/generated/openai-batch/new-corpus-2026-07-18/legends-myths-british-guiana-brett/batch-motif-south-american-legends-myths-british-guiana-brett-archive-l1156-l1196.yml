  summary: The opening of the legend presents the wise and brave chief Arawanili standing
    mournfully by the ocean shore. Orehu, identified as the Water-Mother, rises from
    the sea and asks him to tell the grief of Kaieri, saying she may be able to bring
    relief from the ocean depths. A note glosses Kaieri as literally meaning “island,”
    identified by the editor as probably one of the Antilles.
