  quote: ''
  summary: An Acawoi narrator recounts that the Creator made beasts and birds, gave
    them laws, one speech, and unity. Man was then made and placed over all to prevent
    oppression; the first man is called Makonaima's son and is described as just and
    kind. Animals disperse into nearby forests before sunrise and return in the cool
    of day to his call, bringing food and paying homage to him as king.
