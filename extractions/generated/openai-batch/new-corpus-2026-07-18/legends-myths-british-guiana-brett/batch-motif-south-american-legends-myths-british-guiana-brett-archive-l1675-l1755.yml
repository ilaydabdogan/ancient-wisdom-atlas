canonical_text:
  quote: ''
  summary: 'The passage summarizes an Arawak tale of the Royal Vultures: a hunter
    captures a royal vulture woman from a sky-country, marries her, is accepted and
    then expelled by her family, survives descent from a dangerous tree with animal
    aid, tries to regain her, leads allied birds against the royal vultures, and is
    killed by his unknowing son. The tale ends with the burning of the royal vultures''
    house and includes episodes explaining the markings or habits of several birds.'
  language: English
  quote_policy: summarized
