canonical_text:
  quote: ''
  summary: In the Legend of the Great Waters, humans again become ungrateful and violent.
    Kanonatu sends a punitive flood, but spares eight men and six women because their
    hearts are true and good, telling them to take bahbi wood so they may float safely.
    Evil water spirits see them pass undrowned. The saved group becomes the source
    of renewed human life on earth. After the waters subside, land, streams, and a
    small lake remain; Kanonatu warns them not to bathe in the lake, and later ancestors
    guard and avoid it.
  language: English
  quote_policy: summarized
