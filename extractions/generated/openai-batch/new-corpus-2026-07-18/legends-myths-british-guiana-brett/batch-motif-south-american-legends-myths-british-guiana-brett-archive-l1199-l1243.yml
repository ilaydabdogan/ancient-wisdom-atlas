  quote: |-
    Grant me some charm, which may withstand,

    And quell the Yauhahu !
  summary: A chieftain laments the dead and the people of his island, who suffer fever
    and pain attributed to Yauhahu and demons' arrows. He asks a lady for a charm
    against Yauhahu. She promises relief from the lady of the sea and tells him to
    plant a branch and raise an ida tree near his hill cottage overlooking the sea.
