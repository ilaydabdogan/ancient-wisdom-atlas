canonical_text:
  quote: Saw daylight beneath him, as well as above!
  summary: The passage introduces the Legend of Okonorote. Okonorote, a Warau archer
    in a high abode above the blue sky, goes in search of a rare, bright-plumaged
    bird whose flesh he wants to eat and whose feathers he wants to wear. After a
    long pursuit he shoots the bird, but both bird and arrow vanish. Searching for
    them, he finds a deep pit and sees far below a landscape of forests, plains, savannahs,
    and flowing rivulets.
  language: English
  quote_policy: quoted
