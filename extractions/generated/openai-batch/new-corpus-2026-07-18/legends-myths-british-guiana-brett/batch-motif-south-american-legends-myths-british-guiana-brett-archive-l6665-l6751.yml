canonical_text:
  quote: ''
  summary: A verse passage describes chiefs attempting to mediate a dispute. Ekahruwa,
    the aggressor, claims without evidence that dreams and secret arts show an old
    man killed his father. The old man's family offers to fight in his defense, but
    the old man forbids others to fight for him, preferring to risk death rather than
    see his people slain. The combatants are set on the green with bows, arrows, and
    clubs. The old man lays aside his club and takes one arrow, while Ekahruwa shoots
    at him; the old man parries or dodges the arrows, and Ekahruwa claims sorcery
    has bent them aside before turning to his club.
  language: English
  quote_policy: summarized
