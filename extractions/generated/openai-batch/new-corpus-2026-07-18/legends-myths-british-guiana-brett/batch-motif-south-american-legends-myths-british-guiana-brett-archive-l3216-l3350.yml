canonical_text:
  quote: ''
  summary: Two Warau maidens swim in clear water. Korobona shakes a charmed wooden
    rod, breaking a charm that had bound a water spirit beneath the wave. The spirit
    rises, releases her sister, and takes Korobona below. Later Korobona becomes a
    mother; her brothers threaten her infant daughter but spare the child after Korobona
    pleads. The lake spirit, called Wahma, is later seen in serpent, human, and mixed
    human-serpent forms. Korobona hears the report and secretly returns to the lake
    to watch and learn the truth.
  language: English
  quote_policy: summarized
