canonical_text:
  quote: ''
  summary: Korobona's small footprints reveal her track to the brothers, who arm themselves
    and pursue her through the woods. She pleads with her mother to hide her. The
    mother shields the child, but the brothers' arrows strike, and they cut the victim
    into pieces. The mother curses them, marks the blood-spread place as Korobona's
    tomb, and links it with future Warau doom. A later section describes a mother
    watching the outcast dead so that birds and beasts do not feed on the remains;
    vultures and wild beasts do not approach. A loving sister brings food, and leaves
    and flowers are laid on the body. The blood-defiled spot remains sweet and fragrant,
    and the serpent child is not touched by the ordinary change that awaits all people.
  language: English
  quote_policy: summarized
