canonical_text:
  quote: '"Fire shall sweep the land!"'
  summary: A divine Maker, angered by bloodshed, shame, and evil on earth, sends a
    destructive fire. A warning comes from heaven. A chieftain who hears it leads
    a small band to a sand reef, orders a deep shelter made for wives and children,
    and has the surrounding vegetation cut and burned. When the flames arrive, the
    already burned clearing stops them and they go out.
  language: English
