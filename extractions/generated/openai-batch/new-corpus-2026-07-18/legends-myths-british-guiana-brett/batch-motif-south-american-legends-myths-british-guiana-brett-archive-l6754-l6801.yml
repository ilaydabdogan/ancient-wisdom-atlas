  quote: ''
  summary: Ekahruwa advances against an old man but hesitates when he sees a sting-ray
    spine fixed on the opposing reed and the old man's steady gaze. Ekahruwa shifts
    ground, feints, circles, retreats, and then charges again after declaring that
    death will come to one or both. An arrow is released, a shriek is heard, and the
    strong man falls dead. A note says arrows pointed with sting-ray spines are believed
    by the natives to cause exceptional agony and fear, increased by superstition.
