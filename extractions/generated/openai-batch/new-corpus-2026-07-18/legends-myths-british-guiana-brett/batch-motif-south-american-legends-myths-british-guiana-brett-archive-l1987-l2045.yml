canonical_text:
  quote: ''
  summary: 'A verse retelling describes Caribs from the Essequibo coming annually
    to Bowruma and harrying its people. The Bowruma ancestors appoint a war chief,
    who organizes a defensive plan: a forest site is cleared, felled trees are arranged
    in a circle with branches outward, and a strong house is built in the middle.
    The people prepare weapons, arrows, and bucklers, gather at the house as a citadel,
    leave canoes by the river as bait, and use watchmen to lure the Caribs through
    the bush until they see the house. A footnote remarks on bucklers among Arawaks
    encountered near Columbus’s fleet and says the narrator has heard no other aboriginal
    legend mentioning bucklers.'
  language: English
  quote_policy: summarized
