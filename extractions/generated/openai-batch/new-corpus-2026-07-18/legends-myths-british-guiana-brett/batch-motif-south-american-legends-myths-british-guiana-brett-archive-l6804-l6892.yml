  text: An unnamed man is shot through the breast, groans, and dies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dead man's brother speaks over the corpse and says he wants to clear an
    old man's name, even though doing so blames his brother.
  category: speech
  evidence_refs:
