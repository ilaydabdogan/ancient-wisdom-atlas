- id: obs:3
  text: The speaker says he knows how his father died, had tried to restrain the growing
    trouble, and still came to fight because the dead man was his brother.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker states that his brother caused the deaths of ten Puruni men, while
    the Puruni killed nine of his brother's men and have now seen the brother himself
    fall.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker concludes that the deaths are equal, asks that remaining wrongs
    be entrusted to the chieftains, says he will bear away his brother's corpse, and
    calls for peace between the sides.
  category: speech
  evidence_refs:
  - ev:3
