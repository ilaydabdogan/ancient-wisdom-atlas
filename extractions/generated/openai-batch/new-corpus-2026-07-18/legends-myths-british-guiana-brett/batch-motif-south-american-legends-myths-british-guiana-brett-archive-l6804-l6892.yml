canonical_text:
  quote: Peace be between us from this day!
  summary: A man is killed in battle. His brother addresses the assembled chieftains
    and Puruni men, argues that the deaths on both sides have become equal, takes
    away the corpse, and declares peace. The later section recounts renewed blood-feuds,
    migration northward to avoid killing kin, settlement near Demerara Fall with Arawak
    help, and continuing violence by bad men.
  language: English
  quote_policy: quoted
