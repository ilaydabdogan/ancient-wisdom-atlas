canonical_text:
  quote: ''
  summary: Korobona waits beneath trees and is recaptured by an unnamed male in serpent
    form. Later she lives alone in the woods and hides a newborn boy who shares part
    of his father's form. A passerby reveals the infant's cry to her four brothers,
    who drag Korobona home and pierce the child with an arrow. They believe the child
    is dead, but Korobona's care revives him. He grows unusually in wisdom and size,
    remains hidden in a thick tree, and receives food and conversation from his mother.
  language: English
