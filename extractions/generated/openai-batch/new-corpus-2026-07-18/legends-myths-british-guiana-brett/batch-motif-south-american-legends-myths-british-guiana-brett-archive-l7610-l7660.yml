canonical_text:
  quote: Why his children are separate from us this day.
  summary: After a frog-hunt, young men call for Bahmoo to swim back, but he refuses
    because he fears ridicule and the frog. He remains on the other side. Elders explain
    this as the reason his children are separate from the speaker's people. A dialogue
    speculates that a woman who loved him may have crossed to him in a woodskin. The
    passage ends with a moral warning against boastfulness and a note on the performed
    frog chorus.
  language: English
