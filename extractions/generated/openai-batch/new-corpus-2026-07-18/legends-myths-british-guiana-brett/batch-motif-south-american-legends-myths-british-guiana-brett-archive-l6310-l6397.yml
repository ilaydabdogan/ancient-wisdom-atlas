canonical_text:
  quote: ''
  summary: In a siege episode, an unnamed speaker tells the women to wait for a signal
    and flee silently through a tunnel and forest while a small defending band resists
    the Caribs. The Caribs attack the fortified enclosure, suffer losses from wourali-tipped
    arrows, and then set the structure aflame with flaming arrows. When they break
    in, they find no victims or bodies because the defenders have escaped through
    the floor toward Puriini's shore; the attackers call the event sorcery.
  language: English
  quote_policy: summarized
