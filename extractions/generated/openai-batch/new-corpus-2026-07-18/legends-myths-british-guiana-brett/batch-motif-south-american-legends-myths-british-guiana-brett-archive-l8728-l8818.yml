  quote: ''
  summary: A bird carries news to Serikoai's mother that he is wounded and left to
    die. The elderly mother hurries through the bush to him, and a kind spirit, seeing
    their love, aids his healing with balsams and charms. Later, the maimed Serikoai
    searches for his false wife, who has gone after maiming him; rain has erased her
    tracks, but avocado pear shoots lead him onward.
