canonical_text:
  quote: ''
  summary: A leader covers a fountain in a hollow stump with an inverted basket, restraining
    the water. Iwarreka, shirking work and believing hidden fruit is beneath the basket,
    raises it, releasing a flood that carries him away. The other animals appeal to
    O-man, who leads them to a tall hill with rocks, cocorite trees, and a high cave
    for refuge. Rain, lightning, thunder, and darkness continue for several nights.
    The man drops cocorite seeds to gauge the water level by the sound of splashes;
    when the water recedes, the group eats palm-fruits and welcomes dawn.
  language: English
  quote_policy: summarized
