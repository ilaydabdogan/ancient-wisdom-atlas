canonical_text:
  quote: ''
  summary: A verse retelling describes an old man in a village above a great waterfall
    who becomes helpless from age, partial blindness, and insects in his feet. Community
    members stop caring for him; head men order him placed with his property in a
    wood-skin and sent downriver toward the spirit-land. The vessel goes over the
    fall. The passage reports that some Indians say a kindly power transformed the
    man, wood-skin, and freight into stones; rocks identified as the wood-skin and
    package are said to be visible at the fall, while the old man's presence is uncertain.
  language: English
  quote_policy: summarized
