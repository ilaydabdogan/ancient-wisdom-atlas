  quote: ''
  summary: 'After a preservation from rising waters, the man, beasts, and birds experience
    several mishaps that explain bodily traits of their descendants: the howling monkey’s
    enlarged throat, the trumpeter bird’s thin legs, the marudi’s fiery throat, and
    the alligator’s lost tongue.'
  language: English
  quote_policy: summarized
