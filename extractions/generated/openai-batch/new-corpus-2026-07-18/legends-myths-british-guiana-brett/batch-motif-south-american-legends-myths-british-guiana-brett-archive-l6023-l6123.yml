canonical_text:
  quote: ''
  summary: The passage explains that a reptile deprived of its tongue thereafter made
    war on other creatures. Birds and beasts abandon their mild guardian, become wild,
    and retain bodily or behavioral marks of earlier events. After suffering from
    beasts of prey and hunters, the creatures wish for their guardian again. A good
    man, hated and threatened by bad men despite sending them bread when hungry, ascends
    an immense cliff with a faithful few, leaves evil men below, and becomes unreachable;
    the cliff is compared cautiously to high Roriima's wall.
  language: English
  quote_policy: summarized
