canonical_text:
  quote: ''
  summary: A human-born man joins a mystic dance, woos an elfin or Demaredu maiden,
    and is challenged by her father to share the family home beneath the earth or
    water. He accepts, and the Demarena are said to descend from the union. Notes
    connect family names to female descent and marriage rules. A linked Korobohana
    legend says they came from above the clouds by rope; when the rope broke, those
    left above were given wings and plumage by the Great Spirit and became Koriouka
    parrots living in trees near their ground-dwelling brethren.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man described as of human birth sees the sons and daughters of the earth
    advancing in troops, joins their mystic dance, dances beside an elfin maiden,
    and woos her as a fairy bride.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maiden's father says no man has been brave enough to share their home
    deep in the earth or beneath the shining wave, and asks whether the young man
    dares.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man replies that he dares to go with the Demaredu bride.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief accepts the young man's answer and says that only one who is fond
    and brave may join the family beneath earth or wave and receive a Demaredu bride.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A note states that the existing Demarena, identified as an Arawak family,
    are supposed to have sprung from the union and to bear their mother's family name.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The same note states that ancient Demarena practice was to intermarry solely
    with the father's family, the Korobohana.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Another note states that the Ebesoana, an Arawak family, take their name from
    Ebesotu, heroine of the preceding legend, and that family names descend in the
    female line with marriage forbidden within the same family name.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Korobohana are said to have a legend that they originally came from above
    the clouds.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Korobohana legend, the weight of a heavy woman breaks the rope by which
    the people were descending, cutting off communication between those on the ground
    and those remaining above.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Great Spirit pities those remaining above, supplies them with wings and
    plumage, and they descend to live in trees near their brethren while changed into
    Koriouka parrots.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narrator states that the Korobohana legend is another example of a Guiana
    aboriginal belief in descent from a higher region or state of existence.
  category: other
  evidence_refs:
  - ev:7
