canonical_text:
  quote: ''
  summary: 'The passage recounts a war on the Orinoco: Carib forces reach the Caroni
    and are joined by men from several named places. They intend to fight the Cabré
    people and avenge their dead. After scattered fighting, the Cabré clans unite
    under one leader and defeat the Caribs. Most Caribs are slain, many drown, and
    only one survivor, or in a note two according to some Caribs, remains to tell
    what happened afterward.'
