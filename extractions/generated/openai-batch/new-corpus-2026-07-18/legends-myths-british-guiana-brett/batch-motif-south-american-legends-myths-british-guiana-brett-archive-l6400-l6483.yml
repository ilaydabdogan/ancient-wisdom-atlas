canonical_text:
  quote: ''
  summary: 'After a battle, chiefs bury many dead and tell their warriors that the
    losses are severe, with no wounded surviving and even scratches proving fatal.
    Pursuers later find blackened ruins and new graves filled with Carib dead, and
    the remembered saying is that the house was burned and the people fled. The passage
    then opens a civil-strife episode: after keeping away a foreign foe, the people
    suffer an internal evil traced to one man''s hatred and self-will. On the Puruni,
    a loved man called Kod/Koe hosts an old chiefly friend from Masaruni; the guest
    falls sick and dies. The guest''s two younger sons return to Masaruni and tell
    their elder brother, who angrily accuses Koe of killing their father by poison
    or charm and vows vengeance, while the younger brothers plead that Koe is not
    to blame.'
  language: English
  quote_policy: summarized
