canonical_text:
  quote: ''
  summary: Women invoke Walyarima as a signal of emancipation from their husbands.
    Three men observe and report this to the chief To-eyborori. The chief orders the
    women to make cassava bread, arranges an ambush at the stream, and has bathers
    call Walyarima. Walyarima comes and is killed by the chief and other men. His
    remains are hung in the women's shed as a taunt. To-eyza enters last, blood falls
    on her hand, and she remains composed. The chief orders the women to bake bread
    for a five-day hunt, and To-eyza agrees. A footnote explains that Walyarima is
    the animal form assumed by a lover while swimming the river, and that To-eyborori
    and To-eyza are authority titles.
  language: English
  quote_policy: summarized
