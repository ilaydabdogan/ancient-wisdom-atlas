canonical_text:
  quote: ''
  summary: To-eyza urges women toward revenge and freedom. After the chieftain and
    men return from hunting and feast, the women serve their husbands calabashes of
    drink, following To-eyza's command. Cassava juice in the drink kills the warriors.
    To-eyza declares the women free from husbands' rule, and a female band later moves
    through the woods carrying hammocks, food, and weapons toward a distant land.
  language: English
  quote_policy: summarized
