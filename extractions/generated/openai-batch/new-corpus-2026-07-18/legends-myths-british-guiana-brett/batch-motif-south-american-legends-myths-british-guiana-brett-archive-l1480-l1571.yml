canonical_text:
  quote: ''
  summary: The passage concludes a comic verse account of a healing operation in which
    a practitioner sucks and bites a patient's flesh, urges another operation, and
    is paid after the patient's companion claims a cure. The narrator comments on
    healing practices involving rattle noise, shouting, tobacco fumes, fire smoke,
    and a probationary ritual specialist who is confined, half-starved, drinks strong
    tobacco decoction, enters a trance, and revives. A moral warns against such practitioners.
    The fragment titled “Arawidi” describes women preparing strong drink, crowned
    men with bright feathers dancing around a house, learned sorcerers chanting ancient
    lore, and a responsive chorus. A footnote describes the Arawak Maquarri dance
    as a funerary game involving reciprocal whipping in memory of a deceased male
    relative or friend.
  language: English
  quote_policy: summarized
