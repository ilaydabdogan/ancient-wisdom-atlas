canonical_text:
  quote: But they tear on with all their strength, and strike the sunken wood.
  summary: A chief prepares a submerged log barrier and assigns men to arm themselves,
    warn nearby people, and scout. Carib warriors arrive by canoe, find villages abandoned,
    pursue a small fishing canoe, enter a narrow stream, strike the hidden obstruction,
    and are attacked with arrows while other canoes follow into the fight.
  language: English
  quote_policy: quoted
