canonical_text:
  quote: ''
  summary: The passage recounts a flood in which a speaking stone announces that unfaithfulness
    has brought death, most people are overwhelmed, and only a few survive by a palm
    tree. A footnote adds an episode of a sky-reaching palm, a woman petrified while
    climbing, and others transformed into rocks. The passage then frames an evening-fire
    explanation of ancient rock figures near the Orinoco and introduces Amalivaca,
    a figure of Tamanac mythology, who arrives by canoe as the deluge subsides, carves
    high rock sculptures, teaches people to carve, and with his brother smooths the
    rugged land.
  language: English
  quote_policy: summarized
