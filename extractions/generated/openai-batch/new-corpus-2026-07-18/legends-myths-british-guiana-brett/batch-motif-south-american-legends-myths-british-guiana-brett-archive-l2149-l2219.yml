canonical_text:
  quote: ''
  summary: The passage includes a threatening song about taking lives, daughters,
    and goods, then frames the legend of the fight on the Haimara-Cabura as told by
    an old man and his son. It recounts Carib oppression of the Waraus, annual river
    raids using captive women as paddlers, the Waraus' flight to ita swamps, the Caribs'
    plan to plunder farther inland, the failure of large war canoes to pass through
    low water, and a chief's preparation of a hill refuge while men prepare to meet
    the foes by the river.
  language: English
  quote_policy: summarized
