canonical_text:
  quote: ''
  summary: The excerpt closes a verse section in which girls are to be reared joyfully
    as successors, and descendants continue to observe laws and tell the tale of Walyarima
    among the mountains of Parima. A new section begins, naming Old Tounawai as a
    dire Kanâima tiger, lurking with fire-like eyes. Prose commentary discusses armed
    defensive groups, reports of Amazons, the legend’s references to husband-murder
    and rejection of marital authority, and later legends about scarcity of wives
    after a supposed exodus. A footnote explains colonial and Indigenous names for
    the jaguar or so-called tiger.
  language: English
  quote_policy: summarized
