canonical_text:
  quote: ''
  summary: In the opening of the Legend of Serikoai, Wawaiya, newly married to Serikoai,
    repeatedly meets a speaking young tapir named Wailya. Wailya says he is in a changed
    form, lures her with speech, proposes that she flee with him to his distant country
    where earth meets sky, and charms her axe so it will speak to her. Later, when
    Serikoai asks Wawaiya to go with him to gather fruit, she takes the axe, and while
    sharpening it hears the word “Sahtai” in a threatening tone.
  language: English
