canonical_text:
  quote: ''
  summary: Abore experiments with canoe forms, using a gourd, a seed-pod model, and
    wax. His mistress breaks the wax craft. Determined to flee by sea with a young
    cousin called brother, Abore prepares hidden equipment, fears Wowtah's evil eye,
    and traps her in a hollow tree by baiting her with honey and wedging her inside.
    He warns his companion not to look back, launches, instructs the Waraus to make
    wooden vessels in the shape he has shown, and leaves Warau land. Wowtah later
    moans inside the tree and is heard by passers-by.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Abore first considers a floating half-gourd unsuitable as a boat and uses
    an oblong seed-pod as a model before forming a large wax vessel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wax vessel is described as having the shape called "woibaka" by the people
    and "canoe" by others.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the waterside, Abore's mistress sees the frail craft, breaks it, and scatters
    the wax.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Abore remains determined to go, though by wax canoe, and asks a young cousin
    called brother to help him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Abore says that he and his brother will brave the salt sea, that he fears
    staying lest she bewitch him, and that they will work in the bush unseen by Waraus.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The preparations include cutting wood, making paddles or strengthening the
    wax, providing food, providing gourds to hold water, and hiding the equipment.
  category: sequence
  evidence_refs:
