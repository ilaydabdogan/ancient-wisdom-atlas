- id: obs:7
  text: Abore thinks that if Wowtah sees the flight, she will stop him with her evil
    eye.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Abore takes Wowtah to see honey in the heart of a hollow tree and uses a prepared
    wedge to keep her there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Abore warns his brother that looking back is spying and may cause them to
    be fixed by the power of the evil eye.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Abore calls to the Waraus and tells them to observe the vessel shape and make
    their woibakas in that form, but of wood.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Abore leaves the strand of Warau land while men and women stand on the sand
    watching; the passage says they saw him no more.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After Abore has gone, Wowtah is alone in the hollow tree, moans loudly, and
