  summary: Front matter and preface identify the work as a collection edited by William
    Henry Brett. The preface states that the work aims to preserve serious religious,
    mythological, and historical traditions of four aboriginal races near the shores
    of Guiana; describes earlier publication and later research; explains the use
    of metrical form as related to chanted native recitation; notes that head-men,
    mostly sorcerers, guarded and recited such traditions; and distinguishes serious
    traditions from fanciful legends told for amusement over evening fires.
