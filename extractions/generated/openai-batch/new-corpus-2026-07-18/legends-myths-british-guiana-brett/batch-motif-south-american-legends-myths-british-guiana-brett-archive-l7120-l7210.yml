canonical_text:
  quote: ''
  summary: A dying old man orders Wahmoro and the chieftain's son to avenge him with
    a bow, spear-headed shaft, and club. The murderer recognizes the weapons, accepts
    his doom, and threatens that he too will have avengers. He is killed after his
    household and sons attempt to defend him. Neighbours urge the chief to kill all
    of the murderer's offspring, but the chief refuses slaughter and sends the mothers
    and sons away. Years later, an impostor claims to show the Lord or Christ; Wahmoro's
    family and tribe go to see, return disappointed to Barahma, and still yearn after
    God. A footnote relates this to an 1845 movement of Acawoios and Caribs near the
    Cato River and describes a forged commission given to Capui.
  language: English
  quote_policy: summarized
