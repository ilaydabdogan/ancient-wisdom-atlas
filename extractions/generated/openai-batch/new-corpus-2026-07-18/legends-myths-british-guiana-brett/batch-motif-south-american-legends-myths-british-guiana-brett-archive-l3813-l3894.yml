canonical_text:
  quote: ''
  summary: A good spirit tells the young man not to kill Wowtah and says he remains
    enslaved by her charm unless he can escape over the wide sea. He returns with
    honey, later repeatedly fails to flee, tries unsuccessfully to kill Wowtah with
    a falling cocorite palm, then considers how to cross the sea but rejects known
    logs and rafts as inadequate for the waves.
  language: English
  quote_policy: summarized
