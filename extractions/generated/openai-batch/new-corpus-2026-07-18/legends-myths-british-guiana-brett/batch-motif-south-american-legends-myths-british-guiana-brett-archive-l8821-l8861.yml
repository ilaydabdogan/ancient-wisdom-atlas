  quote: ''
  summary: A man pursuing his bewitched wife recalls that she ate pears whose seeds
    sprouted after rain. He travels toward the rising sun, thinks he is nearing earth's
    limit and the sky, finds his wife's and a tapir's footprints, sees them walking
    together, then shoots Wailya through the heart before Wailya can change form and
    cuts off his head.
