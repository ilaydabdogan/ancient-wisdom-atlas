canonical_text:
  quote: ''
  summary: A Carib chief, Manarowa, seeks power and tribute, plans to attack the Taruma
    by hauling canoes over dangerous Essequibo cataracts, and pursues them until they
    disappear beneath the tide and are described as an amphibious race hiding in underwater
    caverns. The account then says the tale became a legend, that a later white explorer
    crossed the falls and named the highest Mandrowa, and that under British rule
    Manarowa visited the governor, restrained Caribs from renewed fighting, and was
    called the Caribisi King.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Manarowa is described as leaving his Essequibo home to gain power and fame;
    surrounding tribes fear him, acknowledge his sway, and pay slaves as tribute,
    except for the Taruma.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Manarowa plans to reach the Taruma by ascending the Rewa and hauling light
    canoes over cataracts that had blocked passage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Manarowa and his men scale one fall, carry their craft over it, then cut a
    forest pathway and drag vessels around a greater fall.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After passing the mouth of the Cuyuwine, the Caribs see Taruma woodskins;
    the Tarumas sink beneath the tide while Caribs line the rocky shores.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Manarowa calls the Taruma an amphibious race and says they hide themselves
    and their woodskins in deep caverns beneath the tide.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The account says Manarowa abandons that river, leads his men by land, and
    returns homeward with captives for sale to the Dutch.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The tale is said to have become a legend of an amphibious race and of a path
    no mortal man before, or after, dared to trace; after nearly one hundred years
    a white explorer crosses the falls and names the highest one Mandrowa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Under British rule, Manarowa visits the British governor with red-coated soldiery,
    fife, drum, and Carib attendants wearing feathered crowns, red paint, cotton scarves,
    and tassels.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: A reported account says Arawaks and Caribisce were preparing to break the
