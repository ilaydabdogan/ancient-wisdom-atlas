canonical_text:
  quote: ''
  summary: A speaker describes a Waramuri shell mound discovered during land-clearing.
    Excavation reveals fish-shells, animal bones, stones, broken axe-heads, implements,
    and human bones, including skull fragments and split long bones. Other similar
    mounds are found with the aid of local Indians. The passage says the history is
    unknown but interprets the bones as evidence of cannibal habits. Later, after
    white friends leave, Indians remain, and a procession goes to the shell-mound
    for evensong, led by schoolchildren with banners and followed by teachers and
    old people.
  language: English
  quote_policy: summarized
