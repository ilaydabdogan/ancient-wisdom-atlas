canonical_text:
  quote: From on high mankind descended ;
  summary: After a feast, elders recount ancient themes. In the first account, mankind
    descends from on high to cleanse the world, but the clouds that bore them recede
    and they cannot return to the sky. Hungry, they try unsuccessfully to bake clay
    with fire. Tamosi provides wild fruits and animals guide humans to fruit trees.
    In the following account, Tamosi, the unseen Mighty Maker, creates an unmatched
    tree bearing many fruits and cultivated plants.
  language: English
  quote_policy: quoted
