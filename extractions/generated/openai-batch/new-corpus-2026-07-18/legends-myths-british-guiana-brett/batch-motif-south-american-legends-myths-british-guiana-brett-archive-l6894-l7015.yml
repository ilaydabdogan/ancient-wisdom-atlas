canonical_text:
  quote: ''
  summary: A verse passage describes Kanaima votaries who leave family and friends
    under a deadly vow, secretly track and kill a victim, poison the victim's mouth,
    and must complete a post-burial blood rite to end Kanaima's spell. It gives anecdotal
    examples of a murderer encountered on the water, jaguar-changing ascribed by sorcerers,
    a comparison to a were-wolf, and a wounded man rescued by Christian Indians who
    remains under Kanaima and vows further killing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Votaries of dread Kanaima/Kandima are described as secretly tracking victims
    from the base of high Roraima/Rordima toward the eastern sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person taking the deadly vow must leave family and friends, forsake wife
    and children, and kill a real or imagined foe without discharge from the vow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the victim flees to another place, the assassin follows, hides, waits,
    and strikes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the victim is lying low, the assassin places poison in the victim's
    mouth, leaving a swollen tongue as a sign that conceals the perpetrator.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After burial, the destroyer remains bound by Kanaima's spell until he pierces
    the grave with pointed wood and tastes blood.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The blood rite is presented as an offering that appeases Kanaima/Kandima,
    after which the harmful influence ceases and the votary returns to live with other
    people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: An anecdotal murderer, recently fresh from killing, passed the narrator's
    party on the water while returning home with a feathered crown and red spots on
    his skin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A footnote says that the murderer had followed his victim and companions from
    near Roraima to Georgetown and back, killing the victim on the return journey.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sorcerers are said to declare that red spots show the killer can range nightly
