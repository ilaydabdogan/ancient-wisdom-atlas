canonical_text:
  quote: ''
  summary: Humans and birds combine to kill an immense water serpent. A cormorant
    chief wounds it underwater with a tethered arrow, allowing the warriors to haul
    it out and skin it. The cormorant claims the promised skin, and the birds carry
    it away. They share the brilliant patterned skin, and birds acquire new colors,
    including parrots in red and green.
  language: English
  quote_policy: summarized
