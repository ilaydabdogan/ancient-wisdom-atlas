canonical_text:
  quote: ''
  summary: A young man hunting alone wounds a monster called Kaniima with an arrow,
    and later finds the splintered arrow-head. The next day his father returns in
    pain, and the son removes a bone from his father's mouth that fits the broken
    arrow-head. The son accuses his father of trying to kill him with the dread Kandima
    charm in order to gain the son's wife, and says they will leave him.
