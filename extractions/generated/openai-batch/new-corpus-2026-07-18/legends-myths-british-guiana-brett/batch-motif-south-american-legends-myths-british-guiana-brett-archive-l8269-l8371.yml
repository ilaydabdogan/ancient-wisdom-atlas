canonical_text:
  quote: ''
  summary: Verse passage about women under the leadership of To-eyza who form a self-described
    “Woman's nation,” reject husbands as enemies, accept women and daughters while
    excluding sons, resist pursuit by men, and establish a western settlement. To-eyza’s
    rules allow visiting male lovers but forbid men to settle and require boys born
    among them to be sent away. A footnote compares this point with older legends
    reported to Raleigh and others and notes a variant in which male infants are killed
    and fathers warned away.
  language: English
  quote_policy: summarized
