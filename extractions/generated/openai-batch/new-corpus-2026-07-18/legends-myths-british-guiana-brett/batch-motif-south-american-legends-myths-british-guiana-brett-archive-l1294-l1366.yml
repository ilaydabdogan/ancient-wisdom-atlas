canonical_text:
  quote: ''
  summary: The passage says Arawanili owed unmatched power to a female sea-associated
    spirit whose love bestowed gifts and who taught him. Orehu men are said still
    to see her in water, while Arawanili rests high above. The narrator compares this
    instruction to Numa and Egeria. An old man, speaking as one of the sorcerers,
    says they had received this word before hearing Christian teaching about the Father.
    The passage contrasts a distant creator God with demons thought to cause sickness,
    then urges teaching the Saviour's word so that people seek demons no more.
  language: English
  quote_policy: summarized
