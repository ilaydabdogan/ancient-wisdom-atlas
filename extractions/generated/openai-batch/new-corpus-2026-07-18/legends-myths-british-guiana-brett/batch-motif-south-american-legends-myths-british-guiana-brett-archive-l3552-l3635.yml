canonical_text:
  quote: ''
  summary: A flower-bedecked heap begins to move with life, and a mother hears that
    her son will avenge his murder. A fully armed warrior emerges and is identified
    as the first Carib, sprung from Wahma. He defeats Warau warriors, takes Warau
    daughters as wives and goods as plunder, and his descendants increase and take
    the Warau's place. The speaker says the Warau came from the heavens to earth and
    were later driven into swamps. A new section begins by saying that dying Waraus
    instructed their children to place weapons at their side.
  language: English
  quote_policy: summarized
