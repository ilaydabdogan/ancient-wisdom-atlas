canonical_text:
  quote: ''
  summary: In the opening of the legend of Abore, Wowtah sends the youth to gather
    wild honey. In the forest, a young maid who is also a spirit reveals that Wowtah,
    called Wowtali in the revelation, is a spirit who deceived Abore's parents, raised
    him through charms, can take animal or human forms, and intends to make him her
    bridegroom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman named Wowtah chides Abore and tells him to go hunt for wild bees while
    daylight remains.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wowtah is described as a handsome dame who reared Abore from childhood.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Abore is described as clever and brave, and as interested in improving bows,
    arrows, and other inventions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wowtah is jealous that Abore might love his works more than her, and she sends
    him into the forest for bees day by day.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Abore has attempted resistance, but Wowtah's glance compels him to obey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: While walking through the gloomy forest, Abore sees a young Indian maid sitting
    on the root of a tree.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The maid addresses Abore by name, says she knew his parents, and asks what
    he can see in a huge hollow tree where serpents and scorpions may hide.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Abore says he searches old trees for wild bee nests so that he may please
    his kinswoman with honey.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The maid says that Wowtali is a spirit and that she herself is also a spirit.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The maid says spirits can assume any figure, including bush-hogs, jaguars,
    dogs, and large snakes; she says Wowtali chose to be the great queen of the frogs.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The maid says Wowtali took woman form, deceived Abore's parents, and was received
    into their cottage.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The maid says Abore's parents soon died, that no mortal knew how, and that
    Wowtali was suspected by every Warau.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The maid says Abore grew from an infant into a tall youth through Wowtali's
    charms, rarely left Wowtali's side except to fetch honey, and would soon have
    to make her his bride.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Abore considers the tale plausible because Wowtali croaks with delight at
    honey and upon him.
  category: action
  evidence_refs:
  - ev:8
