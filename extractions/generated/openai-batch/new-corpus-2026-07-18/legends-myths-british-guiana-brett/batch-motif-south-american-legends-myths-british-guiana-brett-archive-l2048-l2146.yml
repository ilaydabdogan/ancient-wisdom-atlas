canonical_text:
  quote: ''
  summary: A battle narrative describes Arawak/Lokono defenders resisting Carib/Carinyach
    attackers at a barricaded place on the Pomeroon or Bowruma. The Arawak captain
    exhorts his fighters to defend their families and lives. Boys and wives bring
    arrows from the house to the fighters. The Arawaks counterattack, kill the foremost
    Caribs, and the remaining Caribs flee toward the river and forest, where they
    are defeated. The passage locates the battle site by a stream and recalls the
    fear caused by Carib raids, flotillas, weapons, flame, and war cry.
  language: English
  quote_policy: summarized
