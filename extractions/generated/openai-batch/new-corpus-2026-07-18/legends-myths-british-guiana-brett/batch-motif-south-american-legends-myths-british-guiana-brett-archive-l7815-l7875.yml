canonical_text:
  quote: ''
  summary: 'A verse passage frames several Guiana stories told at night: hunters hear
    tales of beasts and birds, a man riding a cayman across the tide, a jaguar fighter,
    a snake-catcher, aquatic beings who draw people beneath the wave, and a Peaima
    tale in which a man injures or humiliates the monster with pepper seeds and then
    outwits him by lying.'
  language: English
  quote_policy: summarized
