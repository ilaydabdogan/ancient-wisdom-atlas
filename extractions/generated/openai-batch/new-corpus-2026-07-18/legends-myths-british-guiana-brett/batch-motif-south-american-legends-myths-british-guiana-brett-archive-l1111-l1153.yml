canonical_text:
  quote: ''
  summary: A feeble elderly clan chief and sorcerer called Maraka-kore brings his
    maraka, or rattle, to the speaker. The instrument is described as feather-adorned
    and containing stones, and it is associated in the speaker’s question with demons
    and healing practice. The old man says he brings it as a sign that he renounces
    evil spirits, has heard and believes the “good word” from Cornelius, and wants
    himself and his wife to be christened before death. The speaker later asks him
    about traditions of his trade, the first sorcerer, and the use of the rattle;
    urged by relatives and friends, he begins to tell a tradition.
  language: English
  quote_policy: summarized
