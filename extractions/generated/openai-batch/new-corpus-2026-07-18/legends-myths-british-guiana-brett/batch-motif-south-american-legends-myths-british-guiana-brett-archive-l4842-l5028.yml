canonical_text:
  quote: ''
  summary: A great tree or feeding place contains cultivated plants and fruits. Maipuri
    the tapir first finds and conceals it, but the Rat tracks him and reveals it to
    humans. An oracle orders the tree cut down; after a long effort, people divide
    slips and cuttings for their fields. Beneath the tree roots is a sacred grot associated
    with the Water-Mother, and waters burst forth until a rugged rock closes the fountain.
    The rock gives oracles, warning humans not to answer tempting spirits from the
    wood and promising renewal of age like a serpent shedding its skin. Later humans
    obey the voices from the wood; Yarrekaru the monkey undermines the guardian stone,
    and waters rush toward the people at night.
  language: English
  quote_policy: summarized
