canonical_text:
  quote: ''
  summary: 'The passage first describes local explanations of pillar-like rocks as
    former trees, people, or animals turned to stone after failing to please the Great
    Spirit. It then introduces the legend of Bahmoo and the Frog: frog croaks are
    framed as the chorus to a popular tale explaining a division of race. In the legend,
    young hunters invite Bahmoo, their guest, to hunt enormous frogs in rivers and
    bogs. They advise him to carry a cudgel, but Bahmoo boasts that he will kill the
    first frog by jumping on its back and twisting its neck. The chief of the frogs,
    described as a spirit, overhears the boast and positions himself near the river
    while a loud chorus of frogs croaks around him, unsettling Bahmoo.'
  language: English
  quote_policy: summarized
