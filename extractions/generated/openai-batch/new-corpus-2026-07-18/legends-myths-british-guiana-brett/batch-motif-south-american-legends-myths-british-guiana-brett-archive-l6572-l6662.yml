canonical_text:
  quote: ''
  summary: Young men pursue ravagers who have taken maidens captive. Armed pursuers
    ambush the captors with arrows, free the maidens, and cause the captors to flee.
    Ekahruwa issues a boastful challenge and threatens vengeance against the Puruni
    people and an old man. After vanishing, he later returns with a large company
    from red Roralma's wall, while Puruni men, countrymen, and chieftains gather to
    defend the old man.
  language: English
  quote_policy: summarized
