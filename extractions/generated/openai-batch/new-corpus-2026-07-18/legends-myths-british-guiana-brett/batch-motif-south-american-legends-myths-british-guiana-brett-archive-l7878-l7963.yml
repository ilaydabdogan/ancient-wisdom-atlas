canonical_text:
  quote: ''
  summary: In this verse retelling, a sorcerer's daughter loves a young hunter. At
    her request, her father gives her a magic skin that makes her appear as a dog.
    In that guise she leaves the hunt, returns to the hunter's cottage, cleans it,
    bakes cassava bread, and tends the fire. The hunter secretly watches, sees her
    in human form, seizes the hanging charmed skin, burns it, and says he will follow
    her to her father to claim her as his bride.
  language: English
  quote_policy: summarized
