canonical_text:
  quote: ''
  summary: The passage introduces Ekahruwa as wrathful and destructive. In the section
    titled “The Massacre and Pursuit,” five young maidens lament their captivity,
    the plundering of their home, and the killing of their fathers. Ekahruwa, described
    as led by sorcery, leads Masaruni men to Koe’s place, finds Koe absent, kills
    neighboring men in his stead, is restrained from killing women, and departs with
    girls and spoil while news of the slaughter spreads to Puruni men.
