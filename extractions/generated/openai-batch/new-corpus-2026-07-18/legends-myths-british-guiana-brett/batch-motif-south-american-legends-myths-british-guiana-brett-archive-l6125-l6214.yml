canonical_text:
  quote: ''
  summary: A verse retelling says the narrator's people do not know the origin of
    their race but remember ancestral dwelling near the Masaruni River and mountains.
    The Caribs, who dominated other tribes, forced the Acawoios to flee. In a first
    night inroad, Caribs ravaged the land, met resistance, suffered some losses, and
    then killed captives and maimed or impaled boys. The Acawoio warriors met to prepare.
    An old chief ordered a house fortified with a high palisade and a hidden underground
    passage made from the house to a ravine.
