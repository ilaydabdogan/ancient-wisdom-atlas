canonical_text:
  quote: ''
  summary: 'The passage opens with a missionary frame asking why the people did not
    call on their Father until Christian teachers called them to prayer, then introduces
    an Arawak sorcerer''s legend titled "Arawanili and the Orehu." A remembered evening
    river scene follows: children swim after work, forest animals and birds are heard
    and seen, girls are in a bay with mermaidens described in the flashing water,
    and a canoe brings an Arawak family group who help two aged parents ashore.'
  language: English
  quote_policy: summarized
