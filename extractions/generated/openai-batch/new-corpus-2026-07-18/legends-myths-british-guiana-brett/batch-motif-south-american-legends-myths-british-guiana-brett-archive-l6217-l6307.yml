canonical_text:
  quote: ''
  summary: A scout warns an assembled group that the Caribs are approaching to kill
    them. The chief orders his warriors to meet the enemy at the Cuyuni. The warriors
    hide among trees near the riverbank while the Carib flotilla lands; the Caribs
    eat and rest without keeping watch. The hidden warriors attack with darts, killing
    many and driving survivors back to their boats. The victors go upriver to bathe
    in clear water because the lower water is fouled by bodies and blood. In the following
    section, the Caribs return in greater force, and the chief says the place is lost
    but the enemy will pay dearly.
  language: English
  quote_policy: summarized
