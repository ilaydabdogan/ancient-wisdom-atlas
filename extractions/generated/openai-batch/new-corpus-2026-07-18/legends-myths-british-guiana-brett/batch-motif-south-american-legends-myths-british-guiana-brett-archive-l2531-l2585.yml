  quote: They wait us on that other shore, / Their voices here are heard no more !
  summary: The conclusion remembers Sacibarra, later called Cornelius, as an aged
    chief who told the narrator ancient legends about an unseen High Lord. It describes
    his coming to hear Christian teaching, helping establish a mission church by clear
    waters among palms and bamboos, and the later silence of the place after nearly
    all participants and other tale-tellers have died. The passage closes by turning
    to Warau lore.
