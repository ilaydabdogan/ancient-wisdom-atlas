canonical_text:
  quote: ''
  summary: In this verse passage, Wawaiya hears an axe speak of cutting and wounding,
    while Serikoai dismisses the omen. Under the influence of a sorcerer or enchanter,
    she wounds her husband as he comes down from a fruit tree and flees with Wailya.
    Serikoai is revived by a kindly spirit, creates a small bird from an eyelash and
    tear, and sends it to call his mother by his name.
  language: English
  quote_policy: summarized
