canonical_text:
  quote: ''
  summary: In a verse retrospect, Dutchmen propose peace, trade, and firm alliance
    with the speakers' fathers, offering iron tools, clothes, ornaments, and mirrors
    in exchange for assistance guarding the woods. The fathers answer that attractive
    goods can cost liberty, identify themselves as free hunters, and require that
    no Arawak be enslaved. The narration says this liberty was maintained and that
    Christian teaching came only with later white men.
  language: English
  quote_policy: summarized
