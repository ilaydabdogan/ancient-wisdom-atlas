canonical_text:
  quote: ''
  summary: The passage first voices a request that bow and arrows be placed in a grave
    so the speaker's armed soul can repel hostile souls and reach the spirit land.
    It then contrasts a Trinidad Warau legend in which the souls of good men are enshrined
    in glittering hummingbirds in a paradisal landscape. When Chaymas molest the birds,
    they sink beneath the ground, and the pitch lake is said to be found where the
    happy souls had rested. A footnote frames the hummingbird legend through a reference
    to Charles Kingsley.
