canonical_text:
  quote: Straight o'er the gulf the woman flew / Into the deep blue sky.
  summary: A husband calls after his wife, follows her after preparing tapir flesh,
    and sees the Wailya pursuing her. The woman crosses a chasm at the edge of the
    earth into the sky; her lover and the husband follow, forming an unending aerial
    chase visible at night. The passage identifies the woman with the Pleiades, the
    Hyades with the tapir's head and Aldebaran as a red eye, and Orion/Rigel with
    a maimed starry figure. The narrative frame then shifts to observers watching
    the night sky and to the dawn opening of another tale.
  language: English
  quote_policy: quoted
