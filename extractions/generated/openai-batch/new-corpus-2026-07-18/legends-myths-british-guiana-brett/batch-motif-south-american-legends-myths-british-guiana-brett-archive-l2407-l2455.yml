canonical_text:
  quote: Our race is not bloodthirsty.
  summary: After a battle, warriors and elders meet in council and question a wounded
    Carib chieftain. He offers himself to be killed, but says that if he is spared
    and released, his people will stop invading and make peace. The council releases
    him and four surviving men. The chief keeps the promise, Carib inroads cease,
    and the narrator says clemency brought more benefit than slaughter.
  language: English
  quote_policy: quoted
