canonical_text:
  quote: ''
  summary: In a verse episode, Bahmoo, a boaster, attacks a frog and attempts to twist
    its head, but the frog-chief, described as a huge frog possessed by a frolicsome
    sprite, pulls him into the water. The frog carries Bahmoo across the river while
    frogs answer their king’s chant. Bahmoo’s companions mock him from the bank. The
    frog leaves Bahmoo alone on the opposite shore, saying Bahmoo’s people are killing
    the frog’s people.
  language: English
  quote_policy: summarized
