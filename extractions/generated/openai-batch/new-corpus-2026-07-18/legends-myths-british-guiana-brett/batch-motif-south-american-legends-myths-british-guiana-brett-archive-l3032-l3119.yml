canonical_text:
  quote: ''
  summary: A verse retelling describes the Warau beginning life in a new world below
    after life on high. They find food but fear earthly dangers and, above all, scarce
    and unclean water. The people call on their Maker, addressing him as Father and
    Master, confessing that they forsook his high place and fearing death by thirst.
    Kanonatu, the Maker throned on high, hears and sends rain, making rivers that
    bring water and fish. The narrator closes by saying the tale explains how Waraus
    came from on high.
  language: English
  quote_policy: summarized
