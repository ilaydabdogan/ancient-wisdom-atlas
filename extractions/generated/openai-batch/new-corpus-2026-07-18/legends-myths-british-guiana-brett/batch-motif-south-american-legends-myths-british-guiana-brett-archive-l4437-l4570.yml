canonical_text:
  quote: ''
  summary: 'The passage introduces colonial settlement around Cayenne and then recounts
    a Carib war path: Carib warriors travel by canoe and overland routes through rivers,
    falls, mountains, and plains; raid peaceful villages; use concealed rafts or fallen
    trees for surprise attacks; kill adults, take girls captive, gather plunder, and
    return east. A later summons to restore Carib fame draws warriors from Essequibo,
    Surinam, Cayenne, and farther east, who abandon ornaments, prepare weapons and
    provisions, paint their faces red, and leave their families for war.'
  language: English
  quote_policy: summarized
