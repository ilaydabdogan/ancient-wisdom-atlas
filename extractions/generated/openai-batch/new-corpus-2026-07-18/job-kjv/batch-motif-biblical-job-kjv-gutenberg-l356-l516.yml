  text: Wrath and envy are said to kill the foolish; the foolish man is seen taking
    root before his habitation is cursed, his children lack safety, and his harvest
    and substance are taken.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says affliction and trouble do not arise from dust or ground,
    yet man is born to trouble as sparks fly upward.
  category: speech
  evidence_refs:
