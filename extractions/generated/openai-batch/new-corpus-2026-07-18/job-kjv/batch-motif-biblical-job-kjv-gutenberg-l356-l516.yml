  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker says the addressee's tabernacle will be in peace, his seed will
    be great like grass, and he will come to the grave in full age like corn gathered
    in season.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Job answers that his grief and calamity would be heavier than the sand of
    the sea if weighed in balances, and says the Almighty's arrows, poison, and terrors
    are against him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Job asks that God grant his request by destroying him, letting loose his hand,
