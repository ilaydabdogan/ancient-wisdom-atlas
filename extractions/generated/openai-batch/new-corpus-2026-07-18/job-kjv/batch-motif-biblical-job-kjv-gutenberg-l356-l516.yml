canonical_text:
  quote: ''
  summary: A wisdom speaker describes the ruin of the foolish, urges seeking God,
    and portrays God as one who gives rain, raises the lowly, frustrates the crafty,
    corrects, wounds, heals, and delivers from many troubles. The speaker promises
    peace with habitation, offspring, field stones, and beasts, and a full-aged death.
    Job then answers by weighing his grief, describing the Almighty's arrows and terrors,
    asking that God cut him off, and rebuking his friends as unreliable like vanishing
    brooks while asking them to teach him rightly.
  language: English
  quote_policy: summarized
