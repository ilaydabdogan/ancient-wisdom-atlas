- id: obs:3
  text: The speaker says he would seek God and commit his cause to God, who does marvelous
    things, gives rain and waters, raises the lowly and mourners, frustrates the crafty,
    and saves the poor from sword, mouth, and mighty hand.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker calls the divinely corrected man happy and says the Almighty's
    chastening should not be despised, because God makes sore and binds up, wounds
