  basis: The man is driven by storm, God casts upon him and does not spare, and men
    hiss him out of his place.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The immediate antecedent of the pronoun lies partly outside the supplied
    line range; the judgment pattern is clear within the excerpt but the figure's
    full identity depends on adjacent context.
- id: motif:4
  label: hidden things brought from darkness to light
  taxonomy_refs:
  - wisdom
  basis: The passage describes searching stones of darkness, paths unknown to creatures,
