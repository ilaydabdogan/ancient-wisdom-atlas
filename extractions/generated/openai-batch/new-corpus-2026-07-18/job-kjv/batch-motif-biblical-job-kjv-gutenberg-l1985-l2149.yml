canonical_text:
  quote: ''
  summary: The passage first describes a man carried away by east wind and storm,
    cast upon by God, and mocked by men. It then describes human mining for metals
    and gems, asks where wisdom and understanding are found, says they cannot be found
    in living lands, depths, sea, death, or wealth, and states that God knows their
    way and tells man that fear of the LORD is wisdom and departing from evil is understanding.
    Job then recalls his former days of divine preservation, abundance, public honor,
    care for the poor and vulnerable, victory over the wicked, expected flourishing,
    and respected counsel.
  language: English
  quote_policy: summarized
