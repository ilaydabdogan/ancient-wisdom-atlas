candidate_motifs:
- id: motif:1
  label: wisdom beyond human search and treasure
  taxonomy_refs:
  - wisdom
  basis: Mining uncovers precious things, but wisdom's place and price remain unknown
    to man and cannot be bought or equaled by treasure.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage is a wisdom discourse rather than a narrative quest; the mining
    imagery is explicitly contrasted with the search for wisdom.
- id: motif:2
  label: divine knowledge and disclosure of wisdom through cosmic order
  taxonomy_refs:
  - wisdom
  basis: God alone knows wisdom's way and place, measures winds and waters, decrees
    rain and lightning, and declares to man that fear of the LORD is wisdom.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage states divine knowledge and instruction directly; broader
    theological interpretation should be reviewed by a human.
- id: motif:3
  label: divine judgment casts the wicked from place
  taxonomy_refs:
