canonical_text:
  quote: ''
  summary: Job concludes an oath-like defense denying idolatry, malice, concealment
    of sin, inhospitable conduct, and exploitation of land. Elihu then appears, angry
    that Job justified himself and that the three friends failed to answer him. Elihu
    argues that understanding comes from the Almighty’s spirit rather than age alone,
    presents himself as a clay-formed human like Job, and teaches that God instructs
    humans through dreams and night visions to restrain pride.
  language: English
  quote_policy: summarized
