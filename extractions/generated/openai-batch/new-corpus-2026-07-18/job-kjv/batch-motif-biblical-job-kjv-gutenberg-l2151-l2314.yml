canonical_text:
  quote: ''
  summary: Job describes being mocked by younger men, bodily and socially afflicted,
    unheard by God, and brought near death. He then begins an oath-like defense of
    his integrity, naming sexual restraint, honesty, fair treatment of servants, care
    for the poor, widow, and fatherless, and refusal to trust in gold.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says men younger than himself now deride him and that their fathers
    were beneath the status he would have admitted among his flock dogs.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fathers of the younger deriders are described as famine-driven, solitary
    wilderness dwellers who ate gathered plants and roots, were driven from society,
    and lived in cliffs, caves, and rocks.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says he has become their song and byword, is abhorred, fled from,
    spat upon, pushed at the feet, and obstructed in his path.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The attack on the speaker is compared to a wide breaking-in of waters; terrors
    pursue his soul like wind, and his welfare passes away like a cloud.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The speaker describes bodily affliction: his soul is poured out, his bones
    are pierced at night, his sinews do not rest, disease changes his garment, and
    he becomes like dust and ashes in mire.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker says he cries to God without being heard or regarded; he says
    God opposes him, lifts him to the wind, dissolves his substance, and will bring
    him to death and the house appointed for all living.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The speaker contrasts his past grief for the troubled and poor with his present
    reversal: he looked for good and light but received evil and darkness, mourns
    without the sun, and says his music has turned to weeping.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speaker says he is a brother to dragons and a companion to owls.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker states that he made a covenant with his eyes and asks whether
    God from above and the Almighty from on high give a portion or inheritance; he
    says God sees his ways and counts his steps.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'The speaker frames conditional self-imprecations: if he has walked in vanity
    or deceit, he asks to be weighed in an even balance; if he has committed adultery,
    he accepts loss involving his wife and says the offense is a fire consuming to
    destruction.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The speaker says that if he despised the cause of his manservant or maidservant,
    he would need to answer when God rises or visits; he grounds this in a shared
    maker and fashioning in the womb.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The speaker lists duties toward the poor, widow, fatherless, and unclothed,
    including sharing food, providing fleece, and not lifting his hand against the
    fatherless; he invokes bodily penalties and names destruction from God as a terror.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The speaker denies making gold his hope, addressing fine gold as his confidence,
    or rejoicing because of great wealth and gain.
  category: speech
  evidence_refs:
  - ev:10
