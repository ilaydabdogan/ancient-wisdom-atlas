canonical_text:
  quote: Man that is born of a woman is of few days and full of trouble.
  summary: A first-person speaker petitions God for an answer, asks why God treats
    him as an enemy, and reflects on human mortality. A cut tree may sprout again
    through water, but man dies and does not rise. The speaker asks to be hidden in
    the grave until divine wrath passes and wonders whether the dead may live again.
    Eliphaz the Temanite then answers, rebuking the speaker, appealing to ancestral
    wisdom, and describing the fearful fate of the wicked man who opposes God.
  language: English
  quote_policy: quoted
