  summary: Job laments his bodily suffering, wearisome nights, mortality, and divine
    scrutiny. Bildad replies that God does not pervert justice, urges Job to seek
    God, appeals to ancestral wisdom, and uses plant, web, and house images for the
    fate of the wicked. Job responds that humans cannot be just before God and describes
    God's overwhelming cosmic power over mountains, earth, sun, stars, heavens, sea,
    constellations, and unseen wonders.
