canonical_text:
  quote: ''
  summary: A speech describes the wicked man’s ill-gotten gain turning poisonous and
    being expelled under divine wrath. Job replies by asking why wicked people often
    live long, prosper, reject God, and yet die like others. He challenges his interlocutors’
    explanations and Eliphaz begins a reply about whether human righteousness profits
    God.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A male figure keeps food in his mouth; it turns to gall within him; swallowed
    riches are vomited up; poison of asps and a viper’s tongue are said to slay him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same figure is said not to see rivers, floods, or brooks of honey and
    butter; what he labored for is restored rather than swallowed; the stated reason
    is oppression of the poor and violent taking of a house he did not build.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the figure is about to fill his belly, God casts wrath upon him; weapons
    strike him; darkness, unblown fire, heaven, earth, and the departure of household
    increase are included in the description of his allotted portion from God.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Job asks his hearers to listen diligently, allow him to speak, and lay a hand
    on the mouth; he says remembrance makes him afraid and makes his flesh tremble.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Job asks why the wicked live, grow old, become mighty, have established offspring,
    safe houses, fertile livestock, dancing children, music, and wealth, while saying
    they do not desire God’s ways.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Job questions how often destruction actually comes on the wicked and describes
    them as stubble before wind and chaff carried by storm; he also says the wicked
    person will drink the wrath of the Almighty and that God judges those who are
    high.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Job contrasts one person who dies in strength and ease with another who dies
    in bitterness; both lie down alike in dust and are covered by worms.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Job says his interlocutors wrongly imagine things against him, refers to the
    wicked being reserved for a day of destruction, and says such a person is brought
    to the grave and remains in the tomb while others follow.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Eliphaz the Temanite begins speaking and asks whether a man can be profitable
    to God or whether righteousness gives the Almighty pleasure or gain.
  category: speech
  evidence_refs:
  - ev:9
