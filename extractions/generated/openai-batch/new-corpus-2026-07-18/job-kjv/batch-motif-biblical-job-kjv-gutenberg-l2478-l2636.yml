canonical_text:
  quote: ''
  summary: Elihu describes divine rescue of a chastened sufferer from the pit through
    a messenger, ransom, restored youth, prayer, confession, and living light. He
    then addresses Job and wise men, argues that God judges justly and impartially,
    sees all human ways, can withdraw breath, overthrows the wicked, hears the afflicted,
    and accuses Job of speaking without wisdom against God.
  language: English
  quote_policy: summarized
