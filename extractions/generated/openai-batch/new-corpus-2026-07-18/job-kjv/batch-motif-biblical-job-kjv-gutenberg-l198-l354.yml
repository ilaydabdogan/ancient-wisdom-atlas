canonical_text:
  quote: ''
  summary: Job's three friends arrive to mourn and sit silently with him. Job curses
    the day of his birth, longs for death as rest, and describes his misery. Eliphaz
    answers by recalling Job's former instruction of others, asserting a retributive
    principle for the wicked, and reporting a night vision whose voice contrasts mortal
    humans with God and emphasizes human fragility.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eliphaz, Bildad, and Zophar hear of Job's calamity and come by appointment
    to mourn with him and comfort him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The friends fail to recognize Job from afar, weep aloud, tear their mantles,
    and sprinkle dust on their heads toward heaven.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The friends sit with Job on the ground for seven days and seven nights without
    speaking because they see his grief is very great.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Job opens his mouth, curses his day, and asks that the day of his birth and
    the night of his conception perish.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Job asks that the day be darkness, without divine regard or light, and that
    the night be seized by darkness, excluded from the year and months, and without
    joyful voice.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Job asks that the twilight stars be dark and connects his curse to the fact
    that the womb did not close and hide sorrow from him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Job asks why he did not die from the womb or at birth, and says that then
    he would have lain still, slept, and been at rest.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Job describes death as a place where kings, counsellors, princes, infants,
    the wicked, and the weary are at rest.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Job says prisoners rest without hearing the oppressor, the small and great
    are there, and the servant is free from his master.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Job asks why light and life are given to the miserable and bitter in soul
    who long for death and rejoice when they find the grave.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Job says his way is hidden and God has hedged him in; he describes sighing
    before eating, roarings poured out like waters, feared things arriving, lack of
    safety, lack of rest, and trouble.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Eliphaz begins his answer by saying Job once instructed many, strengthened
    weak hands and feeble knees, and upheld the falling, but is now troubled when
    suffering touches him.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Eliphaz asks where the innocent or righteous have perished, and states that
    those who plow iniquity and sow wickedness reap the same and perish by God's blast.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Eliphaz describes several lions whose roaring, voice, teeth, prey, and whelps
    are broken, lacking, or scattered.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Eliphaz reports receiving a secret thing in night visions during deep sleep,
    accompanied by fear, trembling, and shaking bones.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: In Eliphaz's report, a spirit passes before his face, an indistinct form stands
    still, an image is before his eyes, there is silence, and he hears a voice.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: The voice asks whether mortal man can be more just or pure than God and his
    maker, and says God puts no trust in his servants and charges his angels with
    folly.
  category: speech
  evidence_refs:
  - ev:17
- id: obs:18
  text: The voice describes humans as dwelling in houses of clay with foundations
    in dust, crushed before the moth, destroyed from morning to evening, perishing
    forever, and dying without wisdom.
  category: speech
  evidence_refs:
  - ev:18
- id: obs:19
  text: Eliphaz asks whether anyone will answer Job and to which of the saints Job
    will turn.
  category: speech
  evidence_refs:
  - ev:19
