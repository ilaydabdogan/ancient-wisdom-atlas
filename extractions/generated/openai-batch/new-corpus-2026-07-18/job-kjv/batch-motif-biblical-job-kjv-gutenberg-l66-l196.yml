canonical_text:
  quote: ''
  summary: Job is introduced as an upright and prosperous man who continually offers
    burnt offerings for his children. In two heavenly-council scenes, the LORD permits
    Satan first to harm Job's possessions and household, then to afflict Job's body
    while sparing his life. Messengers report raids, heavenly fire, a desert wind,
    and the deaths of Job's children. Job mourns, worships, and does not curse God;
    after bodily affliction, his wife urges him to curse God and die, but he refuses
    and is said not to sin with his lips.
  language: English
  quote_policy: summarized
