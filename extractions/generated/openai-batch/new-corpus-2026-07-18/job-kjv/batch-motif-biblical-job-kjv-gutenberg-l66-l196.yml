- id: obs:1
  text: Job is described as a man in the land of Uz who is perfect, upright, fears
    God, and avoids evil.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Job has seven sons, three daughters, large herds, and a great household, and
    is called the greatest of the men of the east.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Job's sons hold feasts and invite their sisters; Job sanctifies them and offers
    burnt offerings for each, in case they have sinned or cursed God in their hearts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The sons of God come to present themselves before the LORD, and Satan comes
    among them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The LORD asks Satan where he has come from, and Satan answers that he has
    been going to and fro in the earth and walking in it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The LORD points out Job's uprightness; Satan questions whether Job fears God
    for nothing and refers to a hedge, blessing, and increased substance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The LORD places all that Job has in Satan's power but forbids Satan to put
    forth his hand upon Job himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: A sequence of messengers reports that Sabeans took oxen and asses and killed
    servants, fire from heaven burned sheep and servants, and Chaldeans took camels
    and killed servants.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A messenger reports that a great wind from the wilderness struck the four
    corners of the eldest brother's house, the house fell, and Job's children died.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: After the disaster reports, Job rises, rends his mantle, shaves his head,
    falls to the ground, and worships.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Job says that he came naked from his mother's womb and will return naked,
    and that the LORD gave and took away; the narrator says Job did not sin or charge
    God foolishly.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: In a second heavenly-council scene, the LORD again speaks of Job's integrity
    and says Satan moved him against Job to destroy him without cause.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Satan says that touching Job's bone and flesh will make him curse God, and
    the LORD permits Satan to have Job in his hand while saving Job's life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: Satan smites Job with sore boils from the sole of his foot to his crown; Job
    takes a potsherd to scrape himself and sits among ashes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Job's wife tells him to curse God and die; Job rebukes her, asks whether they
