canonical_text:
  quote: ''
  summary: Job speaks of God as an unhindered power and judge before whom he cannot
    plead successfully. He laments suffering, failed self-cleansing, the absence of
    a mediator, and asks God why he is condemned after being made by God. He describes
    his body as formed from clay, milk, skin, flesh, bones, and sinews, wishes he
    had not been born, and anticipates going to a land of darkness and no return.
    Zophar answers by rebuking Job and invoking the hidden secrets of divine wisdom
    and the unsearchability of God.
  language: English
  quote_policy: summarized
