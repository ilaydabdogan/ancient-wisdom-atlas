canonical_text:
  quote: ''
  summary: Enemies allied with Set gather on northern waters and are pursued by Heru-Behutet
    in the Boat of Ra. Heru-Behutet defeats and slaughters enemies, captures the Enemy/Set
    with lance and chain, and is praised by Ra as the Winged Disk who has cleansed
    the district. Ra gives the enemies and Set to Isis and Horus, son of Isis, who
    executes and drags the Enemy. Isis asks that the Winged Disk become an amulet
    for her son. Heru-Behutet and Horus appear in similar hawk-crowned warrior forms,
    defeat enemies by the water, and the events explain names of regions, lakes, and
    a Festival of Sailing.
  language: English
  quote_policy: summarized
