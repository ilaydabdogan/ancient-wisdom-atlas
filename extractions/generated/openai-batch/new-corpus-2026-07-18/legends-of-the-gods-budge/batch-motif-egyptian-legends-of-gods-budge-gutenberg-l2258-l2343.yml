canonical_text:
  quote: ''
  summary: Nu and the gods urge Ra to send his Eye against humans who blasphemed him.
    The Eye, in the form of Hathor, slaughters men and women in the mountain or desert
    lands. Ra then restrains the destructive goddess by having mandrakes, blood, and
    beer prepared in great vessels and poured out so that she drinks, becomes drunk,
    and stops killing humans. Ra institutes a Hathor festival practice involving sleep-producing
    beer. Later Ra laments sickness and weariness with humankind; Nut becomes a cow
    and bears him on her back. Humans offer to fight Ra's blaspheming enemies, and
    the passage links that slaughter to the origin of sacrifice before ending in a
    fragmentary statement about Ra and Nut.
  language: English
  quote_policy: summarized
