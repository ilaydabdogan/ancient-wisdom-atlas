candidate_motifs:
- id: motif:1
  label: Mourning goddess searches for hidden dead beloved
  taxonomy_refs:
  - stolen_beloved
  basis: Isis responds to the report by mourning and wanders through the country searching
    for the chest containing Osiris’s body after Typhon’s accomplices have moved it.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage concerns a body in a chest rather than an abducted living
    spouse; the taxonomy link is approximate.
- id: motif:2
  label: Children’s speech as divinatory guidance
  taxonomy_refs:
  - wisdom
  basis: Children reveal the route by which the body was carried to the sea, and the
    passage explicitly says Egyptians observe children’s prattle as omens and presages.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The wisdom reference is broad; the passage frames the children’s speech
    specifically as divining and omen-making.
- id: motif:3
  label: Exposed child found with animal guidance and raised as divine guardian
  taxonomy_refs:
  - miraculous_child
  - mother_goddess
  basis: Nephthys exposes the child; dogs guide Isis to him; Isis finds and raises
    him; he becomes Anubis, guard and attendant of the gods.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not describe a miraculous birth, but the child’s exposure,
    rescue, and later divine guardianship support the candidate motif.
- id: motif:4
  label: Hidden chest enclosed in a tree and transformed into a sacred pillar
  taxonomy_refs:
  - sacred_tree_axis
  basis: The chest lodges in a tamarisk, the tree grows around and conceals it, the
    trunk becomes a roof-supporting pillar, and the remaining wood is preserved and
    worshipped at Byblos.
  evidence_refs:
  - ev:6
  - ev:11
  - ev:12
  confidence: medium
  cautions: The pillar supports a roof and receives cultic treatment, but the passage
    does not explicitly state a cosmic-axis function.
- id: motif:5
  label: Divine nurse attempts to remove a child’s mortality by fire but is interrupted
  taxonomy_refs:
  - miraculous_child
  - mother_goddess
  basis: Isis nurses a royal child, places him in fire each night to consume his mortal
    part, and the queen’s cry interrupts the immortality that would have been conferred.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage gives the action and its failed result directly; broader classification
    should be reviewed.
- id: motif:6
  label: Goddess transforms into a lamenting bird
  taxonomy_refs:
  - shapeshifter
  basis: While the child is in the fire, Isis transforms herself into a swallow, circles
    the pillar, and laments her fate.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: Only a single transformation form is described in this passage.
- id: motif:7
  label: Place names and cult customs explained by divine events
  taxonomy_refs: []
  basis: The passage explains Panic Terrors, Koptos as city of mourning, child omen-practice,
