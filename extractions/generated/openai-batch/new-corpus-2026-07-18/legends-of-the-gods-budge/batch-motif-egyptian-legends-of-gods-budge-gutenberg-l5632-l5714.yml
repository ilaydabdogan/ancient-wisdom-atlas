canonical_text:
  quote: ''
  summary: The passage narrates Isis learning of Osiris's fate, mourning and searching
    for the chest containing him, receiving information from children, finding and
    raising the exposed child Anubis, and traveling to Byblos where Osiris's chest
    has been enclosed in a tamarisk tree made into a palace pillar. Isis enters the
    Byblos court, nurses a royal child, attempts a fire rite to remove his mortal
    part while lamenting in swallow form, reveals herself after the queen interrupts,
    recovers the chest, consecrates the remaining wood, laments, departs for Egypt
    with the chest, and dries the river Phaedrus in anger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pans and Satyrs living near Chemmis first learn of the accident that befell
    their king and inform the people, which the passage links to the naming of Panic
    Terrors.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Isis hears the report, she cuts off a lock of hair and puts on mourning
    apparel; the place is said to be called Koptos, the city of mourning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Isis wanders through the country searching for the chest and asks people,
    including children, what became of it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The children tell Isis which mouth of the Nile carried the body to the sea,
    and the passage says Egyptians consequently observe children’s prattle as omens,
    especially in sacred places.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Isis learns that Nephthys bore a child by Osiris and exposed it because she
    feared Typhon; dogs conduct Isis to the child, whom she finds, raises, and who
    is later named Anubis.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The chest is carried by the sea to Byblos, lodges in a tamarisk, becomes enclosed
    by the growing tree, and is hidden inside a trunk later made into a palace roof-supporting
    pillar.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Isis learns of the Byblos events through a report of demons, goes to Byblos,
    sits beside a fountain, and speaks only to the queen’s women.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Isis salutes and caresses the queen’s women, plaits their hair, and transfers
    a fragrance from her body into them, which causes the queen to summon her.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The queen makes Isis nurse to one of her sons; the passage names the king
    as Melkander or Melkarth and gives several possible names for the queen.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Isis nurses the child with her finger instead of her breast, puts him in the
    fire each night to consume his mortal part, transforms into a swallow, circles
    the pillar, and laments.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The queen watches, sees the child in flame, cries out, and thereby deprives
    him of some of the immortality that would have been conferred on him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Isis reveals herself, asks for the roof-supporting pillar, opens it, removes
    what she wants, wraps the remainder in fine linen, pours perfumed oil over it,
    and returns it to the king and queen.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The remaining wood is said to be preserved in a temple and worshipped by the
    people of Byblos.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: Isis throws herself upon the chest and laments so loudly that the younger
    royal son dies of fright; she takes the elder son, sails to Egypt with the chest,
    and dries up the river Phaedrus after it sends a keen chill air.
  category: sequence
  evidence_refs:
  - ev:13
