canonical_text:
  quote: ''
  summary: Rebellion breaks out again in Nubia, where some enemies hide in the river
    as crocodiles and hippopotami. Ra advises Horus to sail south on the Nile with
    the Blacksmiths; Thoth recites protective chapters over the boats to prevent river
    monsters from raising waves and storms. When rebel fiends see Ra's boat bearing
    the winged Disk of Horus, accompanied by Uatchet and Nekhebet as serpents, they
    die from fear. Horus returns to Edfu, and Ra orders images of the winged Disk
    to be placed in sanctuaries of Horus of Behutet; the narrator links this to winged
    disks above Egyptian temple doorways. A plate caption identifies Horus of Behutet
    in lion form slaying foes.
  language: English
  quote_policy: summarized
