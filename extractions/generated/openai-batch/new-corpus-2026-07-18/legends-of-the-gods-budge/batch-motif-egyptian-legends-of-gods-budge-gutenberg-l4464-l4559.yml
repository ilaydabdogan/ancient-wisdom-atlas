candidate_motifs:
- id: motif:1
  label: Anti-poison incantation controlling stinging creatures
  taxonomy_refs: []
  basis: Isis uses spoken commands against poison and scorpions, commanding poison
    to retreat and declaring that poison will die.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage names scorpions and reptiles broadly, but does not explicitly
    name a serpent.
- id: motif:2
  label: Divine mother protects a poisoned child
  taxonomy_refs:
  - mother_goddess
  - divine_parent_child
  basis: Isis is called to Horus, runs to him, addresses him as her son, and protects
    him from poison through speech.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:12
  confidence: high
  cautions: The passage is an incantatory narrative; the exact ritual setting beyond
    the supplied passage is not inferred.
- id: motif:3
  label: 'Healing formula: child lives and poison dies'
  taxonomy_refs:
  - death_rebirth
  basis: The formula contrasts the child's life and recovery with the death or defeat
    of poison and applies the same healing to the stricken.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: medium
  cautions: The death-rebirth taxonomy reference is limited to the verbal contrast
    between life and poison's death; the passage does not narrate an actual death
    and resurrection.
- id: motif:4
  label: Protective divine identification of the threatened child
  taxonomy_refs:
  - wisdom
  basis: Isis protects Horus by asserting his divine/cosmic origins and relationships,
    including Nu, the Bennu, the Abtu Fish, the Cat, and protective deities.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: medium
  cautions: The taxonomy reference is broad; the passage presents authoritative ritual
    speech rather than an explicit wisdom quest.
- id: motif:5
  label: Hospitality refusal followed by restitution
  taxonomy_refs:
  - sacred_exchange
  basis: Usert brings possessions as penalty for not opening her door, while Tah's
    house is filled because she opened her door to Isis.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage gives the exchange but does not expand the social or ritual
    law behind it.
- id: motif:6
  label: Materia medica combined with spell against poison
  taxonomy_refs: []
  basis: After the incantatory formula, the text names barley bread-cake, natron,
    and hetchet-plant fire as substances acting against poison and fever-heat.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explain preparation or ritual procedure beyond the
    named substances and effects.
comparison_claims:
- id: claim:1
  claim: The editor's notes explicitly connect some terms in Isis' protective address,
    including Mesqet, Bennu, and the Cat, with passages in the Book of the Dead, supporting
    a limited comparison of shared mythic vocabulary with that nearby Egyptian corpus.
  claim_level: linguistic_similarity
  target: Book of the Dead, Chapter xvii references in the editor's notes
  evidence_refs:
  - ev:14
  - ev:15
  - ev:17
  counter_evidence_refs: []
  confidence: medium
  limitations: The notes identify parallel terms and references; they do not demonstrate
    that this passage and the Book of the Dead passage share the same full narrative
    motif or direct dependence.
- id: claim:2
  claim: The note on the Abtu and Ant fishes links the fish named in Isis' address
    to the Boat of Ra, suggesting a limited connection with solar-bark imagery in
    Egyptian tradition.
  claim_level: same_function
  target: Abtu and Ant fishes before the Boat of Ra
  evidence_refs:
  - ev:16
  counter_evidence_refs: []
  confidence: low
  limitations: The passage itself only calls Horus the brother of the Abtu Fish; the
    guiding function before Ra's Boat appears in the editor's note, not in the main
    narrative.
