canonical_text:
  quote: ''
  summary: 'The passage gives philosophical and allegorical interpretations of the
    Isis and Osiris narrative: Osiris is read as the Nile or moisture, Isis as the
    land flooded by the Nile, and Typhon as the sea or destructive fiery dryness.
    It also discusses ritual dislike of the sea, salt, pilots, and fish; a temple
    picture sequence at Sais; blackness associated with Osiris, water, and Egypt;
    celestial bodies sailing in ships; and water as a first principle connected with
    Egyptian belief in the celestial ocean Nu.'
  language: English
  quote_policy: summarized
