  quote: ''
  summary: A divine speaker commands Thoth to summon Seb. When Seb comes, the speaker
    orders action against the worms or serpents in Seb and instructs him to ask Nu
    to guard the serpents in earth and water. Seb is to create writings for serpent
    nests to prevent injury, and is appointed father over them. The passage also emphasizes
    men possessing words of power, the speaker's own protective words, and a decree
    involving Osiris and obedient princes.
