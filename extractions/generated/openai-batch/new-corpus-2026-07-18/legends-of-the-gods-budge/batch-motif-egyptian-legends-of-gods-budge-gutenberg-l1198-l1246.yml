canonical_text:
  quote: ''
  summary: The passage supplements the account of Horus's conception with Pyramid
    Text excerpts addressed to Osiris. Osiris is urged to rise and receives water
    of youth and bread of warmth; heavenly and watery doors are opened to him. Isis
    and Nephthys supplicate, protect, praise, and offer to him. Isis joins with Osiris
    and conceives in the form of the star Septet/Sothis; Horus-Sept issues from Osiris
    as Horus and later avenges him. Horus gives Osiris his Eye, restores his members,
    and Thoth slays Osiris's enemy. The editor notes that the words were addressed
    to dead kings in the Pyramid Texts and were believed to describe what had actually
    happened to Osiris.
  language: English
  quote_policy: summarized
