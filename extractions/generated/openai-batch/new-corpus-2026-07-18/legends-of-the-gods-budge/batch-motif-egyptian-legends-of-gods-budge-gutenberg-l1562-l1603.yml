canonical_text:
  quote: '"the Nile hath not come forth[FN#47] for seven years"'
  summary: In King Tcheser's eighteenth year, the king sends Matar a despatch describing
    a seven-year failure of the Nile flood and a severe famine. The king asks about
    the Nile's origin and presiding deity. Matar explains that the Nile rises near
    Elephantine from two caverns described as the breasts of the Nile-god, and that
    Khnemu controls the river by opening the doors that restrain it. Matar also describes
    Khnemu's form, dwelling, associated gods, and local stones.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The account is set in the eighteenth year of King Tcheser's reign, when Matar
    held offices connected with temple properties and the Khenti men at Elephantine.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A royal despatch is delivered to Matar, and in it the king says he is miserable
    on his throne because the Nile has not come forth for seven years.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
  - ev:8
- id: obs:3
  text: The famine is described through lack of grain, vegetables, and food; robbery
    between neighbours; bodily weakness among young and old; silent councillors; empty
    granaries; and general ruin.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king asks where the Nile is born, what god or goddess presides over it,
    and what the deity's form is.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king says he would like to consult the temple of Thoth, the College of
