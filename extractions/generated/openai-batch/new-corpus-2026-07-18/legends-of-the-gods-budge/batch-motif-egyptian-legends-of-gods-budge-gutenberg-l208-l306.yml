canonical_text:
  quote: ''
  summary: The passage introduces the Legend of the God Neb-er-tcher and the history
    of creation, describing the British Museum papyrus that preserves it, its provenance,
    physical features, and editorial history. It locates the Creation Legend within
    the Book of overthrowing Apep, a ritual text containing spells against Apep, enemy
    of Ra and Un-Nefer. The passage summarizes Apep as a monster serpent and leader
    of the hosts of darkness who attempts to imprison the Sun-god, and notes that
    the Creation Legend describes the origin of heaven, earth, all therein, and God
    Himself.
  language: English
