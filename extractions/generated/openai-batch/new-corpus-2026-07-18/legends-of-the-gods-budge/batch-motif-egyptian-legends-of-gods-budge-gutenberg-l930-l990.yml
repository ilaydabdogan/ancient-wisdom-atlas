  quote: ''
  summary: Ra proposes a sail on the Nile. His enemies change into crocodiles and
    hippopotami to attack his boat, but Horus and his metal-armed followers defeat
    them. Horus uses chains, lances, spells, and the form of the winged Disk, aided
    by serpent-form goddesses, to pursue and destroy Ra's enemies in several locations.
    The passage also records commemorations in a metal statue, place names, a priestly
    title, and plate captions showing Horus with Ra-Harmakhis or Harmakhis in a shrine.
  language: English
