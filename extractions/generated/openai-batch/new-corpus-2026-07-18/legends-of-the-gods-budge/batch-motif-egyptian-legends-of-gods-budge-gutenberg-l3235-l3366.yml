canonical_text:
  quote: ''
  summary: Thoth assigns names to places and to Heru-Behutet. Ra and Heru-Behutet
    undertake a river and sea journey against enemies appearing in or associated with
    water, while Thoth recites protective chapters for the boats. In Nubia, Heru-Behutet
    changes into the Winged Disk above the bow of Ra's boat and has Nekhebit and Uatchit
    accompany him as serpents; the Sebau fiends are terrified, do not resist, and
    die. The gods praise the deed, further names are assigned, and Ra Heru-khuti orders
    Thoth to place the Winged Disk in divine seats and temples to drive away evil.
    The passage then explains temple iconography linking Heru-Behutet with serpent
    forms of Nekhebit and Uatchit, South and North, and the Winged Disk.
  language: English
  quote_policy: summarized
