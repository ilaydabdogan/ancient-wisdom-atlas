  quote: ''
  summary: Thoth reassures Isis and Nephthys and recites protections for Horus and
    for an unnamed person described as being under the knife. The passage invokes
    Horus under many divine and cosmic forms, Isis's spells, Osiris's names, Ra's
    boat and disk, the retreat of poison, the return of life, and the protective power
    of Horus's Ka and Image. Isis then directs attention toward northern nurses at
    Buto who have made offerings to strengthen the child and the parallel patient.
