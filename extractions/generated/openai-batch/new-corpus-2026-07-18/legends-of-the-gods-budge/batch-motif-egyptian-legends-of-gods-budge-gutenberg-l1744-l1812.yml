candidate_motifs:
- id: motif:1
  label: apotropaic stele as universal divine barrier
  taxonomy_refs: []
  basis: The stele is explicitly described as representing the protective power of
    all divine beings and as an impassable barrier against evil spirits and venomous
    reptiles.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage describes the stele's protective function but does not provide
    a broader cross-cultural comparison.
- id: motif:2
  label: serpent enemy defeated by divine spell
  taxonomy_refs:
  - serpent
  basis: Apep is called Ra's great enemy, takes the form of a huge serpent, and is
    doomed by the spell to violent destruction carried out by Serqet.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The extraction is limited to the serpent-enemy pattern explicitly described
    in this passage.
- id: motif:3
  label: incantation expels poison from snakebite
  taxonomy_refs:
  - serpent
  basis: The spell against Apep's poison is to be recited over a snakebite victim
    and makes the bitten person vomit to free the body from poison.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The mechanism is reported as part of spell practice; no external healing
    tradition is inferred.
- id: motif:4
  label: divine composite body containing gods
  taxonomy_refs: []
  basis: The Cat is described as having body parts associated with many gods and goddesses,
    and every member of the Cat contains a deity.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage identifies the Cat as a symbol of Ra's daughter or Isis; the
    exact theological identity remains ambiguous in the source wording.
- id: motif:5
  label: divine parent called to heal poisoned daughter
  taxonomy_refs:
  - divine_parent_child
  basis: Ra is entreated to come to his daughter after she is stung by a scorpion
    and to cause the poison to leave her body.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage states that it seems as if Isis was stung, so the identity
    of the daughter is not fully certain.
- id: motif:6
  label: god protected in water from hostile spirits
  taxonomy_refs: []
  basis: Osiris is said to be in the water, evil spirits in the water are adjured,
    and Ra, Sekhet, Thoth, and Heka are named as his protectors.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The source says the section is difficult to understand, and the pronouns
    around the Great Beetle are ambiguous.
- id: motif:7
  label: widow or divine wife finding dead husband
  taxonomy_refs: []
  basis: The passage explains that Isis cried at Netit when she found the dead body
    of her husband.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This motif is only briefly alluded to at the end of the passage, not narrated
    in detail.
