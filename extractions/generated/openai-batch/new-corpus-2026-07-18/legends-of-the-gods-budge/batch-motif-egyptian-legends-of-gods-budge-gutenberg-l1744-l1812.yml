canonical_text:
  quote: ''
  summary: The passage describes the Metternich Stele as covered with divine figures
    and protective spells. It highlights a solar-disk image of Khnemu, Harpokrates
    standing on crocodiles, protective gods and goddesses, spells against reptiles
    and poison, Apep as a serpent enemy, a divine Cat associated with Ra's daughter
    or Isis, a scorpion-sting episode, and a difficult section invoking gods to protect
    Osiris in water and turn back hostile powers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Metternich Stele is described as having nearly three hundred figures of
    gods and celestial beings cut on its obverse, reverse, and sides.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the rounded obverse, a solar disk contains Khnemu with four ram's heads,
    rests between a pair of arms, and is supported on a lake of celestial water.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Harpokrates appears in relief standing on two crocodiles under a canopy supported
    by Thoth and Isis, and he holds Typhonic animals and reptiles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The two Eyes of Ra appear above the canopy, and other divine figures are placed
    to the right, left, and sides of Harpokrates.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stele is said to represent protective power held by all divine beings
    in the universe and to form an impassable barrier against evil spirits and venomous
    reptiles.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The spells on the stele are described as potent words by which gods defeated
    powers of darkness and evil.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first spell is an incantation against reptiles and noxious creatures,
    especially Apep, who is described as Ra's great enemy and as a huge serpent.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The spell dooms Apep to decapitation, burning, and hacking in pieces, with
    these acts to be carried out by Serqet the Scorpion-goddess.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A second part of the spell addresses Apep's poison and is to be recited over
    someone bitten by a snake, causing vomiting that frees the body from poison.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A spell addressed to the Cat describes the Cat as a symbol of Ra's daughter
    or Isis, with each body part associated with a god or goddess.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Cat is said to be able to destroy poison from any serpent, scorpion, or
    reptile injected into her body.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ra is entreated to come to his daughter, who has been stung by a scorpion
    on a lonely road, and to make the poison leave her body.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: A later section calls Ra-Harmakhis, Shu, and Isis to a poisoned female figure,
    asks Ra to let Thoth turn back Neha-her or Set, and states that Osiris is in the
    water while Horus is with him and the Great Beetle overshadows him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Evil spirits dwelling in the water are adjured to allow Horus to proceed to
    Osiris.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Ra, Sekhet, Thoth, and Heka are named as four great gods who protect Osiris
    and who will blind, choke, and cut out the tongues of his enemies.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage explains an allusion to Isis crying at Netit near Abydos when
    she found the dead body of her husband.
  category: sequence
  evidence_refs:
  - ev:10
