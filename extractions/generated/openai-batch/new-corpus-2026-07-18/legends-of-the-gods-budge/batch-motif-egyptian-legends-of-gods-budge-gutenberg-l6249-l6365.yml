  evidence_refs:
  - ev:1
- id: obs:3
  text: A fir-tree leaf is said to represent both Osiris and Egypt; an editor note
    suggests Plutarch may refer to the olive-tree.
  category: object
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:4
  text: Osiris is described as a great principle of fecundity, and the Pamylia festivals
    are said to carry a statue of the god with a triple phallus.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Sun is consecrated to Osiris, the lion is worshipped, and temples are
    ornamented with lions because the Nile rises when the Sun is in Leo.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Horus is described as the offspring of Osiris, identified with the Nile, and
    Isis, identified with the Earth; he is said to have been born in the marshes of
    Buto.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Nephthys, or Teleute, is described as the extreme limits of the country and
    the seashore, identified with barren land; Anubis is described as the result when
    Osiris/Nile overflowed that land.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: The shutting up of Osiris in a box is interpreted in the passage as the withdrawal
    of the Nile to its own bed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: During the stated season the nights lengthen, darkness prevails, and light
    is diminished.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Priests celebrate doleful rites and display a gilded ox covered with fine
    black linen as a representation of the grief of Isis; the ox is regarded as the
    living image of Osiris.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The rites mourn the falling of the Nile, the cessation of the north winds,
    the decrease in the length of days, and the desolate condition of the land.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: On the nineteenth of Pachons, priests and other officials go in procession
    to the sea carrying a sacred chest containing a small gold boat; water is poured
    in and the participants cry that Osiris is found.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Earth, scent, and spices are mixed into the water, worked into a crescent-shaped
    image, and dressed in clothes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: Horus is said to have conquered Typhon, but Isis did not allow Typhon to be
    destroyed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: Typhon is explained as once master of Egypt when Egypt was covered by the
    sea, while the Nile is said to create new land each year and drive away the sea.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:16
  text: A later explanation identifies Osiris as the Moon and Typhon as the Sun, with
    Typhon also called Seth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:17
  text: The death-day of Osiris, the seventeenth of Hathor, is connected with the
    seventeenth day of the Moon’s revolution when the Moon begins to wane.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:18
  text: The age of Osiris, twenty-eight years, the crescent-shaped tree-trunk at his
    funeral, and the fourteen pieces of Osiris are all compared with lunar measures
    or phases.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:19
  text: Apis is said to have been begotten by a ray of light from the Moon, Osiris
    is said to have entered the Moon, and Isis is called the productive faculty in
    it.
  category: relationship
  evidence_refs:
  - ev:6
