  - death_rebirth
  basis: The box episode is explained as the Nile’s withdrawal; rites mourn the falling
    Nile and desolate land; a sea procession announces that Osiris is found; the Nile
    is said to create new land and triumph over Typhon.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: This is presented as Plutarch’s allegorical explanation within Budge’s
    text, not as a full independent Egyptian narrative in this excerpt.
