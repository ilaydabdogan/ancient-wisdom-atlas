canonical_text:
  quote: ''
  summary: The passage introduces the Edfu legend of Heru-Behutet and the Winged Disk,
    noting its temple inscriptions and reliefs, and presents an editorial interpretation
    that a conquest by an early king was attributed to Horus of Edfu. Plate captions
    describe Horus attacking a Hippopotamus-fiend. The narrative recounts Ra-Harmakhis
    in Nubia against conspirators, Heru-Behutet entering Ra's boat at Edfu, being
    commanded as Ra's son to kill rebels, transforming into a great winged Disk, ascending
    to the sky, locating and attacking the rebels so that they kill each other, receiving
    the name Heru-Behutet from Thoth, and showing the slain or fettered enemies to
    Ra.
  language: English
  quote_policy: summarized
