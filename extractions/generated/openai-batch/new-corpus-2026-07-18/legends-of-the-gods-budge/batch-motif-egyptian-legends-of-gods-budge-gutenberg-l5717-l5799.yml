canonical_text:
  quote: ''
  summary: The passage narrates Isis mourning over Osiris's body in a chest, a child
    witness whose death and later identity are disputed, explanations of Maneros and
    a banquet skeleton custom, Typhon's discovery and dismemberment of Osiris into
    fourteen parts, Isis's search for the scattered parts by papyrus boat, explanations
    for multiple sepulchres of Osiris, and the loss, ritual substitution, and festival
    commemoration of Osiris's phallus. Editorial footnotes add parallels to Moses
    in a papyrus ark and to the Tale of the Two Brothers.
  language: English
  quote_policy: summarized
