canonical_text:
  quote: ''
  summary: The passage presents footnotes and sections explaining the story of Isis,
    Osiris, and Typhon. It reports a humanizing interpretation in which the story
    commemorates kings or great men later given divine titles, gives physical and
    occupational details attributed to Egyptian tradition, describes the ship called
    Argo as an imitation of Osiris’ ship and as a constellation, criticizes Euhemerus’
    reduction of gods to ancient rulers and captains, and then presents a second interpretation
    in which the events concern powerful Daemons, comparable in explanatory kind to
    several Greek mythic conflicts and wanderings.
  language: English
  quote_policy: summarized
