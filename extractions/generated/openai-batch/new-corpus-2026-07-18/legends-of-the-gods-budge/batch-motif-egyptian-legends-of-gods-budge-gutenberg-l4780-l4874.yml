canonical_text:
  quote: Horus is bitten, O Ra. Thy son is bitten
  summary: A woman reassures Isis about Horus and names a scorpion and the reptile
    Aun-ab as causes of his injury. Isis examines Horus, finds poison, laments that
    the child is bitten and dead, and calls to heaven. Nephthys and Serq arrive in
    lamentation, the Boat of Ra and the Disk stop, and Thoth comes from the Divine
    Boat equipped with spells to heal Horus.
