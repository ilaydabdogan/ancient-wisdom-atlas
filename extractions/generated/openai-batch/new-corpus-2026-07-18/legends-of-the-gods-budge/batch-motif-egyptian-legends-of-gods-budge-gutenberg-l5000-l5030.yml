canonical_text:
  quote: ''
  summary: Thoth speaks to the great gods and to nurses of Pe, invoking protective
    action against fiends, the journeying of Ra's boats, and the preservation of Horus.
    The speech states that Horus lives for Isis and Osiris, poison has been made powerless,
    evil is returned to its sender, the Sebiu fiends are turned back, Ra answers on
    behalf of Horus and his father, and Isis's words of power protect Horus so that
    he may take the throne of the Two Lands.
  language: English
