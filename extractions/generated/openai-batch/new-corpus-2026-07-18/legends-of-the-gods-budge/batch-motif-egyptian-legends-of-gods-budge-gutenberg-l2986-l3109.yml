canonical_text:
  quote: ''
  summary: Set assumes the form of a hissing serpent and is countered by Horus, son
    of Isis, in the form of a hawk-headed staff. Thoth assigns names and cultic titles.
    The Boat of Ra, made with palm and acacia wood, carries Heru-Behutet in pursuit
    of Setian fiends on northern waters, where he uses darts, harpoon, and other weapons
    to destroy them. The passage explains place names, sacred trees, festivals, warrior
    epithets, and priestly titles associated with these events.
  language: English
  quote_policy: summarized
