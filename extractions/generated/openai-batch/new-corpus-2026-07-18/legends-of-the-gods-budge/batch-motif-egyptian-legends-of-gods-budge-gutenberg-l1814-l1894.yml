canonical_text:
  quote: ''
  summary: A narrative in Isis's voice recounts her captivity after Set's murder of
    Osiris, Thoth's instruction to hide and bear Horus secretly, her journey with
    Seven Scorpion-goddesses, the death and revival of a woman's child by scorpion
    venom and spell, and then Horus's own death by a scorpion sent by Set. Isis laments
    Horus, Nephthys and Serqet urge her to appeal to heaven, the Boat of Ra stops,
    and Thoth descends with words of power and the command of maa-kheru, though Isis
    remains unconsoled.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage frames the narrative as an interruption in a series of spells
    on the Stele, placed in the mouth of Isis.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Set is said to have murdered Osiris and shut Isis up in a dwelling, apparently
    to force her into marriage and legalize his seizure of the kingdom.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Isis is described as pregnant by Osiris after his death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Thoth appears to Isis, advises her to hide with her unborn child, and promises
    that her son will succeed to his father's throne.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: With Thoth's help Isis escapes captivity and travels with the Seven Scorpion-goddesses
    to Per-Sui at the edge of the Reed Swamps.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A woman refuses Isis shelter, and one of the Scorpion-goddesses enters the
    woman's house and stings her child to death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Isis lays her hands on the dead child, utters a powerful spell, the scorpion
    poison leaves the body, and the child lives again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The words of the spell are said to have been preserved on the Stele and valued
    by Egyptians as a remedy for scorpion stings.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The woman whose child was revived gives many goods to Isis in repentance,
    and the goods fill the house of the poor woman who sheltered Isis.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Horus is later stung and killed by the scorpion Uhat while hidden in Sekhet-An
    during Isis's absence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Uhat is said to have been sent by Set and to have forced its way into Horus's
    hiding-place.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Isis finds Horus's body, tests for breath by placing her nose in his mouth,
    sees poison in the wound, and concludes he is dead.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Isis laments repeatedly with the phrase that Horus is bitten and identifies
    him as heir of heaven, son of Un-Nefer, child of the gods, and avenger of his
    father.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:14
  text: Nephthys and Serqet come to Isis and advise her to pray to heaven so that
    the sailors in the Boat of Ra may cease rowing.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Isis's cry reaches the Boat of Millions of Years, the Disk stops moving, and
    Thoth descends from the Boat equipped with words of power, spells, and the great
    command of maa-kheru.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Thoth tells Isis that no harm could have happened to Horus because he is under
    the protection of the Boat of Ra, but Isis objects that his powers are of no use
    if Horus perishes from scorpion poison.
  category: speech
  evidence_refs:
  - ev:10
