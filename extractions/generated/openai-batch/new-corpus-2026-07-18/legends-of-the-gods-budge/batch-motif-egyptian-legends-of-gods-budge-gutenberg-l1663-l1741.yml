  quote: ''
  summary: The passage introduces Egyptian magical texts and objects used against
    serpents, scorpions, crocodiles, and other dangerous creatures. It explains these
    beings as evil spirits or emissaries of Set, describes divine protective power
    as a 'fluid of life,' and outlines the iconography and function of Horus cippi,
    including the Metternich Stele.
