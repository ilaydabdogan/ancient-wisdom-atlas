canonical_text:
  quote: ''
  summary: The king petitions Khensu in Thebes, called Nefer-Hetep, to authorize and
    empower Khensu called Pa-ari-sekher-em-Uast to travel to Bekhten and deliver the
    prince’s daughter from a spirit. The god journeys with boats, chariots, horses,
    and attendants, heals Bent-Resht, negotiates the spirit’s peaceful departure through
    offerings and a festival, is detained in Bekhten, then appears in a dream as a
    golden hawk departing to Egypt. The image returns to Thebes with gifts, which
    are placed before Khensu Nefer-Hetep.
  language: English
  quote_policy: summarized
