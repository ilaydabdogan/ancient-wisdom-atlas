canonical_text:
  quote: ''
  summary: The passage identifies Isis at Hermopolis with Dikaiosune and Wisdom, describes
    sacred doctrine carried by initiates and represented by sacred vestments, defines
    the true votary of Isis as one who seeks hidden truths through reason and philosophy,
    and explains Egyptian priestly shaving and linen clothing as rites of purity rather
    than merely as customs connected with sheep, mourning, or the sky-colored flax
    blossom.
  language: English
  quote_policy: summarized
