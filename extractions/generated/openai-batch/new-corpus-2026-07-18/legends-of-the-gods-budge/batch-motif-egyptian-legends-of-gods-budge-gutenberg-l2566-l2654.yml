  quote: ''
  summary: The passage introduces Ra as a self-created creator god with unknowable
    names and Isis as a goddess skilled in words of power. Isis seeks knowledge of
    Ra's holy Name, fashions a serpent from Ra's spittle and dust, and sets it on
    his route. The serpent bites Ra, who suffers and summons the gods. Isis arrives
    with healing magic and asks Ra to tell his name; Ra answers with cosmic creator
    titles.
