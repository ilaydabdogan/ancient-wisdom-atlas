canonical_text:
  quote: ''
  summary: 'The passage introduces the hieroglyphic text of the Legend of the Destruction
    of Mankind in the tomb of Seti I and describes the Cow of Heaven image. It then
    summarizes the beginning of the legend: Ra, the aging Sun-god king, hears human
    murmuring, summons the gods who were with him in the primeval World-ocean, consults
    Nu and the divine assembly, and sends his Eye in the form of Hathor to destroy
    the rebellious humans. The destruction begins at Suten-henen, which the passage
    also associates with Ra''s kingship, Osiris''s crowning, the Bennu bird, and the
    Crusher of Bones.'
  language: English
  quote_policy: summarized
