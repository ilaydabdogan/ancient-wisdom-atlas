canonical_text:
  quote: ''
  summary: A divine first-person speaker identifies himself with self-created divine
    powers and with Hapi/Hap, the Nile, and promises that the Nile will rise unfailingly,
    producing vegetation, grain, filled storehouses, and an end to misery. The king
    then wakes, regains courage, and issues a decree in the temple of his father Khnemu,
    granting Khnemu land, river banks, agricultural shares, tithes from catches, animals,
    valuable goods, crafts, stones, and administrative protections for the god-house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first-person speaker says he created himself and identifies himself with
    Nu, Hapi, Shu, the Father of the Gods, and other high divine titles.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker describes the eastern and western halves of the sky as a habitation
    below him and describes a lake of water, Hap or the Nile, embracing field-land
    and providing life.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker promises to make Hap, the Nile, rise for the king and says that
    in no year shall it fail.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says plants, herbs, and trees will bend under their produce, Renenet
    will be at the head of everything, products will multiply, people will be filled,
    empty grain storehouses will end, and Egypt will become cultivated and yellow
    with grain.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator wakes at the mention of crops, his heart or courage returns,
    and he makes a decree in the temple of his father Khnemu.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king gives an offering to Khnemu, Lord of Qebhet and Governor of Ta-Sti,
    in return for what Khnemu has done for him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The decree assigns Khnemu specified river banks, land around the city, gardens,
    and river frontage over a space of twenty measures on the east and west sides.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Husbandmen who cultivate ground and place water on river banks and islands
    must provide a further contribution from growing crops and storehouses as Khnemu's
    share.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: One tenth of catches from fishermen, fowlers, fish catchers, bird snarers,
    wild-animal hunters, and lion snarers is to be demanded when these things enter
    the city.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: One tenth of calves born in the designated regions is to be set apart as sealed
    animals for daily burnt offerings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: One tenth is also levied on gold, ivory, ebony, spices, woods, and other products
    brought by named Nubian groups, Egyptians, and any other person.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Revenue officers are forbidden to demand or take additional things beyond
    the designated places or beyond what is intended for Khnemu's capital city.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The king gives stone-bearing and cultivable land to Khnemu and states that
    scribes, revenue officers, and royal inspectors must certify everything.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Masons, ore hewers, metal workers, smelters, stone sculptors, ore crushers,
    furnace workers, wood workers, and other craftspeople must pay tithe on natural
    products and quarried stones.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: An inspector oversees the weighing of metals, precious stones, and other materials
    needed for the House of Gold and for sculptors making and repairing images of
    the gods; specified materials and workers are exempted from tithing, and the god-house
    is to be abundant.
  category: action
  evidence_refs:
  - ev:8
