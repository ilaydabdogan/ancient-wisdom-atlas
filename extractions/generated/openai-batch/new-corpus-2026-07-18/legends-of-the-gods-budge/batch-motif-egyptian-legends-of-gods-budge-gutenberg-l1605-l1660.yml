canonical_text:
  quote: ''
  summary: A king at Elephantine enters Khnemu's temple, undergoes purification, offers
    sacrifice, and encounters Khnemu in a dream. Khnemu declares that he made the
    king, rebukes neglect of shrine resources, identifies himself with Nu and the
    Nile, and promises regular Nile inundation and agricultural abundance. The king
    wakes and issues a decree endowing Khnemu's worship with land, tithes, duties,
    administrative oversight, exemptions, and penalties for noncompliance.
  language: English
  quote_policy: summarized
