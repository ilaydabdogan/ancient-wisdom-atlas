canonical_text:
  quote: ''
  summary: The passage gives incantations against reptiles, noxious creatures, and
    poison. Apep, enemy of Ra, is addressed as a winding serpent and ordered to retreat;
    his destruction is threatened and the spell of Serq is said to drive back his
    power. A separate anti-poison formula commands poison to come forth and describes
    Horus using words of power against it and against biting fiends. A final formula,
    titled as a spell on the cat, summons Ra to his daughter after a scorpion sting
    on a lonely road, with poison circulating through her body.
  language: English
