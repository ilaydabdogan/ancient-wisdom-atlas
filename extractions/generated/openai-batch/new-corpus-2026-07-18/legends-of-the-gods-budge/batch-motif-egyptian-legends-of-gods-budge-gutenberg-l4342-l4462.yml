canonical_text:
  quote: ''
  summary: In a first-person narrative, Isis says she has come from the dwelling or
    prison where Set placed her. Thoth advises her to hide with her child and foretells
    the child's growth, strength, future throne, vengeance for his father, and rule
    over the Two Lands. Isis departs at evening accompanied by seven named scorpions.
    After a woman of quality closes her doors against Isis, the scorpions combine
    their venom on Tefen, who stings the son of Usert. A fire breaks out, no water
    is available, and rain falls out of season. Isis pities the child, declares her
    power over life and spells, lays hands on him, and recites an incantation commanding
    the poisons of the scorpions to come out and fall to the ground.
  language: English
  quote_policy: summarized
