canonical_text:
  quote: ''
  summary: 'The passage describes Egyptian priestly purity practices and dietary restrictions:
    abstention from certain foods, salt, wine, and fish; special water for the Apis
    Bull; wine libations interpreted as the blood of divine enemies; the vine said
    to have arisen from earth fattened by fallen enemies; local fish taboos connected
    with sacred fish and Nile flooding; and the sea described as fire-produced, corrupt,
    and outside normal nature.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Priests are said to avoid things that increase excrementitious substances
    and to abstain from pulse, sheep flesh, swine flesh, and, in solemn purifications,
    salt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives appetite-stimulation as the chief reason for excluding salt,
    while rejecting an explanation that salt is impure because insects die in it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Apis Bull is given water from a special well and is prevented from drinking
    Nile water, not because the Nile is impure, but because its water is considered
    nourishing and fattening.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The priests are described as wishing bodies to sit lightly around souls so
    that the mortal part does not weigh down the divine and immortal part.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The priests of the Sun at Heliopolis never carry wine into their temples because
    drinking wine under the inspection of their Lord and King is regarded as indecent.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Priests of other deities use wine sparingly, but in solemn purifications abstain
    from wine and devote themselves to study, meditation, hearing, and teaching divine
    truths.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kings, who are also described as priests, drink wine only in amounts prescribed
    in sacred books; the custom is said to have been introduced under Psammetichus.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Wine libations are described as being poured over altars as the blood of enemies
    who once fought against the gods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The vine is said to have first sprung from earth fattened by the bodies of
    those who fell in wars against the gods; heavy drinking is said to fill men with
    the blood of their ancestors.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: 'Different Egyptian communities abstain from different sea-fish: the inhabitants
    of Oxyrhynchus avoid angle-caught fish because of reverence for the Oxyrhynchus
    Fish, and the people of Syene abstain from the Phagrus Fish because it appears
    when the Nile begins to overflow.'
  category: relationship
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:11
  text: Priests entirely abstain from fish; on the ninth day of the first month, when
    other Egyptians eat fried fish before their doors, priests burn fish without tasting
    them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The sea is described as forced out of the earth by fire and as preternatural,
    corrupt, and morbid excrement rather than a normal element or part of the world.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: An editorial note compares priestly abstention from meat and fish with a Book
    of the Dead passage requiring ritual cleanliness, no meat or fish consumption,
    and no intercourse with women.
  category: other
  evidence_refs:
  - ev:7
