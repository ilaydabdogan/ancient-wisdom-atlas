canonical_text:
  quote: ''
  summary: The passage describes Rameses II petitioning Khensu Nefer-hetep to authorize
    and empower Khensu Pa-ari-sekher to go to Bekhten and heal the Princess by expelling
    a devil. The god's statue bows in assent, magical power called sa is transferred,
    and Khensu Pa-ari-sekher departs by boat with an escort. The editor adds explanatory
    notes on deputy gods and on the transfer of sa through ritual contact, embrace,
    offerings, milk, and divine bestowal.
  language: English
  quote_policy: summarized
