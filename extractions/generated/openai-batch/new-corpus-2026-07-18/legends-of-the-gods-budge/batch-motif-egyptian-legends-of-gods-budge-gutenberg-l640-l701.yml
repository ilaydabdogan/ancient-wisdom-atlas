canonical_text:
  quote: ''
  summary: After arranging heaven and life on earth, Ra recalls having nearly died
    from a serpent bite and issues divine measures against serpents and reptiles.
    He delegates tasks to Thoth, Keb, and Nu, promises protective hekau to magicians,
    snake-charmers, and Osiris, then appoints Thoth as his vicar in the Tuat to record
    and punish sinners. A following ritual rubric states that correct recital of the
    legend and specified purifications grant benefit in the Other World.
  language: English
  quote_policy: summarized
