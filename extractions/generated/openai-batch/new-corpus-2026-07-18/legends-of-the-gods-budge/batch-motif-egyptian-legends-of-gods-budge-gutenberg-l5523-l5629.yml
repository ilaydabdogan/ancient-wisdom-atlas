canonical_text:
  quote: ''
  summary: 'The passage recounts a version of the births of Osiris, Aroueris, Typhon,
    Isis, and Nephthys on five superadded days created after Hermes wins portions
    of time from Selene to evade a curse on Rhea''s childbirth. It then describes
    Osiris as civilizing king and world-traveler, Isis as vigilant governor during
    his absence, and Typhon''s conspiracy: a fitted decorated chest is used to trap
    Osiris at a banquet, fastened with nails and molten lead, and sent by river to
    the sea.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rhea, after secretly accompanying with Kronos, is discovered by Helios, who
    curses her not to be delivered in any month or year.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hermes, described as also in love with the goddess, plays dice with Selene
    and wins the seventieth part of each day; he joins these portions into five complete
    days and adds them to the former 360-day year.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The five added days are called Epagomenae and are observed as the birthdays
    of gods; a note lists the birthdays of Osiris, Horus, Set, Isis, and Nephthys.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Osiris is born on the first superadded day, and a voice announces his birth;
    an alternate account says Pamyles hears a command to proclaim Osiris's birth and
    later related rites are instituted.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Aroueris is born on the second day; Typhon on the third, by forcing a passage
    through a wound in his mother's side; Isis on the fourth in the marshes of Egypt;
    and Nephthys on the fifth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that the first two children are said to have been begotten
    by Helios, Isis by Hermes, and Typhon and Nephthys by Kronos.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Because Typhon's birthday was the third superadded day, kings treated it as
    unlucky, avoiding business and refreshment until evening.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Typhon is said to marry Nephthys; Isis and Osiris are said to have mutual
    affection and intercourse in their mother's womb, from which Aroueris/Horus the
    Elder/Apollo sprang.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Osiris becomes king of Egypt and civilizes his countrymen by teaching cultivation,
    laws, and reverence and worship of the gods.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Osiris travels over the rest of the world and persuades people through reasons
    conveyed in hymns, songs, and musical instruments rather than by force of arms;
    the passage says Greeks identified him with Dionysos or Bacchus for this reason.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: During Osiris's absence, Typhon has no opportunity to innovate in the state
    because Isis is vigilant in government and on guard.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: After Osiris returns, Typhon recruits seventy-two others and an Ethiopian
    queen named Aso for a conspiracy against him.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Typhon secretly measures Osiris's body, has a beautiful decorated chest made
    exactly to that size, brings it to a banquet, and offers it to whoever fits it.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: After the company tries the chest and Osiris lies in it last, the conspirators
    close the cover, fasten it with nails, and pour melted lead over it.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: The conspirators take the chest to the river, which carries it to the sea
    through the Tanaitic mouth of the Nile, a mouth later held in detestation by Egyptians
    according to the passage.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: Some date the event to the seventeenth day of Hathor, when the sun was in
    Scorpio, in the twenty-eighth year of Osiris's reign or life.
  category: setting
  evidence_refs:
  - ev:16
