candidate_motifs:
- id: motif:1
  label: Extra calendrical days created to bypass a birth curse
  taxonomy_refs:
  - sacred_birth
  - trickster_boundary
  - sacred_exchange
  basis: A curse bars delivery in any month or year, but Hermes wins time by dice
    and creates five days outside the prior 360-day year, on which the gods are born.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage gives the calendar-birth sequence directly; the taxonomy mapping
    to trickster_boundary and sacred_exchange is interpretive because Hermes wins
    rather than steals the time.
- id: motif:2
  label: Sacred births of divine children on special days
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  basis: The passage enumerates divine births on the five Epagomenae and gives parentage
    for the children.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: Some details are explicitly presented as variant accounts, especially
    regarding Osiris's proclamation and Pamyles.
- id: motif:3
  label: Abnormal birth of an unlucky antagonist
  taxonomy_refs:
  - sacred_birth
  - chaos
  basis: Typhon is born at the wrong time and by the wrong way through a wound in
    his mother's side; his birthday is unlucky and he later conspires against Osiris.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:12
  - ev:13
  - ev:14
  confidence: medium
  cautions: The passage does not use the abstract term chaos; that taxonomy link rests
    on Typhon's abnormal birth, unlucky day, and hostile role.
- id: motif:4
  label: Civilizing divine king teaches society and persuades through music
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: Osiris teaches cultivation, laws, and worship, and travels the world persuading
    people with hymns, songs, and musical instruments rather than arms.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage frames Osiris as king and civilizer; it does not call him
    a culture hero explicitly.
- id: motif:5
  label: Vigilant divine queen protects the realm during the king's absence
  taxonomy_refs:
  - royal_legitimacy
  - divine_beloved
  basis: Isis governs vigilantly while Osiris is away, preventing Typhon from changing
    the state.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The queenly protection pattern is present, but the passage gives limited
    detail about Isis's authority beyond vigilance in government.
- id: motif:6
  label: Banquet trap using a body-fitted chest sent onto water
  taxonomy_refs:
  - ark_vessel
  basis: Typhon has a chest made to Osiris's exact measure, displays it at a banquet,
    closes Osiris inside it, seals it with nails and lead, and sends it by river to
    the sea.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
  - ev:15
  confidence: medium
  cautions: The chest is a trap rather than a protective ark; the passage segment
    does not narrate Osiris's later recovery, resurrection, or return.
- id: motif:7
  label: Divine pairings within a birth group
  taxonomy_refs:
  - sacred_marriage
  - sibling_pair
  - divine_beloved
  basis: The passage states that Typhon married Nephthys and that Isis and Osiris
    had mutual affection and intercourse in the womb, producing Aroueris in that account.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage presents these relationships briefly and as part of a variant
    mythic genealogy.
comparison_claims:
- id: claim:1
  claim: The passage itself reports that Greeks identified Osiris with Dionysos or
    Bacchus because Osiris persuaded people through hymns, songs, and musical instruments
    during his civilizing travels.
  claim_level: same_function
  target: Greek Dionysos / Bacchus
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: This is an identification reported within the passage, not an independent
    demonstration of historical contact or full equivalence between the figures.
- id: claim:2
  claim: The passage states that the Pamylia instituted in memory of Pamyles proclaiming
    Osiris's birth closely resembled the Greek Phallephoria or Priapeia.
  claim_level: same_function
  target: Greek Phallephoria / Priapeia rites
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage asserts close resemblance but provides little ritual detail
    in this excerpt.
