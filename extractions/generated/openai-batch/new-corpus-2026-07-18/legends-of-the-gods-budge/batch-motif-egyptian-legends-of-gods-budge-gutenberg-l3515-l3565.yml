canonical_text:
  quote: Isis the magician avenged her brother.
  summary: A hymn praises a divine addressee with horizon, light, crown, and star
    imagery. Isis protects and avenges her brother, seeks him while mourning, uses
    magical speech, makes light and air through her feathers and wings, raises his
    helpless members, draws his essence, makes an heir, and suckles the child in secrecy.
    Horus, son of Osiris and Isis, grows strong, and divine assemblies gather to confer
    rightful rank and sovereignty upon him.
  language: English
  quote_policy: quoted
