  summary: The passage introduces Budge's account of Isis and Osiris as derived from
    Plutarch, notes gaps and changes in the Egyptian tradition, describes Ptolemaic
    and Greco-Roman modifications of the cult, and summarizes a mythic sequence in
    which Set murders Osiris, Isis seeks and revivifies Osiris, conceives Horus, raises
    him in the Delta, and seats him on Osiris's throne after Horus defeats Set. It
    also describes Isis as a universal mother, fertility power, light and Nile-flood
    figure, and giver of peace and immortality to the dead.
  language: English
  quote_policy: summarized
