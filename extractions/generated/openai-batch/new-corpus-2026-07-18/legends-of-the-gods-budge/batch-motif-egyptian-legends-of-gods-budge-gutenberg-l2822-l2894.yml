canonical_text:
  quote: ''
  summary: Heru-Behutet takes the form of the Winged Disk, stands on the front of
    the Boat of Ra, and places Nekhebet and Uatchet beside him as two serpents. He
    pursues enemies who flee in fear and appear in crocodile and hippopotamus forms,
    attacks them with metal weapons, and destroys them in several places. Ra and Thoth
    speak during the pursuit, explaining or instituting place names and divine titles.
    At Heben, Heru-Behutet slays enemies including a male hippopotamus, cuts up their
    bodies, distributes their remains, and receives titles connected with the Winged
    Disk and the smiting of enemies.
  language: English
  quote_policy: summarized
