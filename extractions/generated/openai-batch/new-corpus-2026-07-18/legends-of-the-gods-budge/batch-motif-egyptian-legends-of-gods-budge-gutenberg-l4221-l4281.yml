canonical_text:
  quote: O evil poison which is in any member of this Cat which is under the knife,
    come, issue forth upon the earth.
  summary: An incantation addresses a poisoned Cat, identifies its body parts with
    those of various gods, invokes divine actions to overthrow or cut apart poison
    from serpents, scorpions, and reptiles, and commands the poison to leave for the
    earth. Isis and Nephthys weave and spin against the poison.
  language: English
  quote_policy: quoted
