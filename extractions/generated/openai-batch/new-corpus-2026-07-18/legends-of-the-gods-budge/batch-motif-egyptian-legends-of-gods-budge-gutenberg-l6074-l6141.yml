  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Isis established rites and mysteries in memory of what she had done and suffered,
    as types and images of her deeds, intended to encourage piety and give consolation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Isis and Osiris are described as having been translated from good daemons
    into gods, with mixed honours due to gods and daemons.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Osiris is identified with Pluto, and Isis is identified with Proserpine.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Typhon is held in contempt by the Egyptians, and red is associated with him;
    people with ruddy complexions are treated with contumely.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Because the ass is usually reddish, men of Koptos are said to sacrifice asses
    by casting them down precipices.
  category: action
  evidence_refs:
  - ev:3
