literal_observations:
- id: obs:1
  text: Daemons are described through Greek authors as beings that may be good or
    bad, mediate between gods and humans, carry prayers and blessings, and may undergo
    punishment and purification.
  category: attribute
  evidence_refs:
  - ev:1
