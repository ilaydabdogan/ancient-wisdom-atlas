  summary: The passage summarizes Greek and Egyptian views of daemons, classifies
    Typhon among them, says Isis punished Typhon and established rites and mysteries
    in memory of her deeds, and describes Egyptian contempt for Typhon through red
    color symbolism, ass symbolism, sacrifice, priestly sealing, and related mythic
    references.
