canonical_text:
  quote: ''
  summary: An incantation invokes deities to remove poison, commands hostile beings
    in the waters to retreat from Osiris, describes divine magical protection through
    Ra, Sekhet, Thoth, and Heka, and ends with an outcry concerning a Cat, the Abtu
    Fish, Khnemu’s self-identification, and Ra’s order to slaughter a wicked Sebau
    fiend.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ra-Khuti, Shu, and Isis are called to come to a female figure described respectively
    as daughter, wife, and sister, and Isis is asked to deliver her from evil poison
    in all her members.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods are asked to overthrow the evil poison in all the members of the
    Cat that is under the knife.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: An aged figure who renews youth and makes himself a boy is asked to grant
    that Thoth may come at the speaker’s voice and turn back Netater.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Osiris is said to be on the water, with the Eye of Horus with him, and a great
    Beetle spreading over him.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Water-dwellers including crocodiles, fish, an Enemy, dead persons, and fiends
    are commanded to get back, not lift their faces, and permit Osiris to go to Busiris.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The nostrils and throats of the water-dwellers are to be closed or stopped
