  text: The Eye of Horus is over Osiris on the water to turn the attackers’ faces
    upside down and set them on their backs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ra shuts the mouths of the water-dwellers, Sekhet stops their throats, Thoth
