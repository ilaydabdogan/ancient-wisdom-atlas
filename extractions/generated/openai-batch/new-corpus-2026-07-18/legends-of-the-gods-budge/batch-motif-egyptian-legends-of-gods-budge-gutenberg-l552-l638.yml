canonical_text:
  quote: ''
  summary: Ra orders fruit from Elephantine, has it crushed and mixed with human blood
    into beer, and uses the drink to intoxicate Hathor so that she stops slaughtering
    humans. Ra later becomes weary of mankind, is carried away by Nut in cow form,
    forgives repentant men who kill his enemies, ascends to heaven, creates heavenly
    fields, stars, and sky supports, and establishes a cosmological picture of the
    Cow of Heaven, the Sun Boats, and the heavenly realm of Ra and the dead.
  language: English
  quote_policy: summarized
