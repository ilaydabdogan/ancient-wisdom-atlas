canonical_text:
  quote: ''
  summary: Osiris returns from the other world to instruct Horus in warfare and test
    his readiness. Horus declares that avenging injuries to father and mother is the
    most glorious act. Defections from Typhon include Thoueris, pursued by a serpent
    that Horus's soldiers kill and commemorate ritually. Horus defeats and captures
    Typhon, but Isis releases him. Horus reacts by attacking Isis and removing her
    royal crown, after which Hermes supplies a bovine head substitute. Typhon challenges
    Horus's legitimacy, which is upheld by divine decree. Further battles end in Typhon's
    defeat. Isis later has union with Osiris after his death and gives birth to Harpokrates,
    born prematurely and lame in the lower limbs.
  language: English
  quote_policy: summarized
