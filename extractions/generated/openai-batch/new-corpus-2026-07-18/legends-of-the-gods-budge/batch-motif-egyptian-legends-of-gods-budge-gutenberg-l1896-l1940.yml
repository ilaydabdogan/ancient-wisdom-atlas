canonical_text:
  quote: I have come from heaven to heal the child for his mother.
  summary: Thoth reassures Isis and Nephthys, heals the poisoned child Horus by words
    of power and the life-fluid of Ra, and then returns to the Boat of Ra as the solar
    journey resumes. The passage also describes heavenly rejoicing, Isis's renewed
    hope for Horus's royal succession, Thoth's promised advocacy for Horus in the
    Judgment Hall of Anu, Ra's advocacy, and the life-restoring power of Isis's spells.
    A closing editorial note identifies the material as texts on the Metternich Stele
    and cautions that parts are confused or corrupt.
  language: English
  quote_policy: quoted
