canonical_text:
  quote: ''
  summary: The passage first summarizes Horus, son of Isis and Osiris, being acknowledged
    as successor to the throne of Keb by divine assemblies and approved by Neb-er-tcher.
    It then introduces the stele legend of Khensu Nefer-hetep and the Princess of
    Bekhten, including scholarly framing and the narrative of Rameses II receiving
    tribute and a foreign bride, later sending a learned magician to treat an afflicted
    princess, and finally petitioning Khensu when human exorcism fails.
  language: English
