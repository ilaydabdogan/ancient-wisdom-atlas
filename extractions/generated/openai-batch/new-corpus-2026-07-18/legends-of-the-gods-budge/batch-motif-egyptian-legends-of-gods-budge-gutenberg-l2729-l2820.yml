canonical_text:
  quote: ''
  summary: Ra-Heru-Khuti travels by boat with his followers. Heru-Behutet, identified
    as son of Ra, attacks Ra's enemies in the form of the great Winged Disk, returns
    victorious, receives protective titles, and later defeats enemies who have taken
    crocodile and hippopotamus forms in the water. The passage also explains several
    place and object names and links the deeds to the Book of Slaying the Hippopotamus.
  language: English
