canonical_text:
  quote: ''
  summary: The god Neb-er-tcher speaks as a self-created creator who came into being
    as Khepera from primeval matter, used his own name, spell, and heart to found
    and make things, emitted Shu and Tefnut, and describes the Eye, tears, plants,
    humans, divine offspring, and the ritual overthrow and punishment of Apep.
  language: English
  quote_policy: summarized
