canonical_text:
  quote: ''
  summary: 'The passage summarizes a creation legend: Keb and Nut produce five gods;
    divine pairs marry before birth and bear sons; Osiris is linked to the primeval
    substance of Khepera/Neb-er-tcher; the sun and moon are described as divine Eyes;
    humans arise from the god''s tears; living creatures reproduce; and the legend
    is framed within Egyptian ideas about a remote creator, subordinate gods, magic,
    and a monster opposing sunrise.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Keb''s embraces cause Nut to bring forth five gods at one birth: Osiris,
    Horus, Set, Isis, and Nephthys.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Osiris and Isis marry before their birth, and Isis brings forth a son called
    Horus; Set and Nephthys also marry before their birth, and Nephthys brings forth
    a son named Anpu or Anubis.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Khepera, speaking as Neb-er-tcher, singles out Osiris, calls his name Ausares,
    and identifies him with the essence of the primeval matter from which Khepera
    himself is formed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Osiris is described as the same substance as the Great God, as a reincarnation
    of his great-grandfather, as a great ancestral spirit, as an earthly benefactor
    of mankind, and as a heavenly saviour of souls.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The sun is called the Eye of Khepera or Neb-er-tcher; a calamity extinguishes
    its light, and the god makes a second Eye, the Moon, giving it some of the Sun's
    splendour and a place in his Face.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Moon is said to rule throughout the earth and to have special powers over
    the production of trees, plants, vegetables, herbs, abundant crops, and harvests.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Men and women do not spring from the earth but come directly from the body
