    them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Men and women come into being from tears fallen from the god's eyes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The god says that he created creeping things of all kinds; living creatures
