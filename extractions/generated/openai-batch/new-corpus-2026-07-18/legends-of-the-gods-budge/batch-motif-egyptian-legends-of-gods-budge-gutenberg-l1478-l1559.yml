canonical_text:
  quote: ''
  summary: Editorial introduction to the Sahal inscription containing a legend of
    Khnemu and a seven-year famine. The passage summarizes a famine in the reign of
    Tcheser, attributed physically to low Nile floods and mythically to neglect of
    Khnemu's worship. When Tcheser restores Khnemu's offerings, sanctuary, and priesthood,
    Khnemu allows Hapi to pour waters from cataract caverns, restoring flood, crops,
    and abundance. The passage also discusses the inscription's likely late date and
    compares the seven-year famine duration with Genesis and later Arab historical
    famine accounts.
