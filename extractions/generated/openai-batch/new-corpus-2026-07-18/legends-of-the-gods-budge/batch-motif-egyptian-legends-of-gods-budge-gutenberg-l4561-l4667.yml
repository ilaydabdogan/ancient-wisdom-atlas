canonical_text:
  quote: ''
  summary: The passage presents Egyptian incantations against reptiles and harmful
    creatures. A divine speaker identifies with solar and cosmic powers, commands
    poison to leave the afflicted person, and links the formula to Menu and Osiris-Mnevis.
    A narrative then states that Horus was bitten or stung while Isis was away making
    a libation for Osiris; Horus cried out, divine attendants responded, and Heaven
    ordered his healing. A hymn to Horus, recited by Thoth over waters and land, praises
    Horus as son of Osiris and Isis and asks him to use magical utterances to protect
    people from reptiles, lions, crocodiles, biting mouths, poison, and stinging creatures.
  language: English
  quote_policy: summarized
