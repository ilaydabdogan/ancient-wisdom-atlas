canonical_text:
  quote: ''
  summary: The passage introduces the legend of Ra and Isis, noting its Turin papyrus
    source and prior publications. It explains that Ra had supplied protective spells
    against serpents through Thoth, describes Ra as creator and many-named, and presents
    Isis as a woman skilled in spells who seeks mastery over gods, spirits, heaven,
    and earth. Isis concludes that she needs Ra's secret name, catches Ra's saliva
    after he has grown old and dribbles, mixes it with dust, fashions a poison-fanged
    serpent with spells, and places it on Ra's daily path. The passage ends with an
    ethnographic aside comparing this serpent ambush to a Banyoro puff-adder practice
    for killing buffaloes.
  language: English
  quote_policy: summarized
