  summary: Ra, described as self-begotten and sovereign over humans, gods, and things,
    hears men and women complain that he has grown old. He secretly summons his Eye,
    several named gods, ancient father- and mother-gods, Nu, and the Eye's ministers
    so humans will not flee. The gods assemble and bow before Ra. Ra asks Nu and the
    ancient gods to advise him about the complaining humans created by his Eye, saying
    he will not slay them until he has heard their counsel.
