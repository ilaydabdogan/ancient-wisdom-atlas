canonical_text:
  quote: ''
  summary: Isis places a serpent on Ra's path, and the serpent bites and poisons him.
    Ra summons gods skilled in magic, and Isis presses him to reveal his hidden name.
    After Ra's pain increases, his secret name passes into Isis's possession; Isis
    then uses a spell to drive out the poison. The passage presents the spell as an
    anti-venom charm when written on papyrus or linen or steeped in water and drunk,
    and it compares this to later Egyptian and Sudanese religious charm-water practices.
  language: English
  quote_policy: summarized
