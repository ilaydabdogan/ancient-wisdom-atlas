canonical_text:
  quote: ''
  summary: The passage names sacred places, waters, a ship, a holy acacia tree, domains,
    and ritual offices connected with Heru-Behutet. It recounts Heru-Behutet and his
    blacksmiths/bodyguard destroying enemies, Ra granting cultic honors to those blacksmiths,
    and Thoth assigning place names after them. In the next section, the Boat of Ra
    sails east after fleeing enemies; Heru-Behutet transforms into a crowned lion
    with a human face and tears enemies apart, after which Ra compares him to a lion
    in his lair.
  language: English
  quote_policy: summarized
