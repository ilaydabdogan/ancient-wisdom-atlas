  quote: '"I am Khnemu, who fashioned thee."'
  summary: The passage describes Khnemu's god-house and its surrounding river, mountains,
    quarries, stones, and resident deities at Abu/Elephantine. The narrator enters
    Khnemu's temple, undergoes purification, participates in offerings, prays before
