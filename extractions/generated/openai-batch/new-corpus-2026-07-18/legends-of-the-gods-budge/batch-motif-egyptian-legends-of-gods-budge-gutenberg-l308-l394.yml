canonical_text:
  quote: ''
  summary: The passage summarizes an Egyptian creation account in which Neb-er-tcher,
    an invisible everlasting creator, assumes the form of Khepera. Before heaven and
    earth exist, the world-ocean Nu contains inert germs of life. Khepera emerges
    from Nu, creates himself and a standing-place through uttered names and heart/will,
    and is assisted by Maat in ordering visible forms. The account then describes
    the generation of Shu and Tefnut from Khepera, the birth of Keb and Nut from Shu
    and Tefnut, the rising of the sun from Nu, and the daily separation and reunion
    of sky and earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The story of creation is said to be told by Neb-er-tcher, whose name is glossed
    as Lord to the uttermost limit and whose character is described as everlasting,
    almighty, invisible, and filling all space.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A desire to create the world arises in Neb-er-tcher, and he takes the form
    of Khepera, who is described as the creator among Egyptian gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before the heavens and earth are created, a vast mass of water or world-ocean
    called Nu exists, containing the germs of all later living things in an inert
    and helpless state.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Khepera raises himself out of Nu into empty space and finds no place on which
    to stand.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: One version says Khepera gives being to himself by uttering his own name;
    another says he uses words to provide a place on which to stand.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage describes Khepera as thinking in his heart what he wishes to create
    and causing the thought to take concrete form by uttering its name; a second version
    also mentions a heart-soul assisting him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Maat assists Khepera in arranging thoughts and visible forms; she is described
    as the goddess of law, order, and truth and as helping him lay the foundation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage explicitly compares Maat's role in this legend to Wisdom as described
    in Proverbs 8.
  category: other
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Khepera has union with his own shadow, and offspring proceed from his body
    as the gods Shu and Tefnut; the passage notes an older form assigning their production
    to masturbation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Shu and Tefnut are identified as personifications of air and dryness, and
    liquids, respectively, so that materials for the atmosphere and sky come into
    being with them.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Shu and Tefnut unite, and their offspring are Keb, the Earth-god, and Nut,
    the Sky-goddess.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The sun rises out of the watery abyss of Nu, shines on the world, and produces
    day; early tradition is said to regard the sun or its light as a form of Shu.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Keb and Nut are united in an embrace; the coming of light separates them,
    Shu supports Nut above the earth during the day, and at sunset Nut descends until
    she rests on Keb.
  category: sequence
  evidence_refs:
  - ev:8
