canonical_text:
  quote: ''
  summary: The passage begins with a royal titulary for Rameses, describing him through
    divine parentage, bull imagery, and military sovereignty. It then narrates tribute
    brought in Neheru, the Prince of Bekhten offering his eldest daughter, her elevation
    as Great Royal Wife Ra-neferu, and a later embassy asking the king to send learned
    help for Bent-Resht, Ra-neferu's younger sister. The king sends the royal scribe
    Tehuti-em-heb, who finds Bent-Resht possessed by an evil hostile spirit; the Prince
    of Bekhten then asks that a god be brought to contend with the spirit.
  language: English
  quote_policy: summarized
