canonical_text:
  quote: ''
  summary: Ra’s poison continues to burn until Isis insists that he reveal the name
    he has not yet spoken. Ra allows Isis to search him, and his name passes from
    his body into hers. He withdraws from the gods, his throne in the Boat of Millions
    of Years is empty, and Isis instructs Horus that Ra must swear to give his two
    eyes. Ra yields his name, and Isis commands the poison to leave him and fall to
    the ground. The text then gives the words as a healing formula to be recited over
    images of Temu, Heru-Hekennu, Isis, and Horus.
  language: English
  quote_policy: summarized
