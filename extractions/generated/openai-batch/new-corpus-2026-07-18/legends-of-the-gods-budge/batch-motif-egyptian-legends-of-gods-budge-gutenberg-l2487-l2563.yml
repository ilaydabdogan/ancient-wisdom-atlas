canonical_text:
  quote: ''
  summary: Instructions for reciting Chapter V prescribe anointing, offerings, purification,
    ritual posture, and a Maat image on the tongue. The passage states that recitation
    makes the practitioner like Ra at birth, protects through words of power, grants
    life in the Underworld, and strengthens a divine boat. It also includes Ra's declaration
    of cosmic age and creator status, a hymn to an eternal creator, serpent imagery,
    and two named gods who guard heaven and earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The reciter is instructed to anoint himself with oil and unguent, hold incense
    offerings, place natron behind the ears, put salve on the lips, wear a new double
    tunic and white sandals, purify the body with Nile-flood water, and draw a figure
    of Maat on the tongue with green ochre.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Thoth wishes to recite the composition on behalf of Ra, he must perform
    a sevenfold purification for three days; priests and ordinary men are instructed
    to do likewise.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The reciter is instructed to stand in a defined place described as a circle
    or angle, keep his eyes fixed on himself, compose his members, and not move away
    from the place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that a man who recites the words will be like Ra on the
    day of his birth, and that his possessions and house will endure.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ra, called the Aged One, embraces the god Nu and speaks to gods who came forth
    in the east of the sky.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ra declares that he made the heavens, set the earth in order, created the
    gods, existed for an exceedingly long period, and has a soul older than time,
    identified with the souls of several deities and beings.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The speaker says that whoever says the words protects himself by words of
    power and identifies himself as Hekau, Ra, the Light-god, the soul of Ra, and
    Heka; the passage also says the formula may make the enemies of Ra fall.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A hymn addresses a lord of eternity and creator of everlastingness, describing
    him as creator of a woman, a goddess with her face on her breast, and a serpent
    standing on its tail.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Two named great gods in the east of the sky are described as wardens of heaven
    and earth who make firm the secret places.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that whoever recites the chapter will have life in Neter-kher,
    or the Underworld, and the speaker says he has strengthened the boat with the
    company of the gods by means of words of power.
  category: speech
  evidence_refs:
  - ev:9
