canonical_text:
  quote: I am the creator of everything which came into being
  summary: A creation account in which Neb-er-tcher, speaking in the form of Khepera,
    describes self-origination, creation from Nu, the production of Shu and Tefnut,
    the Eye, the origin of humans from divine tears, the Moon as a second Eye, and
    later divine generations.
  language: English
  quote_policy: quoted
