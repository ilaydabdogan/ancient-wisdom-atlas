  summary: The passage argues that Greek philosophers, especially Pythagoras, learned
    from Egyptian priests and imitated Egyptian symbolic and riddling modes of expression.
    It gives examples of Egyptian signs and emblems used to represent gods, cosmic
    realities, justice, animals, solar imagery, and royal cruelty, then urges Clea
    to interpret divine myths philosophically rather than literally.
