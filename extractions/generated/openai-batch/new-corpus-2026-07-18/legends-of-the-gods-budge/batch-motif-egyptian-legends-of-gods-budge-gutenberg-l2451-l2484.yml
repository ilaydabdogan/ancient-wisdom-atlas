canonical_text:
  quote: ''
  summary: In Chapter IV of the legend, a deity summons Thoth, states an intention
    to depart from heaven and make light and the god of light in the Tuat and the
    Land of Caves, and assigns Thoth to write there and punish iniquitous or rebellious
    workers. Thoth is placed in the deity's place as the Asti of Ra and receives powers
    associated with the coming into being of the ibis bird, the tekni bird, the Moon-god
    Aah, and the dog-headed Ape of Thoth. Thoth is then described as receiving offerings
    and praise.
  language: English
  quote_policy: summarized
