canonical_text:
  quote: ''
  summary: Khensu Pa-ari-sekher arrives in Bekhten after a long journey, heals a princess
    possessed by a devil, receives the devil's submission, and directs that a festival
    be held before the devil departs. The Prince keeps the god's statue in Bekhten,
    but after a vision of the god as a golden hawk flying to Egypt, he allows the
    priests to return with the statue and gifts. The statue is brought back to Egypt,
    the gifts are handed over to Khensu Nefer-hetep, and Khensu Pa-ari-sekher returns
    to his temple in peace.
  language: English
  quote_policy: summarized
