canonical_text:
  quote: ''
  summary: 'The passage summarizes Plutarch’s interpretive sections on the Isis-Osiris
    material: eclipse allegory, the need for two opposed principles, comparison with
    Magian Ormazd and Ahriman, a divine egg entered by Ahriman, moral symbolism of
    Osiris and Typhon, Typhon’s animal associations, and an editorial caution that
    Egyptian texts give no proof for many of Plutarch’s statements.'
