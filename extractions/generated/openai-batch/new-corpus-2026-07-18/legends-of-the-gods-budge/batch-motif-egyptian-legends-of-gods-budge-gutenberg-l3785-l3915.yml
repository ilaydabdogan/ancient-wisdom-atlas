canonical_text:
  quote: ''
  summary: A royal dispatch in the reign of Neter-Khat/Tcheser describes a seven-year
    failure of the Nile flood and widespread famine. The king seeks knowledge of Hapi's
    birthplace, presiding deity, and form through written temple lore. Matar returns
    with instruction about Abu/Elephantine, the Qerti waters, the bed of Hapi, and
    the role of Khnemu in opening the water source and administering resources.
  language: English
  quote_policy: summarized
