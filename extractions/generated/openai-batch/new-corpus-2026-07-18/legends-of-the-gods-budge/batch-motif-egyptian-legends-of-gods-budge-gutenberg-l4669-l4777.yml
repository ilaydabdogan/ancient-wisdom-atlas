  quote: '"I am Thoth, I have come from heaven to make protection of Horus"'
  summary: 'The passage gives protective incantations against scorpion or evil poison
    in Horus and in a lion or cat under the knife. It then continues Isis''s narrative:
    she conceives and gives birth to Horus, hides him from an enemy, leaves to seek
    food, and returns to find him lifeless and poisoned. Isis laments, and the people
    of the papyrus swamps gather to mourn, but no one knows how to restore the child
    to life within this excerpt.'
