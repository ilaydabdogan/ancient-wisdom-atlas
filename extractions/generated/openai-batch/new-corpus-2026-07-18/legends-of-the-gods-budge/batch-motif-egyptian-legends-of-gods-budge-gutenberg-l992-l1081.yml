candidate_motifs:
- id: motif:1
  label: Divine combat against Set and hostile fiends
  taxonomy_refs: []
  basis: The passage repeatedly presents Horus or allied deities fighting, spearing,
    fettering, beheading, or destroying Set and his associated enemies.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  - ev:7
