comparison_claims:
- id: claim:1
  claim: The passage itself states that there are multiple Egyptian forms of the fight
    involving Set, including conflicts with Heru-ur, Ra, Heru-Behutet, Osiris, and
    Horus son of Isis.
  claim_level: same_motif
  target: Egyptian variants of the Set combat tradition
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal editorial comparison within the supplied passage,
    not an independently verified historical reconstruction.
- id: claim:2
  claim: The passage characterizes the older combat as an opposition of light and
    darkness and later as a moral opposition of right and truth against sin and wickedness.
  claim_level: same_function
  target: Light/darkness and good/sin opposition in interpretations of Horus or Sun-god
    versus Set
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim reflects the passage's editorial interpretation and is not
    demonstrated by additional primary evidence within the excerpt.
- id: claim:3
  claim: The passage states that the Coptic legend of St. George slaughtering the
    dragon is a Christian adaptation of the Horus and Set legend.
  claim_level: historical_contact
  target: Coptic St. George dragon-slaying legend
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The adaptation claim is explicitly asserted in the passage, but the
    excerpt provides no detailed transmission evidence.
