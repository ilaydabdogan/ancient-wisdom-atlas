canonical_text:
  quote: ''
  summary: The passage gives plate captions and narrative episodes in which Horus
    and associated deities defeat Set and enemy fiends in multiple animal or composite
    forms. Set is cursed, wounded, fettered, judged by Ra, beheaded, later revives
    as a roaring serpent, escapes, and is defeated again. Horus guards Osiris with
    Isis's aid, receives honorific naming, fights alongside Blacksmiths, and in a
    final northern fight at Tanis takes a lion-human form and destroys enemies, carrying
    off their tongues as victory symbols. An editorial paragraph compares forms of
    the Horus/Set conflict and states that the Coptic St. George dragon-slaying legend
    is a Christian adaptation of it.
  language: English
  quote_policy: summarized
