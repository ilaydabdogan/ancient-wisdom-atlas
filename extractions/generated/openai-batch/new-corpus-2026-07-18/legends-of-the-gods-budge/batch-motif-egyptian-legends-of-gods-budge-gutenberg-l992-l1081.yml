- id: motif:2
  label: Serpent adversary and revived enemy
  taxonomy_refs:
  - serpent
  - shapeshifter
  basis: Set comes to life again, changes into a roaring serpent, hides in the ground,
    and resumes conflict after escaping.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage identifies Set as a serpent in this episode; broader serpent
    symbolism is not inferred beyond the literal transformation.
- id: motif:3
  label: Shapeshifting divine combatants
  taxonomy_refs:
  - shapeshifter
  basis: Horus figures take hawk-composite forms, Set becomes a serpent and is depicted
    as a crocodile, Horus son of Isis becomes a hawk-headed staff, and Horus later
    becomes a lion with a human face.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage provides multiple transformations, but not a theory of shapeshifting
    beyond these episodes.
- id: motif:4
  label: Divine judgment and sanctioned punishment
  taxonomy_refs:
  - divine_judgment
  basis: Set is dragged before Ra; Ra praises Horus and orders Set and his fiends
    given to Isis and Horus, after which Horus beheads them in the presence of Ra
    and Isis.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage describes a divine decision about disposal rather than a full
    trial scene.
- id: motif:5
  label: Divine parent-child protection
  taxonomy_refs:
  - divine_parent_child
  basis: Isis appoints Horus of Behutet to be protecting deity of her son Horus, and
    Ra is identified as father in the renewed conflict episode.
  evidence_refs:
