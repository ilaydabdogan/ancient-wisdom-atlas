canonical_text:
  quote: ''
  summary: The Lord Buddha tells Subhuti that a disciple devoted to this Scripture
    may be despised because of former-life transgression, yet the resulting merit
    expiates that transgression and leads to supreme spiritual wisdom. He compares
    future scripture study with his own past service to myriad Buddhas before Dipankara,
    describes the Scripture’s meaning and rewards as incomprehensible, answers Subhuti’s
    question about subduing desire through non-attachment to ideas of sentient life,
    and teaches that no fixed Law can be said to confer supreme spiritual wisdom.
    The passage also recounts Dipankara Buddha’s prophecy at the Buddha’s initiation
    and concludes with examples of nominal designation, including systems of Law and
    a great physical body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lord Buddha says that a good male or female disciple devoted to observing
    and studying this Scripture may be despised or lightly esteemed because of grievous
    transgression committed in a previous life and present retribution.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lord Buddha says that the compensating merit acquired in this life will
    fully expiate the former-life transgression and recompense the disciple with attainment
    of supreme spiritual wisdom.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Lord Buddha recalls that before the advent of Dipankara Buddha he served
    and received religious instruction from myriad Buddhas, with blameless conduct.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Lord Buddha says that a future disciple who rigorously observes and studies
    this Scripture will acquire merit exceeding his own merit from service to those
    myriad Buddhas beyond proportion or analogy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Lord Buddha says that elaborating the nature or extent of this merit might
    make hearers delirious or doubtful, because the Scripture’s meaning and rewards
    are beyond ordinary comprehension.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A note glosses the doubtful reaction as literally becoming as doubtful as
    a fox.
  category: other
  evidence_refs:
  - ev:7
- id: obs:7
  text: Subhuti asks what immutable Law should support the mind of a disciple desiring
    supreme spiritual wisdom and bring every inordinate desire into subjection.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:8
  text: The Lord Buddha replies that a disciple should habituate the mind to become
    oblivious to every idea of sentient life, while also recognizing that there is
    no one to whom that idea has become oblivious.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:9
  text: The Lord Buddha says that if an enlightened disciple retains ideas of sentient
    life as an entity, a being, a living being, or a personality, that disciple has
    not attained supreme spiritual wisdom.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:10
  text: The Lord Buddha says there is no Law by which a disciple may be defined as
    having obtained supreme spiritual wisdom.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: When asked whether any Law was bequeathed to the Lord Buddha by Dipankara
    Buddha for attaining supreme spiritual wisdom, Subhuti replies that no such Law
    was bequeathed.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Lord Buddha says that no Law exists by which he obtained supreme spiritual
    wisdom, and links this to Dipankara Buddha’s prophecy at his initiation that he
    would become Sakyamuni Buddha.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Lord Buddha says that every Law is comprehended in the word Buddha, that
    Buddhic Law is synonymous with every moral and spiritual Law, and that systems
    of Law are merely termed systems of Law rather than being real systems of Law.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: The Lord Buddha asks Subhuti about a man with a great physical body, and Subhuti
    replies that the body’s proportions do not possess real greatness but are merely
    termed a great body.
  category: speech
  evidence_refs:
  - ev:14
