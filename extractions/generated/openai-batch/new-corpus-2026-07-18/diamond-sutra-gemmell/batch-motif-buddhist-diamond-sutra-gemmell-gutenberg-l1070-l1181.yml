canonical_text:
  quote: ''
  summary: The passage first records a note on Sakyamuni's alms-bowl as a sacred relic
    with a journey through human and cosmic locations. It then presents Subhuti respectfully
    asking Lord Buddha what Law sustains a disciple seeking supreme spiritual wisdom
    and subdues desire. Buddha replies that he will teach such a Law. The following
    teaching says wisdom subdues desire, directs deliverance of all forms of sentient
    life in Nirvana, denies fixed concepts of entity or personality, and instructs
    disciples to practice charity without attachment to sensory phenomena.
  language: English
  quote_policy: summarized
