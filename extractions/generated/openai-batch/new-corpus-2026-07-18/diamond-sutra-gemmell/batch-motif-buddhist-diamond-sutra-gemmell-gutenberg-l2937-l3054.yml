canonical_text:
  quote: ''
  summary: 'Subhuti questions the Lord Buddha about future hearers, sentient beings,
    and whether supreme spiritual wisdom involves obtaining anything real or tangible.
    The Buddha answers by denying fixed categories: beings, Law, supreme wisdom, and
    laws of goodness are treated as conventional names rather than independently graspable
    realities. Annotations compare these teachings with other Buddhist renderings,
    Chinese commentary, Jain indivisibility, Vedic above/below imagery, and the six
    Paramita as an open door to truth.'
  language: English
  quote_policy: summarized
