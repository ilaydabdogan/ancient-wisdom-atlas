canonical_text:
  quote: the phenomena of life may be likened unto a dream, a phantasm, a bubble,
    a shadow, the glistening dew, or lightning flash
  summary: The Buddha teaches Subhuti that ideas of entity, being, living being, personality,
    and visible objects are unreal or merely named. Those aspiring to supreme spiritual
    wisdom should understand phenomena without grasping tangible evidence. A disciple
    who preserves and explains a four-line stanza of the scripture gains greater merit
    than one who gives immeasurable spheres filled with seven treasures. The scripture
    should be explained without assuming the permanence or reality of earthly phenomena,
    which are likened to transient images such as a dream, bubble, dew, and lightning.
    The assembly rejoices and departs to practice the teaching.
  language: English
  quote_policy: quoted
