  summary: Prefatory Buddhist citations contrast changing phenomena with the Buddha's
    changeless nature through cloud, moon, ship, shore, and water-reflection images.
    Chapter 30 presents a dialogue in which the Lord Buddha and Subhuti discuss infinite
    worlds reduced to particles of dust, the nominal status of particles and worlds,
    and the incomprehensibility of belief in the unity or eternity of matter. Footnotes
    and annotations elaborate the evanescence of forms, translation parallels, and
    a Chinese-text interpretation of matter's forms and qualities.
