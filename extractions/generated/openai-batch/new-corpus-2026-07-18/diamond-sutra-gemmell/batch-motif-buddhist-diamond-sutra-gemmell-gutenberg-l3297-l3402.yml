- id: obs:2
  text: Another prefatory quotation says drifting clouds, a waning moon, ocean-going
    ships, and eroding shores symbolize endless change, while the Buddha's essential
    nature is changeless and everlasting.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Chinese monk's analogy says pure water reflects the moon, muddy disturbed
    water obscures the reflection, and the moon itself has neither come nor gone from
    the pool.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The same analogy applies the pure or impure water image to realization of
    the true concept of Buddha by minds that are immaculate in purity.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Chapter 30, the Lord Buddha asks Subhuti whether the aggregate would be
    great if a good disciple reduced infinite worlds to minute particles of dust.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
