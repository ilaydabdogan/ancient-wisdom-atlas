canonical_text:
  quote: ''
  summary: The passage presents prefatory notes on Nirvana, mind, and non-self, then
    Chapter 5 where the Lord Buddha asks Subhuti whether the Buddha can be perceived
    through the physical body and teaches that phenomena are transient and illusive.
    A note explains doctrines of Buddha bodies. Chapter 6 opens with Subhuti asking
    whether future hearers will have sincere faith, and the Buddha replies that future
    disciples will believe this scripture through connection with the thoughts of
    myriad Buddhas.
  language: English
