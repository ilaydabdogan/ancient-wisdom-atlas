canonical_text:
  quote: ''
  summary: Notes explain Arhatship, desirelessness, quiescence, the value of the Law,
    paths to Rahatship, Aranyaka hermits, and Sramana meditation. Chapter 10 presents
    a dialogue in which the Buddha asks Subhuti whether Dipankara Buddha communicated
    a doctrine by which the Buddha became Buddha, and whether an enlightened disciple
    should think of creating Buddhist kingdoms; Subhuti answers negatively and treats
    the creation of kingdoms as a figure of speech.
  language: English
  quote_policy: summarized
