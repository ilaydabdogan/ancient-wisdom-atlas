canonical_text:
  quote: ''
  summary: In a dialogue, the Lord Buddha asks Subhuti whether a precise Law or doctrine
    was formulated, whether atoms of dust are numerous within myriad worlds, and whether
    the Buddha can be perceived through thirty-two bodily distinctions. Subhuti answers
    negatively regarding formulated doctrine and bodily perception, and affirms the
    great number of atoms. The Buddha declares atoms, worlds, and bodily distinctions
    to be names or designations rather than essential realities. He then compares
    a disciple sacrificing innumerable lives with another who has faith in and explains
    a stanza of the Scripture, saying the latter has greater merit. Notes add comparisons
    to diamond-like wisdom, related translations, bodily marks, sacrifice, and stanza
    merit.
  language: English
  quote_policy: summarized
