canonical_text:
  quote: what the Lord Buddha adumbrated in terms of the Law, is transcendental and
    inexpressible.
  summary: Chapter 7 presents a dialogue in which Buddha asks Subhuti whether supreme
    spiritual wisdom or doctrine can be specifically formulated; Subhuti answers that
    it cannot. Chapter 8 contrasts the merit of universe-filling almsgiving with the
    greater merit of faithfully preserving and explaining a stanza of the scripture,
    and states that Buddhas and the Law arise from the truth of the scripture while
    denying that the Buddhic Law is an ordinary attributable law.
  language: English
  quote_policy: quoted
