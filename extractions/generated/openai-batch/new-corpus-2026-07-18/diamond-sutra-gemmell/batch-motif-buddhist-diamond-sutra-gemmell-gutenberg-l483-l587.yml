canonical_text:
  quote: ''
  summary: Gemmell discusses the distinction between mind and essence of mind, the
    spiritual meaning of Buddha in The Diamond Sutra, passages denying that Buddha
    is perceived through bodily form, sound, coming, or going, symbolic images of
    change contrasted with changeless Buddha-nature, and the doctrines of Karma and
    Reincarnation compared with Galatians, Christian justification by faith, a Chinese
    monk's letter, and The Light of Asia.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the distinction between mind and essence of mind may be implied
    but is not precisely stated in The Diamond Sutra, and describes essence of mind
    as an unchanging principle underlying mind.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Japanese Buddhist friends find more spiritual meaning in
    essence of mind than in the metaphysical term and apply Sakyamuni Buddha's logic
    that what is called essence of mind is not in reality essence of mind, but is
    merely termed essence of mind.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage accepts traditional statements that the Buddha of The Diamond
    Sutra was son of Suddhodana, husband of Yasodhara, and father of Rahula, while
    also saying the term Buddha embodies a lofty spiritual concept.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A cited Gatha says Buddha is not to be perceived by visible form or sought
    by audible sound, and that one walking in iniquity cannot perceive the blessedness
    of the Lord Buddha.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says Sakyamuni declared that a disciple who says Buddha comes
    or goes has not understood, because Buddha implies neither coming from anywhere
    nor going to anywhere.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Quoted lines attributed to the Yuen-Chioh Sutra use drifting clouds, the waning
    moon, ships sailing the ocean, and washed-away shores as symbols of endless change,
    and contrast them with Buddha as changeless and everlasting in essential, absolute
    nature.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says the seventeenth chapter of The Diamond Sutra declares that
    every Law is comprehended in the word Buddha, and then cites Vedic hymns, Upanishads,
    and early Indian philosophers as probable starting-points in the evolution of
    Sakyamuni's thought.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says Sakyamuni Buddha makes incidental reference in The Diamond
    Sutra to Karma and Reincarnation, and compares this with Galatians' statement
    that what a person sows, that person also reaps.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says the Buddhist mind associates Karma with the Law which moves
    to Righteousness and views traditional Christian justification by Faith as a devoutly
    conceived theory rather than a reasonably constructed truth.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: A letter attributed to an aged Chinese monk describes Karma as a universal
    Law that gently binds people to the rhythmic cycle of evolving life, operates
    quietly, and is approved for consummate justice and perfect righteousness.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: A quotation from The Light of Asia says what has been brings what shall be,
    and that angels in the Heavens of Gladness reap fruits of a holy past.
  category: speech
  evidence_refs:
  - ev:10
