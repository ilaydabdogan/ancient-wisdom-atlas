canonical_text:
  quote: ''
  summary: The passage includes prefatory quotations on Buddha's knowledge of beings'
    thoughts and his perfect wisdom. In Chapter 19, Buddha asks Subhuti whether a
    disciple who gives all the universe's treasures gains great merit, then states
    that merit has no real, permanent, tangible, or material quality. In Chapter 20,
    Buddha and Subhuti state that Buddha cannot be perceived by a perfect material
    body or by physical phenomena; notes describe the three Buddha bodies and spiritual
    perfections. In Chapter 21, Buddha warns against thinking that he promulgates
    a fixed system of Law or doctrine, since such a doctrine is only so named.
  language: English
  quote_policy: summarized
