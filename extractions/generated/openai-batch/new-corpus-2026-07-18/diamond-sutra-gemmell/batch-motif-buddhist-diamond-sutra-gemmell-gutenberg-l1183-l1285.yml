  quote: ''
  summary: The passage presents a dialogue in which Subhuti says the extent of the
    illimitable universe of space cannot be measured, and the Buddha uses that immeasurability
    as an analogy for the merit of an enlightened disciple who practices charity without
    being disturbed by phenomena. The accompanying notes explain charity as a Paramita,
    craving as the origin of suffering, Dharma/Law imagery, almsgiving and merit,
    the removal of illusory ideas of sentient life, the term Mieh-Tu as deliverance
    or crossing over rather than annihilation, and dewdrop-to-sea imagery for Nirvana.
  language: English
  quote_policy: summarized
