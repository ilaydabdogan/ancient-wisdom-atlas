  summary: The passage presents Buddha teaching Subhuti that merit from observing
    and explaining even a stanza of the Scripture exceeds vast treasure-charity; that
    Buddha should not be thought to save real living beings because such categories
    are not ultimately real; and that Buddha is not perceived through bodily marks,
    visible form, or sound.
