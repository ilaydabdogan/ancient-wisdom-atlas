  summary: The passage is an introductory doctrinal explanation of Mahayana Buddhist
    views associated with The Diamond Sutra. It describes names and phenomena as inadequate
    or illusory, emphasizes impermanence and conditioned arising, contrasts deluded
    ordinary perception with Bodhisattva insight, and presents the essence of mind
    as pure, unchanging, all-pervading, and inseparable from phenomena.
