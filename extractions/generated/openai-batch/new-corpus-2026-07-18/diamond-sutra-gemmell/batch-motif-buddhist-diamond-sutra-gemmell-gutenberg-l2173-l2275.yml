canonical_text:
  quote: "“The true concept of phenomena is, that these are not essentially phenomena...”"
  summary: Subhuti weeps on hearing the scripture and praises the Buddha's transcendent
    wisdom. The Buddha and Subhuti discuss future disciples, merit, the unreality
    of phenomena, freedom from ideas of self and personality, the Paramitas, endurance
    under mutilation in a previous life, independent charity, and similes of darkness
    and sunlight for deluded and undeluded practice.
