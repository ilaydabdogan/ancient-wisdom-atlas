    grove of Jeta with 1,250 mendicant disciples. It narrates his morning alms round
    into Shravasti, his receipt of donations, his return to the grove, meal, foot-bathing,
    and taking of the honoured seat. The notes explain the introductory formula, the
    title Buddha, Shravasti and Jeta’s grove, grades of discipleship, monastic poverty,
    alms-begging, donor merit, and food division.
