canonical_text:
  quote: ''
  summary: The passage introduces interpretive issues around Dharma, usually rendered
    “Law,” and Samgna, rendered “Name,” in relation to The Diamond Sutra. It cites
    scholarly, Chinese, Buddhist monastic, Daoist, Christian, and poetic comparisons
    for understanding Dharma as law, truth, righteousness, inexpressible truth, and
    an unseen principle operating in nature and mind. It then refers to Sakyamuni’s
    teaching to Subhuti that wisdom subdues desire and that deliverance in Nirvana
    is sought without retaining arbitrary ideas of entity, being, living being, or
    personality.
  language: English
  quote_policy: summarized
