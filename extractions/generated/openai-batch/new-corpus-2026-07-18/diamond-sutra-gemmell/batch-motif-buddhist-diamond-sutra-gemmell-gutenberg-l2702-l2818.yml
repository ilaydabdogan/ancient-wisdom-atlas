canonical_text:
  quote: ''
  summary: Introductory notes define Buddha/Ju-Lai through intelligibility of all
    laws and compare this wording with Christian Love/God language. Cited notes discuss
    Bodhisattva, beings, no-self, pure mind, and stains on mind. Chapter 18 presents
    a dialogue in which Lord Buddha asks Subhuti whether Buddha possesses five kinds
    of eye; Subhuti affirms each. Buddha then uses the sands and rivers of the Ganges
    to describe innumerable Buddhist worlds, says all sentient dispositions in them
    are known, and states that mental dispositions and modes of thought in past, present,
    and future are unreal and illusory. Notes gloss the Eye of the Law/Truth and functions
    of the five eyes.
  language: English
  quote_policy: summarized
