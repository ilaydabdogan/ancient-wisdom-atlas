canonical_text:
  quote: ''
  summary: The passage presents a dialogue in which the Buddha asks Subhuti whether
    several Buddhist attainment categories may claim that they have obtained their
    fruits or conditions. Subhuti repeatedly denies this, explaining the names as
    descriptive designations rather than real self-owned states, and he applies the
    same principle to himself as one praised for quiescence and spiritual perception.
    The notes explain the stream-enterer, path/fruits language, the Law as a raft,
    and rebirth-related attainment categories.
  language: English
