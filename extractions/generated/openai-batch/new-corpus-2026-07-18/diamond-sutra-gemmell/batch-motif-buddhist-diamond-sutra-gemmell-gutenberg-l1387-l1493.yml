canonical_text:
  quote: was presented before your minds in the simile of a raft.
  summary: Buddha addresses Subhuti about future or potential disciples whom he knows
    through prescience and for whom immeasurable merit is reserved. He explains that
    enlightened disciples should not cling to fixed concepts of entity, being, personality,
    or to qualities and ideas either coincident with the Law or apart from it. The
    passage then presents the Law through the simile of a raft that carries disciples
    to the other shore, Nirvana, and must afterward be abandoned. Notes cite related
    raft and shore imagery and several comparative religious references.
  language: English
  quote_policy: quoted
