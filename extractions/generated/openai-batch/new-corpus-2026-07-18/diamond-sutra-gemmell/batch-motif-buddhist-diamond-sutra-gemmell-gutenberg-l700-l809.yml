  summary: Gemmell concludes the introduction by comparing Ritschl's value-judgments
    with Buddha's logical method, especially the claim that a so-called miracle is
    not truly a miracle but only defined as one. He notes Chinese and monastic reverence
    for Buddha's method. The notes in this range give background on titles, Nagarjuna,
    Kumarajiva, Chinese translations, Prajna, previous incarnations, Dharma, and comparisons
    with Taoist, Confucian, and literary expressions.
