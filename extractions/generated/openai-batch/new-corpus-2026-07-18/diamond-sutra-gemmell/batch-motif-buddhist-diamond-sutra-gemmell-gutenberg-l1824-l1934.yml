canonical_text:
  quote: "“they ought not to depend on the phenomena of form, sound, odour, taste,
    touch, or Law”"
  summary: The Lord Buddha instructs Subhuti that enlightened disciples should cultivate
    a pure and holy mind independent of sensory phenomena, Law, and material aids.
    He then asks whether a hypothetical body as great as Sumeru would be esteemed
    great; Subhuti replies that its greatness is not physical but concerns mental
    and spiritual concepts of body. The notes add Buddhist and comparative commentary
    on Dipankara, wisdom, Buddhist kingdoms, Sumeru, and the composite/impermanent
    body.
