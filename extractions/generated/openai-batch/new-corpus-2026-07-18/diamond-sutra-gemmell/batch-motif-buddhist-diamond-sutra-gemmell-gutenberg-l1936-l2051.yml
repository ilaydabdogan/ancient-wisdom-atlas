canonical_text:
  quote: ''
  summary: The passage presents a dialogue in which the Buddha asks Subhuti to imagine
    innumerable Ganges rivers, their sands, and a treasure gift filling correspondingly
    vast universes. The Buddha says that faithful adherence to and explanation of
    even a stanza of the scripture yields greater merit. He then says that a place
    where the scripture is proclaimed is sanctified and should be worshipped like
    a Buddha shrine, that a diligent disciple is spiritually endowed, and that the
    scripture is to be known as The Diamond Sutra, Transcendent Wisdom, by which one
    reaches the Other Shore.
  language: English
  quote_policy: summarized
