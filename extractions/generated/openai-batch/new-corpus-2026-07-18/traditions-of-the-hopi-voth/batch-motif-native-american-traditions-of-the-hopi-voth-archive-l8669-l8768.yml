canonical_text:
  quote: ''
  summary: 'The excerpt first concludes a tale in which a large Hawk pities an emaciated
    little boy left at a Navaho camp, carries him to its bluff dwelling, obtains clothing
    and food for him, and later returns him to Orafbi. The excerpt then begins the
    tale of Moyingwa, two children, and the Humming-bird: after several years of drought,
    frost, crop failure, and abandonment of Orafbi, a brother and sister remain. The
    boy makes a small bird from sunflower-stalk pith; it becomes a living Humming-bird,
    brings corn to the children for several days, and is then sent to search for their
    parents.'
  language: English
  quote_policy: summarized
