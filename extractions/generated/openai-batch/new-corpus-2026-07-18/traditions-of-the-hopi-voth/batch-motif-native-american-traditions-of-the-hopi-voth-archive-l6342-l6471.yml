canonical_text:
  quote: ''
  summary: A young hunter kills a jack-rabbit, becomes lost in darkness and rain,
    enters a kiva where Skeleton Woman offers corpse-and-fly food and tries to claim
    him as husband, escapes through threads with a knife, and is hidden by cricket
    dancers before returning home frightened. A following tale tells how Masauwuu
    courts a maiden, reciprocal food gifts are exchanged through his grandmother,
    and he brings the maiden to live with them.
  language: English with Hopi terms and song lines
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man leaves the village to hunt, follows rabbit tracks in the snow,
    kills a tired jack-rabbit, ties it by the legs, and carries it on his back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After dark and rain begin, the young man reaches a bluff, sees a light, finds
    a kiva, and is invited inside by a pretty woman.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman gives him food, but he discovers that one item is made from the
    brain of corpses and the other from flies, so he pretends to eat and drops the
    food before putting it in his mouth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man retrieves the rabbit he had left outside and gives it to the
    woman, who is identified as Skeleton Woman and thanks him for it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Skeleton Woman says she is going to dance, that she and the young man will
    sleep together afterward, and tells him to keep up the fire while she dances.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The kiva opening is closed with many threads stretched across it, and the
    young man takes out and sharpens a small knife.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Skeleton Woman dances and sings, she is no longer a handsome woman but
    appears as a skeleton with exposed teeth and thin bony legs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: While Skeleton Woman turns during the dance, the young man runs up the ladder,
    cuts the threads closing the opening, and escapes as she calls after him as her
    husband.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: At another bluff the fleeing young man sees a light, finds a second kiva with
    a lively dance, enters, and asks the dancers to hide him from his pursuer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dancers are crickets; they rub soaked clay over the young man's body,
    prepare him as one of the dancers, and continue dancing and singing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Skeleton Woman enters the cricket kiva, searches the dancers for her husband,
    and the young man escapes when one dancer whispers for him to run.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Skeleton Woman follows the young man again but fails to overtake him, and
    he reaches the village frightened and quiet.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Masauwuu lives at Mastopkave with his grandmother Mas Wuhti, while a beautiful
    maiden in old Mishongnovi persistently refuses offers of marriage.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Masauwuu visits the maiden as a handsome young man while she is grinding corn;
    he wears many bead strands, long turquoise ear-pendants, and fine clothing.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: Masauwuu and the maiden converse across the fireplace all evening, and she
    says she is willing to marry him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: The maiden sends Masauwuu's grandmother a large tray of muhpiki, and the grandmother
    interprets the gift as showing that the maiden is willing to marry him.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: Masauwuu's grandmother gives him a large quantity of rabbit meat, which he
    carries to the maiden as a return gift.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: The next morning Masauwuu takes the maiden to his grandmother's house, where
    they live afterward.
  category: sequence
  evidence_refs:
  - ev:9
