canonical_text:
  quote: ''
  summary: The passage briefly continues a description of the Sun's westward course
    and offerings, then gives an ethnographic account of the Bear clan's wanderings
    after leaving the sipapuni. The Bear people travel through several places, derive
    their clan name from encountering a dead bear, and are linked with six other clans
    whose names are also explained by what later migrating parties found at the same
    bear remains. The Bear clan eventually settles at Shongopavi, claims leading status
    because of first arrival, transmits chieftaincy in several villages, brings Blue
    Flute ritual materials and associated figures, and grants or denies admission
    to later migrating groups.
  language: English
  quote_policy: summarized
