canonical_text:
  quote: ''
  summary: The passage describes Spanish demands on the Hopi, including labor, food,
    and religious attendance; Spanish priests forbid Katcina dances and bahos during
    a dry period; Hopi leaders secretly revive offerings and dances for rain; oppression
    increases; a council decides to remove the priest, and the Badger clan kills him.
    Afterward the Hopi destroy Spanish houses, reuse materials for kivas, and resume
    dances and sacred altar performances.
  language: English
  quote_policy: summarized
