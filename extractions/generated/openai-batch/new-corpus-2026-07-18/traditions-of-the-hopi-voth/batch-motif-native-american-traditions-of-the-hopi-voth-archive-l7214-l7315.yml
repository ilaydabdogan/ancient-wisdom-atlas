canonical_text:
  quote: ''
  summary: In a hiding contest, the maiden hides in ditch water by turning into a
    tadpole, then later finds the youth when Ahu has hidden him in a hollow piñon
    post. After declaring that she has beaten him, she makes him remove his shirt
    and beads, cuts his throat over a hole, buries his body nearby, and returns home
    with his clothing and beads. His parents mourn and ask after him. A speaking Fly
    offers to search, finds the blood and grave, returns the blood to the body, and
    the youth revives and returns home. The Fly then instructs the family to recover
    the shirt and beads from the maiden.
  language: English
  quote_policy: summarized
