canonical_text:
  quote: ''
  summary: The passage first describes a raid on Aodtovi in which attackers camp near
    a spring during a storm, ascend the mesa, trap men in kivas by removing ladders,
    burn them with firebrands, and take women and children captive. It then recounts
    how an Oraibi chief arranges with a Walpi warrior chief to punish his own people
    through an ambush; Walpi defenders and a fierce dog kill many Oraibi, while those
    who pass a specified rock are spared, leading to a dog engraving and place-name.
    The final section begins an account of a Katcina race rivalry, where an Oraibi
    youth learns of Walpi plans to challenge Oraibi and returns to warn his village
    to practice running.
  language: English
  quote_policy: summarized
