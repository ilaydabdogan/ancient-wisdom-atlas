canonical_text:
  quote: ''
  summary: The passage first describes Huruing Wuhti trapping two armed men by a stone,
    destroying their guns, admonishing them to live peacefully and exchange knowledge,
    and releasing them. It then begins a tale in which, when the world is mostly water,
    Huruing Wuhti dwells in the west and summons the Sun through the Moon. Huruing
    Wuhti and the Sun agree to shared ownership and create birds and mammals for one
    another through covered materials, bodily substances, song, fire, and ritual movement.
  language: English
  quote_policy: summarized
