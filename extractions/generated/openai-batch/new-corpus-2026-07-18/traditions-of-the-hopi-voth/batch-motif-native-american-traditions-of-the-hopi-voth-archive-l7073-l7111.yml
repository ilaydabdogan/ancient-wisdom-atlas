canonical_text:
  quote: ''
  summary: A man repeatedly receives large bundles of sashes, buckskins, and women's
    belts from his grandmother and brings them to the kiva, where an old man helps
    display them before other men. The display shows Piwftamni to be very rich. The
    other men then propose a further house-to-house test based on stores of corn to
    determine who should own Piwftamni's wife; Piwftamni's house is found filled with
    corn, watermelons, and squashes, and no one dares take his wife. The passage closes
    by saying the rich woman was no longer called Watermelon-Rind Woman and may still
    be living somewhere.
  language: English
  quote_policy: summarized
