canonical_text:
  quote: The Locusts bring warm weather
  summary: The passage first gives Hopi song text and translation for a dance invoking
    summer, blossoms, and locust youths. After the dancers leave the kiva, the Snakes
    thank them; the Snake house becomes hot, snow melts, grass appears, and the narrator
    explains that locusts are burned in winter ritual to bring warm weather. The passage
    then tells how Squirrel and Chipmunk, friends near Nose Gulch, steal peaches from
    an old man's orchard, compose and sing a song, dance on a rock, are discovered
    and pursued, escape into their houses, and continue thereafter to take peaches
    from Hopi orchards.
  language: English with Hopi song text
  quote_policy: quoted
