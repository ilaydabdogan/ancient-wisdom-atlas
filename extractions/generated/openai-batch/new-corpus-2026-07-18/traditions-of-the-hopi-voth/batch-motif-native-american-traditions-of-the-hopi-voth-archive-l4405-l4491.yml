canonical_text:
  quote: ''
  summary: The passage first tells how Pook6nghoya and his younger brother Baldngahoya
    visit two field-watching maidens, accept an arm-cutting test connected with marrying
    them, and are healed by their grandmother through placement near the fireplace
    and song. It then begins another tale in which a child-devouring monster named
    Shfta threatens Oraibi; the village chief asks the Pook6nghoyas for help, makes
    bluebird-feather arrows for them, and the monster swallows the two brothers, who
    find a path and a small world inside its body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pook6nghoya and his little brother Baldngahoya lived north of the village
    at the shrine of the Achdmali.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The brothers heard that two beautiful maidens were watching fields west of
    Huckovi and went hunting while also intending to visit them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The maidens said they would cut off an arm from each brother and, if the brothers
    did not die, the brothers could own them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The younger brother agreed first, the elder brother hesitated, and then each
    brother had an arm cut off by a maiden using a mealing stone at the mealing trough
    or bin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The brothers asked for their severed arms, received them, and returned home
    carrying the arms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Their grandmother placed the arms by their sides north of the fireplace, covered
    them, sang a song, and the brothers found their arms healed when they rose.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The next day the brothers returned to the maidens fully recovered; the younger
    brother claimed the first choice because he had submitted first, and the brothers
    slept with the maidens that night before returning home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A large monster called Shfta lived in the west and came to Oraibi and other
    places to devour children and sometimes grown people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Oraibi village chief asked Pook6nghoya and Baldngahoya to rid the people
    of the monster, and they told him to make an arrow for each of them.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The chief made two arrows using bluebird wing feathers for the shafts and
    brought them to the little War Gods.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The brothers watched around Oraibi, saw the monster approaching from the west,
    met it, heard it say that it would eat them, and were swallowed one after the
    other.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Inside the monster it was not dark; the brothers found themselves on a path,
    which is identified as the monster's oesophagus leading into its stomach.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the monster's stomach the brothers found many people of different nationalities,
    and the stomach is described as a little world with grass, trees, rock, and similar
    features.
  category: setting
  evidence_refs:
  - ev:9
