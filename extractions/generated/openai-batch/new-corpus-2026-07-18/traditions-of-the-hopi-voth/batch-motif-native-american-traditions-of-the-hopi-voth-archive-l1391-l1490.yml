  text: Other named peoples take the longest corn-ears, while the Hopi chief accepts
    the smaller ears and says they are the food by which the Hopi will live.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the longest ears become grasses with seed, while the
