canonical_text:
  quote: ''
  summary: The passage recounts the differentiation of languages by Mocking-bird,
    a choice of corn-ears that explains Hopi corn and other peoples' seed grasses,
    the departure and migration of different parties from the under-world, the elder
    brother's journey toward the sunrise and promised return in trouble, the creation
    of transport animals by Spider Woman, the use of a ritual vessel to create springs,
    later conflict among parties, defensive settlement on bluffs and mesas, and the
    naming of several clans from a dead bear encountered on the journey.
  language: English
  quote_policy: summarized
