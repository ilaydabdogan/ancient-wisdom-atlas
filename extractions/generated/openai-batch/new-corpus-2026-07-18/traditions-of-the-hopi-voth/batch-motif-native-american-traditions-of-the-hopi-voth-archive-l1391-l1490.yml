  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Spider Woman is with the White Men and makes horses and burros for them, helping
    them travel faster when tired.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: When parties find good fields without water, they create springs with a small
    perforated vessel called a bduypi containing herbs, stones, shells, a small balolookong,
