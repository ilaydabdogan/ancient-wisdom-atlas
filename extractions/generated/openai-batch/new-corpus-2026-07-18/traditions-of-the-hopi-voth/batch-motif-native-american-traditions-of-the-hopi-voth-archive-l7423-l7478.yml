canonical_text:
  quote: ''
  summary: A maiden retreats into a kiva and refuses to return a young man's costume.
    His grandmother rebukes him for ignoring her warning, says the maiden takes things
    from young men, and devises a plan using meat. The youth hunts with a fast dog,
    kills a rabbit, and offers it to the maiden if she will dance again. Following
    his grandmother's instructions, he throws the rabbit away from the kiva opening
    and closes the opening while the maiden runs for the game. Defeated, she removes
    and returns the entire costume, and the grandmother warns him not to go near the
    maiden again.
  language: English
  quote_policy: summarized
