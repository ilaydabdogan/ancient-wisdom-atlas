canonical_text:
  quote: ''
  summary: A maiden refuses marriage offers, then Rooster appears as a handsome youth
    and Mocking-bird also seeks to marry her. Rooster and Mocking-bird contest who
    can make light; Rooster receives help from maidens and chicken people, but Mocking-bird
    is aided when Kwatokwuu covers the dawn, and Mocking-bird wins the maiden. The
    passage then summarizes the son of Toad Woman attending Snow Katcina singing and
    dancing, a locust coming alive while being roasted, and Coyote being fooled by
    a little turtle and unable to harm turtles that withdraw into their shells.
  language: English
  quote_policy: summarized
