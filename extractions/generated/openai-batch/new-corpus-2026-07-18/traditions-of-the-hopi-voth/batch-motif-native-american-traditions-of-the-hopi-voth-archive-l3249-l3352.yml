canonical_text:
  quote: ''
  summary: The passage first describes Batki people using meat mixed into paint for
    bāhos, after which thunder, lightning, and heavy rains come. It then recounts
    two youths who grow into violent young men, leave home under the pretext of hunting
    deer, receive war instruction from C6tukvnangi, and use lightning and thunder
    to kill Apache enemies. They return with trophies, appoint a war chief by throwing
    a scalp at him, and institute or explain war-related rites involving a cloud symbol,
    bear skin, corn meal, seclusion, and a public war dance.
  language: English
  quote_policy: summarized
