canonical_text:
  quote: ''
  summary: 'The passage first recounts Hano hunters pursuing rabbits in winter and
    startling Masauwuu at Big Rock, after which he repeatedly runs into the rock,
    bloodies and perforates his head, and the Hano divide his game. It then describes
    the Yayaponchatu, non-Hopi skeletal-like beings associated with destructive fire,
    and narrates two of them trading broom grass in Oraibi kivas for tobacco. The
    final section begins a Kohonino hunter story: the Kohonino emerge where salt comes
    out, ascend and settle in cliffs, and one hunter pursues a wounded mountain sheep
    until both animal and hunter fall, leaving the hunter unconscious and eyeless.'
  language: English
  quote_policy: summarized
