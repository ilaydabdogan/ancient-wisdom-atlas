canonical_text:
  quote: ''
  summary: 'A maiden returns to her parents, who recognize and embrace her. Katcinas
    bring and distribute food, instruct that the people store it and examine it at
    sunrise, and after their departure the houses are found filled with food. Later
    the maiden becomes homesick for Kishiwu, dies, and is said to live there. A new
    story begins: in Oraibi a maiden refuses many suitors. A young man living with
    his grandmother at Achamali visits her by moonlight, speaks to her while she grinds
    corn, and is accepted as a potential husband. With his grandmother''s advice he
    prepares steamed sweet corn, returns with it as a gift, and is identified as Ball-Head
    wearing a mask with three nodules and turkey feathers.'
  language: English
  quote_policy: summarized
