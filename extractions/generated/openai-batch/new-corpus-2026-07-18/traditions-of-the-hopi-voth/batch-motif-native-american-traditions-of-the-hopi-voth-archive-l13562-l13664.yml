canonical_text:
  quote: ''
  summary: 'The passage recounts the aftermath of a Navaho raid on a Hopi village,
    including livestock and corn taken, wounded and dead carried away, mourning, and
    Hopi care for wounded warriors. It then tells of a Hopi raid on a Navaho dance
    in a deep canyon: Navaho participants travel to the dance, descend a dangerous
    trail, hold a masked Katcina dance by campfires, see a falling star near the dancers,
    scatter in fear, and are attacked by Orafbi Hopi. A footnote describes rattlesnake-derived
    poison on arrows. The narrative ends by explaining why Navaho dances now place
    watchers to look for intruders.'
  language: English
  quote_policy: summarized
