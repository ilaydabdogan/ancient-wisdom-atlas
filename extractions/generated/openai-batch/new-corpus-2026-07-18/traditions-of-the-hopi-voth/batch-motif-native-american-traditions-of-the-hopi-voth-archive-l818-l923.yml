  claim: The emergence episode supports comparison to the supplied ascent and sacred-tree-axis
    motif families because people climb ritually grown plant supports through an opening
    from the world below.
  claim_level: same_motif
  target: ascent; sacred_tree_axis
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The supports include multiple pines, a reed, and a sunflower; the passage
    does not designate a single cosmic tree or axis.
- id: claim:2
  claim: The flood episode supports comparison to a flood-and-renewal pattern because
    a flood destroys many people before the surviving population prepares to depart
    toward another world.
  claim_level: same_motif
  target: flood_and_renewal
  evidence_refs:
