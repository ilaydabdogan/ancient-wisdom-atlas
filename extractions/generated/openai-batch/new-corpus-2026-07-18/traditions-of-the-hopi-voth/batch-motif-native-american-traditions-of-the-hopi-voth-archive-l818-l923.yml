canonical_text:
  quote: ''
  summary: The passage recounts renewed creation and naming of a Hopi Bear Clan child
    and a Navaho figure with different food gifts; the Sun's aid and naming of a tired
    sibling pair; settlement notices for several clans; and a Hopi under-world emergence
    narrative in which chiefs seek an exit, birds scout it, a flood destroys many,
    plants are sung into growth as ascent supports, and Spider Woman, Pookonghoya,
    Balongawhoya, and Mocking-bird assist the people as Mocking-bird assigns languages
    and places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'After a covering is lifted, two beings are revealed: one child like a Hopi
    who had grunted like a bear, and Talqoto, described as a Navaho.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Huruing Wuhti names the Hopi-like child Bear Clan member, gives him a grain
    of shelled corn, names or identifies the other as Talqoto, gives him spoiled meat,
    and the passage gives this as the reason Navaho use meat instead of corn like
    the Hopi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sun passes through an opening in the floor, returns east under the earth,
    rises again, and sees smoke from camps of created people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sun encounters a tired maiden and youth traveling together; the maiden
    sometimes carries her little brother, and at other times they join hands.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Sun gives the youth and maiden water and corn, names the youth Sun Clan
    member and the maiden Forehead Clan member, and tells them to travel eastward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage reports later settlement locations for the Sun and Forehead clans,
    Bear Clan, Burrowing Owl Clan, Sand Clan, and for Muyingwa and his sister.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the under-world, many people quarrel and some abuse women and maidens;
    worried chiefs hold a council and decide to seek another place to live.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The bird Motsni is sent to find an exit but returns unsuccessful; the Mocking-bird,
    Ydhpa, flies higher, finds an exit, and reports back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The chiefs cause a great flood; Balolookongwuus come out of the ground with
    the water, and many people are destroyed.
  category: action
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:10
  text: After the Mocking-bird reports, the chiefs announce through a crier that the
    people will leave in four days, with women preparing food and everyone assembling
    under the opening.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The chiefs plant pines, a reed, and a sunflower, singing around them so that
    they grow quickly; the calavi pine and reed reach through the opening, while the
    other pine and sunflower do not fully reach it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Spider Woman, Pookonghoya, Balongawhoya, and the Mocking-bird climb up; Pookonghoya
    and Balongawhoya hold the plant supports steady while the people climb.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Mocking-bird sings songs identified as still chanted at the Wawochim ceremony
    and assigns places and languages to emerging peoples, including Hopi, Navaho,
    Apache, Mohave, Mexican, and White people.
  category: speech
  evidence_refs:
  - ev:6
