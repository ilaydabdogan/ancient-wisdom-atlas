canonical_text:
  quote: The youth was the Circle (P6ngo) Katcina.
  summary: A maiden of Oraibi meets a youth who reveals himself as the Circle Katcina.
    With parental permission she goes to meet him, enters a kiva containing many Katcinas,
    receives food, and remains while the Katcinas prepare her bridal costume. She
    returns home with him and bears two Circle Katcina children. Later Hototo Katcina
    leads her away; her husband takes the children to the Katcina house, then searches
    for her with them, dancing and offering roasted ears in exchange for nursing the
    children, until a woman nurses them and they trace the mother toward Silcikvu.
  language: English
  quote_policy: quoted
