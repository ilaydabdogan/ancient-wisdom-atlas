canonical_text:
  quote: ''
  summary: 'The passage closes an episode in which Hiy6natitiwa, his father-in-law,
    and four animals descend from a mesa; the animals kill many Navaho and Hopi plotters,
    preventing a plan to remove him and steal his wife. It then gives the tale of
    a Shongopavi maiden: a handsome youth offers himself to whoever can open his tray;
    an unattractive young maiden, instructed by Spider Woman to sing a song, opens
    it, becomes his bride, is bathed and made beautiful, then later turns into a dog
    and runs away. The next tale begins with an earthquake at Oraibi, where the earth
    sinks and cracks; the villagers flee, and a blind man carries a crippled man,
    who guides him, until they meet a large elk.'
  language: English
  quote_policy: summarized
