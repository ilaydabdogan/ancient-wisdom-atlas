canonical_text:
  quote: ''
  summary: A sequence of Hopi Coyote narratives describes Coyote or Coyote Woman being
    distracted, deceived, injured, or killed in encounters with birds and other animals.
    Repeated elements include water carried in the mouth for children, bird song or
    dancing, stone decoys, broken teeth and bleeding mouths, frightening reflections
    in springs, failed imitation of animal practices, borrowed feathers used for flight,
    and explanatory endings about coyote behavior.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote Woman has four children, hunts small animals for them, and carries
    water to them from a spring in her mouth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wren jumps from rock to rock and sings; Coyote Woman laughs, spills the water
    she is carrying, and threatens to devour Wren if he continues.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wren slips out of his skin, dresses a stone with it so that it looks like
    Wren, and hides under a rock; Coyote Woman crushes the stone and breaks her teeth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After breaking her teeth, Coyote Woman sees a bloody face at several springs,
    runs westward to the Grand Canon, jumps in, and dies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Aahtu throw their eyes onto a tree and sing them back into their sockets;
    Coyote imitates them, but his eyes do not return, and he later dies after failing
    to find food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Turtle-dove cuts her hand, bleeds, and cries; Coyote demands that she repeat
    what he treats as a song, forgets it after falling, and returns repeatedly.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Turtle-dove leaves a stone resembling herself; Coyote seizes it, breaks his
    teeth, sees bloody or skeletal forms in springs, tears up rocks at one spring,
    falls down exhausted, and dies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Blue Jays lend wings, tails, and feathers to Coyote's wife, fly with her from
    tree to tree and high into the air, then remove the borrowed feathers so that
    she falls and dies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After Coyote's wife dies, Coyote returns to children without a mother and
    later hunts food for them alone; the passage gives this as the reason many coyotes
    look for food alone.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Eagle tells Coyote that he has cut off one leg painlessly and instructs Coyote
    to cut his own leg across a stone; Coyote does so, while Eagle shows his second
    leg and flies away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the Red Eagle episode, Coyote carries water in his mouth for thirsty children,
    repeatedly spills it while laughing at Eagle dancing on one leg, then seals his
    mouth with pitch before carrying water back.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When Coyote pours water into the mouths of his children, they do not awaken
    because they are dead; Eagle then flies away and shows that he has two legs.
  category: sequence
  evidence_refs:
  - ev:7
