  basis: The people leave the under-world by climbing a reed that reaches an opening
    after Motsni finds the route upward.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is a condensed summary and does not give full ritual or cosmological
    context for the emergence.
- id: motif:2
  label: controlled boundary between worlds
  taxonomy_refs:
  - duality
  basis: The chief closes the opening between the lower world and the emerged world
    before everyone has come out, while one sorcerer nevertheless emerges.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage states the action but does not explain the chief's reason
    or the full consequences of the boundary closure.
