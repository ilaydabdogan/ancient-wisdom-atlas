  - sym:3
  - sym:4
  evidence_refs:
  - ev:1
- id: scene:2
  label: Post-emergence dispersal and ordering
  summary: Groups take different migration routes; the Hopi bring corn-bodied Moyingwu;
    a dead child is seen below and death is linked to return to the lower world; Coyote
    throws stars into the sky; Spider creates burros for white people.
  figure_refs:
  - fig:2
  - fig:6
  - fig:7
  - fig:8
  - fig:9
  - fig:10
  symbol_refs:
  - sym:1
  - sym:5
  - sym:6
  - sym:7
  evidence_refs:
  - ev:2
- id: scene:3
  label: Bear-related clan naming and settlement movement
  summary: A party receives the name Bear clan after encountering a bear, other parties
    receive names from bear incidents, the Spider clan wanders, and people eventually
    move to the mesa and build the present Mishongnovi village.
  figure_refs:
  - fig:10
  - fig:11
  symbol_refs: []
  evidence_refs:
  - ev:3
- id: scene:4
  label: Hawk-man's first kiva ordeal
  summary: Hawk in human form invites boys to his kiva, smokes with them, exchanges
    relationship terms, dresses them, gives eagle feathers, and has them thrown through
