scenes:
- id: scene:1
  label: Emergence from the under-world
  summary: After violence in the under-world, the chief sends Motsni upward to find
    an opening; a pine and reed are planted, people climb up, languages are distributed,
    and the opening is closed before all have emerged.
  figure_refs:
  - fig:1
  - fig:2
  - fig:3
  - fig:4
  - fig:5
  - fig:6
