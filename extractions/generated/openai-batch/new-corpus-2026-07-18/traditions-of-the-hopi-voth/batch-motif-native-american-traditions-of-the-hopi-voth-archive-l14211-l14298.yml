canonical_text:
  quote: ''
  summary: 'The passage summarizes several Hopi traditions: emergence from an under-world
    through an opening reached by planted pine and reed; post-emergence dispersal,
    language distribution, death returning to the lower world, star placement, and
    clan names; the origin of the Yayaatu Society through Hawk-man''s fiery initiation
    and revival of boys; the origin of some Mishongnovi clans through rain and crop
    powers; and the beginning of a Palatkwapi destruction account involving mistreatment,
    sorcerers, masks, and corpse fingers.'
  language: English
  quote_policy: summarized
