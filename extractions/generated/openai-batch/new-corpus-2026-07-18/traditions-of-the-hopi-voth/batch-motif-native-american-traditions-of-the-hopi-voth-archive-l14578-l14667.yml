canonical_text:
  quote: ''
  summary: The passage summarizes several Hopi narratives about Pookong/Prtokong figures.
    In one fragment they kill an enemy with lightning arrows. In another, Prtokong
    kills a bear that has been killing people and frightens his grandmother with the
    bear skin. The Pookong brothers attend or misunderstand dances, steal trays, and
    remove salt. In a bride-winning narrative, Pookonghoya and his brother Balrtonghoya,
    aided by their grandmother Spider Woman, use traps and hidden game to win a maiden;
    Spider Woman performs or directs marriage and farming-related acts, including
    head-washing, rain, corn planting, and cloud-assisted field work. The story ends
    with Pookong returning home with his son after the son shoots children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Prtokongs hide behind a mealing bin, kill a male figure with lightning
    arrows, scalp him, and return with beads and other things.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A village chief makes two buckskin balls and two ball sticks and takes them
    to the Prtokongs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A bear kills people living at Mishongnovi before Prtokong is asked to kill
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Prtokong hunts the bear, shoots it in the throat, strikes it with a ball stick,
    skins it, fills the skin with dry grass, ties it to himself, and drags it while
    screaming.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Prtokong throws the bear skin to his grandmother, who is frightened and dies;
    he wakes her, and she whips him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Pookongs go toward a dance, see waving grass making a hissing noise, and
    sit looking at the grass as though it were dancing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Mishongnovi the Pookongs see a dance but are not invited to eat because
    they are filthy; they snatch trays from dancers and take them home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Salt is said to belong to the Pookongs, who remove it far away, making it
    difficult for the Hopi to obtain.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Pookonghoya and Balrtonghoya live with their grandmother Spider Woman and
    decide to try to marry a maiden who refuses marriage.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The brothers set traps near the maiden's house and in the house, including
    a trap using a mealing or piki tray.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Antelope and then deer are killed at night and placed beneath the tray trap;
    the maiden and her father believe the animals have been caught by the trap.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The maiden's father says that if something is again caught in the trap, the
    brothers are to come for his daughter.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: Spider Woman takes meal and tray from the maiden, invites her to eat hurushuki,
    and the food increases when the maiden puts a little in her mouth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: During the head-washing, the maiden sits near the kiva entrance and clouds
    come and rain upon her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: Spiders prepare a bridal costume, and Spider Woman washes the heads of Prtokong
    and the bride before sending the bride to her mother's house.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:16
  text: Spider Woman instructs Prtokong about conduct at his mother-in-law's house,
    but he sits holding a wrist-band before his eyes and looking through it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: At planting time Spider Woman gives Prtokong a small parcel of different kinds
    of corn; one grain is planted at a time, and it soon grows up.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: Spider Woman tells Prtokong to form ant-hills throughout the field, meaning
    that he should hoe it; he instead makes small ant-hills.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:19
  text: After another misunderstood instruction, Prtokong scatters fat through the
    cornfield and returns without hoeing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:20
  text: Spider Woman asks clouds to hoe the field; water runs through the cornfield
    in streamlets and covers the grass with sand and earth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:21
  text: Prtokong's wife bears a son who grows up, plays with children, and sometimes
    shoots them with bows and arrows made by his father.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:22
  text: Oraibi people become angry and say the Prtokongs should go to their own house;
    Prtokong returns home with his son and leaves his wife with her parents.
  category: sequence
  evidence_refs:
  - ev:8
