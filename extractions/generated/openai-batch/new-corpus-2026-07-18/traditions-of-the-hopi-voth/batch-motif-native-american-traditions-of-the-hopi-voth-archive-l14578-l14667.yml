candidate_motifs:
- id: motif:1
  label: animal-slayer protects a community
  taxonomy_refs:
  - culture_hero
  basis: Prtokong kills the bear that has been killing people at Mishongnovi, and
    the chief is happy because the killing stops.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage is a summary and does not explicitly call Prtokong a culture
    hero; the taxonomy link rests on the protective function in this episode.
- id: motif:2
  label: trickster-like literal misunderstanding of words and customs
  taxonomy_refs:
  - trickster_boundary
  basis: The Pookong figures mistake hissing grass for a dance, seize trays after
    being unfed, and Prtokong repeatedly interprets Spider Woman's instructions in
    a literal or mistaken way.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not use the term trickster; the motif candidate is based
    on repeated disruptive misunderstandings and social boundary violations.
- id: motif:3
  label: supernatural grandmother helper and instructor
  taxonomy_refs:
  - wisdom
  basis: Spider Woman advises the Pookongs, directs marriage conduct, prepares or
    oversees bridal acts, gives corn, explains instructions, and asks clouds to help
    the field.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The available taxonomy has no exact grandmother-helper category; the wisdom
    reference is approximate and should be reviewed.
- id: motif:4
  label: brother pair acts together in quest for bride
  taxonomy_refs:
  - sibling_pair
  basis: Pookonghoya and Balrtonghoya are brothers who live with Spider Woman and
    jointly go to try to marry the maiden before quarrelling over her.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The brother-pair motif is clearest in the bride-winning episode and is
    not equally foregrounded in every summarized episode.
- id: motif:5
  label: bride won through wondrous or deceptive provisioning
  taxonomy_refs: []
  basis: The brothers set traps and place antelope and deer beneath a tray trap; the
    maiden's father says that if something is again caught in the trap, they may come
    for his daughter.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage presents the action as trick-like rather than explicitly miraculous;
    no external tale-type comparison is supplied.
- id: motif:6
  label: marriage ritual with head-washing, bridal costume, and rain
  taxonomy_refs:
  - sacred_marriage
  basis: The maiden receives food, grinds corn, undergoes head-washing near the kiva
