canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which Cooyoko Uncle and a Fox
    hold a dawn song contest with death as the wager, and the Fox wins when the sun
    rises during his song. It then gives a tale of Little Gray Mice and Little Brown
    Mice, formerly friendly nocturnal food-gatherers and dancers, who quarrel over
    food, mock one another in song, and become permanently estranged and scattered.
    The passage ends with the beginning of a tale about a Badger doctor, Small Gray
    Mice at Big Hill, and an injured Hopi hunter who follows a light to an underground
    room.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A place called Cooyoko House is located on a bluff north of Shupaulavi, and
    Cooyoko beings are said to have lived there.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before sunrise, Cooyoko Uncle sat on the edge of the bluff waiting to watch
    the sunrise when a handsome Fox came along.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cooyoko Uncle invited the Fox to sit with him and proposed a contest to see
    upon whose song the sun would rise, with the loser to be killed by a knife.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cooyoko Uncle and the Fox each sang short songs; after repeated turns, the
    sun appeared on the horizon while the Fox was singing.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: After the Fox won the contest, he took the knife lying beside them and cut
    Cooyoko Uncle's throat, and Cooyoko Uncle died.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Little Gray Mice lived at Tumble Down Bluff southeast of the village,
    while the Little Brown Mice lived at Chirove west of the village, far down the
    mesa.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The two kinds of mice were initially friendly; at night they came to the village,
    found hidden or stored food such as corn, invited the others, and carried the
    food away to their holes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The two kinds of mice often visited each other, danced together, and sang
    a dawn-related song.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: One Gray Mouse found good food, perhaps peaches, made a hole in its cover,
    and invited the Brown Mice to come get it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: While the mice were carrying the food away, they began to quarrel and fight;
    many were bitten, but none were killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A few days later, the Gray Mice entered the Brown Mice kiva, danced, and sang
    an altered version of their song with translated references to being afraid of
    big long-tailed mice and whistlers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After singing, the Gray Mice rushed back home, and the Brown Mice laughed
    and said the Gray Mice were afraid of them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that the two kinds of mice have not been on good terms
    since, and that they began to scatter through fields and houses, explaining why
    they are now found everywhere.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A Badger lived north of Oraibi at a place called Badger Burrow, was a doctor,
    and was visited by people seeking aid and cures.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: Many Small Gray Mice lived west of Oraibi at Big Hill.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:16
  text: During a Hopi hunt west of Big Hill, one hunter was accidentally hit by another
    hunter's boomerang and had his leg broken; he tried to get home, saw a light at
    Big Hill, and found an underground room similar to Hopi kivas with small people
    inside.
  category: sequence
  evidence_refs:
  - ev:9
