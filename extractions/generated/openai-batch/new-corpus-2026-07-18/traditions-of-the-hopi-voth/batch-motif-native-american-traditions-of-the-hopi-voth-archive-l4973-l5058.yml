canonical_text:
  quote: ''
  summary: Two Pookongs set mouse traps with squash seed near a maiden's house. The
    maiden invites them to set traps inside her house. They arrange a piki tray as
    a trap near the mealing area, secretly place an antelope there at night, and the
    maiden's father finds it in the morning. After the family eats and dries the meat,
    the Pookongs repeat the ruse with a deer. The father states that if another large
    animal is caught the Pookongs may come for his daughter. After the deer is found,
    he tells his daughter to wait for someone that night. The two brothers quarrel
    over which will go, and their grandmother says the older Pookong should go.
  language: English
  quote_policy: summarized
