canonical_text:
  quote: ''
  summary: Clouds gather over the mountains and move toward a Hopi village. The people
    expect rain for their maturing corn, but the storm brings thunder, lightning,
    and great hailstones that destroy the crops and kill the people, except for one
    man and one woman. The clouds stop and disperse; the Katcinas say they have revenged
    themselves. The surviving woman bears children, and the village is inhabited again.
