canonical_text:
  quote: ''
  summary: A battle narrative describes Hopi warriors pursuing Navaho opponents despite
    a warning, being divided and surrounded after a mounted Navaho woman leads a charge,
    fighting through repeated encirclements, and eventually using the mesa and rocks
    for refuge and ambush. A wounded Hopi nephew makes a final attack before being
    killed, while other Hopi withdraw to the mesa as Navaho mock them with captured
    clothing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Navaho man who had lived in Orafbi, been initiated into the Wtiwuchim society,
    and could speak Hopi warned Chinrwa that the Hopi should not follow because more
    Navaho were farther east.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chinrwa conveyed the warning to the Hopi warriors, but they followed the Navaho
    and formed a battle line in the valley.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A mounted Navaho woman seized a lance from a Navaho warrior and rode toward
    the Hopi line, followed by her people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Navaho broke through the Hopi line, divided the Hopi into two parties,
    and surrounded them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At sunrise the Hopi saw Navaho warriors wearing loincloths, some moccasins,
    red body paint marked with finger-drawn lines, loose hair, and riding ponies.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Hopi were wrapped in heavy buckskins, and the passage states that many
    Navaho arrows lodged in the buckskins rather than killing the Hopi.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The battle lasted until late afternoon; the Hopi repeatedly broke through
    encircling circles but were surrounded again by new parties.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Navaho had many shields and could cover themselves while encircling the
    Hopi, while the Hopi sometimes feinted and shot from the side past shields.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Navaho riders sometimes turned their ponies quickly and lowered themselves
    beside the pony to evade shots.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Navaho arms included bows, arrows, shields, war clubs, and a few guns and
    pistols obtained from Spaniards.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: A small Hopi party climbed the mesa point called Shongohtoika; pursuing Navaho
    stopped because of rocks and boulders near the mesa.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Chinfwa’s nephew, wounded in the foot and unable to walk, said he wanted at
    least to shoot someone before being left behind.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The wounded nephew laid his remaining arrows on his lap, shot a Navaho, and
    was then surrounded, killed with lances and clubs, and stripped of buckskin and
    clothing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Only three Hopi were willing to descend from the mesa to help their hard-pressed
    brethren; they hid behind rocks and killed several Navaho from shelter.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: After the ambush, the Navaho scattered and the pursued Hopi joined the three
    Hopi behind the rocks before ascending the mesa.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: A Navaho party ascended the opposite mesa point but did not attack; they waved
    buckskins and clothing taken from slain Hopi and mocked them.
  category: action
  evidence_refs:
  - ev:9
