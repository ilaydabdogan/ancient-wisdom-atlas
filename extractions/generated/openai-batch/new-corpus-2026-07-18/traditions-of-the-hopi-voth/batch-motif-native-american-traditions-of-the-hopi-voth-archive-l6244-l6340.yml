- id: obs:1
  text: A one-horned Kwdniita with chief facial decoration helps the traveler over
    or down a precipice by placing him on the traveler's kilt, after which the traveler
    descends slowly as if flying.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Smoke rises from the ground at a place where a Skeleton woman tells the traveler
    not to go, saying wicked people are thrown in and burned there.
