canonical_text:
  quote: ''
  summary: A first-person traveler is helped over a precipice by a one-horned Kwdniita,
    warned by a Skeleton woman away from a smoky place where wicked people are burned,
    and visits the Skeleton house. The Skeleton residents identify his clan, feed
    him, describe their dark and poor condition, ask for prayer-offerings in exchange
    for rain and crops, and send him home. The traveler reports punishments of wicked
    people in the other world. The next tale begins with the poor youth Kocheilap
    Tiyo in Mishongnovi being outfitted and instructed by old men for a winter hunt.
  language: English
  quote_policy: summarized
