- id: obs:7
  text: The Skeleton residents say the traveler’s flesh is still salty, that he will
    not stay with them, and that they live poorly in darkness with worn-out nakwakwosis
    on their foreheads.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Skeleton residents ask the village to make nakwakwosis and bahos for them
