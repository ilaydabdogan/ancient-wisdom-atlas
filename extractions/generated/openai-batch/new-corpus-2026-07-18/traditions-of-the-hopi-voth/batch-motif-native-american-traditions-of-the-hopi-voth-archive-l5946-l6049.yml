canonical_text:
  quote: ''
  summary: A young man is shown afterlife dwellings where good chiefs live among blossoms
    and is told that non-wicked people from Oraibi may come there by a prepared road.
    He returns past punishment places, re-enters his body, wakes, and reports to his
    parents that the dead live in the Skeleton House, with punishments for the wicked
    and good conditions for chiefs. Later he takes medicine again, dies, is buried,
    and subsequently appears to his homesick parents as a speaking Bachro bird who
    says he lives well and will visit them.
  language: English
  quote_policy: summarized
