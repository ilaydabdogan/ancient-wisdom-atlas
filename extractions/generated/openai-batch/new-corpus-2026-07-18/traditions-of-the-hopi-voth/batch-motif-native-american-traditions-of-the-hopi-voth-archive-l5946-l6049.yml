- id: obs:2
  text: Kwanitaka says these chiefs were good in Oraibi and therefore are present
    in that condition.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The place contains many grasses, plants, and blossoms of every description.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Kwanitaka says that anyone in Oraibi who is not wicked will come there, and
    that a road has been prepared for them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kwanitaka tells the young man to report what he has seen and says that, if
    the young man thinks of coming there again, he must eat some of his medicine again.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the return, the young man reaches Kwan-mongwi at a divided road and is
    told to run fast because his parents are waiting.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The young man passes punished thieves near Awatovi, a woman, one who had killed
    someone, and one who did not want it to rain.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The young man returns to his house in Oraibi, enters his body, and wakes at
    sunrise.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The young man tells his parents that the dead are truly living in the Skeleton
    House, that Kwan-mongwi burns wicked ones and throws others into the dark, and
    that former chiefs live well and are chiefs again.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Later the young man says he will go back, takes medicine that night, sleeps,
    is really dead by morning, and is buried below Kuivo.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After his burial, the father encounters a Bachro bird at the field; the bird
    speaks of the father's homesickness and tells him not to be that way.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Four days later the parents go to the field, encounter the speaking visitor
    again, and are told that he lives well and will come to see them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Afterward, when the father walks in the field, the visitor comes there, and
    the family continues to live there.
  category: sequence
  evidence_refs:
  - ev:10
