canonical_text:
  quote: ''
  summary: 'In the tale headed “HEAD. 2,” a hairless Kalatoto living near Oraibi tries
    to acquire a head covering by attaching discarded hair with pitch and then cactus
    juice; children repeatedly trouble him, and when he uses pitch before a Katcina
    dance, the pitch and hair adhere to the floor while he sleeps, preventing him
    from rising, and he dies hungry. The passage then begins “THE CHILD WHO TURNED
    INTO AN OWL”: a mother beats and casts out a crying child after threatening to
    give it to the Owl; a large Owl carries the child to a cave near Bayupki where
    Owl children live, while the mother later searches unsuccessfully and wood-gathering
    men hear a moaning song near the cave.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Kalatoto lived at Kutukwuhschomo and often visited Oraibi to look for food
    among refuse near the village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children of the village teased and worried the Kalatoto, snapping their fingernails
    against his head so severely that he sometimes almost died.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Kalatoto had no hair or bodily protection and wanted hair on his head
    like the Hopi children had.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Kalatoto gathered pitch from the timber and discarded hair from village
    refuse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: He put pitch on his head, pasted hair onto it, and returned to the village
    with hair like the Hopi children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The children recognized the smell of pitch, used small sticks to remove it
    from his head, chewed the pitch, and scraped it all off.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: He later used cactus juice to fasten the hair; the children could not remove
    it with sticks, but the dried juice cracked and fell off with the hair by evening.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Before a Katcina dance, he again attached hair with pitch, slept, and in the
    morning the warmed pitch and hair adhered to the floor so that he could not rise.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Kalatoto heard the Katcinas dance and sing all day but could not get up,
    received no food, and perished.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A mother in Shupaulavi beat a crying child and said she would throw the child
    out to the Owl.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The mother dragged the child out of the house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A large Owl heard the child’s moaning, came to the child, put the child on
    his back, and carried the child away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Owl lived in a little cave at the side of the bluff on which Bayupki was
