canonical_text:
  quote: ''
  summary: 'The supplied passage covers connected Hopi animal tales: mice escape an
    angry Badger, scatter through the country, and become crop-eaters and unseen helpers
    of sick travelers; another episode explains Badger and Small Gray Mice as former
    Hopi doctors and rivals, with Mouse diagnosing Badger’s deliberate fast through
    ritual song; a further tale begins with a little Mouse threatened by an Owl, killing
    it with pointed sticks and organizing a feather dance with other mice.'
  language: English, with Hopi terms and song text
  quote_policy: summarized
