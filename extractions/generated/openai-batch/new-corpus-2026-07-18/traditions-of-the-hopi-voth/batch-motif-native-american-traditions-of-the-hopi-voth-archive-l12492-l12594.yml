canonical_text:
  quote: ''
  summary: The passage narrates the handling of prayer-offerings, a spreading fire
    seen from the San Francisco Mountains and ignored by people gambling in kivas,
    the destruction of two villages with only a few escaping, and the saving of Oraibi
    through Spider Woman's moist web stretched between two feathered arrows. It then
    begins another story in which a Sikyatki Racer/Hamsontaka Katcina seeks revenge
    after a Walpi man cuts off his hair knot during a race.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief from Htickovi, his friend, and the chief of Pivanhonfcapi smoked over
    prayer-offerings received from the Yayaponchatu; one offering was sent to the
    San Francisco Mountains, two were hidden by the chiefs, and the Yayaponchatu chief
    took his offering home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On following nights women and some men assembled in kivas to gamble, while
    some men did not participate.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Observers outside the kiva saw light, fire, and smoke in the San Francisco
    Mountains increasing over several nights and warned the gamblers, who repeatedly
    dismissed the reports.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When one player came out and saw smoke and fire rolling toward the villages,
    the people tried to gather belongings and flee, but many who delayed were suffocated
    or burned; only a few escaped from the two villages.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The escaped inhabitants left that part of the country, and small ruins are
    identified as sites of their temporary houses.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The village chief of Oraibi, worried for his children, went to Spider Woman's
    house south of the village, halfway down the mesa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Spider Woman advised the Oraibi chief to make two arrows using bluebird and
    wurfnawuu feathers; one arrow was planted west of the village, and the other was
    planted before the shrine of Achamali north of the village.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Spider Woman wove a web network between the two arrows and moistened it with
    water; when the fire reached the moist web, its force was broken and Oraibi was
    saved.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the beginning of the Sikyatki story, Racer Katcinas from Sikyatki came
    to Walpi for a race, and a Walpi man cut off the hair knot of the Hamsontaka Katcina
    instead of only a small portion of the side lock.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The angered Hamsontaka Katcina practiced running, decided to take revenge,
    took a knife, and waited on a bluff opposite Sikyatki.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At a dance in Sikyatki, the masked Hamsontaka Katcina raced four clowns and
    cut small portions of their side locks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Hamsontaka Katcina recognized a maiden on a house as the sister of the
    man who had cut his hair and determined to take revenge on her.
  category: relationship
  evidence_refs:
  - ev:7
