canonical_text:
  quote: After the young man had fallen asleep he saw a path leading westward. It
    was the road to the Skeleton house.
  summary: A young man at Shong6pavi wonders what becomes of the dead. His father,
    the village chief, consults others and calls Badger Old Man, who uses medicine
    and funerary preparation to make the young man appear to die and travel. The young
    man follows a westward road toward Skeleton house, meets a delayed dead person,
    is lowered over a bluff on his kilt, encounters Skeleton Woman, learns of a smoke
    place where wicked dead are destroyed, and reaches a large Skeleton village where
    he is directed to his Bear clan ancestors. A sunflower-stem ladder breaks under
    him though Skeletons can use it, so he remains below and asks to be fed.
  language: English
  quote_policy: quoted
