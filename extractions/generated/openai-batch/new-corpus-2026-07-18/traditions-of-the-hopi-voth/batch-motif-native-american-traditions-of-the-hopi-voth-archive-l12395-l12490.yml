canonical_text:
  quote: ''
  summary: A chief of Pivanhonapi, angered by gambling and neglect in his village,
    asks the Yayaponchatu, a neighboring people associated with storms, fire, and
    supernatural forces, to punish his people. Offered a choice between fire and storm
    as the means of judgment, he chooses fire. He shares the secret with the chief
    of Htickovi and that chief’s assistant, then arranges a dance. The Yayaponchatu
    appear last, masked and ritually decorated, sing an ominous song about red cloud,
    mist, and villages, and carry prayer-offerings containing sacred meal, honey packets,
    nakwakwosis, and small sparks of fire. At the end, three offerings are handed
    to the Pivanhonapi chief, the Htickovi chief, and the assistant, while the leader
    retains the fourth.
  language: English
  quote_policy: summarized
