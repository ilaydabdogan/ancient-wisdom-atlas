canonical_text:
  quote: ''
  summary: The passage first describes a high Crow near Orafbi who watches corn planting,
    eats corn, and is identified with Sickness, secretly influencing people toward
    illness, death, and wrongdoing. An unnamed good being or power counteracts the
    Crow but is said to be weaker. The passage then begins the story of a beautiful
    maiden of Orafbi who rejects human suitors and six directional Cloud chiefs with
    colored bridal outfits. Pavayoyikashi, a rain deity from the far south, dresses
    ceremonially, approaches her, and asks her to seek her parents' consent for marriage;
    the parents do not object.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Crow lives on a high mesa southeast of Orafbi, near the sun shrines, and
    watches people planting corn in the valley.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Crow says the people are planting for him, notes which field was planted
    first, and eats the corn there when ears appear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Crow is also identified with Sickness and is said to secretly and invisibly
    influence or charm people so that some become sick and some die.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Crow's harmful influence can also lead people to steal and to live with
    what the passage glosses as a disobedient heart.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An unnamed good being or power tries to counteract the Crow's influence; the
    Hopi are described as uncertain whether it is a personality or a power.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Crow and the good being or power are said to wrangle over individual Hopi,
    one exerting bad influence and the other counteracting it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The good being or power may be felt as a sudden shock or as the person striking
    a foot against a nearby object, which is interpreted as an attempt to save the
    person from the Crow's influence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A beautiful maiden in northern Orafbi rejects flowers and other attempts by
    the village young men to gain her favor.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Six Cloud chiefs associated with north, west, south, east, above, and below
    each prepare colored bridal outfits and offer them to the maiden, but she refuses
    them all.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Pavayoyikashi, a rain deity from the far south, dresses and paints himself
    ceremonially, takes a bow and arrows in a panther-skin quiver, and goes to Orafbi.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Pavayoyikashi finds the maiden watching her father's field, asks her to seek
    parental consent, says he will return in four days if they agree, and the parents
    offer no objections.
  category: sequence
  evidence_refs:
  - ev:9
