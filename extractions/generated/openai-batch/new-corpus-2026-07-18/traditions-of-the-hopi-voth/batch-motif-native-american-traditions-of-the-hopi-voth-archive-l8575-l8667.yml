canonical_text:
  quote: ''
  summary: Spider Woman, aided secretly by Mole and other animal helpers, defeats
    Hasohkata in contests, releases the captive young man Chorzhvukfqolo, takes Hasohkata's
    possessions, and the animals kill him. Spider Woman then learns through Wren that
    the young man's family longs for him, lowers him to earth on a spider-web thread,
    and he reunites with his parents and sisters. The passage also begins the next
    tale, in which Navaho have stolen a Hopi boy and make him work.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Spider Woman uses four cups in a ball-guessing contest, while Mole secretly
    fastens the ball in one cup; Hasohkata fails to find it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Hasohkata is beaten in the cup game, he becomes angry, refuses to release
    the captive, and sets a second challenge involving hard brush outside his kiva.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Mole goes underground and gnaws off large brush roots, after which the others
    pull out enough brush that Hasohkata admits defeat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hasohkata's kiva contains goods taken from earlier gambling visitors and a
    large hole filled with bones from people he had killed.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bear tears open Hasohkata's breast and removes his heart; Wolves, Coyotes,
    Wildcats, and others tear apart and devour the corpse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator explains that these animals still kill people when possible and
    that this is why the Hopi hunt and kill them.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Spider Woman dismisses the animal companions to their homes and tells her
    grandchild that he need not fear further harm.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wren has gone down to earth, seen the young man's parents longing for him,
    and reports this to Spider Woman, who says he may go home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the opening through which Eagles had brought the young man, Spider Woman
    arranges sticks and brush, spins a web, carries the young man on her back, and
    descends by the web thread while he keeps his eyes closed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The young man reaches his parents' home; after initial doubt, his father and
    mother recognize him, and his sisters are also happy at his return.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The next tale begins by saying that Navaho living east of Oraibi had stolen
    a little Hopi boy, treated him harshly, made him work constantly, and gave him
    little food.
  category: sequence
  evidence_refs:
  - ev:8
