canonical_text:
  quote: '"Now then, I shall feast upon that one."'
  summary: At Orafbi, people disappear while gathering wood. An unnamed man and woman
    separately escape C6oyoko, who is killing people. The village chief asks the Paokong
    brothers, who live with Spider Woman, to avenge the community. The brothers agree
    in exchange for balls, travel with lightning arrows and a ball to C6oyoko's house,
    kill C6oyok Wuhti, find human flesh and trophies from killed Hopi, and wait as
    C6oyoko returns.
  language: English with Hopi names and song lines
