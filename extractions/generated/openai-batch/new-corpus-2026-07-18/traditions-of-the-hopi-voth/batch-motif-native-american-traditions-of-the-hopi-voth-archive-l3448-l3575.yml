canonical_text:
  quote: ''
  summary: 'The passage first concludes an account in which Spaniards camp at a water
    place west of Walpi, trade clothing with Hopi visitors, and then cease encroaching;
    later fear spread by the Shongopavi chief leads many Shupaulavi people to move
    to Shongopavi. A new account begins: Katcinas living in a mountain west of Kadtukvi
    descend at night to dance in a village plaza. The villagers, not knowing them,
    decide to kill them. The Snow Katcinas flee into a crack or gulch, where the pursuing
    people burn them. A Hototo Katcina Uncle survives, emerges, returns toward the
    mountain singing and sobbing, tells the Hehea Katcina and then the mountain Katcinas
    what happened. The Katcina chief vows revenge; the Katcinas assemble, produce
    hail for three days, and raise a cloud over the mountains as their standard.'
  language: English
  quote_policy: summarized
