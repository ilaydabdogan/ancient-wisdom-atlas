- id: obs:1
  text: A family lives at Mishongnovi; the maiden goes at noon to Toriva spring to
    get water.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spring water moves; Balolookong comes out, draws the maiden toward him
    by strong inhalations, embraces her, and disappears with her into the water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother follows the maiden's tracks to the spring, finds the tracks ending
    at the water, and finds the jug and carrying blanket but not the maiden.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The father makes a ball and an arrow with blue-bird feathers and goes to the
    house of Pookonghoya, Balongahoya, and Spider Woman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Spider Woman gives the father hurushiki that is small but keeps increasing
    again as he eats from it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The father gives bows to the two youths and an eagle nakwakwosi to Spider
    Woman; Spider Woman says the youths have seen what happened and names Balolookong
    as the one who dragged the daughter into the water.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The family and friends make many nakwakwosis in a tray; the brother of the
    lost maiden is dressed with ceremonial clothing and ornaments and given a ball
    and taldwayi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Spider Woman instructs the brother not to be afraid or cry, to dance while
    the Pookongs sing, to seize his sister if Balolookong appears with her, and to
    strike Balolookong with the tonpi.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the spring, the Pookongs sing a song described as archaic, while the brother
    shakes his ball, holds the taldwayi, and dances at the water's edge.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The water moves again and Balolookong comes out holding the maiden, who is
    still dressed and wearing turquoise ear-pendants; she asks her elder brother to
    take her.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: When the brother reaches for the maiden he begins to cry; Balolookong immediately
    disappears into the water with her, and Spider Woman proposes trying again with
    courage.
  category: sequence
  evidence_refs:
  - ev:9
