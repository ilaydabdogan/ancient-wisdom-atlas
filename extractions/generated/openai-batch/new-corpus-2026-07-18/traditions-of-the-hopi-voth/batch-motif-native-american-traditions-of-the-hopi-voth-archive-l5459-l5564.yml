canonical_text:
  quote: ''
  summary: A maiden from a Mishongnovi family goes to Toriva spring for water. Balolookong
    comes out of the moving water, draws her in, and disappears with her. Her family
    discovers only her tracks, jug, and blanket at the water. The father seeks help
    from Pookonghoya, Balongahoya, and Spider Woman, who identify the abductor and
    direct a ritual recovery attempt using offerings, song, dance, and the maiden's
    brother as rescuer. At the spring Balolookong appears holding the maiden, but
    when the brother cries while reaching for her, Balolookong disappears into the
    water with her again.
  language: English with Hopi names and terms
  quote_policy: summarized
