canonical_text:
  quote: ''
  summary: 'The passage concludes an episode in which a young man, warned by Fly not
    to eat food offered by a dangerous mana, retrieves his shirt and beads from her
    house. When he shakes these items at her, a charm changes her into Tfhkuy Wuhti;
    the costumes of youths she had killed become deer, antelope, and rabbits and flee.
    She marks an antelope with her bodily odor and explains that hunting these animals
    will henceforth be difficult. The passage then describes her association with
    the Little Colorado River and hunters’ offerings to her. A new tale begins in
    Shupaulavi: a grandmother dresses her grandson for running and warns him not to
    pass a dangerous maiden’s house, but he later approaches the maiden, who asks
    to wear his costume and dance.'
  language: English
  quote_policy: summarized
