canonical_text:
  quote: ''
  summary: Pookong fetches a maiden for marriage after her father acknowledges his
    gift of trapped game. At Pookong’s home, Spider Woman receives the bride, gives
    her miraculously increasing hurushuki, oversees offerings, corn grinding, rain
    bathing, food preparation, hidden spider-weaving of a bridal costume, and head
    washing with yucca suds. The bride is dressed and sent back to her mother’s house,
    while Pookong follows carrying meat and is instructed to sit silently at his wife’s
    home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pookong goes to the maiden’s house, finds her grinding corn, and is told by
    her father that he may fetch her because he trapped game for the family.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maiden’s mother fills a tray with meal for her daughter, and Pookong leads
    the maiden to his house to marry her.
  category: action
  evidence_refs:
