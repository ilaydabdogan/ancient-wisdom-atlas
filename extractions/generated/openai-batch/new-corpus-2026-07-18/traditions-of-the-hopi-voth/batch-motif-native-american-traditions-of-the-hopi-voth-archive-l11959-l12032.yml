canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which a Grasshopper mother redirects
    Hopi children from taking young Grasshoppers to taking young Sparrow-Hawks. It
    then gives the tale of the Crow and the Hawk: the Crow and Hawk, both parents
    and hunters, agree to friendship and exchange visits. Crow serves Hawk strong-smelling
    food that he dislikes, and he pretends to eat. Hawk later serves Crow rabbit skins
    and intestines, expecting rejection, but Crow eats them heartily. Both birds return
    to their homes and continue hatching young.'
  language: English
  quote_policy: summarized
