canonical_text:
  quote: ''
  summary: A young man seeks help from an old war chief to recover his sister's body
    from a sorcerers' gathering. The war chief arms them and summons a sky deity,
    Hawk, and skeleton flies. In a kiva-like place, sorcerers restore the maiden's
    breath from a wheel and revive her. A skeleton fly distracts the assembly, and
    Hawk carries the maiden away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man follows the group to its meeting place, sees his sister's body
    lying north of a fireplace, and returns to the village to seek help.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The war chief's wife hears the young man's call, wakes her husband, and the
    household receives him by making a fire before he tells his story.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old war chief agrees to assist the young man and gives him war costume,
    shield, weapons, and similar equipment while putting on another set himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The war chief uses a bone whistle directed upward, after which Cotukvnangwuu,
    identified as the Star and Cloud deity living in the sky, enters and agrees to
    help.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The war chief whistles again, and Hawk flies down, hears the story, and promises
    to go with them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The war chief spits into his left hand, whistles, and many skeleton flies
    come to drink the spittle before he closes his hand on them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The rescuing party enters the kiva-like meeting place unnoticed while the
    sorcerers are engaged in resuscitating the maiden.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sorcerers have removed wrappings from the body, covered it with a native
    cloth, and are singing a song.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A wheel contains the maiden's breath; an old sorcerer removes the breath from
    the wheel and returns it to the body, after which the maiden revives.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After reviving, the maiden says she is hot, sees she is among the sorcerers,
    and cries bitterly.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: An old woman washes the maiden's face, rubs corn meal on it, combs and ties
    her hair in whorls, dresses her, and directs her to lie on a prepared bed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A footnote states that the maiden was told she would be punished for persistently
    refusing marriage by sexual access from the men present.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The old warrior releases one skeleton fly; its humming causes some of those
    present to suspect that someone is in the kiva.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Hawk rushes into the kiva, throws aside the old man, takes the maiden onto
    his back, and carries her out.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: After Hawk removes the maiden, the maiden's brother speaks, and the people
    in the kiva notice the presence of their enemies.
  category: sequence
  evidence_refs:
  - ev:10
