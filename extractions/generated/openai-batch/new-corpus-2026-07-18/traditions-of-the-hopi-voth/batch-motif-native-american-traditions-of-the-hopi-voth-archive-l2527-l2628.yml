canonical_text:
  quote: ''
  summary: A group of youths remains in a kiva for four days, receives ritual washing,
    costumes, paint, feathers, and other items from the Hawk-man, prepares ovens and
    hidden strings, emerges with singers into the plaza, disrupts the village, undergoes
    an oven death-and-resuscitation performance, produces watermelons and rabbits
    from covered bundles, recovers hidden strings, and displays and restores a split
    water-jug marked inside with cloud symbols.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The youths remained in the kiva for four days while their uncle came nightly
    to feed and care for them, and he washed their heads after the fourth day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hawk-man brought ritual clothing and ornaments for the youths, including
    kilts, beads, eagle feathers, twisted yarn, ear pendants, ankle bands, and yellow
    paint.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the night one youth dug four ovens on the plaza, while others buried
    a long cotton string and stretched strings along village houses with dough.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The kiva watcher begged for wood in the village and heated the four ovens
    on the plaza.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Hawk-man dressed and painted the youths with yellow bands, covered their
    faces with corn-pollen, and fitted them with beads, yarn, feathers, belts, kilts,
    and wrist yarn.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The singers came out first, each throwing a pinch of sacred meal toward the
    sun, then went to the plaza and sang.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Yayaátu emerged after the singers and went to the plaza, with the priest's
    son carrying the mochapu used by the Hawk-man in initiating the youths.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Yayaátu went through the village, climbed roofs, jumped onto people, tore
    down chimneys, seized children and people, and threatened to throw them from roofs;
    the people became angry and beat them with sticks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The priest's son jumped into an oven, was drawn out dead, wrapped in the mochapu,
    thrown into the kiva, and resuscitated by the Hawk-man and the old woman; others
    repeated the same treatment.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Parents and relatives became alarmed and cried that their children were being
    killed, while the kiva watcher told them not to come near because a dance was
    still to come.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A covered bundle was handled and sung over by the Yayaátu, and when opened
    it contained many fine large watermelons.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: A second covered bundle was handled similarly, and when uncovered many little
    cotton-tail rabbits jumped up and were distributed among children.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Yayaátu hunted for the buried and attached strings through the village,
    and others wound the found strings into balls.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: A string ran into a water-jug at the Cotton-tail Rabbit clan house; the jug
    was taken to the plaza, split in two, shown to contain cloud symbols painted inside
    each half, covered, sung over, and restored whole.
  category: sequence
  evidence_refs:
  - ev:12
