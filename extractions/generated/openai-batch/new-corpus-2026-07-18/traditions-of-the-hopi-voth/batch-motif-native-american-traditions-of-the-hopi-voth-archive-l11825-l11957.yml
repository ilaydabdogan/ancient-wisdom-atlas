    of it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: After each taunting song, the Hakwa dashes into a large crack in the rock.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Sparrow-Hawk warns the Hakwa, becomes angrier after repeated songs, and
