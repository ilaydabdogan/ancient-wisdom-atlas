canonical_text:
  quote: ''
  summary: The passage finishes a tale in which Mice perform a protected imitation
    dance to gain seeds, but a Hawk kills many of them. It then gives the tale of
    the Sparrow-Hawk and the Hakwa, in which a taunting Hakwa is killed through a
    decoy ambush. The passage ends with the beginning of a tale in which a Sparrow-Hawk
    mother catches Grasshoppers and Prayer Beetles for her young, and a Grasshopper
    mother laments.
  language: English with Hopi terms and song lines
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator explains that the Mice dance in order to bring about an opportunity
    to obtain seeds and kernels again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mice set pointed sticks farther from the Mouse house or hole for protection
    in case more Owls were nearby.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Mice tie the larger feathers of the dead Owl into a bunch, place it in
    the center of the enclosure as a tfponi, wear feather bunches on their heads,
    and have a leader holding a little bow and tiny arrows.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Mice perform an imitation of the Mdmchitu Fraternity dance and keep within
    the limits of the sticks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A large Hawk sees the Mice, swoops down despite the pointed sticks, kills
    many of them, carries one in each talon to Ishmovala, and devours them there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the next tale, a Sparrow-Hawk lives at Kalatipka with a brood, while a
    large Hakwa lives farther down in the rock.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Sparrow-Hawk catches lizards for its brood but does not catch the Hakwa,
