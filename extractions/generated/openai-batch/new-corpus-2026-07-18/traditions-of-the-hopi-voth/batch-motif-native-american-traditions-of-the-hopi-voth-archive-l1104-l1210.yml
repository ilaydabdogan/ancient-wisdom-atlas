canonical_text:
  quote: ''
  summary: 'The passage first describes people after the creation of the sun deciding
    in council to travel east in separate groups toward the place where the sun rises.
    The White People take a southern route, a woman makes horses from body scales,
    they arrive first at the sunrise, stars fall, and the remaining groups settle
    where they are. The next section begins a Hopi wandering account: people once
    lived below in abundance, conditions deteriorated, chiefs planned escape after
    hearing sounds above, a Pawaofcaya bird was made alive by song and sent upward
    by means of pine/fir and reed ladders, and it returned after finding a large empty
    space above.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the sun had been created, the people experienced warmth and light, worked
    well, and children played.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chiefs met in council and proposed moving eastward in separate routes to see
    who would first arrive at the place where the sun rises.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The White People traveled by a southern route, the Hopi by a more northern
    route, and the Pueblo Indians of New Mexico traveled between them; parties sometimes
    stayed for years, built houses, and planted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The traveling groups became estranged, attacked and killed one another, and
    the Castilians are described as especially warlike.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chiefs had agreed that many stars would fall from the sky when one party
    reached the place where the sun rises, and the other traveling parties should
    then settle wherever they were.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A woman of the White People bathed, rubbed scales from her body, made horses
    from those scales, and the horses enabled faster travel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The White People arrived first at the place where the sun rises, after which
    many stars fell and the other traveling people recognized that someone had arrived.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: It had also been agreed that groups who had not reached the sunrise could
    notify those who had arrived there if enemies molested them, and the latter would
    help.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A later account begins with people living down below in a good condition where
    things grew well, rain was constant, and everything blossomed.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Conditions below deteriorated: chiefs did wrong, rain stopped, crops became
    small, winds blew, people became sick, sorcerers increased, contentions arose,
    and chiefs'' wives were taken.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The chiefs became angry, considered revenge and escape, and discussed sounds
    heard above that seemed like footsteps.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Kik-mongwi said they wanted to investigate above and, if permitted, move
    up there.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The chiefs made a Pawaofcaya bird, sang over it, brought it to life, and asked
    it to go above to find out about the sounds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The chief planted a pine or fir, but it did not reach up; a reed planted beside
    it did reach up.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Pawaofcaya ascended in circles around the two ladders, passed through
    an opening at the top, found a large space but no one, returned tired, and reported
    back.
  category: sequence
  evidence_refs:
  - ev:9
