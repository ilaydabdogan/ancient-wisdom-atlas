canonical_text:
  quote: ''
  summary: In a cold world without the sun, the people warm their fields with fire
    and harvest crops. The chiefs, consulting with Skeleton, first make a moon symbol
    from buffalo hide, paint, a stick, and cloth, and throw it eastward into the sky
    with an unnamed person standing on it. The moon gives dim light but little warmth.
    The chiefs then make a more elaborate sun symbol from cloth, colored pigments,
    corn-husks, red horse-hair, eagle-tail feathers, an abalone shell, and feather
    prayer-offerings, and throw it eastward into the sky with another unnamed person.
    It becomes the sun and gives warmth. Notes connect the sun symbol and materials
    with Hopi ceremonial practice and explain the continued presence of the men behind
    the sun and moon and the rotation of the sun by eastern and western Huruing Wuhti.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people remain in one place, make fields, and keep a fire near the fields
    to warm the ground so crops can grow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After gathering provisions, the people plan to travel again, but the absence
    of the sun and the cold remain problems.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The chiefs meet in council with Skeleton to discuss making a sun like the
    one they had in the under-world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first celestial disk is made from dressed buffalo hide stretched over
    a wooden ring, painted with white kaolin and black paint, given a moon image around
    the edge, sprinkled in the center, attached to a stick, and placed on white native
    cloth.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: An unnamed person is directed to stand on the moon symbol while the chiefs
    swing the cloth and throw it upward, after which it flies eastward into the sky.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A light appears in the east and the object proves to be the moon, but its
    light is dim and the people are still cold and have difficulty seeing in the fields.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The chiefs meet again because the moonlight is insufficient and decide to
    make a better object, using a different material for the disk.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The sun symbol is described as a round disk with a painted face, colored forehead,
    corn-husk zigzag ring, red horse-hair string, eagle-tail feathers, an abalone
    shell, and feather nakwakwosis.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: An unnamed person is again asked to stand on the symbol; the cloth and symbol
    are thrown upward, twirling toward the east, and a brighter, warmer light rises
    that proves to be the sun.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A note says the sun's heat comes partly from the small nakwakwosis and partly
    from the glittering shell, and that the man thrown up with the sun holds it in
    front of himself.
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: A note says the sun is rotated by the Huruing Wuhti of the east and west using
    a string; the moon-man remains behind the moon holding it by the attached stick,
    and the moon's increase and decrease are caused by a covering, probably the cloth.
  category: other
  evidence_refs:
  - ev:10
- id: obs:12
  text: Notes state that the paints are still used in ceremonies, the sun symbol resembles
    one worn by flute players in the Flute ceremony, the zigzag ring is made secretively,
    and the bird feathers are prized for warm-weather prayer-offerings.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:11
