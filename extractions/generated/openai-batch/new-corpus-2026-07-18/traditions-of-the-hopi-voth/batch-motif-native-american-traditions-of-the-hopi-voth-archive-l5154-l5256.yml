  text: A mother figure cooks the meat brought by P6okong in a vessel and prepares
    a feast; after eating, the people converse and later retire for the night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: P6okong sits on the floor with his arms folded over his knees, removes his
    wrist band, holds it before his eyes, and looks through it while the people watch.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Spider Woman asks P6okong whether he followed her instruction about the wrist
    band; after he reports his action, she says a son-in-law should sit quietly with
    hands folded near his face so his eyes appear to look at the arm band.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: At planting time, Spider Woman gives P6okong a small parcel of different kinds
    of corn to plant.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: P6okong tells his father-in-law not to take the prepared sack of corn, saying
    the small parcel is a great deal, and the father-in-law puts the sack away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the field, P6okong puts one grain of corn in each hole and tells his father-in-law
