canonical_text:
  quote: ''
  summary: P6okong misapplies instructions about son-in-law behavior and field work.
    Spider Woman corrects him, gives him a small parcel of corn for planting, and
    repeatedly rebukes his literal misunderstandings. The small corn parcel suffices
    and increases, while P6okong fails twice to hoe properly by making actual ant
    hills and then scattering fat in the field.
  language: English
  quote_policy: summarized
literal_observations:
