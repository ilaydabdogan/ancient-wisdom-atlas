canonical_text:
  quote: ''
  summary: In one episode Coyote recruits Mole to help him and Badger tunnel under
    the place where Hopi workers have left food, and the three remove and divide the
    food while the workers go hungry. Later Badger deceives Coyote by claiming he
    cut fat from his own body; Coyote imitates this with a knife, bleeds, and dies.
    A following tale begins with Coyote and Badger as friends who exchange visits
    and meals of juniper berries and rabbit.
  language: English
  quote_policy: summarized
