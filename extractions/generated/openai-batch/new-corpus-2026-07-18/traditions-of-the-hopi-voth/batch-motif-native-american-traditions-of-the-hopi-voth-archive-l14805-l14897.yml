    kilt, and Skeleton Woman explains the smoke where wicked people are destroyed.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized rather than quoted at length.
