candidate_motifs:
- id: motif:1
  label: Journey to the land of the dead and return
  taxonomy_refs:
  - afterlife_journey_map
  - return
  basis: The young man undergoes a death-like rite, follows a westward path to Skeleton
    House, observes inhabitants and punishments, receives instructions, and returns
    to his body alive.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage is an ethnographic summary rather than a full narrated version;
    details of ritual meaning are not expanded here.
- id: motif:2
  label: Ritual death followed by revival
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: Badger Old Man's medicine causes the young man to die, and after the otherworld
    journey he re-enters his body and comes to life again.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: medium
  cautions: The text describes an induced death and revival, but whether to classify
    it as symbolic, visionary, or literal is not explained in the excerpt.
- id: motif:3
  label: Descent and ascent across an otherworld threshold
  taxonomy_refs:
  - hero_descent
  - ascent
  basis: The young man is sent over a precipice on a kilt, descends slowly as if flying,
    later mounts the kilt again, and is lifted back by a breeze.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: The traveler is a chief's son and witness, not explicitly called a hero
    in the passage.
- id: motif:4
  label: Postmortem moral consequences
  taxonomy_refs: []
  basis: The young man is told that wicked people are destroyed in the smoke and sees
    others carrying stones or cactus bundles as punishment, while good chiefs are
    seen elsewhere.
  evidence_refs:
  - ev:2
  - ev:4
