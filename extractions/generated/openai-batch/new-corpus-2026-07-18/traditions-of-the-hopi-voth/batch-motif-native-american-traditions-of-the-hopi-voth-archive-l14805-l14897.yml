canonical_text:
  quote: ''
  summary: 'The passage contains several condensed Hopi story summaries: a chief''s
    son undergoes a medicine-induced death, journeys west to Skeleton House, observes
    the dead and returns; a poor youth-hunter escapes Skeleton Woman with help from
    cricket dancers; Masauwuu courts and marries a maiden; Hano hunters disturb Masauwuu
    while hunting; and two skeleton-like Yayaponchatu trade broom grass for tobacco
    in Oraibi kivas.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A village chief's son repeatedly looks toward graveyards and asks whether
    the dead continue to live somewhere.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Badger Old Man prepares the young man by dressing him as dead, placing him
    on white 6wa, and putting medicine in his mouth, ears, and on his heart.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After eating the medicine, the young man is described as dying and seeing
    a westward path to Skeleton House.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the westward journey, the young man passes a stick enclosure, cactus and
    agave plants, a steep bluff, and smoke that hides the house.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A chief at the bluff places the young man on his kilt and throws the kilt
    over the precipice, after which the young man slowly descends as if flying.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Skeleton Woman explains that the smoke comes from a place where wicked people
    are thrown in and destroyed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: At Skeleton House, Skeleton people gather, ask who the young man is, and take
    him to the Bear Clan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The young man tries to climb a ladder whose rungs are made of sunflower stems,
    but the first rung breaks under him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Skeletons bring food, laugh when the young man eats it, and are said to
    eat only the odor and steam of food.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Skeletons say the young man must return because his flesh is still too
    strong.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: The Skeletons give instructions connected with making nakwakwosis at the Soyal
    Ceremony and wrapping women at death so raindrops may fall when Skeletons move
    through the sky as clouds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:12
  text: The young man sees Skeletons carrying mealing stones or bundles of cactus
    as punishment, and elsewhere sees chiefs who had been good in this world.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The young man returns to his body, comes to life again, is washed and discharged
    from charm by Badger Old Man, and tells what he saw.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: A poor youth who lacks hunting gear is equipped by older men with moccasins,
    leggings, a blanket, bow, arrows, and throwing sticks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The youth follows rabbit tracks, kills a tired jack-rabbit, and later sees
    a light in a kiva where a pretty woman invites him in.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: The woman gives the youth brains of corpses and flies, which he pretends to
    eat, and she is identified as Skeleton Woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: Skeleton Woman says she will dance and afterward sleep with the youth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:18
  text: The youth sees the kiva opening closed with threads, cuts the strings when
    Skeleton Woman dances as a skeleton, and escapes up the ladder.
  category: action
  evidence_refs:
  - ev:6
- id: obs:19
  text: Cricket dancers in another kiva hide the youth by rubbing clay over his body
    and letting him dance with them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:20
  text: Skeleton Woman pursues the youth toward the village but fails to overtake
    him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:21
  text: A beautiful maiden who refuses to marry is visited by Masauwuu in the appearance
    of a handsome young man and promises to marry him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:22
  text: The maiden sends a tray of muhpfki to Masauwuu's grandmother, and the grandmother
    gives Masauwuu rabbit meat for the maiden.
  category: action
  evidence_refs:
  - ev:7
- id: obs:23
  text: Hano hunters pursue rabbits near the Sun shrine and disturb Masauwuu, who
    hunts at night and sleeps during the day.
  category: action
  evidence_refs:
  - ev:8
- id: obs:24
  text: Masauwuu runs into a rock several times, perforates his head, and his formerly
    white head becomes bloody.
  category: sequence
  evidence_refs:
  - ev:8
