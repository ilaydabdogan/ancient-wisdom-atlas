canonical_text:
  quote: ''
  summary: A Hopi migration account describes people leaving Homolovi because of mosquitoes
    despite good fields, splitting at Coyote Spring Bluff, receiving a clan name from
    sunrise at Nishiwamu, being refused entry at Shongopavi, and settling at Weki/Shupaulavi
    by invitation. The passage then recounts a conflict in which the Shongopavi chief
    allegedly told Spaniards that Shupaulavi wanted to be taken away; the Walpi chief
    warned Shupaulavi, and the Shupaulavi chief used gifts, handshaking, embrace,
    and denial before the Spanish officer to clear himself. A note reports that the
    Shongopavi chief was said to be a Powaka able to fly to New Mexico at night.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people lived at Homolovi for an unspecified number of years and endured
    mosquitoes while remaining because they had good fields and crops.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people decided to move northeast because mosquitoes were said to sting
    children and others and cause great suffering.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Coyote Spring Bluff the migrating party separated, with the Bitki clan
    going northeast to Aotovi and others going north toward a place west of Matovi.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Nishiwamu, the sun rose just as the group arrived, with only the upper
    part described as the sun's forehead above the horizon, and the group was afterward
    called the Forehead clan.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The village chiefs of Shongopavi did not grant the group permission to move
    onto the mesa into the village; the chief is said to have regarded them as dangerous,
    bad people because of what he had heard about Palatkwapi.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the third year the group decided to return toward Homolovi, but the chief
    of Weki invited them to settle in his village and they accepted.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The village was thereafter called Shupaulavi after the new arrivals, whose
    name was linked to the mosquitoes from which they had fled.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A later Shongopavi chief is described as bearing a grudge against Shupaulavi
    and informing Spaniards in New Mexico that the inhabitants of Shupaulavi wished
    to be taken away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Walpi chief, a friend of the Shupaulavi chief, warned him that the Spaniards
    had come for Shupaulavi and advised him to take presents, shake hands, embrace
    the Spanish chief, and explain the matter.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Shupaulavi chief brought a tuihi and a blue shirt to the Spanish officer
    in a kiva, exchanged handshakes and an embrace, gave the presents, and denied
    asking for his people to be taken away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Spanish officer said that the Shupaulavi chief was not the man who had
    made the request, after which Hopi present thanked him and shook hands with him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: A note states that the Hopi said the Shongopavi chief was a Powaka, or sorcerer,
    who could fly, had gone to New Mexico at night, and returned the next day.
  category: attribute
  evidence_refs:
  - ev:9
