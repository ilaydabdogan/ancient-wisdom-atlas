canonical_text:
  quote: ''
  summary: 'The passage contains three adjacent narrative units: Badger deceives Coyote
    into believing he has cut out and roasted his own entrails, Coyote imitates the
    act and dies, and Badger uses Coyote fat to explain ant behavior and a remedy
    for ant bites; Coyote observes Kokontu maidens grinding corn and later tries to
    imitate their bluff-and-tree jumping game, dying from the fall; the following
    tale begins with a Sparrow-hawk repeatedly taking Grasshopper children to feed
    its own young until all ten are killed and their parents mourn.'
  language: English
  quote_policy: summarized
