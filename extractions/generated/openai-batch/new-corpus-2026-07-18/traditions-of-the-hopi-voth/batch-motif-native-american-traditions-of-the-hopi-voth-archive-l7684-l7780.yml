canonical_text:
  quote: ''
  summary: A young man arranges to marry a maiden and brings her to his grandmother's
    house despite ridicule from village young men. The bride performs expected household
    tasks, but no bridal costume is available until the grandmother searches rooms
    in the four directions and finds a complete costume, dresses the bride, sprinkles
    a corn-meal road, and sends her home. The husband hunts and gives meat to his
    wife's parents. Men of the Snake and Ndshabe kivas become angry and plan a war
    raid in which they hope he will be killed. The wife's father warns him; a little
    sister repeatedly announces the approaching war. When Navaho raiders approach,
    the husband and father-in-law go armed to an old woman at Achrimali/Achdmali,
    who summons Puma, Bear, Wildcat, and Wolf from rooms in the four directions.
  language: English
  quote_policy: summarized
