canonical_text:
  quote: ''
  summary: 'The passage first recalls a former good time when Katcina dances and kiva
    ceremonies brought rain, then says wicked Popwaktu multiplied and Palatkwapi was
    destroyed by a great water. A fragmentary prophetic passage describes pressure
    from White Men and Hopi Popwaktu aiding them. The main section narrates the origin
    of some Oraibi clans: people live in the under-world, the Bear chief seeks another
    world because of anger at his wife''s Butterfly dancing, Pookong and Balongahoya
    find an opening, groups emerge through it, birds open light in the sky, Bear and
    Spider clans choose different directions, the Spider clan suffers crop failure
    in the cold north, and the Spider chief ritually transforms his wife''s skin scales
    into burros and then Spaniards, whom he orders against the Bear clan.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An earlier village condition is described as good, without wicked people;
    Katcina dances and kiva ceremonies were followed by rain, and the Hopi Katcinas
    are said to have been brought from the under-world.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Powaka maiden from the under-world taught evil arts, the Popwaktu increased
    greatly, and Palatkwapi was eventually destroyed by a great water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A fragmentary prophetic speech says Hopi should continue Hopi foods and clothing
    despite pressure from White Men, that Hopi Popwaktu would help the White Men,
    and that present troubles include children being taken away and people being harassed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the under-world, people lived as they do above; the Bear clan chief became
    angry because his wife danced in the Butterfly dance and wanted to leave her.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Bear chief sent Pookong to search for another life or world, and Pookong
    and his younger brother Balongahoya reported an opening above them, which Pookong
    had reached by a reed strengthened with spit.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: 'After four days, a procession emerged through the opening: Pookong, Balongahoya,
    the Bear chief, the Spider chief, Bear clan people, Spider clan people, and many
    others; when many had come out, the Bear chief closed the opening.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: The chief sent Eagle and then Buzzard to find or enlarge light above; Buzzard
    ascended higher, was burned, and made the sky lighter.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: The Bear clan spoke for going south, the Spider clan spoke for going north,
    and the Spider clan obtained the larger crowd and went northward.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: The Spider clan settled in a northern country near the North Old Man, planted
    crops, and the chief used the Blue Flutes altar and fluting; crops grew but were
    repeatedly destroyed by cold and frost.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: During the southward movement, the Spider chief's wife bathed and rubbed scales
    from her skin; the chief wrapped the scales in a reed receptacle, sang over them,
    waved them four times, and they became burros.
  category: action
  evidence_refs:
  - ev:11
- id: obs:11
  text: The chief and his wife repeated the performance and Spaniards came out; the
    chief told the Spaniards to load supplies on the burros, follow the Bear clan
    or other Hopi, and kill them, while the Spider people went southeast along a stream.
  category: speech
  evidence_refs:
  - ev:12
