canonical_text:
  quote: ''
  summary: 'The passage closes a turtle-and-coyote episode in which Coyote threatens
    and attacks turtles but cannot harm them because they withdraw into their shells;
    a turtle child reports surviving after Coyote threw it into water. The next tale
    begins with the Water Serpent and Coyote as friends: the Water Serpent''s great
    length fills Coyote''s kiva, and Coyote makes a false long tail from cedar bark,
    yucca leaves, and his own hair so he can appear to fill the Water Serpent''s kiva
    in return.'
  language: English
  quote_policy: summarized
