candidate_motifs:
- id: motif:1
  label: drought abandonment followed by rain and village return
  taxonomy_refs:
  - departure
  - return
  - seasonal_cycle
  basis: The Orafbi people depart during a five-year drought and later return after
    Muyingwa's ascent brings rain and vegetation.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: The renewal is by rain and plant growth, not by a flood or complete cosmic
    recreation.
- id: motif:2
  label: made object becomes animal helper and food provider
  taxonomy_refs: []
  basis: A bird made from sunflower pith becomes a Humming-bird and brings corn to
    the abandoned children.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No available taxonomy reference exactly matches an animated toy or animal
    helper motif.
- id: motif:3
  label: descent through hidden underground chambers to a growth deity
  taxonomy_refs:
  - hero_descent
  basis: The Humming-bird enters an opening beneath a cactus and passes through multiple
    kivas containing plants and corn until reaching Muyingwa.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage describes a bird's downward passage rather than a named human
    hero's descent.
- id: motif:4
  label: divine ascent brings rain and vegetation
  taxonomy_refs:
  - ascent
  - seasonal_cycle
  basis: Muyingwa ascends from kiva to kiva, and each stage is accompanied by rain,
    ending with grasses and herbs growing.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The text gives a compressed sequence and does not explain ritual or cosmological
    mechanics beyond the ascent and rain.
- id: motif:5
  label: failed acquisition of desired bodily attribute
  taxonomy_refs: []
  basis: Kalatoto repeatedly tries to attach hair to his head with adhesives, but
    the attempts fail and the final one kills him.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not identify Kalatoto as a trickster or provide a broader
    explanatory frame.
- id: motif:6
  label: human child transforms into owl
  taxonomy_refs:
  - shapeshifter
  basis: The child taken by the Owl develops feathers, white spots, and yellow eyes,
    and finally rushes out as Owl and flies away.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The transformation appears imposed by removal to the Owl's cave and failed
    restoration, not voluntary shape-shifting.
- id: motif:7
  label: broken timed seclusion prevents restoration
  taxonomy_refs:
  - initiation
  - return
  basis: The Owl states that the child must be kept locked four days and released
    at sunrise to be Hopi; opening the door sooner leaves the child Owl and it returns
    to the Owl's place.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage frames the four-day confinement as an instruction or condition;
    an initiation reading is possible but not explicit.
- id: motif:8
  label: animal sounds associated with origin or naming of a song
  taxonomy_refs: []
  basis: The man watches lizards making peculiar sounds and playing, then reports
    a song afterward called the Mishongnovi Song.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The compressed summary does not fully state whether the lizards originate
    the song or only occasion its later naming.
