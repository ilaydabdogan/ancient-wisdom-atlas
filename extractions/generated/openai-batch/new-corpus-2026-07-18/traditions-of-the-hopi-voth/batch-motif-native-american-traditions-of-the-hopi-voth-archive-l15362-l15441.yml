canonical_text:
  quote: ''
  summary: 'The passage contains several compressed Hopi tale summaries: a five-year
    drought at Orafbi in which abandoned children are fed by an animated hummingbird
    that reaches Muyingwa in underground kivas and brings about rain and renewal;
    a Kalatoto who tries to obtain hair with pitch and cactus juice and dies stuck
    to the floor; a child taken by an Owl, partly transformed, and lost again when
    a four-day condition is broken; and a man who misses a dance after watching lizards
    whose sounds become associated with the Mishongnovi Song.'
  language: English
  quote_policy: summarized
