  quote_or_summary: In the tale of the child who turned into an Owl, a mother beats
    and threatens a crying child, drags it outside, and a large Owl carries it to
    a cave. Men later see the child there with owl feathers, white spots, and yellow
    eyes appearing.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
