canonical_text:
  quote: ''
  summary: A revived little bird travels through a hidden opening under a cactus into
    successive kivas, reaches Muyingwa, the God of Growth and Germination, and tells
    him that the fields above are dry and that only two hungry children remain in
    the village. Muyingwa allows the bird to bring corn to the children. The bird
    also finds their emaciated parents, reports their condition, and later Muyingwa
    ascends through the kivas in stages, bringing increasing rain and plant growth
    around Oraibi. The parents and other surviving inhabitants return, and the children
    and their descendants become village chiefs and owners.
  language: English
  quote_policy: summarized
