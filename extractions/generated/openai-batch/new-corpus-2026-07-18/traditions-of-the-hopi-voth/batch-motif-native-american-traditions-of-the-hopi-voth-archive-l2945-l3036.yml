canonical_text:
  quote: ''
  summary: A buried old man sings on successive mornings while lowering fingers. Water
    begins to emerge from places where bahos had been planted, and the bahos are identified
    as Balolookongs. On the fourth day the old man emerges as a large water-serpent,
    many water-serpents and streams flood the village, houses collapse, some people
    flee, and old men on shelves turn into turkeys. The chiefs prepare bahos and powdered
    bead and turquoise offerings, dress the Village Chief's son and his sister, and
    send them to drive back the Balolookongs. The young man presses the chief water-serpent
    under the water; the serpents, the young man, and his sister disappear. The water
    recedes and the ground dries. The village is destroyed, but turkey-transformed
    old men and two little brothers survive.
  language: English
  quote_policy: summarized
