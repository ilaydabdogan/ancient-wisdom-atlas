canonical_text:
  quote: ''
  summary: 'A daughter named Awat Mc£na relieves her father in watching a corn-field,
    hears singing, and discovers Grasshoppers dancing in a wash. She offers them one
    division of the corn-field if they dance again, but after dancing they fly to
    the field and eat more corn than allowed. Her father follows them, kills many,
    destroys their houses, and the narrative explains why grasshoppers are now scattered.
    A second narrative begins: black Beetles suffer from heat, wind, and lack of rain;
    their chief proposes a dance, makes four nakwakwosis, deposits them west of the
    village, addresses clouds in the San Francisco mountains, and the beetles paint
    themselves black and dance.'
  language: English
  quote_policy: summarized
