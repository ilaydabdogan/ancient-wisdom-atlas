canonical_text:
  quote: ''
  summary: A hungry and tired maiden, appearing as a coyote, enters the hut of two
    Qooqoqlom Katcina hunters. The hunters spare, feed, bind, and carry the apparent
    coyote to Spider Woman. Spider Woman recognizes that it is not a coyote and uses
    Tomoala pod hooks, boiled water, a vessel, and a cloth covering to remove the
    coyote skin and restore the maiden. After bathing and feeding her, Spider Woman
    summons neighboring Katcinas, dresses the maiden, instructs her about offerings
    and conduct toward the Yellow Corn-Ear maiden, and has the Katcinas escort her
    toward the village, where they begin dancing near the chief’s house.
  language: English
  quote_policy: summarized
