canonical_text:
  quote: ''
  summary: Chiefs below create living bird messengers by singing over them and send
    them upward through an opening to find whether someone kind lives above. The Humming-bird
    and Hawk return exhausted without finding anyone. A stronger being, the Motsni,
    finds Skeleton at the place where Oraibi now is; Skeleton says he lives in poverty
    but welcomes them if they will share that life. The Motsni reports this to the
    chiefs, who are pleased and decide to go up.
  language: English
  quote_policy: summarized
