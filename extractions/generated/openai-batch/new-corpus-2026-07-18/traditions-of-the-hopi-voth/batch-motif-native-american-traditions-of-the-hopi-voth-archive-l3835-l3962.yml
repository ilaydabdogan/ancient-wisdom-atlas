literal_observations:
- id: obs:1
  text: A pursued man ran to Matdvi, where the Flute society was assembled at a spring,
    and asked to be hidden.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Flute priests told the man to enter the spring, climb a sunflower stalk
    growing there, and hide in its top.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pursuing skeleton-wife asked whether her husband was there; after being
    told he had entered the spring, she saw his reflected image with the sunflower
    stalk in the water, dived in, and disappeared.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the fourth day the woman came out of the water in bridal costume, carrying
    a reed receptacle containing another bridal robe and a white belt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The priests placed the man and woman back to back, made sacred-meal roads
    for them toward the south and north, and instructed them to take four steps before
    turning to meet again; the man returned after only three steps.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The priests told the woman to run, the man followed her, and the text identifies
    the pair with two stars that pursue one another.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kokoshori Katcina is described as going about the Hopi village and stealing
    Hopi children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Shongopavi woman’s child followed her while crying; the mother threw a stone
    back, the child sat crying, and Kokoshori pitied the child and took her away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Kishiwu the Katcinas and Hahai Wuhti received the little girl, pitied her,
    and fed her piki, peaches, melons, watermelon, and steamed corn.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The girl lived among the Katcinas and became big very soon because she ate
    their food.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The girl became homesick; during night Katcina dances and food distributions
    she ate only occasionally, did not talk, and was sad.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Kokoshori went to look after the girl’s father and mother and reported that
