  quote: '"You shall always follow each other this way,"'
  summary: The passage first recounts a pursued husband hidden by Flute priests at
    a spring, the pursuing woman’s disappearance into the water, her fourth-day emergence
    in bridal clothing, a flawed ritual sequence, and the pair’s identification as
    two pursuing stars. It then recounts Kokoshori Katcina taking a crying Shongopavi
    girl to the Katcina village, where she is fed and grows, becomes homesick, and
    is returned to her parents with food gifts, rain, and song.
