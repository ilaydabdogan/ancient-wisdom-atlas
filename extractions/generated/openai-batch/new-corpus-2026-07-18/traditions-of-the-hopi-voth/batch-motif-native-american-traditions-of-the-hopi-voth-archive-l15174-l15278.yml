canonical_text:
  quote: ''
  summary: 'The supplied passage contains brief accounts of several Hopi traditions:
    an earthquake flight from Oraibi in which a blind man and a crippled man cooperate
    and are restored after heated elk eyes burst; an etiological account involving
    Big Head and Goat Horn dividing goat meat; reciprocal meal visits between two
    Oraibi women; children obtaining permission to catch birds by giving food; the
    Jug Boy born as an earthen vessel who becomes a hunter after the jug breaks; Crow
    as a harmful spirit associated with sickness and theft; and a maiden deceived
    by Coyote after Rain Deity is accepted as her suitor.'
  language: English
  quote_policy: summarized
