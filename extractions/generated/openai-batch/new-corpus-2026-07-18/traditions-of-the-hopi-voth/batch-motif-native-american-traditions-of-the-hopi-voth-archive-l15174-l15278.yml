- id: obs:4
  text: They place the elk's eyes on a fire; when the eyes become hot, they burst,
    after which the lame man can walk and the blind man can see.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The restored pair stay awake through the night, later follow the people's
    tracks, find them in timber, and take the lead when the people return to Oraibi.
  category: sequence
  evidence_refs:
