  - ev:7
  - ev:8
  confidence: high
  cautions: The passage is a compressed synopsis, so ritual meanings beyond the stated
    actions should not be inferred without fuller context.
- id: motif:2
  label: Search for departed wife or mother through Katcina places
  taxonomy_refs:
  - departure
  - return
  basis: The wife leaves with Hototo Katcina; the husband and two children trace her
    through named places, receive aid and information, and meet her again after dances.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage states a search and return but does not explicitly frame it
    as a formal quest.
- id: motif:3
  label: Murdered wife as pursuing skeleton and transformed star
  taxonomy_refs:
  - death_rebirth
  basis: The wife is killed, follows as a skeleton, disappears into spring water after
    a deception, later emerges in bridal costume, and the couple become two stars.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The taxonomy does not include a specific star-transformation motif; death-rebirth
