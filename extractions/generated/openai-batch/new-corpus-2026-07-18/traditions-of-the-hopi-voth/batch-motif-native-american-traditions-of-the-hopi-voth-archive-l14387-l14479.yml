canonical_text:
  quote: ''
  summary: 'The passage summarizes several Hopi Katcina-related narratives: a maiden
    marries Circle Katcina, leaves with Hototo, is killed and pursues her husband
    as a skeleton before a star-transformation; Kokoshori takes a child to Kishiwu
    and later returns the child with food and rain; Ball-Head marries an Oraibi maiden
    and provides supernatural corn-grinding aid before prosperity is lost after marital
    misconduct.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A maiden who refuses marriage meets a young man dressed in a blue Hopi blanket;
    he tells her he is the Katcina who dances, and she consents to marry him if her
    parents agree.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maiden brings a tray of meal, goes with the youth to a kiva containing
    many Katcinas, and learns that he is Circle Katcina.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman bears two children who are Circle Katcinas.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: While her husband is away, the woman goes to the edge of the mesa; Hototo
    Katcina comes, and she goes away with him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Circle Katcina and the two children trace the mother through places including
    Sifcakva, Owl Spring, and Kishiwu, where they are hosted or informed by Hahaii
    or Hahau Wuhti figures and join Katcina dances.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the mother rejoins them, the father sends the children ahead and kills
    the wife by thrusting a stick into her throat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The wife's skeleton follows the husband through several villages and kivas,
    while women, war dancers, and others attempt to hide or shelter him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Matovi, Flute Society figures tell the husband to hide in the top of a
    sunflower stalk near a spring; the skeleton dives after the reflected image in
    the water and disappears.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the fourth day, the woman comes out of the water dressed in bridal costume;
    priests set meal roads to north and south, and the couple run and become two stars.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kokoshori is said to steal Hopi children, but he pities a crying child and
    takes it to Kishiwu, where Katcinas feed it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Katcinas return the child to the parents with food, rain accompanies their
    arrival, and later the maiden becomes homesick for Kishiwu, dies, and is said
    to live there.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: Ball-Head courts an Oraibi maiden who had refused other young men; he wears
    a Ball-Head mask and brings corn.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Oraibi maiden grinds blue corn for four days and white corn on the fifth
    day, then goes to Ball-Head's grandmother carrying a tray of white meal.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Ball-Head sings and drums to chickens, which grind corn in their bodies and
    vomit meal into a tray.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Neighbors bring parts of the bridal costume; the grandmother washes and dresses
    the bride, sprinkles a road of meal, and the village prospers until the wife goes
    astray and the Katcina husband leaves.
  category: sequence
  evidence_refs:
  - ev:8
