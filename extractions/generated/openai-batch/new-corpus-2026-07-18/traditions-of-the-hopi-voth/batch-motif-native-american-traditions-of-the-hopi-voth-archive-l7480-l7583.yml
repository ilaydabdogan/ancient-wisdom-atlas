canonical_text:
  quote: ''
  summary: In Kawafhkaa, two sister maidens marry Night, who carries them on a tray
    through the air to his canyon dwelling. There they see bones of earlier stolen
    women and meet surviving captive women. After the sisters become pregnant, Frog
    tells them how to flee toward home, and Spider Woman joins them on the road. Clouds
    overtake them near the village, and lightning kills the sisters; at death each
    gives birth, one to a boy and one to a girl. The children survive and are raised
    while their mothers are alive by night and dead by day. When older, the children
    ask about their father and are directed to their grandparents in Kawafhkaa, with
    warnings about deadly contests and a hidden turtle on a ladder.
  language: English
  quote_policy: summarized
