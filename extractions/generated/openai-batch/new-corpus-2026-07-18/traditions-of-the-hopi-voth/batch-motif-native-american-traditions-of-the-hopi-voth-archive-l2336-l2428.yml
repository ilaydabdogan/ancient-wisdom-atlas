literal_observations:
- id: obs:1
  text: The Spider clan arrived at Homiqopu spring, stayed there for some time, and
    then moved to Chukuvi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chukuvi was situated on a mesa with a very large spring at its foot.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Squash clan ruled in Chukuvi, the chief belonged to that clan, and the
    Sand clan was numerous there.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Villages were harassed by enemies, including Utes and Apache, and villages
    also raided each other; the people of Chukuvi and old Mishongnovi moved onto the
    mesa and built present Mishongnovi.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Mishongnovi the Blue-bird clan was in charge, and the Village Chief was
    supplied in a four-year sequence by the Blue-bird, Bear, Betki, and Squash clans.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Sand clan is said to have moved to Oraibi, and the people of Shupaulavi
    moved to the top of the mesa when Mishongnovi was built.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Oraibi, the Yayaa-mongwi lived in the home of the Reed clan; the fraternity
    had died out, but its altar paraphernalia were still kept in the house.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Village children often visited a little boy, did not do assigned work, stole
    food and wood, made a fire in front of the house, and were scolded by men and
    mothers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The priest's son proposed that the children get wood themselves and that someone
    steal hide straps; the children collected straps, left the village to the east,
    drank at Keqachmovi, and gathered dry brush.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A Hawk in the form of a man, wearing many strands of beads and a black line
    painted with specular iron over the nose down to the cheeks, encountered the children
