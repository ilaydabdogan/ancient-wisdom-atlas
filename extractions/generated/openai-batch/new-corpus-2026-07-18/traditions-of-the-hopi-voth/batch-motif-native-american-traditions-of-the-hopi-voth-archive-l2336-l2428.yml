canonical_text:
  quote: "“a Hawk in the form of a man came upon them”"
  summary: The passage recounts movements and settlement of Hopi clans around springs,
    mesas, Chukuvi, Mishongnovi, Shupaulavi, and Oraibi; describes clan chieftainship
    arrangements; and begins an account of the origin of the Yaya'atu society, in
    which idle village children who steal food and wood go out to gather brush and
    encounter a Hawk in human form who invites them into his kiva, offers a pipe,
    receives kinship terms, and promises to feed them.
