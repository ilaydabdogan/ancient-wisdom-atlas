canonical_text:
  quote: ''
  summary: The passage contains three Coyote episodes. In the first, an Eagle deceives
    Coyote with a one-legged pose and Coyote cuts off his own leg. In the second,
    a Red Eagle dancing on one leg distracts a water-carrying Coyote until Coyote's
    thirsty children die. In the third, Coyote visits the Turkeys, envies the appearance
    of the young Turkeys, and hears a deceptive account from the Turkey mother about
    baking, preserving bones, singing over them, and reviving children.
  language: English
  quote_policy: summarized
