  text: Coyote finds sharp stones, lays his right hind leg across one, and cuts off
    the leg with another.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Eagle lowers its second leg, stretches its wings, laughs at Coyote, says
