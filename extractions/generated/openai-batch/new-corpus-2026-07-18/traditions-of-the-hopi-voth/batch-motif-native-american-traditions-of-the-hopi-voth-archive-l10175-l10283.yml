  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the Red Eagle episode, Red Eagle lives at the bluff Kwana Vuvi, and Coyote
    lives east of Mishongnovi at Ishqottangat with his children.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: On a hot day Coyote fails to hunt, finds his children thirsty, and goes to
