canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a maiden and a youth engage
    in concealment and discovery, the maiden kills and buries the youth, Fly restores
    him by returning his blood to his body, and the maiden becomes Child-Protruding
    Woman who controls game. It also contains a tale in which a dangerous maiden steals
    a youth's running costume by dancing near a kiva opening, and the youth recovers
    it by luring her away with a rabbit and closing the opening.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A maiden uses a mirror to locate Spider's hole after a youth hides there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maiden crosses a watermelon patch, enters a ditch, and turns into a tadpole
    while hiding.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Spider Woman tells the youth to go to his uncle Ahn, who hides him inside
    an opening made by removing a loose knot from a corner pole of a temporary shelter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The maiden wets her fingers, presses her forefinger to her ear, hears the
    youth in the hiding place, and tells him to come out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The maiden makes the youth remove his shirt and beads, cuts his throat over
    a hole so that blood runs into it, and buries his body in another hole to the
    north.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The maiden takes the youth's shirt and beads home and denies knowing where
    he is when his parents ask.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Fly searches the field, finds traces of blood and the grave, sucks the blood
    from the first opening, and ejects it into the youth's body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the blood is returned to the body, the youth's heart begins to beat
    and he rises up.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Fly tells the youth to drink from the ditch and later instructs him how to
    recover his shirt and beads and not to eat the food the maiden offers.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:10
  text: The youth refuses the maiden's food, receives his shirt and beads, and shakes
