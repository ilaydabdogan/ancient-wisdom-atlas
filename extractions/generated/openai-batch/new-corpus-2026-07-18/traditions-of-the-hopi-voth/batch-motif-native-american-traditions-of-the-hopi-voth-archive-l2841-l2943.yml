  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: In the fourth year, the angry old man prepares many sharp bahos from hard
    woods named in the passage.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The village chief and the Crier Chief are described as bad and in league;
    the village chief tells the Crier Chief to announce another four-day feast.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The people mistrust the chiefs’ request and do not prepare the requested feast.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: During the night, the chiefs meet with the old man and dress and paint him
    with black, red, and green body colors, P6okong marks, a sparrow-hawk-tail attachment,
    a horn, and a black-painted face so that he represents Balolookong.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: At night, the chiefs dig a hole in the tiwonyapavi Katcina shrine, place the
    old man in it with bahos, a Balolookong whistle, and a bowl of water, and conceal
    the opening with stone, earth, dust, and cloth.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The chiefs sing sorcerer’s songs; during the third song the buried old man
