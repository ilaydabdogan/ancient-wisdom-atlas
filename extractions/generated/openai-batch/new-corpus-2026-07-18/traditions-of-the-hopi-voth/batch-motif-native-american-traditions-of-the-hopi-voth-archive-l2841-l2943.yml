- id: obs:5
  text: Bahos are tied to each wrist and each ankle of the revealed youth, and these
    are untied and placed on the floor.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The revealed youth is described as clean and handsome, with turquoise ear-pendants,
    beads, washed hair, and two black face-paint lines running from the upper nose
    toward the cheeks.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The youth orders the bahos to be thrust into the ground at the plaza and at
    corners of a specified house, and he tells the people to feast for four days.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The people prepare and eat a four-day feast while worried that evil may follow,
    but nothing happens immediately and three years pass without special evil events.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The passage states that the youth had not told the timing correctly: the
