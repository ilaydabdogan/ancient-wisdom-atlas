canonical_text:
  quote: "“behold! it was the chief's son.”"
  summary: 'A village assembly removes successive masks from a supposed ghost and
    discovers the chief’s son, who gives instructions involving bahos and a four-day
    feast. The people fear harm but none occurs until the fourth year, when an angry
    old man and allied chiefs prepare a ritual deception: the old man is painted to
    represent Balolookong, placed underground in a Katcina shrine with bahos, a whistle,
    and water, and later produces rumbling sounds and a protruding hand.'
  language: English
  quote_policy: quoted
