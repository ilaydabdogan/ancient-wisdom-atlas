canonical_text:
  quote: "“Do not follow that man. He is very brave and will surely kill you.”"
  summary: The passage recounts part of a conflict in which retreating Hopi rest at
    a spring, are pursued by Navaho forces, and suffer losses. Six Hopi make a stand
    in a stone enclosure; five are killed and one escapes by jumping from a mesa and
    hiding under a rock. Another brave Hopi warrior is pursued, recognized by disguised
    Walpi men fighting among the Navaho, encircled, killed by Shfita, stripped, and
    mutilated; his body is taken to Walpi and covered with stones. The passage ends
    as Navaho troops reach the village where Hopi have gathered sheep on the plaza.
  language: English
  quote_policy: quoted
