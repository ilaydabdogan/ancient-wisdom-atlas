canonical_text:
  quote: ''
  summary: 'The passage first describes a Coyote mistaking a stone for the Dove, injuring
    his teeth, then repeatedly seeing frightening images in spring water and dying
    thirsty. It then tells of a Coyote family near Oraibi: the father obtains a rabbit
    with Badger''s help, the children devour it unevenly, the mother searches for
    food, joins dancing Blue Jays after receiving borrowed wings, tails, and feathers,
    and falls to her death when the Blue Jays reclaim them in the air. The father
    later tries to follow her tracks but is chased by village dogs and thereafter
    hunts alone for the motherless children.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A stone resembled the Dove's form and sitting position; the Coyote mistook
    it for the Dove, grabbed it, broke his teeth, and bled from the mouth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Coyote went to several springs to drink, saw alarming images in the water,
    avoided drinking, became angry at one spring, tore rocks near another, and finally
    died from thirst and exhaustion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Blue Jays tale, the Coyote and his wife lived west of Oraibi at Ishmovala
    and had six children.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Coyote father chased a cottontail rabbit into a hole, asked Badger to
    get it out, and brought the rabbit home for his children.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The children quarreled over the rabbit, tore it to pieces, and devoured it,
    leaving some of them still hungry.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Coyote wife went searching for food, saw Blue Jays dancing in a tree,
    and accepted their invitation to join after they lent her wings, tails, and feathers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: With the borrowed bird parts the Coyote wife ascended, danced, and flew with
    the Blue Jays, moving from tree to tree and then high into the air.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: When high in the air, the Blue Jays reclaimed their own tails, wings, and
    feathers from the Coyote wife; she fell to the earth and died.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Coyote father followed his wife's tracks until village dogs noticed and
