canonical_text:
  quote: A very long time ago there was nothing but water.
  summary: The passage presents an origin account in which two Huruing Wuhti live
    in eastern and western ocean kivas while the Sun follows a recurring dawn and
    underwater route. The two deities create dry land, consult across a rainbow, and
    populate the earth by forming a wren, many birds, animals, and the first woman
    and man from clay, animating them with song under a cloth. Birds and animals receive
    their sounds or languages, and the first humans receive understanding through
    marked tablets and rubbed palms. A note says these events are supposed to occur
    in the lower world before later Hopi emergence traditions.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At the beginning described in the passage, only water existed; one Huruing
    Wuhti lived in the eastern ocean and another in the western ocean, each in a kiva-like
    house.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eastern kiva ladder had gray and yellow fox skins attached, while the
    western kiva ladder had a turtle-shell rattle attached.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sun dressed in the gray fox skin before white dawn and in the yellow fox
    skin before yellow dawn, then rose from an opening in the eastern kiva and later
    traveled through the western kiva and under the water toward the east.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two Huruing Wuhti caused dry land to appear as waters receded eastward
    and westward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sun noticed no living beings on the dry land and communicated between
    the two Huruing Wuhti; the eastern Huruing Wuhti traveled west over a rainbow
    to consult with the western Huruing Wuhti.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The eastern Huruing Wuhti made a wren from clay, covered it with native cloth,
    and the two deities sang over it until it showed life and emerged as a living
    bird.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wren was sent to search the dry place for living beings and reported that
    none existed, although the passage says Spider Woman lived in the southwest at
    the edge of the water and was not noticed by the wren.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The western Huruing Wuhti made many kinds of birds, brought them to life under
    the same cover with song, taught each kind its sound, and sent them out in all
    directions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The western Huruing Wuhti made different kinds of animals from clay, brought
    them to life in the same manner as the birds, taught them their sounds or languages,
    and sent them to inhabit the earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The eastern Huruing Wuhti made a woman and then a man from clay and brought
    them to life in the same manner as the birds and animals.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The first woman and man were told to live on the earth and understand everything;
    the eastern Huruing Wuhti made two hard tablets with characters, gave them to
    the pair, and then rubbed their palms so that they understood.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: An editorial note states that the events are supposed to have happened in
    the lower world before later emigration through the sipapu into this world in
    variant Hopi traditions.
  category: setting
  evidence_refs:
  - ev:9
