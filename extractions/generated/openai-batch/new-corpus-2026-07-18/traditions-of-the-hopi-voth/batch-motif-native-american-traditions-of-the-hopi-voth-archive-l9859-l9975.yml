  summary: The passage contains the close of a song-prank episode in which Bat breaks
    friendship with Coyote and Humming-bird after being song-tied; a tale in which
    Coyote and Humming-bird visit one another and mistake each other's protruding
    body parts for useful objects; and the beginning of a tale in which Coyote Woman,
    carrying water in her mouth for her children, is repeatedly made to laugh and
    spill the water by a singing Wren who then uses its skin to make a decoy.
