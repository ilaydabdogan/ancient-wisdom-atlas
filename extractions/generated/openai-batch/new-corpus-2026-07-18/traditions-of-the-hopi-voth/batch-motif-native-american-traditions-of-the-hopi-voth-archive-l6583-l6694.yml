canonical_text:
  quote: ''
  summary: The passage first concludes a story in which an absent hunter revives at
    night as a skeleton, returns toward the Kohonino village, causes the people to
    flee, and leads to their settlement near Green Bluff. It then begins the story
    of White Corn-Ear Maiden, describing sorcerers who plot against her, poison her
    with a rattlesnake-poisoned arrow, and after her burial transform into animal
    forms to remove her body from the grave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kohonino villagers wait overnight for the hunter, keep their fire burning,
    and do not sleep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the night the hunter revives as a skeleton, rises, moans, and goes
    toward the place where his people are living.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The villagers hear and see the approaching figure by the light of their fires;
    they first identify the sound as coyote or wolf, then as a Skeleton.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kohonino gather their possessions and children, flee, and leave their
    houses, which the Skeleton occupies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Kohonino go westward, ascend a very steep bluff, and settle in the valley
    near Green Bluff.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: White Corn-Ear Maiden lives in Oraibi, is described as beautiful, and persistently
    refuses marriage offers from young men.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The inhabitants of the Wikolapi kiva are identified as sorcerers; angry at
    White Corn-Ear Maiden, they decide to destroy her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sorcerers meet at Skeleton Gulch and plan to make a wheel and feathered
    arrows, with one arrow poisoned by rattlesnake poison.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sorcerers wrap the maiden's breath into the wheel, though the passage
    says the manner of obtaining it is not known.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Young men play with the wheel and arrows in front of the maiden's house; the
    man holding the poisoned arrow pretends to shoot the wheel but wounds her foot.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The maiden's foot swells, she tells her parents what happened, and she dies
    during the night.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After hearing that the maiden has died, the sorcerers go to Skeleton Gulch
    and change themselves into coyotes, wolves, foxes, and other animal forms.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the maiden is buried and mourners return to the village, the transformed
    sorcerers approach the graveyard from different places while imitating animal
    sounds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The maiden's brother watches the grave from the edge of the mesa, hears the
    animal-formed beings speak, and recognizes them as Hopi sorcerers rather than
    animals.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The sorcerers tear old wrappings into small pieces so villagers will think
    coyotes ate the corpse; then they disinter the body.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:16
  text: One sorcerer who has changed into a grey wolf carries the body away on his
    back, followed by the others.
  category: action
  evidence_refs:
  - ev:10
