canonical_text:
  quote: ''
  summary: The passage explains place names associated with killing captives after
    the destruction of Aoetovi, then narrates a Coyote and Porcupine episode in which
    Coyote dangerously imitates Porcupine's bodily food-making method. It then begins
    a Coyote and Badger episode involving Coyote's envy of food at an Oraibi spring-cleaning
    and Badger digging toward the food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Water Killing Hill and Skeleton Hill are described as places near Wdlpi where
    people from Orafbi, Wdlpi, and other villages rested with captives after destroying
    Aoetovi.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At those places, the captors are said to have extorted secrets of ceremonies
    and altars from captives before killing many of them; the place names are said
    to derive from this killing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Porcupine is said to have lived at the first named place, while Coyote lived
    at the last named place; they are presented as friends who visit one another.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When Coyote visits Porcupine, Porcupine has Coyote build a large fire before
    the meal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Porcupine pulls a small pointed stick from the hair on top of his head and
    repeatedly thrusts it into his nose, causing blood and fat to fall on the fire
    and roast as food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Coyote later hosts Porcupine and imitates Porcupine's action with a pointed
    stick, but blood mixed with fat flows uncontrollably until Coyote becomes exhausted
    and falls down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Porcupine thinks Coyote has died, laughs, leaves without eating, and goes
    home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Coyote revives, becomes angry, blames Porcupine, and says he will devour him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: When Coyote confronts Porcupine, Porcupine denies that Coyote should devour
    him, appeals to their friendship, and they resume friendly relations while Coyote
    still thinks about future revenge.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Coyote lives at Coyote Gap south of Lanangva, and Badger lives at Badger Gulch
    southeast of Orafbi; they are described as great friends who often visit each
    other.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Orafbi clean the spring of Lanangva with help from village maidens, bring
    food, place it near a rock, and eat it after the work.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Coyote watches the people eat, envies them, and after hearing another spring-cleaning
    announced, asks Badger to join him in reaching the food.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: Badger begins digging from Coyote's house toward the food and turns around
    after going a little way, which the narrator identifies as the custom of badgers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Coyote remarks on Badger turning back and says someone else close by digs
    straight ahead.
  category: speech
  evidence_refs:
  - ev:8
