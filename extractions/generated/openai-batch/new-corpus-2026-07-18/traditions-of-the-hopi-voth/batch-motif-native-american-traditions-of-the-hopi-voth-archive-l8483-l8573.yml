canonical_text:
  quote: ''
  summary: An unnamed young man brings birds to Spider Woman, then travels west despite
    danger and follows his ball into Hasohkata's kiva. Hasohkata wins a game against
    him, binds him outside the kiva, and leaves him cold. Spider Woman finds and protects
    him with turkey feathers, summons animal allies, and leads them to challenge Hasohkata
    at gambling. Mole secretly aids the counter-game from beneath the floor by fixing
    the ball under a cup.
  language: English
  quote_policy: summarized
