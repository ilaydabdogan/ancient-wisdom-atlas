canonical_text:
  quote: ''
  summary: 'The passage contains several Hopi Coyote episodes: Turkey mother revives
    her eaten children from unbroken bones, while Coyote''s imitation fails and his
    children remain bones; Turkey children flee and are rescued by Turkey men, and
    Coyote dies hungry. Chiros lend Coyote feathers for flight, remove them aloft,
    and he falls to death. Porcupine produces roasted blood and fat from his nose
    with a pointed stick; Coyote imitates and nearly dies. Coyote, Badger, and Mole
    steal food through an underground tunnel. Badger later deceives or tempts Coyote
    with a body-fat story, and Coyote cuts himself and dies. A final brief episode
    describes reciprocal visits and meals between Badger and Coyote.'
  language: English
  quote_policy: summarized
