canonical_text:
  quote: ''
  summary: The passage recounts deities teaching language to a pair, the east goddess
    leading them by rainbow and sending them to settle, Spider Woman creating Spaniards
    and other human pairs from clay with languages, mistakes explaining single people,
    a quarrelsome pair explaining marital contention, the west goddess creating good
    people, the east and west goddesses withdrawing to distant unseen abodes where
    Hopi address prayers, and two armed Spaniards approaching Huruing Wuhti before
    being disarmed and shown a white stone-like lump.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Unnamed deities teach two people a language, and the goddess of the east leads
    them out of a kiva over a rainbow to her eastern home for four days before sending
    them to choose a place to live.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two people travel until they find a good field and build a small simple
    house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Spider Woman makes a man and woman of clay, covers them, sings over them,
    and brings them to life; the pair are identified as Spaniards.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Spider Woman teaches the Spanish language to the Spanish pair, gives them
    tablets, imparts knowledge by rubbing their hands, and creates two burros for
    them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Spider Woman continues creating people as man-and-woman pairs and gives a
    different language to each pair.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Spider Woman forgets to create a woman for one man and later fails to create
    a man for one woman, producing unmatched single people in the narrative.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The single man and single woman find each other, live in a house, quarrel,
    reconcile, separate, and reunite repeatedly; the passage states this is why there
    are contentions between men and wives.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Huruing Wuhti of the west calls the eastern goddess and then creates good
    people, always as a man and wife, to live in the west.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When Spider Woman's people come into contact with the west deity's good people
    there is trouble, and nomadic hunting for rabbits, antelope, and deer leads to
    many contentions.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The Woman of the west says she will live in the midst of the ocean in the
    west and instructs her people to pray to her there; the Huruing Wuhti of the east
    does the same, and their places are said to be unseen.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hopi who want something from the two distant deities deposit prayer offerings
    in the village and direct their prayers and thoughts toward them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Two Spaniards, angry at Huruing Wuhti, take guns to her abode; she says they
    came to kill her, asks them to lay down their weapons, and brings out a white
    lump like a stone.
  category: sequence
  evidence_refs:
  - ev:9
