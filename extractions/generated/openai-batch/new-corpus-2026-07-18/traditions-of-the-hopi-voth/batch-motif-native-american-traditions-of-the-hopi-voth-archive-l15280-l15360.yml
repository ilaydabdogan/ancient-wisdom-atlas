canonical_text:
  quote: ''
  summary: The passage summarizes a Hopi eagle narrative in which a young man who
    cares for eagles is carried upward through a sky opening, left on a bluff, aided
    by Wren, Spider Woman, Mole, and predatory animals, and finally returned to his
    parents. It also includes the tale of a Hopi boy stolen by Navajo people and rescued
    by Hawk, who provides for him and returns him to Oraibi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A family consists of father, mother, two daughters, and a son; the son hunts
    and cares for eagles instead of helping with field work.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sisters become angry, beat the eagles, lock the house, and hide the key
    while the son is away seeking food for the eagles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The eagles tell the returning young man what happened, instruct him to dress
    up, and carry him on their backs as they ascend.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Near the family field, the eagles circle four times; the parents ask them
    to leave the son, but the eagles fly out of sight through an opening in the sky.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The eagles leave the young man on a high bluff because his sisters had beaten
    them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wren appears at the bluff, Black Spider comes after being informed by Wren,
    and Wren later makes a ladder down a narrow crack using its own feathers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Spider Woman invites the young man inside, enlarges the opening for him, feeds
    him with small portions that increase as he eats, and makes him a ball of pitch
    and hair.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The young man hunts birds near a small lake for Spider Woman over several
    days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The young man’s ball falls into a kiva, where Hasohkata plays a game with
    him, wins twice, and ties his hands and feet outside the kiva entrance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Spider Woman finds the bound young man, summons animals of prey, and with
    Mole’s underground help defeats Hasohkata in a cup game and a brush-pulling test.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After Hasohkata is defeated, the rescuers take objects from his kiva; Bear
    tears out his heart, and wolves tear up and devour his corpse.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Wren learns that the young man’s parents long for him; Spider Woman spins
    web at the sky opening, carries him downward on her back, and he returns to his
    parents.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the Hawk tale, Navajo people steal a Hopi boy, make him work, give him
