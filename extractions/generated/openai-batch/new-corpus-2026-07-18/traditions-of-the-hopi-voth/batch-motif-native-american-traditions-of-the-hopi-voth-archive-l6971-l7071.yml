canonical_text:
  quote: ''
  summary: 'The passage describes Piwftamni''s bride returning to her parents in bridal
    clothing with a corn-meal road prepared by the old grandmother. After marriage,
    Piwftamni remains poor, patches clothing, raises little food, and is mocked while
    his wife lives partly on discarded watermelon rinds. In the kiva he is also mocked
    and receives little food, though one old man sits with him. After a threat that
    another man will feed and take his wife, Piwftamni''s grandmother supplies watermelons
    and antelope meat, which he brings to the kiva and shares after eating. A further
    challenge is proposed: the men will bring their wealth into the kiva, and the
    richest will live with his wife. The passage ends as the men fill the kiva with
    possessions and Piwftamni goes to fetch something.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people expected the bride to lack bridal clothing, but the old grandmother
    accompanied her to the ladder and she descended dressed in an owa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old grandmother sprinkled a road of corn meal for the bride, who carried
    a bundle containing a second owa and a belt to her parents' house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bride's parents welcomed her and expressed thanks that someone had prepared
    something for her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Piwftamni and his wife lived in her parents' house, but he remained poor,
    patched clothing, made no new clothes for her, and worked only a small field.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Other people raised fine crops and watermelons, while Piwftamni's wife had
    to live partly on discarded watermelon rinds and others laughed at her husband.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the kiva, Piwftamni generally had very little food, received no meat, ate
    by himself on the floor, and was mocked, while one old man sat beside him out
    of pity.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Piwftamni reported that a rich man had said he would feed Piwftamni's wife
    good food and then take her away from him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the old man's advice, Piwftamni waited until the other kiva men had brought
    their meals before going to get his own food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Piwftamni's grandmother brought out many watermelons and then a great quantity
    of antelope meat for him to carry into the kiva.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The kiva men saw the watermelons and meat with astonishment and envy; after
    Piwftamni and the old man ate, the old man invited others to take the leftovers
    to their families.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: One man refused the leftovers and proposed that the next day the men bring
    wealth such as robes, dresses, belts, and buckskins into the kiva, with the richest
    man to live with Piwftamni's wife.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The next day the men brought possessions into the kiva and filled the poles
    and pins with them before telling Piwftamni to go bring something too.
  category: sequence
  evidence_refs:
  - ev:5
