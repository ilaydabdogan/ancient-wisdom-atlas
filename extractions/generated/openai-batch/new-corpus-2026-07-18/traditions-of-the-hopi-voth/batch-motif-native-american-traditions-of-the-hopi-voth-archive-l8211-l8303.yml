canonical_text:
  quote: ''
  summary: The passage closes one tale in which Coyote Old Man deceives a maiden by
    giving her a live macaw/parrot, stealing Pavayoyfcashi's costume and ornaments,
    and impersonating him. The maiden goes with Coyote by mistake; Pavayoyfcashi tracks
    them and later kills Coyote with lightning carried in storm clouds. The passage
    then begins another tale about an eagle-hunting son, his family, and two young
    eagles that his sisters beat before locking the house and hiding the key.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote Old Man lived west of the village at Coyote Gap and had been thinking
    of a maiden who had refused all offers.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After hearing that the maiden had accepted Pavayoyfcashi, Coyote Old Man went
    south to a warm country with parrots and macaws, captured a macaw/parrot, and
    gave the live bird to the maiden.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the night Coyote Old Man stole Pavayoyfcashi's costume, ornaments,
    and usual things.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The next morning Coyote Old Man dressed and painted himself like Pavayoyfcashi,
    and the maiden mistook him for her lover and went with him to his house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The maiden discovered the mistake after remaining at Coyote Old Man's house
    and became unhappy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Pavayoyfcashi missed his costume, followed tracks from his house to the maiden's
    house and then to Coyote Old Man's house, found the maiden there, and returned
    home angry without speaking.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Young men of the village surrounded Coyote Old Man's house intending to kill
    him, but he escaped up the ladder and through the pursuers while sticks were thrown
    at him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: On a ridge or mesa west of the village, Coyote Old Man boasted that he had
    taken the village's most beautiful maiden and made an obscene gesture toward the
    pursuers before disappearing down the other side.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Pavayoyfcashi later brought strong wind, heavy rain, and thunder clouds to
    the village, hid in them, and killed Coyote Old Man with a ray of lightning.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After Coyote Old Man was killed, the maiden returned home; the passage says
    she realized she had cast herself away and continued a life of lewdness.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A new tale begins with a family living north of the place where the Nashabe
    kiva is now situated; the family consisted of a father, mother, two daughters,
    and a son who hunted and cared for eagles in spring instead of helping in the
    fields.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: One spring the son captured only two young eagles, took them home, and cared
    for them, though he was depressed by catching so few.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: While the son was away hunting food for the eagles, the girls beat the eagles,
    locked the house, hid the wooden key near the fireplace, and went to the field
    to help weed and hoe.
  category: sequence
  evidence_refs:
  - ev:9
