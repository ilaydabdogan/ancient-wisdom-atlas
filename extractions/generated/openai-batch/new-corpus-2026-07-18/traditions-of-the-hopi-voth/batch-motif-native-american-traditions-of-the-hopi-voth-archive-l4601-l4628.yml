canonical_text:
  quote: ''
  summary: Two brothers return toward Shongopavi, pass Toriva spring without stealing,
    and use a lightning frame and bullroarer or thunder board. Storm clouds, thunder,
    lightning, and rain appear; a Hopi house is struck and shattered. At home, their
    grandmother scolds them, and the brothers secretly place the lightning frame,
    thunder board, snake, artificial melons, bahos, and paint into two covered pots.
    The narrator states that because the Pookonghoyas later had these things, rain
    continued and the Hopi had good crops.
  language: English
