canonical_text:
  quote: ''
  summary: A young man opens a sack of beads and shells before reaching home, causing
    most to disappear. A woman associated with the Snake clan bears snake children,
    who are driven away and returned with bahos to her people; this is linked to Snake
    dance practice. The couple migrates to Walpi, where human descendants become the
    Snake clan and the first Snake ceremonial objects and ceremony are made. A following
    Snake Myth begins with a young man sent in a box down the Colorado River; he reaches
    a watery place and Huruing Wuhti's house, where the Sun later arrives, sorts offerings,
    bathes, eats, and continues his under-earth course. The passage also links Sun
    offerings and the Flute ceremony to sunrise and dawn signs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man opened the sack during the last night of travel despite his
    wife's strong objection, took out beads and shells, spread them out, and put some
    around his neck.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: By morning all the beads except those said to have been given by Huruing Wuhti
    had disappeared; the passage explains this as the reason the Hopi have few beads
    now.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before the couple's arrival, the Divided or Separated Spring clan and the
    Prtna cactus clan lived at the place; the couple's arrival is described as the
    arrival of a new Snake clan.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman bore many snake children, who lived in fields and sand, grew rapidly,
    played with Hopi children, and sometimes bit them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Hopi became angry at the snake children and drove them off, making them
    unhappy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman told her husband to take their children back to her home; the man's
    father made bahos, and the son took the snakes and bahos to the wife's people,
    who accepted them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage connects the return of the snakes with the later practice of Snake
    priests carrying snakes away from the plaza after the Snake dance and depositing
    bahos with them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The man and wife traveled southeast, saw smoke, found Walpi on a mesa, asked
    to enter, promised ceremonial assistance, and were admitted by the chief after
    initial reluctance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After admission to Walpi, the woman bore human children instead of snakes,
    and their descendants became the Snake clan.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Walpi the Snake people made the first Snake tiponi, Snake altar, and Snake
    ceremony; the passage says the Snake cult spread from there to Shongopavi, Mishongnovi,
    and Oraibi.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the first Snake ceremony, the Snake chief sent his nephew to the north,
    west, south, and east to hunt snakes, and the nephew brought snakes from each
    direction.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Snake chief made a tiponi from a hollowed cottonwood-root baho, rattles
    of three snakes, a fourth whole snake, a corn-ear, feathers of several birds,
    and buckskin string.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the Snake Myth, old men of the Pihkash and Kokop clans wondered where the
    Colorado River flowed and sent a young man in a box with provisions, a pole, and
    four bahos.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: When the box would go no farther, the young man saw water everywhere and a
    house in the midst of it.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:15
  text: Huruing Wuhti came out, called the young man four times, and rolled a corn-meal
    ball across the water, making a road for him to reach her house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: In the evening Huruing Wuhti sent the young man into a side room because something
    was coming; the Sun arrived on a noisy disk attached to a pole, dressed and painted
    like certain Katcinas.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The Sun entered Huruing Wuhti's house, sorted bahos offered to him during
    his course around the earth, threw away those from bad people, and placed those
    from good people in a row.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: After sorting the offerings, the Sun bathed, ate, repainted and dressed himself,
    and continued his course under the earth toward east and west.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: The passage says bahos offered to the Sun are carried eastward to Sun Shrines
    of the Sun clan.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:20
  text: The passage says Flutes lived in the east, were always playing, and then the
    sun rose; it also connects gray and yellow fox skins with white and yellow dawn
    in the Flute ceremony.
  category: relationship
  evidence_refs:
  - ev:10
