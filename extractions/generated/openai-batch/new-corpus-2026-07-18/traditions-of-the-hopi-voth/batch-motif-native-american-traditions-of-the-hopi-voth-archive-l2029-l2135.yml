- id: ev:2
  type: summary
  locator: lines 2041-2050
  quote_or_summary: The Bātki and Prtna clans are present before the couple's arrival;
    the woman bears many snake children who live in fields and sand, grow quickly,
    play with Hopi children, bite them, and are driven away.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:3
  type: summary
  locator: lines 2051-2061
  quote_or_summary: The woman tells her husband to return their children to her home;
    his father makes bahos, the son carries the snakes and bahos to the Snake people,
    and the passage links this to Snake priests depositing bahos with snakes after
    the Snake dance.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:4
  type: summary
  locator: lines 2062-2073
  quote_or_summary: The couple travels southeast, finds Walpi on a mesa, requests
    admission, promises ceremonial assistance, and is admitted by the chief; afterward
    the woman bears human children whose descendants become the Snake clan.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:5
  type: summary
  locator: lines 2074-2088
  quote_or_summary: At Walpi the Snake people make the first Snake tiponi, altar,
    and ceremony; the cult spreads to other villages; the Snake chief sends his nephew
    to gather snakes from four directions and constructs a tiponi with snake rattles,
    a whole snake, corn, feathers, and buckskin.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:6
  type: summary
  locator: lines 2089-2097
  quote_or_summary: In the Snake Myth, Pihkash and Kokop old men wonder where the
    Colorado River flows, build a box with provisions, a pole, and four bahos, place
    a young man in it, and send it floating downriver.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:7
  type: summary
  locator: lines 2098-2105
  quote_or_summary: The box stops amid water; the young man sees a house; Huruing
    Wuhti calls him four times and rolls a corn-meal ball across the water, making
    a road for him to reach her house.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:8
  type: summary
  locator: lines 2106-2117
  quote_or_summary: Huruing Wuhti sends the young man into a side room before the
    Sun arrives on a noisy disk and pole; the Sun is dressed and painted like certain
    Katcinas and sorts bahos from bad and good people.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:9
  type: summary
  locator: lines 2117-2127
  quote_or_summary: The Sun bathes, eats, repaints and dresses, then goes under the
    earth on his east-west course; bahos offered to the Sun are carried eastward to
    Sun clan shrines.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:10
  type: summary
  locator: lines 2128-2135
  quote_or_summary: Flutes are said to live in the east and play before sunrise; the
    Flute ceremony places a gray fox skin at white dawn and a yellow fox skin at yellow
    dawn.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
