candidate_motifs:
- id: motif:1
  label: Premature opening of a container causes loss of wealth
  taxonomy_refs:
  - forbidden_knowledge
  basis: The man opens the sack before reaching home despite his wife's objection,
    and by morning almost all beads have disappeared.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not state a formal taboo; the taxonomy reference is based
    on the desire to see the sack's contents and the loss that follows.
- id: motif:2
  label: Serpent offspring as origin of a Snake clan
  taxonomy_refs:
  - serpent
  basis: The woman bears snake children, and the couple's later human children at
    Walpi become the Snake clan.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: This is extracted as a clan-origin motif within the passage, not as an
    independent historical claim.
- id: motif:3
  label: Ritual removal of snakes with offerings
  taxonomy_refs:
  - serpent
  - sacred_exchange
  basis: Snake children are returned with bahos, and the passage explicitly links
    this to Snake priests depositing bahos with snakes after the Snake dance so that
    the snakes do not return to the village.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage supplies an internal etiological explanation; no external
    corroboration is used.
- id: motif:4
  label: Migrating ritual specialists admitted to a mesa village
  taxonomy_refs:
  - departure
  basis: The man and woman leave, travel southeast, ask to enter Walpi, and promise
    to assist in ceremonies before being admitted.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The departure/migration element is clear, but the passage does not frame
    the couple as heroic travelers.
- id: motif:5
  label: First Snake ceremony founded through directional snake gathering
  taxonomy_refs:
  - serpent
  basis: The first Snake ceremony includes sending the chief's nephew to four directions
    to gather snakes and making a tiponi containing snake rattles and a whole snake.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The directional pattern is literal in the passage; broader cosmological
    interpretation is not inferred.
- id: motif:6
  label: Vessel voyage to a supernatural watery place
  taxonomy_refs:
  - ark_vessel
  - mystical_quest
  basis: A young man is placed in a prepared box and sent down the Colorado River
    to discover where it flows; he reaches a place of pervasive water and a house
    in its midst.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The vessel is not connected with a flood or survival of a world catastrophe
    in this passage, so the ark-vessel reference is approximate.
- id: motif:7
  label: Supernatural road made over water
  taxonomy_refs:
  - mystical_quest
  basis: Huruing Wuhti rolls a corn-meal ball across the water, making a road by which
    the young man reaches her house.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage describes the act literally but does not explain its symbolic
    meaning.
- id: motif:8
  label: Solar being judges and receives offerings
  taxonomy_refs:
  - divine_judgment
  - sacred_exchange
  basis: The Sun sorts bahos offered during his course around the earth, discarding
    those from bad people and placing those from good people in a row.
  evidence_refs:
  - ev:8
  confidence: high
