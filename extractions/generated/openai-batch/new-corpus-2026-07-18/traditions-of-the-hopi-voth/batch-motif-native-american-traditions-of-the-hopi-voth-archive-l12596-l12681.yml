canonical_text:
  quote: ''
  summary: 'The passage concludes an account of escalating violence around Sikyatki:
    a Katcina decapitates an enemy''s sister and displays the head; inter-village
    hostility follows; the chief of Sikyatki arranges with Walpi for Sikyatki''s destruction
    while its people are planting; Walpi burns the village and kills its inhabitants.
    The passage then begins the account of Aoatovi, describing its people, hunting
    practices, the accidental killing of the chief''s daughter during a rabbit hunt,
    and the chief''s angry resolve to raze the village.'
  language: English
  quote_policy: summarized
