canonical_text:
  quote: ''
  summary: People emerge from a lower world through an opening later called the sipapu,
    but the emergence stops when the Mocking-bird's songs are exhausted. In the dark,
    sunless world above, the Kík-mongwi's son dies; the chief uses a corn-meal ball
    to identify a dangerous person and accuses his nephew, who shows him the dead
    boy below and explains that the dead go there. The people seek fire and light,
    and a messenger finds Skeleton/Masauwuu at a cultivated field warmed by encircling
    fire. Skeleton invites the people, gives them warmth and food, and his planting
    keeps the food from being exhausted.
  language: English
  quote_policy: summarized
