  - ev:6
- id: obs:5
  text: The half-grown son of the Kík-mongwi became sick, died, and was buried.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Kík-mongwi, angry over his son's death, blamed the presence of a Poweka
