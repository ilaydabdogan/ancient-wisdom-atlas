    death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The nephew stated that when anyone dies, that person will go down there, and
    the chief allowed him to remain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The people searched for fire and wood in the darkness, saw a distant light,
    sent one searcher who returned tired, and then sent another who reached the light.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The successful messenger found a cultivated field with corn, watermelons,
    beans, and other plants; a fire burned around the field and warmed the ground.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: At the field, the messenger found Skeleton/Masauwuu, described as handsome
    and ornamented with turquoise, with an ugly mask-like friend standing by him.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Skeleton invited the people, fed the messenger, and later gave the people
