canonical_text:
  quote: ''
  summary: The passage first concludes a fragment in which a female figure attacks
    a stone dressed in bird skin, injures her mouth, is frightened by her bloody reflection
    at several springs, and dies after jumping into the Grand Canyon. It then tells
    of Aahtu bird beings who sing and throw their eyes onto a cedar tree; Coyote imitates
    them but his eyes do not return, and he dies. A following tale begins with a Turtle-dove
    cutting her hand while gathering grass seed; Coyote mistakes her crying for singing,
    forces her to repeat the sound, imitates it, repeatedly loses the song after stumbling,
    and returns until the Dove leaves.
  language: English
