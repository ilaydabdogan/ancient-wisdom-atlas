  quote: ''
  summary: 'The passage summarizes several Hopi traditions concerning violent retaliations
    between villages: a Katcina racer avenges an insult by killing a woman; villages
    are destroyed or attacked after chiefs arrange revenge; Aoatovi is attacked in
    two variant accounts involving kivas, firebrands, Spanish pepper, captives, and
    outside villages; a partial account begins about an Oraibi chief arranging an
    attack on Walpi that results in Oraibi losses.'
