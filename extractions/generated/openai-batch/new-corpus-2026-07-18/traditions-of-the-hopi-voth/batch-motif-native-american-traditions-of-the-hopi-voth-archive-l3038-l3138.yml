canonical_text:
  quote: ''
  summary: After a flood, people from the eastern part of a village prepare food,
    make a food altar, and emigrate. Two surviving children are left behind. Formerly
    Hopi turkeys pity them, and one speaks, directing them to food. A large water
    serpent, Bdlolookong/Balolookong, emerges, identifies himself as their grandfather,
    helps them find corn, tells them to follow their parents, and has them cut a piece
    of his flesh to give to the chiefs for use in rain-making. The children then begin
    the journey after their people, becoming exhausted, hungry, and thirsty.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People in the eastern part of the village prepared to emigrate by baking piki
    and making other food from remaining provisions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The emigrating people made a food altar east of the village; each person ate
    a little of the food there while passing by, with the village chief at the head
    of the line.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ground was still soft and muddy from the flood after the water serpents
    had disappeared.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two children who had survived in the village were not found and were left
    behind; the older brother carried the younger brother, and they cried in the evening
    because they were lonely.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Turkeys described as having been Hopi saw the children, pitied them, cried
    over them, and one turkey began to speak to them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaking turkey told the children about food at the food altar; the children
    went there, ate piki from trays, and found rabbit-skin blankets in a house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The big Bdlolookong came out of the ground at a large opening and remained
    standing there as a very large serpent.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Bdlolookong saw the children, had sympathy for them, cried, and was described
    as their grandfather because they were the children of his daughter.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The serpent spoke to the children in Hopi, told them not to be afraid, and
    said he was their grandfather.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The serpent instructed the children to knock down sweet corn from a wall by
    piling stones and using a stick, then to take food and follow their parents.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The children found a sharp flint knife and corn hanging on strings, piled
    stones, loosened ears of corn with a stick, and ate.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Bdlolookong told the children to cut a piece from his back, give it to the
    chiefs, and say that rubbing some of the meat into paint for b£hos would bring
    rain when rain was lacking.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the children hesitated, they cut out a large piece of the serpent's
    flesh; the meat was tender, and the wound closed immediately.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The children started after their people, became tired, thirsty, hungry, and
    weak, and on the third day fell asleep under a pine-tree after their food was
    gone.
  category: sequence
