canonical_text:
  quote: ''
  summary: 'The passage describes a night before battle near Orafbi: Hopi councils
    respond to an approaching Navaho force, some discouraged Hopi secretly bargain
    with Navaho warriors and undergo bloodletting, the Navaho perform war ceremonies
    and advance at dawn, Hopi warriors arm and ritually decorate themselves, and a
    mounted Navaho leader shoots the first arrow as the battle begins.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The approaching enemy halted for the night, and many campfires were seen at
    the place where they camped.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hopi clans assembled in ancestral homes for councils, then the people gathered
    in the public plaza where a large fire was kept in the center.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Warriors were encouraged and told to guard their lives; plunder taken from
    enemies would belong to the taker.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some Hopi, described as discouraged or possibly traitorous, went to the Navaho
    camp at night carrying presents and asked Navaho warriors to kill them in the
    next day's battle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Navaho warrior punctured the Hopi person's foot near the ankle over a pot
    in the ground so that blood ran into the pot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The loss of blood weakened those Hopi so that they walked slowly the next
    day and could be singled out by the Navaho; they returned to the village without
    telling the others.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Navaho sang war songs, performed war ceremonies, broke camp at early dawn,
    and advanced toward Orafbi, reaching the mesa north of the village before sunrise.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hopi warriors wrapped buckskins around the upper body, gathered bows, arrows,
    stone tomahawks, boomerangs, throwing-sticks, and other weapons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Some Hopi warriors put on society headdresses, such as two horns for the Horn
    Society and one horn for the Agave Society, and many tied feathers into their
    hair.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Hopi lined up north of the village across the mesa, and the warrior chief
    of the Burrowing Owl clan performed war rites.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A water tray was placed on the ground, fetishes, amulets, bones, and related
    items were placed around the medicine bowl, and war songs were chanted.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The war chief pulverized a stone called p66k6ngnayoo, mixed it with water
    from the medicine bowl, and marked warriors on limbs, heart, and back.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Navaho leader rode on a pony covered with red bayetta cloth, spoke unrecorded
    words, shot the first arrow into the Hopi crowd without hitting anyone, and rode
    back.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The battle opened before sunrise; Agave, Snake, Lizzard, Burrowing Owl, and
    Squash clans led, with shield-bearing fighters in front and archers behind.
  category: sequence
  evidence_refs:
  - ev:10
