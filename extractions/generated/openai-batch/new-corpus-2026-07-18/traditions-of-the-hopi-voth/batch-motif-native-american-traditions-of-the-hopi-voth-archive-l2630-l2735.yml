canonical_text:
  quote: "“the bluff, though far away, at once assumed a white color.”"
  summary: The passage closes an account of a Yayaatu initiation involving white kaolin,
    eagle feathers, a distant bluff, kiva confinement, discharge by the Hawk-man,
    and the founding of the Yayaatu Society. It then gives an account of Mishongnovi
    clan origins, including migrations from Palatkwapi, rainmaking, rapid crop growth,
    cult possessions, spring enlargement, clan offices, and a brief beginning of a
    Palatkwapi destruction story after emergence from the underworld through the sipahpuni.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A leader brought a bowl of diluted white kaolin from the kiva, and the group
    took it to the top of the Marau kiva where the distant bluff Canavitoika could
    be seen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Yayaatu placed eagle feathers into the white kaolin and moved them in
    the air as if whitewashing the distant bluff; the bluff then appeared white to
    the people watching.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After returning to the plaza, the singers stopped, watermelons were cut up,
    slices were distributed, and the people entered the kiva again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mothers and relatives crowded toward the kiva to get their children, but the
    watcher kept them back and said the youths had not yet been discharged.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Inside the kiva, the Hawk-man discharged the youths, placed nrtekwiwi and
    white piki before them, and told them to eat and sleep in the kiva for one night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Hawk-man and the old woman wrapped up costumes and other paraphernalia
    and returned to their kiva in the valley east of the village, leaving corn-ear
    mothers for each youth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the morning the youths returned home; after that they were no longer bad
    and dangerous, formed the Yayaatu Society, and directed prayers toward the place
    where the Hawk-man lived and where they had been initiated.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Batki clan and the Sand clan are said to come from Palatkwapi and to have
    lived for a long time at Homolovi before moving through Aoatovi to Mishongnovi.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: During travel, the Sand clan spread sand on the ground and planted corn, while
    the Batki clan caused thunder and rain by singing; the crop grew in one day and
    provided food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: At Mishongnovi, the incoming clans demonstrated their ability to produce rain
    and crops and were welcomed; their leader was made chief of the village.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: The Batki people brought mud, grass, and water from the Little Colorado River
    in a mongwikuru and placed them in the small spring Toriva, increasing the spring’s
    water flow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Several Mishongnovi clans are associated with specific cults or offices, including
    Antelope, Blue Flute, Drab Flute, Marau, Katcina, Lagun, Soyal, Snake, village
    chief, and village crier roles.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: The Young Corn-Ear or Corn-Ear clan came from the east and brought a better
    and larger quality of corn.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: A note says lizards and snakes would come into the sand, and that these names
    are also applied to the Sand clan.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The next story begins by saying that after all the people except the Zunis
    came out from the underworld through the sipahpuni, they remained for a time with
    Skeleton and later traveled eastward in different groups; one large party came
    to Palatkwapi, including the Divided Water clan.
  category: sequence
  evidence_refs:
  - ev:7
