candidate_motifs:
- id: motif:1
  label: Initiation producing social and behavioral transformation
  taxonomy_refs:
  - initiation
  basis: The youths are confined in the kiva, formally discharged by the Hawk-man,
    sleep there overnight, return home no longer bad and dangerous, and form the Yayaatu
    Society.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This passage begins after earlier parts of the initiation narrative; only
    the closing ritual sequence is present here.
- id: motif:2
  label: Ritual action at a distance transforms a landscape feature
  taxonomy_refs: []
  basis: The Yayaatu manipulate eagle feathers and white kaolin as if whitewashing
    the far-off bluff, and the bluff appears white to the people.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No supplied taxonomy family exactly names sympathetic or distant-action
    ritual, so no motif-family reference is assigned.
- id: motif:3
  label: Rainmaking and rapid crop growth during clan migration
  taxonomy_refs:
  - seasonal_cycle
  basis: The Sand clan spreads sand and plants corn while the Batki clan sings to
    make thunder and rain; the crop grows in a day and later rain makes small corn
    grow large.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: medium
  cautions: The seasonal_cycle taxonomy reference is broad; the passage emphasizes
    rainmaking and crop growth rather than a full annual cycle.
- id: motif:4
  label: Transfer of river materials to increase a spring
  taxonomy_refs: []
  basis: The Batki bring mud, grass, and water from the Little Colorado River in a
    mongwikuru and place them in the small Toriva spring, increasing its flow.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage states the act and result but does not explain the mechanism
    or give an explicit symbolic interpretation.
- id: motif:5
  label: Ritual expertise legitimates settlement and chieftainship
  taxonomy_refs: []
  basis: The incoming clans are questioned about what they know to produce rain and
    crops; after demonstrating these abilities, they are welcomed and their leader
    is made village chief.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The available royal_legitimacy taxonomy is not assigned because the passage
    concerns a village chief rather than explicit royalty.
- id: motif:6
  label: Emergence from the underworld followed by departure and migration
  taxonomy_refs:
  - ascent
  - departure
  basis: The passage says the people came out from the underworld through the sipahpuni
    and then traveled eastward in different sections and parties.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This is only the opening sentence of the next story, so the development
    of the emergence and migration motif lies outside the supplied passage.
