canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which a blind man and a lame or crippled
    man cooperate to kill an elk, roast its eyes, are restored to sight and walking,
    stay awake through the night to prevent relapse, and lead fled villagers back
    to Oraibi. It then gives a brief tale of Big Head and Goat Horn, explaining a
    goat-cutting practice through an act of hospitality. It begins another tale about
    two women friends who meet while getting water at Spider Spring and exchange food
    visits.
  language: English
  quote_policy: summarized
