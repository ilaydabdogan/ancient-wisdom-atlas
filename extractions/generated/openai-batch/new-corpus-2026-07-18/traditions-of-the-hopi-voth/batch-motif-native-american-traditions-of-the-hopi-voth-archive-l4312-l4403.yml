canonical_text:
  quote: ''
  summary: A group associated with the Ahdli Katcina hears singing at a mesa shrine
    and encounters Aototo and the Big-Horn Katcina. The beings agree to descend together,
    establish or pass shrines, meet the dangerous Cooyoko, and then stay at Ahdli's
    house. After night singing before their masks, rain comes and fields are found
    flourishing. Big-Skeleton, owner of the earth and fields, directs the Katcinas
    to live and perform rites on top of the mesa, after which the Walpi also begin
    moving there.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: There were no villages on top of the mesa, but a shrine of Tal£whtoika was
    already present there, and singing was heard at that shrine.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ahdli Katcina and companions returned to their house and then went up
    the mesa to look for the one they had heard singing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A white-masked figure with a white body, blue-yarn bandoleer, and bone rattle
    stood beside the shrine and shook the rattle four times.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aototo said he was not singing and that another of the two present had been
    singing.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Big-Horn Katcina came from the west end of the mesa carrying a bow and
    quiver and wearing a green mask with a horn on one side and an ear on the other.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ahdli Katcina proposed that the group go down together and possess the
    people, and the two Katcinas agreed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The group descended in an ordered procession and made a baho shrine by erecting
    stones between Hano and Sitcomovi, then went to a large shrine with a twisted
    stone.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the large shrine they met Cooyoko, described as dangerous, masked with
    protruding eyes and a big mouth, wearing rattles, and carrying a knife and a crook
    with mosililis.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:12
- id: obs:9
  text: The passage states that Cooyoko used to kill and devour children there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Katcinas told Cooyoko not to trouble them, saying they were going to possess
    the people and that he could destroy the bad ones.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Ahdli's house, Ahdli invited the others to stay, said it did not rain below,
    and said they would help the people and plant for them the next morning.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: During the night the Katcinas did not sleep but sang before masks arranged
    in a row, and hard rain began around yellow dawn before sunrise.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Katcinas went to the fields south of the mesa and found corn, melons,
    watermelons, and squashes growing beautifully; they took some produce while rain
    continued.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Big-Skeleton, who owns the earth and fields, met the Katcinas and told them
    to prepare a house on top of the mesa, live there, and perform their rites from
    there.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: Afterward the Walpi began to move up the mesa and build the new village at
    its present location.
  category: sequence
  evidence_refs:
  - ev:11
