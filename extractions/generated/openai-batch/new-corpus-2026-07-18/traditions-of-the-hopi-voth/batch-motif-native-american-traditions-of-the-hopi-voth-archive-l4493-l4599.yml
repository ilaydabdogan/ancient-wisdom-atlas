canonical_text:
  quote: ''
  summary: The passage closes an episode in which two brothers, swallowed by a monster,
    find and shoot its heart, lead the swallowed people out through the monster's
    nose, and the rescued people disperse. A following episode begins in which Pdokonghoya/Pdokong
    and his brother, living near Shongopavi with their grandmother, play ball, take
    ritual offerings and ceremonial objects from springs, kivas, and Corn-Ear Bluffs,
    and encounter the Watcher of the rock.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before the expedition, the brothers' grandmother instructed them that if the
    monster swallowed them, they should find its heart and shoot into it so the monster
    would die.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inside the monster, the brothers found a path out of the stomach and saw something
    hanging above them that they identified as the monster's heart.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The elder brother first shot at the heart and failed; the younger brother's
    arrow pierced it, after which the elder brother also shot into it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the heart was pierced, darkness occurred and the people noticed that
    the monster was dying.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The brothers gathered the people and led them toward the monster's mouth,
    but the teeth were fixed shut in death, so they escaped through a passage into
    the nose.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A large group of people assembled north of the village, and many villagers
    found children and relatives who had been carried off by the monster.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brothers told the rescued people to move on and find their own homes,
    and the passage connects their temporary settlements with small ruins in the country.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The old people say that the monster was really a world or country similar
    to the world people live in.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the next tale, Pdokong/Pdokonghoya and his brother live north of old Shongopavi
    with their grandmother and often play with a ball.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: At a spring, the younger brother took and swallowed a baho, while the elder
    brother found paints deposited by Flute priests and put some of each kind into
    the ball.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After sewing the ball closed, the elder brother said that if they beat the
    ball in that way, it would rain before they reached home.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: In a kiva where Flute priests were assembled, the brothers took a tray containing
    a lightning frame, thunder board, netted water jug, and other objects.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: In another kiva, Snake priests were washing snakes in a bowl; the brothers
    took a bull-snake, put it into a snake-sack, and left.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: At Corn-Ear Bluffs there were many bahos, artificial melons, watermelons,
    and peaches deposited in cracks and niches as prayer-offerings for abundance.
  category: object
  evidence_refs:
  - ev:10
- id: obs:15
  text: On top of the rocks sat the Watcher, Tuwalahka, identified as Cotukvnangwuu
    in the form of an old man and described as owning the rock.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:16
  text: The younger brother proposed stealing some prayer-offerings from Corn-Ear
    Bluffs; the elder brother refused, but the younger brother climbed up and took
    a corn baho, a watermelon, and a melon.
  category: sequence
  evidence_refs:
  - ev:10
