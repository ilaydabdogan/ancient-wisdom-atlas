  text: Badger lives at Badger Gulch, Coyote lives at ish-movala, and the two are
    described as great friends hunting together.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote had found the place where a Kohnino maiden had died and asks Badger
    to go there and revive her, saying Badger is a doctor.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Badger and Coyote find the maiden's bones, gather them, place them on a pile,
    and cover them with Badger's black kilt.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Badger sends Coyote away and has him fetch dry grass, red paint, and water
    from Hidden Spring for use with the bones.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Badger warns Coyote not to watch the work over the bones, saying that if Coyote
    sees it the maiden will never revive.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Badger sings, repeatedly pours paint over the bones and grass beneath the
    cover, and the bones begin to move; when the cover is removed, the maiden is alive.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The revived maiden asks why she is wanted, and Badger says Coyote is the one
    who wanted her revived; Coyote confirms this.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the way home, Coyote wants to marry the maiden, but Badger refuses and
    says she was revived to be their clan sister and to build the fire for them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Coyote rushes upon the maiden and bites her in the calf of the leg; after
    Badger rebukes him, the maiden falls down and dies again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Badger carries the maiden's body southwest, digs a grave, and buries her;
    he tells Coyote that one does not follow the dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the burial, Badger thinks about how to kill Coyote, kills four bull-snakes,
    cuts them up, dries them over a slow fire in a pot, prepares hurushuki, and Coyote
    arrives.
  category: sequence
  evidence_refs:
  - ev:6
