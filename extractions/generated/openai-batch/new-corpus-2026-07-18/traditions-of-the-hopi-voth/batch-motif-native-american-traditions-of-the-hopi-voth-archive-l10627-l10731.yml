canonical_text:
  quote: ''
  summary: Badger and Coyote, friends who are hunting together, go to the place where
    a Kohnino maiden has died. Badger, described as a doctor, gathers her bones, covers
    them, uses dry grass, red paint, spring water, and song while keeping Coyote away,
    and revives her. On the journey home Coyote wants to marry her, but Badger says
    she was revived to be their clan sister and fire-builder. Coyote bites her leg,
    and she dies again. Badger buries her and then prepares dried bull-snakes while
    thinking how to kill Coyote.
  language: English
  quote_policy: summarized
