canonical_text:
  quote: ''
  summary: 'The passage closes a scene of two women sharing food, then gives a tale
    in which children from Pivanhonkapi obtain permission from Hukovi children to
    trap birds by giving food. It then gives the tale of the Jug Boy: a Hano woman
    associated with clay and jug-making bears an earthen jug containing a boy, raises
    and feeds him through the jug opening, and the jug youth later hunts rabbits.
    During the hunt the jug breaks and a Hopi emerges, kills rabbits, returns home,
    and thereafter lives as a provider for his mother and grandfather.'
  language: English
  quote_policy: summarized
