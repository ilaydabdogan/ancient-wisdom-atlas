candidate_motifs:
- id: motif:1
  label: disguised ghost gives ritual instructions after arson
  taxonomy_refs: []
  basis: The chief's son acts as a ghost, is unmasked, and tells the people to plant
    bahos and hold a feast.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage is a condensed summary and does not explain the ghost disguise's
    purpose beyond the actions stated.
- id: motif:2
  label: flood released through ritual planting and serpent beings
  taxonomy_refs:
  - flood_and_renewal
  - serpent
  basis: Water emerges where bahos were planted; the old man becomes a large Balolookong,
    other Balolookongs and streams of water erupt, and the village is destroyed.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The renewal element is limited to survival and later migration rather
    than a fully described recreation of the world.
- id: motif:3
  label: human transformation into Balolookong
  taxonomy_refs:
  - shapeshifter
  - serpent
  basis: The old man concealed in the shrine emerges as a large Balolookong.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not define Balolookong beyond the surrounding serpent
    and water context.
- id: motif:4
  label: sibling pair confronts flood serpent and disappears
  taxonomy_refs:
  - sibling_pair
  - sacrifice
  - serpent
  - flood_and_renewal
  basis: The chief's son and his sister are dressed to drive back the Balolookongs;
    the young man presses the large Balolookong into the water, and the serpent, young
    man, and sister disappear and never return.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage does not explicitly call their disappearance a sacrifice,
    so that taxonomy reference is tentative.
- id: motif:5
  label: animal transformation as survival from catastrophe
  taxonomy_refs:
  - shapeshifter
  basis: Old men climb onto tray shelves, turn into turkeys, and survive the flood.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage does not explain the mechanism or ritual significance of the
    turkey transformation.
- id: motif:6
  label: child survivors aided by animal and ancestral serpent-being
  taxonomy_refs:
  - survivor_pair
  - serpent
  basis: Two boys survive the flood, are fed through Turkey's pity, and receive guidance
