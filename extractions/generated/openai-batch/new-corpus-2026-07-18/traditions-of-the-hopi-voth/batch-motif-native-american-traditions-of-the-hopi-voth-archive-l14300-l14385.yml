canonical_text:
  quote: ''
  summary: The passage summarizes a sequence in which a chief's son acts as a ghost,
    ritual warnings lead to a flood involving Balolookong beings, two children survive
    and receive help from Turkey, Big Balolookong, and the God of Thunder, and later
    a separate tale describes Katcinas avenging their burning by sending destructive
    hail that leaves one man and one woman alive.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief gives a young man a cedar bark fuse and tells him to return to Pine
    Ridge and set a pine on fire; the young man later acts as a ghost and sets other
    timbers on fire over several nights.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Watchers catch the ghost and put him in a kiva; after a mask is removed, the
    people see that the ghost is the chief's son, who tells them to plant bahos in
    five places and hold a four-day feast.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Four years later an old man makes sharp hardwood bahos, is concealed in a
    katcina shrine with bahos, a whistle, and water, sings, lowers one finger on successive
    days, and water begins to come out where bahos had been planted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the fourth day the old man emerges as a large Balolookong, while other
    Balolookongs and streams of water shoot from the ground in the village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Houses fall and bury many people; others flee to high ground, and old men
    in one house climb onto tray shelves and turn into turkeys.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Chiefs make bahos, crush beads and turquoise into powder to make two balls,
    and dress the village chief's son and his sister to drive back the Balolookongs
    moving through the water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The young man grasps the large Balolookong and presses him into the water;
    the serpent, the young man, and his sister disappear and never return.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The village is destroyed; only old men who became turkeys and two little boys
    who had slept through the flood survive.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Surviving people make a food altar and leave the village, leaving the two
    children; Turkey takes pity on the children and sends them to the food altar to
    eat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Big Balolookong looks after the people, tells the children he is their grandfather,
    directs them to food and a knife, and has them cut flesh from his back to use
    with paint for rain-making bahos.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The children become exhausted, fall asleep, and are helped by the God of Thunder,
    who descends, removes his mask, gives them food, and later promises lightning
    and thunder and teaches war songs and scalp-taking conduct.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: When the children are grown, they pray to the God of Thunder, who teaches
    them how to kill nearby Apache; the elder brother shoots lightning, and the Apache
    are slain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After scalping a warrior and returning with items from the slain, the brothers
    are instructed by the God of Thunder to throw the scalp on the man who is to become
    War Chief.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: People leave Homolovi; the Batki clan goes to Aoatovi, and others become the
    Forehead Clan and eventually settle in Shupaulavi.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: In a separate tale, Katcinas assemble in a mountain kiva, come to the village
    at night, and dance on the plaza while the people sleep.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The people threaten to kill the unknown dancers; the Katcinas flee into a
    large crack, and the people set fire to them, burning them except for Katcina
    Uncle at the bottom.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: Katcina Uncle returns home singing and sobbing, tells Hehea Katcina what happened,
    and the Katcina chief orders the Katcinas to assemble.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: The Katcinas make hail for three days; on the fourth day clouds rise from
    the mountains, thunder, lightning, rain, and large hailstones occur, crops are
    destroyed, and all people except one man and one woman are killed.
  category: sequence
  evidence_refs:
  - ev:8
