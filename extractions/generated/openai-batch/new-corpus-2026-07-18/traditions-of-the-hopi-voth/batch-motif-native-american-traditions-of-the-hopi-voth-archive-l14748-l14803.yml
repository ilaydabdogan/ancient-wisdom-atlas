    sometimes leave graves as bull-snakes.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:5
  type: summary
  locator: 14779-14786
  quote_or_summary: A youth sits on the mesa edge thinking about the graveyard, prays
    four days to the sun for information, and the sun comes and gives him something
    to eat.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:6
  type: summary
  locator: 14786-14790
  quote_or_summary: The youth tells his parents how to work on him so he may wake,
    eats medicine, dies, goes to Skeleton House, sees a trail, and descends on the
    north side.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:7
  type: summary
  locator: 14790-14794
  quote_or_summary: On the way, a recognized person asks to be carried four steps,
    a burdened woman asks him to take her burden, and a man with a mealing stone asks
    him to take it; he continues onward.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:8
  type: summary
  locator: 14794-14797
  quote_or_summary: The youth reaches Kwanitaka, who shakes or rings a loud bell and
    explains what he has seen; another Kwanitaka also rings, and they go onward together.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:9
  type: summary
  locator: 14797-14800
  quote_or_summary: They see a fire in a deep place where wicked ones in Orafbi are
    burned and come out as smoke, and a very dark deep place from which those thrown
    in never come out.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:10
  type: summary
  locator: 14800-14804
  quote_or_summary: The youth is directed to a village where he sees Kwanitaka, chiefs
    he had known in Orafbi living in blossoms, and many grasses, plants, and blossoms;
    Kwanitaka says those not wicked in Orafbi will come there.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:11
  type: summary
  locator: 14804-14809
  quote_or_summary: Kwanitaka tells the youth to tell his parents what he has seen
    and run fast; he passes the earlier figures, reaches the house in Orafbi, enters
    his body, awakens, eats, and tells what he saw.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:12
  type: summary
  locator: 14809-14818
  quote_or_summary: The young man wants to return, takes medicine at night, and is
    dead when his mother brings food; Bachro speaks to the father in the field and
    says the parents should not be homesick because the son lives well, and that they
    are to come in four days.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized for extraction.
