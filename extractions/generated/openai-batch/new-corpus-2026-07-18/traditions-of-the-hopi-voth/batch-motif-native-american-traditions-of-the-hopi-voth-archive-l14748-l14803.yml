canonical_text:
  quote: ''
  summary: 'The passage first summarizes a story in which Spider Woman recovers a
    maiden, sends her home with Katcinas, and a Yellow Corn-Ear maiden is transformed
    into a bull-snake after drinking from a special vessel. It then recounts a youth’s
    journey to Skeleton House: he prays to the sun, takes medicine, dies temporarily,
    travels an afterlife trail, sees guides, punitive places, and a blossom-filled
    village for the non-wicked, returns to his body to report, and later dies again
    after trying to return.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Spider Woman removes coyote skin associated with a covered vessel in water
    and finds a maiden inside the vessel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spider Woman bathes the maiden, gives her corn to grind, calls Katcinas, and
    instructs the maiden about prayer-offerings and how to get even with Yellow Corn-Ear.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The maiden returns to the village with Katcinas; her parents initially doubt
    the news, and she remains with the Katcinas until her father brings offerings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a spring, Yellow Corn-Ear maiden drinks from the friend’s little vessel
    after seeing rainbow-colored water run into the jug, and she turns into a bull-snake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bull-snake maiden goes to the village and is killed by her parents, who
    do not know her; her soul goes to Skeleton House.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says that since that event sorcerers sometimes leave their graves
    in the form of bull-snakes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A youth sits on a mesa edge thinking about the graveyard and prays four days
    to the sun for information about the dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sun comes and gives the youth something to eat; the youth later eats medicine,
    dies, and goes to Skeleton House.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: On the way to Skeleton House, the youth sees a trail and descends on the north
    side.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The youth meets people who ask him to carry them or their burdens, including
    a recognized person, a woman carrying something, and a man carrying a mealing
    stone, but he continues onward.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The youth encounters Kwanitaka figures who ring bells loudly and explain what
    he has seen or travel with him.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The youth sees a fire in a deep place where wicked ones in Orafbi are burned
    and come out as smoke.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: The youth sees a very dark, deep place from which those thrown in never return.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: In another village, the youth sees chiefs he had known in Orafbi living in
    blossoms, along with many grasses, plants, and blossoms.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: Kwanitaka tells the youth that those who are not wicked in Orafbi will come
    to that place, and instructs him to tell his parents what he has seen.
  category: speech
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:16
  text: The youth runs back along the route, enters his body in Orafbi, awakens, and
    tells his parents what he has seen.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: The young man later wants to go back, takes more medicine at night, sleeps,
    and is found dead when his mother brings food.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:18
  text: Bachro speaks to the father in the field and says the parents should not be
