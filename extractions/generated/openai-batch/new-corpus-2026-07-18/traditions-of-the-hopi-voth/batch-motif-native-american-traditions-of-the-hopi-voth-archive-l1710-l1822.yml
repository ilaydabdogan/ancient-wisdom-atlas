canonical_text:
  quote: ''
  summary: The passage recounts movements and settlements of several Hopi clans, especially
    the Spider and Bear clans. It describes repeated stops with planting, contact
    with Americans in the east, westward movement to Hopi villages, Machito's departure
    after a dispute over scarce corn, the setting of a boundary stone, and later arrangements
    by which clans contribute ritual knowledge, medicines, cults, and ceremonial roles
    including Soyal, Marau, Powamu, Katcina rites, and a corn-planting contest involving
    the Flute groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Spider people stopped at ten places, planted crops, and were repeatedly
    harassed by people along the water before reaching the place described as where
    the sun rises and where the Americans live.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Spider people became friends with the Americans, planted there, stayed
    three years, and their children learned some of the language.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Spider people learned that the Bear clan had already been there and gone
    westward, then followed and joined the Bear clan at Oraybi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Bear clan went south from the sipapuni with the Aototo Katcina and were
    joined by the Young Corn Ear people with the Aholi Katcina.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bear clan had a good crop at one stop because, according to the passage,
    they had the two Katcinas with them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Bear clan stopped ten times before arriving at the Americans, stayed four
    years, and their children learned some English.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Americans told the Bear clan to go west to find land and said they would
    punish bad people who caused the Bear clan's children to die.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Machito was seen holding multiple sweet corn ears while corn was scarce; after
    being criticized for greediness, he became angry and left with the Aototo and
    Aholi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Machito left his wife and people at Shongopavi, and those people then formed
    the Shongopavi Bear clan.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Machito carried a big stone and placed it at Ocepchomo as a landmark between
    the fields of Shongopavi and his own.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Machito allowed the Spider people to live at Oraybi but assigned them solar
    watching and participation in the Soyal ceremony.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Lizard people said they knew the Marau cult and were permitted to stay,
    with a request to cooperate in the Soyal ceremony.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Badger people are described as understanding medicines and preparing medicine,
