canonical_text:
  quote: ''
  summary: 'The passage includes the end of a Kohonino hunting story in which a fallen
    hunter revives as Skeleton and occupies abandoned houses. It then summarizes the
    White Corn-Ear Maiden story: sorcerers kill the maiden by means of a poisoned
    feathered-arrow wheel containing her breath, remove her body from the grave, resuscitate
    her, and are defeated by the maiden''s brother, a war chief, Hawk, and a star-and-cloud
    deity. The maiden moves between earth and sky and finally goes to the sky. The
    passage ends with the opening of the Watermelon-Rind Woman story, where a poor
    young man is urged by his grandmother to court a maiden with two fawns.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Kohonino hunter shoots a mountain sheep, falls over a ledge while climbing
    down to it, loses both eyes, lies unconscious, and revives at night as Skeleton.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kohonino villagers keep a fire burning all night while waiting for the young
    man, then flee with belongings and children when they see the Skeleton; the Skeleton
    takes possession of the houses, and the Kohonino settle westward near Green Bluff.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: White Corn-Ear Maiden refuses marriage offers, and kiva-dwelling sorcerers
    decide to destroy her by making a feathered-arrow wheel with one poisoned arrow
    and wrapping her breath into the wheel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Young men play with the wheel and arrows before the maiden's house; one wounds
    her foot with the poisoned arrow, and she dies that night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the maiden's burial, the sorcerers change into coyotes and other animals,
    imitate animal sounds near the graveyard, tear old wrappings, disinter the body,
    and carry it away on a gray wolf.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The maiden's brother watches the grave, overhears the animals speaking, follows
    them to a meeting place, and returns to the village for help from the war chief.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The war chief puts on war costume and summons assistance by whistling upward;
    a star-and-cloud deity, Hawk, and many skeleton flies respond.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the sorcerers' kiva, an old man takes the maiden's breath from the wheel,
    puts it into her body, and the maiden revives and cries.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hawk enters the kiva, seizes the maiden, and carries her out on his back while
    the warrior party confronts the sorcerers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the contest, fires are extinguished and rekindled, sorcerers shoot
    small dangerous arrows at warriors' shields, and the war chief releases bees that
    sting the sorcerers, their wives, and children.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The star-and-cloud deity throws lightning that tears the sorcerers to pieces;
    later the deity restores the victims with mixed body parts as punishment, and
    they are ridiculed and then die in accidents.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:12
  text: The maiden spends time in the sky grinding cornmeal, is brought back to earth
    near Oraibi by Hawk, later disappears repeatedly, and after the last punished
    victim dies descends from the sky to the village.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The maiden tells her parents that when she dies they should not wrap and tie
    her body; when she fails to awake one morning, her body is treated as eagles are
    treated when buried, and her brother watches the grave for four days without disturbance.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The opening of the Watermelon-Rind Woman story says that a pretty maiden refuses
    marriage offers; Piwitamni's grandmother urges him to ask for her hand and gives
    him two fawns to take to the maiden at a rock.
  category: sequence
  evidence_refs:
  - ev:10
