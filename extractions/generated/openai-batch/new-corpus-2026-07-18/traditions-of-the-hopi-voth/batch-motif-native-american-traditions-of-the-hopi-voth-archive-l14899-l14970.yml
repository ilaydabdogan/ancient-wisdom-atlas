candidate_motifs:
- id: motif:1
  label: Injured hunter returns as Skeleton and occupies abandoned houses
  taxonomy_refs:
  - death_rebirth
  - dying_and_returning
  basis: The hunter lies unconscious after a fall, revives at night as Skeleton, returns
    to the village, and remains in the abandoned houses after the people flee.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage says he revives as Skeleton but does not explicitly narrate
    death before revival; the story is represented only as a brief ending fragment.
- id: motif:2
  label: Sorcerous killing through detached breath and poisoned object
  taxonomy_refs: []
  basis: The sorcerers wrap the maiden's breath into a feathered-arrow wheel, include
    a poisoned arrow, and the maiden dies after being wounded by it.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No available taxonomy reference precisely labels the breath-in-object
    mechanism.
- id: motif:3
  label: Sorcerers change into animals to approach a grave
  taxonomy_refs:
  - shapeshifter
  basis: After the maiden's burial, the sorcerers change themselves into coyotes and
    other animals, imitate animal sounds, and remove the body from the grave.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage summarizes the transformations without detailing individual
    transformed identities.
- id: motif:4
  label: Resuscitation of a dead maiden by restoring breath
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: In the sorcerers' kiva, the old man takes the breath wrapped in the wheel,
    puts it into the body, and the maiden revives.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The resuscitation is performed by sorcerers, not by the rescuers; later
    events change the maiden's condition again.
- id: motif:5
  label: Supernatural helpers summoned for rescue
  taxonomy_refs: []
  basis: The war chief summons a star-and-cloud deity, Hawk, and skeleton flies, and
    later uses bees in the conflict with the sorcerers.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The available taxonomy list does not contain a direct helper-summoning
    motif label.
- id: motif:6
  label: Divine punishment through lightning and altered restoration
  taxonomy_refs:
  - divine_judgment
  basis: The star-and-cloud deity destroys the sorcerers with lightning and later
    restores them or the victims with mismatched body parts as punishment, leading
    to ridicule and accidental deaths.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: medium
  cautions: The passage calls the later restoration a punishment but is compressed
    and refers to 'victims,' requiring review of the surrounding source for exact
    referents.
- id: motif:7
  label: Maiden moves between earth and sky and finally dwells in sky
  taxonomy_refs:
  - ascent
  - return
  basis: The maiden is found in the sky, remains there grinding cornmeal, is returned
    to earth by Hawk, later descends from the sky to the village, and finally dies
    and goes to the sky to live with war chiefs.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage does not provide a detailed route or map of the sky journey.
- id: motif:8
  label: Poor suitor aided with animal gifts
  taxonomy_refs: []
  basis: Piwitamni hesitates to court the maiden because he is poor, and his grandmother
    gives him two fawns to take to her.
  evidence_refs:
  - ev:10
  confidence: low
  cautions: Only the opening of this story is present, so the role of the fawns and
    outcome of the courtship are not shown in the supplied passage.
