canonical_text:
  quote: ''
  summary: A young man returns home, learns from two Eagles that his sisters locked
    the door and beat them, dresses in decorated attire, and is carried upward by
    an Eagle while singing. The Eagles circle above the village and field, ignore
    the family's pleas, and carry him out of sight through an opening in the sky to
    the Eagle world. They leave him on a high bluff because of his sisters' mistreatment.
    Despondent, he considers jumping down and then sees a little Wren at the bluff
    edge.
  language: English
  quote_policy: summarized
