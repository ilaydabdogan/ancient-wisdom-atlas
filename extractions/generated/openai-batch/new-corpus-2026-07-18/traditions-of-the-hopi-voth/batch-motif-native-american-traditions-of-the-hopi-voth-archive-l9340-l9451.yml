canonical_text:
  quote: ''
  summary: The passage contains two Hopi narrative units. In the first, people at
    Oraibi hunt many locusts, roast them in salt water, and eat them; one locust revives
    while an old woman is cooking, sings about formerly preferred rabbit meats and
    the present preference for locusts, answers the woman indirectly through its song,
    and flies away after she speaks. In the second, Coyote encounters a crying baby
    Turtle whose mother has left to gather cactus; after threatening to eat the baby
    Turtle, Coyote is tricked into throwing it into the water, which is its home,
    and the baby Turtle escapes while laughing at him.
  language: English with Hopi song lines and terms
  quote_policy: summarized
