canonical_text:
  quote: ''
  summary: The Pookongs first mistake windblown grass for a dance and are corrected
    by Spider Woman. Later they attend a Lalakontu dance at Mishongnovi, receive no
    invitation to eat, snatch trays from dancers, and bring them home. Angered by
    the lack of hospitality, they remove nearby salt to a distant, difficult place.
    The next tale opens with Pookonghoya and Baloonghoya deciding to seek marriage
    with a maiden who refuses all suitors, despite Spider Woman's warning that they
    are small and unsightly.
  language: English
  quote_policy: summarized
