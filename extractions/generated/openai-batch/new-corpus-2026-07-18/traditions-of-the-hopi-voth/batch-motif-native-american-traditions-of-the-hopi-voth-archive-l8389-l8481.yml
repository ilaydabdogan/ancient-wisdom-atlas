canonical_text:
  quote: ''
  summary: A stranded young man on a bluff is pitied by a black Spider/Spider Woman
    and given downy turkey feathers for the night. A Wren makes a ladder from its
    own feathers in a crack of the bluff, leads the young man safely down, then restores
    its feathers. The man is directed to Spider Woman’s small house, where she enlarges
    the entrance, feeds him tiny portions that increase in his mouth, makes him a
    pitch-and-hair ball, and later receives birds he hunts at a lake. She warns him
    not to go west because bad people live there.
  language: English
  quote_policy: summarized
