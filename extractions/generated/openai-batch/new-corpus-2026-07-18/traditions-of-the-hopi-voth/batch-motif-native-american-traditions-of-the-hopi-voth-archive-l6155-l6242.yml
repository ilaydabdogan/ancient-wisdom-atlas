canonical_text:
  quote: ''
  summary: A young man visits the Skeleton house after dying, learns how the Skeletons
    live, receives instructions about ritual offerings and burial wrappings connected
    with rain and crops, observes punishments and good chiefs in the other world,
    returns by a steep bluff, re-enters his body, and recounts his westward route
    through a woman’s enclosure, cactus, and the bluff.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Skeletons laugh when the young man eats food because they consume only
    the odor or soul of food, and the passage links their lightness to clouds into
    which the dead are transformed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The food itself is thrown behind the houses by the Skeletons, and the young
    man sometimes eats it while wandering there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man says he came because he wanted to find out where Skeletons live;
    his father dressed him, and Badger Old Man gave him medicine for the journey.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Skeletons tell him their place is not light, that they live poorly, and
    that he must go back because his flesh is still strong and he still eats food.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Skeletons instruct him to make nakwakwosis for them at the Soyal ceremony;
    they tie these around their foreheads, and the objects represent dropping rain.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Skeletons say they will send rain and crops, and they explain that women
    should be wrapped in 6wa with a big knotted belt when they die because rain drops
    through these when the Skeletons move through the sky as clouds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some Skeletons carry mealing stones by a thin forehead string that cuts into
    the skin, while others carry cactus bundles whose thorns hurt them; these are
    temporary punishments.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The young man sees good chiefs who had made a good road for others; they have
    set up their tiponis, and ceremonial smoke from villages goes down to the tiponis
    or mothers and rises as clouds.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After seeing the place, the young man returns to the steep bluff, mounts his
    kilt, and is lifted by a slight breeze; a Kwaniita chief with a horn head-dress
    tells him to return home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: As the young man nears his house, his covered body begins to move; when he
    enters it he comes to life again, and Badger Old Man wipes him, washes off his
    face paint, and discharms him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In his recounting, the young man says that after he died he traveled westward,
    met a woman in a brush enclosure who was also moving westward, passed through
    dense cactus and 6co cactus, and reached a steep bluff.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
