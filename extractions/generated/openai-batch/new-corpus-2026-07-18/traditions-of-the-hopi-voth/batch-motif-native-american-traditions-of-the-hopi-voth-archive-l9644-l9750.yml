canonical_text:
  quote: ''
  summary: 'The supplied passage contains the end of one Coyote and Balolookong tale,
    a related tale titled “Balolookongwulp and the Coyote,” and the beginning of “The
    Coyote and the Frog.” In the Coyote–serpent material, Coyote constructs an artificial
    long tail from cedar bark and yucca, uses it during a visit to fill a kiva, and
    the serpent friend burns the tail, causing fire to spread. The adjacent version
    differs in outcome: in one Coyote perishes in the Little Colorado River, while
    in the other he survives and becomes angry. In the Frog tale, Coyote visits Frog
    at Sun Spring; after Frog jumps into deep water and surfaces pregnant, Coyote
    pulls and throws him, causing Frog to burst with tadpoles and die.'
  language: English
  quote_policy: summarized
