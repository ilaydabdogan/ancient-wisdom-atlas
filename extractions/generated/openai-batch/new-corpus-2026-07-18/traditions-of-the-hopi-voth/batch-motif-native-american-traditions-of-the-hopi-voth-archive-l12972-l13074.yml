canonical_text:
  quote: ''
  summary: 'The passage describes the aftermath of an attack on Aoatovi, including
    disputes among Oraibi, Mishongnovi, and Walpi raiders over captive women and maidens,
    killings of some captives, and the incorporation of Aoatovi people into other
    villages and clans. It then begins another account of Aoatovi''s destruction:
    the Aoatovi chief''s son, rejected by the village maidens, is a hunter aided by
    a hawk; after a hunt he tells his father to seek help from another village, and
    the father asks that other villages be notified and Spanish pepper powder be brought
    for use when the people are in the kiva.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raiders left Aoatovi with selected prisoners, did not wait for Oraibi to select
    first, killed older women, and the Aoatovi chief and his son were destroyed with
    others in the kivas; the village itself was not destroyed at that point.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Skeleton Mound, the Oraibi complained that prisoners promised to them had
    been taken by Mishongnovi and Walpi.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mishongnovi and Walpi refused to give up the captured women and maidens, saying
    that because they had captured them, they belonged to them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Oraibi chief ordered contested captives killed so they would belong to
    nobody; many younger and prettier women and maidens were killed, while some captives
    were spared and taken to villages.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage explains the presence of Aoatovi people in Oraibi, Mishongnovi,
    and Walpi as resulting from captives taken after the destruction.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Oraibi, Sand, Rabbit, Coyote, and Butterfly clans are represented from
    the Aoatovi people, and the Aoatovi people introduced the Oaqol cult in Oraibi,
    Mishongnovi, and Walpi.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Soyal, these clans place bahos at a separate place at the edge of the mesa
    for their dead ancestors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the second account, the Aoatovi village chief has fine fields, two springs
    north of the village, and a son whom the maidens fear and refuse to marry.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The chief's son is described as a great hunter who leads a hunting expedition
    in which some maidens also participate.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The hunters form two parties that spread into a circle and kill many rabbits.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A large hawk also takes part in the hunt, swooping down on rabbits and killing
    them for the chief's son.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the hunt, the party drinks at a spring, eats peaches and watermelons
    near the mesa, and returns to Aoatovi.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: After supper, the chief's son tells his father he is unhappy and says their
    people will be happy only a short time longer; he tells his father to go to Toriva
    the next morning.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Aoatovi chief goes to llano or Toriva, tells its chief about his son's
