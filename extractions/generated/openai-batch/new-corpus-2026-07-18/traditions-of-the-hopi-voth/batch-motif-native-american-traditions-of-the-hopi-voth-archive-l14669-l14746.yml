canonical_text:
  quote: ''
  summary: 'The passage summarizes parts of three Hopi narratives: an Antelope maiden
    takes an elder brother and is later appeased through bahos and defeated in a race;
    Balolookong takes a maiden into a spring and is forced to release her after ritual
    action and offerings; Yellow Corn-Ear Maiden transforms her friend into a coyote,
    after which the transformed maiden wanders and is brought to Spider Woman by two
    Katcinas.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two sons of Zuni village chiefs race; an Antelope mana calls them at a bluff
    and draws the elder brother up by deep inhalation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger brother seeks help through Pookonghoya, Spider Woman, Mole, Storm,
    and the Snake people, receiving a baho to copy for the Antelope maiden.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the bluff, the rescuers show bahos, enter the maiden's house with Storm's
    aid, plant seeds in sand with bahos, and take part in a race following the sun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the race the young man mounts an eagle breath feather, the Antelope
    maiden becomes a swift snake, and Spider Woman uses a reed and strong inhalation
    to increase the young man's speed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After losing the race, the Antelope maiden draws the captive son from an inner
    room where many bones of young men are present.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Balolookong emerges at a spring, draws a maiden toward him by strong inhalations,
    embraces her, and disappears with her into the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The maiden's mother finds tracks descending to the water, along with the maiden's
    jug and an old blanket.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The maiden's father seeks help from Pookonghoya and his brother, and Spider
    Woman instructs the helpers while people make nakwakwosis.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the spring, the maiden's brother first fails to retrieve her because he
    cries, and Balolookong disappears with her again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: On a second attempt, the brother grasps the maiden and strikes Balolookong
    on the head with a club; the serpent releases her, leaving only a skin floating
    on the water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The rescuers put other clothes on the maiden, lay a red feather pihu on the
    path, and throw nakwakwosis into the spring as the price of the maiden and as
    prayer-offerings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Balolookong is said still to be seen by women, who become sick; he is now
    small.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Yellow Corn-Ear Maiden and her friend quarrel over a young man; Yellow Corn-Ear
    Maiden has supernatural powers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Yellow Corn-Ear Maiden throws a little colored wheel to her friend; when the
    friend catches it, it becomes heavy, throws her down, and she rises as a coyote.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The transformed coyote maiden cannot carry her jug, is driven away by village
    dogs, wanders westward, eats roasted corn-ears in a field shelter, and comes to
    a hut of two Qoqoqlom Katcinas.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The Qoqoqlom Katcinas notice the coyote sobbing and tearful, feed it, carry
    it to Spider Woman, and Spider Woman says it is not a coyote.
  category: sequence
  evidence_refs:
  - ev:9
