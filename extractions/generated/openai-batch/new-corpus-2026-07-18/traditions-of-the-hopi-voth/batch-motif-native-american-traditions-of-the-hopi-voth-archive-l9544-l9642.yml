canonical_text:
  quote: ''
  summary: A Snake or Water Serpent visits Coyote and occupies Coyote's kiva so that
    Coyote must remain outside in the cold. Coyote later retaliates by making a thick
    artificial extension to his tail and visiting the Water Serpent on a cold day,
    filling the kiva and forcing the Water Serpent outside. The Water Serpent burns
    Coyote's tail at the fireplace. Coyote mistakes the smoke and fire for grass fires
    set by the Hopi, flees west, jumps into the Little Colorado River, and drowns.
    The passage then begins another Coyote and Balolookong tale, locating the Oraibis,
    the Balolookong at Flute Spring, and Coyote nearby.
  language: English
  quote_policy: summarized
