  text: The Snake chief says the people are exhausted and their children are dying,
    and asks that someone go to the fathers at Ttivanashavi.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Sand Rattlesnake tries to travel through the snow but returns cold and
