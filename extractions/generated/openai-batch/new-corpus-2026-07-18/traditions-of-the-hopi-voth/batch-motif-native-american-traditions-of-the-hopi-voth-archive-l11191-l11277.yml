canonical_text:
  quote: ''
  summary: During an exceptionally snowy winter, the Snake people seek help from the
    Locusts living at Ttivanashavi, a warm snowless place. After two snake messengers
    fail, the Racer reaches the Locust kiva, is fed, and asks for aid. The Locusts
    promise to come in four days, make a clear path home by blowing a flute along
    his tracks, and later arrive with flute chirping, rabbit-skin costumes, song,
    dance, and rattles, causing the snow to melt and the kiva to become hot.
  language: English
  quote_policy: summarized
