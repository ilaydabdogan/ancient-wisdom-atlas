canonical_text:
  quote: ''
  summary: A maiden grinding corn is visited by a suitor with yellow bridal goods,
    which she refuses. Rooster and Mocking-bird, each appearing as a handsome youth,
    seek to marry her and agree to a contest over knowledge of light. Rooster journeys
    to hidden helper communities at Bow Mound and beyond Muenkapi, is fed corn, and
    receives support. The Roosters and Hens sing and crow through the night until
    dawn and sunrise.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mana is grinding cornmeal when an unnamed handsome youth comes to her and
    says he has come after her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first youth directs the maiden to a yellow reed receptacle containing
    two yellow bridal robes, yellow moccasins, and a yellow belt; she refuses the
    items and sends him away.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rooster visits in the evening appearing as a handsome youth, wearing a red
    patterned shirt, turquoise ear pendants, and red feathers on his head.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rooster sits by the fireplace and examines objects there; the maiden is pleased,
    converses with him, invites him to stay overnight, and tells him to return in
    four days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mocking-bird also appears as a handsome youth, asks the maiden to marry him,
    and receives her promise; her mother tells her not to mistrust him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rooster interrupts Mocking-bird at the maiden's house; the two dispute who
    is worth more and agree to a contest in three days, during which no one will get
    the maiden.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the dispute, Rooster says people rise when he crows in the morning, while
    Mocking-bird says it gets light when he twitters or sings in the morning.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Rooster travels northwest from Oraibi to Bow Mound, rests near a baho shrine,
    enters when an opening appears, and is hosted by maidens who feed him shelled
    corn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Rooster travels past Muenkapi, descends a ladder at a steep bluff, reaches
    a large rock with an opening, crows, and enters after a door is opened.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Inside the rock opening Rooster finds many men, women, youths, and maidens
    identified as Roosters and Hens; they feed him shelled corn and ask why he has
    come.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Rooster explains that he is contending over a maiden and over knowledge of
    light; the Roosters and Hens say Mocking-bird has the assistance of the Kwatokwuu
    but agree to try to help.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Roosters and Hens sing through the night, crow after groups of songs,
    and by the end of the sequence yellow dawn appears and the sun rises.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the singing and crowing, the chief says they have accomplished it correctly
    and tells Rooster to go home without fear; Rooster returns and is fed again at
    Bow Mound.
  category: speech
  evidence_refs:
  - ev:6
