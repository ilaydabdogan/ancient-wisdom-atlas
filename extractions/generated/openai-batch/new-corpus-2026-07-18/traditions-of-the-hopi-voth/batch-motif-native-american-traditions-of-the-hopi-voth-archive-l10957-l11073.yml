canonical_text:
  quote: ''
  summary: The passage concludes an etiological episode in which grasshoppers are
    released and scatter everywhere. It then tells of Coyote desiring three maidens,
    taking and wearing human/Katcina-like items under his grandmother's direction,
    being killed in a stone trap set by the maidens' father, and having his skin hung
    as a field-watching flag. A following episode begins with Coyote and other coyotes
    imitating Katcina dances by gathering costume materials, dressing as various Katcinas,
    assembling, and dancing while Oraibi hunters search for coyotes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Deer tells the Grasshoppers to go out wherever they think, saying nobody
    will hurt them now.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Grasshoppers' mother tells each one to go where he wants to go; they scatter
    and fly in all directions, which the passage gives as the reason grasshoppers
    are now found everywhere.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Three maidens have a father and mother, have a crop, live at Pifcatsva, and
    go from there to watch their crop.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Coyote living at Ishmovala has eaten watermelons but longs for the three
    maidens and wants them.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Coyote's grandmother says the maidens will probably not want him, but instructs
    him to enter the village through a window opening and take a bow, arrow quiver,
    red yarn, blue yarn, leggings, a blue shirt, and red stone ochre.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Coyote collects a broken bow, an arrow quiver, a shirt, leggings, blue yarn,
    and stone ochre; his grandmother dresses him, ties up his hair, and he paints
    his face with ochre like a Katcina before going to the maidens.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The maidens' father has set a stone trap east of Coyote's house with rabbit
    meat tied at the balance; Coyote takes hold of the meat with his teeth, the trap
    shuts, and he dies there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The maidens find Coyote caught in their father's trap, laugh when they see
    someone with an arrow quiver sticking out there, and tell their father something
    has been caught.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The father goes to the trap, pulls Coyote out, carries him to his field, skins
    him, and hangs his skin as a watching flag.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage names several Katcinas and their dwelling places, including Haaa,
    Hototo, Sohoncomtaka, Red Eagle or Palakway, and many Katcinas at Katcinvala.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: A Coyote and his wife live at Ishmovala; after seeing Katcinas come for dances
    and processions, Coyote says that they too are going to do that because people
    like to see it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Coyote stands on the roof of his kiva, calls his Coyote friends to assemble,
    and tells them they will have a Katcina dance and should gather feathers, pieces
    of skin, pieces of gourds, and especially long-necked gourd necks from around
    the village.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Coyotes bring the materials to Coyote's kiva, sew kilts, make feather
    bunches for head-dresses, and each prepares a costume of a Katcina he has seen.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The costumed Coyotes go to places associated with different Katcinas; the
    Haaa shouts four times, the groups join one another, and they go to Coyote's house
    to dance.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Oraibi conduct a Coyote hunt on the same day but find no Coyotes because
    the Coyotes are assembled at Ishmovala; while the Coyotes are dancing, the Oraibi
    come upon them.
  category: sequence
  evidence_refs:
  - ev:10
