canonical_text:
  quote: ''
  summary: At white dawn Katcinas return a maiden to her village, where her parents
    give prayer-offerings. The returned maiden later uses a small vessel given by
    Spider Woman at a spring; after the Yellow Corn-Ear maiden drinks from it, she
    is transformed into a bull snake. The passage explains bull snake behavior, the
    liberation of souls to the Skeleton House, and begins a separate account in which
    an Oraibi youth prays to the Sun to learn whether the dead live elsewhere.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At early white dawn, singing and dancing Katcinas draw the attention of early
    risers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: News spreads that the Katcinas have brought a maiden to the village; her parents
    initially disbelieve and require four messengers before going to the dancing plaza.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother cries and wants to take her daughter, but the daughter tells her
    father to bring two bahos and several nakwakwosis.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The father gives one baho to the Katcina leader and one to his daughter; after
    the dance, the daughter gives her baho to the singing leader, and the nakwakwosis
    are distributed among the other Katcinas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: After thanking the Katcinas for returning his child, the father and mother
    take their daughter home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The returned maiden rests for a day, then grinds corn and sings about her
    recent adventures; the Yellow Corn-Ear maiden visits her, and the returned maiden
    shows no ill-feeling according to Spider Woman's instructions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: At the same spring, the Yellow Corn-Ear maiden notices that her friend uses
    a peculiar little vessel given by Spider Woman and that water entering the jug
    shows rainbow colors.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Yellow Corn-Ear maiden asks to see the little cup; after both maidens
    drink from it, she immediately falls down and is turned into a bull snake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Blue Corn-Ear maiden tells the transformed maiden that she had tried to
    destroy her and must remain in that form because no one will restore her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The bull snake is described as capturing prey by charming and drawing it toward
    itself with powerful inhalations.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The maiden in bull snake form later goes to the village and is killed by her
    own parents, who do not know her identity; her soul is then liberated and goes
    to the Skeleton House.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Some sorcerers are said to leave their graves in the form of bull snakes;
    killing such a bull snake frees the sorcerer's soul to go to the Skeleton House.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: In Oraibi, a youth repeatedly sits at the edge of the mesa thinking about
    the graveyard and whether the buried dead live somewhere else.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The youth prays with corn meal to the Sun, asking whether the Sun has seen
    the buried dead; he continues this prayer for four days.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Sun comes to the youth, says that the dead are living, asks whether he
    wants to see them, gives him something, and instructs him to eat a little of it
    before sleep after telling his mother and household.
  category: speech
  evidence_refs:
  - ev:8
