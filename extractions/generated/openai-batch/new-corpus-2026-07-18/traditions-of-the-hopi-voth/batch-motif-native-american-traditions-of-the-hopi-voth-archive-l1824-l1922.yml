canonical_text:
  quote: ''
  summary: A chief's son from Tokoonavi travels in a closable box down the river to
    the ocean, reaches an island, meets Spider Woman, and receives guidance and medicine.
    With offerings and medicine he crosses a rainbow-like road over the water, appeases
    animal guardians, enters a water kiva, passes a tobacco-smoke test with Spider
    Woman's help, is accepted by the kiva people, and then sees them put on snake
    costumes and become snakes before he is told to choose one.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People at Tokoonavi are described as not yet Snake people and as living near
    the river bank north of the Grand Canyon.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief's son wonders where the Grand Canyon water goes and asks to examine
    it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The father permits the journey and instructs his son to make a box with closable
    openings and a long pole or similar implement.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The son takes bahos and food into the box and is pushed into the water, floating
    until he reaches the ocean and an island.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the island he finds Spider Woman's house, enlarges the entrance, enters,
    tells her a story, gives her a baho, and says he has come for beads and related
    items.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Spider Woman identifies a kiva out in the water containing beads and corals,
    warns of wild animals guarding the path, accompanies him because of his gift,
    gives him medicine, and sits behind his right ear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the young man spurts the medicine over the water, a road like a rainbow
    forms between Spider Woman's dwelling and the kiva.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The travelers encounter a panther, bear, wildcat, gray wolf, and large rattlesnake,
    each of which is quieted or appeased with a baho and medicine.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the kiva entrance is a bow standard; inside are many people in blue kilts,
    with faces painted with specular iron and many beads around their necks.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The kiva chief administers a tobacco-pipe test requiring the young man to
    smoke and swallow smoke; Spider Woman secretly removes the smoke, and the men
    accept him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young man gives red nakwakwosis and a green baho with red points, and
    the kiva people are pleased.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Snake-skin costumes hang on the kiva walls, and the men later put on snake
    costumes and become various snakes.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: Maidens in the kiva also put on snake costumes and become serpents; the chief
    tells the young man to select and take one of the snakes.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Spider Woman repeatedly instructs the young man not to be afraid during the
    snake-related tests.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
