canonical_text:
  quote: ''
  summary: The passage recounts two Coyote episodes. In the first, Coyote kills, bakes,
    and eats his own children while preserving their bones, then unsuccessfully tries
    to revive them by imitating a Turkey Woman's procedure. Angry, he pursues the
    Turkey mother and her children, but two strong Turkey men rescue the little Turkeys;
    Coyote returns hungry and dies. In the second, Chiros invite Coyote into their
    dance by giving him feathers, wings, and a tail. When they fly high, they reclaim
    the feathers, causing Coyote to fall to earth and die; they say his death is welcome
    because of his depredations.
  language: English
  quote_policy: summarized
