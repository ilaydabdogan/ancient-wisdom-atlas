canonical_text:
  quote: ''
  summary: The passage closes one tale in which two grandchildren prove themselves
    to their grandparents through a game and a guessing test, receive gifts, and attempt
    to bring their mothers back under a silence condition that is fatally broken.
    It then begins a new tale in which the poor youth Hiyonatitiwa, advised by his
    grandmother, approaches a maiden who has refused marriage offers while village
    youths watch.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two children tell an elder couple that someone fetched the couple's two daughters
    and that they are those daughters' children; the elder couple feeds them and the
    grandmother cries.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grandfather sets out a flat stone marked for a tukwnanawohpi game, sits
    opposite the boy, and the boy wins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The grandfather sets a death-stake guessing test about a wrapped object at
    the top of a ladder; the boy guesses that it is perhaps a little turtle, and the
    grandfather declares the children to be his grandchildren.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When told to kill the grandfather, the children refuse and instead ask for
    items; the boy receives clothing and weapons, the girl receives clothing, and
    they also receive clothing items for their mothers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The children say their mothers will come if the grandparents are willing and
    will not say anything.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The mothers and children come together, ascend and descend through the ladder
    and kiva spaces, and repeatedly call to the parents; when the grandmother finally
    responds, the two children and two mothers fall dead.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narration states that if the injunction had been heeded once more, then
    on the fourth time they all would have lived together happily; instead the grandparents
    have no children.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Oraibi, a maiden has refused marriage offers; Hiyonatitiwa lives at Acheemali
    with his grandmother, and both are described as poor and wearing patched blankets.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hiyonatitiwa tells his grandmother that he will go to the maiden and see whether
    she will marry him; the grandmother warns that his poverty may make him unacceptable
    but tells him to try.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: At twilight, village young men watch Hiyonatitiwa arrive, pass between them,
    and go to the maiden's upper-story window while she is grinding corn; they notice
    that she occasionally stops grinding and infer that she may be speaking with him.
  category: sequence
  evidence_refs:
  - ev:7
