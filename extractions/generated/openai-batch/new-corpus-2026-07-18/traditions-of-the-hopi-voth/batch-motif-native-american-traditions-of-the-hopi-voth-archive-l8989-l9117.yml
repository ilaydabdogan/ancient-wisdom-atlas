canonical_text:
  quote: ''
  summary: A child found in an owl cave is already developing owl features. The Owl
    permits the parents to take the child home but instructs them to keep the child
    locked in a room for four days and open it only at sunrise on the fourth day,
    when the child will become Hopi again. The mother opens early after peering through
    a cracked door; an owl rushes out and flies back to Bayupki. In the next tale,
    children at Mishongnovi hunt lizards while singing, and a Walpi man later observes
    little gray lizards making sounds and playing; the song becomes known as a Mishongnovi
    song. The final excerpt begins a tale in Oraibi involving a Rooster, a Mocking-bird,
    a beautiful maiden who refuses marriage, local suitors with gifts, and the northern
    chief Bamuyaomongwi bringing presents.
  language: English
  quote_policy: summarized
