canonical_text:
  quote: ''
  summary: The passage closes an episode in which the Pooktinghoyas/Pookongs kill
    and scalp a Cooyoko, return with goods, dance with the scalp, and receive balls
    and sticks from a village chief. It then narrates how a chief equips Pookong to
    kill a people-killing bear; Pookong kills the bear, makes a stuffed bear-skin
    likeness, scares his grandmother with it, and the bear no longer kills people.
    The final fragment begins another episode in which the Pookongs, living with Spider
    Woman, ask to attend a dance and are given food before leaving.
  language: English
  quote_policy: summarized
