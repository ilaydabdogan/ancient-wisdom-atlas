canonical_text:
  quote: ''
  summary: An injured man with a broken thigh is taken into a kiva-like space of small
    people and healed by Mice doctors, leaving two rabbits as payment. Old Man Badger,
    a paid doctor, becomes jealous and feigns illness to test the Mice doctors. The
    Mice come to his kiva, sing while circling, identify his fraud, and tell him that
    he is not sick and will recover by eating.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man reports that his thigh bone is broken; one of the small men carries
    him down a ladder and places him on the floor north of the fireplace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man has two rabbits that he killed while hunting, and he initially leaves
    them outside.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A north-side door in the kiva is opened, and the small people who seemed to
    be children are sent into another room while one fire caretaker remains with the
    sick man.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A large number of Mice enter, crowd around the patient, cover him, rub him,
    and work on and around him as doctors.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the Mice leave, the man finds that his leg has been made well; he leaves
    the two rabbits as remuneration and goes home.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: People in the village know his leg had been broken and are surprised to see
    him well; they ask who cured him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Old Man Badger, who lives north of the village, becomes jealous and angry
    after hearing about the cure; the healed man contrasts the Mice doctors with Badger,
    who asks for payment such as meat or cactus bulbs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Badger decides to feign sickness and call the Mice doctors in order to test
    whether they can identify his ailment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Badger lays out pelts, blankets, and a bowl, eats little, expectorates into
    the bowl, and appears tired after several days.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Badger sends a passerby to summon the Mice doctors, who agree to come; their
    chief leads them past the village toward Badger's dwelling.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Badger's dwelling is described as a kiva like Hopi kivas of the collector's
    present; Badger has hidden a stick under his bed, and the Mice bring no medicines.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Mice chief descends the ladder first and goes to the bed, followed by
    many companions who crowd around Badger while he groans as if near death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Mice doctor and companions sing while moving slowly in a circle; the song
    refers to Badger's burrow, Old Man Badger, doctor status, and fasting.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The narrator explains that the Mouse doctor sang to let Badger know that his
