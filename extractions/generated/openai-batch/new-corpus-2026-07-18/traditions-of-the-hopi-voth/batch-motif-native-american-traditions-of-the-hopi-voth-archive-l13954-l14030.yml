comparison_claims:
- id: claim:1
  claim: The passage explicitly connects Mocking-bird's songs in the emergence episode
    with songs still chanted at the Wuwuchim ceremony.
  claim_level: same_function
  target: Wuwuchim ceremony songs
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives only a brief statement of continuity and does not
    describe the ceremony or the songs in detail.
- id: claim:2
  claim: The repeated accounts in this passage support identifying a local pattern
    of upward emergence from below by means of a reed or plant-grown passage.
  claim_level: same_motif
  target: Hopi emergence-by-reed or emergence-by-plant pattern within this passage
  evidence_refs:
  - ev:4
  - ev:5
  - ev:9
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: This is an intra-passage comparison between related accounts, not a
