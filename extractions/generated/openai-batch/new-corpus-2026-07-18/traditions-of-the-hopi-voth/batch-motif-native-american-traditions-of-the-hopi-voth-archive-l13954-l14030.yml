- id: ev:8
  type: summary
  locator: lines 14005-14008
  quote_or_summary: In the second account, life below is first good, then chiefs and
    people do bad; sorcerers increase, people take chiefs' wives, and chiefs think
    of escaping.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 14008-14015
  quote_or_summary: Chiefs hear sounds above, make Pawaolcaya/Pawdokaya and sing it
    to life; a tree fails to reach up, a reed reaches up, and Pawdokaya ascends, finds
    an opening, and returns tired.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 14015-14021
  quote_or_summary: Tuhcha and Hawk ascend and return exhausted; Motsni then flies
    through the opening, finds the place where Oraibi now is, meets Skeleton, and
    returns with Skeleton's welcome.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 14021-14027
  quote_or_summary: People whose hearts are not very bad gather; after four days they
    climb the reed led by the Village Chief, who later pulls up the reed and tells
    them to live with a single heart.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 14027-14030
  quote_or_summary: The chief's son sickens and dies; the chief says Powaka has come
    with them, throws a meal ball upward, and it lands on a maiden whom he accuses.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 13982-13990
  quote_or_summary: With no sunshine, a distant light is investigated; a messenger
    finds a planted field with fire around it, sees the handsome man Skeleton and
    an ugly mask, and is fed and invited along with the people.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 13990-13998
  quote_or_summary: Because it is cold and sunless, the people make a white buffalo-hide
    moon disk with a woman image, throw it eastward into the sky, then make and throw
    a decorated sun symbol, after which the sun rises and it becomes warm and light.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: lines 13998-14003
  quote_or_summary: 'People decide to go toward sunrise but divide into parties: White
    People south, Hopi north, and Pueblos between; they become estranged and attack
    one another, with Castilians especially bad.'
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: lines 14003-14005
  quote_or_summary: The parties agree that when one reaches the place where the sun
    rises, stars will fall; a woman makes horses from scales rubbed from her body,
    her party arrives first, and many stars fall.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
