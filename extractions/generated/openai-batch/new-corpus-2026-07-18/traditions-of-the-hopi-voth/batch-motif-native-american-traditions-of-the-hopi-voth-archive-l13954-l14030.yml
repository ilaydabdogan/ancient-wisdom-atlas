candidate_motifs:
- id: motif:1
  label: Emergence from a lower world through an upper opening
  taxonomy_refs:
  - ascent
  basis: Both accounts describe people living below, scouts finding or seeking an
    opening above, and people ascending through it.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:8
  - ev:9
  - ev:11
  confidence: high
  cautions: The taxonomy label is broad; the passage presents an emergence narrative
    rather than a single individual ascent.
- id: motif:2
  label: Plant or reed as vertical passage between worlds
  taxonomy_refs:
  - sacred_tree_axis
  - ascent
  basis: Pines and a reed are planted to reach the opening; the reed becomes the successful
    route for ascent.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:9
  - ev:11
  confidence: high
  cautions: The available taxonomy has no separate reed-axis symbol; the sacred-tree-axis
    reference is approximate because the successful plant is often a reed rather than
    a tree.
- id: motif:3
  label: Destructive flood before emergence
  taxonomy_refs:
  - flood_and_renewal
  basis: One account says the chiefs cause a great flood and many people are destroyed
    before departure from below.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The flood appears in only the first account within this passage and is
    summarized briefly.
- id: motif:4
  label: Bird scout locates path to a new world
  taxonomy_refs:
  - departure
  - ascent
  basis: Bird figures are sent to seek an exit or upper place; Mocking-bird finds
    the exit in one account, and Motsni finds a place above in the second.
  evidence_refs:
  - ev:2
  - ev:10
  confidence: high
  cautions: The passage identifies several scout beings, not all of whom are successful.
- id: motif:5
  label: Allocation of languages and places after emergence
  taxonomy_refs: []
  basis: Mocking-bird assigns places and gives languages as people come out of the
