canonical_text:
  quote: ''
  summary: The passage gives two related accounts of people living below, becoming
    morally disordered, seeking an exit upward, and emerging through a plant or reed.
    Birds or made beings scout the opening; chiefs lead or organize the departure.
    A flood destroys many in one account. After emergence, incidents involve death,
    suspected witchcraft, the making of moon and sun symbols, the allocation of languages
    and directions, and later division among peoples. The second account repeats the
    search for an upper opening and the ascent by reed, with Skeleton encountered
    above and a chief warning people to live with a single heart.
  language: English
  quote_policy: summarized
