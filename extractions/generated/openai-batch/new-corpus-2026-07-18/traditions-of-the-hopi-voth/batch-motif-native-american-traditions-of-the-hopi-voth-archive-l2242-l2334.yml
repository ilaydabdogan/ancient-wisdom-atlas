canonical_text:
  quote: ''
  summary: The passage narrates disorder in the under-world, a search for an exit,
    ascent through an opening by means of a reed, distribution of languages, closure
    of the opening before all emerge, migrations of different peoples, explanations
    for horse use, death as return to the lower world, Coyote placing stars in the
    sky, Spider creating burros for White People, a southern star associated with
    livestock prayers, and the naming of several clans from successive encounters
    with a dead bear and signs around it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the under-world many people became bad, quarreled, killed people, and also
    killed the chief's son; the chief decided they would move away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief sent Mótsni to find a place of exit; Mótsni flew up, found an opening,
    and reported it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Village Chief and the Crier Chief planted a pine that grew quickly but
    did not reach the opening, then planted a reed that grew through the opening.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people climbed up the reed; the Horn people climbed first and held the
    protruding reed or ladder while many others followed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Mocking-bird sat outside and distributed languages to the people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: While climbing, one person dropped a moccasin; the passage gives this as the
    reason Hopi moccasins are now not very nice.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before all the people had emerged, the chief stopped them and closed the opening;
    one sorcerer had already come out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'After emergence, people started on different routes: the White Man took the
    most southern route, others took routes farther north, and the Hopi brought Muyingwu,
    whose body was made entirely of corn.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Hopi were to have the horse but could not ride it because they did not
    put a bridle on it; the Navaho, wearing a band around their heads, could ride
    it and bridled the pony.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After some travel, the chief's son became sick and died; the sorcerer said
    he was not truly dead and directed the chief to see him walking in the lower world.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The sorcerer said that thereafter no one would be really dead, but people
    who died would go back to the lower world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Coyote, traveling with the Hopi people and carrying stars in his hand, threw
    the stars into the sky, making the night somewhat light from then on.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The White People had taken Spider with them; Spider rubbed scales from her
    skin and created burros, which the White Men used to carry burdens.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: When the White People reached the place where the sun rises, a star arose
    in the south as a signal to other migrating people that someone had arrived there.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage says the southern star influences animals and that people wanting
    horses, cattle, sheep, and similar animals should pray to it.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: Successive migrating parties received clan names from encounters with a dead
    bear, straps cut from its skin, spider web on the cadaver, blue-birds on it, maggots
    eating out the eyes and leaving fat-lined cavities, and a mole digging beneath
    the place where it had lain.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The parties that received these clan names separated, wandered, and lived
    for varying periods in different places; the passage connects this with many ruins
    in the country.
  category: sequence
  evidence_refs:
  - ev:8
