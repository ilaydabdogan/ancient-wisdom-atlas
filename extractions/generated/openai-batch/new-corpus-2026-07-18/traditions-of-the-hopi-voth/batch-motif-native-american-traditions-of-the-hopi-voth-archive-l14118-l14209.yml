canonical_text:
  quote: ''
  summary: The passage summarizes Hopi traditions concerning a young man who follows
    the waters from north of the Grand Canyon, reaches Spider Woman, enters a guarded
    underwater kiva, is tested and initiated among snake people, visits Huruing Wuhti,
    violates a prohibition concerning a sack of toads and shells, and becomes connected
    with the origin of the Snake clan and Snake ceremony. It also summarizes a second
    account in which a young man travels by box down the Colorado River to Huruing
    Wuhti and sees the Sun’s ordered course, and a Bear Clan migration account explaining
    related clan names and cultic possessions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief's son wants to discover where running water goes and travels by boat
    with bahos and food until he reaches the ocean and an island.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spider Woman receives the young man, hears his story, accepts a baho, identifies
    a water kiva with beads and corals, and warns of animal guardians on the path.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Spider Woman gives medicine, sits behind the young man's right ear, and the
    pair cross water on a rainbow made by spurting medicine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Panther, bear, wildcat, gray wolf, and rattlesnake are encountered in succession
    and appeased with bahos and medicine.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The young man descends a ladder into a kiva where blue-kilted people with
    painted faces and bead necklaces sit silently.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: A chief smokes a large pipe four times, gives it to the young man, and tells
    him to smoke and swallow the smoke; Spider Woman prevents him from becoming dizzy
    by drawing the smoke from him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The kiva people turn into snakes when the young man looks away; the chief
    instructs him to select a snake, and a beautiful maiden appears as an angry large
    snake.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: With medicine from Snake Woman, the young man makes the fierce snake docile,
    takes it, and strokes it four times; afterward the snakes resume human form and
    regard him as initiated.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The young man says he has come because of running water and wants beads from
    Huruing Wuhti; later the chief instructs him about the Snake cult.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Spider Woman makes a rainbow road to the bluff where Huruing Wuhti lives.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Huruing Wuhti appears as an old hag by day and a pretty maiden at sundown;
    the young man stays with her four days and nights.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: Huruing Wuhti, identified as deity of hard substances, gives the young man
    toads and tells him not to open the sack on the way home; if he obeys they will
    increase, and if not they will be gone.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Snake chief gives the young man a maiden as wife and warns him not to
    touch her on the journey home or she and the toads will disappear.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: The young man opens the sack despite his wife's remonstrance, and by morning
    all toads except those given by Huruing Wuhti have disappeared.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: The woman bears many Snake children who play with Hopi children but sometimes
    bite them; the husband takes the children back to the wife's home.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The Snake man and wife travel southeast to Walpi, are admitted by the chief
    to assist in ceremonies, and later have human children whose descendants are the
    Snake clan.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: A Snake chief sends a nephew to hunt snakes, and the first ceremony is celebrated.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: In a second account, old men of the Pihfeash and Kokop clans wonder where
    the Colorado River flows and send a young man downstream in a provisioned box
    with four bahos.
  category: action
  evidence_refs:
  - ev:18
- id: obs:19
  text: Huruing Wuhti calls the young man four times and brings him to her house by
    a road on the water made from a corn-meal ball.
  category: action
  evidence_refs:
  - ev:19
- id: obs:20
  text: The Sun arrives seated on a disk attached to a pole, dressed like a Katcina,
    sorts offered bahos during his course around the earth, discards those of bad
    people, bathes, eats, and continues his route through houses under the earth and
    in the east.
  category: sequence
  evidence_refs:
  - ev:20
- id: obs:21
  text: The passage explains that bahos offered to the Sun are carried eastward to
    Sun shrines and that Flutes of the Sun Clan play so that the Sun rises.
  category: speech
  evidence_refs:
  - ev:21
- id: obs:22
  text: The Bear people leave sipahpuvi, separate from others, migrate through several
    places to the Little Colorado River, and take clan names from encounters with
    a dead bear and creatures associated with it.
  category: sequence
  evidence_refs:
  - ev:22
- id: obs:23
  text: 'Seven clans are described as related through the dead bear episode: Bear,
    Piqrisha, Mtiyi, Blue-bird, Spider, Jug, and Ant.'
  category: relationship
  evidence_refs:
  - ev:23
- id: obs:24
  text: The Bear clan later moves to the site of Shongopavi, is first to arrive there,
    and brings the Blue Flute cult and various Katcinas.
  category: sequence
  evidence_refs:
  - ev:24
