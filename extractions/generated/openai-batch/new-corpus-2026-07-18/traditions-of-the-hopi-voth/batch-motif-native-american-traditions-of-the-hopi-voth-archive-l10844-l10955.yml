canonical_text:
  quote: ''
  summary: The passage contains the end of one Coyote episode and the full tale titled
    “The Coyote and the Grasshopper.” In the first episode, Coyote demands a song
    from a bereaved Grasshopper mother, forgets the song after stumbling, bites a
    grasshopper-shaped stone left in her place, breaks his teeth, and dies hungry.
    In the second tale, Grasshopper Old Man tricks Coyote at a field booth, sends
    his family to Deer for protection, and Coyote is killed by Deer after descending
    into a kiva to seize them.
  language: English
  quote_policy: summarized
