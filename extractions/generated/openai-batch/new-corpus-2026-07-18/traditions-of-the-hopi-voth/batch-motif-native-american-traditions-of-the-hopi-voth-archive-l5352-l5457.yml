canonical_text:
  quote: ''
  summary: A young man seeks to recover his elder brother, who was drawn up by a beautiful
    maiden. Guided by Mole, Storm, and the Snake people of Walpi, he learns that the
    maiden wants bahos rather than beads. A rescue party brings bahos to the maiden’s
    house. After a sand-and-seed game and a race around the sun, aided by Spider Woman,
    the young man wins; the maiden releases the elder brother, and the narrative explains
    that the Antelope Maiden had killed young men because her bahos had been neglected.
  language: English
  quote_policy: summarized
