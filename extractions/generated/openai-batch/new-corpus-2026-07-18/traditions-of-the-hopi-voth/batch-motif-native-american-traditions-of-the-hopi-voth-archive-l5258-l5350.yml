canonical_text:
  quote: ''
  summary: 'The passage first describes Pdokong''s father-in-law worrying over an
    unweeded, drying corn-field. Spider Woman asks the clouds to hoe the field, and
    rain and runoff cover the weeds. Pdokong''s wife later bears a son who kills Oraibi
    children with bow and arrows, causing Pdokong to leave with him. A new tale begins
    at Zuni: two sons of a chief race near a dangerous bluff, where an Antelope Maiden
    draws the elder brother up with her breath and refuses beads as ransom. The younger
    brother is sent with gifts to the Pookonghoyas, who direct him to Mole.'
  language: English
  quote_policy: summarized
