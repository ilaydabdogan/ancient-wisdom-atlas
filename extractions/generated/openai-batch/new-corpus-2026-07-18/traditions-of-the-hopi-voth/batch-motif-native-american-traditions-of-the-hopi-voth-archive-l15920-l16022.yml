canonical_text:
  quote: ''
  summary: 'The passage contains brief synopses of several Hopi animal and spirit
    tales: Coyote imitates a Katcina dance and his costumed followers are killed;
    Coyote shares prey with other coyotes; a bull-snake eats wren young and then the
    parent bird; snake people seek help from locust people during deep snow, and locust
    flute ceremony brings warmth and meltwater; Squirrel and Chipmunk steal peaches;
    Fox wins a sunrise song wager against Cooyoko; gray and brown mice quarrel over
    food; and a partial tale describes small underground people healing an injured
    hunter while Badger becomes jealous.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote sees Katcinas dancing, calls other Coyotes, has them bring feathers,
    and prepares Katcina costumes in his kiva.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Oraibi close in while the Coyotes are dancing; the costumes keep the Coyotes
    from running fast, and all are killed except Coyote and his family, who did not
    put on costume or mask.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Coyote kills a rabbit, calls different colored Coyotes from different quarters,
    and they all tear and quickly eat the rabbit together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage explains Coyote's shared eating of prey as the reason Coyote never
    eats prey alone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A bull-snake climbs to a wren nest after repeated attempts, enters the nest,
    devours four young birds, and remains in the nest four days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bull-snake draws the old bird nearer by strong inhalations and finally
    devours it near the snake's mouth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Rattlesnakes have a kiva; in summer they run about as rattlesnakes, but in
    winter they are Hopi with their snake skins hanging on pegs in the kiva.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: During a severe winter many Hopi freeze, while the locusts' place at Tuvanashavi
    has no snow nearby and is warm with grass and flowers.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The snake chief sends messengers to the locusts; Racer reaches the locust
    kiva, receives food, explains that children are dying of cold, and asks the locusts
    to assemble with the snakes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Locusts play or chirp through flutes; their action opens a path, brings warmth,
    and causes snow to melt before they reach the snake kiva.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:11
  text: When the locusts enter the snake kiva in Hopi form and dressed in rabbit skins,
    the kiva grows warmer and the snake people perspire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Squirrel and Chipmunk repeatedly go to an old man's orchard, steal peaches,
