candidate_motifs:
- id: motif:1
  label: Fatal imitation of sacred dance costume
  taxonomy_refs:
  - trickster_boundary
  basis: Coyote organizes an imitation Katcina dance; the costumed Coyotes are unable
    to flee and are killed, while Coyote's unmasked family survives.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy reference depends on reading Coyote's imitation of Katcina
    dance as boundary-crossing; the passage itself is a compressed synopsis.
- id: motif:2
  label: Etiology of communal prey eating
  taxonomy_refs: []
  basis: Coyote calls others to share a rabbit, and the passage explicitly states
    this is why Coyote never eats prey alone.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No supplied motif-family taxonomy directly names etiological animal behavior.
- id: motif:3
  label: Serpent predator draws victim by breath
  taxonomy_refs:
  - serpent
  basis: The bull-snake eats the wren young and then uses strong inhalations to draw
    the old bird toward its mouth before devouring it.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage describes the action literally; any broader interpretation
    of the inhalation as magic or charm should be reviewed.
- id: motif:4
  label: Seasonal animal-human transformation
  taxonomy_refs:
  - shapeshifter
  - seasonal_cycle
  basis: Rattlesnakes are described as rattlesnakes in summer but Hopi in winter,
    with their snake skins hanging on kiva pegs.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The tale is summarized; details of the transformation process are not
