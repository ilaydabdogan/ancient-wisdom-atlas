canonical_text:
  quote: ''
  summary: A selected group of chiefs and people leave the lower world by climbing
    a reed, but the ascent is stopped when others crowd toward it. At the rim of the
    opening they are instructed to live with a single heart and heed Motsni. A chief’s
    child dies; a meal ball identifies a maiden called a Powaka, who explains that
    the child is below and that the dead will remain there four days and return. Pookong
    observes cold and darkness, after which Spider Woman and the Flute priest ritually
    make the moon and sun from circular disks. The chiefs then make plants and prepare
    to scatter out.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
