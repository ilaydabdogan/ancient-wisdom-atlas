    secretly and prepare to leave after four days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chiefs climb a reed first, followed by many people who go out from the
    lower world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: People below crowd toward the trees; the Kik-mongwi calls for the ascent to
    stop, says some Popwaktu may come up, and pulls up the reed so that many people
    drop back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those who have come out gather at the rim or edge of the opening, where the
    Kik-mongwi tells them to live with a single heart, stop living with bad hearts,
    and listen to Motsni.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The child of a chief, a small boy, becomes sick and dies; the chief says that
    a Powaka has come out with them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The chief makes a ball of fine meal and throws it upward; it lands on a maiden’s
    head, and he seizes her and accuses her of causing his child’s death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The maiden asks not to be thrown down and tells the chief to look below, where
    he sees his child running around with others.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The maiden says that when someone dies, that person will go down there, remain
    four days, and then come back to live with the people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The chief permits the maiden to remain near the opening but tells her to follow
    after the first day when the group has left.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Pookong looks around and finds that one side is always cold while it is still
    dark.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Spider Woman cuts a large round piece from white native cloth, makes a drawing
    on it with assistance from the Flute priest, and after songs are sung she takes
    it east; the moon rises there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Spider Woman and the Flute priest cut a circular piece of buckskin, make a
    sun-symbol drawing on it, sing over it, and Spider Woman takes it away; the sun
    rises and it becomes light and warm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Egg yolks rubbed on the sun symbol are given as the reason for the sun’s brightness
