canonical_text:
  quote: ''
  summary: 'At Palatkwapi, young men mistreat others, including an old Batki man who
    complains to the chiefs. The village chief decides they should move away. The
    chief and his son, both called sorcerers, prepare a masked nocturnal performance:
    the father equips the son with four masks, corpse-finger wrist rattles, and a
    cedar-bark fuse, then sends him to set pine timber on fire. The son returns as
    a ghost-like figure, grinds corn and sings in the chief''s house, and repeatedly
    escapes watchers while setting more fires. On the fourth night, a weakly orphan
    watcher near the water catches him; the people bring him to a kiva and see a Yaliponcha/Yahponcha
    figure, fulfilling the father''s prediction of capture.'
  language: English
  quote_policy: summarized
