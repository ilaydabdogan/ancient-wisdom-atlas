canonical_text:
  quote: ''
  summary: 'Walpi/Katcina visitors come to Oraibi for racing contests. The Oraibi
    know of their approach, race them, win their gifts, and exhaust them in a second
    large circular race around the mesa. The Walpi return discouraged and decide not
    to race the Oraibi again. A new account begins: the Navaho have raided other villages,
    while Oraibi remains vigilant with bows and arrows; a dust cloud from the northeast
    signals an approaching Navaho expedition.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Orafbi/Oraibi group assembled north of the village and practiced races
    for four days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the fifth day the Walpi visitors arrived at the spring Keqochmovi and dressed
    there so that the Oraibi would not discover them quickly, although the Oraibi
    had already noticed them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two of the Katcinas were Koyemsis who carried gifts, including comfviki and
    roasted sweet corn ears.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: An older Oraibi man asked the arrivals why they had come, and the Koyemsis
    answered that they came to contend with the village young men in a race.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Many Oraibi young men raced with the Katcinas; the Katcinas became tired and
    did not catch or strike any Oraibi racer with their yucca leaf whips.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The Oraibi won all the presents from the Katcinas, and the man who had received
    them gave them some prayer-meal before they returned to the Katcina house and
    removed their costumes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Walpi and Oraibi held a second race west and around the mesa in a large
    circle; the Walpi again failed to overtake the Oraibi, became exhausted, and gave
    up near Keqochmovi.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The Walpi returned slowly and quietly to Walpi, saying that the Oraibi were
    very strong and agreeing not to race with them again.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the following account, the Navaho are said to have repeatedly raided other
    villages, while the Oraibi kept bows, quivers, and arrows ready and practiced
    shooting.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A dust cloud in a wooded canyon to the northeast was reported to Oraibi men
    practicing at the foot of the mesa; the men gathered their weapons and hurried
    to the village, where people watched from the roofs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The approaching dust cloud became understood as a Navaho expedition against
    Oraibi.
  category: sequence
  evidence_refs:
  - ev:6
