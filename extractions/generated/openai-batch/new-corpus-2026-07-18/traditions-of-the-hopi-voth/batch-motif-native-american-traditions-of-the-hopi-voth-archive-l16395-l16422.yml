canonical_text:
  quote: ''
  summary: The passage recounts Spaniards entering Oraibi/Orafbi, making peace with
    the Hopi, receiving permission to live there, and building mission structures
    with Hopi assistance. Priests baptize Hopi people, bring goods, require labor,
    introduce cattle, and later forbid Katcina dances and bahos. After drought and
    increasing oppression, Hopi leaders decide to remove the remaining priest; the
    Badger clan kills him. Other villages do the same to their padres, and the Hopi
    dismantle Spanish houses, reuse timbers for kivas, and retain some bells.
  language: English
  quote_policy: summarized
