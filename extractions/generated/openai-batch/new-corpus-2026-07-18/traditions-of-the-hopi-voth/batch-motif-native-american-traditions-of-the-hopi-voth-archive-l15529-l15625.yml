canonical_text:
  quote: ''
  summary: The passage gives several Hopi Coyote tale summaries. In the Water Serpent/Balolokong/Lolookong
    variants, Coyote and a long water serpent visit each other’s kivas; Coyote makes
    an artificial tail to imitate or outdo the serpent, and the serpent burns the
    tail, in some variants causing Coyote to flee to the Little Colorado River and
    drown. Another tale has Coyote mishandle a pregnant Frog, whose body bursts and
    releases tadpoles, after which Coyote is killed by hail. Another has Bat steal
    food, lie about its source, and be song-tied by Coyote and Humming-bird, ending
    their friendship. A final summary describes reciprocal pranks between Coyote and
    Humming-bird involving a protruding bill and snout mistaken for objects.
  language: English
  quote_policy: summarized
