canonical_text:
  quote: ''
  summary: 'The passage first tells why ants are thin: Ants hold a Katcina initiation,
    prepare a kiva and sand picture, bring in Ant children, summon Katcinas, and the
    children are flogged so hard that their bodies are nearly cut through the middle.
    The passage then tells of Ldvovolvipiki and Ndnvovolpiki, two friends associated
    with seed-food balls, who arrange a Paiute dance with Mice maidens and a borrowed
    drum. During the dance the Prtokongs arrive while hunting, kill two Mice, and
    devour Ndnvovolpiki and Ldvovolvipiki.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A large community of Ants lives east of Tc6ok£vii, and the chief of the Ants
    announces that they will hold a Katcina initiation in four days.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the fourth day two Ants dress as Hn Katcinas, one as Angwushnacomtaka,
    at Korftvi; other Ants make a sand picture on the kiva floor and bring Ant children
    into the kiva for initiation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the children are inside, the Katcina priest of the Ants relates the
    story, four little K6yemsis perform, and an Ant outside signals for the Katcinas
    by swinging one fore-foot.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Katcinas run to the kiva, circle it several times, enter, stand opposite
    the sand picture, and flog the little Ant children.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The flogging nearly cuts the Ant children through the middle of their bodies,
    and the tale gives this as the reason ants are now thin in the middle.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ldvovolvipiki lives at Lakokpi near Oraibi and is named in connection with
    small food balls prepared from meal of a grass seed.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ndnvovolpiki lives west or southwest of the Oraibi mesa at a place where nãno
    grows and is named in connection with little food balls made from nãno seed meal.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ldvovolvipiki and Ndnvovolpiki are friends; they decide to hold a Paiute dance,
    with Ldvovolvipiki to fetch the Mice maidens and Ndnvovolpiki to borrow a drum
    from the Kwan kiva.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ndnvovolpiki borrows a drum from the Kwdkwantus at the Kwan kiva and returns
    to Ldvovolvipiki, where the Mice maidens are already assembled.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dancers practice songs and dances through the night; in the morning each
    maiden receives an eagle feather tied to her head as a nakwa and puts a red dot
    on each cheek before dancing and singing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Prtokongs, named as Pook6nghoya and Bdldongawhoya, arrive while hunting;
    each shoots and kills one of the Mice and comments on the spotted marks on their
    cheeks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Pook6nghoya devours Ndnvovolpiki, and his younger brother devours Ldvovolvipiki;
    this ends the dance.
  category: action
  evidence_refs:
  - ev:7
