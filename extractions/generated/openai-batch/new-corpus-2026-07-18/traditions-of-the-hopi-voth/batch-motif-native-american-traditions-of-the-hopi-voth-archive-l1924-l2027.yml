canonical_text:
  quote: ''
  summary: A young man, aided by Spider Woman, captures and pacifies a snake-transformed
    maiden, is accepted by the Snake people, receives ritual instruction, journeys
    to Huruing Wuhti by a rainbow road, exchanges bahos for beads, receives prohibitions
    concerning the beads and his wife, and returns with a wife and a sack whose beads
    increase while the prohibitions are observed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prettiest maiden has become a large yellow rattlesnake and is especially
    angry.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spider Woman tells the young man which snake is the maiden, tells him not
    to fear, and gives him medicine.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man chews the medicine, spurts it on the fierce snake, grabs it,
    strokes it four times upward, and the snake becomes docile.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the young man captures the snake, the snakes resume the forms of men
    and women, including the captured maiden.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Snake people treat the young man kindly and consider him initiated and
    one of them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The captured mana brings food from another room in the kiva, and the young
    man secretly gives some to Spider Woman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The young man says he seeks a good life, Hopi food, and beads from Huruing
    Wuhti, and he says he has bahos for her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Spider Woman has a food source that never gives out, but the young man returns
    to the Snake kiva.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Snake chief welcomes the young man as brother and son-in-law and instructs
    him all night about the Snake cult, altar, and future ceremonial practice.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Spider Woman makes a rainbow road into the ocean to a high bluff where Huruing
    Wuhti lives, and they ascend by a ladder.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Huruing Wuhti first appears as an old hag in a place whose walls have many
    beads and shells.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The young man gives Huruing Wuhti the bahos, and she thanks him faintly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: At sundown Huruing Wuhti goes into a side chamber and returns as a very pretty
    maiden with buffalo and wildcat robes, feeds the young man, and invites him to
    sleep with her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Spider Woman advises the young man to comply with Huruing Wuhti so that he
    will win her favor and obtain the beads.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: In the morning the young man finds an old hag beside him; the transformation
    pattern repeats, and after this Huruing Wuhti remains a pretty maiden.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The young man remains four days and nights with Huruing Wuhti, who is identified
    in the passage as the deity of hard substances.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: Huruing Wuhti obtains beads from rooms to the north, west, south, and east,
    including turquoise, a reddish bead, and a hard white shell bead.
  category: object
  evidence_refs:
  - ev:7
- id: obs:18
  text: Huruing Wuhti gives the young man beads and warns him not to open the sack
    because the beads will vanish if he opens it and increase if he does not.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:19
  text: After the young man returns to the Snake kiva and stays four days and nights,
    the chief tells him to take the mana, food, and the ceremonies home.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:20
  text: The Snake chief says the woman will bear children and that they will hold
    the ceremony for the young man.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:21
  text: Spider Woman forbids the young man to touch his wife on the journey, warning
    that his beads and wife would disappear if he did.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:22
  text: During the return journey the couple sleeps separately, and the beads and
    shells increase night by night until the sack becomes very heavy and nearly full.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:23
  text: Spider Woman has placed strings in the bag, and the increasing beads become
    strung on the strings.
  category: object
  evidence_refs:
  - ev:10
