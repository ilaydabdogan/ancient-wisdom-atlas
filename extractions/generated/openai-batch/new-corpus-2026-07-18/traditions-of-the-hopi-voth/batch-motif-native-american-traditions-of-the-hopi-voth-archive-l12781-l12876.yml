canonical_text:
  quote: ''
  summary: Pursuers from Aoatovi kill three fleeing Katcinas before a wash boundary;
    the remaining Katcina crosses the wash after removing and hanging up his mask
    and is spared. The Aoatovi chief then seeks to have his own village destroyed,
    first asking the Shongopavi chief, who refuses, and then the Oraibi chief, who
    agrees. The Aoatovi chief offers two clay figures representing the males and females
    of his village; Oraibi selects the female figure, and preparations are set for
    an attack on the fifth day.
  language: English
  quote_policy: summarized
