canonical_text:
  quote: ''
  summary: The passage ends one tale in which Piwftamni obtains a wife, remains poor,
    and then defeats rival men in a wealth contest through goods supplied by his grandmother.
    It then begins a tale about an Oraibi youth and a maiden who play hide-and-seek
    in fields; the maiden hides in plants and a watermelon, the Sun hides the youth
    after a rainbow ascent, the maiden detects him through milk drops, and the youth
    enters Spider Woman's small house where she covers the entrance with a web.
  language: English
  quote_policy: summarized
