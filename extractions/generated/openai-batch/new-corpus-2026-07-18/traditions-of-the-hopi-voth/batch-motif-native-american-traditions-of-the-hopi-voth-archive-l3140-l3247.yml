canonical_text:
  quote: ''
  summary: Cotukvnangi, the God of Thunder, descends from the sky to aid two famished
    brothers with water and food. Appearing first in an alarming ice-covered mask
    and then as a handsome man, he feeds them, instructs them how to rejoin their
    people, returns later with more provisions, and teaches them war practices, battle
    songs, and scalp-related kiva rites. He promises them lightning and thunder when
    they pray for them. The brothers travel to Homolovi, where their mother at first
    does not recognize them but then accepts them after they identify themselves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cotukvnangi is identified as the God of Thunder, lives in the sky, sees the
    children, takes pity on them, and decides to descend to help them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cotukvnangi brings a gourd vessel full of water and rolls of nuvë-muhpi to
    the sleeping children, whose mouths are dry and parched.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The younger brother wakes and sees a frightening personage with three long
    ice horns or projections, an ice costume with rattling icicles, and ice ridges
    representing clouds on the head.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The children are frightened and embrace each other; Cotukvnangi removes his
    mask, appears as a handsome man, tells them not to cry, and gives them water and
    food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cotukvnangi tells the children to remain where they are for two or three days
    until strong, then follow their people east; he then rises and disappears into
    the sky.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cotukvnangi returns the following day with more food, watermelons, and drinking
    water, remains with the children, and talks to them through the night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cotukvnangi is called the great warrior chief and teaches the two youths about
    lightning, thunder, killing enemies, taking scalps, and songs for returning from
    war expeditions.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Cotukvnangi instructs that scalps should be thrown into a kiva on a cloud
    symbol made with corn-meal, and that a scalp-taking warrior should sit on a round
    bear skin for three days and nights before head-washing rites and a plaza dance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Cotukvnangi tells the youths to follow their people and says their parents
    may not know them; he later returns to the sky.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The lightning arrow and thunder are said to have been promised but not yet
    delivered; the brothers are told to pray to Cotukvnangi when they need them.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The brothers travel to Homolovi, find two small villages, and locate their
    mother in the northern smaller village; the older brother carries the tired younger
    brother.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The people ask whose children the boys are; the mother initially denies that
    they are hers, and no one claims them.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The boys recognize their mother, take her hands, and identify themselves;
    she remembers leaving them sleeping when the people fled, embraces them, and cries.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The smaller village is identified with the Batki-namu, and the larger village
    with people who later mostly constituted the Forehead clan.
  category: relationship
  evidence_refs:
  - ev:10
