canonical_text:
  quote: ''
  summary: 'The passage contains compressed summaries of several Hopi traditions:
    a fragment about Orafbi casualties and a dog engraving on a rock; a Katcina race
    contest between Walpi and Orafbi; a major fight involving Hopi, Navaho, and disguised
    Walpi; an Oraibi raid on a Navaho Katcina dance after a falling star; and a raid
    that leads inhabitants of two villages to relocate to Orafbi.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fragment reports that many Orafbi flee and are killed, and that a dog is
    engraved on a rock because of what the dog did in that battle.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Walpi people plan to race Orafbi; an Orafbi youth visiting Walpi hears of
    the plan, returns, and Orafbi young men practice running for four days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Katcina race, Orafbi youths race the Katcinas, the Katcinas tire, and
    the Orafbi youths win all the presents.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When news of a Navaho expedition reaches Orafbi, councils are held, warriors
    are encouraged, and some Hopi go to the Navaho with presents after being weakened
    by blood-letting near the ankle so they can be recognized.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before sunrise the Navaho ascend the mesa; Hopi warriors use buckskins, society
    head-dresses, war rites, and powdered war god vomisis stone before battle begins.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Navaho woman on a pony takes a lance from a warrior and rides toward the
    Hopi, after which the Navaho break the Hopi line and surround divided Hopi parties.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Several Hopi escape or hide among rocks, including six who hide in a stone
    enclosure and one who later hides under a rock after jumping down a steep place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hopi discover that some people among the Navaho are Hopi from Walpi disguised
    as Navaho; a brave Hopi warrior addresses them, is surrounded, overpowered, killed,
    and has his heart torn out.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Navaho enter the village, drive out sheep, shell and load corn on ponies,
    and leave with sheep, dead, and wounded; wounded Hopi later return and are attended
    in the home of the Coyote Clan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: During the fifth dance of a Navaho Katcina dance in a deep canyon, a star
    falls in front of the head dancer; the Navaho scatter, Oraibi arrive to raid,
    and later Navaho dances have watchers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Inhabitants of two northeastern villages are harassed by Utes or enemies;
    after an attack and capture of women and maidens, the people pack their belongings,
    go to Orafbi, are admitted, and continue living there.
  category: sequence
  evidence_refs:
  - ev:7
