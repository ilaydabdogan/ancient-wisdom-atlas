canonical_text:
  quote: ''
  summary: After a disrupted chase and mourning, the chief of Aoatovi conceals anger
    over his daughter's death and secretly visits the chief of Shongopavi. In night
    councils marked by fire and pipe-smoking, he says his people have bad hearts,
    declares that his village should be reduced to sand, and asks that Shongopavi
    runners prepare for a Katcina race. Four young men dressed as Katcinas later come
    to Aoatovi with sweet corn presents. During the race, the Hdmsona Katcina is outrun,
    kills the winning Aoatovi young man with a knife, and signals the other Katcinas
    to flee without receiving prayer-offerings. Aoatovi men and youths discover the
    killing, arm themselves, and pursue the fleeing Katcinas.
  language: English
  quote_policy: summarized
