canonical_text:
  quote: ''
  summary: An Aodtovi chief's request that his village be destroyed is relayed by
    the Orafbi chief, who mobilizes neighboring villages. The Shongopavi chief refuses
    participation, while other groups assemble near Aodtovi at night. The Aodtovi
    chief and his wife feed the raiders and the chief gives a dawn attack plan involving
    a signal from his son. The passage says the chief, a powdka, had bewitched his
    son and others. At the signal, raiders trap unarmed men in kivas, use arrows,
    fire, and pepper smoke, and many men smother. Younger women and maidens are then
    taken from houses.
  language: English
  quote_policy: summarized
