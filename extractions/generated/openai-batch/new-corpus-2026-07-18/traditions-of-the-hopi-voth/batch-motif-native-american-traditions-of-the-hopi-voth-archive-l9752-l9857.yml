canonical_text:
  quote: ''
  summary: The passage first closes a Coyote episode in which people pursue Coyote
    during a rain and hail storm; his hole is full of water and hail kills him. It
    then begins a tale of Coyote, Bat, and Humming-bird as friends. Bat steals food
    from Oraibi at night to host the others, falsely says Badger gave it to him, and
    is answered by a satirical song made by Coyote and Humming-bird.
  language: English
