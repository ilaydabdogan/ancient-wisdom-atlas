canonical_text:
  quote: '"You are bad, and this shall be your punishment. You shall be ridiculed
    by the people."'
  summary: A confrontation in a kiva turns into a contest of powers involving arrows,
    shields, bees, and lightning. C6tukvnangwuu destroys and later restores the sorcerers
    with mismatched body parts as punishment. The young man's sister is found in the
    sky, returned by Hawk, periodically revisits the chiefs above, dies, and is buried
    according to special instructions.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The young man says he saw the old man take out his sister's body and followed
    him to the kiva where singing was being performed over the body.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man proposes that the opposing sides measure themselves to see who
    is stronger and braver.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the fire is extinguished, the warriors hold shields while the sorcerers
    shoot small dangerous arrows at them; when the fire is rekindled, the warriors
    are still alive.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The war chief releases live bees from a sack; the bees sting the sorcerers,
    their wives, and their children until the old man begs him to stop, after which
    the bees are recalled.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: C6tukvnangwuu throws a ray of lightning among the opponents, filling the kiva
    with bright light and tearing them to pieces.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The old warrior says the destroyed enemies are dangerous and bad, and that
    they took away and ill treated the young man's sister.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: C6tukvnangwuu ascends to the sky, finds the maiden there, and Hawk later carries
    her down to earth near Orafbi.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The maiden tells her parents that she had died, that chiefs from above rescued
    her, and that her body should not be wrapped or tied when she dies.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The maiden repeatedly disappears and returns after four, six, and ten days
    before finally failing to wake one morning.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Her body is treated like an eagle body at burial, with nakwakwosis tied to
    her hands and legs and laid on her breast, and her grave remains undisturbed after
    four days of watching.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: C6tukvnangwuu restores the destroyed sorcerers but mixes the body parts of
    different individuals as punishment, leaving them to be ridiculed.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
