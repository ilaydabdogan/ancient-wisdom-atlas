canonical_text:
  quote: "“as the young man was a Katcina the village prospered, it always rained
    and they had much to eat.”"
  summary: A maiden is brought as bride to a young man's house with white corn meal.
    The grandmother receives her, performs dawn meal offerings, and directs corn preparation.
    The young man calls chickens into the kiva, feeds them, sings with a drum, and
    the chickens produce fine meal from the corn. Later, after a feast, neighbors
    bring bridal garments and advise the young man. The grandmother washes and dresses
    the bride, sprinkles a road of meal, and the couple returns to the bride's village.
    Because the young man is a Katcina, the village prospers with rain and food until
    the wife goes astray, the husband leaves, and scarcity follows.
  language: English
  quote_policy: quoted
