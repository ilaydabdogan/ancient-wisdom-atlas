canonical_text:
  quote: "“Let us play hide and seek now,” she said, “and the one who is found four
    times shall be killed.”"
  summary: A Hopi youth and maiden agree to a lethal hide-and-seek contest in the
    fields. The maiden repeatedly conceals herself in plants or fruit, while the youth
    receives help from the Sun and Spider Woman but is still discovered through the
    maiden’s use of milk drops and a mirror or quartz crystal.
  language: English
  quote_policy: quoted
