canonical_text:
  quote: ''
  summary: The passage recounts movements and settlement of Hopi clans around Shong6pavi,
    Muenkapi, and Orafbi/Oraibi. Clans mark a bluff to claim water and planting rights,
    meet Skeleton as prior resident, receive land, and establish houses. It also explains
    how incoming clans gained admission by bringing rain- and crop-related cults and
    ceremonies, including the Bow clan’s rain-producing Katsina dance and the later
    order of ceremonies and cult origins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bear people started a village at the place of the ruins of old Shong6pavi,
    east of the present village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skeleton was living at the place where Orafbi now is.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Spider clan made marks or writing on a bluff east of Muenkapi stating
    that the place should belong to the Hopi because there was much water and the
    Hopi should plant there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Snake clan and later the Burrowing Owl clan each wrote the same kind of
    claim on the bluff before traveling toward Orafbi.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Skeleton met the Bear clan near Kuiwdnva after they arrived at Ndtuwanpifca,
    and the Bear clan asked to live with him, have him as chief, and receive land.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Skeleton refused to be chief, told the Bear clan that they would be chief,
    and spoke of their retained old life, a Powdka presence, and a future return of
    the White Man elder brother.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Skeleton stepped off and allotted a large tract of land, including a spring,
    to the Bear clan.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Bear clan built its houses east of the bluff of Orafbi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Bear clan brought the Soyal cult, the Aototo, and the Soyal Katcinas.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Incoming clans usually asked the village chief for permission to settle, and
    the chief asked whether they had knowledge or a cult to produce rain and good
    crops.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Bow clan named several Katcinas said to bring rain; after a trial dance,
    it rained heavily and the clan was invited to the village and given land.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage lists a sequence of ceremonies and attributes the Snake, Antelope,
