canonical_text:
  quote: ''
  summary: The passage recounts episodes of world-ordering, emergence, migration,
    clan settlement, ritual origins, and the arrival of foreign peoples. Spider Woman
    and others create light through ritual drawings; language, plants, corn, and migration
    routes are assigned; clans travel, create springs and rain, build mesa villages,
    and bring Katcina cults. A second account tells of Bear and Spider clan emergence
    from the under-world, light-seeking birds, wandering, crop failure in a cold land,
    the ritual creation of burros and Spaniards from skin scales, and the eventual
    settlement and ritual duties of Oraibi-related clans.
  language: English
  quote_policy: summarized
