candidate_motifs:
- id: motif:1
  label: Ritual fabrication of celestial light
  taxonomy_refs: []
  basis: Moonlike and sunlight appear after Spider Woman and the Flute Priest make,
    sing over, and move ritual images.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives ritual actions and resulting light but does not explicitly
    classify the episode as a cosmogony.
- id: motif:2
  label: Distribution of languages among peoples
  taxonomy_refs: []
  basis: Mocking-bird gives different languages to different people at the chief’s
    request.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No broader comparative language-confusion framework is stated in the passage.
- id: motif:3
  label: Choice of corn determining Hopi portion
  taxonomy_refs: []
  basis: People choose longer corn ears, leaving small ears for Hopi, who are said
    to have only corn.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The significance of corn size beyond the literal allocation is not fully
    explained in the passage.
- id: motif:4
  label: Separated parties preserving fitting marked stones
  taxonomy_refs: []
  basis: Each party takes a stone with marks and figures that fit together with the
    others.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The later use of the stones is only partly indicated; no reunion scene
    occurs in this passage.
- id: motif:5
  label: Journey to the sunrise and ethnogenesis of White Men
  taxonomy_refs:
  - departure
  basis: The elder brother’s party goes toward the sunrise and becomes White Men.
  evidence_refs:
