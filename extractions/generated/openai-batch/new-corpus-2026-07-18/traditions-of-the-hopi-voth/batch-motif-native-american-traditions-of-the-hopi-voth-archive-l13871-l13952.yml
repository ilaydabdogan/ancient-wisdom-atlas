canonical_text:
  quote: ''
  summary: 'The passage recounts creation events involving Huruing Wuhti deities,
    the Sun, Spider Woman, and other beings: land appears from water; birds, animals,
    people, languages, writing, and clan-related children are created; humans receive
    instruction and tablets; some people travel or settle; and a deity subdues armed
    Spaniards and requires exchange of good things.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the beginning, only water is present; a Huruing Wuhti lives in the ocean
    in the east, another in the ocean in the west, and the Sun also exists.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before rising in the east, the Sun dresses in a gray fox skin and then changes
    to a yellow fox skin, after which morning dawns.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two deities cause dry land to appear in the midst of the water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A Wren is made from clay, flies over the earth, and reports that there are
    no living beings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Spider Woman is said to be living in the southwest.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:6
  text: The deity of the west creates many birds and different kinds of animals and
    teaches them their sounds or languages.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The deity of the east creates a woman and then a man from clay, makes two
    inscribed tablets, rubs their palms, and they understand the writing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The deity of the east takes the clay woman and man over a rainbow to her home
    for four days, then sends them to choose a place to live.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: Spider Woman creates Spaniards from clay, teaches them Spanish, gives them
    tablets, transmits knowledge by rubbing hands, and creates two burros for them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Spider Woman creates other men and women with different languages; omissions
    in creating partners lead to repeated quarrels and separations, explaining contentions
    between husbands and wives.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: The Huruing Wuhti of the west creates many husband-and-wife pairs who live
    in the west, move about, and live on game.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: After contentions among people, the deity of the west goes to live in the
    western ocean and tells people to pray to her there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Two armed Spanish men go to Huruing Wuhti; she makes them lay down their weapons,
    their hands adhere to a stone, she rubs their guns to powder, and later releases
    them after they promise exchange of good things.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: In the second account, Huruing Wuhti of the west owns the moon, stars, and
    hard substances and reaches an agreement with the Sun to own all things together.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: Huruing Wuhti and the Sun animate birds from bird skins, feathers, cuticle
    scales, cloth covering, fire, waving, and song; the birds are then placed in a
    transparent stone jar.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: The Sun animates antelope and other animals from hair, paints, his beard,
    wings, a covering, and song; the animals are then regarded as belonging to Huruing
    Wuhti and as considering her their mother.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The Sun returns under the earth to the east, makes land by turning over Huruing
    Wuhti's land under water, and sees beings called White People, Spaniards, and
    Mormons come out of the water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: Huruing Wuhti creates named children or clan members from pieces or scales
    of her cuticle, umbilicus, face, and nose, gives some corn and one spoiled meat,
    and sends them away.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:19
  text: The Sun sees smoke and camps, gives water and corn to a tired youth and maiden,
    names them Sun Clan Member and Forehead Clan Member, and tells them to travel
    eastward.
  category: action
  evidence_refs:
  - ev:8
