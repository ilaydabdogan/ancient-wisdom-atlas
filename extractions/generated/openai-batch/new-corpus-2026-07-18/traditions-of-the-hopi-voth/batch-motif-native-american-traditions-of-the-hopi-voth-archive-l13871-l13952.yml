candidate_motifs:
- id: motif:1
  label: Land appears from primordial water
  taxonomy_refs:
  - chaos
  basis: The initial condition is only water, and the two deities cause dry land to
    appear in the middle of it.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy reference is broad; the passage does not describe a destructive
    flood or renewal after catastrophe.
- id: motif:2
  label: Beings formed from clay
  taxonomy_refs: []
  basis: Wren, the first woman and man, and Spaniards are explicitly made from clay.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: No available taxonomy reference directly names clay creation.
- id: motif:3
  label: Gift of language, writing, and understanding
  taxonomy_refs:
  - wisdom
  basis: Birds, animals, and people are taught sounds or languages; tablets with characters
    are given; understanding is imparted by rubbing hands.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The wisdom taxonomy reference is general; the passage presents practical
    linguistic and written knowledge rather than an abstract wisdom quest.
- id: motif:4
  label: Rainbow journey to a deity's home
  taxonomy_refs:
  - ascent
  basis: The eastern deity takes the first clay woman and man over a rainbow to her
    home, where they stay four days.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage says they go over a rainbow but does not explicitly frame
    the trip as vertical ascent.
- id: motif:5
  label: Diversification of peoples and languages
  taxonomy_refs: []
  basis: Spider Woman creates different pairs, gives each a different language, and
    creates Spaniards with Spanish language.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No specific available taxonomy reference directly covers language diversification.
- id: motif:6
  label: Etiology of marital contention
  taxonomy_refs: []
  basis: The passage explains quarrels between men and wives through a woman and man
    who were created without partners, meet, quarrel, separate, and reunite repeatedly.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is an etiological explanation, but no supplied motif-family reference
    precisely matches it.
- id: motif:7
  label: Female creator as mother of animals and clan-related children
  taxonomy_refs:
  - mother_goddess
  basis: Huruing Wuhti creates animals and named children from body matter, and the
    animals later consider her their mother.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage calls her mother in relation to animals; applying the broader
    mother_goddess family requires review.
- id: motif:8
  label: Ritual animation under a covering with fire and song
  taxonomy_refs: []
  basis: Birds and animals begin moving or arise after materials are covered, fire
    is kindled, corners are waved, and songs are sung.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: No supplied taxonomy reference directly names this ritual animation pattern.
- id: motif:9
  label: Divine chastisement creates obligation of exchange
  taxonomy_refs:
  - sacred_exchange
  basis: Huruing Wuhti subdues armed Spaniards and releases them after they promise
    to exchange good things with others.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The exchange obligation is explicit, but its ritual or covenantal status
    is not elaborated.
- id: motif:10
  label: People emerge from water
  taxonomy_refs: []
  basis: The Sun sees beings identified as White People, Spaniards, and Mormons come
    out of the water after he makes land.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not connect this emergence to an underworld in the provided
