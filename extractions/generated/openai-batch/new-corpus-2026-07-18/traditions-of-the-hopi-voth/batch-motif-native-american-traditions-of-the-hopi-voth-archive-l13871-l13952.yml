  locator: 13871-13879
  quote_or_summary: At the beginning only water exists; eastern and western Huruing
    Wuhti figures and the Sun exist; the Sun changes fox skins before dawn; dry land
    appears; a clay Wren scouts the earth; Spider Woman is in the southwest.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:2
  type: summary
  locator: 13879-13888
  quote_or_summary: The western deity creates birds and animals and teaches sounds
    or languages; the eastern deity creates a clay woman and man, makes inscribed
    tablets, rubs their palms so they understand, teaches language, and takes them
    over a rainbow to her home.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:3
  type: summary
  locator: 13888-13899
  quote_or_summary: Spider Woman creates Spaniards from clay, teaches Spanish, gives
    tablets, imparts knowledge by rubbing hands, creates burros, and creates other
    language pairs; omitted partners explain repeated quarrels between husbands and
    wives.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:4
  type: summary
  locator: 13899-13910
  quote_or_summary: Huruing Wuhti of the west creates husband-and-wife pairs living
    nomadically on game, withdraws to the western ocean after contentions, asks for
    prayer, and subdues two armed Spaniards with a stone and by powdering their guns
    before requiring exchange of good things.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:5
  type: summary
  locator: 13911-13924
  quote_or_summary: In the account of Huruing Wuhti and the Sun, western Huruing Wuhti
    owns the moon, stars, and hard substances, summons the Sun through the Moon, agrees
    with him to own all things, and animates birds with skins, feathers, cuticle scales,
    cloth, fire, waving, and song; the Sun places birds in a transparent stone jar.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:6
  type: summary
  locator: 13924-13934
  quote_or_summary: The Sun uses hair, paints, his beard, wings, covering, and song
    to animate antelope and other animals, which are given to Huruing Wuhti and regard
    her as mother; he returns under earth, makes land, sees White People, Spaniards,
    and Mormons emerge from water, and releases birds to fly and increase.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:7
  type: summary
  locator: 13934-13944
  quote_or_summary: Huruing Wuhti creates Muyingwa and Yahoya from cuticle, makes
    a Sand/Lizard Clan maiden from umbilical scale matter and gives her corn, then
    makes Burrowing Owl and Coyote Clan children from face and nose scales and gives
    them corn.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:8
  type: summary
  locator: 13944-13952
  quote_or_summary: Huruing Wuhti creates a Bear Clan child and a Navaho child, giving
    corn to the former and spoiled meat to the latter; the Sun later sees smoke and
    camps, gives water and corn to a tired youth and maiden, names them Sun Clan and
    Forehead Clan members, and sends them eastward.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain; summarized from supplied passage.
