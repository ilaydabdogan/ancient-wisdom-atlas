canonical_text:
  quote: At Kwakatpe (the) Red Eagle hatches children.
  summary: The passage contains a Red Eagle song and related prose narratives. Red
    Eagle lives with his wife and four children at Kwakatpe; people from Sikyatki
    later capture small eagles there and use their feathers for prayer-offerings and
    masks. A separate story tells of Red Eagle and Owl as friends whose attempted
    hunt ends when Oraibi boys shoot the sleeping Owl. Another story tells how Bee
    sweetens Asya's peaches with honey and receives wings made from Asya's feathers,
    explaining why peaches are sweet and bees can fly.
  language: English translation with Hopi song lines and glosses
  quote_policy: quoted
