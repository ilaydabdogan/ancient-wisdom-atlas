canonical_text:
  quote: ''
  summary: 'The passage recounts an enemy raid on two Hopi villages, the defensive
    movement of the inhabitants to a mesa-edge settlement, the capture of some women,
    maidens, and children, and the subsequent relocation of the attacked people to
    Oraibi. It then recounts traditions about early Spanish missions at Oraibi: peace
    after earlier conflict, Hopi permission for Spaniards to live there, construction
    of a spiral or snail-house-shaped building and an assembly house with bells, baptismal
    washing by priests, distribution of clothing and shoes, Sunday assemblies, water-fetching
    labor, deception about water sources, and cistern construction.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two communities lived at a hilltop ruin northeast of Oraibi and on another
    mesa across a valley after having moved because of harassment and warfare by Utes
    or old enemies.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the sixth year after settlement, enemies were seen camping eastward, and
    chiefs sent young men to identify them.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: After scouts confirmed the campers were old enemies, the villagers made bows
    and arrows through the night and moved to a more defensible small village at the
    edge of the eastern mesa.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The attackers first entered the abandoned western village, then followed tracks
    to the eastern mesa village, where they could not easily ascend and many were
    shot by defenders.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some attackers went around the mesa, entered the village from the south, captured
    women and maidens, and escaped on ponies; the later summary also mentions women
    and children taken.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The village warriors followed the raiders but could not overtake them because
    the warriors were on foot and the raiders were mounted.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the attack, the people decided not to remain in their villages, packed
    their belongings, formed a line with the chief at the head, went to Oraibi, and
    were admitted there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After earlier Spanish inroads and warfare, the Spaniards and Oraibi Hopi made
    peace; the Spaniards asked to live at Oraibi, and the Hopi consented and helped
    them build north of the village.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old Spanish building is described as spiral or snail-house shaped, with
    four spirals, a central house or kiva, a winding hallway requiring four turns
    to exit, a square house with four rooms, and roof access from the central place.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: A large assembly house was built northeast of the spiral structure and had
    a tower with bells.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A priest summoned the Hopi to the assembly house, said he would wash their
    heads, described it as good, and poured a little water on their heads.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Another priest from Basoi came with others and brought leather shoes and gray
    woolen clothing for the Hopi on carts with heavy wooden wheels and no iron.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Hopi had to assemble on Sundays in the assembly house, where the priests
    spoke to them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The priests required the Hopi to fetch drinking water from distant Muenkape;
    the Hopi sometimes substituted water from the nearer Tuhciva spring, the priests
    discovered this and were angry, and later set the people to making cisterns.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
