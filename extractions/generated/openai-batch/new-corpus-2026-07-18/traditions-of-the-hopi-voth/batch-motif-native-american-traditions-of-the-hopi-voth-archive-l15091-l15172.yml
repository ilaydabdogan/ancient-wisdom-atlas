canonical_text:
  quote: ''
  summary: 'The passage summarizes several Hopi narrative episodes: two sisters marry
    Night, escape with help from Frog and Spider Woman, die by lightning, and leave
    surviving children who later encounter their dangerous grandparents; Hiyónatitiwa
    wins a bride and, with his grandmother’s aid, defeats enemies who plotted against
    him; and a Shongopavi maiden opens a marriage-test tray with Spider Woman’s help,
    becomes beautiful, and later turns into a dog.'
  language: English
  quote_policy: summarized
