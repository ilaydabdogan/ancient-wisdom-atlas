canonical_text:
  quote: ''
  summary: Three Circle Katcinas encounter Hahaii Wuhti figures in kivas, are fed
    comfviki, sing and dance, and are told that their mother has been taken by that
    route. At Kfshiwuu they dance where their mother sees and recognizes them, and
    they take her back. On the return, the father sends the two sons ahead, kills
    his wife with a pointed stick, and flees while her skeleton pursues him through
    several villages and kivas, where different groups attempt to conceal him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At an initial kiva, the travelers hear a song and find Hahaii Wuhti opening
    comfviki while singing.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first Hahaii Wuhti says someone recently fetched their mother by that
    route, invites them in, feeds them comfviki, and the travelers dance and sing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Owl Spring/Mongkba, another Hahaii Wuhti in a kiva is also opening comfviki,
    sings the same song, says their mother was fetched by that route, feeds them,
    and hosts them overnight.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Kfshiwuu, many different kinds of Katcinas dance in successive groups;
    Hahaii Wuhti reports this to the three Circle Katcinas, who also go there and
    dance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hahaii Wuhti tells the three Katcinas that their mother is at Kfshiwuu; after
    they dance on the public plaza, the mother recognizes them and they take her back
    with them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before reaching Mongkba, the father sends the two children ahead to their
    grandmother, then kills his wife by thrusting a pointed stick into her throat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the killing, the wife’s skeleton follows the husband, who flees to Hano
    and is hidden by women under a pile of clay in a kiva.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: At Walpi, the husband enters a kiva where a war dance is being practiced and
    is given a drum to beat before the skeleton arrives and searches.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Mishongnovi, during the Lagón ceremony, women making trays hide the husband
    in a woman’s lap under a tray; the same kind of event is repeated at Shongopavi.
  category: sequence
  evidence_refs:
  - ev:8
