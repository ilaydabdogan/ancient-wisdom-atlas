canonical_text:
  quote: ''
  summary: A Hawk-man feeds and equips a group of boys, leads them in imitative actions
    around and outside a kiva, and subjects them to ordeals in which they are thrown
    into the kiva and then into fire ovens. After their costumes burn away, their
    bodies are covered with cloth and restored to life through the Hawk-man's song.
    The youths are washed, given white corn-ears called their mothers, instructed
    to go to the Blue Flute kiva, fast, sit in assigned groups, and assume ritual
    roles as fire jumpers, Yayaatus, singers, and a watchman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Hawk-man brings qomi bread, feeds the children, brings kilts, eagle feathers,
    pendants, beads, and related items, and dresses the boys.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each boy receives an eagle feather and is directed to stand in a line.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Hawk-man tells the youths to do whatever they see him do and leads them
    around the kiva four times while they cry out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Outside the kiva, the Hawk-man again instructs the youths to imitate him,
    jumps from the kiva, runs through brush, and the youths follow while crying out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Hawk-man spreads a native cloth on the ground, throws the priest's son
    onto it, and has the other youths carry him to the kiva and throw him through
    the opening.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The priest's son comes out of the kiva unharmed, and each of the other youths
    is thrown into the kiva and also comes out unharmed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Behind a curtain in an inner chamber are four round ovens dug into the earth,
    with an old woman keeping up a fire.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Hawk-man throws the priest's son and then the other youths into the ovens,
    while the old woman spurts medicine on them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the costumes burn off the bodies, the Hawk-man removes the bodies, places
    them north of the fireplace, covers them with the native cloth, and sings over
    them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The bodies begin to move, and the priest's son comes out first, followed by
    the others, all alive again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The old woman washes the youths' heads and gives each a perfect white ear
    of corn.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Hawk-man tells the youths that they are prepared, instructs them to take
    their wood to the Blue Flute kiva, stay there, avoid going into houses for food,
    and wait for him after sundown.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The youths bring wood to the Blue Flute kiva, return burden straps to the
    houses without entering them, and return to the kiva without eating.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: After dark the Hawk-man enters the Blue Flute kiva, sits near the fireplace,
    fills a pipe, and all smoke.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Hawk-man makes gruel from white popped-corn meal and feeds it to the youths.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The Hawk-man assigns some youths to sit at the north end as fire jumpers and
    Yayaatus, others at the south end as singers, and sprinkles a meal line between
    the two parties.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: One youth is selected as watchman to keep up the fires at the fireplace and
    keep out intruders.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:18
  text: The youths are instructed to remain sitting in the kiva and fast all day,
