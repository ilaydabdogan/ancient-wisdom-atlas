canonical_text:
  quote: ''
  summary: The passage contains the end of a Coyote hunt episode, an etiological tale
    explaining why coyotes call others to prey, a tale in which a bull-snake climbs
    to a wren nest and devours the brood and parent bird, a collector note about snake
    charming, and the opening of a tale about rattlesnakes who live in a kiva and
    are Hopi in winter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Surrounded Coyotes wearing masks and costumes are killed because they cannot
    see or run well; a family at Ishmovala without masks or costumes escapes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Coyote at Hohoyapi kills a rabbit for food and calls other coyotes because
    he does not want to eat it alone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Coyotes of different colors come from named directions: yellow from the north,
    blue from the west, red from the south, white from the east, black from the northeast,
    and gray from the southeast.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The assembled coyotes tear the rabbit apart and eat it, and the narrator states
    that this explains why a coyote calls out after finding prey.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Oraibi children find a Tuchvo or wren nest high on a bluff but cannot reach
    it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A bull-snake at the foot of the bluff is mocked by the bird, which sings that
    the snake will never ascend to its nest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bull-snake becomes angry, searches for a way up, fails three times, and
    succeeds on the fourth attempt in reaching the nest opening, where it sees four
    young birds.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The parent bird escapes from the nest, while the bull-snake coils in the nest,
    devours the four young birds, and remains there for four days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The bull-snake draws the parent bird closer through inhalations and exhalations
    until it can devour the bird.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note reports Hopi claims of observing bull-snakes charm mice and rabbits,
    and says the victim can be freed if someone cuts through the line of charm with
    a stick or other object.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Rattlesnakes at Tcuakpi have a kiva; in summer they move about as rattlesnakes,
    while in winter they are Hopi with their snake skins hanging on pegs around the
    kiva wall.
  category: attribute
  evidence_refs:
  - ev:8
