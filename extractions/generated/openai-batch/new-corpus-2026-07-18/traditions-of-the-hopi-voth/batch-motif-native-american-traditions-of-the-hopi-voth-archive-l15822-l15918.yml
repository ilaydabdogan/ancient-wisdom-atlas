canonical_text:
  quote: ''
  summary: The passage contains several brief Hopi Coyote tales. Badger revives a
    dead Kohonino maiden from bones with ritual actions, but Coyote’s desire causes
    her second death; Badger later tricks Coyote into killing himself by imitating
    the removal of entrails, and Coyote fat explains ant behavior and treatment of
    ant bites. Other tales show Coyote dying after imitating Kokontu-maidens jumping
    from a tree and bluff, losing a song and starving after breaking his teeth on
    a stone, being killed by Deer while pursuing Grasshopper’s family, and being caught
    in a trap while pursuing maidens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote and Badger are described as great friends, and Coyote finds the place
    where a Kohonino maiden has died.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Badger gathers the maiden’s bones, covers them with a black kilt, uses grass,
    red paint, and water from a spring, sings, and passes paint over the bones and
    grass until the maiden is alive.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the revived maiden agrees to go home with Badger and Coyote, Coyote
    covets her, bites her calf, and she falls down and dies again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Badger kills four bull-snakes, cuts them into pieces, cooks them, and tells
    Coyote they are his own roasted entrails.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Coyote believes Badger’s explanation, cuts open his own abdomen, pulls out
    his entrails, and dies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Badger takes fat from the dead Coyote, places it on an ant hill, and the ants
    move away; the passage presents this as an explanation for ants avoiding coyote
    fat and for the use of coyote fat on ant bites.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Coyote watches Kokontu-maidens grinding corn, singing, and playing by running
    up and jumping down a large tree and steep bluff; when he imitates them, he dies
    from the fall.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After Sparrow-hawk eats the grasshopper children, Coyote forces the mourning
    Grasshopper mother to sing, runs away with the song, stumbles over a rock and
    loses it, then breaks his teeth on a stone set in her place and starves.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Grasshopper deceives Coyote about holding up a field booth, sends his family
    to Deer, and Coyote later follows them to Deer’s house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Inside Deer’s kiva, two strong Deer toss Coyote with their horns until he
    is dead; afterward the grasshoppers scatter over the country.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Coyote’s grandmother dresses him with items he brings from the village, including
    a bow, quiver, yarn, leggings, shirt, and red ochre, before he goes to the three
    maidens.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The maidens’ father sets a stone trap with rabbit meat as bait; Coyote pulls
    at the meat, the trap closes, and he dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The maidens laugh when they see Coyote caught, and their father later skins
    Coyote and hangs up the skin as a watching flag.
  category: sequence
  evidence_refs:
  - ev:6
