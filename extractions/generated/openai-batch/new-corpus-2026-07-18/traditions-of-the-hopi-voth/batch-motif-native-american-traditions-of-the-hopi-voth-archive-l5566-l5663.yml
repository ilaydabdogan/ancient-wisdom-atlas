canonical_text:
  quote: ''
  summary: 'The excerpt closes a story in which a young man, aided by Spider Woman,
    rescues his sister from a water serpent by striking the serpent while dancing
    at the water''s edge; offerings are then placed in or near the spring, and the
    serpent remains dangerous to those who see it. The excerpt then begins a new story:
    two Oraibi maidens become rivals over the same young man, and the Yellow Corn-Ear
    maiden, said to possess supernatural powers, uses a rainbow-colored wheel to transform
    her friend into a coyote, after which the transformed maiden is driven away from
    the village and seeks food and shelter.'
  language: English
  quote_policy: summarized
