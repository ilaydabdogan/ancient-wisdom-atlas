canonical_text:
  quote: ''
  summary: 'An old Aholi Katcina and his sister, the Katcin-mana, make prayer-offerings
    and seed offerings at a Mho shrine where Muyingwa and Nayangap Wuhti dwell. The
    deities respond to the need for rain and crops: Nayangap Wuhti ritually plants
    the seeds with a seed-filled squash, and Muyingwa gives Aholi objects with which
    to produce rain and crops. Back in the kiva, a youth from Sitcomovi smokes and
    prays over the objects until moisture flows from them. The next morning Aholi
    and Katcin-mana dress ritually and make offerings at another shrine while hearing
    an unidentified voice singing above the mesa.'
  language: English
  quote_policy: summarized
