canonical_text:
  quote: ''
  summary: The passage closes a tale in which the Mocking-bird defeats the Rooster
    in a contest connected with bringing dawn and marries a maiden; their children
    explain later traits ascribed to village women and men. It then gives the tale
    of the Toad Woman's son, who attends a Snow Katcina dance at Oraibi, is mocked
    by children, eats ants, participates in the day, and brings a little red piki
    home to his mother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maidens attach dry corn-husks to the Rooster's tail; the rattling frightens
    him into running home, where he removes them and feels strong.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mocking-bird arranges for the Kwdtokwuu to assist him while the Rooster
    sings through the night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Near dawn, the Kwdtokwuu spreads large wings across the eastern sky and covers
    the dawn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Rooster sings and crows in repeated song groups, but daylight does not
    come and the sun does not rise until later.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Mocking-bird sings through the night, whistles after song groups, and
    the dawn appears; after his final songs, the sun rises.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Rooster acknowledges that the Mocking-bird knows how to make it light
    and says the Mocking-bird shall have the maiden.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The maiden marries the Mocking-bird and later bears two children, a boy associated
