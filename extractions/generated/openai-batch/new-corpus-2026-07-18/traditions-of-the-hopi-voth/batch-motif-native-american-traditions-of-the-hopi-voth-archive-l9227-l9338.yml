  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: On the eighth day, women prepare food for the next day's dance, and the Toad
    Woman prepares piki and other food.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Early in the morning, the Toad Woman washes her son's head with suds; he later
    wears a wildcat robe and skin cap before going to the village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Toad Boy paints his face when entering the village, and children laugh
