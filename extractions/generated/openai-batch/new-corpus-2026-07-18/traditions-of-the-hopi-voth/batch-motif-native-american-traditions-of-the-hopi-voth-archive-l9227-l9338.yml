  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says village women are considered children of the Mocking-bird
    and village men children of the Rooster, with traits explained from those associations.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Oraibi, Snow Katcinas practice for a dance in a northern kiva called Chorzhovi.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Toad Woman lives north of the village at Katcmavala and has a son who
    goes to listen to the Katcinas practicing.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Young men pile on the Toad Woman's son when he lies on the kiva roof, so he
