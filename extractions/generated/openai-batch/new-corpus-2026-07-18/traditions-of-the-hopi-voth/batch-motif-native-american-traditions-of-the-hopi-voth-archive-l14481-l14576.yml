candidate_motifs:
- id: motif:1
  label: neglected shrine beings receive offerings and restore fertility
  taxonomy_refs:
  - sacred_exchange
  - seasonal_cycle
  basis: Aholi makes prayer-offerings at a shrine whose inhabitants have been neglected,
    and receives objects for rain and crops; fields later grow beautifully.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage is a compressed summary and does not explain the full ritual
    or theological context.
- id: motif:2
  label: ritual smoke activates rain objects
  taxonomy_refs:
  - sacred_exchange
  basis: The Sitcomovi youth blows smoke on objects four times while praying, and
    they become moist, indicating rain production.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy has no specific smoke-prayer reference; sacred exchange is
    a broad fit.
- id: motif:3
  label: movement to mesa after supernatural instruction
  taxonomy_refs:
  - ascent
  - cosmic_mountain
  basis: Big-Skeleton tells the group to live on the mesa, and Walpi begins moving
    up the mesa and building a new village.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage concerns settlement on a mesa rather than an explicit cosmic
    mountain.
- id: motif:4
  label: dismemberment test followed by healing
  taxonomy_refs:
  - death_rebirth
  - initiation
  basis: The war gods submit to arm-cutting as a condition set by maidens, then are
    restored by their grandmother's singing.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The brothers do not die; the death-rebirth reference is only approximate
    because the passage describes injury and healing.
- id: motif:5
  label: heroes swallowed by monster defeat it from inside
  taxonomy_refs:
  - hero_descent
  - culture_hero
  basis: The Pookonghoyas are swallowed by Shita, travel inside its stomach-world,
    kill it by shooting the heart, and release swallowed people.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage identifies the episode as monster-killing, but does not explicitly
    frame it as descent.
- id: motif:6
  label: people released from monster disperse to former homes
  taxonomy_refs:
  - return
  basis: After Shita dies, the swallowed people get out and seek old homes, with temporary
    settlements explaining scattered ruins.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The return is collective and etiological, not an individual hero return.
- id: motif:7
  label: sacred theft of rain and storm implements
  taxonomy_refs:
  - sacred_theft
  - culture_hero
  basis: Pookong and his brother steal ceremonial objects from priestly contexts and
    use them to produce clouds, thunder, lightning, rain, and good crops.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage calls the brothers thieves but also says the stolen things
    lead to good crops, creating an ambivalent function.
- id: motif:8
  label: serpent taken from ritual setting
  taxonomy_refs:
  - serpent
  - sacred_theft
  basis: The brothers enter the Snake priests' kiva, take a bull-snake, and carry
    it away in a sack as part of the theft episode.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage names the bull-snake but gives limited symbolic explanation.
- id: motif:9
  label: community asks supernatural brothers to avenge a cannibal killer
  taxonomy_refs:
  - culture_hero
  - divine_judgment
  basis: After survivors identify Cooyoko as the killer, the chief asks the Pookongs
    to take revenge; they arm themselves and begin killing Cooyoko's household.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage is incomplete at the endpoint supplied, so the final outcome
    against Cooyoko is not included.
- id: motif:10
  label: tree escape from devouring monster
  taxonomy_refs:
  - tree
  basis: A woman threatened by Cooyoko climbs a tree and survives long enough to report
    him.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The tree functions as a refuge in this summary; no larger tree symbolism
    is stated.
