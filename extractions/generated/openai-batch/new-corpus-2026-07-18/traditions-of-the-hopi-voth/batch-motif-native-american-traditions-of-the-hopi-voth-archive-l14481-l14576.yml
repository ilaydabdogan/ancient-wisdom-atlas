canonical_text:
  quote: ''
  summary: 'The passage contains several Hopi narrative summaries: Aholi Katcina makes
    offerings at a baho shrine, receives rain-and-crop-producing objects, encounters
    katsinas and monsters, and the people move up the mesa; the two war gods submit
    to arm-cutting by maidens and are healed by their grandmother; the Pookonghoyas
    defeat a cannibal monster from inside its body; the Pookonghoyas steal ceremonial
    objects that bring storm and crops; and the Pookongs are asked to avenge people
    killed by Cooyoko.'
  language: English
  quote_policy: summarized
