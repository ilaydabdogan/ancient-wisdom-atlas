canonical_text:
  quote: ''
  summary: A young man deliberately enters a deathlike state to learn whether the
    dead remain somewhere. In the realm of the dead he passes suffering dead figures,
    Kwanitaka guides, punitive places of fire and darkness, and finally a large village
    of white houses where known dead persons live.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man asks his father whether someone who dies remains somewhere and
    says he wants to find out.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother warns him not to do this, while the father agrees after the young
    man describes how he may be worked on after sunrise so that he may return and
    wake up.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man eats a little medicine in the evening, sleeps, is described
    as entirely dead, and goes to the Skeleton House.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the north-side descent after Apdhnivi, he recognizes a seated person who
    had died long ago.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A seated dead person asks the young man to carry him at least four steps;
    the young man refuses because he is in a hurry, and the seated person cries.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A second seated person speaks to the young man in the same manner, and the
    young man again refuses.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Bow Height, a woman carries hard stone in a basket with a bow-string burden
    band that has cut into her head skin; she asks him to take it from her, and he
    refuses.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Another figure carries a mealing stone with a hair-string burden band and
    has cactus tied to both feet; he asks for the burden to be taken away, and the
    young man refuses.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the salt, a Kwanitaka shakes a bell loudly, asks if the young man has come,
    explains the earlier figures’ conditions, and points him to one of two diverging
    roads.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: A later Kwanitaka leads the young man to a very deep burning place like a
    corn-steaming oven and says wicked ones are burned there and appear as smoke.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The guide also shows a very deep, dark place where some are thrown in and
    never come out.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: After returning to the other Kwanitaka, the young man is directed along the
    other road to a large village of white houses, where Kwanitakas guide him in and
    he sees people he knows, including a former Oraibi chief.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that the former Oraibi chief was living in a large blossom.
  category: setting
  evidence_refs:
  - ev:8
