canonical_text:
  quote: ''
  summary: 'The passage gives short summaries of several Hopi traditions: grasshoppers
    eat a maiden’s corn after she grants them part of a field; beetles perform a rain
    dance and receive rain; ants hold a Katcina initiation in which children are flogged,
    explaining ants’ thin waists; two friends arrange a dance with mouse maidens and
    are eaten by hunting Pookongs; and the village of Pivanhonkapi is destroyed by
    fire after its chief seeks supernatural punishment, while Oraibi is saved through
    Spider Woman’s web and water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A father has his daughter watch a field; she hears singing in a hollow and
    later sees little beings dancing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grasshoppers agree to continue dancing only after the maiden offers them
    one division of the corn-field.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After dancing, the grasshoppers fly to the corn-field and devour all the corn,
    exceeding the agreed limit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The father follows the grasshoppers, kills many with a stick, destroys their
    houses, and the surviving grasshoppers thereafter live anywhere.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: During heat and drought, beetles are thirsty and some die.
  category: setting
  evidence_refs:
