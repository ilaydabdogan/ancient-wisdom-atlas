  text: A sand picture is made in a kiva, ant children are brought in, a Katcina priest
    tells a story, and four little Koyemsis perform.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Katcinas flog the little ant children so hard that their bodies are almost
    cut through the middle, explaining why ants are thin in the middle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Lavovolvipiki and Nonvovolpiki arrange a Paiute dance with mouse maidens and
