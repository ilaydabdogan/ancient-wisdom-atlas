canonical_text:
  quote: ''
  summary: 'The passage closes one narrative episode in which a woman connected with
    sorcerers conceals a substituted old leg, the old leader of the sorcerers dies
    in a kiva-ladder accident involving a spindle, other victims die in accidents,
    and a sky-associated maiden descends and later returns to the sky with war chiefs.
    It then begins the tale of Watermelon-Rind Woman: in Oraibi a beautiful maiden
    refuses suitors; the poor young man Piwitamni, advised by his grandmother, gives
    her two fawns; her parents approve the union; she moves to his grandmother’s house,
    grinds corn for four days, and a feast and bridal costume are provided.'
  language: English
  quote_policy: summarized
