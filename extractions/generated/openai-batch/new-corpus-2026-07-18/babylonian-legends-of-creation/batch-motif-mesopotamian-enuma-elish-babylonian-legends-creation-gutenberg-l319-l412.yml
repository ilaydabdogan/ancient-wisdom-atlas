canonical_text:
  quote: ''
  summary: The passage presents Greek-preserved versions of Babylonian creation traditions
    attributed to Berosus and Damascius. Berosus describes primeval darkness and watery
    abyss filled with hybrid beings, a presiding woman named Omuroca/Thalatth/Thalassa,
    Belus cutting her apart to form earth and heavens, and human creation from divine
    blood mixed with earth. A second Berosus summary has Belus divide darkness, separate
    heaven and earth, order the universe, create celestial bodies, and command the
    beheading of a god whose blood is mixed with earth to form beings able to live
    in air. Damascius reports a genealogy beginning with two principles, Tauthe and
    Apason, leading ultimately to Belus as fabricator of the world.
  language: English
  quote_policy: summarized
