canonical_text:
  quote: ''
  summary: The passage praises a central deity under many names, including Asari,
    Tutu, Shazu, Nibiru, Lord of the Lands, and Ea. He is described as giver of crops,
    master of counsel and incantation, life-giver, maker of mankind, establisher of
    heavens and star-courses, subduer of Tiamat, and recipient of titles proclaimed
    by Bel, Ea, the Igigi, and the great gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The name Asari is associated with plantations, sowing time, grain, fibrous
    plants, and garden herbs.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The names Asaru-Alim and Asaru-Alim-Nuna are associated with weight in the
    council chamber, fertility in counsel, divine worship, light from the father,
    and making straight the direction of Anu, Bel, and Ea.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The name Tutu is associated with creating new life, supplying the gods' wants,
    reciting an incantation that gives the gods rest, successful resistance to attack,
    elevation to a high throne, and uniqueness among the gods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The god Tutu as Zi-Ukkina is described as life of the host of the gods, establisher
    of shining heavens, founder of divine paths, and fixer of courses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The god Tutu as Zi-Azag is associated with holiness, a favourable wind, adoration,
    grace, fullness, abundance, plenty, and making what is little become much.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The god Tutu as Aga-Azag is called lord of the holy incantation; he makes
    the dead live, has compassion for captive gods, places a yoke on enemy gods, creates
    mankind in mercy, and has words that endure in the mouths of the Black-headed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The god Tutu as Mu-Azag is linked with holy incantation that destroys evil
    ones; Shazu is called the wise heart of the gods, searches the inward parts of
    the belly, and does not permit the worker of evil to go forth by his side.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The name Nibiru is given to the one who entered the middle of Tiamat, seizes
    the middle, sets the courses of the stars, herds the gods like sheep, keeps Tiamat
    captive, and slits or disembowels her treasure or life.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage commands that the words be heard among later people without ceasing
    because the praised deity made the heavenly places and moulded the stable earth.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Father Bel proclaims the title Lord of the Lands, the Igigi repeat it, Ea
    rejoices and gives the name Ea, and the great gods proclaim the deity's names
    fifty times.
  category: sequence
  evidence_refs:
  - ev:10
