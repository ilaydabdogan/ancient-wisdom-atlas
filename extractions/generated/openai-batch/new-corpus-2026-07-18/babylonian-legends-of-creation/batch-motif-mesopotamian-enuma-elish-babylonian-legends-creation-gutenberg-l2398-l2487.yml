canonical_text:
  quote: ''
  summary: The passage praises Marduk under several names, declaring that he delivered
    the gods in trouble, that his sonship was proclaimed, that humans were formed
    and assigned divine service, that he bound the Serpent, that his kingship over
    heaven and earth is to be exalted, and that he assigned dwellings and stations
    to divine groups. It also describes the naming of ASAR-LU-DUG by Anu and a divine
    council at Up-shukkinaku where the gods proclaim Marduk's rank and name in the
    sanctuary.
  language: English
  quote_policy: summarized
