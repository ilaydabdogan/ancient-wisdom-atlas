canonical_text:
  quote: ''
  summary: The passage explains that the Seven Tablets of Creation chiefly glorify
    Marduk, son of Ea/Enki, as conqueror of the dragon Tiamat, rather than chiefly
    narrating the creation of heaven, earth, and humankind. It notes that creation
    is treated as one exploit of Marduk, that the Seventh Tablet lists his honorific
    titles, and that other city traditions could place their own chief gods in the
    hero position, including Ashur in Assyrian texts and possibly Enlil in an earlier
    form.
  language: English
  quote_policy: summarized
