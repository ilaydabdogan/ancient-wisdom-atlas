- id: obs:4
  text: A cloak is placed in the gods' midst; Marduk speaks, the cloak disappears,
    then he speaks again and it reappears uninjured.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After seeing the result of Marduk's utterance, the gods rejoice, declare him
    king, and confer the sceptre, throne, royal symbol, and an unrivalled weapon on
    him.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The gods order Marduk to cut off Tiamat's life and have the wind carry her
