  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Marduk raises a wind-storm as a mighty weapon and mounts an unequalled tempest-chariot
    yoked to four horses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Marduk approaches Tiamat, searches out Kingu's plan, and Kingu staggers as
