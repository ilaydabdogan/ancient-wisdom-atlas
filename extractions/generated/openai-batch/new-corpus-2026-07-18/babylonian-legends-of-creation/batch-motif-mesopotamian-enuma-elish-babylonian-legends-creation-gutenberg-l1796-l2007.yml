canonical_text:
  quote: ''
  summary: In the Fourth Tablet excerpt, the gods enthrone Marduk, declare his commands
    irrevocable, test his spoken power with a cloak, proclaim him king, and give him
    royal insignia and weapons. Marduk arms himself with weapons, lightning, fire,
    a net, winds, and a tempest-chariot, then approaches Tiamat. Kingu falters when
    Marduk examines his plan; Marduk challenges Tiamat, and Tiamat responds with cries
    and an incantation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A majestic canopy is founded for Marduk, and he sits in the seat of kingship
    before the gods called his fathers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods state that Marduk's command will not be abrogated and that what goes
    from his mouth will be established without appeal.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The gods call Marduk their avenger and say they have given him sovereignty
    over the whole creation.
  category: speech
  evidence_refs:
