canonical_text:
  quote: '"All the lands were sea"'
  summary: The passage introduces variant Mesopotamian creation traditions and then
    gives a bilingual creation version. Before houses, cities, reeds, trees, creatures,
    and temples existed, the lands are described as sea. Eridu, E-sagil, Babylon,
    and the Anunnaki are made; Marduk lays a rush mat on the waters, mixes earth on
    it, fashions man, and with Aruru creates the seed of mankind. Marduk also creates
    animals, rivers, vegetation, marshes, cities, and temples.
  language: English
  quote_policy: quoted
