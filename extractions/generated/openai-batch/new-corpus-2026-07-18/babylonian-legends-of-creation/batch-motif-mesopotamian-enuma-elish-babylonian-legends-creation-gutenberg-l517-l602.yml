canonical_text:
  quote: ''
  summary: After Apsu's death, Tiamat expands her forces through Ummu-Khubur's brood
    and eleven named helpers, appoints Kingu as captain and gives him the Tablet of
    Destinies. Ea and Anshar seek a response; Anu fails to approach wrathful Tiamat.
    A council of the gods then recognizes Marduk as champion, invests him with effective
    command power, and Marduk tests it by making a garment disappear and reappear.
  language: English
  quote_policy: summarized
