canonical_text:
  quote: '"When the heavens above were yet unnamed"'
  summary: The passage opens the First Tablet with an unnamed pre-cosmic state in
    which Apsu and Tiamat's waters are merged. Divine generations arise; Apsu, advised
    by Mummu, plans to destroy the younger gods. Ea discovers the plan and, in the
    editor's summary of broken lines, overcomes Apsu and Mummu. A god is born in Apsu's
    chamber. The passage then resumes with Tiamat's supporters preparing for battle
    and Tiamat/Ummu-Khubur spawning venomous serpents.
  language: English
  quote_policy: quoted
