canonical_text:
  quote: ''
  summary: Tiamat elevates Kingu, appoints him leader in battle, gives him sovereignty
    and the Tablet of Destinies, and declares his commands effective. The passage
    then reports failed opposition by Anu and Ea, Marduk’s willingness to confront
    Tiamat if the gods magnify his rank and grant his decrees lasting force, and the
    gods’ gathering, feasting, drinking, and issuing a decree naming Marduk as their
    avenger.
  language: English
  quote_policy: summarized
