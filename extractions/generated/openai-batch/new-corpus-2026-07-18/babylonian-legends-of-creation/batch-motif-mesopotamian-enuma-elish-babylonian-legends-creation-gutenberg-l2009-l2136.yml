- id: obs:8
  text: Marduk establishes Anshar's victory over the enemy and achieves the object
    of Nudimmud, also identified as Ea in the passage note.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Marduk returns to Tiamat, tramples her, cleaves her skull, slits the channels
    of her blood, and causes the North Wind to carry the blood underground.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Marduk's fathers, identified in the passage note as the gods, look on, rejoice,
