canonical_text:
  quote: ''
  summary: Marduk battles Tiamat, traps and kills her, captures her forces, defeats
    Kingu and takes the Tablet of Destinies. He then returns to Tiamat's body, cuts
    and divides it, uses one half as the heavens, controls her waters, measures the
    Deep, founds E-Sharra as heaven, and assigns Anu, Bel, and Ea to their cities.
  language: English
  quote_policy: summarized
