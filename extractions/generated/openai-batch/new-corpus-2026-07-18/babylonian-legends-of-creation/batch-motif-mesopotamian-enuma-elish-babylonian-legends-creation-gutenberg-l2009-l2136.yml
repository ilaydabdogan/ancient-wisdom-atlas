- id: obs:4
  text: Marduk uses a spear to split Tiamat's belly, open her bowels, pierce her heart,
    destroy her life, and stand upon her carcass.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tiamat's host and allied gods scatter and flee, but are hemmed in, caught
    in the net and snare, and cannot escape.
  category: sequence
  evidence_refs:
