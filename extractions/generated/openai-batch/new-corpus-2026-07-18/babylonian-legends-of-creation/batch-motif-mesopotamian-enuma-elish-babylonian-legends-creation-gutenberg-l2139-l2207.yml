canonical_text:
  quote: ''
  summary: In the Fifth Tablet, a divine actor identified by the editor as Marduk
    appoints celestial stations, zodiacal stars, the year, month divisions, Nibir,
    and stations of Bel and Ea; he establishes heavenly gates, corridors, and the
    zenith. He gives brightness and night-governance to Nannar, the Moon-god, and
    instructs him about monthly phases. After fragmentary lines, the gods who are
    Marduk's fathers examine the net and bow he made, praise the work, and Anu lifts,
    kisses, names, and stations the bow as a heavenly object.
  language: English
  quote_policy: summarized
