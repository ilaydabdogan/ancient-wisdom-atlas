canonical_text:
  quote: ''
  summary: 'The passage summarizes parts of the Babylonian creation tradition: Marduk
    arranges heaven and earth, divine triads are described, the gods complain that
    they lack worshippers and offerings, and Marduk plans the creation of mankind.
    Ea proposes a divine sacrifice; Kingu is named, bound, punished, and his blood
    is used by Ea to fashion mankind for the gods'' service. A variant account also
    includes a divine council and sacrificial creation at Uzu-mu-a, the bond of heaven
    and earth. The Anunnaki build E-Sagila for Marduk at Babylon, where he assigns
    gods their places and receives the Fifty Names. The passage also notes later comparative
    traditions and parallels for divine praise-names.'
  language: English
  quote_policy: summarized
