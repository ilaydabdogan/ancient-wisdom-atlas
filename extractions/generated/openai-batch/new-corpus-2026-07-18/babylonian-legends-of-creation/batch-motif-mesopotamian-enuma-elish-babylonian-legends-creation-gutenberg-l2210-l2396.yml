canonical_text:
  quote: From his blood he (i.e., Ea) fashioned mankind for the service of the gods,
    and he set the gods free.
  summary: Marduk plans the creation of humanity, Ea advises that one god be destroyed
    so humans may be fashioned, Kingu is identified as the instigator of strife with
    Tiamat and punished, and Ea fashions mankind from Kingu's blood for the service
    of the gods. Marduk orders the gods, the Anunnaki build Babylon's shrine E-Sagila
    and its ziggurat, and the gods praise Marduk.
  language: English
  quote_policy: quoted
