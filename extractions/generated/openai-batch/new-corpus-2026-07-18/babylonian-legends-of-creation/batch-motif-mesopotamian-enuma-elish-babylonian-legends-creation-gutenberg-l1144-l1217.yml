canonical_text:
  quote: ''
  summary: Tiamat fashions terrifying serpentine and composite monsters, arms them
    for battle, and causes eleven monsters to come into being. She elevates Kingu
    above the company, appoints him battle leader, gives him sovereignty and the Tablet
    of Destinies, and declares that his commands will be established. Kingu fixes
    destinies, and the passage closes with a command that the Fire-god be quenched.
  language: English
  quote_policy: summarized
