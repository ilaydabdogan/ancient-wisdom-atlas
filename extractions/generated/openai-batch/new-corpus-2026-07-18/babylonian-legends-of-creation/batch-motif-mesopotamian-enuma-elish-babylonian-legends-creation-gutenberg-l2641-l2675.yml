canonical_text:
  quote: ''
  summary: The epilogue instructs people to repeat and meditate on the names, transmit
    them from father to son, and let them give understanding to shepherds and herdsmen.
    It exhorts humans to rejoice in Marduk, Lord of the Gods, so that land may be
    fertile and the person secure. It praises Marduk's true and unalterable command,
    irresistible wrath, great mercy, and reception of complaints.
  language: English
  quote_policy: summarized
