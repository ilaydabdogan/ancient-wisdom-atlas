  summary: The gods install Marduk as king and arm him to fight Tiamat. Marduk uses
    winds, storm weapons, and a net to defeat Tiamat and her allies, takes the Tablet
    of Destinies from Kingu, further mutilates Tiamat's body, and then fashions heaven,
    the abode of Ea, and ordered places for the gods from the divided body of Tiamat.
  language: English
  quote_policy: summarized
