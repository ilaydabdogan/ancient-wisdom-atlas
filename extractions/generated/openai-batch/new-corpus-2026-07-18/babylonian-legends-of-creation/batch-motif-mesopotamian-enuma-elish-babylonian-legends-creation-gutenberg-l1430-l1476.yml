canonical_text:
  quote: ''
  summary: A speaker promises Anshar to carry out what is in Anshar's heart. Anshar
    addresses Marduk about Tiamat, an armed female adversary, and urges him to bring
    joy to the gods by trampling Tiamat, casting deep sleep on her with a holy spell,
    and marching quickly. Marduk rejoices at his father's words and says that, if
    he avenges the gods by slaying Tiamat and giving them life, they should assemble,
    magnify his position, and grant him decree-making authority whose utterances will
    not fail.
