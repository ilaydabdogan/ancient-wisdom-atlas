literal_observations:
- id: obs:1
  text: The writer of the Fifty Names is described as aiming to show that Marduk was
    the Lord of the gods and that the powers and attributes of every god were enshrined
    in him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A tablet is said to contain a list of gods equated with Marduk in various
    forms, including En-Urta, Nergal, En-lil, Nabu, Sin, Shamash, and Adad.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Marduk gained pre-eminence in the Babylonian Pantheon early,
    while also noting debate over whether this implies monotheistic conceptions.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The source and date of the original form of the fight between Ea and Apsu
    and between Marduk and Tiamat are described as unknown.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: A form of the legend is said to have persisted in Mesopotamia for thousands
    of years.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The apocryphal book of Bel and the Dragon is cited as evidence that a form
    of the legend existed among Babylonian Jews after the Captivity and was associated
