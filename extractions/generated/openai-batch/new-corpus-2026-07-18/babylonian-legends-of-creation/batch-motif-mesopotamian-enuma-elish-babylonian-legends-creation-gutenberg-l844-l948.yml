canonical_text:
  quote: ''
  summary: The passage is a scholarly description of Marduk’s elevation through the
    Fifty Names, the uncertain origin and long persistence of the Ea-Apsu and Marduk-Tiamat
    combat legend, comparisons and distinctions between Babylonian and Hebrew creation
    accounts, variant dragon-combat and flood-related creation traditions, and the
    poetic form of the Seven Tablets of Creation.
