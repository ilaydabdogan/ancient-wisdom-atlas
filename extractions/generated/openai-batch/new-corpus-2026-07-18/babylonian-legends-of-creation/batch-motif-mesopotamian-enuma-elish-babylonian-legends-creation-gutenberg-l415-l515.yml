canonical_text:
  quote: ''
  summary: 'The passage summarizes the opening cosmogony of the Seven Tablets of Creation:
    Apsu, a disordered watery mass, precedes the emergence of demons and gods; successive
    divine pairs and independent gods arise; divine order provokes Apsu and Tiamat
    to oppose the gods; Tiamat is described as a monstrous mother and possessor of
    the Tablet of Destinies; a struggle begins between gods and demonic powers; Ea/Nudimmud
    defeats Apsu and Mummu by incantation, setting boundaries to the waters; Tiamat
    then resolves to avenge Apsu.'
  language: English
  quote_policy: summarized
