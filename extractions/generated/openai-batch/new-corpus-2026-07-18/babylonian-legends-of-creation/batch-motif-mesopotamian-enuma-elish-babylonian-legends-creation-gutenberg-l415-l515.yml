comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Tiamat's theological status to Hebrew tohu
    wa-bhohu in Genesis i.2, as formlessness and voidness of primeval matter.
  claim_level: same_function
  target: Genesis i.2 / Hebrew tohu wa-bhohu
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The passage supplies an asserted comparison but no detailed textual
    or historical argument within this excerpt.
- id: claim:2
  claim: The passage footnote proposes that the idea of Tiamat's Tablet of Destinies
    is probably perpetuated in the Qur'an's Preserved Tablet, on which destinies are
    written.
  claim_level: historical_contact
  target: Qur'an, Surah x, 62 / Preserved Tablet
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: low
  limitations: The claim is presented as probable in a footnote and the passage gives
    no transmission evidence beyond functional resemblance.
- id: claim:3
  claim: The passage cites the fight between Her-ur and Set as a similar great conflict
    between an order-bringing heavenly god and a captain of hosts of darkness.
  claim_level: same_motif
  target: Egyptian conflict of Her-ur and Set
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is broad and relies on the passage author's general
    allegorical framing.
- id: claim:4
  claim: The passage states that Her-Tuati rendering Aapep spell-bound in the Egyptian
    Legend of Ra and Aapep plays the same role as Ea's spell-based victory in the
    Babylonian legend.
  claim_level: same_function
  target: Egyptian Legend of Ra and Aapep
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the function of spell-binding or magical
