comparison_claims:
- id: claim:1
  claim: The passage supports a cautious same-function comparison between Babylonian
    three-star monthly groups and the wider dekan pattern, because it states that
    Egyptian, Greek, Syriac, and Arabic astrological and astronomical texts associate
    twelve zodiac signs with thirty-six dekans, and it cites the Fifth Tablet as evidence
    that the Babylonians knew groups of three stars per month.
  claim_level: same_function
  target: Thirty-six Dekans in Egyptian, Greek, Syriac, and Arabic astrological and
    astronomical texts
  evidence_refs:
  - ev:5
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not establish origin, transmission route, or exact
    Babylonian names for the groups in the cited Fifth Tablet context.
- id: claim:2
  claim: The passage supports a cautious linguistic-similarity claim between Babylonian
    Lumashi and Syriac malwashe/malwasha, because a footnote states that Lumashi is
    the original of the Syriac word with an added initial m.
  claim_level: linguistic_similarity
  target: Syriac zodiac terminology malwashe / malwasha
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an etymological statement from the supplied passage only and
    is not independently evaluated here.
