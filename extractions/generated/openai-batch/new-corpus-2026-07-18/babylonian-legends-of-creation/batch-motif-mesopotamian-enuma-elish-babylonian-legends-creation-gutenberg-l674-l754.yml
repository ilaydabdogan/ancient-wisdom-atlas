literal_observations:
- id: obs:1
  text: The surviving text of the Fifth Tablet is said to be wanting where it would
    have described Marduk's arrangements for the sun, moon, stars, and Signs of the
    Zodiac.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that many Babylonian religious beliefs were grouped around
    celestial bodies.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Annunaki and Igigi are described as deified spirits identified with the
    stars of the northern and southern heaven, respectively.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ishtar is described as a goddess formed by the coalescence of primitive goddesses
    and identified with the Evening and Morning Star, or Venus.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Babylonians are said to have believed that the gods' will was made known
    by planetary motions and that skilled seers could read favorable and unfavorable
    portents in the stars.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the Babylonians had formulated the Zodiac, fixed the moon's
    stations and the places of the planets with it, and distinguished planets from
    fixed stars.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Signs of the Zodiac are called Lumashi in the Fifth Tablet, and line 4
    is cited as saying that Marduk set up three stars for each of the twelve months.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: At a later period, Enlil, Anu, and Ea are said to have been made regents of
    groups of stars.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Boundary Stone of Ritti-Marduk is described as showing divine and zodiacal
    symbols, including the star of Ishtar, crescent of Sin, disk of Shamash, tiaras
    for Anu, Enlil, and Ea, and emblems of Marduk, Nabu, and Ninkharsag.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Additional registers on the boundary stone include an animal-headed standard,
    a two-headed snake identified with the Twins, a horse-headed symbol, a bird, Gula,
    Scorpion-man, forked lightning, a bull, a tortoise, a scorpion, the lamp of Nusku,
    and a serpent-god representing Hydra.
  category: object
  evidence_refs:
  - ev:8
