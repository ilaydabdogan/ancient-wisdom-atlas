canonical_text:
  quote: ''
  summary: Anshar instructs his envoy Gaga to go to Lakhmu and Lakhamu, summon a divine
    council and feast, and urge the gods to grant decrees to Marduk as avenger. The
    message reports that Tiamat has gathered hostile gods, created terrifying serpents
    and other monsters, and elevated Kingu with command, weapons, and the Tablet of
    Destinies. Anu and Nudimmud/Ea have failed or withdrawn, while Marduk has offered
    to fight Tiamat if the gods magnify his status and make his decrees unalterable.
    Gaga then travels to Lakhmu and Lakhamu, performs homage, and repeats the message.
  language: English
  quote_policy: summarized
