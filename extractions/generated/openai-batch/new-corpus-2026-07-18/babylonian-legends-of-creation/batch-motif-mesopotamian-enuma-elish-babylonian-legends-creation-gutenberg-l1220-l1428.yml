canonical_text:
  quote: ''
  summary: In the Second Tablet passage, Tiamat prepares vengeance for Apsu by binding
    divine children, gathering allied gods, and creating terrifying monsters including
    serpents. She exalts Kingu, appoints him battle leader and spouse, gives him the
    Tablet of Destinies, and grants effective command. Anshar sends Anu to confront
    or pacify Tiamat, but Anu fails. The Anunnaki lament that no god can survive Tiamat,
    after which Anshar and Ea direct attention to Marduk as the heroic avenger.
  language: English
  quote_policy: summarized
