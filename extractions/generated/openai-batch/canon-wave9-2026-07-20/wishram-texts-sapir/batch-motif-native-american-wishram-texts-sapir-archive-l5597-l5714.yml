canonical_text:
  quote: ''
  summary: The passage gives the tale of a Wasco woman who feigns death to leave her
    husband for a Tenino man, is discovered when her sons repeatedly fetch fire from
    Tenino, returns to her husband after the Tenino man is killed, and triggers a
    conflict that Coyote ends by turning both sides into rocks. It also begins a second
    tale about a seven-month snowstorm near Dog River in which people live under deep
    snow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man, his wife, and four children live at Wasco during a season when women
    cut grass for packing dried fish.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife and a man from Tenino fall in love and plan that she will chew alder-bark
    to appear to spit blood, pretend to die, and be dug up after burial.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before her apparent death, the wife tells her husband to cover her face with
    her cup and mountain-sheep horn dish, but not to cover it completely.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the husband buries her, the Tenino man digs her up and she goes with
    him to Tenino.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The husband builds a sweat-house, sweats for five days, mourns, and makes
    rock pictures and pierced stones to amuse the children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The fires go out in the village, and the father sends the two boys to Tenino
    to get fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Tenino the boys recognize their mother, light a cedar-bark fire holder,
    and see that she has a young baby.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After repeated trips for fire, the boys tell their father that they see their
    mother; he finds her grave empty and sees her with the Tenino man.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The wife meets her husband while going for water, asks him to save her life,
    says the Tenino man whips her, and instructs her husband to cut off the Tenino
    man’s head while he sleeps.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Tenino man is found headless, and people later hear that the woman’s husband
    has put the head on a pole.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Tenino people and Wasco people prepare to fight, but Coyote intervenes and
    turns both groups into rocks.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: In a hard winter near Dog River, snow falls for seven months, buries the tallest
    trees, and people live under the snow.
  category: setting
  evidence_refs:
  - ev:9
