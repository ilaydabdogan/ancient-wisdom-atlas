- id: obs:1
  text: The captain tells the group not to go back, to go ahead to the other side,
    and not to be afraid if guns are fired at them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The captain asks whether the people are willing to die; the group shows or
    lifts hands and agrees that they should die that day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator's party crosses first; the Paiutes do not cross, and the party
    later finds tracks, houses, and logs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At night in the mountains, pairs keep watch for fire; the narrator and a companion
    see a fire and report it to the captain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The group approaches a fire where Paiutes are standing; shooting begins, about
    fifteen Paiutes are killed, and two horses are taken.
  category: action
  evidence_refs:
  - ev:4
