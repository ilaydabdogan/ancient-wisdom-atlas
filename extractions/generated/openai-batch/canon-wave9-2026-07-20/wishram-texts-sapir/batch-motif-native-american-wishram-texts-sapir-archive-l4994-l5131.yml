canonical_text:
  quote: ''
  summary: A first-person narrative describes a captain leading a party that agrees
    to advance despite the likelihood of death. The party keeps night watches for
    enemy fires, attacks Paiutes, follows tracks in snow, charges near water, captures
    a child, kills several Paiutes, hears Paiutes debate whether the attackers are
    whites, Wascos, or soldiers, sees one Paiute burn his house and escape, and finally
    halts when the Paiutes are said to occupy a difficult fenced position near cliffs.
  language: English translation with brief Shoshonean phrases noted in the passage
  quote_policy: summarized
