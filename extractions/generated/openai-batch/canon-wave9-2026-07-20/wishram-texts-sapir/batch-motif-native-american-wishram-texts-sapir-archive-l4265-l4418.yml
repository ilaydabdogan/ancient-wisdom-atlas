  text: Two medicine-men doctor a sick man, say they will make him well, but the man
    dies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the sick man dies, the two medicine-men who doctored him are killed
    and are described as wicked because they had “shot” him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In a second sickness case, a medicine-man is taken and paid two horses, three
    blankets, and ten dollars.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A medicine-woman is also taken in the second case and is paid one horse, one
    cow, two blankets, and five dollars.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The second pair of practitioners doctor with time-beating sticks and singing,
