canonical_text:
  quote: ''
  summary: The passage describes Wishram customs and incidents involving medicine
    practitioners, clothing and older material culture, first salmon catch observance,
    and the construction of fishing stagings at Cascades. It includes one failed doctoring
    episode ending in the death of the patient and killing of the two medicine-men,
    a second paid doctoring episode in which a sick man recovers, descriptions of
    older clothing and tools, a first-salmon rite that makes a fishing post lucky,
    and a technical procedure for setting fishing staging-poles in summer water.
  language: English
  quote_policy: summarized
literal_observations:
