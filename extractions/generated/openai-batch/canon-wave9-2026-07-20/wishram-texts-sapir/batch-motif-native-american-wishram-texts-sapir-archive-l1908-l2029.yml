canonical_text:
  quote: ''
  summary: Coyote dies after a prepared trap pierces him, while Antelope and Antelope’s
    two sons use a shinny-ball and flee along the tops of grass. Coyote revives, pursues
    them, mistakes his own reflection in water for an enemy, and receives an explanation
    from his two feces. He catches Antelope and the two sons sleeping, throws dust
    at them, and declares that they are animals named Antelope rather than chiefs.
    The passage then begins another myth in which Eagle, Bluejay, Beaver, Sparrow
    Hawk, and Chicken Hawk spear a seal that drags them over the water; Beaver tries
    to cut the rope with his teeth and loses them.
  language: English
  quote_policy: summarized
