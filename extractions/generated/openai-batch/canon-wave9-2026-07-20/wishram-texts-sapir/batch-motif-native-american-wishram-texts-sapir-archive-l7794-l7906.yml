canonical_text:
  quote: ''
  summary: The passage first concludes a story in which star people visit girls on
    earth; an old star is left behind, is rejected by the youngest girl, pronounces
    an etiological rule about young girls disliking old husbands, and becomes a white
    flint rock by the Columbia River whose destruction alters a tribe's status. It
    then begins a myth of a boy who disobeys his mother's warning not to shoot upward,
    makes a chain of arrows to the sky, follows a sky road, and meets personified
    Nits, Body-Lice, Fleas, Ground-Squirrel people with darkness bundles, and arrow-wounded
    beings pursued by men who call him son-in-law.
  language: English
  quote_policy: summarized
