canonical_text:
  quote: ''
  summary: The passage contains two Coyote episodes. In the first, a mouthless man
    points at and scolds Coyote, rejects cooked sturgeon by sniffing and throwing
    it away, and receives a mouth when Coyote secretly cuts one open with flint; Coyote
    then makes mouths for a mouthless village, names the place Nimicxa'ya, and refuses
    a woman offered to him. In the second, Coyote meets a man whose feet and legs
    are entangled with wood while gathering fuel for his wife who is said to be near
    childbirth; Coyote teaches him how to carry wood, removes a thorn from the woman's
    finger, demonstrates intercourse, and the woman conceives and gives birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person repeatedly points at Coyote with his finger, and the pointing follows
    Coyote no matter which way he dodges.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The person is described as having no mouth, only a nose, eyes, and ears, and
    he speaks or scolds through his nose.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Coyote makes a fire, heats stones, cuts up a sturgeon, lays it on the stones,
    and steams it until done.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mouthless man takes the cooked sturgeon, sniffs it, throws it away, and
    repeats the action.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Coyote secretly chips a flint into a sharp knife-like edge and uses it to
    slice open a mouth for the man; blood flows, and Coyote tells him to wash in the
    river.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After washing, the newly mouthed man speaks to Coyote about the sturgeon,
    and Coyote replies that he thought the man wanted the sturgeon and might kill
    him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: All the people of the same village are said to have been without mouths; Coyote
    makes mouths for them, names the land Nimicxa'ya, and refuses their offer of a
    woman.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Coyote travels up the river and meets a man with tied feet and legs full of
    pieces of wood; the man is turning somersaults, standing on his head, and crying
    because his wife is soon to have a child and he came for wood.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Coyote disentangles the man, orders the pieces of wood, ties them with a hazel-bush
    rope, and teaches the man how to carry wood properly.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: Coyote examines the woman and finds that one hand is covered; a small thorn
    with white pus is stuck in her little finger.
  category: object
  evidence_refs:
  - ev:11
- id: obs:11
  text: Coyote turns over the swelling, bursts it, and pulls out the thorn from the
    woman's finger.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Coyote says the thorn is not pregnancy, demonstrates copulation with the woman,
    and the woman becomes pregnant and gives birth; Coyote tells the man that the
    infant is his child and instructs the village to act in this way.
  category: sequence
  evidence_refs:
  - ev:12
