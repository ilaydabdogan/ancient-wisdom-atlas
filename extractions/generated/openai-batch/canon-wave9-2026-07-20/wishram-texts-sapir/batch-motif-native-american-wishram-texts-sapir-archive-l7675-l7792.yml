  quote: ''
  summary: The passage recounts repeated failed hunts against a deceptive bear who
    supplies false leaf arrow-points and kills four brothers. The youngest brother
    receives warning and instructions from Meadow-Lark, obtains real rattlesnake-tooth
    arrow-points from a mountain source, rejects the bear’s false points, and kills
    the bear with help from birds and other animals. The passage then begins another
    tale in which five girls look at five stars and each wishes for one as a husband.
