canonical_text:
  quote: ''
  summary: A sequence of beings sing in a communal setting. Grizzly Bear and Rattlesnake
    threaten challengers but are verbally countered. Crow catches and eats a salmon
    during a storm brought by West Wind; Bald Eagle takes the salmon, strikes Crow
    with a fish-gill, and the passage explains Crow's black color and Bald Eagle's
    white head. In the following section, Coyote participates in fighting, captures
    a flea and the West Wind as slaves, returns home by canoe, and loses the older
    slave during the night after the slave breathes and loosens Coyote's house.
  language: English
  quote_policy: summarized
