candidate_motifs:
- id: motif:1
  label: communal singing used to affect weather
  taxonomy_refs: []
  basis: The passage states that everyone was singing, calling the West Wind, and
    trying to make warm weather because they were cold.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explain the ritual rules or whether the singing successfully
    causes warmth.
- id: motif:2
  label: etiology of animal coloration
  taxonomy_refs: []
  basis: Crow becomes black after being struck with a fish-gill and covered in black
    blood, while Bald Eagle becomes white about the head; the text links these events
    to their present names and appearances.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The extraction identifies a narrative function, not a supplied taxonomy
    family.
- id: motif:3
  label: trickster captures or tries to control a natural force
  taxonomy_refs:
  - trickster_boundary
  basis: Coyote captures a child identified as the West Wind and makes him a slave;
    the title also identifies the episode as Coyote enslaving the West Wind.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage supports Coyote's unusual capture of the West Wind, but broader
    trickster classification depends on context outside this line range.
- id: motif:4
  label: small challenger neutralizes a threatening powerful being
  taxonomy_refs: []
  basis: A small man challenges Grizzly Bear and verbally threatens to kill him from
    inside his belly, after which Grizzly Bear proposes that they not kill each other.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The mechanism is verbal confrontation; no physical defeat occurs in the
    passage.
- id: motif:5
  label: counter-threat against venomous or dangerous being
  taxonomy_refs:
  - serpent
  basis: Rattlesnake threatens a challenger with cheat-grass and biting, while Raccoon
    challenges him and predicts Rattlesnake's eye-whitening and death.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The taxonomy reference is limited to Rattlesnake as a serpent figure;
    the passage does not develop a broader serpent cosmology.
- id: motif:6
  label: compressed or mashed being explains present small animal form
  taxonomy_refs: []
  basis: Apla'fali is mashed by people sitting in canoes and is then identified as
    small in the present day, with Chub as the present name.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The source note says the statement is unclear, so interpretation should
    be reviewed.
- id: motif:7
  label: captive being escapes through breath or wind-like force
  taxonomy_refs: []
  basis: The older slave breathes in the night, Coyote's house becomes loosened, and
    the slave disappears.
  evidence_refs:
  - ev:15
  confidence: medium
  cautions: The passage identifies the older slave as the flea rather than explicitly
    as wind; the exact meaning of the breathing episode is uncertain.
