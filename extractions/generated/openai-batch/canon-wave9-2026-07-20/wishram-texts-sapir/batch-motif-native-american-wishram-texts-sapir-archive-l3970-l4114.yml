canonical_text:
  quote: ''
  summary: A male protagonist deliberately goes in a direction he had been warned
    against and encounters an obstructing stick-like being, whom he injures and then
    heals. The injured woman, associated with Thunder, reveals that a woman in his
    household is not his mother and tells him where his cradle-board is hidden and
    how to burn that woman's children before going to an old man. He carries out the
    burning, makes five misleading tracks, and reaches an old man across a river.
    The old man is revealed as Crane; he helps him cross, purges bad food from him,
    feeds and clothes him, gives him weapons, and directs him to make an arrow ladder
    to the sky. In the sky the protagonist meets personified Lice, Nits, Graybacks,
    a carrier of nights who can make darkness and light by opening and closing a container,
    and a wounded dying person. An editorial note states that the myth likely continues
    like a Kathlamet correspondent.
  language: English
  quote_policy: summarized
