  evidence_refs:
  - ev:3
- id: obs:5
  text: Eagle tells Coyote that his mistake means the wives and sons have died permanently,
    although they would have returned to life if the required day had passed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Eagle''s speech generalizes the result: from then on, a person who dies will
