canonical_text:
  quote: ''
  summary: 'The passage closes a Coyote and Eagle episode in which Coyote obtains
    and opens a box containing their wives and sons, causing the women to escape and
    leading Eagle to declare that the dead will now die permanently instead of returning.
    It then begins an Eagle and Weasel episode: Weasel disobeys Eagle, pursues women,
    a Gayaba''xEm pursues with rattles, Eagle and Weasel hide in a cave, Weasel kills
    the pursuer by striking his nose, and the companions take the monster''s skin,
    head, and rattle.'
  language: English
  quote_policy: summarized
