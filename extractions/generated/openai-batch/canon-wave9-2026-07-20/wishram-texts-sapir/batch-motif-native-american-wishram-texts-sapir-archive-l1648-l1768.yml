canonical_text:
  quote: ''
  summary: The passage recounts the youngest wolf refusing to drink at the water and
    escaping after four wolves are killed. Salmon, described in the passage as Salmon's
    son, takes his father's wife, the Dove, removes five tiny wolves from her belly,
    kills them, and burns them. He travels with the woman by canoe, sleeps while she
    paddles, and is found covered with maggots; when she cries and wakes him, he transforms
    rocks and abandons her there. Later he overhears two ravens, appearing as old
    people, arguing about dividing parts of a woman/person they found among rocks.
    Salmon raises a wind, gives the ravens magic power, sends them to seek the woman,
    and hears that she is near death and thinned out.
  language: English
  quote_policy: summarized
