canonical_text:
  quote: ''
  summary: The passage recounts Panther and Wildcat fighting a sequence of Grizzly
    Bears who arrive with increasingly violent storms. Wildcat repeatedly helps Panther
    by cutting off the Bears' hind legs. In the final fight Panther and the fifth
    Bear struggle in the air until only bones and hearts remain; Wildcat burns the
    Bear's remains and puts Panther in water. Panther revives after five days and
    later turns the Bears' bodies into rocks associated with strength-giving spirits.
    Panther and Wildcat then separate and declare how they will help obedient young
    men. A following myth begins at La'daxat, where an old man summons five brothers
    and other young men to hunt a bear; the chief's arrow fails to penetrate the bear,
    and the bear devours him.
  language: English
  quote_policy: summarized
