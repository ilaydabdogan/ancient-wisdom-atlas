canonical_text:
  quote: ''
  summary: The passage contains the end of a story in which a boy living with a woman
    feeds his two grandmothers, then destroys hungry people who cross the river toward
    his house by raising wind and snow so they drown, leaving only the two old women.
    It then gives the tale of Coyote and Deer, where Deer repeatedly feeds Coyote
    with flesh cut from his own body and blood from his nose; when Deer visits Coyote,
    Coyote tries to imitate him by cutting his wife, but Deer stops him and provides
    food himself. The passage then begins Coyote and Skunk, where Coyote arranges
    Raven's doctoring of sick Skunk, uses pitch, releases Skunk's wind, kills small
    deer, and takes the fat ones.
  language: English
  quote_policy: summarized
