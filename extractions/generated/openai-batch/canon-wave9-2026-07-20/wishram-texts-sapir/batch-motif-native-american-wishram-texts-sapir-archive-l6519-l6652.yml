canonical_text:
  quote: ''
  summary: Coyote ignores a warning not to travel along the river, is swallowed by
    Itdi'xyan, consults his excrement-sisters, makes fire inside the belly, cuts Itdi'xyan's
    heart, and is expelled with other swallowed beings. A following episode begins
    in which Fish-Hawk feeds Coyote by diving through ice for fish; Coyote later imitates
    Fish-Hawk, strikes the ice, and is stunned. The passage ends as Coyote visits
    Mountain-Sheep.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Nixlu'idix, Coyote travels east up the river and five men run down from
    the northern hills to warn him not to go along the river because he will be swallowed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote dismisses the warning, later takes a long log across his shoulders
    as a protection, continues along the river, and calls for Itdi'xyan to swallow
    him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Coyote loses consciousness and revives in a dark place where he hears a bell-like
    sound and whispering voices.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Inside the dark place, Coyote mistakes people's hair for grass, their bodies
    for large pieces of wood, and their bones for smaller wood.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Coyote brings out two pieces of his own excrement, called his two sisters
    or two Cayuse girls, and asks them where he is.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After Coyote threatens to make rain with spittle, the two sisters tell him
    that he ignored the five men's advice and is in the belly of Itdi'xyan.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Coyote makes a fire with his fire-drill, using pitch from the log on his back,
    and sees remains of people, some with canoes and some without.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Coyote calls those able to come to the fire; Eagle comes, and Weasel, identified
    as Eagle's younger brother, also comes.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Itdi'xyan asks Coyote to come out and says he did not want to swallow him,
    but Coyote says there is no door.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Coyote sees Itdi'xyan's heart moving above him, makes a ladder from two canoes,
    climbs up, and cuts the root of the heart with a flint knife.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Coyote tells all the people to lock arms; when the cut heart drops, Itdi'xyan
    blows out the people near Celilo and throws Coyote farther south over the Celilo
    hills.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: After the expulsion, Eagle goes west and Coyote goes east.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: In the next episode, Coyote is hungry and visits Fish-Hawk and his wife, who
    give him food repeatedly.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Fish-Hawk jumps from a stump through a hole in the ice into the water and
    returns with five different kinds of fish for Coyote.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: When Fish-Hawk later visits Coyote, Coyote tries to imitate Fish-Hawk's dive,
