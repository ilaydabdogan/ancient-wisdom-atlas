canonical_text:
  quote: ''
  summary: The passage contains two non-mythical narratives. In the first, Wishram
    people quarrel over the source of a duck's sound, fight, guard fishermen during
    the conflict, and one party later leaves in disgrace, carrying cedar planks and
    moving through a named route in search of better country with salmon and deer.
    The narrator comments on remembered cedar boards and on present Wishram belief
    about a distant Wishram group. In the second, Louis Simpson recounts service in
    the Paiute War and reports an order to kill and mutilate Paiutes, naming two Paiute
    chiefs.
  language: English
  quote_policy: summarized
