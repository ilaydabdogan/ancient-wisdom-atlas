  quote: ''
  summary: The passage describes Wishram customs for marriage purchase and return
    gifts, childhood ear-piercing and forehead flattening with communal gifts, mourning
    for pregnancy loss and deaths, burial-vault deposition, and initial payment and
    evaluation by medicine-men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The account is framed as told by the bridegroom's father, who announces that
    he will give bridal purchase-money for his son's intended wife.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bridal purchase includes three slaves and two fast-running horses given
    in return for the daughter.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Return wedding-gifts are brought back to the bridegroom's father, including
    a tanned elk-skin, an ox-hide blanket, and two blankets.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bridegroom's relatives go to meet the wife at her house; the son remains
    with his wife and in-laws, and later the couple are brought back to live with
    the narrator.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When a child is born, people assemble in the house, food is prepared, and
    the baby is given to an old man for ear-piercing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The old man pierces five holes in each of the child's ears if he knows how
    to do the operation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A tanned elk-skin is spread under the baby during the ear-piercing and is
    later cut into moccasin portions for distribution.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Small baskets, horse-hair rope, and twined basket-bags are distributed to
    the people, especially old people, after the ear-piercing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Beads are strung through the pierced ear holes; a child without pierced ears
    would be laughed at.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A head-flattener is placed on the child's forehead; a child without a flattened
    forehead would be laughed at.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: If a woman dies with a child in her womb, people mourn for five days and refrain
    from swallowing anything during the day despite having food.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A deceased young man is adorned with fish-bone beads, shell beads, glass beads,
    and brass square-holed coins, and people mourn for ten days.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A deceased virgin woman is adorned with woven cloth, beads, and bracelets;
    her mother, father, and relatives cut their hair.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A dead person is carried to a burial vault and deposited among the dead while
    many people follow.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: A sick person considers hiring a good medicine-man and gives payment; one
    medicine-man says he cannot make the sick person well because the illness is too
    severe, and another medicine-man is then taken.
  category: sequence
  evidence_refs:
  - ev:10
