canonical_text:
  quote: ''
  summary: Coyote and Eagle travel to recover their dead wives and sons. They reach
    a vast river separating them from ghost people. Eagle uses a flute, instructs
    Coyote not to look during the crossing, and carries him, but Coyote looks and
    they fall into the water before reaching land. In the place of the dead, a figure
    named Nikciamtca'c swallows the moon. Coyote kills and skins Nikciamtca'c, wears
    the skin, imitates the moon-swallowing act, and helps hide the wives and sons
    in a box. Eagle carries the box as they start home.
  language: English
  quote_policy: summarized
