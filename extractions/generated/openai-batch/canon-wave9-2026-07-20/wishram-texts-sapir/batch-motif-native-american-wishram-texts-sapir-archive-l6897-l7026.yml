canonical_text:
  quote: ''
  summary: The passage contains the close of one narrative in which a boy escapes
    from sisters with Old Crane's help and the last surviving sister is drowned at
    a river crossing; a Jack-Rabbit boy narrative in which a man-eating striped woman
    is tricked, robbed of her dress, lured onto lake ice, and drowned; and the beginning
    of a narrative in which a crying boy pulls off the striped painted arm of an At!at!a'lia
    reaching through a smoke-hole.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old Crane stretches his leg across a wide river as a crossing and warns the
    boy not to step on his knee.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old Crane tells the boy that he belongs to a far-away people, instructs him
    to escape, to make five creeks and thick choke-cherry bushes at the last creek,
    and to take a baby-board and little blanket hanging on a tree.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy tells the sisters about choke-cherries; the sisters cross five creeks,
    eat many berries, and then find blood in their baskets and on their blankets while
    blood runs from their mouths.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boy makes the sun very hot, all streams dry up, four sisters die, and
    the youngest reaches home to find the house burned and the boy gone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The youngest sister accuses Old Crane, asks him to ferry her over, intends
    to eat him, steps on his knee in midstream, and drowns when he turns his leg.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Jack-Rabbit boy playing below Wasco near a sand-bank meets a stripe-painted
    woman who is human-like, three times the size of present-day people, and lives
    on people; she tries to catch him and follows him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Jack-Rabbit boy hides in a mountain-sheep horn on a rock; the woman cannot
    reach him, waits with her back to the sun, and becomes covered with wood-ticks
    inside her robe.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Jack-Rabbit boy changes his appearance at the horn opening, making the
    woman laugh; when she puts her dress over the horn to catch him, he escapes and
    runs away with the dress.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Jack-Rabbit boy makes ice over a lake, throws the woman's dress into the
    middle, convinces her the ice is strong, then makes the ice thin and break so
    that she sinks and drowns.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: At Wasco, a crying boy left near the fire sees a striped painted arm reach
    through the smoke-hole, pull at him, and reach to the ground; he struggles, pulls
    the arm off, throws it by the fire, and the old At!at!a'tia reports losing her
    arm to four sisters.
  category: sequence
  evidence_refs:
  - ev:10
