canonical_text:
  quote: ''
  summary: 'A sequence of Coyote episodes: Coyote makes a fish-trap for white salmon
    and sets a precedent for catching them; later he retrieves water, makes a salmon-spear,
    catches and eats fish, and states that people will obtain salmon in that land.
    He eats dried salmon, dies after a swallowed flea kills him, and names a place
    Dried Salmon. In another episode he performs an obscene self-directed act, tries
    to lock up the story of it, but the story escapes and becomes known among the
    people; a note explains clouds as carriers of the story and identifies a mountain
    called Story.'
  language: English
  quote_policy: summarized
