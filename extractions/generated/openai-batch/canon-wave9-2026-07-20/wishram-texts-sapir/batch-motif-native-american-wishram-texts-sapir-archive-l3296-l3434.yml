canonical_text:
  quote: ''
  summary: 'The passage first finishes a tale in which Eagle kills Fish-Hawk and a
    woman he accuses of abandoning him as a child; Coyote discovers the bodies, but
    a planned fight fails because Mouse and Rat have destroyed the weapons. It then
    begins “The Deserted Boy”: a boy is abandoned at a reed-gathering place across
    the river, finds fire, string, and cached food, makes traps and a feathered blanket,
    fishes in five cycles until he becomes a man, receives fish-food from ItclE''xyan''s
    daughter, wakes with her in a decorated house, and marries her.'
  language: English
  quote_policy: summarized
