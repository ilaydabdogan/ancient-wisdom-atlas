- id: obs:4
  text: Coyote calls for bows and arrows for a fight, but the weapons lack bowstrings,
    feathers, and arrow-points because Mouse and Rat had eaten them during the night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: People take a boy considered bad to gather reeds and arrange to abandon him
    there, instructing the reeds to answer if he calls.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people run home across the river, leaving the boy alone; he calls, receives
