  evidence_refs:
  - ev:5
- id: obs:7
  text: The boy sees a small fire in a shell, takes it, and builds up a fire.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boy finds a little string and five “Indian potatoes” in a cache and thinks
    his grandmothers saved the potatoes, fire, and string for him.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The boy makes a fish-line and trap from the string, traps magpies, and makes
    a magpie-skin blanket that he wears and sleeps in.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The boy fishes five times, catching increasing numbers of suckers and eating
    or saving portions; by the fifth fishing he has become a full-grown man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The boy finds ground roasted fish in a hollow vessel at his fish-line, sings
    about his feathered cloak, and the passage states that ItclE'xyan's virgin daughter
    had given him food.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After sleeping through the fifth night, the boy wakes with a beautiful woman,
    sees a painted house and a mountain-sheep blanket, and the passage says the woman
    is ItclE'xyan's daughter who brought abundant fish and became his wife.
  category: sequence
  evidence_refs:
  - ev:9
