canonical_text:
  quote: ''
  summary: 'The passage contains several Coyote episodes: Mountain-Sheep produces
    food from his wife''s nose and body, Coyote unsuccessfully imitates this with
    his own wife, Coyote kills the Deer brothers after warning them about Wala''lap
    tracks, Coyote escapes Wolves after making horned running dogs for a race, a rolling
    rock pursues him until it sticks in mud, and a buffalo-cow rewards him for not
    taking her bones by giving him meat from her own body. The passage then begins
    a tale in which two Ikinickwai siblings gathering flint are captured by a large
    child-eating At!at!a''lia in a basket.'
  language: English
  quote_policy: summarized
