canonical_text:
  quote: ''
  summary: 'The passage closes an episode in which East-Wind sings in an underground
    lodge until ice forms and the Thunder brothers freeze; the youngest Thunder brother
    escapes, and dead elder brothers are revived from bones by a fivefold stepping
    act. It then begins the story of Eagle''s son: Coyote''s daughter leaves Eagle,
    abandons their child along the trail, and later marries Fish-Hawk. Eagle rescues
    and raises the child. As an adult, Eagle''s son visits Coyote''s village with
    followers and Jack Rabbit; Jack Rabbit defeats Fish-Hawk in a race after rain
    and Eagle''s supernatural intervention. Eagle then orders Mouse and Rat to damage
    weapons, and Mouse scouts the sleeping couple before Eagle approaches to kill
    them.'
  language: English
  quote_policy: summarized
