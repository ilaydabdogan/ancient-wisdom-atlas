canonical_text:
  quote: ''
  summary: 'The passage records shared sign-knowledge involving rainbows and the moon:
    two rainbows signify twins; particular moon-and-star or moon-and-rainbow appearances
    signify widowhood, death, secret murder, or frost, and people avoid pointing at
    a bright winter moon. It then gives a Shaker table grace invoking Mary, spiritual
    medicine or light, and Father, Son, and Holy Ghost, followed by editorial notes
    on Wishram Shaker religious texts.'
  language: English
  quote_policy: summarized
literal_observations:
