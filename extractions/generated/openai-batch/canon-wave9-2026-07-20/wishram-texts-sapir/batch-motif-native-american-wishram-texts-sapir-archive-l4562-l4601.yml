- id: obs:3
  text: A night moon with one star closely following to one side is said to signify
    that a woman will soon become a widow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A moon with two following stars is said to signify that a woman and her two
    children will die.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A daylight moon with a rainbow around it is said to signify that someone will
    be secretly murdered.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the winter moon shines very brightly, people go out and see it plainly,
