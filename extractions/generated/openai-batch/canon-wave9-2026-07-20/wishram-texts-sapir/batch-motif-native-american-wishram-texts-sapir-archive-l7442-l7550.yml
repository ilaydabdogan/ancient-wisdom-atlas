canonical_text:
  quote: ''
  summary: 'The passage concludes a revenge narrative in which two sons seek guardian
    spirits, gain grizzly-bear and fire powers, find their father''s head at The Dalles,
    defeat the chief''s messengers, win back and revive their father''s body, and
    destroy the village with their powers. It then begins the myth of Panther and
    Wildcat: Wildcat disobeys Panther''s order not to eat a buck shin-bone, extinguishes
    the fire, crosses the Columbia River to steal firebrands from two old blind sisters,
    restores the fire, and prepares with Panther for the arrival of the old Grizzly
    who demands to know who stole the fire.'
  language: English
  quote_policy: summarized
