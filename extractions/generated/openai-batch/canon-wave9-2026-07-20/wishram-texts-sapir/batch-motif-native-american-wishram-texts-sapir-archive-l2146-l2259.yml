canonical_text:
  quote: ''
  summary: 'After winning at gambling bones, Eagle, Bluejay, Beaver, and companions
    are subjected to a series of contests and ordeals: a sealed stone sweat-house,
    an endurance game with falling trees, a task involving five grizzly bears, and
    wrestling on a rope over water. Beaver creates water inside the sweat-house, the
    group deceives the outside people with splashing stones, Eagle uses magic in later
    contests, and Bluejay repeatedly kills opponents or spectators with his battle-ax.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After winning at gambling bones, Bluejay kills people by striking them with
    his battle-ax.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The visitors are directed to a sweat-house built entirely of stones, heated
    below, and covered with five stones after they enter.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Eagle says that they have died, and Beaver says water will be seen.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Beaver turns somersaults five times, first bringing water onto the ground
    and then producing a lake in which they bathe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Five small stones are thrown into the water to make splashing sounds, and
    the people outside interpret the sounds as evidence that Bluejay, Eagle, and the
    younger brothers have died.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the five covering stones are removed, Bluejay is seated in the doorway
    with his battle-ax, rushes out, and kills people; the group exits alive.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the endurance contest called waqi'lukck, Beaver covers his belly with sticks,
    lies belly-up, and remains unharmed when a cedar tree falls onto him and breaks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Eagle exercises magic on the cottonwood tree so that it becomes strong and
    heavy; it falls on Black Bear, whose belly and body burst, and Black Bear dies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When told to fetch a maiden's tiny little dogs, the group finds five grizzly
    bears; Eagle makes them small, and each of the five takes one.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The grizzly bears fight inside the house, are returned to their place, and
    Bluejay again kills people after the task is completed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In a wrestling contest on a rope stretched across the water, Bluejay wrestles
    Squirrel, strikes Squirrel with his battle-ax, and Squirrel dies and drifts downstream.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After returning to land from the rope contest, Bluejay kills the people again.
  category: action
  evidence_refs:
  - ev:8
