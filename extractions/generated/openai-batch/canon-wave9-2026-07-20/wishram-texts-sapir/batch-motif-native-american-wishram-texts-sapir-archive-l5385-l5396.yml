canonical_text:
  quote: '"Strange people will bring us such things. White people with mustaches on
    their faces will come from the east. Do you people be careful!"'
  summary: A group dances for days and nights without hunger. During or after the
    dancing, they see items such as an ax, hatchet, knife, and stove, and a speaker
    foretells the coming of white people with mustaches from the east who will bring
    such things. The narration says this later proved true and identifies the vision
    as the old man's dream. It notes that before then there were no cattle or horses,
    only dogs locally, with buffaloes farther upstream, and says this happened long
    ago among river-dwelling people.
