  quote: ''
  summary: The passage includes a fishing-possession episode, a section on training
    a boy for strength at Cascades through commanded labor, a section on winter bathing
    after falling asleep during myth-telling, and the start of a section on rainbow
    signs connected with birth and weather.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a dip-net fishing place, other people who have come for fish can tap, kill,
    and take fish left on the staging; the fisherman can make the fish belong to himself
    by slapping himself on the buttocks, after which the others sit squatting.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A boy seeking strength travels over varied land and mountains and carries
    a command given by the person training him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The trainer sends the boy to carry and pile rocks in an assigned quantity;
    if the boy falls short, he must repeat the task the next evening until the order
    is fulfilled.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: An appointed inspector looks after the work of those who are training.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: For another strength command, the boy goes out at night to make twisted wood-ropes
    from oak saplings; the inspector checks and reports how many were made.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In winter, old men told myths; a boy who fell asleep before the end was awakened
    afterward and ordered to go bathing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The bathing boy is naked by ice, given an ax to chop through it, and instructed
    to dive, emerge, face several directions and the sky, and shout “wa!”
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After returning from the bath with icicles on his hair, the boy is told not
    to look at the fire but to turn his buttocks toward it so that it will blow at
    him and make him grow quickly.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The narrator states that this was done so that one would not be sick, would
    be strong, or would be prepared for a guardian spirit; he says he was strong and
    not sick but never saw a guardian spirit.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: When the river has no ice, ice may still be present in canoe or boat water,
    and that same water can be used for bathing.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: Among river-dwellers, an appearing rainbow is a sign that a woman will give
    birth, and good or bad rainbows are linked with predicted heat, coolness, snow,
    rain, wind, or warmth.
  category: speech
  evidence_refs:
  - ev:11
