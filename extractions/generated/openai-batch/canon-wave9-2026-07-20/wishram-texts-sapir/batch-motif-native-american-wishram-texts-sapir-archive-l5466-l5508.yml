canonical_text:
  quote: ''
  summary: A short Clackamas tale tells of a boy whose head is scarred when a stick
    runs into him while he gathers wood. Later his father finds the scar, questions
    and whips him. The boy says a deer struck him with its horns; after being told
    to bathe, he does so. When older, he has no success seeing elks while hunting,
    and the translation explains this as a consequence of falsely accusing them of
    causing the scar. The passage also includes an editorial note comparing Clackamas
    linguistically with Kathlamet and Wishram-Wasco.
  language: English
  quote_policy: summarized
