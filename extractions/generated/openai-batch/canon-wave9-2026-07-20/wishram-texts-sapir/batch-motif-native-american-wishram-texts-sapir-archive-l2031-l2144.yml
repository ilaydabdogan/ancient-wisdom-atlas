canonical_text:
  quote: ''
  summary: 'Eagle and his younger brothers, after being dragged in a canoe by a seal,
    encounter a woman who is that seal and who has gathered their claws and teeth.
    Bluejay is sent to retrieve them. The seal-woman takes the brothers through a
    sequence of dangerous hospitality: human eye-balls called huckleberries, brains
    called stew, a dead hand used as a comb, and a smoky house fueled by dead men''s
    bones. Eagle shields his brothers, and an unidentified bird-person swallows the
    smoke so they survive. Squirrel then feeds them proper food. The brothers enter
    a gambling contest at bones against Rabbit and Crab; Eagle guesses Rabbit and
    Crab, causing bodily injuries. Crab is burned red and goes to live in the water
    permanently.'
  language: English
  quote_policy: summarized
