canonical_text:
  quote: ''
  summary: The passage gives two versions of a Coyote episode in which two women across
    a river invite him and evade him as he swims toward them; one version ends with
    Coyote declaring them water-birds, while Tom Simpson's version ends with them
    becoming rocks. A second episode, titled "Coyote as Medicine-Man," describes Coyote
    borrowing an old man's rope-like penis, using it underwater among women, causing
    one woman to become ill, advising the women to cut it off with a split stone,
    and later being summoned as a medicine-man after Raven fails to find sickness
    in her body. Coyote demands five husbandless women as carriers and pretends red
    spittle is blood.
  language: English
  quote_policy: summarized
