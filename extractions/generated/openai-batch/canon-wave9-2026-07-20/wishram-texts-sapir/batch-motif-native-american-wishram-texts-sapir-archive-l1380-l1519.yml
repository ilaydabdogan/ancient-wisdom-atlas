canonical_text:
  quote: ''
  summary: 'The passage recounts Coyote’s contest with a mountain monster, the monster’s
    rupture, and Coyote’s making of peoples from the monster’s body, tongue, and blood.
    It then tells how Coyote follows the female Sun, sees hidden human actions, and
    is rejected because he would reveal secrets. The opening of the Salmon story follows:
    Salmon is killed and eaten by five wolves, Coyote, and Skunk; one egg survives,
    enters the Great River, grows into Salmon, and begins seeking his father’s killers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote and the mountain monster repeatedly try to draw each other by drawing
    in breath; Coyote rises higher, his rope nearly snaps, and the hill is said to
    be worn where the rope was tied.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote draws in his breath until the mountain monster groans, his belly bursts,
    and his guts spill out; the passage explains that the monster lies on his belly
    because turning over would burst him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Coyote skins the mountain monster and makes people by cutting off pieces of
    flesh and throwing them away, with each act producing a village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When no flesh remains, Coyote uses the tongue to make the Wishram people;
    the passage connects this with a statement that Wishram heads are flat like a
    tongue.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Coyote wipes blood from his hands with grass and throws it away; the passage
    says the Nez Perces people came from this and are described as brave and dangerous
    warriors.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Coyote goes to the Sun, asks to be her slave and follower, says he will work
    for nothing, and calls her chieftainess; she accepts him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: While following the Sun, Coyote sees human actions including elopements, thefts,
    bad acts, and killings, and cries out that he sees what people are doing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Sun rejects Coyote, saying he has been taken along long enough, is too
    mean, and would tell on people; the passage says people would have all secrets
    betrayed if Coyote had become the Sun.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Five wolves, Coyote, and Skunk kill Salmon, seize Salmon’s wife, eat Salmon,
    and one of Salmon’s eggs drops down.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Rain loosens the dropped egg, it moves to the river, floats in the Great River,
    grows into a salmon, and becomes strong.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The grown Salmon goes to seek those who killed his father, meets a woman on
    the trail, opens her apron, and after she objects beautifies the apron with dentalium
    shells.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The trail woman tells Salmon where Coyote and Skunk live and where the five
    wolves dwell farther away.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Salmon arrives at the underground lodge where Coyote and Skunk live; they
    had said he would not come, but when they see him they cry, and Coyote says he
    and Skunk have always wept since Salmon’s father died.
  category: sequence
  evidence_refs:
  - ev:11
