canonical_text:
  quote: ''
  summary: 'Coyote and his companion enter contests at successive villages: a footrace
    against Magpie, which they lose, and a bone-gambling episode in which Coyote deceives
    people with cottonwood-leaf blankets and wins. Coyote and East-Wind then separate
    toward opposite sun directions. East-Wind is directed by an old woman to an underground
    lodge where the Thunder brothers sing; their songs make the lodge increasingly
    warm, smoky, and fiery, but East-Wind remains seated and asks them to continue
    until they refuse.'
  language: English
  quote_policy: summarized
