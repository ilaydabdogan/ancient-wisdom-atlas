canonical_text:
  quote: ''
  summary: 'The passage closes an Eagle and Weasel fragment in which Weasel wears
    the skin of Gayaba''xEm, Eagle removes it by supernatural power, and Weasel unsuccessfully
    tries to kill Eagle with arrows. An editorial note compares the fragment generally
    with a Kathlamet Mink myth. The next myth begins with five East-Wind brothers:
    elder brothers depart one by one to find an assembly, receive warning from an
    old woman about destructive Thunder brothers, and do not return. The youngest
    meets Coyote, travels with him, and Coyote loses everything in a gambling-bones
    game.'
  language: English
  quote_policy: summarized
