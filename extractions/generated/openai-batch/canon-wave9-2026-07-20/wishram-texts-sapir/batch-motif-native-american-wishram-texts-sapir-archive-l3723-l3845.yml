canonical_text:
  quote: ''
  summary: Raccoon deceives at a food cache, is later punished by his paternal grandmother,
    and leaves crying while other people mock him. He comes to food-bearing trees
    and eats berries. His grandmother regrets whipping him and searches for him. Raccoon
    remains silent, gives her thorn-filled berries, and she chokes, changes into Pheasant,
    and flies away. Raccoon is left alone, then meets Coyote, who warns him about
    dangerous wala'lap beings before Raccoon goes on toward Grizzly.
  language: English
  quote_policy: summarized
