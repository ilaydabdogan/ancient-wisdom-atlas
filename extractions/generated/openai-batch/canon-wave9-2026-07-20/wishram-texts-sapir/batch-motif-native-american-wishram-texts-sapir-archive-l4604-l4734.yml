canonical_text:
  quote: ''
  summary: The passage contains several letters concerning land allotment timing,
    illness, a son’s death and burial, medical efforts by white and Indian doctors,
    grief, salmon drying, cannery work, fish scarcity, and a planned trip to a huckleberry
    patch. It ends with an editorial heading and note introducing a non-mythical narrative
    classified as pseudo-historical despite being described as mythical.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One letter-writer reports receiving a letter about the allotment agent being
    away and asks whether waiting until fall will still allow time to change land.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same letter-writer says she is not bedridden sick but does not feel well.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Another letter-writer says they started for home, arrived Tuesday at ten o’clock,
    and found their poor boy still alive but expected him not to live another day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A white doctor is reported to have said the boy could not live, while Indian
    doctors are described as working on or helping him.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The parent-writer says they will write again if the son dies and asks that
    people who know them be told about the poor son.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A later letter states that the son passed away on May 4 at 2:30 P.M. after
    the writer had stayed with him eight days, and that burial would occur the next
    day.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The bereaved parent describes a broken heart, expresses a wish to kill themself,
    says the lost son was their only sweet son, and says they do not care for their
    life.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The bereaved parent says they tried to save the son by obtaining a white doctor
    and three Indian doctors, but the doctors failed to cure him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A later letter reports that people are well, the weather is warm, only a few
    salmon-heads were dried, and several relatives or acquaintances took some.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The same letter reports cannery work, a salmon-poison injury in A.’s thumb,
    few fish in the river, an expected cannery closure, and a planned trip to the
    huckleberry patch.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage ends by introducing a section titled non-mythical narratives and
    a narrative called “A Quarrel of the Wishram”; an editorial note says the tale
    is purely mythical but separated because of its pseudo-historical character.
  category: other
  evidence_refs:
  - ev:7
