canonical_text:
  quote: ''
  summary: The passage contains the end of a Raccoon, Coyote, and Grizzly-Bear trickster
    episode, followed by the beginning of the myth 'The Boy That Was Stolen by Atlat'a'liya.'
    Raccoon tricks Grizzly-Bear into injuring his nose and flees to Coyote, who uses
    a black-nosed grasshopper, magical transformation, vomiting, hot stones, water,
    and an elder-bush tube to deceive Grizzly-Bear; Grizzly-Bear imitates the trick
    and dies, after which Coyote skins and eats him. In the next myth, a chief's wife
    leaves her child while cutting grass; the child disappears, leaving a single basket-striped
    track. Atlat'a'liya has stolen the boy, first intending him as food for her children,
    but then raises him. The boy grows quickly, notices that Atlat'a'liya's striped
    children differ from his human flesh, hunts with arrows, and is repeatedly warned
    not to go in a certain direction. Editorial notes compare the material with Kathlamet
    Texts and identify the boy-stolen story as a variant of a Kathlamet myth.
  language: English
  quote_policy: summarized
