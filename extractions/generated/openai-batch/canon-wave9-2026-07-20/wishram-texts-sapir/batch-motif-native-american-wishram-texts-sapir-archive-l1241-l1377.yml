canonical_text:
  quote: ''
  summary: Coyote encounters Owl, throws ashes at him, names him Owl, and declares
    that owl hooting will foretell death. Coyote then travels to Sk'in and the Falls,
    acts against the people there, and names the Hka'imamt, instructing them to shout
    when crossing. He next hears of a Merman who swallows canoes and people, lets
    himself be swallowed, reaches the underwater bottom, cuts off the Merman's hanging
    heart, and causes the swallowed people and canoes to rise to the surface. The
    passage then begins a Lapwai episode in which Coyote approaches a mountain monster
    that swallows anything passing above or below it; Coyote makes hazel-bush ropes,
    ties himself to a hill, challenges the monster to a swallowing contest, and the
    monster begins to draw him in by breath.
  language: English
  quote_policy: summarized
