canonical_text:
  quote: ''
  summary: Coyote receives what is presented as a woman’s ugly flesh, does not swallow
    it, saves some in his quiver, and later finds salmon there. In a following episode,
    Coyote hears that Atlatla'lia and Owl steal people, disguises himself with rattling
    rushes, deceives Atlatla'lia into accepting pitch and fire as a strengthening
    treatment, has people apply pitch to her, pushes her into a furnace, and she burns
    to death. The people are then sent home.
  language: English
  quote_policy: summarized
