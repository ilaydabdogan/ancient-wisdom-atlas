  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: During famine, a man sends his wife to his elder sister for food; the wife
    gives a sea-shell necklace and receives dried pounded salmon and dried fish-skin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The husband tells his wife not to give the food to their children and to put
