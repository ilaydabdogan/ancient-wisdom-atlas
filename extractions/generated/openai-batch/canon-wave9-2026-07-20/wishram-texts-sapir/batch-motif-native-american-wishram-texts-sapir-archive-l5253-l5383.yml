  summary: The passage contains the end of a Wasco-Paiute war account, a famine narrative
    at the Cascades involving hidden food, fishing, deaths, and public blame for stinginess,
    and a prophecy narrative in which an old man dreams of strange people and foretells
    guns, metal boiling vessels, and matches.
