  source_text_path: texts/public-domain/native-american-plateau/project-gutenberg/wishram-texts-sapir.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 5761-5767
  quote_or_summary: The man became a skeleton with only his heart hanging in his body,
    ate all the people in the next village, and could not be killed because nothing
    penetrated his bones.
  source_text_path: texts/public-domain/native-american-plateau/project-gutenberg/wishram-texts-sapir.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 5768-5776
  quote_or_summary: His wife escaped carrying a little son and traveled on grass-blade
    tops so he could not track her for a long time; later he found the tracks and
    she knew it.
  source_text_path: texts/public-domain/native-american-plateau/project-gutenberg/wishram-texts-sapir.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 5777-5784
  quote_or_summary: The wife hurried to a blue mountain, entered a house at its foot,
    and saw a very old man making bows and arrows and his daughter making tobacco-sacks.
  source_text_path: texts/public-domain/native-american-plateau/project-gutenberg/wishram-texts-sapir.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 5785-5801
  quote_or_summary: A terrible north wind blew; the old man told the wife to hide
    behind him; the skeleton entered with a frightful wind, walked around the fire,
    broke the old man's arrows, and was killed when the old man thrust a long arrow-point
    into its heart.
  source_text_path: texts/public-domain/native-american-plateau/project-gutenberg/wishram-texts-sapir.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 5801-5804
  quote_or_summary: The skeleton fell to the ground as a pile of bones, the wind stopped,
    and the old man told the wife to throw the bones outdoors.
  source_text_path: texts/public-domain/native-american-plateau/project-gutenberg/wishram-texts-sapir.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 5805-5815
  quote_or_summary: Tobacco grew above the old man's house; he made arrow-points,
