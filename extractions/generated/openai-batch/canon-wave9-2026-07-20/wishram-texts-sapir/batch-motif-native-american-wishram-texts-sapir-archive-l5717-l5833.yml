  source_text_path: texts/public-domain/native-american-plateau/project-gutenberg/wishram-texts-sapir.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 5752-5761
  quote_or_summary: In the tale titled 'An Arrow-Point Maker Becomes a Cannibal,'
    an arrow-point maker cut his finger with flint, tasted the blood, and ate his
