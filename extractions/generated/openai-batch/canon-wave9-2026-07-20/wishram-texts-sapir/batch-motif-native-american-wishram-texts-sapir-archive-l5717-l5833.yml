canonical_text:
  quote: ''
  summary: 'The passage contains a tale in which a snowbound community learns from
    a bird with a strawberry that summer exists elsewhere, identifies a girl who had
    struck a bird as the cause, buys her from her parents, and sends her away on floating
    ice; the snow then melts, and the girl later returns nearly reduced to bones,
    dies, revives, and thereafter experiences heat and cold in reverse seasons. It
    then gives the tale titled ''An Arrow-Point Maker Becomes a Cannibal'': an arrow-point
    maker tastes his own blood, consumes his own flesh until he is a skeleton with
    a heart, devours a village, and pursues his fleeing wife and son. The wife reaches
    a mountain house where an old man kills the skeleton by piercing its heart. The
    old man and daughter live on smoke and hunt Tobacco people; the boy later helps
    hunt tobacco and is declared the old man''s son-in-law, with a closing statement
    about future people giving daughters to good hunters.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the Cascades and The Dalles there was no snow, but one place was snowbound
    and its people did not know summer existed elsewhere.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A little bird brought a strawberry in its bill to an air-hole made through
    the snow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people determined that a girl in their village had struck a bird and treated
    this act as connected to the storm.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The people bought the girl from her parents after prolonged refusal, placed
    her on floating ice, and pushed the ice into the middle of the river.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the girl was sent away on the ice, a Chinook wind brought heat, the
    snow melted, and things began to grow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The girl floated day and night for five years and returned to the place where
    she had been put on the ice.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: When the girl returned, only a small piece of ice remained beneath her, and
    she was almost reduced to skin and bones.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The returned girl died after being taken into the village, later came back
    to life, and took a year before she could eat much.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Afterward, the girl was nearly frozen in summer and too warm in winter, reversing
    ordinary seasonal bodily response.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: An arrow-point maker cut his finger with flint, tasted the blood, and began
    eating his own body.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The arrow-point maker became a skeleton with only his heart hanging in his
    body and then ate all the people in the next village.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The skeleton could not be killed by ordinary attack because nothing would
