  source_text_path: texts/public-domain/native-american-plateau/project-gutenberg/wishram-texts-sapir.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 5816-5828
  quote_or_summary: After living there a long time, the boy followed the old man to
