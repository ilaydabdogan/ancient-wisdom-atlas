  evidence_refs:
  - ev:7
  confidence: high
  cautions: No provided taxonomy family directly matches this cannibal transformation.
- id: motif:6
  label: Invulnerable skeleton cannibal with vulnerable heart
  taxonomy_refs: []
  basis: The cannibal becomes a skeleton whose bones cannot be penetrated, but he
