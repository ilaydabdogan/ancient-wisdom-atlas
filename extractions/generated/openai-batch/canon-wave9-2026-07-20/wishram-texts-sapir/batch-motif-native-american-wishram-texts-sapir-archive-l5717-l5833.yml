candidate_motifs:
- id: motif:1
  label: Community expels a blamed girl to end abnormal snow
  taxonomy_refs:
  - sacrifice
  - seasonal_cycle
  basis: A snowbound community identifies the girl who struck a bird, buys her, places
    her on floating ice, and afterward the Chinook wind melts the snow.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage presents an expulsion/purchase rather than an explicit ritual
    sacrifice; taxonomy reference to sacrifice is functional and should be reviewed.
- id: motif:2
  label: Animal messenger reveals hidden season
  taxonomy_refs:
  - seasonal_cycle
  basis: A little bird carrying a strawberry shows the snowbound people that it is
    summer elsewhere.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The bird's action is literal in the tale; no speech by the bird is reported.
- id: motif:3
  label: Long river-ice exile followed by return, death, and revival
  taxonomy_refs:
  - departure
  - return
  - death_rebirth
  basis: The girl floats for five years on ice, returns nearly reduced to bones, dies,
    and later comes to life.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage states revival but does not describe the mechanism.
- id: motif:4
  label: Reversed seasonal bodily condition
  taxonomy_refs:
  - seasonal_cycle
  basis: After returning, the girl is cold in summer and hot in winter.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a bodily reversal tied to seasons; broader cosmological meaning
    is not stated.
- id: motif:5
  label: Self-cannibalization after tasting blood
  taxonomy_refs: []
  basis: The arrow-point maker tastes blood from a cut finger, likes it, and eats
