canonical_text:
  quote: ''
  summary: The passage narrates Coyote, called an old medicine-man, being carried
    by five sisters while bleeding and repeatedly committing sexual misconduct toward
    them, after which each throws him down. At the house of a sick girl or woman,
    he arranges singers and a rush screen, has sexual intercourse with the patient
    during treatment, a previously cut-off penis part rejoins, and she recovers; he
    then refuses marriage and leaves. A following episode begins with Coyote seeing
    a man diving from a canoe and collecting sturgeons; while the man is underwater,
    Coyote steals and hides one sturgeon.
  language: English
  quote_policy: summarized
