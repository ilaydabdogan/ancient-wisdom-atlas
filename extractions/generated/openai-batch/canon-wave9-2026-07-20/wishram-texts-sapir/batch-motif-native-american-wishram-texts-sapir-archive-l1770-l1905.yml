canonical_text:
  quote: ''
  summary: 'The passage first concludes a Salmon tale: two ravens are tested with
    stone burdens, sent to fetch a woman, carry her home on their interlocked wings,
    and Salmon restores her with oil, names her Dove his wife, and assigns the ravens
    their name and cry-sign. The passage then begins the Coyote and Antelope tale:
    Coyote''s children and Antelope''s two sons go to obtain a shinny-ball; Rabbit
    and Fox repeatedly pursue and kill Coyote''s children, while Antelope''s two sons
    later escape with the valuable ball through dark fog and reach mountain summits.'
  language: English
  quote_policy: summarized
