canonical_text:
  quote: ''
  summary: The passage first recounts Coyote arranging a dance, preparing a house
    with grass and pitch, restoring an arm to one of five Atlatla'lia women, and burning
    the women inside while silencing two young Atlatla'lia girls. It then begins a
    tale in which a Celilo woman, identified as an Atlatla'lia, repeatedly eats ducks
    meant for her relatives and substitutes dry cracked dirt as bread. When exposed
    by her husband's brothers, she becomes a grizzly bear, eats several brothers and
    villagers, and pursues her two sons. The sons twice make deceptive dancing villages
    from frogs, grass, reeds, mud, and swamp water, enabling their escape.
  language: English
  quote_policy: summarized
