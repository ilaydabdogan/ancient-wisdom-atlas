- id: ev:10
  type: summary
  locator: lines 6863-6874
  quote_or_summary: The boy grows to about twelve, hunts rabbits, squirrels, and other
    game, and is fed good food by the woman. The other sisters want to feed him frogs
    and snakes and eat him. He notices striped and spotted children. Sandhill Crane
    lives nearby, knows the situation, and is troubled.
  source_text_path: texts/public-domain/native-american-plateau/project-gutenberg/wishram-texts-sapir.md
  rights_note: Public domain source; summarized for extraction.
