canonical_text:
  quote: '"Your children are burning up!"'
  summary: An editorial note identifies the Atlat'a'lia tale as an Upper Chinook ogress
    type. The narrative segment describes two children escaping an ogress by tricking
    her with a false alarm, cutting their way out of a basket, replacing themselves
    with stones and dirt, and fleeing across rivers and the Columbia. A second tale
    begins with five At!at!a'lia sisters impersonating relatives to steal a boy; the
    youngest sister protects and raises him while the others repeatedly want to eat
    him. The passage ends as the boy disobeys a prohibition against hunting north
    and encounters Sandhill Crane across a creek.
  language: English
  quote_policy: quoted
