canonical_text:
  quote: ''
  summary: The passage includes an editorial note comparing the tale to myths of substitutes
    for an improperly behaving Sun, then narrates a woman with two boys, the younger
    a precocious Spider-child who sees distant events and contains reptiles in his
    stomach. After the reptiles are expelled, the mother equips both boys and sends
    them to kill Sun, whose unmoving overhead heat is deadly. The boys travel to the
    celestial region, kill Sun and Moon, and take their places as Sun and Moon. The
    passage ends by opening a new tale about five brothers at Mount Hood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An editorial note states that no published Chinookan cognates of the myth
    are known, that Sun and Moon are male here, and that the tale is connected with
    myths accounting for animals or people who become substitutes for a sun that does
    not behave properly.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman sends a boy repeatedly to an old man, receives the same kind of story
    five times, scolds the old man for not telling longer stories, becomes angry,
    and moves away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The younger boy speaks like an old man when not more than a year old, tells
    about things past and future, and has a very large stomach that sounds strangely
    like a bell when punched.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The elder boy is described as stupid, doing nothing but crying and laughing,
    and later drags the younger boy by the hair through sand and dirt.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The younger boy's father is Spider; the woman left Spider before the child
    was born, but the boy continually speaks as if he can see where his father is
    and what he is doing.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The child says his father will kill himself by heating rocks under a tree,
    climbing the tree, and falling onto the rocks.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The younger boy sings “Oali, oali,” reports distant events at night, says
    he sees a man hugging a woman, and is said to see everything going on in the world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the mother's instruction, the elder boy stamps on the younger boy's stomach;
    snakes, frogs, lizards, and other reptiles come out and run off, after which the
    younger boy stops singing “Oali, oali.”
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The mother tells the boys to make bows and arrows, promises five quivers and
    shell-trimmed robes, and sends them to kill Sun because Sun stands directly overhead
    and produces deadly heat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The boys travel south and east; where they wrestle and Spider boy is thrown,
    many camas roots come up, and villagers are glad to hear they are going to kill
    Sun.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The boys reach a celestial region where they see two shining balls of fire,
    identified with Moon's house and Sun's house; Moon's daughter, who is lame, serves
    them fruit.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The boys shoot old Sun in his house and kill him with their last arrow, then
    kill Moon, argue over who will be Sun, and decide the elder will be Sun while
    the younger will be Moon and take Moon's daughter.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: People below notice that the heat decreases, infer that the boys have succeeded,
    and the narrative states that Moon followed Sun through the sky.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: A new tale begins with five brothers living at the foot of Mount Hood on the
    south side, with the eldest proposing that they sing.
  category: setting
  evidence_refs:
  - ev:11
