canonical_text:
  quote: ''
  summary: A young man enters Sun's bright house, marries First-Blush-of-Morning,
    and has two boys fastened together. After seeing his mourning family in the lower
    world through a hole, he is lowered home in a basket by Spider's cords. He restores
    his mother's sight and returns with his wife and sons. Bluejay cuts the fastened
    boys apart, killing them; the woman returns to Sun with them and becomes the sun,
    while the sons become shadows sometimes seen. The passage also begins another
    tale in which a crying boy asks an old man for stories and receives only a very
    short spring-and-water story.
  language: English
  quote_policy: summarized
