canonical_text:
  quote: ''
  summary: The passage closes one tale in which a woman returns to her parents with
    children and supernatural provisions, after which a jealous husband leaves and
    gifts follow him back. It then begins the Guardian-Spirit Stories section and
    the tale of a young hunter who receives an Elk guardian spirit, violates the spirit's
    command against excessive killing under pressure from his father, descends into
    a lake realm of animal-persons, and loses the guardian spirit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman travels with her children toward her parents after the children
    want to see their grandparents; her husband tells her not to look back if she
    hears a great noise.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dried meat repeatedly arrives by itself at the camp, rolls in with noise,
    and piles around the fire; fresh venison later follows as well.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman's parents had cut off their hair and mourned during her absence;
    they and others rejoice at her return, and she distributes meat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband becomes angry after the woman looks at two men at a gathering
    and does not eat for five days and nights.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the husband leaves with his son, the robes he had given and all uneaten
    venison rise or leave and follow him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman explains that her husband left because she looked at two men who
    had wished to buy her when she was a girl; the man later destroys himself, and
    the passage gives a custom explanation about a departing husband taking what he
    gave his wife's people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the guardian-spirit tale, a man at Dog River receives a forehead cut when
    bark falls on him while his wife is sick after childbirth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The father later shames his son by claiming that, when young, he caught young
    elks and was scarred by an old elk.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: An elk visits the boy and says it will be his master and guardian spirit if
    he serves and listens, avoids pride, and does not kill too many animals.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The young man becomes a great hunter, knows where animals are, and initially
    kills only what he needs.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the father continues to scold him, the Elk helper becomes angry at the
    father and causes the young man to kill five herds of elk.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The young man tries to kill his own Elk helper; the Elk goes to a lake, pretends
    to be dead, and when he touches it in the water both sink.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: At the bottom, the young man sees bears, deer, and elks without number, all
    as persons, including animals he had killed, who groan.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:14
  text: The great Elk rebukes the young man for going beyond the command, says he
    inflicted needless wounds, exposes the father's lie about the scar, and withdraws
    as guardian spirit.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: A voice orders him cast out; he returns home, lies down for five days and
    nights, and asks his wives to prepare water, call friends, and bring five elk-skins.
  category: sequence
  evidence_refs:
  - ev:13
