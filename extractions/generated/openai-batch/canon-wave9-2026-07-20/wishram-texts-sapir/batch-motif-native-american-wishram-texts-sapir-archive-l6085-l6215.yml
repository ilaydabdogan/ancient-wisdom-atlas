candidate_motifs:
- id: motif:1
  label: supernatural transport of provisions
  taxonomy_refs: []
  basis: Meat repeatedly moves by itself with great noise and stacks at the camp,
    and fresh venison also follows the travelers.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not identify the mechanism or agent beyond the husband's
    instructions and the self-moving provisions.
- id: motif:2
  label: marital gifts withdrawn when the husband leaves
  taxonomy_refs:
  - sacred_exchange
  basis: Robes and uneaten venison follow the departing husband, followed by an etiological
    statement about a man leaving his wife and taking what he gave her people.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The taxonomy label is broad; the passage frames the action as custom explanation
    rather than explicitly as sacred exchange.
- id: motif:3
  label: jealous departure after wife looks at other men
  taxonomy_refs: []
  basis: The husband becomes angry after she looks at two men who had wished to buy
    her, stops eating, leaves, and later destroys himself.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not provide the wider beginning of this tale, so the
    full marital context is incomplete.
- id: motif:4
  label: animal guardian spirit acquired with behavioral prohibitions
  taxonomy_refs:
  - initiation
  basis: The Elk visits the boy, offers to be his master and guardian spirit, and
    gives rules against pride and excessive killing.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage begins the story but is cut off before the hunter's full final
    speech concludes.
- id: motif:5
  label: abuse of supernatural hunting power punished by loss of guardian
  taxonomy_refs:
  - wisdom
  - divine_judgment
  basis: The introductory note calls the tale a warning against abuse of power, and
    in the narrative the Elk rebukes the hunter for needless killing and withdraws
    as guardian spirit.
  evidence_refs:
  - ev:6
  - ev:12
  confidence: high
  cautions: The term 'divine' is only an approximate taxonomy fit; the judging figure
    is specifically the Elk guardian spirit.
- id: motif:6
  label: descent through water to an animal-person realm
  taxonomy_refs:
  - hero_descent
  basis: The hunter touches the Elk in lake water, sinks, wakes at the bottom, and
    sees bears, deer, and elks as persons.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage does not call this a heroic descent, an afterlife, or a completed
    journey; it is an involuntary sinking into a submerged realm.
- id: motif:7
  label: master of animals rebukes overhunting
  taxonomy_refs:
  - wisdom
  basis: The great Elk identifies the killed animals as 'our people' and condemns
    the hunter for needless wounds after excessive killing.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage names the guardian as Elk, not as a generalized 'master of
    animals'; the broader category is inferred from the scene.
- id: motif:8
  label: false paternal boast leading to dangerous excess
  taxonomy_refs: []
  basis: The father lies about the source of his scar and pressures the son to hunt
    more, contributing to the son's violation of the Elk's command.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:12
  confidence: high
  cautions: The story is incomplete at the end of the supplied passage, so any later
    resolution is not included.
