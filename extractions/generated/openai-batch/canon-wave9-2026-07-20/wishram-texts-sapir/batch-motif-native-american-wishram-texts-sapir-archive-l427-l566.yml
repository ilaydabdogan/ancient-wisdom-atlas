canonical_text:
  quote: ''
  summary: An editorial note frames the episode as part of a Wishram Coyote cycle
    along the Columbia. In the myth, Coyote tricks two women who keep fish in a pond
    or lake, enters their house disguised as a drifting boy in a cradle, eats their
    food, makes five oak digging-sticks, opens an outlet so the fish enter the Great
    River, rebukes the women for keeping the fish to themselves, says the fish will
    feed future people, and names the women Swallows.
  language: English
  quote_policy: summarized
