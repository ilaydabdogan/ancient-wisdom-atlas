canonical_text:
  quote: ''
  summary: A quarrelsome boy is abandoned by his village but survives with hidden
    supplies, magpie skins, fishing, and food from the river. A woman identified as
    Itcli'xyan's daughter comes from the water, makes a fine house, and becomes associated
    with river-provided food. The boy allows the village to return but drowns the
    former chief in a storm, becomes chief, and feeds the people. The passage closes
    by linking a water-dwelling helping spirit with boys fishing after dark, then
    begins a Coyote story in which Coyote deceives Eagle into climbing a rock that
    rises nearly to the sky.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The main tale begins in a village opposite The Dalles and describes a boy
    as very quarrelsome, whipping other boys and killing one or two.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief tells the boys to take the quarrelsome boy away, leave him at a
    distance, and return while the village moves away; the boys leave voices behind
    to answer him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy's two grandmothers had reared him and secretly left him fire hidden
    between mussel-shells, a deer-rib used for fish-hooks, and ten wild potatoes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: After discovering he has been left, the boy returns to the former village
    site, finds it cleared away, and sees the village camped across the river.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy traps magpies, skins them, makes a robe, eats one potato a day, and
    later makes a fish-line from trap-strings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: While fishing, the boy addresses the river and asks it to give him all kinds
    of food; he catches one fish each day for five days.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the fifth day, the boy dances and sings that he will make his magpie robe
    fly, then draws a long white object from the water, a bundle containing wood,
    roots, salmon, and other food.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the night the boy wakes and finds a person beside him, a mountain-sheep-skin
    blanket over him, a woman at his side, and a beautiful house around him.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that Itcli'xyan's daughter came out of the water at night,
    made the house, and lay down beside the young man.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The village messengers say the chief had a purpose in leaving the boy and
    wants to return now that the house has appeared; the young man says the chief
    may come but must come last.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The grandmothers return first, then the whole village, and finally the chief;
    as the chief crosses the river, the young man raises a storm and drowns him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the chief's drowning, the young man becomes chief and feeds the people
    for years with food that comes from the river for his wife.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage says that Indians on the Columbia River still send boys to fish
    after dark to get the spirit of ItcH'xyan, who lives in the water and helps people.
  category: other
  evidence_refs:
  - ev:8
- id: obs:14
  text: A note in the passage identifies Itc'.i'xyan as protector of fishermen and
    hunters of water-animals and points to other Wishram and Chinook texts for comparison.
  category: other
  evidence_refs:
  - ev:9
- id: obs:15
  text: The following fragment begins a Coyote story in which Coyote, Eagle's grandfather,
