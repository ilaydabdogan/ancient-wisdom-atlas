canonical_text:
  quote: ''
  summary: 'The passage contains the end of a Coyote and Skunk episode in which Skunk
    repeatedly appears sick, animal peoples are summoned to drum and doctor him, Raven
    doctors him, Coyote uses pitch in Skunk''s body, and the elks flee after Skunk
    defecates and discharges wind. The animal peoples later refuse further summons.
    The passage then begins Raccoon narratives: a fragment in which Raccoon steals
    acorns and is whipped by his grandmother, and a fuller story in which Raccoon
    neglects summer acorn gathering, becomes hungry in winter, eats through stored
    acorn caches, and is accused by Crow.'
  language: English
  quote_policy: summarized
