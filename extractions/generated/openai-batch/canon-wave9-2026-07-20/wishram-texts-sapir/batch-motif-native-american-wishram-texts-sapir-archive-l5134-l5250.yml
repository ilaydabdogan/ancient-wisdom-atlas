canonical_text:
  quote: ''
  summary: A first-person war narrative recounts Paiutes wounding a man, the captain
    Billy Chinook leading a return to camp, a fire reception and scalp dance, and
    the wounded man TIa'mlauwai recovering after a guardian-spirit display, rain and
    hail, and bathing in water. The passage ends with hunger, division of a small
    jack-rabbit among thirty people, return home, and renewed pursuit of Paiutes into
    water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Paiutes yelled a war-whoop and wounded a man in the leg; members of the narrator's
    party seized and brought the wounded man back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The captain, named Billy Chinook, decided that the group should return home
    because the wounded man was sick and the Paiutes might kill the horses; the wounded
    man was bound to a horse with his legs tied.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The group went to the river and waded in the water while guns were fired at
    them; no one was hit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Billy Chinook asked who would interpret for him; an unnamed man offered, and
    the captain's message to the Paiutes invoked the Great Chief, a long war, and
    a warning not to waste ammunition before he fired a gun.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At night the group went toward camp with the wounded man, and two riders went
    ahead to announce that the people were coming with one wounded man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Four fires were made at camp; the arriving group passed around the fire and
    people in camp shook hands with them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At camp the wounded man was named as TIa'mlauwai, and the returning group
    reported that they had taken many Paiute scalps.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The people sang the scalp song and danced all night while carrying scalps
    in their hands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A Paiute boy was enclosed in a sack, taken out near the fire, allowed to run
    nearby, and captured as though in war.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: When the wounded man had become sick, a long pole was set up with ceremonial
    feathers tied on top to a wolf's backbone, identified as the man's guardian spirit.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The wounded man said he would die and asked the people to hear what he had
    learned as a boy; he described a boyhood vision or encounter involving black clouds,
    a white sky, and rain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The wounded man said that if it did not rain and hail he would die; rain and
    hail then began.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: After rain and hail began, the wounded man asked to bathe in water, was carried
    to the water and put into it, and recovered.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The narrator states that the Paiutes had shot at the wounded man's guardian
    spirit and that the man did not die but became well.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The group passed three nights without food, caught one very small jack-rabbit,
    and divided it among thirty people before going home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The group later set out again, found Paiutes at midday, chased them into water,
    and the Paiutes escaped by swimming.
  category: action
  evidence_refs:
  - ev:8
