canonical_text:
  quote: ''
  summary: A first-person war narrative recounts a party of 170 setting out toward
    the Paiutes, taking captives, dreaming ominous dreams, singing with iqta't-sticks,
    receiving instructions from a chief, observing a flag signal and seven fires at
    Paiute houses, arming, charging, fighting, killing and scalping opponents, capturing
    women and children, keeping night watch, and later advancing toward a bridge near
    a large lake.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group of 170 people starts out toward the Paiutes and captures about five
    Paiutes on the trail; the captives are described as children and women, not men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At camp the group dreams that they are all covered with blood.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the morning the chief tells the group to make a fire so that he can tell
    them something.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The group takes hold of iqta't-sticks, sings strongly, and rubs the sticks
    together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A figure called the hero says that he dreamed the group will die that day,
    that he has seen the Paiutes, and that rain will occur if they see them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Another man reports dreaming that a grizzly bear ran away toward the setting
    sun and that only the grizzly bear's son was caught.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The people give war-whoops, and the Paiutes become afraid and cry.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The chief orders the group to travel two by two and not to talk to one another
    that day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The chief instructs the group to watch a flag; when the flag moves three times
    from the ground, everyone is to look around.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The flag moves three times, the group looks around, and they see Paiute houses
    with seven fires.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: It begins to rain after the group has seen signs of the Paiutes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The chief uses a spy-glass and says that the people observed are not Paiute
    soldiers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A box full of bullets is opened, bullets are distributed, guns and pistols
    are cleaned and loaded, and a bob-tailed horse is decorated with feathers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The group charges the Paiutes at a place with seven fires and seven houses;
    guns are fired and smoke darkens the area around the houses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: After fighting all day, members of the attacking group rip open bellies, cut
    necks, take scalps, and place heads ten paces away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The group captures two children, one girl and one boy, and kills many Paiutes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: During night watch, horses are heard neighing, and the Paiutes have seized
    one girl under cover of darkness and run off with her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: At daylight the group starts off again, catches more Paiutes, fights again,
    captures women, and the narrator kills and mutilates a naked Paiute man.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: The narrator later sees many women and many scalps, perhaps forty, and reports
    that many Paiute women are caught and bound at night.
  category: action
  evidence_refs:
  - ev:9
- id: obs:20
  text: The group is taken to a large lake where there are many Paiutes, brought to
    a bridge, shot at, and organized with twenty named men, pack-horses in the middle,
    and men advancing two by two.
  category: sequence
  evidence_refs:
  - ev:10
