canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a boy, directed by his mother, gains
    powers from water-associated beings so that he can run on water and overcome his
    father. He wages war against the old chief, using the East Wind against the Chinook
    Wind, fights his father on the water, kills him, frees the father’s wives, and
    rules well. The passage then begins a tale in which a chief’s daughter follows
    a dog that stole her paint, reaches a dog household, sees dogs become young men
    after sundown, marries the dog-man thief, and later sees her child roasted in
    ashes and return alive after five days and nights.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy’s mother tells him to stop seeking power on the mountains and to seek
    power by the water.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy obtains powers associated with five Whirlpools, five long-legged Water-Spiders,
    and five bands of yellow Flies running on the water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Water-Spiders say they will give the boy strength to run on the water,
    and his mother later sees him run on the water.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The young man becomes half grown, larger and stronger than his father, gathers
    fifty canoes with men and weapons, and goes to war against his father for killing
    his half-brothers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At night the young man walks over the water to the old chief’s house and follows
    his father from one woman’s bed to another.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The women in the old chief’s house suspect that the visitor is the young chief,
    their son.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The old chief measures tracks and finds them larger and broader than his own,
    then prepares his people for war.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In battle, the old chief comes with a strong Chinook Wind, while the young
    chief brings the East Wind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The opposing winds drive the canoes together; the canoes break and sink, and
    many men drown.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the fifth day the father and son fight hand to hand on the water; the old
    chief’s strength fails, the water no longer holds him, and his son kills him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After killing his father, the young chief frees the father’s wives, keeps
    ten wives for himself, and rules his people well.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A dog steals a young woman’s paint, and she follows it for four days until
    she reaches a house in a valley.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: At the house, the young woman sees small dogs carrying fire from the house
    and making fires in the woods.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Dogs place venison and buckskin before the young woman when she desires them,
    and she says they should not do so because people will say she stole them.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: After sundown, the dogs are gone and young men are in the house; the passage
    states that the dogs have turned into young men.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: The young man who had stolen the paint lies down beside the young woman; the
    passage states that this is the marriage, and she stays with him.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:17
  text: After a son is born, the man’s relatives wrap the child, place him in ashes,
    cover him, and roast him.
  category: action
  evidence_refs:
  - ev:14
- id: obs:18
  text: Five days and five nights after being roasted to ashes, the child walks out
