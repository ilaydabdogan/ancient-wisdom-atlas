canonical_text:
  quote: Elk was trying them to let them know what hardships they had to go through
    to be great hunters.
  summary: A dance-festival in a large house with five fireplaces brings animal visitors
    to Elk hosts, who test selected participants by carrying them over a blazing fire
    while singing. Coyote later enters as a stranger, attempts to avoid the fire-dance
    custom, is burned dead, and afterward comes back to life.
  language: English
  quote_policy: quoted
