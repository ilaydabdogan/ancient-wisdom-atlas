canonical_text:
  quote: Coyote appears in his dual capacity of culture-hero and unsuccessful trickster.
  summary: A comparative note frames Coyote myths in relation to Chinook, Kathlamet,
    Wishram, Klamath, Thompson, Shuswap, and Nez Percé materials. The narrative then
    recounts Coyote impersonating Eagle, Eagle's escape and retaliatory trick, Coyote's
    being carried to the ocean, his shapeshifting into wood and then a baby, and his
    breaking of a fish dam so salmon move up the Columbia River before transforming
    two fish-keeping sisters into birds.
  language: English
  quote_policy: quoted
