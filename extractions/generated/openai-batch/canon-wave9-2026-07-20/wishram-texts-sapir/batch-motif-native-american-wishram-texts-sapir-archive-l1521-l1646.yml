canonical_text:
  quote: Then he sat down in the house and transformed himself into an old man.
  summary: Salmon's son recovers his father's true bow after false bows break, punishes
    Coyote and Skunk for their part in his father's death, then enters the house of
    a weeping woman who says five wolves killed his father. He disguises himself as
    an old man, makes five arrows for the wolves, returns to his original form, dries
    up all water except one spring at Wa'xcam, hides near the spring, and kills four
    wolves as they come to drink.
  language: English
  quote_policy: quoted
