canonical_text:
  quote: "“I have a home down in the water. I will remain there hereafter.”"
  summary: The passage ends a preceding tale with a deathbed reference to a departed
    spirit, then tells of a Chinook boy who disappears at the river, is later found
    living among seals, is forcibly returned to his parents, gradually resumes human
    behavior, tells of seal society as human-like, and finally returns to the water
    to live there. An editorial note compares this tale type with regional stories
    of visits to food-animal peoples.
  language: English
  quote_policy: quoted
