canonical_text:
  quote: He turned her into a large rock on the north side of Columbia River.
  summary: The boys evade their pursuing mother by causing frogs and windblown leaves
    to appear as human gatherings. They then meet Coyote, who makes a rattle from
    broken mussel-shells in his leggings, deceives the mother into seeking the same
    rattling power, breaks her leg with a rock, and changes her into a large rock
    beside the Columbia River.
  language: English
  quote_policy: quoted
