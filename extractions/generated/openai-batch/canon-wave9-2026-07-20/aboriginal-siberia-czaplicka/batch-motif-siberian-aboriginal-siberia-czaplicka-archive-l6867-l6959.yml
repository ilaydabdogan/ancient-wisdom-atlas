canonical_text:
  quote: ''
  summary: 'The passage first gives a famine anecdote in which a starving woman kills
    her suckling child, nurses her exhausted husband, and argues that his recovery
    will allow future children. It then describes Chukchee birth customs: childbirth
    self-control and self-attendance, pregnancy taboos involving dawn and sunwise
    movement, secrecy around infant garments, sexual abstinence rules, seclusion during
    labour, cutting the cord with a stone scraper, postpartum feeding and binding,
    restrictions before a fifth-day blood-painting ceremony, ritual treatment of the
    afterbirth in a miniature tent, reindeer slaughter and blood-smearing, and the
    beginning of a name-giving divination.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A starving husband, wife, and suckling child are described; the husband becomes
    too exhausted to leave the tent.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife kills the child, feeds the husband at her breast, and eats berries
    herself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife explains that if the husband died, she and the child would also have
    died, but that if he recovers they can have other children; the husband recovers
    and later has other children.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Chukchee women in childbirth are said to be forbidden to groan or make audible
    signs of pain, and other women are not to help.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A delivered woman is expected to cut the navel-string and put away the placenta
    herself; accepting help brings lifelong mockery and may give her husband a nickname.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: When a wife knows she is pregnant, the couple begin taboos including rising
    together each morning, looking at the dawn, and walking around the tent in the
    direction of the sun's path.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Infant garments are prepared secretly and referred to by a special name.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Sexual relations between husband and wife cease only at the last moment and
    are interrupted for ten days after birth, unless the child dies, in which case
    they are resumed earlier to promote another conception.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: During labour no stranger, especially no male stranger, may enter the inner
    room because an invisible evil influence is feared to cling to them and approach
    the lying-in woman.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: During the actual birth everyone must go away except, in necessity, one old
    woman; if no one else is present, the husband may assist.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: After birth the mother cuts the cord with a sharp stone skin-scraper kept
    in her clothes-bag for this purpose throughout life.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The mother is fed frequently and abundantly for two weeks; among Reindeer
    Chukchee, a young doe is killed and broth is made.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After delivery the woman is tightly bound around the hips with a cord for
    three days to bring her bones back into position.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A blood-painting ceremony is performed on the fifth day; before it outsiders
    may not enter, and even the father must undergo incantations before entering.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The same kind of prohibition is repeated when the child is ill or during infectious
    disease, and nothing may be given away from the house at such times.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Before the blood-painting ceremony, the woman may not leave the tent because
    this is said to risk bringing on a violent snowstorm.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The afterbirth is set in a tent corner with three small sticks tied together
    to imitate the tent poles; when camp is left, leather is wrapped around them to
    represent the tent cover.
  category: object
  evidence_refs:
  - ev:8
- id: obs:18
  text: The Maritime Chukchee and the Koryak place the afterbirth and its small tent
    outside the house in the open country.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:19
  text: The blood-painting ceremony takes the mother, child, and reindeer by family
    sledge to the sacrificial place behind the tent; the reindeer is slaughtered and
    its blood is smeared on the faces of the mother, child, and family members.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:20
  text: After blood-painting comes name-giving, in which the mother holds a suspended
    divinatory object such as a stone or a piece of her own or the child's dress.
  category: action
  evidence_refs:
  - ev:10
