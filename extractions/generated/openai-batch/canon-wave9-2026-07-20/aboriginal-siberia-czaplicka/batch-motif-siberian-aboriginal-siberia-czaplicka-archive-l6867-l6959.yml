- id: motif:1
  label: infant killing in famine for survival of remaining family
  taxonomy_refs: []
  basis: The famine anecdote presents a mother killing the suckling child and nursing
    the husband so that he may recover and the couple may later have other children.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The act is not presented as a formal ritual or sacred sacrifice; it is
    framed as a survival decision in famine.
- id: motif:2
  label: self-reliant and silent childbirth under honor rules
  taxonomy_refs:
  - sacred_birth
  basis: Chukchee childbirth custom forbids groaning and help, requires the mother
    to cut the cord and handle the placenta, and attaches mockery to accepting assistance.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage is ethnographic description rather than mythic narrative;
    the taxonomy reference is broad.
