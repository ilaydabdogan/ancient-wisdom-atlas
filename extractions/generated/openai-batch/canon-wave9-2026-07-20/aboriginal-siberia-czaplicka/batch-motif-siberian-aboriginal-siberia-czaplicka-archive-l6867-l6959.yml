comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Chukchee labour seclusion with a reported
    American Eskimo practice in which the husband is not allowed to stay and only
    one old woman may remain.
  claim_level: same_function
  target: American Eskimo childbirth attendance restriction
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is brief and second-hand within the passage; it does
    not establish historical contact or common inheritance.
- id: claim:2
  claim: The passage presents Maritime Chukchee and Koryak afterbirth practice as
    sharing the small-tent treatment of the afterbirth while differing in placement
    outside the house.
  claim_level: same_function
  target: Maritime Chukchee and Koryak afterbirth-small-tent placement
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage only states the placement difference and gives no further
    context or explanation.
