canonical_text:
  quote: ''
  summary: The passage describes Samoyed shamanic ceremonial procedure, including
    ritual seating, staff and arrows with bells, summoning and dialogue with spirits,
    divination by a marked staff, and a proof performed while bound in darkness. It
    then describes an Altaian shaman, Enchu, whose performance proceeds through postures
    around a fire, whirling movements, drum use, spirit collection, invisible spirit
    company, and a drum-sounded departure to the underworld of Erlik.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment distinguishes bloody sacrifice from bloodless offerings
    such as grease, meat, hair, or similar materials.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Samoyed ceremony, the shaman sits on a bench or chest without wound-inflicting
    implements, faces the door, and acts unconscious of sights and sounds.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Samoyed shaman holds a short staff inscribed on one side with mystic symbols
    and two upward-pointing arrows with small bells attached to their points.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Samoyed performance begins with a song summoning spirits, and the shaman
    strikes the arrows with the staff so that the bells chime rhythmically.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the spirits appear, the Samoyed shaman rises, dances, performs difficult
    body movements, and sings a dialogue with the spirits.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the Samoyed shaman learns what he wishes from the spirits, the spirits
    communicate the will of the god to the people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: For foretelling, the Samoyed shaman throws his staff on the ground; the inscribed
    side upward is a good omen, while the blank side indicates ill fortune.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: To prove trustworthiness, the Samoyed shaman sits bound on a reindeer skin
    in a darkened room while noises are heard, including a drum, a bear grunt, a serpent
    hiss, a squirrel squeak, and scratchings on the skin; afterward his bonds are
    untied.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Enchu’s Altaian performance is described in four stages marked by posture:
    sitting facing the fire, standing with his back to the fire, resting on the drum
    while recounting what he learned from spirits, and final shamanizing with his
    back to the fire.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Enchu later declared that he had no recollection of what happened while shamanizing
    with his back turned to the fire.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: During the Altaian performance, Enchu whirls in circles, crouches and rises,
    bends and straightens, while metal pendants on his coat move furiously and describe
    shining circles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Enchu beats his drum in different positions to produce different sounds, including
    holding it high above his head and beating it from below.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: Anguday informants explained that when Enchu held the drum overhead and beat
    it from below, he was collecting spirits in it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Enchu talks and laughs with someone apparently nearby but invisible to others,
    indicating that he is in the company of spirits.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Enchu sings more quietly while imitating horse hoof-beats on the drum to indicate
    that he and his accompanying spirits are departing to the underworld of Erlik,
    the god of darkness.
  category: action
  evidence_refs:
  - ev:9
