canonical_text:
  quote: ''
  summary: 'The passage describes Koryak marriage customs: ritualized bride resistance
    and bridegroom pursuit, attacks on the groom by women, arrival rites involving
    hearth firebrands, gifts, a first meal, sacrifice among Reindeer Koryak, an earlier
    blood-anointing rite called ''dyeing red'', household and ancestor-cult incorporation,
    divorce and inheritance notes, and levirate rules interpreted as maintaining unions
    between families.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bride may be dressed in garments that cannot be removed without cutting,
    and the bridegroom is expected to cut or tear off her clothing and touch her sexual
    organs or body.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The bride resists, runs away, may try to hide among neighbours, and may be
    kept at home by her parents if she does not want the man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bride's girl friends or women attack the bridegroom and try to stop or
    beat him back, including beating him with alder branches in Kennan's account.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: In Kennan's account, friends and relatives are invited, drums and songs accompany
    the event, and the bride runs around the yurta while the groom pursues her.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: After successful bride-seizing, the couple may leave for the bridegroom's
    house, remain temporarily with the bride's father, or the groom may send his relatives
    to fetch the bride.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the bride approaches the house of the bridegroom's parents, they come
    out to meet her with firebrands taken from the hearth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bride brings no dowry beyond her clothes but brings presents to the bridegroom's
    mother and sisters.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Upon entering the house, the bride must prepare a meal; among Maritime Koryak
    the family eats it, while among Reindeer Koryak it is followed by sacrifice to
    the Supreme Being and his son, the Cloudman.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A former rite called 'dyeing red' involved anointing the bride's forehead
    and abdomen with blood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After some time, the young couple visits the bride's parents, is again met
    with hearth firebrands, and the bridegroom brings presents.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In rare cases, a son-in-law lives with the bride's family and is adopted into
    that family.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: A young wife coming to her husband's house must join him in the cult of his
