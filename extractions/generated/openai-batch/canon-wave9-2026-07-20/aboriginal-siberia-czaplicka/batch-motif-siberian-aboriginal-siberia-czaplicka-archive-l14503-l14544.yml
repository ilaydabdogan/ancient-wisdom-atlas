canonical_text:
  quote: ''
  summary: The passage describes dark, forest, and water beings; quarrelling heroes
    punished by a deluge; material representations of gods and fetishes; and a Finnic
    belief that a human consists of body, shadow, and soul, with the soul passing
    to an infant and the shadow going to a cold underworld before shrinking and disappearing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kul-Odyr, also called Kul, is identified as chief of the spirits of darkness.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:2
  text: The secondary dark spirits called menJcva are said to resemble the Koryak
    Jcelct in having the power to change their forms; they are described as very tall
    with conical heads.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The menJcva sometimes kill and devour human beings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Malicious spirits called ucJicJii inhabit the forest and have the paws and
    teeth of a dog.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Mis-Khum lives in the forest and has many daughters who try to entice men
    to live with them as husbands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: If Mis-Khum's daughters succeed in capturing men as husbands, this brings
    good fortune to the fathers of those men.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the water live the good god Vit-Khon and the dark spirit Vit-Kul; Vit-Khon
    was sent by Numi to take charge of the fishes.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Finnic mythology is described as rich in tales about heroes, called in Vogul
    pol'Jiatur or odi/r, who continually quarrel and fight among themselves, especially
    about women.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Numi punishes the quarrelling heroes by sending a deluge upon the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Representations of gods and fetishes are made of wood, metal, or bone; cheap
    children's dolls from Russian traders are causing people to cease making their
    own fetishes.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'According to the passage, a person is composed of three parts: body, shadow,
    and soul.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The soul, named in the passage as lAli IhelmkJiolas, passes after death to
    an infant of the same clan, or to an infant of another clan if the original clan
    is extinct, but never to an animal.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The shadow goes to a cold underworld in the icy seas beyond the mouth of the
    Obi, ruled by Kul Odyr.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the underworld the shadow lives for the same length of time as the dead
    person's former life on earth and follows similar pursuits such as reindeer-breeding
    and fishing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: After that period the shadow grows smaller until it is no larger than a blackbeetle,
    or according to some accounts turns into a blackbeetle, and finally disappears.
  category: sequence
  evidence_refs:
  - ev:8
