candidate_motifs:
- id: motif:1
  label: multipart soul with differentiated origins, body locations, and fates
  taxonomy_refs: []
  basis: The passage distinguishes siir, kut, lut, and later Altaian soul-parts such
    as suzy, each with different associations and functions.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:9
  confidence: high
  cautions: Terminology is affected by OCR and transliteration; the passage itself
    is partly summarizing earlier sources.
- id: motif:2
  label: soul lingering near body and departure to other world
  taxonomy_refs:
  - afterlife_journey_map
  basis: One belief says lut remains for days near the corpse and then departs to
    the other world.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives only a brief statement and does not map stages of the
    other-world journey.
- id: motif:3
  label: shamanic power as inherited or transferred spirit-power
  taxonomy_refs:
  - initiation
  basis: Amagyat is described as passing from one shaman to another, usually by heredity,
    and tes hazyn-yat is linked to the degree of shamanic power.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: medium
  cautions: The passage debates whether this is a spirit or impersonal power; it does
    not narrate a full initiation sequence.
- id: motif:4
  label: sacrifice as propitiatory exchange with gods, spirits, and place-owners
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Sacrifices are made to Yulgen, Erlik, secondary spirits, natural-form owners,
    clan deities, and family gods; missed sacrifice triggers punishment until the
    offering is made.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  confidence: high
  cautions: The text is descriptive and does not give a full ritual liturgy.
- id: motif:5
  label: gender-restricted horse sacrifice after marriage
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Every bridegroom must sacrifice a light-colored horse to Yulgen after marriage,
    with male ritual officiation and restrictions on women’s presence and contact
    with the horse.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explain the symbolic reason for the gender restrictions.
- id: motif:6
  label: paired good and evil divine powers in negotiated relation
  taxonomy_refs:
  - duality
  basis: Good spirits belong to Yulgen and bad spirits to Erlik; the Altaians say
    the two have one door, and Yulgen can involve Erlik in enforcing an omitted sacrifice.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: medium
  cautions: The passage reports cooperation or linkage but does not present them as
    equal cosmic opposites.
- id: motif:7
  label: stratified upper and lower spirit-worlds
  taxonomy_refs: []
  basis: Good spirits live in seventeen floors above earth, and bad spirits occupy
    seven or nine floors beneath, with Erlik Khan on the lowest floor.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: Available taxonomy does not include a precise layered-cosmos motif reference.
- id: motif:8
  label: illness caused by absence of a soul-part and treated by recall
  taxonomy_refs: []
  basis: When a person is ill, the suzy soul is absent while another soul remains,
    so the suzy can be recalled.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not describe the recall ritual itself.
comparison_claims:
- id: claim:1
  claim: The passage itself compares Altaian tes hazyn-yat with Yakut umagijat as
    a similar conception of shamanic ancestor-spirit or shamanic power.
  claim_level: same_function
  target: Yakut umagijat / amagyat and Altaian tes hazyn-yat
  evidence_refs:
  - ev:7
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is given in a footnote-like authorial note and does
    not provide detailed parallel evidence in this passage.
- id: claim:2
  claim: The passage’s note on Samoyed belief presents a nearby comparative pattern
    in which ordinary souls perish after death while shaman souls survive.
  claim_level: same_function
  target: Samoyed belief about survival of shaman souls
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: low
  limitations: The Samoyed material appears only as a brief note and is not integrated
    into the main Altaian description.
