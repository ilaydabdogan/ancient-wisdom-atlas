canonical_text:
  quote: "“Yulgen and Erlik have one door.”"
  summary: The passage describes Siberian and Altaian beliefs about soul components,
    shamanic power, divine and spirit hierarchies, sacrifice, ritual restrictions,
    spirit images, the relation between Yulgen and Erlik, the shaman as intermediary,
    a vertically layered cosmos, and illness as the absence of one soul-part that
    may be recalled.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage distinguishes soul-elements including siir, kut, and lut; siir
    enters the mother through the temples at conception, is connected with the head,
    and has no shadow, while lut is connected with the abdomen and has three shadows.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kut is said to be sent by Art-Toyon-Aga, and siir by Uhi-Toyon.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After death, lut is said to be devoured by the ahassjlar; another belief says
    it remains near the body for some days and then departs to the other world.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Siir is described as common to humans and animals, including fishes, and as
    a word for unusual psychic powers possessed by shamans.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A legend is summarized in which shamans receive their heads, the seat of siir,
    from heaven.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The amagyat is described by some as a shamanistic spirit passing from one
    shaman to another, usually by heredity; the author interprets it here as an impersonal
    power associated with shamans.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Among the Altaians, good spirits are subjects of Yulgen and bad spirits are
    subjects of Erlik.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Yulgen is described as kind and generous, receiving sacrifices from all but
    not feared.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Every bridegroom must sacrifice a light-colored horse to Yulgen after marriage;
    the horse is marked with respect by a red ribbon tied to its mane, and no woman
    may mount it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The horse sacrifice to Yulgen is performed in spring in a birch thicket; no
    woman may be present, the shaman must be male, and married women must remain at
    least sixty feet from the place of sacrifice.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:11
  text: Sacrifice is made to Erlik, usually of an animal, when an evil spirit attacks
    someone, and the ceremony is performed in the yurta, in the courtyard, or at the
    place of attack.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Propitiatory sacrifices are also offered to secondary good and evil spirits,
    to the owners of the sun, moon, mountains, rivers, and forest, and to clan and
    family deities.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Images of gods are called tijns by the Yenisei Turks and lurnies by the Altaians,
    and are made of materials such as skin or wood.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Altaians say that Yulgen and Erlik have one door; when Yulgen expects
    a sacrifice and does not receive it, he may inform Erlik, who orders Kagyr Khan
    to punish the culprit until the sacrifice is made.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Kagyr Khan is said to have power over every yurta, and minor libations are
    made to him at all festivals.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: The kam or shaman is described as intermediary between gods and humans at
    sacrifices, priest at the ceremonies, and prophet.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:17
  text: The shaman’s power is described as varying according to the degree of tes
    hazyn-yat, glossed by the author as probably ancestor-spirit or power of ancestor-spirit.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:18
  text: The universe is described as partly horizontal and partly vertical; good spirits
    live in seventeen floors above the earth, while bad spirits occupy seven or nine
    floors under it.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:19
  text: Erlik Khan, chief of the bad spirits, lives on the lowest floor, where the
    sun and moon give only feeble light, and is said to have originally been a heavenly
    spirit.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:20
  text: The Altaian soul is described as having several parts, conditions, or stages;
    in illness, the soul called suzy is absent while another soul remains in the body,
    so suzy can be recalled.
  category: sequence
  evidence_refs:
  - ev:9
