canonical_text:
  quote: ''
  summary: The passage describes Yakut childbirth rites involving the goddess Ayisit,
    offerings, fire thanksgiving, seclusion, and placenta disposal; similar Yakut
    cattle-birth rites; and Lapp, Finnish/Chude, Cheremiss, and Chuvash naming ceremonies
    involving ancestor names, dreams, charms, water, magicians, oracle-men, and divine
    revelation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ayisit is described as coming to the woman at childbirth in a way similar
    to her appearance at a spring fertility festival; nine chaste boys, nine men,
    and imagined spirits form her retinue.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Ayisit's appearance, a rich Yakut kills a domestic animal; the head and
    entrails are sacrificed to the goddess, and the rest is distributed to the old
    woman, relatives, and guests.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the child is born, the old woman pours fat on the fire and thanks Ayisit
    for the gift, asking for more in the future.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the woman is to die, Ayisit is said not to come at all.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: For the three days of Ayisit's presence, the woman lies on straw in the yurta,
    men are not allowed to enter, and afterward she returns to her sleeping place.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The old woman takes the straw and placenta to the forest far from the yurta
    and places them high on the trunk of a tree.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Similar ceremonies are said to occur among the Yakut at the birth of cattle,
    with severe measures for delivery, a benevolent goddess, and a special shaman
    who pronounces an incantation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The calf-birth formula tells the birth to be faster than an arrow, lighter
    than a hair, and to go through a white straight road.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After Christian baptism, a Lapp child receives another Lapp name in the ceremony
    called same nahma; the name is usually an ancestor's name revealed to the mother
    in a dream or during shamanistic performances.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Lapp name-giving ceremony is usually performed by a woman, often the mother
    herself; during childbirth the woman is under the protection of a goddess called
    Saralla, described as Creator-woman.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: A godmother-like woman gives the child a brass object used in the ceremony
    and later worn as a charm, under the arm for a boy and on the breast for a girl;
    the child is dedicated to the goddess Sarulka.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: If the child does not thrive, the Lapp name-giving ceremony can be repeated
    and the name changed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that the name-giving ceremony is similar to one found all
    over Siberia, and that water use in such ceremonies may be due to Christian influence.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Finns under Novgorod, called Chudes in the passage, are said to have summoned
    oracle-men to name newborn children in their own way.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A Mountain Cheremiss magician names a child by holding it, listing names while
    swaying it, and selecting the name being uttered when the crying ceases.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: A Chuvash magician is respectfully received, asked to give a name of good
    omen, mutters over a bowl of water, gives water to mother and child, enters ecstasy,
    and gives a name said to be divinely revealed.
  category: action
  evidence_refs:
  - ev:9
