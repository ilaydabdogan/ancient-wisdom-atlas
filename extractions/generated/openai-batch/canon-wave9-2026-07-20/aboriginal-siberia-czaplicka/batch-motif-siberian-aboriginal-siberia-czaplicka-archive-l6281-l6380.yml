canonical_text:
  quote: ''
  summary: The passage describes Buryat post-wedding residence patterns, bride and
    affinal avoidance rules, widow remarriage and kalym obligations, and then introduces
    Kalmuk betrothal, marriage payments, household gifts, and consultation of a gelung
    to choose an auspicious wedding day.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the wedding, the wife may spend long periods with her parents before
    gradually increasing visits to her husband and eventually settling with him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports a scholarly conclusion that myths of marriage reform and
    described marriage customs suggest an earlier practice in which the husband lived
    in the home of his wife's parents.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bride must not use the names of her father-in-law or mother-in-law, and
    she must call older relatives of her husband and her father-in-law khadam.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the presence of a khadam, the bride must keep her cap and face-covering
    on, avoid undressing or changing clothes, sleep separately, pass behind him if
    they meet, and avoid riding in the same wagon or being close to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The khadam or male affine must not dress or undress in the bride's presence,
    sit or lie on her sleeping-place, use indecent language before her, or enter the
    yurta without signaling his approach.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: These avoidance customs are named sorkhoho, glossed in the passage as connected
    with 'sin' and 'to do'.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: After a husband's death, the widow passes to his brother, another near relative,
    or the father-in-law, unless both parties are unwilling.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: If the widow is married to someone else, the new kalym is turned over to the
    first husband's family.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Rules for marital dissolution vary according to whether the husband refuses,
    the wife refuses, the marriage involved interchange of daughters, or both spouses
    consent.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: On mutual dissolution, neither party restores kalym, and the wife may demand
    a riding-horse with full equipment and one summer and one winter suit.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Among the Kalmuk as reported by Pallas, children may be betrothed in infancy
    or conditionally in the womb, and the couple are joined at fourteen years of age
    or later.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: If pregnancy occurs before the wedding day, atonement is made to the bride's
    parents through presents.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Before the wedding, the bridegroom arranges with the girl's father the portion
    consisting of horses and cattle, while the young man's father gives the bride
    a white felt tent and household goods.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Other authors report that the yurta and other goods given to the girl are
    provided from the kalym given by the bridegroom.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: A gelung is consulted about the wedding day and uses astronomical calculations
    to find a propitious one.
  category: action
  evidence_refs:
  - ev:11
