canonical_text:
  quote: ''
  summary: The passage describes Yukaghir marriage procedures involving reindeer halters,
    wedding invitations, feast gifts, a three-day seclusion, reciprocal exchanges
    not treated as bride-price, limited polygyny, matrilocal arrangements with patrilineal
    descent, and supplementary unions attributed to Chukchee contact. It then describes
    Gilyak regulation of premarital pregnancy, fatherlessness, and relationship-based
    marital classes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Yukaghir wedding procedure, the matchmaker gives the bridegroom a long
    halter to symbolize that the reindeer now belong to him, while the bridegroom
    retains a short halter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the mission succeeds, the bridegroom's father sends the matchmaker to
    invite the bride's parents and relatives to the wedding feast.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A separate place is prepared for the couple on skins used as bedding, and
    after the feast the bridegroom's father and matchmaker distribute gifts to the
    bride's father and relatives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The gifts mentioned include spoons, plates, arrows, and axes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: After the feast, the married couple remain in the tent for three days and
    visit the bride's parents on the fourth day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: The author states that the reindeer and other exchanged presents are fairly
    equal in value and should not be regarded as bride purchase-price; the author
    also states that there is no actual or symbolic trace of marriage by capture in
    this case.
  category: other
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage reports that among Christianized Yukaghir the Church ceremony
    may occur one or more years after the native wedding.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The passage states that open polygyny is not found in present Yukaghir marriage
    customs, but formerly existed to a limited extent.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Because a man normally lived in his father-in-law's house, bringing another
    woman there was difficult; good hunters, strong warriors, and shamans are said
    to have more frequently had more than one wife because they generally did not
    live in their fathers-in-law's houses.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: The passage describes cases in which a man acted as son-in-law in one household
    during one part of the year and in another household during the rest of the year.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: In areas of Chukchee-Yukaghir contact, the Yukaghir are said to have adopted
    a supplementary union in which members of one group visit and may cohabit with
    wives of another group under restrictions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: The passage says that Yukaghir matrilocal arrangements do not amount to matriarchy,
    because children are called by the father's name, trace descent through the father's
    male ancestors, and paternal relatives carry the duty of blood revenge.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: An old Yukaghir is reported to have described an earlier custom in which the
    first son and daughter were reckoned among the mother's relatives and the remaining
    children among the father's relatives.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage says Russian law at the time called children born before Church
    marriage after the mother and children born afterward after the father.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: Among the Gilyak, a girl is not necessarily expected to be a virgin before
    marriage; parental concern is described as focused on union with an inappropriate
    social position or a child born outside the proper marital class.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: The passage states that when the father is unknown or the child is outside
    the proper marital class, the child must be killed; a man without a father is
    described as a pariah outside the marital class.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:17
  text: A pregnant Gilyak girl is said to be forced to name the seducer; he is then
    called upon to marry her and usually consents because the payment is small.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: Only when the girl refuses to name the father is the infant said to be killed
    to save the clan from shame.
  category: action
  evidence_refs:
  - ev:6
- id: obs:19
  text: The passage says Gilyak women very seldom have intercourse with men of a forbidden
    matrimonial class.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:20
  text: Gilyak marital classes are described as strictly based on relationship and
    as regulating sexual relations, with age playing no part.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:21
  text: 'The passage lists four main Gilyak social classes: father''s fathers; mother
    and father; wife and husband; and brothers and sisters, real and classificatory.'
  category: relationship
  evidence_refs:
  - ev:7
