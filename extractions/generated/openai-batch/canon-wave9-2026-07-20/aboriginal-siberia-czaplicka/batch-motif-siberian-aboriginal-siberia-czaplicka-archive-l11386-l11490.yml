canonical_text:
  quote: ''
  summary: The passage surveys shamanic accessories among Buryat, Mongol, Samoyed,
    Ob-Ostyak, and Lapp groups, describing drums, horse-staves, bells, a tuning-fork
    or jews' harp, boot plates, an Olkhon Buryat shire box with solar, lunar, divine,
    equine, weapon, and tree imagery, a mask, a metal mirror with animals, a whip
    with bells, Samoyed drum-preparation rules, Samoyed costume elements including
    a covered face for inner sight, and the former importance of the Lapp drum.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Buryat, the drum is described as little known and horse-staves are
    substituted for it; among Mongol shamanists and Mongolized Uriankhai, the drum
    is in use.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Buryat Buddhist drums are described as round, hide-covered on one or both
    sides, and fitted with leather handles on the outer rim.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ihur is described as a tuning-fork or jews' harp with a wire tongue, widely
    used among shamanists and in some places merely as a musical instrument.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Iron plates were formerly sewn onto the shaman's boots, but are no longer
    in use.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Olkhon Buryat shire is a four-legged box hung with ribbons, bells, and
    skin strips, with carved or painted figures on one long side.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The shire decoration includes the sun on the right as a wheel, the moon on
    the left with a human figure holding a tree, three secondary gods, weapons, and
    a horse under each human figure.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Wine is sprinkled several times a year in honour of the three secondary gods
    represented on the shire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The shire holds horse-staves, drums, and other ritual implements; a shaman
    gains the right to carry it after the fifth consecration, and its dimensions are
    said to increase with later consecrations up to the ninth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Additional Buryat implements include a monstrous painted mask of skin, wood,
    and metal with a large beard, and a metal looking-glass with twelve animal representations,
    worn on the breast or sewn to the coat.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A Buryat shaman may occasionally have a whip with bells, but the implements
    described are said generally to be disappearing in modern times.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The most important belonging of a Samoyed shaman is the drum, which he prepares
    by special rules, including killing a male reindeer-calf himself and preparing
    the skin without veins; a woman cannot assist.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Samoyed drums are round, of various sizes, covered with transparent reindeer
    hide, and ornamented with metal disks and plates; Samoyed and Ob-Ostyak drums
    are described as like Altai drums.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Samoyed shaman's costume includes a chamois-leather coat, cloth covering
    eyes and face, head-bands to hold the cloth, and an iron disk on the breast; the
    covered face is explained by the shaman's supposed inner sight into the spirit-world.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:14
  text: In some places the Samoyed shaman uses a cap with a visor, and the leather
    coat bears jingling trinkets, little bells, and strips of cloth; the number seven
    plays an important role in the ornamentation.
  category: object
  evidence_refs:
  - ev:12
- id: obs:15
  text: Among the Lapps, the drum is said to have played a most important part, though
    it is now described as an antiquarian curiosity.
  category: sequence
  evidence_refs:
  - ev:13
