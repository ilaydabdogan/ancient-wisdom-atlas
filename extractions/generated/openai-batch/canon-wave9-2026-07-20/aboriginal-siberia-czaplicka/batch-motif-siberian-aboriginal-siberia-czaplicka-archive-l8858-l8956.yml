canonical_text:
  quote: ''
  summary: The passage describes Siberian shamanic vocation through crisis, spirit
    encounter, and ritual equipment; it gives examples involving Katek, Quikinnaqu,
    Yetilin, Chukchee orphans, dangerous obedience to spirits, shamanic invulnerability
    or self-wounding performances, and Tiuspiut's persistence despite punishment by
    Russian officials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Katek is about to kill himself with a belt-knife on an iceberg when a walrus-head
    appears from the water, sings to him, tells him not to kill himself, and promises
    he will see the mountains of Unisak and his son again; after returning home he
    sacrifices to the walrus-head and becomes a respected shaman.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says very old people are not expected to hear the shamanistic
    call; in a Koryak tale Quikinnaqu makes a drum from a small louse and becomes
    a shaman, while neighbours question whether he really has become one because he
    had no spirits within his call from youth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that young people in trouble call for help from spirits,
    and when spirits come to them such youths frequently become shamans.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yetilin, left alone in childhood with his small sister after his family dies
    from contagious disease, calls to spirits; they come, bring food, tell him to
    beat the drum, and promise assistance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says Chukchee tales contain accounts of poor, despised orphans
    protected by spirits and turned into shamans.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The vocation of the shaman is described as dangerous because lack of harmony
    or disobedience toward the spirits may bring immediate death.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Traditions are reported about shamans carried alive from earth to sky, killed
    by spirits, or struck down at their first meeting with powers they called upon.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage describes the shaman or wizard as one who undertakes danger not
    only for material gain but also to relieve the griefs of others, and it reports
    native distinctions between Great, Middling, and Mocking or deceitful shamans.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: A Chukchee tale says a murderer stabs a woman working with a fireboard, but
    the victim continues to make fire because she is a shaman-girl able to stab herself
    in performance; the attacker cannot kill her and only severs her tendons.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage mentions shamanic acts such as piercing oneself through with a
    knife so the end shows at the back, or cutting off one's head, putting it on a
    stick, and dancing around the yurta.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The shaman Scratching-Woman refuses alcohol, explaining that drink makes his
    temper dangerously bad, that his wife usually hides knives from him, and that
    he is afraid when they are apart.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Tiuspiut is repeatedly punished by Russian officials, and his shamanistic
    dress and drum are burned; he nevertheless returns to his duties and says shamans
    cannot stop shamanizing and do no harm by it.
  category: sequence
  evidence_refs:
  - ev:10
