canonical_text:
  quote: ''
  summary: The passage describes postmortem beliefs in which the deceased's soul enters
    a newborn child of the same kin group, while the shadow undertakes a difficult
    journey over mountains and fiery streams. Hair, nails, feathers, grave goods,
    and food assist the shadow. The shadow may take relatives' shadows, lives in an
    underground Arctic-Ocean shadowland ruled by Kul-Odyr, later diminishes or becomes
    a black-beetle and disappears. Kul-Odyr takes shadows by command of Numi-Torum
    and may return one taken too soon, explaining fainting.
  language: English
  quote_policy: summarized
