canonical_text:
  quote: ''
  summary: The passage describes Buryat marriage arrangements, including parental
    betrothal, exchange of daughters, bride-price, dowry, and wedding rituals. The
    ceremony includes a symbolic wife-capture scene, planting a birch before the yurta,
    a turushi carrying an arrow, shamanic ceremonies naming spirits, veiling and dressing
    the bride as a married woman, summoning the bridegroom three times, joining the
    couple by a handkerchief, blessing, offering grease to the fire, throwing grain,
    exchanging presents, and the bride’s later return to her parents for a time.
  language: English
  quote_policy: summarized
