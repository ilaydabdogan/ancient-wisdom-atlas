canonical_text:
  quote: a sea, bridged only by a hair
  summary: The passage describes a kam's ceremonial journey toward Erlik's underworld
    dwelling. He crosses distant landscapes and an iron mountain, reaches a dangerous
    hair bridge over a sea, sees failed or sinful kams and punished sinners, appeases
    dogs guarding Erlik's dwelling, approaches Erlik with ritual gestures, offers
    wine and gifts, receives promises of cattle increase, and returns on a goose represented
    by tiptoe movement.
  language: English
  quote_policy: quoted
