canonical_text:
  quote: ''
  summary: The passage reports Yakut evidence used by Troshchanski for a hypothesis
    that male black shamans developed from female black shamans, including gendered
    costume features, ritual access, and a proposed transfer of shamanic power through
    smiths and iron. The author then criticizes the hypothesis as insufficiently supported.
    The passage also lists Altaian ritual specialists, including diviners and weather
    controllers who use a stone found in windy mountain defiles, and begins a Buryat
    classification of shamans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Yakut shaman's apron is described as having two iron circles sewn on it
    that represent breasts.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man-shaman is described as dressing and braiding his hair like a woman
    and letting it fall down during performance.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women and shamans are both said to be forbidden to lie on the right side of
    a horse-skin in the ifioia.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The man-shaman is said to wear the shaman costume only on very important occasions
    and, ordinarily, to wear a girl's dress made from foal skin.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: During the first three days after confinement, Ayisit is said to be near the
    woman lying-in; men are forbidden access to the house, but shamans are not.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:6
  text: Troshchanski's explanation says that a smith making ornaments for a female
    shaman's garment acquired shamanistic power through contact with magically important
