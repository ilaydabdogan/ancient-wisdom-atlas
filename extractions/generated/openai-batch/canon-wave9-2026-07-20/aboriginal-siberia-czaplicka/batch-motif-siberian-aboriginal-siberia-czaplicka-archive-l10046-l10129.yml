  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: 'Among the Altaians, the passage lists a shaman called lam and additional
    practitioner types: rijnchi, telgochi, yarinchi, koll-kurechi, and yadachi.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The rijnchi foretell the future during painful attacks; telgochi are guessers;
