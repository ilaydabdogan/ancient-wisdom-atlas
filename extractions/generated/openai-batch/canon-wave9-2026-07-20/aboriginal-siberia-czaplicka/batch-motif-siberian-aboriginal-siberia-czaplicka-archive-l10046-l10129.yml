    a shaman.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:8
  text: In Troshchanski's explanation, the woman eventually gives up her place to
    the man because she could not be a smith.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: The passage states that, in modern times, because there are no longer magical
