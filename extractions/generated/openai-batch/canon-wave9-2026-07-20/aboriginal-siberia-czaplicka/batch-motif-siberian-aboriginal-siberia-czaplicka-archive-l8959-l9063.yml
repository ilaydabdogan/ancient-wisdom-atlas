candidate_motifs:
- id: motif:1
  label: Involuntary shamanic calling by spirits
  taxonomy_refs:
  - initiation
  basis: 'Multiple sections describe shamanic vocation as compelled by spirits: a
    dead shaman summons a dreamer, Altaians say no one becomes a shaman freely, and
    Chukchee youths fear spirits calling them.'
  evidence_refs:
  - ev:4
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage is ethnographic summary rather than a single mythic narrative.
- id: motif:2
  label: Ancestral or familial transmission of shamanic office
  taxonomy_refs:
  - initiation
  basis: The office is described as hereditary when a descendant has disposition;
    Ostyak fathers choose and instruct successors; Yakut and Buryat shamanistic spirit
    usually passes within a family; Altaian terminology invokes an ancestor spirit.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage also notes that heredity is not absolute and may depend on
    capacity or disposition.
- id: motif:3
  label: Dream summons from a dead shaman
  taxonomy_refs:
  - initiation
  basis: Among Tungus of Trans-Baikalia, a dead shaman appears in a dream and summons
    the dreamer to become his successor.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This specific form is reported for one group within the passage.
- id: motif:4
  label: Painful acquisition of shamanic power
  taxonomy_refs:
  - initiation
  basis: A new possessor of a familiar spirit is expected to suffer, Altaian call
