    while for a strong man it is very painful and may last one or more years.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:10
  type: summary
  locator: lines 9045-9063
  quote_or_summary: Some Chukchee youths fear drums, calling on spirits, or picking
    up possible amulets lest a spirit call them to shamanhood; some prefer death to
    obedience. Parents fear the danger for an only child, while large families may
    welcome one shaman. Preparation includes mental and physical training, segregation,
    and going to forests and hills under hunting or herding pretexts.
