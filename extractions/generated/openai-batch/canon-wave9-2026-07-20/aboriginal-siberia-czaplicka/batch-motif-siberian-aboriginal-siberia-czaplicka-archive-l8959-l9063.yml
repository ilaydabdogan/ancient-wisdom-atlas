comparison_claims:
- id: claim:1
  claim: The passage itself frames shamanic calling as a recurring Siberian pattern,
    stating that similar instances occur in records of all Siberian tribes and then
    presenting examples from Tungus, Ostyak, Yakut, Buryat, Altaian, and Chukchee
    contexts.
  claim_level: same_function
  target: Siberian shamanistic call and succession patterns across named groups
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The statement is a secondary ethnographic synthesis; the excerpt gives
    uneven detail for each group and does not establish historical contact or common
    inheritance.
- id: claim:2
  claim: Yakut and Buryat traditions are directly compared in the passage as sharing
    the usual passage of a shamanistic spirit from one family member to another, although
    the office is not necessarily hereditary.
  claim_level: same_function
  target: Yakut and Buryat familial passage of shamanistic spirit
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the function of familial spirit transmission
    and does not describe identical ritual procedures.
- id: claim:3
  claim: The passage juxtaposes Tungus dream summons, Altaian ancestral compulsion,
    and Chukchee painful preparation as variants of spirit-driven shamanic initiation.
  claim_level: same_motif
  target: Spirit-driven shamanic initiation motif family
  evidence_refs:
  - ev:4
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The shared motif is inferred from the passage's grouped discussion;
    the specific mechanisms differ by community.
