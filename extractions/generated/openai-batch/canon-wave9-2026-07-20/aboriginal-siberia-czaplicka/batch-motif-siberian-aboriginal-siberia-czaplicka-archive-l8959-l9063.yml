canonical_text:
  quote: ''
  summary: The passage describes Siberian shamanic vocation, compensation, heredity,
    succession, spirit transfer, and preparatory ordeals. It reports cases of shamans
    unable to abandon the calling, a dead shaman summoning a successor in dreams,
    fathers or spirits passing office within families, sale of a familiar spirit,
    involuntary Altaian calling by an ancestor spirit, and Chukchee preparatory training
    marked by fear, pain, dreams, segregation, and contact with drums or possible
    amulets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A former shaman stopped shamanizing after deciding it was a sin; another shaman
    took from him the sign called amaijijat, yet spirits made him blind.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A shaman in Baigantai repeatedly vowed to abstain from shamanism but returned
    to it when occasion arose; during performances his eyes were said to jump out
    on his forehead.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tiuspiut was described as poor, concerned with money, proud of his reputation,
    and offended when neighbors called in a more distant shaman.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bogoras reported that Palaeo-Siberian shamans did not live solely on profits
    from their art; it was an additional income source.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among the Tungus and Yakut, the shaman was recompensed only when successful,
    receiving money and food for a performance.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the Tungus of Trans-Baikalia, the shamanistic call appears when a dead
    shaman comes in a dream and summons the dreamer to become his successor; the candidate
    appears shy, distracted, and highly nervous.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that the shamanistic office is hereditary wherever a shaman's
    descendant shows a disposition for the calling.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Among the Ostyak, a father chooses his successor by capacity rather than necessarily
    by age and gives the chosen one his knowledge; without children he may pass the
    office to a friend or adopted child.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: An Ostyak shaman may sell his familiar spirit to another shaman, receive payment,
    divide his hair into tresses, and fix the time when the spirit is to pass to its
    new master.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After changing owners, the familiar spirit makes the new possessor suffer;
    lack of such effects is taken as a sign that the new shaman is not becoming proficient.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Among Yakut and Buryat people, the shamanistic spirit is said usually to pass
    from one person to another within the same family, although the office is not
    necessarily hereditary.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Altaians are said to believe that no one becomes a shaman by free will; the
    calling comes unwillingly, like a hereditary disease.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: An Altaian young man sensing symptoms of the call may avoid shamans and shamanistic
    ceremonies and may sometimes cure himself by will; the period is called 'the ancestor
    spirit leaps upon, strangles him'.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Among the Chukchee, the preparatory period is named with a term meaning that
    the candidate gathers shamanistic power.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: For weaker shamans and female shamans, Chukchee preparation is described as
    less painful and mainly dream-inspired; for a strong man it may be very painful
    and last one or more years.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: Some Chukchee youths fear taking a drum, calling on spirits, or picking up
    stones or other objects that may be amulets, because the spirit may call them
    to become shamans; some prefer death to obedience to the call.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Parents with only one child fear that child entering the calling because of
    its danger, while a large family may like having one member become a shaman.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: During preparation, the Chukchee shaman undergoes mental and physical training,
    is generally segregated, and goes to forests and hills under the pretext of hunting
    or watching herds.
  category: sequence
  evidence_refs:
  - ev:10
