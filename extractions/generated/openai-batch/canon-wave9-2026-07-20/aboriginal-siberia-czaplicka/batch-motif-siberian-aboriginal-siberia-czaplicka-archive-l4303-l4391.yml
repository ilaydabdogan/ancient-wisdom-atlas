canonical_text:
  quote: ''
  summary: The passage describes Maritime and Reindeer Chukchee marriage differences,
    Maritime Chukchee marriage rites involving sacrifice to the hearth and red ochre
    anointing, and Koryak rules concerning premarital chastity, childbirth before
    marriage, post-puberty behavior, census observations, and marriage prohibitions
    by blood and affinity. A footnote also describes contact-era paid prostitution
    among Maritime peoples and a gesture said to symbolize sleep.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Maritime Chukchee are seldom polygynous because they cannot
    support more than one family, while their tales frequently contain examples of
    polygyny.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Maritime Chukchee marriage rite is described as including sacrifice to
    the hearth and usually anointing with red ochre instead of blood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When asked what facial marks the married couple painted, informants answered
    that it made no difference; the author suggests the marks may formerly have been
    family marks, as among the Reindeer Chukchee.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A footnote reports that paid prostitution developed among Maritime peoples
    under the influence of American whalers, and describes women approaching a ship
    in skin boats while using a gesture interpreted as symbolizing sleep.
  category: action
  evidence_refs:
  - ev:11
- id: obs:5
  text: Koryak girls are reported to be prohibited from sexual intercourse before
    marriage; a man serving for a girl who violated the rule is ridiculed, and her
    father and brother are angry.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage reports that childbirth before marriage is considered shameful
    for a Koryak girl, who must go into the wilderness for delivery and afterwards
    kills and buries the child.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After puberty, a Koryak girl is said to keep her combination garment on during
    the night, especially when a stranger is present, and to behave distantly toward
    the man serving for her; she may be sent away from home during that period.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Dittmar is cited as saying that a Koryak girl who has premarital sexual intercourse
    is shot by her father, and the passage says similar statements occur in Koryak
    mythology.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Jochelson is cited as finding no illegitimate child among Maritime and Reindeer
    Koryak families in his census, in contrast to several neighboring or settler groups
    in northern Siberia.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: The listed blood-relative marriage prohibitions for a Koryak man include mother,
    daughter, own sister, cousin, father’s sister, mother’s sister, brother’s daughter,
    and own sister’s daughter; more distant direct ascendants and descendants are
    also recognized as relatives.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The listed affinity marriage prohibitions include stepmother, sister or cousin
    of a living wife, younger brother’s widow, deceased wife’s elder sister, nephew’s
    widow, and sisters or cousins of a brother’s wife.
  category: relationship
  evidence_refs:
  - ev:10
