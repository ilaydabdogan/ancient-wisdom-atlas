  summary: The passage discusses latah and amurakh as conditions marked by involuntary
    imitation after startling or external suggestion. It reports Clifford's observations
    among Malays, compares Malayan latah with Siberian amurakh or so-called arctic
    hysteria, reviews possible climatic and racial explanations, and expresses doubt
    that the condition should simply be classified as hysteria.
