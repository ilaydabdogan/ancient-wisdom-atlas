canonical_text:
  quote: ''
  summary: The passage gives a hymn to Yulgen, describes a shaman learning from Yulgen
    whether a sacrifice is accepted and what further sacrifices are required, then
    surveys Mongolic and Kalmuck seasonal sacrificial festivals involving animals,
    milk or kumys, prayer, tambourine, eastward orientation, communal feasting, and
    New Year or renewal symbolism.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hymn addresses Father Yulgen as exalted, creator of all men, giver of
    cattle, and mover of the starry sky.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hymn asks Yulgen to prevent sorrow, help the speakers withstand the evil
    one, keep them from Kermes, and not condemn the speaker for sin.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The shaman learns from Yulgen whether the sacrifice is accepted, receives
    information about the coming harvest, and learns what sacrifices the deity expects.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On such an occasion the shaman designates the neighbor required to furnish
    a sacrifice and describes the color and appearance of the animal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After conversation with Yulgen, the shaman reaches intense ecstasy, falls
    exhausted, has the tambourine and drum-stick removed by the Bash-tutlcan, and
    later seems to awake as if after a long absence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The festival sometimes ends after the shamanic consultation, but more often,
    especially among the wealthy, a third day is spent in feasting and libations to
    the gods.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Mongol sacrifices are described as regular or public and occasional or private,
    with three regular ceremonies: spring, summer, and autumn festivals.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The urus-sara festival is said to celebrate and symbolize the renewing of
    all things when the earth is green again, flocks increase, and milk is abundant.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: During urus-sara, Kalmuk offerings include kumys, herbs, and horses; sacrificial
    horses are tied to a rope between two poles, sprinkled with kumys, and marked
    with pink cloth fastened to their manes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The autumn festival sagan-sara, or white month, is described as ancient and
    formerly associated with the Mongol New Year.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the described Kalmuck spring ceremony, an owner brings a ram to seek increase
    of herds and flocks; an assistant kills it, while a priest faces east, chants,
    beats a tambourine, and requests many sheep and cattle.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the ram is flayed, its skin is put on a pole with the head to the east,
    the flesh is cooked in a cauldron, and the tribe holds a great festival.
  category: sequence
  evidence_refs:
  - ev:8
