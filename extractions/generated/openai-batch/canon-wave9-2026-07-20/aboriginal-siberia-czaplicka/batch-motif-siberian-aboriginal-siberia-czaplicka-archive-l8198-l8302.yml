    other occasions such as horse sacrifice to a god.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 8294-8298
  quote_or_summary: If death occurs by lightning, the Uriankhai prepare a raised platform
    for the corpse; flesh of an animal struck by lightning is never eaten.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 8299-8302
  quote_or_summary: According to Castren, among Samoyed there is no future life for
    the ordinary man; the dead is buried with many belongings, is supposed to exist
    briefly, and during that time food is brought to the grave.
