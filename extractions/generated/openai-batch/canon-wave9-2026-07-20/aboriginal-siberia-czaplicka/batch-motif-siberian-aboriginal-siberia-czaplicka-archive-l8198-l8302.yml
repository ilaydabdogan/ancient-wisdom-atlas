- id: ev:8
  type: summary
  locator: lines 8239-8247
  quote_or_summary: Altaian corpses are dressed and supplied with cap, food, cup,
    and spoon; there is no feasting after death; relatives pray to Tin Shaitan for
    seven days, and parents of a dead child avoid entering another yurta for forty
    days.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 8247-8255
  quote_or_summary: Among Uriankhai, a shaman's corpse is exposed on a raised platform
    with drum and coat above its head; an ordinary corpse is placed in a hollow tree-trunk,
    a cup-topped pole is set near the head, and a rich man's corpse wears a new coat
    with an old piece attached.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 8255-8264
  quote_or_summary: A fire is made near the Uriankhai mortuary place and portions
    of flesh, meal, and oil are burned; relatives for seven days do not carry anything
    out of the yurta to sell or give away, though hospitality inside is allowed; the
    text compares a Mongol restriction not associated with burial.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 8265-8292, note
  quote_or_summary: The note says similar restrictions on carrying things out occur
