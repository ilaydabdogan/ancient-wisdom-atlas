candidate_motifs:
- id: motif:1
  label: Powerful corpse affecting weather
  taxonomy_refs: []
  basis: The Yakut corpse before burning is believed able to disturb natural forces
    and make storms, with a shaman's corpse stronger.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage reports belief and custom; it does not describe a narrative
    episode.
- id: motif:2
  label: Erased funeral tracks preventing the living from following the dead
  taxonomy_refs: []
  basis: A great wind is favourable because it smooths tracks to the funeral place;
    otherwise many living people will follow the dead.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The mechanism by which the living follow the dead is not elaborated in
    the passage.
- id: motif:3
  label: Elevated or arboreal exposure of the dead
  taxonomy_refs: []
  basis: Dead bodies are described as exposed on trees, on platforms, or in raised
    structures among Yakut, Altaians, and Uriankhai.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:9
  - ev:12
  confidence: high
  cautions: Although trees are present, the passage does not state a cosmic-tree or
    axis meaning.
- id: motif:4
  label: Animal or horse accompanying the dead
  taxonomy_refs:
  - sacrifice
  basis: The passage mentions killing the best horse, burial in a mountain with the
    best horse, and a living animal buried with the person or tied to a nearby tree.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:7
  confidence: medium
  cautions: The available taxonomy term 'sacrifice' is plausible for the animal killing
    or mortuary offering, but the passage does not explicitly use that interpretation
    for all instances.
- id: motif:5
  label: Provisioning the dead with belongings, food, and equipment
  taxonomy_refs: []
  basis: The passage repeatedly describes utensils, food, weapons, cap, pouch, cup,
    spoon, clothing, drum, coat, belongings, and grave food associated with the dead.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:8
  - ev:9
  - ev:13
  confidence: high
  cautions: No full afterlife itinerary is given in this passage.
- id: motif:6
  label: Requested burial and ritual killing of an elderly or weak person
  taxonomy_refs: []
  basis: The former Yakut custom describes an old or weak person requesting burial,
    being feasted and honoured, then taken to a forest grave and struck down.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage presents this as a reported former custom, not as a mythic
    narrative.
- id: motif:7
  label: Restless earth-bound dead
  taxonomy_refs: []
  basis: The passage says some souls never leave earth and are never quiet, and identifies
    categories of dead whose souls become yor.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The term yor is reported, but the passage gives limited detail about their
    actions beyond remaining unquiet.
- id: motif:8
  label: Post-death household restriction or quarantine
  taxonomy_refs: []
  basis: Altaians observe seven-day prayers and a forty-day restriction for parents
    of a dead child; Uriankhai relatives must not carry anything out of the yurta
    for seven days.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage gives restrictions but little explanation of their intended
    effect.
- id: motif:9
  label: Mortuary fire offering
  taxonomy_refs:
  - sacrifice
  basis: Among the Uriankhai, a fire is made near the mortuary place and portions
    of flesh, meal, and oil are burned.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage describes burning food portions but does not name the recipient
    or explicitly call the act a sacrifice.
- id: motif:10
  label: Lightning-death as a special mortuary category
  taxonomy_refs: []
  basis: If a Uriankhai death occurs by lightning, a raised platform is prepared,
    and flesh of an animal struck by lightning is never eaten.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage does not explain why lightning-death receives this treatment.
- id: motif:11
  label: Brief post-mortem existence with grave feeding
  taxonomy_refs: []
  basis: Among the Samoyed, the ordinary dead person is said to exist briefly after
    death, during which food is brought to the grave.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage explicitly denies belief in a future life for the ordinary
    man, so this should not be treated as a developed afterlife journey motif.
comparison_claims:
- id: claim:1
  claim: The passage reports Sieroszewski's opinion that the Yakut tree or platform
    exposure custom may have been borrowed from the Gilyak or Yukaghir.
  claim_level: historical_contact
  target: Gilyak or Yukaghir mortuary exposure practices
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: low
  limitations: This is presented as Sieroszewski's view, and the passage gives no
    independent supporting details from Gilyak or Yukaghir practice.
- id: claim:2
  claim: The passage explicitly compares the Uriankhai seven-day restriction on carrying
    things out of the yurta with a Mongol restriction, while noting that the Mongol
    custom is not associated with burial.
  claim_level: same_function
  target: Mongol kerektey udur sertey restriction on carrying things out of the house
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited because the passage says the Mongol custom
    is not burial-associated.
- id: claim:3
  claim: A note in the passage identifies similar restrictions on carrying things
    out of the house among Buryat of Alarsk, Darkhat, and Diurbiut in other ritual
    or calendrical contexts.
  claim_level: same_function
  target: Buryat, Darkhat, and Diurbiut restrictions on carrying things out of the
    house
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The cited parallels occur in varied contexts such as fire sacrifice,
    cattle-breeding periods, death-day numbering, and horse sacrifice, so they are
    not all direct burial parallels.
