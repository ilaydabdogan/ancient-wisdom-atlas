  type: summary
  locator: lines 8232-8239
  quote_or_summary: Among Altaians, corpses may be exposed on a raised platform, buried
    in a mountain with the best horse, burned, exposed on a tree, or formerly laid
    on the ground and covered with tree boughs.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
