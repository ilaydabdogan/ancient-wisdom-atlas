canonical_text:
  quote: ''
  summary: The passage surveys Yakut, Altaian, Uriankhai, and Samoyed death customs,
    including fear of corpses, exposure or burial practices, grave goods, animal accompaniment,
    household restrictions, treatment of shamans and lightning-death, and beliefs
    about souls or short post-mortem existence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Yakut, a corpse before burning is feared as able to disturb natural
    forces and produce storms; a shaman's corpse is described as still more powerful.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A great wind at a funeral is regarded as favourable because it smooths out
    tracks on the way to the funeral place; otherwise many living people may follow
    the dead.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that a former practice is now restricted to killing the
    best horse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sieroszewski reports that Yakut formerly exposed the dead on a tree or on
    a platform placed on two poles, and that another Yakut burial form leaves the
    dead in the house with the deceased person's utensils.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a former Yakut custom, an old or very weak person requested relatives to
    bury him, was honoured during a three-day feast, and wore his finest garments.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the third day of that custom, relatives took the person to a prepared forest
    grave and one relative struck him down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Food and weapons were placed in the grave; sometimes husband and wife were
    buried together, and sometimes a living animal was buried with the person or tied
    to the nearest tree.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sieroszewski recounts that a Cossack brought an old woman from a grave in
    the forest, and she lived for several years afterwards.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Until the corpse is buried, the soul remains near the house and tries to remind
    relatives of its existence.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some souls never leave the earth and are called yor; the passage lists souls
    of the young, violently dead, improperly buried, shamans, and great people among
    those that become yor.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Among the Altaians, the corpse may be exposed on a platform, buried in a mountain
    with the deceased person's best horse, burned, or exposed on a tree.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Altaian corpse is dressed and supplied with items including a cap, food
    in a pouch, a cup, and a spoon; the passage says there is no feasting after death.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Among Altaians, relatives pray to Tin Shaitan for seven days after a death,
    and parents of a dead child may not enter anyone's yurta until forty days have
    passed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Among the Uriankhai, a shaman's corpse is exposed on a raised platform with
    his drum and coat hung above its head, while an ordinary person's corpse is placed
    in a hollow tree-trunk.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: For Uriankhai burials, a pole with a cup-shaped top may be placed near the
    corpse's head; a rich man's corpse wears a new coat with a piece of old coat attached.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: A fire is made near the Uriankhai mortuary place and portions of flesh, meal,
    and oil are burned.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Uriankhai relatives must not carry anything out of the yurta to sell or give
    away for seven days after death, but may offer hospitality inside.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: For a Uriankhai death caused by lightning, a raised platform is prepared;
    flesh of an animal struck by lightning is never eaten.
  category: action
  evidence_refs:
  - ev:12
- id: obs:19
  text: According to Castren, among the Samoyed there is no belief in a future life
    for the ordinary man, but the dead person is thought to exist for a short time,
    and food is brought to the grave.
  category: relationship
  evidence_refs:
  - ev:13
