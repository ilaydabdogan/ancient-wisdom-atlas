  summary: The passage discusses an ethnographic argument that some captive, conquered,
    or enslaved men were degraded by association with women, women’s clothing, and
    women’s work. It compares a Kamchadal category called loekchuch/koekchuch with
    examples involving the Delawares under the Iroquois, Yukaghir and Koryak captive
    slaves, and Chukchee terms for slaves implying weakness or contempt.
