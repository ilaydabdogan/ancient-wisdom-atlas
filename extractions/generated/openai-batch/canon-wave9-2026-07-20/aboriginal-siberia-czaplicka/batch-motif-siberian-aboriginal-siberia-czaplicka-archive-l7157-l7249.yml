canonical_text:
  quote: ''
  summary: The passage describes Siberian birth, fertility, naming, and child-protection
    customs among Buryat, Uriankhai, Diurbiut, and Altaian groups, including fire
    rites, shamanic care, ongon figures, protective effigies, concealment under a
    cauldron, simulated child death, and naming after the first person entering the
    yurt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A birth-related feast includes repeated questions and answers, naming of the
    child, making a fire at the birth-place, guests and the father surrounding the
    fire, squirting salamafa into it, and repeating an invocation for happiness and
    a son three times.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Participants in the feast smear friends' faces and clothes with oil, ashes,
    and fresh animal excrement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Buryat statements about childlessness and oaths are expressed through the
    image of the hearth fire going out or being extinguished.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among the Buryat of Alaisk, when first children die, parents catch and feed
    a brown owl, believing it will send away the bad spirit AnakJiai when the child
    cries in the cradle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In preparing the useten ongon, women make a figure, men make a box, and the
    woman concerned carries swaddling clothes or a doll and pretends to nurse it while
    guests treat it as a child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the naydji custom, a portion of a killed sheep is sent to invite a shaman,
    who comes to the house, orders a shaman's staff made, places it across the threshold,
    and hangs an amulet around the child's neck.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: For the following year the child is under the shaman's care, and at the year's
    end the amulet is returned and the parents bring garments and presents, sometimes
    a horse, to the shaman.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Among the Buryat of Idinsk, childless families arrange a feast with a shaman,
    women and girls dance, the shaman sings to the Bear ongon with his staff, and
    he strikes the cheeks of those present; those hit hardest are expected to become
    parents.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Among the Uriankhai, when first children die young, the newborn is hidden
    under a cooking cauldron with a hare-skin ongon and a barley-meal figure representing
    the child placed above it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Uriankhai account says the shaman shamanizes over the barley-meal figure;
    the figure comes to life, is cut open, bleeds and cries, is cut into three parts,
    and is buried far from the house to protect the child from death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Diurbiut ceremony hides the child under a cauldron for three days while
    relatives place a grass image in the parents' tent; the parents mourn and bury
    it as the dead child to deceive the evil spirit chitkur.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Among the Altaians, birth occurs before a large assembly that shouts and fires
    guns, and the head of the family usually names the child after the first person
    who enters the yurt after delivery.
  category: sequence
  evidence_refs:
  - ev:9
