canonical_text:
  quote: ''
  summary: 'The passage describes the final rites of a bear festival, including apologies
    to spirits, libations, dances by women and foster-mothers, the killing of the
    bear, offerings to its spirit, feasting, and consumption of blood and liver. It
    then summarizes Yakut sacrificial categories, animal dedication to Urun-Aiy-Toyon,
    offerings through fire, a substitutionary bargain involving an animal soul, and
    two Yakut tribal festivals: a spring festival for good spirits with a dramatized
    struggle of spring and winter, and an autumn night festival for black spirits
    directed by shamans and shamanesses. The passage ends by introducing an Altaian
    sacrifice to Bai-Yidgen without describing it in detail.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before the bear ceremonies, apologies are made to spirits for capturing and
    detaining the bear, and the killing is explained as necessary because the animal
    can no longer be fed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The person conducting the festival invites relations and friends, usually
    nearly the whole village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before the ceremonies, the host and guests make libations to the family hearth-fire,
    and sacrifices are made to the spirit-owner of the dwelling in a sacred corner
    of the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The woman who reared the bear weeps, and women and girls dance around the
    bear's cage while clapping and singing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The bear receives wine in a special cup before the killing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The bear is removed from its cage, a cord is fastened around its neck, and
    a stick is thrust down its throat by several people so that it is choked to death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The bear's body is laid out with embellishments; the embellishments are more
    numerous and elaborate when the bear is female.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Food and drink are offered to the spirit of the killed bear, and feasting
    and merriment follow with the stated aim of making the bear-spirit joyous.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The bear is flayed and disembowelled, the head is cut off, blood is collected
    in a pot and drunk only by men, the liver is eaten with women and girls receiving
    small portions, and the remaining meal is kept for the next day's feast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:10
  text: Among the Yakut, bloody sacrifices are made to ahassylars, while bloodless
    sacrifices are made to aiy and ichchi; the nature of the ceremony indicates whether
    it is offered to black or white spirits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: Animals may be dedicated to Urun-Aiy-Toyon; such animals are not used for
    work, and mares dedicated in this way are not milked.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: Some beings called aiy are described as belonging to the class of ulassy,
    and offerings of choicest meat and drink are made to them through fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Offerings to abassylars are described as a compromise or bargain in which
