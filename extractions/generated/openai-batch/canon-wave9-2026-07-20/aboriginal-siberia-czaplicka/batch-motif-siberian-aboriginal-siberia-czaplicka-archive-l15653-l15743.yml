  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tungwe ran and raved on the driving ice at night; three men pursued her through
    deep snow, restrained her, and brought her back.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After quiet, Tungwe became rational again, but was weak and had slight freezing
