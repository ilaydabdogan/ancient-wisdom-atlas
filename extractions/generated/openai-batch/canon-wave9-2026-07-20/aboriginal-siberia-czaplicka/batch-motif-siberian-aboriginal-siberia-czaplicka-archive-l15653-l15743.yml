literal_observations:
- id: obs:1
  text: Pallas reports that unexpected touch, sudden calling, whistling, or a sudden
    frightening appearance could throw some people among listed Siberian and Arctic
    groups into fury.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Samoyed and Yakut persons in such a state might seize a knife,
    axe, or other weapon and attack the object of their terror unless restrained.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The passage describes a remedy attributed to Samoyed and Ostyak practice:
    smoke from burning reindeer-skin or reindeer hair is placed under the patient''s
    nose, producing faintness and long sleep.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A young Samoyed shaman feared an approaching stranger, seized the stranger's
    extended finger with both hands, ran away, and later recovered after reassurance
    through an interpreter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When a black glove was put on the young shaman, he stared at it, became violent,
    tried to get it off, and took it to be a bear's claw until bystanders removed
    it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Whitney reports that Tukshu began suddenly to rave after leaving a boat, tore
    off his clothing, and would have thrown himself into the water if others had not
    restrained him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Whitney describes a gloomy stillness before the long polar night and says
