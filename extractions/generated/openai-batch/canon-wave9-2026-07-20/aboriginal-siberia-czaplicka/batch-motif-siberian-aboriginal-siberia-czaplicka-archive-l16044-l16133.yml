canonical_text:
  quote: ''
  summary: The passage discusses explanations of so-called Arctic hysterical maladies,
    challenges an exclusively Arctic explanation by comparing them with Malay latah,
    and summarizes Clifford's descriptions of startle-induced loss of self-control,
    imitation, repeated speech, dangerous mimicry, mutual imitation, collapse, and
    Malay tales about latah-folk frightening a tiger by imitation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Travellers are reported to ascribe certain hysterical maladies to Arctic conditions
    such as darkness, light summer nights, cold, silence, monotony, and scarcity of
    food.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that these nervous diseases are especially frequent in
    the dark season or during transitions from one season to another.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author says similar symptoms are found among peoples of Equatorial regions
    and cites a Malay Peninsula nervous disease called latah.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Clifford describes latah as an affliction in which startled persons lose self-control
    and rely on imitative faculties.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The description says a person can make a latah sufferer perform an action
    by feigning the action with a gesture.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sat, Clifford's cook, is described as affected by the condition and as heavy-looking,
    clumsily built, stolid, and not apparently nervous.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A mischievous boy gestured as if putting his hand in the fire; Sat followed
    the gesture and burned his fingers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After repeated persecution, Sat's suggestibility is said to have become chronic,
    so that he repeated addressed words over and over.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Other people in Clifford's household had prior startle-seizures, and the presence
    of Sat seemed to weaken their self-control.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: An old man asked Clifford to prevent others from taking advantage of his illness.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Startling a suspected sufferer is described as the test for the malady; observed
    cases are said to differ only in degree.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: In one episode, a boy made a noise with a rattan, causing two affected men
    to cry out, jump, imitate each other's gestures, use filthy language, rock their
    bodies, and eventually fall in fits with foam at the mouth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Malay tales are said to tell of latah-folk terrifying a tiger by imitating
    its motions.
  category: speech
  evidence_refs:
  - ev:7
