canonical_text:
  quote: ''
  summary: The passage describes Chukchee social organization among Reindeer and Maritime
    groups, including camp and village leadership, front houses, occasional claims
    to local-spirit privilege, boat-crew organization and hunt-product distribution,
    a ceremony involving animal heads, and rules concerning murder, blood revenge,
    and an incident in which Leivitihin is killed by his brother with community approval.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes Reindeer Chukchee, who live in camps, from Maritime
    Chukchee, who live in villages.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Reindeer Chukchee, the family is described as the permanent unit,
    while the camp is an unstable economic unit associated with one herd.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Reindeer Chukchee camp has a master living in the front or chief tent; other
    tent residents are called camp-companions, and the master is also called the strongest
    one.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Joining a camp requires permission from those already camped there, and the
    passage mentions vagrants who wander the tundra with few or no reindeer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Maritime Chukchee villages are organized by territorial contiguity, and the
    longest-resident family may occupy a front house or house of the strongest.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The master of a Maritime Chukchee front house may sometimes claim a privileged
    relationship with the local spirit and may sometimes receive tribute, though this
    is not general.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Maritime Chukchee boatful consists of eight oarsmen and one helmsman or
    boat-master, who is also the boat owner and formerly its constructor.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Products of the sea hunt are distributed according to rules: some animals
    belong to the killer, meat and blubber may be divided equally, the boat-master
    receives certain shares, and animal heads and tusks have special handling.'
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Murder outside the family group is subject to blood revenge by the victim's
    family group, while murder within the family group is treated as a matter for
    that group.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Leivitihin is described as abusing his family and driving-reindeer; after
    killing one of his team, his brother stabbed him, and neighbours approved the
    act.
  category: action
  evidence_refs:
  - ev:9
