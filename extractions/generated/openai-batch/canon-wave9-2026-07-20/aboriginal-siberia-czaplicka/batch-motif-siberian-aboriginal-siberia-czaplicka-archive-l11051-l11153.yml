canonical_text:
  quote: ''
  summary: 'The passage describes shamanic accessories among Altaian, Teleut, Chern
    Tartar, and Kumandinsk Tartar groups: coat attachments, owl-feather collars, dolls
    called heavenly maidens, bells that call spirits, caps and masks, crutches or
    horse-staves, and drums whose construction, rattles, and drawings are connected
    with spirits, spiritual power, and images of upper and underground worlds.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shamanic coat is described with an arrow for frightening hostile spirits,
    copper disks, and tobacco-bags containing imaginary tobacco offered to spirits
    while the shaman wanders in their country.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A collar is trimmed with owl feathers; one shaman reportedly had seven little
    dolls on the collar, identified to Potanin as heavenly maidens.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bells sewn to the costume are explained as the voice of the seven maidens
    calling spirits to descend.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Altaian shaman's cap is made from reindeer-calf hide with feathers, string,
    and shell-fish fringe; some Teleut shamans use a brown owl-skin cap, sometimes
    with the bird's head.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that not all shamans can wear the manijak and owl-skin
    cap; spirits generally announce when the chosen man may wear them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the Tartars of Chern, the shaman wears a mask with squirrels' tails
