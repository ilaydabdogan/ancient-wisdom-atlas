canonical_text:
  quote: ''
  summary: The passage summarizes Ainu ideas about the route and judgment of souls
    after death, including Pokna-Moshiri, three roads, testimony by a fire goddess,
    and a life-picture used against a denying spirit. It also reports debated claims
    about Ainu women, souls, and prayer, and Chamberlain's caution that Ainu heaven
    and hell concepts may have been influenced by Japanese Buddhist terminology. The
    latter part summarizes Yakut sky deities, especially Urun-Aiy-Toyon and Art-Toyon-Aga,
    a layered sky hierarchy, benevolent gods, clan ceremonies, kumys sacrifice, and
    a list of named deities and functions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: All souls are said to go first to Pokna-Moshiri, described as the underworld.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'At Pokna-Moshiri there are three roads: one to Kanna-Moshiri, one to Kamui-Kotun
    or Kamui-Moshiri, and one to Teinei-Pokna-Shiri.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The soul is sent to Kamui-Kotan or Teinei-Pokna-Shiri on the testimony of
    the goddess of fire, with the destinations described in terms of reward for a
    good life or punishment for an evil one.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the spirit denies doing evil, it is confronted by a picture representing
    its whole life, kept by the firegoddess, and the spirit is described as self-condemned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some Ainu are reported as holding that women have no souls and are not allowed
    to pray; Batchelor is reported as proposing a social explanation for the prayer
    prohibition.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Chamberlain is reported as saying that Ainu Paradise and Hell concepts may
    not be original, because modern Japanese Buddhist names are used, while fairy-tales
    mention Pokna Moshiri rather than Heaven or Hell.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Troshchanski is reported as identifying Urun-Aiy-Toyon as the chief benevolent
    Yakut god, the white lord, and creator of earth and man.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Troshchanski is reported as interpreting Urun-Aiy-Toyon as father of light
    and possibly originally a Yakut sun god; the sun is also named Kun-Toyon or Kun.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sieroszewski and Priklonski are reported as placing Art-Toyon-Aga as the highest
    god in the Ninth Sky and Urun-Aiy-Toyon in the Third Sky, next in dignity.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Yakut sky-gods are said to be divided into nine bis or agas, while the
    gods of the lower world are divided into eight.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Art-Toyon-Aga is described as ruler of light and life, speaking in storm and
    thunder, approached only in exceptional circumstances, and honored at ysyakh ceremonies
    with kumys sacrifice.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that bloody sacrifices are generally not made to benevolent
    deities, with a limited exception for the hunting god Bay-Nay.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The listed Yakut sky deities include Urun-Aiy-Toyon, Nalban-Aiy/Kiibay-Khotun-Lii,
    Nalygyr-Aissyt-Khotun, An-Alay-Khotun with her children, Silttii-kiirJi-Djasagai-Aiy,
    Mogol-Toyon and his wife, Bay-Nay, and gods guarding roads to the sky.
  category: sequence
  evidence_refs:
  - ev:8
