canonical_text:
  quote: ''
  summary: The passage summarizes death-related customs and beliefs. It describes
    qualities of the dead soul, including tracklessness, a possible second death,
    and a three-day period before recognition of death. Dead relatives await the newly
    dead and prepare a feast. Some harmful dead souls are categorized by origin. The
    passage also reports ancestor veneration, former killing of the aged, and a note
    that postmortem judgement is treated as a Buddhist borrowing. In the Yakut section,
    a dying man asks for food and drink; an animal is slain after death to accompany
    the soul to the abode of the departed; the body lies three days before burial;
    gravediggers return without looking back and pass through fire; objects in contact
    with the dead are burned; children’s cradles and toys are placed at the grave
    or on a tree; and former important burials included riding animals, provisions,
    and a servant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the other world has feasting and marriage ceremonies,
    and that people are dressed well or badly according to the condition of their
    burial garments.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dead soul is described as visible to the living, leaving no tracks on
    hearth ashes, and passing noiselessly over dead leaves.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dead soul can be killed, then takes the form of a pelvis, and may become
    a soul again after three days unless the pelvis is prevented; in some places,
    the second death leaves no trace.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dead relatives await the newly dead in the other world and prepare a feast
    for him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: For three days the newly dead man has difficulty realizing that he is dead,
    and other souls make him pass over hearth ashes to demonstrate that he leaves
    no tracks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage names harmful transformed dead souls, including dalchidz and mu-slm-hii,
    and describes their associated origins and targets.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Klementz is reported as saying that only distinguished persons are venerated
    after death.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: In former times, aged men and women were dressed in best clothes, seated in
    a place of honor, and made to swallow a strip of fat, causing death by suffocation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The custom of killing the aged is said to have been established by Esseghe
    Malan Tengeri, one of the Western good Tengeris.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A poor Yakut named Tarsatyng sent a message asking for melted butter, vodka,
    and meat because he was dying and wanted once more to enjoy earthly goods.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A Yakut deceased person’s soul is expected to journey to the abode of the
    departed accompanied by an animal slain directly after death.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The slain animal differs by the sex and wealth of the deceased, its flesh
    is eaten by gravediggers and funeral company, and lack of blood shed on a grave
    is treated as dangerous.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:13
  text: The Yakut body is clothed in a rich garment and placed in a dwelling corner
    for three days, then on the third day is put in a wooden coffin drawn to the grave
    by a horse or bullock.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Gravediggers return without stopping or looking back, and at the village gate
    they and the animal pass through fire made from the dead man’s straw and leftover
