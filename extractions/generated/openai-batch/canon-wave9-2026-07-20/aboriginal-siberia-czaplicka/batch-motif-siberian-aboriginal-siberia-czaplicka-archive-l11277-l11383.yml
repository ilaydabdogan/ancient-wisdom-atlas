canonical_text:
  quote: They represent the horses on which the shaman rides to the upper and lower
    worlds.
  summary: The passage describes accessories of Siberian and Buryat shamans, including
    a costume with ritual objects, the Buryat orgoy coat, caps, iron caps, horse-staves,
    and a drum interpreted as a horse for shamanic flight.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A female shaman near Selenginsk has an incomplete costume hanging in her yurt,
    along with a box of cloth strips, small stones, thunderbolts, and a felt bag of
    felt idols.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: For the old Buryat shaman costume, the coat, cap, and horse-staves are named
    as the chief appurtenances.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The orgoy coat is white for a white shaman and blue for a black shaman, and
    its shape is said not to differ from an ordinary coat.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The front of the coat is covered with metal figures of horses, fishes, birds,
    and other forms; the back has twisted iron representing snakes, with rattles,
    bells, and tambourine-bells.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The coat includes copper disks on the chest and iron plates on the sleeves
    imitating shoulder and forearm bones.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ordinary cap is peaked, made of lynx skin, and has ribbons on top; after
    the fifth consecration the shaman can wear an iron cap with hoops, horn-like projections,
    iron weights, and a chain ending in small spoon-like and awl-like objects.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Horse-staves are found among Baikal Buryat shamans but not Balagan Buryat;
    each Baikal shaman has two, made of wood or iron, with the iron staff given after
    the fifth consecration.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Wooden horse-staves for a novice are cut the day before first consecration
    from a birch tree in the forest where shamans are buried, and the tree must not
    perish or it is a bad omen.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A horse-staff is about 80 cm long and shaped with a horse-head, knee-joints,
    and hoof, with bells, iron weights, colored ribbons, fur strips, and miniature
    stirrups attached.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The iron horse-staves represent horses on which the shaman rides to the upper
    and lower worlds; Khangaloff also says the drum symbolizes the horse on which
    the shaman makes his flight.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
