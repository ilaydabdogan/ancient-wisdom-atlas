canonical_text:
  quote: ''
  summary: The passage describes Yakut shamanic accessories, especially amagyat, a
    term used for both an invisible power and a visible symbol. The visible amagyat
    is described as a copper or tin plate or ornament, often human-shaped, worn on
    the breast or suspended around the neck. It is linked to a shaman’s vocation,
    protection, initiation, clan continuity, spirit assistance, and postmortem transformation.
    The passage also describes other coat accessories, including a fish-shaped plate
    used to entice secondary spirits, copper balls forming a fringe, animal and celestial
    images, and iron representations of skeleton and bowels.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The word amagyat is presented as having a double sense: an invisible power
    and a visible symbol; the chapter focuses on the visible symbol.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A shaman, when beginning to shamanize, hangs a copper plate identified as
    amagyat on his breast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The absence or possession of amagyat differentiates less important shamans
    from shamans who possess it, and the strength of amagyat is said to affect their
    power.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Great shamans are described as having a spirit-protector sent by Ulu-Toyen.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In shamanic action, the shaman implores his amagyat and other protecting spirits;
    when the amagyat descends, he begins frenzied dances.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When a family has had a shaman, after the shaman’s death the amagyat is said
    to seek re-embodiment in someone of the same clan.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Amagyat is described as a being apart, usually the soul of a departed shaman,
    and sometimes one of the secondary supreme beings.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The spirit-protector is said to reside close beside the shaman rather than
    inside him, assisting at critical moments and enabling the shaman to see and hear.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Possession of amagyat is said not to depend on the shaman; it may come by
    accident or by decree from above, and Tiuspiut is said to have obtained his accidentally.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Great shamans at death are said to take their amagyat with them and change
    into heavenly beings; if the amagyat does not depart in this way, it will later
    show itself on earth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Troshchanski describes amagyat as the most important ornament of the Yakut
    shaman’s coat, representing a man and made of molten copper or tin on the breast
    area of the coat.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Amagyat is described as the sign of the shaman’s vocation, given by an old
    shaman to a new shaman and suspended around the neck during initiation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A shaman who no longer wishes to shamanize may have the amagyat sign removed;
    one account says an old blind Yakut gave up the vocation, had the sign removed,
    and was nevertheless blinded by spirits.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: A Mongolian term, imagatchi, is described as a tin figure of the protective
    genius of house, family, and goods, and is said by Katanoff to derive from a word
    meaning grandmother.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The balyk-timir is a fish-shaped plate with head, fins, tail, and scales;
    in some places it drags on the ground to entice secondary spirits that run after
    it.
  category: object
  evidence_refs:
  - ev:10
- id: obs:16
  text: Choran are small hollow copper balls fastened to long leather straps as a
    fringe, and the coat also bears animal, bird, fish, celestial, skeletal, and bowel
    representations.
  category: object
  evidence_refs:
  - ev:11
  - ev:12
