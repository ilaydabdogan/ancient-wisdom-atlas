  quote: ''
  summary: 'The passage describes several shamanic performances: one involving drumming,
    animal-voice imitation, ventriloquistic sound movement, exhaustion, and a summoned
    spirit declaring that disease has left a village; another performed for Jochelson''s
    divination about safe travel, in which a shaman uses a knife in an apparent self-cutting
    demanded by spirits; and a Chukchee performance pattern involving darkness, drum,
    song, narcotic tobacco, and audience or family answering calls.'
