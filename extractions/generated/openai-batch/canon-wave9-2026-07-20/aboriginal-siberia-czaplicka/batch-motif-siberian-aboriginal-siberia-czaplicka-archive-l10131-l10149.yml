canonical_text:
  quote: ''
  summary: The passage describes hereditary smiths as knowledgeable people whose profession
    is especially hereditary in the north. A smith in the ninth generation first gains
    supernatural qualities, increasingly marked with older ancestry. Spirits are said
    to fear iron hoops, the noise of smiths' bellows, and smiths themselves. Only
    a ninth-generation smith can safely make iron parts of shamanistic dress, drum
    iron, or ihndgyat; an insufficiently ancestral smith risks having his heart torn
    apart by birds unless surrounded by hammering noise and fire glare. Respectable
    hereditary smiths are said to have tools possessed by spirits that make sounds
    by themselves.
  language: English
  quote_policy: summarized
