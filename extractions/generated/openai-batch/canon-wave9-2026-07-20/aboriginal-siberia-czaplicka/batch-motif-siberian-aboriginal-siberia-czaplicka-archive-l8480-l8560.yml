canonical_text:
  quote: ''
  summary: The passage surveys scholarly views on Siberian Shamanism, rejects limiting
    it to Mongols or deriving it from Buddhism, contrasts family and professional
    shamanism among Palaeo- and Neo-Siberian groups, explains variation through environment
    and migration, notes persistence beneath official religious registration, and
    frames Shamanism as involving animistic and preanimistic conceptions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Banzaroff is reported as arguing that Shamanism did not arise from Buddhism
    or another religion, but originated among Mongolic nations and includes ceremonies
    as well as a way of observing Nature and the soul.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author disagrees that Shamanism is limited to Mongols and states that
    it is found over northern and part of central Asia.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes present-day Palaeo-Siberians as having the simplest
    form of Shamanism and more family than professional Shamanism.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Professional Shamanism is defined as communal ceremonies performed by a specialized
    or professional shaman; among the Palaeo-Siberians it is described as in its infancy
    and more affected by Christianity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among Neo-Siberians, with the Yakut as an example, professional Shamanism
    is described as strongly developed, while family Shamanism has been more affected
    by European influences.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author states that it cannot be inferred that the Palaeo-Siberian form
    is more primitive, because professional Shamanism may be either a development
    from family Shamanism or a degenerate form under certain conditions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says Yakut migrants to the north and Gilyak migrants to the south
    absorbed customs and beliefs of their new surroundings, showing no fundamental
    difference between their shamanistic practices.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage links Shamanism to continental climatic conditions, including
    extremes of cold and heat, storms, hunger, fear, and long winters, and says even
    some Europeans in Siberia have fallen under shamanistic superstitions.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The official census is said to count only a small part of the aborigines as
    true Shamanists, while the author says nearly all remain faithful to the practice
    of their old religion despite registration as Orthodox Catholics or Buddhists.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: In psychological terminology, the passage describes Shamanism as consisting
    of animistic and preanimistic conceptions and cautions that researchers often
    misuse the word soul.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author presents an open question whether Shamanism is peculiar to the
    region or part of a general primitive magico-religion, and whether it forms a
    special sect in Animistic Religion.
  category: speech
  evidence_refs:
  - ev:7
