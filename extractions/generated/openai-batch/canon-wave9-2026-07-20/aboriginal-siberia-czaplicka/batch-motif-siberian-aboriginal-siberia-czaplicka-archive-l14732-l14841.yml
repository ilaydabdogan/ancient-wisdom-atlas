- id: motif:2
  label: propitiation or hospitality toward a slain animal and its relatives
  taxonomy_refs:
  - sacred_exchange
  basis: The bear is sent home to avert wrath, the whale is hospitably received and
    equipped for return, and the wolf is fed and entertained lest its relatives take
    revenge.
  evidence_refs:
