canonical_text:
  quote: ''
  summary: The passage lists Koryak festivals, describes Jochelson's account of the
    Koryak wolf-festival, explains contrasts with bear and whale festival return procedures,
    describes a Reindeer Koryak propitiatory rite after killing a wolf, and begins
    a description of the Ainu bear-festival.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists Maritime Koryak festivals, Reindeer Koryak festivals, and
    ceremonies common to both groups, including whale, boat, mask, herd-return, fawn,
    bear, wolf, and fox-hunting-related ceremonies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After killing a wolf, the Maritime Koryak remove its skin together with the
    head, as they do with the bear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Maritime Koryak wolf-festival, a pointed stick and an arrow are set
    near the hearth or the arrow is driven into the ground at the stick's butt end.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: One man puts on the wolf-skin and walks around the hearth while another family
    member beats the drum.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The reported Koryak explanation for the wolf-festival is only that their forefathers
    did it this way; the author says the meaning is obscure.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author reports no direct indications of Koryak totemism, but compares
    the wearing of wolf and bear skins in these festivals to totemistic festivals
    where clan or family members represent a totem by putting on its skin.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The wolf-festival is said to differ from the bear-festival because the wolf-festival
    lacks equipment for a home journey.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The bear is sent home ceremonially to secure future bear-hunting and to protect
    people from the wrath of the slain animal and its relatives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The whale-festival is described as based on the idea that the killed whale
    has visited the village and will return to the sea to repeat its visit the next
    year; it is equipped with travelling bags filled with puddings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The wolf is described as dangerous in an invisible anthropomorphic form and,
    in Koryak conception, as a rich reindeer-owner and powerful master of the tundra.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Reindeer Koryak regard the wolf as a powerful shaman and an evil spirit.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: After killing a wolf, the Reindeer Koryak slaughter a reindeer, cut off its
    head, and place the reindeer's body with the killed wolf on a raised platform.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The reindeer head is placed facing eastward and is described as a sacrifice
    to The-One-on-High, asking that the wolf not be permitted to attack the herd.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Special food is prepared in the evening and the wolf is fed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The night is spent without sleep, with drum-beating and dancing to entertain
    the wolf so that its relatives do not come to take revenge.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Participants address the wolf with a blessing and address The-One-on-High
    with a request not to make the wolf bad.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: The Ainu bear-festival description begins with the catching of a bear-cub
    toward the end of winter; the cub is brought into the village, reared and fed
    by a woman, and kept in a wooden cage until it grows strong enough to break out.
  category: sequence
  evidence_refs:
  - ev:9
