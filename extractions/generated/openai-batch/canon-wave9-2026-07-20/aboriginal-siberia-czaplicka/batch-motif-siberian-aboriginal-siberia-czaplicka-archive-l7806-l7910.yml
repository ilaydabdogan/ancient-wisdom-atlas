canonical_text:
  quote: ''
  summary: 'The passage describes death customs and afterlife beliefs attributed to
    Gilyak-related material, the Ainu, and the Eskimo: treatment of bodies, food offerings
    to the dead, soul journeys to underworld or sky realms, transformation and rebirth
    of souls, ancestor offerings, isolation of the dying, and a sea-floor realm of
    the departed.'
  language: English
  quote_policy: summarized
