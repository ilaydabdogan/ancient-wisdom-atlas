canonical_text:
  quote: ''
  summary: The passage describes Buryat beliefs about deceased shamans becoming local
    protective spirits, ritual fetishes called onyons, animal beings in myth and ritual,
    an eclipse monster that swallows the sun or moon, and a tripartite human soul
    whose parts are associated with death, sleep, judgement, earthbound spirit existence,
    and rebirth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The souls of the greatest shamans are said to become protectors of people
    after death.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each ulus and clan is said to have its own zayans, identified as souls of
    deceased shamans and shamanesses.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bodies of deceased shamans and shamanesses are burned or placed in coffins
    set on trees in a nearby forest or on a mountain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The local spirits called “old people of the mountain” receive tailgans, kiriks,
    and lesser propitiatory offerings, but are not worshipped outside their locality.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Onyons are divided into black and white classes and represent different spirits.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Onyons are usually made of skins and generally have human faces.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: One kind of onyon, called nadani ongon, is used for evening amusement.
  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: A shaman calls on spirits represented by nadani ongons to amuse young people
    at an evening party.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: When the invoked spirit arrives, the shaman pretends to be its onyon and makes
    jokes at the expense of those present.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: People present are expected to appear amused, because these onyons must be
    welcomed with merriment and are annoyed otherwise.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:11
  text: Animals appear largely in Buryat mythology, but are said not to become deities.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:12
  text: Some animals, including the horse, eagle, hedgehog, swan, fox, and field worms,
    are said to have a future life.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:13
  text: The snake is frequently represented in ritual and mythology.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:14
  text: The bear is described as absent from Buryat myths and ritual, despite its
    importance in beliefs and ceremonies of other shamanists.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:15
  text: The sun and moon are described as principal tutelary spirits and in most tales
    are represented as male beings who take women as wives.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:16
  text: An eclipse is explained as the sun or moon being swallowed by an alkha, a
    head-only monster without trunk or limbs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:17
  text: During an eclipse, the sun or moon cries for rescue, and people shout and
    make noise to frighten the monster.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:18
  text: A human being is described as composed of a material body, a lower soul or
    breath called amin, and a human-only soul called sunyesun.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:19
  text: Amin is connected with death; death occurs when it leaves the body.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:20
  text: Sunyesun is connected with sleep and leaves the body during sleep.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:21
  text: At the time of death, erlils capture one soul and bring it before Erlik-Nomon-Khan
    for judgement.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:22
  text: After one soul is captured, a person may continue living for up to nine years,
    but without former health and strength.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:23
  text: A second part of the soul remains on earth and becomes a bokholdoy, living
    in an earthly dwelling in a manner similar to the person’s former life.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:24
  text: A third part of the soul is said to be born again in human form, though the
    cited account does not describe when or how.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:25
  text: Some bokholdoys are souls of deceased shamans, receive sacrifices, and form
    the class of zayans described earlier.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:26
  text: The power of bokholdoys varies according to the quality of the shamans in
    life and is linked to the deceased shaman’s utkhu.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:27
  text: Less important bokholdoys receive no propitiatory offerings beyond occasional
    libation, which anyone may perform.
  category: action
  evidence_refs:
  - ev:8
