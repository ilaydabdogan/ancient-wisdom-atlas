  taxonomy_refs: []
  basis: Bodies of deceased shamans and shamanesses are burned or put in coffins placed
    on trees or a mountain, associated with the title old people of the mountain.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage reports disposal and naming practices but does not explicitly
