- id: motif:5
  label: eclipse as celestial body swallowed by monster
  taxonomy_refs: []
  basis: A Balagansk shaman explains eclipses as the sun or moon being swallowed by
    a head-only monster, with people making noise to frighten it away.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives a brief explanatory account but no extended myth cycle.
- id: motif:6
  label: tripartite soul with death, sleep, judgement, earthbound continuance, and
    rebirth
  taxonomy_refs:
  - afterlife_journey_map
  - divine_judgment
  - death_rebirth
  basis: The passage divides the person into three parts, associates soul departure
    with death and sleep, describes soul capture and judgement before Erlik-Nomon-Khan,
    and states that another soul part becomes earthbound while a third is born again
    in human form.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: 'The taxonomy links are approximate: the passage gives a sequence of postmortem
    fates but not a detailed afterlife map, and it does not explain the mechanics
    of reincarnation.'
- id: motif:7
  label: soul capture before death-judge with lingering bodily life
  taxonomy_refs:
  - divine_judgment
  basis: Erlils capture one soul and bring it before Erlik-Nomon-Khan; after capture,
    a person may live for up to nine years without former strength.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage attributes this account to Batoroff and does not specify the
    full judicial outcome.
- id: motif:8
  label: posthumous spirit power determined by shamanic power or descent
  taxonomy_refs: []
  basis: The power of bokholdoys is said to depend on the quality of the shaman in
    life and on the shaman’s utkhu, glossed as descent or shamanistic power.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The precise meaning of utkhu is discussed by the author and remains partly
    interpretive within the passage.
comparison_claims:
- id: claim:1
  claim: The passage explicitly contrasts Buryat myth and ritual with other shamanists
    by saying the bear is important in other shamanists’ beliefs and ceremonies but
    absent from Buryat myths and ritual.
  claim_level: same_function
  target: bear in beliefs and ceremonies of other shamanists
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not identify the other shamanist groups or describe
    their bear rites, so the comparison remains general.
- id: claim:2
  claim: The passage compares the Buryat term utkhu, understood as supernatural shamanistic
    power, with the Yakut amagyat.
  claim_level: linguistic_similarity
  target: Yakut amagyat
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim follows the author’s wording in the passage; no independent
    linguistic or ethnographic evidence is supplied here.
