    see the sick-person custom except in the delivery case and expresses doubt about
    related death-house claims.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: A woman wishing to have a child carries amulets around her neck, such as a
    dog's tooth, and Schrenck reports many customs intended to assure happy delivery.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Among the Buryat of Alarsk, women of the family gather during delivery, take
    the child, drop it horizontally onto a softened floor, then wash and wrap it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Two or three days after the Buryat birth, a feast is held for villagers who
