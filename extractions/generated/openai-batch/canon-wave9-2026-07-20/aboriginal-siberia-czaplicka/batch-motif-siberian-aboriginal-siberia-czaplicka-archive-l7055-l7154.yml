canonical_text:
  quote: ''
  summary: The passage surveys reported birth-related customs among Siberian groups,
    including postpartum restrictions, newborn seclusion, afterbirth disposal, Gilyak
    birth outside the home with ritual aids and restricted access, fertility amulets,
    and Buryat delivery, feast, and wrapping practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman is described as unclean for one month after confinement and subject
    to restrictions on removing shoes and on food for a year.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The food taboos listed mainly restrict sea animals and fresh fish, while reindeer
    meat is allowed in any form.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A newborn child must not be taken out of the house during the winter; if necessary,
    the mother carries the child under her coat and does not expose it in a strange
    house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The afterbirth is placed in a bag and hung on a pole some distance from the
    village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Gilyak woman is said not to give birth at home but to go out of the hut;
    in late autumn or winter a special, uncomfortable hut is built for her.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: To help a woman in labour, people carve a wooden figure in the act of delivery
    and sacrifice foods to it to placate evil influences.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Access to the confinement hut is limited to the midwife or other women helping
    the mother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Special knives are used to cut the umbilical cord; the child is named at once
    or soon after birth without ceremonies, and no shaman is present at birth or naming.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Only wealthy Gilyak people hold a feast for the birth occasion, and the woman
    returns to the house on the eighth or twelfth day; Schrenck observed no purificatory
    ceremonies.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Dr. Seeland says the custom of driving a woman out of the house before delivery
