    Beings live in twenty-two compass directions, with a chief zenith middle-crown;
    Dawn and Twilight are wife-companions, and Darkness receives special sacrifices.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: public_domain
- id: ev:2
  type: summary
  locator: lines 12880-12896
  quote_or_summary: Sun, moon, stars, and constellations are classed as beings; the
    Sun is a man in a bright garment who descends to his wife; the Moon is a male
    lower-world kele’s son with a lasso and is invoked by shamans; the pole-star is
    principal among stars.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: public_domain
- id: ev:3
  type: summary
  locator: lines 12897-12921
  quote_or_summary: Several named beneficent beings are listed as loose personifications
    of the creative principle, compared by Bogoras to Vakanda or Great Manitou; most
    are mentioned in sacrifices to Dawn, Zenith, and Midday; the Luck-giving Being
    may be raven-like, and Big-Raven tales are noted.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: public_domain
- id: ev:4
  type: summary
  locator: lines 12922-12943
  quote_or_summary: Reindeer Chukchee have a Reindeer-Being watching herds; Maritime
    Chukchee have Sea Beings including Keretkun and his wife in a sea-bottom or floating
    house; Mother of the Walrus and another harmful walrus-like spirit are described;
    Keretkun receives autumn sacrifices; Asiatic Eskimo sea-deities are said to be
    similar.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: public_domain
- id: ev:5
  type: summary
  locator: lines 12944-12953
  quote_or_summary: Winds are classified as Beings and named in incantations; House-Beings
    are attached to houses, vanish if the house is destroyed, become dangerous earth-spirits
    if abandoned, and receive a small share of sacrifices in sleeping-room corners.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: public_domain
- id: ev:6
  type: summary
  locator: lines 12954-12958
  quote_or_summary: Spirits of intoxicating mushrooms form a Separate Tribe; some
    Beings and even kelet have assistants that receive shares of sacrifices and are
    often represented as a raven or half-raven.
