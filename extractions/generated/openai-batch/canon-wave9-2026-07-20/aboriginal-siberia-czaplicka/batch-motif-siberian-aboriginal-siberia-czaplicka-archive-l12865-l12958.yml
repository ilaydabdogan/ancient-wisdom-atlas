candidate_motifs:
- id: motif:1
  label: Sacrifice shares given to supernatural beings and assistants
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The passage repeatedly describes sacrifices to benevolent Beings, special
    sacrifices to Darkness, Keretkun’s autumn sacrifices, House-Beings receiving portions,
    and assistants receiving shares.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage describes ritual recipients and portions but does not narrate
    a mythic exchange outcome.
- id: motif:2
  label: Cosmos organized by directions with a chief zenith figure
  taxonomy_refs:
  - world_center
  basis: Sacrificed-to Beings live in twenty-two compass directions, and the chief
    resides in the zenith as the middle-crown, associated with Mid-day, the Sun, and
    the Polar Star.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy link to world center is inferential; the passage gives a
    directional cosmological arrangement but does not explicitly call it a world center.
- id: motif:3
  label: Celestial bodies personified as human-like beings
  taxonomy_refs: []
  basis: The Sun is represented as a man in a bright garment, the Moon as a man with
    a lasso, and the pole-star as the principal being among stars.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No supplied taxonomy family directly names celestial personification.
- id: motif:4
  label: Divine or supernatural spouse relationship
  taxonomy_refs:
  - sacred_marriage
  basis: Dawn and Twilight are described as wife-companions married to one wife in
    tales, the Sun descends nightly to his wife, and Keretkun is paired with his wife.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: medium
  cautions: The passage reports spouse relations but does not present a full marriage
    myth or ritual union narrative.
- id: motif:5
  label: Animal-form spirit representation and helper
  taxonomy_refs: []
  basis: The Luck-giving Being is sometimes represented as a raven, and assistants
    of Beings or kelet are often represented as a raven or half a raven.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage does not provide a specific tale about the raven-form figures
