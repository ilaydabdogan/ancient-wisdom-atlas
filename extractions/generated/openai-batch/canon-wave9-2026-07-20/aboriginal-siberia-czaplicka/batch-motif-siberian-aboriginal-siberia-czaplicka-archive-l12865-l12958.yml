comparison_claims:
- id: claim:1
  claim: The passage reports Bogoras’s view that several Chukchee beneficent beings
    are loose personifications of the creative principle and are similar to Vakanda
    or Great Manitou of the Indians.
  claim_level: same_function
  target: Vakanda or Great Manitou of the Indians
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a cited ethnographer’s analogy within the passage, not independent
    evidence of historical contact or common origin.
- id: claim:2
  claim: The passage states that Asiatic Eskimo have sea-deities similar to those
    of the Maritime Chukchee.
  claim_level: same_function
  target: Asiatic Eskimo sea-deities
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only a brief similarity statement and does not specify
    individual Eskimo deities or detailed shared features.
