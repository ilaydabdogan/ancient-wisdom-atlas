canonical_text:
  quote: ''
  summary: The passage summarizes Chukchee classifications of benevolent supernatural
    beings, celestial beings, winds, sea beings, reindeer and house spirits, mushroom
    spirits, and spirit assistants. It describes their names, locations, forms, ritual
    sacrifices, and a few comparative remarks supplied by the cited ethnographer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Chukchee call benevolent supernatural beings vairgît, translated as “beings,”
    and distinguish beings to whom sacrifices are brought.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sacrificed-to beings are said to live in twenty-two different directions
    of the Chukchee compass.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chief sacrificed-to being resides in the zenith and is called “being-a-crown”
    or “middle-crown.”
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mid-day, the Sun, and the Polar Star are often identified with the “middle-crown.”
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Dawn and Twilight are described as “wife-companions,” and tales describe
    them as married to one wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: The evening directions are collectively called “Darkness,” and receive sacrifices
    only on special occasions, sometimes mingled with offerings to earth kelet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:7
  text: The sun, moon, stars, and constellations are also known as vairgît.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: The sun is represented as a man in a bright garment driving dogs or reindeer
    and descending each evening to his wife, the Walking-around-Woman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The moon is represented as a man, as the son of a kele of the lower worlds,
    and as carrying a lasso with which he catches people who stare at him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:10
  text: Shamans invoke the moon in incantations and spells.
  category: action
  evidence_refs:
  - ev:2
- id: obs:11
  text: The pole-star is named “the pole-stuck star” and is described as the principal
    vairgin among the stars.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:12
  text: Several beneficent beings are named as personifications related to creation,
    upperness, world, mercy, life-giving, and luck-giving.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:13
  text: The named beneficent beings, except the Creator, are mentioned at sacrifices
    to Dawn, Zenith, and Midday, but do not receive special sacrifices of their own.
  category: action
  evidence_refs:
  - ev:3
- id: obs:14
  text: The Luck-giving Being is sometimes represented as a raven; the Creator is
    not represented as a raven by the Chukchee, though Chukchee tales include Big-Raven
    called Tenan-tomgin.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:15
  text: The Reindeer Chukchee have a Reindeer-Being who watches over the herds.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:16
  text: The Maritime Chukchee have Beings of the Sea, including Keretkun and his wife,
    who live on the sea-bottom or in the open sea in a large floating house.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:17
  text: Keretkun and his wife are described as larger than humans, black-faced, wearing
    special head-bands, and clothed in long white walrus-gut garments with tassels.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:18
  text: The Mother of the Walrus lives at the bottom of the sea and is armed with
    two tusks like a walrus.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:19
  text: Another walrus-like sea-spirit is believed to harm people by crawling into
    their houses at night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:20
  text: Walrus-beings do not receive regular sacrifices and may assist the shaman
    as kelet, while Keretkun receives sacrifices at autumn ceremonials.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:21
  text: The Chukchee classify winds as Beings, mention their names in incantations,
    and treat the locally prevailing wind as the chief wind-being in a given locality.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:22
  text: House-Beings are spirits of tents and houses, attached to houses rather than
    people; they cease to exist when a house is destroyed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:23
  text: If a house is abandoned, its house-spirits turn into dangerous earth-spirits.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:24
  text: A small share of every important sacrifice is placed for House-Beings on the
    ground in the sleeping-room corners.
  category: action
  evidence_refs:
  - ev:5
- id: obs:25
  text: Spirits of intoxicating mushrooms are said to form a Separate Tribe.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:26
  text: Some Beings and even kelet have assistants, which receive a share of sacrifices
    and are often represented as a raven or half a raven.
  category: relationship
  evidence_refs:
  - ev:6
