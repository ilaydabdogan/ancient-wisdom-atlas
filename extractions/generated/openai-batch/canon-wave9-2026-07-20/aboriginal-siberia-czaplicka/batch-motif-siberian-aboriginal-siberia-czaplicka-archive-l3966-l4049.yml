canonical_text:
  quote: ''
  summary: 'The passage describes Chukchee marriage-related customs and tales: condemned
    child-marriage arrangements elsewhere, tale-patterns in which a bride is hidden
    or won through contests, bride-service through intermediaries or direct labor,
    hardship and trial periods for suitors, reindeer gifts or opportunities, adoption
    as a resident son-in-law, and accounts of bride abduction by men, spirits, or
    animal beings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports Bogoras's comparison of full-grown girl and young boy
    marriages elsewhere and states that the Chukchee consider the father-in-law's
    sexual role in such arrangements improper.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some tales describe a bride kept in a large iron box or hidden by her parents,
    with the suitor required to free her or find her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some tales describe the bride herself as the opponent, including a strong
    and proud girl who makes suitors run foot-races and marries the one who surpasses
    her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The procedure called asking for a wife may be conducted through a friend or
    relative who begins service by bringing bundles of fuel from the woods and trying
    to please the family.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bride's father may show anger or displeasure during the preliminary asking,
    and his consent may end courtship or only grant the suitor the right to court
    the girl personally.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Direct bride-service involves fuel-gathering, a trial lasting from one to
    three years, possible refusal of food and shelter, and the risk of dismissal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After several months the suitor may sleep in the inner room and cohabit with
    the future bride; a skilled herdsman may have his departure postponed by the father.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A son-in-law who leaves without quarrelling may receive reindeer, with the
    number depending on the quality of his service work.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A wealthy Chukchee may give a son-in-law freedom for one day to catch as many
    reindeer as he can, while direct bride purchase is described as improper by Chukchee
    standards.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A resident adopted son-in-law, called a continuous dweller, may have the wife
    withheld for years and can still be dismissed until his work has become established
    in the common herd.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Some tales describe Chukchee girls being ravished by men of other tribes,
    spirits, an eagle, a whale, a raven, and similar agents.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage reports an older practice in which young men seized a girl in
    the open, bound her hands and feet, and carried her to the house of the man who
    wanted her as wife.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After an abduction, the girl's parents sometimes received another woman from
    the abducting family in exchange; marriages by flight could occur when parental
    consent was refused.
  category: sequence
  evidence_refs:
  - ev:8
