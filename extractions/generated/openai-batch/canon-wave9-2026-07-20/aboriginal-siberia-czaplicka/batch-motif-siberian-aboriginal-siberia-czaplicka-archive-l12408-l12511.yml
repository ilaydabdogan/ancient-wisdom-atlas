canonical_text:
  quote: ''
  summary: The passage lists feminine-coded dress and conduct associated with a shaman,
    including breast-symbols on the coat, a woman-like hairstyle, avoidance of a horse-skin
    side also avoided by women, use of a girl's foal-hide jacket, and admission with
    women to a childbirth room where Aiasyt is present. It then discusses Troshchanski's
    theory that male black shamans replaced female black shamans through the mediating
    role of smiths, contrasts this with a proposed evolution of white shamans from
    family ceremonial officiants, and critiques the dual-evolution theory. The passage
    also summarizes interpretations of shamanic 'change of sex' as a 'change of dress'
    and compares the phenomenon with examples of men dressing and acting as women
    among other peoples, including Khasi and Pelew priests, before noting its occurrence
    among Palaeo-Siberian groups.
  language: English
  quote_policy: summarized
