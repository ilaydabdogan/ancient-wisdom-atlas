literal_observations:
- id: obs:1
  text: Polygyny is reported among the Ainu, with a man's wives living in separate
    houses and not speaking to one another.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Polyandry is described as unknown among the Ainu, except for occasional cases
    in districts bordering Gilyak territory.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ainu divorces are described as frequent and settled by the eldest of the clan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Ainu divorce, children may be divided between the parties or all given
    to the party considered innocent.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Reported Ainu grounds for divorce include lack of love, incompatibility, disrespect,
    idleness, failure to provide household supplies, unfaithfulness, and lack of male
    issue.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: When an Ainu man divorced his wife, he made a present and sent her back to
    her parents; a woman could leave her husband by walking off.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Unfaithfulness among the Ainu is said to be usually punished by beating.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Ainu are described by cited authorities as having strong traces of mother-right
    and being in transition from mother-right to father-right.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ainu women are said to have a superior position compared with neighbouring
    tribes, especially during pregnancy, when they receive care and veneration.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ainu marriage is described as never by purchase, and the first years after
    marriage are usually spent with the wife's parents.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Among the Ainu, relationship through the mother is described as more important
    than relationship through the father, and the maternal uncle is often the most
    important family member.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Among the Tungus proper, sexual intercourse with wives may begin before official
    marriage once part of the bride-price has been paid to the bride's father.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Tungus of the Yeniseisk Government are described as practising polygamy,
    and a girl is said to be free to choose her husband and to elope if her father
    disapproves.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Among Tungus groups of Nerchinsk and Verkhneudinsk, one family may give a
    son in exchange for a daughter from another family, while the bride's father still
    receives a small bride-price.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Tungus dowry goods are listed as a new suit for the husband, a tent cover,
    reindeer, household utensils, and, among the Trans-Baikal Tungus, a complete house.
  category: object
  evidence_refs:
  - ev:10
- id: obs:16
  text: The Tungus bride-price usually consists of reindeer, and if a bridegroom dies
    after paying the whole bride-price but before taking the bride home, his rights
    in the woman pass to a brother or near relative under age conditions.
  category: sequence
  evidence_refs:
  - ev:11
