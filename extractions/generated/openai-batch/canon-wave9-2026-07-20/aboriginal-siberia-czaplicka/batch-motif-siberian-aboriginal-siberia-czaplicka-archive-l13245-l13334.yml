comparison_claims:
- id: claim:1
  claim: The passage itself compares the Koryak owners or masters with functionally
    similar concepts among the Eskimo, Yukaghir, Yakut, and Buryat, while stating
    that the Koryak formulation is less clearly differentiated.
  claim_level: same_function
  target: Eskimo inna, Yukaghir pogil, Yakut icci, and Buryat ecen or isin as nearby
    spirit-owner concepts
  evidence_refs:
  - ev:3
  counter_evidence_refs:
  - ev:3
  confidence: medium
  limitations: The comparison is mediated through Jochelson's report in the passage,
    and the same evidence notes vague Koryak replies and weaker differentiation of
    the concept.
