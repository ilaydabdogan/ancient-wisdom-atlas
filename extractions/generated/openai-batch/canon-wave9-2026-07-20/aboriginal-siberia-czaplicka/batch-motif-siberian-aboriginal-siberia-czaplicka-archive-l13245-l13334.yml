candidate_motifs:
- id: motif:1
  label: culture hero teaches subsistence, fire, and protection
  taxonomy_refs:
  - culture_hero
  basis: Big-Raven is explicitly said to be the first to teach catching sea and land
    animals, use of the fire-drill, and protection against evil spirits.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage reports the tradition in summary rather than narrating a full
    tale.
- id: motif:2
  label: mythic figure leaves petrified or landscape traces
  taxonomy_refs: []
  basis: Variant accounts say Big-Raven and his family turned into stones, and the
    Koryak identify stones, footprints, and hoof-marks as traces of his former presence.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage gives competing disappearance accounts and does not expand
    the petrification episode.
- id: motif:3
  label: resident owner or master of natural object
  taxonomy_refs: []
  basis: The passage describes owners or masters residing in objects and discusses
    the master or owner of the sea as well as possible resident spirits in hills,
    capes, and cliffs.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage itself emphasizes uncertainty and vagueness in Koryak responses
    about the nature of these owners.
- id: motif:4
  label: sacrifice or offering to personified natural and celestial powers
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: A reindeer is offered to the sea or its owner, offerings are made to the
    sun, and a reindeer is sacrificed to The-Master-on-High during consecration of
    the fire-board.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:9
  confidence: high
  cautions: The specific reciprocal expectation of the offerings is clearest in the
    fire-board consecration and less detailed for the sea and sun offerings.
- id: motif:5
  label: celestial society and intermarriage with culture-hero family
  taxonomy_refs:
  - sacred_marriage
  basis: The sky is treated as an inhabited land; Sun-Man has a wife and children;
    and marriages are contracted between Sun-Man's children and Big-Raven's children.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage only summarizes the marriages and cites tales without narrating
    them.
- id: motif:6
  label: consecrated protective fire-making object
  taxonomy_refs:
  - sacrifice
  basis: The fire-board is shaped like a human being and consecrated as protector
