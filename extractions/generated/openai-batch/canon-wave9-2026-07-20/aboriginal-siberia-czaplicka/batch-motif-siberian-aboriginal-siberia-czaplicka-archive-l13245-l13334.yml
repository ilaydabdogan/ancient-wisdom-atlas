canonical_text:
  quote: ''
  summary: The passage describes Koryak traditions about Big-Raven as an early teacher
    of hunting, fire-drilling, and protection from spirits; accounts of his disappearance
    and local traces; Koryak ideas of resident owners or masters of natural objects;
    personified sea, landscape, and celestial beings; protective guardians and charms;
    and the consecration and ritual use of fire-making implements, especially the
    fire-board.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Big-Raven is said to have first taught people to catch sea and land animals,
    use the fire-drill, and protect themselves against evil spirits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Big-Raven lived on earth in the manner of the Maritime Chukchee, while some
    of his sons were reindeer-breeders.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some accounts say Big-Raven and his family turned into stones; other accounts
    say he wandered away from the Koryak.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Koryak point out large stones on a sea-cliff as Big-Raven's house and
    utensils, and point to footprints and reindeer hoof-marks as traces of him.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Koryak are said to believe in supernatural beings called owners or masters
    of certain objects in which they reside.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Jochelson considered the Koryak idea of owners less clear and less differentiated
    than comparable concepts among several other peoples mentioned in the passage.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Reindeer Koryak offered a reindeer as a sacrifice to the sea and treated
    the sea and owner of the sea as equivalent in his answer to Jochelson.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some Koryak say the owner of the sea is a woman, while others consider the
    sea itself to be a woman.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Certain hills, capes, and cliffs are called apapel and are described as protectors
    of hunters and travellers, though the passage says it is doubtful whether the
    term applies to the place or to a resident spirit.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The sky is considered a land inhabited by stellar people, and the sun, moon,
    and stars are treated as animated beings.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sacrificial offerings are made to the sun, and Sun-Man is described as having
    a wife, children, and his own country inhabited by Sun people.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says marriages are contracted between Sun-Man's children and Big-Raven's
    children, and it mentions a Moon-Man or woman and a Star-Man.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Koryak guardians and charms protect individuals, families, or villages, while
    The-Master-on-High, Big-Raven, and malevolent kalau are described as tribal deities
    or spirits, except for some kalau that serve individual shamans.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: 'Guardians are objects that avert evil, and the described examples include
    sacred fire-making implements: a fire-board, bow, wooden drill, and stone or bone
    headpiece.'
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: The fire-board is made of dry aspen wood, has holes to receive the drill,
    and is shaped roughly like a human being.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: Consecrating a new fire-board as protector of the hearth and herd involves
    a reindeer sacrifice to The-Master-on-High, anointing the board with sacrificial
    blood and fat, and pronouncing an incantation over it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Jochelson interpreted the incantation as directing a vaguely conceived vital
    principle in an inanimate object toward beneficial activity.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: During fire-making, the headpiece is placed on the drill, separate persons
    hold or turn parts of the apparatus, and the charcoal dust produced by drilling
    is collected in a small leather bag because scattering it is considered sinful.
  category: action
  evidence_refs:
  - ev:10
