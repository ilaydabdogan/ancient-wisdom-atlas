canonical_text:
  quote: ''
  summary: 'The passage surveys death, burial, future-life, and ancestor-related customs
    among several Palaeo-Siberian groups: Kamchadal exposure of corpses to dogs and
    avoidance of death pollution; Yukaghir platform burial and preservation of remains
    as amulets; Kerek ocean burial; and Chukchee protective funerary rites directed
    against dangerous influences of the dead.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Kamchadal, leather thongs were bound around the throat of a corpse,
    and the body was dragged out of the yurta and left near the door to be eaten by
    dogs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kamchadal explanation given is that a person whose corpse was eaten by
    dogs would have power to drive those animals in the future life.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Kamchadal, the house in which a person died was deserted, the inhabitants
    moved to another dwelling, the dead person's clothes were thrown away, and purification
    ceremonies were used for things contacted by the dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kamchadal children were buried in hollow tree-trunks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Among the Yukaghir, the dead were formerly placed on platforms raised on poles.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Yukaghir of the Kolyma district distributed flesh and bones among relatives;
    the portions were dried, placed in leather bags, called 'Grandfathers', and used
    as amulets in sympathetic magic.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Among the Kerek, corpses dressed in funeral attire were tied to long poles,
    towed out to sea, and pushed into the ocean with poles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Chukchee funeral rites are described as protective magical ceremonies
    against the evil influences of the dead, though some dead are said to be benevolent.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Chukchee 'double dead' or 'completely dead' are described as beyond rebirth,
    becoming evil spirits in the other world, living on the border of the country
    of deceased people, and walking along the water's edge with the kelet.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: After death among the Chukchee, the body was stripped, laid between two leather
    skins in the sleeping-chamber, and the genitals and face were covered.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Among the Chukchee, one man by day and two by night watched the corpse in
    case the dead should come to life; a ritual specialist called a 'fortifier' performed
    ceremonies to protect the house and people.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Chukchee 'followers' washed and dressed the body with special ceremonies,
    kept the corpse's head toward the exit, and prepared the dress for the dead ceremonially.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: For three days after a Chukchee death, no drum was beaten and noisy domestic
    work by women ceased.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: Among the Chukchee, the body was usually burned or exposed in a lonely place;
    during the ceremonies the corpse was questioned about burial and goods, and the
    body was commonly removed through a roof-hole or the back of the tent with traces
    erased to prevent return.
  category: sequence
  evidence_refs:
  - ev:14
