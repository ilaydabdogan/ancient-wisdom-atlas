canonical_text:
  quote: ''
  summary: 'A Yakut shamanic performance is described: the fire is extinguished with
    white horsehair, the shaman sits in darkness with drum and mare skin oriented
    southward, and a long sequence of drum sounds, bells, animal cries, and silence
    precedes a chant. The chant invokes bull and horse images, a powerful master,
    permitted followers, a left-side lady with a staff, a mother who corrects the
    path, southern sun beings, an eastern mountain grandsire, and fire as a grey-bearded
    wizard. After this formula the shaman addresses protective spirits, converses
    with the Jcaliani/ as printed, and may be overcome when spirits arrive; falling
    face-down is said to be a good sign and falling backward a bad sign.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: White horsehair is thrown on the fire and puts it out; the shaman remains
    visible briefly in the coals, motionless, with drum on his breast, seated on a
    mare's skin, and facing south.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Complete darkness follows; the audience is nearly silent while the shaman's
    muttering and hiccoughing diminish into silence.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The silence is broken by a great yawn and by sounds described as a falcon's
    cry or a seamew's weeping.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The drum begins softly and then grows stronger, with the music compared to
    a storm and thunder and accompanied by named bird and animal cries.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The drum and bells reach a crescendo, stop abruptly, and the sequence may
    be repeated several times according to the shaman's inspiration.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The shaman chants fragments naming a bull of the earth and a horse of the
    steppes, and he identifies himself as a bull, a horse, a gifted man, and one created
    by an all-powerful master.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The shaman calls on the horse of the steppes to appear and teach him, and
    on the enchanted bull of the earth to appear and speak to him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The shaman calls on a powerful master to command him and addresses those who
    will go with him, warning uncommanded ones not to follow and others to keep the
    proper distance and pay heed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The shaman asks a left-side lady with a staff and his mother to correct him,
    show his errors and path, and pave his wide roadway.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chant addresses souls and mothers of the sun living in the south, in nine
    wooded hills, and refers to three shadows standing high.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The shaman invokes an eastern mountain lord and grandsire and then invokes
    a grey-bearded wizard identified parenthetically as fire.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: After the adjurations, the drum, shouts, and meaningless words recur before
    silence; the passage says similar adjurations are used in all Yakut districts
    and begin all ceremonies.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: In later prayers, the shaman addresses his umagyat and other protective spirits,
    speaks with the Jcaliani/ as printed, asks them questions, and gives answers in
    their names.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The arrival of spirits can require long prayer and drumming, but sometimes
    is sudden and impetuous enough to make the shaman fall down.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: A fall on the shaman's face is described as a good sign, while a fall on his
    back is described as a bad sign.
  category: attribute
  evidence_refs:
  - ev:14
