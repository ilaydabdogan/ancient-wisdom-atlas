canonical_text:
  quote: ''
  summary: 'The passage describes Yakut shamanic protector beings and powers: animal-protectors
    called yekyua, a spirit-protector or power called cimayyat/amayyat, mischievous
    halkiny spirits active during performances, and forms of shamanic education and
    initiation involving the novice''s sür, supernatural tutors, and an older shaman.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Animal incarnations of shamans are ranked by weakness or power; dogs are described
    as weak and troubling, while large bulls, stallions, elks, and black bears are
    described as powerful.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dog animal-protector is said to gnaw the shaman's heart and tear the shaman's
    body, after which the shaman feels sick and suffers pain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Other shamans recognize a new shaman by the presence of a new yekyua, and
    ordinary people cannot see yekyua.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The yekyua is glossed as a mother-animal, and shamans are said to incarnate
    their kut in animals such as stallions, wolves, and dogs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: If one of the animal incarnations kills another animal of its species, the
    corresponding shaman is said to die.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Cimayyat/amayyat is described as a protector that may be the spirit of a deceased
    shaman or a secondary heavenly being; it remains near the shaman, helps, defends,
    and advises.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tiuspiut says that a shaman sees and hears only through his cimayyat.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Tiuspiut reports that he set fire to a heap of wood in the mountains and that
    the amayyat of a buried Tungus shaman leapt into him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Great shamans who take their amayyat to heaven at death are said to become
    heavenly beings; if the amayyat is not taken to heaven, it later appears on earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: During shamanistic performances, halkiny spirits force the shaman to talk
    and imitate various gestures.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The sür of a white shaman is educated under one class of being, while the
    sür of a black shaman studies with an ahassy on underground levels; the level
    of education determines the shaman's power.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A Yakut shaman is taught by an older shaman, who consecrates him by placing
    the amugijat on him; this sign can be removed from someone who no longer wants
    to be a shaman.
  category: action
  evidence_refs:
  - ev:8
