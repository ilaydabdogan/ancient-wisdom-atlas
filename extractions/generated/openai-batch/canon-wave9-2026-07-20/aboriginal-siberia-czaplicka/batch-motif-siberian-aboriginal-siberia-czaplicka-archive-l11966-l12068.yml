canonical_text:
  quote: ''
  summary: 'A Yakut shamanic healing rite is described: the shaman dances, drums,
    sings, summons spirits, identifies and expels the cause of illness, negotiates
    or determines sacrifice, and afterward retains prophecy. The rite is interpreted
    as symbolizing a dangerous journey to the sky with spirits and a sacrificed animal,
    with ritual sitting, rising, or falling corresponding to resting places, ascent,
    or descent under the earth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The shaman leaps and dances, first on a skin and then in the middle of the
    room, while wood is piled on the fire and the room fills with light, noise, and
    movement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shaman dances, sings, beats the drum, jumps, and turns his face successively
    toward the south, west, and east.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some attendants hold the shaman by leather thongs, though in the south Yakut
    district the shaman may dance unfettered and may give up the drum to dance more
    freely.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The shaman is described with bowed head, half-closed eyes, disordered hair,
    sweating face, twisted mouth, saliva, and sometimes foaming at the mouth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The shaman moves around the room, beating the drum, shaking his jingling coat,
    and appearing increasingly frenzied.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At intervals the shaman holds the drum over his head, chants a prayer, and
    summons the spirit.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The shaman learns the cause of a misfortune or disease and becomes sure of
    the aid of beings whose help he needs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The shaman approaches the patient and drives away the cause of illness either
    by frightening it or by sucking it from the painful place, then spits and blows
    it away from the middle of the room.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The shaman learns what sacrifice must be made to powerful spirits because
    of harsh treatment of the spirit's servant sent to the patient.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The shaman shades his eyes, looks into each corner of the room, and if anything
    suspicious appears, resumes drumming, dancing, terrifying gestures, and entreaty
    to the spirits.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The end of the ceremony is marked by the disappearance of a suspicious cloud,
    acceptance of sacrifice, and hearing of prayers.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the ceremony the shaman temporarily retains prophecy, answers questions,
    and tells what he saw on his journey away from the earth.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The shaman is finally carried with his mare's skin back to his place of honour.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Sometimes disease is transferred to cattle, and the stricken cattle are sacrificed
    and said to ascend to the sky.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: The dance is said to symbolize the journey to the sky together with spirits
    and the sacrificed animal.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:16
  text: Native accounts say some earlier shamans really ascended into the sky while
    spectators saw the sacrificed animal, the shaman's drum, and then the shaman floating
    on clouds.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:17
  text: The passage reports an indefinite account of wicked powerful shamans who carried
    into the sky a mare formed of cloud instead of a real animal.
  category: other
  evidence_refs:
  - ev:15
- id: obs:18
  text: During the dangerous journey, each shaman has resting places called ouokh;
    sitting during the dance means arrival at an ouokh, rising means further ascent
    into the sky, and falling means descent under the earth.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:19
  text: Each shaman is said to know his own position, the ouokh he has reached, and
    the route of every other shaman shamanizing at that moment.
  category: attribute
  evidence_refs:
  - ev:17
- id: obs:20
  text: The ouokh are said to occur in a series of nine, matching a Yakut pattern
    of arranging objects in nines.
  category: attribute
  evidence_refs:
  - ev:19
- id: obs:21
  text: A later separate ceremony may lead the spirit and sacrificed cattle into the
    sky after a previous promise of sacrifice.
  category: sequence
  evidence_refs:
  - ev:18
