candidate_motifs:
- id: motif:1
  label: shamanic ascent to the sky
  taxonomy_refs:
  - ascent
  basis: The passage says the dance symbolizes a journey to the sky with spirits and
    a sacrificed animal, and describes rising in the dance as ascending further into
    the sky.
  evidence_refs:
  - ev:13
  - ev:16
  confidence: high
  cautions: This is a ritual-shamanic ascent, not necessarily a heroic or afterlife
    ascent.
- id: motif:2
  label: sacrificial animal accompanying or enabling sky journey
  taxonomy_refs:
  - sacrifice
  basis: Disease may be transferred to cattle that are sacrificed and ascend to the
    sky; the journey includes the spirits and sacrificed animal.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:18
  confidence: high
  cautions: The passage describes ritual action and symbolic interpretation; it does
    not provide a full mythic narrative.
- id: motif:3
  label: disease transfer to animal substitute
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The passage states that disease is sometimes transferred to cattle and the
    stricken cattle are then sacrificed; a note describes an animal kut being accepted
    instead of a human kut through bargaining by the shaman.
  evidence_refs:
  - ev:12
  - ev:20
  confidence: medium
  cautions: The sacred exchange taxonomy is only cautiously applicable because the
    passage frames the action as sacrifice and bargaining rather than a general exchange
    myth.
