canonical_text:
  quote: ''
  summary: 'The passage describes Chukchee practices and social organization: substitution
    of a living captive for a murdered man, enslavement of war captives, the varat
    as a kin group associated with blood-revenge, older and Russian-imposed clan arrangements,
    family structure, respect for elders, individual migration, and patrilineal terminology.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy was reportedly taken from the family of a slayer to replace a murdered
    man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Former substitutes for dead kinsmen were said to be treated like slaves and
    required to obey masters under threat of death.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tales mention herdsmen being captured with herds in war, enslaved, and valued
    because they knew their own herds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Captive women were made to work hard, made wives of their masters, and sometimes
    sold from one camp to another.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A varat is described as a group of kindred families, a collection of those
    who are together; a member is called enan-varatken.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Another name for the group is cin-yirhi, defined as a collection of those
    who take part in blood-revenge; blood-revenge is said to remain vigorous.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Chukchee varat is described as unstable, with the number of families changing
    nearly every year and some families connected to both sides in quarrels.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A former stricter organization is described as ten to fifteen related families
    living together, dividing occupations, and remaining ready for war.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Russian administration divided Chukchee territory into five arbitrary clans
    and called a friendly rich reindeer-breeder Chief, also known by king or tsar
    titles.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The individual Chukchee family is described as a husband, one or several wives,
    and children, with his parents and unmarried siblings usually nearby.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Old people are said to receive considerable respect; among Reindeer Chukchee
    the father retains the herd during life, and among Maritime Chukchee immobile
    elders are carried by young relatives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Adult male or female family members often depart to seek a new home, with
    individual migrations between Maritime and Reindeer Chukchee described as frequent.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Chukchee relationship system is described as giving marked precedence
    to the paternal line over the maternal line, using terms connected with the old
