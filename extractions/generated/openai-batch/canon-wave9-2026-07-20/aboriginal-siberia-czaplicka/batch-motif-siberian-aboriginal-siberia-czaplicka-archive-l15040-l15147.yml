candidate_motifs:
- id: motif:1
  label: shamanic ascent through heavenly zones
  taxonomy_refs:
  - ascent
  basis: The shaman's progress is marked by climbing birch steps, attaining zones
    of heaven, reaching the full moon, and encountering figures in successive heavens.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage describes a ritual performance rather than a mythic narrative;
    the motif label is based on the described ceremonial ascent.
- id: motif:2
  label: birch tree as ritual stairway between human space and heavens
  taxonomy_refs:
  - sacred_tree_axis
  basis: A birch is placed in the yurta, circled by the shaman, fitted with steps,
    and used to mark ascent through heavenly zones.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:7
  confidence: medium
  cautions: The passage does not explicitly call the birch an axis or world center;
