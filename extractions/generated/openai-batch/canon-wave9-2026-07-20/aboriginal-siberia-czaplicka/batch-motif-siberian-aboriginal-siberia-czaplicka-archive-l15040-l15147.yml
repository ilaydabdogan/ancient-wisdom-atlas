canonical_text:
  quote: ''
  summary: A shamanic ceremony is described in which the shaman invokes a vast eagle-like
    bird, collects spirit-protectors in his tambourine, asks a porter-spirit for a
    guide, purifies a household from Erlik's influence, empowers the host with ancestral
    spirit-power, ascends by birch steps through heavenly zones, prophesies misfortunes
    and sacrifices, enacts episodic scenes, encounters celestial beings and luminaries,
    and petitions Yulgen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sung invocation describes a huge winged being whose left wing veils the
    moon and whose right wing obscures the sun; it is addressed as the mother of nine
    eagles and invited to approach the speaker's right eye and right shoulder.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shaman gives the answering cry of the bird, his tambourine sounds louder,
    and he staggers under the burden of many spirit-protectors collected in the tambourine.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The shaman walks several times around a birch placed in the yurta, kneels
    at the door, and asks the porter-spirit for a guide.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The shaman purifies the host, hostess, children, and relatives by embracing
    them so that the tambourine touches each breast and the drum-stick touches each
    back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before the embrace, the shaman scrapes what is unclean from the host's back
    with the drum-stick; the passage states that the back is the seat of the soul.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The household is said to be liberated from the malign influence of Erlik.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The shaman drives potential misfortunes out of doors and beats his tambourine
    near the host's ear to drive into him the spirit and power of his ancestors so
    that he may understand prophecies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The shaman pantomimically invests family members with breastplates and hats,
    falls into ecstasy, mounts the first birch step, runs around the fire and birch,
    and imitates thunder.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The ascent is expressed by mounting birch steps and by statements that one
    step and one heavenly zone have been attained, culminating in a reference to the
    full moon.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The kam passes from one heavenly zone to another with Bash-tutlcan; a goose
    later takes the place of a wearied being and gives temporary relief to Bash-tutlcan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the third zone the shaman halts, prophesies impending misfortunes, and
    declares what sacrifices are to be offered by the district.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: A rainy-weather prophecy song names Kara Shurlu of the six rods and describes
    dripping on low ground and helpless hoofed or clawed creatures.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the sixth sphere, the shaman sends his servant Kuruldak to track and catch
    a hidden hare; Kereldei mocks Kuruldak, who eventually catches the hare.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the fifth heaven the kam interviews Yayuchi, called Supreme-Creator, and
    learns secrets of the future, some of which he speaks aloud.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: In the sixth heaven the kam makes obeisance to the moon and in the seventh
    heaven to the sun; these heavens are stated to be the abodes of those luminaries.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: After reaching the highest zone attainable by his powers, the kam drops his
    tambourine, beats gently with the drum-stick, and petitions Yulgen.
  category: action
  evidence_refs:
  - ev:8
