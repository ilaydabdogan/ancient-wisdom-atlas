canonical_text:
  quote: ''
  summary: The passage discusses the scope and categories of shamanic office among
    Buryat, Koryak, and Chukchee peoples. It argues that the original Buryat shaman
    controlled a broad range of rites beyond spirit invocation. It distinguishes Koryak
    family, professional, and proposed communal shamans, linking family shamanism
    with the domestic hearth and family ritual duties. It notes that Chukchee shamanism
    uses a family/professional division but requires further professional subcategories.
  language: English
  quote_policy: summarized
