canonical_text:
  quote: ''
  summary: The passage describes the location, names, and social organization of Uriankhai/Tuva
    groups and Yakut groups. It outlines Tangnu Uriankhai offices and subdivisions,
    Yakut clan and ulus terminology, a Yakut explanation of clan membership through
    a root-and-branches image, a ninth-generation boundary for distant kin, and the
    former authority of the Yakut clan head.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Uriankhai are described as inhabiting chiefly the valley between the Sayan
    Mountains and the Tangnu-Oloy, from the Upper Kobdo to the Upper Bulguna River.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: One northern Tangnu-Oloy group is described as mongolized, speaking a Mongol
    dialect, preferring the name Mongol Oliot, and being called Kobdinsk Uriankhai
    by Potanin.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Uriankhai proper are described as Turkic, speaking a Turco-Tartar dialect,
    calling themselves Tuba or Tuva, while Uriankhai is identified as a Mongol name
    for them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Tangnu Uriankhai are said to form five Moshuns, each headed by an ogurta,
    with one older ogurta called amhan and the others subordinate to him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each khoshun is divided into sumyns; the Kemchik khoshun has ten, while the
    others described have four, and the sumyn is said to appear to be a clan.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Yakut are described as grouped in clans, naslegs, and uluses, with clans
    varying from a few individuals to several hundreds.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage reports confusion in the use of the terms ulus and nasleg, and
    says some northern Yakut uluses have only two social strata, where nasleg and
    clan are one and subordinate to the djon or ulus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sieroszewski is reported as thinking that the blood-relative clan is the basis
    of Yakut social structure, and the word aga-usa is glossed as literally meaning
    father-clan.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Yakut explanation from Namsk defines usa through an image of branches, knots,
    leaves, and buds springing from one root.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Yakut are said often to use a word meaning origin or root instead of usa,
    and to use an expression glossed as blood and flesh relationship for members of
    the same clan.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: One account says Yakut clan membership is reckoned only to the ninth generation;
    beyond that, the category sygan is used, and marriage to a sygan is allowed.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: At the time described, blood-relationship within the clan is said to be hardly
    more than a tradition, while at first Russian contact the Yakut clan system was
    highly developed and the clan head had authority as judge and war leader.
  category: sequence
  evidence_refs:
  - ev:7
