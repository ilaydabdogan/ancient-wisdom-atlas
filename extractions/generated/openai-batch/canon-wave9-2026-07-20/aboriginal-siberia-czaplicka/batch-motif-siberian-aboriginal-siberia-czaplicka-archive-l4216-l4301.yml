canonical_text:
  quote: ''
  summary: The passage describes Chukchee supplementary unions, termed by Bogoras
    “group-marriage,” including reciprocal sexual rights among marriage companions,
    a blood-anointing rite, social restrictions, cross-tribal and trade-related forms,
    a reported hospitality exchange involving a host’s wife and guest gifts, levirate
    succession, and similar marital practices among Maritime Chukchee and Asiatic
    Eskimo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chukchee supplementary unions, called by Bogoras group-marriage, may include
    up to ten couples, and husbands in such groups are called companions in wives.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man in the union is described as having a right to the wives of his companions
    when visiting their camps, while the husband usually leaves the house for the
    night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The custom formerly involved members of the same family except brothers, but
    unrelated friends may now join and become like relations who help and support
    each other.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A rite may be performed in which participants anoint each other with blood,
    first in one camp and then in another.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man may serve with the herd in order to be received into a supplementary-union
    group.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: People of unequal age and bachelors are said not to be easily accepted into
    such groups.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: People in the same camp seldom form such a group because nearby tents might
    make occasional intercourse become regular intercourse.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some poor people in such a union are said to live in one tent, though Bogoras
    did not see an example.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Acceptance of a bachelor as a companion may make such a union polyandrous.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Bogoras heard of cases where companions take another companion’s wife and
    live with her for several months or permanently.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The passage states that all Chukchee families at the time take part in such
    organizations.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:12
  text: Some unions give all men equal rights in each woman, while others involve
    asymmetrical rights among marriage-companions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: Some unions are entered without a rite, and the tie can be broken but is usually
    not broken except in a case of syphilis in the group.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: People of other tribes, including Tungus and Russians, are said to be received
    into such unions.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: The passage describes long-standing relations with Eskimo as due to trade
    intercourse, with an American Eskimo having a temporary wife on the Asiatic coast
    and a Chukchee having one on American shores.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:16
  text: A reported former hospitality custom involved Russian merchants bringing goods
    to a host, who in return offered his wife to guests after covering the sleeping
    place with furs equal in value to the present.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The passage says that the hospitality custom described in Russian accounts
    no longer exists.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: Cases in which a girl willingly accepts a guest for a small present are considered
    by the Chukchee to be forms of supplementary marriage.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:19
  text: Bogoras says he was never offered hospitality-prostitution but was often asked
    to participate in group-marriage.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:20
  text: After the death of one of several brothers, the next brother succeeds him,
    acts as husband to the woman and father to the children, and keeps the deceased
    man’s herd for them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:21
  text: Levirate is described as more a duty than a right and as belonging to a younger
    brother, cousin, or nephew, but not to an elder brother or uncle.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:22
  text: Bogoras’s information about the Maritime Chukchee is described as scanty.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:23
  text: The basis of marital union among the Maritime Chukchee and Asiatic Eskimo
    is described as the same as among the Reindeer Chukchee.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:24
  text: The passage lists near-relative marriage, marriage by exchange between families,
    marriage with a strange family after service, group-marriage, and levirate among
    the compared practices.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:25
  text: A note says that levirate is widespread among the Amerinds and the Aleuts.
  category: relationship
  evidence_refs:
  - ev:10
