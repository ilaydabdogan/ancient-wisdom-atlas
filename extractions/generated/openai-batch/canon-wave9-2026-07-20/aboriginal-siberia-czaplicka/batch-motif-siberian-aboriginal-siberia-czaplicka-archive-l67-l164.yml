canonical_text:
  quote: ''
  summary: The passage describes Siberia’s geographic extent, possible origins of
    the name Siberia, barriers to access on its southern, eastern, and northern frontiers,
    the difficulty of Arctic navigation, Nordenskiold’s voyage of the Vega, proposals
    for transport routes, and the western route used for war, trade, migrations, and
    colonization. It then begins an administrative division of Western Siberia.
  language: English
  quote_policy: summarized
