canonical_text:
  quote: ''
  summary: The passage distinguishes hysteria connected with religious life and treated
    as inspiration from forms recognized by natives as disease, then reports cases
    among Tungus and Yakut people involving attacks with cries and animal-like howling,
    compulsive imitation of speech and gestures, dance-following, a bear-fright origin
    account, alarm responses with weapons or falling, and erotic improvisation during
    a fit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that hysteria connected with religious life and regarded
    as inspiration is treated under shamanism, while this passage concerns forms recognized
    by natives as disease.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Tungus woman in a forest yurta cries and shouts, has dishevelled hair covering
    her face, nods violently, and howls like a dog while her husband holds her wrist.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Tungus woman's attacks are described as frequent, occurring by day or
    night, and gradually subsiding into deep sighs, quietness, and normal speech.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yakut women in a Middle Viluy village are described as imitating the gestures
    and words of bystanders, regardless of meaning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Jochelson reports women who could not speak Russian repeating, in broken language,
    words spoken by him and his companions; he is told they are omuraks.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: When younger people begin to dance, villagers, including the old, are described
    as following their example; an old woman unable to stand alone dances until she
    falls exhausted.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: One origin account says a Yakut woman and her eighteen-year-old son met a
    bear in the forest; the bear rose on its hind legs, the woman fell into its arms
    and was mauled, and the son split the bear's skull with an axe, after which the
    woman had attacks.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Maak also reports Yakut children who usually sang instead of speaking in ordinary
    voices when addressing people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sufferers from the described mimicry mania are said to take up a knife or
    axe against the source of sudden fright, and sometimes shudder and fall backward
    at an unexpected noise.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Jochelson reports that the ailment can evoke erotic expressions, including
    a case in which a Yakut hostess has a fit and sings an improvisation expressing
    attachment to a departing young Russian man.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
