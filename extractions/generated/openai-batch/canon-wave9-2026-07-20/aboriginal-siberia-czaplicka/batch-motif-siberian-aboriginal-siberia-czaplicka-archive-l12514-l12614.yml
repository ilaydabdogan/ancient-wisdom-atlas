canonical_text:
  quote: ''
  summary: The passage summarizes Czaplicka's presentation of Bogoras and Jochelson
    on Chukchee and Koryak shamanic sex or gender transformation, including staged
    changes in hair, clothing, work habits, pronunciation, marriage, spirit commands,
    and supernatural spouses or protectors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Earlier notices are said to connect the described practices with shamanistic
    inspiration or evil biddings rather than presenting complete accounts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bogoras is summarized as saying that sexual organs may be mentioned in certain
    shamanistic ceremonies and that a shaman may be naked during incantations, including
    one used to invoke the moon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage gives Chukchee terms for a man described as having changed sex
    or as being similar to a woman, and says analogous woman-to-man cases are rarer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: One described degree of transformation involves arranging or braiding hair
    like a woman; another involves changing dress, as in the case of Kimiqai, who
    wore women's clothes by order of spirits after illness.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A further degree involves abandoning male-coded hunting implements and taking
    up the needle and skin-scraper, with spirits said to help the person learn quickly;
    pronunciation and bodily appearance are also said to change.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In rare cases the transformed male person is said to feel himself a woman,
    seek a lover, and sometimes marry; such marriages are described as performed with
    usual rites and as durable.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The passage says public opinion is against transformed shamans, but that they
    are not openly opposed because they are considered dangerous.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Each transformed male person is said to have a special spirit protector who
    acts as a supernatural husband, is considered the real head of the family, and
    gives orders through the transformed wife to the human husband.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Tiluwgi is presented as a transformed male person known to Bogoras; his human
    husband described him as biologically male, while his habits are described as
    those of a woman.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: One reported transformed shamaness was a widow with children who, following
    spirit commands, cut her hair, wore men's dress, adopted masculine pronunciation,
    learned spear and rifle use, and found a young girl to become her wife.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Jochelson is said not to have found contemporary Koryak cases of women-shamans
    transformed into men or men-shamans transformed into women, though such women-to-men
    transformations are reported in Koryak legends.
  category: relationship
  evidence_refs:
  - ev:10
