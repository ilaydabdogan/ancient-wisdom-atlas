canonical_text:
  quote: ''
  summary: The passage introduces the shaman as a central religious specialist, distinguishes
    hereditary, family, individual, and professional forms of shamanhood among Siberian
    groups, describes supernatural gift and spirit association as qualifications,
    and contrasts family drum performances with professional shamanic actions. It
    also notes self-mastery, inspired fits, social influence, and examples of shamanic
    feats and reputation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chapter describes the shaman or priestly role as a repository of religious
    beliefs and traditions.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The office is hereditary in some cases, but the passage says a supernatural
    gift is everywhere a necessary qualification for becoming a shaman.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage contrasts family shamans among Palaeo-Siberians with professional
    shamans among Neo-Siberians, while also noting a reported decline of family shamanism
    except among the Chukchee.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Individual or professional Chukchee shamans are said to be called “those with
    spirit,” from a word for shamanistic spirit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The shaman is described as differing from an ordinary patient by possessing
    strong self-mastery between ceremonial fits.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A good shaman is said to need unusual qualities, especially the ability, through
    tact and knowledge, to influence surrounding people.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The shaman is described as needing to know when to have a fit of inspiration,
    sometimes rising to frenzy, and how to preserve a tabooed attitude in daily life.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A footnote reports a young Kolyma shaman who performed difficult tricks but
    was not considered first-class, while an inspired old woman-shaman without those
    tricks was highly esteemed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says some families have drums, and family members beat them with
    singing at set times; at least one family member may try to communicate with spirits
    after the manner of shamans.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage contrasts family performances in the outer room and daylight with
    professional shamanic actions in the inner room and at night.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Adult Chukchee may occasionally beat a drum and sing melodies in the sleeping-room,
    especially in winter, with or without light.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says the Koryak, Asiatic Eskimo, Chukchee, Yukaghir, and practically
    all Palaeo-Siberians also possess professional shamans, sometimes in decadence.
  category: relationship
  evidence_refs:
  - ev:7
