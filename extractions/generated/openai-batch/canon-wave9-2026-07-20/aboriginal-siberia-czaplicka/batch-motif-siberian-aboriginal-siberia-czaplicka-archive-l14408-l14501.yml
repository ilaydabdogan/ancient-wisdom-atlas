canonical_text:
  quote: ''
  summary: 'The passage describes several classes of spirits derived from human souls,
    especially malicious or wandering spirits, and then summarizes Vogul and Samoyed
    religious ideas: hierarchies of creator and lesser gods, divine descent to earth,
    weather control through cloud-dwelling beings with water-laden reindeer, and a
    tale in which Yanykh-Torum’s sons compete for rulership by reaching a silver post
    first.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ada or anahhai are described in some traditions as souls of wicked persons
    or women who died childless.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ada or anahhai receive no sacrifices and are represented as one-eyed, evil,
    malicious spirits that remain in the same ulus or house.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ada or anahhai may take the form of a one-eyed dog or cat, wander at night,
    may be seen only by some people, and can be smelled by anyone through their disagreeable
    odour.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ada or anahhai fear being seen, angry men, fire, metals, weapons, and the
    smell of heath.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ada or anahhai are described as especially harmful to young children under
    seven, so parents arrange naydji with shamans for protection.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Iilcher-ezy are described as a less important kind of hokholdoys and as souls
    of sinful women who died a violent death.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Iilcher-ezy receive no sacrifices, are not feared, can be seen by the same
    people who see anakhay, and can otherwise be perceived by odour.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Iilcher-ezy wander on earth at the time when the women would have died naturally
    if violence had not ended their lives.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Klementz is reported to mention mu-shuhu, in the form of an evil-disposed
    bird, and dâlkhâns as malicious spirits originating from human souls.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Vogul gods are described as divided into good and bad classes, with Yanykh-Torum
    as chief beneficent deity and Khul as principal evil deity.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kors-Torum is described as the Creator, progenitor of all the gods, higher
    than Yanykh-Torum, unrevealed to humans, and known only through lesser gods.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Kors-Torum never descends to earth but sometimes sends his eldest son, Yanykh-Torum,
    there.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Yanykh-Torum has human form, shines like gold because of his splendid raiment,
    carries no weapon, and descends about once a week to see human affairs.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: When people pray to Yanykh-Torum for rain or fair weather, he commands his
    younger brother Sakhil-Torum, who dwells in dark clouds, to provide what is required.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: Sakhil-Torum has human form and drives tusked reindeer in the clouds; the
    reindeer carry casks of water.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: When Sakhil-Torum whips sluggish reindeer, water spills from the casks and
    falls to earth as rain.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: Yanykh-Torum sends his grown sons down to earth, where they fight with the
    heroes living there.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:18
  text: To create peace, Yanykh-Torum summons his sons and declares that the first
    to tie his bridle to the silver post before his house will become elder and ruler
    over his brothers and over men.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:19
  text: The youngest son, Mir-Susne-Khum, arrives first and thereafter rules his brothers
    and men, whom the brothers try to keep in peace.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:20
  text: Yanykh-Torum is said to have seven sons, while neither he nor Kors-Torum has
    daughters.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:21
  text: The passage states that many secondary gods are connected with individuals,
    family, or clan, and each category of gods has its own sacrificial places.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:22
  text: A note reports that the Samoyed chief god Nim or Ileumbarte rules earth and
    heaven but never descends to the unclean earth, communicating through spirits
    who choose shamans.
  category: relationship
  evidence_refs:
  - ev:17
- id: obs:23
  text: A note reports that Samoyed atmospheric phenomena such as storms, rain, and
    snow are regarded as direct expressions of the great god Num.
  category: relationship
  evidence_refs:
  - ev:18
