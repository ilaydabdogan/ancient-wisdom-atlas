candidate_motifs:
- id: motif:1
  label: malicious dead as household spirits
  taxonomy_refs: []
  basis: Ada or anahhai are described as souls of wicked persons or childless women
    who become one-eyed malicious spirits remaining in a house or ulus.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage reports traditions summarized by the author; no ritual narrative
    is given beyond the protective response.
- id: motif:2
  label: spirit detectable by smell but visible only to some
  taxonomy_refs: []
  basis: Ada or anahhai and iilcher-ezy can be seen only by certain people, while
    others may perceive their odour.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: high
  cautions: This is an observed spirit-property pattern rather than a full narrative
    motif.
- id: motif:3
  label: animal-form malicious spirit
  taxonomy_refs:
  - shapeshifter
  basis: Ada or anahhai sometimes take dog or cat form, and mu-shuhu is described
    in bird form.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: medium
  cautions: Only ada or anahhai are explicitly said to take forms; mu-shuhu is simply
    described as being in bird form, so the broader shapeshifter taxonomy should be
    reviewed.
- id: motif:4
  label: vulnerable child protected by shamanic arrangement
  taxonomy_refs: []
  basis: Young children under seven are especially harmed by ada or anahhai, and parents
    arrange naydji with shamans for protection.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The term naydji is not explained in this passage.
- id: motif:5
  label: violent-death soul returns at unrealized natural death time
  taxonomy_refs: []
  basis: Iilcher-ezy wander on earth when the deceased women would have died naturally
    if violence had not ended their lives.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage gives a compact ethnographic description rather than a narrative
    episode.
- id: motif:6
  label: remote creator known through lesser gods
  taxonomy_refs:
