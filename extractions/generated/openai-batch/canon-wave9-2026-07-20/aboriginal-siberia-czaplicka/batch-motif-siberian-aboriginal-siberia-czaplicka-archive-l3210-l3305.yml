canonical_text:
  quote: ''
  summary: The passage describes Yakut clan and family organization, clan responsibility
    for crime, inter-clan alliances, ysyakh festivals with sacrifices, tournaments,
    shamanic presence, and communal kumys drinking. It also describes a three-circle
    confederation council, invocations to Aiy-toyon, an eagle as confederation symbol,
    clan watchwords, and a note on shaman-invoked spirits divided into heavenly, earthly,
    and subterranean groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Economic and legal questions were decided by a council of elders made up of
    fathers, uncles, and elder brothers; the passage says a Yakut would consult such
    male elders before buying or selling.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage connects Yakut social organization with clan ownership of large
    horse herds and says cattle-herding contributed to smaller social groups and the
    family becoming a more important unit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: If there was no male heir, property claim lapsed to the clan, and a married
    sister of the deceased received nothing.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The clan of a murderer was held responsible for the crime and had to compensate
    either in blood or by payment of damages; blood-feuds between clans could become
    hereditary.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man who killed a fellow-clansman was tied to a tree in the depths of a forest
    and left to perish.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Clans sometimes formed alliances called iiyeUakh, described as reconciled
    or peaceful; the passage says such pacts were made for defense or economic reasons
    and cemented by common sacrifices and festivals.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ysyakh festivals occurred in spring, at midsummer, at weddings, at peace-conferences,
    and as expressions of joy.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ysyakh festivals included sham fights or tournaments and trials of military
    skill, whose results could decide a clan’s position in a confederation or alliance;
    the tourneys often ended in real fights.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Formerly no ysyakh could be held without a shaman, and drinking kumys from
    a common cup was an important feature of the festivities.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'The confederation council was composed of three circles: chiefs and sesen
    in the first, nobles and warriors in the second, and common people and youths
    in the third.'
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Orators addressed the assembled tribe in council; the alliance watchword Urui
    could be shouted, and orators called on Aiy-toyon to hear them from his milk-white
    throne.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Toyon-kyl, the eagle, is explicitly described as the symbol of the confederation
    and is said to look down from its perch.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Each clan and confederation had its own shout or watchword, badge, and songs,
    though these were said to be almost forgotten.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: 'A footnote says the spirits invoked by a shaman are divided into three his:
    heavenly, earthly, and subterranean; the same note says the meaning of his is
    not quite clear.'
  category: relationship
  evidence_refs:
  - ev:10
