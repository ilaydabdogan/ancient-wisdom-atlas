canonical_text:
  quote: ''
  summary: The passage describes Yukaghir avoidance rules among persons called nexijini,
    explanations given for the custom, limits on consanguineous marriage, environmental
    constraints on exogamy, and marriage procedures involving bride-service, wood-cutting
    tests, and an intermediary who frames marriage as admission to a shared hearth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Persons in the nexijini relationship are described as not addressing each
    other directly, not looking into each other's faces, and not uncovering their
    bodies or legs above the knees in each other's presence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men who are nexijini to one another are described as not uncovering sexual
    organs, not speaking of sexual matters among themselves, and not visiting the
    same girl.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The avoidance rules are said to be observed more closely among relatives by
    affinity than among blood-relatives.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: When asked about the origin of the custom, informants reportedly answered
    that their fathers did so or that wise men know it ought to be so.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some natives reportedly told Jochelson that when parents are blood-relatives,
    the children die.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Cohabitation between near relatives is said to occur at the present day, with
    a special blanket that has two foot-bags for the couple instead of one.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Violation of nexijini is described as imprudent rather than as an absolute
    barrier, and the relationship is removed by ceremonies after the couple are married.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage reports that former Yukaghir marriage prohibitions applied only
    to first cousins, that second cousins were not considered consanguineous relatives,
    and that myths often refer to consanguineous marriages, especially brother-sister
    marriages.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says that hunting life often scattered families or related family
    groups, leaving them isolated from other tribes or clans and contributing to sexual
    relations within the group or family.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: A man favoring a girl performs services for her relatives; these services
    are accepted or rejected silently, are called pogl'omt, and function as a test
    of the man's ability.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In former days the groom chopped wood before his future father-in-law's house
    for three days; acceptance of the fuel signified acceptance of the groom.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the first wood-cutting task, the future father-in-law chose the thickest
    tree he could, and the groom had to cut it down and drag it to the father-in-law's
    house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the later procedure, an intermediary speaks to the girl's parents and describes
    the proposed marriage as a wish to sit at one hearth and to admit the orphan-lad
    to the hearth's warmth.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The bride's father initially refuses the proposal, later says he must learn
    the opinion of the other relatives, and finally states that the bridegroom may
    be admitted if he stays with him until his death.
  category: sequence
  evidence_refs:
  - ev:8
