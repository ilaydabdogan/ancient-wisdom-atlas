canonical_text:
  quote: ''
  summary: 'The passage describes Gilyak and Tungusic social organization: a winter
    bear-festival that strengthens inter-clan friendship; Tungus family, clan, and
    sub-clan structures; clan exogamy and elders; Russian administrative changes;
    clan names derived from founders, heroes, places, or Russian-imposed labels; incorporation
    of alien elements; and classifications of Tungus groups by mode of life.'
  language: English
  quote_policy: summarized
