  summary: 'The passage describes Yukaghir marriage practices: a groom’s formal entry
    into his wife’s family, the subordinate status of the son-in-law, bride-service
    and bride-purchase among tundra Yukaghir influenced by Tungus custom, and wedding
    rites involving gifts, reindeer, blood-smearing called washing, veiling, protective
    gunfire, circumambulation of the groom’s parents’ tent, preparation of the nuptial
    bed, and transfer of reindeer as purchase-price.'
  language: English
  quote_policy: quoted
