canonical_text:
  quote: "'a journey out of loneliness'"
  summary: The passage describes a second Chukchee marriage rite at the bride's parents'
    home, involving reindeer, gifts, anointment, family face-marks, a hearth sacrifice,
    feasting, and return to the groom's home. It then summarizes divorce, wife-reclamation
    by kin, polygyny, rivalry among wives, and a tale in which an abused older wife
    lives with bears and returns with incantatory aid to regain her husband and expel
    the younger wife.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A second marriage rite occurs after a few days or weeks at the house of the
    bride's parents and is called a journey out of loneliness.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In this rite the bride drives reindeer, but not the same reindeer used in
    her first journey.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife, groom, and accompanying relatives bring reindeer, meat-puddings,
    and other presents to the bride's parents, while insisting these are presents
    rather than bride-payment.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: On arrival at the bride's camp, the bride and groom are anointed, the bride's
    family mark is painted on their faces, and the bride makes a sacrifice to the
    hearth of her home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: After a feast the couple returns the next day to the bridegroom's home, where
    anointment is repeated and the husband's family mark is painted again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: The passage says Chukchee marriage is often impermanent, with wives sent back
    to parents, unions sometimes broken by the bride's family, and children divided
    by nursing status.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Sometimes a wife is carried away from her husband by her elder brother against
    her wish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: In one example, a wife's brother refused to return her unless the husband
    promised not to refuse him reindeer; because the husband refused, the wife was
    not returned.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Reindeer Chukchee are described as mainly monogynists, with about one-third
    polygynists; some rich reindeer-breeders keep a wife with each herd.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Where several wives live in the same camp, the husband may try to provide
    separate tents or separate sleeping-places; tales also describe a husband sleeping
    between two wives.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: The first wife is generally older and controls the others, who are described
    as more like servants.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: A childless wife may urge her husband to marry another woman, but the passage
    also notes cases where a husband favors the second wife and expels the first.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: In the tale 'The Bigamist,' a man with an old wife and a young wife abandons
    and beats the old wife after taking the young one.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The old wife goes into the desert, enters a bear's haunt, and tells the angry
    bear-mother that it would be better for the bear to kill her because her husband
    beats her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The woman stays with the bears; in spring the bears let her go with presents
    and incantations.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: Using the bears' incantations, the woman regains her husband's favor and persuades
    him to drive out the rival, who dies from hunger and cold.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:17
  text: Bogoras is said to have seen women quarrel and fight over the favors of their
    husband, and similar jealousy examples are attributed to Maydell.
  category: action
  evidence_refs:
  - ev:6
