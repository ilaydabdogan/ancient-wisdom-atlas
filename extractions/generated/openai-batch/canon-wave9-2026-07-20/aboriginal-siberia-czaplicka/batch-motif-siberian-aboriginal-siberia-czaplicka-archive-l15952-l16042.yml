canonical_text:
  quote: ''
  summary: The passage discusses Siberian nervous afflictions, their distribution
    among peoples, and the distinction made between ordinary illness and shamanic
    inspiration. It describes menerik as increasing a youth's chance of becoming a
    shaman, because the shaman can treat the spirit-caused affliction as a controlled
    struggle and learn to appease spirits, whereas an ordinary person is a victim.
    It also distinguishes imitative mania as a disease that would disqualify a shaman.
  language: English
  quote_policy: summarized
