canonical_text:
  quote: ''
  summary: 'The passage reports several cases grouped under ''arctic hysteria'' or
    mimicry mania: seizure-like fits attributed by participants to evil spirits or
    a devil, altered speech, susceptibility to auditory and visual suggestion, involuntary
    imitation of commands or gestures, dangerous mimicry near water, and retaliatory
    pursuit of tormentors after ridicule.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A married woman repeated an action for about two hours, then fell into deep
    sleep while her husband and young children were present.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband loved and was jealous of his wife, but during the fit he abused
    only the abassy, described as an evil spirit disturbing her with temptation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Jochelson stated that the woman's conduct was difficult to explain as simulation
    or auto-suggestion and that she seemed not to know what she was doing.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the Korkodon River, a young Yukaghir girl sang in Tungus during a hysterical
    seizure; after the fit her body was bent like a bow and her hands were clenched.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When Jochelson took the girl's hands, the cramps ceased, but she remained
    unconscious for a long time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After recovery, the girl said a devil had possessed her, had tried to devour
    Jochelson, and had failed; the passage adds that this devil must have been of
    Tungusic origin.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says people suffering from arctic hysteria may be susceptible
    to hypnotic suggestion while awake, including auditory, visual, and natural sounds
    such as wind or animal cries.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: One hysterical woman was said to be hypnotized by words of a tale she herself
    told, and another seized a horse by the tail at a young man's command and was
    dragged until ordered to release it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At a fishing, a Cossack held a salmon in his teeth and ran up and down a hill;
    an old woman imitated him, ran into the water, became unconscious, and released
    the fish only after being pulled out.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old woman weakly repeated 'Enough, enough!' while following the Cossack
    but was unable to stop by her own will.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says some patients, after following a command, realize they are
    being mocked and attack their tormentor.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A Yakut woman imitated a young Yakut who pretended to put snow under his dress;
    after feeling the cold melting snow, she took a knife and searched for him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Piklonski's reported examples include a merak on an Amur steamer discarding
