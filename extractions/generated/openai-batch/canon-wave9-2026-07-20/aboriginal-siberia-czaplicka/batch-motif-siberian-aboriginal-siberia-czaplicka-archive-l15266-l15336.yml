canonical_text:
  quote: ''
  summary: The passage describes Buryat child-protection sacrifices and the ulhanhudla
    ceremony, including water collection with copper coins, shamanic libation to zayans
    and zayanesses, ablution, rush broom, nine stones, nine threads with knots placed
    around the child’s neck, and apotropaic placement of the broom over the yurta
    door. It also notes Buryat practices of feeding ongons, dedicating animals to
    ongons under taboo, and the treatment of a deceased master’s horse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Balagansk Buryat, every male child is said to be required to offer
    named sacrifices to the western Ihats for protection in infancy and adult life;
    the same sacrifices are not obligatory for girls.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other sacrifices are made for young children of either sex to zayans and zayanesses
    termed ulhan-Mafa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the ulhanhudla ceremony a shaman is invited, and water is brought from
    a spring, lake, or river after copper coins are dropped into the place from which
    the water is taken.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A bundle of steppe grass, a bundle of rushes, and nine silken threads are
    prepared for the ceremony.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The shaman makes a libation to the zayans and zayanesses and recites words
    mentioning boys, maids, grass, spring water, ablution, and nine silken threads.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The water is poured into a pot and heated, grass is placed in the pot, and
    a broom is made from rushes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The child is placed in a shallow vessel surrounded by nine stones.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The shaman identifies a black stone as the door and a tawny stone as the courtyard.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The shaman dips the broom in the water, lightly strikes the child with it,
    and tells the child not to cry but to grow quickly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Nine knots are made in the nine threads and the threads are placed around
    the child’s neck.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The ceremonial water is spilled on the floor of the yurta, and the broom is
    placed over the door to prevent evil spirits from entering.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Minor Buryat ceremonies, such as feeding ongons, may be conducted by the master
    of the house, while women’s ongons are made and fed by women.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Animals may be dedicated to ongons for a period or for life; such animals
    are not to be used for heavy work, and no married woman is to touch them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage says the Mongols call the custom of animal dedication and taboo
    seterteg.
  category: other
  evidence_refs:
  - ev:6
- id: obs:15
  text: A horse whose master has died may be taboo and not used for heavy work; ordinarily,
    when a Buryat dies, the horse is killed or set loose on the steppes.
  category: action
  evidence_refs:
  - ev:7
