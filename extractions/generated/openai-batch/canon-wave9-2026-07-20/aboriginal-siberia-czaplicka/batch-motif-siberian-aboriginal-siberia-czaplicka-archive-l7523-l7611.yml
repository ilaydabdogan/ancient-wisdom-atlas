canonical_text:
  quote: ''
  summary: The passage describes funeral rites involving a sacrificial reindeer, treatment
    or burning of the corpse, corpse-opening by a nearest relative called the fortifier,
    charms and protective actions after the funeral, return visits to the corpse,
    iron retrieval, antler offerings, Maritime Chukchee variants, and beliefs about
    the dead living in upper or lower worlds and traveling difficult paths to the
    other world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the appointed place, a sacrificial reindeer is killed, the special sledge
    is broken up, ceremony objects are piled, and the broken reindeer bones are placed
    on the pile.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The followers transform themselves into ravens or foxes by making appropriate
    noises, tear the body straps and clothes, place the clothes beside the body, and
    cover the body with pieces of reindeer flesh.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fortifier, identified as the nearest relative of the deceased, opens the
    body with a long knife while avoiding hand contact, exposes the organs, splits
    the liver and heart, and announces a probable cause of death after inspection.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before leaving the body, the fortifier cuts its throat; the passage reports
    that flesh of the deceased was formerly distributed and eaten by relatives, while
    now relatives take fur pieces from the clothes for ancestor charms.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the body is burned rather than exposed, the throat is still cut, the
    face and genitalia are covered, and a specially prepared fire-drill is used to
    produce the pyre fire and left there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the return journey, people change their order of travel and perform protective
    incantations; the fortifier throws small stones behind him that are to become
    mountains, and two oldest women meet the returning train with charms.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the next day, relatives visit the dead or fetch iron by taking iron implements
    from the pyre, leaving wooden substitutes, purifying the iron objects, and leaving
    the reindeer antlers as a sacrifice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the body has been disturbed by wild beasts, the relatives feel more secure.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The funeral rites terminate on the fifth day with another visit to see whether
    wild beasts have mutilated the body, followed by an antlers ceremony and removal
    of the family tent to another spot.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the following year, more antlers may be left on the pyre, or a communal
    antler sacrifice may be performed for the dead generally, producing high mounds
    called Antler Stores associated with the family.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: For the Maritime Chukchee, there are fewer reindeer and antler sacrifices,
    but the passage says the general forms are the same; sacrifice to the dead occurs
    at a Hearth Enclosure, or on the shore if the dead person perished at sea.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: A person thought to have perished at sea who later escapes and lands on shore
    must undergo a purifying ceremony.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The dead are said to have several abodes where life resembles earthly life;
    inhabitants are called Upper People or Lower People and occupy worlds above the
    earth or underground.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: Children who die here are said to be born there, and vice versa.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: A dead person must traverse difficult paths, pass through the country of dogs,
    may be injured there if he ill-treated dogs, and is assisted by dead relatives
    in finding the way.
  category: sequence
  evidence_refs:
  - ev:8
