comparison_claims:
- id: claim:1
  claim: The Gilyak sacrificial examples can be cautiously compared to a sacrificial-exchange
    pattern because offerings, prayer, and requested intercession are explicitly linked
    to desired protection or divine aid.
  claim_level: same_function
  target: sacred_exchange and sacrifice motif families
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: This is a functional comparison to a motif family only; the passage
    does not support claims of historical contact or derivation.
- id: claim:2
  claim: The Gilyak account of the soul moving to niiflvo and then from land to land
    fits an afterlife-journey motif family, with an added rebirth element for some
    souls.
  claim_level: same_motif
  target: afterlife_journey_map with death_rebirth/return elements
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives a summary, not a full mapped itinerary or ritual
    guide.
- id: claim:3
  claim: The Ainu title Tuntu and the description of the Supreme Being as centre,
    foundation, and support of the world support a cautious comparison to a world-centre
    or world-support symbolic pattern.
  claim_level: same_function
  target: world_center motif family
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage describes divine epithets, not a physical axis, temple,
