canonical_text:
  quote: ''
  summary: The passage summarizes Gilyak sacrificial practice, clan-gods, good and
    malevolent spirits, shamanic helpers, beliefs about multiple souls and postmortem
    journeys, then introduces Ainu beliefs about a supreme creator-being, subordinate
    deities, divine doubles, and paired sea gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gilyak sacrifices are described as usually lacking elaborate ceremonial and
    as based on a principle of exchange.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Gilyak at sea who fears a storm throws tea-leaves into the water and prays
    for the sea not to be angry and for a safe return home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gilyak people carry objects intended for sacrifices, including roots and leaves
    of certain plants such as martagan.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Dog victims are used in bloody sacrifices, especially at the beginning of
    the sable-trapping season and at the bear-festival; the dogs are strangled and
    asked to intercede with the gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Clan-gods are described as spirits of clansmen who died by drowning or fire
    or were killed by bears, and the clan makes periodical sacrifices to them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Good spirits named hoi, lot, and urif are distinguished from numerous malevolent
    beings called mill or linr, which have various forms and cause misfortune, illness,
    and death.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Incantations and shamanistic ceremonies are used against malevolent beings,
    but a shaman requires two spirit-helpers, TieJchn and Ja'ncJilh, to deal with
    them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Gilyak are said to believe that an ordinary man has one soul, a rich man
    two, and a shaman as many as four.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The shaman Chamkh is said to have had four souls received from the mountain,
    sea, sky, and underworld; his son Koinit, chosen by spirits to be a shaman, had
    two souls at age twelve.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Besides principal souls, each person has a lesser soul imagined like an egg,
    residing in the head of the principal soul; dreams are attributed to this lesser
    soul.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: After death, the soul may escape attacking evil spirits and go to the land
    of the dead, niiflvo, where it has human form and lives much as on earth, with
    poor and rich conditions reversed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: From the land of the dead the soul goes from land to land, becoming smaller
    forms such as a bird, a gnat, and finally a speck of dust; some souls return to
    earth and are born again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The lesser soul of the deceased continues for some time in the best-beloved
    dog of the deceased, which is then cherished and cared for.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Ainu Supreme Being is named as Kotan Kara Kamui, Moshiri Kara Kamui, and
    Kando Koro Kamui, glossed as maker of places and worlds and possessor of heaven.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Ainu sometimes call the Supreme Being Tuntu, meaning pillar, support,
    or upholder; he is described as creator, summit, centre, foundation, originator,
    and mighty support of the world.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:16
  text: Ainu belief is described as including many lesser deities subject to the highest
    deity; some benevolent gods have a malignant double, and two sea gods called Hep
    un kamui are brothers.
  category: relationship
  evidence_refs:
  - ev:11
