  quote_or_summary: Bloody Gilyak sacrifices use dog victims, chiefly at the beginning
    of sable-trapping season and at the bear-festival; the dogs are strangled and
    asked to intercede with the gods.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: lines 13632-13637
  quote_or_summary: Clan-gods are spirits of clansmen dead by drowning, fire, or bear
    attack; the clan makes periodical sacrifices to them, and the bear-festival belongs
    to this class of sacrifices.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 13638-13647
  quote_or_summary: Good spirits include hoi, lot, and urif; malevolent beings called
    mill or linr are numerous, varied in form, and cause misfortune, illness, and
    death; the shaman uses incantations and ceremonies but needs the helpers TieJchn
    and Ja'ncJilh.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 13648-13658
  quote_or_summary: Gilyak belief gives an ordinary man one soul, a rich man two,
    and a shaman as many as four; Chamkh had souls from mountain, sea, sky, and underworld,
    while his son Koinit was spirit-chosen and had two souls at age twelve.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 13658-13663
  quote_or_summary: Every person also has a lesser soul imagined like an egg, located
    in the head of the principal soul; dream experiences are attributed to this lesser
    soul.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 13663-13672
  quote_or_summary: Death is attributed to the body being devoured by evil spirits;
    the soul, also attacked, may escape to niiflvo, the land of the dead, where it
    has human form and lives as on earth with poor and rich statuses reversed.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 13672-13682
  quote_or_summary: The soul then goes from land to land, becoming smaller beings
    such as a bird, a gnat, and a speck of dust; some souls return to earth and are
    born again, and the lesser soul remains for a time in the deceased's cherished
    dog.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 13683-13694
  quote_or_summary: The Ainu Supreme Being is named Kotan Kara Kamui, Moshiri Kara
    Kamui, and Kando Koro Kamui, glossed as maker of places and worlds and possessor
    of heaven; Kamui is explained through meanings of greatness, covering or overshadowing,
    heaven, and above.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 13694-13699
  quote_or_summary: The Ainu also call the Supreme Being Tuntu, meaning pillar, support,
    or upholder; he is described as creator, summit, centre, foundation, originator,
    support, creator and preserver of the world, sustainer of men, and protector accessible
    in prayer.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 13699
  quote_or_summary: Ainu belief includes many lesser deities subject to the highest
    deity; some benevolent deities have malignant doubles, and two sea gods called
    Hep un kamui are brothers.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summarized.
