canonical_text:
  quote: ''
  summary: 'The passage describes Kamchadal marriage practices as reported by Krasheninnikoff
    and Steller: bride capture or resistance, a first-marriage ceremony involving
    travel by boat, food, singing, a shamanistic rite over a fish head, heavily layered
    garments for the bride, roof-entry into a yurta, stepping over a dried fish, gift
    exchange, feasting, and post-marital labor for the father-in-law. It also summarizes
    widow remarriage, permitted and forbidden unions, divorce, polygyny, and a brief
    statement that Kuril marriage ceremony was similar to Kamchadal practice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bridegroom may struggle for a long period to obtain his wife; the passage
    says one man tried for ten years and was disfigured by the struggles, while another
    bridegroom may obtain immediate victory.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After immediate victory, the bridegroom must leave the woman; she calls after
    him in a caressing voice, he comes to sleep with her that night, takes her to
    his home the next day, and only later returns with her to her parents' house to
    celebrate the marriage.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the 1713 ceremony near the River Katuga, the bride, bridegroom, and his
    relatives went to the father-in-law in boats; women including the bride sat in
    canoes, the men guided them, and the women carried prepared food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: About 100 metres from the house, the party landed, sang, and a shamanistic
    ceremony was performed over a fish head, which was then given to the eldest woman
    of the company.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Extra garments were placed over the bride's dress until she looked like a
    stuffed figure; after returning to the boats and reaching the landing near the
    house, she was carried by a young lad, fitted with a leather strap, and lowered
    from the roof into the yurta.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The eldest woman placed the dried fish on the threshold so the pair and the
    company could step over it; she then stamped on it and put it on the wood for
    the fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After the guests sat down, women removed the bride's extra garments, divided
    them among relatives, and relatives presented gifts; the father-in-law entertained
    the guests the next day, and on the third day the company dispersed except for
    the newly married pair, who still had to work for him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The described ceremonies were held only for a first marriage; a widow could
    marry a second husband without ceremony, but before being taken as a wife she
    had to have intercourse with someone else, usually a stranger, and the passage
    says Cossacks later performed this office.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states that marriage was forbidden only between father and daughter
    and between mother and son; it says affinal unions and first-cousin marriage were
    allowed, divorce was simple separation, and remarriage for a woman could occur
    without the capture and purification ceremonies.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: A man could have multiple wives according to his wealth; wives could live
    in separate yurtas or together, and each wife had to be captured as described.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage reports that virginity was not regarded as essential in a bride,
    that co-wives could live together peaceably, and that some Kamchadal kept koekchuch
    instead of concubines.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage begins a Kuril section by stating that the Kuril marriage ceremony
    was similar to the Kamchadal ceremony, but the excerpt breaks off before providing
    details.
  category: relationship
  evidence_refs:
  - ev:12
