canonical_text:
  quote: ''
  summary: The passage describes Ainu marriage restrictions, village and family residence
    after marriage, child and adult betrothal practices, bride-service, reported mythic
    references to wife-purchase and double marriage, a betrothal rite involving a
    sword pledge and prayer to the goddess of fire, and reciprocal post-marriage gift-making
    by bride and bridegroom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ainu are reported to permit marriage with cousins, in some cases nieces,
    and a deceased brother's wife, while forbidding unions with a sister-in-law's
    sister or a brother's wife's sister.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Violation of the stated marriage restriction is believed to bring death or
    failure to have children.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Marriage within the village is reported as common, so the restriction is said
    not to constitute true exogamy.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Residence after marriage depends on who initiated the marriage proposal:
    the bridegroom may be adopted near the bride''s father, or the bride may be adopted
    into the bridegroom''s family.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Child betrothal exists, but the betrothed children are not compelled to marry
    if they are unwilling when mature.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In a reported child-betrothal practice, the boy and girl exchanged clothes
    and, according to Batchelor, possibly homes until the time for union.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The general Ainu method of obtaining a wife is described as serving for her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Pilsudski states that wife-purchase, when found in Ainu life or myths, usually
    occurs where the Ainu have had contact with the Gilyak and have been influenced
    by them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A formerly existing custom of women trying to win men is said by Pilsudski
    to be no longer observed, and Ainu mythology ascribes it to Tungus women.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Some myths are reported to mention a girl marrying a man and later marrying
    him again 'for good'; the passage interprets the first union as betrothal and
    the second as real marriage.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In an adult betrothal description, the bridegroom's father gives a small sword
    into the hands of the bride's father as a pledge of betrothal.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The bride's father worships the fire and asks the goddess of fire to witness
    the agreement and protect the couple from sickness until old age.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The marriage ceremony is described as involving a feast, an exchange of presents,
    and old men making fetiches for the new 'heart of the house'.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: After marriage, the bridegroom makes a knife-sheath, spoon, shuttle, and weaving-loom
    for the bride; this is called 'making my wife'.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The bride makes a girdle, leggings, necklace, and headdress for the husband;
    this is called 'making my husband'.
  category: action
  evidence_refs:
  - ev:9
