canonical_text:
  quote: ''
  summary: The passage describes interethnic marriages involving Reindeer Chukchee,
    Russian, Koryak, Tungus, Yukaghir, and Yakut groups, emphasizing economic motives,
    adaptation through incantation, and differing social interpretations of Russo-Chukchee
    relations. It then describes a Chukchee marriage rite involving the bride’s arrival,
    sledges with ritual objects, sacrifice to dawn and zenith, blood anointing, painting
    of the groom’s family mark, feeding holy household objects with marrow, and sprinkling
    blood on the hearth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Reindeer Chukchee are described as sometimes taking wives from Koryak, Tungus,
    and Yukaghir groups, and the women are said to adopt Chukchee manners.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Neighboring groups are described as poorer than Reindeer Chukchee and as readily
    giving daughters in marriage to rich Chukchee; a poor man may be adopted first
    as a son and later as a son-in-law.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bogoras is said to know twenty cases of Russo-Chukchee marriages and to suppose
    that economic reasons play a role.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Russian woman reports that an old knowingwoman performs an incantation that
    removes sorrow and helps adaptation to Chukchee life.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Russian women on the river are reported to say that Chukchee women remove
    a woman’s Russian soul and replace it with a Chukchee soul, after which she loves
    open-air life.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Mixed Russo-Chukchee marriages are described as generally childless, while
    some Lower Kolyma Russianized families form relations that Chukchee regard as
    group-marriage and Russians regard as prostitution.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'The passage reports reciprocal material motives in Russo-Chukchee relations:
    Chukchee value relations with Russians, while Russians seek reindeer meat, skins,
    and peltries; one mother says children called Chukchee offspring were paid for
    with many reindeer.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Bogoras reports no known marriages between Chukchee and Yakut, explaining
    this by saying the Yakut suffer less hunger than Russian Creoles and Tungus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The marriage rite occurs in the groom’s house if he takes the wife to himself,
    or in the bride’s house if the bridegroom becomes an adopted son-in-law.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The groom goes to the bride’s father’s house to fetch her; the bride drives
    her own reindeer and may be surrounded by relatives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Behind the tent at a sacrificial spot, a family-sledge with tent-poles is
    placed, and the bride’s and groom’s travelling-sledges stand nearby with fire-drills
    and charm-strings on them.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: A sacrificial reindeer is killed, and bloody and bloodless sacrifices are
    made to the dawn and the zenith.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The bride and groom are anointed with reindeer blood; one or two members of
    the groom’s family may also undergo the ceremony so the bride does not feel lonely,
    and the couple paint the groom’s family mark on their faces.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Afterward the woman anoints the sledges with blood, feeds the holy household
    objects with reindeer marrow, sprinkles sacrificial blood on the hearth, and addresses
    it with a blessing.
  category: action
  evidence_refs:
  - ev:8
