canonical_text:
  quote: I come as mistress to rule the hearth
  summary: 'The passage describes Yakut marriage customs: the bride arrives with goods
    and a mounted retinue; riders race as part of the wedding approach; men drink
    kumiss before the bride enters the yurta; the bride performs a fire sacrifice
    using sticks from her own yurta and butter; feasting, sleeping arrangements, hospitality,
    and gift exchange follow. It then describes former shamanic participation and
    extensive post-marriage kinitti avoidance rules governing the bride, in-laws,
    and household men, including restrictions around the hearth, speech, naming, body
    exposure, concealment, and clan exogamy.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The bride comes with cattle, meat, and other food described as gifts of the
    bride.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bride's retinue includes men riding first, a richly caparisoned horse
    carrying the richly dressed bride, and usually a skilled horseman.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: As the cavalcade nears the bridegroom's house, a rider from that house races
    the skilled horseman from the bride's party; the loser is tied to the saddle of
    the poorest girl in the bride's train and serves guests during the feast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before the bride enters the yurta, three men able to drink much kumiss are
    sent in and must drink large quantities.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The matchmaker leads the bride and her train into the yurta after the three
    men have drunk the kumiss.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A ceremony named the sacrifice to the fire is described as strictly observed,
    including by Christian Yakut.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the fire ceremony, the bride approaches the fire from the north, throws
    in three sticks from her own yurta and a piece of butter, and states that she
    comes as mistress to rule the hearth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the fire rite, the bride bows to her father-in-law and mother-in-law,
    the feast begins, and the young couple sit apart from the rest of the company.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the feast, the married pair retire to a sleeping-place prepared for
    them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: For three days the bride's gens is entertained by the groom's gens, after
    which gifts are exchanged and the bride's gens departs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage reports that formerly a shaman welcomed the bride to her new abode
    and performed a sacrifice on her behalf.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The kinitti prohibitions especially concern the wife's relations with her
    father-in-law and other older male relatives.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Under kinitti, the wife must not pass in front of the fire of her father-in-law
    and older male relatives, but must pass behind it from the north-west.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Under kinitti, the wife must avoid loud speech, double-meaning words, and
    naming her father-in-law directly; she must use periphrasis if his name is also
    a common object.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Under kinitti, the wife must not eat the head of any animal because the father-in-law
    is described as the head of the house.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: Under kinitti, when addressing her father-in-law or mother-in-law, the wife
    must draw her cap down over her eyes and must not show her hair, bare feet, or
    any part of her body before her father-in-law.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The passage reports that formerly the bride could be forbidden to show herself
    for seven years to her father-in-law, brothers-in-law, or any male relative of
    her husband.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: Formerly, the married pair lived on the left women's side of the yurta behind
    a partition, and the young woman could observe household men through a crevice
    to avoid meeting them.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:19
  text: Formerly, the young woman had to pass in or out through the pig-sty entrance
    rather than the entrance used by other inmates, and if she could not avoid a meeting
    she covered her face.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: The passage states that sometimes a bride might die without the men of the
    household having seen her features.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:21
  text: At the marriage ceremony, the bride's sister must not show her head or hair
    to the bridegroom or his male relations.
  category: action
  evidence_refs:
  - ev:10
- id: obs:22
  text: The men of the household formerly had to avoid the bride altogether and now
    must guard their language and avoid exposing certain body parts in her presence.
  category: action
  evidence_refs:
  - ev:11
- id: obs:23
  text: The bride is said to receive care and protection, sometimes doing no work
    for a year after marriage; her dowry is described as her inalienable personal
    property.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:24
  text: A Yakut usually takes his wife from another clan.
  category: relationship
  evidence_refs:
  - ev:12
