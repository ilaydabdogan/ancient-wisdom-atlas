candidate_motifs:
- id: motif:1
  label: sacrifice to fire at marital incorporation
  taxonomy_refs:
  - sacrifice
  basis: The passage explicitly names a ceremony of sacrifice to the fire in which
    the bride offers sticks from her own yurta and butter and declares her relation
    to the hearth.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage describes the act ethnographically; broader religious meaning
    beyond the described rite should not be assumed.
- id: motif:2
  label: bride claims hearth-mistress status
  taxonomy_refs: []
  basis: The bride's spoken formula states that she comes as mistress to rule the
    hearth immediately after making offerings to the fire.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not further explain the cosmological status of the hearth
    or fire.
- id: motif:3
  label: ritual marriage and household incorporation
  taxonomy_refs:
  - sacred_marriage
  basis: The passage presents a sequenced marriage ritual involving arrival, entry
    into the yurta, fire offering, bows to in-laws, feast, and the couple's sleeping-place.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  - ev:6
  confidence: medium
  cautions: The taxonomy label sacred_marriage may be broader than the ethnographic
    marriage rite described; no divine spouse or cosmic union is stated.
- id: motif:4
  label: marriage gift exchange between kin groups
  taxonomy_refs:
  - sacred_exchange
  basis: The bride brings cattle, meat, and food called gifts of the bride, and later
    the bride's and groom's kin groups exchange various gifts.
  evidence_refs:
  - ev:1
  - ev:7
  confidence: medium
  cautions: The passage treats these as social marriage exchanges; it does not explicitly
    call them sacred.
- id: motif:5
  label: liminal entry before bride enters dwelling
  taxonomy_refs: []
  basis: Before the bride enters the yurta, designated men enter first and drink large
    amounts of kumiss; only after this does the matchmaker lead in the bride and her
    train.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The function of the preliminary drinking is not explained in the passage.
- id: motif:6
  label: affinal avoidance and concealment after marriage
  taxonomy_refs: []
  basis: Kinitti imposes avoidance, speech, naming, dietary, posture, clothing, and
    bodily concealment restrictions on the wife and reciprocal restrictions on household
    men.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage describes social prohibitions; symbolic or initiatory interpretation
    is not stated.
- id: motif:7
  label: separate women's space and hidden bride
  taxonomy_refs: []
  basis: The former custom placed the couple on the left women's side behind a partition,
    with the bride observing men through a crevice and using a separate entrance to
    avoid male affines.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage does not link this spatial separation to a named mythic geography.
- id: motif:8
  label: shamanic welcome and sacrifice for bride
  taxonomy_refs:
  - sacrifice
  basis: The passage reports that formerly a shaman welcomed the bride to her new
    abode and performed a sacrifice on her behalf.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This is reported as former practice from informants; details of the sacrifice
    are not given.
