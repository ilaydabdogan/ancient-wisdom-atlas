canonical_text:
  quote: ''
  summary: The passage describes shamanic performance involving spirit voices, ventriloquism,
    drumming, spirit languages and interpreters, mischievous invisible spirits, restrictions
    on touching spirits, prophecy, and the shaman sometimes sinking unconscious while
    the soul wanders in other worlds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shaman's wife gives encouraging answers during the performance and is addressed
    by him as his supporting staff.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shaman acts differently depending on whether he has a ventriloquistic
    gift.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: For a single-bodied shaman, spirits sing and beat the drum through his body,
    with only the sound of his voice changed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For a ventriloquist shaman, the spirits appear as separate voices.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The voices imitate human, superhuman, animal, wind, tempest, and echo sounds,
    and seem to come from inside, outside, above, and underground.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A spirit may begin to talk or depart with a sound compared to a buzzing fly;
    while present it beats the drum violently and speaks in its own language.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The performance commonly involves more than one spirit and can become a dialogue;
    interpreters may be needed when the shaman does not understand the spirit-language
    being used.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Tungus shaman Mashka is described as having spirits of Koryak origin who
    spoke Koryak through him, although he reportedly did not understand Koryak outside
    the séance.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Chukchee are said to have no regular shamanist language, only a few special
    expressions.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: North-western Koryak and Asiatic Eskimo spirits are reported to use special
    pronunciations, words, or languages.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: In movable tents of the Reindeer people, mischievous spirits may overturn
    things and throw objects such as snow and pieces of ice.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The audience is forbidden to touch the spirits; the passage says the spirits
    may retaliate against the shaman or the trespassing listener.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: After preliminary intercourse with the spirits, the shaman gives advice and
    utters prophecies while still in the dark.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The shaman Galmuurgin prophesies the arrival of wild reindeer and gives specific
    instructions about strengthening attraction with an incantation and killing a
    buck with a bow and a flat rhomboid arrow point.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: After the introductory interview with spirits, the shaman sometimes sinks
    unconscious while his soul wanders in other worlds, talks with spirits, and asks
    advice.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: When shamanistic performances are connected with ceremonials, they are carried
    on in the outer room.
  category: setting
  evidence_refs:
  - ev:12
