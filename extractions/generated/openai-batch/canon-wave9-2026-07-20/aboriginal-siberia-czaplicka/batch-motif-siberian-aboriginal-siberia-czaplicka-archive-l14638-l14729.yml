canonical_text:
  quote: ''
  summary: The passage describes parts of a Keretkun ceremonial with maintained fire
    or lamp, offerings, drumming, dancing, ceremonial exchanges, a trading-dance tied
    to compound marriage, a women's day with a night-watch, and final burning of Keretkun's
    image with animal refuse cast into the sea. It then introduces Koryak sacrifices
    to a Supreme Being and to kala/Ixila, including blood offerings and seasonal animal-cult
    ceremonies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fire or, among woodless groups, a second lamp is kept burning before Keretkun
    during the three-day ceremonial; food puddings are sacrificed to him, and the
    household sings, dances, and beats the drum on the first day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The second day belongs to guests and especially shamans; in many villages
    guests bring household articles to the sleeping-room entrance and demand items
    in exchange from the mistress.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some exchanges are made only among relatives, especially marriage-partners
    in what Bogoras calls group-marriage, with wives sent to request articles and
    later equivalents.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The trading-dance involves a male member and a woman partner, a reindeer-skin
    spread under the woman’s feet, a gift after the dance, overnight pairing, and
    a reciprocal dance and gift the next day.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The third day is called the women's day; women drum and dance, and a night-watch
    is kept for Keretkun by an old man or woman, often a shaman, with the final watchkeeper
    required to be a woman.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: On the final evening a reindeer is cooked and its meat distributed; Keretkun’s
    image is burned over his lamp, and refuse from the sacrificed reindeer is cast
    into the sea as a return of game killed since the last ceremonial.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Koryak offer sacrifices to their Supreme Being for future prosperity,
    and blood from a dog or reindeer victim is sprinkled on the ground as an offering
    to Ixila or kala.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Koryak are said to have regular or seasonal sacrificial ceremonies connected
    with the cult of livelihood animals; Maritime Koryak worship sea-animals.
  category: other
  evidence_refs:
  - ev:8
