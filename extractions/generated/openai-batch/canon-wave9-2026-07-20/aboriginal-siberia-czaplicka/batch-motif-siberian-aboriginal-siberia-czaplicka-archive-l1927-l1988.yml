canonical_text:
  quote: ''
  summary: The passage summarizes Jochelson's account of Koryak blood-revenge, collective
    kin responsibility, ransom as a check on feud, family taboos, seniority in household
    and settlement authority, the elder's guardian post and shamanic associations,
    succession to family headship, women's household authority, and gendered food
    distribution.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The duty of avenging a murdered relative is described as falling first on
    male members of a consanguineous group, especially brothers, then more remote
    relatives, with father or uncle acting when brothers are absent.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Blood vengeance is described as a duty of all blood-relatives rather than
    single individuals, and a consanguineous group is described as jointly responsible
    for a murder committed by one of its members.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Old men are said to have tried to check the spread of blood-revenge through
    ransom.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Reindeer people are described as giving reindeer to the victim's family as
    ransom, while Maritime people give skins, embroidered clothes, arms, and other
    articles.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The family is described as a group bound by taboos, with the hearth, family
    drum, and fire-drill taboo to outsiders.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Seniority is said to operate in both family and settlement, with the settlement
    founder considered elder unless a stronger man appears; seniority includes age
    and physical strength.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The elder's dwelling is distinguished by a post called the guardian of the
    settlement.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The elder is described as often having many wives and children, receiving
    respect that extends to his family after death, and sometimes possessing shamanistic
    powers or keeping a shaman helper.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The father is described as head of the Koryak family; after his death, a brother,
    eldest son, or adopted son-in-law married to the eldest daughter may take his
    place.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The mother is described as head of household affairs; if she is absent, the
    role may pass to the wife of an adopted son-in-law or to the wife of the eldest
    son.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Men are said to receive the best pieces of food, while women receive what
    is left over; among Reindeer Koryak, only men sit around the served food.
  category: action
  evidence_refs:
  - ev:9
