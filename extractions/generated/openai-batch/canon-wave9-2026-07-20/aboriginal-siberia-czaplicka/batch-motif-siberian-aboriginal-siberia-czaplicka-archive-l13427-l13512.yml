    journey narrative.
- id: motif:2
  label: primordial age of permeable categories
  taxonomy_refs: []
  basis: Big-Raven's time is described as an era with no sharp distinction between
    men, animals, and objects, and with visible transformation between states.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The passage summarizes belief material rather than narrating a full myth
    episode.
