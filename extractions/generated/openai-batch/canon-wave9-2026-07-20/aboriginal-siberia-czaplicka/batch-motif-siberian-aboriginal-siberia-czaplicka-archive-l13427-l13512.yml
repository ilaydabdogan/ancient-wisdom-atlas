comparison_claims:
- id: claim:1
  claim: The passage itself compares the ancient days of Big-Raven to the Arunta age
    of Alcheringa as a comparable primordial period.
  claim_level: same_function
  target: Arunta age of Alcheringa
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is explicitly stated but not elaborated; the passage
    supplies no Arunta details beyond the name Alcheringa.
- id: claim:2
  claim: Jochelson is reported as treating clothing-based transformation of men into
    women and women into men as closely related to the broader transformation-by-covering
    idea group.
  claim_level: same_function
  target: transformation by wearing a skin, object-shaped covering, or gendered clothing
  evidence_refs:
  - ev:2
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The relationship is attributed to Jochelson's view and is not expanded
    with examples in the passage.
- id: claim:3
  claim: A footnote cites Chukchee possession of five or six souls and says many North-American
    Indians have a similar belief, making a cautious parallel to the multiple-soul
    pattern.
  claim_level: same_motif
  target: multiple-soul beliefs among Chukchee and many North-American Indians
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The footnote gives only a brief comparative statement and no detailed
    ethnographic comparison.
- id: claim:4
  claim: A footnote says the Yukaghir belief in three souls is borrowed from the Yakut,
    indicating a reported historical-contact explanation for a multiple-soul belief.
  claim_level: historical_contact
  target: Yukaghir three-soul belief and Yakut three-soul terminology
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: low
  limitations: The passage reports the borrowing claim secondhand and gives no supporting
    argument or context.
