canonical_text:
  quote: only the shamans can pass from one world to another
  summary: The passage describes shamanic passage between worlds, an ancient Big-Raven
    era when ordinary people could cross worlds and transform, anthropomorphic souls
    in natural phenomena and objects, concealed living essences in household things,
    Koryak ideas about souls, death, soul-loss, shamanic soul return, and the post-mortem
    division of soul paths. It also gives brief comparative notes on Alcheringa, clothing-related
    gender transformation, multiple souls, and Kamchadal names for a Supreme Being.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At present, only shamans can pass from one world to another; in the ancient
    days of Big-Raven, ordinary people could do so.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Luminaries, wind, fog, other natural phenomena, and imaginary phenomena are
    said to have anthropomorphic souls, and wooden images of spirits have human faces.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the time of Big-Raven, men could transform into animals or inanimate objects
    by putting on an animal skin or a covering shaped like the desired form.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Big-Raven's time, the passage says there was no sharp distinction between
    men, animals, and other objects; later the transformations ceased to be visible
    to ordinary people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Shamans can see the kalau and observe transformations of objects, and they
    can transform themselves either by order of spirits or according to their wishes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Visible inanimate objects are described as concealing a living anthropomorphic
    essence.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Household utensils, implements, parts of the house, the chamber-vessel, and
    excrement are said to have their own existence; household effects guard the family,
    warn their masters, and attack enemies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The voice of an animal, drum sounds, and human speech are described as having
    existence independent of the things that produce them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Jochelson is reported as thinking that transformations of men into women through
    women's clothes, and the reverse, are related to the same group of ideas about
    transformation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage gives a word for soul and mentions a possible secondary vital
    principle associated with breathing and shadow.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says there is no very sharp line between life and death, and that
    a corpse may arise if it is not watched.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Death is explained as the chief soul leaving the body after an attack by kalau,
    or as kala pulling the soul from the body and freeing it to go to the sky.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The soul of a deceased person does not leave the earth at once, but hovers
    above the corpse and is compared to a flame.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: During illness the soul is outside the body; it hovers lower in slight illness
    and higher in severe illness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: A powerful shaman is believed able to bring the soul back to the body of a
    person recently dead.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: When the deceased person's soul rises to the Supreme Being, the deceased and
