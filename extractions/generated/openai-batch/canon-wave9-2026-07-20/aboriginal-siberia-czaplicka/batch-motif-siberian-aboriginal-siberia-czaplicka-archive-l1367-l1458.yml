canonical_text:
  quote: ''
  summary: The passage describes Chukchee social rules and narrative patterns concerning
    murder, blood-revenge, camp authority, the role of the strong man or ermecin,
    a Valkalen incident involving Canla's control over trade, former slavery, and
    the replacement of a slain person by a man from the murderer's family. It also
    notes that the strong man appears as a hero in Chukchee war epic and that Chukchee
    tales favor single combat over night attacks.
  language: English
  quote_policy: summarized
