- id: obs:1
  text: Some killings are described as arising from material interests or anger rather
    than from punishment of a bad man; one rich reindeer-breeder killed his wife and
    paid a heavy fine to her brother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Blood-revenge is assigned first to paternal relatives of the slain, then to
    maternal relatives if needed, and also to certain friends, especially group-marriage
    companions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each camp is said to have a strong man, sometimes also a violent man; the
    strong man may be master of the camp.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Valkalen, Canla offered seal blubber and promised peltries for a white
    Russian bitch; after the owner refused because the peltries were absent, Canla
    stopped village traffic until the dog was handed over, and later delivered the
    peltries.
  category: sequence
  evidence_refs:
