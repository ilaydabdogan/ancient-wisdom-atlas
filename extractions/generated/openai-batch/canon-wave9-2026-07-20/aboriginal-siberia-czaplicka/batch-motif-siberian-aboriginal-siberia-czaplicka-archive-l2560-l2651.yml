canonical_text:
  quote: ''
  summary: The passage first lists Yukaghir affinity-relative terms, then describes
    Gilyak clan organization. It explains Gilyak clan identity through shared affinity
    relations, marital duties, ancestry, and especially a common fire. The common
    fire is described as a symbol of clan unity, overseen by an old-woman fire owner
    who mediates between living clansmen and departed ancestors. Rules govern who
    may kindle or remove fire, and a clan firebrand is used in the bear festival and
    divided when a clan formally splits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Tundra Yukaghir and Kolyma Yukaghir, named terms designate a class
    of relatives by affinity involving spouses of a wife's or husband's siblings or
    cousins.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Gilyak clan is called Tihal, glossed as literally meaning “foot-sack”
    used in travelling.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Gilyak explanation of relatedness lists shared ahmalk, ymch, fire, mountain-men,
    sea-men, sky-men, earth-men, bear, devil, tlnisind, and sin.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Under common ahmalk, the father-in-law or son-in-law of one clansman is treated
    as the father-in-law or son-in-law of the whole clan.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says men are the permanent element in the Gilyak clan, while women
    leave the clan or enter it from another clan.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Gilyak clan is described as a union cemented by shared rights and marital
    duties, taking wives from another group and giving women in marriage to a third
    clan.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage describes Gilyak clans as exogamic and patriarchal, while also
    saying that Gilyak people are related through their mothers and a common father-in-law
    clan.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sternberg is reported as saying that a man taking his wife from his mother's
    clan is a religious principle connected with ancestor cult and especially mother-cult.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a clansman dies, one of his brothers, chosen by the clansmen, is bound
    to assume the rights and duties of father and husband toward the widow and children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says clans may adopt individuals or groups from other clans or
    tribes to prevent extinction.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: If two men married sisters, they could be regarded as fellow clansmen, and
    their children could be considered brothers and sisters.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The common fire is explicitly described as a symbol of the unity of the Gilyak
    clan.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The chief owner of the fire is imagined as an old woman and described as a
    good spirit who gives the use of fire to living clansmen.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: The owner of the fire is described as an intermediary between living clansmen
    and departed ancestors, who are called heroes of the clan.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The dead are given to the owner of the fire by being burned, and some may
    be chosen to become owners of the clan-fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: People killed by lightning or by burning are said in a note to be worthy of
    reception into the society of the owners of the fire.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: Only a clansman has the right to kindle fire on a fellow clansman's hearth
    or take fire out of his yurta.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: An outsider who lights his pipe in the yurta must finish smoking it before
    leaving; violating the fire rules brings misfortune on the clan and may require
    a fine.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: Each clan has its own firebrand, kept by the eldest of the clan.
  category: object
  evidence_refs:
  - ev:10
- id: obs:20
  text: Only the clan firebrand may be used to make the fire on which bear meat is
    cooked at the bear festival.
  category: action
  evidence_refs:
  - ev:10
- id: obs:21
  text: When a clan divides, the eldest breaks the firebrand in two and gives half
    to the eldest of the departing portion; only then is the clan regarded as formally
    divided.
  category: sequence
  evidence_refs:
  - ev:10
