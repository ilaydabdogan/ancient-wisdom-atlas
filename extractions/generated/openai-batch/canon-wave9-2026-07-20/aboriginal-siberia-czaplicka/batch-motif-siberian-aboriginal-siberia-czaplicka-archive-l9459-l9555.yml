literal_observations:
- id: obs:1
  text: A father-shaman dips a birch-broom into water and beats the candidate on the
    naked back; the nine “sons” of the father-shaman do the same.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father-shaman instructs the candidate to ask little from poor or rich
    callers, to care for and help the poor, to pray that gods defend them from evil
    spirits, and to go first to the poor if summoned by both poor and rich; the candidate
    repeats and promises to observe the precepts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A libation of farasun to guardian spirits closes the ceremony described at
    the start of the passage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that a shaman is purified by water at least yearly, sometimes
    monthly at the new moon or after defilement, and that especially gross defilement
    is purified with blood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first consecration is called kherege-khulkhe; its expenses are shared
    by the community, and a father-shaman with nine “sons” is chosen again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The father-shaman, nine “sons,” and novice ride from yurta to yurta collecting
    offerings, including votive handkerchiefs tied to a birch staff carried by the
    novice, and sometimes money.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the day before the consecration, the “sons,” under the father-shaman’s
    direction, cut birches from a grove where the dead of the ulus are buried, make
    horse-staves from the straightest birches, and offer mutton and tarasun to the
    spirits there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The stoutest birch, with roots still attached, is planted in the south-west
    corner of the yurta where the ground is bare for the fire, and its top projects
    through the smoke-hole.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that this principal birch symbolically represents a porter-god
    who allows the shaman ingress into heaven, points the way to the sky, and remains
    as a sign that the dwelling belongs to a shaman.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Other birches and posts are planted outside the yurta in an ordered west-to-east
    arrangement, including a birch with tarasun and colored ribbons, a birch with
    a bell and sacrificial horse, a birch the novice must climb, groups of saplings
    with ribbons and animal skins, posts for sacrificial animals, and birches for
    the animals’ bones.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Red and blue ribbons lead from the principal birch inside the yurta to the
    outside birches; the passage identifies them as a symbolic representation of the
    shaman’s path to the spirit-world.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Nine pots for cooking sacrificial meat are placed north of the row of birches.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Participants put on ceremonial dress; the shaman’s accessories are blessed;
    the horse-staves are said to turn into real horses; shamans summon spirits and
    sprinkle tarasun; the father-shaman invokes guardian gods, and the novice repeats
    after him.
  category: sequence
  evidence_refs:
  - ev:8
