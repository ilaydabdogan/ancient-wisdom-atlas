canonical_text:
  quote: ''
  summary: The passage summarizes reported Siberian and Far Eastern pathological categories
    and customs. It notes Gilyak and Ainu mythic references to women with a sexual
    disorder whose husbands die early; describes melancholia; and gives an extended
    account of Chukchee voluntary death, including causes, kin-assisted killing, ritual
    formulae heard by spirits, pre-death treatment, relation to Icelet evil spirits,
    a privileged afterlife on the aurora borealis, and hereditary imitation of a father's
    death. It also notes neighboring Arctic parallels and concludes that women and
    shamans are especially prone to the ailments under discussion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that Gilyak and Ainu myths contain references to women
    afflicted with the named sexual disorder and to husbands of such women dying early.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Melancholia is described as apathy, indifference, eating little, and unrhythmic
    movement.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Voluntary death is described as a regular Chukchee custom explained by disease,
    helplessness, deep sorrow after a relative's death, quarrels at home, or taedium
    vitae.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Young people in such cases usually commit suicide, while mature or old people
    may be killed by a near relative at their own request.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Three methods of voluntary death are listed: stabbing with a knife or spear,
    strangulation, and shooting.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before the killing, a formula is pronounced; after it, retreat is impossible
    because spirits have heard the promise and will punish violation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before the last hours, the person is treated with fat meat and alien food,
    and all wishes are fulfilled.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Death at the hands of a son is said not to be painful, while death inflicted
    by a stranger is said to be very painful.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Natural death is described as the work of Icelet evil spirits; voluntary death
    is described as freeing oneself from their malevolence and as a sacrifice to them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: People who die by voluntary death are said to have the best future-life abode,
    dwelling on the red blaze of the aurora borealis and playing ball with a walrus
    skull.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says this kind of death can be hereditary in the sense of imitating
    a father's manner of death, and gives a case in which both father and son were
    stabbed and then strangled.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The notes report related practices or lawful killing of aged parents among
    Koryak, Central Eskimo, Maritime Chukchee, and Eskimo groups, with varying frequency.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage states that women are especially prone to these ailments and that
    shamans have a certain susceptibility to them.
  category: attribute
  evidence_refs:
  - ev:10
