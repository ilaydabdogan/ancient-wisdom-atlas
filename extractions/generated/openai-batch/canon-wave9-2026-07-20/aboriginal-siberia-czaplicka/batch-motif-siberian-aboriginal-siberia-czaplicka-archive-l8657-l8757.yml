canonical_text:
  quote: ''
  summary: The passage discusses reports on Kamchadal shamanism, including annual
    communal ceremony roles held by old men, claims that old women and loekchuch or
    Koekchuch could act as witches, dream interpreters, and shamans, and debate over
    whether professional shamanism existed among them. It then describes the shaman's
    vocation more generally as involving inspiration, nervous illness or paroxysms,
    withdrawal to the wilderness with hunger and cold, recovery through accepting
    the call, and relations with spirits as protectors or servants. The call may manifest
    through an animal, plant, or other natural object.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
