- id: obs:5
  text: Jochelson reports that Kamchadal shamanic practice was said to lack special
    shaman garb and drum use, relying instead on incantations and divination.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The author argues that professional shamanism seems to have existed in germ
