canonical_text:
  quote: ''
  summary: An ethnographic passage classifies several Siberian and northern Eurasian
    shamanic roles. It contrasts Buryat white and black shamans, notes mixed or non-strict
    classifications among Buryat, Samoyed, and Lapp practitioners, and describes Votyak
    shamanic hierarchy, sacrificial roles, sorcerers, and the education of the tuno
    by the Creator.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Buryat are said to classify shamans as white and black.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Buryat white and black shamans are said to fight each other by hurling axes
    across distances of hundreds of miles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Buryat white shaman serves western spirits named in the passage and has
    charge of ceremonies such as birth and marriage; he wears a white coat and rides
    a white horse.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Barlak of the Balagansk district is named as a famous white shaman whose descendants
    still worship at his grave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Buryat black shaman serves eastern spirits named in the passage and is
    said to have power to bring illness and death; such shamans are feared and sometimes
    killed.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The grave of a black shaman is described as usually shaded by aspens, with
    the body fastened to the earth by a stake taken from that tree.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: A few Buryat shamans are reported to serve both good and bad spirits at the
    same time.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Samoyed shamans are described as not divided into distinct black and white
    classes, and Lapp noyda are described as lacking a strict good/bad division, though
    some are called Big and others Little.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Votyak hierarchy is said to have arisen from white shamans, and the tuno
    is described as chief of the shamans and upholder of the old religion.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The soul of a tuno is said to be educated by the Creator, and the profession
    and knowledge of a tuno usually descend from father to son though they may also
    be acquired.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Votyak shamans are classified as permanent or temporary; temporary shamans
    are chosen to perform a particular sacrifice, and secondary priests are appointed
    by the tuno.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The former Votyak black shaman is described as having become an ordinary sorcerer
    called pellaslds, able to aid the sick and find lost cattle by incantations without
    connection to deities; another sorcerer, the vedin, is feared and hated.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: After educating the tuno, Kijlclim-Inmar the Creator takes the pupil to candidates
    for sorcery, examines them, and gives satisfactory candidates permission to enchant
    and destroy men.
  category: sequence
  evidence_refs:
  - ev:8
