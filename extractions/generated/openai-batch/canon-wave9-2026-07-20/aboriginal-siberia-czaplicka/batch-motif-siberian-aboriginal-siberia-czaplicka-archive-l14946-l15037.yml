canonical_text:
  quote: ''
  summary: The passage describes an Altaic/Siberian shamanic ceremony in which a kam
    prepares a ritual space with a notched birch, summons spirits into a tambourine,
    ritually pursues the soul of a sacrificial horse while mounted on a goose-like
    effigy, kills the horse, feeds and invokes spirits, offers garments to Yulgen,
    and performs a dramatic pilgrimage to Bai-Yulgen in heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ritual spot is chosen in a birch thicket in a meadow; the kam erects a decorative
    yurta and plants a young birch crowned with a flag, with lower branches lopped
    off and nine notches cut as steps.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The yurta is surrounded by a penfold, and a birch-stick with a horsehair noose
    is set by its entrance.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A holder of the head of the sacrificial horse is chosen; the kam flourishes
    a birch twig over the horse to indicate that its soul is being driven to Bai-Yulgen's
    abode, accompanied by the holder's soul.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The kam calls spirits by name, answers for each arriving spirit, and makes
    motions as if taking them into his tambourine.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The kam mounts a goose-like scarecrow, flaps his arms like wings, chants skyward
    ascent words, and produces the goose's replies himself.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Still on the feathered steed, the kam pursues the pura, or soul, of the sacrificial
    horse, imitates the victim's neighing and struggles, drives it toward the penfold
    and noose, then recaptures and fumigates it with juniper.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The real sacrificial horse is brought, blessed, and killed by opening the
    aorta; its bones and skin are the actual sacrifice, while the flesh is eaten by
    those present.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: On the second day after sunset, a religious drama is performed describing
    the kam's pilgrimage to Bai-Yulgen in heaven; a fire burns in the yurta.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The shaman feeds the lords of the tambourine with meat from the offering and
    sings an invocation to Kaira Khan.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The owner of the fire is addressed; the kam imitates invisible guests drinking
    and distributes morsels of meat to the company, who eat them as representatives
    of unseen spirits.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Nine garments on a ribboned rope are described as the host's offering to Yulgen
    and are fumigated with juniper while the shaman sings about heavy gifts and Prince
    Yulgen.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: The kam dons his shaman's garment, fumigates and strikes his tambourine, summons
    many spirits, and invokes the Merkyut birds of heaven with brass talons, a copper
    moon-claw, and an ice beak.
  category: action
  evidence_refs:
  - ev:12
