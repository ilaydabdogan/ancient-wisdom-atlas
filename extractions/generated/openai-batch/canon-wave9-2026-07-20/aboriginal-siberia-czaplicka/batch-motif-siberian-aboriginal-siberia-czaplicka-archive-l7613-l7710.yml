canonical_text:
  quote: ''
  summary: The passage describes several afterlife locations and death customs, including
    compass-direction worlds for sacrifices, a water world, auroral and lower-sky
    abodes of particular dead, Koryak ideas about multiple souls, death by attacking
    spirits, possible shamanic revival, underground villages of the departed with
    dog guardians, offerings on funeral pyres, and mortuary handling of the corpse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Worlds are described as existing in each compass direction as receiving places
    for sacrifices, with an additional separate world under the water.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sacrificed animals are said to meet the dead in the other world and to form
    large herds belonging to them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Aurora Borealis is described as an abode for people who died suddenly
    or violently, with different visible spots or rays associated with different deaths
    and with deceased people running and playing ball with a living walrus-head.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Deceased women who had no husbands are said to go to a separate world in the
    lower sky, where they catch reindeer with nooses and nets.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Among the Koryak, a person is declared dead when breathing ceases; this is
    explained as the chief soul leaving the body after being attacked by the kalau,
    though death may also be sent by Supreme Beings.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage names a chief soul, a soul called breath, and another called shadow.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: When the Koryak say the kala eats the soul, the passage explains this as the
    spirit eating human flesh, especially liver, while the visible body remains untouched
    until burning.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The soul is said not to leave the earth immediately, but to wander for some
    time, and a very clever shaman may bring it back.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A reported Koryak account says a man was brought back to life by a shaman
    after one death and lived for some years before a second death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: One Koryak conception says a soul may rise to the Supreme Being, while another
    soul goes to the underground world of the peninelau, or people of ancient times.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The peninelau are said to live in underground villages in a manner similar
    to earthly life, and a newcomer finds a place among relatives.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Dogs guard the entrance to the underworld; a person who beat his dog on earth
    may be stopped by them, but may carry fish fins in his mittens to propitiate the
    guardians.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Formerly, communication between the underground world and the earth was said
    to be easier; at a corpse-burning people placed presents for relatives on the
    same pyre.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage states that in olden times children killed aged parents, that
    the Koryak custom is now abandoned, and that it still prevails among the Chukchee.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: After death, messengers spread the news, villagers make incantations for protection,
    and a relative holds the dead person's head until all inhabitants have been informed.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: A funeral garment is secretly made during life and must not be shown or finished
    before death, because doing so is said to hasten death.
  category: object
  evidence_refs:
  - ev:13
- id: obs:17
  text: The body is taken out and burned within three days at most; until this happens,
    relatives behave as if the person were alive and may not show sorrow.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:18
  text: In dressing the corpse, the cap may be placed front to back, and Reindeer
    Koryak take the dead out under the edge of the tent-cover rather than through
    the usual door.
  category: action
  evidence_refs:
  - ev:14
