canonical_text:
  quote: ''
  summary: The passage discusses Siberian shamanism in relation to sex and social
    classification. It describes an idea of a divine two-sexed shaman or Supreme Being
    in some Neo-Siberian/Altai contexts, supernatural capacities attributed to shamans,
    the shaman as a third social class outside ordinary male and female categories,
    mixed taboos and costume, sex change among 'real shamans,' and comparative explanations
    involving ritual, social status, and contagion beliefs.
  language: English
  quote_policy: summarized
