canonical_text:
  quote: ''
  summary: Ethnographic description of Tungus, Turkic, Altaian, and Kirgis social
    organization, including clan territories, nested clan-tribe-nation structures,
    Altaian seok kinship terms, a maternal-uncle hair-cutting and gift custom for
    boys at age seven, Kirgis mythical ancestry and watchwords, and clan responsibility
    in blood-vengeance cases.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Tungus clans have assigned regions where members may wander and where
    strangers are not allowed to settle.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wandering Tungus tribes move throughout the year without special clan districts
    and keep to irregular riverine tracts without definite frontiers.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: For the Turkic tribes described, the clan is the social unit; clans join into
    larger groups, tribes, and nations, each nation claiming descent from a common
    ancestor.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says Turkic tribal elders were formerly elective and their authority
    was limited by a tribal assembly and a council of clan elders.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Altaian clans are called seoks, glossed as Russian 'bones' or as 'generations';
    the number twenty-four is reported by Potanin as possibly having mystical significance
    rather than representing the actual number of groups.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Members of one seok consider themselves related and address one another with
    kinship terms based on relative age, gender, and paternal or maternal side.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Until age seven, a boy wears his hair in two front tresses; on his seventh
    birthday his maternal uncle calls him, cuts off the tresses, and is expected to
    give him a horse.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: If the maternal uncle fails to give the expected horse, the boy's family may
    demand fulfillment through tribal authority.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Among the Kirgis, the passage says Mohammedanism has destroyed much of the
    religious side of culture except the cult of the hearth, while clan organization
    remains fairly strong.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Kirgis of the three ordas count the mythical Alash-Khan as tribal ancestor
    and use Alash as a watchword; each clan also has a special ancestor-name watchword,
    insignia, and genealogy.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Potanin is reported as speaking of Kotan as founder of the Kirgis nation and
    of Kotan's three sons as originators of the three ordas.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: In Kirgis blood-vengeance cases, the injured clan collectively exacts the
    penalty, and the aggressor's clan collectively assumes guilt.
  category: action
  evidence_refs:
  - ev:11
