canonical_text:
  quote: ''
  summary: The passage describes Yakut accounts of sky and underworld beings, including
    Ulu-Toyon and classes of abassylar; owner-spirits called ichchi that inhabit or
    control objects and places; directional and vertical divisions of the universe;
    and Yakut doctrines of human soul-components received from life, body, psyche,
    earth, air, and mother. It also notes a brief comparison with Altaian concepts
    of tyn and kut.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Information about the clan arrangement of sky-gods is said to be easier to
    obtain than information about underworld gods, because few ordinary people know
    about them and shamans fear betraying their secrets.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ulutuyer-Ulu-Toyon, also called Ulu-Toyon, is described as chief of the dark
    spirits, living in the western sky, and associated with action and passions.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ulu-Toyon is not always harmful to humans; the passage says he gives humans
    one soul, silr, and defends them from attacks by ahassylar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some accounts describe Ulu-Toyon as the highest active supernatural power,
    while others describe him as a dark spirit and ruler of the abassylar, contrasted
    with Art-Toyon-Aga as ruler of the aiy in the eastern sky.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The abassylar are divided into Upper, Middle, and Lower groups living respectively
    in the western sky, on earth, and in the subterranean world; all are described
    as harmful to humans.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ichchi literally means owner and refers to owner-spirits of objects and places
    such as rivers, lakes, stones, parts of such objects, movable objects, and objects
    that make sounds.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ichchi are said not to belong either to the aiy or the ahassylar, although
    many are harmful; Kurar-Ichchi, the owner of the wind, is treated by many writers
    as a black spirit.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Misfortunes to carts or equipment during difficult journeys are attributed
    to local ichchi, who must be placated by sacrifices.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: During journeys the Yakut use special language, nicknames, and Russian names
    for valued objects so that ichchi will not know what is being referred to and
    will not harm those objects.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'The Yakut division of the universe is described mainly as horizontal: east
    and south are habitations of good spirits, while west and north are habitations
    of evil spirits.'
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: A great evil spirit named Allara-Ogonior, glossed as Underground-Old-Man,
    is said to live in the far north.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: A vertical division into upper, middle, and lower worlds is also described,
    but the passage says it is less precise and less important than the horizontal
    division because evil spirits occur in all three worlds.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Yakut believe that a human is composed of tyn, meaning life or breath;
    kut, the physical soul; and silr, the psychic soul.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Tyn is common to humans, animals, and plants; kut is common to humans and
    animals and consists of earth-soul, air-soul, and mother-soul.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: A Yakut woman is delivered on bare ground inside the yurta because the earth-soul
    is believed to be communicated to the infant from the earth at birth; the air-soul
    comes from air shortly afterward, and the mother-soul comes from the mother.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage reports Troshchanski's view that kut is one soul composed of three
    elements, and notes the belief that fishes have no kut because they are cut off
    from air and earth and are not viviparous.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: The passage states that Altaians also have a conception of kut, but that theirs
    does not include the three Yakut elements.
  category: relationship
  evidence_refs:
  - ev:10
