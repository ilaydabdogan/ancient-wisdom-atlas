canonical_text:
  quote: ''
  summary: The passage describes Gilyak clan law, clan-specific taboos, compensatory
    payments, limited clan authority, affinal alliances, hospitality obligations,
    ritual and gift exchanges, and a sacrifice-feast sequence associated with restored
    inter-clan friendship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage opens with a sequence in which unnamed persons connected with
    two clans are killed and offered as a sacrifice to a lord-avenger; a feast follows,
    a thusind is paid, and friendship between the clans is re-established.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Gilyak are described as having common religious and social laws, plus
    clan-specific prohibitions whose breach constitutes a sin for that clan only.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage lists sexual prohibitions, speech taboos involving the wife’s
    mother and aunts, and clan-cult taboos among the relevant prohibitions.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Breaking clan-cult taboos entails payment of thusind to a god or, if the breaker
    belongs to another clan, to the offended clan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Failure to perform religious duties is treated as sin, and an individual’s
    sin is described as detrimental to the whole clan.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Clansmen prefer to live together, but territorial groups do not always correspond
    to clans; in such mixed groups each clan has its own special rights.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Clan names are generally said to be names of former localities, with some
    animal-derived clan names chiefly where Tungus admixture is present.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Chinese and Russian authorities tried to impose rulers on Gilyak clans, selecting
    a village elder rather than a clan elder; the passage says this opposed Gilyak
    ideas of government.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the described Gilyak organization, old men decide questions of cult and
    clanship because they preserve clan customs, traditions, and genealogies, but
    they do not have broad despotic authority.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Men called yz or nrdlanmikhi have important but unofficial standing through
    wealth, physical prowess, or accomplishment and may be called on to uphold customary
    law; the clan as a whole remains supreme over them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Clans connected by marital ties form friendly alliances that include hospitality
    or feeding obligations, especially toward sons-in-law.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: A friendship-making custom with an ymgi includes treading upon the threshold
    and exchanging gifts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The solidarity of the affinally allied group appears in bear-hunting, sable
    trapping, hunting sea-animals, and hereditary rites exchanging iron and fur shagund,
    with iron shagund later returned as halym.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Sternberg’s explanation quoted in the passage derives halym from a compensatory
    thusind paid after an illegal marriage outside the expected affinal clan, with
    the clan-gods propitiated by it.
  category: other
  evidence_refs:
  - ev:8
