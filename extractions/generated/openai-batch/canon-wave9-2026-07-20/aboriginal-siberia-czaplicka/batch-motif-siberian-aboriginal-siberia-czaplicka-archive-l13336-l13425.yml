canonical_text:
  quote: ''
  summary: 'The passage describes Koryak accounts of kalau/lala spirits: their names,
    forms, dwellings, powers, hostility to humans, relation to Big-Raven and his children,
    alternative accounts of their dispatch to humans, ambivalent uses of the term
    for some guardian spirits, and a five-world cosmology with upper and lower worlds.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Evil spirits are named as kalau/lala in the passage, and are said to have
    been visible to men in the time of Big-Raven but usually invisible now.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The evil spirits are represented as numerous beings living in communities
    like humans, able to change size, and sometimes indistinguishable from ordinary
    cannibals.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When visible, the spirits can appear as animals, dogs with human heads, or
    human beings with pointed heads.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Their arrows have mouths, can be shot without a bow, and fly wherever they
    are sent.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: Some kalau live underground and enter human houses through the fire on the
    hearth; others dwell on the earth in the west.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Kalau are divided into Maritime and Reindeer groups, with some living in forests
    and others in tundra; humans are described as the spoils of their chase, comparable
    to reindeer and seals for human hunters.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A special class of kalau is associated with diseases, and prominent disease
    spirits have special names.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says the Koryak do not have a generic class-name for good spirits,
    while Big-Raven and his children appear as natural enemies of the kalau.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Big-Raven is described defeating or neutralizing kalau by causing them to
    sleep, removing their cannibal stomachs and replacing them, burning them on heated
    stones, smothering them in a steam bath, using incantation, and receiving an iron
    mouth that catches their arrows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that Big-Raven primarily defends himself and his family,
    while men are left to their own resources against evil spirits, diseases, and
    death.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Alternative accounts say the Supreme Being sends kalau so humans may die,
    the Master-on-High sent them down after a quarrel, Big-Raven sent them so people
    could test incantations, and dead ancestors send them from underground to punish
    young people for night games.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The word lala/lalak/lamal can also name guardian spirits of shamans, villages,
    families, or individuals, not only harmful spirits.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: 'Koryak cosmogony is summarized as five worlds: two above the earth, earth,
    and two below; the uppermost is the seat of the Supreme Being, the next has Cloud-People,
    the nearer lower world is the dwelling of the kalau, and the lowest is the abode
    of shades of the dead.'
  category: setting
  evidence_refs:
  - ev:9
