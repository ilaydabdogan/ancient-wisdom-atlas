canonical_text:
  quote: ''
  summary: The passage describes social organization among Kobdinsk Uriankhai, Kalmuk,
    and Buryat groups, including administrative offices, clan and lineage structures,
    status categories, descent traditions from named heroic or royal ancestors, and
    Buryat clan-unifying events such as cooperative hunts and the tailgan festival.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kobdinsk Uriankhai are described as Turki in origin, using a Mongolic
    dialect, and identifying with the old Western Mongolic branch of the Oliut.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kobdinsk Uriankhai are said to have no hereditary rulers, to be governed
    by two officials called ombo, and to be divided into ten sumyns.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kalmuk social organization is described as a hierarchy from individual family
    tents to related tents, aimaks, clans, uluses, and tribes, with named elder offices
    at some levels.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kalmuk tribal elder was formerly elected at a general tribal assembly,
    and the result was announced by placing the chosen man on a sheet of felt called
    koshma.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Candidates for Kalmuk tribal elder had to be in direct descent from the clan
    of Djingis-Khan, giving one clan precedence over others.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Descendants of the privileged clan are called white-bones, while other clans
    are called black-bones; noble ladies are called white-flesh and common women black-flesh.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Kalmuk office of tribal elder is described as no longer elective but hereditary,
    passing through the male line.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Buryat are described as a branch of the Eastern Mongols with traditions
    of descent from ancient Oyrat, from named heroes, and in one case from Djingis-Khan.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Buryat clans and administrative groups are described as having elders called
    shelenga and taysha.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Buryat cooperative hunt is described as a clan-unifying event involving
    members of one or several allied clans, sometimes lasting several months.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The cooperative hunt is led by a tubuchi, obeyed by everyone, and also includes
    galshas who look after fire and food, two guides called gazarish, and other assistants.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The tailgan is introduced as another important social event preserving clan
    unity, but its details are not included in this passage segment.
  category: other
  evidence_refs:
  - ev:8
