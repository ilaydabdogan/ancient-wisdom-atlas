candidate_motifs:
- id: motif:1
  label: Open sky door and granted petition
  taxonomy_refs: []
  basis: The passage describes a door in the visible sky whose opening allows a person
    who sees it to obtain whatever is then asked from heaven.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not describe a human ascent through the door; it describes
    sight, petition, luck, and heavenly response.
- id: motif:2
  label: Directional and color-coded spiritual duality
  taxonomy_refs:
  - duality
  basis: Western or white beings are associated with protection, healing, and aid,
    while eastern or black beings are associated with mischief, black smiths, and
    evil-spirit dungeons.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage also notes communication between eastern and western Ihats
    and identifies some eastern-associated cow Ihats as not subject to eastern power,
    so the opposition is not absolute.
- id: motif:3
  label: Sacred exchange through offerings, sacrifice, and prayer
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The passage describes tea offerings to tea spirits, sacrifice to the sea
    hostess, harvest rites for an earth owner, and a prayer requesting protection,
    fertility, food, light, and removal of evil.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage gives examples of ritual address and offering but does not
    narrate a single completed exchange episode.
- id: motif:4
  label: Landscape animated by owners and keepers
  taxonomy_refs: []
  basis: Every landscape feature is said to have an owner, with examples including
    water spirits in lakes and rivers, a harmful forest owner, mountain and sea keepers,
    and wilderness gods addressed in prayer.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: No specific taxonomy reference for generalized landscape ownership was
    supplied beyond individual symbols such as mountain and water.
- id: motif:5
  label: Spirit transmission of smithcraft
  taxonomy_refs:
  - wisdom
  - culture_hero
  basis: White smiths are said to have given humans knowledge of their art, and eastern
    tengeri are said to have taught smithcraft to the first black smith on earth.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: medium
  cautions: The figures are smith spirits and first smiths rather than a fully narrated
    culture-hero cycle; the culture_hero mapping is functional and should be reviewed.
- id: motif:6
  label: Afterlife dungeon under spirit rule
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage maps postmortem placement of the greatest black shamans to Khalga
    and describes conditions for a soul leaving that dungeon, as well as a second
    dungeon controlled by Erlen-Khan.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage gives locations and governance but not a detailed journey
    itinerary.
- id: motif:7
  label: Sky-fallen sacred stones
  taxonomy_refs: []
  basis: Two large white stones are believed to have fallen from the sky and are worshipped.
  evidence_refs:
  - ev:11
