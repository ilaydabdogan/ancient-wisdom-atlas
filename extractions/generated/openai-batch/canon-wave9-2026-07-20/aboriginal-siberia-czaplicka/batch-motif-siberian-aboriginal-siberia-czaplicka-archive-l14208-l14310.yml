canonical_text:
  quote: ''
  summary: The passage describes Buryat beliefs about western and eastern spirits,
    a sky door, benevolent and harmful nature owners, prayers and offerings to such
    beings, white and black smith spirits, spirit dungeons for the dead, disease owners,
    and sky-fallen white stones that are worshipped.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Buryat are described as believing that the visible sky has a door through
    which western tengeri look down; when they see misfortune, they send their children,
    called Ihats, to aid humans.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who sees the sky door open is said to become very lucky, and requests
    made to heaven at that moment are granted; glory falls on the earth while the
    door is open.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Khan-Shargan-Noyon and Bukha-Noyon-Babai are named as the most important western
    Ihats.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kudinsk Buryat know benevolent spirits called satim-burkhat, described
    as tutelary spirits of tea-planting who receive tea offerings rather than tarasim.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Balagansk Buryat include an owner of the whole earth, Daban-Sagan-Noyon,
    represented as an old grey-haired man, and his old white-haired wife Delent-Sagan-Khatun;
    autumn rites after harvest are arranged for this zayan.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Olhonsk Buryat offer sacrifice to Aba-Khatun, described as the hostess
    of the sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Every feature of the landscape is described as having an owner; lakes and
    rivers have spirits, and the forest has an owner called oin-ijin who is harmful
    to humans.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: A cited prayer addresses keepers of echoes, winds, mountains, sea, and wilderness,
    asking for support, fertility, light, shade, removal of evil, food, and sight
    of the sun through yurt smoke-holes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Smith spirits are divided into western or white smiths and eastern or black
    smiths; the white smiths protect and heal humans, are subordinate to western tengeri,
    and gave humans knowledge of their craft.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Bojintoy is described as the first white smith, a heavenly zayan who remained
    in the sky, and as having one daughter and nine sons, all smiths.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Eastern Ihats are said to equal the western Ihats in number, have Erlen-Khan
    and his family as their head, do mischief to humans, and communicate at times
    with western Ihats through intermediaries called Ushi or hydel.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: 'The region of evil spirits is described as containing two dungeons: Khalga,
    where the greatest black shamans go after death, and Erlen-Tama, a smaller dungeon
    not accessible to shamans.'
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: A soul can leave Khalga only if its governor, Khara-Eren-Noyon, is well disposed
    toward it; Erlen-Tama is under the direct control of Erlen-Khan.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Eastern or black smiths are specially protected by eastern tengeri, who taught
    smithcraft to Khojir-Khura-Darkhan, the first black smith on earth; he has seven
    sons, all great black smiths.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Balagan Buryat are described as believing that every disease has its zayan,
    and one named disease has Bolot-Sagan-Noyon as its owner.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: In the Olzoyev clan there are two large white stones, called Bumal-Sagan-Shulun,
    believed to have fallen from the sky and worshipped by the natives.
  category: object
  evidence_refs:
  - ev:11
