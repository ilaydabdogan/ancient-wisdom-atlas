canonical_text:
  quote: ''
  summary: 'The passage describes Yakut and Buryat procedures and signs connected
    with becoming a shaman: an elder shaman consecrates a pupil with garments, rattle,
    attendants, instruction, renunciation, and sacrifice; a Buryat child chosen for
    shamanism shows distinctive symptoms while the soul is trained among gods and
    deceased shamans; later preparation includes solitude, mountain or forest practice,
    fire, swoon, communal support, water purification, libations, birch, goat sacrifice,
    and divination from a sheep shoulder-blade.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old shaman leads a Yakut pupil to a high mountain or forest clearing for
    consecration.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pupil is dressed in a shaman's garment, given a rattle, and placed between
    nine chaste youths and nine chaste maidens.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The novice is directed to repeat words after the shaman and is told to give
    up what is dearest and consecrate his life to spirits who come at his call.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The instructor tells the pupil where certain black spirits dwell, what diseases
    they cause, and how they may be propitiated.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young shaman kills a sacrificial animal, sprinkles himself with its blood,
    and the flesh is eaten by those present.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A Buryat child chosen to be a shaman is described as meditative, solitary,
    subject to mysterious dreams, and sometimes unconscious during fits.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The child's soul is said to be trained among the West Tengeris for a white
    shaman or among the East Tengeris for a black shaman.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the dwelling of the gods, the child's soul is tutored by deceased shamans
    and learns divine names, dwelling places, propitiation methods, and subordinate
    spirits.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: After a trial period, the child's soul returns to the body, which resumes
    normal life for a time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At adolescence, the future shaman becomes moody, ecstatic, irregular in life,
    and wanders to watch shamanistic ceremonies.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The future shaman segregates himself on a high mountain or in the forest,
    calls on spirits before a great fire, and then falls into a swoon while friends
    watch unobtrusively.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Relations call in a good shaman to sacrifice and propitiate spirits for the
    young shaman-to-be; if the family is poor, the community helps obtain sacrificial
    animals and other necessities.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The preparatory period lasts several years, and the person cannot become a
    shaman until reaching the age of twenty.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: There are nine purification ceremonies, though few shamans undergo all of
    them; fully consecrated shamans are said to be severely punished by the gods for
    faults or mistakes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The first consecration is preceded by water purification involving a father-shaman,
    nine young male assistants, spring water, turasun libation, birch seedlings, heated
    water, herbs, bark, goat substances, goat blood, and goat flesh eaten by women
    present.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:16
  text: The father-shaman foretells the future from a sheep's shoulder-blade.
  category: action
  evidence_refs:
  - ev:10
