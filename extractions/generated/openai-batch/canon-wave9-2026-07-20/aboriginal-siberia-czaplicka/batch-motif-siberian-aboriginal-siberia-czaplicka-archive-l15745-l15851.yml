canonical_text:
  quote: The natives ascribe this disease to the influence of evil spirits.
  summary: The passage gives an anecdote of Tungwe’s sudden attack in which she runs
    from an igloo into snow, then classifies several forms of so-called arctic hysteria
    or nervous disease among Siberian peoples, including fright-imitation symptoms,
    menerik fits attributed by natives to evil spirits, sleep-singing, and a nightmare-like
    night illness associated with social refusal of shelter, fire, and warm food.
  language: English
  quote_policy: quoted
