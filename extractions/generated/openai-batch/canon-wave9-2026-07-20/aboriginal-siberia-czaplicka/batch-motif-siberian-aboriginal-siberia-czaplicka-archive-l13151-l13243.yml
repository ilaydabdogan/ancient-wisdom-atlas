canonical_text:
  quote: ''
  summary: The passage summarizes Koryak beliefs and tales concerning the Supreme
    Being, sacrifice, afterlife rebirth, Cloud-Man as a patron of young couples, and
    Big-Raven as a ritual and mythic figure. It describes rain-stopping, shapeshifting,
    shamanic invocation, raven and sun episodes, contradictory origins, and an adventure
    cycle involving Big-Raven and his family.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Supreme Being is propitiated for material reasons such as hunting, gathering,
    and reindeer herding; disorder begins if he ceases to look upon the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In one tale, a bridegroom fails to make the customary wedding sacrifice to
    Cloud-Man, and Supervisor forces Yineaneut's soul to the hearth edge, where fire
    scorches it and she wastes away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Human souls go to the Supreme Being after death and hang in his dwelling on
    posts or beams until they are to be reborn; a thong fastened to each soul marks
    the duration of its future life.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Supervisor is said to dwell in the clouds, sky, or heaven-village; his wife
    has the names Supervisor-Woman, Rain-Woman, or Sea-Woman, and his son is Cloud-Man.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Cloud-Man is described as the patron of young couples; a lover may win the
    beloved by beating the drum, and a bridegroom sacrifices a reindeer to Cloud-Man
    after marriage.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In a tale about the Supreme Being, Universe sends heavy rain from the body
    of his wife; Big-Raven and his son become ravens, fly to heaven, and stop the
    rain by a trick.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The rain tale is not to be told in fine weather, but only to put an end to
    rain or a snowstorm.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Big-Raven has several native names and is identified by the source as part
    of a Pacific Coast raven myth cycle present among north-western Amerinds and north-eastern
    Asian Siberians.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Among the Koryak, Big-Raven also appears in religious ritual; the source states
    that 'Creator' is a misnomer because he reforms an already organized universe
    rather than creating it.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Big-Raven is described as a reorganizer, first man, supernatural being, and
    powerful shaman whose name is used in shamanistic incantations.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: During shamanistic ceremonies a raven or sea-gull may enter the house, and
    the host is reported to call for a reindeer to be slaughtered because Big-Raven
    is coming.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Big-Raven turns into a bird only by putting on a raven's coat; the ordinary
    raven is treated separately as a droll scavenger, and killing a raven is not counted
    as a sin by the Koryak.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: One tale has Raven, not Big-Raven, swallow the sun; Big-Raven's daughter rescues
    the luminary.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: 'Accounts of Big-Raven''s origin are contradictory: some say he was created
    by the Supreme Being, while others say his origin is unknown.'
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Most Koryak tales deal with Big-Raven, his wife Miti, and their children,
    including the eldest son Ememqut; Big-Raven may appear unintelligent and be outmatched
    by his wife, mice, foxes, and other animals.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: The tales include transformations, supernatural deeds, and indecent adventures,
    and the Koryak still consider their heroes protectors; many tales are also told
    for amusement.
  category: attribute
  evidence_refs:
  - ev:10
