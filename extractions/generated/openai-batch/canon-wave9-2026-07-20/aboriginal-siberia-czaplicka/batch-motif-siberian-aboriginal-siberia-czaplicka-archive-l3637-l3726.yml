canonical_text:
  quote: ''
  summary: The passage describes the tailgan as a public communal sacrifice held for
    the whole community. It outlines seasonal dedications to deities, preparation
    of the ritual space, libations, omens, sacrifice and handling of animals, burning
    of bones, shamanic invocation of western zayans, and final petitions for benefits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tailgan is described as a public sacrifice performed on behalf of the
    whole community, distinct from a private sacrifice called kirik.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several households supply sacrificial animals according to their means, and
    after the sacrifice the meat is divided equally among participants.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tailgan is also described as a social festival with wrestling and jumping
    by youths, and formerly archery.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'Tailgans are held in honor of various zayans at definite seasons: for western
    Tengris in spring, Water-Khans in summer, and mother-earth at the end of summer.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A large open space at the foot of a hill is selected, and people go out into
    the fields in a body.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Utensils, wine, and sour milk are fumigated with pine-bark; the shaman sprinkles
    tarasun before the assembled company.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Utensils with provisions are arranged in a west-to-east row, participants
    sit to the south, and birch branches stuck in the ground are called turghe.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Participants provide white-hair ropes intertwined with white and black ribbons;
    joined ropes with a white hare-skin affixed are used to bind the tops of planted
    birches together.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The shaman reads a prayer, and participants pour out brimming cups at his
    command.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The libation is repeated three times; a cup falling on its bottom is accounted
    a favorable omen and receives acclamation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After branches of Picea sibirica are placed in the cups, sour milk is given
    to the sacrificial animals, which are then killed and skinned.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The animal skins are stuffed with straw, furnished with birch twigs and bark
    pieces, and hung on birches with the head turned toward the dwelling of the invoked
    deity.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The meat is boiled; bones are collected by animal on birch-stick tables and
    burnt, while intestine ends are burnt in a separate fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: During the principal rite, everyone holds a pail containing meat while the
    shaman invokes the western zayans, who are said to come in turn and tell their
    stories.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: When Bukha-Noin-Baobai arrives, the shaman goes on all fours, bellows like
    a bull, butts those present, and tries to overturn the birches while men hold
    them up.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:16
  text: The ceremony concludes after invoking Nagad-Zarin and making petitions and
    entreaties to the western gods for various benefits.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: A note states that married women and widows remain at home; the participants
    are all men and girls.
  category: relationship
  evidence_refs:
  - ev:10
