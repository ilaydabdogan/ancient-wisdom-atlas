canonical_text:
  quote: ''
  summary: 'The passage describes several Siberian shamanic initiation and training
    practices: climbing or being carried toward birches, purification by fire, a procession,
    feasting and sacrifices, consecration with appeal to the Dark Spirit, tests by
    spirits demanding sacrifices, old-shaman training involving blindfolding and beating
    until visions appear, and a later typology of the shaman as priest, medicine-man,
    and prophet.'
  language: English
  quote_policy: summarized
