- id: ev:9
  type: summary
  locator: 13755-13758
  quote_or_summary: When a particular god does not answer prayer, an Ainu may appeal
    to the Creator and accuse the lesser god of neglecting duty.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
