- id: ev:11
  type: summary
  locator: 13762-13766
  quote_or_summary: The Ainu believe in evil as well as good spirits, including a
    chief evil spirit and malignant beings over accidents and diseases of body and
    mind.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:12
  type: summary
  locator: 13767-13769
  quote_or_summary: Souls of animals and humans survive bodily death, and belief in
    a judgment of souls is reported as strong and well defined.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:13
  type: summary
  locator: 13770-13778
  quote_or_summary: After death the soul inhabits a body much like its living body;
    the future-life community resembles earthly Ainu life; ghosts can revisit earth
    and some living can visit ghosts, though visitors cannot be heard.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:14
  type: summary
  locator: 13779-13800
  quote_or_summary: Ghosts of deceased women, especially old women, are greatly feared;
    formerly a hut where the oldest woman died was burned to prevent her spirit returning
    to harm descendants and in-laws.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
