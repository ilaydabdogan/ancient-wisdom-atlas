canonical_text:
  quote: ''
  summary: The passage summarizes Ainu beliefs concerning water, celestial, fire,
    household, ancestral, evil, and afterlife beings. It describes offerings to water
    deities, good and evil powers over weather and rivers, sun and moon as divine
    dwellings, the Milky Way as a divine fishing place, the fire goddess as witness
    for later reward or punishment, household and personal protectors, divine consultation
    under the Creator, a deified first ancestor, evil spirits, survival and judgment
    of souls, ghost visitation, and fear of old-woman ghosts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A beneficent deity glossed as 'uncle of peace' brings favorable weather for
    fishing, while his elder brother is described as an evil deity who chases him
    from the seaside and brings bad weather that spoils fishing and wrecks boats.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Female water deities are said to have charge of springs, streams, waterfalls,
    lakes, ponds, river-mouths, and places where fresh and salt waters mingle.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Clusters of 'legged inao' tied to stakes are set up by the water as sacrifices
    to water deities.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Female beings of the waterways oversee streams from source to sea and are
    addressed with offerings for protection in rapids and good fortune in fishing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sarak kamui is described as the evil god of rivers who brings accidental death,
    including drowning and mishap of any kind.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sun goddess is generally treated as chief among the secondary gods and
    ruler of good things, while the sun and moon are described as dwellings of deities
    whose departure darkens day or night.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Milky Way is called the 'river of the gods' or 'crooked river' and is
    described as a favorite resort where the gods fish.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The fire goddess warms the body, heals sickness, enables cooking, and witnesses
    the acts and words of human beings.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: People are said to be punished or rewarded hereafter according to the testimony
    of the goddess residing in the fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Each Ainu hut is said to have a guardian god who rests on the roof when the
    master is at home, warns of approaching danger, and accompanies the family head
    to war and hunting; each person also has a protecting spirit.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The gods gather and consult before acting, with the Creator presiding in a
    manner compared in the passage to Ainu chiefs consulting before action.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: If a particular god does not answer a prayer, an Ainu may appeal to the Creator
    and may accuse the lesser god of neglecting duty.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The first ancestor, called Aioina hinud in the passage, is said to have become
    divine and to superintend the Ainu race.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage says that the Ainu believe in evil spirits, including a chief
    evil spirit and other malignant beings presiding over accidents and diseases of
    body and mind.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: The souls of animals and humans are said to survive bodily death, and the
    passage reports a strong belief in judgment of souls.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:16
  text: After death the soul is believed to inhabit a body much like its living body,
    and the community of souls in the future life is described as resembling the Ainu
    community on earth.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:17
  text: Souls can revisit earth as ghosts, and some living people can go among ghosts
    in their dwelling-place; in both cases the visitor cannot be heard but can see
    and hear.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: Ghosts of deceased women, especially old women, are feared; formerly the hut
    in which the oldest woman of a family died was burned to prevent her spirit returning
    to cause mischief.
  category: action
  evidence_refs:
  - ev:14
