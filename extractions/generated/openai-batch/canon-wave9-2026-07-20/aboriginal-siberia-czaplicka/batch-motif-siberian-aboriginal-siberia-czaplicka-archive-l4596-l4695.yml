canonical_text:
  quote: ''
  summary: The passage surveys Koryak and Kamchadal marriage and sexual customs, including
    polygyny, wife exchange or guest sleeping arrangements, keijev and transformed
    shamans, stones treated as wife and son, Kamchadal bride service, and a defended
    bride-capture marriage ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says polygyny is frequent because of levirate and a desire for
    children, and that mythology contains tales of great warriors with harems of women
    taken by force.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the described polygynous household, the first wife is mistress of the house,
    the husband sleeps between the wives, and the first wife lies on his right.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The passage reports conflicting statements about supplementary unions: modern
    Koryak deny wife exchange, while earlier authors describe wife exchange or severe
    jealousy and violence among different groups.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among Maritime Koryak, as among Chukchee, visiting friends or guests may sleep
    with the host's wife and daughters, while the host leaves the house and may spend
    the night with the guest's wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Keijev or qcccu are described as subordinate and insulting to name, and transformed
    shamans among Koryak are said to have almost died out.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: For Kolyma Chukchee, the passage reports five cases of men changing into women
    among 3,000 people, with two described as married.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says some Maritime Koryak have ordinary stones instead of wives,
    clothing the stone, putting it in bed, and sometimes caressing it as if living.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: A man named Okerach from Ukinsk gave two such stones to Krasheninnikoff, calling
    one his wife and the other his son.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Kamchadal suitor usually seeks a woman in another village and serves her
    parents for a period before requesting permission to marry.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: If the suitor is accepted by the woman, her parents, and her relatives, he
    marries her; otherwise he is compensated for his service.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After receiving permission, the suitor still must capture the bride, who is
    protected by the women of the village and wrapped in several heavy gowns.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The described marriage ceremony consists in the groom stripping away the bride's
    clothes and touching her sexual organs with his hand, while accompanying women
    may defend her.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A note states that this action is the essential marriage element only among
    Koryak and Kamchadal in Siberia, with a similar rite reported among certain north-western
    Amerind tribes.
  category: other
  evidence_refs:
  - ev:10
