  quote: ''
  summary: The passage describes Gilyak classificatory kinship terms, prescribed marriage
    with the mother's brother's daughter or mother's clan, prohibitions on other marriage
    categories, a three-gens model of wife-giving and wife-taking within an endogamous
    clan but exogamous gens, sexual access associated with angey and pu categories,
    and avoidance rules for prohibited relations.
