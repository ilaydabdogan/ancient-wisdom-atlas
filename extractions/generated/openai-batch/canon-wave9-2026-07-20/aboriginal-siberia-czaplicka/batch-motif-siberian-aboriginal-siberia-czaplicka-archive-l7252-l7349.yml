canonical_text:
  quote: ''
  summary: 'The passage records Siberian birth customs and beliefs among Altaian,
    Teleut, and Yakut groups: protective or humble naming after child deaths, restrictions
    on removing fire from the birth yurta, ritual stealing or buying of children,
    cradle protections, Yakut beliefs about fertility and difficult childbirth, the
    roles of midwife, shaman, evil spirits, and the fertility goddess Ayisit, food
    taboos, father-naming to ease labour, and first- and third-day birth observances
    including offerings to fire.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If earlier children die, the next child may be given a name implying worthlessness
    or humility.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fire of the yurta where a child is born must not be taken out for forty
    days; some extend the period to a year.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Potanin reports that when Altaian parents' first-born children die, the parents
    steal a child so that the real mother does not know its whereabouts for three
    days; one month later the child's parents redeem it with presents.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An arrow and a branch of a thorny plant are hung over a boy's cradle to protect
    him from evil spirits.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Among the Teleut, people who desire a child buy one from its parents and return
    it after a time, rather than stealing one.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage reports that Yakut marriages are generally fruitful and that lack
    of children is ascribed entirely to the woman.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Yakut childbirth pain is described as a sickness caused by evil spirits; if
    a midwife or Ayisit is not effective, a shaman is called to fight the spirits.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Jochelson is reported as thinking that the Yakut appeal to a shaman in difficult
    childbirth to prevent evil spirits from winning a victory, not primarily to save
    mother and child.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage reports severe treatment of women in labour who are regarded as
    possessed by evil spirits, including a case witnessed by Jochelson in which the
    woman died.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: A delivery procedure is described in which posts and a crossbar are arranged,
    the woman kneels with her arms over the crosspiece, two men hold her, and the
    midwife presses on her abdomen while imploring Ayisit.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Maak says the Yakut do not care for lying-in women because they believe the
    goddess can protect them; he heard of a food taboo forbidding swan flesh and wild-bird
    eggs before childbirth because of feared effects on the child.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ayisit, also called Anitcihyt in the passage, is said to leave the woman on
    the third day after childbirth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Among Yakut of the Kolyma district, labour is believed to be eased if the
    woman names the father of her child; the passage says this resembles a Yukaghir
    belief.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: At a birth, Yakut make holiday on the first and third days; on the first day
    they prepare and consume fat and sacrifice a portion to the fire, and on the third
    day friends and relations visit the mother and child.
  category: sequence
  evidence_refs:
  - ev:9
