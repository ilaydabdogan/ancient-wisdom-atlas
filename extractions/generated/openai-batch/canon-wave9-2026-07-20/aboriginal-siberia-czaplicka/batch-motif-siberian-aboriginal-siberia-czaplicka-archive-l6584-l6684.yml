canonical_text:
  quote: ''
  summary: The passage describes Eastjaik/Ostyak marriage negotiations, bride-price
    payment, marriage-night arrangements, post-marriage residence and transfer, dowry,
    restrictions on striking a wife, and avoidance rules among affinal and sibling
    relations. It also notes related accounts for the Ostyak of Yenisei and later
    accounts of face-covering customs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Eastjaik/Ostyak bridegroom chooses companions of his own age and one negotiator,
    goes to his sweetheart's dwelling, and enters the hut without ceremony.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bride's father infers the reason for the visit and offers hospitality
    before proposals are sent through a suitor from another tent.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The negotiator asks about the kalym or price to be paid and runs between the
    tents until an agreement is concluded.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The bridegroom pays part of the kalym first; a rich Ostyak girl is described
    as requiring one hundred reindeer and assorted furs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the first payment, the father is directed to prepare a bed for the bridegroom
    and have his daughter ready.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the appointed night the bridegroom lies on the prepared bed or spot, and
    the bride later lies near him on a separate bench under a particular fur until
    the fires are put out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The next morning the girl's mother asks the bridegroom whether he is satisfied
    with her daughter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: If the bridegroom gives an affirmative answer, he gives the mother a garment
    and a reindeer; the mother cuts the reindeer-skin on which the couple lay into
    pieces and spreads it around.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: If the bridegroom is dissatisfied, the mother gives him a reindeer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The bridegroom may sleep with the bride after this, but he cannot take her
    home until the whole kalym is paid.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: Before the kalym is fully paid, the bridegroom must avoid his father-in-law;
    if they meet, he must turn his back or cover his face and move quickly to and
    from the bride.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: If a husband takes his wife before the agreed sum is paid, the father may
    later detain the daughter during a visit in order to force payment of what is
    owed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The woman's dowry is said to come from the kalym paid for her and to consist
    of garments, bedding, and similar items.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: A married woman is described as unable to appear before her father-in-law
    during her life, and the bridegroom as unable to appear before his mother-in-law
    until he has children.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: When the relevant in-laws meet by chance, they are to turn their backs and
    cover their faces.
  category: action
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:16
  text: Girls in Eastjaik/Ostyak families are said to have no names; spouses call
    each other by terms meaning wife and man.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: The husband is described as unable to strike his wife without her father's
    consent; the wife may run to her parents, and her father may return the kalym
    so she can marry another man.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:18
  text: Among the Ostyak of Yenisei, the young couple live with the husband's father-in-law
    for about a month after the wedding before the husband takes his wife home.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:19
  text: Avoidance is described as binding on the bride and her brothers-in-law, and
    a girl over thirteen may not eat with or talk to her brothers.
  category: relationship
  evidence_refs:
  - ev:11
