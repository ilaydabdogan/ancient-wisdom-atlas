canonical_text:
  quote: ''
  summary: The passage describes Siberian shamanic coats and drums, especially Yakut,
    Uriankhai, and Altaian examples. It discusses a debated distinction between white
    and black shaman garments, possible ancestor-symbols on coats, the coat’s impersonal
    protective power, its role in enabling spirit-world journeys, and specific coat
    symbols such as sun, moon, chains, disks, animal forms, and serpent-shaped pendants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Troshchanski distinguishes Yakut white and black shamans by coat and drum
    features: the white shaman coat lacks animal pictures, the black shaman coat should
    not have sun representations, and a drum with horsehair fastened around the inner
    iron rim is identified as a white shaman drum.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that tribal and clan differences exist in shaman coats
    and cautions against drawing a sharp line between black and white shamanistic
    garments on the available evidence.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Uriankhai shaman’s coat is described as carrying a small doll with a minute
    drum in its left hand and another small animal figure resembling the shaman’s
    sacrificial animal.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that the Uriankhai doll is interpreted as the shaman’s
    ancestor residing symbolically in the coat, and compares this possible function
    with the Yakut umagijat.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A skeleton shown on a shaman’s coat in Troshchanski’s book is probably attributed
    to the shaman’s ancestor; hawks’ wings are sewn near it, and the passage states
    that only a shaman can fly or be represented by wings.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The passage considers three possible ways of representing the shaman ancestor:
    doll, umagijat, and skeleton, but raises uncertainty because these symbols may
    occur side by side or independently.'
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: The shaman’s coat is said to possess an impersonal power of its own and to
    bear the names ongor and tanara in addition to classified coat names.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: By putting on the coat, the shaman receives supernatural power to go to the
    upper- and under-worlds, meet spirits, and deal with them; among the Yakut it
    is called the shaman’s horse.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The coat as a whole and each symbolic picture on it are described as the shaman’s
    tanara, meaning protector.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Pripuzoff interprets a perforated sun and half-moon as representing dusk in
    the kingdom of spirits, while strange animals, fishes, and birds on the coat point
    to monsters inhabiting spirit-land.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: An iron chain hanging on the back is interpreted either as the strength of
    the shaman’s power or as a rudder for journeys through spirit country; iron disks
    defend the shaman from hostile spirits’ blows.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: An Altaian shaman’s coat is made of goat or reindeer hide and is covered on
    the outside with many-colored pendants in serpent form, with serpent heads hanging
    freely.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Altaian term mumjak is applied both to the small pendants and to the coat
    as a whole; other symbolic and jingling pendants include iron triangles and a
    small bow.
  category: attribute
  evidence_refs:
  - ev:9
