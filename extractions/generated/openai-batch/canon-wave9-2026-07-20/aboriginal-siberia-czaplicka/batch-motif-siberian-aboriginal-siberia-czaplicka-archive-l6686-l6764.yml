canonical_text:
  quote: ''
  summary: The passage reports Kamchadal childbirth customs, fertility and sterility
    practices, abortion and infanticide beliefs, naming after ancestors, and Yukaghir
    explanations of difficult labor involving evil spirits, taboos, unborn children,
    ancestor spirits, and intervention by the father or husband.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kamchadal shamanesses attribute difficult labor to the father having built
    sledges or bent wood while the child was being born.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Kamchadal woman gave birth kneeling in the presence of villagers without
    distinction of sex or age.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The newborn was wiped and wrapped with touchitch grass, the umbilical cord
    was cut with a stone knife, and the placenta was thrown to dogs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The camp inhabitants rejoiced in the infant, nursed and fondled it, and Krasheninnikoff
    remarked no further ceremonies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A woman wishing to become pregnant was said to eat spiders, and some ate an
    umbilical cord together with kiprei grass for this purpose.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a child was not desired, abortion or killing in the womb was described;
    if the infant survived birth, the mother strangled it or gave it alive to dogs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A drink made from konlakhion grass was taken to induce sterility.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Infanticide was sometimes connected with beliefs that one twin must be killed
    or that a child born during a storm must be killed, though incantations might
    avert the latter evil.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: After delivery, the mother was fed opnna soup made from fish and hale, and
    after a few days she returned to work.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The father gave the child the name of one of his ancestors, reportedly without
    ceremony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Jochelson observed difficult childbirth among Yukaghir and Yakut cases, with
    practices said to produce nervous diseases and premature age in mothers.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: Among the Yukaghir, difficult labor and unfortunate birth are attributed to
    an evil spirit entering the woman; the passage says this belief is also found
    among some Turkic and Mongolic tribes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Yukaghir explanations also include failure by the mother to observe taboos
    and the ill-will of the child itself.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Two pregnant women were not allowed to inhabit the same house because the
    unborn children might communicate and decide which mother should die.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: A further Yukaghir belief states that before birth the spirit of an ancestor
    enters the child in the womb.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: In some Yukaghir cases the father's presence is necessary to “loosen that
    which he fastened”; in one observed case a husband put his arm around the woman's
    abdomen and she gave easy birth.
  category: sequence
  evidence_refs:
  - ev:8
