canonical_text:
  quote: ''
  summary: The passage surveys shamanic accessories among several Siberian and circumpolar
    peoples, emphasizing drums, girdles, aprons, metal pendants, fire preparation
    of a drum, descent imagery connected with the Yukaghir drum name, Eskimo lower-world
    descent to Sedna, possible borrowing of accessory forms, and the half-magical
    position of Yakut blacksmiths.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Kamchadal or Itelmen, the passage says there was apparently no shamanistic
    garment or drum, and that everybody, especially women, could shamanize.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Yukaghir drum is described as a rough oval covered with hide on one side,
    with an iron cross near the centre used as a handle and iron rattles attached
    to the rim.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Yukaghir and Yakut drums are similar in iron rattles,
    iron cross, general shape, and rim protuberances, and that the Yakut interpret
    such protuberances as horns of the shaman's spirits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says that Yukaghir traditions preserve a drum without metallic
    additions and that the iron pieces were borrowed from the Yakut.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Yukaghir word for drum, yalgil, is glossed as 'lake', described as the
    lake into which the shaman dives to descend into the shadow-world.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage compares this Yukaghir conception with Eskimo shamans' souls descending
    into the lower world of the goddess Sedna.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Eskimo drums are described as not large, either oval or round, with a wooden
    handle fastened to the rim, and as used from Greenland to Siberia.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Eskimo and Chukchee are said to beat the lower part of the drum, and the
    Koryak drum is also struck from below and held slanting, while other Asiatic drums
    are mostly beaten in the centre.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The most important accessories of the Gilyak shaman are identified as the
    drum, has, and the shaman's girdle, yangpa.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Before a Gilyak ceremony, the drum was heated by the fire to make the hide
    taut and the sound more sonorous.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A Gilyak shaman preparing for ceremony removed his outer garment, put on a
    short apron called losha, tied a grass band around his head, and took a leather
    girdle with metal pendants.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Gilyak girdle is described as carrying iron plates, copper hoops, a large
    copper disk, iron links, irregular iron pieces, rolled iron plates, and small
    copper bells, all hanging at the back and making loud noise.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: The passage states that Gilyak metal accessories seem to be of Tungus origin,
    and compares the Gilyak apron-form with a Tungus shaman's iron-ornamented apron.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Among the Neo-Siberians, the passage says their philosophy of life is represented
    symbolically in the drum, and that parts of shamanic dress have great significance.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: Among the Yakut, blacksmiths who help adorn a shaman's garment are credited
    with a half-magical position and 'peculiar fingers'.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:16
  text: Hereditary Yakut blacksmiths are said to have tools with 'souls' that can
    give out sounds of their own accord.
  category: object
  evidence_refs:
  - ev:11
