- id: ev:8
  type: summary
  locator: lines 13564-13574
  quote_or_summary: The Gilyak highest benevolent deity is called Ytsigy by Schrenck;
    Sternberg reports Kurn as the universe and highest anthropomorphic deity. Pal
    is the mountain and its owner, Tol the sea and its owner, and Sakhalin/Mif is
    a covering for an immense god.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summary based on provided passage.
- id: ev:9
  type: summary
  locator: lines 13574-13582
  quote_or_summary: Natural objects have lives of their own; violence against them
    requires sacrifice to injured owners. When cutting a tree, the Gilyak place an
    inau on it so the spirit can pass into it and retain life.
