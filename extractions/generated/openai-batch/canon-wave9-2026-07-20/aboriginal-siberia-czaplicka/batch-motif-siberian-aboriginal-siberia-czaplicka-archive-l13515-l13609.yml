canonical_text:
  quote: ''
  summary: 'The passage summarizes Kamchadal and Gilyak religious traditions: Kamchadal
    deity genealogies, sibling marriages producing ancestors, Raven/Kutq as creator
    or earth-bringer, Raven’s departure, spirits in volcanic places, propitiation
    of animals, fire offerings, and a belief in an afterlife for humans and animals.
    It then describes Gilyak highest deities, spirit owners of places and natural
    objects, Sakhalin as a covering for an immense god, the use of an inau when cutting
    trees, visible objects as coverings for anthropomorphic spirits, animals as human-like
    beings, and sacrifice to owners of economically important domains.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Krasheninnikoff records a Kamchadal deity family including Kutklui, his wife,
    sister, sons, and daughter; Tizil-Kutkhu marries Siduku, and their children Amlei
    and an unnamed daughter also marry, with the Kamchadal described as descendants
    of the latter pair.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Steller calls Kutkhu the greatest Kamchadal deity and says he created the
    world and every living being; the passage also reports another Supreme Being name,
    Diistechtschitsch, which Jochelson tentatively relates to a Koryak benevolent
    Supreme Being.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Other Kamchadal traditions say Kutq, identified as Raven, created the earth;
    one version says he made it out of his son Simskalin, and another says he brought
    it from the sky with his sister and fixed it in the sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Koryak say Big-Raven went away from them, and the Kamchadal have a similar
    tradition in which Raven left for the Koryak and Chukchee.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Volcanoes and hot springs are described as habitations of evil spirits called
    lamuli; heaven and earth are said to be densely populated by spirits, and sacrifices
    not offered to gods are made to spirits.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the Kamchadal feared whale or walrus attacks, they used incantations
    to appease them; they venerated bear and wolf, avoided pronouncing their names,
    and offered fire sacrifices at sable and fox holes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Kamchadal are said to believe that both animals and humans live after
    death in another world.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Gilyak highest benevolent deity is reported as Ytsigy by Schrenck, while
    Sternberg says they call the universe and highest anthropomorphic deity Kurn;
    the mountain owner and mountain are Pal, the sea and its owner are Tol, and Sakhalin
    is regarded as a covering for an immense god.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Gilyak natural objects are said to have lives of their own; violence against
    them requires sacrifice to injured owners, and when cutting down a tree an inau
    is placed on it so the spirit can pass into it and retain life.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Visible objects are described as masks or coverings for anthropomorphic spirits
    residing in them, especially stones and roots resembling human form.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Animals are described as outwardly different from humans but actually human
    beings with feelings, souls, and institutions such as clans; the bear on land
    and a large sea bird are described as superior to humans in some qualities.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Gilyak cult is said to focus on the owners of the tayga, mountain, sea,
    and fire; sky gods live in clans but are considered less important because people
    have less direct contact with them.
  category: relationship
  evidence_refs:
  - ev:12
