canonical_text:
  quote: ''
  summary: The passage describes Buryat and shamanic death customs, including preparation
    of a dead shaman, horse procession, cremation, grave goods, collection of bones,
    tree or scaffold deposition, older and current burial practices, mourning for
    three days, and beliefs about the soul as separable from the body, sometimes appearing
    as a bee or other animal and recoverable by a shaman from hostile spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dead shaman's body is kept in the yurta for three days, dressed in new costume
    with his ritual garment placed over it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young people described as the shaman's nine 'sons' sing hymns for him and
    fumigate the body with sacred herbs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The body is put on a horse named by the deceased, led three times around the
    yurta, and taken to a wooded cemetery for shamans.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Relatives and clients accompany the dead shaman, make libations, and set food
    on a table halfway to the cemetery.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the cemetery the body is placed on a felt mat; one arrow is shot toward
    the house and eight arrows with quiver and bow remain with the body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The remaining arrows, quiver, and bow are placed with the body so that the
    deceased may defend good people from evil spirits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Other marks of the shaman's calling are broken or burned before or during
    the cremation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A pyre is erected, the body is set on fire, the horse is killed, and the participants
    return home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: On the third day participants collect the shaman's bones, put them in a sack,
    and place the sack inside a hole made in a thick pine.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some shamans' bodies are not burned but are placed on scaffolding erected
    in a wood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The text states that cremation, now restricted to dead shamans, was formerly
    a general custom.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the former general cremation custom, the dead person was dressed in fine
    clothing and given a knife, bow and arrows, and food.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the former general cremation custom, a square-shaped fire was arranged,
    the corpse and objects were placed on it, the head rested on the saddle, and sometimes
    the horse was burned with the dead person.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Under current Buryat practice as described in the passage, the corpse is washed,
    dressed in best clothes, and provided with money, a pipe, and tobacco.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Sometimes the current burial uses a coffin; often the corpse is laid in the
    grave with only a saddle-cloth under the head.
  category: object
  evidence_refs:
  - ev:6
- id: obs:16
  text: A cloth, saddle, and slaughtered horse may be burned near the grave; if the
    horse is not slaughtered it is set free and driven away if it returns.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The passage says such a horse is called kholgo and reports that it may be
    consecrated by a shaman during the owner's life and never ridden.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:18
  text: A broken cart and other broken or burned objects, such as weapons and tools,
    are placed on the grave.
  category: object
  evidence_refs:
  - ev:7
- id: obs:19
  text: A Buryat cemetery is described as usually on a hill slope, with a shaman's
    birch-grove at the summit.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:20
  text: For three days after death, people do no work and remain at home; during this
    time the deceased's soul wanders around the former habitation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:21
  text: 'The passage states that Buryat belief treats the soul as different from the
    body: sleep and illness are temporary separations, while death is permanent separation.'
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:22
  text: The soul is described as material, visible to humans, and usually taking the
    form of a bee.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:23
  text: A story describes a bee leaving a sleeping person's nose, flying around and
    outside the yurta, nearly drowning in water, returning, and matching the sleeper's
    dream narrative.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:24
  text: During illness the soul is held captive by spirits sent by the Supreme Being.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:25
  text: A shaman performs incantations with the scorched shoulder-bone of a sheep
    to discover which spirits are involved.
  category: action
  evidence_refs:
  - ev:9
- id: obs:26
  text: A persecuted soul tries to escape by taking different animal forms; a woman's
    soul frequently takes the form of a magpie.
  category: action
  evidence_refs:
  - ev:9
- id: obs:27
  text: Sneezing during sleep is said to be dangerous because the soul momentarily
    springs from the body and evil spirits may seize it.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:28
  text: A good shaman can recover the soul of a sick person even if Erlik Khan has
    captured it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:29
  text: The passage begins to state that future life is very similar to the present
    life.
  category: other
  evidence_refs:
  - ev:10
