- id: ev:8
  type: summary
  locator: 8075-8086
  quote_or_summary: The Buryat are described as believing the soul differs from the
    body; sleep and illness are temporary separations and death permanent separation.
    The soul is material, visible, and usually bee-shaped. A story tells of a bee
    leaving a sleeper's nose, flying around and outside the yurta, nearly drowning
    in water, returning, and corresponding to the sleeper's dream.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summary generated from provided passage.
- id: ev:9
  type: summary
  locator: 8087-8098
  quote_or_summary: During illness the soul is captive to spirits sent by the Supreme
    Being; the shaman uses incantations with a scorched sheep shoulder-bone to identify
    them. The soul may escape in animal forms, a woman's soul often as a magpie. Sneezing
    during sleep is dangerous because evil spirits may seize the soul, though a good
    shaman can recover it even from Erlik Khan.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain source; summary generated from provided passage.
