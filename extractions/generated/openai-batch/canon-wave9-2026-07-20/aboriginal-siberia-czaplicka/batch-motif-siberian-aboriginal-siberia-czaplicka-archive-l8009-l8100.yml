candidate_motifs:
- id: motif:1
  label: three-day funerary threshold
  taxonomy_refs: []
  basis: The passage repeatedly marks three days for keeping the shaman's body, returning
    to collect remains, mourning, the soul wandering near home, and the third-day
    feast.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage gives the sequence but does not explicitly interpret the number
    three.
- id: motif:2
  label: funerary horse as companion, carrier, or offering
  taxonomy_refs:
  - sacrifice
  basis: The dead shaman is carried by a horse named by him, the horse is killed at
    the cremation, and other Buryat funerary customs include burning, slaughtering,
    freeing, or consecrating the horse.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not explicitly call the horse killing a sacrifice; the
    taxonomy reference is based on its ritual death within funerary practice.
- id: motif:3
  label: grave goods for continued agency of the dead
  taxonomy_refs: []
  basis: The dead are provided with weapons, food, money, pipe, tobacco, saddle-related
    items, and tools; the shaman's arrows and bow are said to enable him to defend
    good people from evil spirits.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  - ev:10
  confidence: high
  cautions: Only the shamanic weapons are explicitly assigned a post-mortem defensive
    function; other objects are listed without full explanation.
- id: motif:4
  label: ritual breaking or burning of personal and shamanic objects
  taxonomy_refs: []
  basis: The shaman's ritual marks are broken or burned, and broken or burned objects
    such as carts, weapons, and tools are placed on graves.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: medium
  cautions: The passage records the practice but does not explain its meaning.
- id: motif:5
  label: tree or wood as funerary deposition place
  taxonomy_refs: []
  basis: The shaman's bones may be sealed into a thick pine, some shamans' bodies
    are placed on scaffolding in a wood, and Buryat cemeteries are associated with
    a shaman's birch-grove at the summit of a hill.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: medium
  cautions: Although tree imagery is present, the passage does not identify the tree
    or grove as a cosmic axis or world center.
- id: motif:6
  label: separable animal-form soul
  taxonomy_refs:
  - shapeshifter
  basis: The soul is described as separable from the body during sleep and illness,
    visible and material, usually taking the form of a bee, and able to take other
    animal forms such as a magpie.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The transformation belongs to the soul rather than the human body; the
    taxonomy reference is therefore approximate.
- id: motif:7
  label: dream as record of the soul's journey
  taxonomy_refs: []
  basis: In the story, the sleeper's dream matches the observed route and danger of
    the bee that leaves and returns to his body.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage presents the story as strengthening belief but does not give
    it a formal ritual function.
- id: motif:8
  label: shamanic recovery of a captured soul
  taxonomy_refs: []
  basis: Illness is explained as captivity of the soul by spirits, and a good shaman
    can identify the spirits and recover the soul even from Erlik Khan.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not describe the full recovery rite beyond incantations
    and use of the scorched shoulder-bone.
comparison_claims:
- id: claim:1
  claim: Within the passage, the author presents shaman cremation and an older general
    cremation custom as related forms of the same funerary burning pattern, with the
    older practice now restricted to dead shamans.
  claim_level: same_motif
  target: shaman cremation and formerly general Buryat cremation described in the
    same passage
  evidence_refs:
  - ev:3
  - ev:5
  counter_evidence_refs:
  - ev:6
  confidence: high
  limitations: This is an internal comparison based on the passage's own statement;
    it does not establish comparison with traditions outside the passage. Current
    Buryat practice is also described as no longer burning the dead because of prohibition.
