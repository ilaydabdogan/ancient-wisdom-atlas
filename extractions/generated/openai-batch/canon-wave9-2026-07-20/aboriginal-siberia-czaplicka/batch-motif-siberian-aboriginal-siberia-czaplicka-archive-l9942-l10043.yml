literal_observations:
- id: obs:1
  text: Among Neo-Siberian groups named as Buryat and Yakut, white shamans are described
    as a distinct class, though a family head may sometimes take the place of a white
    shaman.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Taihjan is described as a communal sacrifice in which the whole family or
    clan participates; it is called an asking ceremony and may be performed by a shaman
    or by family heads without a shaman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Among Palaeo-Siberians, the passage says there is no class of white shamans,
    and family cult is handled by the father with assistance from the mother, while
    professional shamans are often prohibited.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among the Gilyak, shamans are said to be forbidden at sacrificial feasts such
    as the bear-ceremonial.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Among the Yakut, a white shaman may be a woman when a woman stands as family
    head; a footnote explains that a wife in a polygynous household could act as family
    head during her husband's absence and perform family ceremonials.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports Troshchanski's statement that black shamans were originally
    women.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage gives several proposed etymologies for the word shaman, including
    Manchu and Tungus meanings connected with being excited, moved, or raised, and
    a Manchu expression glossed as calling spirits while dancing before a charm.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that the essential characteristic of a shaman is liability
    to nervous ecstasy and trances.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The author questions Troshchanski's inference, saying the evidence would show
    only that women are more disposed to shamanizing, not that woman was the original
    black shaman.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says that among the most primitive Kamchadal there were only women,
    or lelelmeh, shamans, and that these practiced black shamanism by summoning evil
    spirits.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A general term for woman-shaman is reported across several groups with variant
    forms, while terms for man-shaman differ from tribe to tribe.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Troshchanski is reported as concluding that during Neo-Siberian migration
    there were only women-shamans with a similar general name, and that men-shamans
    appeared later with independently formed tribal terms; the passage notes that
    this evidence concerns Neo-Siberians, not Palaeo-Siberians.
  category: speech
  evidence_refs:
