  summary: The passage compares white and black shaman types, family ritual authority,
    communal sacrifice, gendered shamanic roles, and linguistic evidence concerning
    terms for female and male shamans among Siberian and neighboring groups. It reports
    and critiques Troshchanski's hypothesis that black shamans were originally women.
