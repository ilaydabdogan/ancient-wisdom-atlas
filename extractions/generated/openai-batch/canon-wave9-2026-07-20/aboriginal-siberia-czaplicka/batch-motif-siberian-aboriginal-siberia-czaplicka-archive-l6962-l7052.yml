canonical_text:
  quote: ''
  summary: 'The passage describes child-naming and birth-related customs: names are
    linked to ancestors and sometimes selected through divination, dreams, or post-delivery
    signs; protective incantations and objects are used for infants; a ceremony invokes
    a stone and a primordial sea-lion as protective locations; notes are given on
    maternal death in childbirth and premature infants among Asiatic Eskimo; and Koryak
    beliefs are described in which ancestor souls are sent into children by the Supreme
    Being and identified by divination and child behavior.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A child’s name may be determined by reciting family ancestors until a divinatory
    object loses its balance; dreams or the first object met after delivery may also
    guide the name, usually still an ancestor’s name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a child does not thrive, the name may be changed one or more times, with
    the necessary ceremony performed only by a shaman or a “knowing person.”
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Protective incantations are pronounced during early childhood and are generally
    accompanied by necklaces or pictures of “guardians” tied to the child’s garments.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The protective procedure is described as especially advisable when a first
    child has died, in case that child has left traces for the second child to follow.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A protective ceremony is performed at the new moon in the daytime, with a
    small fire before the entrance, plates of meat placed on both sides, and red stone
    necklaces given to the parents.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The incantation says the addressed child is not on earth but within the stone,
    protected from wind and iceberg, and also located on the back of a sea-lion in
    the open ocean.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: If a woman dies in childbirth, the infant is usually smothered and buried
    with the mother, although sometimes people try to rear the child.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A note on Asiatic Eskimo practice says a premature child is placed in a turned
    whole sea-bird skin with feathers inside, securely tied, hung over a lamp with
    a constant small flame, and fed oil and mother’s milk.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Among the Koryak, infant mortality up to one year is described as enormous,
    and children’s souls are believed to be timid and vulnerable to evil spirits,
    so children are placed under the protection of good household spirits.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Koryak believe the soul of an ancestor is sent by the Supreme Being into
    the child in the mother’s womb, and that these souls hang on the cross-beams of
    the Supreme Being’s house.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The duration of the life of the person who will reincarnate the soul is indicated
    by the length of a strap attached to the soul’s neck or thumb.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Koryak father gives the child the name of the ancestor whose soul has
    entered the child and may use a suspended divining-stone called “Little-Grandmother”
    to identify that soul by its swinging motion.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: 'Another Koryak method of identifying the reborn soul is to observe the child’s
    behavior: crying rejects a name, while stopping crying or smiling marks the proper
    name.'
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: After the name is given, the father carries the child from the sleeping-tent
    into the house and announces to the people that a relative has come.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: If the child does not thrive, this may be taken as a sign that the wrong name
    was given.
  category: relationship
  evidence_refs:
  - ev:13
