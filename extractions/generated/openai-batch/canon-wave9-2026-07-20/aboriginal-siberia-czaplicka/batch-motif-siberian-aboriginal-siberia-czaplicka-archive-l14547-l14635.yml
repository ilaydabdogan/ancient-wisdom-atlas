canonical_text:
  quote: ''
  summary: The passage describes Chukchee ceremonies, especially Reindeer and Maritime
    Chukchee sacrifices and annual ritual cycles. It notes sacrifices to spirits,
    the dead, sea powers, Keretkun, Pehittin, and the whale; omens from slaughtered
    reindeer; substitute offerings; dog sacrifices; and ritual objects used in a Keretkun
    ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chukchee ceremonials are described as directed toward the material welfare
    of the community, with incantations as the main substance of the rites.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Reindeer Chukchee have regular ceremonials connected with the herd, called
    sacrifices or genuine sacrifices.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: After a reindeer is stabbed, its direction of fall is watched and interpreted
    as a more or less favorable omen.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dogs may be slaughtered, and substitute reindeer made of willow leaves or
    snow may be offered.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Most sacrifices are offered to good spirits; sacrifices to evil spirits occur
    at midnight, in darkness, and are not spoken of.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Named Reindeer Chukchee rites include Autumn Slaughtering, Winter Slaughtering,
    the Ceremonial of Antlers, sacrifices to the New Moon and Fire, a hunting-luck
    sacrifice, a rite connected with wild reindeer bucks, and a family Thanksgiving
    Ceremonial.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Maritime Chukchee ceremonial cycle begins in early autumn with a commemorative
    sacrifice to the dead and a sacrifice to the sea for later sealing fortune.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A chief winter ceremonial is dedicated to Keretkun or performed as thanksgiving
    to spirits of sea-mammals killed since autumn.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A spring ceremonial prepares boats, and a midsummer ceremonial of heads gives
    thanks to spirits of sea-animals killed since early spring.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that four ceremonials are performed with varying similarity
    by Maritime Chukchee and Asiatic Eskimo.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Some Maritime Chukchee also sacrifice to the star Pehittin in midwinter, perform
    a spring Kilvei rite analogous to the reindeer-breeders' antler ceremonial, and
    sacrifice to the whale after a whale is killed or drifts ashore.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Maritime Chukchee ceremonials include bloody and bloodless sacrifices; their
    bloody sacrifices use dogs, but the passage contrasts their practice with American
    Eskimo and Koryak practices.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Keretkun ceremonial uses seal-gut overcoats, ceremonial head-dresses,
    an incantation-paddle with pictorial prayers, a suspended net, bird images, and
    small paddles.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: In the Keretkun ceremonial, two reindeer-skins by the hearth represent inner
    rooms, and Keretkun is represented by a small wooden image placed on a lamp.
  category: object
  evidence_refs:
  - ev:12
