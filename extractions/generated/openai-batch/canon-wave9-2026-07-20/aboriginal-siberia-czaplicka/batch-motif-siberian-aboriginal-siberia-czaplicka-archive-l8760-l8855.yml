canonical_text:
  quote: ''
  summary: The passage describes shamanic vocation among Siberian groups as a call
    that may come through inner voices, visible spirits, illness, or misfortune. It
    gives examples involving Ainanwat, the Yakut-Tungus shaman Tiuspiut, Chukchee
    shamans, and Katek, emphasizing spirit relations, unusual perception, special
    eyes, nervous sensitivity, reluctance before strangers, and mature-age calls following
    severe trials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says a shamanistic call may begin as an inner voice bidding a
    person to enter relations with spirits, and that a visible spirit may appear if
    the person delays obeying.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ainanwat saw spirits after an illness; one spirit offered to stay only if
    Ainanwat became a shaman, and vanished after Ainanwat refused.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tiuspiut reports becoming very ill at twenty, perceiving things others did
    not perceive, concealing this for nine years, approaching death, and improving
    after beginning to shamanize.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tiuspiut is described as an experienced shaman who could dance and shamanize
    all night despite his age.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: During ceremonies, Tiuspiut's eyes are described as having a strange expression
    and a fixed stare.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bogoras reports that Chukchee shamans are said to have bright eyes, which
    are explained as giving them the ability to see spirits in the dark.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Chukchee shamans are described as highly nervous or bashful, sensitive to
    slight changes in the surrounding psychic atmosphere, and reluctant to display
    power before strangers.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: In one house performance, a shaman's spirits at first refused to come, were
    heard walking and knocking outside, and then stayed near corners after entering.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that a shamanistic call may come to mature people during
    misfortune, illness, or sudden loss, leading them to seek closer relations with
    spirits.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Katek entered relations with spirits during a seal-hunting adventure in which
    he was carried away on drifting ice and climbed onto an iceberg.
  category: sequence
  evidence_refs:
  - ev:8
