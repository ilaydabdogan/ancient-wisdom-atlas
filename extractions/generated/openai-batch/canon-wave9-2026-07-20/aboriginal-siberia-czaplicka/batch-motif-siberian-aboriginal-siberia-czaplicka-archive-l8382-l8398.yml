canonical_text:
  quote: ''
  summary: 'The passage reports funeral and mourning customs among the Samoyed and
    Ostyak of the Lower Obi: the body is placed on the ground and covered with inverted
    skis; a widow may make and care for a husband-representing figure for six months;
    remarriage is not expected during mourning; and some north-west Siberian natives
    show mourning through hair arrangements for specified numbers of days.'
  language: English
  quote_policy: summarized
