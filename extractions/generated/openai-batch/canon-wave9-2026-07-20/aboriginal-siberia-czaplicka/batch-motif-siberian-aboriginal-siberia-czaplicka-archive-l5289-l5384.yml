canonical_text:
  quote: ''
  summary: The passage describes Gilyak marital customs, including restricted action
    against a collateral partner, child betrothal marked by tying dog hair to a girl's
    wrist, wife-payment, bride abduction and blood-revenge, polygyny, widow transfer
    to a deceased husband's brothers, inheritance through the father, and teknonymy.
    It then summarizes Ainu marriage locality and a Pilsudski tale in which a young
    man and a sea-god appear as rival suitors for a young woman.
  language: English
  quote_policy: summarized
