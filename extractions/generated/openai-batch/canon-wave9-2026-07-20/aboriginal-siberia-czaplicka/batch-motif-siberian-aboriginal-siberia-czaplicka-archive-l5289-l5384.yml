- id: obs:1
  text: When a wife is found with a man who is not the specified collateral partner,
    the passage says this may lead to a fight or severe punishment of the man; when
    the husband finds the collateral partner with his wife, he cannot act, though
    his face shows he is not indifferent.
  category: action
