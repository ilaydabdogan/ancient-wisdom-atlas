canonical_text:
  quote: ''
  summary: 'The passage summarizes Siberian and Finnic death customs: a shaman may
    attain future life and recover a stolen soul; a bad female spirit is blamed for
    soul theft; rites can prevent the dead from returning; Finnic dead and ancestor
    cults are described as widespread; Vogul and Ostyak funerals involve deathbed
    preparation, mourning, coffin handling, removal through a special route, forest
    burial, reindeer sacrifice, boat or boat-shaped coffins, grave goods, food offerings,
    and a pierced cooking vessel in the grave.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A reindeer sacrifice is said to be repeated several times, but after the body
    has turned to dust there is said to be nothing beyond; only the shaman attains
    future life.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Death is usually attributed to a bad female spirit who steals the soul, while
    a good shaman can sometimes recover the soul and return it to its owner.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Samoj-ed formerly used an incantation to prevent the dead from returning,
    and women of the dwelling jumped over the body when it was taken away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Krohn is reported as saying that among Finnic tribes the cult of the dead
    and ancestor-worship are common and old, with sacrifice places near burials, images
    of the dead, offerings for the dead's needs, and magic aimed at union with spirits
    of the dead.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: Among the Vogul, relatives place a small stick in the mouth of the dying person
    to keep the teeth from closing, cover the corpse's head, dress the body in best
    clothes, and lay it in the sleeping-place in silence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Women loosen their hair, bewail the dead, and praise the dead person's virtues;
    men may assist but are usually making the coffin and preparing the grave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The corpse is put into the coffin by members of its own sex; charcoal figures
    of a bird or fish may be drawn on the coffin lid; the family raises the coffin
    in an ordered sequence, and the eldest woman promises sacrifice to spirits if
    it is heavy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The body is usually buried on the day of death and is carried out through
    a window or through a specially made hole in a chum.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Among the Vogul and Ostyak the graveyard is usually in a forest, and reindeer
    that carried or drew the body must later be killed on the grave.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The reindeer is tied to a tree, beaten until it chokes itself with the rope,
    then pierced in the heart with a wooden spear; its flesh is eaten at the grave,
    bones placed with the corpse, and skin buried nearby.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: Upper Obi Vogul and Ostyak graves are shallow, lined with planks or branches,
    and contain the body in a small boat or a boat-shaped coffin under branch and
    birch-branch roof structures.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Small belongings of the dead are put in the grave, larger objects such as
    oars, boat, and skis are placed outside; after burial relatives feast, put food
    on both sides of the grave, and place a pierced cooking vessel inside the grave.
  category: sequence
  evidence_refs:
  - ev:12
