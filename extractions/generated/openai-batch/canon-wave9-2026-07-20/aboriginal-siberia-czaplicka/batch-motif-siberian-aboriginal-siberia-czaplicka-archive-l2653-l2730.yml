canonical_text:
  quote: ''
  summary: The passage describes clan relationships with supernatural 'owners' of
    mountain, sky, sea, and earth; ancestor worship, sacrificial festivals, divine
    provision of food, communal sharing, inheritance and gift practices, the religious
    and social bear-festival, hostile spirits of the dead or slain, shamanic appeasement,
    and collective compensation obligations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Clansmen who die by drowning, are killed by wild animals, or are beloved by
    the 'owners' of mountain, sky, sea, or earth are said to join the society of those
    owners after death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Clansmen worship ancestors and the named 'owners' through sacrifices and regularly
    held festivals in their honor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the 'owners' or gods provide food, that all natural
    food is a free gift of the gods, and that inhospitality is sinful because gods
    give food to a guest.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sea-hunting spoils are shared without giving the boat master a greater share,
    and products of the hunt may be divided among families of men who did not participate.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Costly objects may be given freely to a clansman who needs them for marriage
    payment, burial, or related purposes; inherited property passes according to specified
    kinship rules, with some private objects transferred by special bequest and later
    returning as marriage-related payments.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Clansmen have a common duty to feed the bear and to take part in the bear-festival,
    at which a tame or wild bear is killed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The slain bear is venerated because it may belong to the fraternity of the
    'owners of the mountain' or may be the incarnation of a remote fellow clansman's
    spirit received into that fraternity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The bear is regarded as an intermediary between mortals and the 'owner of
    the mountain'; sacrifices may be sent by the bear to that spirit, who has power
    over all animals.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The bear-festival is organized and managed by clansmen; sons-in-law may assist,
    and festival expenses are shared by the clansmen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The bear-festival allows widely separated clan members to meet, is often followed
    by games and sports, and supports friendships with other clans.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: A deceased clansman who quarrelled with fellow clansmen, whose death was not
    avenged, or who was buried without due rites may become a hostile spirit and trouble
    the clan; a similar threat may come from an offended person of another clan.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In cases involving hostile spirits, a shaman may be requested to appease the
    hostile spirit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Thusind is described as compensation in place of blood-revenge and for other
    offenses; the clan as a whole is responsible both for payment and for exacting
    it on behalf of an injured clansman.
  category: action
  evidence_refs:
  - ev:8
