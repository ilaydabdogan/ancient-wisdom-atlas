canonical_text:
  quote: ''
  summary: 'The passage describes Altaian marriage customs reported by Wierbicki and
    Potanin: a contrast between northern bride-capture customs and southern negotiated
    marriage, a kneeling matchmaker''s peacemaking proposal, acceptance through a
    pipe and shared drink, the bride''s screened journey to the groom''s yurt, blessings,
    and bowing and offerings at hearth-fires.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage frames an earlier social transition from matrilineal, matrilocal,
    perhaps matripotestal endogamy toward patrilineal, patrilocal, patripotestal exogamy.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wierbicki is cited as distinguishing southern and northern Altaian marriage-ceremony
    types.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among northern Altaians, the wife is described as usually obtained by capture,
    with present ceremonies preserving symbolic traces of earlier marriage by capture.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the southern Altaian form, a young man sends matchmakers to the prospective
    father-in-law; one matchmaker kneels and makes a formal speech asking for a union
    and peace.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The kneeling matchmaker offers the father a tobacco-filled pipe with the mouthpiece
    turned toward him, while a second matchmaker holds burning fungus ready.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Taking the pipe is a sign of acceptance, but the compact may await family
    consultation or settlement of kalym; afterward the pipe is smoked and kumys and
    wine are drunk together.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Two young men, friends of the bridegroom, escort the bride on horseback while
    holding a screen stretched between birch rods so that she should not see the path
    or new yurt before entry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Before leaving her own yurt, the bride receives parental blessing and instruction,
    followed by blessings from seven old men in poetic diction.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: A bright fire burns during the bride-blessing; the bride bows before it, and
    later bows before the groom's hearth-fire and places meat and butter in it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A footnote reports a Yakut custom in which a matchmaker approaching a family
    formerly at feud brings presents and speaks of ending hostile words and restoring
    kindly thoughts.
  category: speech
  evidence_refs:
  - ev:9
