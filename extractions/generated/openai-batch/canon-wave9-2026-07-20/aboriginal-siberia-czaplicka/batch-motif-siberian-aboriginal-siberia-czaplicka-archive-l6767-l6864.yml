canonical_text:
  quote: ''
  summary: The passage describes birth-related taboos and practices affecting a pregnant
    woman, her husband, and household; labor procedures; postpartum washing and smoke
    purification; naming customs tied to ancestor reincarnation; sterility as ancestral
    disfavour; shamanic intervention to obtain a deceased relative’s soul; and former
    killing of newborns when the mother died.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pregnancy taboos affect the mother, husband, and household; the pregnant woman
    must avoid cow or reindeer fat and larch-gum because these are believed to thicken
    or freeze in the stomach and fasten the child inside the womb, while butter or
    horse fat may be eaten because it will melt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pregnant woman is expected to be active; she should raise her feet high,
    kick stones or earth lumps from her path, and not turn back before reaching her
    destination.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Household members must not shout, talk loudly, cross the pregnant woman’s
    path, or stop her; in the last days, her husband and relatives perform active
    taboos for her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the first labor pains, the wife, husband, and midwife loosen garment fastenings;
    male presence is limited to the woman’s father and husband; the woman is made
    to walk and may be placed on the knees of her husband or father while her abdomen
    is pressed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The text states that women frequently died under the described abdominal pressing
    treatment, including one case witnessed by Jochelson.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: After birth, the midwife massages the mother’s abdomen or makes her walk;
    the mother then lies down so the bones disjointed during birth may come together
    again, but she begins walking outside the next day.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: For three days after birth the mother must not touch anything in the house;
    on the fourth day the midwife washes her, the mother washes the midwife’s hands,
    and the hands are wiped with willow shavings, new reindeer-skin, or women’s hair
    braids.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The midwife purifies the woman with smoke from dry grass kindled on the house
    floor; afterward the woman may resume household duties but remains unclean for
    forty days, must have no intercourse with her husband, and must not handle hunting
    or fishing implements.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Similar taboos are said to be observed during menstruation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The birth celebration, called pacil, invites the whole village, while marriage
    is said to have no special ceremonies connected with it.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: A child formerly received a name only after being able to speak, allowing
    the child to give the name of the ancestor aihi whose reincarnation the child
    was believed to be; parents may be known by the first child’s name.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Sterility is described as a punishment and sign of disfavour from dead relatives;
    a barren woman may seek a shaman who descends to the world of the deceased and
    persuades a relative’s soul to enter her body, though such children often die.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage says that in earlier times newborn children were killed if the
    mother died, while children generally were much desired.
  category: other
  evidence_refs:
  - ev:7
