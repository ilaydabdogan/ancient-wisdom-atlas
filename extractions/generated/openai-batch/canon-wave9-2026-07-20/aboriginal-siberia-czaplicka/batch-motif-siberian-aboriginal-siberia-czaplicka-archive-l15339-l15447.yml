canonical_text:
  quote: ''
  summary: The passage introduces a pathology chapter on diseases in Siberia, including
    syphilis, 'arctic hysteria', leprosy, and Siberian boil-plague, identified as
    anthrax. It describes anthrax transmission through insects and infected animal
    skins, symptoms of internal and external anthrax, and a report that some afflicted
    people felt faint when crossing or seeing water. It then discusses leprosy among
    several northern peoples, including a Gilyak belief that leprosy is caused by
    eating diseased salmon, Gilyak avoidance of naming the disease, and reports of
    two cures by shamans despite shamanic reluctance. The passage closes by comparing
    nervous maladies called 'arctic hysteria' with similar nervous affections reported
    among many peoples and with forms found throughout northern Asia.
  language: English
  quote_policy: summarized
