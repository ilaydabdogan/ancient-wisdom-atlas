canonical_text:
  quote: ''
  summary: The passage describes beliefs about mammoth ivory taboos and sacrifices
    to place spirits, pictorial classifications of exaggerated animal spirits, Chukchee
    conceptions of soul plurality and soul loss, shamanic soul retrieval, soul theft
    by kele spirits, Chukchee multiworld cosmology with a polar passage and horizon
    gates, and Koryak ideas about a sky-dwelling Supreme Being and possible monotheistic
    consolidation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Searching for mammoth ivory was formerly taboo, and a person finding a mammoth
    tusk must pay the spirit of the place through sacrifices.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pictorial representations with a reindeer as the foremost figure are said
    to represent benevolent spirits; those with a dog, horse, or mammoth in front
    represent lielet.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Other exaggerated animal forms described as monsters include worms, blackbeetles,
    birds, and fish.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The soul is described by terms meaning belonging to the body or vital force;
    it resides in the heart or liver, and men, animals, and plants possess it.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage describes additional souls belonging to body parts, including
    limb-souls and nose-souls.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The soul often assumes the form of a beetle and hums like a bee in flight.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: A person who loses a soul may have it returned through a shaman; if the shaman
    cannot find it, the shaman may send a portion of his own soul into the person.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A kele that steals a soul carries it to a dark abode and binds its limbs to
    prevent escape.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A tale says that a kele forces a stolen soul to watch and trim his lamp.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In one reported case, relatives concluded that a man’s firebrand blow had
    injured his wife’s soul after finding no injury to bodily organs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Kele are also said to have souls that may be lost or spirited away by shamans.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Chukchee belief describes several worlds, counted by some as five, seven,
    or nine, arranged one above another.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: A hole under the polestar is described as a passage between worlds through
    which shamans and spirits pass.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: Another way to reach another world is to step downward in the direction of
    the dawn.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Other worlds are located in compass directions, under the sea, above as a
    small dark world for female kele-birds, and in some stars.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:16
  text: The sky is described as a world touching the earth at the horizon, with four
    gates that open when the wind blows.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:17
  text: The Koryak are contrasted with Chukchee and Asiatic Eskimo traditions by being
    described as tending toward one Supreme Being, though the passage reports possible
    earlier plurality and possible Russian influence.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:18
  text: The Koryak Supreme Being is described as a benevolent anthropomorphic old
    man with a wife and children, dwelling in the sky and able to send famine or abundance.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:19
  text: Names for the Koryak Supreme Being include terms glossed as Universe or World,
    Supervisor, Something-Existing or Existence, One-on-High, Master-on-High, Dawn,
    and Thunder-Man.
  category: speech
  evidence_refs:
  - ev:13
