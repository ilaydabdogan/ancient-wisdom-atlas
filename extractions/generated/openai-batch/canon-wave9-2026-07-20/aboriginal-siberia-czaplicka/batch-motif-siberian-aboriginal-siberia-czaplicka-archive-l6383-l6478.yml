canonical_text:
  quote: ''
  summary: 'The passage describes Siberian marriage customs: a wedding tent ceremony
    with a priest, hair rebraiding, blessed caps, frankincense smoke, a feast, and
    temporary seclusion of the bride; princely nuptial banquets with prayers and games;
    post-marital avoidance and naming rules toward affinal elders; and Samoyed marriage
    negotiations involving a matchmaker, bride-price, refusal or acceptance tokens,
    gifts, sledges, reindeer, and feasting.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A new tent is erected; the bride, her parents, and relations go to the bridegroom,
    and a priest accompanies them to the tent.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The priest orders the bride’s tresses to be undone and braided into two tails
    in the manner of married women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The priest takes the couple’s caps outside, smokes them with frankincense,
    prays, returns, blesses the couple, and has the caps placed on their heads; the
    ceremony ends with a feast.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: For a certain time after the ceremony, the bride is not permitted to leave
    her tent and is supposed to be seen only by her mother and married women of her
    acquaintance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: At princely nuptials, a large banquet is prepared; a herald or carver on a
    fox-coloured horse precedes the food carriers; priests read prayers; and amusements
    include horse-racing, wrestling, and archery.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'The bride must observe rules before her father-in-law and older male relatives
    of her husband: she must not sit while they remain in the yurta, enters their
    yurtas only when invited, and exits over the threshold facing inward.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bride must not address her husband’s parents or older relatives by their
    own names, but must invent names for them; the custom is said to extend to the
    parents’ dog.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Other cited accounts state that the bride must not show bare feet or bare
    head to her father-in-law or older male relatives, and that she is not allowed
    to see these people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A Samoyed man seeking a wife looks outside his own family, chooses someone
    equal in rank and property, and appoints a negotiator who is customarily rewarded
    with a reindeer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Samoyed suitor and his relations stay outside on sledges while the negotiator
    asks the girl’s father; if the father refuses, he gives the negotiator a basket
    as a token of refusal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: If the girl’s father accepts the proposal, the negotiator settles the kalym,
    or price to be paid; the passage says this negotiation can be prolonged.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In Jackson’s account, the matchmaker brings a gift such as a fox-skin, and
    later a stick marked with notches corresponding to the number of deer proposed;
    if the price is accepted, the stick is broken in two and each party keeps one
    half.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage describes Samoyed marriage festivities involving raw flesh, blood,
    cooked meat, and vodka; in the Yurak Samoyed account the suitor waits outside
    in his sledge while the matchmaker brings him some meat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The kalym is said to consist of clothes, household necessities, reindeer,
    and small articles purchased from Russians; the father keeps part and gives some
    to his relations.
  category: object
  evidence_refs:
  - ev:7
