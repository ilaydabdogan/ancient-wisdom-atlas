canonical_text:
  quote: ''
  summary: The passage describes Gilyak clan procedures for homicide, blood-vengeance,
    compensation, bear-killing vengeance, the fate and grave marking of an unavenged
    murdered person, restrictions affecting women and clan resources, and a ritualized
    thusind settlement involving an orator and feigned combat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fellow-clan murderer is shunned by the clan, must leave it, and consequently
    lacks proper burial rites because only members of his own clan can perform them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that crimes within the clan are rare and attributes this
    to speech prohibitions and marital rights that reduce quarrels and jealousy.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In clans intermarried with the Ainu, compensation for manslaughter is divided
    equally between the victim's mother's brother and the victim's father or brother.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: When an outsider commits a crime against a clan member, the offended clan
    insists on its rights; the same principle is said to apply when the offender is
    an animal.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: If a bear kills a man, vengeance requires killing that bear or another bear
    in its place, and the 'man' or owner of the mountain must provide thusind to the
    deceased man's clan by sending many animals.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the bear is slain and its flesh eaten at a feast, the deceased is accepted
    into the society of the 'men of the mountain', and his clansmen offer sacrifice
    to him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The soul of an unavenged victim cannot go to the land of the dead; it remains
    near the living as a bird-avenger called fakhch and eventually crumbles into dust.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A murdered man's grave receives a tree stump with roots upward; the roots
    are shaped into a bird or supplied with a bird image, unlike the ordinary grave
    stump with roots downward.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The obligation to take blood-vengeance lasts only until the third generation
    if no contemporary performs the act.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Vengeance is not executed upon a woman or upon the private property of the
    guilty person.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Between the murder and the carrying out of blood-vengeance, both clans are
    described as being under a kind of martial law; if far apart, a small military
    expedition is arranged.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: Thusind is presented as originating as an alternative to blood-vengeance and
    as having finally replaced it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A woman cannot actively inflict blood-vengeance or suffer it, but she may
    hinder vengeance by hiding the target or refusing food, water, or cooking fire.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The law is said to forbid members of one clan from using another clan's food,
    water, or fire.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: The thusind ceremonial includes an imitation of blood-vengeance and is led
    by a speaking-man or orator from a neutral clan.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: In the thusind ritual, two champions, one from each clan and accompanied by
    their orators, advance with shields and fight in a feigned combat that may sometimes
    become real.
  category: action
  evidence_refs:
  - ev:13
