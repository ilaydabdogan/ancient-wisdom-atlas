canonical_text:
  quote: ''
  summary: The passage discusses Koryak, Chukchee, broader Siberian, and Yakut evidence
    about family and professional shamanism, women’s roles in shamanic practice, spirit-commanded
    transformed shamans, ritual objects such as drums and amulets, and Yakut white
    and black shaman categories.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jochelson is reported as saying that professional shamanism developed from
    family shamanism among the Koryak.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Koryak, some women are described as knowing family-secret incantations
    and additional incantations, which they may use outside the family on request.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person with unusual gifts, often a woman, may be requested to use those
    gifts for a wider circle and thereby become a professional shaman.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: For the Koryak, the passage says there is no evidence that woman-shamans preceded
    men, while women-shamans were considered as powerful as men and sometimes cleverer.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Koryak transformed shamans are described as powerful, existing in traditions,
    and changing sex in obedience to spirits’ commands.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Among the Chukchee, family shamanism is described as probably preceding individual
    shamanism.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Chukchee family ceremonials, the mother shares the shamanic role with the
    father, has charge of the drum and amulets, and may exceptionally perform the
    family sacrifice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Chukchee gift of inspiration is said to be bestowed more often on women,
    but of an inferior kind; higher grades are associated with men, and childbirth
    may reduce a young woman’s shamanistic power.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage concludes that Koryak and Chukchee evidence shows family shamanism
    preceding individual or professional shamanism, but not that women alone formerly
    shamanized.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that a similar condition occurs among other Palaeo-Siberians
    and Neo-Siberians, while woman-shamans are not often found among the latter.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Despite women’s low social position in these societies, personal ability rather
    than sex is described as decisive for shamanistic vocation.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The author rejects the claim that a professional shaman’s lack of a personal
    drum proves that women were the original shamans.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Troshchanski and Stadling are described as treating professional shamanism
    as a special institution separate from the communal cult, though later connected
    with it in the emergence of white shamanism.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: 'For the Yakut, the passage reports two shaman categories: white shamans representing
    creative forces and black shamans representing destructive forces; black shamans
    are said in this theory to behave like women because of origin from women-shamans.'
  category: relationship
  evidence_refs:
  - ev:9
