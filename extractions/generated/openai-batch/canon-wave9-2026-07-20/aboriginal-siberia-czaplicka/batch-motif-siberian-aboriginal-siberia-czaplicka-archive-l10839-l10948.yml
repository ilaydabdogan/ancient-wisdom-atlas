canonical_text:
  quote: ''
  summary: 'The passage describes Siberian shamanic accessories and instruments: a
    calf-skin shamanic coat with iron pendants and symbolic ornaments, a northern
    woman''s travelling cap, beliefs about souled iron pendants, the assistant who
    hands the coat to the shaman, the Yakut drum and its names, related drum terms
    across neighboring peoples, other musical instruments used by shamans, and minor
    shamanic performances using a chair, ornamented branch, white horsehair, and fire
    rather than full regalia.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman's calf-skin shamanic coat is described with the hair outside and with
    important iron accessories hung from it, including two 'suns' or sun-and-moon
    forms, a fish, a named item rendered in the passage as 'bihyiine', and sometimes
    two round circles representing breasts.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A good shaman's dress is said to require about 35 to 40 pounds of iron.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the north the shaman wears a woman's travelling cap with ear-flaps, while
    in more southern regions the shaman is usually bareheaded.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The iron and jingling pendants of the shaman's coat are generally believed
    to resist rust and to possess a soul.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The shaman wears the magical coat next to the skin and receives it from a
    kuturu'ksuta, described as a page or assistant.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The kuturu'ksuta shouts during the performance and assists the shaman in other
    ways, including preparing the drum.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Yakut drum is given the names tangiir by Sieroszewski and tinir or dinir
    by Troshchanski.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The drum is egg-shaped, covered with the hide of a young bull, has a cowhide-covered
    stick, and contains a cross fastened to the rim by straps.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Raised horn representations are reported on the drum; one cited source gives
    twelve, while another says they occur in odd numbers such as 7, 9, or 11.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Little bells, jingling trinkets, and other iron and bone rattles are attached
    inside the rim of the drum, especially where the straps are fastened.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The term tangiir is described as a widespread drum name among most Neo-Siberian
    tribes, with a t-to-d variation, and related forms are listed in Manchu, Mongol,
    Altaian, Uriankhai, Soiot, and Karagass.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Yakut word tinir is also said to mean kinship through marriage, and Troshchanski
    interprets this double meaning as connected with the drum as a bond between shaman,
    community, and spirits.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Besides the drum, the shaman uses a balalaika-like stringed instrument and
    a jews' harp-like instrument whose end is held between the teeth so the mouth
    acts as a sounding-board.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage distinguishes the shamanic or non-shamanic use of related instruments
    among Yakut, other Neo-Siberian shamans, Buryat, Uriankhai, Soiot, Altaians, Kirgis,
    and Altai tale-recitation practice.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: Some minor shamanistic performances occur without the drum and without special
    garments; the shaman sits in everyday dress on a small chair, holds a branch decorated
    with three, five, or seven bunches of white horsehair, keeps the fire burning,
    throws some horsehair onto it, sings, and whirls without dancing.
  category: sequence
  evidence_refs:
  - ev:12
