literal_observations:
- id: obs:1
  text: The passage gives a collective term for relatives by affinity and lists named
    relations such as father-in-law, mother-in-law, son-in-law, daughter-in-law, brother-in-law,
    sister-in-law, and husband of the wife's sister.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: For women, the affinity system is described as practically the same, except
    that the talalhin relation is not found in the female affinity table.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men married to two sisters are said to have an extremely close relation, formerly
    stronger than brotherhood, and call each other takalhin, glossed as 'brace-companion'.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two proverbs are cited to express the closeness of the takalhin bond, including
    the explanation that the men must fight and fall together.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Step-relationship in all degrees is denoted by the suffix -lqal, glossed as
    'intended for', with examples for bridegroom, bride, step-father, step-mother,
    step-son, step-daughter, step-brother, and step-sister.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the Koryak, the family is described as the only well-defined and stable
    social unit.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage notes a tendency for Koryak families related by marriage to draw
    together into larger groups united by moral and material obligations.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Koryak fraternizing between members of unrelated families is described as
    having no formal rite, only an exchange of gifts; such allies formerly helped
    each other in war and later owed mutual material assistance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Women are also said to form these friendship alliances.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In former warlike days, rich and strong Koryak men are said to have held slaves
    who stayed at home and did housework under women's supervision; the passage says
    it is difficult to know whether they could be bought and sold.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Russian administration grouped the Koryak into so-called clans that the
    passage says have no relation to any aboriginal family-relationship system and
    are territorial in origin.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The men chosen by Russians as chiefs of these so-called clans are described
    as not being the natural heads of the community.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A cited note reports Bogoras's tentative view that the takalhin relation might
