canonical_text:
  quote: ''
  summary: The passage describes shamanic novice behavior marked by withdrawal, little
    eating or speaking, and prolonged sleep; Chukchee accounts of protracted slumber;
    Koryak shamanic training through contact with guardian spirits, often animal or
    bird spirits; a shaman's report of spirits appearing in the desert and commanding
    him to become a shaman or die; and descriptions of painful inspiration, resistance
    to the call, bloody sweat, and repeated initiatory preparation before performances.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young novice called newly inspired loses interest in ordinary affairs, stops
    working, eats little, stops talking to people, and spends much time sleeping.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wanderer may lie down on the open tundra and sleep for three or four days,
    risking burial by drifting snow, and on waking may think only a few hours have
    passed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chukchee people when ill are reported sometimes to fall into heavy, protracted
    slumber lasting many days, interrupted only for physical needs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Koryak mental training of a shaman is described as coming into contact
    with the right spirits who will be protectors in shamanistic practice.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Every Koryak shaman is said to have guardian spirits who help in struggles
    with disease-inflicting kalau, rivalry with other shamans, and attacks upon enemies.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Koryak shaman spirits usually appear in the form of animals or birds, with
    wolf, bear, raven, sea-gull, and eagle named as common guardian spirits.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: One Koryak shaman reported that wolf, raven, bear, sea-gull, and plover spirits
    appeared to him in the desert, sometimes as men and sometimes as animals, and
    commanded him to become a shaman or die.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In solitude, spirits are described as appearing in visible form, endowing
    shamans with power, and instructing them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The process of gathering inspiration is described as painful for young shamans
    because of mental struggle against the call, and they are sometimes said to sweat
    blood on the forehead and temples.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Later preparation for a shamanic performance is described as a repetition
    of the initiative process, during which Chukchee shamans are said to be susceptible
    to haemorrhage and bloody sweat.
  category: sequence
  evidence_refs:
  - ev:5
