canonical_text:
  quote: ''
  summary: 'The passage describes shamanic performances among Chukchee and Yakut contexts:
    Upune produces small pebbles from a larger intact pebble while possessed by a
    kele; other shamanic feats include self-stabbing, swallowing burning coals, and
    freeing oneself from cords. It then describes a Yakut shamanic ceremony for a
    sick person, including night preparation in a yurta, community seating, a protective
    shoulder loop, fire focus, ritual clothing, smoke swallowing, use of drum and
    water, bowing to the four corners, and sprinkling water from the mouth.'
  language: English
  quote_policy: summarized
