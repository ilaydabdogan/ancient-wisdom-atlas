canonical_text:
  quote: ''
  summary: 'The passage describes shamanic accessories and their restrictions among
    several Siberian and neighboring groups: blacksmith-made garments, caps and drums
    controlled by spirits, Buryat horse-staves, Lapp drum taboos, and Chukchee garments,
    caps, images, tassels, and small ritual instruments.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Yakut shaman's coat is described as practically impossible to make in
    modern times because hereditary blacksmiths no longer exist there.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Tungus shaman reportedly had no cap because the old one was burned and the
    spirits would not grant him a new one.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some Buryat shamans lacked drums because spirits withheld permission to make
    them, and two long sticks struck crosswise could be substituted in performance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Buryat horse-staves are said to be necessary for principal rites; they are
    usually birch-wood, while iron horse-staves are restricted to a shaman who has
    passed a fifth consecration.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Lapps are described as keeping the drum covered with furs, and women may
    not touch it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Among Chukchee shamans, the passage reports no strict rules for the shape
    or quality of shamanic dress, with originality valued and old coats from the American
    shore sometimes adopted.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Chukchee shamans perform ceremonies in a dark, hot, stifling inner room and
    are said to remove coats and shamanize with the upper body naked.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Female shamans among neighboring tribes are reported to have no outward distinguishing
    mark and not to use the special shamanic garb assigned to male shamans.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage notes a custom in which a male shaman adopts the clothes and manner
    of a woman.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A shamanistic coat may be adopted by the shaman or by the patient, and is
