literal_observations:
- id: obs:1
  text: An unnamed shaman wore women's clothing for two years by order of spirits;
    when complete transformation was not obtained, the spirits allowed him to resume
    men's clothing on the condition that he wear women's clothing during shamanistic
    ceremonies.
  category: sequence
  evidence_refs:
  - ev:1
