    later in the passage, and these figures are supposed to be as powerful as women-shamans.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The Kamchadal hockchuch or koekchuch wore women's dress, did women's work,
    and were treated with the same lack of respect shown to women.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The hockchuch could enter the house through the draught-channel, as women
