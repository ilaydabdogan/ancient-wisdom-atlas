comparison_claims:
- id: claim:1
  claim: The passage presents Koryak qavau and Kamchadal or Kuril koekchuch as comparable
    nearby Siberian categories of female-dressed, socially feminized ritual figures,
    but the Kamchadal accounts are said to be confused.
  claim_level: same_function
  target: Koryak qavau and Kamchadal/Kuril koekchuch
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  counter_evidence_refs:
  - ev:3
  confidence: medium
  limitations: The passage itself notes confusion and contradiction in Krasheninnikoff's
    accounts, so the comparison should not be treated as a precise equivalence.
- id: claim:2
  claim: The passage contrasts a Palaeo-Siberian pattern of 'change of sex' with Neo-Siberian
    and Yukaghir cases where shaman dress includes female garments; the shared feature
    is female-coded shamanic attire rather than necessarily bodily transformation.
  claim_level: same_function
  target: Palaeo-Siberian transformed shamans, Neo-Siberian female-like shaman dress,
    and Yukaghir shaman attire
  evidence_refs:
  - ev:7
  - ev:11
  counter_evidence_refs:
  - ev:7
  - ev:11
  confidence: medium
  limitations: The text explicitly restricts 'change of sex' to Palaeo-Siberians,
    with the Yukaghir named as an exception only in dress; this is not evidence for
    a single institution across all groups.
- id: claim:3
  claim: Yakut traditions of men-shamans bearing children and the Koryak tale of Ememqut
    share a motif-like pattern of supernatural male childbirth linked to shamanistic
    spirits or shamanic power.
  claim_level: same_motif
  target: Yakut male-shaman childbirth traditions and the Koryak Ememqut tale
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: One item is reported as tradition among Yakut men-shamans, while the
    other is a Koryak tale with a specific antagonist and restoration sequence.
