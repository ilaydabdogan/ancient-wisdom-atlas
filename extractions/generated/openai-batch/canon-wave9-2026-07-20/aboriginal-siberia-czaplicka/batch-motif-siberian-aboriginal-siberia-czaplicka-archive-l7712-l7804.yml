  quote_or_summary: Koryak annual offerings for the dead include reindeer slaughter,
    antlers placed at the cremation spot, or presents sent to dead relatives during
    another funeral; some traditions suggest leaving the body in a deserted house.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
