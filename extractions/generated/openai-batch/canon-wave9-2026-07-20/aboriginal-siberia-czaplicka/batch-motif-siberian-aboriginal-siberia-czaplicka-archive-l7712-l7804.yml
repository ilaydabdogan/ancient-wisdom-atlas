- id: ev:6
  type: summary
  locator: lines 7757-7765
  quote_or_summary: Gilyak belief attributes death to bad spirits and says the soul
    needs relatives' care before Mly-vo; the corpse is dressed in embroidered garments,
    equipped with weapons, given food, and entertained with feasting and noise.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain; concise summary derived from supplied passage.
- id: ev:7
  type: summary
  locator: lines 7766-7773
  quote_or_summary: The Gilyak corpse is tied to a sledge; the favorite dog is placed
    beside him, receives a portion of the master's soul for months, lies in the sleeping-place,
    and receives the best food until the soul portion returns to Mly-vo.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain; concise summary derived from supplied passage.
- id: ev:8
  type: summary
  locator: lines 7774-7783
  quote_or_summary: The Gilyak corpse is placed on a symmetrical pyre facing west;
    ceremonial fire is obtained by friction with company assistance; four men stir
    the fire while broken objects and sacrificial dogs are cast onto the pyre.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain; concise summary derived from supplied passage.
- id: ev:9
  type: summary
  locator: lines 7784-7790
  quote_or_summary: Schrenck reports that the widow lights the pyre, sacrificed dog
    skins are made into a coat for her, and dog flesh is partly eaten and partly scattered
    in all directions.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain; concise summary derived from supplied passage.
- id: ev:10
  type: summary
  locator: lines 7791-7798
  quote_or_summary: A few weeks after the Gilyak funeral, a toy house is built near
    the place, containing a silk-dressed man figure, food, and smoking apparatus,
    with a cuckoo representation above it as emblem of the goddess of love.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
  rights_note: Public domain; concise summary derived from supplied passage.
- id: ev:11
  type: summary
  locator: lines 7798-7804
  quote_or_summary: Schrenck says the small house called raff is built over a vessel
    with the dead person's ashes and keeps parts of clothes, hair, and skull; not
    every dead person has a raff, and a small child's corpse is not burned.
  source_text_path: texts/public-domain/siberian/internet-archive/aboriginal-siberia-czaplicka.md
