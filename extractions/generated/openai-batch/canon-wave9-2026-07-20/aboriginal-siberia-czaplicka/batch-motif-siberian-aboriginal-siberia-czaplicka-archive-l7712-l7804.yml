canonical_text:
  quote: ''
  summary: The passage describes Koryak death customs involving pyre offerings, reindeer
    slaughter, gestures meant to confuse or block the dead, corpse dissection or stabbing,
    substitute occupants of the dead person's sleeping place, drum beating, and annual
    offerings. It then describes Gilyak beliefs that death comes from bad spirits
    and that the soul needs care before reaching Mly-vo, including elaborate clothing,
    feasting for the corpse, a dog temporarily holding part of the soul, cremation
    with sacrificed dogs and goods, and later construction of a small raff house containing
    ashes, relics, a doll, food, smoking apparatus, and a cuckoo emblem.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In some places, women do not accompany the body; the dead man's personal belongings
    are placed on the pyre, while reindeer are slaughtered and eaten by the company,
    with only the remains left on the pyre.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At one funeral, a grandfather walked around the pyre first from right to left
    and then from left to right to confuse his tracks so that the dead would not follow
    him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The grandfather drew a line on the ground, jumped over it, and shook himself;
    the company did the same, and the act was said to form a large river between the
    village and the pyre.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some Reindeer Koryak dissect the dead body to determine the probable cause
    of death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some other Koryak groups stab the corpse with a knife on the pyre to prevent
    the child who reincarnates the soul from having the deceased person's illness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dead person's sleeping-place is destroyed, but for ten days a relative,
    or sometimes a dried-grass effigy, occupies the dead person's position so that
    the htla may believe it failed to obtain the soul.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Koryak funeral ceremony ends with drum beating, immediately after the
    burning among Reindeer Koryak and after ten days among Maritime Koryak.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Annual sacrifices for the dead among the Koryak include slaughtering reindeer,
    placing antlers at the cremation spot, or sending presents to dead relatives at
    another funeral.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Gilyak are described as holding that death results from bad spirits, and
    that the soul needs care from relatives before reaching Mly-vo, the habitation
    of the dead.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Gilyak corpse is dressed in fine new embroidered garments, weapons are
    prepared, and the corpse is entertained with feasting, food portions, laughter,
    and shouting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Gilyak corpse is tied to a sledge, and the dead man's favorite dog is
    placed beside him and temporarily receives a portion of the master's soul.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The dog that receives the soul portion lies in the sleeping-place and receives
    the best food until the soul portion returns with the other souls to the master
    in Mly-vo.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: At the Gilyak funeral place, the corpse is put on a symmetrical pyre facing
    west, and ceremonial fire is obtained by friction with the assistance of the company,
    including small children.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Four men stand at the corners of the Gilyak pyre stirring the fire, while
    objects such as weapons, sledges, and pans are broken and cast onto the pyre with
    sacrificial dogs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: According to Schrenck, the Gilyak widow lights the pyre, dog skins are made
    into a coat for her, and dog flesh is partly eaten and partly scattered in all
    directions.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: A few weeks after the Gilyak funeral, a toy house is built near the funeral
    place, containing a silk-dressed human figure, food, and smoking apparatus, with
    a cuckoo representation above it.
  category: object
  evidence_refs:
  - ev:10
- id: obs:17
  text: The cuckoo representation is described as an emblem of the goddess of love
    in Gilyak mythology.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: Schrenck says the small house, called raff, is built over a vessel containing
    the ashes of the dead and holds a small part of the clothes, hair, and skull;
    not every dead person has a raff, and a small child's corpse is not burned.
  category: object
  evidence_refs:
  - ev:11
