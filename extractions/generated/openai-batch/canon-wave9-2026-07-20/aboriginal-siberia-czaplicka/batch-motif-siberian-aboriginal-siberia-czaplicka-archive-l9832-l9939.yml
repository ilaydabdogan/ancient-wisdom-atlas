  quote: ''
  summary: The passage describes Votyak and Yakut distinctions between white and black
    shamans, their ritual functions, debated moral character, spirit-related practices,
    ranks of Yakut shamans, and a hypothesis that white shamans developed from family
    or clan heads serving as communal ritual leaders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Votyak, white shamans are described as almost the only shamans still
    found because the cult of the bright god had mostly displaced that of the black.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yakut white shamans are said to participate in spring festivals, marriage
    ceremonies, fertilization rites, and curing diseases when life has not yet been
    taken from the patient.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A tale reports nine white men-shamans and eight white women-shamans present
    at one wedding.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: White shamans ask a being named maghan sylgilalch to descend to earth and
    make a woman fertile in cases of sterility.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At autumn fishing, torches made from wood of a lightning-struck tree were
    lit, waters were purged, and the lake's spirit-owner was asked for a benefit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage reports disagreement over whether the autumn lake-fertilization
    ceremony should be attributed to white shamans or black shamans.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: One cited author characterizes white shamans as good and honest and black
    shamans negatively, while Troshchanski says the Yakut black shaman is only professionally
    black, not necessarily bad, and helps people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Black shamans offer sacrifices to abassylar, shamanize, foretell the future,
    call up spirits, wander into spirit-land, and give accounts of those journeys.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Yakut shamans are classified by esteem into great, middling, and little shamans.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: A great shaman has amagyat from Ulu-Toion, a middling shaman has amagyat of
    lesser quality or extent, and a little shaman lacks amagyat.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: A little shaman is described as not really a shaman but as an abnormal, neurotic,
    or original person able to cure minor illnesses, interpret dreams, and frighten
    away small devils.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: Troshchanski hypothesizes that white and black shamans originated and developed
    independently.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Troshchanski proposes that white shamans developed from heads of families
