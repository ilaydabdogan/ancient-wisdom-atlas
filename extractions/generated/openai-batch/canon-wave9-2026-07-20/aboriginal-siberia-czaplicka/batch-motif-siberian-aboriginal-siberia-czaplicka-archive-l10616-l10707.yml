  summary: The passage describes the relation between blacksmiths and shamans, hereditary
    qualities attributed to blacksmiths, spirits' fear of iron and bellows noise,
    the shaman's coat and drum terminology, and a Yakut account of named metal ornaments
    on the shaman's coat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Smiths are described as the occupational group nearest to shamans and as related
    to them; cited sayings call the blacksmith and shaman "of one nest" and the smith
    the shaman's elder brother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Blacksmiths are said sometimes to cure, give advice, and foretell the future,
    while the passage distinguishes their knowledge as cleverness rather than magical
    power.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The profession of blacksmith is described as mostly hereditary, especially
    in the north; in the ninth generation a blacksmith is said to first acquire certain
    supernatural qualities, which increase with a longer descent line.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Spirits are described as generally afraid of iron hoops and of the noise made
    by the smith's bellows.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Kolyma anecdote, a shaman would not shamanize until Sieroszewski removed
    a case of metal instruments, and afterward attributed failure to the spirits'
    fear of the blacksmith.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The shaman's dress is described chiefly as a cowhide coat, short in front
    and touching the ground at the back.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The back edges and surface of the shaman's coat are ornamented with different
    objects, each said to have its own name, place, and meaning.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The shaman's coat is said not to be an indispensable ritual costume element
    among Palaeo-Siberians and to be most elaborate among Neo-Siberians.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The drum is said to have a common name, with dialectic differences, among
    most Neo-Siberians, while the term for the shaman's coat varies; the passage presents
    this as suggesting that the coat is newer than the drum.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kiingeta, glossed as the sun, is described as a round, smooth, shining disk
    about the size of a small saucer, hung between the shoulders on a short leather
    strap through its central hole.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Oibon-Kiinga, glossed as hole-in-the-ice sun, is described as a similar disk
    with a larger middle hole, hung above or below the first disk on a long leather
    strap.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Kondei Jci/Jian are described as tin rolls hanging at the back on metal rings
    or loops, and Chillirijt Injlian as many finger-long flat plates hanging at the
    back above the waist.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Hobo are described as tongueless copper bells suspended below the collar,
    about the size and shape of a crow's egg, with a drawing of a fish's head on the
    upper part.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Biirgiine are two round flat shoulder disks; Oiogos fimiria are plates fastened
    on both sides of the body; Tahgfaua are long plates fastened to both sleeves.
  category: object
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:15
  text: Amiigyat, also called abagyta amafiat or enichet in many places, is described
    as a copper plate bearing either a drawing or a relief engraving of a man's figure.
  category: object
  evidence_refs:
  - ev:11
