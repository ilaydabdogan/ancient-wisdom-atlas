canonical_text:
  quote: ''
  summary: 'The passage gives an ethnographic account of Yukaghir social organization:
    the status and work of slaves taken as war captives, rules of blood vengeance
    by paternal male relatives with limited duties for maternal relatives, and a detailed
    account of Yukaghir kinship terminology organized by clan, relatives, blood/kinsfolk,
    age, generation, and parental side.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Slaves are described as captives of war.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Male slaves could not belong to the classes of warriors or hunters; slaves
    stayed in the house with women, old people, and children, did house-work, and
    could also fit up sledges and nets and join fishing parties.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Blood-vengeance is said to have been strictly exacted by the Yukaghir and
    was named with terms glossed as “blood-anger” and “heart-anger.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The avengers in a blood-vengeance case are described as the victim’s relatives
    in the male line on the father’s side.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: If maternal-side relatives found the culprit first, they had to disclose the
    hiding-place to paternal-side relatives and, in exceptional cases, help carry
    out the vengeance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Yukaghir relationship vocabulary is summarized with terms for men of the
    clan, relatives, and “blood” or kinsfolk; the “blood” term is said to include
    relatives by affinity as well as blood-relatives.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The classificatory kinship term Emjepid is described as covering brothers,
    sisters, and cousins of the father and mother, with further distinctions by age.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The father term is glossed as “guardian” or “fosterer,” derived from a verb
    meaning to feed or nourish; the mother term is probably connected with doing,
    producing, or creating.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Several collateral kin terms are expressed through forms glossed as “big-father,”
    “little father,” “big mother,” “little mother,” “little grandfather,” and “little
    dear one.”
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Collateral uncles and aunts are divided according to age and whether they
    are related through the father or mother; some terms also group elder maternal
    uncles with grandfathers and elder paternal aunts with grandmothers.
  category: relationship
  evidence_refs:
  - ev:8
