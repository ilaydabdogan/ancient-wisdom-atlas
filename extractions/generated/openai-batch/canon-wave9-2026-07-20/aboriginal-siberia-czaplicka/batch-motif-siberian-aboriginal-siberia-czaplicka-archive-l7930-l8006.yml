canonical_text:
  quote: ''
  summary: 'The passage describes Tungus, Olchi/Orochi, and Buryat funerary customs:
    exposure of corpses in reindeer skin, coffins, trees, posts, sheds, or platforms;
    grave goods and pierced cooking vessels; animal killing at funerals; efforts to
    prevent the dead from returning; Olchi beliefs about the afterlife country of
    Biin; and Buryat shaman burials connected with birch trees and taboo groves.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Tungus, a corpse may be sewn in reindeer skin and hung on a tree
    with the dead man's armour and a pierced cooking vessel, or placed in a wooden
    coffin on high posts while armour and vessel are hung on a neighbouring tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During one Tungus funeral ceremony, a reindeer and a dog are killed; the reindeer's
    flesh is eaten, while its bones and the dog are tied to a nearby post or tree.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The widow remains silent during the ceremony and at its conclusion embraces
    the tree and weeps.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Returning relatives may obliterate their tracks in the snow or fell trees
    across the way in order to prevent the return of the dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A described Tungusic grave in the Viluy district had the corpse's head toward
    the north-east and a coffin placed on two tree-trunks about eight feet high.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Viluy grave contained weapons, arrows, a box, and a copper cooking pan
    with a pierced bottom holding a reindeer stomach filled with reindeer flesh; nearby
    stumps displayed the skin of the sacrificed reindeer.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Olchi are said to believe that all the dead go to the country of Biin,
    whose exact location was not discovered; the future life resembles the present
    and has seasons reversed relative to this world.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Certain prominent shamans are said to be able to reach the country of Biin
    while alive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Olchi and Orochi expose their dead in a small shed, placing the coffin
    on a platform with the face turned toward the sea or a river.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Among the Buryat, a shaman's corpse may be burned and the remains placed in
    a birch trunk called the shaman's birch, or the body may be exposed on a platform.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A grove of shaman-birches is taboo, and anyone who cuts down such a tree is
    said to die immediately.
  category: attribute
  evidence_refs:
  - ev:7
