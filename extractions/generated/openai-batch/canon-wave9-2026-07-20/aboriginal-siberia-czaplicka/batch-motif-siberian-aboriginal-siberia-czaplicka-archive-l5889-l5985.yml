  quote: ''
  summary: The passage discusses Yakut marriage customs, including exogamy, polygyny,
    reported decline of exogamy, traditions of same-clan and close-kin unions, prohibitions
    on siblings sleeping together, and kinship terminology. It includes allusions
    from Yakut traditions and olongho in which a youth marries his sister, brothers
    have sexual claims on a sister before her marriage outside the clan, a sister-lover
    rescues a hero, and heroes travel to discover their fathers.
  language: English
