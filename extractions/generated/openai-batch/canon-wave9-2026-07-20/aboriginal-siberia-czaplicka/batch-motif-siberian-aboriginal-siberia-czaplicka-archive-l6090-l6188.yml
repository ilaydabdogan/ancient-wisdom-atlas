canonical_text:
  quote: ''
  summary: Ethnographic description of Altaian marriage customs, including a ritual
    called destroying the house, a formal bride-capture procedure, construction of
    a temporary birch green yurta, kindling of a new fire with augury from sparks,
    copper-ring offerings, hayga feasts, kalym payments and dowry practices, widow
    remarriage economics, seasonal timing, exogamy, and affinal avoidance rules.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a marriage festival a custom called ail-huzar, glossed as destroying the
    house, involves removing the door of the yurta while a richly dressed relative
    of the bride on a richly caparisoned horse tries to ride out through the small
    doorway.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The occupants of the yurta try to prevent the mounted man's escape by clinging
    to his stirrup, clothing, and horse trappings; items torn away are given to the
    bride and called the bride's luck.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Among northern Altaians the bridegroom is said to capture the bride, but the
    girl is informed beforehand, the matter is settled with her, and she gives his
    envoy a kerchief from her head as an earnest of the compact.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bridegroom comes at night with one or two friends on good horses, carries
    the bride off, and takes her to the groom's ulus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Young men build an odalh for the couple from nine birch poles set to meet
    at a point, with leaves left at the top and birch-bark walls.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: On entering the new abode the bridegroom must kindle a new fire with flint
    and steel; coals from another fire may not be brought in, and the future life
    of the couple is augured from the sparks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: While the husband tends the fire, the bride offers a copper ring to each builder
    of the odalh, having collected rings since childhood for that purpose.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The green yurta stands for three days, during which the young couple must
    not leave it; afterward it is pulled down, the birch poles are left in the forest
    to rot, and nobody may borrow fire from it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Marriage feasts are called hayga; the first is given by the bridegroom around
    the odalh and the next four are given at the bride's home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Five or ten days after the bride's capture, the groom brings relatives and
    food to the father-in-law to make peace and agree on the amount of kalym.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A rich son-in-law may pay the kalym at once, while a poor one may pay it over
    several years; the bride's parents sometimes return the whole kalym as dowry and
    add gifts.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The bridegroom's bachelor friends help him pay the kalym, but a large kalym
    can worsen a woman's widowhood because her father-in-law may treat her as costly
    property and demand an equal payment from a later suitor; sometimes the widow
    marries her brother-in-law.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Marriages are usually celebrated in spring, the first hayga is delayed until
    the cuckoo is heard, later feasts include tobacco and meat hayga, and the final
    hayga includes killing and eating a horse with dances and games.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Marriage is stated to be exogamic among all Altaians, and a wife and her father-in-law
    observe avoidance rules; among the Teleut, avoidance also applies with the bridegroom's
    relatives.
  category: relationship
  evidence_refs:
  - ev:10
