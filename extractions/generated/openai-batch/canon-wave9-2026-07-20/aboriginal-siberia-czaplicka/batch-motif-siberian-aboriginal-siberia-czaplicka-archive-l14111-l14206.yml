canonical_text:
  quote: ''
  summary: The passage first gives Altaian terms for several soul or vitality principles,
    including their etymologies, their relation to health, death, bodily departure,
    and post-mortem likeness. It then summarizes Buryat religion as polytheistic,
    describes the sky-dwelling tengeri divided into western/white and eastern/black
    groups, names chiefs of those groups, and reports traditions and explanations
    concerning their opposition.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tyn or Tim is described as vitality, a soul common to plants, animals, and
    humans; it is linked etymologically with breathing and can depart at death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: If suzy does not soon return to the body, the tyn perishes; the passage also
    reports a danger that a living person's tyn may pass to a dying person if one
    approaches too closely.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Suzy is derived from words associated with water, river, and length, and denotes
    strength needed for health and long life.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kut is described as nearly the same as suzy or its next stage, and it connotes
    destruction or loss of a vital principle.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tula belongs only to humans, not animals; during a shaman's performance it
    is represented as a small white bullet in continual quicksilver-like motion.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Siir separates from a person at death and is banished from the dead person's
    habitation forty days after death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that men and animals, or their siirmet, continue after
    bodily death and keep the same relations to one another as on earth.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Siine is a human soul phase connected with intellectual powers; after death
    it takes the living likeness of its possessor and wanders in the dead person's
    dwelling, sometimes calling to relatives.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Buryat religion is described as polytheistic, with classes of supernal beings
    headed by leaders but without a single Supreme Being over all.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The highest spirits are called tengeri or tengeriny; they inhabit the sky
    and are counted as ninety-nine named beings.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'The ninety-nine tengeri are divided into western and eastern groups: fifty-five
    western White Tengeri are described as kind, and forty-four eastern Black Tengeri
    are described as mischievous.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage reports a scholarly explanation that the ninety-nine tengeri are
    personifications of atmospheric states such as dull, bright, cold, and stormy
    conditions.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The western tengeri have named chiefs in different Buryat groups, and western
    secondary spirits or good zagans are described as subordinate to the chief.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: The eastern tengeri are described as hostile to humans and as sending misfortunes,
    quarrels, sickness, and death.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: A tradition says there was originally no difference between the two classes
    of tengeri, but a quarrel caused some spirits to separate, go east, and remain
    hostile.
  category: sequence
  evidence_refs:
  - ev:11
