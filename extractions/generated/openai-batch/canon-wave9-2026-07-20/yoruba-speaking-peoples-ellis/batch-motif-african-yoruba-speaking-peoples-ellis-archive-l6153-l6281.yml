canonical_text:
  quote: ''
  summary: The passage describes Yoruba laws of kinship and inheritance. It contrasts
    Yoruba descent reckoning with Tshi and Ewe uterine clan systems, explains how
    recognition of father-child blood relationship undermines clan-name exogamy, notes
    a proverb used as evidence for former female descent, and summarizes Yoruba family
    responsibility and inheritance rules.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Yoruba descent and consanguinity are not reckoned exclusively
    in the female line; succession to dignities is described as male-line, while blood-descent
    is reckoned on both sides.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts Tshi and Ewe families as uterine groups in which the
    father is not considered a blood-relative of his children or a member of the family.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Under the Tshi and Ewe clan system as described, the clan-name tests blood-relationship,
    persons of the same blood may not marry, and property does not leave the clan.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author argues that recognition of father-child blood relationship makes
    the clan-name system unworkable, using hypothetical animal clan-name combinations
    such as Dog, Leopard, and Cat-Snakes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says Yoruba blood-relationship is now traced on both the father's
    and mother's sides as far as remembered, and marriage within the known circle
    of consanguinity is forbidden.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: An ancient proverb about a gazelle claiming relationship with a large antelope
    through its mother is cited as evidence that the Yoruba formerly used female descent.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that some natives still scarcely consider children of the
    same father but different mothers to be true blood-relations.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author suggests that recognition of a father's blood relationship to his
    children was probably caused by northern Yoruba intercourse with Mohammedan tribes
    of the interior.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says Yoruba families have no collective responsibility except
    that parents are responsible for crimes of their children; the family head cannot
    pawn younger members, and younger members cannot claim support as a right.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: When a man dies, his sons divide his property; daughters do not inherit in
    the father's house but divide their mother's property, and a wife's property is
    separate from her husband's.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: If a man has no sons, his property falls to his brothers, or if there are
    no brothers, to his sisters.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says a man cannot disinherit a legal heir, cannot make a will,
