canonical_text:
  quote: ''
  summary: The passage describes Yoruba beliefs about spirits inhabiting particular
    trees, procedures for cutting such trees, associations of the Apa and Iroho trees,
    comparisons with Greek and Roman tree-felling customs, beliefs about witchcraft
    meetings at spirit-inhabited trees and owl metamorphosis, explanations of sickness
    and death by witchcraft or specific gods, treatment of accused witches, and types
    of amulets and charms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several kinds of trees are described as inhabited by indwelling spirits that
    are distinguished from gods and compared by the author to hamadryads or elves.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that, by analogy with Tshi tribes, these tree spirits may
    once have had the status of gods associated with large silk-cotton trees, but
    are now less prominent.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Ashorin tree is said to contain a spirit that would drive away a person
    trying to fell it; a woodman places palm-oil on the ground to lure the spirit
    out and then cuts down the tree.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Apa tree is said to contain an evil spirit, to be marked with palm leaves
    and an earthen pot for offerings, to emit light at night, to require propitiation
    before cutting, and to be an emblem of vengeance.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Iroho or silk-cotton tree is said to contain a less powerful and less
    malicious spirit; a man may protect himself before felling it by rubbing palm-oil
    on his forehead while invoking the spirit of his own head.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A proverb says the axe that cuts the tree is not afraid, but the woodman covers
    his head with etu, a magic powder.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The author compares Yoruba tree-cutting customs with Siphinos woodcutters’
    caution around hamadryad-inhabited trees and with Cato’s instruction to sacrifice
    before thinning a sacred grove.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Wizards and witches are said to meet at night at the foot of spirit-inhabited
    trees, especially the Apa, whose spirit assists them; the wizard or Aje is said
    to metamorphose into an owl and go on a mission of death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sickness and death are chiefly attributed to witchcraft except when a death
    or disease is specially associated with a god, such as lightning with Shango or
    smallpox with Shanpanna.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: A person charged with witchcraft is said properly to undergo ordeal and, if
    guilty, execution, but crowds often kill accused persons without trial; old women
    accused of witchcraft may confess to causing recent deaths.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Amulets and charms are described as numerous; some are badges of gods, some
    are protective objects obtained through priests, and many are sewn into leather
    cases.
  category: object
  evidence_refs:
  - ev:10
