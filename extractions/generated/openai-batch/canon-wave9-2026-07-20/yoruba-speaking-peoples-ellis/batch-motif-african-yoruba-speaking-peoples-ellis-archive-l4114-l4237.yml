comparison_claims:
- id: claim:1
  claim: The author likens Yoruba tree spirits to hamadryads of Ancient Greece and
    elves of medieval Europe as comparable indwelling spirit figures.
  claim_level: same_motif
  target: Ancient Greek hamadryads and medieval European elves
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: This is the author's analogy; the passage gives no evidence for historical
    contact or common inheritance.
- id: claim:2
  claim: The author compares Yoruba tree-spirit beliefs with Tshi beliefs in spirits
    or gods animating gigantic silk-cotton trees on the Gold Coast.
  claim_level: same_motif
  target: Tshi Srahmantin-type spirits of gigantic silk-cotton trees
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is brief and inferential, and the passage supplies little
    direct detail about the Tshi material.
- id: claim:3
  claim: Yoruba precautions around felling spirit-inhabited trees are compared with
    Siphinos woodcutters' precautions around hamadryad-inhabited trees.
  claim_level: same_function
  target: Modern Greek Siphinos woodcutters and hamadryad-inhabited trees
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The shared function is avoiding harm from a tree spirit during felling;
    the specific ritual actions differ.
- id: claim:4
  claim: The offering before cutting the Apa tree is functionally paralleled with
    Cato's instruction that a woodcutter sacrifice a hog and ask permission before
    thinning a sacred grove.
  claim_level: same_function
  target: Cato, De Re Rustica 139, sacred grove thinning ritual
  evidence_refs:
  - ev:3
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supports a ritual-function comparison only; it does not
    support historical contact.
- id: claim:5
  claim: The passage states that nocturnal witch or wizard meetings at spirit-tenanted
    trees occur among Yoruba as among Ewe tribes of the Slave Coast.
  claim_level: same_motif
  target: Ewe witch or wizard meetings at spirit-inhabited trees
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The Ewe comparison is asserted briefly without additional examples
    in this passage.
- id: claim:6
  claim: Some Yoruba amulets are compared with Ewe vo-sesao as badges of different
    gods rather than intrinsically powerful objects.
  claim_level: same_function
  target: Ewe vo-sesao divine badges
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison concerns amulet function only and is not expanded beyond
    one sentence.
