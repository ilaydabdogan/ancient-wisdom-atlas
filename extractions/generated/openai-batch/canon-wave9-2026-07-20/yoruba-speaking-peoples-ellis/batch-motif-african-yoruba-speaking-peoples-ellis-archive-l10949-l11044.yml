canonical_text:
  quote: ''
  summary: The passage describes Tshi local nature-gods, three widely known exceptions
    connected with sky, earthquakes, and silk-cotton trees, the anthropomorphic forms
    attributed to indwelling spirits of natural objects, and Ewe parallels in which
    local nature-gods coexist with more general and tribal deities. It explicitly
    compares Ewe Mawu with Tshi Nyankupon and names Huntin and Loko as Ewe silk-cotton
    tree spirits.
  language: English
  quote_policy: summarized
