canonical_text:
  quote: ''
  summary: The passage describes epithets and limits of Olorun; introduces Obatala
    as a chief Yoruba god associated with white cloth, visions, clay, child formation,
    gates, offerings, and an oracle of guilt; and begins the description of Odudua
    as chief goddess, 'Black One,' and nursing mother figure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Elemí is glossed as 'a living man' or literally 'he who possesses breath,'
    and is applied to a servant or slave and also to Olorun in relation to power over
    the firmament.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Olodumaye or Olodumare is presented as an obscure epithet, probably meaning
    'Replenisher of brooks' and possibly compounded with terms connected to water
    and life.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes Olorun as a nature-god and personally divine sky who
    controls phenomena associated with the roof of the world, not as an omnipotent
    being.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A proverb states that a man cannot cause rain to fall and Olorun cannot give
    a child; the passage explains this as evidence that each god has distinct duties.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Obatala is called the chief god of the Yorubas, and his name is most commonly
    explained as 'Lord of the White Cloth'; white is sacred to him.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Obatala’s temples, images, and paraphernalia are described as painted white,
    his followers wear white cloths, and the god is represented wearing white cloth.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Obatala is also linked with visions, entering humans, predicting the future,
    inspiring oracles and priests, and unveiling futurity by visions.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Priests say Olorun made Obatala, handed over management of the firmament and
    world to him, and retired to rest.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: One myth says Obatala made the first man and woman out of clay, though the
    passage notes that this is contradicted by another myth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says all agree that Obatala forms the child in the mother’s womb,
    and women who desire motherhood pray to him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Albinoism and congenital deformities are described as regarded as Obatala’s
    handiwork, either as punishment for neglect or as a reminder of his power.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Obatala is styled 'Protector of the Town Gates' and is represented mounted
    on a horse and armed with a spear.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Temple door panels are said to show carvings of a horseman with a spear surrounded
    by a leopard, tortoise, fish, and serpent.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: Obatala’s special offerings are edible snails.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: Among Ewe-speaking people at Porto Novo, Obatala determines guilt or innocence
    by an oracle called Onshe or Onishe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The Onshe oracle uses a hollow wooden cylinder with draperies at one end and
    edible-snail shells at the other; it is placed on the kneeling accused person’s
    head.
  category: object
  evidence_refs:
  - ev:8
- id: obs:17
  text: When priests invoke the god, the cylinder rocks and falls; a forward fall
    means innocence and a backward fall means guilt.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: Priests say Obatala or a subordinate spirit strikes the accused to make the
    cylinder fall in the required direction.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:19
  text: Sceptics and native Christians are said to claim that a child is hidden in
    the cylinder to overbalance it; the passage labels the further story of killing
    such children as conjecture.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:20
  text: Odudua or Odua has the title Iya agbe, 'the mother who receives,' is called
    the chief goddess of the Yorubas, and is represented as a seated woman nursing
    a child.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:21
  text: Odudua’s name is explained as 'Black One,' and the passage says a smooth,
    glossy black skin is regarded as beautiful.
  category: attribute
  evidence_refs:
  - ev:10
