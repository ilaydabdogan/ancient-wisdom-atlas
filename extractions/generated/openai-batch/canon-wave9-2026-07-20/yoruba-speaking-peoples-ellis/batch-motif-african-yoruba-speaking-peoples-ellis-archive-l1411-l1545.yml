candidate_motifs:
- id: motif:1
  label: limited-domain sky deity
  taxonomy_refs: []
  basis: Olorun controls sky-related phenomena such as rain but cannot form a child;
    the passage says each god has distinct duties.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is a passage-level functional pattern rather than a supplied named
    taxonomy motif.
- id: motif:2
  label: delegated cosmic governance
  taxonomy_refs: []
  basis: Priests say Olorun made Obatala, handed over management of the firmament
    and world, and retired.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage describes making and delegation, but not a full succession
    myth.
- id: motif:3
  label: human formation from clay and divine womb-forming
  taxonomy_refs:
  - sacred_birth
  basis: One myth credits Obatala with making the first man and woman out of clay,
    and the passage says he forms children in the womb and receives prayers for motherhood.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The first-human clay myth is explicitly noted as contradicted by another
    myth; the womb-forming function is presented as generally agreed.
- id: motif:4
  label: divine judgment by oracle object
  taxonomy_refs:
  - divine_judgment
  basis: The Onshe cylinder’s fall determines guilt or innocence after priests invoke
    Obatala.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage also reports sceptical explanations for the mechanism.
- id: motif:5
  label: armed guardian at town gates
  taxonomy_refs: []
  basis: Obatala as Protector of the Town Gates is represented mounted on a horse
    and armed with a spear, with related temple door carvings.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No supplied taxonomy family directly matches the gate-guardian image.
- id: motif:6
  label: maternal chief goddess with nursing child
  taxonomy_refs:
  - mother_goddess
  basis: Odudua is called chief goddess and 'the mother who receives' and is represented
    nursing a child.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: Only the opening description of Odudua appears in this passage.
- id: motif:7
  label: visionary revelation of futurity
  taxonomy_refs:
  - wisdom
  basis: Obatala is associated with entering humans, predicting the future, inspiring
    priests and oracles, and unveiling futurity through visions.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage states visionary prediction but does not elaborate a narrative
    quest or teaching episode.
comparison_claims:
- id: claim:1
  claim: The passage reports an Obatala guilt-or-innocence oracle among Ewe-speaking
    people at Porto Novo, indicating the same divine-judgment function in a nearby
    group named within the passage.
  claim_level: same_function
  target: Ewe-speaking Peoples at Porto Novo; Onshe or Onishe oracle
  evidence_refs:
  - ev:8
  counter_evidence_refs:
  - ev:9
  confidence: medium
  limitations: This is a single ethnographic report inside the passage; it does not
    establish historical transmission or broader distribution.
- id: claim:2
  claim: The passage reports that missionaries translated Olorun as Christian 'God'
    or Jehovah, but it explicitly rejects full functional equivalence by describing
    Olorun as a limited sky nature-god rather than omnipotent.
  claim_level: linguistic_similarity
  target: Christian Jehovah / God as missionary translation equivalent
  evidence_refs:
  - ev:3
  counter_evidence_refs:
  - ev:3
  confidence: medium
  limitations: The comparison is presented as a missionary translation practice criticized
    by the author, not as an endorsed same-motif claim.
