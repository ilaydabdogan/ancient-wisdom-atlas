  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Iyewa lagoon is said to have once been a woman.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Iyewa is described as a poor woman with two children, whom she supported by
    gathering firewood in the forest and selling it for food.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Iyewa and her children wander farther into the forest than usual, cannot find
    the path home, grow thirsty and tired, and rest under a large tree.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The children cry to their mother for water; Iyewa searches unsuccessfully
