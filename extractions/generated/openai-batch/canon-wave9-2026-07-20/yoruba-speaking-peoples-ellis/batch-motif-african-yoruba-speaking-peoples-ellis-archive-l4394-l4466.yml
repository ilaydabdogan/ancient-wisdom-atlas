canonical_text:
  quote: ''
  summary: The passage comments on a Yoruba tale in which a spirit is beaten out of
    a child and compares it with Northern European changeling stories while distinguishing
    possession from elfin substitution. It describes a belief that hyenas may be men
    in nocturnal disguise who lure victims, notes broader metamorphosis into animals
    and natural features, identifies the huje shrub as a metamorphosed Yoruba belle,
    and narrates how Iyewa, a poor mother lost in the forest with her children, prayed
    to the gods and was changed into a lagoon so that the children could drink and
    survive.
  language: English
  quote_policy: summarized
