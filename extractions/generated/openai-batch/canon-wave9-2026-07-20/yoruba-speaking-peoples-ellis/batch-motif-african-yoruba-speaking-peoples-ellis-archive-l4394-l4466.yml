- id: obs:1
  text: A spirit is driven out by beating, and the spirit flees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that the Yoruba tale has a close parallel with Northern
    European changeling stories in which a being acts like an infant before a foster-mother
    and others but drops the disguise when alone.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The author distinguishes the Yoruba version from European changeling stories:
    in Europe an elfin child is substituted for a stolen human child, while in the
    Yoruba version the child himself is possessed by an evil spirit; Abika possession
    is also mentioned as an analogy with different results.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The hyena, called Epelekpe, is said to be often understood as a man who assumes
    that disguise at night to prey on sheep, cattle, and sometimes humans.
  category: attribute
  evidence_refs:
  - ev:4
