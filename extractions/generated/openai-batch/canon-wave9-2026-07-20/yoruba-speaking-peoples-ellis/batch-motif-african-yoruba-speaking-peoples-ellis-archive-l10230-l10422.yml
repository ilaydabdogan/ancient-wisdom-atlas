canonical_text:
  quote: ''
  summary: The passage contains the close of one Tortoise tale in which a king gives
    Tortoise half the palace; a tale in which Tortoise deceives Elephant into carrying
    him to town, escapes Elephant's anger by being thrown into a swamp, and explains
    why Elephant no longer comes to town; a tale in which Adun is lured away by a
    suitor made of borrowed body parts, is confined by a living head with Tortoise
    as horn-watchman, and escapes by following a babalawo's advice to stuff Tortoise's
    horn with oil-soaked ekuru; and the opening of a tale in which the maiden Buje
    refuses suitors until Tortoise boasts that he will obtain her for the king.
  language: English
  quote_policy: summarized
