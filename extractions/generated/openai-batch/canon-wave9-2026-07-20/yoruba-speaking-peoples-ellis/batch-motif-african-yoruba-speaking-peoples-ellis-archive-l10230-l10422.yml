  locator: 10366-10372
  quote_or_summary: The head challenges Adun, she gives an excuse, and after repeated
    failed attempts to flee she asks the babalawo what to do.
  source_text_path: texts/public-domain/yoruba/project-gutenberg/yoruba-speaking-peoples-ellis.md
  rights_note: Public domain source; summarized.
