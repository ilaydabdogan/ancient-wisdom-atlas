comparison_claims:
- id: claim:1
  claim: 'The Elephant episode can be cautiously compared to the trickster_boundary
    motif family because Tortoise crosses status and place boundaries by deception:
    a small trickster figure makes a powerful forest animal carry him into town and
    then escapes retaliation.'
  claim_level: same_motif
  target: trickster_boundary
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This is a motif-family comparison only; the passage gives no evidence
    for historical contact, common inheritance, or comparison to a named external
    text.
- id: claim:2
  claim: The Adun episode has a limited functional resemblance to shapeshifter or
    monstrous-suitor patterns because an attractive suitor's body is revealed as borrowed
    and detachable, leaving a head that confines the woman.
  claim_level: same_function
  target: shapeshifter
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: low
  limitations: The suitor does not explicitly transform; the body is assembled from
    borrowed parts and then dismantled by their owners.
- id: claim:3
  claim: Adun's escape can be compared cautiously to wisdom-pattern episodes in which
    advice enables a vulnerable figure to overcome a guard or alarm mechanism.
  claim_level: same_function
  target: wisdom
  evidence_refs:
  - ev:12
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is based only on the babalawo's practical counsel and
