candidate_motifs:
- id: motif:1
  label: Trickster wins a wager by making a stronger animal carry him
  taxonomy_refs:
  - trickster_boundary
  basis: Tortoise wagers that he will ride Elephant, manipulates Elephant's pride,
    gains a ride into town, and publicly claims dominance over him.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not itself name a taxonomy; the trickster label is an
    analytic fit based on Tortoise's deceptive actions.
- id: motif:2
  label: Threatened trickster redirects punishment to a place of escape
  taxonomy_refs:
  - trickster_boundary
  basis: When Elephant threatens to smash Tortoise on stones, Tortoise falsely says
    the swamp will kill him; once thrown there, he escapes by diving in the mire.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage presents the episode as action, not as an explicit named motif.
- id: motif:3
  label: Etiology for why Elephant no longer comes to town
  taxonomy_refs: []
  basis: After being tricked and mocked, Elephant returns to the forest, is called
    foolish by other elephants, and the tale states that Elephant has not come to
    town since then.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No matching available taxonomy reference is provided for this etiological
    animal-tale pattern.
- id: motif:4
  label: Attractive suitor revealed as a detachable or borrowed-body being
  taxonomy_refs:
  - shapeshifter
  basis: A person borrows legs, arms, and a body to appear attractive to Adun; those
    parts are removed on the road, leaving only a head.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: low
  cautions: The text describes borrowed and reclaimed body parts rather than direct
    transformation, so the connection to shapeshifting is partial.
- id: motif:5
  label: Captive woman escapes by disabling an alarm guardian with food
  taxonomy_refs:
  - wisdom
  basis: Adun is repeatedly prevented from escaping by Tortoise's horn alarm, consults
    the babalawo, blocks the horn with palm-oil-soaked ekuru, and flees while Tortoise
    eats.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: The wisdom taxonomy is broad; the passage attributes the plan specifically
    to the babalawo's practical advice.
- id: motif:6
  label: Desired maiden refused by all and pursued through Tortoise's boast
  taxonomy_refs:
  - trickster_boundary
  basis: Buje refuses rich men, chiefs, and the king; Tortoise claims he will get
    her and is promised a palace reward if successful.
  evidence_refs:
