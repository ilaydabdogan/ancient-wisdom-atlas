canonical_text:
  quote: ''
  summary: The passage describes comparative and Yoruba-related marriage, widowhood,
    adultery, divorce, child-custody, rank, and kinship rules. It includes child betrothal
    and virginity comparisons, parental limits on a daughter's marriage choice, lactation
    abstinence, post-mortem distribution of wives and concubines, former and current
    levirate practices, adultery penalties, divorce and child custody, remedies for
    a neglected wife, royal women's partnership liberty, and prohibitions on marriage
    within traceable blood kin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports comparative cases in which child betrothal or chiefly
    status is associated with expectations of premarital chastity or virginity.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Parents are said not to be able to force a daughter to marry a suitor she
    dislikes, but they can prevent a marriage they disapprove of and punish misconduct
    with that man.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Children are usually suckled for three years, and during lactation the wife
    must not cohabit with her husband.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When a man dies, his wives and concubines are divided among his sons, but
    a son may not take his own mother.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Formerly, the next younger brother married the deceased elder brother's head
    wife; if the deceased was childless, the first son of the new union was named
    after the deceased and regarded as filling the son's place.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: At the described present time, a widow-iyale is not obliged to marry her deceased
    husband's brother and does not become the wife of one of the husband's sons; a
    later non-brother-in-law husband must repay the first husband's relatives the
    prior wife-payment.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Adultery is defined as involving a married woman; a wife's adultery can be
    punished by death or divorce, though the usual response is beating the wife and
    recovering damages from the adulterer.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: If a wife is divorced or put away, the husband retains her children, with
    delayed transfer if a child is too young to leave the mother.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A neglected wife can summon her family to a palaver; if the husband does not
    improve or refuses proper treatment, she may leave him, and the family may flog
    him if he is of inferior rank.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Daughters of kings or chiefs can live with or marry whom they please and change
    partners as they please.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Marriage is forbidden in the same blood on both the father's and mother's
    sides as far as relationship can be traced.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Relationship by affinity is said not to prohibit marriage, so a man may marry
    multiple sisters, aunt and niece, and even mother and daughter, though the last
    unions are uncommon.
  category: relationship
  evidence_refs:
  - ev:12
