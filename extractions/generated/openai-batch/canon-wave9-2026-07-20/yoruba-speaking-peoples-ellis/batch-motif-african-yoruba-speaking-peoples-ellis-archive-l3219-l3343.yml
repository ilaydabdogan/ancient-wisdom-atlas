canonical_text:
  quote: ''
  summary: 'The passage summarizes conflicting Yoruba traditions about human origins:
    one says Obatala made the first man and woman from clay or mud; another says the
    first pair came with the gods from Yemaja’s body, were named Obalofun and Iya,
    settled at Ife, and populated the earth. It then recounts a migration tradition
    in which Okambi and companions travel south from the interior, encounter a water-covered
    region, use a black-cloth bundle containing earth and a palm-nut, rest on a rapidly
    grown palm tree, and begin making dry land with the help of a fowl scratching
    earth over the water.'
  language: English
  quote_policy: summarized
