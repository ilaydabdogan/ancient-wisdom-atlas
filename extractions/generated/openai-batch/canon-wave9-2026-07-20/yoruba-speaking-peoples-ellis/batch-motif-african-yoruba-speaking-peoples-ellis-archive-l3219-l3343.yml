comparison_claims:
- id: claim:1
  claim: The author treats the Obatala clay-or-mud creation variant as resembling
    the Genesis human-origin account but argues that borrowing need not be supposed.
  claim_level: independent_recurrence
  target: Book of Genesis human-origin account
  evidence_refs:
  - ev:10
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an authorial comparison in the passage, not a detailed textual
    alignment; the comparison is limited to the broad clay/mud human-making motif.
- id: claim:2
  claim: The author’s footnote links the clay or earth creation of humans to Greek
    examples in which Pandora is made from earth and Prometheus makes man from earth
    and water.
  claim_level: same_motif
  target: Greek myths of Pandora and Prometheus as cited by Ellis
  evidence_refs:
  - ev:11
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The Greek material is supplied only as a brief footnote; no historical
    connection is argued in the passage.
- id: claim:3
  claim: The passage cautiously compares the Yoruba migration-from-the-interior tradition
    with a cognate Tshi tradition and with a hypothesized broader southward movement
    ancestral to Tshi, Ga, Ewe, and Yoruba groups.
  claim_level: common_inheritance
  target: Tshi, Ga, Ewe, and Yoruba migration-from-interior traditions
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: low
  limitations: The passage frames this as possible or probable historical reconstruction
