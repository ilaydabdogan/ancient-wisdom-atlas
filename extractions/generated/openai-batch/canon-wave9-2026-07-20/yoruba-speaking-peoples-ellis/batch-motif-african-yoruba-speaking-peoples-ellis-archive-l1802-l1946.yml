canonical_text:
  quote: ''
  summary: The passage describes Shango's wives and attendants, cult images, offerings,
    divination, sacred club and tree, lightning-related priestly customs, and a later
    myth in which Shango is driven from kingship, dies in a forest, descends into
    the earth as an orisha, and punishes unbelievers with thunder, fiery stones, and
    fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Shango is said to have married three sisters: Oya, Oshun, and Oba, each identified
    with a river.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The three wives accompany Shango; Oya brings Afefe, identified as wind or
    gale, while Oshun and Oba carry his bow and sword, and Biri, identified as Darkness,
    attends as Shango's slave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Images of Shango generally show him standing, surrounded by smaller standing
    images of his three wives with their palms joined before the bosom.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Offerings ordinarily made to Shango include oxen, sheep, and fowls, with human
    beings offered on important occasions; his colours are red and white.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Shango is consulted with sixteen cowries cast on the ground; back-up cowries
    are favourable and back-down cowries unfavourable.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Shango usually carries an oshe club made from the hard wood of the ayan tree,
    and the ayan tree is sacred to him because of this association.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Priests and followers of Shango wear a wallet described as emblematic of their
    lord's plundering propensities, and the chief priest is called Magba, meaning
    “The Receiver.”
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A house struck by lightning is invaded and plundered by Shango's disciples,
    a fine is imposed on the occupants, and lightning deaths or lightning-induced
    insensibility are treated as signs of Shango's claim on the victims.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Shango is described as subject to outbursts of temper in which he thumps overhead
    and hurls stones down at offenders.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A later myth presents Shango as a cruel and tyrannical King of Oyo to whom
    chiefs and people send a calabash of parrots' eggs with a message that it is time
    for him to sleep.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In that later myth, Shango refuses quiet strangling, fails to assemble supporters,
    flees by night, is abandoned by his wife, becomes lost in a pathless forest with
    one slave, and is found hanging from an ayan tree.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Chiefs, elders, and priests cannot find Shango's body, but discover a deep
    pit with an iron chain protruding and hear Shango speaking from within the earth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A small temple is erected over the pit, priests are left there to propitiate
    the new god and establish worship, and Oyo is told that Shango is not dead but
    has become an orisha living among the dead.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Some townspeople mock the proclamation that Shango is not dead and say instead
    that he hanged himself.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Shango comes with a thunderstorm, kills many scoffers with fiery stones, sets
    the town on fire, and is appeased after the populace beats the scoffers to death;
    the descent place is called Kuso and becomes a town.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
