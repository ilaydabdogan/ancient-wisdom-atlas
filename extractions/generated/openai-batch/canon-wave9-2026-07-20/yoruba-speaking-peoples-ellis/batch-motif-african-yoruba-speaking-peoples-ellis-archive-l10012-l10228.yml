canonical_text:
  quote: ''
  summary: The passage contains two Tortoise tales. In the first, rain washes Sigo
    into a gully; Tortoise rescues him only after Sigo agrees to become his slave,
    then hides him inside a drum whose song pleads for rescue. Women from Sigo's household
    intoxicate Tortoise, open the drum, and remove Sigo; afterward a crow croaks from
    the drum. In the second tale, Tortoise bargains with a king to make the king's
    dumb daughter Bola speak. He sets honey as a lure, accuses her of theft, and provokes
    her into speaking and singing before returning her to the astonished king.
  language: English
  quote_policy: summarized
