  quote: ''
  summary: The passage describes closed and reopened trade routes, negotiations with
    Abeokuta, and the signing of an 1893 treaty between Egba authorities and British
    representatives. It summarizes treaty terms concerning arbitration, trade freedom,
    abolition of human sacrifice, limits on territorial cession, and British guarantees
    of Egba independence. The passage then presents the narrator’s comparative characterization
    of Yoruba-speaking peoples and neighboring groups, attributing Yoruba town life
    and social development partly to geography, rivers, and ease of communication.
  language: English
