canonical_text:
  quote: ''
  summary: The passage introduces the Ogboni Society as a secret society closely connected
    with the Yoruba priesthood, describes its political and judicial authority, secrecy,
    reported punishments, patron deity Odudua as Earth, and possible relation to puberty
    initiation. It then outlines three orders of Yoruba priests, their divine patrons,
    insignia, colors, ranks, and the divinatory authority of the Babalawo as priests
    of Ifa.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Yoruba priesthood is described as divided into recognized orders, and
    the Ogboni Society, called Oshogbo in Jebu, is introduced as a secret society
    inseparably connected with the priesthood.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ogboni Society is described as holding governmental authority; kings must
    submit to its decrees, each town or village has a lodge, members use signs and
    passwords, and major decisions require Ogboni consent.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ogboni members are said to be popularly believed to possess a secret source
    of power, while the passage explains their effective power as collective organization,
    mutual assistance, and enforcement of decrees.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports, while marking uncertainty, that betrayal of Ogboni secrets
    is punished by death through torture in which a bound offender’s legs are scraped
    with sharp-edged shells.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Native reports cited in the passage variously describe the Ogboni Society
    as preserving religious customs or as exercising civil power; the passage says
    it concerns public matters generally.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The protecting deity of the Ogboni is identified as the goddess Odudua, whom
