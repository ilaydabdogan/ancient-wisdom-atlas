candidate_motifs:
- id: motif:1
  label: Deluge destroys the world followed by renewed habitability
  taxonomy_refs:
  - flood_and_renewal
  basis: Olokun destroys nearly all inhabitants in a flood; afterward the muddy world
    is made habitable again by Ifa and Odudua.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: The account is mediated by the ethnographer, who states that the story
    was adapted to Yoruba theology and probably derived from Mohammedans.
- id: motif:2
  label: Survivors rescued upward into the sky
  taxonomy_refs:
  - ascent
  basis: A few people are saved by Obatala, who draws them into the sky with a long
    iron chain during the flood.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage gives only a brief detail and does not elaborate a full ascent
    narrative.
- id: motif:3
  label: Deity descends from the sky to restore the world
  taxonomy_refs:
  - return
  basis: After the flood, Ifa comes down from the sky and helps make the world habitable.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The descent is part of a deluge-restoration episode rather than a separately
    developed return cycle.
- id: motif:4
  label: Initiation into esoteric divination with ongoing dependence on ritual specialists
  taxonomy_refs:
  - initiation
  - wisdom
  basis: The passage describes a heavy initiation fee, ambiguous oracle knowledge,
    repeated consultation with priests, and individual food abstention assigned at
    initiation.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: This is described ethnographically rather than as a mythic episode.
- id: motif:5
  label: Trickster-like boundary deity housed outside domestic space
  taxonomy_refs:
  - trickster_boundary
  basis: Elegba/Eshu is described as mischievous or malevolent, and a proverb explains
    that his house is made in the street rather than indoors because of his malicious
    disposition.
  evidence_refs:
  - ev:10
  - ev:12
  confidence: medium
  cautions: The passage emphasizes malevolence and phallic cult rather than a complete
    trickster narrative.
- id: motif:6
