comparison_claims:
- id: claim:1
  claim: The passage compares the Yoruba figure-reading system with a Siwah divination
    method using beans or sand and similar odd/even figure permutations.
  claim_level: same_function
  target: Siwah Derh el ful / Derh el raml divination
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is reported through the ethnographer's citation of James
    Hamilton and does not provide direct historical evidence beyond procedural similarity.
- id: claim:2
  claim: The passage states that the divination system and the deluge story were probably
    derived from Mohammedan sources.
  claim_level: historical_contact
  target: Mohammedan or Islamic-associated traditions as described by the author
  evidence_refs:
  - ev:1
  - ev:5
  - ev:7
  counter_evidence_refs: []
  confidence: low
  limitations: This is the author's conjecture; the passage itself offers limited
    supporting evidence and uses colonial-era terminology.
- id: claim:3
  claim: The passage explicitly connects Yoruba Elegba/Eshu with the Elegba described
    for Ewe-speaking peoples, presenting them as the same phallic divinity while noting
    stronger mischievousness in the Yoruba account.
  claim_level: same_motif
  target: Ewe-speaking Peoples' Elegba as referenced by the author
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The target tradition is mentioned only by reference to another volume,
    not described independently in this passage.
- id: claim:4
  claim: The passage draws an analogy between Elegba's phallus-club association and
    Priapus' phallus-cudgel association.
  claim_level: visual_similarity
  target: Priapus as referenced in the author's footnote
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: low
  limitations: The comparison appears only as an authorial footnote and is based on
    a limited object association.
