canonical_text:
  quote: ''
  summary: The passage compares a Yoruba divination figure system with a North African
    method using beans or sand, describes initiation fees and food abstentions for
    learners of divination, recounts a deluge narrative involving Ifa, Obatala, Olokun,
    and Odudua, and describes Elegba/Eshu as a phallic and mischievous deity with
    images, public ritual objects, sacrifices, and turkey-buzzards as messengers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The divination figures are described as read from right to left, and the author
    says the system is probably derived from Mohammedans.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A similar Siwah divination method is described in which beans are struck from
    one hand to another, odd or even results are marked, and figures are arranged
    in a square and read in multiple directions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Instruction in divination requires a heavy initiation fee, and the learner
    continues paying priests for explanations of ambiguous oracle meanings.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: At initiation, the priest usually tells the initiate to abstain from a particular
    article of food, varying by individual.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ifa is said to have left the world after settling at Ado and gone to live
    in the firmament with Obatala.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After Ifa's departure, mankind could not properly interpret the desires of
    the gods, and most gods became annoyed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Olokun, in anger, destroyed nearly all the inhabitants of the world in a great
    flood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Obatala saved a few survivors by drawing them into the sky with a long iron
    chain.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the flood, the world was muddy and unfit to live in until Ifa came down
    from the sky and, with Odudua, made it habitable again.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Elegba, also called Elegbara or Eshu, is described as a phallic divinity with
    a prominent propensity to make mischief.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Elegba is supposed to carry a short knobbed club that is regarded as a weapon
    of offence and is connected by the author with a phallic representation.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Elegba's image is represented naked, seated with hands on knees, and with
    a disproportionate phallus; it is found in front of almost every house under a
    small palm-leaf-roofed hut.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: A rude wooden phallic representation is planted beside Elegba's hut, appears
    in public places, and is paraded at certain festivals toward dancing young girls.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Because of a bargain made with Ifa, Elegba receives a share of every sacrifice
    offered to other gods.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: Elegba's stated sacrifices include cocks, dogs, he-goats, and, on very important
    occasions, a human victim whose entrails are placed before the image and whose
    body is suspended from a tree or poles.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: Turkey-buzzards are said to be sacred to Elegba and regarded as his messengers,
    with the author connecting this to their consumption of sacrificial remains.
  category: relationship
  evidence_refs:
  - ev:16
