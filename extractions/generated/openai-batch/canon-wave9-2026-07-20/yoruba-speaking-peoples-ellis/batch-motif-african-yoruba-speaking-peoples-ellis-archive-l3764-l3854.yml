canonical_text:
  quote: ''
  summary: The passage describes reported Yoruba human sacrifice practices in comparison
    with Ashanti, Dahomi, and the Gold Coast; royal funerary sacrifices and deaths
    of wives to accompany rulers; annual and periodic offerings; nighttime sacrifices
    to named deities; ritual decapitation and disposal of bodies; and late nineteenth-century
    efforts to abolish human sacrifices, including resistance at Ife where sacrifice
    is described as being made for the whole human race.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that human sacrifices occurred among Yoruba tribes but
    that, during the period known to Europeans, they did not involve the large-scale
    slaughters described for Ashanti and Dahomi.
  category: other
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The passage links the scale of human sacrifice to the political power of kings
    and chiefs and states that victims came from the masses, who did not favor the
    practice.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the death of an Oyo king in 1859, four men were sacrificed and forty-two
    wives poisoned themselves to accompany him to the Land of the Dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Ondo royal funerals, victims were assigned to stages and locations including
    corpse washing, palace entrances, the marketplace, the burial, and later interim
    sacrifices before a new king was installed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that two wives were usually expected to die when a king
    or chief died, either by suicide or selection and killing if no volunteers appeared;
    horses were often killed and buried with their owners.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Abeokuta annual 'basket-sacrifice' involved enclosing a victim in a long
    basket, throwing the victim from a height, and killing the victim with clubs;
    in prosperous times the victim might be spared and dedicated as a temple-slave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage reports annual or periodic human offerings at Ikoradu and Ikriku,
    including an offering every sixth year to Ogun at Ikriku.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In times of urgency, sacrifices were offered to named gods including Shango,
    Ifa, Elegba, Ogun, Olokun, and Olosa, usually at night while people remained in
    their houses.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The people were said to avoid direct reference to the sacrifice, using the
    phrase 'The night is bad'; temple drums and mournful chants signaled what was
    happening.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that a victim was decapitated before the image so that
    blood would spurt over it; for Elegba entrails were placed before him, while bodies
    offered to Olokun and Olosa were cast into the sea and lagoon respectively.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Commissioners in 1886 induced Ijesa and Ekiti rulers to sign an enactment
    abolishing human sacrifices, but met difficulty at Ife, where only some council
    members signed.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Oni of Ife said sacrifice at Ife was made for the whole human race, including
    the white man, and that discontinuing sacrifice on his behalf would cause his
    superior knowledge and derived arts to depart.
  category: speech
  evidence_refs:
  - ev:11
