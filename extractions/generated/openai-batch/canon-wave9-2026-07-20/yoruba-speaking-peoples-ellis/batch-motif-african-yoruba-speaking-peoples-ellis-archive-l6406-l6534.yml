canonical_text:
  quote: ''
  summary: The passage discusses Yoruba kinship terms for father, mother, companion,
    and child as derived from social functions such as power, protection, feeding,
    cooking, and suckling. It then describes marriage by bride payment, polygynous
    household organization, head-wife authority, child betrothal, marital sexual rights,
    repudiation for unchastity after betrothal, and the author's explanation of why
    virginity can become expected in brides.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Yoruba terms translated as father and mother do not
    originally refer only to biological fatherhood or motherhood.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Baba is described as meaning lord, master, great personage, or father, and
    as deriving from a root associated with violence, strength, and power.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage connects the father/lord term to men who would be hunters, warriors,
    defenders, and food providers for the community.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Iya is described as meaning mistress, lady, mother, or a food-holding vessel
    such as an earthen pot, basin, or calabash.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Iya is derived in the passage from a root meaning to feed, nourish, cherish,
    and be glad, and is glossed as the feeder.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Omo, child, is described as literally meaning suckling and as connected with
    roots meaning to drink or suck and with words for breast or udder.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Wives are said to be married by purchase, with the amount varying by the rank
    of the bride's father and husband, while the payment is described as compensation
    for the parents' loss of household services rather than as chattel purchase.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Marriage is described as giving the husband the wife's domestic services and
    an exclusive right to her embraces, although he may waive that right in favor
    of another person.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Men are said sometimes to lend wives or, more often, concubines to guests
    or friends; concubines in the household are usually slaves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Each wife is described as having her own house in the husband's compound,
    along with her own slaves and dependants.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The first-married wife is the head wife, called Iyale, and is responsible
    for preserving order among the women; junior wives are called Iyawo and are associated
    with trade or markets.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Girls of the better classes are described as often betrothed as children or
    infants, and betrothal gives the future husband marital rights except consummation
    until puberty.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: If a child-betrothed bride is found not to be virgin at consummation, the
    passage says this proves unchastity after betrothal and gives the future husband
    a ground for repudiation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: In a repudiation case, the husband may dismiss the girl by sending broken
    cowries to her mother, and the girl's family must return the bride payment and
    presents, although compromise is said to be more usual.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The passage says virginity in a bride is valued as proof that the betrothed
    has not infringed the future husband's exclusive marital privileges, not as a
    value in itself.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Unbetrothed girls are described as free to bestow their favors as they please,
    while upper-class girls are usually betrothed and therefore expected to be chaste.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
