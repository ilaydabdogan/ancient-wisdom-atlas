canonical_text:
  quote: ''
  summary: The passage describes Oro-day and the Oro Doko festival, including gendered
    seclusion, masked procession, bull-roarer use, animal killing and feasting, and
    the sacred Olumo boulder. It then explains Abiku as child-death spirits or spirits
    of children who die young, describes their entry into infants and their consumption
    of a child’s nourishment, and records maternal rites using food sacrifice, iron
    ornaments, painful incisions, and post-mortem corpse treatment to drive away,
    punish, or deter the Abiku.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On Oro-day, the voice of Oro is heard from morning to night, and women are
    confined to their houses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Oro is described as parading the town in a long shell-hung robe and a white
    wooden mask with blood-smeared lips, accompanied by a numerous following.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The annual Ondo festival called Oro Doko lasts three lunar months, with women
    required every ninth day to remain indoors from daybreak until noon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: During Oro Doko, men parade, whirl the bull-roarer, dance, sing, beat drums,
    kill stray dogs and fowls, and afterwards feast on them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A granite boulder called Olumo, located on the summit of a hill in Abeokuta,
    is sacred to Oro, and no one may ascend it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Oro is used for political purposes to preserve order
    in the community.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that it is death for a woman to see the instrument that
    produces the voice of Oro.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Abiku is defined as referring both to spirits of children who die before puberty
    and to evil spirits that cause children to die; a child dying before twelve is
    also called an Abiku.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage describes Abikus as spirits or demons in uninhabited tracts who
    suffer from hunger, thirst, and cold because they lack sacrifices and temples.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: An Abiku may enter a newborn child, but only one Abiku can dwell in the same
    child, and the entering Abiku must promise other Abikus a share of the comforts
    obtained.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: An indwelling Abiku is said to take much of the child’s food for itself and
    its companions, causing the child to pine away and become emaciated.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When a child is peevish, outside Abikus are believed to be hurting the child
    to force the indwelling Abiku to give them more food.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A mother who thinks an Abiku has entered her child offers food sacrifice,
    attaches iron rings and small bells to the child’s ankles, and hangs iron chains
    around the child’s neck.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The jingling of iron and tinkling of bells is said to keep Abikus at a distance.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: If the child does not improve, the mother may make small incisions in the
    child and put green peppers or spices in them to pain the Abiku and make it depart.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: If the child dies, it may be buried without funeral ceremony outside the town
    or village in the bush, or the corpse may be thrown into the bush.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: A mother may beat, pound, and mutilate the child’s corpse while threatening
    and cursing the Abiku, because the indwelling Abiku is believed to feel the blows
    and hear the threats.
  category: action
  evidence_refs:
  - ev:10
