  summary: 'The passage describes Yoruba grammatical and lexical features: restricted
    adverbs used with particular adjectives or verbs, the use of verbs, nouns, and
    compounds in place of conjunctions and prepositions, and a vigesimal numeral system
    that forms numbers by addition to or subtraction from tens and twenties. It also
    notes some proposed lexical parallels with Ewe, Ga, and Tshi forms.'
  language: English
