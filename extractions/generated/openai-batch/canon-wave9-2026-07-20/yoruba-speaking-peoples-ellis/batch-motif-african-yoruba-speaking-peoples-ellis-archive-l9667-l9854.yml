canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which an iyale is judged and
    killed after failing to return a child; a tale explaining why the ajao, a flying-fox
    or large bat, remained unburied after birds and rats both denied kinship with
    him; and the beginning of a tale in which the omitted kini-kini bird takes revenge
    on birds clearing land for a king by singing grass and bush back into growth,
    is trapped with birdlime on an odan tree, and produces cowries after being slapped
    by the king.
  language: English
  quote_policy: summarized
