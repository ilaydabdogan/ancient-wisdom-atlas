  source_text_path: texts/public-domain/yoruba/project-gutenberg/yoruba-speaking-peoples-ellis.md
  rights_note: Public domain source; concise summary used.
- id: ev:8
  type: summary
  locator: lines 2551-2560
  quote_or_summary: On important occasions a human victim is offered to Ogun; entrails
