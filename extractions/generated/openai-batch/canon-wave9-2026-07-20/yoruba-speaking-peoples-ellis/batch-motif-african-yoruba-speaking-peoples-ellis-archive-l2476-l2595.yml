candidate_motifs:
- id: motif:1
  label: market offering converted into annual human sacrifice
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Vendors offer cowries in a protected market; priests annually collect them
    to buy a slave sacrificed to Elegba.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents this as a reported cult practice; interpretation
    beyond offering, protection, and sacrifice is not supplied.
- id: motif:2
  label: annual calendrical slave sacrifice to a deity
  taxonomy_refs:
  - sacrifice
  basis: The passage reports annual slave sacrifices to Elegba at Wuru and Ondo, including
    a late-July timing at Ondo.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: Only the cited annual practices are described; broader calendar significance
    is not explained.
- id: motif:3
  label: deity dwelling on a mountain with a metal palace
  taxonomy_refs:
  - mountain
  basis: Elegba's principal residence is said to be on Mount Igbeti, where he has
    a brass palace and attendants.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives a sacred residence image but does not explicitly frame
    it as a cosmological mountain.
- id: motif:4
  label: bodily cutting as deity-connected sacrifice
  taxonomy_refs:
  - sacrifice
  - initiation
  basis: Circumcision is connected with Elegba worship and described as sacrifice
    of a portion of the organ; a similar operation on girls is performed shortly before
    puberty.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The source explicitly uses sacrificial language for circumcision; the
    initiation classification is cautious because the passage gives age and puberty
    timing but does not define the rite as initiation.
- id: motif:5
  label: nocturnal sexual visitation by a deity
  taxonomy_refs: []
  basis: Erotic dreams are attributed to Elegba, who consorts sexually with men and
    women during sleep in female or male form.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage reports attribution of dreams and includes the author's analogy;
    it does not describe a narrative episode with named dreamers.
- id: motif:6
  label: iron object as divine symbol and oath medium
  taxonomy_refs: []
  basis: Iron is sacred to Ogun; any iron piece can symbolize him, and oaths by Ogun
    involve touching an iron implement with the tongue.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No available taxonomy symbol for iron was supplied.
- id: motif:7
  label: blood offering as vital principle
  taxonomy_refs:
  - sacrifice
  basis: A human victim is beheaded on Ogun's stool so blood gushes over it, because
    blood is believed to contain the vital principle and to be acceptable to gods.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The explanation is given in the passage; no claim is made here about universality.
- id: motif:8
  label: war-success human sacrifice
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Before war, a town or tribe purchases a slave and sacrifices him to Ogun
    to ensure success.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage describes a specific pre-war sacrificial logic, not all Ogun
