comparison_claims:
- id: claim:1
  claim: The passage states that Yoruba circumcision, like that among the Ewes, is
    connected with Elegba worship.
  claim_level: same_function
  target: Ewe circumcision connected with Elegba worship
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only a brief comparison and does not describe the
    Ewe rite in this excerpt.
- id: claim:2
  claim: The passage says the attribution of erotic dreams to Elegba is also found
    in the western half of the Slave Coast.
  claim_level: same_motif
  target: western Slave Coast erotic dream attribution to Elegba
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is regional but unnamed in detail; no separate evidence
    from the western Slave Coast is quoted here.
- id: claim:3
  claim: The author compares Elegba's nocturnal sexual role to the functions of medieval
    European incubi and succubi.
  claim_level: same_function
  target: incubi and succubi of medieval Europe
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an authorial functional analogy, not evidence of historical
    contact or shared origin.
- id: claim:4
  claim: The author compares the belief that blood contains the vital principle and
    belongs especially to deity with Israelite rules about presenting blood and not
    eating it.
  claim_level: same_function
  target: Israelite blood offering and blood abstention practices cited from Genesis
    and Leviticus
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: low
  limitations: The comparison is made by the colonial-era author through biblical
    citations; the passage does not establish contact, inheritance, or detailed ritual
    equivalence.
