canonical_text:
  quote: ''
  summary: The passage describes worship of Elegba at Wuru and Ondo, including cowrie
    offerings, annual slave sacrifice, a mountain residence, circumcision and excision
    connected with his worship, and erotic dream visitations attributed to him. It
    then describes Ogun as god of iron and war, his iron symbols and oath practice,
    dog and human sacrifices, blood as vital principle, a pre-war sacrificial victim
    honored before death and believed to be reborn as a king, and the ritual use of
    victims' hearts to confer courage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A temple to Elegba is located in a palm grove near Wuru; Wuru's market is
    said to be under his protection.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vendors in Wuru throw cowries on the ground as thank-offerings; priests annually
    collect the cowries and use the sum to buy a slave for sacrifice to Elegba.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A slave is also sacrificed annually to Elegba at Ondo toward the end of July.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Elegba's principal residence is said to be on Mount Igbeti, with a brass palace
    and many attendants.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Circumcision is connected with Elegba's worship and is described as a sacrifice
    of part of the organ associated with the god; timing is fixed by Ifa consultation
    and is usually early in life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A similar cutting operation is performed on girls by women operators shortly
    before puberty, between ages ten and twelve.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Erotic dreams are attributed to Elegba, who is said to consort sexually with
    men and women during sleep in either female or male form.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ogun is identified as god of iron and war, patron of hunters, and one who
    sprang from the body of Yemaja.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Iron is sacred to Ogun; oath-swearing by Ogun commonly involves touching an
    iron implement with the tongue.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Blacksmiths and users of iron weapons or tools especially worship Ogun; any
    piece of iron can serve as his symbol, and the ground is sacred to him because
    iron ore is found in it.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The usual sacrifice to Ogun is a dog with fowls, palm oil, and minor foods;
    a dog head emblematic of this sacrifice is displayed in blacksmith workshops.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: On important occasions a human victim is offered to Ogun; entrails are exposed
    before the image, the body is suspended from a tree, and the victim is beheaded
    on Ogun's stool so that blood gushes over it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that blood is offered because it is believed to contain
    the vital principle and to be especially acceptable to gods.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Before war, a slave may be purchased at the expense of the town or tribe and
    sacrificed to Ogun to ensure success.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The day before a war sacrifice, the victim is ceremonially led through principal
    thoroughfares and the market and allowed unusual license short of escape.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: The victim is honored before sacrifice because he is believed to be born again
    and become a king; after beheading, the corpse is treated with great respect.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: For the war sacrifice to be effective, war leaders must take the field before
    the body becomes offensive.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: The passage reports that Ibadans sometimes paid priests of Ife to sacrifice
    a slave for them, and later attributed lack of success in the 1877 war to omitting
    this sacrifice.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:19
  text: Priests of Ogun take hearts from human victims, dry and powder them, mix the
    powder with rum, and sell the mixture to persons seeking courage.
  category: action
  evidence_refs:
  - ev:12
- id: obs:20
  text: The heart is described as the seat of courage, and swallowing it is believed
    to bring that quality into the system.
  category: attribute
  evidence_refs:
  - ev:12
