- id: ev:6
  type: summary
  locator: lines 2527-2542
  quote_or_summary: Ogun is god of iron and war, patron of hunters; iron is sacred,
    oaths involve touching iron with the tongue, blacksmiths and iron users worship
    him, any iron piece can symbolize him, the ground is sacred because of iron ore,
