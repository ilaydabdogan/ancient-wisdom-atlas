candidate_motifs:
- id: motif:1
  label: Sibling murder for coveted reward
  taxonomy_refs: []
  basis: The elder brother covets the younger’s thousand cowries, murders him in the
    forest, and takes the cowries.
  evidence_refs:
  - ev:1
