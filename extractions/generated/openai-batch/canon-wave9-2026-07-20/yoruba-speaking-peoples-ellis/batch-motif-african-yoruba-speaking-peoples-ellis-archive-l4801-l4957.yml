canonical_text:
  quote: ''
  summary: A folktale recounts two brothers rewarded at a village frolic; the elder
    murders the younger in the forest for his cowries. Months later an olu fungus
    grows from the dead child’s bones and sings to the mother, father, and king, revealing
    the murder. The elder brother confesses, is killed by royal order, and the younger
    returns to life. The narrator then explains the olu as connected with the child’s
    soul remaining with unburied remains because no funeral rites had been performed.
    The passage continues with descriptions of souls going to Deadland, grave goods,
    goat sacrifice, prayers for the journey, offerings to the dead, skull temples,
    warrior-grave petitions, and a proverb about the dead not seeing out of the grave.
    A new tale begins with a woman entrusting a valuable bead necklace to a neighbor
    who hides it in a mud wall and dies before revealing its location.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two boys perform songs and drums at a village gathering and are each rewarded
    with a thousand cowries, food, and drink.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the return journey, the elder boy leads the younger off the path into the
    forest, murders him, takes his thousand cowries, and returns home alone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The elder boy tells his mother that he left his brother behind on the road;
    later searches fail to find the younger child.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Months later the mother finds that the younger child’s body has decayed and
    that an olu fungus has sprung from his bones at the murder site.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The olu sings, tells the mother not to pluck it, recounts the village frolic
    and the cowries, and says the brother slew him there for the cowries.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The father and then the king encounter the olu; when each attempts to pick
    it, the olu addresses them and repeats its testimony.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: After hearing what the olu has sung, the elder brother confesses, and the
    king orders that he be slain because he slew his brother.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The elder brother is killed, and the younger brother comes back to life.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The narrator states that the olu is connected with the dead child because
    it sprang from his bones and was nourished by his decaying body.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The narrator suggests that, because no funeral rites had been performed, the
    child’s soul stayed with the remains instead of proceeding to Deadland and passed
    into the fungus.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that after bodily death the soul or ghost-man proceeds
    to Deadland, and grave goods and a goat sacrifice accompany wishes for a safe
    journey and the right path.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Offerings and prayers are made to the dead; sometimes a skull is exhumed and
    placed in a small temple where offerings are made.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Before war, offerings are made at the graves of renowned warriors and their
    help is requested.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: A proverb says that as grass cannot grow in the sky, the dead cannot look
    out of the grave into the street; the narrator presents this as possible evidence
    that the dead know events only when informed through sacrifice.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: A second tale begins with a woman leaving for the seashore to make salt, entrusting
    a valuable bead necklace to a neighbor in front of witnesses.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:16
  text: The neighbor hides the necklace in a mud wall, dies before the owner returns,
    and the hiding-place remains unknown when the owner asks for the necklace.
  category: sequence
  evidence_refs:
  - ev:14
