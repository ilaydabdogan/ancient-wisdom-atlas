  confidence: high
  cautions: The passage gives the motive and act clearly, but does not supply a formal
    motif label.
- id: motif:2
  label: Speaking plant or fungus reveals a murder
  taxonomy_refs: []
  basis: An olu fungus grows from the murdered child’s bones and sings the circumstances
    of the murder to the mother, father, and king.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  confidence: high
  cautions: The literal form is an edible fungus, not a tree; no available symbol
    taxonomy item directly matches fungus.
- id: motif:3
  label: Wrongdoer’s death restores murder victim
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The king says the elder brother will be slain so the child will come back
    to life; the elder is killed and the younger returns to life.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The restoration is stated briefly; the mechanism of return to life is
    not elaborated.
- id: motif:4
  label: Soul remains with unrited body and enters growth from remains
  taxonomy_refs: []
  basis: The narrator explains that because no funeral rites were performed, the child’s
    soul stayed with the remains rather than going to Deadland and passed into the
    fungus that grew from the bones.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This is the narrator’s explanatory interpretation of the tale, not a separate
    action narrated by characters.
- id: motif:5
  label: Afterlife journey to Deadland with provisions and path wishes
  taxonomy_refs:
  - afterlife_journey_map
  basis: The soul or ghost-man proceeds to Deadland; food, drink, cowries, property,
    goat sacrifice, and wishes for safe arrival and not straying from the right path
    are provided.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives a general ethnographic description rather than a single
    narrative episode.
- id: motif:6
  label: Offerings to dead for influence or aid
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The passage reports offerings and prayers to the dead, offerings to skulls
    in small temples, and offerings at warrior graves before war to request assistance.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
