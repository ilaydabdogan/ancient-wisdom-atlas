canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a little girl follows a
    goblin to the land of dead people, performs food-related tasks, disobeys instructions
    about picking ados, and is killed by beasts released when she breaks them. It
    then gives a tale about a poor young woman whose child is seized by an aranran
    bird in a tree. By repeatedly singing for the child’s return, she receives her
    child back along with valuables and becomes rich. An iyale refuses a gift from
    her, imitates the episode with another wife’s child, and is punished when the
    bird kills the child and throws down filth, urine, and bones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A little girl refuses to turn back when a goblin tells her she must leave
    the track, and they continue until they reach the land of dead people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The goblin gives the girl palm-nuts and a banana, telling her to eat the edible
    part and bring back the residue or skin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The goblin instructs the girl to pick three ados that say nothing and not
    to pick the ados that cry out to be picked; she instead picks three speaking ados.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the girl breaks the ados on the way home and at the door, lions, leopards,
    hyenas, snakes, and other ferocious animals appear and attack her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The girl calls to a deaf person inside the shut house to open the door, but
    the person does not hear, and the beasts kill the girl on the threshold.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A poor young woman carries her child on her back with a plantain leaf because
    she lacks cloth.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The poor young woman goes into the forest to cut firewood and leaves her child
    asleep under a tall tree.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: An aranran, described in a note as a bird of prey, lives in the tree and carries
    the child up into the tree.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mother sees her child in the bird’s claws high in the treetop and sings
    for the child to be returned.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The bird first throws down a bag of coral beads and then other valuables,
    but the mother continues singing because the child has not been returned.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the third repetition, the bird brings the child down gently and places
    it on the ground.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The mother takes up her child, gathers the valuables, and becomes rich.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The young woman offers twenty strings of coral beads to the iyale, who refuses
    them after learning how she obtained them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The iyale takes another wife’s child into the bush, places it under the aranran’s
    tree, and goes away to cut wood.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The aranran carries off the second child, kills it, and eats it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: When the iyale sings the same song, the bird throws down a bag of filth, then
    causes a calabash of urine to break on her head, and finally throws down the child’s
    bones.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:17
  text: The editorial note states that the aranran tale is also about the discomfiture
