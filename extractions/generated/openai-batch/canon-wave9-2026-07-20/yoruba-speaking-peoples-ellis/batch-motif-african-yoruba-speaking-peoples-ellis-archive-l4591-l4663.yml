  summary: The passage reports a belief, as described by Ellis, that the dead return
    to earth and are reborn in their former families; a mother consults a babalawo
    to identify the ancestral ghost animating a newborn. The passage also discusses
    Deadland, dreams as evidence for a detachable spiritual individuality, a later
    distinction between life-phantom and death-phantom, and heredity or resemblance
    as a possible basis for metempsychosis.
