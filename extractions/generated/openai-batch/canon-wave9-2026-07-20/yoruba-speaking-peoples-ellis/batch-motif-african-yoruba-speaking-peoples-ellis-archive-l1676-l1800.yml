canonical_text:
  quote: ''
  summary: The passage narrates Orungan pursuing Yemaja, her fall, swelling, the formation
    of waters from her breasts, and the emergence of named deities and celestial bodies
    from her opened body; it also explains Ife as a commemorative holy city at that
    spot. The passage then discusses Shango as a major Yoruba thunder and lightning
    god, his stone thunderbolts, cloud palace, priests and worshippers, associated
    figures such as Ogun, Oshumare, Ara, and a sacred bird, and several authorial
    comparisons with other thunder or sky deities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Orungan rapidly gains upon the fleeing woman and stretches out his hand to
    seize her before she falls backward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yemaja's body swells, two streams of water gush from her breasts, and her
    abdomen bursts open.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two streams from Yemaja's breasts join and form a lagoon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A list of deities and celestial bodies comes from Yemaja's opened body, including
    Dada, Shango, Ogun, Olokun, Olosa, Oya, Oshun, Oba, Orisha Oko, Oshosi, Oke, Aje
    Shaluga, Shankpanna, Orun, and Oshu.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A town named Ife is said to have been built on the place where Yemaja's body
    burst open and to have become the holy city of the Yoruba-speaking tribes.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that the myth accounts for the origin of several gods by
    making them grandchildren of Obatala and Odudua, while other gods are said not
    to belong to that family group.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Shango is identified as the god of thunder and lightning, second in power
    to Obatala, and second to spring from Yemaja's body.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Shango bears the epithet Jakuta, interpreted as hurler or fighter with stones,
    and stone implements are believed to be his thunderbolts.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Shango is described as anthropomorphic, dwelling in an immense brazen palace
    in the clouds, keeping a large retinue and many horses, and also being god of
    the chase and pillage.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage reports a notion that Shango hurls red-hot iron chains forged
    by Ogun at offenders, but also notes that this is presented as a modern or foreign-looking
    notion, while priestly chants describe him hurling stones.
  category: other
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
- id: obs:11
  text: When a house is struck by lightning, the priests of Shango rush in to pillage
    it and to find the stone they believe caused the strike.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Priestly and lay worship speech addresses Shango as master or great king and
    describes his fiery stones punishing enemies, destroying trees and living creatures,
    and gleaming in darkness during storms.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Oshumare, the Rainbow, is said by some natives to be Shango's servant, carrying
    water from earth to the palace in the clouds.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: Ara, meaning Thunder-clap, is named as Shango's messenger, and a small bird
    called papagori is sacred to Shango.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: The passage explicitly compares or contrasts Shango's thunder functions with
    other traditions, including Zeus, Jupiter, Nyankupon, Nyonmo, Indra, Ewe thunderstorm
    ideas, Vulcan-forged thunderbolts, and Mixcoatl.
  category: other
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:12
