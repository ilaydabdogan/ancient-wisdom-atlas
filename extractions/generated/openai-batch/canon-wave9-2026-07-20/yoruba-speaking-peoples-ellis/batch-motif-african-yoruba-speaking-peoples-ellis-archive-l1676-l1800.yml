comparison_claims:
- id: claim:1
  claim: The passage presents Shango's wielding of thunderbolts as functionally comparable
    to thunderbolt-wielding sky or storm figures such as Zeus, Jupiter, Nyankupon,
    Nyonmo, and Indra.
  claim_level: same_function
  target: Thunderbolt-wielding sky or storm deities in Greek, Roman, Tshi, Ga, and
    Hindu examples named by the passage
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparisons are authorial and broad; the passage does not demonstrate
    historical connection among these cases.
- id: claim:2
  claim: The passage contrasts Shango with an Ewe notion of a birdlike animating entity
    of the thunderstorm, stating that no parallel to that form appears here and that
    Shango is anthropomorphic.
  claim_level: same_function
  target: Ewe birdlike thunderstorm animating entity
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim depends on the author's stated contrast and provides no Ewe
    source passage here.
- id: claim:3
  claim: The reported idea of Shango's red-hot iron chains forged by Ogun is compared
    by the passage to Jupiter's thunderbolts forged by Vulcan and is treated as possibly
    borrowed from a foreign source.
  claim_level: historical_contact
  target: Jupiter's thunderbolts forged by Vulcan
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs:
  - ev:8
  - ev:9
  confidence: low
  limitations: The passage frames the resemblance as suspicious but does not identify
    a transmission route; it also argues that stones, not chains, are the better-established
    Shango weapon.
- id: claim:4
  claim: A footnote states that hunting and thunder were likewise functions of the
    Aztec figure Mixcoatl, making a limited functional comparison with Shango's thunder
    and chase roles.
  claim_level: same_function
  target: Aztec Mixcoatl as cited in the passage footnote
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: low
  limitations: This is a brief footnote comparison and does not establish shared narrative
    structure or historical relationship.
