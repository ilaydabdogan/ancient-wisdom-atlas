canonical_text:
  quote: ''
  summary: A man reaches the lizard's house and finds the lizard lying as if dead.
    The man says Tortoise accused the lizard of showing him the man's yam store, but
    the lizard denies this and claims long sickness. The man then smashes Tortoise.
    Tortoise calls Cockroach and Ant to mend him, and the rough parts of Tortoise
    are explained as the mended places. An editorial note says Tortoise's usual cunning
    fails here because of greediness.
