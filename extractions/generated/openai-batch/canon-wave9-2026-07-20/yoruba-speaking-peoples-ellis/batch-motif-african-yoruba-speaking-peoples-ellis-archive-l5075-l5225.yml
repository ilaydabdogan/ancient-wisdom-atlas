canonical_text:
  quote: The Yorubas reckon time by moons and weeks.
  summary: The passage describes Yoruba reckoning of time by lunar months and a five-day
    week, the alignment of weeks with the new moon, named weekly holy days associated
    with Ifa, Ogun, Shango, and Obatala, the general rest day AkO-OJo, temple sweeping
    and a water procession for the gods, and comparisons with other African and non-African
    calendar systems.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Yorubas reckon time by moons and weeks; a moon or month is the interval
    from one new moon to the next, and the day begins at sunset when a new moon would
    ordinarily first be perceived.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Yoruba week is described as consisting of five days; six such weeks are
    supposed to make a lunar month, but the passage says the actual month contains
    five full five-day weeks and one shorter period of about four and a half days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the Tshi and Ga tribes add hours to seven-day weeks
    to align them with the lunar month, while the Yorubas deduct about twelve hours
    from the last five-day week.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The named days of the Yoruba week are given as AkO-OJo, Ojo-awo, Ojo-Ogun,
    Ojo-Shango, and Ojo-Obatala; Ojo-awo is sacred to Ifa, and the other named days
    are associated with Ogun, Shango, and Obatala.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: AkO-OJo is described as a Sabbath or general rest day, considered unlucky,
