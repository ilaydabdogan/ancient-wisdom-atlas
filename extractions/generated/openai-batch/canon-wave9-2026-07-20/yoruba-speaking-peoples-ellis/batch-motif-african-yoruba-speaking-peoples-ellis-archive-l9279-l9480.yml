canonical_text:
  quote: ''
  summary: The passage introduces Yoruba folk-lore tales called alo, professional
    tale reciters called akpalo, and distinguishes them from arokin chroniclers. It
    then gives an alo about a palm-oil-selling girl who follows a goblin for a missing
    cowry through strange lands and to the land of the dead, obeys instructions concerning
    food and three small calabashes, returns home, and gains slaves, animals, and
    cowries. The head wife then begins to send her own child to repeat the event through
    deception.
  language: English
  quote_policy: summarized
