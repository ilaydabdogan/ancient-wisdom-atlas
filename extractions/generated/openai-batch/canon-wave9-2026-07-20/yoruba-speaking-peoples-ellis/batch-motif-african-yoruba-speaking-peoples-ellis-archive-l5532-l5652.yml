canonical_text:
  quote: wishes for a safe and pleasant journey
  summary: 'The passage describes reported Yoruba funeral practices: preparation of
    the corpse, a three-day wake with feasting and gendered mourning, lamentations
    by household and professional mourners, a third-day procession, burial in a house-floor
    grave with grave goods and sacrifice to Elegba, protection or concealment of the
    grave, a ritual search for the deceased, and final placement or burning of associated
    remains and belongings.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The corpse is washed with rum or aromatic herbs, dressed in its best clothes,
    and has its thumbs and great toes tied together.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the deceased is a man, his head is shaved and the hair is wrapped in white
    cotton and buried behind the house; if a woman, exposed parts of the body are
    stained reddish with tree-bark decoction.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The corpse is wrapped in many native cloths and placed on a mat at the room
    door.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A death-feast begins while drums are beaten, muskets are fired, and intoxicants
    are used.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The widows and daughters of the deceased are described as chief mourners;
    after placing the corpse at the door, they are confined for the three days of
    lying in state and are forbidden to wash.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Women of the household, female friends, and professional mourners perform
    conventional lamentations while men feast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A professional mourner praises the deceased as a lion-like man and as a strong,
    spreading tree; widows and daughters lament being alone and unprotected.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the afternoon of the third day, men carry the body through the streets,
    while male friends and relations sing praises and throw cowries among spectators.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The corpse is interred in a grave dug in the earthen floor so that the head
    may project beyond the outer wall of the house.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Food, rum, and cowries are placed in the grave, the body is sprinkled with
    blood from a he-goat sacrificed to propitiate Elegba, and the grave is filled
    amid wishes for a safe and pleasant journey.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When valuable objects are buried, the grave surface may be moistened with
    water, and slaves or dependents sleep on it to protect it and hide its exact position.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The next day, male relations wander through town as if searching for the deceased
    and chant that they cannot find their father; bystanders answer that he has gone
    to his house.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Bones of sacrificed victims and consumed fowls and sheep are placed over the
    grave, and the deceased's everyday articles are carried into the bush and burned.
  category: action
  evidence_refs:
  - ev:9
