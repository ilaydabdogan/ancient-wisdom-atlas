canonical_text:
  quote: ''
  summary: The passage describes Yoruba relationship terms as broad address terms
    organized by generational grade rather than narrowly by blood relationship. It
    lists terms for father-, mother-, same-generation, child-, grandparent-, and grandchild-grade
    relations, notes their use for respect and for non-kin, compares the system with
    Tshi and Ga examples, and describes a possible shift among younger Yoruba speakers
    toward using egbon in the sense of uncle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Yoruba relationship terms are indefinite and are used both
    for relations and for strangers as terms of address.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Baba, father, is described as applying to an actual father, uncles on both
    sides, and men old enough to be fathers when respect is desired.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Iya, mother, is described as applying to women of the generation above the
    speaker when respect is desired.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ara is described as a same-generation term for brothers, sisters, and male
    and female cousins; gender and relative seniority require added qualifiers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Omo, child, is described as a non-gendered term for the generation below the
    speaker, including sons, daughters, nephews, nieces, cousins' children, and also
    as an address for domestic slaves.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Grandparent terms are described as covering grandfathers, great-uncles, grandmothers,
    and great-aunts; grandchild is expressed as omo-omo or omo-loju.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The passage groups the relationship terms into five grades: grandparents,
    parents, speaker, children, and grandchildren.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author identifies the system as the classificatory system of relationships
    and argues that the terms were originally address terms for grades, not terms
    primarily denoting consanguinity.
  category: other
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The passage says Tshi and Ga tribes also have this classificatory system,
    although they trace descent through the mother, and use one term for relations
    on either parental side and for some persons not considered relations by their
    own consanguinity rules.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The author states that, in the clan-system, the clan-name is the test of consanguinity,
    and that when the clan-system breaks down, broader grade terms may narrow and
    descriptive kin terms may be invented.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says younger Yoruba speakers are beginning to use egbon, elder,
    for the father's brother and mother's brother, while older people retain the classificatory
    term baba.
  category: speech
  evidence_refs:
  - ev:8
