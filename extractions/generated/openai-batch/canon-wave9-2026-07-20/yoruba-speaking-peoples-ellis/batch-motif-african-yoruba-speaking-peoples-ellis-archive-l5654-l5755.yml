canonical_text:
  quote: ''
  summary: The passage describes Yoruba funeral rites in which the deceased soul is
    thought to linger near its former home until property is destroyed, the deceased
    is called and told to depart, and a fowl is sacrificed and eaten on a road outside
    town to guide the soul. It also describes mourning restrictions, delayed funerals
    when families lack resources, the disgrace of lacking funeral rites, and later
    funeral societies among Yoruba-descended populations in the West Indies and Bahamas.
  language: English
  quote_policy: summarized
