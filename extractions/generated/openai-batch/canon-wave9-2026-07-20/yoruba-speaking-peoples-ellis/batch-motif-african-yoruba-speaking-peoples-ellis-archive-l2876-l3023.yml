canonical_text:
  quote: ''
  summary: 'The passage describes several Yoruba deities and associated emblems, rituals,
    sacred animals, and places: Orisha Oko as an agricultural and phallic fertility
    god with an annual yam festival; Osanhin as a medicine god; Aroni and Aja as forest
    beings who teach medicinal plant knowledge; Oye as the Harmattan wind giant; Ibeji
    as tutelary deity of twins with monkey taboos, pilgrimage, and twin effigy practices;
    Oshumare as a rainbow snake deity; and Oke as a mountain god associated with rockfalls,
    sacrifice, and a sealing cave refuge.'
  language: English
  quote_policy: summarized
