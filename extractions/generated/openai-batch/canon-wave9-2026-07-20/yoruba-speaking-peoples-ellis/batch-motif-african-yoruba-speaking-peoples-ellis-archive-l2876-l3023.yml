comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Orisha Oko with Priapus on the basis of phallic
    character and garden or crop protection.
  claim_level: same_function
  target: Priapus in classical tradition
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage claims resemblance but does not provide evidence for historical
    contact or shared origin.
- id: claim:2
  claim: The passage says Ibeji answers to Hoho of the Ewe tribes, indicating a nearby-tradition
    comparison for twin tutelary deities.
  claim_level: same_function
  target: Hoho of the Ewe tribes
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: Only a brief equivalence is provided, with no detailed Ewe comparison
    in this passage.
- id: claim:3
  claim: The passage says Oshumare is also common to the Ewe tribes under the name
    Anyiewo.
  claim_level: same_motif
  target: Anyiewo of the Ewe tribes
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage relies on a cross-reference to another work and gives limited
    comparative detail here.
- id: claim:4
  claim: The passage cautiously suggests that a reported Ondo custom of destroying
    one twin may have been borrowed from Benin tribes to the east.
  claim_level: historical_contact
  target: Benin tribes to the east
  evidence_refs:
  - ev:12
  counter_evidence_refs:
  - ev:12
  confidence: low
  limitations: The source qualifies the report with 'if true' and states that the
