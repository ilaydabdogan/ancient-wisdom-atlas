  cautions: No specific taxonomy reference for phallic fertility was supplied.
- id: motif:3
  label: forest abduction as medicinal initiation
  taxonomy_refs:
  - initiation
  - wisdom
  basis: Aroni and Aja carry or lead persons into the forest and teach medicinal plant
    knowledge; Aroni gives a token proving initiation.
  evidence_refs:
