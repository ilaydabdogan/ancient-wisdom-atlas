canonical_text:
  quote: ''
  summary: 'An ethnographic account describes Yoruba ceremonies at birth, marriage,
    and death: a priestess and babalawo attend birth, an ancestral soul is identified
    in the infant, sacrifices and purification by water and fire are performed; marriage
    is arranged through families with gifts, divination, feasting, and sometimes shrine
    sacrifice; at death a babalawo consults Ifa about natural death or witchcraft,
    performs sacrifices and purification, and invokes the deceased soul to depart
    peacefully.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When labor begins, a priestess takes charge of the woman and child; after
    birth, a babalawo comes to ascertain which ancestral soul has been reborn in the
    infant.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the ancestral soul is identified, the parents are told that the child
    must conform to the ancestor's manner of life; if the parents profess ignorance,
    the babalawo supplies the knowledge.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the seventh day for a girl, or the ninth day for a boy, the babalawo sacrifices
    a cock and a hen to Ifa and the Olori, the indwelling spirit of the child's head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The entrails of the two sacrifices are sprinkled with palm-wine and placed
    outside before Elegba's image to prevent Elegba from interfering with the mother
    and child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother and child are described as unclean; water from vessels before divine
    images is thrown on the roof, and the mother and child pass three times through
    the falling drops.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The babalawo makes a water of purification, bathes the child's head, repeats
    the child's name three times, and holds the child so that its feet touch the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the water rite, the fire is extinguished, embers are removed, the house
    is swept, live coals are brought, a fresh fire is lit, and another fowl sacrifice
    is made to Ifa.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Marriage proposals are made by the suitor's parents to the girl's parents;
    if accepted, the suitor sends native cloths and kola-nuts, and a wedding day is
    chosen after consulting a babalawo.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the wedding feast, women conduct the bride while singing; a female from
    the bridegroom's family remains concealed, secures the tokens of virginity, and
    displays or carries them to others; the bride's parents do not attend the feast.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Newly married couples sometimes visit a celebrated shrine and offer sacrifice
    together.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After death, mourners cry and gesture; the eldest son, or brother if there
    is no son, sends for a babalawo, who sacrifices a fowl and consults Ifa with a
    board and sixteen palm-nuts to determine whether death was natural or caused by
    witches.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: If the oracle says the deceased soul is in danger, a sheep or goat is sacrificed,
    sprinkled with palm-oil, and deposited outside the town at a place where two or
    more paths meet, in order to disperse evil spirits.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The babalawo prepares purification water with shea-butter and edible snails,
    dips a palm-branch sacred to Ifa into it, and sprinkles the corpse, room, and
    spectators.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The babalawo invokes the deceased soul to leave the house after the funeral
    rites, proceed peacefully to its destination, and have an open, safe road.
  category: speech
  evidence_refs:
  - ev:11
