candidate_motifs:
- id: motif:1
  label: ancestral soul reborn in infant
  taxonomy_refs:
  - death_rebirth
  - sacred_birth
  basis: The passage states that the babalawo identifies what ancestral soul has been
    reborn in the newborn and that the child must live according to that ancestor's
    manner of life.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The source is ethnographic description rather than a mythic narrative;
    the passage reports ritual belief without elaborating a full rebirth myth.
- id: motif:2
  label: purification by water and new fire after birth
  taxonomy_refs: []
  basis: The mother and child pass through falling water, the child's head is bathed,
    then the old fire is extinguished and a fresh fire is lit; the author explicitly
    describes this as a combination of purification by water and fire.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: No specific taxonomy motif for purification is supplied; water and fire
    are treated as symbols rather than a named motif family.
- id: motif:3
  label: sacrificial exchange for protection and ritual completion
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Animals are sacrificed to Ifa and the Olori, offerings are placed before
    Elegba to prevent interference, fowls are sacrificed at the close of birth rites,
    couples may sacrifice at a shrine, and animals are sacrificed during death rites
    to consult or protect the dead.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The grouped motif covers several distinct life-cycle ceremonies rather
    than one continuous narrative episode.
- id: motif:4
  label: oracle-guided life-cycle transitions
  taxonomy_refs: []
  basis: The babalawo identifies the ancestral soul at birth, is consulted for the
    wedding day, and consults Ifa after death about cause of death and dangers to
    the family or soul.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:8
  confidence: high
  cautions: This is a ritual pattern in the passage; no direct taxonomy reference
    is supplied for oracular governance of transitions.
- id: motif:5
  label: crossroads offering disperses harmful spirits
  taxonomy_refs: []
  basis: A sacrificed carcass sprinkled with palm-oil is placed where two or more
    paths meet, which the passage says causes evil spirits to disperse in as many
    directions as there are paths.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not identify the crossroads with a named deity or broader
    mythic structure.
- id: motif:6
  label: after-death journey on an open road
  taxonomy_refs:
  - afterlife_journey_map
  basis: The babalawo invokes the deceased soul to leave the house, proceed peacefully
    to its destination, and find the road open and good.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage gives a journey formula but not a detailed map of the afterlife.
- id: motif:7
  label: ritualized marriage with divination and shrine sacrifice
  taxonomy_refs:
  - sacred_exchange
  basis: A babalawo is consulted to appoint the wedding day, and some newly married
    couples visit a shrine and offer sacrifice together.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: medium
  cautions: The passage describes religious actions around marriage, not a divine
    marriage myth or union with a deity.
comparison_claims:
- id: claim:1
  claim: The passage states that Yoruba birth ceremonies resemble those of the Ewe-speaking
    peoples, with some changes attributed to increased priestly influence.
  claim_level: same_function
  target: Ewe-speaking peoples' birth ceremonies
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only a general comparison and does not reproduce
    the Ewe rites in detail.
- id: claim:2
  claim: The passage compares the impurity and purification of mother and child with
    practices among the Tshi and Ewe tribes.
  claim_level: same_function
  target: Tshi and Ewe purification practices around childbirth and menstrual impurity
  evidence_refs:
  - ev:3
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is stated by the author and is not independently documented
    within this passage.
- id: claim:3
  claim: The passage states that Yoruba death ceremonies chiefly differ from those
    of the Ewe tribes through the addition of various religious observances.
  claim_level: same_function
  target: Ewe tribes' death ceremonies
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: low
  limitations: The passage emphasizes difference rather than detailed shared structure
    and provides no full account of the Ewe ceremonies here.
- id: claim:4
  claim: The author speculatively connects the abstention of the bride's parents from
    the wedding feast with a possible survival from marriage by capture.
  claim_level: same_motif
  target: marriage by capture pattern
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: low
  limitations: The passage itself marks the claim as tentative with 'perhaps'; it
    is an interpretive survival claim, not a directly observed rite of capture.
