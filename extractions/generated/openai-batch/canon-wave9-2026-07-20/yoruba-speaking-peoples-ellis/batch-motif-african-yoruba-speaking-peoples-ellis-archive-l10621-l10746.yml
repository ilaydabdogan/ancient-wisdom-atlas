  summary: The author presents Tshi, Ewe, and Yoruba groups as related traditions
    at different stages of cultural development, then describes beliefs in indwelling
    spirits of natural features, local worship and sacrifice to such spirits, and
    the making of simulacra from habitat materials to bring a god nearer to worshippers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Tshi, Ewe, and Yoruba groups have a common origin
    and are treated as representing different stages of culture.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that among Tshi-speaking tribes everything in nature not
    made by human hands is believed to have an animating principle, spiritual second-self,
    or indwelling spirit.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Indwelling spirits are described as able to be beneficial or harmful depending
    on whether they are propitiated or neglected.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage presents a sequence in which belief in a human indwelling spirit
    is extended to animals, plants, and then inanimate nature.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The death of a drowned person is described as being explained by a water-spirit
    drawing the person down and strangling him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The most important indwelling spirits are said to be those of rivers, lagoons,
    the sea, mountains, rocks, and shoals, while spirits of bushes, grasses, and stones
    receive less regard.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Fishermen are described as paying special attention to spirits of the sea,
    shoals, and reefs, while agriculturists worship spirits of nearby streams, cliffs,
    rocks, and large silk-cotton trees.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Objects of worship are described as local and worshipped by those in their
    neighborhood.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Worship and sacrifice are described as taking place in the habitat of the
    spirit or god, such as under a rock or on a stream or lagoon bank.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the god is understood as the indwelling spirit of a rock or stream, the
    passage says there is no need for a myth of origin or a tangible representation.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: The making of an image or simulacrum of a god is described as weakening the
    tie between the indwelling spirit and the object it animates.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says a simulacrum must be made from material obtained from the
    god's habitat, or from a portion of the thing the god animates.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Examples of simulacra include a fragment of rock from an inhabited boulder
