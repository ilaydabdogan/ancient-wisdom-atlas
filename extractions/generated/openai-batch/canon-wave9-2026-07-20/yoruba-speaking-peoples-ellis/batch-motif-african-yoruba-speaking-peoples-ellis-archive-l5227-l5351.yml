canonical_text:
  quote: ''
  summary: The passage argues that general days of rest among the Yoruba and other
    peoples may derive from moon-worship. It describes new-moon festivals or Sabbaths
    among Mendi, Bechuana, Tshi, Ga, Yoruba, and Jewish contexts; discusses sacred
    rest days dedicated to gods; and states that violation of such days could be viewed
    as unlucky or punishable, including by death among some groups.
  language: English
  quote_policy: summarized
