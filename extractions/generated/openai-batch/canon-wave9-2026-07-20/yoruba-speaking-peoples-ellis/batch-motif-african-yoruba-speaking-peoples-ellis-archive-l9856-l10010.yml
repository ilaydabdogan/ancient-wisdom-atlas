canonical_text:
  quote: ''
  summary: The passage finishes a tale in which a king's little son accidentally releases
    a cowrie-producing kini-kini bird, is punished by losing an ear, recaptures the
    bird by drumming for dancing birds, and has his ear restored when a dead leaf
    changes into an ear. The passage then introduces Yoruba Tortoise Stories, describing
    Awon the tortoise as an anthropomorphic, crafty, superhuman tale figure comparable
    in function to Anansi the spider in Gold Coast tales. It also notes tortoise proverbs,
    tortoise-fire, possible totemic associations, temple-door carvings, and begins
    a tale about Sigo setting out as a hunter.
  language: English
  quote_policy: summarized
