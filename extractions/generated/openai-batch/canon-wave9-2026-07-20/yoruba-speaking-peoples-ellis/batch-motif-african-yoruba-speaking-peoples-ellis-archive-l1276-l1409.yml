  quote: Olorun is the sky-god of the Yorubas
  summary: The passage describes Yoruba chief gods, the reduction of local spirits
    by more general gods, the continuing role of tutelary deities, the meaning of
    the term orisha, and the attributes and limited cult of Olorun as sky-god or deified
    firmament.
  language: English
  quote_policy: quoted
