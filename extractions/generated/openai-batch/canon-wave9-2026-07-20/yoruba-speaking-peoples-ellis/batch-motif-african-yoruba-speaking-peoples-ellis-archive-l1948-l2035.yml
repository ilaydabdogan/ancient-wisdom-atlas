canonical_text:
  quote: ''
  summary: The passage discusses several Shango myths and the narrator's interpretation
    of them. It first comments on a prior story of Shango's suicide, the sacred ayan
    tree, parrots' eggs, an iron chain, and Shango's title as King of Kuso. It then
    recounts a myth in which Shango, son of Obatala and husband of Oya, Oshun, and
    Oba, obtains and eats a powerful charm. Oya eats the remainder; both Shango and
    Oya emit flames from their mouths. Shango takes an iron chain, stamps the earth
    open, and descends into it with his wives, leaving the chain protruding. The narrator
    compares elements of this myth to Arabian Nights motifs and suggests outside influence.
    A final myth says that Shango returns from beneath the earth, quarrels with Oya
    over stolen medicines, pursues her to her brother Olokun by following the Sun,
    and makes a commotion at Olokun's palace.
  language: English
  quote_policy: summarized
