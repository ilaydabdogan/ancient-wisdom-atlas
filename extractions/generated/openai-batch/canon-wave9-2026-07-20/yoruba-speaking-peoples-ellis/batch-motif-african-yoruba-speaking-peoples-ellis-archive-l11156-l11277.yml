canonical_text:
  quote: ''
  summary: 'The passage gives a comparative conclusion on Yoruba religious development:
    local and nature gods become generalized or absorbed, myths arise about divine
    parentage and adventures, manes-worship is compared with neighboring groups, priesthoods
    become increasingly organized, and religion is characterized by the author as
    ceremonial rather than moral. It then compares ritual offense and divine retaliation
    with Hebrew, Greek, and colonial Christian examples.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that among Yoruba tribes, except in Jebu areas, open country,
    large towns, and circulation have contributed to the near disappearance of the
    local god and to most gods being known and worshipped across the tribes.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that when the origin of nature-gods as indwelling spirits
    of natural objects or phenomena is forgotten, myths arise about the parentage
    and adventures of the gods.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage describes Yoruba manes-worship as less developed or placed lower
    than among the Tshi and Ewe; ghost-gods may disappear, be absorbed into another
    god, or become national or general gods.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that priesthood is a guild or fraternity requiring special
    knowledge and preliminary training or apprenticeship.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage contrasts local Gold Coast priest groups, Ewe priests dedicated
    to specific general gods, and Yoruba priestly organization with three recognized
    orders subdivided into grades.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The passage gives the example that a Yoruba priest of Shango attempting to
    consult Ifa would cause commotion, indicating guarded ritual privileges among
    priesthoods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage characterizes religion among the three groups as ceremonial worship
    in which gods are offended by neglected or omitted rites and judge acts rather
    than motives.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that moral offenses such as murder or robbery would not
    concern the gods if the expected homage were paid, while a blameless person could
    still be punished for omitting a customary rite.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage cites Hebrew examples involving Jacob and Esau, and Uzzah touching
    the ark, to illustrate divine favor or punishment based on ritual relation rather
    than social morality or intention.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage cites a Greek example in which Laodamia forgets usual sacrifices
    and Protesilaus becomes the first hero slain before Troy.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says that some colonial populations described as nominally Christian
    are portrayed as treating regular church or chapel attendance and ceremonial homage
    as sufficient for future salvation despite grave moral offenses.
  category: attribute
  evidence_refs:
  - ev:9
