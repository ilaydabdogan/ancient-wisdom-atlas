canonical_text:
  quote: ''
  summary: The passage discusses religious toleration on the Gold and Slave Coasts,
    compares Yoruba gods and practices with ancient Greek, Roman, Khond, and wider
    religious patterns, and then compares kinship and descent systems among Tshi,
    Ga, and Ewe groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says people on the Gold and Slave Coasts have liberty of thought
    in religion, may worship many gods or none, but must show outward respect and
    not insult any god to avoid calamities.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that the Yoruba religious system has a striking resemblance
    to that of the ancient Greeks.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Olorun is described as the sky-god proper and as being gradually displaced
    by the more anthropomorphic Obatala; this is compared with Uranus being displaced
    by Kronos.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Obatala is said to marry Odudua, who represents the earth; the author compares
    this with Kronos marrying Rhea.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The passage pairs several Yoruba deities with Greek counterparts: Olokun
    with Poseidon, Ogun with Hephaestus, Orisha Oko with Priapus, Osanhin with Asklepios,
    Orun with Helios, and Oshu with Selene.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hermes is described as Zeus' messenger, lightning, and protector of plunderers;
    Shango is described as the god of lightning and plunder.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ifa is described as the god of prophecy and a being who wards off evil and
    affords help; he is compared to Apollo.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage mentions tree spirits, river-gods, sea-spirits, metamorphosis
    into a brook, spring, or lagoon, and one example of a girl transformed into a
    shrub.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The gods, when consulted, are said to give oracular responses comparable to
    answers from the Oracle of Delphi.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage says the Yorubas, like the Greeks, offer human sacrifices in times
    of national need.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says every god of note on the Gold and Slave Coasts has a sacred
    dance known only to the initiated.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The author classifies the pantheon as composed of nature-gods and ghost-gods
    and compares Yoruba objects of worship with those of the Khonds of India and with
    similar patterns worldwide.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage argues from systems of consanguinity that descent through mothers
    was first in order.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: Among the Tshi tribes, descent is described as solely in the female line,
    with clan-name as the test of kinship, marriage within the clan forbidden, and
    succession following blood-descent through a brother or sister's son.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: Among the Ga tribes, descent is also in the female line and marriage in the
    mother's family is forbidden, but paternal influence has begun to appear in some
    cases of office or dignity.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:16
  text: Among Ewe groups, the western Ewe are compared with the Ga, while the eastern
    Ewe in Dahomi are said to show both-sided blood descent and male succession among
    higher orders, with lower orders still tracing descent in the female line.
  category: relationship
  evidence_refs:
  - ev:16
