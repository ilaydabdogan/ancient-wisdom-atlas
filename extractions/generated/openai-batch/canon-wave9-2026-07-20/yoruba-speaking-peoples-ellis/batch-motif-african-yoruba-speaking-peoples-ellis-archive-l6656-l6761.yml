literal_observations:
- id: obs:1
  text: Land is described as belonging collectively to the community and being vested
    in the chief, who distributes it among households and families as needed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person allotted land cannot be dispossessed; the usufruct descends to his
    children, but the land itself cannot be sold by him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Land that goes out of cultivation and becomes overgrown with bush or forest
    reverts to the community.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Among the Yoruba tribes, the passage says an individual-property notion is
    beginning to appear because a chief can sell or give away unoccupied waste-land.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Purchased land becomes the purchaser's absolute property, but trees, crops,
    and houses on the land remain the vendor's property unless separately sold.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A debtor may be confined in a debtor's prison by the Bale until the debt is
    discharged.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: An officer called ogo may be placed in a debtor's house to enforce payment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A person who performs ordinary funeral rites over another becomes responsible
    for the deceased person's debts unless creditors first give permission.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: If permission is refused and no one accepts responsibility for the debt, the
    corpse is placed on a raised platform outside the town until the debt is paid.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A man is responsible for debts contracted by his wives but not for debts contracted
    by his children.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: When evidence is insufficient to establish guilt, an accused person has to
    prove innocence by drinking orisha, an ordeal in which the decision is assigned
    to the gods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The ordeal draught is usually a decoction of odum-bark prepared by a priest,
    who can make it harmless or effective.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: If the poison is not rejected by the stomach and causes death, the orisha
    is considered to have declared the accused guilty by slaying him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage states that guilty persons avoid drinking orisha, while innocent
    persons may demand it and often perish.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Murder, arson, and treason are generally punished with death, and theft punishments
    escalate from flogging and a fine to mutilation and then death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: When cattle or sheep stealing becomes prevalent, a detected thief is publicly
    decapitated on Ogun's stool by chiefs' sword-bearers rather than being secretly
    executed by the Ogboni.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Criminals unable to pay fines are flogged with the kpcLshaUy, a hippopotamus-hide
    whip described as drawing blood at each stroke.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: Relatives of an executed criminal may not bury him without paying ransom for
    the body, which is placed on a platform of sticks outside town until payment.
  category: sequence
  evidence_refs:
  - ev:10
