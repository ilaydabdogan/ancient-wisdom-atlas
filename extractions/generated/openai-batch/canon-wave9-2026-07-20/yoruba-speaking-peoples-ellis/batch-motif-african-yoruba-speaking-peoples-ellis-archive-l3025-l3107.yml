comparison_claims:
- id: claim:1
  claim: The passage reports that the Yoruba myth of the sun, moon, stars, young suns,
    expulsion, and transformation is virtually the same as a myth current among the
    eastern Ewe-tribes.
  claim_level: same_motif
  target: Eastern Ewe-tribes celestial offspring myth
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not provide the Ewe version's details, only the author's
    comparison.
- id: claim:2
  claim: The passage states that the eastern Ewe-tribes almost certainly learned this
    celestial myth from Yoruba neighbours.
  claim_level: historical_contact
  target: Eastern Ewe-tribes and Yoruba neighbours
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: low
  limitations: This is the source author's assertion; no independent evidence or transmission
    history is provided in the passage.
- id: claim:3
  claim: The passage compares Yoruba lunar-eclipse interpretation and response with
    those of the Ewe-tribes, saying both understand the eclipse as the Sun beating
    the Moon and take similar steps to drive him away.
  claim_level: same_function
  target: Ewe-tribe lunar-eclipse response
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not list the specific actions, referring instead to
    another work.
