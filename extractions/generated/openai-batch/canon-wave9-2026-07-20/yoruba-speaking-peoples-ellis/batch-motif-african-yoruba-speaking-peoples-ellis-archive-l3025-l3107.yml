canonical_text:
  quote: ''
  summary: The passage describes Oshosi as a hunter deity associated with Yemaja,
    forest game, protection, bows, and hunting offerings. It then recounts Yoruba
    traditions about the sun, moon, stars, lunar observances, eclipses, named stars,
    and celestial metaphors. It closes with Olori-merin, a nearly obsolete four-headed
    town deity represented by a mound, formerly receiving quarterly newborn-child
    sacrifice, guarding the four compass points, and sometimes appearing as a venomous
    serpent.
  language: English
  quote_policy: summarized
