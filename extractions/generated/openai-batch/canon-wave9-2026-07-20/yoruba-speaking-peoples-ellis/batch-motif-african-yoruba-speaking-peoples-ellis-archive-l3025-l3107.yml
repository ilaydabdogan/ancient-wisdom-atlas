candidate_motifs:
- id: motif:1
  label: Hunter patron deity with game-provision and protection
  taxonomy_refs:
  - sacred_exchange
  basis: Oshosi provides game and protection for hunters and receives offerings from
    the chase.
  evidence_refs:
  - ev:1
