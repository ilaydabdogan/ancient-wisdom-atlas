  cautions: The passage describes offerings and benefits but does not explicitly state
    a contractual exchange.
- id: motif:2
  label: Celestial bodies born from a goddess's body
  taxonomy_refs:
  - mother_goddess
  - divine_parent_child
  basis: The sun, moon, and stars are said to come from Yemaja's body, and the stars
    and young suns are organized as celestial children.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage gives a brief mythic genealogy rather than a full cosmogony.
- id: motif:3
  label: Jealous celestial father drives out male offspring
  taxonomy_refs:
  - divine_parent_child
  basis: The young suns try to follow their father, the Sun, who becomes jealous,
    tries to kill them, and drives the sons out of the sky.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The wording is limited to this celestial family episode.
- id: motif:4
  label: Refuge and transformation of celestial offspring into fish
  taxonomy_refs:
  - shapeshifter
  basis: Some fleeing young suns seek refuge with Yemaja, who turns them into fish.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The transformation is performed by Yemaja on others; the passage does
    not describe voluntary shapeshifting.
