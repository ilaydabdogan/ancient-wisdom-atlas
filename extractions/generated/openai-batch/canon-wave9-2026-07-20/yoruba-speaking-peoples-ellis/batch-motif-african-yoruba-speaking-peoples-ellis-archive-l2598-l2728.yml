  text: Olokun-su, also called Elusu, is named as Olokun's wife and is said to live
    in the harbour bar at Lagos.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Olokun-su is described as white, human-shaped, and covered with fish-scales
    from below the breasts to the hips; fish in the bar are sacred to her.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Olosa is named as goddess of the Lagos Lagoon, principal wife and sister of
