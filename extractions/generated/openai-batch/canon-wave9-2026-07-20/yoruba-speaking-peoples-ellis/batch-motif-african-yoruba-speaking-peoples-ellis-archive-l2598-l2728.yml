canonical_text:
  quote: ''
  summary: 'The passage describes several Yoruba minor deities in Ellis''s account:
    Olokun as sea-god, his undersea dwelling, sacrifices, and a myth in which Obatala
    restrains his destructive flooding; Olokun-su as a local sea-goddess of the Lagos
    harbour bar; Olosa as lagoon goddess with crocodile messengers and sacrificial
    rites; and Shankpanna as the small-pox god, accompanied by Buku and exiled after
    a divine assembly episode.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Olokun is identified as the Yoruba sea-god, named as Lord of the Sea, and
    said to have come from the body of Yemaja.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Olokun is described as especially important to fishermen and others whose
    work takes them onto the sea.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When angry, Olokun is said to make the sea rough, raise surf, drown people,
    upset boats or canoes, and cause shipwrecks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Olokun is described in human shape, black in color, with long flowing hair,
    residing in a vast palace under the sea and served by sea-spirits.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Animals are ordinarily sacrificed to Olokun, and a human victim is said to
    be offered when surf prevents canoes from going to sea for many days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A myth says Olokun tried to destroy mankind by overflowing the land after
    becoming enraged at neglect, until Obatala forced him back and bound him with
    seven iron chains.
  category: sequence
  evidence_refs:
  - ev:5
