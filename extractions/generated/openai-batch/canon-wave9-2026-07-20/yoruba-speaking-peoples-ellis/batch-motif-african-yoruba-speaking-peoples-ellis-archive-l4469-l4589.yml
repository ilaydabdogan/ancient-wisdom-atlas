canonical_text:
  quote: ''
  summary: The passage describes Yoruba beliefs in three indwelling spirits located
    in the head, stomach, and great toe; offerings and symbols associated with them;
    the soul's journey after death to a land beneath the earth; dangers faced by a
    ghost without funeral rites; and a funerary fowl sacrificed to open the road.
    It also compares these beliefs with Tshi, Ewe, and Ga indwelling-spirit concepts
    and comments on grave-local ghost beliefs and Deadland beliefs.
  language: English
  quote_policy: summarized
