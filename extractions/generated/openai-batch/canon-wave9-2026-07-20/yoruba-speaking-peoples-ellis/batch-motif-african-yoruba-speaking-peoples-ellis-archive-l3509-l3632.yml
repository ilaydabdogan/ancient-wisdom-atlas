canonical_text:
  quote: ''
  summary: The passage describes Yoruba priestly hierarchy, divination, priestly recruitment
    and consecration, temple service, sacred groves and shrines, representations of
    deities by images, libations and offerings, and the gbedu drum with a guardian
    spirit supplied through sacrifice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Magba, chief priest of Shango, has twelve ranked assistants and they reside
    near Kuso, where Shango is said to have descended into the earth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Priests act as intermediaries between gods and humans, preside over trials
    by ordeal, and prepare and sell charms and amulets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Priests of Ifa are described as diviners proper, while other priests also
    practise divination without the palm-nuts and board associated with Ifa.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Two lot-divination methods are described: keke uses small sticks or grass
    stalks representing individuals, and gogo uses grass stalks, one bent, to indicate
    the person at fault.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The priestly office is hereditary in priestly families, but youths and girls
    may enter seminaries, undergo a two- or three-year novitiate, be consecrated,
    and take a new name.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Temple dependents, affiliated youths, and the “wives” of the gods perform
    ordinary temple service, including filling vessels with water and sweeping the
    temples every fifth day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Affiliated young people practise religious dances and songs near temples and
    may repeat short chants until they enter a frenzied state with loud cries.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Temples are ordinarily circular clay huts with conical grass-thatched roofs,
    sacred interior colors, and carved doors, shutters, and posts.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Temples of chief gods are often situated in groves with large trees, including
    silk-cotton trees, and long streamers from trees or bamboos mark the sanctity
    of the locality.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sacred groves have proper names; a grove sacred to Ifa and Odu is called an
    Igbodu.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: A celebrated sacred avenue near Ode Ondo is associated with adjacent human
    sacrifice and execution of criminals, and people approaching from opposite directions
    may not pass each other in the avenue.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Temples of town tutelary deities are usually in central squares or near main
    gates, while household tutelary shrines are near house doors or yards and may
    be miniature structures.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: Larger circular huts without images are built for pious persons who wish to
    meditate and pray; a temple is called Ile Orisha, “House of the Orisha.”
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: Yoruba gods are represented by human-form images treated as emblems of absent
    gods, with an idea that the god may enter the image to receive sacrifices and
    prayers.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: Earthen vessels receive libations of blood and palm-oil, and egg yolks are
    smeared on posts, door-sills, and thresholds as offerings to the gods.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: A tall gbedu drum kept in important temples and elite houses is carved with
    animals, birds, and a phallus, beaten at religious feasts and public ceremonies,
    and smeared or sprinkled with sacrificial substances.
  category: object
  evidence_refs:
  - ev:13
- id: obs:17
  text: The offering to the gbedu drum is said to be for its protecting spirit, identified
    as the spirit of a slave sacrificed on it; the passage compares this with guardian
    spirits supplied for important objects on the Gold Coast.
  category: relationship
  evidence_refs:
  - ev:14
