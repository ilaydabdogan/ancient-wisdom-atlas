canonical_text:
  quote: ''
  summary: The passage distinguishes nature-worship from manes-worship while noting
    that nature-gods and ghost-gods may blend at places of fatal accident. It describes
    Tshi worship of indwelling spirits in natural features, argues that human-made
    objects lack such spirits unless supplied with artificial guardians through sacrifice,
    and compares stool and drum sacrifices with Pacific war-canoe and Dyak house-post
    sacrifices.
  language: English
  quote_policy: summarized
