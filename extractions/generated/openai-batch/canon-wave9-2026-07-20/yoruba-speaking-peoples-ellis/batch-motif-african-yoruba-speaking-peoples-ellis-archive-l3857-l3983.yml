canonical_text:
  quote: ''
  summary: The passage describes Egungun as a masked figure understood as one risen
    from the dead, appearing in streets, frightening people, punishing misconduct,
    and acting in funeral rites as a messenger from Deadland. It also describes an
    annual Egungun feast for the dead and a preserved Freetown form of the practice.
    The passage then describes Oro as a personified executive power whose forest approach
    is signaled by a bull-roarer; women are forbidden to see it, and condemned criminals
    may be given to Oro by the Ogboni Society.
  language: English
  quote_policy: summarized
