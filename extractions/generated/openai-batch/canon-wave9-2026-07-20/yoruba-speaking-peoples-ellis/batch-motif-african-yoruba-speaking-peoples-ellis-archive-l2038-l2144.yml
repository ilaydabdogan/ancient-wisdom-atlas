  summary: The passage continues a myth in which Oya flees Shango, gains Huisi as
    a protector by giving him stolen medicine, and Huisi becomes an orisha and battles
    Shango until Shango opens the earth and descends with him. It then describes Ifa
    as god of divination, palm-nuts, fecundity, wisdom, and priestly consultation,
    including origin details, attendants, sacred animal, holy day, sacrifices, and
    priestly practices.
