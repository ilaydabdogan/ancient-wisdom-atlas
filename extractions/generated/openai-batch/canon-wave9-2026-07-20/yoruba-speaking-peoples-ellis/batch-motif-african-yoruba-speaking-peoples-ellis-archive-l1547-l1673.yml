canonical_text:
  quote: ''
  summary: The passage describes Odudua as wife of Obatala and as Earth joined to
    a sky-god; temple calabashes symbolize Heaven and Earth. It reports a less common
    view that the pair form one androgynous divinity, then gives a myth of their confinement
    in a primordial closed calabash, their quarrel, Odudua’s blinding, and her snail
    curse on Obatala. It also recounts Odudua’s patronage of love and an Ado foundation
    legend involving a hunter, a silk-cotton tree, sacrifices, and festival sexual
    rites. The section then describes Aganju and Yemaja as children of Obatala and
    Odudua, associated with Land and Water, Yemaja’s water cult, Yemaja’s sibling
    marriage to Aganju, the birth of Orungan, and Orungan’s assault and pursuit of
    his mother.
  language: English
  quote_policy: summarized
