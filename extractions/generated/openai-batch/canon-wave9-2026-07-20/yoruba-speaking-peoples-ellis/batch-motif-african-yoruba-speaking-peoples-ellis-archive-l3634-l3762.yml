canonical_text:
  quote: ''
  summary: 'The passage describes Yoruba sacrificial worship: daily and occasional
    offerings, rules about acceptable and unacceptable sacrificial animals, explanatory
    sayings about birds that did or did not offer sacrifice, priest-led shrine rites
    with blood and entrails, crossroads sacrifices to avert calamity, bird-like spirit
    voices interpreted by priests, and the disposal of a personal tutelary god''s
    image after the owner''s death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sacrifice is presented as the central act of ceremonial worship, and a god
    cannot be consulted without an offering whose value varies with the occasion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Followers of a god, identified by a distinguishing badge and believed to be
    under the god's protection, commonly make small daily offerings such as cowries,
    maize-flour, palm-oil, or palm-wine.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each god is said to have animals that are proper or improper to sacrifice;
    turkey-buzzard, vulture, and grey parrot are described as unclean to all gods.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Popular sayings explain the uncleanness of the turkey-buzzard, vulture, and
    grey parrot by saying they refused to offer sacrifice, while the pigeon and green
    parrot offered sacrifice and remained clean.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: On important occasions the priest names the required sacrifice; the suppliants
    prostrate themselves at the shrine with a cry of submission, and the priest addresses
    the god with praise and petition.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The priest sacrifices the victim, sprinkles some blood on the image, pours
    the rest on the ground, and places the head and entrails in a shallow earthen
    vessel before the temple.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sacrifices are ordinarily made before the god's image, which the god is supposed
    to animate temporarily.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: An exception is made for sacrifices at crossroads or road junctions to avert
    impending calamity; the passage says these are probably directed to spirits haunting
    forests and uninhabited tracts, with the danger believed to be diverted.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sometimes the god is said to answer in a bird-like twittering voice; worshippers
    lie face down while the priest converses with the voice and later interprets it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that the spirit-voice is likely produced by a confederate
    priest using a blade of grass or a leaf between the teeth.
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: The image of a personal tutelary god is respected only during the owner's
    life; after the owner's death the household throws it away because it is no longer
    thought to be animated or sacred.
  category: sequence
  evidence_refs:
  - ev:11
