canonical_text:
  quote: ''
  summary: A numbered sequence of Yoruba proverbs, with editorial explanations, uses
    tools, animals, foods, water, vessels, slaves, bodily conditions, and gods as
    proverbial images for slavery, prudence, danger, kinship, gratitude, social rank,
    speech, justice, and practical wisdom.
  language: English with Yoruba terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A proverb says the bill-hook cuts bush and clears the road without receiving
    profit; the explanation says this refers to slave labor bringing no remuneration.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several proverbs state that a slave is subject to the master's work, is not
    made of wood, was once a child in a mother's or father's house, and is born in
    the same way as a free person.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A proverb compares buying a hen in the market to a warning about buying a
    female slave, saying the owner would not have sold her if she were worth keeping.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Proverbs about the locust-fruit gatherer, the hunchback, the eyebrow as bow,
    and killing game by looking present images of rashness or impossibility.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The hovering hawk makes the fowl-owner uneasy, and the spider encircles an
    intended victim with its web before attacking.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Proverbs contrast elephant-beef with crickets and a spring with a river to
    criticize petty gain by the rich or self-deprivation by the poor.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage gives practical maxims about building a shed if a house cannot
    yet be built, sacrificing a small bat if a large bat is unavailable, and recovering
    after spilled water if the calabash remains unbroken.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A proverb says a snuff-seller does not admit to selling bad tobacco; the note
    compares this to not crying stinking fish.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Two guinea-fowl varieties, etu and awo, are used to say that people dislike
    hearing their relations abused.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: One proverb says a person runs from the sword and hides in the scabbard; another
    says the spoon puts its head into boiling fluid after seeing death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The agbeji gourd is said to save men from starving but later to be treated
    as fit only for a common calabash; another proverb says it is never bitter in
    a large family.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Proverbs address public fault-finding, giving each party their due, obscurity
    from contracted speech, and a dispute being settled once the face-washing reaches
    the chin.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Fish and rat are assigned different domains of knowledge; a large cock prevents
    a small one from crowing; a rock is called father of stones; two rams cannot drink
    from one calabash.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: The final proverbs mention the deaf watching a speaker's mouth, a dying person
    being told not to split the mortar for firewood, a stranger discouraged from planting
    by repeated departure plans, and a hunchback questioning a child-name invoking
    divine blessing.
  category: sequence
  evidence_refs:
  - ev:12
