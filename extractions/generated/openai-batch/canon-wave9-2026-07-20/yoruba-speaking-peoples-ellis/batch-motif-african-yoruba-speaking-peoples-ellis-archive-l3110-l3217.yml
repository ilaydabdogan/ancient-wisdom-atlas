canonical_text:
  quote: ''
  summary: The passage gives Ellis's interpretive remarks on Yoruba origin myths for
    deities. It reports a priestly scheme in which Obatala/Heaven marries Odudua/Earth,
    producing Aganju/Land and Yemaja/Water; Aganju and Yemaja produce Orungan/Air;
    Orungan assaults Yemaja, and many gods emerge when her body bursts open. The author
    classifies named deities as nature, pestilence, tutelary, or outside the family
    scheme, notes variant accounts, and makes cautious comparisons to Ewe and Greek
    traditions.
  language: English
  quote_policy: summarized
