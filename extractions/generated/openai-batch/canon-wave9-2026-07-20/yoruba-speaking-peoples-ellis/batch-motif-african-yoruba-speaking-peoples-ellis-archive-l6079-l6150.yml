  summary: The passage describes Yoruba public proclamation by a herald, wartime mobilization,
    camp support by women, the gradual adoption of firearms, older weapons including
    bows and poisoned arrows, army divisions and command titles, and battlefield skirmishing
    and ambuscade tactics.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Public notices are proclaimed by a public crier or herald called an Akede,
    who begins announcements with cries glossed as “Noise! noise!”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In wartime, men capable of bearing arms take the field under military chiefs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Women accompany the army to cook food and carry baggage, so the size of a
    war-camp does not reliably indicate the number of combatants.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Yoruba groups came into communication with Europeans
    about 1816, that muskets did not become common until after 1860, and that older
    weapons were not yet fully displaced.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Older weapons and equipment include bows with raw-hide strings, cross-bows,
    arrows in quivers, a ground receptacle for reserve arrows, iron finger guards,
    and leather arm guards.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Poisoned arrows are said to have been commonly used; ingredients named include
    the leaf of the fire-plant and pounded large red ants.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Before firearms, an army was ordinarily divided into cavalry, archers, and
    foot-soldiers; the passage adds that Yoruba cavalry was not large and horses were
    usually monopolized by men of rank.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Foot-soldiers carried spears, swords, axes, shields, and a halberd-like weapon
    called gamu-gamu; shirts of mail and breast-plates were sometimes seen.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Each contingent fought under its own Kakanfo or captain; the Balogun was described
    as the generalissimo, with three inferior alasa officers under each local leader.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: In battle, main bodies stand apart while detachments skirmish at long musket
    range, retire for ammunition, and may try to draw an advancing opponent into ambuscade;
    the passage says there is no general plan of action and contingents act independently.
  category: sequence
  evidence_refs:
  - ev:8
