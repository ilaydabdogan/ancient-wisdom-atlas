canonical_text:
  quote: ''
  summary: A woman accuses two boys of stealing a necklace entrusted to their deceased
    mother. The chief holds the boys responsible and detains the younger brother.
    The elder boy seeks aid from a babalawo at Ife; Ifa directs him to visit Deadland
    through offerings, lustral water, and following the shadows. In Deadland he asks
    his dead mother where the necklace is, learns it is hidden in a wall, nearly touches
    her, and is warned that touching the dead would prevent his return. He returns,
    finds the necklace, frees his brother, and thereafter makes regular offerings
    and supplies water at his mother's grave. The passage then describes a related
    divinatory practice in which a priest prepares a child with lustral water so the
    child can see into Deadland through a hole in the earth, after which the child
    is made to forget the vision.
  language: English
  quote_policy: summarized
