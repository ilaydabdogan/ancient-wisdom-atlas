literal_observations:
- id: obs:1
  text: Serious crimes are treated as matters for public justice, while minor injuries
    to person or property remain more connected to family initiative.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Theft is described as an offense against social order, with escalating punishments
    for repeated offenses: flogging or fine, then mutilation, then death.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The family is described as no longer collectively responsible for a member's
    actions; punishment falls on the guilty individual.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: In groups tracing descent through mothers only, property is vested mainly
    in families rather than individuals, though minor personal articles may be individually
    owned.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Inherited family property includes houses, family gold ornaments, insignia,
    stools, and other ancestral property; the family head holds it and cannot alienate
    it without family consent.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Among the Yorubas, property is said to be vested in households and divided
    among heirs, ordinarily sons, or brothers if there are no sons.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that land is held in common among all the tribes and that
    individual property in land is absent, though the idea has begun to appear among
