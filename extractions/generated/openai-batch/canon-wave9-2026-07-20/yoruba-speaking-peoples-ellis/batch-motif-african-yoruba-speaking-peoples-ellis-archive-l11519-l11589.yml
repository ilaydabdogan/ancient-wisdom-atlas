canonical_text:
  quote: ''
  summary: The passage describes a shift from family-based responsibility to state-administered
    punishment for serious crimes, especially theft. It then outlines property relations
    among matrilineal groups, among the Yorubas, and in landholding generally, proposing
    an evolutionary sequence from communal group property toward family, household,
    and individual property.
  language: English
