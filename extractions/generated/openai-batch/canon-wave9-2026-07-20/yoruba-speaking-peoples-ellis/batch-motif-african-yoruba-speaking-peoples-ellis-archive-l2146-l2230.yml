  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'The passage presents a ritual memory of these events: a wife or mother carries
    the sixteen palm-nuts like a child, and the babalawo invokes Orungan and Orisha-bi
    in grateful remembrance.'
  category: action
  evidence_refs:
