canonical_text:
  quote: ''
  summary: The passage recounts a myth in which Ifa, hungry because gods receive few
    sacrifices, consults Elegba. Elegba bargains to teach Ifa divination if Ifa obtains
    sixteen palm-nuts from Orungan’s two palms and grants Elegba first choice of offerings.
    Orungan and Orisha-bi obtain the nuts with the help of monkeys; Orisha-bi carries
    them like a child. Elegba teaches Ifa, Ifa teaches Orungan, and the passage explains
    related Ifa consultation practices with palm-nuts, a board, figures called mothers,
    and initiated rules of interpretation.
  language: English
  quote_policy: summarized
