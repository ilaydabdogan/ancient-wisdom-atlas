canonical_text:
  quote: ''
  summary: The passage describes Yoruba political offices, councils, court officials,
    royal etiquette, regional rulership in Abeokuta, Ibadan, and Jebu, revenue collection,
    adjudication practices, and visible insignia of royalty or official authority,
    including a rat tail, umbrella, sticks of office, and Ogboni staff.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Alafin uses the tail of a white-bellied rat called Afe-imojo, or Rat of
    knowledge, as a symbol of royalty and holds it to his lips when walking abroad.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The office of Bashorun is hereditary in one family, but the Alafin in council
    selects the family member who fills it; the council has twenty-two members and
    is called Isokan.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Are-Onakahmfo is ranked after the Bashorun and is described as the First
    of the War-Captains.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ilaris are confidential advisers of the Alafin, may be male or female, and
    shave the head while leaving a small tuft or tail on the crown.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bafin or Ibafin are palace officials; among them the Iwefa are chamberlains,
    while others act as spies or intelligence officers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Tetu arrests for debt and must pronounce the word ogiisa, meaning a shield,
    when making an arrest.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Ologbo keeps ancient traditions, teaches them to pupils, and recites them
    publicly on certain occasions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When addressing the Alafin, court etiquette restricts words with unbecoming
    alternate meanings and routes speech through a eunuch and then the chief female
    Ilari.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A native may appear before the Alafin only in ordinary native cloth, and the
    Alafin refers to his subjects as his slaves.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Among the Egbas, the Alake is nominally the ruler of the villages within Abeokuta,
    but township Bales are largely independent, and the Ogbonis are described as the
    real rulers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: In Ibadan, the Bale exercises kingly office, while the Balogun is almost equal
    in rank and power and sits with the Bale to judge important cases.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:12
  text: In Jebu, the Aivujale or Atvujale is described as surrounded by mystery; his
    visibility is limited by a screen, cloth, and bead-hung conical cap.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: In Jebu, it is death for anyone except members of the court to sit or stand
    behind the Atvujale.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: In Jebu, the umbrella is the symbol of sovereignty, and subject use of an
    umbrella is a capital offence.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: Kings, chiefs, and town Bales receive revenue from tribute and duties collected
    by Oni-bodes at town gates and frontiers.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: A Bale who adjudicates receives a hearing fee, and litigants usually present
    gifts privately before the public trial.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: Sticks of office are used by men in authority; a royal stick-bearer is called
    Olokpaja-oba, and the Ogbonis have a special staff called edan.
  category: object
  evidence_refs:
  - ev:12
