canonical_text:
  quote: ''
  summary: The passage explains how an indwelling spirit of a natural feature may
    be relocated into an image or shrine, how its original association may be forgotten,
    and how it may become a tutelary deity. It then distinguishes nature-gods from
    ghost-gods derived from manes-worship, describing offerings, royal ancestor rites
    in Ashanti and Dahomi, exhumed skulls or heads as loci of guardian ghosts, and
    the continued worship of burial places after their origin is forgotten.
  language: English
  quote_policy: summarized
