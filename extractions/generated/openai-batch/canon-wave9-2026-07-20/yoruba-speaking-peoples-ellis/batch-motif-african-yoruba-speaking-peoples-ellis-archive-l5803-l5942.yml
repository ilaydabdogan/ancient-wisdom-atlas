canonical_text:
  quote: ''
  summary: The passage describes Yoruba governmental structures, including hereditary
    but elective kingship, the council of elders' control over the king, public consultation
    in important affairs, royal regalia and titles, a coronation ordeal involving
    seizure and flogging of the selected candidate, offices of state and local governance,
    respect gestures toward rulers, signs of honor, deputies and successors, and a
    Yoruba proper succession custom in which the Aremo was formerly required to die
    when the Alafin died.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Most Yoruba tribes are described as having a monarchical system in which the
    king is the nominal head while real power remains with chiefs and elders.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The council of elders must concur in royal edicts, and a two-thirds majority
    is required for any new law.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sovereignty is hereditary in one family, but the individual ruler is selected
    by the council from eligible men of the required blood-descent.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: If a king tries to become independent of the council, the council invites
    him to "go to sleep" by sending parrots' eggs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Questions of vital national importance are discussed by an assembly of the
    whole people, where every individual may express an opinion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The emblem of royalty is a conical bead head-dress with long strings of beads
    arranged to conceal the wearer's face.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: An epithet applied to kings is translated as "Owner of the World."
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Before coronation, chiefs and elders seize the selected candidate at his house,
    take him to the palace, and flog him with light whips.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A royal candidate who cries out or shows pain during the flogging is rejected;
    one who endures bravely without flinching is crowned.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says the ordeal appears designed to test endurance, self-restraint,
    and concealment of thought.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage compares the Yoruba coronation ordeal to a Timni practice in Sierra
    Leone in which the newly elected king is scoffed at and beaten while being dragged
    to the predecessor's residence before receiving royal ornaments.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Named chief officers include the Bashorun or prime minister, the Balogun or
    chief of the army, and the Seriki as military officer second in command.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Civil governors called Bales rule towns, town-quarters, villages, and households
    in nested levels of authority.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: A household Bale is responsible for order and minor disputes among his family
    and dependents, while larger disputes move upward to town-quarter or town Bales.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: People subject to a Bale address him as "Father" or "Master," and he calls
    them "my children."
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: In every town an Iyalode, translated as "Mistress of the street," receives
    disputes between women first, with right-hand and left-hand Iyalode assistants.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: Oloris form the aristocracy, and each Olori has Chises who may serve as messengers,
    heralds, bailiffs, police, and executioners.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: Respect to kings and chiefs is shown by prostration, rising, and clapping
    the hands; before entering their presence, the cloth is removed from the shoulder
    and wrapped around the waist.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: When a new title is conferred, a leaf of the akoko-tree is given as a sign
    of honor.
  category: object
  evidence_refs:
  - ev:11
- id: obs:20
  text: Officers of state, council members, town-Bales, and the king have Ekejis or
    seconds, who assist and rule in their principals' absence.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:21
  text: The king's Ekeji is usually selected to succeed him.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:22
  text: In Yoruba proper the king is called the Alafin, and his eldest son, the Aremo,
    governs jointly with him.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:23
  text: An old custom required the Aremo to commit suicide when the Alafin died, and
    the new king was chosen from another branch of the royal family.
  category: sequence
  evidence_refs:
  - ev:13
