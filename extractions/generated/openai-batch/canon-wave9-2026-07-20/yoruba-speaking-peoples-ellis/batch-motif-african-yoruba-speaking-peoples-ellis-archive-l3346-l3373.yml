  quote: ''
  summary: A tradition says tribute of cowries was promised, a palm sprang from water
    at the place that became Ife, and three brothers later left Ife in different directions,
    leaving the slave Adimu to rule in their absence. The commentator describes the
    tradition as vague and interprets the water-covered region as supporting a memory
    of southward migration into lagoon country.
