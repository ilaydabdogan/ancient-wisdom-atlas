candidate_motifs:
- id: motif:1
  label: personified principles and abstractions become deities
  taxonomy_refs: []
  basis: The passage explicitly discusses deification or personification of fire,
    love, and pestilence and later says Yoruba examples show gods made out of abstractions
    such as fertility, wealth, nightmare, and vegetables.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:11
  confidence: high
  cautions: This is an ethnographic analytic pattern rather than a narrative episode.
- id: motif:2
  label: local nature gods generalized into wider domain gods
  taxonomy_refs: []
  basis: The passage contrasts each hill, mountain, or local sea-god with generalized
    figures such as Oke and Olokun, and describes lagoon and river deities as becoming
    general from local origins.
  evidence_refs:
  - ev:8
  - ev:11
  - ev:13
  confidence: high
  cautions: The passage presents this as the author's comparative synthesis.
- id: motif:3
  label: incipient good and evil dualism
  taxonomy_refs:
  - duality
  basis: The passage says the tendency to regard Legba as the evil principle may be
    a first step toward dualism, with Ifa as the likely good principle.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The author uses tentative wording; the passage does not describe a fully
    developed dualistic myth.
- id: motif:4
  label: deified discoverer of iron
  taxonomy_refs:
  - culture_hero
  basis: Ogun is described as god of iron and war, and the passage says he may have
    been the traditional discoverer of the use of iron who was raised to first rank.
  evidence_refs:
  - ev:9
  confidence: low
  cautions: The passage also offers personification of iron as an alternative explanation,
    so culture-hero status is uncertain.
- id: motif:5
  label: beneficent divination and revelation of the future
  taxonomy_refs:
  - wisdom
  basis: Ifa is described as god of divination, benefactor of man, and unveiler of
    the future.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage names the function but does not narrate a divinatory act.
- id: motif:6
  label: remote sky-god displaced by more anthropomorphic deity
  taxonomy_refs: []
  basis: Mawu is described as distant, and Olorun, a sky-god corresponding to Mawu
    and Nyankupon, is said to be rapidly displaced by the more anthropomorphic Obatala.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: medium
  cautions: The displacement is reported as a religious-development claim, not as
    a mythic event within a story.
