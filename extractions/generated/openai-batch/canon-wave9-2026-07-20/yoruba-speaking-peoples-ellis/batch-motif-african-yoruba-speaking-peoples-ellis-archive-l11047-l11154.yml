canonical_text:
  quote: ''
  summary: 'The passage compares deity concepts among Gold Coast, Ewe, and Yoruba-speaking
    groups. It describes named deities associated with sky, rain, thunder, fire, markets,
    small-pox, love, fertility, wealth, forests, rivers, divination, medicine, and
    iron. It argues that Yoruba-speaking groups show more simulacra, more anthropomorphic
    gods, fewer strictly local gods, and more general or abstract deities. It concludes
    with a comparative social pattern: small isolated communities emphasize local
    gods, while larger and more connected communities develop tribal, national, or
    general gods.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mawu is described as distant from human affairs; thunder and lightning are
    attributed instead to Khebioso, while Mawu controls rain.
  category: relationship
