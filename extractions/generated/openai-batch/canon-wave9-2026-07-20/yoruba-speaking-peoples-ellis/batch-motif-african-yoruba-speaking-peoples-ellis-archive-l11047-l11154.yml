  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes the deification or personification of fire, love, and
    pestilence as a new departure in the comparison being made.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among Yoruba-speaking tribes, simulacra are said to be in universal use; belief
    in nature-gods as animating principles of natural objects is said to linger mainly
    in remote places and among the Jebus.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that there are few proper local gods among the Yoruba-speaking
    tribes, but many tutelary deities and many general deities.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Olorun is described as a sky-god corresponding to Ewe Mawu and Tshi Nyankupon,
    while Obatala is described as a more anthropomorphic conception displacing Olorun.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Shango is associated with thunder and lightning; Shan-kpanna with small-pox;
    Legba with desire and evil; and Odudua, described as a goddess said by priests
    to be the earth, with the passion of love.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Orisha Oko, Aje Shaluga, Shigidi, and Dada are presented as deities of natural
    fertility, wealth, nightmare, and vegetables respectively.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Oke, Olokun, and Aroni are presented as gods of heights, the sea, and forests;
    Olosa, Oya, Oshun, and Oba are described as nature-gods connected with a lagoon
    and rivers that have become general from local origins.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ifa is described as god of divination, benefactor of man, and unveiler of
    the future; Osanhin is described as god of medicine; Ogun is described as god
    of iron and hence war.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage suggests that treating Legba as an evil principle may be an early
    step toward dualism, with Ifa as the likely good principle.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage presents a progression from gods of hamlets and small communities
    to gods of a whole people, and from indwelling spirits or dead men to personified
    principles.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The passage links aggregation and communication among peoples with the development
    of more general gods, contrasting isolated Gold Coast hamlets with more open eastern
    Ewe districts.
  category: relationship
  evidence_refs:
  - ev:12
  - ev:13
