  quote: ''
  summary: The passage recounts peace terms and attempted disbandment of Yoruba war
    camps, including Modakeke's planned relocation and later refusal to leave an ancestral
    burial place. It also describes fortified camps, evacuation and burning of camps,
    continued Ibadan-Ilorin hostilities, British and French colonial boundary arrangements,
    and later political and trade disputes involving Abeokuta and Lagos.
  language: English
  quote_policy: summarized
