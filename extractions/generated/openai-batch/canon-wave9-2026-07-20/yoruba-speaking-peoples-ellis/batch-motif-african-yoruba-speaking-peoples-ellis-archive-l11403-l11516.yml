canonical_text:
  quote: ''
  summary: The passage summarizes kinship, descent, succession, and systems of responsibility
    and redress among Yoruba and neighboring Tshi, Ga, and Ewe groups. It describes
    a movement from maternal kin groups and family-based collective responsibility
    toward bilateral descent and greater state authority, and notes a religious parallel
    in which gods, like legal practice, are said not to consider motive.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Yoruba tribes, descent is described as through both parents, with
    succession in the male line and property divided equally among sons; brothers
    inherit if there are no sons.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that movement from the Tshi tribes to the Yoruba shows
    a gradual change from kinship and descent through mothers only to kinship and
    descent through both parents.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes an earlier social stage in which the group or community
    had collective rights and responsibilities, and each member had both protection
    from and responsibility to the group.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A remaining trace of group responsibility is said to be a creditor's right
    to seize property from a third party in the debtor's community rather than recover
    directly from the debtor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among the Tshi, Ga, and Ewe tribes, the uterine family is described as the
    social unit, with each member individually responsible for the others.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: For many offences among the Tshi, Ga, and Ewe tribes, the injured person's
    family alone can demand satisfaction, and reparation is sought from the offender's
    family rather than directly from the offender.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The chief acts as arbiter only when contending parties cannot agree on reparation,
    and there is no fixed scale of punishments or awards.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In homicide cases, the deceased person's family may accept money compensation
    or may have the homicide put to death, depending on circumstances and preference.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In theft or property-injury cases, the offender's family restores goods or
    makes good the damage and may also be fined; afterward the family itself decides
    how to deal with its member.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that no distinction is made between crimes and accidents,
    that motive is not considered, and that harm is assessed as loss to the family.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says this legal disregard of motive has a reflection in religious
    views, where gods likewise are believed not to take motive into consideration.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Among the Yorubas, the passage says the family has lost cohesion as descent
    patterns changed, and that the state has gradually usurped family privileges.
  category: sequence
  evidence_refs:
  - ev:9
