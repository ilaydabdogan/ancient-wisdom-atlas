  summary: The passage introduces Yoruba proverbial sayings as numerous, constantly
    used, and associated with wisdom, then lists examples concerning secrecy, boasting,
    contamination by contact, disobedience, peace, poverty, labor, inquiry, tale-bearing,
    falsehood, plenty, forethought, and related social lessons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Yorubas have many proverbial sayings and regard
    knowledge of them as proof of great wisdom.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A proverb is described as the “horse of conversation” that revives conversation
    when it droops.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that several proverbs found among Ewe-speaking peoples
    are also known to and used by Yoruba-speaking peoples, while many others are described
    as peculiar to the Yoruba-speaking peoples.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Proverbs 1-4 warn against revealing secrets to a tattler or whisperer and
    use the forest as an image of a place that does not tell tales.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Proverbs 5-8 use bags, sweepings, scattered persons, a crowd, and a filled
    market to express gradual accumulation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Proverbs 9-13 contrast boasting, gesticulation, and unfinished claims with
    actual courage or accomplished action.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Proverbs 14-16 use a hog in mud, a white cloth in a palm-oil market, and cross-roads
    that do not fear sacrifices as proverbial images.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Proverbs 17-20 personify disobedience, calamity, and suffering in sayings
    about consequence and voiceless distress.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Proverbs 21-26 address mastery of the house, peace, strife, forgiveness, sharp
    words, and the blows a peacemaker may receive.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Proverbs 27-36 address old age, the rootless afomo plant, concealment by a
    coughing person, jealousy, adjacent houses catching fire, named cloths, beauty
    as trouble, and a town man’s ignorance of farming.
  category: other
  evidence_refs:
  - ev:9
- id: obs:11
  text: Proverbs 37-48 address witches, a fallen tree, poverty, reputation, kinship,
    merchants and money, wisdom with age, rich and poor appearances, and the laborer
    in the sun versus the plantation-owner in the shade.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Proverbs 49-55 address laziness, leadership through the potsherd carrying
    embers, the partridge and farmer seeing a matter differently, hearing both sides,
    strengthening under annoyance, and waiting for chance.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: Proverbs 56-65 use the jackal and fowls, bush fire and smuts, tale-bearing
