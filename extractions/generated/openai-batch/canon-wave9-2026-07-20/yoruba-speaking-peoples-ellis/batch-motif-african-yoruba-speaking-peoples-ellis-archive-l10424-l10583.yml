canonical_text:
  quote: ''
  summary: The passage contains two Tortoise tales. In the first, Tortoise stages
    a dead snake on Buje’s path, feigns injury after pretending to help her, persuades
    her to carry him, violates her, boasts publicly before the king, and Buje flees
    into the bush and becomes the Buje plant. A note reports a disputed English/American
    variant in which a deformed man replaces Tortoise. In the second tale, during
    famine, a lizard learns that a rock opens and closes by spoken commands and contains
    yams. Tortoise follows the lizard, greedily remains inside the rock, forgets the
    command, is caught and beaten by the plantation-owner, and blames the lizard.
  language: English
  quote_policy: summarized
