canonical_text:
  quote: ''
  summary: Moon warns his wives not to dig deeply or look into holes while digging
    hog potatoes. The human wife disobeys, sees a camp-circle below with her father’s
    tipi, makes a long sinew cord, and lowers herself and her son through the hole.
    Moon finds them suspended, sends a round stone down the cord to strike the woman,
    and she dies while the boy survives. The boy lives near his dead mother, goes
    to the river for water, and is later detected by a young man who tests and tries
    to trap him with bows, arrows, and a willow-covered arbor.
  language: English
  quote_policy: summarized
