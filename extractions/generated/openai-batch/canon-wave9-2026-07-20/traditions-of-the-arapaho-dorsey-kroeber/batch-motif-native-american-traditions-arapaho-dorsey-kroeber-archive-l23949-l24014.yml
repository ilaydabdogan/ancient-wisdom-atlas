canonical_text:
  quote: ''
  summary: 'The passage gives several Arapaho tale abstracts: abandoned children are
    rescued by animal helpers and acquire extraordinary means of hunting, processing
    hides, feeding people, and going to the sky; a hostile father-in-law kills suitors
    until a fourth young man is aided by a lake spirit and buffalo; Blood-Clot-Boy
    is born from a blood clot, defeats dangerous beings, marries, returns to his parents,
    and goes to the sky; a following Blood-Clot-Boy and White-Owl abstract begins
    with a buffalo hunt and an approaching northern storm.'
  language: English
  quote_policy: summarized
