canonical_text:
  quote: ''
  summary: Buffalo-Woman makes bark become buffalo meat, prepares pemmican, and has
    Blue-Feather invite the men to a feast. Jealousy between Buffalo-Woman and Elk-Woman
    later leads Elk-Woman to run away with her boy. Blue-Feather follows and persuades
    her to return. Elk-Woman then tells him of an elk herd near a grove and gives
    instructions for a hunt; the people kill the elk, bring her teeth and hides for
    her dress, and are grateful because they had been hungry.
  language: English
  quote_policy: summarized
