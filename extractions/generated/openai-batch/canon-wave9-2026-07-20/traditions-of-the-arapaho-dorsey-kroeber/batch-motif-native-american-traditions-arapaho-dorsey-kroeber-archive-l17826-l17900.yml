canonical_text:
  quote: ''
  summary: Two boys visit a dangerous man called Open-Brains, avoid snakes in his
    tipi, make him sleep, kill him with a heated stone, and bring back his hair for
    their father. Their father then warns them away from a hill by a river, where
    they kill an iron-covered buffalo bull and bring back its horns for dippers. He
    later warns them away from a precipice, where they find young thunder-birds, provoke
    the father thunder-bird, kill him and the young, and bring back feathers and wings
    for ceremonial and practical uses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boys enter a tipi where a man has tangled hair and snakes crawl everywhere;
    they sit on flat stones placed under them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man with tangled hair addresses the boys as grandchildren and asks them
    to louse him; the boys unravel the knot of hair on his forehead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the hair is unraveled, the boys find that the man has open brains, and
    the passage gives him the names “the man with opened brains” and “Open-Brains.”
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Open-Brains camped alone in the woods, had no sympathy
    for anybody, and was properly speaking the first murderer.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boys make Open-Brains sleep, tie his tangled hair to tipi poles, heat
    a large round stone, place it inside his skull, and he is burned to death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After killing Open-Brains, the boys cut off his tangled hair, carry it home,
    and give it to their father for use as pendants on shirts and leggings.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The father warns both boys to stay away from a big hill close to the river
    because a fierce animal lives there; the boys decide to go there and see the animal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the hill, the boys find a large buffalo bull covered with iron, which raises
    its head, shakes it, lifts its tail, circles, and throws dirt as if ready to charge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Before the buffalo bull charges, the boys shoot and kill it, cut off its horns,
    and carry the horns to their father to be used as dippers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The father says the boys have done brave deeds but warns them not to go to
    a precipice on the other side of the river, where a strong and unmerciful being
    lives.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The wife remains at the tipi doing usual work, especially quill work, while
    the boys decide to visit the precipice.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At the precipice, the boys find a nest of young eagles identified parenthetically
    as thunder-birds, with the father and mother away.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: The boys twist the young thunder-birds’ noses and ask what sign appears in
    the sky when their father gets angry; the young ones answer that dark clouds and
    torrential rain appear.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The boys shoot two arrows into the rock below the nest and tell the young
    thunder-birds to tell their father that if he can pull out the arrows he is powerful.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The father thunder-bird returns noisily, rushes at the arrows, grabs their
    heads, and stretches them away from the rock, but the arrows contract back to
    the rock.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The boys kill Thunder-bird and the little ones, pull out the feathers, and
    bring feathers and wings home for their father to use for bonnets, arrows, and
    sweat fans.
  category: action
  evidence_refs:
  - ev:8
