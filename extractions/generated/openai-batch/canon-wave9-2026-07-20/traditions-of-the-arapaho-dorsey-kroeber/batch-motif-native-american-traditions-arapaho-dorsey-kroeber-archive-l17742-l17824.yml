canonical_text:
  quote: ''
  summary: A mourning father secretly catches one of two boys, By-the-Door, and later
    uses him to lure and catch the other boy, Spring-Boy. The twin boys then direct
    their father to make bows and arrows, erect a sweat-lodge, and place their dead
    mother inside; by shooting arrows upward and calling to her, they cause her to
    come out alive. After the family is restored, the father warns the boys not to
    enter a grove of timber because a dangerous being lives there, but they go there
    and find a smoked-looking tipi with a man inside who welcomes them as grandchildren.
  language: English
  quote_policy: summarized
