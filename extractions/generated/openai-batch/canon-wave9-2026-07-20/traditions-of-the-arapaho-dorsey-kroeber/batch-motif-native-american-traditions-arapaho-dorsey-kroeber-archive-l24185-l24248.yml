canonical_text:
  quote: ''
  summary: A male figure called Man and Moon encounters his grown son, follows Buffalo-Woman
    and the boy to a buffalo camp, witnesses humans being brought from a black snag
    and slaughtered, prepares weapons, then uses the same snag to stop the slaughter,
    arm humans, mark a cut-nosed woman, and reverse the food relationship so buffalo
    become subsistence for human beings. The passage ends with a four-day sequence
    of singing, dancing, racing, and myth-telling before return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man makes a bow, arrows, and a trail trap; he hides in the trap and catches
    a grown boy who bites and scratches before yielding.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy explains how he came to be alone, takes the man to where a woman was
    lying, and the man bathes him, rubs him with sage, and walks with him to camp.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Moon angers another wife by speaking about a human wife, and Buffalo-Woman
    starts off with the child toward her own home.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The man follows Buffalo-Woman and the boy over several days despite the boy
    advising him to go back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the buffalo camp, the man is given pemmican and a tipi, and the father-in-law
    instructs his daughter to cover her husband's face with a blanket when bringing
    him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman's calf brother is killed for the husband to eat; his bones are piled
    up, his hide is placed over them, and the calf comes to life again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The father-in-law provides meat to the people, and the meat is identified
    as human flesh.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The man secretly makes a hole in the tipi hide and sees people go to a black
    snag with a hole at the bottom near a river.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The father-in-law strikes the black snag with a red digging stick; human beings
    come out, run between two rows of people, and are slaughtered for use.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The man arranges outings to the mountain side and creek bottom, where he sharpens
    knives and prepares bows, arrows, sinew strings, feathers, and stone arrow points.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After receiving permission to call forth subsistence, the man walks to the
    dead black snag, strikes it, and human beings come out until they fill the space
    between the rows of buffalo people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The first returning human being is a woman with a cut nose; Moon strikes her
    senseless, says she ruined the human race, and says her nose will mark her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Moon commands that no more human beings shall be slaughtered and gives bows
    and arrows to human beings for use and protection.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: A proposition is accepted by the father-in-law, a change of life is made,
    and buffalo cease eating people and become subsistence for human beings.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Buffalo-Bull sends word that before returning there will be singing, dancing,
    a running race, and myth-telling, each for four days.
  category: sequence
  evidence_refs:
  - ev:7
