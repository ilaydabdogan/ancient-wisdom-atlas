canonical_text:
  quote: ''
  summary: 'A young man known as the old woman’s pet arranges a buffalo hunt after
    discovering that a white crow warns buffalo away and causes famine. He traps the
    crow with a bowstring, the people kill buffalo and are fed, and the crow is later
    punished: it is smoked dark, its bill is rubbed on chips, and it is assigned a
    common scavenging life. A source note compares the white bird and buffalo incident
    with other Arapaho items and with a Pawnee tale. The next tale begins by identifying
    Sun and Moon as brothers; young women wish to marry Moon or a bright star, and
    Sun and Moon discuss choosing wives from beings below.'
  language: English
  quote_policy: summarized
