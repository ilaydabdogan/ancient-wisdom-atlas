canonical_text:
  quote: ''
  summary: An editorial note identifies parallels for the tale and for a water-reflection
    episode in several Native North American traditions. In the narrative excerpt,
    Nih’angan deceives a group of women, who are later identified as female bears,
    into eating their own children. When they pursue him, he repeatedly wishes tunnels
    into being and escapes through them. At a hill tunnel he seals one end, disguises
    himself as One-Eyed-Sioux, sends the bear-women inside, builds a fire at the entrance,
    smothers them with smoke, then drags them out and cooks them.
  language: English
  quote_policy: summarized
literal_observations:
