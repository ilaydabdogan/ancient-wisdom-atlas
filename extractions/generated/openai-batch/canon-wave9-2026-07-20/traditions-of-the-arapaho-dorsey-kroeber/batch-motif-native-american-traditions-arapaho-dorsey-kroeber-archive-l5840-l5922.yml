  text: The editorial note says the tale is also found among the Gros Ventre and Omaha-Ponka,
    and, according to Meeker, among the Sioux, Winnebago, and Chippewa.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The editorial note lists additional sources for an episode in which someone
    dives into water for the reflection of an object, and notes a Pacific Coast variant
    in which a person’s reflection is mistaken for the person.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nih’angan tells the women that he has cooked gray wolves for them and invites
    them to eat when the cooking is done.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The women eat the meat, and one of them says it tastes like their children,
    while another attributes the strange taste to gray wolf meat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nih’angan secretly cuts off the edge of his robe, runs away, and then calls
    out that he has cooked the women’s children for them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The women find only the heads of their children in the hammocks and mourn
    by crying and scratching themselves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The women are identified as female bears and start chasing Nih’angan.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the chase Nih’angan wishes for tunnels in his path, enters them, comes
    out on the other side, and continues running.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the foot of a hill Nih’angan passes through another tunnel, seals the end
    after emerging, and puts mud over one eye to alter his appearance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Calling himself One-Eyed-Sioux, Nih’angan speaks with the bear-women at the
    tunnel entrance and claims he will go inside to bring Nih’angan out.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Nih’angan, in the One-Eyed-Sioux guise, makes noise inside the tunnel and
    comes out scratched and with torn clothing, saying the man inside is terrible.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The bear-women decide to go into the tunnel themselves, while One-Eyed-Sioux
    says he will watch the other end.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the women enter the tunnel, One-Eyed-Sioux gathers sticks, places them
    by the hole, and sets them on fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: When the women notice fire or smoke, One-Eyed-Sioux tells them the effects
    are caused by birds passing by and urges them to keep looking.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Smoke fills the tunnel until the women smother to death; afterward Nih’angan
    drags them out, cooks them, and says he relishes bear meat.
  category: action
  evidence_refs:
  - ev:8
