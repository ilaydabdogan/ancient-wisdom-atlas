canonical_text:
  quote: ''
  summary: 'The passage closes one Nih''angan tale in which a race for women ends
    with Nih''angan losing his expected choice and marrying an old woman. It then
    gives two versions of “Nih''angan and the Mice''s Sun Dance”: Nih''angan hears
    a dance, discovers it is inside an elk skull, thrusts his head in, and becomes
    stuck while the mice flee. He finds his way toward a river by feeling and identifying
    plants associated with riverbanks; in one version he falls into the river, floats
    to bathing women, asks them to strike the skull, and they crack it open and keep
    it as a scraper. A second version frames Nih''angan as the creator of humans and
    other things, traveling to inspect creation before encountering the mice''s ritual.'
  language: English
  quote_policy: summarized
