canonical_text:
  quote: ''
  summary: A son-in-law goes out hunting while leaving restrictions on his wife. During
    his absence, the old parents send their little son to ask the wife/daughter for
    a strip of fat muscle from the back, but she refuses because her husband may notice.
    Later the son-in-law orders the hungry old parents to skin and deliver game to
    his tipi; they do the work without eating and receive only small leg muscles to
    roast. In a later hunt, the son-in-law shoots a fat buffalo in snowy conditions,
    but the wounded animal escapes and cannot be tracked.
  language: English
  quote_policy: summarized
