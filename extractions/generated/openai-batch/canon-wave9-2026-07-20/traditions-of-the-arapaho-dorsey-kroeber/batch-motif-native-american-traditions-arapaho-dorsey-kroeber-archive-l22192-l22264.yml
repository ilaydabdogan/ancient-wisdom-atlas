canonical_text:
  quote: ''
  summary: 'The passage contains abstracts of several Arapaho traditions: a man fakes
    death and disguises himself to marry his daughter; one version of Nih''anqan and
    the Seven Sisters in which a wolf consumes or draws in sisters, the oldest sister
    kills it, and a wooden young man is made; and the beginning of another Seven Sisters
    account in which seven daughters are expelled, settle in a mountain cave, and
    obtain animals and crafted goods through supernatural acts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man camping alone with his wife and daughter devises a plan to have sexual
    connection with the daughter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man pretends to be fatally ill and instructs his daughter and wife about
    hanging his body on a tree and about the daughter's future marriage.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife and daughter believe the man is dead, prepare his body as directed,
    and leave the burial place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After they leave, the man frees himself, cuts up clothing, scatters animal
    bones and strings, and makes the place look as if wolves had been there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother and daughter return after four days, find the staged remains, bundle
    the bones and remnants, put the bundle on the tree, mourn, and return to camp.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The daughter later sees a man dressed in white with a white bow-case and quiver,
    who identifies himself as One-Eyed-Sioux.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The daughter tells the visitor that he must marry her, and he consents in
    sign language.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The daughter discovers that the visitor's plastered eye is sound and recognizes
    him as her father.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The mother enters the tipi, recognizes the man as her former husband, pulls
    him from the bed, and beats him until he admits who he is.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: In the Nih'anqan and Seven Sisters abstract, seven women travel and one disappears
    each night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The oldest sister finds that a wolf has drawn the sisters in, kills the wolf,
    and the sisters return to life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The sisters settle in a good country and make a young man of wood by putting
    clothes on him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The wooden young man goes wooing, but the sisters are not satisfied with the
    women he brings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Nih'anqan takes the young man's clothing and marries a young woman intended
    for him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: In another Seven Sisters abstract, seven daughters refuse successive marriage
    proposals.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: A son is born, grows rapidly, and says he wants all his sisters to get married.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The parents decide to keep only the son and tell the daughters to go and support
