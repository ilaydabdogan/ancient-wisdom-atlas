canonical_text:
  quote: ''
  summary: A cow and calf spread news that people are in a tree. Lone-Bull returns
    with the herds and orders the tree attacked. The people shoot the attacking animals
    after Mole identifies their vital spots. Splinter-Foot wishes that Lone-Bull's
    horns will pierce the tree and become fastened; this happens, and the people descend
    and kill him. They burn Lone-Bull and the tree, then declare that animals should
    not have human wives and that Lone-Bull's ashes are connected with arrows, robes,
    and lodge fire customs.
  language: English
  quote_policy: summarized
