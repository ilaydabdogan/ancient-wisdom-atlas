canonical_text:
  quote: ''
  summary: An Arapaho abstract recounts Lime-Crazy, the younger brother of Big-Chief.
    After social disorder, attempted drowning, and abandonment by his older brother,
    he repeatedly survives and returns. He emerges from a pit after years, punishes
    men who reject his sister-in-law’s announcement, restores Big-Chief’s status and
    wealth, is abandoned again across a river, receives instructions from a swift-hawk
    concerning Father-of-Waters/Hinchabeet and a bone whistle, rises with the water
    to the sky, returns to camp, and is later said in a second abstract to be lost
    in a snow storm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Big-Chief has a younger brother described as lazy, inactive, or untidy, and
    the people ridicule him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Big-Chief urges him to change and get acquainted with women, the younger
    brother approaches women and is said to make love indiscriminately or entice women
    into brush.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: People complain and, after Big-Chief permits them to act, they bind the younger
    brother and throw him into deep water; a second attempt includes tying a heavy
    stone to him, but he escapes both times.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Big-Chief takes his brother hunting, kills a buffalo, gives him a twig or
    branch to drive flies from the meat, tells him to keep circling from right to
    left, and then does not return.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The younger brother continues driving away flies for three or four years;
    when found, only the top of his head and the branch are visible, and he refuses
    to leave because of the instruction he was given.
  category: action
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: During the younger brother’s absence, people take Big-Chief’s dogs, tipi,
    and other possessions and tell him he is no longer chief.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Big-Chief’s wife asks him to search for his brother and later succeeds in
    persuading the younger brother to jump out of the pit and return toward the camp-circle.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The sister-in-law is sent to announce the younger brother’s return, but men
    in or near the tipi reject her message, call her crazy or a liar, and hit her
    with tallow, greasing her dress.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Lime-Crazy enters carrying a club-board, makes the men sit in a row with their
    legs toward the fire, and tells his sister-in-law to strike their shin bones.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After Lime-Crazy and the sister-in-law return to the tipi and obtain what
    they need, Big-Chief and his wife soon have plenty and are treated respectfully,
    though people still hold prejudice against Lime-Crazy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Three young men persuade Lime-Crazy to hunt, take him across a big river in
    a boat in connection with eagles’ nests, recross the river, and leave him behind
    with eagle feathers.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A swift-hawk speaks to Lime-Crazy and instructs him to go upriver to grandfather
    Father-of-Waters, Hinchabeet, who would carry him across, and tells him to use
    eagle feathers and a bone whistle at a critical moment.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: At mid-river Lime-Crazy blows the bone whistle, leaps straight up, the water
    follows him, he touches the sky, lands on a hill-top, and later returns to the
    camp-circle after the water recedes.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The second abstract adds that Lime-Crazy is finally lost in a snow storm.
  category: sequence
  evidence_refs:
  - ev:11
