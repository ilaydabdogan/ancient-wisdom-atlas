canonical_text:
  quote: ''
  summary: Sleepy-Young-Man kills a husband, carries the severed head to an iron tipi,
    and is pursued by cannibal brothers after geese raise an alarm. A woman in the
    iron tipi tells him to run around the camp four times, lets him in, and uses a
    sharp door-trap to cut off the cannibals’ heads. Sleepy-Young-Man returns home
    with scalp-locks for his father, is recognized by him, and the narrator explains
    a saying about cannibals and sons who sleep late. The passage then begins the
    related text titled “The Beheaded Ones,” about a young man habitually sleeping
    too long and being rebuked by his father.
  language: English
  quote_policy: summarized
