canonical_text:
  quote: ''
  summary: The passage concludes an episode about Lime-Crazy returning to camp, intervening
    when a drumming old-men's society mistreats his sister-in-law, restoring his older
    brother's chiefship and goods, surviving a dangerous river crossing through hawk-given
    instructions and eagle-feather offerings, and later dying by white owl/snow-storm
    or lightning. It then begins the 'Origin of the Buffalo Lodge,' describing an
    organized buffalo hunt in a camp-circle, a swift young steer fleeing the hunters,
    and a woman who praises the steer and wishes to marry him; the steer hears and
    receives her words.
  language: English
  quote_policy: summarized
