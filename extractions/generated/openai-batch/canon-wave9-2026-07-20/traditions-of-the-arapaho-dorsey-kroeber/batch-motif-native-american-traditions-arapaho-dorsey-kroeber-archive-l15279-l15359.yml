canonical_text:
  quote: ''
  summary: In tale 128, “The Deserted Children,” a brother and sister insult a chief
    and are deliberately abandoned by the moving camp. After their mother denies them
    and they are tied up and left to starve, an old dog frees them. An unseen voice
    guides them to buffalo and helps them obtain prepared meat and skins. The children
    become prosperous while the people who abandoned them starve; when the parents
    return, the grown children deny their mother. Editorial notes list other traditions
    in which the deserted-children tale occurs and mention a variant in which the
    dog becomes a horse. The passage then begins tale 129 with the birth and growth
    of a girl in an isolated hunting family.
  language: English
  quote_policy: summarized
