canonical_text:
  quote: ''
  summary: 'An abstracted Arapaho narrative episode: Splinter-Foot is warned to stay
    in the tipi and continue quillwork while the men hunt, but a shinny ball enters
    the tipi and draws her into a game. She is led away to the buffalo herd of Lone-Bull,
    who treats her as his wife. Crow, Magpie, and Mouse fail to retrieve her, but
    Mole rescues her by an underground passage, leaving her robe as a decoy. Lone-Bull
    and the buffalo pursue; the woman wishes for a cottonwood tree, and the people
    climb it. The buffalo attack the tree, the men shoot them, Mole reveals Lone-Bull’s
    vulnerable parts, and a brother kills him when his horns stick in the tree. Lone-Bull
    is burned to ashes, and the passage closes with the conclusion that animals should
    not have human wives because this makes them vulnerable to humans.'
  language: English
  quote_policy: summarized
