canonical_text:
  quote: ''
  summary: Calf-Boy asks Main-Bull to let him and Blue-Feather go, but Main-Bull requires
    Blue-Feather to stay awake through four days and nights of tales. Blue-Feather
    falls asleep before the end, is trampled to dust by the buffalo, and is later
    restored to life from a tiny groaning headdress fragment placed in a sweat-lodge
    after his son shoots four arrows. The passage also includes a note about a Pawnee
    variant and the opening of the next tale, in which a man follows a woman's footprints.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Calf-Boy asks Main-Bull to let him and his father go after they have accomplished
    the deed and won the race.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Main-Bull says they cannot go yet because myths, tales, and stories will be
    told for four days and four nights, and Blue-Feather must stay awake through all
    of them before taking Calf-Boy home.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Old bulls, steers, and cows gather at the center spot, while the rest of the
    buffalo sit around them to listen to the tales.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tales are told by different speakers in sequence, and the passage says
    this is to give information to the younger element and especially to Blue-Feather.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Calf-Boy sits close to his father with a stick and later pokes Blue-Feather
    to keep him awake.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Near daybreak on the third night, Blue-Feather falls asleep and snores; Calf-Boy
    raises his head but cannot wake him to answer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A parenthetical explanation links Blue-Feather's failure to stay awake with
    people staying close to a dying person, raising the head, speaking comfort, and
    with few people reaching one hundred years of age.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: The buffalo rise, walk around and over Blue-Feather, and trample him into
    dust; the dust cloud reaches the sky.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: People at the camp-circle see the sky-reaching dust cloud and understand it
    to mean that Blue-Feather has perished.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Birds and animals search for Blue-Feather's body; the crow hears groaning
    but does not find the remnants.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Blue-Bird finds a tiny groaning piece of Blue-Feather's eagle breath-feather
    headdress and carries it to the center of the camp-circle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The people erect a sweat-lodge in the center and take the headdress fragment
    inside.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Blue-Feather's son comes with a bow and four arrows, two black and two red,
