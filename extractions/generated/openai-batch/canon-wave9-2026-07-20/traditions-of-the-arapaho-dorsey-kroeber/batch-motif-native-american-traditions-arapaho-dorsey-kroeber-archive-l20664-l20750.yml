    sweat-lodge moves at the bottom, sides, and top.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: After the fourth arrow is shot, Blue-Feather comes out alive, brushing his
    hair and looking around the camp-circle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A note states that the bluebird is attached to the white buffalo robe, that
