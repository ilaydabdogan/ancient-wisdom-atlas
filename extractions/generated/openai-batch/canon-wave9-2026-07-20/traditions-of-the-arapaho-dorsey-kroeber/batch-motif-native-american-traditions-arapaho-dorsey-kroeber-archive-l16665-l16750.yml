canonical_text:
  quote: ''
  summary: A woman gathering wood follows Moon, who appears first as a porcupine on
    a stretching cottonwood tree and then as a young man, up to the sky. In Moon's
    sky household, a Frog-Woman associated with Sun is mocked and tested, then attaches
    herself to Moon's breast, explaining dark spots seen on the full moon. The passage
    ends by noting Moon's human and buffalo cow wives and their sons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four women go out to gather wood, and one of them approaches a dead white-looking
    cottonwood tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Moon appears on the cottonwood as a porcupine with beautiful quills that the
    woman wants to obtain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: As the woman pokes at the porcupine, it moves higher, the tree stretches upward,
    and her companions warn her to come down before she disappears from their view.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The animal changes into a charming young man, identifies himself as Moon,
    and tells the woman to follow him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Moon and the woman climb the tree until they reach the sky, where Moon takes
    her to his parents as his stolen wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the sky household, Sun says another daughter-in-law is outside; she is
    a frog brought by Sun from below, and she makes water when she hops.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Moon gives the human wife and Frog-Woman pieces of intestine to chew; the
    human wife cracks hers, while Frog-Woman secretly uses charcoal and black streaks
    appear at her mouth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Frog-Woman says she will remain with Moon, leaps to his breast, and remains
    there as a visible dark spot on the full moon, with her vessel as another small
    spot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Moon also has a buffalo cow wife; both the human woman and the buffalo cow
    give birth to boys.
  category: relationship
  evidence_refs:
  - ev:7
