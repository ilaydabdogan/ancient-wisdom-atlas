canonical_text:
  quote: ''
  summary: The passage finishes a Nariniiha episode in which a woman offers him water
    as a marriage request, later rejects him when she sees him used as Sasayi's platform
    in a Sun-dance context, and marries Sasayi. The text then identifies Nariniiha
    as a badger and explains his later use as a drum/substitute. It then begins “The
    White Dog and the Woman,” describing a self-sufficient unmarried woman who rejects
    suitors until a nocturnal young man enters her bed; she marks his white-painted
    buffalo robe with red paint to identify him.
  language: English
  quote_policy: summarized
