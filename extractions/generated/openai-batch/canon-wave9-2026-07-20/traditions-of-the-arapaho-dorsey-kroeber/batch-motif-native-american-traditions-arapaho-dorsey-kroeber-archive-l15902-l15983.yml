canonical_text:
  quote: ''
  summary: White-Owl repeatedly questions Blood-Clot-Boy with riddles or evaluative
    questions while causing wind, snow, sleet, and blizzards by moving his wings and
    tail. Blood-Clot-Boy answers with eyes or eyesight, the equal benefaction of man
    and wife, day/night/earth as sacred medicine, an eagle breath feather, tipi pegs,
    eyelids, and buffalo meat. He sits wrapped in a buffalo robe during the storm,
    and the passage ends as White-Owl begins a question about obtaining weapons.
  language: English
  quote_policy: summarized
