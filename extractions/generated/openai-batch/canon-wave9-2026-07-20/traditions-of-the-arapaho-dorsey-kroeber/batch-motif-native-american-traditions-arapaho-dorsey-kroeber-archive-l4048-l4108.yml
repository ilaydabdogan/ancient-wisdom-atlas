canonical_text:
  quote: ''
  summary: The passage ends one Nih’anqan episode involving a sleep wager with a rabbit,
    punishment by fire, excrement appearing as small rabbits, a garment placed on
    a rock and reclaimed, pursuit by the rock, rescue by a bull-bat, and the widening
    of the bull-bat’s mouth. It then begins a tale titled “Nih’anqan Pursued by the
    Rolling Stone,” in which Nih’anqan travels downstream, repeatedly asks a floating
    lump of pemmican how much he may bite, takes more than instructed, and finally
    swallows the remainder.
  language: English with Latin insertions
