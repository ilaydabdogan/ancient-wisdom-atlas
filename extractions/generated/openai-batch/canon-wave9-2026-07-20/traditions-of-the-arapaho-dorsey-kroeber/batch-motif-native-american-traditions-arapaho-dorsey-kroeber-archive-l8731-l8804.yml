canonical_text:
  quote: ''
  summary: A traveling group crosses a deep stream on a beaver dam. The youngest member
    gets a splinter in his foot, becomes unable to keep up, and is carried and cared
    for by his companions. At a river camp the companions build a warm shelter, provide
    firewood and food, go hunting, return with game, and feed and cheer the injured
    man, whose foot remains swollen and painful.
  language: English
  quote_policy: summarized
