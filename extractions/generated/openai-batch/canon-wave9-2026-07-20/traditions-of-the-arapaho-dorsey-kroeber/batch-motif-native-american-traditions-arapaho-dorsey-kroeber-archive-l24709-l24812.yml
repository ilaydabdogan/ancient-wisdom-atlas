canonical_text:
  quote: ''
  summary: An abstract recounts a contest between a human father and Lone-Bull, with
    the boy/Calf-Boy acting as messenger, helper, and proxy. Lone-Bull is killed in
    a duel, comes to life again, and sets further tests involving calf identification,
    racing, and continuous dancing. After the contests, Lone-Bull declares a future
    relationship between buffalo and humans and asks for objects to serve as his body
    parts; the abstract closes by saying his entire body is made of these articles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy tells his father that Lone-Bull has two soft parts on his body, one
    below the neck in front and one at the flanks or kidneys.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lone-Bull sends the boy to tell the father to prepare for a duel, and the
    husband goes to an open space with a bow and four arrows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lone-Bull rushes at the man four times and misses; the man shoots him through
    the heart and flank, after which Lone-Bull vomits blood and dies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lone-Bull comes to life again and sets a test in which the father must identify
    his son among yellow calves.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The boy tells his father that he will move his left ear; after the calves
    all move their left ears, he moves it and stops on the fourth circuit, and the
    father identifies him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Lone-Bull proposes a race; the boy runs for his two-legged father, the father
    ties an eagle breath-feather to the boy's tail, and the boy wins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Lone-Bull proposes four days and nights of continuous dancing; the father
    fastens four small turtles to Calf-Boy's feet, animals fall asleep in sunken holes,
    buffalo disappear, and Calf-Boy does not sink.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Lone-Bull says that thereafter the animals will be harmless to the man's fellow-men
    and that their flesh will be his subsistence.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Lone-Bull says the animals will protect themselves by hearing, smell, and
    running away, and that a murderer eating a piece of human flesh will bring them
    to close range.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Lone-Bull asks what he shall have for various body parts, and the man sends
    named articles for the backbone, tongue, eyes, heart, lungs, horns, larynx, intestines,
    gullet, tail, kidneys, liver, brain, blood, and other parts.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The abstract states that Lone-Bull's entire body is made up of the listed
    articles.
  category: attribute
  evidence_refs:
  - ev:7
