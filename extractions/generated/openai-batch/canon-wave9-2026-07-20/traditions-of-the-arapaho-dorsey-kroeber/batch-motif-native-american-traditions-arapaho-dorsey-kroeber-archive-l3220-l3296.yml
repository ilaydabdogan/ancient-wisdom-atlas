canonical_text:
  quote: ''
  summary: Beaver grants Nih'angan a power involving arrows that part when he slides
    down a bank, warns him to use it seldom, and gives him a bow case and quiver.
    Nih'angan repeatedly uses the power along riverbanks while Beaver follows and
    watches. On a later attempt he sets the arrows with sharp points toward him and
    is caught on them. Beaver frees him, sends him home, and takes away the bow case
    and quiver. An appended note connects the method with children's riverbank sliding
    and says beaver hide is used for a chief's or head man's bow case and quiver.
  language: English
  quote_policy: summarized
