canonical_text:
  quote: ''
  summary: A man returns home to find his wife and children supplied with rabbits
    and berries. He prepares one hundred buffalo arrows and a bow while his wife gathers
    food, poles, and firewood around their shelter lodge. He tells her not to be frightened
    or call him if she hears a stranger’s voice while he sleeps. As he sleeps, a buffalo
    cow reveals something to him and he understands an animal gift. Near daylight,
    his wife hears approaching animals, sees a buffalo close to the door and a large
    herd beyond it, and wakes him. He kills a buffalo with each of the one hundred
    arrows, commands the remaining herd to retreat, and says they have been pitied
    and now have future dependence. The family processes the meat and hides and improves
    their camp supplies.
  language: English
  quote_policy: summarized
