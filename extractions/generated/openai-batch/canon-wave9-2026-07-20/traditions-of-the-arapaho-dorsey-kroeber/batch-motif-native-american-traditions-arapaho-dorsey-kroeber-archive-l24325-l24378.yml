canonical_text:
  quote: ''
  summary: An abstract relates how a tangled-haired stranger enters a woman's tipi,
    kills her, finds twins in her body, and leaves them by the door and the spring.
    Her husband later encounters the boys, named By-the-Door and Spring-Boy. The boys
    restore their mother through bows, black and red arrows, and a sweat-lodge. They
    then enter places their father warns against and kill Open-Brains, an iron-covered
    Buffalo-Bull, and Thunder-birds, bringing trophies back to their father.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A stranger with tangled hair and fierce looks enters the woman's tipi and
    takes a seat behind the center.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman offers cooked meat in a wooden bowl, then in her white buffalo robe
    and best buckskin dress; the visitor rejects these until she places meat on her
    chest.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man eats, cuts the woman open, finds twins, puts one by the door and the
    other by the spring, covers the woman with a buffalo robe, and leaves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The husband returns, discovers his wife's condition, mourns during the night,
    and buries her on the prairie.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The husband later finds arrows scattered in the tipi, hears boys playing,
    and catches the boy named By-the-Door while Spring-Boy escapes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: By-the-Door lures Spring-Boy into the tipi for an arrow game, and the father
    catches Spring-Boy after resistance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boys tell their father to make two bows, two black arrows, and two red
    arrows, to erect a sweat-lodge, and to place their mother inside.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The boys shoot arrows upward while calling on their mother to get away; at
    the fourth arrow she comes out of the sweat-lodge fully restored.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The father warns the boys not to go to the timber, but they go to a lone tipi
    containing a tangled-haired man and snakes crawling everywhere.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The boys louse the tangled-haired man, find that he has open brains, tie his
    hair to tipi poles, place a red-hot stone inside his skull, and he burns to death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After a warning about a hill, the boys find an iron-covered Buffalo-Bull,
    shoot him, and bring his horns to their father for dippers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After a warning about a river precipice, the boys find young eagles or Thunder-birds,
    learn the sky signs of the father eagle's anger, shoot arrows into rock, and kill
    the Thunder-bird and the little ones.
  category: sequence
  evidence_refs:
  - ev:6
