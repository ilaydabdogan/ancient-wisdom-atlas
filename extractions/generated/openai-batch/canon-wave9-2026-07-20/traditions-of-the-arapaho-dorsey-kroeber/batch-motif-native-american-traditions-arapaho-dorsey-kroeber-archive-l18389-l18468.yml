canonical_text:
  quote: "“Don’t answer any strange voice during my absence.”"
  summary: The passage begins with a note on Found-in-Grass and affinal service. In
    the tale, a man and his pregnant wife camp alone near a river. Before hunting,
    the husband repeatedly warns his wife not to answer any strange voice while he
    is away. While she works on a quilled buffalo robe, a distant prolonged voice
    twice says that it has dropped something, and she does not answer. The first evening
    the husband returns with beef; after the second day, footsteps and a voice at
    the tipi again announce beef, but the excerpt ends before the figure is identified.
  language: English
