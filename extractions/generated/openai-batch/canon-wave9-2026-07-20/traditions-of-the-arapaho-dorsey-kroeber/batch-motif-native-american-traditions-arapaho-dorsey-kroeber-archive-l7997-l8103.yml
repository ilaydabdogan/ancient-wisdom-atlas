canonical_text:
  quote: ''
  summary: A married first-person narrator, alone on a hill and thinking of her absent
    husband, is approached by a handsome young man. He proposes a secret bond of love,
    invokes the Flat-Pipe, Thunder, and Water Monster as witnesses, and she consents.
    After an intimate encounter, she repeatedly seeks chances to see him again, but
    he does not return; after a month, her expected menstruation does not occur.
