canonical_text:
  quote: ''
  summary: A young man asks a woman at an iron tipi for help reaching her cannibal
    husbands. She describes their dwelling, their goose warning signal, and the precautions
    needed to pass as her. She dresses and alters Sleepy-Young-Man to resemble her,
    gives him moccasins as a token, and instructs him about the cannibals. He enters
    the cannibal tipi disguised as the wife, but the youngest cannibal notices his
    masculine arm muscles while the older brothers dismiss the warning and go hunting,
    leaving the oldest brother with the supposed wife.
  language: English
  quote_policy: summarized
