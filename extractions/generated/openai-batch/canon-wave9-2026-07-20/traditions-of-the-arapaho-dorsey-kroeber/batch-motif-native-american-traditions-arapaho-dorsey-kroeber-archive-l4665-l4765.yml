  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the next tale, Nih'anqan has a wife and a beautiful daughter, pretends
    to be sick and dead, and asks not to be buried in the ground but placed on a tree
    unbound.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: At night Nih'anqan descends, covers one eye with clay, goes to the tent, asks
    the daughter to share the bed, is recognized by her and the mother, and is beaten
    by the mother.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the following tale, One-Eyed-Sioux camps with his wife and daughter, devises
