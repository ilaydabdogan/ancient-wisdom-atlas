canonical_text:
  quote: ''
  summary: The passage ends a tale in which a hidden man kills the cruel Nih'angan,
    who revives and decides through objects thrown into lake water that people will
    die permanently. Editorial notes identify the episode as an origin of death and
    as a lesson about cruel stepparents, with parallels in Cheyenne, Blackfeet, Navaho,
    and an Arapaho Sun Dance origin myth. The passage then begins two related tales
    in which a father feigns sickness or death and asks for tree exposure burial in
    order to return at night and approach his daughter.
  language: English with a short Latin passage
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man furnishes food to the wife and children, and they eat enough that day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man tells his wife he will kill Nih'angan, hides in an empty parfleche
    near the bed with a knife, and waits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nih'angan takes the best food while waste is given to the children, who refuse
    it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hidden man emerges from the parfleche, stabs and kills the cruel husband,
    and the body is cut into pieces and thrown outside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nih'angan becomes alive again, goes to a big lake, and asks what will happen
    to his children after death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A stick, a buffalo chip, and wood pith thrown into the water return to the
