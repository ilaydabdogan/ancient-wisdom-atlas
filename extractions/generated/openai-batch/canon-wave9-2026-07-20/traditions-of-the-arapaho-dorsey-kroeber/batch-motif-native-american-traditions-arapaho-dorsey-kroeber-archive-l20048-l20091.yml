canonical_text:
  quote: ''
  summary: Elk-woman and Buffalo-woman compete for their husband's favor by preparing
    differently flavored pemmican. After the husband says he likes both wives and
    asks them not to be jealous, Buffalo-woman threatens to leave with her boy. At
    night she leaves with the boy; outside the tent they become buffalo again and
    leave hoof tracks. They travel through hills and among buffalo herds while she
    asks for her parents. Blue-bird misses his son, follows the eastward buffalo tracks,
    and asks a herd about his wife and boy.
  language: English
  quote_policy: summarized
