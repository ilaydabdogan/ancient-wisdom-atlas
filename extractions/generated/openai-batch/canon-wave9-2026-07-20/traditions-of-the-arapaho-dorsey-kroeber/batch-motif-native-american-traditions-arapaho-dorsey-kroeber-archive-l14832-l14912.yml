canonical_text:
  quote: ''
  summary: The passage gives the close of a Blind-Man story in which a wife secretly
    eats meat from a buffalo kill, lies to her blind husband, and is exposed when
    an Owl restores his sight; the husband then kills her, and the narrator adds an
    etiological explanation about domestic deception, murder, and separation. The
    passage then notes a comparison with No. 126 and begins No. 126, where an old
    blind man is similarly deceived by his wife about buffalo he has killed until
    an owl offers him eyes so that he can see.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The husband smelled fresh meat and tallow on his wife's dress and mouth and
    questioned her late return; she attributed the odor to sweating while gathering
    berries and tomatoes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife went again to the place where she had meat and spent the day eating
    and resting while Blind-Man was alone, hungry, and crying.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wife returned before sunset with a few tomatoes, and the husband again
    said she smelled like meat and tallow; she answered roughly, and he kept silent.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: An Owl on the tipi pole told Blind-Man that he had killed the buffalo and
    that his wife had been eating the meat by herself.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: When Blind-Man looked up at Owl's eyes, his eyesight was restored, and he
    had eyes like those of an owl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Blind-Man took his bow and arrows, found his wife with plenty of food around
    her, and shot her through the body several times until she died.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator presents the event as a reason why wives may treat husbands underhandedly
    and why husbands become murderers and separations occur.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: In No. 126, an old blind man living in a lone tent shot at buffalo with his
    wife's help aiming and said he felt he had killed one, but his wife denied it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In No. 126, the wife brought back scraped bones, ribs, and lungs instead of
    meat, butchered buffalo and made pemmican, and gave none to her husband; this
    occurred four times.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: In No. 126, an owl on the tent said it would give the old man its eyes so
    he could see how his wife treated him, and the old man could see again.
  category: action
  evidence_refs:
  - ev:10
