canonical_text:
  quote: ''
  summary: The passage ends one Nih’ancan episode in which a bear is burned and wolves
    steal the resulting meat, then gives the episode of Nih’ancan and the Dancing
    Ducks. Nih’ancan has Coyote call birds and animals to a dance near a precipice,
    instructs them to dance with closed eyes and leap forward, and kills them except
    for a wary duck. He roasts the animals, sleeps, and Coyote eats the food. The
    passage closes with an etiological explanation of hunting, coyote stealing, and
    lame pretenders, plus editorial notes comparing the dancing-bird incident with
    variants in other North American traditions.
  language: English with some Latin in notes
  quote_policy: summarized
