    a girl is born from a wounded foot or leg, is taken or demanded by a bull, is
    rescued by burrowing, the pursuers attack a tree, the bull is killed, and the
    girl raises the group to the sky.'
  claim_level: same_motif
  target: Foot-Stuck-Child abstracts 81 and 82 within the supplied passage
  evidence_refs:
  - ev:4
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: Both are abstracts, and one is more compressed; the first also includes
    a separate rock episode not present in the second.
