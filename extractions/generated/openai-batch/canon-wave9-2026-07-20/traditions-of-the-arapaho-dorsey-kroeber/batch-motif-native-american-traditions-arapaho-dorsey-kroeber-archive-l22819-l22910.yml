canonical_text:
  quote: ''
  summary: 'The passage contains abstracts of several Arapaho traditions: a woman
    becomes pregnant after reflected sun rays strike her at a river and gives birth
    to beaver-like offspring; a bear destroys a people, but a surviving sister escapes
    with brothers by sending them to the sky with a shinny ball, becoming stars; Foot-Stuck-Child
    variants describe a girl born from a swollen foot or leg, demanded or carried
    off by a bull and later by a rock, rescued by burrowing animals, pursued, and
    raised to the sky by a ball; the beginning of Splinter-Foot-Girl describes a girl
    emerging from a young man''s splintered foot abscess.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two newly married women go to a river for water; one dips her vessel, and
    sun rays reflected from the deepest place across the river strike her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The companion tells the woman to empty her vessel; the woman refuses, and
    the companion avoids dipping her own vessel because she fears something might
    happen.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman who dipped the vessel becomes pregnant, gives birth to beaver-like
    babies without tails, later has a human baby, and the boy drowns in Wind River.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the bear abstract, young men go on the war-path, a bear destroys all the
    people except a girl, and the girl becomes the bear's servant.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The girl meets the returning war-party or brothers, learns the bear's vulnerable
    small black spot, and tells them how the bear can be killed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The sister escapes with the brothers; when the bear gains on them, she kicks
    a shinny ball upward, sending the brothers and herself to the sky.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bear sees the ascent, stops and cries, and blood from his scratching is
    said to indicate a circle of stars, with the sister as a lone star off to one
    side.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In a Foot-Stuck-Child abstract, a child or girl is born from a young man's
    swollen, wounded foot.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bone-bull demands the girl in marriage; after refusals, the young men consent,
    and objects sent with the girl become parts of the bull's body.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Various animals fail to recover the girl, but the mole and the badger burrow
    under her and bring her back while she leaves her robe in her place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The fleeing people take refuge in a tree; buffalo butt the tree, and the bull
    eventually sticks fast in it and is killed by the young men.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: A rock later demands the girl in marriage; after another rescue by mole and
    badger, the girl makes a canyon behind the fugitives and then raises herself and
    the men to the sky by kicking up a ball.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A second Foot-Stuck-Child abstract gives a compressed variant in which a girl
    is born from a wounded leg, a bull carries her off, the mole rescues her, buffalo
    attack a tree, the bull is killed, and the girl raises the group to the sky where
    they become the Pleiades.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the beginning of Splinter-Foot-Girl, seven young men cross a stream at
    a beavers' dam, and the youngest gets a splinter in his foot.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The young man pierces the swollen foot abscess, and a fully formed little
    girl comes out; he wraps her, feeds her, makes clothing and shinny-game equipment,
    and tells the others she came from the abscess.
  category: sequence
  evidence_refs:
  - ev:7
