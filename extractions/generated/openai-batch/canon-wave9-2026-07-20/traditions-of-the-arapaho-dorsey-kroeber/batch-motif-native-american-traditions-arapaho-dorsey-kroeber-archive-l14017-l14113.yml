canonical_text:
  quote: ''
  summary: Two boys journey to a distant camp after an old woman directs them to wait
    at a spring for two moon-shell-owning daughters who give water to children. The
    girls’ father recognizes the boys as sons-in-law, and the boys marry into the
    camp. Their small, ugly youngest brother later travels there with his mother,
    eating tallow. After an enemy attack kills the two married brothers and others,
    the youngest brother orders a sweat-lodge, a bow, and four colored arrows prepared;
    after shooting the arrows upward, he restores the dead to life. A note describes
    the two daughters, their dippers or shell spoons, and the ceremonial importance
    of the spoon. The passage then begins a separate tale, “Split-Feather,” in which
    a jealous husband watches his wife and a young man of the Star society.
  language: English
  quote_policy: summarized
