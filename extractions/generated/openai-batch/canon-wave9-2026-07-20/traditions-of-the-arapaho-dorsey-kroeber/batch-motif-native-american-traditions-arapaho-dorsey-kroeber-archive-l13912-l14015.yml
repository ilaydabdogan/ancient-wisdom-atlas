  text: Women scrape a sacred hide while wearing sage wreaths at wrists, waists, ankles,
    and head, and discard the meat removed from the hide.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children accidentally reach the discarded beef, roast and eat it, and years
