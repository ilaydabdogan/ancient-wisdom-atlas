canonical_text:
  quote: ''
  summary: 'The passage includes three adjacent narrative units: women scrape a sacred
    white buffalo hide with sage wreaths and discarded meat is eaten by children whose
    hair later turns gray; eight young men on the war-path each temporarily become
    women for four days after camping under eight cottonwood trees; and two formerly
    dirty, lazy brothers reform themselves and begin a westward search for the owners
    of moon-shells, receiving directions from old women.'
  language: English
  quote_policy: summarized
literal_observations:
