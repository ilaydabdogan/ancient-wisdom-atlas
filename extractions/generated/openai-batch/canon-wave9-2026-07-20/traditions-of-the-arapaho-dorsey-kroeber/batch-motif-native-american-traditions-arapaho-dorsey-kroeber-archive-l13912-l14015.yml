    cow meat is not eaten.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A note states that a herd acted before a hunter as buffalo women do before
    spectators during the Buffalo Lodge ceremony.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A party of eight good-looking young men is on the war-path; at the first night
    camp one turns into a female, separates from the others, remains silent, and after
    four days becomes a man again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The same four-day transformation happens successively to the second man and
    then to all members of the party, taking thirty-two days in total.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The young men choose not to return home during the experience, preferring
    the risk of death or disease to being known as half woman and half man.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says the young men contracted the change of sex while camped under
    eight cottonwood trees, and that they reported the incident when they returned.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In a camp-circle, an oldest married brother advises two lazy and dirty younger
    brothers to rise early, wash, dress, and perform men's duties, linking this to
    seeing the owners of moon-shells.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The two younger brothers decide to live better, ask for a tipi to be cleaned
    and oldest men to be called, and emerge cleaned and dressed, surprising the people.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The two brothers start searching for the owners of moon-shells, travel night
    and day, and receive westward information from old women they visit.
  category: sequence
  evidence_refs:
  - ev:8
