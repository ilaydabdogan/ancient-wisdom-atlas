canonical_text:
  quote: ''
  summary: 'The passage closes one narrative with a boy''s wife, sister-in-law, father-in-law,
    and father, ending in the boy''s return as chief. It then begins the tale of Blue-bird:
    in winter he wanders among camps, brings Elk-woman to his parents'' tent, travels
    south to a spring where he encounters a buffalo cow, then reaches a camp where
    an old woman recognizes him. The next morning his buffalo cow wife and a calf
    arrive, and the calf is said to be seeking his father.'
  language: English
  quote_policy: summarized
