canonical_text:
  quote: Gopher told him that there was a way to get his wife back.
  summary: A grieving husband is helped by Gopher, who uses four painted arrows and
    underground travel to reach the man’s wife at the steer’s tipi. The woman escapes
    by leaving a robe decoy supported by arrows; after a pursuing herd is alerted,
    Gopher brings her back underground to her husband, and the spouses reunite.
  language: English
  quote_policy: quoted
