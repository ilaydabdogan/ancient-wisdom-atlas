canonical_text:
  quote: ''
  summary: A cow or Buffalo-woman seeks Blue-bird through an old man's public call.
    Blue-bird assumes the caller may be Elk-woman and a son born after he left, but
    he does not recognize the woman at first. She explains that she was the buffalo
    cow mired at a spring and that he caused her child. Blue-bird accepts her and
    the boy, later taking them north to his parents' home, where Elk-woman is already
    present. The two women become jealous rivals and repeatedly bring different kinds
    of meat, fat, and pemmican to prove what they can provide.
  language: English
  quote_policy: summarized
