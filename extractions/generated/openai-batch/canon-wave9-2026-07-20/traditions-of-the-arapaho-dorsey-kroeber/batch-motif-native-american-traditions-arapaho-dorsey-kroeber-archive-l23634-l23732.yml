canonical_text:
  quote: ''
  summary: 'The supplied range contains a sequence of short abstracts: an injured
    man aided by a skeleton or ghost; a woman whose sexual organ contains teeth; a
    suitor who retrieves a war-dead body; a Sioux woman who dresses and acts as a
    man in war; a betrayal involving a Kiowa; a personified Laughter that kills people;
    a small hill revealed as a horse-tick; a white buffalo cow hunted and ritually
    treated; and eight young men who temporarily become women after camping under
    cottonwood trees. The final line gives only the next title, ''Journey to the Owners
    of Moon-shells.'''
  language: English with some Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A war party travels on foot; one man cannot continue because of ankle pain,
    so the others build him a thatched shelter and leave him food.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After many days and a snowstorm, the injured man kills a buffalo, skins it,
    and places meat by the fireplace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A skeleton wearing a tanned robe enters at night and says it caused the man's
    ankle trouble to keep him from a war party that was killed by enemies.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The man feeds the skeleton roast beef, the ghost rubs his ankle and heals
    it, leads him to camp, and later gives or displays a gift by which he becomes
    a pile of bones under a robe during a hand-game.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: A handsome woman has had several husbands die mysteriously; a later husband
    uses a whetstone or file and files teeth found in her sexual organ.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A girl promises to marry the man who brings back part of her brother's body
    after he has been killed in war; an ugly man finds the corpse, brings it back,
    and marries her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Sioux woman dresses and acts as a man, goes to war, distinguishes herself,
    and then has herself shot.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A young man elopes with his brother's wife, meets a Kiowa, and the woman helps
    the Kiowa; the young man kills the Kiowa and later the older brother's friends
    shoot the woman dead.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Laughter is described as the one who has caused people to laugh themselves
    to death; a young man nearly dies but kills Laughter with a buffalo foetus.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Young men returning from a war-path rest on a small hill; while they sleep,
    the hill carries them off and is identified as a horse-tick.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A hunter repeatedly tells war stories and wounds a white buffalo cow; the
    buffalo herd circles the cow four times and licks her face before she finally
    dies.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The hunter prays to the dead white cow, skins it reverently, takes the hide
    to a priest, and women wearing sage wreaths scrape the sacred hide.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Children eat discarded meat from the white buffalo hide, and years afterward
    their hair turns gray.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Eight young men on a war-path each temporarily becomes female; the change
    is said to have been contracted while camping under eight cottonwood trees and
    lasts thirty-four days.
  category: sequence
  evidence_refs:
  - ev:9
