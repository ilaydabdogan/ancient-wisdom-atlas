canonical_text:
  quote: ''
  summary: A little boy repeatedly obtains food from his mother under the pretense
    of going out to play. He secretly visits puppies in a shelter, calls them his
    nephews, feeds them first with meat and later with a bowl of greasy stock, handles
    them affectionately, and instructs them to stay hidden and quiet. His sister criticizes
    his demands on their mother, while the mother defends him. The household is led
    to believe that he has consumed the stock himself.
  language: English
  quote_policy: summarized
