canonical_text:
  quote: ''
  summary: Two boys repeatedly disobey their father's warnings, kill several dangerous
    beings, and bring back useful materials. After they kill a multicolored worm-like
    animal at a hill, a whirlwind separates Spring-Boy from his family. He is later
    found in grass by an old woman, adopted, renamed Found-in-Grass, and grows up
    quickly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mother is inside the tipi while the two boys go toward thick timber.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the timber the boys find an old-looking tipi of smoked hide and are invited
    inside by a person within it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Inside the smoked-hide tipi the boys see a man alone, called Tangled-Hair,
    who has long tangled hair and asks them to search his head for lice.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The boys untie Tangled-Hair's locks, cause him to sleep, fasten the locks
    to the tipi poles, heat round stones in the fire, place them in his open skull,
    kill him, and take the hair home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The boys give Tangled-Hair's locks to their father and tell him to use them
    on his shirts and leggings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The father warns the boys not to go to another place where a strong and fierce
    being lives.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:7
  text: The boys sneak away, find a large panther ready to spring on them, kill it
    with arrows, skin it, and give the hide to their father for a bow-case and arrow
    quiver.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The father warns the boys not to go to the cliff at the river because a very
    powerful creature lives there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: At the cliff by the river the boys find an eagle in a nest; its twinkling
    eyes cause lights of different colors to appear.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: One of the boys converts a rib and tendon into a bow and arrow; the tendon-arrow
    contracts after striking the eagle and brings it to earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The boys kill the eagle, pull out feathers from its tail and wings, and give
    the feathers to their father for war bonnets, wing feathers, and pendants.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: The father warns the boys not to go to a hill where a big animal lives that
    destroys people and other beings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: The boys sneak to the hill, see a big animal like a worm with different colors,
    shoot it, kill it, and leave it lying there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: A tremendous noise and dust cloud come behind the boys; a whirlwind strikes,
    By-the-Door reaches the tipi, and Spring-Boy is blown away into the wilderness.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:15
  text: A moving camp forms a camp-circle near where Spring-Boy lands.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:16
  text: An old woman cutting tall grass for bedding finds the small boy in the grass,
