canonical_text:
  quote: ''
  summary: 'The passage closes one tale with a chased boy disappearing when a coyote
    is seen, then returning years later in ritual appearances that are said to originate
    the Kit-Fox and Star societies. It then gives a short origin of the ceremonial
    lodges: a young buffalo bull comes from the East, speaks to a man, gives itself,
    the buffalo, and named lodges or dances, after which buffalo appear from the four
    directions. The passage then begins the tale of Lime-Crazy, where Big-Chief admonishes
    his untidy younger brother to improve his appearance and go to the river, where
    the brother encounters women at a spring.'
  language: English
  quote_policy: summarized
