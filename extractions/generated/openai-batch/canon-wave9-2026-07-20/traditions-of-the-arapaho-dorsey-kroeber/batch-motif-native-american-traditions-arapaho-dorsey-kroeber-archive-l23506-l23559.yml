canonical_text:
  quote: ''
  summary: An abstract recounts how a crying boy is given over to Owner-of-Bag and
    disappears. His mother makes porcupine-quilled articles, searches for him, finds
    him in an owl household near a river, escapes with him while quilled items delay
    Big-Owl, defeats Big-Owl with a stone club, and returns home with the boy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening setting is a camp-circle family consisting of a man, wife, and
    boy; the boy becomes angry and cries.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother threatens the boy with Owner-of-Bag, throws him out of the tipi,
    and calls for Owner-of-Bag to come for him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy falls into Owner-of-Bag's bag and is given food so that he will stop
    crying.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The mother searches for the missing boy, returns in grief, and then pledges
    to make articles with porcupine quills.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: The mother makes moccasins, leggings, shirts, and robes, wraps them in a bundle,
    and begins traveling in search of the child.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: While traveling, the mother hears a voice promising services and later sees
    a solitary tipi near a river.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A young boy comes out, addresses her as mother, and tells her to enter before
    grandfather returns.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: The tipi is beside a tree with grape-vines around it, and the boy is identified
    as Little-Owl.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Little-Owl hides the mother and her bundle under a cover and bag, places arrow
    sticks on top, and warns Big-Owl not to disturb them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Big-Owl repeatedly says he smells the mother and sends Little-Owl to get buffalo,
    which are said to enter the bag when it is held open toward them.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:11
  text: The mother and boy flee by using moccasins, leggings, shirts, and robes from
    the bundle; Big-Owl follows and counts the porcupine quills on each article.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: After counting half of the one-hundredth robe, Big-Owl falls exhausted, says
    the mother has conquered, instructs her to strike him with the stone club, and
    she breaks his forehead before returning home with the boy.
  category: sequence
  evidence_refs:
  - ev:7
