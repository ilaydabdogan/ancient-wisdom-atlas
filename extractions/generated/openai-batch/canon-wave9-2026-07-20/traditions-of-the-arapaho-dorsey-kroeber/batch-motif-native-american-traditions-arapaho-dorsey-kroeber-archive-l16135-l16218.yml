canonical_text:
  quote: ''
  summary: The passage ends a Clot-woman episode in which a chief's son provides abundant
    food, asks to marry Clot-woman, and is accepted, while a jealous earlier son-in-law
    is surpassed. The old woman magically makes a fine tent by sitting on hides, hide
    pieces, and straight-stemmed plants. A new Blood-Clot-Girl episode begins with
    two tipis near a river, where old parents depend on a cruel, stingy hunter son-in-law
    who forces them to butcher a buffalo while withholding good meat from them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group left an unnamed young man behind, traveled, and reached a camp-circle
    where the chief assigned them a camping place next to his tent.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief's son sent abundant food to the old people's tent and had a messenger
    ask for Clot-woman as his wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man accepted the marriage request and said he was glad to give his
    daughter to the chief's son.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: During a buffalo hunt, the chief's son brought many horse-loads of meat to
    his father-in-law, while the jealous first son-in-law brought only one horse-load
    and reproached the old man.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old woman sat on hides, round hide pieces, and straight-stemmed plants;
    afterward they were a dressed and sewn tent, embroidered tent ornaments, and tent
    poles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old woman put up a fine tent with rattles that swung in the wind.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The first son-in-law abandoned his wife, took a new wife, camped near the
    others, and did not receive Clot-woman; the fine new tent always stood a short
    distance ahead of him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Blood-Clot-Girl episode, two tipis stood in a bottom near the river;
    one held a father, mother, and son, and the other held a husband and his wife.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The father and mother were dependent on their hunter son-in-law, who is described
    as cruel and stingy to them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The hunter son-in-law killed a fat buffalo cow near camp and had forbidden
    his wife to do more than necessary for the old people or to give them better food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The hunter son-in-law also instructed his wife not to have unnecessary family
    conversations, while the little son conveyed the parents' wishes to their daughter.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The hunter son-in-law ordered his wife to tell the old man to find the dead
    buffalo, skin it, and deliver the hide and beef without damaging the tallow or
    hide.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The old parents, hungry and feeble, butchered the buffalo; although tempted
    to eat raw tallow or flesh, they refrained because the son-in-law would notice.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the old parents delivered the hide and beef, the son-in-law showed no
    gratitude, examined the meat, and sent them only small muscles to roast and eat.
  category: action
  evidence_refs:
  - ev:9
