canonical_text:
  quote: ''
  summary: Lone-Bull repels Magpie and Mouse when they try to reach the daughter.
    The father and men lament the daughter’s situation and seek a skillful rescuer.
    Mole offers his unseen underground power, tunnels to the woman, tells her the
    men sent him, leaves her robe posed as if she remains there, and leads her through
    the tunnel to the tipi in freedom.
