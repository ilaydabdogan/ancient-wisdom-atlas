- id: obs:1
  text: A gopher approaches a woman crying on the prairie and asks why she has been
    crying so long.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman says her brother-in-law disappointed her after she had done everything
    to please him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The gopher says he is the only living one with power and tells the woman he
    will run under the ground during the night.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The gopher instructs the woman to pull blankets away in the morning and tell
    Found-in-Grass to get up.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The woman follows the instruction, pulls blankets from the young married couple,
    and tells the husband to get up.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: When Found-in-Grass gets up, after his wife has already risen, he is in a
