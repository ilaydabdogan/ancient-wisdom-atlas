    accepts these as the proper bowl.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The wife lies across in front of the visitor and places the beef on herself;
    he says this is the only kind of bowl he uses and begins eating.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: As he is about to swallow the last piece, the visitor says that sometimes
