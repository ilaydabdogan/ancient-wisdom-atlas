canonical_text:
  quote: ''
  summary: The passage contains the end of one Found-in-Grass episode and the beginning
    of another. In the first, a gopher instructs a crying woman to wake Found-in-Grass,
    who rises to find himself in a stone pit and becomes a stone monument later interpreted
    as an image connected with the Supreme Being and the earth. An editorial note
    compares related Wichita and Pawnee variants. In the second, a hunter repeatedly
    warns his pregnant wife not to answer a crying or howling caller; on the fourth
    night she answers, a tangled-haired man enters, demands an unusual serving bowl,
    accepts her body as the bowl, cuts her belly open, and finds fully grown twins.
  language: English
  quote_policy: summarized
