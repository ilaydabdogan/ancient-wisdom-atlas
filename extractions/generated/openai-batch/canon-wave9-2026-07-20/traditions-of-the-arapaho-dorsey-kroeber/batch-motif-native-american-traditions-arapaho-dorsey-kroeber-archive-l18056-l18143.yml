  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: People passing the monument of Found-in-Grass leave something in mercy for
    his protection because he has changed into stone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The narrator explains the changed Found-in-Grass as a symbol of a man watching
    from the top of a hill and as an image of the Supreme Being with a sacred-bundle
    for people.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The upright figure represents the man, and its body represents the earth with
    all its vegetation.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: An editorial note says the tale was told by Tail-Bear and compares it with
    Wichita and Pawnee variants.
  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the second tale, a man lives in a tipi with his pregnant wife and goes
    hunting during the day.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: The husband repeatedly warns his wife not to heed or answer anyone crying,
    howling, or calling at a distance while he is away.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: For several nights the wife hears crying or howling but does not answer before
    the husband returns with game.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: On the fourth night, after the husband is late, a howling person comes close
    to the tipi, stops at the door, and asks how it is with her; the wife answers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The person enters and is seen to be a man with tangled hair who sits at the
    back center of the tipi and warms himself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The wife cooks beef and tries to serve it in a wooden bowl, another utensil,
