canonical_text:
  quote: ''
  summary: Nih’ancan persuades a man to climb a peak for young eagles, secretly commands
    the peak to stretch higher, and leaves with the man’s weapon and clothing. Nih’ancan
    tells the wife that the trapped man allowed him to take her as his own, then later
    mistreats the children. The camp searches for the man. Beads found below the peak
    are explained as the man’s tears. Geese find the starving man at the top, strengthen
    him, carry him down on their backs, and land him safely. The passage notes a correspondence
    between this descent and the cradled or packed bird used in the sun-dance.
  language: English
  quote_policy: summarized
