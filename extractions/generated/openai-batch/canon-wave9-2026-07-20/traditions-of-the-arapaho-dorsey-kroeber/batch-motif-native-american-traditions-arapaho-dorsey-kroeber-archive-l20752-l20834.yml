canonical_text:
  quote: ''
  summary: A traveler follows a trail marked by trodden grass and moccasin-making
    remnants, meets a woman mending moccasins, and agrees to marry her. They travel
    together across divides and rivers to ornamented tipis. On two mornings the woman
    leaves, the tipi disappears, the man finds himself in a buffalo wallow, and the
    woman appears as a buffalo cow before becoming a woman again.
  language: English
  quote_policy: summarized
