canonical_text:
  quote: ''
  summary: 'The passage includes source notes on informants, then continues a creation
    narrative: a turtle returns from a long dive with earth; an unnamed man uses that
    earth and a sacred pipe to form land, waters, humans, reproductive placement,
    dwellings, ritual red paint practice, and differences between Indians and whites.'
  language: English with one Latin section
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The source notes identify informants for tales marked K and state that the
    present myth is from informant I, described as an old woman.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note identifies a sacred pipe as the chief fetish of the tribe and describes
    the turtle as a large black water-turtle with a ridged tail.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The turtle dives, stays gone longer than the others, and the man watches the
    place of its disappearance day and night until the water moves, boils, bubbles,
    and the turtle slowly emerges.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The turtle tells the man to take earth from the four sides of its body, and
    the man takes mud from under its four legs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The man says that other people will inhabit the edge of the earth, while Indians
    will live in the middle.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The man dries the earth on the pipe, blows fine dust in four directions, then
    on the fifth action spreads and throws all the earth while speaking about the
    reach of sight, rivers, and the great water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The dry land appears in the shape of a turtle; beyond it is the great water,
    and places where the earth does not fall become rivers and lakes.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'From the still-soft earth, the man makes four people: two men and two women,
    including a white man with a hat and a white woman with a long dress and small
    body.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Latin section says that clay bodily figures are made and given to the
    newly created humans, who at first do not know how to use or place them; after
    failed placements on the forehead and neck, placement on the lower abdomen is
    accepted and then repeated for the other pair.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Latin section includes an instruction for the man to lie upon his wife,
    followed by the pale-faced man's positive response.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The man arranges small sticks as a house for the white man and his woman,
    and arranges three sticks tied at the top with others around them as the way Indians
    will live.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Indians are called gawagnenitan, translated in the passage as rising people,
    because after being laid on the ground at night they get up in the morning.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: According to the man's instructions, the white man makes various things, including
    fences and barns.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The man gives red paint to the Indian with instructions to use it always except
    during death-related grief, and states that the white man's skin will be white
    and his hair yellow.
  category: speech
  evidence_refs:
  - ev:9
