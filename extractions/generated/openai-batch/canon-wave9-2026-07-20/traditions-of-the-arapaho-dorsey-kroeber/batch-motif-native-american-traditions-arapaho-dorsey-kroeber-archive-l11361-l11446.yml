canonical_text:
  quote: ''
  summary: A daughter in a tipi is visited at midnight by a man in a perfumed white
    robe who is identified with a dog. After a confrontation, he says he is the one
    who sleeps outside by her side. She later marks him with red paint and tallow.
    At dawn he becomes a dog again. In the morning she recognizes the marked white
    dog, tries to avoid him, and later wounds his ear with a stone axe while gathering
    wood. The dog returns to his parents in another camp, speaks as a young man, says
    he was married and that his wife struck his ear, and asks them to make clothing.
    The daughter returns home and is restless because her condition is changing.
  language: English
  quote_policy: summarized
