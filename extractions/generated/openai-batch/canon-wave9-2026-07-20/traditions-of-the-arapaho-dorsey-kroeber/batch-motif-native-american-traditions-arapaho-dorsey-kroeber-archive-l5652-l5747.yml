canonical_text:
  quote: ''
  summary: The passage concludes a story in which Nih’ancan imitates Whirlwind’s manner
    of travel, proposes marriage to her, and is overpowered by her force, receiving
    a side whorl or mark on his head. It then gives an explanation and warning about
    how people should behave when a whirlwind approaches. An editorial note mentions
    a related story about a whirlwind woman and earth enlargement. The passage then
    begins a story in which Nih’ancan mistakes reflected plums in a stream for plums
    underwater, nearly drowns after tying stones to his limbs, discovers the plums
    on a tree above, eats and collects them, and visits bear-women and children in
    a tent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Whirlwind asks the man to show how he travels; the man runs, whirls about,
    and scatters dust, leaves, and grass.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Whirlwind, described as having increased in force and velocity, flies past
    Nih’ancan, tips back the top of his head, and leaves a mark there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nih’ancan continues to a steep precipice and meets Whirlwind again, where
    she tosses branches, raises clouds of dust, and makes a clamor as she blows.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nih’ancan wants marriage with Whirlwind, asks her to marry him, and she asks
    him to display his power and speed again.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After Nih’ancan’s further display, Whirlwind blows past him with force and
    knocks him unconscious for a few minutes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the encounter, Nih’ancan’s hair is parted at one side, and the passage
    states that he received a whirl spot on his head from Whirlwind’s force.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: The passage states that people with a whorl on the side of the head are considered
    dull, lazy, and talkative.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage instructs that if a whirlwind travels toward a person, the person
    must squat down, cover the face, and wait until it passes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage warns that a person who faces a whirlwind without believing in
    its powers may have senses lessened, lose hearing, or become nervous for life.
  category: other
  evidence_refs:
  - ev:3
- id: obs:10
  text: An editorial note says that another story about the whirlwind woman traveling
    from place to place and making tipi discs tells how the earth was enlarged.
  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: Nih’ancan travels down a stream, sees red plums in the water, dives after
    them, and searches the bottom without finding anything.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Nih’ancan ties stones to his wrists and ankles to weigh himself down, dives
    again, nearly dies, and rises only when stones on one side fall off.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: While floating on his back, Nih’ancan sees that the plums are hanging on a
    tree above him, scolds himself, removes the stones, eats plums, and fills his
    robe with them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Nih’ancan goes to a tent occupied by bear-women and children, throws plums
