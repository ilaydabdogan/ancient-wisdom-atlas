canonical_text:
  quote: ''
  summary: A husband returns from hunting while his brother-in-law enters the tipi
    and falls below the bed. The wife covers him with dirt, conceals the place, lies
    to her husband about the brother’s absence, and explains away underground cries
    as noises from the fire. The husband mourns the missing brother, and the couple
    return to the main camp in signs of mourning. Later Gray-Wolf hears a human cry
    underground at the old camp and calls wolves and coyotes to come.
  language: English
  quote_policy: summarized
