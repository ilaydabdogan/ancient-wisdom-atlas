canonical_text:
  quote: ''
  summary: The passage first gives a note about Split-Rump, a little bird connected
    with the Sun-dance, and links the taking of his beautiful wife to later jealousy
    and the watching of young women. The main narrative, “The White Crow,” tells of
    a white crow who alone keeps all buffalo. People identify and capture him, blacken
    him with smoke, follow him to his meat supply, and then plant a small dog. The
    dog is taken as a pet, enters a hollow mountain ahead of the crow, becomes large,
    drives out the buffalo, and escapes. The people say there will now be plenty of
    buffalo, while the crow will receive only the eyes.
  language: English
  quote_policy: summarized
