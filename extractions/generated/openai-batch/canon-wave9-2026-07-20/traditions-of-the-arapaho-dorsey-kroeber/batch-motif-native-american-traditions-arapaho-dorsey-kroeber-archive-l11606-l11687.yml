canonical_text:
  quote: ''
  summary: A little boy secretly returns food vessels to the tipi and repeatedly visits
    his growing “nephews” or “little ones” in a shelter. He plays with them, tells
    them to remain content until he returns, and manages his conduct around the household
    so the old people will not suspect. The next morning he asks his mother for clotted-blood
    gravy or soup, receives a kettle of it, secretly carries it to the shelter, feeds
    the little ones, returns the kettle, and proposes going to a sand-bar to play.
    The excerpt closes by saying that when the boy came back from home he found the
    puppies changed.
  language: English
  quote_policy: summarized
