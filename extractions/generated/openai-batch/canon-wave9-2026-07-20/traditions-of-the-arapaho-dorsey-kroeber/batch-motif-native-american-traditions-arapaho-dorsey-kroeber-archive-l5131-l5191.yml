  quote: ''
  summary: In a large family, successive daughters are born or grow up beautiful and
    attract marriage proposals. Women or relatives approach the parents on behalf
    of young men, sometimes offering the suitor as a servant to earn the girl as wife.
    The parents are generally willing, but each daughter refuses marriage and wishes
    to remain single. The passage culminates with the youngest of seven sisters also
    refusing suitors, while the family tipi is crowded with daughters.
