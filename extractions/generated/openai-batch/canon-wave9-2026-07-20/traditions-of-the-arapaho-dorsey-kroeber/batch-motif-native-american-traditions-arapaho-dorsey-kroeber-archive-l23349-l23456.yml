canonical_text:
  quote: ''
  summary: A sequence of Arapaho abstracts recounts encounters between humans and
    animal-person figures, especially bears and porcupines; a weather contest between
    Thunder-bird and White-Owl; and the Raw-Gums episode, in which a night-wandering
    baby kills chiefs, hides their remains in a cottonwood snag, is exposed, transforms,
    and the camp leaves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two young brothers encounter a sleeping black bear on the prairie; one brother
    removes his clothes and has connection with the bear. The she-bear later tracks
    them to their tipi, lies between them in bed, and is killed by Dog Soldiers after
    a council.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man finds a bear with his wife, wounds the bear, kills his wife, and the
    bear later returns with other bears to attack the camp.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A bear burns two sleeping old men until each accuses the other and they fight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A war-party sees a bear painting himself by looking at his reflection in water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A man in a war-party feigns death, is handled by a bear, suddenly seizes the
    bear, and the bear flees in fright.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A bear and a skunk dispute the right of way on a road; the skunk tricks the
    bear into inspecting his rectum, defecates into the bear's eyes, and runs off
    victorious.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A war-party hears what seems to be a woman crying and finds two porcupines
    acting like persons.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A daughter offers herself to a painted porcupine so she can obtain quills
    for her mother; the porcupine accepts, they become a couple, and she gathers colored
    quills for her mother.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: White-Owl and Thunder-bird challenge each other in displays of power; Thunder-bird
    produces black clouds with noise and wind, while White-Owl produces white clouds,
    piercing wind, snow, and a blizzard, and is judged more powerful.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Raw-Gums, a baby in a snowy camp, cries at night, secretly leaves the cradle,
    kills chiefs, eats a chief's flesh, and hides bones in a hollow cottonwood snag.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Raw-Gums's parents watch him, report his actions, and the father calls men
    to decide how to get rid of the child; when thrown out with fat for dogs, Raw-Gums
    becomes a young man and sings about a skeleton.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Bereaved families cut down the cottonwood, find skeletons of chiefs, and the
    people break camp and leave the locality.
  category: sequence
  evidence_refs:
  - ev:10
