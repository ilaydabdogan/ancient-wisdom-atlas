canonical_text:
  quote: ''
  summary: The passage closes a horse-related tale in which a husband asks his wife
    for a specially marked horse; she rides away on a mare, returns through a ravine
    with a gentle horse, and the narrator connects the horse to payment for a crime.
    An appended note describes former practices of compensation and peacemaking for
    men caught with married women, and punishments directed at women. The passage
    then gives tale 108, in which a hungry young hunter cuts flesh from his own calf,
    cooks it, sharpens his foot, is tricked by companions with a log in a bed, pursues
    them, attacks the camp, and is finally killed by a big-bellied boy armed with
    bone weapons; his body is dismembered and burned.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A husband tells his wife that he wants a mouse-colored horse with a black
    mane and tail, a black stripe from neck to tail, crosswise stripes at the knees,
    and a hazy smoke-like face.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife says she will try to get such a horse, tells the husband to bring
    a mare she has ridden, mounts the mare, and tells him to watch the ravine because
    this will be her last time demanding a horse for him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Late in the day the wife comes out through the ravine with a gentle horse,
    tells the husband to lasso it, and dismounts from the mare.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The husband thanks his wife, lassos the blue-faced horse, rides it before
    sunset, and people talk about his new horses as if he had raised them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The narrator states that this was the way the horse paid for his crime and
    that both husband and wife were kind and good to the horse.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: An explanatory note says that in former years men caught with married women
    paid for the offense in horses and goods, and that a peace-pipe could be brought
    to seek mercy.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: The same note says old people were generally called on to make peace, and
    that if there was no apology the offended party could kill or take away horses
    by force.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The note states that women could be beaten, have their hair cut, or have the
    end of the nose cut off after the offense.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: An editorial note attributes the preceding tale to River-Woman and says that
    a connection between a woman and a stallion is found in a Pawnee tale.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: In tale 108, young men go hunting, camp at night, and one hungry man cuts
    off muscle from his calf, cooks it, and sharpens his foot.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The man’s friends notice him sharpening his foot, put a log on the bed under
    bedding as a decoy, and secretly flee.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The sharpened-foot man discovers the trick, runs to a cottonwood tree, splits
    it with his foot, and pursues his friends.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: One swift friend reaches camp and warns that their friend has sharpened his
    leg and pursued them.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: People take bows and arrows and fight the sharpened-foot man, but they are
    overcome and nearly all killed.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: A big-bellied boy lives with his grandmother in a dog-hut; he arms himself
    with a rib as a bow and collar bones as arrows, and his grandmother paints him
    before he goes out.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: The boy draws his bowstring four times, shoots the sharpened-foot man in the
    side on the fourth draw, and the man falls.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: After the man is killed, people cut off his head, legs, and arms, cut him
    into pieces, and burn the pieces and bones until he is entirely consumed.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:18
  text: Footnotes identify the tale as from Informant C and cross-reference numbers
    55 and 109.
  category: other
  evidence_refs:
  - ev:14
  - ev:15
