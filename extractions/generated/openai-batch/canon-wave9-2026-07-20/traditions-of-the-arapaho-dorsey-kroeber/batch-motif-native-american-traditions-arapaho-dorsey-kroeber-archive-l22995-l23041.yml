canonical_text:
  quote: ''
  summary: The passage contains two Arapaho tradition abstracts. In the first, a girl
    baby emerges from a man's sore foot, grows as the young men's daughter, is drawn
    away by a shinny ball to Buffalo-Bull, escapes through Gopher's tunnel, and Buffalo-Bull
    is killed and burned after pursuing her. In the second, the beginning of “Light-Stone,”
    an old woman kills six brothers with a sharp rib-like spike, and their sister
    later swallows a transparent stone, gives birth to a rapidly growing boy, and
    tells him about his missing uncles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Seven young men go on the war-path; one steps on a thorn, later has a swollen
    foot, and the group stays in camp until he gets well.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: While the others search for game, the man pierces the sore with a bone awl,
    and a crying girl baby comes out of the sore place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man wraps the baby, and the returning young men wish the baby to grow
    up as their daughter; she grows and is industrious.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The girl is warned not to pay attention if she hears people playing shinny;
    the game is heard repeatedly nearer the tipi.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women playing shinny ask Tenderfoot-Woman to play, saying Buffalo-Bull is
    waiting for her; a ball enters and falls on her work, she throws it toward the
    door, and she flies out with the ball.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Tenderfoot-Woman goes to Buffalo-Bull in the center of the herd and becomes
    his wife; he is jealous and tells her not to look at other buffalo and not to
    move until ordered.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: When the young men find their daughter gone, they ask birds, animals, and
    insects what to do; Gopher says he can help, goes underground, instructs her to
    arrange her robe as if sitting, and she escapes through his tunnel.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The buffalo herd goes to water for a drink; Buffalo-Bull calls for his wife,
    receives no answer, strikes where she should be, and then scents her direction.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The young men and daughter take safety in a tree-top when they see the herd
    coming; the herd and then Buffalo-Bull charge the tree.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Buffalo-Bull becomes fastened, one of the men kills him with a knife-stroke
    to the side of the neck, and they burn his body to ashes with wood and fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In “Light-Stone,” six brothers and a sister are in a tipi; the oldest brother
    travels to another camp-circle, enters a smoke-tanned tipi, and is asked by an
    old woman to walk on her back to relieve pain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The old woman tells the young man to step lower down; he puts his feet on
    a sharp rib like a spike and is killed instantly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The old woman stakes the dead young man to the ground by hands and feet, smokes
    a pipe, and places tobacco ashes on his eyes, mouth, and breast; the same fate
    happens to the other five brothers on following days.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the last brother has gone, the sister weeps on a distant hill, finds
    a small round transparent stone, accidentally swallows it while sleeping, grows
    in size, and gives birth to a boy.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The boy grows rapidly; his mother carries him on her back, tells him about
    the absence of his uncles, and he becomes a man, makes bow and arrows, and says
    he is ready to go on a journey.
  category: sequence
  evidence_refs:
  - ev:8
