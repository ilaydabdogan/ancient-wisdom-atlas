canonical_text:
  quote: ''
  summary: Found-in-Grass returns victorious with scalps and a bladder bag, is honored
    with scalp-dances, and becomes a respected chief and warrior. He later transfers
    the bag, called naneci, to Nihancan, instructing him in its use. Nihancan uses
    it in battle, releasing countless warriors identified with porcupine quills from
    the bag, gains victories, but is later killed after failing to open it. The warriors
    from the bag then emerge, massacre the enemy, return with scalps, signal with
    wolf cries, and parade around the camp-circle with war equipment and decorated
    horses.
  language: English
  quote_policy: summarized
