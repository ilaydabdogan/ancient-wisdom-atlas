    Nihancan with instructions for battle use.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nihancan invited chiefs and warriors for a pipe smoke and feast, announced
    he would go alone to seek enemies, was cautioned about the bladder bag, sang war
    songs at night, and left alone in the morning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nihancan found an enemy camp, attempted to steal ponies far from the camp-circle,
    and took refuge behind a breastwork on a hill when overtaken.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When Nihancan opened the bag, countless warriors came out, chased and killed
    enemies, took scalps, and then returned to the bag as porcupine quills or men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After Nihancan returned with scalps and gave the wolf cry, the camp held dances
    in honor of his victory; he later went twice more on the war-path and returned
    victorious.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: On the fourth expedition, Nihancan was shot dead after failing to open the
    bag; when someone shot at the bag, warriors came out and massacred the people
    around him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage explains that porcupine quills are kept in bladders because brave
    warriors came out of the bladder and because the quills cannot penetrate the hide.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: The warriors from the bladder porcupine bag returned to camp with scalps,
    gave wolf cries to signal the returning war-party, and paraded around the camp-circle
    with war bonnets, lances, shields, bows, arrows, weapons, and decorated horses.
  category: sequence
