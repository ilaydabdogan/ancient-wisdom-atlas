canonical_text:
  quote: ''
  summary: At a deserted camp, old White-Owl-Woman and Raw-Gums hold a power contest
    using blue-stem grass burned at its base to determine who must procure food. She
    then tests Raw-Gums with riddles. After he answers, she tells him to strike her
    head; he breaks her skull, and the scattered brains are identified as snow whose
    melting explains the season of vegetation. A moral gloss and editorial note follow.
    The passage then begins a separate tale in which Skunk and Rabbit meet on a trail
    and each blocks the other's way.
  language: English
  quote_policy: summarized
