canonical_text:
  quote: ''
  summary: 'The passage closes an episode in which Found-in-Grass learns that Nih’ancan
    has been killed, finds the body, resurrects him, and brings him back to the tribe.
    It then begins a narrative titled Found-in-Grass/Open-brain or Tangled-hair: a
    hunter warns his wife not to look at a powerful tangled-haired visitor. She eventually
    makes a hole in the tent and looks; Tangled-hair enters, rejects several trays
    for food, accepts the woman’s body as the proper tray, cuts her open, and separates
    her twin boys by throwing one into a spring and one to the right of the tent door.
    The husband returns, mourns, finds his arrows scattered, sets a robe to cry in
    his place, and secretly watches the two children, Spring-child and Door-child,
    playing.'
  language: English
  quote_policy: summarized
