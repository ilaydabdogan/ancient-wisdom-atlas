canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a son-in-law and mother-in-law
    sleep separately, the son-in-law complains of cold, sexual intercourse occurs,
    and he later explains their early return to his wife as caused by enemies and
    danger. An editorial note says the story concerns men who have intercourse with
    mothers-in-law and compares it to No. 40. Tale No. 40, “One-Eyed-Sioux and his
    Mother-in-Law,” repeats a pattern of a son-in-law on the war-path with his mother-in-law,
    cold complaints, shared bedding, subsequent pregnancy, birth of a boy, and a public
    cover story that the boy was captured. The passage then begins No. 41, where a
    man with a wife and two children camps alone, hunts, and finds an eagle nest with
    two young eagles on a high peak.
  language: English with Latin passages
  quote_policy: summarized
