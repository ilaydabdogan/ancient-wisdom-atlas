canonical_text:
  quote: ''
  summary: A woman repeatedly withholds buffalo meat from her old husband while giving
    him berries. An owl restores the old man's sight, allowing him to discover the
    concealed meat. He kills his wife, leaves the children, and later orders them
    abandoned when they reach camp. Wolves and coyotes rescue the two bound children;
    an old wolf directs named canid chiefs to bring food, and the children regain
    strength and are taken to sheltered timber.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman says she is going to gather berries, leaves the old man in the tent,
    butchers a buffalo killed by him, eats meat, and returns with berries for him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When another herd passes, the woman deceives her husband in the same way,
    and the old man goes outdoors and cries.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An owl alights near the old man, says it has come to help him, and gives him
    its eyes and sight so that he can see again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old man follows signs of the buffalo and tracks his wife and the children
    to the timber, where he finds her preparing meat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wife tells the old man she was preparing meat to bring to him, offers
    him various meat foods, and gives him cooked back meat with fat.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After eating, the old man kills his wife and thinks that, because the children
    have abundant food, he will leave them to take care of themselves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After a month the children use up the meat, follow their father's trail, and
    arrive at the camp of his people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The father calls the arriving children unmerciful and orders the people to
    break camp, tie the children to poles, lean the poles against trees, and leave
    them there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The people leave camp with the children bound on poles resting against trees.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: An old wolf sees the two children fastened to the poles and suffering thirst
    and hunger, pities them, and calls wolves and coyotes from all directions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The wolves and coyotes lower the poles, chew off the ropes, and free the children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The old wolf tells the children not to return to the people, tells them to
    remain with the wolves, and appoints four named canid figures to get food.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Clouded-wolf, White-wolf, Black-coyote, and Black-wolf go out in the four
    directions, return with buffalo meat, and pile it in front of the children.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:14
  text: The children eat the meat, regain strength, and go with the old wolf to thick
    timber where there is good shelter.
  category: sequence
  evidence_refs:
  - ev:7
