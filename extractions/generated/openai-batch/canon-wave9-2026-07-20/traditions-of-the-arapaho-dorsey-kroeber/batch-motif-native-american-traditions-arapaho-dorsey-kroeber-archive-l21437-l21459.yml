canonical_text:
  quote: ''
  summary: Calf-Boy returns to his father to ask what should serve as Lone-Bull's
    hair. The father gives him a black bear hide or bear robe, which Calf-Boy delivers
    to Lone-Bull. Lone-Bull's body is described as made from supplied articles, and
    the passage says that a life was reversed. A note adds that other body-making
    articles were not remembered, that buffalo-mouth protuberances are said to indicate
    a camp-circle, and that the tale was told by Little-Coyote. An appended comparison
    mentions a Pawnee tale in which a buffalo cow becomes a woman and vice versa in
    a buffalo wallow.
  language: English
  quote_policy: summarized
