canonical_text:
  quote: ''
  summary: A sister repeatedly warns her brothers not to leave or delay while seeking
    absent brothers. Two brothers travel toward another camp, encounter an old woman
    at an isolated tipi near a creek and timber, are persuaded to step on her body
    to relieve her pain, and are killed by a sharp spike. The old woman stakes them
    like earlier victims and places pipe waste on their bodies. The last brother then
    sets out to search for the others despite his sister's objections.
  language: English
  quote_policy: summarized
