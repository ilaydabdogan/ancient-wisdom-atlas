canonical_text:
  quote: ''
  summary: An unusually active baby repeatedly leaves his cradle at night and returns
    by dawn. After nighttime deaths among chiefs, the parents suspect and watch him.
    The mother sees human flesh in his teeth. The child, named Raw-Gums, goes to the
    last surviving chief’s tipi, carries him toward the river, eats his flesh, drops
    the remains into a hollow cottonwood snag, and returns to his cradle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The child leaves his cradle during the night and returns toward dawn without
    waking his parents; in the morning he is found asleep or partly in the cradle.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The parents describe the child as active and thriving, with broad breast and
    arms; he sleeps late and often keeps his lips closed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the child’s birth, frequent nighttime deaths occur among chiefs or good
    classes of people, and the camp hears weeping and lamentation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The parents begin to suspect the child because he is still sleeping when others
    are active, and they try to watch him at night but fall asleep.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The mother sees fresh morsels of human flesh in the child’s teeth and tells
    her husband that the child is the one who kills the chiefs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The parents sleep during the day, then at night pretend to sleep on each side
    of the child; Raw-Gums cries, believes they are asleep, leaves the cradle, and
    takes his pieced buffalo robe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Raw-Gums goes to the tipi of the tribe’s only surviving ruler and enters it
    while the camp is quiet.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The parents watch through the breastpin holes of their tipi and say they must
    prevent Raw-Gums from doing wrong deeds or get rid of him before he kills more
    people.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Raw-Gums comes out of the chief’s tipi carrying the chief in his arms toward
    the river.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Raw-Gums eats the chief’s flesh, leaves only bones, climbs a hollow cottonwood
    snag, and drops the remnant of the chief into the hollow body of the snag.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Around twilight Raw-Gums returns to the tipi and gets back into his cradle
    without disturbing the parents, though they hear him enter.
  category: sequence
  evidence_refs:
  - ev:9
