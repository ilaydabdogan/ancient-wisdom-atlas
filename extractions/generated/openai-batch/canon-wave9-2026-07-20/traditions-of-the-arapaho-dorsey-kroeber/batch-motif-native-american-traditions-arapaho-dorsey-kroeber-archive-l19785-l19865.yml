canonical_text:
  quote: ''
  summary: Spring-child is found in tall grass by an old woman after saying the wind
    carried him there. Later, a man promises a daughter in marriage to whoever catches
    a porcupine. Spring-child catches one, but Crow takes it and claims it, receiving
    the oldest daughter. Spring-child's grandmother reports his claim, and he is given
    the younger daughter. After marriage, Spring-child is revealed as clean and handsome
    at night, is mocked by the elder sister, then tells his wife he will make buffalo.
    He returns as a fine-looking young man after making buffalo, and the people and
    his sister-in-law recognize him.
  language: English
  quote_policy: summarized
