canonical_text:
  quote: "“How is it with you?”"
  summary: During repeated hunting absences, a husband warns his wife not to attend
    to a strange outside voice. The wife eventually pierces the tipi with an awl to
    look out, and a fierce, tangled-haired stranger enters. She cooks meat and offers
    several vessels, including a wooden bowl, a white buffalo robe, and her best buckskin
    dress, all of which he rejects. He finally accepts meat placed on her chest, cuts
    her belly open, finds twins, throws one by the door and the other to the spring,
    covers her body, and leaves. The husband returns, discovers her death, mourns,
    and later finds his arrows scattered in the tipi.
  language: English
  quote_policy: quoted
