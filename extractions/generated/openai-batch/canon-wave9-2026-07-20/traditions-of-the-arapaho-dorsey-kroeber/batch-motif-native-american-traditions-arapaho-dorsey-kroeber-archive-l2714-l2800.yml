canonical_text:
  quote: "“I have come to reveal things which you shall observe hereafter”"
  summary: A man repeatedly searches for game but fails to get close enough to kill
    antelope, deer, or other animals. His wife gathers rabbits, berries, hog potatoes,
    wood, forks, and poles to support the family at their camp. On another hunt the
    man encounters a buffalo cow and calf. The Buffalo Cow speaks to him, says she
    has watched the man and wife and found them good, orders him to make one hundred
    dogwood arrows and the wife to gather materials, and says she has come to reveal
    things to be observed. The man is amazed but trusts and obeys.
  language: English
  quote_policy: quoted
