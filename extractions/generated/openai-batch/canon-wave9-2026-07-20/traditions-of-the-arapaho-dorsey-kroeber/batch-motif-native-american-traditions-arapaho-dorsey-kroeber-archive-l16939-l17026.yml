canonical_text:
  quote: ''
  summary: Moon secretly observes his father-in-law producing human beings from a
    hollow black snag as food for the people. Moon then prepares bows and arrows in
    concealment, asks to perform the same act, brings human beings from the snag,
    and strikes down the first returning being, a woman with a cut nose, accusing
    her of ruining the human race.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The father-in-law is expected to call forth subsistence for all, and the provided
    meat is described as human flesh.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Moon considers why his father-in-law keeps the family at home during the miracle
    and decides to find out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Moon uses an awl to make a hole through the tipi hide and watches what happens
    outside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people go to the river bottom, where there is a black snag with a hole
    at the bottom and human tracks nearby.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father-in-law strikes the black snag with a red digging stick while the
    people stand in two long rows, and human beings come out one by one.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The human beings that come from the snag are slaughtered and taken back to
    the camps for use.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Moon has his wife lead him to the mountain side, then goes to the creek bottom
    and prepares sticks for arrows and bows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Moon gathers feathers, attaches them to arrows, strings bows with sinew, makes
    stone arrow points, and hides the completed bows and arrows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Moon asks to call forth subsistence like his father-in-law, and the father-in-law
    agrees.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Moon strikes the dead black snag with a digging stick, and human beings come
    out and fill the space between the rows of people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the first human being returns toward the snag, Moon strikes it down senseless;
    the being is identified as a woman with a cut nose.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Moon tells the woman that she has ruined the human race, orders her to stop
