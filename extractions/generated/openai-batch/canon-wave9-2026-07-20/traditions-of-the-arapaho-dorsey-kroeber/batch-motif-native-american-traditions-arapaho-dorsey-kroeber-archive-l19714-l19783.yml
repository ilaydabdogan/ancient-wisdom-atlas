canonical_text:
  quote: ''
  summary: Two boys encounter young eagles described as young thunders on a mountain,
    question them about their mother’s storm-forms, and kill them. When the thunder
    mother comes in storm, the boys challenge her with tendon arrows fixed in rock;
    she seizes the arrows, is pulled down, and dies on the rock. They take her feathers
    to their father. Later, despite their father’s warning not to go where the sage-brush
    grows, Door-child urges Spring-child to hunt powerful prairie-chickens there.
    The boys kill the birds and take feathers, but on the way home a strong wind blows
    Spring-child away; Door-child returns alone and the family mourns.
  language: English
  quote_policy: summarized
