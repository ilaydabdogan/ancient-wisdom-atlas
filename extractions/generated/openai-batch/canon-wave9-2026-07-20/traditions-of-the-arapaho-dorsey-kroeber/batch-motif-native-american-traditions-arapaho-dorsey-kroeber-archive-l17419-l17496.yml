canonical_text:
  quote: ''
  summary: Little-star is overcome by a snake that enters his body and remains until
    he is reduced to bones. He appeals to his powerful relatives above for rain and
    intense heat, which force the snake out. He assigns the snake to the ground and
    receives its body and aid, attaching the snake body to a decorated bow. After
    returning to an old woman and then showing the bow to a young man, Little-star
    leaves the bow for humans as a guide and weapon-source, rises by means of it to
    the sky, and becomes a star.
  language: English
  quote_policy: summarized
