- id: obs:4
  text: The heat causes the snake to move and begin to emerge; when its head comes
    out of Little-star’s mouth, he catches it and pulls it out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Little-star tells the snake it will remain in the ground, have no legs, not
    live with people, and be killed if people meet it accidentally.
