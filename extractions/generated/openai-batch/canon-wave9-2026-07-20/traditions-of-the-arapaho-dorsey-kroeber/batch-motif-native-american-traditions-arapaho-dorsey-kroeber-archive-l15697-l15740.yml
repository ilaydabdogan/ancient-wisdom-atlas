canonical_text:
  quote: ''
  summary: Clot-child kills a woman as punishment, flees pursuing dangerous beings
    by using a bow and animal transformations, destroys the pursuers at a frozen river,
    then encounters another dangerous man at a canyon who tries to push him into a
    hole. Clot-child sidesteps the attack, the man falls onto a dead body below, and
    Clot-child declares that the man will become a harmless bare-headed animal.
  language: English
  quote_policy: summarized
