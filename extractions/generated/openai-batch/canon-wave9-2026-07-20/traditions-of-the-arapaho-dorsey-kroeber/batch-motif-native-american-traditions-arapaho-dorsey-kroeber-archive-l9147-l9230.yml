canonical_text:
  quote: ''
  summary: A daughter prepares meals and works on robes while her father repeatedly
    warns her not to leave her occupation, not to heed outside calls to a game, and
    not to touch anything accidental. A noisy ball game outside the tipi calls for
    Splinter-Foot. She first refuses to go out and is praised. On the next day, after
    a renewed warning, the shinny ball enters the tipi opening and lands on her lap.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before sunrise, the daughter has breakfast ready and provides water for the
    men to drink and use to wash their faces.
  category: action
  evidence_refs:
