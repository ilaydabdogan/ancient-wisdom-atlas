  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the evening the young men return with beeves, and the father praises the
    daughter for obeying and working at her occupation.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: After supper, the daughter slices meat for drying, puts utensils away, and
