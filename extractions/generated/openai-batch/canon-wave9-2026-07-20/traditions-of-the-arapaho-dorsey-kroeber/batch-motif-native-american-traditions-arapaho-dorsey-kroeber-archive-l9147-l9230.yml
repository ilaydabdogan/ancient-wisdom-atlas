- id: obs:2
  text: The real father warns the daughter not to be moved from her occupation by
    outside excitement or repeated calls to participate in the game.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The daughter says she will try not to be moved and will continue making robes
    for the men.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The young men leave by different routes to look for game, while the real father
    stays back briefly to repeat precautions before leaving.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: While the daughter is quilling a robe, people outside the tipi talk, laugh,
