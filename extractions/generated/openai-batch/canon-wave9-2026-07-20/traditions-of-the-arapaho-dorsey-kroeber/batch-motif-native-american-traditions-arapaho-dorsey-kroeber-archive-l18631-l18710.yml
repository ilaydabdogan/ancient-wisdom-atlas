  summary: A woman in a tipi repeatedly offers a restless visitor meat placed on increasingly
    valued, personal, or sacred items as a substitute for the bowl he wants. The visitor
    rejects each offering, sometimes rudely, while the woman calmly or reverently
    puts each item away and continues trying to find the correct bowl.
