canonical_text:
  quote: ''
  summary: The passage concludes a narrative in which a sick pregnant woman dies and
    a rattlesnake emerges as the baby; the community explains the event as intercourse
    with a snake that appeared human, and the snake baby is burned. It then begins
    a second narrative, “The man who became a Snake,” in which two young men on the
    war-path find eggs, one eats them despite a warning, swells, transforms into a
    large snake, and instructs his companion to report the truth to his relatives.
  language: English
  quote_policy: summarized
