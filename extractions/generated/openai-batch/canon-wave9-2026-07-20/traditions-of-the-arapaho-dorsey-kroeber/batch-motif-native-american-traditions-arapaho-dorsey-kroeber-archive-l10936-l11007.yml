canonical_text:
  quote: ''
  summary: A woman encounters a large white dog marked with her red finger-marks,
    strikes it, later becomes pregnant, and gives birth to male and female twin dogs.
    The puppies grow, leave the tipi, and the woman follows their tracks, which become
    human-like, to a red tipi toward sunset. Inside is a red-painted man whom the
    children call father. He identifies himself as the one who slept with her and
    whom she struck, tells her to return home and leave the children, and the outcome
    is left unknown. A note identifies the dog as the sun and links the incomplete
    tale to the origin of the Dog-soldiers and to Pawnee parallels.
  language: English
  quote_policy: summarized
