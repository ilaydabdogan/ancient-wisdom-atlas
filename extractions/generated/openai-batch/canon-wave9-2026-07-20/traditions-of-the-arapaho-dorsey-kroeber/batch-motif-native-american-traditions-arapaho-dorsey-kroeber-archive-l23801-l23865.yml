canonical_text:
  quote: ''
  summary: 'The passage contains abstracts of several Arapaho traditions: a beautiful
    young woman seeks Spitting-Horn-Shell and is deceived by Split-Rump before recognizing
    the true man at a Sun-dance; Split-Rump kills his rival and is confined near a
    lake. Another abstract tells of White Crow hiding the buffalo, being captured
    and blackened, and a little dog driving the buffalo from a hollow mountain. Another
    describes Man-Above fasting during Sun-dance, receiving pity from beings, becoming
    a healer, being bewitched, and maintaining medicine practices. The range ends
    with the title “Skull acts as Food-getter.”'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A beautiful girl tells her father she has decided to look for Spitting-Horn-Shell;
    he consents, and she travels through several camp-circles to a fifth camp-circle
    along a river where Sun-dance preparations are under way.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Split-Rump meets the young woman, claims to be Spitting-Horn-Shell, fails
    her request to spit out horn shells by spitting cut-bone shells instead, and she
    goes with him as wife to his mother’s tipi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the Sun-dance, Spitting-Horn-Shell spits horn shells on the ground
    while Split-Rump spits cut-bone shells; chiefs order Split-Rump to quit dancing
    and lay his body flat for Spitting-Horn-Shell to dance on.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The young woman goes to the Sun-dance lodge, sees the beautiful young man
    near the center pole, sits close to him as wife, and after the dance walks with
    him to his parents’ tipi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Split-Rump later kills his rival, flees through a river and into a lake, and
    people try to remove the lake water with bags made from buffalo intestines.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The people tell Split-Rump angrily that he must remain close to the lake and
    must not fly high or leave that place.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: White Crow keeps all the buffalo hidden and is discovered by the eyes he carries
    in his quiver.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: People follow White Crow’s course home, lure him to alight on game, catch
    him, tie him in a tent smoke hole until he turns black, and then release him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: White Crow is deceived into harboring a little dog, which drives the buffalo
    out of a hollow mountain; the buffalo scatter through the world.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: During Sun-dance, Man-Above fasts four days in a separate tipi, and each time
    an animal, insect, bird, or Supernatural-Being takes pity on him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Man-Above becomes a medicine-man, is bewitched by another man through a worm
    from sunflower pith, knows who bewitched him, but removes other people’s troubles
    instead of retaliating.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: Man-Above is described as healing those affected by poisonous insects, being
    instructed by a bull in doctoring implements, and requiring a pipe filled with
    tobacco as an offering to spirits before going to the sick.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Every spring, when sage is fully grown, Man-Above calls followers to rehearse
    songs, make more medicine, and tell new ways.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage ends with the next abstract title, which states that Skull acts
    as a food-getter.
  category: other
  evidence_refs:
  - ev:11
