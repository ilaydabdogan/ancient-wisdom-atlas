canonical_text:
  quote: "“I have brought you the gift”"
  summary: A daughter repeatedly goes to the river for water and finds dead game animals
    along the water trail, increasingly nearer the tipi. Her parents skin the animals
    and bring in meat and hides, while she prepares hides and quilled work. Later,
    an unseen deep-breathing voice comes at night, announces that it has brought a
    gift or burden, and drops dead animals at the tipi door until the household is
    abundantly supplied.
  language: English
  quote_policy: quoted
