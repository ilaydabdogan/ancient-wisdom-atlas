canonical_text:
  quote: ''
  summary: Little Owl hunts buffalo with a bag while a woman, his mother, remains
    hidden in Big Owl’s dwelling. Big Owl repeatedly suspects the woman is present
    by smell, while Little Owl warns him not to disturb arranged arrows and sends
    him away to work on buffalo carcasses. The mother emerges, says Big Owl is a ghost
    and Little Owl is her human child by birth, leaves moccasins and leggings during
    their flight, and Big Owl discovers the escape, counts porcupine quills on the
    moccasins, takes a stone club, and starts after them.
  language: English
  quote_policy: summarized
