canonical_text:
  quote: ''
  summary: 'The passage ends a tale in which Bear and Panther rescue a nearly naked
    boy from a standing tree and the mothers bring him back to a cave. It then gives
    the tale of Nih''ancan and Panther-Young-Man: Nih''ancan dresses as a woman, marries
    Panther-Young-Man, presents a rabbit as their child, reveals the deception, and
    assigns habitats and bodily traits to Panther and Rabbit. A following tale begins
    with Nih''ancan meeting Whirlwind-woman, attempting to court her and imitate her
    power, and being blown over a bank into water. Editorial notes compare some incidents
    and explain associations of whirlwind, caterpillar, turtle, fog, and Whirlwind-woman''s
    earth-shaping role.'
  language: English
  quote_policy: summarized
