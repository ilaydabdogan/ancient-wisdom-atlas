canonical_text:
  quote: ''
  summary: The passage begins mid-tale with Gray-Wolf summoning wolves and coyotes
    to rescue someone crying underground. The animals dig out a weakened man, who
    says that his sister-in-law buried him alive because of his virtue. Black-Wolf
    obtains food for him, he recovers, and Gray-Wolf arranges his return to his mourning
    brother. The returned man asks that pemmican and sausages be prepared for the
    animal helpers; the sister-in-law who prepared and carried the food is devoured
    by the wolves and coyotes. An editorial note attributes the tale to River-Woman
    and says to compare No. 86. A new tale, “Badger-Woman,” then begins with a lone
    tent, buffalo nearby, a man, his wife, and his younger brother; the wife begins
    to love the younger brother.
  language: English
