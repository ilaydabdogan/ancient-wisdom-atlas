canonical_text:
  quote: the woman came out of the sweat-house alive
  summary: A father catches Door-child and, with Door-child's help, catches Spring-child.
    The father makes bows and arrows for the two brothers. The brothers then direct
    him to build and seal a sweat-house with their mother inside. They shoot upward
    in turn; the sweat-house and mother move, and when the father opens it, the woman
    comes out alive as she had been when living.
  language: English
  quote_policy: quoted
