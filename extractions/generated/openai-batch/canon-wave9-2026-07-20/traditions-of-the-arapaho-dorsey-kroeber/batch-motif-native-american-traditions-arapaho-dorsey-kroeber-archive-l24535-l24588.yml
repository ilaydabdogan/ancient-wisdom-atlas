  locator: 24558-24561
  quote_or_summary: Blue-Bird must keep awake during four days of myth-telling, but
    falls asleep on the fourth morning; the buffalo trample him to death, leaving
    no remains except a plume.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source metadata; summary allowed.
- id: ev:8
  type: summary
  locator: 24561-24564
  quote_or_summary: Magpie, Blue-Bird’s brother, sees the dust, finds the blue plume,
    puts it into the sweat-house, shoots upward, and Blue-Bird emerges alive.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source metadata; summary allowed.
- id: ev:9
  type: summary
  locator: 24564-24572
  quote_or_summary: Buffalo-woman and the buffalo come to destroy Blue-Bird and the
    people. Elk-Woman directs them to make a sweat-house of four kinds of wood. The
    buffalo attack and many are killed; Buffalo-woman sticks fast in the wood and
    is killed by Elk-Woman. The buffalo become food for men, and Elk-Woman becomes
    an elk in the mountains.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source metadata; summary allowed.
- id: ev:10
  type: summary
  locator: 24574-24581
  quote_or_summary: Abstract 145 begins with Blue-Feather, described as industrious
    and generous, telling his wife she needs another companion and bringing home another
    woman. The first wife is Buffalo-Woman, the second is Elk-Woman; the new wife
    has a fast-growing boy, and jealousy follows a quarrel between two boys.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source metadata; summary allowed.
- id: ev:11
  type: summary
  locator: 24581-24586
  quote_or_summary: Elk-Woman gets wood and bark, makes a fire inside the tipi, holds
    bark over the fire, and the bark becomes roasted beef, from which she makes pemmican.
    Many men eat at a feast, but the pemmican retains its original size.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source metadata; summary allowed.
- id: ev:12
  type: summary
  locator: 24586-24588
  quote_or_summary: Elk-Woman directs the remaining pemmican to be given to the other
    woman; Buffalo-Woman repeats the same performance. Elk-Woman becomes jealous,
    runs away with her boy, is persuaded to return, and tells her husband of a herd
    of elk.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source metadata; summary allowed.
