canonical_text:
  quote: ''
  summary: The passage contains the end of one abstract about two sons who disobey
    a warning about thunder-birds and one son who later wins a woman, makes buffalo
    for starving people, becomes chief, and is found again by his father. It then
    gives Abstract 144, in which Blue-Bird, Elk-Woman, Buffalo-woman, their calf child,
    buffalo trials, Blue-Bird’s death and revival, and a final buffalo attack are
    summarized. It ends with the beginning of Abstract 145, a related Blue-Feather,
    Buffalo-Woman, and Elk-Woman account involving co-wives, jealousy, and miraculous
    food-making.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A father tells his two sons not to go where the thunder-birds are; they go,
    tease the young thunders, and one son is blown away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The blown-away boy is found by an old woman, wins a girl offered as a prize
    for a porcupine, makes buffalo for starving people, becomes a chief, and is found
    again by his father.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Blue-Bird is married to Elk-Woman, later finds and marries Buffalo-woman,
    leaves her, and is later overtaken by Buffalo-woman with her calf child.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Blue-Bird lives with both wives; the wives are jealous and rival each other
    in procuring meat. Buffalo-woman leaves with her boy, and Blue-Bird follows and
    finds the calf in the fourth herd.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The calf’s grandfather tells Blue-Bird to race with the buffalo; the calf
    is allowed to run in Blue-Bird’s place and wins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Blue-Bird must pick out his son from all the buffalo calves, and he recognizes
    him after the calf moves its ear, foot, and tail.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Blue-Bird is asked to dance against the buffalo for four days; the calf takes
    his place and wins by dancing on four turtle shells.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Blue-Bird must keep awake during four days of myth-telling, but on the fourth
    morning he falls asleep; the buffalo trample him to death and leave only a plume.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Magpie knows from a cloud of dust that Blue-Bird has been killed, finds the
    blue plume, puts it in a sweat-house, shoots upward, and Blue-Bird emerges alive.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Buffalo-woman and the buffalo come to destroy Blue-Bird and the people; Elk-Woman
    directs them to make a sweat-house of four kinds of wood, the buffalo attack it,
    and Buffalo-woman is eventually killed when she sticks fast in the wood.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the attack, the buffalo become food for men, and Elk-Woman becomes an
    elk in the mountains.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the following abstract, Blue-Feather is described as industrious and generous;
    he tells his wife she needs another companion, brings home another woman, and
    the two wives are identified as Buffalo-Woman and Elk-Woman.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: In the Blue-Feather abstract, Elk-Woman uses bark and fire inside the tipi
    to produce roasted beef and pemmican; many men eat at the feast, but the pemmican
    retains its original size.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Buffalo-Woman repeats the same food-making performance; Elk-Woman becomes
    jealous, runs away with her boy, is persuaded to return, and tells her husband
    of a herd of elk.
  category: sequence
  evidence_refs:
  - ev:12
