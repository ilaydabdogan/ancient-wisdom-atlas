canonical_text:
  quote: ''
  summary: A sequence of Arapaho tale abstracts involving cannibal dwarfs, suspended
    hearts that can be pierced to kill their owners, girls and women threatened or
    abducted by dwarfs, and the opening of a Sleepy-Young-Man quest toward cannibals
    using helpers, sinew, fire ashes, an iron tipi, and warning geese.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dwarfs ask people for the heaviest part of the meat, receive the lungs, and
    later a person sees their hearts hanging up and pricks them, causing the dwarfs
    to die.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A traveling man searching for game sees smoke in timber, finds an isolated
    tipi, enters, and finds a blind dwarf sitting alone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man pretends he has come to offer himself as food, then cuts and sharpens
    a stick.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The blind dwarf says the items suspended from the tipi poles are hearts belonging
    to his relatives; as the man pierces named hearts, the corresponding owners fall,
    and the dwarf dies when his own heart is pierced.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dwarfs are described as cruel in appearance, with speech like that of
    a child.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Two young girls returning for forgotten things ask a dwarf about their pillows;
    he asks their names repeatedly, laughs, turns his back, and the girls run away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The abstract states that the dwarf would have outraged the girls and killed
    them for food.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: A dwarf seizes a girl in order to marry her; she persuades him to enter the
    river and wash, hides under overhanging bank vegetation while he is under water,
    and is rescued in the morning.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A dwarf seizes a girl, carries her off, marries her, and she lives with the
    dwarfs and has a child.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The child cries until the dwarf takes his wife back to the people; she is
    recognized by her family on the fourth return, receives much meat from the dwarf
    four times, and then he does not return.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Sleepy-Young-Man is described as a nice but lazy young man who stays on his
    bed until his father says he will never get to the cannibals if he sleeps all
    the time.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: On the fourth morning Sleepy-Young-Man decides to look for the cannibals;
    an old woman tells him they live toward sunrise, a long journey away.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Sleepy-Young-Man takes food and sinew, builds a fire, throws sinew into the
    ashes, and the contraction of the sinew makes the earth contract.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Sleepy-Young-Man visits successive tipi households and receives more food,
    tallow, sinew, and directions while continuing his journey.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Sleepy-Young-Man reaches a tipi made of iron sheets, goes around it four times
    weeping, and is invited in by a woman who says she will help him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: The woman says the cannibals have geese that warn them of strangers, gives
    Sleepy-Young-Man her body, moccasins, and a sign involving a raised band, and
    says there are seven cannibals, including her husband as the oldest and a very
    cunning youngest one.
  category: speech
  evidence_refs:
  - ev:10
