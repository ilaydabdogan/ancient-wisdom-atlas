canonical_text:
  quote: ''
  summary: A poor, scabby boy named Found-in-Grass and his grandmother secretly obtain
    beef after the boy shoots a rolled wheel treated as a bull. A chief offers his
    older daughter in marriage to whoever catches an undamaged kit-fox. Found-in-Grass
    sets a trap that catches one, but Crow steals it and presents it to the chief.
    Found-in-Grass finds hairs left on the rawhide rope and sends his grandmother
    to present this proof. The chief rewards both; Found-in-Grass receives a young
    daughter as wife, while Crow receives the older daughter, and both receive tipis
    and honor from the girls’ relatives.
  language: English
  quote_policy: summarized
