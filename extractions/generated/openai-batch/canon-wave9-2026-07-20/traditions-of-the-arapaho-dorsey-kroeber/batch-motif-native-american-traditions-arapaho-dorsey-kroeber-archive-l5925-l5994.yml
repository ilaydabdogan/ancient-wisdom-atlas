canonical_text:
  quote: ''
  summary: 'The passage first closes a Nih’anqan episode involving a plaster eye and
    an explanation for human eye defects, with an editorial note comparing the deception
    to another numbered tradition. It then begins the tale of Nih’anqan and young
    men racing for wives: Nih’anqan joins a war-party, carries and breaks an object
    described as the back side of a woman, finds a camp-circle of women and a painted
    tipi with a pipe of peace, reports the camp to the young men, and joins them in
    a race for wives, during which stones are tied to his wrists and ankles as a handicap.'
  language: English
  quote_policy: summarized
