  text: A buffalo bull named Hixanankan, Bone-bull, hears that the young men have
    had a daughter born to them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bone-bull sends the magpie, according to custom, to ask the young men for
    the girl in marriage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The young men refuse the magpie’s request because they love their daughter
    and consider her too young to go.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
