canonical_text:
  quote: ''
  summary: Young men care for a beautiful daughter named Hasixtaciisa, make her an
    elk-tooth dress and belt, and repeatedly receive marriage requests from the powerful
    buffalo bull Bone-bull through bird messengers. After refusals and escalating
    messages, a red-headed bird called fire-owner succeeds in gaining consent. The
    young men then give objects that are designated as parts of Bone-bull’s body.
  language: English
  quote_policy: summarized
