- id: obs:12
  text: After another unsuccessful attempt, the seciitcabihi reports that the young
    men are preparing for the marriage and dressing the girl finely, but Bone-bull
    does not believe it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The seciitcabihi advises Bone-bull to obtain someone with a sweet, juicy tongue
