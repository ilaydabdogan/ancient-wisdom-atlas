canonical_text:
  quote: ''
  summary: A young wife repeatedly carries messages between her husband and her parents'
    tipi. Her husband, the son-in-law, has seen a little girl there and offers a buffalo
    gift while seeking access to her. The little boy refuses the offer, accuses the
    son-in-law of cruelty and stinginess, and says they will take his sister to another
    camp-circle. The old folks and children leave at midnight seeking deliverance.
    In the morning the wife finds their tipi empty. The family reaches a large river
    camp, where Blood-Clot-Girl is publicly announced, honored, invited to the chief's
    central tipi, and welcomed with her family.
  language: English
  quote_policy: summarized
