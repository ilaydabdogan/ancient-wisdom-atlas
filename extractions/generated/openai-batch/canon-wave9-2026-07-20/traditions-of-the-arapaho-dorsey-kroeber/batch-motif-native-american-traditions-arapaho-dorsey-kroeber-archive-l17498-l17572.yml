canonical_text:
  quote: ''
  summary: An editorial note compares sky-ascent and sky-descent incidents across
    several North American traditions. The Arapaho tale then tells of the moon, represented
    as a young man, causing a tree to stretch upward while a woman climbs after a
    porcupine. She reaches the sky and is taken to the moon's tent. The moon rejects
    his frog wife after a chewing test, but the woman later escapes with an old woman's
    help by being lowered through a hole in the sky on a sinew rope. Back on earth
    she gives birth to Moon-child, who grows quickly, becomes chief, lives a long
    life, and after death is taken by the moon to the sky.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The editorial note says the tree-and-porcupine ascent of a woman to the sky
    is known among Arapaho, Gros Ventre, and Kiowa, and it lists additional sky-ascent
    and rope-descent parallels in other North American traditions.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The moon is described as a handsome young man who lives with his mother and
    has a frog wife whom he does not like.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The moon looks down, sees a woman, and comes down to the earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman sees a porcupine hanging on a tree, wants its quills, and climbs
    after it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Each time the woman reaches toward the porcupine, it climbs to a higher limb;
    the woman climbs higher without knowing it, while the moon causes the tree to
    stretch upward.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sky is described as solid, shining, wall-like, and having an opening through
    which the tree grows; when the woman reaches the sky, the moon takes her to his
    tent.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The moon gives buffalo gut to the two wives in order to judge their age by
    the sound of chewing and the sharpness of their teeth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The frog puts charcoal into her mouth, makes a noise while chewing, and black
    saliva runs from her mouth; the moon concludes she is old and sends her away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The woman sits alone and is sad because she wants to return home; an old woman
    pities her and says she will lower her to earth by a sinew rope.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: While the moon is hunting, the two women look for the thinnest place in the
    sky, dig through ground, reach sky like ice, and break a hole carefully so it
    can be covered again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The old woman ties sinew around the woman and lets her down; the sinew stretches
    until the woman reaches earth and gets home.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the woman's escape, the moon takes back his old frog wife, and the tale
    explains that he therefore has a black frog upon him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: When the woman reaches her camp, the people are surprised because they had
    thought she was dead; she tells them how she had been taken up.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The woman gives birth to a boy called Hiiciisisa11, translated as Moon-child
    with a footnote alternative of Sun-child; he grows quickly, becomes chief, lives
    one hundred years, and after death is taken by the moon to the sky.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
