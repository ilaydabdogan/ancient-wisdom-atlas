canonical_text:
  quote: ''
  summary: A boy asks an old man or father for four painted arrows. After repeated
    rejection and abuse by a hunter called his brother-in-law at a buffalo carcass,
    the boy shoots him four times, declares this a punishment for mistreating his
    parents, says the dead man shall go to the good world, carries meat home, and
    becomes a tall young man.
  language: English
  quote_policy: summarized
