- id: obs:1
  text: An old man takes an unspecified item and it becomes sinew.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy asks for four arrows, specifying that two be painted black and two
    red; the old man is pleased with the boy's knowledge.
  category: speech
  evidence_refs:
