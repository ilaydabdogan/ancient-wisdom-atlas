  claim: The opening abstract and abstracts 74-76 form a recurring water-monster pattern
    within this passage, with encounters at springs, rivers, tents, caves, and springs
    leading to anomalous birth, blindness and propitiation, ritual adornment, disappearance,
    or transformation.
  claim_level: same_motif
  target: water-monster episodes within the supplied Arapaho abstracts
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The records are brief abstracts of separate narratives, and the opening
    abstract does not explicitly name the infant as a water monster.
- id: claim:2
  claim: 'The Snake-Boy and Man who became a Snake abstracts share a serpent-related
    birth/transformation pattern: one produces a rattlesnake child after a secret
    lover episode, while the other changes a man into a big snake after eating disputed
    snake eggs.'
  claim_level: same_motif
  target: serpent birth and serpent transformation in abstracts 77-78
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The mechanisms differ, one sexual and reproductive, the other involving
    consumption of eggs.
