canonical_text:
  quote: ''
  summary: The passage gives abstracts of several Arapaho narratives involving water
    monsters, anomalous animal births, propitiatory gifts, cave and river encounters,
    and transformations into water-monster or snake forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three women returning from searching for fiber come to a running spring; the
    first two leap across, while the last feels heat enter her body and later becomes
    big after menstruation does not occur.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pregnant woman asks the medicine old woman Hairy-Face to attend the birth;
    Hairy-Face gives root tea, paints her in spots, and water flows during the birth
    attempt, filling the tipi and putting out the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hairy-Face finds an infant and covers it with a blanket; when uncovered, it
    appears as an eyeless spotted animal with a slender body, short legs, cow-like
    feet, and a dog-like face, then disappears when uncovered again.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A hunter injures an unborn buffalo calf; it speaks, frightens him, follows
    him home, and the next morning a water monster is in and around the tent; the
    man is blinded, while his wife propitiates the animal with gifts and carries it
    to the river.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Little Wind River two women see a monster in the channel; flashes from
    its eyes hypnotize them, men dig it from a ridge, people bring offerings and adorn
    it, a non-believer shoots it in the forehead and takes valuables, and the monster
    sinks and disappears.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Young men follow buffalo tracks into a deep cave, see the land of the buffalo,
    return to find a water monster blocking the cave, burn through it, and one man
    who eats its meat changes into a water monster left in a spring; his brother gains
    victory by sacrificing to him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wife of a young man away with a war party wanders in solitude; a charming
    young man asks for a secret lover relationship, invokes Flat-Pipe, Thunder, and
    Water Monster as witnesses, and she consents.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the encounter, the woman misses menstruation, suffers pains as if something
    is winding around her stomach, dies when the womb drops, and a rattlesnake baby
    bursts out and is burned in fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Two young men on the war-path find two large eggs in a ground nest; one boils
    and eats them, swells, changes into a big snake, stays in deep river water, and
    asks that intestines be thrown into the river so relatives may cross safely.
  category: sequence
  evidence_refs:
  - ev:6
