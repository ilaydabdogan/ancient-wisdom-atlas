canonical_text:
  quote: ''
  summary: A girl discovers that a large rolling wart-like being is bringing unwounded
    game to her family and intends to catch them. She warns her parents and brother,
    prepares a flight, and leaves hidden moccasins in the tent. The being swallows
    animals and the tent, pursues the fugitives, and is repeatedly delayed when the
    moccasins call it back. The parents become exhausted and urge the children to
    continue fleeing; the boy also tires and tells his sister to go on toward timber
    ahead.
  language: English
  quote_policy: summarized
