canonical_text:
  quote: ''
  summary: 'The passage ends one narrative in which Nih’angan, deceived by a report
    that his wife has died, has his hair cut and returns home weeping, only to find
    his wife and children alive. It then begins “Nih’anc:an goes Fishing”: traveling
    downstream, he meets a man who catches fish using his own skin as a line and his
    own flesh as bait. After Nihanqan asks to learn, the man gives him the same bodily
    fishing power and warns him to use it only three times. Nihanqan catches fish
    three times, uses the line a fourth time, and is dragged into the river and swallowed
    by a large fish.'
  language: English with some Latin phrases in the supplied passage
  quote_policy: summarized
