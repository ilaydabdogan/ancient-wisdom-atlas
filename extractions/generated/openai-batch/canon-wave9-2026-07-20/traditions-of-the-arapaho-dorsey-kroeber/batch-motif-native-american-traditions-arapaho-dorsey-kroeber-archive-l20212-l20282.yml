- id: obs:6
  text: Magpie carries the blue plume back to camp, circles the camp four times, leaves
    it on the earth mound, then places it inside the sweat-house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Magpie has four arrows, two black and two red, and shoots upward while addressing
    a figure as his friend; the house or tent shakes.
  category: action
  evidence_refs:
  - ev:4
