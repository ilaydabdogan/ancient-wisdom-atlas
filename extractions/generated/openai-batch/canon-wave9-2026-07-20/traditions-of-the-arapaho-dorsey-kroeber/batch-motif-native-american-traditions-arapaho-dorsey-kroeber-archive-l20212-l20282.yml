  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The people heat stones, enter the sweat-house, clean Blue-bird with sage,
    and he comes out perfect.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The man’s Buffalo-woman hears the news, becomes angry, says Elk-woman must
    not have the man, and the buffalo decide to help her attack Elk-woman.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Elk-woman tells those who fear the buffalo to cut four named kinds of wood
    and tells others to make bows and arrows like Magpie’s.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The sweat-house is made with four kinds of wood arranged in layers from outside
