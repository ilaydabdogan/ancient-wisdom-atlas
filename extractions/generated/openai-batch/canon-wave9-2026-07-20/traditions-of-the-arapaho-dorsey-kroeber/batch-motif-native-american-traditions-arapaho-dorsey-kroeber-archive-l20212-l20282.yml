canonical_text:
  quote: ''
  summary: Blue-bird warns his brother Magpie that, if he is killed, a sign will reach
    from earth to sky. Magpie sees dust from buffalo trampling, prepares a sweat-house
    rite, transforms into a magpie, retrieves a blue plume from the buffalo-tracked
    place, and uses the plume, arrows, sage, and heated stones in a sweat-house to
    restore Blue-bird. Later the man’s Buffalo-woman becomes angry at Elk-woman and
    gathers buffalo to attack. Elk-woman organizes wood, bows, arrows, and a layered
    sweat-house defense; the buffalo attack, Elk-woman pronounces that their horns
    should stick or break, and the people shoot many buffalo. The passage also explains
    spots on red bark from this event.
  language: English
  quote_policy: summarized
