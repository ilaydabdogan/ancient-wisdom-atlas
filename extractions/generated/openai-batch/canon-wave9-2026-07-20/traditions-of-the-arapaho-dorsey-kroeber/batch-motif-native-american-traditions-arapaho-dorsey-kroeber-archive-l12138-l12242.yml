canonical_text:
  quote: ''
  summary: The passage contains the end of a porcupine episode, the tale “The Painted
    Porcupine,” the tale “Thunder-Bird and White-Owl,” and the beginning of “Raw-Gums
    and White-Owl-Woman.” Scouts see two porcupines behaving like people; the male
    strikes the female and flees when addressed. In “The Painted Porcupine,” a young
    woman marries Painted-Porcupine so that her mother can obtain scarce quills for
    quilled work. Painted-Porcupine lets the wife pick colored quills, explains that
    quills are plentiful in fall and winter but scarce in hot seasons, and the quills
    are delivered to the mother. The narrator connects the tale with women’s continued
    use of colored quills. In “Thunder-Bird and White-Owl,” the summer bird and winter
    bird contest their powers through black storm clouds and white snow clouds; White-Owl’s
    blizzard prevails. A source note says the tale is also found among Pawnee, Wichita,
    and Crow traditions. The beginning of “Raw-Gums and White-Owl-Woman” describes
    a snowy camp near a river and a newborn baby who cries at night, is found nearly
    out of his cradle, and is wrapped again between his parents.
  language: English
  quote_policy: summarized
