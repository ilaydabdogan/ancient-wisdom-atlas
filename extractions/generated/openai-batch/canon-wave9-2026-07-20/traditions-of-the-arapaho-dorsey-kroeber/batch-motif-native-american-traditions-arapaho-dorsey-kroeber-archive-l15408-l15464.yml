canonical_text:
  quote: ''
  summary: An old man repeatedly sends his young son-in-law to obtain required materials
    and an animal. A guiding voice helps the young man obtain plant materials accepted
    as feathers and arrow points. The young man then finds seven buffalo and chooses
    a full-horned bull. The bull displays power through colored directional snorts
    and by splitting a rock. An old buffalo instructs the young man how the bull will
    help defeat a powerful man in a tree, and warns him to burn the man's body and
    not keep valuables emerging from the sparks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old man asks his son-in-law for long, wide feathers with black tips, and
    the young man obtains large plant leaves whose tips become black.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man accepts the returned items as the feathers he wanted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man asks for sharp, smooth, evenly shaped arrow points, and the young
    man travels east, south, and west before a voice directs him to pick willow leaves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old man asks for an animal with horns like bird claws.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young man finds seven buffalo on the side of a hill and is allowed to
    choose from three buffalo; he chooses the one with fully grown horns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The selected bull snorts black, blue, red, and white in four named directions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The bull wallows, raises dust, chips a black hard rock, and then splits the
    rock with his horn.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The old buffalo says the selected bull will lead the young man and warns that
    a powerful man in a tree will shoot at the young man while pretending to shoot
    at the bull.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The young man is told to stand behind the bull so that arrows will strike
    the bull without piercing it and will not pierce the young man.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old buffalo instructs the young man to taunt the man down from the tree
    after three ineffective shots, then run so the man leaves the tree and the bull
    can kill him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the man is killed, the young man is instructed to gather and burn all
    body parts and return all valuables that fly from the body as sparks into the
