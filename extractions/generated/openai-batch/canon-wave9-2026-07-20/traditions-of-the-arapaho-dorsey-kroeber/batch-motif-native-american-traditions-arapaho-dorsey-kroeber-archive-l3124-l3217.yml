  quote: ''
  summary: The line range contains the end of one Nih’angan eye-loss tale, an editorial
    comparison note, the tale “Nih’angan loses his Eyes,” and the opening of “Nih’angan
    and the Magic Arrows.” In the eye-loss material, eyes are sent to trees, fail
    to return when a limit is broken, and animal eyes are borrowed. The passage also
    gives etiological endings for cottonwood markings and mole blindness. The final
    section begins a separate episode in which Beaver safely slides through upright
    arrows that part for him, and Nih’angan asks to learn the same feat.
