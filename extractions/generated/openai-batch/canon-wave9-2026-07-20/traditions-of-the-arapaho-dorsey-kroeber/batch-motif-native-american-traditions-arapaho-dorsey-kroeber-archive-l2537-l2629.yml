canonical_text:
  quote: ''
  summary: A woman identified with White-Buffalo-Woman selects seven old men and seven
    old women, pledges and teaches the Buffalo Lodge, and outlines its duties, structure,
    ritual personnel, dances, payments, restrictions, cleansing procession through
    the camp-circle, and a smoke-and-buffalo sequence involving a man with bow and
    arrows.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman selects seven old men and seven old women and gives them intellects
    so they can understand and reason with her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: She pledges a lodge called Buffalo Lodge and says it is to bless the people,
    be conducted in a sacred way, carry prayers and offerings to the Man-Above, cleanse
    the people, and teach the commandments of the Giver.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old men and old women thank the young woman for her vow and agree with
    her; the Pledger is named as White-Buffalo-Woman.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lodge is said to include two red stands, two white stands, a cow and calf,
    steers, calves, a bull, and two owners of poles.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Seven tipi poles are tied together, with a red painted digging stick tied
    horizontally to the center bunch of poles to make a center pole; other bunches
    of poles rest against it, and tipis cover the sides.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Painting occurs during the day and dancing by participants occurs at night
    in rotation according to degree; the owners of poles, with caps and belts painted
    white, lead the dance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: White-Woman has a bed in the west of the lodge, with cows and calves by her
    side; these people cannot move or go to water unless relatives and friends provide
    relief.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Payments to the grandfathers and mothers may include arrows, bags, parfleches,
    ponies, meat, moccasins, and other useful articles; after the first ceremony people
    had to pay to obtain the rights of the lodge.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The ceremony lasts four days, and young men are sometimes prohibited from
    seeing the daytime performance because of the painting and undressing of the women.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: On the fourth day the women put on full dress, dance, leave the lodge, and
    move through the southeast, southwest, northwest, and northeast corners of the
    camp-circle, returning to the center between movements while blowing whistles.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The text states that the movement through the camp-circle is done to cleanse
    it so that there will be no sickness among the people.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: On a fifth movement to the east, a man goes out as a spy with a panther quiver,
    bow, and arrows; women called buffalo walk toward him, while White-Buffalo-Woman
    follows the herd slowly with two canes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The man makes a fire that produces smoke and odor for the herd; when the herd
    smells the smoke they retreat to the lodge, and he tells his war story when making
    the smoke cloud.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: A chief's or warrior's wife is selected to take tallow and be shot at by the
    man; this is treated as a privilege requiring more goods, and the man hands the
    tallow and arrows to the woman.
  category: action
  evidence_refs:
  - ev:10
