canonical_text:
  quote: ''
  summary: 'After the people become enraged, Big-Bull or Lone-Bull is chosen to challenge
    the human husband for ruling power. The husband''s newborn son tells him Lone-Bull''s
    two vulnerable soft spots. Lone-Bull charges repeatedly, but the husband dodges,
    then shoots arrows into the breast and flank, killing him. Lone-Bull comes back
    to life and sets a second test: the father must identify his son among gathered
    yellow calves. The son gives a left-ear signal, and the father identifies him.
    Lone-Bull then announces a race involving all the buffalo.'
  language: English
  quote_policy: summarized
