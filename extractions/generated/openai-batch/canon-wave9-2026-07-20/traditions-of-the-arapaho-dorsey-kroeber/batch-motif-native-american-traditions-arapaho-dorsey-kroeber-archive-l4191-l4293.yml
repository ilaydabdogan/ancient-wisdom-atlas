canonical_text:
  quote: ''
  summary: The passage contains the end of an episode in which Nih'ancan, disguised
    as a woman by means of dress, accompanies a weeping young woman from a camp-circle
    to a river, persuades her to cross, is gradually recognized as male, and after
    crossing reveals himself and has coerced intercourse with her. A narrator note
    says some people formerly disguised themselves as women, while young men now court
    secretly. The passage then begins No. 37, in which two beautiful maidens reject
    suitors; Nih'ancan plants human excrement between them as they sleep, listens
    as they accuse one another, then tries to expose them until they offer him night
    visits and sleeping access in exchange for silence. An editorial footnote also
    compares a separate rolling-object pursuit motif across numbered Arapaho traditions.
  language: English with Latin insertions
  quote_policy: summarized
