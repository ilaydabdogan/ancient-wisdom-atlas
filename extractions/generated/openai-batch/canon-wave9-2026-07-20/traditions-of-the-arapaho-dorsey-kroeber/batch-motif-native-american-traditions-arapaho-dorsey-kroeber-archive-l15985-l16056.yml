canonical_text:
  quote: ''
  summary: Blood-Clot-Boy explains an eagle-catching pit using a wolf hide, then White-Owl
    asks how he gets fire while producing stormy weather by flapping wings and tail.
    Blood-Clot-Boy gathers flint, dry pith, grass, and wood, makes fire, and later
    roasts cottonwood material and buffalo chips so that they become meat or fat foods
    for White-Owl. After repeatedly feeding White-Owl, Blood-Clot-Boy asks for return
    treatment.
  language: English
