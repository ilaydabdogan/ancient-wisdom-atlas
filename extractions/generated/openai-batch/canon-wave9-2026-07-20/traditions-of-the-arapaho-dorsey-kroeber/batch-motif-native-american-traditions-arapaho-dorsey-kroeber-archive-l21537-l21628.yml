- id: motif:1
  label: Magic flight from a pursuing skull with successive obstacles
  taxonomy_refs: []
  basis: 'The girl flees the skull and repeatedly delays it by wishing up obstacles:
    forest, river, knives, and paunches.'
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is an abstract and does not give fuller narrative details.
- id: motif:2
  label: Restoration to life after being swallowed or killed
  taxonomy_refs:
  - resurrection
  basis: The girl's father, mother, and dog are restored to life after the skull bursts;
    Bluebird is also restored to life by Magpie.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The abstract does not describe the mechanism of restoration in detail.
- id: motif:3
  label: Miraculous child with rapid maturation
  taxonomy_refs:
