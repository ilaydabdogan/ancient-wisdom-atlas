canonical_text:
  quote: ''
  summary: 'The passage gives several Arapaho tale abstracts: a girl escapes a skull,
    marries her rescuer, and bears Rock; Rock participates in a flood episode, retrieves
    earth materials through a turtle, makes the world, sky, and corn, and is involved
    in explanations of language, horse and buffalo relations, and death. Other abstracts
    recount buffalo-related origins of ceremonial lodges and the Kit-Fox and Star
    societies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl finds game each morning and, while hiding, sees that a skull is providing
    food for her family.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl and her family turn into geese and flee; the skull pursues, is delayed
    by clothes, and later by a forest, river, knives, and paunches wished into being
    by the girl.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The skull draws in the girl's dog, mother, and father before the girl reaches
    a man making a bow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The bow-making man hides the girl, causes the skull to burst, and restores
    her father, mother, and dog to life.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The man marries the girl; his first wife tries to drown her while swimming,
    but the first wife is drowned instead.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The girl's husband shoots an arrow twice while hunting and is carried away
    by a whirlwind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After four days the girl gives birth to a boy, and after four more days the
    boy is a young man named Rock.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Rock obtains turtle moccasins from his mother, visits his grandparents, and
    by means of the moccasins wins the love of four girls.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: Bluebird has been killed but is restored to life by his brother Magpie; Bluebird,
    Magpie, and Nih'anqan meet and join Rock.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The water rises; the people go to a mountain peak, and Rock uses his turtle
    moccasins four times to cause the water to recede.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: The people enter a boat of mushrooms and cobwebs, while Rock and Nih'anqan
    remain on the mountain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: A duck fails to dive to the bottom; Rock changes his moccasin to a turtle,
    which brings up mud, a rib, and a bulrush.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: Rock makes the world and sky from the mud by means of the rib, and makes corn
    from the bulrush.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: Nih'anqan goes to live in the sky and becomes 'our father'; the world's languages
    are diversified.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:15
  text: The horse and buffalo race; the horse wins and becomes a domestic animal,
    while the buffalo is hunted.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:16
  text: Rock throws a buffalo chip into the water so that people may live; Nih'anqan
    throws a stone, and therefore people die.
  category: action
  evidence_refs:
  - ev:4
- id: obs:17
  text: A murderer is driven away, comforted by Nih'anqan, encounters a buffalo cow,
    and fails four times to shoot her before she tells him not to shoot.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:18
  text: A water monster coils around the murderer's tent; his wife gives it feathers
    and propitiates it, after which it allows itself to be carried to a spring.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:19
  text: Many buffalo come near the tent; the murderer kills many and, instructed by
    Nih'anqan, feeds starving people and establishes ceremonial practices.
  category: action
  evidence_refs:
  - ev:5
- id: obs:20
  text: In a separate abstract, a buffalo cow tells a man by a river the order of
    society lodges.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:21
  text: In another abstract, a boy kills a chief with a buffalo leg, later appears
    with a yellow calf and kit-fox hide, and his appearances originate the Kit-Fox
    and Star societies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:22
  text: In a further abstract, a lone man fails four times to shoot a buffalo, which
    gives him the buffalo and ceremonial lodges for the people.
  category: sequence
  evidence_refs:
  - ev:8
