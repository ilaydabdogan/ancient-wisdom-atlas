- id: ev:1
  type: summary
  locator: 21785-21791
  quote_or_summary: The camp-circle breaks up to hunt; a poor man, wife, and children
    with one poor pony fall behind and camp by a running creek at the foot of high
    mountains; the man fails at hunting while the wife gets rabbits and berries.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain; summarized.
- id: ev:2
  type: summary
  locator: 21792-21804
  quote_or_summary: A buffalo cow with a calf speaks to the man, tells him to prepare
    one hundred arrows and materials, and later reveals something to him while he
    sleeps; an immense herd comes to the tipi and the man kills buffalo, one with
    each arrow.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain; summarized.
- id: ev:3
  type: summary
  locator: 21804-21812
  quote_or_summary: The family processes buffalo meat and hides; the wife makes pemmican
    in buffalo intestine; the man gives a bundle to the chief, and people eat from
    it while it retains its original size.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain; summarized.
- id: ev:4
  type: summary
  locator: 21812-21823
  quote_or_summary: The man asks the whole camp to follow him to the tipi at the foot
    of high mountains; buffalo herds part for them; he tells chiefs secrets, refers
    to the buffalo cow and calf gift, says his wife should erect a Buffalo-Women’s
    lodge, and gives old people wisdom, natural-law knowledge, and degrees.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain; summarized.
- id: ev:5
  type: summary
  locator: 21823-21830
  quote_or_summary: The Buffalo-Women’s lodge and Old Men’s lodge are erected in the
    center and conducted by old priests and old women; a red sacred bag is made of
    bear claws, buffalo horns, rattles, buffalo tails, paint, tallow, and stones and
    is called the watchful eye of the Giver.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain; summarized.
- id: ev:6
  type: summary
  locator: 21831-21834
  quote_or_summary: Under “Origin of the Buffalo Lodge,” a vision-seeking man sees
    women dancing; they turn to buffalo, and he learns the Buffalo-dance.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain; summarized.
- id: ev:7
  type: summary
  locator: 21835-21840
  quote_or_summary: Under “Origin of the Seineniinahawaant,” a dead woman joins men
    on the war-path; they return victors, she assembles the people, gives them a dance,
