canonical_text:
  quote: ''
  summary: 'A series of Arapaho tradition abstracts: a poor family left behind by
    a hunting camp receives instructions and revelation from a buffalo cow and calf,
    gains buffalo abundance, shares inexhaustible pemmican, and establishes Buffalo-Women’s
    and Old Men’s lodges with sacred objects and transmitted rites. Additional abstracts
    describe a vision-seeker learning the Buffalo-dance from women who turn into buffalo,
    a dead woman aiding a war party and giving a dance, and two variants in which
    Nih’angan learns an eye-removal trick, overuses it, and loses or borrows animal
    eyes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunting camp-circle breaks up, and a poor man, his wife, and several children
    with one poor pony fall behind the group.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The family camps by a running creek at the foot of high mountains; the man
    fails to obtain deer or antelope, while his wife obtains rabbits and berries.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A buffalo cow with a calf speaks to the man and tells him to stop, return,
    make one hundred arrows, and have his wife gather forks, poles, and wood.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man makes a solid bow and arrows feathered with hawk and eagle feathers,
    while his wife gathers the requested materials.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man tells his wife not to fear a stranger’s voice, ties the arrows to
    the bow, sleeps, and the buffalo cow reveals something to him while he sleeps.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Near daylight the wife hears animal footsteps on snow and sees buffalo near
    the tipi, with an immense herd in front of it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The man shoots buffalo, killing one with each arrow, and tells the other buffalo
    to retreat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The family skins and slices beef, dries it on poles, tans hides, and prepares
    tipi materials; the man is described as a different person in heart and mind.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The wife makes pemmican, puts it in buffalo intestine, and gives it to her
    husband to carry to the main camp.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: The man gives the pemmican bundle to the chief; people eat any amount they
    want from it, but it retains its original size.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The man asks the whole camp to follow him back to the tipi at the foot of
    the high mountains; buffalo herds are found throughout the area and part to make
    way for the people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The new camp-circle is described as facing toward sunrise, with the woman’s
    tipi back in the center.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:13
  text: The man tells chiefs secrets, refers to the gift of the buffalo cow and calf,
    says his wife should erect a Buffalo-Women’s lodge, and gives old people wisdom,
    knowledge of natural laws, and degrees.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:14
  text: A Buffalo-Women’s lodge is erected in the center of the camp-circle and conducted
    by old priests and old women.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: For the Old Men’s lodge, a large sacred bag is made from bear claws, buffalo
    horns, rattles, buffalo tails, paint, tallow, and stones; the bag is painted red
    and described as pertaining to life and as the watchful eye of the Giver.
  category: object
  evidence_refs:
  - ev:5
- id: obs:16
  text: A man seeking visions sees women dancing; they turn into buffalo, and he learns
    the Buffalo-dance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: A dead woman joins men on the war-path; after they return victors, she assembles
    the people, gives them a dance, and goes back.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: Nih’angan sees a man throw his eyes into cottonwood tree-tops and asks to
    learn the trick; the teacher warns him not to do it excessively.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: Nih’angan performs the eye trick repeatedly; when he commands his eyes to
    return, they remain in the cottonwood tree.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:20
  text: In one version, Mouse’s eyes are too small, Owl lends eyes that account for
    Nih’angan’s yellow eyes, and Nih’angan’s own eyes are seen on cottonwood bark
    and branches.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:21
  text: In another version, Mole lends Nih’angan its eyes, Nih’angan recovers his
    own eyes, does not return Mole’s eyes, and Mole remains blind.
  category: relationship
  evidence_refs:
  - ev:9
