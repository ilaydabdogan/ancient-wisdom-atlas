candidate_motifs:
- id: motif:1
  label: Buffalo-given abundance and ritual institution
  taxonomy_refs:
  - culture_hero
  - sacred_exchange
  - wisdom
  - initiation
  basis: A buffalo cow instructs and reveals something to the poor man; the resulting
    buffalo abundance, shared pemmican, secrets, degrees, and lodge establishments
    benefit the people.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage is an abstract; it states ritual origins and wisdom transmission
    but gives limited detail about the rites themselves.
- id: motif:2
  label: Inexhaustible food bundle
  taxonomy_refs:
  - sacred_exchange
  basis: People eat any amount of pemmican from the bundle, yet it retains its original
    size.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No explicit explanation is provided for the food’s persistence beyond
    the narrative statement.
- id: motif:3
  label: Animal-human transformation reveals a dance
  taxonomy_refs:
  - shapeshifter
  - initiation
  basis: A vision-seeking man sees women dancing, they turn into buffalo, and he learns
    the Buffalo-dance.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The abstract is very brief and does not describe the full vision procedure
    or dance teaching.
- id: motif:4
  label: Dead visitor gives ritual dance to the living
  taxonomy_refs:
  - return
  basis: A dead woman joins a war party, the men return victorious, she gives the
    people a dance, and then she goes back.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The destination to which the dead woman returns is not specified in the
    abstract.
- id: motif:5
  label: Trick learned with warning and lost through overuse
  taxonomy_refs:
  - trickster_boundary
  basis: Nih’angan learns the eye-removal trick after being warned not to use it excessively;
    after repeated use, his eyes fail to return.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage identifies the figure and action but does not explicitly label
    Nih’angan as a trickster.
- id: motif:6
  label: Borrowed animal eyes and etiological animal features
  taxonomy_refs: []
  basis: In the eye-loss variants, animal eyes are loaned; one version explains Nih’angan’s
    yellow eyes through Owl, and another explains Mole’s blindness when its eyes are
    not returned.
  evidence_refs:
  - ev:8
  - ev:9
