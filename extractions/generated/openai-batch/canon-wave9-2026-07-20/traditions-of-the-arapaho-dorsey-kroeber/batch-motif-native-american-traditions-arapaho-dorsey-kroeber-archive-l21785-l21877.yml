  locator: 21841-21858
  quote_or_summary: In one “Nih’angan loses his Eyes” abstract, Nih’angan learns from
    a man who throws his eyes into cottonwood tree-tops, is warned not to do it excessively,
    overuses the trick, cannot recall his eyes, borrows eyes from Mouse and Owl, and
    his own eyes are seen on cottonwood bark and branches.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
