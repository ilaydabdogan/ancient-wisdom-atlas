canonical_text:
  quote: ''
  summary: 'The passage first gives an ethnographic comparison of Nih''angan as a
    name connected with white people, spider etymology, creator ambiguity, and trickster-like
    tales. It then narrates culture-art origins: a man makes knives, the first bow
    and arrows, and kills buffalo; another man learns fire-making from struck stones
    after fasting; a summary says three men brought buffalo enclosure and horses,
    knife and bow, and fire to the people. The next section, titled “The Flood,” begins
    with a poor family near a river; the daughter finds a dead rabbit and then a dead
    antelope while fetching water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note says Nih'angan is now an ordinary Arapaho word for white man, also
    means spider, and has uncertain explanations as wise or skillful and as slender
    or narrow-bodied.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note says Arapaho myths give Nih'angan no animal or spider-like qualities,
    describe him as entirely human, and place him in ridiculous and often obscene
    tales rather than serious hero myths.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man made a knife by sharpening material and also made a knife from flint
    by flaking it into shape; the people learned to make knives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The same man made the first bow and four arrows with an arrow point made from
    a short rib of a buffalo, waited by a buffalo path, shot buffalo, and killed four.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the bow hunt, the man told the people to harness the dogs because four
    dead buffalo were in the timber, and from then on people could get meat without
    driving buffalo into an enclosure.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man went away alone and fasted, learned that certain struck stones could
    make a spark to light tinder, gathered stones and dry wood, and made fire at home
    to the astonishment of observers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The summary says three men procured the buffalo enclosure and horses, the
    knife and bow, and fire, and brought the people to their present condition of
    life.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the beginning of the section titled “The Flood,” an old man, his wife,
    his daughter, and his little son lived alone in a tent near a river; the old man
    was sick and unable to hunt.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The daughter fetched water in the morning, found a dead rabbit on one day
