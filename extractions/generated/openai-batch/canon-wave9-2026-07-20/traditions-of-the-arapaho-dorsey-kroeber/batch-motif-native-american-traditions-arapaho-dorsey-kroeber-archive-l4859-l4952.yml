- id: obs:1
  text: The mother and daughter returned to their creek camp and slept sadly that
    night.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the morning the daughter saw a man near the tipi dressed and equipped in
    white, including a white bow-case, quiver, robe, shirt, leggings, and moccasins.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage first explains that the man had whitened his things with lime
    found near the cliff by the creek and had covered one eye with lime; later the
    eye covering is described as mud or clay plaster.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:6
  - ev:8
- id: obs:4
  text: The mother questioned the man in sign language, and he answered in sign language
    that he was a Sioux named One-Eyed-Sioux.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the mother and daughter consulted, they invited the man into the tipi,
    where he sat at the back for a meal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The mother told the daughter to cook for the man while she erected another
    tipi outside; meanwhile the man looked at the girl with sexual expectation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The daughter told One-Eyed-Sioux that her father had died recently and had
    instructed that she should marry a friendly passer-by who could help them at or
    guide them to the camp-circle.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The daughter brought bedding and arranged the separate tipi, then took the
    man inside as her husband; the man wished night would come because he desired
    her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the night together, the man slept late, and the daughter rose to prepare
    breakfast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: While dressing, the daughter saw that the covering over the man's eye was
    drying and shrinking, looked under it, and found that the eye was all right.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The daughter noticed that the man's nose, eyes, head, face, and body resembled
    her father's and told her mother that she believed he was her father.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The mother hesitated to enter what she called her son-in-law's tipi, but eventually
    went in with the daughter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The mother recognized the man as her former husband and saw that he had plastered
    one eye to deceive his own daughter.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The mother pulled the man from the bed by the hair and beat him; while he
    pleaded for mercy, the clay plaster fell off, and he finally admitted who he was.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: A parenthetical narrator comment states that this is how it should be done
