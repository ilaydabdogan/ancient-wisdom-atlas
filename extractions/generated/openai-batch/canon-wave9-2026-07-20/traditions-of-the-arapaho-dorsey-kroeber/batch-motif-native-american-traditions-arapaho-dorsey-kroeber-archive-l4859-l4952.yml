canonical_text:
  quote: ''
  summary: A mother and daughter, mourning and seeking the camp-circle, encounter
    a white-clad man who appears to have one eye and claims in sign language to be
    a Sioux named One-Eyed-Sioux. The daughter marries him because her father had
    instructed her to marry a friendly helper who could guide them. The next morning
    she sees that the covered eye is only plastered over and that the man resembles
    her father. Her mother enters the tipi, recognizes him as her former husband,
    and beats him until he admits his identity; the passage closes with a parenthetical
    judgment against fathers who deceive their daughters.
  language: English
  quote_policy: summarized
