canonical_text:
  quote: ''
  summary: The passage gives the end of one ice-diving episode and the beginning of
    “Medicine-Man Kingfisher dives through the Ice.” In the first episode, a man tries
    to imitate another man’s painted, whistled tree-jump through ice, is injured,
    is cured, and then watches the other man disappear under the ice and return with
    fish. In the second episode, a medicine-man with no food for a visiting friend
    uses charcoal paint, a bone whistle, a leaning tree, and four leaping motions
    to plunge through lake ice and return with two beavers for a meal; the visitor
    later prepares to reproduce similar conditions at his own camp.
  language: English
  quote_policy: summarized
