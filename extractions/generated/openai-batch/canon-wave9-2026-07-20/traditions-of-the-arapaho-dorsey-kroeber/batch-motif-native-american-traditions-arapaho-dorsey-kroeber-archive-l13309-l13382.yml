- id: obs:1
  text: The wife addresses the dead horse several times, asking it to get up, show
    its power, and help the husband recover the horses.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The husband asks the wife to do her best and says he did wrong and wants forgiveness.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The dead red-speckled horse moves, breathes, gets up, shakes itself, sneezes,
    lifts its ears, swings its tail, and whinnies four times.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After the horse revives, the whole herd has returned, with animals panting
    and colts and mares whinnying.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The husband hugs and kisses the horse and tells it that he did wrong.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A parenthetical note says that in early days, when a young man was caught
    with a married woman, stock could be demanded or killed by the injured person;
