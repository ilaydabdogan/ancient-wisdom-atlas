canonical_text:
  quote: ''
  summary: A wife repeatedly speaks to a dead red-speckled horse at her husband's
    request. The horse revives, the herd returns, and the husband apologizes and shows
    affection to the horse. The passage explains this in relation to stock compensation
    for a married woman's lover. The husband later asks for a particular white horse
    with black markings. The wife rides away with a mare and the red-speckled horse,
    returns through an eastern ravine with the desired horse, and the husband proudly
    rides it around the camp circle.
  language: English
  quote_policy: summarized
