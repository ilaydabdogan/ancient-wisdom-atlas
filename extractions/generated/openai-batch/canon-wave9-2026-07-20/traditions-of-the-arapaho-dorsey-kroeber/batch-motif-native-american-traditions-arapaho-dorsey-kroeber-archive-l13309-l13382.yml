  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The wife asks the husband to bring her favorite mare, saddles and mounts it,
    and tells him to watch an eastern divide and small ravine until she comes out
    of it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The wife rides over the divide through the ravine, followed by the red-speckled
    horse and the new black-eared horse.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The husband receives the new horse, mounts it, rides it around the camp circle,
