canonical_text:
  quote: ''
  summary: The passage contains the end of one Nih'ancan episode in which a soiled
    robe is repeatedly given away and recovered clean, a rock pursues and pins him,
    and a bull-bat frees him before having its mouth widened. It then gives the episode
    titled 'Nih'ancan pursued by the Rolling Skull,' in which a skull emerges from
    an ice-fishing hole, chases him through wished-for obstacles, and is finally dropped
    into a fissure by means of a stick bridge. An editorial note compares the rolling
    rock/head pattern with other Native North American traditions.
  language: English, with some Latin phrases and OCR irregularities
  quote_policy: summarized
