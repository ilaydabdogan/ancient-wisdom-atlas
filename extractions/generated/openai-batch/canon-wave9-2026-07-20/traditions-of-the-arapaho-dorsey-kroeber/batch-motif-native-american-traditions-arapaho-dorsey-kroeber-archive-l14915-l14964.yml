canonical_text:
  quote: ''
  summary: 'The passage ends one narrative in which an owl directs a man to his wife;
    the wife notices his changed bright-eyed appearance and offers him meat, but he
    forces pemmican into her mouth with a stick until she dies. A footnote states
    that this myth is widespread among Eskimo and Indian traditions. A new narrative
    begins: an old man, his wife, son, and daughter camp by three east-flowing streams
    after leaving the people to seek food. The old man becomes blind. When a buffalo
    passes near the tent, he asks his wife to aim his bow for him; she does so, he
    releases the arrow and knows he has killed the buffalo, but she tells him he has
    not.'
  language: English
  quote_policy: summarized
