canonical_text:
  quote: ''
  summary: 'The passage first closes a preceding tale in which people are lost and
    the hill that carried them away is identified as the horse-tick. It then tells
    “The White Buffalo Cow”: during a winter hunt, a famous warrior-hunter pursues
    a white buffalo cow. Before each shot he tells a war story, wounding her several
    times. The herd repeatedly responds, including circling her four times and licking
    her face. After she dies sitting upright, the hunter prays to her, skins her reverently,
    warns his wife to handle the hide carefully, and takes the sacred hide to the
    high priest’s tipi. The hide is described by color and features.'
  language: English
  quote_policy: summarized
