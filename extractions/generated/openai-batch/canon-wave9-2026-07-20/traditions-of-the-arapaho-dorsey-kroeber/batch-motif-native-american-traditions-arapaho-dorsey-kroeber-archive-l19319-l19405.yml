canonical_text:
  quote: ''
  summary: During buffalo skinning after a successful hunt, Found-in-Grass, his wife,
    Crow, and Crow's wife interact around beef, a blood-filled bladder bag, and a
    beautiful robe. Found-in-Grass wounds Crow and pierces the blood bag, splashing
    the sister-in-law's robe. At home, Found-in-Grass is honored with a feast and
    smoke attended by chiefs and warriors, and the tribe is said to have passed through
    the famine. Later Found-in-Grass prepares for a solitary war-path with a bladder
    bag filled with porcupine quills. At an enemy camp he retreats to a rocky hill,
    opens the bag, and countless warriors emerge, defeat the enemy, and return to
    the bag as porcupine quills.
  language: English
  quote_policy: summarized
