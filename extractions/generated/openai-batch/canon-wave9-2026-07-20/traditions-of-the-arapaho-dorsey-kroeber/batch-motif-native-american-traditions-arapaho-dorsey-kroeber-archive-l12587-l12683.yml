canonical_text:
  quote: ''
  summary: 'The passage begins with an editorial note on versions of Turtle’s war-party
    and a fragment in which figures rise into the sky as three stars while a bear
    dies after failing to catch them. It then begins the Arapaho tradition titled
    “Big Owl, Owner-of-Bag”: in a camp-circle, a mother angrily threatens and then
    throws her crying son out of the tipi to Owner-of-Bag. The boy falls into Owner-of-Bag’s
    open bag and is fed. The mother later searches for him unsuccessfully among relatives
    and throughout the camp. In grief, she pledges to make elaborate porcupine-quill
    articles and begins making quilled clothing and buffalo robes.'
  language: English
  quote_policy: summarized
