canonical_text:
  quote: "“I have dropped it.”"
  summary: A husband returns with game, and his wife recognizes him by voice, folds
    aside her buffalo robe work, and cooks. The next morning the husband warns his
    wife not to give attention to any strange voice near their tipi. While he is away,
    the wife works on the robe; a strange voice calls beside the tipi, but she gives
    no answer. Later the husband returns with beef, she recognizes his voice, and
    the couple eat supper and retire, though she remains restless.
  language: English
  quote_policy: quoted
