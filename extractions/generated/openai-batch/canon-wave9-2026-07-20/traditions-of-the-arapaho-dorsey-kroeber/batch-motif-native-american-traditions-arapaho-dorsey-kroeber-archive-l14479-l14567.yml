canonical_text:
  quote: ''
  summary: The passage describes Man-Above fasting during Sun-dances, receiving pity
    and medicine powers from animals, insects, birds, and supernatural beings, being
    bewitched through a worm, and becoming a healer who removes sickness and evil
    influence. It also describes offerings and seasonal rehearsals associated with
    his medicine practice. The excerpt then begins the story titled “Skull acts as
    Food-getter,” in which a family in a tipi by a river faces starvation until the
    daughter finds dead buffalo on successive mornings.
  language: English
  quote_policy: summarized
