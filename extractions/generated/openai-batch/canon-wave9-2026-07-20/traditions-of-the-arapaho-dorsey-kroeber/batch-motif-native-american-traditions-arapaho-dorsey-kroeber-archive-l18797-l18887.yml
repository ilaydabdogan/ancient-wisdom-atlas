canonical_text:
  quote: ''
  summary: By-the-Door persuades Spring-Boy to inspect the gap between arrows and
    then seizes him so their father can reclaim him. After Spring-Boy yields, the
    twins instruct their father to make red and black bows and arrows, build a sweat-lodge,
    and place their dead mother inside. The boys stand on opposite sides of the lodge
    and shoot arrows in sequence; the lodge moves and shakes, and the mother emerges
    alive and dignified. The father thanks the boys for their power, and the family
    lives happily near the river bottom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: By-the-Door tells Spring-Boy that a sinew string from his arrow touches Spring-Boy’s
    arrow.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spring-Boy denies that the arrows touch and says the space is wide enough
    for someone to travel through with a tipi.
  category: speech
  evidence_refs:
