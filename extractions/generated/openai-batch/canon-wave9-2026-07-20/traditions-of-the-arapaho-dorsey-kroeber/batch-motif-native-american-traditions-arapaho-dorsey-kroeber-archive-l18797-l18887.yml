    the other bow with two arrows black.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The father makes the painted bows and arrows as requested and gives them to
    the boys.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The boys ask their father to build a sweat-lodge in front of the tipi, slightly
    to the right, and to carry their mother inside.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The father gathers willows, cottonwood bark, sage, and stones, completes the
    sweat-lodge, places his wife at the west side, performs the usual rite, and takes
    heated stones inside.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: 'The two boys stand on opposite sides of the sweat-lodge: the boy with red
    bow and arrows on the south side and the other boy on the north side.'
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: The boy with the red bow and arrows steps forward with his right foot, commands
    all to face east and tells his mother to get out of the way, then shoots an arrow
    in the air; when it lands, the bottom of the sweat-lodge moves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The boy with the black bow and arrows and the boy with the red bow and arrows
    alternate shooting arrows; as the arrows land, the sides and top of the sweat-lodge
    move, and after the final high shot the lodge shakes greatly.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A clean, dignified woman, neatly dressed and with a sunbeam face, comes out
    of the sweat-lodge.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The father hugs and kisses them, thanks the boys for their power, and the
    family again lives happily near the river bottom.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: The boys grow rapidly and engage in bigger sports away from home, while the
