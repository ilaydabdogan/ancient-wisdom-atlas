canonical_text:
  quote: ''
  summary: 'The passage concludes a Buffalo Lodge ceremonial sequence involving buffalo,
    White-Buffalo-Woman, dancers, elders, pipes, all-night singing, and dispersal
    at sunrise. Editorial notes compare motifs involving human-eating buffalo, rescue
    from trees, and buffalo-calf reanimation with Cheyenne, Blackfeet, Pawnee, and
    another Arapaho item. The next tale begins with the origin of the Buffalo Lodge
    and Sacred Bundle: a poor family with one disabled pony is left behind during
    a camp movement and camps by a creek at the foot of a high mountain.'
  language: English
  quote_policy: summarized
