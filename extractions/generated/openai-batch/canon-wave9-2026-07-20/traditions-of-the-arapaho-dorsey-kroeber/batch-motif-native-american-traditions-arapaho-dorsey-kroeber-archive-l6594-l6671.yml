canonical_text:
  quote: ''
  summary: The passage describes an unnamed host who produces food for Nih’anqan by
    opening his wife’s skull along a red line, removing brain matter converted into
    tallow, and having her make pemmican while she remains alive. Nih’anqan later
    attempts to imitate the host’s methods, including turning cottonwood bark over
    fire into meat and striking his wife’s head, but his wife is killed until the
    visitor restores her and demonstrates the correct procedure. An editorial note
    compares bark-to-food transformation with another Arapaho item and a Wichita story.
    The passage then begins a separate tale in which a host calls four times for food
    to come down and meat falls before the tent.
  language: English
  quote_policy: summarized
