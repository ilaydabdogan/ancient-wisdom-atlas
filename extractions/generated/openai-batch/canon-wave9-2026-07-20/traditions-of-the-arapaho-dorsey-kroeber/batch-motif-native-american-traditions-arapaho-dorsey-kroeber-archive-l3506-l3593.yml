  text: Nih'anqan comes downstream to a beaver dam where the stream has nearly gone
    dry and the surrounding willows and other trees have had their bark eaten off.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nih'anqan calls the beavers out, says he is a good man, and tells them of
    a large stream over the hill with cottonwood, willow, and other trees good to
    eat.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The beavers, including old and young, come out across the dam; the chief beaver
    says they live with difficulty, must go far for bark, and that their children
    are almost starving.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The beavers start uphill over the prairie while Nih'anqan follows behind with
    a stick; he threatens or gestures toward a little beaver that has fallen behind,
    then reframes his words as meaning food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nih'anqan moves to the center of the beaver herd and strikes as many as he
    can; the fastest escape, but most are killed, and he carries the meat home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the next tale, Nih'ancan meets ducks on the sand while going downstream,
    and they ask him to make a dance for them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nih'ancan takes a drum, stands in the middle, tells the ducks to dance around
    him, and warns them not to open their eyes until he permits it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: While beating the drum and singing, Nih'ancan uses a large stick to knock
    down passing ducks; the last dancer opens one eye, sees him, warns the others,
    and those still alive fly away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nih'ancan gathers the duck victims, cuts them open, slices and hangs the meat
    to dry, cooks two for himself, sleeps, and later finds that the hanging meat is
    gone.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After finding the meat gone, Nih'ancan angrily says that the first person
    he meets is the thief and calls for whoever stole his meat to become blind.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Nih'ancan meets a large blind bear; the bear asks for pity and help and says
    that a skunk came out of a round hole and sprayed his eyes after he put his head
    in because he was hungry.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Nih'ancan tells the blind bear that a severe snowstorm is coming from the
    north, directs him into a pile of brush and grass, covers him, and tells him not
    to move but to sleep.
  category: action
  evidence_refs:
