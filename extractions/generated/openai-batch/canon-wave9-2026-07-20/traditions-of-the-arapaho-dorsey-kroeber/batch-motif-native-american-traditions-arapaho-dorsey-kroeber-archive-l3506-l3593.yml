canonical_text:
  quote: ''
  summary: The passage contains the end of one Nih'anqan episode and the beginning
    of another. Nih'anqan persuades hungry beavers to leave their drying dam by promising
    a better stream, then kills many of them with a stick and takes the meat home.
    In the following tale, ducks ask him to make a dance; he orders them to dance
    around him with eyes closed, kills many with a stick, but one duck sees and warns
    the survivors. Nih'anqan dries and cooks duck meat, sleeps, and later finds the
    hanging meat gone. He declares the thief will be blind, then meets a blind bear
    who says a skunk sprayed his eyes when he put his head into a hole. Nih'anqan
    tells the bear that a snowstorm is coming and covers him in brush and grass; the
    supplied passage breaks off during this scene.
  language: English
  quote_policy: summarized
literal_observations:
