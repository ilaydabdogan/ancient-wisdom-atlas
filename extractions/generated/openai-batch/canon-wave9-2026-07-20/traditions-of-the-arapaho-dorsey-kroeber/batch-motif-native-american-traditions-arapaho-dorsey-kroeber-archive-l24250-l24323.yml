canonical_text:
  quote: ''
  summary: 'A set of Arapaho abstracts centers on a porcupine or the moon in porcupine
    form enticing a woman up a tree that reaches the sky. In the sky she becomes a
    wife, is warned not to dig, discovers a hole through which earth is visible, and
    attempts descent by sinew rope. Variants differ: she lands safely, is killed by
    a stone dropped by her husband, is helped by an old woman, or leaves a child who
    survives. One variant continues with the surviving boy raised by an old woman,
    killing a monster and snakes, recovering from a snake entering his body, giving
    away a supernatural bow, and becoming a star. A following abstract begins with
    a man warning his pregnant wife by a river not to respond to a calling voice while
    he hunts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women go out for firewood, see a porcupine climbing a tree, and one woman
    climbs after it as the tree lengthens until both reach the sky.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The porcupine takes the woman into a sky camp-circle where his father and
    mother live, and a lodge is put up for them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband warns the woman not to dig too deeply; while digging for hog potatoes
    or roots she opens a hole and sees the green earth and a camp-circle below.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:4
  - ev:7
- id: obs:4
  text: The woman uses sinew and a digging stick to make a rope or lariat for lowering
    herself through the hole toward earth.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:7
- id: obs:5
  text: In one summary, the husband drops a circular stone along the sinew string,
    striking the woman’s head, breaking her loose, and landing her safely on the ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In abstract 136, the sun and moon are two brothers; the moon becomes a porcupine
    and entices a woman to climb a tree to the sky.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In abstracts 136 and 137, the woman has a chewing contest with a frog or older
    wife, whose deceit with charcoal is discovered in one version.
  category: action
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:8
  text: In abstracts 136 and 138, the woman’s attempt to descend by sinew rope fails
    to reach the earth, and her husband kills her by dropping or throwing a stone;
    her child falls to the ground unhurt.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:9
  text: In abstract 136, the surviving boy is found and raised by an old woman, discovers
    someone eating their food, and kills a monster who is the old woman’s husband.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The boy kills many sleeping snakes; one snake threatens revenge, follows him,
    and enters his body while he sleeps.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The boy lies like dead, becomes a skeleton, makes rain and heat until the
    snake emerges from his skull, seizes it, and attaches it to his bow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The boy returns to the old woman, gives a young man his supernatural bow,
    and turns to a star.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: In abstract 137, an old woman pities the woman and lets her down to earth
    by a sinew rope; the woman’s child becomes a great chief.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The beginning of abstract 139 places a man and pregnant wife by a river; the
    husband warns her to remain inside if someone calls while he is away, and a voice
