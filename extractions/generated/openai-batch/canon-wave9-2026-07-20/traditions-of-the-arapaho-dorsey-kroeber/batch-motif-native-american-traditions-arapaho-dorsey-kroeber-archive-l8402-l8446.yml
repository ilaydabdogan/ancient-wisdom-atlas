canonical_text:
  quote: ''
  summary: Unspecified people give a girl many objects that are to become parts of
    her bull husband’s body. The objects are tied into a bundle with a rawhide rope
    intended for his intestine, and a blackbird is added to become hair on his back.
    The girl then goes to the bull, is received by him, lives with him for some time,
    and wears a painted buffalo robe.
