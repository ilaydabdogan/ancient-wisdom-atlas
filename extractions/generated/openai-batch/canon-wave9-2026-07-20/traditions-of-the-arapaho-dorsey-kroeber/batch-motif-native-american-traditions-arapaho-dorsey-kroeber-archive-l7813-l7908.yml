canonical_text:
  quote: ''
  summary: Women see a strange water being in the river; its eye-flashes hypnotize
    them and it sinks into a sandbar. Men identify it as the Hiintcabiit, a water
    monster, find it turned to stone, dig it out, and place it on dry land. Leaders
    summon people to make offerings, and the monster is heavily adorned. Little-Shield
    rejects its sacred status, shoots it, and removes gifts. The monster later sinks
    and disappears, thought to have returned to the river. The passage closes with
    a physical description and a note that Beaver-Woman first saw it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A curious object in the river lifted its head, swam up the current, looked
    at the women, and emitted lightning-like flashes from its eyes that immediately
    hypnotized them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The women dropped their pails and watched the monster try to sink into the
    sandbar; after difficulty with pebbles and stones, it entered the sandbar and
    made a ridge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The women returned to the tipi and told the men that they had seen a strange-looking
    animal at the river.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The men went to the river, saw the ridge, discussed it, and concluded that
    it was the Hiintcabiit, identified in the passage as a water monster.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Three men waded to the ridge and reported that the water monster seen by the
    women had turned to stone and that its back was visible.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men dug around the monster, removed stones and pebbles, took hold of it, and
    carried it to dry land.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Chiefs and head men instructed criers to announce that the monster had been
    caught and that people wishing to pay respect and make offerings should come so
    the monster would not get angry.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: People treated the monster as a sacred beast and beneficial to the nation,
    brought gifts, bowed down, and tied objects to its head and body until little
    of the body could be seen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Little-Shield is described as an Indian who did not believe the medicine-men
    and their gods.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Little-Shield declared the animal was not a god, criticized the giving of
    valuable gifts to it, shot it in the forehead, and took the best things away from
    it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The people criticized Little-Shield for his infidelity, but he repeatedly
    went to the monster to look for more good presents.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The monster gradually sank while people continued bringing gifts for mercy
    or because it had demanded gifts in their dreams.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The monster disappeared suddenly, and people thought it had gone back to the
