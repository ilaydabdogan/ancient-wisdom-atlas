canonical_text:
  quote: ''
  summary: Big-Chief had left his brother in a distant place to drive away flies.
    After several years the tribe presumed the brother dead, deprived Big-Chief of
    authority and property, and forced him and his wife outside the camp-circle. Big-Chief
    and his wife repeatedly visited the brother, who remained in a pit still obeying
    the old instruction. After the wife described their hardships, the brother agreed,
    jumped out of the pit, and returned with them. At the camp, the wife tried to
    announce his return to dancers, but was rejected.
  language: English
  quote_policy: summarized
