literal_observations:
- id: obs:1
  text: A man sees a fish in shallow water, catches it, cuts it open, and Nih’ancan
    comes out smiling.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nih’ancan visits his friend, who leaves the tent and sharpens his leg.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The friend drives out buffalo, kills four by kicking them, skins them, and
    brings in the meat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nih’ancan invites the friend to visit his own tent in return.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the friend visits, Nih’ancan sharpens his own leg, kicks a buffalo, cannot
    pull his leg free, and is dragged by the buffalo.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The friend pulls Nih’ancan free, tells him to look carefully, and demonstrates
    by killing four buffalo.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: On a later visit, the friend asks his wife for feathers, white paint, a shoulder
    belt, and a whistle; he paints himself and puts on wings.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The friend and Nih’ancan go to a round hole in the ice in the water, and the
    friend climbs a leaning tree over the water.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The friend makes four forward motions while blowing a whistle and flapping
    his wings, then on the fifth motion plunges through the hole and later emerges
    with a fish and ducks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: When the friend visits in return, Nih’ancan gives him a pipe to smoke and
    asks his wife for the same ornaments and equipment.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Nih’ancan’s wife has difficulty finding the feathers, whistle, white paint,
    and shoulder belt, and Nih’ancan urges her to hurry.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Nih’ancan imitates the tree, wing-flapping, and whistling sequence, but falls
    head-first onto the wrong place on the ice and breaks his head.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: After Nih’ancan recovers, the friend again shows him how to do it and provides
    food for him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: At the beginning of the next tale, Nih’ancan travels downstream in winter,
