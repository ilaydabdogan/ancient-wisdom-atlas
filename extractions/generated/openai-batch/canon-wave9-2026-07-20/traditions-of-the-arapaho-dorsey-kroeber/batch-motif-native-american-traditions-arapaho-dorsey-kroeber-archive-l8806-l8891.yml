canonical_text:
  quote: "“there came out a little girl fully formed”"
  summary: A sick young man with a swollen foot remains in a shelter-tipi while his
    companions hunt. After they leave, he pierces the softened abscess in his foot
    with a thorn, and a fully formed little girl emerges. He comforts her, calls her
    his daughter, wraps her in soft buckskin, and later tells the returning hunters
    that his foot is improving.
