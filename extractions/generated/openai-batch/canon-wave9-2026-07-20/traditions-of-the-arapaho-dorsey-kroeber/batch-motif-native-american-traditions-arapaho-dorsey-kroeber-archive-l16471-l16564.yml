canonical_text:
  quote: "“Some time during the night this old tipi changed into a large and commodious
    tipi, facing to the sunrise.”"
  summary: During a famine, a young man called the old woman’s pet marries Blood-Clot-Girl
    through his grandmother’s request. His household’s old tipi changes overnight
    into a large white-looking tipi, and he later finds a buffalo herd, but a white-looking
    bird helps the herd escape the hunters.
