- id: obs:12
  text: Red-Stick-Man says he is going to another camp for a visit and promises his
    mothers to return by sundown.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: At a cut in the mountain, Red-Stick-Man sees a cottonwood tree with an eagle
    nest and young birds, undresses, piles his clothing, and climbs for eagle feathers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Nihangan sees Red-Stick-Man in the tree with his clothes on the ground and
