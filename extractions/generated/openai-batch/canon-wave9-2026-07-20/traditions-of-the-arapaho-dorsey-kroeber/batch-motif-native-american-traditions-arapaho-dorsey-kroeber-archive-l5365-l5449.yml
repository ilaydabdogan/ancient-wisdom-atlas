canonical_text:
  quote: ''
  summary: A group of sisters living in a cave assign Panther as an inside doorway
    sentinel. The youngest sister wants a son, and the sisters choose a red berry
    stick, cut it, place it in a furnished bed, and repeatedly address it until it
    becomes a young man named Red-Stick-Man. He is treated as their son and sent to
    observe and help. While going to another camp, he climbs a cottonwood tree for
    eagle feathers. Nihangan magically makes the tree stretch upward and smooth, trapping
    him, then puts on Red-Stick-Man's clothes and goes to the camp in disguise.
  language: English
  quote_policy: summarized
