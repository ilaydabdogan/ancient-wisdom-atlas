- id: obs:8
  text: Across repeated addresses, the stick first moves, then speaks a little, then
    becomes fully developed, and on the seventh time rises as a man.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The newly risen man thanks the sisters and says he had been standing a long
    time and was exhausted.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The sisters tell the man that he will be their son and will perform errands
    and other young man's tasks around the cave.
