canonical_text:
  quote: ''
  summary: The passage contains the end of a Nih’angan episode about a failed food-hosting
    display, the episode “Nih’angan and the Dwarf,” in which Nih’angan tries to kill
    and carry home a dwarf who repeatedly strikes him and escapes, and the beginning
    of “The Woman and the Horse,” in which a woman searching for a colt goes away
    with a young man identified as a wild horse and is mourned as lost by her husband
    and camp.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nih’angan says that he and his friend are alike and have the same power, then
    invites the friend to come to his tent.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nih’angan tells his wife to load the children with food and instructs the
    children to drop their food bags in front of the tent when he calls four times.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After Nih’angan calls four times for food, the children do not come; he finds
    them asleep and beats them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nih’angan finds a dwarf while going down the river, decides to kill him, throws
    him down, and the dwarf appears dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: While Nih’angan carries the dwarf through timber, the dwarf seizes limbs,
    lets go, and strikes Nih’angan in the face or eye several times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Nih’angan repeatedly steps on or pulls the dwarf’s arms, believing them broken,
    while still treating the dwarf as dead or disabled.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Nih’angan tells his wife that he has killed a dangerous little-person being;
    she warns that dwarfs are dangerous and asks whether he is sure.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The wife goes to the place Nih’angan indicates and finds that the dwarf is
    gone; Nih’angan then realizes the dwarf had been deliberately hitting him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: While the Southern-people are traveling, a woman misses a colt and goes back
    along the trail to look for it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The woman meets a young man on the trail; the narration identifies him as
    a wild horse.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The young man says he came to get the woman and wants to marry her; she agrees,
    releases her riding horse, and goes with him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The woman’s riding horse returns to camp alone; her husband searches for her,
