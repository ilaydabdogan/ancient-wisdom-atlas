canonical_text:
  quote: ''
  summary: Sleepy-Young-Man is repeatedly rebuked by his father and mother for lying
    in bed late. His father says he will never see the cannibals unless he rises early
    and acts like a man. The young man resolves to seek the cannibals and visits an
    old woman for information. She feeds him, hears his request, warns that the cannibals
    live toward the sunrise on a long and dangerous journey from which others have
    not returned, and finally prepares dried beef, tallow, and moccasins for him while
    directing him to keep going toward the sunrise.
  language: English
  quote_policy: summarized
