canonical_text:
  quote: ''
  summary: The passage includes the end of an etiological animal race in which the
    horse reaches the goal before the bull, explaining the buffalo’s slowness and
    use as food and the horse’s later use as a load-bearer. A note gives a separate
    myth in which Nih’ansafl/Nih’anpan and an Indian determine life through a buffalo
    chip and a stone thrown into water. The passage also notes Arapaho eagle classifications.
    The main narrative then describes an unnamed man, later called the murderer, who
    is instructed by Nihangan to prepare a skin filled with pemmican, summon ceremonial
    companies to feast, and establish lodges and dances according to a painted skin
    given by Nihangan.
  language: English
  quote_policy: summarized
