canonical_text:
  quote: ''
  summary: A man repeatedly warns his sons Spring-child and Door-child not to go to
    dangerous places. They first go to the creek-side timber where Tangled-hair, also
    called Open-brain, lives, and kill him with heated stones after lousing him. They
    cut off his hair tangles for rope and give them to their parents. The father next
    warns them about a powerful water animal called hiintcabiit that sucks people
    in; they ride it, survive its submergence, tire it out, kill it, and take its
    horns for spoons. The passage ends as the father warns them not to go to a mountain
    where another powerful being lives, and the brothers decide to go there.
  language: English
  quote_policy: summarized
