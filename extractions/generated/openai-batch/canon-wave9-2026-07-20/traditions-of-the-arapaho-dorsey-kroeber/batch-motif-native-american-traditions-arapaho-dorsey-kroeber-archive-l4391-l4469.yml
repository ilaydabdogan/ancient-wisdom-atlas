canonical_text:
  quote: ''
  summary: At the end of a dance episode, a girl gives Nih'angan water with a spoon
    and thereby designates him as husband, then takes him into a furnished tent; a
    following Latin segment reports a sexual reversal and her next-day approach to
    another young man with the same spoon and water. Section 39 begins with Nih'angan,
    his wife, and his mother-in-law camping alone. Nih'angan is attracted to his mother-in-law
    but cannot speak with her directly. He tells his wife that he wants to go on the
    war-path with his mother-in-law as companion, claiming that young men are doing
    this. The mother-in-law consents. He leads her away, has her climb a high hill
    while raising her dress under pretense of danger, secretly looks at her body,
    then sings a coded song and proposes returning. They descend to a creek and camp
    for the night.
  language: English with a short Latin segment
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the end of the dance, a girl brought a clear, smooth spoon and a bucket
    full of water and gave Nih'angan a drink, which designated him as her husband.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl took Nih'angan into a tent described as good and already furnished
    with a decorated bed, meat bags, a pipe, a comb, and other items.
  category: setting
  evidence_refs:
