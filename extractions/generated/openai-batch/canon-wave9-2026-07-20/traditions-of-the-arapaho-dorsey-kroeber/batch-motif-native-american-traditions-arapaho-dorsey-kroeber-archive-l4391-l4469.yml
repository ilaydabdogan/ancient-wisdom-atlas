- id: obs:3
  text: The Latin segment reports that after an unexpected sexual discovery the woman
    expelled Nih'angan, then the next morning took water and the same spoon to another
    young man, who became a man after she gave him drink and entered the tent first.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nih'angan, his wife, and his mother-in-law camped alone; he had his own tipi
    and did much work and errands for the mother-in-law.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nih'angan became fond of his mother-in-law from a distance because of her
    looks, but he could not talk with her.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: After returning with meat and refusing to eat at first, Nih'angan told his
    wife that he wanted to go on the war-path but needed a companion, specifically
    asking to take his mother-in-law.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The wife relayed Nih'angan's request to her mother; the mother-in-law consented,
    and Nih'angan and the mother-in-law left while the daughter remained behind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the journey, Nih'angan directed the mother-in-law to climb a high hill
    first, tie or hold her dress higher, and walk faster, claiming danger or an enemy
    behind them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: While the mother-in-law climbed, Nih'angan looked at her legs and genitals
    and laughed secretly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the hilltop Nih'angan said the pursuing enemy had disappeared and that
    they were safe for the night; the mother-in-law believed what he said.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: While resting, Nih'angan sang while beating his bow with an arrow; the song
    referred to a dark spot he saw, glossed in the passage as referring to the mother-in-law's
    genitals, and he explained the words as a war-party song about people behind them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Nih'angan proposed turning back because they could not see or overtake the
    others; he and the mother-in-law descended the hill, reached a creek with timber
    and grass, and prepared to camp for the night.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
