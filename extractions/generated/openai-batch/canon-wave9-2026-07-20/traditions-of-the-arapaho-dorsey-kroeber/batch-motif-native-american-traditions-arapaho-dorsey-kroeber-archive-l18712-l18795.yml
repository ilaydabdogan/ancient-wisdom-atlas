canonical_text:
  quote: ''
  summary: A visitor eats food placed for him and kills a pregnant woman by cutting
    her stomach with a stone knife. Twin boys emerge from her body; the visitor throws
    one at the door and one outside, then arranges the corpse by the fire and leaves.
    The husband returns, finds his wife dead, mourns repeatedly, and notices his arrows
    scattered in the tipi. He guesses that a child may be responsible, hides nearby,
    and hears the twin boys calling each other to play with arrows. He catches By-the-Door,
    reconciles with him, and instructs him to lure Spring-Boy out of the spring through
    another arrows game.
  language: English
  quote_policy: summarized
