canonical_text:
  quote: ''
  summary: The passage gives the end of one Nih’ancan and bear-women episode and the
    beginning of another version. Nih’ancan persuades bear-women to leave their nursing
    children, kills the babies, cooks their bodies, and deceives the mothers into
    eating them as wolf meat. Pursued, he escapes through a hole in a hill, disguises
    himself, pretends to help the women catch him, lures them into the hole, and kills
    them with smoke and heat from a fire at the entrance. He butchers the bears as
    food, but while he sleeps coyotes, wolves, and mice consume his stores and damage
    his hair and robe. The next version begins with him going downriver to plums and
    a lone tipi, where four nursing women welcome him; he again sends them to pick
    plums, kills their babies, and claims the boiling meat is from gray wolves.
  language: English
  quote_policy: summarized
