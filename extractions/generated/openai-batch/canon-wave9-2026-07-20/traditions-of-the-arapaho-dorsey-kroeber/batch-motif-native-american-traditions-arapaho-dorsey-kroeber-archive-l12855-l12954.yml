canonical_text:
  quote: ''
  summary: A woman or mother and her boy flee from Big Owl. She repeatedly spreads
    decorated garments and robes, which delay Big Owl because he circles them and
    counts their quills or designs. Big Owl grows weak and collapses at the one-hundredth
    robe. The woman takes his stone club and breaks his forehead. The passage then
    explains this as the origin of crushing dead bones when encountered, and says
    owls are bad people who influence sick people to die. The mother and boy continue
    their return journey and see the camp-circle covered with blue smoke.
  language: English
  quote_policy: summarized
