canonical_text:
  quote: ''
  summary: The passage contains the end of one Arapaho narrative about two young men,
    one of whom sharpens his leg, pursues his companion to a camp, kills many people,
    and is defeated when a man who has swallowed a rock lets him kick his stomach.
    It then begins another narrative, “The Lame Warrior and the Skeleton,” in which
    a war-party member with a swollen ankle is left behind, hunts buffalo during a
    snowstorm, and is visited by a skeleton who says it caused the ankle pain to save
    him from the fate of his companions.
  language: English
  quote_policy: summarized
