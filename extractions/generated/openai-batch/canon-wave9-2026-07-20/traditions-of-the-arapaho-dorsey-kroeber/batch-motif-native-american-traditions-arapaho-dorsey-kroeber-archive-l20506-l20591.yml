canonical_text:
  quote: ''
  summary: Buffalo-Woman leaves camp with her boy while Blue-Feather is away. He follows
    and persuades her to return. She then tells him that a buffalo herd will be found
    near the place where he overtook her and gives instructions for the hunt, including
    quiet conduct, prepared weapons, restrained dogs, and bringing her buffalo tongues.
    The people follow the instructions, kill the buffalo, and bring her tongues and
    hearts. Later Elk-Woman also leaves and is brought back by Blue-Feather. While
    he is away retrieving Elk-Woman, Buffalo-Woman leaves again with the boy. Blue-Feather
    announces that a dust cloud will signal mishap, then follows their trail through
    other camp-circles and across divides.
  language: English
  quote_policy: summarized
