canonical_text:
  quote: ''
  summary: 'The passage summarizes several Nih’angan narratives: he deceives four
    nursing bear-women, kills and cooks their children, escapes through tunnels, disguises
    himself, smokes the bear-women to death, and cooks them; he joins young men in
    a race for wives and ends by marrying an old woman; in two related Mice’s Sun
    Dance abstracts he gets his head stuck in an elk skull containing dancing mice,
    floats downriver, and is released; related hair-cutting episodes describe women
    lousing him, burrs covering his head, and his cutting off his hair.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nih’angan sees ripe plums and a lone tipi near a river, enters the tipi, is
    welcomed by four nursing women, and gives them plums.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nih’angan persuades the women to let him watch their children while they go
    to pick plums.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the women leave, Nih’angan puts water over a fire, cuts off the babies’
    heads, cooks the bodies, and places the heads back in the hammocks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nih’angan tells the returning women that he is boiling gray wolves for them
    to eat; the women begin eating and say the meat tastes like children.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nih’angan flees and then tells the women that he cooked their children; the
    women find the children’s heads, cry, and scratch themselves.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The women are identified as female bears, and they chase Nih’angan through
    tunnels that he wishes into existence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the third tunnel, Nih’angan seals the end, puts mud over one eye, changes
    his appearance, and calls himself One-Eyed Sioux.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nih’angan deceives the bear-women at the tunnel entrance, builds up a fire
    until smoke smothers them, then drags them out and cooks them for himself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the wife-race abstract, Nih’angan finds a camp-circle with a painted tipi
    in the center and a pipe of peace over the door; a woman in the tipi asks him
    to remain as her husband.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Young men arrange a race for wives, handicap Nih’angan with stones tied to
    his wrists and ankles, reach the tipis first, and leave Nih’angan to marry an
    old woman.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In one Mice’s Sun Dance abstract, mice hold a Sun Dance inside an elk skull;
    Nih’angan gets his head stuck in the skull, floats downriver, and is released
    when women break the skull.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In another Mice’s Sun Dance abstract, after creating humans and other things,
    Nih’angan travels to see if everything is all right, hears a camp dance, and gets
    his head stuck in an elk skull containing mice.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the same abstract, women and girls at the river identify Nih’angan, have
    the skull opened, louse him while he sleeps, leave him, and he wakes with burrs
    in his hair and cuts his hair.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: In the hair-cutting abstract, women bathing at a river ask Nih’angan to be
    their child, louse him while he sleeps, and burrs cover his head; he cuts off
    his hair, wounds his head, and later tells his wife he cut his hair in mourning.
  category: sequence
  evidence_refs:
  - ev:10
