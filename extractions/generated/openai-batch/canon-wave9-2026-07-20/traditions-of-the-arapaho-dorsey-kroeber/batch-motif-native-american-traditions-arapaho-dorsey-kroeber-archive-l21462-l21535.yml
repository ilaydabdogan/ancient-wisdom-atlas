- id: scene:3
  label: 'Second origin: boy requests land on the flat-pipe'
  summary: A man, wife, and boy float on a flat-pipe over water; the boy asks for
    a playground, duck and turtle bring clay, the man makes dry land to the horizon,
    makes rivers and creeks by pipe motions in four directions, and Indian corn is
    named as first food.
