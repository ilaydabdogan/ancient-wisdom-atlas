  label: 'Third origin: sacred pipe, turtle, and first people'
  summary: At the beginning everything is water; a man and the sacred pipe exist;
    birds fail to reach the bottom, turtle succeeds, the man makes the world from
    a little earth, creates two men and two women, and teaches intercourse and ways
    of life.
