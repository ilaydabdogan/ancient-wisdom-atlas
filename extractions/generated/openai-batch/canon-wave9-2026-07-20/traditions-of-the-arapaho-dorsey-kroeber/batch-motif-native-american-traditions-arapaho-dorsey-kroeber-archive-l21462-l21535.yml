candidate_motifs:
- id: motif:1
  label: primordial-water earth-diver creation
  taxonomy_refs:
  - chaos
  basis: The origin abstracts describe an initial state of only water and animals
    diving for dirt, mud, clay, or earth that is then used to make land or the world.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: The available taxonomy has no exact earth-diver motif family; the chaos
    reference only covers the initial undifferentiated watery condition.
- id: motif:2
  label: sacred or flat pipe as creation instrument
  taxonomy_refs: []
  basis: The first and second origin abstracts use a flat-pipe or pipe in the context
    of floating, receiving earth-making material, or making rivers; the third begins
    with a man and the sacred pipe.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: medium
  cautions: The abstracts are compressed and do not fully explain the pipe's ritual
    or symbolic status beyond the stated actions.
- id: motif:3
  label: four-directional ordering of the world
  taxonomy_refs: []
  basis: The first origin abstract sends dried earth toward northeast, southeast,
    northwest, and southwest, and the second has pipe motions in four directions associated
    with rivers and creeks.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: medium
  cautions: The passage gives repeated fourfold details but does not explicitly interpret
    them.
- id: motif:4
  label: origin of culture arts by human discoverers
  taxonomy_refs:
  - culture_hero
  basis: The culture-origin abstract attributes buffalo surround hunting, wild horse
    capture and use, the first knife and bow, and fire-making with flints to named
    only as 'a man' or 'another man.'
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The figures are anonymous men and are not explicitly called heroes; the
    taxonomy reference is functional rather than titular.
- id: motif:5
  label: monster devouring and restoration to life
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The wart devours the boy, is broken open, and the boy is brought to life;
    later the drowned girl is rescued and revivified in a sweat-house.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
