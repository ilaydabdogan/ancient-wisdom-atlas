canonical_text:
  quote: ''
  summary: The passage gives brief abstracts of Arapaho traditions. Three fragmentary
    origin myths describe an initial watery condition, diving birds or turtle bringing
    mud or clay, a creator using pipe-related objects and gestures to make land, rivers,
    mountains, humans, animals, seasons, lodges, and ways of life. A culture-origin
    abstract attributes buffalo hunting, horse use, knife and bow making, and fire
    making to unnamed men. A flood abstract tells of a girl pursued by a rolling wart,
    deaths and revivals, a drowning by an older wife, rescue from a water monster,
    rising waters, refuge on a high peak, and the girl's brother causing the waters
    to recede.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several origin abstracts begin with an earth or world covered only by water,
    or with everything being water.
  category: setting
  evidence_refs:
