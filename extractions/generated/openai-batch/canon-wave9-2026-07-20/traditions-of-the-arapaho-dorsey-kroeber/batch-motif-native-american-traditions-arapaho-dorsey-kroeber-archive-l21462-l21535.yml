  - ev:4
- id: obs:2
  text: In the first origin abstract, Father or Flat-Pipe floats on water, calls water-fowls
    to dive for dirt, receives mud from Duck and Turtle, and uses it in making earth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the first origin abstract, Father dries mud, sends pieces toward four directions,
    commands earth to come, marks rivers over the water with a rod, and makes mountains
    where dirt is thickest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the first origin abstract, Father makes sun and moon to represent man and
    woman, makes clay man and woman, and brings trees, vegetation, animals, birds,
    day and night, seasons, lodges, and male and female animals into ordered existence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the second origin abstract, a man, his wife, and a boy float on a flat-pipe;
    the boy asks for a playground; duck and turtle bring clay; the man scatters clay
    to make dry land and uses pipe motions in four directions to make rivers and creeks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the second origin abstract, Indian corn is named as the first food.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the third origin abstract, a man and the sacred pipe exist at the beginning;
    birds dive unsuccessfully until turtle brings earth, from which the man makes
    the world.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the third origin abstract, the man makes two men and two women, described
    as two Indian and two white, and teaches intercourse and respective modes of life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The culture-origin abstract says one man learns in a dream how to kill buffalo
    in a surround and how to catch and use the wild horse; another makes the first
    knife and bow; another discovers fire-making with flints.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the flood abstract, a girl finds game every morning, hides at night, sees
    a rolling wart bringing game, and flees with her family while moccasins are left
    behind to call the wart back by imitating voices.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The wart swallows the tent, overtakes the family, devours the woman, man,
