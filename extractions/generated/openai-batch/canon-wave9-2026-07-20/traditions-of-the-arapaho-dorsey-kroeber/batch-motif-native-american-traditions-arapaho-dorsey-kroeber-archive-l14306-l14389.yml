canonical_text:
  quote: ''
  summary: At a Sun-dance lodge, Spitting-Horn-Shell and Split-Rump spit shells that
    children and others gather. The chiefs demote Split-Rump and make his body a platform
    for Spitting-Horn-Shell to dance on. Split-Rump's wife comes to the lodge, admires
    Spitting-Horn-Shell, sits by him, and leaves with him as his wife. Split-Rump
    later kills Spitting-Horn-Shell, flees through water into a deep lake, and is
    pursued by the people, who try to drain the lake with buffalo-intestine water
    bags. The people command the bird to remain near the lake and not fly high; the
    closing note identifies it as a bird found in buffalo wallows or lakes.
  language: English
  quote_policy: summarized
