canonical_text:
  quote: ''
  summary: Lone-Bull repeatedly commands an unresponsive woman to come to his bed,
    then charges at her and finds only her buffalo robe. Enraged, he demands the return
    of his wife and leads the buffalo herds to investigate a hole and tunnel. The
    woman, hearing pursuit, commands a cottonwood tree to appear near the tipi. The
    herds follow, trample the empty tipi, and a scabby calf detects the woman's scent
    on the cottonwood, revealing people hidden in the tree. Crow, Magpie, and Mouse
    are described as helping Splinter-Foot escape cruelty, with arrows prepared, while
    the people remain in the tree to avoid danger and death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lone-Bull repeatedly orders the sitting woman to come to bed, but she does
    not move or answer.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After threatening her, Lone-Bull paws the ground, plunges at her, hooks at
    her, and sends the buffalo robe into the air; the wife is absent and only the
    robe remains.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Other people hear Lone-Bull and criticize him for cruelty.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Lone-Bull runs through the herd in anger, hooks steers, demands the return
    of his wife, and threatens injury to his fellow-men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Older bulls suggest inspecting the place where the woman sat; the herd finds
    a hole or opening with a scent, which the passage says proves she had been carried
    away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Lone-Bull calls all the herds to dig along the tunnel to its end.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The woman hears noise behind her and speaks a wish or command for a branched
    cottonwood tree to stand near the tipi; a cottonwood tree then appears.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The herd moves in four divisions in parallel rows, with Lone-Bull in the front
    line and cows, calves, and buffalo of all ages among them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Lone-Bull finds the tipi empty and commands that it be trodden down; after
    the four herds pass over it, only a bare spot remains.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A poor cow and her scabby calf follow in the last herd; the calf goes to rub
    against the cottonwood and detects the scent from the woman's urine running down
    the trunk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The calf calls his mother back, saying the scent smells like Lone-Bull's wife;
    the mother goes to the tree and sees men with their daughter up in it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Crow, Magpie, and Mouse are described as trying to get Splinter-Foot away
    from cruelty, having made arrows; the people ascend the tree to avoid danger and
    death and remain quiet as the herds pass.
  category: action
  evidence_refs:
  - ev:6
