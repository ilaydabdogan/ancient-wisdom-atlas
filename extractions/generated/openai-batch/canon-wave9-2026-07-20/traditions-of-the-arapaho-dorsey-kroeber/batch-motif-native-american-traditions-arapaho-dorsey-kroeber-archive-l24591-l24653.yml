canonical_text:
  quote: ''
  summary: The passage summarizes episodes in which Blue-Feather pursues Buffalo-Woman
    and their calf-child among buffalo, undergoes buffalo-imposed tests, is trampled
    after falling asleep, and is restored from a remnant of an eagle breath-feather
    through a sweat-lodge and four-arrow rite. It then begins a new abstract in which
    a man follows a woman's trail, meets her while she mends moccasins, agrees to
    marry her, crosses a river with her, and reaches a large tipi facing sunrise.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Buffalo-Woman leaves; her husband follows and brings her back, and later searches
    for her again after she gets away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Blue-Feather finds tracks of his wife and child that resemble those of a buffalo
    cow and calf, then sees buffalo herds with a cow and calf among them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Calf-Boy warns Blue-Feather that the chief bull, his grandfather, is cruel
    to strangers and leads him, with his head covered, to the main herd.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The grandfather requires Blue-Feather to identify Calf-Boy among calves that
    appear alike; Calf-Boy provides a sign involving his right ear and left foot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The grandfather orders four nights and four days of dancing; Calf-Boy is allowed
    to dance in Blue-Feather's place because Blue-Feather has only two legs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A race to a high hill and back is held; Blue-Feather ties an eagle-feather
    headdress to Calf-Boy's tail, and Calf-Boy wins while other buffalo fall down
    the hill.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The grandfather announces four days and nights of myths, tales, and stories
    that Blue-Feather must hear.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Blue-Feather falls asleep near daybreak on the third night, and buffalo walk
    over him and trample him in dust.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A cloud of dust rises to the sky, and people at the camp-circle take it as
    a sign that Blue-Feather has perished.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Birds and animals search for Blue-Feather's body; Blue-Bird finds a tiny groaning
    piece of eagle breath-feather and carries it to the camp-circle.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: People erect a sweat-lodge and place the feather remnant inside.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Blue-Feather's son by Elk-Woman uses a bow and four arrows, two black and
    two red, while calling for his father to get out of the way; the sweat-lodge moves
    and Blue-Feather comes out alive.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The next abstract begins with a man on a journey following a woman's trail,
    finding sinew and moccasin trimmings, and then seeing a woman with a painted robe
    mending moccasins.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The woman asks whether the man wished to marry her; he agrees to go home with
    her, and they cross a river to a large tipi facing sunrise.
  category: sequence
  evidence_refs:
  - ev:14
