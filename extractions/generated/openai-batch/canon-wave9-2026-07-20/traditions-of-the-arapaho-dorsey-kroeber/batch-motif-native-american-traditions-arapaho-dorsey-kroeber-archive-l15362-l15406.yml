canonical_text:
  quote: ''
  summary: A sequence of young men are accepted as sons-in-law by a girl's father
    and ordered to obtain perfectly straight arrow sticks. The first three fail to
    satisfy the father and are killed. A fourth son-in-law, after being kept from
    departing with his wife, seeks the required material while crying, reaches a lake,
    and is helped by a voice or spirit associated with the lake, who shows him the
    correct plant. The father approves the fourth man's return with the material.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man arrives, the girl prepares food for him, and her father says that
    he shall become his son-in-law.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father asks the son-in-law to obtain arrow sticks that are perfectly straight
    and without knots or branches.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first son-in-law brings hanwanuubiici sticks, but the father rejects them;
    after this happens four times, the old man kills him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A second young man is fed, called son-in-law, sent for straight sticks, brings
    na abiici, is rejected because the material has knots and branches, and is killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A third young man is received as son-in-law, brings straight smooth dogwood,
    is rejected after four outings, and is killed; the old man throws him into the
    river and feeds him to an animal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A fourth young man is given the girl as wife, wishes to continue on his way,
    but is told by the father to stay until he provides things, including arrow sticks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The fourth young man goes east, south, and back toward the river near the
    dwelling, crying until he reaches a lake.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A voice, perhaps the owner of the lake and later called a spirit, asks why
    he is crying and is told he is looking for perfectly straight arrow material.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The spirit shows the fourth young man yeiyanaxuuci, identified in the passage
    as otter weed, and says it is the kind he is seeking.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The fourth young man cuts the otter weed, takes it back, gives it to his wife
    for her father, and the father says it is the kind he wants.
  category: sequence
  evidence_refs:
  - ev:6
