canonical_text:
  quote: ''
  summary: A young man searching for his brothers is lured by an old woman at an isolated
    tipi into stepping on her back, where a spike kills him; she stakes him with earlier
    victims. His grieving sister later finds and swallows a transparent stone and
    gives birth to a rapidly growing boy named Light-Stone or Transparent-Stone. Light-Stone
    goes to seek his missing uncles, survives the old woman's same spike trap because
    his body comes from stone, crushes her, burns her body, and returns each speaking
    spark to the fire until she is ashes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man reaches a tipi by itself, and an old woman by a fire sees him,
    calls him to stop, rest, and explain where he is going.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man says he is going to another camp to look for his brothers, and
    the old woman says his brothers stopped there before going on; she asks him to
    trample on her backbone as a favor.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the young man tramples on the old woman's back, he steps on a sharp spike
    and dies instantly; she drags him inside, stakes him like others, and places waste
    tobacco in his eyes, mouth, and breast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the young man is gone, his sister weeps alone on a distant hill, finds
    a small round transparent stone, hides it in her mouth while sleeping, accidentally
    swallows it, grows in size, and gives birth to a boy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The boy grows rapidly; his mother carries him on her back while walking on
    prairie hills and weeping, and she tells him they are alone because his uncles
    went to another camp-circle and have not returned.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The boy says he will search for his uncles when older; after growing to manhood
    he makes a bow and arrows, is named Light-Stone or Transparent-Stone, and asks
    which way his uncles went.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Light-Stone starts with his bow and arrows, crosses toward the hill or divide,
    sees a creek with timber in hazy atmosphere, comes to a well-tanned tipi, and
    knows who lives there and the danger at the tipi.
  category: setting
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The old woman calls Light-Stone grandchild and asks him to tramp on her backbone;
    he first rests, then uses his bow as a cane and applies only slight pressure before
    she demands both feet.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Light-Stone steps on the sharp spike, but because his body came from the stone,
    he overpowers the sting, becomes heavy like a stone, refuses to get off, and crushes
    the old woman while saying she destroyed his uncles.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: Light-Stone piles wood by the old woman and sets fire to her; sparks from
    her body speak as they fly away, and he throws each spark back into the fire until
    the body is ashes.
  category: action
  evidence_refs:
  - ev:9
