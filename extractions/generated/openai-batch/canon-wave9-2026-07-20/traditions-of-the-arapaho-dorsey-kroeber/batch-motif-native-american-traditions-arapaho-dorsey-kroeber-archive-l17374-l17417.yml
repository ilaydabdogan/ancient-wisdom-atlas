canonical_text:
  quote: ''
  summary: After killing an animal that is revealed to have been the grandmother's
    husband, Little-star regrets the act and helps her for a time. He then leaves
    to find his relatives and the camp of his people, identifying himself as the son
    of the moon and grandson of the father and mother above. Directed westward, he
    rests on a bare hill where snakes are sleeping, kills many with his bow, and is
    then pursued by a snake that repeatedly overtakes him when he sleeps. His bow
    serves as a waking aid by falling on his head.
  language: English
  quote_policy: summarized
