canonical_text:
  quote: ''
  summary: A young man who is treated as sick or injured stays inside while other
    young men hunt. He prefers and hides smaller white intestines, feeds pieces to
    his concealed little daughter, and makes clothing for her. The daughter remains
    quiet when others are present, grows rapidly, and tries to speak. The young man
    watches the cover behind his bed and discourages others from coming near so they
    will not discover her. The hunters return with beef and intestines, eat, dry meat,
    and retire.
  language: English
  quote_policy: summarized
