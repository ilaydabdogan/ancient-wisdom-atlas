canonical_text:
  quote: ''
  summary: A son-in-law sends a hungry old man to track a wounded buffalo. The old
    man finds only frozen clotted blood and brings it home for soup. When his wife
    boils it in water over the fire, a healthy girl appears and is named Blood-Clot-Girl.
    The child is wrapped in buffalo-hide remnants associated with ritual hides and
    later goes to request a small piece of dried tenderloin from her sister while
    the sister’s husband is away.
  language: English
  quote_policy: summarized
