canonical_text:
  quote: "“As soon as I had done it, this little girl came out.”"
  summary: A sick young man with a swollen foot remains behind while the other young
    men hunt. He presents a daughter, saying she came out when he pierced his abscess
    with a thorn. The young men accept her as their daughter. She grows into a woman;
    Splinter-Foot changes the shelter-tipi into a furnished tipi. Before another hunt,
    the father warns her not to respond to an outside shinny-ball game or to a ball
    entering the tipi.
  language: English
  quote_policy: quoted
