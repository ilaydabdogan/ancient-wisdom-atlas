canonical_text:
  quote: ''
  summary: Lone-Bull repeatedly sends his grandchild, the boy/Calf-Boy, to the boy's
    father to ask what he should have for several body parts. The father supplies
    cottonwood bark for the stomach, sunflower pith for spinal marrow, cottonwood
    pith for tallow or fat, two bear's ears for ears, and a rattle for arm muscles.
    The boy carries each item back to Lone-Bull, who thanks him and shows small bodily
    responses. At the end of the excerpt, Lone-Bull asks the boy to inquire what he
    should have for his hair.
  language: English
  quote_policy: summarized
