canonical_text:
  quote: The tree stretched until at last it reached the sky, and the sky opened
  summary: The passage gives overlapping versions of a woman lured by a porcupine
    up a growing cottonwood into the sky, where she is married by a luminary, identified
    as the sun in the main account and the moon in an embedded variant. She discovers
    the earth below, attempts to descend by a sinew rope, is killed by a stone dropped
    from above, and her son survives, is found in the grass, and is named Found-in-grass.
    The excerpt also begins a separate tale in which a husband warns his pregnant
    wife to ignore a tempting caller while he hunts.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Women who had gone out to get wood found and chased a porcupine; it ran up
    a cottonwood tree, and one woman climbed after it while the others watched.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: As the woman climbed, the tree stretched to the sky, the sky opened, and the
    porcupine and woman entered.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the sky or timber, the woman found a handsome young man identified as the
    sun, who took her for his wife.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The moon is described as envious of the sun and speaks about the sun having
    brought an earthly woman up; in the embedded parallel version, the moon comes
    to the woman and marries her.
  category: speech
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:5
  text: 'The woman has or carries a child: the main account has her child present
    during the escape attempt, while the embedded version says she was with child
    when killed and the boy was born afterward.'
  category: sequence
  evidence_refs:
  - ev:4
  - ev:7
  - ev:8
- id: obs:6
  text: The sun and moon hunt and provide for the sisters and the woman; the sisters
    of the sun go out to dig roots, but the woman is forbidden to go with them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The woman secretly goes out with her child to dig roots; the soil gives way
    and she sees the earth below, including rivers, tent circles, and people walking
    about.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The woman gathers sinew, makes a longer rope, ties it to a digging stick across
    the hole, and lets herself down with her boy; the rope is too short and she hangs
    above the earth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Those above search for the woman and find the stick and rope at the hole;
    the sun drops a flat pounding stone after saying it should fall on the woman and
    not on the boy.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The dropped stone kills the woman; in the main account, the boy is not hurt
    and remains near his mother.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The boy is found among grasses and weeds by people passing by, and he is called
    Blaxuyan, translated as Found-in-grass; other printed names are given as Porcupine’s
    son and Sun-child.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The beginning of the next tale describes a man and pregnant wife camped alone
    by a river; the husband warns her to stay inside and ignore anyone who calls to
    tempt her while he hunts, and she ignores an unseen voice that calls to her.
  category: sequence
  evidence_refs:
  - ev:10
