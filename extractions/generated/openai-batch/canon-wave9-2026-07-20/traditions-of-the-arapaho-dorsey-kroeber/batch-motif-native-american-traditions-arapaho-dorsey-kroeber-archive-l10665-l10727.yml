canonical_text:
  quote: ''
  summary: While her husband, the elder brother, is away hunting, a woman repeatedly
    asks her brother-in-law to have sexual relations with her. The younger man refuses
    because of loyalty to his brother and withdraws to a hill. The woman digs a concealed
    hole beneath his bed; when he returns, he falls in, and she covers the hole and
    remakes the bed. She tells her husband that the younger brother has gone traveling,
    and when faint shouting is heard, she says it is a spleen cooking on the fire.
    At the camp, the younger brother has not arrived. The elder brother goes to a
    mountain to cry; the woman also cries and says aloud that she caused her brother-in-law
    to fall into a hole. Young men overhear her. The passage ends as a young wolverine
    comes to the place where the three people had been.
  language: English with one Latin sentence
  quote_policy: summarized
