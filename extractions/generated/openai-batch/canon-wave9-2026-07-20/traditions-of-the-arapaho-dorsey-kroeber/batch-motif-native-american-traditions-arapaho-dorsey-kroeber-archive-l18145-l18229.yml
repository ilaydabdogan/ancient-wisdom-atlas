canonical_text:
  quote: The mother came out of the sweat-lodge alive again.
  summary: A husband returns to find his wife unresponsive with her belly cut open,
    mourns her, and discovers twin boys playing with arrows in the tipi. He catches
    By-the-Door and, with By-the-Door's help, catches Spring-Boy, who had taken refuge
    in a spring. The boys ask for bows and arrows and have their mother placed in
    a sweat-lodge; after they shoot black and red arrows above it, she comes out alive
    again. The father then warns the boys not to go to a nearby thick timber where
    a cruel being lives.
  language: English
  quote_policy: quoted
