- id: obs:10
  text: In “The Cannibal Babe,” three chiefs disappear from the camp-circle on three
    successive nights, leaving their clothes behind.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The mother notices meat or flesh between the sleeping baby’s teeth, then observes
    the baby feign sleep, step over its parents like a grown person, leave the dwelling,
    and later return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The people discover that the child carries chiefs to a hollow tree, devours
