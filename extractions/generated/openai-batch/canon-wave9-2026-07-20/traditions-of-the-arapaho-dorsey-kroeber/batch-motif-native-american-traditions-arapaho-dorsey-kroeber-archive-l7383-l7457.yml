canonical_text:
  quote: ''
  summary: The passage first concludes an episode in which a person presented as a
    woman is suspected because of unusual legs, marries a young man, kills a brother-in-law
    while lousing him, flees, and is sheltered by an old woman in an iron tent whose
    falling door kills the pursuers. The fugitive returns to a mourning family and
    gives hair for ropes. An editorial footnote compares the episode with other cases
    of marriage to a disguised man. The next tale, “The Cannibal Babe,” describes
    a baby revealed as a supernatural man-eater after chiefs disappear; the child
    devours victims at a hollow tree, returns after being abandoned, and cannot be
    killed by attempts to feed it to dogs.
  language: English
  quote_policy: summarized
