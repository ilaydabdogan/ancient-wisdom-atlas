- id: obs:4
  text: The fleeing figure reaches an old woman’s tent described as entirely of iron,
    runs around it four times, and is admitted when the door opens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The pursuers demand their food from the old woman; she tells them to put their
    heads into the doorway, and the descending door cuts off their heads.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Many bones lie outside the iron tent, and the old woman is described as powerful
