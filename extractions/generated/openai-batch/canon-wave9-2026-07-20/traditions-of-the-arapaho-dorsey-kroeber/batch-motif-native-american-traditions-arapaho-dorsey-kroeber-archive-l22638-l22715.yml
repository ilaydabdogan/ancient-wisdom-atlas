canonical_text:
  quote: ''
  summary: The passage contains abstracts involving Sleepy-Young-Man or a young man
    who infiltrates cannibals or beheaded ones, kills and beheads one, escapes to
    an iron tipi or tent whose door kills the pursuers, and returns with scalps; a
    cannibal infant that survives attempted disposal; and a woman who drowns at the
    Platte River, is taken to a water-being lodge, has intercourse with the river
    owner, and receives restrictions, offerings, prayers, and river-cleansing instructions.
  language: English
