canonical_text:
  quote: ''
  summary: An Arapaho origin myth fragment describes an initial world of water, a
    fasting Father on a tripod or flat pipe, water animals diving for mud, the making
    of earth, rivers, and mountains from clay, the creation of sun, moon, first humans,
    vegetation, animals, seasonal order, lodges, and later decisions about sexual
    differentiation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the beginning there was only water, except for water-fowls; Grandfather
    saw the Father or flat pipe floating on the water on four sticks or a tripod,
    fasting, weeping, and crying, and took mercy on him.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Father called the water-fowls and asked those able to dive to search the
    sea bottom for dirt.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The birds came in rotation according to size, dived, and came out dead.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The duck volunteered despite timidity, dived for days and nights, returned
    with mud stuck to its claws, and the Father removed the mud and put it on his
    pipe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The turtle volunteered, dived for a long time, returned with its feet closed
    together, and the Father removed mud from its four feet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Father combined the clay, spread it thin, dried it, blew pieces toward
    the northeast, southeast, northwest, and southwest, swung what remained, and commanded
    the earth to come.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Father used a rod to make motions over the waters for rivers, and where
    the dirt was thickest he caused mountains.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the earth was made it was barren; the Father made the sun and moon to
    represent man and woman, then made clay images of a man and a woman to inhabit
    the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After making the sun, moon, and two people, the Father caused trees, grass,
    vegetation, animals, beasts, and birds to live.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The first man and woman are described as identical and virtuous, without sexual
    connection at that time; day and night, the seasons, summer and winter, and new
    and old grass were commanded.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Several lodges were commanded into being, including Willow, Thunder-bird,
    Club-Board, Buffalo Women’s, Sweat, Lime-Crazy, Dog-Soldier, and Old Men’s lodges;
    the Sweat lodge is said to be the oldest.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Father assigned genital organs for male and female beasts and fowls, deferred
    the human arrangement, and told the man and woman that lodges or commands should
    be made up of birds, beasts, paints, and fruits, while animals should not belong
    to the lodges.
  category: speech
  evidence_refs:
  - ev:6
