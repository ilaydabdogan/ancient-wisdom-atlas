canonical_text:
  quote: ''
  summary: The supplied range contains an abstract in which a family receives dead
    game from an unseen being that later pursues them as a rolling skull, is stopped
    by wished obstacles, and is buried in a closing canyon; the daughter links this
    to burial after death. The range also contains two brief versions of 'The Deceived
    Blind Man,' in which a wife withholds buffalo meat from her blind husband until
    an owl reveals the deception and restores his sight, after which the wife dies
    by his retaliation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man, his wife, and their daughter are by a river, and the daughter regularly
    goes for water.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the father says there is no more food, the daughter finds successive
    dead animals, and the family uses them for meat and hides.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A voice comes at night, says it has brought a burden, and leaves dead animals
    at the tipi door on multiple nights.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The household becomes well supplied with meat, and the father becomes suspicious
    after hearing the voice repeatedly.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father looks through a hole and sees a white-looking object jump into
    the timber; he tells the daughter they should leave.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The daughter makes four pairs of moccasins and places them at different places
    inside the tipi before the family flees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The strange object returns, sees an untouched elk, enters or circles the tipi,
    and is repeatedly called back by pairs of moccasins crying like persons.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The pursuing being is described as a skull rolling after the father, mother,
    and daughter.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The daughter wishes for obstacles behind the family, and thistles, timber,
    cacti, and then a deep canyon appear in sequence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The skull leaps toward the daughter, falls into the canyon, and is buried
    when the canyon closes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The family reaches a large circle of tipis and tells the people what happened.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The daughter says that this is the way people will be placed in the ground
    when they die.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the blind-man abstract, the husband relies on his wife to aim his bow and
    tell him when to shoot at a buffalo.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The wife tells the blind man that he missed the vital spot, but she secretly
    takes meat and hide from the dead buffalo and eats fat meat away from him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The wife gives the husband tomatoes and tells him to be thankful, while concealing
    the smell of meat by washing at a buffalo-wallow and explaining the odor as sweat.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:16
  text: An owl lands on the tipi pole, tells the blind man that he killed the buffalo
    and that his wife is eating the meat alone, and instructs him to look at the owl's
    eyes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: The blind man's eyesight is restored, but his eyes are described as like an
    owl's eyes.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:18
  text: One version says the restored-sight man shoots his wife dead; another says
    he forces her to eat the withheld food until she dies.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
