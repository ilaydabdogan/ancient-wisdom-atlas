canonical_text:
  quote: ''
  summary: A first-person Arapaho narrator recounts going to trade across the high
    Platte River, being taken under the water, meeting turtle and beaver men, entering
    a painted tipi of water beings, having intercourse with a red-painted river owner,
    and receiving instructions about fish and bathing before others enter the water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Northern Arapaho are described as living along the Platte River, where
    friendly tribes including the Crow came to trade skins and furs.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator takes beads and other articles, mounts a small pony, and intends
    to cross the Platte River to obtain elk skin.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The Platte River is described as high, dangerous, and swift when the narrator
    enters it on the pony.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the middle of the channel the pony is swimming and weakening, and the water
    takes the narrator and pony out of sight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After going under the water, the narrator finds herself standing on dry sand
    with dry clothes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Two young men appear on the sand-bar; the passage identifies them as a soft-shell
    turtle and a beaver.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The two young men say they came after the young woman and want her to come
    along; she follows them along a dry river bed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The group comes to a black painted tipi decorated with two water monsters,
    a red sun disk, a green half-moon, and eagle feathers tied to the tipi pole.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Inside the tipi the narrator is welcomed and told to sit with a man in the
    center.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The central man is described as a beautiful young man, naked and painted all
    in red, with other young men sitting nearby.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Medicine bags, small bags of medicine roots, herbs, and weeds are placed in
    front of the men.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The central man says he was charmed by the narrator's appearance and sent
    two young men after her.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The central man asks for intercourse if the narrator wants to see her people
    again, and says he will tell her about himself, his power, and his place.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The men in the tipi are associated with animal families, including Beaver
    and Otter; lizards, frogs, turtles, fishes, snakes, and other water animals are
    also named.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The men turn into animals and look at the narrator in a reverent mood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: After intercourse, the central man tells the narrator that he is the owner
    of rivers and lives where water is deep against steep banks.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: The central man says others of his kind may be found at springs and small
    lakes.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:18
  text: The central man instructs the narrator not to eat fish and says that when
    bathing with companions she must enter and bathe first, or the companions may
    drown.
  category: speech
  evidence_refs:
  - ev:8
