canonical_text:
  quote: ''
  summary: A husband repeatedly sends his wife to tend their horse herd, especially
    to approach and handle a red-speckled horse near their tipi. The horse repeatedly
    behaves like a stallion when the wife approaches; she rebukes it and calls it
    foolish or crazy. The wife drives, stakes, and releases the stock, rides a gentle
    mare, returns tired from managing the herd, and the couple’s large herd is admired
    by people at the camp-circle.
  language: English
  quote_policy: summarized
