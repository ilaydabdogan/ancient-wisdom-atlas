canonical_text:
  quote: ''
  summary: The passage summarizes the end of a Blood-Clot-Boy episode in which White-Owl
    creates a storm, challenges Blood-Clot-Boy with questions and demonstrations of
    power, receives magically produced food, and grants him long life. It then gives
    an abstract of Blood-Clot-Girl, in which an abused old man finds a clot of blood
    that becomes a girl who marries a chief's son, and begins a second Blood-Clot-Girl
    version involving two tipis, dependence on a cruel son-in-law, and a buffalo cow.
  language: English
  quote_policy: summarized
