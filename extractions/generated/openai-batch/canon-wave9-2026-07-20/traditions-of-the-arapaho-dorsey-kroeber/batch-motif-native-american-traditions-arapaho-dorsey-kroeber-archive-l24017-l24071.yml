- id: obs:1
  text: White-Owl flies toward Blood-Clot-Boy during severe wind and snow, produces
    more storm, alights before him, speaks of his power, and challenges him to an
    exhibition of power with loss of life as the penalty for failing to answer correctly.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Blood-Clot-Boy answers White-Owl's questions about where he came from, useful
    bodily faculties, benefactors, and sacred things identified as day, night, and
    earth.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Blood-Clot-Boy answers further questions with items including eyesight, an
    eagle breath-feather, tipi pegs, eyelids, and buffalo meat, and he describes how
    to trap eagles for feathers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Blood-Clot-Boy makes fire using flint, stone, dry pith, grass, and dry wood.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Blood-Clot-Boy holds cottonwood bark and a cottonwood log over the fire, and
    these become roasted tenderloin, tallow, and fat; later buffalo chips roast like
    turkeys and pemmican for White-Owl to eat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After White-Owl keeps asking for more food, Blood-Clot-Boy asks for return
    treatment; White-Owl asks about making a knife and then grants Blood-Clot-Boy
    life up to White-Owl's own time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Blood-Clot-Girl abstract, a man abuses his old father-in-law; the old
    man finds a clot of blood, which becomes a girl.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The son-in-law wishes to marry the girl but is refused; the old man joins
    the tribe; the chief's son marries the girl.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The old man's wife makes an ornamented tent by sitting on skins, and Clot-woman
    and her husband live in it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The opening of another Blood-Clot-Girl version places two tipis in a river
