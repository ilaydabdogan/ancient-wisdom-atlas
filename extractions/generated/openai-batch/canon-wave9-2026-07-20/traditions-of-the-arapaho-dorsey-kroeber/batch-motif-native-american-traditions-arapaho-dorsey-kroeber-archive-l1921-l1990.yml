canonical_text:
  quote: ''
  summary: Lime-Crazy sends his sister-in-law to announce his return to the dancers,
    who insult and strike her with heated tallow. Lime-Crazy then enters with a club-board,
    commands the men to sit by the fire, and has his sister-in-law strike their shin
    bones as return for their treatment of her. The next morning he directs her and
    Big-Chief to obtain goods, ponies, food, and assistance, after which they live
    well and are respected, though some prejudice against Lime-Crazy remains. Later
    three young men persuade Lime-Crazy to hunt across a river, use eagle nests as
    a pretext, secretly return to the boat, cross back, and leave him behind.
  language: English
  quote_policy: summarized
