canonical_text:
  quote: ''
  summary: A powerful animated rock demands a girl as wife through the hummingbird.
    The hummingbird advises that the mole and badger can help, and the girl is taken
    to the rock's tent. The mole and badger dig an underground trap, the girl escapes,
    and she returns to her fathers. The group flees while the rock pursues; a canyon
    delays him. The girl uses a ball to raise her fathers and herself upward, reaches
    the sky, decrees that the rock will remain among hills and no longer trouble people,
    and lives with her fathers in a star-covered tent.
  language: English
  quote_policy: summarized
