canonical_text:
  quote: ''
  summary: Seven young men leave a camp-circle near a river. One develops a swollen
    foot after stepping on a thorn, lances the sore, and a baby girl emerges. The
    men raise her as their daughter. After being warned not to attend or look toward
    a shinny game, she is drawn out by the game ball and becomes the wife of Buffalo-Bull,
    leader of the herd. Gopher later tunnels to her, helps her escape by leaving her
    robe as a decoy, and brings her back. Buffalo-Bull and the herd pursue; the young
    men and the girl take refuge in a tree. Buffalo-Bull becomes trapped while charging
    the tree, is killed with a knife, and his body is burned to ashes.
  language: English
  quote_policy: summarized
