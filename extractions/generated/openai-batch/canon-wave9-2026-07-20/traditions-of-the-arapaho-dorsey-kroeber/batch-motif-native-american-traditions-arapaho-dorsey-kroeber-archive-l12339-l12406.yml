- id: obs:4
  text: The father says he and his wife watched the child leave his cradle, go to
    a chief's tipi, carry the remnant of a man to the river, climb a cottonwood snag,
    and drop the body into a hole in the snag.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The assembled men say nothing for a time, then leave the punishment of the
