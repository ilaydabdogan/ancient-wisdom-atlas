canonical_text:
  quote: When Raw-Gums lighted on the ground, he became a young man, wearing his remnant
    buffalo robe, and began to dance around the circle
  summary: After Raw-Gums is suspected of killing chiefs and hiding their remains
    in a hollow cottonwood near the river, his father consults the men of the camp.
    The men leave punishment to the father, who wraps the child in tripe fat, throws
    him outside, and calls dogs. Raw-Gums lands as a young man, dances and sings about
    skeletons. Bereaved families cut down the cottonwood, find the chiefs' skeletons,
    and the people break camp.
  language: English
  quote_policy: quoted
