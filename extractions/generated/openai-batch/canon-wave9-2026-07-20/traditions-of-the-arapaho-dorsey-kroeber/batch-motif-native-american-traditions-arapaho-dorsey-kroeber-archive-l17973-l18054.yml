canonical_text:
  quote: ''
  summary: Crow-Woman repeatedly tries to shame her younger sister’s young husband,
    Found-in-Grass, by wetting the bedding and falsely accusing him of urination.
    Found-in-Grass increasingly appears as an impressive young man and hunter. He
    instructs that buffalo chips be arranged in a corral and speaks of shooting one
    so the others will come alive and be slaughtered. After a hunt, Crow-Woman tries
    to involve herself with him and carry a bag of blood; Found-in-Grass secretly
    punctures it so that it spoils her robe, and she is mocked and later cries on
    the prairie.
  language: English
  quote_policy: summarized
