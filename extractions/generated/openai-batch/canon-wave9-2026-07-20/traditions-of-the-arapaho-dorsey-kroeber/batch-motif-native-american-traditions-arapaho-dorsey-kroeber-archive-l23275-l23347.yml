canonical_text:
  quote: ''
  summary: A beautiful young woman who refuses marriage is persistently followed by
    White-Dog, who enters her tipi at night and reveals himself as a man in a white
    robe. After she marks and later wounds him, he returns to his own camp. She gives
    birth to seven white puppies, orders them drowned, but her younger brother secretly
    shelters and feeds them at a cottonwood by the river. The puppies become boys,
    are taken by their father, and receive clothing from his parents. Later White-Dog
    and the seven boys rescue an abused dog and lead all dogs away; after negotiation,
    the dogs return to live with people and are fed better.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man, wife, daughter, and young boy live in a large camp-circle; the daughter
    is described as beautiful, has a separate tipi, and rejects many young male suitors.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: White-Dog stays close to the daughter's tipi, follows her to the river and
    while she gathers wood, and is not driven away by her attempts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At night the dog lies on the daughter's bed; later a man wearing a white robe
    enters, lies beside her, and says that he has been sleeping with her and is White-Dog.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman marks the back of the man's white robe with a painted hand, later
    sees a dog with the finger-mark, and strikes the dog on the ear with a stone,
    drawing blood.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: White-Dog returns to another camp-circle, tells his parents that he was married
    and his wife struck his ear, and asks them to make seven pairs of moccasins, leggings,
    and shirts.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The daughter becomes sick and gives birth to seven white puppies, then tells
    her brother to put them in a bag and drown them in the river.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brother does not drown the puppies; he stops at an old cottonwood tree,
    makes a bark shelter, places the puppies inside, and secretly brings them food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the brother returns, the puppies have changed into seven boys, but they
    become puppies again when they go back to the shelter; later, in the tipi, they
    appear as seven bright-looking youths.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The father takes the children toward his parents' camp-circle; when the mother
    asks for the oldest boy, he gives her a leg bone instead, and his parents give
    the boys prepared clothing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: An abused dog that has been whipped for stealing fat meat asks to be free
    from a cruel master; White-Dog and the seven boys help the dog carry puppies away,
    and White-Dog howls so that all dogs come to him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: People send spies and envoys to the dogs' camp by the river; after the cause
    of the dogs' leaving is explained, people and dogs return to the camp with friendly
    feelings.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: On a hunt, a mother gives a fat piece of meat to the dog and then to all other
    dogs, after which the passage says dogs remain with people to the present.
  category: action
  evidence_refs:
  - ev:8
