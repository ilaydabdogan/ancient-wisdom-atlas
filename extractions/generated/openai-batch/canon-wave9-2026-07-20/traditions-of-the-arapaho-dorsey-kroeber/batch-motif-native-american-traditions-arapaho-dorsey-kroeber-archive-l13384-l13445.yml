- id: obs:2
  text: The wife instructs the husband to bring in a gentle mare that she had ridden
    before, then saddles and rides the mare away in the same direction.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife returns over the divide through a ravine, followed by a golden-speckled
    horse and the red-speckled horse.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wife tells the husband that the returned horse is gentle and can be bridled
    and used.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The husband lassoes, bridles, mounts, and rides the new horse through the
    camp-circle without trouble.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: People in the camp speculate about how the husband obtains fine horses and
    suggest possibilities including good stock, voluntary joining, or mustangs.
  category: speech
  evidence_refs:
  - ev:3
