canonical_text:
  quote: ''
  summary: A husband repeatedly wishes for distinctively colored horses. Each time,
    his wife has him bring in a gentle mare, rides away, returns over the divide through
    a ravine with new horses, and gives the desired horse to him. He rides the new
    horses around the camp-circle, while people comment on his growing herd and speculate
    about its source.
  language: English
  quote_policy: summarized
