  text: The wife tells the husband to watch the same place for her arrival before
    she departs on the mare.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The wife returns over the divide through the ravine with two horses, one of
    them the red-speckled horse, and tells the husband to lasso the gentle horse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The husband thanks and embraces his wife, mounts the dapple-gray horse, rides
