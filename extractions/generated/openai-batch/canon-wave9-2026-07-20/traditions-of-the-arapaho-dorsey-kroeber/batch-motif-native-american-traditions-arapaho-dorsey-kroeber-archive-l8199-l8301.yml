canonical_text:
  quote: ''
  summary: The passage contains the end of a snake narrative in which a snake remains
    in deep river water and promises safe crossing if remembered with intestines thrown
    into the river; the editors note a Pawnee parallel. It then gives the tale of
    a woman struck by reflected rays at a river who bears beaver-like children, later
    has a human son who drowns, and is said to have been affected by beaver restrictions
    or bewitchment. The passage ends with the beginning of a bear narrative in which
    Bear destroys a camp, keeps one girl as servant, and the returning war-party secretly
    helps her explain a rabbit to Bear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A snake says it will stay in deep water by a rocky bank and asks that its
    people be told the place.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The snake instructs that intestines be thrown into the river area in remembrance
    of it when people wish to cross, and says it will see that they cross safely.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The snake enters the river and remains there; an editorial note says the snake's
    movements indicate creeks or rivers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An editorial note says the snake narrative was told by Black-Horse and is
    also found among the Pawnee.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two recently married women go early in the morning to the river for water
    near a steep precipice and a deep hole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When one woman dips her vessel, streaks of reflected sun rays from the deepest
    place across the river strike her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The companion interprets the event as a wrong done by a bad spirit, advises
    returning without water, and later avoids dipping her own vessel.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The struck woman keeps the water, saying she felt no contact and feared her
    husband might accuse her of infidelity if she returned without water.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The woman later announces her first pregnancy to her mother and is cared for
    according to custom.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The companion is summoned during the difficult birth, makes a tea of weeds,
    gives it to the woman, and has others make her vomit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The woman gives birth to a beaver-like baby with a flat stiff body, beaver-like
    claws, a small flat tail, and human-like skin; it breathes briefly and dies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At another birth the woman has another beaver-like child, this time without
    a tail, and sweat-lodges are erected for her purification from troublesome animals.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Years later on the Wind River, the woman gives birth to a human boy who grows,
    goes to school, and later drowns while swimming in the high swift river.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The narration says restrictions might have been placed on the woman by the
    beaver and might have been disobeyed, and that the beaver bewitched her at the
    start but later gave her a real boy.
  category: other
  evidence_refs:
  - ev:9
- id: obs:15
  text: A note says many medicine-men follow beavers in their doctoring; the tale
