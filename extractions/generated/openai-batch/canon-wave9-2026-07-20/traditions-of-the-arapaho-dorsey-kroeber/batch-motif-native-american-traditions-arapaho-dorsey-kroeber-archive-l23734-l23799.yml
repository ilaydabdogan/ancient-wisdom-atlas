  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In “Split-Feather,” a beautiful young husband is jealous of his wife because
    of a young man connected with the Star society.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The husband splits a feather, takes medicine from a medicine bag tied to his
