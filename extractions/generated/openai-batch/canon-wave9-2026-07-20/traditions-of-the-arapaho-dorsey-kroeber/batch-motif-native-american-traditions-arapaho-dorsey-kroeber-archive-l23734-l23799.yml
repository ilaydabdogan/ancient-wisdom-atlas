canonical_text:
  quote: ''
  summary: The passage gives an abstract of a story in which brothers seek the owners
    of moon-shells, marry them, are killed in an enemy attack, and are restored to
    life by the youngest brother using a bow, black and red arrows, and a sweat-lodge.
    It then gives the abstract of “Split-Feather,” in which a jealous husband uses
    split-feather medicine to bind his wife and her lover until compensation and a
    peace-pipe lead him to release them. The final line is only the next title, “Spitting-Horn-Shell
    and Split-Rump.”
  language: English
  quote_policy: summarized
