canonical_text:
  quote: ''
  summary: The passage contains several Nih’ancan narratives and editorial notes.
    In one account, Nih’ancan asks a mouse to carry his male organ across a river
    to a woman-like target; after repeated attempts it enters a closing water shell
    and is cut off, causing his death. In No. 30, he seeks animal help to send the
    organ across a river to a beautiful virgin; a bird carries it, the woman cries
    out, people mistake the long object for a serpent, trace it back to Nih’ancan,
    cut it off, and he dies. In No. 31, he sends the organ to a chief’s daughter in
    a tipi; her parents discover it by firelight and cut it up, explaining why men
    thereafter have short organs. Notes compare related elements to another version,
    Gros Ventre material, and Pawnee tales.
  language: English with Latin passages
  quote_policy: summarized
