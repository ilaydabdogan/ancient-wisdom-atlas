    touching her; the people see a large, long serpent-like object on the ground.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The people trace the object to Nih’ancan, hold the organ while he tries to
    escape, cut it off, and Nih’ancan dies as blood spurts out.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In No. 31, Nih’ancan reaches a camp-circle, sees a beautiful chief’s daughter
    wearing an elk-tooth dress, goes to a hill, and instructs his organ to go to the
    chief’s tipi.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: In No. 31, the organ crawls slowly to the tipi; the girl cries out and rises
    from bed; her parents light a fire, see the organ, and cut it into pieces.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: No. 31 ends with an etiological statement that after the organ was cut, it
