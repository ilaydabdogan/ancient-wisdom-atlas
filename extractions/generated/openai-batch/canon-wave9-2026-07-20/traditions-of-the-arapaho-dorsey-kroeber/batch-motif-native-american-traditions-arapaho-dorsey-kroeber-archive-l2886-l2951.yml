canonical_text:
  quote: ''
  summary: A changed and industrious man receives from his wife a large wrapped pemmican
    bundle, carries it to the camp that had deserted his poor family, feeds the starving
    people with an apparently undiminishing supply, and directs the whole camp to
    follow him to his home near high mountains and a creek. On the journey, buffalo
    herds stand in the way and then part for the people. A new camp-circle is formed,
    and the wife distributes dried meat while buffalo surround the camp.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man is described as changed in heart and mind, industrious, and absent
    each day looking for something.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife prepares pemmican from buffalo bones, tallow, and finely beaten meat,
    wraps it tightly in buffalo intestine lining, and gives it to her husband.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man carries the pemmican bundle on his back, travels until he reaches
    the big camp-circle, asks for the chief’s tipi, and enters it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief asks that the people be called to eat the pemmican brought by the
    man who had been left behind because he was very poor.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The starving people come to eat the pemmican; as they take cakes from it,
    it retains its original size and remains plentiful.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The man says he must return home and wants the whole camp to follow him to
    his tipi at the foot of high mountains along a creek bottom.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The camp-circle breaks up and follows the man’s trail toward the country of
    plenty.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The people see buffalo herds on the bottoms, mountain sides, and hills; the
    herds stand in the way and then part to make a passage.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The people form a new camp-circle with all tipis facing the sunrise and the
    man’s tipi in the center.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The wife welcomes visitors, gives them dried meat, smiles, and asks them to
    come again.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Buffalo herds are seen all around the new camp, grazing on short grass and
