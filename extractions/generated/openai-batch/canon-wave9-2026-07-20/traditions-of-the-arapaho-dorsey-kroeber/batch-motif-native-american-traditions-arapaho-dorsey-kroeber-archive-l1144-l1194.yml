canonical_text:
  quote: ''
  summary: A being named hiintcabiit raises Beaver-foot's sister toward view but is
    speared, throwing her to the bank. Beaver-foot places her in a sweat-house, calls
    four times, and she comes out alive; she, Beaver-foot, and the child purify themselves.
    Later River-woman drowns Crow-woman in a pool and offers her as food to an addressed
    grandfather; the husband outwardly accepts this but mourns. When waters rise,
    Beaver-foot sends the group to the highest mountain, moves the tent to the peak,
    applies black, yellow, white, and red paints to limbs, stretches limbs in four
    directions, and the waters retreat. Land reappears, aquatic animals remain, and
    Beaver-foot explains that those places will become springs, rivers, streams, and
    lakes.
  language: English
  quote_policy: summarized
