canonical_text:
  quote: ''
  summary: A wealthy unmarried woman refuses all suitors. A white-robed young man
    comes to her at night, and she marks his back with paint. The next day she sees
    a white dog bearing the painted hand mark and strikes it with an axe. She becomes
    pregnant and gives birth to dog-children, who later leave. She follows their tracks,
    which change from dog tracks to human tracks, and reaches a red tent where the
    children call a red-robed man their father. The man is later identified as the
    Sun and as the white dog. The ending says it is not known whether the woman returns
    with a child or alone.
  language: English
  quote_policy: summarized
