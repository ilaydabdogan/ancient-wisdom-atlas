canonical_text:
  quote: ''
  summary: In the Arapaho tale “Badger-Woman,” a wife repeatedly solicits her husband’s
    younger brother while the husband is away hunting. The younger brother refuses
    and avoids her by spending days on a hill. Angered, she digs a concealed pit under
    his bed; he falls in, and she buries him alive. The husband searches and mourns,
    while she conceals the act through false mourning. After seven to ten days, Gray-Wolf
    summons wolves and coyotes, who dig the man out, feed him, restore his strength,
    locate his home, and return him to his relatives.
  language: English
  quote_policy: summarized
