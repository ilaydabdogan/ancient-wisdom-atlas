canonical_text:
  quote: There is no barking of dogs, neither is there a dog in sight.
  summary: A man with knowledge of dogs sends his oldest son to investigate a mother
    dog's pitiful cry. The mother dog says she has been starved and whipped after
    stealing meat, and asks to be freed from her master. The man approves a night
    escape to a river beyond the divide. He and his seven boys carry the puppies away,
    summon other dogs with a long cry, and lead all the dogs across the river and
    divide to a new place. In the morning the camp discovers the dogs are gone, sends
    trackers, and two young men find the dogs healthy near a tipi in timber by the
    river.
  language: English
  quote_policy: quoted
