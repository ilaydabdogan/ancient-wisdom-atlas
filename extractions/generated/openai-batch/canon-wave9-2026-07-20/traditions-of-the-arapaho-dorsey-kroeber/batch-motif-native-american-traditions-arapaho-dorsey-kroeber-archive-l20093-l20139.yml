canonical_text:
  quote: ''
  summary: Blue-bird follows his wife and child across successive ridges and buffalo
    herds. The child, described as a calf and as Blue-bird's son, meets him, acknowledges
    him, and asks a grandfather among the buffalo whether he may go back with his
    father. The grandfather invites Blue-bird as a relative and announces that a race
    against the herd will decide whether Blue-bird may take the boy back. The buffalo
    assemble, and the boy offers to run for his two-legged father.
  language: English
  quote_policy: summarized
