canonical_text:
  quote: ''
  summary: A husband confronts his wife about a hidden shameful connection with his
    red-speckled horse. In anger he shoots the horse dead at sunset. The next morning
    the whole herd is gone except the dead horse, and the wife says the dead horse
    has taken the herd away because of the husband's injustice. The husband begs his
    wife to apologize to the horse and ask for the herd's return; she says she will
    go out and wake him.
  language: English
