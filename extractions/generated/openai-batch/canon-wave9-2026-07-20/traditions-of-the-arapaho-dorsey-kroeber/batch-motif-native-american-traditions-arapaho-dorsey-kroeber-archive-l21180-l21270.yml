canonical_text:
  quote: ''
  summary: In a repeated errand sequence, Lone-Bull asks a boy to ask the boy’s father
    what should serve for various body parts. The father supplies specific natural
    or cultural objects for each part, and the boy carries them back to Lone-Bull,
    who thanks him.
  language: English
  quote_policy: summarized
