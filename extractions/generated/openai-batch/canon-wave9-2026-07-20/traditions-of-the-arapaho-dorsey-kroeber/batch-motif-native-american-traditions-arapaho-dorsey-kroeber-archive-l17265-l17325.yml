canonical_text:
  quote: ''
  summary: A woman in an upper place bears a boy, while buffalo have been taken up
    from earth and people below are starving. Warned not to dig withered hiangtcein
    roots, she eventually digs one and discovers a hole through which she sees earth.
    She later returns with digging sticks, sinew, and her child, enlarges the hole,
    and lowers herself by a sinew rope. The rope is too short, and she hangs above
    the ground. Her husband, identified in the passage as the moon, finds her and
    drops a stone so the rope breaks, asking that the child not be hurt. The woman
    and child fall near a river; the boy is unharmed, and an old woman nearby hears
    a child crying.
  language: English
  quote_policy: summarized
