canonical_text:
  quote: ''
  summary: A beautiful daughter discovers that a skull emerging from ice is feeding
    her family with animals in order to eat them later. She and her parents flee as
    geese, using clothing decoys and wished-for obstacles, but the skull swallows
    the dog and parents. A man with an inside-out robe and an oak bow destroys the
    skull and revives the swallowed kin after the girl promises to become his wife.
    At his river home, the older wife tries to drown the girl but is drowned instead.
    Later the girl warns the man not to reuse arrows on the same game; he violates
    the warning while hunting prairie chickens, and a whirlwind carries him up and
    away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man has a beautiful daughter who goes for water every morning and finds
    an antelope or other animal lying by the trail, which she can kill with her spoon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father questions who is providing the animals, saying she could not kill
    them alone with a spoon.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The girl hides in a hole by steep banks near the water; toward morning the
    ice cracks and a skull emerges.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The skull vomits a black round object identified by the girl as an old buffalo
    and says the people must now be fattened and that it will soon eat them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The girl proposes escape by transformation; after considering eagles, hawks,
    and geese, she, her father, and her mother flee as geese, leaving clothes lying
    in their shapes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The skull swallows the empty clothes and is called back four times by the
    clothes imitating the people's voices while the people flee for four days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: As the skull catches up, the girl wishes for thick timber, a river, knives,
    and paunches behind them; each appears, and the skull passes through or across
    each obstacle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dog is sent to drive the skull back, but the skull sucks it in head first;
    the skull then draws in the old woman and the old man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The girl reaches a man wearing his robe inside out and making a bow and arrows
    of oak, and repeatedly asks him for pity because of the danger coming.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The man tells the girl to walk around him four times; when the skull arrives
    asking for the girl as food, he says she has gone on.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The man motions with his bow, the skull bursts, and its swallowed contents
    become visible, including tents, people, entire camps, and the last three victims
    still moving.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The girl asks the man to make her father, mother, and dog live and promises
    to be his wife; he rubs the bow over their bodies, and they get up alive.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The man sends the old man and old woman away to live at a hill and takes the
    girl to his tent near the river, where he presents her to his wife as a younger
    sister.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Before hunting, the man warns the young wife not to do what his other wife
    tells her, not to leave the tent with her, and not to bathe with her.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: After three days the older wife persuades the girl to bathe at a river pool
    covered with green scum, tries to push her from behind, and is instead thrown
    in and drowned by the girl.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The girl warns the man not to pick up arrows and shoot them a second time
    at the same game; while hunting prairie chickens, he does so, and a whirlwind
    comes and carries him up and away.
  category: sequence
  evidence_refs:
  - ev:9
