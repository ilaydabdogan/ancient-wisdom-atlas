canonical_text:
  quote: ''
  summary: Two young hunters discover a brother and sister living with great stores
    of meat and two powerful animal companions. The sister controls the animals, feeds
    visitors, instructs the people to camp at a distance, and declares that only her
    father will be harmed. When the father enters, the bear and panther kill him,
    after which the people receive meat. The sister warns the people not to depend
    on her, dismisses the animals, and then she and her brother go up to heaven; the
    passage states that her name and designs or embroidery remain below as tradition.
  language: English
  quote_policy: summarized
