canonical_text:
  quote: ''
  summary: Nih'anqan is pursued by a rolling stone and hides in a ravine, where the
    stone rests on him and nearly crushes him. A Hawk tries to break the stone but
    is destroyed. A Bull-Bat breaks the stone and frees Nih'anqan. Nih'anqan then
    pretends to offer affection to the Bull-Bat, seizes it, spreads its mouth open,
    and says it will remain that way. The passage ends with notes on rabbit avoidance,
    use of a deposit attributed to Nih'anqan in tanning and buffalo robe painting,
    and a comparison to other pursuit tales including a Pawnee tale of Coyote pursued
    by a stone.
  language: English
  quote_policy: summarized
