  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The woman’s mother, tired of waiting for water, finds the water vessel at
    the river and the young woman gone.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The human husband had been away after ponies, then invites societies and counts
    their members while the wider camp sends couriers to other camp-circles; no one
