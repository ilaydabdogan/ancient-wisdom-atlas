canonical_text:
  quote: ''
  summary: Scabby Bull directs a couple to cross at a shallow place. After the crossing,
    the husband has the woman close her eyes; she then sees him as a young steer with
    bright horns and follows him to an immense buffalo herd and camp-circle. The buffalo
    parents ask what the woman eats and kill a male calf for her. The buffalo husband
    is jealous and confines her. Meanwhile her mother finds the water vessel left
    at the river, the human husband and community search unsuccessfully, and the human
    husband mourns on a high hill for days with little food.
  language: English
  quote_policy: summarized
