- id: obs:2
  text: After crossing, the pair travels over open prairie to a small divide where
    the husband tells the wife to sit while he goes in front and tells her to close
    her eyes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the woman looks up, she sees a young-looking three-year-old steer with
    a well-formed body and bright, pointed horns.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman says nothing because she is eloping with him, and she follows the
    buffalo husband peaceably.
  category: action
