  text: The wife prepares food, wakes her brother-in-law, gives him a meal, and he
    hesitates before eating it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: While the brother-in-law eats, the wife sits beside him, embraces him, and
    asks him to love her more than his brother and to forsake his brother.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brother-in-law refuses, saying he loves his brother, considers the act
    disgraceful, and asks her not to mention it again.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the first refusal, the brother-in-law goes to the top of a hill and
    spends the day in deep thought.
  category: action
  evidence_refs:
