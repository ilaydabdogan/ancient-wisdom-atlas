canonical_text:
  quote: ''
  summary: A wife repeatedly tries to seduce her brother-in-law while her husband
    is away hunting. The brother-in-law refuses because of his loyalty to his brother,
    withdraws to a hill in distress, and waits for the husband’s return. The husband
    returns with meat, unaware of the attempted deception, and continues to provide
    for the household.
  language: English
  quote_policy: summarized
literal_observations:
