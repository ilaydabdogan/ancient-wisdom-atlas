- id: obs:4
  text: The prescribed prayer addresses Last Child as grandfather, mentions seven
    pieces cut from the wrist, and asks for prolonged life, protection, clear wholesome
    water, prosperity, pity, and increase of descendants.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator explains that the supplication was given by the husband, identified
