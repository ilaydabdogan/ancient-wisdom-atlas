  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the woman returns to the camp-circle, her people are mourning because
    they believed she had drowned; they rejoice when they see her alive.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The woman later paints her whole body red, describing this as living according
    to the way of her husband, the water monster.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A black-painted tipi with two monsters on one side, the sun in front, and
    the half-moon at the back is given to the woman, along with medical supplies.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The water monster is called Last Child in English and Hi-taw-ku-saw in Arapaho;
    people fear deep river holes and forbid children to bathe there.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: A Northern Arapaho story says that an animal was captured, turned into solid
