canonical_text:
  quote: ''
  summary: A water monster called Last Child instructs a woman on offerings and prayers
    to be made at springs and dangerous river places. The people are told to offer
    small cut pieces of skin or red flannel, and to pray for safe water, health, protection,
    prosperity, and increase. The woman returns alive after being thought drowned,
    later follows the monster's red-painted practice, and receives a symbolic tipi
    and medical supplies. The passage adds explanatory notes on fear of deep water,
    offerings to Last Child, a Northern Arapaho story of an animal turning to stone,
    and an episode in which two women see the monster at the water surface.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker instructs the people to cut small pieces of skin, tie them into
    bundles, place them on a small stick, and set them near springs or dangerous deep-water
    banks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says he will appear, receive offerings and prayers, and in return
    make river crossings and swimming safe for people and their children.
  category: speech
  evidence_refs:
