canonical_text:
  quote: ''
  summary: Sleepy-Young-Man travels in search of cannibals after rebukes from his
    father. He repeatedly obtains food and sinew from women at camp-circles, uses
    fire and ashes to make the sinew contract and thereby shorten the earth or distance,
    receives directions toward the sunrise, and finally reaches the shining iron tipi
    of the cannibals' wife, where he prays for mercy and is invited in.
  language: English
  quote_policy: summarized
