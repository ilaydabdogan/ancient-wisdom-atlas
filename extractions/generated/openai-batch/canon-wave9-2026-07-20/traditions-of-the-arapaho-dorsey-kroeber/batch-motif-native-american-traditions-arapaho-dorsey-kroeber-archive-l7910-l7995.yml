canonical_text:
  quote: ''
  summary: Young men follow buffalo tracks through a cave in a mountain and find abundant
    buffalo beyond it. On their return, a water-associated being blocks the cave passage;
    after the men burn its body, one man eats from it despite warnings and transforms
    into a white hiintcabiit. He asks his brother to throw him into a spring and instructs
    him to leave cloth offerings there for war victory. The passage then begins the
    next tale, “Snake-Boy,” with a newly married husband away in a war-party and his
    grieving wife in the wilderness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group of young men starts on a journey, finds buffalo tracks, and follows
    them for multiple days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The buffalo tracks lead to a cave at the bottom of a mountain.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: One of the men says they should follow the tracks because they want to find
    the place where the buffalo live, and the group enters the cave one behind another.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Inside the cave, the men find clear running water and drink from it; later
    they see faint dawn-like light and learn the cave is a passage through the mountain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After emerging, the men see herds of buffalo in many directions near prairie,
    streams, and rivers, and they say the buffalo will provide food, robes, moccasins,
    ropes, and other things.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the return trip, where the running stream had been, a being lies across
    the passage and its body fills the passage to the top.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The men build and keep up a fire against the body until it burns in two, while
    fat runs from the body into the fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: One man eats from the burned body despite his companions warning him not to
    touch it because it is powerful; the companions refuse to eat it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Over successive mornings, the man who ate from the being first has white legs,
    then a white body, and finally becomes completely white and shaped like the one
    he ate; he is called a hiintcabiit.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At a spring, the transformed man asks his brother to throw him into the water
    and says that, during war travel, cloth tied above the spring will bring good
    black paint, glossed as victory.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The brother throws the transformed man into the spring; he disappears in the
    water amid flashes of light, and the brother later leaves something near the spring
    and returns victorious.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: At the beginning of the next tale, a husband in a newly married couple goes
    away with a war-party, which remains absent for days and causes uneasiness among
    the people.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The young wife loves her absent husband, wanders into the wilderness to weep,
    and takes quilled work with her to occupy herself.
  category: action
  evidence_refs:
  - ev:9
