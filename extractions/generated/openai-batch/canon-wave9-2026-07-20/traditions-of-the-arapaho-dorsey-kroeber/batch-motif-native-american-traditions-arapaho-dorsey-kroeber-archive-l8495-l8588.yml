canonical_text:
  quote: ''
  summary: A buffalo bull and herd pursue escaped people, follow a badger-sealed passage
    and trail, question a stone, and locate the fugitives in a lone cottonwood when
    a calf detects the girl's bloody spittle. The speaking tree shelters the people,
    causes buffalo horns to break, helps the young men kill the bull, and declares
    that buffalo will thereafter be hunted, eaten, and skinned by human beings. After
    the people descend, a magpie sent by Tceyoginen, a dangerous round rock, requests
    a daughter in marriage but warns the people against the match and arranges for
    a hummingbird messenger to carry further warning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bull touches and speaks angrily to his wife, then hooks and tosses away
    an empty robe, concluding that the fugitives cannot escape him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bull notices fresh ground thrown up by the badger to close a hole; the
    bulls dig along the underground passage and follow the people's trail from the
    abandoned camp.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bull questions a stone about whether it hid or helped the people; the
    stone denies helping them and says the girl only rested there briefly.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The buffalo cross a river, and a tired calf stops at a lone cottonwood tree
    while the herd goes on without seeing the people in the tree.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The tired girl in the tree spits bloody spittle, which falls before the calf;
    the calf smells it and reports that it found the bull's wife in the top of the
    tree.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The herd returns to the tree, the bull threatens the fugitives, and the speaking
    tree invites the buffalo to try their strength against it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Buffalo attack the tree in stages, peeling bark and splitting wood, while
    the young men shoot at them from the tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some buffalo stick fast in the tree or break their horns, and the tree speaks
    about making some of them break their horns.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The bull charges the tree from several directions and on the fifth charge
    sticks his left horn deep in the wood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The tree instructs the young men to shoot the trapped bull in the soft parts
    of his neck and sides; they shoot and kill him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The tree tells the people to gather the chips and pieces of wood and cover
    the dead bull with them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The tree declares that buffalo will thereafter be overcome by human beings,
    fear hunters, be killed and eaten, and have their skins used; the remaining buffalo
    scatter with half-broken short horns.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the people descend from the tree, the magpie comes as a messenger from
    Tceyoginen, identified as Merciless-man and as a round rock, to ask for a daughter
    in marriage.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The magpie warns against the marriage, saying the rock has obtained beautiful
    girls before and that returning wives were naked, deformed, one-eyed, or badly
    bruised.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The magpie advises using the swift hummingbird as messenger; the hummingbird
    later warns the people to leave and not blame it for helping the rock.
  category: action
  evidence_refs:
  - ev:8
