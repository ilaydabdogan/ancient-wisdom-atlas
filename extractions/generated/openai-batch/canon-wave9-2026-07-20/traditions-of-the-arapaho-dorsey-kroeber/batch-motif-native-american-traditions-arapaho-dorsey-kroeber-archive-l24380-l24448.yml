canonical_text:
  quote: ''
  summary: 'Abstracts of Found-in-Grass episodes: boys are carried away by wind; a
    boy found in grass is raised by an old woman, ridiculed for his appearance, proves
    ability through hunting or buffalo-producing feats, marries the chief''s younger
    daughter, is transformed in appearance, and becomes the focus of rivalry with
    the older sister or Crow-Woman. One version ends with Gopher causing Found-in-Grass
    to be trapped in a stone pit; another version emphasizes his use of a running
    wheel to produce buffalo and secure marriage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A father makes boys a netted wheel and tells them not to throw it with the
    wind; a whirlwind carries the boys to a distant land.
  category: sequence
  evidence_refs:
