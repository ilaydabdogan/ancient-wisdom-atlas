  text: Crow-Woman secretly pours water on the younger sister's bed and says that
    the younger sister's husband urinated.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Found-in-Grass returns improved in appearance, later appearing with a feather
    lance, quilled buffalo robe, good clothes, panther bow-case, quiver, bow, arrows,
    and the smell of sweet grass.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Found-in-Grass instructs that a corral be made and buffalo chips placed at
    the gate; he says he will shoot the flat chip and the rest will come alive to
    be slaughtered by the people.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Found-in-Grass puts blood into an intestine bag, secretly pierces it with
    a thorn, and Crow-Woman spoils her robe while carrying it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Crow-Woman grieves on the prairie; Gopher asks why she cries and then acts
