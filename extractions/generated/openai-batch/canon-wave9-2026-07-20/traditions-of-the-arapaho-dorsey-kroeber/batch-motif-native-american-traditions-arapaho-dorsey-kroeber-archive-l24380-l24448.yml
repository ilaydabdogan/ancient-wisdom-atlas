- id: motif:7
  label: animal helper or avenger creates entrapment
  taxonomy_refs:
  - shapeshifter
  basis: Gopher hears Crow-Woman's complaint and then Found-in-Grass becomes trapped
    in a pit with stone ground around him.
  evidence_refs:
