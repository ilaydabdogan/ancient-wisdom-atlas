- id: obs:2
  text: An old woman cutting grass for bedding finds one boy full grown, takes him
    home, and the people call him Found-in-Grass.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Found-in-Grass is described at first as dirty, having a big belly, and being
    ridiculed for his appearance.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:4
  text: The chief has two daughters; the older daughter is promised to whoever kills
    the kit-fox in a tree.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Found-in-Grass has the old woman make him bow and arrows, kills the kit-fox,
    and Crow claims the kill and marries the older daughter.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A small piece of fur from the killed animal becomes a whole hide by morning,
    finer than the original.
  category: object
  evidence_refs:
