candidate_motifs:
- id: motif:1
  label: disregarded or lowly youth proves hidden power
  taxonomy_refs:
  - culture_hero
  basis: Found-in-Grass is initially dirty, ugly, and mocked, yet kills the kit-fox,
    produces buffalo, gains a chief's daughter as wife, and appears transformed.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  - ev:8
  - ev:14
  - ev:15
  - ev:16
  confidence: medium
  cautions: The passage is an abstract and does not explicitly call him a culture
    hero; the label is inferred from repeated public-benefit feats and status reversal.
- id: motif:2
  label: wind-borne removal to distant land
  taxonomy_refs:
  - departure
  basis: Boys are carried by a whirlwind to a distant land, and in the second version
    Spring-Boy is blown away by a dust storm.
  evidence_refs:
  - ev:1
  - ev:13
  confidence: medium
  cautions: The passage gives only brief abstracted statements about the wind events.
- id: motif:3
  label: magical hunting or buffalo procurement
  taxonomy_refs:
  - sacred_exchange
  basis: Found-in-Grass uses buffalo chips or a running wheel to make buffalo available
    for communal slaughter and distribution of skins and beef.
  evidence_refs:
  - ev:9
  - ev:14
  - ev:16
  confidence: medium
  cautions: No taxonomy reference exactly names buffalo procurement; sacred_exchange
    is only approximate because the episode involves provision and distribution.
- id: motif:4
  label: status transformation through fine appearance
  taxonomy_refs:
  - initiation
  basis: Found-in-Grass changes from dirty and ugly to much improved or beautiful,
    with fine clothes, weapons, and sweet-grass scent, followed by recognition and
    desire from others.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:15
  confidence: medium
  cautions: The abstract does not describe a formal initiation rite; the motif label
    is based on transformation and social recognition.
- id: motif:5
  label: sibling rivalry over husband
  taxonomy_refs:
  - sibling_pair
  basis: The older sister mocks the younger sister's husband, attempts to shame the
    younger sister, later becomes enamored of Found-in-Grass, and tries to win him.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:17
  confidence: high
  cautions: The sibling-pair taxonomy is used descriptively for the two sisters' rivalry
    rather than for a twin or heroic sibling-pair structure.
- id: motif:6
  label: false claimant to heroic feat
  taxonomy_refs:
  - trickster_boundary
  basis: Crow claims to have killed the kit-fox after Found-in-Grass killed it and
    gains the older daughter as wife.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage does not explicitly identify Crow as a trickster in this abstract;
