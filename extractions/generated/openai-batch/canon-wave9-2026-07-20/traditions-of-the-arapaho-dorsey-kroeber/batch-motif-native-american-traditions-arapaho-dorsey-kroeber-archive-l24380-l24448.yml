  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:2
  type: summary
  locator: 24382-24384
  quote_or_summary: An old woman cutting grass finds a full-grown boy, takes him home,
    and people call him Found-in-Grass; he is dirty and has a big belly.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: 24384-24386
  quote_or_summary: The chief has two handsome daughters; people fail to kill a kit-fox
    in a tree, and the chief offers the older daughter to its slayer.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: 24386-24388
  quote_or_summary: Found-in-Grass gets a bow and arrows from the old woman, is ridiculed,
    kills the kit-fox, and Crow claims the kill and marries the older daughter.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: 24388-24391
  quote_or_summary: Found-in-Grass has the old woman touch the animal and bring a
    small piece of fur home; by morning it becomes a whole hide finer than the original.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 24391-24392
  quote_or_summary: Found-in-Grass sends the hide to the chief, and the chief gives
    him the younger daughter for a wife.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 24392-24396
  quote_or_summary: The older sister mocks Found-in-Grass; in the couples' tipi, Crow-Woman
    secretly pours water on the younger sister's bed and says her husband urinated.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 24396-24402
  quote_or_summary: Found-in-Grass returns improved in appearance, later arrives with
    a feather lance, quilled buffalo robe, good clothes, panther bow-case, quiver,
    bow and arrows, and sweet-grass scent; Crow-Woman becomes enamored.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 24402-24406
  quote_or_summary: Found-in-Grass directs that a corral be made with buffalo chips
    at the gate and says that when he shoots the thin flat chip the rest will rise
    alive to be slaughtered.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 24406-24412
  quote_or_summary: Crow-Woman wants to carry Found-in-Grass's beef and blood-filled
    intestine bag; he secretly pierces the bag with a thorn, she spoils her robe,
    and Found-in-Grass and his wife mock her.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 24412-24420
  quote_or_summary: Crow-Woman grieves on the prairie and tells Gopher why she is
    crying; afterward Found-in-Grass is found waist-deep in a pit with the ground
    around him turned to solid stone.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 24420-24421
  quote_or_summary: People passing Found-in-Grass leave things and ask him for mercy
    and protection.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 24427-24432
  quote_or_summary: A bracketed note for version 140 says the second monster is a
    panther, the fourth a multi-colored worm, Spring-Boy is blown away in a dust storm,
    and Crow is already married to the older daughter of the chief.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 24432-24438
  quote_or_summary: Found-in-Grass seeks to marry the younger daughter, is called
    ugly and dirty, makes a small running wheel representing animals and darts, and
    produces buffalo by rolling and striking the wheel; the old woman delivers beef
    to the chief.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: 24438-24440
  quote_or_summary: The younger sister brings prepared food to Found-in-Grass at night;
    he becomes beautiful and she falls in love with him.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: 24440-24445
  quote_or_summary: Found-in-Grass has the chief build diverging rows of stone heaps
    from a precipice, rolls the wheel to cause buffalo to enter the corral, and the
    people drive them over the precipice for skins and beef.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: 24445-24448
  quote_or_summary: The older sister works near Found-in-Grass to win him and wants
    to carry his blood bag; he stabs it with a knife and says it is leaking.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: '24448'
  quote_or_summary: A big furnished tipi is put up; Found-in-Grass is called there
    and finds the younger sister waiting as wife, along with food and relatives.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
