canonical_text:
  quote: The boy, without looking up, suddenly became clotted blood again
  summary: Clot-child kills his elder sister after saying she and her husband mistreated
    the old parents, hunts buffalo for the family, travels toward a dangerous camp,
    turns into clotted blood near a buffalo carcass, kills two approaching men with
    a split whetstone, then visits a lone tent occupied by a blind woman where human
    bones and meat are hanging.
  language: English
  quote_policy: quoted
