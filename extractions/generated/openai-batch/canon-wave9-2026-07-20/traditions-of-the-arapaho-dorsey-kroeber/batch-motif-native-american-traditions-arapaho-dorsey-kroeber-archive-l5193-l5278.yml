canonical_text:
  quote: ''
  summary: A boy is born as the only brother of seven sisters and grows rapidly. A
    suitor asks his consent to marry the oldest sister, and the brother asks his parents
    to have all his sisters marry. The oldest sister and then the other sisters refuse.
    The parents decide to keep the son and send the daughters away. The sisters travel
    to a mountain area with a running creek and find a cave-like opening in a pointed
    hill, which they make into a tipi-like dwelling. Later, the oldest sister sees
    buffalo across the creek and calls the next younger sister; when that sister looks,
    several buffalo fall dead. The sisters skin the animals and command the hides
    to be painted and quilled.
  language: English
  quote_policy: summarized
