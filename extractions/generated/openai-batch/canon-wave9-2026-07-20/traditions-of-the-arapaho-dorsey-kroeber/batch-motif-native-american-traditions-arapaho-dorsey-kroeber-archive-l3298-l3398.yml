canonical_text:
  quote: ''
  summary: 'The passage recounts an encounter in which Nih''anqan taunts a dwarf who
    is making an immense arrow from a tree; the dwarf shoots it, pins Nih''anqan into
    a hill, then heals him. A second tale has Nih''anqan challenge Coyote to a contest
    of cunning: Nih''anqan changes into several animals, but Coyote detects him each
    time, then Coyote changes into a woman and tricks Nih''anqan before escaping.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nih'anqan is traveling in an unfamiliar place, stops to eat berries, and comes
    to a creek with a hill and cottonwoods nearby.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dwarf is making an arrow out of an immense tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nih'anqan addresses the dwarf as younger brother, doubts that so small a person
    can lift so large a tree, and urges him to shoot at him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dwarf warns that he might kill Nih'anqan, repeatedly tells him to stand
    farther away, and later says he must shoot because taking up bow and arrows without
    shooting would cost him his power.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The dwarf picks up the tree with one hand and shoots it as an arrow toward
    Nih'anqan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The tree-arrow turns toward Nih'anqan whichever way he runs, strikes his body,
    and forces him deep into the hill with only his head projecting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The dwarf reproves Nih'anqan for doubting him, helps him out, and cures his
    injuries by touching and rubbing the injured parts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nih'anqan meets Coyote and proposes a contest to determine who is smartest;
    Coyote calls Nih'anqan tricky and initially refuses.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nih'anqan successively lies in front of Coyote as a buffalo cow, elk, antelope,
    and deer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Coyote goes to the leeward side and smells each animal form, recognizing that
    it is still Nih'anqan.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Coyote changes into a woman sitting on the ground with a robe and says her
    mother sent her to Nih'anqan as a sister.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Nih'anqan says the woman is his brother-in-law rather than his sister, grabs
    her, and is about to have intercourse with her when she turns back into a coyote
    and escapes.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: After escaping, Coyote tells Nih'anqan that he fooled him.
  category: speech
  evidence_refs:
  - ev:8
