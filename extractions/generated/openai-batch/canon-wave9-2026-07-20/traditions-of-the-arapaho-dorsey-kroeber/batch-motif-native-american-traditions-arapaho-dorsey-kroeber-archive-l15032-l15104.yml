canonical_text:
  quote: ''
  summary: In winter, a boy and his sister make a brush house and shelter an aged
    wolf. After snowfalls, elk and then buffalo appear in great numbers; when the
    sister looks at them after the wolf urges her to rise, they fall dead. The boy
    skins the animals, and the sister prepares hides and makes a tent, poles, ornaments,
    and quill-embroidered hangings through actions and spoken commands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is set in winter, and the boy and his sister build a brush house
    with a door, bedding, and a sleeping place near the door for the old wolf.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old wolf thanks the children for kind treatment and warmth, saying he
    is old, weak, and unable to endure cold.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At night the old wolf sleeps by the door on the right side, the girl sleeps
    on the north side, and the boy sleeps at the back; in the morning the boy rises
    first to make the fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a snowfall, the boy sees elk in the timber, on the river banks, and
    throughout the snowy landscape.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the wolf tells the girl to get up and look, she opens the door and looks
    at the elk; the passage says the elk fall down dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The girl gives the boy a flint knife with a bone handle and tells him to skin
    the elk; he skins them and throws the hides into the tent.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The girl folds elk hides three times and sits on them; the passage says each
    hide is thereby completely dressed, while meat is sliced and hung in trees near
    the river.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that thirty-six elk are killed.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The girl commands the elk skins to become a tent, sits on the pile, and the
    pile becomes a tent with a bird ornament, four round ornaments, a door, and rattles
    over the door.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The girl commands twenty-nine tent poles to be present outside; they appear
    at her left, made from otter-weeds, and the new tent stands erected and covered.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The girl folds and sits on groups of skins to make quill-embroidered hangings
    for her brother and herself, and another object with pendants for the old man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After seven days and another snowfall, buffalo cover the land; after the wolf
    urges the girl to get up, she looks out the door and the buffalo fall dead.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The girl tells her brother to skin a young buffalo, explaining that its soft
    skin will not break quill embroidery when they sit on it.
  category: speech
  evidence_refs:
  - ev:7
