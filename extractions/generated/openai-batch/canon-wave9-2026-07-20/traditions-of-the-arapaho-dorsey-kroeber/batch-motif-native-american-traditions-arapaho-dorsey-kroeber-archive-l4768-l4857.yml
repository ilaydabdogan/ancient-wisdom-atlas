canonical_text:
  quote: ''
  summary: A sick father gives his daughter and wife instructions for after his death,
    including whom the daughter should marry and how his body should be placed in
    a tree. After the women believe he has died, they prepare a tree burial with robes,
    clothing, and weapons, then leave and travel. The father gets out of the wrappings,
    stages the burial place to look as if animals have disturbed it, follows his family
    at a distance for four days, and the women later return to find the staged remains
    and rewrap the bones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sick father tells his daughter that he expects to die and wants her to marry
    whoever comes to them on the way back to the camp-circle or helps them at camp.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:2
  text: The father tells his wife the same wishes about the daughter’s marriage and
    says the future husband can look after ponies and supply food.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:3
  text: The father says he has instructed the daughter how he wants to be placed in
    the tree, tells the women to journey that day, and says they may return after
    four days to see him for the last time.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The wife rubs the father’s face, feet, and body while he worsens.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the father closes his eyes and cannot be helped to recover his senses,
    the wife and daughter decide he is dead and cry over him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The wife and daughter prepare a tree burial using poles, a travois platform,
    robes, clothing, a bow-case, a quiver, and a knife, and they draw the father’s
    body up and wrap it loosely.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The mother and daughter weep, leave the burial place, break camp, and travel
    until sunset.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After they leave, the father gets out of his wrappings, takes his bow-case,
    quiver, and knife, cuts the robes and clothing, scatters animal bones and strings,
    and chews rawhide ropes to make the site look as if wolves had been there.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: For four days, the father follows the course of his family and camps a little
    distance from their tipi.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the mother and daughter return to the burial place, they find bones and
    torn materials; the mother says the body must have decomposed and wolves and coyotes
    must have been around.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The mother and daughter gather the bones, wrap them in remnants of robes and
    clothing, place the bundle in the tree, cry, and the daughter says this is the
    last time she will see her father’s remains.
  category: action
  evidence_refs:
  - ev:10
