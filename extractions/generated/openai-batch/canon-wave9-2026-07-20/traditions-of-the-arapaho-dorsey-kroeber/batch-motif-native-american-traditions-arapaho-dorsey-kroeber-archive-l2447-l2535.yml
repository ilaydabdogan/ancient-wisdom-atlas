canonical_text:
  quote: ''
  summary: Gopher urges a man and woman to flee home without resting. They stop among
    seven cottonwood trees and are discovered by a buffalo cow and calf, who alert
    the herds. A steer identified as the one who stole the woman leads the buffalo
    attack against the trees where the couple has taken refuge. As the buffalo break
    one tree after another, Gopher arrives underground, makes a hidden hole, leads
    the man and woman through it, and brings them back to the main camp-circle at
    dawn. Later the woman announces good tidings for the people, described as a foundation
    for living, and gathers them to deliver a message.
  language: English
  quote_policy: summarized
