canonical_text:
  quote: ''
  summary: A man attempts to feed his visiting medicine-man friend by imitating the
    medicine-man’s lake-diving food-getting feat, using paint, a bone whistle, and
    four leaping motions, but he fails and strikes the ice. The medicine-man repeats
    the act successfully, diving through the ice and returning with two beavers, which
    are cooked for him. A narrator’s note says the medicine-man was gifted by a Kingfisher
    and that the story teaches generosity to strangers and returning favors. A following
    tale begins with Nih’angan welcomed by a man and wife; the host has his wife bring
    cottonwood bark and a stick, and the bark turns into roasted tenderloin at the
    fire.
  language: English
  quote_policy: summarized
