canonical_text:
  quote: ''
  summary: The passage contains several Nih’ancan episodes involving Coyote, women
    who are revealed as animal beings, and beavers. Nih’ancan attempts deception and
    sexual pursuit, is frustrated or tricked by Coyote and by deer-women, deceives
    beavers into leaving their water, kills and roasts many of them while sparing
    a male and female pair, becomes trapped in cottonwood limbs, loses the roasted
    meat to Coyote, and then burns Coyote’s leg hair, explaining the yellow color
    on coyote legs. A note says the Osage have a similar tale.
  language: English with Latin passages
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nih’ancan wishes to deceive Coyote by pretending to be an elk lying beside
    the path, but Coyote recognizes him and passes by.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nih’ancan meets a painted-robed person whom he first thinks is a man; the
    person is a young woman who says he is her brother, and Coyote then sexually intrudes
    and flees with a taunt.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nih’ancan sees a beautiful woman sewing, desires her, approaches to seize
    her, and she suddenly springs up as Coyote.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two women bathing in a river see Nih’ancan, come out of the river, roll themselves
    in mud, and stand on either side.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nih’ancan treats one mud-covered figure as if it were a stump; when he attempts
    sexual contact, a doe leaps out, and he rebukes himself for foolishness.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nih’ancan tells beavers that there are better lakes with cottonwoods, willows,
    deep green water, and good food, and offers to lead them there.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Nih’ancan cuts a large club; a little beaver reports that Nih’ancan showed
    the stick as the thing he would use to kill him, and Nih’ancan denies it by saying
    he was showing the kind of wood found at the destination.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Nih’ancan kills many beavers as they flee back toward the dam, but leaves
    one male and one female alive so their seed may increase.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Nih’ancan places the dead beavers in a pit, covers them with dirt, and builds
    a fire to roast them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Two cottonwood limbs rub together and squeak in the wind; Nih’ancan addresses
    them as fighting persons, climbs to separate them, and becomes trapped between
    the limbs.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: While Nih’ancan is trapped, Coyote digs out and eats all the roasted beaver
    meat; after freeing himself, Nih’ancan finds Coyote asleep and burns hair from
    Coyote’s legs with a nearby fire.
  category: sequence
  evidence_refs:
  - ev:11
