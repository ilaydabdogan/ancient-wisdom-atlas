canonical_text:
  quote: ''
  summary: A little boy brings seven boys to the river sand-bar and a shelter, where
    they become puppies. His sister rejects the puppy-children and orders that they
    be drowned, while the little boy cares for them. The children appear again as
    youths at the sand-bar, where their father arrives and takes them away to his
    parents' camp. The mother pursues and asks for the oldest child, but receives
    a leg bone called notariyah instead. The father and boys reach the camp-circle,
    where the old people welcome their grandchildren and provide clothing.
  language: English
  quote_policy: summarized
