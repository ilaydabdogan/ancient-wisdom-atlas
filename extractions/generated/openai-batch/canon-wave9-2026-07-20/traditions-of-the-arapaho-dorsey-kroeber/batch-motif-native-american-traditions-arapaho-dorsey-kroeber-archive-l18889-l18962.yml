canonical_text:
  quote: ''
  summary: A father warns his two sons not to go near a dangerous deep-water place
    by a river. The boys disobey, find and kill a water monster, cut off its horns,
    and bring them home for spoons. The next morning the father warns them not to
    go to a high peak above timber where another dangerous animal lives. They again
    disobey, find young eagles in a nest on a precipice, provoke them, and encounter
    their father, identified with thunder. One boy shoots a tendon arrow into rock;
    the thunder-bird fails to pull it free and falls paralyzed. The boys pluck its
    feathers and bring them to their father for a war bonnet and arrows.
  language: English
  quote_policy: summarized
