canonical_text:
  quote: "“The origin of all the dances (bayaanwu) was thus”"
  summary: 'The passage first gives an origin account for the dances: an isolated,
    hungry murderer encounters an animal that becomes a buffalo cow, spares her after
    she speaks, later kills many buffalo, prepares meat, and feeds the tribal societies.
    The passage then shifts to a narrative about Big-Chief’s attractive younger brother,
    who repeatedly entices women and becomes a nuisance to the tribe. The people obtain
    Big-Chief’s consent to expel or kill him, but he survives two drownings. Big-Chief
    later takes him hunting, kills a buffalo, and leaves him guarding the meat and
    driving away flies.'
  language: English
  quote_policy: quoted
