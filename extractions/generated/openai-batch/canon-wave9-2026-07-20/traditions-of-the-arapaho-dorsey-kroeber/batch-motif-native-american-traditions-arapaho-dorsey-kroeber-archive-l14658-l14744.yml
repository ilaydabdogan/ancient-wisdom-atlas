canonical_text:
  quote: "“Therefore we shall be hereafter buried in the ground after death.”"
  summary: A family flees a strange nocturnal provider that proves to be a rolling
    skull. The daughter uses moccasins as decoys and repeatedly wishes obstacles into
    being. A canyon finally swallows and buries the skull, which is stated to explain
    burial in the ground after death.
  language: English
  quote_policy: quoted
literal_observations:
