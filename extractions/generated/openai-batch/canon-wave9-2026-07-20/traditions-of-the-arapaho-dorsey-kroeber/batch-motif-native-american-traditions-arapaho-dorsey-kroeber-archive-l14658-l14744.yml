  text: The father tells his daughter that the object is wonderful and that they should
    get away from it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The daughter stops quill work and makes four pairs of moccasins, placing them
    in different spots inside the tipi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father, mother, and daughter leave during the day, leaving an untouched
    male elk outside.
  category: action
  evidence_refs:
  - ev:3
