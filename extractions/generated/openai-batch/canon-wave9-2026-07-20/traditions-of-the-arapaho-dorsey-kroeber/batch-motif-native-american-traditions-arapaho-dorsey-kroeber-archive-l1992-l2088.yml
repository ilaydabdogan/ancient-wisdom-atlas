canonical_text:
  quote: ''
  summary: 'The passage closes a river-crossing episode in which Lime-Crazy, guided
    by a swift-hawk voice, offers eagle feathers to the Father-of-Waters, blows a
    bone whistle, leaps upward with the water following, lands on a hilltop, and returns
    to camp after the waters recede. An editorial note compares the tying of eagle
    feathers to the monster''s horns with an Arapaho Sun Dance rite. The passage then
    begins another Lime-Crazy tale: a chief''s younger brother becomes socially disruptive,
    is abandoned by his older brother while tending a dead buffalo, continues circling
    until he forms a pit, and finally leaves when persuaded by his sister-in-law.'
  language: English
  quote_policy: summarized
