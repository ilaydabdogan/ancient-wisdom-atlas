canonical_text:
  quote: ''
  summary: The passage contains abstract material for the Arapaho story “Badger-Woman,”
    in which a wife unsuccessfully tempts her husband’s younger brother, traps him
    in a concealed pit under his bed, and conceals his disappearance. Gray-Wolf, Black-Wolf,
    and wolves and coyotes rescue and feed the buried young man, return him to his
    mourning brother, and devour the woman when she brings them food. The passage
    then begins and summarizes “Nariniiha, the Substitute,” in which a girl seeks
    Nariniiha for marriage, offers water in a transparent goat-horn spoon, and later,
    during the Sun-dance setting, gives water to Sasayi and marries the right man
    while Nariniiha remains without a wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wife tempts her brother-in-law on successive days; he pushes her away and
    leaves weeping because of the repeated temptation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife digs a hole under the brother-in-law’s bed, covers it with dirt and
    brush, makes the bed appear attractive, and the young man falls out of sight when
    he sits on it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife covers the fallen young man with dirt, restores the bed, and tells
    the husband that his brother has gone to the woods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A strange noise like a human cry is heard; the wife pokes the fire and attributes
    the noise first to sinew and then to sticks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The husband searches and mourns for his brother, and the camp eventually treats
    the young man as lost or killed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Gray-Wolf hears a strange human cry at the old camp-ground, has compassion,
    and calls wolves and coyotes from four places.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Wolves and coyotes dig into the ground, find the young man unconscious, thin,
    and poor, lift him up, and question him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The buried man says he was buried; Black-Wolf is sent to search for food,
    and the food restores the man’s strength.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Gray-Wolf decides that the young man should return to his brother, and wolves
    and coyotes journey with him to the main camp-circle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Gray-Wolf tells the mourning brother to stop mourning and to have his wife
    prepare pemmican and sausages.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: The wife sees the returned brother-in-law, tries to kiss him, and is told
    to do as commanded instead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: The brother-in-law has the woman carry food toward the wolves and coyotes;
    he calls them, and the woman is devoured with the food she prepared.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: A shorter abstract of “Badger-Woman” repeats that a wife makes love to the
