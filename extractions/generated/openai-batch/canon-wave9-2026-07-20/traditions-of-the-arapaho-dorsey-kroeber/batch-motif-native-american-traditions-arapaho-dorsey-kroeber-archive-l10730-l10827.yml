canonical_text:
  quote: ''
  summary: A young wolverine hears a buried man crying and asks that he be made his
    brother. Wolverines, wolves, coyotes, and badgers dig the man out, protect him
    from being eaten, feed him, and send him home with instructions. The returned
    man reveals that his sister-in-law had buried him; she later brings food to the
    wolves and coyotes and is killed by those who receive none. The passage then begins
    a new tale in which a young woman who has refused marriage hears of Nariniiha,
    seeks him at a larger camp preparing for a Sun-dance, and enters his worn tipi
    with a goat-horn spoon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young wolverine hears crying, listens with his ear to the ground, reports
    that a person is in a hole, and asks that the person be taken out to become his
    brother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wolverine mother says she lacks power alone and calls wolves, coyotes,
    and badgers for help.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The animal groups come in long files to the place where the man is buried;
    a wolf digs him out, and the man emerges thin, long, dark, nearly dead, and too
    weak to stand or walk.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the man is dug out, the wolf says he may be eaten if desired, but the
    young wolverine's mother asks that he not be eaten, and the animals consent.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wolf, coyote, badger, and wolverine bring dry buffalo meat, backbone meat,
    pemmican, and cooked tongue for the man to eat, and he lives with the animals
    until he regains strength.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The animals instruct the young man to return home, ask his brother whether
    he loves his wife, and, if the brother chooses him, have the wife bring pemmican
    and stuffed guts to the animals on the prairie.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The elder brother and sister-in-law mourn outdoors, while the young man's
    bed in his father's tent remains neatly kept and unused; the young man returns
    at night and lies down in that bed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The father repeatedly orders the sleeper out of the bed; the sleeper finally
    says he is the father's son, his mother falls down from joy, and people gather
    to see him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After repeated questioning by his elder brother, the returned man says that
    the brother's wife tried to kill him by making a hole and burying him, and that
    the wolves saved him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The elder brother says he loves his brother rather than his wife and has been
    mourning for him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The woman goes out from the camp-circle to a row of wolves and coyotes, promises
    to bring them food, and the next night brings a load of food that the wolves devour.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Animals that receive none of the food attack the woman and eat all the flesh
    from her, leaving only bones; the passage gives her name as Badger-Woman.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A new tale begins in a small camp-circle in a wide bottom near a river, where
    a pretty girl repeatedly refuses to marry because her parents provide her wants
    and she wants social gatherings.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: A visitor from a larger camp below reports a famous young man named Nariniiha;
    later the girl is tempted and seeks him at the larger camp-circle.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: At the larger camp-circle, people have prepared for a Sun-dance in spring
    when leaves are in bloom; Nariniiha lives in a worn tipi just outside the camp-circle,
    and the girl enters with a transparent goat-horn spoon held to him to drink.
  category: setting
  evidence_refs:
  - ev:9
