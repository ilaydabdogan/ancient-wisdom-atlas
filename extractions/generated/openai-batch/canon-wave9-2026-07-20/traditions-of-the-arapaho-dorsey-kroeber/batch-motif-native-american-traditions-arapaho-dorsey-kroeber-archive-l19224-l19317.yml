canonical_text:
  quote: ''
  summary: Found-in-Grass appears transformed from his earlier dirty state into a
    handsome man with a war lance. His young wife reports this to her family, while
    her older sister ridicules him. Found-in-Grass sends dried meat to his wife’s
    parents through his grandmother, gaining respect. Crow fails to locate game. Found-in-Grass
    announces that he will look for buffalo, dresses finely, takes his war lance,
    goes beyond a divide, piles buffalo chips, and commands that they become a herd.
    He returns, reports the herd, fills and passes a pipe, and orders the camp to
    prepare quietly for a hunt. In the morning he drives the buffalo toward camp,
    the people kill many, and he changes a young bull into a weak scabby animal, then
    kills it for beef.
  language: English
  quote_policy: summarized
