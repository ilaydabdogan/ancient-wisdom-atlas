canonical_text:
  quote: ''
  summary: Two brothers ignore or test repeated warnings from their father. They enter
    a grove, encounter the cannibal old woman Open-Brains, trick and kill her, and
    bring her hair to their father. The next day, after another warning involving
    arrows and a bird called Scaly-foot, one brother retrieves an arrow against the
    warning; a violent wind comes, one brother reaches home safely, and Spring-Boy
    is blown away to a buffalo wallow where a poor old woman later finds him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The father warns the boys not to play far from home and specifically forbids
    them to go to a large grove where a dangerous being lives.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boys go to the grove, find a lone well-tanned tipi, are invited in by
    a weak voice, and sit near the door.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old woman asks the boys to louse her; the passage states that she has toads
    for lice.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boys throw the toads into the fire, make deceptive noises, tie the old
    woman's hair to the tipi poles, heat a circular sandstone, and throw it into her
    opened head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bones are present around the tipi, and the old woman is described as murdering
    people for food and as having exposed brains, from which her name Open-Brains
    is explained.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Open-Brains kicks and roars, scatters fire coals in her tipi, and dies from
    burning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boys cut off the old woman's tangled hair, carry bunches of hair home,
    and give them to their father as material for pendants and lariats.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The father accepts the hair as proof of the boys' victory and again cautions
    them not to be hasty in their sports.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The next morning the father tells the boys to play near home, to leave the
    red and black arrows, and not to pick up any arrows if they encounter and shoot
    at the bird called Scaly-foot.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The boys encounter Scaly-foot bathing in a buffalo wallow, shoot all their
    arrows at it without hitting it, and one brother warns the other not to pick up
    the last arrow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: One brother rejects the father's warning and picks up the arrow; a terrific
    wind or cyclone comes toward the boys.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: By-the-Door reaches the tipi and is safe, while Spring-Boy is blown away just
    as he reaches for the door.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Spring-Boy lands among tall weeds in a buffalo wallow; a moving camp comes
    nearby, and a poor old woman from the starving camp finds him while gathering
    grass for a mattress.
  category: sequence
  evidence_refs:
  - ev:8
