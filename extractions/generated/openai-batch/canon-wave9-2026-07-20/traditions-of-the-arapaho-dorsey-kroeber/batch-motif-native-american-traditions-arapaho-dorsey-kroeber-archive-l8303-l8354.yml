canonical_text:
  quote: Then a child issued from the leg.
  summary: A girl learns that Bear can be killed by striking the small finger of his
    hand. She escapes with her brothers, and when Bear pursues them she kicks a shinny
    ball kept close to her heart; the ball carries her brothers and then herself up
    to the sky. The tale explains a circle of stars with a lone star to one side as
    the sister, and uses the separation of brother and sister as a moral lesson about
    sibling conduct. An editorial note compares Wichita and Blackfeet versions of
    a Pleiades-origin tale. The next tale begins with a winter war party; a wounded
    hunter’s swollen leg opens and a child emerges, whom the young men wrap and place
    in a panther-skin cradle.
  language: English
  quote_policy: quoted
