canonical_text:
  quote: ''
  summary: 'The passage first concludes a Badger-Woman episode: a rescued brother
    arranges pemmican for Gray-Wolf and other animals, sends Badger-Woman with it,
    and has her delivered to the animals, who eat her; a note connects the badger
    skin and a ritual name with the Sun-dance lodge. The passage then begins another
    narrative titled “Badger-Woman,” setting a hunting camp near a river and describing
    a husband, his wife, and his beloved only brother; the husband hunts while the
    wife performs camp chores and begins to seek the brother-in-law’s affection.'
