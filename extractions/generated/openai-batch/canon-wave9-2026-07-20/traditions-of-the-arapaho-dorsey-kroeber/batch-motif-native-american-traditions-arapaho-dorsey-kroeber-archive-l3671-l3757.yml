canonical_text:
  quote: ''
  summary: Nih’anqan sees a herd of elk and tricks them into racing toward a stick
    placed near a precipice; he swerves aside, while the elk go over the cliff and
    die. While he cuts the meat, a coyote repeatedly eats an elk paunch he was told
    to use for carrying water and lies that fish took it. Nih’anqan observes the deception,
    strikes the coyote, then cooks and sleeps. The revived coyote summons coyotes
    and wolves, who eat Nih’anqan’s meat while he sleeps; mice and rats eat his hair
    and robe. A following fragment begins with Nih’anqan at a river, mistaking the
    sky’s reflection for the river bottom and seeing a naked woman on a sand-bar across
    the water.
  language: English with a Latin section title
  quote_policy: summarized
