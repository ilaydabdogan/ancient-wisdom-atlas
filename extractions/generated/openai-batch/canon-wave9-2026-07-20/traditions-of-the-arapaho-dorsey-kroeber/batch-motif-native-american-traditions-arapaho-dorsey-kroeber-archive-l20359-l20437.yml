canonical_text:
  quote: ''
  summary: The passage includes episodes involving a husband with two wives, Buffalo-Woman
    and Elk-Woman; a muddy buffalo dance in which a calf dances on a turtle shell
    and a man is killed; Blue-bird's revival from a blue plume placed in a sweat-house
    by Magpie; a buffalo herd's failed attack on a four-layer sweat-house; a quarrel
    between two boys that provokes jealousy between their mothers; and Elk-Woman's
    production of abundant pemmican from bark, fire, water, and snow for a public
    feast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The husband is away from home much of the time searching for game, while the
    two wives live together peaceably and help each other.
  category: relationship
  evidence_refs:
