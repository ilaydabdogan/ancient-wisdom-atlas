- id: obs:2
  text: The new wife becomes pregnant, gives birth to a boy, and the boy grows quickly
    enough to go out to play at a distance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A dance is announced for four days in a muddy place; the man is tired, and
    his son says he will dance for him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The calf places a turtle shell in the middle and dances on it; the buffalo
    women sink in the mud, while the calf does not sink on the shell.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage parenthetically identifies the turtle shell as the earth and states
