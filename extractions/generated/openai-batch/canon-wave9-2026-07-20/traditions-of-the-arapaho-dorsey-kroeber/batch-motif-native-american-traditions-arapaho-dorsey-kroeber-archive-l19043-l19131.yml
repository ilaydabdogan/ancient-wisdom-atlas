canonical_text:
  quote: ''
  summary: An old woman finds and cares for the destitute boy Found-in-Grass during
    a camp famine. At the boy's request she makes him a bow, arrows, and a netted
    wheel. When she rolls the wheel toward him while saying that a buffalo is coming,
    real buffalo run toward him inside the tipi; he kills them, and she secretly skins,
    slices, dries, and stores the meat while appearing hungry before the suffering
    camp.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old woman calls Found-in-Grass her grandchild, picks him up, and treats
    him as a welcome companion despite his diseased and filthy condition.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman carries the boy to her old, smoky, patched tipi located outside
    the main camp-circle, cleanses him, and feeds him scanty food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The camp is experiencing famine; scouts repeatedly fail to find buffalo herds,
    and people live mostly on berry mashes and puddings.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Found-in-Grass asks his grandmother to make him a bow from the last rib of
    a buffalo and to make arrows for him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The grandmother makes a netted wheel for the boy from a bent green stick and
    rawhide strips.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Found-in-Grass instructs his grandmother to roll the netted wheel toward him
    and to say that a fat buffalo cow is running toward him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the grandmother rolls the wheel with the stated words, a red buffalo
    cow runs toward the boy; he shoots and kills it with his bow and arrows.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The grandmother skins and cuts up the buffalo inside the tipi and hangs the
    meat on rawhide ropes over the fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The boy tells the grandmother to keep the beef inside; she rubs dirt on her
    hair and face when she goes out so that others think she has no food.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The same rolling-and-speaking procedure is repeated with buffalo steers; real
    steers come, the boy kills them, and the grandmother processes and hides the meat.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: While the grandmother and boy eat well and store dried meat, the wider tribe
    continues to suffer, and very few tipis show smoke.
  category: setting
  evidence_refs:
  - ev:5
  - ev:7
