canonical_text:
  quote: "“be sure not to answer to any strange noise”"
  summary: A husband goes out to hunt after repeatedly warning his pregnant wife not
    to respond to a strange voice while he is away. Later, a strange voice sounds
    at the tipi door; the wife answers and invites the speaker in. A man with long
    tangled hair enters, sits by the fire, and rejects food served first in a wooden
    bowl and then on eagle tail feathers.
  language: English
  quote_policy: quoted
