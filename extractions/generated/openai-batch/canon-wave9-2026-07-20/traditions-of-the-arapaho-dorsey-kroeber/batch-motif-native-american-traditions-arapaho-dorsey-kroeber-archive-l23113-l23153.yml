canonical_text:
  quote: ''
  summary: The passage summarizes an Arapaho tradition in which a wife repeatedly
    tempts her brother-in-law, traps him in a pit under a bed, and conceals his burial.
    Gray-Wolf and other wolves and coyotes rescue him, feed him, and return him to
    camp. The man repays the wolves with pemmican and gives the guilty woman to them;
    she is eaten and said to be placed with animals. The passage then begins the abstract
    of “Badger-Woman,” where a similar household of husband, wife, and brother appears,
    and the wife again tempts the brother-in-law while the husband is away hunting.
  language: English
