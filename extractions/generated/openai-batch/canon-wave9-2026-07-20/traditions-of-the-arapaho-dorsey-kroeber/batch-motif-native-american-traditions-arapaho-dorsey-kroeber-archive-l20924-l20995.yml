canonical_text:
  quote: ''
  summary: A husband secretly observes people being produced from a black burnt cottonwood
    snag and slaughtered for food. He asks permission to conduct a round-up, prepares
    a rib bow, colored arrows, and pemmican made from his brother-in-law's flesh.
    At the snag he strikes repeatedly, kills the cut-nosed person connected with the
    slaughter, calls the would-be victims back to taste the pemmican, saves them,
    and becomes chief or ruler of a large camp-circle.
  language: English
  quote_policy: summarized
