canonical_text:
  quote: ''
  summary: 'The passage closes one story with a woman and boy returning to camp, a
    child-frightening reference to Owner-of-Bag, and notes on vows, porcupine-quill
    work, tipi designs, healing, prosperity, and pregnancy. It then begins the story
    of the Red Speckled Horse: a man and wife camp near a river with a herd; the wife
    tends the stock; the prized red-speckled horse and the wife become sexually involved;
    the husband continues instructing the wife to drive and retrieve the herd.'
