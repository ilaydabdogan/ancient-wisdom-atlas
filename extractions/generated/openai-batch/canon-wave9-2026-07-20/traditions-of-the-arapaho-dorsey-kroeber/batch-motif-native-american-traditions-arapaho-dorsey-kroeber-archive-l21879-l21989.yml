canonical_text:
  quote: ''
  summary: 'A sequence of Arapaho abstracts about Nih’anqan: he imitates Beaver-Man’s
    arrow feat and is injured; is struck into the ground by a dwarf’s tree-arrow;
    engages in disguise and shapeshifting episodes with Coyote and deer-women; lures
    and kills beavers, ducks, birds, and animals; loses roasted meat to Coyote or
    wolves; and uses fire in retaliation or punishment.'
  language: English, with some Latin phrases in abstracts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Beaver-Man slides down a bank toward upright arrows; the arrows part before
    him, and Nih’anqan later imitates the action several times before becoming stuck
    on the arrow points and being freed by Beaver.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dwarf makes an arrow from a tree, shoots the tree, and the tree strikes
    Nih’anqan and drives him into the ground before the dwarf pulls him out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Coyote and Nih’anqan try to deceive each other; Nih’anqan assumes several
    animal forms, and Coyote recognizes him by smelling.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Coyote assumes the form of a woman or sister in several abstracts, and the
    woman-form turns back into Coyote when Nih’anqan tries to seize or approach it
    sexually.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
- id: obs:5
  text: Two bathing women cover themselves with mud to look like stumps; after Nih’anqan
    approaches and attempts sexual contact, they flee transformed into female deer.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: Nih’anqan persuades beavers to leave their dens or dam, kills many of them
    away from the water, and leaves a male and female to return so that their seed
    may increase.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:7
  text: While Nih’anqan is trapped between squeaking cottonwood limbs, Coyote digs
    out and eats the roasted beaver meat; Nih’anqan later burns the hair from Coyote’s
    legs and says he will have yellow fur around the legs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Nih’anqan gets ducks to dance with closed eyes, kills them during the dance,
    and the survivors flee when one sees him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: After the dancing-ducks episode, wolves steal Nih’anqan’s meat; Nih’anqan
    burns a blind bear in brush, and the wolves also devour the bear and run off mocking.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: In another dancing episode, Coyote calls birds and animals from the four directions;
    Nih’anqan has them dance by a precipice and leap with closed eyes, while Duck
    escapes and announces what has happened; Coyote later eats the roasted food.
  category: sequence
  evidence_refs:
  - ev:10
