canonical_text:
  quote: ''
  summary: The passage gives abstracts of Arapaho traditions. One abstract recounts
    a wife’s sexual relationship with a red-speckled horse, the husband’s discovery
    and killing of the horse, the horse’s revival after the wife’s repeated appeals,
    the return of the herd, and the later procurement of several desired horses. Two
    following abstracts titled “The Man who sharpened his Foot” describe a man who
    eats part of his own leg or sharpens his leg/foot and kills people until defeated.
    A subsequent title, “The Lame Warrior and the Skeleton,” appears without narrative
    detail in this passage.
  language: English
  quote_policy: summarized
