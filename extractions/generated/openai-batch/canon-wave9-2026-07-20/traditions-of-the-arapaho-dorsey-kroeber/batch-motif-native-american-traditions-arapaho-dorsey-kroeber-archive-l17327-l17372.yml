canonical_text:
  quote: ''
  summary: An old woman finds a starving boy, called Little-star or Star-child, beside
    a woman and takes him to her tent. She feeds him berries and meat while checking
    her trapping pits. Food repeatedly disappears from a bucket or bowl. The boy watches,
    sees a large-eyed, long-toothed animal head eating the food, accuses it of theft,
    and kills the monster with his bow by shooting a fatal soft spot near the collar
    bone. When the grandmother returns and is shown the slain thief, she goes to the
    back of the tent and mourns.
  language: English
  quote_policy: summarized
