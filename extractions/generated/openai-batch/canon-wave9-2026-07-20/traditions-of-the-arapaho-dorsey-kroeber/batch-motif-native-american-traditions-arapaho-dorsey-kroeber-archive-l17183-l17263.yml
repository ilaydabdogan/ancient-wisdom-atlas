  text: At the beginning of the passage, a father, mother, and two sons live on earth
    with other people; heaven has no object and the earth is dark.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father decides that the family should leave the people below and go above,
    leaving the people on earth without instructions about how to live.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two sons are identified as the Sun and the Moon.
  category: relationship
  evidence_refs:
