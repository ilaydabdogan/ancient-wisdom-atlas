- id: obs:4
  text: The Sun and Moon discuss whether to take wives from human beings on earth
    or from animals in the water, and their proposed choices are exchanged after the
    Sun says he had been jesting and trying to mislead the Moon.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Moon goes west to a camp near a river, while the Sun goes east to another
    camp.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Near the river trail, the Moon waits by a cottonwood tree in the appearance
    of a large porcupine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Two beautiful women come along; they chase the porcupine, and one woman climbs
    the tree after it while the other remains below.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: When the woman is high in the tree, the porcupine tells her to come with him
    because he came to get her; she obeys and follows him to the sky.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: In the sky, the Moon tells his mother to fetch his daughter-in-law from behind
    the tent, and the mother brings the human woman inside.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Sun returns and tells his mother similarly; she finds a frog with a croaking
    voice and brings her into the tent as the Sun's wife.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Moon ridicules the frog's appearance, while the frog is hurt but restrains
    herself.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The Moon proposes a chewing test with cooked paunch; the frog uses charcoal,
    and her black saliva reveals deceit during the contest.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the Moon ridicules her four times, the frog renounces living with the
    Sun, says her body will be part of the Moon, jumps onto the Moon's breast, and
