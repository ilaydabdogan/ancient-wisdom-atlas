canonical_text:
  quote: ''
  summary: A father, mother, and their two sons, identified as the Sun and Moon, leave
    the dark earth and go above. The Sun and Moon seek wives. The Moon, in the appearance
    of a porcupine, lures a human woman up a cottonwood tree to the sky and makes
    her his wife. The Sun brings a frog wife. The Moon ridicules the frog and exposes
    her charcoal-aided deceit in a chewing contest. After repeated ridicule, the frog
    renounces the Sun and attaches herself to the Moon, explaining the dark spot seen
    on the moon at night.
  language: English
  quote_policy: summarized
