canonical_text:
  quote: ''
  summary: A woman repeatedly goes for water while a white dog follows her. She insults
    the dog and throws sticks at him, but he dodges, watches her, and returns to her
    tipi. Her mother advises her to speak kindly and respectably. Despite the door
    being fastened, the dog enters the lodge at night and lies or sleeps beside her.
    After repeated intrusions, the woman erases the dog's footprints and throws cedar
    into the fire to purify the tipi.
  language: English
