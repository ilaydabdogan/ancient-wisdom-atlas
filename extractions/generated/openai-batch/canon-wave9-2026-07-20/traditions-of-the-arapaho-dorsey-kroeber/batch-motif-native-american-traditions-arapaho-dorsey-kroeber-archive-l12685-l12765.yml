canonical_text:
  quote: ''
  summary: A woman finishes difficult designed articles, bundles them, and leaves
    to search for her missing child. A pitying voice encourages her and says she will
    find him. She travels across plains, ravines, creeks, and rivers until she reaches
    a large river, forest, cliffs, and a solitary tipi. A boy greets her as his mother,
    brings her inside before his grandfather returns, and the tipi is revealed to
    be a large tree with grape-vines. The boy is a Little Owl who speaks her language.
    He hides his mother and her bundle under a cover and arrow sticks while Big Owl
    returns with beef, smells her traces, and repeatedly suspects that she is present.
    Little Owl denies this, warns Big Owl not to disturb his arrows and feathers,
    and goes out as instructed to skin or hunt beef/buffalo.
  language: English
  quote_policy: summarized
