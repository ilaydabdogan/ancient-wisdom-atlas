canonical_text:
  quote: ''
  summary: A daughter tells her mother that a young man entered her tipi at night
    and identified himself as the white dog she had driven away. After becoming sick
    at her parents’ tipi, she gives birth to seven white male puppies. She rejects
    them and orders her little brother to drown them in the river. The boy instead
    hides them in a warm bark-and-grass shelter made near a dead leaning cottonwood
    tree and returns home joyful.
  language: English
  quote_policy: summarized
