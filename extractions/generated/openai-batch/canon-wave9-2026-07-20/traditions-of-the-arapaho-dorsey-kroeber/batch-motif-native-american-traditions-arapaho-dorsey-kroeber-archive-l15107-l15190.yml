canonical_text:
  quote: ''
  summary: A sister transforms animal hides and skins into decorated robes, pillows,
    clothing, and bags by folding them and speaking. Her brother fetches hides and
    skins and states wishes. She kills elk and buffalo by looking at them, summons
    a panther and a bear as dog-like companions, wears a dress marked with sun and
    half-moon ornaments, and produces abundant storage bags filled with dried meat.
  language: English
  quote_policy: summarized
