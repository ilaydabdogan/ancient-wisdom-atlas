canonical_text:
  quote: ''
  summary: An abstract recounts Sun and Moon as brothers. Young women wish to marry
    celestial beings; Moon takes a human woman after appearing as a porcupine in a
    lengthening cottonwood tree and leading her to the sky. Sun has Frog-Woman as
    wife, and Frog-Woman becomes associated with the dark spot on the full moon. Moon
    has a human wife and a buffalo cow wife, whose sons quarrel. The human wife violates
    a prohibition against looking into holes while digging, sees the camp below, and
    tries to descend with her son by sinew strings. Moon discovers the escape and
    sends a stone down the string, killing her. Her child survives near her body,
    goes to the river, leaves tracks, and a young man places a bow and arrows on his
    trail.
  language: English
  quote_policy: summarized
