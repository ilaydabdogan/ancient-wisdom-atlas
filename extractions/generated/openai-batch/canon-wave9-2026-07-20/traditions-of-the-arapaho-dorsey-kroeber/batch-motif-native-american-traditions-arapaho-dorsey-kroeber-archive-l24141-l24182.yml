- id: obs:11
  text: The human wife looks into a hole and sees the camp-circle below, including
    her father's tipi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The human wife saves sinew from beef, makes bowstrings under another pretext,
    and after Moon goes hunting takes her boy and the strings to the marked place.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: She digs a large hole and lowers herself and the boy toward the ground by
