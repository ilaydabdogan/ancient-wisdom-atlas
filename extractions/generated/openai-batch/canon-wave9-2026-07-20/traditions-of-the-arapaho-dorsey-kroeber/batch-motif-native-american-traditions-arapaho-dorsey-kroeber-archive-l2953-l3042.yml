canonical_text:
  quote: ''
  summary: The passage recounts a man publicly explaining the gift and mercy received
    from Buffalo Cow and Calf, the establishment of the Buffalo-Lodge and Old Men's
    Lodge, the sacred bag used in the rites, and the transmission of ceremonial knowledge.
    A following account titled “Origin of the Buffalo Lodge” describes a fasting man
    who sees a repeated vision of lodge dancers and singers transforming into buffalo,
    after which a woman pledges the lodge dance for a sick relative and the dance
    is first made.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who had brought the camp to his place goes to chiefs and head men and
    speaks to a general gathering about his own story and secrets.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man says he has a precious gift of Buffalo Cow and Calf connected with
    abundance of animal food and says his wife shall erect a Buffalo-Lodge for the
    people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stated purposes of the Buffalo-Lodge include peace, prosperity, long life,
    benefit to women, increase of seed, protection and guidance, abundant food, and
    lighter burdens.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The people give thanks and place confidence in the man; the narrative states
    that the people previously lacked tribal law and sympathy toward one another.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man gives old people wisdom, knowledge of natural laws, and degrees with
    the right to conduct ceremonial dances.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A Buffalo-Lodge is erected in the center of the camp-circle and conducted
    by old priests and old women for blessing, increase of the race, and abundance
    of food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The man pledges an Old Men’s Lodge and tells the priests that he obtained
    mercy from Buffalo Cow and Calf in the wilderness with his large family.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: A large sacred bag is revealed to the man and then made under his direction
    by priests and old women; its contents include bear claws, buffalo horns, rattles,
    buffalo tails, paint, tallow used as incense, and stones.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: An Old Men’s Lodge is put up in the center and conducted by old priests and
    old women, and the rites are said to have been transmitted since then.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The place where the man obtained mercy is described as having pointed hills
    and mountains shaped like the sacred bag.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: The sacred bag is described as painted red, containing things pertaining to
    life, and as the watchful eye of the Giver; the passage also gives later custody
    details for the bag and its contents.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: In the following origin account, a man fasts several times, abstains from
    food and water, inflicts pain on himself, and sees a vision.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the vision, women in a lodge wear wide belts and headdresses, carry small
    hoops, blow whistles when moving the hoops, and dance in place; old men at the
    back sing with rattles.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: At the end of the fourth song in the vision, the women turn into a herd of
    buffalo and the old men turn into bulls; one white cow remains after the others
    disappear.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The vision is said to have been shown several times by heisananin, glossed
    as “our father.”
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: A woman with a sick relative hears of the vision, pledges to have the lodge
    dance made, and the dance is then made for the first time.
  category: action
  evidence_refs:
  - ev:7
