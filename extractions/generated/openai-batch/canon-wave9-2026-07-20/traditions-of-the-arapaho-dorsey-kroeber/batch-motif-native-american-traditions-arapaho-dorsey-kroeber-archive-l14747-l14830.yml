canonical_text:
  quote: ''
  summary: The passage begins with the end of a tale in which a skull serves parents
    as if trying to obtain a girl, provides food, threatens to devour people once
    they are fat, and causes them to flee; an editorial note compares this with magic-flight
    tales. The next tale, titled “The Deceived Blind Man,” describes Blind-Man and
    his wife starving in a lonely camp. Blind-Man directs his wife to help him ambush
    a fat buffalo. He shoots successfully, but his wife tells him he missed. She then
    secretly butchers and caches the buffalo, eats the meat, gives him only a small
    bundle of tomatoes, and later washes her hands to conceal the smell of meat.
  language: English
  quote_policy: summarized
