  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wife gathered tomatoes on the prairie and in a ravine, especially in buffalo
    wallows; the couple lived on scant food, chiefly berries and tomatoes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Blind-Man instructed his wife to watch for a fat buffalo, guide him into a
    deep ravine, place his bow and arrow in position, aim at the heart, and tell him
    when to shoot.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The fat buffalo was identified by a curly bunch of hair on the center of its
    back called the “black bird.”
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The wife saw a buffalo herd, led Blind-Man to the ravine, positioned the bow
    and arrow toward a fat buffalo, and told him to shoot.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After shooting, Blind-Man heard signs that the arrow pierced the animal and
    that the buffalo was vomiting blood and staggering, so he concluded he had killed
    it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The wife told Blind-Man that he had missed the vital spot and hit the thigh,
    urged him to return to the tipi, and he yielded despite doubting her truthfulness.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The wife secretly took a whetstone and knife, went to the dead buffalo, skinned
    it, removed the meat and hide to thick timber, ate fat meat, and hung up the meat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The wife returned to the tipi with a small bundle of tomatoes and told Blind-Man
    that finding them was hard work.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The next day the wife went to the meat cache, chopped bones to make tallow
    and lard, ate good meals, picked tomatoes, and washed her hands with water and
    dirt to remove the smell of meat.
  category: action
  evidence_refs:
  - ev:8
