canonical_text:
  quote: ''
  summary: The passage describes sisters living in or using a cave. On successive
    mornings, the oldest sister sees herds of elk, deer, antelope, and mountain goats
    and calls another sister to look; the animals fall dead. The sisters skin them,
    slice the meat, bring materials to the cave, and command hides and horns to become
    clothing, bags, furnishings, spoons, leggings, and moccasins. The oldest sister
    then says they need a sentinel, summons Bear from a grove near a mountain, places
    Bear at the cave door, and summons Panther from a rugged mountain or rocks.
  language: English
  quote_policy: summarized
