canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a young man survives a dangerous
    father-in-law, sees the father-in-law killed by a bull, burns the body until the
    ashes become white clay for arrows, learns of earlier killed sons-in-law, returns
    to his people, recounts destroyed prior generations, leaves the story as a teaching,
    and goes up to his father. It then begins the tale “Blood-Clot-Boy,” set in deep
    winter, where a harsh son-in-law withholds meat from elderly parents-in-law, the
    younger wife secretly feeds them, and the old man finds a frozen blood clot in
    the snow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man follows the bull near a tree; the old man shoots at the bull
    without effect, comes down from the tree for the fourth shot, and is charged,
    hooked, thrown up, and torn apart by the bull.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man burns the old man for four days until only ashes remain; the
    ashes become white clay used for painting arrows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man asks his wife and her mother about the old man’s earlier actions;
    the old woman says visiting men became the old man’s sons-in-law, were sent four
    times to get arrow sticks, and were killed on the fourth attempt.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman says three previous young men were killed and their bodies were
    fed to an animal, probably a water animal because there were no tracks.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young man says he will take the women to the camp from which he came,
    and after four days of travel he invites all the people and tells them his story.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The young man recounts several prior “lives” or generations: the first and
    second were destroyed for wrongdoing, the third consisted of cannibals and was
    wiped out, and the fourth was the old man whose body consisted of life valuables.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The young man instructs old men and old women to preserve and repeat the story,
    saying the dangerous man is gone but his body and ashes will be seen on arrows.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: At night the young man goes up to his father; the passage says he left the
    myth and its teaching with the people and gives his name as Hixt-caba inen, Above-Man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The next tale begins in winter with deep snow; a man lives with two wives
    who are sisters and with his elderly parents-in-law at a hunting camp.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The son-in-law is described as hard and pitiless toward the old people; he
    has much meat and many hides while the old people are nearly starved, and he forbids
    his wives to give their parents meat.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The younger wife secretly gives meat to her elderly parents despite her husband’s
    command.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The old man follows the hunter to pick up leavings, finds a frozen clot of
