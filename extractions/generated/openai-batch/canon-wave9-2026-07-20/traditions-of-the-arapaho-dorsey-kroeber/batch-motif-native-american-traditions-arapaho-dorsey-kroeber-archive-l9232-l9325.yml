canonical_text:
  quote: ''
  summary: Splinter-Foot is called by outside voices to bring out a ball during a
    game. She pierces the ball with an awl, is led into the crowd by it, runs it to
    the goal, wins the game, and is then led away. She passes buffalo bulls and reaches
    a main buffalo herd ruled by Lone-Bull, who treats her as his wife, seats her
    covered in the center of a crescent-shaped gathering, and jealously prevents others
    from approaching or speaking to her. Her father and the young men return to find
    her gone and believe she is in Lone-Bull's hands. They send Crow to retrieve her,
    but Lone-Bull threatens Crow, who returns unsuccessful. They then send Magpie
    toward Lone-Bull's horseshoe-shaped gathering during a big-wheel game.
  language: English
  quote_policy: summarized
