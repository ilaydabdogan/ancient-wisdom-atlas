  quote: ''
  summary: The passage closes one tale in which a praying-bush or stick is treated
    as Praying-young-man, clothed, awakened, sent to seek women, then displaced when
    Nih’ancan steals his clothes, impersonates him, and marries the woman intended
    for him. The passage then begins the tale titled “Nih’anpan and the Seven Sisters,”
    describing a man and wife whose daughters repeatedly receive marriage proposals
    through female messengers; the parents consent, but the daughters refuse.
