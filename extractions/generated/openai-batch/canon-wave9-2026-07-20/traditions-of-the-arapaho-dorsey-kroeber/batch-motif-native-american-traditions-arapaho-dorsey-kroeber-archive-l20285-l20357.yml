canonical_text:
  quote: ''
  summary: The passage contains the close of an Elk-woman and Buffalo-woman episode,
    in which Buffalo-woman is trapped while attacking a sweat-house barrier and killed
    by Elk-woman, followed by an etiological statement about buffalo becoming game
    and elk living in mountains. It then gives the opening of tale 145, where Blue-Feather
    seeks a second wife, and a footnote described as another version, in which Blue-bird
    has Buffalo-woman and Elk-woman as wives, Buffalo-woman leaves with her calf,
    and Blue-bird follows through buffalo herds and undergoes a four-night wakefulness
    test involving myth-telling.
  language: English
