canonical_text:
  quote: ''
  summary: A man travels with a woman who repeatedly becomes a buffalo cow when a
    tipi disappears at dawn, then becomes a woman again when he approaches. They arrive
    at her father's camp-circle, where she hides him under her robe so that they look
    like one person. The father accepts him as son-in-law and orders the daughter
    to kill and boil one of her little brothers, who are yellow calves; the calf's
    hide later becomes a live animal again. The husband is kept inside but secretly
    looks out and sees people emerging from a black cottonwood snag, running through
    rows, and being slaughtered for food. He arranges his own round-up, prepares a
    bow and four arrows, and has pemmican made from a brother-in-law's flesh while
    his wife gives birth to a boy. At the snag he kills Cut-Nose, has the people taste
    the pemmican, and they are saved from death. The husband becomes chief, and Lone-Bull
    is selected to challenge him for ruling power.
  language: English
  quote_policy: summarized
