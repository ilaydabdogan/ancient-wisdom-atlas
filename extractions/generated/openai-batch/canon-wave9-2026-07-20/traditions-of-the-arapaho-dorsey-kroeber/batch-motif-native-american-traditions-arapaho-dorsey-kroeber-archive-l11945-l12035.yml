canonical_text:
  quote: ''
  summary: The passage contains three bear narratives. In the first, two brothers
    encounter a black she-bear; after one brother approaches her, she tracks them
    into camp and lies between them until a council arranges for Dog Soldiers to kill
    her. In the second, a husband discovers a bear with his wife, has his brother
    shoot and wound the bear, kills his wife, and the wounded bear brings other bears
    to attack the camp. In the third, a bear burns two sleeping old men with a firebrand
    so that they blame and fight each other while the bear laughs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two brothers without experience with women go out on the prairie, see a distant
    person, and later find a black creature lying under a tree near woods along a
    creek.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One brother removes his clothes, approaches the creature, and sees that it
    is a black she-bear lying on her back and asleep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brother tells the other to leave and calls the animal powerful; after
    waking, the she-bear smells and tracks the human trail.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The brothers take a zigzag route through the camp to obscure their scent,
    but the she-bear tracks them to their tipi and lies between them on their bed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father has a separate tent put up for the boys and the bear; a council
    decides to kill the bear, and Dog Soldiers kill her while she sleeps at midnight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A source note says the first narrative was told by Francis Lee and was said
    to have been obtained from the Sioux.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: In “The Adulterous Bear,” a husband suspects his wife because she often wants
    to sleep at the back of the bed, while he wants her toward the fire.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The husband quietly returns, sees a bear partly entering the tent, and tells
    his brother to wait nearby with a gun.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The brother wounds the fleeing bear, and the husband accuses his wife of being
    guilty with the bear and shoots her dead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The wounded bear reaches the mountains, shows his wound to other bears, and
    the bears assemble to attack the camp.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The bears kill some people before the people fight them with bows and arrows
    and frighten them away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In “The Bear and the Old Men,” two old men sleep in a tent with their backs
    to the fire while a bear enters with a burning stick.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: The bear burns each old man in turn; the old men blame each other, fight with
    stone mauls, and the bear leaves laughing.
  category: sequence
  evidence_refs:
  - ev:9
