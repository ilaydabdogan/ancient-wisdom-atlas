canonical_text:
  quote: "“I have come back to show you a dance.”"
  summary: The passage first tells of young men traveling for war who meet a woman
    recognized as one who had died and been buried near the trail. She accompanies
    them, they return victorious, and she instructs the camp in a victory dance and
    related dance forms before going back where she came from. The passage then begins
    a separate episode in which Nih'angan learns from a man how to send his eyes into
    cottonwood tree-tops, is warned not to use the trick excessively, and repeats
    it proudly until his eyes hang separated from him.
  language: English
  quote_policy: quoted
