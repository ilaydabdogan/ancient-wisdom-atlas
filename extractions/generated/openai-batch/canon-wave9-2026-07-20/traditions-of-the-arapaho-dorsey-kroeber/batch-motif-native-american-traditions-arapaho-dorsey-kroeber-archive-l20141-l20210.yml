canonical_text:
  quote: ''
  summary: 'In the Blue-bird episode, a calf substitutes for its two-legged father
    in a race against young buffalo and wins. Further tests follow before father and
    son may return: the father must identify the calf among identical calves, the
    calf dances for four days on four turtles, and the father must remain awake through
    four nights of myth telling. At dawn on the fourth night the father falls asleep;
    he is laid with his head toward the sunset and trampled by the buffalo until only
    a blue plume remains and flies away.'
  language: English
  quote_policy: summarized
