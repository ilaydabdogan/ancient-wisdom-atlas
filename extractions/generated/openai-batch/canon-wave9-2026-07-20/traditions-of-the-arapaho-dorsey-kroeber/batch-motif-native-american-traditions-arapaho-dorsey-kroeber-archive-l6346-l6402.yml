canonical_text:
  quote: ''
  summary: An editorial note cites parallels for sharpening a leg and for imitation
    of a host by diving through ice. In the narrative, a man at a frozen lake climbs
    onto a branch, sings four times, jumps through the ice, remains out of sight,
    and emerges near the opposite shore carrying two beavers. Nih'ancan observes him,
    claims to have the same powers and a similarly painted tent, then runs home and
    imitates the other man's lake setting, painted tent, poles, fireplace, feathers,
    tails, and seating arrangement before receiving the other man as a guest.
  language: English
  quote_policy: summarized
