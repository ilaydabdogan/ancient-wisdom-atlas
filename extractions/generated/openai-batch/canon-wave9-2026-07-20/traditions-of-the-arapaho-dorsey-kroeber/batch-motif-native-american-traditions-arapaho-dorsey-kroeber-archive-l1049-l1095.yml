canonical_text:
  quote: ''
  summary: A girl flees a rolling devouring wart after others are swallowed. She asks
    a wood-cutting man for help and promises marriage if saved. After fourfold exchanges
    and circling, the man confronts the wart, blocks its mouth with a bow, breaks
    it open, and revives the dead boy by kicking him four times and commanding him
    to rise. The siblings are named River-woman and Beaver-Toot or Beaver-foot. The
    man brings them home to Crow-woman, who is jealous. A note identifies the man’s
    rear eye as marking a horned water monster and connects the larger myth with water,
    flood, and the origin of waters on earth.
  language: English
  quote_policy: summarized
