canonical_text:
  quote: ''
  summary: After a successful buffalo chase, the camp has meat, hides, feasting, work
    on hides, and games. A mother sends her newly married daughter to fetch water.
    On the way back, a well-dressed young man emerges from the bushes and says he
    was the animal she admired during the hunt and wished to marry. The girl admits
    the statement, leaves the water vessel, and goes away with him along the river
    and over a divide. At the mouth of a creek they meet Scabby Bull beside a black
    dead tree. The young man introduces her as Scabby Bull’s daughter-in-law. Scabby
    Bull instructs her to close her eyes and produces fine clothing and ornaments
    for her, after which she dresses in them.
  language: English
  quote_policy: summarized
