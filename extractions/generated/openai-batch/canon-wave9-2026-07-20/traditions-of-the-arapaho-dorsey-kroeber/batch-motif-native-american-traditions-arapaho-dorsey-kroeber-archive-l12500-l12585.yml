canonical_text:
  quote: ''
  summary: The passage contains the end of a rabbit and skunk encounter, the story
    of Turtle’s War-party with anthropomorphized body parts traveling and declaring
    their places, and the opening of The Girl who became a Bear, in which a girl playing
    bear becomes a bear, attacks the camp, and pursues two children helped by a dog
    and a magical ball.
  language: English with some Latin passages
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rabbit and skunk argue over which of them must step aside so the other can
    pass.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skunk claims his eyes are good, says he can see under the ground, and invites
    rabbit to come close and look at his tail.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Skunk discharges against rabbit; rabbit jumps aside, shuts his eyes, and rolls
    about because it smarts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Skunk says he will go where he intended and says he has given rabbit medicine.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A people are going to war, and an old man is told to announce that all should
    prepare to go.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Turtle decides to go to war after hearing the announcement, starts after the
    people have left, and is later overtaken or accompanied by wart and vulva.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The war party camps repeatedly; after four days a heavy snowfall prevents
    further travel and the party returns.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: After the return, turtle leaves the trail, wart stops in the middle of the
    trail outside the camp-circle, and vulva goes to the camp and speaks of staying
    with women.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Turtle says he will be regarded as male because of his red eyes and feet,
    will live on the ground and in grass, and describes sexual activity as his work.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Children play at being bear in the sand; an older girl asks for claws, ties
    them to her hands, and plays the bear in sand-hills near a den and berries.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The girl playing bear attacks children gathering berries in the play, and
    once tears her younger brother’s back.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The older girl tells the children not to reveal that she has turned bear and
    threatens to come to camp if they tell.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The younger brother conceals his injury at first, then tells at night that
    his elder sister has become a bear; dogs bark and the bear enters camp.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Children and women mount swift horses and flee, while young men stay behind
    to fight the bear.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The younger brother and his sister are left tied together to a cottonwood
    tree; a scabby dog gnaws and tears the rope, freeing them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The bear kills those who stayed behind and follows the fleeing children.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The two children use a ball that carries them along when kicked.
  category: object
  evidence_refs:
  - ev:9
- id: obs:18
  text: The ball tells the boy to throw it up three times and kick it up the fourth
    time so that the children will rise to the sky and be happy.
  category: speech
  evidence_refs:
  - ev:9
