canonical_text:
  quote: ''
  summary: 'The excerpt first concludes an episode in which a woman returns to her
    family with a child and explains that a dwarf seized her, took her to the dwarfs''
    camp, married her, and fathered the child. The dwarf provides meat through her,
    then departs to another country or tribe, saying the boy will take his place.
    The excerpt then begins the story of Sleepy-Young-Man and the Cannibals: in a
    well-provided camp-circle, an attractive young man is habitually lazy and sleeps
    late while his father repeatedly admonishes him to get up, mentions cannibals,
    and discusses with the mother how to make him act like a man.'
  language: English
  quote_policy: summarized
