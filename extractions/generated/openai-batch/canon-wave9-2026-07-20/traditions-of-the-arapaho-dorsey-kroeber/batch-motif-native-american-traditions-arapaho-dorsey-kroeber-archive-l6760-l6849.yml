canonical_text:
  quote: ''
  summary: An opening variant describes dwarfs helping at a buffalo kill, requesting
    the “heaviest” meat, and dying when a person finds and pricks their hanging hearts;
    a remaining dwarf boy is killed the same way. In tale 65, a hunter finds a solitary
    tipi with a blind dwarf who expects to eat him after his relatives return. The
    hunter sharpens a stick and pierces suspended hearts identified as those of the
    dwarf’s relatives and then the dwarf’s own heart, killing them. The dwarfs are
    described as cannibal small people who keep their hearts at home; later people
    send a prairie fire after their camp-circle, killing many while a few escape to
    a sand-bar.
  language: English
  quote_policy: summarized
