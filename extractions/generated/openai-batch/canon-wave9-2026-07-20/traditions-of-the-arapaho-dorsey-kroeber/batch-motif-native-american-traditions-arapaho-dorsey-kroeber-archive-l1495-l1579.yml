canonical_text:
  quote: ''
  summary: The passage describes ceremonial lodges and regalia made from a painted
    skin record and approved by Nih'anpan/Nih'angan. It explains that the lodges were
    given to teach the people and later pledged for sickness and other causes. Notes
    describe a buried painted record, a defeated skull made into a fast-wheel later
    associated with the railroad, and a comparison to pursuit by a rolling head or
    stone. The next narrative begins with a hungry man hunting a Buffalo Cow, who
    speaks and offers knowledge of society lodges for the benefit of the man and his
    people.
  language: English
  quote_policy: summarized
