canonical_text:
  quote: ''
  summary: A father gives two boys a netted wheel and arrow sticks and warns them
    not to throw the wheel with the wind. They deliberately try it, and a whirlwind
    carries both away to a distant land. Later, an old woman in a moving camp finds
    one of the boys grown in tall grass and adopts him as her grandson; he is called
    Found-in-Grass. A chief offers his eldest daughter to whoever kills a kit-fox
    in a tree. Found-in-Grass, though ridiculed for his appearance, kills it, while
    Crow falsely claims the deed. Found-in-Grass has his grandmother take a bunch
    of fur from the animal; by morning it becomes a superior full hide, and the chief
    gives him his other daughter as wife. Crow and Found-in-Grass are housed with
    their wives in one tipi, and Crow-Woman reacts with disgust to Found-in-Grass’s
    appearance.
  language: English
  quote_policy: summarized
