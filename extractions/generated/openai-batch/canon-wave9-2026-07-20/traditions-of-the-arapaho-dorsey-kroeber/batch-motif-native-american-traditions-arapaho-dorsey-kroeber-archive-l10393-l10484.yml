canonical_text:
  quote: ''
  summary: The passage describes a household with a husband, his wife, and the husband's
    brother. The husband repeatedly leaves to hunt while the wife tries to induce
    the brother-in-law to love her. The brother-in-law refuses because of loyalty
    to his brother and withdraws to a hill weeping. After repeated refusal, the wife
    digs and conceals a deep hole beneath the young man's bed.
