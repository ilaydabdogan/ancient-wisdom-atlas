canonical_text:
  quote: ''
  summary: A powerful bull keeps a girl, described as his wife and the young men's
    daughter, with him. The young men try to recover her by sending birds and insects,
    but the bull rejects them. The blackbird advises using mole and badger, who tunnel
    underground, help the girl leave a robe decoy, and bring her back. During the
    flight the group asks a stone and then a cottonwood tree for help; the tree provides
    refuge in its branches and top nest while they wait for the pursuing bull.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bull leads the herd to water and touches his robe-wearing wife as a sign
    for her to go with him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young men are lonely and think about recovering their daughter, who has
    been away for a year.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young men send flies and then a magpie toward the bull, but the bull frightens
    or orders them away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Because the young men had given the blackbird to be part of the bull's body,
    they send the blackbird; it lands on the bull's back and sings, but the bull rejects
    it too.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The blackbird tells the young men it cannot help directly and identifies the
    mole and badger as unseen, cunning animals who can recover the girl.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The mole and badger travel underground at night with arrows, with the mole
    going ahead and the badger enlarging the hole.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The mole emerges under the girl's blanket and gives her arrows; she sticks
    them in the ground and rests her robe on them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The mole and badger say they have come to take the girl back; although she
    is afraid at first, she consents, leaves her robe in her usual sitting position,
    and goes through the hole to the young men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: During the flight, the group asks a stone for help; the stone says it can
    do nothing because the bull is too powerful.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The group rests, continues with one person carrying the tired girl, crosses
    a river, passes through timber, and comes onto the prairie.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The group asks a lone immense cottonwood tree for help; the tree tells them
    to run around it four times, and they climb into its branches and top nest to
    wait for the pursuing bull.
  category: sequence
  evidence_refs:
  - ev:5
