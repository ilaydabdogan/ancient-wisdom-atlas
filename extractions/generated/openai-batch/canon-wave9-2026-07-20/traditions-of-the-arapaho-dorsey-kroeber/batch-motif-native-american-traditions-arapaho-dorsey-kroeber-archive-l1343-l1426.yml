canonical_text:
  quote: ''
  summary: The passage recounts flood survival, renewed earth-making through mud brought
    from below the water by a turtle, the making of land, sky, and corn, the assignment
    of languages and the Arapaho place at the middle of the earth, a future flood
    condition, an animal race between bull and horse, the ordaining of human mortality,
    and a later episode in which a banished murderer encounters the mother of buffalo
    and a coiled hiintcabiit whose appeasement is followed by buffalo appearing near
    the tent.
  language: English
  quote_policy: summarized
