canonical_text:
  quote: ''
  summary: 'The passage contains several Arapaho animal and war-party episodes: men
    see a bear painting itself yellow by water; a war party deceives a bear by feigned
    death; Bear and Skunk quarrel over a road, and Skunk defeats Bear by a trick involving
    his body and excrement. The passage then explains ritual and medicinal meanings
    connected with Skunk, including medicinal spitting, skunk-hide bags, and a remedy
    for skunk stinging. It ends with the opening of another tale in which young men
    on the war-path hear a woman crying near a creek and suspect an enemy.'
  language: English with brief Latin passages
  quote_policy: summarized
