canonical_text:
  quote: ''
  summary: A young woman wishes to marry a swift steer, who later appears as a young
    man and takes her to a buffalo camp. Scabby-Bull provides her clothing, and the
    buffalo husband appears in steer form. Her human husband mourns and fasts; Gopher
    helps recover her through underground travel, colored arrows, and a robe decoy.
    Buffalo pursue the woman and her human husband, surrounding them in seven cottonwood
    trees until Gopher tunnels them home. After returning, the woman selects elders,
    pledges the Buffalo-Women's lodge, and teaches commandments of the Giver.
  language: English
  quote_policy: summarized
