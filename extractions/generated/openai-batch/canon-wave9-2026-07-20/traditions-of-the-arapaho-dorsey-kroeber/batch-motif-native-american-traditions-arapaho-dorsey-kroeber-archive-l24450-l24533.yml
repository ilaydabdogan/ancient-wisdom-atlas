canonical_text:
  quote: ''
  summary: 'Abstracted variants of the Found-in-Grass narrative: a woman offers valuables
    and herself to a stranger; a mother is restored to life; twin boys survive the
    killing of their mother, revive her, and kill Tangled-hair, a water monster, and
    thunders; one child is blown away and found in grass by an old woman; Crow steals
    a captured animal and gains a marriage; Found-in-Grass provides buffalo, becomes
    a victorious war leader through a bladder bag that releases warriors, transfers
    the bag to Nih''angan, and later resurrects him after his death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In one summarized version, a woman offers a stranger several valuable items
    and finally herself as a food dish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A red arrow is used first in restoring the mother to life.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The twins kill a water monster, Thunder-bird, Tangle-Hair, and a woman; after
    shooting at a little bird, they pick up the last arrow shot, causing a whirlwind.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The foster-mother of Found-in-Grass makes him a bow of rib, arrows, and a
    netted wheel; with the wheel he provides buffalo, and he also turns chips into
    buffalo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: A chief's older daughter is offered for the captor of a red kit-fox; Found-in-Grass
    traps it, Crow steals it, Crow gets the older daughter, and Found-in-Grass gets
    the younger daughter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: Found-in-Grass returns home with Crow and his wife as servants; chiefs and
    warriors feast in his tipi, and the tribe is over a great famine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Found-in-Grass makes a bladder bag, fills it with porcupine quills, cleans
    a war lance, and starts alone on the war-path.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: When enemies approach him, Found-in-Grass opens the bladder bag, and thousands
    of warriors come out, attack his enemies, take scalps, and return to the bag.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After Found-in-Grass returns, the people hold a large scalp-dance, and he
    becomes the chief's warrior; he goes alone on the war-path four times and returns
    victorious.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Nih'angan receives the bag from Found-in-Grass with instructions and uses
    it to defeat enemies and return with scalps.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: On a later expedition, Nih'angan is shot dead after neglecting the bag; a
    shot at the bag releases warriors, and Found-in-Grass later puts the warriors
    into a new bladder bag and resurrects Nih'angan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: A hunter forbids his wife to look if anyone comes; Tangled-hair comes, she
    looks the fourth time, he enters the tent, kills her, and throws away her unborn
    boys, one behind the door and one into a spring.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The father finds the two boys playing, catches them, and the boys tell him
    to make bows and a sweat-house for their mother; they shoot upward until their
    mother leaves the sweat-house alive.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The sons visit Tangled-hair, louse him until he sleeps, tie his hair fast,
    and kill him by putting hot stones into his open head.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Despite their father's warnings, the sons go to a stream, a mountain, and
    sage brush, where they encounter a water monster, thunders, and a storm.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
- id: obs:16
  text: Spring-child is blown away by the wind, is found in the grass by an old woman,
    and lives with her.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The boy traps a porcupine, Crow steals it, Crow marries the older daughter,
    and the boy is given the younger daughter.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:18
  text: At night the boy becomes a handsome young man; later he turns into a handsome
    young man and makes buffalo for the people.
  category: sequence
  evidence_refs:
  - ev:12
