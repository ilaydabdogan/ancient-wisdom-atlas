- id: ev:6
  type: summary
  locator: 24500-24508
  quote_or_summary: A hunter forbids his wife to look if anyone comes; Tangled-hair
    enters after she looks, kills her, and throws away her unborn boys; the father
    later finds the boys, and they use bows and a sweat-house so that their mother
    comes out alive.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 24509-24514
  quote_or_summary: Despite warning, the boys visit Tangled-hair, louse him until
    he sleeps, tie his hair, and kill him with hot stones placed into his open head.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 24514-24518
  quote_or_summary: The father forbids the boys to go to a stream; they go, a water
    monster fails to drown them, they ride on him, and they kill him.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 24518-24522
  quote_or_summary: The father forbids the boys to go to a mountain; they go, kill
    young thunders, are pursued by the old thunder, challenge her with arrows in a
    rock, and she is dashed to death.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 24522-24525
  quote_or_summary: The father forbids shooting prairie chickens in sage brush; the
    boys do so, a storm comes, Spring-child is blown away by the wind, and an old
    woman finds him in the grass and lives with him.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 24525-24531
  quote_or_summary: A man announces that whoever captures a porcupine shall marry
    his daughter; the boy traps it, Crow steals it, Crow marries the older daughter,
    and the boy receives the younger daughter.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 24531-24533
  quote_or_summary: At night the boy becomes a handsome young man; the older sister
    ridicules him; he turns into a handsome young man and makes buffalo for the people,
    and his sister-in-law falls in love with him.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-of-the-arapaho-dorsey-kroeber.md
