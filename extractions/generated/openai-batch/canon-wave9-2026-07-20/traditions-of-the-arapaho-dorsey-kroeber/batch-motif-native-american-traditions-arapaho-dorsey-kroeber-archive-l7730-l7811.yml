canonical_text:
  quote: ''
  summary: The passage closes an anecdote about Hairy-Face, whose prohibition against
    fish and other water animals is violated by her grandson before her death, and
    notes a similar Pawnee tale. It then gives the tale of a hunter who wounds a calf
    inside a buffalo cow; the calf follows him, appears at night as a shining, snake-like
    water monster, is appeased by the hunter's wife with gifts and prayer, and is
    placed in the river. The passage ends with the opening of another water-monster
    story at Little Wind River.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hairy-Face refuses to eat fish, water turtles, or other water animals, and
    forbids people from bringing such animals into her tipi against her will.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Black-White-Man brings fish into Hairy-Face's tipi after she warns that doing
    so would let him see her die soon; she dies soon afterward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that Hairy-Face was regarded as a woman doctor and later
    received confidence and reverence from the people.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A source note says the tale was told by Adopted and that the Pawnee have a
    similar tale.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: A hunter kills and butchers a pregnant buffalo cow, opens the uterus, bruises
    the calf's head, and hears the calf speak to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The frightened hunter takes only one rib home, sees the calf following him,
    and later cannot eat because his mind is on the calf.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: During a cold, snowy night, something walks around outside the tent and enters;
    a shining look from the animal blinds the man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The wife sees the animal winding around inside the tent; it coils until it
    has the appearance of a snake, filling the inside of the tent and enclosing the
    outside.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The man tells his wife to get a shell gorget, eagle feathers, red cloth, and
    a white buffalo robe.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The wife addresses the animal as 'last child,' offers the objects as adornments
    and clothing, asks it to become small enough to receive them, and the snake becomes
    smaller.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The wife calls the being one with miraculous power and the owner of waters,
    asks it to accept gifts, benefit humans, and allow safe river crossings when people
    make offerings at a river or spring.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The wife carries the being to the river and puts it into the water; afterward
    the man and wife live without fear or trouble.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the opening of the next tale, Northern Arapaho are camped along the Little
    Wind River, and two women going for water see an animal's back in the middle of
    the channel.
  category: setting
  evidence_refs:
  - ev:8
