canonical_text:
  quote: ''
  summary: An abstracted Arapaho narrative episode describes a son-in-law controlling
    buffalo meat, old people finding a blood clot that becomes Blood-Clot-Girl when
    boiled, the family fleeing to another camp-circle, Blood-Clot-Girl marrying a
    young man, a tipi being transformed, and a white crow being trapped, blackened
    with smoke, and assigned scavenging food after it hindered a buffalo hunt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The son-in-law repeatedly has the old people skin and cut up buffalo and deliver
    hide and beef, while directing that only small muscles be sent back for them to
    eat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a wounded buffalo cannot be tracked, the old man follows the herd trail,
    finds a clot of blood on snow, and brings it back for blood soup.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old woman places the blood in a vessel of water over fire; after a baby
    cry, she empties the vessel and finds a healthy-looking girl.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The girl is wrapped in remnants of buffalo hides, is called Blood-Clot-Girl,
    grows quickly, and uses a manly voice when sent to ask for dried tenderloin.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The son-in-law sees the little girl and expresses interest in having her later;
    the boy refuses and the old people and children leave at midnight for another
    camp-circle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the big camp-circle, the family with Blood-Clot-Girl is welcomed during
    a famine.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: A young boy or young man has his grandmother ask for Blood-Clot-Girl in marriage,
    and the request is granted on the condition of dependable support.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the young man asks that the fireplace be swept and the tipi poles straightened,
    the old tipi changes overnight into a large, attractive, white tipi.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A white bird helps a buffalo herd escape, but during a later hunt it is caught
    by a bowstring trap fastened to both legs and identified as a white crow.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The white crow is kept hobbled, held over dark smoke until its body becomes
    black, has its bill rubbed on buffalo chips, and is told its future food will
    be chips, eyes, and skulls of animals.
  category: sequence
  evidence_refs:
  - ev:9
