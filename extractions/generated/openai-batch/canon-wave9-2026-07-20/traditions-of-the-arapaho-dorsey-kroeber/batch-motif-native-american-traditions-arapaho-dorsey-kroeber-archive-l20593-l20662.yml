canonical_text:
  quote: ''
  summary: 'Blue-Feather follows the buffalo-like trail of his wife and child to a
    buffalo herd. Calf-Boy guides him into the herd while hiding him from Main-Bull,
    the grandfather. Main-Bull sets tests before Blue-Feather can take Calf-Boy back:
    identifying the calf among identical calves, completing a four-day-and-night dance,
    and winning a race to a high hill and back. Calf-Boy helps by signaling, dancing,
    and racing for his two-legged father. Blue-Feather ties his blue eagle breath-feather
    headdress to Calf-Boy''s tail, making him swift enough to win the race while other
    buffalo fall on the hill.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tracks of Blue-Feather's wife and child appear as those of a buffalo cow
    and calf, and Blue-Feather follows the animal trail to find them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: From a divide, Blue-Feather sees buffalo herds grazing on the broad prairie,
    and the cow and calf have gone among the herd.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Calf-Boy runs to Blue-Feather and says that Main-Bull, his grandfather, is
    unmerciful to strangers; his mother has instructed him to tell Blue-Feather to
    cover his face.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Blue-Feather covers his head and is led by Calf-Boy into the herd; on the
    way, he steps on round objects identified as buffalo skulls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Main-Bull says Blue-Feather cannot get Calf-Boy back unless he identifies
    him among the herd of calves.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Calf-Boy tells Blue-Feather he will shake his right ear and move his left
    foot, but the calves all make the same movements; on the fourth circuit, Blue-Feather
    identifies Calf-Boy.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Main-Bull next requires Blue-Feather to dance with the buffalo for four nights
    and four days; Calf-Boy offers to dance for his father because his father has
    only two legs.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The buffalo dance around Main-Bull, and afterward the ground has a rough appearance
    like ground in wet places.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A parenthetical note states that the two circular pieces of earth used in
    the Sun-dance ceremony have a slight relation to the rough places where the buffalo
    danced.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: Main-Bull then requires a race to a big high hill and back; Calf-Boy is allowed
    to run for Blue-Feather because Blue-Feather has only two legs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Blue-Feather ties his headdress of blue eagle breath-feather to Calf-Boy's
    tail before the race.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Main-Bull, assisted by minor bulls, sings four songs, and the race begins
    at the close of the fourth song.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The attached blue eagle breath-feather makes Calf-Boy run swiftly and barely
    touch the ground; Calf-Boy wins the race.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Other buffalo tumble down the hill after the turning point; some are killed
    and others are badly crippled.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: After the race, Blue-Feather unties the headdress from Calf-Boy and puts it
    back on his own head.
  category: action
  evidence_refs:
  - ev:9
