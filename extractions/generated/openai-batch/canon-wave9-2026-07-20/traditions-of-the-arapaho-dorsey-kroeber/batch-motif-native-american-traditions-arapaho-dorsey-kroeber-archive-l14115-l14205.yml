canonical_text:
  quote: ''
  summary: A husband prepares a split wing feather with medicine smoke and hides it
    under bedding before attending a Star society hand-game. He sends the society
    servant, who has been visiting his wife, back to the tipi for arrows. The servant
    and the wife attempt a sexual encounter and become physically stuck together on
    the bed. A second messenger finds them, is asked not to light the tipi, and goes
    to notify the servant’s older brother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Star society is invited to the head man’s tipi at night to play hand-game,
    with betting arranged.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband delays going to the hand-game and remains near his own tipi while
    his wife stays with him that day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young man who had previously come to see the wife enters the couple’s tipi
    and tells the husband he should attend the hand-game for betting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband splits a small wing feather, takes medicine from a bag tied to
    his scalp-lock, places incense on charcoal from the fireplace, and makes smoke.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The husband asks the wife to get wood and make light inside; she objects that
    if he leaves her alone the fire should go out.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: While the wife goes for wood, the husband holds the wing feather over the
    charcoal to be incensed for a certain purpose and puts it under the blanket at
    the bottom of the lean-back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the hand-game the husband loses articles and sends the servant to his tipi
    for arrows from the bow-case and calf-hide quiver.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The servant finds the wife alone and awake, proposes taking advantage of the
    opportunity, and she warns that the husband had threatened punishment if she showed
    love to him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The wife then tells the young man to make haste.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: After a while the young man tries to get loose from the wife but cannot; the
    two adhere and sit together on the bed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Star society becomes suspicious about the absent servant while the husband
    continues to delay going himself for the arrows.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A second young man is sent as a messenger to get the arrows and finds the
    couple sitting fast together on the bed.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The second messenger begins to make light in the tipi by pushing wood into
    the fire, but the guilty young man asks him not to make a light and to fetch his
    older brother.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The second messenger tells the older brother that his brother became involved
    with the man’s wife and that the two are sitting on the bed facing each other.
  category: speech
  evidence_refs:
  - ev:11
