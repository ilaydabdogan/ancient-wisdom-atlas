canonical_text:
  quote: ''
  summary: Nih’ancan challenges Jack-Rabbit to a wakefulness contest and is covered
    while asleep. As Nih’ancan travels, repeated defecations are followed by apparent
    young jack-rabbits running away; he tries to trap and kill them under his robe,
    but finds only excrement. He gives a robe to a stone, repeatedly reclaims it when
    it appears as a perfumed quilled buffalo robe, and finally takes it away; the
    stone then rolls after him while he flees through hills and timber.
  language: English
  quote_policy: summarized
