canonical_text:
  quote: ''
  summary: The passage summarizes several Arapaho narrative abstracts. In the opening
    continuation, sisters in a cave appoint Bear and Panther as sentinels, make a
    son from a red berry stick, and name him Red-Stick-Man; Nih'angan traps him in
    a cottonwood tree and impersonates him before Bear and Panther rescue him. Subsequent
    abstracts describe Nih'angan deceiving a panther through a false female identity
    and rabbit child, being overpowered by Whirlwind-woman after courting and imitating
    her, nearly drowning while trying to seize reflected plums, and tricking bear-women
    into eating their children before killing them with fire; animals later consume
    his stored meat and hair.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The oldest sister calls Bear and Panther to serve as sentinels inside the
    cave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The youngest sister says she wants a son; the sisters choose a red berry stick,
    take it to the cave, and lay it on a bed furnished with clothing and weapons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After repeated commands, the stick moves, speaks, develops a body, rises as
    a man, dresses, and is named Red-Stick-Man.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Red-Stick-Man climbs a cottonwood tree toward an eagle nest with young birds;
    Nih'angan causes the tree to stretch upward and become smooth below.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nih'angan puts on Red-Stick-Man's clothes, goes to camp, and presents himself
    as Red-Stick-Man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bear and Panther follow the trail, find Red-Stick-Man in the tree, and bring
    him down safely; new clothing is furnished for him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nih'angan pretends to be a woman, marries a panther, conceals a rabbit under
    his dress, and pretends to give birth; the panther hears him speak of the deceit
    and runs away in shame.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nih'angan meets Whirlwind-woman, first orders her away, then makes love to
    her, claims similar powers, spins about, and is blown over.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In another Whirlwind account, Nih'angan repeatedly proposes marriage; Whirlwind
    refuses because she must travel constantly, then demonstrates her speed and injures
    or knocks him unconscious.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Nih'angan sees plums reflected in water, dives for them with stones tied to
    himself, nearly drowns, and then sees and gathers the plums on the bush above.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nih'angan sends bear-women to gather plums, kills and cooks their babies,
    and causes the bear-women to eat the children before telling them what happened.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Nih'angan flees through a hole, disguises himself, persuades the bear-women
    to enter the hole, makes a fire at the entrance, and kills them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After Nih'angan hangs up the meat and sleeps, wolves eat the meat and mice
    eat off his hair.
  category: sequence
  evidence_refs:
  - ev:8
