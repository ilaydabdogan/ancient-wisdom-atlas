  quote: ''
  summary: The supplied lines contain several Arapaho narrative abstracts. White-Owl-Woman
    and Raw-Gums engage in a power exhibition involving fire, blue grass stems, food
    procurement, and an intelligence test; Raw-Gums strikes White-Owl-Woman’s head,
    and her brains are identified with gradually melting snow, producing the season
    of vegetation. A skunk deceives and blinds a rabbit after neither yields on a
    trail. A Latin abstract describes a turtle accompanying a war party with wart
    and vulva, which become body members after return. Another abstract tells of a
    girl who becomes a bear, attacks a camp, and pursues two children who are freed
    by a dog, rise to the sky by means of a ball, and become stars. The passage ends
    with the title of the next item, “Big-Owl, Owner-of-Bag,” without narrative content
    in the supplied lines.
  language: English; one abstract in Latin
