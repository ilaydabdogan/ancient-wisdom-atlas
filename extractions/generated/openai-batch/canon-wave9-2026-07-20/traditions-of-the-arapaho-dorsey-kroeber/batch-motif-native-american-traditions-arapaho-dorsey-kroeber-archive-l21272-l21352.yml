canonical_text:
  quote: ''
  summary: 'Lone-Bull repeatedly sends the boy to ask his father what should serve
    for different body parts. The father supplies corresponding items: red water for
    blood, a flute for the bronchial tube, elk teeth for teeth, black stones for hoofs,
    eagle tail feathers for shoulder-blades, eagle wing feathers for ribs, and a beaver
    tail for spleen. The boy carries each item back, and Lone-Bull thanks or praises
    him.'
  language: English
  quote_policy: summarized
