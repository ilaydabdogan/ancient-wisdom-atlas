canonical_text:
  quote: ''
  summary: The passage contains adjacent Arapaho narratives in which small male or
    dwarf figures threaten, pursue, or abduct isolated young women. In one episode,
    two girls flee a small man at a deserted camp. In another, a separated berrying
    girl escapes a threatening dwarf by persuading him to wash and then hiding in
    the riverbank. In a third, a dwarf abducts a girl from a night camp, takes her
    as wife, has a son with her, and later brings her near her family, where her sister
    recognizes her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A moving camp leaves behind a deserted place, and two young girls return there
    to search for forgotten pillows.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the deserted place, a small man on the ground asks the girls where they
    are going and repeatedly asks their names.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The girls give the names Bracelet and Thick Hair; the small man laughs and
    turns away from them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: While the small man has his back turned, both girls run away down the creek
    and out of sight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The small man calls the girls back and promises not to turn away and laugh,
    but they do not return because they are afraid.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The narrator states that the small man intended to outrage the girls and kill
    them for food, and that he delayed them for this reason.
  category: other
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the next tale, a dwarf watches for women; a girl becomes separated from
    women who are berrying, and the dwarf surprises her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The dwarf threatens to compel the girl and shows a bow made of a short rib
    with a tendon string.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The girl tells the dwarf to wash in the river first, describing his hair as
    uncombed and matted and his face as dirty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: After reassuring the dwarf that she will not run away, the girl slips into
    the water and hides beneath overhanging grass at the bank.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The dwarf cannot find the hidden girl, searches through day and night while
    crying, and in the morning the people find her when she answers their calls.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: In the third tale, at a camp-circle at night, a dwarf secretly stands behind
    a dead tree, seizes a girl who comes out of a tent, closes her mouth, and carries
    her off.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The abducting dwarf tells the girl not to cry because he is taking her to
    a place with abundant food and where she will not be hungry.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: At the place where the dwarfs live, the woman remains with the dwarf as his
    wife, and he provides meat for her.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: A boy is born to the woman, grows old enough to speak, and cries because he
    wants to see his grandparents.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The dwarf consents to visit the people from whom he took the girl in order
    to satisfy his son.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The woman returns near the camp at night with her child on her back and stands
    behind the same dead tree until her sister sees her shadow in moonlight and recognizes
    her face.
  category: sequence
  evidence_refs:
  - ev:6
