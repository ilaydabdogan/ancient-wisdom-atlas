canonical_text:
  quote: ''
  summary: Calf-Boy acts in place of his two-legged father in contests against the
    buffalo. He wins a race after four songs and survives a four-day dance using turtles
    fastened to his feet while the buffalo sink into the ground and tire. Lone-Bull
    then announces future terms between buffalo and humans, including buffalo flesh
    as human subsistence and buffalo defenses in hunting. Lone-Bull later asks what
    he should have for his backbone, tongue, eyes, and heart; the father sends a war
    bonnet, an eagle feather, hail, and a small vine air sack through Calf-Boy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy proposes to run for his father because the father has only two legs,
    and Lone-Bull accepts if the father is willing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father ties an eagle breath-feather to the boy's tail before the boy joins
    the others.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After four songs, the buffalo herd runs a circuit to a distant hill, and the
    boy leads at the start and return, winning the race for his father.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Lone-Bull proposes a new challenge: the father must dance for four days and
    nights without sleeping to win decisively.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The buffalo arrange themselves for the dance according to age and rank.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The father fastens four small turtles to Calf-Boy's feet like shoes, and Calf-Boy
    dances in his father's place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: During the dance the animals sink about shoulder-deep into the ground, tire,
    and many fall asleep standing, while Calf-Boy remains on solid ground.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Lone-Bull declares that the day belongs to the father and that buffalo will
    be harmless to his fellow-men, with buffalo flesh serving as their subsistence.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Lone-Bull says buffalo will roam broad prairies, hills, and mountains, protect
    themselves by hearing and smell, run away from hunters, and carry their heads
    downward.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Lone-Bull states that if a murderer is in the hunting party, the buffalo will
    be out of reach unless the murderer eats a piece of human flesh.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: When Lone-Bull asks what he should have for his backbone, the father sends
    a handsome war bonnet through the boy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: When Lone-Bull asks what he should have for his tongue, the father sends a
    middle eagle feather from a medicine case through the boy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: When Lone-Bull asks what he should have for his eyes, the father sends two
    pieces of hail through the boy.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: When Lone-Bull asks what he should have for his heart, the father brings a
    small air sack from a vine by the river and sends it through the boy.
  category: action
  evidence_refs:
  - ev:9
