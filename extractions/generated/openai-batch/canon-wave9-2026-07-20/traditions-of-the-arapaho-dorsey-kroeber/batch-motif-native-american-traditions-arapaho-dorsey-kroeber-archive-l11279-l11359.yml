canonical_text:
  quote: There is some reason for his continual presence.
  summary: A woman repeatedly goes to the river with a vessel to draw water while
    a white dog follows her, wags its tail, and returns to her tipi despite being
    scolded and struck at with sticks. Young men at the river flirt with her, but
    she does not stay. The dog remains near her through the day and night. She experiences
    an enlarged, moving stomach and drowsiness, asks her mother about pregnancy-like
    signs, and later resolves to stay awake because she suspects the dog may be doing
    something to her.
  language: English
  quote_policy: quoted
