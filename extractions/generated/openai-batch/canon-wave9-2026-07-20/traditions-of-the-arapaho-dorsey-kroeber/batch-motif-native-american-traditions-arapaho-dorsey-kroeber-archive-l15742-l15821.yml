canonical_text:
  quote: ''
  summary: Clot-child enters a large camp, hears that Beaver-woman has insulted him,
    obtains hospitality from an old woman, defeats bear people who are withholding
    meat, spares one bear while assigning it future traits and habitat, then uses
    vine, sap, and flute music to draw Beaver-woman to him as wife. He later returns
    to his parents, embraces them, leaves for a father figure, and asks that his story
    be told.
  language: English
  quote_policy: summarized
