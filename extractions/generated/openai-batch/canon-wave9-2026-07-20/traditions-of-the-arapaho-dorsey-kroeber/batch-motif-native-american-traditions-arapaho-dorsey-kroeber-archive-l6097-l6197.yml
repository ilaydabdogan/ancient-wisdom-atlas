canonical_text:
  quote: ''
  summary: The passage gives the end of one Nih'ancan story, a complete shorter version,
    and the opening of another variant. A skull-like Nih'ancan floats downriver, is
    caught, opened by being struck, rests his head on women's laps while being loused,
    sleeps, and wakes with burrs in his hair, prompting him to cut it. A second version
    has bathing women who are burrs cover his head; he cuts off his hair with a knife
    and tells his wife it is a mourning haircut, and an editorial note says this explains
    a mourning hair-cutting practice. Another variant begins with two sewing women
    lousing him, rebuking his obscene behavior, and putting burrs in his hair. Notes
    connect the tale with the Arapaho Sun Dance and identify No. 54 as a shorter version
    of No. 53.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nih'ancan lays his back on the water and floats downriver; women and girls
    bathing see a skull floating, and young men rope it and drag it to shore.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people at the shore recognize the skull/person as Nih'ancan by his color.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nih'ancan tells them to hit him on the forehead or top of the head; when they
    do, the skull opens and Nih'ancan is there, laughing and greeting the girls.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nih'ancan asks to rest his head on the women's laps; they search for lice
    until he sleeps, leave him on the riverbank, and he wakes with cockle burrs all
    over his head and cuts his hair to remove them.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: An editorial note says the tale is cited as a reason no one may approach or
    enter the Sun-dance lodge from the west, where the buffalo skull altar is just
    inside the lodge.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: In No. 54, bathing women invite Nih'ancan to be their child one at a time;
    he selects one as first mother, lays his head on her lap, and the women louse
    him until he sleeps. The parenthetical note states that the women who loused him
    were burrs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In No. 54, pain from burrs leads Nih'ancan to cut off his hair lock by lock
    with a knife, and he accidentally cuts his head so that it bleeds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In No. 54, Nih'ancan returns to his tipi, tells his wife he thought she had
    been massacred and that he cut his hair in mourning; the source note says this
    method of short mourning hair-cutting was followed by the Indians.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: In the beginning of No. 55, two women sewing outdoors invite Nih'ancan to
    be loused; he agrees, puts his head on their laps, touches them and speaks obscenely,
    is rebuked, falls asleep, and the women fetch burrs and put them in his hair.
  category: sequence
  evidence_refs:
  - ev:8
