canonical_text:
  quote: ''
  summary: A young man, annoyed by repeated talk of the beheaded ones, asks his parents
    to make durable moccasins and sets out to seek them. He travels from camp to camp,
    repeatedly visiting old women in old tents at the ends of camps; each recognizes
    him as a sleeping young man and gives limited or increasing information. One warns
    that the beheaded ones are powerful and dangerous. Birds then fly ahead making
    a far-carrying warning sound. The young man reaches a camp of seven young men,
    puts on woman's clothing, acts as a woman, and provokes rivalry among the seven,
    who all want to marry the supposed woman.
  language: English
  quote_policy: summarized
