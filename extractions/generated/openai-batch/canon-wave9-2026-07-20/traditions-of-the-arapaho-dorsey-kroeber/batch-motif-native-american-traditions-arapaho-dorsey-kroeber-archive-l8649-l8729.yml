canonical_text:
  quote: ''
  summary: An isolated group of men gains a daughter when a girl emerges from an injured
    man's swollen leg. A buffalo bull courts and abducts her, but a mole tunnels under
    the herd and leads her back to the men. Pursued by buffalo, the group takes refuge
    in a speaking tree; the chief bull dies after charging it, and the girl throws
    a ball until the group rises and becomes the Pleiades. The passage then begins
    a second tale, describing a prosperous camp-circle and a young man who departs
    on the war-path with six comrades.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several men live away from other people, without women, with a tent, abundant
    meat, and many buffalo nearby.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: One man gets a splinter or thorn in his heel; his heel and leg swell, and
    he becomes unable to walk.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The swollen leg bursts open, a girl child comes out, and the four men name
    her Flasixtaciisa, glossed as Foot-stuck-child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The girl quickly becomes grown and beautiful.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The chief bull of the buffalo courts the girl; after the men forbid contact,
    he destroys the tent, cannot be wounded by their shots, and takes the girl away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The buffalo bull keeps the girl in the middle of the herd, where buffalo surround
    her and the bull watches her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: A mole offers to bring the girl back, digs an underground passage beneath
    the herd, and leads her through it to the men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The buffalo discover the hole and pursue the fleeing people; when they reach
    a tree, the tree speaks and instructs them to go around it four times and climb
    into it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bulls with sharp horns charge the tree and break pieces from it; the chief
    bull later strikes the tree on a fourth charge and breaks his neck, leaving the
    people safe.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The girl throws a ball; it bounces higher each time, and on the fourth throw
    all rise with it and are turned into the Pleiades.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The next tale opens with a large camp-circle along a river bottom in early
    fall, with ripe fruit, good game, daily activities, night dances, flute-playing,
    love songs, lit tipis, and general good feeling.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: An energetic young man proposes going on the war-path to six comrades, tells
    them to prepare, asks his mother for extra moccasins, and the party departs in
    search of the enemy.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The war party journeys for days and nights, makes a shelter-tipi from willow
    sticks, garments, grass, and bark, and reaches a deep branch of a river.
  category: sequence
  evidence_refs:
  - ev:9
