canonical_text:
  quote: ''
  summary: 'The passage closes an adultery-payment episode: an older brother offers
    a peace-pipe and ponies to an offended husband, who later splits a hidden wing
    feather so that the guilty couple parts, then smokes for peace and keeps his wife.
    A new tale begins: a young woman receives her father’s approval to seek the renowned
    Spitting-Horn-Shell as husband, travels through several camp-circles, and reaches
    a river camp preparing for a Sun-dance. Split-Rump, described as a little bird,
    meets her, falsely claims to be Spitting-Horn-Shell, produces cut-bone shells
    from his mouth, and takes her to his parents as wife.'
  language: English
  quote_policy: summarized
