canonical_text:
  quote: ''
  summary: The passage contains the ending of a skeleton or ghost gift story, including
    healing, protection, transformation into bones under a robe, and an explanatory
    note on ghost language; a story headed in Latin about a woman with a toothed vagina
    whose husbands die until a suspicious husband files the teeth with a whetstone;
    story 112, in which a woman promises marriage to anyone who retrieves a bone of
    her dead brother, and an ugly man brings back the corpse and marries her; and
    the beginning of story 113 about a Sioux woman who dresses as a man, joins a war-party,
    and gains honor.
  language: English with some Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A skeleton rubs a man’s ankle, makes it well, says he will not be killed if
    attacked or shot, and says he will become a short skeleton or pile of bones covered
    by a robe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The skeleton leads the man toward camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During a hand-game, the man with the skeleton’s gift is covered by a buffalo
    robe while holding something to hide, and he becomes a pile of bones under the
    robe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ghost tells the people not to use his name in vain.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: An explanatory note says the Indians do not speak of themselves as ghosts
    or spirits, and that the phrase translated as being shot by a ghost refers to
    flesh, bone, or hair penetrating the skin and causing pain.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Little-Chief told the preceding story and that the
    Pawnee have a similar story.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: A handsome woman has been married several times, and her husbands die at her
    side after nighttime intercourse without prior symptoms of disease.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A suspicious man courts and marries the woman and prepares a slender whetstone
    before going to bed with her.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The Latin portion says the man uses the whetstone, the vagina begins to bite,
    he discovers teeth, files them with the whetstone, and the vagina is harmless
    afterward.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A war-party of good warriors is killed; one of the dead warriors is the brother
    of a very beautiful young woman.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The sister announces that anyone who can bring her even the least bone of
    her brother so that she may see him again will become her husband.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: An ugly man travels for many months, reaches the battlefield, goes from scaffold
    to scaffold, and asks the dead whether each is the desired brother.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A groaning dead person answers that he is the brother, comes down by a scaffold
    pole, and is carried back to the camp-circle by the ugly man.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The man drops the corpse before the girl’s door; she prepares a tent, dresses
    beautifully, prepares food, gathers relatives and friends, and the old man declares
    the marriage arrangement.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: A Sioux woman wants to dress as a man, goes with a war-party against the Pawnees
    in men’s clothing, strikes many enemies, remains unwounded, and gains honor.
  category: action
  evidence_refs:
  - ev:10
