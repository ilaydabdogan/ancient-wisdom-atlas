canonical_text:
  quote: At one time there was nothing but water on the face of the earth.
  summary: 'The passage gives source notes on the Arapaho Flat-Pipe and then presents
    a fragmentary origin myth: a family floats on a flat pipe over an all-water world;
    the boy asks for land; duck and turtle bring clay from underwater, which the father
    scatters and commands into dry land; rivers, creeks, corn, and the present earth
    are established. A following fragment begins a parallel version with a man on
    a four-stick stand with the pipe above universal water, calling water birds to
    dive.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The source note says the Flat-Pipe is the tribal medicine of the Arapaho,
    is kept by Weasel-Bear in Wyoming, is connected with an official ritual version
    of the origin myth, and is described as the Creator in Arapaho mythology.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The source note states that the origin of death is usually told in connection
    with this myth and refers to No. 41.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the No. 2 fragment, the earth is initially covered only by water, and a
    man, wife, and boy float on a flat pipe for days and nights.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boy asks his father to provide a large place where he can play and run
    because he is tired of confinement.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The father calls the water-fowls and asks them to decide who is the best diver;
    the duck is selected.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The duck dives, reaches the bottom, returns out of breath, and brings pieces
    of clay in its feet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The man takes the duck's clay, throws it around, and commands dry land, but
    the resulting land is too small for the boy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boy asks that the land be made larger, and the father says he will call
    the red-edged water-turtle to dive for more clay.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The turtle dives, returns alive, and has gathered clay in hollow places on
    the four sides of its body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The man scatters the turtle's clay and commands more land; the land then extends
    as far as the horizon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The man uses the pipe, motioning slowly in the four directions, and rivers
    and creeks are made, running from the foot of mountains and hills.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The man places the duck and turtle with the flat pipe; afterward Indian corn
    is made for the first food, and the flat pipe contains the body of a duck, turtle,
    and corn.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage says this was the beginning of the people and the earth as taught
    to young people.
  category: other
  evidence_refs:
  - ev:8
- id: obs:14
  text: The man says that at a change of life the whole flat pipe would be petrified;
    the note adds that the mouthpiece resembles a duck's bill and that the pipe is
    partially petrified.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: In the No. 3 fragment, a person sits on a stand of four sticks with the pipe,
    above visible water, floating and unable to leave the stand.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:16
  text: In the No. 3 fragment, the man calls many kinds of water birds from all directions
    and asks whether they can do something for him.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: In the No. 3 fragment, the birds dive in turn and fail; the duck dives last,
    remains underwater for days, and returns like the others.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:18
  text: In the No. 3 fragment, the turtle says the birds had the first chance for
    honor but did not succeed.
  category: speech
  evidence_refs:
  - ev:12
