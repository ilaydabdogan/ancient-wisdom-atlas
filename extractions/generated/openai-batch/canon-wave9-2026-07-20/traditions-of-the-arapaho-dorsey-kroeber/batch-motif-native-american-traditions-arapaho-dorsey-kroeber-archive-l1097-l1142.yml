canonical_text:
  quote: ''
  summary: Crow-woman repeatedly urges River-woman, the new wife, to use a swing hung
    from a tree over a river pool. On the fourth attempt the rope breaks and River-woman
    falls into the pool. Crow-woman reports the drowning to the husband while trying
    to quiet the baby. Beaver-foot mourns his sister and carries the hungry child
    to the pool, where River-woman appears from the water riding on the neck of a
    hiintcabiit and nurses the child. A man who hunts water monsters gives Beaver-foot
    instructions and prepares a hiding place with a long spear.
  language: English
  quote_policy: summarized
