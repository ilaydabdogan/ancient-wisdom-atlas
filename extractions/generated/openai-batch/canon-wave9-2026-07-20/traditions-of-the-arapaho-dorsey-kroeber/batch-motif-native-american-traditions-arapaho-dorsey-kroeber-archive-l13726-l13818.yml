canonical_text:
  quote: ''
  summary: The passage contains the end of one tale in which a woman asks to be killed
    and is shot after her father dresses her as a man; tale 114, in which an Arapaho
    younger brother elopes with his elder brother's wife, she shifts her desire to
    a Kiowa, the Kiowa is killed, and the woman is collectively shot with arrows;
    tale 115, in which a young hunter defeats the being called Laughter with the help
    of a small bird and an unborn buffalo calf, then declares that laughter will cause
    cramps rather than death; and the beginning of tale 116, in which a war party
    sleeps on a hill that carries them off.
  language: English
  quote_policy: summarized
