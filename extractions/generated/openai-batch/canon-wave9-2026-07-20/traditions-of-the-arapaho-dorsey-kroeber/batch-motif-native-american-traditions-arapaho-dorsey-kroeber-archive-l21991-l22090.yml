canonical_text:
  quote: ''
  summary: 'The passage gives abstracts of several Nih’anqan narratives: he kills
    elk by making them run over a precipice and loses the meat to coyotes and wolves;
    in three variants he sends or transfers his male organ toward a woman or girl
    and is injured or killed; in several variants he is pursued by a rolling stone
    or rock after soiling, giving away, and reclaiming a robe; he is rescued from
    the stone by birds, especially Bull-Bat; and in another variant he is pursued
    by a rolling skull and escapes by creating obstacles and a crack in the ground.'
  language: English with some Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nih’anqan persuades a herd of elk to race him and kills them by causing them
    to run over a precipice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A coyote eats a paunch that Nih’anqan had given him to carry water; after
    Nih’anqan strikes and leaves him, the coyote assembles wolves and coyotes who
    eat the elk meat, and mice eat Nih’anqan’s hair.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At a river, Nih’anqan sees the sky’s reflection in the water and thinks it
    is the river bottom; he also sees a woman lying on a sand-bar across the river.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In one river variant, Nih’anqan asks a mouse to carry his male organ across
    the river toward the woman; the organ is cut off after entering a closing shell,
    and Nih’anqan dies bleeding.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In another river variant, a mouse drowns while trying to carry Nih’anqan’s
    male organ across the river, but a small bird carries it; when the virgin wakes,
    the organ is taken for a snake and is cut off while Nih’anqan tries to escape.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In another variant, Nih’anqan is in love with a chief’s beautiful daughter,
    speaks to his male organ, and sends it to the girl; blood flows from her vagina,
    and her parents cut the organ into pieces with a knife.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nih’anqan and Jack-Rabbit compete at staying awake; after waking, Nih’anqan
    pursues Jack-Rabbit, defecates several times, and mistakes moving excrement under
    his robe for little rabbits.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nih’anqan places a robe on a stone, later takes back a perfumed quilled buffalo
    robe from it, returns it when it becomes offensive, and then takes it again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A stone rolls after Nih’anqan, follows him over hills and through timber,
    and rests on top of him in a ravine.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Nih’anqan asks birds and animals to remove the stone; Swift-Hawk breaks pieces
    from it but is dashed to pieces, and Bull-Bat breaks the stone into pieces.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After Bull-Bat breaks the stone, Nih’anqan pulls Bull-Bat’s mouth wide open
    and says he should remain that way.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A variant says Rabbit inserts a penis into sleeping Nih’anqan’s anus; Nih’anqan
    applies a torch to punish the anus, soils a robe, gives it to a rock, reclaims
    it when it smells clean, and is pursued and overtaken by the rock before Bull-Bat
    rescues him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A variant says Nih’anqan finds a floating lump of pemmican, bites off pieces
    with its permission, finally swallows it all, soils a robe, gives it away and
    takes it back, and is pursued and overtaken by a rock before Bull-Bat rescues
    him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: A skull emerges from ice and pursues Nih’anqan; he makes sand, brush, a mountain,
    and then a crack in the ground behind him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The skull cannot cross the crack; Nih’anqan puts a stick over it, and when
    the skull starts across, he shakes it off in the middle.
  category: action
  evidence_refs:
  - ev:9
