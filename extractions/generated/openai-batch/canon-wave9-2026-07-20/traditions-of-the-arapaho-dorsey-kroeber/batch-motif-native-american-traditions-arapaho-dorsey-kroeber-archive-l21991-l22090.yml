- id: motif:1
  label: trickster boundary crossing and reversal
  taxonomy_refs:
  - trickster_boundary
  basis: Nih’anqan deceives elk, misperceives reflections and excrement, sends a detached
    organ toward women, reclaims a robe from a stone or rock, and is repeatedly injured,
    pursued, or reversed.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage does not explicitly label Nih’anqan as a trickster; the taxonomy
    assignment is inferred from repeated boundary-crossing and comic reversal actions.
- id: motif:2
  label: detached body part sent as sexual agent
  taxonomy_refs: []
  basis: Three abstracts describe Nih’anqan sending or having his male organ carried
    toward a woman or girl, with the organ cut or damaged and Nih’anqan injured or
    killed.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: No supplied taxonomy family directly corresponds to this motif.
