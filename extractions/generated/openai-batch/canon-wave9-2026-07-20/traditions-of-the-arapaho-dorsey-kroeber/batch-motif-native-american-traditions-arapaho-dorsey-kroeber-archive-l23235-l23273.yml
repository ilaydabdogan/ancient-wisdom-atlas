canonical_text:
  quote: ''
  summary: A young woman living alone is visited at night by a young man in a white
    robe. She marks him with paint to identify him, then later sees the marks on a
    large white dog and strikes it. She becomes pregnant and gives birth to male and
    female twin dogs, who grow rapidly, run away, and leave tracks that become human
    tracks leading toward sunset. She follows them to a red-painted tipi where the
    father, described in the shorter abstract as the sun, allows her to enter after
    the children intercede but sends her back; the outcome of her request to take
    the children is unknown.
  language: English
  quote_policy: summarized
