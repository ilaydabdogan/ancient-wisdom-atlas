canonical_text:
  quote: ''
  summary: Light-Stone uses a sweat-lodge and four red and black arrows to bring six
    killed uncles back to life. The reunited kin return in peace. An old woman arrives
    with an iron digging stick and a heavy sacred bag that she forbids others to open.
    The boy suspects danger, turns into a woodpecker, spies on her, and learns that
    she plans to kill the group and use their hair to finish garments. The warned
    young men send her away to dig willow potatoes, carry out her bag, and burn it;
    she smells it burning and runs back.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Light-Stone has a bow and four arrows, two painted red and two painted black,
    and erects a willow sweat-lodge covered with tipi cloth and blankets.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Light-Stone shoots the arrows into the air while telling his uncles to get
    out of the lodge; the lodge moves, and six uncles come out alive.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Light-Stone tells the men that his mother said they had gone to visit the
    camp-circle, that he found them killed by the cruel old woman, and that he made
    them live again.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The revived men kiss Light-Stone, call him nephew, and thank him for his victory.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The group returns to the tipi; the sister meets them, kisses her brothers
    and son, and the family is together in peace.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: An old woman comes to the tipi with an iron digging stick and a heavy bag,
    calls the people her grandchildren, says the bag is sacred, and says others are
    prohibited from opening it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old woman gives the warning because something is inside the bag that she
    does not want the others to know or see.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: While the men hunt and the sister and her boy watch from a hill or mountain,
    the boy says he thinks the old woman has the same cruel feeling toward human beings
    and will try to trick her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy turns into a woodpecker, flies to the tipi, lands on a pole, and pecks;
    the old woman is frightened, hides the bag contents, goes outside, and then sees
    only the bird.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old woman opens her bag and spreads out men’s costumes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The old woman counts seven men and a woman, says they have enough hair to
    finish shirts and leggings, and says she will kill them all.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The woodpecker informs his mother about the old woman; the warning is secretly
