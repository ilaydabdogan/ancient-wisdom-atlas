canonical_text:
  quote: ''
  summary: 'The passage closes a Moon and buffalo narrative: Moon overpowers the buffalo,
    forbids further killing of human beings, gives bows and arrows to male humans,
    and negotiates with Buffalo-Bull so that buffalo become future subsistence for
    humans. A boy carries messages between Moon and Buffalo-Bull, who accepts and
    requires four-day sequences of singing, dancing, racing, and myth-telling before
    Moon returns. A source note relates the story to Blue-Feather, Little-Star, and
    several other variants. The passage then begins a separate tale in which women
    gather firewood, a woman pursues a porcupine up a cottonwood tree for its quills,
    the tree lengthens until she reaches the sky, and the porcupine brings her into
    a sky camp where his parents live.'
  language: English
  quote_policy: summarized
