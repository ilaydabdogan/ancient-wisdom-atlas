canonical_text:
  quote: ''
  summary: During a fall buffalo hunt near a river and timber, Blood-Clot-Boy, also
    called Searching-Child, is introduced as newly born or newly part of the tribe
    and grows into a lively young man. On a hunt, he refuses to return home despite
    warnings of cold and White-Owl, a being associated with storm and snow. Left behind,
    he faces the storm, sees White-Owl arrive, and hears White-Owl claim power over
    the winter season. White-Owl challenges him to a contest involving life-and-body
    stakes and asks where he comes from; Blood-Clot-Boy answers that he came from
    his father, and White-Owl accepts the answer.
  language: English
  quote_policy: summarized
