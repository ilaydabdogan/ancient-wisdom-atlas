- id: obs:3
  text: Near a small divide, a stronger whirlwind overtakes Nih'ancan; he tells it
    to keep away, and the wind whirls by without appearing to pay attention.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The route includes a wide landscape with groves and hills, a wide bank, a
