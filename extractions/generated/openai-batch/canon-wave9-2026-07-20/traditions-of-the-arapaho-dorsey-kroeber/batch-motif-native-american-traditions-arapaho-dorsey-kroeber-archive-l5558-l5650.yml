canonical_text:
  quote: ''
  summary: Nih'ancan walks along a river landscape and repeatedly encounters Whirlwind,
    who is treated as a female speaking figure. After initially telling her to keep
    away, he repeatedly asks her to become his life companion or wife. Whirlwind refuses,
    saying she is always moving and cannot stay at home or in one place; Nih'ancan
    answers that he also travels constantly.
  language: English
  quote_policy: summarized
