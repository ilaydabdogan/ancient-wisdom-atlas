canonical_text:
  quote: ''
  summary: A community repeatedly sends young men to approach a lone tipi where a
    man, his seven boys, and many dogs are staying. The dogs fiercely repel the first
    parties. A later group reaches the tipi after the hosts restrain the dogs. The
    father explains that a mother dog had been abused for stealing meat while hungry
    and while her puppies were hungry, leading the dogs to leave for justice. The
    visitors are invited to feast, and afterward the dogs return to the main camp.
    The community treats the dogs generously, uses them on a hunt, and peace is restored.
  language: English
  quote_policy: summarized
