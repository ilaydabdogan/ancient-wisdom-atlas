canonical_text:
  quote: ''
  summary: The passage contains comparative notes on widespread flight, earth-diver,
    and origin-of-death motifs; the end of a tale in which a Buffalo Cow gives information
    about ceremonial lodges that a man reports as law; and the beginning of the tale
    “Origin of the Kit-Fox and Star Lodges,” where boys encounter a hunter skinning
    buffalo, one boy kills him after a dispute over meat, flees to his grandmother’s
    lodge, disappears amid a whirlwind and smoke, and is later seen fleeing in a yellow
    calf robe.
