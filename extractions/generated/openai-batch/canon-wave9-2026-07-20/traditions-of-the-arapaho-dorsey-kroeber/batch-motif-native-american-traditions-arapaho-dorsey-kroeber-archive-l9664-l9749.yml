canonical_text:
  quote: ''
  summary: In the opening part of “Light-Stone,” a household contains six brothers
    and a sister. The oldest brother leaves toward another camp-circle and encounters
    an old woman in a smoke-tanned tipi near a creek and timber. She invites him to
    rest and asks him to tramp on her painful back. When he steps down to her last
    rib, which stands upright like a spike, he dies instantly. She stakes his body,
    smokes a pipe, and puts ash on his eyes, mouth, and breast. Two further brothers
    come searching in sequence and are killed in the same way.
  language: English
  quote_policy: summarized
