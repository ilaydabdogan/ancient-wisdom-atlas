canonical_text:
  quote: ''
  summary: A camp-circle stands by a river bottom near timber. A respected family
    has a beautiful daughter who lives in a separate ornamented tipi, works quills,
    possesses abundant goods, and refuses marriage despite many suitors and family
    pressure. A white dog begins staying beside her tipi, follows her toward the river
    when she fetches water, and later appears behind the tipi when she gathers firewood;
    each time she throws a stick and scolds it, the dog dodges, sits erect watching
    her, and returns to lie near her. An embedded editorial footnote compares the
    myth's distribution with northern Athabascan, Eskimo, North Pacific Coast, Cheyenne,
    Arapaho, Shoshoni, and other traditions.
  language: English
  quote_policy: summarized
