canonical_text:
  quote: ''
  summary: White-Owl questions Blood-Clot-Boy about how to make a knife, praises him
    for enduring powerful actions, grants him long life, and departs northwest. A
    note interprets the story as concerning trials and temptations and mentions a
    Pawnee variant. The next tale begins with greedy treatment of old parents-in-law
    during buffalo hunting. The old man follows a wounded cow’s bloody trail, finds
    clotted blood, and brings it home. When the old woman boils it, the kettle moves
    and a small beautiful girl is found and named Clot-woman. The son-in-law tries
    to obtain the child by offering buffalo meat, but the old people refuse.
  language: English
  quote_policy: summarized
