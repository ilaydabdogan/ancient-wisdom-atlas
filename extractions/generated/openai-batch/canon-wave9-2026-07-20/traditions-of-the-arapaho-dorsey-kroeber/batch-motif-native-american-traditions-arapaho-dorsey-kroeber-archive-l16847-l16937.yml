canonical_text:
  quote: ''
  summary: A young man captures and cares for a grown boy who had fallen from the
    sky-world with his mother, finds the mother dead, bathes and perfumes the boy,
    and returns him to his grandparents. A parenthetical note connects the episode
    to a Sun-dance altar bird and to geese carrying small birds. Moon mourns or complains
    about his human wife, angering Buffalo-Woman, who leaves with her calf-son for
    her own distant home. Moon repeatedly follows them despite warnings to return.
    At Buffalo-Woman's parental camp, Moon is hosted under controlled conditions,
    and calves are killed for him to eat and restored to life from their bones and
    hides.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man hides under an arbor near a bank, watches for the grown boy, approaches
    him when he drinks, and catches him as the boy tries to escape.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man tells the boy that there is a large camp-circle nearby, that
    he will care for him, and that the boy appears to need food.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy says that he and his mother had been above with his father, that his
    mother discovered their original home below, dug a hole down into this world,
    and lowered herself by sinew strings from a digging stick.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy says the string was not long enough, that he and his mother hung for
    a time, and that something broke them loose and landed them near a sand-hill.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young man is shown the place and sees a woman lying on her side, badly
    decomposed.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The young man takes the boy to the river, bathes him, rubs him with sage,
    puts perfume on him, and walks with him toward the camp-circle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that one boy is returned to his grandfather and grandmother.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A parenthetical note says the episode may refer to the little bird on the
    forked stick of the Sun-dance altar and compares the mother carrying the boy from
    the sky to geese carrying small birds.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: Moon returns from the hole where his wife went down, blames old people for
    not watching her, and repeatedly speaks about his human wife in a way that angers
    his other wife.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Buffalo-Woman, described as a buffalo cow, leaves with her boy for their own
    home, located four divides away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Moon follows the trail of Buffalo-Woman and the boy because he is fond of
    his son.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: At repeated camping places, the boy tells Moon that the distance is far and
    asks him to turn back; Moon refuses.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: On repeated mornings, Buffalo-Woman and her boy leave early while Moon sleeps,
    and Moon wakes and follows their trail again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: At Buffalo-Woman's parental camp, her parents feast with her and her boy,
