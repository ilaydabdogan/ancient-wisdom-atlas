canonical_text:
  quote: "“the clot felt as if it were a human being... It was a boy.”"
  summary: An old man returns with a blood clot that becomes a baby boy. He and his
    wife receive the child, but when their daughters and son-in-law inquire, the child
    is presented as a girl. The son-in-law, expecting the child to become another
    wife, gives meat and is prevented from unwrapping the child. The child grows quickly,
    is dressed as a girl but behaves like a boy, and the son-in-law eventually discovers
    the deception. The passage ends as the boy asks the old man to make him a bow
    using a tendon.
  language: English
  quote_policy: quoted
