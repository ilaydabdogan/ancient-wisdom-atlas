canonical_text:
  quote: ''
  summary: A husband and wife continue a repeated journey over divides and across
    rivers to tipis that vanish by morning. The wife repeatedly leaves the bed, becomes
    a buffalo cow, and then changes back into a woman. They arrive at an illuminated
    camp-circle and enter the wife’s father’s tipi under one robe so they appear as
    one person. The father welcomes the husband as son-in-law; calf brothers-in-law
    are killed and cooked for the husband and then restored to life from their hides.
    The husband is kept inside during occasions connected with a game round-up and
    a blessing.
  language: English
  quote_policy: summarized
