canonical_text:
  quote: ''
  summary: A party of women gather dark fibers by a river. Three stay behind, and
    one young woman later leaps across a spring, feels intense heat enter her body,
    and becomes pregnant with a strange being. She seeks help from Hairy-Face, an
    old former medicine-woman associated with the river. At the birth, Hairy-Face
    gives tea, paints the woman, and assists delivery. Water fills the tipi and puts
    out the fire. The infant is revealed as a small animal-like water monster, called
    hinichabbiti, and later disappears when uncovered.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women search along the riverbank for dark fibers called “black threads,” which
    grow at the water’s edge and are used in porcupine-quill work as marks for certain
    symbols.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After most of the party returns home, three women remain to gather more fibers
    and then start back.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The three women come to a spring of running water that is too wide to jump
    except near its mouth; the first two cross without trouble, and the last crosses
    after hesitation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The last woman feels intense heat under her dress, striking her genital area,
    legs, and whole body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the end of the month menstruation does not begin; the woman suspects the
    spring and believes a different or strange being is forming inside her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The young woman privately asks Hairy-Face, an old former medicine-woman, to
    help her at delivery because she believes birth will be impossible without assistance.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hairy-Face says she has no control over the monster at the spring, says she
    belongs to the river, and agrees to try to help the young woman.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: By the ninth month, the pregnant woman is unable to rise or move her limbs,
    and her body, arms, and legs are swollen.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hairy-Face comes to the tipi, prepares a tea from a root or weed, gives it
    to the woman, and touches or paints the woman’s body and face in spots.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: During the delivery, blood flows, the womb becomes empty, no baby cries, water
    covers the inside of the tipi, and the fire is put out.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Hairy-Face finds and covers the infant; when she later lifts the cover, the
    attendants see an animal-like being rather than a human baby.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The being has a slender body, short legs, cow-like feet, a long tail, black-and-white
    spots, a short broad forehead, a bulldog-like face, and no eyes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The women are frightened and say the woman has given birth to a small water
    monster.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: When Hairy-Face uncovers the infant hinichabbiti after the women re-enter,
    it disappears from sight.
  category: action
  evidence_refs:
  - ev:7
