candidate_motifs:
- id: motif:1
  label: failed imitation of another being’s special power
  taxonomy_refs: []
  basis: Several abstracts repeat a pattern in which Nih’angan or another visitor
    observes, learns, or claims a power and then fails when attempting it.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage does not itself label this as a trickster motif; taxonomy
    is therefore left empty.
- id: motif:2
  label: extraordinary food procurement through body or ritual acts
  taxonomy_refs: []
  basis: Food is obtained by skin-line fishing, sharpened-leg hunting, diving through
    ice for fish or beavers, transforming bark into meat, using brain as tallow, and
    causing food to fall.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  - ev:9
  confidence: high
  cautions: The abstracts are compressed and do not explain the source of the powers.
- id: motif:3
  label: rescue or restoration after dangerous failure
  taxonomy_refs: []
  basis: Nih’angan is rescued after being swallowed by a fish and after becoming stuck
    in a buffalo; his wife is healed after Nih’angan kills her during a failed imitation.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:8
  confidence: high
  cautions: Not every failed imitation in the passage includes an explicit rescue
    or healing.
