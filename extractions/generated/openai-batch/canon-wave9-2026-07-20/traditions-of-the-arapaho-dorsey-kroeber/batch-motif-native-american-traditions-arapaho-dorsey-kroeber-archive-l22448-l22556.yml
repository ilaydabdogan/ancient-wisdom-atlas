canonical_text:
  quote: ''
  summary: 'A series of Arapaho abstracted narratives centers mostly on Nih’angan
    attempting or claiming powers demonstrated by others: fishing with a skin line,
    hunting with a sharpened leg, diving through ice for fish or beavers, transforming
    bark into meat, producing tallow from a wife’s brain, and causing food to fall
    through children. These attempts often fail and require rescue or restoration.
    Other abstracts describe women placing burrs in Nih’angan’s hair, a dwarf harming
    and escaping him, and a woman carried off by a young man identified as a wild
    horse.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: While traveling, Nih’angan is persuaded by two women to let them louse him;
    after he sleeps, they put burrs in his hair and leave, and he later cuts his hair
    and gives a false explanation connected to his wife’s reported death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nih’angan sees a man fishing with a line made from the man’s own skin, learns
    the method, fishes too often, is dragged into the water by a large fish, swallowed,
    and rescued by the teacher.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A friend provides food by sharpening his leg and stabbing buffalo; Nih’angan
    tries to imitate him, becomes stuck in the buffalo he has kicked, and is rescued
    by the friend.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A friend obtains fish by diving from a tree through ice; Nih’angan tries to
    do the same but strikes the ice and is nearly killed or injured.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Medicine-man Kingfisher paints himself, takes a bone whistle, goes to a lake
    near a leaning tree, blows the whistle, plunges through ice, and brings out beavers
    for food.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A visiting friend claims the same power as Medicine-man Kingfisher, attempts
    the ice plunge, strikes the ice, and becomes senseless for a time; Medicine-man
    then repeats the act successfully and laughs about the failure.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: An unnamed host’s wife holds bark on a stick to the fire, and the bark becomes
    roasted tenderloin; the host opens his wife’s skull along a red painted line while
    she remains alive and uses brain as tallow for pemmican.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Nih’angan attempts to copy the bark-to-meat and brain-to-tallow procedure
    with his own wife, but his axe blow breaks her head into pieces and kills her;
    the visitor heals her and performs the procedure successfully.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In another food-producing episode, a man sends his children outside and food
    falls down; Nih’angan tries to imitate him, calls four times, and finds his children
    asleep with no food produced.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Nih’angan believes he has killed a dwarf and carries him, but the dwarf repeatedly
    catches brush, lets go suddenly, strikes Nih’angan, and eventually escapes before
    Nih’angan’s wife arrives.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: A woman traveling with the people goes back to look for a colt, meets a young
    man who carries her off, and the young man is identified as a wild horse; she
    lives with him while her husband and the people eventually abandon the search.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage ends with only the heading of an additional abstract, “How the
    Dwarfs were killed,” without its narrative contents in the supplied range.
  category: other
  evidence_refs:
  - ev:12
