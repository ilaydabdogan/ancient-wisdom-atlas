canonical_text:
  quote: ''
  summary: Found-in-Grass asks his grandmother to seek marriage with a chief's younger
    daughter. After rejection by the elder sister and doubts about his appearance,
    he makes a running wheel with arrow sticks that produces buffalo, feeds the girl's
    kin, appears beautiful at night, directs a communal buffalo drive over a precipice,
    resists the elder sister's attempts to win him, and is finally received into a
    tipi where the younger sister waits as his wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief is described as having two beautiful daughters, and Found-in-Grass
    wants to marry the younger daughter.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Found-in-Grass asks his grandmother to go to the chief's household and request
    the marriage for him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The grandmother warns that many have failed to win the younger daughter and
    that Found-in-Grass's looks and youth may cause objections.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The elder sister says Found-in-Grass is not fit for a husband and calls him
    ugly and dirty.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The elder sister is married to Crow, who sits silent and is said to be of
    no use to the chief in providing subsistence.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Found-in-Grass asks for a peeled slender stick and hide strings, then makes
    a small running wheel representing animals and arrow sticks to accompany it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Found-in-Grass throws and strikes the running wheel, a dead buffalo steer
    appears; each repetition makes the wheel and buffalo larger.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The old woman skins the buffalo and delivers the meat to the chief and the
    girl's relatives, who learn of Found-in-Grass's ability.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Although Found-in-Grass is not pretty during the day, the younger sister brings
    him prepared food at night; his appearance changes and she falls in love with
    him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Found-in-Grass instructs that stone heaps be erected in two rows from a precipice,
    with the people standing behind them to watch and drive buffalo into a corral
    and over the cliff.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: By running the wheel, Found-in-Grass causes buffalo to come from all directions
    into the corral.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the herd is driven over the precipice, the people collect skins and
    beef, and they come to love Found-in-Grass for his deed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The elder sister stays near Found-in-Grass while he works and tries to win
    him, although she is married to Crow and the younger sister is his choice.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Found-in-Grass makes a bag of blood; the elder sister insists on carrying
    it, and he stabs the bag, warning that it is leaking and may spoil her robe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: A large lodge is prepared with articles for a man and woman to live together;
    Found-in-Grass is called there and finds the younger sister waiting with food
    as his wife.
  category: sequence
  evidence_refs:
  - ev:9
