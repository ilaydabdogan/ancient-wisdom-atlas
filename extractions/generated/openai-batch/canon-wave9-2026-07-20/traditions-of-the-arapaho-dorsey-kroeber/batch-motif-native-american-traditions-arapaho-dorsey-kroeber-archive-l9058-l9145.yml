canonical_text:
  quote: ''
  summary: Splinter-Foot remains inside the tipi while the men go hunting. To keep
    herself steady, she works on seven buffalo hides with colored porcupine quills.
    Twice, noisy people outside call her to leave her work and help them in a game;
    each time she refuses because of her father’s warning. The men return with meat
    and hides, help with household tasks, and praise her self-control while she prepares
    meals for them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The father is described as fond of his daughter and holds back before leaving
    in order to give her advice and warning.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:2
  text: Splinter-Foot says that, since she will be alone, she needs an occupation
    to keep her at home and steady her mind.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: She takes seven buffalo hides, places them in a heap, sits on them, spreads
    them, and begins quill work on robes marked with designs and parallel lines.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Noisy participants outside the tipi ask Splinter-Foot to leave her work and
    help them because they are losing a game.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Splinter-Foot refuses the first summons, saying she cannot permit herself
    to indulge in the game.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The young men or fathers return with antelope, buffalo, fresh beef, and hides;
    the father calls to ask whether the daughter is still inside.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Splinter-Foot reports to her father that the callers came as he had said,
    but that she did not give them satisfaction, and he praises her courage and clear
    mind.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The men help bring hides and meat inside and assist with carrying water and
    wood, while Splinter-Foot stays near the fire and prepares meals for them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The next morning the father again warns her not to follow outside excitement
    or calls to the game, and tells her to attend strictly to her work and keep control.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Splinter-Foot resumes quill work, which is described as requiring silence
    and much thought.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: A second group call asks her to leave the work and help with the game; she
    refuses because her father told her not to listen to the cries.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the evening the men return with fresh beeves and hides; the father praises
    her conscience and her objection to the sport, and the group eats supper and retires.
  category: sequence
  evidence_refs:
  - ev:6
