canonical_text:
  quote: ''
  summary: 'The passage describes a mythological age when the earth lacked many present
    plants, fish, and foods, and was inhabited by magical spéta’kl, mostly animal
    persons in human form. Traveling transformers, especially Old Coyote, Qoa’qiqat,
    Kokwé''la, and the Old Man, alter the world: bad beings are deprived of power,
    expelled, cursed, or transformed into animals, birds, fish, and trees, while good
    people are settled in different places and become ancestors of present people.
    The passage then introduces Old Coyote as chief of the Coyote people near the
    Thompson River, powerful in magic yet also deceptive, overreaching, and often
    duped.'
  language: English
  quote_policy: summarized
