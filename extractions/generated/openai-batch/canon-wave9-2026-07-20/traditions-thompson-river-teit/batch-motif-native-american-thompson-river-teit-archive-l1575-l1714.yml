canonical_text:
  quote: ''
  summary: The passage is an introductory comparative discussion of how social organization
    affects mythology among British Columbia and neighboring Indigenous groups. It
    contrasts coast clan traditions with the looser organization of interior tribes,
    discusses ritual and social systems shaping myth variants, describes Salish and
    Fraser River village traditions of mythical ancestors, and gives brief abstracts
    involving the Ma’sxui ancestor Sqelé’yit being transformed into a beaver and a
    Stré/lis origin tradition involving Ts’a/tsEmiltx, Qulqe'meEx’i’l, and animal
    ancestors.
  language: English
  quote_policy: summarized
