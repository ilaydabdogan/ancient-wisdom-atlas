canonical_text:
  quote: ''
  summary: Coyote disguises himself in the clothing and ornaments of an absent man,
    deceives one of the man's wives, and is recognized by the other. The absent man,
    NLi‘ksEntEm, becomes homesick in the upper world and is lowered back to earth
    by Spider in a basket, following instructions not to open his eyes until he hears
    crows. He returns near Lytton, crosses the Thompson River in a horse-tail canoe
    that becomes a river plant, receives news from slow-travelling beings, reunites
    with his mourning wife and child, and secretly hunts deer using a glove that releases
    full-sized venison while the rest of the people fail to find deer.
  language: English
  quote_policy: summarized
