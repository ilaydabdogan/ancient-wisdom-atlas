canonical_text:
  quote: ''
  summary: The passage includes a fragment about leaving offerings on a stone; a narrative
    in which Ntci/mka sends a lad/helper home with route instructions and gifts, the
    lad escapes attacking Kamloops men by means of magically grown trees and a bribed
    sentinel, and Porcupine is transformed from a man after receiving dentalia. It
    then begins a story about a young wife who feigns illness, prepares herself secretly
    at a lake, calls Nukano’/xa, rejects several emerging animals or fish, and embraces
    a handsome long-haired man from the water while her husband watches.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fragment states that an offering or payment may be left on a stone in the
    form of hair, tobacco, clothes, or similar items.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ntci/mka tells his helper to return to his own country by a specified route
    and to camp on the mountain Ca/nEXEnEnamax as part of the journey.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The lad hunts an immense band of deer, kills many, and gives them to Ntci/mka
    as a present; Ntci/mka gives him eagle quills and dentalia before he departs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage explains that camping on Ca/nEXEnEnamax is advised for good luck
    because the place is mysterious.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: When armed Kamloops men attack him, the lad causes two large thick trees to
    grow and climbs one for refuge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the first tree is chopped down, the lad jumps into the second tree;
    his enemies camp in a circle around it and leave an old man as sentinel.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: During the night the lad offers dentalia and eagle tail feathers to the sentinel
    in exchange for being led outside the circle of enemies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The old man divides the dentalia and feathers among the people after the lad
    escapes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Porcupine receives no quills, sulks, and is later struck or covered with dentalia
    thrown by the old man, who curses and transforms him into a porcupine.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'The passage gives an origin explanation: porcupine quills were once dentalia,
    and Porcupine was once a man.'
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: A young wife repeatedly appears sick, goes to the lake each morning to wash,
    and returns about noon groaning and leaning on a staff.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Her husband becomes suspicious and follows her secretly to watch her actions.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: At the lake the woman changes into hidden fine clothing, washes, combs her
    hair, paints her face, and appears healthy and handsome.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The woman calls Nukano’/xa; a grizzly bear and then other animals or fish
    rise halfway from the water, but she rejects them, saying she wants their elder
    brother.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: A handsome long-haired man emerges halfway from the water, comes ashore naked,
    and embraces the woman; she embraces him in return.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: The husband concludes that his wife has only pretended sickness and has been
    going to the lake to meet this being.
  category: relationship
  evidence_refs:
  - ev:16
