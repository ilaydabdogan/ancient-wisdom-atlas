canonical_text:
  quote: ''
  summary: The passage summarizes two Lillooet traditions. In the first, Tsu’ntia
    is born after a girl marries the root Kokwe'la, is identified as ancestor of the
    Upper Lillooet, transforms an abusive boy into a fish, seeks information about
    his father, confronts or questions Water, travels along rivers, and defeats the
    Qoa’qoaL in a food or strength contest. In the second, Tsu’ntia throws his mother
    into a lake; she becomes ancestor of a fabulous Frog-people. Through marriages
    and a fasting young man’s intervention, the Frog-people are made to eat deer meat,
    become human, and settle at Lillooet, while three refusers become dogs.
  language: English
  quote_policy: summarized
