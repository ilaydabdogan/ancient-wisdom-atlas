canonical_text:
  quote: ''
  summary: Editorial notes record variant Thompson River accounts concerning Coyote,
    NLi’ksEntEm, Spider, a flood or primordial setting, an upper-world journey, instruction
    in magic, transformations into birds or other forms, a basket descent, and a sacred
    stone marking the centre of the earth or country.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One variant says Coyote escaped in a canoe with other people, while the canoe
    of the Nzfiké’ski Indians broke loose from him and drifted ashore near mountains
    of that name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrators do not identify the exact location of the episode, except that
    it was said to be somewhere not far from Spences Bridge.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some Indians say Coyote was once alone as the only man on earth, either around
    the beginning of the spéta’kl period or after the Flood.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: In one account, Coyote lifted his eyelids and looked up; each time he did
    so, the tree grew taller.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: NLi’ksEntEm is identified as Coyote’s eldest son and is described as having
    great magical powers and success as a hunter.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The notes state a belief in three worlds: the present world, an upper world
    visited by NLi’ksEntEm, and a lower world inhabited by Ant people; the sky is
    described as the ground of the upper world.'
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Birch-bark vessels, including utensils and miniature canoes, attacked NLi’ksEntEm;
    he cursed them and condemned them to be eternal servants of humankind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A fuller variant says NLi’ksEntEm transformed or cursed two women into a fool
    hen and a ruffed grouse after feeling insulted; other variants alter the bodily
    details of the encounter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Nkamtci’nEmux version says NLi’ksEntEm went to the upper world ignorant,
    but returned skilled and wise after Spider advised him, trained him, and taught
    him magic.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: One version says Spider lowered NLi’ksEntEm in a basket through an aperture
    made by lifting the fire-stone of an underground lodge; opening his eyes repeatedly
    caused difficulty in landing safely on earth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A place where NLi’ksEntEm first touched or rolled on the ground was said to
    become a stone marking the centre of the earth or of the Indians’ country; the
    stone is held sacred and kept covered with earth.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Some variants say NLi’ksEntEm turned into various animals while trying to
    save himself before becoming a piece of board.
  category: action
  evidence_refs:
  - ev:9
