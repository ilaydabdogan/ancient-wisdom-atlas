    Sun’s son hides him, calms the Sun, and gives him a bundle that must not be looked
    at until home; the bundle becomes large and full of gifts. Loon and Goose give
    the gambler their daughters, whom he takes to the Sun; in return, the Sun promises
    to move away from earth and stop killing people.
