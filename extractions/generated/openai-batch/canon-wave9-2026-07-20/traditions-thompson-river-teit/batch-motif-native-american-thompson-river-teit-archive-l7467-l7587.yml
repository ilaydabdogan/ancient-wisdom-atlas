canonical_text:
  quote: ''
  summary: A sequence of editorial notes records variant explanations and comparative
    references concerning repopulation by Coyote people, arrowstone theft and distribution,
    bird identifications, a sister's conduct while hunting and later bird transformation,
    an underworld inhabited by Ant people, Aq as a possible mountain spirit, the distribution
    of carcass parts to tribes as an explanation of tribal characteristics, and several
    geographic or object identifications.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator could not explain with certainty how the country became inhabited
    again and suggested it may have been occupied later by Coyote people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When animals were created by the Chief or Old Man, some bad people were turned
    into coyotes, while good Coyote people remained and multiplied.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The good Coyote people are described in one explanation as ancestors of the
    present inhabitants; another explanation says the Old Man left good people there
    at the dispersion or that some later wandered there.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some accounts identify Crow and Magpie as thieves, and some accounts identify
    Raven or Stetso' as distributor of chipped arrowstone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Old men in or near Shuswap country are associated with arrowstone, and variant
    speech says they would have given arrowstone if asked instead of being set quarrelling.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A variant says one person was the only one who knew how to flake and chip
    arrowstone.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some accounts add that birds and quadrupeds accompanied an unnamed group,
    and another note gives variant geographic points around Lytton and the Fraser
    River.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some accounts say the sister went hunting with a male companion and immediately
    ate deer he shot; he warned her, she persisted, and he became angry.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Some accounts say the sister did not transform herself but was later changed
    into the kaqwa', identified tentatively as the American golden plover.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Indians are said to believe in an underworld below the earth inhabited
    by Ant people, whose favorite game is lacrosse or ball play.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some accounts identify Aq not as an ancient-world personage but as a land
    mystery or spirit, or one of the genii of certain mountain areas, named Aq because
    of his cry.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The carcass is cut into nine pieces, and parts are thrown to various tribes.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The allocation of carcass parts to tribes is given as the reason for differing
    attributed qualities of those tribes.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: A staff mentioned in the related narrative is identified as the very long
    shaft of a kind of fish-spear.
  category: object
  evidence_refs:
  - ev:12
- id: obs:15
  text: Some accounts leave uncertain whether Ntci'mka took the boy from the Okanagon
    or from the Shuswap.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: Tsotcowaux is explained as meaning the creeks and as the name of a creek formerly
    used by NLak'apamux men as a training resort.
  category: setting
  evidence_refs:
  - ev:14
