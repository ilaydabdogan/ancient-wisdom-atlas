canonical_text:
  quote: ''
  summary: 'The passage recounts several Coyote episodes: he conducts salmon into
    rivers but blocks them from the Similkameen after girls reject salmon and ask
    for mountain sheep; he cures a sick girl while disguised as a shaman; his daughter
    becomes a rock after he throws her into a river; he performs transformations of
    plants, skins, and twigs into valuables and food; he deceives Grizzly Bear with
    transformed food that later reverts; and in a separate episode Fox repeatedly
    tricks Coyote out of deer marrow by flattering his status.'
  language: English
  quote_policy: summarized
