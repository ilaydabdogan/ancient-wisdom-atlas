literal_observations:
- id: obs:1
  text: A boy is described as reaching the sky by means of a growing tree, traveling
    over a prairie, and entering houses where baskets and household utensils are alive
    and beat him when he tries to take one away.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Coyote travels, meets two blind women, takes away their food, makes them quarrel,
    is smelled by them, and the women are transformed into birds.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:3
  text: Several neighboring traditions are summarized with blind women, blind sisters,
    Snail-women, old women, or blind girls whose food is taken; some advise the visitor,
    some have their eyesight restored, and some are transformed into ducks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:4
  text: A boy visits spiders, and the spiders let him down from the sky; other summarized
    versions include two spiders lowering a visitor in a basket tied to a long rope
    and a person let down from the sky by rope.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:5
  text: Raven receives deer-fat from a person he had helped, secretly feeds it to
    his children, and the hidden food is discovered after noise from the children
    and after one child is made to disgorge the fat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: The passage compares the Raven food episode with variants in which fish or
    whale blubber are hidden and discovered when being eaten, and with northern variants
    where a child disgorges food.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Coyote meets a cannibal and proposes that they close their eyes and vomit
    into two dishes; Coyote exchanges the dishes before the cannibal opens his eyes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: One Coast Salish analogue frames the blind-women episode within a man’s attempt
    to recover his wife after she was carried away by a finback whale; he descends
    to the bottom of the sea and meets blind old women.
  category: sequence
  evidence_refs:
  - ev:4
