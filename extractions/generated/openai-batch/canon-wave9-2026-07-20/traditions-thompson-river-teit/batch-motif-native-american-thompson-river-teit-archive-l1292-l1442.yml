  summary: Introductory comparative notes discuss sky-ascent episodes, encounters
    with living utensils or shadows, Coyote’s meeting with blind women, descent from
    the sky by spiders or rope, hidden food discovered through children, coastal analogues,
    and the beginning of a Coyote-and-cannibal episode involving exchanged dishes.
