canonical_text:
  quote: ''
  summary: The passage contains two brief abstracts. In the Kokwe'la abstract, hog-fennel's
    son is mocked for not knowing his father's name, learns from his mother, withdraws
    into solitude, gains supernatural powers, travels downriver transforming people,
    and proves stronger than Qoa’qLqaL. In the Bush-tailed Rat abstract, Rat steals
    provisions, is discovered, kills pursuers with a command-closing door, builds
    a second house with crushing-rock entrance, and is finally overcome and transformed
    into an ordinary animal by a transformer.
  language: English
  quote_policy: summarized
