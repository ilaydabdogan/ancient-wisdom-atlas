canonical_text:
  quote: He then knew that these plants were the stars.
  summary: A cold, hungry, naked traveler later named as NLi’ksentem wanders across
    a treeless plateau where potato-like plants are stars. He enters underground lodges
    whose baskets, mats, and awls attack him when he tries to take one, after which
    he curses these objects to serve people. He descends toward trees, encounters
    two blind old women by a fire, and changes them into grouse after feeling insulted.
    He then meets Spider and Spider’s wife, who call themselves his grandparents and
    feed and clothe him; after purification, hunting, and the growth of a bark thicket
    from four hairs, he supplies them with deer products and good bark.
  language: English
  quote_policy: quoted
