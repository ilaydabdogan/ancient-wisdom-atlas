  summary: A scholarly introduction compares Thompson River Coyote and transformer
    tales with related tales from neighboring and more distant Indigenous traditions.
    It highlights a failed imitation of magical food production, argues for borrowing
    and transmission among traditions, rejects a simple nature-myth reading for imported
    tales, and notes that animal heroes and tale details vary with regional lifeways.
