literal_observations:
- id: obs:1
  text: The passage describes Nlaka'pamux social organization as loose, with no definite
    village communities, no recognized chiefs except by wealth and influence, no clans
    or totems, and marriage barred only between near relatives.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a potlatch system existed before contact with whites,
    was less important than on the coast, and is hardly mentioned in the myths recorded
    in the volume; the author infers recent introduction among the Nlaka'pamux.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Nlaka'pamux religious rituals were not highly developed
    compared with coast tribes, and that there were no secret societies or extended
    ceremonials in which dramatized myths played an important part.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the tribe assembled at intervals for a ceremonial dance in
    which sacrifices seem to have been made to the sun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage connects sun worship ceremonies with the idea that the dead would
    return from the land of the shades.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says about half the volume consists of myths about transformers,
    and names Coyote, the three brothers Qoa'qiqaL, Kokwé'la, and the Old Man as personages
    whose actions gave the world its present shape.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says Coyote and the three brothers are, in a way, culture heroes
    of the tribe, and compares their legends to a wider American Indian class of culture-hero
    legends.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage describes the culture hero as giving the world its present shape,
    killing monsters, giving humans arts, teaching how to kill animals, make fire,
    and clothe themselves, and transforming earlier beings into animals or men.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage also describes the same great culture hero in other tale groups
    as a sly trickster who deceives others, seeks riches or beautiful women, and is
    often punished for presumption.
  category: attribute
  evidence_refs:
  - ev:6
