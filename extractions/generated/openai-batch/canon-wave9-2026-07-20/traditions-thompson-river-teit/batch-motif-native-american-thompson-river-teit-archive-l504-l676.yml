  summary: Introductory ethnographic and comparative-mythological discussion of Nlaka'pamux
    social organization, potlatch, rituals involving the sun and the dead, and mythic
    transformer/culture-hero figures including Coyote, Qoa'qiqaL, Kokwé'la, and the
    Old Man.
  language: English
