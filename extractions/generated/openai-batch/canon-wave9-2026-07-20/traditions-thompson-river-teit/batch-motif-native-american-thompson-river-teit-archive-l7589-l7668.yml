canonical_text:
  quote: ''
  summary: 'Editorial notes record variants and explanations for Thompson River narratives:
    a gifted boy’s extraordinary sight and speed; meanings of xaha’ as mystery or
    supernatural power; possible ritual or medicine objects; local mountains and landforms
    tied to mythic events; Ntci’mka’s wrestling and the distribution of an opponent’s
    body parts; variants about brothers’ travel by canoe over water through darkness
    and light; a returned soul; the capture and anthropomorphic description of Wind;
    and sts(iq as marks, pictures, writing, or birch-bark/rock images with possible
    supernatural power.'
  language: English
  quote_policy: summarized
