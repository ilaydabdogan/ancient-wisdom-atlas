canonical_text:
  quote: ''
  summary: 'The passage contains three etiological narratives: hostile northern cold-wind
    and southern hot-wind peoples end their strife through marriage, after which a
    child becomes floating ice and the winds are moderated; Mosquito misleads Thunder
    about the source of blood so Thunder strikes tree-tops rather than people or animals;
    Beaver and Eagle, aided by Swallow and a clam shell, obtain fire from a family
    at Lkamtci''n and spread it so people can make fire from trees.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The country is troubled by alternating hot and cold winds caused by northern
    and southern wind-making peoples contending with one another.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Indians who live between the wind-making peoples suffer discomfort and
    send deputations asking the wind peoples to stop their conflict.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'A marriage is arranged between the contending parties: a daughter from the
    south is sent to marry a son in the north, and they have one child.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The southern woman later travels south with her child and then returns north
    by bark canoe with her elder brother paddling.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: While crossing a great lake in intense cold, the brother takes the child from
    his sister and throws it into the water; the air immediately becomes warm and
    the child floats as a lump of ice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator states that this explains ice floating on rivers and some lakes
    after a mild wind, and that the hot and cold winds no longer trouble people as
    before.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mosquito visits Thunder while gorged with blood; Thunder asks where the blood
    was obtained and threatens to shoot Mosquito when he receives an evasive answer.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mosquito says he sucks blood from tree-tops; the narrator states that this
    lie saves people and explains why Thunder strikes tree-tops instead of people
    and animals.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: At first people have no fire; Beaver and Eagle send Swallow to search, and
    Swallow reports that fire is held by a family at Lkamtci'n.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Eagle obtains a fresh-water clam shell, and Beaver appears at the watering
    place used by people living in an underground lodge.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Young girls report Beaver at the watering place; young men shoot Beaver and
    begin to skin him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Eagle lands on the top of the ladder and draws the people's attention away
    from Beaver.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Beaver floods the house with water; Eagle drops the clam shell into the fire;
    Beaver fills it with fire, places it under his armpit, and escapes in the water.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Beaver spreads fire over the whole country, and after that the Indians can
    make fire from trees.
  category: sequence
  evidence_refs:
  - ev:8
