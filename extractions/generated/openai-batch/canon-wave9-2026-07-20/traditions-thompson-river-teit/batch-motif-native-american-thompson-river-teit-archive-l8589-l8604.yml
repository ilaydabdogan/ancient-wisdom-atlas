canonical_text:
  quote: ''
  summary: A lad catches the Wind with a snare and releases it under a condition that
    it stop harming people. He travels south to marry a chief's daughter, is carried
    by Coyote, elopes with the woman, steals horses, transforms the horses into birch-bark
    to hide from pursuers, is betrayed by his brothers and thrown into a chasm, and
    is rescued by animals and Coyote before recovering his horse and overtaking his
    wife.
  language: English
  quote_policy: summarized
