canonical_text:
  quote: ''
  summary: The passage contains the end of one narrative in which a young man aided
    by Coyote reaches a chief’s house, elopes with the chief’s daughter, is betrayed
    by his brothers, is rescued from a chasm by an old Coyote, transforms valuables
    for travel, returns to his wife, and is recognized for magic. It then begins a
    Raven narrative in which Raven uses magic to reach a maiden, marries her, carries
    her away before dawn, creates a house, food, and a slave from feathers, and is
    threatened by his father after the marriage is discovered.
  language: English
  quote_policy: summarized
