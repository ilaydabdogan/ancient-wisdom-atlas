canonical_text:
  quote: He will come again at some future time, and will bring back the Indian dead
    from the land of shades.
  summary: The passage first recounts how Bush-tailed Rat uses a commanded door and
    cave-house to trap and kill visitors until an unnamed man blocks the door with
    a spear-head and transforms Rat into the present animal. It then describes Coyote
    meeting the Old Man, also called the Great Chief or Mystery; they test magical
    powers by moving a river and a mountain, and the Old Man proves greater. The Old
    Man says Coyote's work on earth is complete, places him in a hidden ice house
    with an ever-burning log, and foretells a future return that will change the world
    and bring the dead back. A final fragment begins a story in which the Old Man
    tests a magically gifted lad by requiring him to reach a house in seven steps.
  language: English
  quote_policy: quoted
