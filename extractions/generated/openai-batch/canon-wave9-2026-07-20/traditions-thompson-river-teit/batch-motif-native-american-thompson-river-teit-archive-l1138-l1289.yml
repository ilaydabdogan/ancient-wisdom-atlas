canonical_text:
  quote: There are at least four distinct personages who may be considered as culture
    heroes or transformers.
  summary: The passage is an introductory comparative discussion of Thompson River
    transformer myths. It identifies multiple transformer or culture-hero figures,
    especially Coyote, Qoa'qiqat, Kokwé'la, and the Old Man; describes Coyote as a
    powerful transformer and trickster; and compares selected incidents and figure-complexes
    with traditions from the western plateaus, lower Fraser River, coastal tribes,
    Ponca, Kootenay, Blackfeet, and medieval epic analogy.
  language: English
  quote_policy: quoted
