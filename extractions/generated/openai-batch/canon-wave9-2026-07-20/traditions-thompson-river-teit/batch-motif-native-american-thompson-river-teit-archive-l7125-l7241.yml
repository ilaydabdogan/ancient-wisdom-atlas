canonical_text:
  quote: ''
  summary: In the myth, Mosquito hears Thunder say that he will kill the people. Mosquito
    sucks people's blood, becomes swollen, and visits Thunder. When Thunder asks about
    his fatness, Mosquito misdirects him toward trees as the source of blood/food.
    Thunder doubts that trees have blood but says he may kill trees; Mosquito pities
    the people and does not tell the truth. The following notes record variants and
    comparisons, including fire stolen by two men, fire placed into wood or trees
    by Beaver and Eagle, and a lidded-basket drifting survival variant.
  language: English with Nlaka'pamux interlinear text and editorial notes
  quote_policy: summarized
