canonical_text:
  quote: ''
  summary: Stetso' defeats Eagle, takes tail-feathers, kills Buck for sinew, and tricks
    two old men into producing arrowstone, which Raven chips and scatters as arrowheads.
    A war between fishes and the Okanagon explains river windings and present fish
    distributions. Tciski'kik's sister violates a venison prohibition, is attacked
    by her brother, leaves him, transforms into a bird, and his later cry laments
    her absence.
  language: English with Thompson/Nlakapamux terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Stetso' reaches the ground with Eagle, continues fighting, is protected by
    birch-bark armor, chokes Eagle, pulls out Eagle's tail-feathers, and runs away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Stetso's grandmother sends him to the Buck Deer to obtain sinew for his bow-string.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Fawn and Doe announce the approach of the Buck, Buck offers Stetso'
    a ride, and Stetso' cuts Buck's neck while saying he is only scratching lice;
    Buck dies and Stetso' takes sinew from his back.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The grandmother sends Stetso' to two old men who possess arrowstone and live
    in an underground lodge.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Stetso' tells each old man that the other has insulted him, causing them to
    fight; white arrowstone drops from one body and black arrowstone from the other,
    and Stetso' gathers it and leaves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Raven chips the arrowstone into arrowheads of various sizes and shapes, scatters
    them over the country, and the narrative says Indians later found and reworked
    these Raven arrowheads.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: All the fishes go from Lytton to war against the Okanagon and are pursued
    on their return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sturgeon tries to escape by jumping from side to side and running in large
    curves, forming the windings of the upper Columbia River.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Named fishes are overtaken and slain, their bodies are thrown into lakes,
    streams, and rivers, Sturgeon is killed at Lytton, and only the kii/l6x escapes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The story explains present fish abundance and absence in the upper Nlakapamux
    and Okanagon countries, Thompson River, Nicola River, Fraser River, and the area
    above Yale.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Tciski'kik, a great deer hunter, forbids his sister to eat venison while he
    is hunting; she disobeys, and he strikes her and fires an arrow at her because
    he thinks his luck will leave him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The sister leaves Tciski'kik, says she will not live with or talk to him,
    transforms herself into a bird called kaqwa, and disappears.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Tciski'kik later regrets his sister's departure and wails; the present-day
