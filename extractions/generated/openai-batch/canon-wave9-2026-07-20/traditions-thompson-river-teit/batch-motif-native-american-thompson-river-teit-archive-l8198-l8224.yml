canonical_text:
  quote: ''
  summary: 'A brief account says fire and water were kept in boxes in a monster’s
    house and were obtained when Elk opened the boxes out of curiosity. Two versions
    of a Skunk story follow: Skunk covets his brothers’ wives, deceives or accompanies
    his brothers into warlike circumstances, kills them with his secretion, reports
    falsely to their wives, and is later confronted by revived brothers. A second
    version adds war against the Shuswap, creation of yellow pine, a dung-slave episode,
    removal of Skunk’s smell with bearberry, and Skunk’s transformation into an ordinary
    animal.'
  language: English
  quote_policy: summarized
