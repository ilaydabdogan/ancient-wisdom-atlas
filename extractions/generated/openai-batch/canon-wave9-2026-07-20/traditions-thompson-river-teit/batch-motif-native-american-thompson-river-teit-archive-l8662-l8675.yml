canonical_text:
  quote: ''
  summary: Two brothers arrive at a Cannibal's house, are protected by his wife, escape
    by substituting themselves for his sons, steal his magic staff, and cross a river.
    The Cannibal mistakenly kills his own children and is stopped by the river while
    pursuing the boys. Later the brothers work for saloon-keepers; the elder wastes
    his money while the younger saves. A chief orders them to steal the Cannibal's
    fire. The younger brother tricks the Cannibal with salted food, steals the fire,
    then steals the Cannibal's wagon, horses, and finally the Cannibal himself after
    making him drunk.
  language: English
  quote_policy: summarized
