canonical_text:
  quote: ''
  summary: 'The passage gives abstracts of several Old Man episodes: Coyote contests
    strength with the Old Man and retreats to an ice house in the far north; Old Man
    and Coyote are expected to return and bring back dead Indians; a lad visits the
    Old Man, feeds him, and competes with him in a diving test that sends the Old
    Man to the upper world; Old Man is expected to return amid tobacco smoke; Swan
    accompanies Old Man to the upper world and is made white before being sent back;
    in another Swan version, Old Man transforms bad beings and Swan’s wife into animals
    and then transforms Swan after Swan asks for his wife to be restored.'
  language: English
  quote_policy: summarized
