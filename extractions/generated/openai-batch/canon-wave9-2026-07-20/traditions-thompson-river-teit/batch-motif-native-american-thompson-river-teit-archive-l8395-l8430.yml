canonical_text:
  quote: Four brothers have a sister of the size of a thumb.
  summary: Four brothers and their very small sister encounter four Grizzly Bears.
    Through roots containing bear hairs, the brothers are drawn into marriages with
    the bears. The oldest Grizzly Bear kills younger couples, pursues the surviving
    sister, kills her and her child, impersonates her singing, and is finally drowned
    by the Hunter in a hidden water trap.
  language: English
  quote_policy: quoted
