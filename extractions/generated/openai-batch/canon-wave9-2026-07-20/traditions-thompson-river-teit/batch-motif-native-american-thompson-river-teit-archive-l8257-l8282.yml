canonical_text:
  quote: ''
  summary: In the Owl episode, Owl takes a troublesome boy, raises him into a hunter,
    calls him his slave while driving deer toward him on a mountain, and the boy returns
    to his tribe after Short-tailed Mouse says Owl is not his father. In the Marten
    and Fisher episode, the brothers seek Marten’s wife after Spring Salmon takes
    her into the river; they disguise themselves as Salmon’s female relatives, arrange
    for him to sleep late, decapitate him, lose his head in a lake, and Salmon is
    restored after Loon recovers the head.
  language: English
  quote_policy: summarized
