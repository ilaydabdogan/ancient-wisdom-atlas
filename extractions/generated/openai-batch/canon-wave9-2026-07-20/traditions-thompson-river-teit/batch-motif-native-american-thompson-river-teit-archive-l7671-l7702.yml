canonical_text:
  quote: ''
  summary: 'A mythic note about the Moon says that the Moon was formerly an Indian
    who was transformed. It explains the Moon’s dark face through the presence of
    his younger sister, links the Moon with weather and clouds produced by pipe smoke,
    and describes visible objects associated with him: a pipe and a basket used as
    a hat or, in another version, carried on his back.'
