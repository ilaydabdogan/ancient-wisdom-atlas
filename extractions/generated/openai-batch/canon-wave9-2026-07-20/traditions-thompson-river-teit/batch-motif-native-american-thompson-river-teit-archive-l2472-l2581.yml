canonical_text:
  quote: ''
  summary: A rare shining ball used at Lytton is coveted by Coyote and Antelope. Their
    sons are sent to take it; Coyote's sons seize and relay the ball but are killed,
    while Antelope's sons bring it home. Grieving, Coyote later steals the ball, escapes
    pursuit with fog, breaks it open, and uses its hard shining shell as armor while
    transforming into an elk. He attacks the people at Lytton until Meadow Lark reveals
    a small vulnerable hole at his throat. After the elk is shot and butchered, the
    people find excrement and pieces of the ball; Coyote laughs from the hillside
    and returns to Nicola.
  language: English
  quote_policy: summarized
