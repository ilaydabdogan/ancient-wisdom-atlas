canonical_text:
  quote: ''
  summary: In an underground-lodge community, a rejected suitor causes a young woman
    to die. Otter digs up her body on four successive nights and restores her enough
    to sit up and speak, then brings her to her father's house. The community recognizes
    the revived daughter, and Otter becomes a mighty shaman. A boy later asks how
    to revive his own dead sweetheart; Otter jokingly gives a false method involving
    tickling the soles of her feet. The boy imitates this and fails, and the corpse
    is reburied.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The setting is a group of underground lodges somewhere in the NLak‘a/pamux
    country, and one lodge contains a very pretty girl with many rejected suitors
    or lovers.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Otter is described as the girl's real lover, a young man who had spent much
    time in training but was too bashful to ask her parents for her or see her himself.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: One rejected suitor throws a sickness on the girl, and she dies within a few
    days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Otter goes to the grave at night, digs up the body, and attempts to resuscitate
    her until daybreak, then buries the body again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Otter repeats the nighttime digging-up and resuscitation attempt for four
    successive nights.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the fourth night, the girl is restored far enough to sit up and speak to
    Otter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Otter carries the girl to her father's house, lays her in her former place,
    lies beside her, and spreads her robe over both of them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the morning, the parents warn the unidentified couple not to sleep in the
    dead girl's place, and Coyote identifies them as Otter and the sweetheart he dug
    from the grave.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: When Otter and the girl arise, the people recognize that the daughter has
    been brought back to life; messengers call others to gather and see the man who
    restored her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Otter becomes a mighty shaman after the successful restoration.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: A lad asks Otter how he brought his wife back to life because the lad's own
    sweetheart is dead and he wants to resuscitate her.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Otter jokingly tells the lad that he dug the body up, carried her home, tickled
    the soles of her feet, and she came to life; Otter's wife warns that the boy will
    go and do it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: At midnight, the boy carries the body of his dead sweetheart into the underground
    lodge and tickles the soles of her feet until near daybreak, but no sign of life
    appears.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: While the boy tries to carry the body away, his packing-line breaks four times
    on the ladder, and the corpse falls each time.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: On the fifth attempt the boy gets outside with the corpse, becomes afraid
    when someone follows, lets the body down, runs away, and the people rebury the
    body.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Otter is also described as a noted shaman and a very successful fisherman.
  category: attribute
  evidence_refs:
  - ev:8
