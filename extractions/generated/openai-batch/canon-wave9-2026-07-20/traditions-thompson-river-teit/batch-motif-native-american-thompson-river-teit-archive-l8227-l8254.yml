canonical_text:
  quote: ''
  summary: In one abstract, Grizzly Bear and Chipmunk contend over a large fire, with
    Chipmunk maintaining the fire and Bear trying to darken or extinguish it; Bear's
    claws leave the Chipmunk's stripes, and Chipmunk's survival prevents perpetual
    darkness. In another abstract, a girl identifies her lover as a dog by red ochre
    marks, gives birth to four pups, is deserted, discovers the children changing
    between dog and child form, treats them with medicine after taking their dog-skins,
    and the boys become hunters; Magpie reports this to the tribe, which rejoins them.
  language: English
  quote_policy: summarized
