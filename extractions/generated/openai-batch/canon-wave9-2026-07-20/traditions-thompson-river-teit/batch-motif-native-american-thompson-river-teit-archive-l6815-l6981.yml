- id: obs:15
  text: Bush-tailed Rat’s wife is said to have been a kind of mouse, perhaps Short-tailed
    Mouse.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: An unidentified man is conjectured by some informants to have been Coyote
    or one of his sons, perhaps Kokwe’la.
  category: other
  evidence_refs:
  - ev:11
- id: obs:17
  text: Ski’maist is glossed as chipped stone or perhaps thrown stone, a large narrow-head
    said to be fired by thunder.
  category: object
  evidence_refs:
