  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: A place name meaning place of crossing the river is identified with Kanaka
    Bar, and the distribution of kokwe’la is described as increasing eastward above
    that place.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: Indian cellars are described as opening from the top, lacking ordinary doors,
