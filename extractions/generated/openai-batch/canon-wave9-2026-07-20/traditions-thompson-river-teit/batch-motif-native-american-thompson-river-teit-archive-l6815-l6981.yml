canonical_text:
  quote: ''
  summary: Editorial notes explain local place names, variant details, and comparisons
    attached to Thompson River narratives. They describe a balsam poplar tree connected
    with a flood refuge, several Coyote-related landmarks and petrifications, disputed
    routes and stone transformations, place names involving elk and fir branches,
    comparisons with nearby tales, a food-root parentage episode, cellar vocabulary,
    a thunder-associated stone arrowhead, and the mythic figure called the Old Man
    or Chief as a creator-transformer expected to return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A balsam poplar tree is described as once lying rotten on the ground, with
    variant explanations that two men climbed it, that its trunk was carried there
    during a flood, or that two men made it grow as a refuge.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A place near Spences Bridge is named as Coyote’s sweat-house.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A fuller version says the genitalia of Coyote and his wife were turned into
    stone, and a place is called Coyote’s penis.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A bar and rapid in the Thompson River are called Coyote’s fish dam.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The notes report conflicting statements about routes followed by the Qoa’qiqaL.
  category: sequence
  evidence_refs:
