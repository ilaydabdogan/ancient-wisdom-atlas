canonical_text:
  quote: ''
  summary: A girl at Lytton marries the stranger Raven, who removes her without marriage
    presents and hides her at a chasm-enclosed place, creating a house, food, and
    slaves from feathers. A chief or father figure discovers Raven and tries to kill
    him. Raven and his brother travel toward the hidden wife; the brother crosses
    a dangerous log over a chasm, marries Raven's wife, and receives a knife and painted
    birch-bark that can become a horse. Raven kills and buries his brother and takes
    the horse. Raven later marries a chief's daughter, but his brother appears again;
    Raven leaves with the horse, builds a house, and lives with his second wife.
  language: English
  quote_policy: summarized
