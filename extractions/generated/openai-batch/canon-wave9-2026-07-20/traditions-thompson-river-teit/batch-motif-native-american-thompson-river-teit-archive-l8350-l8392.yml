candidate_motifs:
- id: motif:1
  label: Wife taken through engineered heat and exit
  taxonomy_refs:
  - stolen_beloved
  basis: Golden Eagle, aided by the birds, obtains Baldheaded Eagle’s wife when a
    large fire causes her to leave the house and she is taken away.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage is a compressed summary and does not describe the woman’s
    consent, motives, or later status.
- id: motif:2
  label: Sole survivor revives slain companions
  taxonomy_refs:
  - resurrection
  basis: One hawk survives Baldheaded Eagle’s attack and revives all the other birds
    except Baldheaded Eagle.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The mechanism of revival is not described in the supplied passage.
- id: motif:3
  label: Animal resuscitator restores murdered girl
  taxonomy_refs:
  - resurrection
  basis: Otter revives a girl who was killed by her lover after three unsuccessful
    attempts.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The summary does not explain why the first three attempts fail or why
    the fourth succeeds.
- id: motif:4
  label: Failed imitation of a revival method
  taxonomy_refs: []
  basis: After Otter reports tickling the soles as the resuscitation method, another
    man attempts to resuscitate a girl but fails.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage does not state whether the second man correctly applies the
    method or whether some other condition is missing.
- id: motif:5
  label: Deceptive bait leading to wife-killing
  taxonomy_refs: []
  basis: A man pretends to use pieces of his wife’s genitals as bait and thereby induces
    another person to kill his wife.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage is highly compressed and does not describe the setting or
    motive for the bait deception.
- id: motif:6
  label: Jealous co-wife murder and cannibalism
  taxonomy_refs: []
  basis: Grizzly Bear is jealous of Black Bear, kills her husband and Black Bear woman,
    roasts and eats part of the husband’s body, and plans further killing through
    her children.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: No broader cosmological or ritual meaning is stated in the passage.
- id: motif:7
  label: Feasting trap reversed against plotters
  taxonomy_refs: []
  basis: Grizzly Bear instructs her children to make the Black Bear children overfull
    and vulnerable, but the Black Bears remain wary while the young Grizzlies gorge
    themselves and are killed.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage calls the activity playing feasting but does not give performance
    details.
- id: motif:8
  label: Tree refuge and disabling object thrown into pursuer’s mouth
  taxonomy_refs: []
  basis: The young Black Bears climb a tree while Grizzly Bear bites it; they make
