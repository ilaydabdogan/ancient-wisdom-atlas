canonical_text:
  quote: ''
  summary: 'The passage summarizes three Thompson River narratives: a bird conflict
    in which Golden Eagle takes Baldheaded Eagle’s wife and a hawk revives slain birds;
    an Otter episode involving revival of a murdered girl and a failed imitation;
    and a Grizzly Bear and Black Bear episode involving jealousy, killing, cannibalism,
    reversed feasting plots, escape by tree and river, and a final meat-theft deception
    by Fox against Coyote.'
  language: English
  quote_policy: summarized
