canonical_text:
  quote: ''
  summary: Section IX tells of a Lytton man's daughter who marries a stranger from
    the East, bears two children, is deserted as too hot, returns to her father, becomes
    the Sun, and has children who become sun-dogs; her east-to-west travel is her
    search for her father. Section X explains hot and cold winds through North and
    South peoples, peace between the Winds through marriage, and the transformation
    of a woman's child into floating ice.
  language: English
  quote_policy: summarized
