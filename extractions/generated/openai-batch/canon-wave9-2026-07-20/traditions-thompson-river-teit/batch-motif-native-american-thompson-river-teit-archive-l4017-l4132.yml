candidate_motifs:
- id: motif:1
  label: Quest to obtain monopolized fire
  taxonomy_refs:
  - sacred_theft
  basis: One community lacks fire while another has it; two men are sent to get fire
    and later plan to obtain it from Lytton after transforming.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: medium
  cautions: The supplied passage breaks off with a note that the rest is like a preceding
    version, so the exact act of obtaining fire is not given here.
- id: motif:2
  label: Ritual dismemberment followed by revival
  taxonomy_refs:
  - death_rebirth
  - initiation
  basis: Each brother is disembowelled or cut up, his flesh is eaten in a controlled
    ordeal, and he then comes to life or arises.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents the episodes as preparation for obtaining fire, but
    does not explain all ritual meanings.
- id: motif:3
  label: Animal protecting spirits acquired through ordeal
  taxonomy_refs:
  - initiation
  basis: Eagle and Beaver are explicitly identified as protecting spirits secured
    during the brothers' ordeals.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: Only Eagle and Beaver are named as protecting spirits; broader guardian-spirit
    taxonomy would require outside comparison.
- id: motif:4
  label: Transformation into animal forms for a mission
  taxonomy_refs:
  - shapeshifter
  basis: After the ordeals, one brother changes himself into an eagle and the other
    turns into a beaver as they set out to obtain fire.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The subsequent actions in transformed form are not included in the supplied
    passage.
- id: motif:5
  label: Release of world fire and water from sealed containers
  taxonomy_refs:
  - flood_and_renewal
  basis: Fire and water are absent from the outside world until Elk opens the boxes;
    the release distributes fire through wood and creates lakes and rivers.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The water spreads worldwide and forms waterways, but the episode is not
    a flood-survivor narrative in the supplied text.
- id: motif:6
  label: Forbidden opening of dangerous containers
  taxonomy_refs:
  - forbidden_knowledge
  basis: The haxa warns the boy not to open the boxes because of fire and flood dangers;
    Elk opens them out of curiosity, causing those forces to spread.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The prohibition is about opening containers rather than seeking knowledge
    directly.
- id: motif:7
  label: Trickster deception to take relatives' wives
  taxonomy_refs:
  - trickster_boundary
  - stolen_beloved
  basis: Skunk covets his brothers' wives, invents a war, manufactures false enemy
    sounds, incapacitates the brothers, falsely reports them dead, and claims the
    wives.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage identifies Skunk by name and describes deception, but does
    not explicitly call him a trickster.
- id: motif:8
  label: Failed ordinary killing and river-basket exile
  taxonomy_refs: []
  basis: Skunk survives being beaten and left for dead, then tells the brothers that
    only tying him in a basket and setting him adrift will kill him; after this, he
    is never heard of again.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage reports disappearance, not confirmed death.
