canonical_text:
  quote: ''
  summary: The passage contains three narrative units. In the first, people without
    fire send two brothers to obtain it; the brothers undergo sweat-bathing, ritual
    dismemberment, revival, acquisition of Eagle and Beaver as protecting spirits,
    and transformation into eagle and beaver forms. In the second, a haxa and his
    boy possess two boxes containing fire and water before either exists outside;
    Elk opens the boxes, releasing fire and water into the world. In the third, Skunk
    deceives his married brothers in order to claim their wives, is punished after
    the brothers return, and is finally set adrift in a basket on the river.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people at the headwaters of Fraser River had no fire, while the people
    at Lytton had fire, said to have been obtained from Coyote or from the Sun.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The headwaters people sent two men to try to get fire; the two remained four
    months at Tsotcowa’ux Creek, sweat-bathing and strengthening their magic powers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In visions, the two men saw the edges of the world and knew everything.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: One brother asked the other to cut him up, leave the body at the sweat-house
    door, and allow birds to eat all of him except the heart.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When Eagle came, the brother caught Eagle by the tail because Eagle was the
    dismembered brother's protecting spirit; the disembowelled man then came to life
    again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The other brother underwent a similar ordeal with animals eating his flesh;
    Beaver was caught by the tail as his protecting spirit, and the disembowelled
    man arose.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the ordeals, the brothers planned to obtain fire from Lytton, one changing
    into an eagle and the other into a beaver.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A haxa and his boy lived in a distant country, and the haxa had two wooden
    boxes in his house, one containing fire and the other water.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: At that time, there was no fire and no water in the outside world.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'The haxa warned the boy not to open the boxes: one would cause the house
    to burn, and the other would flood the house and drown him.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Elk entered the house, asked what the boxes contained, and opened both boxes
    after learning they held fire and water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The released fire burned the house, spread over the country, burned grass
    and trees, and thereafter could be obtained from every kind of wood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The released water ran out, drowned fire wherever it went, spread over the
    world, and formed lakes and rivers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Skunk had four married brothers, coveted their wives, and proposed to his
    brothers that they go to war against the trees.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Near a river valley, Skunk secretly caught humpback salmon, removed their
    heads, threw the bodies back, and commanded the heads to whoop and sing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Skunk told his brothers the noise was made by many alert enemies and advised
    sleeping there and returning home in the morning.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: While his brothers slept, Skunk emptied bags of fluid odor over their faces,
    and they fell into a dead swoon.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: Skunk returned home, reported that his brothers had been killed, and claimed
    all his brothers' wives.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: When the brothers returned and called for their wives, the wives refused to
    go, saying Skunk had shamed them and they must remain his wives.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:20
  text: The brothers attacked Skunk, beat and wounded him, and left him for dead,
    but he later revived and crawled away.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:21
  text: Skunk told his brothers that the only way to kill him was to tie him, put
    him in a basket, and set him adrift on the river; they followed these instructions,
    and he was never heard of again.
  category: sequence
  evidence_refs:
  - ev:10
