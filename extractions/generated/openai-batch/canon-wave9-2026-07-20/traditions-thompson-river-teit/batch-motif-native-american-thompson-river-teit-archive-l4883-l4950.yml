canonical_text:
  quote: ''
  summary: A younger sister feeds her brothers roots prepared under Grizzly Bear direction.
    Four Grizzly Bear women visit the brothers, and the four hunters take them as
    wives. The eldest Grizzly Bear later kills and eats the younger brothers and their
    wives. The eldest brother flees with his sister to high mountains, marries her,
    and has a child. The Grizzly Bear finds their lodge, kills and eats the woman,
    kills the child, and substitutes wood in the cradle. The Hunter uses gathered
    water in a covered hole to drown the Grizzly Bear and then returns the waters
    to their channels.
  language: English
  quote_policy: summarized
