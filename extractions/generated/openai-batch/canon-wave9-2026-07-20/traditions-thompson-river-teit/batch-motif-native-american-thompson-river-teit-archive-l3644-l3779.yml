canonical_text:
  quote: ''
  summary: The passage contains an origin account in which deer, once the only animals
    and able to leap between mountains, are made ordinary by a woman throwing her
    breech-clout on one, enabling people to hunt them. It then tells of a disobedient
    boy abandoned by his parents and neighbors; with help from an old grandmother
    left under a basket, he learns to maintain fire, make bow and arrows, hunt small
    animals and birds, make blankets, sell the blankets to the Sun, and become a successful
    hunter. The passage then begins a tale in which the Sun, formerly near the earth,
    is a cannibal man whose heat and killings trouble the land; an unlucky gambler
    seeks help through sweating and his protecting spirit, dreams that travel will
    bring good luck, and crosses a great lake on a cloud toward the Sun’s son’s house.
  language: English
  quote_policy: summarized
