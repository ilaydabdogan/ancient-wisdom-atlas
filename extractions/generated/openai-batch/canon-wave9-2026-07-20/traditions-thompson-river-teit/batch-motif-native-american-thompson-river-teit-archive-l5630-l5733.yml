canonical_text:
  quote: ''
  summary: In one narrative, an Okanagon woman refuses marriage offers. Skunk unsuccessfully
    visits her, and Badger steals her breath, causing her death. After burial, Badger
    and Skunk dig up her body; Skunk fails to revive her, while Badger restores her
    by blowing her breath back into her mouth and takes her as wife. She later returns
    with her children to her family, who recognize her as the woman once dead and
    buried. In the next narrative, a youngest son snares the destructive Wind, contains
    it in a blanket, and releases it only after it promises not to harm people. He
    then dreams of a southern chief and daughter, departs to seek her, and is approached
    by Coyote as a guide.
  language: English
  quote_policy: summarized
