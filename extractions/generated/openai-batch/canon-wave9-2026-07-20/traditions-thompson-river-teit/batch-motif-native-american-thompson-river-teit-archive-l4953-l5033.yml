canonical_text:
  quote: ''
  summary: A great fire burns the Ntak‘a'pamux country, leaving a boy and an old blind
    woman alive. The boy trains in magic, travels with his grandmother enclosed in
    hollow wood, uses her gaze to remove obstacles, becomes a wolf and eagle’s down,
    burns several underground lodges, accepts gifts and wives from a chief, and remains
    away from his own country while his grandmother, identified as Short-tailed Mouse,
    lives alone in the mountains. The following story begins with Stetso’, a magically
    endowed survivor of the great fire, who commands trees and fishing gear to make
    a salmon weir and later seeks help making bow and arrows after his fish are eaten.
  language: English
  quote_policy: summarized
