canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a man from earth is hidden
    by the Sun’s son from a cannibal Sun, receives a bundle that becomes abundant
    garments, and later brings women as wives for the Sun and the Sun’s son, after
    which the Sun says he will no longer ordinarily kill people. It then tells of
    the Sun as a chief at Lytton whose beautiful daughter is married by a powerful
    man from the east; after her husband deserts her because she is too hot, she returns
    with children, and her father transforms her into the present sun, while her children
    are seen as sun-dogs.
  language: English
  quote_policy: summarized
