canonical_text:
  quote: ''
  summary: A much-sought maiden refuses all suitors and leaves her father's house
    with her younger sister to visit their grandmother, the female mountain sheep.
    Coyote repeatedly intercepts the sisters by moving his underground lodge ahead
    of them, making cold weather, and offering food; the younger sister eats and becomes
    pregnant, then remains at Coyote's house. The elder sister continues to her grandmother,
    where a Hare episode explains the hare's nose. Animal-men race to meet the elder
    sister, but the grandmother hides and guards her. Lynx secretly spits through
    a hole in the roof onto the woman's navel, causing pregnancy. After her son grows,
    the community tests paternity with bows and arrows; the boy rejects all but Lynx's
    rough fir-branch bow and arrows and identifies Lynx as his father.
  language: English
  quote_policy: summarized
