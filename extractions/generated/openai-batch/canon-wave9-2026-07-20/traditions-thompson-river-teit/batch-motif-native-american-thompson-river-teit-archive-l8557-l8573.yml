canonical_text:
  quote: '"country of the ghosts, across a great lake"'
  summary: Two hunters discover that their mother has disappeared. After preparing
    moccasins, they search in all four directions without success. Their guardian
    spirit instructs them to go across a great lake to the country of the ghosts.
    On the way the light changes from darker to lighter. At the house of the ghosts,
    a man initially bars them, then admits them after removing their mortal parts.
