  quote: ''
  summary: In one summarized tale, the Fishes attack the Okanagon, are pursued, and
    the Sturgeon’s side-to-side jumping makes the course of the Columbia River before
    the Fishes are thrown into the river; the Sturgeon is killed in the Fraser River,
    explaining why it does not ascend the Thompson River. In another summarized tale,
    a hunter strikes his sister after she eats venison while he is away; she becomes
    a golden plover, and he becomes a bird whose cry is interpreted as calling to
    his younger sister.
