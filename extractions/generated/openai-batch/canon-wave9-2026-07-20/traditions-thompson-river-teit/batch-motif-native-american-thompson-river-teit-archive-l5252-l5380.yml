canonical_text:
  quote: ''
  summary: A magician named Ntci'mka lives with his wife near Lytton. A feared cannibal
    near Nxomi'n kills and eats people with a staff decorated with human nails, takes
    Ntci'mka's wife, and defeats Ntci'mka's first magical efforts. Ntci'mka travels,
    steals a little boy, ritually washes, sweats, trains, and equips him with four
    necklaces. The trained lad uses the necklaces to neutralize the cannibal's staff,
    then helps Ntci'mka kill and dismember the cannibal. The body parts are thrown
    toward different peoples and are used to explain traits attributed to them. Ntci'mka
    recovers his wife, kills the cannibal's son, turns the son's body to stone, and
    the place becomes associated with healing practices involving fir branches and
    prayer.
  language: English
  quote_policy: summarized
