- id: obs:11
  text: The cannibal crossed the river and wrestled with Ntci'mka until Ntci'mka weakened
    and called for the lad four times.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The lad struck off the cannibal's head with a large knife and then cut off
