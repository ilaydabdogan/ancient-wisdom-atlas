canonical_text:
  quote: ''
  summary: Coyote sends his two daughters to marry distant hunters and gives them
    two dangerous animal guardians, Grizzly Bear and Rattlesnake. After one daughter
    bears a son, the women take him toward his grandmother but choose the wrong of
    two trails and enter an underground lodge belonging to a Cannibal. The Cannibal
    kills them and puts them in a kettle, but the boy prevents the boiling, revives,
    and opens a way out. During the Cannibal's chase, one woman creates four trees
    from four hairs, and the fugitives climb them. The child slows the chopping of
    the last tree until the Grizzly Bear and Rattlesnake arrive, kill the Cannibal,
    and the party returns. The ending explains why grizzly bears and rattlesnakes
    sometimes kill people.
  language: English
  quote_policy: summarized
