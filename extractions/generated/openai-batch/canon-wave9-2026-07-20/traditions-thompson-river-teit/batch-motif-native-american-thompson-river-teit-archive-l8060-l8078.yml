  quote: ''
  summary: The passage first explains that deer once could leap from mountain-top
    to mountain-top and became ordinary deer after being struck with a woman's breech-clout.
    It then summarizes a story in which a troublesome boy is abandoned by his tribe,
    misled by sounds, finds his grandmother hidden in a basket, receives fire and
    small bows and arrows from her, hunts mice and blue jays, and has their skins
    made into blankets that are exchanged for great power.
