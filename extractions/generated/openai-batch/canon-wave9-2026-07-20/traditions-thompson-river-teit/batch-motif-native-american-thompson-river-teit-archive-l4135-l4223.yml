  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Because they are without weapons, the brothers make their way home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The brothers curse Skunk, saying he shall run on the ground, eat vermin, have
