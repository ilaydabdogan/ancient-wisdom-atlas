canonical_text:
  quote: ''
  summary: Skunk leads his three married younger brothers on a supposed war expedition
    against the Northern Shuswaps, attacks them while they sleep, creates trees, a
    lake, and a cliff, then returns home claiming they were killed. He tries to take
    one brother's wife. The brothers later return, cleanse themselves of his odor
    with bearberry smoke, and curse Skunk to be avoided because of his smell.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Skunk has three younger brothers who are married and live with other families
    as a band or community in Nkamtci’nEmux country.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skunk proposes going on the war-path against the Northern Shuswaps; his brothers
    consent and prepare with vertical white war-paint lines on body and face.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The four brothers camp near the boundary of Shuswap and Nkamtci’nEmux countries,
    close to Marble Canyon and not far from Hat Creek.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Skunk causes yellow pines to appear near the camp, and the brothers use dry
    bark from the trees to kindle fires.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After his brothers fall asleep, Skunk excretes his fluid over their faces,
    causing them to faint, and then takes their weapons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'Skunk causes a lake and a high cliff to appear; the lake has four longitudinal
    color stripes: red, white, yellow, and blue.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Skunk speaks to some of his excrement near the lake, orders it to identify
    itself as his slave, and strikes it repeatedly when it continues to identify itself
    as Skunk's excrement.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Skunk returns toward the dwellings wailing that his younger brothers were
    killed by the Shuswap.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: The people come out armed, recognize Skunk, and ask him to give his news.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Two of the sisters-in-law refuse to go to Skunk, saying that he has killed
    their husbands, while one woman goes to him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Skunk describes supposed wounds by touching the woman's brow, neck, and breast,
    then says that because she was his brother's wife she must now be his wife; she
    consents, while the other two women refuse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After a day or two, the three younger brothers return and report that Skunk
    had been keeping watch when they slept, excreted fluid on them, and intended to
    kill them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The returned brothers report awakening to find cliffs and a lake nearby where
    none had been before.
  category: setting
  evidence_refs:
  - ev:6
