canonical_text:
  quote: ''
  summary: 'A woman marries the root Kokwé''la and bears a son who is shamed for his
    parentage. The son withdraws to the mountains, gains strong magical powers, travels
    through river country, transforms harmful people, defeats the Qoa/qiqaL in magical
    contests, and leaves an etiological trace in the distribution of the Kokwé''la
    root. The passage then begins the Bush-tailed Rat story: a cave-dwelling man with
    a speech-controlled door has abundant provisions, denies having gathered them,
    claims his younger brother Long-Tailed Mouse supplies them, and is observed stealing
    provisions from a village cellar.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed woman, after being rejected by young men, marries the root Kokwé'la
    and gives birth to a son; his mother later tells him Kokwé'la was his father.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other boys call the son names and identify him as the offspring of Kokwé'la,
    causing him shame.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The son withdraws to the mountains, trains, and eventually becomes a man with
    very strong magical powers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After returning, he travels through the country, transforms bad or offending
    people, and reduces the powers of those who injure neighbors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Kapoztcu't near Lytton he meets the Qoa/qiqaL; they test magical powers
    and strength, and Kokwé'la defeats them in every trial.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The place where Kokwé'la and the Qoa/qiqaL camped is said to remain recognizable
    by marks made by their bodies.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kokwé'la travels along the Fraser River region; nobody knows what became of
    him, and the Kokwé'la root is said to grow wherever he went and not to grow where
    he did not travel.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Bush-tailed Rat is described as a man living in a cave in the rocks, abundantly
    supplied with provisions, whose door opens and shuts at his spoken command.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Visitors come to the Bush-tailed Rat; he sometimes acts stingily and claims
    hard times, while nearby villagers live in underground lodges with cellars or
    caches of dried fish and other provisions.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: A village man suspects the Bush-tailed Rat of stealing provisions and asks
    how he has so much food; the Rat says his younger brother Long-Tailed Mouse gives
    him the food.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The village man's wife hides in an opened cellar at night and sees the Bush-tailed
    Rat enter, take provisions, pile them outside, and return with his wife to carry
    them home.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the wife reports what she saw, all the village people go together to
    the Bush-tailed Rat's house, and he orders the door to remain open.
  category: sequence
  evidence_refs:
  - ev:10
