  confidence: medium
  cautions: The passage is an editorial note and phrases the attribution cautiously
    as something that 'would seem' to follow from the story.
- id: motif:2
  label: bodily substance transforms landscape color
  taxonomy_refs:
  - water
  basis: A lake's colored waters are explained as the result of Skunk's secretion
    floating over it.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The note reports a variant rather than a single fixed version.
- id: motif:3
  label: creation of a human-like figure from bodily waste
  taxonomy_refs:
  - shapeshifter
  basis: Skunk turns excrement into a boy, but the boy's identity statement leads
    to his destruction and repeated re-creation.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The available taxonomy does not include a precise excrement-creation category;
    shapeshifter is only approximate because the figure is made by transformation
    of a substance.
