canonical_text:
  quote: ''
  summary: 'A sequence of editorial notes records variant details and local explanations
    connected with Thompson River narratives: Skunk and his brothers, yellow pine
    bark, a colored lake, excrement made into a boy, Skunk''s later transformation,
    fire associated with Coyote''s son, place names linked to grizzly bears and chipmunk
    cries, dog-related women''s medicine taboos, and a Hare-Grizzly exchange about
    fire, snow, and cold weather.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Skunk is described as apparently the creator of yellow pine and as the first
    person to use its bark on the warpath.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The yellow pine bark is said to make little ash, with light ashes that scatter
    easily, making it hard to tell how long ago a fire was used.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A lake and cliff named Tcexpa’tkwetn are located near Marble Canyon and are
    known by both Nkamtci’nEmux and Shuswap names.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: One version says that Skunk's secretion floated over the lake and changed
    the color of its waters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Some narrators say the lake water had three colors: yellow, blue, and red.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some narrators say Skunk turned his excrement into a boy and ordered the boy
    to identify himself as Skunk's little Shuswap slave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy repeatedly identifies himself instead as Skunk's excrement, after
    which Skunk pounds him into a shapeless mass; this is said to happen four times.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A note states that Skunk's brothers were connected with the first use of a
    plant to remove skunk smell from clothes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: One variant says Skunk disappeared from his brothers and was later changed
    into an animal by The Old Man during a transformation of many birds and animals.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A note suggests that a log may have been kindled by Sisiiisxi’n, Coyote's
    youngest son, to give fire to nearby people.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A place on the terrace behind Spences Bridge is named from a story about grizzly
    bears burying or throwing dirt on one another, and is also called by a name meaning
    that grizzly bears fought one another.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: The chipmunk's cry is compared to a sound made by fresh wood on fire and to
    words associated with light.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: Bear vocalization is compared to a word associated with darkness.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:14
  text: Some narrators say a grizzly covered a fire-log with earth after chasing the
    chipmunk away, while another explanation says the fire burned out.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: A note says that dog contact with women in the story explains present-day
    beliefs that a dog is bad medicine for women and that dog urine contaminates articles,
    wood, bark, or weapons.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:16
  text: Another version begins with a girl's parents discovering her sexual relation
    with a dog; the father kills the dog and throws its body into the river, and the
    people leave their houses and desert the girl.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: Some narrators say the Grizzly Bears possessed dried berries, roots, and fish.
  category: object
  evidence_refs:
  - ev:18
- id: obs:18
  text: In one variant, Bear threatens to throw Hare into the fire; Hare replies that
    this would bring snow and cold weather.
  category: speech
  evidence_refs:
  - ev:19
- id: obs:19
  text: The note states that burning the feet, skin, or bones of a hare is believed
    to cause cold or snowy weather, so no part of a hare is thrown into the fire.
  category: relationship
  evidence_refs:
  - ev:19
- id: obs:20
  text: A variant says it was always dark inside Hare's house.
  category: setting
  evidence_refs:
  - ev:20
