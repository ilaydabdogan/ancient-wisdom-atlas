canonical_text:
  quote: ''
  summary: 'The passage first concludes a contest between Coyote and the Cannibal
    in which trials of fire, water, wind, and cold/ice end with Coyote freezing the
    Cannibal, Kua''lum, their daughter, and the village. It then narrates two guest-host
    episodes: Black Bear feeds Coyote and produces grease from her paws near the fire,
    while Coyote later fails painfully to imitate her; Tsala''s feeds Coyote by catching
    fish through an ice-hole, while Coyote later gets his head stuck trying to imitate
    him and must be rescued.'
  language: English
  quote_policy: summarized
