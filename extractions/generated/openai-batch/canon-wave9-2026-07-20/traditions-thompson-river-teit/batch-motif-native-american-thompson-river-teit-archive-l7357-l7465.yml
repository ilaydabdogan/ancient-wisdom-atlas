candidate_motifs:
- id: motif:1
  label: spoken command brings light indoors
  taxonomy_refs: []
  basis: The old woman says that there should be light, and daylight immediately appears
    inside Hare's house.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage presents this as an added variant note without broader narrative
    context.
- id: motif:2
  label: etiological animal trait caused by fire injury
  taxonomy_refs: []
  basis: Hare's burned feet are explicitly said to account for the curious shape of
    Hare's feet.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The motif is local to the Hare episode in this passage; no taxonomy family
    in the supplied list directly names etiological animal traits.
- id: motif:3
  label: revival followed by punitive animal transformation
  taxonomy_refs:
  - resurrection
  - shapeshifter
  basis: Some say Bald-headed Eagle was brought to life again and then, because of
    misconduct, was turned into the present bird.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This is reported as a variant, and the taxonomy link to shapeshifting
    is approximate because the passage frames it as becoming the present bird form.
- id: motif:4
  label: scalping or injury explains animal coloration
  taxonomy_refs: []
  basis: A variant says Bald-headed Eagle was scalped, which accounts for his white
    head.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives only a brief explanatory note.
- id: motif:5
  label: dangerous imitation of a specialist's secret practice
  taxonomy_refs: []
  basis: A man imitates Otter's alleged bait method after asking about fishing success;
    he catches nothing and his wife dies.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage says Otter's wife calls the statement a lie; the motif is
    therefore better described as fatal imitation of false instruction than as a genuine
    secret.
- id: motif:6
  label: post-death avoidance of dwelling place
  taxonomy_refs: []
  basis: The note states a custom of leaving unoccupied for some time a place where
    a person died or usually slept while alive.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: This is presented as a cultural custom note, not necessarily as a narrative
    motif in the passage.
- id: motif:7
  label: threatened hidden girl and sibling information
  taxonomy_refs: []
  basis: A variant says Grizzly Bears pull a girl from a hole by her waist string
    and threaten to kill her unless she gives information about her brothers.
  evidence_refs:
  - ev:19
  confidence: medium
  cautions: The note is fragmentary and the editor elsewhere says details are missing.
- id: motif:8
  label: wise old woman in the mountains
