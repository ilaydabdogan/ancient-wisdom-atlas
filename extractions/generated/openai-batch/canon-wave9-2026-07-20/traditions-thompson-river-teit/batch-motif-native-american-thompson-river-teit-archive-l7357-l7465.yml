canonical_text:
  quote: ''
  summary: A sequence of editorial notes and variant summaries describes Hare, an
    old woman, Duck, eagle traits, Otter's fishing secret and a fatal imitation, bear
    and sibling variants, local customs, comparison references to other traditions,
    and the Short-tailed Mouse as a wise mountain-dwelling old woman.
  language: English, with some Latin phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman says that there should be light, and daylight appears inside
    Hare's house.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'One variant gives the old woman''s face-paint as red stripes: horizontal
    across the upper face and perpendicular on the lower face.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A fuller version says Hare had intercourse with the old woman or grandmother,
    she died immediately, and Hare buried her and felt lonely.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Duck passes Hare on three mornings saying she has no news, then on the fourth
    morning reports news about Hare's act.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Hare becomes ashamed, enters the house hurriedly, walks into the fire, burns
    his feet, and this is given as the reason for the shape of Hare's feet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the shame episode, Hare leaves the place and lives in the mountains.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A dark eagle species is described as almost black except for white tail-feather
    tips; its tail-feathers were formerly prized by warriors and medicine-men.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Some variants say Bald-headed Eagle was brought to life again and then, because
    of misconduct, became the present bird; others say he was scalped, explaining
    his white head.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A noted custom is to leave unoccupied for a time the place where a person
    died or generally slept while alive.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: Otter is described as a noted shaman and very successful fisherman who catches
    many small fish, especially trout.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Otter tells a man that he uses a bodily piece from his wife as bait, that
    it remains on the hook, and that fish rush for it in the water.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Otter's wife warns that the man may believe the false claim and imitate it.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The man imitates the alleged bait-making procedure with his wife, catches
    no fish, and receives news that his wife has bled to death.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The man in the Otter episode is described as an Indian and a hunter.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:15
  text: Variants give different numbers and identities for bears and hunters, including
    four young grizzly bears and four black bears, or three Grizzly Bear sisters and
    three hunters.
  category: other
  evidence_refs:
  - ev:14
- id: obs:16
  text: One variant gives a basketful of service-berries, deer-fat, and boiled starchy
    roots.
  category: object
  evidence_refs:
  - ev:15
- id: obs:17
  text: A named elderly or old man is described as generally employed in making or
    repairing canoes.
  category: attribute
  evidence_refs:
  - ev:16
- id: obs:18
  text: One note says a story is also called the story of Silélaxi'x'tem and gives
    variant mountain locations and a diminutive name explanation.
  category: other
  evidence_refs:
  - ev:18
- id: obs:19
  text: Some versions say a girl sang about her brothers burning the hillside for
    her; Grizzly Bears found her, pulled her from a hole by a waist string, and threatened
    to kill her unless she gave information.
  category: sequence
  evidence_refs:
  - ev:19
- id: obs:20
  text: 'A hunting custom is described: large game is cut into pieces and placed inside
    the skin, with hind-leg skin fastened as a packing strap.'
  category: action
  evidence_refs:
  - ev:20
- id: obs:21
  text: The editor notes that some details appear to be missing and that recent informants
    could not supply further details.
  category: other
  evidence_refs:
  - ev:21
- id: obs:22
  text: Short-tailed Mouse is generally described as an old woman who lives alone
    in the mountains, has great magic and wisdom, is a prophetess, and is consulted
    in difficulties.
  category: attribute
  evidence_refs:
  - ev:23
