canonical_text:
  quote: ''
  summary: The excerpt first concludes an animal-person episode in which Black Bear
    brothers conceal dead Grizzly Bear children, flee from the She-Grizzly Bear, escape
    her at a tree, and are ferried across a river by their grandfather, whose canoe
    crossing leads to the She-Grizzly Bear's death. Coyote then roasts the dead Grizzly
    Bear's body, but Fox steals the meat and frames Coyote's children with grease.
    The passage then begins the tale of four mountain hunter brothers and their small
    sister Sildlaxi!x'tem, who digs roots with her tiny dog, the Louse; four Grizzly
    Bear sisters find her, accompany her home, and hide outside the lodge before the
    brothers return with deer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Black Bears put the youngest dead Grizzly Bear on a stick to roast, placed
    the other dead Grizzly Bears where the Black Bears usually slept, covered them
    with rotten wood and ant-hills, and fled toward their grandfather's house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The She-Grizzly Bear began eating the small bear on the spit, was warned by
    Meadowlark that it was her own child, recognized the body by the claws, and then
    found her other children dead.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The She-Grizzly Bear pursued the Black Bears near the river; they climbed
    a tree, and she first claimed their parents had returned before threatening to
    kill them and biting the tree at its base.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The eldest Black Bear threw dry rotten wood mixed with ants into the She-Grizzly
    Bear's face, choking and blinding her, after which the three brothers descended
    and ran to the river.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The grandfather S’qéné/qa™ was patching his canoe on the opposite side of
    the river, came across for the Black Bears, and landed them safely on the far
    side.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The grandfather took the She-Grizzly Bear into his canoe, made her sit on
    an unpatched hole, and large fish bit her through the hole and pulled out her
    entrails until she landed and fell dead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Coyote found the She-Grizzly Bear's body, cut it up, put pieces on sticks
    to roast at a fire, and went to sleep with his two children while intending to
    eat the meat in the morning.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Fox came at night, ate the fat meat roasting at the fire, and smeared grease
    on the mouths of Coyote's two children and on Coyote's hands.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the morning Coyote thought his children had eaten the meat and beat them;
    they pointed out grease on his hands, after which he guessed what had happened
    and lamented the lost meat.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Four brothers lived as hunters in the mountains with a very small sister named
    Sildlaxi!x'tem, who dug roots on a burned mountainside with a deer's-hoof basket,
    a tiny dog called the Louse, and deer marrow for food.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: Four Grizzly Bear sisters came to the burned root-ground, heard the girl's
    song about her brothers hunting, and found her because her dog and its string
    led to the root hole where she had hidden.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Grizzly Bear sisters filled the girl's basket with roots, accompanied
    her home, hid outside the lodge, and the brothers later returned after dark carrying
    deer and praised the amount of roots she had cooked.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
