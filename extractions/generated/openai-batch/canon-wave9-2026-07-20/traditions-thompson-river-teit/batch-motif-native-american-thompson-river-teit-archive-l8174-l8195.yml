canonical_text:
  quote: ''
  summary: The passage gives a brief etiological account of why Thunder strikes tree-tops,
    followed by two versions of an origin-of-fire tale. In the first, Swallow discovers
    the fire owners at Lytton, and Eagle and Beaver use a clamshell, capture, distraction,
    and flooding to take fire and escape. In the second, two brothers gain supernatural
    powers; the elder undergoes killing, animal consumption, and revival, and the
    brothers later transform into Eagle and Beaver before the rest follows the first
    version.
  language: English
  quote_policy: summarized
