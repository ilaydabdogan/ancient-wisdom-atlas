canonical_text:
  quote: ''
  summary: A noisy child is taken and raised by Owl, becomes a hunter, learns Owl
    calls him a slave, receives advice from Short-tailed Mouse, and returns to his
    own people. In the following tale, Marten and Fisher are brothers. Marten’s wife
    follows Spring Salmon into the river. Marten and Fisher arrange care for the child,
    disguise themselves in Spring Salmon’s underground lodge, recover the woman, decapitate
    Spring Salmon, and drop his head in a lake. Spring Salmon’s people recover the
    head with Loon’s help, and Otter and Wolf revive him by shamanic treatment.
  language: English
  quote_policy: summarized
