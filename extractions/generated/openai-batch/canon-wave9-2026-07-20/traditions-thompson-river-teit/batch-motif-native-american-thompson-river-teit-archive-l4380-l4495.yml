candidate_motifs:
- id: motif:1
  label: stolen child raised by non-parent returns to own people
  taxonomy_refs:
  - return
  basis: Owl takes the child and raises him; Short-tailed Mouse reveals that Owl stole
    him, and the boy returns to his people.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The supplied taxonomy has no exact stolen-child category; “return” is
    used only for the final movement back to the child’s own people.
- id: motif:2
  label: animal-person hunting partnership with concealed subordinate status
  taxonomy_refs: []
  basis: Owl and the boy hunt together, but the boy learns that Owl calls him a slave.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: This is a passage-level pattern rather than a named taxonomy motif.
- id: motif:3
  label: brother pair recovers a taken wife
  taxonomy_refs:
  - sibling_pair
  - stolen_beloved
  basis: Marten and Fisher are brothers; Marten says Spring Salmon has bewitched and
    taken his wife, and the brothers go to get her.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The woman initially voices desire for Spring Salmon; the passage also
    describes bewitchment and taking, so the “stolen beloved” classification should
    be reviewed.
- id: motif:4
  label: disguised infiltration of spouse’s new household
  taxonomy_refs:
  - trickster_boundary
  basis: Marten and Fisher disguise themselves as female relatives of Spring Salmon,
    enter the lodge, and coordinate with the woman to enable escape.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage contains disguise and boundary-crossing, but does not explicitly
    frame Marten or Fisher as a trickster.
- id: motif:5
  label: decapitation, lost head, recovery, and restoration to life
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: Spring Salmon is decapitated; his head is dropped into the lake, recovered
    by Loon, placed on the body, and Spring Salmon is brought back to life by shamans.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:13
  - ev:14
  confidence: high
  cautions: The restoration is specifically shamanic treatment of a corpse; broader
    resurrection taxonomy should be checked against project usage.
- id: motif:6
  label: deep-water retrieval by specialized diver
  taxonomy_refs: []
  basis: Several birds fail to recover Spring Salmon’s head; Loon says only he can
    dive to such a depth and retrieves it after the reward is trebled.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: No exact available taxonomy reference for this retrieval pattern.
