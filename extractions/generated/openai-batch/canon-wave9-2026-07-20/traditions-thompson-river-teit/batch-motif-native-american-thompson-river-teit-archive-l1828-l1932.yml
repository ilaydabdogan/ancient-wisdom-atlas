canonical_text:
  quote: ''
  summary: The passage recounts a flood that covers the country except high mountain
    tops, leaving Coyote and three canoe-borne men as survivors; Coyote survives by
    becoming wood, while the men and canoe become stone. After the waters recede,
    Coyote resumes form, takes trees as wives, and the receding flood explains mountain
    lakes, streams, and fish. A second narrative tells how Coyote creates sons from
    clay, tree gum, and white stone. The clay and gum sons fail under water or sun,
    while the stone son survives both. Loon and Mallard Duck betroth their daughters
    to the stone son, who becomes NLI/KSENTEM. Coyote becomes jealous of the wives,
    creates a false eagle nest atop a growing tree, and deceives his son into climbing
    until he reaches the sky country.
  language: English
  quote_policy: summarized
