canonical_text:
  quote: ''
  summary: The passage is an analytical introduction discussing self-interested transformer
    or culture-hero figures in northern and northwestern North American traditions
    and a Kamchadal comparison. It summarizes examples involving Kunyan, the Klamath
    Old Man, Kutka, and the Raven creator, then argues that the transformer’s world-shaping
    acts and introduction of arts often arise incidentally from personal adventures,
    rivalry, revenge, failures, and successes rather than altruism.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage summarizes Kunyan as making the first arrows, killing people,
    building a raft when a deluge threatened, collecting animals on it, bringing mud
    from the sea bottom to create a new earth, and obtaining water for his own use.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Klamath myths describe the Old Man as a creator who, while
    ridding the country of malevolent beings, kills North Wind and South Wind in revenge
    because they killed his brother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the Kamchadal god Kutka, as described by Steller, corresponded
    to the Raven creator of the Alaskan Indians.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that the being who gave the world its present shape and
    gave humans arts was not presented as altruistic but as acting in personal adventures
    and often against enemies.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage contrasts this transformer with the ordinary idea of a benevolent
    culture hero and says he helps humans only incidentally while pursuing his own
    interests by fair or foul means.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The passage says that when this figure fails he may appear as a foolish trickster,
    while his successes benefit later beings or generations.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:7
  text: The passage compares this condition to medieval Christian attitudes toward
    the devil as a powerful being seeking his own interests, while noting that the
    devil seeks souls and the Indian transformer has many different enemies.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage explains the apparent benefits of the transformer’s acts by arguing
    that traditions tend to treat present conditions and arts as results of earlier
    changes and introductions.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says many stories about the primitive status of the world refer
    to heroes extinguishing monsters.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage concludes that the apparent discrepancy disappears if the so-called
