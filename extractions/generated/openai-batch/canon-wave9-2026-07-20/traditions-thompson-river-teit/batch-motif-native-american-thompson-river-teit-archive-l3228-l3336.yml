- id: obs:1
  text: Two brothers flee rising water by climbing the mountain Ca'/nExanEnEmax while
    their younger brother remains below by a camp-fire with the waters standing back
    from him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the water overflows the mountain top, the two men take refuge in a tall
    poplar tree and ask the younger brother for mercy, acknowledging his superior
