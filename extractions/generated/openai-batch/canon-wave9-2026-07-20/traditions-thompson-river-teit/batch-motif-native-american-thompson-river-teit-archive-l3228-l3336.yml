  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The younger brother puts on a beaver-skin headband, after which the water
    recedes to its normal level.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the flood episode, the three become good friends and continue travelling
