canonical_text:
  quote: ''
  summary: A sequence of Thompson River traditions describes brothers escaping and
    controlling a flood, travelling transformers who turn beings and objects into
    stone or animal forms, encounters with Coyote and his wife, visible landscape
    traces, Eagle and Skunk as cannibal beings changed into common animals, a girl
    in ritual training who petrifies the travelers, and the opening of a separate
    Kokwe'la story about a maiden refusing marriage.
  language: English
  quote_policy: summarized
