- id: obs:1
  text: Black Bear and Chipmunk contend against each other, with Bear acting for darkness
    and Chipmunk for light.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bear finds Chipmunk equal in magical power, becomes angry, and attempts to
    kill him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chipmunk escapes into his hole as Bear attacks, and Bear scratches Chipmunk
    while he enters the hole.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The scratch is given as the origin of the present stripes on Chipmunk's back.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says that if Bear had killed Chipmunk, there would have been eternal
    darkness instead of day and night.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: A chief's daughter at Lkamtci'n refuses numerous marriage offers and responds
    angrily when her father asks whether a dog is to be her husband.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: One rejected suitor, gifted in magic, changes a dog into a young man who visits
    the girl at night and changes back into a dog at daybreak.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The girl marks her hidden lover with red ochre on her hands and later sees
    red ochre streaks on her father's dog.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The woman gives birth to four male pups, and her father and the people leave
    her and go to Beta'ni.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The woman lives in a lonely place above Lytton, works to feed herself and
    her children, and spears fish by torchlight along the river bank at night.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The woman sees her children in human form playing together; when they become
    aware of her approach, they put on dogskins and become dogs again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The woman prepares four kettles of medicine, blocks the children from reaching
    their dogskins, and throws the medicine over their bodies so they cannot resume
    dog shape.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The four sons grow into beautiful fair-complexioned young men, become great
    hunters, and fill deserted village houses and cellars with deer fat and dressed
    skins.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: The sons put the best food and skins in the houses and cellars of Raven and
    Crow because those two had earlier left fish-heads for their mother.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Magpie visits from Beta'ni, receives hospitality, and reports to the people
    that the woman and her sons are alive and prosperous.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Some people, including Wolf, doubt Magpie's report, but the people return
    to the old village and find the report true.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: After resisting for a long time, the woman and her sons move to the village;
    the sons marry many wives and have many children.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: The beginning of the next tale states that Owl was formerly a great hunter
