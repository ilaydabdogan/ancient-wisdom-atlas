canonical_text:
  quote: ''
  summary: The Black Bear and the Chipmunk contend, Bear for darkness and Chipmunk
    for light; Bear attacks, Chipmunk escapes into a hole, and Bear's scratch explains
    the chipmunk's stripes and the present alternation of day and night. In 'The Dog
    and the Girl,' a chief's daughter rejects suitors; a rejected magical suitor changes
    a dog into a young man who visits her at night and is identified by red ochre
    marks. She gives birth to four male pups, is abandoned, later discovers the children
    become human when their dogskins are removed, and uses medicine to keep them in
    human form. The sons become wealthy hunters, the people return, and the sons marry
    and have many children. The next tale begins by saying Owl was formerly a great
    hunter, with hunters camping near his mountain haunts.
  language: English
  quote_policy: summarized
