canonical_text:
  quote: ''
  summary: A young man seeks to marry among frog-people whose smell has caused previous
    suitors to enter a death-sleep. After five years of mountain medicine preparation
    and a dream of Frog, he enters safely, marries two maidens, discovers a giant
    frog, and later persuades the frog-eaters to eat deer. Those who refuse are turned
    into dogs, while the others become ordinary human beings, move near SetL, intermarry,
    and are named as ancestors of some Lillooet people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Earlier young men went to marry young women of the lake, entered the houses
    of the frog-people, were overcome by the smell of frog, fell into a sleep, died,
    and had their bodies thrown outside.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One young man went into the mountains, prepared his medicine for five years,
    dreamed of Frog, and gained knowledge for escaping death while having intercourse
    with the frog-eaters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The frog-people were living in underground lodges during winter.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: An elderly person warned the youth that entering would cause him to die like
    the earlier visitors.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The youth stayed inside while the inmates cooked and ate frog and frog fat,
    but he did not eat it and did not fall into the death-sleep.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The youth married the two prettiest maidens among the frog-people.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The new son-in-law was taken to hunt frogs and instructed not to kill any
    himself, but to tell the people if he saw any.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: While drinking from a swamp or bog near the back of Lillooet, the young man
    saw an enormous frog about as large as a bear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the young man reported the enormous frog, the frog-eaters killed it
    and carried it home.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The young man became disgusted with the frog-eaters' diet and decided to change
    the food of a people who regarded only frog as edible and deer as bad medicine.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young man hunted a large deer in the mountains, brought it home, lowered
    it into the house, and persuaded the people to eat it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Three people refused to eat the deer, ran away, and were turned into dogs
    that are said to haunt the lake and yelp at sunrise.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The other frog-people became ordinary human beings after eating venison, moved
    near SetL, intermarried with other people, and are described as ancestors of some
    Lillooet tribes.
  category: sequence
  evidence_refs:
  - ev:9
