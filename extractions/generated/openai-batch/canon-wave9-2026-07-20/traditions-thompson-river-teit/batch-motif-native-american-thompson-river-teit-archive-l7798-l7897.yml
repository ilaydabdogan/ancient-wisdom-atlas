canonical_text:
  quote: ''
  summary: 'The passage is an abstracted sequence of Coyote narratives: flood survival
    and landscape formation; Coyote''s making of sons and his son''s sky ascent, transformations,
    and etiological acts; Coyote''s contests, thefts, and deceptions; the stealing
    and breaking of a glittering ball; and Coyote''s daughters'' dangerous journey
    involving animal-dogs, a wrong trail, a cannibal, magically made trees, and rescue.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men try to escape a deluge in canoes, are turned into stone, and Coyote alone
    is saved; after the flood runs out, lakes and streams remain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote makes boys from gum, clay, and quartz; the gum boy melts in the sun,
    the clay boy dissolves in water, and the quartz boy withstands heat and water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Coyote covets his son's wives and sends his son up a tree by transforming
    dung into an eagle's nest and making the tree grow to the sky.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Coyote's son reaches the sky, encounters animate household utensils, curses
    them to be servants of humans, transforms two blind women into grouse, and is
    let down by Spider in a basket after a warning about four obstacles.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Coyote's son returns to earth, gives insects their forms, is recognized by
    an unseen child, and performs acts involving deer, Raven, a packing-line, a fish-dam,
    boxes of smoke and insects, salmon, mountain sheep, rock, dentalia, and grizzly
    bear.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Fox steals bones that Coyote has boiled before Coyote can eat them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Coyote meets a cannibal with necklaces made of fingernails, makes dung into
    a dog covered with arrowheads, tricks the cannibal by exchanging dishes of vomit,
    and obtains a staff that produces dead deer when struck on the ground.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Coyote and Antelope send their sons to steal a glittering ball from the people
    at Lytton; Coyote's sons are killed, while Antelope's children succeed in bringing
    it home.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Coyote flees with the ball, makes fog, breaks the ball near Lytton, finds
    it filled with dung, uses shell fragments as armor, attacks people in elk form,
    and is struck in his unprotected throat.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Coyote's daughters take Grizzly Bear and Rattlesnake as dogs when going to
    marry two hunters; later they take the wrong trail to a cannibal's house, escape,
    make four trees, and are rescued when Grizzly Bear and Rattlesnake kill the cannibal.
  category: sequence
  evidence_refs:
  - ev:10
