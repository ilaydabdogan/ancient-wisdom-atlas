canonical_text:
  quote: ''
  summary: Coyote observes Magpie's deer-snaring method, imitates it, and becomes
    trapped until people kill the attacking buck. A following episode tells of three
    magical brothers, especially the youngest, travelling from the Fraser River area,
    transforming people and places, challenging other powerful beings, shaping visible
    landscape features, and ending in a quarrel in which the youngest's fire-resistant
    beaver-skin headband causes river water to rise.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote goes to the mountains to watch Magpie and learn his hunting method.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Magpie uses a net-snare near his underground lodge, angers a buck deer with
    insults, leads it into the snare, jumps over the snare, and kills the entangled
    deer.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Coyote sets a similar net-snare near his house and insults a buck deer, but
    he fails to jump over the snare, becomes entangled, and is prodded by the deer
    until people kill the buck.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Qoa'qitqat are three brothers who travel up from the mouth of the Fraser
    River; the youngest brother is described as the most gifted in magic.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The travelling brothers perform transformations, leave footprints and other
    signs, and are said to have created water-springs over the country.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The brothers try to overcome Kokwé'la with magic, but Kokwé'la defeats them
    in everything.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Zixazix the brothers meet Tci'i'sqa'lemux, a magic-gifted man who lives
    with his wife in an underground lodge and lives by eating people and fishing.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The youngest brother turns himself into a large salmon and carries away Tci'i'sqa'lemux's
    only spear-head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The brothers bring the spear-head to Tci'i'sqa'lemux's house despite his wife's
    warning that her husband eats men.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tci'i'sqa'lemux's wife serves food in a very small basket with large spoons;
    the brothers cannot finish it, the food appears undiminished, and Tci'i'sqa'lemux
    eats it all in one spoonful.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The brothers kick down a mountain on Tci'i'sqa'lemux four times, but he remains
    standing; they then turn his house and basket into stone.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The brothers turn a Coyote family, a pile of dried salmon, children standing
    around it, and a cellar into stone.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The brothers camp on a small island under a mountain, light a fire, and the
    two elder brothers throw the youngest brother's beaver-skin headband into the
    fire, but the fire does not burn it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: After finding his headband in the fire, the youngest brother says he will
    drown his brothers; when he pulls the headband from the fire, the river water
    begins to rise.
  category: sequence
  evidence_refs:
  - ev:11
