canonical_text:
  quote: ''
  summary: Hare and his grandmother live across a river from a family of Grizzly Bears.
    Hare steals their dried fish, mocks and evades the female bear, and kills her
    with the help of smoke from pitchwood thrown into the fire by his grandmother.
    He kills the male bear in the same way after the male discovers the female's paws
    in Hare's house, and he kills three of the young bears. The text notes that if
    all had been killed there would be no grizzly bears. Hare then cohabits with his
    grandmother and kills her.
  language: English
  quote_policy: summarized
