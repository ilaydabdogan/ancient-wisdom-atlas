canonical_text:
  quote: ''
  summary: Coyote meets a cannibal with a magic staff and a ferocious dog. He creates
    a dog from his excrement, deceives the cannibal in a vomiting contest, wins a
    dog fight, exchanges the excrement-dog for the cannibal’s magic staff, and later
    loses the staff after greedily overusing it to summon deer carcasses, which revive
    and injure him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote is travelling when he hears jingling and sees a man approaching with
    a large staff and an immense ferocious dog.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote defecates, asks his excrements the man’s name, and the excrements identify
    the approaching man as a cannibal.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The cannibal cries that he eats people and wears necklaces made of human finger
    and toe nails; his dog wears a collar of the same material.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Coyote defecates again and transforms the excrement into a large dog covered
    with arrowheads instead of hair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Coyote imitates the cannibal’s cries and actions while leading the arrow-covered
    dog.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In a vomiting contest, the cannibal produces human flesh and venison, while
    Coyote produces swamp grass and similar material.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: While pretending to continue vomiting, Coyote switches the piles so that the
    cannibal’s vomit appears before him and Coyote’s swamp grass appears before the
