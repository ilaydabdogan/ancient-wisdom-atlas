  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Coyote’s dog, called Cikata’na, defeats the cannibal’s dog; its tail cuts
    trees and bushes, and the arrowheads injure the opposing dog.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The cannibal exchanges his magic staff for Coyote’s dog and explains how the
    staff produces a deer carcass when struck once on the ground with the cry ‘pimm.’
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the exchange, the cannibal wakes to find only Coyote excrement where
    the dog had been tied.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Coyote repeatedly strikes the staff despite the warning, causing many deer
    carcasses to fall around him until he is nearly covered.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The deer come to life, jump on Coyote, kick him senseless, and afterwards
    both the deer and the staff are gone.
  category: sequence
  evidence_refs:
