canonical_text:
  quote: ''
  summary: 'The passage contains the end of a Hare narrative in which Hare steals
    dried salmon from a Grizzly Bear family, kills the parents with help from smoke
    and heat produced by pitchwood, kills three of the children while the youngest
    escapes, and later kills his grandmother after ordering her to wash, comb, dress
    her hair, and paint her face. It then gives the Battle of the Birds: the birds
    help Hala''u steal the Baldheaded Eagle''s wife by heating the lodge during a
    game so she goes outside. The Eagle trains, arms his neck with birch-bark, and
    kills many bird challengers. Hala''u is also slain, but Ha''tahat finally kills
    the Eagle, takes the woman, and restores the dead birds to life except for the
    Eagle.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Hare lives with his old grandmother in an underground lodge on one side
    of a large river, while the Grizzly Bear family lives on the other side.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Grizzly Bears have plenty of dried salmon in their cellar, and the Hare
    has none; the Hare declares that he will steal their dried fish despite his grandmother's
    warning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Hare crosses the river by canoe at night, steals all the dried fish, and
    hides it in a hole in his underground lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the Grizzly Bear wife asks about the stolen salmon, the Hare sits over
    the hiding place and mocks her by imitating her voice and words.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the fight with the Grizzly Bear wife, the Hare tells his grandmother
    to put pitchwood on the fire; the resulting blaze, heat, and smoke hinder the
    Bear, and the Hare kills and butchers her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Parts of the killed Grizzly Bear wife are hung under the ladder, and falling
    fat reveals the killing to her husband.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The Grizzly Bear husband attacks the Hare, but the Hare again calls for pitchwood
    to be put on the fire, and the husband is killed and butchered.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Hare goes to the Grizzly Bears' underground lodge, kills three of the
    four children, and the youngest escapes; the narrator states that otherwise there
    would now be no Grizzly Bears in the world.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Hare orders his grandmother to wash, comb and dress her hair, and paint
    her face; after she does so, he kills her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: All the birds agree to help Hala'u steal the Baldheaded Eagle's wife, who
    is described as good but ill treated by her husband.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The birds enter the Baldheaded Eagle's underground lodge, play lehal with
    him, complain of cold, and keep adding wood to the fire so that the lodge becomes
    very hot.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: When the wife goes outside to cool herself, Hala'u takes possession of her
    and conducts her to his house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Baldheaded Eagle trains, puts on a collar of several thicknesses of birch-bark,
    positions himself on top of the ladder at Hala'u's house, and challenges the assembled
    birds to battle.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: Successive birds have their hair combed by the woman before going out to fight
    the Baldheaded Eagle, and many are slain, including Raven, Chicken Hawk, and Fish
    Hawk.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Hala'u, also wearing a birch-bark collar, fights the Baldheaded Eagle in a
    battle that rises to the clouds and drops to the earth; Hala'u is slain and decapitated.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Ha'tahat has his hair combed, fights the Baldheaded Eagle, kills him, takes
    possession of the woman, heals the dead birds' wounds, puts heads back on bodies,
    and the birds come to life again except for the Baldheaded Eagle.
  category: sequence
  evidence_refs:
  - ev:11
