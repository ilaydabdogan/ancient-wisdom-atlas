candidate_motifs:
- id: motif:1
  label: food theft from dangerous owners
  taxonomy_refs: []
  basis: The Hare steals all of the Grizzly Bears' dried salmon from their cellar
    despite being warned that they are powerful.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The theft is explicit, but the passage does not describe the salmon as
    sacred.
- id: motif:2
  label: small or agile figure defeats stronger opponents through heat and smoke
  taxonomy_refs:
  - trickster_boundary
  basis: The Hare steals, mocks, and defeats the powerful Grizzly Bear parents by
    calling for pitchwood to be put on the fire so that smoke and heat disadvantage
    them.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage does not explicitly call the Hare a trickster; the taxonomy
    association rests on transgressive behavior and tactical boundary-crossing.
- id: motif:3
  label: surviving youngest animal explains present species
  taxonomy_refs: []
  basis: The youngest Grizzly Bear child escapes, and the narrator says that if it
    had not escaped there would now be no Grizzly Bears in the world.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No available taxonomy reference directly names an etiological species-survival
    motif.
- id: motif:4
  label: wife theft by stratagem
  taxonomy_refs:
  - stolen_beloved
  basis: All the birds help Hala'u steal the Baldheaded Eagle's wife by heating the
    lodge so she goes outside, where Hala'u takes possession of her.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The woman is described as ill treated by her husband, so the episode is
    not simply a recovery of a beloved spouse.
- id: motif:5
  label: fire or heat used as tactical force
  taxonomy_refs: []
  basis: Fire, heat, and smoke are used both to weaken Grizzly Bear opponents in combat
    and to lure the Baldheaded Eagle's wife outside.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  - ev:8
  confidence: high
  cautions: This is a recurring tactic within the passage rather than a supplied motif-family
    taxonomy item.
- id: motif:6
  label: aerial combat between champions
  taxonomy_refs:
  - ascent
  basis: The fight between Hala'u and the Baldheaded Eagle rises to the clouds and
    drops back to the earth, and Ha'tahat's later fight is also described as repeatedly
    flying up to the clouds and back.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The ascent is part of battle movement, not a quest or ascent narrative
    in itself.
- id: motif:7
  label: restoration of slain companions to life
  taxonomy_refs:
  - resurrection
  basis: After killing the Baldheaded Eagle, Ha'tahat heals the wounds of the dead
    birds, replaces their heads on their bodies, and they come to life again.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The Baldheaded Eagle is explicitly excluded from the restoration.
- id: motif:8
  label: grooming as preparation before death or battle
  taxonomy_refs: []
  basis: The Hare makes his grandmother wash, arrange her hair, and paint her face
    before killing her; in the bird battle, challengers have their hair combed by
    the woman before going out to fight.
  evidence_refs:
  - ev:6
  - ev:9
  - ev:11
  confidence: medium
  cautions: The passage repeats grooming gestures, but it does not state their symbolic
    meaning.
comparison_claims:
- id: claim:1
  claim: The Battle of the Birds episode fits a motif-family comparison with a stolen-beloved
    or wife-theft pattern because the birds explicitly agree to help Hala'u steal
    the Baldheaded Eagle's wife, and a series of battles follows.
  claim_level: same_motif
  target: stolen_beloved
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The woman is described as ill treated by her husband, so the passage
    complicates a simple beloved-abduction framing.
- id: claim:2
  claim: Ha'tahat's restoration of the slain birds supports comparison with a resurrection
    motif family, since dead birds are healed, reassembled, and come to life again.
  claim_level: same_motif
  target: resurrection
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The restoration is selective; the Baldheaded Eagle remains dead.
- id: claim:3
  claim: 'The Hare episode has a functional resemblance to a trickster-boundary pattern:
    the Hare crosses the river at night, steals food, mocks the owners, and uses smoke
    and heat to defeat stronger beings.'
  claim_level: same_function
  target: trickster_boundary
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not explicitly name the Hare as a trickster, and the
    violence against children and grandmother should not be reduced to comic trickery.
