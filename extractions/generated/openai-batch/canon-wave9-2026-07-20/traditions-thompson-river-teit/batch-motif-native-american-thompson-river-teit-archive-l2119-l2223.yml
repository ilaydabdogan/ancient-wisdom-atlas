canonical_text:
  quote: ''
  summary: Raven discovers that Nui'ksentem has returned with deer fat and meat, tries
    to keep the secret, but reveals it after suspicion and threats. Nui'ksentem feeds
    the people, then tricks Coyote with a deer pack whose entrail packing-line breaks,
    sending Coyote into the river. Coyote becomes a small board, is carried downstream,
    is made into a dish by two old women, and emerges from fire as a rapidly growing
    boy. After being forbidden to open four boxes, he breaks a fish-dam, releases
    salmon upstream, opens the boxes, and releases smoke and insects. Later he encounters
    four bathing women and throws sickness into the youngest, whom shamans cannot
    cure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven listens outside a lodge, hears a man's voice, enters, and finds Nui'ksentem's
    wife and child eating deer fat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nui'ksentem's wife says her husband has returned and offers Raven deer meat
    every evening after dark if he will not tell anyone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raven hides deer fat among cooked moss to feed his children; the children
    quarrel over it and attract suspicion from neighboring people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A watcher seizes one young raven by the throat, obtains disgorged deer fat,
    and the people threaten Raven until he explains where the meat came from.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The people go to Nui'ksentem's lodge, congratulate him on his return, and
    are fed until their hunger is satisfied.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Nui'ksentem makes deer entrails into a decorated packing-line, ties up deer
    meat with it, hangs the meat in a tree, and tells Coyote he may have it if he
    carries it home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Coyote crosses a creek on a log, the packing-line breaks, the pack falls
    into the creek, and Coyote falls in on the other side of the log.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Coyote is swept into the Thompson River, changes himself into a small piece
    of board, and floats down into the Fraser River toward unknown lower regions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Two old women find the board caught at their fish-dam, take it home, and make
    it into a dish.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Fish placed on the dish disappear too quickly for the women to eat enough;
    one woman throws the dish into the fire, and an infant's cry comes from the fire.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The women pull a boy from the fire; he grows rapidly but is disobedient and
    hard to rear.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: The women keep four wooden boxes in their house and forbid the boy to take
    the lids off them.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: Coyote breaks the fish-dam so salmon can ascend the river, then opens the
    four boxes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Smoke, wasps, salmon-flies, and beetles issue from the boxes after Coyote
    opens them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: Coyote runs ahead of the salmon; smoke, wasps, and flies follow the salmon,
    some salmon go up the Thompson, and most go up the Fraser.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Coyote sees four young women bathing, addresses them, and after the youngest
    answers, throws sickness into her; shamans are unable to cure her.
  category: sequence
  evidence_refs:
  - ev:7
