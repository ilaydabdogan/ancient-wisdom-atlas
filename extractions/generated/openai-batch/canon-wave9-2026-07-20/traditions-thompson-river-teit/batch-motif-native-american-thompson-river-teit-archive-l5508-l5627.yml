- id: obs:3
  text: The husband boils the genitalia in a basket-kettle, presents it to his wife
    as medicine, and after she eats it he tells her what it was; she becomes sick,
    vomits, and leaves for many days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two young men live happily with their mother; they are hunters, and she makes
