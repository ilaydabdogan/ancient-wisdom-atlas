canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a husband disguises himself
    as his wife to kill a water spirit paramour and then deceives his wife into eating
    the spirit's genitalia. It then tells of two devoted brothers whose mother disappears;
    they search the four directions to the edges of the earth, learn through a protecting
    spirit that she is in the land of the dead, and reach that land by canoe over
    a great lake. A guardian prevents mortal entrance, but removes one brother's mortal
    part so he may enter while the other returns. The passage begins another tale
    in which Skunk and Badger, powerful medicine-men and gamblers, win property from
    Okanagon opponents through lehal and horse racing.
  language: English
  quote_policy: summarized
