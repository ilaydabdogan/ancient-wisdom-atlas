canonical_text:
  quote: ''
  summary: The passage is an introductory comparative discussion of transformer myths.
    It contrasts egotistical and altruistic motives in culture-hero figures, using
    examples from Algonquin, Kwakiutl, Tsimshian, Kamchadal, Blackfeet, Micmac, and
    Penobscot traditions. It describes transformations of enemies into animals, acquisition
    of water through slaying a monster, distribution of religious ceremonials, teaching
    of arts, origins of death and animal fat, and the later separation of culture-hero
    and trickster aspects. It also cautions that collectors and missionaries may have
    emphasized altruistic motives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Algonquin Manibozhoo is described both as instituting
    secret societies for mankind's benefit and as the subject of absurd stories.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kwakiutl transformer meets enemies planning his death, transforms them
    into animals, and ordains that they will be food for humans.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Kwakiutl transformer, being thirsty, slays a monster that had killed a
    whole tribe in order to obtain water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kwakiutl transformer later gives laws for religious ceremonials after
    encounters with clan ancestors who test their powers against him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the Kwakiutl transformer is vanquished, the adversary obtains privileges;
    when he is stronger, he gives ceremonials to the rival as a present.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage contrasts the Kwakiutl transformer, who is revered as a culture
    hero, with the Tsimshian Raven, who is recognized as creator but not thanked for
    his actions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage reports a Kamchadal view that Kutka was foolish and could have
    arranged creation better.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Blackfeet transformer is said to have taught many arts to humans because
    he pitied them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Blackfeet example, death results from a bet between the transformer
    and a woman, and animals obtain their fat at a feast given by the transformer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that, where the altruistic idea is more developed, tales
