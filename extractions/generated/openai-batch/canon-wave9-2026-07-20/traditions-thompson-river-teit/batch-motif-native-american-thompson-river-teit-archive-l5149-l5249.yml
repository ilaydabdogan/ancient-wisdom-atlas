canonical_text:
  quote: ''
  summary: The passage contains an ending narrative about one brother stolen by Ants
    into an underground/lower world and another brother finding him through guidance
    from an Ant messenger, Spider, Crow, and a dream. It then gives the Story of Aq,
    in which a giant crying “Aq” kills seven women and swallows their hearts; a boy
    survivor reports the event, seven armed men disguise themselves as women, kill
    the giant, recover the hearts, and restore the women to life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two brothers lived with others in an underground lodge; one brother disappeared,
    and the other searched for him unsuccessfully and became sorrowful.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The missing brother had been stolen by the Ants and taken to their abode underneath
    the ground, where he played lacrosse or ball with them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The missing brother stopped playing and said a tear on his hand was his brother’s
    tear from the upper world, showing that his brother was searching and weeping
    for him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: An Ant went to the upper world from underneath the firestone of the lodge
    and informed the upper brother about his brother below.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The upper brother asked how to go below; the Ant refused to tell him directly
    and sent him to Spider, while Spider said his thread was too weak and sent him
    to Crow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Crow said he would instruct the brother in a dream, and the dream told him
    to find a hole under the firestone, shut his eyes, jump and roll over a sequence
    of obstacles four times, and then open his eyes in the lower world.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brother followed the dream instructions, reached a fine country where
    the Ant people were playing ball, and found his brother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Seven women and a boy went into the mountains to dig roots and camped near
    the intended digging place.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: A gigantic man approached the camp from the timber, repeatedly crying “Aq,”
    and answered the women only with that cry.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the women slept, the gigantic man killed them by ripping open their
    stomachs and swallowing their hearts; the boy survived by hiding beneath an overturned
    basket and then reported the event.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Seven armed men accompanied the boy back, disguised themselves to resemble
    women, carried baskets and root-diggers, and concealed weapons on their bodies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: When the gigantic man returned, the disguised men surrounded and killed him,
    cut him up, threw parts toward surrounding tribes, found the women’s hearts in
    his stomach, replaced the hearts, and the women arose.
  category: sequence
  evidence_refs:
  - ev:9
