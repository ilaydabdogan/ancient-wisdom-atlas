canonical_text:
  quote: ''
  summary: In a Lillooet tradition set when the earth was still being shaped, a maiden
    conceives Tsu'ntia through intercourse with the Kokwe'la root. Tsu'ntia becomes
    a powerful magic worker, transforms an insulting boy into a fish, seeks the truth
    about his father, and throws his mother into a lake after repeated false answers.
    He travels widely, transforming people and landscape features. He meets four young
    black bear brothers, exchanges magical tests and food with them, creates a stone
    sleeping place, then later disappears and is said to have gone up to heaven. A
    following section says that Tsu'ntia's mother, in the lake, produces Frog-people
    through intercourse with the lake; they live apart, eat frogs, and use frog-skins
    as blankets.
  language: English
  quote_policy: summarized
