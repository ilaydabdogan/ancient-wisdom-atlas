- id: obs:4
  text: After a lad calls him a bastard and names the Kokwe'la root as his father,
    Tsu'ntia changes the lad into a tsan'atz fish, strikes his head with a stone,
    and curses him to be eaten by people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tsu'ntia asks his mother who his father is; after she says his father drowned,
