canonical_text:
  quote: ''
  summary: Notes to several Thompson River traditions record variant readings, object
    and place glosses, comparative tale references, descriptions of water beings,
    tests of a lad, Coyote and Magpie incidents, uncertainty about the number and
    name of the brothers or companions, and variants involving falling earth and petrification
    near named Thompson River places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes describe Haxaa'tko as inhabitants of certain lakes or streams with
    forms that combine human and fish features.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A variant says Kua'lum took a lad out a fourth time with a like result, but
    the note says the fourth test experience was not learned.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The editor gives a list of tales from other tribal or published traditions
    for comparison with the relevant tale sections.
  category: other
  evidence_refs:
  - ev:3
  - ev:11
- id: obs:4
  text: Variant notes connect Coyote with a visit to Black Bear, a birch-bark dish
    used before the fire, and an explanation of Coyote's present paws.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Magpie is described as a successful hunter and trapper who used snares for
    deer; variants differ on whether a figure passed or jumped through the meshes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The notes state uncertainty about whether the name QoaqLqaL and related pronunciations
    apply to the youngest brother, the group as a whole, or separate unnamed brothers.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Variants count the group as two brothers, four brothers, or companions rather
    than brothers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: S'a'tcinko is glossed as the NLak'a'pamux name for the Qauitcin people of
    lower Fraser River, and a Lillooet mythological report says they came from the
    sea.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The notes identify Zixazi'x as a place near Spences Bridge with a sliding
    mountain, and also describe a nearby mountain north of Thompson River.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: Variants say a figure avoided falling earth by jumping to a cliff and that
    Tci'sq@'lEmux, his wife, or an unnamed man and woman were turned into stone.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A variant says an unnamed female figure changed an unnamed male figure into
    an ordinary hare.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: A note points to other contradictory versions of the origin of fire.
  category: other
  evidence_refs:
  - ev:10
