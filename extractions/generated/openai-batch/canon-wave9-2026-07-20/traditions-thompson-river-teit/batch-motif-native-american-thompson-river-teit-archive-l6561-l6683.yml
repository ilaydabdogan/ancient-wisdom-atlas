canonical_text:
  quote: ''
  summary: Editorial notes identify a beetle name; explain the origin of salmon-associated
    insects through opened boxes and Coyote's introduction of salmon; give variants
    involving bathing women, a girl’s illness, shamans, and a sweat-lodge episode;
    list comparisons to tales from other tribes; describe a shining gold-colored object,
    houses turned to stone, Antelope traditions, a Cannibal-kettle episode with fire,
    a tree action variant, and alternate story-part titles involving Lynx and Coyote's
    sons.
  language: English with some Latin inset passages
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kakulx'u’ is given as the name of a small gray-headed variety of beetle, also
    called meat-bugs by whites.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The opening of boxes is said to have caused the first appearance of smoke-wasps,
    salmon-flies, blow-flies, and meat-beetles, explaining why these insects accompany
    the salmon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The insects are said to have been unknown before Coyote introduced the salmon.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A variant says Coyote took salmon past Lillooet, turned back, and conducted
    them up Thompson River.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Variants mention three maidens or women bathing on the opposite river bank
    while Coyote was carrying a small pack of salmon.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Latin note describes Canis/Coyote causing an affliction to the youngest
    woman or girl through a sexualized act; other women help her home, and shamans
    are unable to cure her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Another Latin note describes Canis/Coyote entering a sweat-lodge situation,
    blocking an entrance with a blanket, singing, attempting intercourse, and the
    girl recovering after the cause of illness is removed; people then recognize him
    as a dog.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The editor lists numerous comparable tales from other tribes and published
    sources for surrounding sections of the narrative.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: An object or entity is described by Indians as gold-colored and shining or
    sparkling like the sun, with a crust thought to be gold or another bright metal.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: One or both houses near Nsi’’skEt are said to have later been turned into
    stone by the Qoa’/qiqaL.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Antelope is mentioned in Nlakapamux mythological stories; some say he was
    a great friend of Coyote, though the animal did not inhabit the local country
    and was known by description as swift.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: A variant places the last of Antelope’s sons at Thompson Creek or at Tsotcowa’ux
    Creek.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:13
  text: A note says some versions have the boy not speak, and the Cannibal places
    him in the bottom of the kettle; another note says the fire went out and comments
    that kettles over fires are recent in this passage form.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: A variant says a male figure simply urinated on the tree or on the topmost
    point of the tree.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: The story is sometimes divided into separate parts called the Story of the
    Lynx and the Story of the Coyote’s Sons.
  category: other
  evidence_refs:
  - ev:15
