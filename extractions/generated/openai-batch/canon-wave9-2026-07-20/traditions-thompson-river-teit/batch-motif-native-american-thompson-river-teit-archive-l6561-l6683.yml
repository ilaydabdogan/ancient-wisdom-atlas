candidate_motifs:
- id: motif:1
  label: Culture hero introduces salmon
  taxonomy_refs:
  - culture_hero
  basis: Coyote is credited with introducing the salmon and conducting them by a route
    into Thompson River.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage is an editorial note rather than the complete narrative episode.
- id: motif:2
  label: First appearance of creatures from opened containers
  taxonomy_refs: []
  basis: The opening of boxes is said to cause the first appearance of several insects
    that accompany salmon.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No supplied taxonomy family directly names this origin pattern.
- id: motif:3
  label: Trickster sexual boundary violation causing illness and cure
  taxonomy_refs:
  - trickster_boundary
  basis: Canis/Coyote’s sexualized actions cause the girl’s illness and a later sweat-lodge
    episode removes the cause, after which she recovers.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The fuller details are preserved in Latin notes; the taxonomy label is
    interpretive and should be reviewed.
- id: motif:4
  label: Transformation of houses into stone
  taxonomy_refs: []
  basis: One or both houses are said to have been turned into stone by the Qoa’/qiqaL.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The note points to another story for the Qoa’/qiqaL, so the local context
    is incomplete.
- id: motif:5
  label: Cannibal places boy in kettle near fire
  taxonomy_refs: []
  basis: A variant says the Cannibal places the boy in the bottom of a kettle, with
    another variant saying the fire went out.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The editor notes the kettle-over-fire form is recent because kettles were
    not traditional in this context.
- id: motif:6
  label: Animal figure remembered outside local natural range
  taxonomy_refs: []
  basis: Antelope appears in mythological stories and is linked with Coyote despite
    not inhabiting the local country; some know it only from older descriptions of
    its swiftness.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is partly an ethnographic distribution note rather than a narrated
    motif.
