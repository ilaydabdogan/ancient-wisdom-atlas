  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Nlaka'pamux are described as primarily hunters and fishermen, subsisting
    largely on venison and salmon, with berries and roots collected by women also
    forming an important part of the diet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The passage describes a seasonal round: winter residence in river valleys,
    spring movement to the mountains for roots and hunting, summer camps near rivers
    for curing salmon, and later visits to hunting grounds for deer.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In spring, large numbers assembled in higher valleys, especially Beta’ni,
    where women dug and cured roots while men gambled.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Winter houses were underground lodges with roofs of beams, mats, and dirt,
    a central opening and ladder, a fireplace at the ladder’s foot, and beds near
    the walls.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: In summer, people lived in circular or square tents made of bark or rush mats,
    and many household utensils were made of woven basketry or birch bark.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Clothing consisted largely of deerskin shirts, leggings, robes, moccasins,
