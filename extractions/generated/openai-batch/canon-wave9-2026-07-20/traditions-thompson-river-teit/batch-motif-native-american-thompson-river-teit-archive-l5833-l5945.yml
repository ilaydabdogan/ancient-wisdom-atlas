canonical_text:
  quote: ''
  summary: 'The passage contains the end of a Raven narrative in which Raven and his
    younger brother travel to Raven''s hidden wife, the younger brother crosses a
    dangerous magical chasm-log, receives a knife and a stsiq that becomes a black
    horse, is murdered by Raven, revives, and departs with the horse. Raven later
    maintains separate wives and abandons the Lytton wife and children. The passage
    then gives etiological accounts of the Moon: Moon was once an Indian; his younger
    sister darkens his face; his halo is his house; clouds are his pipe smoke; and
    the Pleiades cluster because they gathered in his crowded house.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven tells his younger brother that they should travel, and they travel toward
    the place where Raven has hidden his wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hidden wife's place is surrounded by a deep chasm crossed by a single
    long thin log that Raven's magic makes turn over when stepped on in the center.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The younger brother sees a young woman washing, crosses the log by magic,
    asks her to become his wife, and she agrees because he has seen her naked body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman magically causes food to appear and gives the younger brother a
    long knife and a stsiq that can become a horse when thrown down and become stsiq
    again on command.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The younger brother throws down the stsiq, which becomes a large black horse;
    Raven later overtakes him, understands what happened, and resolves to kill him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: While the younger brother sleeps near a village, Raven takes the long knife
    from the horse, cuts off his brother's head, and buries the body in a shallow
    grave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Raven rides the black horse into the village, wins races, obtains wealth,
    and receives the chief's daughter as wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The younger brother comes to life again, appears at Raven's doorway, later
    leaves, and is seen the next morning riding the horse out of the village.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Raven keeps his new wife and his wife from Lytton in separate houses, living
    with each in turn without either knowing of the other.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Raven later accompanies his Lytton wife back to her people, builds a house,
    leaves food and toys for the children, promises to return soon, and does not return.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Moon was formerly an Indian; his younger sister sits on his face and darkens
    it; when rain or snow threatens he builds a halo-house; clouds are described as
    smoke from his pipe; he is seen holding a pipe and wearing a basket as a hat.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the second Moon account, Moon is a handsome white-faced Indian whose friends
