canonical_text:
  quote: ''
  summary: 'Two brothers travel to the house of a cannibal, escape by stealing his
    magic staff, and later the younger brother repeatedly steals or captures things
    from the cannibal for a white town: the house-light, wagon and horses, and the
    cannibal himself. The younger brother tricks the cannibal with salt and whiskey,
    confines him in an iron coffin, and brings him to town. When released, the cannibal
    kills and eats the townspeople; the lad alone escapes home with the staff and
    wealth.'
  language: English
  quote_policy: summarized
