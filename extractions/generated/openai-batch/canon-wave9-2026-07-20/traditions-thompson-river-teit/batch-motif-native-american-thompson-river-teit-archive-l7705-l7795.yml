canonical_text:
  quote: Visible now the woman sitting on his face holding the buckets
  summary: The Moon is described as formerly an Indian whose friends were the stars.
    He calls the Pleiades and other friends, but only the Pleiades arrive and crowd
    his house. He sends his younger sister, identified as Hare in the main text and
    as Frog in a variant note, to fetch water. When she returns and says there is
    no place to sit, he tells her to sit on his face. Thinking he is joking, she jumps
    on his face. The passage explains that she is now visible on the Moon’s face holding
    buckets and darkening him, and that the Pleiades are grouped and travel as the
    Moon’s friends.
  language: English interlinear translation with Indigenous-language transcription
  quote_policy: quoted
