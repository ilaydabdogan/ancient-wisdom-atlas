canonical_text:
  quote: ''
  summary: A man noted for powerful medicine steals another man's horse. The owner
    pursues him through magically created obstacles, later strengthens his own medicine
    through mountain training and ritual discipline, creates a lake and canoe, and
    seeks the stolen horse, which has been changed into a loon. Meanwhile the pursuer's
    wife becomes stronger in magic, changes her husband and canoe into a fish, changes
    Teal Duck into a man, and marries him.
  language: English
  quote_policy: summarized
