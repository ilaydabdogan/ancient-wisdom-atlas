canonical_text:
  quote: ''
  summary: 'The passage first recounts an Old Man episode in which a lad feeds the
    Old Man, the Old Man proposes a diving trial in a deep lake, and the Old Man rises
    on a sky-reaching wave into the upper world. The lad thinks he has drowned, while
    the narrator says the Old Man will someday return with Coyote to help the Indians.
    The passage then gives two Swan-origin accounts: in one, Swan is a good chief
    who accompanies the Old Man, reaches the Old Man’s abode, returns for his child,
    and receives a white skin as a mark of favor; in another, a man looks back toward
    a transformation scene after an injunction not to do so, and the Old Man changes
    him into a swan and throws him onto a lake.'
  language: English
  quote_policy: summarized
