  quote: ''
  summary: The passage gives abstracts of narratives involving sisters pursued by
    suitors and married to Coyote and Lynx; Coyote’s sons and a Cannibal’s lethal
    tests; Coyote’s failed imitation of animal guests; and three Qoa’qlqal brothers
    who travel up Fraser River, transform beings and objects into stone, use salmon
    transformation and flood-making, and are finally turned to stone after looking
    at a dancing girl.
  language: English
