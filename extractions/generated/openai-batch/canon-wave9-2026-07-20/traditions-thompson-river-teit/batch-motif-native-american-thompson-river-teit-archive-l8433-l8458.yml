canonical_text:
  quote: ''
  summary: The supplied passage summarizes two adjacent tales. In one, a boy and his
    old blind grandmother survive a country-wide fire; the boy carries her in a hollow
    log, obstacles vanish when she looks at them, and he later changes form to burn
    his enemies while sparing a chief who offers his hidden daughters. In the next,
    StEtso’, another fire survivor, produces and dries fish by word, discovers theft,
    receives advice from his grandmother, fights eagles in the air, takes animal materials,
    obtains black and white arrowstones through a quarrel, and brings them to Raven
    for arrow-heads.
  language: English
  quote_policy: summarized
