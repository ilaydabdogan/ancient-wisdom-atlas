canonical_text:
  quote: ''
  summary: 'The passage summarizes three Thompson River narratives: in AQ a crying
    monster eats women’s hearts before being killed by men disguised as women, its
    body parts distributed to neighboring tribes, and the women revived; in Ntci’mka
    and the Cannibal, Ntci’mka uses a magically grown boy helper and protective necklaces
    to defeat a wife-taking cannibal whose body is partly distributed and partly transformed
    into healing stone, followed by an origin account of porcupine quills; in The
    Woman and the Haxaa’tko, a husband discovers his wife calling a lake monster,
    disguises himself in her dress, kills the monster, and feeds part of it to her.'
  language: English
  quote_policy: summarized
