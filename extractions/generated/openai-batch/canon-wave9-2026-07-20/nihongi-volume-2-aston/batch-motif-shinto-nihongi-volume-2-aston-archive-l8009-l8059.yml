canonical_text:
  quote: ''
  summary: 'The passage records events in A.D. 613: a white-flecked emigrant from
    Pékché is almost cast away but is retained for his skill in making figures of
    hills and mountains; another emigrant, Mimachi, transmits music and dancing learned
    from Wu; ponds and a highway are constructed; and the Prince Imperial feeds and
    clothes a starving roadside man at Katawoka and composes a song about him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man emigrated from Pékché with face and body flecked with white; the passage
    suggests he may have had white ringworm, and people disliked his appearance.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: People wished to cast the white-flecked emigrant away on an island in the
    sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The emigrant argued against being discarded and said he could make figures
    of hills and mountains for the country’s advantage.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The people listened, did not cast him away, and had him draw figures of Mount
    Sumi and the Bridge of Wu in the Southern Court.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The man was called Michiko no Takumi and also Shikomaro.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:6
  text: Mimachi, another man from Pékché, emigrated to Japan and said he had learned
    a style of music and dancing from Wu.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mimachi was lodged at Sakurawi, where young people were gathered to learn
    the arts from him; named learners included Deshi, Manu no Obito, and Seibun, Imaki
    no Ayabito.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The ponds of Waki no Kami, Unebi, and Wani were constructed, and a great highway
    was laid from Naniha to the capital.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Prince Imperial travelled to Katawoka and saw a starving man lying by
    the roadside; when asked his name, the man did not answer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Prince Imperial gave the starving man food and drink, removed his own
