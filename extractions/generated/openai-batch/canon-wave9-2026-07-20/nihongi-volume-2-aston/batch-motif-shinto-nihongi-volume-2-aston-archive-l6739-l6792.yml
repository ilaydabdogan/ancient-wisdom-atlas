canonical_text:
  quote: ''
  summary: 'The passage records court and religious events in Empress Suiko''s reign:
    an imperial reinterment, the beginning of Shi-ten-o-ji, an instruction to promote
    the Three Precious Things, aristocratic temple-building, the discovery and presentation
    of fragrant lign-aloes wood, the arrival of two Korean-peninsula Buddhist priests,
    and the arrival of a general and followers from Tsukushi.'
  language: English
  quote_policy: summarized
