literal_observations:
- id: obs:1
  text: The opening fragment describes something associated with Ihashiki no Muraji
    meeting a contrary wind, being driven to Erh-kia-wei in the Southern Sea, and
    being destroyed by islanders.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Arima, Yamato no Aya no Wosa no Atahe, Inadzumi, Sakahibe no Muraji, and three
    others stole a ship belonging to the islanders and escaped to Kwachow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Officials of the district sent the escapees under escort to the capital, Loh-yang.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ship of Kiza no Muraji arrived at Mount Hsu-an near Kuei-chi; a north-east
    wind then blew violently, after which the party reached Yii-yao and left the great
    ship and its gear behind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The travelers reached the seat of government of the Yueh district, entered
    the capital on post-horses, reached the Eastern capital where the Emperor resided,
    and obtained an audience.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Emperor asked about the Empress's health, the ministers' condition, and
    peace within the country; the Envoys answered that the Empress's virtue and the
    Government accorded with Heaven and Earth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Emperor asked where the land of the Yemishi was situated and how many
    tribes there were; the Envoys answered that it lay to the north-east and that
    there were three kinds, including Tsugaru and Ara-Yemishi.
  category: speech
  evidence_refs:
  - ev:7
