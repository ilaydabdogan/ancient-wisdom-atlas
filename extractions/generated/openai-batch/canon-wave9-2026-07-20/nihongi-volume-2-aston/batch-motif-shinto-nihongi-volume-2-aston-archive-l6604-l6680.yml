canonical_text:
  quote: ''
  summary: The passage reports court alarm over violent threats and weapons, sends
    messengers to Tsukushi, recounts Koma’s clandestine union with the imperial concubine
    Kahakami and his killing, then begins Book XXII with the genealogy and accession
    of the Empress Toyo-mike Kashiki-ya-hime, also called Princess Nukada-be and Suiko
    Tenno. After the Emperor Hatsuse-be is murdered and the succession is vacant,
    ministers petition her three times, deliver the Imperial Seal, and she assumes
    the Imperial Dignity at Toyora Palace.
  language: English
  quote_policy: summarized
