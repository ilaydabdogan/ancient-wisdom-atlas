  summary: The passage records land-allotment rules, taxes and service obligations,
    palace service arrangements, the Emperor's occupation of Koshiro and orders to
    repair arsenals, homage by Yemishi, and an imperial decree at the Eastern Gate
    presenting the Emperor as a sacral ruler and endorsing institutions for hearing
    complaints and remonstrances. The decree cites ancient Chinese sage-ruler precedents
    involving bells, street buildings, flags, boards, and drums used to gather public
    opinion.
