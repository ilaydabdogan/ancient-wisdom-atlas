canonical_text:
  quote: ''
  summary: 'The passage records events of A.D. 540 and the following year: the Emperor
    assumes the Imperial Dignity, an Empress is appointed and royal children are named,
    foreign immigrants and envoys are received and registered, the capital is moved,
    the Emperor visits a shrine and consults ministers about Silla, Ohotomo no Kanamura
    is accused and then acquitted by the Emperor, and the Emperor takes concubines.'
  language: English
  quote_policy: summarized
