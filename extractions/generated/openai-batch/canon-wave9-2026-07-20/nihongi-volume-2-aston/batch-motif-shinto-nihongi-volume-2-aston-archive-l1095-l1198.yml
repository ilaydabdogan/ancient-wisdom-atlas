  summary: 'The passage describes political tensions among Kara, Silla, Pékché, Ara,
    Imna, and Japan: a royal marriage alliance between Kara and Silla breaks down
    after a dispute over Silla costume and escort; Silla seizes castles; Japanese
    imperial envoys and local rulers conduct negotiations; and the King of Imna petitions
    for imperial assistance against Silla incursions.'
