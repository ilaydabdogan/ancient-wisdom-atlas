canonical_text:
  quote: The Emperor of Japan decrees that Imna shall be wholly re-established.
  summary: In the fourth month, named Kanki and other officials from Ara, Kara, Cholma,
    Tara, and Sa-i-ki, together with Kibi no Omi, the Japanese Commissioner for Imna,
    proceed to Pékché and hear an imperial edict about restoring Imna. King Syéng-myóng
    of Pékché consults with them, recalls earlier friendship and oath-making with
    Imna authorities, proposes communicating again with Silla, and promises assistance
    if Silla invades before envoys return from reporting to the Emperor.
  language: English
  quote_policy: quoted
