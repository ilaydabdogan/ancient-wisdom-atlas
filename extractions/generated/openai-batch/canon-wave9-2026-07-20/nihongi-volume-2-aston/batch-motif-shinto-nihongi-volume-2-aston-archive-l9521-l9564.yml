canonical_text:
  quote: ''
  summary: The passage opens Book XXIV by naming the Empress Ame toyo-takara ikashi-hi
    tarashi hime, gives her imperial genealogy and mother, states that she governed
    according to the ancient path, records her earlier appointment as Empress-consort
    and the death of that Emperor, then records her assumption of Imperial Dignity.
    It also describes Soga no Omi Yemishi retaining the office of Oho-omi, his son
    Iruka taking control of government and producing public order through fear, and
    the envoy Hirafu returning from Tsukushi with news of condolence ambassadors sent
    by Peékché after hearing of the Emperor’s death.
  language: English
  quote_policy: summarized
