  summary: The passage narrates successive military orders and battles during a conflict
    involving the Emperor's forces and the Afumi party. It includes troop deployments
    by mountain routes, use of a red clothing mark and a spoken watchword to distinguish
    allies, internal killing among Afumi commanders, surrender and reappointment of
    an Afumi general, fortification of the ancient capital with bridge planks, a suspected
    ambush causing retreat, a silent midnight attack with gagged soldiers, and later
