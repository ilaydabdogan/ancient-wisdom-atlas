literal_observations:
- id: obs:1
  text: The Emperor sent named commanders with several tens of thousands of men toward
    Yamato by way of Mount Miyama in Ise and sent another force from Fuha toward Afumi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A red mark was placed on the clothing of the Emperor's troops so they could
    be distinguished from the army of Afumi.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Honji was ordered to take 3000 men and encamp on the plain of Tara, while
    Tarumaro was instructed to guard the road to Kurafu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Afumi commanders encamped on the bank of the River Inugami; Prince Yamabe
    was killed by Hatayasu, Soga no Omi, and Hito, Kose no Omi, after which the army
    did not advance and Hatayasu killed himself.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yakuni, Hata no Kimi, came with his son Ushi and others to surrender with
    their people; he was granted the battle axe and halberd and appointed general.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: General Wofukehi encamped on Mount Narayama; after advice that the old capital
    was headquarters, Akamaro and Kobito were sent to guard it and made breastworks
    from bridge planks on the roads near the capital.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Wofukehi was defeated by Hatayasu, Ohono no Kimi, at Mount Narayama; Hatayasu
    pursued him, saw breastworks on the highways, suspected an ambush, and withdrew.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Tanabe no Wosumi crossed Mount Kafuka toward Kurafu with flags rolled up and
    drums dragged; at midnight, with gags in the soldiers' mouths, his troops broke
    through fortifications and entered the encampment.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: During the night attack, the watchword was Kane, and those who lacked the
    watchword were cut down; Tarumaro heard the watchword and escaped by saying it.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Wosumi later attacked the encampment on the plain of Tara unexpectedly, but
    Honji intercepted and pursued him with picked troops, and Wosumi alone escaped.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Woyori and his men fought Afumi troops at the River Yokugaha and killed General
    Kusuri, then attacked Hada no Tomotari at Mount Tokoyama and slew him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: After hearing that Wofukehi had been defeated, Abemaro and other eastern-province
    generals sent Usagi with more than one thousand cavalry in haste to the Yamato
    capital.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Woyori and his men later suffered a great defeat on the banks of the River
