- id: obs:3
  text: Soga no Mtimako no Sukune pulled down the house of Konoha and began building
    the Temple of Hokoji at a place called Asuka no Magami no Hara, also called Asuka
    no Tomada.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'Three officials were sent on separate routes to inspect frontiers: Kamafu
    to the Tésandó, Kari to the Tokaidó, and Abe no Omi to the Hokurikudó.'
  category: action
  evidence_refs:
