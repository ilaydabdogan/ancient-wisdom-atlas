canonical_text:
  quote: ''
  summary: Chronicle entries report Soga no Mtimako no Sukune consulting Pékché priests
    about Buddhist discipline, sending Zen-shin and other nuns to Corea for study
    through Pékché envoys, beginning construction of Hokoji after removing Konoha's
    house, inspection of eastern and northern frontiers by appointed officials, the
    return of the student nuns to a temple at Sakurawi, collection of timber for Buddhist
    temples, further renunciations by women and men who receive religious names, and
    the burial of Emperor Wosada in the Shinaga misasagi where his mother was buried.
  language: English
  quote_policy: summarized
