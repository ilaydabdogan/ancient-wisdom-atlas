canonical_text:
  quote: ''
  summary: Pékché summons Japanese and Imna-related officials to hear the Japanese
    Emperor's orders and consult about Imna. King Syéng-myéng reports that the Emperor
    commanded Imna to be speedily established, asks for advice, frames Imna's relation
    to Pékché in kinship terms, accuses Silla of bad faith, and proposes frontier
    fortifications, a troop request, and South Kara defenses.
  language: English
  quote_policy: summarized
