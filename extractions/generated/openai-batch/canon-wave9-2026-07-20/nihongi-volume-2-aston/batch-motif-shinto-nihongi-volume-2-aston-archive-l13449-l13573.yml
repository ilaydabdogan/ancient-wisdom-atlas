canonical_text:
  quote: ''
  summary: A court chronicle passage records tribute missions, palace-site compensation
    and boundary marking, construction and completion of Buddhist images, Buddhist
    clerical ceremonies with scripture reading and many lights before an imperial
    move to a newly named palace, rejection of Silla envoys wearing Tang garments,
    a counsel for naval intimidation, and administrative land and tax measures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Muraji was commended, granted the rank of Daisen, and given presents; the
    commuted taxes and corvées of Anato were remitted for three years.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Silla sent envoys to offer tribute; a cited alternate book says Koryé, Pékché,
    and Silla sent tribute-bearing envoys every year in this reign.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Presents were given in respect of tombs demolished and people removed for
    a palace site, and the chief builder was sent to set up palace boundary posts.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Construction began on an embroidery figure of Buddha sixteen feet high, with
    an attendant Bosatsu and beings of the eight classes, forty-six figures in all.
  category: action
  evidence_refs:
  - ev:3
  - ev:9
- id: obs:5
  text: Ohoguchi, Aya no Yamaguchi no Atahe, obeying an imperial order, carved one
    thousand images of Buddha.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Agata, Abumi, and Agura were sent to Aki province to build two Pékché ships.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The sixteen-foot embroidery figure and the other figures were finished; the
    Empress Dowager invited ten Buddhist professors and prepared a maigre entertainment
    for them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: More than 2100 priests and nuns were invited to Ajifu Palace and made to read
    the Issaikyo; that night more than 2700 lights were lit and sutras were read.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: After the night ceremony, the Emperor moved his residence from Oho-gohori
    to the new palace, which was named the Palace of Naniha no Nagara no Toyosaki.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Silla tribute-envoys, including Chi-man, anchored at Tsukushi wearing garments
    of the Tang country; the government reproved them and drove them back.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Kose no Oho-omi advised the Emperor that Silla could be struck without raising
    a sword by covering the sea route from Naniha to Tsukushi with ships and summoning
    Silla to account.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The distribution of rice-lands was brought to a close, and measures for rice-fields
    and tax-rice were specified.
  category: other
  evidence_refs:
  - ev:8
