canonical_text:
  quote: "“caused one hundred persons to enter religion”"
  summary: The passage records counsel against a ruler’s withdrawal from the world,
    the substitution of one hundred religious entrants and ritual objects, the return
    and armed escort of a Pekché prince, the establishment of several Miyake estates
    including estates connected with Coreans/Pekché people and Koryé men, the succession
    of Prince Yé-chhyang as King Wi-tok, and several Silla tribute embassies whose
    receptions depend on rank and precedence.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Advisers urge the ruler to repent former errors, not retire from the world,
    and, if he wishes to fulfil his vow, to make people of the land enter religion
    instead.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Y6-chhyang accepts the advice; ministers consult and cause one hundred persons
    to enter religion, also making banners, umbrellas, and meritorious things.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Prince Hyé of Pekché asks leave to return home and receives weapons, good
    horses, and liberal gifts for his followers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Abe no Omi, Saheki no Muraji, and Harima no Atahe are sent with a naval force
    to escort Prince Hyé, while the Lord of Hi in Tsukushi leads one thousand soldiers
    to escort him to Mite and guard strong positions on the route.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Soga no Oho-omi, Iname no Sukune, and others are sent to Kojima in Hither
    Kibi to establish a Miyake, and Midzuko is made Tadzukahi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Further Miyake are established in Yamato and Ki, including Miyake associated
    with Coreans/Pekché people and Koryé men; an alternate writing says these groups
    were made serfs of the Miyake.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Prince Yé-chhyang of Pekché succeeds to the throne and is styled King Wi-tok.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Silla sends the Namal Michi Kwichi with tribute; he receives unusually liberal
    entertainment, rejoices, and departs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A statement on tribute envoys says that the state is most important, ambassadors
    affect the lives of the people, and sons of good families should be chosen rather
    than persons of mean extraction.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Silla sends the Keup-pél-kan Ku-nyé-cheul with tribute; he is received with
    lower ceremony than usual, becomes enraged, and departs.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Té-sa Notyō presents former tribute at Oho-kuni in Naniha, and reception
