  quote: ''
  summary: The annalistic passage records the Empress's movements among palaces, repeated
    dispatches of envoys to pray to named deities, preparations for envoys to Silla,
    release of minor offenders, posthumous and living rank conferrals, court entertainments
    and archery, presentation of firewood to the Empress, and gifts of goods, rice,
    and land to named persons and groups.
  language: English
