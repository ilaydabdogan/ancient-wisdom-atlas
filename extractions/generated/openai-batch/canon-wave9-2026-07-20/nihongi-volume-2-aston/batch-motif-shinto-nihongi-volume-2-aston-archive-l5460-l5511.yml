  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Illa says that his father Arisateung and others had previously been sent beyond
    the sea on state service, and that he now presents himself at court after hearing
    the imperial summons.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Illa takes off his armour and delivers it to the Emperor.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: An official lodging is built for Illa at Kuha no ichi in Ato; he is made to
