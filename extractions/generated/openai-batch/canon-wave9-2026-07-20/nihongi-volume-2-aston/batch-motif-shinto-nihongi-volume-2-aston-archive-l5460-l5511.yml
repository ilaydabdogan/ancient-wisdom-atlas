canonical_text:
  quote: ''
  summary: A summoned official named Illa advises that the King of Pékché fears the
    Celestial Court and will only send him if imperial commands appear severe. Hashima
    demands Illa; the king sends him. Illa arrives with a delegation, is received
    by court officials, appears armed and mounted, performs kneeling obeisance before
    the Hall of Audience, invokes prior service by his father and others, presents
    himself to the Emperor, removes his armour and delivers it to the Emperor, then
    is housed and questioned about government.
  language: English
  quote_policy: summarized
