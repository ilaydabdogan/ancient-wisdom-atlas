  evidence_refs:
  - ev:1
- id: obs:2
  text: The same speech recommends that the imperial commands be delivered with a
    show of severity and a peremptory insistence on the summons.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hashima follows the plan, requires Illa from the King of Pékché, and the king,
    in awe of the Celestial Court, sends Illa to the Emperor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A party including ranked Pékché officials, steersmen, sailors, Illa, and Illa's
    companions arrives at the Miyake of Kojima in Kibi.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Court sends Ohotomo no Nukadeko no Muraji to express sympathy for the
    travelers' fatigues, and later sends high officials to Naniha to wait upon Illa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Illa, clad in armour and riding on horseback, comes up to the gate before
