canonical_text:
  quote: ''
  summary: Chronicle entries for A.D. 693 and the beginning of the seventh year record
    court presentations of sacred treasures, rice stalks, and a white moth; an imperial
    decree increasing the fief of the God of Kebi; travel by the Empress to Yoshino;
    Silla tribute and envoys; delivery of Silla tribute to five shrines; rank grants,
    clothing regulations, gifts to the aged and poor, funeral support, burial of bodies
    disturbed during capital construction, a solar eclipse, and grants related to
    Chinese learning.
  language: English
  quote_policy: summarized
