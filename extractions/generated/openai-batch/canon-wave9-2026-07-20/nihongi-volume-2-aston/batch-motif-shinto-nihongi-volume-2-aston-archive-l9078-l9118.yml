canonical_text:
  quote: ''
  summary: The Oho-omi sends troops against Sakahibe no Omi. Sakahibe waits outside
    his gate with his second son Aya, and both father and son die together. Sakahibe's
    eldest son Ketsu flees, hides in a nunnery, is informed on by a jealous nun, escapes
    to Mount Unebi, and kills himself there when escape is impossible. A song says
    Ketsu seems to have hidden on Mount Unebi. The Oho-omi and Ministers later offer
    the Imperial Seal to Imperial Prince Tamura, who declines, citing the weight of
    the ancestral shrines and his lack of wisdom.
  language: English
  quote_policy: summarized
