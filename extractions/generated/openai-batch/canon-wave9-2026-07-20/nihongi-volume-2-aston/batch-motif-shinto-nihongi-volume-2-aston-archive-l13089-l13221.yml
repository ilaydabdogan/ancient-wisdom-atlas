canonical_text:
  quote: ''
  summary: The passage recounts the suicide by strangulation of the Oho-omi Soga/Yamada
    with his children, subsequent arrests, executions, decapitation, and banishments;
    the Prince Imperial later discovers evidence of the Oho-omi’s loyalty and grieves.
    Soga no Miyakko hime, consort of the Prince Imperial and daughter of the Oho-omi,
    grieves over her father’s decapitation, avoids the name of Shiho, dies of heartbreak,
    and is mourned through poems using paired mandarin-ducks, flowers, trees, and
    a mountain-stream as imagery.
  language: English
