canonical_text:
  quote: ''
  summary: The passage records missions by ship to Great Thang; the Emperor's visit
    to the ill priest Bin and condolences after his death; tribute from Pékché and
    Silla; the making of Buddha and Bosatsu figures; a shipwreck in which ambassadors
    drowned and five men survived by plank and bamboo raft; a dispute over moving
    the imperial residence to Yamato; the Prince Imperial's relocation with royal
    family members and officials; the Emperor's resentful song to Empress Hashibito;
    and the night migration of rats toward the Yamato capital.
  language: English
  quote_policy: summarized
