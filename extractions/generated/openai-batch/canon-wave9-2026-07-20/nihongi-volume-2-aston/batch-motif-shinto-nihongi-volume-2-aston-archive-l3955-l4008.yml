canonical_text:
  quote: ''
  summary: The passage recounts a battlefield episode in which a Pékché combatant
    defeats and beheads a Koryé warrior, displays the head on a spear, and prompts
    contrasting reactions from the armies. Auxiliary generals then beat drums and
    drive the King of Koryé to Mount Tong-syong. The chronicle next records the elevation
    of Nunakura Futo-dama-shiki no Mikoto to Prince Imperial, followed by Pékché communications
    to Japanese officials in Tsukushi requesting confirmation and timing of imperial
    troops and their numbers for cantonment preparation.
  language: English
  quote_policy: summarized
