  summary: 'The passage records events in A.D. 645: an oath-imprecation against disloyalty,
    the alteration of the era style to Daikwa, court appointments of an empress and
    consorts, tribute envoys from Koryo, Pékché, Silla, and Imna, imperial diplomatic
    mandates, an order concerning the family of Wi-sa, commands about government and
    fidelity, and advice that the Gods of Heaven and Earth should be worshipped before
    affairs of government are considered.'
