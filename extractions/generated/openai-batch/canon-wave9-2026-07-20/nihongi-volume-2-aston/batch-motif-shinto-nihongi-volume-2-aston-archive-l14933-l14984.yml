canonical_text:
  quote: ''
  summary: A chronicle passage reports that people throughout the country carried
    arms without reason, which elders interpreted as perhaps denoting the destruction
    of Pékché. It also records the departure of a Koryé envoy, the return plans of
    a man of Tukhara who leaves his wife behind as a token, and cited accounts of
    Pékché's invasion, destruction, submission, and alleged ruin through internal
    misrule and foreign appeal.
  language: English
  quote_policy: summarized
