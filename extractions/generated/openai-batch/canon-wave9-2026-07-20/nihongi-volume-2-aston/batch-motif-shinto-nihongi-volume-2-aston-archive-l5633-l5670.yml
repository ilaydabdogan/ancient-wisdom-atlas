canonical_text:
  quote: He erected a Buddhist Temple on the east side of his dwelling, in which he
    enshrined the stone image of Miroku.
  summary: The passage describes the search for Buddhist practitioners, the appointment
    of Hyé-phyon as teacher, the reception of three girls into Buddhist religious
    life as nuns with new names, their support by patrons, the erection of a Buddhist
    temple, the enshrinement of a stone image of Miroku, and a religious meeting involving
    maigre fare. Translator notes identify Miroku with Maitréya and discuss the meaning
    of the character rendered as maigre fare, prayer, worship, or religious abstinence.
  language: English
