canonical_text:
  quote: ''
  summary: The passage records the establishment of twelve cap-ranks with virtue-based
    names and distinctive caps, the granting of these ranks to ministers, and the
    Prince Imperial's preparation of seventeen clauses described by the translator
    as moral maxims. The surviving clauses exhort harmony, reverence for the Buddhist
    Three Treasures, obedience to imperial commands, decorous conduct, impartial judgment
    without greed, and correction of evil while encouraging good.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A twelve-grade rank list is presented, using paired greater and lesser labels
    for virtues including virtue, benevolence, propriety, faith, justice, and knowledge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rank caps are described as made of sarcenet in special colors, gathered
    on the crown like a bag, with a border attached; hairflowers are worn only on
    the first day of the year.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cap-ranks are granted for the first time to various ministers, with distinctions
    for each.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Prince Imperial personally prepares laws consisting of seventeen clauses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A translator's note characterizes the laws as moral maxims rather than ordinary
    statutes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The first clause values harmony and avoidance of wanton opposition, linking
    concord in public business with the acceptance of right views.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The second clause instructs sincere reverence for the Three Treasures, identified
    as Buddha, the Law, and the Priesthood.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The third clause commands scrupulous obedience to imperial commands and compares
    the lord to Heaven and the vassal to Earth.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The fourth clause says ministers and functionaries should make decorous behavior
    their leading principle, so that rank distinctions and government remain orderly.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The fifth clause tells officials to cease gluttony and covetous desires and
    to judge legal suits impartially, warning against bribery and unequal treatment
    of rich and poor litigants.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The sixth clause directs officials to chastise evil and encourage good, and
