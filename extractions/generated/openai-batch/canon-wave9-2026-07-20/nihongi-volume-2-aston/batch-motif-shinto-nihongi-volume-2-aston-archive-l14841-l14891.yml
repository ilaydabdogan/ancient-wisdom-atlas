canonical_text:
  quote: ''
  summary: A group of Yemishi at a shore and river camp ask to cross over and serve
    the Government because a Su-shén fleet threatens them. Abe no Omi questions them,
    learns the enemy location and ship number, attempts to summon the Su-shén, then
    displays goods on the beach. The Su-shén fleet approaches with feather flags;
    two old men inspect and briefly handle cloth and garments before returning them.
    Peace efforts fail, fighting occurs at palisades, Mamukatsu is slain, and the
    defeated enemy kills their own wives and children. A later notice records the
    arrival of a Koryŏ envoy at Naniha. A footnote compares the episode to an account
    of “unseen trade.”
  language: English
  quote_policy: summarized
