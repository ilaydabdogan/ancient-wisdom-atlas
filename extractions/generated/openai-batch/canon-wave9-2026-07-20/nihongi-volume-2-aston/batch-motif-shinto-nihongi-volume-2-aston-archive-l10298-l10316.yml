  summary: A reported statement praises an Imperial Prince as worthy to rule the Empire,
    and the toneri reports it to him. Nakatomi no Kamako no Muraji is described as
    upright, loyal, and reform-minded. He is indignant at Soga no Iruka for disrupting
    proper political hierarchy and harboring designs against the State. Kamako seeks
    among imperial princes for a wise ruler and fixes his attention on Naka no Ohoye,
    though he has not yet been able to reveal his intentions to him.
