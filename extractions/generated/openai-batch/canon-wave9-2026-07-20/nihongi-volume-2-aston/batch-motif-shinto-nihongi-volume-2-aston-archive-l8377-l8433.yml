canonical_text:
  quote: ''
  summary: The passage records Buddhist objects being placed or deposited in temples;
    Tang-trained priests, physicians, and students arriving and advising the Empress
    to recall students and maintain communication with Great Thang; Silla’s invasion
    of Imna and the Empress’s consultation over whether to attack; and a translator’s
    note comparing baptismal flags with a water-side offering practice for souls of
    the dead.
  language: English
  quote_policy: summarized
