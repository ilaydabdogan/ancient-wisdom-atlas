  summary: The passage recounts Abe no Omi's northern expedition with ships, his gathering
    and gift-feasting of Yemishi groups, an offering of a boat and colored silk to
    the gods of the land, advice from two Yemishi about the seat of government, administrative
    appointments and rank grants, a variant notice about fighting the Su-shén and
    presenting captives, and a later mission to Thang that included a Yemishi man
    and woman and a sea itinerary.
