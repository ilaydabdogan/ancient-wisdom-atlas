    fallen from heaven and gives them to Oho, after which he becomes wealthy. The
    passage then records guards, beacon-fires, a water embankment, the death of Empress
    Dowager Hashibito, religious entry in her name, grants and residences for Pekché
    people, and castle-building assignments.'
