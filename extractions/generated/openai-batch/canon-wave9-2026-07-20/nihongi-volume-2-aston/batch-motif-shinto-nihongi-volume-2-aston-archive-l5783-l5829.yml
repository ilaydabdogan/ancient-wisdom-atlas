canonical_text:
  quote: "“Is this a punishment for the burning of the Image of Buddha?”"
  summary: The Emperor, the Ohomuraji, and many people are afflicted with sores. Some
    people wonder whether the deaths are punishment for burning a Buddha image. Mimako
    no Sukune seeks help through the Three Precious Things; the Emperor permits him
    alone to practice Buddhism, returns three nuns to him, and Mimako rebuilds a temple
    for them. Another report says several nobles conspired to destroy Buddhism by
    burning a temple and pagoda and discarding images, while Mumako opposed them.
    The Emperor later dies; Mumako gives a funeral oration with his sword girded on,
    and Moriya laughs.
  language: English
  quote_policy: quoted
