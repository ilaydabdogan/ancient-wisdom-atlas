  quote: As soon as he had done speaking, the thunder and rain stopped.
  summary: 'The passage narrates military movements during conflict: Imperial Prince
    Takechi advises and aids the Emperor, captures couriers, pledges command while
    invoking divine help, the Emperor''s prayer stops a storm, and Wofukehi uses impersonation
    and a false announcement to redirect troops before being appointed general.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A messenger from Imperial Prince Takechi advises the Emperor that government
    is inconvenient at a distance and that a nearer place should be occupied; the
    Emperor proceeds to Fuha, and Sabichi joins him with 20,000 men.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Imperial Prince Takechi reports that he laid an ambush and captured couriers
    from the Court of Afumi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The captured couriers say they belonged to Ihasuki's suite and that Ihasuki
    had been sent to mobilize the army of the East Country, but had fled back when
    troops appeared.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Emperor says that the Court of Afumi has high ministers and shrewd counselors,
    while he has no one to advise with except young children.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Imperial Prince Takechi bares his arms, grasps his sword, and says he will
    lead the generals and chastise the opposition while relying on the spiritual help
    of the Gods of Heaven and Earth and on imperial orders.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Emperor commends Takechi, takes him by the hand, strokes his back, presents
    him with a saddle-horse, and entrusts him with the conduct of military matters.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the temporary palace at Nogami, a violent storm of thunder, lightning,
    and rain occurs; the Emperor prays to the Gods of Heaven and Earth to stop the
    thunder and rain, and they stop after he speaks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wofukehi secretly plans to pretend to be Imperial Prince Takechi, and Kuma
    rides into the camp announcing that Takechi has arrived with a large armed force.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the soldiers hear Kuma's announcement, they disperse and run away; Wofukehi
    arrives with mounted troops, fraternizes with Kumage and the Atahe, and the soldiers
    follow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Momotari is summoned, comes to the tsuki tree west of Asukadera, is dragged
    from his horse, shot with an arrow, struck with a sword, and dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After a report is sent to the Emperor, he rejoices, appoints Wofukehi general,
    and a plan is made to invade Afumi; selected troops first march toward Nara.
  category: sequence
  evidence_refs:
  - ev:7
