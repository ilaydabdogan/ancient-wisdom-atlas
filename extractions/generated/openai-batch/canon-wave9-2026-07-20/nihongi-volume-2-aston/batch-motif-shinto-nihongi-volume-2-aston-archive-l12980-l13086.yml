canonical_text:
  quote: ''
  summary: 'The passage reports events in A.D. 649: an order to establish eight state
    departments and many bureaus; formal mourning by the Emperor and court for Abe
    no Oho-omi; a slanderous treason accusation against Kurayamada no Maro; imperial
    investigation and preparations to surround his house; Maro''s flight with sons
    toward Yamato; his meeting with his eldest son Koshi near a great Tsuki tree and
    at the Yamada Temple; Koshi''s wish to resist and later plan to burn the palace;
    Maro''s speech denying treason and affirming vassal and filial obligations; and
    Maro''s vow in the Buddha Hall not to resent his sovereign in future births before
    strangling himself.'
  language: English
  quote_policy: summarized
