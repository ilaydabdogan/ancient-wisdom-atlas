canonical_text:
  quote: ''
  summary: 'The passage lists accusations against provincial and local officials:
    taking or exchanging horses, mishandling articles supplied in place of weapons
    or hay, losing swords, judging plaints contrary to an edict, neglecting investigations,
    and sending presents to governors. The sovereign speaker attributes the disorder
    to neglect and incompetence, states that lords and ministers should model upright
    conduct, and announces that local governors will be punished according to the
    gravity of their offenses.'
  language: English
  quote_policy: summarized
