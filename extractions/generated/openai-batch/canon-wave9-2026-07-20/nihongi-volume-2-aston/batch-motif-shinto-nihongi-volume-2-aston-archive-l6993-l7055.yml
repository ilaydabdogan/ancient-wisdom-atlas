  quote: I have an image of the venerable Buddha. Which of you will receive this image
    and worship it reverently?
  summary: The passage records an unnamed prince's burial on Mount Hanifu, the appointment
    and departure of Imperial Prince Tahema for a punitive expedition against Silla,
    the death and hilltop burial of Princess Toneri and Tahema's return, a move to
    the Palace of Woharida, the transfer of a Buddha image to Kahakatsu and foundation
    of a temple for it, the making of shields, quivers, and banners, and the first
    institution of cap-ranks.
