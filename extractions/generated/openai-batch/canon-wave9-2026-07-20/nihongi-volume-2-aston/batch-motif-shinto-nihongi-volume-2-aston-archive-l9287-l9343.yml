canonical_text:
  quote: ''
  summary: Chronicle entries report celestial and natural phenomena, tribute and court
    entertainment for Pékché guests, an auspicious lotus with two flowers on one stalk,
    trials and punishments involving the Uneme, Wosazaki's suicide, floods, palace
    fire and relocation, proposed regulation of court attendance by bell, drought
    and famine, and a thunder-like moving star explained by Priest Bin as the Celestial
    Dog.
  language: English
  quote_policy: summarized
