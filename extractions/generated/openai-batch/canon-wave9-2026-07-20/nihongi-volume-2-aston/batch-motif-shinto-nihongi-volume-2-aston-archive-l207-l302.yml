canonical_text:
  quote: ''
  summary: Wohodo is warned by Arako, delays, then sets out and later favors him.
    At Kusuba, Ohotomo no Kanamura presents the Mirror, Sword, and Imperial Signet.
    Wohodo repeatedly declines the throne, but officials persist, invoke the ancestral
    and Earth-and-Grain temples, and he accepts the Signet and assumes imperial dignity.
    Officials are confirmed in office. Ohotomo petitions for an empress and heir,
    citing former sovereigns and Emperor Shiraga's precedent. Tashiraka is to be brought
    ceremonially, sacrifices are to be offered to the Gods of Heaven and Earth for
    an imperial scion, and she is made Empress.
  language: English
  quote_policy: summarized
