canonical_text:
  quote: ''
  summary: The passage introduces Emperor Ame-kuni Oshi-hiraki Hiro-niha, recounts
    a youthful dream directing him to favor Hada no Ohotsuchi, and explains Hada's
    rescue and cleansing of two blood-stained wolves addressed as deities. Hada is
    rewarded with imperial favor and office. After the death of Emperor Takewo hiro-kuni
    oshi-tate, the Imperial Prince asks the ministers to consult Empress Yamada, who
    humbly declines responsibility for government and urges his accession.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ame-kuni Oshi-hiraki Hiro-niha is introduced as the rightful heir of Emperor
    Wohodo; his mother is named as Empress Tashiraka, and he is said to have been
    loved and kept constantly at the Emperor's side.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the Emperor was young, a man appeared to him in a dream and said that
    if he made a favorite of Hada no Ohotsuchi, he would possess the Empire on reaching
    manhood.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Messengers searched widely and found a man in Yamashiro, in Kii district and
    Fukakusa township, whose name and surname matched the dream statement.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hada no Ohotsuchi reported that, while returning from trade at Ise, he encountered
    two wolves fighting on a mountain, defiled with blood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Hada dismounted, rinsed his mouth and hands, prayed to the wolves as august
    deities, and warned that a hunter would quickly take them if he met them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hada restrained the two wolves from fighting, wiped and cleansed their blood-stained
    hair, released them, and saved both lives.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Emperor said Hada's situation was undoubtedly his reward, kept him near
    his person, renewed his favor daily, Hada became very wealthy, and after accession
    the Emperor appointed him to the Treasury.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After Emperor Takewo hiro-kuni oshi-tate died, the Imperial Prince told the
    ministers that he was young, shallow in knowledge, and inexperienced in government,
    and asked them to consult Empress Yamada before deciding.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Empress Yamada replied humbly that government was too difficult for a woman,
    praised the Imperial Prince's virtues, and asked the ministers to cause him to
    ascend to the Dignity and preside over the Empire.
  category: speech
  evidence_refs:
  - ev:7
