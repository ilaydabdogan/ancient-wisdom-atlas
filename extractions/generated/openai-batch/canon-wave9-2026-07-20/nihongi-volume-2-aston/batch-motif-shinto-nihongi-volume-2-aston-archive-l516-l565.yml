canonical_text:
  quote: ''
  summary: The passage records a diplomatic dispute over granting Government House
    land to Pékché, the envoys’ appeal to a prior imperial decree, their departure,
    and a rumor of bribery. It then records a Pékché tribute mission bringing a scholar
    of the five classics and petitioning for the restoration of I-mun, the death of
    Syun-ta, and the direct betrothal of Imperial Prince Magari no Ohine to Imperial
    Princess Kasuga.
  language: English
  quote_policy: summarized
