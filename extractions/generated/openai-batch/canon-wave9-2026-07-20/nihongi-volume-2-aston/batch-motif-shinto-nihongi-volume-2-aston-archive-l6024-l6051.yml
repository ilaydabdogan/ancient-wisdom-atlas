canonical_text:
  quote: It is Our desire to give our adherence to the three precious things.
  summary: Sakahe, Miwa no Kimi, is described as a favorite of the Emperor and as
    charged with internal and external matters. The Empress-consort Kashikiya hime
    and Mumako no Sukune consequently conceive enmity against Imperial Prince Anahobe.
    In the second year, fourth month, second day, the Emperor performs the new-rice
    tasting ceremony on the river-bank of Ihare, becomes ill, and returns to the Palace.
    With ministers attending, he states his desire to adhere to the three precious
    things and asks them to deliberate. The ministers consult in Court; the supplied
    passage ends while naming Mononobe no Moriya and Nakatomi no Katsumi as opponents.
  language: English
  quote_policy: quoted
