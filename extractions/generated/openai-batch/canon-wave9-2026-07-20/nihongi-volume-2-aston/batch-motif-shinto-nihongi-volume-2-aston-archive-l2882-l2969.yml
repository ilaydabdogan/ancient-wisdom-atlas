canonical_text:
  quote: ''
  summary: A diplomatic passage recounts disputes among Pékché, Imna, Ara, Japanese
    authorities, and the Emperor over summonses, envoys, responsibility for delays,
    alleged obstruction by named men, and the proposed establishment of Imna. Pékché
    petitions that obstructing figures be removed; the Emperor replies that certain
    Japanese officials went to Silla to secure permission for ploughing and sowing,
    and says the disputed men will withdraw if Imna is established.
