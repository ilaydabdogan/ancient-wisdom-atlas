canonical_text:
  quote: ''
  summary: The chronicle records drought and prayers for rain, an earthquake, an imperial
    rebuke and pardon of the Yamato no Aya no Atahe, worship of named deities, a Buddhist
    feast and ordered renunciations, the return of weather-driven foreigners, tribute
    from Tamna, a decree on vagabonds, rain preventing a calendrical ceremony, and
    the presentation of a red crow to the Emperor with a note identifying it as a
    favorable solar omen.
  language: English
  quote_policy: summarized
