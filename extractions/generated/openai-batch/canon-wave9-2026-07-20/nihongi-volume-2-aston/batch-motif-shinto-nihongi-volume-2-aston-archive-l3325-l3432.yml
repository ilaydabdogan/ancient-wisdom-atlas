canonical_text:
  quote: ''
  summary: A fragmentary prayer states that an image has been made for blessings and
    moral enfranchisement. Hasuhi returns from Pékché and reports that one of his
    children disappeared at night near the seashore; after snow, tiger footprints
    are found, and Hasuhi arms himself, follows the traces to a cliff, addresses a
    dread deity, kills a tiger that attacks him, and returns with its skin. The passage
    also records disturbances, factional violence, and succession events in Koryé/Koma,
    diplomatic exchanges with Pékché, and a report about an unusually excellent horse
    owned by Miya, Kahara Tami no Atahe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prayer asks for blessings upon the Emperor's Miyake land and for the moral
    enfranchisement of all living creatures under Heaven, and says an image has been
    made.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hasuhi, Kashihade no Omi, returned from Pékché and reported that he had travelled
    on his mission with all his family.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Hasuhi's party reached the seashore of Pékché and lodged for the night,
    one of his children suddenly disappeared.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A great fall of snow prevented a search until morning, when tiger footprints
    were found in a line.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hasuhi put on armour, girded on a sword, followed the traces, and came to
    a cliff.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the cliff Hasuhi spoke of his mission hardships, his love for his child,
    the parental love of the dread deity he addressed, and his intention to take revenge
    without fearing death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A tiger advanced with its mouth open to devour Hasuhi; Hasuhi seized the tiger's
    tongue with his left hand, stabbed it with his right hand, stripped off its skin,
    and returned with it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Koryé was reported as greatly troubled by civil disturbances, with executions
    and fighting between the Syé and Chhu factions at the King's Court.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Envoys from Pékché departed after receiving seventy-four good horses and ten
    ships, and Pékché later sent envoys to present tribute.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A report from Imaki says Miya bought and kept a good horse; it neighed at
    a shadow, sprang over its mother, grew up with action compared to a startled wild
    goose or soaring dragon, obeyed control, and leaped an eighteen-rod ravine at
    the Hill of Ohochi.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Koryé was again reported as disturbed, with more than two thousand battle
