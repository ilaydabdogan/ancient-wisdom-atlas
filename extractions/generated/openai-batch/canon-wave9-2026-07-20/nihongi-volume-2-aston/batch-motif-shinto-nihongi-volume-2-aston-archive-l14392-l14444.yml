canonical_text:
  quote: A leg-rest' broke of itself.
  summary: A self-breaking leg-rest is recognized as a bad omen. Akaye sends Shibi
    and palace labourers to surround Imperial Prince Arima, who is arrested with associates
    and sent to the hot springs of Ki. The Prince Imperial questions Arima about treason;
    Arima denies understanding and says Heaven and Akaye know. Arima is strangled
    at the Fujishiro acclivity, two others are executed there, and two associates
    are banished. A note explains the term kyosoku/oshimadzuki for the leg-rest-like
    object.
  language: English
  quote_policy: quoted
