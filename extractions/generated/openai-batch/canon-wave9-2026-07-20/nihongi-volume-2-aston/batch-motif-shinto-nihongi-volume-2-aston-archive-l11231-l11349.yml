canonical_text:
  quote: ''
  summary: The passage records imperial regulations for complaints, inheritance/status
    rules for children of free and enslaved persons, an imperial address to Buddhist
    priests and nuns recounting the transmission and patronage of Buddhism in Yamato,
    appointments of Buddhist professors and temple officials, a temple survey, appointments
    as Heads of the Law, and a mission to regulate weapons in the provinces.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Emperor orders a complaint procedure in which a Tomo no Miyakko or family
    elder first investigates, and unresolved matters may be submitted in a document
    to a box and reported to the Inner Palace.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A bell is hung and a box is provided in the Court for complainants when decisions
    are neglected or malpractices occur.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Emperor states rules assigning children to father or mother according
    to the free or enslaved status of the parents, with a special rule for temple
    serfs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A messenger is sent to the Great Temple to summon Buddhist priests and nuns
    and address them on the Emperor's behalf.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The address says King Myong of Pékché transmitted the Law of Buddha to Yamato,
    that the Ministers opposed it, and that Soga no Iname believed in it and was instructed
    to receive it reverently.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The address recounts that Soga no Mtmako no Sukune prized Buddhist doctrine,
    and later made an embroidered Buddha figure and a copper Buddha image, each sixteen
    feet high.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Emperor announces a desire to exalt and promulgate the pure doctrine and
    appoints professors to instruct priests in the teachings of Shaka.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Emperor promises assistance for repairing temples and orders temple commissioners
    and chief priests to inspect temples and report on priests, nuns, slaves, and
    cultivated lands.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kume no Omi, Miwa no Shikobu no Kimi, and Ohi, Nukadabe no Muraji are appointed
    Hoto, glossed as Heads of the Law.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Officials are sent to all provinces to regulate weapons.
  category: action
  evidence_refs:
  - ev:8
