canonical_text:
  quote: "“The Great Sovereign / Who rules us tranquilly”"
  summary: The passage describes an official daybreak assembly and procession at the
    pond of Fujihara with ranked clothing and hair ornaments; tribute sent by Silla
    and Imna; and a sake banquet at which the Oho-omi proposes the Empress’s health
    and sings a song praising the Great Sovereign’s tranquil rule and wishing service
    to her for countless ages. Translator notes explain rank-marking hair ornaments
    and the song’s comparison of the Empress’s appearance to the sun emerging from
    clouds.
  language: English
