canonical_text:
  quote: ''
  summary: 'The passage recounts a Pekché recovery effort after defeat: Silla is beaten,
    Pok-sin gathers countrymen and holds the royal city, and Pekché envoys bring Thang
    prisoners to the Empress while requesting troops, assistance, and the return of
    Prince Yō Phung-chyang to become ruler. The petition describes Thang and allied
    enemies wasting Pekché territory, overturning its government, and capturing King
    Wicha, his family, and ministers, who were sent to Thang. The people of Pekché
    are said to have assembled again and formed a kingdom.'
  language: English
  quote_policy: summarized
