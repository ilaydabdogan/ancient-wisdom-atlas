canonical_text:
  quote: ''
  summary: The passage reports Pékché embassies to the Japanese emperor requesting
    auxiliaries and arranging exchanges of persons, including learned specialists.
    Uchi no Omi proceeds to Pékché with a naval force. A memorial from Pékché describes
    Silla's alliance with Koryo/Koma, requests further troops for Pékché and Imna,
    and reports the siege and capture of Ham-san castle by forces using fire-arrows
    under the protection of the August spirits of the Emperors. Pékché presents goods
    and captives. At the end, an old man warns Yo-chhyang that Heaven does not yet
    grant his campaign against Silla and that disaster is to be feared.
  language: English
  quote_policy: summarized
