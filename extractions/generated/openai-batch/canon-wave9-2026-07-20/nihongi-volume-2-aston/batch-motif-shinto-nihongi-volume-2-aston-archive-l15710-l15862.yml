canonical_text:
  quote: ''
  summary: The passage reports court rank reforms under Emperor Tenchi, including
    revised cap grades and grants of weapons according to family status; a Pékché
    prince and his people receive residence at Naniha; a falling star and earthquake
    are noted; diplomatic contact occurs through Kuo Wu-ts‘ung with letters, gifts,
    entertainment, and dismissal; several deaths are recorded, including Ké-kim of
    Koryé, who gives his children a final injunction to live harmoniously and avoid
    rivalry over rank.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Emperor ordered the Prince Imperial, his younger brother, to announce
    revisions to caps denoting official rank, grade designations, and matters concerning
    senior family members, vassals, and domestic retainers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rank system is described as containing twenty-six grades of caps, with
    changes including the replacement of the former flower designation by brocade,
    the addition of six grades, and the division of an initial rank into Daiken and
    Shoken.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Long swords were granted to senior members of great families, short swords
    to senior members of lesser families, and shields with bows and arrows to senior
    members of the Tomo no Miyakko and similar groups.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Prince Syén-kwang of Pékché and his people were assigned a residence at Naniha.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A star is reported to have fallen north of the capital, and an earthquake
    is reported in the same spring.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Liu Jén-yüan, the Chinese general for Pékché, sent Kuo Wu-ts‘ung to present
    a letter-box and gifts.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The deaths of Soga no Muraji, the Oho-omi of Tai-shi rank, and the Empress
    Dowager Shima are recorded.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Kuo Wu-ts‘ung and his companions were dismissed home, and the Emperor ordered
    Nakatomi no Naijin to send the Buddhist priest Chi-sho with presents for Kuo Wu-ts‘ung.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: An entertainment was given to Kuo Wu-ts‘ung and his suite, and later Kuo Wu-ts‘ung
    and his suite departed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Ké-kim, Prime Minister of Koryé, died and left final instructions to his children
    to live harmoniously like fish and water and not compete for rank.
  category: speech
  evidence_refs:
  - ev:10
