canonical_text:
  quote: ''
  summary: The passage reports military and diplomatic measures connected with Pékché,
    including Japanese generals, arms, grain, and escorts sent in support; the Prince
    Imperial’s honors, marriage arrangement, and escort for the Pékché prince Phung-chhyang;
    Pok-sin’s submission of the government to Phung-chhyang; a report from Koryé about
    severe cold, a frozen river, siege engines, forts, and exhausted armies; a priest’s
    comment on Chhyun-chhyu’s intentions; the presentation of a precious sword found
    in a hole in a millet-field; and the beginning of an account in which a fire lit
    by generals changes ashes into a hole.
  language: English
  quote_policy: summarized
