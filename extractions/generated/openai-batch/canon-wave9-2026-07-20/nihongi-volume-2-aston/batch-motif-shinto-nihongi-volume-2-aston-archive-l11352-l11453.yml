canonical_text:
  quote: ''
  summary: The passage reports a rebellion plot by Imperial Prince Furubito, also
    associated with Yoshino, and named accomplices; Shidaru’s surrender and confession;
    Naka no Ohoye’s armed suppression of Furubito and his companions, with variant
    execution accounts; an imperial edict registering the people and curbing private
    vassalage and land appropriation; public rejoicing; removal of the capital to
    Naniha, retrospectively interpreted through rat movements as an omen; and a report
    from Koshi of driftwood leaving a ploughed-field-like impression in the sand.
  language: English
  quote_policy: summarized
