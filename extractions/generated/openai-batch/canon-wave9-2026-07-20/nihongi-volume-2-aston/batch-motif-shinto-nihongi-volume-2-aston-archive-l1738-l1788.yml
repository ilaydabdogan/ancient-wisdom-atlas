  quote: ''
  summary: The passage reports an imperial reprimand of Ajihari for begrudging Crown
    lands and slighting a messenger, his removal from local office, acts of submission
    and compensation through service, labour, and land, an origin notice for serf
    attachment to a Miyake, and a separate incident in which Hatahime steals a necklace
    and is given into service after discovery. Translator notes compare the political
    use of ceremony and music and the imperial-theory language with Chinese writings.
