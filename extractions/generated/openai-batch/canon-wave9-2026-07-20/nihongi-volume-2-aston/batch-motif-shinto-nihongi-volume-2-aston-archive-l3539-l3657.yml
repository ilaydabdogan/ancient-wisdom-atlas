  text: King Syéng-myéng of Pékché said that Imna would be defended according to imperial
    instructions and that he would obey imperial orders concerning Yanasa and Mato.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Pékché sent slaves or captives as presents: six Koryé slaves for the Emperor,
