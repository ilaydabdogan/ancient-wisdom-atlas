- id: obs:1
  text: An imperial envoy was sent to Pékché with instructions responding to a memorial
    and recommending that the Nasol Ma-mu be appointed chief envoy to the Japanese
    court.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Emperor sent thirty sets of arrows to Pékché for defense against northern
    enemies.
  category: action
  evidence_refs:
