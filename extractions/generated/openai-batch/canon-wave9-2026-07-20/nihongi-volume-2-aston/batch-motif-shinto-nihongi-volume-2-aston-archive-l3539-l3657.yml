canonical_text:
  quote: ''
  summary: The passage records imperial messages and gifts exchanged between the Japanese
    court and Pékché, including instructions about Ma-mu as envoy, arrows for defense,
    captives and grain as presents, warfare involving Pékché, Koryé, Silla, and Imna,
    a request from Pékché, Kara, and Ara for auxiliary troops, an imperial assurance
    invoking High Heaven and ancestral imperial spirits, the death of an imperial
    prince, and the presentation to the Emperor of a Buddhist image, ritual items,
    and sutras.
  language: English
  quote_policy: summarized
