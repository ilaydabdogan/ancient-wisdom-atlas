canonical_text:
  quote: "“From this arose the beginning of Buddhism.”"
  summary: The passage recounts a Buddhist relic that cannot be crushed by iron and
    that floats or sinks in water as desired. Several named figures adopt Buddhist
    practice; Soga no Oho-omi/Mimako no Sukune builds a temple, erects a pagoda, and
    deposits the relic on its pillar. Later, Soga’s illness is interpreted by a diviner
    as a curse connected with the Buddha worshipped in his father’s time; the Emperor
    authorizes worship of the father’s gods, Soga worships a stone image, and a deadly
    pestilence prompts court criticism.
  language: English
  quote_policy: quoted
