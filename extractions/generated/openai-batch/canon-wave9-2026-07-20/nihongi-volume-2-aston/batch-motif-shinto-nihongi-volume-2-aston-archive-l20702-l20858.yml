- id: motif:1
  label: Abnormal animals as portents
  taxonomy_refs: []
  basis: The passage reports a four-legged fowl and a twelve-horned calf, and a note
    says such monstrosities denoted a fault in sovereign and ministerial conduct.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The annal itself only reports the animals; the explicit omen interpretation
    is supplied in a note attributed to Shikai.
- id: motif:2
  label: State-mandated household Buddhist devotion
  taxonomy_refs: []
  basis: All provinces are ordered to install household Buddhist shrines with images
    and scriptures and to perform worship and food offerings there.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This is a religious-policy entry rather than a narrative myth episode.
- id: motif:3
  label: Royal religious offerings and almsgiving
  taxonomy_refs:
  - sacred_exchange
  basis: The Emperor supports Buddhist worship through domestic offerings, temple
    gifts to Buddha, and rice alms to priests.
  evidence_refs:
  - ev:7
  - ev:11
  - ev:16
  confidence: medium
  cautions: The passage records offerings and alms but does not state reciprocal divine
    reward, so the sacred-exchange taxonomy is approximate.
- id: motif:4
  label: Environmental anomaly and desiccation
  taxonomy_refs: []
  basis: The passage records ash rain followed by withered herbs and trees, and a
    separate drying-up of hot springs.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The text does not explicitly interpret these events as omens; the ash
