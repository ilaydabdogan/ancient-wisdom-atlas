canonical_text:
  quote: there were manifested portents of trees and serpents
  summary: A speech attributed to King Syong-myong warns the Japanese authorities
    of Imna about Silla, invokes portents and calamities as warnings or instruction,
    urges obedience to the Emperor's command to restore Imna, and calls for action
    before Silla annexes it. The annalistic continuation records Pekche envoys reporting
    on Imna and later departing.
  language: English
  quote_policy: quoted
