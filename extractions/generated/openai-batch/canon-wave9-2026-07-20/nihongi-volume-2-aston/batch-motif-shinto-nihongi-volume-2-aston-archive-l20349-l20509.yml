canonical_text:
  quote: ''
  summary: A chronicle passage for A.D. 684 records imperial decrees on court attendance,
    capital and palace sites, military training, and clothing; missions to determine
    boundaries and suitable capital locations by survey and divination; worship of
    the Hirose and Tatsuta deities; a prayer for rain; a palace vegetarian feast with
    pardon; punishment and suicide of a Buddhist priest; settlement of immigrants;
    and the appearance of a comet.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Officials, clerks, and artisans were sent to tour the Empire and determine
    provincial boundaries, but not all boundaries were determined that year.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Emperor decreed that civil and military officials and ranked persons in
    the Home provinces should appear at Court during the first four months unless
    prevented by mortal disease.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Emperor decreed that the Capital and Palace should not be in only one
    place and that a capital should first be made at Naniha.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Emperor sat in the Eastern Court with ministers present and had skilled
    archers, dwarfs, and palace attendants shoot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Emperor sent Prince Hirose, Yasumaro, clerks, professors of the In and
    Yo, and artisans to the Home provinces to determine by divination a suitable capital
    site.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Prince Mino and others were sent to Shinano to inspect the ground, perhaps
    for a capital there, and later presented a map of Shinano.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Yumi, Ube no Atahe, a man of Yoshino, sent tribute of a white camellia.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Worship was paid to the great Abstinence Deity of Hirose and to the Wind-Gods
    of Tatsuta.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: An imperial edict required civil and military officials to practice arms and
    riding, provide horses, weapons, and costume, and face fines or flogging for disobedience,
    with reductions for diligent learning.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: A clothing edict left certain garment features optional, regulated attire
    at state assemblies, allowed older women choices about hair and riding posture,
    and excepted practisers of magic from the hair rule.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: A vegetarian feast was prepared within the Palace, and a pardon was accordingly
    given to offending Toneri.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Buddhist priest Fukuyo of Asukadera was condemned and imprisoned, and
    later committed suicide by cutting his throat.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Twenty-three priests, nuns, laymen, and laywomen who had emigrated from Paekche
    were settled in Musashi province.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Prayer was offered for rain.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: The Emperor visited Hirose, and worship was again paid to the deities of Hirose
    and Tatsuta.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: A comet appeared in the north-west and was described as more than ten feet
    long.
  category: object
  evidence_refs:
  - ev:16
