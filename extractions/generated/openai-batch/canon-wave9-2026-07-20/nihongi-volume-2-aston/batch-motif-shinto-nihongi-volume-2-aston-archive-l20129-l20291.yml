canonical_text:
  quote: ''
  summary: Chronicle entries for A.D. 683 record legal and household decrees, court
    attendance, tribute of a three-legged sparrow, an imperial proclamation interpreting
    repeated heavenly auspicious signs as responses to harmonious government, gifts
    and pardons, court performances, appointments and religious regulation, coinage
    decrees, worship of Hirose and Tatsuta deities, deaths and honors, a palace retreat
    for priests and nuns, drought, prayer for rain by the priest Dōzō, a general amnesty,
    and a storm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A decree orders arrest procedures, permits raising local soldiers against
    resisters, sets a maximum flogging of one hundred blows, and adds the original
    offence when an accused falsely denies an undeniable crime.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A decree requires each House or division of a large House to determine and
    report its Senior member; officials are to decide disputed matters, and outsiders
    are not to be hastily included.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Viceroy of Tsukushi, Shima, Tajihi no Mabito, and others present a three-legged
    sparrow as tribute.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The three-legged sparrow is shown to Ministers during a banquet in front of
    the Great Hall of Audience.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Emperor speaks in a decree as the ruler who governs the great eight regions
    as a God Incarnate.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Emperor states that auspicious signs from Heaven appear when government
    administration accords with the laws of Heaven, and that such signs have appeared
    repeatedly in his reign.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Following the proclamation, ranked persons receive presents, crimes from capital
    offences downward are pardoned, and forced labour is remitted for common people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Court performances include the Woharida dance and music of Koryō, Pekché,
    and Silla.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Worship is paid to the Deities of Hirose and Tatsuta on two recorded days.
  category: action
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:10
  text: Priests and nuns are invited to the Palace for a retreat, and thirty persons
    of pure conduct are selected who renounce the world.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Prayer is made for rain during the summer, and the Buddhist priest Dōzō of
    Pekché prays for rain and obtains it during a drought.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: A general amnesty is ordered throughout the Empire before the entry recording
    a great storm.
  category: sequence
  evidence_refs:
  - ev:11
