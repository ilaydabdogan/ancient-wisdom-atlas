canonical_text:
  quote: ''
  summary: In A.D. 646, after New Year ceremonies, the Emperor issues a reform edict.
    The edict abolishes certain older private holdings and dependent people, grants
    sustenance fiefs and presents, regulates the capital and Home provinces, establishes
    governors, barriers, post-horses and bell-tokens, defines local officials and
    district sizes, orders registers and land-account systems, sets township duties,
    fixes rice-land measures and taxes, and replaces old taxes and forced labour with
    commuted taxes in textiles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the New Year congratulatory ceremonies, the Emperor promulgates an edict
    of reforms.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The edict orders abolition of certain people established by ancient Emperors
    as representatives of children, the Miyake in various places, serfs owned by named
    elite groups, and farmsteads in various places.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fiefs are granted for sustenance to those of the rank of Daibu and above,
    and cloth and silk-stuff presents are distributed to officials and people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The edict states that governing the people is the business of the Daibu and
    connects proper performance of this duty with public trust and revenue.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The capital is to be regulated for the first time, governors are to be appointed
    for the Home provinces and districts, and barriers, outposts, guards, post-horses,
    bell-tokens, and regulated mountains and rivers are to be provided.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Wards in the capital are to have aldermen and chief aldermen, selected for
    character and capacity, to supervise population and examine criminal matters.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Home provinces are geographically delimited by named rivers, mountains,
    and places, and districts are classified by the number of townships they contain.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The number of special or ordinary post-horses is to follow the marks on posting
    bell-tokens, which are held by chief officials or assistants at provinces and
    barriers.
  category: object
  evidence_refs:
  - ev:5
  - ev:8
- id: obs:9
  text: The edict orders the first provision of population registers, books of account,
    and a system for receipt and re-granting of distribution-land.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Every fifty houses are to form a township, with one alderman responsible for
    population supervision, agriculture, mulberry cultivation, offences, taxes, and
    forced labour.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Rice-land is measured in tan and cho, with specified rice-tax rates, while
    precipitous, remote, or sparsely populated places may receive convenient arrangements.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Old taxes and forced labour are abolished and replaced by commuted taxes in
    locally produced fine silk, coarse silk, raw silk, floss silk, and cloth.
  category: action
  evidence_refs:
  - ev:12
