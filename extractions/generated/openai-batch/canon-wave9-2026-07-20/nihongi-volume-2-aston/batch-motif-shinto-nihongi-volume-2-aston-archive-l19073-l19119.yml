canonical_text:
  quote: ''
  summary: Chronicle entries for A.D. 679 report a house left undestroyed after a
    hill came down and moved it; Silla escort-envoys reporting that tribute envoys
    were dispersed by a mid-ocean storm; an imperial decree regulating ceremonial
    respects by rank and kinship; archery at the West Gate; a Koryo tribute mission
    escorted by Silla; and the death and posthumous rank of Ki no Omi Katamaro.
  language: English
  quote_policy: summarized
