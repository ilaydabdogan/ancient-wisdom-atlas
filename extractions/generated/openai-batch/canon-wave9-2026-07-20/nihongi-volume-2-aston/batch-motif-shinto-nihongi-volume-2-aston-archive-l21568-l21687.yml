canonical_text:
  quote: ''
  summary: Chronicle entries for A.D. 687 describe clemency and exile after Imperial
    Prince Ohotsu's treason; Imperial Princess Ohoku's return from Ise; an earthquake;
    a universal great assembly in five temples; gifts to vulnerable people; tribute
    and settlement of people from Koryé, Pékché, and Silla; an anomalous serpent-dog
    copulation followed by both animals' deaths; and repeated mortuary rites for the
    deceased Emperor at the Palace of temporary interment, including laments, eulogies,
    food offerings, music, and the offering of a Mikage chaplet.
  language: English
  quote_policy: summarized
