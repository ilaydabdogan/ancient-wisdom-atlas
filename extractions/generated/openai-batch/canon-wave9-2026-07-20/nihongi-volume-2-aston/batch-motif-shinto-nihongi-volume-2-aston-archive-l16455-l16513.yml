canonical_text:
  quote: ''
  summary: An annalistic passage records the death and temporary burial of Fujihara
    no Naidaijin, an imperial visit and gift to Soga no Akaye no Omi, fires affecting
    the Treasury and the Temple of Ikaruga, repairs and taxation, missions and population
    movements involving Great Thang, an archery meeting at the Palace Gate, court
    ceremonial regulations, road-passing rules, population registers, and suppression
    of robbers and vagabonds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fujihara no Naidaijin died on the 16th day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cited Nihon Seiki account says the Naidaijin died at age fifty in his
    private residence and was removed for temporary burial south of a mountain; the
    tomb inscription gives his age as fifty-six.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Emperor went to Fujihara no Naidaijin's house, gave orders to Soga no
    Akaye no Omi, declared his will, and bestowed a golden incense-burner on him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the 12th month, a fire occurred in the Treasury; the Castle of Takayasu
    was repaired; the land-tax of the home provinces was collected; and the Temple
    of Ikaruga was burnt.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kujira, Kahachi no Atahe, of Middle Shoekin rank, and others were sent on
    a mission to the Land of Great Thang.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Minister Yo Cha-sin, Minister Kwisil Chip-sa, and over 4700 men and women
    were removed and settled in the district of Kamafu in Afumi province.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Great Thang sent Kuo Ya-ts'ung and others, more than 2000 men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the ninth year, spring, first month, seventh day, the Emperor commanded
    the gentry and Daibu to hold a great archery meeting within the Palace Gate.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: On the fourteenth day, the Emperor promulgated court ceremonial regulations
    and road-passing rules, and prohibited heedless slanders and foul falsehoods.
  category: action
  evidence_refs:
  - ev:8
