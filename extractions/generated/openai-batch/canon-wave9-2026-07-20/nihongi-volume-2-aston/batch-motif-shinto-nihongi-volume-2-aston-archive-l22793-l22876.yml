  quote: ''
  summary: 'An annalistic passage records court religious and administrative events:
    envoys worship named gods, a solar eclipse is noted, decrees regulate care of
    imperial misasagi and establish long-life places, the Empress visits Yoshino,
    envoys perform a service for the new capital’s tranquillity, the first-fruits
    festival is held with a prayer to Heavenly Deities, ritual participants receive
    gifts, and medical/exorcism specialists receive silver.'
