canonical_text:
  quote: Death was bestowed on the Imperial Prince Ohotsu in his house at Wosada.
  summary: The passage introduces the Empress Takama no hara hiro-no no hime, also
    named Imperial Princess Uno no Sarara, gives her imperial genealogy, marriage,
    virtues, motherhood, and military-political support of the Emperor. After the
    Emperor Ame no Nunahara oki no Mabito dies, she presides over the Court. Imperial
    Prince Ohotsu is arrested for treason, condemned to death, and his consort Yamanobe
    joins him in death. A decree states that Ohotsu led officials and people astray
    and that his followers deserve the same sentence.
