canonical_text:
  quote: ''
  summary: The passage records edicts abolishing certain customary purgation practices,
    regulating horse livery and payments along highways, ending some market and ferry
    dues, urging seasonal rice cultivation, and grounding rulership in Heaven, Earth,
    male and female natural principles, and the ordering of the seasons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some people borrowed pots for boiling rice; when the pots knocked against
    something and were upset, the pot owner compelled purgation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The edict calls such practices habitual among the unenlightened vulgar and
    orders that they be discontinued without exception.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Peasants travelling to the capital gave cloth and hemp to men of Mikaha or
    Wohari to feed their riding horses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The hired men are said to have failed to feed horses properly, allowed horses
    to starve, invented stories that superior horses had been stolen, and used purgation
    claims involving pregnant mares to plunder the beast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The regulation requires the horse owner to bring the hired caretaker to the
    village elder, make a full statement, and hand remuneration to the elder; no further
    payment is required on return.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the caretaker causes harm to the horse, he is to receive nothing, and disobedience
    to the edict brings a severe penalty.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Dues payable to Market Commissioners for main roads and to ferrymen are abolished,
    with lands granted instead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: During the agricultural months, everyone is instructed to apply themselves
    early to rice-land cultivation; eating dainty food or drinking sake at such a
    time is called improper.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Faithful messengers and good provincial messengers are to be appointed to
    urge peasants to work according to the edict.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The later edict says Heaven and Earth, with the male and female principles
    of nature, guard the four seasons from confusion and produce the ten thousand
    things.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The same edict says Man is the most miraculously gifted among the ten thousand
    things, that the sage takes the position of ruler, and that Sage Rulers or Emperors
    take Heaven as their exemplar in ruling the World.
  category: speech
  evidence_refs:
  - ev:7
