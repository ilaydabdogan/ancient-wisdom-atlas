canonical_text:
  quote: ''
  summary: Chronicle entries report a Pan-phi attack on Mononobe no Muraji’s party,
    their flight to Mun-mo-ra, later reception and gifting by Pekché officials, a
    Pekché delegation thanking for the grant of I-mun, a scholar offered for exchange,
    a Koryé envoy accompanied to the Japanese court for amicable relations, the removal
    of the capital to Otokuni, and the death of King Mu-nyéng of Pekché.
  language: English
  quote_policy: summarized
