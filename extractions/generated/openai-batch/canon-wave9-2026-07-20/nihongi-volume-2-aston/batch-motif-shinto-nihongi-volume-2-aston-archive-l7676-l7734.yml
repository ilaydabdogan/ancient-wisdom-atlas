canonical_text:
  quote: "“The Emperor of the East respectfully, addresses the Emperor of the West.”"
  summary: The passage describes a foreign embassy’s court ceremony, luxurious rank-marked
    court dress, entertainments for Thang guests, the departure of P’ei Shih-ch‘ing
    with newly appointed Japanese envoys and an imperial message, the dispatch of
    students and student-priests to Thang, and settlement in Japan by people from
    Silla.
  language: English
  quote_policy: quoted
