canonical_text:
  quote: ''
  summary: A chronicle passage explains the ruin of several provinces, argues that
    Silla could not alone destroy Imna, and urges combined loyalty to the Emperor
    for Imna's restoration. Pékché sends officials to Ara to address intrigue with
    Silla, reproves a Japanese authority there, and addresses Imna by invoking ancestral
    amity, oath-taking before gods and spirits, obedience to the Emperor's decree,
    restoration of provinces taken by Silla, and suspicion of Silla's deceptive words.
  language: English
  quote_policy: summarized
