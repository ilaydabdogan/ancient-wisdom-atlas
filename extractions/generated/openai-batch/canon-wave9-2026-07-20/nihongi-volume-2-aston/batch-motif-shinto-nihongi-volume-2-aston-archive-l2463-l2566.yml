  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The address states that the allied parties serve the Emperor and repel hostile
    violence together, preserving peace and state integrity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker urges oath-taking to the gods from the cloud-spaces above to the
