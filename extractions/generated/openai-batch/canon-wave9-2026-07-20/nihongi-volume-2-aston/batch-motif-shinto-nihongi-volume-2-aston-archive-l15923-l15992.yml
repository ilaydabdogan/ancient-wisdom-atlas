  quote: ''
  summary: Chronicle entries for A.D. 665-666 report construction of two castles in
    Tsukushi, embassies and tribute from Tamna, Thang, and Koryo, arrivals and diplomatic
    correspondence, a military review at Uji, banquets and presents for Thang envoys,
    a Japanese mission to Great Thang, and the Prince Imperial's visit to the sick
    Saheki no Komaro no Muraji in recognition of his loyal service.
