canonical_text:
  quote: ''
  summary: The passage gives articles of governance instructing ministers and functionaries
    to avoid envy, prefer public duty over private motives, use forced labor only
    in suitable seasons, and decide weighty matters through consultation. It then
    records reform of court ceremonies at the Palace Gate, the establishment of Kibumi
    and Yamashiro painters, and an imperial command to make large copper and embroidery
    images of Buddha, with Kuratsukuri no Tori appointed as engineer. Footnotes connect
    the painters with Buddhist pictures and broader Chinese, Pékché/Corean, and Japanese
    transmission of Buddhist texts, artisans, and painters.
  language: English
  quote_policy: summarized
