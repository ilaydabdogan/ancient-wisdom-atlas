- id: claim:2
  claim: The note compares the Japanese ceremony of announcing the new month with
    an old Chinese custom of announcing the month to imperial ancestral temples, while
    stating that the Japanese practice seems to have differed.
  claim_level: same_function
  target: Chinese new-month announcement to ancestral temples of Emperors
  evidence_refs:
  - ev:15
  counter_evidence_refs:
