  summary: An annalistic passage records imperial orders to release living beings,
    posthumous honors for deceased officials, omitted monthly announcements, punishments
    and gifts, Shinto divination for first-fruits rice, offerings to deities, diplomatic
    missions and tribute, sutra exposition, a failed plan to make a capital at Nihiki,
    court entertainments, weather-driven arrival at an island, and an order dividing
    sacred rice-tax between offerings to gods and Kannushi.
