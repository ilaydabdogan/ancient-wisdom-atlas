  cautions: The available motif-family list has no exact life-release category; no
    motive such as merit-making is stated in the annal entry itself.
- id: motif:2
  label: Divination selects ritual first-fruits suppliers
  taxonomy_refs: []
  basis: The Department of the Shinto religion reports that divination determined
    the districts that would supply Yuki and Sugi rice for the first-fruits festival;
    the note says the divination used a tortoise-shell.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage presents this as ritual administration rather than a mythic
    quest or prophecy episode.
