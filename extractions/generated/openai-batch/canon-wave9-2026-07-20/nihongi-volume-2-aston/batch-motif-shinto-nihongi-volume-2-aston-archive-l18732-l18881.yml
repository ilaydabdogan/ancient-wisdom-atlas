- id: claim:1
  claim: The passage itself identifies the imperial release of living things with
    a Buddhist practice of releasing captive animals at temple settings.
  claim_level: same_motif
  target: Buddhist life-release practice involving animals such as lampreys or sparrows
  evidence_refs:
