  summary: Military episodes in which Isogimi sends Kujira with 200 picked soldiers;
    Tokumaro and four companions check Kujira's advance with arrows; Takechimaro and
    Usagi defeat the Afumi army and cut off Kujira's retreat; Kujira escapes on a
    white horse after it falls in a muddy rice-field. A prior episode reports Kome's
    sudden inability to speak for three days, followed by divine inspiration.
