  text: Takechi-maro, Miwa no Ason, the Chunagon, divested himself of his cap-rank,
    delivered it to the Court, and repeated a remonstrance that the imperial chariot
    should not be moved during the season of agricultural operations.
  category: speech
  evidence_refs:
