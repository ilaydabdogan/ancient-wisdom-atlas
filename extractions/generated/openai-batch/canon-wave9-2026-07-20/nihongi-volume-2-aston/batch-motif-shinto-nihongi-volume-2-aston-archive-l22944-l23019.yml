canonical_text:
  quote: ''
  summary: A chronicle passage records the Empress proceeding to Ise despite a court
    official’s remonstrance that the imperial chariot should not be moved during the
    agricultural season. Subsequent entries describe rank grants, tax and labour remissions,
    rice distributions, a general pardon with exceptions, rewards and music during
    the imperial return, funeral honors for Tomokuni, exemptions for baggage-coolies,
    prayers sent to deities of Hirose and Tatsuta, gifts of mattocks to officials,
    release of prisoners and lightly banished persons, and the start of a new entry
    naming three fishermen brothers.
  language: English
  quote_policy: summarized
