canonical_text:
  quote: ''
  summary: The passage reports that the Buddhist priest Chiyu made a south-pointing
    chariot. It then gives a report from Idzumo about strange fish dying in heaps
    on the northern sea shore; local people say these are sparrows that entered the
    sea and became fish, naming them sparrow-fish. A separate cited book reports that
    Paekche sent envoys to the Empress with news that Great Thang and Silla had attacked
    and taken the Paekche king, queen, and heir prisoner, after which Paekche stationed
    troops on the north-western frontier.
