  quote: ''
  summary: The passage instructs that each person should have a distinct duty, that
    wise people should be appointed to office, and that unprincipled office-holders
    bring disorder. It states that wisdom is gained through earnest meditation and
    that choosing the right person for an office preserves the state and its temples.
    It cites ancient wise sovereigns as precedents for seeking the person suited to
    the office rather than creating office for the person.
