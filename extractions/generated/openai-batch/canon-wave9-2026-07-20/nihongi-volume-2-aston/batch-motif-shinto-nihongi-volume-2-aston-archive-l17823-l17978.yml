  summary: The passage reports divine revelations through trance and priestly speech
    during a military conflict. Gods associated with the shrines of Takechi, Musa,
    and Muraya warn of approaching armies, claim protection of the imperial army,
    and prescribe offerings. The warnings are later treated as accurate. After the
    war, the Emperor raises the three gods in rank. The passage then recounts military
    consolidation, punishments and pardons, rewards for service, the Emperor’s return
    and residence changes, and the reception and departure of Silla guests.
