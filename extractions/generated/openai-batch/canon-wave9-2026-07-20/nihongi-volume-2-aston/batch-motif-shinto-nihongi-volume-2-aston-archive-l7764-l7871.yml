canonical_text:
  quote: ''
  summary: 'The passage records events in A.D. 610: Buddhist priests and laymen from
    Pékché arrive by sea after being prevented from entering Wu and driven by a storm
    to the Japanese coast; some priests are permitted to remain in Japan. It also
    reports the return of Imoko from Great Thang, tribute of learned Buddhist priests
    from Koryŏ, diplomatic arrivals and court reception ceremonies for envoys from
    Silla and Imna, and the Empress gathering medicinal herbs at Uda.'
  language: English
  quote_policy: summarized
