canonical_text:
  quote: ''
  summary: In A.D. 662–663, an unnamed party proposes moving to Phi-syong because
    remaining would cause starvation and because Phi-syong is fertile and geographically
    protected. Yechi no Takutsu objects that Phi-syong is too near the enemy and that
    Chyu-yu, with its scarped hill, cliffs, and ravines, is easier to defend. The
    leaders ignore him and make Phi-syong the capital, but after Silla attacks Pékché
    territory and the enemy nears Phi-syong, the position becomes untenable and they
    return to Chyu-yu in accordance with Takutsu’s policy. The passage also notes
    preparations to aid Pékché, tribute from Pékché, and Minister Pok-sin sending
    Thang prisoners to the Emperor.
  language: English
  quote_policy: summarized
