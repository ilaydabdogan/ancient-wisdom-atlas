canonical_text:
  quote: ''
  summary: A chronicle passage records presents given to Chonma and companions, the
    Prince Imperial's assumption of Imperial Dignity, a palace banquet and envoy report,
    the appointment of Princess Yamato bime as Empress-consort, and genealogical notices
    about concubines, imperial children, later rule by Princess Uno, and variant accounts
    preserved in other books.
  language: English
  quote_policy: summarized
