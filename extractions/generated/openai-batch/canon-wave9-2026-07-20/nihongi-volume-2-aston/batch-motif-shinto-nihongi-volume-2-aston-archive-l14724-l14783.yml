canonical_text:
  quote: ''
  summary: The passage describes Nigi-Yemishi presented at court as tribute-bringing
    people. The Emperor questions envoys about their grain, food, houses, and dwelling
    places, then dismisses them to an official residence. At the Winter Solstice court
    festival, Japanese visitors are distinguished among frontier states. A conflagration
    leads to neglect of the matter; afterward a servant slanders the visitors, who
    are condemned by the Court of Thang, but Hakatoko petitions and their punishment
    is remitted. The Emperor then decrees that the Wa visitors may not return east
    and they are detained in the Western capital.
  language: English
  quote_policy: summarized
