canonical_text:
  quote: ''
  summary: The Empress visits the hot baths of Ki, grieves for her grandson Prince
    Takeru, recites verses about crossing mountains and seas while unable to forget
    Imaki and leaving a dear young child, and orders the verses to be handed down.
    Later, Soga no Akaye criticizes three works of the Empress’s government to Imperial
    Prince Arima, who responds that he is now fit to bear arms; Arima then goes to
    Akaye’s house and conspires.
  language: English
  quote_policy: summarized
