canonical_text:
  quote: ''
  summary: Chronicle entries record diplomatic receptions and departures, deaths in
    Kyoki’s household, unusual weather and celestial signs, a drought, court discussion
    of failed drought-averting rites, Buddhist sutra-recitation and incense prayer
    for rain, the sovereign’s prayer at the river-source of Minabuchi followed by
    thunder and five days of rain, public acclamation of imperial virtue, and the
    wreck of a departing Pekché ship in wind and rain.
  language: English
  quote_policy: summarized
