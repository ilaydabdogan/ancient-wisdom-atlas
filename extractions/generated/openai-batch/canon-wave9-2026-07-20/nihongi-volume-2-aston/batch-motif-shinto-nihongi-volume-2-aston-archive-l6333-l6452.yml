canonical_text:
  quote: ''
  summary: After civil troubles, temples and endowments are established, including
    a temple built in fulfillment of a vow. Yorodzu, a dependent of Mononobe no Moriya,
    flees after Moriya's downfall, hides in hills, deceives and fights pursuing guards,
    declares himself a shield of the Emperor, destroys his weapons, and kills himself.
    The Court orders his body dismembered and exposed, but thunder and rain occur;
    Yorodzu's white dog carries his head to an ancient mound, starves beside it, and
    the Court orders a tomb for Yorodzu and the dog. A second report tells of battlefield
    corpses and another dog guarding its master's body until burial. The passage then
    records imperial accession, confirmation of offices, palace construction, and
    the appointment of a consort who bears two imperial children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the civil troubles were quieted, a Temple of the Four Heavenly Kings
    was built in Settsu, property and rice-land were assigned, and Soga no Oho-omi
    erected the Temple of Hokoji in fulfillment of his vow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yorodzu was a dependent of Mononobe no Moriya and was guarding the house at
    Naniha when he heard of the Ohomuraji's downfall.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yorodzu fled by night, passed his wife's house, and concealed himself among
    hills near Arimaka in Chinu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Court judged Yorodzu to have traitorous feelings and proposed the prompt
    extirpation of his kindred.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Yorodzu came forth alone in tattered, filthy clothing, with a wretched appearance,
    carrying a bow and wearing a sword.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: When surrounded by guardsmen, Yorodzu hid in a bamboo thicket and used cords
    tied to bamboos to shake them, causing the pursuers to misjudge his location.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Yorodzu shot arrows that did not miss, fled toward the hills, and was wounded
    in the knee by a guardsman lying by the river.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Yorodzu prostrated himself and said he would have devoted his valor as a shield
    of the Emperor, asked for someone to speak with him, and wanted to know whether
    he would be killed or made prisoner.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Yorodzu killed more than thirty men, cut his bow into three pieces, bent back
    his sword and threw it into the river, then stabbed himself in the throat and
    died.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Court ordered Yorodzu's body cut into eight pieces and exposed among eight
    provinces; when the Governor of Kahachi was about to dismember the body, thunder
    sounded and heavy rain fell.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Yorodzu's white dog circled and howled beside the corpse, took the head to
    an ancient mound, lay beside it, and starved to death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the Governor reported the dog's conduct, the Court called the case rare,
    ordered it shown to later ages, and told Yorodzu's kindred to construct a tomb
    and bury the remains.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Yorodzu's kindred assembled, raised a tomb in Arimaka, and buried Yorodzu
    and his dog there.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A report from Kahachi said several hundred slain men lay on the plain of the
    River of Yega; their bodies were putrefied and identified by clothing for burial.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: A dog kept by Inu, Sakurawi no Tanabe no Muraji, held onto its master's dead
    body with its teeth and guarded it until the body was taken up for burial.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: On the advice of Kashikiya hime no Mikoto and the Ministers, the Emperor assumed
    the Imperial Dignity; offices and ranks were confirmed, and a palace was made
    at Kurahashi.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Woteko, daughter of Ohotomo no Nukade no Muraji, was appointed Consort and
    bore the Imperial Prince Hachiko and the Imperial Princess Nishikide.
  category: relationship
  evidence_refs:
  - ev:11
