  basis: Yorodzu flees by night and hides among the hills after hearing of the Ohomuraji's
    downfall.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The available taxonomy term is broad; the passage presents political flight
    rather than a quest departure.
- id: motif:3
  label: Deception of pursuers by manipulated natural cover
  taxonomy_refs: []
  basis: Yorodzu ties cords to bamboos, shakes them, and causes the guardsmen to think
    he is where the bamboos are moving.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is a tactical episode; no explicit supernatural or ritual meaning
    is assigned.
- id: motif:4
  label: Surrounded warrior's last stand and self-chosen death
  taxonomy_refs: []
  basis: Yorodzu resists many guards, kills more than thirty, destroys his weapons,
