canonical_text:
  quote: ''
  summary: The passage gives chronicle notices about Sun-goddess service, the appointment
    of Imperial Princess Anahobe no Hashibito as Empress Consort, and her sons including
    Prince Miimayado/Shotoku. It then narrates Prince Anahobe's attempted forced entry
    into the palace of temporary interment where Kashikiya hime was, Sakahe's defensive
    closure of the gate, Anahobe's complaint and request to kill Sakahe, a secret
    plan for rulership, pursuit and betrayal of Sakahe's hiding place, the killing
    of Sakahe and his children, and Soga no Mumako's warning that civil disorder is
    near.
  language: English
  quote_policy: summarized
