canonical_text:
  quote: ''
  summary: Pékché sends officials to render tribute and present a memorial. The Emperor
    decrees that the Empress and Emperor are of one body while their designations
    remain distinct, orders Miyake land revenues to support a Pepper Court for later
    remembrance, and appoints commissioners to select good rice-land. The commissioners
    ask Ajihari to offer the fertile rice-land of Kiji, but Ajihari withholds it by
    falsely describing it as drought-prone and unproductive. Later the Emperor tells
    Kanamura that, despite four wives, he has no heir and fears the extinction of
    his name; Kanamura begins to advise him. Translator notes explain the term Pepper
    Court by reference to Han empress palace practices and pepper flowers associated
    with hoped-for fruitfulness.
  language: English
  quote_policy: summarized
