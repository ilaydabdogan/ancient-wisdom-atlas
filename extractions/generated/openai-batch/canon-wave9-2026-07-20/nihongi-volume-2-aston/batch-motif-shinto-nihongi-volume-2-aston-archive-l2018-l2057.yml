  summary: The passage records an imperial command, the death of Mononobe no Arakahi,
    the cyclical year, an expedition ordered by the Emperor in response to Silla’s
    hostility toward Imna, Sadehiko’s pacification of Imna and aid to Pékché, the
    Emperor’s death and burial, and the co-burial of the Empress and her infant child,
    with a note that the record does not state the year of the Empress’s death.
