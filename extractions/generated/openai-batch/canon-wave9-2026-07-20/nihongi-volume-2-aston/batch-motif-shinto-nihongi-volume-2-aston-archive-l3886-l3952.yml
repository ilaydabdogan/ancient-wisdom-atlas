  quote: ''
  summary: A speaker praises a deceased servant who had administered Imna and asks
    the Emperor's bounty to send a replacement and supply bows and horses. The passage
    then describes Yō-chhyang, son of the King of Pékché, leading troops against Koryo,
    encamping on the Pék-hap plain, hearing unexpected music at night, finding the
    plain filled with banners at dawn, and being approached by five horsemen who ask
    his name, age, and rank.
