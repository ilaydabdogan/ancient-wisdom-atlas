  quote: ''
  summary: A chronicle passage recounts a Japanese-led campaign involving Silla, Pékché,
    Koryé, and Thang forces. It includes the accusation and execution of Pok-sin by
    King Phung-chhyang of Pékché, Silla and Thang military advances, a naval defeat
    at the Pékchon river with many drowned, the flight of the Pékché king to Koryé,
    the surrender of Chyu-yu, and the departure of Pékché people and officials toward
    Japan.
  language: English
