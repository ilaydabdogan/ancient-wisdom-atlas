canonical_text:
  quote: This is the God of the Everlasting World.
  summary: The passage reports popular songs interpreted as signs of change; an insect
    cult promising long life, riches, and renewed youth; offerings and waste by worshippers;
    the killing of the cult promoter by Kahakatsu; a description of the insect; and
    Soga/Iruka construction of fortified, palace-like residences and related religious
    or defensive works.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Three popular songs are said to have been made at a time described as a sign
    of changes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ohofu Be no Oho urged fellow-villagers near the River Fuji to worship an insect,
    calling it the God of the Everlasting World and promising long life and riches
    to worshippers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wizards and witches, described as pretending divine inspiration, said worshippers
    would become rich if poor and young again if old.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The people were persuaded to cast out household valuables, set out roadside
    offerings, cry out about new riches, place the insect in a pure place, and invoke
    happiness with song and dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that the treasures were thrown away to no purpose and that
    the loss and waste were extreme.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kahakatsu became angry that the people were deluded, slew Ohofu Be no Oho,
    and the wizards and witches stopped persuading people to the worship.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A later song says that Udzumasa executed the God of the Everlasting World,
    who had been called the God of Gods.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The insect is described as usually bred on orange trees, sometimes on the
    Hosoki, over four inches long, thumb-thick, grass-green with black spots, and
    resembling a silkworm.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Iruka no Omi, son of Yemishi, built two houses on Amagashi Hill; the houses
    were called Palace-Gate and Valley-Palace-Gate.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The sons and daughters of the Soga household are said to have been styled
    Princes and Princesses.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The houses had palisades, an armoury by the gate, water tanks, wooden hooks
    against fire, and armed guards.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Oho-omi made Osa no Atahe build the Temple of Hokonuki on Mount Ohoniho,
    and he built a house east of Mount Unebi and dug a pond described by a note as
    a moat.
  category: action
  evidence_refs:
  - ev:8
