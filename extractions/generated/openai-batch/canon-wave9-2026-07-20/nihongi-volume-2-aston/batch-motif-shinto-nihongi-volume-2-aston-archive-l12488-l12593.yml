  summary: An imperial edict describes disorder caused by the distribution and naming
    of various Be groups, orders their abolition into state subjecthood, protects
    imperial names from common or place-name use, reorganizes offices into new bureaus
    with ranks, and instructs provincial officials on land distribution, taxes, labor
    quotas, boundaries, maps, and public works.
