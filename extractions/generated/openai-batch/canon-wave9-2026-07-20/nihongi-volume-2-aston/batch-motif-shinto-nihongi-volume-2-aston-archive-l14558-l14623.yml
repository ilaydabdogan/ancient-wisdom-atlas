  quote: ''
  summary: The passage reports an envoy’s return from Pekché with news of a successful
    expedition against Silla, a horse continuously going around the Golden Hall of
    a temple, later notes interpreting this as an omen of destruction, and dated movements
    and ceremonies of the Empress, including visits to hot springs, Yoshino, Hira-ura,
    the arrival of people from Tukhara and Sravasti, and the construction of a Mount
    Sumi on a river-bank to entertain the Yemishi of Michinoku and Koshi.
  language: English
