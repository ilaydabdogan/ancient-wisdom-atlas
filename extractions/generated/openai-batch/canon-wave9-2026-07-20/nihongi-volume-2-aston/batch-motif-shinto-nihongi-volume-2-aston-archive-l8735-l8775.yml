canonical_text:
  quote: ''
  summary: The passage opens Book XXIII with the genealogy of Emperor Okinaga Tarashi-hi
    Hiro-nuka, later identified as Jomei Tennō. It then recounts that after the death
    of Prince Imperial Toyotomimi and the later death and funeral of Empress Toyo-mike
    Kashikiya hime, no successor had been appointed. Soga no Yemishi no Omi, the Oho-omi,
    sought to settle the succession, consulted Abe no maro no Omi, assembled the Ministers
    at a feast, and through Abe addressed them about the danger of civil disturbance
    and the question of which prince should succeed. The passage ends with reference
    to the Empress’s command to Imperial Prince Tamura that the Empire was a great
    charge.
  language: English
  quote_policy: summarized
