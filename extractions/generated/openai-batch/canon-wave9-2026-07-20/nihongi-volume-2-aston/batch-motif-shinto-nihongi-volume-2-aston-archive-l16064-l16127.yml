canonical_text:
  quote: ''
  summary: 'The passage records events in A.D. 667: popular opposition to moving the
    capital, satirical remonstrance, songs, and repeated fires; the presentation of
    a white swallow to the Emperor; foreign embassies and movements of royal or official
    persons; a Koryé succession conflict in which Namséng is excluded by younger brothers
    and flees to Great Thang; Chinese escort missions; and the construction of three
    castles.'
  language: English
  quote_policy: summarized
