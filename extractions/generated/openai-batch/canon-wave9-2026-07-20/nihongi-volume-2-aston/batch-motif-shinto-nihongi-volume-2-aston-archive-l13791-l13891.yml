canonical_text:
  quote: ''
  summary: Chronicle entries recount Japanese envoys travelling by ship to a foreign
    capital, questions about Japan’s geography and origin gods, deaths and returns
    among envoys and students, storm-driven arrivals in Hiuga, returning Western Sea
    envoys rewarded for a Tang audience and for obtaining books and precious objects,
    the Emperor’s illness, death, interment and burial, the Prince Imperial’s move
    to Yamato, a rat-migration omen of capital transfer, and condolence embassies
    from neighboring states.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Japanese embassy group embarked separately on two ships, travelled by way
    of Silla, anchored at Laichou, and reached a capital where they had an audience
    with an Emperor.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kuo Wen-chii, superintendent of the guards of the Prince Imperial’s Palace,
    asked the envoys about the geography of Japan and the names of the gods of the
    beginning of the country; the envoys gave answers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Controlling Envoy Takamuku no Kuromaro died in Great Tang.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yuki no Hakatoko reports deaths in Tang, deaths at sea, and later returns
    among named student-priests, students, and companions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two men and two women of Tukhara and one woman of Sravasti were driven by
    a storm to Hiuga.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kishi no Nagani and colleagues, who had gone as envoys to the Western Sea,
    anchored in Tsukushi with escorting envoys from Silla and Pekche.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Emperor commended the Western Sea envoys for having a personal audience
    with the Emperor of Tang and for obtaining numerous books and precious objects,
    and he bestowed ranks and a fief.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the Emperor became ill, the Prince Imperial proceeded to Naniha Palace
    with the Empress Dowager, Empress Hashibito, younger Imperial Princes, and Ministers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Emperor died in the State Bedchamber, was temporarily interred in the
    southern courtyard, and was later buried in the misasagi of Shinaga at Ohosaka.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Dotoko, Mozu no Hashi no Muraji, superintended the business of the Palace
    of Temporary Interment.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Prince Imperial, accompanied by the Empress Dowager, moved his residence
    to the Temporary Palace of Kahabe in Yamato.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Old people said that the migration of rats to the Yamato capital was an omen
    of the transfer of the capital there.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Koryo, Pekche, and Silla sent ambassadors of condolence in the same year.
  category: action
  evidence_refs:
  - ev:7
