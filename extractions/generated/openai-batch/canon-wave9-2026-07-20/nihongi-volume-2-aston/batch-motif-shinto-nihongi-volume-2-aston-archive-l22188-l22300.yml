canonical_text:
  quote: ''
  summary: Chronicle entries report gifts, religious communications, imperial visits,
    prohibitions on hunting and fishing, release of a white swallow, military and
    administrative orders, appointments and rank grants, manumission of slaves, prohibition
    of suguroku, and an accession rite in which shields are set up, blessings from
    the Gods of Heaven are recited, divine seal, sword, and mirror are delivered to
    the Empress-consort, and ministers perform obeisance and hand-clapping.
  language: English
  quote_policy: summarized
