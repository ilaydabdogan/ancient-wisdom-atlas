canonical_text:
  quote: ''
  summary: Chronicle entries under Tenchi report imperial site inspection and castle
    works, a Shinto ritual near Miwi with cloth offerings and a litany, the burning
    of Horiuji, stormy weather, an obscure popular ditty about a bridge and the house
    of Tamate, and a tortoise caught in the capital bearing the character Saru. Notes
    explain Miwi as an august well used in imperial birth washings and describe the
    Saru sign as a supposed omen of later civil disturbances.
  language: English
  quote_policy: summarized
