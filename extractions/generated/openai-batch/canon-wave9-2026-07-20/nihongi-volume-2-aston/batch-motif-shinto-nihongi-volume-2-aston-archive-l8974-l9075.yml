canonical_text:
  quote: ''
  summary: The passage describes a political succession dispute. The Oho-omi, though
    ill, sends envoys and messages about which prince should become Emperor and invokes
    the Empress's dying command. Sakahibe no Omi, identified in a note with Marise
    no Omi, angrily refuses further discussion, disrupts tomb preparations, withdraws
    from official duty, and later takes refuge at Prince Hatsuse's palace. The Oho-omi
    and Prince Ohoye admonish him to yield and avoid bringing disorder on the country.
    After further admonition, Prince Hatsuse becomes ill and dies, and Marise laments
    that he has no one left to trust.
  language: English
