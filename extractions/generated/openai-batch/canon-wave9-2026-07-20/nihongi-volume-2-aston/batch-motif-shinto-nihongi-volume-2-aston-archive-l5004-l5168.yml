canonical_text:
  quote: ''
  summary: The passage opens Book XX with the lineage, accession, and early reign
    actions of Emperor Nunakura Futo-tama-shiki, including dealings with Koryo envoys.
    A foreign memorial written on crow feathers cannot be read by the court scribes
    until O Chin-ni uses steam from boiled rice and silk to transfer and interpret
    the characters. Later, Koryo associate envoys conspire to kill their chief envoy
    to conceal misconduct over tribute; the chief is attacked and killed, and a false
    explanation is given. The passage also records the departure of envoys and a later
    shipwreck involving Koryo envoys.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Emperor Nunakura Futo-tama-shiki is identified as the second child of
    Emperor Ame-kuni-oshi-hiraki-hiro-niha, with a named mother from imperial lineage;
    he is described as not a believer in Buddhism but fond of literature.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the death of the previous emperor, the Prince Imperial assumes the Imperial
    Dignity, honors the Empress as Grand Empress, establishes a palace, and continues
    or appoints high officials.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Emperor asks where the Koryo envoys are, becomes vexed when told they
    are at Sagaraka, and sends ministers to inspect the tribute and send the envoys
    to the capital.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Emperor has the Koryo memorial given to the Oho-omi and orders assembled
    scribes to read and explain it; the scribes cannot read it for three days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: O Chin-ni, founder of the Funa no fubito family, is able to read and explain
    the memorial, and the Emperor and Oho-omi praise him and order his attendance
    near the palace.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Koryo memorial is written on crow feathers with black characters; Chin-ni
    steams the feathers in vapor from boiled rice and takes an impression on silk,
    transferring the characters.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Chief Koryo Envoy rebukes the associate envoys for sharing national tribute
    without authorization; the associates discuss killing him secretly to prevent
    him from reporting them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The conspiracy becomes known to the Chief Envoy, who leaves alone and stands
    in the inner court; multiple attackers strike, stab, and finally kill him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The associate envoys give officials a false explanation, claiming they killed
    the Chief Envoy on behalf of the Emperor because he refused an imperial gift of
    a wife; officials bury him ceremonially.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Koryo envoys depart in the seventh month; in the second year, other Koryo
    envoys anchor on the Sea of Kushi, their ship is wrecked, many drown, and they
    are dismissed without entertainment under court suspicion.
  category: sequence
  evidence_refs:
  - ev:10
