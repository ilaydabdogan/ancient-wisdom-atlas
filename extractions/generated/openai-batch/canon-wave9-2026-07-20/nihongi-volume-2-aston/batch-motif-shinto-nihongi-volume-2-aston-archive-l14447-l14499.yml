  quote: ''
  summary: Alternative chronicle accounts describe Imperial Prince Arima and associates
    using divination for a treasonous conspiracy, planning to burn the palace and
    ambush the Empress, receiving an objection based on the prince's youth, and ignoring
    a spontaneous breakage of his arm-rest before his execution. The passage then
    reports Hirafu's expedition against the Su-shen and his presentation of two live
    white bears to the Emperor, with translator notes on the identification of the
    animals.
