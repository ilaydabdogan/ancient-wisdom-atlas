canonical_text:
  quote: ''
  summary: 'A sequence of military actions is narrated: Woyori''s forces confront
    the army of Imperial Prince Ohotomo at Seta bridge; a soldier named Waka-omi crosses
    a dangerous plank, cuts its rope, and causes a rout. Subsequent actions include
    the capture of Miwo Castle, killings at Ahadzu, Ohotomo''s flight and suicide,
    defensive deployments by Wofukehi, fighting around Takayasu and Kashikozaka, Shihoko''s
    suicide after his plans are exposed, Wofukehi''s defeat and rallying of troops,
    and a battle by Ashi-ike in which the soldier Kume''s charge helps rout Karakuni''s
    forces. The passage ends with preparations against another advancing Afumi army.'
  language: English
  quote_policy: summarized
