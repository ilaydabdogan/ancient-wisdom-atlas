  evidence_refs:
  - ev:1
- id: obs:3
  text: Waka-omi laid aside his spear, put on double armour, drew his sword, rushed
    across the plank, cut the rope, and entered the opposing array despite arrows.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Waka-omi entered the array, the troops were thrown into confusion and
    fled; Chison was slain near the bridge, while Ohotomo and high ministers escaped.
  category: sequence
  evidence_refs:
