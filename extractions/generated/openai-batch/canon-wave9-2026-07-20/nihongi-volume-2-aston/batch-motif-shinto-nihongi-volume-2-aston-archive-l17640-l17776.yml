candidate_motifs:
- id: motif:1
  label: dangerous bridge crossing breaks an army's defense
  taxonomy_refs: []
  basis: The bridge is cut and rigged with a removable plank, but Waka-omi crosses
    it under arrows, cuts the rope, and causes the defending troops to rout.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is extracted as a narrative battle pattern, not as a supernatural
    or explicitly mythic motif.
- id: motif:2
  label: single brave soldier precipitates rout of a larger force
  taxonomy_refs: []
  basis: Waka-omi's entry into the enemy array causes confusion and flight at Seta;
    Kume's sword charge at Ashi-ike is followed by cavalry and the Afumi troops flee.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: high
  cautions: The passage frames both as battlefield bravery; no divine aid is stated.
- id: motif:3
  label: suicide after defeat, exposure, or loss of refuge
  taxonomy_refs: []
  basis: Ohotomo flees with nowhere to go and strangles himself at Yamazaki; Shihoko
    commits suicide after Karakuni discovers his plan to join the Fuha Palace.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage does not provide ritual explanation or moral interpretation
    for these suicides.
- id: motif:4
  label: fortress seizure, abandonment, and strategic road defense
