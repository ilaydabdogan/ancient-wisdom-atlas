canonical_text:
  quote: under the wide Heavens there is no place which is not royal territory
  summary: The passage reports an imperial decision to establish and grant Miyake
    estates for royal women as a sign for posterity. The Emperor later travels to
    Mishima, asks about good rice-land belonging to the district-lord Ihi-bo, and
    receives named lands totaling forty cho. By imperial command, Kanamura declares
    that all soil and all places under heaven are royal territory and praises previous
    Emperors in cosmic terms.
  language: English
  quote_policy: quoted
