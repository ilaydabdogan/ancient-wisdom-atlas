canonical_text:
  quote: "“This is an omen of the division of the Empire into two parts.”"
  summary: A minister warns the Emperor against proceeding eastward without soldiers.
    The Emperor attempts to obtain posting-bells, is refused, and begins an urgent
    eastward journey with the Empress-consort and a small group. Along the way he
    gathers followers, uses improvised mounts and lights, burns posting-stations,
    proclaims for local support, divines a dark cloud as an omen of imperial division
    and eventual acquisition of the Empire, gains military reinforcements, blocks
    the Suzuka mountain road, and continues amid fatigue, cold, thunder, and rain.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A minister warns that Afumi ministers may conspire, roads may become impassable,
    and proceeding east unarmed may cause the enterprise to fail.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Emperor sends messengers to Prince Takasaka to request posting-bells and
    instructs them on what to do if the bells are not obtained.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Prince Takasaka refuses the posting-bells; Yesaka goes to Afumi, while Shima
    returns and reports that the bells were not obtained.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Emperor starts toward the East Country urgently, first on foot, then on
    a saddle-horse, and later in his carriage; the Empress-consort follows in a palanquin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The initial party includes imperial princes, retainers, more than twenty persons
    in all, and more than ten women.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Along the route, food is supplied, hunters are summoned to follow, Prince
    Mino joins, and pack-horses carrying rice are converted into mounts after the
    rice is thrown away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At night, when mountains are dark and travel is difficult, fences are pulled
    down to provide lights; at Nabari, the posting-station is set on fire and the
    people are told to join, but no one comes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Near the River Yokogaha, a dark cloud covers part of the sky; the Emperor
    lights a light, holds the Rule, and divines it as an omen concerning division
    of the Empire and eventual acquisition of the Empire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Iga another posting-station is set on fire, and district governors join
    with several hundred men.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Imperial Prince Takechi and several named followers join; provincial officials
    join at Suzuka; 500 troops are sent to block the mountain road over Suzuka.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the foot of the Hill of Kahawa, the Empress-consort is fatigued and her
