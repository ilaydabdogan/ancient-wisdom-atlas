  summary: The passage records an administrative reform of court titles, grants the
    Mabito title to thirteen houses, sends Prince Ise and colleagues to determine
    provincial boundaries, dispatches envoys to Tamna, and describes a catastrophic
    earthquake marked by panic, fallen mountains, gushing rivers, destroyed buildings
    and shrines, casualties, dried hot springs, and cultivated land in Tosa being
    swallowed and becoming sea.
