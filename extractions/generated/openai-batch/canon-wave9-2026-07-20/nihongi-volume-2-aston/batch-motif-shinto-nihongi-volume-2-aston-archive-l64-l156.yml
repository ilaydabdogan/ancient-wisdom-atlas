  summary: The passage opens Book XVII with Emperor Wohodo's genealogy, naming his
    father, mother, and descent from earlier emperors. It recounts the marriage arrangement
    between his father and Furuhime, Wohodo's birth, his father's early death, Furuhime's
    return to her parents to raise him, his adult virtues, and the childless death
    of Emperor Wohatsuse leaving no successor.
