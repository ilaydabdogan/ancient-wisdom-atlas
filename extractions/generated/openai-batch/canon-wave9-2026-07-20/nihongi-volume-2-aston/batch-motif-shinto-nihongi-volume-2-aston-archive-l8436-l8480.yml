canonical_text:
  quote: ''
  summary: The passage describes negotiations and military preparations concerning
    Imna, Silla, Pekché, and Japan. Imna is described as a dependency of the Empress
    and an inner Miyake of Japan. Envoys and tribute-bearers are sent, Japanese generals
    are appointed, a large army invades Silla, and a naval force alarms foreign envoys.
    The Japanese envoys conclude that the war has violated the previous agreement,
    leave by sea, and return to Japan.
