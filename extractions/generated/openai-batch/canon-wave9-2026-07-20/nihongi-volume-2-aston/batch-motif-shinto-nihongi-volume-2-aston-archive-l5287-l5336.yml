- id: obs:1
  text: Silla sent envoys to offer tribute in unusually large quantity, including
    tribute for four named townships.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: By command, diviners divined a site for the dwellings of Prince Amabe and
    Prince Itowi; the result was propitious, and a palace was built at Wosada and
    called the Palace of Sakidama.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Empress Consort Hirohime died in the winter eleventh month.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Functionaries petitioned for an Empress Consort to be appointed, and by the
    Emperor’s command Toyomike Kashikiya hime no Mikoto was appointed Empress Consort.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The appointed Empress Consort is said to have borne two sons and five daughters;
    the passage lists the children and several marriages.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: By Imperial command, a Sun-worship Be and a private Be were established.
  category: action
  evidence_refs:
