  quote: ''
  summary: Chronicle entry records Silla tribute, propitious divination for royal
    dwellings and construction of a palace, the death and replacement of an Empress
    Consort, a dynastic list of children and marriages, establishment of a Sun-worship
    Be and a private Be, and dispatch of officials to govern Pékché with an explanatory
    note comparing Crown representatives to envoys.
  language: English
  quote_policy: summarized
