  quote: ''
  summary: Chronicle entries report diplomatic arrivals, a banquet for a Pékché guest,
    the return of a Koryo Buddhist priest, fruiting peach and plum trees, migration
    from Yaku, tribute from Silla of a Buddha image, an unusually large gourd in Idzumo,
    good crops of five grains, and Koryo envoys reporting victory over a Sui invasion
    and presenting captives, instruments, weapons, and a camel.
