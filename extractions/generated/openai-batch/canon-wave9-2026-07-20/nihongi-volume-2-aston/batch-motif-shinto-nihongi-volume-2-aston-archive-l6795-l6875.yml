canonical_text:
  quote: ''
  summary: Chronicle entries report the completion of Hokoji Temple and residence
    of priests; tribute and diplomatic missions involving Pékché, Silla, and Koshi;
    presentation and nesting of magpies; animal tributes including a peacock, white
    deer, camel, sheep, and white pheasant; an earthquake followed by orders to sacrifice
    to the God of Earthquakes; and a military expedition on behalf of Imna against
    Silla, ending with fortress captures and the King of Silla's submission under
    a white flag.
  language: English
  quote_policy: summarized
