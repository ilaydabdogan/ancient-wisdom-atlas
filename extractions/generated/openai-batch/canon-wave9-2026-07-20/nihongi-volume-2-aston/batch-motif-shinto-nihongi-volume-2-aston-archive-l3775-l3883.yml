canonical_text:
  quote: he discovered a log of camphor-wood shining brightly as it floated on the
    surface
  summary: The passage reports Buddhist chants and bright radiance coming from the
    sea at Chinu. The Emperor sends Unate no Atahe to investigate, and Unate finds
    a shining camphor-wood log floating on the sea. The log is presented to the Emperor,
    who has it made into two Buddha images identified with radiant images in the Temple
    of Yoshino. The passage also records missions and exchanges between Japan and
    Pékché, requests for troops, exchange of specialists and books, an appointment
    over shipping-tax, and a Pékché memorial warning of Silla and Koma plans and requesting
    military aid.
  language: English
  quote_policy: quoted
