canonical_text:
  quote: let the complainant strike the bell
  summary: The imperial speaker cites ancient rulers as precedents, explains a system
    of a bell, petition box, and petition receivers for grievances and remonstrances,
    and describes an upright subject's memorial protesting forced labour imposed on
    people coming to the capital. The speaker expresses sympathy, says the situation
    arose after the capital was moved, and states that the memorial was welcomed and
    acted upon.
  language: English
  quote_policy: quoted
