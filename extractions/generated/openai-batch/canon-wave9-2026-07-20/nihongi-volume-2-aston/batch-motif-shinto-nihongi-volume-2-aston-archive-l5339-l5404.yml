canonical_text:
  quote: ''
  summary: Annalistic entries report the arrival of Buddhist books, specialists, and
    images from Pékché and Silla; an appointment of Imperial Princess Uji to the shrine
    of Ise that is cancelled after an intrigue; and a frontier crisis in which Yemishi
    chiefs are summoned, threatened according to imperial precedent, and swear an
    oath after rinsing their mouths in the Hatsuse river while facing Mount Mimoro.
  language: English
  quote_policy: summarized
