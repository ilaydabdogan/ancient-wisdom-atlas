canonical_text:
  quote: ''
  summary: A poem describes bamboo floating down the Hatsuse River, being made into
    a lute and flute, and a speaker imagining performing music from the top of Mimoro
    so that fishes and all men would lament. The passage then records a winter court
    audience involving named representatives from Pekché, Silla, Ara, and Pan-phi,
    followed by an Imperial order giving I-mun and Teé-sa to Pekché. Translator notes
    explain the poem as an expression of sadness at parting accompanied by music.
  language: English
