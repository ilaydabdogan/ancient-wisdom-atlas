canonical_text:
  quote: ''
  summary: Chronicle entries for A.D. 650 report diplomatic exchanges with Silla,
    New Year court ceremonies, and the presentation of a white pheasant caught on
    Mount Wonoyama. Court advisers, Lords of Pékché, and Buddhist priests interpret
    the pheasant through Chinese and Buddhist precedents involving rare animals and
    birds as auspicious omens of sage rule; a general amnesty is recommended, and
    the pheasant is released in the garden.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two Japanese envoys were sent to Silla, and the Queen of Silla later sent
    Kim Ta-sya as a hostage with an accompanying suite.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Emperor went by imperial chariot to the Palace of Ajifu to view New Year
    congratulations and returned the same day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shikofu, Kusakabe no Muraji, Governor of Anato, presented a white pheasant
    to the Emperor and reported that Nihe had caught it on Mount Wonoyama.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The court asked the Lords of Pékché and Buddhist priests about the significance
    of the white pheasant.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Priests cited rare white animals and unusual birds, including a white deer,
    white sparrow, and three-legged crow, as favorable omens.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Priest Bin said that white pheasants appear when a ruler's influence reaches
    the four quarters, rites and court usages are properly ordered, and the ruler
    is frugal, sage, and humane.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A cited Chou precedent describes the Yüeh-shang family presenting a white
    pheasant after old men judged that the Central Land must have a sage because there
    had been no exceptional storms, long rains, or flooding for three years.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the interpretations and recommendations, the white pheasant was let
    loose in the garden.
  category: action
  evidence_refs:
  - ev:8
