canonical_text:
  quote: ''
  summary: The passage recounts an escort mission involving Koryo men/envoys. Ships
    are exchanged as a precaution against treachery, but the escort envoy Naniha throws
    two Koryo men into the sea. He later reports that sea whalefish prevented the
    voyage, a statement the Emperor judges false. Koryo envoys later arrive to ask
    why their envoys have not returned, and the Emperor condemns Naniha for deceiving
    the court and drowning envoys of a neighboring state. A final notice says Soga
    no Mumako is sent to Kibi to extend Shirawi.
  language: English
  quote_policy: summarized
