canonical_text:
  quote: "“My children, in their capacity of Deities, shall rule it.”"
  summary: Chronicle entries report diplomatic missions, tribute, palace occupation,
    rats migrating eastward, court archery, and an imperial edict. The edict grounds
    monarchy in the Sun-Goddess’s entrustment of rule to her descendants, condemns
    unauthorized use of divine and imperial names, and presents the Emperor as a Celestial
    Divinity who must regulate the state. The passage also records the building of
    Wogohori Palace and ceremonial rules for court attendance.
  language: English
  quote_policy: quoted
