canonical_text:
  quote: ''
  summary: The passage records the Emperor consulting ministers about establishing
    Imna, appointing generals and envoys, reacting to a cut-throated wild boar with
    a threat against those he dislikes, and being assassinated after Soga no Mimako
    no Sukune conspires against him. It also notes construction at the great H6k6ji
    Temple, burial of the Emperor at Kurahashi, and variant reports about Koma and
    the imperial concubine Ohotomo no Koteko.
  language: English
  quote_policy: summarized
