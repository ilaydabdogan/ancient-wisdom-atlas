canonical_text:
  quote: ''
  summary: An annalistic court passage records lunar and terrestrial phenomena, imperial
    illness and recovery after ordaining priests, tribute and diplomatic hospitality,
    offerings and shrine worship, law reform, appointment of Imperial Prince Kusakabe
    as Prince Imperial, commissioning of a chronicle of emperors and antiquity, sumptuary
    regulation, ancestor worship, rain prayer, earthquakes, and the sighting of a
    red sparrow.
  language: English
  quote_policy: summarized
