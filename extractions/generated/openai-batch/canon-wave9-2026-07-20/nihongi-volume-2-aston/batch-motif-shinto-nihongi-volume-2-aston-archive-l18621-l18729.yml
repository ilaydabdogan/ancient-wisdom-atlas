literal_observations:
- id: obs:1
  text: The Governor of Shimotsuke reported a bad year in which peasants were starving
    and wished to sell their children; the Court refused permission.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Emperor forbade cutting grass or firewood on Mount Minabuchi and Mount
    Hosokaha, and also forbade indiscriminate burning and cutting on protected mountains
    and plains in the Home provinces.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During a great summer drought, messengers were sent to make cloth offerings
    and pray to the gods of Heaven and Earth; priests and nuns supplicated the Three
    Precious Things, but no rain came, grain failed, and peasants starved.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Worship was paid to the Wind-Gods of Tatsuta and to the Oho-imi Deity of Hirose.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A star appeared in the east, was described as seven or eight feet long, and
    disappeared in the ninth month.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Emperor commanded that a Great Purification be held in all quarters and
    specified ritual articles to be supplied by provincial and district authorities
    and by each house.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The note describes the Oho-barahi as a solemn Shinto purification ceremony
