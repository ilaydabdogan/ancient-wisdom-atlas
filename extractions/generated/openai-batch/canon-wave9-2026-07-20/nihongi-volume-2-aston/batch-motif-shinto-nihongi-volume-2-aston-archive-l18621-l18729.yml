  quote: ''
  summary: The chronicle passage records famine reports, imperial restrictions on
    cutting and burning in protected mountain and plain areas, deaths and rewards
    of officials, a severe summer drought, ritual offerings and prayers to gods and
    Buddhist objects of reverence, worship of named deities, a long eastern star,
    grants of rank and fiefs, a command for a Great Purification throughout the provinces,
    and a following decree of penal mitigation and pardon.
  language: English
