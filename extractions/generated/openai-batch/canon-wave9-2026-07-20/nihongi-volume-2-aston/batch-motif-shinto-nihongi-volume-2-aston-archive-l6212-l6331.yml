canonical_text:
  quote: ''
  summary: The passage describes nuns requesting permission to go to Pékché for instruction
    in Buddhist discipline, followed by Soga no Mumako and allied imperial princes
    and ministers attacking Mononobe no Moriya. Moriya resists from a fort and from
    an elm tree. Imperial Prince Mumayado and Soga make vows to the Four Heavenly
    Kings and the Great Spirit King, promising temples and propagation of Buddhist
    teachings if victory is granted. The attack is renewed, Moriya and his children
    are killed, his troops disperse, and later reports attribute the killing partly
    to advice from Soga's wife, who was Moriya's younger sister.
  language: English
  quote_policy: summarized
