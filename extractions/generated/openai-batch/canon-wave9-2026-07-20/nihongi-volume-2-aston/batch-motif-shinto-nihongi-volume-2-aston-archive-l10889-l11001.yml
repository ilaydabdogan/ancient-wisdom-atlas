canonical_text:
  quote: ''
  summary: The Empress grants the Imperial Seal and resigns the imperial dignity to
    Prince Karu. Karu repeatedly declines in favor of Furubito no Ohoye, who also
    refuses, disarms, and takes Buddhist monastic signs at Hokoji. Karu then ascends
    the throne. Court attendants, officials, ministers, and learned appointees receive
    positions and honors. Later the Emperor, Empress Dowager, and Prince Imperial
    gather ministers under a great tsuki tree and swear an oath before the Gods of
    Heaven and Earth concerning imperial rule and lord-vassal loyalty.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Empress grants the Imperial Seal and resigns the imperial dignity to Imperial
    Prince Karu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Imperial Prince Karu repeatedly refuses and argues that Furubito no Ohoye
    should take the Celestial Dignity because he is the former Emperor's mature offspring.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Furubito no Ohoye refuses, saying he wants to renounce the world, go to Yoshino,
    practice the Law of Buddha, and support the Emperor.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Furubito no Ohoye ungirds and throws down his sword, orders his household
    to ungird their swords, goes to Hokoji, shaves his beard and hair, and puts on
    the kesa.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After Furubito's refusal, Imperial Prince Karu ascends the throne and assumes
    the Dignity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Two named attendants wearing golden quivers stand on the right and left of
    the throne while functionaries range themselves and make obeisance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Empress Toyo-takara receives the title Ko-so-bo, Naka no Ohoye is made
    Prince Imperial, and Abe no Uchimaro and Soga no Kurayamada Ishikaha no Maro receive
    high ministerial offices.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nakatomi no Kamako receives a great brocade cap of honour, the office of Naijin,
    increased revenue, and is described as loyally exercising counsel over advancements,
    dismissals, and policy choices.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Min Hoshi and Kuromaro Takamuko no Fubito are made national doctors, and golden
    tablets, or according to one book refined gold, are granted to two Oho-omi.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the nineteenth day, the Emperor, Empress Dowager, and Prince Imperial summon
    ministers under a great tsuki tree and make an oath appealing to the Gods of Heaven
    and Earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The oath says that Heaven covers and Earth upbears them, that the imperial
    way is one, that traitors have been put to death, and that lord and vassal should
    avoid double methods and duplicity.
  category: speech
  evidence_refs:
  - ev:7
