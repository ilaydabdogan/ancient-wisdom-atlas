canonical_text:
  quote: ''
  summary: During the conflict involving Prince Yamashiro no Ohoye, defenders fight
    off troops, the prince uses horse bones to make enemies think he is dead, escapes
    with family and companions to Mount Ikoma, refuses a plan to raise troops because
    it would burden the people, returns to the Temple of Ikaruga, surrenders himself,
    and dies by simultaneous strangulation with his family and consorts. Afterward
    coloured banners and umbrellas with music appear in the sky over the temple, then
    become a black cloud when Iruka is told of them. The passage also gives an explanation
    of an earlier poem as alluding to the burning of Kamutsumiya and the prince’s
    mountain concealment, then briefly records honey-bees kept on Mount Miwa and the
    appointment and refusal of Nakatomi no Kamako as chief of Shinto religion.
  language: English
  quote_policy: summarized
