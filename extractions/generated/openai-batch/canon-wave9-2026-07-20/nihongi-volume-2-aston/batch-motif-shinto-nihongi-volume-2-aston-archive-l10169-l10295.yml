candidate_motifs:
- id: motif:1
  label: deceptive substitute remains enable escape
  taxonomy_refs: []
  basis: Horse bones are placed in the sleeping chamber; attackers later find bones
    among ashes, conclude the prince is dead, and withdraw, allowing concealment on
    the mountain.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents this as a historical stratagem rather than an explicitly
    supernatural motif.
- id: motif:2
  label: royal self-sacrifice to spare the people
  taxonomy_refs:
  - sacrifice
  - royal_legitimacy
  basis: The prince refuses to raise troops because he does not want to burden or
    destroy the people for one person, and says one may be a hero by making firm the
    country at the expense of one’s own life.
  evidence_refs:
  - ev:6
  - ev:9
  - ev:10
  confidence: medium
  cautions: The taxonomy link to royal legitimacy is inferential from the prince’s
    status and stated concern for country; the passage does not explicitly formulate
    a legitimacy doctrine.
- id: motif:3
  label: mountain refuge during political danger
  taxonomy_refs: []
  basis: The prince escapes to Mount Ikoma, remains there with companions for several
    days, and is searched for there by forces sent by Iruka.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:7
  confidence: high
  cautions: The mountain is a place of concealment and hardship; no explicit initiation
    or ascent pattern is stated.
- id: motif:4
  label: omens or celestial signs after royal death
  taxonomy_refs: []
  basis: After the prince and family die, five-coloured banners and umbrellas shine
    in the sky, descend over the temple with music, and then become a black cloud
    before Iruka can see them.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage does not state the cause or divine meaning of the signs; any
    interpretation as judgment or apotheosis would require external evidence.
- id: motif:5
  label: hostile ruler unable to perceive auspicious signs
  taxonomy_refs: []
  basis: Observers see and admire the banners and umbrellas, but when they are pointed
    out to Iruka they change into a black cloud, preventing him from seeing them.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage gives the event but does not explain whether the loss of visibility
    is moral, political, or supernatural judgment.
- id: motif:6
  label: poetic images decoded as political allegory
  taxonomy_refs: []
  basis: The people of the day explain images in an earlier poem as referring to Kamutsumiya,
    Iruka, burning, the prince’s grey hair, and his mountain concealment.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: This is an internal exegesis of a poem, not a cross-cultural comparison.
- id: motif:7
  label: failure of introduced bees to multiply on sacred mountain
  taxonomy_refs: []
  basis: Yo Phung-chyang sets four hives of honey-bees on Mount Miwa, but they do
    not multiply their kind.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The passage does not explain the meaning of the failed multiplication
    or connect it to a broader omen pattern.
