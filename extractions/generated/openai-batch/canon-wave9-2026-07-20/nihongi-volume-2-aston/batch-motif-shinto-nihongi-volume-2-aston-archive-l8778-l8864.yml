canonical_text:
  quote: ''
  summary: After the Empress's death, ministers debate the imperial succession. Some
    interpret her dying commands as favoring Imperial Prince Tamura, while others
    support Prince Yamashiro no Ohoye. The Oho-omi withdraws when the ministers are
    divided. Yamashiro, living at the Palace of Ikaruga, sends a secret message asking
    the grounds for Tamura's proposed succession, and the Oho-omi sends officials
    to explain that he has only reported the Empress's commands and the ministers'
    response.
  language: English
  quote_policy: summarized
