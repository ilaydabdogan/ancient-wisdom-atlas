    named women and their imperial children, notes a tribute mission from Pékché and
    its departure, and records an imperial hunt or excursion at the Moor of Kamafu
    attended by the Prince Imperial, princes, and ministers. Footnotes qualify the
    status of Pékché and the meaning of “hunting.”
