canonical_text:
  quote: ''
  summary: The passage records court worship to the Gods of Heaven and Earth; diplomatic
    dispatch, return, and reception of envoys between Wa/Japan and Great Thang; construction
    of ponds, a canal, and miyake; Imoko's report that a Thang imperial letter was
    taken from him in Paekche and his subsequent pardon; and a court audience where
    Thang presents and a letter asserting Heaven-commanded rulership, tribute, and
    gifts are presented.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Prince Imperial, the Oho-omi, and all functionaries worshiped the Gods
    of Heaven and Earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Imoko Wono no Omi was sent to the Land of Great Thang, and Kuratsukuri no
    Fukuri was appointed as his interpreter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Several ponds were constructed in Yamato, a large canal was dug in Yamashiro,
    ponds were made in Kahachi, and miyake were erected in all provinces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Imoko returned from Great Thang, and P'ei Shih-ch'ing arrived from Great Thang
    with a suite of twelve persons.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Thang guests anchored at Naniha, were met by thirty decorated boats, lodged
    in a new official residence, and assigned official entertainers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Imoko told the Empress that the Thang Emperor had given him a letter, but
    that men of Paekche searched him and took it while he passed through Paekche.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Ministers said that an envoy should not lose his message even if he loses
    his life, and they condemned Imoko to banishment.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Empress ordered that Imoko not be punished, because the guest of the Great
    Country might hear of it; Imoko was pardoned and left unpunished.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Thang guests entered the capital and were met on the highway by seventy-five
    caparisoned horses and a message of welcome.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: At court, Thang presents were placed in the courtyard; P'ei Shih-ch'ing held
    the letter, made obeisance twice, and declared the purpose of his mission.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The letter says that the Emperor had received the precious command of Heaven
    and ruled over the universe, desiring to diffuse civilizing influence to all living
    things.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The letter addresses the Sovereign of Wa as dwelling beyond the sea, notes
    tribute sent from afar, and states that products are being transmitted.
  category: speech
  evidence_refs:
  - ev:11
