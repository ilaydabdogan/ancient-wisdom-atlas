canonical_text:
  quote: ''
  summary: A chronicle passage reports that Kahabe no Omi, ordered to build ships,
    seeks timber in Aki and cuts a tree identified as a thunder-tree despite warning.
    After offerings are made, storm and thunder occur; Kahabe confronts the Thunder-god,
    who cannot harm him, changes into a small fish, and is burned, after which ships
    are completed. The passage then gives brief notices of human-shaped or child-like
    unknown aquatic beings, castaways from Yaku, and alterations to the Misasagi of
    Hinokuma.
  language: English
  quote_policy: summarized
