  summary: Chronicle entries record tax and labour relief, the Empress’s journeys
    to and from Yoshino, rank and land grants, an eclipse, pardons, prayers to deities,
    a prince’s death, official rewards and fiefs, an order to expound a Buddhist sutra
    and ordain pure persons annually, gifts to vulnerable people, entertainments,
    and the appointment of a tutor for the heir.
