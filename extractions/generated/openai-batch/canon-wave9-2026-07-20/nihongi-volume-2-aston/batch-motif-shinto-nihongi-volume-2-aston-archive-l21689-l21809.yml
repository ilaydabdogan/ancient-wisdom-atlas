- id: obs:1
  text: Food offerings were made at the Palace of temporary interment, and fine boiled
    rice was specified as the offering on that day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aged men and women of the capital drew near and made lamentation west of the
    bridge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Empress sent officials to invite 300 Buddhist dignitaries to the Temple
