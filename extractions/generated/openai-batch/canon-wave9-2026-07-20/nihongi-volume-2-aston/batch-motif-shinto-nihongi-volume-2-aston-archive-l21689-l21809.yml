  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Vegetable or maigre food observances were held in the temples of the capital
    and at the Palace of temporary interment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After being informed of the Emperor's death, the Silla envoys put on mourning,
    faced east, made obeisance three times, and raised lamentation three times.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Prince Imperial, court and provincial officials, local chiefs, and common
    people began construction of the Oho-uchi Misasagi.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the following year, the Prince Imperial and officials went to the Palace
    of temporary interment and lamented; priests also lamented there, and a public
    congregation was held at the Temple of Yakushi.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Emperor's death was formally announced to Kim Sang-nim and his colleagues,
    who then lamented three times.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Tribute and presents from Silla included precious metals, textiles, skins,
