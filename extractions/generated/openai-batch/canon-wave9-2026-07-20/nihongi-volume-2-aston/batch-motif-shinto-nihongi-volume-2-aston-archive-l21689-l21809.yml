  summary: Chronicle entries record offerings and lamentations at the Palace of temporary
    interment, Buddhist and vegetarian observances, Silla envoys' mourning and tribute,
    construction of the Oho-uchi Misasagi, and a decree requiring abstinence on national
    mourning days.
  language: English
