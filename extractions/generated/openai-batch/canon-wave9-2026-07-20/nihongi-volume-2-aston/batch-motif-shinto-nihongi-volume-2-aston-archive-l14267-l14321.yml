canonical_text:
  quote: ''
  summary: In the seventh month, more than two hundred Yemishi come to Court with
    presents for the Empress and receive unusually liberal entertainment and largess.
    Various Yemishi and frontier officials receive court ranks and gifts including
    cuttle-fish flags, drums, bows and arrows, and armour. Saniguna is ordered to
    investigate Yemishi and captive populations. In the same month, Buddhist priests
    go by the Empress’s command to Great Thang on a Silla ship and receive instruction
    from Hsiian-ts‘ang.
  language: English
  quote_policy: summarized
