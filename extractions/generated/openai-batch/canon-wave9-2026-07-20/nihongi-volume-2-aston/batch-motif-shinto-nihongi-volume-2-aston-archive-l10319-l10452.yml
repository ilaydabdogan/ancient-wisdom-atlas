canonical_text:
  quote: ''
  summary: 'The passage recounts how Naka no Ohoye and Nakatomi no Kamako became trusted
    friends after a courteous shoe-return during a ball game, studied Chinese doctrines
    together as cover for secret planning, and pursued a political marriage alliance
    with Soga no Kurayamada no Maro''s family. It then records several unusual reports:
    a stolen intended bride and substitute younger daughter, recommendations of supporters,
    an owl giving birth, purple long-life mushrooms found in snow on Mount Uda, an
    eight-foot lily presented to the Empress, a singing monkey on Mount Miwa interpreted
    as a later portent, and a two-flowered lotus interpreted by Toyora no Oho-omi
    as a sign of Soga prosperity.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During a ball game at the foot of the keyaki tree of Hokoji, Naka no Ohoye's
    shoe fell off; Nakatomi no Kamako placed it on his palm, knelt, and offered it,
    and Naka no Ohoye knelt to receive it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the shoe-return episode, Naka no Ohoye and Nakatomi no Kamako became
    mutual friends and shared their thoughts without concealment.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: To avoid suspicion from frequent meetings, the two held yellow rolls and studied
    the doctrines of Chow and Confucius with the learned teacher of Minabuchi, while
    secretly preparing plans on their journeys.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nakatomi no Kamako advised Naka no Ohoye to take the eldest daughter of Soga
    no Kurayamada no Maro as consort in order to gain support for their projects.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nakatomi no Kamako acted as go-between and brought the marriage negotiations
    to a successful result.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the appointed night for the eldest daughter's marriage, she was stolen
    away by a relation named Musa no Omi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Soga no Kurayamada no Maro was grieved and alarmed after the eldest daughter
    was stolen.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The younger daughter asked the cause of her father's distress, offered herself
    in place of the eldest daughter, and then served the Prince sincerely.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Nakatomi no Kamako recommended Komaro, Saheki no Muraji, and Amida, Katsuraki
    no Waka-inu-kahi no Muraji, to Naka no Ohoye.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: An owl brought forth young in the Miyake of Ohotsu belonging to Toyora no
    Oho-omi.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Oshizaka no Atahe and a boy found purple mushrooms growing out of snow on
    Mount Uda, boiled and ate them, and later were free from disease and lived long.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The purple mushrooms were gone when Oshizaka no Atahe and the boy returned
