canonical_text:
  quote: At this moment there is no successor whatever to the throne.
  summary: In a succession crisis, Ohotomo no Kanamura first proposes Prince Yamato-hiko,
    but the prince flees when he sees troops sent to meet him. Kanamura then proposes
    Prince Wohodo, whom other nobles approve as the worthy successor. Envoys go to
    Mikuni with rank emblems and a state palanquin; Wohodo remains calm amid the troops
    and receives the offer of imperial authority, though doubts remain in his mind.
  language: English
  quote_policy: quoted
