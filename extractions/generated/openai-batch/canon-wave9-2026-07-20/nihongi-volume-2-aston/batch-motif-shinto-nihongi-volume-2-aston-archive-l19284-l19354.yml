canonical_text:
  quote: ''
  summary: Chronicle entries describe imperial regulations for priests and nuns, tribute
    and presents from Silla, an imperial decree about housing aged and sick temple
    residents, an earthquake, envoys to Tanegashima, construction of barriers and
    fortifications, royal gifts and amnesty in response to auspicious grain, tribute
    of a long-life herb and auspicious rice, and a palace banquet with a surname grant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Emperor made regulations concerning the style of priests and nuns, the
    colours of priestly garb, and the character of their attendants and horses when
    passing through the streets.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Silla sent two named envoys with tribute that included metals, three-footed
    sacrificial cauldrons, textiles, hides, horses, dogs, mules, and camels.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Separate presents of gold, silver, swords, flags, and similar items were sent
    for the Emperor, Empress-consort, and Prince Imperial.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Emperor decreed that priests and nuns normally reside in temples and observe
    the Three Precious Things, but aged or diseased persons confined in narrow chambers
    can make places that should be pure impure.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The decree instructed such aged or sick persons to ask relations or friends
    to build one or two dwellings in vacant spaces, where the aged could be nourished
    and the sick could take medicine.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: An earthquake occurred on the 14th day of the 11th month.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tsura was sent to Tanegashima as Chief Envoy and Ko-kan as Junior Envoy, and
    one grade of rank was bestowed on them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Barriers were constructed for the first time on Mount Tatsuta and Mount Ohosaka,
    and Naniha built an outer line of fortifications.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Because of auspicious stalks of grain, presents were made to ranked elites
    and public functionaries, and an amnesty was declared for offences from capital
    crimes downwards.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The district of Ito sent tribute of the herb of long life, described as mushroom-like,
    with a one-foot stem and a crown two spans in circumference.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The province of Inaba sent tribute of auspicious rice, each stem of which
    had branches.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Emperor occupied the Little Opposite Palace, gave a banquet to Princes
    and Ministers in the Court of the Great Hall, and granted a surname to Kobito,
    Imbe no Obito; the provided passage ends during this entry.
  category: action
  evidence_refs:
  - ev:10
