  quote: ''
  summary: The passage recounts the abandonment of a rebel cause, the burning and
    rescue of historical records before executions, permission for burial and lamentation,
    interpretations of popular songs as omens of court violence, abdication in favor
    of Imperial Prince Karu, and counsel about succession based on kinship seniority
    and public expectation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kunioshi addressed the Aya no Atahe, saying that those involved faced capital
    punishment or swift execution and questioning why they should continue fighting.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kunioshi removed his sword, threw away his bow, and deserted the cause.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The rebel troops followed Kunioshi's example, dispersed, and fled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Yemishi, Soga no Omi, and his people, when about to be executed, burned the
    History of the Emperors, the History of the Country, and valuable objects.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Yesaka Funa no Fubito seized the burning History of the Country and delivered
    it to Naka no Ohoye.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Permission was given for the interment of the bodies of Yemishi, Soga no Omi,
    and Kuratsukuri, and lamentation for them was allowed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The first popular song was explained as prefiguring palaces built together
    at Shima no Oho-omi's house and the secret conspiracy of Naka no Ohoye and Nakatomi
    Kamako to kill Iruka.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The second popular song was explained as ominous of gentle and innocent Kamutsumiya
    Princes being harmed by Iruka and of Heaven bringing about Iruka's death by the
    hands of others.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The third popular song was explained as ominous of Iruka no Omi being suddenly
    slain in the Palace by Komaro and Amida.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Dignity was abdicated in favor of Imperial Prince Karu, and Naka no Ohoye
    was made Prince Imperial.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Emperor Ame-yorodzu toyo-hi is described as honoring the religion of Buddha
    and despising the Way of the Gods, with the cutting down of shrine trees given
    as an instance.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The same emperor is described as gentle, fond of learned men, impartial toward
    noble and mean, and continually issuing beneficent edicts.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Empress wished to transfer the Dignity to Naka no Ohoye, and Naka no Ohoye
    informed Nakatomi Kamako.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Nakatomi Kamako advised that Furubito no Ohoye was Naka no Ohoye's elder brother
    and Imperial Prince Karu his maternal uncle, and that raising Karu would avoid
    impropriety.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Naka no Ohoye was pleased with Kamako's advice and reported it privately to
    the Empress.
  category: action
  evidence_refs:
  - ev:10
