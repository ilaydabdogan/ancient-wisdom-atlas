- id: motif:3
  label: Royal succession legitimized by abdication and kinship hierarchy
  taxonomy_refs:
  - royal_legitimacy
  basis: The Dignity is abdicated in favor of Karu, and Kamako advises Naka no Ohoye
    to avoid transgressing respect for an elder brother and to raise his maternal
    uncle to the throne.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage gives a court-political rationale; broader ritual or mythic
