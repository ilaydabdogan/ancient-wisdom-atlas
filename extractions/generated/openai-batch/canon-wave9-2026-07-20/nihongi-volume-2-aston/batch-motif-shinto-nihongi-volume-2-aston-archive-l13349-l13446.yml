canonical_text:
  quote: ''
  summary: At a New Year reception, officials carry a white pheasant in a litter before
    the throne; the Emperor and Prince Imperial inspect it. A congratulatory address
    interprets the white pheasant as a sign of long peaceful imperial rule. The Emperor
    describes such signs as Heaven’s response to virtuous rulers, cites earlier Chinese
    and Japanese precedents, urges reverence for the Gods of Heaven and Earth, proclaims
    an amnesty, begins the Haku-chi year-period, prohibits falcon-flying in Anato,
    and gives rank-based presents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During a New Year reception, officials and named court participants formed
    ceremonial lines and carried the pheasant’s litter into the Central Court and
    before the Imperial throne.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Emperor called the Prince Imperial, and the two examined the pheasant
    together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After retiring and making repeated obeisances, the Prince Imperial caused
    Oho-omi Kose to deliver a congratulatory address on behalf of ministers and functionaries.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The congratulatory address says a white pheasant from the western region is
    a sign that the Emperor will govern the Great-eight-islands peacefully for a thousand
    autumns and ten thousand years.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Emperor says that when a sage ruler appears and governs the Empire, Heaven
    responds by manifesting favorable omens.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Emperor cites earlier instances involving white pheasants in Chinese dynasties,
    a white crow in the reign of Emperor Homuda, and a Dragon-horse in the reign of
    Emperor Oho-sazaki.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Emperor states that responsive birds, beasts, herbs, trees, and similar
    things are favorable omens and auspicious signs produced by Heaven and Earth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Emperor attributes the good fortune to loyal assistants and orders ministers
    and functionaries to reverence the Gods of Heaven and Earth with pure hearts.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Emperor says the provinces and districts were placed in his charge by
    Heaven and that the auspicious omen appeared in Anato.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Emperor proclaims a general amnesty, begins a new year-period named Haku-chi,
    and prohibits the flying of falcons within Anato.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Presents are made to ministers, Daibu, and lower-ranking officials down to
    clerks, with value varying by rank.
  category: action
  evidence_refs:
  - ev:6
