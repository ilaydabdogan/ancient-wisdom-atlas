  quote: ''
  summary: Chronicle entries for A.D. 690 record court observances for the Empress's
    accession, banquets and gifts, an amnesty and rank grants, relief for vulnerable
    and elderly people, assignments to judicial office, offerings and worship directed
    to deities, imperial visits, immigration and settlement of Silla people, and an
    edict classifying public service for rank purposes.
