canonical_text:
  quote: ''
  summary: Chronicle entries record imperial cap-rank regulations and amnesty, tribute
    and memorials from neighboring polities, conferral of ranks on Pékché officials
    and specialists, a popular ditty about oranges and a single string, presentation
    of a water-level and a very small person, first use of a clepsydra with bells
    and drums, report of an eight-legged deer that died, a palace banquet with dances,
    military measures connected with Pékché, a governorship appointment, and further
    tribute.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Prince Imperial, described as the Emperor’s younger brother, promulgated
    regulations for the cap-rank institution on the Emperor’s behalf, and a general
    amnesty was granted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A variant report says that the Imperial Prince Ohotomo announced the cap-rank
    regulations.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ranks were conferred on named Pékché officials and on more than fifty other
    Talsol; some named persons are described as having military training or knowledge
    of medicine, the classics, or Yin and Yang.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Koryo, Pékché, and Silla are each recorded as sending tribute, and a Chinese
    general for Pékché sent a memorial by messengers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A popular ditty compares oranges growing on their own branches with pearls
    strung together on the same string; the translator’s note explains the allusion
    as referring to Coreans receiving the same honours as Japanese.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Honjitsu, Kibumi no Miyakko, presented a water-level to the Emperor.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The province of Hitachi presented Nakatomibe no Wakako, whose height and birth
    year are given.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: A clepsydra was placed in a new pavilion, hours were struck, bells and drums
    sounded, and the text says the Emperor had first constructed this clepsydra when
    he was Prince Imperial.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Tsukushi reported that a deer was born with eight legs and died immediately.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Emperor occupied the Little Western Palace and was attended at a banquet
    by the Prince Imperial and all the Ministers, with rustic dances twice performed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: An announcement was made about military measures requested by messengers from
    three departments of Pékché, and Prince Kurikuma was made Governor of Tsukushi.
  category: action
  evidence_refs:
  - ev:10
