canonical_text:
  quote: ''
  summary: The passage recounts a funeral oration by Moriya, Mimako's mockery of him,
    and the beginning of hostility between the two ministers. Hayato are sent to protect
    the courtyard of a temporary tomb, and Prince Anahobe angrily protests service
    to a dead king while desiring the empire. The next book introduces Emperor Tachibana
    no Toyohi, his lineage, his reverence for both Buddhist and kami traditions, his
    accession, court appointments, and the appointment of Imperial Princess Nukade
    hime to serve the Shrine of Ise and the Sun-goddess.
  language: English
  quote_policy: summarized
