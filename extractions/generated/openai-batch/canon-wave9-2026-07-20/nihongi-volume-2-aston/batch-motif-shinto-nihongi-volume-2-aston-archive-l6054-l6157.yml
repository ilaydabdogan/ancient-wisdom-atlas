canonical_text:
  quote: "“Why should we reverence strange deities, and turn our backs upon the gods
    of our country?”"
  summary: In A.D. 587, a court dispute over reverencing foreign deities versus the
    gods of the country accompanies the introduction of a priest into the palace.
    Mononobe no Moriya withdraws and gathers men after being warned of plots against
    him. Nakatomi no Katsumi assists Moriya, performs an action with figures of royal
    princes glossed as witchcraft, and is killed by Ichihi. Ohotomo no Hirafu guards
    Soga no Mumako with weapons. As the Emperor’s sores worsen, Tasuna pledges to
    renounce the world and make a sixteen-foot Buddha image and a temple on the Emperor’s
    behalf. The Emperor dies and is buried.
  language: English
  quote_policy: quoted
