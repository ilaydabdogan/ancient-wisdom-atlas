canonical_text:
  quote: ''
  summary: Kena no Omi obstructs the return of the Imperial envoy Mitsugi no Kishi,
    which contributes to revolt and appeals for troops from Silla and Pékché. Fighting,
    siege, punishment of a messenger, and capture of fortified places follow. Mitsugi
    reports Kena no Omi’s misconduct to the Emperor, and Medzurako is sent to recall
    him. Kena no Omi dies at Tsushima on the way back; his funeral proceeds into Afumi
    and is marked by songs. The passage then records the Emperor’s illness and death.
  language: English
  quote_policy: summarized
