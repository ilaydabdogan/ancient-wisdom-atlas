canonical_text:
  quote: ''
  summary: Annalistic entries for A.D. 680 record court acknowledgments, archery at
    the South Gate, reported unusual fruiting trees, a drum-like sound in the east,
    an unusual horn found on Mount Katsuraki and offered to the Emperor, the return
    of Silla labourers with gifts, tribute of a white shitodo bird, an imperial journey
    to Aki in Uda, worship of the Deities of Hirose and Tatsuta, and a fire in the
    nuns' quarters of Tachibana Temple.
  language: English
  quote_policy: summarized
