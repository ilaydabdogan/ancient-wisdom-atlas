  quote: ''
  summary: The passage contains political and military counsel about Pékché, a plot
    by departing officials to have Illa killed, Illa’s flame-like bodily radiance,
    his murder after the radiance fades, his brief return to life to speak before
    dying, subsequent burial and punishment of the killers, reports of ships meeting
    storm or drifting, and the arrival and request of Buddhist images.
  language: English
  quote_policy: summarized
