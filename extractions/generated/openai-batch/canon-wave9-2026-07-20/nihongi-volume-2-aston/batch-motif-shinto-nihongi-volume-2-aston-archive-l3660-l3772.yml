canonical_text:
  quote: ''
  summary: The passage records a memorial from King Myong of Pekché praising Buddhist
    doctrine and sending it eastward to Japan through an envoy. The Emperor rejoices
    but consults ministers about whether to worship the Buddha image. Soga no Iname
    supports worship, while Mononobe no Okoshi and Nakatomi no Kamako warn that foreign
    deities may anger the national gods. The Emperor gives the image to Iname for
    experimental worship; Iname enshrines it and makes a temple. A pestilence follows,
    the opponents urge removal of the image, officials cast it into the Canal of Naniha
    and burn the temple, and a sudden fire consumes the palace Great Hall. A final
    historical note mentions Pekché abandoning cities and Silla occupying Han-syong.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A memorial praises the doctrine as excellent, difficult to explain and understand,
    able to create merit and retribution, and leading to highest wisdom.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The doctrine is said to have come from India to the three Han and to be sent
    by King Myong of Pekché to the Imperial Country through Nu-ri Sa-chhi, in fulfillment
    of a saying attributed to Buddha about his law spreading east.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Emperor hears the memorial, leaps for joy, says he cannot decide by himself,
    and asks ministers whether the Buddha image from the Western frontier State should
    be worshipped.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Soga no Iname argues that all the Western frontier lands worship the Buddha
    and asks why Akitsu Yamato alone should refuse.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mononobe no Okoshi and Nakatomi no Kamako argue that rulers have traditionally
    worshipped the gods of Heaven and Earth, Land and Grain, in all seasons, and warn
    that worshipping foreign deities may anger the national gods.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Emperor gives the Buddha image to Iname for experimental worship.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Iname receives the image joyfully, enthrones it in his house at Oharida, performs
    rites of retirement from the world, purifies his house at Muku-hara, and makes
    it a temple.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Afterward, a pestilence becomes rife in the land and people die prematurely,
    with conditions worsening and no remedy available.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: Okoshi and Kamako say the deaths happened because their earlier advice was
    not accepted and urge that the object be flung away.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Officials abandon the Buddha image to the current of the Canal of Naniha and
    burn the temple until nothing is left.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Immediately afterward, despite there being neither clouds nor wind, a sudden
    conflagration consumes the Great Hall of the Palace.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage also notes that Pekché abandoned Han-syong and Phyong-yang, and
    Silla entered and settled in Han-syong.
  category: other
  evidence_refs:
  - ev:9
