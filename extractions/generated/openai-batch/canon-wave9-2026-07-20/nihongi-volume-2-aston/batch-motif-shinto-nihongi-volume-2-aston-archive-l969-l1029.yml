canonical_text:
  quote: ''
  summary: In an A.D. 527 chronicle passage, the Emperor orders Ohomuraji Mononobe
    no Arakahi to chastise Ihawi for disobedience. Arakahi describes Ihawi as relying
    on rivers and mountains and stirring disorder, cites earlier loyal ministers and
    the help of Heaven, and accepts the task. The Emperor instructs him on the duties
    of a commander, commands him to execute Celestial punishment, hands him a battle-axe
    as authority, and assigns him control in the west. Later Arakahi personally commands
    battle against Ihawi in Miwi in Tsukushi, where the armies close with flags and
    drums and the dust mingles.
  language: English
  quote_policy: summarized
