canonical_text:
  quote: "“It is the law of Heaven that the Small should wait upon the Great.”"
  summary: Kena no Omi summons the kings of Silla and Pekché, but they send envoys
    rather than attend in person. Kena rebukes the envoys, invokes a hierarchy under
    Heaven, and refuses to deliver the Emperor’s commands. Silla later sends a chief
    minister with three thousand men, but Kena retreats to a castle and still withholds
    the message. Men under the minister’s command beg for food, and Mikari, a retainer
    of Kena, hides near a gate and strikes at them from afar.
  language: English
  quote_policy: quoted
