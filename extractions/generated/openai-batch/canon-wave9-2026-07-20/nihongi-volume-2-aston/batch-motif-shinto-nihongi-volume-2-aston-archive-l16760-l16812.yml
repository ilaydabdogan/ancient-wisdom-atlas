- id: obs:1
  text: A water buffalo and a copper pheasant were presented to the Emperor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Li Shou-chen of Thang, his companions, and the Pekche envoys departed together;
    Karu, Te-syang of Koryo, and his people also departed on a later date.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An entertainment was given to the Yemishi, and the Emperor took to his bed
    and was ill.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Silla sent the Sason Kim Manmol and others to bring tribute.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A ceremony of opening the eyes of 100 Buddhas took place inside the Palace;
    the note glosses this as corresponding to consecration.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Emperor sent messengers to offer valuable objects to the Buddha of Hokoji,
    including a kesa, a golden begging-bowl, ivory, aloes wood, and sandal wood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Emperor's illness became more grave, and he summoned the Prince Imperial
    into his chamber.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Emperor told the Prince Imperial that his condition was desperate and
    that what remained after belonged to the prince.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Prince Imperial repeatedly bowed, firmly declined to receive the succession,
    cited ill-health, requested that the Empress receive the mighty task, asked that
    Prince Ohotomo handle government measures, and requested permission to renounce
    the world and practice religion.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Emperor consented; the Heir to the Throne went south of the Buddhist Hall
    inside the Palace, sat on a chair, shaved off his hair, and became a priest.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Emperor sent the newly ordained prince a kesa through Sugita no Ikuiha.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Prince Imperial later requested leave to go to Yoshino and practice the
    religion of Buddha; the Emperor granted permission, and the prince went to Yoshino,
    escorted as far as Uji by the Oho-omi and others.
  category: sequence
  evidence_refs:
  - ev:10
