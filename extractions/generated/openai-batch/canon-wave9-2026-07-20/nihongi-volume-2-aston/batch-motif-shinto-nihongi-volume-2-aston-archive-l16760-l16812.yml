  quote: ''
  summary: The passage records diplomatic presentations, departures, entertainment
    of the Yemishi, tribute from Silla, Buddhist consecration and offerings, the Emperor's
    grave illness, a succession exchange with the Prince Imperial, the Prince Imperial's
    refusal of succession and renunciation of the world, his shaving of hair and becoming
    a priest, and his departure to Yoshino for Buddhist practice. The final entry
    in the supplied passage is incomplete.
  language: English
