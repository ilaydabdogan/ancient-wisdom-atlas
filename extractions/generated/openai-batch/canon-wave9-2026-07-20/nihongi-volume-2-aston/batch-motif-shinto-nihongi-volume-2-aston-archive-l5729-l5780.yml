canonical_text:
  quote: ''
  summary: The passage reports an imperial order to discontinue Buddhism after a claim
    that the nation was endangered by its practice. Mononobe no Yugehi no Moriya destroys
    Buddhist structures and an image, disposes of the remains in the Naniha canal,
    and on that day unusual wind and rain occur without clouds. He rebukes Buddhist
    adherents, summons nuns supported by Mumako no Sukune, and officials strip, imprison,
    and flog the nuns. The Emperor also appoints Prince Mimiko of Sakata as envoy
    for Imna.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A claim is reported that the nation is endangered by the establishment of
    Buddhist religious practice by Soga no Omi, and the Emperor commands that Buddhism
    be discontinued.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mononobe no Yugehi no Moriya no Ohomuraji goes to the Temple, sits on a chair,
    cuts down the pagoda, sets it on fire, and burns the image and Temple of Buddha.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The remains of the burned image of Buddha are flung into the Naniha canal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: On the same day, wind and rain occur without clouds, and the Ohomuraji wears
    a rain-coat.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Ohomuraji rebukes Mumako no Sukune and others who follow him in religious
    practice, causing them shame and contrition of heart.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Moriya sends Mimoro, also called Oruke, Saheki no Miyakko, to summon Zen-shin
    and other nuns supported by Mumako no Sukune; Mumako grieves but delivers the
    nuns.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Officials take away the nuns' three garments, imprison them, and flog them
    at the road-station of Tsubaki no ichi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Emperor appoints Prince Mimiko of Sakata as his envoy with the stated
