canonical_text:
  quote: ''
  summary: The passage records the slaying of Ihawi and subduing of frontier land;
    Kuzu offering the Granary of Kasuya to the Emperor to ransom his life; a request
    by the King of Pékché to use the Port of Tasa in Kara for tribute crossings; an
    objection by the King of Kara that prevents the transfer; and a note describing
    Ihawi’s tomb with stone human figures, shields, animals, halls, warehouses, and
    a kitchen tableau.
  language: English
  quote_policy: summarized
