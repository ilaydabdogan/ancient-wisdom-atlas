- id: obs:1
  text: Ihawi is reported as slain, after which the frontier land is subdued.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kuzu, Kimi of Tsukushi, fears involvement in his father’s execution and offers
    the Granary of Kasuya to the Emperor to ransom his life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The King of Pékché says tribute envoys avoid headlands, face winds and waves,
    and have their goods made wet, spoiled, and unsightly.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The King of Pékché asks that the Port of Tasa in Kara be made the crossing
    route for sending tribute, and Oshiyama applies to the Emperor accordingly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kasone, Kishi no Okina, and others are sent to make over the Port of Tasa
    to the King of Pékché.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The King of Kara objects that the port has been the passage for tribute since
    the establishment of the Japanese Government House and should not be granted to
    a neighboring country contrary to the original enfeoffment.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The imperial envoys are unable to make the grant of the port.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A cited Tsukushi Fudoki note describes Ihawi’s tomb mound, its plot, and sixty
    stone men with stone shields arrayed in battle order on all four sides.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The tomb description includes a separate place called the kitchen, with a
    standing stone man called the carver, a naked prostrate figure called the thief,
    four stone pigs called the plunder, three stone horses, three stone halls, and
    two stone warehouses.
  category: object
  evidence_refs:
  - ev:7
