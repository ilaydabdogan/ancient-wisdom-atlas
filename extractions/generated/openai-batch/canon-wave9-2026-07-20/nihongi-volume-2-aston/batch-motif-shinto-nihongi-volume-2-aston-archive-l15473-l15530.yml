canonical_text:
  quote: ''
  summary: Chronicle entries report a sound interpreted as an omen of the downfall
    of Kory6 and Pékché; imperial grants and cloth presentations to Pékché figures;
    invasion of Kory6 by Thang and Silla and military aid from the Japanese government;
    an animal prodigy divined by the Buddhist priest Tohy6n as political subordination;
    the escort of Phung-chhyang to Pékché by a fleet, his royal succession by imperial
    edict, honors for Pok-sin, tribute from Pékché, and counsel about Chyu-yu as an
    infertile defensive stronghold.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unspecified group said that a thin noise like a sounding arrow was an omen
    of the ultimate downfall of Kory6 and Pékché.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A grant was made to Kwisil Pok-sin, Minister of Pékché, consisting of arrows,
    silk, cloth, leather, and seed-rice in stated quantities.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Emperor presented 300 tan of cloth to the King of Pékché.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The men of Thang and Silla invaded Kory6; Kory6 asked aid from the Government,
