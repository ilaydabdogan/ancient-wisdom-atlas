  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: General-in-Chief Adzumi no Hirafu no Muraji and others commanded a fleet of
    170 ships and escorted Phung-chhyang and his people to Pékché, where an imperial
    edict made him take up the royal succession.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A golden tablet was conferred on Pok-sin; his back was stroked, he was praised,
    and an honorary grant was made to him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Phung-chhyang, his people, and Pok-sin received the imperial decree with their
