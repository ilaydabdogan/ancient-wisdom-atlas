  summary: Chronicle entries for Emperor Ankan record presentations of service groups
    and estates, a Musashi provincial office dispute resolved by the Court, an imperial
    decree of prosperity and a five-day revel, establishment of administrative groups
    and Miyake, a command to release cattle for future remembrance, and the Emperor's
    death and burial with the Empress and his younger sister.
