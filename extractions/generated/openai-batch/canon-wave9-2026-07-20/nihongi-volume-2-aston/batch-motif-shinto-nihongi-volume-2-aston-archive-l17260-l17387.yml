canonical_text:
  quote: ''
  summary: 'The passage recounts military and political events during a succession
    conflict: the Emperor receives reports of allies and troops, worships toward Amaterasu
    at a riverbank, sends commanders to mobilize armies, while the Afumi Court reacts
    in alarm. Envoys are sent to levy troops and punish suspected traitors; one provincial
    governor is deceived and slain, another refuses to move frontier troops and is
    protected by his armed sons. Couriers near Fuha are intercepted by ambushers,
    and other nobles choose whether to join the Emperor or attempt independent action.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fire is set to one building in order to warm shivering men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Warden of the Barrier of Suzuka sends a messenger to the Emperor about
    persons kept at the barrier who had come to offer allegiance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the morning of the 26th day, the Emperor worships toward the Goddess Amaterasu
    no Ohokami on the bank of the River Tohogaha in Asake district.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Masubito reports that the person at the barrier is the Imperial Prince Ohotsu,
    who has come to join the Emperor with followers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Woyori reports that three thousand Mino troops have blocked the Fuha road,
    and the Emperor commends his zeal.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Emperor sends the Imperial Prince Takechi to Fuha for military matters
    and sends other agents to mobilize provincial armies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Afumi Court hears that the Prince Imperial, the late Emperor's younger
    brother, has gone to the East Country; ministers are alarmed and the capital is
    disturbed.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Some people flee toward the East Country, while others withdraw to mountains
    and marshes to conceal themselves.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Imperial Prince Ohotomo asks the Ministers what measures should be taken,
    and one minister advises swift pursuit with choice cavalry.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Imperial Prince Ohotomo rejects the pursuit advice and instead sends envoys
    to several regions with orders to levy troops.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Ohotomo orders Wotoko and Ihate to kill Prince Kurikuma or Hiroshima if they
    show any sign of disobedience.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: In Kibi, Ihate presents a token of authority, deceives Hiroshima into ungirding
    his sword, then draws his own sword and kills him.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: In Tsukushi, Prince Kurikuma refuses to move troops, arguing that the province
    must remain defended against foreign raids from the sea.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Prince Kurikuma's two sons stand beside him with swords, and Wotoko abandons
    his attempt to attack because he fears being destroyed himself.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Near Fuha, Ihasuki lags behind because he suspects troops in the mountains;
    ambushed soldiers emerge and intercept Kusuri and the others.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: Ihasuki sees the interception, expects Kusuri and his companions to be captured,
    turns back, and barely escapes.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: Makuda and Wofukehi pretend illness and withdraw to their house in Yamato
    when they see the time is unfavourable.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: Makuda later follows the Emperor, while Wofukehi remains behind intending
    to establish fame and allay calamity with a small group.
  category: sequence
  evidence_refs:
  - ev:18
