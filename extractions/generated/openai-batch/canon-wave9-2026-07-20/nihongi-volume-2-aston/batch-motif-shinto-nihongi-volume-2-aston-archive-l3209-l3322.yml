canonical_text:
  quote: ''
  summary: The passage records diplomatic proposals concerning Imna; a report from
    Koshi about men of Su-shén arriving by boat at Sado and being regarded locally
    as nonhuman or devils; an omen in which roasted acorn shells become two flying,
    fighting men; a divination that devils will enchant the villagers, followed by
    plunder; a dread god of Segaha Bay whose water kills some drinkers; and Pékché's
    making of a sixteen-foot Buddha image with a merit prayer for the Emperor, accompanied
    by a note comparing this height with a Chinese account of a golden Buddha figure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker proposes that the Japanese Miyake officials, the Kanki of Imna,
    and himself send envoys with a joint message to the Emperor asking for instructions.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kibi no Omi and the Kanki accept the Great King's triple scheme and ask to
    consult other officials and kings before sending a joint message to the Emperor.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A report from Koshi says men of Su-shén arrived in a boat at Cape Minabe on
    Sado, stayed there, and lived by catching fish during spring and summer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Islanders said the men of Su-shén were not human beings, called them devils,
    and avoided approaching them.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: While villagers were roasting acorns under ashes, the shells turned into two
    men who hovered more than a foot over the fire and later fought one another.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the two transformed figures were placed in the courtyard, they flew as
    before and continued fighting.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A man divined from the event that the villagers would be enchanted by devils,
    and not long afterward they were plundered by them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The men of Su-shén moved to Segaha Bay, where the local god is described as
    dreadful; no one dares approach, and half of those who drink the bay's water when
    thirsty die.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Pékché made a sixteen-foot-high image of Buddha and composed a written prayer
    saying that constructing such an image is extremely meritorious and asking that
    the merit benefit the Emperor.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A note quotes a Chinese account in which Ming Ti dreams of a great golden
    man with a nimbus; a minister identifies this being as Buddha, described as sixteen
    feet high and yellow-golden in color.
  category: other
  evidence_refs:
  - ev:10
