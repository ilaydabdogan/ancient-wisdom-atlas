canonical_text:
  quote: ''
  summary: Chronicle entries for Emperor Jomei describe imperial visits to hot-spring
    palaces, tribute and court reception of foreign envoys, a new-rice festival, thunder
    and stellar portents, the construction of a palace, temple, and nine-story pagoda
    near the Kudara River, returning priests from Great Thang, and a Buddhist maigre
    entertainment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Emperor made an imperial progress to the hot springs palace of Arima and
    later returned from the hot springs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pékché, Silla, and Imna are said to have sent tribute in the same year.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A festival of tasting the new rice was held.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: There was thunder without clouds, followed later by a storm with thunder.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A long star appeared in the north-west.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Priest Bin said the long star was a besom-star and that famine occurred when
    it appeared.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Emperor decreed that a great palace and a great temple should be built.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The bank of the Kudara River was chosen as the site; the western population
    built the palace, the eastern population built the temple, and Agata, Fumi no
    Atahe, was made architect.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Priests Ye-on and Ye-un, who had studied in Great Thang, entered the capital
    in the train of the Silla Escort Envoys.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Silla Envoys were entertained at Court, and the Emperor granted them one
    grade of cap-rank.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Emperor made an imperial progress to the hot springs palace of Iyo.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A pagoda of nine stories was erected on the bank of the Kudara River.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: A star entered the moon.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Emperor returned from Iyo, resided in the Palace of Mumaya-zaka, and a
    great Buddhist maigre entertainment was held.
  category: sequence
  evidence_refs:
  - ev:9
