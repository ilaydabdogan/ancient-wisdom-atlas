canonical_text:
  quote: Is the Emperor’s life drawing to a close?
  summary: The passage records the deaths of two princes, tribute missions from Koryé
    and Silla, military and pasture preparations, the presentation of burning earth
    and burning water to the Emperor, fish covering the water near a shore-pavilion,
    entertainments and banquets, a public question about the Emperor’s approaching
    death, ship gifts connected with Silla tribute, and the destruction of Koryé with
    an anecdote about King Chyungmu’s wish for a thousand-year government.
  language: English
  quote_policy: quoted
