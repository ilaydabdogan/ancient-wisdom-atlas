canonical_text:
  quote: "“all (the sovereigns) put their trust in learned Ministers and enlightened
    assistants.”"
  summary: The passage reports that envoys were refused communication and harassed,
    after which they reported to the Chief Minister, who seized four villages with
    their people and goods and withdrew. A death notice for Oho-omi Kose no Obito
    follows. The remainder gives an imperial edict arguing that earlier sovereigns
    prospered by trusting learned ministers and enlightened assistants; named counsellors
    supported Japan and Inihe; successful rulers restored decay through wise counsel;
    and Emperor Wohatsuse selected capable men, thereby maintaining ancestral shrines
    and the Temples of the Land and Grain.
  language: English
  quote_policy: quoted
