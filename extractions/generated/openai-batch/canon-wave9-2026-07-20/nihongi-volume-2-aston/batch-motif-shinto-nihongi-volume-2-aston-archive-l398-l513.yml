candidate_motifs:
- id: motif:1
  label: Autochthonous divine founders of an island
  taxonomy_refs:
  - sacred_birth
  basis: The Tamna note describes three divine men appearing from the earth in a formerly
    uninhabited island and becoming founders of settlements.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage says the men bubbled up from the earth but does not describe
    infancy, parentage, or a birth ritual; the taxonomy link to sacred birth is therefore
    approximate.
- id: motif:2
  label: Founding population through triadic marriage and agricultural gifts
  taxonomy_refs:
  - culture_hero
  - sacred_marriage
  basis: Three divine men find three women with cattle and grain seeds, take them
    as wives, select residences by divination, sow grain, pasture cattle, and multiply.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The text reports marriages and settlement foundation but does not explicitly
    frame the marriages as ritual or divine marriage.
- id: motif:3
  label: Divine grant legitimating overseas territory
  taxonomy_refs:
  - royal_legitimacy
  basis: Arakahi's wife argues that the Sumiyoshi deities bestowed overseas lands
    on Emperor Homuda while in the womb and that earlier rulers established government
    houses there.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The motif is presented as an argument within a political dispute, not
    as an independent mythic narrative in this passage.
- id: motif:4
  label: Feigned illness to avoid carrying out a command
  taxonomy_refs: []
  basis: The wife advises Arakahi to pretend illness so that he will not communicate
    the cession order; another envoy is appointed.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage states the advice and replacement of the envoy, but it does
    not explicitly narrate the performance of the feigned illness.
- id: motif:5
  label: Tribute refusal followed by threatened expedition and pardon
  taxonomy_refs: []
  basis: The note says Pékché's king set out against Tamna because tribute was not
    paid, after which Tamna messengers begged pardon and were spared.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This is a political narrative pattern rather than a clearly mythological
    motif in the passage.
