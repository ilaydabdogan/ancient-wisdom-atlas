  quote: ''
  summary: Chronicle entries and embedded notes describe diplomatic contact with Pékché,
    movement of refugees and population registers, a mission with horses, Pékché's
    petition for four districts of Imna, arguments for and against cession, an invoked
    divine grant of overseas lands by the Sumiyoshi deities, the eventual imperial
    decree granting the districts, and a note on Tamna's origin from three divine
    men who emerged from the earth and founded settlements with women, cattle, and
    grain found in a stone coffer.
