  summary: 'The passage records imperial decrees and a petition: the Emperor proclaims
    an amnesty while noting the new palace, offerings to the Kami, and agricultural
    labor; orders governors to release banished persons and prisoners; commends six
    obedient men; redistributes rice-fields and lands; receives a petition from the
    Prince Imperial affirming unified sovereignty and offering dependent communities
    and estates; and begins a decree citing a Western Land/Chinese precedent about
    ancient interments on high ground.'
