  summary: Chronicle entries report diplomatic receptions and tribute, imperial regulation
    and patronage of temples, deaths and posthumous ranks, prayers and worship, natural
    and celestial portents, royal almsgiving, a welfare edict, and the Emperor’s vow
    for the sick Empress-consort, after which Yakushiji was begun, one hundred persons
    entered religion, and she recovered.
  language: English
  quote_policy: summarized
