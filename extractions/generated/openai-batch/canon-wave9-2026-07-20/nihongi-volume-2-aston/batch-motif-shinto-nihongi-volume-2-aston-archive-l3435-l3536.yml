canonical_text:
  quote: ''
  summary: The passage records diplomatic and military exchanges involving Pekché,
    the Japanese Emperor, Ara, Imna, and Koryé/Koma. It includes a factional succession
    conflict, a request for auxiliaries with a hostage exchange, accusations that
    Ara and Japanese authorities instigated an attack, imperial reassurance and instructions
    for joint defense, plans to re-people Ara, and aid for constructing a fortress.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Syé faction and the Chhu faction each tried to set up the son of its respective
    consort, and more than two thousand men of the Syé faction were slain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pekché sent Chin-mo-syén-mun, Kama, and others to ask for auxiliaries and
    offered W6n, son of Tong-syong, as a hostage in exchange for Mun-hyu-ma-na.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chin-mo-syén-mun and colleagues asked permission to depart, and the Emperor
    commanded that the auxiliaries requested by Pekché would be sent.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Pekché message reported that a prisoner from the Castle of Ma-chin expedition
    said the Land of Ara and the Japanese authorities in Corea had invited and instigated
    the expedition against Pekché.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pekché said that it summoned Ara and the Japanese authorities three times,
    that neither came, and that Pekché wished the auxiliaries delayed until it sent
    an answer.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Emperor answered that he was vexed by Ara and the Japanese authorities
    not assisting a neighbor, but that it was incredible they had sent a secret message
    to Koryé without imperial order.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Emperor urged the Pekché king to set aside suspicions and fears, join
    forces with Imna, and defend against the northern enemy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Emperor said he was about to send men to re-people the territory of Ara
    left vacant by fugitives.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: An envoy was later sent to Pekché saying that Pekché had suffered from the
    Koma brigands and should take measures with Imna as before.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Nyang-Y6ép-nyé and colleagues departed in the intercalary seventh month.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Three hundred and seventy men were sent to Pekché to assist in constructing
    a fortress at T6k-1-sin.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Emperor later said that an inquiry would be sent about Yanasa and Mato
    privately sending emissaries to Koryé, and that the requested army would be countermanded.
  category: speech
  evidence_refs:
  - ev:11
