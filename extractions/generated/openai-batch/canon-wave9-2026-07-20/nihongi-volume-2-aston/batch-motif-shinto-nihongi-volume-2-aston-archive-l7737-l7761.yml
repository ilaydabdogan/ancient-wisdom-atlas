canonical_text:
  quote: ''
  summary: 'A dated chronicle passage and translator notes discuss a diplomatic letter
    whose opening is reported differently in a Chinese History of the Thang dynasty:
    an emperor of the place where the sun comes forth addresses an emperor of the
    place where the sun sets. The note says the Chinese Emperor complained of the
    letter’s rudeness and infers that the name Nippon, glossed as sun-origin, was
    not yet officially in use. Additional notes gloss Wosa as interpreter and Dazai
    as a viceroy governing Kiushiu or the submitted part of it.'
