canonical_text:
  quote: If this is true, let calamity from Heaven surely befall me.
  summary: An imperial speech condemns Silla for injuries to imperial holdings and
    Imna, contrasts this with the mercy formerly shown by Okinaga Tarashi hime no
    Mikoto, and urges the heir and the Oho-omi to avenge the outrage. The passage
    then recounts a slander against Uta-yori over an alleged Empress's saddle; after
    he swears an oath invoking calamity from Heaven, he dies under torture, palace
    misfortunes follow, and his sons are threatened with burning until Morishi's mother
    asks that her child be given to the Hafuri as a slave in the service of the Gods.
  language: English
  quote_policy: quoted
