  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The speaker says that if the heir and Oho-omi cannot help slay the traitors
    and avenge the enemies of a Lord and father, he will be indignant even in his
    grave.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A certain person slanders Uta-yori, Mumakahi no Omi, by claiming that Uta-yori's
