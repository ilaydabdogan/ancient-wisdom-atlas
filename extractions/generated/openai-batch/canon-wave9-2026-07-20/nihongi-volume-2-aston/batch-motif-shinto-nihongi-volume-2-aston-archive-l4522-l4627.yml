- id: obs:3
  text: The speaker says Silla oppressed Imna with long spears and strong bows and
    committed ravage and butchery among Imna's people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says the heir to the Throne should weep tears of blood and cherish
