canonical_text:
  quote: ''
  summary: 'The passage recounts a royal succession crisis: the Heir Apparent declines
    the imperial undertaking, proposes other successors, renounces the world, assumes
    priestly garb, deposits his weapons, and withdraws to Yoshino with retainers.
    After the Emperor''s death, mourning and diplomatic exchanges occur. Later reports
    warn of armed preparations, route controls, and possible danger, leading the renounced
    royal figure to order military mobilization through Mino and the Fuha road.'
  language: English
  quote_policy: summarized
