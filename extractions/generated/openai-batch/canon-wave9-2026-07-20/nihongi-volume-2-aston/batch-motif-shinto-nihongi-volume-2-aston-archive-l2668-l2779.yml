  quote: "“Now Imna is the roof-tree of your country.”"
  summary: A chronicle passage describes Japanese imperial instructions to Pékché
    concerning Lower Kara and the establishment of Imna, King Syong-myong’s consultations
    with ministers, repeated summonses to Imna and Japanese agents, a delay attributed
    to worship of the Gods, and a later Pékché message citing an imperial decree.
  language: English
  quote_policy: quoted
