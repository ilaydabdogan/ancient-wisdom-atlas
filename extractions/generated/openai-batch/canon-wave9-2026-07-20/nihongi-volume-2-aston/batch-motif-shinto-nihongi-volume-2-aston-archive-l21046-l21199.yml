candidate_motifs:
- id: motif:1
  label: Wisdom contest rewarded by the ruler
  taxonomy_refs:
  - wisdom
  basis: The Emperor proposes conundrums with promised prizes, and correct answers
    by princes and Ministers are rewarded with valuable goods.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: high
  cautions: The passage is a court chronicle entry rather than a mythic tale; the
    conundrums are presented as court entertainment or examination.
- id: motif:2
  label: Sacred and ceremonial exchange through gifts, alms, tribute, and endowment
  taxonomy_refs:
  - sacred_exchange
  basis: 'The passage repeatedly records valuable objects moving through courtly,
    religious, and diplomatic relationships: prizes, alms, tribute, rice payments
    to a temple, fiefs, and presents to envoys.'
  evidence_refs:
  - ev:1
  - ev:3
  - ev:9
  - ev:10
  - ev:13
  - ev:15
  confidence: medium
  cautions: Many exchanges are administrative or diplomatic; their sacred status is
    clearest in alms and temple endowment, less certain in ordinary court gifts.
- id: motif:3
  label: Ritual response to illness through religious substitution and Buddhist rites
  taxonomy_refs: []
  basis: Three men enter religion as priests on behalf of the ill Yakuni, and during
    the Emperor's illness the Sutra of Yakushi is expounded and a retreat held within
    the Palace.
  evidence_refs:
  - ev:8
  - ev:14
  confidence: high
  cautions: The passage gives no theological explanation; the healing or protective
    function is inferred from the immediate placement of rites alongside illness.
- id: motif:4
  label: Royal authority displayed through rank, tribute, religious patronage, and
    shrine mission
  taxonomy_refs:
  - royal_legitimacy
  basis: The Emperor confers ranks, grants fiefs and temple resources, receives or
    oversees tribute and diplomatic entertainment, and sends royal women to Ise.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  - ev:11
  - ev:13
  confidence: medium
  cautions: The passage does not explicitly argue legitimacy; this is a cautious pattern-level
    reading of administrative acts recorded around the ruler.
- id: motif:5
  label: Destructive fire in a royal administrative center
  taxonomy_refs: []
  basis: The Treasury Department at Naniha catches fire and the Palace is burnt, while
    the Arsenal offices survive.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: No omen, divine cause, or cosmological meaning is stated; it should not
    be treated as world-destroying fire.
