canonical_text:
  quote: ''
  summary: Chronicle entries describe imperial conundrum contests with prizes, gifts
    and banquets for court elites, clergy, learned specialists, performers, and foreign
    guests; a white agate presentation; a destructive fire at Naniha and an earthquake;
    diplomatic entertainment and tribute connected with Silla; rank promotions and
    temple endowments; illness and deathbed honors for officials and physicians; a
    mission to the Shrine of Ise; and Buddhist rites, including exposition of the
    Sutra of Yakushi and a palace retreat, during the Emperor's illness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Emperor decrees that conundrums will be proposed to Princes and High Officials,
    with prizes promised for right answers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Imperial Prince Takechi and Prince Ise give right answers and receive garments,
    trousers, silk, and cloth as presents.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kudara no Nihiki of Settsu presents a white agate to the Emperor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Higher ecclesiastics, the Risshi, and Great Temple personnel are invited,
    entertained at a lay banquet, and given alms of silk and cloth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Princes, High Officials, learned persons, scholars, professors of Philosophy,
    and physicians are summoned or presented with food, garments, and other gifts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Treasury Department at Naniha catches fire and all the Palace is burnt,
    while the Arsenal offices are not burnt; some say the fire began in the house
    of Kusuri, Ato no Muraji.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Emperor holds banquets and a great revel at Court, rewards performers
    and singers, and gives gifts to Ministers who answer conundrums correctly on the
    spot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: An earthquake is recorded on the nineteenth day.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Selected court figures are sent to Tsukushi to entertain Kim Chi-syang of
    Silla.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Emperor confers or commands the conferral of ranks on Ministers, meritorious
    governors, and later on named officials and physicians.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: When Yakuni, Hata no Mabito, becomes ill, three men enter religion as priests
    on his behalf; after his death he receives a posthumous rank.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Snow is recorded on the tenth day of the third month.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: For the entertainment of Silla guests, music from the Temple of Kahara is
    transported to Tsukushi, and rice from the Empress-consort's Palace is paid to
    the temple.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Silla tribute arrives from Tsukushi, including animals, gold and silver vessels,
    brocades, gauze, skins, drugs, and separate presents for members of the imperial
    family.
  category: object
  evidence_refs:
  - ev:10
- id: obs:15
  text: Imperial Princess Taki, Princess Yamashiro no hime, and Lady Ishikaha are
    sent to the Shrine of Ise and later return.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: Ok-in, a man of Pekche and the Emperor's body-physician, becomes gravely ill
    and is granted rank and a fief of 100 houses near death.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: The Great Temple of the Great Palace receives a fief of 700 houses and taxes
    amounting to 30,000 sheaves of rice by imperial command.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: When the Emperor's body is ill at ease, the Sutra of Yakushi is expounded
    in the Temple of Kahara and a retreat is held within the Palace.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:19
  text: Kim Chi-syang and his colleagues are entertained in Tsukushi, receive presents,
    and depart from Tsukushi.
  category: sequence
  evidence_refs:
  - ev:15
