canonical_text:
  quote: ''
  summary: The passage records a military expedition under Imperial Prince Kume being
    staged in Tsukushi and Shima, then halted by his illness and later death. It also
    records arrivals from Pékché and Kory6, including the Pékché priest Kwal-leuk,
    who brings books on calendrical, astronomical, geographical, invisibility, and
    magical arts and teaches selected pupils. Kume's death is reported to the Empress,
    who laments the failure of the project, and he is temporarily buried at Saba in
    Suwo.
  language: English
  quote_policy: summarized
