canonical_text:
  quote: ''
  summary: 'The passage gives burial regulations: it discourages costly grave goods
    and excessive tomb building, defines burial as putting away the dead from sight,
    assigns tomb dimensions and funeral materials by rank, requires prompt simple
    burial for ordinary persons, forbids temporary interment places, and orders burial
    plots to be set apart in the provinces. Translator notes discuss evergreen tomb
    trees and tomb stones.'
  language: English
  quote_policy: summarized
