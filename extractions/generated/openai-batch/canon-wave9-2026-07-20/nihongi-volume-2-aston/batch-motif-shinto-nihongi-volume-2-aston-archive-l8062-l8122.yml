canonical_text:
  quote: "“there was no corpse. It was empty, and there was nothing but the garment
    folded up”"
  summary: A poem laments a hungry, lordless wayfarer. The Prince Imperial sends a
    messenger, learns that the starving man is dead, grieves, and has him buried under
    a closed mound. Many days later the Prince says the man was no ordinary person
    but upright. A messenger inspects the mound, finds the earth undisturbed, opens
    the tomb, and finds no corpse, only a folded garment on the coffin. The Prince
    has the garment brought back and continues wearing it. People interpret the event
    by saying that a sage knows a sage and grow more in awe of him. Later chronicle
    notices mention an excursion for medicinal herbs, envoys sent to Great Thang,
    and a thousand men and women entering religion for the sake of the ill Oho-omi.
  language: English
  quote_policy: quoted
