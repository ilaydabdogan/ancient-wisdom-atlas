canonical_text:
  quote: ''
  summary: An Imperial message rebukes Silla for departures from precedent in diplomatic
    rank, condolence protocol, and the number of ships sent. The message recalls Silla’s
    earlier professions of service since the remote Imperial ancestors of Japan, accuses
    Silla of broken faith and flattery, returns tribute and presents, but says imperial
    affection will continue if laws are observed. Tona and others are ordered to deliver
    the message to their King. Subsequent entries record garments presented to the
    Viceroy of Tsukushi and others, and the appointment of named officials as Commissioners
    for the choice of good words, explained in a note as auspicious language for addresses.
  language: English
  quote_policy: summarized
