  summary: Chronicle entries record diplomatic rank-giving and departures, imperial
    commands to build a temple and palace, submission and hospitality toward the Yemishi,
    repeated earthquakes and unusual weather, the new-rice tasting festival, and mourning,
    eulogies, burial, and relocation after the death of Emperor Okinaga tarashi-hi
    hiro-nuka.
  language: English
  quote_policy: summarized
