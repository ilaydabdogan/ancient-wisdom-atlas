canonical_text:
  quote: ''
  summary: The passage first reports childlessness in a princely household and an
    imperial decree granting the Saho granary so that a consort’s name will endure.
    It then describes Panphi building castles and beacon-towers, gathering troops
    and weapons, and attacking Silla. Finally, a Pekche envoy party is allowed to
    return with Mononobe no Muraji attached; after reports of Panphi violence, Mononobe
    leads five hundred war-ships toward Te-sa and anchors there.
