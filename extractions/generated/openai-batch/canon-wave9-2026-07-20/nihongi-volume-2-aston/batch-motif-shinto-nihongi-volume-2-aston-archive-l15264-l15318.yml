canonical_text:
  quote: "“The divine vengeance of Yamato is near.”"
  summary: Envoys angered by slander are said to have their anger reach the Gods of
    High Heaven, who kill Tarushima with a thunderbolt. The passage then records the
    deaths of Prince Ise and the Empress, a demon or spirit seen on Mount Asakura
    looking down on the funeral proceedings, the Prince Imperial’s lament for the
    Empress, the funeral’s return and anchoring, temporary interment, and nine days
    of mourning.
