  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Empress decreed to the Ministers that the Urabon Sutra be expounded in
    all capital temples and that requital be made to ancestors for seven generations.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Kuni no Miyakko of Idzumo was commanded to repair the shrine of the Itsuki
    God.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A fox bit off the end of a creeper held by a labourer of the district of Owi
