  summary: The passage records constrained envoys, court audiences and gifts, an imperial
    decree for Urabon Sutra exposition and requital to ancestors, a command to repair
    an Idzumo shrine, animal incidents glossed as signs of the Empress's impending
    death, Koryo envoy and bear-skin episodes, and Abe no Omi's naval expedition toward
    Su-shen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed group was kept in separate seclusion, with their door closed and
    prohibited, without freedom of movement.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The writing of Wobito, Naniha no Kishi, says that the Chief Envoy to Great
    Thang struck an island and was overturned.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Associate Envoy had a personal audience with the Emperor, showed him Yemishi,
