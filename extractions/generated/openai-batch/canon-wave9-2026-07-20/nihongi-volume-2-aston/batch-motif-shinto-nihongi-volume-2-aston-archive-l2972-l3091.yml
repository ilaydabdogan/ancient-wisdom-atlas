canonical_text:
  quote: ''
  summary: A memorial or report to the Japanese ruler accuses Silla of deceiving the
    Imperial Court, seizing and harassing territories, and cultivating disputed land.
    The speaker claims to have sent troops to protect Imna and argues that certain
    agents and local leaders are secretly aligned with Silla, shown in part by wearing
    Silla rank insignia or dress and travelling to Silla borders. Earlier downfalls
    of Tok and Chhak-syun are cited as parallels caused by secret understandings with
    Silla. The speaker asks that these persons be removed to secure peace for Imna.
    The passage ends with Pékché envoys departing or returning from Japan.
  language: English
  quote_policy: summarized
