canonical_text:
  quote: ''
  summary: Chronicle entries for A.D. 688 and the beginning of the following year
    describe funeral rites at the Palace of temporary interment, eulogies, food offerings,
    lamentation, a shield-and-sword dance, burial of the Emperor, clemency decrees,
    drought and rain-prayer by a Pekché priest, tribute and hospitality involving
    Tamna and Yemishi groups, a New Year audience, and presentation of staves associated
    in the note with driving out evil spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An ornamental chaplet was offered at the Palace of temporary interment, and
    Ohoshima, Fujihara no Ason, pronounced a eulogy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An Imperial decree mitigated capital punishments by one degree, pardoned lighter
    offenders, and ordered that only half the commuted taxes be levied for the year.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Because of drought, great praying for rain was performed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Pekché priest Doz was commanded to pray for rain, and plentiful rain fell
    throughout the Empire before a morning had passed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Food offerings and lamentation were made at the Palace of temporary interment,
    with Yasumaro, Ohotomo no Sukune, pronouncing a eulogy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Prince Ise was commanded to announce the state to be observed at the funeral.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The King of Tamna sent Minister Kara with tribute, and Kara and his companions
