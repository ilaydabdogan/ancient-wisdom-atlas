  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Prince Imperial, ministers, public functionaries, and guests from frontier
    lands went to the Palace of temporary interment, lamented, made food offerings,
    and performed the Tate-fushi dance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The ministers pronounced eulogies in turn, setting forth the services rendered
    by their ancestors.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: More than 190 Yemishi brought tribute on their backs and pronounced a eulogy.
  category: action
  evidence_refs:
