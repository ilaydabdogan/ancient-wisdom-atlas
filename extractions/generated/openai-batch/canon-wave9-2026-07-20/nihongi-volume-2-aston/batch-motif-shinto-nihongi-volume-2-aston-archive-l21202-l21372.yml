    priests for the Emperor’s bodily repose, and offerings were made to the Three
    Precious Things.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the Temple of Kahara, lanterns were exhibited, food offerings were made,
    a vegetarian feast was held, and repentance for sin was performed.
  category: sequence
  evidence_refs:
  - ev:4
