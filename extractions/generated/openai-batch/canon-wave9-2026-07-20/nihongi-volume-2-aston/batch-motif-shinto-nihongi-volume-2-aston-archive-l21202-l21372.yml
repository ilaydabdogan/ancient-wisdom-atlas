canonical_text:
  quote: ''
  summary: Chronicle entries describe imperial illness, divination attributing the
    illness to a curse from the Kusa-nagi sword, Buddhist and Shintō prayers and offerings
    for healing and rain, penitential and purification rites, amnesties and debt relief,
    lightning and destructive fire, delegation of imperial affairs to the Empress-consort
    and Prince Imperial, and religious patronage including images, sutra readings,
    ordinations, and temple fiefs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Divination determined that the Emperor’s disease was caused by a curse from
    the Kusa-nagi sword, which was then sent to and deposited at the shrine of Atsuta
    in Wohari.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prayer was made for rain.
  category: action
  evidence_refs:
