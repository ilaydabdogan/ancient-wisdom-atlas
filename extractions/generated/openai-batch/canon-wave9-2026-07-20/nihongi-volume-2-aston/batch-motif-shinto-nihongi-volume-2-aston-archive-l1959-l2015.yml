canonical_text:
  quote: ''
  summary: The passage gives a brief genealogical notice about Mariko, Ohoshi Kahachi
    no Wakugo hime, and Imperial Prince Honowo. It then records an imperial edict
    of A.D. 536 declaring food the basis of the empire, describing Tsukushi as a route
    for visitors and tribute-bearers from overseas, and ordering grain transport,
    construction at Nanotsu no Kuchi, and consolidation of remote Miyake for emergencies
    and preservation of the people.
  language: English
  quote_policy: summarized
