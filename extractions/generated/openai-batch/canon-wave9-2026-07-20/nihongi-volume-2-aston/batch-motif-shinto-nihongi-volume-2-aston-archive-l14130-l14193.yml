canonical_text:
  quote: ''
  summary: Chronicle entries report an unsuccessful attempt to send a Buddhist priest
    and companions to Great Thang via Silla; ambassadors returning from Pekche with
    a camel and two asses for the Empress; a white fox report from Ihami; deaths of
    Kose no Tokuda no Omi and Prince Takeru; and Abe no Omi's expedition against the
    Yemishi, including their submission, Omuka's oath before the Gods of the bay of
    Aita, grants of rank and governors, and a feast for summoned Yemishi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Silla refused to provide escort for Chitatsu and named colleagues to Great
    Thang, so they returned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ambassadors returning from Pekche brought the Empress one camel and two asses
    as presents.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people of Ihami reported that a white fox had been seen; the note calls
    this a good omen and compares it with a white pheasant report from Anato.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kose no Tokuda no Omi, Oho-omi of the Left, died on the 13th day of the 1st
    month in the 4th year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Abe no Omi led a fleet of 180 ships against the Yemishi; the Yemishi of Aita
    and Nushiro were afraid and submitted, and the ships were arrayed in the bay of
    Aita.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Omuka swore that the Yemishi carried bows and arrows for subsistence, not
    against the Imperial forces, invoked the Gods of the bay of Aita to take note
    if this were false, and promised service to the Government with pure hearts.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Omuka received the rank of Upper Sho-otsu; local governors were set up in
    Nushiro and Tsugaru; Yemishi of Watari no Shima were gathered at Arima, feasted,
    and dismissed home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Prince Takeru, an eight-year-old grandson of the Empress, died and his remains
    were placed in a temporary tomb raised for him.
  category: sequence
  evidence_refs:
  - ev:8
