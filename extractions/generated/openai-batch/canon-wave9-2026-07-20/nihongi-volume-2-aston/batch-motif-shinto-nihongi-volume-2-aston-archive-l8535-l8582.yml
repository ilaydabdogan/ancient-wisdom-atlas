canonical_text:
  quote: ''
  summary: The Empress responds to a report of a priest striking his grandfather by
    ordering an investigation of priests and nuns. Kwal-leuk, a Buddhist priest of
    Pékché, petitions for clemency, explaining the recent transmission of Buddhist
    law and sacred materials to Nippon and the clergy’s incomplete learning. The Empress
    grants the petition, then creates supervisory Buddhist offices, appoints officials,
    and orders inspection and record-making for temples and clergy.
  language: English
  quote_policy: summarized
