canonical_text:
  quote: ''
  summary: In A.D. 661, a report from Shinano describes an immense swarm of flies
    flying west across Ohosaka hill; some people take it as a portent of the defeat
    of the army of relief. A popular song depicts wild geese devouring a wife’s rice-field,
    and a footnote gives a conjectural political interpretation of the song. The Imperial
    ship then sails west, reaches the sea of Ohoku where Princess Ohota-hime gives
    birth to Princess Ohoku, anchors at a temporary palace in Iyo, and later returns
    to Una no Ohotsu, where the Empress occupies and renames a temporary palace.
  language: English
  quote_policy: summarized
