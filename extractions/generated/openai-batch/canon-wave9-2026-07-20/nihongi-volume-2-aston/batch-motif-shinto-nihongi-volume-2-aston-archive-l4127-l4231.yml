canonical_text:
  quote: ''
  summary: Yo-chhyang invades Silla and builds a fortress. His father King Myong goes
    to comfort him but is intercepted by Silla. Koto, a groom-slave, executes King
    Myong after a dialogue about royal status and oath-breaking; variant accounts
    describe the king giving his sword and different treatments of his skull and bones.
    A skilled archer from Tsukushi breaks the encirclement around Yo-chhyang, enabling
    his escape and receiving an honorary name. Silla generals abandon a plan to destroy
    the remaining Pekché forces because of concern over Japanese retaliation, and
    Prince Hyé is sent to report King Syong-myong’s death.
  language: English
  quote_policy: summarized
