  summary: The passage records an imperial admonition after years of prosperity, urging
    thrift, morality, and care in appointing officials. An envoy from Imna reports
    that Kena no Omi has settled at Kusamura, neglected governmental duties, failed
    to settle disputes over children between Japanese and Imna people, used boiling-water
    ordeals that killed many, put Natari and Sapuri to death, and harassed the people.
    The Emperor sends to recall him, but Kena does not return and instead sends Mikari
    to the capital with a message; the excerpt ends before the message is complete.
  language: English
