canonical_text:
  quote: ''
  summary: Chronicle entries report Silla envoys who remain in Japan and become subjects;
    Koryo migrants settled in Yamashiro; floods, famine, cannibalism, and grain relief;
    an imperial edict revising serf lists; the death of Iname no Sukune; an imperial
    progress to Shibagaki; and a report that Koryo envoys were driven by winds and
    waves to the coast of Koshi, concealed by a local ruler, and later acknowledged
    by the Emperor as having survived being cast away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Silla sent envoys to offer presents and bring tribute; the envoys feared execution
    because the Government was indignant about the destruction of Imna.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Silla envoys did not return to their country, were ranked as Japanese
    subjects, and are identified as ancestors of Silla men in Hani-iho, Mishima district,
    Settsu province.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Koryo men, including Tu-muri-ya-phyé and others, emigrated to Tsukushi, were
    settled in Yamashiro, and are identified as ancestors of Koryo men of Une-hara,
    Nara, and Yamamura.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Floods occurred in districts and provinces, followed by famine; in some cases
    people ate each other.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mutual assistance was provided by transporting grain from neighbouring districts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: An imperial edict states that serf lists had omitted many names for more than
    ten years and orders Itsu to revise the lists of the serfs of Shirawi.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Itsu revised the serfs of Shirawi, settled the lists, formed land-families,
    received the title Shirawi no Obito, and was appointed Tadzukahi under Midzuko.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Iname no Sukune, Soga no Oho-omi, died in the thirty-first year, third month.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Emperor made a progress to the Palace of Shibagaki in Hatsuse.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Moshiro reported that Koryo envoys suffered from winds and waves, lost their
    way, missed their harbour, drifted with the current, and reached the shore.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Moshiro said the ruler of the district concealed the arrival of the Koryo
    envoys.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Emperor stated that the Koryo men had reached the coast of Koshi after
    losing their way and that, though cast away and submerged, their lives had been
    preserved.
  category: speech
  evidence_refs:
  - ev:9
