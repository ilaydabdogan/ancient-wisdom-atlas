canonical_text:
  quote: ''
  summary: The passage reports an expedition that first went to Imna and prepared
    to attack Silla, prompting the King of Silla to submit. Returning envoys report
    that Silla had prepared tribute envoys, but those envoys withdrew after seeing
    a naval force, though the tribute was brought. Contemporaries attribute the war
    to officials who had received presents from Silla and urged an early expedition.
    A prior reception scene explains the beginning of Silla sending two boats to meet
    Japanese envoys. The passage then records heavy rains and floods that prevented
    grain maturity, followed by a notice that a Buddhist priest struck his paternal
    grandfather with an axe.
  language: English
  quote_policy: summarized
