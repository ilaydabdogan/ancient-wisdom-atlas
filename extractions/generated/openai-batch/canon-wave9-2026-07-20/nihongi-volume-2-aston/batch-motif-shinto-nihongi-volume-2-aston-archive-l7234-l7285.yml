  summary: 'The passage gives articles of instruction for officials: early and late
    court attendance, good faith between lord and vassal, restraint from wrath, recognition
    of human fallibility, clear rewards and punishments, prohibition on provincial
    exactions, and affirmation that the sovereign is the sole master of the people.
    It ends with an incomplete opening of the next article.'
