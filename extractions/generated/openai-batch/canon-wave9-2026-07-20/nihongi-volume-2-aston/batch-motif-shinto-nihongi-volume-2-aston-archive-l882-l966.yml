canonical_text:
  quote: ''
  summary: Chronicle notices report the Pékché heir Myéong assuming royal dignity,
    a capital relocation to Tamaho in Ihare, and a later crisis in which Afumi no
    Kena no Omi's expedition to Imna is delayed by the rebellion and obstruction of
    Ihawi/Thawi of Tsukushi. Silla bribes Ihawi to oppose the army; Ihawi blocks taxes,
    sea routes, tribute ships, and the army's passage, then refuses submission to
    the envoy. The Emperor consults leading officials and approves Arakahi as general.
  language: English
  quote_policy: summarized
