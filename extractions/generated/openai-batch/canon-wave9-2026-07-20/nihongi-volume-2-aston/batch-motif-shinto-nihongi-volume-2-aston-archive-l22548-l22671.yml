canonical_text:
  quote: ''
  summary: A chronicle sequence records an imperial order rewarding Ohotomobe no Hakama,
    who had been captured in the Pékché campaign and offered to be sold as a slave
    so that companions could buy food and clothing and report Tang designs to the
    Japanese court. The order praises his loyalty, grants rank, goods, rice-land,
    and exemptions for relatives. Subsequent entries record inspections of the Fujihara
    palace site, gifts to foreign envoys and officials, adoption of calendars, imperial
    travel to Yoshino and Fujihara, grants of ranks and fiefs, and the beginning of
    another edict concerning a faithful official.
  language: English
  quote_policy: summarized
