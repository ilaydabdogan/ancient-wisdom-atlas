canonical_text:
  quote: ''
  summary: The passage describes court rank insignia, diplomatic exchanges with Silla,
    construction and repair of frontier barriers, New Year ceremonies, dispatch of
    student priests to Corea, and a Buddhist temple event in which Oho-omi Abe enshrines
    four Buddha images in a pagoda and constructs a figure of Vulture Mountain from
    stacked drums.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Distinctions of rank are described as being indicated by borders and cicada-shaped
    hair ornaments on caps, with materials varying by grade.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The caps are said to be worn at Grand Assemblies, when foreign guests are
    entertained, and at Buddhist maigre feasts in the fourth and seventh months.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Silla sends Kim Chhyun-chhyu and others to accompany Takamuko no Kuromaro
    and Oshikuma Nakatomi no Muraji and to bring the Emperor a peacock and a parrot;
    Kim Chhyun-chhyu is made a hostage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Nutari barrier is constructed and a barrier-settlement established; old
    men say a prior eastward migration of rats prefigured the making of the barrier.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: New Year’s congratulations take place, and in the evening the Emperor proceeds
    to the Palace of Toyosaki in Naniha.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Student priests are sent to Corea.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Oho-omi Abe invites the four Buddhist classes to the Temple of Shitenoji,
    enshrines four Buddha images in the pagoda, and constructs a figure of Vulture
    Mountain by piling drums on one another.
  category: action
  evidence_refs:
  - ev:5
  - ev:9
  - ev:10
- id: obs:8
  text: The old caps are discontinued, except that the Oho-omi of the Left and Right
    continue to wear them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Silla sends tribute envoys; the Ihabune barrier is put to rights as a precaution
    against the Yemishi, and subjects from Koshi and Shinano are selected for a barrier-settlement.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Nineteen cap grades are instituted, beginning with greater and lesser woven-stuff
