canonical_text:
  quote: ''
  summary: The passage records a solar eclipse, a Yemishi rebellion, the defeat and
    siege of the general Katana, and the intervention of his wife, who shames him
    with ancestral precedent, gives him sake, arms herself, and has women twang bows
    so that the enemy believes the army remains numerous. The troops rally and capture
    the Yemishi. It also records storm and rain anomalies, then gives commentary on
    the Celestial Dog, its astral form, an alternate Celestial Fox reading, and the
    later Tengu.
  language: English
  quote_policy: summarized
