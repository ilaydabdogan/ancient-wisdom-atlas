canonical_text:
  quote: ''
  summary: Annalistic entries for A.D. 682 record grants of rank and title, deaths
    and posthumous honors, earthquakes, the survey of Nihiki as a proposed capital,
    the invention of new characters, imperial decrees regulating attire, fiefs, and
    hair, worship of the deities of Hirose and Tatsuta, tribute and diplomatic missions,
    Hayato wrestling and entertainment, and reports of frost, storms, and failed grain
    formation.
  language: English
  quote_policy: summarized
