  evidence_refs:
  - ev:4
  - ev:8
- id: obs:8
  text: Tribute, presents, and gifts circulate among the court, regional groups, and
    foreign envoys, including a large bell and products of countries.
  category: action
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  - ev:9
  - ev:10
- id: obs:9
  text: The Hayato of Ohosumi and Ata wrestle in the Court; the Ohosumi Hayato win.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Hayato are entertained west of Asuka Temple with music, and Buddhist priests
    and laity come to look on.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Emperor decrees that all men and women must tie up their hair; later men
