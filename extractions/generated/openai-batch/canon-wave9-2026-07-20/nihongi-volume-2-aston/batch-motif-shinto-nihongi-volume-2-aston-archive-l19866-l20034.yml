- id: obs:4
  text: Prince Mino and officials are sent to examine the ground at Nihiki, and the
    capital is resolved to be placed there; the Emperor later visits Nihiki.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: By imperial command, Ihashiki invents new characters, described as one book
