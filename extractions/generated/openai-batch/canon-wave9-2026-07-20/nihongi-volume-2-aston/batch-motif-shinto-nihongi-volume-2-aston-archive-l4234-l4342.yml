canonical_text:
  quote: ''
  summary: The passage reports imperial condolence to Prince Hyé, Hyé's request for
    armed aid to avenge his father, Soga's mourning for King Syéng, and Soga's counsel
    that Pékché should renew worship of the founder deity by shrine-building and sacrifice.
    It also records administrative dispatches to Kibi, Yō-chhyang's wish to leave
    the world and practice religion for his deceased father, and a footnote comparing
    the founder-god tradition to the Korean Tan-kun legend.
  language: English
  quote_policy: summarized
