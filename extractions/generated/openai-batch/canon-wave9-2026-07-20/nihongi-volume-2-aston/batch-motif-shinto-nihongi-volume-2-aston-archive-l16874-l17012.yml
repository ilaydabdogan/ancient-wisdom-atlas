canonical_text:
  quote: ''
  summary: 'The passage records late events of Tenchi’s reign: a palace fire, an oath
    by five ministers attending Imperial Prince Ohotomo, diplomatic gifts to Silla,
    the Emperor’s death and temporary interment, popular songs with obscure political
    application, departure of Silla envoys, and two prodigies: a four-legged chicken
    and eight sounding pots. It then opens Book XXVIII by introducing Emperor Ama
    no Nunahara oki no mabito, also called Imperial Prince Oho-ama, describing his
    kinship, qualities, skills in astronomy and invisibility, marriage to Imperial
    Princess Uno, appointment as Heir Apparent, and summons to the sick Emperor’s
    hall.'
  language: English
  quote_policy: summarized
