canonical_text:
  quote: ''
  summary: Chronicle entries report tribute missions, a large vegetarian feast for
    priests and nuns, imperial disciplinary and economic decrees, state prayers and
    worship directed to the Wind-Gods and the Oho-imi Deity, prohibitions on traps
    and on eating specified animal flesh, banishments, reward for a dying official,
    diplomatic travel, and a damaging storm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Koryé and Silla sent named officials or envoys with tribute.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: More than 2400 priests and nuns were invited to a great feast of vegetable
    fare.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Emperor forbade certain officials to attend court, regulated tax-rice
    loans by classifying peasants by poverty or wealth, and later stripped Maro of
    offices and dignities after conviction for resisting an imperial messenger.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Named officials were sent to offer prayers to the Wind-Gods at Tateno in Tatsuta
    and to worship the Oho-imi Deity at Kahawa in Hirose.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Emperor decreed that fishermen and hunters were to be restrained from
    making pitfalls, spear-traps, and similar devices.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The decree also forbade setting certain fish-traps during a dated seasonal
    interval and forbade eating the flesh of kine, horses, dogs, monkeys, and barn-door
    fowls.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Prince Womi was banished to Inaba, and two of his children were banished to
    separate islands.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When Yesaka was near death, the Emperor praised his public service, promised
    rewards for his descendants, raised his rank, and Yesaka died soon afterward.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A storm made sand fly and damaged houses.
  category: setting
  evidence_refs:
  - ev:9
