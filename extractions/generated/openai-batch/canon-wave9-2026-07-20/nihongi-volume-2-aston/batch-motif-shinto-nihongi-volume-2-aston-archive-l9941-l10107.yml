  quote: ''
  summary: The annal for A.D. 643 records Soga no Yemishi's construction of an ancestral
    temple and tombs, forced labor, and Princess Kamutsumiya's accusation of usurping
    royal authority. It then lists unusual skies, storms, hail, fire, foreign tribute
    activity, polluted pond water with grubs and dead fish, an eclipse, burials, mourning,
    and funeral arrangements involving the Empress and her grandmother.
  language: English
  quote_policy: summarized
