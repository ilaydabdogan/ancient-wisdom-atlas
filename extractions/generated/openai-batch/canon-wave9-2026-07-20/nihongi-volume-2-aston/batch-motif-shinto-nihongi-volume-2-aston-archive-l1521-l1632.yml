  summary: The passage introduces Emperor Magari no Ohoye/Ankan, describes his parentage
    and character, recounts his installation by Emperor Wohodo and Wohodo's death,
    records ministerial appointments, relocation of the capital, formal installation
    of Kasuga no Yamada as Empress with additional consorts, and narrates an incident
    in which Ishimi local officials fail to deliver pearls, flee into the Empress's
    inner apartments, and offer the Miyake of Ishimi to her as atonement.
