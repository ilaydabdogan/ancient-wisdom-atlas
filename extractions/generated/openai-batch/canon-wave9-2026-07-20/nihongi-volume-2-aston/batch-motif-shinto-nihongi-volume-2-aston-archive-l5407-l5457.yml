canonical_text:
  quote: ''
  summary: A fragment of an oath invokes gods and imperial spirits to destroy the
    oath-breakers' race. Silla envoys bring tribute but are dismissed. The Emperor
    orders measures to restore Imna, citing his late father's unfinished policy, and
    sends envoys to summon the wise and brave Illa from Pékché. Pékché's king refuses
    to let Illa come. Hashima is sent again, encounters a Korean woman at Illa's house
    who utters a cryptic phrase, follows her inside, and is received by Illa before
    the passage breaks off.
  language: English
  quote_policy: summarized
