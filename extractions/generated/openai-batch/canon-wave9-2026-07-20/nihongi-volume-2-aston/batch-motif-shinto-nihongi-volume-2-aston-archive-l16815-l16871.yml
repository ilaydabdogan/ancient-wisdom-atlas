canonical_text:
  quote: ''
  summary: A message from Tsushima to the Viceroy of Tsukushi reports arrivals from
    Thang, a large Tang-associated fleet anchored at Hijishima, and an advance notice
    sent to prevent alarm and possible battle. On the 23rd day, Imperial Prince Ohotomo
    and five attendants make vows before an embroidered Buddha image, using an incense-burner
    and invoking Heaven, the Four Heavenly Kings, the Gods of Heaven and Earth, and
    the thirty-three Devas as punitive or witnessing powers. An editorial note describes
    the scene as mixing Brahmanism, Buddhism, and Chinese religion, with no Shinto
    gods mentioned.
  language: English
  quote_policy: summarized
