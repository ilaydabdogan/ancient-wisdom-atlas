  summary: The passage reports fortified household arrangements, anomalous bodiless
    sights and monkey-like sounds later interpreted as signs or divine messengers,
    a story of Kura-tsukuri no Tokushi learning arts from a tiger and receiving a
    disease-curing needle, and the opening stages of a court conspiracy by Prince
    Naka no Ohoye and allies against Soga no Iruka.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed man in the opening paragraph had a castle, erected an armoury,
    stored arrows, and was accompanied by fifty soldiers called the Eastern Company.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People of various Uji came to the man's gate and waited on him; he called
    himself their father and them his boys.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: On mountain-peaks, by riversides, and among shrines and temples, something
    was visible from afar and monkey-like humming or crying was heard, but no bodily
    form could be seen when approached.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old book connected the phenomenon with the move of the capital to Naniha
    and the future wasting of the Itabuki palace; people of the time called the phenomena
    messengers of the Great Deity of Ise.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Korye student-priests said that Kura-tsukuri no Tokushi befriended a tiger
    and learned arts from him, including making a barren mountain green and yellow
    earth into clear water.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The tiger gave Tokushi a needle, warned him to be watchful and secret, and
    said that no disease could fail to be cured by it; the passage says the cures
    happened as stated.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tokushi concealed the needle in a pillar; later the tiger broke the pillar
    and ran away with the needle, and Korye put Tokushi to death by poison after hearing
    that he wished to return.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Prince Naka no Ohoye secretly told Kurayamada no Maro no Omi of his plan for
    slaying Iruka no Omi, and Maro assented.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: At court in the Taikyokuden, Nakatomi no Kamako used an expedient to make
    Soga no Iruka lay aside his sword before entering attendance by the throne.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Prince Naka no Ohoye ordered all twelve gates fastened, promised rewards to
    the Gate Guards, hid a long spear in the hall, and allies armed with bows, arrows,
    and swords prepared to attack.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Komaro and his companion were frightened; Kurayamada Maro trembled, sweated,
    spoke indistinctly, and explained his fear as fear of being near the Empress.
  category: attribute
  evidence_refs:
  - ev:10
