canonical_text:
  quote: ''
  summary: A sequence of dated chronicle entries records gifts to people from Great
    Thang and Silla, an order concerning student-priests and silk, entertainment and
    departure of Silla condolence envoys, distribution of legal enactments, a grant
    of Buddhist images and ritual objects to the priest Jitoku, orders to build archery
    practice places, and punishment of a false Palace guard with reward to the guard
    who arrested him.
  language: English
