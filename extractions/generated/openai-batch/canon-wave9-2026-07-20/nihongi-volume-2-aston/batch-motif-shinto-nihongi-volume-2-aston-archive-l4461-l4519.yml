canonical_text:
  quote: ''
  summary: Té-sa, angered after a mocking exchange about an official building at Anato,
    reports the speech to his country, after which Silla builds a fortress on Mount
    Araphasa against Japan. The chronicle then states that Silla destroyed the Miyake
    of Imna, with an alternate note listing Imna's ten provinces. A quoted Tongkam
    account describes Silla's destruction of Great Kaya through I-sa-pu and the youthful
    hero Sa-ta-sya, who enters the Sandalwood gate, raises a white flag, is rewarded,
    redistributes land to his troops, frees captives, and dies at seventeen.
  language: English
  quote_policy: summarized
