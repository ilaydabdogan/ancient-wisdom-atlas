canonical_text:
  quote: ''
  summary: Chronicle entries for A.D. 695 record court archery, the Empress’s visits
    to Yoshino, a Silla embassy bearing a memorial, tribute, and presents, missions
    to Tane, prayers to named deities and shrines, posthumous honors and funeral expenses,
    Hayato entertainment and wrestling, rain-prayer envoys, and honorary gifts to
    elderly or chronically ill officials.
  language: English
  quote_policy: summarized
