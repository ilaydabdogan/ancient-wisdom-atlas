  summary: Chronicle entries for A.D. 640-641 report a priest expounding the Muryo
    jiu ki, the return of a priest and student from Great Thang by way of Silla with
    tribute-bearing envoys, the granting of cap-rank grades to the envoys, the Emperor's
    removal to the Palace of Kudara, his death there, temporary interment north of
    the palace, and a funeral eulogy pronounced by the sixteen-year-old Heir Apparent
    Hirakasu wake.
  language: English
