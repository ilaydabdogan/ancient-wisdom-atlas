canonical_text:
  quote: ''
  summary: Chronicle entries for A.D. 673 enumerate imperial offspring, confer ranks
    for service, record a white pheasant tribute followed by remission of forced labour
    and general amnesty, note copying of the Issaikio at Kaharadera, send Imperial
    Princess Ohoki to purify herself before attending the shrine of Ama-terasu no
    Oho-kami, give administrative orders, grant posthumous honours, and describe diplomatic
    tribute, congratulations, condolence, ranks, entertainments, and gifts involving
    Tamna, Silla, and Koryo envoys.
  language: English
  quote_policy: summarized
