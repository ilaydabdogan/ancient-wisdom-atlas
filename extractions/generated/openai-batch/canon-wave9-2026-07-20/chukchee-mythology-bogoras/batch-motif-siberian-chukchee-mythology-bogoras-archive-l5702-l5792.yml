candidate_motifs:
- id: motif:1
  label: return from upper world by sun-ray with portable household tokens
  taxonomy_refs:
  - return
  basis: A woman descends from the upper world to earth along a sun-ray carrying household/provision
    pieces that enable her life below.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage begins mid-tale, so the woman’s prior situation and the identity
    of the upper-world male are only partly available.
- id: motif:2
  label: dwelling and provisions created from small pieces activated by spitting
  taxonomy_refs: []
  basis: Small pieces from a dwelling and provision bags are placed in a mitten, removed
    on earth, spat upon, and become a shore house stocked with meat and food.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No supplied taxonomy reference directly matches this transformation/creation
    action.
- id: motif:3
  label: returned mother recognizes and restores neglected daughters
  taxonomy_refs:
  - return
  basis: The woman finds poorly dressed girls gathering seaweed, recognizes them as
    her daughters, declares that she is alive and returned, and gives them fine clothing.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The broader family situation is incomplete because the preceding part
    of the tale is outside the passage.
- id: motif:4
  label: human captive raised as giant and transformed by feeding
  taxonomy_refs: []
  basis: The youngest brother is captured as a toy for giant children, fed by them,
    grows to their size, and becomes a Lo'lhilin.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The available taxonomy list has no direct giant-transformation category.
- id: motif:5
  label: returning brothers and boat fixed on a cliff as an etiological remnant
  taxonomy_refs: []
  basis: The transformed youngest brother places the seven brothers and their boat
    high on a cliff, and the tale says they are still there.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not explain the physical feature beyond the statement
    that they remain there.
- id: motif:6
  label: vowed human sacrifice to the sea in exchange for survival
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: During a storm, the father promises first a valuable dog and then his youngest
    daughter to the sea; the sea calms, and he later kills the daughter on the shore
    to fulfill the promise.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage presents the vow and sacrifice directly, but does not state
    ritual context outside the tale.
- id: motif:7
  label: sacrificial death reversed by Sea-Being and followed by supernatural marriage
  taxonomy_refs:
  - death_rebirth
  - resurrection
  - sacred_marriage
  basis: The sacrificed daughter lies lifeless, is awakened by a Sea-Being, is taken
    to his house, and marries him.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The text describes awakening after apparent death; whether to classify
    this as resurrection or death-rebirth should be reviewed.
- id: motif:8
  label: daughter’s reciprocal revenge sends sacrificing father to the sea
  taxonomy_refs: []
  basis: After surviving as the Sea-Being’s wife, the daughter leads her father to
    the cliff edge, pushes him down, and he is taken by the sea.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage does not explicitly frame the act as revenge, although it
    follows the father’s sacrifice of her.
