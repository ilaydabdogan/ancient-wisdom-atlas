canonical_text:
  quote: ''
  summary: The passage first recounts a woman descending from the upper world with
    small pieces of a household and provisions, using them to create a shore house,
    and reuniting with her daughters. Tale 8 tells of a youngest brother taken by
    a giant as a toy, raised among giant children, transformed into a giant, and placing
    his returning brothers and their boat on a cliff. Tale 9 tells of a Maritime man
    who promises his youngest daughter to the sea to calm a storm, sacrifices her
    on the shore, after which a Sea-Being revives and marries her; she later causes
    her father to fall from a cliff into the sea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An upper-world male cuts small pieces from an outer tent, a sleeping-room,
    and bags of provisions, gives them to a woman, and tells her to put them in a
    mitten.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman descends along a sun-ray from the upper world; she thinks it is
    a steep rock, but the narration says it is a separate world.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: On earth, the woman takes the pieces from the mitten and spits on them; a
    house with bags of meat and various foods is created on the shore.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two young girls are gathering seaweed on the beach; the woman recognizes them
    as her daughters, says she is their living mother returned to them, and gives
    them spotted fawn-skin clothes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The daughters return home, ignore the step-mother’s questions, and throw seaweed
    into the sleeping-room; the step-mother sees their clothes, follows them, sees
    the large food-filled house, and envies them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In “The Giant,” eight brothers are introduced; seven paddle away in a skin
    boat while the youngest stays home and goes angling.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Lo'lhilin, described as a big man, catches the youngest brother, carries him
    on his palm, and presents him to his wife as a toy for their children.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The giant children play with the living toy and feed it; the captive grows
    to their size and becomes a Lo'lhilin.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the seven brothers return and call for the youngest, he comes, takes
    them up with their boat, and puts all of them high on a cliff, where the narration
    says they remain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A note reports that the informant said “The Giant” was of Eskimo or Ai'wan
    origin, while the editor states that Chukchee and Asiatic Eskimo folklore are
    difficult to separate.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: In “Sacrifice to the Sea,” a Maritime man with eight children, the youngest
    a girl, is carried out to sea by a storm while hunting walrus.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The man asks the sea to calm so he may live, first promising a leading spotted
    dog and then promising his youngest unmarried daughter in spotted skins; after
    the second promise, the sea smooths down.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The father takes his daughter by the hand to the seashore, addresses the sea,
    pierces her with a spear, and leaves her body on the shore amid abundant blood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A Sea-Being comes to the lifeless daughter, tells her to get up and go home,
    and she awakens saying she has slept long; he takes her to his house and marries
    her.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The mother later finds blood-stains but no body, follows footprints along
    the seashore and up a cliff, and finds a settlement where her daughter is scraping
    skins.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The daughter brings her father to the cliff edge, points out the rough sea
    below, pushes him from behind, and he falls, breaks his back, and is taken by
    the sea.
  category: action
  evidence_refs:
  - ev:10
