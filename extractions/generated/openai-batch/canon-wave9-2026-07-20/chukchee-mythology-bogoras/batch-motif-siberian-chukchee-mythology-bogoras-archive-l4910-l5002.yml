canonical_text:
  quote: ''
  summary: Raven witnesses the sudden birth of male twins. He then seeks to create
    the earth, encounters beings made from dust where sky and ground meet, and makes
    land, fresh water, mountains, animals, and food sources. Later, after male people
    exist without women, Spider-Woman descends from above and gives birth to four
    daughters who become women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven's wife is delivered suddenly and gives birth to male twins after Raven
    looks again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother and children have bodies like humans, while Raven retains a raven
    body; the children laugh at him and push him with their feet until their mother
    tells them to obey and stop laughing.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raven says that men have been created and announces that he will try to create
    the earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Raven asks benevolent beings and named sky or time beings for advice, but
    receives no advice or answer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the place where sky and ground come together, Raven finds a hollow with
    a tent full of noisy naked people.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A speaker from the tent says they were created from dust caused by the friction
    of sky and ground and will become the first seed of peoples on earth, though there
    is not yet earth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Raven flies with the speaking man and defecates; each piece falling on water
    quickly grows into land, including continent and islands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The companion says land is still insufficient because there is no fresh water
    and no mountains.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Raven urinates, and drops become lakes while jets become rivers; then hard
    excrement becomes mountains and hills.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The companion warns that water may someday increase and submerge the land,
    so Raven creates more ground until mountain-tops would remain above a flood.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Raven chops various trees and throws chips into water; chips from different
    trees become walrus, seals, polar bears, whales, sea creatures, fish, crabs, worms,
    wild reindeer, foxes, bears, and other game.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Raven's children become men, separate, build houses, hunt, and become people,
    but they are all male and cannot multiply.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Spider-Woman descends from above on a slender thread because people are only
    male and lack females.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Spider-Woman's abdomen enlarges; she becomes pregnant and gives birth to four
    daughters who quickly grow into women.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The man who had flown with Raven sees the women, wants one as a companion
    because living singly is uncomfortable, and promises to feed her abundantly.
  category: speech
  evidence_refs:
  - ev:10
