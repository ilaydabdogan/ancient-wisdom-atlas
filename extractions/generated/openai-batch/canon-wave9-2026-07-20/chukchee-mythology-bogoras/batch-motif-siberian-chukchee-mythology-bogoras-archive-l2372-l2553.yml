candidate_motifs:
- id: motif:1
  label: Prohibited container opened with destructive result
  taxonomy_refs:
  - forbidden_knowledge
  basis: The woman is expressly told not to open or pry into a trunk, opens it after
    the husband leaves, sees the hidden woman, and the hidden woman dies; the husband
    later reproaches her disobedience.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage emphasizes disobedience and prying rather than acquisition
    of forbidden knowledge in an explicit doctrinal sense.
- id: motif:2
  label: Self-acting food vessel linked to hidden being and ritualized boot action
  taxonomy_refs: []
  basis: A dish appears by itself after boots are thrown outside; after the trunk-woman
    dies, the dish does not appear; after she is revived, she shoves in the dish.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:6
  confidence: medium
  cautions: The causal relation between the hidden woman and the dish is strongly
    suggested by sequence and dialogue but not fully explained in the passage.
- id: motif:3
  label: Drum-mediated revival
  taxonomy_refs:
  - resurrection
  basis: The trunk-woman dies and falls down; the husband drums on his drum, and she
    revives.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: This is a single revival episode within the narrative, not a broad resurrection
    doctrine.
- id: motif:4
  label: Forced marriage to a ke'lE and escape from nonhuman spouse
  taxonomy_refs: []
  basis: The woman says her father gave her to a ke'lE; she lives with a husband whose
    food and house differ from hers, and she later flees while he pursues.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage names the spouse as ke'lE but does not define the category
