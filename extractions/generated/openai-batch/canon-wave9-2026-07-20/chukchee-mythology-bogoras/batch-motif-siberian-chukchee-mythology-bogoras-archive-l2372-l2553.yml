canonical_text:
  quote: ''
  summary: A deserted woman marries a man whose household includes a self-appearing
    dish and a forbidden trunk containing a split-faced woman. After opening the trunk
    and causing the hidden woman to die, she is sent back to her father. Her father
    gives her to a ke'lE husband who lives in a stone house, eats worms, and brings
    improper or horrifying foods. With help from Small Fox, a spider-web thread, Small-Spider-Woman,
    the Upper People, and the Polar Star, she escapes upward while the ke'lE pursues
    her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman says she has no master and has been deserted by her husband, cast
    off, and starved.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man marries the woman and instructs her not to leave the inner room; when
    they enter, she is to throw his boots into the outer tent.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the boots are thrown outside, a dish appears by itself filled with cooked
    meat; in the morning the dish is clean and in order.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man kills a wild reindeer, plans a thanksgiving feast, tells the woman
    not to carry the charm-strings herself, and the charm-strings are found at the
    prepared reindeer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man tells the woman to leave a trunk unopened and not to pry into its
    contents.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the man leaves, the woman opens the trunk and sees another woman sitting
    inside, with one half of her face black and the other half red.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The newcomer makes a tongue sound; the woman in the trunk looks up, suddenly
    dies, and falls down.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the trunk-woman dies, the expected dish does not appear, and the husband
    questions whether the trunk has been opened.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The woman confesses that she looked at the trunk-woman and made a sound; the
    husband reproaches her for disobedience.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The husband drums, the trunk-woman revives, and she angrily shoves in the
    dish.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The husband sends the woman back to her father, saying he cannot keep watch
    over her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The father considers marrying her to an earthly man, then asks whether she
    will marry a ke'lE; a man later comes and takes her to his stone home where there
    are worms and where he feeds on worms.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The woman repeatedly rejects foods brought by the ke'lE as unsuitable or disgusting,
    including worms, a mouse, a sea-worm, a marmot, and a lady-bug; she eats from
    a stranded carcass brought from the sea.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The woman gives birth to a child; the ke'lE brings a human body for food,
    and it is identified as her brother's body.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Small Fox visits the crying woman and instructs her to make ornamented boots,
    throw them down before the ke'lE rather than hand them to him, and wait for a
    spider-web thread to descend.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: When the ke'lE examines the ornamented boots, he does not hear the woman trying
    to speak; she goes out, sees the spider-web thread, and is hauled up.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The woman's husband pursues her; she is taken to Small-Spider-Woman, who tells
    him that the woman has passed by to the Upper People.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: The woman comes to the Polar Star, says a pursuer is overtaking her, and is
    concealed in an elongated ray of light like a funnel.
  category: sequence
  evidence_refs:
  - ev:11
