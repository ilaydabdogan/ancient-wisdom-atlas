- id: motif:5
  label: Animal and spider helpers enable escape by trick and ascent
  taxonomy_refs:
  - trickster_boundary
  basis: Small Fox instructs the woman in a boot trick that leads to the descent of
    a spider-web thread; she is hauled upward and received by Small-Spider-Woman,
    who misdirects the pursuer.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage presents helper and deception functions, but does not explicitly
    label Small Fox or Small-Spider-Woman as tricksters.
- id: motif:6
  label: Ascent to Upper People and celestial refuge
  taxonomy_refs:
  - ascent
  basis: The woman is hauled up by a spider-web thread, the pursuer ascends toward
