canonical_text:
  quote: ''
  summary: The passage contains an unfinished tale in which a reindeer-born child
    rapidly grows, consumes reindeer by making them enter his mouth, and causes a
    young man to flee to a cannibal woman's house, where he rejects human food and
    marries her conditionally. It also includes the beginning of a Hare story in which
    Hare visits Man-Slayer and is threatened with being killed and cooked.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man's son tends the reindeer herd and sees an abscess on a reindeer-doe's
    ear; his father refuses the son's suggestion to kill the doe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the third evening, the son hears a small infant crying at the herd; the
    infant is called Reindeer-Born.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The infant is very heavy when carried home and grows rapidly, walking within
    three days and wanting to go to the herd on the fourth day.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The father orders that Reindeer-Born be taken as an assistant herdsman.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Reindeer-Born commands his mouth to open and commands reindeer to enter it;
    reindeer are missing the next morning.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Reindeer-Born says wolves drove the missing reindeer away, but the young man
    notes that there are no wolf tracks in the snow.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: The young man tells his parents that Reindeer-Born is destroying the herd
    and leaves because he fears Reindeer-Born will also eat him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After running away, the young man finds a house where human carcasses hang
    by the hair on supports.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: A woman greets the young man as a guest, takes down a human carcass, and says
    she will cook it for him; he refuses this food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The woman brings a large reindeer herd, slaughters a fat reindeer, and uses
    a new kettle after the young man refuses to have the meat cooked in her old kettle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The woman asks the young man to marry her; he says he will marry her if she
    stops eating such food, and they marry.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The young man cries while thinking of his father and mother, but tells the
    woman that a stunted willow whipped him; she beats the bushes with an iron pan-shovel.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A note states that the tale was left unfinished and that the narrator knew
