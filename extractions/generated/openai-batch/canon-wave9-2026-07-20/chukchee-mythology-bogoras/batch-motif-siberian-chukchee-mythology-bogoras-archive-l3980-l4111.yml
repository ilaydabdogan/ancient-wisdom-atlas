canonical_text:
  quote: ''
  summary: 'The passage closes a conflict tale in which a chained dog wakes and helps
    its master against ke''let, followed by the master''s later fatal attack on Nota''rme.
    It then gives a sick-person incantation: a ritual speaker calls the Man from the
    Upper Region as an assistant, symbolically represents him with splinters, equips
    him with celestial reindeer and a whip, and sends him to search among Ground-Beings,
    Upper Beings, and Darkness. The patient, who has died, is found in Darkness, brought
    back as a soul, revived, clothed with protective clothing from Morning Dawn, smeared
    with ochre, and fully recovers. A game-calling incantation follows, using pintail
    ducks as leaders, a reindeer-buck, water, and soot on the caller''s face to make
    game appear while making the caller unrecognizable.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tno'tirgin's people and neighbors sleep so soundly that they do not hear the
    chained dog's loud barking.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dog breaks its chain, rushes to its sleeping master, bites his finger,
    and wakes him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After waking, the master and the dog kill many ke'let, while Nota'rme flees
    and Tno'tirgin's people remain safe at that point.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: In a later year Tno'tirgin goes to Nota'rme's place to fight; he refuses a
    meal, and Nota'rme kills him and murders his people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: For a sick person, the incantation calls the Man from the Upper Region to
    come down and serve as an assistant in searching.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ritual speaker picks up a small object such as a splinter of wood and
    treats it as the Man from the Upper Region.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speaker asks Front-Head, identified as Arcturus, for reindeer-bucks and
    asks Rultennin, identified as Orion, for a whip for the assistant's journey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The assistant-searcher visits the Ground-Beings and Upper Beings, who say
    that the missing person is not with them and that they do not know where he is.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the patient has died, the searcher goes among the people of Darkness
    and finds the missing person there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The searcher takes the found person home; the text explains this as bringing
    back the soul and making it retrace its way.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The ritual speaker uses another splinter, blows into the patient's ear or
    scratches his head, puts the splinter under the pillow, and the dead person regains
    breath, voice, and a sitting posture.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: The speaker asks Morning Dawn for clothes, dresses the patient in clothes
    described as unassailable by the ke'let, and has the patient smeared with ochre
    before complete recovery.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The game-calling incantation calls every kind of game and living thing, uses
    pintail ducks as leaders, and makes a lone reindeer-buck wade into water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The game-caller covers his face with soot so that he becomes unknown and unrecognizable
    to game; only the soot appears to them.
  category: attribute
  evidence_refs:
  - ev:9
