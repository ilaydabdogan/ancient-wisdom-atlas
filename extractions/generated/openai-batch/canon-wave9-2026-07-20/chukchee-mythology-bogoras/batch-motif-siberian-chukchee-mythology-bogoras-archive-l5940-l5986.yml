canonical_text:
  quote: ''
  summary: An old couple repeatedly lose their natural children. A boy emerges from
    a tumor on a reindeer buck and is suckled by the wife, but later secretly eats
    the herd. The couple flee to a large Thunder-Bird, who shelters them inside his
    mouth, where they find a house and have three surviving sons. The tumor-born boy
    pursues them, enters the Thunder-Bird's mouth, and is crushed. The family returns;
    reindeer-excrement gathered by the old man becomes a large herd after five days,
    and the family prospers into a settlement.
  language: English
  quote_policy: summarized
