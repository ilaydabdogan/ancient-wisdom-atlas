canonical_text:
  quote: ''
  summary: 'The passage contains several Chukchee mythic episodes: Raven instructs
    a primordial couple in copulation and human multiplication; Creator and his wife
    form land, waters, animals, and humans from a watery beginning; Raven emerges
    from an outer garment and is exposed as not self-created; Raven arranges landforms
    from stones; and Hare restores the stolen sun with Eagle''s help against the ke''let.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven sees a man and woman sleeping separately in opposite corners and says
    this is bad because they cannot multiply.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raven copulates with the woman, instructs the man how to copulate, and the
    narration says human kind multiplied in this manner.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Creator and his wife initially live where there is no land or mountains,
    only water, sky, and a small piece of ground large enough for sleeping.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Creator and his wife dig the ground with spades and throw it around; a
    large ditch receives the water and becomes the sea, while lakes and rivers remain
    in hollows and clefts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After forming the land and waters, the Creator and his wife create animals
    and men, leave, and forget to create Raven.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Raven comes out at night from a large outer garment left at the camping place
    and tells the Creator that he is Ku'urkil, the self-created one.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After Raven eats fly-agaric, he declares that he is the son of the ni'glon,
    and the Creator says Raven is a liar and one of his creations.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: While arranging the earth, Raven carries stones, becomes fatigued, throws
    them down one by one, and the stones become islands and cliffs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the olden time the earth is dark because the ke'let have stolen the sun
    and are playing ball with it in their house.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Hare enters the ke'let tent, kicks the sun upward through the vent-hole so
    that it sticks to the sky, and then flees.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Hare asks Eagle to hide him; Eagle hides Hare in his right armpit and tells
    the pursuing ke'lE that Hare climbed toward the zenith.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Eagle carries the ke'lE upward, repeatedly asks how large the earth appears,
    and finally drops the ke'lE, who falls and enters the ground head first up to
    the waist.
  category: sequence
  evidence_refs:
  - ev:7
