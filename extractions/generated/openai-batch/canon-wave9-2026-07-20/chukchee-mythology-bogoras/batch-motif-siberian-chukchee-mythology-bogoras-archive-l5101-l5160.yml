canonical_text:
  quote: ''
  summary: The passage first recounts Hare using a stone maul to drive a ke'lE completely
    into the ground, explaining why ke'let move beneath the earth. It then begins
    a Raven-cycle story in which Wolverene's household abuses Raven's daughter, conceals
    her identity, and deceives Raven into striking her. Raven's shaman son later visits,
    recognizes his sister, refuses to beat her, gives her a usable knife, and cuts
    the thread binding her tongue.
  language: English
  quote_policy: summarized
