canonical_text:
  quote: ''
  summary: The passage contains the end of one tale in which a hunter shelters in
    an underground house with a strange one-eyed woman, discovers dangerous teeth
    in her body, removes them with stones, then takes her home as a slave. It then
    begins tale 11, “Reindeer-Born,” in which a boy is born from a tumor on a reindeer
    buck, proves to be a destructive ke'lE, devours family members and reindeer, and
    causes a herdsman to flee upward through a tree to the country of his Sacrifice-receiving
    Being, a woman who offers marriage because of his past sacrifices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man hunting wild reindeer fails to find game, becomes cold at evening, follows
    sledge tracks, hears a dog, and reaches an underground house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inside the underground house, a strange-looking woman cooks seal-meat over
    a lamp and is described with one eye in her forehead, a large awry mouth, a stout
    body, and large breasts.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman says she has found a husband; the man privately decides not to marry
    her because her face looks strange.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At night the woman repeatedly asks the man to sleep with her; he refuses or
    postpones, and she asks him at least to louse her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man hears something in the woman’s body grinding its teeth like a dog
    and later sees teeth there described as like a wolf’s mouth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man takes two long round stones from the seashore and uses them to remove
    the teeth and the membrane holding their roots from the woman’s genital opening.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the teeth are removed, the man has intercourse with the woman; she becomes
    peaceful, and he takes her home as a house-slave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the tale “Reindeer-Born,” an old man with a large herd has six sons who
    watch the herd.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: A tumor grows for nine days on the neck of the largest buck, bursts, and a
    walking infant boy in a combination-suit and diaper drops from it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The elder son wants to kill the strange reindeer and boy, but the old man
    forbids it, suggesting the boy may be the real master or protecting genius of
    the herd.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: During a storm, the infant is identified as a ke'lE, exterminates the family,
    rushes toward the herd, and swallows reindeer he catches.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The herdsman abandons the herd, flees across the tundra, climbs a large tree,
    and drops upward into the country of his own Sacrifice-receiving Being.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the upper country, a single strong woman in a large house receives him,
    hears he is from the lower space, and offers marriage because he has long brought
    sacrifices to her.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
