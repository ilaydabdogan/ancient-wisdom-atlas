canonical_text:
  quote: ''
  summary: 'The passage introduces Chukchee proverbs, riddles, word-games, and short
    comic tales, with editorial notes that the riddles were collected among River
    Chukchee on the Middle Anadyr and probably show Russian influence. It then begins
    a Raven creation tale: self-created Raven, Ku''urkil, and his wife live alone
    on a small ground with no other living beings. The wife urges Raven to create
    the earth; when he says he cannot, she says she will try to create a companion.
    As she sleeps, Raven watches her raven body change toward a humanlike form, her
    abdomen enlarge, and creation occur without effort, while he remains raven-bodied
    and frightened.'
  language: English
  quote_policy: summarized
