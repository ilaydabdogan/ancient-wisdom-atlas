canonical_text:
  quote: ''
  summary: A petitioner asks the Zenith for his wife, who is said to have entered
    a long ray of light. He attempts to ascend, fails, and repeatedly offers spells,
    a stone house, Game-Substance, hunting and harmful incantations, and disease in
    exchange for her. The Zenith/Creator/Polar Star refuses, says he protects and
    feeds the Lower People, distributes game according to offerings, and accuses the
    petitioner of harmful acts. The Creator has his wife open a trunk, puts the petitioner
    inside, and the sky becomes dark; opening and closing the trunk changes brightness
    and snowstorm conditions. The petitioner finally submits, offers to become a servant,
    and promises to cease pursuing his wife.
  language: English
  quote_policy: summarized
