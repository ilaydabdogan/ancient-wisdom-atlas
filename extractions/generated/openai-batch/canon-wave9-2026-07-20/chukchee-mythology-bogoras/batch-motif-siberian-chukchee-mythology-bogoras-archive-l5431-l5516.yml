candidate_motifs:
- id: motif:1
  label: Return of one declared dead
  taxonomy_refs:
  - return
  basis: The Ai'wanat had said the woman was dead, but she comes back to her father's
    camp, identifies herself, and is joyfully received.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage begins mid-narrative, so the full circumstances of her absence
    are outside the excerpt.
- id: motif:2
  label: Speaking animal gives ritual instruction
  taxonomy_refs:
  - wisdom
  basis: The woman's reindeer speaks and instructs her about how to perform the blood
    anointing upon arrival.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The excerpt gives only the reindeer's advice and not a broader explanation
    of the animal's status.
- id: motif:3
  label: Reindeer blood anointing-sacrifice
  taxonomy_refs:
  - sacrifice
  basis: The passage explicitly describes an anointing-sacrifice involving reindeer
    blood and emphasizes that the woman must use her own reindeer.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The ritual's wider ceremonial meaning is not explained within this passage.
- id: motif:4
  label: Person swallowed by whale and emerging after cutting out
  taxonomy_refs: []
  basis: The Ai'wan is swallowed by a whale, remains alive inside, cuts the whale
    internally, and escapes by cutting through its side after it strands.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The figure is an antagonist rather than a heroic protagonist, so broader
    'hero descent' classification is not assigned.
- id: motif:5
  label: Punitive revenge against herd-slaughterer
  taxonomy_refs: []
  basis: The returned woman accuses the Ai'wan of wantonly slaughtering her herd,
    and women bind and kill him.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage presents the punishment literally; it does not frame it as
    divine judgment.
- id: motif:6
  label: Dog-born orphan grows rapidly into hunter
  taxonomy_refs:
  - miraculous_child
  basis: The orphan is born from a dog-woman, wears dogskin, grows up very fast, and
    becomes a capable hunter.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage does not describe the birth event itself, only the orphan's
    origin and rapid growth.
- id: motif:7
  label: Bride won or tested through running contest
  taxonomy_refs: []
  basis: The only daughter rejects many suitors through running-matches, and the orphan
