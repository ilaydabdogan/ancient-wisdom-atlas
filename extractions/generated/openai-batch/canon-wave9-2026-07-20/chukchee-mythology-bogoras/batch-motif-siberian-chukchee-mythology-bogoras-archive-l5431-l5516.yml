  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage ends before the outcome of the orphan's race is given.
- id: motif:8
  label: Humble mocked orphan becomes marriage candidate
  taxonomy_refs: []
  basis: The orphan is mocked by neighboring children, but grows into a hunter and
