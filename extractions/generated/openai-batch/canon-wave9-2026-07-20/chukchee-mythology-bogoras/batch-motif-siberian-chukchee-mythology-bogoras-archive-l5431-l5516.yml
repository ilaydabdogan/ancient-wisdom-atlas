canonical_text:
  quote: ''
  summary: A woman returns to her father's camp with a single reindeer after having
    been declared dead by the Ai'wanat. A speaking reindeer tells her to use her own
    reindeer for blood anointing. Her family recognizes her and rejoices. Her Ai'wan
    husband, described as violent and as a slaughterer of reindeer, is swallowed by
    a whale while traveling by canoe; he survives inside by cutting and eating the
    whale's intestines until the whale dies and strands near the camp. He cuts his
    way out and repeats the claim that the woman died and the herd was destroyed.
    The woman appears, accuses him of slaughtering her herd, and women bind and kill
    him by cutting flesh from his bones. The passage then begins a new tale, 'The
    Orphan,' about an able-bodied daughter who hunts and rejects suitors by outrunning
    them, and a dog-woman-born orphan boy who grows quickly, feeds an old woman through
    hunting, and comes to seek the daughter as a bride.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman descends through a hole and walks with a single reindeer; the reindeer
    speaks and instructs her not to accept blood anointing from others' reindeer but
    to anoint herself from her own reindeer.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman reaches her family's camp in the early morning, sits on a sledge,
    and sings outside the tent rather than entering it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Her mother and a second daughter recognize the song as belonging to the one
    believed deceased, because the Ai'wanat had said the woman was dead and the herd
    was gone.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The returned woman identifies herself as the daughter who had been given away
    to the Ai'wanat, and her father and family respond with gladness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman tells the family not to bring the herd for the anointing-sacrifice
    and says she will anoint from her own reindeer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Ai'wan husband, described as an old man's son, a violence-doer, and a
    slaughterer of reindeer, travels by canoe toward an island in the bay with a long
    harpoon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A very large whale swallows the Ai'wan; he remains inside in darkness, cuts
    the whale's intestines with a knife, eats them raw, and fouls the whale's bowels.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The whale suffers, dies, drifts around the Ai'wanat land, and strands near
    the shore where the reindeer-breeder lives; the Ai'wan cuts through the whale's
    side and gets out.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After emerging, the Ai'wan recognizes the houses and tells the old man he
    was swallowed by a whale, while also repeating that the woman died and the herd
    was destroyed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The woman conceals herself, appears after a meal, accuses the Ai'wan of wantonly
    slaughtering her herd, and says she will also try violence.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Women catch the Ai'wan, strip and bind him, cut flesh from his bones slice
    by slice while he is still alive, and he dies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the following tale, an only daughter of old parents hunts wild reindeer,
    refuses many suitors, and tests them with running-matches that she wins.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: An orphan boy clad in dogskin, born from a dog-woman, lives with an old woman,
    grows quickly, hunts small birds with a small bow, and is mocked by neighboring
    children.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The orphan later makes dead-falls, catches hares and wild reindeer, is told
    by the old woman to look for a wife, and comes as a suitor to the family with
    the only daughter.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The only daughter initially rejects the orphan suitor, but a running test
    is arranged for the next morning, and they start running before daybreak.
  category: sequence
  evidence_refs:
  - ev:9
