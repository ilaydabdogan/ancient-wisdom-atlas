canonical_text:
  quote: ''
  summary: The passage contains the end of one tale, in which a rich Ai'wan is tortured,
    ransoms himself with family and property, and an Ai'wan old woman is killed by
    being tied to an unbroken reindeer, followed by the master's reindeer-like death.
    It then gives the tale 'The Visit of the Ke'let,' where a corpse warns a woman
    that ke'let are coming; she sacrifices a little dog and draws a blood line around
    the house, which the ke'let perceive as deep water and leave. The passage then
    begins 'The Child-Monster,' describing an underground group-marriage household,
    an absent husband, and a young mother who gives birth but refuses to bring the
    infant out as required.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A rich Ai'wan is seized, carried outside, stretched on a dung-hill, fastened
    to the ground with spikes, and subjected each morning to neighbors pouring chamber-vessel
    contents into his mouth; he remains alive.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The captive offers wives, riches, and children; after being unbound, he gives
    wives and children, with the children serving as reindeer-herdsmen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A small Ai'wan old woman, described as the mother of the Ai'wan and as one
    who formerly used evil charms, is undressed and tied by the ankle to an unbroken
    reindeer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In winter the reindeer drags the old woman to the herd and open country, returns
    with her backbone and body destroyed, and only her legs remain unbroken before
    the reindeer is unharnessed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before the reindeer is freed, it falls down and dies; afterward the master
    coughs and tears the ground in a reindeer-like manner, falls swooning, and dies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In 'The Visit of the Ke'let,' a small house stands alone in the wilderness;
    a woman and her children are at home while the husband is with the herd, and a
    corpse lies at a funeral place behind the house.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The corpse speaks to the woman, identifies himself as a neighbor, and warns
    that ke'let are near and coming to visit.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Following the corpse's instruction, the woman carries out a tiny dog, slaughters
    it behind the house, and draws a blood line all around the house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The ke'let speak as if the house is across water or on an island; one thrusts
    down a spear-shaft, cannot touch the ground, calls it deep, and they leave.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The husband returns, sees the slaughtered dog by the entrance, enters the
    house, and the woman tells him in the sleeping-room that all are safe.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'In ''The Child-Monster,'' people live in an underground house with three
    sleeping-rooms: the son''s on the east, the father''s on the west, and another
    man''s in the middle on the rear side; the household is described as group-marriage.'
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The woman of the eastern sleeping-room is pregnant while her husband is away
    on a long visit, gives birth in his absence, and does not go out or carry the
    infant out at dawn as required by the ceremonial.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Others repeatedly call for the woman to come out and bring the infant, but
    she does not obey; later all the people in the house and two suitors serving for
    the old man's unmarried daughter go to sleep.
  category: sequence
  evidence_refs:
  - ev:11
