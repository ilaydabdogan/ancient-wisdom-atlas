canonical_text:
  quote: ''
  summary: An elder son leaves home after his father beats him. The father pursues,
    sees the son's breath from a larch tree, and gives detailed instructions for crossing
    tundra and sea ice. The young man crosses breaking ice floes to another shore,
    makes a fire, and finds that roasted small birds become rich wild-sheep meat when
    he remembers his father's words.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man and old woman have two sons; the elder son breaks a whetstone while
    sharpening his knife, and the father beats him with a spear-shaft until the shaft
    breaks.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder son makes a bow and blunt arrow for his younger brother, tells him
    to shoot the arrow when he yearns for him, leaves, and is seen no more at home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The younger boy cries from yearning for his elder brother and reports that
    the elder brother said he was going far away and would never come back.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old man asks for his boots, puts them on, and pursues his son, who is
    already far ahead beyond woods toward open tundra.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: From the last larch tree at the forest border, the old man sees a small streamlet
    of breath that belongs to his son and calls him to stop and listen.
  category: setting
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The father instructs the young man to cross tundra and sea, jump between breaking
    ice floes, reach a last ice-floe emerging from black waters, and address it so
    that it will carry him to land.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The father says that, once ashore, the young man should kill anything he meets
    for food, including a snow-bunting or a white wagtail, and should not fear reindeer
    that speak like people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The young man reaches the sea, crosses while the ice breaks around him, jumps
    from floe to floe, lands on a final floe, and comes to dry land.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: On land, the young man makes a fire, hangs his wet clothes to dry, kills a
    snow-bunting, roasts it, first sees only dried skin, remembers his father's words,
    and finds a fat wild-sheep brisket on the spit.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The young man then kills and roasts a wagtail, sleeps, sees only dried skin,
    remembers his father's words, and finds a fat wild-sheep tenderloin on the spit.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The editorial footnote says these stories were collected among Russianized
