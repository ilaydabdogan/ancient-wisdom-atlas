canonical_text:
  quote: ''
  summary: Cough persuades Rheum to enter first; Rheum is caught, identifies himself
    and Cough, and promises a dog in exchange for his life. Rheum sends a long-eared
    dog through a female dog. The dog later protects Rigowa'u and his family from
    ke'let, rescues the master, warns the wife to flee with the children, and is associated
    with a house that is turned to stone by a ke'lE after its lamp-like eye is cut.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cough repeatedly tells Rheum to enter and says that Rheum belongs to the nose.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rheum finally enters, is caught, cries out in fear, and Cough flees.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When questioned, Rheum says that he enters into the noses of men and identifies
    the other being as Cough.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After being threatened with death, Rheum asks not to be killed and promises
    to give a dog.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rigowa'u follows Rheum to his house, where a dog is tied near the house and
    has ears reaching to the ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rheum says he will send the dog through a female dog; after Rigowa'u returns
    home, the female dog becomes pregnant and bears pups, including the long-eared
    one.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The long-eared dog is tied with a strong rib of whale as its tying-stick and
    barks every evening so loudly that it can be heard from a distant land.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: At night the ke'let put a net around the tent and poke under the tent-covers
    with driving-rods so that the little souls should come out.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The dog snaps its tying-stick, goes out, barks loudly, and wants to attack
    the ke'let; the ke'let release their own large dog.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The long-eared dog carries its sleeping master out with its mouth; the master
    awakens, strikes at the ke'let with a stick, and kills many or all of them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Rigowa'u later goes to a neighboring camp and leaves one dog with his wife;
    a ke'te or ke'lE comes from the direction of sunset, and the dog speaks instructions
    about the sledge, children, and harness.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The woman harnesses the dog, departs eastward with the children, and leaves
    the house; the ke'lE then enters the house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: When the husband returns with meat, his dogs refuse to approach the house,
    and he infers that ke'let may be visiting his people.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The husband cuts a lamp-like eye of the ke'lE; eye-fluid spurts out, and when
    the ke'lE looks back at the house, the house becomes stone.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The husband follows the runner tracks of his wife's sledge and finds his family
    alive; they say the dog saved them, and they later see the stone house with things
    scattered inside.
  category: sequence
  evidence_refs:
  - ev:11
