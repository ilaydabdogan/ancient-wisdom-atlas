canonical_text:
  quote: ''
  summary: A powerful house-master associated with a sealing scene hosts visiting
    brothers in a jaw-bone house and repeatedly tries to kill them during a thanksgiving
    ceremonial by extinguishing lamps and using blood-marked stones, whalebone slabs,
    sling-stones, and a dancing woman. The guests evade the attacks; the eldest brother
    then performs his own dance and brings a mountain stone into the house, killing
    the host. A neighbor rejoices because the host had robbed provisions, then warns
    the brothers how to pass dangerous seals on their route. The brothers follow the
    warning closely enough to spare one seal and kill only a permitted young thong-seal.
  language: English
  quote_policy: summarized
