canonical_text:
  quote: ''
  summary: An orphan boy living with his aged grandmother near Nuna s/mun is weak,
    scabbed, and hungry. A ke'lE comes to him in darkness, feeds him with a small
    piece of dried meat that grows as he eats, and instructs him to cross the sea
    to take the young wife of a bad murderous ke'lE, using his eight uncles as paddlers.
    The grandmother is sent to summon the kin, is carried unexpectedly to Nuna s/mun,
    and the relatives prepare a skin boat with new walrus hides. The ke'lE later returns
    to the still-weak boy and tells him to wash with liquid placed in a chamber-vessel.
  language: English
  quote_policy: summarized
