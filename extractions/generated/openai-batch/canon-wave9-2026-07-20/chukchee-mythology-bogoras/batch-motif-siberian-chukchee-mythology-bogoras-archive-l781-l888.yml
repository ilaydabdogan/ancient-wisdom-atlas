canonical_text:
  quote: ''
  summary: 'The passage first recounts a shamanic escape from a ke''lE-woman: a decoy
    mannikin is made, the house is burned, an animated tongue pursues the fleeing
    human pair, and successive barriers are created until a soot river stops the pursuer.
    It then gives a celestial aftermath involving the Morning Dawn, moon sacrifice,
    and sources of affliction. A second tale begins with a late-born son who builds
    a boat, defeats an island opponent through a deceptive liver-eating contest, and
    kills an old ke''lE-woman in a jaw-bone house.'
  language: English
  quote_policy: summarized
