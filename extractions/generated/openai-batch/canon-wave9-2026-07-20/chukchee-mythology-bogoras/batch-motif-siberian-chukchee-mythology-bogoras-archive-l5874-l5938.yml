canonical_text:
  quote: ''
  summary: A man in the upper country longs to see his former home, family, country,
    and herd. His wife permits the visit and gives him a many-legged reindeer for
    flight. On earth he encounters a ke'lE in his tent, escapes by putting it asleep
    and using an ash-filled garment as a decoy, flees on the reindeer, and climbs
    a tree associated with ascent. A bird calls two wolves, who enter the tree and
    kill the pursuing enemy. The man returns to his upper-country house with his wife
    and herd.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man becomes sad because he thinks of his former country, herd, family,
    father, and brothers; the woman recognizes this and tells him to visit them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman gives the man a many-legged reindeer described as a flight animal
    for an emergency, with instructions to cut off its legs one by one if pursued
    and finally to kill it if necessary.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man descends to earth toward his own tent, tethers the reindeer, and looks
    into the tent through a small hole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Inside the tent, the infant or ke'lE cuts off one of its own legs, roasts
    it over a large fire, and eats it piece by piece.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ke'lE tells the man that the other people are among the herd; the passage
    explicitly says that the ke'lE deceives him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The man louses the ke'lE and puts it fast asleep, then sees old human bones
    in the corner of the tent and decides to flee.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before fleeing, the man fills his outer garment with ashes and hangs it above
    the hearth as a decoy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the ke'lE strikes the hanging object with a knife, ashes fall into its
    mouth and eyes; the ke'lE then declares that it will pursue the man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: During the pursuit, the man cuts off reindeer legs and throws them down; the
    ke'lE eats them while the man flees farther.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: When the ke'lE again comes near, the man kills the reindeer, leaving it for
    the ke'lE to eat while he reaches the tree from which he had ascended before.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The man climbs to the top of the tree, while the ke'lE gnaws into the tree
    and ascends inside it from below upward.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:12
  text: A small bird on a bough responds to the man's plea for help and communicates
    his need to two big wolves.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: 'The wolves tell him to watch the blood color during their fight: red blood
    would mean theirs, while dark blood would mean the enemy is being killed.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The wolves enter the tree, fight the pursuer, and after red blood appears
    first, a stream of black blood follows; the wolves then report that they have
    killed the enemy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: After the enemy is killed, the man returns to his house in the upper country
    and lives there with his wife and herd.
  category: sequence
  evidence_refs:
  - ev:8
