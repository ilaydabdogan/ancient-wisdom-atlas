    used up.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: On a second attempt, reindeer with stone or obsidian hoofs come, and the young
    man reaches the top where he sees a small house.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Inside the house, a girl sleeps in an iron receptacle surrounded by a grating;
    the young man strips and defecates on or beneath her before lying down.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The girl wakes, scolds, and the young man answers by saying that he has defecated
