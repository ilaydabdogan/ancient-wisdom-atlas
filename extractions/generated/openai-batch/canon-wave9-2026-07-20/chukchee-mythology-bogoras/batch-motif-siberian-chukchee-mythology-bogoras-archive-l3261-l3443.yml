  evidence_refs:
  - ev:3
- id: obs:6
  text: In the tale of the Sky-Girl, an old father with five grown sons and a sixth
    younger son tells his sons to visit him after the third night at the funeral-place.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The older brothers dismiss the dead father as useless and do not visit him;
