    and beats his drum; the sleeping-room becomes as before while the outer tent remains
    stone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After a second command to close the eyes and another drum-beating, the stone
    house becomes an ordinary house.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The riches visible after the house is restored turn into dry leaves and boughs
