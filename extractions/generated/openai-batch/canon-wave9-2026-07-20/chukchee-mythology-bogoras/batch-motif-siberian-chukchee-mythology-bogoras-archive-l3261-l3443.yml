canonical_text:
  quote: ''
  summary: The passage first closes a fragment in which wealth emerges from a ke'te's
    abdomen, a shaman husband restores a stone sleeping-room and house by drum-beating,
    and the apparent riches become dry leaves and willow boughs. It then begins a
    tale of a youngest son who alone visits his dead father, receives advice to seek
    a bride among the Upper People, attempts and then completes an upward mountain
    journey with special reindeer, wakes and marries a sleeping girl of the Upper
    People, receives part of her father's herd, honors his dead father with slaughtered
    reindeer, and is challenged by his brothers to prove the marriage by bringing
    dangerous beings or animals.
  language: English
  quote_policy: summarized
