  locator: 4665-4674
  quote_or_summary: Nouroota'gin, a shaman, complains that women and boys of Ce'cin
    use his songs; he comes for his drum, rattles it, talks with an underground ke'lE,
    and the ke'lE will draw offenders underground by breath.
  source_text_path: texts/public-domain/siberian/project-gutenberg/chukchee-mythology-bogoras.md
  rights_note: Public domain; summary of supplied passage.
- id: ev:4
  type: summary
  locator: 4716-4725, song 14
  quote_or_summary: Song 14 says Nouroota'gin returns from Eu'nmun to Ce'cin; men,
    boys, and mocking women use or laugh at his words; he makes the drum reverberate
    and is called by a ke'lE from underground who threatens to draw someone down by
    breath.
  source_text_path: texts/public-domain/siberian/project-gutenberg/chukchee-mythology-bogoras.md
  rights_note: Public domain; summary of supplied passage.
- id: ev:5
  type: summary
  locator: 4675-4690
  quote_or_summary: The second song is partly Chukchee and partly Ai'wan Eskimo; Ei'mui
    begins in Chukchee and finishes in Eskimo, and proper names in the songs show
    Eskimo-influenced forms.
  source_text_path: texts/public-domain/siberian/project-gutenberg/chukchee-mythology-bogoras.md
  rights_note: Public domain; summary of supplied passage.
- id: ev:6
  type: summary
  locator: 4691-4704
  quote_or_summary: The editor describes the second song as a shaman travelling with
    two dogs near a large lake; a mocking ke'lE causes a delusion of cracked ice on
    a small river, but the crack closes and the shaman crosses.
  source_text_path: texts/public-domain/siberian/project-gutenberg/chukchee-mythology-bogoras.md
  rights_note: Public domain; summary of supplied passage.
- id: ev:7
  type: summary
  locator: 4705-4715
  quote_or_summary: The dogs are called tenneta't dogs; tenneta't is said to have
    no Chukchee meaning and to be a ke'lE-language word; the note compares spirit-language
    words in Chukchee and Eskimo incantations and performances.
  source_text_path: texts/public-domain/siberian/project-gutenberg/chukchee-mythology-bogoras.md
  rights_note: Public domain; summary of supplied passage.
- id: ev:8
  type: quote
  locator: 4732-4738, song 15
  quote_or_summary: A ke'lE-boy tells his mother to beckon the little traveller, wants
    him for a "spleen-companion," and mentions the traveller's two tenneta't dogs
    from near the lake.
  source_text_path: texts/public-domain/siberian/project-gutenberg/chukchee-mythology-bogoras.md
  rights_note: Public domain; brief summarized excerpt from supplied passage.
- id: ev:9
  type: quote
  locator: 4738-4742, song 15
  quote_or_summary: '"What shall I do with this fissure (in the ice)? Oh, it has closed
    of its own accord! I have gone across"; Wukwata''hin is addressed as having no
    pity.'
  source_text_path: texts/public-domain/siberian/project-gutenberg/chukchee-mythology-bogoras.md
  rights_note: Public domain; excerpt from supplied passage.
- id: ev:10
  type: quote
  locator: 4752-4755, song 16.1
  quote_or_summary: '"Big rock, move away! I want to see taivu''urgin. Big hummock,
