  label: Underground spirit draws an offender below by breath
  taxonomy_refs: []
  basis: The underground ke'lE threatens to draw the offender down from the bottom
    of the earth with his breath.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage gives a threat rather than a completed descent or abduction.
- id: motif:3
  label: Mocking spirit creates an apparent obstacle at an icy crossing
  taxonomy_refs:
