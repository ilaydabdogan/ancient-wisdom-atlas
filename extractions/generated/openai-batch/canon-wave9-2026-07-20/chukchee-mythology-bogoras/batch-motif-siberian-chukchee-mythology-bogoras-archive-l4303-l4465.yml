canonical_text:
  quote: ''
  summary: The passage describes Chukchee healing and death-related incantatory actions.
    A weak, near-death patient is carried outside, rubbed with snow, and treated by
    calls to upper-region waters and winds. Disease is represented as rubbish, rapids,
    a frozen bay, ice, sand, and material to be washed, broken, rolled up, or blown
    away. Qu'urkil the Raven, Sea-Wind, water, snow, saliva, grass, miniature offerings,
    and sacrifices are involved. A later segment describes a rite for a recently dead
    person in which Morning Dawn or the Upper Being is asked for a dog assistant,
    followed by blowing into the dead person's ear and howling like a dog.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A weak man who is near death is carried out of the house and rubbed over,
    for example with snow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ritual speaker calls to the Upper Regions, the Pebble River, and the East
    Wind, asking for assistance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rain comes, the river swells, the patient is described as becoming the rapids,
    a sacrifice is thrown into the water, rubbish is swept away, and the patient is
    carried back better.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker calls Qu'urkil and describes his own abdomen or stomach as a frozen
    bay, old ice-floe, and bad ice-floe containing rubbish identified with stomach
    disease.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hostile shamans are described as having made the bay freeze, and Qu'urkil
    is asked what he will do with it because he has a strong beak.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Raven breaks through the ice; the passage states that in reality disease
    is being broken, and material from under the water is carried away and floats
    on the surface.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Great Sea-Wind is called to turn back a broad river; storm and billows
    come, and the practitioner keeps his hands on the patient's stomach while pretending
    that his palms are billows cleaning away rubbish.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the sea ebbs, ancient pebbles identified with the intestines are exposed
    as a dry sandy shore, and a hairy maggot rolls on the sand gathering rubbish into
    its hair.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The practitioner blows, smears saliva on his palm, melts snow in his mouth,
    fastens a blade of grass to the patient's neck, and wipes away the saliva.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: People bring payment including sausages and prepare a miniature skin bag with
    sausage crumbs, dry leaves, meat, and thong.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The shaman goes behind the tent, stabs sausage pieces as if they were reindeer
    for slaughter, and scatters offerings to the Substance of Incantation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The next morning the patient says he is a little better; a small river, explained
