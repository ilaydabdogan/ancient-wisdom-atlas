- id: obs:1
  text: A Sun-Chief praises the young man, wants him as a son-in-law, treats him kindly,
    and the young man sleeps with the girl and makes her his wife before departing
    with the father-in-law's spear.
  category: sequence
  evidence_refs:
  - ev:1
