canonical_text:
  quote: ''
  summary: The passage concludes one tale in which Qolfento' becomes a Sun-Chief's
    son-in-law, confronts another Sun-Chief guarded by a speaking dog, blinds the
    defeated chief, and returns with recovered Chukchee heads, wife, dog, animals,
    and goods. It then gives the tale of Cinto'urgin and Anqa'lqan, two brothers who
    fight Ta'nnit raiders; Anqa'lqan is later mortally wounded, revived by Kere'tkun
    under a ritual condition, and restored through a thanksgiving ceremonial using
    a slain Ta'nnit and two reindeer.
  language: English
  quote_policy: summarized
