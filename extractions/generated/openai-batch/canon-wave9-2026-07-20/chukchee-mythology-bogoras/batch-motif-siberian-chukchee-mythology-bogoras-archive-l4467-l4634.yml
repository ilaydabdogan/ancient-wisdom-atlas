canonical_text:
  quote: ''
  summary: 'The passage first describes a dog pursuing a dead man on a road and forcing
    him back from a long journey so that he re-enters his body and revives. It then
    presents a woman''s transformative love-magic speech against a rival: the rival
    is made carrion and vomit, the husband is made a hungry bear, and the speaker
    makes herself a smooth young beaver and smears herself with saliva so that the
    husband desires her. The remainder gives numbered songs about travellers, dogs,
    sledges, villages, dancing, borrowed tunes, food, and sacrifice, with editorial
    notes on Maritime Chukchee and Eskimo song contact.'
  language: English
  quote_policy: summarized
