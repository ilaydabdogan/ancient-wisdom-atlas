canonical_text:
  quote: ''
  summary: A boy secretly visits a cliff-house where his drowned father and seven
    brothers sit with an angry Cliff-Spirit; after being beaten, he receives three
    roots from his father that refill food caches. He ascends along a moon ray to
    the heavens, follows a Raven's instructions, heals the Sun's dying daughter by
    three breaths, marries her, receives reindeer herds, and returns home. His wife
    throws a golden egg into a brook, creating a golden house; the household becomes
    affluent and feeds poor people. A source note identifies the teller and cautions
    that the golden-house episode is not Chukchee folklore, though similar episodes
    occur in Chukchee-collected tales.
  language: English
  quote_policy: summarized
