canonical_text:
  quote: ''
  summary: 'The passage first recounts a woman associated with the Polar Star or Zenith
    being: opened trunks or lids reveal the world, her parents, animal stores, and
    her homeland; she returns home with a request for specific reindeer, which are
    sacrificed, after which her father and she die. A second narrative begins with
    a war in which a nimble sister whose brothers are killed fights a remaining Ta''nnit
    warrior with a walrus-tusk spear and defeats him without killing him.'
  language: English
  quote_policy: summarized
