canonical_text:
  quote: ''
  summary: The passage closes one tale with a speaker promising shamanic cures, ransom-offerings,
    and placation of Ground-, Sea-, and Incantation-Beings before being released and
    declared a liar. It then presents the tale of a girl who refuses human marriage,
    summons a lake being in the form of a penis, and copulates with it. Her parents
    imitate her song, cut off and kill the being, after which she mourns and finds
    a skull. The following tale begins with an unmarried daughter concealing a bare
    skull in her sleeping-room; the skull laughs faintly when she laughs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The released speaker says shamans will see causes of illness, cure by breathing
    on the skin, use small ransom payments, and alleviate suffering by incantations.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ritual payments and offerings named in the passage include a bead, a well-broken
    buck reindeer, a dog killed with an iron knife, blood sprinkled on the ground,
    sausages, a small Polygonum viviparum root thrown into the sea, and part of a
    sausage thrown to Incantation-Beings.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
- id: obs:3
  text: The speaker says Ground-Beings induced his wrongdoing, promises not to harm
    orphan children, asks to be released, and is later said to have proved a liar.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: A girl refuses to marry at her father's behest; her father suggests she may
    want to marry a ke'lE and later says she is married to a ke'lE of the lake.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: At evening and at the lake-shore, the girl sings for a penis to come from
    the lake; a penis appears, she sits on it, copulates with it, and returns home
    at dawn.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The father sends the girl to fetch wood, then he and his wife go to the lake,
    imitate the girl's song, catch the penis when it emerges, cut it off, and kill
    it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: After the killing, the girl repeatedly sings at the lake, but nothing appears;
    she cries and mourns as if for a dead husband.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: After mourning, the girl goes into the open country on the next day and finds
    a bare skull.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the following tale's opening, an unmarried daughter with a separate sleeping-room
    finds a bare human skull in the wilderness, carries it home in one leg of her
    breeches, and hides it in her sleeping-room.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The woman makes a puckered cap, covers the skull with it, sets the skull near
    the rear wall each evening, laughs at it, and the skull laughs a little; her mother
    hears this.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: A source note says the lake-spirit tale was left unfinished because the next
