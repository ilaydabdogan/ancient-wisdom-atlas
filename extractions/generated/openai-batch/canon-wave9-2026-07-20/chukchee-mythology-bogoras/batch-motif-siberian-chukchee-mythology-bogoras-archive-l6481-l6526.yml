canonical_text:
  quote: ''
  summary: A traveler identified as Sea-Jumper hears voices that turn out to belong
    to reindeer herds, hunts a doe and a buck, dries their meat, and continues along
    the seacoast. At a river he finds a plank boat and a hollowed-tree canoe belonging
    to two berry-picking girls, one human and one the daughter of Raven. He eats from
    the clean berries in the human girl's boat, puts most of his meat there, and puts
    only a little meat and fat in the Raven girl's canoe. The Raven girl interprets
    this as a sign that he will marry her, but at the human girl's house she is expelled
    from the white skin seat prepared for the suitor. Sea-Jumper marries the human
    girl.
  language: English
  quote_policy: summarized
