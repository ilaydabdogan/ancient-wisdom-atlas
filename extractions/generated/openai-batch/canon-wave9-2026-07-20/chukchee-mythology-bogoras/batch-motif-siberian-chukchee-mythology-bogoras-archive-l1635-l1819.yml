candidate_motifs:
- id: motif:1
  label: Swallowed by a giant being and emerging changed
  taxonomy_refs: []
  basis: The Giant Bird swallows the travellers and boat; they come out alive through
    its anus, but their heads have become bald.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not state why the hair loss occurs beyond the event sequence.
- id: motif:2
  label: Promise and fulfillment of animal offering
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The frightened travellers promise a white-haired dog to the spirits and later
    slaughter a shaggy dog after returning home.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not explicitly explain causal efficacy of the promise;
    it reports the promise and later slaughter.
- id: motif:3
  label: Insult of nonhuman old woman followed by bodily curse
  taxonomy_refs:
  - trickster_boundary
  basis: The foolish brother performs an obscene trick on the old mouse-woman and
    laughs; she responds with a curse that makes his penis grow.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy link to trickster-boundary behavior is interpretive; the
    text calls the man foolish rather than explicitly a trickster.
- id: motif:4
  label: Shamanic speech causing counter-harm
  taxonomy_refs: []
  basis: The eldest brother is said to be a shaman and addresses the old woman; the
    narration then has her insert a splinter into herself and die.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage presents sequence and speech but does not provide a technical
    explanation of the shamanic mechanism.
- id: motif:5
  label: Return after long absence with aged family and petrification
  taxonomy_refs:
  - return
  basis: After the men come home, their wives have become decrepit with age; after
    landing and sleeping, the men turn to stone.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The text does not quantify elapsed time or explain the stone transformation.
- id: motif:6
  label: False messenger abducts children across the sea
  taxonomy_refs:
  - departure
  basis: A big canoe-paddler falsely claims the father sent him, makes the children
    sit on his paddle, and carries them away to sea.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The children are kin, not lovers; therefore no 'stolen beloved' taxonomy
    ref is used.
- id: motif:7
  label: Captive children escape through a suddenly appearing opening
  taxonomy_refs:
  - return
  basis: The children are confined in a dark jaw-bone house; while the sister sings,
    a bright hole opens and they escape before it vanishes.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage does not identify the source or agent of the opening.
- id: motif:8
  label: Animal helpers return lost children and receive food reward
  taxonomy_refs:
  - sacred_exchange
  - return
  basis: Gulls carry the children back to the playground, and the father rewards them
    with blubber on the seashore.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The exchange is practical and narrated as reward; any ritual reading would
    require external evidence.
- id: motif:9
  label: Contrasting color anointments with life and death outcomes
  taxonomy_refs:
  - duality
  basis: The gulls anoint one child with ochre and one with graphite; the ochre-anointed
    child lives and the graphite-anointed child dies.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage states the outcome but does not explain the color symbolism.
- id: motif:10
  label: Hidden animal denied through absurd naming
  taxonomy_refs:
  - trickster_boundary
  basis: The girls hide a little seal and repeatedly call it a splinter while Raven
    points out its whiskers, eyes, and paws.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The excerpt breaks off near the beginning of the Raven story, so the full
    function of the exchange is not available.
