canonical_text:
  quote: ''
  summary: 'The passage contains several Chukchee narrative episodes: boat travellers
    are swallowed by a Giant Bird and later sacrifice a dog; a foolish brother insults
    an old mouse-woman and is cursed; children of a whale hunter are deceived and
    abducted by a canoe-paddler, imprisoned in a jaw-bone house, escape through an
    opening, and are returned by gulls; the father rewards the gulls and anoints the
    children with different substances; a following Raven episode begins with girls
    hiding a seal and denying what it is.'
  language: English
  quote_policy: summarized
