  locator: lines 1635-1819; whale hunter's children and canoe-paddler
  quote_or_summary: A man hunting whales has two children, a girl and a boy, playing
    on the seashore. A big man in a canoe with a large paddle says their father told
    him to fetch them and has them sit on the paddle, but deceives them.
  source_text_path: texts/public-domain/siberian/project-gutenberg/chukchee-mythology-bogoras.md
  rights_note: Public domain source; summary used.
- id: ev:8
  type: summary
  locator: lines 1635-1819; abduction to jaw-bone house
  quote_or_summary: The canoe-paddler carries the children to the middle of the sea,
    puts them in an uninhabited jaw-bone house, stops the vent-hole, and leaves them
    in darkness.
  source_text_path: texts/public-domain/siberian/project-gutenberg/chukchee-mythology-bogoras.md
  rights_note: Public domain source; summary used.
- id: ev:9
  type: summary
  locator: lines 1635-1819; captivity and escape
  quote_or_summary: The young brother cries from thirst; the sister feeds him material
    from old boot-soles, rocks him, and sings. While she sings, a small bright hole
    appears above, grows larger, and lets the children escape before the exit vanishes.
  source_text_path: texts/public-domain/siberian/project-gutenberg/chukchee-mythology-bogoras.md
  rights_note: Public domain source; summary used.
- id: ev:10
  type: summary
  locator: lines 1635-1819; gull return
  quote_or_summary: The children ask gull travellers to carry them. Two gulls in the
    rear carry them back to their former playground, where their father sees them.
    The children say a canoe-paddler took them and gulls brought them back.
  source_text_path: texts/public-domain/siberian/project-gutenberg/chukchee-mythology-bogoras.md
  rights_note: Public domain source; summary used.
- id: ev:11
  type: summary
  locator: lines 1635-1819; reward and anointing
  quote_or_summary: The father takes blubber from the store-room and opens a large
    blubber bag on the seashore; the gulls eat their fill. The gulls anoint one child
    with ochre and the other with graphite; the ochre-anointed child lives and the
    graphite-anointed child dies.
  source_text_path: texts/public-domain/siberian/project-gutenberg/chukchee-mythology-bogoras.md
  rights_note: Public domain source; summary used.
