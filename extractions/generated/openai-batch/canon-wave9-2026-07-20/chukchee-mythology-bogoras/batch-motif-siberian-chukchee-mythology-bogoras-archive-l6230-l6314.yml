candidate_motifs:
- id: motif:1
  label: sibling pair with one brother in peril and the other responding
  taxonomy_refs:
  - sibling_pair
  basis: 'Both tale sections center on brother pairs: Ma''ne acts to free the captive
    Mana''qton, and Qolento'' follows the road taken by his killed elder brother.'
  evidence_refs:
  - ev:1
  - ev:3
  - ev:6
  - ev:10
  - ev:11
  confidence: high
  cautions: The second tale is only begun in this passage, so the younger brother's
    later purpose or outcome is not present here.
- id: motif:2
  label: rescue of an imprisoned brother by coercing the captor
  taxonomy_refs:
  - sibling_pair
  basis: Ma'ne compels the Russian commander to discard weapons and order Mana'qton
    freed from prison.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:6
  confidence: high
  cautions: The coercion involves a boat episode and a later ordeal, but the broader
    tale context outside the passage is not supplied.
- id: motif:3
  label: ordeal of jumping over a raised blade
  taxonomy_refs: []
  basis: The transformed shaman tests Ma'ne by requiring him to jump over a long knife
    held over two men's heads; Ma'ne repeatedly succeeds.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No taxonomy reference is assigned because the passage presents the action
    as a test, not explicitly as an initiation or ritual.
- id: motif:4
  label: self-risking rescue of a sibling
  taxonomy_refs: []
  basis: Before attempting the knife-jump, Ma'ne thinks he may die but also that his
    brother is dying; after the rescue episode he is shot dead.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: medium
  cautions: The death occurs after the release and killing of the shaman; the passage
    does not state that Ma'ne's death is a ritual sacrifice.
- id: motif:5
  label: younger brother follows the path of the slain elder
  taxonomy_refs:
