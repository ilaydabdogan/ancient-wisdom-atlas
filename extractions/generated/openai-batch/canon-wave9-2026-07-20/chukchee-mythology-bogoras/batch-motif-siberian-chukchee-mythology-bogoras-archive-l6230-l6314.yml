canonical_text:
  quote: ''
  summary: 'The passage contains the end of a tale about two brothers, Ma''ne and
    Mana''qton: Mana''qton is held in a Russian dark prison; Ma''ne ambushes Russian
    boat-towers, forces a commander to disarm and free his brother, passes a knife-jumping
    test imposed by a Russian transformed shaman, then kills the shaman and is shot
    dead while fleeing. The passage then begins a second tale, Qolento'': a Sun-Chief
    takes an elder son and has him beheaded; the younger brother trains, makes a large
    spear, follows the same road, and begins a display of spear-skill at another Sun-Chief''s
    fortified house.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies Ma'ne and Mana'qton as two brothers; Mana'qton is taken
    captive by Russians, put into a dark prison, and becomes unable to move after
    being denied permission to undress for bodily needs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A great Russian commander travels upstream in a large heavy boat pulled from
    shore by several young men; the weapons are in the boat, and the young men are
    unarmed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ma'ne hides behind bushes, attacks the tow-men when they come near, stabs
    them with his spear, and seizes the tow-line.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ma'ne orders the commander to throw rifles and long knives into the water
    and threatens to release the tow-line; an editorial note explains that the strong
    current might have capsized the boat.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Ma'ne demands Mana'qton's release, tows the boat alone to Markova, and the
    commander orders Mana'qton freed from prison.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Russian transformed shaman opposes the release and proposes a test in which
    Ma'ne must jump over a long knife held as high as two men's heads.
  category: action
  evidence_refs:
  - ev:5
  - ev:8
- id: obs:7
  text: Ma'ne thinks he may die but also thinks his brother is dying; he jumps over
    the raised knife and repeatedly jumps back and forth over it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mana'qton is brought in too weak to walk, his breeches are cut open, he is
    washed, and then he rises to his feet.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ma'ne tells his brother to go to the shore, asks the Russians for tea, sugar,
    and tobacco, receives nothing, kills the shaman by striking him in the face, flees
    toward the river, and is shot in the head by Russian young men.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the second tale, a man at Kigi'ni has two sons; the Sun-Chief sends men
    for one son, becomes displeased with him, and has his head cut off.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The younger brother grows to manhood, trains by running and jumping with a
    load on his shoulders, becomes strong, and makes a very large spear.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: When the Sun-Chief again asks for the other son, the father first refuses;
    the younger brother says he should be allowed to take the same road as his elder
    brother, and later he is sent along.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: On the road, the younger brother comes to another, nearer Sun-Chief with a
    large fortified house; the Sun-Chief's daughter announces a guest, and the host
    asks the guest to show skill in fencing.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: Qolento' brandishes his spear with passes and side-strokes, and the passage
    says the sun moved from the left hand to the right hand during the display.
  category: action
  evidence_refs:
  - ev:12
