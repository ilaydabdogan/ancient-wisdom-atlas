canonical_text:
  quote: ''
  summary: A Hare trapped in Man-Slayer's house persuades the old woman to tie him
    to a long line, repeatedly distracts her, escapes through the vent-hole, then
    tricks Man-Slayer by pointing him toward wild geese, seizes his hatchet, kills
    and cuts him up, and sends the body pieces to Man-Slayer's family as supposed
    hare meat. Pursued by the Man-Slaying-Woman, the Hare is hidden by Eagle-Woman.
    Eagle carries the pursuer upward and drops her to the earth; the Hare hammers
    her exposed heels and jokes that her legs can be used as reindeer stakes. A source
    note says the tale is almost identical with an Anadyr Chukchee tale. The passage
    then begins a separate tale in which Raven, married to Fox-Woman, says he is going
    to the Sea-Spirit because they have nothing to eat; a note compares it to a Kolyma
    Chukchee tale.
  language: English
  quote_policy: summarized
