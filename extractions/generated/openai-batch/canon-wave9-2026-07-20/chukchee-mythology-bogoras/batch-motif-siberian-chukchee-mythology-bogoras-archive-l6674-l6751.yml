    confinement, and later deceives Man-Slayer.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage names the animal as Hare but does not explicitly call him
    a trickster; the motif label is inferred from repeated deception and boundary-crossing
    actions.
- id: motif:2
  label: Predator killed with his own prepared weapon
  taxonomy_refs:
  - trickster_boundary
  basis: Man-Slayer sharpens the hatchet while holding the Hare, but the Hare distracts
