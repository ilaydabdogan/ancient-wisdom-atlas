canonical_text:
  quote: ''
  summary: The passage contains the ending of one tale in which a revived husband
    returns to Miti and dies again from shame; the tale of a polygamist who uses concealment
    and clothing tricks while passing among ke'let and humans; and the opening of
    a tale in which a starving deserted woman repeatedly eats tallow from the Man
    in the Moon's house and is caught.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man tells Miti that he has revived; after she says a suitor came and then
    mentions seeing him with one sleeve dangling, he dies again from shame.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A polygamist orders his wives to make all-white clothing, goes out while the
    moon is waning, runs away, crouches, flattens himself, and is not found by his
    wives.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The polygamist travels eastward and encounters ke'let; one ke'lE fishes with
    a rod and pulls out a human infant who cries.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the ke'lE house, the ke'lE announces the guest and tells his wife to sharpen
    butcher-knives; the man flees and hides flat, and the ke'lE calls him escaped
    quarry and good game.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The traveler reaches a settlement of real human people; a man initially cannot
    see him, then recognizes him as a guest and warns that neighboring ke'let will
    fetch him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A ke'lE-woman enters, says she has come to fetch the man and that he must
    marry her, and brings him to her home where a brown bear and a polar bear guard
    the entrance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The mother of the ke'lE-woman emerges from the rear wall with a butcher-knife
    and tries to strike the man on the head while he simulates sleep.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The man exchanges coverings with the sleeping ke'lE-woman; the old woman strikes
    and beheads her daughter by mistake, and the man then beheads the old woman.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The man throws both heads to the bears, returns to his recent host, hears
    the old man declare that people will go around differently, departs, and dies
    of old age.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A deserted starving woman crawls from hunger, enters a house, finds hanging
    clothes and a dish filled with tallow, eats the tallow, and flees outside.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Man in the Moon notices that the tallow has been eaten, later stays home,
    and catches the woman when she returns for the food.
  category: sequence
  evidence_refs:
  - ev:11
