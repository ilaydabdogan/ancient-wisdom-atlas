canonical_text:
  quote: ''
  summary: Raven arranges a bird-hunting contest with Sea-Jumper and, after losing,
    uses a feather ruse to boast of success. Sea-Jumper and his wife leave for his
    country with reindeer. On the journey, the wife repeatedly transforms into a she-wolf
    to fetch fire. Sea-Jumper spies on her, shoots at her, and she returns to her
    parents with the reindeer. His father says Sea-Jumper's mother was similarly from
    that country and sends him back. The wife's shaman brother says he influenced
    Sea-Jumper's hostile act so that his sister would return. The couple reconciles,
    and Sea-Jumper no longer watches her transformations.
  language: English
  quote_policy: summarized
