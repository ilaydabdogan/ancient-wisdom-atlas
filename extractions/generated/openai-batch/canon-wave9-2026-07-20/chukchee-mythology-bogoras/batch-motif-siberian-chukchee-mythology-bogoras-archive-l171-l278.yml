canonical_text:
  quote: ''
  summary: A man is carried and fed by walruses across sea-ice; after being left on
    an ice-floe he follows a walrus instruction to roar before sleep and becomes a
    walrus. His own people nearly harpoon him, then recognize him when he speaks.
    He reports the killing of his companion. A retaliatory expedition attacks St.
    Lawrence people. Years later St. Lawrence people raid back; an orphan warns the
    neighbors. Two St. Lawrence men left on an ice-floe are spared after capture,
    return home, and report that the land-people are good, prompting a proposal of
    friendship.
  language: English
  quote_policy: summarized
