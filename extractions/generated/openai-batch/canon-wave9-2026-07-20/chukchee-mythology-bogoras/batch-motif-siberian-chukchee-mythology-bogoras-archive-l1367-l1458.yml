canonical_text:
  quote: ''
  summary: A group of brothers travel along the seashore after reporting that the
    sea has ruined their country. The eldest brother repeatedly restrains a foolish,
    greedy brother from eating certain stranded whale carcasses, while gull-people
    direct the travelers toward other carcasses that may be eaten. The travelers later
    land, hide their boat, seize and question a fearful man, learn of a violent strong
    man in a nearby settlement, and send the foolish brother to steal provisions from
    a cache.
  language: English
  quote_policy: summarized
