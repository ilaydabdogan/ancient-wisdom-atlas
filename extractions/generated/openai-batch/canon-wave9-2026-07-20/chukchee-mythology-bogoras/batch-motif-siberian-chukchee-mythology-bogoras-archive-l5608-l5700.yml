canonical_text:
  quote: ''
  summary: The passage concludes one tale in which a starving newcomer receives hospitality,
    moves to another patron, wins a running match, and is left alone. It then begins
    the tale of a polygamist whose older wife is struck during a ceremonial dance,
    leaves on an ice-floe, reaches another land, meets Sun-Man, lives in his luminous
    house among sacrificial vessels, bears children by him, and is later told to return
    to her own country with provision and shelter promised.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A newcomer says he came from afar from Ve'qan after near starvation and that
    he left companions behind in a covered sledge banked with snow.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old man has food cooked for the newcomer; the next day the companions are
    found alive except for the smallest suckling, who has died, and the camp sets
    up a sleeping-room with new bed-skins for them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A neighbor invites the newcomer to become his camp-assistant and takes him
    and his family away from the first camp after the first old man angrily permits
    their departure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Neighbors arrange a running match with fox-skin and beaver-skin prizes; the
    poor pedestrian outruns everyone, returns first, and the ashamed visitors leave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The polygamist has two wives, two daughters by the older wife, no children
    by the younger wife, and loves the younger wife best.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: During a thanksgiving ceremonial, both women dance and the man dances with
    his drum; he strikes the older wife in the face.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The older wife goes to the seashore, jumps over a narrow crack onto an ice-floe,
    and the ice carries her far into the open sea to another land.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: While drifting or after landing, the older wife thinks of her two daughters
    left behind as miserable orphans who will be badly dressed and wronged.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The woman sees Sun-Man on a steep rock; he is very large and tall, hooded
    and covered at the hands, yet full of light with a halo around his head.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sun-Man says he will not kill her, says he pities her, and says he led her
    to his land without her knowing it; he takes her hand and helps her up the rock.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: In Sun-Man's land she sees a large house and glowing sleeping-room, with round
    vessels containing boiled meat, tallow, fermented leaves, and some empty vessels.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: Sun-Man identifies the vessels as sacrificial vessels given by people, including
    empty vessels from those who wanted to cheat him, and says he never refuses a
    sacrifice.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The woman and Sun-Man live together, have a son and two more children, and
    later Sun-Man tells her to return to her native country with the children, promising
    food and shelter on the way.
  category: sequence
  evidence_refs:
  - ev:11
