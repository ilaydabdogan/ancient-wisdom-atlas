  text: A mother comes out with one sleeve dangling down before they enter the house.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Ku'urkil's son, identified as the brother of the young woman, searches for
    food and finds a lean dead puppy at an old camping-place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The dead puppy is cooked for the son-in-law, but he cannot eat it because
    of aversion.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: Raven goes to an old camping-place of the Reindeer people, finds diarrhea
    excrement, brings it home, and presents it as easier to swallow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The son-in-law becomes angry at the excrement offering and says that his people
    do not feed on such things.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the son-in-law's camp, where the tents are broken down for moving, the
    son-in-law has a reindeer slaughtered for the father-in-law, and the father-in-law
    slaughters a fat fawnless doe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The father-in-law refuses help carrying the carcass, eats and pecks at it
    for a long time, sleeps near it, and defecates upon it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The son reports to his mother that her husband has made the reindeer carcass
    into excrement; Raven later presents the remains as a slaughtered reindeer, while
    Miti says it is only bones or a skeleton covered with excrement.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: Raven is said to die from shame, or rather to simulate death; his wife carries
    him to the funeral place and puts him into an old jawbone house, after which he
    leaves.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Raven goes to the Reindeer people, cuts off his penis to make a needle-case,
    makes his testicles into thimbles, makes pubic hair into needles, and finds a
    husband there.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: A small Fox visits Raven's crying, forsaken wife and tells her that her husband
    has found a husband among the Reindeer people.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Fox instructs the wife to make reindeer and a sledge of excrement and to speak
