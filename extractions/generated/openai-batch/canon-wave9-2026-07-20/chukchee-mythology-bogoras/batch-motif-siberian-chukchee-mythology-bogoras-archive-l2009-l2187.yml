canonical_text:
  quote: ''
  summary: The passage describes Raven/Ku'urkil's household, a birth and visit, failed
    hospitality through a dead puppy and excrement, a reindeer slaughter followed
    by Raven's consumption and defilement of the carcass, Raven's feigned death and
    departure to Reindeer people, his making of sewing objects from his body parts
    and finding a husband, and Fox's instructions to Raven's forsaken wife to lure
    him back through excrement simulacra and a jealousy ruse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The inner room is described as made of white skins, with valuable objects
    such as beads, ear-rings, and bead necklaces hanging around it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A female figure brings forth a child, and the household goes visiting to dispel
