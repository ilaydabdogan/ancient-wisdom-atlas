candidate_motifs:
- id: motif:1
  label: Inverted hospitality through inedible offerings
  taxonomy_refs: []
  basis: The son and Raven attempt to feed the son-in-law with a dead puppy and then
    excrement; the son-in-law rejects the offerings and later provides a slaughtered
    reindeer for the father-in-law.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage supports a hospitality inversion, but it does not mark the
    exchange as sacred or ritual.
- id: motif:2
  label: Raven boundary-crossing through food, excrement, and death simulation
  taxonomy_refs:
  - trickster_boundary
  basis: Raven presents excrement as food, consumes and defecates on the reindeer
    carcass, claims excrement-covered bones are fat, and simulates death before escaping
    the funeral place.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:10
  - ev:11
  confidence: medium
  cautions: The taxonomy link is based on Raven's boundary-crossing actions; the passage
    itself does not use the word trickster.
- id: motif:3
  label: Feigned death and escape from the funeral place
  taxonomy_refs: []
  basis: Raven is said to be dead from shame, or rather to simulate death; after his
    wife places him in an old jawbone house at the funeral place, he leaves.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: This is not an actual death-and-rebirth episode in the passage, since
    the text states that he simulated death.
- id: motif:4
  label: Transformation or disguise into a female spouse
  taxonomy_refs:
  - shapeshifter
  basis: After leaving the funeral place, Raven finds a husband among the Reindeer
    people, and the passage parenthetically refers to Raven turned into a woman; the
    one with a dangling sleeve is expected to come when lured.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
  confidence: medium
  cautions: The mechanism of transformation is not narrated in detail; the identification
    depends partly on the parenthetical gloss in the passage.
- id: motif:5
  label: Body parts remade as domestic tools
  taxonomy_refs: []
  basis: Raven makes his penis into a needle-case, testicles into thimbles, and pubic
    hair into needles, then protects these objects from view.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: No available taxonomy reference directly matches this literal pattern.
- id: motif:6
  label: Wife's ruse to provoke jealous return
  taxonomy_refs: []
  basis: Fox instructs the wife to stage excrement reindeer and a sledge, announce
    a suit to Ku'urkil's wife, and place a hairy male head likeness by her pillow;
    Ku'urkil then becomes jealous and wants to come out.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  confidence: high
  cautions: The passage supports a jealousy-ruse pattern, but not a broader return
    taxonomy with certainty.
- id: motif:7
  label: Excrement-made substitutes and simulacra
  taxonomy_refs: []
  basis: Excrement is used as offered food, is left on the carcass in place of fat,
    and is prescribed by Fox as material for reindeer and a sledge.
  evidence_refs:
  - ev:5
  - ev:10
  - ev:13
  confidence: high
  cautions: The motif is literal to this passage; broader comparative meaning is not
    asserted.
