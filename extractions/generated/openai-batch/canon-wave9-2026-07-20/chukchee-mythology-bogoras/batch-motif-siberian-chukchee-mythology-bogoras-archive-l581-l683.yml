canonical_text:
  quote: ''
  summary: A girl hides and speaks with a skull. Her mother discovers it and the parents
    abandon the daughter by leaving camp in a boat. Alone, the daughter blames the
    skull, but it tells her to throw it into a fire and not look up. After noises
    of a herd and caravan, a reindeer-rich husband appears. Later the parents visit
    the new settlement, and the daughter kills them by serving marrow with bone splinters.
  language: English
  quote_policy: summarized
