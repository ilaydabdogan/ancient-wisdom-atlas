canonical_text:
  quote: They restored him, the suffering one, to life.
  summary: A suffering son is taken by Re'kken visitors, reduced to bones, restored,
    and gains shamanistic power. Later rivals kill him to take his wife, but he survives
    or returns. After another destruction in a grub-filled cellar, the wife follows
    his trail to a supernatural household where a ke'lE-wife endangers her. The husband
    uses a drum to search among classes of Beings and finds the human wife among the
    Ground-Beings.
  language: English
  quote_policy: quoted
