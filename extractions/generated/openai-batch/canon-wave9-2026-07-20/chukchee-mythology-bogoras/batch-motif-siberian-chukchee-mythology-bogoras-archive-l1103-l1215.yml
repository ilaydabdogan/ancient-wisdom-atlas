canonical_text:
  quote: ''
  summary: An anomalous infant cries while its mother and female companions sleep;
    a ke'lE answers the cry. The infant emerges from under the pillow and later is
    linked with the disappearance and bloody remains of the mother and companions.
    The household flees and leaves the infant alive in the old jaw-bone house. An
    old man remembers a large knife left there, and one suitor retrieves it despite
    the infant's pursuit. The suitor returns with the knife and marries the girl.
  language: English with Chukchee terms and interlinear Chukchee material
  quote_policy: summarized
