canonical_text:
  quote: ''
  summary: The passage begins with the end of a tale in which a male actor destroys
    a dangerous woman with inserted objects, takes another woman and property, returns
    to a settlement, and receives tents, herds, herdsmen, and tobacco as a journey
    reward before becoming a reindeer-breeder. Tale 13 tells of an old man who keeps
    his only daughter in a stone chest; a poor orphan suitor, aided by a Mouse-Woman,
    opens the chest, becomes the old man's son-in-law, and is sent to procure collar
    trimming. He travels from the bright world into a dark world, takes clotted wolf-skin
    from the pillow of a giant sleeping man, escapes by a vent-hole, and returns after
    growing old, just as his father-in-law dies. Tale 14 tells of two daughters of
    a hunter who train themselves and kill five violent brothers who have robbed their
    father and the village of food.
  language: English
  quote_policy: summarized
