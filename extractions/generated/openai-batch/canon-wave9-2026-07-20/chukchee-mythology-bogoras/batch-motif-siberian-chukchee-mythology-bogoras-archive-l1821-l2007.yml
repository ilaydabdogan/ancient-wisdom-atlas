canonical_text:
  quote: ''
  summary: 'The passage contains the close of a Raven tale in which little girls repeatedly
    deceive and humiliate Raven with faeces, lousing, a bladder, red tassels, tattooing,
    and a water reflection; Raven mistakes his own reflection for a prospective wife,
    offers household objects to the water, enters it, and drowns. A second tale begins
    with an animal suitor contest: many animals fail to hit a rod and fail a sledge
    test, while Hare succeeds with grass-made equipment, marries the woman, and then
    transforms landscape and willow materials into a house, sledges, and a reindeer
    herd.'
  language: English
  quote_policy: summarized
