  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: U'mqaqai ties a young-walrus-hide thong to a grassy hummock and ties his reindeer
    to the far end of the long thong.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: U'mqaqai and his companions sit facing a house entrance while ke'let inside
    cook food; one ke'lE-man works on a sledge-runner and a ke'lE-woman cooks.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The ke'lE-woman reports shame or terror; U'mqaqai points at her, and she immediately
    feels stinging pain and cannot breathe freely.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: U'mqaqai and his companions flee; after U'mqaqai loosens his reindeer from
