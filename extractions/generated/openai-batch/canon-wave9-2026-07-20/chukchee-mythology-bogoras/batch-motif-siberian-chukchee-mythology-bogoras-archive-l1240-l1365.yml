canonical_text:
  quote: ''
  summary: 'The passage contains the end of a tale in which a mistreated participant
    returns to a thanksgiving ceremonial, sings, receives an underground answer, and
    a ke''k swallows the violent people. It then gives U''mqaqai''s adventure among
    visible ke''lE evil spirits: he and companions pass unseen, tether reindeer, observe
    a spirit household, afflict a ke''lE-woman by pointing, flee, and reach home as
    the ground becomes soft like water. The passage begins another tale in which brothers
    are blown by wind and fog to a dark land, meet gull people who speak like humans,
    and receive instructions about forbidden and permitted stranded carcass food.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ke'lE calls an unnamed person “child”; the person has had no assistant spirits
    and says that all the people treat him badly and violently.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The person returns to the thanksgiving ceremonial and sings syllables; an
    answering voice comes from within or underground.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ceremonial participants hear the approaching voice and become afraid;
    with one breath the ke'k swallows and kills all the people described as doers
    of violence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The U'mqaqai narrative is introduced as actual fact from ancient times, when
    ke'lE evil spirits went around visibly and openly.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: U'mqaqai and his companions are reindeer-drivers in Telqa'p land; they pass
