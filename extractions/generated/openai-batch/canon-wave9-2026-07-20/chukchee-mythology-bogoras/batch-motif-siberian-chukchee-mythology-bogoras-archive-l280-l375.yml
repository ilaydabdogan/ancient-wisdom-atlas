canonical_text:
  quote: ''
  summary: Visitors exchange goods and food with local people. A shaman, apparently
    Ke'mneku from St. Lawrence Island, is released and departs at night with a sledge.
    A western shaman pursues him by flying with knives as wings. The two shamans converse,
    exchange shamanic objects, assistant spirits, and bodies, and demonstrate flight
    and plunging into the ground. The western shaman returns home with new powers
    and is later sent to seek Children's-Death, eventually going to the Being-of-Darkness
    and seeing Children's-Death as a mere mouth.
  language: English
  quote_policy: summarized
