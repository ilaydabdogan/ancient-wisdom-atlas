  summary: An isolated orphan is repeatedly beaten by people and neighbors. At a thanksgiving
    ceremonial he says he lacks shamanistic knowledge, is told to sing, sings a short
    refrain, and is thrashed twice. Later, in the dark, he sings into an ancient empty
    jaw-bone house, and a ke'fc inside answers with the same refrain.
