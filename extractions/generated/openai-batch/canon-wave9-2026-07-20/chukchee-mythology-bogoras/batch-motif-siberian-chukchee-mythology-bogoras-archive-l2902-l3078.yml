canonical_text:
  quote: ''
  summary: The passage opens with a defeated Tannin warrior who refuses to return
    home after being overpowered by a Chukchee woman; after requesting death and offering
    his weapons, he smokes and is stabbed by her. A second narrative recounts two
    human shamans, Rigowa'u and Tenququ'ni, discovering hostile Re'kken or ke'lE people,
    confronting a ke'lE old man using a human skull for divination, and attacking
    them. When the ground becomes loose and opens, Tenququ'ni is trapped because he
    had promised no offering to his spirit helper. Rigowa'u sings, summons walrus
    spirit helpers from the frozen ground, frees him, and receives promised payment.
    Later, personified Cough and Rheum approach with reindeer and flee in fear.
  language: English
  quote_policy: summarized
