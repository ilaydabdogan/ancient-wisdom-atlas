canonical_text:
  quote: ''
  summary: A Re'kkEn man and his wife travel away from their herd. The Upper Being
    sees their long sledge train, says such beings are exterminating mankind, and
    removes their infant from a covered sledge as a lesson. He leaves the child with
    Killer-Whale and his wife, a childless couple in a stone house. The child's parents
    discover the loss after returning from killing people. A Raven shaman tries to
    recover the infant but fails when his stone pillar rebounds from Killer-Whale's
    house. The parents then summon West-Wind and East-Wind. The Winds consult the
    Upper Being, who repeats that the raiders steal many people. At Killer-Whale's
    house, the Upper Being demands the infant, invokes his authority as Killer-Whale's
    creator, and sends the Winds inside. The Killer-Whales freeze, die, return to
    life when the house warms, and give the child back. Afterward the ke'let stop
    coming to the country.
  language: English
  quote_policy: summarized
