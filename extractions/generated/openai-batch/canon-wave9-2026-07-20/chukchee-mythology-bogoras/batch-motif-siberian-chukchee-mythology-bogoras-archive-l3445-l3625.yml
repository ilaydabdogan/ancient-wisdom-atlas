canonical_text:
  quote: ''
  summary: In the first tale segment, a man receives long-clawed gloves described
    as two dogs, travels east by sledge, is guided by a speaking dog to a settlement
    of many ke'let, and survives when the dogs claw the attackers. A decrepit old
    woman whose mouth contains game is taken home; when she opens her mouth, the people
    die. In the second tale, a man marries a Polar-Bear woman, who bears two sons
    and is later taken by her Polar-Bear brothers to their country. The husband prepares
    boots, bow, and arrows, creates strips of land across the sea by shooting arrows,
    reaches the Polar-Bear settlement, identifies his sons, reunites with his wife,
    and faces dangerous contests arranged by neighboring Koca'tke monsters with aid
    from his father-in-law.
  language: English
  quote_policy: summarized
