  text: The woman’s Polar-Bear brothers come to the shore and take her away to the
    country of the Polar Bears; she says she will put the children into her ear.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The husband asks his mother about his missing wife, has new boots made, and
    makes a bow and arrows.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The husband shoots arrows toward the open sea, and strips of land are created
