canonical_text:
  quote: The meat grew within the mouth.
  summary: A supernatural helper equips Qolento' with clothing, magically sufficient
    provisions, a folding parcel, and a paddle made from a still-born infant's arm
    and shoulder-blade. Qolento' leads eight paddlers by boat to a distant shore where
    a cannibal ke'te sits with his wife. He deceives the ke'te, protects the companions
    with a stone line, kills the ke'te, takes the young human-origin wife, and is
    warned about the ke'te's dangerous old wife.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A ke'lE gives Qolento' clothing, a small piece of dried meat said to suffice
    for the whole crew, fresh water, a strike-a-light, a small parcel, and a paddle
    made from a still-born infant's arm and shoulder-blade.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dried meat is divided into tiny shreds, grows in the mouths of the paddlers,
    fills their bellies, and then vanishes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The small parcel unfolds into a skin rug that becomes a small island with
    a lake; after the crew drinks and returns to the boat, Qolento' rolls it back
    up and the island vanishes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Qolento' paddles with the infant-arm paddle, and the boat moves very swiftly
