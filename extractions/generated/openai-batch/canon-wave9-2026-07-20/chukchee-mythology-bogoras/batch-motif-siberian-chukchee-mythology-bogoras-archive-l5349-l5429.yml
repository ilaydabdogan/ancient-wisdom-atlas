canonical_text:
  quote: ''
  summary: A wealthy reindeer-breeder gives his youngest daughter and one herd to
    the son of an Ai'wan neighbor. The son-in-law rejects reindeer-herding and has
    the herd slaughtered. The woman is mistreated, leaves at night with one surviving
    reindeer, and during a hard winter journey is unknowingly carried skyward along
    a ray of light. A speaking reindeer helps her and gives her food. She sees the
    slaughtered reindeer now belonging to the Upper Being, who pities her and invites
    her into his house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wealthy reindeer-breeder lives on the seashore, has no sons, has four daughters,
    and owns two large herds watched by the daughters.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A nearby Ai'wan in a permanent settlement is described as a wicked old man
    and doer of violence; he has five sons and tells his eldest son to seek one of
    the girls in marriage or take a herd if refused.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a proposal to join forces, the reindeer-breeder consents and gives his
    youngest daughter in marriage to the Ai'wan's son along with one herd.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The son-in-law says he does not want the reindeer herd, takes it to the village,
    and orders the whole herd, including driving-reindeer still in harness, to be
    slaughtered.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The slaughter leaves the ground red with blood, and part of the meat is to
    be given to poor and starving people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman grieves for the herd; her sisters-in-law take her handsome spotted
    fawn-skin clothing and dress her in old hairless sealskin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Unable to endure her condition, the woman leaves the village at night with
    one surviving reindeer from her own driving-team and no sledge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: During a cold midwinter journey through heavy snow, the woman is said to be
    walking on the ground but in reality ascending skyward along a ray of light, without
    noticing it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Upper Being, identified as the Being of the Reindeer people, sees and
    knows her situation and feels compassion because the reindeer were slaughtered.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The surviving reindeer speaks in human language, offers to carry the tired
    woman, scrapes a round place in the snow, and directs her to eat food lying there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The woman eats something like boiled meat, becomes warm, sees a reindeer herd,
    and recognizes some as her father's and some spotted ones as her own.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The recognized animals are described as the sacrificed reindeer that had been
    given away and later became the reindeer of the Upper Being.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: 'The woman reaches the camp of the Upper Being, whose appearance differs from
    humans: ears on his temples, a big nose, and a broad mouth across his whole face.'
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Upper Being tells his daughter to call the woman into the house, saying
    he saw the ground red with blood and that it was a great pity.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Upper Being recognizes the woman, waves his hand, shows emotion, criticizes
    the reindeer-breeder for listening to a sedentary Ai'wan, and opens a round hole
    in the floor by removing a stopper.
  category: action
  evidence_refs:
  - ev:9
