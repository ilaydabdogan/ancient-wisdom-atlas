literal_observations:
- id: obs:1
  text: A brother tells his sister to stand near his sledge; when the household claims
    she is ill in the sleeping-room, he points out that she is standing by the sledge
    and carries her away at full speed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people behind the sledge cry that he has carried off their female slave
    and household woman-worker.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young Raven-shaman calls for his dog, makes it defecate, turns the dog
    into a man, and turns the feces into an infant.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The transformed man and infant appear as a father with a little son, driving
    a spotted-reindeer team with bells on the sledge.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the offenders' camp, the disguised man says they are going to the spring
    fair and that his female companion was carried away by Red Ke'lE, glossed as Small-Pox.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The infant cries more strongly near other women but stretches its hands toward
    the feigning woman with ailing eyes, who is said to resemble its mother.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After entering, the transformed man copulates with the woman, becomes a dog,
    drags her over stones and tree roots, tears her body, and the infant becomes feces
    again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Raven and Owl fight for a hare; Owl clutches Raven's throat silently until
    Raven gives way.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Fox boasts of being a great hunter, attacks Owl, bites Owl's back, and Owl
    flies up; the narrator states that the silent one also was not a victor.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In a row of houses on the shore, a girl scraping skins discovers that all
    the other people are lying as if asleep but are dead; she alone is alive.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The girl carries water to the houses, hangs kettles, cooks food, and addresses
    the dead with an invitation to eat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: With her eyes shut, the girl hears her father's voice say that the dead are
    content with the cooked food and instruct her to move her sleeping-place outward
    over successive nights.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The father instructs her to keep moving for ten days until she reaches the
    herd, remain there until snow falls, and later bring the lesser portion of the
    herd to the dead.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The girl and herdsmen remain with the herd until snow covers the ground, return
    with the lesser portion, slaughter those reindeer, offer them in sacrifice, leave
    the houses and their contents, and depart.
  category: sequence
  evidence_refs:
  - ev:7
