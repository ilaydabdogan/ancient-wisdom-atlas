  summary: The supplied passage contains the ending of a tale in which a young Raven-shaman
    rescues his sister and sends a transformed dog and excrement-child to punish an
    offending woman; a short animal tale in which Raven, Owl, and Fox fight over a
    hare; and the tale 'The Sacrifice to the Dead,' in which a surviving girl feeds
