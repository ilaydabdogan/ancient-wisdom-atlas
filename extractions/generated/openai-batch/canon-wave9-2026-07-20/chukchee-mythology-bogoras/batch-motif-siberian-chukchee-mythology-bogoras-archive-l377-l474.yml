canonical_text:
  quote: ''
  summary: A shaman, sent by his father, seeks and brings Children's-Death, who is
    shown to humans, made to change size, bound, and compelled to promise not to kill
    newborn children. Later the father sends him to seek Death; the shaman travels
    underground and finds Iu'metun, a feared death-causing being, brings him back,
    and exposes his harmful power by causing him to touch a person's skin.
  language: English
  quote_policy: summarized
