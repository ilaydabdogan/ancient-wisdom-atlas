  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Children's-Death is accused of being the source of sorrow for beings with
    children and of causing newborn or young children to die suddenly.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
