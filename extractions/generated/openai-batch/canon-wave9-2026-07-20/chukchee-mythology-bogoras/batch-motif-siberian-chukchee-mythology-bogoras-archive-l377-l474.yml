- id: obs:1
  text: The shaman is sent by his father to look for Children's-Death and is told
    that Children's-Death is in a neighbor's house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A being in the region is described as an old man, a mere mouth, smeared with
    dried blood.
  category: attribute
  evidence_refs:
