  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The father again sends the shaman to look for Death, by whom people are killed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The shaman searches among many beings, then travels underground and along
    crevices in the ground before seeing Iu'metun.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Iu'metun is described as black like coal and having three fingers on each
    hand.
  category: attribute
  evidence_refs:
