- id: obs:3
  text: Children's-Death, later referred to as female in the passage, consents to
    come after first refusing.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Children's-Death tells the shaman to sit on her body and then flies up with
    him amid a loud noise that makes the world clatter and resound.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The shaman makes Children's-Death plunge underground and appear in the outer
    tent.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Children's-Death is described as tree-sized, then rapidly becomes small enough
