canonical_text:
  quote: ''
  summary: The passage introduces Bogoras’s Chukchee texts and then begins a tale
    in which Ai'wan and St. Lawrence Island people are at war. A man is carried away
    on ice by wind and later found by a shaman. The two reach a St. Lawrence settlement,
    are captured, and the non-shaman is killed. The shaman, kept as a slave, calls
    the walrus spirit from the sea. A large group of walruses arrives, and walruses
    carry the shaman away over the water and ice, led by an old male walrus.
  language: English
  quote_policy: summarized
