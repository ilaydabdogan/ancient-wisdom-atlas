canonical_text:
  quote: ''
  summary: 'The passage contains several Chukchee incantations or incantation fragments:
    a first-person charm involving watchful bodily eyes, game, reindeer, and an under-pillow
    object; a charm for taming a wild reindeer-buck by invoking the Being of Zenith
    and magically pinning, burdening, and making the animal heavy; charms to ward
    off ke''let by guardian bears, a blind old woman with an iron whip, iron owls,
    and an iron ball house with a bladed vent-hole; and a sea-game hunting charm that
    prevents walrus from hearing a boat by placing their ears on an iron pan.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening speaker says that his buttocks have three eyes that keep watch,
    see hidden ke'te, and make the ke'lE close his eyes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The opening speaker says he makes the foremost reindeer slow by using the
    two forked legs of a small pintail-duck, and says game has liking and love for
    him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The opening speaker says the thing lying under his pillow is his leader and
    describes blowing over it so that it rebounds or scatters backward.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: When a wild reindeer-buck joins a domesticated herd, the owner wants to make
    it tame and have it create offspring.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The owner goes among the herd and addresses the Being of Zenith, saying he
    is in need because the reindeer wants to go away.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The speaker asks for the Being's wooden stake and says he will stick it into
