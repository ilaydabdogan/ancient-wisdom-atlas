    the animal down.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speaker says he will pile boulders between the buck's antlers, wrap its
    ears with sod, cover its nose with withered sedge-grass, and let bad odors enter
    its nose.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker says he makes the buck into a newly born fawn and promises the
