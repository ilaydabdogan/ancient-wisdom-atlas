canonical_text:
  quote: ''
  summary: 'The passage contains the end of one tale in which an unnamed male enters
    houses, encounters a hearth voice, a head, a subterranean ke''lE-man, and eyeless
    old women, then flays one old woman, wears her skin, impersonates a shaman, kills
    people, and returns home saying he destroyed murderers and killed the wind. It
    then begins a tale about an Ai''wan whale-hunter and a reindeer-breeder: the reindeer-breeder
    kills the Ai''wan in a wrestling contest over a whale; the Ai''wan''s son later
    drowns the reindeer-breeder, takes his wife and herd, and abuses her; Spider-Woman
    instructs the wife to make an offering toward the sea, after which the drowned
    husband appears from the sea and proposes seizing the Ai''wan.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed male comes to a house where clothes are scattered, and a voice
    from the hearth says that he murders procurers of game and food.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A head appears; the male strikes it with a harpoon, and a ke'lE-man from underground
    pulls the head and thong down underground before the male enters a small jaw-bone
    house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two eyeless old women sit in the jaw-bone house; the male makes a sexual gesture
    toward the nose of one woman, who says it makes her think of when she had a husband.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The male kills one of the old women, flays her beginning at the anus, throws
    the body on a dung-hill, and puts on the skin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: People come looking for a shaman, and the skin-wearing figure speaks with
    them; they ask why his jaw has become long.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The skin-wearing figure comes to a man with an aching head, kills him with
    a harpoon-point, kills many more in the house, returns home, and says he has destroyed
    murderers and killed the wind.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: An Ai'wan warrior who hunts whales has killed a whale; an old reindeer-breeder
    asks him for meat on his son's instruction, and the Ai'wan fills the upper part
    of the old man's trousers with blubber.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The reindeer-breeder son goes to the Ai'wan at the shore, pulls a blubber-covered
    walrus-hide from the sand, and spreads it on the ground as a wrestling-place.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ai'wan and the reindeer-breeder wrestle naked on the slippery blubber;
    the reindeer-breeder catches the Ai'wan by the head, the head springs off, the
    Ai'wan dies, and the reindeer-breeder takes the whole whale.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A son of the killed Ai'wan hides a long thong in the sand across the reindeer-breeder's
    path, tugs it, makes him fall into the water, and the reindeer-breeder drowns.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Ai'wan takes the reindeer-breeder's wife and herd, slaughters many reindeer,
    eats only their tongues, and beats the wife when she refuses to dress him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The wife secretly cries over the slaughtered herd, and a small Spider-Woman
    visits and questions her about being married to the Ai'wan.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Spider-Woman tells the wife to prepare clothes, promise the sea a shy reindeer-buck,
    and offer the clothes to the sea; the wife promises and throws the clothes toward
    the sea.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the offering, the drowned husband appears in the distance from the direction
    of the sea, speaks with his wife, hears that the Ai'wan has almost exterminated
    the herd, and says they should seize him.
  category: sequence
  evidence_refs:
  - ev:9
