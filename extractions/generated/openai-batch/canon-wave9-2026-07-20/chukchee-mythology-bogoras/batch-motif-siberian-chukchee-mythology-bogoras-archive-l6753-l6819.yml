canonical_text:
  quote: ''
  summary: 'The passage concludes a Raven and Fox tale: Raven visits the Sea-Spirit''s
    house beneath the sea ice, behaves respectfully, and receives food; Fox imitates
    him, mocks the Sea-Spirit, nearly drowns, and the gifts vanish; Raven returns,
    lets the Sea-Spirit keep his coat, and receives herds. Raven and Fox become wealthy,
    have two children, and die from joy. The passage then begins another tale in which
    seven sea-hunting sons drown, leaving their mother and youngest brother destitute;
    the boy says he will seek the lost father and brothers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven sat on ice in the middle of the sea, saw the Sea-Spirit's large house
    under the ice and water, removed his coat, and entered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sea-Spirit tried on Raven's coat, asked whether it looked well, and Raven
    answered respectfully before asking for food.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After Raven returned home, his house was filled with ringed seals, spotted
    seals, and many kinds of fish.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fox was angry that Raven had asked for too little and went to the Sea-Spirit's
    house to get more.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fox laughed at and derided the Sea-Spirit when he tried on her coat; he became
    angry, pushed her out, broke the sea ice, and she nearly drowned.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After Fox's visit, the earlier abundance vanished, hunger returned, and Raven
    went back to plead with the Sea-Spirit.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On Raven's second visit, the Sea-Spirit kept Raven's coat and granted him
    herds of reindeer and mountain-sheep.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Raven found reindeer herds and herdsmen near his house; the herdsmen said
    the Sea-Spirit had sent them to be under Raven's authority.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Fox bore a son and a daughter, and Raven and Fox died from joy.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the next tale, seven grown sons went by boat to hunt whales and walruses;
