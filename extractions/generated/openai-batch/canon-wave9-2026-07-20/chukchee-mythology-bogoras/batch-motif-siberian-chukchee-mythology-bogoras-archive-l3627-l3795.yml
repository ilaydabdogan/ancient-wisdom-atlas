canonical_text:
  quote: ''
  summary: A man defeats the Koca'tke with a spear and returns with Polar Bear affines.
    After attacks, deaths, and revenge, the affinal figure ascends to heaven and lives
    with Morning-Dawn. A sacrificed white-haired dog reaches him; his tears become
    rain below. Morning-Dawn gives instructions for a stone anointing and a barren-doe
    sacrifice. After returning and performing these acts, he turns into a woman; his
    armor and spear become female objects, and a suitor from the Upper Beings takes
    him as wife. Blood from many reindeer fails until a lean fawn is used; the husband
    becomes a stone pillar. Zenith explains the transformation as caused by marrying
    among Polar Bears and sends the figure home. Spider-Woman lowers him by thread
    through a dark house, berries, and a bright spot into this world. He then visits
    mouse people, stays what seems one night but is a year, joins their thanksgiving
    ceremonial, becomes a great shaman, and learns that their throat disease is caused
    by a human children's mouse snare.
  language: English
  quote_policy: summarized
