  quote: ''
  summary: The supplied range first concludes an episode in which an unnamed man restores
    a patient, receives payment that appears illusory, and is instructed by a Hairy
    Maggot to assume its body against an ermine. It then narrates Tno'tirgin, a shaman,
    encountering and killing ke'let messengers of Nota'rme, following ke'le women
    to Nota'rme, bargaining over a giant dog that is later born to his female dog,
    experiencing great fish and sea-game abundance, and later facing Nota'rme's soul-catching
    net attack on the settlement.
