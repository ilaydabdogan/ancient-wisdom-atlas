  quote: ''
  summary: 'The passage states that revelation describes thirty-three kinds of land.
    It says that when Tt^''tar produced rain and seas arose from it, the whole place
    became half water and was converted into seven portions: one middle portion as
    much as one-half, with six portions around it, the six together being as much
    as Khvaniras. Editorial notes include manuscript and interpretive variants for
    the number and for the referent of “this portion.”'
