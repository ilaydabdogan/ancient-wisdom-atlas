canonical_text:
  quote: ''
  summary: Auharmazd offers peace to the evil spirit, but the evil spirit continues
    conflict. Auharmazd declares that the evil spirit cannot destroy him or permanently
    seize his creatures. Through omniscience Auharmazd sets a nine-thousand-year period
    of contest, divided into three three-thousand-year phases, knowing this will undo
    the evil spirit. He recites the Ahunavar formula, reveals his final triumph, the
    impotence of the evil spirit, the annihilation of demons, and the resurrection
    and everlasting future existence of creatures. The evil spirit becomes confounded
    and falls back to gloomy darkness.
  language: English
  quote_policy: summarized
