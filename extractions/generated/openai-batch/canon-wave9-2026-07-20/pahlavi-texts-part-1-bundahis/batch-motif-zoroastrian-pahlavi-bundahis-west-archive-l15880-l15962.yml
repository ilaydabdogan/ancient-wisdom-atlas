canonical_text:
  quote: ''
  summary: The passage gives rules for atoning mortal sin through confession to high-priests,
    surrender of body and wealth, renunciation, priestly decision, punishment, and
    possible execution. It also states that certain non-atoning ceremonial worship
    is demon worship, that ritual merit may go to the angels' store and benefit a
    righteous-minded soul in spiritual existence, and that hunting is restricted by
    status and wealth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A soul is to be atoned for among the high-priests; when their commands are
    followed, sin departs and later good works attain completion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sin of a person worthy of death is to be confessed to the high-priests,
    and that person is to deliver up his body to them rather than to anyone else.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says hunting is not the business of horsemen and is not allowable
    for others except a person whose wealth is less than three hundred stirs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ceremonial worship by those worthy of death is called demon worship when it
    is not performed as a renunciation of sin.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:5
  text: If the officiating priest does not know the character of that ceremonial,
    its merit goes to the angels' store, and the angels give the enjoyment from that
    merit in spiritual existence to the soul of a person righteous in mind.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: When a mortal sinner delivers body and wealth to the high-priests, mentally
    renounces the sin, and receives their decision about duty and good works, previously
    performed duty and good works come back to him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: Punishment for three nights is said to prevent the mortal sinner from entering
    hell.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: If the high-priest orders the sinner's head cut off, the sinner is righteous
    on the spot and a three-nights ceremony is to be celebrated for him.
  category: sequence
  evidence_refs:
  - ev:9
