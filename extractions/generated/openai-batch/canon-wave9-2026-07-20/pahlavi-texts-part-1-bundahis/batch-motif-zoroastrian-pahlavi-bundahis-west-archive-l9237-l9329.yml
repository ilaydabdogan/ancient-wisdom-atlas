  quote: ''
  summary: The passage gives a genealogy connected with Paitirasp, Porushasp, Arasti,
    Zaratust, and Manuj-chihar; describes Zaratust bringing and expounding the religion
    in Airan-vej and Mertayok-mah receiving it; traces the Mobads of Pars to Manuj-chihar’s
    race; and lists Zaratust’s three sons and three daughters with the sons’ priestly,
    agricultural, and warrior roles.
  language: English
  quote_policy: summarized
