canonical_text:
  quote: ''
  summary: The passage describes the nature and classification of plants. It says
    vegetation lacked thorns and bark before the destroyer came, but afterward became
    thorny, bark-coated, and mixed with poison. It explains plant origins from the
    primeval ox and from the seeds of a many-seeded tree opposed to harm in the wide-formed
    ocean. Each year a bird strips that tree, mingles its seeds in water, and Tistar
    distributes them by rain to all regions. Near that tree grows the white Hom or
    Gokar tree at the source of Aredvivsur’s water; it is healing, undefiled, expels
    death, and grants immortality to one who eats it. The passage then lists genera
    of plants and examples.
  language: English
  quote_policy: summarized
