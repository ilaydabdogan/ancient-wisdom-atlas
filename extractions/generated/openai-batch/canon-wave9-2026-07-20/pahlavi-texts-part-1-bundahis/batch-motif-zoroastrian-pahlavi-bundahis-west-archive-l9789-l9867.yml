canonical_text:
  quote: "“light was above and darkness below, and between those two was open space.”"
  summary: The passage opens the Selections of Zaz-sparam and begins a cosmogonic
    account of the meeting of the beneficent spirit and the evil spirit. It describes
    light above, darkness below, open space between them, Auharmazd in the light,
    and Aharman in darkness. Aharman sees a ray of light and attempts to reach it,
    but Auharmazd confronts him and casts him back. Auharmazd appoints protective
    spirits over elements and living kinds for three thousand years. Aharman returns
    to the boundary, threatens to destroy the creatures, and claims he will seduce
    material life; Auharmazd perceives this through wisdom.
  language: English
  quote_policy: quoted
