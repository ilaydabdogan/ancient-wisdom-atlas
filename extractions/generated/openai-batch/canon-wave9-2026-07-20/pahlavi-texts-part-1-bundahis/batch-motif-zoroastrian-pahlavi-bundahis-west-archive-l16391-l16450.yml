  quote: ''
  summary: The passage describes successive liturgical opportunities to invoke the
    guardian spirits of the righteous. If invoked, they accept the ceremony; if not,
    they wait and eventually go up the height of a spear. The spirits explain that
    their concern is not lack of ceremony, but the inability to keep evil away when
    not revered or invoked. Auharmazd answers a question about the duration in life
    of the dead with a very small measure involving a fly's wing.
