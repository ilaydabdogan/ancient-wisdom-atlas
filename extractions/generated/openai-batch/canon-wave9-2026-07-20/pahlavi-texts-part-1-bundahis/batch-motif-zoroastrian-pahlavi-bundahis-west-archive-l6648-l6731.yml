  summary: 'The passage describes the nature of lakes as fountains of water, compares
    them with human eyes, lists several named lakes, and gives properties of particular
    lakes: warm or lifeless water, beneficial water, mountain placement, a lake that
    receives or rejects what is thrown into it according to righteousness, and undefiled
    water required for restoring the dead in the renovation of the universe.'
