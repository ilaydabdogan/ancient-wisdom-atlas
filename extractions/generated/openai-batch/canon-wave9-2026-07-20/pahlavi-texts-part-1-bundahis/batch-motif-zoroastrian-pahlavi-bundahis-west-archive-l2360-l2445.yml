canonical_text:
  quote: ''
  summary: 'The passage summarizes a fragment related to the Bahman Yast: during Hushe^ar''s
    millennium the wolf race and criminals are destroyed; in the three-hundredth year
    the winter of Malkos destroys animals and vegetation, leaving very few humans;
    the world is then repeopled from Yim''s enclosure; nations fight a vast battle
    at the Euphrates; Var^avand takes possession of Iran; and Peshyotanu is summoned
    from Kangdez to restore religious ceremonies. The passage then introduces the
    Shayast la-shayast as a compilation on proper and improper conduct, sin, impurity,
    ceremonies, and related religious matters.'
  language: English
  quote_policy: summarized
