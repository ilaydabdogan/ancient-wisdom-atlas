  quote: ''
  summary: The passage gives ritual rules concerning a sacred cake, sacred twigs,
    utterance of Ashem-vohu, restrictions on consecrating the cake of a disreputable
    woman, the formula used before fire, washing before sleep, washing after contact
    from a menstruous woman with bull's urine and water, and a later-added rule that
    a mouth-veil and clothing should be set apart from gifts after someone has died
    so that the soul may become easier.
