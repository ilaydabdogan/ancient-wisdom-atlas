  quote: ''
  summary: The passage explains that Pahlavi writing used Semitic words within Persian
    sentences, often with Persian endings, giving the written language a mixed appearance.
    It argues that the spoken language was Persian and that the Semitic words functioned
    as written logograms for Persian words, giving examples of written and read forms.
    It also notes that this practice helps explain the disappearance of the Semitic
    portion when Persians adopted a modern alphabet, followed later by a different
    influx of Semitic words after much of the nation became Muhammadan.
