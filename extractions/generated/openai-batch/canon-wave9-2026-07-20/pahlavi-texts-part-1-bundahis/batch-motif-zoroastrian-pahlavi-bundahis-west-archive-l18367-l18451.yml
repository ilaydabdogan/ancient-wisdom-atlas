canonical_text:
  quote: ''
  summary: The passage gives ritual explanations for numbered stanzas and repetitions
    from the Yasna. It links fourteen stanzas with archangels active for spirit and
    world and with attainment of heaven; explains three repetitions and the elevation
    of holy-water for community classes and for the strength of warriors and husbandmen;
    assigns fifteen stanzas to the destruction of fifteen fiends; connects four repetitions
    with five chieftainships; and begins a truncated explanation of two repetitions
    associated with the sovereign. Translator notes add ritual details about Hom juice,
    holy-water, sacred twigs, sacred milk, and textual comparisons with other Zoroastrian
    materials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fourteen stanzas of Yatha-aii are explained through a correspondence with
    seven archangels active for the spirit and seven archangels active for the world.
  category: relationship
  evidence_refs:
