- id: obs:2
  text: The stated aim is that they may attain heaven, described as the home of Auharmazd,
    the archangels, and the righteous ones.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'A translator note says the seven archangels have charge of seven worldly
    existences: man, animals, fire, metal, earth, water, and plants; the note also
    raises uncertainty about whether the text should read angels rather than archangels.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Three repetitions of the named stanza and the holding up of holy-water at
    those repetitions are said to be for four classes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The holy-water is to be held level with the heart of the officiating priest
    at certain words and level with his arm at another word.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The stated effects are that warriors in battle with foreigners may be fuller
    of breath and husbandmen may be stronger-armed in tillage and cultivation.
  category: relationship
  evidence_refs:
  - ev:5
