  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The fifteen stanzas of Ya-i-kyaothana are said to be given for the destruction
    of fifteen fiends disclosed in the medical part of the Haokht Nask.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'Four repetitions of Mazda-a are said to be for the right coming-on of the
