  quote: ''
  summary: The passage describes two limited spirits, Auharmazd's omniscience, the
    finite and infinite within his creation, the covenant of both spirits, the future
    sovereignty of Auharmazd's creatures, and the eventual perishing of Aharman's
    creatures. It then describes Auharmazd's preparatory spiritual creation lasting
    three thousand years and the evil spirit's ignorant ascent from the abyss into
    light with destructive intent.
