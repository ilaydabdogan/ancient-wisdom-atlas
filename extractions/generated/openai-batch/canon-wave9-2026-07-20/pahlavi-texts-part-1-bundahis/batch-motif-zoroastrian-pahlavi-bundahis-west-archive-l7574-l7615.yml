  quote: ''
  summary: 'Auharmazd describes his continual protection of creatures and the evil
    spirit''s continual contriving of evil. The passage then describes demonic seduction
    of mankind away from Auharmazd''s religion, followed by a catalogue of named demons
    and their functions: corrupt thought and discord, obstruction of virtue and ritual
    dress, misgovernment and drunkenness, and discontent.'
