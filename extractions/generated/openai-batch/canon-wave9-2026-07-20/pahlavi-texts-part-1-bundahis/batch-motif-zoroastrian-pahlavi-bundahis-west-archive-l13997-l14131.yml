canonical_text:
  quote: the only thing which amounts to polluting is contact with the flesh, and
    even with the hair and nails.
  summary: The passage gives ritual-legal rules for corpse pollution, including spatial
    limits in a house or wild spot, effects on food, sacred fire, water, ablution,
    and clothing, the role of contact with the corpse, the dog-exhibition rule, animal
    limits on contagion, womb pollution, and direct pollution from a hedgehog.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: If a corpse comes to one side of a house, only that side is polluted; if it
    comes to both sides at once, only the entrance place is polluted and the dwelling-rooms
    are clean.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The vault of the sacred fires does not become polluted, while the ashes of
    the sacred fire are said to become polluted in a measure.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: If someone dies in a wild spot, prepared food within three steps is useless,
    while food beyond four steps is not polluted; examples include bread, boiled and
    roast meat, and broth.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Carrying fire into a house requiring nine nights or a month to become clean,
    and kindling it there, each incurs a stated sin; a dead trifling creature left
    there also causes a stated sin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Carrying water in, pouring water where life departs, pouring it elsewhere,
    and attempting ablution inside the unclean house are each governed by stated ritual
    penalties or invalidity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A needless entrant into the unclean house must have body and clothes thoroughly
    washed each time and incurs a stated sin; needful entry is neither good work nor
    sin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pollution is reckoned in the sharp account when life departs, and polluting
    contact is specified as contact with flesh, hair, or nails.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage distinguishes contact that cleaves from one side from a curse
    or corruption that advances from all four sides.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Soshyans says the corpse remains as at the time life departs until it is exhibited
    to a dog; a priest, warrior, or husbandman is not useful for this stated function.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A dog, goat, or pig may be requisite because pollution does not attack further
    there; the pollution of a child in the womb is along with the mother.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The direct pollution of a hedgehog cleaves to one, not the indirect pollution;
    direct pollution is defined as bodily contact with a corpse.
  category: relationship
  evidence_refs:
  - ev:10
