canonical_text:
  quote: ''
  summary: Mashya is connected with a demonic act involving cow's milk poured northward,
    after which demons grow stronger and Mashya and Mashyoi lack desire and children
    for fifty winters. Desire later returns, they have a male-and-female pair of children,
    and each parent devours one child because of tenderness. Auharmazd removes this
    excessive tenderness so children can be nourished. Further male-and-female sibling-spouse
    pairs arise, named descendant pairs become races, and some races migrate over
    the ocean on the ox Sarsaok to other regions while others remain in Khvaniras.
  language: English
  quote_policy: summarized
