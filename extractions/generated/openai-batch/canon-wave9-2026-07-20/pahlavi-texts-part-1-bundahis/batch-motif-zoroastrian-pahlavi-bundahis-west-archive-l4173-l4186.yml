  quote: ''
  summary: At the north side of the fountain of the sea, two named rivers, Arag and
    Veh, flow out toward east and west. A cited utterance addresses Auharmazd about
    pouring and drawing forth two waters. The two rivers wind around the earth's extremities
    and mingle again with the wide-formed ocean. Eighteen navigable rivers also flow
    from the same origin, and their waters return to the Arag and Veh rivers, from
    which the world's fertilization arises.
