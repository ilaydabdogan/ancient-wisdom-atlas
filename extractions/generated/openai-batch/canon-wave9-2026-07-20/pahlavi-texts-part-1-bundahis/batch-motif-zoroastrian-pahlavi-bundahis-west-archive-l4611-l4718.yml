  quote: ''
  summary: The passage catalogs named mountains and their locations, repeatedly describing
    mountains as having grown from Mount Aparsen and as fostering tillage and prosperity.
    It notes Lake Sovbar on Mount Kondrasp, Dimavand as the mountain in which Bevarasp
    is bound, and a mountain called Miyan-i-dasht or Come-to-help that broke off and
    slid into a plain during the war of the religion, saving the Iranians. It also
    locates a fire, fortress, roads, lakes, regional mountains, and smaller hills.
