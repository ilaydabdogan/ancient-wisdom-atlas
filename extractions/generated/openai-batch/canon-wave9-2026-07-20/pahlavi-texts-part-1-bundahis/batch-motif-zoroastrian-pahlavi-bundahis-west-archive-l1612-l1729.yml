  quote: ''
  summary: The passage argues from internal evidence that the Bundahis in its present
    form postdates the Muhammadan conquest of Persia. It cites an extract about Yazdakar,
    the Arab invasion, the loss of Iran, weakened Mazdayasnian religion, and social
    evils. It then discusses likely ninth-century editorial revision, the possible
    original ending with the resurrection, later added chapters, and Gujarati translation/paraphrase
    history.
  language: English
  quote_policy: summarized
