canonical_text:
  quote: ''
  summary: 'The passage catalogs numerous demons and fiends, naming the harms or disorders
    attributed to each: old age, whirlwind disturbance, illicit intercourse, sloth,
    annihilation, distress, greed, hoarding, pollution, deception, slander, falsehood,
    the malignant eye, idolatry, death, and interference with rain. It also states
    that many demons cooperate, that portions of them are mingled in human bodies,
    and that the evil spirit is associated with vileness, sorcery, fiendish weapons,
    and perversion of God''s works.'
  language: English
  quote_policy: summarized
