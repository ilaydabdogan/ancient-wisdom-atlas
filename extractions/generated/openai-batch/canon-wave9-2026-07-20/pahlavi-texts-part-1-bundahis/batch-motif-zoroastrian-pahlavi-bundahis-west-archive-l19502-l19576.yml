canonical_text:
  quote: ''
  summary: The passage describes post-death ceremonies over three days and nights,
    offerings at dawn after the third night, fourth-day and recurring memorial rites,
    and provisions for cases where news of death arrives from a distant place. Notes
    explain the role of named angels at the afterlife bridge, ritual clothing for
    the spirit, and parallel details from Persian Rivayat death ceremonies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A three-day sequence of ceremonies is described, with ritual performance at
    each period of the day treated as equivalent to performing the whole religious
    ritual at one time.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'After the third night, at dawn, three sacred cakes are consecrated: one for
    Rashnu/Rashnta and Astad, one for Vae the good, and one for the righteous guardian
    spirit; clothing is placed on the guardian spirit''s sacred cake.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the fourth day it is allowable to slaughter a sheep or goat, and the ceremonial
    of the righteous guardian spirit is performed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The sequence continues with tenth-day, monthly, and annual ceremonies; the
    first monthly ceremony is on the thirtieth day, and the annual ceremony is on
    the anniversary day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: If a person dies far from the place where the news arrives, the three-day
    ceremonies are preferably celebrated where the person died; otherwise they are
    celebrated where the news arrives, beginning from the arrival of the information.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the distant-death provision, the ceremonial of Srosh is performed until
    three nights are completed, followed after three days and nights by the ceremonial
    of the righteous guardian spirit.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A note identifies Vae, Rashnu, and Astad as angels stationed at the Kinvad/Chinvat
    bridge, where the soul gives an account of its deeds shortly after dawn following
    the third night after death.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A note explains that the clothing for the guardian spirit should be new and
    good, is supplied to keep the spirit from appearing unclothed in the other world,
    and is given to the officiating priests.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: A note summarizes Persian Rivayat details including Srosh rites in the first
    three days, third-night sacred cakes, clothes and fruit before a sacred cake,
    fourth-day sunrise prayers, thirtieth-day offerings in the presence of fire, and
    monthly and annual observances.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The final fragment introduces three categories of persons associated with
