canonical_text:
  quote: ''
  summary: The passage catalogues chief beings, places, waters, plants, grains, garments,
    and seas. It names Karshipt the falcon, the white ermine, the Kar-fish, several
    rivers, Hugar the lofty summit, the water of Aredvivsur, Hom, wheat, wormwood,
    summer vetch, the Kustik, and Bazayvana. It also states that Zaratusht was born
    by the Dara/a river, that Auharmazd created the material world as one abode, and
    that good action is valued like the water of life.
  language: English
  quote_policy: summarized
