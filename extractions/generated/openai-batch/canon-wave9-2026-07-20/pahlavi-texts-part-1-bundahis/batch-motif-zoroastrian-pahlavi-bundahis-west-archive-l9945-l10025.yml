canonical_text:
  quote: ''
  summary: The passage describes Aharman being confounded and falling back to gloom,
    Auharmazd producing the six bodily creations for the world, fire being diffused
    through those substances, a first three-thousand-year state of unmoving creatures
    and stationary heavenly bodies, and Auharmazd producing unrestricted Time to set
    his creatures in motion. It also describes a dark envelope connected with Time,
    a speech about the serpent's co-operation and a future upheaval after nine thousand
    years, and Aharman bringing darkness into the sky near the star station.
  language: English
  quote_policy: summarized
