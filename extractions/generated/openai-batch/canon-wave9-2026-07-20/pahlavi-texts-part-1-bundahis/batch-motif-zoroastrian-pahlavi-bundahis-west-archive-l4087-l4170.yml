canonical_text:
  quote: ''
  summary: Wind moves the waters to the earth's borders, forming the wide-formed ocean,
    while dead noxious creatures leave venom and stench in the earth. Tistar descends
    into the ocean as a white horse to remove the poison. Apaosh appears as a black
    horse and first frightens Tistar away. Tistar asks Auharmazd for success and receives
    great strength, causing Apaosh to flee. Tistar then uses a cloud like a jar to
    produce vast rain. Demons contest the rain, and the fire Vazist strikes with a
    club. After ten days and nights of rain, the poison is mixed into the water, which
    becomes salt. Wind then restrains the waters and forms seas and fountains.
  language: English
  quote_policy: summarized
