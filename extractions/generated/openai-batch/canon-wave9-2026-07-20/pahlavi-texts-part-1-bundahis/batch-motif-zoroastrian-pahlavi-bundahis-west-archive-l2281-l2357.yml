canonical_text:
  quote: ''
  summary: 'The passage first describes the textual state of Pazand and Persian versions
    of the Bahman Yasht, including manuscript descent, omissions, paraphrase, dislocation,
    and loss. It then summarizes the conclusion of the Persian version: adversity
    leaves the world; Hushe-dar-mah appears after conference with Auharmazd, bringing
    miraculous sufficiency of cow’s milk, dietary change, a solar standstill, mass
    belief, destruction of a serpent and noxious creatures, departure of fiends, and
    a peaceful world. Later Soshyans appears, destroys a fiend tormenting fire, brings
    another solar standstill and universal belief, and the year becomes 360 days.
    Dahak escapes confinement and tyrannizes briefly, but Soshyans rouses Sam Nariman,
    who becomes immortal and kills Dahak after Dahak proposes seizing heaven. With
    all evil gone, mankind becomes like archangels and resurrection occurs, said to
    share many details with Bundahis chapter XXX.'
  language: English
  quote_policy: summarized
