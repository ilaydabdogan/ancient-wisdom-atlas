  quote: ''
  summary: The passage enumerates kinds of liquid found in plants, waters, animals,
    and humans; states that these liquids mingle again with rivers; describes river
    spirits troubled by stagnant-water defilement until Zaratust will purify the water
    with sixfold holy-water; gives timed returns of water to its sources according
    to the balance of holy-water and pollution; compares this with plant roots and
    righteous blessings; and notes that Frasiyaz of Tur conducted the river Nahvtak
    away.
