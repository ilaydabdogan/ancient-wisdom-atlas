  quote: ''
  summary: The supplied passage describes a cosmological geography of salt seas. It
    counts three principal salt seas and twenty-three smaller ones, names the principal
    seas, identifies Putik as the largest and as joined to the wide-formed ocean,
    describes the Gulf of Sataves as separating stench from pure water, and explains
    Putik's flow and ebb through the moon, wind, and the constellation Sataves. Sataves
    protects southern seas, while Haptok-ring protects northern seas. The passage
    ends as a section on small seas begins.
