  quote: ''
  summary: 'In a dialogue, Zaratust asks Auharmazd how a numerous unnamed group will
    be able to perish. Auharmazd answers with future signs and births: a dishevelled-haired
    demon of the race of Wrath appears in the eastern quarter, a black token becomes
    manifest, Hushe^ar son of Zaratust is born on Lake Frazdan and later comes to
    conference with Auharmazd, and a prince is born toward A''inistan/among the Hindus
    with a father of Kayan royal lineage.'
