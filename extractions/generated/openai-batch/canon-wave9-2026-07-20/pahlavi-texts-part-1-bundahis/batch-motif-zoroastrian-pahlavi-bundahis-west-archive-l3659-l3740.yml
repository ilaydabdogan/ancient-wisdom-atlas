canonical_text:
  quote: ''
  summary: The evil spirit and allied demons invade from the sky into the world, damaging
    sky, water, earth, vegetation, the ox, Gayomard, and fire, and spreading darkness,
    noxious creatures, blight, and afflictions. Auharmazd mitigates harm to the ox
    with healing fruit in water and forms a radiant youthful body from Gayomard's
    sweat. Gayomard sees a darkened, creature-filled, embattled cosmos.
  language: English
  quote_policy: summarized
