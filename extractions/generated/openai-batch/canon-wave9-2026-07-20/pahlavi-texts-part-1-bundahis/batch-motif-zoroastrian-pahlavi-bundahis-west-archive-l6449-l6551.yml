  quote: ''
  summary: The passage continues a catalog of rivers and waters, naming rivers by
    their sources, courses, destinations, and local names. It places the Dara river
    in Airan-vef and says Porushasp, father of Zaratu5-t, dwelt on its bank. It states
    that other waters, rivers, springs, and channels are one in origin but differently
    named by district and place. It also says Frasiyaz conducted numerous springs
    and waters, including Zarinmand/Hetumand and seven navigable waters, into the
    sea Kyansih and made men settle there.
