  quote: ''
  summary: A sequence of blessings invokes named divine or celestial figures to grant
    offspring, martial strength, long life, peace, divine support, household presence,
    Kayanian glory, help for champions, skill, wealth, protection from demons, a throne
    in heaven, victory, and aid in good works. The passage closes with homage and
    blessings for Srit the teacher through the will of Auharmazd/Atiharmazd as printed.
  language: English
