canonical_text:
  quote: ''
  summary: 'The passage gives ritual rules about the Nasu associated with death: dogs
    and certain carrion birds can destroy it under specified conditions, while hair,
    nails, reflections, and debated animal categories limit the effect. It also records
    instructions attributed to Vand-Auharmazd for carrying a pregnant woman''s corpse,
    purification by the Bareshnum ceremony, and orienting the corpse toward the Dakhma.'
  language: English
  quote_policy: summarized
