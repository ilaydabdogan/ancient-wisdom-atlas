  quote: ''
  summary: The introduction discusses whether medieval Zoroastrianism should be called
    dualist, summarizes Bundahis claims about Aharman’s limited knowledge, power,
    creatures, and final impotence, compares Aharman with the Christian devil as an
    author of evil, and rejects external reports that Auharmazd and Aharman derive
    from an eternal personification of boundless time by citing Zorvan as a creature
    of Auharmazd.
