canonical_text:
  quote: Then the millennium reign came to Scorpio, and Dahak ruled a thousand years.
  summary: The passage presents a regnal chronology arranged by millennial periods
    and zodiacal signs. It lists the reigns of Dahak, Fre^un, Manujchihr, Frasiyav,
    Zob, the Kayanian kings, later named rulers, the Askanians, the Sasanians, and
    the transition to the Arabs. It also notes Kai-Kaus going to the sky, Kai-Vistasp's
    reign in relation to the coming of the religion, and editorial millennial calculations
    including Capricornus and the last millennium.
  language: English
  quote_policy: quoted
