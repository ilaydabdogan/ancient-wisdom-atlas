  summary: The passage contains an invocation, a colophon locating the writing under
    the high-priest Spendya at a fortunate conjunction, and an explanation that the
    writing of the Bundahis was prompted by the arrival of the Arabs in Iran and by
    perceived heterodoxy, ignorance, and loss of access to Kayan orthodoxy. It describes
    evil times, social disdain for orthodox worship, difficulty learning propriety,
    and the beginning of Chapter I with the phrase translated as “that knowledge of
    tradition.”
