canonical_text:
  quote: ''
  summary: The passage describes consequences for a person who does not renounce sin,
    including hell until the future existence, punishment in a future body, repeated
    decapitation for mortal sins, restoration to life, and three nights of severe
    punishment. It defines renunciation as both open confession and mental resolve
    not to sin again, warns against concealing sins, recounts Ataro-pad son of Zaratust
    disciplining a disciple who kept a secret, and lists qualifications for priestly
    duty. Translator notes describe the soul hovering near the body for three nights
    before departing to the other world and compare the punishment motif with related
    Zoroastrian texts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who does not engage in renunciation is described as being in hell
    until the future existence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the future body, the person is brought from hell, his head is cut off once
    for every mortal sin, he is made alive again at the last time, and three nights
    of severe punishment are inflicted.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Renunciation of sin is described as requiring both open and mental engagement.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The open duty of renunciation is special confession of the known sin, and
    the mental duty is the thought that the person will not commit sin henceforth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Except for pious alms, what occurs before renunciation should not be overlooked
    or kept secret.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some opinions in the passage say that concealing sin counts as much as three
    Srosho-charanams, and that concealing a sin of three Srosho-charanams makes a
    person worthy of death.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ataro-pad son of Zaratust is said to have instructed a disciple to conform
    to the renunciation of sin.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the disciple kept one secret, Ataro-pad ordered that he should never
    again be apparent in that duty; even after supplication and repentance, Ataro-pad
    did not become high-priest over him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A proper person for priestly duty is described as perfect in the commentary
    of the law, finding the punishment of sin easy, and having controlled himself;
    some add completion of priestly studies.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A translator note says the soul is supposed to hover about the body for three
    nights before finally departing for the other world and passing through an investigation
    concerning sins and good works.
  category: sequence
  evidence_refs:
  - ev:6
