canonical_text:
  quote: ''
  summary: The passage describes a caverned mountain between trees that protects and
    sources the waters flowing to the seven regions. It then describes the three-legged
    ass standing in the wide-formed ocean, including its body, eyes, mouths, feet,
    ears, golden branched horn, cry, power to agitate and purify waters, reproductive
    effects on water-creatures, aid to Tistar, and association with ambergris. It
    closes by mentioning the ox Hadhayo-s, also called Sarsaok, on which men passed
    between regions in the original creation.
  language: English
  quote_policy: summarized
