  summary: The passage explains correspondences between Yasna or Visperad chapters,
    their stanza counts, elements of the human body, spiritual faculties, future apostles,
    judges, warriors, judgments, and countries. Correct recitation by line and stanza
    is said to bring the presence of apostles, increase the flourishing of the country,
    lodge judiciousness in judges, and aid warriors in repelling enemies from sixteen
    countries.
