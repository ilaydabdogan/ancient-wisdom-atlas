canonical_text:
  quote: ''
  summary: A prescriptive ritual-legal passage classifies materials contaminated by
    dead matter and gives cleansing procedures using bull's urine, dust, and water.
    It assigns different washing counts to gold, silver, iron, steel, stone, quicksilver,
    amber, jewels, wood-like substances, earthen and horny articles, and other unused
    substances. It also prescribes cutting and drying firewood for a year without
    water before ordinary fire use, citing named authorities and the Avesta.
  language: English
