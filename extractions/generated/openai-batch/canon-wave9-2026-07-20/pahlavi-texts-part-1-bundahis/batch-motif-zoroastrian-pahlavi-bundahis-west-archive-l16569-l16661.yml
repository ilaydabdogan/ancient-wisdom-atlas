canonical_text:
  quote: ''
  summary: 'The passage describes a prenatal attack on Zaratusht: while Dukdav is
    pregnant, a leader with many demons attempts for three nights to destroy him,
    but the fire in the dwelling prevents success. It then gives ritual rules concerning
    water use during worship, prescribed utterance when making water, recitation of
    the Gathas for the dead or in a house, and a nighttime taboo against casting wine,
    herbs, or food northward because a fiend may become pregnant.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dukdav is identified as the mother of Zaratusht and is pregnant with him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: For three nights, each night a leader with a hundred and fifty demons rushes
    against Zaratusht for his destruction.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:8
- id: obs:3
  text: The demons are said not to know a means of accomplishing the destruction because
    fire exists in the dwelling.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Disciples going to perform worship have a tank and sprinkle a stone seat;
    the rule says this is to be done sitting to avoid making an excessively wet place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage invokes priestly teaching in the Vendidad about making water while
    standing, the required Avesta utterance, and sin if the utterance is omitted.
  category: speech
  evidence_refs:
  - ev:4
  - ev:10
- id: obs:6
  text: Reciting the Gathas over the dead is said not to be beneficial; reciting the
    three opening Has of the Ustavaiti Gatha on the road is not proper; reciting them
    over a man in the house is said to be healing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: At night, wine, aromatic herbs, and food-like things are not to be cast away
    toward the north quarter, because a fiend will become pregnant; if one casts them
    away, one Yatha-ahu-vairyo is to be uttered.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A note explains that the fiend or druj is usually considered a female demon,
    and that demons are supposed to come from the north.
  category: other
  evidence_refs:
  - ev:9
