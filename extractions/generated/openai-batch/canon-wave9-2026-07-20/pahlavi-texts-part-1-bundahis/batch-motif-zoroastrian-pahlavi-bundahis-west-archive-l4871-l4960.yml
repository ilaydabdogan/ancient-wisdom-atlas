canonical_text:
  quote: ''
  summary: The passage describes the sea Kyansih as once sweet and free of noxious
    reptiles, later salty and foul, and destined to become sweet again at the renovation
    of the universe. It then explains that, when the primeval ox died, grains, medicinal
    plants, and specific plants arose from its marrow and body parts. The ox’s seed
    was carried to the moon station, purified, and used to produce animal species;
    first a male and female ox, then pairs of all species, were released onto the
    earth, fasted for a thousand days and nights, and then consumed water and herbage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sea Kyansih is located in Sagastan; at first it lacked noxious creatures,
    snakes, and lizards, and its water was sweeter than other seas, but later it became
    salty.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sea became so foul and salty through the hot wind that one could not approach
    within one league because of the stench.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the renovation of the universe, the sea Kyansih will become sweet again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the primeval ox passed away, grain of fifty-five species and twelve species
    of medicinal plants grew where its marrow came out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that every separate creature or thing whose lodgment is
    in the marrow comes from the marrow.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Specific plants are said to arise from specific parts of the ox: peas from
    the horns, leek from the nose, grapevine from the blood, rue-like herbs from the
    lungs, and thyme from the middle of the heart.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The grapevine is linked to the ox’s blood, and wine is explained as abounding
    with blood on that account.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The seed of the ox was carried up to the moon station, purified there, and
    produced manifold species of animals.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: First two oxen, one male and one female, and then one pair of every single
    species were let go into the earth and were discernible in Airan-vegyon.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'Because of the ox’s value, it is said to have been created twice: once as
    an ox and once as the manifold species of animals.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The released animals were without eating for a thousand days and nights; afterwards
    they first consumed water and then herbage.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Three classes of animals were later produced, with goat and sheep named first
    and camel named next in the supplied passage.
  category: sequence
  evidence_refs:
  - ev:8
