canonical_text:
  quote: the tree of all germs, amid the wide-formed ocean
  summary: Aharman comes to the plants when vegetation is dry. Amerodad takes the
    essence of the world’s vegetation, pounds it, and mixes it with the rain-water
    of Ti^tar. After rain, the whole earth sprouts with many species, including species
    provided against diseases. From collected seed a tree of all germs is produced
    in the wide-formed ocean, and all plant species grow from it. A griffon bird rests
    on the tree and scatters dry seed into the water, from which it rains back to
    earth. Nearby is produced the white Horn tree, described as counteracting decrepitude.
  language: English
  quote_policy: quoted
