canonical_text:
  quote: ''
  summary: The passage gives several genealogical notices, including heroic and royal
    lines connected with Keresasp, Aurvakhsh, Athrat, Loharasp, Vishtasp, Spend-dad,
    Artakhshatar, Sasan, Kai-Apiveh, and Farhank. It then narrates that the glory
    of Frethun settled on a reed root in the wide-formed ocean; Noktarga used sorcery
    to make a cow, fed reeds to it until the glory went to the cow, milked it, and
    gave the milk to his three sons, but the glory passed instead to Farhank. Noktarga
    then wished to injure Farhank, who went away with the glory.
  language: English
  quote_policy: summarized
