canonical_text:
  quote: ''
  summary: The passage gives ritual and legal instructions about mortal and Tanapuhar
    sins, atonement, renunciation, worship, sacred objects, offenses against water
    and fire, and the relation of Auharmazd’s beneficence to the evil spirit. Named
    authorities state that certain acts or ritual works extirpate or offset sins,
    and that renunciation from the root frees a person from sin.
  language: English
  quote_policy: summarized
