- id: obs:1
  text: Nosai Bur-Mitro is presented as speaking three sayings about acts associated
    with extirpating mortal sins and ritual propriety.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: One saying states that next-of-kin marriage will extirpate mortal sins.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person who commits a sin against water and kills a lizard or other noxious
    water-creature is said to have atoned; some also say a scorpion is proper to be
    killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Atoning to fire for an offense against water, and atoning to water for an
    offense against fire, is described as proper.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Tanapuhar sin is said to be atoned by consecrating a sacred cake or by accomplishing
