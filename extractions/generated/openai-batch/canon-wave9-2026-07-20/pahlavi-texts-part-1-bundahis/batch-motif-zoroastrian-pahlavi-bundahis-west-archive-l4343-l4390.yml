canonical_text:
  quote: ''
  summary: The passage describes the seven keshvars or regions, with Khvaniras in
    the middle, bounded by sea and separated by a lofty mountain that prevents travel
    between regions. It states that the greatest benefits and also the greatest activity
    of the evil spirit occur in Khvaniras, where the Kayanians, heroes, the Mazdayasnian
    religion, and Soshyans are located or originate. Soshyans is said to make the
    evil spirit impotent and to cause resurrection and future existence.
  language: English
