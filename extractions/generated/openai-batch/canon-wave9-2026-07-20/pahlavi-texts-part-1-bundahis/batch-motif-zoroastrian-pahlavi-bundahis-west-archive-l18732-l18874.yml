canonical_text:
  quote: ''
  summary: The passage gives an exegetical mapping of Gathic stanzas, repeated ritual
    recitations, and line counts to acts of laudation, destruction, judgment, elemental
    domains, social orders, nightly spiritual activity, and the assistants of the
    supreme Zaratusht. It links specific repetitions to the beneficent spirit, the
    earth, creatures of the good and evil spirits, judgments, living beings, Zaratusht,
    Shatvairo, metal, waters, plants, sovereigns, peace, Ahuramazd, archangels, fiends,
    submission, healing, and the completion of the Gathas.
  language: English
  quote_policy: summarized
