canonical_text:
  quote: ''
  summary: A brief closing reverence to the congregation and archangels precedes Chapter
    III. Zaratust asks Auharmazd how the good Mazdayasnian religion will be restored
    and how demons of the race of Wrath will be destroyed; he also asks for death
    for himself and his favoured ones so they will not live in a perplexing evil time.
    Auharmazd answers by describing a later fiend, She^/aspih of the Kilisyakih, associated
    with a red-bannered people. Their advance is accompanied by signs in the sun,
    darkness, moon, earth, wind, social distress, and planetary support for vile sovereignty,
    and they move toward Iran and river boundaries.
  language: English
  quote_policy: summarized
