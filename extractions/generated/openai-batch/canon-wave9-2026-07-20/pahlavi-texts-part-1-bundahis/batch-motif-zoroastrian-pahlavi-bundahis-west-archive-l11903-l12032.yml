  quote: ''
  summary: A prophetic passage describes a perplexing time of ecological disruption,
    failing rain and waters, weakened livestock, religious uncertainty, social distress,
    displacement of virtuous people, misrule by foreign powers, exposed metals, hoarded
    wealth, moral disorder, shortened time, and increased suffering. Auharmazd tells
    Zaratust that the wicked evil spirit becomes more oppressive and tyrannical when
    it is necessary for him to perish.
