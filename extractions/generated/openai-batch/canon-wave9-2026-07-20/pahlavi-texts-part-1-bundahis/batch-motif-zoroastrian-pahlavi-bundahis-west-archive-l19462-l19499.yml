canonical_text:
  quote: Srosh will be able to save his soul from the hands of the demons for the
    three days
  summary: Zaratui-t asks Auharmazd when meat must not be eaten. Auharmazd answers
    that, when a person dies in a house, meat is not to be placed on the sacred cake
    or eaten by the dead person's relations until three nights have passed; other
    foods such as milk, cheese, fruit, eggs, and preserves may be placed. The ceremonial
    of Srosh is to be performed for three days because Srosh protects the soul from
    demons. A note explains that the soul is thought to remain near the body for the
    first three nights and depart for the other world at the third dawn.
  language: English
  quote_policy: quoted
