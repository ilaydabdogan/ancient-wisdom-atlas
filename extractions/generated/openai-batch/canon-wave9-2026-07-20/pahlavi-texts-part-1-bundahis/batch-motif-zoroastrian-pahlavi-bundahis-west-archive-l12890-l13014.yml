canonical_text:
  quote: ''
  summary: The passage describes Hushe^ar's future birth, his conference with Auharmazd
    at age thirty, and his command for the sun to stand still. The sun stands still
    for ten days and nights, after which Mitro tells Hushe^ar to command it to move
    because the regions are dark; when it moves, Var^avand and all mankind believe
    in the good religion. Auharmazd foretells restoration, Peshyotanu's later prominence,
    hostile enemies who weaken religion and destroy fire, and the later millennium
    of Hushe^ar-mah, in which creatures progress, a serpent-origin fiend is destroyed,
    medicine prevents death, heretics refuse a gift, and Aharman rises through spite.
    Translator notes report related Dinkard and Persian Rivayat material, including
    miraculous birth through water and preserved seed.
  language: English
  quote_policy: summarized
