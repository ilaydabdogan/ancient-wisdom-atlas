canonical_text:
  quote: ''
  summary: The evil spirit attempts to destroy the light of Auharmazd, retreats to
    gloomy darkness, and forms many demons and fiends. Auharmazd sees the evil spirit's
    terrible creatures, while the evil spirit sees and commends Auharmazd's delightful
    creatures. Auharmazd, knowing the outcome, proposes peace and offers immortality
    and freedom from decay, hunger, and thirst if the evil spirit assists and praises
    his creatures. The evil spirit refuses, vows not to assist or praise, and declares
    an intention to destroy Auharmazd's creatures and turn them away from Auharmazd
    toward himself.
  language: English
