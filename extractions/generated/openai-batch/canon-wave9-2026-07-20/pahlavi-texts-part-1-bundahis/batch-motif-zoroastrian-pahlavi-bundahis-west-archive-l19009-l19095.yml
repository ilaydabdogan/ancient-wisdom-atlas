  quote: ''
  summary: The passage gives rules for retaining or relinquishing a day-period in
    ritual practice according to the visibility of certain stars, and then begins
    an appendix in which Zaratusht, seated before Auharmazd, asks about Auharmazd's
    perceptible form, his intangible nature, and whether intangible divine beings
    should be worshipped after they are no longer seen.
  language: English
  quote_policy: summarized
