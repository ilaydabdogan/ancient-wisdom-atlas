canonical_text:
  quote: ''
  summary: The passage gives ethical maxims about making enemies friends, turning
    wicked people from sin, teaching the ignorant, visiting the learned, the good,
    and fires, acting for the soul rather than the body, the Gathas and renunciation
    of sin as opposition to adversarial beings, proper detachment from the world,
    truth and deceit, fire, giving to the vile, and limits concerning death, wickedness,
    and righteousness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes making an enemy a friend, a wicked one righteous, and
    an ignorant one learned through conduct involving worldly wealth, turning away
    from sin, and enabling learning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Men''s walks are to be directed chiefly to three places: the abode of the
    well-informed, the abode of the good, and the abode of fires.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stated reasons for the three visits are becoming wiser and more religiously
    grounded, renouncing evil and carrying home good, and causing the spiritual fiend
    to turn away.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage contrasts actions done for the soul with actions done for the
    body and gives different consequences for the world and spiritual existence.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bakht-afrid is cited as saying that every Gatha of Auharmazd opposes the one
    adversary and that renunciation of sin opposes every fiend.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says anxiety regarding the world is not to be suffered, the world
    is not to be considered as anything whatever, and it is not to be let slip from
    the hand.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that truth is the best thing and deceit the worst thing,
    while also giving cases where speaking true may make one wicked and speaking false
    may make one righteous.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says fire is not to be extinguished because this is a sin, while
    also saying there is one who extinguishes it and is good.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says nothing is to be given to the vile, while also saying the
    best and most pleasant ragout is to be given to the vile in a particular case.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says there is a remedy for everything but death, a hope for everything
    but wickedness, and that everything will lapse except righteousness.
  category: speech
  evidence_refs:
  - ev:9
