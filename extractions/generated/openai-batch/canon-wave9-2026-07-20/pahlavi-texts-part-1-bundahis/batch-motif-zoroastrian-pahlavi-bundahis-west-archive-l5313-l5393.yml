canonical_text:
  quote: ''
  summary: The passage describes corrupting false speech associated with the evil
    spirit and demons; Mashya and Mashyoi going hungry in herbage clothing, obtaining
    goat milk, slaughtering a sheep, making fire with angelic guidance, roasting and
    distributing meat portions to fire and angels, acquiring clothing, iron, and shelter,
    and then entering mutual violence as demons become more oppressive.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A false speech states that the evil spirit created water, earth, plants, animals,
    and other things; after it, the two named figures become wicked and their souls
    are said to be in hell until the future existence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two figures go thirty days without food, are covered with herbage clothing,
    and go into the wilderness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: They come to a white-haired goat and milk the udder with their mouths.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the milk is consumed, Mashya speaks to Mashyoi about delight being greater
    after the milk is devoured by his body.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A second false speech increases the power of the demons, and the taste of
    food is reduced so that only one part out of a hundred remains.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After another thirty days and nights, they come to a fat, white-jawed sheep
    and slaughter it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: They extract fire from lote-plum and box-tree wood through the guidance of
    heavenly angels, stimulate the fire with their mouths, kindle fuel, and roast
    the sheep.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: They place three handfuls of meat into the fire as the fire's share and toss
    one piece toward the sky as the angels' share; a vulture carries some away, and
    a dog eats the first meat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: They are first covered with skins, and later woven garments are prepared from
    cloth woven in the wilderness.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: They dig a pit, obtain iron, beat it with a stone into a cutting edge without
    a forge, cut wood, and prepare a wooden shelter from the sun.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Because of gracelessness, demons become more oppressive, and the two figures
    act with malice toward each other, smiting each other and tearing hair and cheeks.
  category: sequence
  evidence_refs:
  - ev:8
