  quote: ''
  summary: The passage describes seven planetary chieftains coming to seven constellation
    chieftains, including named planetary and constellation pairings. It also describes
    tail-bearing celestial beings, especially Mu^par, whose harm is reduced when the
    sun attaches him to its radiance. The passage then presents a cosmological geography
    in which Mount Alburs encloses the world and Mount Terak, the middle of the world;
    the sun’s revolution is compared to a moat, and the sun, moon, and stars return
    from behind Terak of Alburs.
