canonical_text:
  quote: ''
  summary: The passage says the earth, associated with the lodgment of Spendarmad,
    is distressed by sinners and pleased by cultivation, cattle-rearing, and virtuous
    birth. It instructs people to propitiate Horvadad and Amerodad by protecting water
    and vegetation, avoiding pollution and unlawful destruction. Unatoned sins against
    even a twig or drop cause plant and water spirits to obstruct the sinner from
    heaven after death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Spendarmad is described as having a lodgment in the earth.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:5
- id: obs:2
  text: The earth becomes distressed when violent sinners, robbers worthy of death,
    and disrespectful wives walk sinfully upon it while their husbands are virtuous.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The earth's pain when death-worthy sinners walk on it is compared to the distress
    of a mother with a dead son on her bosom.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The earth's happiness arises from places where tillage and cultivation are
    performed, a virtuous son is born, and cattle are reared.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage connects cultivation, virtuous birth, and cattle-rearing with
    worldly fame and a share in Auharmazd's splendour in heaven.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A person who wishes to propitiate Horvadad and Amerodad must propitiate their
    water and vegetation at every place and time.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage commands that those who consume and steal water and vegetation
    should be seized.
  category: action
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:8
  text: The passage forbids acting oppressively, walking sinfully, polluting water
    with bodily refuse, dead matter, or other pollution, unlawfully destroying vegetation,
    and giving fruit to the idle and vile.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: If a person commits an unatoned sin against vegetation, even a single twig,
    the spirits of all plants stand high before him after death and prevent him from
    going to heaven.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: If a person commits an unatoned sin against water, even a single drop, it
    likewise stands high and prevents him from going to heaven.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Water and vegetation are called counterparts of Horvadad and Amerodad.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Auharmazd is said to speak this material to Zaratusht.
  category: speech
  evidence_refs:
  - ev:11
