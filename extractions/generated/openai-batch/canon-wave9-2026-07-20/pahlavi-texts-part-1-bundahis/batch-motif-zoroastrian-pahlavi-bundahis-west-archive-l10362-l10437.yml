  summary: The passage describes Cancer's zodiacal position, Tistar's request for
    aid, his three bright forms and rain that destroys noxious creatures, the wind
    spirit's manifestation and formation of the ocean, the ocean's sources and fountains,
    and Tistar's descent into the ocean to confront Apaosh with power granted by Auharmazd.
