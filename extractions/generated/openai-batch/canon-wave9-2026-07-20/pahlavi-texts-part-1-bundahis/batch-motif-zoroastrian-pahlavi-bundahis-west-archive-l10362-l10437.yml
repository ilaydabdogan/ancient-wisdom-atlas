literal_observations:
- id: obs:1
  text: Cancer is said to have become a zodiacal constellation and to be the fourth
    constellation because Tir is the fourth month of the year.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tistar asks for assistance; Vohuman and Horn cooperate with him, Burj of the
    waters and the water mutually aid, and righteous guardian spirits keep peace.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Tistar is converted into three forms: a man, a bull, and a horse; each form
    is brilliant for ten nights and lets rain fall for the destruction of noxious
    creatures.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The rain drops are compared to large bowls of drawn water; where driven, they
    kill noxious creatures except reptiles, which enter the muddiness of the earth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wind spirit appears on earth in human form, radiant and tall, with wooden
    boots on his feet.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wind spirit stirs the atmospheric wind; water in its grasp is flung to
    the sides of the earth, from which a wide-formed ocean arises.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ocean keeps one-third of the earth and contains a thousand sources and
    fountains, with waters coming from lakes and returning into the ocean.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: After noxious creatures die, poison from them mixes into the earth, and Tistar
    goes down into the ocean to destroy that poison.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Apaosh the demon hastens to meet Tistar; at the first contest Tistar is afraid
    and applies to Auharmazd.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Auharmazd gives Tistar power arising through propitiation, praise, and invocation
    by name, described through tenfold comparisons to strong animals, hurled mountains,
    and rivers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Tistar drives Apaosh away from the ocean sources and then seizes many handfuls
    of water with a cup and measuring bowl described as having guardian-spirit-like
    diligence.
  category: action
  evidence_refs:
  - ev:7
