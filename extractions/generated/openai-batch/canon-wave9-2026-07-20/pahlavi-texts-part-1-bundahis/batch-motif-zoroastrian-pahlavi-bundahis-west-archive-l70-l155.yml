  summary: The passage introduces the Parsi scriptures, distinguishing the Avesta
    as the source for the main outlines of the religion and Pahlavi writings as the
    source for many details of traditions, ceremonies, and customs. It frames the
    surviving Avesta fragments and later Pahlavi texts through architectural imagery
    of foundations, remnants, ruins, and a later edifice, and mentions Cyrus, Darius,
    Alexander, and Greek successors in relation to the history of the faith.
