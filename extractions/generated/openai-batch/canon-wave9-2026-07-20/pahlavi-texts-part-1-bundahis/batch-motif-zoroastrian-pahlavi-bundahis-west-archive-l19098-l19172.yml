canonical_text:
  quote: ''
  summary: Auharmazd tells Zaratusht that each of the named divine beings has produced
    a corresponding worldly creation. The passage lists the correspondences among
    Auharmazd, Vohuman, Ar^avahist, Shatvairo, Spendarma^, Horvadad, Amerodad, and
    the righteous man, cattle, fire, metal, earth and virtuous woman, water, and vegetation.
    It teaches that care for these seven creations is care for the seven archangels
    and protects the soul from Aharman and demons. It then gives detailed instructions
    for propitiating Auharmazd through care of the righteous man and propitiating
    Vohuman through protection and good treatment of cattle.
  language: English
  quote_policy: summarized
