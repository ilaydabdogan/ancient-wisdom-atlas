canonical_text:
  quote: ''
  summary: The passage gives rules about adoption, offspring, charitable giving, and
    nocturnal purity practice. It states that offspring should be begotten because
    a son's duties and good works count as the father's; that giving bread to a worthy
    person can make later good works from that surplus count to the giver; that well-water
    should not be drawn at night because of uncleanness; and that eatables should
    not be cast north at night lest a fiend become pregnant, with protective recitation
    prescribed around such food-related danger.
  language: English
  quote_policy: summarized
