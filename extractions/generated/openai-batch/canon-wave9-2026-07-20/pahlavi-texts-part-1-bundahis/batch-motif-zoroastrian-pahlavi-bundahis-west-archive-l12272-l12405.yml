canonical_text:
  quote: ''
  summary: Auharmazd speaks to Zaratu^t about hostile demonic and foreign forces entering
    the countries of Iran, three great contests across different eras, displacement
    of Iranian people to Pa^ashkhvargar and Pars, reports of cave, mountain, and river
    dwellings, the fire Vimasp by a deep lake with medicinal water opposed to demons,
    and the end of Zaratu^t's millennium when wickedness is not to pass into the next
    millennium.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment says an Assyrian dwelling is connected with slaying Assyrian
    people and destroying their abode; some identify it as a lurking-place of demons.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those described as of the race of Wrath are turned back in very large numbers,
    and demons with dishevelled hair, banners, standards, and an innumerable army
    come to the countries of Iran created by Auharmazd.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An invading army associated with the Turk and possibly the Karm is described
    as remaining in the countries of Iran in excessive multitude, compared to hairs
    in a horse's mane.
  category: action
  evidence_refs:
  - ev:2
  - ev:9
- id: obs:4
  text: The leathern-belted Turk and the Ruman She^aspih of Kilisyakih come forth
    with simultaneous movement; the passage states that in three places there was
    and will be three times a great contest with similar strife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Two earlier contests are named: one in the reign of Kai-Kaus involving demons
    and archangels, and a second when Zaratu^t received the religion and King Vistasp
    and Arjasp were involved in the war of the religion.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A third contest is placed at the end of Zaratu^t's millennium, when Turk,
    Arab, and Ruman come to the specified place, with one variant identifying the
    plain of Nii-anak.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:9
- id: obs:7
  text: People from the countries of Iran come from their own places to Pa^ashkhvargar
    because of those of the race of Wrath; reports of cave dwellings, mountain dwellings,
    and river dwellings remain at Pa^ashkhvargar and Pars.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Some say the fire Vimasp is on a deep lake with medicinal water opposed to
    demons; the passage says it may be used anew and may become shining in the countries
    of Iran.
  category: object
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:9
  text: In the perplexing time, a person able to save his own life has no recollection
    of wife, child, or wealth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The hundredth winter is identified with the end of Zaratu^t's millennium,
    and the passage says nothing wicked may go from this millennium into that millennium.
  category: sequence
  evidence_refs:
  - ev:8
