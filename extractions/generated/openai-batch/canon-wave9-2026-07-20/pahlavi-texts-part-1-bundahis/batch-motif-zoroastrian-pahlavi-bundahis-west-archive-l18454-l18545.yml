canonical_text:
  quote: ''
  summary: The passage explains functions and correspondences of Gatha and Yasna sections.
    Four Yatha-ahu-vairyo recitations are said to promote tolerance of superior commands,
    domesticate good thoughts, words, and deeds in the world, and make the fiend less
    powerful. A sevenfold set of Ahunavaiti Gatha sections is correlated with divine
    names and earthly creations. The progress of several Gathas and the Yasna is assigned
    to social and religious authorities. Further sections give stanza counts and connect
    hymnic portions with hot ordeals, praise for Auharmazd's production of good creations,
    and five comforts and five discomforts of the earth.
  language: English
  quote_policy: summarized
