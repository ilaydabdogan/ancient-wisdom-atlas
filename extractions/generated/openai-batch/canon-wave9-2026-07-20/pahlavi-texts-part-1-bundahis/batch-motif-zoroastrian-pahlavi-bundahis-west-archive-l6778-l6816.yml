  summary: Chapter XXIV opens with a revelatory statement about the chieftainship
    of humans, animals, and every single thing. It names the first human, Gay6mar(af,
    as brilliant and white and links universal chieftainship with Zaratu^t^. It then
    gives a catalogue of animal chiefs, identifying particular goats, sheep, camels,
    oxen, horses, asses, dogs, and a brown hare by color and bodily features. Notes
    mention textual uncertainties and cite a related Pahlavi Visp. list of chiefs
    by category.
