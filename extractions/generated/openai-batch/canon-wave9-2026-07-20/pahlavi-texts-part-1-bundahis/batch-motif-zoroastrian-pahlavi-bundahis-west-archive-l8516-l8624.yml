canonical_text:
  quote: ''
  summary: The passage describes an afterlife condition in which family relations
    are shown without new begetting, Soshyans and his assistants assign recompense
    according to deeds by Auharmazd's order, and the righteous are conveyed to paradise.
    It also describes nakedness for one who did not perform specified worship or righteous
    giving, followed by worship and heavenly provision of clothing. A later section
    lists Auharmazd and allied beings seizing opposing evil beings or qualities, then
    says Aharman and Az remain at large while Auharmazd comes to the world as Zota
    with Srosh as Raspi and the Kusti in hand.
  language: English
  quote_policy: summarized
