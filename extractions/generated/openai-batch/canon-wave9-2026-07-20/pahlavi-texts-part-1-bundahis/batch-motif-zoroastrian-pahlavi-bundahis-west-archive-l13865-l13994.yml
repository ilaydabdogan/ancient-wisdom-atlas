canonical_text:
  quote: ''
  summary: The passage gives ritual purity rules about how dead matter or a corpse
    pollutes substances, ground, prepared food, clothing, holy-water, sacred milk,
    butter, and a house. It especially instructs that when a dog or person dies in
    a house where a sanded ceremony is prepared, the fire must be protected and removed
    if possible, even near the corpse, while avoiding unnecessary damage to walls.
    It also records views on washing prayer clothing and on rooms affected by a corpse
    near an entrance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some substances are described as connected with the ground so that dead matter
    pollutes the space it touches and can convey pollution downward toward water.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dung-fuel, ashes, flour, and other powdered things are described as connected
    with their own substance and separated from the ground; dead matter pollutes the
    whole of such substances but does not pollute the ground through them.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a dog or person dies in a house where the sanded ceremony is prepared,
    the first required action is to preserve the fire from harm.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If possible, the fire is to be carried away even when doing so brings it within
    three steps of the corpse; the wall is not to be cut in that case.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A named authority, Roshan, says an earthen wall may be cut into, but a mortar
    wall is not to be cut.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bringing the fire nearer than three steps to the corpse is called a Tanapuhar
    sin; if exudation occurs to the corpse, it is called worthy of death.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Prepared food in the affected house is all useless, while unprepared food
    may become usable after a stated period of nine nights or a month.
  category: object
  evidence_refs:
  - ev:6
