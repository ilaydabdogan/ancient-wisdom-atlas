canonical_text:
  quote: ''
  summary: The passage gives ritual-legal rules for removing a corpse from water without
    letting corpse-drippings return to the water, discusses permitted and prohibited
    methods of dragging or carrying it, emphasizes the remover’s intention and liability,
    prescribes handling of decomposed fragments and washing of tools and hands, forbids
    moving a corpse from water into rain, and gives rules for contaminated clothing
    and leather purification.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A corpse removed from water is to be carried far enough away that liquid dripping
    from it does not flow back into the water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the corpse is removed, it is to be shown to a dog and carried away by
    two men.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage distinguishes allowable and non-allowable ways of dragging or
    moving the corpse over, through, above, or below water, with named authorities
    giving differing rulings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person entering the water is instructed to do so with the intention of bringing
    out all corpses that may be below.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the person disturbs another corpse without that intention, the person becomes
    polluted.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a heavy corpse cannot be removed by one person, the person may go to prepare
    means to remove it; willfully failing to return brings pollution and death-worthiness,
    while inability to return does not.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: When a decomposed corpse must be cut into fragments for removal, each fragment
    is still to be brought out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: For each fragment, the person’s hands and knife are to be washed with bull’s
    urine and cleaned with dust and moisture.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When rain is falling and the corpse lies in water, taking it from the water
    to place it in the rain is not allowable.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Useless clothing is designated for carrying a corpse; contaminated portions
    are to be cut away, and the remaining cloth is to be washed for a six-month period.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Clothing worn by a menstruous woman is to be discarded in the same fashion.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Leather clothing is to be washed with bull’s urine, dried with dust, washed
    with water, and exposed to the sun for three months.
  category: sequence
  evidence_refs:
  - ev:7
