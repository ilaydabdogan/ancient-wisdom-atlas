canonical_text:
  quote: ''
  summary: 'The passage explains why Gayomard was preserved for thirty winters despite
    sicknesses and death-causing forces: a decree of Time appointed him to brilliance
    and preservation of life. It then describes a celestial arrangement in which Jupiter
    is life toward creatures while under the control of the luminaries, Saturn is
    death toward creatures, and Gayomard’s death occurs when Saturn returns to Libra
    and Jupiter is low in Capricornus, allowing Saturn’s victory and Aharman’s disfiguring
    defects to affect Auharmazd’s creatures.'
  language: English
  quote_policy: summarized
