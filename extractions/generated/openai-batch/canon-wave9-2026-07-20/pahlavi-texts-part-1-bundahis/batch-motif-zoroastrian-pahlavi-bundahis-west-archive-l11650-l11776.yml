canonical_text:
  quote: ''
  summary: A prophetic address to Zaratusht describes a destructive race of Wrath
    entering Iran from the east, slaying and burning, damaging Auharmazd-created order,
    religion, security, and the fire of Vahram. The passage continues with political
    contraction, deceit, social and familial alienation, cosmic and agricultural decline,
    diminished human strength and virtue, improper treatment of dead matter, and a
    movement toward hell.
  language: English
  quote_policy: summarized
