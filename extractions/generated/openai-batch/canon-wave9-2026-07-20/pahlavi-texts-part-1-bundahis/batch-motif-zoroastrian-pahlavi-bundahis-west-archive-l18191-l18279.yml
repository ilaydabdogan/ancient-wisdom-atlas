canonical_text:
  quote: ''
  summary: The passage describes correspondences among ritual chapters in the preliminary
    Yasna ritual, with a note warning that the section is obscure and textually corrupt.
    It then states that, according to revelation and the wise of the primitive faith,
    a fifteen-year-old Mazdayasnian male who confesses failings to high-priests, receives
    the whip and scourge, chants the five Gathas, consecrates good waters, and performs
    the renewed-birth ceremony becomes a mature youth rather than a child and receives
    a share in initiation prayers and fires. It adds that the five Gathas are made
    from the body of a righteous man.
  language: English
  quote_policy: summarized
