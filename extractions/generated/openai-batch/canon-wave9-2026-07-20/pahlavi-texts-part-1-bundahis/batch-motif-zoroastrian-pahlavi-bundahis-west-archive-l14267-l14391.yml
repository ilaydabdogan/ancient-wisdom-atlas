  quote: ''
  summary: The passage gives purity and legal rulings about dead matter in animals,
    forests, firewood, doors, and water. It defines penalties for throwing a corpse
    into water, measures the extent of water pollution, and states duties and procedures
    for removing a corpse from water, with differing opinions from named authorities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A flock containing a sheep that has eaten dead matter, a forest containing
    a tree mingled with dead matter, and a firewood stand containing a greasy stick
    of firewood are treated as affected by contamination.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Afarg states that such a flock and forest should not be made fruitful, and
    that the affected firewood is useless.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A door struck by a corpse is subject to rules of discard or non-use; authorities
    agree about discarding a town or city door, differ about a mostly closed door,
    and agree that other doors are not to be discarded.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Doors are ranked for reuse: a chief apartment door may become a menstruation-place
    door, that door may become a depository-of-the-dead door, and a depository-of-the-dead
    door is fit for no later purpose.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A person who sinfully throws a corpse into water is described as worthy of
    death; simultaneous and separate throwings are counted differently for sin reckoning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage measures water pollution from dead matter by steps of three feet
    in different directions and depths.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: When a man finds a corpse in water and can bring it out without injury, abandoning
    it is not allowed; named authorities differ on cases involving injury and on the
    penalty for failure.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: For removing the corpse, the man is to lay aside clothing, bring out what
    he is first and best able to bring, use the breadth of the water if possible and
    otherwise the length, and not wait for showing it to a dog and two men.
  category: sequence
  evidence_refs:
  - ev:8
