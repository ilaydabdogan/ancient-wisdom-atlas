    Soshyans says it is not; other doors are not to be discarded.
  source_text_path: texts/public-domain/zoroastrian/project-gutenberg/pahlavi-texts-part-1-bundahis.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: "§75"
  quote_or_summary: A chief apartment door may be used for a menstruation place, that
    door may be used for the depository of the dead, and the depository-of-the-dead
    door is fit for no purpose; the more pleasant may serve for the more grievous.
  source_text_path: texts/public-domain/zoroastrian/project-gutenberg/pahlavi-texts-part-1-bundahis.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: "§76"
  quote_or_summary: One who sinfully throws a corpse into water is worthy of death
    on the spot; one or ten corpses thrown at one time count as one death-worthy sin,
    while separate acts count separately.
  source_text_path: texts/public-domain/zoroastrian/project-gutenberg/pahlavi-texts-part-1-bundahis.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: "§77"
  quote_or_summary: 'The extent of water pollution from thrown dead matter is measured
    in steps of three feet: different distances are specified for advancing water,
    passed-over water, water alongside, depth, and water pouring over the dead matter.'
  source_text_path: texts/public-domain/zoroastrian/project-gutenberg/pahlavi-texts-part-1-bundahis.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: "§78 and note"
  quote_or_summary: For great standing water, the polluted proportion is to be carried
    away with the dead matter; the translator notes that the sentence is obscure and
    explains this as drawing off a measured quantity of polluted water.
  source_text_path: texts/public-domain/zoroastrian/project-gutenberg/pahlavi-texts-part-1-bundahis.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: "§§79-82"
  quote_or_summary: If a man finds a corpse in water and can bring it out without
    injury, he may not abandon it. Soshyans allows non-removal when there is injury
    but assigns Tanapuhar sin when there is no injury; Kushtano-buce forbids abandonment
    even with injury and assigns death-worthiness for failure; Gogoyasp gives intermediate
    penalties.
  source_text_path: texts/public-domain/zoroastrian/project-gutenberg/pahlavi-texts-part-1-bundahis.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: "§§83-84"
  quote_or_summary: When removing the corpse, clothing is to be laid aside because
    it becomes polluted; the remover should bring out what he can first and best,
    use the breadth of the water if able and otherwise the length, and not wait for
    showing it to a dog and two men.
  source_text_path: texts/public-domain/zoroastrian/project-gutenberg/pahlavi-texts-part-1-bundahis.md
