canonical_text:
  quote: ''
  summary: Auharmazd instructs Zaratu^t to learn and teach religious knowledge for
    the preservation of souls in a future troubled time. Zaratu^t asks whether righteous
    people and rites will remain. Auharmazd replies that maintaining sacred signs,
    prayers, rites, and Mazdayasnian practice in that time has great value. He then
    foretells an end-of-millennium period of extreme perplexity, worse than earlier
    evil reigns, with desolation in Iran and loss of religious sovereignty.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Auharmazd tells Zaratu^t to enquire, learn by heart, teach by Zand, Pazand,
    and explanation, and tell priests, disciples, and those not aware of the hundred
    winters.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Auharmazd says that in that time whoever appeals for the body cannot save
    the soul, while whoever appeals for the soul has a miserable body but a soul described
    as fat in heaven.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Zaratu^t asks whether righteous and religious people will remain in the perplexing
    time, including people who wear the sacred thread-girdle, perform rites with sacred
    twigs, and continue next-of-kin marriage.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Auharmazd identifies as among the best men one who, in that perplexing time,
    wears the sacred thread-girdle and celebrates rites with sacred twigs, though
    not as in King Vi^tasp's reign.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Auharmazd equates limited recitation in the perplexing time with more elaborate
    ritual performance in the reign of King Vi^tasp.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: Auharmazd says the most perfectly righteous person remains in the good religion
