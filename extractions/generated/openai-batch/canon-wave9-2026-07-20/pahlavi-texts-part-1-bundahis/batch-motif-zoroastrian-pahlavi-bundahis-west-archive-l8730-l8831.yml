canonical_text:
  quote: ''
  summary: The passage gives genealogical notices about Yim, Yimak, their descendants,
    Dahak, Narsih, and Frettun. It describes a sibling-origin lineage, the cutting
    up of Yim by Spittar and Dahak, a fated purifier figure, Dahak's ancestry extending
    to the evil spirit, and translator notes linking Dahak and Frettun with Avestan
    serpent-slayer traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yim and Yimak are described as a brother-sister pair, and from them a male-female
    pair is born.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The born pair becomes husband and wife; their names are given as Mtrak the
    Aspiyan and Zlydanak Zardahim, and the lineage continues.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Spittar, together with Dahak, cuts up Yim.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Narsih, also called Nesr-gyavan in the passage, is said to have a destiny
    of daily troubles and of making all food purified and pure.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dahak is given a paternal genealogy through Khrutasp, Zainigav, Virafshang,
    Tas, Fravak, and Siyakmak.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dahak is given a maternal genealogy through Udai, Bayak, Tambayak, Owokhm,
