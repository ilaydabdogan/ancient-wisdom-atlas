canonical_text:
  quote: ''
  summary: Aharman approaches Gayomard, while a pure liturgy and Auharmazd's meditation
    oppose the fiend. When Gayomard dies, eight metallic minerals arise from his members,
    and gold is linked to his life and seed. Spendarmad receives the gold, which remains
    in the earth for forty years. Mashya and Mashyoi then emerge joined like a Rivās-plant,
    with indistinct male and female differentiation and an associated glory. Auharmazd
    says the glory was created before the body, and the pair later change from plant
    shape into human shape as the glory spiritually enters them.
  language: English
  quote_policy: summarized
