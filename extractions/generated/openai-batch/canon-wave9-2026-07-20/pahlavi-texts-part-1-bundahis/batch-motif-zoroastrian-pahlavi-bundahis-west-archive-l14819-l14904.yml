canonical_text:
  quote: ''
  summary: 'The passage gives ritual rules for a menstruating woman: how household
    surfaces are or are not polluted, what ornaments and garments she removes, when
    she sits in the menstruation place, how a prayer formula is retained inwardly
    or spoken aloud, and how her look affects ritually prepared hands.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a woman sits on a cushion and menstruation occurs, moving from the cushion
    to the carpet and then out into the bed-chamber makes the carpet and bed-chamber
    polluted, while the cushion is not polluted because it is already in use.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If both the cushion and carpet are already in use, the bed-chamber alone is
    polluted; if all three are in use, the passage says there is no pollution.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When she knows it is menstruation, she is instructed to remove, in order,
    the necklace, ear-rings, head-fillet, and outer garments.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: If she remains in the appointed place for the purpose, even for a very long
    time, the outer garments are said to remain clean.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: When she knows certainly that it is menstruation, a prayer is to be retained
    inwardly until all garments have been changed and she has sat down in the place
    for menstruation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The note describes the menstruation place as a room or cell for unclean persons
    where they can see neither sun, moon, stars, fire, water, sacred vessels, nor
    righteous men, and it gives distance rules from fire, water, sacred twigs, and
    righteous men.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: When worship is being celebrated, a prayer is to be retained inwardly; if
    menstruation occurs, the prayer is to be spoken out.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hands sprinkled in ceremonial ablution become unclean when a menstruous woman
    sees them, and the passage says the same applies even when she looks hastily and
    does not see the sacred twigs.
  category: relationship
  evidence_refs:
  - ev:6
