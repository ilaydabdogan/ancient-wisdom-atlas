canonical_text:
  quote: ''
  summary: The passage gives ritual rules about substitute worship with a sacred twig-bundle
    and consecrated cake, deference to a more religiously learned high-priest to preserve
    the soul’s bridge, proper keeping and cleaning of household fire, and the handling
    or disposal of small items associated with a dead person.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a person cannot prepare the regular form of worship, the prescribed practice
    uses a girdle twined around a sacred twig-bundle of seven twigs and a sacred cake
    consecrated three times.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The threefold consecration of the sacred cake is said to become the person’s
    performed form of worship and to have merit comparable to a lesser form of worship.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person more acquainted with religion is instructed to regard someone still
    more acquainted with religion as high-priest.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stated purpose of recognizing the more knowledgeable person as high-priest
    is so that the person may not destroy the bridge of the soul.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: An inattentive man without a high-priest is said not to attain the best existence,
    even if his recitations, duty, and good works are very abundant.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage prescribes keeping a fire in the house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Failure to keep the fire properly is linked with less pregnancy of women and
    weeping over the loss of men’s strength.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Chilled charcoal and other useless remnants are to be carried away from the
    fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A fire cleaned of chilled charcoal is compared to a man whose clothing has
    been cleaned.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: When someone dies, the passage says it is proper to render useless even an
    item as small as the smallest mouth-veil; the cited Vendidad example concerns
    leaving a small bag-like item on the dead.
  category: action
  evidence_refs:
  - ev:5
