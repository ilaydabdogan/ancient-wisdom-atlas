canonical_text:
  quote: ''
  summary: The passage states that sin affecting accusers is to be atoned for among
    the accusers. Explanatory notes distinguish hamemal sin, an offence injuring a
    person or animal who becomes an accuser, from rubanik sin, which affects only
    the sinner's soul. The notes describe a posthumous consequence in which an unatoned
    sinner's soul is stopped at a bridge on the way to the other world until the accuser
    is satisfied, after which the soul is disposed according to the balance of good
    and bad actions. A separate note describes the ant as a creature of the evil spirit
    because it carries away corn.
  language: English
