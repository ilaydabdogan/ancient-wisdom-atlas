canonical_text:
  quote: ''
  summary: The passage describes Matro and Matroyao, later addressed as Mashya and
    Mashyoi, growing from the earth in the form of a joined Rivas plant and then changing
    into human form when breath or soul enters them. Auharmazd explains that soul
    precedes body, instructs the pair in devotion and ethical conduct, and they first
    acknowledge his creation before antagonism enters their minds.
  language: English
  quote_policy: summarized
