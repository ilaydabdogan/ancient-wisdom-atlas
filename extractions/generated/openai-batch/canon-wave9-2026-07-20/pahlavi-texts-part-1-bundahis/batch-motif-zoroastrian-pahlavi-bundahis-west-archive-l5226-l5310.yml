- id: obs:2
  text: In forty years, Matro and Matroyao grew up from the earth in the shape of
    a one-stemmed Rivas plant with fifteen leaves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pair were joined together and alike, with connected arms and waists, so
