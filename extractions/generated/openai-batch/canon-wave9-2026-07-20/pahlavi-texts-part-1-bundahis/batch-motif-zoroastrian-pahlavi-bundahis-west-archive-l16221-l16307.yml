canonical_text:
  quote: ''
  summary: The passage gives doctrinal and ritual statements about priests who die
    or pass into idolatry, the need to discuss the good religion with clergy before
    teaching, the destination of correct or incorrect worship, renunciation of sin
    and future existence, disposal of someone who dies in a vessel, and taboos against
    eating in darkness or consuming water and vegetables with unwashed hands after
    the departure of light. It also includes editorial notes on wording, time measures,
    and the archangels associated with water and plants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A priest who passes away in idolatry is described as desolate, with a noted
    alternative interpretation comparing him to a non-Iranian country.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a supreme high-priest passes away in idolatry, an apostate is said to
    be born in that dwelling, and a calamity is announced or uttered by that supreme
    high-priest.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Steadfastness in the good religion is linked to discussion with priests and
    high-priests; one who does not discuss it should not teach it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ceremonial worship performed incorrectly in a fire-temple does not reach the
    demons, while incorrectly performed worship in other places does reach the demons.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The passage states that worship has no medium destination: it reaches either
    angels or demons.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man who relinquishes a bad habit and engages in renunciation of sin has
    his good work advance to the future existence.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If someone dies in a vessel, it is allowed, because of fear of contamination,
    to throw the person into the water; some say water itself is the receptacle for
    the dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Eating food in the dark is prohibited because demons and fiends seize one-third
    of the wisdom and glory of the person who eats in the dark.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Auharmazd tells Zaratusht not to consume, after the departure of light and
    with unwashed hands, the water and vegetables of Horvadad and Amerodad; if this
    is done, a fiend seizes two-thirds of the existing original wisdom.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: An editorial note identifies Horvadad and Amerodad as archangels whose chief
    duties are the protection of water and plants, respectively.
  category: attribute
  evidence_refs:
  - ev:8
