canonical_text:
  quote: ''
  summary: The passage includes translator notes on directional star chieftains and
    Rapitvin, followed by a Bundahis account in which Auharmazd performs a spiritual
    Yazishn with the archangels, provides means to overcome the adversary, and deliberates
    with consciousness and the guardian spirits of men. Omniscient wisdom asks whether
    the spirits will enter bodily existence to contend with the fiend and later be
    restored immortal, or require continual protection; the guardian spirits agree
    to go to the world despite evil from Aharman because of their final perfect and
    immortal future existence.
  language: English
  quote_policy: summarized
