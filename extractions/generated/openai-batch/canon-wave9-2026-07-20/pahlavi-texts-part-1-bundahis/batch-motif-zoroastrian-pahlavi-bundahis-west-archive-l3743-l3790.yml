canonical_text:
  quote: ''
  summary: Asto-vidi/Asto-vidart and death-causing demons are sent against Gayomard,
    but cannot noose him before his appointed time. Gayomard declares that mankind
    will be of his race and values duty and good works. The evil spirit corrupts fire
    with smoke and darkness; planets and demons disrupt the celestial sphere and constellations.
    Heavenly angels battle the demons for ninety days and nights, cast them to hell,
    and a rampart of sky is formed. Hell is located in the middle of the earth where
    the evil spirit pierced in, and duality, persecution, contention, and mingling
    of high and low become manifest.
  language: English
  quote_policy: summarized
