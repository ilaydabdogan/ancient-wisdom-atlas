canonical_text:
  quote: ''
  summary: The passage is a genealogical notice for the family of the Mobads, listing
    several priestly or learned figures and their lines of descent. It identifies
    Bahak as Mobad of Mobads under Shahpuhar, Kad as great preceptor under Darai,
    gives descent lines for Ataro-pad, Mitro-vara, Durnamik, and Mitro-akavi, and
    names Humai, daughter of Freh-mah, as the mother of the first-person speaker.
    Translator notes state that the chapter is found only in TD and that many Pahlavi
    names are uncertain in pronunciation.
  language: English
  quote_policy: summarized
