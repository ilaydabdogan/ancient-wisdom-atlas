canonical_text:
  quote: ''
  summary: The passage gives ritual rules concerning fowls and cocks against wizardly
    mischief, the preservation of a hedgehog because it kills ants, modes of death
    in which corpse-contamination is delayed, the need for a dog to see a corpse,
    restrictions on impure food-offerings, and a statement about a woman's fitness
    for priestly duty among women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says wizards may cause mischief in a dwelling; a cock may be unable
    to keep it away, the female fowl makes noise to assist the cock, and another cock
    may need to be brought into the dwelling.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: When someone sees a hedgehog, a safe place in the plain is to be preserved
    along with it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: The passage reports a Vendidad teaching that when a hedgehog voids urine into
    an ant's nest each day, a thousand ants die.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: Seven kinds of causes of death are said to delay contamination from rushing
    upon the dead person until the forthcoming period of the day.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:5
  text: The passage says it is good to show a dog again to a previous corpse in the
    forthcoming period of the day.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Those who attend to a corpse among the pure are instructed to show it to a
    dog that is very observant of the corpse; if a corpse unseen by a dog is carried
    away by even a thousand persons, all are polluted.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: Meat with stench or decomposition, and sacred cake and butter that are hairy,
