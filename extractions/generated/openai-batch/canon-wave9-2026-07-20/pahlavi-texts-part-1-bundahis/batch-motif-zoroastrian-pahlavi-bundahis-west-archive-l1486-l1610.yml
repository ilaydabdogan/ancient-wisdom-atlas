  summary: The passage is chiefly an editorial introduction about Bundahis manuscript
    witnesses. It describes a two-folio old manuscript fragment containing the last
    sentences of the final chapter and a colophon. The translated fragment gives a
    royal chronology, including Kai-Kayus's going to the sky, Kai-Vistasp's reign
    at the coming of the religion, a one-thousand-year total and millennial transition
    to Capricornus, Zaratuhast bringing tidings from the creator Auharmazd to King
    Vistasp, and later dynastic spans.
