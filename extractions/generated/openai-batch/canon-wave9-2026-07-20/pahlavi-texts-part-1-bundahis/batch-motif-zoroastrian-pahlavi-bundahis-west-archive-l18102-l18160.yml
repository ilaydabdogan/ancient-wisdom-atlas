  quote: ''
  summary: The passage gives rules about ritual worship by spouses, the ritual status
    of a reverent woman, five ceremonies whose timely performance counts as good works
    and whose omission becomes sin at the bridge, and prayers to be spoken at sneezing,
    yawning, and sighing. It also quotes a dialogue in which Ahuramazd tells Zaratust
    that sneezing comes through hungry living and that its remedy is the Ahunavar
    and righteousness.
  language: English
