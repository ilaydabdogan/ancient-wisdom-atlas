canonical_text:
  quote: ''
  summary: 'The passage describes the evil spirit''s conflict with the earth: the
    earth shakes, mountain substance is created, Mount Alburz arises first, and other
    mountains grow from its root. The mountains are described as a connected root-like
    network, like a tree reaching upward and rooted below, with water passages beneath
    them compared to tree roots and to blood in human arteries. All mountains apart
    from Alburz are said to have grown from the earth in eighteen years, producing
    advantage for men.'
