canonical_text:
  quote: ''
  summary: The passage maps a sequence of metals to reigns or periods in which rulers
    or religious restorers separate demons from humans, restore the religion, remove
    heterodoxy, and drive hostile powers back. It then describes a mixed-iron period
    as the reign of dishevelled-haired demons of the race of Wrath at the end of Zaratusht's
    millennium; Zaratusht asks for the token of that time, and Auharmazd answers that
    the token is the arrival of many kinds of such demons.
  language: English
  quote_policy: summarized
