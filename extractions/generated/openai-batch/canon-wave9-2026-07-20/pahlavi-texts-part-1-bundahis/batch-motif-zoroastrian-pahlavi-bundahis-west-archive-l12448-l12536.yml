canonical_text:
  quote: ''
  summary: A religious prince is born and named Vahram the Varjavand, with Shahpur
    given as an alternate report. A star falls from the sky and gives a signal on
    the night of his birth. Da^-Auharmazd is cited about a date connected with his
    father's end; the prince is reared with the king's damsels, and a woman becomes
    ruler. At thirty years old the prince comes with banners, weapons, and many armies,
    including Hindu and Alni forces, toward the Veh river/Bukhar area. When Jupiter
    reaches its culmination and casts Venus down, sovereignty comes to the prince;
    many armed champions from named Iranian regions gather with displayed banners.
  language: English
  quote_policy: summarized
