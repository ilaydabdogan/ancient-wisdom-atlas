canonical_text:
  quote: "“every single drawing of the breath (vayo) becomes a good work”"
  summary: 'The passage gives rules about accumulating good works: a son’s good works
    benefit the father as if performed by him; feeding a hungry person can make later
    good works arising from the surplus belong to the giver; reciting one Ashem-vohu
    when lying down and rising makes each breath count as a good work. The following
    rule begins by advising abandonment of an action or opinion when one cannot know
    whether it is sin or good work.'
