canonical_text:
  quote: ''
  summary: 'The passage gives a reckoning of cosmic and early human time: time lasts
    twelve thousand years; the first three thousand are a spiritual state of creatures;
    the next three thousand are the worldly duration of Gayomard with the ox. After
    six thousand years, zodiacal millennium reigns reach Libra, the adversary enters,
    and Gayomard lives thirty years in tribulation. Mashya and Mashyoi then grow up,
    remain unmarried for fifty years, and live as husband and wife for ninety-three
    years until Hoshyang. The passage then begins a list of durations for Hoshyang,
    Takhmorup, and Yim, noting Yim until his glory departed.'
  language: English
  quote_policy: summarized
