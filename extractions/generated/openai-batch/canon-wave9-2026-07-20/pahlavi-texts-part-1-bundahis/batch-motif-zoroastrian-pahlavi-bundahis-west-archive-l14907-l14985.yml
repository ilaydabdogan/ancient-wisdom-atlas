canonical_text:
  quote: ''
  summary: The passage gives purity rules concerning menstruation, contact pollution,
    distances from a menstruous woman, handling of food and water, washing with bull's
    urine and water, waiting periods before washing, and rules for women after childbirth
    or miscarriage and for recurring menstruation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sacred twigs located directly below an unclean source remain unclean even
    fifteen steps below; when not directly below, fifteen steps are stated to be sufficient.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prepared food within three steps of a menstruous woman is polluted.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Food delivered up from a menstruous woman's morning meal is not fit for the
    evening meal, and food delivered up from her evening meal is not fit for the morning
    meal or even for the same woman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Water within three steps of a menstruous woman can be fit for hand ablution
    if it is placed in a pail or ablution-vessel without handling.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: When a menstruous woman touches someone's bedding or garments, the affected
    space is to be washed with bull's urine and water; her bedding touching someone
    else's bedding does not make it polluted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A menstruous woman who becomes clean in three nights is not washed until the
    fifth day; from the fifth through the ninth day she sits one day in cleanliness
    before washing, and after nine nights depletion is no matter.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A woman who has given birth or miscarried is observed during forty days; if
    she is certainly free from menstruation she may be associated with from the fortieth
    day onward, but if something remains she is considered menstruous meanwhile.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If a menstruous woman has sat one month and becomes clean on the thirtieth
    day but becomes menstruous again at the same time, her depletion is counted from
    its beginning and washing is not allowable until the fifth day.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: If she has been washed, has sat three days in cleanliness, and becomes menstruous
    again as from the beginning, four days are to be watched through and the fifth
    day is for washing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The notes compare some of these periods and purity rules with Pahlavi Vendidad,
    Avesta Vendidad, and Hebrew legal passages.
  category: other
  evidence_refs:
  - ev:6
  - ev:7
