  quote: ''
  summary: The passage gives a cosmological account of the sun moving through eastern
    and western apertures in Alburn, ordering the motions of other celestial bodies,
    marking seasonal turning points through named signs, returning after 360 days
    plus five Gatha days, and illuminating named world regions in alternating day
    and night. It also says one aperture is not named so demons cannot learn the secret
    and cause disaster.
  language: English
