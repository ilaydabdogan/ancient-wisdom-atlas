canonical_text:
  quote: ''
  summary: Zarathust asks Auharmazd to make him immortal, comparing this to a tree
    opposed to harm and named immortals. Auharmazd replies that if Zarathust is made
    immortal, Tur-i Bra^arvash the Karap will also become immortal, making resurrection
    and future existence impossible. When Zarathust is uneasy, Auharmazd places omniscient
    wisdom in the shape of water on his hand and tells him to devour it. Zarathust
    devours some of it, remains in Auharmazd's wisdom for seven days and nights, and
    beholds people, cattle, trees, shrubs, and roots across the earth. After the wisdom
    is taken back, he calls the experience a pleasant dream and reports seeing a wealthy
    person's soul in hell and a helpless beggar's soul thriving in paradise.
  language: English
  quote_policy: summarized
