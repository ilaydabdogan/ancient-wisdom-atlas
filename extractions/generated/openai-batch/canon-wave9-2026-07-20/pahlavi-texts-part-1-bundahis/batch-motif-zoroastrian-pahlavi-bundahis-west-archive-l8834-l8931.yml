canonical_text:
  quote: ''
  summary: The passage gives a genealogy from Vanfraghem, Yim, and Vivanghau through
    the thousand-year evil reign of Dahak to Fretun. Fretun, begotten by Aspiyan Pur-tora,
    avenges Yim and is described as fuller of glory than Barmayun and Katayun. Fretun's
    sons Salm and Tuf slay their brother Airij and Airij's sons. Fretun conceals Airij's
    daughter, then also conceals her daughter after the mother is slain. After ten
    generations Manuj-i Khurshed-vinik is born, named because sunlight fell on his
    nose at birth. A descent through sibling-linked generations leads to Manuj-chihar,
    who slays Salm and Tuf in revenge for Airij and fathers Frit, Nozar, and Durasrob.
  language: English
  quote_policy: summarized
