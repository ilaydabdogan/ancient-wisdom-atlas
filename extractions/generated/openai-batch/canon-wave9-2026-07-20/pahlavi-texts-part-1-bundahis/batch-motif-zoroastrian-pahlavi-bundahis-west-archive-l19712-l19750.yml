  quote: ''
  summary: The passage names the sacred feast and next-of-kin marriage, then gives
    an editorial explanation of the six Gahanbars or season-festivals of the Parsi
    year. It reports a theory that medieval Zoroastrians first recognized a two-season
    year and held festivals at seasonal ends and midpoints, later adapting this inherited
    festival pattern to a four-season calendar. An alternative explanation treats
    the six festivals as marking season beginnings and midpoints.
  language: English
  quote_policy: summarized
