canonical_text:
  quote: ''
  summary: The passage gives ritual-legal rules about unseasonable chatter, omitted
    prayer formulas, degrees of sin during ceremonies, the responsibilities of those
    who have or have not performed the ritual, disputed rulings by Afarg and Medok-mah,
    and the conditional exemption or recitation duty of a deaf and dumb person.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A note explains that the father is supposed to be responsible in the next
    world for the sins of the child and to profit by the child's good works.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: From eight years of age until becoming a man or woman at fifteen, a person
    able to say the Itha and Ashem-vohu but not saying them incurs the root of unseasonable
    chatter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If someone able to perform the ritual by heart says only the Itha and Ashem-vohu,
    some authorities say the ritual is as if not performed and there is no offering,
    while others say this is not unseasonable chatter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Unseasonable chatter can occur at every ceremonial, and the passage distinguishes
    its seriousness for one who has performed the ritual and one who has not.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The measure of unseasonable chatter is described as a Tanapuhar sin where
    every ceremony, morsel, or drop of urine is not completed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Afarg says the degree of unseasonable chatter for one who has not performed
    the ritual is slighter, while Medok-mah says both cases are alike and adds a further
    severity distinction.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Medok-mah states that the ceremonial does not become Geto-khart; Afarg states
    that it amounts to an offering for everyone except the person who knows the ritual
    by heart and sinfully refuses to perform it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: For the person who knowingly and sinfully refuses the ritual, the benefit
    can become his during life and by his command when it is recited with the intention
    that he wishes to do it and has faith in the religion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A deaf and dumb person unable to say an Ashem does not commit unseasonable
    chatter; if able to say an Ashem, he is to say 'Ashem' three times.
  category: speech
  evidence_refs:
  - ev:6
