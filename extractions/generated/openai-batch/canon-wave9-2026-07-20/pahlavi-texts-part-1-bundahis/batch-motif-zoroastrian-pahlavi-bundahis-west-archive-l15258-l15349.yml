  quote: ''
  summary: The passage gives rules about proper shirt length, folds, and use of the
    girdle; distinguishes proper and improper ways of wearing one or two shirts; defines
    age-related responsibility for the sins of running about uncovered and unseasonable
    chatter; grades the former by number of steps; and adds rules about fringeless
    girdles, tying a girdle to a woman's ringlet, and walking with one boot.
  language: English
  quote_policy: summarized
