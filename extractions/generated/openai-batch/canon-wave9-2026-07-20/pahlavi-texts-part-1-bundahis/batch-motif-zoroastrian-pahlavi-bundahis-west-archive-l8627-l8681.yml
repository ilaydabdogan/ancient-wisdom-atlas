canonical_text:
  quote: ''
  summary: 'The passage describes the final defeat and purification of evil: the evil
    spirit and Az are rendered powerless by the Kiisti formula; the evil spirit returns
    to darkness; a serpent is burned in molten metal along with hell’s stench and
    pollution; Auharmazd incorporates the evil spirit’s hiding-place and the land
    of hell into the renewed world; the universe becomes renovated and immortal; the
    earth becomes an iceless, slopeless plain and a bridge-supporting mountain disappears.'
