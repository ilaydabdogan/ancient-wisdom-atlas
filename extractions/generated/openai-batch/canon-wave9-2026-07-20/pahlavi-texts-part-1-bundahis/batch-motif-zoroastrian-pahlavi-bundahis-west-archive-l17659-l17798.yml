canonical_text:
  quote: ''
  summary: The passage gives ritual rules concerning the dead, nail-parings, childbirth,
    offerings to the moon and angels, and pregnancy. It states that almsgivings provide
    clothing for a charitable soul, that holy-water should be presented to the nearest
    fire after a death because consciousness goes from fire to stars, moon, and sun,
    that unprayed nail-parings become equipment for demons, that childbirth should
    occur under light, that food offerings must be properly dedicated, and that fire
    protected pregnant Dukdav and unborn Zaratusht from demons.
  language: English
  quote_policy: summarized
