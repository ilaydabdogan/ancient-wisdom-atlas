  summary: The passage catalogues named rivers, giving their locations, sources, routes,
    alternate names, and selected remarks. It says the Daitik is full of noxious creatures;
    several rivers are connected with the Aparsen range or mountain; the Hettamand
    is distinguished from something conducted away by Frasiya(7; and the Sped river
    is associated with Dahak begging a favour from Aharman and the demons.
