canonical_text:
  quote: ''
  summary: The passage gives ritual-ethical instructions for propitiating Ardavahisht
    through the fire of Auharmazd, Shatvairo through melted metal, and Spendarma through
    the earth and a virtuous woman. It describes a pure-heart test with melted metal,
    including Ataropad son of Maraspend as an example, and contrasts the effect of
    melted metal on the pure and on wicked sinners.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who wishes to propitiate Ardavahisht is instructed to promote his
    things and to propitiate the fire of Auharmazd at every place and time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fire is not to receive stolen or extorted wood, incense, or holy-water,
    and an extorted ration is not to be cooked at it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fire of Auharmazd is described as Ardavahisht's counterpart in the world;
    propitiating the fires of Auharmazd is said to bring fame in the world and Auharmazd's
    splendour in heaven.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person who wishes to propitiate Shatvairo is instructed to propitiate melted
    metal at every place and time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The propitiation of melted metal is defined as having habits of the heart
    so unsullied and pure that melted metal dropped upon it does not burn.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ataropad son of Maraspend is presented as having melted metal dropped upon
    the region of his pure heart, where it became pleasant like milk being milked
    upon it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When melted metal is dropped upon the heart-region of the wicked and sinners,
    it burns and they die.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage forbids committing sin with metal and burning, and forbids giving
    gold and silver to the vile.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Melted metals are described as Shatvairo's counterpart in the world; propitiating
    them is said to bring fame in the world and Auharmazd's splendour in heaven.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A person who wishes to propitiate Spendarma is instructed to propitiate the
    earth and a virtuous woman at every place and time, and to act for their happiness.
  category: action
  evidence_refs:
  - ev:8
