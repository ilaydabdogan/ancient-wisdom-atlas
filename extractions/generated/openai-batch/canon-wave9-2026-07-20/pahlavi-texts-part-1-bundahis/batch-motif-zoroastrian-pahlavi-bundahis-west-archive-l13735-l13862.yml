canonical_text:
  quote: ''
  summary: The passage gives ritual rules for pollution caused by death or dead matter
    on elevated structures, trees, and vessels. It distinguishes when a corpse should
    be moved, how pollution may pass to ground or containers, and how wine, oil, corn,
    jars, and a serpent in a jar are treated under purity rules.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A built bridge, terrace roof, and trellised apartment are treated under related
    liability rules; pollution can be conveyed downward when a limb or hair remains
    on the borders, while digging up and re-spreading the area can make it clean.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a person dead by strangulation or seated upright, the instructions avoid
    carrying the body down unless there is fear that it will fall; if movement is
    needed, it is directed toward the side of risk or the actual place of falling.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A supplied note states that these rules aim to avoid disturbing the corpse
    more than necessary while preventing additional ground pollution from a fall.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: For death on a tree or branch, the rules distinguish green and withered bark
    or branches, fear of falling, and whether hair or a limb remains on the tree;
    in specified cases the whole body is to be carried down.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A supplied note links the tree rules to preventing a corpse from defiling
    more ground by falling, especially through the breaking of a dead branch.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: When dead matter remains on the outside of a jar containing wine, the jar
    is polluted and the wine is clean; when a person dies in the wine and no hair
    or curl remains on the jar, the wine is polluted and the jar is not.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: For an oil jar, dead matter on the outside is treated as if it were inside
    because the oil passes outward and inward; both jar and oil are polluted, and
    drying does not make the jar fit for use.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A serpent in a wine jar makes both the jar and wine useless and polluted by
    contamination.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: When corn is in a jar with a serpent, the jar is polluted while the corn is
    generally clean, but the corn that includes or has been touched by the serpent
    is to be removed and thrown away because the serpent's seed-touch may kill someone.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A supplied note defines nasai as a corpse, carcass, or portion of solid dead
    matter, distinct from dirt, refuse, or liquid exudation.
  category: attribute
  evidence_refs:
  - ev:9
