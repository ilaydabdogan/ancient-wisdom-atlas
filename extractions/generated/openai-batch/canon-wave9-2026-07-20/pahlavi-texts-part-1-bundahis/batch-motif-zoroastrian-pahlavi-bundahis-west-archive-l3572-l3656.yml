canonical_text:
  quote: ''
  summary: The passage describes the evil spirit remaining confused for three thousand
    years through fear connected with the righteous man. Archfiends fail to rouse
    him, but the wicked Geh succeeds by promising to harm the righteous man, the labouring
    ox, water, plants, fire, and the whole creation of Auharmazd. The evil spirit
    rises, kisses Geh, pollution called menstruation becomes apparent in her, and
    she asks him for a man. The evil spirit is described as having a log-like lizard
    body while appearing to Geh as a fifteen-year-old young man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The evil spirit becomes confounded and remains in confusion for three thousand
    years after seeing the impotence of himself and the demons owing to the righteous
    man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The archfiends address the evil spirit as their father and urge him to rise
    so they can cause conflict in the world against Auharmazd and the archangels.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The archfiends recount their evil deeds twice, but the evil spirit is not
    pleased and cannot lift his head through fear of the righteous man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Geh comes at the completion of the three thousand years and likewise urges
    the evil spirit to rise for a conflict that will distress Auharmazd and the archangels.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Geh promises to vex the righteous man, the labouring ox, water, plants, the
    fire of Auharmazd, and the whole creation of Auharmazd, and to destroy living
    souls.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: After Geh repeats her evil deeds, the evil spirit is delighted, starts up
    from confusion, kisses Geh on the head, and pollution called menstruation becomes
    apparent in her.
