  summary: The passage gives rules for identifying the Auzerin or Atazerin afternoon
    period by measuring a person's shadow as the sun moves through zodiacal constellations.
    It describes increase and decrease of shadow length between Cancer and Capricornus,
    relates this to changes in day and night, and includes editorial notes on the
    measurements.
