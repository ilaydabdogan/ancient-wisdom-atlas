canonical_text:
  quote: ''
  summary: The passage locates Lake or Gulf Sataves between the wide-formed ocean
    and Putik, describes an abyss at Kamindan that returns objects but carries living
    creatures down and is said to contain a fountain from hell, and places Lake Urvis
    on lofty Hugar. It then gives etiological accounts in which Yim and Yimak are
    joined to demonic spouses, producing the tailed ape, bear, and other degenerate
    species, and in which unions involving a demon and a witch during the reign of
    As-i Dahak produce a black-skinned human group; it adds that this group fled from
    Iran when Fredun came and later was diffused again through Iran after the invasion
    of the Arabs.
  language: English
  quote_policy: summarized
