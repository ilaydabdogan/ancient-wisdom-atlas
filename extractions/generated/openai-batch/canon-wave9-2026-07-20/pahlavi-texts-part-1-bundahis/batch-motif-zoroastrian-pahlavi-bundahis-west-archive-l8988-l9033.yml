canonical_text:
  quote: Kavart''* was a child in a waist-cloth (kuspii(^); they abandoned him on
    a river, and he froze upon the door-sills...
  summary: The passage recounts Aghrerad obtaining divine favor to save Iranian forces,
    his killing by Frasiyazd, his begetting of Gopatshah, a genealogical notice about
    Auzobo and related figures, the abandonment and rescue of the child Kavadh, and
    subsequent Kayanian genealogy. Editorial notes compare several names with Avesta
    and Shahnamah forms.
  language: English
  quote_policy: quoted
