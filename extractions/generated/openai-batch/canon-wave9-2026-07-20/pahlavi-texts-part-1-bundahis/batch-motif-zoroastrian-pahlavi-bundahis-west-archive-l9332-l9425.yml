canonical_text:
  quote: ''
  summary: 'The passage gives genealogical and kinship material around Zaratusht''s
    family and descendants. It says a son of Isadvastar, Ururvij, also called Aranj-i
    Birazan, came from a serving wife and was delivered to Isadvastar through adoption.
    It then names three sons of Zaratusht from Hvov: Hushedar, Hushedar-mah, and Soshyans.
    Zaratusht''s seed goes to the ground three times; the angel Neryosang receives
    its brilliance and strength, gives it to the angel Anahid, and Anahid will later
    blend it with a mother. A vast number of guardian spirits of the righteous protect
    it from demons. The passage also names Zaratusht''s mother, Dughda, and maternal
    grandfather, Frahimrava. Notes define types of wives and give Avestan name parallels
    for several figures.'
  language: English
  quote_policy: summarized
