  quote: ''
  summary: 'The passage gives ritual and legal rules: a three-day birth protection
    rite with fire and incense against demons, wizards, and witches; a rule about
    removing bark from a toothpick to avoid a pregnancy-related dead-matter doubt;
    and a rule that male offspring of a cohabiting handmaid should be accepted as
    sons because a son is required.'
