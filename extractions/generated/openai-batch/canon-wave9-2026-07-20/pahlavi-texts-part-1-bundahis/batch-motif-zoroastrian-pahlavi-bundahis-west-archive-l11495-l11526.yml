canonical_text:
  quote: "“the one tree which thou sawest is the world which I, Auharmazd, created”"
  summary: 'A visionary passage contrasts a wealthy childless man with a poor man
    with many children, then describes a tree with seven branches made of different
    metals. Auharmazd interprets the tree for Zaratusht: the tree is the created world,
    and its seven branches are seven coming periods. The golden branch is identified
    with King Vishtasp’s reign, when religion is accepted, demon images are demolished,
    and Aharman and the demons retreat toward darkness. The silver branch begins to
    be identified with Ardashir’s reign before the excerpt ends.'
  language: English
  quote_policy: quoted
