canonical_text:
  quote: ''
  summary: 'The passage summarizes eschatological material attributed to the Bahman
    Yast: angelic aid against evil spirits, the missions of the last three apostles,
    millennial events, the restraint and later release of Azh-i Dahak from Mount Dimavand,
    Keresasp’s awakening and slaying of that serpent-origin fiend, and the final resurrection
    under Soshyans. It then discusses the extant text as probably an epitome or composite
    commentary and compares its identification of an iron age with that found in the
    Dinkard’s quotation of the Studgar Nask.'
  language: English
  quote_policy: summarized
