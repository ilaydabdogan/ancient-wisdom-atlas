  summary: The passage is an editorial discussion of Bundahis manuscript transmission.
    It compares the manuscripts M6 and K20, proposes possible copying relationships
    between them and an earlier original, and lists several manuscripts or fragments
    descended from M6 in Oxford, Bombay, Poona, and the British Museum.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The text in M6 is said to contain errors attributed to illegibility in its
    exemplar or later touch-ups, but after those errors are removed its writer is
    judged more careful than the writer of K20 and to supply words or phrases omitted
    by K20.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: K20 and M6 correspond closely in many places, making it probable to the editor
    that they were copied from the same original; under that hypothesis, K20 would
    have been written earlier than M6.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The editor also allows an alternative possibility: K20 may have been copied
    from an early copy of the original of M6, making K20''s date more uncertain and
    possibly later than M6.'
  category: relationship
  evidence_refs:
  - ev:2
