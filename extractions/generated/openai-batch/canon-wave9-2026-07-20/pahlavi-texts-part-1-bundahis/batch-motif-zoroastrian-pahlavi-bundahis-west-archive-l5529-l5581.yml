  quote: ''
  summary: 'Chapter XVI presents a revealed account of generation: post-menstrual
    conception, outcomes determined by male and female seed, qualities and movements
    of seed, transformation into blood and milk, a male/female classification of parts
    of creation, and a fish-generation account in running water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says a woman can soon become pregnant when approached during ten
    days and nights after coming out from menstruation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage relates offspring sex or plurality to the relative power of male
    and female seed: male dominance produces a son, female dominance a daughter, and
    equality twins or triplets.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that if the male seed comes sooner it adds to the female
    and makes her robust, while if the female seed comes sooner it becomes blood and
    causes leanness.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Female seed is described as cold and moist, flowing from the loins, and white,
    red, and yellow; male seed is described as hot and dry, flowing from the brain
    of the head, and white and mud-coloured.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says female seed takes a place within the womb, male seed remains
    above it and fills the womb, and what remains becomes blood, enters female veins,
    and at birth becomes milk that nourishes the child.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sky, metal, wind, and fire are classified as male; water, earth, plants,
    and fish are classified as female; the remaining creation is said to consist of
    male and female.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Fish are said to move two and two in running water during excitement, rub
    their bodies together, produce a sweat-like substance between them, and both become
    pregnant.
  category: action
  evidence_refs:
  - ev:6
