canonical_text:
  quote: ''
  summary: 'The passage describes the nature of rivers: the Arag and Veh flow from
    the north from Alburs and the Alburn of Auharmazd, other rivers flow from the
    same source, waters mingle back into the two main rivers, and the paired rivers
    circulate through the extremities of the earth to the sea and wide ocean before
    returning to their sources. The spirits of the Arag and Veh petition Auharmazd
    on each other''s behalf, and their loving assistance gives them equal strength.
    The passage also states that before the destroyer came there were no rapids, and
    after the fiend is destroyed the rivers will again be without rapids, followed
    by a catalogue of famous rivers.'
  language: English
  quote_policy: summarized
