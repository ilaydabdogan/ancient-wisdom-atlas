canonical_text:
  quote: ''
  summary: 'The introductory passage says the work, called Zand-akas, begins with
    a dual primordial state: the good spirit in endless light and the evil spirit
    in endless darkness. Each produces creatures in a spiritual state; the evil spirit
    later opposes the good creation under a time-limited agreement. The good spirit
    uses a sacred formula, creates archangels and the material cosmos, and the evil
    spirit later attacks with demons, damaging the six classes of creation and causing
    the deaths of the primeval ox and Gayomard. The passage then lists later topics
    including regions of the earth, animals, sacred fires, trees, rivers, opposing
    creatures, resurrection, and future existence.'
  language: English
  quote_policy: summarized
