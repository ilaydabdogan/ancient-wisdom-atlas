canonical_text:
  quote: ''
  summary: The passage gives ritual rules about uttering sacred formulas, preserving
    a hedgehog and returning it to the plain, saying Ashem-vohu before face-washing,
    and selecting qualified purifiers for ablution and purification with water and
    bull's urine at an exactly measured place. It cites the Hart'okht Nask and Vendidad
    as authorities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ahunavar is described as the most triumphant of spoken sayings, especially
    in connection with season-festivals, with the Hart'okht Nask cited as authority.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A rule says that when someone sees a hedgehog, he takes it back to the plain
    and preserves its own place free from danger.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cited Vendidad teaching says that each day, when a hedgehog voids urine
    into an ant's nest, a thousand ants die.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some people of the good religion say that one Ashem-vohu should be uttered
    before face-washing, not during the washing, because of doubt about water coming
    to the mouth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The rule for choosing purifiers emphasizes control of ablution and non-ablution,
    good disposition, truthful speaking, the particular work, and innocence.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A cited Vendidad passage describes a righteous purifier as a true speaker,
    an enquirer of sacred texts, one who has performed his ritual, and one who understands
    purification and its formulas.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: When control of ablution is connected with the purifier, the purifying bowl
    is treated as his, others abstain from it, and angels hear and consider them clean.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says that those who consecrate water and bull's urine are selected
    for purification work, and that the rite is to be performed observantly at a place
    measured very exactly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: An editorial note explains the purifiers as priests retaining enough effect
