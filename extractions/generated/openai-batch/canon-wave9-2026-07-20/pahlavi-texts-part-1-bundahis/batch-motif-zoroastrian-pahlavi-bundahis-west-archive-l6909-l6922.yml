  summary: 'The passage lists exceptional trees, mountains, and birds: the Gokar tree
    is singled out as the tree with which the dead are restored; Mount Aparsen is
    described by its geographic span and as chief among mountains except Alburs; A''amro
    is chief among birds except the griffon of three natures. The passage concludes
    that one who performs a great duty has much value.'
