  quote: his business is unmercifulness and the destruction of this welfare
  summary: 'The passage includes a fragmentary notice about a threefold Horn, then
    describes a plant or firewood procedure in which a twig with a drop of water is
    held before fire, especially the lotos/kunar. It then cites revelation on the
    evil-doing of Aharman and demons: the evil spirit''s harm to Auharmazd''s creation
    is exemplified by winter, his body is likened to a lizard in filth, and he acts
    against the welfare of Auharmazd''s creatures through destruction and harmful
    eyesight.'
