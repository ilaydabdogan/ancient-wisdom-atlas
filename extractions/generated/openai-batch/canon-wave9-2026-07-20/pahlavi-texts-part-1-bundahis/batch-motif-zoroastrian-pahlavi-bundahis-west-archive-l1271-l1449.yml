canonical_text:
  quote: ''
  summary: The passage is an editorial introduction describing the fuller TD manuscript
    of the Bundahis and listing forty-two chapter headings. The headings include Auharmazd's
    original creation, the antagonism of the evil spirit, formation of light, conflicts
    involving creations and hostile spirits, catalogues of natural beings and phenomena,
    the Cinvat bridge and souls of the departed, calamities in Iran, resurrection
    and future existence, and royal genealogical material. The editor then compares
    TD with K20 and Indian manuscripts, concluding that TD is fuller and more methodically
    arranged.
  language: English
  quote_policy: summarized
