canonical_text:
  quote: ''
  summary: The passage describes Auharmazd entering and sustaining the sky while the
    sky, figured as a fortified defender, traps Aharman. Auharmazd prepares a stronger
    rampart called righteous understanding and stations guardian spirits of the righteous
    around it as armed guards. Aharman cannot return to his darkness and fears the
    future renovation after nine thousand years. A cited Gathic passage presents two
    spirits approaching the first creation, the body of Gayomard, with opposed purposes
    of preserving life and destroying it. The passage concludes by naming this the
    first contest, that of the sky with Aharman.
  language: English
  quote_policy: summarized
