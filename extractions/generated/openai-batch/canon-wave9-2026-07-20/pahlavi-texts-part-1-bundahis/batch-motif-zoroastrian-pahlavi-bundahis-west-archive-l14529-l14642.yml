  summary: The passage gives ritual-purity rules for clothing and textiles polluted
    by corpse or dead matter, including repeated washing and rules for pollution through
    physical connection. It also states rules for pregnant women, children, solitary
    corpse-carriers, and animals that have consumed dead matter, distinguishing incurable
    pollution, birth cleanliness, spatial separation, and time-limited pollution of
    animal products.
