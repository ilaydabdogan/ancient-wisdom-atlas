canonical_text:
  quote: ''
  summary: 'The passage gives ritual and legal rules: a sacred cake set aside for
    guardian spirits is to be used in specified rites; a legal example distinguishes
    guilt and innocence depending on whether a man is going to rob or to worship;
    and a pregnant woman''s dwelling fire is to be maintained carefully. Translator
    notes identify departed guardian spirits as revisiting homes, explain the N6nabar
    and three-nights ceremonies, and summarize the Spend Nask as treating the generation
    and birth of Zaratmt and the opposed good and bad spirits.'
  language: English
  quote_policy: summarized
