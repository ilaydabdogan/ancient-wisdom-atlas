- id: obs:1
  text: The sacred cake, or dron, set aside at the dedication formula on days devoted
    to guardian spirits, is to be used at season-festivals, the N6nabar, the three-nights
    ceremony, the Hom-dron, and other rites of righteous guardian spirits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note says the guardian spirits of the departed are supposed to revisit their
    old homes during an end-of-year period, and the sacred cake is set aside for them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A note identifies the N6nabar as the initiatory ceremony of a young priest
    and the three-nights ceremony as rites performed by survivors after a death.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: In a legal example, if a man is going to commit robbery and a wall falls upon
    him, the wall is described as his destroyer.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The same legal example says that if a man strikes at him, that man is his
    adversary and both are sinful; if he is going to perform the worship of God, both
    are innocent.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: When a woman becomes pregnant, the fire is to be maintained as carefully as
