  quote: ''
  summary: 'The passage catalogs named demons and their actions or domains: poisoning,
    disobedience, falsehood, malice, wrath, perversion, disruption of bodily conduct,
    and post-mortem seizure of souls. It also states that supporting people with certain
    improper religious opinions propitiates demons, and it prescribes possession of
    a snake-killer implement for killing noxious creatures and sinners.'
  language: English
  quote_policy: summarized
