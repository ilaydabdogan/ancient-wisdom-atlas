canonical_text:
  quote: "“through it he beheld the root of a tree, on which were four branches”"
  summary: 'After an opening benediction, the passage cites the Stufgar Nask: Zaratusht
    asked Auharmazd for immortality; Auharmazd displayed omniscient wisdom to him;
    through it Zaratusht saw the root of a tree with four branches made of gold, silver,
    steel, and iron-mixed material. Zaratusht later described the vision as a dream,
    and Auharmazd said the root and branches represented four periods. An editorial
    note further relates the four metallic branches to four periods in the Zaratushtian
    millennium.'
  language: English
  quote_policy: quoted
