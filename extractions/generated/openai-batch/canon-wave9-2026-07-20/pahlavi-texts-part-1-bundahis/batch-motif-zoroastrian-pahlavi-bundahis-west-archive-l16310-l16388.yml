canonical_text:
  quote: ''
  summary: The passage gives a fourfold classification of worship of celestial beings
    according to whether the Avesta recitation is correct or faulty and whether the
    human participant is good or bad. It describes how archangels and angels approach,
    listen to, accept, or reject each type. It also instructs that angels and the
    guardian spirits of the righteous are to be invited at the beginning of every
    ceremony and sacred-cake consecration. Translator notes summarize related Nask
    material on ritual duties, season-festivals, fire and water rites, calendrical
    cycles, and guardian spirits visiting the world at the end of winter.
  language: English
  quote_policy: summarized
