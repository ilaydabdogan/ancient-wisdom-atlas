  text: Aharman comes at noon on the month Fravardin and day Auharmazd to the frontier
    of the sky.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sky sees Aharman, fears like a sheep before a wolf, and Aharman comes
    into it scorching and burning.
  category: action
  evidence_refs:
