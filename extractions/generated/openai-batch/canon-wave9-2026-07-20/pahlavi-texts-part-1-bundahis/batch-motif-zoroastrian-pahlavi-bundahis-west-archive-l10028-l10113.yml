canonical_text:
  quote: ''
  summary: 'The passage narrates Aharman’s entry into creation: he approaches the
    sky, water, earth, a central tree, the sole-created ox, and Gayomard. His movement
    brings fear, burning, darkness, withering, illness, and the appearance of noxious
    creatures. Auharmazd mitigates the assault on the ox with bang and forms a radiant
    fifteen-year-old figure from sweat before the advance to Gayomard.'
  language: English
  quote_policy: summarized
