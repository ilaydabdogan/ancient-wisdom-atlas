canonical_text:
  quote: ''
  summary: Ritual-legal instructions describe menstrual and related pollution, periods
    of watching and washing, rules for discharge, pregnancy and miscarriage cases,
    contact and sexual penalties, limits around sacred objects and elements, use of
    bull's urine and water in washing, and graded sins involving fire, ashes, a water
    goblet, and water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a second menstruation, the woman is described as not clean for nine
    days and nights; these days and nights are for watching, and washing follows when
    they are completed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Leucorrhoea that has changed colour, whether before or after menstruation,
    is assigned pollution like that of menstruation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Once the woman is completely clean from menstruation and may wash as usual,
    she does not pollute the sacred twigs or other things when beyond three steps.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Because of severe cold, she may sit out toward the fire, and while washing
    she is to take a prayer inwardly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says hand-washing, except with bull's urine, is not proper until
    the stated washing condition; after washing her hands, she is to destroy two hundred
    noxious creatures as atonement for sin.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: If a woman goes beyond the period of menstruation and then sees she is polluted,
    and pregnancy is certain except where miscarriage is evident, she is to be washed
    with bull's urine and water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If pregnancy is not certain, the woman is to be considered menstruous; the
    passage also records differing opinions about manifest or doubtful miscarriage.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Contact with a menstruous woman or with a person who must be washed with water
    and bull's urine is assigned the root of a sin of sixty stirs.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Knowingly having sexual intercourse with a menstruous woman is assigned the
    root of a sin of fifteen Tanapuhars and sixty stirs.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'A menstruous woman''s relation to fire is graded: seeing a fire, going within
    three steps, and placing a hand on the fire itself each receive specified penalties
    of increasing severity.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage applies a similar rule to ashes and a water goblet, and begins
    a statement about looking at water, but the supplied excerpt cuts off before that
    clause is completed.
  category: object
  evidence_refs:
  - ev:7
