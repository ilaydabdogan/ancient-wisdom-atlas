canonical_text:
  quote: ''
  summary: The excerpt lists named figures and their dwelling places, including Kangde,
    Sukavastan, Pe-yansai, the River Naivtak, Airan-vej, and an enclosure formed by
    Yim. It says these figures, together with several other named persons, are immortal
    and will come forth. One figure is said to have been brought up in a jar for fear
    of Wrath, and a tree opposed to harm is located in Airan-vej. Translator notes
    add cross-references and a separate description of Gopatshah's sea-side holy-water
    rite.
  language: English
  quote_policy: summarized
