canonical_text:
  quote: The first comfort of the earth is from the land on which a righteous man
    walks forth
  summary: The passage interprets sections and repetitions of the Yasna in terms of
    effects on earth, elemental benefit, praise, destruction of hostile powers, fires,
    judgments between beneficent and evil spirits, and moral accomplishments connected
    with religion and the bridge to the other world.
  language: English translation from Pahlavi
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The earth is said to receive comfort from a righteous man's walking, from
    dwellings of the good and fires, from sowing corn while heeding dead matter, and
    from the birth and presence of beasts of burden.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The earth is said to receive discomfort from the Arezur ridge and gate of
    hell, digging for a dead body, constructing a repository for remains, holes of
    noxious creatures, and abandoning an afflicted righteous man.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The four stanzas of Ahii-are-paiti are explained as concerning benefit on
    account of water, earth, plants, and animals.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Stuto-garo stanzas and named repetitions are explained as being on account
    of the existence of the sons of Zaratust; a note identifies these as three future
    apostles expected in the future.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Named repetitions are assigned purposes of praising righteousness, Auharmazd,
    archangels, ceremonial worship, the sacred feast, and fires, while also destroying
    the fiend, the evil spirit, and miscreations.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The twenty stanzas of Tart-thwa-peresa are called twenty judgments between
    the beneficent spirit and the evil spirit; repeated utterance of the judgment
    culminates in the evil spirit becoming confounded.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The eleven stanzas of Ad-fravakhshya are explained through six chieftainships
    and five accomplishments, including reciprocal ethics, moral discernment, avoiding
    vile conversation, confession to high-priests with the whip, and observance of
    season-festivals and matters going to the bridge.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A translator's note identifies the bridge mentioned in the fifth accomplishment
    as the route of the soul to the other world.
  category: setting
  evidence_refs:
  - ev:7
