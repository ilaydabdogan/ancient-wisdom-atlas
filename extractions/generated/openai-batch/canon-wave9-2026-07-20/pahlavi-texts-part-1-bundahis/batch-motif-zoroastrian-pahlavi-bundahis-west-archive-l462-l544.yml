- id: obs:3
  text: The passage says Huzvarish logograms created particular difficulty because
    the Semitic words were rarely pronounced when Pazand equivalents were substituted
    in reading.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the Huzvarish-Pazand glossary was compiled to record pronunciation
