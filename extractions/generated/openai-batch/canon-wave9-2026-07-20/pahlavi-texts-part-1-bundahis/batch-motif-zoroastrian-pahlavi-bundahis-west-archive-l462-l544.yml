  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage applies a similar explanation to the Iranian portion of Huzvarish,
    saying obsolete or contracted spellings led to artificial forms such as anhoma,
    yahan, madonad, and shatan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage describes Parsis as reluctant to admit possible error in traditional
    Huzvarish readings and as treating European scholarly explanations as ingenious
    but unproven hypotheses.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage ends by introducing inscriptions as a means of ascertaining ancient
