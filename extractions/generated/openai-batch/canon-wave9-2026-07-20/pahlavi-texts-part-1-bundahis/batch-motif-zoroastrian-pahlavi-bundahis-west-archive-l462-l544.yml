canonical_text:
  quote: ''
  summary: An introductory philological passage explains difficulties in reading Pahlavi
    script, especially similar letter forms, many possible compound sounds, and limited
    vowel notation. It then discusses Huzvarish logograms, the substitution of Pazand
    equivalents in reading, the risk and partial loss of older pronunciations, the
    compilation of a Huzvarish-Pazand glossary, artificial pronunciations handed down
    by tradition, disagreement between Parsis and European scholars, and the introduction
    of inscriptional evidence for ancient pronunciations.
  language: English
  quote_policy: summarized
