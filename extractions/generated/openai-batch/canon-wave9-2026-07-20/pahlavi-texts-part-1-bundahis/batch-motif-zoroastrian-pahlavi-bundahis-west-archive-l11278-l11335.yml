canonical_text:
  quote: ''
  summary: 'The passage explains a sequence of metal-coded periods: gold is linked
    with a conversation and King Vijtasp accepting the religion and demolishing demon
    figures; silver and steel are linked with named royal reigns; mixed iron is linked
    with an evil demonic sovereignty at the end of Zaratusht''s millennium. It then
    reports that Mazdik will arise against the religion and disturb its adherents.
    Finally, a glorified ruler summons high-priests and requires a promise about not
    concealing the Yasts and restricting the teaching of the commentary.'
  language: English
  quote_policy: summarized
