canonical_text:
  quote: ''
  summary: The passage describes the Gokar or Hom tree growing in deep mud within
    the wide-formed ocean as a source for the universe's renovation and immortality.
    An evil spirit creates a lizard in the deep water to injure it, while Auharmazd
    creates ten Kar fish to circle and guard the Hom until the renovation. The text
    also describes a vast fish called the Vas of Pan/'asart'varan that guards creatures
    of the waters, and a separate tree of many seeds in the ocean whose seed contains
    all plants and is associated with curing.
  language: English
  quote_policy: summarized
