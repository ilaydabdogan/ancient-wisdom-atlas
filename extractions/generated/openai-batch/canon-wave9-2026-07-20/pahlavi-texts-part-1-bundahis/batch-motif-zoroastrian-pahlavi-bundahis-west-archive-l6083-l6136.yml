canonical_text:
  quote: "“every one is created in opposition to some noxious creature.”"
  summary: 'The passage describes several animals and their special powers or purposes:
    the water-beaver opposes a water demon; every beast, bird, and fish is said to
    be created against a noxious creature; the vulture and Arab horse have extraordinary
    sensory capacities; the cock and dog cooperate with Srosh against fiends; the
    shepherd’s dog and house watchdog are protective creations; the dog destroys fiends,
    disobedience, pain, decay, and is medicinal. The passage concludes that Auharmazd
    created nothing useless and that the Dastur should explain creation’s purposes.'
  language: English
  quote_policy: quoted
