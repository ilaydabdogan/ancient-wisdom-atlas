  summary: A prophecy of the last times describes demonic ascendancy, social and legal
    inversion, ritual pollution, decline of religious practice, neglect of the Fire
    of Vahram, priestly corruption, and the end of Zarathust's millennium, with mankind
    disregarding revelation.
