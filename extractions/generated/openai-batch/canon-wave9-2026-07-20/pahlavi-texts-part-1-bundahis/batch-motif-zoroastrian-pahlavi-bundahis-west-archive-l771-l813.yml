  summary: The passage is an introductory description of the Bundahis. It says the
    work includes genealogies and Persian chronology, is fragmentary in its surviving
    form, and may be a translation or epitome of the Damda^^ Nask. A quoted description
    of that Nask lists cosmological, biological, and eschatological topics, including
    good and evil, Auharmazd’s productions, resurrection, the future existence, separation
    at a bridge, and reward or punishment after death.
