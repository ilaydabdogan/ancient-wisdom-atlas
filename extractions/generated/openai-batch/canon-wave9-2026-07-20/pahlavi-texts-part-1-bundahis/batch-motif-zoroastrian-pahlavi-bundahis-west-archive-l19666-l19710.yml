  quote: ''
  summary: 'The passage ends a preceding instruction about placing a fragment across
    the limbs of a body. A new chapter begins: revelation says Aeshm rushes to Aharman
    and declares that he will not go into the world because Auharmazd has produced
    three things there against which Aeshm can do nothing. Aharman asks him to name
    them, and Aeshm begins with the season-festival. Footnotes identify Aeshm as the
    demon of wrath and describe him as the chief agent of the evil spirit in machinations
    against mankind.'
