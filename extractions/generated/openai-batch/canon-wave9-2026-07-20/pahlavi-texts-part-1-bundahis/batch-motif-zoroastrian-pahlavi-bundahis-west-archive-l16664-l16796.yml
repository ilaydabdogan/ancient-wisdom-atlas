- id: obs:1
  text: The passage states that abstinence from unlawfully slaughtering any species
    of animals should be reverential.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cited Nask says that for unlawful animal slaughterers, each hair of the
    slaughtered animals becomes like a sharp dagger and the slaughterer is slain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage lists animals whose slaughter is especially to be abstained from,
    including lamb, goat, ploughing ox, war-horse, hare, bat, cock or bird of Vohuman,
    magpie, kite, eagle, and swallow.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A pregnant woman who has died is not to be carried away by fewer than four
    men acting with united strength.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: For a dead pregnant woman, two dogs are required, and she is to be exposed
    to their united power.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: If a dead pregnant woman is carried by two men, the carriers are to be washed
    with ceremony.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A forgiveness prayer for a dead person treats mutual trespasses together and
