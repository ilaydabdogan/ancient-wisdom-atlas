  summary: The passage gives prescriptive rules on abstaining from unlawful animal
    slaughter and its punishment, special handling of a dead pregnant woman, a prayer
    of forgiveness for the dead, boots and pollution from dead matter, the age for
    tying on the sacred thread-girdle, and the breaking of inward prayer by bodily
    wind.
