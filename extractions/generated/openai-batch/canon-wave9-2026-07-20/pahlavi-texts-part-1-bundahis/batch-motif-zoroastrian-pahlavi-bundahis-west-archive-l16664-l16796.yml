  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that one should not walk without boots.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: If a booted foot is placed on dead matter without disturbing it, the person
    does not become polluted.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: If an unbooted foot is placed on dead matter without disturbing it, the person
    is polluted unless it is known that a dog has seen the dead matter.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The sacred thread-girdle is to be tied on a person one day more than fourteen
