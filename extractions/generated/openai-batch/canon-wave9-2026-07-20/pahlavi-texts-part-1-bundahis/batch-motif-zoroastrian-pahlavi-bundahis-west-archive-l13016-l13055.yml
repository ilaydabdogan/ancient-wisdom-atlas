canonical_text:
  quote: ''
  summary: An apostate incites the bound Azi Dahak after saying nine thousand years
    have passed and Fredun is not living. Aharman removes Azi Dahak's fetters; Azi
    Dahak gains strength, swallows the apostate, rushes into the world, devours a
    third of mankind and creatures, and strikes water, fire, and vegetation. The personified
    water, fire, and vegetation complain before Auharmazd and ask that Fredun be made
    alive again to destroy Azi Dahak.
