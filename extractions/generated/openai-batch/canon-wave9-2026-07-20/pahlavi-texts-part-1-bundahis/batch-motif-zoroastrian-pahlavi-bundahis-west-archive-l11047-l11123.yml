canonical_text:
  quote: ''
  summary: The passage describes named powers active in plants, clouds, and sacred
    fire. The Supremely-benefiting glory is lodged in the Behram fire and opposes
    spiritual fiends and witches. Three sacred fires are said to guard the whole earth
    from mountain locations. In Hoshang's reign, men traveling on the ox Sruvo carry
    fires on three fire-stands; these fall into the sea, and one manifest great fire
    is divided into three glories lodged in the three named fires.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Atirvdzti-t is described as being in plants and seed, piercing the earth,
    warming chilled water, producing plant qualities and fragrance, and elaborating
    ripened produce into fruits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Vazti-t is described as moving in a cloud and as destroying atmospheric
    gloom, refining the atmosphere, sifting hail, warming cloud-held water, and making
    sultry weather showery.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Supremely-benefiting glory has its lodgment in the Behram fire and its
    power is connected with the fire's brightness, purity of place, praise of God,
    and good works.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Supremely-benefiting glory struggles with the spiritual fiend and watches
    witches and destructive occurrences, especially at night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The witches are described as walking up from the river or sea, wearing woven
    clothing, disturbing the luminaries through concealment of stench, and injuring
    creatures by witchcraft.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the beginning of creation, the whole earth is said to have been delivered
    to the guardianship of the Frobak, Gushnasp, and Bursin-Mitro fires, compared
    to priest, warrior, and husbandman.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The three sacred fires are each assigned a mountain location: Frobak on Gadman-homand,
    Gushnasp on Asnavand, and Bursin-Mitro on Revand.'
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the reign of Hoshang, men traveling to other regions on the ox Sruvo carry
    fires in three fire-stands on the ox's back.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: One night, while the travelers admire the fires, the three fire-stands fall
    into the sea.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The substance of one great manifest fire is divided into three and established
    on the three fire-stands, becoming three glories lodged in the Frobak, Gushnasp,
    and Bursin-Mitro fires.
  category: sequence
  evidence_refs:
  - ev:8
