  text: If dirty hands are not washed, any good work performed is said not to be one's
    own.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Failure to utterly destroy corruption is said to prevent the coming of angels
    to the body.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The passage gives a sequence: no coming of angels to the body, no steadfastness
    in the religion, and no good work reaching the person.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A note identifies the corruption as a demon associated with filth of the nature
    of dead matter until expelled or destroyed by cleansing.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: For the propitiation of fire, it is allowable to perform one 'athro' by itself,
