  quote: ''
  summary: The passage gives ritual/legal instructions about quantities of Tanaptihar
    sin connected with walking or movement, then instructs that at night a person
    lying down should wear the shirt and girdle. It says these protect the body and
    benefit the soul. Before sleep, the person should utter one Ashem-vohti; each
    breath then counts as a good work measured by Srosho-yaranams, and if death occurs
    in that sleep, renunciation of sin is accomplished.
