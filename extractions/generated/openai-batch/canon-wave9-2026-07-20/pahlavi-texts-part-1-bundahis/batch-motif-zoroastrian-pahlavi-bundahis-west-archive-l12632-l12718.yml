canonical_text:
  quote: ''
  summary: The passage reports ritual instruction concerning fire and waters, summarizes
    the contents of the Ha^/okht Nask as described in the Dinkard, and narrates Neryosang
    proceeding with righteous Srosh to Kangdez to summon Peshyotanu to restore sovereignty
    of the religion in Iran. It also describes spirits moving on, Peshyotanu celebrating
    a Dvazdah-homast with holy-water and 150 righteous disciples, and the group walking
    upward with the formula of good thoughts, good words, and good deeds.
  language: English
  quote_policy: summarized
