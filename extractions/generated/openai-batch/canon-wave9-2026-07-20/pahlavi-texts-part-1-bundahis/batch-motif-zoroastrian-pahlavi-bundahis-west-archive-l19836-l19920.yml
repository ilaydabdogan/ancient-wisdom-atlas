  quote: ''
  summary: 'The passage gives numbered ritual prescriptions for uttering formulas
    in specific circumstances: blessing, season-festival thanksgiving, atonement and
    expulsion of a fiend, seeking power and battle, worship of God, the guardian-spirit
    ceremonial, sowing corn, seeking a wife, animal procreation, travel to mountains
    or low districts, and becoming pathless. Translator notes report manuscript and
    parallel-tradition variants.'
