canonical_text:
  quote: ''
  summary: The passage, largely explanatory notes with a fragment of corpse-handling
    rules, describes the Dakhma or khazan as a walled, open-to-sky funerary structure
    for depositing the dead; explains its circular layout, central well, corpse spaces,
    bone deposition, closure when full, remote dry siting, and rationale of avoiding
    defilement of fire, water, and earth. It also records rules about carrying corpses,
    including the propriety of one person with one dog, and identifies persons who
    may care for a corpse.
  language: English
