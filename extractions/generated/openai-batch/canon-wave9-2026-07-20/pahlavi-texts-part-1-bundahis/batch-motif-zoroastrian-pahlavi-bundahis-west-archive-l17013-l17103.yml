canonical_text:
  quote: ''
  summary: The passage gives rules about memorized Avesta and Zand being recited rather
    than mumbled, cites the Bagh Nask on the improper muttering or partial aloud utterance
    of the Ahunavar, and states that Auharmazd will keep such a person's soul away
    from the best existence by an interval as wide as the earth. It then gives rules
    for not doing an action when one does not know whether it is sin or good work,
    and for forming opinion through consultation.
  language: English
  quote_policy: summarized
