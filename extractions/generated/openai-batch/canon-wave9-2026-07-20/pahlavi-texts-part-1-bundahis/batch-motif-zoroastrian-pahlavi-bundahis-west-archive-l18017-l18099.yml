  quote: ''
  summary: The passage gives ritual purity instructions for Vendidad celebrators and
    for those who receive water and bull's urine, emphasizing washing before handling
    these substances. It then states that no one should be considered hopeless of
    heaven or fixed in expectation of hell, because sins receive retribution. It cites
    the Gathas and gives an example from the Spend Nask in which Zarathust asks Auharmazd
    why a sinful ruler, Davans, has all his limbs in torment while one foot remains
    outside.
