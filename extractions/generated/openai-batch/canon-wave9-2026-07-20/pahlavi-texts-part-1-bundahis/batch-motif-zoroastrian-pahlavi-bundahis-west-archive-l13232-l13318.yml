  summary: The passage lists graded quantities for named categories of offence or
    sin, with explanatory notes on dirhams and stirs. The notes explain that the offence
    scale was extended to all sins and to good works that counterbalance them. A further
    note describes these amounts as the weights of sins in the golden scales of the
    angel Rashnu when the soul is called to account after the third night after death;
    sins are weighed against good works, and the soul is sent to heaven, hell, or
    an intermediate place. The notes also compare the scale to the Avesta/Vendidad
    graduated scale of assaults and temporal punishments by lashes.
