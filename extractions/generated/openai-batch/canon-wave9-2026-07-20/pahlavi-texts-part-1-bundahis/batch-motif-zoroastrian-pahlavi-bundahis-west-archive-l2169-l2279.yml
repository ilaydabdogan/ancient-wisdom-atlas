  summary: The passage is an introductory scholarly discussion of the Bahman Yast's
    textual history and inconsistent chronologies. It summarizes expectations concerning
    Hushe^ar, demon-race invasion, the destruction of the wicked, Vahram the Var^avand's
    campaign, Peshyotanu's restoration of religion, Hushe^ar's conference with Auharmazd,
    and the manuscript basis for the Pahlavi text.
