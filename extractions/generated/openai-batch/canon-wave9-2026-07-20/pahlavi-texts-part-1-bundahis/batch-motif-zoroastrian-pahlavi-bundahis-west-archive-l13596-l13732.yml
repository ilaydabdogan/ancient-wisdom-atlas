canonical_text:
  quote: ''
  summary: The passage gives ritual rules for carrying and depositing a corpse in
    cloudy, rainy, flooded, sheltered, and roof conditions, and for determining how
    death-related or menstrual pollution affects ground, water, floors, stone, dung-fuel,
    ashes, salt, lime, and sacred twigs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A corpse is not to be carried all covered up; the text equates this with burying
    the corpse, and says carrying it in rain is worthy of death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When clouds have been around, the corpse may be carried away from the house;
    if rain begins on the road, it is not to be carried back to the house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the corpse is before a veranda, it may be set down there when the owner
    is apprehensive and does not allow it inside, and afterwards it is to be carried
    away to its place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: When water stands inside to the height of a javelin, the corpse is put down
    and later brought away again.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:5
  text: Me^ok-mah says a shelter should be fastened above the place so that it is
    dry below, the corpse should be placed under that shelter, and the shelter may
    then be taken away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: When a person dies on a cloth and a hair or limb remains on the bedplace and
    ground, the ground conveys pollution downward to the water.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: When a person dies on a bedstead whose legs are not connected with the ground,
    a hair or limb left on the bedstead does not convey pollution downward.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: When a person dies on a plastered floor, the plaster is polluted; if the plaster
    is dug up and spread again afterwards, it is clean.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a person dies on stone, the passage distinguishes connected, separated,
    dug-up, and uneven stone, and requires washing or a period of cleaning depending
    on the condition.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Dung-fuel and ashes are polluted when the limbs of a menstruous woman come
    upon them, and salt and lime used for washing her shift are to be treated like
    stone.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: When a person dies on a terrace roof and a limb or hair remains at the edge,
    the roof is polluted for the size of the body as far as the water.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sacred twigs in the house should be carried down from the polluted place until
    there are thirty steps of three feet between the pollution and the sacred twigs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: If the hair or limb has not come to the eaves, the roof is polluted to the
    bottom; the passage also says that when one dies on a rita, it is polluted.
  category: relationship
  evidence_refs:
  - ev:7
