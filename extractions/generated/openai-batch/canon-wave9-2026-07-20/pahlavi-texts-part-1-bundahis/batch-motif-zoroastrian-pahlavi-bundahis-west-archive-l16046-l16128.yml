canonical_text:
  quote: ''
  summary: The passage presents teachings about renunciation and atonement for sin.
    It describes renouncing sins separately, the danger of an unrenounced sin leaving
    the way to hell open, priestly retribution as atonement, procedures for sins against
    accusers, sin as debt with future-existence consequences, a tree simile for atonement,
    and a three-nights punishment that can make a person righteous.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Neryosang says renunciation should be performed for sin, including a sin not
    mentally originating with the person.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who has committed many mortal sins and mentally renounces each one
    separately is described as not being on the way to hell; if one sin is not renounced,
    the way to hell is not closed to him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says priestly retribution may be appointed to atone for sin, and
    if full atonement is not made it may be inflicted justly and strongly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: For a sin committed against accusers, the passage says action should avoid
    making the head of the family evil-minded and avoid divorce of the wife from matrimony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: For sin against accusers, the person is to engage in renunciation before the
    accusers, or, if not, before the high-priests.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says such sin becomes debts; debt does not make a man wicked,
    but in the future existence the accusers may forsake him, causing shame and disturbing
    his enjoyment.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: For sin affecting the accusers, when the female has atoned for it, its stem
    is atoned for; some say the stem has no root, while others compare it to a tree
    whose leaves wither away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: For sin relating to the soul, when a person engages in renunciation the sin
    stays away from him; if it is not fully atoned for, the three nights punishment
    will make him righteous.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kushtanohxlgo^d says that even sin affecting accusers stays away when a person
    engages in renunciation.
  category: speech
  evidence_refs:
  - ev:5
