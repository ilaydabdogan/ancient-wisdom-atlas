  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A query asks whether, in a state of uncertainty, a person should do, accomplish,
    or urge on an action that the Avesta says is not good and marks as worthy of death,
    for the better preservation or advance of religion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The answer says that acting well for better preservation brings no fear, but
    one is not to forsake the duty; a forsaken duty is described as very bad because
    contempt of it enters into one.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Zaratust asks Auharmazd whether people rise again from the place of conception,
