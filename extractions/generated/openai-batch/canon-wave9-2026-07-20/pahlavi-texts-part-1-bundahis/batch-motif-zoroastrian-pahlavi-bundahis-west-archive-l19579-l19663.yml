canonical_text:
  quote: ''
  summary: The passage states that certain persons or souls connected with demons,
    sodomy, or apostasy become demonic or snake-like, with a note explaining this
    as exclusion from resurrection. It reports Auharmazd instructing people to submit
    to a man who knows the Avesta and Zand so that they may learn duties and good
    works and avoid hell. It gives a casuistic question about an action forbidden
    under penalty of death, followed by an answer emphasizing preservation and not
    forsaking duty. Zaratust asks Auharmazd where the dead rise again, and Auharmazd
    replies that they rise where life left the body, with a further answer about one
    who dies suspended in the air.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage links demonic begetting with being a demon, says the soul of one
    who commits sodomy becomes a demon, and says the soul of one who performs religious
    rites of apostasy becomes a darting snake; an accompanying note glosses this as
    no resurrection for them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Auharmazd is reported as telling people to submit themselves, like worshippers,
    to the man for whom the whole Avesta and Zand is easy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stated purpose of submitting to that scriptural authority is to become
    acquainted with duties and good works.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says men go to hell when they do not submit to priestly control
