  text: Manuscript No. 22 in the India Office Library is described as an old Avesta/Pahlavi
    manuscript dated A.Y. 936/A.D. 1567 in a Pahlavi colophon, though the date may
    have been copied from an older manuscript.
  category: object
  evidence_refs:
