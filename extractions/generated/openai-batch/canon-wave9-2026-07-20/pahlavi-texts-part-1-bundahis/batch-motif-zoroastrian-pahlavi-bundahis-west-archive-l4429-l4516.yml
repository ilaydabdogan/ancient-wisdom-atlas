canonical_text:
  quote: ''
  summary: 'The passage lists mythic mountains and peaks: Alburz surrounds the earth
    and connects with the sky; Terak of Alburz is the route of the stars, moon, and
    sun; Hugar is the source from which the water of Aredvivsur descends; Ausindom
    stands in the wide ocean and receives water from Hugar; Daka-i-Daitik is a central
    judicial peak where the Chinvar bridge stands and souls are accounted; Arezur
    ridge is at the gate of hell where demons gather.'
  language: English
  quote_policy: summarized
