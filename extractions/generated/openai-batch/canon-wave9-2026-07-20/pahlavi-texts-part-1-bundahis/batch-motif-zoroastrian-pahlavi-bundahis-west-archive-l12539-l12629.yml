  summary: The passage describes demon-associated enemies and eastern armies involved
    in battles affecting Iran. At the end of time the enemies are destroyed and Iran
    is reinstated. The evil spirit rushes with demons and Wrath to aid demon-worshippers.
    Auharmazd sends Neryosang and Srosh to Kangdez to summon Peshyotanu and command
    the consecration of fire and waters.
