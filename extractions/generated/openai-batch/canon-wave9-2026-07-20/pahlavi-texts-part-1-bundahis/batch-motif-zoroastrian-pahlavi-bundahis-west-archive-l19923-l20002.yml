  quote: ''
  summary: The passage describes a person passing over a bridge and river under the
    blessing of the water spirit, praises the Yatha-ahu-vairyo prayer, instructs frequent
    reverent attendance at the abode of fires, and explains that archangels assemble
    there and shed good works and righteousness. It also compares wisdom to fire and
    to a useful clear fountain, gives ritual and ethical practices for repelling corruption
    and doing good works, and lists moral transformations as major human concerns.
  language: English
  quote_policy: summarized
