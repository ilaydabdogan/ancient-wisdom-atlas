canonical_text:
  quote: ''
  summary: 'Aharman is described as impotent and confused for three thousand years.
    Auharmazd produces his creatures during this confusion, first producing Vohuman,
    who advances the creatures and produces the world''s light and the good Mazdayasnian
    religion. The evil spirit first produces Mitokht and Akoman. The passage lists
    further good beings, beings from Aharman''s dark world, and a sequence of world
    creatures: sky, water, earth, plants, animals, and mankind.'
  language: English
  quote_policy: summarized
