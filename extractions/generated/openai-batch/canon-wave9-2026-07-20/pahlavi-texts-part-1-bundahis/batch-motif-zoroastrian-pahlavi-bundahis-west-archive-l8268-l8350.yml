canonical_text:
  quote: ''
  summary: The passage describes an eschatological reduction of appetite before Soshyans,
    followed by preparation for the raising of the dead. Zaratusht asks Auharmazd
    how a body dispersed by wind and water can form again. Auharmazd answers by citing
    his prior creation of sky, earth, heavenly bodies, plant growth, fire in plants,
    human formation in the womb, water, clouds, and air, arguing that these acts are
    more difficult than resurrection.
