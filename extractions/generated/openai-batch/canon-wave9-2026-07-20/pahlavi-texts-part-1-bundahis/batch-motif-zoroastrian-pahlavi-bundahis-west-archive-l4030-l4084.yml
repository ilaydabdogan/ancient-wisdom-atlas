  quote: ''
  summary: The passage describes a second conflict involving water. When the star
    Ti^tar is in Cancer, water pours as the destroyer rushes in from the west. Ti^tar,
    aided by named divine helpers and guardian spirits, brings water aloft by wind,
    assumes three forms, and produces rain for thirty days and nights. The rain becomes
    an earth-covering inundation that kills noxious creatures, driving them into holes
    in the earth. A note cautiously compares this inundation with the Noachian deluge
    while distinguishing its timing before human propagation.
