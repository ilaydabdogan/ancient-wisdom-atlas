  summary: The passage gives rules for the sacred thread-girdle, including proper
    and improper materials, minimum looseness or width, cutting off excess length,
    and the requirement not to retie it without recommencing the prayer formula. It
    also gives rules for materials suitable or unsuitable for girdling and shirting,
    and notes the sacred shirt’s width and form.
