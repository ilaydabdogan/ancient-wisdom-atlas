canonical_text:
  quote: ''
  summary: A benediction asks Auharmazd and a sequence of divine or angelic figures
    to grant the addressee rank, wisdom, understanding, wealth, spouse and lineage
    blessing, prosperity, herds, support, a throne in heaven, social standing, travel
    through the seven regions, protection from hostile forces, judgment, and conduct
    to resplendent heaven. Translator notes frame the chapter as an elaborate benediction
    using archangelic and angelic names associated with the Parsi month.
  language: English
  quote_policy: summarized
