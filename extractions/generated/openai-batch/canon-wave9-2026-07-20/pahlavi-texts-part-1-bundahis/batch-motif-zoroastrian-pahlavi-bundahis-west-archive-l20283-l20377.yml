comparison_claims:
- id: claim:1
  claim: A translator note relates the chapter's sequence of invoked archangels and
    angels to the day-name sequence of the Parsi month and points to the same names
    in Bundahis XXVII, 24.
  claim_level: linguistic_similarity
  target: Bundahis XXVII, 24 and the Parsi month day-name angelic sequence
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim rests on the supplied note; the present passage excerpt does
    not display all thirty names.
- id: claim:2
  claim: A translator note cautiously compares the 'sublime Ataro' to a personification
    of the fire Berezi-savang, also called Supremely-benefiting in the cited nearby
    corpus references.
  claim_level: same_function
  target: Fire Berezi-savang in Bundahis XVII, 1, 3 and SZS XI, 1, 6
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: low
  limitations: The note uses cautious wording ('seems to be'); the supplied passage
    itself only names the light of the sublime Ataro.
- id: claim:3
  claim: A translator note identifies greed, wrath, and want with three fiends cited
    from Bundahis XXVIII, supporting their treatment as adversarial powers within
    the same textual tradition.
  claim_level: same_function
  target: Bundahis XXVIII, 15-17, 26, 27; fiends identified in the note as Kz, Aeshm,
    and Niyaz
  evidence_refs:
  - ev:15
  counter_evidence_refs: []
  confidence: medium
  limitations: The main benediction names greed, wrath, and want; the specific fiend
    identification is supplied by the note.
