canonical_text:
  quote: when, afterwards, he passes away, and then also comes to his account as to
    sin and good works
  summary: 'The passage discusses a person who is deaf, dumb, and helpless yet of
    good conduct, saying that although he cannot perform good works, duties and good
    works performed in the world can become his property. After death he comes to
    an account of sin and good works: more good works lead to heaven, more sin to
    hell, and equality to the ever-stationary state. A note compares this with descriptions
    of Hamistakan and graded heavens and hells in related Zoroastrian texts.'
