canonical_text:
  quote: ''
  summary: The passage describes Soshyans in relation to the renovation of the universe;
    Sam as an immortal figure wounded by Niha and held in unnatural lethargy until
    Dahak is unfettered; Dahak as captured by Fretun and confined in Mount Dimavand;
    several mythic-geographic locations including Kangdez, Peiyansai, Airan-vej, S(a)ukavastan,
    Yim's enclosure, and Kashmir; and the opening of a teaching on resurrection and
    future existence using the food sequence of Mashya and Mashyot and its reversal
    at death.
  language: English
  quote_policy: summarized
