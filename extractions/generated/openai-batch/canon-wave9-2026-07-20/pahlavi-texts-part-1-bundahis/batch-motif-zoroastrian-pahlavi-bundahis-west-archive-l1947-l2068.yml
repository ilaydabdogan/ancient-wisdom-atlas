    for K35 and related copies. It then summarizes the Bahman Yast as a prophetic
    work in which Auharmazd reveals future events to Zaratu^t. The summary includes
    two visions of metal-branched trees symbolizing periods or ages of the religion,
    an age of invasion and religious decline, a great conflict involving hostile demon-like
    forces, and restorative figures including Hushe(^ar, Vahram the Var^avand, and
    Peshyotanu.
