canonical_text:
  quote: "“no passage was found by the evil spirit”"
  summary: The passage describes the evil spirit entering into conflict with the creations,
    seeing the bravery of the angels, and wanting to retreat. The spirit of the sky
    is portrayed as an armed warrior who arrays the sky against the evil spirit while
    Auharmazd completes a stronger rampart around and before the sky. Guardian spirits
    of warriors and the righteous, mounted and armed, watch the rampart. The evil
    spirit finds no passage, retreats, and sees the annihilation of demons and his
    own impotence, while Auharmazd sees final triumph and the everlasting renovation
    of the universe.
