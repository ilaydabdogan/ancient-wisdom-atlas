canonical_text:
  quote: ''
  summary: The passage describes upward celestial stations, identifies the Aparsen/Avar-royim
    mountain after Alburj, and recounts how primordial rain and wind left the earth
    divided into seven regions. The middle region, Khvaniras, has Pars at its centre,
    with six regions around it like a coronet; ocean, sea, forest, and a northern
    mountain separate the regions. The section ends by calling this the third contest,
    concerning the earth.
