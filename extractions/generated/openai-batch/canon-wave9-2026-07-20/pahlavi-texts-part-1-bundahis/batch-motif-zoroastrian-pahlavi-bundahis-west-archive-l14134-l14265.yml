canonical_text:
  quote: ''
  summary: 'The passage gives ritual-legal rules about corpse pollution: indirect
    contamination through contact, different effects when a dog has or has not seen
    the corpse, degrees of cleansing required, penalties for bringing or moving dead
    matter, use of a stake or another person''s hand in handling a corpse, and how
    to judge uncertainty about a corpse found at night.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Contact with a person who touched a corpse can transmit indirect pollution
    through a chain of contact.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes the indirect pollution of an ape and of a menstruous
    woman from the preceding contact rule, though the note says the meaning is uncertain.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A shepherd's dog, village dog, and similar dogs are said to carry contamination
    to specified numbers of persons, and the handling of dog carcasses affects the
    cleanliness of a place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Bringing dead matter onto another person is described as a sin worthy of death,
    with greater severity when a dog has not seen the corpse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Afarg is cited as saying that lack of appliances or means does not excuse
    committing a sin worthy of death in cases involving death and sickness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: If a corpse unseen by a dog is moved by many men, all their bodies become
    polluted and require ceremonial washing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: For some handling of a corpse that a dog has seen, ceremonial washing is not
    required; contact without moving the corpse is cleansed with bull's urine and
    water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A corpse unseen by a dog may be moved with a stake, and the note explains
    the stake as preventing direct attack by the Nasu demon of corruption.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Moving a corpse by means of another man's hand pollutes both the one directing
    the act and the one whose hand supplies the movement, with different named sins
    assigned according to circumstance.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: If a man passes a place at night and later finds a corpse there, not knowing
    whether it was already present, he is to consider that it was not there when he
    passed.
  category: sequence
  evidence_refs:
  - ev:6
