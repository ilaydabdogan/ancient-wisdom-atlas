  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Sataves drives back impurity and turbidness from the salt sea, while clear
    pure water goes into the Aredvisur sources of the wide-formed ocean.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Two rivers first flow from the northern border of Albur^, and later eighteen
    more great rivers come from the same source; the twenty rivers go down into the
    earth and arrive in Khvaniras.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'Two sea-fountains or lakes are opened for the earth: A^e^ast, with the fire
    Gu^-nasp on its shore, and Sovar, which casts turbidness to its shores and remains
    clear and pure, with the fire Burzin-Mitro nearby.'
  category: object
  evidence_refs:
  - ev:5
