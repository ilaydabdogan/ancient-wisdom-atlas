  text: The rain lasts ten days and nights, and its darting is described as the shooting
    of noxious creatures.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the rain, wind drives the water to the shore of the wide-formed ocean,
    where it is divided into three seas called Puitik, Kamiri^, and Gehan-bun.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
