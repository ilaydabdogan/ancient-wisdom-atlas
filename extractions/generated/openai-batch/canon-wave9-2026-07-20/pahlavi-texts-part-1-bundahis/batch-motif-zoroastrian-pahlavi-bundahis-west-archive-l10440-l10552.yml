canonical_text:
  quote: ''
  summary: The passage describes a destructive rain associated with the chastisement
    of Apaosh by Ti^tar and the fire Vazi^t. The rain lasts ten days and nights, is
    driven to the shore of the wide-formed ocean, and is divided into named seas.
    The text then explains salt water, ebb and flow under lunar influence, the gulf
    Sataves as a purifier of turbid waters, rivers flowing from Albur^, two sea-fountains
    or lakes with named fires resting near them, and concludes that this was the second
    contest, with water.
  language: English
  quote_policy: summarized
