canonical_text:
  quote: ''
  summary: A heavenly or royal voice warns that the Royal Road and Palace admit only
    a few. The birds are moved to follow the Tajidar, though some object. The Pheasant
    questions the Tajidar's pre-eminence, and the Tajidar answers with teachings on
    Sulayman's choice, Allah's unpredictable grace, and effort without certainty.
    An allegory follows in which Shah Mahmud shares his fortune with a poor fishing
    boy, producing a miraculous catch and lasting luck under the Sultan's shadow.
    The Nightingale then praises its love for the Rose and its intoxicating song,
    resisting the farther quest until checked by a sterner note.
  language: English
  quote_policy: summarized
