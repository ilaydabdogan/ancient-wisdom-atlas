candidate_motifs:
- id: motif:1
  label: Impermanence of worldly power and wealth
  taxonomy_refs:
  - wisdom
  basis: The passage lists rulers and wealthy or splendid figures whose glory, gold,
    buildings, or gardens fail to endure.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The available taxonomy has no exact impermanence category; 'wisdom' is
    used as a broad didactic fit.
- id: motif:2
  label: Worldly delusion as devouring trap
  taxonomy_refs: []
  basis: The World is described as alluring victims into a spider-like web and feeding
    on them.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No supplied taxonomy symbol directly corresponds to spider or web.
- id: motif:3
  label: Soul’s descent into mortal struggle
  taxonomy_refs:
  - departure
  - mystical_quest
  - initiation
  basis: The soul alights from heaven on earth and begins a race while a sin-imp attaches
    to it through the stages of life.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage emphasizes moral struggle more than a full quest itinerary.
- id: motif:4
  label: Sin as parasitic inner being
  taxonomy_refs: []
  basis: Sin appears as a saddle-clinging imp, a hateful beast, an inward plague,
    and a devil nourished by the soul.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage uses multiple metaphors; it does not present a single literal
    monster narrative.
- id: motif:5
  label: Disobedient dependent rejected by master
  taxonomy_refs:
  - divine_judgment
  basis: The greyhound exemplum shows a fed creature led by its lord turning to foul
    appetite and being liable to expulsion.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The divine application is implied by the surrounding moral discourse,
    while the literal scene is an animal exemplum.
- id: motif:6
  label: Renunciation of beloved bonds and life itself
  taxonomy_refs:
  - departure
  - mystical_quest
  basis: The passage warns that even consecrated bonds can clog the follower’s steps
    toward the world beyond and compares life to a net and threads.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage names attachment and detachment but does not narrate a completed
    renunciation.
- id: motif:7
  label: Human clay retaining mortal anguish
  taxonomy_refs:
  - death_rebirth
  basis: The earthen bowl explains that its clay was once human, passed through forms
    of bowl and urn, and still turns sweet water into tears.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The transformation is material and poetic, not a full resurrection or
    rebirth narrative.
- id: motif:8
  label: Posthumous revelation of deeds and divine judgment
  taxonomy_refs:
  - divine_judgment
  basis: After death, every person’s words, thoughts, and deeds gather into a heavenly
    cup that God strikes to tell the story by which the person stands or falls.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives an image of judgment rather than a detailed afterlife
    geography.
- id: motif:9
  label: Vow to God and obligation after victory
  taxonomy_refs:
  - sacred_exchange
  - covenant
  - divine_judgment
  basis: Mahmud promises spoil to God’s dervish people if God grants victory and is
    warned not to rob God afterward.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The vow is mediated through dervishes as recipients; the passage does
    not give a formal covenant ritual.
comparison_claims:
