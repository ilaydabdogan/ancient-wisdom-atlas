canonical_text:
  quote: "“And after Death? — that, shirk it as we may, / Will come, and with it bring
    its After-Day —”"
  summary: 'The passage presents a sequence of moral exempla: worldly greatness and
    wealth perish; the World is likened to a spider that traps victims until a master
    clears it away; the soul descends into mortal life and is burdened by sin; attachments,
    possessions, and life itself are treated as obstacles; a prophetic episode explains
    bitter water through human clay retaining mortal anguish; Yusuf’s cup becomes
    an analogy for posthumous disclosure of deeds; and Sultan Mahmud is warned to
    keep a vow made to God.'
  language: English
  quote_policy: quoted
