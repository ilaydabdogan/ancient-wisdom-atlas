    brothers’ story, as an analogy for the heavenly cup that will reveal every person’s
    deeds after death.
  claim_level: same_function
  target: Yusuf/Joseph cup-revelation episode as a model for posthumous disclosure
    of deeds
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal poetic comparison in the passage; it does not by
    itself establish historical development or textual dependence beyond the cited
    Yusuf exemplum.
- id: claim:2
  claim: 'Mahmud’s battlefield vow follows the broad pattern of a sacred exchange:
    victory is requested from God in return for dedicating the spoils to God’s people.'
  claim_level: same_motif
  target: votive promise-for-victory / sacred exchange pattern
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
