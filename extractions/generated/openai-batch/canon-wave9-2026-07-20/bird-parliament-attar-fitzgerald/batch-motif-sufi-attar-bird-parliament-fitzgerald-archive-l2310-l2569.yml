  evidence_refs:
  - ev:1
- id: obs:2
  text: At the opening of the first valley, a harsh wind described as edged with flames
    or snows causes a multitude to rise briefly and then flee, reducing the caravan
    to less than half its starting number.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Along the road, birds die or fall away through travel, heat, cold, drought,
    drowning, famine, poison, weariness, hunger, fear, predators, madness, suicide,
    and fighting one another for food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A handful reaches Kaf, and only thirty half-dead, feather-stripped birds fall
    upon the threshold of the Everlasting One after a destructive blaze involving
    rock, sea, and sun.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A winged harbinger of flame, also described as a tongue of fire and an angel,
    appears and asks who they are, where they came from, and why they came.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Tajidar answers for the thirty, calling them disfigured fractions of the
    sum of being that seek admission at the Treasury Door.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The angel replies that the sought One has no need to count the drops flowing
    from the universal fount or returning to it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The spokesman asks only to see the fount from which they flow and to lose
    themselves in it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: They are suddenly within, before a blazing throne; their gaze falls to a lightning-like
    scroll that reveals each one’s past soul-story.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The thirty respond to the revealed memory with confession and self-loathing,
    casting off the rags of carnal self and being reclothed in the soul’s integrity.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: When they raise their eyes again, they see in the center of the glory a transfigured
    figure of themselves, and the distinction between seer and seen becomes uncertain.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A voice explains that the sun of perfection is a glass in which those who
    see and reflect pass from seeing into being, seeing themselves in the speaker
