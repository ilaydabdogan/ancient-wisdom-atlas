canonical_text:
  quote: ''
  summary: After the birds learn the journey must truly be undertaken, many abandon
    the quest or die from fear, exhaustion, hunger, exposure, predators, madness,
    or violence. A small remnant reaches Mount Kaf, and only thirty battered birds
    arrive at the threshold of the Everlasting One. A fiery angel questions them;
    the Tajidar speaks for the thirty, asking admission and sight of the universal
    source. They are brought before a blazing throne, see a scroll revealing their
    own soul-histories, confess and shed the carnal self. Raising their eyes, they
    perceive a transfigured figure of themselves upon the throne, while a voice explains
    that seeker, path, sin, remorse, guide, journey, and arrival are all aspects of
    the One, into whom the separated fractions return like drops into the sea or rays
    into the sun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the journey is presented as something that must actually be done, dismay
    spreads among the birds, and many leave for woods and nests or spend their strength
    preparing without departing.
