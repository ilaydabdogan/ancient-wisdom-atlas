  text: The lot falls on the Tajidar; the birds proclaim him, crown him, and install
    him as captain and deputy of the lost sovereign.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Tajidar announces a march over a road never before traveled by wing, foot,
    or heart.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The road is described as passing through waterless deserts, shoreless waters,
