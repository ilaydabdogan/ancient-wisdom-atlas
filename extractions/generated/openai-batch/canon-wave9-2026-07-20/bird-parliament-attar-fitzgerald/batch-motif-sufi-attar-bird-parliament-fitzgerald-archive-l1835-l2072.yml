- id: obs:2
  text: The Tajidar states that the monarch receives no gift except the soul and self
    of the giver, and that the soul should seek no reward except the sovereign's presence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A didactic story is told in which Shah Mahmud, disguised, visits a poor furnace-stoker
    and shares his bread and water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After Mahmud reveals himself and offers any largess, the poor man asks only
    that the Shah continue to visit his lowly home.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The birds are moved by the story, forget the dangers of travel, and imagine
    restoration by the greater-than-Mahmud monarch.
