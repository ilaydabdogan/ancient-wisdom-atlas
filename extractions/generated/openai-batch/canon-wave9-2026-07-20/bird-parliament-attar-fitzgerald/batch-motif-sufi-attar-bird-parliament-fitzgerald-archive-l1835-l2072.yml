canonical_text:
  quote: ''
  summary: The birds hesitate before approaching a great monarch, thinking in earthly
    terms of gifts and access. The Tajidar teaches that the only acceptable gift is
    the giver's soul and tells a tale of Shah Mahmud and a poor furnace-stoker whose
    only desired reward is the Shah's continued presence. Encouraged, the birds demand
    the road and a guide; lots confirm the Tajidar, whom they crown as leader. He
    then describes the terrifying road ahead, including deserts, waters, mountains,
    deathly trials, and the first Vale of Search, an endless maze full of dangers
    where the pilgrim must keep moving forward.
  language: English
  quote_policy: summarized
