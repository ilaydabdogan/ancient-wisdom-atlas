canonical_text:
  quote: ''
  summary: The passage presents a royal exemplum in which a Shah values enacted obedience
    over ostentatious gifts; a rebuke of the Ring-dove’s repetitive mourning for Yusuf
    through the story of Jacob; and a dialogue in which a small bird asks the Tajidar
    how weak birds can reach the Mountain and the Symurgh. The Tajidar responds with
    a teaching on all beings as shadows of a single source, the need for purification,
    and return or union with the central soul of things.
  language: English
  quote_policy: summarized
