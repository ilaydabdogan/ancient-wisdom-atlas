canonical_text:
  quote: ''
  summary: 'A pilgrim is instructed to continue through darkness, knowledge, higher
    mountains, and the approach to a single sea where worlds, forms, and creeds dissolve.
    The passage then describes practices of renunciation and a pyre of self-annihilation
    leading to union with the One Essence, followed by a parable of moths seeking
    the flame: only the moth that burns in it truly knows it.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The heart is described as renewed in utter darkness by a gleam of glory that
    lights the pilgrim toward the Mountain Range of Knowledge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pilgrim’s path through knowledge includes harder conditions, a nimble
    guide, false shows, false voices, and successive peaks beyond each peak gained.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pilgrim is urged forward by love that burns up the carnal load and gives
    doubled wings for the road.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Kaf’s mountain peak appears in mist, and the pilgrim hears the tide of one
    sea in which seven seas, spheres, two worlds, phenomena, abstract forms, and creeds
    are said to subside or melt away.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: An astrologer inscribes figures and heavenly signs on a smooth sand table
    and then erases them with his finger.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the Table Land of One and Wonder, unity is described as a fierce sun; the
    pilgrim becomes blinded, deafened, and doubtful of within and without.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The pilgrim stands at a threshold, raises his hands, calls to the eternal
    Saki for a draught of light from the One Essence, drinks, plunges in, and does
    not return to tell.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The seeker is instructed to prepare through meditation, watch, fast, bodily
    discipline, prayer, and adoption of dervish clothing and scrip.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ambitions, lusts, prides, wealth, worldly and otherworldly attachments, kinship,
    country, worn-out creeds, and reason are gathered into a pyre of self-annihilation
    and self-sacrifice of soul.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The seeker is told to throw himself on the completed pile and ignite it with
    self-negation, while flames burn what can burn of the self.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A phoenix is described as unslayable by fire, springing from its ashes, becoming
    an inextinguishable spark, and blending with the One Eternal Essence.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The moths hold council and send messengers to find the flame they worship;
    the first reports seeing a taper, the second passes through the flame and returns
    unmarked, and the third plunges into the sacred fire and becomes one color and
    substance with it.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
