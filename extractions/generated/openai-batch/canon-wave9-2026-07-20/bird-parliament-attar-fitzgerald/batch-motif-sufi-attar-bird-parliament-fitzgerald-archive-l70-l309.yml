canonical_text:
  quote: ''
  summary: All birds gather in assembly to seek or choose a ruler. Tajidar the Wise,
    marked by divine signs and said to have traveled the Road, tells them he knows
    the sought Khalif/Lord and the way, but that the birds must make their own penitential
    journey. The route leads up to mountain Kaf, the world-hinging mountain where
    the seven seas mingle and Symurgh's presence is held. The road is perilous, long,
    possibly without return, and requires courage and purification from passion, pride,
    and worldly wisdom. The passage then begins a night meditation scene involving
    holy Bajazyd.
  language: English
  quote_policy: summarized
