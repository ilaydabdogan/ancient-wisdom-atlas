canonical_text:
  quote: ''
  summary: A sequence of birds or exempla presents attachments to rubies, royal service,
    kingship, and ritual purity. The Tajidar or Leader answers each with admonitions
    about enslaving desire, unstable worldly rule, borrowed sovereignty, divine accountability,
    and the insufficiency of outward purity without inner cleansing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed speaker says he stabs the ground for rubies, swallows them, and
    experiences them as sparks that burn his beak and eyes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rubies are described as nourished in the mountain heart of stone and as burning
    with inward light that inspires their owners.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Tajidar answers that quick pebbles and drowsy gold are both dead or dangerous,
    slavish, and liable to serve another master.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sulayman's small ruby signet constrains sea, land, winds, angel, and fiend;
    after his prideful prayer, God takes the jewel and gives it to a Div, who also
    takes the king's resemblance for forty days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Shah-Falcon says he is the king's chosen comrade, perches on the fist
    that wears the ring, was raised in the royal court, accepts hooding and partial
    blindness, and asks why he should leave the king.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The answer calls the Shah-Falcon blind with pride in vassalage to mutable
    rulers and compares proximity to such power to keeping near a dangerous fire.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: In an illustrative tale, a beloved slave of a Shah withers because the Shah
    daily shoots at an apple placed on the slave's head while bystanders praise the
    Shah's unerring hand.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Phoenix descends and says he does not care to wait on kings, because their
    crowns are only the shadow of his wings.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A vizier dreams of a dead Sultan, whose vision rejects royal titles, says
    there is only one Shah, and laments having lived as a Sultan rather than as a
    poor gleaner or beggar.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A Duck comes from a pond and claims unmatched religious purity because of
    frequent ablution and clean raiment, saying the water he washes in also becomes
    his praying-mat.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Leader angrily rebukes the Duck's religious pride, contrasting outward
    ritual obedience and clean feathers with inward uncleanness seen by the maker.
  category: speech
  evidence_refs:
  - ev:10
