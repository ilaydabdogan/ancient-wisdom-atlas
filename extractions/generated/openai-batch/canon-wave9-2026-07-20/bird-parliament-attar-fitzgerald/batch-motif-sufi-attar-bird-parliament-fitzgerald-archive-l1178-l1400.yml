candidate_motifs:
- id: motif:1
  label: Self-annihilation into unity
  taxonomy_refs:
  - annihilation_union
  basis: The opening doctrine explicitly asks for self-annihilation so that false
    twoness may live in true oneness, with conscious return into the eternal all.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The extraction follows the passage's language; theological interpretation
    beyond the stated doctrine is not added.
- id: motif:2
  label: Mystical quest guided by a wise leader
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The birds face a long mysterious way and receive guidance to act in hope
    and faith according to their strength.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The destination of the broader quest is not specified within this excerpt.
- id: motif:3
  label: Divine mercy for imperfect effort
  taxonomy_refs:
  - wisdom
  basis: The Sultan's parable excuses the soldier who took the nearest road he knew;
    the leader applies a similar principle to birds anxious about comprehension.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The divine application is implied by placement in the leader's instruction,
    but the Sultan story itself is courtly rather than explicitly divine.
- id: motif:4
  label: Repentance repeatedly restored
  taxonomy_refs:
  - wisdom
  basis: The leader tells penitents not to despair, cites pardon, and compares human
    life to a lamp that is repeatedly extinguished and relit.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The available taxonomy has no dedicated repentance motif; classified under
    wisdom.
- id: motif:5
  label: Divine judgment mitigated by mercy
  taxonomy_refs:
  - divine_judgment
  basis: At awakening from death and judgment, God uses angelic merit to rescue thousands
    from loss.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The mechanics of merit transfer should not be generalized beyond this
    passage.
- id: motif:6
  label: Sincerity surpasses formal knowledge
  taxonomy_refs:
  - wisdom
  basis: Gabriel discovers that the accepted prayer comes from one bowing to an idol
    but worshipping the True as best he knew; the story is introduced as good will
    prevailing beyond knowledge.
  evidence_refs:
  - ev:14
  - ev:15
  - ev:16
  - ev:17
  confidence: high
  cautions: The passage presents this as an exemplum of intention; it does not provide
    a comparative taxonomy beyond wisdom.
- id: motif:7
  label: Divided soul between ascent and fall
  taxonomy_refs:
  - duality
  basis: Inconstant birds alternate between saint and sinner and are compared to a
    wavering scale between rise and fall.
  evidence_refs:
  - ev:18
  - ev:19
  confidence: medium
  cautions: The duality is ethical and devotional in this passage, not a cosmological
    dualism.
- id: motif:8
  label: Love tested by willingness to lose life
  taxonomy_refs:
  - sacrifice
  basis: The Queen of Egypt offers the lover marriage followed by beheading; she kills
    him when he chooses flight and says true love would have given life.
  evidence_refs:
  - ev:20
  - ev:21
  confidence: medium
  cautions: This is framed as a parable about love and constancy; no ritual sacrifice
    is described.
