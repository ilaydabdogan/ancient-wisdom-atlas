canonical_text:
  quote: ''
  summary: The passage reports Zahhak's absence for sorcery and bloodshed intended
    to avert a prophecy that Faridun will take his throne. Kundrav, Zahhak's minister,
    finds Faridun enthroned with Shahrinaz and Arnawaz, pays him homage, later reports
    the palace seizure to Zahhak, and warns that Zahhak has lost royal power. Zahhak
    returns with divs and warriors, while Faridun's forces and the citizens resist
    him in battle.
  language: English
  quote_policy: summarized
