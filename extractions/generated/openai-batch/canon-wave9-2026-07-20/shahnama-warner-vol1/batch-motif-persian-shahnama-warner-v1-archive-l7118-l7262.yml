canonical_text:
  quote: ''
  summary: A mother recounts how an extraordinary cow nursed the prince and was later
    slain by the Shah. The prince wishes to avenge the wrong, but she counsels restraint.
    Zahhak, fearful of Faridun, summons nobles to sign a document praising his rule.
    Kawa the smith enters and demands justice because his sons have been taken, possibly
    to feed Zahhak's snakes. Zahhak frees Kawa's remaining son, but Kawa refuses to
    sign the document, tears and tramples it, and leaves. Courtiers complain, and
    Zahhak reports an ominous sensation of an iron mountain rising between himself
    and Kawa. A crowd gathers in the market-place.
  language: English
  quote_policy: summarized
