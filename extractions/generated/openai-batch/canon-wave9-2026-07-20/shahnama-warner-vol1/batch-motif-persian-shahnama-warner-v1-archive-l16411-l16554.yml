  quote: No mortal passeth into heaven alive, / Man is death's quarry
  summary: In a battle episode, Barman challenges Naudar's army. The aged Kubad volunteers
    despite Karan's warnings, speaks of death and burial, duels Barman, and is killed.
    Karan then attacks, fights amid a large battle, withdraws at night, and reports
    that Afrasiyab used magic that blinded him before the fighting resumes the next
    day.
