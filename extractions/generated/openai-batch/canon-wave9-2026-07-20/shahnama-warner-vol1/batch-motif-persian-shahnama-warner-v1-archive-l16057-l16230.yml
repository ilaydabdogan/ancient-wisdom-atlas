canonical_text:
  quote: ''
  summary: A letter urges Sam to protect Naudar's throne. Sam marches to Iran, where
    nobles complain of Naudar and propose Sam as king. Sam refuses to usurp a ruler
    of royal blood, warns the nobles, restores allegiance, counsels Naudar by examples
    of earlier just kings, and departs with honors. News of Minuchihr's death and
    Naudar's weakness reaches Turan; Pashang summons leaders and calls for revenge,
    and Afrasiyab vows to fight Naudar.
  language: English
  quote_policy: summarized
