canonical_text:
  quote: ''
  summary: Salm observes the troops admiring Iraj and conspires with Tur. At dawn
    the brothers enter Iraj’s tent; Tur challenges Iraj’s possession of the crown
    and Iran. Iraj renounces kingship and asks for peace, but Tur strikes and kills
    him, cuts off his head, and the head is sent to their aged father with a taunting
    message.
