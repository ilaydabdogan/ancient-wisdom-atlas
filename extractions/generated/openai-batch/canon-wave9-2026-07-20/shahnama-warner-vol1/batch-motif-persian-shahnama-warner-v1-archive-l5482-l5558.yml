  quote: ''
  summary: The passage introduces Gaiumart as the first Shah and ruler, describes
    Ahriman's envy and the Black Div's slaying of Siyamak, and notes Hiishang's vengeance
    and succession. A translator's note compares the episode with Bundahish traditions
    about Urmuzd, Gaiumart, the Primeval Ox, Ahriman, and primeval origins. The verse
    section presents Gaiumart as inventor of crown and throne, a mountain-dwelling
    first king under whom the arts of life began.
