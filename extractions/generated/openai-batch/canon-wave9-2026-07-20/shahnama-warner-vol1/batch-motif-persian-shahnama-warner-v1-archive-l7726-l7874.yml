canonical_text:
  quote: ''
  summary: During a revolt and battle, Zahhak secretly enters the palace, sees Shahrinaz
    with Faridun, and prepares to kill the women there. Faridun strikes Zahhak with
    an ox-head mace, but Surush forbids killing him and instructs that he be bound
    and removed. Faridun binds Zahhak, sits on his throne, addresses the citizens,
    receives their acceptance, and says God sent him from Mount Alburz to free the
    world from the Dragon's bane. Zahhak is then carried away, taken at Surush's instruction
    to Mount Dainawand, and secured in a narrow gorge and chasm. The passage closes
    with a moral reflection on good, evil, and reputation.
  language: English
  quote_policy: summarized
