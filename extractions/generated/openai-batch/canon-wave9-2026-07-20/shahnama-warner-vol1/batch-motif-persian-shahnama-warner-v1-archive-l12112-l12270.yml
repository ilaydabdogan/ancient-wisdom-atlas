canonical_text:
  quote: '"This raised tumult in the heart / Of Zal, and rest and reason fled from
    him"'
  summary: Zal travels in royal state to Kabul, meets the tributary ruler Mihrab,
    hears a chieftain praise Mihrab's daughter, falls in love with her though unseen,
    and refuses Mihrab's invitation to visit because of political and religious objections.
    The passage then introduces Ruddba/Kiidaba and Sindukht in the women's bower.
  language: English
