canonical_text:
  quote: ''
  summary: In a celebratory Sistan, Sam publicly explains that he must leave for war
    by royal order, recalls abandoning Zal and receiving him back through the Simurgh
    and God, appoints Zal as his representative, instructs him and the elders in good
    rule, reassures Zal with an astrologically declared destiny, departs for war,
    and Zal assumes the throne and learns from sages and warriors.
  language: English
  quote_policy: summarized
