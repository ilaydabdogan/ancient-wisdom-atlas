canonical_text:
  quote: ''
  summary: After public mourning for the slain Iraj, Faridun discovers that Mah Afrid
    is pregnant by Iraj. She bears a daughter, who is raised tenderly, likened to
    Iraj, and married to Pashang. Their son Minuchihr is born and presented to Faridun
    as the living likeness of Iraj; Faridun prays for sight and God restores it. Faridun
    names and raises Minuchihr, gives him royal and martial regalia, and gathers nobles
    for vengeance. Salm and Tur, fearing the renewed throne, prepare an embassy with
    treasure to ask forgiveness.
  language: English
  quote_policy: summarized
