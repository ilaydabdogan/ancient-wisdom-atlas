canonical_text:
  quote: ''
  summary: Jandal conveys Faridun's request that the king of Yaman marry his three
    daughters to Faridun's three sons. The king of Yaman grieves at the prospect of
    losing his daughters, consults Bedouin chieftains, hears advice about resistance
    or craft, and finally sends a deferential conditional answer asking to see and
    judge the three princes before giving his daughters according to custom and making
    a league with them.
  language: English
  quote_policy: summarized
