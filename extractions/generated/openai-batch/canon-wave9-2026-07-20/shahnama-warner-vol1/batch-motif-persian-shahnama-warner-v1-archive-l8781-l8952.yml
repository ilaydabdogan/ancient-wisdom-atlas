canonical_text:
  quote: ''
  summary: Faridun names the wives of his three sons and consults the horoscopes of
    Salm, Tur, and Iraj. The signs foretell favorable fortunes for Salm and Tur but
    strife and woe for Iraj. Faridun divides the world into three realms, assigning
    Rum and the West to Salm, Turan and Chin to Tur, and Iran with Arabia and the
    royal throne to Iraj. As Faridun ages, Salm becomes envious of Iraj’s greater
    portion and sends a message to Tur. Tur agrees that they were wronged, using an
    image of a tree whose fruit is blood. The brothers meet in counsel and send a
    priest-envoy to Faridun, accusing him of injustice and caprice.
  language: English
  quote_policy: summarized
