canonical_text:
  quote: ''
  summary: Sam recounts killing a dragon with arrows, his ox-head mace, and his steed;
    the dragon’s death brings peace but leaves venomous devastation. He then recalls
    his service to the Shah, his old age, and his transfer of martial duties to Zal,
    whose request concerning a beloved in Kabulistan he asks the Shah to consider.
    Zal takes Sam’s letter and rides to court. In Kabul, Mihrab angrily threatens
    Sindukht and Riidaba to appease the Shah, but Sindukht proposes going to Sam with
    wise speech and gifts to avert destruction.
  language: English
