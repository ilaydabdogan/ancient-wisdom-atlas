canonical_text:
  quote: ''
  summary: Sindukht asks Mihrab about Zal. Mihrab praises Zal as an unmatched warrior
    with white hair as his only defect. Rudaba hears the praise, falls lovesick, and
    confides her love to five waiting-maids. The maids first object by citing Zal's
    rejected and animal-fostered infancy, but Rudaba insists she loves him by report
    and for his merits. The maids then pledge service and possible magical aid to
    bring Zal to her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sindukht asks Mihrab how his visit prospered and asks what Sam's white-haired
    son is like, including whether he is suited for a nest or a throne.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mihrab answers by praising Zal as unmatched among warrior-paladins, strong,
    generous on the throne, deadly in battle, and marked by white hair as his only
    defect.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After hearing Mihrab's description, Rudaba blushes, is filled with love for
    Zal, cannot eat or rest, and undergoes a change in disposition.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Rudaba tells five faithful Turkman waiting-maids that she has a secret: she
    loves Zal, thinks of him day and night, and wants means found to relieve her distress.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The waiting-maids first judge Rudaba's desire wrong, praise her rank and beauty,
    and ask whether modesty and regard for her father have departed from her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The waiting-maids object that Zal was rejected by his father, fostered by
    a fowl on a mountain, and born as an aged babe.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Rudaba angrily rejects the maids' counsel, says she wants no Caesar, Faghfur
    of Chin, or Iranian prince, and declares that her heart chose Zal by report and
    for his merits.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The waiting-maids submit to Rudaba's command, promise devoted service and
    secrecy, and offer artifice, spell, and swift action to bring Zal to her.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage ends with Rudaba smiling.
  category: action
  evidence_refs:
  - ev:9
