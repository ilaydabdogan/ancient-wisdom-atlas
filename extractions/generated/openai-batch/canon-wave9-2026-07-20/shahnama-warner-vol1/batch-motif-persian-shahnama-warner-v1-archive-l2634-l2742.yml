canonical_text:
  quote: ''
  summary: The passage describes the Shahnama as a metrical chronicle of Persian fatherland
    and folk from Creation to the Muhammadan conquest, contrasts Firdausi's expansive
    compositional method with Homer's concentrated method, explains chronological
    inconsistencies through semi-divine heroes and popular mythology, outlines the
    poem's dynastic organization, distinguishes mythic and historic periods, and identifies
    personified good and evil, Urmuzd and Ahriman, as pervasive powers in Zoroastrian
    dualism.
  language: English
  quote_policy: summarized
