canonical_text:
  quote: ''
  summary: Mihrab rejoices at the proposed marriage alliance, praises Sindukht, and
    puts his treasury at her disposal. Sindukht tells Rudaba the favorable news and
    prepares Kabul and the palace with ornaments, throne, charms, music, perfumes,
    textiles, and gifts. Zal returns to Sam, reports his success, and Sam recounts
    Sindukht’s embassy and the agreement that Zal will marry Rudaba. Sam and Zal travel
    toward Kabul with troops and elephants. Mihrab meets them ceremonially, crowns
    Zal, and they enter Kabul amid music, perfumes, slaves bearing cups of musk and
    gems, and general distribution of treasure. Sam asks how long Rudaba will remain
    concealed.
  language: English
  quote_policy: summarized
