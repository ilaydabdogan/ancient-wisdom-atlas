canonical_text:
  quote: ''
  summary: The passage first summarizes a mythic sequence in which waters and land
    deteriorate, the man and ox die, the first human pair and useful animals arise
    from their bodies, and Ahriman creates harmful creatures in opposition. It then
    discusses ancient Iranian ethnic and linguistic classification through Darius
    Hystaspis's trilingual inscription, describes Indo-European and Aryan peoples,
    and outlines Aryan social orders, fire-priests, worship of personified natural
    forces, beneficent powers, malignant drought and darkness spirits including Dahaka
    the serpent-fiend, a struggle over heavenly waters, divine healer and hero figures,
    sacrifices with Soma/Homa, ancestor worship, and sympathetic magic of names.
  language: English
  quote_policy: summarized
