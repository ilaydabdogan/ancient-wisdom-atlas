canonical_text:
  quote: "“With the accession of Zahhak evil becomes triumphant everywhere.”"
  summary: The passage summarizes Zahhak’s oppressive rule, Faridun’s destined opposition,
    Kawa’s instigation of revolt, and Zahhak’s capture. The note compares Zahhak with
    Avestan and Dinkard traditions about Azi Dahaka/Dahak, including water-theft,
    serpent imagery, sacrifice, world-destruction, Faridun’s victory, and the binding
    rather than killing of the demon.
  language: English
  quote_policy: quoted
