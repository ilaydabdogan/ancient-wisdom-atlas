comparison_claims:
- id: claim:1
  claim: The passage explicitly aligns Shahnama Zahhak with the Avestan Azi Dahaka/Dahak
    adversary, preserving a serpent-demonic enemy motif while noting that the Shahnama
    version is less supernatural.
  claim_level: same_motif
  target: Avestan/Zandavasta Azi Dahaka and Shahnama Zahhak
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:8
  counter_evidence_refs:
  - ev:3
  confidence: high
  limitations: The comparison is supplied by the translator/editorial note; the passage
    also states that the Shahnama version loses much of the supernatural character.
- id: claim:2
  claim: 'The Faridun/Thraetaona/Fredun material has the same functional pattern across
    the cited traditions: a destined or heroic opponent overcomes Zahhak/Dahak and
    brings him into captivity or binding.'
  claim_level: same_function
  target: Faridun in the Shahnama argument, Thraetaona in the Zandavasta citation,
    and Fredun in the Dinkard citation
  evidence_refs:
  - ev:1
  - ev:4
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The passage summarizes the Shahnama episode and quotes or summarizes
    related traditions rather than presenting all versions in equal narrative detail.
- id: claim:3
  claim: The passage associates serpent-worship and human sacrifice as linked attributes
    of Zahhak’s characterization.
  claim_level: same_function
  target: Serpent-worship and human-sacrifice pattern in the editorial note on Zahhak
  evidence_refs:
