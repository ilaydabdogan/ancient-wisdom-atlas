canonical_text:
  quote: ''
  summary: A winged bird gives Zal a plume and instructions. Sindukht fears for the
    mother, and an archimage performs a side-delivery while the mother is unconscious,
    delivering the infant Rustam unharmed. The newborn is described as enormous, lionlike,
    heavenly, and marked by kingly Grace. A decorated silk effigy of him is sent to
    Sam, who rejoices, rewards messengers, and writes to Zal. Rustam is nursed by
    ten nurses, grows with extraordinary appetite and stature, and is ceremonially
    displayed on a caparisoned elephant when Sam comes to see him.
  language: English
  quote_policy: summarized
