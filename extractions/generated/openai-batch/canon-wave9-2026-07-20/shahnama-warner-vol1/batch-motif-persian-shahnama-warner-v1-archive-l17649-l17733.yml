canonical_text:
  quote: The throne of king of kings is void.
  summary: After Garshasp son of Zav departs, the royal throne is empty. Pashang urges
    Afrasiyab to cross the Jihun before the throne is filled, and Afrasiyab mobilizes
    for war. The people of Iran turn to Zal, complaining that the world is shahless
    and the army chiefless. Zal answers that he is aged but that Rustam has grown
    from his root like a glorious shoot; he seeks a suitable steed and calls his young
    son toward battle and revenge.
  language: English
  quote_policy: quoted
