canonical_text:
  quote: ''
  summary: Rudaba's five damsels go in spring to the riverside near Zal's camp, gather
    roses, and attract Zal's notice. Zal sends a slave-boy across the stream after
    shooting a waterfowl; the damsels question him about Zal and describe Rudaba as
    a fitting match. The slave-boy reports back, Zal sends gifts and a message, and
    the damsels invite Zal to speak in person. Zal comes to them and asks for truthful
    information about Rudaba.
  language: English
