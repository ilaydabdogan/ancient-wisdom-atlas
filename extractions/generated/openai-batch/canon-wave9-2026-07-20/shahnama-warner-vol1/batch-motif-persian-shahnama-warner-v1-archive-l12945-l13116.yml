canonical_text:
  quote: ''
  summary: Zal addresses the archimages with praise of God, argues that pairing, marriage,
    and progeny accord with divine and social order, and asks counsel about his love
    for Mihrab's daughter. The archimages hesitate because of Mihrab's descent from
    Zahhak and Minuchihr's hatred of that line, then advise Zal to write to Sam so
    Sam may intercede with the Shah. Zal dictates a letter praising God and Sam, recalls
    being carried by the Simurgh to a mountain nest in India, and confesses his love-sickness
    for Mihrab's daughter.
  language: English
  quote_policy: summarized
