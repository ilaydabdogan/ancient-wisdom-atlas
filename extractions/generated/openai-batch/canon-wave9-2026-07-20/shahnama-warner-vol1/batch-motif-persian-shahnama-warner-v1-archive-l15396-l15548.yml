canonical_text:
  quote: ''
  summary: Sam blesses the young Rustam, who declares himself Sam's offshoot and asks
    for a warrior's life. The company feasts; Sam marvels at Rustam's body and recalls
    his unprecedented delivery through the Simurgh by God's guidance. Mihrab speaks
    in drunken jest. Sam later gives Zal moral counsel, departs westward, and Zal
    and Rustam return to revelry in Sistan. In a later garden revel Rustam distributes
    gifts, sleeps, then hears that the white elephant has broken loose; he seizes
    Sam's mace while gatekeepers warn him against going out.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy is described as crowned and throned, and Sam blesses him with a wish
    for long and happy life, calling him a matchless lion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rustam kisses Sam's throne and addresses Sam as a great paladin, calling himself
    Sam's offshoot and slave and asking Sam to be his root.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Rustam says he does not want banquet, dream, and ease, but wants steed, saddle,
    mail, helm, bolt, and arrow, and to trample foes by God's bidding.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sam grasps Rustam's hand, kisses his head and eyes, and later sits on a throne
    with an eagle's feather on his crown, flanked by Zal and Rustam, who holds a mace.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sam gazes at Rustam and describes his neck, arms, waist, chest, thighs, heart,
    might, features, and Grace, concluding that he has no peer on earth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sam says no one in a hundred generations would know of a babe delivered in
    this way, and he blesses the Simurgh to whom God showed the way.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: During wine-drinking, Mihrab speaks in jest about himself, Rustam, his steed
    Shabdiz, and a sword, and says he will revive the customs of Zahhak; Zal and Sam
    laugh at the words.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sam advises Zal to be just and loyal to the Shahs, prefer wisdom over wealth,
    refrain from evil, seek God's way, and walk in righteousness.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sam bids farewell, says his time may have come, journeys west, is accompanied
    for three stages by his children with tearful cheeks, and then Zal goes to Sistan
    with Rustam.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At a garden revel, Zal asks Rustam to prepare robes of honour and steeds;
    Rustam gives gold, caparisoned Arab steeds, and other gifts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After Rustam sleeps, shouts outside his door announce that the chiefs' white
