canonical_text:
  quote: '"Mine ardent soul in sleep saw two white hawks / Approaching from Iran"'
  summary: Rustam delivers Zal's message to Kai Kubad. Kai Kubad recounts a dream
    in which two white hawks from Iran place a sun-bright crown on his head; Rustam
    declares the dream prophetic and they travel toward Iran. At the Turkman outposts
    Rustam prevents Kai Kubad from fighting, confronts Kulun and the enemy horsemen,
    impales Kulun with a spear, rides Rakhsh over him, and the Turkman horsemen flee.
  language: English
  quote_policy: quoted
