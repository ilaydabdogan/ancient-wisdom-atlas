canonical_text:
  quote: ''
  summary: 'Editorial and comparative note on the Zahhak legend: Zahhak’s thousand-year
    reign is historically interpreted; his imprisonment rather than death is noted;
    Kawa the smith and his flag are localized in West Iranian tradition; Damawand
    commemorations are described; Kundrav is compared with Vedic Gandhava and Zandavasta
    Gandarewa; and an Armenian Latin version of the Zahhak/Byrasp legend is quoted
    and summarized with demonic instruction, shoulder-born dragons, binding by Faridun/Rhodanes,
    mountain confinement, revolt, and death near a sulfur pit.'
  language: English with quoted Latin
  quote_policy: summarized
