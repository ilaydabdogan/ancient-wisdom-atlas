  quote: "“The sage regardeth as a sea this world”"
  summary: A devotional prelude likens the world to a storm-driven sea with many ships.
    One stately vessel contains Muhammad, 'Ali, and their kin. The sage-speaker says
    he would sink with them, trusts the Lord for rescue, advises the listener to stay
    close to the Prophet and 'Ali when looking toward the other world, declares his
    own faith, and condemns haters of 'Ali to eternal flame.
