  summary: The passage first cites a Zoroastrian revelation about resurrection, future
    existence, dietary abstinence, Mashya and Mashyoi, and the coming of Soshyans.
    It then narrates Jamshid's succession to Tahmuras, his possession of royal Grace,
    his civilizing inventions and social ordering, his command over divs, his discoveries
    in materials and medicine, his ascent-like gemmed throne borne by divs, and the
    institution of New Year's Day with festival observances.
