canonical_text:
  quote: ''
  summary: 'The passage summarizes textual sources for Iranian cosmogony and describes
    the Shahnama’s world model: a flat earth supported by a bull and fish in the ocean,
    encircled by the heaven-reaching Alburz Mountains with solar apertures, divided
    into Seven Climes with Iran at the center, and surrounded by an Ocean-stream.
    It also discusses the Aras/Oxus geographical problem, the poem’s nine nested heavens,
    and Firdausi’s use of cosmological imagery for royal and martial scale.'
  language: English
  quote_policy: summarized
