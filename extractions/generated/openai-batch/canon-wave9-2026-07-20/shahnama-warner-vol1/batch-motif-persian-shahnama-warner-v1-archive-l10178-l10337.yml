canonical_text:
  quote: ''
  summary: After Faridun's message is delivered, Tur and Salm prepare for war. Faridun
    sends Minuchihr toward the desert frontier, where the Iranian host is mustered
    and arrayed. Tur challenges Minuchihr's lineage and right to royal regalia through
    Kubad, and Minuchihr answers by invoking divine knowledge, Faridun's assurance
    of his descent from Iraj, and a vow of vengeance.
  language: English
  quote_policy: summarized
