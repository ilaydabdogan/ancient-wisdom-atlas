- id: obs:1
  text: After the envoy relays Faridun's message, the addressed tyrants are distressed
    and consult without reaching a decision.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tur says peace and joy are over, calls the youth a lion's whelp taught by
    Faridun, and urges immediate preparation for war.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tur and Salm muster cavalry and troops from the West and Chin and march toward
    Iran with elephants and precious stores.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Faridun is told that a host has crossed Jihun and directs Minuchihr across
    the frontier toward the desert.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Faridun advises that a fortunate youth with patience, prudence, sense, and
    wits can overcome dangerous quarry, and says he would chastise his foes in his
    closing days with a sword of fire.
  category: speech
  evidence_refs:
  - ev:3
