canonical_text:
  quote: ''
  summary: Sarv gives three daughters and rich bridal goods in lawful marriage to
    Faridun's sons. The returning princes are met by Faridun, who changes into a flaming
    dragon to test their characters. The eldest flees, the second prepares to fight,
    and the youngest warns the dragon with a measured threat. Faridun then returns
    in royal form, reveals the trial, and names his sons according to their responses.
  language: English
  quote_policy: summarized
