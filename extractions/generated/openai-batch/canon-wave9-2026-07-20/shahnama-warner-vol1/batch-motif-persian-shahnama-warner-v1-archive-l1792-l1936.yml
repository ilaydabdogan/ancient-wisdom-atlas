  summary: The passage discusses the poet's hoped-for support from Abu'l 'Abbas Fazl
    and Mahmud, presents verses about the Shahnama as a royal memorial and about the
    poet's desired reward, then gives laments over neglect, slander, despair over
    worldly and heavenly fortune, retrospective prophecies of tyrannical kingship
    and social disorder, and the poet's despondence after completing the work in old
    age.
  language: English
