  quote: ''
  summary: The passage summarizes Abtin’s rebellion, exile, marriage to Faranak, renewed
    warfare, and Faridun’s prodigious birth; then narrates Zahhak’s thousand-year
    corrupt reign, his seizure of Jamshid’s sisters, the nightly killing of youths
    to feed his snakes, the cooks Irma'il and Karmai'il rescuing one youth from each
    pair by substitution, the origin of the Kurds from the rescued youths, and Zahhak’s
    dream of a royal warrior who binds and drags him toward Mount Damawand.
