canonical_text:
  quote: ''
  summary: Zal asks that his father Sam honor an earlier pledge and allow him to marry
    Mihrab's daughter. Sam receives Zal's letter, hesitates because the pair seem
    opposed by lineage and nature, then consults astrologers. The astrologers interpret
    the signs favorably, saying the pair will produce a mighty son who will benefit
    Iran and defeat enemies. Sam sends a guarded but gentle reply, and Zal rejoices.
  language: English
  quote_policy: summarized
