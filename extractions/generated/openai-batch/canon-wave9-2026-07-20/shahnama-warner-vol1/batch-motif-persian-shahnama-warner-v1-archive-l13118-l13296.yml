- id: obs:1
  text: Zal says the archimages advised him not to keep his Jewel hidden but to act
    loyally, and he asks to make Mihrab's daughter his lawful wife.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zal appeals to Sam's earlier pledge not to frustrate any wish of his heart,
    made after God restored him from Mount Alburz.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Zal sends a mounted messenger from Kabul to Sam with instructions to use a
    second horse if the first fails.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sam, while hunting near the Kargasars, sees the messenger from afar, receives
    Zal's letter, and reads it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sam is troubled by Zal's request and reflects that it is natural for one nurtured
    by a bird to desire such a match.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sam weighs whether refusing Zal would break faith before God and humans, while
    approving raises concern about the offspring of a bird-nursed man and a div's
