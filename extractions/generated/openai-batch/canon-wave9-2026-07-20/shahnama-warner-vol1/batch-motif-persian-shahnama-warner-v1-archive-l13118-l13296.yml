    and Faridun on Judgment Day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The astrologers search the stars and return smiling, saying opposites have
    combined favorably for Sam.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The astrologers predict that Zal and Mihrab's daughter will be a glorious
    pair and that their son will be a mighty champion.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The predicted son is said to overcome evildoers, cleanse the earth with a
