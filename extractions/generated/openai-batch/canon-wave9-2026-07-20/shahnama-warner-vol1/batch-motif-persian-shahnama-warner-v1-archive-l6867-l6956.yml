canonical_text:
  quote: ''
  summary: Zahhak wakes in terror from a dream and is questioned by Arnawaz. She urges
    him to seek counsel from archmages and astrologers. Zahhak summons them, demands
    interpretation of the dream and knowledge of his future successor, and threatens
    them when they remain silent. Zirak, chief among the archmages, states that all
    mortals die and prophesies that an unborn figure named Faridun will take Zahhak's
    throne after being born to his honored mother.
  language: English
  quote_policy: summarized
