canonical_text:
  quote: ''
  summary: Shah Naudar is killed by beheading, and Iran is described as bereft of
    throne and crown. A didactic warning follows against greed for sovereignty. Ighriras
    persuades the king to spare captured disarmed warriors and imprison them rather
    than slaughter them. The monarch sends the captives away bound, goes to Rai, assumes
    the crown, and acts as monarch of Iran. News of Naudar's death reaches Gustaham
    and Tus; mourners in Iran perform visible grief, go toward Zal in Zabul, praise
    Naudar as guardian and just monarch, invoke Faridiin's line, and vow vengeance
    with swords while heaven is imagined as raining tears of blood.
  language: English
  quote_policy: summarized
