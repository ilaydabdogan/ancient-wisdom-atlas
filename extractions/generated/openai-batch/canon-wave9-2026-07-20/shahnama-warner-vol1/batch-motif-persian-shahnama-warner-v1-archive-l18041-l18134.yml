canonical_text:
  quote: ''
  summary: Kulin is sent to guard the road with warriors and elephants. Rustam marches
    toward Mount Alburz seeking Kai Kubad, finds a paradisal riverside court with
    a young man on a golden throne, declines delay because Iran lacks a ruler, explains
    that the chiefs have prepared the throne for Kai Kubad, and learns that the young
    man himself is Kai Kubad, descended from Faridun. Rustam then bows and offers
    obeisance.
  language: English
  quote_policy: summarized
