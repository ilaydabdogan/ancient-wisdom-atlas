canonical_text:
  quote: ''
  summary: A hostile message from two of Faridun's sons complains that another son
    has been favoured with the crown and threatens military action unless he is removed.
    A priest-envoy brings the message to Faridun's splendid court. Faridun receives
    the envoy, hears the message, and answers with anger, defending his just division
    of the earth, warning his sons against Ahriman, the Div, dragon-like peril, passion,
    and the Day of Reckoning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speakers of the opening message complain that one person has been favoured
    with the crown and proximity to Faridun while they are judged unworthy of the
    royal throne despite equal birth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The message demands that the crowned person's head be discrowned and that
    he be given only a corner of the world; otherwise the speakers threaten to bring
    Turkman, Rum, and Chin warriors against Iran and the threatened figure.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The priest-envoy kisses the ground after hearing the harsh message and rides
    swiftly toward Faridun's court.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Faridun's court is described as cloud-capped and extended across ranges, with
    chiefs at the gate, high-ranking people behind a curtain, chained pards and lions,
    war-elephants, and a roaring body of warriors.
  category: setting
  evidence_refs:
  - ev:2
