canonical_text:
  quote: ''
  summary: The passage first describes Karan challenging Wisa, battle being joined,
    and Wisa fleeing and grieving before Afrasiyab. It then narrates Shamasas and
    Khazarwan invading Zabulistan while Zal is occupied with Sam's burial. Mihrab
    sends a delaying message promising tribute and submission, while secretly calling
    Zal for help. Zal returns, signals his presence with three arrows, enters battle,
    is struck by Khazarwan, re-arms with his father's mace, kills Khazarwan, challenges
    Shamasas, and then turns toward Kulbad.
  language: English
  quote_policy: summarized
