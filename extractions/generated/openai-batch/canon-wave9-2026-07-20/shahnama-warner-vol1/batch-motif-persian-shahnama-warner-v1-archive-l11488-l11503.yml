canonical_text:
  quote: ''
  summary: A bird carries an infant from heated rocks to her nest on Mount Alburz,
    apparently for her young to tear him. God has pity, and the bird and her brood
    instead love the weeping infant, feed him the tenderest prey, and make him suck
    blood instead of milk. He remains unseen for a long time, grows to manhood, and
    is later seen by a passing caravan, described through images of a cypress, silver
    mount, and reed.
