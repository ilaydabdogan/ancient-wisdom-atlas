canonical_text:
  quote: ''
  summary: Faridun instructs his three sons before their mission to Sarv, king of
    Yaman, explaining how Sarv will test them by arranging his three daughters in
    deceptive age order. The princes go to Yaman, are lavishly received, correctly
    answer Sarv's question, and are betrothed to the daughters. Sarv then tests the
    princes by sorcery, conjuring a deadly frost and blast while they sleep, but the
    princes resist the spell and survive unharmed.
  language: English
  quote_policy: summarized
