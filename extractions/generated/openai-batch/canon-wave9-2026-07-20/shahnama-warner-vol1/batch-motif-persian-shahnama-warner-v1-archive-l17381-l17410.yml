  summary: Afrasiyab hears a reply and is silenced; in rage he draws a scimitar and
    kills his wise and good brother. Zal hears of the killing and foretells the darkening
    of Afrasiyab's fortune and the wasting of his throne. Zal musters his army and
    marches toward Pars for revenge. Afrasiyab marches out toward Khar of Rai, and
    the two hosts fight for two weeks with heavy losses until horse and foot are weary.
