canonical_text:
  quote: ''
  summary: Rustam enters the bazaar with a caravan, launches a night attack on the
    castellan and garrison of Mount Sipand, finds a rich treasury, reports his victory
    to Zal, carries off selected spoils, burns the hold, and returns to a public and
    family welcome. Zal sends news to Sam, who celebrates Rustam and describes his
    prowess as inherited from Zal. The passage then turns toward Minuchihr’s final
    counsels.
  language: English
  quote_policy: summarized
