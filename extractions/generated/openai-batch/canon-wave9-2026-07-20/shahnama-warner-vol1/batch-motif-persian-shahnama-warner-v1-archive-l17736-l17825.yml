canonical_text:
  quote: ''
  summary: In a dialogue with Zal, the young warrior rejects ease and feasting and
    insists that the time is for battle against Afrasiyab. He boasts of divine aid,
    weapons, a mighty steed, and victory over Turanian hosts. Zal is moved and orders
    the preserved mace of Sam to be brought. Rustam rejoices at the mace and asks
    for a steed; the next section begins with Zal gathering horse herds for the episode
    of Rustam catching Rakhsh.
