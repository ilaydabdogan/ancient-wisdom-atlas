canonical_text:
  quote: ''
  summary: Karan and Shirwi assault and burn a hold by the sea. The prince reports
    the arrival of Kakwi, a grandson of Zahhak and ally of Salm. Minuchihr duels and
    kills Kakwi. Salm flees toward the sea, finds no vessel, is overtaken by Minuchihr,
    accused of murdering his brother for a crown, and killed; his head is set on a
    spear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At daybreak Karan sets up a standard compared to the full moon, shouts, and
    signals to Shirwi and the chiefs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shirwi moves toward the hold, seizes the gate, and sends in troops; Karan
    and Shirwi fight with the sword above and the sea below.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The castle and ship become invisible in smoke; fire blazes, wind blows, and
    by sunset the hold and plain are level, with twelve thousand foes slain and gore
    on the waste.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The prince says a young battle-loving chief named Kakwi, grandson of Zahhak,
    has come with one hundred thousand horsemen and men of name, slaughtered Iranian
    warriors, and is allied with Salm from Gang-i-Dizhhukht.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The prince reports that Kakwi is said to be a warlike div, strong-handed and
    unafraid in battle.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Karan says he will devise a device to prevent anyone like Kakwi from coming
    again from Gang-i-Dizhhukht; the prince tells Karan to rest and says it is his
    own turn to fight.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Trumpets, pipes, tymbals, horsemen's dust, shouts, arrows, and blood mark
    the opening of battle.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kakwi raises a battle-shout and advances like a div, while Minuchihr advances
    with an Indian sword; both warriors cry out and frighten the armies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kakwi thrusts at the prince's girdle and rends his mail; the prince strikes
    Kakwi's cuirass, and the two fight until noon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: As day declines, the prince grips Kakwi's girdle, pulls him from his horse,
    throws him on the burning sand, and wounds his chest and bosom; Kakwi dies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After Kakwi's death, Salm flees toward his stronghold, reaches the sea, finds
    no vessel, and is pursued by the Iranian host and Minuchihr.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Minuchihr accuses Salm of murdering his brother for his crown and speaks of
    a royal Tree and of a tree Salm planted now bearing fruit.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Minuchihr overtakes Salm, cleaves him from the neck, and orders his head to
    be set on a spear.
  category: action
  evidence_refs:
  - ev:10
