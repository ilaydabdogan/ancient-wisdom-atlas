canonical_text:
  quote: from the monarch's shoulders / Grew two black snakes
  summary: Iblis disappears after receiving permission; two black snakes grow from
    the monarch's shoulders. Attempts to remove or cure them fail. Iblis returns disguised
    as a physician and advises feeding the snakes men's brains. Iran falls into strife,
    Jamshid is renounced, and disaffected nobles transfer allegiance to Zahhak, the
    dragon-visaged king. Zahhak takes the Iranian crown and throne. Jamshid flees,
    hides for a century, is captured by Zahhak near the sea of Chin, and is sawn asunder.
    The passage ends with reflections on the instability of worldly fortune.
  language: English
  quote_policy: quoted
