canonical_text:
  quote: ''
  summary: The passage first gives notes on early references to Rustam, including
    reported superhuman feats and an identification of the Mount Sipand castle with
    the White Castle. It then narrates mourning for Faridun, Minuchihr's accession,
    his royal oration on justice, divine service, and punishment of evildoers, followed
    by acclaim from nobles and Sam.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A quoted external account says Persian tales of Restomo/Rustam claimed he
    was stronger than 120 elephants and names Samson and Hercules in the discussion.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same account reports that Rustam could seize square stones, break or tear
    them apart, and engrave eagle figures with his nails.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The account reports Rustam throwing round stones at enemy ships offshore,
    causing waters to split, some ships to sink, and others to be driven away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Malcolm identifies the castle on Mount Sipand taken by Rustam with the White
    Castle in Pars, described as a high, steep, nearly inaccessible hill with verdure
    and springs on top.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The described stronghold had large stones wedged around the precipice; removing
    a smaller wedge would send a rock down the slope.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Faridun was mourned for seven days, and on the eighth day Minuchihr came forth
    and put the royal cap on his head.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Minuchihr countercharmed the spells of sorcerers and is said to have reigned
    for twice sixty years.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Upon assuming the crown, Minuchihr proclaimed justice, Faith, humanity, goodness,
    knowledge, and purity.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: In his oration Minuchihr claims broad royal power, speaking of earth as his
    thrall, heaven as his ally, Faith and Grace as his, and himself as the fire on
    Barzin, bearer of Kawa's standard, sword-wielder, generous feaster, and fiery
    rider.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Minuchihr also says he is a slave and servant of the Maker of the world, and
    that crown, throne, and host are held from God.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Minuchihr declares that those who depart from the Way and Faith, harm mendicants
    or kin, grow proud in wealth, or cause sorrow to sufferers are worse than Ahriman,
    banned by God and by him, and subject to his armed vengeance.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The men of name bless Minuchihr, say Faridun taught him the conduct of throne
    and crown, and pledge their hearts and souls to him.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Sam, chief of paladins, praises Minuchihr as a just judge and Shah of Iran
    by long descent, and prays for God to watch over his body and soul.
  category: speech
  evidence_refs:
  - ev:12
