canonical_text:
  quote: ''
  summary: After Salm's forces are scattered, they send an envoy to submit to Minuchihr.
    Minuchihr grants mercy, orders disarmament and brotherhood, then sends Salm's
    head and a victory report to Faridun. Minuchihr returns amid royal ceremony, is
    welcomed by Faridun, and Sam is summoned and charged to help the grandsire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Salm's troops are scattered and wander in groups amid wastes, caverns, and
    hills.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The scattered troops appoint a wary, wise, eloquent spokesman to tell Minuchihr
    that they are his subjects, fought under their king's command, and submit to his
    will.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Minuchihr answers that he casts away passions, identifies what is not God's
    with Ahriman and evil, and says both innocent and guilty are spared because God
    has given victory.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Minuchihr instructs the defeated forces to seek brotherhood, put off the implements
    of war, be wise and pure in Faith, and banish vengeance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A proclamation from Minuchihr's tent orders the paladins to shed no more needless
    blood because the tyrants' fortunes are overthrown.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The troops of Chin fall prostrate, bring their arms and war gear to Minuchihr,
    and pile horse-armour, helms, breastplates, maces, and Indian scimitars before
    him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Minuchihr gives Salm's head to a courier and sends Faridun a written report
    of the fighting and strategy, first praising God and then the Shah.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Minuchihr sends Shirwi back to the hold to examine the booty, act as he sees
    best, and take the spoil to the Shah on high-crested elephants.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Minuchihr marches inland from the hold in Chin back toward Faridun, while
    Faridun prepares a royal welcome with elephants, thrones, litters, banners, treasures,
    and armed hosts.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When Minuchihr approaches, Faridun goes on foot to welcome him; Minuchihr
    dismounts, kisses the ground, and blesses the monarch's throne, diadem, crown,
    and signet-ring; Faridun commands him to mount, kisses him, and grasps his hand.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Faridun sends for Sam son of Nariman, who had come from Hindustan to help
    fight against sorcerers and had brought gold, jewels, dinars, and other precious
    things.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Sam salutes both the old Shah and the young, is seated beside the monarch,
    and a royal speaker charges him to take the speaker's grandsire into his care
    and help him.
  category: speech
  evidence_refs:
  - ev:8
