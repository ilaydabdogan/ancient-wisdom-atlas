canonical_text:
  quote: |-
    Bear this plume of mine
    About with thee and so abide beneath
    The shadow of my Grace.
  summary: The bird who raised the youth tells him to leave the nest for kingship,
    gives him a plume to burn in danger, carries him from the mountain to his father,
    and returns mountainward. Sam praises the bird, recognizes the youth, names and
    equips him, and brings him home. Minuchihr hears of the case, summons Sam, sees
    Zal at court, and instructs Sam to safeguard him and teach him courtly and martial
    customs.
  language: English
  quote_policy: quoted
