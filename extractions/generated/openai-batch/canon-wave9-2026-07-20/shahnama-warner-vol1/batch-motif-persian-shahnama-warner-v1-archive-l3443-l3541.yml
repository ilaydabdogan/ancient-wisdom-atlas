canonical_text:
  quote: ''
  summary: The passage evaluates traditions about the compilation and sources of the
    Shahnama. It rejects or qualifies some later claims, discusses Abu Mansur, Ya'kub,
    learned Dihkans, Magi, Dakiki, Firdausi's difficulty in obtaining source materials,
    and the transmission of Iranian legend through Pahlavi, Arabic, and Persian authorities.
    It concludes that Firdausi's Shahnama is a true epic based on earlier tradition
    rather than an original invention.
