canonical_text:
  quote: ''
  summary: Faridun survives an attempted murder by his brothers, marches with Kawa
    and the Kawian standard to the Dijla, crosses the river after boats are refused,
    enters Zahhak's palace at Bait al Mukaddas, overthrows Zahhak's talisman and divs,
    takes the throne and crown, cleanses the sisters of Jamshid, and declares vengeance
    against Zahhak, who is described with dragon and serpent imagery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Faridun's two brothers try to kill him while he sleeps by loosening a mighty
    crag from a lofty cliff above him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The crashing crag wakes Faridun because God so ordered, and Faridun arrests
    it in mid-course by magic art.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kawa marches in front of Faridun with the Kawian standard, which is said to
    become the ensign of the realm.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Faridun asks the river-guard to send boats and vessels to carry him and all
    his army across the Dijla.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The river-guard refuses to launch boats without a passport under the Shah's
    own seal.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Faridun and his comrades plunge into the river on horseback and reach dry
    land.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Faridun sees Zahhak's tall palace, which is described as towering toward the
    stars and as the Dragon's dwelling.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Faridun grasps his massive mace, rides into the palace area, calls on the
    name of God, and the guards flee.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Faridun overthrows Zahhak's talisman because he sees that it is not of God,
    and he lays low the sorcerers and divs in the palace.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Faridun sits on the enchanter's throne and takes possession of the royal crown
    and palace, but does not find Zahhak.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Faridun brings two women from the women's bower, bathes them, and teaches
    them the way of God to purge the darkness of their minds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The two women are identified as the sisters of Jamshid and are described as
    sun-faced, dark-eyed, tearful, and formerly raised by idol-worshippers.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The sisters say they suffered under a dragon-shouldered Ahriman and an infatuated
    sorcerer, and they ask how Faridun dared enter the Lion's lair.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Faridun says Zahhak killed his father in Iran and also killed the cow Birmaya,
    his nurse, and he says he came for war and revenge with his ox-headed mace.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Arnawaz identifies Faridun and says he is fated to destroy Zahhak, abolish
