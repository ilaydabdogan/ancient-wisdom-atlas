canonical_text:
  quote: ''
  summary: 'Argument and editorial note for the reign of Minuchihr: the passage summarizes
    Zal’s white-haired birth, exposure on Mount Alburz, fosterage by the Simurgh,
    reconciliation with Sam, love for Rudaba, royal opposition and consent, and Rustam’s
    birth. The note adds comparative material on Minuchihr and Manu, Sam and Keresaspa,
    the dragon of the Kashaf, the Simurgh and other mythical birds, magical feathers,
    and anaesthetics in the birth of Rustam.'
  language: English
  quote_policy: summarized
