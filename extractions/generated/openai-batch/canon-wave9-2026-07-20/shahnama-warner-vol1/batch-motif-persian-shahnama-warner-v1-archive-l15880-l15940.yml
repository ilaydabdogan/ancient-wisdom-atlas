canonical_text:
  quote: ''
  summary: Astrologers tell the Shah that his royal Grace will fade and that he should
    prepare for death. He alters his court, confides in the archmages and chiefs,
    and gives Naudar extended counsel. He reflects on the transience of the throne,
    his service under Faridun's Grace, vengeance for Iraj, and his deeds as ruler.
    He transfers the throne, treasure, and crown to Naudar, warns of future danger
    from Pashang's offspring and Turan, and advises Naudar to seek aid from Zal, Sam,
    and a new Tree from Zal's root. He weeps, Naudar mourns, and the Shah dies peacefully.
  language: English
  quote_policy: summarized
