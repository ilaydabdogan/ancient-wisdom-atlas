canonical_text:
  quote: ''
  summary: The passage moves from praise and moral reflection on Faridun's long reign
    to Faranak's thanksgiving and largesse after learning of her son's enthronement.
    Leaders, sages, and nobles honor the Shah. Faridun surveys and reforms the world,
    then, after fifty years, commissions his counselor Jandal to seek three noble
    royal sisters as brides for his three unnamed sons; Jandal reaches Sarv, monarch
    of Yaman, and opens his embassy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Faridun is described as having banished grief and labour from men's minds
    and as not dedicating a day to evil during five centuries of rule, while the passage
    also states that the world did not remain his.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Faranak did not yet know that her child had become Shah or that Zahhak had
    lost the throne and his power.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After news of the youth's crowning reached her, Faranak bathed, prostrated
    herself before God, gave thanks, and cursed Zahhak.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Faranak aided people in poverty who hid their need, spent a week on alms until
    paupers failed, and spent another week feasting nobles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Faranak opened her hidden hoards, brought out treasure, loaded wealth on camels,
    and sent it to her son; the king accepted it and blessed his mother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Army leaders praised the Shah and wished him victory, while wise men and nobles
    came with gold, gems, and prayers for the crown, throne, diadem, and signet-ring.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Faridun journeyed around the world, examined its sights and mysteries, marked
    injustice and wasted lands, restrained evil hands through kindliness, adorned
    the world, and built a seat near Tammisha, later called Kus.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'After fifty years Faridun had three noble sons fit for the crown: two sons
    of Shahrinaz and the youngest born to Arnawaz; their father had not named them.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Faridun called Jandal and ordered him to go around the world to select three
    noble royal maidens, full sisters, unnamed by their father and very similar in
    appearance, to be matched with his sons.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Jandal left Iran, made inquiries, could not find suitable daughters among
    wealthy thanes, then reached Sarv of Yaman and found three maidens matching Faridun's
    requirements.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Jandal approached Sarv, kissed the ground, praised him, and Sarv asked whether
    Jandal came as ambassador or principal and what his message was.
  category: speech
  evidence_refs:
  - ev:10
