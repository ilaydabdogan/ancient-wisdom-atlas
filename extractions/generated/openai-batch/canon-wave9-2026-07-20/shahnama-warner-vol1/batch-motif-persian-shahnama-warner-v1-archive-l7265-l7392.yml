canonical_text:
  quote: ''
  summary: Kawa raises a smith's leathern apron on a spear as a rallying sign against
    Zahhak and leads supporters to Faridun. Faridun transforms the apron into the
    Kawian flag, prepares for war with the prayers of Faranak and the help of his
    brothers and smiths, receives a buffalo-headed mace, departs with an army under
    favorable omens, and is secretly instructed by Suriish in magic arts that reveal
    hidden things.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kawa mounts a smith's leathern apron on a spear and calls people to escape
    Zahhak's fetters by resorting to Faridun; his speech identifies the present ruler
    with Ahriman, God's foe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The apron distinguishes friends from enemies, and Kawa leads many valiant
    men in rebellion to Faridun.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Faridun notices the apron on the spear, treats it as an omen, decorates it
    with brocade, jewels, a full-moon token, and colored drapery, and names it the
    Kawian flag.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Later shahs add jewels, brocade, and painted silk to the smith's apron, and
    the standard is described as becoming like a sun in the gloom of night and cheering
    hearts.
  category: sequence
  evidence_refs:
  - ev:4
