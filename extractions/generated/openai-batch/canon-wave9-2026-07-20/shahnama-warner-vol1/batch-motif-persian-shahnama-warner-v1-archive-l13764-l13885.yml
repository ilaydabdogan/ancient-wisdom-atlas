canonical_text:
  quote: ''
  summary: A chieftain recounts defeating Karkwi in battle. The Shah celebrates, then
    orders Sam to attack Hindustan, Mihrab’s palace, and Kabul because Mihrab is said
    to descend from Zahhak. Sam obeys. Mihrab, Zal, Sindukht, and Rudaba hear the
    news; Zal leaves Kabul to confront the danger and is received by Sam’s host. Zal
    approaches his father, hears that Sam is displeased, and praises him tearfully.
  language: English
  quote_policy: summarized
