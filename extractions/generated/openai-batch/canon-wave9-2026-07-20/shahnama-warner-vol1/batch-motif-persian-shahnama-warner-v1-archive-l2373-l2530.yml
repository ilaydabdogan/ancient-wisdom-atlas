canonical_text:
  quote: ''
  summary: The first-person speaker says that a slanderer damaged his standing with
    the king. He claims to have labored for thirty years on the Book of Kings and
    Persian lore, expected royal recompense, and received only a meager payment. He
    attacks the Shah's honor, judgment, and lineage through a series of analogies
    about bad stock, vipers, foul fruit, scent, charcoal, night, and washing. He states
    that his verses are meant as advice to the Shah and as a warning not to wrong
    poets. He closes by imagining himself as a suppliant before God's court, praying
    for light for the faithful servant and Hell for the miscreant.
  language: English
