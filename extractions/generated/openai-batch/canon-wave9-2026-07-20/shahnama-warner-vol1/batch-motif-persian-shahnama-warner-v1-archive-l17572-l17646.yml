  quote: ''
  summary: The passage summarizes Garshasp's succession after Zav, Afrasiyab's renewed
    invasion, the Iranians' appeal to Zal, Rustam's promised assistance, Rustam's
    receipt of Sam's mace and acquisition of Rakhsh, and the mission to bring Kai
    Kubad from Mount Alburz to become Shah. Notes discuss Garshasp/Keresasp, later
    ecclesiastical military analogies, and visible divine Grace of kingship associated
    with Kai Kubad, Ardshir Papakan, and Yima. The verse opening recounts Garshasp's
    enthronement, Afrasiyab's war preparations, and Pashang's rejection of Afrasiyab
    after Ighriras' death.
