canonical_text:
  quote: ''
  summary: Gaiumart reigns over all the earth for thirty years in splendor and goodness;
    animals become tame and humans bow before his throne. His beloved son Siyamak
    is threatened by Ahriman's son, the Black Div. Surush warns Gaiumart, but Siyamak
    goes to battle in leopard-skin and is slain by the Div. Gaiumart and the created
    world mourn for a year. Surush, sent by God, commands Gaiumart to cease lamenting
    and seek vengeance. Gaiumart appoints his grandson Hushang to lead a host of fairies
    and beasts; Hushang kills and mutilates the Black Div. Gaiumart then dies and
    the world passes to his heir.
  language: English
  quote_policy: summarized
