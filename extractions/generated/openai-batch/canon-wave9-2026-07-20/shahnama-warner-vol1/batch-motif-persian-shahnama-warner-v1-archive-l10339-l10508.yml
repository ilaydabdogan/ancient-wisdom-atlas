  summary: The passage narrates preparations for battle, a proclamation promising
    divine protection and reward, Minuchihr’s victory, Tur and Salm’s planned night
    attack, Minuchihr’s counter-ambush, Tur’s pursuit and beheading, and Minuchihr’s
    letter of victory to Faridun praising the Worldlord and Faridun’s royal justice.
