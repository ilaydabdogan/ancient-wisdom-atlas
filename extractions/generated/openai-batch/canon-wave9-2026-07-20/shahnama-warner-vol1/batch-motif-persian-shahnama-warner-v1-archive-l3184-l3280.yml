canonical_text:
  quote: ''
  summary: 'The passage summarizes traditions about early Magian and Zoroastrian scriptures:
    their revelation to Zoroaster by Urmuzd, royal preservation and copying, destruction
    and translation under Alexander, later collection and canon formation by Iranian
    rulers and priests, and a legend of Zoroaster meeting Urmuzd on the Mountain of
    the Holy Questions before resisting demonic temptation. It also discusses Balkh,
    local cults, sacred fires, and later canonical revision.'
  language: English
  quote_policy: summarized
