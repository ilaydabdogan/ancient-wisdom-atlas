  summary: The passage discusses the Shahnama's treatment of fortune and destiny,
    the sky as arbiter of human affairs, Ahriman's envy of mankind created by Urmuzd,
    outer and inner struggles framed through Zoroastrian theology, legends of Zahhak
    and the sons of Faridun as explanations of intergroup conflict, and the mixed
    ancestry of major heroes through unions between antagonistic peoples.
  language: English
