canonical_text:
  quote: We call him Rakhsh.
  summary: Rustam searches among horses for a suitable mount. A remarkable piebald
    colt named Rakhsh is described, and an old herdsman warns that no one has mastered
    him and that his dam fiercely protects him. Rustam lassos Rakhsh, repels the dam,
    tests the colt, mounts him, and is told that Rakhsh's price is to redress Iran
    and right the world. Rustam saddles Rakhsh, and the horse is guarded with burned
    wild rue; Zal rejoices at the rider and new steed.
  language: English
  quote_policy: quoted
