  summary: The passage discusses Zend as more properly Median, its relation to ancient
    Persian and Sanskrit, and its role as a sacred language of the Magi. It describes
    the development of Pahlavi, the use of Pahlavi versions or comments for older
    scriptures, the formation of the Avasta and Zand/Zandavasta, and the preservation
    and diffusion of Magian traditions organized around demigods or heroes whose names
    are compared with names in the Vedas.
