canonical_text:
  quote: ''
  summary: Sam approves Zal's bride Rudaba, the marriage contract is made, the couple
    is enthroned and crowned, and festivities follow. Sam later gives Zal the realm
    and crown before departing. Rudaba then suffers a dangerous pregnancy; Zal summons
    the Simurgh by burning the bird's plume. The Simurgh foretells an extraordinary
    child and instructs Zal in an unnatural birth by incision, followed by healing
    with an herb, milk, musk, and the Simurgh's plume.
  language: English
  quote_policy: summarized
