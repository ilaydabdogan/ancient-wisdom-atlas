canonical_text:
  quote: ''
  summary: A richly decorated chamber is prepared for Rudaba. At dusk a damsel summons
    Zal, and Rudaba greets him from the roof. She lets down her hair like a lasso
    and invites him to climb it, but Zal uses a servant's lasso instead. The lovers
    meet in her pavilion, exchange embraces and vows before God despite expected opposition
    from the Shah and Sam, then part at dawn when Zal descends by lasso. After sunrise
    Zal calls sages and leaders for counsel.
  language: English
  quote_policy: summarized
