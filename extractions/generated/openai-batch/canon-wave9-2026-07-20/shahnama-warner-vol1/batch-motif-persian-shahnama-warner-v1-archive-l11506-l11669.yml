canonical_text:
  quote: ''
  summary: Sam hears report and receives dream-news that his castaway son may live.
    Wise men rebuke him for abandoning the white-haired child and urge penitence and
    search. After another rebuking dream at Mount Alburz, Sam finds an inaccessible
    mountain nest where the Simurgh has fostered the youth, called Dastan-i-Zand,
    and prays for aid. The Simurgh tells the youth that Sam is his father and that
    she will return him unharmed.
  language: English
  quote_policy: summarized
