canonical_text:
  quote: ''
  summary: An envoy delivers a remorseful but evasive message from Faridun's two sons,
    who blame fate and a Div and ask that Miniuchihr be sent to them. Faridun receives
    the envoy in royal state, hears the plea and offer of wealth for Iraj's blood,
    then rejects it and declares that Miniuchihr will come only armed, with leaders
    and the Kawian standard, to avenge Iraj.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The message describes two men as ill-disposed, lawless, ashamed before their
    father, repentant, and seeking an excuse for themselves.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:2
  text: The two men's reported speech says that fate and destiny brought the sequel
    and that even lions and dragons cannot escape destiny's net.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The two men's reported speech blames a foul Div for removing fear of the Worldlord
    from their hearts and taking possession of their brains.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two men ask the Shah to forgive them and to send Miniuchihr with a mighty
    army so that they may stand before him as slaves.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The two men say their tears and groans will be an offering and that their
    hoards and thrones will belong to Miniuchihr when he grows up.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The envoy arrives at Faridun's portal with treasures of all kinds on elephants.
  category: action
  evidence_refs:
