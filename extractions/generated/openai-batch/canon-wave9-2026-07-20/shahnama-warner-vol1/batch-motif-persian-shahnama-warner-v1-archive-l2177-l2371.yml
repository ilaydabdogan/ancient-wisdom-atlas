canonical_text:
  quote: ''
  summary: A satirical address to Sultan Mahmud rebukes him by invoking fear of God,
    just earlier kings, and devotion to the Prophet and Ali. The speaker identifies
    himself as Firdausi of Tus, disclaims Mahmud as patron, recounts the labor and
    subjects of his epic, and claims that poetry preserves the names of dead rulers
    and heroes like an imperishable palace.
  language: English
  quote_policy: summarized
