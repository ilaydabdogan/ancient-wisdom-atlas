canonical_text:
  quote: ''
  summary: Zal and the Iranian multitude mourn Naudar and vow vengeance. Iranian captives
    fear Afrasiyab and ask Ighriras for release. Ighriras arranges to withdraw and
    leave them to Zal’s side if Iranian warriors advance. Kishwad volunteers, reaches
    the captives, loosens their bonds, and brings them back. Zal rewards the messenger,
    welcomes the rescued captives, restores them with palaces and treasure, and mourns
    Naudar. In the next section, Afrasiyab rebukes Ighriras for not killing the captives;
    Ighriras answers that compassion and fear of God should restrain harm.
  language: English
  quote_policy: summarized
