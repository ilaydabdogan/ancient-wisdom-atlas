  summary: The passage quotes Firdausi naming helpers and material supporters, describing
    long labor and disappointed hopes, praising Sultan Mahmud, and presenting the
    book as Mahmud's memorial. The prose commentary then summarizes Firdausi's career,
    the lack of expected reward, court opposition, the possible but unproven connection
