canonical_text:
  quote: ''
  summary: Rudaba withdraws in distress after her father's words and prays with her
    mother. News of Zal and Rudaba's love reaches Shah Minuchihr, who consults archmages
    and fears a child from this union could revive Zahhak's line and threaten Iran.
    Minuchihr summons Sam through Naudar. Sam is welcomed, comes to court, is honored
    by the Shah, and recounts his campaign against the divs, Sagsars, and the Zahhak-linked
    warrior Karkwi.
  language: English
  quote_policy: summarized
