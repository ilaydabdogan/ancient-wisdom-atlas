canonical_text:
  quote: ''
  summary: The passage presents satirical couplets attributed to Firdausi and editorial
    commentary on the extant Satire and Nizami's later account. It describes accusations
    of Shi'ite heresy, Firdausi's grievance over Mahmud's inadequate reward for the
    Shahnama, his disposal of the payment, flight from royal anger, later refuge in
    Tabaristan, and the purchase and destruction of the Satire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The satirical couplets report that the speaker was mocked for love toward
    the Prophet and 'Ali, and they answer by insulting the Shah's origin and fitness
    to honor greatness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentary says the couplets show that one charge against the poet was
    Shi'ite heresy, which may have influenced Mahmud, and that the poet developed
    the taunt of a slave who became a Shah.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The extant Satire is described as saying that Firdausi of Tus spent thirty
    years on the Shahnama.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The extant Satire is described as saying that Mahmud promised a worthy reward
    but gave much less than expected, and that Firdausi publicly gave the whole amount
    to a street sherbet-seller for a drink.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The extant Satire is described as saying that Mahmud threatened to have Firdausi
    trampled to death by elephants and that Firdausi ended by cursing the Sultan.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nizami's later account describes Firdausi as a landed proprietor from Bazh
    near Tus, with one daughter, and says his labor on the Shahnama aimed to obtain
    funds for her dowry.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nizami's account says the completed work was transcribed by 'Ali Dilam, recited
    by Abu Dulaf, and later transcribed in seven volumes before Firdausi set out for
    Ghazni with Abu Dulaf.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Nizami's account says Ahmad Hasan Maimandi befriended Firdausi and that the
    poem was presented to Mahmud, who accepted it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nizami's account says enemies of the minister alleged that Firdausi was a
    heretic on the basis of verses in the Prelude, after which the poet received less
    than expected.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Nizami's account says Firdausi, after leaving the bath in chagrin, divided
    the payment between the bath-man and a sherbet-seller, then fled to Harat and
    hid for six months while Mahmud's messengers failed to find him at Tus.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nizami's account says Firdausi later went to Tabaristan, where the ruler treated
    him kindly; there he wrote and read his Satire against Mahmud and offered to dedicate
    the Shahnama to that ruler instead.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Nizami's account says the chief of Tabaristan, being Mahmud's vassal, persuaded
