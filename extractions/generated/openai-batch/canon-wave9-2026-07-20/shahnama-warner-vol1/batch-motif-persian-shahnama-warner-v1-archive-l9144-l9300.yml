  quote: ''
  summary: After an envoy departs, the Shah warns Iraj that his brothers are intent
    on war. Iraj rejects revenge and the crown, proposes to approach his brothers
    peacefully, and is sent with a conciliatory letter. Salm and Tur meet him with
    hidden hostility, while the troops recognize Iraj as worthy of the throne and
    crown.
