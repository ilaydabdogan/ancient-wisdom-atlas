canonical_text:
  quote: ''
  summary: Zal reproaches Sam for exposing him as a child on the mountains and for
    threatening Kabul, while acknowledging that the Maker provided for him. Sam admits
    the wrong, promises to petition the Shah, and sends Zal with a letter. The letter
    praises God and the Shah, then recounts Sam's age, martial deeds, and his combat
    against the destructive dragon of Kashaf.
  language: English
  quote_policy: summarized
