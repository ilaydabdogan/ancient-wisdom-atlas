  summary: A reflection on mortality and Time as a mower precedes the account of Zal
    answering riddles, receiving Minuchihr's approval, and demonstrating exceptional
    martial skill. Minuchihr rewards Zal with royal honors and writes favorably to
    Sam. Zal sends word that he is returning with gifts, and Sam joyfully prepares
    to inform Mihrab.
