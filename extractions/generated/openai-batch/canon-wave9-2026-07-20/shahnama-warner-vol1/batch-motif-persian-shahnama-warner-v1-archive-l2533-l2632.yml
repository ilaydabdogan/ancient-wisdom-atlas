canonical_text:
  quote: ''
  summary: 'The passage summarizes later traditions about Firdausi: his composition
    of Yusuf and Zulikha, travel away from Mahmud''s reach, return to Tus, Mahmud''s
    belated repentance and posthumous gift, the poet''s burial outside the Muslim
    cemetery, his daughter''s refusal of the gift, and the later memory of his tomb.
    It also comments on Firdausi''s late judgment of the Shahnama, quotes his claim
    to live through the seed of words, and describes the Shahnama''s scale, meter,
    authorship, and Persian language.'
  language: English
  quote_policy: summarized
