canonical_text:
  quote: ''
  summary: The passage presents Hushang as a divinely sanctioned ruler who civilizes
    the world through justice, mining, smithing, irrigation, agriculture, fire discovery,
    animal domestication, clothing from skins, and the foundation of the Feast of
    Sada. It also recounts his encounter on a mountain with a threatening worm-like
    creature, during which a thrown stone strikes another stone and reveals fire.
    The passage ends with Hushang’s death and succession by his heir.
  language: English
  quote_policy: summarized
