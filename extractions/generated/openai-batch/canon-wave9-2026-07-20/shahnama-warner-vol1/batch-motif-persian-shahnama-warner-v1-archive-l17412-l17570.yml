canonical_text:
  quote: ''
  summary: After Naudar's death, Zal argues that Iran needs a rightful Shah of royal
    race, prudence, wisdom, and divine Grace. Tus and Gustaham are passed over, and
    Zav son of Tahmasp, descended from Faridun, is acclaimed and enthroned. During
    his reign the armies suffer drought and famine while war with Afrasiyab continues;
    an envoy proposes peace, the feud is dropped, and territory is divided. Thunder
    and fertility return, Zal thanks God, and after a brief just reign Zav dies in
    old age.
  language: English
  quote_policy: summarized
