  quote: '"Now take me to the other world"'
  summary: Faridun gives thanks to God, asks to be taken to the other world, distributes
    spoils, crowns Mimichihr/Minuchihr, mourns the slain three kings, dies, and receives
    funerary rites. The passage closes with communal mourning and a moral reflection
    on the world's impermanence.
  language: English
