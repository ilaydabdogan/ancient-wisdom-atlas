  quote: ''
  summary: Faridun rejects a plea for forgiveness and gifts sent by his sons, refuses
    to exchange vengeance for wealth, invokes divine recompense for bloodshed, and
    says Minuchihr will avenge his slain sire. The messenger returns in fear to Salm
    and Tur, then reports on Faridun’s magnificent court, Minuchihr’s position beside
    him, named officials and warriors, and the army’s intent for revenge and war.
  language: English
