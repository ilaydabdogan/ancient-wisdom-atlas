canonical_text:
  quote: ''
  summary: The passage narrates successive battles between Naudar's Iranian forces
    and Afrasiyab. After defeat, Naudar recalls a dying father's warning, sends Tus
    and Gustaham to move the women-folk from Pars toward Alburz, and speaks of the
    possible survival of Faridun's line. In a later battle Shapur is slain, Naudar
    and Karan retreat to Dahistan, and Afrasiyab sends Kunikhan toward Pars, prompting
    Karan to urge pursuit to protect the warriors' women.
  language: English
  quote_policy: summarized
