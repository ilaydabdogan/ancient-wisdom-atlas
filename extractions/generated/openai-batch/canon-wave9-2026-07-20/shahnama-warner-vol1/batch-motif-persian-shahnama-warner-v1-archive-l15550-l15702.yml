canonical_text:
  quote: ''
  summary: Rustam angrily kills an unnamed speaker, breaks out through barred gates,
    confronts a bellowing elephant that has frightened his nobles, and kills it with
    a mace-blow. Zal hears of the deed, praises Rustam, and commands him to avenge
    Nariman by taking Mount Sipand, a high, abundant, nearly inaccessible stronghold.
    Zal instructs Rustam to enter by artifice as a camel-driver carrying salt, which
    the castle lacks. Rustam hides his mace and other arms in salt loads, arrives
    with companions as a caravan, is reported by the watchman, and gains entry after
    the chieftain learns that the packs contain salt. Rustam offers salt and respectful
    words to the chieftain.
  language: English
  quote_policy: summarized
