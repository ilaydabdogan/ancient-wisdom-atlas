canonical_text:
  quote: ''
  summary: Iranian chiefs leave Naudar's court and resolve to go to Pars to protect
    their families. Karan reaches White Castle, finds Guzhdaham besieged by Barman,
    and kills Barman in battle. Naudar follows but is captured by Afrasiyab with many
    nobles. Afrasiyab orders a search for Karan and then sends Wisa to avenge Barman.
    Wisa finds his slain son, grieves, pursues Karan, and taunts him that throne,
    crown, and refuge are gone because the Shah is taken.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Naudar and the chiefs sit with wine; Naudar retires behind curtains meditating
    vengeance, and the Iranian cavaliers depart to Karan's quarters.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chiefs agree to set out for Pars because they fear their wives and children
    will be captured and enslaved without resistance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shidush, Kishwad, and Karan take counsel during the night and reach White
    Castle at dawn.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At White Castle, Guzhdaham the castellan and his warriors are besieged by
    Barman, who holds the road with troops, elephants, and chiefs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Karan arms himself, confronts Barman, invokes God for aid, pierces Barman
    with a javelin, and Barman's soldiers flee.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Naudar follows after Karan; Afrasiyab learns of it, engages him in a long
    fight, captures the Shah with twelve hundred nobles, and puts the captured host
    in bonds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator reflects that the sky's revolutions give throne, crown, majesty,
    despair, and misery, and that even the highest head ends in dust.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: Afrasiyab orders caves, hills, waters, and waste searched for Karan; after
    learning that Karan has gone to save the women and that Barman has been killed,
    he sends Wisa for vengeance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Wisa finds his son slain, with torn banner, overturned kettledrums, bloodied
    body, and dead Turanian warriors nearby; he grieves and pursues Karan.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Karan sends Arab horsemen toward Nimruz, then reaches the waste; a dust-cloud
    and sable flag appear, both armies array themselves, and Wisa taunts Karan that
    crown, throne, and refuge are gone because the Shah is taken.
  category: sequence
  evidence_refs:
  - ev:9
