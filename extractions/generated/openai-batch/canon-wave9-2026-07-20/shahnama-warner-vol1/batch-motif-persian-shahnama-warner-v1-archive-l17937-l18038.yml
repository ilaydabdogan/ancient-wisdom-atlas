canonical_text:
  quote: ''
  summary: The passage opens with Garshasp distributing treasure and making a loud
    display from an elephant. Zal leads the Zabul host against Afrasiyab. He tells
    the veterans that the army lacks a Shah and identifies Kai Kubad, of Faridun's
    line, as the needed royal claimant. Zal sends Rustam to Mount Alburz to summon
    Kai Kubad. Rustam departs on Rakhsh, defeats a Turkman outpost with his mace,
    and the routed Turkmans report to Afrasiyab, who calls Kulun.
  language: English
  quote_policy: summarized
