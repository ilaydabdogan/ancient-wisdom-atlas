canonical_text:
  quote: ''
  summary: Sindukht negotiates with Sam over Zal and Rudaba, gaining assurance, gifts,
    and a renewed oath. Zal brings Sam's letter to Shah Minuchihr, who receives him
    favorably, reads the letter, promises to consider and carry out Zal's wish, and
    then summons religious and learned advisers to read the stars. After three days,
    they predict that a long-lived, peerless hero will arise from Sam's son and Mihrab's
    daughter, and the Shah orders secrecy.
  language: English
  quote_policy: summarized
