  - ev:8
  confidence: medium
  limitations: 'The note also records differences: Jamshid''s kinship with Tahmuras
    differs in older legends, and Spityura''s role in Yima''s death is not in the
    Shahnama.'
- id: claim:2
  claim: The passage cautiously links the Vedic Manu-Yama-Vivasvat material with the
    Iranian Yima/Jamshid material as a nearby comparative tradition on 'common ground.'
