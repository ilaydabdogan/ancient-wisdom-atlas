    belonging to a shared motif complex involving a culture-hero or ruler, divine
    covenant, flood preparation, golden-age abundance, falsehood, and loss of Glory.
  claim_level: same_motif
  target: Zandavasta Yima tradition
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:10
  counter_evidence_refs:
