canonical_text:
  quote: ''
  summary: The passage gives the argument for Jamshid's reign and an editorial note
    comparing Jamshid with older Iranian and Vedic traditions. It presents Jamshid
    as a civilizing Shah whose reign becomes a deathless golden age, then describes
    his pride, loss of divine Grace, and death through Zahhak. The note connects Jamshid/Yima
    with Vedic Manu and Yama, the Avestan Yima, the flood-preparatory Vara, divine
    covenant, loss of Glory, and sibling conflict traditions.
  language: English
  quote_policy: summarized
