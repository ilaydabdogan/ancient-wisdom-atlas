  evidence_refs:
  - ev:1
- id: obs:2
  text: Jamshid continues the work of predecessors, adds his own innovations, introduces
    refinements and luxuries, divides mankind into four classes, travels the world,
    crosses the sea in ships, and gains dominion of the air.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During Jamshid's successful reign, Ahriman is powerless for ill, disease and
