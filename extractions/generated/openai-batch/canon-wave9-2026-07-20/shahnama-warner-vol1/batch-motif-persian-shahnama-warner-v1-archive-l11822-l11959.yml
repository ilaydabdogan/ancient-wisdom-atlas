canonical_text:
  quote: ''
  summary: Sam tells the Shah how Zal was abandoned, fostered by the Simurgh on Mount
    Alburz, and restored to him after prayer. The Shah orders astrologers and learned
    men to cast Zal's horoscope; they predict that he will become a famous paladin.
    The Shah gives Sam rich gifts and a formal patent of rule, and Sam departs toward
    Zabulistan.
