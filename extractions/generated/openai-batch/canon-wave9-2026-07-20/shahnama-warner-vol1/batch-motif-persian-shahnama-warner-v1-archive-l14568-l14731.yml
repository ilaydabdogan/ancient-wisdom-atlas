canonical_text:
  quote: ''
  summary: The Shah has Zal examined by archmages through riddles about trees, steeds,
    riders, a meadow and scythe-bearer, a bird between two trees, and a city on a
    mountain. Zal answers by interpreting most of the riddles as calendrical, astronomical,
    worldly, and posthumous moral images.
  language: English
  quote_policy: summarized
