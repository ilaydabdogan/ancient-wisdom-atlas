  quote: ''
  summary: 'A translators'' introductory note explains a change of base text, editorial
    policies for rendering Persian imagery and grammar, and several culturally specific
    terms: Bāj/Zamzam, Barsam, Dakhma, and Dihkān.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The translators state that when the text of V failed, they fell back on the
    text of C and deferred remarks on that change.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The translators intend the Introduction and prefixed notes to help readers
    unfamiliar with the Shahnama while avoiding footnotes to the translation where
    possible.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The translators prefer retaining figurative images such as a Shah dropping
    a ball into a cup or bestowing kettledrums rather than replacing them with explanatory
    paraphrase.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A note describes the cup as attached to the side of the elephant ridden by
    the Shah or commander-in-chief, with both cup and ball made of bell-metal.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The translators say Persian grammar often uses one form for he, she, and it,
    so they sometimes substitute nouns for pronouns and add connecting particles not
    present in the original.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bāj and Zamzam are described as a Zoroastrian practice of muttering the beginning
    of a sacred formula, remaining silent during an operation such as eating or washing,
    and then uttering the rest aloud.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The same practice is said sometimes to serve as a pretext for a few moments
    of private conversation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Barsam is described as formerly a bundle of twigs and now metal wires of varying
    number, held during certain Zoroastrian religious rites.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The translators render Barsam as sacred twigs and state that the practice
    is referred to in Ezekiel viii.16-17.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Dakhma is said to be used by Firdausi not in the proper contemporary Parsi
    sense but as mausoleum, charnel, or charnel-house.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Dihkān is defined primarily as countryman; because rural people preserved
    local traditions and folklore, the word also came to mean bard or minstrel.
  category: relationship
  evidence_refs:
  - ev:9
