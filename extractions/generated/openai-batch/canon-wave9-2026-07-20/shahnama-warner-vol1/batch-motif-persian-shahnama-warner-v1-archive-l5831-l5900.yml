canonical_text:
  quote: ''
  summary: The passage introduces Tahmuras, son of Hushang, as a ruler and culture-hero
    who continues his father’s work. It summarizes traditions about his conquest or
    binding of Ahriman and the divs, including a condition by which the divs teach
    writing. In the narrative, Tahmuras ascends the throne, announces his rule, invents
    spinning, clothing, and draperies, domesticates or trains animals and birds, and
    directs people to praise the Creator who made the world and gave humans rule over
    beasts.
  language: English
  quote_policy: summarized
