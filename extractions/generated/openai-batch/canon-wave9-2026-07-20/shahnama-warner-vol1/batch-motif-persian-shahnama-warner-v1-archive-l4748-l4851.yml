canonical_text:
  quote: ''
  summary: 'The passage states that God cannot be fully praised or comprehended and
    that human duty is service and obedience. It then praises wisdom as God’s best
    gift, a comforter, guide, mind’s eye, and first-created thing, urging the addressee
    to learn from sages. It closes by describing the making of the world from nothing
    through four primal elements: fire, air, water, and earth.'
