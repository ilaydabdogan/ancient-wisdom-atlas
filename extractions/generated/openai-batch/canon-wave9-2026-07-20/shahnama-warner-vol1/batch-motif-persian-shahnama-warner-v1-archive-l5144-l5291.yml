canonical_text:
  quote: ''
  summary: 'The passage recounts the transmission and versification of the royal tales:
    an earlier book is founded from learned lore, Dakiki begins to versify the tales
    but dies before completing them, the narrator seeks and obtains an ancient Persian
    book through a close friend, receives support from Abu Mansur son of Muhammad,
    mourns that patron''s death, and begins the work under advice to dedicate the
    Tale of Kings to a great king.'
  language: English
  quote_policy: summarized
