  summary: The passage describes a long prosperous period under Jamshid in which humans
    do not experience death or illness, divs serve them, royal Grace shines from the
    Shah, and revelations come from God. Jamshid then becomes proud, summons the chiefs,
    claims that the world and its benefits come from him, says that disease and death
    have been stayed through leechcraft, labels those who do not adore him as Ahrimans,
    and demands to be hailed as Maker of the world.
