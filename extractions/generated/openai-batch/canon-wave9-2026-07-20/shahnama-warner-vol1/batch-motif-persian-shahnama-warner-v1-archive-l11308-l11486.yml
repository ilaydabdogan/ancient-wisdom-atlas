canonical_text:
  quote: ''
  summary: The passage closes a courtly exchange in which Sam is praised and rewarded,
    then introduces the birth of Zal. Sam, previously childless, has a son by a moon-faced
    wife. The infant is beautiful but has white hair. The household conceals this
    from Sam for a week until the nurse tells him. Sam sees the child, fears shame,
    interprets the white-haired infant as ill-omened, and orders him taken far away.
    The child is abandoned on Mount Alburz, where the Simurgh nests. The narrator
    contrasts animal tenderness with human cruelty. The exposed infant cries without
    milk until the mother Simurgh sees him; though her young are hungry, divine prompting
    gives her loving instincts, and she does not devour him.
  language: English
  quote_policy: summarized
