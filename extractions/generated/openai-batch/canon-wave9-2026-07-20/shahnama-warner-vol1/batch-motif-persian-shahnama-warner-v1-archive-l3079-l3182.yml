canonical_text:
  quote: ''
  summary: 'The passage discusses the rise, challenges, and survival of Zoroastrian
    religion in Persian history: Darius is described as restoring temples, worshipping
    Urmuzd, and adopting the Zoroastrian calendar; the Magophonia is interpreted as
    a commemoration of Gaumata''s overthrow rather than a general attack on the Magi;
    Alexander is placed by Zoroastrian tradition among major enemies of the faith;
    Greek and Parthian influence are said to have endangered Magian religion; the
    Magi are described as preserving doctrine, ritual, sacred tradition, language,
    and kin-marriage practice; and Shiz, Rai, and Balkh are named as principal Magian
    centers, including a sacred fire-temple and traditions of Zoroaster''s missionary
    success and death.'
  language: English
  quote_policy: summarized
