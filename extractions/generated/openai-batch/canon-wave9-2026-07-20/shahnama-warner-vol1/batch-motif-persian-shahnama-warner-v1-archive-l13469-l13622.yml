canonical_text:
  quote: ''
  summary: Sindukht speaks to Mihrab in anxious, parabolic terms about the transience
    of wealth and status, then reveals Rudaba's attachment to Zal, the son of Sam.
    Mihrab reacts violently and fears political ruin from Sam and Minuchihr, but Sindukht
    mediates, cites Sam's answer and an older royal precedent, and obtains a promise
    that Rudaba will be spared. Rudaba refuses to conceal her adornment or love for
    Zal and appears before her father, who condemns the match with images of Ahriman,
    a fairy-bride, and a serpent-charmer turned Magian.
  language: English
  quote_policy: summarized
literal_observations:
