  text: Sindukht says she has been reflecting on treasures, wealth, horses, palace,
    grounds, friends, servants, favor, stature, fame, knowledge, and policy, and says
    that pride and glory must eventually abate.
  category: speech
  evidence_refs:
  - ev:1
