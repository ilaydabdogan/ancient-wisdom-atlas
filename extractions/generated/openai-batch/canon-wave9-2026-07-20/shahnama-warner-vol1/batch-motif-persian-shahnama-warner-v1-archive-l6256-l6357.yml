canonical_text:
  quote: ''
  summary: 'The passage first describes Jamshid after an act of impious self-elevation:
    divine Grace leaves him, his court empties, the state is overturned, and he cannot
    regain Grace despite penitence. It then introduces Mardas, a virtuous Bedouin
    king and father of Zahhak/Biwarasp. Zahhak is wealthy in horses and often rides.
    Iblis approaches Zahhak as a friend, secures an oath of secrecy and obedience,
    urges him to seize his father''s court and goods, and finally obtains Zahhak''s
    consent while promising to scheme in silence.'
  language: English
  quote_policy: summarized
