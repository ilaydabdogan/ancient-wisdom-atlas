canonical_text:
  quote: ''
  summary: 'Mimichihr recounts defeating and beheading Tur as vengeance for Iraj,
    sends Tur''s head to Faridun, and receives a prayer of blessing. The passage then
    turns to Salm''s expected retreat to the sea-fortress of the Alans. Mimichihr
    entrusts Karan with a secret stratagem: Karan takes Tur''s signet-ring and royal
    standard, approaches by night, enters the castle disguised as Tur''s envoy, and
    deceives the castellan into opening the gates. The poet and the castellan''s later
    speech moralize about hidden intentions, strangers'' honeyed words, and the danger
    of neglecting ambushes in war.'
  language: English
  quote_policy: summarized
