canonical_text:
  quote: ''
  summary: 'The argument summarizes Faridun''s royal settlement: marriages for his
    three sons, a threefold division of the earth, the murder of the youngest by the
    envious elder sons, and later vengeance and succession by Miniichihr. The accompanying
    note compares Vedic and Zandavasta figures connected with healing, Haoma offerings,
    dragon or giant slaying, and Keresaspa''s fall, judgment, and monster-slaying
    defense.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Faridun, after being firmly established on the throne, marries his three sons
    to the three daughters of Sarv, king of Yaman, and divides the earth into three
    parts for his sons.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two elder sons become envious of the youngest, murder him, and are later
    slain by Miniichihr, the grandson of the murdered brother, who succeeds after
    Faridun's death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The note says the Vedas contain Trita Aptya, a semi-divine figure gifted with
    healing by the gods, and Traitana, a hero recorded as slaying a giant.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The note says Trita and Traitana became confused in the Vedas, with exploits
    attributed to each other, including Trita struggling with a storm-fiend for the
    waters and Traitana receiving healing power.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'In the Zandavasta, the note says Trita Aptya and Traitana become three figures:
    Thrita, Athwya, and Thraetaona; Thrita and Athwya are associated with Haoma offerings
    rewarded by sons.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Thraetaona is described as both hero and physician, a smiter of the dragon
    Dahaka and a healer invoked against sickness.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Keresaspa is described with titles including holy, Sama, club-bearer with
    plaited hair, manly-hearted, and especially strong and courageous.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Keresaspa falls victim to Pairika Knathaiti, neglects fire worship, becomes
    an idolater, is cast into hell, and is later summoned by Urmuzd after Zoroaster
    commends him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Keresaspa pleads for release by citing good works, including slaying the serpent
    Srovbar, which swallowed horses and men, after running on its back and striking
    it with a club.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Keresaspa also says he slew Gandarep, who devoured twelve districts; dead
    men are described as sticking among Gandarep's teeth.
  category: action
  evidence_refs:
  - ev:8
