canonical_text:
  quote: ''
  summary: Pashang, impressed by Afrasiyab's martial stature, commands him to lead
    an army against Iran. Ighriras counsels restraint, citing Iranian champions and
    the danger of reckless war, but Pashang insists on ancestral revenge and gives
    seasonal instructions for the campaign. Afrasiyab vows bloodshed, marches into
    Iran with a vast host, sends a detachment toward Zabul because Sam is dead and
    Zal is occupied with obsequies, and writes to Pashang that the moment is favorable.
    The Iranian king Naudar and Karan move toward Dahistan. The armies camp near one
    another, and the Turkman Barman scouts the Iranian camp and requests permission
    to engage.
  language: English
  quote_policy: summarized
