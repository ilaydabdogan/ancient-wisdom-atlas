  summary: The passage exhorts the reader to emulate Faridiin in justice and beneficence.
    It recounts Faridiin cleansing the world from iniquity, binding Zahhak, avenging
    Abtin, gaining universal recognition of his rule, and removing the power of miscreants.
    It then laments the malign world, asks where Faridiin is now, states that he reigned
    five hundred years before departing and leaving an empty throne, and concludes
    that the same end comes to all, great or small.
