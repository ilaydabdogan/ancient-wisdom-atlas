canonical_text:
  quote: ''
  summary: Zirak foretells that a future youth, Faridun, will overthrow Zahhak in
    revenge for Zahhak killing his father and the cow Birmaya. Faridun is born with
    royal Grace while Zahhak searches for him. Zahhak has Abtin killed. Faranak hides
    the infant with a guardian who feeds him Birmaya's milk for three years, then
    carries him to Alburz and entrusts him to a devotee. Zahhak kills Birmaya and
    burns Faridun's palace. At sixteen, Faridun asks Faranak about his origin, and
    she recounts Abtin's royal lineage, Zahhak's persecution, the snakes on Zahhak's
    shoulders, and the discovery of Birmaya.
  language: English
  quote_policy: summarized
