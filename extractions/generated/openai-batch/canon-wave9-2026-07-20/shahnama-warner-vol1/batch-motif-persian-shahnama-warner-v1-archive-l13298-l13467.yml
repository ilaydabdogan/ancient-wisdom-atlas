canonical_text:
  quote: ''
  summary: Zal sends a woman as go-between to Rudaba with news of Sam's consent. Rudaba
    rewards the messenger and sends costly tokens back to Zal. Sindukht discovers
    the hidden exchange, punishes the messenger, interrogates Rudaba, hears her confession
    of love and plighted troth with Zal, and worries that the Shah will oppose the
    match for dynastic and political reasons.
  language: English
  quote_policy: summarized
