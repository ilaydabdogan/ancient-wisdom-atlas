canonical_text:
  quote: ''
  summary: In this passage Iblis, described also as a wicked Div or Ahriman, arranges
    Mardas's death by a concealed pit. Zahhak, Mardas's son, seizes the Arab throne.
    Iblis then renews his hold over Zahhak by demanding a pledge, enters his service
    disguised as a skilled cook, introduces animal foods and blood to the royal diet,
    and asks as reward to kiss Zahhak's shoulders, which Zahhak permits.
