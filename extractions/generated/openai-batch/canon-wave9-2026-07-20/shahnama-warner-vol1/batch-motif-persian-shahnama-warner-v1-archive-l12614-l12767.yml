canonical_text:
  quote: ''
  summary: A group of slave-girls and damsels praise Rudaba to Zal and praise Zal
    to Rudaba, carrying messages between them. Zal asks how he may approach Rudaba.
    The women propose persuading her and imagine Zal using a lasso to reach the palace.
    After returning with roses, they are rebuked by the porter, who warns them not
    to leave the Haram while Zal and his troops are in Kabul. In private they tell
    Rudaba of Zal, display jewels and dinars, and praise his royal grace despite his
    white hair. Rudaba sends a favorable dawn message to Zal, and the maid reports
    back that the desired meeting is granted while Rudaba prepares secretly.
  language: English
  quote_policy: summarized
