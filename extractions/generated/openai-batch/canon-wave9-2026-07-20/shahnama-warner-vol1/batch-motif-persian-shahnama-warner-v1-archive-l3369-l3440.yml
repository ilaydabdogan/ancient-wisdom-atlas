  summary: The passage explains how Zandavasta mythic figures came to be treated as
    ancient Iranian kings, how Dihkans and rural reciters preserved and developed
    epic traditions, and how these materials were collected, translated, transmitted,
    and eventually versified through a succession of patrons, compilers, translators,
    and poets before Firdausi completed the work under Mahmud's encouragement.
  language: English
