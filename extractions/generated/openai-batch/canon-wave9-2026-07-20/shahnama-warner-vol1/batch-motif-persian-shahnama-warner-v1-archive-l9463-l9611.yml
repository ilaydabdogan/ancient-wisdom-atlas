canonical_text:
  quote: ''
  summary: Faridun and his people prepare to welcome Iraj, but a grief-stricken rider
    arrives with a golden casket containing Iraj's severed head. Faridun and the troops
    mourn publicly, proceed to Iraj's garden, and Faridun destroys the prince's dwelling
    and plantings in grief. He prays to the Righteous Judge for punishment of the
    killers and for a descendant of Iraj who will avenge the murder, then remains
    in prolonged mourning.
  language: English
  quote_policy: summarized
