- id: obs:2
  text: Faridun, the troops, and the people prepare to welcome the prince with a turquoise
    throne, jewels for the crown, wine, song, minstrelsy, drums, elephants, and decorations.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A dromedary-rider in grief appears from a cloud of dust, crying bitterly and
    carrying a golden casket containing the prince's head wrapped in painted silk.
  category: action
  evidence_refs:
  - ev:3
