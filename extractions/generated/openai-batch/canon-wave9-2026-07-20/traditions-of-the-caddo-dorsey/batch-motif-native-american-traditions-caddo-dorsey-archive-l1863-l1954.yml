canonical_text:
  quote: ''
  summary: 'In the closing episode of “Splinter Foot Boy,” Medicine-Screech-Owl uses
    breath to put dogs, an old woman, and a boy to sleep, steals the boy’s shells,
    and is later found inside a circle of fire wearing them. The shells are returned
    only after the boy promises not to bewitch people. In the opening of “Medicine-Screech-Owl,”
    a child born to old parents names himself Medicine-Screech-Owl, provoking an ex-chief
    of the same name. The ex-chief sets impossible or dangerous tasks: growing a watermelon
    overnight, milking a bull, and sitting over a concealed pit.'
  language: English
  quote_policy: summarized
