canonical_text:
  quote: ''
  summary: The passage contains two Caddo etiological animal stories. In the first,
    Running-Water tries to train a dog not to tell everything, but the dog repeatedly
    runs home and boasts about hunting results. After the dog again tells stories,
    Running-Water pulls its tongue and stretches its mouth, explaining why dogs have
    long tongues and big mouths. In the second, Chicken-Hawk pretends to be a great
    hunter, relies on Eagle to kill an antelope, lies to his family about it, and
    later cuts meat from his own legs from shame when he cannot provide game for a
    visiting friend, explaining why hawks have thin legs.
  language: English
  quote_policy: summarized
