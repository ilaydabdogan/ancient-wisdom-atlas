canonical_text:
  quote: ''
  summary: 'English abstracts of Caddo Coyote tales: Coyote loses deer meat to Wild-Cat
    and drowns while trying to reach its reflection; Coyote deceives geese but is
    trapped in a hollow tree and then betrays Woodpeckers who free him; Rabbit and
    Coyote kill a buffalo from inside its body, after which Coyote is killed; Mountain-Lion
    avenges her young with Rabbit''s help; Buffalo grants Coyote limited buffalo-shapeshifting
    power; Coyote traps Turkeys in a sack but his son releases them and is eaten.
    The range ends with the next title only, about Coyote''s eyes and buckeyes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote kills a large deer, hides the meat in a tree while going for her children,
    and Wild-Cat takes the meat to a tree on a river bank.
  category: sequence
  evidence_refs:
