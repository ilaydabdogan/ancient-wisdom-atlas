- id: obs:2
  text: Coyote mistakes the meat's reflection in the water for the meat itself, dives
    for it, ties stones to her neck, dives again, and drowns; Wild-Cat later feeds
    and raises the little Coyotes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Coyote pretends to be injured and asks Geese to carry him across the water,
    but the Geese know he is lying and drop him into a hollow tree trunk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Coyote asks Fly for help, Woodpeckers peck a hole in the tree, and Coyote
    bites off their heads and eats them before escaping.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rabbit leads Coyote to a buffalo; they enter the animal and eat its side until
