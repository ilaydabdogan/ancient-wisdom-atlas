    to bed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the morning Snow-and-Cold thinks Medicine-Screech-Owl may have frozen,
    but the boy gets up, says he slept well, and returns home because of his mother.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: An old man and his wife have a beautiful, modest, well-beloved daughter who
