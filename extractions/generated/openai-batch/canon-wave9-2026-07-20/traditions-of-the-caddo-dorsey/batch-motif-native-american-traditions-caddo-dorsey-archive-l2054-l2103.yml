canonical_text:
  quote: ''
  summary: The passage first describes Snow-and-Cold producing fire from snow with
    a cane while Medicine-Screech-Owl secretly watches and then repeats the action.
    It then begins a Medicine-Screech-Owl narrative in which a modest girl becomes
    pregnant without knowing how, hears the unborn child call her mother and direct
    her to potatoes, and gives birth to a child who asks to be named Medicine-Screech-Owl;
    mother and child are poor and live apart.
  language: English
