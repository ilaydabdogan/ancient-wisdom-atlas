canonical_text:
  quote: ''
  summary: An orphaned boy is raised by his grandfather until the grandfather dies,
    leaving the boy alone. He begs, is teased by village boys, and later makes his
    own bow and arrows and hunts small game. While hunting far in the timber, he hears
    a voice and meets a strange boy. They play and wrestle; the orphan easily throws
    the stranger. The stranger says he has given the orphan his power and that the
    boy can now throw anyone. The stranger disappears. The orphan later kills three
    deer, rests again after dark, hears a voice, and sees the same stranger again.
  language: English
  quote_policy: summarized
