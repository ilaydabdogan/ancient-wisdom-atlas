canonical_text:
  quote: ''
  summary: The passage recounts war with the Chickasaws, the escape of a prisoner,
    a rescue by Strong-Wind and his dream-powered brother, and a later account of
    a young hunter who receives medicine roots and instruction in a dream from Black-Mountain-Bear,
    performs a prolonged medicine dance, removes a sick man's pain, and is recognized
    as Black-Mountain-Bear-Medicine-Man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: War breaks out with the Chickasaw people; many people are killed and many
    more are taken prisoner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The victorious Chickasaws make camp each night, hold war dances, and place
    bound prisoners in the center of the dancers' ring.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: One young male prisoner escapes near morning, hides in a hollow log while
    pursuers pass, and later returns to his village to report what happened.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men from the village pursue the Chickasaws, and the elder brother named Strong-Wind
    is chosen to lead them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Strong-Wind and his brother are described as having powers received in dreams
    and as being equal to ten men apiece in battle.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pursuing party attacks at dawn, kills many Chickasaws, rescues prisoners,
    and returns home rejoicing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After many years of using their powers in war, the two brothers die, leaving
    the tribe without medicine-men.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A very young man later becomes a medicine-man through powers given by Black-Mountain-Bear.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: While hunting far from home, the young man sleeps outdoors and dreams he is
    walking on a narrow trail leading eastward.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the dream, an old man by the wayside offers to give the young man medicine
    and powers like his own.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The old man presents many roots, tells the young man to choose six, and says
    six men will each explain one medicine and its use.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Because he fears he will not have time to visit so many men, the young man
    returns four roots, keeps two, receives instruction from another old man, and
    wakes before reaching a third man.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the dream, the young man remains silent for many days, thinks about
    what he was taught, searches for the medicine roots, and after many months finds
    the plant.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: When a man in another village is near death, the young man gathers medicine-men,
    teaches them the medicine dance-song from his dream, and goes with them to the
    sick man's lodge.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The dancers begin slowly, increase their movement, continue for six days and
    nights, and some fall to the ground exhausted.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The young man speaks in an unknown tongue, begins to dance slowly, crawls
    like a mad bear, places his mouth on the place of greatest pain, and removes the
    pain by blowing his breath on the place.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The people recognize the young man as a true medicine-man and understand his
    bear-like actions as evidence that Black-Mountain-Bear gave him power.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: The passage states that the Bear had appeared to the young man as an old man
    in the dream, and from that time the young man is called Black-Mountain-Bear-Medicine-Man.
  category: relationship
  evidence_refs:
  - ev:10
