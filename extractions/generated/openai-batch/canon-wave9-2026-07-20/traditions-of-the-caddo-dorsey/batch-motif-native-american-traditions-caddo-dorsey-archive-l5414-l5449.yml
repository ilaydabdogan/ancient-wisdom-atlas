canonical_text:
  quote: ''
  summary: 'The passage summarizes Caddo traditions about early medicine power: animals
    and dream figures give power in dreams or visions; two brothers first receive
    medicine and later display power in war; after their deaths a young man receives
    Black-Mountain-Bear power through a dream involving roots and becomes a healer
    who treats a sick man through song, dance, breath, and bear-like crawling.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In old times, people and animals are described as being on friendly terms,
    and animals are said to possess powers that they give to people in dreams or visions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who has had a dream remains silent for several days, then calls friends
    and old men to a lodge and teaches songs and dances; such people call themselves
    medicine-men.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When someone is sick, medicine-men hold a dance in a grass lodge for six days
    and nights.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The first medicine-men to receive power and give a dance are two young brothers
    who are brave hunters.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The two brothers dream in the lonely woods that they walk east together, meet
    a man, see his bag, choose medicine, receive medicine for long life, and are taught
    how to use it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After waking, each brother remembers the dream but says nothing; after many
    months each begins to try his powers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: During a war with the Chickasaw, a young prisoner escapes by crawling into
    a hollow log while pursuers search for him, then crawls out and goes home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Men, including the two brothers with power, pursue the Chickasaw, enter the
    camp, kill many Chickasaw, rescue prisoners, and Strong-Wind and his brother exhibit
    wonderful powers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the brothers die, the tribe has no medicine-man until a very young man
    is given powers by Black-Mountain-Bear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The young man dreams while hunting that he walks east on a narrow trail, meets
    a seated man, is offered medicine roots, is told to choose six, is directed to
    six men who will explain their use, gives back four roots, and sees another old
    man by an unclear transcribed term.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: After waking, the young man returns home, keeps silent, wanders looking for
    the roots seen in the dream, and eventually finds a plant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: When a man is near death, the young man calls medicine-men together, teaches
    them a dance song learned in the dream, and they go to the sick man's lodge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The medicine-men dance six days and nights before the young man identifies
    the ailment; he then speaks in a strange tongue, dances slowly, falls, crawls
    like a mad bear, places his mouth on the painful place, blows breath on it, and
    the pain is gone.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The people know Black-Mountain-Bear has given the young man power, and he
    is called Black-Mountain-Bear-Medicine.
  category: relationship
  evidence_refs:
  - ev:6
