canonical_text:
  quote: ''
  summary: In the opening fragment, a boy is aided by a strange man who reveals himself
    as the Sun. The boy kills an old cannibal, gathers his brothers’ bones into nine
    piles, covers them with a robe, shoots an arrow into the sky, and his brothers
    emerge alive. The Sun orders the cannibal couple’s tipi burned and the ashes scattered;
    the brothers return to their grieving grandmother. In the following tale, an old
    woman’s six elder sons disappear one after another. The youngest follows raccoons
    into a hollow tree, where a little old woman kills the raccoons and his dogs.
    A seventh raccoon warns him that the woman is a witch who killed his brothers
    and helps him escape. The boy later dreams of Coyote, who says the brothers are
    alive as slaves of bad people; Coyote then appears as a man, questions Flying
    Squirrel, and learns that the bad people enslave living captives, eat the dead,
    and are ruled by a wicked chief across a river.
  language: English
  quote_policy: summarized
