canonical_text:
  quote: ''
  summary: The passage first recounts an orphan boy who, after receiving power from
    a strong stranger, defeats multiple wrestlers, receives further instruction, returns
    home, and later kills a challenger in a wrestling ring, gaining fear and respect.
    It then begins a separate tale in which, when the world was new, a man sees a
    very long snake-like animal moving in a creek, reports it to his grandfather,
    and the grandfather summons the people to hear of the sign.
  language: English
  quote_policy: summarized
