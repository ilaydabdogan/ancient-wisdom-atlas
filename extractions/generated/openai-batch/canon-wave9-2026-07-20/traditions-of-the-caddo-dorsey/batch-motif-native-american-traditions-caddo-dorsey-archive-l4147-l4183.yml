canonical_text:
  quote: ''
  summary: Wild-Cat, while hunting, finds Rabbit in tall grass. Because they are enemies,
    they fight, and Wild-Cat is about to kill Rabbit. Rabbit bargains for his life
    by promising to show Wild-Cat how to catch Turkeys. Rabbit instructs Wild-Cat
    to pretend to be dead while Rabbit sings and tells the Turkeys to dance around
    him. The Turkeys come and dance; Wild-Cat grabs one, and Rabbit runs away through
    the grass. The passage then begins a Coyote episode set at the beginning of the
    world, where people hold councils to decide how things should be. A council discusses
    what kind of rain should exist; one man proposes lead-ball rain, and Coyote objects
    because it would endanger his people and himself.
  language: English
  quote_policy: summarized
