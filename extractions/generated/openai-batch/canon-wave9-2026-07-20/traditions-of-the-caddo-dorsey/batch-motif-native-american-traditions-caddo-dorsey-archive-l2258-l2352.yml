canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a water monster appears as a bad
    sign, waters rise into a dangerous lake, and a hunter who violates a silence rule
    while crossing is drowned with others. It then gives a tale titled “Slaying the
    Monsters by Fire,” where Coyote and the people plan to burn dangerous wild animals,
    arrange a rope to heaven through White-Headed-Hawk, Crow, and a Star, send Gray
    and Black Snakes to carry fire in the four directions, escape by climbing the
    rope, and use Bat to cut off the pursuing animals and expose those hiding inside
    an immense animal. The passage also begins a second version of “Slaying the Monsters
    by Fire,” in which Morning Star says fire is the only way to kill dangerous animals.
  language: English
  quote_policy: summarized
