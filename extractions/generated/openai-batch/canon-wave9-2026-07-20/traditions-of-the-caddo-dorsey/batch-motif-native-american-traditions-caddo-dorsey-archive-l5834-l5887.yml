  text: Hunters flee a Buffalo herd; one survives by climbing a tall tree, while companions
    are later found only as scattered bones.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Coyote goes last through a gate, shuts it, and allows through only Buffalo
    that have not tasted human flesh.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A girl with power to call Buffalo lives with six brothers who are stars and
    travel through the sky at night.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The brothers place the girl in a swing hung from the sky; when she is swung,
    Buffalo come and the boys kill what they want.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Coyote is told not to swing the girl, but while the brothers are gone he makes
