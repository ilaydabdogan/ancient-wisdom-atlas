canonical_text:
  quote: ''
  summary: 'The passage gives abstracts of Caddo traditions: Buffalo once ate humans
    until Coyote excluded the dangerous ones through a gate; a girl with six star
    brothers calls Buffalo by means of a sky-hung swing and is lost after Coyote breaks
    a prohibition; an old woman who keeps pecans is killed by Coyote, after which
    pecan trees grow everywhere; and a partial account begins in which a rapidly growing
    boy is adopted and empowered by Moon.'
  language: English
  quote_policy: summarized
