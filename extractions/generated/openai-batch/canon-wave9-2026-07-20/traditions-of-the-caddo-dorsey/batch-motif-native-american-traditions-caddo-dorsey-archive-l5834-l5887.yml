  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The brothers decide to go to the sky and live with their sister.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: An old woman, called the mother of pecan trees, gives some pecans to visitors
    but will not let them take any away.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Hungry field-rat people choose four boys to steal pecans, but Coyote says
