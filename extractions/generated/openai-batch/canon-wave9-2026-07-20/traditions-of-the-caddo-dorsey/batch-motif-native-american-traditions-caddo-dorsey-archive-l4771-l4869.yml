canonical_text:
  quote: ''
  summary: The passage closes a Coyote-and-Woodpeckers episode in which Woodpeckers
    free Coyote from a hollow tree and are eaten by him. It then gives a story in
    which Rabbit escapes Coyote by proposing a plan to kill a buffalo from inside
    its body; Rabbit escapes from the butchered buffalo while Coyote is discovered
    and killed. A third story tells how Coyote eats Mountain-Lion's young; Mountain-Lion
    enlists Rabbit, disguises herself under deer meat and fat, and kills Coyote when
    he tries to claim the supposed horse.
  language: English
  quote_policy: summarized
