canonical_text:
  quote: ''
  summary: Two Caddo story abstracts are supplied. In the first, people seeking a
    village site settle near what they think is a large rock by big water, use it
    as a dancing place, discover during a dance that it is a giant turtle, become
    stuck, and are carried into the water and drowned. In the second, dogs in the
    time when animals were like people are described as telling everything they know;
    Running-Water, a hunter, tries to train a young dog not to talk, but the dog reports
    hunting events and disappears during a later long hunt before the excerpt cuts
    off.
  language: English
  quote_policy: summarized
