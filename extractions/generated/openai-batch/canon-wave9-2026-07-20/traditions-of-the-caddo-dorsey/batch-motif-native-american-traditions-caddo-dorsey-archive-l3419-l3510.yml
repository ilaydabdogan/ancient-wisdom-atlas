literal_observations:
- id: obs:1
  text: Deer-Head is named for bravery in killing big deer, disappears, and his younger
    brother says someone came at night, took him away, and that he said he was going
    home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An unnamed man later finds a large deer that does not flee; after being shot,
    it walks away, calls to the man, and the people think Deer-Head changed into a
    deer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A boy often says he is a red mountain-lion, is called Red-Mountain-Lion, and
    becomes a successful hunter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Red-Mountain-Lion’s brother follows him through timber and up a rocky mountain,
    finds a cave, and sees him inside with a female mountain-lion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After men speak of killing a mountain-lion at the cave, Red-Mountain-Lion
    goes there; later men find the footprints of a man and a mountain-lion leading
    away from the cave, and he does not return until captured years afterward.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Red-Mountain-Lion’s brother plans a war party, finds a rattlesnake skin and
    a red mountain-lion’s tail, prays to the rattlesnake and red mountain-lion for
    power, and hides the objects.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that animal gifts should be returned if they are not used
    for their given purpose, and that failure to use or return them causes something
    to happen to the recipient or a family member.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Red-Mountain-Lion hears a turkey and several rattlesnakes, is later found
    unconscious and scalped, and the only tracks found are mountain-lion tracks around
    his head.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A medicine-man asks whether Red-Mountain-Lion’s brother received animal power
    gifts; after the brother admits it, the medicine-man orders the gifts returned
    to the woods, and Red-Mountain-Lion is bathed in the creek and recovers, though
    he remains foolish.
  category: sequence
  evidence_refs:
  - ev:7
