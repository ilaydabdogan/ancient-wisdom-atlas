canonical_text:
  quote: ''
  summary: 'The passage gives abstracts of several Caddo narratives: a girl marries
    a Turtle who is killed by her brothers; the brothers and dog escape by river and
    sky, becoming associated with stars while the girl dies. A man and his talking
    dog survive dangerous water animals, make a deer-flesh sacrifice, and become southern
    stars. An abandoned orphan boy helps bring about the death of a dangerous horned
    water monster and is taken by Evening-Star to become Orphan-Star. A maiden becomes
    Star''s wife, returns from the sky through a heaven-gate and rope, and is helped
    by Buzzard and Hawk; afterward people leave buffalo for buzzards.'
  language: English
  quote_policy: summarized
