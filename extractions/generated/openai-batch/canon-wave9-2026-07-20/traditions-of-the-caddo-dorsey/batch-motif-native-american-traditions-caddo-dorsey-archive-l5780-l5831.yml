comparison_claims:
- id: claim:1
  claim: 'Abstracts 23 and 24 present close variants of the same fire-slaying pattern:
    a council decides to burn dangerous animals, people use a rope to reach the sky,
    Bat cuts the rope above pursuing animals, and the animals are expelled from a
    huge animal and burned.'
  claim_level: same_motif
  target: Adjacent Caddo abstracts 23 and 24, both titled “Slaying the Monsters by
    Fire”
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: 'The two abstracts differ in named agents and details: Coyote and Star
    appear centrally in one variant, while Morning-Star, Fire, Black-Snake, Skunk,
    and Pigeon appear in the other.'
