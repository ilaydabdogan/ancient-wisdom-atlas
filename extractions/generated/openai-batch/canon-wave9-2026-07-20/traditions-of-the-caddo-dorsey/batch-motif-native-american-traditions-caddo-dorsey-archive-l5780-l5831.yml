canonical_text:
  quote: ''
  summary: The passage summarizes three Caddo abstracts. In the first, a man sees
    a large snake-like water animal; an old blind man interprets it as a bad sign
    that waters will rise. A dangerous lake forms, and hunters are warned to cross
    silently; one speaks loudly and all but one are drowned. In the next two variant
    abstracts, dangerous wild animals threaten people. A council decides to burn the
    grass or world; helpers carry fire around the world, while people climb a rope
    to the sky. Bad animals try to climb after them, but Bat cuts the rope. Bat then
    forces the animals out of a huge animal’s body or nose, and the animals burn.
    The people return to the world.
  language: English
  quote_policy: summarized
