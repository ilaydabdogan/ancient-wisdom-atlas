canonical_text:
  quote: ''
  summary: An opening fragment says Coyote's eyes are restored with green buckeye
    balls. In one abstract, Coyote races Turtle, but Turtle arranges disguised relay
    helpers and wins, causing the Coyote people to lose bets. In another, Wild-Cat
    secretly eats from a blind old woman's pot; Coyote imitates him but makes noise,
    is speared, and dies. In the final partial abstract, Coyote challenges Snake to
    a power contest involving reciprocal bites, and Snake bites Coyote on the nose.
  language: English
  quote_policy: summarized
