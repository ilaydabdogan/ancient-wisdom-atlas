canonical_text:
  quote: ''
  summary: Coyote searches for Deer, steals a buffalo robe, and mistakenly seizes
    the robe's owner. The man takes Coyote home and makes him work. While the man
    is away hunting, Coyote falsely tells the man's sister that her brother has been
    killed, takes her as a prisoner, and beats her with a stick as they travel. The
    brother returns, pursues them with extraordinary speed, signals with arrows, sees
    Coyote's abuse, confronts Coyote's lie, and begins to punish him by making him
    carry the sister and by putting a bow-string through Coyote's mouth.
  language: English
  quote_policy: summarized
