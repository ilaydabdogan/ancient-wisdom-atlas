  summary: The introduction states that the Caddo tales were collected in 1903-1905
    under the Carnegie Institution of Washington as part of an investigation of Caddoan
    religious and ceremonial systems. It describes the Caddo population, locations,
    migrations, association with the Wichita, early dwellings and subsistence, and
    notes that comparison with other tribes' tales is deferred.
