canonical_text:
  quote: ''
  summary: 'The passage first describes the first war party: its organized departure,
    rules given by the chief, use of water-carriers and spies, victory over an enemy,
    return with a scalp, public celebration, and its status as the model for later
    war parties. It then begins the story of the Power of the Cyclone: a boy trained
    by daily river bathing encounters a man rising from the water, performs four west-facing
    dives, receives cyclone power from the aging supernatural figure, is named Path-of-the-Cyclone,
    and later is seen carried to the sky by the cyclone.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The war party marched out together, was not allowed to return home, waited
    until noon at the chosen place, stopped singing, ate, and listened to the chief's
    speech.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief instructed the men to move in one body, not stop along the way,
    drink only when water was brought by appointed water-carriers, eat and drink three
    times a day, and keep together to overcome the enemy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chief camped about a hundred yards ahead of the others facing the enemy's
    country.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Near the enemy's country, the chief appointed four spies who arranged a meeting
    place, used a signal if the enemy was seen, and returned to report after receiving
    water from the water-carriers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The war party found and fought the enemy and took only one scalp, which was
    enough to show victory.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief sent news home that the enemy had been defeated and that the party
    was bringing back a scalp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: People at home painted and feathered themselves, met the returning party,
    saw the scalp placed on a pole, raced with it, and joined in a large war dance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The account states that what happened with the first war party has been the
    pattern for all war parties since.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A boy sat on a river bank after his morning bath, watched the sunrise, listened
    to water and trees, and heard a voice speak near his ear.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The voice said it had watched the boy bathe every morning and knew his grandmother
    had sent him daily in winter and summer to plunge into the water to gain strength
    and endurance.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the boy looked through the trees and into the water, a man slowly rose
    to the surface and came close to him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The man told the boy to dive into the water four times and always face west
    while diving.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The unknown person identified himself as the Power of the Cyclone, said he
    had once controlled all the Winds, was growing old, and had chosen the boy to
    receive his powers.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: When the boy swung his arms, a large black cloud appeared, moved west, and
    wind broke from it, tearing up trees and tossing the waters.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The man commanded the boy to stand still, and the boy stopped with his arms
    at his sides, breathless from the exertion.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The man told the boy he had received the power, warned him not to abuse it,
    instructed him to send the cyclone only in spring when necessary, gave him the
    name Path-of-the-Cyclone, and disappeared.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: Years later, people recognized the boy's power when they saw him carried through
    the air to the sky on the breast of the cyclone.
  category: action
  evidence_refs:
  - ev:10
