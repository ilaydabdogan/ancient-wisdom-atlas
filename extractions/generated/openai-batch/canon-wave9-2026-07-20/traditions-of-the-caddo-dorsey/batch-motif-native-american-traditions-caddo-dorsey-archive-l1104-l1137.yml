canonical_text:
  quote: ''
  summary: At a medicine-men's dance, Black-Mountain-Bear-Medicine-Man demonstrates
    power by having his helper shoot him with a gun after showing the bullet and powder;
    he rises unharmed, shows the bullet, and becomes a member of the society. Another
    young man, with power from Mountain-Bear, transforms a bear skin into a young
    bear and back. The passage then distinguishes healers from more powerful medicine-men
    who prevent harm, bewitch at a distance, and sing a death song that drives death
    away; such powers may come from celestial bodies, earth, storm, or fierce animals.
  language: English
