canonical_text:
  quote: ''
  summary: A beautiful girl, dissatisfied at home, prays to spirits and wishes to
    become the wife of North Star. She finds herself in the home of an old man who
    says she is his wife. Unhappy there, she disobeys his warning not to move a stone,
    sees earth below, makes a rope from soapweeds, and climbs down. Before reaching
    the tree tops, a bird passes under her several times, offers to carry her home,
    flies her back, and identifies himself as Black-Eagle.
