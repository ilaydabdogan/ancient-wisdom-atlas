canonical_text:
  quote: ''
  summary: 'The passage contains abstracts of several Caddo traditions: Coyote helps
    free slaves from a wicked chief by becoming a corn mill; a widow and child are
    rescued from a cannibal by Spotted-Wolf and wolves from the four directions; a
    medicine-man kills a grave-robbing cannibal, explaining burial bows and arrows;
    a hunter makes arrows for a ghost so he can reach spirit land; seven idle boys
    become the Pleiades; Coyote sets rules for the dead, funeral fire, return to life,
    and timber spirits; and a boy who eats snake meat becomes a snake helper for hunters.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote says he wants to help enslaved people, is carried across a river by
    Flying-Squirrel, falls into the river, and later turns into a corn mill floating
    on the water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The corn mill makes corn sour; the chief says the mill is Coyote, tries to
    spear it with his long spiked nose, gets stuck in a log, and is killed by the
    slaves after Coyote resumes his form.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A widowed young woman with a baby remains in a deserted village and is given
    tobacco by Spotted-Wolf, who tells her to throw it to the four directions and
    call him if she meets danger.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the woman meets a cannibal, she throws tobacco to the four directions
    and prays; spotted wolves come from the four directions, kill the cannibal, and
    a southern wolf conducts her and her child safely to her people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Another cannibal is described as living like a human, eating dead people,
    pretending to be sick and dead, emerging from the grave at night, and stealing
    a dead person before spirits can take him away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: An old medicine-man pretends to die, has his sons bury him with bow and arrows,
    jumps from his grave at night, and shoots the grave-robbing cannibal.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The abstract says bows and arrows have since been placed in graves so the
    dead may shoot the cannibal.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: A dead person asks a living hunter for a bow-string and two arrows; after
    the hunter makes them, the dead person shoots the arrows and goes up with them,
    whooping to show that they carried him safely.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The abstract says bows and arrows are always made and buried with the dead
    so they may go to spirit land at once.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Seven sons of an old woman refuse to work, are denied food, circle their house
    while praying to Spirits, rise higher with every round, and become the Pleiades.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Pleiades are said to be seen during winter and to be gone at the beginning
    of spring, described as work time.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: 'Coyote decides rules for the dead: a person buried within six days stays
    underground, while one not buried by the seventh day may escape and, if caught,
    can be restored after fire, six days at home, and washing.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: At death the body is laid with head toward the east and feet toward the west;
    fire is made at the feet and kept for six days and nights.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: If the grave fire goes out, the grave may be found open with tracks toward
    the east; if the dead person is overtaken, fire is built around him until he begins
    coming to life again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Dead persons who are not caught become like large monkeys, live in thickets,
    talk to people, and ask for wrestling matches.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:16
  text: A boy kills a snake, eats snake meat instead of buffalo, turns into a snake,
    asks his friend to find him a hole, receives offerings from hunters, helps them,
    and later is killed by lightning.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: The provided passage ends with the heading “The Woman Who Turned Into a Snake,”
    but no narrative details from that abstract are included in the supplied range.
  category: other
  evidence_refs:
  - ev:8
