canonical_text:
  quote: ''
  summary: The passage opens the Caddo story titled “Buffalo Woman.” In a village,
    a cannibal named Snow-Bird-with-White-Wings has a handsome brave hunter son named
    Braveness, who refuses local marriage offers. While hunting westward, Braveness
    meets a beautiful young woman under a small elm tree; she says she expected him,
    asks to become his wife, and receives his parents’ consent. Later she asks him
    to promise obedience and leads him toward her home beyond high hills, warning
    that people and young men there will try to anger and harm him.
