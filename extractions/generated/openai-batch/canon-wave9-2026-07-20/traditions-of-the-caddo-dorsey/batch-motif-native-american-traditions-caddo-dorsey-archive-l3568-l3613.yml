canonical_text:
  quote: ''
  summary: A woman warns Braveness that others are jealous of him, then tells him
    to roll over twice; he and she become Buffalo and visit her Buffalo people and
    mother. They later return to human form, and she tells him not to speak of the
    transformation or her people. After another visit to the Buffalo, she says the
    old people plan to kill him through a foot race. At night an unseen person offers
    to help him win so that he can keep the woman without further trouble.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman warns that others are jealous of Braveness and may kill him because
    she has refused many of them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman tells Braveness to lie down and roll over twice; he does so and
    changes into a Buffalo.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman also rolls over twice and becomes a Buffalo.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Buffalo form, the two climb a high hill, and Braveness sees many Buffalo
    toward the west.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman identifies the Buffalo herd as her people and leads Braveness to
    an old Buffalo cow whom he recognizes as her mother.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Four or five young Buffalo repeatedly come around and bother Braveness, after
    which Braveness and the woman decide to return home.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the place of transformation, Braveness and the woman roll over twice again
    and become as they were before.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The woman tells Braveness not to mention either the transformation or her
    people to anyone.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: When Snow-Bird-with-White-Wings asks where Braveness has been, Braveness says
    he was hunting and then went to his wife's home.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After about one year, Braveness and the woman go again to see her mother;
    after a long stay among the Buffalo, the woman says the old people plan to kill
    him by making him run in a foot race.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: On a dark night, an unseen unknown person calls to Braveness and says he cannot
    beat the Buffalo in running without help.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The unknown person says that if Braveness loses the race the Buffalo will
    kill him, but if he wins they will let him have the woman all to himself and stop
    bothering him.
  category: speech
  evidence_refs:
  - ev:7
