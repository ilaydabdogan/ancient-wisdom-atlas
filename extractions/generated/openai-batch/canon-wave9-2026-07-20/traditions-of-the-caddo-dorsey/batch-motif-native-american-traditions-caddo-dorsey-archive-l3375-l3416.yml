canonical_text:
  quote: ''
  summary: A hunter meets an unknown person seeking water and carries him there. At
    the water the unknown person carries the hunter with his eyes closed to a hidden
    place where animal heads are displayed. The unknown person, who says people call
    him Alligator, grants the hunter powers to kill game, requires secrecy, returns
    him to dry land, and sends him hunting. The hunter immediately kills four deer
    and later becomes the most successful hunter among his people.
