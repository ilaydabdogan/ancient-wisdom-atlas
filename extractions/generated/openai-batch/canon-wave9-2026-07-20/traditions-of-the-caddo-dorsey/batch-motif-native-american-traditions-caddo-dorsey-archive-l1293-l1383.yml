canonical_text:
  quote: ''
  summary: The passage first concludes a story in which Evening-Star kills a dangerous
    lake monster and takes a friendless boy to the sky, where he is seen as Orphan-Star.
    It then tells of a maiden who wishes to marry a star, awakens in the sky as the
    wife of an old Star, regrets her wish, and is allowed to descend toward earth
    by an elm-bark rope through a potato-covered door of heaven. The rope is too short,
    but Buzzard and Hawk carry her downward; Buzzard returns her to her village. Afterward
    the people leave a buffalo for buzzards after a large kill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy jumps from an animal to shore; the animal is struck and dies, and Evening-Star
    says the creature had made the lake water dangerous.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Evening-Star offers to take the boy to the sky because the boy helped him;
    the boy accepts because he is alone and friendless, and he is thereafter seen
    near Evening-Star as Orphan-Star.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A maiden sleeping under the open sky watches one star and wishes it would
    become a man and marry her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the maiden wakes, an old man by the fireside tells her that her wish
    has been granted, that she is the Star's wife, and that he is the Star.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Star's sister identifies one big potato as the door of heaven, covering
    the entrance to the world beneath.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The maiden cries, says she made a mistake in wishing to marry the Star, and
    asks to return to her people; the Star agrees to let her return after six days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Star, his sister, and the maiden make a rope from young elm bark; the
    Star's sister prepares corn meal and a squash vessel filled with water for the
    maiden's journey.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The maiden is fastened to the rope, lowered through the hole after the potato
    is removed, passes through darkness and layers of warm and cold air, and eventually
    hangs suspended because the rope is too short.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Buzzard agrees to help the suspended maiden and carries her downward; Hawk
    helps for part of the descent before Buzzard resumes carrying her.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Buzzard tells the maiden to enter her lodge and let only her father and mother
    see her; he then lands gently outside her village and points out her parents'
    lodge.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The returned maiden is weak and extremely thin; a village woman recognizes
    her, her mother weeps over her, and the maiden later tells the people about Buzzard's
    kindness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the maiden's return, the people leave one buffalo for buzzards after
    a large buffalo killing.
  category: action
  evidence_refs:
  - ev:9
