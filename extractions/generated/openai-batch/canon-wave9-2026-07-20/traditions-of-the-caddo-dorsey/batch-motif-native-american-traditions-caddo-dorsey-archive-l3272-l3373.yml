canonical_text:
  quote: ''
  summary: Owl deceives twin sisters into thinking he is a successful turkey provider,
    but they discover he receives turkeys from the chief for letting the chief sit
    on him at council. Angered after the deception is exposed, Owl and his grandmother
    gather all the waters of the earth into a hole, causing drought and thirst. Several
    animal episodes explain crow’s black color, turtle shell markings, owl’s wide
    eyes, and Flea’s warm place on Coyote. Flea releases the water by biting Owl’s
    grandmother so that she overturns a water jar. The passage then begins a new tale
    about a poor hunter and his hungry wife among successful but ungenerous hunters.
  language: English
  quote_policy: summarized
