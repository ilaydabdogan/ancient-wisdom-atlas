canonical_text:
  quote: ''
  summary: In an old time when animals talked and visited like people, Coyote visits
    Raven, who produces buffalo meat and fat by shooting an arrow into the air and
    drawing it from his own side. Coyote later tries the same act when Raven visits
    him, but the arrow wounds his thigh and Raven leaves amused. Coyote next visits
    Black-Mountain-Bear, who feeds him persimmons by leaning against a loaded tree.
    Coyote constructs an imitation persimmon tree and, when Bear visits, tries to
    make the fruit fall; the tree falls on his head, but he still feeds Bear. The
    passage then begins another episode in which Coyote enters Woodpecker's grass
    lodge, sees a non-burning light on Woodpecker's head, and receives food from him.
  language: English
  quote_policy: summarized
