canonical_text:
  quote: ''
  summary: Medicine-Man tries to capture an unknown boy who plays with his son. After
    the boy is captured, washed, physically altered, and accepted as a brother, the
    two boys disobey a warning about large squirrels; the younger boy is swallowed
    and then rescued alive. Later, a bark wheel rolls away during an arrow game, and
    the brothers follow it until a pecan nut grows into a tree reaching the sky.
  language: English
  quote_policy: summarized
