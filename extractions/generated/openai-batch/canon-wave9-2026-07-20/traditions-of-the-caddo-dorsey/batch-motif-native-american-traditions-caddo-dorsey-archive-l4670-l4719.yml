canonical_text:
  quote: ''
  summary: The excerpt ends a Coyote and Wind episode in which Wind punishes Coyote
    for stealing his robe and trying to use it to catch Deer instead of waiting to
    receive power. The main complete tale tells how Coyote kills and hides a deer,
    Wild-Cat steals the meat and hides in a tree by a river, and Coyote mistakes the
    meat's reflection in the water for the meat itself. Coyote dives repeatedly, ties
    stones to her neck, and drowns. Wild-Cat reveals the meat, feeds the Coyote children,
    and cares for them until grown. The excerpt then begins another Coyote tale in
    which Coyote returns from an unsuccessful hunt and hears laughing and playing.
  language: English
  quote_policy: summarized
