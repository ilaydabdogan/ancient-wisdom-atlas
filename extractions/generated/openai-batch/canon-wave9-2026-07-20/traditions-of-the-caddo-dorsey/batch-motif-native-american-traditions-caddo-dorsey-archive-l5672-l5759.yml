canonical_text:
  quote: ''
  summary: 'The passage gives abstracted Caddo narratives involving Medicine-Screech-Owl
    figures: one removes dangerous shells from a boy and later returns them after
    a promise; another self-named child defeats an ex-chief’s impossible tasks and
    ordeals, survives a visit to Snow-and-Cold, and kills threatening men; another
    is born after unexplained pregnancy, speaks from the womb, overcomes storm powers
    and a cannibal monster, heals the sick, prevents death where he is, and finally
    disappears.'
  language: English
  quote_policy: summarized
