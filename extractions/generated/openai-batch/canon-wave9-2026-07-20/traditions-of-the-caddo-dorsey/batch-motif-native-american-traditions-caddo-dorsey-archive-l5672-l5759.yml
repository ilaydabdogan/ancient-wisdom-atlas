  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The boy makes a big fire and tells the ex-chief to enter it; the ex-chief
    enters and is burned to death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The boy kills three men one at a time as they enter a lodge through a very
