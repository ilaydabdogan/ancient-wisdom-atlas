  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Dogs track Medicine-Screech-Owl to a big circle of fire, where he stands wearing
    the shells; the dogs cannot pass through the fire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: On his first birthday a child is given a bow and arrows and insists on naming
    himself Medicine-Screech-Owl.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: An ex-chief by the same name threatens the boy and gives him tasks involving
