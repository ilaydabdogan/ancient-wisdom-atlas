canonical_text:
  quote: ''
  summary: A man has a wife and a talking dog. While the man hunts, the wife secretly
    leaves. The dog follows her and sees her summon a large snake from a hole in a
    tree by whistling three times; the snake coils around her. The man later imitates
    the summons, kills the snake with arrows, cuts it like fish, cooks it, and serves
    the snake flesh to his wife while he and the dog eat fish. The dog observes that
    after eating the snake, the wife scratches herself, her skin changes to the color
    of snake skin, and she becomes a snake.
  language: English
  quote_policy: summarized
