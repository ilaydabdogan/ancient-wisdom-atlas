canonical_text:
  quote: ''
  summary: The passage gives several Caddo abstracts centered on Coyote. Coyote is
    fooled by a turkey feather and falsely claims to have killed Mountain-Lion; is
    trapped while fishing and killed by a man he had tricked; is burned by ash piles
    shaped like geese; and repeatedly fails when imitating Raven, Black-Mountain-Bear,
    and Woodpecker after being fed or hosted by them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote discovers that a turkey feather stuck near his teeth has deceived him,
    becomes angry, and later says at home that he has killed Mountain-Lion.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the fishing episode, Coyote asks a man how he obtained fish, follows the
    man's directions to sit at the river edge while ice is broken, and remains there
    overnight until water freezes on his tail.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fisherman reminds Coyote of earlier trickery, goes for bow and arrows,
    sings a death song, and shoots and kills Coyote.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the goose episode, Coyote is described as once a man and as disliked by
    people because he tries to cheat others.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Coyote's friend forms ashes into the shape of geese near a lake and places
    coals under the ashes so that the fire is hidden from outside view.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Coyote jumps on the hot ash pile shaped like geese, burns himself badly, runs
