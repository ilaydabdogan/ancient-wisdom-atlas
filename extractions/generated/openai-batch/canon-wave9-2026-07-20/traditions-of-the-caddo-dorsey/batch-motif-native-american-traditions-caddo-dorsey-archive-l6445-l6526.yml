  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Coyote imitates Raven by shooting an arrow into the sky, but the returning
    arrow strikes Coyote in the thigh and he runs away screaming.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Black-Mountain-Bear feeds Coyote by leaning against a persimmon tree so that
    ripe fruit falls to the ground.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Coyote sets up a fruitless cut tree, places persimmons on it, and tries to
