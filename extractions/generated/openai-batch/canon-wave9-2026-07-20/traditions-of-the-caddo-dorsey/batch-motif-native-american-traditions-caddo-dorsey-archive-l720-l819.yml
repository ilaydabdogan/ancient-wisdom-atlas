canonical_text:
  quote: ''
  summary: 'The passage gives connected Caddo accounts of death and afterlife: Coyote
    establishes permanent death, the dead go to the sky and become stars, named star
    beings have roles as watchers, and a later origin-of-death narrative describes
    medicine-men attempting to restore the dead until Coyote closes the medicine-house
    door against a returning spirit in a whirlwind.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote's rule is that a person who dies is dead forever and is not seen again
    by living people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Great-Father-Above is said to have made a place where everyone may go after
    death.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A fire is kept for six days after a death, and the dead are said to be taken
    to the sky and become stars visible at night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Morning Star is described as the oldest of four brothers, leader of the tribe,
    formerly an errand man, and one who rises early because he once woke camps before
    dawn.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Evening Star watched the rear trail; North Star and South Star camped in their
    directions to watch for enemies; Great Star was the father and chief.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the beginning there was no death, and a council was held because people
    had become too numerous for the earth.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: One man proposed that people die temporarily and return, while Coyote argued
    that people should die forever because the world and food supply were too limited.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The other men objected to permanent death because they did not want friends
    and relatives gone forever and feared grief and unhappiness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Medicine-men built a large grass house facing east and announced that the
    dead would come there to be restored to life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The chief medicine-man planned to place a white and black eagle feather on
    the grass house; when it became bloody and fell, people would know someone had
    died.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Medicine-men would sing to call the spirit of the dead to the grass house,
    cause it to take its living form, and restore it to life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: After the feather became bloody and fell, a whirlwind from the west circled
    the grass house, entered through the east entrance, and a handsome young man who
    had been murdered appeared from it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Coyote was displeased when the returned young man appeared because Coyote's
    rule about the dead had not been carried out.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: At a later death, Coyote sat near the door, waited for the whirlwind, and
    closed the door as it was about to enter; the spirit in the whirlwind passed by.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: After Coyote closed the door, death forever was introduced, people grieved,
    and spirits of the dead wandered over the earth until they found the road to spirit
    land.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:16
  text: The passage says that when someone meets a whirlwind or hears the wind whistle,
    people say that someone is wandering about.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: Coyote ran away, looked back over his shoulders as if pursued, and is said
    to have been starving because no one would give him food.
  category: action
  evidence_refs:
  - ev:7
