canonical_text:
  quote: ''
  summary: Woodpecker visits Coyote's lodge and sees burning straw on Coyote's head.
    Coyote says the fire will not burn him and that he was told he would wear a light
    on his head at night, but his hair catches fire and he runs away screaming for
    help. In the next tale, Coyote meets Deer while hunting. Deer offers to let Coyote
    kill and eat him if Coyote can catch him, but Deer outruns him. Later, while Coyote
    is searching for Deer asleep, he naps in tall grass, wakes to an unseen song mentioning
    his name, flees from the voice, and then hears the voice identify itself as Wind
    and promise him power to catch Deer.
