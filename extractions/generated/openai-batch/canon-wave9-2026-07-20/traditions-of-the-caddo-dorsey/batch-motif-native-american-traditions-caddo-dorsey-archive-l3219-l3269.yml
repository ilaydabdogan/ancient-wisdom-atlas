canonical_text:
  quote: ''
  summary: A man feeds snake flesh to his wife while he and the dog eat fish. The
    dog observes the wife eating the snake and then scratching herself until her skin
    takes on snake coloration and she becomes a snake. She leaves the grass lodge
    to seek the snake, and later the man sees a large snake come out of a large tree
    and knows it is his wife. In the next tale, twin daughters of an old couple set
    out to marry a wealthy famous chief, meet a man with a turkey, and hear him claim
    to be the chief. The man is identified as Owl, who tells his grandmother to clean
    the lodge because he is playing a joke on the girls.
  language: English
  quote_policy: summarized
