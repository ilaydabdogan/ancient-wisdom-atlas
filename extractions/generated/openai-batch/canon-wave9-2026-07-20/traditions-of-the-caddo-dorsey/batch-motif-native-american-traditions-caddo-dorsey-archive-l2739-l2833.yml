canonical_text:
  quote: ''
  summary: The passage first tells of three hunters who smoke what they think is a
    bear hole in a large tree and release a cannibal animal. The cannibal pursues
    them, kills two, and is then killed by a waiting mountain-lion, after which the
    survivor’s people recover and bury the two bodies. The passage then begins another
    narrative in which nine older brothers vanish one by one, the youngest brother
    sets out despite his grandmother’s fear, prays for help, wears an eagle feather,
    reaches a tipi associated with cannibalistic speech, and is saved by an unseen
    power during a dangerous log ordeal imposed by an old man.
  language: English
  quote_policy: summarized
