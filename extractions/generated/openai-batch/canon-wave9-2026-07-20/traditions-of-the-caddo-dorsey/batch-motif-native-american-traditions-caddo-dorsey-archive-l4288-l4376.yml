canonical_text:
  quote: ''
  summary: Coyote is thrown and kicked by a horse, mocked by Mountain-Lion, and then
    tormented by Opossum in a persimmon tree; when a dry limb breaks, Coyote beats
    Opossum and leaves him, but Opossum recovers and laughs from the tree again. In
    a separate episode, Coyote tricks Turkey into flying toward the prairie, kills
    and eats him, then mistakes a turkey feather stuck in his teeth for a pursuing
    man. He runs repeatedly until exhausted, discovers the feather, and afterward
    coyotes are said to look wild and check side to side while running. Coyote later
    falsely tells his family he chased and killed a mountain-lion.
  language: English
  quote_policy: summarized
