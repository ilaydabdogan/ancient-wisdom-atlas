  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: Two men hunt far from their village, find nothing, and sleep in a grassy place
    in the timber overnight.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: After a whooping voice awakens the hunters, one man runs home in fear while
    the other stands his ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: A dead person appears and asks the standing hunter for help entering Spirit
    Land because his bowstring has a knot in it; he asks for a bowstring and two new
    arrows.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: The hunter makes arrows and puts a new string on the dead person's bow; the
    dead person shoots the arrows, rises into the air with them, whoops, and the hunter
    answers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The hunter understands that the dead person has entered Spirit Land, and the
