canonical_text:
  quote: ''
  summary: 'The passage contains adjacent Caddo narrative episodes: a medicine-man
    feigns death and kills a grave-rising cannibal, explaining burial of bows and
    arrows; a hunter helps a ghost reach Spirit Land by making arrows and restringing
    a bow, explaining funerary weapons and a night-making taboo; seven boys rise into
    the sky as the Seven Stars, with seasonal visibility explained by work time; and
    Coyote establishes rules about death, burial timing, return, escape, and fire
    around a caught dead person.'
  language: English
  quote_policy: summarized
