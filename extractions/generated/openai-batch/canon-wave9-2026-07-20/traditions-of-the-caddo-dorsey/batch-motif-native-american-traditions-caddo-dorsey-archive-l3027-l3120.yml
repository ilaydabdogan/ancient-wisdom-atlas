  category: relationship
  evidence_refs:
  - ev:3
- id: obs:12
  text: An old woman has seven boys who play all day, avoid work, and are described
    as indolent.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:13
  text: After their mother denies them supper, the boys decide to go away where they
