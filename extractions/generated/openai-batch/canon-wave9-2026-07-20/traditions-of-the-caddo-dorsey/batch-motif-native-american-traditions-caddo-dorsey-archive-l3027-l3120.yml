  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The medicine-man hears the cannibal coming, comes out of his own grave, shoots
    an arrow through the cannibal, and kills him so that he does not return to life.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The episode explains that bows and arrows are put in graves with the dead
