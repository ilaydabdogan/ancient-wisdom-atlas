canonical_text:
  quote: ''
  summary: An orphaned boy, left without hunting instruction after his grandfather
    dies, begs and is teased. He learns to hunt small game, meets a strange boy who
    proves to be a strong man, receives strength from him, is taught to use that strength
    through wrestling trials, and later gains fear and respect after killing a wrestling
    opponent.
  language: English
  quote_policy: summarized
