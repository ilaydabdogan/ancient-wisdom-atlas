canonical_text:
  quote: ''
  summary: A youngest daughter prays to marry the bright North Star and finds herself
    in the Star's home as his wife, where he appears as an old man. She discovers
    a forbidden stone covering a view down to earth, makes a soapweed rope, descends
    until the rope ends, and is carried home by Black Eagle. A following tale begins
    with Lightning living among people, being exiled for killing many, and then negotiating
    a return by offering to kill an underground monster that carries people away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A family has father, mother, and eight children; the youngest and most beautiful
    girl remains unmarried, roams alone, and wants to go away from home.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl prays to the spirits for help so that she may go wherever she wishes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Outside the lodge at night, the girl watches the stars, notices a very bright
    North Star, and wishes to marry it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After praying, the girl finds herself in the home of a very old man by the
    fireside; he says she wished to marry him and is now his wife.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The girl dislikes the old man's appearance and tries unsuccessfully to get
    away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Star had told her not to move a great round stone because it was dangerous;
    when he is away, she lifts it and can look down to earth.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the Star's nightly absences, the girl cuts soapweeds and makes a long
    rope.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: She drops the soapweed rope through the opening, fastens it to the rock, replaces
    the stone, and later climbs down.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The rope ends before she reaches the treetops; while she hangs there, a bird
    passes under her feet several times and offers to carry her down.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The girl steps on the bird's back, lets go of the rope, and the bird carries
    her downward and near her home, then identifies himself as Black Eagle.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Lightning once lives on earth with the people, becomes powerful, kills many
    people, and is ordered away by the chiefs after council.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A great monster living underground among rocks carries away people; Lightning
    offers to kill the monster and make earth safe if allowed to return, and the people
    decide to let him come back.
  category: sequence
  evidence_refs:
  - ev:8
