canonical_text:
  quote: ''
  summary: 'A preceding episode concludes with Coyote''s eyes being restored by buckeye
    balls. A new story begins: Coyote visits Turtle after an unsuccessful hunt, accepts
    food, hears Turtle claim victory in foot races by the river, and agrees to race
    him two days later. Coyote summons his people to bet on him, while Turtle summons
    runners and proposes a plan to defeat Coyote by having helpers look like Turtle
    and stand along the course.'
