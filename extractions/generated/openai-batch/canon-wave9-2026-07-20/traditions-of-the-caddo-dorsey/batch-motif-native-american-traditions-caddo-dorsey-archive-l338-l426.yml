canonical_text:
  quote: ''
  summary: The passage recounts an initial condition of darkness, the appearance of
    a first being later named Moon, the giving of seeds and institution of chieftainship,
    a westward migration from Old-Home-in-the-Darkness through the ground into another
    world, Coyote looking back so that half the people return, the formation of high
    mountains, settlement and dispersal, differentiation of languages, naming of directions,
    and the Sun’s east-to-west movement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the beginning, the sun, stars, moon, and earth did not exist as they do
    now, and darkness ruled.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man appeared as the only living being; a village with many thousands of
    people then came into existence, and the man later returned with seeds for the
    people to eat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first being said Darkness would go and that a man named Sun would be given
    power by Great-Father-Above; the directions of the Sun’s coming and going were
    named east and west.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first being said the people needed a wiser and abler head man called chief,
    whose commands the people should follow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Coyote proposed that the powerful first man be called Moon, and the people
    decided that Moon should be their chief.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Moon selected another man, called the Errand-Man, as a helper to call the
    people together.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Moon announced that the people must leave the world called Old-Home-in-the-Darkness
    for another and better world, and that he knew the way.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The people were divided into groups with leaders, each leader received a drum,
    and the leaders were told to sing and beat their drums while moving.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The leaders were warned not to look back at the way they came, or the people
    would be stopped and remain in darkness.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The people moved westward and came out of the ground into another world.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Coyote looked around, said the world was too small for the people, and looked
    back toward the place from which they had come.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Because not all the people had come out when Coyote looked back, half of them
    returned while the others continued westward.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Moon threw dirt in front of himself and formed very high mountains, where
    the people stopped and made their first homes and villages.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the people scattered in groups, their formerly single Caddo language
    became different languages.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Moon named the right-hand direction north or cold side and the left-hand direction
    south or warm side.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: While Moon was speaking, the Sun came up from the east, passed the people,
    and went down in the west too quickly to benefit them.
  category: sequence
  evidence_refs:
  - ev:8
