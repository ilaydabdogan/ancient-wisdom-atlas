canonical_text:
  quote: ''
  summary: The passage first recounts Coyote falling into water, changing into a corn
    mill, deceiving a chief and villagers, and helping slaves kill the chief. It then
    begins the story of a widowed mother left behind with her newborn, aided by Spotted-Wolf
    and wolves from the four directions against a shapeshifting cannibal. The passage
    closes by describing another type of cannibal that feigns death, rises from the
    grave, and steals corpses before spirits can take them away.
  language: English
  quote_policy: summarized
