- id: obs:1
  text: Coyote tries to cross water by holding Squirrel's tail during flight, lets
    go near the other bank, falls into the water, and hides in tall grass.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote turns into a new corn mill floating on the water; a woman sees it,
    the chief suspects a trick, and women use it to grind corn until one woman's sweet
    corn disappears.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief places the mill on a big log used for spearing people, but his long
    spiked nose sticks in the log; the mill rolls away, becomes Coyote, and Coyote
    holds the chief while slaves, including six brothers, kill him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the chief is killed, Coyote tells the slaves they are free; the six
