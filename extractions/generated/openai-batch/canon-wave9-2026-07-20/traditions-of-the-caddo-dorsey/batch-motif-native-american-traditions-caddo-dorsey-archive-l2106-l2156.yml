    killed by the boy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Medicine-Screech-Owl travels from place to place, killing monsters and ferocious
    animals and healing the sick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Where Medicine-Screech-Owl is, death cannot come, and people are healed when
