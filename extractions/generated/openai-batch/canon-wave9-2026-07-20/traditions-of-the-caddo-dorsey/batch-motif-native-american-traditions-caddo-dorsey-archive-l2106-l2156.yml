canonical_text:
  quote: ''
  summary: Medicine-Screech-Owl, described as a boy, asks to fish and repeatedly catches
    large fish. Some people fear him because his father is unknown and enlist a Medicine-Man
    to kill him. The Medicine-Man sends Thunder and later a Cannibal monster, but
    the boy withstands the lightning and kills the monster. He then travels, kills
    monsters and ferocious animals, heals the sick, announces he will leave, and disappears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A lake near the village is used by men for fishing, and children go there
    to watch.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Medicine-Screech-Owl asks his mother for permission to fish, takes his little
    bow and arrows, and repeatedly returns with a big fish.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Many people dislike and fear the boy because they do not know who his father
    is, and they ask a powerful Medicine-Man to kill him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: While fishing at the lake, the boy sees a big black cloud reflected in the
    water and understands that the Medicine-Man is sending Thunder to kill him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lightning strikes at the boy, and he raises his bow so that the lightning
    rolls from it into the water; repeated lightning shafts are caught on the bow
    and hurled into the water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Medicine-Man gives up after realizing that the boy has more power over
    Thunder than he has.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In his lodge, the boy senses that something will happen, takes his bow and
    arrows, lies down, and sings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Medicine-Man sends a Cannibal monster to destroy the boy; the monster
