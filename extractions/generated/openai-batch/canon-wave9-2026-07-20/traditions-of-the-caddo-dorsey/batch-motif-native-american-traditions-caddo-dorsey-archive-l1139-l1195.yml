canonical_text:
  quote: ''
  summary: A girl secretly marries Turtle, brings him into her house while her two
    hunter brothers are away, hides him in a high bed, and feeds him potatoes. Her
    brothers discover and kill Turtle, then flee with their dog. At a river, they
    bargain with white ducks, painting the ducks' feathers in exchange for transport
    and silence. The ducks deny seeing them, but one unpainted duck tells the girl
    the truth and carries her across the river so she can continue the pursuit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl lived alone with her two brothers, who were described as famous hunters
    and were away hunting during the day.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl often played by the water, came to know Turtle there, and agreed
    when Turtle asked whether she would have him for her husband.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The girl would not let her brothers carry water for her and would go herself,
    staying a long time with Turtle at the lake.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the brothers were gone for many days, the girl built a high bed, carried
    Turtle home, and put him in the bed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Turtle said he liked potatoes best, and the girl regularly prepared a large
    bowl of potatoes and placed it in the bed for him.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:6
  text: After the brothers returned, the girl considered taking Turtle back to the
    river, but let him stay after he begged her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The girl warned Turtle to remain hidden and motionless in the bed because
    her brothers would kill him if they found him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The brothers noticed the high bed and later suspected something after seeing
    their sister put a full bowl of potatoes in the bed and take it out empty.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: The brothers pretended to go hunting, returned secretly, found Turtle in the
    bed, killed him, and ran away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The girl found her husband dead, concluded that her brothers had killed him,
    and started after them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The fleeing brothers reached a river with their small bob-tailed dog and met
    many white ducks on the water.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage states that all birds were white in those days.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The brothers offered to paint the ducks different colors if the ducks would
    carry them and their dog across the river and not report seeing or helping them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The ducks agreed, were painted, and carried the brothers and dog across the
