canonical_text:
  quote: ''
  summary: The passage contains abstracts from two Caddo traditions. In one, Red-Mountain-Lion
    becomes a hunter, is seen with a female mountain-lion in a cave, later takes rattlesnake
    skin and a mountain-lion tail for power, neglects to return them, is found unconscious
    and scalped, and partly recovers after the gifts are returned but remains foolish
    and is eventually killed. In the beginning of “Buffalo Woman,” Braveness marries
    a woman found under an elm tree; she leads him toward her home, warns him not
    to anger her people, transforms him into a buffalo by having him roll over twice,
    transforms herself likewise, and reveals her buffalo kin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A little boy tells his parents that he is Red-Mountain-Lion, is called by
    that name, and becomes a successful hunter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Red-Mountain-Lion's brother follows him to a mountain cave and sees him with
    a female mountain-lion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men later find footprints of a man and a mountain-lion leading away from the
    cave; Red-Mountain-Lion does not return to his people until he is captured years
    later by a hunting party.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Red-Mountain-Lion finds a rattlesnake skin and a mountain-lion's tail, takes
    them, and prays to rattlesnake and mountain-lion for their powers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After a war expedition is abandoned, Red-Mountain-Lion neglects to throw away
    the rattlesnake skin and mountain-lion tail.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Red-Mountain-Lion goes to catch a cackling turkey, hears rattlesnakes beside
    him, does not return, and is found unconscious and scalped; mountain-lion tracks
    are found.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A medicine-man tells the brother to return the animal gifts to the woods where
    they were found; the brother obeys, bathes Red-Mountain-Lion in a creek, and Red-Mountain-Lion
    recovers but remains foolish.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Braveness is described as the handsome son of a cannibal, unmarried, and brave
    in hunting.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Braveness sees a young beautiful woman sitting under an elm tree; she says
    she has come to meet him and asks to be taken to his home as his wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The woman asks Braveness to go with her to her home and warns that her people
    will bother him and that jealous young men will kill him if he becomes angry.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: At high hills, the woman tells Braveness to lie on the ground and roll over
    twice; he does so and is changed into a buffalo.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The woman also rolls over and becomes a buffalo; from the hilltop they see
    thousands of buffalo, identified as her people, and they go to an old buffalo
    cow, her mother.
  category: sequence
  evidence_refs:
  - ev:6
