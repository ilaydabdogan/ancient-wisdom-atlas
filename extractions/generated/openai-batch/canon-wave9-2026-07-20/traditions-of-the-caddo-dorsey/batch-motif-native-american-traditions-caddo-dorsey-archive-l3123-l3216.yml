canonical_text:
  quote: ''
  summary: The passage describes a mortuary practice in which a fire is kept for six
    days and nights so a dead person may be restored; if the rite fails, the dead
    may become monkey-like beings in the timber. It then tells of a boy who eats snake
    meat and becomes a snake dwelling in a mountain hole, and begins another tale
    in which a talking dog reveals a wife’s secret visits to a snake in a tree hole,
    after which the husband kills the snake.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dead person's body is placed in a grave with the head toward the west and
    feet toward the east, and a fire is built at the feet for six days and nights.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: If the fire is allowed to go out before the sixth day ends, the grave may
    be found open with tracks leading toward the east.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: People build fire around the dead person with cedar and mulberry wood until
    sparks make the dead person look around and try to escape the sparks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the dead person begins to feel, people take hold of him, bring him home,
    keep him for six days and nights, bathe him on the sixth day, and he lives again.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:5
  text: A dead person who is not caught becomes something like a very large monkey
    and lives in thickets and timber among wild animals.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The monkey-like beings may talk to people, forget homes and relatives, ask
    hunters for wrestling matches, and bother people at night if ignored.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: One boy kills, cooks, and eats a large snake despite his friend's warning
    not to eat it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After eating snake meat, the boy begins to turn into a snake and is completely
    transformed after another day and night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The transformed boy asks his friend to find a mountain hole for him, tells
    his people to offer him presents when hunting, and says he will help them hunt.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A talking dog tells a man that his wife leaves home during his hunting absences,
    and the man asks the dog to follow her.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The wife whistles three times at a large tree; a big snake emerges from a
    large hole in the tree, coils around her body, and returns to the hole.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The husband makes arrows, falsely says he and the dog are going fishing, summons
    the tree-hole snake by whistling, kills it, and cuts it into fishlike pieces.
  category: sequence
  evidence_refs:
  - ev:10
