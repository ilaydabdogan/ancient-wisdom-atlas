canonical_text:
  quote: ''
  summary: A boy emerges from the earth with his grandparents while his parents remain
    behind. After his grandparents die, the grieving youth is claimed by the Moon
    as a son and is promised protection and power. He later shows foreknowledge, kills
    an entrusted child, is killed and buried by the people, returns alive from the
    grave, proves invulnerable in battle, expels arrowheads from his body, and finally
    ascends to the Moon. The following section begins an account of the first war
    party, in which the people divide into named groups, the Caddo prepare for fighting,
    young men form a circle around a buffalo hide, beat it with sticks, and sing through
    the night before a camp is chosen near water.
  language: English
  quote_policy: summarized
