  text: The grandparents cared for the boy despite poverty; after he became a successful
    hunter, his grandmother died and then his grandfather died, leaving him alone
    in mourning.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: While the boy was mourning and praying to die, the Moon appeared as a man,
    embraced him, claimed him as a son, and promised to watch over him and give him
    power.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A girl became the young man’s wife, and he foretold that someone several days
    away was coming with news for the chief.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: When asked to watch a sleeping child, the young man cut off the child’s leg;
