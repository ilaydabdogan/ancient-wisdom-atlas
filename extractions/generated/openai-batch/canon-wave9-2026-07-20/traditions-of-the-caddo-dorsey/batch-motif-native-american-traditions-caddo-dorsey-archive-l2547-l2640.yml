  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The people killed and buried the young man, but soon afterward he was reported
    alive with another family; the people saw that he had come out of the grave.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the tribe went to war and he stayed behind, the chief questioned him;
    the man called Coward said his father had not told him to have trouble with people,
    then took a war club and went to fight.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Enemy arrows did not kill him; he killed many enemies with a war club, later
    vomited up the arrowheads that had pierced him, bathed, and recovered.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Many years later he pointed to the Moon, identified it as his father, rose
