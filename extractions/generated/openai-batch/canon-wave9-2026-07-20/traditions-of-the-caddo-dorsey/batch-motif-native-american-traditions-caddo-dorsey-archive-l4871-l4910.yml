canonical_text:
  quote: ''
  summary: 'Coyote meets a powerful Buffalo and asks for power to become a Buffalo
    and eat grass. Buffalo grants power attributed to Great-Father-Above, but gives
    rules: use it only when necessary, only seven times, and do not give it away.
    After a repeated charging ordeal, Coyote becomes a young Buffalo and learns how
    to return to Coyote form by rolling in a Buffalo wallow. Coyote soon overuses
    the power and, while in Buffalo form, begins offering it to another famous Coyote
    despite the warning.'
  language: English
  quote_policy: summarized
