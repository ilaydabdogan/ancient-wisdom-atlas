canonical_text:
  quote: ''
  summary: 'The passage contains the end of one narrative in which a girl travels
    with Wild-Cats into the mountains, her brothers pursue them, and her father dies
    while searching for her. It then begins another narrative set at the beginning
    of the world, when people and animals understood one another: Hunter’s wife abuses
    their young son, throws him into a deep covered hole, and lies to Hunter while
    keeping him away from the hidden place during the search.'
  language: English
  quote_policy: summarized
