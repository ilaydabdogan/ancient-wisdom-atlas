canonical_text:
  quote: ''
  summary: The passage recounts survival from a flood on a rising mountain, the transformation
    of people left in the flood into water animals, a death-resistant man whose killing
    brings strife, and the origin of medicine-men through animal powers, dreams, songs,
    dances, and the shared dream-initiation of two brothers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man led selected people to a high mountain for four days while flood waters
    rose, and he caused the mountain to rise with the waters because his power exceeded
    that of the spirit of Cold or Heat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the waters went down, green things appeared again and the man led the
    people down from the mountain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: People left in the flood were said not to have drowned, but to have become
    alligators and other water animals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A man lived among the people who did women's work, dressed like women, went
    with women, and did not go with men; the men mocked him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: During a war, the man stayed behind with the women, and an old man threatened
    to have him killed because he would not fight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man said the Great Father had not sent him to fight, and said he could
    not be killed, would come to life, and would bewitch people so that they fought
    and killed one another.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The warriors beat the man, saw him revive, cut off his head, saw him run about
    headless, and finally killed him by cutting out a small purple spot on the little
    finger of his left hand.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the man's death, many people fought, quarreled, and killed close kin;
    others could not stop them because they were bewitched, and the people regretted
    killing him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In former days animals had wonderful powers, were friendly with people, and
    appeared in dreams or visions to reveal their secrets and powers.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: A dream recipient remained silent for several days, then taught songs and
    dances to friends and elders; those instructed called themselves medicine-men
    and used a six-day-and-night dance in a grass lodge for healing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The first medicine-men were two young brothers and brave hunters who camped
    in lonely woods and both dreamed that they walked together toward the east.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the shared dream the brothers met a man going west, received medicine from
    his bag for long life and being hard to kill, were taught how to use it, then
    woke, kept silent, reflected, and later tried their powers.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
