canonical_text:
  quote: ''
  summary: The passage recounts part of a story in which two brothers undergo tree-climbing
    ordeals, are restored from bones through a buffalo calf hide and black arrow,
    receive powers associated with thunder and lightning, cross a lake on a tree grown
    from a pecan nut, kill a cannibal old man who has stolen their wheel, recover
    and revive their mother from bones, return to their grieving father, and later
    leave the earth to become Lightning and Thunder in storm clouds. The passage also
    begins the next story, in which an orphan hunter is wounded by a stick, his leg
    swells, and a child emerges from it; his grandmother cares for the child.
  language: English
  quote_policy: summarized
