canonical_text:
  quote: ''
  summary: 'A hungry boy trapped in a hole is rescued by Coyote, lives kindly with
    him for several years, then returns home and arranges for Coyotes to kill his
    mother during a buffalo-hunt meat-giving ruse. A second narrative begins: a war
    party sends two close friends as spies; the married man lowers the single friend
    into a rock hole for water, abandons him, and falsely reports his death by enemies.
    The abandoned man starves in the hole and asks passing birds for help.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hungry boy in a hole hears someone at the edge, is afraid, and is told to
    catch the speaker's tail and climb out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After climbing out, the boy discovers the rescuer is Coyote, goes to Coyote's
    home, and remains there three or four years, treated kindly and happy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy asks Coyote to let him visit his father and says he is angry at his
    mother and intends to kill her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boy proposes a plan in which his parents will go on a buffalo hunt, Coyotes
    will howl nearby, his mother will bring meat to them, and the Coyotes will kill
    her after he pushes her over.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Coyote consents; the boy returns home, is welcomed by his father, and the
    next day father and son kill a buffalo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After supper, with Coyotes howling nearby, the boy tells his mother to carry
    meat on her back to feed the Coyotes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The mother is afraid because it is almost dark, but the boy reassures her
    that nothing ahead will hurt her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the mother steps among the Coyotes, the boy pushes her down and the Coyotes
    jump upon her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy returns to his father, reports what happened, and father and son live
    together for many years.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the next narrative, a war party chooses a leader, and the leader selects
    spies, including two close friends who always go together.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The two friends climb a high hill described as almost like a mountain and
    find a rock hole like an old well with water at the bottom.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The married man tells his friend to descend for water on a buffalo-hide rope;
    when the friend asks to be pulled up, the married man throws the rope down and
    leaves him.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The married man falsely tells the head man that enemies pursued them and killed
    his friend.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Because of a stated custom about deaths outside open battle, the war party
    gives up the expedition and returns home; the chief calls the people and tells
    them what happened.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The abandoned man starves in the hole, asks passing birds for help, and after
