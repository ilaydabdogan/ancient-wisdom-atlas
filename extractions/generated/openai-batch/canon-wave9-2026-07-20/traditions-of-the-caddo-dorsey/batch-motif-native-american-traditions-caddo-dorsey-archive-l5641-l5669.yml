  text: The water monster leaps up after the birds; the boy shoots at it, and the
    sixth arrow pierces it through so that it rolls over and floats on the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Medicine-Screech-Owl calls it the largest water monster in the world, pulls
    it to the bank with the bow, and disappears.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: When the boy returns to the lake, the water is low and clear; a sword-fish
    goes through him, and he shoots it with bow and arrow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the water is gone, the boy finds two large shells, cuts them to cover
    the holes made by the sword-fish, and wears one in front and one behind.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: The shells have the power to hear any sound in the whole world when the boy
