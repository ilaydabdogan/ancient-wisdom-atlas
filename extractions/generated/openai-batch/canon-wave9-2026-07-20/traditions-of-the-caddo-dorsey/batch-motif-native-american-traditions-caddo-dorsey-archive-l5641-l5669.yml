- id: obs:5
  text: Birds flying across the lake are drawn down when the lake leaps up, and the
    boy sees a large water monster in the water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Medicine-Screech-Owl appears as a boy of about the same age, promises to help
