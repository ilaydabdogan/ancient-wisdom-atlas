canonical_text:
  quote: ''
  summary: A leg-born child is abandoned at a lake, grows into a boy, kills a water
    monster with the aid of Medicine-Screech-Owl, is later pierced by a sword-fish,
    obtains two shells with world-hearing power, becomes a medicine-man, and retreats
    with his grandmother to a guarded mountain house while people plot against him.
  language: English
  quote_policy: summarized
