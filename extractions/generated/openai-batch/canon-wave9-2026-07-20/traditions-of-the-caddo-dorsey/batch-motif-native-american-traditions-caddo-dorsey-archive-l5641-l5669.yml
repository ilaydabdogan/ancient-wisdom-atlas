- id: obs:1
  text: An orphan boy lives with his grandmother and is known as a famous hunter.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A stick pierces the boy's leg and breaks off inside; the leg swells until
    the skin breaks and a child emerges.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The grandmother cares for the baby, but while she is away the boy takes the
    child to a lake and leaves it there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The abandoned child remains at the lake until it grows into a good-sized boy.
  category: sequence
  evidence_refs:
