canonical_text:
  quote: ''
  summary: 'The passage summarizes Caddo creation and early migrations: initial darkness,
    Moon chosen as chief, westward migration from the ground, Coyote''s interventions,
    the birth and deeds of Medicine-Screech-Owl, release of buffalo from a cave, Moon''s
    shame and placement above, the slaying of a dangerous water animal, Coyote''s
    later troublemaking, and the origin of day and night through black and white deer.'
  language: English
  quote_policy: summarized
