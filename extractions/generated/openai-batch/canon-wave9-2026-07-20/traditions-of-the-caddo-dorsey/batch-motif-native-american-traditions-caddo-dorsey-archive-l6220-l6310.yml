canonical_text:
  quote: ''
  summary: 'The passage contains several tale abstracts: Braveness survives a deadly
    race against Buffalo people through root, mud, and Wind''s aid, but later loses
    his wife and child when they become buffalo; a girl elopes with a handsome youth
    who reveals himself as Wild-Cat; Abut''s abused son is thrown into a hole, rescued
    by Coyote, and later has Coyotes kill his mother; a jealous companion abandons
    a man in a water-filled hole, but Buzzard rescues him and returns him home.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Braveness and the woman return home and become human again on the way; the
    woman asks him not to speak about the transformation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the Buffalo people's place, Braveness is warned that if he loses a foot
    race he will be killed; an unknown helper gives him a medicine root and mud to
    throw behind him during the race.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the race, root and mud put Braveness ahead, and a heavy wind keeps
    the Buffalo back until he reaches the goal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Braveness's child plays buffalo, rolls over twice, and becomes a buffalo calf;
    the mother becomes buffalo and runs away with the child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A beautiful girl dreams of a handsome youth, then sees him appear and agrees
    to leave with him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The youth tells the girl he is Wild-Cat; they climb a high mountain, and her
    brothers later overtake them near Wild-Cats dressed like men.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Abut's wife dislikes and abuses her young son, digs a deep hole, throws him
    in, and covers it with brush.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Coyote helps the hungry boy out of the hole, takes him home, and keeps him
    for several years.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The grown boy returns to his father and arranges for Coyote and family to
    kill his mother when she brings them meat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A married spy lowers his close friend into a well-like hole with water by
    a buffalo-hide rope, throws the rope in after him, leaves him, and falsely reports
    that the friend was killed by enemies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After birds ignore the trapped man, Buzzard brings medicine, carries him out
    of the hole, shelters him, and returns him near home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the rescued man returns, the betrayer's wife stays with him; later a
    husband scatters meat from a first-killed buffalo and says that when he dies the
    woman shall drop dead too.
  category: sequence
  evidence_refs:
  - ev:7
