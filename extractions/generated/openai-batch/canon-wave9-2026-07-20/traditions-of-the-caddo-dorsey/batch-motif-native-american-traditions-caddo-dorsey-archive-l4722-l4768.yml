canonical_text:
  quote: ''
  summary: Coyote sees white Geese playing on a lake and hides, intending to catch
    them. The Geese see him but pretend not to. Coyote feigns injury and claims that
    if he is killed all waters will dry up unless he is helped across. The Geese know
    he is lying, carry him into the air, and drop him into a hollow tree trunk. Trapped,
    Coyote prays for power and asks a Fly for help; the Fly says its power is too
    weak and goes to fetch a friend. The passage ends as Coyote hears a bird nearby.
  language: English
