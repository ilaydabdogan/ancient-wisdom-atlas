canonical_text:
  quote: ''
  summary: The passage ends a story in which Coyote closes a gate behind migrating
    people so dangerous buffalo cannot enter the new country. It then tells of a girl
    whose star brothers swing her from the sky to call buffalo, until Coyote breaks
    a warning and swings her so high that she disappears into the sky. The passage
    concludes with an old woman who keeps all pecans until Coyote kills her, after
    which pecan trees grow everywhere and belong to everyone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Buffalo surprise people, kill companions, and leave scattered bones; afterward
    buffalo eat many people until Coyote comes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people leave the dangerous country through a gate into a new country,
    and Coyote shuts the gate after them so dangerous animals cannot enter, allowing
    through only a few buffalo who have not tasted human flesh.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A girl with power to call buffalo lives with six brothers who are stars and
    travel through the sky every night.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Each morning the brothers place the girl in a lariat-rope swing hanging from
    the sky; when she swings through the air, buffalo see her and come.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The brothers warn Coyote not to swing the girl while they are gone, saying
    another person would swing her too hard so that she would go to the sky and never
    return.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Coyote breaks his promise, threatens the girl, pushes her in the swing, and
    pushes her higher and higher until she disappears; the buffalo do not come.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the brothers return, Coyote lies about the girl, the brothers know he
    caused her disappearance, drive him away, say he and his children will always
    be hungry, and decide to go to the sky with their sister.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: An old woman is described as mother to all pecan trees; she owns and gathers
    all the nuts, gives visitors only a few to eat, and does not allow them to carry
    pecans away.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The hungry field Rats choose four small, quiet, sly, troublesome boys to try
    to steal pecans from the old woman.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: One Rat boy confirms that the old woman is asleep; Coyote then appears and
    says he will kill her himself, because he wants most of the pecans.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Coyote visits the old woman, eats pecans, asks for more, strikes her on the
    head with a stone knife, and she dies; afterward pecan trees grow everywhere and
    belong to all the people.
  category: sequence
  evidence_refs:
  - ev:11
