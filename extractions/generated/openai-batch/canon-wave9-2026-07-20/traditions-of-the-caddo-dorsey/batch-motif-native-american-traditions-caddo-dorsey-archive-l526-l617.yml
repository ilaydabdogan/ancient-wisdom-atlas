canonical_text:
  quote: ''
  summary: Coyote secretly opens a cave or hole with a rock door where the Buzzards
    have buffalo, causing thousands of buffalo to spread onto the western prairies.
    He tells the people to make bows and arrows. Buzzard and his wife become real
    buzzards and live by eating dead things. The people make bows and arrows for hunting
    game. Moon, the chief, is exposed for abusing his young sister after she marks
    his forehead with black paint; Great-Father-Above takes Moon into the sky where
    people can see his shame marks. Medicine-Screech-Owl becomes chief, leads the
    people west over mountains, identifies a lake as Moon's tears, and begins an encounter
    with a dangerous water-dwelling animal named Cannibal.
  language: English
  quote_policy: summarized
