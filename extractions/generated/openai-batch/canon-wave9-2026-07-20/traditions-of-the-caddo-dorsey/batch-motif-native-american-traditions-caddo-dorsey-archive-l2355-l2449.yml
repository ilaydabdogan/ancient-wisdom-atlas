canonical_text:
  quote: ''
  summary: Morning Star proposes burning the grass over the whole world. Fire, aided
    by Black Snake and Skunk, sends fire around the world. The people make a soapweed
    rope to the sky; Crow fastens it, and the people climb up as the fire approaches.
    Bad animals also climb the rope, but Bat cuts it so they fall. A large animal
    tries to shelter the bad animals inside its body, but Bat causes it to sneeze
    them out, and the fire burns them. Bat is scorched, explaining bats' yellowish
    color, and the people return to a world made good. The next story begins by describing
    a new world in which fierce buffalo eat human beings; Buzzard alone has Father-given
    power to kill them. Human hunters flee from attacking buffalo, and one survivor
    escapes by climbing a tall tree.
  language: English
  quote_policy: summarized
