canonical_text:
  quote: ''
  summary: In the beginning of the Splinter Foot Boy passage, a child abandoned by
    a lake grows into a boy, encounters a bird-devouring water monster, and is aided
    by Medicine-Screech-Owl in killing it. The boy later survives being pierced by
    a sword-fish, gains two shells that can hear all sounds in the world, becomes
    a feared medicine-man, withdraws with his grandmother to a mountain house guarded
    by dogs, and is then approached by Medicine-Screech-Owl, who begins to neutralize
    his powers.
  language: English
  quote_policy: summarized
