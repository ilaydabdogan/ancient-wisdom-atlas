canonical_text:
  quote: ''
  summary: 'The passage ends a Buffalo Woman narrative: Braveness receives root and
    mud medicines from an unknown helper, wins a race against Buffalo competitors
    with final help from wind, and later loses his Buffalo wife and their child after
    the child becomes a Buffalo calf and the mother also becomes Buffalo. The passage
    then begins a separate Wild-Cat marriage narrative in which a proud young woman
    follows a handsome youth at night; he reveals that he is Wild-Cat, an animal,
    and she chooses to continue with him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unknown person gives Braveness a small medicine root and mud, instructing
    him to throw each behind him when pursuers come too close during the race.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Buffalo assemble from all directions to watch the race, an old Buffalo conveys
    the young Buffalo runners' request, and the young Buffalo mock Braveness when
    he joins them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Braveness starts the race ahead of the Buffalo, throws the root when they
    gain on him, and later throws the mud when a Buffalo is about to catch him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Near the goal, a heavy wind helps Braveness and keeps the Buffalo behind until
    he wins the race; he then identifies the earlier unknown helper as wind.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the race, Braveness remains with the Buffalo people without being molested,
    later returns to his people with his wife, and later visits his wife's people
    with their child.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The child's mother prevents him from playing with other boys, but he slips
    away while she is cooking and joins boys who are playing that they are Buffalo.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The child lies down to roll like a Buffalo, rolls over twice, and gets up
    as a real Buffalo calf; the boys run from him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mother finds her son changed into a Buffalo calf, takes him away, becomes
    a Buffalo herself, and runs away before Braveness returns from hunting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Braveness hears what happened, goes to the place where they rolled, sees their
    tracks, believes the report, and never hears of his wife or son again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A father and mother have three sons and a beautiful daughter who is proud
    and refuses many young men who court her.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A handsome youth visits the family's home, speaks with the father and brothers
    but pays no attention to the girl; after dreaming of him, she follows him out
    into the darkness.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When far from home, the youth tells the girl that he is not a real person
    but the animal Wild-Cat; he offers to take her back, but she refuses and chooses
    to go with him.
  category: speech
  evidence_refs:
  - ev:8
