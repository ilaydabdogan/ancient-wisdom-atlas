canonical_text:
  quote: ''
  summary: An old woman has seven hunter sons. Six older sons go hunting in turn and
    do not return, though their dogs come back. The youngest later follows Raccoon
    to a hollow tree, where the old woman has him throw down raccoons while she kills
    them and the dogs. The seventh Raccoon warns him that the old woman is a witch
    who has killed his brothers, and tells him to run home. He escapes. That night
    Coyote appears in a dream, says the brothers are alive but held working for bad
    people and in danger, and promises to help rescue them. The next day a man, Flying-Squirrel,
    and Coyote are involved in seeking information about the six brothers.
  language: English
  quote_policy: summarized
