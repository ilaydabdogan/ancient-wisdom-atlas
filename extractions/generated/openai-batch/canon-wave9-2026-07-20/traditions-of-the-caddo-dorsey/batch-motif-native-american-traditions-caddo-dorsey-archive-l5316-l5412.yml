canonical_text:
  quote: ''
  summary: 'The passage gives abstract summaries of Caddo traditions: people and animals
    begin together, some people are transformed into hunted animals, Coyote establishes
    permanent death in two related accounts, the dead go to the sky and stars, Tonin
    emerges from the earth and ascends to and returns from the sky, Snake-Woman distributes
    seeds with taboos, a sky man causes a flood and saves some people on a rising
    mountain, and an anomalous man’s killing introduces human strife.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People and animals live together and are described as the same in the beginning;
    after food becomes insufficient, a council of chiefs decides that some shall become
    animals hunted for food.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: People living near burnt grass are rolled in ashes until they become bears;
    the bears are given ten lives, with later lives arising from blood spilled on
    the ground, and they become fiercer through the sequence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: People living near long grass are rolled and become buffalo with ten lives;
    deer and then all other animals are made in the same way.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Coyote proposes that a dead person shall remain dead forever and never be
    seen again by living people; the people accept this rule.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: People are taken to the sky and become stars; the passage states that everyone
    is believed to go up to the sky when they die.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Morning-Star is named as leader of three brothers, Evening-Star, North-Star,
    and South-Star, who watch for approaching enemies; their father, Great-Star, is
    called chief of the people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: In a second origin-of-death account, there is initially no death, but too
    many people; Coyote wants people to die permanently, while others decide the dead
    should come back.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Medicine-Men build a grass lodge and set a white and black eagle feather on
    top as a sign that someone has died when it becomes bloody and falls over.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the death sign appears, Medicine-Men sing; in ten days a whirlwind comes
    from the west, circles, enters by the east, and a handsome young man or men appear
    from it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Coyote shuts the grass-house door when the whirlwind is about to enter; the
    spirit passes by, and permanent death is introduced.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: After permanent death is introduced, spirits of the dead wander over the earth
    until they find the road to spirit land.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:12
  text: Moon is the first man to come out of the earth; Tonin is the second man and
    is described as greater and more powerful than Moon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: Tonin is four feet high, rides a horse no bigger than a dog, can turn darkness
    into light, obtain anything by wishing, travel any distance by wishing, kill game
    by pointing his forefinger, disappear into the sky, and foretell the future.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:14
  text: Tonin announces that he will go away for six winters and seven summers, sings
    a death song on the sixth day, and is lifted from earth to sky.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:15
  text: When Tonin returns, stars become brighter and larger; large stars rise in
    the east, and Tonin comes back to earth, tells the people about the future, and
    later goes up into the sky without returning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:16
  text: Great-Father gives seeds of all growing things to Snake-Woman, who travels
    with her two sons to distribute six seeds of each plant kind to every person.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: Snake-Woman forbids people, especially children, to touch the seeds or point
    at them while they grow, and says she will send poisonous snakes if seeds are
    gathered too soon.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:18
  text: In the flood account, the waters of the earth dry up; people cut apart dead
    water animals, and a man from the sky comes from the west carrying a small green
    leaf.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:19
  text: The sky man says the people have abused him, motions the leaf in four directions,
    and water falls from it until waters rise over the world to the highest mountains
    except one.
  category: action
  evidence_refs:
  - ev:6
- id: obs:20
  text: The sky man leads a few people to the remaining mountain for four days, causes
    the mountain to rise with the waters, and later leads them down when green things
    appear again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:21
  text: After the flood, the survivors find that many people have been turned into
    alligators and other water animals.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:22
  text: An effeminate man works and dresses like women, refuses to go to war, and
    says he will bewitch people so they fight and kill one another if threatened.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:23
  text: Warriors beat the effeminate man, cut off his head, and see him run about
    headless; he dies only when a spot on the little finger of his left hand is cut
    out.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:24
  text: After the man dies, people begin to fight, quarrel, and kill one another;
    the old man tells them what the dead man had said, and they regret killing him.
  category: sequence
  evidence_refs:
  - ev:7
