candidate_motifs:
- id: motif:1
  label: Primordial human-animal sameness followed by transformation into hunted animals
  taxonomy_refs:
  - shapeshifter
  basis: The passage says people and animals are initially the same, then some people
    are changed into bears, buffalo, deer, and other animals for food.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage is an abstract and describes permanent transformations rather
    than voluntary shape-shifting.
- id: motif:2
  label: Animal lives renewed from blood
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: Bears are given ten lives, with later lives arising from spilled blood after
    each killing up to the tenth life; buffalo are also given ten lives.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: Blood-based renewal is explicit for bears; the buffalo ten lives are stated,
    but the mechanism is not detailed in the abstract.
- id: motif:3
  label: Permanent death replaces return of the dead
  taxonomy_refs:
  - death_rebirth
  - return
  basis: Coyote proposes permanent death in one account and blocks a spirit’s return
    in another, after which death forever is introduced.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The two summaries give related but distinct accounts of death’s origin.
- id: motif:4
  label: Dead ascend to sky and become stars
  taxonomy_refs:
  - afterlife_journey_map
  - ascent
  basis: The passage says people are taken to the sky and become stars and that everyone
    goes up to the sky when they die.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives an abstract belief statement rather than a detailed
    journey map.
- id: motif:5
  label: Earth-emergent sky-traveling culture figure who ascends, returns, prophesies,
    and departs
  taxonomy_refs:
  - culture_hero
  - ascent
  - return
  basis: Tonin comes out of the earth, has extraordinary powers, ascends to the sky,
    returns with signs in the stars, predicts future events, and later goes up into
    the sky without return.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The term culture hero is a classificatory motif label; the abstract itself
    does not use that term.
- id: motif:6
  label: Seed distribution with taboos and serpent punishment
