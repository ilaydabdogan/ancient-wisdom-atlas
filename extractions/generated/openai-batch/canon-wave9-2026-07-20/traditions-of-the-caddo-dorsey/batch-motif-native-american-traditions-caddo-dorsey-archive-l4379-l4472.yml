canonical_text:
  quote: ''
  summary: Two Caddo Coyote episodes are presented. In the first, Coyote asks a man
    about a fish and is instructed to fish by placing his tail through ice at the
    river; the water freezes around him, and the man reveals revenge for an earlier
    trick before shooting Coyote. In the second, Coyote, described as once a man disliked
    for cheating, tries to catch white geese near a lake, but his friend has made
    ash piles shaped like geese with hidden coals; Coyote jumps on the hot ashes,
    is badly burned, and dies.
  language: English
  quote_policy: summarized
