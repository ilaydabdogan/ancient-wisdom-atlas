canonical_text:
  quote: ''
  summary: The passage recounts Coyote delaying the Sun, the first village in the
    new world, Moon’s announcement of a powerful child sent by Great-Father-Above,
    the birth and teachings of Medicine-Screech-Owl, early animal-human communication
    and transformations, and Coyote’s disguise as a dog to learn how the Buzzard people
    obtain food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote waits for the Sun, says he is in trouble, and walks with the Sun while
    talking as they go slowly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Near the west, Coyote says he will defecate, goes behind bushes, runs away
    unseen, and leaves the Sun waiting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sun grows tired of waiting, continues slowly, looks back for Coyote, and
    goes down slowly; the narrative explains this as the reason the Sun lingers at
    sunset.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The people’s first village in the new world is named Tall-Timber-on-Top-of-the-Hill
    and is located in black-jack timber near the top of a high hill.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage identifies this first village as the beginning of the real people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Moon calls the people together and announces that a child will be born to
    a certain woman.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: Moon says the child will have more power than anyone else, has been sent by
    Great-Father-Above to his mother, the earth, and will teach the people right and
    wrong.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Moon says the child will name himself after the former chief Medicine-Screech-Owl
    and will have bow and arrows with him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: When the child is born, he has bow and arrows, speaks before his parents name
    him, and names himself Medicine-Screech-Owl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Medicine-Screech-Owl says bow and arrows are for men to kill game and will
    be needed in the future.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Medicine-Screech-Owl goes among the people and teaches them how to make bows
    and arrows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: In those times animals and human beings can talk to and understand one another,
    and some human beings begin to turn into animals.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Medicine-Screech-Owl recognizes that some people are not real human beings,
    visits the most ferocious animals on behalf of the people, and kills some animals
    that oppose or try to kill him.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:14
  text: The people have little to eat, while two people known as the Buzzards, living
    at the north end of the village, have plenty of meat and other food.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Coyote says he will visit the Buzzard people to find out where and how they
    obtain so much food, and says he must scheme.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: Coyote turns himself into a very small, fine-looking dog and arranges to be
    found by the Buzzards near the trail.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The Buzzard woman likes the dog, while the Buzzard man suspects it is not
