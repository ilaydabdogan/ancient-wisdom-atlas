canonical_text:
  quote: ''
  summary: 'The passage first describes the early emergence of people from the earth,
    naming Moon as the first man and Tonin as a more powerful second man who ascends
    into the sky, promises to return, returns with signs, prophesies strange people
    coming, and finally ascends again without return. It then recounts how the Great
    Father gives seeds and cultivation knowledge to Snake-Woman, who distributes seeds
    with her sons and establishes rules protecting growing plants by threat of a poisonous
    snake. The final excerpt begins a flood narrative: after drought dries all waters,
    people mistreat dead water animals; a sky-borne man from the west arrives with
    a green leaf, rebukes them, motions the leaf in four directions, and waters rise
    over the world.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the beginning, the people first came out of the earth into the world; Moon
    was the first man to enter, and Tonin was the second man and was said to be greater
    and more powerful than Moon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tonin is described as about four feet high, riding a bay horse no bigger than
    a dog, able to turn darkness into light, fulfill wishes immediately, travel instantly,
    and kill game by pointing with his forefinger.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tonin sometimes disappeared; one time the people saw him going upward into
    the blue sky as though on wings, and he was able to tell what would happen in
    the future.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tonin called the people to a meeting, spoke about the world, and announced
    that in six days he would go away for six winters and seven summers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the sixth day, Tonin sang the song of death and was gradually lifted from
    the earth into the sky while the people wept and remembered his promise to return.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: As Tonin's return time approached, the world changed, the stars became brighter
    and larger, one brother beat a drum six times as a sign, and a large bright star
    appeared in the east before Tonin returned to earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After returning, Tonin told the people that strange people would come into
    the land and frighten away buffalo, deer, and bear; later he said he would go
    again and not return, then went up into the sky.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Great Father gave the seeds of all growing things to Snake-Woman and taught
    her how to plant, care for, and prepare the plants for food.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Snake-Woman called her two sons to carry bags of seeds, and they traveled
    over the world giving six seeds of each kind of plant to every person.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Snake-Woman instructed recipients to plant and care for the seeds but not
    to touch or point at the growing plants; she said the unripe plants belonged to
    her and that early gathering would be punished by a poisonous snake bite.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: During a long hot dry season all waters dried up, the people wandered looking
    for water, became crazed, and cut up dead fish, turtles, and water animals because
    they blamed them for the disappearance of water.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: While the people acted foolishly, they saw a man in the sky coming from the
    west; a wind blew, he landed before them, carried a small green leaf, and told
    them they had not acted wisely and had abused him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The sky man moved the green leaf in four directions; drops of water fell from
    it, and the waters grew until they rose over the world to the tree-tops and the
    highest mountains except one.
  category: action
  evidence_refs:
  - ev:9
