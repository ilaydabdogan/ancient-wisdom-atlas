  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A planted pecan nut grows into a tree reaching the sky; each brother climbs
    it, drops his bones and head, and is restored from the bones under a buffalo calf
    hide by an arrow shot upward.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the ordeal, the younger boy has the power of thunder and the other boy
    has the power of lightning.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: At a large lake, another planted pecan grows into a large tree that bends
    over the lake and serves as a bridge.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Lightning boy says an old man has the lost wheel in his right side; the
    brothers kill the old man, find the wheel, and kill the old man's people.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The brothers find the Medicine-Man's wife's bones, cover them with buffalo
