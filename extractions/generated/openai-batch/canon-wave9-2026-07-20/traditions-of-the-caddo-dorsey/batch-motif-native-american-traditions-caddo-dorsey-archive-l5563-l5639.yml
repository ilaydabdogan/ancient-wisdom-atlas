canonical_text:
  quote: ''
  summary: Two Caddo narrative abstracts are included. In one, Lightning is banished
    for killing people but is recalled to destroy an underground monster and make
    earth safer. In the other, a Medicine-Man's son discovers and captures an unknown
    elder brother; the two boys survive dangers, recover a lost bark wheel, undergo
    a sky-tree ordeal that gives them thunder and lightning powers, restore the Medicine-Man's
    wife from bones, and finally leave the world to appear in storm clouds as Thunder
    and Lightning.
  language: English
  quote_policy: summarized
