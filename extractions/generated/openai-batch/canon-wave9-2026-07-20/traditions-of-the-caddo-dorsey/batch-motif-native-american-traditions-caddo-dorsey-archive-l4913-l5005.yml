canonical_text:
  quote: ''
  summary: The passage contains the end of a Coyote/Coyote-Buffalo encounter, followed
    by a Coyote-and-Turkeys episode in which Coyote traps Turkeys in a sack but loses
    them when his youngest son opens it, and a Coyote-and-Ducks episode in which Coyote
    loses his eyes after repeating a water-diving eye-restoration game beyond the
    Ducks' one-use power; a man then brings green buckeye balls to make new eyes for
    him.
  language: English
  quote_policy: summarized
