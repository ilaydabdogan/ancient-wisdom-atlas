canonical_text:
  quote: ''
  summary: Women use a favored old corn mill made from a hollowed tree trunk. Their
    corn begins disappearing during grinding. After they notice the mill is not the
    old one and call for an axe, the mill rolls over and Coyote emerges and runs away;
    the narrator explains that Coyote had become the corn mill and hidden the old
    one so he could eat the corn.
