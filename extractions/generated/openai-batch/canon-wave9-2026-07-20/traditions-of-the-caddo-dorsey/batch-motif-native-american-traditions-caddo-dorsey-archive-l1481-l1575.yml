canonical_text:
  quote: ''
  summary: A man called Medicine-Man lives with his wife and young son. The wife disappears
    after going to the creek for water, and father and son mourn beside a fire for
    six days. Later, while Medicine-Man hunts, an unknown boy of the son's size appears
    with bow and arrows, calls himself the son's elder brother, asks for secrecy,
    and repeatedly escapes when the father returns or hides. Medicine-Man attempts
    to capture him by disguising himself as a small insect and by hiding near the
    roof, but the unknown boy detects him; the excerpt ends as Medicine-Man proposes
    a hair-tying capture plan.
  language: English
  quote_policy: summarized
