canonical_text:
  quote: ''
  summary: Coyote tries unsuccessfully to catch Deer. Wind promises Coyote power to
    catch Deer, but Coyote steals a buffalo robe and uses it while searching. He mistakenly
    seizes the robe’s owner, who is Wind in human form. After Coyote deceives and
    mistreats Wind’s sister, Wind rescues her and punishes Coyote for stealing the
    robe and not waiting for the promised power.
  language: English
