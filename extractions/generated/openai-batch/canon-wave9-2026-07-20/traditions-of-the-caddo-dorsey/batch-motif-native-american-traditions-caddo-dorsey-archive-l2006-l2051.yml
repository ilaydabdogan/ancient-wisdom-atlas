canonical_text:
  quote: ''
  summary: The passage begins with the end of an episode in which an unnamed male
    kills three entering Tiiaii and reports the events to his parents. It then introduces
    Snow-and-Cold, a northern man whose overnight guests freeze before morning. Medicine-Screech-Owl
    travels to visit him, crosses a large lake by riding an eagle feather, avoids
    detection by warning geese, enters Snow-and-Cold's lodge unseen, reveals himself,
    and is given a bed of snow. During the night Snow-and-Cold watches him, expecting
    him to freeze, but sees a light near the boy's head caused by the eagle feather
    standing on his pillow.
  language: English
  quote_policy: summarized
