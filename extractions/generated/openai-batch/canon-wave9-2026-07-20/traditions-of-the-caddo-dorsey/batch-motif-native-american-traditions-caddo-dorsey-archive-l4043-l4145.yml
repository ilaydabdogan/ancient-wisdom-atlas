canonical_text:
  quote: ''
  summary: The passage contains a Caddo tradition in which Bear and Buffalo recount
    former human or human-like states, received powers, transformations, and relationships
    with humans, then demonstrate their powers against each other. It also begins
    the next tradition, in which Rabbit steals Mountain-Lion's teeth and uses a staged
    deception with his grandmother to make Mountain-Lion flee.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bear and Buffalo meet in a time when animals speak many languages but understand
    one another, and they discuss powers received from the Father.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bear says he was once a human being who lived and traveled with people, while
    his family camped near timber or mountains.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bear says a dream showed him his present form and place, and that he was given
    paws, claws, and sharp teeth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bear says that after awakening and becoming as he had dreamed, he left the
    people for mountains and woods, and people hunted him for food and tracked him
    with dogs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Buffalo says he too was once like a human being, and that his people were
    called Buffalo people because their oldest chief was named Buffalo.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Buffalo says the oldest chief was taken away by the Great-Powerful-One to
    another world, where the Buffalo people expected to meet him someday.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Buffalo says the Buffalo people were forbidden to enter this world because
    Coyote made a mistake, and they prayed that the Father would give Coyote powers
    and teach him to lead them in.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Buffalo says that to be in the same world as the people, the Buffalo people
    had to change into wild animals and become game to be killed and eaten by humans.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Buffalo says the Buffalo were given dangerous powers and horns to fight with.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Buffalo demonstrates his anger by throwing up earth, striking the ground with
    his horns, and knocking Bear down before Bear sees him start.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Bear demonstrates his anger by approaching a small tree, cutting it down with
    his teeth, springing upon Buffalo, and holding him down.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Rabbit enters Mountain-Lion's home while Mountain-Lion is absent, finds Mountain-Lion's
    teeth, steals them, and runs home.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Rabbit tells his grandmother to boil stones outside the door and to say that
    Rabbit's guest, called Chief of all the beasts, will eat them.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: Mountain-Lion comes looking for Rabbit, hears the grandmother's explanation
    about the stones and the named guest, backs away, and runs off.
  category: sequence
  evidence_refs:
  - ev:12
