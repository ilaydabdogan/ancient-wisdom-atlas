canonical_text:
  quote: ''
  summary: 'The passage gives abstracts of several Caddo narratives: a young man kills
    a child, is killed, returns from the grave, becomes arrow-proof, says Moon is
    his father, and ascends to Moon; the first war party is organized with council,
    song, rules, scouts, scalp-taking, and dance; a boy receives Cyclone power through
    water instructions and is later carried skyward; a cannibal living in a tree kills
    hunters before Mountain-Lion kills it; and the youngest of ten brothers defeats
    cannibals with unseen and Sun-aid, restores his brothers from bones, and returns
    home.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman asks a young man to watch her sleeping child while she gets water;
    after she leaves, he wakes the child and cuts off its leg, and the child dies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: People kill the young man, but he comes out of the grave looking as before;
    in battle, arrows fly off from him or pierce him without killing him, and he later
    vomits the arrow-heads, bathes, and recovers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After many years the young man tells the people that Moon is his father, then
    rises and goes up to Moon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the account of the first war party, people are divided into named groups,
    tribes begin fighting, and Caddo fight Kiowa and Comanche.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief summons young men, has those willing to fight sit in a circle, lays
    a large buffalo hide in the center, gives each man a stick, and the men beat the
    hide while singing a war song until Morning-Star drives the other stars away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The war party follows rules given by the chief, sends four spies near enemy
    country, fights the enemy, takes one scalp to show victory, and is met at home
    by painted and feathered people before a war dance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A boy sitting by a river after bathing hears a voice, sees a man rise through
    the water, and is told to dive four times while always facing west.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The man says he is the power of Cyclone and gives the boy his power; when
    the boy swings his arms, a black cloud, wind, uprooted trees, and disturbed waters
    appear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The boy is named Path-of-the-Cyclone, and years later people see him carried
    through the air to the sky on a cyclone.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: Three hunters find a large tree with a hole at its base, push burning leaves
    and grass into the hole, and a cannibal comes out.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The cannibal follows the hunters by scent, kills two of them, and carries
    them back to the tree; Mountain-Lion kills the cannibal before it overtakes the
    third man.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: White and black wolves eat the cannibal’s body, and people later cut down
    the tree where it lived and find two bodies, which they bury.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ten boys live with their grandmother; the older brothers go out one after
    another and do not return, until the youngest goes in search of them with an eagle
    feather in his hair.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: At a tipi, an old man says the youngest boy must perform work involving a
    log on the fire; when the boy cannot move the log, the old man tries to spear
    him with the iron nose of a mask.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: An unseen power pulls the boy away, the iron nose catches in the log, and
    a voice tells the boy to take a pounder from the woman pounding corn and beat
    the old man to death.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The boy gathers his brothers’ bones into nine piles; a strange man helps him,
    tells him to cover the bones with his robe and shoot an arrow upward, and the
    brothers come out from under the robe.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The strange man says he is Sun, says he helped destroy the cannibals, and
    after the brothers return home the people know that Sun is their friend and willing
    to help them.
  category: speech
  evidence_refs:
  - ev:9
