literal_observations:
- id: obs:1
  text: Running-Water finds Dog, whips him, pulls his tongue, runs a stick across
    his mouth, and the abstract says dogs have long tongues and big mouths from then
    on.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chicken-Hawk claims hunting success, receives antelope meat after Eagle kills
    the antelope, later cannot provide game, and cuts meat from his own legs; the
    abstract explains hawks' thin legs by this act.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bear says he was once a human being, dreamed he became Bear while a human
    pursued him with arrows, awoke to find it true, and left the people for mountains
    and woods.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Buffalo says Buffalo people were initially forbidden to enter this world because
    of Coyote's mistake, prayed to Father, changed into wild animals to be game for
    people, and received dangerous powers and horns.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Bear and Buffalo each demonstrate powers against the other: Buffalo rushes
    Bear before he can see the start, and Bear uses angry eyes, sharp teeth, and force
    to bring Buffalo down.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rabbit takes Mountain-Lion's teeth while Mountain-Lion is away and instructs
    his grandmother to frighten him with a claim about boiling stones for Rabbit's
    powerful guest.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Rabbit escapes Wild-Cat by offering to show him how to catch Turkeys, using
    a song and staged death to lure the Turkeys into a victory dance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At a beginning-of-world council about rain, Coyote rejects rain in the form
    of lead balls and proposes drops of water, which are accepted.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Coyote deceives Bear by claiming to be the son of a powerful medicine-man
