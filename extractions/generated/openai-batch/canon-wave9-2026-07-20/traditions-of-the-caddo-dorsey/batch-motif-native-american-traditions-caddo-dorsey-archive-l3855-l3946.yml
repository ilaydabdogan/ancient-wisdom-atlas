canonical_text:
  quote: ''
  summary: 'The passage concludes a narrative in which Buzzard rescues a man from
    a hole, takes him to the Buzzard home to recover, and returns him to his lodge,
    where his sister brings the wife of the jealous friend who had harmed him. The
    passage then describes the former husband’s repeated practice of cutting up and
    scattering the first buffalo he kills. A new tale begins: people settle near what
    they think is a large flat rock by the big water and dance on it, but it proves
    to be a giant turtle that carries them into the water and drowns them.'
  language: English
  quote_policy: summarized
