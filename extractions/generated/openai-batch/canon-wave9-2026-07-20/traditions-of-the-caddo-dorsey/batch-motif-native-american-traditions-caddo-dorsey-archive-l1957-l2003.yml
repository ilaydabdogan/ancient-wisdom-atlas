canonical_text:
  quote: ''
  summary: After an earlier attempt to kill the boy by filling a hole with stones
    and dirt, a witness reports that young Medicine-Screech-Owl is still alive. The
    ex-chief has the boy enter a large fire to test his powers; the boy remains unharmed,
    then makes another fire and has the ex-chief enter it, where the ex-chief dies.
    Medicine-Screech-Owl later roams away from his parents despite his mother's concern
    that envious people will try to kill him. He visits three enemies who invite him
    into their lodge, and he waits by the small door knowing they intend to attack
    him.
  language: English
  quote_policy: summarized
