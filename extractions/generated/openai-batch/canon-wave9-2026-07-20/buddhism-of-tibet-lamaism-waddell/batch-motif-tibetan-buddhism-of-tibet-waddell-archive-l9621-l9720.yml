canonical_text:
  quote: ''
  summary: 'The passage describes the education and ritual formation of a Tibetan
    Buddhist novice: instruction, discipline, a guru or radical Lama who initiates
    the novice into rites, vows to the Tri Ratna, precepts, mandala practice, consecrated
    monastic equipment, monastic schools, faculties of study, examinations, disputations,
    and promotion by memorized sacred texts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Monks from novice to senior and full monk are described as retaining the same
    title in chief Tibetan monasteries, while the term Lama is reserved for heads
    of the monastery.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The novice undergoes severe instruction, including corporal punishment, mainly
    in ritual and dogma, with crafts and painting taught to those with aptitude.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young monk’s spiritual adviser is called the radical Lama and is said
    to initiate the novice into mysterious rites and be revered by him throughout
    life.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the cited ordination sequence, the aspirant declares lifelong devotion
    to the Tri Ratna, and the Guru gives the ten precepts and commands their observance.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Guru obliterates the Tri Ratna Mandala, and the aspirant asks for monastic
    equipment including robes, bowls or cups, a short staff surmounted by a Chaitya,
    a water-pot, an umbrella, and sandals.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The aspirant makes a Mandal, places five flowers, five Drubakund, Khil, and
    rice in it, assumes a posture, joins his hands, repeats praises, receives consecrated
    items from the Guru, and vows observance of named disciplines.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Cloisters have a teacher of the law, and larger monasteries have schools or
    universities where holy books, theology, and related subjects are taught.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The text says Tibetan monastic study is practically divided into Sutras, Vinayas,
    and Abhidharmas, sometimes with medical and mystic faculties for magic and conjuration.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A monk’s position in the brotherhood depends on the number and class of holy
    books he has gone through and understands thoroughly.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: At the sound of the bell, a monk goes to his room or class for lessons, explanations,
    preparation for examinations, and disputations.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Within a year of admission the novice must attempt a first professional examination,
    later a second examination for promotion, and until passing he performs menial
    service such as serving tea to elder monks.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The examination is conducted before monastery heads and assembled monks, who
    remain silent while the candidate recites prescribed books by heart.
  category: action
  evidence_refs:
  - ev:9
