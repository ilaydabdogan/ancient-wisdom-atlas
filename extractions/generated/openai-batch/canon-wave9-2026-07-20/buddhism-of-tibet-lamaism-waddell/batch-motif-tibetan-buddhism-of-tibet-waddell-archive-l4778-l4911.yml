literal_observations:
- id: obs:1
  text: Muhiraurava is glossed as greater weeping and screaming; its sufferers are
    cooked in seething cauldrons of molten iron, and it is assigned to heretics.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tapana is glossed as heat; the condemned is enclosed in a red-hot fiery chamber,
    and the punished group is those who roasted or baked animals for food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pratapana is glossed as highest heat; a three-spiked burning spear is thrust
    into the body, which is then rolled within red-hot iron plates, and the punishment
    is specified for apostates and rejecters of the truth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Avichi is glossed as endless torture; the guilty is kept perpetually in flames
    without being consumed, and it is assigned to those who reviled Buddha, harmed
    or attempted to harm Lamaism, or shed the blood of a Lama or holy man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The cold hells are placed on the edge of the universe below the encircling
    wall, are surrounded by icy mountains, and have attendants of appalling aspect.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: In Arbuda, the naked person is constantly immersed in ice and glacier water
    until the body becomes covered with chilblains.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'Virarbuda, Atata, Hahava, and Ahaha present worsening cold torments: scarified
    chilblains, cries of anguish, a paralyzed tongue, and clenched jaws and teeth.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Utpala, Padma, and Pundarika are described through sores compared to blue,
    red, and great lotus flowers; in Pundarika the flesh falls from the bones and
    birds and insects with iron beaks peck and gnaw the wounds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The frontier or anterior hells stand at the exit from the great hell, are
    called the near-to-rebirth cycle, and are divided into four sections.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The first bordering hell consists of hot suffocating ashes, foul dead bodies,
    and offal, followed by a vast quagmire.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the quagmire comes a forest of spears and spikes to be traversed, followed
    by a great river of freezing water.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: On the far shore of the freezing river, squat tree-trunks with three spiked
    leaves impale unwary groping fugitives.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The ordinary litany for the dead asks that the chu-wo-gab-med ocean become
    a small rivulet and that the ts’al-na-ri tree become a divine wish-granting tree.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage states that there are eighty-four thousand external hells, situated
    mostly on earth in mountains, deserts, hot springs, and lakes.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Preta or Yi-dag state is placed above hell and below the Sitavan forest
    near Rajgriha; its beings are described as starvelings in constant distress from
    hunger and thirst.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: A note describes groups of Yi-dags, including beings whose food and drink
    become lacerating weapons and free Yi-dags that roam graveyards in the human world
    and injure humans.
  category: attribute
  evidence_refs:
  - ev:12
