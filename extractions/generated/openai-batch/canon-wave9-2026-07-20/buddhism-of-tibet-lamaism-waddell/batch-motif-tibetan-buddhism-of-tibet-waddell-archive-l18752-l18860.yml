comparison_claims:
- id: claim:1
  claim: The passage asserts a visual and iconographic relationship between Avalokita
    and Prajapati/Brahma, especially through shared insignia such as lotus, rosary,
    vase, and book.
  claim_level: visual_similarity
  target: Prajapati/Brahma iconography
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The excerpt reports the author’s claim and lists shared features, but
    does not provide independent historical evidence within the passage.
- id: claim:2
  claim: The passage says Avalokita’s eleven-headed form seems based on polycephalic
    Brahma.
  claim_level: visual_similarity
  target: polycephalic Brahma
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The relation is stated cautiously in the passage as seeming to be based
    on Brahma; the excerpt does not demonstrate transmission.
- id: claim:3
  claim: The passage compares Avalokita’s thousand eyes with the thousand-eyed Indra
    while emphasizing different placement and function for Avalokita’s eyes.
  claim_level: visual_similarity
  target: Brahmanic Indra as thousand-eyed god
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The passage explicitly notes a contrast: Avalokita’s extra eyes are
    on extra hands and linked to saving activity, unlike the brief Indra reference.'
- id: claim:4
  claim: A footnote links the head-splitting motif to early Buddhist works where an
    obstacle-raiser’s head would split into many pieces, but Avalokita’s head-splitting
    is caused by grief in the main description.
  claim_level: same_motif
  target: early Buddhist head-splitting associated with obstacles
  evidence_refs:
  - ev:3
  - ev:9
  counter_evidence_refs:
  - ev:3
  confidence: low
  limitations: Only the bodily motif of head-splitting is shared; the stated cause
    and narrative function differ.
