canonical_text:
  quote: ''
  summary: The passage describes several iconographic forms of Avalokita/Padma-pani,
    including four-handed, eleven-headed, and thousand-eyed forms; relates some features
    to Brahma and Indra; lists other male Bodhisats; and introduces Tara and Marici
    as chief female Bodhisats or energies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Avalokita’s image was modeled after Prajapati or Brahma
    and that his images often bear Brahma’s insignia, including lotus, rosary, vase,
    and book.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The four-handed form is described as princely, white-complexioned, seated
    in Buddha posture, with the front hands joined devotionally and upper hands holding
    a crystal rosary and a long-stemmed lotus.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The eleven-headed form is usually standing and has additional hands, some
    carrying weapons to defend votaries.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The eleven-headed form is said to represent Avalokita’s condition when his
    head split into pieces from grief at the deplorable state of humanity.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The eleven heads are arranged in a cone in five series, and the topmost head
    is Amitabha, identified as Avalokita’s spiritual father.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The forward-facing heads are benevolent, the left heads express anger at human
    faults, and the right faces smile graciously at good deeds or in scorn at evildoers.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The thousand-eyed form is connected with the names meaning that Avalokita
    looks down or has a face looking every way.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Avalokita’s extra eyes are placed on extra hands, and many of the hands are
    stretched forth to save the wretched and the lost.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage notes that other supernatural male Bodhisats are less commonly
    encountered and then lists several by Sanskrit or tentative Sanskrit names and
    Tibetan equivalents.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Samantabhadra is described as “the all good,” son of Vairocana, mild in type,
    usually mounted on an elephant, and often associated with Manjusri as attendant
    on Buddha.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The listed male Bodhisats include Kshitigarbha, Akasagarbha, Sarva vivarana
    vishkambhine, a tentative Jnanaguru, a tentative Prabhaketu, Pranidha namati,
    and Santendra.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage identifies Tara and Marici as the chief active supernatural female
    Bodhisats or energies.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Tara is glossed as saviour or deliverer, is called the consort of Avalokita,
    and is said to be very popular in Tibet.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: A footnote associates head-splitting with the presence of an obstacle in early
    Buddhist works and cites a statement about a head splitting into a hundred or
    a thousand pieces.
  category: other
  evidence_refs:
  - ev:9
