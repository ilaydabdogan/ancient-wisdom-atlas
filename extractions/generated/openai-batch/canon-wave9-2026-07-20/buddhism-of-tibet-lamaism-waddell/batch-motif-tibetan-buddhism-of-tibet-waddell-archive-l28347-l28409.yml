  evidence_refs:
  - ev:1
- id: obs:3
  text: The play at Tashi-lhunpo is described as occurring in a large court below
    the palace, with surrounding galleries or balconies crowded with spectators and
    arranged by social rank.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stage manager holds a dorje and is described as hell-like Dorje-ch'an
    while wearing an abbot's hat.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: After a prayer, a figure representing Dharmatala enters; the passage states
    that Dharmatala invited the sixteen Sthaviras to China for the diffusion of Buddhism.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Dharmatala figure has a dark mask with a yawning mouth, and spectators
    throw scarves to him, which are picked up by his two wives with painted yellow
    complexions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The performance sequence includes four kings of the quarters, about sixty
    sons of the gods, Indian acharyas, and four cemetery warders in skeleton dress.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The body of the devil in effigy is burned by setting a pile of dry sedge on
    fire upon it, and incense is burned on nearby hilltops.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage describes masks as made in Tibet from mashed paper and cloth,
