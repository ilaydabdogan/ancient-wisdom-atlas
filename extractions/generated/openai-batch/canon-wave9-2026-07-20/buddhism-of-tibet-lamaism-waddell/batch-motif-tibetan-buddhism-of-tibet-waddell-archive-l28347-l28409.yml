  quote: ''
  summary: The passage describes arrangements and spectators for a Tibetan religious
    play, an account of the performance at Tashi-lhunpo, the sequence of represented
    figures entering the stage, the burning of a devil effigy, incense burned on nearby
    hilltops, and the materials and forms of masks used in Tibet, Sikhim, and Bhotan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Lama acting as regent is described as Tibet's de facto ruler and is known
    as the king and as the country's majesty.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Invited superior guests and nobility may pitch tents on the roof of the monks'
    quarters, while the populace is kept outside the arena by a rope barrier.
