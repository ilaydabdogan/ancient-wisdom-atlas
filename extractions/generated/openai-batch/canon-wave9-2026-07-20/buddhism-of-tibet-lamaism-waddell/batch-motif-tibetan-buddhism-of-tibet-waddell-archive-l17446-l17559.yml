canonical_text:
  quote: ''
  summary: The passage gives an iconographic note on Tibetan Buddhist mild and angry
    deity types. Mild deities are described as youthful princely figures with lotus
    thrones, halos, Indian-style dress, ornaments, distinctive hair, and smiling goddesses.
    Angry or demoniacal deities are described as monstrous, wrathful figures with
    large heads, scowling brows, third eyes, fangs, rolling tongues, animal supports,
    colored erect hair, and sometimes curls interpreted as coiled snakes. The passage
    also includes captions for the Buddha of Boundless Life and the she-devil Devi/Lha-mo,
    and a footnote comparing the third-eye feature with Hindi Bhairava and Kali.
  language: English
  quote_policy: summarized
