canonical_text:
  quote: ''
  summary: The passage describes Lamaist monasteries in China, especially the imperial
    Pekin monastery Yun-ho Kung, its Mongolian monks, Tibetan reincarnate abbot and
    assistants, multilingual printing-house, and chief temple with a colossal ornamented
    Buddha image and ritual furnishings. It also notes Wu-tai-shan as a celebrated
    shrine and Kumbum as the birthplace of St. Tson-K’a-pa, where a legendary white
    sandal tree is said to have sprung from placental blood at his birth and to bear
    many sacred images or letters on its leaves.
  language: English
  quote_policy: summarized
