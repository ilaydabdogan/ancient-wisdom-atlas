canonical_text:
  quote: ''
  summary: The passage describes Tibetan divination boards and dice-oracles. A sample
    board entry for Bhagavan gives auspicious and protective predictions together
    with prescriptions for worship, monks' readings, hand-clapping rites, charms,
    and wealth rites. The passage then lists divinities attached to numbered outcomes
    and describes ordinary dice, a solitary lettered die used with Manjusri's manual,
    the materials of the die, and sample portent categories for the letter A.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The No. 1 board result is associated with Bhagavan and says the addressee
    is of the wise class or will obtain a wise son; it also predicts realization of
    desire, long life, and freedom from sickness after proper worship of the addressee's
    god.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The same result distinguishes male and female cases: for a male the blessing
    lasts nine years, while for a female nine monks must read the Nyithi Abidharma
    and four monks must perform dok-pa by clapping hands to drive away evil spirits.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says a king demon in the south is angry with the addressee; it
    prescribes worship of that demon and wearing his charm, and also mentions danger
    to children, threatened loss of valuables, and worship for obtaining wealth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage lists divinities assigned to other numbered divination results
    from 2 to 28 and states that their names indicate the nature of the divination.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Two main kinds of dice are described: ordinary ivory or bone dice marked
    with black dots from one to six, and a solitary wooden cube with letters corresponding
    to a manual; loaded dice are also mentioned in connection with a scape-goat ceremony.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ordinary ivory dice are used as a set of three with the Lhamo Me, described
    as the goddess' divination manual, which provides results from three to eighteen;
    the dice are thrown on the book from the hand or, among wealthier users, from
    a wooden bowl onto a pad.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The solitary wooden die is used with the manual of Manjusri and bears six
    letters of Manjusri''s spell: A, R, P, TS, N, and DI; the die should be made from
    specified sacred or valued materials including Manjusri''s sacred bla tree.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The manual for the lettered die divides each letter's portent into practical
    categories such as house, favours, life, medical concerns, enemies, travel, lost
    property, wealth, and sickness; for the letter A it gives different results for
    great Lamas, lay officers, and low people.
  category: sequence
  evidence_refs:
  - ev:7
