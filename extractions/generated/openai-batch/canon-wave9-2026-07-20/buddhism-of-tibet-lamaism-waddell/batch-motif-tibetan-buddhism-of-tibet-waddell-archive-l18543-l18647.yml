canonical_text:
  quote: cure by sympathetic magic
  summary: The passage describes later Tantric demoniacal Buddhas, the Thirty-five
    Buddhas invoked in a confession rite, and a popular group of eight Medical Tathagatas
    or Highest Healers. It emphasizes the healer Buddha as a supreme physician, explains
    healing by sacred image contact, lists iconographic colors and hand poses for
    the medical Buddhas, places Sakya Muni at the center of the group, notes Tibetan
    interpretations of European effigies as Buddhas, and begins a definition of celestial
    Bodhisats as active reflexes of celestial Buddhas.
  language: English
  quote_policy: quoted
