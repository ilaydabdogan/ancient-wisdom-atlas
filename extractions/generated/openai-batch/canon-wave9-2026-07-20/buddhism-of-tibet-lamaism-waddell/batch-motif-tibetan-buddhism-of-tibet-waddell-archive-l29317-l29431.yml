canonical_text:
  quote: ''
  summary: The passage closes a Prince Visvantara play with the prince’s return, restoration,
    renewed charity, royal marriages, succession, and a local Tibetan identification
    of dramatic figures and places with later Tibetan Buddhist history. It then introduces
    the Tibetan Sudhana Jataka, listing masked dramatis personae and summarizing a
    plot involving a prosperity-giving Naga, a sorcerer, a hunter and magic noose,
    the capture and marriage of a celestial Kinnari, jealous wives, a charmed ring,
    and the prince’s quest to recover the Kinnari from her supernatural home. The
    passage also notes comparisons with southern Buddhist versions and western swan-maiden
    folk-tales.
  language: English
  quote_policy: summarized
