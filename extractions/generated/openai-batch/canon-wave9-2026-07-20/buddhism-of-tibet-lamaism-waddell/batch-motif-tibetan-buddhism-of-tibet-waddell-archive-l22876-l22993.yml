canonical_text:
  quote: ''
  summary: 'The passage opens with damaged musical-score material, then lists daily
    Ge-lugpa/Lamaist ritual services: refuge, prayers, offerings, invocations, salutations,
    confession, praise, turning the Wheel of the Law, prayers for Nirvana and blessing,
    a magic-circle offering of the universe, tutelary invocation, and an after-dark
    sacrificial banquet to demons. It then introduces Tara worship as a common devotional
    manual known by many laypeople, describing Tara as a virgin, goddess of mercy,
    and mother figure in some editions.'
  language: English
  quote_policy: summarized
