canonical_text:
  quote: ''
  summary: The passage explains names and sites of several Sikkim monasteries, often
    deriving their names from Tibetan terms for physical features, auspicious qualities,
    devotional objects, or sacred figures. It includes a local allegation that Padma-sambhava
    saw and suppressed demons beneath one site. It then describes required consecration
    rites before building a monastery, including invocation of a tutelary deity, foundation
    prayers, and deposition of charms, benedictions, and relics in a hollow stone.
    It also summarizes monastery size, layout, educational function, and architectural
    comparisons with Indian, Tibetan, and Ladakh examples.
  language: English
  quote_policy: summarized
