canonical_text:
  quote: ''
  summary: The passage surveys Tibetan monasteries and their ritual objects, lineages,
    shrines, cave practices, relics, and reported supernatural claims. It describes
    Mindolling’s water-driven prayer wheels and hereditary Lama succession, Satu’s
    cave-hermitages and magical instruction, Guro Ch’o-wang’s sacred stuffed horse
    and a stolen relic episode, Lha Lung’s incarnations and demon-suppression rites,
    Karchu’s holy water in a sacred cave, and Gyantse’s lamps, images, and stuffed
    animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mindolling is described as a great Nin-ma monastery near Samye, with Mindolling
    river water turning numerous large prayer-wheels.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mindolling’s chief temple is described as nine storeys high, with twenty minor
    temples, images, books, and a massive stone stairway approach.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chief Lama of Mindolling is described as a direct descendant of the revelation-finder
    Dag-lin, with succession by descent rather than by reincarnation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage describes one son becoming a celibate Lama and another son marrying
    to continue the lineage; if the lay brother dies without issue, the Lama is expected
    to marry the widow.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The body of a deceased Lama at Mindolling is said to be salted and preserved.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Satu monastery, instruction is given in magical incantations, and devotees
    are immured for years in cave-hermitages.
  category: action
  evidence_refs:
  - ev:4
