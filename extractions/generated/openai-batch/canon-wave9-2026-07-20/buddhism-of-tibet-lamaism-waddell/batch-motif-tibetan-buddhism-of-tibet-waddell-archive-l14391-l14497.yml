  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The horse’s leg was said to have been stolen by a Khamba pilgrim to enchant
    the ponies of Kham; the thief became insane, and a high priest divined that he
    had stolen something sacred.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the priest’s divination, the stolen horse leg was secretly restored,
