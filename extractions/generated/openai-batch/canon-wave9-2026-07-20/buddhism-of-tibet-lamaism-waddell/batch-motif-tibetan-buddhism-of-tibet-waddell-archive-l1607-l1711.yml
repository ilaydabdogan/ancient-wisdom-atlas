canonical_text:
  quote: ''
  summary: 'The passage presents Waddell''s account of early Lamaism''s development:
    a previously discussed founder is deified as a “second Buddha”; Lamaism advances
    through royal patronage; a Lhasa treaty edict invokes Buddhist and celestial witnesses;
    Ralpachan sponsors translation, monastic endowments, and annals; Lan Darma persecutes
    the Lamas; and Pal-dorje assassinates Lan Darma while disguised as a black-hat
    devil-dancer, after which the event is ritually remembered.'
