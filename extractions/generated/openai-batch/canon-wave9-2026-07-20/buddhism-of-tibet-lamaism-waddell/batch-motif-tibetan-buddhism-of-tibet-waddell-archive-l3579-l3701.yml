    borrowed from Nin-ma books and newer schools.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Sa-kya-pa has two reformed sub-sects, the Nor-pa and the Jonang-pa; the
    Jonang-pa issued from the Sa-kya-pa through Je-Kun-gah-dol-ch’og and included
    Taranatha.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Taranatha is described as born in Tsang, educated in the Jonang monastery,
    founder of Tag-brten monastery, a later founder of monasteries in Mongolia under
