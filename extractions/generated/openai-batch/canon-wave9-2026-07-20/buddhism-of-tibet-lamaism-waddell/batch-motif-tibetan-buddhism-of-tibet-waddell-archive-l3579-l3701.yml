literal_observations:
- id: obs:1
  text: In Bhotan, the Dug-pa sect is described as possessing both temporal and spiritual
    power and suppressing other sects there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Di-kung-pa sub-sect is said to have originated with a pupil of Dvag-po
    and to take its title from the Di-kung monastery founded in 1177 A.D.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ta-lung-pa is described as issuing from the Di-kung-pa, taking its title
