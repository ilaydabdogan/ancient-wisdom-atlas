canonical_text:
  quote: ''
  summary: The passage describes the Lhasa Cathedral sanctuary, its chapels, altar,
    holy niche, ranked thrones and seats, the high altar with the revered Buddha Sakya
    Muni image Jo-vo Rin-po-ch’e, other divine and historical images, relics and vessels,
    prayer machines, state and monastic rooms, surrounding walls and towers, and a
    rule forbidding women to remain inside the walls overnight. It also reports beliefs
    about the Buddha image’s royal gift history and a footnote tradition about a self-created
    Avalokita image formed by emanations from five figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sanctuary is described as square, with six chapels, a place for an offering
    altar in the middle, and a quadrangular niche on the west side in the lowest depth
    of the edifice.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists ranked thrones and seats for the Dalai Lama, the Tashi Grand
    Lama, regenerated Lamas, abbots, higher priesthood, the king of the Law, and four
    ministers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The high altar on the west side of the niche has several steps, small gold
    and silver statues, lamps, incensories, sacrifices, and a large gilded Buddha
    image behind a silver-gilt screen.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Buddha image is called Jo-vo Rin-po-ch’e, represents Buddha as a young
