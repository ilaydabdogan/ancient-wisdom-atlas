canonical_text:
  quote: "“Each of these Sthavira or Arhuts is figured in a fixed attitude, and each
    has his distinctive symbol or badge.”"
  summary: 'The passage describes Tibetan Buddhist saint iconography, especially Indian
    saints: the chief disciples of Buddha, the sixteen Sthavira or Arhats, and the
    additional figures Dharmatrata and Hvashang. It emphasizes halos, relative scale,
    former-birth scenes, fixed gestures, badges, implements, missionary destinations,
    and cross-cultural identifications with Chinese, Japanese, and other iconographic
    types.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The saints of Lamaism are divided into Indian and Tibetan groups, with a few
    Chinese and Mongolian figures included.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Saints are usually shown with halos around their heads and, when shown with
    disciples, are represented as larger than the disciples.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Saints are usually surrounded by scenes described as their former births in
    keeping with later fiction of reincarnate Lamas.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sariputra and Maha-Maugdalayina are described as a model pair and as the right-
    and left-hand disciples of Buddha, commonly standing with a begging bowl and alarm-staff
    or with hands joined in adoration of Sakya Muni.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sixteen Sthavira are also called Arhats, Rahan, or Lohan, and two additional
    saints, Dharmatrata and Hvashang, bring the list to eighteen in later usage.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each Sthavira or Arhat is said to have a fixed attitude and a distinctive
    symbol or badge.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Sthavira list assigns named saints particular objects, gestures, and destinations,
    including censers, fly-whisks, earrings, books, jewelled objects, an ichneumon,
    a vase, an alarm-staff, a caitya, mountains, islands, and regions.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Dharmatrata or Dharmatala is described as holding a vase and fly-whisk, carrying
    a bundle of books on his back, gazing at a small image of Buddha Amitabha, and
    having long hair because he is a lay-devotee.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hvashang is described as corresponding to the Chinese Huo-shang or priest
    with the sack; he is a lay-patron or dispenser of alms, portly and seated, with
    a sack, a rosary, a peach, and little urchins or goblins around him.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hvashang is explained in the passage as a last incarnation of Maitreya, and
    a related big-bellied laughing Maitreya image is said to appear in entrance halls
    of larger Chinese temples.
  category: relationship
  evidence_refs:
  - ev:7
