canonical_text:
  quote: ''
  summary: After Nan-sa has been beaten, household servants plead with the lord to
    stop. A nearby lama, disguising himself as a poor beggar and bringing a trick
    monkey, sings moral examples to Nan-sa at her chamber window and urges religious
    reflection. Nan-sa declares her wish to devote her life to religion and gives
    him her ornaments after receiving guidance. Her lord misreads the scene, beats
    her with Ani-Nemo's help until she dies, and the young prince later finds her
    corpse.
  language: English
  quote_policy: summarized
