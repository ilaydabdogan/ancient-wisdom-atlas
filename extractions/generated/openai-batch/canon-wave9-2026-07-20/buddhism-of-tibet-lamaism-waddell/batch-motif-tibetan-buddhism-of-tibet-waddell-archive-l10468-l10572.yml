canonical_text:
  quote: ''
  summary: The passage describes Tibetan Lamaist hats and cowls, their sectarian and
    hierarchical restrictions, ritual uses, and symbolic meanings. It gives particular
    attention to Padma-sambhava’s mitre-like U-gyan-Pandit hat, Gelug-pa hats with
    symbolic tails, stitches, white interiors, and crests, rank-specific hats for
    lamas and nuns, a Panchen Lama hat shaped after a hill, and Atisa’s hat fashioned
    after the Asura cave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Tail length on a garment or headgear is differentiated by rank: abbots have
    shorter tails, ordinary monks shorter still, and novices no tails; it can be used
    when walking and riding.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Padma-sambhava’s mitre-like hat is called the U-gyan-Pandit and is identified
    as the typical hat of the unreformed Nin-ma sect.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The U-gyan-Pandit hat is described as an Indian-model hat with upturned lappets
    divided to suggest a red lotus, referring to Padma-sambhava’s name, “The Lotus-born,”
    and to his legendary birth from a red lotus-flower.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage links Padma-sambhava’s native country with Udyana, between Afghanistan
    and Kashmir, and states that a tall conical crown remains a feature of caps in
    those regions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Nin-ma sect wears the U-gyan-Pandit hat during empowering, oblations,
    and sacred dances.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The largest form of the U-gyan-Pandit hat is surmounted by a golden vajra,
    called the “Devil subduer,” and worn by head lamas when giving the king holy water
    and at the highest festivals.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The helmet-like rTse-zwa sgro-lugs hat is common to Ge-lug-pa Lamas and is
    used with a cope when going to mass; on entering the temple it is removed and
    thrown over the left shoulder.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The long tails of the rTse-zwa sgro-lugs hat are stitched to imitate beaded
    book-covers, so that grasping the tails is associated with grasping the scriptures
    and drawing many animals to salvation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The three lateral stitches in the tails are said to typify the Tripitaka,
    the three original sins or “fires,” and the sins of body, speech, and mind, for
    which the Tripitaka are antidotes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The hat’s long tails suggest the extension and long endurance of doctrine;
    marginal stitches represent twelve commands; a white inside suggests a clean and
    pure heart; and the crest represents doctrinal insight.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Additional stitches or higher crests are used to mark higher divinity degrees
    or restricted lama ranks.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:12
  text: Nuns wear skull-caps of woollen cloth or fur, colored yellow or red according
    to sect.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: Some named hats are confined to specific chapels, monastic institutions, ritual
    sacrifices, dances, and ranks such as re-embodied lamas, abbots, the Dalai Lama,
    and the Panchen Lama.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
- id: obs:14
  text: A hat designed by Panchen Lobzang Chokyi Gyaltsen is shaped after dBen-dgon
    hill and worn by the Grand Panchen Lama and four abbots of Tashi-lhunpo when presiding
    at disputations.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: A yellow long-tailed hat is described as a variety whose tails were lengthened
    by Tson Kapa and which is worn by high-ranking lamas and the regent during assembly
    mass and empowering.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: The Jo-zwa-glin-gsum hat is formed after the fashion of the Asura cave, was
    worn by Atisa on his way to Tibet at the Nepalese shrine Svayambhunath, and later
    became a sectarian hat of the Kah-dam-pa.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: The Jo-zwa-glin-gsum hat was originally red, was changed to yellow by the
    Ge-lug-pa, and is now worn only by Ge-lug-pa hermits outside monastery or quarters.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:18
  text: The Sa-skya hat is described as a later introduction; originally Sa-skya lamas
    wore the Urgyen-pen-zwa of the unreformed party.
  category: relationship
  evidence_refs:
  - ev:10
