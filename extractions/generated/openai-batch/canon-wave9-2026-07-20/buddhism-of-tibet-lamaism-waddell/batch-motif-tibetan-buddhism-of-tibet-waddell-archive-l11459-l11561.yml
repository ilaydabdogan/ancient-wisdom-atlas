canonical_text:
  quote: ''
  summary: The passage gives translated prayers attached to gift and food offerings,
    describes monastic tea intervals and liturgies, notes masses for deceased or sick
    laypeople, describes monks leaving assembly and performing private devotions,
    and records a sunrise salutation and mantra to the goddess Marici for protection
    from fears.
  language: English with transliterated Sanskrit/Tibetan ritual terms and mantras
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mantra is said to cleanse sins when repeated once and to fulfill the desires
    of those dispensing gifts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prayers ask for bliss, meditative food, rebirths of wisdom without thirst,
    hunger, or disease, and freedom from birth, old age, disease, and death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prayers include wishes that gift-dispensers, human beings, animals, Buddhists,
    gods, a king, and the populace gain happiness, long life, health, and deliverance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: After tea-refreshment, several liturgies and offerings are performed, including
    the Great Compassionator's liturgy, praises of Sthaviras, mandala offering, and
    worship of a tutelary deity.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Long tutelary liturgies may be interrupted for further tea-refreshment.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the interval of a tutelary's worship, sacerdotal services may be performed
    for laypeople, including masses for the sick or for a deceased person's soul.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: For a deceased person, the death and relatives' offerings are publicly announced,
    and Lamas perform a service for sending the soul to the western paradise.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: For a sick person, the Lamas perform the Ku-rim ceremony.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the tutelary's service concludes, tea and soup are served, another chant
    is performed, and the assembly closes with monks filing out by bench order and
    seniority.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Monks retire to their cells for private devotions and offer food to their
    tutelary deities.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Some monks mark the duration of devotional exercises by spinning a table-prayer-wheel
    with finger and thumb.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: At first sight of sunrise, the monk removes his hat, faces the sun, raises
    his right hand in salutation, and chants a formula announcing the sun and Marici's
    arising.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Marici prayer asks for protection from fears including foes, robbers,
    wild beasts, snakes, poisons, weapons, fire or water, and high precipices.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: A second assembly called the After-heat is held around 9 a.m.; conch blasts
    signal successive actions by the monks.
  category: sequence
  evidence_refs:
  - ev:6
