canonical_text:
  quote: ''
  summary: The passage describes Tibetan treasure-associated gods, deified mountains,
    the twelve Tén-ma furies under Ekajati, deified hero-ghosts including Pe-har,
    and local gods or genii loci tied to fixed places. It notes their appearances,
    habitats in soil, lakes, trees, rocks, and springs, and their propitiation through
    offerings, wine, and occasional bloody sacrifice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A treasure-associated god is described as red, armored, carrying a victory
    banner, mounted on a white lion, good-natured but impassive, and less worshipped
    than more actively malignant deities.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage names four greatest deified mountains of Tibet by cardinal direction
    and states that Mount Everest, called Lap-c’i-gan by Tibetans, is not included
    among them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The twelve furies called Tén-ma are divided into three groups of four and
    placed under Ekajati, who is described as a fiendess of the Indian Kali type riding
    on thunder-clouds.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Deified ghosts of heroes and defeated rivals are usually anthropomorphic and
    Tibetan-clad, though some are pictured as monstrous fierce fiends.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pe-har is described as a fiend of the “king” class, an apparent indigenous
    deified hero, and a patron of sorcerers of the established church.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: European writers are reported as identifying Pe-har with the Indian god Veda,
    Chinese wei-to, who is invoked by Chinese Buddhists for monastic supplies and
    as protector of monasteries.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The local gods or genii loci, called foundation owners, are located at fixed
    places and are seldom conceived apart from those places.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The local gods are described as mostly Caliban-like, ill-tempered, spiteful
    or demoniacal sprites, and lacking a third or heavenly eye.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The earth-owner class occupies soil and lakes, while the more malignant gNan
    infest trees, rocks, and springs; these haunts are avoided or propitiated with
    red paint or other offerings.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: In monasteries and temples, an image of the genius loci is placed within the
    outer gateway, usually right of the door, and worshipped with wine and occasional
    bloody sacrifice.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The local demon of the red hill near Lhisa, Potala, is named gNan-ch’en Tan.
  category: relationship
  evidence_refs:
  - ev:10
