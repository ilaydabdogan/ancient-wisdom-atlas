canonical_text:
  quote: ''
  summary: The passage explains that the objects or insignia held by Buddhist images
    indicate their functions, using Manjusri as an example. It then describes how
    the Lamaist pantheon contains many stereotyped deity forms, including title-based
    variants, and introduces the Buddhas as a class whose images are mostly based
    on five conventional attitudes associated with episodes of the historical Buddha’s
    Buddhahood.
  language: English
  quote_policy: summarized
