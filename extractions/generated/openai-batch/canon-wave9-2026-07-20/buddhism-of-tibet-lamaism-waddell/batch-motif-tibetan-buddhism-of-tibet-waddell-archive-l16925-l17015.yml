canonical_text:
  quote: ''
  summary: The passage describes a formal reception before the Grand Lama, a child
    enthroned with ritual attendants, blessing gestures, tea, consecrated rice, hymn,
    prostration, and the distribution of consecrated pills and a red silk blessing-knot.
    It then shifts to an expository introduction on Lamaist mythology, describing
    deified forces of nature, local gods incorporated into Buddhism, a large pantheon,
    and authorial comparisons with other mythic traditions.
  language: English
  quote_policy: summarized
