canonical_text:
  quote: "“May I, by this incomparable gift, become a Buddha.”"
  summary: The passage frames a western Tibetan acted version of the Visvantara story,
    noting its relation to Tibetan canonical, Pali, and Burmese accounts. In the narrative,
    Prince Visvantara is born to a king and queen after propitiation of gods and dragons,
    becomes renowned for unrestricted generosity, and gives away a kingdom-sustaining
    wish-granting jewel to a Brahman sent by an enemy king. The gift enriches the
    enemy and brings famine and disaster to Visvantara’s own country.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The editor states that the Tibetan canonical story generally agrees with Pali
    and Burmese accounts, while the western Tibetan acted version differs in some
    details and gives the story a local Tibetan application involving St. Padma as
    a reincarnation of Prince Visvantara.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the city of Baidha in India, King Gridhip has a son by his favourite queen,
    “The Pure Young Goddess,” after propitiating gods and dragons.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prince is named the “Omnipotent Pure Lord of the World” by Brahmans and
    is identified in the passage with the better known name Visvantara.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Visvantara grows “like a lotus in a pool,” acquires accomplishments, and is
    described as devoted to magnanimity and giving away presents freely.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Crowds of beggars come to Visvantara from all directions, and he sends none
    away without fulfilling their expectations, so that poor people become rich.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The country’s prosperity depends on an enchanted wish-granting gem held by
    the king, which keeps the treasury from diminishing despite Visvantara’s almsgiving.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A greedy king from a barren enemy land learns of Visvantara’s vow to give
    any requested property and secretly sends a Brahman to ask for the enchanted gem.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Brahman arrives at the palace gate, throws himself before the prince with
    outstretched hands, and asks for the enchanted Jewel because his land lacks rain.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Visvantara hesitates because he fears offending his father and the people,
    but he gives the gem after reflecting that refusal would end his charitable merit.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before giving the gem, Visvantara places it on his head to seek its blessing
    and states his wish to become a Buddha through the gift.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Brahman carries the gem away on a white elephant to the enemy king, whose
