  text: Huc is cited as reporting that in 1246 Plan-Carpin was sent by Pope Innocent
    IV to the great Khan of the Tartars.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Khara Khoroum, near the sovereign’s palace, Plan-Carpin saw an edifice
    marked with a little cross and entered it because he supposed Christians were
    there.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Inside the edifice were an adorned altar, representations of the Saviour,
    the Holy Virgin, and John the Baptist, a decorated silver cross, and a lamp with
    eight jets of light burning before the altar.
  category: object
  evidence_refs:
  - ev:3
