canonical_text:
  quote: ''
  summary: 'The passage cites reports of Christian presence and institutions in Mongol
    and Chinese imperial contexts: Plan-Carpin is sent by Pope Innocent IV to the
    great Khan and finds a Christian-looking sanctuary near the palace at Khara Khoroum;
    Christian Alans at Cambaluc request a replacement archbishop from Pope Benedict
    XI; and Roman Church missionaries and Italy-China overland trade are said to have
    existed before Tsong Khopa’s era.'
  language: English
  quote_policy: summarized
