canonical_text:
  quote: ''
  summary: The passage describes shrines around Hajo associated by Lamas and local
    traditions with Buddha, Nagas, relics, Buddhist images later identified with Hindu
    deities, and temple paraphernalia including lotus ornaments, a ritual frame for
    carrying an image, umbrellas, and sculptured elephants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shrine of Kamalesvar adjoins the Kedaranath temple, and a tank there is
    called by Lamas “Tsé mani bhadra,” glossed as the lake of the notable gem.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lamas state that water-sprites identified as Naga, serpents, or dragons came
    out of the pond when Buddha approached and presented him with jewels.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A small cell by the pond is said to mark the place where Buddha set down a
    mass of butter brought to him as a gift; the stone linga and yoni now enshrined
    there are identified as the petrified butter.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A detached conical hillock crowned by the temple of Madhava is identified
    with the great caitya erected over the cremated relics of the Tathagatha’s body.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The present shrine is described as likely preserving the original shrine of
    an older Buddhist temple known in both Buddhist and Asamese tradition.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: A colossal stone image is called Madhab by Brahmans and Mahamuni by Buddhists,
    and is described by Dalton as an image of Buddha.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The central image is covered or altered with silver goggle-eyes, a hooked
    gilt silvered nose, cloths, and flower chaplets.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Brahmanic priests describe the central image as of divine origin and an actual
    embodiment or avatar of the god, unlike other images called hand-fashioned murtis.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: An account of Mir Jumlah’s 1661 invasion is cited to explain possible mutilation
    of the image, including a report that he broke the celebrated image of Narain
    with a battle-axe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Four other stone images stand on either side of the large image and receive
    both Lama-pilgrim Buddhist names and Brahmanical Bengali names from priests.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The vestibule contains lotus ornamentation and Buddhist temple paraphernalia,
    including a pyramidal wheeless car or framework with lion figures at each tier’s
    corners.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The framework is described as the kind used to seat an image of a demon, carry
    it beyond temple precincts, and throw it away; in this temple it is used to parade
    a smaller image identified as Hayagriver and then return it to the shrine.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Above the throne is a canopy with an eight-petalled lotus and a red fringe,
    with a huge closed umbrella hung on either side.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: A row of sculptured elephants along the temple basement is described as probably
    part of the old Buddhist temple.
  category: object
  evidence_refs:
  - ev:10
