- id: ev:11
  type: summary
  locator: 26153-26158
  quote_or_summary: Corpse removers must have been born in the Bird or Dragon year;
    the body is to be taken outside on the morning of the third day, carried south-west,
    and buried rather than burned or exposed.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 26159-26162
  quote_or_summary: After the death-horoscope is obtained, the body is tied in a sitting
    posture by the auspicious person indicated by the horoscope and placed in a corner
    not already occupied by the house-demon.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 26163-26166
  quote_or_summary: Relatives and friends are notified, gather within two or three
    days, and are entertained with rice, vegetables, and beer.
