canonical_text:
  quote: ''
  summary: The passage presents a Tibetan death-horoscope and associated ritual instructions
    for a deceased female. It identifies dangerous birth-year conflicts, movements
    and hiding places of death-demons, objects entered by the spirit, relatives at
    risk, corrective objects to place on the corpse, prayers for favorable rebirth
    and long life, and prescribed procedures for corpse removal and burial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage opens with an invocation to Lama Manjusri.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Because the deceased female was born in the Bull-year, people born in the
    Snake and Sheep years are said not to be able to approach the corpse.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A death-demon is described as having hidden in coloured articles in the house,
    moved to a neighbouring household, and expected to return within three months.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The deceased’s spirit is said to have entered her loin girdle and a sword
    after leaving her body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The affected girdle is described as cast away, while the sword is handed over
    to the Lama.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Her life is said to have been taken east by Tsan and king demons, while her
    body died in the west.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Small girls, cousins, sisters, and brothers in the house are identified as
    being at risk of harm.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Mewa result identifies the death-demon of the deceased’s paternal grandfather
    and grandmother as causing her death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A miniature earthen caitya, a sheep’s head, and earth from various sites are
    to be placed on the deceased’s body to correct the evil.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A leather bag or earthen pot containing four or five coloured articles is
    to be taken to the north-west and thrown away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A horse’s skull or serpent’s skull is to be placed on the corpse because the
    death is said to be bad for old men and women.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The deceased’s brother and sister who went near her are said to be harmed
    by the death-messenger, and an ass’s skull and goat’s skull are to be placed on
    the corpse.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The death-demon is said to have arrived in an earthen cooking pot and bowl
    belonging to a red-dressed male and female visitor from the south.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Images of Vajrapani and Vajrasattva are to be prepared, with prayer for the
    deceased girl’s good rebirth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: If the prescribed prayer is done, the girl is said to be reborn in the house
    of a rich man in the west.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Lamas are to read a service praying for rebirth in the Paradise of Sukhavati.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Prayers for long life are prescribed for the surviving family members.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: Those who remove the corpse must have been born in the Bird or Dragon year,
    and the body is to be removed on the morning of the third day, carried south-west,
    and buried.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:19
  text: After obtaining the death-horoscope, the body is tied in a sitting posture
    by an auspicious person and placed in a corner not occupied by the house-demon.
  category: action
  evidence_refs:
  - ev:12
- id: obs:20
  text: Relatives and friends gather within two or three days and are entertained
    with food and beer.
  category: sequence
  evidence_refs:
