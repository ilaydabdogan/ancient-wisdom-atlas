- id: motif:5
  label: ritual protection of surviving kin from death pollution or death agents
  taxonomy_refs: []
  basis: The horoscope identifies specific survivors as harmed or endangered by death-demons
    or the death-messenger and prescribes objects and long-life prayers for them.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  - ev:10
  confidence: medium
  cautions: The phrase “death pollution” is an analytic label; the passage itself
    speaks of harm by demons and messengers.
- id: motif:6
  label: directional corpse removal and burial
  taxonomy_refs:
  - afterlife_journey_map
  basis: The corpse is to be removed by people of specified birth years, taken out
    on the third morning, carried south-west, and buried, with placement in the room
