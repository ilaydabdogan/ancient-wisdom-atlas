  quote: ''
  summary: A catalog-style English passage describes parts of the Tibetan Buddhist
    canon, especially Prajnaparamita/Transcendental Wisdom texts, their abridgements,
    their association with Manjusri, the mystical condensation of wisdom into the
    letter A, the Diamond-cutter sutra as instruction to Subhuti, and other canonical
    divisions including Buddhdvatansaka, Ratna-kita, mDo/Sutra works, transmigration
    stories, cosmography, and named sutras.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Prajnaparamita doctrines are attributed by the Mahayana school
    to Buddha’s latest revelations in mythical discourses, mostly to supernatural
    hearers at Vulture’s Peak at Rajgriha.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first twelve Prajnaparamita volumes are called ’Bum or the 100,000 slokas
    of Transcendental Wisdom, and other volumes are described as abridgments for different
    monastic or lay users.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The single 8,000-sloka volume is said to contain the gist of the Prajnaparamita
    and is figured on the lotus held in Manjusri’s left hand.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: For schoolboys and laity, the text is further reduced to a few letters, and
    the whole is mystically condensed into the letter A.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The letter A is described as the mother of all wisdom, and all Bodhisatvas
    and Buddhas are said to have been produced by A because it is the first element
    for forming language and discourse.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Diamond-cutter sutra is described as a favorite booklet in which Bhagavati,
    identified parenthetically with Sakya, instructs Subhuti in the true meaning of
    the Prajnaparamita.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Association of Buddhas is described as containing accounts of several
    Tathagatas or Buddhas, their provinces, Bodhisats, and degrees of perfection.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Association of Buddhas is alleged to have been preached by Buddha in the
    second week of his Buddhahood, before he turned the Wheel of the Law at Benares,
    and to have been delivered in multiple assemblies and places.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The mDo or Sutra division is described as containing moral and metaphysical
    doctrine, legends, stories about consequences of former transmigrations, animal
    beings and their habitations, causes of birth, cosmogony, cosmography, Buddha
    provinces, and exemplary conduct of Bodhisats or saints.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The passage identifies several canonical works or volumes, including the Lalita
