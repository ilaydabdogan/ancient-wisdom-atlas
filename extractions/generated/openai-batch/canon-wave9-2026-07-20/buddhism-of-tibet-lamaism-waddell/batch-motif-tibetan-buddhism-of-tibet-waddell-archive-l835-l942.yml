canonical_text:
  quote: ''
  summary: The passage presents Waddell's historical account of Buddhism's entry into
    Tibet, describing pre-Buddhist Tibet and Bon religion, criticizing legendary Tibetan
    Buddhist histories, and recounting Sron Tsan Gampo's marriages to Chinese and
    Nepalese Buddhist princesses. The legendary material includes claims of royal
    Sakya descent, Tibetan people's descent from a monkey and a rakshasi sent by Avalokiteswara,
    sacred objects falling from heaven, five foreigners identifying those objects
    as sacred without explaining them, and an alleged early monastery on Mt. Kailas.
  language: English
  quote_policy: summarized
