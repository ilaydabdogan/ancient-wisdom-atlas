canonical_text:
  quote: ''
  summary: The passage describes the Primordial Buddha-God in Lamaism, especially
    Dharma-kaya Samantabhadra, and notes alternate supreme primordial figures in different
    Lamaist or related traditions. It then lists the Five Celestial Victors or Jina,
    giving their Sanskrit and Tibetan names, colors, hand attitudes, directional placement,
    vehicles, and common iconographic forms, including Buddha-like postures and royal
    Bodhisat ornaments.
