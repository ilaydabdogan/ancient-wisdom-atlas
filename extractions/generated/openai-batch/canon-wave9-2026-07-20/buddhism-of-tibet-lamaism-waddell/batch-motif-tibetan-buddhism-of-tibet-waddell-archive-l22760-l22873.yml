canonical_text:
  quote: ''
  summary: The passage describes a Tibetan Buddhist ritual banquet for deities, demons,
    gods, demi-gods, ghosts, and evil spirits, including rows of offerings, invitation
    and feeding stages, expiatory cake offerings, distribution of consecrated food
    to Lamas, disposal of leftovers to excluded spirits, ritual music, and a related
    burnt-offering of incense and butter for demons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The third row contains “essential offerings” especially intended for superior
    gods, while the fourth outer row contains many T’sug-cakes as an extra course
    for all.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cakes are described as cooked rice or barley cakes with wine, cooked flesh,
    and other available eatables added.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The feast sequence includes inviting deities and demons with loud instruments,
    seating them, asking them to eat, praising them while they partake, praying for
    favors, and offering T’sog-cakes on plates.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: During an expiation ceremony, the sacristan throws several T’sog-cakes skyward
    to demi-gods and demons not specially included in the feast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A T’sog-cake is then given to each Lama by rank because the food is described
    as consecrated by the gods having partaken of it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each Lama leaves a portion; the portions are collected from lowest to highest
    rank, topped with a whole cake, and later thrown outside the temple door to starveling
    ghosts and unsubdued evil spirits.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The cited manual says the service brings realized wishes, increased wealth
    and luck, power, blotting out of sins, subjection of evil spirits, charity, preta
    deliverance through heavenly rebirth, and eventual Buddhahood for the chanter.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The service is mostly in Tibetan and uses drums, trumpets, horns, cymbals,
    bells, and notated vocal curves; pauses may be marked by bells and cymbals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A footnote describes a burnt-offering of incense and butter heated to ignition
    on coals, intended for demons including Tan-ma and other Tibetan fiends.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A caption names demon owners of Ter caves where hidden revelations are deposited,
    and also black and red devils and Naga connected with a parent monastery.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that the general monastic manual “seems to correspond in
    some measure” to the Ceylonese Dina Chariyiwa.
  category: relationship
  evidence_refs:
  - ev:9
