canonical_text:
  quote: ''
  summary: 'The passage explains several links in the Buddhist chain of dependent
    origination as represented in Tibetan pictorial forms: consciousness by a monkey;
    self-consciousness by a physician taking a sick man''s pulse, with a variant of
    a man ferried across the ocean of life; sense-surface and understanding by a human
    mask or empty house with extra eyes; contact by kissing or grasping a plough;
    feeling by an arrow entering a man''s eye; desire by a man drinking wine; greed
    or indulgence by grasping and storing fruit; and becoming as a disputed link connected
    to rebirth. It also discusses the Three Fires of lust, anger, and stupidity as
    forces tied to rebirth and compares them with Brahmanical and Christian moral
    triads.'
  language: English
  quote_policy: summarized
