canonical_text:
  quote: ''
  summary: 'The passage first describes a fierce tantric iconographic form of the
    Guru with skull, blood, trident, severed heads, wives offering libations, corpse
    offerings, and eight named forms. It then introduces Waddell''s abstract of Padma-sambhava''s
    legendary history: a blind king in Udyana suffers the death of his son, famine,
    and depleted treasury; the king and people appeal to the Buddhas; Amitabha sends
    a red ray incarnation to a sacred lake; the king receives auspicious omens, regains
    sight, and discovers an eight-year-old radiant boy seated on a lotus, who explains
    his lotus birth as the fulfillment of Sakyamuni''s prophecy and his future role
    as teacher of Mantra doctrine.'
  language: English
  quote_policy: summarized
