canonical_text:
  quote: OM! Salutation to the Omniscient Ones! Buddha, The Law and The Church!
  summary: The passage gives a hymn to the Buddhist Trinity, praising Buddha, Dharma,
    and Sangha, then introduces and begins translating a Lamaist refuge formula in
    which all beings seek refuge through the Lama in Buddha, Dharma, Sangha, and an
    expanded host of protective beings.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The hymn opens with salutation to the Omniscient Ones, identified as Buddha,
    the Law, and the Church.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Buddha is praised as Bhagavan, victorious, all-wise, guide of gods and men,
    root of virtue, father of Bodhisats, king of revered ones, leader of the dead,
    and one who delivers beings from sorrow, sin, misery, and the woeful world.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: Buddha is described as having crossed the ocean of misery, knowing past, present,
    and future, living far from death, and dwelling enthroned in a pure blissful land
    where he sees all beings.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Dharma is praised as virtue of ancient, middle, and present times; pure,
    illuminating, everlasting, pointing the direct path, fulfilling desires, supporting
    beings, and stopping rebirth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Mahayana Assembly or Clergy is said to live in peace, wisdom, truth, and
    unison, and to merit respect, glory, and gifts.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says that by planting faith on the Immeasurable Ones, devotees
    will reap immeasurable fruit in the land of bliss.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A later salutation calls the Tathagata a merciful patron and omniscient guide,
    the Dharma a deliverer from evil, and the Assembly a guide, teacher of pure wisdom,
    and possessor of holy knowledge for cultivating human soil.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The prose introduction states that the Lama refuge formula extends the original
    triple refuge in the Three Holies to include deities, demons, deified Tibetan
    saints, and Indian Mahayana and Yogacarya saints.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The translated refuge formula has all beings go for refuge through the intercession
    of the Lama to Buddha, Dharma, the Assembly of Lamas, and the host of gods with
    their retinues of tutelaries and she-devils who defend the religion and people
    the sky.
  category: action
  evidence_refs:
  - ev:10
