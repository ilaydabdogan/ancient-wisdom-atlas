canonical_text:
  quote: ''
  summary: An account of Bogle's meetings with the Grand Tashi-Lama describes formal
    hospitality, informal conversations, the Lama's revered and affable character,
    his charitable support of mendicants, the esteem of monks and people, his imperial
    reception by the Chinese emperor, his death from smallpox, and the conveyance
    of his body in a golden coffin to Tashi-lhunpo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During a formal audience, a physician stood beside the Lama holding burning
    perfumed sandalwood rods, while the cup-bearer stood on the other side.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The visitor presented the governor's gifts, a letter, a pearl necklace, and
    a white Pelong handkerchief to the Lama.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The visitors were seated and served boiled mutton, boiled rice, dried fruits,
    sweetmeats, sugar, tea, and dried sheep carcasses; the Lama drank tea with them
    and placed white Pelong handkerchiefs on their necks at departure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: On later non-holiday visits, the Lama received the visitor informally, with
    simple clothing, uncovered head, and only the cup-bearer present.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that the Lama was venerated as God's vicegerent and endowed
    with divine attributes, while also acting affably in conversation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage gives a physical description of the Lama as about forty years
    old, low in stature, fairer than most Tibetans, with short black hair, small black
    eyes, and a smiling expression.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Lama's father is described as Tibetan and his mother as related to the
    Rajas of Ladak; he knew some Hindustani and is described as open, candid, generous,
    merry, and widely beloved.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Lama supported beggars and religious mendicants, including Indian Gosains
    and Muslim fakirs, with monthly allowances of tea, butter, flour, and money.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Monks and people are described as looking at the Grand Lama with veneration
    mixed with joy, and Bogle reports feeling affection for him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: After accepting the Chinese emperor's invitation, the Lama traveled toward
    Pekin with troops and followers; the emperor met him at Sining, advanced from
    his throne, and seated him on the topmost cushion at his right hand.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Lama died of smallpox on November 12, 1780, and his body was placed in
    a golden coffin and conveyed to the mausoleum at Tashi-lhunpo.
  category: sequence
  evidence_refs:
  - ev:6
