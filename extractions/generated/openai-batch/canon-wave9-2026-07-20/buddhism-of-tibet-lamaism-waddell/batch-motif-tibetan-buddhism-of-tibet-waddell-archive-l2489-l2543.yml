canonical_text:
  quote: ''
  summary: The passage describes Lha-tsun Ch’em-bo in ascetic-tantric iconography,
    reports beliefs about his incarnation lineage and death, lists sacred relics preserved
    in Sikkim monasteries, and describes a fertility rite in which his relics are
    placed on the heads of barren couples. It also states that Lamaism expanded in
    Sikkim after his death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The described figure sits on a leopard-skin mat, is almost bare, has a dark
    blue complexion, wears a chaplet of skulls, holds a skull cup filled with blood,
    has a trident topped with human heads near the left shoulder, and holds the right
    hand in a teaching attitude.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: One title given for the figure is He-ru-ha-pa, glossed in the passage as meaning
    “unclad.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The figure is said to be somewhat like Guru Rim-bo-ch’e, who is called his
    prototype in the passage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Lha-tsun is believed to be the incarnation of Bhima Mitra and to have been
    subsequently incarnated twice as a Sikkim lama, with Jik mt Pa-wo named as the
    last reincarnation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author reports uncertainty about Lha-tsun’s place of death and body, while
    giving a current report that he died in Sikkim of fever contracted during a visit
    to India.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dark livid hue of Lha-tsun’s skin is said to refer to his death from malignant
    fever, and his visit to India is said to have aimed at obtaining a rare ruddy
    leopard-skin prized by ascetics as a mat.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Lha-tsun’s clothing and personal effects are treasured in Sikkim and worshipped
    as sacred relics; most were moved from Pemiongchi monastery to the remote Té-lung
    monastery during the Gorkha invasion.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Relics kept at Pemiongchi include robes, hat, boots, hand-drum, bell, dorje,
    and a miraculous p’urbu dagger for stabbing demons.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The relics are shown on special occasions to wealthy worshippers and are celebrated
    as a cure for barrenness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the described rite, a barren couple has worship conducted for one or two
    days; the relic box is opened; each article is placed on the heads of the supplicant
    pair while a priest repeats the charm of his tutelary deity.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that if two sons result from the procedure, one is dedicated
    to the Church.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After Lha-tsun Ch’em-bo’s death, Lamaism is said to have progressed in Sikkim,
    with monks and monasteries filling the country, and the passage attributes Sikkimite
    civilization, literature, and the Lepcha alphabet’s Tibetan derivation to Lamaism.
  category: sequence
  evidence_refs:
  - ev:7
