canonical_text:
  quote: "“May I, by virtue of this gift, become a Buddha.”"
  summary: In a mountain and forest hermitage, Visvantara lives ascetically with Madri
    and their children amid abundant water, fruits, and helpful animals. A Brahman
    asks for the two children; after hesitation and an offer of himself instead, Visvantara
    gives the children and links the gift to becoming a Buddha. As Madri returns,
    a deity assumes the form of a lioness to block her from interfering with the surrender,
    and Madri reads ominous signs as meaning that the children have been given away.
  language: English
  quote_policy: quoted
