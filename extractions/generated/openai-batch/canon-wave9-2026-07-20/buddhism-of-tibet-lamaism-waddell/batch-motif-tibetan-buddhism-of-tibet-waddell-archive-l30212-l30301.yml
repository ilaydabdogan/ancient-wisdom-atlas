canonical_text:
  quote: ''
  summary: 'The passage describes Tibetan lay understandings of metempsychosis and
    karma in daily life: friendships, animal companionship, dishonest acts, bodily
    defects, and treatment of animals are interpreted through former births and karmic
    retribution. It also describes social attitudes toward butchers, killing animals,
    and criminal punishment.'
  language: English
  quote_policy: summarized
