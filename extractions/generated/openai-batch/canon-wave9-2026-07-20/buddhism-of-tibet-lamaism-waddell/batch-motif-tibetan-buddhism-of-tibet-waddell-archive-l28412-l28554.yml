  text: Drag-mar is described as a terrible red religious protector associated in
    the passage with Death, Mahakala, and Padmasambhava; its mask has a hideous anthropomorphic
    appearance, large size, projecting tusks, three eyes, and skull and bone ornaments.
  category: attribute
  evidence_refs:
  - ev:1
