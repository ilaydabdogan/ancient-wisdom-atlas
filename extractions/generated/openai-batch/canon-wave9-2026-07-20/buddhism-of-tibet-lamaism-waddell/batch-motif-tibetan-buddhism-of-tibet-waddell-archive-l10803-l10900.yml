canonical_text:
  quote: ''
  summary: 'The passage describes Tibetan rosaries: their common use by lamas and
    lay people, their Tibetan name, their 108 beads, their use for mantra counting
    and secular calculation, extra retaining beads symbolizing Buddhist sacred figures,
    Gelug-pa variants, and attached counters ending in a dorje and a bell. It also
    notes comparative parallels with Hindu/Vaishnava rosaries, Burmese Buddha footprints,
    Chinese calculating devices, and Tantric dorje-bell pairings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rosary is described as very visible among Tibetans and as held by an image
    of the patron god of Tibet, Ché-ré-si/Avalokitesvara.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says nearly every lay man and woman possesses a rosary and uses
    it to store up merit at opportunities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The rosary is also used for secular calculation, with beads to the right of
    the centre-bead registering units and beads to the left registering tens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Tibetan name of the rosary is given as ’pren-ba, pronounced teni-wa or
    vulgarly eni-ia, meaning a string of beads.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The rosary is said to contain 108 uniform beads, with extra beads explained
    as allowance for missed beads or lost beads while ensuring a full hundred repetitions
    of a sacred spell.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The two ends of the bead-string pass through three extra retaining or seizing
    beads before being knotted; these keep the beads in position and mark the completion
    of a cycle.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The triad of retaining beads is said to symbolize Buddha, Dharma, and Sangha;
    the large central bead represents Buddha, and a smaller bead represents the church
    and the radical Lama.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The symbolic presence of the personal Lama-guide on the rosary is described
    as ensuring gravity and care in telling the beads.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Gelug-pa form is described as usually having two retaining beads, interpreted
    as a vase from which the beads spring.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A pair of counter strings with ten small metallic rings is attached to the
    rosary; one string ends in a miniature dorje and the other in a small bell.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: A footnote describes a lama estimating the length of a town wall by dropping
    rosary beads at each pace while uttering a mantra during a religious perambulation.
  category: action
  evidence_refs:
  - ev:9
