canonical_text:
  quote: ''
  summary: The passage describes a Lamaic ritual in which a Lama fortifies himself
    against demons by assuming the spiritual appearance of a fearsome tutelary demon-king
    through mantras. A note explains this as a coercive practice that can render a
    deity subject to human power and culminate in visible manifestation and incorporation
    with the invoked deity. The passage then discusses priestly functions, demon worship,
    a Chinese edict criticizing fear-based rites, and the veneration of sacred Buddhist
    books as materially holy objects embodying Buddha’s Word.
  language: English
  quote_policy: summarized
