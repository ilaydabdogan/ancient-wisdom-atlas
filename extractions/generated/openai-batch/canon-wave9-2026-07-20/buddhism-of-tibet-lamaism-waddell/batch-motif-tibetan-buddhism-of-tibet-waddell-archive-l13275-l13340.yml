canonical_text:
  quote: "“Isolation from the world has always been a desideratum of Buddhist monks...”"
  summary: The passage describes Tibetan monasteries as deliberately solitary or remote
    places intended to aid meditation and remove temptations. It gives examples of
    high mountain, glacier, cliff, and cave settings; notes that such remoteness can
    make mendicant begging impracticable; describes a developmental sequence from
    cave hermitage to monastery; and mentions hallowed Sikhim caves associated with
    St. Padma and Lhatsun Ch'embo.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that Buddhist monks desire isolation from the world to
    escape temptations and favor meditation, not as penance.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Tibetan term Gon-pa or Gom-pa is glossed as a solitary place or hermitage,
    and many monasteries are described as away from villages or as former hermitages
    around which villages later grew.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A terminology note says that the title “Lin,” or “continent,” is applied to
    four major monasteries associated with temporal government and is linked by the
    author to four fabulous continents of the world.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some Tibetan cloisters are described as cut off from the outer world for much
    of the year and reachable only by dangerous paths during favorable times.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kye-lang monastery in Little Tibet is described as standing on an isolated
    spur about 12,000 feet above sea level, approached over glaciers, with votaries
    sometimes buried under avalanches.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Shergol in Ladak is described as set on a cliff, visually distinct against
    darker rocks, with no nearby vegetation and a surrounding waste of stone.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that remote and nearly inaccessible convent sites make
    mendicancy impossible, and that begging with a bowl was not a feature of Lamaism
    even where monasteries adjoined settlements.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Several Kar-gyu monasteries are called caves or hermitages, although any actual
    caves accommodate only a small proportion of residents.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage describes a sequence in which a solitary cave site is first selected;
    if monks gain funds and influence through zeal and piety, a monastery is built
    nearby; if not, the hermitage remains in the cave.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A cave-hermitage at Ri-kyi-sum near Pedong is identified, and such caves are
