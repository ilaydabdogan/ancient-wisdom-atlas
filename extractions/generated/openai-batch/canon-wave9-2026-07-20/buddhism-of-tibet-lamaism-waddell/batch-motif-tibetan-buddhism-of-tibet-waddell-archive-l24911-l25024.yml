canonical_text:
  quote: ''
  summary: The passage describes Tibetan divination by manuals, cards, rosaries, counters,
    and boards. It explains ritual invocations, physical procedures for drawing cards
    or counting rosary beads, and interpretations of numerical outcomes as favorable,
    unfavorable, or remediable through worship and propitiation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Divination is described as determining the movements of individuals and as
    being used seriously for undertakings in hand or immediately contemplated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many families are said to possess a small divining manual called mé or mé-pe,
    which gives portents for elicited numbers and includes initiatory spells.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Divination cards are small oblong cardboard strips marked and illustrated
    with degrees of lucky and unlucky portents, each with a small thread attached.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the card oracle, an invocation is addressed to a favourite deity, often
    Tara; the packet is held in the left hand near the face, the eyes are closed,
    a thread is grasped, and the attached card is drawn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The best result out of three card draws is taken to decide the luck of an
    undertaking, sickness, or other question.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rosary divination is said to be practiced especially by more illiterate people
    and by Bén priests.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The rosary spell invokes multiple religious and cosmic beings and asks that
    truth or true light descend on the lot.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The rosary is rolled between the palms, the hands are clapped three times,
    a section is seized with closed eyes, and beads are counted from each end in threes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The result of rosary divination depends on whether the numerical remainder
    is one, two, or three in relation to the previous remainder.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
- id: obs:10
  text: Several unfavorable readings prescribe remedial action, including repeated
    Rim-gro, worship of gods, or propitiation of devils.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The most ordinary mode is described as divination by counters made of seeds
    or pebbles in sets of ten, fifteen, or twenty-one, sometimes with a numbered dice-board
    linked to a divination book.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The set of ten is called the Ten Fairy Circle and uses a board with an eight-petalled
    lotus arranged in paired petals corresponding to Tantric symbols of the five Jinas.
  category: object
  evidence_refs:
  - ev:10
