canonical_text:
  quote: ''
  summary: The passage describes the newly enthroned Dalai Lama’s monastic admission,
    education, ordination, and minority under a regent; the preservation and monumental
    tombs of deceased reincarnate Lamas; the political office of regent and its restriction
    to certain Lama heads allegedly embodying former royal ministers; and conflicts
    among large armed monastic bodies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After enthronement, an official notice says the term “embodiment” should no
    longer be used for the Dalai Lama.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Dalai Lama is admitted as a novice to the Nam-gyal monastery of Potala
    and placed under a special preceptor and learned assistants.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At age eight, he is ordained as a full monk and becomes abbot of the Nam-gyal
    convent and head of the Lamaist church.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: For temporal rule, the Dalai Lama is treated as a minor until age eighteen,
    and a regent governs during the minority.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage reports a belief that regents may be involved in premature deaths
    of Dalai Lamas who die before majority, and that Chinese government support is
    commonly credited for political purposes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: When a reincarnate Lama dies, the body is preserved; tombs of Dalai and Pan-ch’en
    Lamas are conspicuous gilt monuments at Potala and Tashi-lhunpo, sometimes seven
    storeys high.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The holiness of such a Lama is said to be estimated according to the shrinkage
    of the body after death.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The temporal rule of Tibet is vested in a Lama with the title of “king,” while
    the regent also bears titles translated as regent, protector of the earth, governor,
    and Vomen-Khan.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The office of regent is described as necessary under succession by rebirth,
    since the new Dalai Lama does not reach temporal majority until eighteen.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Nag-wan is said to have ruled that the regent must be a Lama and restricted
    the office to heads of four monastic palaces or Lings of Lhasa.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says the heads of the four Lings were alleged to be re-embodiments
    of the spirits of four celebrated ministers of the monarchical period; Lon-po
    Gar is given as an example.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Large monastic bodies are described as not subject to civil authorities, possessing
    armouries, and sometimes engaging in violent feuds or quarrels.
  category: action
  evidence_refs:
  - ev:10
