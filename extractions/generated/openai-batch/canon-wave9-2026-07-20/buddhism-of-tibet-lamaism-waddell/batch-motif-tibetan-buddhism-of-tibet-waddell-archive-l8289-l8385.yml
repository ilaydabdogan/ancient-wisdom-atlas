  summary: The passage describes the worship and honoring of Buddhist scriptures,
    the oral and written transmission of scriptures, the preservation of ancient manuscripts
    in Tibetan monasteries, the physical production of Tibetan books, ornate scripture
    copies, and the structure and immense material scale of the Kah-gyur and Tan-gyur
    collections.
