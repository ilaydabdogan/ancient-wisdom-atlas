canonical_text:
  quote: ''
  summary: The passage describes monastic textbooks and lessons for a young probationer,
    including sacred booklets, moral proverbs, rules and similes for effective speech,
    classifications of assemblies and faults, and a Mantrayana rite called the Blessing
    of Eloquence involving refuge, visualization of syllables, recitation, and the
    summoning of auspicious accomplishments for speech.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A holy booklet is said to cleanse sin even when used as a school exercise,
    and monasteries are said to possess printing blocks for it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists curriculum texts and lesson titles including offerings,
    torma, incense, rice offering, a primer of a red deity, eight commands, a collection
    of Tathagatas, foreknowledge, and confession.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young probationer is instructed in moral maxims described as golden maxims.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The moral proverbs include statements about not doing to another what is unpleasing
    to oneself, wishing for others' welfare, selfishness, understanding, ignorance,
    sickness, and death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage gives rules for speech concerning length, roughness, softness,
    vigor, brightness, proper ending, logical connection, repetition of essential
    points, and examples.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The qualities of speech are compared to a lion, hare, serpent, arrow, and
    a dorje held by its middle.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A saying attributed to the religious king Sron-Tsan Gampo describes speech
    with images of a bird in the sky, a goddess in charming dress, an unclouded sky,
    excavation of treasure, and a deer chased by fresh hounds.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Assemblies are classified by purposes such as happiness, sorrow, and worldly
    gossip, and further examples include virtuous acts, worship, house-building, feasts,
    charity, and thanksgiving after escape or success.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage lists eight acts of low-born persons and ten faults, including
    coarse language, impoliteness, pride, harsh manners, immoral conduct, stealing,
    unbelief in books, disrespect for teachers, abusive language, and anger toward
    old men or women.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Blessing of Eloquence is identified as a Mantrayana rite instituted by
    the great saint K'yun-po.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The rite begins with going for refuge to the Three Holy Ones and an aspiration
    to attain perfection and benefit animal beings.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The rite includes visualizing the one who brought the practitioner to light
    at the tip of the tongue, a white Om above the moon, white Ali vowels moving by
    the right circle, red Ka-li consonants moving by the left, and blue Atan-sin by
    the right.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The rite prescribes secret repetition after deep contemplation, including
    Om, vowel sounds, alphabet sounds, and the Buddhist Creed.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Through rays of the seed of the mantra-rosary and the power of blessings of
    speech, the practitioner summons the accomplishments of the seven precious rgyal-srid
    and the eight glorious signs; repetition is said to bring accomplishment in speech.
  category: sequence
  evidence_refs:
  - ev:10
