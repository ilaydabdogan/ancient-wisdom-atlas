  summary: The passage describes death rites in which a corpse is left undisturbed
    until a Lama performs soul-extraction. The corpse’s face is covered with a white
    cloth, mourners are excluded, the room is closed and quieted, and the Lama chants
    directions for the soul to reach Amitabha’s western paradise. The passage states
    a belief that moving the corpse could cause the soul to wander and be seized by
    a demon.
