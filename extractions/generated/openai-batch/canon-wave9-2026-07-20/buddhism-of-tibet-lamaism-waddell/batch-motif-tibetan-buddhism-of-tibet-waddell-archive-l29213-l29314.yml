canonical_text:
  quote: ''
  summary: In a Visvantara Jataka passage, the Bodhisat laments the suffering of his
    enslaved children. Sakra, king of the gods, tests him in the form of a Brahman
    by asking for Madri as a slave. Visvantara gives Madri away in pursuit of supreme
    insight, causing the earth to quake. Sakra reveals himself, grants Madri a boon,
    returns her to Visvantara, and arranges for the children to be freed and returned
    to their grandfather. Later Visvantara gives his eyes to a blind man, has his
    sight restored by the Buddhas of the Three Periods, forgives a hostile king, and
    receives back a gem and riches.
  language: English
  quote_policy: summarized
