canonical_text:
  quote: ''
  summary: 'The passage describes the torments of Pretas or hungry ghosts: abundant
    food and drink cannot nourish them because of tiny mouths and gullets, and food
    or water becomes fire, ashes, or weapons. It then recounts the Avalambana Sutra
    story in which Maudgalyayana sees his mother suffering in the Preta-world, fails
    to feed her with rice, and receives Buddha’s instruction that assembled priests
    and ritual offerings can deliver ancestors from such suffering and lead to rebirth
    in heaven.'
  language: English
  quote_policy: summarized
