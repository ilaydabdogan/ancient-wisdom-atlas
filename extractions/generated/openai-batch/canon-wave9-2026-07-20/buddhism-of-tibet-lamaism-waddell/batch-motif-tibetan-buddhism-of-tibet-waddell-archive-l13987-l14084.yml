  text: De-pung is described as west of Lhasa, divided into four sections around a
    cathedral with a visible golden roof, and containing a palace for the Dalai Lama
    during his annual visit.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At De-pung, the Five nymphs of long Life and Hayagriva are said to guard the
    entrance, while effigies of the sixteen Sthavira are placed outside the temple
    door.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Sera is explained through a naming legend involving rivalry with De-pung:
    hail is destructive of rice, and the two monasteries are said to have frequent
    feuds.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A miraculous phurbu, described as a thunderbolt sceptre, is exhibited at Sera
    in connection with the hail-and-rice rivalry legend.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sera is placed on lower slopes and mountain spurs, with buildings arranged
