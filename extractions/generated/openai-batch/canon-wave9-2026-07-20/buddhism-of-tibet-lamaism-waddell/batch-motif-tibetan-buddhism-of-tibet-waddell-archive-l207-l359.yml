  quote: ''
  summary: The passage summarizes Waddell's account of early Buddhism, presenting
    Siddharta Gautama as a historical founder whose life became overlaid with legend.
    It describes his concern with caste, suffering, renunciation, ascetic search,
    later legendary Temptation, preaching, rejection of Brahmanical sacrifice, death
    and relic burial, the formation of a monastic brotherhood, and the spread of Buddhism
    under Asoka and into surrounding regions.
