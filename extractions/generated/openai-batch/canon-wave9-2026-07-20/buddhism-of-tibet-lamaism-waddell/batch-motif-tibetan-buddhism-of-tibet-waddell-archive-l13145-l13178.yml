canonical_text:
  quote: ''
  summary: A formal report describes officials escorting the Dalai Lama’s embodiment
    from a mountain monastery to a temporary residence and then to Potala. There,
    imperial mandate and gifts are presented; the embodiment kneels, receives them,
    performs prescribed prostrations toward the imperial abode, is invested with garments,
    seated on a throne, and honored by chants, obeisances, and a banquet marking the
    close of the enthronement ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The reporting officials proceed with the Chany-Chia Hutukht'u, the chancellor,
    subordinate functionaries, hutukht'u, Lamas, and Tibetan officials to a monastery
    on mount Jih-kia.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated purpose of the journey is to escort the Dalai Lama’s embodiment
    down the mountain to a temporary abode at Chih-ta-hwang-pu, east of Lassa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chinese garrison troops are appointed to form an encampment and act as bodyguards
    during the embodiment’s two-day stay at the temporary abode.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the fifteenth day, the embodiment is escorted to the monastery at mount
    Potala, where prostrations and ceremonial observances are performed before the
    sacred effigy of the emperor’s elevated ancestor.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the sixteenth day, a golden scroll containing the emperor’s mandate, garments
    and ornaments, and ten thousand taels of silver are conveyed on yellow platforms
    to Potala and deposited in the hall called Ta Tu Kang.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A couch and pillows are arranged on a divan before the embodiment enters the
    hall.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The golden scroll is read aloud to the embodiment, who listens kneeling and
    facing east.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the reading, the embodiment receives the imperial gifts with veneration
    and performs three genuflections and nine prostrations toward the imperial abode.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The embodiment is invested with garments conferred by the emperor and supported
    to his seat on the throne.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chancellor and Tibetan priesthood intone Dharani formulas invoking auspicious
    fortune.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hutukht'u and Lamas perform obeisances, a banquet is opened, and the enthronement
    ceremonial is described as concluded.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The day is described as having fine weather and as proceeding auspiciously,
    to the delight of clergy and laity in Lassa.
  category: attribute
  evidence_refs:
  - ev:8
