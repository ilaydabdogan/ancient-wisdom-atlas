canonical_text:
  quote: ''
  summary: The passage describes Kalmuk Tartars remaining in Russian territory after
    the flight of the Torgots, retaining Lamaist faith while formal contact with the
    Dalai Lama at Lhasa is forbidden. It states that the Dalai Lama nevertheless sends
    secret advice by oracle, that local religious authority is now sanctioned by the
    Russian government, that clergy and bonded tax arrangements changed after the
    break with Lhasa, and that abuses by priests were partly addressed through government
    action and the head Laima Jambo Namka. A footnote notes Bön-pa religion flourishing
    alongside Lamaist faith in parts of Tibet.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the flight of the Torgots, Kalmuk Tartars remained in Russian territory
    between the Don and the Yaik, and the great majority are said to retain the Lamaist
    faith.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Formal intercourse with the priest-god at Lhasa is described as strictly forbidden;
    the Kalmuks are not allowed to receive orders or patents from him or send ambassadors
    or presents to him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The priest-god at Lhasa is said to give secret advice by oracle and otherwise,
    maintaining religious enthusiasm among his Volga flock.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Kalmuk head priest, called “Lima” in the passage, is described as sanctioned
    by the Russian government rather than by the Dalai Lima.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The number of priests is said to have increased after the connection with
    Lhasa was cut off.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Dalai Lima formerly had many bondsmen or Schabinaren on the Volga whose
    contributions went to Lhasa; after the Torgot flight, the money remained there
    and Schabinirs were divided among several Churulls.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A report from 1803 is said to describe Kalmuk priests as a tenth of the population,
    enriching themselves at the people’s expense, meddling in everything, and receiving
    young men averse to labor.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Since 1838 the Russian government is said to have partly prevented these clerical
    abuses through the head Laima Jambo Namka and by issuing stricter laws.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A footnote states that the Bön-pa religion flourishes side by side with the
