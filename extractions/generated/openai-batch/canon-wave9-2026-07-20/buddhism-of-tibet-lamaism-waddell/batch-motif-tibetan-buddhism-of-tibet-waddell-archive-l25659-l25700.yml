  summary: 'The passage records an oracular or augural petition: birth-sign data are
    listed, questions are asked about danger from foreign harmers and crop failure,
    a deity is petitioned for protection with offerings, and a reply prescribes Tara
    worship, prayer-flags, ritual readings, offerings, holy-water purification of
    the country, and mollification of country-gods.'
