canonical_text:
  quote: ''
  summary: The passage describes deceased Lamas whose ghosts are worshipped as malignant
    spirits; lists Tibetan saints and titles; recounts a legend of T’an-ton rGyal-po
    remaining sixty years in his mother’s womb before birth and preaching; and introduces
    Tibetan Buddhist symbolism, including lotus imagery, number mysticism, charms,
    prayer-flags, rag offerings, and the Three Gems.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ghosts of many deceased Lamas are said to be worshipped because they are
    believed to have become malignant spirits who harm former associates and pupils.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several earlier Tibetans are identified as saints, including king Sron Tsan
    Grampo, his two wives, minister Ton-mi, king Thi-Sron Detsan, early translators,
    and those associated with St. Atisa.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: T’an-ton rGyal-po is described as a popular saint and engineer whose image
    or picture is often found in Lamaist temples.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: T’an-ton rGyal-po is credited with building eight iron-chain suspension bridges
    over the Yaru Tsan-po, some of which are said to survive.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A legend says T’an-ton rGyal-po remained sixty years in his mother’s womb,
    meditated there for living creatures, then emerged already with grey hair and
    began preaching.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Specific honorific titles are said to be restricted to particular saints,
    including St. Tson K’a-pa, St. Mila-raspa, Taranatha, St. Padma-sambhava, and
    the Sakya Lama.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tibetan Buddhist symbols are described as signs, diagrams, pictures of animals,
    plants, and inanimate objects that appear on houses, furniture, boxes, embroidery,
    ornaments, trinkets, and charms.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that Lamaist symbolism is largely of Indian and Chinese
    origin, with some Tibetan-origin symbols described as comparatively crude.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage mentions mystic value of numbers, a magic-circle offering in effigy
    of the universe, charms against sickness and accidents, prayer-flags for luck,
    and tufts of rags affixed to trees and bridges.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sacred emblems and deity images are said often to be figured upon a lotus-flower.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: The lotus is interpreted in the passage as expressing a Hindi idea of super-human
    origin and purity because it appears to spring from water without contact with
