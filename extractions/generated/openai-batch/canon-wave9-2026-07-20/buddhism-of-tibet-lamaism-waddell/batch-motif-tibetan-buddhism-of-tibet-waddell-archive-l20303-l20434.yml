comparison_claims:
- id: claim:1
  claim: The passage presents Lamaist symbolism as largely derived from Indian and
    Chinese sources, with only a few symbols of Tibetan origin.
  claim_level: historical_contact
  target: Indian/Hindi and Chinese symbolic traditions in Tibetan Buddhism
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: This is the author’s broad assertion within the passage; the excerpt
    does not provide detailed historical transmission evidence.
- id: claim:2
  claim: The lotus symbolism used in Tibetan Buddhist sacred images is explicitly
    linked in the passage to a Hindi idea of super-human origin and purity.
  claim_level: same_function
  target: Hindi lotus symbolism of purity and super-human origin
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is limited to the author’s explanation of symbolic meaning
    and does not compare specific Indian texts or images.
- id: claim:3
  claim: The passage contrasts Tibetan Buddhist symbolism with Muhammadanism, stating
    that Muhammadan sanctuaries are practically devoid of images or pictures while
    Tibetan/Lamaist religion is rich in symbolism.
  claim_level: visual_similarity
  target: Muhammadan aniconic sanctuary contrasted with Lamaist symbolism
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: low
  limitations: This is a contrast rather than a shared motif; terminology and characterization
    reflect the source’s period and require review.
