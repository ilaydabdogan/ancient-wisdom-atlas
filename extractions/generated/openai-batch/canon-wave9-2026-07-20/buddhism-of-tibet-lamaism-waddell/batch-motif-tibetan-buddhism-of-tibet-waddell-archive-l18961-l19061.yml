canonical_text:
  quote: ''
  summary: The passage describes Marici under several identities and iconographic
    forms, including dawn and solar associations, sow imagery, consort relationships,
    and a lotus throne drawn by swine. It then summarizes tutelary divinities in Lamaist
    practice, emphasizing their power, coercion, demon-controlling function, consorts,
    sectarian selection, and the fierce tutelary Vajra-bhairava as a many-headed,
    many-limbed weapon-bearing form linked with Siva, Yamantaka, and Avalokita.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Marici is named as “The resplendent” and is given the Tibetan name ‘Od-zer
    ’c’an-ma.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Marici was originally queen of heaven, a Buddhist
    Ushas or goddess of the dawn, a metamorphosis of the sun as a centre of energy,
    and coupled with a myth of a primeval productive pig.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that in another aspect Marici is compared to Proserpine
    and is spouse of Yama, and that in her fiercest mood she is consort of the demon-general
    called “The horse-necked Trmdin.”
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In another mode Marici is called “The adamantine sow” and is said to be believed
    incarnate in the abbess of the convent on the great Palti lake.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Marici’s ordinary form is described as having three faces and eight hands,
    with the left face being that of a sow.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Marici’s hands hold various weapons, including an item transcribed as “aju,”
    an axe, and a snare.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Marici is described as seated in “the enchanting pose” on a lotus-throne drawn
    by seven swine.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Tutelaries are said to belong to different classes of divinities and are treated
    together as one group in the passage.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says tutelaries play an important role in everyday life and mentions
    their worship and the mode of coercing them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A tutelary is said to require activity combined with power over minor malignant
    devils.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Superior celestial Buddhas and Bodhisats may be tutelaries, but the favorite
    tutelaries are said to be great demon-kings and some inferior fiends promoted
    for adherence to Buddhism.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: The five celestial Jinas are described as tutelaries, especially in Tantrik
    forms such as Vajrasattva, Vajradhara, and Amitayus.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Tutelary forms with consorts are described as most common and as considered
    most energetic.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: Avalokita, Majdjusri, Vajrapini, Tara, and Marici are listed among the Bodhisats
    most common as tutelaries.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: Demon-kings are described as favorite tutelaries, as repulsive monsters, and
    as fiendish metamorphoses of supernatural Buddhas in later Tantrism.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:16
  text: Each demon-king in the Anuttara yoga section is said to have a consort who
    is even more malignant than her spouse.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:17
  text: Several ferocious many-armed monsters are described as similar in appearance,
    and each sect is said to have its own particular tutelary-demon regarded as especially
    powerful.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:18
  text: The Ge-lug-pa established church is said to have Vajra-bhairava as its tutelary,
    while individual monks may have Sambhara and Guhyakala as personal tutelaries.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:19
  text: Vajra-bhairava is glossed as “The Fearful thunderbolt” and given the Tibetan
    name rDo-rje-jigs-byed.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:20
  text: Vajra-bhairava is described as a form of Siva as destroyer of the king of
    the dead, namely Yamantaka, and is also said to be believed a metamorphosis of
    Avalokita.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:21
  text: Vajra-bhairava is described as having several heads, with the lowest central
    head being that of a bull.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:22
  text: Vajra-bhairava is described as having innumerable arms and legs; the arms
    carry weapons, and the legs trample enemies of the established church.
  category: action
  evidence_refs:
  - ev:8
