  summary: The passage describes the atmosphere of the Buddhist hot hells, their fiery
    enclosure, animal-headed lictors with red-hot instruments, and the first four
    named hot hells. Each hell contains specific tortures and is assigned to particular
    classes of offenders. The author also compares these hells with Dante's Inferno
    and reports a suggestion that Dante may have seen a Buddhist hell picture.
