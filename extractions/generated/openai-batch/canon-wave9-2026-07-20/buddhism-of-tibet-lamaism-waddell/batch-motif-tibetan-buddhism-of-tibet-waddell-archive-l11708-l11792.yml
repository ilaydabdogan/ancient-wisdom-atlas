canonical_text:
  quote: ''
  summary: 'The passage describes a village priest’s daily routine: midnight or dawn
    chanting, recollection of a Lama-preceptor, meditative posture, preliminary services,
    ritual relation with a tutelary demon, offerings to beings and spirits, circumambulation
    with a prayer-wheel, village priestly duties, meals, evening sacrificial worship,
    and sleep.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Immediately on waking, even at midnight, the monk rises and chants the Mi-rtakrgyud-bskul
    while recalling his spiritual guide; this is followed by prayer for temporal benefits.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The monk assumes the meditative posture of the seven attitudes and uses physical
    means to get rid of the three original sins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The monk coerces his tutelary demon into conferring a fiendish guise before
    chanting the four preliminary services.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The four preliminary services include the refuge formula, the hundred letters,
    the magic-circle of rice called the Mandala, and a prayer enumerating Lamas; the
    passage associates these with cleansing body, speech, and mind and conferring
    perfection.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The mild deity in the worship is called The Placid One, while the demon is
    called The Repulsive; the demoniacal form is recited a set number of times according
    to vow or convenience.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: At dawn the monk washes his face, rinses his mouth, performs worship if needed,
    and prepares sacred food for the six sorts of beings, sending it to tantalized
    ghosts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Incense, butter-incense, and wine-oblation are offered to specified classes
    of spirits and deities; butter-incense is reserved for the most malignant demons
    and evil spirits.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: If a temple or Caitya is nearby, the monk circumambulates it with a prayer-wheel
    revolving in his hand while chanting mantras.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The monk performs priestly services required by villagers after the morning
    rites and ordinary work or chanting.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The evening gtor-bshés service includes assuming tutelary dignity, chanting
    the preliminary and refuge formulas, sacrificial worship with bell and small drum,
    and invoking hosts of Lamas, tutelaries, and supernatural defenders of the faith.
  category: sequence
  evidence_refs:
  - ev:8
