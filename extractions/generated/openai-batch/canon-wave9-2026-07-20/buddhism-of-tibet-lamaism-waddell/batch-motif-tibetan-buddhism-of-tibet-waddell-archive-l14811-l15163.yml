canonical_text:
  quote: ''
  summary: The passage lists and interprets names of Sikkim monasteries, describes
    Pemiongchi’s status and ritual relation to the ruler, outlines Sikkim monastic
    sub-sects and nuns, and begins a description of Lamaist temples as divine houses
    with roof emblems, right-hand ritual approach, prayer-barrels, entrance screens,
    and guardian figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The list gives monastery names with vernacular forms and meanings; the prose
    says the names are mostly Tibetan and ideal or mystic, while some describe the
    physical site and a few are Lepcha place-names.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pemiongchi is described as designed, if not actually built, by Lha-tsiin as
    a high-class monastery for orthodox celibate monks; its monks retain a reputation
    for celibacy and good family and hold the title of pure monk.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Lama of Pemiongchi is said to have the reserved honour of anointing the
    reigning sovereign with holy water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that most Sikkim monasteries belong to the Lha-tsiin-pa
    sub-sect of the Nin-ma, while named monasteries belong to Na-dak-pa and Kar-tok-pa
    sub-sects; it also says Nin-ma monasteries are practically subordinate to Pemiongchi.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nuns are said to be admitted to a few monasteries in Sikkim, but their number
    is described as extremely small.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Lamaist temple is called “God’s house” and is described as usually the
    central, most conspicuous, and isolated building of the monastery.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The temple roof is described as carrying one or two small bell-shaped gilt-copper
    domes, interpreted in the passage as emblems of the royal umbrella and banner
    of victory.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The temple building is often two storeys high, with an outside stair on one
    flank and an upper wooden balcony with carved beams and doors.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: A visitor approaching the temple door is instructed to proceed with the right
    hand toward the wall in accordance with pradakshina.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Rows of prayer-barrels may be inserted in niches along the base of the building,
    and the visitor turns them by sweeping a hand over them while proceeding.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The main door is approached by a short flight of steps and may be screened
    by a large yak-hair curtain hung from the upper balcony.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The vestibule gateway is described as guarded by several fearful figures.
  category: relationship
  evidence_refs:
  - ev:8
