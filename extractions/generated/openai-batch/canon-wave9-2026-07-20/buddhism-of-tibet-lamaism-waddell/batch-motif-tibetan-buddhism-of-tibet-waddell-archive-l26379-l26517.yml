canonical_text:
  quote: ''
  summary: The passage describes ritual preparations and actions for expelling a death-demon
    from a household, including animal-headed figures, offerings, enchanted weapons,
    night-time invocations, shouting, removal of a platform to a crossroads, and a
    final room-clearing by a sorcerer-Lama. It also describes a lay effigy of the
    deceased made from a stool or block dressed in the deceased person’s clothes with
    a printed paper mask, accompanied by food, inscriptions seeking better rebirth,
    symbols of rebirth states, and depictions of sensuous offerings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A set of ritual figures is arranged around a tiger figure, including a silk-clad
    figure on the tiger, a bird-headed human-form figure with a red face, and an ape-headed
    human-shape figure placed behind.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bird-headed figure contains a written message telling a devouring devil
    not to remain in the village but to go to the enemy’s country.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Foodstuffs, raw meat, wine, and small silver and copper coins are strewn around
    the figures.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Weapons and materials are enchanted for conflict, including metals, stones,
    grains, a root, swords, knives, a reaping hook, a yak’s tail, and a yak-hair rope
    with a hook.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ceremony begins after sunset, with the explanation that demons can move
    only in darkness.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The head Lama invokes his tutelary deity and blows spiritualized breath upon
    the images while other Lamas sound instruments and laymen shout and wield weapons.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Lama’s incantation commands the death-demon to leave the house, go to
    the enemies’ country, and acknowledges that food, clothes, and money have been
    given to it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A selected relative carries the platform with the image and attendants outside,
    in a direction prescribed by an astrologer, and deposits it if possible where
    four roads meet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A sorcerer-Lama remains inside with a dorje and bell, makes passes in all
    directions, mutters spells, and throws hot pebbles toasted in fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the spells, the Lama declares the demon expelled, and the people shout
    that God has won and the demons are defeated.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the day the corpse is removed, a lay figure of the deceased is made by
    dressing a stool or block of wood in the deceased person’s clothes and inserting
    a printed paper mask as a face.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The printed central figure is explained as representing the spirit of the
    deceased, sitting or kneeling in adoration and sometimes with bound legs; food
    and drink are set before it as before the corpse.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The inscription speaks in the voice of the world-departing person, taking
    refuge, asking forgiveness for sins and impurities of former lives, and requesting
    the right way to another good world.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The figure bears symbolic markings for six states of rebirth and is surrounded
    by depictions of five excellent sensuous things.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: The author identifies the lay effigy rite as seemingly Bon-pa and reports
