canonical_text:
  quote: ''
  summary: The passage describes inscriptions and prayers on Tibetan luck-flags, including
    requests that the charm-holder’s life, body, power, and Lung-horse prosper, rise
    on high, and be protected from injury. It then describes a flag-planting rite
    with offerings, directional colors and ritual objects, and recitations addressing
    harmful demons in the cardinal and intercardinal directions, asking them to accept
    ransom and call back injuring spirits.
  language: English
  quote_policy: summarized
