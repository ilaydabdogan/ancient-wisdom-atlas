  quote: ''
  summary: The passage reports that the state oracle of Na-ch’un superseded an older
    practice in selecting the present Grand Lama. It says the oracle warned that continuing
    the old practice would bring disaster in the form of a monster appearing as the
    Dalai Lama, and instead foretold that the present Dalai would be found by a pious
    monk with horse neighings accompanying the discovery. The pious monk is identified
    as the head Lama of Gah-ldan monastery, sent by the oracle to Chukor-.
