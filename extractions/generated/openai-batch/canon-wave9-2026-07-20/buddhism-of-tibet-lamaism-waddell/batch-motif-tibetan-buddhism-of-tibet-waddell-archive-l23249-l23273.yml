  quote: ''
  summary: A prayer addresses a revered victorious and merciful Bhagavati, asking
    for purification, Buddhahood, happiness, knowledge, protection from harms, worldly
    bliss, the prosperity of holy religion, pacification of local troubles, and eventual
    admission to heavenly or paradisal states and Nirvana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prayer addresses a revered victorious Bhagavati and Merciful One and asks
    her to purify the petitioners and all beings from two evil thoughts and bring
    them quickly to Buddhahood.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: If Buddhahood cannot be attained within a few life cycles, the prayer asks
    for the highest earthly and heavenly happiness and all knowledge.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prayer asks for preservation from evil spirits, plague, disease, untimely
    death, bad dreams, bad omens, eight fears, and accidents.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The prayer asks for perfect bliss during passage through the world and for
    all desires to be realized without exertion.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prayer asks that holy religion prosper and that disease, poverty, fighting,
    and disputes be soothed wherever the petitioners dwell.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The deity’s benign face is asked to beam on the petitioners and appear large
