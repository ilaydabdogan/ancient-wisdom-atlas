  quote: ''
  summary: The passage opens with captions for a luck-flag and Bon dough sacrificial
    effigies, then introduces worship and ritual. It contrasts primitive Buddhist
    veneration by circumambulation with later worship and sacrifice toward the Three
    Holy Ones and toward relics, images, vestments, and utensils. It describes ritual
    development in Tantric Buddhism and Lamaism, notes outward resemblances to Roman
    Catholic liturgy, states uncertainty about borrowing, and portrays monks as priests
    to deities and demons with authority over hell and heaven.
