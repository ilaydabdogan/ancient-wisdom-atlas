canonical_text:
  quote: ''
  summary: 'The passage describes several Tibetan Buddhist festival observances: a
    Naga-related water/rain ceremony with offerings and boating, Padma-sambhava’s
    anniversary with masked dances and rain omens, the autumn Water-Festival centered
    on sacred water, a dawn star, bathing, drinking, offerings to water beings, and
    festivity, followed by brief accounts of the “descent of the gods” linked to Sakyamuni’s
    descent from heaven and Tson-Ka-pa’s winter lantern festival marking his ascent
    to heaven.'
  language: English
  quote_policy: summarized
