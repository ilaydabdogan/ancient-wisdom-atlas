canonical_text:
  quote: ''
  summary: 'Ethnographic account of Tibetan Buddhist and Bhotan-related hierarchs:
    Grand Limas are said to have biographies and celibacy patterns; the Dharma Raja
    resides at Tashi-ch''o; lesser spiritual chiefs are counted as re-embodied Lama
    saints across several regions; the Pekin metropolitan ]C''an-skya is described
    as an incarnation with imperial religious authority; a footnote recounts a beheaded
    reincarnate Lama whose line is said to have ceased; and Ladik and Sikhim reincarnate
    Lama offices are briefly described, including the Spitak Lama''s attire and greeting
    scarf.'
  language: English
  quote_policy: summarized
