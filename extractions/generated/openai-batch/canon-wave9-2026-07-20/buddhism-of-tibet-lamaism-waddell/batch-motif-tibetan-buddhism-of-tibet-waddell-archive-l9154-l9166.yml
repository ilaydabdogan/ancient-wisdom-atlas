  summary: The passage describes a monastic hierarchy in which Chutuktus and sovereign
    priest-gods are above an abbot-like figure. It states that this figure was probably
    originally the only one honored with the title Lama, meaning guru or master, and
    that larger cloisters have a K’an-po who supervises smaller lamaseries and temples
    and is compared with a Catholic bishop.
