canonical_text:
  quote: ''
  summary: 'The passage describes a daily routine in an unreformed Tibetan Buddhist
    monastery: monks are repeatedly summoned by conch, drum, or gong to assemblies
    in the hall; they receive refreshments and meals; they perform celebrations including
    refuge-related formulas, a food-sacrifice, worship of Mahakala and religious guardians,
    extra services on behalf of laymen, and an evening rite with 108 lamps. The daily
    refreshments and meals are said to number nine.'
  language: English
  quote_policy: summarized
