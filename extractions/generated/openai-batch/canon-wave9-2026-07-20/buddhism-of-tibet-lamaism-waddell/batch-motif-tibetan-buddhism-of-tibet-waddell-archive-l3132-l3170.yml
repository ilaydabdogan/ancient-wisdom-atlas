canonical_text:
  quote: ''
  summary: 'The passage names the Ge-lug-pa sect''s tutelary and guardian figures:
    Vajra-bhairava, supported by Samvara and Guhya-kala, and guardian demons including
    the six-armed Goi-po and horse-necked Hayagriva/Tam-din, called the Red Tiger-Devil.
    It then says the Ge-lug-pa, through Atisa, claims Manjusri''s doctrine associated
    with the Sakya-pa; Atisa is held to be an incarnation of Manjusri, the Bodhisattva
    of Wisdom, and to unite Kar-gyu-pa essentials through pupilage to the Indian sage
    Naro.'
  language: English
  quote_policy: summarized
