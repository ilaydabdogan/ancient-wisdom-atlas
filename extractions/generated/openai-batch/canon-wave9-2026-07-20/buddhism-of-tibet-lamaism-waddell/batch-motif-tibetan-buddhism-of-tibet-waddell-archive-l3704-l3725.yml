  quote: ''
  summary: The passage describes the Nin-ma-pa Lamas as an unreformed “old school,”
    relatively influenced by native Bon or pre-Buddhist practices, rarely practicing
    celibacy and abstinence, and identified as the real “red-hat” sect. It lists Samanta-bhadra
    as their primordial deity or Adi-Buddha, Dsog-chen as their mystic insight, named
    tutelaries, and a guardian demon.
