canonical_text:
  quote: ''
  summary: The passage describes the Karma-s'ar/Narma-s'ar oracle in Lhasa, its association
    with the demon-king Pe-har, Serra monastery, government attention, annual warnings
    for church and state, political consultations, public posted responses, and examples
    of animal-metaphor oracle sayings. It then describes Lhi-Ka/Ku-t'em-ba sorcerers
    or exorcists, sometimes women, sought for pain relief, and outlines their ritual
    equipment, offerings, invocations, music, and mirror-based manifestation of a
    deity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Karma-s'ar/Narma-s'ar oracle is described as old or original, popular,
    located in Lhasa, under the aegis of Serra monastery, and having a sorcerer held
    to be possessed by the demon-king Pe-har.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Grand Lama Nag-wan eclipsed this oracle by attaching the
    state oracle to De-pung, his own rival monastery.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each seventh month, the Karma-s'ar sorcerer proceeds to Serra and gives forewarnings
    of danger to the church and state for the coming year.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Karma-s'ar sorcerer is described as non-celibate, educated enough to read
    and write, and as having many pupils.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Karma-s'ar sorcerer is widely consulted about political events, and his
    deliverances are posted at the south door of his Lhasa residence and at Serra.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The quoted oracle responses use animal images including dog and fox, steed
    and cliff, eagle and fishes, fox and elephant, wolf and serpent, and pig and hawk.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Lhi-Ka or Ku-t'em-ba is described as an inferior type of sorcerer or mouthpiece,
    found often in western Tibet, sometimes female, with marriage not hindering the
    profession.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: These wizards are especially consulted for relief of pain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The exorcist puts on a mirror over the heart, a masker’s cope with the Five
    Bats of Fortune, a five-partite chaplet of the five Jinas topped by skulls, a
    silken girdle, and a cake on the head.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The exorcist calls upon Buddha and St. Padma, offers libation and incense
    to demons, beats a large drum and cymbals, and calls country-gods by name.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The advent of the deity is believed to be seen in the mirror, and the tutelary
    deity is said to come first.
  category: sequence
  evidence_refs:
  - ev:10
