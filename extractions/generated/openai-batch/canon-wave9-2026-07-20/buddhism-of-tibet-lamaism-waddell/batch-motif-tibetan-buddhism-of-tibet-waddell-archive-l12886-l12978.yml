canonical_text:
  quote: ''
  summary: 'The passage describes procedures for identifying a new Dalai Lama incarnation:
    a dream and lake vision guide a monk to a child; infant candidates are tested
    by recognizing objects of the previous Dalai Lama; names are placed in a vase
    or urn and drawn by lot with prayer and imperial oversight; the elected child
    is hailed as Avalokita incarnate. A Chinese memorial excerpt gives a historical
    example involving four children, omens, official examination, object recognition,
    mass, and public lot drawing.'
  language: English
  quote_policy: summarized
