  summary: The passage lists Indian Mahayana saints worshipped by Lamas, then describes
    Tantrik wizard-priests identified with Siddhas or Mahasiddhas. This class is said
    to be popular with Lamas, credited with supernatural powers through association
    with demons, and depicted with long untonsured hair and near-nakedness. Padma-sambhava
    is singled out as chief, founder of Lamaism, deified, actively worshipped, and
    commonly shown seated in Udyana dress holding a thunderbolt.
