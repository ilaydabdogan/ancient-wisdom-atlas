canonical_text:
  quote: ''
  summary: The passage describes Tibetan Buddhist death-rites in which Lamas may determine
    that a deceased spirit has gone to a specified hell compartment, perform costly
    offerings and propitiations to secure release, guide the corpse and spirit along
    a white path with ritual instruments and a scarf, cremate or bury the body, and
    later expel the death-demon through exorcistic rites involving images and banishing
    formulae.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Lamas are described as consulting lottery-books and determining that
    the deceased spirit has been sent to a specified compartment of hell.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A costly service by a large number of Lamas is said to be required when the
    spirit is found to be in hell.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The rite begins with making “virtue” for the deceased through offerings to
    the Gods, the Lamas, and the Poor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The resulting virtue is said to count in favor of the spirit in hell.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Great Pitying One is propitiated for intercession with the king of hell
    to release the particular spirit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Avalokita is described as ending the torment of tortured souls by casting
    a lotus-flower at them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Services may be declared to release a spirit from hell, but sometimes only
    partly, so that further expense is required for complete extraction.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Before the corpse leaves the house, a feast of delicacies, including pork
    and drink, is set before it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A Lama presents a scarf of honour to the corpse and tells the deceased spirit
    that it has died, must not return to trouble relatives, and should take the right
    white path.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Lama carries a thigh-bone trumpet, a hand-drum, and one end of a long
    white scarf whose other end is tied to the corpse.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Lama leads the corpse-bearer, blows the trumpet, beats the drum, chants
    a liturgy, and looks back to invite the spirit to accompany the body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The procession includes the corpse-bearer, people carrying refreshments, and
    weeping relatives.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The ceremony of guiding the spirit is performed only for laity; deceased Lamas
    are said to know the proper path without instruction.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The body is usually taken to the top of a hillock for burial or cremation.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:15
  text: Cremation includes worship of the Fire-god Agi and Avalokita.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: After cremation or interment, a masked lay figure of the deceased is made,
    the mask is formally burned, and the death-demon is expelled from the house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The rite of expelling the death-demon must be done within two days after the
    corpse is removed and is called the turning away of the face of the Destroying
    Devil.
  category: action
  evidence_refs:
