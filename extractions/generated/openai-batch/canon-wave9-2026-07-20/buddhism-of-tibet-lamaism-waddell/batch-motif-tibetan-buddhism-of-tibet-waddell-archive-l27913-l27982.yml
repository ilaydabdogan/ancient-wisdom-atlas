  summary: A ritual dramatic scene is described in which demons flee at the approach
    of a holy procession. A tall masked figure under a canopy, followed by six other
    masks, is honored by prostrating chanters. The seven deified beings receive adoration
    from masked processions that include abbots, beast-headed or devil-faced figures
    identified as demon-kings made guardians of Buddhism, and Pa-wo heroes with green
    masks, flags, and bells.
