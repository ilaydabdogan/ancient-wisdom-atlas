canonical_text:
  quote: The surmounting image represents the spiritual father of the particular Bodhisat
    or deity
  summary: The passage describes Tibetan Buddhist iconographic conventions in which
    a deity or Bodhisattva may bear a surmounting image of a spiritual father, usually
    one of the five Jinas or Buddhas of Meditation. It distinguishes this from a few
    cases where Maitreya bears Sakya Muni to mark succession. It also lists emblems
    and ritual attributes, including the wheel, vajra, jewel, lotus, visva-vajra,
    snare, flames, vessels, weapons, musical instruments, and other implements.
  language: English
