  summary: The passage describes Buddhist heavens above the Titans, the four great
    guardian kings of the quarters and their associated classes of beings, their protection
    of the heavens from outer demons, the ten Lokpals guarding the world from ten
    directions, and a threefold cosmological division into Desire, Form, and Formlessness,
    with the lowest region including the six heavens of the gods and the earth.
