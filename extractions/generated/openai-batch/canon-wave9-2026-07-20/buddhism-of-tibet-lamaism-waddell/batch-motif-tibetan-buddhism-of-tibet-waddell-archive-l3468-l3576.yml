canonical_text:
  quote: ''
  summary: The passage gives an ethnographic-historical account of Kar-gyu-pa sub-sects,
    especially the Kar-ma-pa and Dug-pa. It describes succession from Mila-ri-pa through
    pupils, the rise of sub-sects that relaxed hermitage requirements, the placement
    of founder images with Vajradhara in temples, the foundation and headquarters
    of the Kar-ma-pa, adoption of Nin-ma revelations, the thunder-dragon legend associated
    with the Dug-pa name, and Bhutanese traditions connected with St. Padma, sacred
    footprints, and a tiger’s den.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mila-ri-pa’s chief pupils are named as Dvag-po-lha-rje, who continued the
    orthodox Kar-gyu-pa succession, and Rich’un Dor-je Tag-pa, who did not interest
    himself in organization.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the sect’s hermit-feature was unattractive and that several
    sub-sects arose which dispensed with the necessity for hermitage.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sub-sects Kar-ma-pa, Di-kung-pa, Ta-lung-pa, and Duk-pa are said to differ
    by adopting different Nin-ima revelations as codes of demoniacal worship.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The image of each sub-sect founder is said to share the chief temple place
    with the image of the Adi-Buddha Vajradhara.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Kar-ma-pa sub-sect is described as founded in the middle of the twelfth
    century by Kar-ma-pa Ran-cl’un Dor-je, also named Du-sum K’yen-po, a pupil of
    Dvag-po-lha-rje.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The monastery of S'u-Ts’ur Lha-lun at Ts’ur-p’u is described as the headquarters
    of the Kar-ma-pa, and Kar-ma-Bakshi’s image is said to be central in all Kar-ma-pa
    temples.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ninth head Kar-ma-pa, dGu-pa-bar Phyug Dor-je, is said to have persuaded
    the raja of Sikhim to establish Kar-ma-pa monasteries in Sikhim.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Kar-ma-pa is said to differ from its parent sect by adopting a Nin-ma
    revelation found in Kong-bo and entitled Lé-té Lin-pa, with some also having ’Jah-ts’on-pa.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Dug-pa sub-sect is described as arising from a pupil of Mila-ri-pa’s disciple
    Dvag-po, with Pag-Sam-Wang-po named as founder and Ralung monastery named as its
    place of origin.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A legend of the thunder-dragon or Dug is said to be connected with the renamed
    Dug-Ralung monastery and to give the sectarian title.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A note explains the Dug-pa name as Sanskritized as Cloud-voice and says thunder
    is regarded as the dragon’s roar.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Southern Dug-pa form in Bhotan is linked to Z’ab-drun Nag-ban-nam-gyal,
    who settled in Bhotan and displaced other forms of Nin-ma Lamaism there.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage reports traditions that St. Padma directly founded earlier forms
    in Bhotan, entered and left by named routes, and left footprints on a rock; it
    also names a tiger’s den.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: A note reports that an unnamed male figure performed many miracles, went to
    a cave in Lab-çi-çu-gar identified tentatively with Mount Everest, died there,
    and had Kuvera as his favourite god.
  category: sequence
  evidence_refs:
  - ev:4
