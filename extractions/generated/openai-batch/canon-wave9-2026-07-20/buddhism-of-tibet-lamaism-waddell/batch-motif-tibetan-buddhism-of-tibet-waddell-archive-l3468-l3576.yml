comparison_claims:
- id: claim:1
  claim: 'The Kar-ma-pa, Di-kung-pa, Ta-lung-pa, and Duk-pa are presented as sub-sects
    sharing a common function: they relax the hermitage emphasis of the parent Kar-gyu-pa
    while differentiating themselves by adopted revelations.'
  claim_level: same_function
  target: Kar-gyu-pa sub-sects described in the passage
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is internal to this passage and reflects Waddell’s framing;
    it does not establish historical causation beyond the supplied account.
- id: claim:2
  claim: The Dug-pa is explicitly compared with the Di-kung-pa in adopting the same
    revelation, while the author notes that another distinctive Dug-pa tenet had not
    yet been elicited.
  claim_level: same_function
  target: Di-kung-pa revelatory practice
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The shared revelation is mentioned, but the passage does not identify
    it in this section or explain the unspecified distinctive tenet.
- id: claim:3
  claim: The Southern Dug-pa in Bhotan is set against earlier Karthok-pa and other
    Nin-ma forms, with the passage describing displacement by Z’ab-drun Nag-ban-nam-gyal
    while also preserving traditions of St. Padma as an earlier founder.
  claim_level: same_function
  target: Bhotanese Nin-ma and Southern Dug-pa foundation traditions
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a cautious comparison of local religious-foundation functions,
    not a claim of identical mythic content.
