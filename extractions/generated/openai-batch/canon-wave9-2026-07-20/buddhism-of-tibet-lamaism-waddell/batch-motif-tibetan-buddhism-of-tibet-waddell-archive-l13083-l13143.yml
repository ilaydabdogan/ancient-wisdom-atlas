canonical_text:
  quote: ''
  summary: A child claimant to the Dalai Lama embodiment is selected by lot from slips
    drawn from an urn on an altar. Ecclesiastical and lay witnesses publicly inspect
    the result and acclaim the child as the genuine re-embodiment, noting his poor
    Tibetan parentage and prodigies of intelligence. Homage is made toward the imperial
    residence. The infant is taken to Lhasa, his mother accompanies him to suckle
    him but is barred from Potala, and his parents receive residence and rank. At
    age four the child takes monkish garb and tonsure, receives a religious name,
    and is enthroned at Potala under Chinese auspices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A servant named Méng Pao puts his hand into an urn on an altar, turns over
    the slips several times, and draws out one slip.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The drawn slip identifies a four-year-old Tibetan boy, son of Tsé-wang-téng-chu,
    from Tai Ning monastery, with an infant-name.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The remaining slips are also drawn out and inspected publicly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Panshen Erdeni, chancellor, hut'ukht'u, and attendant Lamas unanimously
    declare the lot to have identified the embodiment of the Dalai Lama.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The declared child is described as the son of a poor Tibetan fuel-seller and
    as having manifested prodigies of intelligence.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:6
  text: The ecclesiastical assembly says that the Yellow Church now has a ruler for
    its governance and that the people are gladdened and at rest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Nine prostrations are performed in the direction of the imperial majesty's
    abode.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The population of Lhasa, clergy and laity, joins the demonstration by raising
    hands to foreheads.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The infant is taken to Lhasa at an early age, and his mother accompanies him
    in order to suckle him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The mother is barred from the sacred precincts of Potala on account of her
    sex, lodged nearby, and allowed to visit during specified daytime hours.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The parents are given an official residence for life, and the father usually
    receives the rank of Kwang.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: At age four the child assumes monkish garb and tonsure, receives a religious
