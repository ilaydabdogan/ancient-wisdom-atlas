  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Buddha image is described as a mendicant monk without ornaments and with
    tonsured hair, called the Muni or saint-type, usually on a lotus-flower.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The lotus-flower beneath the Buddha image is explicitly called the symbol
