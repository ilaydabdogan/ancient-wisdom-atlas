canonical_text:
  quote: ''
  summary: 'The passage describes Tibetan Buddhist cloth paintings: their materials,
    preparation, pigments, mounting, protective veil, borders, and symbolic border
    colors. It then outlines canonical types of Buddhist images, including the Buddha
    saint-type on a lotus, mild Bodhisat forms, angry and fiercest forms, multiple
    arms and insignia as signs of power or function, and Manjusri as a wisdom deity
    with mild and angry aspects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Paintings are usually made on cloth, while frescoes are mostly confined to
    temple murals.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cloth is described as canvas or cotton, rarely silk, stretched damp on
    a wooden frame, coated with lime-and-flour paste, dried, smoothed, and polished.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The drawing may be outlined by charcoal crayon or by a perforated stencil
    through which charcoal dust is sifted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The outlines are painted in Chinese ink, with other pigments mixed with hot
    thin glue; the unvarnished paintings are vulnerable to damp.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: On completion, the artist places a miniature figure of himself in a bottom
    corner in an adoring attitude.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The painting is cut from its easel-frame, given silk or brocade borders, and
    mounted on rollers with brazen ends.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The mounted painting has a red, yellow, and blue cloth border, said to represent
    rainbow spectrum colors separating sacred objects from the material world.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The outer blue border is broader than the others and may include a vertical
    brocade patch embroidered with dragons of the sky.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: A flimsy silk veil may protect the picture from incense smoke, lamp smoke,
    and dust, and may be adorned with sacred symbols.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Images are described as mainly anthropomorphic and differentiated by form,
