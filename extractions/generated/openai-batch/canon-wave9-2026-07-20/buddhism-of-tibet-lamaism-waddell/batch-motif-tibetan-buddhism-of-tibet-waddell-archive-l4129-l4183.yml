canonical_text:
  quote: "“The ultimate fate of every Titan is to die painfully warring against the
    gods”"
  summary: The passage describes the Buddhist/Lamaist depiction of Titans or Asuras
    as former gods expelled through pride, living at the base of Mount Meru between
    heaven and earth. They enjoy luxury but envy the gods, fight for the heavenly
    tree’s fruit and divine nectar, and die painfully in repeated conflict. Pictorial
    scenes include lotus birth, wish-granting tree and cow, battle preparations and
    slaughter by divine weapons, and women viewing their spouses’ fates and future
    rebirths in a reflecting lake.
  language: English
  quote_policy: quoted
