canonical_text:
  quote: ''
  summary: The passage describes a Tibetan Buddhist sacred play in which Lamas offer
    beer and rice or mustard-seed to coerced monsters, beings of six classes, and
    demons. Loud instruments and whistling summon noxious demons and enemies. Masked
    figures rush in, dance, howl, and represent infernal beings. Wan figures represent
    dead souls lost in space and seeking their proper sphere through darkness, while
    masked Spirits of Evil appear with animal heads, skull tiaras, skeleton imagery,
    and tiger-skins, sometimes taunting and terrifying the stray souls.
  language: English
  quote_policy: summarized
