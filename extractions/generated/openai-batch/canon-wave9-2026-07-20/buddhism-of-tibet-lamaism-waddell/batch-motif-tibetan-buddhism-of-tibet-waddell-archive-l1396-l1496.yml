literal_observations:
- id: obs:1
  text: The passage identifies Pal-bans as the first Lama in this account, Santa-rakshita
    as his predecessor, Bya-Khri-gzigs as the first ordained member of the Tibetan
    order, and Vairocana as a learned young Lama and translator of Sanskrit works
    into Tibetan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Tibetan wife of Thi-Sron Detsan is said to have opposed the king’s reforms;
    instigated by Bon-pa priests, she secured Vairocana’s banishment to Kham by a
    scheme compared in the passage to Potiphar’s wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the wife was afflicted with leprosy, she relented; Vairocana was recalled
    and is said to have cured her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports later claims that the wife was remembered with the epithet
    “Red Rahula,” that Vairocana was made an incarnation of Ananda, and that he was
    credited with composing or translating and hiding scriptures later discovered
    as revelations.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that exact details of Padma-sambhava’s primitive creed
    are hard to determine because extant works attributed to him were composed centuries
    later by followers of his Tibetan disciples.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage characterizes the Guru’s teaching as Tantrik and magical Mahayana
