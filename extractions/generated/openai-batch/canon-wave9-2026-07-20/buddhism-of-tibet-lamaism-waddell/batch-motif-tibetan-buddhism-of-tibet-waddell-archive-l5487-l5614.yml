canonical_text:
  quote: It is a dise or wheel, symbolizing the endless cycle of Life (samsara), of
    which each re-birth is a revolution.
  summary: 'The passage explains the Tibetan pictorial Wheel of Life as a diagram
    of samsara: a wheel held by a monster, with the causal nexus on the rim, the three
    vices at the nave, scenes of life in the body, and Buddha outside pointing to
    escape. It also lists the twelve causal links and notes reported Hellenic parallels
    for repeated rebirth and escape from a painful cycle.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The picture is described as a disc or wheel that symbolizes the endless cycle
    of life, with each rebirth as a revolution of the wheel.
  category: object
  evidence_refs:
  - ev:1
