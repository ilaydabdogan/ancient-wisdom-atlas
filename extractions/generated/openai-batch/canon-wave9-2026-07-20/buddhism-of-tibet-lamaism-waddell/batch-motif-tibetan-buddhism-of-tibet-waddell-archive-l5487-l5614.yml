  text: The wheel is held in the clutches of a monster, which the passage says represents
    the hideousness of clinging to life.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The broad tire of the wheel is occupied by the causal nexus, and the nave
    is occupied by the three vices or delusions.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The three vices are named as Raga, Dvesa, and Moha, glossed as lust, ill-will,
