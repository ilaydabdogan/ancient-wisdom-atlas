canonical_text:
  quote: ''
  summary: The passage describes a Lamaist mystery-play performed at year-end and
    in some unreformed contexts on Padma-sambhava’s day. It outlines the setting,
    audience, musical opening, ritual dance by black-mitred priests, and the entrance
    of man-eating demons whose role is explained as representing humanity’s oppression
    by powers of evil and the uncertain protection provided by saintly exorcism.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The play is described as acted by Lamas of the old school and by all sects
    of Lamas on the last day of the year; many unreformed sects also act it on St.
    Padma-sambhava’s day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When performed at the end of the year, the play forms part of a ceremony called
    “The sacrificial body of the dead year,” held during the last two or three days
    of the old year.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Villagers gather from the countryside, wear holiday attire, and arrive early
    at the temple; seats are reserved for gentry, officials, visitors, the king, and
    grandees.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The performance is held outdoors in the temple courtyard; the orchestra may
    be screened from view, and the maskers assemble in the temple or in yak-hair tents.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: A shrill bugle-call from a trumpet made out of a human thighbone announces
    the commencement of the play.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gongs and shawms begin a wailing air while musicians accompany it with a low
    chant.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A crowd of pre-Lamaist black-mitred priests, wearing rich silk and brocade
    and preceded by censer-swingers, enters, makes the mystic sign of “The Three,”
    and performs a slow stately dance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The priestly dancers stretch out the right and left hands alternately, turn
    in opposing directions, advance and retire toward one another, reform a circle,
    make the sign of the Trident, and retire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the priestly dancers retire, a troupe of man-eating malignant demons
    enters with hordes that harass humanity, infest the air, earth, and water, and
    seek to destroy man.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that the demon hordes are intended to illustrate humanity’s
    oppression by powers of evil, against which man is helpless except for occasional
    aid from exorcisms and prayers of a good Daeg or incarnator.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that even protective aid comes only after a fierce and
    doubtful contest between saints and devils, and that relief from persecution lasts
    only temporarily.
  category: relationship
  evidence_refs:
  - ev:8
