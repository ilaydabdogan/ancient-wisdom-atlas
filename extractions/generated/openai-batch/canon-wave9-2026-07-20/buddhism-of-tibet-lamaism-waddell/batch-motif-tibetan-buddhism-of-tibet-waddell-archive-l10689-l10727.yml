canonical_text:
  quote: ''
  summary: 'The passage describes several garments worn by Tibetan lamas: an outer
    patched robe made from many sewn pieces; an upper shawl worn over the left shoulder
    and under the right arm; a crescent-shaped cloak or cope; ordinary lower robes,
    vests, gowns, trousers, sleeves, and sash; and the use of robe color, girdle color,
    and hat shape and color as identifiers of sect.'
  language: English
  quote_policy: summarized
