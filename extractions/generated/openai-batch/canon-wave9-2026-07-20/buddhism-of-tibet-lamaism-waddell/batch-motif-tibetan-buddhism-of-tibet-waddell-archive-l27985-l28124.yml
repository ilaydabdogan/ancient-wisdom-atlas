canonical_text:
  quote: ''
  summary: The passage describes a Tibetan Buddhist ritual play in which an enemy
    effigy is prepared like a corpse, attacked by demons, protected by lamas and a
    saintly figure, then ritually attacked with blessed substances, spells, and a
    mystic dagger amid processions of ghouls, demon figures, black-hat dancers, guards,
    and a bull-headed demon-king figure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Acaryas or jesters are described as playing practical jokes and greeting holy
    personages with mock respect.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The enemy of Tibet and Lamaism is represented in effigy, and the effigy is
    used to show how devils attack a corpse and why priestly services guard the corpse
    and its soul.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A dough image of a young lad is made with inserted organs and red-colored
    fluid representing blood; the passage reports that corpse flesh was sometimes
    inserted into the image.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Four cemetery ghouls bring out the enemy effigy, place it in the center of
    the square, and it is stabbed by weapons, gestures, and spells of demons circling
    it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After cymbal signals, Indian monks or Acaryas blow horns and perform antics,
    and lamas draw a magic triangle around the effigy on the pavement.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ghosts and death-demons painted to resemble skeletons dance around the corpse
    with chains, sickles, or swords, appearing to try to snatch or injure it but being
    held back by the magic triangle and holy men.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A horned fiend with a lolling tongue runs in and slashes near the corpse with
    a sword without touching it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A saintly figure throws flour on the corpse, makes mystic signs, mutters incantations,
    and causes the skeletons and sword-bearing fiend to grovel and receive flour and
    holy water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: On the following day, adoration is paid to the Jina, identified by the author
    as St. Padma-sambhava in an unreformed Lama context; blessed mustard seed is thrown
    at the enemy before the stabbing by the phir or mystic dagger.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Four ghouls bring in an object wrapped in black cloth, dance around it, and
    reveal a prone image of a man made in the earlier described manner.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Demon-generals, kings, Tam-din, fiendesses, the twelve Tiin-ma under Devi,
    black-hat devil-dancers, guards, the god of Wealth, butchers, great kings, queens,
    ministers, a state sorcerer, and attendants enter in sequence.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A bull-headed figure called the holy king of Religion enters holding a dagger
    with silk streamers, a human heart effigy, and a snare, accompanied by weapon-bearing
    fiends and tiger-skin-clad warriors.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A footnote reports three horses and three dogs smeared with red paint and
    dedicated for life to the temple as scapegoats for the sins of the people.
  category: action
  evidence_refs:
  - ev:11
