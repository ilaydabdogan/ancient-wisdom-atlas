- id: motif:2
  label: Corpse and soul protected from attacking demons
  taxonomy_refs: []
  basis: The play is explained as showing devils attacking a corpse and the need for
    priestly services to guard the corpse and soul; skeletons and fiends are restrained
    by a triangle and holy men.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not describe a full afterlife journey, only protection
