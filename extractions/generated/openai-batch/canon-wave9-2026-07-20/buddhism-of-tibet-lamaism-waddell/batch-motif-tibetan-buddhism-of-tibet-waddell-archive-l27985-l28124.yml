- id: claim:1
  claim: The passage itself compares the display of lamaic necromantic power in this
    play to a Burmese sacred play at Arakan.
  claim_level: same_function
  target: Burmese sacred play at Arakan
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only the author's brief comparison and does not describe
    the Arakan play in detail.
- id: claim:2
  claim: The footnote's description of red-painted animals dedicated for the people's
    sins supports a cautious comparison with a scapegoat or sin-transfer pattern.
  claim_level: same_function
  target: scapegoat or sin-transfer pattern
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The animals are dedicated for life rather than killed in the supplied
    description, and the note is ancillary to the main play.
