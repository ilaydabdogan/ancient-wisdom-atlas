canonical_text:
  quote: ''
  summary: The passage describes several Tibetan luck-flags, including the cho-pén,
    the Gyal-tsan dsemo or Victorious Banner, and a Vast Luck-flag. It explains their
    forms, ritual placements, monthly household use, prayers for lung-horse and prosperity,
    offerings to a local hill spirit, and printed emblematic contents such as auspicious
    symbols, lotus forms, crossed vajras, Garuda, peacock, jewelled elephant, and
    jewelled horse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The cho-pén is described as the second form of Tibetan luck-flag, long, narrow,
    and oblong, and used by tying it to twigs, bridges, or sticks planted on hilltops.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cho-pén text generally resembles the first form but lacks the horse-picture
    in the center and ends with a prayer for the year-holder's power, airy horse,
    age, and life to prosper and increase.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Very poor people may substitute a short written slip containing the individual's
    birth-year name and a prayer that his lung-horse prosper.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: One lung-horse for each household member is to be planted on the third day
    of every lunar month at a nearby hilltop, a tree branch near a spring, or the
    side of a bridge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the flag is affixed, a stick of incense is burned.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A small quantity of flour, grain, flesh, and beer is sprinkled around as an
