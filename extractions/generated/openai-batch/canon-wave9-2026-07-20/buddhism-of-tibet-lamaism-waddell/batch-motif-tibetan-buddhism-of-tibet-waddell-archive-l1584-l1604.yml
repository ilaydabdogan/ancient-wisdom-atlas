canonical_text:
  quote: ''
  summary: The Guru, accompanied by the king, nobles, and fairy wives, gives farewell
    instructions at Gungthang La, is enclosed in a rainbow-halo, mounts a celestial
    horse with the aid of four heroes, and departs through the sky with fairies, music,
    and flowers. The grieving crowd watches the celestial party recede for twenty-five
    days. The king, using magical insight, reports the Guru's safe arrival. The Guru
    then travels to Singala and Na-yab-glin, enters the bodies of demon kings, preaches
    doctrine, and reigns over Rakshas in perpetual youth in a paradise compared with
    Amitabha's western heaven.
  language: English
  quote_policy: summarized
