canonical_text:
  quote: the pigs and sows were suddenly transformed into venerable-looking monks
    and nuns
  summary: The passage describes areas of Samding monastery, including tombs, a saintly
    footprint, and a barred chamber holding the dried remains of former Dorje P’ag-mo
    incarnations. It recounts an inscriptional miracle in which Dorje P’ag-mo defended
    Samding from the Mongol warrior Yung Gar by causing monks and nuns to appear as
    pigs and sows, after which the invader made offerings instead of plundering. It
    also notes the present abbess’s ascetic habits, related Dorje P’ag-mo sanctuaries,
    and the animal-shaped ridge name of Di-Kune monastery.
  language: English
  quote_policy: quoted
