canonical_text:
  quote: ''
  summary: 'The passage describes Waddell''s account of theistic and metaphysical
    developments in Buddhism: expanded series of Buddhas, Mahasanghika claims about
    transcendent or illusory Buddhas, scriptural and ritual language treating Buddha
    as all-wise and worshipped, Mahayana celestial Buddhas and Bodhisatvas with human
    Buddhas as manifestations, and philosophical debates about existence culminating
    in Nagarjuna''s middle way.'
