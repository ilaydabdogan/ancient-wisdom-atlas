  summary: The passage describes sectarian Tibetan Buddhist revelations attributed
    to hidden gospels of Saint Padma, claims made by revealers about former births
    as Padma’s disciples, a lineage table for reformed Lamaist sects, and the role
    of Ter-ma revelations in ritual practice and schism. It also lists creedal categories
    distinguishing sects, including primordial deity, inspiration source, transmitters,
    meditative doctrine, Tantra revelation, tutelary beings, and guardian demons.
