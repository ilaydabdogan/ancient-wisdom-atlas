canonical_text:
  quote: ''
  summary: The passage describes Lamaist hats and cowls as non-scriptural monastic
    dress adapted to Tibet's cold climate, then explains how color and shape became
    sectarian and ceremonial markers. It reports Lamaist beliefs that typical hats
    came from India with Padma-sambhava and Santa-rakshita, describes the red hat
    of the great Pandits, compares it to Indian winter caps, and explains Tson-K'apa's
    change from red to yellow as a marker of the Ge-lug-pa sect and of rank.
  language: English
  quote_policy: summarized
