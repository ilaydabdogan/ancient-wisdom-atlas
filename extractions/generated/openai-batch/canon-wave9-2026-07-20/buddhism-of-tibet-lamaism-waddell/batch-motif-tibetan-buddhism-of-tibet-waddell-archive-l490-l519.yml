  quote: ''
  summary: The passage describes Waddell's account of Nagarjuna claiming orthodoxy
    for Mahayana by producing the Prajna-paramita, attributed to Sakyamuni and said
    to have been hidden by the Buddha in the custody of Niga demigods until people
    were enlightened enough to understand it. It also describes the Madhyamika as
    a Middle Path between views of Nirvana, and characterizes Mahayana doctrine as
    emphasizing a mystical, indefinable Pari-Nirvana and supernatural symbolism.
