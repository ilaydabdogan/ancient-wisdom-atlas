canonical_text:
  quote: ''
  summary: The passage describes Tibetan Buddhist temple and cathedral image arrangements
    as varying by sect. It notes principal images such as Sakyamuni, Tson K’a-pa,
    Padmasambhava or Guru Rinbo-ch’e, Avalokita, Amitabha/Amitayus, and Sakyamuni’s
    disciples; describes some images as self-sprung; describes separate rooms for
    fierce protector images with bloody sacrifices, wine offerings, and hell-torture
    displays; and rejects an alleged identification of images as Gorakhnath.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The placement of principal temple images is said to depend on the sect; Sakyamuni
    is often central, with a saint to the spectator’s left and Avalokita to the spectator’s
    right.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sakyamuni is described as yellow in color with curly blue hair.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sakyamuni is often attended by standing figures of Maugdalayina on his left
    and Sariputra on his right, each holding an alarm-staff and begging-bowl.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In temples of unreformed sects, Padmasambhava and his two wives are given
    special prominence, and many of these images are regarded as self-sprung.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stated order of images is said to be seldom observed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Ge-lug-pa temples Tson K’a-pa is most frequently given the chief place,
    while in Nin-ma temples the Guru is given the chief place.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A statement attributed to the Guru says he was a second Buddha sent by Sakyamuni
    specially to Tibet and Sikhim because Buddha had no leisure to go there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: When Sakya’s image is absent, the third image is usually Amitabha or Amitayus,
    described as Infinite Light or Infinite Life.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In many sectarian temples the chief place is given to the founder of the particular
    sect or sub-sect.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Other large images are ranged on either side of the principal triad.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: In larger temples, more demoniacal images, especially fiendish lords and protectors,
    may be placed in a separate building and worshipped with bloody sacrifices, wine
    oblations, and other rites described as inadmissible in the more orthodox Buddhist
    building.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Some idol-rooms are described as chambers of horrors representing tortures
    supposed to be used in hell.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage says the alleged existence of images of Gorakhnath in Tashiding,
