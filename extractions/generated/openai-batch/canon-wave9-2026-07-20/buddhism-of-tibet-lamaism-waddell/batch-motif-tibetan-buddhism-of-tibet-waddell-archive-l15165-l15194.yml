  summary: The passage describes a local tutelary ground demon, usually represented
    as a red, ugly, armed being clad in skins, and then gives examples of vicious
    local demons. One named figure, Gyal-po Suk-dén at Pemiongchi, is described as
    a brown-faced being seated on a white elephant and as the posthumous malignant
    form of a formerly learned person who was falsely accused and deposed. Notes mention
    a temple-door demon, a local devil of Ging temple, and comparisons to Chinese
    Buddhist temple descriptions and malignant ghosts of Brahmans in India.
