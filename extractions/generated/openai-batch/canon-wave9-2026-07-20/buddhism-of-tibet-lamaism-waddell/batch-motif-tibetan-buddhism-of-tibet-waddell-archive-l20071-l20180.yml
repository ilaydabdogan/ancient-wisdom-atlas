canonical_text:
  quote: ''
  summary: 'The passage summarizes episodes in the hagiography of Padma-sambhava:
    his royal reception and divine recognition, frustrated wish for ascetic life,
    banishment, cemetery and cave practices, instruction by supernatural beings and
    sages, alliance with a princess companion, miraculous survival on a pyre, arresting
    the sun to avoid immediate payment, and subjugation of hostile Tibetan deities
    and furies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lotus-born boy is named “The Lake-born Vajra,” brought to the palace with
    royal honours, and the country and religion prosper afterward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the palace the boy avoids ordinary pursuits and sits in Buddha fashion
    under a tree in a grove.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A bride is found for him, he remains in the palace five more years, and a
    host of gods declare him divine and commissioned as Saviour of the world.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king does not permit him to renounce princely life for ascetic life; after
    he kills several subjects, the people demand banishment, and the sentence is carried
    out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The princely pilgrim travels to the Shitani cemetery of the cool grove, dwells
    among the dead, seeks communion with gods and demons, and subjugates many.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dakkinis of four classes conduct him to the cave of Ajnapila, where he receives
    instruction; elsewhere old-world sages appear to instruct him in arts and sciences.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: He visits several cemeteries and regions, receives different names, and subjugates
    the eight classes of Dam-sri at Yaksha fort.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Zahor, the king’s daughter surrenders to the Guru and is identified in
    the passage as Mandarawa Kumari Devi, his constant companion during Tibetan travels.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Rival suitors seize him and bind him to a pyre; the flames do not harm him,
    and he is seen seated on a lotus-flower.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After drinking at a wine-shop without money, the Guru asks to delay payment
    until sunset, arrests the sun’s course, and the debt is wiped off after seven
    days of daylight.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The enemy-god Dsa-mun tries to destroy him by squeezing him between two mountains;
    he overcomes her by soaring in the sky and receives her submission and promise
    to guard Lamaism.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: A white fiendess showers thunderbolts at him; he melts her snow dwelling into
    a lake, makes the lake boil, pierces her right eye with a thunderbolt, and she
    offers her life-essence.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Twelve furies hurl thunderbolts and try to crush him between mountains; he
    flies into the sky, turns their thunderbolts to cinders, casts mountains on their
    dwellings, and brings them under control.
  category: action
  evidence_refs:
  - ev:12
