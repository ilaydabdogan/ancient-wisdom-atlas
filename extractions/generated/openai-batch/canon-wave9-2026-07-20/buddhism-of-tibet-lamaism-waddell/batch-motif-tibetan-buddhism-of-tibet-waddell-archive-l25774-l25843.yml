literal_observations:
- id: obs:1
  text: The passage names Wigas, dragon-demi-gods, and the Dié as malignant demons.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A divining-arrow is removed from flour offered to demons, placed with its
    blunted point on the painful body part, and used in a sucking procedure by a Lhia-ka
    exorcist.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A drop of blood appears over the painful part without abrasion, and the patient
    is led to believe that the demon has been expelled.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The commonest sorcerer is called Nag-pa, glossed as “the Expert in Incantations.”
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nag-pa practitioners are described as numerous, usually illiterate, married,
    and not admitted into monasteries of the reformed and semi-reformed sects.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Nag-pa’s dress includes a tall conical hat with yak-hair rim, coiled serpents
    on each side, a vajra-topped skull, peacock feathers, and five-coloured silk streamers.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Nag-pa’s stated weapons for fighting demons include a phurbu dagger, a
    thunderbolt-hilted sword, sling, bows and arrows, and the divining-arrow.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The phurbu dagger may have a vajra-thunderbolt central portion and a hilt-end
    terminated by a fiend’s head or a horse’s head representing Tam-din.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Additional appliances include a magic triangle containing talismanic sentences
    and an inscribed wish.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Nag-pa is described as wearing a sash of human bones carved with fiends
    and mystic symbols and a metal magic mirror as a breast-plate.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Common necromantic rites listed include closing the doors to demons of earth
    and sky, exorcising the disease-demon, death ceremonies, expelling the death-demon,
    rites involving a lay figure of the deceased, and exorcising ghosts.
  category: sequence
  evidence_refs:
  - ev:7
