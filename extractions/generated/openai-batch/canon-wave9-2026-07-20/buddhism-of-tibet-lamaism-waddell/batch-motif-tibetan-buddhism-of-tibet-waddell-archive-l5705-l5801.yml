canonical_text:
  quote: ''
  summary: The passage explains the first two links of the causal chain as Avidya
    or Ignorant Unconscious-Will-to-Live and Conformations. It describes pictorial
    imagery of a blind she-camel led by a driver, a karmic judgment scene with black
    and white pebbles weighed in scales, the six forms of rebirth, the three fires
    of illusion, and a potter shaping clay on a wheel as an image for Karma forming
    aggregates.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first link of the chain begins when the mortal envelope is thrown off
    or changed at death and is termed Avidya, rendered as ignorance or nescience.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies Avidya, as the initial link of the causal nexus, with
    an Ignorant Unconscious-Will-to-Live, to which Karma from former lives is attached.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The pictorial representation of this link is a blind she-camel led by a driver;
    the camel is identified with ignorant productive Unconscious Will and the driver
    with Karma.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the camel suggests a long difficult passage through the valley
    of the shadow of death toward new life; its sex indicates productiveness, and
    its blindness indicates darkness and ignorance.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: A footnote says the Tibetan picture usually depicts a blind old woman led
    by a man, which the author attributes to a mistranslation of a word for she-camel
    as old woman.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage describes a judgment scene in which sins appear as black pebbles
    and good deeds as white pebbles, weighed against each other in scales.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: According to which deeds preponderate, the place of rebirth is assigned in
    one of six states.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that Karma produces rewards and punishments, lowering the
    wicked through human, animal, and hell states and lifting the good to kings, sages,
    or gods.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'The Unconscious Will is described as influenced by three fires of illusion:
    lust, ill-will, and stupidity.'
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The second link, Conformations, is pictured as a potter modelling clay on
    his wheel and represents the shaping of crude physical and mental aggregates by
    Karma according to the judgment.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage states that Buddhist theory groups the aggregates or Skandha into
    five classes and notes that only the Rupa Skandha appears to be operated on in
    the Conformations link.
  category: other
  evidence_refs:
  - ev:11
