canonical_text:
  quote: ''
  summary: 'The passage catalogues sets of Tibetan Buddhist ritual or auspicious objects:
    the Seven World-Ravishing Gems, the Seven Personal Gems, the Five Royal Insignia,
    and the Eight Glorious Emblems. Individual entries include a sword-jewel granting
    invincibility, a snake-skin jewel with extraordinary protective and luminous qualities,
    and a shoe-jewel that enables tireless and dry travel across water. The Eight
    Glorious Emblems are described as auspicious symbols appearing in Buddha''s footprints
    and on many lay and clerical articles.'
