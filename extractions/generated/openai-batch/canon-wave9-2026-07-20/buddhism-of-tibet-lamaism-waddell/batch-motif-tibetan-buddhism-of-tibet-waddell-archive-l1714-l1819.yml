canonical_text:
  quote: ''
  summary: The passage recounts an unnamed Lama escaping pursuers after the assassination
    of King Lan Darma by using a blackened horse, a river crossing, and the white
    lining of his coat. It then describes Lan Darma’s dying words, the recovery and
    expansion of the Lamaist church after persecution, renewed visits by Indian and
    Kashmiri monks, and the arrival and reforming influence of Atisa, including his
    association with Manjusri and the later development of Kadam-pa, Ge-lug-pa, Kar-gyu-pa,
    and Sakya-pa sects.
