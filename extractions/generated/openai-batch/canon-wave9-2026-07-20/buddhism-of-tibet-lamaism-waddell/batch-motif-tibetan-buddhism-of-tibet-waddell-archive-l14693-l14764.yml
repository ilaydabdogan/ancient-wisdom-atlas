  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Innumerable small prayer-wheels are fitted into a hitch running around the
    courtyard sides.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Above trees and rugged cliffs are small square-built altars called Zhatos,
