  text: Tho-lding on the upper Sutlej has a celebrated three-storey temple, is said
    by some to be modeled after Budha Gaya, was built by Lo-tsa-wa Rin-zan-po, was
    burnt by the Hor, later rebuilt, and contains the "cycle of the collection of
    secrets" in its lowest compartment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tuec-Cu'oe is described as a sister-lamasery to He-mi, north of the Indus,
