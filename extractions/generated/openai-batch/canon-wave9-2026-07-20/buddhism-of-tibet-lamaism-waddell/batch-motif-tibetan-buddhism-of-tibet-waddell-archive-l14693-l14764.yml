canonical_text:
  quote: ''
  summary: The passage describes a Ladak monastery courtyard with prayer-cylinders,
    prayer-wheels, mantra streamers, trident-topped cloth pendants, poles with yak
    tails, and nearby altars with brushwood, sheep horns, and mantra flags. It then
    lists several Ladak and Little Tibet lamaseries and sites, noting altitudes, sect
    affiliations, institutional relationships, a swastika-related place-name etymology,
    the building, burning, and rebuilding of the Tho-lding temple, and sites connected
    with incarnate lamas, translation, printing, manuscripts, and study.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The described courtyard is about 30 by 40 yards square and contains a narrow
    verandah with a large prayer-cylinder in its center.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A principal idol-room entrance is described as a larger picturesque doorway
    with brass rings, brass bosses, and carved, colored wooden posts.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The roof is adorned with cylindrical cloth pendant devices called "Thook,"
    each surmounted by a black-and-red painted trident.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two high poles called "Turpoche" stand in the center space, with yak tails
