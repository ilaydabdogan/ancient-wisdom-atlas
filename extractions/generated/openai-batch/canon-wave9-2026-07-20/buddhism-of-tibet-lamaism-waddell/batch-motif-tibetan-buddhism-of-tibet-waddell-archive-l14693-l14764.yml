  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Several lamaseries are listed with altitudes or affiliations: Kor-pzog at
    16,000 feet, Tik-za as a Ge-ldan monastery, Wam-le or Han-le as De-ch''en at about
