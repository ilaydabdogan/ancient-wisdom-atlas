canonical_text:
  quote: ''
  summary: 'The passage describes the interior of a Tibetan Buddhist temple: consecrated
    images, frescoes and paintings, ordered seating for monastic offices, ritual tables
    and implements, a service table for food and drink, a lay-figure of a corpse for
    a spirit-withdrawal rite, a throne for visiting royal or reincarnated authority,
    and banners hung on pillars, roof, and beside the altar.'
  language: English
