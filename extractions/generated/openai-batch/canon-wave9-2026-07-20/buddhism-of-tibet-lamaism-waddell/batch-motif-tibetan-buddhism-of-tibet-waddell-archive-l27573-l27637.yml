canonical_text:
  quote: ''
  summary: The passage explains changes in the motive, names, and sectarian framing
    of a Tibetan Lamaist mystery-play. It describes man-eating devils, Yama and his
    minions, the after-death path of the soul, Padma-sambhava's association with the
    performance, a Ge-lug-pa version centered on Lan-darma's assassination and the
    restoration of Lamaism, and later identifications of the chief figure with Hayagriva
    while retaining Shamanist and sacrificial features.
  language: English
  quote_policy: summarized
