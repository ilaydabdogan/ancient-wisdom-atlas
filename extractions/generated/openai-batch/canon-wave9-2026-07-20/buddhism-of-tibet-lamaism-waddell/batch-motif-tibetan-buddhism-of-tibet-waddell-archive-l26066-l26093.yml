  quote: ''
  summary: The passage describes a Tibetan death rite in which a ritual specialist
    advises the deceased spirit to leave the body, plucks hairs from the corpse's
    crown to release the spirit through a minute skull opening, directs the spirit
    toward the western paradise, and explains procedures for absent bodies and for
    astrological death-horoscopes regulating corpse contact, burial, and worship for
    relatives.
