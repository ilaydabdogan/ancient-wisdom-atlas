  quote: ''
  summary: The passage describes Tibetan Lamaist masked religious pageants and mystery-plays,
    distinguishes monastic mystery-play performance from lay Jataka drama, and presents
    the author’s reconstruction of the mystery-play as an originally pre-Buddhist
    exorcistic devil-dance later given Buddhist interpretation. It connects the rite
    with expelling the old year’s demons and propitiating war and guardian powers
    through human sacrifice, while noting comparative analogies proposed by the author.
  language: English
  quote_policy: summarized
