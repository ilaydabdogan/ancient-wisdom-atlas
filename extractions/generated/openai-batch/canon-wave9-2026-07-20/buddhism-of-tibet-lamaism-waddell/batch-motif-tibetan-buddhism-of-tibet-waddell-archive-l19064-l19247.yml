canonical_text:
  quote: ''
  summary: The passage lists Tibetan Buddhist tutelary fiends, defenders of the faith,
    lord-demons, Dakkini figures, and eight goddesses, giving names, sectarian associations,
    iconographic features, ritual uses, and several explicit cross-tradition comparisons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several tutelary devils are named, including Samvara, Guhyukala, Vajra-phurba,
    Dub-pa-kah-gye, Hevajra, Buddhakapala, and Yama, with associations to Tibetan
    sects noted for some of them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The defenders of the faith are described as demon-generals who execute the
    will of tutelary demon-kings and each command a horde of demons.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The defenders are described as fierce Drag-po and To-wo types; females are
    described as metamorphoses of Kili Devi, and some local country gods are said
    to have been promoted to defenders of the faith.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hayagriva is identified as the horse-necked fiend and is figured with a horse’s
    head and neck above his other heads.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Acala is identified as the immovable and is said to occur in the Japanese
    Buddhist pantheon as Fu-do.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Yamamari is identified as the slayer of the death-king, a form of Bhairava,
    and is said to be incarnate in the Dalai Lama as controller of metempsychosis.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Lha-mo, also called Sri-Devi and the queen of the warring weapons, is described
    as a dreaded and malignant she-devil associated with releasing demons of disease.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Lha-mo is figured surrounded by flames, riding a white-faced mule, seated
    on a saddle made from her flayed son’s skin, wearing human skins, eating human
    brains and blood from a skull, and holding a trident-rod.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Lha-mo has attendant queens who ride different animals.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Lha-mo is publicly worshipped for seven days, especially at the end of the
    twelfth month, in connection with preventing disease in the coming year.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The cake offered to Lha-mo includes black goat fat, blood, wine, dough, and
    butter, placed in a bowl made from a human skull.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Lord-demons are described as fierce demon-generals, and each Lamaism sect
    is said to have chosen one as its defender.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The six-armed lord is named as chief minister of the tutelary fiend of the
    established church.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: The lord of the black cloak, also called the four-armed lord, is identified
    as a general of Samvara for the Kar-gyu-pa and as a fiend-general of the Nin-ma-pa.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: The lord-demons are said to number seventy-five, and the highest is identified
    as bird-faced Garuda.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:16
  text: Dakkini figures are called Sky-goers and are described mainly as consorts
    of demoniacal tutelaries and their generals.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:17
  text: The eight goddesses are said to encircle the heavens and appear in magic-circles,
    usually with beautiful aspect.
  category: setting
  evidence_refs:
  - ev:14
- id: obs:18
  text: 'The first four of the eight goddesses are described with color and objects
    or gestures: Lasya with a mirror, Mala with a rosary, Gita with a lyre, and Gar-ma
    in a dancing attitude.'
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:19
  text: 'The last four of the eight goddesses are described with color and objects:
    Pushpa with a flower, Dhupa with an incense-vase, Dipa with a lamp, and Gandha
    with a shell-vase of perfume.'
  category: attribute
  evidence_refs:
  - ev:16
