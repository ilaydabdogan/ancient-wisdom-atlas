canonical_text:
  quote: ''
  summary: The passage classifies Tibetan Buddhist rosaries by material, color, sectarian
    use, deity association, and substitute materials. It describes yellow Bodhi-tree-associated
    rosaries, bo-dhi-tse seed rosaries, white conch-shell and crystal rosaries for
    Avalokita, red sandalwood and coral rosaries for fierce deities or Padma-sambhava,
    skull-disc and elephant-stone rosaries for death-related deities, and Raksha seed
    rosaries with a legend connecting six-lobed seeds to Padma-sambhava’s broken rosary.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The yellow Ser-t’en rosary is identified as the special rosary of the Ge-lug-pa
    or yellow-hat sect, with beads made from yellow wood associated with the C’an-ch’ub
    or Bodhi tree.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The yellow rosary is described as usable for all kinds of worship, including
    worship of furies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bo-dhi-tse rosary is chiefly used among the Nin-ma-pa or red-hat school;
    its name associates it with the Bodhi tree, but its rough brown seed beads are
    said not to come from the Ficus family.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bo-dhi-tse rosary can be used for all kinds of worship and may be used
    by Ge-luk-pa practitioners in worship of fiercer deities.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The white conch-shell rosary consists of cylindrical perforated conch-shell
    discs and is specially used in worship of Avalokita; it is also called the special
    rosary of nuns.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A rosary of plain crystal or uncoloured glass beads is also described as peculiar
    to Avalokita.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The red sandal-wood rosary is used only in the worship of Tam-din, identified
    with Sanskrit Hayagriva and described as a fierce deity and protector of Lamaism.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The coral rosary is used for Tam-din and, by unreformed sects, for Padma-sambhava;
    red glass or composition beads commonly substitute for coral, and turquoise or
    blue counters are usual.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: A rosary made from discs of human skull is especially used for worship of
    Vajra-bhairava as slayer of the king of the Dead; the passage denies the existence
    of a finger-bone rosary.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The skull-disc rosary is usually inserted within another rosary and may be
    divided by four large Raksha beads into four series, with one Raksha bead as the
    central bead.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The elephant-stone rosary is prepared from a porous bony-like concretion said
    to occur in the stomach or brain of the elephant; because it suggests bone, it
    is used in worship of Yama.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: A fibrous bow-bambu root is commonly used as a substitute for rare elephant-stone
    because its section resembles the stomach-stone.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Raksha rosary is made from large brown warty seeds of Elaeocarpus Janitrus
    and is specially used by Nin-ma Lamas in worship of fierce deities and demons.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Six-lobed Raksha seeds are prized and are said by Tibetans to descend from
    beads of Padma-sambhava’s rosary that broke at his Halashi hermitage in Nepal.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Raksha rosary is also described as commonly used by indigenous Bon-po
    priests, though the passage breaks off before completing the comparison.
  category: relationship
  evidence_refs:
  - ev:11
