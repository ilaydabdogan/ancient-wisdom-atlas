canonical_text:
  quote: ''
  summary: 'The passage describes Tibetan wake practices: visitors remain near the
    house using prayer-wheels and mantras until a death-demon is expelled after the
    body''s removal; the deceased receives food, drink, and tobacco offerings at meals,
    with a cup filled up to the forty-ninth day; a Tii-s''ug sacrifice offers cake
    and rice into water while lamas chant; lamas also chant to send the soul to the
    western paradise and read a guide for the spirit''s passage through a dangerous
    valley between death and rebirth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Visitors remain in and around the house, use hand-prayer-wheels, mutter a
    mantra, and join in the expulsion of the death-demon after the body is removed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At every meal the deceased is offered a share, including tobacco, and the
    deceased's bowl is kept filled with beer and tea beside the corpse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After meals, the deceased's portion is thrown away because the spirit is said
    to have extracted the essence of the food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The deceased's cup is regularly filled with tea or beer up to the forty-ninth
    day from death, during which the spirit is said to be free to roam.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Tii-s'ug sacrifice, cake and rice are thrown into the nearest stream
