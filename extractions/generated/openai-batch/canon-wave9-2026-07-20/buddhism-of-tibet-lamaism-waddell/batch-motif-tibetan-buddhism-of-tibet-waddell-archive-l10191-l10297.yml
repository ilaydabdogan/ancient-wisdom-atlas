- id: motif:2
  label: Instructional incorporation into ordered monastic conduct
  taxonomy_refs:
  - initiation
  basis: The sequence includes refuge formula repetition, collective seating, tea
    service, a formal etiquette lecture for pupils, and disciplinary handling of infringements.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:8
