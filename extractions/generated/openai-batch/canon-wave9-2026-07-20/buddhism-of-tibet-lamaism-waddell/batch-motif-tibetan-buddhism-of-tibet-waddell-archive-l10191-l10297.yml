canonical_text:
  quote: ''
  summary: The passage describes monastic refuge recitation, tea distribution, donor
    blessing prayers, refectory offices, tea and donation customs, chapel notes, and
    a graded disciplinary system ranging from reprimand and strokes to banishment
    or severe expulsion beyond the monastery boundary.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a refuge formula led by the chief celebrant, the younger provost dons
    a yellow hat and strikes a pillar once with an iron rod.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The students go to the refectory, receive tea in sequence, each drink three
    cupfuls, and return to their seats to continue the celebration.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When tea offered by the populace is drunk, pupils sit silently while two cab-rils
    spread a carpet and prepare a central seat for the elder provost.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elder provost sits, bows three times, recites a formula naming the donor,
    and prays for Buddhist doctrine, the Grand Lamas, harmony in the monkhood, rains,
    crops, cattle, decreased disease, long life, and good luck.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A lecture called Ts‘ogs-gtam lays down etiquette for pupils, including walking
    and conduct at meetings, and rule-breaking pupils are to be dealt with exemplarily.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The refectory or tea-kitchen has five regular officials: two tea-masters,
    two menial Ja-ma, and a superintendent with twenty-five subordinates on fatigue
    duty.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: General tea is served three times daily from an imperial subsidy; on specified
    monthly dates the governor of Gah-ldan palace gives tea and soup; other donors
    offer tea and monetary donations according to customary allocations among cathedral,
    college-school, and club.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A chapel note says the chapel of Maitreya is three storeys high and holds
    eighty monks, the chapel of Tara holds forty monks, and the image of Paldan Lhamo
    is said to stand in space without support.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Large monastery and Lhasa temple tea-boilers are described as enormous; the
    Lhasa cathedral cauldron is said to hold about 1,200 gallons.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Monastic discipline requires members to report misdemeanours, which are punished
    according to Pratimoksha rules, with punishments ranging from remonstrance to
    banishment.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'Jurisdiction over infractions depends on the place of the offence: club-masters
    punish offences in the club, while the college provost handles offences in the
    college or debating-hall.'
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: For certain offences tried in the cathedral, the elder provost calls the rule-breaker
    to stand before the assembled students, and the transgressor rises with bent head.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The younger provost censures the transgressor and sentences a number of strokes;
    water-men bring the club dGe-rgan and tutor, who also receive censure, and lictors
    beat the offender.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Cane or rod punishment is fifty strokes for a small offence, one hundred for
    a middling offence, and one hundred and fifty for a grave offence; etiquette breaches
    are answered by apology-bowing or ten strokes.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The most severe punishment, called “Good or Bad Luck,” applies to murder and
    expulsion for persistent intemperance or theft; the accused is taken outside the
    temple, bound by the feet, beaten about a thousand times, dragged outside the
    boundary wall, and abandoned, while the teacher and club-master are fined.
  category: sequence
  evidence_refs:
  - ev:12
