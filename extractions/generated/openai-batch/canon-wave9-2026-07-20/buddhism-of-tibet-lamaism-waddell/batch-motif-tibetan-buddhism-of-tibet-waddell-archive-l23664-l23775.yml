canonical_text:
  quote: for the time being, he is himself that god.
  summary: The passage describes a Tibetan Buddhist longevity rite addressed chiefly
    to Buddha Amitayus/Aparamita. It explains the ritual's timing and hoped-for benefits,
    names associated longevity deities, lists the purity requirements for the officiating
    priest, describes altar objects including vases, life-pills, life-wine, a skull-bowl,
    and a vajra with string, and narrates the priest's ritual union with Amitayus,
    invocation of demonic protectors, offering to evil spirits, and expulsion of those
    spirits.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The rite is performed about once a week in larger temples, is sought especially
    during illness or near death, and every village is expected to have it performed
    at least annually for the life of the community.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prolongation of life after the rite is credited to the service, while death
    is attributed to excessive misdeeds in the present or previous births.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chief god addressed is Buddha Amitayus or Aparamita, described as the
    god of infinite Life; additional life-associated powers include the five Long-Life
    Sisters, White Tara, Ushnisharani, and Pama, the Lord of Death, who may be propitiated
    to delay death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The officiating priest is required to be morally pure, usually abstinent from
    meat and wine, fasting, mantra-repeating, and ritually purified by bathing before
    the rite.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The altar arrangement includes water-vases, an empowering vase, a vase of
    Life, wine of Life in a skull-bowl, pills and wafers, a sacred divining-dagger,
    and a thunderbolt-sceptre with a string.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Preliminary worship includes making pills from buttered dough and brewing
    amrita from spirit or beer, which is offered in a skull-bowl to the image of Buddha
    Amitayus.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The priest places the vajra on the nectar-vase held by the image of Amitayus
    and applies the other end to his own heart, so that divine spirit is described
    as passing through the string and his heart is conceived as united with Amitayus.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The priest invokes a tutelary-fiend and, through him, Hayagriva/Tamdin, so
    that Buddha and two demon kings are described as incorporated in the Lama before
    he dispenses divine favors.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Lama consecrates water, sprinkles it on rice-offerings to evil spirits,
    and asks the demons to accept a cake-offering and depart without further injury.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Lama assumes the threatening aspect of the demon-kings and warns the spirits
    that he will crush their body, speech, and mind if they refuse to leave; the Lamas
    and people then shout that the gods have won and the devils are defeated.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the expulsion, the Lama begins to secure life-conferring benedictory
    power by meditating on guardian-deities.
  category: action
  evidence_refs:
  - ev:10
