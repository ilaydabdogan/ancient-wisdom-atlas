  summary: The passage discusses Buddhist prayer-flags and related standards, comparing
    Tibetan/Lamaist prayer-flags with Burmese tagun-daing posts, Asoka pillars, Indian
    Buddhist votive pillars called Dhuvaja, and other possible material parallels.
    It describes prayer-flags as inscribed pious objects planted for merit, communal
    benefit, doctrinal prosperity, and talismanic luck-commanding use. Footnotes mention
    animal emblems on flag legends and possible comparisons with Asoka pillar animals
    and the Vedic raising of Indra’s banner.
