  quote: ''
  summary: The passage presents Waddell's account of Lamaist mysticism, Tantrism,
    goddess-energy worship, and Adi-Buddha cosmology. It describes Tantrism as grafting
    a cult of female energies onto Mahayana and Yoga, identifies Kali/Durga and Sakti
    with an active producing principle, and outlines a cosmological hierarchy in which
    Adi-Buddha evolves five celestial Buddhas, who in turn evolve active Bodhisat-sons.
    It also notes a five-directional arrangement with Vairocana in the center.
  language: English
