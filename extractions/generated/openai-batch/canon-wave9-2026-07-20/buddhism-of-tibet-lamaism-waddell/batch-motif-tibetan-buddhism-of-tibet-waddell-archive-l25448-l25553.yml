canonical_text:
  quote: ''
  summary: The passage describes Tibetan monastic sorcerers and oracles, especially
    the Na-ch'un oracle, as religious protectors, state diviners, and spirit-mediums.
    It links their equipment and behavior to Bon or Shamanist devil-dancing, describes
    their incorporation into Lamaist institutions, and recounts an origin narrative
    for the Na-ch'un demon-king as a Turki deity associated with Pe-har, possession,
    hereditary oraclehood, and a taboo against reciting the Kesar epic at Depung.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some cloisters near Lhasa, named Moru, Ramo-ch'e, and Kar-mas'a, are said
    to be devoted to instruction in this art.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief wizards are called “Defenders of the faith,” and Na-ch'un is described
    as the highest of them and the government oracle consulted on important state
    occasions and undertakings.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Every sizable monastery is said to have its own sorcerer; in poorer sects
    the sorcerer is usually not a member of the brotherhood, may marry, has no literature,
    and delivers sayings orally.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The source describes the sorcerers' equipment, bearing, cries, and howls,
    and states that these features identify them with Bon or Shamanist devil-dancers
    rather than with Sivaite origin.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The source says belief in ghosts and witchcraft and the practice of exorcism
    were deep-rooted, and that Padma-sambhava and Tson-K'a-pa incorporated them into
    their systems or sects.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The source attributes the organized form of the sorcerers' place in the priesthood
    to the fifth Grand Lama, Nag Wan, in the seventeenth century, while noting that
    some Lamas despised such exhibitions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The chief sorcerers are called revered protectors of religion and are believed
    to be incarnations of malignant spirits called “kings,” described as spirits of
    demonified heroes and objects of popular worship.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The king-fiends are alleged to have originally been five brothers from Ch'ad-dum
    in northern Mongolia; only two or three are said to be known, represented by the
    oracles of Na-ch'un, Karma-s'ar, and Gadon.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The fifth Grand Lama is said to have admitted the augur of Na-ch'un into the
    brotherhood and made him the state-oracle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Na-ch'un demon-king is described as originally a Turki god named “The
    White Overcast Sky,” and the Kesar epic is not permitted to be recited at Depung
    for fear of offending the Na-ch'un oracle.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Padma-sambhava is said to have brought this demon-king to Tibet during Thi-Sron
    Detsan's reign and made him the religious guardian of the first monastery, Sam-yii.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At Sam-yii the demon-king became incarnate; the man possessed by his spirit
    was styled Ch'e-je, married, and became a recognized oracle with hereditary descent.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The demon-king is identified with Pe-har, though another account makes him
    the fourth and younger brother of Pe-har.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: A footnote describes a set of sacred kings associated with directions, residences,
    and attributes such as Body, Speech, Deeds, and Learning.
  category: relationship
  evidence_refs:
  - ev:10
