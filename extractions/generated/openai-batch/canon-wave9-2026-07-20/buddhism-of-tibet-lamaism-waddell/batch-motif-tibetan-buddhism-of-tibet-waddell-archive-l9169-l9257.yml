canonical_text:
  quote: ''
  summary: 'The passage describes the curriculum and admission process for Tibetan
    Lamaist monastic colleges: a Lama-elect child enters monastery around childhood,
    progresses through probationer, novice, and fully ordained monk, and may pursue
    degrees. It outlines a preliminary admission examination at Pemiongchi: the boy’s
    parentage and physical condition are examined; if accepted, he is assigned to
    a tutor, presented publicly before assembled monks, and becomes a probationer.
    As a probationer he performs menial service, has his hair cropped, and learns
    the alphabet and short sacred texts and prayers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lama-elect remains at home until roughly his eighth year, with the stated
    range of six to twelve, before being sent to a monastery.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The child passes through named stages: pupil-probationer, novice, and fully
    ordained monk, with possible later degrees or special qualifications.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Applicants to major monastic colleges have usually already passed an elementary
    stage and are at or near the novice stage in a smaller monastery.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: For admission at Pemiongchi, the boy-candidate’s parentage is investigated,
    and many monasteries admit only candidates from more respectable and wealthier
    classes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The boy-candidate is physically examined to check for deformity or defects
    in limbs and faculties; stammering, crippling, or a bent body leads to rejection.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After passing the examination, the boy is handed over by his father or guardian
    to a senior monastic relative, or, if none is present, to an elder monk selected
    through horoscope consultation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The father gives the tutor a present of money, tea, eatables, and beer.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The tutor brings the boy into the great hall before the assembled monks, publicly
    states the boy’s parentage and other details, offers presents of beer, and asks
    the elder monks for permission to take the boy as a pupil.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When permission is accorded, the boy becomes a probationer.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: As a probationer, the boy is under his tutor’s care, performs menial services,
    has his hair cropped without ceremony, and may continue to wear lay dress.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The probationer is taught the alphabet and then learns to read and recite
    smaller sacred books by heart.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: Examples of small sacred books include prayers to St. Padma, an abstract of
    transcendental wisdom, a sacrificial service for averting calamity, prayers for
    general welfare, and a confession of sins.
  category: object
  evidence_refs:
  - ev:8
