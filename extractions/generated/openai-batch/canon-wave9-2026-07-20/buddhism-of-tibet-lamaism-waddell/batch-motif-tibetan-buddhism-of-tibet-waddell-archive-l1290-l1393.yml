canonical_text:
  quote: ''
  summary: The passage describes the Guru/St. Padma as subduing the chief local demons
    of Tibet in 747 A.D., sparing many when they agreed to defend his religion in
    exchange for worship and feeding. It compares this incorporation of local powers
    with Buddhist adaptations in India and Japan, names the Vajra and Mahayana spells
    as his weapons, and then describes the royal patronage, founding of Sam-yiis monastery,
    institution of the Lama order, and the title and self-designation of Lamas.
  language: English
  quote_policy: summarized
