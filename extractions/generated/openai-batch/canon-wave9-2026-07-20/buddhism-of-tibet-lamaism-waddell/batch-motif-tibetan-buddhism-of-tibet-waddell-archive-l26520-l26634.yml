  text: The Lamas leave after the initial service and return at decreasing intervals
    so that a series associated with forty-nine days may be completed in about three
    weeks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A lay figure of the deceased remains seated in the house and receives a share
    of each meal until the service ends.
  category: object
  evidence_refs:
