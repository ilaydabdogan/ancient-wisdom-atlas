canonical_text:
  quote: ''
  summary: 'The passage describes Tibetan Buddhist mortuary and ghost-exorcism rites:
    repeated services during a forty-nine-day postmortem interval, a lay figure and
    paper mask of the deceased, burning of the mask in a butter-lamp flame to read
    signs of the spirit''s fate, preservation of ashes in miniature caityas, later
    rites for the surviving household, and a burnt-offering exorcism in which a named
    ghost is suppressed by burning a paper bearing its name.'
  language: English
  quote_policy: summarized
literal_observations:
