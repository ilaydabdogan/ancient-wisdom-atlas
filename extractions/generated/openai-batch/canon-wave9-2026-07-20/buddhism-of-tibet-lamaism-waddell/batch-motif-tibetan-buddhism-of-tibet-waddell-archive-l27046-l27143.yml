candidate_motifs:
- id: motif:1
  label: sacred conception full-moon observance
  taxonomy_refs:
  - sacred_birth
  basis: The passage says the full-moon day seems to be considered the anniversary
    of Buddha’s conception and includes worship of the goddess identified as his mother.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The author hedges the identification with phrases such as “seems” and
    “evidently intended.”
- id: motif:2
  label: annual festival cycle and seasonal transition
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage organizes rites by days of the first and fourth months and explicitly
    links the fourth-month full moon with the beginning of summer and rain-deity propitiation.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:9
  confidence: high
  cautions: This is an ethnographic calendrical description rather than a mythic narrative
    episode.
- id: motif:3
  label: propitiation of sky dragons or Nagas for rain
  taxonomy_refs:
  - serpent
  - seasonal_cycle
  basis: Rain-deities described as dragons or Nagas of the sky are propitiated on
    the fifteenth day of the fourth month through a procession that culminates at
    a Naga or dragon-temple.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: medium
  cautions: The passage names dragons/Nagas but does not narrate a developed serpent
    myth; the serpent taxonomy link is broad.
- id: motif:4
  label: sacred exchange through gifts, alms, offerings, and largess
  taxonomy_refs:
  - sacred_exchange
  basis: The passage describes exchange of presents, gifts to the Dalai Lama, almsgiving,
    lamp-feeding with butter, and tea distributed to paupers during ritual processions.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The acts are ritual and charitable exchanges in a festival context; the
    passage does not frame them as a covenant or bargain.
- id: motif:5
  label: ancestor prayer within a festival of the dead element
  taxonomy_refs: []
  basis: The passage states that deceased ancestors and relatives are often prayed
    for during the feast and notes an apparent idea of ancestor-worship.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The author says “there appears” to be an ancestor-worship element, so
    the inference is tentative.
- id: motif:6
  label: benediction through bodily contact with a sacred image
  taxonomy_refs: []
  basis: People seek the benediction of Maitreya by touching their heads to the lower
    border of his displayed picture.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No supplied taxonomy family directly matches this image-contact rite.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the state sorcerer’s entry into Lhasa to
    that of an archaic god-king, based on the taboo against looking at him.
  claim_level: archetypal_reading
  target: archaic god-king entry with visual taboo
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: This is the author’s analogy within an ethnographic account; the passage
    gives no historical-contact argument or detailed comparative corpus.
- id: claim:2
  claim: The passage cautiously relates the ancestor-prayer element of the Tibetan
    feast to the Japanese feast of the dead by noting temporal proximity and apparent
    ancestor-worship.
  claim_level: same_function
  target: Japanese feast of the dead
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: low
  limitations: The passage only notes possible ancestor-worship and calendar proximity;
    it does not provide ritual details sufficient to establish a strong same-motif
    claim.
