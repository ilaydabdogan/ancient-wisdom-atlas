canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Tibetan New-Year and fourth-month festival
    rites: daily public worship, holy full-moon observances, offerings to Buddha’s
    mother, masked carnival behavior, worship of the Dalai Lama, tabooed entry of
    the Nii-ch’un state sorcerer, racing and holy-sceptre ceremonies, Sa-da-wa austerities
    and ancestor prayers, display of enormous Buddha images, and a procession propitiating
    rain-deities described as sky dragons or Nagas.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Public worship is described as occurring daily in the great cathedral of Lhasa
    during the first half of the month, with incense filling the air.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The third, eighth, tenth, thirteenth, and fifteenth days are identified as
    especially holy; the full-moon day is described as the greatest day of the year
    and as apparently connected with Buddha’s conception.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A goddess identified by the author as intended for Buddha’s mother, Maya Deva,
    is worshipped with red flowers, and divine blessings are believed to be more readily
    granted at this season.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: People wear festive dress and jewelry, exchange presents, and laity wear colored
    cloth masks with hair fringes imitating beards; the Dalai Lama is especially worshipped
    and receives many presents.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the second day of the month the state sorcerer of Nii-ch’un enters Lhasa,
    and the passage says no one dares look at him while he passes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The twenty-sixth day includes horse-racing and shooting; the twenty-seventh
    includes a troop review and a procession of the holy sceptre from Serra monastery
    for salutation by the Dalai Lama, officials, and people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: During the latter half of the month demons are worshipped, and the thirtieth
    day concludes the feasts with Tiara’s celebration as stated in the passage.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The anniversary of Buddha’s death is held on the full moon of the fourth month
    and is described as combined with an old Nature-festival honoring the beginning
    of summer and propitiating rain-deities.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: During Sa-da-wa, people increase worship, count beads, use prayer-wheels,
    and at larger temples go around holy buildings by measuring their length on the
    ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: From the tenth to the fifteenth, even laity abstain from flesh, give alms,
    and often pray for deceased ancestors and relatives.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: During the feast many monks encamp in tents and colossal pictures are displayed,
    including pictures hung from the great tower named Kiku at Tashi-lhunpo.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At Tashi-lhunpo a large picture of Dipankara Buddha is followed on subsequent
    days by pictures of Sakya Muni with past Buddhas and of Maitreya; people seek
    Maitreya’s benediction by touching the lower border of the picture with their
    heads.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Women are admitted to monastery shrines on the day of the Maitreya picture,
    though the passage states they are otherwise excluded at other times.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Rain-deities described as dragons or Nagas of the sky are propitiated on the
    fifteenth day of the fourth month by a procession involving lay governors, high
    official Lamas, and officers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: At the Lhasa cathedral the procession worships the great image of Buddha and
    feeds the temple lamp with melted butter poured from silver ladles.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: At the Ramo-ch’e temple the party feeds the chief shrine’s great lamp and
    distributes bits of brick-tea to paupers assembled in rows.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: The procession continues around the great circular road, dispenses tea, goes
    to the Naga or dragon-temple, circles the moat once by boat in the Pradakshina
    direction, and ascends the hillock to the temple.
  category: sequence
  evidence_refs:
  - ev:11
