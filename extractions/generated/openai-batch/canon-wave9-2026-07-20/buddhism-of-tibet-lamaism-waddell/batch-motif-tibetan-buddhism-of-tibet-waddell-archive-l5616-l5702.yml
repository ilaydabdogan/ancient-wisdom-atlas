canonical_text:
  quote: find the way of escape from continual Becomings
  summary: 'The passage summarizes Waddell''s account of Buddhist rebirth metaphysics:
    Buddha seeks escape from repeated becoming, adopts the Hindu notion of metempsychosis,
    replaces a creator with karma as moral causality, and treats the link between
    old and new life as a disputed issue. Waddell then presents a Lama-informed interpretation
    in which individual life has continuity between death and rebirth, associated
    with Ekotibhava.'
