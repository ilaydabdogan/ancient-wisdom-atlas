canonical_text:
  quote: ''
  summary: 'The passage describes the Himis monastery in Ladak: its high ravine location
    near the Indus, its survival during Dogra destruction because of seclusion, its
    preserved books, clothing, and masks, its builder and proper title, its summer
    fair with mask plays on St. Padma-sambhava’s day, its landholding status and steward,
    sect affiliation notes, and the beginning of a description of its entrance through
    a massive door and covered paved way.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The monastery called He-mr or Himis is described as a fine old monastery situated
    about 11,000 feet above sea level in a lateral ravine joining the Indus, above
    Leh, on the left bank of the river.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Himis escaped destruction during the Dogra invasion under
    Wazir Gerawar because of its secluded position, while much Lamaist property was
    destroyed elsewhere.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that more interesting and curious objects, books, dresses,
    and masks are found at Himis than in any other monastery in Ladak.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The monastery is said to have been built by sTag-stan-ras-ch’en and to have
    the proper title Ch’an-ch’ub sam-lin.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Himis fair includes mask plays and is held on St. Padma-sambhava’s day
    in summer; it is described as the chief attraction to sight-seers in Ladak.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The lamasery is described as the greatest landowner in Ladak, and its steward
    as one of the most influential persons in the country.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The passage reports uncertain sect affiliation: the lamas seem to be of the
    Nin-raa sect, while Marx is reported as calling them Dug-pa, apparently using
    Dug-pa as synonymous with the Red cap sect; Ts’en-re and sTag-na are said to belong
    to the same sect.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The principal entrance is described as passing through a massive door into
    a gently sloping paved covered way.
  category: setting
  evidence_refs:
  - ev:7
