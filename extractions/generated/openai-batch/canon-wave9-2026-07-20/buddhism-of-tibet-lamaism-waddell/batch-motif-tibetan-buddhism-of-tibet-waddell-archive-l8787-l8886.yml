  summary: The passage surveys Tibetan indigenous literature, distinguishing apocryphal
    and authentic or quasi-authentic works. It describes Terma revelation books and
    their calligraphic markers, lists several apocryphal and regional titles, mentions
    works attributed to St. Padma and King Sron Tsan Gampo, names a mountain-god worship
    manual, a narrative of a resuscitated man visiting Hades, and a Bon-po Naga text,
    and notes conventions of authentic works and legendary biographies.
  language: English
  quote_policy: summarized
