canonical_text:
  quote: ''
  summary: The passage introduces an alarm-staff associated with a mendicant monk,
    cites a Tibetan proverb about Lamas' food, and describes the daily life of Lamas.
    It says Lamas are bound by ritual but are not all gloomy ascetics; their observances
    may be interrupted by yawning or mundane conversation. It distinguishes routines
    in monasteries, village priesthood, and hermit life, notes that many Lamas have
    trades and perform agricultural or forest labor, and says a Lama is rarely a mendicant
    monk like the old Indian Bhikshu. It identifies Nam-gyal on Mount Potala near
    Lhasa as an exemplary monastery for observing convent routine.
