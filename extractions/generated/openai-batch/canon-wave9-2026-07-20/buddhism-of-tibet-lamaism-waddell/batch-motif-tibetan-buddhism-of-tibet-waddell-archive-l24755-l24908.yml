canonical_text:
  quote: ''
  summary: The passage gives parts of a Lamaist annual horoscope for a 7-year-old
    female and a 5-year-old male, listing birth-year conflicts, Parkha and Mewa calculations,
    omens, prohibitions, dangerous months and directions, spirit classes, and prescribed
    remedies such as scripture readings, clay chaityas, torma cakes, mdos rites, masts,
    and the employment of Lamas. It concludes with remarks on extensive ritual obligations,
    simultaneous scripture recitation by multiple Lamas, and simpler divination by
    cards, rosary beads, or pebbles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A female horoscope subject is described as born in the Water-Horse year seven
    years earlier; her current conflict with the Earth-Mouse year leaves Life, Intelligence,
    Body, and Luck good, while Power is bad.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The horoscope prescribes readings of named sutras or texts for the Sky-seizing
    Rope, Earth-dagger, and the bad conjunction of Horse and Mouse years.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: For the female subject's Parkha, the passage warns against breaking twigs
    or demolishing trees sacred to Nagas or gnyan deities, especially when buds come
    out in the second month.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A male son is described as born in the Wood-Ape year five years earlier; his
    Body, Power, and Luck are good, Life and Intelligence are middling, the Sky-rope
    is good, and the Earth-dagger is bad.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: For the son's bad Earth-dagger, the passage prescribes making clay Chaityas
    and giving torma cakes to the earth-goddess and to Naga demigods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: For the son's Parkha, the passage warns him not to go to large rivers, pools,
