canonical_text:
  quote: ''
  summary: The passage presents a damaged tabular classification of celestial Buddhas
    or Jinas and their reflexes, energies, spiritual sons, and earthly Manushi Buddha
    reflexes. It then describes Amitayus as the Buddha of Infinite or Eternal Life,
    related to Amitabha and holding a vase of life-giving ambrosia. It also describes
    Vajrasattva and Vajradhara as esoteric divinities accorded Buddha status, related
    to Akshobhya and Vajrapani, and gives Vajradhara attributes including a vajra
    and bell, the title concealed lord, association with Indra, the eastern quarter,
    Sakya Muni, and the Adi-Buddha of the old school.
  language: English
  quote_policy: summarized
