  quote: ''
  summary: The passage distinguishes grades of perfected Buddhist figures, contrasts
    Arhatship and Bodhisatship, describes Mahayana's universal saving aim through
    Bodhisatship and the three vehicles, lists the Paramitas, discusses meditation
    and yogic union, presents the ten Bodhisat stages as ten heavens represented by
    umbrellas on a caitya, and describes the 'other shore' and Amitabha's western
    paradise Sukhavati as a desired goal entered through devotion to Avalokita.
  language: English
