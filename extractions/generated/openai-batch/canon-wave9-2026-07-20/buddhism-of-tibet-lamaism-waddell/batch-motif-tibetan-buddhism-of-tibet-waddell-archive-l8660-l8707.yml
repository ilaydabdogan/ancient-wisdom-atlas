    with verses related to the Dhammapada and associated with Dharmatrata; a collection
    of Indian mystic formulas used as charms against disease and misfortune; the Nirvana
    division''s account of Shakya''s great decease with animal lamentation, offerings,
    teachings, funeral, and relic deposition; and the Yantra division''s materials
    on deities, mandalas, offerings, prayers, charms, and associated doctrines.'
