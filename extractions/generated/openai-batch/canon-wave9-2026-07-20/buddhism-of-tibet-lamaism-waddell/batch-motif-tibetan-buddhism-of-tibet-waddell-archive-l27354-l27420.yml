canonical_text:
  quote: ''
  summary: The passage describes annual ritual observances around the Tibetan New
    Year and related festivals. A man identified as a bad-luck scapegoat stays amid
    terrifying images and receives alms because he is believed to sacrifice himself
    for the country’s welfare. The old year and its bad luck are ritually expelled
    through household dough images and a larger communal image into which ill luck
    or a demon is directed, then carried away and abandoned; threads from the communal
    image are kept as charms, and temple services complete the expulsion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man called a scapegoat of bad luck stays for seven days in a monastery chamber
    containing monstrous devil images and skins of huge serpents and wild animals
    intended to cause terror.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: During his stays at Sam-yis and Chetang, the scapegoat exercises despotic
    authority for seven days at each place.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Limas and laity give the scapegoat alms because he is believed to sacrifice
    himself for the welfare of the country.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says that in former times the man performing the scapegoat duty
    died within the year from terror, while the present scapegoat survives and returns
    to perform the role again the following year.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the beginning of the third month, holy vessels and precious things are
    exhibited in the La-brang temple, pictures are hung out on Potala, and special
    supplications are made in cases of war, famine, and pestilence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old year and its bad luck are said to be dispatched through rites called
    the Throwing away of the Dead Year, combined with a devil-dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each household prepares a dough image with cloth, woollen or silken pieces,
    coins, and other items attached according to household wealth.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The demon of ill-luck is invoked to enter the household dough image, which
    is then worshipped.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the last but one day of the old year, a Lima carries the household image
    beyond the village to a place where four paths meet and abandons it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: For the general community, a huge image with many threads attached is prepared,
    and a dance of death-devils takes place in front of it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the communal image is carried off and abandoned, laity snatch its threads
    and treasure them as powerful charms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Limas return to the temple and perform a service to complete the expulsion
    of the dead old year.
  category: sequence
  evidence_refs:
  - ev:6
