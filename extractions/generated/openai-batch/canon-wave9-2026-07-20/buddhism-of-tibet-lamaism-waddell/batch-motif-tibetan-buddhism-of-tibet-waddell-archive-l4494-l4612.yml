  quote: ''
  summary: The passage describes the decay and possible rebirth or fall of a god;
    introduces Buddhist hell as the antithesis of heaven; locates hell beneath the
    earth under Yama, king and judge of the dead; describes judgment by deeds through
    scales, black and white counters, and a revealing mirror; recounts Yama questioning
    the wicked about five warnings of mortality; and lists punishments by hell warders.
    A footnote-like section also describes divine weapons, a talismanic banner associated
    with Indra, and a war-god aiding the gods against Titans.
  language: English
  quote_policy: summarized
