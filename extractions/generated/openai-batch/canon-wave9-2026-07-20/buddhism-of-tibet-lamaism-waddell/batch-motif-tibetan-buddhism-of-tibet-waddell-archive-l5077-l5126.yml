canonical_text:
  quote: ''
  summary: 'The passage presents an expository account of Buddhist metaphysics as
    described by Waddell: Buddha is said to have accepted inherited Indian ideas about
    the universe, metempsychosis, and Karma, while later modifying them. It describes
    death as a change of form rather than a break in life-continuity, with repeated
    death and rebirth until cosmic dissolution after a kalpa. It also defines Karma
    as an ethical doctrine of retribution and includes a quotation from Huxley comparing
    inherited character with transmigration.'
