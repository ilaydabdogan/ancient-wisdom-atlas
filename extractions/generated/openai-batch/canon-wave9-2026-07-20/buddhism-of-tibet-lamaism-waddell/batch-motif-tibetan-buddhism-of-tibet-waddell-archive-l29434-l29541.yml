comparison_claims:
- id: claim:1
  claim: The passage explicitly presents Sudhina’s supernatural-wife episode as resembling
    and being parallel to European tales in which a mortal youth loses a supernatural
    wife, reaches a demon abode, and completes tasks with her help.
  claim_level: same_motif
  target: Russian “The Water King,” Grimm’s “Two Kings’ Children,” the Norse “Mastermaid,”
    and the Scottish Highland “Battle of the Birds”
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is reported from the passage’s editorial commentary; the
    excerpt does not provide the full European tale texts for independent comparison.
- id: claim:2
  claim: The Nan-sa drama is said to be molded on the model of Buddhist Jatakas while
    retaining mainly Tibetan local color.
  claim_level: same_function
  target: Buddhist Jataka narrative model
  evidence_refs:
  - ev:2
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supports literary or narrative modeling, not a detailed
    one-to-one motif equivalence with a specific Jataka.
- id: claim:3
  claim: The arrow placed on the girl’s back is interpreted in the passage as a survival
    of the wider pattern of marriage by capture.
  claim_level: same_function
  target: marriage-by-capture pattern
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an authorial ethnographic explanation of a custom rather than
    a comparison between two fully narrated myths.
