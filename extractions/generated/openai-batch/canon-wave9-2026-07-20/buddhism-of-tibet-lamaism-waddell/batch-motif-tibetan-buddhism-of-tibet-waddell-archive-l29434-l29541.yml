canonical_text:
  quote: ''
  summary: 'The passage moves from an editorial comparison of Sudhina’s supernatural-wife
    episode with European tales to Waddell’s introduction and opening of the Tibetan
    play Nan-sa, “The Brilliant Light.” It locates the story at Rinang, lists the
    dramatis personae, notes an arrow-marked marriage custom, and begins a former-birth
    episode in India: an aged Brahman couple has a daughter, the daughter is secluded
    until age fifteen, she asks to cultivate the neglected family fields, works all
    day with servants without food, rebukes her mother as a grass-eating beast, and
    is cursed by her mother to be reborn as an ownerless grass-eating beast.'
  language: English
  quote_policy: summarized
