canonical_text:
  quote: ''
  summary: A royal gathering is held to choose a bride for the prince. Nan-sa attends
    with servants and is noticed by the prince, who sends his minister to bring her
    before him. Nan-sa wants a religious life and answers evasively, but the minister
    interprets her reply as modesty and advises a public betrothal using an arrow
    with five-coloured streamers and a turquoise diadem. The prince declares their
    union fated by former deeds, marks the betrothal, and later Nan-sa’s parents force
    her to accept the marriage. Seven years later she bears a beautiful son, receives
    the treasury keys, and becomes even more beloved. The prince’s elder sister Ani-Nemo,
    displaced from her key-holding position, becomes jealous and mistreats Nan-sa,
    who again longs for full religious devotion.
  language: English
  quote_policy: summarized
