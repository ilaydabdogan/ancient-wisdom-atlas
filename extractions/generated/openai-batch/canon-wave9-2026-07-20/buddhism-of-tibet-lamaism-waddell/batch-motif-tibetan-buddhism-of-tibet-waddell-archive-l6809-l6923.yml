canonical_text:
  quote: ''
  summary: The passage presents an English rendering of Buddha’s Mangala Sutta sermon
    on the greatest blessing, framed by a radiant celestial being asking the Blessed
    One at Jetavana what the greatest blessing is. The reply lists forms of wise association,
    moral conduct, family duty, almsgiving, religious discipline, insight into the
    four truths, and security from sorrow. The passage then summarizes four graduated
    paths toward Arhatship and emancipation from rebirth, using the image of entering
    a stream that carries the devotee toward the ocean of Nirvana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sermon frame places the Blessed One at Srivasta, at the Jetavana monastery,
    in the Garden of Anathapindaka.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At an advanced hour of night, a radiant celestial being illuminates Jetavana,
    approaches the Blessed One, salutes him, stands aside, and addresses him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The celestial being says many gods and men yearn after good and hold diverse
    things to be blessings, then asks what the greatest blessing is.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The reply identifies serving wise men, avoiding fools, giving due honour,
    dwelling in a pleasant land, past good deeds, right desires, knowledge, trained
    discipline, and well-spoken words as the greatest blessing.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The reply also identifies succouring parents, cherishing wife and child, following
    a peaceful calling, giving alms, religious living, helping relatives, and doing
    blameless deeds as the greatest blessing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The reply includes abstaining from sin and strong drink, diligence in good
    deeds, reverence, lowliness, contentment, gratitude, religious teaching, religious
    discourse, temperance, chastity, discernment of the four truths, and the prospect
    of Nirvana.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The sermon states that those who do these things are invincible on every side
    and walk in safety.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The later doctrinal explanation describes four consecutive paths or stages
    toward Arhatship and emancipation from rebirth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The explanation says the higher stages depend on doctrinal comprehension and
    renunciation, and are reachable only by celibate monks or nuns, not ordinary laity
    or hearers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Meditation is named as the chief means of entry into the stages or paths.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The first stage is Srottapatti, described as entering the stream, the state
    of the new convert, which carries the person toward the calm ocean of Nirvana
    and restricts rebirth to god or human forms rather than lower births.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The second stage is described as receiving birth once more on earth and being
    freed from the first five fetters; the third is not returning to earth and reaching
    Nirvana from a Brahma heaven; the fourth is Arhatship in this life, after which
    death brings no rebirth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A footnote explains Arhat as one who has extirpated his passions and as the
    perfected Buddhist saint in later usage.
  category: attribute
  evidence_refs:
  - ev:10
