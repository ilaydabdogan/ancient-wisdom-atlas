  quote: ''
  summary: The passage describes the perceived necessity of offerings before important
    actions, the variety of goods placed at Buddhist and Lamaist shrines, preparatory
    ablution, a Lamaic gesture with mantric syllables, seven stages of Buddhist worship,
    sacrificial offerings including demon propitiation, and the so-called Essential
    Offerings of flowers and incense.
  language: English
