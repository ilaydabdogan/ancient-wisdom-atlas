comparison_claims:
- id: claim:1
  claim: 'The passage supports a cautious comparison between Buddhist/Lama and Brahman/Hindu
    interpretations of the same physical features at Hajo: the cremation rock and
    stone basin receive different sacred explanations in the two traditions.'
  claim_level: same_function
  target: Brahman/Hindu local interpretations of Hajo rock and basin
  evidence_refs:
  - ev:5
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to shared use or reinterpretation of the same
    objects; it does not establish common origin or historical borrowing.
- id: claim:2
  claim: The Assam site and four Tibetan sites are explicitly related as original
    and replicas, with the replicas consecrated by rock from the original site.
  claim_level: same_function
  target: Tibetan copy-sites at Ra-rgyah, Pa-por k’ar, Pur-mo che, and Sel-bragq
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The passage reports the Lamas’ consecration practice but does not provide
    independent dating or archaeological verification.
- id: claim:3
  claim: The Hajo hill is presented as a shared sacred hill whose summit and hill
    form are venerated or occupied by several religious communities.
  claim_level: same_function
  target: Multi-religious veneration of Hajo hill by Mech/Koch, Buddhists, Hindus/Brahmans,
    and Muhammadans
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The passage shows parallel reverence for the same hill, not a shared
    mythic narrative among all groups.
