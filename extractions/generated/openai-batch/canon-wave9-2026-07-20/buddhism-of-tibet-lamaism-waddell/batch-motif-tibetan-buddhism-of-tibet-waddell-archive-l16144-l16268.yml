canonical_text:
  quote: ''
  summary: The passage describes Kusa grass as a Buddhist ritual object because of
    its connection with the Bodhisattva under the Bodhi tree, then gives an ethnographic
    account of the Hajo hill group in Assam as interpreted by Lamas as the site of
    Buddha’s death and cremation. It records pilgrimage practices, landscape identifications
    with Buddha and his disciples, a cremation rock with inscriptions and offerings,
    Tibetan replica-sites consecrated by rock from Assam, and local Buddhist and Brahman
    explanations of a cliff, basin, water, snake, and staff-like rocks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kusa grass is described as a Hindu sacrificial grass also prized by Buddhists
    because it formed the Bodhisattva’s cushion under the Bodhi tree; it is also used
    in Lamaic temples as a broom and altar decoration with peacock feathers in a holy-water
    vase.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author reports that Lamas identify the Hajo hill area as the place where
    Buddha died or was delivered from pain, and that pilgrims believe it to be the
    real site of Buddha’s parinirvana.
  category: setting
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: Buddhist pilgrims from several regions visit the site and carry away scrapings
    of rock and soil, preserving the dust in amulets and placing it beside dead bodies
    for protection from calamities and lower rebirths.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Hajo hill group rises from the plain near the Brahmaputra and is described
    as revered by Mech and Koch worshippers, Buddhists, Brahmans, and Muhammadans
    in different ways.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The hill cluster appears from a distance as three trident-like peaks; Buddhists
    identify the central peak with Buddha and the two side peaks with Sariputra and
    Maudgalyayana, while about sixteen smaller hillocks are called the sixteen disciples.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A bare flattish rock shoulder is identified by Buddhists as the pyre where
    Buddha died and his body was cremated; it bears Tibetan mantra inscriptions and
    nearby bushes have colored rags from pilgrims’ garments tied to them.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the same rock, Hindus have carved a four-armed Vishnu figure, and Brahman
    priests give it a different local identification.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lamas are said to have made at least four copies of the Assam site in Tibet,
    consecrating them by placing pieces of rock from the Assam site on them; the Assam
    site is described as the original Indian site.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A cliff west of the cremation spot is called the vulture’s mound hill and
    is connected in the account with cemetery vultures and the Gridha Kuta Giri hermitage
    of Buddha.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: A stone basin in the jungle is called by Lamas the pot in which death-demons
    boil the heads of the damned; Brahmans instead describe it as a bowl used by Siva
    or Adi-purusha and point to green watery contents as proof.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Brahmans say that a snake inhabits the depths of the stone basin, although
    the author states it was absent during his visit.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Columnar rocks near the uphill path are pointed out as fragments of Buddha’s
    staff, with which he is said to have unearthed the monster bowl.
  category: object
  evidence_refs:
  - ev:9
