canonical_text:
  quote: ''
  summary: A ritual prayer takes refuge in lamas, Buddhas, tantric deities, saints,
    and local holy figures; petitions for blessing and purification through OM, AH,
    and HUM as body, speech, and thought; asks for health, speech, understanding,
    moral transformation, Buddhahood, and benefit for all beings; and then dismisses
    invited deities, spirits, defenders, guardians, and country gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speakers say they go for refuge to victorious lamas described as descended
    from heaven and as holders of Wisdom and the Tantras.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speakers also go for refuge to the Buddhas of the Ten Directions and to
    primordial Samantabhadra Buddha with his spouse.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A long sequence of deities, saints, teachers, kings, gurus, siddhis, lamas,
    tutelary deities, and holy doctrine is addressed as refuges.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The prayer addresses male and female saints of the country and asks the Lama
    to bless the speakers with blessings of the Tantras.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: OM is identified with the secret Body, and the speakers ask for purification
    of bodily sins and pollutions, bodily happiness without sickness, and an undying
    gift of bodily life.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: AH is identified with the secret of Speech, and the speakers ask for purification
    of speech, power of speech, and perfect victorious speech.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: HUM is identified with secret Thought, and the speakers ask for purification
    of mind, good understanding, a pure heart, and the Four Powers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speakers ask for the gifts of True Body, Speech, and Mind and recite Om,
    Ah, Hom.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The prayer requests clearing of sins and defilement, softening of evils, health,
    mental guidance, Buddhahood soon, cutting off from worldly illusions, right path,
    religious understanding, mutual kindliness, ability to deliver beings, self-knowledge,
    mildness, bravery, and tantric blessing.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The speakers describe themselves as innumerable animal beings who, through
    dharanis and prayers, conceive that they have become pure in thought like Buddha
    and work for the welfare of other beings.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The prayer wishes that other animal beings possess happiness, be freed from
    misery, be freed from lust, anger, and attachment, and understand the true nature
    of the religion.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: At the close, the speaker asks Father-Mother Dharmakaya Samantabhadra, Sambhogakaya
    figures, Nirmanakaya sages of the skull-rosary, a Mila-tantra Lama, ghosts, witches,
    defenders, guardians, and invited beings to depart.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The invited beings are said to have been invited to this place.
  category: setting
  evidence_refs:
  - ev:8
