canonical_text:
  quote: ''
  summary: 'The passage describes rites concerning sky demons and disease demons:
    Old father Khen-pa controls the local demons of the sky; the nam-gd rite closes
    the doors of the sky with ritual objects including an upward-directed dog skull;
    an invocation asks Khen-pa, Nam-tel, and Saturn/Pemba for assistance; other ceremonies
    prevent injury from demon classes and exorcise Shé disease demons through images,
    offerings, possession by a tutelary fiend, threats, a purba dagger, and charmed
    seeds and pebbles.'
  language: English
  quote_policy: summarized
