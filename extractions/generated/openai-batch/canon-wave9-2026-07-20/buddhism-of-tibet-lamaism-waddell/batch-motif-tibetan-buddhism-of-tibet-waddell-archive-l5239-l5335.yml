canonical_text:
  quote: ''
  summary: The passage describes an image of the Wheel of Life with demarcated regions
    of rebirth, emphasizes human existence as misery, lists depicted phases of human
    life from birth through funeral rites and religion, and describes the beast state
    as a realm of predation, labor, and suffering, including Nagas preyed upon by
    Garuda.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The regions of rebirth are separated by rainbow-coloured cordons representing
    atmospheric zones between different worlds; the passage also notes that no place
    is allotted to Sukhdvati, celestial Buddhas, or demoniacal protectors in the picture.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Human life is described as almost entirely miserable, with eight named classes
    of misery including birth, old age, sickness, death, ungratified wishes, punishments,
    separation, and offensive objects or sensations.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The human-state picture includes phases such as birth in a cottage, children
    at play, village adult life, labor, an accident in a river, crime and punishment,
    temporal government, old age, disease, death, funeral ceremonies, and religious
    practices.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
- id: obs:4
  text: The funeral scene shows a corpse carried to a pyre on a hill, preceded by
    a Lima blowing a thigh-bone trumpet and rattling a hand drum while holding a white
    scarf attached to the corpse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The white scarf is said to guide the soul by a white path to the pyre, so
    that it may be disposed of properly, have a better chance of good rebirth, and
    avoid straying into the grasp of outside demons.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Religion is represented by a temple above other habitations, with a Lima and
    monk performing worship, a hermit in a cell with ritual objects, and a stupa or
    caitya circumambulated by a devotee.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The beast state is described as more miserable than the human state; animals
    devour one another, humans hunt game, and domestic animals are burdened, goaded,
    milked, shorn, branded, castrated, pierced, or killed.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the water appears a Naga or merman’s house whose inmates grieve because
    Garuda, a monster bird compared to a fabled roc-like bird, preys upon Nagas by
    cleaving the sea with the air from its wings.
  category: relationship
  evidence_refs:
  - ev:7
