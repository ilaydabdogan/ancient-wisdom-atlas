canonical_text:
  quote: ''
  summary: 'The passage describes a monastery daily routine: a monk rises and bows
    before an altar, recites prayers, vows to benefit living beings, repeats mantras,
    performs an animal-benefit spell, attends pre-sunrise assembly signaled by bell
    and conch, performs ablutions with water while imagining sins and impurities washed
    away, repeats deity mantras with a rosary, enters the temple by grade, observes
    strict seating rules under discipline, chants services, and receives tea after
    a grace.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On waking, the monk is instructed to rise, bow three times before the altar
    in his cell, and recite a prayer asking for help in keeping monastic rules and
    abstentions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A subsequent prayer addresses Buddhas and Bodhisats of the ten directions,
    states the monk's desire to benefit animals and living things, and consecrates
    body and wealth to virtue.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The monk repeats specified mantras seven times from a sutra and another named
    text or extract.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that a spell, when repeated three times with spitting on
    the sole of the foot, causes animals dying under the monk's feet that day to be
    born as gods in Indra's paradise.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After worship, the monk may return to sleep if the night is not far advanced;
    if dawn is near, he repeats mantras or prayers until the bell signals the first
    assembly.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The first assembly is held before sunrise; a great bell awakens sleepers,
    and a conch-shell trumpet call signals monks to dress and proceed to the lavatory
    stone pavement for ablution.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Before washing, each monk chants a mantra and mentally conceives that bodily
    impurities and sins are being washed away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ablutions are performed with water in copper vessels and a pinch of saline
    earth used as soap; the passage says these ablutions are usually partial.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: After ablution, each monk holds a rosary and repeats the mantra of a favorite
    deity, usually Manjusri or Tari, or of a tutelary fiend, as many times as possible.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: At the second conch blast, fully ordained monks bow before the temple door,
    novices bow in the outer paved court, and all enter the temple according to grade
    while the provost-marshal stands by the door with a rod.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The monks sit in rows on their own mats, cross-legged in Buddha-fashion, facing
    front in silence; breaches of seating and dress rules are punished with disciplinary
    rods or by the clerical sacristan for novices.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: At the third conch-trumpet blast, services are chanted, including an invocation
    of eloquence, a refuge formula, and Tson-Kapa's ritual; tea is then served after
    a grace led by the presiding Lama.
  category: sequence
  evidence_refs:
  - ev:12
