canonical_text:
  quote: "“a great fire came out and disappeared into a tree”"
  summary: 'The passage describes the Tibetan state oracle associated with Pe-har
    and Néi-ch’un: its promotion under the Grand Lama Nag-Wan, a legend of the spirit’s
    relocation through possession, a river-borne box, fire entering a tree, and a
    resuscitated corpse, as well as the oracle’s official and private divinatory functions,
    ecstatic performances, written responses, and ritual insignia.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Pe-har’s spirit is said to have transferred first to Ts’al-gun-t’an and then
    miraculously to its present location.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the seventeenth century the Grand Lima Nag-Wan made the Na-ch’un ch’o-je
    a Lama of the yellow sect, gave him a monastery, and made him the state oracle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The alleged reason for the oracle’s pre-eminence is that he frustrated an
    attempt to poison a tea-cistern by driving a knife through the vessel and discharging
    the alleged poison.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The oracle’s monastery contains monks, and the successor is chosen from them,
    with the succession described as passing by breath rather than heredity.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The oracle is described as dressed like a Ge-lug-pa monk, usually in red robes,
    with a lotus-shaped yellow hat relieved by red and topped by a ruby button.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the legend, Pehar enters a resident of Ts’al-gun-tan, and a Lama named
    Z’an shuts the possessed man in a box and throws the box into the river Kyi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The abbot of De-pung prophesies that a box will float down the river; pupils
    find it and bring it to the site where the Na-ch’un temple stands.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the box is opened, a great fire comes out and disappears into a tree,
    and the dead body of a man is found in the box.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: By the abbot’s prayers the spirit consents to return to the body, and the
    resuscitated corpse asks for a small dwelling at that place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The state-sorcerer proceeds yearly to Lhasa, where he prophesies the events
    of the year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Government officials consult the oracle about projects, war, and sickness,
    and sorcerers accompany troops to battle and interpret omens of birds and animals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Private people may consult the oracle by paying fees and giving presents.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Applicants present written requests; when enough requests accumulate, the
    augur is disclosed in a wildly ecstatic state, throws rice, falls in convulsions,
    and replies to questions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Attendant scribes write down the replies, and the document is later sealed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The utterances are described as often poetic or allegorical, brief, and ambiguous.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: One seen response bears a circular red seal of crossed thunderbolts and addresses
    the oracle’s throne and religious protector with exalted language.
  category: object
  evidence_refs:
  - ev:7
