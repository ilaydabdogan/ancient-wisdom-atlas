canonical_text:
  quote: ''
  summary: Huc's account describes a square brick-walled enclosure at the foot of
    a mountain near a Buddhist temple. Inside is a marvellous tree whose leaves, bark,
    and branches appear to bear Tibetan characters as natural parts of the plant.
    The observers suspect fraud, examine the tree closely, remove old bark to inspect
    new bark beneath, and report finding no trace of trickery. They state that they
    cannot explain the phenomenon.
