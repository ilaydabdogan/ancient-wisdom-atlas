canonical_text:
  quote: ''
  summary: A girl dies and is reborn as a doe under her mother’s curse. The orphaned
    doe marries the hart Dar-gyas and bears a fawn. She dreams that hunters, dogs,
    a decapitated deer head, a stretched skin, and a vast blood pool foretell the
    hart’s death. The hart dismisses the warning, but is then hunted and killed by
    a fierce man with a noose and bow. The hart, doe, and fawn are subsequently reborn
    as named human figures. The next act begins with Nan-sa’s mother dreaming of a
    lotus from her body, fairies making offerings, and a ray shaped like Tara’s letter
    Tam entering her head; the father interprets this as the coming of an incarnate
    Bodhisat. Nan-sa is born, named, celebrated, educated, pious, and later attends
    a royal tournament.
  language: English
  quote_policy: summarized
