canonical_text:
  quote: ''
  summary: The passage describes the Lamaist temple library, the physical handling
    and ritual reverence of books, scribal dedication formulas, European collections
    of Lamaist literature, and the Lamaist order as a highly ranked religious institution.
    It presents Lamas as mediating religious figures, describes ranks of human and
    celestial Bodhisats and incarnate Lamas, contrasts monks, nuns, and laity, and
    states that families may provide sons to the priesthood under social or governmental
    pressure.
  language: English
  quote_policy: summarized
