  quote: ''
  summary: The passage describes types of Tibetan rosaries, their materials, deity-specific
    uses, associations with Garuda, snakes, wealth, necromancy, color correspondences,
    lay and monastic bead-counting practices, mantra formulas, and related ritual
    equipment including staff, bell, drum, vajra, prayer-wheel, and begging-bowl.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Tibetan name Raksha is apparently derived from
    the Hindu rudraksha beads associated with Rudra or Niva.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Naiji-ga pd-ne rosary is used only for worship of Namsra or Vaisravana
    and by wizards in mystical incantations.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Naiji-ga pd-ne rosary consists of glossy jet-black nuts, described as
    seeds of the Lwi-t’ai tree from the southeastern Himalayan subtropical forests.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Naiji-ga pd-ne beads are described as emblematic of the eyes of the Garuda
    bird, who is linked to Vajra-pani and called a great enemy of snakes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage connects the bead-name with naga, a serpent, and explicitly links
    the rosary’s use in wealth-god worship with snakes as mythological guardians of
    treasure.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A rosary of snake-spines or vertebrae, containing about fifty vertebrae, is
    used only by sorcerers in necromancy and divination.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The complexion of the worshipped deity sometimes determines rosary color,
    with examples including turquoise for Tara, red for Tam-din, yellow for Manjusri,
    and amber for Vaisravan.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lay rosaries are described as mixed beads of various colors, sizes, and materials,
    and their counter-strings usually end in a vajra.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: When not in use, the rosary is wound around the right wrist like a bracelet
    or worn around the neck with the knotted end uppermost.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The act of telling the beads is called tas-c’e and is glossed as literally
    meaning to purr like a cat, with prayer-muttering compared to that sound.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: During bead-counting, the right hand holds the rosary near the breast; each
    bead is seized at the word Om, revolved to the right, and dropped before the next
    bead is taken.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At the end of each cycle, three keeper-beads are fingered while saying three
    syllables printed as Om, Ah, and a third OCR-rendered syllable.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Mystic formulas follow the prayer, are said to contain its essence and act
    as powerful spells, and are usually Sanskritic, deity-specific, and often unintelligible
    to the worshipper.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Other Lama equipment listed includes a prayer-wheel, vajra-sceptre, bell,
    skull-drum, tambour, amulet, booklets, ornaments, begging-bowl, and mendicant
    staff.
  category: object
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:15
  text: The mendicant staff is described as having jingling rings to drown worldly
    sounds and warn small animals; the Tibetan form is usually tipped by a trident.
  category: attribute
  evidence_refs:
  - ev:11
