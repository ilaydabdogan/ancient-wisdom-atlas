  quote: THE GREAT FORMER BIRTH OF BUDDHA AS THE CHARITABLE PRINCE VISVANTARA.
  summary: A picture caption and numbered episode list for the Visvantara Jataka identifies
    Visvantara as a charitable prince and former birth of Buddha. The listed scenes
    include banishment to the forest, the princess gathering food and being taken
