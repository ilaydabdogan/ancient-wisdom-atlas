canonical_text:
  quote: ''
  summary: The passage describes the Om Mani formula, its alleged efficacy by sight
    or proximity rather than vocal recitation, its multiplication on ribbons, prayer-wheels,
    stones, and flags, and its stated purpose of ending metempsychosis through rebirth
    in the western paradise. It also notes uncertainty about the formula’s origin,
    possible expanded or substitute formulae in Japanese Buddhism, varied interpretations
    including a seldom-accepted phallic reading, and reverse recitation by Bon-pa
    followers.
  language: English
  quote_policy: summarized
