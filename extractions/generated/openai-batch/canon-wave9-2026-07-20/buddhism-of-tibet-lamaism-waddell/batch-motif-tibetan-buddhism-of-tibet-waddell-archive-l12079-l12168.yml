canonical_text:
  quote: ''
  summary: The passage argues that Na-pa used retrospective identifications with Tibetan
    kings, Buddhas, and Bodhisattvas to legitimate rule and church hierarchy; it traces
    the Tashi-lhunpo reincarnate-lama system to Na-pa’s reign, describes the reincarnation
    of Lo-zan Ch’o-kyi Gyal-ts’an as a newborn linked to Amitabha, and outlines a
    ranked hierarchy of Lhasa, Tashi-lhunpo, higher incarnations, and ordinary reincarnate
    lamas.
  language: English
  quote_policy: summarized
