literal_observations:
- id: obs:1
  text: 'The Kah-gyur is reported as printed in Tibet only at two places: an older
    edition at Narthang and a later edition at Der-ge in eastern Tibet/Kham.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Narthang edition is described as filling one hundred volumes, while the
    Der-ge edition contains the same matter distributed into one hundred and eight
    volumes, explicitly called a mystic number.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports or hears of additional editions at Punakha in Bhotan,
    Kumbum/Mongolian, and Pekin.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Most large monasteries, even in Sikhim, are said to possess a full set of
