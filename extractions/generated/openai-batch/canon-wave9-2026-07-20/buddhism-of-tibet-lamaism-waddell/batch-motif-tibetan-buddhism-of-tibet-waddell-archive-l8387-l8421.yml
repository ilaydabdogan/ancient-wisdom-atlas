  summary: The passage describes where the Kah-gyur is printed, its volume counts
    including an edition arranged as 108 volumes, other reported editions, prices
    and exchanges for copies, and its Mongolian translation and revision through multilingual
    scholarly collation under imperial patronage. It also notes Csoma's analysis of
    the Kah-gyur and Tan-gyur contents.
  language: English
