canonical_text:
  quote: ''
  summary: The passage describes Tibetan monastery architecture, approaches lined
    with prayer flags and Ch'orten and Mendon monuments, the form and symbolism of
    Ch'ortens as relic or funerary monuments, the cosmological and elemental symbolism
    assigned to their parts, portable miniature Ch'ortens used by itinerant Lamas,
    and Mendon walls faced with Mani-inscribed stones added by pilgrims as pious acts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Many Tibetan monasteries are described as built of stone or sun-dried brick,
    often with flat roofs, yak-hair cloth cylinders, white ribbon crossings, and crescent-and-spear
    tops.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In temple-monasteries, cells and dormitories may cluster around the temple;
    ground floors are often windowless storehouses, while upper storeys are reached
    by staircases or notched inclined beams.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Indian term Arama or Sangharama is said to be applied in Tibet to the
    auditory or library rather than to a grove, because Tibet is described as nearly
    destitute of groves.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The approaches to a monastery are described as lined with tall prayer flags
    and with large Ch'orten and Mendon funerary monuments.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ch'ortens are described as solid conical masonry structures corresponding
    to Indian Buddhist Caityas and Stupas, originally intended as relic-holders and
    later often erected as cenotaphs in memory of Buddha or canonized saints.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The original Caitya or Stupa form is described as a solid dome or hemisphere,
    called garbha or 'womb' because it encloses a relic, crowned by a square capital
    and one or more umbrellas understood as royal symbols.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Lamaist Ch'ortens are said to retain Indian features but often differ by having
    an inverted dome, with a pair of eyes sometimes shown on the capital.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Above the capital, the Ch'orten may have a thirteen-segment spire interpreted
    as representing thirteen Bodhisattva heavens, topped by a kalsa with forms such
    as lotus, crescent moon, sun, canopy, and a spike representing Buddha's sacred
    light.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'Some Lamaist Caityas are described as symbolizing five elements into which
    a body is resolved at death: earth, water, fire, air, and ether.'
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: A miniature 'many doors' Ch'orten contains many small deity images in niches
    and inner compartments and is carried by itinerant Lamas from village to village
    for exhibition to lay people.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Mendons are long wall-like structures, sometimes over a mile long, dividing
    the road so that a passer-by may pass respectfully with the right hand toward
    the wall.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Mendons are faced with blocks inscribed with the six-syllabled sentence 'Om
    mani padme hum'; they may have Ch'ortens at both ends, niches for incense or clay
    funerary Caityas, and figures of three protecting divinities.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: Adding Mani slabs to a Mendon is described as a pious act; at larger temples
    or pilgrimage places, a mason carves stones according to the order and at the
    expense of a donating pilgrim.
  category: action
  evidence_refs:
  - ev:10
