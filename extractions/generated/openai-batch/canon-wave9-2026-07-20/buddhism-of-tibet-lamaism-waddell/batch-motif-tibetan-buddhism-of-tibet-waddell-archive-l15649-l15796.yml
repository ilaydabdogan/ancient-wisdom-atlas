canonical_text:
  quote: ''
  summary: The passage inventories offerings and ritual objects placed below and on
    a Tibetan Buddhist altar, including water and rice offerings, a three-tiered rice
    world-offering, torma cakes, essential image-monument-book objects, dorje and
    bell, holy-water vase, mirrors, divining arrow, cymbals, trumpets, horns, thigh-bone
    instruments, drums, and libation jugs. It distinguishes implements used for Buddha
    and higher divinities from those used for inferior deities and demons, and describes
    the preparation of human thigh-bone trumpets for summoning demons.
  language: English
  quote_policy: summarized
