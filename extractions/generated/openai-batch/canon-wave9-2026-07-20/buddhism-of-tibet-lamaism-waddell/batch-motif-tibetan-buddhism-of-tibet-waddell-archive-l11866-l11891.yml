  summary: The passage describes the diet of the Limas, including grains, dairy, tea,
    soup, and limited meats; notes prohibitions on fish and fowl; states that fully
    ordained Ge-longs are expected to eat abstemiously and abstain from meat, though
    the Grand Lama of Tashi-lhunpo is reported to eat flesh-food; states that some
    monks and holier Limas may not drink spirituous liquor but offer it as libations
    to devils; and includes a caption for a silver libation-jug and chalice-cup.
