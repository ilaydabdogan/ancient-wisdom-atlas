canonical_text:
  quote: ''
  summary: The passage describes Tibetan/Lamaist enemy-killing and enemy-torturing
    charms involving an animal-headed axe, a flour or clay human image, astrological
    and animal markings, weapons, feathers, wood, a lamp, meditation and spells. It
    also reports a field-discovered wooden destructive charm, wound-protection charms
    worn by Tibetans, and introduces prayer-flags as tall inscribed ritual flags possibly
    related to Asoka pillars and Trees of the Law.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says necromantic charms for killing an enemy are used mostly in
    inter-tribal feuds and warfare with foreigners.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The enemy-killing rite requires a three-headed axe with a bull head on the
    right, a snake head on the left, and a pig head in the middle, with a lamp kept
    on the middle head.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A wheaten-flour human image called a linga is placed in the pig's mouth; its
    upper body is black, its lower body red, and it is marked with planets, constellations,
    trigrams, mewa, Garuda claws, eagle wings, and a snake tail.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Additional items attached to or placed around the image include a bow and
    arrow, provisions, an owl feather, a rook feather, poison-tree wood, red swords,
    and colored Rgyangbu wood.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The practitioner is instructed to sit in quiet meditation and recite a spell
    declaring that the axe heads, linga image, and lamp repel sorcerers, plagues,
    earth-demons, and evil spirits, and that the axe cleaves the heart of the angry
    enemy and evil spirits.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: During the Sikkim expedition of 1888 near Mt. Paul on the Tukola ridge, a
    propeller-like carved wooden contrivance was found and identified as a charm for
    destroying enemies by cleaving them to pieces.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The wooden field charm bore a Bon spell, invoked Tam-din, Vajrapini, and the
    Garuda, and ended with a destructive formula glossed as “Break! Destroy!”
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage reports that bodies of Tibetans slain in the encounters were found
    with one or more charms against wounds, including elaborate examples containing
    figures of weapons guarded against.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: For torturing an enemy short of death, the passage gives directions for making
    a clay-and-dough human image from earth connected with the enemy, putting thorns
    on its head, thrusting a copper needle through the heart region, reciting a spell,
    and either prolonging the act for death or withdrawing and washing the image and
    needles for temporary anguish followed by recovery.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Prayer-flags are described as tall flags inscribed with pious sentences, charms,
    and prayers, fluttering around Lamaist settlements and combining Indian, Chinese,
    and Tibetan symbolism.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage suggests that prayer-flags may be related to Asoka pillars and
    to the Trees of the Law in Lamaism.
  category: relationship
  evidence_refs:
  - ev:9
