canonical_text:
  quote: ''
  summary: The passage presents part of an annual Tibetan horoscope calculation for
    a man and his wife. It evaluates categories such as Life, Body, Power, Luck, and
    Intelligence through birth-conflict, Parkha, and Mewa calculations, identifies
    auspicious or inauspicious results, names hostile or displeased spirits and deities,
    and prescribes readings, offerings, taboos, ritual objects, flags, images, lamps,
    and ransoming a sheep as remedies. Footnotes explain elements of the reversed
    age calculation and the sky-seizing rope calculation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The male horoscope summarizes Life, Body, Power, Luck, and Intelligence as
    having different balances of black or white excess and assigns practical and ritual
    consequences to each.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For the male subject, Life has black in excess and calls for long-life sutra
    and dharani readings; Body has white in excess and is said to be free from sickness
    in that aspect of the calculation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For the male subject, Power has black in excess and is associated with scanty
    food, suffering crops, and dying or lost cattle; remedies include readings, holy
    cakes, and giving food and sweets to monks and children.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: For the male subject, Luck has black in excess and warns against provoking
    a lawsuit or going on a long journey; remedies include Du-kar recitations, planting
    Lun-ta flags equal to years of age, lamps and incense, readings, a self-image
    thrown toward an enemy, and an earthen Caitya.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: For the male subject, the Parkha result forbids excavating earth or removing
    stones, states that Nagas and Earth master-demons are opposed to him, lists disease
    and directional dangers, and prescribes readings and offering rites.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: For the male subject, the Mewa result says Tsen and Gyalpo demons give trouble,
    dreams will occur, the gods are displeased, pains and boils will ensue, and remedies
    include making ritual objects, worshipping guardian deities, and ransoming a sheep
    from butchers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: For the wife, birth-conflict calculation marks Life and Intelligence as bad,
    Body and Power as good, and Luck as neutral, with remedies against scandal, sky-connection
    interruption, and the risks of travel or business.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: For the wife, the Parkha result forbids building or repairing a house, allowing
    marriage in the house, and spilling water on the hearth; it also says a dead person’s
    devil-spirit is offended and prescribes avoidances and readings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: For the wife, the Mewa result predicts serious domestic quarrels, lying reports
    of infidelity, grief among relatives, and dropsy, but the passage breaks off before
    giving the full preventive instructions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Footnotes describe the reversed age calculation by gender, element, and year,
    and describe the Sky-seizing Rope as calculated from the Log-men year and element
    correspondences.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
