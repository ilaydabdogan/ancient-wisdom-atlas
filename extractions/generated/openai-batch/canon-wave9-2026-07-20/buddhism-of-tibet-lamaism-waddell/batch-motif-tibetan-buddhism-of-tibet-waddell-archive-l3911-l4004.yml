canonical_text:
  quote: ''
  summary: 'The passage presents a Lamaist Buddhist world-system: many universes exist
    in space; each rests on layers of wind, water, gold, and earth; Mt. Meru rises
    at the center; continents, concentric mountains, and oceans surround it; an iron
    wall encloses the system; celestial bodies, royal emblems, and fairy mothers occupy
    the upper air. Footnotes add comparisons to other Buddhist traditions, Greek Olympus,
    and the churning of the milk ocean.'
  language: English
  quote_policy: summarized
