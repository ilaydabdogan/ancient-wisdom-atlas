canonical_text:
  quote: ''
  summary: 'The passage describes Waddell''s account of the development of celestial
    Buddhas: a solar and western-paradise association for Amitabha, the five celestial
    Buddhas and their directional order, the Adi-Buddha above them, the three bodies
    of Buddha, ascetic and adorned iconographic series, emanated celestial Bodhisat
    sons, and later Tantric female energies including Tara.'
