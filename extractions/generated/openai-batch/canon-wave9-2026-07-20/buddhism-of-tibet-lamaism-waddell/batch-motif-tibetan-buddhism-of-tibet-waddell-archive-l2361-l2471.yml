- id: ev:8
  type: summary
  locator: lines 2432-2441
  quote_or_summary: 'Two other Nin-ma lamas arrive: the Kar-tok-pa lama called The
    Great Soul by the western gate of Single La and the Na-dak-pa lama called The
    Great Sage by the southern gate; their meeting place is called Yok-sam, meaning
    the three superior ones or noblemen.'
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:9
  type: summary
  locator: lines 2442-2457
  quote_or_summary: At a council, the three lamas say the new irreligious country
    needs a king; the Na-dak-pa and Kar-tok-pa lamas claim royal lineage, while Lha-tsiin
    cites Guru Rim-bo-ch’e’s prophecy of four noble brothers and an eastern man named
    P’iin-ts’ok.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:10
  type: summary
  locator: lines 2458-2471
  quote_or_summary: Two messengers find P’iin-ts’ok near Gangtok churning milk; he
    gives them milk, identifies himself, is brought to the lamas, and is coronated
    with a holy water-vase and anointing water, given the surname Nam-gyé and the
    title religious king.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source metadata; summarized evidence.
