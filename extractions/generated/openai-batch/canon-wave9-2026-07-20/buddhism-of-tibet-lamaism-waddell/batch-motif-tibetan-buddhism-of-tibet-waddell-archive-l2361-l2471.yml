candidate_motifs:
- id: motif:1
  label: Prophetic saint averts danger through startling bodily acts
  taxonomy_refs:
  - wisdom
  basis: The saint explains his blow as removing danger and his vomiting as signifying
    the Grand Lama’s future power and riches; he also gives a paper that later resolves
    a difficult imperial query.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage presents the acts as an episode in a saint’s life; it does
    not state a generalized ritual rule.
- id: motif:2
  label: Opening a hidden country through a prophesied religious journey
  taxonomy_refs:
  - mystical_quest
  - culture_hero
  - departure
  basis: Lha-tsiin says he must follow Guru Rim-bo-ch’e’s prophecy, open the northern
    gate of hidden Sikhim, and develop the country religiously.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The text frames the country specifically as Sikhim/De-mo-jong; broader
    motif classification should remain provisional.
- id: motif:3
  label: Mountain deity transforms into an animal and speaks with a sage
  taxonomy_refs:
  - shapeshifter
  basis: The mountain god Kan-ch’en dsé-na transforms into a wild goose and converses
    with Lha-tsiin.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The only transformation described is a single mountain god taking wild-goose
    form.
- id: motif:4
  label: Miraculous flight or ascent to a high mountain
  taxonomy_refs:
  - ascent
  basis: Lha-tsiin flies miraculously to the upper part of Kabru and later flies down
    to his servants.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage emphasizes flight to a mountain region rather than a detailed
    ascent narrative.
- id: motif:5
  label: Directional gate-openers establish sacred geography
  taxonomy_refs:
  - world_center
  basis: The narrative organizes entry into Sikhim through northern, western, southern,
    and eastern directions, with the three lamas and the fourth prophesied figure
    linked to those directions.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage does not explicitly call the meeting place a world center;
    the taxonomy link is based on directional organization of sacred territory.
- id: motif:6
  label: Prophecy-based royal legitimacy and ritual anointing
  taxonomy_refs:
  - royal_legitimacy
  basis: Lha-tsiin cites a prophecy identifying P’iin-ts’ok as the fourth noble brother,
    after which the lamas coronate him with a holy water-vase and anointing water
    and title him religious king.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage reports a local foundation and coronation account; it should
    not be generalized beyond this evidence without comparison.
- id: motif:7
  label: Milk hospitality before recognition of the future king
  taxonomy_refs:
  - sacred_exchange
  basis: Before identifying himself, P’iin-ts’ok invites the messengers to sit and
    gives them milk; he is then conducted to the lamas and coronated.
  evidence_refs:
  - ev:10
  confidence: low
  cautions: The passage does not explicitly interpret the milk as sacred or as part
    of the coronation; this is a weak candidate pattern only.
- id: motif:8
  label: Hidden written wisdom resolves an otherwise confounding royal query
  taxonomy_refs:
  - wisdom
  basis: The Grand Lama is confounded by the Chinese emperor’s question about rainbow
    colour until he consults the paper given by the saint and finds full information.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The query is reported briefly, and the text does not elaborate the contents
    of the paper.
