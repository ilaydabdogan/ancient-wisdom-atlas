canonical_text:
  quote: ''
  summary: 'The passage recounts episodes in the life of Lha-tsiin: his disruptive
    arrival before the Grand Lama, prophetic explanations of striking and vomiting,
    his journey to open Sikhim as a hidden country, encounters with a mountain god
    and other lamas, miraculous flight to Kabru, the meeting of three lamas at Yok-sam,
    and the prophecy-based selection and coronation of P’iin-ts’ok Nam-gyé as religious
    king.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The saint is seized and tied to the Dé-ring monolith as punishment for trumpeting
    close to the castle, then shakes the hill of Potala.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Grand Lama orders the saint’s release and admission after the shaking
    of Potala brings the saint’s arrival to notice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Grand Lama’s presence, the saint strikes him with his fist and vomits,
    astonishing the courtier lamas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The saint explains that the blow removes a coming danger, that a paper he
    gives will help in a later peril in China, and that the vomiting signifies future
    power and riches for the Grand Lama through him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A later query by the Chinese emperor about the essence of rainbow colour confounds
    the Grand Lama until he consults the saint’s paper, satisfies the emperor, and
    receives honour and riches.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After returning from China, the Grand Lama offers Lha-tsiin treasure in gratitude,
    but Lha-tsiin refuses it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Lha-tsiin says that according to Guru Rim-bo-ch’e’s prophecy he must open
    the northern gate of the hidden rice-valley country De-mo-jong, or Sikhim, and
    develop it religiously.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Lha-tsiin attempts to enter Sikhim by Dsong-ri, cannot find a path, and remains
    many days in a cave called the very pleasant grove.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mountain god Kan-ch’en dsé-na transforms himself into a wild goose and
    converses with Lha-tsiin, who composes a book of worship and offerings for the
    mountain god.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Another Kar-tok-pa lama searches unsuccessfully for a path into Sikhim, meets
    Lha-tsiin at the cave, and is told to try the western gate because he is not destined
    to open the northern gate.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Lha-tsiin finds no road beyond the cave of Skam-pa Kha-bruk, flies miraculously
    to the upper part of Kabru, blows his kang-ling, later flies down, and guides
    his servants by road to Norbu-gang in Sikhim.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: 'Two other Nin-ma lamas arrive: the Kar-tok-pa lama through the western gate
    and the Na-dak-pa lama through the southern gate; the meeting place is called
    Yok-sam, meaning the three superior ones or noblemen.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: At a council, the three lamas say the new and irreligious country needs a
    dispenser of gifts, or king, to rule on their behalf.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Na-dak-pa and Kar-tok-pa lamas each claim royal lineage, while Lha-tsiin
    cites Guru Rim-bo-ch’e’s prophecy that four noble brothers will meet in Sikhim,
    including an eastern man named P’iin-ts’ok.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Two messengers find P’iin-ts’ok near Gangtok churning milk; he invites them
    to sit, gives them milk to drink, and then states his name.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: P’iin-ts’ok is brought to the lamas, coronated by placing a holy water-vase
    on his head and anointing him with water, exhorted to rule religiously, given
    Lha-tsiin’s surname Nam-gyé, and titled religious king.
  category: sequence
  evidence_refs:
  - ev:10
