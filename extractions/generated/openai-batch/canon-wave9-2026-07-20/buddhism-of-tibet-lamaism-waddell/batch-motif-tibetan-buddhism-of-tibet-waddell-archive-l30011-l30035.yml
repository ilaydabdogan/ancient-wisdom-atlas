canonical_text:
  quote: ''
  summary: After Nan-sa’s death, the lord arranges funeral offerings and the death-astrologer
    prescribes exposure of the body on an eastern hill before later disposal. Nan-sa’s
    spirit travels to Bardo, is seized by the Death-king’s minions, and is brought
    before the judge-king of the dead, where she sees wicked souls condemned to hell-torments
    and pious souls sent to heaven. The supplied passage ends as she throws herself
    before the judge in fear.
  language: English
  quote_policy: summarized
