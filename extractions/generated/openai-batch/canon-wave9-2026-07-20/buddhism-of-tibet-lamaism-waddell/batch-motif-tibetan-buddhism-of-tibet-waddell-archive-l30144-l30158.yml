  quote: sailed away, Buddhalike, through the sky, vanishing into space like the rainbow.
  summary: Nan-sa, despairing because her Lama is threatened for her sake, dresses
    as a novice, ascends the convent roof, and miraculously flies away through the
    sky, disappearing like a rainbow. The lord of Rinang and his retinue, dismayed
    and remorseful, fall down, surrender their arms and armour to the Lama, promise
    not to molest him again, and return home. The audience gives auspicious shouts
    as the play ends.
