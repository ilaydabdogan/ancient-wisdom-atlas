canonical_text:
  quote: ''
  summary: The passage presents an account of reincarnate Lama succession and the
    Dalai Lama’s claimed incarnation as Avalokita. It describes a deceased head Lama
    being reborn in a child, located by oracular signs, installed in office, and succeeded
    again through repeated rebirth. It also discusses Geden-dub as an early instance,
    later adoption by other sects, and a later theory of celestial Lama-reflexes or
    emanations associated with Gyal-wa Na-pa.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Other sects are described as retaining separate hierarchical systems while
    acknowledging the Grand Lama of Lhasa as head of the Lamaist church because he
    is held to be the incarnation of Avalokita.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The other sects are said to have adopted the theory of re-incarnate succession
    and divine reflexes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the origin and development of the theory of re-incarnate
    Lamas had been obscured so that it appeared ancient.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author proposes that the theory arose no earlier than the fifteenth century
    and initially served to stabilize succession to the headship of a sect.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage distinguishes this succession theory from orthodox Buddhist karmic
    rebirth, saying the latter is not confined to one channel.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The succession theory holds that the spirit of a deceased head Lama is reborn
    in a child, who is found by oracular signs and installed in the vacant chair;
    the process repeats after each death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says this repeated rebirth secures continuous succession by the
    same individual through successive re-embodiments.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The author identifies Ge-den-dub as the first authentic instance of a re-incarnate
    Lama and says the infant reincarnate succession begins after his death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The practice is said to have been adopted by Lamas of other sects and extended
    so that many great monasteries had their own reincarnate Lama chiefs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The expanded theory of celestial Lama-reflexes ascribes the spirit of the
    original Lama to an emanation or Nirmanakaya from a celestial Buddha or divine
    Bodhisat incarnate in the church.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Gyal-wa Na-pa is presented as the first celestial incarnate Lama in this account
    and as an incarnation of Avalokita; the four preceding Grand Lamas are said to
    have been promoted to the same rank.
  category: relationship
  evidence_refs:
  - ev:7
