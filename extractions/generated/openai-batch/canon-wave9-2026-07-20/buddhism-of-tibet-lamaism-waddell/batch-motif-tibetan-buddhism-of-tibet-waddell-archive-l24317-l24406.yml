literal_observations:
- id: obs:1
  text: 'The passage explains change in nature through paired processes: Shan is associated
    with Yang and expansion, while Awei is associated with Yin and contraction.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Divination is described as using diagrams and manipulating a fixed number
    of stalks from a plant called shih.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Par-k'a are individually named Heaven, Earth, Fire, Thunder, Mountains,
    Celestial Water, and Terrestrial Water, with two signs sometimes called Iron and
    Tree.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mountain, Iron, and Water are described as sons of Earth and Heaven; Wind,
    Fire, and Tree are described as their daughters.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that Chinese divination uses hexagrams, while Tibetan divination
    uses trigrams.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Nine Mewa are arranged as a quadratic square or circle, often like a magic
    square with equal totals in all directions.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Seasonal spirits are said to influence whether days are lucky or unlucky,
    and their migrations can be determined only by Lamas.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The most malignant evil spirits named in the passage are a black dog, a monster
    with a dragon-tail, a man on horseback, and the Phoenix, assigned respectively
    to spring, summer, autumn, and winter.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A Lamaist astrologer's almanac is said to give six presiding influences for
    each day.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The example monthly record gives auspicious and inauspicious weekdays, a direction
    not to travel, a holiday for the Kalacakra teaching, a northwest ritual road for
    throwing cake and the devil's image, and a caution about a genius loci moving
    from west to east.
  category: sequence
  evidence_refs:
  - ev:10
