canonical_text:
  quote: ''
  summary: 'The passage describes organization and discipline in Tibetan monastic
    colleges: monasteries are divided into provincial clubs and collegiate schools;
    club officers supervise temples, stores, kitchens, offerings, and conduct; applicants
    are questioned and provisionally housed before formal admission; assembly-hall
    officials regulate chanting, seating, purity practices, and conduct; monks follow
    a morning routine of bells, washing, dress, bowing, circumambulation, mantra repetition,
    assembly entry, and ranked seating.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The monastery has its own abbot, houses monks by nationality or province in
    separate K’ams ts’an clubs, and has a common cathedral or great congregation hall.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Named monasteries are described as divided into collegiate schools and sectional
    clubs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Each club has at least two Lama-officers: an elder officer connected with
    the club temple and instruction in offerings, and a younger officer connected
    with the storehouse, public tea, and kitchen.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The two club officers are responsible for the conduct of their section’s monks,
    may be fined for pupils’ wrongdoing, and are changed yearly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An admission applicant goes to the paved court of the monastic club, where
    masters ask where he has come from and whether he has relatives or acquaintances
    in the monastery.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the applicant has a relative or acquaintance, that person takes him to
    a private chamber; if not, he receives tea and wheaten flour, stays in the kitchen
    for three days, and may then be taken under a master’s charge for a formal application.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Assembly-hall officials include a great celebrant, provosts, subordinate orderlies,
    Ch’ab-rils who distribute water for mouth-rinsing after mantra recitation, and
    a dMig-rtse-ma Lama who fixes congregation time and tea-general arrangements.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Early in the morning, a junior pupil chants from the top of the cathedral
    temple, clubs beat stone bells to wake occupants, and the monks wash, dress, put
    on a cope, carry a yellow hat, and take a cup and flour bag.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Some monks bow in the court, while others circumambulate the temple or the
    temple of Mañjuśrī, repeating his mantra.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the assembly call, pupils gather near the doors, put on yellow hats, join
    the chant, enter in proper order when the door is opened, and sit according to
    rank with the hat, cup, and bag arranged as described.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
