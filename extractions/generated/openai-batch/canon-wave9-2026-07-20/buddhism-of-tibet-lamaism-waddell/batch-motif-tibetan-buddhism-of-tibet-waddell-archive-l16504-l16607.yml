  locator: lines 16504-16517
  quote_or_summary: Maguta stupa is described as a celebrated Lamaist pilgrimage place
    outside Tibet, northeast of Kathmandu; large numbers of Tibetan Lamas and laypeople
    visit in winter, encamp, worship, offer, and circumambulate.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source; summary only.
- id: ev:2
  type: summary
  locator: lines 16517-16521
  quote_or_summary: The stupa is said to have the special virtue of granting prayers
    for worldly wealth, children, and whatever else is asked.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source; summary only.
- id: ev:3
  type: summary
  locator: lines 16547-16552
  quote_or_summary: The booklet states that the stupa enshrines the spirit of the
    Buddhas of the ten directions and three times, all Bodhisattvas, and holds the
    Dharmakaya.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source; summary only.
- id: ev:4
  type: summary
  locator: lines 16564-16569
  quote_or_summary: King Thi-Srom Detsan asks the Guru at Samyas to tell the history
    of the Mu-qu-ta stupa, said to have been built by sons of the poor mother Pya-rdsi-ma.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source; summary only.
- id: ev:5
  type: summary
  locator: lines 16571-16577
  quote_or_summary: Avalokitesvara approaches Amitabha, prays for animals immersed
    in a miry slough, saves them, goes to Mount Potala, sees innumerable unsaved animals,
    and weeps.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source; summary only.
- id: ev:6
  type: summary
  locator: lines 16577-16586
  quote_or_summary: Two tears of Avalokitesvara are born in Indra's heaven as Kan-ma
    and Kan-ch'un-ma; Kan-ch'un-ma steals flowers in heaven and is reborn on earth
    as punishment in a low pigherd family as Samvara.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source; summary only.
- id: ev:7
  type: summary
  locator: lines 16586-16592
  quote_or_summary: Samvara marries, has four sons, is widowed, supports the family
    by rearing geese, amasses wealth, and decides to build a large stupa in honor
    of the Tathagatha.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source; summary only.
- id: ev:8
  type: summary
  locator: lines 16592-16601
  quote_or_summary: Samvara asks the king for only as much ground as one hide can
    cover; after he assents, she cuts the hide into thongs, encloses a large space,
    and begins building with her sons, a servant, an elephant, and an ass carrying
    earth and stones.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source; summary only.
- id: ev:9
  type: summary
  locator: lines 16602-16607
  quote_or_summary: The ministers ask the king to stop the ambitious building, but
    he refuses; the stupa name Ja-run Ka-sor is explained from the king's utterances
    Ja-ru and Ka-Sor.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source; summary only.
- id: ev:10
  type: summary
  locator: lines 16608-16615
  quote_or_summary: After four years only the base is complete and the mother dies;
    her sons complete the building; one Magadha measure of Kasyapa's relics is placed
    in the receptacle, and Kasyapa with celestial Buddhas, Bodhisattvas, and retinue
    manifests in the sky above the stupa.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source; summary only.
- id: ev:11
  type: summary
  locator: footnote within lines 16554-16562
  quote_or_summary: A footnote says another nearby stupa is called sTags-mo-lus-sbyin
    and is identified as the site where Buddha in a former birth gave his body to
    a starving tiger, though the orthodox site for the story was northern India.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
  rights_note: Public domain source; summary only.
- id: ev:12
  type: note
  locator: note following legend, within passage end
  quote_or_summary: The author notes that the story, and much of the legend, seems
    to have its origin in a false etymology of proper names.
  source_text_path: texts/public-domain/tibetan/internet-archive/buddhism-of-tibet-lamaism-waddell.md
