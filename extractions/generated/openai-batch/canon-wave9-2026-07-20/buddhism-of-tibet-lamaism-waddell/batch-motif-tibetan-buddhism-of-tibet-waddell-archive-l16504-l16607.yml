candidate_motifs:
- id: motif:1
  label: Boon-granting pilgrimage shrine
  taxonomy_refs:
  - sacred_exchange
  basis: The passage says pilgrims worship, make offerings, and circumambulate the
    stupa, whose special virtue is reputed to grant prayers for wealth, children,
    and other requests.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage states both offerings and boon-granting reputation, but it
    does not explicitly define a formal exchange mechanism.
- id: motif:2
  label: Miraculous birth from compassionate tears
  taxonomy_refs:
  - sacred_birth
  basis: Avalokitesvara's two pitying tears are born in Indra's heaven as god's daughters.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The birth is described in a summarized legend rather than in a full translated
    source text.
- id: motif:3
  label: Heavenly theft punished by earthly rebirth
  taxonomy_refs:
  - sacred_theft
  - death_rebirth
  - divine_judgment
  basis: Kan-ch'un-ma steals flowers in heaven and is reborn on earth as punishment.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The punishing agent is not specified in the passage.
- id: motif:4
  label: Land gained by cutting a hide into thongs
  taxonomy_refs: []
  basis: Samvara asks for only the land one hide can cover, then cuts the hide into
    thin thongs to enclose the large space for the chaitya.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No taxonomy reference in the supplied list directly matches this land-acquisition
    pattern.
- id: motif:5
  label: Etiological naming through royal utterances
  taxonomy_refs: []
  basis: The stupa name Ja-run Ka-sor is explained through the king's utterances Ja-ru
    and Ka-Sor during the land grant and later refusal to stop construction.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The author's note says the story and much of the legend seem to derive
    from false etymology of proper names.
- id: motif:6
  label: Sacred building completed by descendants after founder's death
  taxonomy_refs:
  - death_rebirth
  basis: The mother dies after the base is laid, and her sons continue the construction
    until completion.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The taxonomy reference is only partial; the passage emphasizes continuation
    after death more than rebirth.
- id: motif:7
  label: Relic enshrinement followed by celestial manifestation
  taxonomy_refs: []
  basis: Kasyapa's relics are placed in the stupa, and Kasyapa with celestial Buddhas,
    Bodhisattvas, and retinue manifests in the sky above it.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: No supplied taxonomy reference directly covers relic enshrinement or validating
    apparition.
- id: motif:8
  label: Former-birth body gift to starving animal
  taxonomy_refs:
  - sacrifice
  basis: A footnote reports a nearby stupa identified with the site where Buddha in
    a former birth gave his body to a starving tiger.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: This motif appears in a footnote about another stupa, not in the main
    Maguta stupa legend.
comparison_claims:
- id: claim:1
  claim: 'The passage reports competing site attributions for the same former-birth
    story in which Buddha gives his body to a starving tiger: a nearby Nepalese stupa
    is identified with it, while the note says the orthodox site was northern India.'
  claim_level: same_motif
  target: Buddha's former-birth gift of his body to a starving tiger
  evidence_refs:
  - ev:11
  counter_evidence_refs:
  - ev:11
  confidence: medium
  limitations: The passage only compares site identifications; it does not narrate
    the full story or provide additional textual witnesses.
