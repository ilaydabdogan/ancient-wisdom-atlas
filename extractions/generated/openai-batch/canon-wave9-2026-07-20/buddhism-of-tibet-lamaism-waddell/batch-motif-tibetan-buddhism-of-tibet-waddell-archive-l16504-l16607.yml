canonical_text:
  quote: ''
  summary: The passage describes the Maguta stupa near Kathmandu as a major Lamaist
    pilgrimage shrine in Nepal, then summarizes a booklet legend connecting the stupa
    with Buddhas, Bodhisattvas, Padma-sambhava, Tibetan King Thi-Srom Detsan, Avalokitesvara,
    a heavenly daughter reborn as a poor fowl-keeper mother, her four sons, the construction
    of the stupa, the deposit of Kasyapa's relics, and a celestial manifestation at
    its completion. A footnote also notes a nearby stupa identified with the story
    of Buddha giving his body to a starving tiger in a former birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Maguta stupa of Nepal is described as a celebrated Lamaist pilgrimage
    place outside Tibet, northeast of Kathmandu.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tibetan Lamas and laypeople are said to visit the stupa in large numbers during
    winter, encamp nearby, worship, make offerings, and circumambulate the sacred
    spot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stupa is reputed to grant prayers for worldly wealth, children, and other
    requests.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A booklet sold to pilgrims states that the stupa enshrines the spirit of Buddhas
    of the ten directions and three times, all Bodhisattvas, and the Dharmakaya.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: King Thi-Srom Detsan asks the Guru at Samyas to tell the history of the Mu-qu-ta
    stupa in Nepal.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Guru's story says that Avalokitesvara approached Amitabha, prayed for
    animals in a miry slough, saved them, went to Mount Potala, saw many unsaved animals,
    and wept.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Two pitying tears of Avalokitesvara are said to have been born in Indra's
    heaven as god's daughters named Kan-ma and Kan-ch'un-ma.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kan-ch'un-ma is said to have stolen flowers in heaven and, as punishment,
    been reborn on earth in a low pigherd's family in Maguta under the name Samvara.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Samvara marries, has four sons, is widowed, supports the family by herding
    and rearing geese for the wealthy, gains wealth, and decides to build a large
    stupa in honor of the Tathagatha.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Samvara asks the king for only as much ground as one hide could cover; after
    the king assents, she cuts a hide into thin thongs and encloses a large space
    for the chaitya.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Samvara, her four sons, a servant, an elephant, and an ass bring earth and
    stones and begin building the chaitya by personal labor.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The king's ministers ask the king to stop the ambitious building, but the
    king refuses to interfere.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The legend accounts for the stupa name Ja-run Ka-sor through the king's utterances
    Ja-ru and Ka-Sor.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: After four years, when only the base has been laid, the mother dies; her sons
    continue the building until completion.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: One Magadha measure of relics of the Tathagatha Kasyapa is placed in the receptacle
    of the stupa.
  category: object
  evidence_refs:
  - ev:10
- id: obs:16
  text: At the event, Kasyapa, circles of celestial Buddhas and Bodhisattvas, and
    their retinue are said to manifest in the sky above the stupa.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: A footnote says another nearby stupa is identified as the site where Buddha,
    in a former birth, gave his body to a starving tiger, while adding that the orthodox
    site for the story was northern India.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:18
  text: A note states that this story, and much of the legend, seems to have originated
    in a false etymology of proper names.
  category: other
  evidence_refs:
  - ev:12
