canonical_text:
  quote: ''
  summary: The passage describes an Asam shrine identified by local Lama tradition
    with Buddha's death site; its sculptures, trident-bearing figures, images linked
    to Padma-sambhava and Hayagriva, Sakti-related rites, a sacred tank said to have
    been made by Buddha with his staff, a high priest called Dalai, and comments on
    relic-shrines and stupa worship in Tibet.
  language: English
  quote_policy: summarized
literal_observations:
