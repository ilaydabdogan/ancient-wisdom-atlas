canonical_text:
  quote: 'he is not subject to any further ordeal of examination: this being the final
    one'
  summary: The passage describes Tibetan monastic ordination examinations in which
    a young monk must perform demanding memorized recitations of liturgical books
    involving deities, demons, magic circles, guardians, and offerings. Passing the
    recitations ends the examination ordeals; failure leads to chastisement, possible
    rejection from the order, conditional re-entry for the wealthy, reduced religious
    status for the poor, and reputational consequences for the teacher.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The examination is described as very trying, and the candidate is given a
    companion to prompt and encourage him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first examination lasts three days and allows nine intervals daily.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The intervals are used by candidates to revise the next exercise with their
    teacher.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One required book is described as a banquet to the whole assembly of gods
    and demons, containing chapters on long life, mild and angry deities, a fierce
    form of Padma-sambhava, a lion-faced demoness, Mahakala, and local or mountain
    deities.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The second examination material includes magic circles connected with the
    collected Tathagathas, Avalokita, and fierce or demoniacal deities.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Books for the second examination must be recited by heart and include works
    on Padmasambhava, roots of sagedom, Dorje P’agmo, fierce guardians, subjugation
    of demons, offerings to Dhyani Buddhas, sacrificial ceremonies, a Tashi prayer,
    and eight commanders of the collected Buddhas.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'Four fierce guardians are arranged by cardinal directions: east, south, west,
    and north, each with a named demon or guardian figure.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the young monk recites all the books satisfactorily and passes, he is not
    subjected to further examination ordeal.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Those who fail to pass the examination are taken outside and chastised by
    the provost.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Repeated failure up to three years causes rejection from the order; a wealthy
    rejected boy may be re-admitted by paying larger presents and money, while a poor
    rejected candidate may continue only as a lay-devotee doing monastery drudgery
    or as an unorthodox Lama-priest in a village.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A candidate’s failure attaches stigma to his teacher, while correct and pleasing
    orthodox chanting brings compliments to the teacher.
  category: relationship
  evidence_refs:
  - ev:8
