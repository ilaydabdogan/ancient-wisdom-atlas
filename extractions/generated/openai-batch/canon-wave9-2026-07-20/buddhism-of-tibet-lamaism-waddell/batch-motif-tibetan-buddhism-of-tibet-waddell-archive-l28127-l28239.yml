candidate_motifs:
- id: motif:1
  label: ritual dismemberment of an enemy effigy
  taxonomy_refs:
  - sacrifice
  basis: The figure or linka represents the injuring demon and is stabbed, bound,
    cut apart, dipped in blood, and ritually consumed or distributed.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:12
  confidence: high
  cautions: The available taxonomy term “sacrifice” is broader than the specific effigy-expulsion
    rite described here.
- id: motif:2
  label: demon expulsion through transfer into an image
  taxonomy_refs: []
  basis: The ritual text commands hosts of demons to enter the linka image, which
    represents the injuring demon and becomes the target of binding and destruction.
  evidence_refs:
  - ev:5
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: No exact available taxonomy reference for exorcistic transfer into an
    effigy was supplied.
- id: motif:3
  label: protective power of enemy fragments
  taxonomy_refs: []
  basis: Fragments of the dismembered figure are scrambled for by the crowd; some
    are eaten and others preserved as talismans against wounds, diseases, and misfortunes.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage states the talismanic use but does not explain its doctrinal
    basis.
- id: motif:4
  label: fierce divine suppression of harmful spirits
  taxonomy_refs:
  - divine_judgment
  basis: Fierce beings, a tutelary, and Heruka are invoked to subdue or exterminate
    evil spirits said to injure Buddha’s doctrine.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:10
  - ev:11
  confidence: medium
  cautions: The divine_judgment taxonomy is approximate; the passage frames the action
    as ritual subjugation and protection of doctrine rather than a formal judgment
    scene.
- id: motif:5
  label: cemetery mandala as demon containment space
  taxonomy_refs: []
  basis: The rite constructs a square cemetery mandala as the abode of eight classes
    of demons and places the demon-representing linka within the ritual arrangement.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No precise supplied taxonomy family corresponds to this ritual mandala
    pattern.
- id: motif:6
  label: hidden sealed ritual knowledge in a cave
  taxonomy_refs:
  - forbidden_knowledge
