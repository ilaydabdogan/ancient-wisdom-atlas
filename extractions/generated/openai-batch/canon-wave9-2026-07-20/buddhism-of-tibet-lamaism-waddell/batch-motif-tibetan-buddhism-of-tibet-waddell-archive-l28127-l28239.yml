canonical_text:
  quote: ''
  summary: The passage describes a Tibetan Buddhist ritual drama and rite in which
    a devil-king and demons dismember an enemy figure, scatter and distribute its
    fragments, and then explains the priestly rite of expelling harmful demons through
    a mandala, effigy, invocations, binding implements, blood offerings, and fierce
    deities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A King-devil, surrounded by fiendish hordes, dances and makes a dagger gesture
    called “The Three.”
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The King-devil stabs the heart, arms, and legs of a figure and binds its feet
    with a snare.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The King-devil rings a bell, takes a sword, cuts off limbs, opens the breast,
    and extracts the heart, lungs, and intestines.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Monsters with deer and yak heads rush in, gore the remains, and scatter fragments
    to the four directions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Underling fiends collect the fragments into a large silver basin shaped like
    a skull.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Four underling fiends carry the skull-shaped basin to the Demon-king in a
    procession joined by black-hat devil-dancers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Demon-king eats a morsel of the bleeding fragments, throws fragments into
    the air, and other demons catch and fight for them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Fragments are thrown among the crowd; some people eat them and others keep
    them as talismans against wounds, diseases, and misfortunes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The service is performed by a priest representing Padma-sambhava and is called
    “The Expelling Oblation of the hidden Fierce Ones.”
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The prayer addresses Padma-sambhava as a prior guardian of Buddha’s doctrines
    against harmful spirits and as the source of the hidden rite.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The rite instructs the officiant to arrange a square magic mandala of a cemetery
    as the abode of eight classes of demons.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The ritual setup includes poison, blood, four lotus leaves, a red trident,
    fire-flames, doors, black grains, a three-headed cake, and an umbrella-covered
    structure.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: A linka, described as a wheaten-flour image, is placed inside the ritual house
    and represents the injuring demon.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: The mantra-holder invokes a fierce tutelary being from the burning sky and
    asks it to route the demons.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: A libation of wine is offered after the invocation of the tutelary being.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The rite directs the mantra-holder to imagine a house full of clouds, a tutelary
    presence, fire of anger outside, mist of poison inside, and evil spirits wandering.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: A recitation commands the hosts of demons of the three regions to enter the
    linka image.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: A chant describes piercing demons’ hearts with a hook, binding their hands
    with a snare, binding their bodies with a chain, and keeping them down with a
    bell.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:19
  text: A destruction chant salutes Heruka and calls for evil spirits that injure
    Buddha’s doctrine to be extinguished and have their hearts torn out.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:20
  text: The supposed corpse of the linka is dipped in blood and a chant invites gods
    of the magic-circle to eat the bones, blood, and entrails of injuring evil spirits.
  category: action
  evidence_refs:
  - ev:12
