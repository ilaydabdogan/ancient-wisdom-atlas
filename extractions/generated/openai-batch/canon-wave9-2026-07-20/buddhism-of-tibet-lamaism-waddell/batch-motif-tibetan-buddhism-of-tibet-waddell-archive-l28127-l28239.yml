- id: motif:7
  label: demonic feast on defeated enemy remains
  taxonomy_refs:
  - sacrifice
  basis: The Demon-king eats a morsel of bleeding fragments, demons fight over pieces,
    and gods of the magic-circle are invited to eat bones, blood, and entrails of
    injuring spirits.
  evidence_refs:
  - ev:3
  - ev:12
  confidence: high
  cautions: The eating is described in ritual and dramatic terms; the passage does
    not clarify the material identity of all fragments beyond the linka context.
comparison_claims:
- id: claim:1
  claim: A source note reports that reformed Lamas interpret the animal-headed performers
    as representing the Lama who assassinated Lan-darma and the Demon-king as Mahakala
    delivering Lan-darma into the Lama’s hands.
  claim_level: same_function
  target: Reformed Lama interpretation of the Lan-darma assassination and Mahakala’s
    role
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage presents this as a reported interpretation in a note; it
    does not narrate the full Lan-darma episode or establish that all performers share
    the same understanding.
- id: claim:2
  claim: A source note explicitly compares the ritual threat against the tutelary
    being with the pattern of killing or threatening gods noted in Frazer’s Golden
    Bough.
  claim_level: same_function
  target: Killing or threatening gods pattern in Frazer’s Golden Bough
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: low
  limitations: The note gives only a brief comparison and does not provide details
    from the comparative target; no historical contact or common inheritance is established.
