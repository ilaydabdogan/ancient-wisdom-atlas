canonical_text:
  quote: ''
  summary: The passage gives a ritual list of cosmological and precious objects included
    in a magic-circle or mandala, followed by offering prayers to the Lama, tutelary
    gods, Buddhas, Bodhisats, and other accomplished beings for the benefit and liberation
    of beings. It then describes sacred symbols as talismans, including dharani, bija
    letters, yantra diagrams, edible written charms, and a mirror-washing remedy involving
    reflected writing and beer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists cosmological and precious items, including companion lands
    of the northern continent, jewel mountains, wish-granting trees, wish-granting
    cows, unploughed crops, precious royal objects, goddesses, the sun, the moon,
    a jewelled umbrella, a victory ensign, and gods in the middle.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker offers the constituent parts of the universe to a noble holy Lama,
    tutelary gods of the magic-circle, and hosts of Buddhas and Bodhisats.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The offering is requested to be received for the benefit of animal beings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker offers the four continents and Mount Meru, adorned with the sun
    and moon, on a foundation of incense and flowers, and prays that animal beings
    enjoy happiness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker offers the wealth and body of ideal regions to accomplished supreme
    beings of outside, inside, and hidden regions, asking for real gifts and the gift
    of Dzogs-pa-chhen-po.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker offers a fresh magic-circle and asks that no injury affect the
    path of purity, that the Jinas of the three times grant grace, and that innumerable
    animal beings be delivered from the illusive world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that sacred symbols are commonly used as talismans to ward
    off malignant planets and demons causing disease and disaster, and also to inflict
    harm on an enemy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The talismanic symbols are described as spells and fetishes, often consisting
    of formulas called dharani, extracted from Mahayana and Tantric scriptures, believed
    to hold divine powers and used as incantations.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Shorter single-letter forms are described as bija, representing the essence
    or germ of spells or mantras, and the diagram in which they are arranged is called
    a yantra.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says eating paper on which a charm has been written is an ordinary
    way of curing disease, and identifies spells used by Lamas in this way as edible
    letters.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A remedy for the evil-eye condition called byad-grol involves writing letters
    on wood with Chinese ink, smearing the writing with myrobalams and saffron, reflecting
    it in a mirror every twenty-nine days, washing the mirror with beer during reflection,
    and drinking the collected beer in nine sips.
  category: sequence
  evidence_refs:
  - ev:9
