canonical_text:
  quote: ''
  summary: The passage first summarizes a ritual in which Mugalan rescues his mother
    through offerings. It then presents a Lamaist account identifying the Queen of
    Pretas with Hariti, a child-eating Yakshini whose beloved son Pingala is hidden
    by Buddha in a begging-bowl, leading her to vow to stop eating human children
    and to receive Buddhist refuges and precepts. The passage also comments on food
    offerings to Hariti, possible relation to Sraddha offerings, Japanese versions
    of the legend, and Lamaism's De-lok or ghostly returning.
  language: English
  quote_policy: summarized
