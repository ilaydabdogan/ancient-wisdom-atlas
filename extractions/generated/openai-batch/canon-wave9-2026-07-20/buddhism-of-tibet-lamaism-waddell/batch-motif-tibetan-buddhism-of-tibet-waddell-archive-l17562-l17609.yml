canonical_text:
  quote: ''
  summary: The passage describes ornaments and appearance of fierce deities or fiends,
    including bone ornaments, skins, blood, grease, ashes, skull chaplets, flames,
    and trampled bodies. It then lists three seated postures associated with Buddha
    images, celestial Buddhas, and Bodhisats, relating them to degrees of meditation
    or emergence from meditation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage says all these fiends have six ornaments of human bones: ear
    ornament, necklet, armlet, bracelet, anklet, and a garland of circular bodies
    fixed to bone-heads.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage notes that some of the fiends have snake-bracelets and anklets.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Tibetan style enumerates thirteen ornaments, including elephant hide,
    human corpse skins, tiger skin, Brahma's thread, the six bone ornaments, a blood
    tilak, grease near the mouth, and ashes smeared over the body.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The 'Fiercest' Fiends, named Drag-po and GOn-po, are said to closely resemble
    the previously mentioned Angry Deities.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The 'Fiercest' Fiends usually have chaplets of skulls encircled by tongues
    of flames.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The 'Fiercest' Fiends tread upon writhing victims and prostrate bodies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The listed chief sedent postures are especially characteristic of forms of
    Buddha and secondarily of celestial Buddhas and Bodhisats.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The adamantine or fixed pose is a cross-legged Buddha posture with legs locked
    firmly and soles directed fully upward; with hands lying loosely in the lap it
    is called the Dhyana or meditative mudra.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Bodhisat-pose has looser, unlocked legs and scarcely visible soles, and
    is described as the pose of first emergence from meditation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The sub-active pose has unlocked legs, the left under the right, invisible
    soles, and is described as emerged farther from meditation.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage presents a sequence from deepest meditation to first emergence
    from meditation and then to farther emergence from meditation.
  category: sequence
  evidence_refs:
  - ev:4
