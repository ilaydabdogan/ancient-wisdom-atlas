canonical_text:
  quote: ''
  summary: The passage describes Waddell's account of Tibetan Buddhist incantations,
    mudras, ritual formulae, tantric ritual headings, pardo references, the five celestial
    Buddhas, Sukhavati, and the formula Om mani padme Hum addressed to Padmapani,
    including the belief that its utterance stops rebirth and conveys the reciter
    to paradise.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that, under a doctrine of the unreality of things, a thing's
    name is equivalent to the thing itself, and finger attitudes or mudras are symbolic
    of divine attributes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage gives examples of efficacious utterances: Om as an offering to
    Buddhas, Hari as dispelling sorrow, and Ho as entering samadhi.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Paper horses are mentioned as ideal-nature objects that Lamas bestowed on
    belated and helpless travellers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that postures and repetitive exercises are practiced by unreformed
    and semi-reformed sects, and that corresponding Ge-lug-pa rites are not very different.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The listed ritual items include placing three mystic words as body, speech,
    and thought; a nectar-commanding rosary; a jewelled rosary-guide for ascending;
    secret counsels of the four Yogas; the great root of the heart; a lamp of the
    three dwellings; and a bright loosener of illusion.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The listed ritual items also include a water-drawing dorje, a secret guide
    to the fierce Dakkini, drawing the essence of stony nectar, counsel on Dakkini
    habits, fathoming the mystery of the Dakkinis, and counsel for the Dakkini's heart-root.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ritual list includes four words for the path of Pardo, glossed as limbo,
    and a Pardo of angry demons.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Recognition of the Gyalwa Rig-na, or five celestial Buddhas, is followed by
    reaching 'Happiness,' identified with the sensuous happiness of the Jina's Paradise
    or Sukhavati of Amitabha.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says spells are frequently repeated on rosaries and by mechanical
    means in prayer-wheels and flags.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The formula Om mani padme Hum is glossed as 'Om! The Jewel in the Lotus! Hum!'
    and is addressed to the Bodhisat Padmapani.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Padmapani is described as seated or standing within a lotus-flower, as the
    patron-god of Tibet, and as the controller of metempsychosis.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The mere utterance of the formula is said to be believed to stop the cycle
    of rebirths and convey the reciter directly to paradise.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Mani-kahbum is reported as describing the formula as the essence of happiness,
    prosperity, and knowledge, and as a great means of deliverance; the six syllables
    are said to close rebirth among gods, Titans, humans, beasts, Tantalus beings,
    and inhabitants of hell.
  category: speech
  evidence_refs:
  - ev:10
