canonical_text:
  quote: ''
  summary: The passage describes Tibetan Buddhist rosary counters, their use for registering
    cycles of prayers or formulas, daily repetition practices, accessory objects attached
    to rosaries, and variation in rosary materials by wealth, sect, and deity. It
    also lists several kinds of rosaries by material and ritual association.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rosary counter strings mark cycles of beads and tens of cycles.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The counters and string ornaments are usually made of silver and inlaid with
    turquoise.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two counter strings called count-keepers may be attached at any part of the
    rosary string, but are usually attached at the eighth and twenty-first bead on
    either side of the central bead.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: When counting begins, counters are slid up; after each completed circuit,
    counters are slid down on the dorje-string, and after ten circuits a counter is
    moved on the bell-string.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The counter system is said to register 108 × 10 × 10, or 10,800, prayers or
    mystic formulas.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage gives examples of frequent daily repetition by Lamas, laymen,
    and old women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Heavy handling can wear originally globular rosary beads into cylindrical
    shapes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Small objects such as a metal toothpick, tweezer, and keys may be affixed
    to the rosary.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Rosary materials may vary by the wearer’s wealth but are also constrained
    by sect and by the deity being worshipped.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The listed rosary types include yellow wood, red sandalwood, white conch shell,
    Raksha, unequal layman’s beads, human skull discs, and snake-spine.
  category: object
  evidence_refs:
  - ev:7
