  summary: The passage describes Tibetan sacred sites and shrine practices, including
    a Lhasa image that reportedly responds to a poor widow's tiny butter-lamp offering
    but not to a rich merchant's lavish offerings; daily circumambulation and prostration
    around the great temple; sites associated with Guru Padma-sambhava, including
