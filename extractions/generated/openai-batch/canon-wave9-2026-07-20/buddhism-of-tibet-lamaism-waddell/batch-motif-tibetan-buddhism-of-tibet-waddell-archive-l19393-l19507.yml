canonical_text:
  quote: ''
  summary: The passage classifies Tibetan country-gods, guardians, and related malignant
    beings; describes some as indigenous but partly assimilated to Buddhist/Lamaist
    protector roles; lists colour-coded classes of spirits; and presents mountain
    deities, especially Kanchinjunga, as worshipped mountains, divine habitations,
    and treasure repositories.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies female Yaksha or Yakshini as witch-women and child-stealers,
    and names Hariti as a chief she-devil among the Rakshas.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Country-gods and country-guardians are described as indigenous, though some
    are said to have quasi-Buddhist characters, and they are ranked above more local
    genii or foundation-owners.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The indigenous gods, godlings, and demons are said to be divided after Indian
    fashion into eight rough classes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first three listed classes are male gods that are white and generally
    genial, red male ghosts that are vindictive and haunt temples, and black male
    devils that are highly malignant and require pig sacrifice for appeasement.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other listed classes include piebald planets, dark-purple bloated fiends,
    raw-flesh-coloured cannibal fiends, and king-fiends described as wealth-masters
    and spirits of apotheosized heroes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage also provides a further list of named malignant spirit categories
    with Tibetan equivalents.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mother-she-devils are described as black-coloured disease mistresses and sometimes
    as spouses of the preceding malignant demons.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The greatest country-gods and guardians are said to have been made defenders
    of Lamaism and are chiefly spirits of larger mountains or deified ghosts of heroes
    and ancestors.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mountain spirits are described as being represented either as fierce forms
    of Vaisravana in Tibetan costume, riding lions and carrying victory banners, or
    as fiendesses and mild nymphs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Kanchinjunga is described as formerly an object of worship, as named and worshipped
    by adjoining Tibetans of Tsang, and as physically interpreted through its five
    peaks.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Sikhim saint Lha-tsun Ch'enbo is said to have given Kanchinjunga a mythological
    meaning, making the mountain the habitation of a god and its five repositories
    real storehouses of divine treasure.
  category: action
  evidence_refs:
  - ev:8
