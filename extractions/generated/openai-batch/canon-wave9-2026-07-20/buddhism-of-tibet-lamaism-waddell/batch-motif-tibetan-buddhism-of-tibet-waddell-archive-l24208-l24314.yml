canonical_text:
  quote: ''
  summary: 'The passage describes Tibetan calendrical astrology: weekdays are linked
    with celestial bodies, symbols, elements, and auspicious or inauspicious qualities;
    numbered lunar days are judged good or bad for activities such as travel. It also
    describes Chinese geomantic figures, including Pu-Kwa/Par-k’a and Mewa, used in
    Lama astrological calculations, often represented on a spread tortoise. A quoted
    explanation links tortoise-shell divination, Fii-hsi’s eight trigrams, whole and
    divided lines, and Yang/Yin antinomies as a diagram of natural totality.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage gives a table connecting days of the week with celestial bodies
    and symbols, including sun, crescent moon, red eye, hand, thunderbolt, an unclear
    Venus symbol, and bundle.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sunday and Tuesday are associated with Fire; Monday and Wednesday with Water;
    Thursday with Air; and Friday and Saturday with Earth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each hour and day of the week is described as possessing a lucky or unlucky
    character.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Monday and Thursday are called best; Sunday and Tuesday are called rather
    angry; Saturday and Wednesday are described as good for receiving things and not
    for giving away.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that Saturday is not quite as gloomy and malignant as in
    Western mythology.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Certain numbered days of the month are described as unlucky or conditionally
    good for activities such as starting undertakings, traveling, sickness, and accident.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A finger-counting method is described in which counts falling in the hollow
    between fingers are bad, producing unlucky dates such as the second, eighth, and
    fourteenth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In accounts and similar records, unlucky days may be omitted and dates counted
    by duplicating the preceding day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Chinese geomantic figures, named Pu-Kwa or Per-k’a and Mewa, are said to enter
    largely into the calculations of the Lama astrologer.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Pu-Kwa and Mewa are usually figured on the belly of a spread tortoise.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The spread tortoise’s paws sometimes grasp a pole surmounted by or transfixing
    a frog.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Pu-Kwa or Par-k’a are said to symbolize productive and antagonistic powers
    of nature.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: One Chinese character is explained as a symbol for divining by lines produced
    on the back of a tortoise shell.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Another character is explained as a symbol for divining by means of the eight
    trigrams of Fii-hsi, associated with the Yi-Kin or Book of Changes and its sixty-four
    hexagrams.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Whole lines are called strong and divided lines weak; active matter is called
    Yang, passive matter Yin, and examples of antinomies include heaven and earth,
    sun and moon, light and darkness, male and female, and ruler and minister.
  category: relationship
  evidence_refs:
  - ev:8
