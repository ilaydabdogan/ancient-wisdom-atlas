canonical_text:
  quote: ''
  summary: The passage presents Lamaism as deeply rooted in Sikkim, introduces a chapter
    on sects of Lamaism, describes sectarian division through a lamp-and-prism metaphor,
    and attributes the sectarian reform movement to Atisa. It states that Atisa promoted
    celibacy, morality, and a Mahayana-oriented reform while discouraging diabolic
    arts. It identifies the Kah-dam-pa as the first reformed sect and describes its
    later transformation under Tson K'apa into the Ge-lug-pa, the dominant established
    church of Lamaism.
  language: English
  quote_policy: summarized
