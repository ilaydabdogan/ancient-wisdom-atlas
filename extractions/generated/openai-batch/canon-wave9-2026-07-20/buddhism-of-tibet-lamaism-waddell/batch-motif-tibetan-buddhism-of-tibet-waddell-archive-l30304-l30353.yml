  summary: The passage describes Tibetan lay social politeness, departure and commercial
    blessings, Buddhist-derived personal names, common Buddhist oaths, severe oath
    formulas, a court oath ritual involving scripture and an ox, and comparable oath
    formulas reported for Sikhim.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Observers are cited as remarking on mildness of temper and consideration for
    others among Tibetan laypeople.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A departing visitor or traveller is presented with a stirrup-cup of wine and
    a wish for Godspeed and return.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A seller of non-eatable goods gives the buyer blessings for good fortune,
    long life, health, and wealth; the buyer replies with thanks.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Personal names of boys and girls are said to be largely borrowed from mystical
    Buddhism, with examples including a long-life thunderbolt name and Dolma/Tara.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Common oaths among merchants and laypeople include invocations of the precious
    Lord, identified as Śākya Muni, and the Three Rarest Ones.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Other Tibetan oaths include self-imprecatory formulas such as dying before
    sunset or being separated from one's mother or life.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Monks of De-pung, Serra, and similar institutions are said to swear by their
    own tutelary Tamdin or Vajra-bhairava, including the formula that Tamdin may devour
    the speaker.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A great court oath, said to be rare, involves the oath-taker placing a holy
    scripture on the head, sitting on the reeking hide of an ox, and eating part of
    the ox's heart.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Sikhim, reported oath formulas include wishes to die, go to hell, carry
    another's ill-luck, lose succession, or have a mountain-god or Darjiling Tsux-devil
    taste the speaker's red blood first.
  category: speech
  evidence_refs:
  - ev:7
