  summary: The passage surveys the Nin-ma-pa/Nyingma sect, its guru lineage, red cap,
    subsects, monasteries, and revelations found by named figures in specific places.
    It then describes the Z'i-jed-pa ascetics as homeless yogic mendicants, their
    saintly status, human-bone ritual instruments and preparation requirements, their
    founder P'a-dam-pa Sans-rgyas, and a brief demon-affliction and ritual recovery
    episode involving Sam.
