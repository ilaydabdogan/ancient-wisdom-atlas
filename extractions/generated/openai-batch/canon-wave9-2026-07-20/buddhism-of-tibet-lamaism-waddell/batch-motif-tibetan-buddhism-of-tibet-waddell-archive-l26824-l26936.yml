  quote: ''
  summary: The passage describes offerings and sacrifice made to a god or idols to
    avert bad weather and secure seasonal protection, then gives an approximate list
    of chief Lamaist festivals, including Buddha-related commemorations, expulsion
    rites, water and lantern festivals, and new-year observances. It also explains
    that the Tibetan new year was formerly associated with the winter solstice, stored
    food, snow-bound inactivity, lengthening days, and the return of the sun.
  language: English
