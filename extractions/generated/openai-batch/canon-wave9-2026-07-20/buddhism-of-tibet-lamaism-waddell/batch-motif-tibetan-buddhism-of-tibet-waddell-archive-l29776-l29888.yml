canonical_text:
  quote: ''
  summary: In the Nan-sa narrative, Nan-sa grieves over separation from her parents,
    household jealousy, and her inability to fulfill religious desires. Her lord comforts
    her and tells her to wait until the harvest. A devotee, Dor-grags-Ras-pa, arrives
    with a servant and urges Nan-sa toward religious devotion through images of a
    vanishing rainbow, an ephemeral bird-song, and a wealthy but insubstantial Naga-dragon,
    adding that religion is the only refuge at death. Nan-sa, lacking control of household
    goods because Ani has charge of them, nevertheless gives alms to the devotees
    and asks for blessings. Ani refuses the devotees, abuses Nan-sa, beats her, and
    later reports a false accusation of sexual misconduct to the lord, who goes to
    confront Nan-sa.
  language: English
  quote_policy: summarized
