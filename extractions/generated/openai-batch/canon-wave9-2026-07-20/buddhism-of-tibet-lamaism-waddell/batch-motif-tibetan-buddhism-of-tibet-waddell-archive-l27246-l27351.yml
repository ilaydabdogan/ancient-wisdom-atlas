canonical_text:
  quote: ''
  summary: The passage describes the Feast of Anton, commemorating Tson-Ki-pa’s death
    or transfiguration with illumination, processions, lamps, cakes, and robe offerings.
    It also describes local Tibetan and Mongol festivals and a Lhasa ritual chase
    of a demon or ghost-king figure who receives communal ill-luck, disputes with
    an acting Grand Lama, loses a dice contest, and is expelled toward Chetang.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Feast of Anton is celebrated on the twenty-fifth day of the tenth Tibetan
    month with general illumination of lay and religious buildings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Tson-Ki-pa died or was believed to have been transfigured
    in 1417; the legend has him appear on a stone altar, address the assembled multitude,
    prophesy the future greatness of his church, and ascend to the Tushita heavens.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The anniversary is called Gah-dan Nam-ch'od and is celebrated with joy, torchlight
    processions, altars and stages decorated with lamps and ornamental cakes, and
    an image of Tson-Ki-pa carried with torches and lamps.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bright burning of the torches and lamps during the feast is said to prophesy
    much happiness.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the onset of winter, people visit the Dalai and other high Lamas and present
    bundles of new warm robes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage mentions minor and local festivals, including Mongol Fire festivals
    and the worship of the mountain-god Kan-ch'en-dsi-na in Sikhimite Lamaism.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Lhasa feast called the chase of the demon of ill-luck is held on the twenty-ninth
    and thirtieth days of the second month and begins after divine service.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the demon-chase rite, a priest represents a Grand Lama and one person from
    the multitude is masqueraded as the ghost-king.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: For a week previously the ghost-king sits in the market-place with face painted
    half black and half white, a coat of skin on his arm, and is called King of the
    Years.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ghost-king takes what he wants and shakes a black yak’s tail over people’s
    heads, by which their ill-luck is transferred to him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The ghost-king approaches the priest near the cloister of La-brang, ridicules
    him, and the acting Grand Lama contradicts him; they dispute for some time.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The disputants agree to settle the contest by dice; the acting Grand Lama’s
    die has six on every side, while the ghost-king’s die throws only one.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the dice outcome, the Ldjon or scapegoat flees on a white horse and
    is pursued with screams and blank shots toward the mountains of Chetang.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The expelled figure is provided with a white horse, white dog, white bird,
    salt, and provisions, and remains as an outcast for several months in a narrow
    haunt near Chetang.
  category: sequence
  evidence_refs:
  - ev:10
