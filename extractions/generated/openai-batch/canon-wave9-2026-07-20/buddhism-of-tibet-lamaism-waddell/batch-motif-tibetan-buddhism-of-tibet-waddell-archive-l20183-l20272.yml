canonical_text:
  quote: ''
  summary: The passage describes Tibetan and other non-Indian canonized saints, sectarian
    preferences for particular saintly founders or teachers, and a sequence in which
    the Guru travels through Tibetan places subduing demons and local hostile beings.
    Several adversaries transform into powerful animal or human forms, obstruct the
    Guru with storms, hail, mountains, or armies, and are overcome by ritual gestures,
    a fire wheel, mandala practice, or summoned fierce demons. Defeated beings offer
    their life-essence or wealth and are made subject; some are assigned to guard
    concealed scriptures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tibetan and other non-Indian canonized saints are said to be recognizable
    by non-Indian dress, even when wearing orthodox Buddhist robes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Different sects esteem different Tibetan saints and founders, and reincarnated
    Lamas receive homage as saints after death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Sham-po-lux, Yur-lha-shem-po transforms into a huge white yak with cloud-like
    breath, thunder-like grunting, thunderbolts, and hail.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Guru uses named ritual gestures to catch, bind, fetter, and further affect
    the yak-form demon, after which the demon becomes a young boy in white silk and
    offers his life-essence.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Phya-thon-la pass, a demon transforms into a great white snake whose body
    spans countries and seems like a chain of mountains blocking the Guru.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Guru throws a ritual object over the snake, turns thunderbolts into aquatic
    and reptile creatures, melts the snowy dwelling, and receives the life-essence
    of the transformed god and retinue.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Three Injurers send hurricanes to bar the Guru’s progress, but the Guru circles
    a wheel of fire with his pointing finger, arrests the wind, and melts snowy mountains.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Guru opens a magic circle or mandala of the Five Families for seven days,
    after which commanders of the host of bDud-Deril offer their life-essence.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the cave of Senge-brag-phug, a demon seeking to destroy the Guru appears
    as an old woman with a turquoise cap and places her head on the Guru’s lap.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Many thousands of Mi-ma-yin surround the Guru menacingly, and he causes the
    Five Fierce Demons to appear and subdues them.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Across numerous named places, the Guru subdues many classes of beings, including
    lake beings, planet beings, peak, country, and dwelling-site beings, and others.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: After concealing scriptures as revelations, the Guru causes each subdued fiend
    to guard one scripture, completing the subjection of malignant devils of Tibet.
  category: sequence
  evidence_refs:
  - ev:12
