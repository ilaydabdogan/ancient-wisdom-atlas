  summary: The passage describes a Tibetan temple vestibule with images of threatening
    imps, disease-sowing Tin-ma fiendesses, and four armored celestial kings of the
    quarters who guard the cosmos. It also notes worship of these guardians for good
    luck and protection, vestibule frescoes such as the Wheel of Life and Jataka scenes,
    large prayer-barrels with bells, the main door, and the richly decorated temple
    interior.
