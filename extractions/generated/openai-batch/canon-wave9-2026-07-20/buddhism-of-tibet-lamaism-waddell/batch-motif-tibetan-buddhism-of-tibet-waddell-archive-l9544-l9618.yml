canonical_text:
  quote: ''
  summary: The passage includes brief notes on titles and then reproduces an account
    of a Vajracarya priestly initiation in Nepal. Ritual objects are assembled; the
    aspirant worships sacred images and scriptures, petitions the Guru, accepts precepts,
    undergoes shaving, ablutions, water consecrations by the Guru and Nayakas, receives
    monastic garments and ornaments, renounces householder status, and receives a
    new name. A separate sentence notes that a novice after three years leaves the
    preliminary stage and may have a small cell while still being called a student.
  language: English
  quote_policy: summarized
