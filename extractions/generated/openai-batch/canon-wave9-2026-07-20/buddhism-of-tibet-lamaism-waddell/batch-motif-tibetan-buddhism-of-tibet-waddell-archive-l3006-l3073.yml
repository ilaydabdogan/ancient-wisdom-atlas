canonical_text:
  quote: ''
  summary: 'The passage describes traditions and claims about Tson-K’a-pa: possible
    influence from Roman Catholic or Christian figures, his studies, writings, death
    or popular ascent to Heaven, canonization as an incarnation, elevated temple status,
    image use as a charm, reception of Kah-dam-pa traditions, and organization of
    followers into disciplined monasteries.'
  language: English
  quote_policy: summarized
