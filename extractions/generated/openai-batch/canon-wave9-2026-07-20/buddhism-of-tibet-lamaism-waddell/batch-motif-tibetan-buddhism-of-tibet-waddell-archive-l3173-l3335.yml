  quote: '"the spirit of the dead chief after his death is re-born in a child"'
  summary: The passage describes Ge-lug-pa claims of inspiration through Atisa and
    Maitreya, its reincarnation-based succession and political rise, and the later
    Kar-gyu-pa sect’s founder-lineage, inspired orders, hermit practices, cave meditation,
    and Mahamudra teaching. A footnote recounts a temple-depicted scene involving
    Marpa’s son falling from a cliff after his horse is startled.
