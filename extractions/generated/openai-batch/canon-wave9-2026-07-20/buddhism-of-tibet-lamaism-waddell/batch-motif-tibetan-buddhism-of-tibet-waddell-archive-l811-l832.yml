  quote: ''
  summary: The passage describes Tibetan Buddhism, called Lamaism after its priests,
    as a mainly mystical Vajra-yana form incorporated with Tibetan mythology and spirit-worship.
    It says this form preserves much of Buddha’s philosophy and ethics, and that the
    Lamas possess keys to understanding much of Buddha’s doctrine, which has been
    difficult for Europeans to access. An opening fragment also states that Buddhism
    affected Jainism and Brahmanism.
