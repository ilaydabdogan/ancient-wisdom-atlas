canonical_text:
  quote: ''
  summary: The passage recounts political suspicions and alleged poisonings in the
    succession of recent Lhasa Grand Lamas, describes an audience with the twelfth
    Grand Lama as a child enthroned under peacock-feather attendants, contrasts Tashi-lhunpo
    Grand Lamas with Lhasa Grand Lamas as more learned and less politically contaminated,
    lists Tashi Grand Lamas, gives Bogle's description of the third Tashi Lama on
    a gilt throne in yellow garments, and notes that an official list extends the
    Pan-chen lineage backward to mythical and legendary reincarnations.
  language: English
  quote_policy: summarized
