canonical_text:
  quote: ''
  summary: The passage describes the closing portions of a Tibetan Buddhist monastic
    ritual drama. A chant addresses enemies and demon spirits, a Demon-king performs
    a burnt sacrifice using boiling oil, a skull-vessel mixture, and a paper human
    image, and a three-headed dough image is abandoned, torn apart, and kept in fragments
    as charms. The passage also describes concluding masked dances, a ridiculed appearance
    of the Chinese priest Hwashang, and calendrical state-supported performances involving
    guardian-deity worship, officials, the Dalai Lama, ritual music, and final burning
    of a cake surmounted by a human head.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chant says black grains and a three-headed cake are set on the Buddha's
    plate, while weapons, poisonous vapour, plague-smell, and mantras of the Fierce
    Ones are mentioned.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chant says the three-headed cake can cure disasters and repress injuring
    demon spirits, and it commands angry enemies, injuring demon spirits, and voracious
    demons to be turned to ashes and upset.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Demon-king performs a burnt sacrifice by pouring oil into a cauldron over
    a lit fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Demon-king places into the boiling oil a skull filled with arak, poison,
    and blood, and then inserts a paper image of a man; when the image flames, he
    declares the injuries consumed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A procession carries or accompanies a large three-headed dough image with
    threads and streamers, preceded by many maskers with cymbals and thigh-bone trumpets
    and followed by laity with guns and other weapons.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the dough image is abandoned, the crowd tears it apart, fights for its
    fragments, and keeps the fragments as charms; a gun is fired and the Lamas return
    to the temple.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Black-cap devil-dancers reappear with drums, and the performance concludes
    with Hwashang, a Chinese priest represented by a grinning large-mouthed mask and
    attended by two boys.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hwashang and the two boys perform a form of worship of the images, but the
    passage says the worship is unorthodox and ridiculed by spectators.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says this mystic play is performed at established-church monasteries
    at government expense, with major performances at Potala, Muru Tasang, Tashi-lhunpo,
    and Teng-gye-ling.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Potala, dough images and cakes are prepared in the twelfth month, and the
    convent worships the country's terrible guardian-demons and Ye-she-Gon-po or Mahakala.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Before the Potala performance, conch-shell trumpet blasts summon the populace,
