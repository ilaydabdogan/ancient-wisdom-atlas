  quote: "“Then the torrent divided, leaving a lane of dry land”"
  summary: Prince Visvantara gives away a splendid chariot and then, while travelling
    with his family into the forest, gives away their clothes to five Brahmans. The
    family dresses in leaves, walks a long distance, and is stopped by a river. After
    Visvantara prays, the river divides so they can cross on dry land. He then asks
    it to resume its flow so downstream animals will not suffer, and the river does
    so. They continue to the forest of penance.
