canonical_text:
  quote: ''
  summary: The passage surveys textual sources for the Lamaist pantheon, gives a seven-part
    ranked classification of divinities, and describes the prevalence, making, consecration,
    perceived efficacy, miraculous origin, forms, and materials of Tibetan Buddhist
    images.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Taranatha’s work is described as containing residual deities omitted by earlier
    writers and as chiefly devoted to more demoniacal forms.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Dalai Lama Nag-wan Lé-zai Gya-ts’6’s autobiography is said to describe
    aboriginal Tibetan deities grafted upon orthodox Lamaism.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The divinities are arranged into seven ranked classes: Buddhas; Bodhisats;
    tutelaries; Defenders of the Faith and Witches; Indian Brahmanical gods, godlings,
    and genii; country, guardian, and local gods; and personal gods or familiars.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says tutelaries overlap adjacent classes, some guardians outrank
    Indian gods, the first four classes are mostly immortal except human members,
    and the remaining classes remain within rebirth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Images are described as abundant in Tibet and present in temples, lay houses,
    the open air, amulet-boxes, screens, book title-pages, and charms.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Artists are said to be mostly Lamas, with some Newari artisans and lay-artists;
    images made by lay-artists require Lama consecration to be efficacious for worship.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Most images are credited with being materially holy, fetish-like, and capable
    of hearing and answering prayers.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Scriptures are said to define materials, auspicious times for beginning images,
    and the formation of essential parts such as the eyes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Many celebrated idols are believed by people and credulous Lamas to be miraculous
    in origin, either self-formed or fallen from heaven ready fashioned.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Images are executed as statues, bas-reliefs, medallions, and pictures; some
    Maitreya statues are colossal or rock-cut, though most statues are less than life-size.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Common plastic images are gilt or coloured and may be made from coarse papier-mâché,
    clay, bread-dough, compressed incense, tinted butter, and sometimes a wooden framework.
  category: object
  evidence_refs:
  - ev:9
