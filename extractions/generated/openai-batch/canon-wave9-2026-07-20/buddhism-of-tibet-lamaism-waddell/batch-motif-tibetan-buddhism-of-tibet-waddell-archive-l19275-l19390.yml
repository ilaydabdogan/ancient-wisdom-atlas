canonical_text:
  quote: ''
  summary: The passage classifies several godlings and angels, describes the thirty-three
    Vedic gods as lotus-throned figures and protectors of directions, notes Indra
    and Brahma attending Buddha, and gives iconographic and functional descriptions
    of Yama, Jambhala/Kuvera, and the Nagas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists classes of beings including Yaksha/genii, Gandharva/angels,
    Asura/titans, Garuda/phoenix, Kinnara/celestial musicians, and Mahoraga/great
    reptiles.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods are described as the thirty-three Vedic gods, usually figured like
    earthly kings of the mild deity type on lotus-thrones.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chief gods are assigned as regents or protectors of directions, including
    Indra in the east, Yama in the south, Varuna in the west, Kuvera in the north,
    and other deities for the remaining directions, nadir, and zenith.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Indra and Brahma are represented as attendants on Buddha at critical periods
    of his earthly life; Indra carries an umbrella and Brahma carries a vase of life-giving
    ambrosia.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yama is described as the judge of the dead and controller of metempsychosis,
    represented in the Wheel of Life as central in hell, and associated with a bull
    emblem.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Vajra-bhairava is described as having vanquished Yama and being represented
    with a bull head under the title Yamantaka, the conqueror of Yama.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Jambhala is described as a favorite godling and god of wealth, a form of Kuvera
    or Vaisravana, holding a bag of jewels, money, or grain and a mongoose.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The mongoose held by Jambhala is described as the conqueror of snakes, which
    are identified as mythical guardians of treasure.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nagas or Dragon-demigods are described as mermen and mermaids of Hindi myth
    and demons of drought, with celestial, aerial, earthly, and hidden-treasure-guarding
    kinds.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Nagas are usually given snake form because snakes inhabit the bowels of the
    earth, and they are figured as dragons in their rain-producing character.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Nagas are associated with treasure, precious stones and metals, rain production,
    the wealth deity Vaisravana/Jambhala, and a community divided by status and Buddhist
    affiliation.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
