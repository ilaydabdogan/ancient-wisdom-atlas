comparison_claims:
- id: claim:1
  claim: The passage presents these Tibetan/Lamaist godlings as the thirty-three Vedic
    gods and assigns them directional protector functions comparable to Vedic/Hindu
    directional deities.
  claim_level: same_function
  target: Vedic/Hindu directional deity pattern
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The claim follows the passage's own identification and Waddell's terminology;
    it does not independently establish historical development.
- id: claim:2
  claim: Yama is framed as a Pluto-like underworld figure because the passage calls
    him the Hindi Pluto and describes him as judge of the dead and controller of metempsychosis.
  claim_level: same_function
  target: Pluto-like underworld/dead-judge figure
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is based on the author's label and functional analogy,
    not on a detailed Greco-Roman comparison in the passage.
- id: claim:3
  claim: Jambhala is compared in the passage with Ganesa and with Mahakala/Dai Koko
    through portly form, prototype language, and prosperity iconography.
  claim_level: visual_similarity
  target: Ganesa and Japanese Dai Koko/Mahakala prosperity imagery
  evidence_refs:
  - ev:6
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is explicitly made by the author, but the passage is
    brief and includes 19th-century comparative assumptions.
- id: claim:4
  claim: Nagas are explicitly equated with the mermen and mermaids of Hindi myth while
    also functioning as drought, rain, river, and treasure beings.
  claim_level: same_function
  target: Hindi myth mermen/mermaids and Naga/dragon-demigods
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage's equivalence is descriptive and does not provide a full
    narrative comparison.
