canonical_text:
  quote: ''
  summary: The passage lists Tibetan monasteries and sacred sites, especially Sa-kya,
    Phuntsholing/Jonang, and Samding. It describes Sa-kya as a monastery whose future
    fame was foretold after Atisa saw a self-sprung Om on a rock, notes its library,
    incarnate lama, and four colored pillars. It describes Phuntsholing and Jonang,
    including a reported likeness to Budh Gaya. It then describes Samding as a monastery
    of monks and nuns governed by a female abbot identified with Dorje-P'ag-mo/Vajravarahi,
    its rules and founding, and its location by Yamdok lake, a sacred island, mountains,
    and the Dumo Tso lake where bodies of deceased monks and nuns are cast for fish.
  language: English
  quote_policy: summarized
