canonical_text:
  quote: Existence in any form involves Suffering or Sorrow.
  summary: The passage says that Lamaism preserves the simple creed and conduct associated
    with Buddha’s teaching, though obscured by later mystic and polydemonist accretions.
    It states that Lamas and most laity know the doctrinal elements taught by Sakya
    Muni and value them highly. It presents human misery as the starting point of
    Dharma, summarizes the Four Noble Truths, and gives the first as the claim that
    all forms of existence involve suffering or sorrow. A footnote glosses Dharma
    as truth or righteousness and another explains a term for misery through the image
    of drops or oozing from the six sense regions.
  language: English
  quote_policy: quoted
