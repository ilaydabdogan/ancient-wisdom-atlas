canonical_text:
  quote: ''
  summary: The passage describes a Tibetan Buddhist life-attainment rite. A protected
    ritual space and mandala are invoked; Padma-sembhava, Amitayus, Buddhas, Bodhisatvas,
    and other divine hosts are praised and asked for undying life and protection from
    harmful spirits. The fluid in a vase is treated as consecrated immortal ambrosia.
    A Lama distributes consecrated water and food, touches worshippers' heads with
    a vase and divining-dagger, gives wine from a skull-bowl and holy pills, receives
    offerings, and bestows benedictions and scarves. The passage also briefly lists
    related rites for saving from death, ransoming life, substitution by effigy, sacrifice
    for sin, and libations to demons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ritual setting is described as a protected tent or building with earth-foundation,
    adamantine seat, thunderbolt walls, and charms that keep evil spirits from destroying
    it or entering.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A magic-circle or mandala is offered, and the officiant praises Lama-saints
    and Padma-sembhava in order to secure blessing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The recitation says Padma-sembhava hid a revelation about the attainments
    of life in snowy regions; it was later discovered in a cave and transmitted through
    generations of saints.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Amitayus, deities in several directions, Buddhas, and Bodhisatvas are invoked
    to grant undying life and lessen injuries caused by harmful spirits.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fluid in the vase is supposed to have been consecrated by celestial beings
    and transformed into immortal ambrosia; the priest chants this to cymbal music.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The priest acts as the incarnate Amitayus and as other gods of longevity by
    laying on hands and distributing consecrated water and food to the assembled multitude.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'Each worshipper uses drops of holy fluid in a set order: rinsing the mouth,
    anointing the crown of the head, and swallowing the third portion.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Lama places the vase of Life on bowed heads, has the spell of Amitayus
    repeated, and touches heads with the power-conferring vase and with a divining-dagger.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Each worshipper receives and swallows sacred wine from a skull-bowl and three
    holy pills consecrated by the Lama's touch.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Votaries offer scarves, money, or grain to the seated Lama and receive a benediction,
    a head-touching, and a consecrated scarf.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Other life-prolonging or death-averting rites are listed, including saving
    from death, ransoming life, substitution-offering of a patient-effigy to devils,
    sacrifice for sin, and wine libation to demons.
  category: sequence
  evidence_refs:
  - ev:10
