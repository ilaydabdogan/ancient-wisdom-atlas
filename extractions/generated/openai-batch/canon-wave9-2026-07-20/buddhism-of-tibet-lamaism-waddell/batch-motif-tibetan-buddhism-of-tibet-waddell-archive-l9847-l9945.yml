canonical_text:
  quote: After a course of such training for twelve years, each student is eligible
    for full ordination
  summary: The passage describes Tibetan Buddhist monastic ordination and degrees
    through long training, graded public disputations, examinations before abbots
    and learned monks, presentation and reception of scarves and gifts, and the privileges
    attached to the Ge-s’e and Rab-jam-pa degrees.
  language: English
  quote_policy: quoted
