canonical_text:
  quote: ''
  summary: 'The passage combines a Kar-gyu-pa sub-sect affiliation chart naming Marpa
    as founder and pupil of Naropa with a narrative about Mila-ra-pa: tasks involving
    forts, withheld instruction, flight with Naropa’s relics, instruction from Lama
    rNog-pa, later initiation and naming by Marpa, Marpa’s journey to India to meet
    Naropa, and Mila’s subsequent cave dwelling, flight from hostile relatives, and
    long meditation retreat.'
