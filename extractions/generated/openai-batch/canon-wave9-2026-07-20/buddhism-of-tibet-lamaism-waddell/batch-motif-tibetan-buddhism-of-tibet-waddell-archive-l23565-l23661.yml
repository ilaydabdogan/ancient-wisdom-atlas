canonical_text:
  quote: ''
  summary: The passage closes a benediction by dismissing invited beings, then describes
    the twice-monthly public Confession of Sins, including its chanted formula of
    repentance before Lamas, Buddhas, and Bodhisattvas. It also notes magic-circle
    rites for supernatural aims and introduces a Lamaist long-life liturgy compared
    by some Europeans to the Christian Eucharist because of consecrated wine and bread,
    while the author qualifies that comparison.
