canonical_text:
  quote: ''
  summary: The passage describes a Tibetan house-god, called an inside god and classed
    among earth-masters, whose seasonal positions within a house create taboos on
    objects, sweeping, repairs, corpses, marriages, and threshold passage. It also
    describes appeasement procedures involving images, offerings, scripture-reading,
    and a named water sacrifice, then briefly introduces personal gods or familiars
    and compares them to Greek daimon or familiar spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The house-god is described as anthropomorphic, with a pig-like head and flowing
    robes, and is called an inside god and a genius loci of the earth-master class.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The house-god is said to move among different parts of the house at different
    seasons.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: Householders must not let objects occupy the god's current place, and must
    not sweep or otherwise disturb it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A visitor who sets a hat on a vacant place may have it quickly removed by
    the host because the god is occupying that spot.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The seasonal itinerary places the god in the house center, doorway, under
    the eaves, the south-west corner, the fire-tripod or grate, and the kitchen hearth
    in different months.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the god's movements relate to season, being outside in hottest
    weather and at the fire in coldest weather.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the god is in the middle of the house, the fire-grate must be moved to
    a corner and no dead body may be placed there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the god is at the door, a bride, bridegroom, or corpse may not pass unless
    an alternative route or a special procedure is used.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The special doorway procedure uses wheaten-flour images of a horse and yak,
    with skin and hair from the represented animals, and offerings of tea and beer
    to the god.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the offerings at the doorway, the door is unhinged and carried outside
    while the bride, bridegroom, or corpse passes, and then the door is restored.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the god is at the kitchen fire, hearth removal or repair, corpse placement,
    and marriage are forbidden; visitors must be screened from the fireplace and a
    scripture read to avert the god's wrath.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the god is in the verandah, the outside of the house may not be whitewashed
    or repaired.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Lamas may be called yearly or when offense is suspected to propitiate the
    god by performing a rite called the water sacrifice for the eight injurers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage introduces personal gods or familiars, says they are comparable
    to Greek daimon or familiar spirits, and says each individual's body is beset
    by personal sprites.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: Each Tibetan is said to carry two Buddhist angels, one good and one bad, on
    the right and left shoulders, prompting good deeds or sins.
  category: relationship
  evidence_refs:
  - ev:11
