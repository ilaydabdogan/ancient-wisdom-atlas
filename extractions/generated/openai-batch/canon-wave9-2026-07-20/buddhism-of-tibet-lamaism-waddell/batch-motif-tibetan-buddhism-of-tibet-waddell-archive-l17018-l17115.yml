canonical_text:
  quote: ''
  summary: 'The passage surveys Buddhist and Lamaist divine worlds: early Buddhism
    is described as acknowledging Hindu gods, demons, Yakshas, and Tushita heaven;
    later Buddhism and Mahayana are described as deifying Buddha, forming Buddhas
    and Bodhisats in images, incorporating Sivaist and local deities or demons, and
    producing an unusually large Lamaist pantheon that Tibetan treatises attempted
    to catalogue.'
  language: English
