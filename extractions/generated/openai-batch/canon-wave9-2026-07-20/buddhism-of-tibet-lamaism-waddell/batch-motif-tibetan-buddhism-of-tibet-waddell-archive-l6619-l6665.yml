canonical_text:
  quote: ''
  summary: The passage describes doctrinal relationships among Adi-Buddha, Samantabhadra,
    Vairocana, Sakya Muni, Amitabha, Avalokitesvara, and the Grand Lama. It then presents
    Kala-cakra as a Tantric development involving the union of Kali with Buddhas,
    the generation of procreative energy by Adi-Buddha, the emergence of fierce female
    beings and demoniacal Buddhas, and ritual means of conciliating them. It closes
    by noting the acceptance of these Tantric figures by Lamas, the use of reincarnate
    Lamas for hierarchical stability, and the continued higher philosophy of superior
    Lamas.
  language: English
  quote_policy: summarized
