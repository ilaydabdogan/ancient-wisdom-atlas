  summary: The passage describes seventh-century Indian Buddhist images, deities,
    demons, female energies, ritual, and litanies; states that this form entered Tibet
    about 640 A.D.; presents Mantrayana as a spell-oriented vehicle connected with
    imagic circles and an alleged transmission from Vairocana through Vajrasattva
    to Nagarjuna at an iron tower; and says that Kalacakra/Vajrayana later developed
    with demoniacal Buddhas, Mantrayana practices, and thunderbolt-named followers.
