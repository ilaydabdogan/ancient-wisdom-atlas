- id: motif:2
  label: ritual mandala causing divine or visionary transformation
  taxonomy_refs:
  - shapeshifter
  basis: After the Guru makes a mandala and worships for seven days, the Five transform
    into Garuda birds, and the Guru disappears while a great Garuda appears in his
    place.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage presents the event as a reported tradition; it does not provide
    a doctrinal explanation of the transformation.
- id: motif:3
  label: Garuda subduing serpent
  taxonomy_refs:
