canonical_text:
  quote: ''
  summary: The passage describes Sam-yas monastery, its cardinally ordered enclosure,
    votive chaityas, images, Wheel of Life, manuscript losses by fire, a nearby chamber
    of fierce Gon-po demon images, and traditions about Padma-sambhava using mandalas
    and spells to subdue or compel beings, including Garudas and Nagas, to assist
    in building and enriching Sam-yas. It also describes Galdan monastery, its founder
    Tson-K'a-pa, his tomb, images of Cham-pa and S'inje, relic-like impressions, and
    manuscripts.
  language: English
  quote_policy: summarized
