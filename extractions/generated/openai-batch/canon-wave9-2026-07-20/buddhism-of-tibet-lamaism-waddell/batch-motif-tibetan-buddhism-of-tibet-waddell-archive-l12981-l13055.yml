canonical_text:
  quote: ''
  summary: The passage reports official inquiries into children considered as possible
    embodiments of the Dalai Lama. One child’s birth is accompanied by reported luminous,
    watery, fiery, auditory, and milk-related signs, as well as a rock image and inscriptions.
    Commissioners observe the child’s posture, apparent recognition, use of a rosary,
    speech, and features. A later memorial describes four children brought to a monastery
    and tested by recognizing objects used by the late Dalai Lama among imitations
    before an assembled audience.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A-chu-cho-ma, wife of Kung-pu-tan-tséng, gave birth to a son on the 13th day
    of the 11th month of Ai-hai, and local headmen’s report led the chancellor to
    send persons to inquire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The report says that on the night before the birth, many-coloured radiance
    appeared in the air and spring-water in the temple courtyard well changed to a
    milk-white colour.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Seven days later a flame-like light appeared on a rock behind the post-station;
    when people came, no trace of fire remained, but an image of Kwan Yin, Amitabha
    characters, and footprints were visible on the rock.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the night of the birth, music was heard and milk dropped upon the house
    pillars.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Commissioners found the child sitting cross-legged in a dignified attitude,
    apparently recognizing them and showing no timidity.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: When a rosary was put in the child’s hands, he appeared as though reciting
    from the Sutra of Amita Buddha and addressed his mother with the word A-mdé.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The report describes the child’s features as comely and well formed, with
    a bright and intellectual expression above that of ordinary children.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Certificates from local headmen and members of the priesthood and laity attesting
    personal knowledge of the reported facts were appended and transmitted after authentication.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A later memorial reports that the embodiment of the Dalai Lama had appeared,
    a day had been fixed for drawing lots, and four children had arrived and been
    lodged at the Sangha monastery at Té K’ing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Officials and religious authorities proceeded to the monastery to put the
    children to proof; the children were reported as three or four years old, symmetrical
    and proper in appearance, and elevated in demeanor.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Panshen Erdeni and associates set before the children objects used by
    the late Dalai Lama, along with imitations, and the children recognized the individual
    genuine articles before assembled clergy and people.
  category: action
  evidence_refs:
  - ev:6
