canonical_text:
  quote: ''
  summary: 'The passage describes spaces and institutions associated with Tashi-lhunpo
    and other Tibetan monasteries: monastic seating, courts for dances, tombs of Pan-ch’en
    Lamas, tantric colleges, abbots involved in discovering an infant successor, festival
    display of giant deity pictures, lama residences, and a monastery facade marked
    with Om/Han(? Ah)/Hoong emblems.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Seating near the entrance is divided by rank: senior monks occupy seats on
    the right side and junior or apprentice monks occupy seats on the left side.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The surrounding court is used by monks for religious dances and other outdoor
    ceremonies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A line of tombs for deceased Pan-ch’en Lamas stands north of the college buildings;
    each body is embalmed and placed in a gold-plated pyramid on a tall marble table
    within a decorated stone mausoleum.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: One tomb is larger than the others and is identified as that of Pan-ch’en
    Erteni, who died in 1779.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Four conventual colleges attached to Tashi-lhunpo receive students from across
    Tibet and instruct them in Tantrik ritual and scriptures.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each college has an abbot described as the tul-wa, or avatar, of a bygone
    saint; the four abbots help discover the infant successor to a deceased Pan-ch’en,
    and one may be selected as prime minister or chief ecclesiastical adviser.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Nag-pa Ta-ts’an, called the Nagk’an, is described as the chief college
    for mystic ritual in Tibet.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A nine-storey building called Gé-Ku-pea, or “The Stored Silken Pictures,”
    is used at certain festivals to display gigantic pictures of Maitreya and other
    Buddhist deities hung high outside its walls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The same tall building is also used to store dried carcasses of sheep, goats,
    and yak for feeding the monastery’s inmates.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The head of the monastic establishment resides in the Lama’s palace, while
    the Dalai Lama is said to hold court on the red hill of Potala and take part in
    service as a common monk.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Desuerip-Gay is described as a monastery in a narrow valley at the foot of
    a rocky hill, with copper-gilt roof ornaments and three round brass plates on
    the facade interpreted as emblems of Om, Han (? Ah), and Hoong.
  category: setting
  evidence_refs:
  - ev:7
