canonical_text:
  quote: ARRANGEMENT OF THE BANQUET TO THE WHOLE ASSEMBLY OF THE GODS AND DEMONS.
  summary: The passage describes a Tibetan Buddhist ritual banquet or sacrifice for
    a host of deities and demons, including rows of offering cakes, skull-cup offerings
    of wine and blood or tea, named divine and demonic recipients, and occasions for
    the rite such as regular temple performance, thanksgiving, and propitiation in
    sickness, death, and disaster.
  language: English
  quote_policy: quoted
