canonical_text:
  quote: The whole erection is now fixed to the outside of the house above the door
  summary: The passage describes Tibetan earth-spirits and a ritual called closing
    or barring the door of the earth. A ram skull and other offerings are prepared,
    marked with geomantic and celestial signs, mounted above a house door with substitute
    images, and ritually offered to Old Mother Khén-na/Khin-ma so that earth spirits
    will not harm the household.
  language: English
  quote_policy: quoted
