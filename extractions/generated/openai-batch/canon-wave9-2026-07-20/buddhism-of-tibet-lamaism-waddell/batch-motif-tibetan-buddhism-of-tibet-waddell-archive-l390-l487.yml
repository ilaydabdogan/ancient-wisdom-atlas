  summary: The passage surveys the spread of Buddhism beyond India, its arrival in
    Tibet around 640 CE, and doctrinal changes in India that led to the Mahayana/Hinayana
    distinction. It describes Buddha's later supernaturalization, councils addressing
    schisms, the Jalandhar council under Kanishka, the rough Northern/Southern school
    distinction, the Mahayana 'Great Vehicle' metaphor of conveyance across samsara
    to Nirvana, and possible figures or communities involved in Mahayana development.
