canonical_text:
  quote: ''
  summary: 'The passage describes a morning routine at Pemiongchi monastery in an
    unreformed or Ninma context: offerings are made, a conch summons monks to assembly,
    discipline is enforced, novices serve tea and soup, a chant over the soup is performed,
    the hall is swept, and the precentor inspects a magic circle before commencing
    a celebration. A footnote states that lay servants leave monks’ food outside the
    temple rather than serving it inside.'
  language: English
  quote_policy: summarized
