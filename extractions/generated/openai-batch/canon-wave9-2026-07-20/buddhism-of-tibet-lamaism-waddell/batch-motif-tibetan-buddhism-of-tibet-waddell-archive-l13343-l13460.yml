  text: The assembly room and temple door is normally built to face east; southeast
    and then south are presented as next-best orientations.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A site is considered bad if a stream directly drains it or is visible below,
    because the place’s virtue is said to escape by the stream; in that case the main
    entrance is made in another direction.
  category: relationship
  evidence_refs:
  - ev:2
