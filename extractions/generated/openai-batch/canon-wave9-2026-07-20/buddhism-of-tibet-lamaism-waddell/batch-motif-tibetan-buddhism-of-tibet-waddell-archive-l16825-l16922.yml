canonical_text:
  quote: ''
  summary: The passage describes pilgrims circumambulating a colossal image of Jam-pa
    on multiple floors, then turns to pilgrimage receptions by high Lamaist figures
    at Lhasa and elsewhere. It reports offerings, rank-graded touch blessings by hand
    or tassel, tokens of knotted silk, devotion of children to monastic life through
    hair cutting, kissing the cushions on which the Lama sat, and ordinary audience
    procedures before the Dalai Lama involving silent petitions, intuitive comprehension,
    and brief rank-mediated access.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A colossal image of Jam-pa extends through the second and third floors, has
    a jewelled and capped head, and is said to stand with its platform seventy or
    eighty feet high.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Because circumambulation around an image is described as essential in Tibetan
    worship, pilgrims circling the Jam-pa image perform three series of circuits on
    different floors: around the legs, chest, and head.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage identifies the greatest pilgrimage for a Lamaist devotee as the
    journey to the Grand Dalai Lama at Lhasa, described as a Buddhist-god incarnate.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Bogle's account, a large crowd comes to pay respects and receive blessing
    from the Grand Tashi Lama, who is seated under a canopy in a palace court.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lay people bring offerings according to their circumstances, including a horse,
    a cow, dried sheep carcasses, sacks of flour, cloth, and white handkerchiefs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Lama's servants receive offerings and place a knotted bit of silk, said
    or supposed to be tied by the Lama's own hands, around the votaries' necks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Grand Tashi Lama sits cross-legged on a throne of seven cushions and touches
    votaries' heads with his hand or with a tassel depending on their rank and status.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Children carried on backs are especially brought forward so their heads may
    also be touched by the tassel.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Some boys and girls are devoted to the monastic order by having a lock of
    hair on the crown cropped by the Lama with a knife said to have come from heaven
    in a flash of lightning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the Lama retires, many people remain to kiss the cushions on which he
    had sat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the ordinary reception described by A. K., the Dalai Lama sits cross-legged
    on a platform about six feet high, wears red and yellow priestly colors with bare
    arms, and holds a rod with a multicolored silk tassel.
  category: setting
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: A pilgrim enters with folded hands, rests his head against the edge of the
    platform, silently repeats petitions, and is believed to have those unuttered
    prayers intuitively comprehended by the Dalai Lama.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Dalai Lama touches the pilgrim's head with the bunch of silk as a blessing,
    after which attendants hurry the worshipper out.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Persons of rank or substance may mount the platform, receive blessing by the
    Dalai Lama's hand, sit below the platform, receive brief hoarse enquiries, and
    be given food.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage says the Dalai Lama's deep hoarse voice is acquired by training
    to convey maturity and wisdom, and that ordinary worshippers rarely receive spoken
    words from him.
  category: speech
  evidence_refs:
  - ev:6
  - ev:8
