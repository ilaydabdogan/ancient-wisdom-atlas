  summary: The passage describes paired opposites, a Lamaist circular diagram linked
    with ceaseless change, and a longevity trigram or hexagram related to the Chinese
    Tho symbol. It then lists Chinese symbolic animals incorporated by Lamas and explains
    the tortoise as a universe-symbol, the dragon as assimilated with Indian Nagas,
    the horse-dragon as appearing on Tibetan prayer-flags, and the phoenix or Garuda
    as a sky-soarer and enemy of dragons.
