  summary: Lha-tsiin spends much of his later life in Sikhim exploring caves and mountain
    recesses, composing local legends, and establishing sites for temples and monasteries.
    He builds a hut at Dub-de, later a monastery, and is credited by some with building
    shrines at several named places, though Tashiding has an alternative attribution.
    The passage then begins an incomplete iconographic description of Lha-tsiin seated
    on a truncated 'leo-' form.
