  summary: The passage explains karma as the results of deeds from previous existences,
    producing rewards and punishments across rebirths. It says Buddha explained events
    of his life through prior states of existence, giving rise to Jataka tales. It
    then describes the Wheel of Life as a pictorial representation of rebirth regions,
    listing gods, titans, humans, beasts, tantalized ghosts, and hell in a hierarchy
    from superior to inferior worlds.
