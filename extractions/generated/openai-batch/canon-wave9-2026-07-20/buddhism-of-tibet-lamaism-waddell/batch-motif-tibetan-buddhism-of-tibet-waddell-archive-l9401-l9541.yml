canonical_text:
  quote: ''
  summary: 'The passage describes the admission and formal initiation of a boy into
    noviciateship at Depung monastery: preliminary memorization, applications and
    registrations before monastic officials, eligibility questioning, offerings and
    fees, exchange of lay finery for monastic robes, tonsure, naming, vows of refuge,
    and later instruction by a monk called the “bride-companion.” A footnote reports
    an eastern Tibetan initiation ordeal involving seared crown marks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After two or three years of rudimentary training and memorization of necessary
    texts, the tutor applies for the boy’s admission as a novice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tutor-Lama asks the head monk for permission, offers a ceremonial scarf
    and ten rupees, and a written agreement is made if the applicant is eligible.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pupil and tutor seek registration with the school abbot through a butler
    or cup-bearer, offering a scarf and silver coin, bowing three times, and praying
    for admission.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Admission questions concern free will, slave/debtor/soldier status, opposition
    to entry, bodily defects or illness, offences, family, occupation, and residence.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: If approved, the applicant recites memorized texts, names are recorded and
    thumb-sealed, scarves are placed around necks, and princely clothing is exchanged
    for yellow or red robes; if rejected, he is ejected and the tutor is punished
    and fined.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The approved pupil and tutor register with the head Lama of the great cathedral,
    again offering a scarf and rupee, so that misconduct in the cathedral can be fined.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The registered student returns to his residentiary club, may provide tea,
    may receive provisions, has allowance divided, and receives monastic robes and
    utensils including a cup, flour bag, and rosary.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Before the formal initiation called “going forth from home,” the candidate
    is not allowed to join the monastery’s religious services and requests noviciate
    from the presiding Grand Lama with a scarf and money.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: On an appointed fast day the candidate’s head is shaven except for a small
    crown tuft, and his spiritual tutor conducts him to a chapter in the assembly
    hall while he wears mendicant robes.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: The officiating head Lama asks whether the candidate accepts tonsure cheerfully,
    cuts off the remaining hair tuft, gives him a religious name, exhorts him about
    precepts and rules, and administers vows repeated with the refuge formula three
    times.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:11
  text: The initiation ceremony concludes with the presentation of a scarf and ten
    silver coins.
  category: action
  evidence_refs:
  - ev:12
- id: obs:12
  text: At the next mass, the boy carries incense sticks, is accompanied by a monk
    called the “bride-companion,” and is instructed in monastic etiquette because
    the ceremony is regarded as a marriage with the church.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:13
  text: A footnote reports that eastern Tibetan Lamas may undergo an initiation ordeal
    in which six crown marks are seared with an iron lamp called Dipamkara, “the burning
    lamp.”
  category: action
  evidence_refs:
  - ev:14
