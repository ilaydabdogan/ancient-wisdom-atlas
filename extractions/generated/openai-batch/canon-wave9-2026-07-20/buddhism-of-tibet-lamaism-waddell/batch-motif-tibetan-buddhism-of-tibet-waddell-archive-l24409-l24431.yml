  quote: ''
  summary: The passage describes Lamaist horoscopes as manuscript divinations prepared
    for events such as birth, life forecast, marriage, death, and the year. They are
    written on long paper sheets, stamped by an astrologer, sometimes mounted on silk,
    and requested with a fee or present. Their calculations consider elementary and
    astral influences at birth in relation to current influences.
