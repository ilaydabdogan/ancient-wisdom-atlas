canonical_text:
  quote: ''
  summary: 'The passage describes religious-political authority in Sikhim, including
    Lama-kingship and dynastic canonization as an incarnation of Manjusri. It then
    gives an eyewitness description of Durjay Paumo, a female reincarnation and abbess
    at Yamdok lake, considered an embodiment of Vajra Varahi. The passage concludes
    by describing beliefs and procedures for identifying new reincarnate Lamas: the
    deceased Lama’s spirit is believed to enter an infant born soon after death; a
    pontiff may indicate the place and family of rebirth; otherwise names of candidate
    male infants born under miraculous portents are written on slips, placed in a
    golden jug, and selected by lot amid prolonged prayer.'
  language: English
  quote_policy: summarized
