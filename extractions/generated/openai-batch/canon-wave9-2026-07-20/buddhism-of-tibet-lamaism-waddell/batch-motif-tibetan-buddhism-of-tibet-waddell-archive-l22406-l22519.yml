canonical_text:
  quote: ''
  summary: 'The passage describes offerings used in Tibetan Buddhist worship: water,
    flowers, incense, lamps, perfumed water, food, and cymbals are placed in bowls
    before an image and accompanied by incantation and music. It gives a ritual origin
    account in which celestial or named donors offered these items to the Buddha,
    who blessed them. It also gives a short hymn inviting the recipient to partake
    of the offerings and notes longer Ge-lug-pa liturgy.'
  language: English
  quote_policy: summarized
