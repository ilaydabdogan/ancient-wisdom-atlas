  summary: The passage describes Tibetan prayer or luck flags placed on houses and
    near dwellings, their printed design with a central horse bearing a jewel and
    four corner creatures, and a translated invocation requesting prosperity for an
    individual’s body, speech, mind, and Buddhist doctrine. It then explains the protective
    or beneficent functions of several invoked deities and compares the Tibetan flags
    with Burmese Buddhist prayer-flags offered at shrines.
