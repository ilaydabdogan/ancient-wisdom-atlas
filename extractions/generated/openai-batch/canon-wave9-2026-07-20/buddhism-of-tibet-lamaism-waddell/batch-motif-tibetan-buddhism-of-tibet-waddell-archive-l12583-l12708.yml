    in a child at Lhasa who was conveyed to Bhutan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The incarnate child is said to have appointed a regent for temporal concerns
    called Deb Raja; the passage adds that temporal power later lay with lay governors
    called Pen-lo.
  category: sequence
  evidence_refs:
  - ev:6
