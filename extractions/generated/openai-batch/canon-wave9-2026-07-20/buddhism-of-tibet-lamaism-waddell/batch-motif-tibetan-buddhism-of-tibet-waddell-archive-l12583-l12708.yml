canonical_text:
  quote: ''
  summary: The passage describes reincarnate and hereditary succession among Tibetan
    and Bhutanese Buddhist hierarchs. It notes the relocation of the Je-tsun Dam-pa
    reincarnation line to Tibet, the former political power and later religious status
    of the Sa-kya hierarchy, a hereditary Sa-kya succession rule, and the Bhutanese
    hierarchy’s Dharma Raja, reincarnation claims, regency, thunderbolt and thunder-dragon
    insignia, honorific titles, and listed hierarchs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Future births of the Je-tsun Dam-pa were arranged to be found in Tibet, and
    the present reincarnation is described as the eighth of the series, born in Lhasa,
    educated at De-pung, and carried to Urga with a tutor when young.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sa-kya hierarchs are described as formerly very powerful, almost de facto
    kings of Tibet, but later eclipsed by the established church.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sa-kya hierarch is said to retain support among unreformed sects and to
    be regarded by the Nin-ma-pa as their head and an incarnation of the Guru.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage gives a numbered list of earlier Sa-kya hierarchs and says their
    most prosperous era was from 1270 to 1340.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sa-kya succession is described as hereditary, with the brother of the reigning
    Lama and uncle of the successor intervening between father and son to ensure an
    adult holder of the headship.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Bhutanese hierarchy is described as combining religious hierarchy with
    temporal rule and as having ousted rival sects in favor of the southern Duk-pa
