canonical_text:
  quote: ''
  summary: After dying, Nan-sa prays for mercy before the Judge of the Dead. Her good
    and bad guardian angels pour out white and black deed-counters; the white deeds
    exceed the black, and a magical mirror confirms the record. King Yama reprieves
    Nan-sa, sends her back to the human world as a death-returned person, and tells
    her to benefit beings. She returns to her shrouded body amid flowers and a rainbow.
    Corpse-removal men first fear her as a ghost, then revere her. Her household asks
    forgiveness, but renewed persecution drives her to seek convent refuge, where
    a Lama gives her the vow of a novice. The lord of Rinang then attacks the monastery
    and threatens the Lama.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nan-sa is described as dead, with joined hands, praying to Tara, fairy she-devils,
    and the Judge of the Dead for mercy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In her prayer, Nan-sa says she wished to benefit animals, had little time
    in the world, disregarded beauty after learning birth ends in death, and gave
    wealth to the poor and blind.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Judge of the Dead orders Nan-sa's two guardian angels, the good and the
    bad, to pour out white and black deed-counters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The white virtuous deed-counters are found to exceed the black sinful deed-counters,
    with the black ones said to be only two in number.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The judge consults a magical mirror, finds the record correct, and reprieves
    Nan-sa because she is religious and could do good if allowed to live longer.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: King Yama says he separates white deeds from black, sends those with preponderant
    white virtue to heavens, sends sinful persons to hell, and says no one escapes
    his bar of Justice.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The judge tells Nan-sa to return to the human world, recover her old body,
    be a death-returned person, and benefit animal beings.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nan-sa leaves by a white heavenly path, descends to the world, resumes her
    former body in a white blanket-shroud, and lies with folded hands and flexed feet.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Flowers rain down from heaven upon Nan-sa, and a rainbow forms a halo around
    her.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The men who came to remove the corpse hear the dead body speak; some flee,
    others prepare to throw stones, and Nan-sa tells them she is not a ghost but a
    death-returned person.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The lord and the prince hear of Nan-sa's return, come to her, ask forgiveness,
    and conduct her back home; she wishes to become a nun but resumes domestic life
    at her son's entreaty.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Nan-sa's renewed piety leads to ill-treatment by her husband; she flees to
    her parents, is beaten and expelled, and then seeks admission to a convent.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: At the convent, Nan-sa prays to the Lama and fairy-mothers, offers her rich
    robes and jewels, and receives the Lama's blessing and the vow of a novice.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The lord of Rinang goes to war against the monastery, demands satisfaction
    from the Lama for making Nan-sa a nun, seizes the Lama, and points a sword at
    his heart.
  category: action
  evidence_refs:
  - ev:12
