canonical_text:
  quote: ''
  summary: 'The passage describes a general charm print with mantric syllables arranged
    in circles, including a request to guard the charmholder’s body, mind, and speech.
    It explains that the central special charm varies by purpose and consists of a
    mystic seed letter or monogram. Several example charms are then summarized: against
    bullets and weapons, against clawing animals, for domestic broils, and for kitchen
    smells offensive to house-gods. The author frames these as sympathetic magic and
    adds brief comparisons to ancient Indian/Vedic sources and to a Greek hearth-god/cow
    myth.'
  language: English
  quote_policy: summarized
