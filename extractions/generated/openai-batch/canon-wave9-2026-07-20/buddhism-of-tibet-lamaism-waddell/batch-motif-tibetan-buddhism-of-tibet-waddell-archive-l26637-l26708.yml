canonical_text:
  quote: "“real rain will certainly come.”"
  summary: The passage describes a Tibetan Buddhist rain-compelling rite attributed
    to Tson-K’a-pa. An officiating Lama prepares a clean worship place, installs an
    image and offerings, empowers pellets with mantra, places them in a vase, addresses
    the Nagas with request and threat, hides the vessel in spring water, invokes directional
    Buddhas and a location-god, visualizes Tson-K’a-pa seated on a Naga sending ambrosia,
    and expects lightning, clouds, thunder-dragons, and rain to follow. A note compares
    the rite with a Mongol rain-making method involving bezoar stones thrown on water.
  language: English
  quote_policy: quoted
