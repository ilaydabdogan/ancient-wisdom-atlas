    modifications, making gods finite and subject to death and metempsychosis. It
    also describes gods and genii in Buddhist records as receiving worship for temporal
    blessings, identifies the coming Buddha as resident in Tushita heaven, and says
    Lamaism is filled with fantastic beings, deified heroes, and nature-worship survivals.
