canonical_text:
  quote: ''
  summary: In a description of the “Ballet of the Devils,” saintly exorcisms fail
    to keep back advancing demons, who close in upon a soul. The demons are described
    as incorporated in Tibetan Buddhism and regarded as forms of Durga, Siva, and
    the king of the Dead. Demon-maskers wear raiment marked with flames and skulls
    and carry ritual implements including a bell or fan, a human-skull bowl called
    Bundah, and streamer-covered sticks.
