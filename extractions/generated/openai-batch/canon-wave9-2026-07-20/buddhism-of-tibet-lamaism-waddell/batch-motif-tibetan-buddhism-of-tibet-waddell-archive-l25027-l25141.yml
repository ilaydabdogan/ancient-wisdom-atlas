  quote: ''
  summary: The passage describes Tibetan divination using white and black seeds or
    pebbles, numerical squares, deity invocation, and manuals that map the black seed’s
    number to an oracle result. It explains a fifteen-square form called “Chinese
    medicinal water,” associated with sickness divination and water, a twenty-one-square
    Tara series with sample prognoses and remedies, and a more elaborate circular
    twenty-eight-division disc used by higher-status Lamas.
  language: English
  quote_policy: summarized
