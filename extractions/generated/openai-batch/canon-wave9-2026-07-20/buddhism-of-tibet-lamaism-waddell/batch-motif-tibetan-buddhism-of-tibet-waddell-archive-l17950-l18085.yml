canonical_text:
  quote: ''
  summary: The passage describes the iconography of the Buddha, especially Sakya Muni
    at Buddh-Gaya under the Tree of Wisdom in the earth-touching or witness attitude.
    It recounts Mara’s challenge, the appearance of Earth Mother as witness, and the
    river from her hair that sweeps away Mara’s forces. It also notes attendant disciples,
    other images of Sakya, the Six Muni, a Naga-related defender figure, and the Seven
    Heroic Buddhas of the past.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Buddha image is described as having a placid benign face, bare head, tonsured
    curly hair with a crown protuberance, mendicant’s garb, and no jewellery.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buddha is seated under the pipal-tree called the Tree of Wisdom, on lotus
    flowers and a throne supported by lions or other animals; an arch may include
    lion, elephant, water-lion, and garuda figures.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sakya Muni form represents the Buddha at the instant of attaining Buddhahood
    under the Tree of Wisdom, wearing three mendicant robes and sitting in the indestructible
    pose with the right hand in witness attitude.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The seat is placed on sacrificial grass on a lion-supported lotus-throne at
    Buddh-Gaya, later called the adamantine throne.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the final struggle for Truth, the powers of darkness are represented by
    Mara, called the demon of Desire, his minions, and the three fires of desire pictured
    above the Buddha.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mara denies the Buddha’s qualifying good deeds and demands a witness; the
    Buddha touches the ground, and Earth Mother appears riding a tortoise and bearing
    a garland to say she is his witness.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The earth-spirit wrings her hair, causing a huge river to issue from it and
    sweep away Mara and his hordes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The same episode is said to be frequently depicted in Burmese temples, and
    Burmese water-pouring after religious service is described as an appeal to the
    earth-spirit to remember the good deed.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: In larger images of this Buddha form, Sariputra stands on the Buddha’s right
    and Maudgalyayana on his left.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Six Muni are described as presidents of the six worlds of rebirth and
    are compared in the passage with the Japanese Six Jizo.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Seven Heroic Buddhas or Tathagatas are described as mostly fabulous except
    for Sakya Muni, and each is said to have a special tree of wisdom.
  category: relationship
  evidence_refs:
  - ev:10
