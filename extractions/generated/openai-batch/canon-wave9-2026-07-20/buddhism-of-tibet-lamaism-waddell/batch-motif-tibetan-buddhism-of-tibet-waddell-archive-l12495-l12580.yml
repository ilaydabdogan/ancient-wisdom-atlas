  summary: The passage describes Captain Turner's meeting with an eighteen-month-old
    infant successor treated as the deceased lama's reappearance, and then summarizes
    Mongolian reincarnate-lama succession around Je-tsun Dam-pa, regarded as an incarnation
    of Taranatha, including a political conflict, a killing, and an announced reappearance
    among the Khalkas.
