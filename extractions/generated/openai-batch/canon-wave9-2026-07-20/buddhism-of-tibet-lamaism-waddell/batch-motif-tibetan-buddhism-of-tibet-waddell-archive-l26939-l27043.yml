  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the third day of the month, the chief judge of De-pung proceeds to Lhasa
    in state, assumes sovereignty, receives regal honours, and has incense burned
    before him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At the chief judge’s arrival in Lhasa, prisoners are released except those
    convicted of the most serious crimes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: During his period of rule, the chief judge is said to have authority over
    property, life, and death, assisted by thirty deputies, and to impose severe punishments
