canonical_text:
  quote: ''
  summary: The passage describes the Tibetan New-Year feast as a February-to-March
    spring carnival involving household decoration, food, drink, dancing, games, prayer,
    monastic masquerades, and processions. It also describes a temporary transfer
    of Lhasa’s temporal government to priests of De-pung monastery, the state entry
    and authority of their chief judge, prisoner release, punishments, monastic feasting,
    lectures, and large assemblies of monks praying for the welfare of the country
    and people.
  language: English
  quote_policy: summarized
