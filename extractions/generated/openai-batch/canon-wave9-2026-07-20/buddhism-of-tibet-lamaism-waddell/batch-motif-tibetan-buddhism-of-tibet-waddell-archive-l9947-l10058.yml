canonical_text:
  quote: ''
  summary: The passage describes Tibetan Buddhist monastic ranks, royal monastery
    affiliations, higher non-incarnate clergy, specialized magic schools and their
    diplomas, and the administrative officials and disciplinary structure of large
    monasteries, including De-pung monastery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Ge-s’e from the three great Ge-lug-pa monasteries may be admitted to one
    of four royal monasteries and may become a Tse-drung of the Grand Dalai Lama’s
    royal monastery at Potala.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sovereign Grand Lamas bestow titles described as “learned” on doctors
    distinguished by blameless holiness and excellent wisdom.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage reports rank analogies in Mongolia: Rab-jam-pa were put on the
    same footing as Tai-jis, and Ch’o-je as Chungtaijis.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: K’an-po, Ch’o-je, and Rab-jam-pa are presented as the three principal classes
    of the higher non-incarnate clergy, in that order.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: K’an-pos take first place among these classes and are usually elected from
    the other two classes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage compares a K’an-po to a bishop and a Ch’o-je to a vicar-general
    or coadjutor; a Ch’o-je may serve under a K’an-po as vice-abbot.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Special schools for the study of magic are located in the cloisters of Ramo-ch’e
    and Mo-ru.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Those who receive the doctor’s diploma from these magic schools gain the right
    to practice mystery science, including conjuring, weather prophecy, and sympathetic
    pharmacy, and are called Nagram-pa or masters of conjuration.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Nagram-pa are described as having a Sivaite uniform, a probable origin
    in the red religion, and an orthodox science that follows prescribed formulas
    in the Kah-gyur.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Large cloisters with hundreds or thousands of monks are said to require an
    organized body of officials for clerical and temporal administration and discipline.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The head of a monastery is either a re-generated or reincarnate Lama or an
    installed abbot; the installed abbot is usually elected from the capital, sanctioned
    by the Dalai Lama or provincial head of reincarnate Lamas, and holds office for
    seven years.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The listed administrative and executive officers include professor, treasurer,
    steward, provost marshal, precentor, sacristan, water-giver, tea waiters, and
    additional secretaries, cooks, wardens, accountants, emblem bearers, tax-collectors,
    medical monks, painters, merchant monks, and exorcists.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: De-pung monastery is described as having 7,700 monks and being divided into
    four great colleges.
  category: setting
  evidence_refs:
  - ev:8
