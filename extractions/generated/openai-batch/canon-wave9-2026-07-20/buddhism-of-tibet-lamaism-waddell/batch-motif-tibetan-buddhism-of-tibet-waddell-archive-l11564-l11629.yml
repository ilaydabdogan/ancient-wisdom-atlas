canonical_text:
  quote: ''
  summary: The passage describes timekeeping by water-clocks and tapers, then outlines
    several daily monastic assemblies. Monks are summoned by conch blasts, perform
    worship services, receive tea repeatedly, make offerings in their cells, leave
    food for hungry spirits, undergo instruction, and end the day with vesper worship,
    recitation before teachers, and sleep after bells.
  language: English
  quote_policy: summarized
