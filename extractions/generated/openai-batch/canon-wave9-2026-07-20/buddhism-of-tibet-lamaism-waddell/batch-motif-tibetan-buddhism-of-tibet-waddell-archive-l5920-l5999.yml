canonical_text:
  quote: ''
  summary: 'The passage explains later links in a Buddhist chain or wheel of dependent
    arising as illustrated in Tibetan Lamaist interpretation: Becoming is shown as
    a married woman or wife; the next link is shown as a parent and child and described
    as birth or maturation through an heir; maturity leads to decay and death, shown
    as a corpse carried to cremation or burial, and then to rebirth. The passage also
    discusses the connective term paccaya and notes that Buddhists call the sequence
    a wheel rather than a chain.'
  language: English
  quote_policy: summarized
