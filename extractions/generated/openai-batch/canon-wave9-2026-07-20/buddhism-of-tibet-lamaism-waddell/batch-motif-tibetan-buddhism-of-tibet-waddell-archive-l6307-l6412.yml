canonical_text:
  quote: ''
  summary: 'The passage summarizes Mahayana metaphysical doctrines as Waddell presents
    them: Nagarjuna’s denial of both existence and non-existence, Prajnaparamita discourses
    attributed to Buddha, the Avatamsaka mirror analogy for true essence and phenomena,
    Sunyata and graded nothingness, the Three Marks and Two Truths, renunciation of
    Samsara because of unreality, and the development of Buddha into an eternal primordial
    universal essence.'
  language: English
  quote_policy: summarized
