literal_observations:
- id: obs:1
  text: A dice throw produces a letter, and the letter indicates the next state of
    rebirth from the current or newly indicated existence, continuing from square
    to square without an endpoint.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Six ordinary rebirth states are listed for a Lamaist layman: the path of
    the sorcerer, many days’ journey, beasts, the Unorthodox or a Bén follower, an
    Indian heretic, and a ghostly state in Limbo.'
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author says the dice in his copy of the board seemed loaded to show the
    letter Y, producing a ghostly existence and requiring many expensive rites to
    counteract the fate.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Turning up A five times in succession is said to mean direct rebirth in the
    paradise of St. Padma and Samantabhadra; turning up S thirteen times in succession
    is said to mean rebirth into the paradise of Maitreya.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Astrological books are said to foretell each year’s general character for
