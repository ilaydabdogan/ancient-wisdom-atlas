  quote: the letter turned up indicates the next state of re-birth
  summary: The passage describes a rebirth divination board using dice, letters, and
    squares to indicate successive rebirth states. It lists ordinary and extraordinary
    rebirth outcomes, notes ritual remedies for an unfavorable ghostly result, and
    then discusses annual astrological forecasts, including an 1891 locust forecast
    and rites for averting death.
