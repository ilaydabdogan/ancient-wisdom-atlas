canonical_text:
  quote: "“I, O! king, cannot turn aside from the virtue of giving.”"
  summary: The passage recounts Prince Visvantara being threatened after giving away
    a Jewel, saved by intercession, and banished by his father. He refuses to abandon
    giving, receives permission for further almsgiving, and departs into a dangerous
    forest with Madri and their children. At the forest edge he teaches the retinue
    about inevitable separation. After a long journey a Brahmin asks for his chariot;
    despite Madri’s anger, the prince explains that seekers enable giving and insight,
    then gives the chariot and horses joyfully.
  language: English
  quote_policy: quoted
