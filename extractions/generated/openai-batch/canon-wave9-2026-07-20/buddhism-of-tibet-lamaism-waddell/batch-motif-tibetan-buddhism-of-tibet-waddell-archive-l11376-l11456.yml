canonical_text:
  quote: ''
  summary: 'The passage describes Tibetan monastic tea and food graces: repeated tea
    service in temples, petitions to the Three Holy Ones, sprinkling drops and offering
    tea to locality demons, food offerings to Buddhas, Bodhisattvas, lamas, tutelary
    and protective beings, demon figures, Hariti and her children, a sevenfold meat
    grace said to cleanse slaughter and benefit the eaten animal, a grace for donors,
    and an explanatory note on Hariti, her children, and the daily leaving of food
    for demons outside the monastery gate.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tea is described as being served eight or ten times daily at temples and cathedrals,
    interrupting the service for refreshment.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tea grace petitions that the speakers and their relatives may never be
    separated from the three holy ones and that the blessing of the trinity may enter
    the drink.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a few drops are sprinkled on the ground with the tips of the fore and
    middle fingers, the grace offers Chinese tea to locality demons and asks for wishes
    to be obtained and Buddha's doctrines to be extended.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The food grace offers food to the Jinas, identified in the passage as the
    Dhyani Buddhas, and to their princely sons, identified as celestial Bodhisattvas.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The food grace then names offerings to the Lama, all Buddhas and Bodhisattvas,
    tutelaries, witches, defenders of the faith, a powerful demon-lord, hprog-ma,
    and the five hundred brothers or sisters.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The food is said to be offered compassionately, without anger or pride, and
    not as repayment for past favors, with the hope that all animal beings may become
    holy and attain perfect Buddhahood.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: When flesh-meat is included in the diet, a grace is repeated seven times to
    cleanse the sin of slaughter and eating flesh; the passage says the animal whose
    flesh is eaten will be reborn in heaven through the spell's efficacy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A separate grace is described for the benefit of donors of provisions, tea,
    and similar gifts to the monastery, and it is repeated before monks eat gifted
    food.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A note identifies Hariti as a man-eating Yakshini with five hundred children
    and says her youngest and beloved son Pingala was hidden in a begging-bowl by
    Buddha, or in some Lama accounts by Maudgalyayana, until she promised to cease
    cannibalism and accept Buddhist doctrine.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The note says Buddha promised that monks would feed Hariti and her sons; it
    adds that each Lama daily leaves food on his plate, and the leavings are gathered
    and thrown outside the monastery gate for pretas and other starveling demons.
  category: action
  evidence_refs:
  - ev:5
