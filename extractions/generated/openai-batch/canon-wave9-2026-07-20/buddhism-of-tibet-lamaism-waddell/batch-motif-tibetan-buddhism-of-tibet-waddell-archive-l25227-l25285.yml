literal_observations:
- id: obs:1
  text: The house augury predicts household happiness and temporary safety, but warns
    that a thief and rogue may come where the cattle dwell; it prescribes 10,000 repetitions
    of the spell of Mavici to avoid this.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The favours augury says desired favours will be obtained gradually and prescribes
    repeated spells and a Duy-kar celebration with clapping of hands to remove difficulties.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The life augury is called good, but says the yDén demon from the east and
    south came with a blue and black article; it prescribes grib-sel, Naga worship,
    and reading Sherab-Ninpo.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The medical augury says the prescribed medicine should be taken secretly for
    a long time, promises recovery, and directs that a lamp be burned nightly from
    sunset to sunrise as an offering to the gods.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Other auguries state that a strong personal god protects against enemies,
    visitors or news are coming, quick business is profitable, travel requires perseverance,
    and lost property or news of it may be found to the north-west.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage describes a special use of dice for determining successive regions
    and grades of future rebirth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The divination board consists of fifty-six or more two-inch squares painted
    in contrasting colors on a large cloth, forming a checkerboard-like area.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Each square represents a phase of existence in one of the six regions of rebirth
    and depicts a figure or scene expressing that state in the world of man, beast,
    god, hell, and other states.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Each square bears the name of its particular form of existence and also six
    possible following states, each preceded by one of six letters also marked on
    the faces of the wooden die.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The procedure begins from the world of human existence; the die is thrown,
    and the letter that appears determines the next region.
  category: sequence
  evidence_refs:
  - ev:8
