  quote: ''
  summary: The passage discusses Tibetan accounts that place the Buddha’s death site,
    called rTsa-mch’og-gron, in Assam; compares this with Chinese pilgrim geography
    and the identification of Kusanagara; explains a possible place-name confusion
    involving Kusa grass, sal trees, and Sal-Kusa in Assam; and includes an aside
    describing Lourdes as a miracle and healing pilgrimage site involving an apparition
    and spring water.
  language: English
