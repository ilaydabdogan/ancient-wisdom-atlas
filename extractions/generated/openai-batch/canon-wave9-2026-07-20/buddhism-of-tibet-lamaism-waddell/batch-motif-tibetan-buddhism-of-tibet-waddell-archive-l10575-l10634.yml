canonical_text:
  quote: ''
  summary: The passage catalogues Tibetan Buddhist hats and cowls, describing regional
    summer hat use, sectarian and ritual headgear, restrictions by rank or descent,
    attributed inventors or donors, magical powers of certain hats, ritual occasions
    for wearing them, decorative motifs, and the practice of removing hats for salutation
    and temple etiquette.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In outer rainy districts of the Himalayas, Bhotan, and Sikhim, many Lamas
    wear straw hats in summer or go bare-headed.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hat was presented by the Chinese king Se-ch'en to the chief of the sect,
    'Phag-pa Rin-po-ch'e, and its central vajra on the crown is described as after
    the Chinese style.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Chinese-presented hat is restricted to those of noble descent and is worn
    for enthronement, empowering devotees, or the gTor rgyab sacrificial offering.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sa-zu mt'on grol hat of the Sa-kya-pa is believed to confer spiritual
    insight and to have been invented by the God of Wisdom, Majijusri.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sa-skya grwa-zwa hat is associated with the Jonan-pa sub-sect and is worn
    by junior Sa-kya monks during certain masses, religious dances, and the Tor-gya
    sacrifice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Karma-pai zwa nag, called the black fairy hat of the Kar-ma-pa, was conferred
    on Rang-'byun Dorje by five classes of Dakkini after he coerced them into granting
    him the power of flying.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Each Dakkini contributed a hair from her tresses and the hairs were plaited
    to form the Karma-pai zwa nag; whoever wears it can fly through the air.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Karma-pai zwa nag is kept as a relic at Sa-kya monastery and, when worn,
    monks hold it on either side to prevent it from carrying off the wearer.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Karma shags-zwa, the enchanter's hat of the Kar-ma-pa sect, is shaped
    after the cake-offering for angry demons and worn during dances and the gtor-rgyab
    sacrifice.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Dwag-zwa ri-'gra hat of the Kar-gyu-pa is worn when empowering or preaching
    and is shaped after the hill of Dwag-lha sgam-pa.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The sNags pai awa nag is a black necromancer's hat worn in the gTor-rgyab
    sacrifice and in the mystic play.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The gZah-zwa planet hat is raven-crowned, was designed after seeing the planet
    Mercury, and is worn during circling the planets and rites of striking and injuring
    an enemy.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Grand Lama of Bhotan's hat is called pad-ma-mt'ong, or lotus-vision, has
    a vajra-spikelet restricted to the supreme Lama, and is embroidered with cross-thunderbolts,
    a lotus-flower, and thunder dragons.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage states that Tibetans follow the Chinese practice of saluting by
    taking off the hat, and that hats are not worn in temples except for certain ceremonies
    requiring a special kind.
  category: action
  evidence_refs:
  - ev:11
