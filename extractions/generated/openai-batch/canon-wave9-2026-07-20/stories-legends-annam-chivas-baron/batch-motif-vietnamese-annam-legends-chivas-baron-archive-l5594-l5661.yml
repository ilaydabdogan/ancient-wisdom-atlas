canonical_text:
  quote: ''
  summary: A divine or sacred address tells Dharma to eat leaves from a miraculous
    tree so that sleep will no longer interrupt contemplation and his body and spirit
    will be strengthened. Dharma eats the shining leaves and gains wakefulness, robustness,
    and luminous spirit. Emperor Ming-Ti visits Dharma, takes leaves, prepares a healing
    beverage, and decrees that the earliest tea leaves be gathered for the Emperor
    of China. The passage presents this as the origin of the Imperial Tea-gathering,
    describes the tea plant multiplying on Chinese hills, and notes a belief that
    Dharma sits near Sakya-Muni in the Buddhist paradise. A final note says the legend
    is Chinese in origin and adopted by Annamite believers.
  language: English
  quote_policy: summarized
