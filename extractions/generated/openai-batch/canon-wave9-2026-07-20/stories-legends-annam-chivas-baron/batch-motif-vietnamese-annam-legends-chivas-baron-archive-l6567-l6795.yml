canonical_text:
  quote: ''
  summary: A Golden Tortoise gives King Yen-Dzeuong a claw that becomes an invincible
    bow. Rival rulers covet it. Trung-Thuy, son of the northern lord Da, enters the
    king’s service to seek the talisman, discovers Princess Mi-Chau while searching
    the palace, declares love, marries her, and later asks her for a still greater
    proof of love while continuing to desire the bow.
  language: English
  quote_policy: summarized
