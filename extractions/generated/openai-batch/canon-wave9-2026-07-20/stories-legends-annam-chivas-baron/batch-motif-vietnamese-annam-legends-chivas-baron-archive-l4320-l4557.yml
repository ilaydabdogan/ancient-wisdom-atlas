canonical_text:
  quote: ''
  summary: The passage introduces Ba, a happy child living near the Lagoon of Lang-Cau,
    listening to tales of genii and loved by his mother. After a fever-bringing genie
    causes his mother’s death, Ba grieves. His father remarries; the stepmother mistreats
    Ba and forces him to become a buffalo-herd. Ba sleeps among the buffaloes and
    longs for his dead mother and sister.
  language: English
