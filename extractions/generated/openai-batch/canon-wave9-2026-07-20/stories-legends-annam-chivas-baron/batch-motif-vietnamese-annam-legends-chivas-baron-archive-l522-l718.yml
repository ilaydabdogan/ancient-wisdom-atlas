canonical_text:
  quote: ''
  summary: 'The introduction describes Annamite legends as harmless tale-telling material,
    names collectors and literary sources, and frames oral narration by Phu-Io in
    settings such as verandahs, pagodas, ruins, and landscapes. It summarizes several
    well-known legends: Ong-than-giong suddenly grows from a cradle-bound babe into
    a warrior who defeats foreigners; the Trung sisters liberate and revive their
    country, then voluntarily ascend to heaven while their bodies are carried by a
    respectful river to their chosen place of honor; Quang-Su cures a king’s madness,
    crosses the sea on his hat to obtain copper, casts a bell whose sound attracts
    a golden buffalo; and Lao-Tseu’s disciples perceive the Tao-teu-Kinh differently
    as an analogy for varied understandings of heavenly matters.'
  language: English
  quote_policy: summarized
