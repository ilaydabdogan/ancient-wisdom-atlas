canonical_text:
  quote: ''
  summary: A framed story of the orchid is set during the reign of King Hung IV. Hoa-Lan,
    a beautiful and changeable woman, accepts the devotion and gifts of several suitors
    but gives her heart to none, and the suitors suffer. A love deity makes her fall
    in love with Mun-Cay, who rejects her. In despair she journeys during a storm
    to the genie of Mount Tan-Vien; a dragon admits her into a cavern, but the genie
    refuses her plea. Leaving the cavern, she meets a goat-footed sorceress, agrees
    to sell her soul for revenge, and the sorceress makes a blood-inscribed banana-leaf
    charm called a cai-bua.
  language: English
  quote_policy: summarized
