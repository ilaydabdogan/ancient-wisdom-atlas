canonical_text:
  quote: ''
  summary: In extreme midday heat, a weary first-person narrator rests beside a road
    under bamboo shade and falls asleep. During the slumber, the largest bamboo, called
    the Wise One, speaks about its living beauty and its usefulness after death to
    Annamite daily life. It then teaches that service may go unrewarded by children,
    friends, fellow men, or the king, and that one should work for the satisfaction
    of a peaceful conscience. The narrator wakes and reports the counsel.
  language: English
