canonical_text:
  quote: ''
  summary: 'Madam Tigress is named as the mother of Tiger, the wild cat, and the panther.
    After giving birth to three similar sons, she tests them at a river to determine
    precedence: one leaps across and is identified as Tiger, one falls in and swims
    across and is identified as the wild cat, and one refuses to cross and is identified
    as the panther. The passage ends with a moral that siblings born of the same parents
    may differ greatly and that a person should not be judged by the wrongdoing of
    a relative or clan member.'
  language: English
  quote_policy: summarized
