canonical_text:
  quote: ''
  summary: Vua-long-Vuong, the Water-Genie or Dragon-King, has old Thay-Loi drawn
    underwater by human-headed dragons. In the Dragon Kingdom, Thay-Loi is ordered
    to cut enormous trees, which fall easily and are carried by rain-made streams
    to the Dragon-King's dwelling. Each evening he rides a felled tree to an emerald
    palace and sleeps in a seaweed bed. After four days he returns to his ducks healthier
    than before. The narrator reports the tale's local credibility and describes offerings
    and incantations used to appease or repel the Water-Genie, who periodically returns
    along waterways and rice-fields to carry off people.
  language: English
  quote_policy: summarized
