canonical_text:
  quote: ''
  summary: After Ly-hue-tong's death, Than-Canh seeks kingship in title as well as
    fact. He repudiates Queen Chieu-Thanh, marries another wife, strips Chieu-Thanh
    of her jewels, and then forces her marriage to the captain Khanh-Linh so that
    she can no longer claim royal dignities. Chieu-Thanh sees Khanh-Linh's love in
    his gaze and accepts him. The marriage is solemnized, Than-Canh proclaims himself
    king, and the Ly dynasty ends. At night, while the new royal couple feast in the
    palace wearing Chieu-Thanh's jewels, Khanh-Linh leads Chieu-Thanh away to a humble
    dwelling, where they affirm their love; after she recalls her stolen necklace,
    he produces a strange gem trinket.
  language: English
  quote_policy: summarized
