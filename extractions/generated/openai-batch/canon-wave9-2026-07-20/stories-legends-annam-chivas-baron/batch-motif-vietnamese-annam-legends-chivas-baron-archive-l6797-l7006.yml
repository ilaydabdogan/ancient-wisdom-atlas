canonical_text:
  quote: ''
  summary: Trung-Thuy persuades Mi-Chau to show him the sacred Tortoise's bow and
    golden claw, which are associated with invulnerability. Mi-Chau leads him to a
    hidden chamber and a lim-wood chest containing the talisman. In the darkness he
    removes the golden claw and replaces it with a yellow-metal substitute. Later
    he announces a journey to the northern lands to visit his sick father, King Da,
    refuses Mi-Chau's offer to accompany him, and elicits from her a plan to mark
    her path with white swan down if war separates them. He then reaches King Da's
    court and assembles captains.
  language: English
  quote_policy: summarized
