canonical_text:
  quote: ''
  summary: The passage describes the special honour given in Annam to those who died
    for the country. It presents them as remembered on pagoda stones and precious
    tablets, venerated like gods, ranked with protecting genii, and commemorated in
    special pagodas or temples. It surveys struggles against Chinese domination and
    lists heroic rebels, commanders, suicides, and martyrs, including figures associated
    with ascent to heaven, a transformed buckler-lake, miraculous weapons, mountains,
    temples, and memorial tablets.
  language: English
  quote_policy: summarized
