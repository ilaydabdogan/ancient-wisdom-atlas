canonical_text:
  quote: '"The blood was changed into pearl."'
  summary: War is declared against Au-Lac. King Yen-Dzeuong trusts his talismanic
    bow, but it breaks when the enemy approaches. He flees with his daughter Mi-Chau,
    who has scattered white swan's down at crossroads. At the shore he invokes the
    Golden Tortoise, which identifies Mi-Chau as the source of his ill luck and commands
    her death for the country's deliverance. Mi-Chau accepts blame, and the king beheads
    her. A rhinoceros carries the king overseas; an oyster drinks Mi-Chau's blood,
    which the Tortoise changes into pearl. Trung-Thuy finds and buries Mi-Chau's body,
    later kills himself in the well of Tang-Lac, and the passage ends with an Annamite
    practice of washing pearls in that well to improve their lustre.
  language: English
  quote_policy: quoted
