canonical_text:
  quote: Thi-Trinh was dead, but the Sensitive Plant was born.
  summary: Xinh remains obsessed with Thi-Trinh despite marriage. In spring he encounters
    her near the lagoon, embraces her against her fear, and she dies; when he tries
    to kiss her, he finds flowers and leaves that shrink from him, explaining the
    Sensitive Plant’s shrinking from touch. The supplied passage then begins a separate
    account in which King Ly-hue-tong abdicates to his daughter Chieu-Thanh, who marries
    Than-Canh, an ambitious consort who seizes power and separates her from her father.
  language: English
  quote_policy: quoted
