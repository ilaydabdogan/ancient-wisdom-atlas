canonical_text:
  quote: ''
  summary: The passage describes the Bay of Along as a mysterious moonlit place with
    dangerous rocks, mournful waters, and a feared dragon. It then recounts the origin
    of Hong-Lo, a giant son of Lac-Long and Au-ki, born from a human egg washed into
    a sea-rock hollow and warmed by the sun. Hong-Lo grows from a beautiful child
    nursed by a golden-horned hind into a powerful chaste man-god. While hunting,
    he pursues a golden tigress into a rocky cleft and discovers that the tigress
    is a disguised maiden, Princess Sen, who cares for her old grand-dame while hiding
    from a wicked brother who would kill her to reign alone. Hong-Lo hides, observes
    Sen serving her ancestress, and then leaves, but returns every evening.
  language: English
  quote_policy: summarized
