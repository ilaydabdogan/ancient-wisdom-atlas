canonical_text:
  quote: Thi-Vong stayed so long standing on the mountain that she became a rock.
  summary: A woman named Thi-Vong follows her warrior husband Vong-Phu on campaign
    while pregnant. After giving birth and being left behind by the army, she climbs
    a mountain to watch for her husband's return. He never comes back; she rejects
    other suitors, raises her son, and eventually becomes the stone landmark known
    as the Rock of Vong-Phu near Lang-Song.
  language: English
  quote_policy: quoted
