  summary: Hoa-Lan sees her lover Mun-Cay transformed by a witch into an ebony-tree.
    After lamenting at the tree, she is touched by a genie, forgiven, and changed
    into an orchid that remains twined around the ebony-tree. The passage presents
    the orchid as a warning linked to feminine vanity and contrasts it with domestic
    modesty and the sensitive-plant.
