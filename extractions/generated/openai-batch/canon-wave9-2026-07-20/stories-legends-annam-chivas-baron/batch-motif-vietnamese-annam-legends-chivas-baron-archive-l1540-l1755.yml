canonical_text:
  quote: "“The snickersee came down thrice, and the old Lord expired.”"
  summary: The passage closes a tale in which an old lord or tiger is killed by a
    descending blade, after which tigers of Quang-Tsi are said to avoid attacking
    humans. It then introduces the Dragon Kingdom ruled by Vua-long-Vuong, recounts
    prior fears and the abduction of Kam-Kong, and narrates how Thi-Nam falls into
    the Song-Lo, is possessed by the water genie, and is lost. Her betrothed Banh-Mong
    dives after her into an underwater realm, chooses eternal night with her over
    daylight without her, and vanishes with the sea-god. Finally, the old duck-keeper
    Thay-Loi sees a magnificent being emerge from a light in the water and recognizes
    him as a god by his undazzled gaze at the sun and lack of shadow.
  language: English
  quote_policy: quoted
