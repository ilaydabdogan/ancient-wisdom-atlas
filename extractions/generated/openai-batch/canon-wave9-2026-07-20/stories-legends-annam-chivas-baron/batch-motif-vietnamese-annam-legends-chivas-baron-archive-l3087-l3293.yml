canonical_text:
  quote: ''
  summary: The passage first frames a narrator who has visited Vong-Xuong in a heavenly
    palace and returned to earth to recount King Trieu-Viet. Trieu-Viet is presented
    as a good king who tries to avoid civil war with Ly-phat-tu by sending ambassadors,
    giving his daughter in marriage, and yielding half his kingdom. When war resumes,
    he commends his country and daughter to a mighty genie and kills himself for peace;
    Huyen-Vu then bears his soul away in a dragon-drawn chariot. The passage then
    presents Ong-lua, the Rice-Genie, as a green-clad, milk-white being with a bell-decked
    hat who teaches moral conduct and describes willingly undergoing planting, cutting,
    grinding, cooking, and eating so that the Annamite people may live.
  language: English
  quote_policy: summarized
