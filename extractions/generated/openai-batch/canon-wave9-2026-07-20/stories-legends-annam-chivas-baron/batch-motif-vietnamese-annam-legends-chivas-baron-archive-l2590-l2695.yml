canonical_text:
  quote: ''
  summary: A crow and a peacock seek suitable dress for Tiger's wedding. The Crow
    proposes taking paint pots from workmen at the King of Annam's house and paints
    the Peacock in many colors. The Peacock admires himself, then deceives the Crow,
    spills most of the paint into the river, and covers the Crow with black paint.
    The tale explains why crows are black and hoarse while peacocks are multicolored,
    and ends with a warning about false friends.
  language: English
  quote_policy: summarized
