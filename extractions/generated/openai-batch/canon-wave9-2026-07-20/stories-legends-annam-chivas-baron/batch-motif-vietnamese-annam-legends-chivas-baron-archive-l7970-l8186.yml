canonical_text:
  quote: ''
  summary: A frame narrator visits a pagoda, where an old bonze identifies a soussyama
    tree said to have been planted by a wandering Brahmin and tells its story. Kampour
    founds a palace and dynasty beside the Ganges, plants a tree after sacrifice,
    and has children with Princess Ranee. The tree's seven boughs correspond to seven
    sons, and a dream and blossom correspond to the birth of the daughter Soussyama.
    After Ranee's death, Soussyama grows up cherished and willful. Prince Damao is
    proposed as her husband but loves Sahiba, while Soussyama prays to love deities
    for Damao's desire and her brother Djabal jealously watches him.
  language: English
  quote_policy: summarized
