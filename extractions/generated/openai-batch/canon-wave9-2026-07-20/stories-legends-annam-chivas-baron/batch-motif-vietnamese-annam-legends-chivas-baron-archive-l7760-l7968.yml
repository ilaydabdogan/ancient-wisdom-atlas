canonical_text:
  quote: ''
  summary: Yeu gives a coin to a hungry old woman, then later receives abundant coins
    from a miraculous pool associated with the sun and his buffaloes. His household
    discovers the treasure and greedily tries to take it by night with nets, but at
    dawn the gold has become muddy pebbles. The narrator states that only the good,
    pure, charitable, and self-sacrificing can obtain treasure from the pool, while
    greed turns gold to mire.
  language: English
  quote_policy: summarized
