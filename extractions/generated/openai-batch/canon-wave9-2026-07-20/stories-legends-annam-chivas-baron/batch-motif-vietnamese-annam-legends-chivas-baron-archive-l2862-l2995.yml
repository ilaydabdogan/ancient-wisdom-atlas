canonical_text:
  quote: ''
  summary: 'A skilful old tailor of Hue is sought for both costly garments and practical
    advice. He counsels jealous and haughty women, then explains to a Prime Minister
    that the cut of a court-dress must depend on how office has shaped the wearer’s
    posture: newly powerful pride, settled experience, or bowed weariness. The closing
    narrator laments his death, saying he could have cured many proud and jealous
    people.'
  language: English
  quote_policy: summarized
