canonical_text:
  quote: ''
  summary: An aged tiger, once a powerful hunter, becomes too infirm to catch ordinary
    prey and begins eating humans. The souls of the people he has eaten are said to
    be unable to attain Nirvana until the tiger dies, and they crowd on his back.
    After the tiger eats old Cai, Cai's soul is forced to cling to the tiger's tail.
    Cai appears to his brother Quir, asks him to make offerings before Buddha Sakya-Muni,
    and instructs him to gather villagers to catch the tiger. Cai then pulls the tiger's
    tail to steer him toward a ditch. A kid escapes from the trap, the tiger remains
    trapped, forest animals attack him, and a man approaches with a weapon.
  language: English
  quote_policy: summarized
