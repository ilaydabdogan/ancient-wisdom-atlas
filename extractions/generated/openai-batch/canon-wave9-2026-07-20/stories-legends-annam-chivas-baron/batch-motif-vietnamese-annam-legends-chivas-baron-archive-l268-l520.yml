canonical_text:
  quote: ''
  summary: 'The passage opens the Introduction by describing Annam as a land of poetic
    and tragic legends. It presents a religious landscape combining Buddhism, Confucianism,
    Taoism, and inherited superstitions. It catalogues many genii and fabulous beings:
    Ma in natural places, water and mountain genii, disease and night-fear spirits,
    animal-form household spirits, sacred or ominous animals, the con-tinh feminine
    genie, the greater Than, and the great sacred Dragon whose body sustains Annam.
    It also explains the Red River as stained by the blood of the Dragon after Cao-Bien
    broke one of its veins.'
  language: English
  quote_policy: summarized
