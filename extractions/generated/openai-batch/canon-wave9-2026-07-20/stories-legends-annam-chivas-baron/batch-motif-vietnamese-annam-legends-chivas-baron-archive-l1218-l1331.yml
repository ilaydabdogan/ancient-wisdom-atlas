canonical_text:
  quote: Nhanh was dragged down to the bottom of the moat by an invisible, invincible
    Power.
  summary: Nhanh hastily reburies wreckage in the hole and replaces a heavy slab.
    Having acquired the Cham Chieftain's treasure, he plans to flee the Citadel with
    his rich burden. As he enters the moat at dawn, water-lily stalks and enormous
    snakes bind him, and the treasure becomes strangely heavy. People try unsuccessfully
    to rescue him, and an invisible Power drags him underwater. The treasure briefly
    floats on the miry water, displaying goldwork and gems, then disappears. Later
    searchers find only mire and pestiferous beasts; after centuries the treasure
    remains hidden, and a man's form is sometimes seen crouching by the moat dreaming
    of it.
  language: English
  quote_policy: quoted
