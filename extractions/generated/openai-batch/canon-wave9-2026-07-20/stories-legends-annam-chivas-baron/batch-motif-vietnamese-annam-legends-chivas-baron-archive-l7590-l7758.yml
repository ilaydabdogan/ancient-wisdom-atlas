canonical_text:
  quote: ''
  summary: At the Pool of Pice, the poor and mistreated boy Yeu tends black buffaloes.
    He is unloved by his mother, beaten or mocked by his family, and often hungry.
    He remembers a maxim taught by a blind man whom he once guided. In severe hunger
    he drinks brackish water, eats bitter roots, then takes bananas claimed by a wild
    man, who accuses him and makes him promise not to repeat the theft. Yeu reflects
    on poverty and prays to the Sun or Planet God for one beam, vowing generosity
    to others. A golden shaft falls, and he finds a new-minted coin, described as
    alms from the sun.
  language: English
  quote_policy: summarized
