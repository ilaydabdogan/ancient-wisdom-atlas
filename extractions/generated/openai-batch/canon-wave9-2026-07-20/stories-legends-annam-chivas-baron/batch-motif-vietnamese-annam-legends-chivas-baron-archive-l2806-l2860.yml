canonical_text:
  quote: ''
  summary: A wily boy living by the Song-Koi learns from an old man that a dragon
    in the river depths can grant kingship and immortality. To obtain kingship, one
    must plunge to the river bottom with a bundle of ancestors' bones and place it
    in the dragon's mouth, though seeing the dragon causes blindness. The youth covers
    one eye, dives with the bones, loses one eye, and becomes the powerful one-eyed
    Genie of the Tan-Vien.
  language: English
  quote_policy: summarized
