canonical_text:
  quote: Married men should all be blind !
  summary: A blind speaker laments losing his sight at twenty, shortly after marriage.
    He recalls the visible beauty of the world and of his young wife, describes how
    he now perceives birds, flowers, sun, and night through other senses, and concludes
    that because he cannot see his wife age or read falsehood in her face, she remains
    forever charming to him.
  language: English
