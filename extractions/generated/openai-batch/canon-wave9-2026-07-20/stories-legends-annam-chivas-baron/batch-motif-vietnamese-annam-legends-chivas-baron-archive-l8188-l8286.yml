canonical_text:
  quote: ''
  summary: Soussyama is tormented by jealousy while Damao and Sahiba declare mutual
    love. Sahiba is later found dead, and the passage states that Soussyama killed
    her rival. Sahiba’s blood becomes an expanding stain on Soussyama, who lives in
    anguish and then opens her own veins. The passage closes by explaining the changing
    colors of soussyama flowers and returning to the pagoda-garden setting where the
    bonze is thanked.
