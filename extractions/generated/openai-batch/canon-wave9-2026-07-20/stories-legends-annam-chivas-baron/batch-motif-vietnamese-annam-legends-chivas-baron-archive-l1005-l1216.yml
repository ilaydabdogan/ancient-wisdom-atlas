  summary: At night outside the Citadel of Cao-Lao, Nhanh plans to seize the buried
    treasure of a Cham Chieftain. The passage recounts a legend that four living warriors
    were buried near the dead chief to guard him and his riches at the four directions.
    Nhanh crosses the moat, climbs the wall, reaches the mausoleum, digs into the
    tomb, opens the royal coffin, displaces the bones, and gathers silver, gold, and
    precious stones.
