canonical_text:
  quote: ''
  summary: 'The passage recounts Dharma''s long ascetic journey from India to China,
    his reception by Emperor Ming-Ti, his Buddhist preaching and translation work,
    and his nightly meditations. After sleep twice interrupts his meditation, Dharma
    cuts off his eyelids and throws them to the ground. Heaven rewards the act: the
    eyelids take root and become the first tea-tree, and a divine voice declares his
    sacrifice pleasing.'
  language: English
  quote_policy: summarized
