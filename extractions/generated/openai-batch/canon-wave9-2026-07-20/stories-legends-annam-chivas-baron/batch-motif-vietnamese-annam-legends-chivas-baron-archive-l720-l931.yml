canonical_text:
  quote: ''
  summary: The passage opens the tale “The Water-Genie.” Kam-Kong, a young village
    woman of Ban-Han, regularly draws water and bathes at the Song-Lo. An old woman
    tells villagers that a beautiful, powerful genie lives in jeweled caverns under
    the river, commands sea-monsters and dragons, can harm or benefit people, and
    has possessed maidens who vanished beneath the water. Later, Kam-Kong returns
    to the river at night, becomes frightened by the river’s eddies and the thought
    of dragons, then is drawn back into the moonlit water while wondering whether
    she might offend the Ma by bathing so late.
  language: English
  quote_policy: summarized
