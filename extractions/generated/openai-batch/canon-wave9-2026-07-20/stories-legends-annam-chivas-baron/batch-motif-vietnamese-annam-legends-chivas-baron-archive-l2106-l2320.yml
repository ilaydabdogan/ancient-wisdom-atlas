canonical_text:
  quote: ''
  summary: In the tale of the betel and the areca-tree, Thi-Trau must choose between
    the nearly identical brothers Lang and Cau. Fate selects Lang through a dropped
    slipper. Cau, despairing over the loss of Thi-Trau and Lang’s attention, plunges
    into the sea and is transformed into an areca tree. Lang calls after him and is
    associated with a second areca tree. Thi-Trau laments, asks the gods to join her
    to her husband, and becomes a betel liana twining around the areca. A Hung monarch
    later comes to Cua-Han to view the marvelous plants and rests beneath them in
    extreme heat.
  language: English
  quote_policy: summarized
