canonical_text:
  quote: ''
  summary: In a village north of the Nhi-ha river during the Duong period, the beautiful
    maiden Thsing-Kou is inspected by a rich mandarin as a prospective wife for his
    son Kouan-Tu. The marriage is arranged and celebrated; Thsing-Kou travels in a
    palanquin to her husband's house, fearing the unknown husband but vowing before
    her ancestors to preserve her honor and be faithful. Kouan-Tu opens the palanquin
    with a golden key and is delighted by her beauty. Two years later they have a
    son and Kouan-Tu has abandoned flower-boats, but on taking a young relative to
    a tea-house he becomes intoxicated. Companions challenge his confidence in Thsing-Kou's
    virtue and propose that three of them try to seduce her. Kouan-Tu drunkenly agrees.
    The excerpt ends with Thsing-Kou waiting at night for her husband by a shutter
    overlooking the garden path.
  language: English
  quote_policy: summarized
