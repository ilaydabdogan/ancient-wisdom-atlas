canonical_text:
  quote: ''
  summary: 'A powerful minister imprisons King Minh-Tong in a dark dungeon and leaves
    him to die of hunger, while the king''s daughter is expelled from the palace and
    stripped of royal ornaments. After long denial, she is allowed to visit him only
    if she brings no food, under pain of death. She wets her robes in a clear river,
    embraces her father in the dungeon, and squeezes water from the garments into
    his parched mouth, sustaining him for a time. An appended note says the popular
    complaint contradicts historical fact: Minh-Tong was beloved, and the starving
    condemned man was his father-in-law, comforted by the queen, Minh-Tong''s wife,
    not his daughter.'
  language: English
  quote_policy: summarized
