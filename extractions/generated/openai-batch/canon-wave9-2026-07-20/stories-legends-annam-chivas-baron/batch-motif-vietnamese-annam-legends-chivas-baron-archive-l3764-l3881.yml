canonical_text:
  quote: A serpent, green and rose-coloured, bit her in the heel.
  summary: A funeral song laments Thi-Teu, a young maiden of Phu-Cam who had been
    gathering silkworm cocoons and singing before she died from a serpent bite. Her
    mother mourns the loss of her daughter, and the Blind Man of Phu-Cam remembers
    her almsgiving, reflects on the transience of life and wealth, joins the funeral
    wailing, and wishes her soul the nearest road to Nirvana.
  language: English
  quote_policy: quoted
