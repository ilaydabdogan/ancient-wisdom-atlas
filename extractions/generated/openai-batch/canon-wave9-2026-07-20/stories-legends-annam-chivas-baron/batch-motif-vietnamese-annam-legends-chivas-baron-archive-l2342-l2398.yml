canonical_text:
  quote: They are images of conjugal love, fraternal love, family love.
  summary: The passage closes the tale of the Betel and the Areca-Tree. A royal party
    leaves Cua-Han in improved spirits after a miracle. The narrator explains that
    Indo-Chinese chewing of betel and areca-nuts commemorates this miracle and that
    betel and areca are regarded as emblems of conjugal, fraternal, and family love.
    A betrothed young man gives a betel branch twined around an areca-bough to his
    future wife as a symbolic pledge. The frame narrative then returns to the road
    to Tourane at twilight near the Marble mountains.
  language: English
