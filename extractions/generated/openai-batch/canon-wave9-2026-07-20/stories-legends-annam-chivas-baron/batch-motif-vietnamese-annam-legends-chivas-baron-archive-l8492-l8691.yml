canonical_text:
  quote: ''
  summary: During the war between the Trinh and the Nguyen, Nguyen-qui-Lang, the Citizen
    of Cu-lac, fights as a fearsome warrior. A Trinh captain blinds him with sunlight
    reflected from a buckler and cuts off his head. Nguyen lifts his head under his
    arm, kills the captain, goes to the village, speaks with his grieving wife, and
    receives supernatural aid when she invokes the Mighty One and sets his head back
    on his shoulders. He then chooses to die for his country, his soul going to the
    paradise of heroes, and a shrine is built at the spot. A closing historical note
    gives a less miraculous version in which Nguyen rises despite terrible wounds,
    kills the hostile chieftain, and sees his army succeed before dying.
  language: English
  quote_policy: summarized
