canonical_text:
  quote: ''
  summary: A narrator contemplates the sensitive plant and asks Phu-Io about it. Phu-Io
    begins a story about Thi-Trinh, a poor fisherman's daughter noted for beauty,
    modesty, chastity, and cleanliness. Many suitors seek her, while her father guards
    her. Xinh, the son of a mandarin, repeatedly encounters her on the road, speaks
    to her, attempts to come physically close, and becomes obsessed when she maintains
    distance and refuses contact.
  language: English
  quote_policy: summarized
