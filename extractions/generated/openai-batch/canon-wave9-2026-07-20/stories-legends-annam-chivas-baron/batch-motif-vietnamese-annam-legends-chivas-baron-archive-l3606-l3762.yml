canonical_text:
  quote: then the genii are fighting for their spouse.
  summary: A narrator explains storms and floods as the continuing war between Son-Tinh,
    Genie of the Mountain, and Thuy-Tinh, Genie of the Sea, who once rivaled one another
    for the daughter of King Van-Lang. The princess chose Son-Tinh; Thuy-Tinh swore
    vengeance, raised floods, and fought Son-Tinh, whose mountain father aided him.
    The conflict recurs whenever typhoon and overflowing waters appear.
  language: English
  quote_policy: quoted
