canonical_text:
  quote: But Buddha avenges the innocent.
  summary: Ba, a child buffalo-herd, dies after his buffalo accidentally wounds him
    while trying to prevent his fall. Buddha makes a spring arise where Ba's blood
    and tears fell. The spring, hibiscus, turtle-dove, and bat curse Ba's cruel stepmother.
    The passage ends with Ba asleep in Nirvana in his mother's arms.
  language: English
