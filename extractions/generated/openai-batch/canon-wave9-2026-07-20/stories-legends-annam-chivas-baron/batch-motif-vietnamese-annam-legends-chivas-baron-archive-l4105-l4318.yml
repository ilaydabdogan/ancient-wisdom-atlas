canonical_text:
  quote: ''
  summary: Hong-Lo secretly watches and provides food for Princess Sen near her cavern.
    Jealous maidens of the Giao-Chi discover Sen, strip off her tiger-skin covering,
    bind her, and throw her into the sea. Hong-Lo recovers her body in his net, carries
    her away, and shakes the guilty women into the water, where crocodiles devour
    them. With help from good genii he brings Sen back to life, marries her, and they
    care for her grandmother. Sen's brother Cao later attempts to recapture her and
    is devoured by the thuong-cuong. The narrator localizes the legend at the Bay
    of Along through Hong-Lo's giant footprint, the maidens' laments, and possible
    visions of a dragon or Sen among the rocks.
  language: English
  quote_policy: summarized
