canonical_text:
  quote: ''
  summary: Khanh-Linh, a young captain, pities the unhappy Queen Chieu-Thanh. The
    dispossessed King Ly remains politically dangerous to the Trans; after Tran-thu-do
    warns him through an image of weeds and roots, King Ly is found hanged on a rose-wood
    tree. Chieu-Thanh grieves in the gardens, laments her royal sorrow, and drops
    a red silk handkerchief wet with tears. Khanh-Linh retrieves it, spreads it under
    moonlight, and the tears crystallize into luminous magic drops, by whose light
    he recognizes his concealed love for the queen.
  language: English
  quote_policy: summarized
