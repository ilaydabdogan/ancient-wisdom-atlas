canonical_text:
  quote: ''
  summary: 'The passage narrates the aftermath of an assault on Thsing-Kou: Shang-Ky
    lies dead, Tuong-Binh enters and attempts to force himself on her, and she repels
    him with a golden hairpin. Thsing-Kou prays to That, vows to remain pure, kills
    herself with a dagger, and is later vindicated by a tribunal. Kouan-Tu is condemned,
    while Thsing-Kou is memorialized by an arch and worshipped as a divine ancestress.'
  language: English
  quote_policy: summarized
