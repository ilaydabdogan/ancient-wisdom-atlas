canonical_text:
  quote: ''
  summary: Thsing-Kou waits at night for her absent husband Kouan-Tu, checking on
    her sleeping child. A-Hong enters and declares love after claiming her husband
    is with dancing-girls; Thsing-Kou rejects him and wounds him with a weapon. After
    lamenting and fearing his words may have affected her, she mistakes another arrival
    for her husband, but it is Shang-Ky. Shang-Ky also declares love, disparages the
    absent husband, and attempts to uncover her foot. Thsing-Kou stabs him dead and
    reflects with horror that two esteemed mandarins attempted to seduce a wife during
    her husband's absence.
  language: English
  quote_policy: summarized
