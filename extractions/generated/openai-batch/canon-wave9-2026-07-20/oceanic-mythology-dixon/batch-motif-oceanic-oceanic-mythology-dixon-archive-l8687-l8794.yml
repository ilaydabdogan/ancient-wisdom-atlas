canonical_text:
  quote: ''
  summary: 'A comparative survey of Oceanic and Philippine/Bornean origin myths: humans
    are fashioned from trees, wood, clay, earth, wax, grass, reeds, or tree fruits;
    formed bodies may require breath or soul. Animals and celestial phenomena are
    variously said to arise from bark, leaves, twigs, or dismembered bodies of deities,
    children, or celestial offspring.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In one account, creators fashion a man and a woman from the Kumpong tree,
    then forget the original pattern and make inferior creatures identified as ancestors
    of orangutans and monkeys.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Iban and Sakarram Dyak versions are reported as reversing the sequence:
    birds fail twice to make man from wood and succeed on a third trial using clay.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In a Dusun account, the first two beings make a stone man that cannot talk,
    then a wooden figure that talks but rots, and afterward an earth-made man from
    whom people descend.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In a Bilan account, deities first make wax people, which melt near fire, then
    make people from dirt; the nose is initially shaped upside down and then corrected.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Another Bilan account says earth images were vivified by whipping.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Other stated materials for human origin include grass among the Ata and pairs
    of reeds for ancestors of non-Igorot peoples in an Igorot account.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: In a Nias version, humans are formed from the lowest fruits or buds of a tree
    that grew from the heart of an early being, while gods develop from upper buds.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the Nias account, male and female bodies are shaped, wind is put into the
    mouth of the image as a soul, and the people receive names.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Some Kayan accounts say pieces of bark cast on the ground become swine, fowl,
    and dogs, while others say birds, beasts, and fish derive from leaves and twigs
    of a wonder-tree.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In south-eastern Borneo, serpents, tigers, and harmful animals are said to
    be formed from the body of Angoi after another divinity kills and scatters him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In an Ifugao account, the child of a sky-maiden and a mortal is cut in two;
    the father’s retained half decays, and the mother later makes animals and other
    things from its parts.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In a Mandaya account, the sun and moon marry and have children; after the
    parents separate, the children die, and the moon cuts their bodies into pieces
    that become fish, land animals, snakes, and stars.
  category: sequence
  evidence_refs:
  - ev:10
