candidate_motifs:
- id: motif:1
  label: Failed or sequential human fabrication from different materials
  taxonomy_refs: []
  basis: Several accounts involve makers attempting to create humans from successive
    materials, with failures or imperfect results before a successful form is made.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The available taxonomy does not include a precise material-trial anthropogenesis
    category.
- id: motif:2
  label: Humans arising from trees or plant matter
  taxonomy_refs:
  - sacred_tree_axis
  basis: Humans or human ancestors are made from the Kumpong tree, reeds, grass, or
    the fruits and buds of a tree grown from an early being’s heart.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  confidence: medium
  cautions: Tree or plant origin is explicit, but an axis mundi or world-center function
    is not stated in the passage.
- id: motif:3
  label: Formed body animated by breath, wind, or soul
  taxonomy_refs: []
  basis: The Nias account describes wind placed in the mouth of the image as a soul,
    and Angoi is described as having provided humankind with breath.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage gives only brief summaries of the relevant versions.
- id: motif:4
  label: Animals or phenomena arising from dismembered bodies
  taxonomy_refs:
  - death_rebirth
  basis: Angoi’s body, the Ifugao divided child’s body, and the bodies of the Mandaya
    sun and moon’s children become animals or natural phenomena after being cut, decayed,
    or scattered.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The material is transformation after death, not resurrection of the same
    individual; the taxonomy reference is approximate.
- id: motif:5
  label: Celestial or mixed-parent child as source of beings
  taxonomy_refs:
  - divine_parent_child
  basis: The Ifugao account concerns the child of a sky-maiden and a mortal; the Mandaya
    account concerns children of the sun and moon whose bodies become beings and stars.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The two accounts differ in parentage and resulting transformations.
- id: motif:6
  label: Origin of harmful animals from a divine conflict over breath or immortality
  taxonomy_refs: []
  basis: A divinity who wished to bring immortal life from heaven kills Angoi, the
    deity associated with giving breath, and harmful animals arise from Angoi’s scattered
    body.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This motif is supported by a single summarized south-eastern Borneo account
    in the passage.
- id: motif:7
  label: Animal creation from plant fragments
  taxonomy_refs:
  - sacred_tree_axis
  basis: Kayan accounts derive domestic animals or birds, beasts, and fish from bark,
    leaves, and twigs, including parts of a wonder-tree.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The tree as animal source is explicit, but the axis or world-center aspect
    of the taxonomy reference is not stated.
comparison_claims:
- id: claim:1
  claim: The passage explicitly presents the Iban and Sakarram Dyak accounts as similar
    to the preceding human-creation narrative, while noting that the order is reversed
    and clay succeeds after failed wooden attempts.
  claim_level: same_motif
  target: Iban and Sakarram Dyak human creation from failed wood attempts and successful
    clay
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides only a compressed secondary comparison rather
    than full versions of the myths.
- id: claim:2
  claim: The Dusun and Bilan accounts share a functional pattern in which unsuitable
    materials fail before humans are successfully formed from earth or dirt.
  claim_level: same_function
  target: Dusun and Bilan sequential human-making materials
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The specific failed materials and narrative details differ: stone
    and wood in the Dusun account, wax and an incorrectly shaped nose in the Bilan
    account.'
- id: claim:3
  claim: The south-eastern Borneo, Ifugao, and Mandaya accounts share a broad motif
    in which dismembered or divided bodies generate animals or other natural phenomena.
  claim_level: same_motif
  target: Body-fragment origin of animals and phenomena in Borneo, Ifugao, and Mandaya
    accounts
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The bodies involved differ: a deity, a child of sky-maiden and mortal,
    and children of the sun and moon; the resulting beings and phenomena also differ.'
- id: claim:4
  claim: The Kayan plant-fragment animal origins and the Nias tree-fruit human origin
    use plant parts as generative matter, but for different classes of beings.
  claim_level: same_function
  target: Plant-part generation of beings in Kayan and Nias accounts
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: low
  limitations: The passage does not explicitly compare these two accounts; the claim
    is limited to the shared function of plant matter producing living beings.
