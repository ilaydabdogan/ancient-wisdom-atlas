  summary: 'The passage is a notes section for Part I, mostly bibliographic references,
    with brief comparative comments on Oceanic mythic themes: Tangaroa''s variant
    genealogy, a Heaven Father and Earth Mother theme, fishing up land, the first
    man and first woman, a woman formed from the warmth of the Sun and Echo, divine
    ancestors, human origin from worms, human origin from a tree, and Maui''s partial
    role in unspecified variants.'
