canonical_text:
  quote: ''
  summary: The passage gives fire-origin variants. In one, Goga secretly cooks with
    fire from her body; the youngest of ten youths discovers and steals a firebrand.
    Fire spreads to a pandanus-tree, where a snake’s tail remains alight despite rain,
    allowing the boys and villagers to obtain flame. A second Admiralty Islands version
    tells of a speaking serpent who marries a woman, raises their children, and has
    the boy retrieve fire from inside the serpent’s belly so the children can cook
    food. The author notes related serpent-fire forms and a possible affinity with
    the Polynesian Maui fire-quest.
  language: English
  quote_policy: summarized
