canonical_text:
  quote: ''
  summary: 'The passage gives several Oceanic accounts of human origins: in a New
    Hebrides tale, Takaro forms men from mud, animates them by breathing on them,
    transforms one into a woman, and assigns her a husband. In New Britain versions,
    an unnamed being animates drawings with his blood to produce To-Kabinana and To-Karvuvu;
    women then arise from coconuts. A further New Britain version uses light and dark
    coconuts to explain two human marriage classes and cross-marriage. The passage
    closes by introducing another type of origin tale involving birds in the Admiralty
    Islands.'
  language: English
  quote_policy: summarized
