canonical_text:
  quote: ''
  summary: 'The passage surveys several Maui-cycle episodes: Maui imprisons winds;
    transforms a brother-in-law into a dog; kills Tuna, an eel connected with Maui’s
    wife; and is compared with wider Polynesian accounts in which Tuna, an eel-lover
    of Ina, is beheaded and from his buried head the first coconut tree grows. The
    author also notes wider Melanesian and Indonesian parallels for an animal-form
    lover and for the origin of the coconut from a buried head. The passage then begins
    a new chapter on miscellaneous tales, introducing Tawhaki and Whaitari, a sky-dwelling
    cannibal female divinity who descends to marry Kai-tangata after misunderstanding
    his name.'
  language: English
  quote_policy: summarized
