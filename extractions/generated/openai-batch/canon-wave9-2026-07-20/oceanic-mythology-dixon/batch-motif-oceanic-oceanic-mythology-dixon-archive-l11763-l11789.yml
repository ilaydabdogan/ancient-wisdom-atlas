canonical_text:
  quote: ''
  summary: The passage surveys fragmentary Micronesian cosmogonic material. It notes
    beliefs in preexistent world and sky-world in the Pelew Group and western Carolines;
    a western Carolines account in which Ligobund descends and makes a desert earth
    fertile; a central Carolines account in which Lukelang creates heaven and earth
    and places heavenly plants on earth; a Gilbert Group notice that Nareau and his
    daughter Kobine made heaven and earth; and a Marshall/Ralick account of an original
    sea where Loa commands reef, sand, and plants to appear.
  language: English
  quote_policy: summarized
