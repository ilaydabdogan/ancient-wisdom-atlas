canonical_text:
  quote: ''
  summary: Olofat, believed to have been crushed under a great post, remains alive
    in a hole, eats a nut, and uses ants carrying the fragments as a means to escape
    by transforming into an ant. Luk and others acknowledge that repeated attempts
    to kill Olofat fail. Samenkoaner says he cannot kill Olofat because Olofat is
    older than he is. Rat advises burning Olofat, but Olofat survives the fire by
    passing through a roll of coconut fibre; Rat then advises making him lord of all
    who are evil and deceitful. The following chapter summary compares Micronesian
    myth material with Indonesian, Polynesian, Melanesian, and Papuan materials, and
    the text then begins a section on Australia with geographic and ethnographic description.
  language: English
  quote_policy: summarized
