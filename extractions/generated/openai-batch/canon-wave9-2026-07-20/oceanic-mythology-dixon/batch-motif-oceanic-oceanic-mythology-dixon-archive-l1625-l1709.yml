canonical_text:
  quote: ''
  summary: The passage summarizes Polynesian cosmogonic variants, especially a Hawaiian
    staged origin myth in which a new world arises from the wreck of an earlier world.
    Life appears from darkness and develops through successive forms; decay helps
    raise land above water; an octopus survives from a former world; night figures
    produce plants, insects, and birds; later periods bring mammals, the separation
    of night and day, psychic qualities, humans, and higher gods. The passage compares
    this evolutionary sequence with other Polynesian and New Zealand origin myths
    and notes a separate variant with gods existing before chaos.
  language: English
  quote_policy: summarized
