canonical_text:
  quote: ''
  summary: 'The passage recounts episodes involving To-Kabinana and his foolish brother
    To-Karvuvu: a fragmentary rebuke predicts future human flesh-eating; the brothers
    build houses differently, make rain, and To-Karvuvu suffers from his faulty roof
    until To-Kabinana shelters him; To-Kabinana animates a carved Thum-fish to drive
    food fish ashore, while To-Karvuvu imitates him by making a shark that eats fish
    and will harm people. The passage then summarizes the wise/foolish brother pattern
    in the region and introduces Banks Islands material about Qat, his Tagaro brothers,
    Marawa the Spider, and an unfinished episode in which Qat''s canoe-making work
    on a great tree is undone each night.'
  language: English
  quote_policy: summarized
