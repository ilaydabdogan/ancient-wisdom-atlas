canonical_text:
  quote: ''
  summary: The passage summarizes trickster tales in which a tortoise kills an ape,
    turns the body into consumable goods, and deceives other apes into consuming them.
    When the apes pursue him, he tricks them into throwing him into the sea, where
    he is safe. A buffalo drinks up the sea for the apes, but a crab bites the buffalo,
    releasing the water and drowning all but one ape, whose offspring become the apes
    of today. A second tale begins with an ape proposing mutual stewing; an unnamed
    trickster uses a bamboo cooking vessel, leaves, a vine, and timing to avoid being
    cooked.
  language: English
  quote_policy: summarized
