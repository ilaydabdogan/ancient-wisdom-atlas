canonical_text:
  quote: ''
  summary: 'The passage recounts episodes involving Whaitari, Hema, and Tawhaki: Whaitari
    kills and eats men, is blinded, leaves for the sky in a cloud, and gives warnings
    about reaching heaven. Hema later has children Tawhaki and Karihi, attempts to
    rescue his abducted wife, and is killed. Tawhaki is attacked by jealous kinsmen,
    restored by his wife, avenges himself through a divine flood, then journeys to
    rescue his mother from goblin captors and helps devise a light-and-darkness trap
    against them.'
  language: English
