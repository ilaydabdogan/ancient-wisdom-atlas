canonical_text:
  quote: ''
  summary: The passage first describes a Nias ancestral image as a temporary abode
    for ancestor spirits. It then gives a Philippine tale in which Aponibolinayen
    goes with her sister-in-law Dinay to collect siksiklat greens; the vine encircles
    Aponibolinayen and carries her to the sky. There she finds a spring, precious
    materials, a small house, and a betel-nut tree in which she hides. The house belongs
    to Ini-init, identified as the sun, who leaves by day to make the sun. Aponibolinayen
    enters the house, uses magic to turn a fish-roasting stick into cut-up fish, eats,
    and sleeps. When Ini-init returns, the house seems to burn, but the flame-like
    appearance is the sleeping woman; later she vanishes and hides again in the betel-nut
    leaves.
  language: English
  quote_policy: summarized
