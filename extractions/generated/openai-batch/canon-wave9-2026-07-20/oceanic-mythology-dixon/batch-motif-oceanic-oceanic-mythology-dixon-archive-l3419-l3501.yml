canonical_text:
  quote: "“this woke the old woman up, she opened her eyes, started up, and killed
    Maui.”"
  summary: Maui travels with bird companions to the sleeping Hine-nui-te-po and attempts
    a dangerous passage through her body so that he may live and she may die. He warns
    the birds not to laugh too soon, but Tiwakawaka laughs, wakes Hine-nui-te-po,
    and Maui is killed. The passage then discusses variants in which Maui seeks immortality
    for humankind, including a dispute with Hina the moon over whether death should
    be temporary or permanent, and compares this to broader origin-of-death tale patterns.
  language: English
  quote_policy: quoted
