canonical_text:
  quote: ''
  summary: 'The passage recounts a captive escape tale involving Whakaturia and Tama-te-kapua,
    followed by the author’s comparative note on a deceitful-advice motif. It then
    summarizes Polynesian astronomical myths: Rona taken by the moon, variant accounts
    of Rona and the moon’s waning through mutual devouring and restoration, a Cook
    Group tale of a woman carried off by the moon and associated with thunder, and
    the opening of a Hawaiian Pounahou spring tale involving twins and a jealous stepmother.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Whakaturia is hung under the roof of Uenuku’s house so that smoke from a fire
    may slowly stifle him, while his captors dance and sing badly every night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tama-te-kapua secretly climbs onto the roof, opens a small hole, speaks with
    Whakaturia, finds him alive, and devises a plan based on the captors’ poor dancing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Whakaturia tells the dancers they cannot dance or sing properly, asks to be
    let down and equipped, and then demonstrates skill when the captors comply.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After a door is left partly open, Whakaturia escapes through it at a signal;
    Tama-te-kapua bars the door and window, and the brothers flee while the captors
    remain shut inside until later freed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator identifies the tale’s notable feature as deceitful advice by
    which the captive gets his captors to try to kill him in a way he knows will not
    be fatal, and notes reported distribution outside Polynesia and Melanesia.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: In a Maori account, Rona goes to fetch water, curses the moon after stumbling
    in darkness, and is seized and carried away by the moon along with a tree, water-gourd,
    basket, and other items, which are said to remain visible in the moon.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Other versions describe Rona as male, connect him with reaching the moon in
    pursuit of his wife, and explain the waning moon through Rona eating the moon
    and being devoured by it; both are restored by bathing in the living waters of
    Tane and renew the struggle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In a Cook Group tale, the moon becomes enamoured of a daughter of Kui the
    Blind, descends, carries her off, and she is seen in the moon with implements
    and materials for cooking and tapa-making; stones she throws aside are said to
    produce thunder.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Hawaiian Pounahou spring tale begins with a chief whose wife dies leaving
    boy-and-girl twins; he remarries, and the second wife becomes jealous of the children,
    especially when the father is away.
  category: sequence
  evidence_refs:
  - ev:8
