canonical_text:
  quote: ''
  summary: 'The passage recounts the end of a tale in which Houmea is exposed, swallows
    Uta''s two children, is forced by Uta''s charm to disgorge them, pursues the escaping
    family in bird form, and is killed when the children throw a hot stone down her
    throat. It then summarizes a Maori tale introduced as comparatively useful: a
    dog is killed and eaten, howls from inside Toi-te-hua-tahi, and Tama-te-kapua
    and his brother retaliate by stealing fruit on stilts; one brother is caught while
    Tama escapes by deceiving his captors.'
