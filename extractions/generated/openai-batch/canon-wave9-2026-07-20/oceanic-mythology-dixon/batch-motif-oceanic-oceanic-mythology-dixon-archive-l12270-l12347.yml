canonical_text:
  quote: We can do nothing with Olofat; I believe he cannot die.
  summary: 'Olofat receives only the smallest fish while Luk receives the large ones,
    but the feast fish given to Luk''s party are empty skins while Olofat can eat
    his own fish. Luk repeatedly arranges for Olofat to be killed: first by Thunder,
    whose lightning Olofat quenches with coconut milk; then by Anulap, whose hook-rope
    Olofat cuts with a mussel-shell and whose club he evades by changing into a wooden
    mortar. Luk then concludes that Olofat may not be able to die and sets up a porch-building
    trap with tree-trunks and holes, but Olofat makes side-excavations and escapes
    the falling trunk into one of them.'
  language: English
  quote_policy: quoted
