canonical_text:
  quote: ''
  summary: 'The passage recounts several animal trickster episodes: a trickster escapes
    a snare by feigning death; the kantjil or mouse-deer escapes a cage by persuading
    a dog to change places with him; an ape-trickster frightens a buffalo with false
    bloodied horns; the mouse-deer frightens a tiger by using red-stained saliva and
    the tiger’s reflection in a well; and an ape allied with the tiger is killed after
    the tiger flees while their tails are tied together. The passage then notes the
    broad distribution of the hare-and-tortoise tale and of similar animal trickster
    narratives across parts of Southeast Asia and Indonesia, and begins a new tale
    about an ape and a heron.'
  language: English
  quote_policy: summarized
