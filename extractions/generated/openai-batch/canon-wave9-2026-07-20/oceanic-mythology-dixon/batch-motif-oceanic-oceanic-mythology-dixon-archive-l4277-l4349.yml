canonical_text:
  quote: ''
  summary: The passage summarizes a Mangaian tale in which Ina or Hina is entrusted
    with family ornaments, deceived by the thief Nanga, punished by her parents, and
    carried across the sea by fish and sharks to Tinirau, who takes her as wife. Her
    brother Rupe seeks her in bird form and reunites the family. The author then notes
    parallels for the bird-guise quest, shark transport, and coconut-on-shark incident.
    A second New Zealand tale begins with Mataora encountering underworld Turehu,
    marrying Nuvarahu, losing her after violence, and descending to Po to seek her;
    the passage notes the underworld-descent episode as comparable to Orpheus and
    as connected with the origin of tattooing.
  language: English
  quote_policy: summarized
