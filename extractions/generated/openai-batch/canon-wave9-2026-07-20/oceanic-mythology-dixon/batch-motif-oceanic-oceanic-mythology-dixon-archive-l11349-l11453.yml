canonical_text:
  quote: ''
  summary: The passage ends a Badabangisa episode in which a pursuing giant father
    is delayed, killed through a vulnerable life-point, and followed by Badabangisa’s
    burial attempt and kingship. It then narrates a widespread Indonesian wonder-tree
    tale about orphan sisters, a food-giving Kekeko bird, the bird’s killing by a
    jealous uncle, and a miraculous tree from its buried bones. The passage begins
    another Indonesian tale in which a white cat gives birth to a girl-child after
    being fed from a coconut shell, and the child and cat are later mistreated by
    a jealous stepmother.
  language: English
  quote_policy: summarized
