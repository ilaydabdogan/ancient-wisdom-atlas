canonical_text:
  quote: ''
  summary: 'The passage surveys origin-of-water and deluge myths: a fragmentary revival
    by blood and ascent to the sky; a western Victoria account of water concealed
    under a stone and released by birds; an east-coast account in which a frog disgorges
    swallowed water after an eel makes it laugh, causing a flood; a survivor episode
    involving a pelican rescuer, an escaped woman, and the origin of pelican colouring;
    and a bunyip flood in which people are transformed into black swans.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed male figure draws blood from his veins, sprinkles it over a woman,
    restores her to life, and both go up into the sky.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator states that one south-eastern continental tale about the origin
    of waters recalls a type widely spread in Melanesia.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the western Victoria account, water is hidden under a stone; birds discover
    the hiding place, remove the stone while the owner is absent, and the released
    water becomes a great lake.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the east-coast account, there is no water because a great frog has swallowed
    it all; people hold council and decide to make the frog laugh so that it will
    release the water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Several animals dance unsuccessfully before the frog; the eel’s wriggling
    makes the frog laugh, and water bursts from the frog’s mouth, causing a flood
    that drowns many.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The few flood survivors, described as two or three men and one woman, take
    refuge on a small island; a pelican arrives by canoe and carries the men to the
    mainland one by one.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The pelican leaves the woman until last because he wants her as a wife; she
    disguises a log in her skin rug as if it were her sleeping body and swims away
    to shore.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After discovering the decoy, the pelican becomes angry, partly paints himself
    with pipe-clay before going to fight those he had saved, is killed by another
    pelican, and this explains why pelicans are part black and part white.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In another deluge account, a fishing party catches a young bunyip; companions
    warn the catcher to release it because water monsters will be angry, but he refuses.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mother bunyip becomes enraged and causes lake waters to rise and follow
    the man who took her young, until the country is covered and people flee to a
    high hill.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the rising flood touches the people’s feet on the high hill, they are
    all transformed into black swans.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The caption describes the bunyip as a feared mythical animal living in deep
    pools or streams and attacking and eating men.
  category: attribute
  evidence_refs:
  - ev:8
