canonical_text:
  quote: ''
  summary: Two brothers pursue Inang-i-Bake by following a thread trail and reports
    from bystanders. They find their sister confined under Inang-i-Bake's house, rescue
    her, weaken the river bridge, kill and cook Ginabai, and leave a louse to answer
    for her. A bird exposes that Inang-i-Bake has eaten her child; Ginabai's brother
    discovers the deception, pursues the brothers, and drowns when the bridge breaks.
    The passage then begins another Moluccan version in which one woman drowns another,
    cooks flesh from the body, and tells the dead woman's children that she is cooking
    fish and eels.
  language: English
  quote_policy: summarized
