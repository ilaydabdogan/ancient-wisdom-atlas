canonical_text:
  quote: ''
  summary: The passage surveys Micronesian origin traditions. Ligoapup drinks water
    from a tree hollow, unknowingly swallows a tiny animal, and bears a girl; later
    descendants and a rib-derived man become ancestors of humanity. A Mortlok variant
    has children born from a woman’s arm and eyes. The passage compares these to origins
    from blood-blisters, boils, blood clots, rocks, stones, sparks, ashes, and divine
    making. It also recounts Ancient Spider making a winged being to learn people’s
    names, and a Pelew account in which Obagat wishes humanity to be immortal while
    the Rail favors breath, disease, and death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ligoapup is sent down to the earth; after drinking water collected in a tree
    hollow, she unknowingly swallows a tiny animal and bears a girl-child.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the same account, the girl-child matures, becomes mother of a daughter,
    and that daughter bears a boy; from a rib taken from the grown boy a man is derived,
    who marries Ligoapup and becomes ancestor of the human race.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author comments that the rib incident is probably derived from missionary
    teaching and incorporated into a native tale.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: In a Mortlok variant, Ligoapup drinks water from a tree hollow and bears a
    girl-child; from the girl’s arm is born a boy, from one eye another boy, and from
    the other eye a second girl; the human race descends from these children.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage compares several western Caroline, Marshall, and Nauru accounts
    in which living beings are born or burst forth from blood-blisters or boils on
    deities’ bodies.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that some Indonesian traditions give deities an origin
    or birth from a rock, and that a comparable Gilbert Group account says Na Rena
    or Rigi came out of a rock.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that in the Marshall Group, in the Ralick Chain, two deities
    are given origin from a clot of blood under the theme of Blood-Clot Child.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'In the Pelew Group, two original deities create the first human beings: the
    male god makes the first man, and the female divinity shapes the first woman.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the Gilbert Group, Nareua sets fire to a tree, and mankind originates from
    sparks and ashes carried in all directions.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: In Nauru, Ancient Spider turns stones into men, who become supporters of the
    heavens rather than ordinary human beings.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Ancient Spider, seeking to learn whether there are other beings, finds men
    and women sitting on a shore under trees; he makes a winged being from dirt under
    his finger-nail and sends it to learn their names.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The winged being settles on people, and each time another person calls out
    a name; after learning all the names, it returns and reports them to Ancient Spider.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage states that throughout Micronesia mankind is believed to have
    been originally immortal, or intended to be immortal, and to have become mortal
    through special causes.
  category: other
  evidence_refs:
  - ev:13
- id: obs:14
  text: In the Pelew Group, Obagat wants to put a stone in people’s breasts so they
    will be strong, lasting, and not need food; the Rail opposes this and recommends
    breath in the bosom, making people subject to disease and death.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Obagat sends his son to obtain the water of life to assure human immortality;
    the passage breaks off after saying the liquid was brought in a taro leaf.
  category: sequence
  evidence_refs:
  - ev:15
