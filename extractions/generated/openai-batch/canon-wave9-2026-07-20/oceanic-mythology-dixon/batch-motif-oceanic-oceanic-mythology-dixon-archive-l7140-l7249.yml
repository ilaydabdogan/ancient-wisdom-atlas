canonical_text:
  quote: ''
  summary: 'The passage includes a Plate XV caption describing a carved ceremonial
    mask from New Ireland with animal figures linked to clan or family myths. It then
    recounts Tagaro’s attempt to retrieve his sky-wife and child: he sends a bird
    to the sky-country, constructs an arrow-chain, climbs a banian-root to the sky,
    and falls when his wife cuts the root during the descent. The passage next introduces
    a New Britain version of an Isle of Women story in which a man follows an escaped
    pigeon over the sea to an island, is discovered by a woman through his reflection
    in a spring, is hidden and married, and later becomes husband to many women.'
  language: English
  quote_policy: summarized
