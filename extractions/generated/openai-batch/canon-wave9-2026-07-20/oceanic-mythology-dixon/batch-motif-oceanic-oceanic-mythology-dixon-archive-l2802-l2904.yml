canonical_text:
  quote: ''
  summary: The passage summarizes several Polynesian flood traditions from Hawaii,
    Raiatea, Mangaia, and Samoa, then comments on possible missionary influence in
    some other versions. It then introduces the Maui cycle, describing Maui as a demigod
    hero often portrayed as the clever youngest among brothers and noting comparison
    with Melanesian brother-hero myths.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Hawaiian account, Pele lives far to the south-west, is deserted by
    her husband, searches for him, receives the sea from her parents, pours the sea
    from her head, and the waters rise until only high mountain tops are visible before
    retiring.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Raiatea account, a fisherman’s hook becomes entangled in the hair of
    Rua-haku, a sea-god asleep at the bottom of the sea; Rua-haku is angered but spares
    the fisherman after he begs for mercy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Raiatea account, Rua-haku tells the fisherman to take refuge on an
    islet with a friend, a hog, a dog, and two hens; the sea rises until the world
    is overflowed, people perish, and the waters later retire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Mangaia account, Aokeu and Ake quarrel over power; Ake raises the sea
    in waves and Aokeu makes rain fall in floods, covering the island except for a
    small protruding piece of land.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Mangaia account, Rangi takes refuge on the remaining dry land, prays
    to Rongo, and Rongo forces the two contestants to stop, after which the deluge
    subsides.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In one Samoan version, a flood destroys all beings except Pili and his wife,
    who take refuge on a rock and later become ancestors of mankind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In another Samoan version, Seve and Pouniu survive by swimming; Tangaloa sees
    them from the sky, sends two men from the heavens with hooks, and Samoa is drawn
    from under the sea as their refuge.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author states that the flood tales just summarized are probably aboriginal,
    while certain New Zealand, Marquesan, and Hawaiian versions are treated as local
    adaptations of missionary teaching because of close Biblical parallels.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage introduces Maui as a demigod hero whose deeds and adventures are
    widely represented across Polynesian groups in many recorded variants.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Maui is generally described as one among brothers, often the youngest; in
    New Zealand especially the older Mauis are stupid or forgetful, while Maui is
    clever or mischievous.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage gives examples in which elder brothers use spears without barbs
    and eel-pots without trap-doors, while the youngest Maui invents the barb and
    trap-door and succeeds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The author states that the brother group and clever-versus-foolish sibling
    pattern is strongly developed in Melanesian myths, sometimes with a hero named
    Maui in the New Hebrides and vicinity.
  category: speech
  evidence_refs:
  - ev:9
