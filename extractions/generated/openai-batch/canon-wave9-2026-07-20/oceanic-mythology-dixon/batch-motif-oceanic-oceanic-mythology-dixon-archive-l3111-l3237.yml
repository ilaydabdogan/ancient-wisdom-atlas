canonical_text:
  quote: ''
  summary: 'The passage summarizes Polynesian versions of Maui''s fire-quest, especially
    New Zealand forms: Maui discovers his mother''s hidden descent to the world below,
    follows in bird form, seeks fire from the old woman Mafuike, repeatedly extinguishes
    fire concealed in her fingers and toes, and survives a world-threatening conflagration
    quenched by rain, snow, and hail. It then compares variant Polynesian and Melanesian
    fire-origin and underworld-entry motifs.'
  language: English
  quote_policy: summarized
