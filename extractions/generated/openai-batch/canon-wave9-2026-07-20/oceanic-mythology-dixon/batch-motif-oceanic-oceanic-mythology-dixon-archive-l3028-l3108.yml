canonical_text:
  quote: ''
  summary: 'The passage recounts Maui''s effort to slow the sun because days are too
    short. With ropes made by his mother and a magic club received from his blind
    grandmother after stealing her bananas, Maui nooses the sun as it rises from the
    underworld, ties it to trees, beats it, and releases it when it promises to travel
    more slowly. A New Zealand version has Maui and his brothers plait ropes, catch
    the sun, and beat it with a jaw-bone weapon so that it goes away crippled. The
    passage then notes comparative variants: many Polynesian versions lack the blind-grandmother
    episode; food theft from a blind person is associated with Tawhaki and appears
    in Polynesia, Melanesia, Micronesia, and Indonesia; Society Group and Samoan variants
    alter purpose or protagonist.'
  language: English
  quote_policy: summarized
