canonical_text:
  quote: ''
  summary: The passage compares Australian myths with those of other Pacific areas.
    It says southern and eastern Australia show the strongest resemblance to Melanesia,
    including swan-maiden and arrow-chain themes, animal stories, and cosmogonic tales
    about creation of the world and humankind. It notes little Australian trace of
    widespread Melanesian dualistic tales of wise and foolish brothers, except possible
    hints in Queensland and New South Wales stories of the two Brams. It contrasts
    central and northern Australia as relatively distinctive, especially in tales
    of totem ancestors, and says these regions resemble a Papuan type in lacking cosmogonic
    tales and in having localized group or class myths, though the resemblance is
    not strong. The passage also notes that absent knowledge of Tasmanian and western
    or south-western Australian beliefs makes relationships difficult to determine.
  language: English
  quote_policy: summarized
