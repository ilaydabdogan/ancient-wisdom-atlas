canonical_text:
  quote: ''
  summary: A father follows his absent daughter to the river, finds her on a tall
    niboeng palm with a cat, and tries to climb after her. The tree grows nearly to
    the moon; a golden ladder is lowered for the girl and cat, who enter the moon.
    No ladder is lowered for the father, who falls and dies. The passage then gives
    Dixon's summary remarks on Indonesian mythology, stressing the fragmentary evidence,
    scarcity of cosmogonic and human-origin tales, development of flood-legends, relative
    absence of trickster tales, and possible affinities or influence involving Mon-Hkmér,
    Melanesian, and Polynesian materials.
  language: English
  quote_policy: summarized
