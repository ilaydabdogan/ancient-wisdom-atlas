  quote: ''
  summary: The passage gives Maori versions of the separation of Heaven and Earth.
    Tane-mahuta separates Rangi and Papa, and another version has Raki ask Tane and
    his brothers to lift or kill him so that light and life may come. Tane, Paia,
    Rehua, and others help raise and prop Raki above Papa. Dew, mist, and ice are
    explained as signs of continued love and grief between the separated parents.
  language: English
  quote_policy: summarized
