canonical_text:
  quote: ''
  summary: The passage describes a Rarotongan carved staff probably representing Rongo
    and three sons; recounts a human-origin episode in which Hina meets Tii-maaraatai,
    recognizes him as her brother, becomes his wife, and bears Tii, called the first-born
    of mankind; then compares Oceanic origin myths, emphasizing confusion between
    human and divine figures. It also gives a New Zealand account in which an aquatic
    swamp plant engenders red clay from which the first man comes, accompanied by
    a poem of life emerging in gloom, and a Samoan account in which Tangaroa creates
    the world and humans arise or are made from worms or rotting vines.
  language: English
