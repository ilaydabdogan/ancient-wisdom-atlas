  summary: The passage is a secondary comparative discussion of Polynesian myth-incidents.
    It argues that Polynesian mythology is composed of incidents from multiple sources
    or strata, then compares Polynesian groups with Melanesian and Indonesian parallels.
    It distinguishes restricted local agreements from widespread Polynesian agreements,
    and infers varying degrees of Melanesian contact or origin for incidents in Hawaii,
    Samoa, New Zealand, the Society Group, and the Cook Group.
