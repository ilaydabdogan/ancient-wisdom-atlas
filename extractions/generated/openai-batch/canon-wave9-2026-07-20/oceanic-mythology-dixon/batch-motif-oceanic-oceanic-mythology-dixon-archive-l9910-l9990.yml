canonical_text:
  quote: ''
  summary: 'The passage finishes a trickster tale in which a man is successively blinded
    by an egg, stung by an ant, slips on dung while descending a ladder, is bitten
    by a snake, and dies. It then gives a comparative discussion of two groups of
    Indonesian trickster tales: mouse-deer tales, associated especially with Java,
    Borneo, Sumatra, India, and Indian-influenced regions; and ape or tortoise tales,
    associated especially with eastern and northern Indonesia, the Philippines, Melanesia,
    and at least one Polynesian theme. The author proposes Indian origin for some
    mouse-deer tales, local Indonesian growth for others, and mostly local origin
    for the ape/tortoise group.'
