canonical_text:
  quote: ''
  summary: The passage summarizes Oceanic and Indonesian accounts of the origins of
    the sun, moon, and stars; gives multiple versions of the widespread theme in which
    heaven or the low sky is raised away from the earth; and begins a discussion of
    Indonesian and Philippine deluge myths, including the opening of an Ifugao Kiangan
    story about Kabigat leaving the sky-region to hunt on the level earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several accounts are given for the origin of the sun and moon.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In a Kayan account, the moon is said to be one descendant of an armless and
    legless being sprung from a sword-handle and spindle that fell from heaven.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In a Celebes account, the sun, moon, and stars are made from the body of a
    celestial maiden.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In a Nias account, the sun and moon are shaped from the eyes of an armless
    and legless being; from that being's heart grows a tree whose buds originate men
    and gods.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage identifies a widespread theme in which heaven and earth are separated,
    the heavens are raised, or a formerly low sky is lifted by a deity or demigod.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In an Ifugao account, the sky is once very near the earth, interferes with
    spear use, and has cannibalistic propensities that are exterminating mankind;
    after divine aid is invoked, a god who had remained sitting rises and pushes the
    heavens far above with his head and shoulders.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In a Tagalog account, the sky is once low enough to touch; people strike their
    heads against it while playing, throw stones at it in anger, and a deity withdraws
    it to its present position.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In a Manobo account, the sky is so close to earth that a woman strikes it
    with her pestle while pounding rice, after which the heavens ascend to a great
    height; a similar tale is known to the Bagobo.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In north-west Borneo, the raising of the sky is attributed to the daughter
    of the first man; among the Dusun, the low sky retreats when six of seven original
    suns are killed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that deluge myths are fairly well developed in Indonesia
    and that Philippine origin legends often begin with such a tale.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the opening of the Ifugao Kiangan deluge story, Kabigat, first son of Wigan,
    goes from the sky-region Hudog to the Earth World to hunt with dogs on an entirely
    level earth.
  category: action
  evidence_refs:
  - ev:7
