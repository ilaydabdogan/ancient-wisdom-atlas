canonical_text:
  quote: ''
  summary: 'The passage first notes uncertainty in comparing Melanesian Tagaro and
    Polynesian Tangaroa. It then introduces a miscellaneous Melanesian tale-type involving
    cannibals and monsters and begins a Sulka story from New Britain: a cannibal couple
    have eaten many people, the villagers flee by canoe, and the pregnant woman Tamus
    is refused passage, beaten away, and left in the deserted village. She later gives
    birth to a son, warns him to stay silent so the cannibals will not hear him, and
    one day leaves him a dracaena plant. The boy turns the plant into another boy,
    Pupal, and begins to hide Pupal from his mother.'
  language: English
  quote_policy: summarized
