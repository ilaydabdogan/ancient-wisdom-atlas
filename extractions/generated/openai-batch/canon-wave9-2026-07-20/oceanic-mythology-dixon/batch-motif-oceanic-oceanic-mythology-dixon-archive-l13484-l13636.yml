canonical_text:
  quote: ''
  summary: The passage summarizes Australian tales and variants. In a South Australian
    story, Wyungare is desired by Nepelle's two wives, takes them as wives, is pursued
    by a fire set by Nepelle, escapes with them into swamp mud, and ascends to the
    sky by a spear and cord, after which the group is visible as stars. A northern
    New South Wales variant uses a chain of spears for sky ascent, and the passage
    compares this to Melanesian arrow-chain ascent. The passage then discusses two
    Australian winged-girl tales as incomplete swan-maiden-like episodes, including
    an unnamed hunter with bathing winged girls and the beginning of a Wurruna tale
    with seven girls from a distant land.
  language: English
  quote_policy: summarized
