comparison_claims:
- id: claim:1
  claim: The passage compares the marked cannibalism in this episode and New Zealand
    myth with a broader Melanesian and Indonesian pattern of cannibals, often tree-associated
    and possibly linked to vampire spirits.
  claim_level: same_motif
  target: Melanesian and Indonesian tree-associated cannibal or vampire-spirit pattern
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The source itself says cannibals are generally not prominent in Polynesian
    mythology and qualifies the vampire-spirit link as possible.
- id: claim:2
  claim: The passage cautiously connects the sky-maiden's descent, marriage to a mortal,
    and return upward with the swan-maiden tale known from the New Hebrides, western
    Dutch New Guinea, and Indonesia.
  claim_level: same_motif
  target: Swan-maiden tale in nearby Melanesian and Indonesian traditions
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs:
  - ev:6
  confidence: medium
  limitations: The author explicitly states that the episode lacks some characteristic
    swan-maiden elements, so the connection is suggestive rather than complete.
- id: claim:3
  claim: The passage notes a name correspondence in which Hema and the two children
    occur with the same names in Hawaii and Tahiti.
  claim_level: linguistic_similarity
  target: Hawaiian and Tahitian names corresponding to Hema and related children in
    the Tawhaki cycle
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The excerpt mentions names but does not provide the full parallel narratives.
- id: claim:4
  claim: The passage says the attempted murder of Tawhaki occurs in the Cook and Society
    Groups in somewhat different forms and is absent from Hawaii.
  claim_level: same_motif
  target: Cook and Society Islands versions of Tawhaki attempted-murder episode
  evidence_refs:
  - ev:8
  counter_evidence_refs:
  - ev:8
  confidence: medium
  limitations: No details of the Cook or Society forms are supplied in this excerpt,
    and Hawaii is explicitly noted as lacking the episode.
- id: claim:5
  claim: The passage treats the Tahitian Tafa'i account as a variant or replacement
    within the Tawhaki-related cycle, replacing the mother-search/rescue material
    with a monster-slaying expedition involving a charm, magic shark, lethal kava-plant,
    and monsters.
  claim_level: same_motif
  target: Tahitian Tafa'i form of the Tawhaki cycle
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  counter_evidence_refs:
  - ev:9
  confidence: medium
  limitations: The source states that the Tahitian episode is lacking in New Zealand
    and elsewhere; the comparison is within a named cycle but not a one-to-one episode
    match.
