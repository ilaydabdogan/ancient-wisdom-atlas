canonical_text:
  quote: ''
  summary: A cannibal woman pursues Tuture but is destroyed by red-hot stones, revives
    as Nona/Rona, kills a cave-hidden survivor, pursues her daughter, and is finally
    killed by an old protector. Dixon then compares the tale's cannibal and sky-maiden
    elements with Polynesian, Melanesian, Indonesian, and Tahitian parallels, including
    a Tafa'i/Tawhaki episode involving a magic shark, a man-killing kava-plant, monsters,
    and magically altered trees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman finds vessels empty, discovers a trick after attempts to bring water,
    and sets out after Tuture to kill him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tuture flees in a canoe; the pursuing woman is about to swallow him and the
    canoe when he throws red-hot stones into her mouth and destroys her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The destroyed woman's body drifts ashore, comes to life again, takes the name
    Nona/Rona, and continues cannibalistic practices.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nona/Rona has a daughter whose lover is one of the last survivors of the people
    eaten by Nona/Rona.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The lover hides in a cave that opens at a magic word; Nona/Rona discovers
    the secret, repeats the charm, enters the cave, and kills and eats him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nona/Rona intends to devour her daughter, but the daughter places a log in
    her bed, flees, and asks an old man for protection.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old man protects the daughter, kills Nona/Rona, marries the daughter,
    and one of their children is Hema, father of Tawhaki.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The commentary states that cannibalism is strongly marked in this episode
    and the New Zealand myth, while cannibals are said to be less prominent in Polynesian
    mythology generally and more frequent in Melanesia and Indonesia.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: The commentary describes Melanesian and Indonesian cannibals as commonly living
    in or perching on trees and as possibly associated with or derived from vampire
    spirits.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: The commentary identifies a sky-maiden who descends to earth, becomes a mortal's
    wife, and later returns to the upper world; it says this suggests but does not
    fully match the swan-maiden episode.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The commentary says the swan-maiden tale occurs in characteristic form in
    the New Hebrides, is noted also at the western end of Dutch New Guinea, and is
    almost universal in Indonesia.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: The commentary says the remainder up to Tawhaki's search for his father is
    not told outside New Zealand, although Hema and two children occur with the same
    names in Hawaii and Tahiti.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: A Tahitian form is described in which Arihi and companions go to slay evil
    man-killing monsters, while Tafa'i wants to accompany them, is refused, and outwits
    them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Tafa'i obtains a powerful charm, rides over the sea on a great shark, reaches
    the destination first, and surprises Arihi and the others.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Tafa'i destroys a magic kava-plant that stabs and kills approaching people,
    then also disposes of a man-killing monster and returns home on the magic shark.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: After returning, Tafa'i induces all but Arihi to climb into trees, which he
    magically causes to grow tall and bend over; the passage ends before the outcome
    is given.
  category: action
  evidence_refs:
  - ev:12
