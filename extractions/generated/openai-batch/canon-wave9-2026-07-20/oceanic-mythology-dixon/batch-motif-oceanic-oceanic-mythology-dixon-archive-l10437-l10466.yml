  quote: ''
  summary: 'A younger brother called Half-Child returns changed by a deity. His elder
    brother tries to obtain the same benefit, is instructed by the deity to bathe
    in a pool only under a specified condition, and is transformed into a dog with
    a white mark around its throat. The passage then introduces a Dusun story from
    British North Borneo as an example of tales involving grateful animals and impossible
    tasks: Serungal, an ugly man wishing to marry a rajah’s daughter, intervenes when
    men are killing an ant.'
