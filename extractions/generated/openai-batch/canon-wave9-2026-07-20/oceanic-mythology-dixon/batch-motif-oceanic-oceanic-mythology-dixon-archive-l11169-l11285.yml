canonical_text:
  quote: ''
  summary: 'A Philippine tale summarized in English: Aponibolinayen conceals a craving
    for bolnay fruit, Ligi discovers the truth by taking ant form, gathers fruit,
    learns a disputed parentage claim, and buries the pregnant Aponibolinayen at the
    tree. With guidance from her spirit helper Ayo, she gives birth to Kanag from
    a finger wound. Kanag grows rapidly, leaves the pit, becomes a warrior with Dagolayan,
    plants a vine to signal his death, is later beheaded by Ligi, and Aponibolinayen
    prepares magic to make him stand again.'
  language: English
  quote_policy: summarized
