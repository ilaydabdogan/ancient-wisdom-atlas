  summary: 'The passage describes a plate of a New Zealand wooden figure and then
    surveys variants of Maui-cycle myths: Maui obtains fire from a fire deity or birds,
    fire may come from the body of its owner, conflicts with a fire-god occur in several
    traditions, rain extinguishes a world-threatening conflagration, a Hawaiian tale
    explains how Maui learns fire-making from mud-hens and why they have red heads,
    and Maui raises the formerly low heavens after receiving water from a woman’s
    gourd.'
