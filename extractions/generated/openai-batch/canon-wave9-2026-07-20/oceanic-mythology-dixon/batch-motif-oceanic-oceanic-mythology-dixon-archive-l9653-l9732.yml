canonical_text:
  quote: "“In several of the tales the trickster plays the part of a judge”"
  summary: 'The passage recounts several trickster episodes: a trickster cooks and
    eats an ape after inducing him into a vessel; an ape-trickster is trapped in a
    coffin by villagers and burned; and a crocodile rescued by a buffalo tries to
    eat him, leading to failed appeals to discarded objects and a successful judgment-by-reenactment
    arranged by the mouse-deer trickster and a deer.'
  language: English
