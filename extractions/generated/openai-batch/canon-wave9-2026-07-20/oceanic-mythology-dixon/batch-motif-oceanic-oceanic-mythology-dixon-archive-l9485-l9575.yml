canonical_text:
  quote: ''
  summary: 'A secondary comparative passage recounts several animal trickster tales:
    an ape deceives a heron during mutual lousing, is later punished by another heron
    at sea, deceives a shark rescuer and causes its death, exploits a tortoise over
    bananas and is killed by a bamboo-spike trap, and loses a hand when induced to
    reach into a monster clam. The source also notes distributions of several episodes
    across parts of Asia and Oceania.'
  language: English
  quote_policy: summarized
