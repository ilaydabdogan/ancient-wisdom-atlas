canonical_text:
  quote: ''
  summary: The passage summarizes a Rarotongan tale about an underworld man and woman
    emerging from a spring at the full moon to steal garden food; the woman is caught,
    marries a chief, requests an underworld childbirth procedure involving cutting
    open her body, but is saved when her husband refuses and the child is born normally.
    The passage notes similar versions from Niue, Rotuma, the Santa Cruz Group, and
    Micronesia. It then recounts part of a Maori story in which Tama-nui-a-rangi’s
    wife Ruku-tia is carried off by Tu-te-koro-punga; Tama transforms into a crane,
    obtains permanent moko from his ancestors, disguises himself, reveals himself
    to Ruku-tia, and instructs her to signal at dawn for his canoe.
  language: English
  quote_policy: summarized
