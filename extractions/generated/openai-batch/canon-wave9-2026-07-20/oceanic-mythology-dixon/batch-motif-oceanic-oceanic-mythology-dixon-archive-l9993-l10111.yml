  summary: 'The passage first gives a secondary comparative note on tale distributions
    and possible historical routes. It then introduces the swan-maiden theme and summarizes
    Indonesian variants: Toradja crab-maidens whose garments are stolen by men; a
    Toradja parakeet-maiden tale involving Magoenggoelota and Kapapitoe; and a Halmahera
    tale in which a youngest son steals a maiden''s garments, marries her, ascends
    with her in a flying palace, obtains medicine from the lord of heaven, cures his
    father, and sees his brothers transformed into dogs.'
  language: English
  quote_policy: summarized
