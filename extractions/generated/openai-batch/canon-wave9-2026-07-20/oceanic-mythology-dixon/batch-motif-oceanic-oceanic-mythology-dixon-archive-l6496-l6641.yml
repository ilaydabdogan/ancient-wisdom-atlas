canonical_text:
  quote: ''
  summary: 'The passage includes a Plate XIV caption describing a New Hebrides mask
    partly made from a human skull and connected with religious ceremonials and an
    ancestral cult. It then narrates episodes involving Qat, Marawa, Qat''s brothers,
    and Ro Lei: Qat shrinks and hides beneath a chip to catch the old man undoing
    his canoe work; Marawa is revealed in disguise, is spared, and completes the canoe;
    Qat sinks his brothers'' canoes by raising his hand; and Qat survives his brothers''
    attempt to crush him in a land-crab hole and returns to Ro Lei with Marawa''s
    aid. The passage then compares related culture-hero patterns in New Hebrides and
    nearby islands: Tagaro is opposed by Suqe-matua in making good or bad things and
    in creation details; Tagaro is said to have sons including Tagaro-Mbiti; and Tagaro
    tricks Meragbuto into anointing himself with fowl excrement instead of coconut
    oil.'
  language: English
  quote_policy: summarized
