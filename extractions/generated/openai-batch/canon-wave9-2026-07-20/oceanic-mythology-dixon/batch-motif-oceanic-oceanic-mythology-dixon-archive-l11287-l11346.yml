canonical_text:
  quote: ''
  summary: The passage concludes an episode in which Aponibolinayen restores Kanag
    to life, escapes Ligi through magical concealment and a thorn-filled trail, and
    later reconciles with him. It then introduces the comparative theme of the “magic
    flight” as rare in Oceanic tales and begins a Halmahera example involving Badabangisa,
    a giant, rescued captives, stolen treasure, burning, pursuit, and magical obstacles
    made from salt, ashes, and jungle marbles.
  language: English
  quote_policy: summarized
