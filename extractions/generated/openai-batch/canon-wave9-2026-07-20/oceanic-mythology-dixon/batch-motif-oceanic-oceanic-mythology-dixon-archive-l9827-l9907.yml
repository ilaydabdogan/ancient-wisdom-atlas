canonical_text:
  quote: ''
  summary: 'The excerpt gives the end of a trickster tale in which a hero burns an
    oppressive king and companions who expect to go to the sky, then directs the people
    to divide the king’s treasure. It then recounts Taba’s deception: he pretends
    illness, impersonates a spirit in a waringin-tree, and thereby obtains marriage
    to the king’s daughter. The passage also presents an animal fable explaining hostility
    between cats and mice through a chain of shifted blame, and begins another fable
    in which an egg, snake, centipede, ant, and dung set out on a head-hunting expedition
    and hide around a target house.'
  language: English
  quote_policy: summarized
