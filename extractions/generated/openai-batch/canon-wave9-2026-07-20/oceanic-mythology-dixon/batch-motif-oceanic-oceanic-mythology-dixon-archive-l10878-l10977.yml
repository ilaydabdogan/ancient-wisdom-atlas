canonical_text:
  quote: ''
  summary: The passage continues a tale in which Kokamomako seeks her hidden elder
    sister Sunrise, is deceived with cat parts, receives help from a rice-bird in
    gathering scattered rice, then burns her house and dies. Sunrise kills herself,
    appears as a ghost with her younger sister in a tree over a stream, and later
    cuts a copper wire so that her husband falls to pieces. The passage then introduces
    cannibal or ogress tales as widespread in Polynesian, Melanesian, and Indonesian
    areas, beginning an example in which the ogress Bake emerges from split ground,
    carries off a princess, and the princess marks the path with thread.
  language: English
  quote_policy: summarized
