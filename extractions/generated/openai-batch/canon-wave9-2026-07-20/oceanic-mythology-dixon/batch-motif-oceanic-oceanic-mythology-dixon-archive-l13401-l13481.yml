canonical_text:
  quote: ''
  summary: 'The passage summarizes Australian animal tales explaining present animal
    traits: turtle and snake exchange head and fangs; Ouyan the curlew gains red skinny
    legs after cutting flesh from his own legs and being punished; crow becomes black
    and crane gains its cry through a quarrel over fish. The author then comments
    that this type of animal-origin tale is especially abundant in southern and eastern
    Australia, while central and northern materials more often assume animals always
    had their present traits.'
  language: English
  quote_policy: summarized
