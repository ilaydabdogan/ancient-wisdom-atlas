canonical_text:
  quote: ''
  summary: The passage gives a plate caption for a Marquesas club with symbolic head
    and face decoration, then summarizes several Oceanic cosmogonic traditions. In
    one account, Tanaoa/Darkness and Mutuhei/Silence rule in the primeval Po until
    Atea/Light and Ono/Sound emerge and overcome them; Atanua/Dawn arises, marries
    Atea, and deities and the heavens and earth are produced. The passage then compares
    primeval creator figures including Maori Io and Society Islands Taaroa. Taaroa
    is described as self-existing, alone before earth, sky, sea, or humankind, becoming
    the universe and establishing foundations, land, and heavens. A second Society
    Islands version says Taaroa embraces a foundational rock that brings forth earth
    and sea, then directs his son Rai-tubu/Sky-producer to empower the heavens, earth,
    and abyss to generate celestial, terrestrial, and oceanic beings and features.
  language: English
  quote_policy: summarized
