canonical_text:
  quote: ''
  summary: 'The passage recounts boys who set a banana-tree tabu as an outcome sign,
    ambush and kill the cannibal Taso with heated stones and clubs, kill his mother,
    and burn the house. It then introduces cannibals as feared but often stupid and
    easily deceived, giving a tale of four brothers and an old cannibal: the elder
    brothers use buried fish to simulate answering brothers, while the youngest, after
    failing that trick, induces the ogre to destroy his own household and maim himself
    before killing him. The passage closes by introducing a further cannibal story
    said by the narrator to agree with certain Indonesian tales.'
  language: English
  quote_policy: summarized
