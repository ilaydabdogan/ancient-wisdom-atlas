canonical_text:
  quote: ''
  summary: 'The passage summarizes Polynesian variants of the raising of the sky,
    contrasting versions attributed to Maui, Tangaloa''s command, Ru, or Maui aided
    by Ru. It then introduces Maui-cycle episodes: a Hawaiian fire-quest and a New
    Zealand tale in which Maui seeks immortality for humankind, receives warnings
    from his father about Hine-nui-te-po, recalls his earlier subduing of Tama-nui-te-Ra,
    and gathers bird companions for the enterprise.'
  language: English
  quote_policy: summarized
