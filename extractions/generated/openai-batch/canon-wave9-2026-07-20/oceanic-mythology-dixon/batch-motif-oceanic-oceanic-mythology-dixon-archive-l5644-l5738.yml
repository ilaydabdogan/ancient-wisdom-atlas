canonical_text:
  quote: ''
  summary: The passage includes a plate caption describing a New Ireland ceremonial
    board with bird and fish figures associated with guardian spirits or clan totems.
    It then introduces Melanesian myths of origins and the deluge, noting a general
    scarcity of world-origin myths, summarizing primeval-sea traditions from the Admiralty
    Islands, New Britain, and the southern New Hebrides, and outlining three types
    of mankind-origin myths. Specific accounts include a serpent causing a reef to
    rise, a man and woman floating on driftwood until land appears, culture-hero brothers
    fishing up land, Manuai making a wife from wood, Qat animating wooden human figures,
    and Marawa’s failed imitation producing death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A carved and painted board from New Ireland bears figures of a bird and fish;
    the caption says these figures refer to guardian spirits or clan totems and that
    such boards decorated mask-houses where sacred masks were kept and ceremonies
    held.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Melanesian mythology is characterized by an almost
    total lack of myths about the origin of the world and that the earth is usually
    regarded as having always existed in much the same form.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: In one Admiralty Islands account, there was initially only a widespread sea,
    in which a great serpent swam and called for a reef to rise; the reef rose from
    the ocean and became dry land.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Another Admiralty Islands version describes a man and woman floating on the
    primeval sea, climbing onto driftwood, seeing the waters wholly retire, and then
    planting trees and creating foods on barren land.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Among coastal tribes of the Gazelle Peninsula in New Britain, land is said
    to have been fished from the bottom of the sea by the culture-hero brothers To-Kabinana
    and To-Karvuvu; the passage says the same story occurs in slightly greater detail
    in the southern New Hebrides.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says the primeval-sea conception is widely found in central Polynesia,
    Micronesia, and Indonesia, and notes that in Melanesia it apparently occurs only
    on the northern margin where contact with non-Melanesian peoples would theoretically
    be expected.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'The passage classifies Melanesian origin-of-mankind myths into three types:
    direct creation by a deity or pre-existing being, spontaneous or magical emergence,
    and descent from sky-land.'
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: In an Admiralty Islands account, Manuai, being alone and longing for a wife,
    cuts down a tree, fashions its trunk into a woman, commands the wood to become
    a woman, and the image comes to life.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In a Banks Islands account, Qat makes three men and three women from dracaena
    wood, hides them for three days, brings them out, dances and drums before them
    until they move and stand, and then divides them into three married pairs.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Marawa sees Qat’s creation, makes wooden images in imitation, animates them,
    then buries them in a pit covered with coconut fronds for seven days; when dug
    up, they are lifeless and decomposed, which the passage identifies as the origin
    of death among men.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: A second Banks Islands version, as far as the supplied passage continues,
    says Qat made the first man from red clay and created the first woman from rods
    and rings; the sentence is incomplete in the supplied passage.
  category: other
  evidence_refs:
  - ev:11
