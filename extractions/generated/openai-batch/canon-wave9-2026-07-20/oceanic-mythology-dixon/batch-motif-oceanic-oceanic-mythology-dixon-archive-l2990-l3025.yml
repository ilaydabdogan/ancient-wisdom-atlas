canonical_text:
  quote: ''
  summary: The passage recounts Maui's deceptive fishing behavior toward his brothers,
    then describes his use of a magic fish-hook baited with a bird sacred to Hine
    to catch a vast fish as land emerges from the sea. After a brother violates Maui's
    warning not to look back, the line and land break, producing a group of islands
    rather than one landmass. The passage then summarizes regional variants attributing
    similar feats to Tangaroa or other divine figures, including a Samoan variant
    in which Tangaroa casts a rock from the sky for his snipe daughter in the world
    of waters. It closes by introducing a Hawaiian version of Maui's snaring of the
    sun.
  language: English
  quote_policy: summarized
