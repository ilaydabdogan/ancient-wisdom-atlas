canonical_text:
  quote: ''
  summary: The passage recounts Dudugera’s unusual birth after contact with a fish,
    his removal by the great fish, his ascent to become the sun and threaten destruction
    by heat, and his mother’s action to reduce the sun’s heat. It then summarizes
    Melanesian myths in which continuous daylight precedes the acquisition of night
    by Qat, who obtains night from Night and teaches sleep and dawn. Finally, it introduces
    Melanesian fire-origin myths, including a Motu account in which several animals
    fail to cross the sea for fire before a dog brings back a burning brand from an
    island.
  language: English
  quote_policy: summarized
