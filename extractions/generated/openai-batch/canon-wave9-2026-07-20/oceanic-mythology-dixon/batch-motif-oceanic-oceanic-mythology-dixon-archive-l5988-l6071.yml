comparison_claims:
- id: claim:1
  claim: The passage supports identifying a recurring Melanesian pattern in which
    an original absence of night is remedied when night is discovered, bought, or
    brought to people.
  claim_level: same_motif
  target: Melanesian origin-of-night / acquisition-of-night pattern
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives detailed material mainly for Banks Islands and related
    variants and does not list all Melanesian examples.
- id: claim:2
  claim: 'The Vava and edge-of-sky accounts of Qat obtaining night have the same narrative
    function: Qat acquires night from personified Night and introduces sleep and dawn.'
  claim_level: same_function
  target: Variant Qat accounts of buying night from Night
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The variants differ in location and in the specific details of instruction
    from Night.
- id: claim:3
  claim: The passage frames origin-of-fire narratives as a Melanesian mythic type
    and presents the Motu dog-fire-bringer episode as one example.
  claim_level: same_motif
  target: Melanesian origin-of-fire myth types
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
