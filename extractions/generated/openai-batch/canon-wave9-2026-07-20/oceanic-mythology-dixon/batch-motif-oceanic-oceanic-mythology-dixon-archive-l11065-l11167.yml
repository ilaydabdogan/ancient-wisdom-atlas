canonical_text:
  quote: ''
  summary: The passage recounts two cannibal-related tales. In the first, a brother
    and sister discover that a wicked woman has cooked their mother, flee, are helped
    across a crocodile river by a bird, ignore later path advice, encounter the ogre
    Kine-kine-boro, escape by canoe, and survive when the ogre and his wife die during
    pursuit. In the second, a swangi or secret vampire takes a youth to a house with
    a sick child, removes and eats the child’s liver, and is later killed by the youth
    with a falling rice-mortar.
  language: English
  quote_policy: summarized
