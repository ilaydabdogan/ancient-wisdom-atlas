canonical_text:
  quote: ''
  summary: A sequence of mouse-deer trickster tales is summarized. The mouse-deer
    traps a giant or demon with rattan rings and leaves him for fishermen to kill;
    escapes a pit by deceiving an elephant with a claim that the sky will fall; crosses
    a flooded river by tricking crocodiles into forming a line; escapes a crocodile’s
    bite by substituting a branch for his leg; and exposes a crocodile pretending
    to be a log. The passage also notes parallel giant-binding themes in German New
    Guinea and Melanesia.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A giant or demon comes through the forest toward the fish, sees the mouse-deer
    working, and asks what he is doing; the mouse-deer says he is preparing a remedy
    for back pain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mouse-deer tells the giant to lie down in a constrained posture, then
    slips strong rattan rings over the giant’s arms, legs, and body and fastens them
    to posts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fishermen return, find the giant captive beside the mouse-deer, attack
    the trapped monster, and beat him to death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage explicitly notes that an almost identical tale is found in German
    New Guinea and that binding or tying a giant by ruse or in sleep also appears
    elsewhere in Melanesia.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The trickster falls into a deep pit, cannot climb out, tells an elephant that
    the sky is going to fall, and escapes by jumping from the elephant’s back after
    the elephant descends into the pit.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: To cross a flooded river, the mouse-deer summons crocodiles under the pretext
    of counting them for the king, has them form a row from bank to bank, and jumps
    across them to the opposite bank.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When a crocodile seizes one of the mouse-deer’s legs, the mouse-deer presents
    a branch as if it were the leg; the crocodile lets go and snaps at the branch,
    allowing the mouse-deer to escape.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A crocodile later lies in wait like a water-soaked log; the mouse-deer tests
    it verbally, and the crocodile’s movement upstream reveals it is not a log.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
