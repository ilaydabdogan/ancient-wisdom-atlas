    two clay males by breath; Pallyan finds the first women in muddy water; Atnatu
    casts sky-children to earth as ancestors; Pundjel disperses people by cutting
    them into pieces that become humans again; and a south-eastern sun-origin myth
    begins with an emu egg thrown into the sky.'
