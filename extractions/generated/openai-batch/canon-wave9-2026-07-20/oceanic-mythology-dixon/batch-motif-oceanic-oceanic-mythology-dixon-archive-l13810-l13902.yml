  summary: The passage concludes one cannibal tale in which a boy escapes a cave ambush
    and kills two cannibals with smoke; after death they become visible as stars.
    It then recounts another cannibal tale in which sons investigate disappearances,
    avoid an old man's hollow-log trap containing a two-headed snake, kill the snake
    and the old man, discover bones, and drown a cannibal woman who lures men from
    a tree beside a lake. The passage ends with a comparative summary of Australian
    mythological regions, contrasting central/northern traditions with southern/eastern
    ones.
