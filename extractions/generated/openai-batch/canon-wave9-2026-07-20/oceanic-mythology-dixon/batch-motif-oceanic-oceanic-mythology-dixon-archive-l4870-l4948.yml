canonical_text:
  quote: ''
  summary: The passage recounts Tu-huru-huru’s instructed journey in disguise to find
    his mother, his recognition by Hine-te-iwa-iwa, and his return for a baptismal
    ceremony. It then tells how Kae borrows Tinirau’s pet whale, kills it, is detected
    by Tinirau’s wife and women through his broken tooth, abducted by a sleep charm,
    and killed by steam from hidden hot stones. The final section begins the Maori
    story of Houmea, who deceives her husband Uta by eating his fish catch and fabricating
    signs of supernatural thieves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tinirau instructs Tu-huru-huru to blacken himself with soot, act like a slave,
    pour water on Rupe’s nose if asked, and repeat a chant if his mother dances.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tu-huru-huru is taken to Rupe’s house as a slave, carries out the instructions,
    is struck by Rupe and by his mother, and repeats a lament naming Rupe, Hine-te-iwa-iwa,
    and Tinirau as kin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hine-te-iwa-iwa hears the lament, realizes she has beaten her own son, rejoices,
    and returns with Rupe and Tu-huru-huru to Tinirau, where Kae baptizes the boy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kae borrows Tinirau’s pet whale, disregards the treatment instructions, runs
    it onto the beach, kills and cuts it up, and cooks its flesh with others; the
    south wind carries the smell to Tinirau.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tinirau sends his wife and women to find Kae by making people laugh with comic
    songs and dances so that Kae’s broken tooth will be visible.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The women use a charm to put the occupants of Kae’s house into deep sleep,
    seize Kae, carry him by canoe to Tinirau’s home, and place him in a position resembling
    his own bed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tinirau wakes Kae, offers him food, has him sit on leaves and ferns over a
    heated area, and the women pour water so that steam from hot stones scalds Kae
    to death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Houmea eats all the fish caught by Uta, scatters grass, tramples bushes, makes
    large and small tracks in sand, and claims that supernatural thieves stole the
    fish.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: On the next day Uta again goes fishing; Houmea again fails to come when called
    and gives the same excuse, while Uta begins to secretly send the children as the
    excerpt breaks off.
  category: sequence
  evidence_refs:
  - ev:9
