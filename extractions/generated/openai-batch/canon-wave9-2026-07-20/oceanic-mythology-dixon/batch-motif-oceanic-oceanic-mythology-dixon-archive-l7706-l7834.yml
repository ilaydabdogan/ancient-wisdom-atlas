canonical_text:
  quote: ''
  summary: 'The passage summarizes several Indonesian and Oceanic origin myths: a
    Kei Islands tale of sky-world siblings whose dispute over a lost fish-hook leads
    to discovery and settlement of the lower world; a Minahassa tale of a boy born
    from a foam egg and a girl born from a rock who become parents of mankind; a Minahassa
    variant in which Lumimu-ut is born from a rock, creates the world with earth and
    seeds from an original land, is impregnated by the west wind, and later unknowingly
    marries her son, producing gods; and the beginning of a Kayan outline involving
    primeval sea, sky, a rock fallen from heaven, slime, and worms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Kei Islands tale, three brothers and two sisters live in the upper
    sky-world; Parpara, the youngest brother, loses a fish-hook borrowed from Hian,
    his oldest brother.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A fish helps Parpara search for the hook and discovers another fish that is
    ill because the hook is stuck in its throat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Parpara secretly places a bamboo vessel of palm liquor above Hian’s bed; after
    Hian spills it, Parpara demands that the liquor be returned.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hian tries to gather up the spilled liquor and digs so deeply that he makes
    an opening through the sky-world.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The brothers lower a dog through the opening on a rope; when it is drawn back,
    white sand is found sticking to its feet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Three brothers, one sister, and four dogs descend by rope to the lower world;
    the other inhabitants of the sky-world refuse to go.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A second sister begins to descend but is ashamed when one brother looks up;
    she shakes the rope and is hauled back by the sky-people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The three brothers and one sister who descended are described as the first
    occupants of the world and ancestors of the human race.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In a Minahassa tale, wind over the sea raises waves; spume beaten onto the
    shore forms a mass of foam in the shape of an egg.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The sun shines on the foam egg, from which a boy is born; the boy grows miraculously.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The boy finds a girl sitting on a rock from which she has just been born,
    takes her as wife, and becomes parent of mankind.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: In a Minahassa variant, the beginning contains only the sea and a great rock
    washed by waves; the rock first gives birth to a crane and then produces the female
    deity Lumimu-ut from sweat.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Advised by the crane, Lumimu-ut obtains two handfuls of earth from the original
    land, spreads it on the rock, creates the world, and plants seeds of all plants
    and trees.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Lumimu-ut ascends a mountain, where the west wind makes her fruitful; she
    later bears a son.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: Lumimu-ut gives her son a staff equal to her own height and tells him to seek
    a woman shorter than the staff as his destined wife.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:16
  text: Mother and son travel around the world, meet again without recognizing each
    other, and the staff is then taller than Lumimu-ut because it has increased in
