candidate_motifs:
- id: motif:1
  label: Lost object recovered from a fish
  taxonomy_refs: []
  basis: Parpara’s borrowed fish-hook is lost and later recovered from the throat
    of an ill fish after help from another fish.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents this as part of a larger origin tale rather than
    as an independent quest cycle.
- id: motif:2
  label: Animal helper in object recovery
  taxonomy_refs: []
  basis: A fish asks Parpara what is wrong, promises aid, and helps locate the lost
    hook.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: Only one helper episode is summarized.
- id: motif:3
  label: Trickster-like retaliation opens a world boundary
  taxonomy_refs:
  - trickster_boundary
  basis: Parpara’s concealed palm-liquor device and impossible demand cause Hian to
    dig an aperture through the sky-world.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage does not call Parpara a trickster; the taxonomy link is based
    on the boundary-opening result of a retaliatory trick.
- id: motif:4
  label: Descent from sky-world to newly discovered lower world
  taxonomy_refs: []
  basis: A dog is lowered through the sky-world opening, returns with sand, and the
    siblings descend by rope to the world below.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The lower world is discovered and settled, not described as an underworld
    or afterlife realm.
- id: motif:5
  label: First human ancestors from sky-world settlers
  taxonomy_refs: []
  basis: The descended brothers and sister are described as first occupants of the
