  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: The son marries Lumimu-ut, who is his own mother, and she bears many children
    who become gods.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:18
  text: The passage explicitly compares Lumimu-ut’s birth from the rock in the primeval
    sea with Tongan and Samoan myths of first beings and the world from a stone that
    split open, and notes a similar Melanesian idea.
  category: other
  evidence_refs:
