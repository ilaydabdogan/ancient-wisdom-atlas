comparison_claims:
- id: claim:1
  claim: The passage explicitly presents Lumimu-ut’s birth from a rock in the primeval
    sea as comparable to Tongan and Samoan accounts in which first beings and the
    world originate from a stone that splits open, with a similar idea also noted
    in Melanesia.
  claim_level: same_motif
  target: Tongan, Samoan, and Melanesian stone-opening origin motifs
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides only a brief comparative note and does not quote
    or summarize the Tongan, Samoan, or Melanesian versions in detail.
- id: claim:2
  claim: The passage groups the Minahassa rock-and-sea world-making narrative with
    a broader class of origin myths involving a primeval sea, an upper realm or sky,
    and world-making on or in the sea, and then introduces Kayan, Kenyah, and Bahau
    central Borneo legends as characteristic of this type.
  claim_level: same_motif
  target: Kayan, Kenyah, and Bahau central Borneo primeval sea and sky origin legends
  evidence_refs:
  - ev:9
  - ev:10
  - ev:14
  counter_evidence_refs: []
