canonical_text:
  quote: |-
    the lizard, taking off his animal disguise,
    became a very handsome man
  summary: An old woman seeks a wife for Lizard and is refused by the elder sisters
    until the youngest sister, Kapapitoe, accepts. Lizard is mocked and used as a
    foot-wiping surface by the elder sisters, but he performs extraordinary garden-clearing
    work, orders seven coconut-shells to build a house, reveals himself at the river
    as a handsome richly dressed man, and finally uses a charm so that a stone becomes
    a great rock with his house high on it, beyond the sisters’ reach.
  language: English
  quote_policy: quoted
