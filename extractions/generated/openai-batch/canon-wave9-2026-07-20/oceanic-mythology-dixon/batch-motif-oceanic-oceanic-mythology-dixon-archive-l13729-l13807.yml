canonical_text:
  quote: ''
  summary: 'The passage recounts a storm episode in which two brothers survive or
    are carried away by winds, with their frog mother using milk to guide a search.
    It then summarizes a Victorian native-bear story: a neglected orphan bear withholds
    all water in vessels atop a growing tree, kills climbers by pouring water on them,
    is defeated by two sons of Pundjel, becomes a real bear, and remains linked to
    rules about bear bones and water. The passage closes by introducing a cannibal
    tale in which two old cannibal brothers plan to kill their nephew, with one hiding
    in a cave.'
  language: English
  quote_policy: summarized
