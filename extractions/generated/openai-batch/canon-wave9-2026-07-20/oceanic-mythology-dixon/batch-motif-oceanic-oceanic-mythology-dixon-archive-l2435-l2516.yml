canonical_text:
  quote: ''
  summary: 'The passage recounts a Polynesian sky-raising myth: in primordial darkness
    Rangi lies upon Papa, covering her and imprisoning their divine offspring. The
    children of Heaven and Earth debate whether to slay or separate their parents;
    most support separation, Tawhiri-ma-tea objects, and several gods attempt unsuccessfully
    to rend heaven and earth apart before Tane-mahuta begins a different effort using
    his body against earth and sky.'
  language: English
  quote_policy: summarized
