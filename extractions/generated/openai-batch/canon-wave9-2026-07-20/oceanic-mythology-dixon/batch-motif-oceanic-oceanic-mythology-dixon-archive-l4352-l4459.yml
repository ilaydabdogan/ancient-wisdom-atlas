  quote: ''
  summary: The passage recounts several Oceanic underworld-wife episodes. Mataora
    learns permanent tattooing in the lower world, reunites with Nuvarahu, and returns
    upward with her, but a sacred garment is barred at the world-door, which is then
    closed to living humans. The passage then compares this episode with accounts
    of Tane seeking Hine-nui-te-po in the underworld and Eneene rescuing Kura from
    underworld captors in Mangaia.
  language: English
  quote_policy: summarized
