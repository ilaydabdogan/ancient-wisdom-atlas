canonical_text:
  quote: ''
  summary: 'The passage summarizes New Zealand and other Polynesian traditions about
    Maui: his abandoned birth and supernatural rearing, his conflict with Maru, his
    return and recognition by his mother, and major exploits including fishing up
    land, snaring the sun, and seeking fire. It then gives a detailed New Zealand
    account of Maui fishing up land with a magic hook made from a jawbone and baited
    with blood, followed by his brothers'' disobedience and the shaping of rugged
    land.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a New Zealand version, Maui is described as an aborted or unformed child
    whom his mother wrapped in an apron or top-knot and abandoned in the bush or threw
    into the sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maui survives abandonment because supernatural beings tend him and rear him
    to manhood; some versions say he was taken into the sky-world.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Maui conflicts with Maru: Maui damages Maru''s crops with rain or snow, Maru
    retaliates with frost against Maui''s crops, and Maui then kills Maru.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After reaching maturity, Maui seeks his parents and brothers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Maui finds his brothers playing niti or teka, a game in which reeds, fern
    stalks, or spears are cast to rebound from a small hillock and slide along the
    ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Maui throws in the game and shouts his name, but his brothers deny that he
    has a right to be called Maui.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Maui's mother first denies that he is her child, then remembers the cast-away
    child after Maui asks her to recall her past, and finally recognizes him as her
    youngest son and favourite.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The passage states that the abandoned-child return episode is parallel to
    Melanesian tales where a deserted child joins others playing a game and is recognized
    by a parent; it also notes that the incident is not otherwise reported in Polynesia
    except in Nieue.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The passage identifies three widely spread Maui exploits: fishing up the
    land, snaring the sun, and the quest of fire.'
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the New Zealand land-fishing account, Maui's elder brothers neglect an
    ancestress by eating the food they were supposed to carry to her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Maui visits the ancestress, finds one half of her body already dead, removes
    her lower jaw, and makes it into a fish-hook.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Maui hides in his brothers' canoe for a fishing trip; after he reveals himself
    at sea, they eventually allow him to remain because they think he cannot fish
    without a hook.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Maui uses the jawbone hook, strikes his nose until it bleeds, baits the hook
    with the blood, and hauls land like a great fish from the bottom of the sea.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Maui tells his brothers not to cut up the land-fish, but they disobey and
    hack it with knives; the fish struggles, breaks the canoe, kills the brothers,
    and the cuts make the land rough and rugged.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Some versions identify the hauled-up land as Tonga, while others identify
    it as New Zealand, called Te-ika-a-maui, 'The Fish of Maui.'
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: Another account says the magic hook was made from the jawbone of Maui's oldest
    son, whom Maui killed for that purpose, with the son's ear used as bait; Maui
    laboured for three moons with help from Rupe, a pigeon, who held one end of the
    line.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The passage states that New Zealand tells the land-fishing exploit with the
    greatest detail and that Hawaii also has nearly as full versions.
  category: relationship
  evidence_refs:
  - ev:11
