candidate_motifs:
- id: motif:1
  label: Post-deluge survivor siblings on mountain peaks
  taxonomy_refs:
  - flood_and_renewal
  - survivor_pair
  - sibling_pair
  basis: Wigan and Bugan survive on separate mountains, and Wigan seeks Bugan once
    the earth is dry.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The preceding deluge narrative is outside this excerpt; the passage heading
    and the statement that the earth had dried support the post-deluge reading.
- id: motif:2
  label: Fire signal revealing another survivor
  taxonomy_refs: []
  basis: Bugan's fire lights Mt. Kalauitan at night, allowing Wigan to know that someone
    else is alive.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not say Bugan intentionally uses the fire as a signal.
- id: motif:3
  label: Divinely sanctioned sibling marriage to repopulate the world
  taxonomy_refs:
  - sacred_marriage
  - survivor_pair
  - sibling_pair
  - flood_and_renewal
  basis: Wigan concludes repopulation must come through himself and Bugan; Maknongan
    blesses and sanctions their marriage and says the world must be repeopled through
    them.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage treats the union as sanctioned within the story; modern ethical
    categories are not added beyond the text's own later use of incest terminology.
- id: motif:4
  label: Sibling descendants as universal ancestors
  taxonomy_refs:
  - sibling_pair
  basis: The four oldest sons marry the four daughters, and all earth-world people
    descend from them.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage describes a collective ancestral origin rather than individual
    later genealogies.
- id: motif:5
  label: Sacrifice to gods in times of trouble
  taxonomy_refs:
  - sacrifice
  basis: Maknongan instructs Wigan and Bugan to offer sacrifices to the gods whenever
    they are in trouble.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage records an instruction to sacrifice, not a performed sacrifice.
- id: motif:6
  label: Recognition mark reveals kinship before marriage
  taxonomy_refs: []
  basis: In the Tagalog legend, a scar on the son's head reveals his identity to his
    mother just before the planned marriage.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is presented as a non-origin variant summarized by the author, not
    as the main Ifugao origin story.
- id: motif:7
  label: Petrification after decision to proceed with taboo union
  taxonomy_refs:
  - divine_judgment
  basis: After the mother and son recognize each other and decide to proceed with
    marriage, they are suddenly turned to stone.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: No agent or explicit divine judgment is named in the passage; the taxonomy
    link is therefore tentative.
- id: motif:8
  label: Human pair formed from earth or clay and needing breath
  taxonomy_refs: []
  basis: The author identifies a widespread creation form in which humans are made
    from earth or clay; the Halmahera example has a servant form male and female earth
    figures and ascend for breath of life.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The excerpt cuts off before the Halmahera episode is fully completed.
- id: motif:9
  label: Evil destroyer of newly made human images
  taxonomy_refs:
  - chaos
  basis: An evil deity destroys the earth-made human images while the divine servant
    is away seeking breath.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage gives only a brief account; the broader role of the evil deity
    is not explained here.
- id: motif:10
  label: Dogs shaped from the waste of evil beings
  taxonomy_refs: []
  basis: After repeated destruction of the human images, the divine messenger shapes
    two dogs from the faeces of evil beings.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The sentence continues beyond the supplied passage, so the function of
    the dog figures remains incomplete.
