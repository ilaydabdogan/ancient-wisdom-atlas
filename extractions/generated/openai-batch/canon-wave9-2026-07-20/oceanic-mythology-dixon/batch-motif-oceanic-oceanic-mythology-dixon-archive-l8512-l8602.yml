canonical_text:
  quote: ''
  summary: The passage includes a plate note about Bugan, then narrates an Ifugao
    post-deluge origin story in which Wigan and Bugan survive on separate mountains,
    reunite after Bugan's fire reveals her presence, and are divinely sanctioned by
    Maknongan to marry and repopulate the earth-world. Their children intermarry and
    become ancestors of humanity. The author then compares this pattern with related
    Philippine, Nias, Borneo, and Celebes variants, gives a Tagalog recognition-and-petrification
    story, and begins a discussion of creative origin myths in which humans are formed
    from earth or clay, citing a Halmahera example.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate note identifies Bugan as Wigan's wife, prominent in myths, recipient
    of prayers for women, and regarded as the perfect woman among the Ifugao of Luzon.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wigan is on Mt. Amuyao and Bugan is on Mt. Kalauitan; Bugan's fire lights
    the peak at night and lets Wigan know another person is alive.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the earth is dry, Wigan journeys to Kalauitan, finds Bugan, descends
    the mountain with her, reaches the Banauol valley, and builds a house with separate
    upper and lower sleeping places.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wigan searches for other surviving people for three days and concludes that
    no one else remains, so repopulation must come through himself and Bugan.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bugan realizes she is pregnant, weeps, reproaches Wigan, flees, and sinks
    down at a riverbank in grief and fatigue.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Maknongan appears near Bugan as an old man with a long white beard sitting
    on a rock and tells her not to be afraid.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Maknongan sanctions and blesses the marriage of Wigan and Bugan, says the
    world must be repeopled through them, and instructs them to offer sacrifices to
    the gods when in trouble.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Wigan and Bugan have nine children, five sons and four daughters; the four
    oldest sons marry the four daughters, and all people of the earth-world descend
