  summary: The passage summarizes Dixon's comparative account of Polynesian cosmogonic
    traditions. It distinguishes a deity-centered creative theme from an evolutionary
    or genealogical theme, discusses their regional distribution, links genealogical
    cosmology to Polynesian ancestor lists and chiefly divine descent, and reviews
    possible explanations in environment, migration, and contact with Indian-influenced
    Indonesia, including a cautious reference to the cosmic egg comparison.
  language: English
  quote_policy: summarized
