canonical_text:
  quote: ''
  summary: The passage gives the end of a Wurruna sky-maiden tale in which two women
    are carried upward by growing trees and join their five sisters as the Pleiades,
    followed by the author's comparative note. It then summarizes a New South Wales
    tale in which Byamee's two wives are swallowed by water monsters, rescued, restored
    to life with the help of red ants, and connected with the origin of Narran Lake.
    The passage closes with the beginning of a Victorian tale in which Gartuk the
    mopoke captures wind-storms in kangaroo-skin bags before going to the camp of
    the Bram brothers.
