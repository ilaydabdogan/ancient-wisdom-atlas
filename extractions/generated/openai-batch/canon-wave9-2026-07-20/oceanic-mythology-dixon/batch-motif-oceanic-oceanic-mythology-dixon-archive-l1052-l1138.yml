canonical_text:
  quote: ''
  summary: 'The passage describes a Polynesian genealogical or evolutionary type of
    origin myth: creation begins in Po, a void or chaos, from which light, heat, moisture,
    substance, form, earth, and sky emerge. Earth and sky are personified as cosmic
    parents whose offspring include natural phenomena and gods. It then gives New
    Zealand examples, including a Nga-i-tahu genealogy from Po to Raki/Rangi and an
    episode in which Tangaroa wounds Rangi after a marital conflict, followed by an
    alternative sequence of named voids and nights.'
  language: English
  quote_policy: summarized
