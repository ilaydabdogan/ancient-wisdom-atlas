candidate_motifs:
- id: motif:1
  label: Unwanted companion becomes monster-slaying helper
  taxonomy_refs: []
  basis: Nganaoa is refused passage, secretly boards, is threatened or expelled, but
    is allowed to remain after promising aid and then kills multiple sea monsters.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage presents this as part of the Rata episode but does not give
    a formal motif label.
- id: motif:2
  label: Swallowed by sea monster, fire made inside, escape follows
  taxonomy_refs:
  - hero_descent
  - fire
  basis: Nganaoa enters the whale, finds his parents inside, kindles a flame within
    it, and the whale rushes ashore so everyone escapes.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The available taxonomy includes broad categories only; the precise sea-monster-belly
    episode is not separately listed.
- id: motif:3
  label: Devouring monster contains lost kin
  taxonomy_refs: []
  basis: The whale that threatens the party also contains Nganaoa's mother and father,
    who had been devoured while fishing.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: Only one instance is summarized in this passage.
- id: motif:4
  label: Concealed pitfall trap against hero party
  taxonomy_refs:
  - labyrinth_initiation
  basis: A cannibal giant attempts to induce Rata and his men to sit on mats concealing
    a pitfall.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The taxonomy reference is broad and approximate; the passage itself only
    describes a trap incident.
- id: motif:5
  label: Cannibal giant or monster destroyed with red-hot stones
  taxonomy_refs:
  - fire
  basis: The passage identifies destruction of a cannibal giant or monster by red-hot
    stones as an incident of wide distribution.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The immediate passage summarizes the incident comparatively rather than
    narrating one full version.
- id: motif:6
  label: Woman lost in the sea and restored to life
  taxonomy_refs:
  - death_rebirth
  - resurrection
  - water
  basis: Hina-uri throws herself into the sea, drifts for months, washes ashore, and
    is restored to life by two brothers.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The text does not describe the mechanism of restoration beyond the brothers'
