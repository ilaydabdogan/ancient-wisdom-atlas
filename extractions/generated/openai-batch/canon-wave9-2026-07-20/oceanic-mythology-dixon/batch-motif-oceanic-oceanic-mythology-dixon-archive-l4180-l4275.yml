canonical_text:
  quote: ''
  summary: The passage includes a Plate IX caption describing an Easter Island drift-wood
    mythical animal connected with ancestral worship; a Rata-Nganaoa sea voyage episode
    in which Nganaoa secretly boards, survives being thrown overboard by hiding in
    a gourd, and kills sea monsters including a whale whose belly contains his parents;
    comparative notes on Rata's conflicts with cannibal giants; and a New Zealand
    Maui-related tale in which Hina-uri dies or drifts in the sea, is restored to
    life, becomes Tinirau's wife, and is later found by her brother Rupe after he
    ascends to Rehua's heaven and returns as a pigeon.
  language: English
  quote_policy: summarized
