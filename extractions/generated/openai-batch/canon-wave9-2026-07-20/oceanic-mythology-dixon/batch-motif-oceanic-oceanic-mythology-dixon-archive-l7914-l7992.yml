canonical_text:
  quote: ''
  summary: The passage reports several Oceanic and Indonesian origin traditions. Kayan
    accounts describe land forming from rock, soil, a tree, and a vine, with the tree-vine
    union producing ancestral beings; a variant adds a spider, stone, lichen, worm,
    crab, heavenly objects, and progressively human descendants. South-eastern Borneo
    accounts describe earth placed on a great serpent in the primordial sea to form
    the world, and another tale in which a tree-bud becomes a woman whose descendants
    include a seed-bearing son lowered to earth. A Battak account describes Mula Dyadi
    in the seven heavens, a sky-reaching tree, a hen whose eggs become maidens, and
    a spinning daughter who drops her spindle and descends by its thread.
  language: English
  quote_policy: summarized
