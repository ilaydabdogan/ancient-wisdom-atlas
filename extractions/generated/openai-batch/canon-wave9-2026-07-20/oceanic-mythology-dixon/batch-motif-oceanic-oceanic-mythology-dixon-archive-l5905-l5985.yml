canonical_text:
  quote: "“In the beginning the sea was very small—only a tiny water-hole”"
  summary: 'The passage surveys several Oceanic origin traditions: Qat''s birth from
    a stone; a Baining account in which a concealed salt-water hole expands into the
    sea; Admiralty, southern British New Guinea, German New Guinea, and Woodlark accounts
    of the origins of the sun and moon; a Woodlark fire-theft account; and the beginning
    of a Massim story involving a woman and a great fish.'
  language: English
  quote_policy: quoted
