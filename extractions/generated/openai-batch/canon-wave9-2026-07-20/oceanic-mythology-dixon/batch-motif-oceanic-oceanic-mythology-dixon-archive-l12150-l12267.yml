- id: obs:1
  text: Magigi tells Kitimil that a great storm will come, the sea will rise in flood,
    and the people of Yap will be drowned; she instructs that they climb the highest
    mountain and build a seven-storey pile-dwelling.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kitimil and Magigi take leaves, oil, and the teeth and blood of a dead mouse
    to the top of a very high mountain, where they build the seven-storey pile-dwelling.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the seventh day, rain and wind come, the sea covers Yap, and Kitimil and
    his wife move upward through the storeys as the waters rise.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Magigi places oil on a leaf and lays it on the water; the flood begins to
    abate and the storm ceases.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the land dries, Kitimil and Magigi find one other surviving man who
