canonical_text:
  quote: ''
  summary: The passage gives a Yap deluge story in which Magigi warns Kitimil of a
    coming sea-flood, they survive on a seven-storey pile-dwelling built on a high
    mountain, Magigi stops the flood with oil on a leaf, another man survives by a
    canoe outrigger, and Magigi later bears seven children. A simpler Pelew flood
    version follows, in which friends of a killed minor deity cause a flood in revenge
    and warn one old woman to use a raft, but she drowns and becomes stone after her
    hair catches in a tree. The passage then begins miscellaneous Carolinian tales
    of Olofat, a mischievous or malicious son of Luke-lang/Luk, who gives teeth to
    sharks, deceives through transformations, and escapes an attempted drowning in
    a fish-basket.
  language: English
  quote_policy: summarized
