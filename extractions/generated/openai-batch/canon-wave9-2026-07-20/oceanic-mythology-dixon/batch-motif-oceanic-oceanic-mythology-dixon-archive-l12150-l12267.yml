    pile-dwelling; they take leaves, oil, and dead mouse teeth and blood there.
  source_text_path: texts/public-domain/oceanic/project-gutenberg/oceanic-mythology-dixon.md
  rights_note: Public domain source metadata; summarized.
- id: ev:2
  type: summary
  locator: 12159-12170
  quote_or_summary: On the seventh day, rain and wind come, the sea covers Yap, Kitimil
    and his wife ascend the storeys as waters rise, and Magigi lays oil on a leaf
    on the water, after which the flood abates and the storm ceases.
  source_text_path: texts/public-domain/oceanic/project-gutenberg/oceanic-mythology-dixon.md
  rights_note: Public domain source metadata; summarized.
- id: ev:3
  type: summary
  locator: 12170-12179
  quote_or_summary: After the land dries, Kitimil and Magigi say no one else is alive
    in Yap, but find another man who survived by lashing himself to a canoe outrigger
    anchored to a stone; Magigi later bears seven children who scatter over the land.
  source_text_path: texts/public-domain/oceanic/project-gutenberg/oceanic-mythology-dixon.md
  rights_note: Public domain source metadata; summarized.
- id: ev:4
  type: summary
  locator: 12180-12189
  quote_or_summary: 'The Pelew version is described as simpler: friends of a killed
    minor deity cause a revenge flood and warn one old woman to take refuge on a raft,
    but the rope anchoring it is too short and she drowns.'
  source_text_path: texts/public-domain/oceanic/project-gutenberg/oceanic-mythology-dixon.md
  rights_note: Public domain source metadata; summarized.
- id: ev:5
  type: summary
  locator: 12189-12195
  quote_or_summary: The drowned woman's body drifts away, her hair catches in tree
    branches, and she is turned to stone, visible to this day.
  source_text_path: texts/public-domain/oceanic/project-gutenberg/oceanic-mythology-dixon.md
  rights_note: Public domain source metadata; summarized.
- id: ev:6
  type: summary
  locator: 12201-12213
  quote_or_summary: The Carolinian Olofat or Olifat cycle is introduced; Olofat is
    eldest son of Luke-lang, highest deity, described as mischievous or almost malicious,
    contrasted with beneficent brothers, and compared by the author to Melanesian
    types.
  source_text_path: texts/public-domain/oceanic/project-gutenberg/oceanic-mythology-dixon.md
  rights_note: Public domain source metadata; summarized.
- id: ev:7
  type: summary
  locator: 12214-12226
  quote_or_summary: Olofat is angry because a brother is better and more beautiful;
    he descends from the sky-world and gives teeth to sharks with which two boys are
    playing, causing the sharks to bite the boys' hands.
  source_text_path: texts/public-domain/oceanic/project-gutenberg/oceanic-mythology-dixon.md
  rights_note: Public domain source metadata; summarized.
- id: ev:8
  type: summary
  locator: 12227-12247
  quote_or_summary: Ligoapup, Olofat's sister and the boys' mother, sends her sons
    to bring him; he is seen as a dirty old man, then as a heap of filth, and then
    turns into a handsome man, after which she calls him a deceiver.
  source_text_path: texts/public-domain/oceanic/project-gutenberg/oceanic-mythology-dixon.md
  rights_note: Public domain source metadata; summarized.
- id: ev:9
  type: summary
  locator: 12247-12258
  quote_or_summary: Olofat says he fears his father and is angry at Luk for creating
    his brother handsomer and more powerful; he says he will give teeth to all sharks
    to eat men from overturned canoes. Luk and Inoaeman say Olofat is doing evil and
    may destroy mankind.
  source_text_path: texts/public-domain/oceanic/project-gutenberg/oceanic-mythology-dixon.md
  rights_note: Public domain source metadata; summarized.
- id: ev:10
  type: summary
  locator: 12259-12267
  quote_or_summary: Luk orders a great house and feast and has a large fish-basket
    prepared; Olofat is placed in it and sunk in the sea, but after five nights the
    basket contains fish and Olofat is seated in a nearby canoe.
  source_text_path: texts/public-domain/oceanic/project-gutenberg/oceanic-mythology-dixon.md
  rights_note: Public domain source metadata; summarized.
