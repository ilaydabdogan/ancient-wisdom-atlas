  quote: ''
  summary: The excerpt concludes a Nauru fire-origin episode in which fire appears
    from a rubbed groove and a torch is lit; gives a Young Spider tale in which a
    miraculously born spider boy ascends through the heavens, obtains a firebrand
    from Lightning despite warnings about Thunder, and injures Thunder; and begins
    a western Caroline flood-myth frame involving Kitimil, Magigi, and her insatiable
    heavenly father, who can take mouse form.
