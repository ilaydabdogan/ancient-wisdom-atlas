canonical_text:
  quote: ''
  summary: 'The passage surveys Oceanic and Island Southeast Asian origin traditions:
    human beings or ancestors emerge from tree trunks, bamboo, trees, vines, fruits,
    worms, ground, birds, eggs, earth eggs, and rocks; some versions connect animation
    with divine breath or wind and explain mortality. It also notes flood-related
    Philippine traditions in which a surviving sibling pair is connected with human
    origins, though the excerpt becomes corrupted after naming Wigan and Bugan.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a Minahassa account, a tree-trunk floats ashore, is broken open by a deity,
    and a man who is really a god comes out.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In a Tagalog account, two hollow bamboos float ashore on the first land, are
    pecked open by a bird, and release a man and a woman who become ancestors of mankind.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kayan and south-east Borneo variants are described in which a tree and vine
    of miraculous origin produce ancestors of different tribes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Nias account says mankind originated from the fruit of the tora'a tree,
    which grew either on the back of an early being from chaos or from his heart after
    death.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some easterly-island accounts say the first men were derived from worms or
    came out of the ground as larvae; Watubela and Kei accounts say the first men
    arose from the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Battak account says the first man was born from a featherless bird sent
    down from the sky.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Philippine account says a bird laid two eggs at a river's source and mouth;
    a woman came from one egg and a man from the other.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the same Philippine egg account, the man later encounters a long hair floating
    in the water, follows upstream to find its owner, and marries the woman.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In a south-eastern Borneo account, earth is spread on the head of a great
    serpent swimming in the primeval sea before a deity discovers seven earth eggs.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the south-eastern Borneo account, two earth eggs contain a lifeless man
    and woman; a deity goes to seek breath from the creator, but another deity animates
    them first by blowing into their mouths.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that because the second deity animated the pair before
    the first deity returned, humanity became subject to decay and death rather than
    immortal.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Another south-eastern Borneo version has two eggs produce a human pair, who
    then have seven sons and seven daughters without life.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In that version, the husband goes to obtain germs of life; the wife disobeys
    an instruction not to leave her mosquito-curtains, wind blows into the children,
    and they become alive.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The second Borneo version explains that human beings are mortal and that wind
    or breath is their only life.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage also reports egg-origin traditions among the Battak of Sumatra,
    a miraculous birth from rock or sweat in Celebes, and an origin of mankind from
    a rock that split open in Formosa.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage states that direct human origin from brother-sister or mother-son
    marriages is especially characteristic of the Philippine area when following a
    flood episode.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: In the central Ifugao example, rising waters drive people to mountains until
    only a brother and sister, Wigan and Bugan, survive; the excerpt then becomes
    corrupted.
  category: sequence
  evidence_refs:
  - ev:11
