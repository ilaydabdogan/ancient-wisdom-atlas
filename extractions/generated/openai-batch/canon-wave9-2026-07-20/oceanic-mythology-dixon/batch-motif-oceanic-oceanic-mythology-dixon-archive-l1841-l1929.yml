canonical_text:
  quote: ''
  summary: The passage gives a plate caption for Taria-nui, a Rarotongan fishing god,
    then compares several Oceanic origin myths involving heavenly gods, a universal
    or primeval sea, bird messengers, land appearing from sky-cast material or being
    fished up from the sea, a seed and vine covering new land, divine creation on
    a rock in the sea, and cosmic egg variants from the Society Group, Hawaii, and
    New Zealand. It ends by noting resemblance between the cosmic egg material and
    Hindu cosmogonic ideas.
  language: English
  quote_policy: summarized
