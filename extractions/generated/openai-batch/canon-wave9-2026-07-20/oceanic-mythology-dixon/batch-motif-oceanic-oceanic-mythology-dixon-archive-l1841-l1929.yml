- id: motif:5
  label: Cosmic egg producing deity, world, or first beings
  taxonomy_refs:
  - cosmic_egg
  basis: The Society Group fragment has Taaroa in an egg in darkness; the Hawaiian
    version has an egg on primeval waters producing the world; the New Zealand version
    has an egg dropped into the sea producing people, animals, and a canoe.
  evidence_refs:
