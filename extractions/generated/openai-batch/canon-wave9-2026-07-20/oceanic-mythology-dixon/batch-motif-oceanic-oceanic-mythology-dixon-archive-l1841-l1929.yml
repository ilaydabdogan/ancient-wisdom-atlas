- id: motif:1
  label: Heavenly material cast into primeval sea becomes land
  taxonomy_refs:
  - chaos
  basis: The passage identifies a pattern of gods above, universal sea below, and
    material cast down from heaven; in the Tongan version chips and shavings from
    the celestial artisan become Eua.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: The available taxonomy has no exact label for sky-cast world-making matter;
    “chaos” is used only for the watery pre-creation setting.
- id: motif:2
  label: Divine bird or messenger scouts for land over waters
  taxonomy_refs: []
  basis: The general pattern includes a bird as messenger or offspring of the sky-deity,
    and the Tongan messenger descends on a bird to search for land above the waters.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No specific available taxonomy reference matches this messenger-bird motif.
- id: motif:3
  label: Fishing up land from the ocean
  taxonomy_refs:
  - culture_hero
  basis: The passage reports Tiki fishing up land from the ocean bottom and Maui sailing
    from the realm of the gods to fish up Tonga.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: medium
  cautions: The passage states that the Maui episode may represent a different element
    from the sky-cast/bird-messenger theme; “culture_hero” is a broad fit rather than
    an explicit label in the passage.
- id: motif:4
  label: Primeval waters before land
  taxonomy_refs:
  - chaos
  basis: Several accounts begin with a universal sea, waters covering the abyss, only
    the sea, or primeval waters on which deities, birds, eggs, or canoes appear.
  evidence_refs:
