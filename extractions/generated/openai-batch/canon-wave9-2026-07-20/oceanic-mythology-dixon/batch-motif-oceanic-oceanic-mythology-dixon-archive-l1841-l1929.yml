    in the discovery or formation of land.
  claim_level: same_motif
  target: Samoan and Tongan sky-gods/primeval-sea/bird-messenger origin pattern
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage is a secondary comparative summary and does not reproduce
    the full Samoan versions in this excerpt.
- id: claim:2
  claim: The Society Group and Marquesan fragments are presented as possible echoes
    of the same primeval-sea theme found in Samoa and Tonga, involving a deity floating,
    flying, or traveling over waters before land is established.
  claim_level: same_motif
  target: Society Group and Marquesan fragments compared with Samoan primeval-water
    versions
