canonical_text:
  quote: ''
  summary: The passage surveys Oceanic and nearby traditions about the heavens once
    being low and then raised or propped up. It describes Chatham Islands, Cook Group,
    Society Group, New Hebrides, and broader Indonesian, Micronesian, Philippine,
    Hawaiian, New Zealand, and central Polynesian variants, including divine sky-raising,
    a woman commanding the sky to rise after striking it with a pestle, and the association
    of the episode with Maui in some Polynesian contexts. It ends by turning to Maori
    traditions of Rangi, Papa, and Tane’s beautifying of his father Raki.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Chatham Islands account, a being called “Heaven-Propper” raises the
    heavens, and the sky is lifted on ten pillars set one above another.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Cook Group account, Ru is identified as the raiser of the heavens;
    the heavens were formerly so low that they rested on broad plant leaves, and people
    were confined in the narrow space beneath them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ru summons the gods of night and the gods of day to help him raise the sky,
    and they come in response to his call.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ru chants a song calling for the universe and heavens to be lifted; after
    the heavens are raised, he chants another song to secure them in place.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the low-sky conception is also found in the Society Group,
    where Ruu aids the raising of the heavens, and that related forms occur in Samoa,
    the Union Group, and only vaguely in Hawaii.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage contrasts central Polynesia, where the sky is simply said to have
    been low and then raised by a deity, with New Zealand, where Sky Father and Earth
    Mother are characteristic.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the New Hebrides version, the heaven was so low that a woman struck it
    with her pestle while pounding food; she angrily told the sky to rise higher,
    and it did.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says similar low-sky-raising forms appear in the Philippines,
    several parts of Indonesia, and Micronesia, and it describes the Maori form as
    a special or locally developed form of a widespread theme.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that the raising of the sky is accomplished by gods in
    the foregoing legends and is a cosmogonic feature, but in parts of Polynesia the
    same episode appears as one of Maui’s exploits.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says that, after the separation of Rangi and Papa, Tane sought
    to clothe and beautify them, saw that his father Raki was naked, and obtained
    red kura to improve his appearance.
  category: action
  evidence_refs:
  - ev:9
