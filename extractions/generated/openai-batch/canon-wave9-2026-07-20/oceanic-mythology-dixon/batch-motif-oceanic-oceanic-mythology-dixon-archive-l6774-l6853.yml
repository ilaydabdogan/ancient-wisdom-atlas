canonical_text:
  quote: ''
  summary: 'In the first tale segment, Tamus discovers Pupal, who had come from a
    dracaena, living with her son. Fearing cannibals, the two boys prepare weapons
    and a slippery barricade, lure the cannibals, kill them, burn the bodies, and
    send the ogress''s breasts in a coconut-shell across the sea as a sign to the
    people who had fled. The returning people are initially rebuked by Tamus''s son
    for abandoning his mother, but are finally allowed to settle again. The passage
    then introduces a New Hebrides cannibal story: Taso kills Qatu''s pregnant sister,
    twin boys are born from the dead mother and survive in the forest, Qatu discovers
    them through his sow''s missing provisions, accepts them as nephews, trains them
    with bows, and tells them about their mother''s murder.'
  language: English
  quote_policy: summarized
