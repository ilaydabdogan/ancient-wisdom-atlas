canonical_text:
  quote: ''
  summary: 'The passage surveys several Oceanic human-origin traditions: a Samoan
    Tangaloa/Turi account in which a bird daughter explores a water-covered earth,
    dry land expands, a plant decays, worms appear, and worms become humans; related
    Tongan and Society Group variants involving worms or formless first humans; a
    Chatham Islands origin from a blood clot in a hollow tree; Nieue and New Zealand
    tree-birth or tree-marriage accounts; and the opening of a Maori Sky Father and
    Earth Mother discussion.'
  language: English
  quote_policy: summarized
