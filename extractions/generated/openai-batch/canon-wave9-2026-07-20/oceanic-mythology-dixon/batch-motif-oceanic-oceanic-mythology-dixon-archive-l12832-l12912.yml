canonical_text:
  quote: ''
  summary: The passage collects Australian moon-related myths. In an opening fragment,
    an unnamed figure repeatedly kindles destructive fires while moving the moon from
    a tree to the sky. A New South Wales tale describes the moon as the old man Gina,
    whose badly treated young male relatives trick him into breaking an emu-flesh
    tabu, cause a rock to grow, and make him fall while climbing, explaining the bent
    back of the new moon. An Arunta account says a man of the Opossum clan dies, revives,
    later becomes the moon, and continues periodic death and return. A Warramunga
    account begins with a moon-man emerging from the ground, meeting a woman, and
    being caught near a fire that two hawks discovered but could not control.
  language: English
  quote_policy: summarized
