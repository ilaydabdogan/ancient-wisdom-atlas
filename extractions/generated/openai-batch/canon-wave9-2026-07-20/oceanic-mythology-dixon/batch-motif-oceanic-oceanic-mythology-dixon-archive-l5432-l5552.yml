canonical_text:
  quote: ''
  summary: The passage summarizes Dixon's comparative argument about Polynesian mythology.
    It states that many theories derive Polynesian peoples from the Indonesian area
    with a temporary Melanesian passage, compares the distribution of Indonesian,
    Melanesian, and Micronesian myth-incidents across Polynesian island groups, proposes
    a composite origin involving at least two migration waves, and cautions against
    overconfident solar, lunar, or other interpretive readings because myths change
    during transmission.
  language: English
  quote_policy: summarized
