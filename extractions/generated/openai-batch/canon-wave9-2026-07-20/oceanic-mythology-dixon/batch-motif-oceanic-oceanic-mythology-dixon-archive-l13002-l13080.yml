canonical_text:
  quote: ''
  summary: 'The passage surveys several Australian origin-of-fire tales: fire is held
    by a bandicoot, by two women who hide it in a nut-shell, by fire emerging from
    broken sticks during snake encounters, and by a euro carrying fire in its body.
    Fire is obtained or redistributed through animal stratagems, accidental spread,
    recovery from a crow, and instruction in fire-stick use.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that origin-of-fire myths are widely known and include
    tales in which birds or animals originally own fire and the secret is stolen from
    them.
  category: other
  evidence_refs:
  - ev:1
