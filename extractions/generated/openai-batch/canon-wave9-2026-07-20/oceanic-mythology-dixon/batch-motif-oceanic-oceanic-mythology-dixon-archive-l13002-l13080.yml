- id: claim:1
  claim: The passage itself presents the Victorian and New South Wales accounts as
    related variants of a widespread origin-of-fire pattern in which fire is held
    by limited owners and obtained through animal action or stratagem.
  claim_level: same_motif
  target: Widespread origin-of-fire tales involving theft or seizure from original
    fire holders
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is internal to Dixon’s secondary summary; one tribal
    identification is marked uncertain in the passage.
- id: claim:2
  claim: The passage presents the Melbourne-area broken-stick fire story as part of
    a second widespread type and says that this type is sometimes combined with the
    first fire-theft type.
  claim_level: same_motif
  target: Combined broken-stick origin of fire and fire-seizing bird pattern
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The excerpt summarizes the combination rather than giving multiple
    full examples of the second type.
