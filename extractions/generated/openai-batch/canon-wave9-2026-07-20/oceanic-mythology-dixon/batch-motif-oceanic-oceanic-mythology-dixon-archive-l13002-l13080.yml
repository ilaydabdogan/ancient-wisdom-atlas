  text: In one Victorian version, the bandicoot is the sole owner of fire, carries
    a fire-brand, and refuses to share it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The other animals hold a council and deputize the hawk and the pigeon to obtain
    fire by force or stratagem.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pigeon attempts to seize the fire; the bandicoot throws the brand toward
    the river; the hawk knocks it into dry grass, which catches fire so that people
    can obtain fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a New South Wales version, two women, Kangaroo-Rat and Bronze-Winged Pigeon,
    own fire and keep it concealed in a nut-shell.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Animals discover the women’s cooking secret by spying, arrange a dance to
