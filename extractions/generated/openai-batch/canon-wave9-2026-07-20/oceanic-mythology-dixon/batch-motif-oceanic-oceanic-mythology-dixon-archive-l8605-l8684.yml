canonical_text:
  quote: ''
  summary: A comparative discussion of Oceanic origin myths in which divine beings
    or animal creators form human bodies from earth, stone, wood, or other substances
    and animate them through breath, wind, saliva, ritual formulas, or life-giving
    materials. Several variants explain human mortality, plant regrowth, or failed
    attempts at making humans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the opening fragment, two new human images are guarded by dogs; an evil
    being is driven away, and a divine messenger brings breath of life to vivify the
    effigies as the first mankind.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Minahassa account, a deity makes one male and one female image of earth
    and vivifies them by blowing powdered ginger into their heads and ears.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Bagobo account, after the sea, land, and trees have been created, the
    creator shapes two lumps of earth like human figures, spits on them, and they
    become man and woman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Dairi Battak account, Batara Guru wishes to people the earth, sends
    a swallow, asks his children to descend, and finally comes down himself when they
    are unwilling.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Batara Guru has the swallow bring earth from the sky, makes two images, dries
    them in the sun, repeats a magic formula seven times, and then uses another formula
    so the images speak.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Dairi Battak created pair address Batara Guru as Grandfather; he says
    he created them to speak and commands them to remember and obey him, which they
    promise.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the south-eastern Borneo variant, two wonder-trees on the new-formed earth
    mate and produce an egg from which a phantom maiden comes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A divine being descends, sees that the phantom maiden is lifeless and intangible,
    and leaves to obtain what is needed to give her life and substance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: While the first deity is absent, another deity gathers earth for the maiden's
    body, rain for her blood, and wind for her breath, making her alive and tangible.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the first deity returns, he breaks a vessel containing water of life;
    the water flies over plants, giving them the power to spring up after being cut
    down, while humans do not receive it and remain mortal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the Toradja account, the heaven father and earth mother make one male and
    one female stone figure.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Toradja heaven deity goes to the skies to get the breath of immortality,
    but wind blows into the stone figures during his absence and vivifies them, which
    explains human mortality in this version.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage notes that another Toradja version omits the attempt to secure
    immortality.
  category: other
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the Dyak account, two birds, Iri and Ringgon, form the earth, plants, and
    animals and then decide to create man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Dyak birds first make a clay man who cannot speak or move and breaks,
    then a hard-wood man who is useless, and then select Kumpong wood as a better
    material.
  category: sequence
  evidence_refs:
  - ev:7
