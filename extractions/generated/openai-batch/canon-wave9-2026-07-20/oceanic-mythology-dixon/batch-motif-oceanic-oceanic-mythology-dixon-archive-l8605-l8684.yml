candidate_motifs:
- id: motif:1
  label: First humans fashioned from earth or clay
  taxonomy_refs: []
  basis: Several accounts describe male and female images or human figures made from
    earth, lumps of earth, earth brought from the sky, earth used for a body, or clay.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: The available taxonomy list has no exact clay-creation or anthropogony-from-earth
    category.
- id: motif:2
  label: Inanimate forms animated by breath, wind, saliva, substances, or ritual speech
  taxonomy_refs: []
  basis: The passage repeatedly describes made forms being vivified through breath
    of life, powdered ginger, spittle, magic formulas, rain and wind, or wind alone.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The exact animating medium varies by account.
- id: motif:3
  label: Male and female first pair
  taxonomy_refs: []
  basis: Minahassa, Dairi Battak, and Toradja variants explicitly specify one male
    and one female image or figure; the Bagobo account says the two figures become
    man and woman.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  confidence: high
  cautions: The opening fragment mentions two effigies but does not specify sex within
    the supplied excerpt.
- id: motif:4
  label: Lost immortality and contrast between plant renewal and human mortality
  taxonomy_refs:
  - death_rebirth
  basis: In the Borneo variant, water of life reaches plants but not humans, giving
    plants regrowth after cutting while humans lack immortality; in the Toradja variant,
    wind vivifies humans before the breath of immortality arrives, explaining mortality.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: 'The taxonomy reference is approximate: the passage emphasizes failed
    human immortality and plant regrowth rather than a full death-and-rebirth narrative
    for humans.'
- id: motif:5
  label: Egg-born human-like being from tree progenitors
  taxonomy_refs:
  - cosmic_egg
  basis: The Borneo account says two wonder-trees mate and produce an egg, from which
    a phantom maiden comes.
  evidence_refs:
  - ev:5
  confidence: low
  cautions: The egg produces a maiden rather than the cosmos; the cosmic_egg taxonomy
    reference is therefore only a loose fit.
- id: motif:6
  label: Trial-and-error creation from successive materials
  taxonomy_refs: []
  basis: The Dyak account describes failed attempts to make man from clay and hard
    wood before a further material, Kumpong wood, is selected; the passage introduces
    this as a series of creation attempts in which different materials are tried.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The supplied excerpt ends while describing the Kumpong material, so details
    of the eventual successful creation are not fully present.
- id: motif:7
  label: Creation protected from a hostile being by guardian animals
  taxonomy_refs: []
  basis: The opening fragment describes dogs guarding newly made human images and
    driving away an evil being before the images are vivified.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The narrative begins mid-sentence, so the identity of the maker and fuller
    context of the threat are not available in the supplied passage.
comparison_claims:
- id: claim:1
  claim: 'The Minahassa, Bagobo, and Dairi Battak examples support a cautious same-motif
    comparison: first humans are formed as paired earth images or figures and then
    animated by a deity or creator.'
  claim_level: same_motif
  target: Earth-formed first human pair in the passage's Oceanic origin-myth comparisons
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: 'The animating methods differ: powdered ginger, spitting, and magic
    formulas are not identical.'
- id: claim:2
  claim: The south-eastern Borneo and Toradja variants share the same explanatory
    function of accounting for human mortality through a missed or interrupted bestowal
    of immortality.
  claim_level: same_function
  target: Explanation of human mortality through failure to receive water or breath
    of immortality
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The mechanisms differ: one involves water of life going to plants,
    while the other involves wind animating stone figures before the breath of immortality
    arrives.'
- id: claim:3
  claim: The passage itself presents the Dyak material-trial narrative as a related
    but somewhat different form of origin myth, comparable by function to the other
    creation accounts while using a sequence of failed materials.
  claim_level: same_function
  target: Series-of-attempts creation pattern within origin myths
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The supplied passage includes the failed clay and hard-wood attempts
    and selection of Kumpong wood, but it cuts off before the full result of the final
    attempt.
