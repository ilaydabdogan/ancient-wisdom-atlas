canonical_text:
  quote: ''
  summary: The passage frames Indonesian mythology as complex because of multiple
    population and cultural influences, then narrows attention to local or presumably
    aboriginal tales. It notes the lack of accessible Negrito myth material, describes
    northern Luzon mountain tribes as lacking or nearly lacking cosmogonic myths while
    possessing deluge myths, compares this pattern with scanty Mon-Hkmer materials,
    and summarizes a Celebes/Bugi-Makassar origin account in which the son of a sky-deity
    descends by rainbow, prepares the world for mankind, marries six female deities
    from sky and earth/underworld, and becomes ancestor of humanity.
  language: English
  quote_policy: summarized
