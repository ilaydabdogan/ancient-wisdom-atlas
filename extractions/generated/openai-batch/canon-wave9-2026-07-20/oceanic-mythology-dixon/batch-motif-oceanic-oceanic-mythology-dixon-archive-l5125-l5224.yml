canonical_text:
  quote: ''
  summary: The passage describes Easter Island stone ancestral images set on platforms
    above buried ancestral bones. It then summarizes a tale in which a stepmother
    persecutes two children, their dead mother's spirit protects them, they flee to
    caves, a water spirit aids the brother in making a spring and bathing-pool for
    his sister, and the father later kills the stepmother and himself. The narrator
    explicitly compares this tale to the wicked-stepmother theme in Indonesia, Micronesia,
    and Melanesia. The passage then recounts the story of Kapipikauila, who takes
    Hina from her husband Hakalanileo; Hakalanileo seeks heroic help, Kaua and Nikeu
    join him, a magic staff overcomes sea obstacles, Nikeu briefly retrieves Hina
    but loses her after birds desecrate his sacred head, and Kaua is defeated in a
    height-stretching contest against Kapipikauila's rising cliff aided by a magic
    tree.
  language: English
  quote_policy: summarized
