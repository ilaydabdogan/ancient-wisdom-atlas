canonical_text:
  quote: ''
  summary: 'The passage gives several Oceanic accounts explaining death and deluge:
    Mate goes to the lower realms and humans follow; in a Baining account, humans
    miss the sun’s offer of immortality while stones and snakes live forever; in an
    Admiralty Group account, a rescued man cheats a speaking tree and mortality follows;
    in British New Guinea flood tales, a serpent king stops rising sea waters, and
    a magic eel causes a destructive flood from which one old woman survives in a
    tree. The author adds a cautious comparison with snake- and eel-associated deluge
    myths in Indonesia and the Cook Group.'
  language: English
  quote_policy: summarized
