canonical_text:
  quote: ''
  summary: Secondary comparative survey of Oceanic origin myths concerning permanent
    human mortality, the origins of the sun and moon, and the acquisition or source
    of fire in Caroline, Pelew, Gilbert, and Nauru traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A malicious bird causes a branch to tear something containing a precious fluid;
    the fluid spills on a tree, which gains long life and immortality, while man remains
    mortal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In a central Carolines account, Luk asks whether men should die and then live
    again, and Olofat answers that when men die they shall remain dead.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In a western Carolines tale, Mili'ar tells her two children to bury her and
    dig up her body on the seventh day so that she may live again, beautiful and young.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mili'ar's children stop to eat pandanus fruit and linger until the seven days
    have passed; when they return, their mother has died a second time, and thereafter
    all men are mortal.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another western Carolines version says that people formerly did not die forever
    but rose again like the moon; an evil spirit disapproved and made death permanent.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In a Pelew account, two original deities shape the sun and moon from stone
    with an adze and cast them into the sky.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Gilbert Group account, Na Reau creates the first pair, forbids them
    to have children, and threatens punishment for disobedience.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'De-Ai bears three children: the sun, the moon, and the sea; an eel messenger
    informs Na Reau, who comes with a club, but the pair plead that the children are
    useful, and Na Reau leaves without killing them.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In a Pelew fire-origin account, Obagat pities an old woman suffering mouth
    sores from eating raw fish and taro and teaches mankind to make fire by rubbing
    two sticks together.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In a central Carolines fire-origin account, Olofat is owner or lord of fire
    and sends flame to earth by a bird, which carries it in its beak and places the
    seed of fire in trees so men can extract it by rubbing sticks together.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In a Nauru fire tale, the retreating tide leaves two fish trapped in a small
    pool; the pool evaporates, the fish die, maggots in the rotting fish give rise
    to two women, and one woman seeks fire for a torch and rubs two sticks together.
  category: sequence
  evidence_refs:
  - ev:9
