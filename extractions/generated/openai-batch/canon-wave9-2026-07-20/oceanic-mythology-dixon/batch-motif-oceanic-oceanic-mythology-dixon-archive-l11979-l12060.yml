comparison_claims:
- id: claim:1
  claim: 'The central and western Carolines materials share an origin-of-permanent-mortality
    motif, but differ in the immediate cause: divine decree, missed resurrection ritual,
    or an evil spirit ending moonlike renewal.'
  claim_level: same_motif
  target: Caroline origin-of-mortality variants
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage is a secondary summary and does not provide full primary
    versions.
- id: claim:2
  claim: 'The Pelew and Gilbert accounts both explain origins of the sun and moon,
    but their mechanisms differ: crafted from stone by original deities versus born
    as children of the first pair.'
  claim_level: same_function
  target: Oceanic sun-and-moon origin accounts
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The passage presents contrasted beliefs, not a claim of common origin
    or historical contact.
- id: claim:3
  claim: 'The Pelew and central Carolines fire accounts share the function of explaining
    how humans obtain fire through stick-rubbing, but differ in agency: Obagat directly
    teaches, while Olofat sends fire through a bird into trees.'
  claim_level: same_function
  target: Pelew and central Carolines fire-origin accounts
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: No historical relationship is asserted in the passage.
