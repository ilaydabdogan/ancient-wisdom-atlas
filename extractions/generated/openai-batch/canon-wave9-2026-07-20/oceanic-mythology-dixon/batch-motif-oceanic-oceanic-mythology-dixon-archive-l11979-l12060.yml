candidate_motifs:
- id: motif:1
  label: origin of permanent human mortality
  taxonomy_refs:
  - death_rebirth
  basis: 'Several accounts explain why humans remain dead: immortality goes to a tree,
    Olofat decrees permanent death, Mili''ar''s children miss the restoration deadline,
    and an evil spirit ends moonlike revival.'
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage is a secondary comparative summary and combines multiple regional
    variants rather than one continuous narrative.
- id: motif:2
  label: failed resurrection through delayed grave ritual
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Mili'ar's planned return to youthful life depends on her children digging
    up her body on the seventh day, but their delay prevents the resurrection and
    establishes mortality.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The narrator notes details suggestive of missionary teaching while still
    judging the story aboriginal in origin.
- id: motif:3
  label: moonlike cycle of death and return interrupted
  taxonomy_refs:
  - seasonal_cycle
  - death_rebirth
  basis: One version compares former human revival to the moon's monthly disappearance
    and reappearance, then attributes permanent death to an evil spirit.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The comparison is explicitly lunar rather than seasonal in the passage;
    seasonal-cycle taxonomy is approximate.
- id: motif:4
  label: crafted celestial bodies
  taxonomy_refs: []
  basis: The Pelew account says two original deities make the sun and moon from stone
