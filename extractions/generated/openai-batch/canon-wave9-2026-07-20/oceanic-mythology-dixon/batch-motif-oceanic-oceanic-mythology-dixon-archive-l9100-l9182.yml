canonical_text:
  quote: ''
  summary: The passage surveys several Indonesian and Oceanic origin-of-fire traditions.
    In an Igorot flood episode, a brother and sister survive on Mt. Pokis, and Lumawig
    obtains fire for them with the help of a dog and deer. An Ifugao version has Muntalog
    obtain fire-making materials from Mumbonang's body for the Ifugaos. A central
    Celebes version sends Tamboeja to the sky to get fire and learn the concealed
    method of making it. A Kayan Bornean note attributes fire-making by friction to
    Laki Oi.
  language: English
  quote_policy: summarized
