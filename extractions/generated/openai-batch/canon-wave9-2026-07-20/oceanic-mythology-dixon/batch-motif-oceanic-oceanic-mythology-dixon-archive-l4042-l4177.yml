  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The passage describes a recurring incident in which a tree cut for Rata’s
    canoe is magically restored by wood spirits, and the canoe is completed for the
    hero in one night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Aitutaki version, Rata initially ignores a heron fighting a snake,
    finds his felled tree re-erected on two following days, then kills the snake;
    the grateful heron assembles birds who complete the canoe and carry it to Rata’s
    house.
  category: sequence
