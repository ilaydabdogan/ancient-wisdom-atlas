canonical_text:
  quote: ''
  summary: A secondary comparative passage discusses Oceanic variants involving Tawhaki’s
    ascent and search for his father, Rata’s discovery of his parents’ abduction,
    Wahieroa’s capture by a great bird, and the magically completed canoe made from
    a tree that repeatedly returns to an upright state. It also notes comparisons
    with Indonesian, Melanesian, Hawaiian, Tahitian, Cook Group, Aitutaki, Rarotongan,
    and New Zealand materials.
