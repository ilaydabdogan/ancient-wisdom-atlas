  text: In a Hawaiian version, Tawhaki is killed while searching for his father, and
    Rata, his grandson, later obtains revenge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Tahitian Rata account, Wahieroa and his wife leave Rata with Ui the
    Blind, go fishing, and are seized by the great bird Matu’u-ta’u-ta’uo; the bird
    swallows Wahieroa and carries his wife to a distant land.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Rata is taunted by other children as a foundling, asks Ui the Blind for the
    truth, learns of his parents’ abduction, and resolves to seek them despite warnings
