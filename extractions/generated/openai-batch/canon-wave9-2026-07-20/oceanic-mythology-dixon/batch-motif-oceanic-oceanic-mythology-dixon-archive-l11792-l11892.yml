canonical_text:
  quote: ''
  summary: 'The passage summarizes several Oceanic creation and origin traditions:
    a gull stretches the sky; a Yap account has an upside-down tree, a woman born
    in its boughs, and sand spread on the sea to form earth; a Nauru account features
    Ancient Spider opening a tridacna shell, empowering snails, making moon and sun,
    and having Rigi raise the shell into sky while his sweat becomes sea; another
    Nauru version has a bird-form deity over chaos, a butterfly separating land and
    water, and deities raising the skies; a Carolines human-origin account has Ligobund
    descend from the sky and bear ancestors of humankind.'
  language: English
  quote_policy: summarized
