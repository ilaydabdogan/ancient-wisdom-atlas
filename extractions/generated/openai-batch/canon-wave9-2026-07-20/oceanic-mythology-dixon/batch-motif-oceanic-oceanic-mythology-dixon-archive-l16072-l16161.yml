  summary: 'A set of scholarly notes lists comparative Oceanic and Indonesian tale
    incidents: a garuda as an Indian element replacing a cannibal ogre; an impersonator,
    sometimes an inanimate object; a hidden person revealed by reflection in water;
    a deceitful reflection that someone dives for in vain; an “Ariadne” theme; a husband
    sent far away to obtain food or special objects for a pregnant wife; a child born
    to a woman abandoned in a tree or pit; and births from a blister, boil, or unusual
    body part.'
