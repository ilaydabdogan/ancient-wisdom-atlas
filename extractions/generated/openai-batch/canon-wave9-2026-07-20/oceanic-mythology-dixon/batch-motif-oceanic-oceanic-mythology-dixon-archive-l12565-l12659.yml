canonical_text:
  quote: ''
  summary: The passage gives a plate caption for an Australian snake-totem ground-painting
    and then summarizes Australian origin myths. It describes central Australian totem
    ancestors emerging from the ground, wandering, leaving offspring, returning underground
    or becoming landscape features, and serving as sources of reincarnating spirits.
    It recounts a Kaitish Euro-child tale, a Victorian first-man-from-wattle-tree
    account, and the beginning of an Arunta account in which two sky-beings shape
    incomplete beings into humans.
  language: English
  quote_policy: summarized
