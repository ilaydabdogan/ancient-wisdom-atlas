canonical_text:
  quote: ''
  summary: The readable passage first recounts Garawada being magically imprisoned
    in a tree by her witch mother-in-law, giving birth there, and being found through
    her son's identifying song before she turns into a crab and leaves. It then introduces
    a New Hebrides/Lepers Island swan-maiden account in which Tagaro steals the wings
    of a heavenly maiden, takes her as wife, and she later recovers the wings and
    flies back to heaven; a variant says she takes her child with her.
  language: English
  quote_policy: summarized
