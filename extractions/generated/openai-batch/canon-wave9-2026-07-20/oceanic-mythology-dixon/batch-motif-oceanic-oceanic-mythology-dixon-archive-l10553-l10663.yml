canonical_text:
  quote: ''
  summary: Rakian hides a bees' nest or box belonging to a bee-associated woman, later
    marries her after promising not to call her a bee-woman. At a feast he breaks
    the promise by saying she was first a bee. She hears this, returns to her bee
    kin, and transforms into a bee. Rakian follows with their child to a bee-filled
    house, where the bees become men and Rakian and the child remain in the bees'
    village.
  language: English
