canonical_text:
  quote: ''
  summary: 'The passage continues a tale in which Aponibolinayen secretly cooks food
    in Ini-init''s house while he is away making the sun. Ini-init spies on her, shares
    betel-nut with her, exchanges names, recognizes kinship through signs in their
    quids, and marries her; the sun and big star resume their celestial tasks. The
    narrator notes variants in which the miraculous food-providing woman is linked
    to a tree, plant, fruit, or the sea, with distribution eastward into Melanesia.
    A second tale begins: two sisters survive after their parents are eaten by a tiger
    and garuda bird; Sunrise becomes the wife of a hunter, who delays her younger
    sister with a leaking bamboo water-vessel so he and Sunrise can flee. Sunrise
    leaves two lice to answer deceptively for her, delaying Kokamomako''s pursuit;
    Kokamomako later meets an old woman who says Sunrise has passed by.'
  language: English
  quote_policy: summarized
