canonical_text:
  quote: ''
  summary: The passage presents multiple deluge-origin variants. In one Ifugao account,
    Kabigat blocks and later removes the outlet of the waters, rain falls for three
    days, waters recede, mountains and valleys form, and the earth is dried. In a
    central Ifugao version, drought leads people to dig for the river's hidden spring;
    the spring and rain become a flood, leaving only the siblings Wigan and Bugan
    alive on mountain peaks. Brief Ata and Mandaya summaries describe flood survivors
    and repopulation, and the passage begins an Iban/Borneo fragment involving harvest
    damage and a huge serpent.
  language: English
  quote_policy: summarized
