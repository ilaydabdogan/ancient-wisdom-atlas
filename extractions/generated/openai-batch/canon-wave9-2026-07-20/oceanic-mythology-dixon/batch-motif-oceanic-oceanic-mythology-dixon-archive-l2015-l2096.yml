canonical_text:
  quote: ''
  summary: The passage introduces several Oceanic types of myths about the origin
    of human beings, then gives Māori, Hawaiian, Tahitian, and New Zealand examples
    involving divine creation from earth or clay, animation by divine breath, creation
    of a first woman, and marriages of Tane producing natural or nonhuman offspring.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage shifts from myths about the source of the world to myths describing
    the origin of human beings.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Four origin-of-humanity types are listed: direct creation of ancestors by
    deities; creation of a first woman who marries her creator; direct divine offspring
    of deities; and development from worms shaped into human form.'
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: In one Māori version, Tane forms a human model from the earth or soil of Hawaiki
    and names the form Tiki or Tiki-au-a-ha, the first inhabitant of the world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tane then models soil again, prays, produces Jowahine, and orders her to live
    with Tiki as his wife; through them the world is peopled.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other Māori versions make Tiki himself a deity who creates the first man from
    red clay or from clay mixed with his own blood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Hawaiian account, Kane, Ku, and Lono form a man from red earth and
    divine spittle, shape him in the likeness of Kane, breathe into the image, and
    it becomes alive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage identifies the Hawaiian episode of the first woman being created
    from one of the man’s ribs as a result of missionary contact.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: A similar direct-creation tale is reported from Tahiti, with Taaroa as the
    creative deity.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the New Zealand example of the second type, Tane desires Papa as wife,
    but Papa directs him instead to named female ancestors.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'Tane’s unions with Mumuhango, Hine-tu-a-maunga, Rangahore, and Ngaore produce
    nonhuman offspring: a totara tree, rusty mountain water and mountain reptiles,
    stone, and toetoe grass.'
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
