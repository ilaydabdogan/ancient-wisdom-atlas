canonical_text:
  quote: ''
  summary: The passage recounts the end of a tale in which a husband disobeys his
    wife’s instruction not to inspect a cooking pot, causing her miraculous food-making
    power to fail. The wife later finds her hidden magic garment, returns to the sky
    in smoke from a burning rice stalk, and leaves instructions for feeding their
    child. Dixon then comments on variants involving animal disguise and possible
    Indian, European, native, Melanesian, and Polynesian connections. The passage
    begins an Indonesian lizard-suitor tale in which an old woman raises a lizard,
    carries bridal gifts to seven sisters, and is violently rejected by the eldest
    sister.
