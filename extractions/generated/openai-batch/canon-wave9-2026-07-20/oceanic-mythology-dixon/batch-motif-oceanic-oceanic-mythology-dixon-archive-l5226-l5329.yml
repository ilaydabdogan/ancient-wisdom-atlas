canonical_text:
  quote: ''
  summary: The passage concludes a tale in which Kaua stretches his body across the
    sea, is nursed by his grandmother, loses a foot when Nikeu cuts and eats it, recovers,
    destroys the branches of a magic tree aiding Kapipikauila, stretches above the
    rocks of Haupu, kills Kapipikauila, brings Hina back to Hakalanileo, and creates
    the Rocks of Kaua by hurling cliff fragments into the sea. The author then highlights
    the stretching episode for comparison with Melanesian and Micronesian material,
    followed by a methodological summary on comparing Polynesian myth-incidents and
    their distributions.
