canonical_text:
  quote: ''
  summary: The passage surveys Polynesian origin traditions. It notes that evolutionary
    origin motifs are developed in New Zealand, Hawaii, and the Marquesas but survive
    fragmentarily in western Polynesia. Samoan versions include genealogies beginning
    with rocks or cliffs, the octopus, fire and water, a conflict in which water destroys
    the world by flood, and recreation by Tangaloa. Another Samoan chiefly genealogy
    traces ancestors through paired natural phenomena from High Rocks and Earth Rocks
    to Tangaloa. The passage then outlines a creative type in which gods dwell in
    an upper sky-world above a sea; a deity casts a stone into the sea and the world
    develops. In a Samoan version, Tangaloa animates a floating stone into a wife,
    sends their bird child to land, creates shade with a vine, and mankind is later
    made from worms or maggots associated with the rotting vine.
  language: English
  quote_policy: summarized
