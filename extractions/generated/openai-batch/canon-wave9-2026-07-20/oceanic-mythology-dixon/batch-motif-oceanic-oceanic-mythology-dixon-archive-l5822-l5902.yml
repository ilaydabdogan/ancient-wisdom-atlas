literal_observations:
- id: obs:1
  text: 'Several variants describe human origins from animal-laid eggs or offspring:
    a dove bears two young, a tortoise lays ten eggs including two humans, a bird''s
    eggs in Fiji produce a boy and girl when hatched by Ndengei, and a Torres Straits
    bird egg produces a worm that becomes human-shaped.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the tortoise recension, the egg-born man and woman marry and become ancestors
    of both light-skinned and dark-skinned people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hi-asa cuts her finger, collects the blood in a mussel-shell, and later finds
    two eggs that burst into a man and a woman who become parents of the human race.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a New Britain account, an old woman's blood on two pandanus strips is set
    aside in refuse; the pile swells and produces two boys, To-Kabinana from the right-arm
    blood and To-Karvuvu from the left-arm blood.
  category: sequence
  evidence_refs:
