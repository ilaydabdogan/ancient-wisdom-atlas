  summary: The passage includes the end of a tale in which a man thought drowned returns
    home and is killed by his angry wife; a German New Guinea tale in which a tapa-beater
    becomes a woman, deceives and abandons another woman on a drift-wood island, after
    which a sea-eagle raised from an egg feeds her, brings fire, and carries her home;
    a plate caption about Metakorab/Dogai and Bu becoming star-groups; and the opening
    of a Kai tale in which brothers climb a tree and the youngest falls to his death.
  language: English
