canonical_text:
  quote: ''
  summary: A cannibal deceives a woman into giving him all stored food, then imprisons
    her and her children in a cave, where they starve while her husband cannot rescue
    them. The widower later lures the cannibal by promising mourning ornaments, uses
    birds to dam and release a river, binds the cannibal to a tree-root, and drowns
    him. The passage also includes a caption on malevolent sea-spirits and begins
    a comparative note on the common Melanesian theme of a woman abandoned by a village,
    introducing Garawada and her mother-in-law gathering figs.
  language: English
  quote_policy: summarized
