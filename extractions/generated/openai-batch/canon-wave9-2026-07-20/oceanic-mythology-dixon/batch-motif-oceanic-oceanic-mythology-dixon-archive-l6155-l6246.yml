canonical_text:
  quote: ''
  summary: 'The passage includes a plate caption describing an Elema dance mask used
    when participants represent ghosts and spirits. It then recounts Emakong’s discovery
    of an under-water or stream-bottom settlement where fire, cooked food, night,
    crickets, thunder, dawn birds, and people who become snakes at night are present;
    he returns with a package containing night, fire, crickets, and dawn birds and
    explains their use. The passage then summarizes origin-of-death myths from Ambrym
    and the Banks Islands: one attributes death to a malicious deity’s last word against
    skin-renewing immortality; another attributes death to an old woman putting her
    old skin back on after her child fails to recognize her; a further Banks Islands
    tale begins an account of death as a mistake involving Qat and Mate, whose name
    means Death.'
  language: English
  quote_policy: summarized
