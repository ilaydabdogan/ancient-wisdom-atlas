canonical_text:
  quote: ''
  summary: 'The passage retells the Hawaiian tale of Hiku and Kawelu: a secluded youth
    is guided by a magic arrow to Kawelu, marries her, leaves to visit his mother,
    and later descends to the underworld to recover Kawelu’s spirit after she dies
    of grief. It then introduces a New Zealand parallel involving Pare and Hutu, but
    the supplied extract becomes incomplete and noisy after Hutu’s dart is hidden
    by Pare.'
  language: English
  quote_policy: summarized
