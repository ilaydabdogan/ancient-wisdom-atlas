canonical_text:
  quote: ''
  summary: 'The passage gives related Battak origin narratives: a heavenly maiden
    makes and remakes the earth on a primeval sea after a serpent overturns it, then
    marries a suitor and becomes an ancestor of humankind; a Dairi Battak version
    has Batara Guru and a raven descend through a cave to a sea, where Batara Guru
    makes a world on a raft supported by a goat; the beginning of a Karo Battak version
    describes Batara Guru and his wife living by the sea, where a serpent destroys
    their garden.'
  language: English
  quote_policy: summarized
