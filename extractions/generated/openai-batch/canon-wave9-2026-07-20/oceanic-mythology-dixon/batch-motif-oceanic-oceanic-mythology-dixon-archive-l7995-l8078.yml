candidate_motifs:
- id: motif:1
  label: World formed from earth spread over a primeval sea
  taxonomy_refs:
  - chaos
  basis: Both the first account and the Dairi account describe a sea or ocean as the
    initial setting and the making of a world by spreading earth over a support.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:10
  - ev:12
  confidence: medium
  cautions: The available taxonomy has no specific earth-diver or world-on-waters
    category; 'chaos' is used only for the undifferentiated primordial sea context.
- id: motif:2
  label: Serpent causes inundation and world must be restored
  taxonomy_refs:
  - serpent
  - flood_and_renewal
  basis: The serpent turns over under the weight of earth, causing the new world to
    be engulfed by the sea; the sea is dried and the earth is refounded.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The event is an origin-time engulfing of a newly made world rather than
    a later human-age flood.
- id: motif:3
  label: Serpent subdued and fixed to prevent renewed destruction
  taxonomy_refs:
  - serpent
  basis: After the sea shrinks, the divine maiden thrusts a sword into the serpent
    and fastens its body in an island block so it cannot again destroy the world.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not specify later ritual or cosmological meaning of the
    fixed serpent.
- id: motif:4
  label: Compelled marriage becomes ancestral union
  taxonomy_refs:
  - sacred_marriage
  basis: Mula Dyadi declares that the divine maiden must marry the refused youth;
    after the youth reaches her village, they marry and become ancestors of mankind.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The marriage is not described as a formal sacred rite; the taxonomy link
    rests on its divine command and ancestral consequence.
- id: motif:5
  label: Descent through cave to hidden sea
  taxonomy_refs:
  - hero_descent
  basis: The raven and later Batara Guru descend through a dark pit in a cave and
