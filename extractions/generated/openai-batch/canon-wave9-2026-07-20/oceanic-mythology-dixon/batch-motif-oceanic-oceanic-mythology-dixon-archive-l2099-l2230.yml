canonical_text:
  quote: ''
  summary: The passage compares Polynesian origin traditions. It describes Maori accounts
    in which Tane seeks progeny, is directed by Papa to gather earth at a beach, forms
    Hine-ahu-one, and takes her as wife; a briefer Maori variant has Tane making a
    woman from mud and sand and breathing into her mouth. The passage then notes similar
    Society Group and Marquesan accounts of a woman made from earth or shore sand,
    and summarizes Cook, Marquesan, and Hawaiian traditions in which humankind descends
    from divine or primordial beings. It ends with an incomplete Tahitian account
    in which Hina asks Taaroa how man is to be obtained.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tane is directed by his mother Papa to go to the ancestor Ocean and gather
    earth at the beach of Kura-waka in the form of man.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tane scrapes up earth at Kura-waka, forms a body with head, arms, legs, and
    belly, and names the female form Hine-ahu-one.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tane takes Hine-ahu-one as wife; she bears Tiki-tohua, described as a bird
    egg from which all birds spring, then Tiki-kapakapa, and then a human child.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In another Maori variant, Tane takes a tree as wife, but the offspring are
    trees rather than humans.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the same briefer Maori variant, Tane makes a woman from mud mixed with
    sand on the beach of Hawaiki, covers her, breathes into her mouth, later finds
    her animated, and makes her his wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Society Group account, Tii makes a woman from earth at Ati-auru, lives
    with her, and becomes parent of a daughter from whom, with Tii-maaraatai, all
    men descend.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that a similar form was current in the Marquesas, where
    Tiki creates a wife for himself from the sands of the shore.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage reports Cook Group and Marquesan examples in which named divine
    or ancestral figures are ancestors of human groups or humankind.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Hawaiian cosmogonic chant is summarized as deriving mankind and the greater
    gods from Bright Light and Pleasant Quiet; a female being of cosmic origin is
    parent of gods and of Kii, ancestor of all men through union with his mother.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Another Hawaiian version says La'i-la'i is begotten of Poor Chaos; a sky-deity
    called the King who Opens the Heavens descends, takes her as wife, and from the
    two all men are derived.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Tahitian passage begins with Hina asking Taaroa how man shall be obtained
    because there are no men; Taaroa sends her toward shore or sea and reflects on
    how man should be formed.
  category: speech
  evidence_refs:
  - ev:8
