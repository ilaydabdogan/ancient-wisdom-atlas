canonical_text:
  quote: ''
  summary: The passage summarizes several Australian myths explaining the sun, dawn,
    day and night, and the moon. One account tells how an emu egg thrown into the
    sky ignites firewood, leading the sky-deity to light it daily and appoint dawn
    announcers. Other accounts describe the sun as a woman who ascends, descends,
    visits the dead, or is made by the moon. Moon accounts include theft of the moon
    from a shield and a Queensland story in which the moon helps a trapped Sparrow-Hawk
    before a retaliatory fire is set.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bralgah quarrels with Dinewan, takes one of Dinewan's large eggs, throws it
    into the sky, and the egg breaks on firewood there, causing flame.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sky-deity decides that the sky fire should be lit every day; assistants
    gather wood, the morning star gives notice, and the Gourgourgahgah bird laughs
    at dawn to wake the world.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Arunta and related tribes, the sun is described as a woman who arose
    from the ground, carried a fire-brand, ascended to the sky, descends into the
    earth each night, and emerges again in the morning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among the Narrinyeri, the sun is considered a woman who nightly visits the
    land of the dead, is invited to stay briefly, receives a red kangaroo skin, and
    appears in red dress in the morning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Queensland, the sun is described as a woman made by the moon, with many
    arms visible like rays when she rises and sets.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Some Victoria tribes say the sun originally did not set until a creator deity
    ordered it to set, producing day and night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In an Arunta moon account, an Opossum-totem man keeps the moon in a shield;
    a Grass-Seed-totem man steals the shield and moon, and the Opossum-totem man calls
    the moon to rise into the sky.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In a Queensland moon account, the moon helps free a Sparrow-Hawk whose arm
    is caught in a hollow tree; afterward the Sparrow-Hawk buries the moon for safety
    and sets fire to grass intending to burn the camp.
  category: sequence
  evidence_refs:
  - ev:8
