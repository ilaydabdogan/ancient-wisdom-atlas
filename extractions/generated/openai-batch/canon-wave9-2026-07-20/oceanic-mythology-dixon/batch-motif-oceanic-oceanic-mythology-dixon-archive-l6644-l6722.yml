canonical_text:
  quote: ''
  summary: 'The passage recounts two Tagaro and Meragbuto episodes: Meragbuto ignores
    Tagaro''s tabu on coconuts and is made to eat an inexhaustible coconut until he
    bursts; later Tagaro survives a house fire by hiding with his family in a pit,
    then burns Meragbuto when Meragbuto asks to undergo the same ordeal. The passage
    then discusses possible comparisons between Melanesian wise/foolish brother tales,
    the Polynesian Maui cycle, and the names Tagaro/Takaro and Tangaroa.'
