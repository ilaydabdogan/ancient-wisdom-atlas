canonical_text:
  quote: ''
  summary: 'The passage presents Maori/Polynesian origin material in which named stages
    of night, dawn, day, and space precede the formation of shapeless male and female
    existences, Maku and Mahora-nui-a-rangi. From them comes Rangi, who takes Papa
    as wife and begets gods. A quoted chant traces creation through conception, increase,
    thought, word, night, nothing, empty space, atmosphere, moon, sun, light, and
    Hawaiki. The author then notes variant New Zealand accounts: some have Earth/Papa
    grow from a primeval sea before becoming Rangi’s wife, while others simply assume
    Rangi and Papa and narrate Rangi’s offspring by several wives. In one variant,
    Papa-tu-a-nuku deserts Tangaroa for Rangi; Tangaroa attacks and wounds Rangi,
    who begets more deities while wounded.'
  language: English
  quote_policy: summarized
