canonical_text:
  quote: ''
  summary: The passage recounts Rata's felled tree being restored by forest spirits
    because he omitted proper sacrifices and charms; the spirits later complete his
    canoe. Rata voyages to avenge his father, defeats an island cannibal giant with
    red-hot stones, and kills the arch-cannibal Makutu by nooses at a cave opening
    before returning with his father's bones. The author then compares cannibal incidents
    in New Zealand, Mangaia, Rotuma, and a Tahitian version involving Haumea, Ro'o-nui,
    and Tuture's magic canoe and flight preparations.
