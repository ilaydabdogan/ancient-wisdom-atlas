canonical_text:
  quote: ''
  summary: The passage recounts Tama-nui-a-rangi killing Ruku-tia by beheading, burying
    her head, lamenting her as his dead wife, and later finding her restored to life
    at the burial place in spring, after which they forgive one another. It then begins
    another tale in which Hine, sister of Rupe and wife of Tinirau, is neglected while
    pregnant; Rupe comes in pigeon form and carries Hine and her child away, though
    Hine drops the infant to Tinirau, who raises him. The boy Tu-huru-huru later excels
    at games and is taunted for having no mother.
  language: English
