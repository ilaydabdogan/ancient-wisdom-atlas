canonical_text:
  quote: ''
  summary: The passage first describes an Easter Island tapa figure showing a tattooed
    man, probably connected with ancestral worship. It then recounts a tale in which
    Pare dies after Hutu refuses her request to marry her; Hutu bargains for time,
    goes to the realm of the dead, receives directions and a warning about spirit
    food from Hine-nui-te-po, lures Pare through a pole-and-rope swinging device,
    ascends with her to the world above, and restores her spirit to her corpse before
    marrying her. The source comments that this is a Polynesian and Melanesian form
    of an Orpheus theme. A following fragment about Tura describes his marriage among
    strange nonhuman people, his teaching them the use of fire, and his intervention
    in a dangerous childbirth custom involving obsidian knives.
  language: English
  quote_policy: summarized
