canonical_text:
  quote: ''
  summary: A ghost of a dead brother deceives his brothers by hiding and carrying
    his corpse, then tries to throw the corpse into village houses. At the open house
    of an old woman and her grandson, the corpse and grandson are exchanged until
    dawn, when sunlight endangers the ghost and he is transformed into a wild taro-plant
    while his body becomes bark. The passage then discusses a Melanesian tale type
    explaining peculiar markings or characteristics of animals, plants, or things,
    giving examples of a rat and rail whose conflict explains the rat's tail and the
    rail's head-mark, and a hen, chickens, kites, and a wild yam whose division explains
    good and bad yams.
  language: English
  quote_policy: summarized
