canonical_text:
  quote: ''
  summary: 'The passage concludes a Serungal tale in which rescued animals help him
    complete the rajah''s impossible bride-winning tasks. It then begins a Bornean
    Rakian tale introduced as an example of stories about supernatural women who miraculously
    provide food: Rakian finds a white-bee nest, repeatedly returns home to cooked
    food, and eventually hides to see a beautiful woman emerge from the house.'
  language: English
  quote_policy: summarized
