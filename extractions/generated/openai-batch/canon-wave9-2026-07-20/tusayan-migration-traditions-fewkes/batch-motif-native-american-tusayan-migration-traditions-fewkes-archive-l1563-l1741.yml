canonical_text:
  quote: ''
  summary: The passage lists members of Patki-related groups at Walpi, Sichumovi,
    and the Patki clan in Sichumovi. It then reports that the Piba, Tabo, and Sowi
    clans are given a southern origin, are associated by some traditionalists with
    Squash and by others with the Water-house or Rain-cloud group, and are said to
    have had former homes on the Little Colorado near Winslow, probably at Cakwabaiyaki
    near Chevlon fork. It further notes statements about Piba people at Awatobi and
    Pakatcomo, names Tapolo as a Piba chief and first Tataukyamu chief at Walpi, and
    says Hani claims descent from Tapolo. A footnote states that Tapolo admitted hostile
    Walpi people into Awatobi before its destruction and later settled in Walpi.
  language: English
  quote_policy: summarized
