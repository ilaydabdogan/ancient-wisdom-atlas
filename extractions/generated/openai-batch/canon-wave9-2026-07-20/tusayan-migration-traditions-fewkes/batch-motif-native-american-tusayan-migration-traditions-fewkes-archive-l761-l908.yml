canonical_text:
  quote: ''
  summary: The passage recounts traditions about Snake-associated clans at Tokonabi
    and Wukoki, marriage connections between Puma, Horn, and Snake people, later clan
    migration, Tcamahia’s quest to find clans emerging from the Underworld, a war
    god’s arrow-message to a sipapu, and Snake-dance ceremonial objects interpreted
    as survivals of former clan associations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the first Snake settlement at the northern base of the East
    mesa may have included Snake, Puma, Dove, and Cactus peoples, with the Snake clan
    dominant and its chief governing the town.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Tokonabi, the Dove, Puma, Horn, and Snake peoples are described as associated;
    some accounts also place the Tiiwa there, while Patki traditions identify the
    Tiiwa as a southern clan related to the Lizard people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Snake legend reports that a Puma youth brought home a Snake-clan girl
    as wife, and that a Horn-clan brother also married a Snake-clan girl.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that offspring of the Snake women did not get along with
    other children at Tokonabi, after which the Puma, Snake, and Horn clans migrated
    southward.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Horn clan separated from the other migrating clans; the Puma and Snake
    clans continued to Wukoki and built a pueblo whose ruins were said still to be
    visible.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: While the Puma and Snake clans lived at Wukoki, Tcamahia left to seek clans
    said to be emerging from the Underworld in the far east.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Sotcaptukwi near Santa Fe, Tcamahia met Piiikonhoya, identified as the
    war god, and told him the object of his quest.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Piiikonhoya shot an arrow to a sipapu or orifice in the north, where people
    were emerging from the Underworld.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The arrow returned with a message that the clans would travel southwest and
    that Tcamahia should go west if he wished to join them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tcamahia followed the direction, met the clans at Akokaiobi/Acoma, and is
    said presumably to have joined them there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narrator said the name Tcamahia signified the “Ancients”; the same term
    is used for stone celts arranged around the Antelope altar sand picture.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: During altar songs, a Sand-clan priest rapped the floor with one of the stone
    objects, said to be telegraphing to Acoma for Tcamahia to join the Snake ceremony.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the eighth and ninth days of the Snake dance, Tcamahia came and acted as
    asperger at the kisi or brush shelter, calling out a Keres invocation to warriors.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The author interprets the asperger as personating the old Tcamahia of Wukoki,
    who left the Snake clans to seek fortune in the east and found it at Acoma.
  category: other
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage names Puma and Sand as clans associated with the Snake at Wukoki
    and treats the Puma fetish, mountain-lion sand picture, and Puma-man personation
    as indications of a former Puma-Snake association.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage identifies antelope heads, snake fetishes, and the names of the
    Antelope and Snake fraternities as evidence of contact between Horn and Snake
    clans.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: The passage says Snake-dance paraphernalia gives totemic evidence of composition
    from at least Puma, Horn, and Snake clans.
  category: other
  evidence_refs:
  - ev:11
