candidate_motifs:
- id: motif:1
  label: Marriage alliance joining clans
  taxonomy_refs: []
  basis: The legend describes Puma and Horn men marrying Snake-clan girls, after which
    other members of the girls’ clan are said to have joined Puma-Horn settlements.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents this as clan tradition and includes the author’s
    theoretical aside about affinity; the extraction does not treat that aside as
    established fact.
- id: motif:2
  label: Clan departure and migration after internal conflict
  taxonomy_refs:
  - departure
  basis: Conflict among children at Tokonabi is followed by the southward migration
    of Puma, Snake, and Horn clans, with subsequent separation and settlement at Wukoki.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is a social-migration motif in a clan legend rather than an individual
    hero departure.
- id: motif:3
  label: Emergence from the Underworld through an opening
  taxonomy_refs:
  - ascent
  basis: Clans are said to be emerging from the Underworld through a northern sipapu
    or orifice.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage reports the emergence as part of the narrated tradition and
    does not elaborate the full emergence myth here.
- id: motif:4
  label: Quest to find emerging clans
  taxonomy_refs:
  - mystical_quest
  basis: Tcamahia leaves Wukoki to seek clans emerging from the Underworld, asks the
    war god for help, and follows the direction returned by the arrow-message.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The quest is stated briefly and in a migration-tradition context; its
    ritual or initiatory dimensions are not specified in this excerpt.
- id: motif:5
  label: Projectile as message bearer
  taxonomy_refs: []
  basis: Piiikonhoya’s arrow is sent to the sipapu and returns with a message directing
    Tcamahia westward.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: No available motif-family taxonomy ref directly names a messenger arrow.
- id: motif:6
  label: Ritual object as long-distance message bearer
  taxonomy_refs: []
  basis: A Sand-clan priest raps a stone tcamahia to “telegraph” to Acoma, and the
    note compares the arrow episode to the paho or prayer stick as a message bearer.
  evidence_refs:
  - ev:7
  - ev:12
  confidence: medium
  cautions: The paho comparison appears in a note and the telegraphing explanation
    is reported as what was said; the exact ritual theory is not developed here.
- id: motif:7
  label: Ceremonial personation of ancestral clan history
  taxonomy_refs: []
  basis: Tcamahia appears as asperger in the Snake dance, and the author interprets
    this as personation of the old Tcamahia of Wukoki; other objects are likewise
    interpreted as survivals of clan associations.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: This motif depends partly on the author’s interpretation of ceremonial
    paraphernalia rather than solely on the quoted tradition.
- id: motif:8
  label: Snake or serpent totemic ritual identity
  taxonomy_refs:
  - serpent
  basis: The passage centers on the Snake clan and Snake legend and cites snake fetishes
    and the Snake fraternity in Snake-dance paraphernalia.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:10
  - ev:11
  confidence: medium
  cautions: The evidence concerns a named Snake clan and ritual fetishes; it should
    not be generalized into all serpent mythology without further passages.
