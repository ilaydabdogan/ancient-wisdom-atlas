canonical_text:
  quote: ''
  summary: The passage describes Sumaikoli priests and cult as connected with katcinas
    and attributed to New Mexican introduction, then outlines East Mesa ritual calendars
    for Walpi, Sichumovi, and Hano. It emphasizes that Walpi ritual, especially Powamu,
    was modified by Asa and Hano clans; that Sichumovi ritual contains eastern pueblo
    and Zuni elements; and that Hano ritual is a fragmentary survival from its Rio
    Grande home, with katcina personators visiting Walpi and Sichumovi kivas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sumaikoli priests and cult are described as closely connected with katcinas
    and as supposed to have been introduced into Tusayan from New Mexico.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Walpi is identified as the only East Mesa pueblo where a true Hopi ritual
    is celebrated, while also being strongly affected by intrusive clans of other
    stocks.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Walpi Powamu differs greatly from the Oraibi performance
    and that Asa and Hano clans were important in producing this modification.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Walpi ritual calendar lists observances across the year, including Winter
    Snake or Flute, Powamu, Sumaikoli, abbreviated Katcina observances, Niman-katcina,
    Snake or Flute dance in alternate years, Lalakonti, Mamzrauti, Wiiwiitcimti or
    Naacnaiya, Soyaluna, and Momtcita.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sichumovi ritual calendar includes Pamu'ti or Zuni Return Katcina, Powamu
    with katcina visitors to Walpi kivas, Palülüikonti, abbreviated Katcina observances,
    occasional Sio Calako, occasional Bulintikibi, occasional Owakülti, and Soyaluña
    contribution to Walpi celebration.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says that Tewa, Asa, and Honani clans predominate in Sichumovi
    and that katcinas largely predominate in this pueblo.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bulintikibi is described as intrusive, unlike Hopi ceremonies, and almost
    identical with one still celebrated in eastern pueblos; Sio Calako is described
    as an incorporated and greatly abbreviated Zuni observance.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Hano ritual calendar lists abbreviated Katcina observances, Powamu katcina
    visitors to Walpi kivas, Palülüikonti, abbreviated Katcina observances, Tawa-paholawu
    as sun prayer-stick making, Sumaikoli, occasional Howina, Tantai as winter solstice
    rites, and a Warrior celebration.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hano ritual is described as a fragmentary survival of the ritual at Tcewadi,
    the Rio Grande home of the Hano clans.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Hano January and February celebrations take the form of katcina personations
    visiting Walpi and Sichumovi kivas as well as Hano kivas.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that no katcina altar had yet been seen at Hano and that
