canonical_text:
  quote: ''
  summary: The passage summarizes accounts about the Honau or Bear clan and the Kokop
    clans. Kotka says the Bear clan came early from Muiobi in the Rio Grande region
    and overcame Masauu. The author interprets the Bear clan as an eastern Pueblo
    migrant group that settled at a site assigned by the Kokop. The passage also records
    the small surviving Honau membership in Walpi. It then describes Kokop traditions
    and archaeological statements about Sikyatki, accounts of its overthrow by Walpi,
    Snake traditions in which Masauu formerly owned the land and gave title to the
    Walpi site after being overcome, and Kokop origin accounts from Jemez and other
    places.
  language: English
  quote_policy: summarized
