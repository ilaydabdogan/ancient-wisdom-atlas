    there as the ancient owner of Tusayan.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author regards the Bear clan as an eastern Pueblo group that migrated
    to Tusayan early, founded a pueblo on a site assigned by the Kokop, and lived
    with the Kokop in friendship until the advent of the Snake people.
  category: sequence
  evidence_refs:
