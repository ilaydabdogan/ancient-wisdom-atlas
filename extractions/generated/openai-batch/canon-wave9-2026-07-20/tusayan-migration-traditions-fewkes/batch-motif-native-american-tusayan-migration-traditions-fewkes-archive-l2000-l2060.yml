- id: obs:3
  text: 'The passage states that only three Honau clan members remain in Walpi: Masaiumci,
    Kotka, and Honsi; it adds that Honsi has no children and that the clan may become
    extinct when the chief and his sister die.'
  category: relationship
  evidence_refs:
