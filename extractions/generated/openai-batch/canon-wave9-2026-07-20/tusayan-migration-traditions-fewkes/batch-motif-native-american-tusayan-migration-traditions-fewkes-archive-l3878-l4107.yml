  summary: The passage describes the Snake dance at Walpi as an old ritual modified
    through contact with other clan rituals and now functioning as a prayer for rain
    and corn growth. It lists members of Antelope and Snake societies by individual
    and clan. It then discusses migrations of clans from the south to Tusayan, especially
    movements associated with Apache raids in southern and central Arizona, and notes
    that refugee clan groups joined the Hopi after abandoning southern pueblos.
