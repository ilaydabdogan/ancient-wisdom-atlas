canonical_text:
  quote: ''
  summary: The passage describes the Horn and Flute clans as a composite addition
    to Old Walpi, recounts a Flute ancestor’s descent to the Underworld and marriage
    in the Sun-house, traces the Horn-Flute migration through named places to Walpi,
    and describes a present Flute ceremony that reenacts parts of this migration and
    approach to Walpi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first addition to the Bear and Snake settlement at Old Walpi is identified
    as a composite group of Ala, or Horn, and Lenya, or Flute, clans.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Horn-Flute legends are described as composite and connected with two cultus
    heroes, the Deer youth and the Mountain-sheep youth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: One of the two cultus-hero figures is described as a Horn clan boy who married
    a Snake girl, and the other as the male ancestor of the Flute clans.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Flute legendists say that their ancestor descended to the Underworld, drew
    a maid to him by playing a flute, married her in the Sun-house, and that she became
    the mother of the Flute clan.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After separating from the Snake people during a southward migration from Tokonabi,
    the Horn clans went to Lokotaaka, then Kisiwi, then Monpa, and later westward
    to Lenyanobi, where they united with Flute people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The combined Horn-Flute clans moved from Lenyanobi by way of Wikyaobi and
    Kwactapabi, then toward Walpi by Wipo, Kanelba, and Lenyaciipu or Kokyanba.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Kwactapahu, the chief sent Alosaka to scout west and south; Alosaka returned
    with a report of the Snake town at Old Walpi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Horn people recognized the Snake people as kindred, abandoned Kwactapahu,
    and the combined Horn-Flute clans were received by the Snake villagers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says the present Hopi Flute ritual at Walpi dramatizes the union
    of the Kwactapahu clans and the people of Old Walpi.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the seventh day of the Flute ceremony, the Flute chief and members of the
    Flute priesthood visit named springs and places associated with the latter part
    of the migration route, sleep at the Flute house, and make offerings at Kwactapahu.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After rites at Kwactapahu, the Flute priests retrace the ancestral route,
    halt at intervals, place the tiponi on the ground, and make symbols of rain clouds
    nearby.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Near the northern trail into Walpi, the incoming personators find a line of
    meal drawn across the trail, symbolizing that no one can enter the pueblo.
  category: object
  evidence_refs:
  - ev:7
