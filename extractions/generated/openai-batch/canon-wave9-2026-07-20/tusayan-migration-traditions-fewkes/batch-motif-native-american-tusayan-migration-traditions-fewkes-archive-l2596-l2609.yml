canonical_text:
  quote: ''
  summary: The passage cites Bandelier as relevant to a claim by Asa traditionists.
    Bandelier is quoted as saying that modern Abiquiu stands nearly on the site of
    an ancient village; that the town was built partly by Genizaros or Indian natives
    whom Spaniards rescued or purchased from captors; and that the Tehuas of Santa
    Clara say most of these Genizaros came from the Moquis and that the old pueblo
    was called Josoge. The passage then states that Asa legends claim the site or
    vicinity of Abiquiu as their Rio Grande home.
