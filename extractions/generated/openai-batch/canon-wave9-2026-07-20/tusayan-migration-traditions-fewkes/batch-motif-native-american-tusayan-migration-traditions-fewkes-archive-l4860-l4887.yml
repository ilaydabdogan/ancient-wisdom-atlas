  quote: masked personations— men wearing helmets or masks to personate supernatural
    beings
  summary: The passage describes the Walpi katcina cult as distinct because of masked
    personation. It says the cult was not introduced by a single clan group but by
    several groups over time, with elements introduced by named clans and sometimes
    purchased or borrowed from neighboring tribes. It identifies the Powamu and Niman
    as major nine-day katcina celebrations linked to the Katcina or Anwuci/Crow clans,
    and states that important katcinas came from the east, from New Mexican pueblos
    where related ceremonies survive in modified form.
