- id: obs:10
  text: Modern survivals of early Tokonabi-associated rites are identified as the
    Snake dance in August of odd years and certain January ceremonials of the same
    years.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The early Walpi population is described as including Snake-Horn and Bear groups,
    and probably all males older than young boys participated in the Snake dance.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Snake and Antelope societies are now described as open to members of all
