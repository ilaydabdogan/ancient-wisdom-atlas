canonical_text:
  quote: ''
  summary: The passage first gives a list and totals for Hano clans. It then describes
    Walpi religious societies, their membership, and attributed origins. Katcina dances
    are described as including all men and older boys, while Soyaluna includes all
    families. Several societies are assigned to origins such as Tokonabi, Palaikwahi,
    Little Colorado pueblos, eastern pueblos, Zuni, Jemez, Keres pueblos, Navaho,
    and Havasupai. The Tokonabi-derived Horn-Snake clans are represented by Snake
    and Antelope priestly societies, which are described as old Walpi fraternities
    preserving rites associated with Tokonabi. The Snake dance, January ceremonies,
    clan expansion beyond original limits, and bear and puma personations in secret
    ceremonies are noted.
  language: English
  quote_policy: summarized
