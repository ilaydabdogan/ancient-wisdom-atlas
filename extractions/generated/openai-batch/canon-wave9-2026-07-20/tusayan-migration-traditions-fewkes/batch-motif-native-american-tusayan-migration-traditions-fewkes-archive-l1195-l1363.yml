candidate_motifs:
- id: motif:1
  label: Clan migration in search of new homes
  taxonomy_refs:
  - departure
  basis: The passage repeatedly describes clans leaving Little Colorado or southern
    settlements, moving northward to Hopi pueblos or eastward to Zuni, and the Patun
    clans migrating in quest of homes in northern Tusayan.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage mixes migration tradition with documentary and ethnographic
    discussion; it is not a single mythic narrative episode.
- id: motif:2
  label: Abandoned settlement followed by relocation
  taxonomy_refs:
  - departure
  basis: The Little Colorado pueblos were not abandoned at the same time, and the
    Squash settlement at Tcukubi was later abandoned with residents moving to Old
    Mishongnovi, Awatobi, and Walpi.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: This is a historical-traditional migration pattern rather than a fully
    elaborated symbolic narrative.
- id: motif:3
  label: Sacred cult transmitted by migrating clans
  taxonomy_refs:
  - sacred_exchange
  basis: The passage says the Alosaka cult originated in the south and was introduced
    into Tusayan from Little Colorado settlements by Squash and kindred Flute clans,
    then maintained by other clans at Walpi.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The taxonomy mapping is broad; the passage describes transmission and
    custodianship rather than an exchange scene.
- id: motif:4
  label: Horned germ god in seasonal and renewal ceremonies
  taxonomy_refs:
  - seasonal_cycle
  basis: Alosaka is identified as a germ god, is personated in Flute observance, appears
    in New-fire and Winter-solstice contexts, and is represented with artificial horns
    and Mountain-sheep personation.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage names ceremonial settings but does not narrate a full seasonal
    myth or explain the ritual theology.
- id: motif:5
  label: Ritual flower mounds in Underworld society-origin legends
  taxonomy_refs: []
  basis: The passage notes that similar flower mounds are constructed in the Underworld
    in Piba and Patun legends about the origin of the Tataukyamu, Wiiwiitcimtu, and
    Mamzrautu societies.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: Only a brief reference is given; the actual Underworld narrative is not
    included in this passage.
- id: motif:6
  label: Gendered complementary sacred figure
  taxonomy_refs:
  - duality
  basis: Tuwapontumsi is described as a female complement of the double-horned Alosaka
    through a two-horned totem figure and shrine reference.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This rests on one reported totem figure and its interpretation within
    the passage.
