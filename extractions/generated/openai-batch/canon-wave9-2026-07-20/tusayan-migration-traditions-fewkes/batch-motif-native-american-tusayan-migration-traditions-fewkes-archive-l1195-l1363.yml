canonical_text:
  quote: Among the first clans to migrate ... were the Patun or Squash clans.
  summary: The passage describes Hopi clan migration traditions linking Little Colorado
    pueblos with clans from the far south or Palatkwabi. It recounts movements of
    Squash/Patun, Flute/Lenya, Patki, Piba, and related clans to Hopi pueblos and
    Zuni, and discusses ritual evidence for the southern origin and transmission of
    the Alosaka cult, including horned figures, flower mounds, shrines, shields, and
    Awatobi figurines.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that Little Colorado pueblos were settled by clans from
    the far south, or Palatkwabi.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some pueblos along the Little Colorado due south of Walpi were inhabited until
    near the close of the seventeenth century and were not all abandoned at the same
    time.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After abandonment or migration, some clans went northward to Hopi pueblos
    and others eastward to Zuni.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Patun or Squash group is described as among the first groups to migrate
    northward; it may have been accompanied by the Lenya or Flute.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Squash group settled at the Middle Mesa and Awatobi, while the Lenya were
    later joined by the Ala at Lenyanobi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Patki group is said to have left Homolobi somewhat later; the passage
    discusses the uncertain chronology of Pakatcomo and Awatobi.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Patun or Squash clans originally lived on the Little Colorado and were
    accompanied by the Atoko or Crane and Kele or Pigeon-hawk clans.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Squash clans made a settlement at Tcukubi on the Middle Mesa, later abandoned
    it, and removed to Old Mishongnovi; some went to Awatobi and others eventually
    to Walpi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In their life along the Little Colorado, the Squash clans came into contact
    with other groups; the passage says the Lenya may have preceded them in the journey.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Oraibi Flute altar has a main image described as a figurine with a single
    horn on the head, resembling the pointed helmet worn by the Kwakwantu society
    of the Patki clan.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Many Flute altars have two sand mounds called pollen mounds into which artificial
    flowers are inserted; similar flower mounds are mentioned in Piba and Patun Underworld
    legends about the origin of societies.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Patun legends contain material about the cult of Alosaka, identified in a
    footnote as another name for Muyifiwd, the germ god, and the legends say the cult
    originated in the south.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The personation of Alosaka is said to be prominent in the Flute observance
    at Walpi.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage says there is legendary evidence that Alosaka was introduced into
    Tusayan from Little Colorado settlements by Squash and kindred Flute clans.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: Because Squash and related clans, except the Flute, are extinct at Walpi,
    the perpetuation of Alosaka ceremonies there is said to have fallen to Asa and
    Honani clans, modifying the cult.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The Ala-Lenya group includes a Mountain-sheep clan, and the Aaltu or Alosaka
    wear artificial horns and personate Mountain-sheep in several ceremonies.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:17
  text: In the New-fire ceremony, Alosaka personations observe rites at the shrine
    of Tuwapontumsi, the Earth-altar woman.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: The shrine of Tuwapontumsi is said to contain no statue, but simply a block
    of petrified wood.
  category: object
  evidence_refs:
  - ev:8
- id: obs:19
  text: An old man of the Tiiwa clan made a two-horned figure as his totem and called
    it Tuwapontumsi, described as a female complement of the double-horned Alosaka.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:20
  text: In the Soyaluna or Winter-solstice ceremony, a figure of Alosaka appears on
    the shield of the Ala-Lenya people; an Oraibi screen is similarly decorated, but
    its relation to the Ala-Lenya clans is not determined.
  category: object
  evidence_refs:
  - ev:9
- id: obs:21
  text: The Alosaka cult was practiced at Awatobi, where figurines of Alosaka and
    related legends are known.
  category: action
  evidence_refs:
  - ev:10
