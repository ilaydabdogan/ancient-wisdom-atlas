canonical_text:
  quote: ''
  summary: The passage describes the seven present Hopi pueblos, their locations on
    three mesas, language differences, the historical sites and relocations of Walpi,
    the founding or settlement of nearby pueblos, the abandonment of earlier Walpi
    sites under pressure from enemies and fear of Spanish return, and the effects
    of Spanish contact and missions on Hopi memory and ritual.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The present Hopi pueblos are described as seven in number and situated on
    three table-lands: East mesa, Middle mesa, and Oraibi.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Six villages are said to speak the Hopi language, while Hano speaks a Tanoan
    dialect not understood by the Hopi.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: Walpi is described as the most ancient Tusayan pueblo, with settlement dating
    before the middle of the sixteenth century.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sichumovi is described as settled by foreign colonists about the middle of
    the eighteenth century, and Hano as founded by Tewa clans at the beginning of
    that century.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Oraibi is described as an old pueblo, more modern than Shunopovi, and founded
    by a chief named Matcito from Shunopovi.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A note says Matcito lived for some time in a cave near Oraibi at a rock still
    pointed out.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:7
  text: The first positively identified site of Walpi on East mesa is located below
    the present town on the northern side of the terrace around the rocky height.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The early Walpi population is described as limited to the Snake, Horn, and
    Flute clans when Spaniards first came into the country.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Walpians moved their pueblo one stage higher after finding the earlier
    situation exposed to enemy attacks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The second site of Walpi is called Kisakobi, and a Spanish mission house there
    is called Nucaki.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Old settlement debris contains fragments of old Tusayan ware with pictography
    characteristic of the ancient epoch.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Inroads by Ute from the north and Apache from the south hastened abandonment
    of early sites.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The final move to the top of East mesa is attributed mainly to fear of Spanish
    return after the killing of padres in the Pueblo revolt of 1680.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After abandoning Kisakobi, the Hopi moved habitation to the top of East mesa
