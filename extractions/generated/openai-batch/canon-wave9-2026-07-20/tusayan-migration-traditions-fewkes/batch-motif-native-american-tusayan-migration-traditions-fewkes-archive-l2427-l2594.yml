canonical_text:
  quote: ''
  summary: The passage discusses Pakab clan ceremonial links with Zuni Bow priests
    and then recounts Asa or Tcakwaina clan migrations from the Rio Grande region
    through several pueblos to Zuni, Awatobi mesa, the East mesa, Canyon de Chelly,
    and Walpi/Sichumovi. It includes drought, famine, intermarriage with Navaho, return
    to Walpi, settlement defense obligations, and historical correlations with late
    seventeenth- and eighteenth-century movements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Pakab chief is described as also chief of a warrior society called Kalektakii,
    which Hopi identify with the Zuni Society of the Bow.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Pakab chief has a figurine of Piiukonhoya corresponding to the Zuni Ahaiuta;
    when he sets it in place, his acts are described as identical with those of Naiuche,
    the Zuni Bow chief.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The room where the figurine is kept has wall figures of animals of the cardinal
    points said to be identical with those at Zuni, and the Momtcita public dance
    is said to resemble the Zuni War dance.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that the Momtcita is closely related to the warrior celebration
    of the Zuni Bow priests and may derive from Zuni, a Zuni pueblo colony, or the
    same source as the Zuni variant.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage presents the Pakab, Reed or Arrow, clans as probably the same
    as the Awata, Bow, clans, and as possible founders of Awatobi, while noting that
    definite support is limited to the statement that Pakab people were at Awatobi.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Asa clans are said to have formerly lived near Santa Fe and Abiquiu, to
    have been originally of Tewa ancestry, and to have left the Rio Grande around
    the end of the sixteenth century.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Asa migration route is given as Tukwi/Santo Domingo, Kawaika/Laguna, Akokaiabi/Acoma,
    and Sioki/Zuni, where some of the clan are said still to live under a Zuni clan
    name.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some Asa continued from Zuni to the Awatobi mesa, built Tcakwainaki, and are
    said to have had katcinas with them; they later continued to the East mesa.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Asa are said to have built houses on the East mesa near Wala, then left
    during drought and famine for Canyon de Chelly in Navaho country, where they lived
    in houses now ruined.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Asa intermarried with the Navaho, returned to Walpi, found other Tewa
    clans in their former dwellings, and received a new village site from the Walpi
    chief on condition that they defend it against enemies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Toward the end of the eighteenth century, most women of the Asa phratry moved
