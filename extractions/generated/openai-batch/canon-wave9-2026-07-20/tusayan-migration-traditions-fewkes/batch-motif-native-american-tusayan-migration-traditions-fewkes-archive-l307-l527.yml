  quote: ''
  summary: The passage classifies clans living or extinct in Walpi and Sichumovi by
    their former homes. It lists groups from Tokonabi, Palatkwabi and the Little Colorado,
    and Muiobi/Rio Grande and New Mexican pueblos, then enumerates many clan names
    associated with animals, plants, natural phenomena, ritual beings, and objects.
    It also notes that Sichumovi’s original settlers belonged to the New Mexican pueblo
    group and that their descendants intermarried with Hopi people, losing distinct
    linguistic characteristics.
