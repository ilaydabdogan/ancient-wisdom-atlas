canonical_text:
  quote: ''
  summary: 'The passage describes a symbolic reception of the Flute chief and followers
    at Walpi: Bear and Snake-related chiefs and attendants stand at a marked entrance,
    the Bear chief challenges the arriving Flute chief, the Flute chief claims kinship
    and rain-making songs, ritual emblems are received, prayer offerings are given,
    and a meal line barring entry is removed and remade to show entry is open. The
    narrator then explains this as dramatizing Walpi history and as illustrating a
    ceremonial pattern of returning to old worship places and obtaining water from
    ancient springs for rites. Examples include the Sio-calako ceremony, Kwakwantu
    rites, and Piba/Tataukyamu rites. The passage closes with a roster-like Ala-Lenya/Ala-Lenta
    clan/phratry list divided by men/boys and women/girls.'
  language: English
  quote_policy: summarized
