canonical_text:
  quote: ''
  summary: The passage summarizes conclusions about Hano, Sichumovi, Walpi, and Hopi
    origins. It states that Hano was transplanted from the upper Rio Grande region
    to the East Mesa of Tusayan; that Hano and Sichumovi rituals are intrusive from
    the east and related to Tanoan or New Mexican pueblo traditions; that Walpi’s
    early settlers included Snake and Bear clans, later Horn and Flute elements, southern
    Arizona ritual influences, and eastern colonists seeking refuge; and that a wholly
    northern nomadic origin for the Hopi is questioned.
  language: English
  quote_policy: summarized
