canonical_text:
  quote: ''
  summary: The passage lists names associated with Katcina or Anwuci at Walpi, then
    presents traditions about the Pakab clans. It reports that Pautiwa of the Eagle
    clan said his ancestors came from eastern pueblos and once lived at the ruin called
    Kwavonampi, possibly near Pueblo Ganado and possibly identical with Wukopakabi.
    It discusses a proposed connection between the Pakab or Arrow clan and the Awata
    or Bow clan at Awatobi, notes an account that the Eagle clan abandoned Citaimu
    and divided between Walpi and Mishongnovi, and states that the Pakab Momtcita
    ceremony resembles a Zuni rite.
  language: English
  quote_policy: summarized
