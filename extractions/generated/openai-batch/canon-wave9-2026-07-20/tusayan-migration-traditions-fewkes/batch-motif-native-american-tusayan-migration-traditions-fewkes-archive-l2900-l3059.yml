canonical_text:
  quote: ''
  summary: The passage describes Hano/Tewa settlement on the East mesa near springs,
    lists original Tewa clans and their Hopi/English equivalents, notes correspondences
    with Walpi clan names, recounts legends of Tewa conflict with Ute raiders and
    the naming of Meat mound, and explains a subsequent land division and social details
    of Hano.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tewa/Hano people went to the East mesa and built a pueblo on high land
    near Isba, or Coyote spring; remains of house walls are said to be traceable near
    Sikyaowatcomo, Yellow-rock mound.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: While living at the old pueblo, they used a spring called Unba; another spring
    called Isba, east of old Hano pueblo, is still used by Hano people.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The original Tewa clans are presented in a Tewa-Hopi-English list including
    rain-cloud, tobacco, corn, pine, katcina, sand, pink-shell?, crane, turquoise,
    sun, an uncertain firewood-like entry, bear, and bivalve-shell; some listed clans
    are marked extinct.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that Hano clans named Rain-cloud, Tobacco, Corn, Katcina,
    Sand, and Bear correspond to Walpi clans with the same object-names.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Anote is identified as the present village chief and a member of the Sa/Tobacco
    clan; Kepo is named as his predecessor; Mapibi of the Nan/Sand clan is reported
    as the first Tewa pueblo chief who migrated to Tusayan, and Potan of the Ke/Bear
    clan is said to have succeeded him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Legends of conflicts with the Ute have variants, but are said to agree that
    the Tewa fought and defeated Ute raiders, whose last stand was on a sand hill
    east of the mesa.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Ute are said to have driven captured sheep into the place of their last
    stand and made a rampart from sheep carcasses; the location is named Cikwitu'kwi,
    Meat mound, from that event.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: All but a few Ute, specified as two or four, were killed; the saved men were
    released and sent back with the message that the Tewa bears had come to Tusayan
    to defend it, after which Ute inroads ceased.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: As a reward for helping drive back the Ute, the Tewa were given farming land
    north of a line through Wala, the gap, while Hopi clan holdings are described
    as lying south of that line.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Most Hano people speak both Hopi and Tewa, while Hopi men married to Hano
    women are said not to understand the Hano pueblo language.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: A Sun shrine east of the rock is described as used during the Tantai rite;
    during the Soyaluna ceremony, sun-ladder pahos, raincloud-ladder pahos, and feathered
    strings are placed there.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Isba spring is described as owned by Hano clans; cleaning springs filled
    with drift sand is described as communal pueblo work announced by the town crier
    under the chief's direction, with men working, women cooking food, a feast afterward,
    and old men smoking ceremonial tobacco in ancient pipes.
  category: sequence
  evidence_refs:
  - ev:12
