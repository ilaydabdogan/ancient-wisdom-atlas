  summary: The passage compares several Hopi accounts of the chronological arrival
    of clans at Walpi or into Tusayan, explains some inconsistencies as confusion
    between those two frames, and summarizes an early multi-pueblo history involving
    clan settlement, migration by different routes, kinship union, hostility, destruction
    of rival pueblos, and later removals to Walpi.
  language: English
