  summary: The passage discusses evidence for long Hopi residence in Tusayan, notes
    resemblances between Eototo and Masauu, lists Kokop and Honani clan names, describes
    seventeenth- and eighteenth-century movements of Tewa and Tano people between
    the Rio Grande and Hopi country, and recounts Honani traditions of Tuwanacabi,
    Underworld-emergent katcinas, migration to Oraibi and other pueblos, and dispersal
    after the Awatobi massacre.
