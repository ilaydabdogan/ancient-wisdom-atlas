canonical_text:
  quote: ''
  summary: The passage describes ancient monuments behind rGya, including ruined mchod-rten,
    cremation tablets with sacred formulae in Indian and Tibetan scripts, and a ruined
    monastery. It then records a route past a pre-Buddhist lhatho altar, reports about
    underground graves at Hong containing skulls on pine boards, compares these graves
    with those at Leh and with a burial custom attributed to the Empire of the Eastern
    Women, and describes the ruined monastery of Meru and a tradition that its spirit
    was carried away in a bundle of twigs when it was made the mother monastery of
    Hemis.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Behind rGya, a plateau on the left bank of the brook contains many ancient,
    mostly ruined mchod-rten that the present inhabitants still venerate.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that many of the mchod-rten called Lha-bab-mchod-rten, with
    OCR variants in the passage, go back to Mon times, and contrasts the Mons of rGya
    with neighboring Mons who resisted Tibetan influence.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Several cremation tablets contain the Te dharma formula in Indian inscriptions,
    and others show the same formula in Tibetan characters; two paired examples have
    almost the same design but different scripts.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among the monuments are ruins of an ancient monastery of unknown origin, built
    of sun-dried bricks; the author links the area of rGya to a chronicle notice about
    King Sadna legs building a temple there, while noting uncertainty in the place-name
    translation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Below rGya, the route passes a high lhatho described as an altar of the pre-Buddhist
    religion, near a few houses and fields.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Hong, a grave site is called Mm-gyi-rom-khang, translated in the passage
    as “graves of the Mons”; dGa-Phun-thsogs reported that as a shepherd boy he entered
    by a staircase into rooms with pinewood boards bearing many skulls.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A native of Hong also reported that the graves were deep and masonry-walled;
    when the expedition inspected them, they saw only pits because local people had
    closed them with earth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The author compares the Hong graves with Leh graves, saying both have masonry
    walls and skulls, and attributes them probably to the period of the “Empire of
    the Eastern Women.”
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The author infers from skulls placed on boards that the corpses may have been
    cut to pieces, and notes that Leh graves had skulls and bone vases originally
    placed on boards.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The next village, Meru or Miru, has a ruined monastery on a hill above the
    trade road, with the temple at the top of a small conical hill and ruined monks’
    cells below it.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:11
  text: The passage says Meru was once an important monastery of Ladakh, with unknown
    founder, and that it lost glory when King Seng-ge-rnam-rgyal made it the “mother”
    of the Hemis monastery; on that occasion its “spirit” was carried off in a bundle
    of twigs.
  category: sequence
  evidence_refs:
  - ev:12
