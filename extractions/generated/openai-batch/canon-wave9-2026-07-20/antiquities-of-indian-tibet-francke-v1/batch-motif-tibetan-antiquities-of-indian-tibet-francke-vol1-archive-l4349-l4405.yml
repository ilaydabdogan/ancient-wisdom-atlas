canonical_text:
  quote: ''
  summary: The passage describes Alchi temple spaces and decoration. Lha-khang-so-ma
    is a small square hall with a central mchod-rten, old frescoes, unusual turbaned
    figures, and unread Takari inscriptions. gSum-thsag is a three-storied stepped
    temple with old wooden gallery work, trefoiled arches, mythological carvings,
    Buddhist images, large Bodhisattva stuccoes, and a sixteenth-century restoration
    under King bKra-shis-rnam-rgyal. The restoration is described as preserving older
    outlines while adding varied colors and Mughal-style secular scenes. A further
    temple, xEam-par-snang-mdzad, is noted as hidden and not usually shown to foreigners.
  language: English
  quote_policy: summarized
