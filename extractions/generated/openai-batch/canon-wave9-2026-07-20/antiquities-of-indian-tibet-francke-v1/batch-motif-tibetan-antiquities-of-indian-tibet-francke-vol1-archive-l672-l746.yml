  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Barang/Rarang, the Lamaist temple was said to be about twenty-five years
    old and built somewhat in the style of wooden hill architecture, especially in
    its roof.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the temple courtyard were cremation tablets with figures of Avalokitesvara
    represented with four arms and a lotus, and Akshobhya.
  category: object
  evidence_refs:
  - ev:4
