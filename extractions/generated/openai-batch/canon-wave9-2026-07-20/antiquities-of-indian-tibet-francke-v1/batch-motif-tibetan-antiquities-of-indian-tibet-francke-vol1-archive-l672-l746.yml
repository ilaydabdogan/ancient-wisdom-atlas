canonical_text:
  quote: ''
  summary: The passage describes Lamaist roadside gates, carved standing stones, temple
    objects, and hill-architecture forms in the Pangi, Barang/Rarang, Kanawari, and
    neighboring regions. It records roof-top stupas, frescoes, sun-symbol and stupa
    carvings, cremation tablets with Buddhist figures, an old mandir with elephant
    and ram-head carvings, and a typology of local architectural forms with several
    cautious visual comparisons.
  language: English
  quote_policy: summarized
literal_observations:
