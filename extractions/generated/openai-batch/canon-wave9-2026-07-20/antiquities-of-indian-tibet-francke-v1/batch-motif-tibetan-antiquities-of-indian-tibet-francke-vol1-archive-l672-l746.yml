  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The gable-roof of the old mandir ends in a carving of a ram’s head.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Hill architecture is described as using rubble masonry and cedar-wood beams
