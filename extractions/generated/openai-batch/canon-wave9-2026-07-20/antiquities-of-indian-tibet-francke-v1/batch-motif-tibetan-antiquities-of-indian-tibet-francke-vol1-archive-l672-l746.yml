  text: Near Pangi there is a Lamaist gate built across the road, with a mchod-rten
    on the roof and frescoes on the ceiling.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kanawari examples of these gates have elegant wooden roofs built over
    the mchod-rten to protect it from rain, giving the roof some resemblance to a
    Chinese roof.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The gates are locally called kang-ga-ni; in Ladakh, the same name is given
    only to the most ancient specimens.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Close to the Pangi gate are two large erect stones, perhaps rude lingams,
    bearing carvings copied by the narrator.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: One standing stone has a distinct carving interpreted by the narrator as a
    kind of sun-symbol; the other has a carved stupa and what appears to be a repetition
