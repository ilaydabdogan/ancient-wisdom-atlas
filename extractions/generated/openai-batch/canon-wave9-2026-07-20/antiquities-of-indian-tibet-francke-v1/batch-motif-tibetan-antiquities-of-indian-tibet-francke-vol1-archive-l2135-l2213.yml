canonical_text:
  quote: ''
  summary: The passage recounts travel from Tabo to Phog, Drangkhar, and Kaze, noting
    inscriptions, monasteries, statues, frescoes, a stuffed goat skin attributed to
    spirit possession, a rocky fortress-town and local conquest tale, an old willow
    rope bridge, and a high rock-side monastery associated with Sa-skya-pa patronage
    by the Nonos of Spiti.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A votive inscription from the time of a Tsaparang king was found on a mani
    wall outside Phog.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nathang monastery stands across the Spiti river amid terraced fields and is
    built in three narrowing stories, described as like a three-step pyramid.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The monks at Drangkhar claimed the monastery was older than Tabo and earlier
    than Srong-btsan-sgam-po, and explained the absence of ancient relics by repeated
    plundering.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The central hall contained three probably modern stucco statues representing
    Byams-pa, Buddha, and the lama Chos-drag.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Frescoes on the temple walls could be distinguished as ’Od-dpag-med, Padma-sambhava,
    and dGe-bai-bshes-gnyen.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A stuffed goat skin hung above the monastery entrance; informants said the
    goat had sometimes been possessed by a spirit, jumped unusually, was kindly fed
    by monks, and was stuffed after death as a memorial.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Drangkhar stands on the top of a rocky spur, with the castle at the uppermost
    place; local tales say the site was captured by the Spiti people and its inmates
    were thrown down from the rock.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Near Lithang, an old-style rope bridge plaited of willow branches was seen.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Kaze side-valley monastery is high on rocks, belongs to the Sa-skya-pa
    order, and is connected with the name Gong-mig, explained as “the upper eye.”
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Kaze monastery had been favored by the Nonos of Spiti, compared in the
    passage with Ladakh kings favoring the ’aBrug-pa order of lamas.
  category: relationship
  evidence_refs:
  - ev:10
