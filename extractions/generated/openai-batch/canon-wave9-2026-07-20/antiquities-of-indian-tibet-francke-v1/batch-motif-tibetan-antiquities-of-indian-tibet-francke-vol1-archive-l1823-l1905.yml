canonical_text:
  quote: ''
  summary: The passage describes inscriptions, mountains, local beliefs about an invisible
    spirit abode on the Purgyul/Gung-ri mountains, rock carvings near Lhari, and architectural
    and iconographic features of Tabo monastery, including mchod-rten rows, cave-like
    winter houses, Vairochana, medallion figures, and Ganesha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A large stone inscription near Horling mentions Tsongkhapa, Byang-chub-’od,
    Rin-chen-bzang-po, and Tabo monastery; the author states that this shows a 15th-century
    belief in a connection between Tabo monastery and the priest-kings of Guge.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A local ditty ranks Kailasa as king of glaciers, Purgyul as king of mountains,
    and Manasarowar as king of lakes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Coolies from Chang identify the Purgyul mountain group, here called Gung-ri,
    as the fabulous ’aBa-yul, an abode of spirits with numerous inhabitants.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ordinary people cannot see or hear the inhabitants of ’aBa-yul; very good
    men or lamas may hear voices or ghostly dogs near the region of eternal snow,
    while seeing nothing.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author connects the mountain-spirit tale with inscriptions referring to
    Kailasa as an abode of arhats, and states that ice mountains are regarded as abodes
    of gods and of the dead who acquired paradise.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ancient rock-carvings below Lhari include ibex and svastika forms.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: One Lhari carving appears to represent the 'willow of the world' with six
    branches and six roots, described as a pre-Buddhist symbol.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Another Lhari symbol appears to represent the sun and the moon.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Near Tabo monastery are rows of 108 small mchod-rten, with one row numbering
    at least 216; the passage calls them forerunners of mani walls in Western Tibet.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The principal hall at Tabo contains a white stucco image of rNam-par-snang-mdzad,
    or Vairochana, made of four complete figures seated back to back.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Along the walls of the principal hall are thirty-two raised medallions with
    life-size stucco figures; the monastery does not presently know whom they represent.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: A Ganesha figure, which the author thinks may have belonged above the door,
    is now on the altar below Vairochana.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The monks first restrict access to the principal hall, then open it after
    the narrator produces two rupees.
  category: action
  evidence_refs:
  - ev:8
