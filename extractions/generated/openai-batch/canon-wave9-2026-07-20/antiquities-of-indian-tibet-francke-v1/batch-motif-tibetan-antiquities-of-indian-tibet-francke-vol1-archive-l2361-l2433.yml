canonical_text:
  quote: ''
  summary: 'The passage first discusses Spiti clan names, house names, and house-deity
    prayers as evidence for migration and early Tibetan or Kulu affiliations. It then
    narrates a difficult journey toward Lake Thsomo Biri of Eubshu: the party crosses
    the high Pharang Pass, encounters glaciers, fissures, mountain sickness, despair
    among servants, aid through clothing and a scarlet blanket, and a dangerous river
    passage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A village population is said to have emigrated from Gilgit, with supporting
    evidence including preservation of a prayer in Eardi to certain house deities.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mr. Lyall is described as having nearly discovered the Spiti institution that
    he called clan and ruspa or bones; the author says clan names vary among villages.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Several Erangkhar clan names are identified as Tibetan, including Khymg-po,
    glossed as Garuda-men, and bLon-chen-pa, glossed as great ministers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: After recovering, the narrator starts on a journey to Lake Thsomo Biri of
    Eubshu, receives provisions from Mr. Howell, and travels to Jugda.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The party crosses the Pharang Pass at 18,300 feet; the narrator and Pindi
    Lai use spare yaks, while the Khansaman and Khalasi walk.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Khansaman and Khalasi become increasingly alarmed by the barren, cold
    country; Pindi Lai tries to raise their spirits by describing Leh, but a Ladakh
    traveller’s longer estimate makes them despair.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: From the pass the party sees glaciers, black rugged peaks, and a labyrinth
    of icy mountain ranges; they must cross glacier cracks and fissures by sliding
    and climbing.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Khalasi suffers acute mountain sickness, lies down on a boulder at the
    edge of the glacier, and is later fetched by Pindi Lai after being noticed missing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: At the Hrathang camp the narrator gives the Khalasi half of a scarlet blanket,
    and Pindi Lai gives him clothing; the Khalasi’s spirits visibly improve.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The next morning the Khalasi is mounted on a yak; the party moves along a
    steep bank of a deep broad river, yaks wade or swim, and Pindi Lai narrowly escapes
    when his horse falls into the river.
  category: sequence
  evidence_refs:
  - ev:10
