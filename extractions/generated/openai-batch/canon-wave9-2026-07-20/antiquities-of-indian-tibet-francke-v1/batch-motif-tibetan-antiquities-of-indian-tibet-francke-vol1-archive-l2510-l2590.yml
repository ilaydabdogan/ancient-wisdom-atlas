canonical_text:
  quote: ''
  summary: The passage summarizes episodes from Ati^a's journey from India toward
    Tibet, including a concealed departure framed as pilgrimage, honor in Nepal, miracles
    against robbers, care for abandoned puppies, a ceremonial reception in Guge, a
    first offering of tea, a stay at Manasarowar, an encounter with Rin-chen-bzang-po,
    later religious reform lineages, and the narrator's travel observations around
    bKor-rdzod and the lake.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Tibetan embassy to Vikrama^ila is said to have been almost robbed of gold,
    and a religious assembly there is described as being outshone by Ati^a.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ati^a concealed his intention of going to Tibet by saying that he was going
    on pilgrimage to the eight places of Buddhist sanctity, which took him to Nepal.
  category: action
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:3
  text: In Nepal, Ati^a was honored by King Ananta-kirti and is said to have performed
    miracles and acts of piety on the journey.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Would-be robbers who wished to assassinate Ati^a were made dumb and motionless
    like statues until he had passed, and at times he lifted himself into the air
    above the saddle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At a deserted camping ground, Ati^a found three abandoned puppies, expressed
    pity for them, carried them in his robes, and resumed his journey.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: When the party entered Guge, one hundred horsemen with white ornamental equipment,
    flags, twenty white satin umbrellas, and musicians welcomed the holy sage in the
    name of King Byang-chub-’od while uttering a sacred mantra.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The eight great places of Buddhist pilgrimage are listed in a note as sites
    connected with Buddha's birth, enlightenment, first sermon, Nirvana, miracle,
    being fed by a monkey, descent from heaven, and subduing a wild elephant.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: On Tibetan soil, Ati^a was offered tea as a solemn offering called a celestial
    drink containing the essence of the wishing tree; he asked its name, received
    an explanation, and praised it as arising from the merits of Tibetan monks.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ati^a stayed seven days at Manasarowar Lake, then proceeded to mTho-lding,
    where he was received by the king with honors.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old lama Rin-chen-bzang-po did not rise when Ati^a approached, but after
    Ati^a displayed his intellectual ability the old monk was described as conquered
    and ready to sit at his feet.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ati^a is said to have later gone to Central Tibet, died at Nyethang near Lhasa
    in 1053 A.D., and to have contributed to the founding of half-reformed Lamaism
    sects, especially the bKa-gdams-pa sect.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The narrator describes travel to bKor-rdzod at the southern and western shore
    of the lake, the sudden appearance of a monastery in a barren desert, abundant
    land animals, no observed living beings in the lake water, aquatic plants attracting
    birds, and fine desolate scenery.
  category: setting
  evidence_refs:
  - ev:8
