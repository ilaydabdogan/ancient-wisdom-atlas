canonical_text:
  quote: ''
  summary: 'The passage describes a journey from Leh toward sNyemo and surveys antiquarian
    remains at Spithug, Phyang, and Daru: monasteries, ruins, stupas, inscriptions,
    reliefs, a flagstaff refuge, mani walls, votive stones, horse-shelter huts, and
    rock sculptures used for historical dating.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The expedition left Leh on 21 September and marched toward sNyemo; below Leh
    the road passed the rock at Spithug.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: King ’aBum-lde is said to have built a monastery on the Spithug rock about
    500 years earlier; entry required special permission from an aKu-shog or sKu-shog,
    so the party did not visit it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The same rock had ruins of an older building on top, probably a castle, and
    the plain below had a ruined ancient-type mchod-rten containing cremation tablets
    shaped like miniature stupas.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The cremation tablets bore an inscription in Indian characters; Pandit Mukund
    Ram of Kashmir read it as the Ye dharma formula in an early Devanagari type.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The western prominence of the Spithug rock had very flat reliefs representing
    bTsong-kha-pa and his disciples.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author states that later studies led him to identify Phyang or Phyi-dbang
    with Phyi-dbang-stag-rtse, described as the earliest capital of Tibet in the Ladakhi
    account of gNya-khri-btsan-po’s kingdom.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Phyang monastery is described as a later stately building erected by King
    bKra-shis-rnam-rgyal and belonging to the ’aBrikhung-pa sect.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Near the right bank of the Phyang brook, King bKra-shis-rnam-rgyal raised
    a long flagstaff on an elaborate pedestal.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The chronicles are said to describe the flagstaff as a refuge for people guilty
    of crimen laesae majestatis.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The author says King bKra-shis-rnam-rgyal had plucked out his elder brother’s
    eyes and deprived him of royal power.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The flagstaff pedestal still remained and was generally known as Thar-chen,
    translated as “great flag.”
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: At Daru, mani walls contained votive stones naming King bDe-ldan-rnam-rgyal
    and minister Thse-dbang-don-grub.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Small ruined houses built at one end of the Daru mani walls were called Mani
    Khang and had served as hospital stables for horses exhausted on the march across
    the plain.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The party examined and photographed the Daru rock sculptures, and the author
    relates their dating to inscriptions at Leh and names on the Daru rock, including
    Lha-chen-kun-dga-rnam-rgyal and Phyag-rdor-jo.
  category: action
  evidence_refs:
  - ev:8
