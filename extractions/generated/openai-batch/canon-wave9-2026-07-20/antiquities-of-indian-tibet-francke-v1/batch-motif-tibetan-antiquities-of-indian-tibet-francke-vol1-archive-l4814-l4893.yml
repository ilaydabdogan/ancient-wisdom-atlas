canonical_text:
  quote: ''
  summary: The passage describes ruined castles, temples, inscriptions, carvings,
    and ritual survivals in the Kharbu and Chigtan areas. It records a local tale
    of an unfinished dark temple built by two lamas, notes rows of one hundred and
    eight mchod-rten, describes Chigtan castle carvings including a Naga-devouring
    Garuda, and describes an old Buddhist monastery where medallions, inscriptions,
    offerings, lamps, and worship continue under the care of Muslim descendants of
    former Buddhist keepers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ruined castle of Stag-rtse stands on a steep rock and is described as
    having belonged to the chiefs of Chigtan; it was probably destroyed by bDe-ldan-rnam-rgyal
    of Ladakh.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ruined Mun-dig-lha-khang, called the dark temple, lies between Kharbu
    and Stag-rtse and is described with two doors, detached doorways, and nearby ruined
    rows of one hundred and eight mchod-rten.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A local informant said the dark temple was built by two lamas after the model
    of the Chigtan temple; one went to Lhasa and the other to Kashmir to buy fresco
    colours, both died away from home, and the temple was never completed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The observer saw no traces of frescoes or raised medallions in the dark temple
    ruin and notes that the ruin was roofless.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The old castle of the chiefs of Chigtan stands on a steep cliff above the
    ruins of the old town; several doors and windows had Tibetan-style wood carvings,
    including two inner-court carvings said to portray two architects, father and
    son.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A wooden board in one castle room was carved with the figure of a Naga-devouring
    Garuda.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Two stone slabs among the old town ruins carried faulty Tibetan inscriptions;
    one concerned remission of taxes and forced labour and named Adam Malig of Chigtan.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The old Buddhist monastery of Chigtan is compared in type to monasteries of
    Rin-chen-bzang-po's time and attributed to the bKa-gdams-pa epoch; it has thirty-nine
    raised medallions, formerly with stucco images, which were destroyed when Chigtan
    adopted the Muhammadan religion.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The monastery walls preserve traces of Tibetan, Arabic or Persian, and Sarada
    inscriptions, including a Sanskrit Sarada inscription in which the readable words
    included army and inflated skins.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: An altar or lhatho stands before the medallions, ornamented with pencil cedar
    twigs, with brass cups of butter offerings placed below it.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: The monastery hall has four plain pencil cedar pillars and an elaborately
    carved Indian-style door showing Buddhist saints whose identities could not be
    determined because of decay.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: Two Muhammadans, said to descend from the former Buddhist keepers, were in
    charge of the temple; they light butter-filled lamps and tend the altar, while
    Buddhist neighbours from Da and Hanu still visit and adore the old deities.
  category: relationship
  evidence_refs:
  - ev:11
