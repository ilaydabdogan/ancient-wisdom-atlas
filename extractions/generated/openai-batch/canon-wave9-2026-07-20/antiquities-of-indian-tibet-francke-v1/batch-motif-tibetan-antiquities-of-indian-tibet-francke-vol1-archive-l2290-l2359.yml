canonical_text:
  quote: ''
  summary: The passage reports an ancient temple ruin near Kyibar named Lha-bla-mai-dgon-pa,
    with a local tradition that King Lha-bla-ma, or gods and lamas, built it in one
    night. It then summarizes inquiries about Spiti monasteries, especially Pyin and
    its Bu-rzhan lamas, their streamer head-dress, a comparison with King Ralpacan's
    streamers, links to older Lamaism and Bon, conjuring feats, and Spiti clan institutions
    involving exogamy, cremation, and memorial monuments.
  language: English
  quote_policy: summarized
