canonical_text:
  quote: ''
  summary: 'The passage describes archaeological and religious sites near Leh: a ruined
    building called the “Temple of Punishment,” a yellow mchod-rten used as a receptacle
    for old ritual and manuscript materials, the hilltop ruins and temples of rNam-rgyal-rtse-mo,
    inscriptions and images in a Maitreya temple, and the red temple of the Four Lords
    with images including Vaiśravaṇa and a fresco showing him in union with his śakti.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A large ruined building called Chad-pai-lha-khang, glossed as “Temple of Punishment,”
    stands in the desert between Skara and Spithug on a plateau below the western
    mountain range.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Local information reported that two unnamed men were ordered to build the
    temple as punishment for a crime.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Temple of Punishment site has no remaining woodwork and no traces of images
    or frescoes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A large yellow mchod-rten called Ma-ni-gser-mo stands in the desert east of
    Leh and has a niche with a complete seated Buddha figure on the western side of
    the dome.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: An open attached mchod-rten contained fragments of idols, pages of books,
    charms, cremation tablets, and manuscripts.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author states that mchod-rtens of this kind chiefly serve as receptacles
    for old and useless manuscripts and remind him of Jewish Genizas.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The hill behind Leh, rNam-rgyal-rtse-mo, has ruins of a royal palace attributed
    to bKra-shis-rnam-rgyal.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Maitreya temple on rNam-rgyal-rtse-mo contains inscriptions, frescoes,
    and a huge Maitreya statue with fragmentary traces of two additional statues at
    its sides.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A red temple on the same hill, called the temple of the Four Lords, contains
    four figures about three to eight feet high; the principal figure is rNam-thos-sras,
    identified as Vaiśravaṇa.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The four figures were covered with blankets; the blankets were removed except
    for the one covering Vaiśravaṇa, whose image was said to be exhibited only once
    a year.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A lama showed the visitors a wall fresco where Vaiśravaṇa is represented in
    sexual union with his śakti.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Another fresco near the door represented gorgeously dressed men wearing Tarkandi
    turbans.
  category: object
  evidence_refs:
  - ev:5
