candidate_motifs:
- id: motif:1
  label: Saint's bodily imprint sacralizes a landscape feature
  taxonomy_refs: []
  basis: The rock hollow is described as resembling a head-and-shoulder impression
    and is believed to have been formed by Padma-sambhava sleeping there; the rock
    is then worshipped locally.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage reports local belief and worship practice but does not elaborate
    a narrative beyond the saint's journey and sleep.
- id: motif:2
  label: Offering substance applied to sacred object
  taxonomy_refs:
  - sacred_exchange
  basis: People smear oil or butter on the worshipped bLa-ma-guru rock.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage does not state the intended reciprocity or ritual outcome
    of the offering.
- id: motif:3
  label: Buddha sacred birth and first steps iconography
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: The fresco sequence explicitly includes the Buddha's conception, birth, and
    seven steps in the four directions.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage lists the visual subjects but does not narrate the full legend.
- id: motif:4
  label: Funerary Buddhist formula in stupa context
  taxonomy_refs: []
  basis: Cremation tablets with inscriptions containing the Ye dharma formula are
    found in remains of a ladder-type stupa.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage gives the archaeological context but does not explain funerary
    doctrine or ritual use.
- id: motif:5
  label: Royal Buddhist patronage and dynastic display
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage connects kings with temple construction, inscribed portraits,
    royal family frescoes, a major Maitreya statue, a royal library, and a royal historical
    inscription.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: Royal legitimacy is inferred from patronage and display; the passage does
    not explicitly state a legitimating purpose.
- id: motif:6
  label: Monumental Maitreya devotion in royal setting
  taxonomy_refs: []
  basis: Two large Maitreya images are noted at Basgo, including one in the Seljang
    monastery established in the ancient royal palace and erected by King Seng-ge-rnam-rgyal.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage records the images and patronage but provides no mythic narrative
    about Maitreya.
- id: motif:7
  label: Dynastic renaming with shared royal title element
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage suggests the founder of the rNam-rgyal dynasty may have given
    sons names ending in rNam-rgyal and taken such a name himself.
  evidence_refs:
  - ev:1
  confidence: low
  cautions: This is framed as a historical possibility, not a confirmed ritual or
    mythic motif.
comparison_claims:
- id: claim:1
  claim: The ruined temple near Basgo is visually and architecturally compared with
    the Tabo temple, especially through its sun-dried-brick type and thirty-two raised
    medallions.
  claim_level: visual_similarity
  target: Tabo temple / Rin-chen-bzang-po temple type
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives the author's comparison and medallion count but does
    not provide a full architectural survey.
- id: claim:2
  claim: The Basgo and rGyamthsa monastic finds are presented as belonging to the
    same period because the cremation tablets use the Ye dharma formula in the same
    ancient Sarada type.
  claim_level: linguistic_similarity
  target: rGyamthsa near Loh monastery finds
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The claim rests on the passage's reported script and formula comparison.
- id: claim:3
  claim: The execution of the Byams-pa temple Buddha-legend frescoes is compared as
    ruder than the paintings on rNam-rgyal-rtse-mo.
  claim_level: visual_similarity
  target: Paintings on rNam-rgyal-rtse-mo
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides an evaluative visual comparison but not detailed
    stylistic criteria.
- id: claim:4
  claim: The male royal figures in the Basgo temple portraits are described as looking
    almost like Mughals, apparently because of their turbans and visual presentation.
  claim_level: visual_similarity
  target: Mughal visual appearance
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: low
  limitations: This is the author's impression from painted figures; the passage does
    not establish cultural contact or iconographic borrowing.
