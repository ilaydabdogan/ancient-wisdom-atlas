canonical_text:
  quote: ''
  summary: 'The passage discusses royal names and inscriptions, then records Western
    Tibetan and Ladakhi antiquities: a worshipped rock believed to bear Padma-sambhava''s
    head-and-shoulder imprint; a castle and abbess sculpture at sNyemo; a ruined temple
    near Basgo compared with Tabo and linked by tradition to Rin-chen-bzang-po; ladder-type
    stupas with cremation tablets and Buddhist formulae; the Byams-pa temple at Basgo
    with Buddha-legend frescoes, royal portraits, Maitreya and Avalokitesvara images;
    and the Seljang monastery in the old royal palace, containing a large Maitreya
    image, jewels, royal library, frescoes, and royal inscriptional remains.'
  language: English
  quote_policy: summarized
