canonical_text:
  quote: ''
  summary: The passage describes local dGra-lha deities around Poo, several forms
    of human and animal sacrifice, the fertility functions attributed to Siva, Kali,
    Ke-sar, and ’aBru-gu-ma, Shar-rgan and Dralang ritual sites with altars and sacrifice
    pits, Poo burial customs including river disposal of some corpses, and a historical
    explanation of kingship succession in Guge, Purang, Zangskar, and mTho-lding.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A class of deities called dGra-lha is described as famous at Poo and nearby
    districts; nine named dGra-lha are said to exist in nine Upper Kanawar villages,
    six male and three female.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Tibetans practiced human sacrifice for treaty oaths
    and for inaugurating or first inhabiting houses, and gives an example of a Poo
    lama reported to have beheaded his sleeping father for a new house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shar-rgan sacrifices and human sacrifices in the Satluj valley and Lahul are
    said to be of a different character from the Tibetan treaty and house sacrifices
    just described.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Siva and Kali in the Himalayas are described as creative powers producing
    harvests and blessing women with children, especially sons.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ke-sar and ’aBru-gu-ma are said to resemble Siva and Kali in that people invoked
    them to grant children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author says the shared child-granting function explains a union between
    Tibetan pre-Buddhist religion and an aboriginal Siva-Kali religion in the Shar-rgan
    hymnal.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Siva and Kali are described as requiring that a portion of what they gave
    be returned to them, including harvest produce, lambs, and children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Poo, child sacrifice is described as formerly required at a festival still
    recognized as thanksgiving for the blessing of offspring.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Lahul, the prayer connected with such sacrifices is described as apparently
    more concerned with thanksgiving for a good field harvest.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The old Shar-rgan place is located above the ancient castle site of Kalagtrung;
    the new Shar-rgan place above the road from Poo to Eizhing has pencil-cedars,
    rough altars, goat and wild antelope horns, and pencil-cedar twigs.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The rough altars at the new Shar-rgan place are said to look like the lha-tho
    of Ladakh.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Dralang place in Poo is used for dancing, has a central pole, lha-tho-like
    features, two perpendicular stones, one possible inscription, one possible rude
    lingam, and nearby pits where children were formerly sacrificed.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Although Buddhist, the people of Poo are said not always to cremate their
    dead; some are buried in above-ground rock-and-stone graves, and some corpses,
    especially of people dying of dropsy, are thrown into the river.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The author asks whether water accumulation in a sick person's body is believed
    at Poo to mean that the Nagas or Klu claim the body.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage explains a royal succession in which King Nyi-ma-mgon divided
    Western Tibet among three sons; after the Guge and Purang ruler died without issue,
    the king of Zangskar seized that country, and Ye-shes-’od is placed in this line.
  category: sequence
  evidence_refs:
  - ev:8
