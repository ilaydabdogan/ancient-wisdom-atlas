canonical_text:
  quote: ''
  summary: The passage recounts medical requests made to the traveling party, describes
    Shipke and its inhabitants, surveys three ruined castles and associated artifacts
    or inscriptions, reports a local legend explaining the crooked plan of one castle
    by a race between a poisonous snake and a scorpion, discusses mani walls and votive
    tablets, and transcribes a regional eulogy naming Jambudvipa, Mount Tise/Kailasa,
    Lake Ma-spang/Manasarovar, the Satluj, and the castle sKu-mkhar.
  language: English
  quote_policy: summarized
