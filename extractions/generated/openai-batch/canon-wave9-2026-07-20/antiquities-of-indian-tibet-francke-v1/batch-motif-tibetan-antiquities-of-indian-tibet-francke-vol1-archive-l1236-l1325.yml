  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The third castle, sKyahs-mhhar or 'castle of refuge,' lies on the road to
    Khyug by the brook and survives only as heaps of loose stones.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Long rows of mani walls on the road from Shipke to Khyug carried votive tablets;
