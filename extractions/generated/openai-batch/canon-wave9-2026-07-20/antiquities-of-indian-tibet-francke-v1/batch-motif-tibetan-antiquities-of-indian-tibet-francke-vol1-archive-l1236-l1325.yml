  text: The second castle, Scng-gB-mKhaT as printed in the passage, stands below mKhar-gog
    on the left bank of the Satluj and combines large fitted stones below with clay
    or sun-dried brick walls above.
  category: object
  evidence_refs:
  - ev:4
