literal_observations:
- id: obs:1
  text: The narrator received a telegram from the Indian Government asking him to
    enter archaeological service for eighteen months beginning 1 June 1909.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator arrived in Simla on 30 May, and Dr. J. H. Marshall spent time
