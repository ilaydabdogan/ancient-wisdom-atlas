  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Preparations were completed on 12 June, and the caravan started for the frontier
    districts on Monday 14 June.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The plan was to cover as much ground as possible and spend a substantial part
    of the summer within Jammu and Kashmir State, where Tibetan antiquities were said
    to exist.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Kashmir State could be entered from Lahul and from Spiti; because Lahul
    had already been investigated by Dr. Vogel, the narrator’s route was to be from
    the Spiti side.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The narrator proposed visiting Tholing and Tsaparang beyond the frontier because
    of their connection with Atiśa and d’Andrada, but this proposal was not sanctioned
    and he was advised to remain within the Indian Frontier.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The expedition party was to include a Government Photographer, Babu Pindi
    Lai, a khalasi, a combined bearer and cook, and a Tibetan assistant for reading
    and copying inscriptions and documents.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says an expedition photographer needed to endure hardship and
    work under adverse circumstances, and states that Pindi Lai justified Dr. Marshall’s
    choice.
  category: attribute
  evidence_refs:
  - ev:3
