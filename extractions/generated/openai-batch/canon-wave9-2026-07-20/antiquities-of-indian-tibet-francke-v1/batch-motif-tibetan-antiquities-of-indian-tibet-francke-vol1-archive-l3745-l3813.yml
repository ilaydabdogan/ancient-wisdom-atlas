  text: A fragment of a copper pot from rNam-rgyal-rtse-mo bore an inscription naming
    a prince, dBang-(nya ?)-gsing dbang-po.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Ladakh chronicles report that an early king placed the bones of Buddha
