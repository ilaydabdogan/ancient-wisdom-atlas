  summary: The passage discusses royal portraits and inscriptions in a Buddhist temple
    at Leh, hKra-shis-rnam-rgyal's relations with the Turkomans, the display of slain
    Turks before temple idols, palace ruins on rNam-rgyal-rtse-mo hill, a chronicle
