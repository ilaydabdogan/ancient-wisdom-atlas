- id: obs:1
  text: A Buddhist temple contains portraits, a gold inscription on indigo paper,
    and identification of King hKra-shis-rnam-rgyal as the temple builder and as a
    ruler shown in Turkoman-style dress.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts Tibetan chronicles and Ladakhi inscriptions, which report
