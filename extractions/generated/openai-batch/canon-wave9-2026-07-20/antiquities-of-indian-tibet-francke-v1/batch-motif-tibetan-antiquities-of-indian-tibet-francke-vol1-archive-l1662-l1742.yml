canonical_text:
  quote: ''
  summary: The passage describes a Nako temple built over an oversized natural footprint
    attributed to Padma-sambhava, local ruins and deserted settlements, a Chang monastery
    said to have been founded by Padma-sambhava, and a Chang legend about an Avalokitesvara
    statue carried by flood, impossible for a hundred men to move toward a monastery,
    but easy for one man to carry to its present place after a lama inferred the image's
    wish.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A small temple south of Nako is called 'Footprint of the Teacher' and is built
    over a natural rock showing a footprint larger than human size, with a stucco
    figure of Padma-sambhava placed above it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Nako footprint temple is described as having old-style frescoes with a
    glassy polish and is suggested to date to the eleventh century; the footprint
    is reported as likely already believed to be Padma-sambhava's in the days of Rin-chen-bzang-po.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Opposite the present town of Nako, across the lake, are extensive ruins of
    an ancient town with the chief's fort above it; the ancient town is said to have
    been destroyed by the Ladakhis.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: North-west of Nako are deserted villages, and one settlement is said to have
    been abandoned after two or three people died while a watercourse was being mended.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The monastery of Tra-shi-tong-yang near Chang is situated on a rock in a deserted
    village, is asserted to have been founded by Padma-sambhava, and is said to contain
    his image.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Chang, former peasants are said to have lived on the rock around the monastery
    and castle, where many ruined houses remain.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the present village of Chang there is a life-size stone statue of Avalokitesvara
    half buried in a mani wall; it has a small Amitabha figure in its headdress, two
    arms, and white paint.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Chang legend says the Avalokitesvara image was carried down from a higher
    place by a flood, after which the Chang people found it and tried to carry it
    up to the Tra-shi-tong-yang monastery as a suitable abode.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the legend, a hundred men could not move the image, but after a clever
    lama guessed that it wished to be set up in its present place, a single man could
    carry it there easily.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The castle of Kyahar near Chang is described as large and imposing, locally
    said to have had frescoes that later informants reported had disappeared; a short
    Takari inscription was noticed on a roadside boulder nearby.
  category: setting
  evidence_refs:
  - ev:10
