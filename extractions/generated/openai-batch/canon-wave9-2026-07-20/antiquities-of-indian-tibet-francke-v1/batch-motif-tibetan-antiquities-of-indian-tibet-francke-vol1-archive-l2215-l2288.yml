canonical_text:
  quote: ''
  summary: 'The passage records observations from Spiti and Ladakh-related antiquities:
    a Kaze votive tablet and spelling evidence for Leh; a visit to Ki monastery prompted
    partly by news of Buddha relics at Peshawar; discussion of claims and evidence
    about Brom-ston’s connection with Ki; the monastery’s destruction, restoration,
    hilltop layout, and modern images including Tara-like, Avalokitesvara, Amitayus,
    Shakyamuni, Panchen Lama, and Padmasambhava figures; and preparations for travel
    toward the Pharang Pass.'
  language: English
  quote_policy: summarized
literal_observations:
