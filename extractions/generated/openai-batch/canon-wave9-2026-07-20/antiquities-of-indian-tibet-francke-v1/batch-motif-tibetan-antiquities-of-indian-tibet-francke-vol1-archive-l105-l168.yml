canonical_text:
  quote: ''
  summary: The passage describes rock carvings near Kotgur interpreted as yoni symbols
    connected with Kali- and Siva-type deities; an annual Doum festival involving
    a mask-board, death-dedicated masks, possession, sword-dance, cheek-piercing,
    and trance-oracles; related mask customs at Triloknath, including a spring festival
    in which a demon representing winter is driven out; and the author’s interpretation
    of Indian Tibetan devil dances as older seasonal rites later recast by Lamaism,
    with Langdarma replacing winter as the antagonist. It also notes collected masks,
    devil-dance implements, and a human thighbone trumpet.
  language: English
  quote_policy: summarized
