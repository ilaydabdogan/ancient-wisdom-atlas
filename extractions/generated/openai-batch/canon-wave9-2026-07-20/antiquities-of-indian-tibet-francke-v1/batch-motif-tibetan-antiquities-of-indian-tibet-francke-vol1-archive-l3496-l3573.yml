canonical_text:
  quote: ''
  summary: 'The passage describes finds from ancient graves near Leh: hand-made pottery
    with primitive linear ornaments, clay pots containing human bones, numerous skulls,
    animal remains, bronze implements, beads, pendants, a glass bead, and bronze buttons.
    The author infers practices involving fragmented human remains, possible offerings
    or sacrifices to the dead, and possible status-marking buttons, while also discussing
    skull shape and possible Dard origin of the grave builders.'
  language: English
  quote_policy: summarized
