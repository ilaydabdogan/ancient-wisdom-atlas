canonical_text:
  quote: ''
  summary: The passage reports local traditions and antiquities around Kyahar, including
    an ancient monastery, a reported stone sculpture, deserted village ruins, and
    a relocation near a castle. It then describes a desert march toward Spiti with
    sulphur springs, mani walls, carved stones naming Tsong-kha-pa and contemporaries,
    and inscriptions or votive tablets linking Tsaparang, Guge kingship, and d'Andrada's
    mission. It ends with a plate note identifying Tabo monastery and a row of one
    hundred and eight stupas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A small ancient monastery at Kyahar is reported by local tradition to be connected
    with Rin-chen-bzang-po; it is called Lha-brang, belongs to the Gelugpa order,
    and was said to contain ancient pictures, though the narrator did not visit it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: An ancient stone sculpture at Kyahar is said to resemble the Avalokitesvara
    of Chang, but the narrator states that he did not see it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Extensive ruins of a deserted village lie on a rock below the present village
    of Kyahar; the narrator was told that the people exchanged sites to settle near
    the present castle.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The journey passed through a bare, uninhabited desert separating Spiti from
    Bashahr, with camps at the Zangzam bridge and Horling on Tibetan ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Near the Zangzam bridge are hot sulphur springs with hewn bathing basins,
    crystallized sulphur, white salt, and water plants growing in sulphurous water.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the desert near Horling the narrator passed mani walls and found carved
    stones, probably from the 15th century, naming Tsong-kha-pa and three contemporaries.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator states that the inscriptional form of the vowel signs points
    to the stones' antiquity and that the stones were probably placed by the roadside
    during the Lamaist reformation before later being put on or near mani walls.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Horling mani-wall inscription says the wall was erected by a man from rGyum-khar
    during the reign of a king residing at Tsaparang.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The narrator connects the Horling inscription with d'Andrada's report of a
    Tibetan king at Tsaparang and argues that Tsaparang was a capital of Guge whose
    authority reached Spiti.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A similar Tabo votive tablet names the same king, gives Tsaparang as his residence,
    and contains a passage about clearing away apostasy and darkness at the great
    palace of Tsaparang.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The plate note identifies a monastery of Tabo and a row of one hundred and
    eight stupas at Tabo.
  category: object
  evidence_refs:
  - ev:7
