canonical_text:
  quote: ''
  summary: The passage reports antiquarian observations at rGya-mthsa, including wall
    medallions, holes, wood fragments, and plaster suggesting former images, while
    local inhabitants identify the ruin instead as a minister's summer house. It then
    describes miniature stupa-type cremation tablets containing an inscribed Sarada
    tablet with the Ye dharma formula. The narrator visits Munshi dPal-rgyas at Leh,
    who shows private temple objects including a Kesar-Saga hero mask, states a connection
    between the Kesar-Saga religion and Bon, and displays an ibex head identified
    by a lama as Buddha in an animal incarnation. The passage also mentions other
    reported Buddha relic objects, including a clay tablet and an elephant-incarnation
    tooth marked with Om.
  language: English
  quote_policy: summarized
