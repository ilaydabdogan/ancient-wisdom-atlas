canonical_text:
  quote: ''
  summary: The passage describes ruins at Kalagtrung/Kalag Kot, deserted fields, and
    an old Shar-rgan festival site above the ruins. It reports a Sanskrit and Tibetan
    inscription addressed to the “great mother,” identified by the author with Tara,
    and describes a former festival involving annual sacrifice of an eight-year-old
    child, later replaced by a goat. It also notes present-day thank-offerings by
    parents blessed with a son and discusses songs of the festival as evidence for
    pre-Buddhist/Bon religious traditions and named deities.
  language: English
  quote_policy: summarized
