- id: obs:3
  text: A high hillside plateau above Kalagtrung is identified locally as the old
    place of the Shar-rgan festival and is said to have been left vacant in ancient
    times for dancing.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
