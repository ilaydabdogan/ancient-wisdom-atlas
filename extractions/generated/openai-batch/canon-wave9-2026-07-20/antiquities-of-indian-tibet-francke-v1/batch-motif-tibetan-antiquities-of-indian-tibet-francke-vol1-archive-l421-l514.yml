  summary: 'The passage describes travel through Bashahr and nearby Satluj-region
    sites: Raja Shamsher Singh’s visit, palace and temple architecture, carved deity
    images, rumours of human sacrifice at an inaccessible Kali temple with a deep
    pit, memorial slabs for the dead, Lamaist mani walls, frescoes, prayer flags,
    stupas, a Mahesvara temple with wooden lion figures and a lingam, and the Wangtu
    bridge as an old Bashahr-Tibet boundary marker.'
