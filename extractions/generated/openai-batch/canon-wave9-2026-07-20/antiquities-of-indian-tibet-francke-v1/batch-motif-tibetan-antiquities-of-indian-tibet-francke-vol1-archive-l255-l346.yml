canonical_text:
  quote: ''
  summary: The passage surveys Nirmand’s temples, architectural types, local deities,
    sculptures, water tanks, ritual restrictions, and associated images, then notes
    an absence of Buddhist traces at Nirmand and the appearance of Lamaist buildings
    farther up the Satluj valley at Rampur.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The principal temples at Nirmand are described as hill-type buildings of rubble
    masonry alternating with cedar beams, with sloping, slightly concave roofs covered
    with slates or wooden shingles.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Numerous stone temples of the Sikhara type stand beside many chief temples
    but are not placed prominently; the author dates their introduction to roughly
    the 7th through 11th centuries.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states that Nirmand’s original cult appears to have been entirely
    Sivaist, with most temples dedicated to Siva, Kali, or similar deities, while
    Vishnuism was later introduced without displacing Sivaism.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Local report says the town once had five main streets with a great temple
    in each; by the time described, disease had reduced the town, which lay on a high
    level plateau with views of mountain ridges.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ambika temple lies below the village and is reached by a flight of 184
    steps; Ambika is identified as probably a form of Kali and as the chief deity
    of Nirmand.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Ambika image is reported as standing, about two feet high, with a black
    face and gold-covered clothing; only Brahmans may approach, and they must remove
    trousers.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: In front of Ambika’s temple, an ancient stone figure is buried in the ground
    up to the shoulders.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Kothi is a large hill-type building with stags’ and antelopes’ horns over
    the door and old sculptures inserted in the walls.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: One Kothi wall sculpture shows a head on a stand adored by two kneeling figures;
    the author says it may have been suggested by Buddhist relic sculptures with two
    worshippers, while the head is probably Siva.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Kothi includes a rude figure of Hanuman riding a small horse, stone figures
    of Kali, and a bronze figure of Parashurama.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The Parashurama bronze is exhibited only every twelfth year, when two naked
    men carry it out; when it returns, a glass of water is placed before it and left
    for twelve years, after which the water is said to remain fresh.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In front of the Kothi is a large round stone seat with sculptures including
    possible makaras swallowing men; an apparently modern cave lies nearby.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The temple of Chandi Devi stands near drinking-water wells and above several
    dressed-stone water tanks with sculptured slabs; stone figures of Nandi are conspicuous
    there.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Siva temple above the village is said to contain a lingam; above its door
    are a sculptured head and a figure of Ganesha, and in front are water tanks with
    reliefs and a Nandi figure.
  category: object
  evidence_refs:
  - ev:11
- id: obs:15
  text: The temple of Siva and the Pandavas in the middle of the village is said to
    contain many images in small niches.
  category: object
  evidence_refs:
  - ev:12
- id: obs:16
  text: The Thakur temple image is described as a man and woman seated with another
    woman lying on the ground, all three surrounded by an elaborate halo.
  category: object
  evidence_refs:
  - ev:13
- id: obs:17
  text: Goldsmiths’ house doors have carved stone door-posts with Ganesha in the centre.
  category: object
  evidence_refs:
  - ev:14
- id: obs:18
  text: The author concludes that no traces of Buddhism were found at Nirmand, while
    Rampur is described as the first place up the Satluj valley where Lamaist buildings
    may be seen.
  category: relationship
  evidence_refs:
  - ev:15
  - ev:16
