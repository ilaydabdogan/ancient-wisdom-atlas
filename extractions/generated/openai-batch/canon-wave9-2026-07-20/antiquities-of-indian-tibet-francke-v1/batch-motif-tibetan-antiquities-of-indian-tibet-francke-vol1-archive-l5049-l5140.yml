canonical_text:
  quote: ''
  summary: A travel-antiquarian account follows the road from Shargola, Kargil, Shimsha
    Kharbu, and Dras, noting missing or surviving Buddhist traces, mosque architecture,
    rock carvings of stupas, ibex, swastika, yoni, sun symbols, war scenes, a castle
    ruin, local dress, landscape changes, and ancient Dras stone sculptures identified
    as Bodhisattvas/Maitreya with inscriptions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator searched for traces of Buddhism between Shargola, Kargil, and
    Dras, finding many rock carvings of ibex or hunting scenes but no carving of a
    stupa or of the Om mani padme hum formula.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator says many boulders near Kargil looked as if they had lost their
    outer coating, and suggests Buddhist carvings may have been destroyed after Kargil
    became Muhammadan.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Local people reported a rock at dKar-rtse in the Suru valley with a large
    Buddhist sculpture and a Tibetan inscription; the narrator did not visit it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage distinguishes Purig, Balti, and Kashmir-linked types of Muhammadanism
    and mosque architecture, quoting Conway’s description of the Got mosque.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: On a rock between Kargil and Chanigund, the narrator observed carvings of
    a svastika, a yoni, and ibex; at Chanigund he also found a sun symbol.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Dongga, a boulder was covered with carvings; older carvings were yellowish,
    modern ones white, and the carvings included stupas and more recent ibex figures.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The author states that the ibex is a fertility symbol in the pre-Buddhist
    religion, that Kesar and ’aBruguma are invoked to grant children, and that neighbours
    give “flour ibex” when a child is born.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: On another boulder at Dongga, the narrator found carvings of warlike scenes
    involving capture and slaughter of prisoners.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Shimsha Kharbu, there was an extensive ruin of a castle; inhabitants said
    it had been the property of the Khri Sultans of Sod.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Dard women at Shimsha Kharbu and Dras are described as wearing high caps,
    and the road began to show occasional trees and green pasture.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The ancient Buddhist stone sculptures at Dras are identified by the narrator
    as Bodhisattvas called Chamba, Byams-pa, or Maitreya, rather than as female nuns.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The first Dras stone is described as showing a man on horseback with one hand
    on the bridle and the other above his head, probably wielding a sword; the reverse
    bears a clear Sarada inscription.
  category: object
  evidence_refs:
  - ev:10
