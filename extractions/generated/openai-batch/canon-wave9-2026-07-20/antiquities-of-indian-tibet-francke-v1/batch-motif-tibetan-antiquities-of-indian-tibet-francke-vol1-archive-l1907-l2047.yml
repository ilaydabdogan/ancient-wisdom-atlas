canonical_text:
  quote: ''
  summary: The passage surveys images, frescoes, manuscripts, and inscriptions in
    the Tabo monastery hall. It describes an apse with Buddhist figures, wall paintings
    of Indian and Tibetan subjects, sculptures and wood carvings, large piles of Prajnaparamita
    manuscripts, and black-ink wall inscriptions concerning the monastery’s foundation,
    renovation, religious admonitions, royal relations between Guge and Ladakh, and
    the relation of Rin-chen-bzang-po to Atisa.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Behind rNam-par-snang-mdzad in the apse are four standing stucco figures,
    a seated Buddha on a lion throne, and figures of flying spirits above.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The walls are described as completely covered with paintings, including Indian
    subjects, an Indian king, Indian men, Indian ladies, elephant processions, and
    Tibetan-origin pictures.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: One Tibetan-origin picture has the inscription identifying the province of
    Guge, and some pictures have explanatory inscriptions in ancient or modern Tibetan.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Below the image of rNam-par-snang-mdzad, the observers found a stone sculpture
    of Mahju-gliOsha and two ancient wood carvings of standing Buddhas with attendants.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: On both sides of rNam-par-snang-mdzad are piles of loose manuscript leaves
    about five feet high, apparently belonging to the twelve books of the Prajnaparamita
    in Tibetan translation.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Two long inscriptions in black ink are written behind the image of rNam-par-snang-mdzad,
    immediately above the ground.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: One inscription is described as historical and concerns the foundation of
    Tabo monastery and persons connected with that event.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The other inscription is described as admonitory, involving blessing and cursing,
    and speaks of punishments for lamas who do not live according to the law.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The historical inscription says that Byang-chub-’od, priest-king of Guge,
    renovated Tabo monastery forty-six years after its foundation by Lhayi-bu Byang-chub-sems-dpa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The inscription treats Lhayi-bu Byang-chub-sems-dpa with respect and is said
    to confirm that Ladakh kings were recognized suzerains of Guge princes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The inscription names Rin-chen-bzang-po and Atisa, called Phul-byung, and
    says Rin-chen-bzang-po was made a “light of wisdom” by the agency of Atisa.
  category: relationship
  evidence_refs:
  - ev:7
