canonical_text:
  quote: ''
  summary: The passage describes mani walls and votive inscriptions near Poo, an inscribed
    stone at dKor bearing a stupa, human figure, and fragmentary Tibetan inscription
    naming Ye-shes-’od, and local traditions about an early Buddhist temple, its relocation,
    and its successor temple with images and ritual objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Near the village, the observers passed many mani walls, several with votive
    tablets that did not seem very ancient.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The votive inscriptions are described as generally having four parts: devotion,
    praise of the country centered on Poo, praise of the reigning Raja of Bashahr,
    and an account of the wall’s construction and intended religious benefit.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some tablets preserve names of Bashahr rulers, while others refer only to
    the great king at Sarahan.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: An inscribed stone was reported in dKor below Poo; it was generally known,
    but local people and lamas had not tried to read it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dKor stone stood in a field belonging to the lama hKa-rgyud and was about
    six feet high.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The upper half of the stone sculpture shows a stupa; the lower half shows
    a poorly preserved human figure wearing a three-pointed hat.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The reverse of the dKor stone bears an eleven-line Tibetan inscription, with
    only the first two lines in fair preservation.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: A Christian Tibetan companion began reading the first lines, after which the
    narrator identified the name Lha-bla-ma Ye-shes-’od on the stone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The inscription is said to contain the full name of Ye-shes-’od and the words
    meaning “in his life time.”
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that the inscription provides the first record confirming
    Tibetan historical statements about Ye-shes-’od.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The inscription is reported to indicate that Poo and dKor existed, that Poo
    had a palace, and that ten princes were sent to Poo.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The narrator says the princes’ purpose is uncertain, but suggests Buddhist
    propagation from repeated references to lha-chos and sngar-chos.
  category: other
  evidence_refs:
  - ev:5
- id: obs:13
  text: Local tradition associates the inscribed stone’s site with the first Buddhist
    temple at Poo, and the passage says a new temple was built higher up in the center
    of Poo because a sacred object should not stand below ordinary houses.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: The existing Lo-tsa-ba-Lha-khang temple is said to contain images, books,
    musical instruments, and masks, though none are dated by the narrator to the time
    of Ye-shes-’od.
  category: object
  evidence_refs:
  - ev:6
