canonical_text:
  quote: ''
  summary: The passage describes a recent Lamaist temple and frescoes near Rampur,
    including a fresco interpreted as the 1650 treaty between Tibet and Bashahr. It
    then recounts travel up the Satluj valley, a Gaura harvest-prayer festival with
    all-night antiphonal singing, and Sarahan traditions about the Bashahr royal line,
    including a prophecy by which Pradyumna, a Brahman from Kanchanapuri, became king.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A recent Lamaist temple is described as resembling local dwelling houses,
    with a sloping roof, modern frescoes, and a huge prayer wheel.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A garden-house fresco is said by Shamsher Singh to be a copy of a picture
    in the palace of Lhasa and is interpreted by the author as showing the treaty
    between Tibet and Bashahr around 1650 A.D.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The treaty fresco includes a central Mughal emperor-like figure with soldiers,
    an elephant procession from the left, Bashahr people marked by black round hats,
    and a Tibetan embassy on the right.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The treaty is described as important because Tibetans defeated by the Mughal
    army at Basgo ceded part of Guge, including the Satluj valley down to Wangtu bridge,
    to Bashahr.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The road up the Satluj valley from Rampur to Chini passes wooded mountains,
    narrow valleys, repeated ascents and descents, and strong changes between cool
    heights and hot valley conditions.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Gaura, villagers held a festival of prayers for a good harvest and sang
    through the whole night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Gaura singers used two choirs, one lower and one higher, with one party
    holding the last note while the other began; one tune was noted as based on the
    Chinese scale.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sarahan is described as the ancient capital of Bashahr, where Raja Shamsher
    Singh was residing, and he is presented as the last of a line of 120 Rajas in
    the Bajowari of Bashahr.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Bashahr dynasty claims origin from Kanchanapuri in the Deccan and Brahman
    caste status.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the Bashahr throne was vacant, a prophecy reportedly said that the first
    Brahman to enter the palace gate would be the destined king; Pradyumna, the younger
    of two Brahman brothers, entered first and was made king.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The elder brother's descendants became family priests, while other northern
    Indian rajas are said to seek caste-marks from the Bashahr Raja; the author also
    expresses doubt about the genuineness of the oldest parts of the pedigree.
  category: relationship
  evidence_refs:
  - ev:7
