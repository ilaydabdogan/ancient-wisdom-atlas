canonical_text:
  quote: "“Do not forget the mani”"
  summary: The passage narrates travel from Poo toward Shipke, including a dangerous
    rope bridge over the Satluj with old inscriptions advising remembrance of the
    mani formula; a meeting at Namgya with Hira, who produces a treaty-related historical
    document; a perilous road to Shipke; a brook marking the frontier of Tibet proper;
    and local belief in a blue zeolith stone with healing powers.
  language: English with Tibetan terms
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The travelling party left Poo on 6 July for Shipke and descended to the rocky
    banks of the Satluj to cross a rope bridge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bridge site is called mTho-rang, glossed as “Height itself,” and inscriptions
    on both banks indicate a bridge had existed there from ancient times.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two Tibetan inscriptions, one on each bank, advise a person intending to cross
    not to forget the mani.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The older bridge is described as three rotten ropes of willow twigs about
    100 feet above a broad violent stream; the contemporary crossing used a steel
    cable with a wooden saddle and rope slings, and accidents were reported.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Namgya, the village chief Hira said he descended from a Tibetan family
    of ministers and showed unusual historical knowledge.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hira produced a document identified as a copy of a treaty between Raja Kehari
    Singh of Bashahr and the Lhasa Government headed by Galdan Thsang.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The manuscript is said to give a short account of the 1646-47 war between
    Ladakh and Lhasa and to contain local names.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Namgya-Shipke road is described as involving unstable pathways along a
    precipice, climbing up and down pinnacles, and continual exhausting ascents and
    descents.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The frontier of Tibet proper is marked by a little brook where travellers
    generally take a meal.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: After passing the brook, people of Namgya and Bashahr are said to dismiss
    caste and be willing to eat and drink even with a European.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the Tibetan side of the frontier, people find a blue kind of zeolith embedded
    in granite, called rDo-khyu or rDo-khyug, and believe it has medical powers.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The stone is tied over injured eyes of sheep and goats, rubbed on sore human
