canonical_text:
  quote: ''
  summary: The passage moves from travel observations in Ladakh/Western Tibet, including
    a swamp, a place called Eaco lhamo or 'Horn goddess,' a horn-covered stone altar,
    and a ruined frontier marker, to a historical narrative about King Lha-bla-ma-Ye-shes-’od
    of Guge. The king seeks to purify Tibetan Buddhism through contact with Indian
    Buddhism, sends Tibetan boys to Kashmir and India for Sanskrit and philosophy,
    invites Ati4a with gold, and later mines and gathers gold. After conflict with
    the king of Qarlog/Garlog, he is captured and offered release only for a body-shaped
    ransom in solid gold. In prison, he tells his nephew Byang-chub-’od to use the
    gold to bring an Indian pandit to Tibet rather than release him, declares himself
    willing to die for Buddhism, and dies in prison.
  language: English
  quote_policy: summarized
