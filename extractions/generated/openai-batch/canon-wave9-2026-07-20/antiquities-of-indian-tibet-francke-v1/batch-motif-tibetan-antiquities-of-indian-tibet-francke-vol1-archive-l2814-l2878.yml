canonical_text:
  quote: ''
  summary: The passage describes a Nyoma monastery picture showing Ladakhi-style houses,
    royal domestic spaces, processions, and costumes. It reports a popular proverb
    explaining Ladakhi dress through gifts from King Seng-ge-rnam-rgyal and a tiger
    lama, then compares women's herag ornaments with serpent-like Naga and Nagi imagery
    in old Indian art. The passage also quotes Dr. Shawe's report on Drangtse-area
    castles and rock carvings, including animal, chorten, cross, stag-hunt, inscription,
    and Buddha images.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A picture shows whitewashed one- or two-story houses with red or black roof
    bands, the inside of a royal kitchen with several workers, and male and female
    royal family members in separate rooms.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two processions approach the buildings from opposite sides; the right-side
    men ride mules or rkyangs, while the left-side men walk and carry presents, possibly
    tribute.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator states that the picture is especially valuable for its costume
    depiction and that popular tradition credits Seng-ge-rnam-rgyal with introducing
    the Ladakhi type of dress.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A proverb says the king, whose name is explained as meaning lion, honored
    his subjects by giving one of his ears, from which men received the high black
    cap called the lion's ear.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The same proverb says the great tiger lama favored women by giving them his
    spotted skin, explaining the introduction of the dark blue women's dress with
    red and yellow spots.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Nyoma picture is said not to show the new fashion; male figures wear turbans,
    and royal ladies wear rich herags, leather fillets covered with precious stones.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator links herags to old Indian representations of Nagas and Nagis
    as human figures with a snake rising from the back and over the head, and says
    the Ladakhi herag looks like a snake.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator speculates that Ladakhi women may have wished to look like Nagis
    because these water fairies were famous for beauty.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Dr. Shawe reports that Drangtse has an old castle and village on top of a
    rock, destroyed by the Dogras, and thousands of rock carvings of the usual ibex
    and yak type.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Dr. Shawe reports additional carvings and marks, including a chorten with
    a long mostly Tibetan-looking inscription, a Persian line, crosses, a stag hunt,
    a rough Buddha outline, and chorten-type clay tablets.
  category: object
  evidence_refs:
  - ev:8
