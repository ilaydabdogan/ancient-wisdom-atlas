canonical_text:
  quote: ''
  summary: The passage describes Buddhist sculptured stones and inscriptions near
    Dras, including images identified as Maitreya, Avalokitesvara, Taras, devotees,
    lotus thrones, lions, and a stupa. It then records local boundary traditions at
    La-rtsa and the Zo-ji Pass, a boulder inscription of the Om mani padme hum formula,
    and a local tale in which the goddess Du-zhi/Pu-zhi-lha-mo, wife of Naropa, turns
    toward Kashmir and away from Ladakh, explaining the fertility of Kashmir and dryness
    of Ladakh.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Sanskrit inscription records the erection of two images, one of Maitreya
    and one of Avalokitesvara, associated by the author with two larger sculptures.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The second stone is described as about six feet high and shows Maitreya with
    a three-pointed tiara, a rosary in the raised right hand, a vase in the left hand,
    small human figures below, a lotus throne, two couchant lions, another small figure
    near the head, and a damaged Sarada inscription.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The third stone is about six feet high and shows a standing human figure identified
    tentatively as Avalokitesvara, flanked by two female figures taken as the two
    Taras.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Below the third stone's main figure are kneeling figures with raised hands,
    a lotus throne with miniature figures, and, on the reverse, a stupa with thirteen
    umbrellas and thirteen steps leading to a central square containing a human figure.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A fourth sculptured stone shows a full-blown lotus flower decorated with vases
    at the four cardinal points of a wheel.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Ladakh chronicles place the ancient boundary between Ladakh and Kashmir
    at La-rtsa and mention a stone with holes as the boundary stone; local people
    also associate the watershed on the Zo-ji Pass with the frontier.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: A boulder between Dras and Pandras on the Tibetan side of the pass bears a
    worn inscription of the Om mani padme hum formula, described as an ancient type
    with letters written separately rather than as a modern compound character.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Zo-ji Pass is called Du-zhi-la by Tibetans after a goddess named Du-zhi-lha-mo,
    probably interpreted in the passage as a goddess of the four seasons.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the tale, Pu-zhi-lha-mo is the wife of Naropa; when he went to Ladakh,
    he wished to leave her behind because of her Kashmiri smell.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the tale, the displeased goddess turned her back toward Ladakh and her
    face toward Kashmir, causing Ladakh to dry up and Kashmir to become fertile.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'The narrator describes a sudden contrast for a traveller from Ladakh: desert
    Ladakh remains behind while green wooded Kashmir appears after the pass.'
  category: setting
  evidence_refs:
  - ev:9
