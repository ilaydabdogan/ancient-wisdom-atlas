  summary: The passage describes the narrator's encounter with the chief of the Eubshu
    nomads, a gifted portrait that creates practical obligation, difficulty obtaining
    transport in frontier regions, and a detailed account of riding and managing yaks
    without saddles, bridles, or nose-rings, including herd behavior, fights among
    yaks, damaged equipment, and the use of a stone whip.
  language: English
