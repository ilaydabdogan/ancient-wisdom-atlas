canonical_text:
  quote: ''
  summary: The passage records a journey through mThso-kyag, Raldrong, and Nyoma,
    describing lakes, river crossings, abandoned villages, ruined castles, temples,
    mchod-rten, inscriptions, royal names, a royal dedication sheet, Buddhist murals,
    and a thang-ka with a lama portrait and royal household scenes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The expedition camped beside mThso-kyag, described as a small brackish mountain
    lake without permanent shore habitation but with stone walls erected by nomads.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Near Raldrong, where the Phuga brook enters the Indus, the passage reports
    ruins of an old Mon village and mentions secondhand reports of boxes, household
    utensils, and coins apparently found in graves.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator and Pindi Lal crossed the Indus on a small raft of inflated skins;
    Pindi Lal suffered from sun exposure and headache but still took photographs of
    objects of interest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nyoma is described through Dr. Shawe’s report as having remains of a castle
    and old town on top of a rock, with a temple containing small brass idols and
    temple utensils.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Dr. Shawe’s report says local people attributed the town to bDe-skyong-rnam-rgyal
    and that royal names appeared on mani walls, including Don-grub-rnam-rgyal.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The plain behind the rock had extensive village remains, step mchod-rten,
    and an old mchod-rten with small doors and interior paintings of Buddha’s temptation
    and subduing demons.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The only rock carving Dr. Shawe reported finding was a migmang, described
    as a kind of chessboard, on a boulder.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator questioned later monastic claims that the temple dated to Seng-ge-rnam-rgyal
    and was shown a book dedicated to the monastery with a dedication sheet naming
    Seng-ge-rnam-rgyal and Queen bSkal-bzang.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrator states that the dedication document proves only royal interest
    and possible renovation, while older mchod-rten indicate an earlier settlement
    history.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: A thang-ka in the temple contained an idealized portrait of sTag-thsang-ras-pa
    and scenes of the royal household from about 300 years earlier.
  category: object
  evidence_refs:
  - ev:7
