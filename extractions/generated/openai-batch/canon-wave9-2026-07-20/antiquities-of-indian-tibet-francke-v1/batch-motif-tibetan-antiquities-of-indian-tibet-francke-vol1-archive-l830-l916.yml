  quote: ''
  summary: The passage describes Kanam monastery and its Tibetan canonical library,
    Csoma's study of the collections, Gerard's inspection of the library, a nearby
    Lamaist building with Maitreya and White Tara statues, crematory structures above
    the monastery, possible damage to older monastic remains, a difficult rope-bridge
    river crossing near Shasu, and the route to Poo through rugged mountain terrain
    beside the Satluj.
