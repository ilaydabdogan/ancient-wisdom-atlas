canonical_text:
  quote: ''
  summary: The passage describes damaged Meru monastery remains, a fresco of Gog-bzang-lha-mo
    as mother of Kesar and pre-Buddhist Ladakhi deity, nearby cave dwellings and earlier
    hill settlements, ancient mchod-rten at Ubshi with frescoes later identified by
    the author as possible Klu/Naga imagery, and notes on Hemis monastery, its devil-dances,
    disputed European claims, and old images possibly transferred from Meru.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Meru had been plundered during the Hogra wars, its monks expelled, and little
    remained in the temple hall except a notable fresco representing Gog-bzang-lha-mo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fresco identifies Gog-bzang-lha-mo as the mother of Kesar and as one of
    the great pre-Buddhist deities of the Ladakhis.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The goddess in the fresco is described with white complexion, black hair raised
    over the forehead, a ribbon, pearl diadem, white spiral ear ornaments, white dress
    with blue and red seams, and a white cup in her hand.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Opposite the monastery there is a hill with cave dwellings, described as probably
    the most ancient inhabited locality at Meru and called ‘^aho’ or ‘Caves’.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: An earlier inhabited site at Meru is described as a hill spur on the right
    bank of the rGya river with extensive ruined houses; the passage connects such
    elevated sites with restrictions against living among fields during the Ladakhi
    kings’ ascendancy.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Ubshi, where the rGya brook enters the Indus, the author noticed several
    ancient mchod-rten known locally as mchod-rten of the Mons.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Inside one mchod-rten, ancient frescoes used mainly indigo blue and brownish
    red and included rows of blue-complexioned figures seated cross-legged, wearing
    white garments with red seams.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: After comparing similar frescoes at other sites, the author concluded that
    the Ubshi pictures represent Hagas/Klu and that the ancient mchod-rten may be
    Bon-po rather than Buddhist structures.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hemis monastery is said to have become unusually famous among European visitors
    for devil-dances performed in June, with the author adding that this timing was
    originally probably connected with the summer solstice.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Hemis contains images of a type found only in monasteries of the 10th or 11th
    century; monks say they came from Lhasa, while the author suggests they may instead
    have come from Meru, described as the ‘mother’ monastery of Hemis.
  category: relationship
  evidence_refs:
  - ev:9
