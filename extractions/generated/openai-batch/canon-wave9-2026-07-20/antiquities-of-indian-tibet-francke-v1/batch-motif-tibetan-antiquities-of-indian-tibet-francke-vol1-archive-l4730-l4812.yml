canonical_text:
  quote: ''
  summary: 'The passage describes damaged frescoes and gateways at Lamayuru attributed
    to Bon-po origin, including Naga-like divinities, female figures, female musicians,
    and a fresco group identified as Bon-po priests. It then describes historical
    and archaeological remains at Kharbu: ruined castle and old town, conquest traditions,
    an inscription, a tower with a spring, devotional structures, and graves of uncertain
    origin.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An ancient shrine below Lamayuru is described as probably the old Bon-po temple;
    its roof is mostly gone, frescoes are damaged, and its door was in the east wall.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wall divinities in the Lamayuru shrine are described as Buddhist in type,
    blue or black in complexion, and red in dress; the author says they appear to
    represent Nagas.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author states that the ancient gates with four doors and the Lamayuru
    temple are apparently of Bon-po origin but were made when Bon-po religion was
    strongly influenced by Buddhism and Hinduism.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Several unusual white female figures with ear-flaps appear on the walls and
    ceiling, and the ceiling also shows rows of female musicians alternating white
    and grey.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A fresco group identified by the author as Bon-po priests includes one almost
    life-size figure and smaller figures wearing white undergarments, striped gowns,
    and broad-brimmed hats in blue or black.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old Khagani gateways above the Lamayuru bungalow have ceilings painted
    with blue Buddha-like figures and are also ascribed by the author to Bon-po times.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Moorcroft is said to have found letters of protection in Lamayuru monastery
    issued by Aurangzeb, Mughal officers, and a Balti king.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The castle of Kharbu stands ruined on a rocky hill; a possible ancient sun-dried
    brick temple was noted, but no implements, inscriptions, ancient remains, or raised
    medallions were found there.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The old town of Kharbu lies on a rocky plateau and is said probably to have
    been deserted after King bDe-ldan-rnam-rgyal conquered it and carried away women
    and children into captivity; an alternate report of storming in the Ldgra war
    is treated as doubtful by the author.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: An indistinct rock inscription near the old town is associated with the time
    of King Seng-ge-rnam-rgyal, leading the author to infer that Kharbu was still
    inhabited in his reign.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A solid round tower at the western end of old Kharbu contains a staircase
    leading down to a spring that supplied fresh water during sieges.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The plateau between old and present Kharbu contains old mchod-rten, mani walls,
    and many ancient graves whose origin is unknown; the author suggests possible
    Dard, Muhammadan, Islamisation-period, or Mughal-war associations.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: A plate caption in the passage identifies a fresco in the Bon-po Temple at
    Lamayuru and an ancient wood-carving of Garuda at Chigtai.
  category: object
  evidence_refs:
  - ev:10
