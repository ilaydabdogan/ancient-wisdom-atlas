canonical_text:
  quote: ''
  summary: The passage surveys temples, stupas, images, inscriptions, and antiquities
    around Mang-rgyu, Tar, and Khalatse. It records stucco images, uncertain icon
    identifications, directional Lamaist images at Tretapuri, a local belief in self-arisen
    figures of Tara on a rock near Tar, and threatened inscribed boulders and other
    antiquities at Khalatse.
  language: English
  quote_policy: summarized
