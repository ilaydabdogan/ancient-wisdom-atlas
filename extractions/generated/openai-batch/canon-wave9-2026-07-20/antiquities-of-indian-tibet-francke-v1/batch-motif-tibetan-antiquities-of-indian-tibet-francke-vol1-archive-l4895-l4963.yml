canonical_text:
  quote: ''
  summary: Francke describes travel to Waka and Mulbe, including ruined fortifications,
    a cave hermitage, a ruined temple, the large Mulbe Maitreya rock sculpture with
    its emblems, comparative remarks on Bodhisattva and Hindu deity iconography, and
    local On-po custodians’ traditions about the sculpture and the eight sons of Nyeba.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party marched to Mulbe over the Namika Pass and visited the ruined castle
    of Waka at the east end of the Mulbe valley.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old castle and town of Waka lie on a steep spur north of the present village;
    the survey found a stone mortar, a bone tube, and pottery sherds, but no inscriptions.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Below the fortress were traces of an ancient hermitage described as a mthsams-khang,
    a kind of cave dwelling; above the caves were faint fresco traces, an outline
    of a mohod-rten, and a few ancient inscription letters.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the plain west of the ruined castle stood the remains of Lha-khang-gog-po,
    a large square ruined temple hall later used as a dwelling by Muhammadan families.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Mulbe Maitreya or Chamba is a huge rock sculpture on an insulated rock
    pillar; Moorcroft described the carved figure as about twenty-four feet high,
    with its lower part concealed by a low wall and a former protective screen now
    gone.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Maitreya sculpture is described as having a Brahminical cord, a flask,
    and a rosary among its characteristic emblems.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The passage reports comparisons of Avalokitesvara with Shiva and Maitreya
    with Brahma, and cites a Chhatrarhi Brahma representation carrying a rosary and
    water-pot and accompanied by geese.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The keepers of the little temple below the sculpture were an old On-po family
    of astrologers who said their family had always been in charge of the sculptures.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Wazir bSod-nams, the present baron of Mulbe, is said to have built the small
    temple in front of the sculpture.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The On-pos say the image was carved by the eight great sons of Nyeba, whose
    figures are shown at the feet of Maitreya.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: One of the sons of Nyeba is shown wearing a round hat with a brim; modern
    frescoes in the temple show the eight sons with varied complexions, and the sculpture
    has no inscriptions except repetitions of the Om mani padme hum formula.
  category: attribute
  evidence_refs:
  - ev:7
