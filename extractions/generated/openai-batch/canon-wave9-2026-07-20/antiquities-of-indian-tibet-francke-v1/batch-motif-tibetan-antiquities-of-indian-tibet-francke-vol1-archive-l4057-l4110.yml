  quote: ''
  summary: The passage identifies Munshi dPal-rgyas as the writer of a manuscript
    associated with Dr. Marx and describes three versions of his account of the Dogra
    war. It then surveys several buildings and monuments at Leh, including mosques,
    a church, a temple connected with Hemis monastery, royal gardens, a polo ground,
    and a long mani wall with end monuments, before acknowledging local officials'
    assistance.
