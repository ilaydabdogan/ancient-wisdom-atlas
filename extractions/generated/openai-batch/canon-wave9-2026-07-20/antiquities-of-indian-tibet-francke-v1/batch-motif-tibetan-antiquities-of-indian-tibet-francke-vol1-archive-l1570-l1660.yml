comparison_claims:
- id: claim:1
  claim: The western hall fresco arrangement is compared in the passage to the arrangement
    at the Alchi monastery.
  claim_level: visual_similarity
  target: Alchi monastery fresco arrangement
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The author states the resemblance but does not copy or describe the
    Nako frescoes in detail because of their number and poor preservation.
- id: claim:2
  claim: The dragon or makara frame is described in a note as a development of a known
    decorative motif of Indian art that is common in Javanese architecture.
  claim_level: visual_similarity
  target: Indian and Javanese decorative architectural motif with Garuda and makara-like
    side forms
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: low
  limitations: The OCR leaves the specific ornament name unclear; the comparison is
    editorial and based on decorative form, not a full historical demonstration.
- id: claim:3
  claim: The King Kesar fresco may indicate a connection between pre-Buddhist Tibetan
    religion and Buddhism of the eleventh century.
  claim_level: historical_contact
  target: pre-Buddhist Tibetan religion and eleventh-century Buddhism
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: low
  limitations: The passage itself phrases the claim tentatively and provides only
    the fresco’s placement, mount, and local name as evidence.
