canonical_text:
  quote: ''
  summary: The passage recounts a journey to Nako across the Spiti river and up a
    mountain, then describes the Lo-tsa-bai Lha-khang monastery, its temple halls,
    images, frescoes, ritual mask, inscriptions, and a fresco of King Kesar in a Buddhist
    temple context.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The caravan crosses the swollen Spiti river by a rope bridge after leaving
    Li.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The party spends about three hours transporting luggage and people across
    the river and then climbs a steep, high mountain side under strong sun.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the climb, the village plateau of Nako appears, with fields, working
    and singing girls, a town, and a clear little lake.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Nako the described monastery is called Lo-tsa-bai Lha-khang and is said
    to have four large temple halls forming a court, with ruins and ruined mchod-rten
    nearby.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The monastery is believed to have been founded by Lo-tsa-ba Rin-chen-bzang-po
    in the time of King Ye-shes-’od of Guge, about 1025 A.D.; the author accepts this
    assertion.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the western hall, Vairochana is the principal figure, accompanied by Amoghasiddha
    and Ratnasambhava on one side and Amitabha and Vajrasattva on the other.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ratnasambhava is also represented on the same wall with a dragon frame similar
    to the principal figure’s frame.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The western hall frescoes are arranged in circles, but are numerous and poorly
    preserved.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: A note on the dragon frame identifies a central Garuda at the top and side
    forms that retain the character of makaras.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: An ancient wooden mask, said to be of the kind used by lamas in devil dances,
    is found in a storeroom; present-day masks are described as stucco and different
    from it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The southern White Temple is not entered because a lama is occupying it for
    meditation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The northern temple contains a stucco image of the yellow Tara in an elaborately
    carved wooden frame, a stucco representation of the green Tara, and frescoes of
    eight medicine Buddhas around the yellow Tara.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The eastern temple contains frescoes including a seated Buddha with disciples,
    blue Vajradhara, Amitayus probably as a medicine Buddha with eight followers,
    tutelary deities, and King Kesar riding a white wild ass.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: Several Tibetan inscriptions are copied or noted, and a short Sharada inscription
    is observed but not successfully photographed.
  category: object
  evidence_refs:
  - ev:8
  - ev:10
