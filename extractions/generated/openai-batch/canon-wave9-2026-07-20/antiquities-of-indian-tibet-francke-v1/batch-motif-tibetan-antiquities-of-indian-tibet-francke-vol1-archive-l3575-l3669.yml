  quote: ''
  summary: The passage describes bronze, iron, and gold objects found in graves near
    Leh, then compares the grave conditions with Chinese accounts of burial customs
    in the Empire of the Eastern Women. It discusses the possible date and cultural
    affiliation of the grave. It then describes ruins, monasteries, mchod-rten, bones,
    grain-filled utensils, and cremation tablets at Skara.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Round bronze pieces are described as possible mirrors, and some fragments
    are described as probable remains of bronze pots.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three Christians revisiting the graves found bronze implements including a
    plain spouted can, a seal engraved with a cross-pattern, and a bracelet patterned
    with little circles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Decorative designs were traceable on several fragments, but no script was
    found on them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Fragments of iron implements and one gold article were found; the gold article
    is described as trumpet-mouthpiece shaped, of unknown purpose, and ornamented
    with a curved Greek-key form.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A cited Chinese historical description says that a person of rank was treated
    by removing the skin, placing flesh and bones mixed with gold powder into a vase,
    and burying it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The cited account says that at a sovereign's burial, several tens of great
    ministers and relatives were buried at the same time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author links the cited custom to graves containing many skulls, sometimes
    as many as twenty, and notes that large bronze buttons in the Leh grave are interpreted
    as marks of high rank.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Empire of the Eastern Women is identified in the passage with Nü-Kuo in
    the Sui shu and is said to be bordered by Khotan, Sampaha or Ladakh, Brahmapura,
    and Tibet.
  category: setting
  evidence_refs:
  - ev:5
