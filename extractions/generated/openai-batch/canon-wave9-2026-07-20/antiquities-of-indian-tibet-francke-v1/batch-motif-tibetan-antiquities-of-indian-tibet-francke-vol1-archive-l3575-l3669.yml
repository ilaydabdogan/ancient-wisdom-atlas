  text: The author proposes a date between 1 and 500 A.D. for the Leh grave, based
    on the presence of iron with bronze and the absence of writing.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: The sGar-rtse Monastery at Skara is described as founded by King ’aBum-lde,
    built on a crag resembling an elephant, and later destroyed by the Dogras according
    to local report.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The former village site of Skara is described as lying on a rocky spur with
    ruined houses and as having been evacuated chiefly because of an epidemic; graves
    remain in a nearby side-valley.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: A ruined monastery in a ravine has four standing walls, traces of red frescoes,
