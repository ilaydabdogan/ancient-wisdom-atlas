canonical_text:
  quote: ''
  summary: A travel and antiquarian account describes ancient Buddhist monuments along
    the Indus near Martselang, Chushod, Khrigtse, Ranbirpur, and Sheh; discusses Sanskrit,
    Tibetan, Dard, and Dogra layers in Ladakhi place names and inscriptions; notes
    monasteries, castles, royal residences, and royal rock inscriptions; reports a
    local fear of a devil at Sheh that caused an inscription to be walled off; narrates
    a difficult Indus crossing and arrival at Leh; summarizes early references to
    La-dvags, Leh, Gesar-linked descent traditions, Dard remains, and early European
    visitors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ancient Mon-type mchod-rten are reported at Martselang and along the road
    to Chushod, with related examples on the other bank of the Indus and ladder-type
    specimens at Ranbirpur.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The writer states that the area gave a strong impression of being ancient
    Buddhist ground and suggests that Khrigtse may correspond to an earlier castle
    and monastery mentioned in historical contexts.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage identifies local names in Ladakh as belonging to Tibetan, Sanskrit,
    Dard, and modern Dogra layers, giving examples from each category.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ancient Indian personal names are said to survive in folklore and inscriptions,
    including a ruined castle associated with king Surgamati and inscriptions naming
    Shirima and probably Satyamati.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Stag-sna monastery is described as built on a rock between two arms of the
    Indus and as looking almost like a royal castle.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Stag-sna monastery is described as a residence of several royal family members
    who had taken orders in the ’aBrug-pa sect, and its present form is attributed
    to Ngag-dbang-rnam-rgyal.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sheh is described as apparently having been the capital of Ladakh before the
    old kings of Leh, called professed descendants of mythological king Kesar, were
    expelled.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Sheh, local people are reported to have erected a wall concealing the best-preserved
    royal rock inscription because they feared a devil believed to have its abode
    in front of it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Choglamsa, high Indus water flowed over part of the bridge, and the travelers
    had to ride through deep water for several hundred yards.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: South of Leh, the travelers rode along long royal mani walls.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: La-dvags is said not to appear in Tibetan chronicles before the reign of Nyi-ma-mgon,
    when it was reportedly in the hands of Gesar’s descendants.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The original name of Leh is explained as sLes, an encampment of nomads, and
    ruins on rNam-rgyal-rtse-mo hill are called the Dard castle, with supposed Dard
    graves also mentioned.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Jesuit Desideri is described as having visited Ladakh in 1715, being received
    by King Nyi-ma-rnam-rgyal, leaving after Muslim traders undermined royal confidence,
    and later being indirectly connected with an old Bible found by Moorcroft at Pashkyum.
  category: sequence
  evidence_refs:
  - ev:7
