canonical_text:
  quote: ''
  summary: The passage reports observations at Urni temples, including carvings and
    festival images; notes a shift between Indian hill and Tibetan roof styles; describes
    Chini landscape, ruins, Thakur traditions, Lamaist occupation, aqueduct remains,
    and game slabs; records reports of secret human sacrifice at the KaH/Kali temple;
    and describes Kanawari songs that adapt older heroic song forms to modern figures,
    with a comparison to Tibetan folklore.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Urni the old temple is described as a square-tower temple with a wooden
    verandah and slanting gable roof, and people said its devata had left the place.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The renovated new temple at Urni had primitive wood carvings including hunting
    scenes and a carving interpreted by the narrator as a bird with young eating a
    snake; villagers identified the bird as a peacock, and the narrator queried whether
    it might represent Garuda devouring Nagas.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Villagers showed obscene representations of a man and a woman and said these
    images were shown to girls at a Mela.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The slanting gable beams of the Urni temple had representations of walking
    lions, compared in the passage to those at Sungra.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: In Urni and nearby places, ordinary houses increasingly show Tibetan flat
    roofs, while mandirs still show the old slanting roof of Indian hill tribes; the
    first flat-roof temple noted by the narrator was at Eogi.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: From Chini the snow mountains across the river are visible; the local name
    of the glaciers is given as Eailasa, and a pinnacle is called §iva by the people.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: A large mound near Chini is said to be the site of a castle of an ancient
    Thakur from the Upper Country, apparently Tibet; an unwritten song is said to
    treat his exploits.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Chini mound yields handmade pottery fragments but reportedly no coins,
    and is occupied by Lamaist buildings including a square tower and an enshrined
    mchod-rten.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A second mound below Chini is associated with red bricks and with the same
    Thakur; traces of earthenware aqueduct pipes are said to be found while digging,
    and the water was conducted for miles.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Near the Lamaist temple on the Chini mound are carved stone slabs with chessboard-like
    lines, probably used for the Tibetan game mig-mang; a stone lion also stands above
    a staircase door.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The KaH/Kali temple of Chini is closed to strangers and is said to have been
    the scene of human sacrifices, with a rumor that such sacrifices continue secretly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At the Mela at the KaH/Kali temple, an object of sacrifice is said to be carried
    to the temple by a person whom nobody must meet; the rumor states that anyone
    who meets him will die within a year, and an unnamed European reportedly encountered
    the priest, was cursed, and saw a bundle resembling human limbs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A ruined house near the road from Chini to Pangi is known as the house of
    the first European settler, who married a Kanawari woman by jungle rites and became
    the hero of a Kanawari song praising his complexion as like butter.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that Kanawari songs about prominent people may preserve
    old song wording while exchanging forgotten old kings or heroes for new personalities,
    and it says similar cases occur in Tibetan folklore.
  category: speech
  evidence_refs:
  - ev:8
