  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: A second ruined castle, mBihar-gog, is described on a side-valley spur; the
    author reports no traditions about it and considers it probably Mon or pre-Tibetan.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The old Tibetan settlement rGya-mkhar is on a spur; Moorcroft described houses
