literal_observations:
- id: obs:1
  text: The route crosses the high Thag-lang Pass into rGya, and the remains of Rum-rtse
    are identified in the passage as ancient and asserted to have been a Mon settlement.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The necropolis above rGya contains large single mchod-rten and rows of 108
    small stupas.
  category: object
  evidence_refs:
