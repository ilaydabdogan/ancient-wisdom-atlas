- id: obs:3
  text: Present inhabitants state that the Mon-made mchod-rten are not reverenced
    by them and that Mons and Tibetans had nothing in common.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: One mchod-rten is described as a ladder type with stucco frames for Buddha
    figures; Tibetan mchod-rten reliefs are described as lions, Garudas, and other
    animals placed around the middle portion.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Across the rGya brook lie ruins called Bjum-rtse-mkhar, with cave dwellings
