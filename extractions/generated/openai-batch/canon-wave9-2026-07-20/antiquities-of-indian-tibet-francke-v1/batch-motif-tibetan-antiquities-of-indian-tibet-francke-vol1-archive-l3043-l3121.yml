  summary: 'The passage describes archaeological remains around rGya and Rum-rtse
    in Ladakh: Mon-attributed necropolis structures, stupas, ruined castles, cave
    dwellings, Tibetan settlement remains, watch-towers, local chiefly lineage traditions,
    and inscriptions on mani walls naming ancestors and a Lhasa commissioner/regent.'
  language: English
