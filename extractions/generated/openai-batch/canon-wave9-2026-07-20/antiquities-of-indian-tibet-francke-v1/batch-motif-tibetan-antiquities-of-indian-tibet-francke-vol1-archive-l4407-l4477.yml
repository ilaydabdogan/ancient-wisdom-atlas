canonical_text:
  quote: ''
  summary: 'The passage describes access to and visual contents of several Alchi monastery
    temples: rNam-par-snang-mdzad with ancient inscriptions, a likely royal family
    portrait, Vairochana as principal image, and carved doors; Lo-tsa-bai-lha-khang
    with a seated Buddha and a founder portrait; ''aJam-dbyangs-khang with Dhyani-Buddhas
    of four regions and auspicious emblems; and Lha-khang with Gane^a, historical
    scenes, and inscribed Buddhist saints and lamas.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The monks open the doors of rNam-par-snang-mdzad after an argument invoking
    access previously granted to Mr. Chatterji and the status of King Edward's servants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rNam-par-snang-mdzad courtyard has painted galleries and rude frescoes;
    an inscription states that King bBe-skyong-mam-rgyal renovated the courtyard.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The principal temple is described as apparently untouched since its 11th-century
    foundation and containing many ink inscriptions in ancient dbu-med characters.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: One inscription near the door seems to mention King Byang-chub-sems-dpa, who
    calls himself Nyag-ra, or warden, and gives admonitions to monks; the same epigraph
    names Mar-pa, Al-lci-pa, and 'aBrom-ston.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A wall on the other side of the door bears a well-executed picture of a king
    with his queen and son; the author identifies it as probably representing King
    Byang-chub-sems-dpa with his wife and son.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king in the portrait wears a diadem, a yellow mantle with blue or purple
    round spots containing lion or tiger figures, a white-and-red chequered girdle,
    a fanciful axe, and an umbrella shade; the son is similarly dressed and the queen
    has many small plaits.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The principal image in the shrine is Yairochana, also called rNam-par-snang-mdzad;
    the temple door is elaborately carved in Indian style, and narrow side chapels
    contain huge stucco figures.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Lo-tsa-bai-lha-khang contains a seated Buddha statue, a portrait painting
    of Ein-ehen-bzang-po as founder of the monastery, another image of the lama said
    to be modeled after the fresco, an ancient carved door, and fragments of carved
    wooden pillars.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: "'aJam-dbyangs-khang contains a large stucco image of Dhyani-Buddhas of the
    four regions, color-coded east yellow, south white, north red, and west blue."
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Below the Dhyani-Buddhas are more images and sixteen emblems of happiness,
    including a pair of fishes, the wheel, the parasol, and a cross said to symbolize
    the four quarters of the globe.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The same hall has carved door-beams and pillars, and a brittle wood-carving
    of a standing Buddha above the outside of the door.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Lha-khang contains only pictures; above the door is a figure of Gane^a, while
