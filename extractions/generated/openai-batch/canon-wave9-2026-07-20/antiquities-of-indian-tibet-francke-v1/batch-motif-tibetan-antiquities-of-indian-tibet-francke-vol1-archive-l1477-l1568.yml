canonical_text:
  quote: ''
  summary: A travel account from Poo toward Leh describes crossing the high Hang Pass,
    visiting Tsuling and Li, and recording sacred trees, ruins, monasteries, local
    foundation claims, a nunnery ruin, an irrigation tunnel attributed by locals to
    fairies or gods, and Buddhist images including a multi-headed and multi-armed
    Avalokiteśvara tablet.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The travelling party leaves Poo for Spiti, Eubshu, and Leh on a journey described
    as about four weeks through very uninhabitable country with limited supplies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first day includes crossing the steep Hang Pass, described as 16,000 feet
    high; a prior crossing nearly suffocated a two-year-old child, who was saved by
    hurrying downhill.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before Tsuling, the road passes the ruins of the old Gadgari monastery, where
    only loose stones and terraced ground remain.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Tsuling, a small hut under a huge pencil-cedar tree is called Lha-khang,
    or house of the gods/temple; it is empty except for drums, and mantra-inscribed
    stones are placed below the sacred tree.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Li is described as a village of green fields and apricot trees amid bare rocky
    mountains, with ruins of an ancient castle on a steep rock by the river.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Local people say they formerly lived on the castle rock and left it because
    of many accidents associated with drunkenness; the visitor found loose stones,
    pottery fragments, and traceable rooms.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The bKra-shis-lhun-grub monastery at Li is said to be ancient and belongs
    to the rNyingmapa sect; the abbot says it was founded by Padma-sambhava, while
    the author notes that documentary confirmation is lacking.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says western rNyingmapa monks grow long, uncombed hair.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The monastery has an ancient teak-wood carving representing Buddha surrounded
    by Bodhisattvas of a primitive and simple type.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old Jo-moi dgon-pa nunnery ruins near Li consist of three separate ruined
    houses, a mani wall covered with white pebbles, and two mchod-rten; local people
    say it was abandoned about a hundred years earlier.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: One irrigation canal at Li conducts water through a rock or mountain by a
    long tunnel, and local people firmly believe the tunnel was made by fairies or
    gods.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: In a mchod-rten at Li on the road to Nako, the author found a clay tablet
    representing Avalokiteśvara with eleven heads and eight arms.
  category: object
  evidence_refs:
  - ev:9
