canonical_text:
  quote: ''
  summary: The passage records antiquarian observations on Chemre-Sakti fortresses,
    Ladakhi frontier lineages, Drangtse inscriptions and cross forms, and a deserted
    Staglung site with mchod-rten, cremation tablets, and Ye dharma inscriptions.
    It also offers cautious historical interpretations about Mongol-Lhasa Tibetan
    destruction, cross transmission through Turkestan trade, and Mon/Dard settlement
    terminology.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dr. Shawe and the narrator investigated Chemre monastery and became convinced
    that an earlier monastery had existed on the same site.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Chemre-Sakti valley is described as having three ancient castles; only
    the newest had been visited by Shawe and the narrator, while the two older ones
    remained to be investigated.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Moorcroft observed the fort of Sakti as a ruin on a mountain face, with granite
    block buildings, walls, and towers; it was said to command the northern entrance
    of the valley and to have been dismantled by Kalmaks.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The narrator identifies the Kalmaks who dismantled the fortress as Mongols
    and Lhasa Tibetans under Thse-dbang of Galdan and suggests that they destroyed
    eastern Ladakh fortresses on the way to Basgo in 1646.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bang-kha family is described as holding the hereditary office of defender
    of the eastern gates of Ladakh, with a principal castle at Igu among ancient ruins,
    frescoed walls, and Bodhisattva carvings.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A Drangtse inscription copied by Dr. Shawe was dated by Dr. Vogel to approximately
    700-900 A.D. and contained the Buddhist Ye dharma formula.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator states that the Ye dharma formula served among Ladakhi Buddhists
    of that period in a role comparable to the Om mani formula, and notes a resemblance
    between Indian and Tibetan characters.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Maltese crosses were found near Drangtse; the narrator connects them cautiously
    with possible knowledge of Christian cross forms through Turkestan contacts but
    does not assert a Christian community there.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage describes Ladakhis as trying Christian crosses for efficacy and
    as swallowing pages of Christian books when swallowed Buddhist writings do not
    produce the desired effect.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Staglung, above Nyoma near the Indus, is described as a deserted Mon settlement
    in a dry side valley, with a rocky hill covered by house ruins and small rooms;
    because no ancient fields were visible, the narrator considers it probably a monastery.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Below the Staglung rock were ancient mchod-rten, several rows of 108 small
    mchod-rten made of sun-dried bricks, and red-painted clay cremation tablets, two
    of which bore Ye dharma inscriptions in an ancient Tibetan character type.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The narrator states that the local word Mon is used for pre-Tibetan inhabitants
    at Nyoma and Rubshu and suggests that it refers to Dard settlers; he also cites
    a Dard song about colonising Rong-chu-rgyud, the site of present Nyoma.
  category: speech
  evidence_refs:
  - ev:7
