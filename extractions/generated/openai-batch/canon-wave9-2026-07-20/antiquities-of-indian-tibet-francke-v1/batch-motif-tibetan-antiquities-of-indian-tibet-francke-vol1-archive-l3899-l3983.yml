canonical_text:
  quote: ''
  summary: 'The passage describes Buddhist stone sculptures and ancient mchod-rten
    around Leh and Changspa, then gives local accounts about the ruined Teu-gser-po/Tiserru
    stupa: it was associated with a harmful crag, a fire-breathing demon confined
    beneath a stupa, and storms captured in clay pots. It also notes local resistance
    to opening the monument and a later site with a Bodhisattva sculpture beside a
    pre-Buddhist altar with ibex horns.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several relief stone sculptures near Leh are described, including a standing
    Buddha with Bodhisattvas, a possible four-armed Maitreya figure, and a carved
    mchod-rten.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Changspa sculpture near houses and a brook is enclosed by a masonry wall
    and is said to seem like a Buddhist priest of Mon or Lard times.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A rocky hill west of Changspa contains crematories, ancient mchod-rten, and
    ruins of the Ribug monastery.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ruined mchod-rten called Teu-bkra-shis-’od-mtho is described as the largest
    in Ladakh and as having been built by King ’aBum-lde to cover a crag believed
    harmful to the country.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The investigators climbed the ruined Teu-gser-po/Tiserru stupa, found a surface
    hole opening into a narrow shaft, and Lobzang reached an empty narrow triangular
    room.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Men working in fields rushed toward the investigators and implored them not
    to open the Tiserru, saying this would bring incalculable misfortune to the country.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A local story says that in King ’aBum-lde’s time a demon lived in a cavity
    of the Teu-gser-po rock, had fire proceeding from his mouth, roamed the country,
    and destroyed the king’s palace and parts of Leh.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The same account says the huge stupa was built above the demon’s abode to
    exorcise him, and that people feared opening it would release an evil spirit kept
    under custody for 500 years.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'People also said the stupa stored heavy gales: large clay pots were held
    with mouths open against the wind, closed when the wind subsided, and stored in
    the stupa with storms contained in them.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Ladakh chronicles are reported to give only a short note that the mchod-rten
    was built because “some fatality” had occurred at Leh.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Near dGonpa, the party found a ruined old town, ancient mchod-rten, a Bodhisattva
    stone sculpture in a masonry wall, and a pre-Buddhist lhatho altar furnished with
    many ibex horns.
  category: setting
  evidence_refs:
  - ev:10
