  quote: ''
  summary: The passage reconstructs the older layout of Leh from accounts, sketches,
    chronicles, and surviving buildings, then describes the author’s visit to ancient
    Dard graves near Teu-gser-po, including the grave structure, possible water damage,
    and recovered pottery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that in 1820 the town proper of Leh was enclosed by a fortified
    wall, while some houses existed outside the walls and the later large bazaars
    were not yet present.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A surviving ancient crooked gate north-east of the great mosque is described
    as marking the former southern extent of the old town.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Moorcroft is said to have singled out the royal palace, the Chamba or Byams-pa/Maitreya
    monastery, and the Chenresi or sPyan-ras-gzigs/Avalokitesvara monastery; the passage
    says these three buildings still existed.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage lists additional old-town buildings around the castle, including
    official houses, the New Monastery, the little palace, and the old Byams-pa monastery.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Trebeck’s sketch is reported to show two high palace-like buildings behind
    the Maitreya and Avalokitesvara monasteries, though the passage says no trace
    of them remained.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: After hearing that ancient Dard graves near Teu-gser-po had been opened again,
    the author went to the graves with Mr. Schmitt on 23 August; two Christian boys
    helped open the graves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The described grave had a roof more than a yard below the ground, made of
    large rectangular unhewn stones, with walls of unhewn-stone masonry.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author states as a supposition that the grave roof was originally above
    ground, later deposits buried it, and irrigation water from a field above damaged
    woodwork and oxidized bronze implements.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The grave contained clay pots of various sizes, mostly fragmentary, including
    large pots, smaller pots, and small saucer-like clay vessels described as probably
    lamps.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The accompanying natives are reported as immediately saying that the grave
    pottery was distinctly different from present-day Tibetan pottery.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author and Dr. Shawe are said to have found two medium-sized pots in 1903,
    ornamented with dark red designs, in this grave or another nearby grave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The plate caption identifies clay pots and skulls from Dard graves at Leh.
  category: object
  evidence_refs:
  - ev:7
