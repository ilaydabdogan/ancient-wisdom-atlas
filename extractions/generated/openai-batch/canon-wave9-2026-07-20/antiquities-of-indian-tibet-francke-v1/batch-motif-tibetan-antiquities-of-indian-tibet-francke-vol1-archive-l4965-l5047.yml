  quote: ''
  summary: The passage describes Shargola, its name and song linking the site with
    the morning star and the hero Agu Drumba; local traditions about the messenger
    bLon-po Rig-pa-can and a journey to China for a royal bride; an ant passing through
    a spiral labyrinth in a related tale; ancient painted stupas with Garuda-like
    or heroic figures; a Vajra-pani rock carving and inscriptions; and a cave monastery
    formerly called “Mother house,” associated with Sri-Devi, Satrapa, Agu Drumba,
    and alleged father-son founders.
  language: English
  quote_policy: summarized
