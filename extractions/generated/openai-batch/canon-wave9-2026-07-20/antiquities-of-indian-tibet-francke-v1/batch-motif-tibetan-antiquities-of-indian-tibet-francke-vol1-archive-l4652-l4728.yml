canonical_text:
  quote: ''
  summary: The passage reports flour-and-butter ibex figures given at childbirth,
    relates ibex carvings at pre-Buddhist worship places to prayers for children,
    describes Lamayuru monastery and its Mahatmya traditions about Naropa drying a
    lake, miraculous swastika-shaped sacrificial grain, and an immovable image, and
    records temple iconography including Manjughosa, Taras, Amitayus, Garuda, a Wheel
    of Life fresco, and wrathful figures such as Sri Devi and Mahakala.
  language: English
  quote_policy: summarized
