  summary: 'The passage discusses Kanawari language study and folklore songs, describes
    labor arrangements for women carriers in Bashahr, and records antiquarian observations
    near Wangtu: ancient rock carvings, traveler caves with Tibetan inscriptions,
    and plain burnt-clay tablets in a cave, probably connected with an ancient cremation
    of a lama.'
