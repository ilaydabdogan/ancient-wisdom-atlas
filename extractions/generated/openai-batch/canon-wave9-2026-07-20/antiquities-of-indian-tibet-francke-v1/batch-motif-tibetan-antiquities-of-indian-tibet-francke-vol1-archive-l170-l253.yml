canonical_text:
  quote: ''
  summary: 'The narrator recounts travel near Nirth and Nirmand, including a failed
    and later successful rope-bridge crossing. The passage then reports local traditions
    and ritual accounts: a Nirmand swinging-rope ceremony interpreted as a possible
    survival of human sacrifice; a Kotgur tale about the end of annual virgin sacrifice
    after an oracle-predicted storm; and a related tale of the Rakshasa Bamburaha,
    who preyed on women and was defeated after being blinded by a bird. The passage
    closes with observations on Nirmand as a holy Brahman town with limited inscriptions
    and records.'
  language: English
  quote_policy: summarized
