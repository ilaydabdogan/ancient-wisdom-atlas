canonical_text:
  quote: ''
  summary: A travel narrative describes the narrator's party being delayed at the
    Poo bridge over the Satluj, the local people's joking refusal or neglect of assistance,
    an improvised crossing by a youth using a leather sandal, the narrator's own difficult
    rope-and-saddle crossing, and a brief note distinguishing a nearby monastery named
    bKra-shis-sgang from a famous namesake in Western Guge.
  language: English
  quote_policy: summarized
