canonical_text:
  quote: ''
  summary: 'The passage describes Roman military conditions that aided the spread
    of Mithraism and other Oriental cults: officers influenced conscripts, detachments
    and regiments mixed people of many races and beliefs, foreign auxiliaries were
    often posted far from their homelands, and eastern recruits came from regions
    where Mithraism was established. It then describes soldiers as pious, seeking
    divine protection, preserving ancestral divinities in foreign lands, assembling
    for worship, conciliated Baal, and using worship as a means of reunion and remembrance
    of their distant homeland.'
