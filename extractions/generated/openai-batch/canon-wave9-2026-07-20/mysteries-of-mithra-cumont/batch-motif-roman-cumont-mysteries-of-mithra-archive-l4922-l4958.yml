canonical_text:
  quote: ''
  summary: The passage describes Mithraic deification of natural and celestial bodies.
    A partly corrupted figure-name is said to voyage in the upper spheres on a cart
    drawn by white bulls, and an animal associated with reproduction and spring is
    assigned to a goddess of plant increase and living generation. The passage then
    states that the two luminaries fecundating nature were worshipped in the Mysteries
    as in primitive Mazdaism, but that these ideas were transformed by Chaldaean theories.
    It further summarizes Cumont's claim that Persian religious beliefs in Babylon
    were influenced by astral theology, causing Iranian gods to be likened to stars
    and to acquire double meanings in the West; the Magi are said to have failed to
    harmonize these doctrines with ancient religion.
  language: English
