  summary: The passage describes late Mithraic sanctuaries being sealed or emptied
    for protection, Christian profanation of sanctuaries through corpse burial, Roman
    aristocratic efforts to restore and maintain Mithraic worship, a brief hope of
    revival under Eugenius and Nicomachus Flavianus, the decline of clandestine survivals,
    and the continuation of some Mithraic conceptions and practices in Christian or
    popular settings.
