  summary: The preface describes the religion of the Magi as an Iranian tradition
    that influenced Occidental culture. It says Parseeism affected formative Judaism
    and later Catholicism through disseminated doctrines; Mazdaism influenced European
    thought through Magi in Asia Minor who combined inherited beliefs with Greek doctrines;
    and the resulting religion spread westward, drew people to the altars of an exotic
    god, and was checked by Christianity, with the two rival traditions perceiving
    similarities.
