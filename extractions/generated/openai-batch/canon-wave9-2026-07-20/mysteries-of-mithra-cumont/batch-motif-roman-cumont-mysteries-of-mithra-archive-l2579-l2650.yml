canonical_text:
  quote: ''
  summary: The passage describes the spread and distribution of Mithraic worship in
    Britain and North Africa. In Britain it is presented as concentrated in fortified
    military locations, especially camps and stations along Hadrian's Wall, with commanders
    modeling devotion. The author states that Mithra reached northern regions with
    the army, probably by the middle of the second century, perhaps through Germany.
    In North Africa, the Mysteries are also associated with soldiers and frontier
    posts, but the passage says they were less popular there and were promoted mainly
    by officers or centurions rather than locally levied soldiers, who often kept
    indigenous Punic or Berber cults.
