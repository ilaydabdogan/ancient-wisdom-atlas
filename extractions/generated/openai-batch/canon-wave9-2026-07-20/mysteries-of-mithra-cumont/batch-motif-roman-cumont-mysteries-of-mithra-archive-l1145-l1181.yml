canonical_text:
  quote: ''
  summary: Cumont describes contacts between emigrant Magi and local Anatolian peoples,
    arguing that religious amalgamations occurred. He gives examples of Mithra represented
    like Men, pictured in trousers recalling Attis, and Mithra-Anahita becoming Sabazius-Anaitis
    in Lydia. He states that local gods were identified with the powerful yazata,
    while warning that the exact scope and direction of influence cannot be determined.
  language: English
