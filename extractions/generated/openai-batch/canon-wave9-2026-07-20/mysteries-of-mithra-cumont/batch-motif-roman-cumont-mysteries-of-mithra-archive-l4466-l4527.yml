canonical_text:
  quote: ''
  summary: The passage describes a reproduced statue from the mithraeum of Ostia,
    dedicated in 190 A.D. by C. Valerius Heracles and his sons. The statue is identified
    as Mithraic Kronos, Aion, or Zervan Akarana representing boundless time. It depicts
    a nude leontocephalous figure entwined six times by a serpent, with four season-marked
    wings, keys, a scepter, a thunderbolt, and base symbols associated with several
    gods. The passage states that these adjuncts characterize the Mithraic Saturn
    and symbolize the embodiment of the powers of all the gods.
