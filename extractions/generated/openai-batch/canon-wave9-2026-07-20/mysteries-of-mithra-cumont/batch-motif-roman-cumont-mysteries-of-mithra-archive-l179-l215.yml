canonical_text:
  quote: ''
  summary: The passage describes an inevitable religious conflict for world dominion,
    in which parties accused the Spirit of Deception of parodying their rites. It
    states that people were called to choose between Ormadz and the Trinity, that
    Mithraism was defeated in the Occident, that Christians were not similarly successful
    in Sassanid Persia against Zoroastrianism, and that Manichaeism later appeared
    as Mithraism's successor and continuator in a renewed Persian assault on the Occident.
  language: English
  quote_policy: summarized
