canonical_text:
  quote: '"Mithra was his only crown."'
  summary: The passage describes grades and authority within Mithraic initiation,
    including Servants, Ravens, Leontics or Participants, Fathers, and the Pater Patrum.
    It explains that lower grades did not yet permit participation, that Fathers conferred
    higher initiation, and that initiation involved an oath of secrecy. A special
    vow for the grade of Miles is described through the rejection of a crown presented
    on a sword and the declaration that the crown belonged to Mithra.
  language: English
  quote_policy: quoted
