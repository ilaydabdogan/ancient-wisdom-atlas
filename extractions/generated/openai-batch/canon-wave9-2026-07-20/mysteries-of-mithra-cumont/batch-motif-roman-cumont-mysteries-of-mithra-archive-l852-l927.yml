  summary: The passage describes the spread and prominence of Mithra’s festival and
    cult, the role of Persian royal and clerical institutions, and the assimilation
    of Iranian/Mazdean deities with Babylonian/Chaldean astral theology. It especially
    compares Mithra with Shamash as a solar god of justice, mountain appearance, celestial
    chariot, victory, and royal protection.
