  summary: The passage describes Antiochus I of Commagene as a ruler who combined
    Persian and Greek religious and dynastic memories, then presents Hellenistic Asia
    Minor as a zone of religious syncretism after the Persian collapse and Macedonian
    conquest. It discusses Magian propaganda, the likely consolidation of Mithraism
    before its spread in the Roman Empire, and Armenian traditions in which Mithra
    was associated with fire, the sun, and divergent birth legends.
