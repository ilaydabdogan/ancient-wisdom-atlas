  summary: The passage describes Mithraic ablutions and sacred banquets as rites that
    relieved conscience, strengthened participants, and promised a better life. It
    then argues that Mithraism was disadvantaged by excluding women from its Mysteries,
    notes the lack of female priestesses, initiates, or donors in surviving inscriptions,
    and says the cult formed an alliance at Rome to allow some feminine devotion.
    The passage begins a discussion of Mithraism’s relationship to other religions
    of the empire, contrasting Persian and Sassanid exclusiveness with Mithraic accommodation
    to Hellenic and Graeco-Roman forms, including Iranian gods worshipped under Greek
    and Latin names.
