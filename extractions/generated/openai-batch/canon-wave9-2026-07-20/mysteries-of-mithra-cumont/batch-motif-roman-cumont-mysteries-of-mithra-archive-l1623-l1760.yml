  summary: The passage describes Mithraism as a composite religion formed from Mazdean,
    Babylonian/Semitic, Asia Minor, and Hellenic elements; traces its dissemination
    after the defeat of Mithridates Eupator through Pontic refugees and Cilician pirates;
    describes a Tarsus medallion showing Mithra about to slay a bull; and argues that
    Mithra remained largely excluded from the Hellenic world while other foreign cults
    were received more readily.
