canonical_text:
  quote: ''
  summary: The passage describes Mithraic teaching on the soul's ascent through celestial
    zones after death, the shedding of passions and faculties, Mithra's judgment and
    guidance of the faithful, the resurrection of the flesh, a final assembly and
    separation of good from bad, a sacrifice of the divine bull whose mixed beverage
    grants immortality to the just, and a devouring fire that destroys the wicked
    and renews the universe.
