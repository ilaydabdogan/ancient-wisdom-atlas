canonical_text:
  quote: ''
  summary: The passage describes Mithra as an ever-watchful deity who sees and knows
    all, guards truth and contracts, punishes perjury, brings light, fertility, waters,
    health, prosperity, wisdom, and harmony, protects Mazda's creation from dark and
    evil beings, defeats hostile enemies, and grants victory to properly instructed
    worshipers who honor him with sacrificial libations. It also states that this
    warrior character develops an older day-night struggle and resembles, in broad
    outline, a Vedic picture of an old Aryan deity.
  language: English
  quote_policy: summarized
