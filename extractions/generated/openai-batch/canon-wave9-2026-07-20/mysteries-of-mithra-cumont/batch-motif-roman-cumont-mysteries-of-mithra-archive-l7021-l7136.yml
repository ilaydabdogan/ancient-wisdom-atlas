canonical_text:
  quote: ''
  summary: The passage discusses the taurobolium as a blood-bath rite associated with
    Cybele/Mater Magna, Anahita, and Ma; describes a victim slaughtered above a mystic
    in a pit; interprets the rite as purification, immortality, soul-renovation, and
    new birth; compares these hopes with Mithraic belief attached to the mythical
    bull; and describes Magna Mater as nourishing Earth, fecundated by the Heavens,
    within a pantheon centered on the Sun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that certain Mazdean beliefs were adopted by the cult of
    Pessinus/Cybele and that the taurobolium, with ideas of purification and immortality,
    passed from temples of Anahita into those of the Mater Magna.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The taurobolium is described as a victim being slaughtered on a latticed platform
    so that its blood fell upon a mystic lying in a pit below.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that blood was regarded as the vehicle of vital energy,
    and that the recipient poured it on the body and moistened the tongue with it
    to receive courage and strength from the slaughtered animal.
  category: attribute
  evidence_refs:
  - ev:3
