canonical_text:
  quote: ''
  summary: The passage identifies an early artistic type of tauroctonous Mithra and
    says the group of Mithra Tauroctonos held the place of honor in the apse of Mithraic
    spelaea. It then describes how Greek philosophical interpretation, especially
    Stoicism, was used to read Magian and Persian traditions allegorically. It emphasizes
    continuity of ritual practice, describing Magian sacrifices with prayers before
    a fire altar, sacred twigs, milk, oil, honey, and precautions around the divine
    flame, and cites Antiochus of Commagene as prescribing ancestral Persian and Greek
    ritual customs.
  language: English
  quote_policy: summarized
