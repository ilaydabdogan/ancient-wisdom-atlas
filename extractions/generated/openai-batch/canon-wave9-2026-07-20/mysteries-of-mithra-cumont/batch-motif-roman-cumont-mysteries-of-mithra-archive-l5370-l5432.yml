  quote: ''
  summary: The passage recounts a Mithraic tradition in which Mithra is born from
    a Generative Rock beside a river and sacred tree, witnessed by shepherds. Mithra
    emerges armed and torch-bearing, receives offerings, clothes himself with fig-tree
    leaves, then contends with the Sun and establishes a covenantal alliance. The
    passage begins to introduce Mithra's combat with the primordial bull created by
    Ormazd.
