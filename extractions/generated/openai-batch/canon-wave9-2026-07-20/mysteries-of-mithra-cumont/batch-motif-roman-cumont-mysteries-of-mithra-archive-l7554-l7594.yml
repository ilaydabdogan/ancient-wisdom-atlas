  summary: The passage contrasts Christian and Mithraic or Mazdean religious materials.
    It rejects a strained parallel with Christ's Bethlehem birth, contrasts Mazdaism's
    mythical redeemer with the Christian passion of the God sacrificed on the cross,
    discusses possible Mithraic or Mazdean influence on Christian liturgy and sacramental
    hopes, mentions a custom of invoking the Sun three times daily, and footnotes
    scholarly hypotheses about the Gospel birth narrative, Magi, shepherds, and Mithra's
    advent while emphasizing lack of proof and variation in Mazdean beliefs.
