canonical_text:
  quote: A few alterations in costume and attitude transformed a pagan scene into
    a Christian picture.
  summary: The passage characterizes Mithraic art as symbolic and didactic rather
    than primarily aesthetic, then argues that its cosmic allegories and certain Mithraic
    visual types were adopted or adapted in Christian art. It gives examples in which
    a Mithraic rock-and-water scene becomes Moses at Horeb, a solar scene becomes
    Elijah's ascension, and the tauroctonous type persists in images of Samson and
    the lion.
  language: English
  quote_policy: quoted
