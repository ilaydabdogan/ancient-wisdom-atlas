  quote: ''
  summary: 'The passage describes Roman imperial use of solar and Mithraic symbolism:
    the epithet “eternal,” palace fire and ceremonial lamp, radiate crown, and claims
    or metaphors of kinship or identity between rulers and the Sun, Helios, or Mithra.
    It also presents these usages as related to Persian, Hellenistic, Egyptian, Sassanian,
    and Roman traditions of royal solar legitimation.'
