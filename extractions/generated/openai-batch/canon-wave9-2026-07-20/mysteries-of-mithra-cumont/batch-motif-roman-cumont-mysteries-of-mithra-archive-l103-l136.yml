  quote: ''
  summary: In the preface, the author defines the work as a study of the origin and
    history of the Mithraic religion, not a general account of paganism’s downfall
    or the wider struggle between idolatry and Christianity. He frames the study as
    examining why a Mazdean sect failed under the Caesars to become the dominant religion
    of the Roman Empire, and begins a contrast between the Iranian and Graeco-Latin
    worlds.
