  summary: The passage argues that Roman imperial ideology treated the sovereign as
    superhuman and that Aurelian attempted to create a broad official religion, modeled
    in function on Persian precedent, to support imperial absolutism. The plan failed
    because of Christian resistance, yet a throne-and-altar alliance was later realized
    through the Church. The priests of Serapis, Baal, and Mithra are described as
    precursors who preached divine right of kings in the West. The passage then introduces
    the doctrine of Mithraic Mysteries, stressing that Mithraism was practiced for
    more than three centuries across the Roman empire, changed under philosophical
    and social influences, and cannot be traced in detail because of inadequate evidence,
    though its images and formulas remained notably continuous.
