canonical_text:
  quote: ''
  summary: The passage describes Mithraic bas-reliefs and related monuments as locally
    produced provincial Roman cult art. It emphasizes their display in temple apses
    for the faithful, their painted and gilded polychromy, their visibility in dark
    subterranean crypts, and a comparison between vivid Oriental coloring and Lucian's
    contrast of Hellenic deities with gods imported from Asia. It closes by locating
    notable examples in northern Gaul and the Rhenish frontier, especially the Osterburken
    relief.
