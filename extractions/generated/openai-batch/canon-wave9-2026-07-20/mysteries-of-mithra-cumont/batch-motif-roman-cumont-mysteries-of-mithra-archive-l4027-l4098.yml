canonical_text:
  quote: ''
  summary: 'The passage explains how Roman imperial divinization met resistance, then
    presents Mithraic and Persian ideas of sacred kingship: kings are not gods, but
    possess or are protected by a divine element or royal glory granted by Ahura-Mazda.
    This Hvareno is described as supernatural fire or a radiant nimbus that legitimates
    rulers, abandons usurpers, and was compared by other peoples to Fortune, Gadd,
    or Tyche.'
