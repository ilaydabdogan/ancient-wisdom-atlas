canonical_text:
  quote: ''
  summary: The passage summarizes Mithraic cosmic doctrine as identifying heaven,
    earth, and ocean with Greco-Roman and Mazdean divinities; narrating Zeus/Jupiter's
    succession from Kronos/Saturn; describing Jupiter and Juno as a sovereign generative
    couple whose offspring form the celestial court on Olympus; contrasting this luminous
    abode with an underworld ruled by Ahriman/Pluto and Hecate; and recounting rebel
    monsters assaulting Heaven and being driven into the abyss.
