canonical_text:
  quote: ''
  summary: The passage describes a tauroctonous Mithra image and discusses Mithraism's
    adaptation to Roman, Celtic, Syrian, and Phrygian religious environments, including
    initiatory restrictions, local divine identifications, rivalry with Isis, association
    with Syrian cults, and an alliance or communion with the cult of the Great Mother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A figure caption describes Tauroctonous Mithra with the usual accessories,
    a bust of the Sun in the upper left, a bust of the Moon in the upper right, a
    bull whose horn is apparently grasped by the god's broken left hand, and dadophori
    with torches.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says a Mithraic adherent could dedicate a votive inscription to
    Jupiter, Juno, and Minerva while giving those divine names a different meaning
    from their ordinary one.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An injunction to refrain from other Mysteries is said to have been imposed
    on Mithraic initiates, but the passage says this could not long withstand imperial
    pagan syncretism if it was ever obeyed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that in the fourth century the 'Fathers of the Fathers' performed
    high priestly offices in temples of various kinds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sect is described as adapting itself to its environment, influencing an
    indigenous cult in the Danube valley and accommodating Celtic divinities in or
    near Mithraic crypts in the Rhine region.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says regional dogmatic shadings did not imperil Mithraism's fundamental
    unity and that there is no evidence these deviations provoked heresies.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage describes hostility between Egyptian and Persian religions as
    persisting at Rome and says the Iranian Mysteries were separated from those of
    Isis by secret rivalry or open opposition.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says the Mithraic cult associated readily with Syrian cults, and
    that doctrines imbued with Chaldaean theories resembled Semitic religions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Jupiter Dolichenus is said to have been worshipped simultaneously with Mithra
    in Commagene, to have remained a military divinity like Mithra, and to be found
    beside Mithra in western provinces; at Carnuntum a mithraeum and dolichenum adjoined
    each other.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Baal is described as readily identified with Ormazd, who had become Jupiter-Caelus,
    and Mithra is described as easily likened to the solar god of the Syrians.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The union of Mithra and Anahita is described as the counterpart of the intimacy
    between Attis and Cybele, and the two are called sacred couples whose harmony
    persisted in Italy.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The most ancient mithraeum known to the author is said to have been contiguous
    to the metroon of Ostia, and the worship of the Iranian god and Phrygian goddess
    is said to have been conducted in intimate communion across the empire.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage says only men were permitted in the secret ceremonies of the Persian
    liturgy, while other Mysteries admitted women and therefore formed some kind of
    alliance with it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Great Mother is said to have succeeded to Anahita's place; she had 'Mothers'
    as Mithra had 'Fathers,' and her initiates called one another 'Sisters' as Mithra's
    votaries called one another 'Brothers.'
  category: relationship
  evidence_refs:
  - ev:7
