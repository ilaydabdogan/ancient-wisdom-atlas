canonical_text:
  quote: ''
  summary: Cumont describes Mithra/Mitra as an Indo-Iranian deity known in both the
    Vedas and Avesta, associated with light, Heaven, and ethical truth against falsehood.
    He summarizes a theory of possible Babylonian astral influence, states continuity
    of Iranian Mithra worship until Islam, and begins an Avestan description of Mithra
    as a genius of celestial light who appears on mountain summits before sunrise
    and crosses the firmament in a chariot drawn by four white horses.
  language: English
  quote_policy: summarized
