  summary: The passage surveys the spread of Mithraism in the western Roman Empire,
    especially through sea traffic, the Rhone basin, merchants, slaves, and servitors.
    It lists Mithraic associations, sanctuaries, inscriptions, temples, statues, and
    iconographic representations including torch-bearers, the sun on a quadriga, leontocephalous
    Kronos, a tauroctonous god carved near a spring, and a spelaeum with a lion-headed
    god relief.
  language: English
  quote_policy: summarized
