canonical_text:
  quote: ''
  summary: 'The passage explains that Mithraic images of Greek Olympian gods could
    be interpreted not as Mazdean theological personifications but as luminous wandering
    stars. It describes a double interpretation of the Sun, sometimes identical with
    Mithra and sometimes distinct, and distinguishes two solar divinities: an Iranian
    one connected with Persian Hvare and a Semitic one connected with Babylonian Shamash
    and Mithra. It also describes homage to sidereal divinities, especially the twelve
    zodiac signs, represented in mithraea, associated with adverse astral influences,
    monthly presidencies, and seasonal groupings.'
  language: English
  quote_policy: summarized
