canonical_text:
  quote: ''
  summary: The passage describes a forthcoming western union between the Mysteries
    of Mithra and those of the Great Mother, then discusses Bactrian or Scythian royal
    coins depicting Mithra alongside other gods. It then summarizes the effects of
    Greek cultural expansion after Alexander, the resistance of Persian traditions
    to full Hellenization, and the syncretic identifications made by Magi of Asia
    Minor between Mazdean and Hellenic deities, including Ahura-Mazda with Zeus, Verethraghna
    with Heracles, Anahita with Artemis Tauropolos, and Mithra with Shamash.
  language: English
  quote_policy: summarized
