  summary: The passage describes a cosmic male figure marked with the zodiac and seasonal
    emblems, representing celestial and terrestrial cycles. He creates and destroys
    all things, rules the four elements, contains the power of the gods, and is identified
    with Destiny, primitive light, or primitive fire. The passage then summarizes
    a Mithraic cosmogony in which a first principle generates Heaven and Earth; Earth,
    impregnated by her brother, gives birth to Ocean, and these form a supreme triad
    whose relation to Kronos or Time is said to be unclear.
