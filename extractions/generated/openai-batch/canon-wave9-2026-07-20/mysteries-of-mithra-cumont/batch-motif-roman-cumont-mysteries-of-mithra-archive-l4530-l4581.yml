canonical_text:
  quote: ''
  summary: The passage identifies a figure of Mithraic Kronos and argues that Mithra
    was accompanied into the Occident by other Mazdean divinities. It states that
    Mithra was the principal hero but not the Supreme God. At the top and origin of
    the Mithraic hierarchy it places boundless Time, described as ineffable and represented
    as a lion-headed human monster enwrapped by a serpent, bearing sovereign attributes,
    keys to heavenly portals, and wings; the serpent is said to typify the Sun’s course
    on the ecliptic.
