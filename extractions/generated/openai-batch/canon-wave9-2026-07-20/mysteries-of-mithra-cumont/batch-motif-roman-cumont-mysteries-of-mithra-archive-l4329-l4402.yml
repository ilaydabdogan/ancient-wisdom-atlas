canonical_text:
  quote: ''
  summary: 'The passage explains how Mithraic and astrological doctrines were used
    to support imperial divinity: souls descend from the empyrean through planetary
    spheres, the Sun grants royal power, emperors are portrayed as solar and star-destined,
    and after death they return heavenward, imagined like Mithra borne by Helios in
    a chariot. It also identifies Hvareno, the Fortune of the King, and solar soul
    doctrine as two theories elevating rulers above ordinary humanity.'
  language: English
  quote_policy: summarized
