canonical_text:
  quote: ''
  summary: The passage describes Mithraic doctrine as aligned with Roman physics and
    astronomy and as deifying physical reality. It presents natural elements as objects
    of devotion, imagines an initiate approaching a sacred grotto while perceiving
    surrounding nature as divine, and then discusses the loss of Mithraic liturgical
    books. It notes Greek and non-Greek sacred formulae, a bas-relief of tauroctonous
    Mithra with animal, torch-bearer, planetary, tree, and banquet figures, the claimed
    Persian/Zoroastrian character of rites, and seven named degrees of initiation
    with ritual costumes or animal-like actions.
