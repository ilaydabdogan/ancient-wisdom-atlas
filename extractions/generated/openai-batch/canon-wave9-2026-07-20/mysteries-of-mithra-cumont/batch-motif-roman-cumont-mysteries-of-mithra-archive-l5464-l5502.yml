  summary: The passage recounts Mithra capturing a wild bull on a mountain-side, enduring
    its violent struggle, dragging it backward into his cave, and this painful journey
    becoming a symbol of human sufferings. The bull then escapes; the Sun sends a
    raven messenger commanding Mithra to slay it, and Mithra reluctantly pursues it
    with his dog and overtakes it at the cave.
