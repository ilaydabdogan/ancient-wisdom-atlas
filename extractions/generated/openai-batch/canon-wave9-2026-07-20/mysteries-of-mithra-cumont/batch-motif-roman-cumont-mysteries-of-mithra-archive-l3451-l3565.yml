  quote: ''
  summary: The passage argues that the spread of Mithraism in the Roman Empire cannot
    usually be assigned to one exact channel because the evidence is often sparse
    and the causes are intertwined. It presents soldiers, slaves, and merchants as
    the chief agents of diffusion, considers possible subsidiary channels such as
    troops, officials, priests, astrologers, and soothsayers, and uses the presence
    or absence of Mithraic monuments in various regions as evidence for this historical
    explanation.
  language: English
  quote_policy: summarized
