  summary: The passage describes Mithra as a divine helper, undefeated defender of
    truth and holiness, antagonist of darkness, and giver of victory and salvation.
    It then summarizes Mithraic or Persian mystery doctrine about survival after death,
    the descent of souls into bodies, post-mortem contest and judgment, punishment
