  summary: The passage discusses the possible early introduction of Mithraic Mysteries
    into Rome through Cilician pirates conquered by Pompey, the presence of a small
    distrusted group of Mithraic devotees in late republican Rome, and the increasing
    evidence for Mithraism in the Roman Empire from literary testimony, inscriptions,
    dedications, military movement, and temples. It includes mention of Mithra as
    the Persian god, yazata, invincible god, and tauroctonous hero, with a Latin footnote
    connected to a rocky cave setting and horn-twisting imagery.
  language: English with a Latin footnote citation
  quote_policy: summarized
