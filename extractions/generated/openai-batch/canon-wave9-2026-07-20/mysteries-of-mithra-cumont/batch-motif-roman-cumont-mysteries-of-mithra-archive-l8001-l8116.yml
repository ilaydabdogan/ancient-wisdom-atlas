  summary: 'The passage presents Manichaeism as closely affiliated with Mithraism
    through shared Oriental, Babylonian, Persian dualist, and Hellenic elements, and
    as historically succeeding Mithraism in the fourth century. It then discusses
    Mithraic monuments as religious-historical documents and describes tauroctonous
    Mithra as an adapted sculptural type: Mithra subdues and kills a fallen bull with
    a knife, while the bull is shown as a dying victim.'
