  quote: ''
  summary: The passage argues that Mithraism retained Persian and Asiatic elements
    despite the Greek label of “Mysteries.” It describes secret doctrine, graduated
    initiations, a hereditary Magian or Mazdean priesthood, classes of neophytes,
    and full revelation reserved for a few. It also lists ritual survivals such as
    animal disguises, consecrated mountain caves, and cruel tests of initiates, and
    identifies ancient Iranian faith as the basal layer of Mithraism.
  language: English
  quote_policy: summarized
