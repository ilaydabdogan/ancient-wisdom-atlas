  summary: The passage describes Roman imperial use of a golden statue of Fortuna
    regia as a royal safeguard, the adoption of the titles pius, felix, and invictus
    after Commodus, and Cumont’s account of divine, solar, Mazdean, and astrological
    ideas underlying imperial legitimacy, victory, and the emperor’s alliance with
    the Sun and Mithra.
