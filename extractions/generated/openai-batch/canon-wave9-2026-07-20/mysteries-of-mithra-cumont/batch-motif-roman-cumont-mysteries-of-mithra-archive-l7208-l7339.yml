comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Mithraic Mysteries and Christianity as eastern
    movements that spread almost contemporaneously, under analogous conditions, and
    eventually entered into struggle.
  claim_level: same_function
  target: Christianity as a rival eastern religious movement in the Roman Empire
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison concerns historical diffusion and rivalry, not necessarily
    shared myths, rites, or doctrines.
- id: claim:2
  claim: The passage links Aurelian's public cult of Sol invictus with Mithraic devotion
    to Sol, while also warning that the state religion must not be confused with Mithraism.
  claim_level: same_function
  target: Aurelianic state cult of Sol invictus and Mithraic solar devotion
  evidence_refs:
  - ev:5
  counter_evidence_refs:
  - ev:5
  confidence: medium
  limitations: 'The passage stresses institutional differences: public temple, ceremonies,
    games, and clergy versus Mithraic cave Mysteries.'
- id: claim:3
  claim: The passage presents Macrobius's Helios-centered syncretic theology and fourth-century
    Mithraism's union of gods and myths as aligned forms of late antique solar synthesis.
  claim_level: same_function
  target: Late antique solar syncretism centered on Helios/Sol
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The alignment is thematic within the passage; it does not demonstrate
    a single institutional origin for all forms of solar syncretism.
- id: claim:4
  claim: The passage identifies Mithra's hoped-for universal domination with the invincible
    Sun, supporting a close equivalence between Mithra and Sol invictus in this late
    Mithraic synthesis.
  claim_level: same_motif
  target: Mithra identified with Sol invictus
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The claim applies to the passage's account of fourth-century Mithraism
    and should not be generalized to all periods of Mithraic religion without additional
    evidence.
