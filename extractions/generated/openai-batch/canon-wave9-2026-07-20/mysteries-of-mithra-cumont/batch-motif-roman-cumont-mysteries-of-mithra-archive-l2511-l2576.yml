  quote: ''
  summary: The passage describes a Neuenheim bas-relief found in a cave near the Heiligenberg,
    noting that it shows twelve scenes from the life of Mithra, including his birth
    from rocks, his capture and carrying of a bull to a cave, his ascent to Ahura-Mazda,
    and a scene of Kronos/Zervan handing the scepter of world government to Zeus/Ahura-Mazda.
    It then surveys Mithraic remains and dedications in Gaul and nearby regions, including
    a Geneva altar, spelaea, rock-carved reliefs, and two torch-bearer statues at
    Boulogne.
