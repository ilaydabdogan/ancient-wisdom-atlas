  summary: The passage explains Mithraic sacred masks and animal disguises, reports
    ancient and Christian interpretations of them, relates animal titles to other
    mystery-cult practices, and describes seven Mithraic grades as corresponding to
    seven planetary spheres traversed by the soul. It also names grades such as Raven,
    Occult, Soldier, Persian, Runners of the Sun, and Fathers, and describes symbolic
    objects such as veils and the Phrygian cap.
