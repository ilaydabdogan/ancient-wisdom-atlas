  summary: 'The passage describes Mithraic propaganda and imperial support: after
    an Antonine emperor abandoned an older prejudice, later imperial protection of
    the new religion is said to have been assured. A figure caption identifies a pedestal
    from Carnuntum as the gift of Diocletian, Valerius, and Licinius. The passage
    also states that from the early third century the religion had a chaplain in the
    palace of the Augusti, and that votaries offered vows and sacrifices for the protection
    of Severus and Philippus. The final sentence begins an incomplete reference to
    Aurelian.'
