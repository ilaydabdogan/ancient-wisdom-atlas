canonical_text:
  quote: ''
  summary: 'Cumont describes Mithraic initiatory rites: repeated water ablutions for
    neophytes, a forehead seal or brand for the soldier, honey purification for the
    Lions because of their association with fire, and a consecrated bread-and-cup
    oblation derived from Iranian or Mazdean ritual patterns and compared by ancient
    apologists to Christian rites.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Repeated ablutions are said to have been prescribed to neophytes as a baptism
    intended to wash away guilty stains.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lustration is described as possibly having different effects at each stage
    of initiation and as taking the form of sprinkling with holy water or actual immersion.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A ceremony is described in which the forehead of the soldier was signed or
    sealed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The seal is described not as an unction but as a mark burned with a red-hot
    iron, analogous to a military recruit mark.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The indelible imprint is said to preserve the memory of a solemn engagement
    by which the person under vow contracted to serve in Mithraism.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: At reception among the Lions, new purifications occurred; water was renounced
    because the lion was treated as an emblem of fire and water as hostile to fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Honey was poured on the initiate's hands and applied to his tongue to preserve
    him from the blemish of sin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Honey is described as having preservative virtue, being associated with the
    moon, being food of the blessed, and making the neophyte a peer of the gods when
    absorbed.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Mazdean service, the celebrant consecrated bread and water mixed with
    Haoma and consumed these foods during sacrifice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Mithraic initiations, vine juice was substituted for Haoma; a loaf of bread
    and a goblet of water were placed before the mystic, and the priest pronounced
    a sacred formula over them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The bread-and-water oblation, with which wine was later mixed, was not granted
    until after a long novitiate and is probably associated with initiates of the
    Lions degree.
  category: sequence
  evidence_refs:
  - ev:6
