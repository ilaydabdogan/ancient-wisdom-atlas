canonical_text:
  quote: ''
  summary: The passage gives related variants of a narrative in which a man or Magpie
    is connected with buffalo hunting, animal food choices, buffalo and moose wives,
    a jealous race ending at a mudhole, the buffalo-wife’s return to her father’s
    buffalo camp, killing in a buffalo war dance, and, in one version, restoration
    to life from recovered hair followed by a magical iron house that destroys charging
    buffalo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A father-in-law tells the man not to look outside his tent; after hearing
    buffalo running, the man looks out and sees his brother chasing buffalo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man makes bows and arrows, gives each man two arrows at the Indian camp,
    and the people kill most of the buffalo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man offers grass, willow leaves, and other foods to animals and asks what
    each would like to live on; the old buffalo chooses grass, the moose chooses willow
    leaves, the bear chooses berries and roots, and the deer chooses grass and leaves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator states that this food-choosing episode explains how the animals
    got their food.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man has a calf by his buffalo-wife and also marries a moose-woman.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Magpie lusts for one of the wives; the buffalo-woman and moose-woman race,
    and after the moose makes a mudhole in the buffalo-woman’s path, the buffalo-woman
    becomes stuck and the moose wins.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The buffalo-woman leaves with the calf and returns to her father; her husband
    follows to the buffalo camp, where the old buffalo arranges a buffalo dance in
    which the man is trampled to death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Magpie, who is living with the moose-woman, goes to look for his missing brother;
    the calf tells him how the buffalo killed his father, and Magpie finds some of
    his brother’s hair and restores him to life.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The restored man sends a challenge to the buffalo through the calf; Magpie
    chews red iron, throws it into the air, and makes an iron house, against which
    charging buffalo kill themselves.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the variant marked “(b),” Magpie is married to a buffalo and a moose-woman;
    jealousy between the women leads to a race, the moose wishes the buffalo stuck
    in a mudhole, and the buffalo returns to her father after losing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the variant marked “(b),” Magpie follows the buffalo-woman; the buffalo-calf,
    lingering behind, directs him by its footsteps to springs when he becomes thirsty,
    saying he will become thirsty three times before reaching the buffalo camp.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the variant marked “(b),” the old buffalo tells Magpie there will be a
    war dance and instructs him how to act; after Magpie eats one of his brothers-in-law
    under restrictions, the buffalo dance three times without hurting him and kill
    him on the fourth time.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the variant marked “(b),” when Magpie does not return, the moose-wife cries;
    a male relative goes looking, finds a buffalo trail, and a calf reports that the
    buffalo hooked Magpie to death in their war dance.
  category: sequence
  evidence_refs:
  - ev:10
