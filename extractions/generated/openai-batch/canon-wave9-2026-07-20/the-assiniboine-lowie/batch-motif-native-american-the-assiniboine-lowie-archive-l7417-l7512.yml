canonical_text:
  quote: ''
  summary: Sitcon'ski disguises himself in a woman's dress, marries a youth who avoids
    women, pretends pregnancy, and uses a plucked fox as a false baby until the deception
    is exposed. He then escapes, returns toward an old wife, and proceeds through
    comic encounters with red berries whose second name causes scratching, a white
    root whose second name causes wind and repeated upward motion, snakes mistaken
    for whips, and water plants at a lake.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before reaching the next camp, Sitcon'ski puts on a woman's dress and tells
    a wood-chopping girl he has come to marry her brother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl's family brings Sitcon'ski in; the young man, described as not liking
    women, reluctantly enters and marries Sitcon'ski.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sitcon'ski pretends to be pregnant and answers family concerns about work
    during pregnancy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sitcon'ski catches a little fox, removes its hair, wraps it in his dress,
    and has it cry like a baby.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the family tries to wash the supposed child, the fox escapes; Sitcon'ski
    laughs and says he deceived the youth because no woman had known him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After escaping, Sitcon'ski meets a deer and then returns to his old wife,
    explaining that people had given him a young wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A patch of red berries gives the names 'Just Berries' and 'Scratch-Rump';
    after Sitcon'ski eats them and uses the second name, he scratches until blood
    flows.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: To stop the scratching, Sitcon'ski heats flat rocks in a fire and sits on
    them, burning his buttocks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sitcon'ski places a piece of burnt skin on trees, and the narrator says this
    is why gum is now on them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A white root gives the names 'Edible Root' and 'Wind'; after eating many roots
    and using the second name, Sitcon'ski repeatedly breaks wind and rises into the
    air.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: During the wind-caused rising and falling, Sitcon'ski breaks willow branches
    and trees, falls headfirst into a mudhole, and finally gets out.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sitcon'ski finds many snakes, calls them whips, is coiled by them, uses snakes
    as whips, and kills four hundred.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Sitcon'ski reaches a large lake, sees plants growing in the water, and asks
    their name; they answer 'Reed (?)'.
  category: speech
  evidence_refs:
  - ev:8
