    and leads the young man into a big hole with a lodge inside and a smoke-hole.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 12669-12671
  quote_or_summary: Inside the lodge, ropes are stretched across and feathered dance
    ornaments hang from them.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 12671-12677
  quote_or_summary: The prairie-dog summons young men, announces a dance for the people,
    has them sing songs, directs the observer to look at strings and ornaments, and
    the men put on ornaments and dance.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 12677-12683
  quote_or_summary: The prairie-dog asks whether the young man can make a dance like
    it, gives a rule about camping in the same place, tells him to go home and establish
    the dance, and many young men are taught it and its songs.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 12683-12687
  quote_or_summary: The young men are told to bring guns and arrows, each is assigned
    to kill a certain bird or animal, and they return with hawks, crows, owls, gophers,
    prairie-dogs, badgers, and buffalo-hoofs.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 12687-12689
  quote_or_summary: The skins are dried, tanned, cut into strips, and hung on ropes
    before the dance begins.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 12689-12696
  quote_or_summary: The dance is performed, the performers remove and give away their
    apparel, the master of ceremonies calls it the Big Dog dance, and many people
    join the society.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 12697-12701
  quote_or_summary: Crow tells the chief’s son they must not gamble any more but must
    scalp as long as people live, and the text states that warfare originated thus.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 12703-12707
  quote_or_summary: A man lives with his wife and sister; the wife wishes intercourse
    with the sister-in-law and elopes with her while the husband is hunting.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 12707-12713
  quote_or_summary: The husband searches the camp, concludes the women have been killed,
    grieves, and later in midwinter cries while hunting and thinking they perished
    from cold.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: lines 12713-12718
  quote_or_summary: He ascends a hill, hears a noise, and walks toward it without
    gun or knife because, thinking his wife and sister dead, he also wishes to die.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: lines 12718-12724
  quote_or_summary: Near sunset he reaches the place, sees and recognizes his sister,
    sees smoke among bushes, hears a child by the fireplace, hears the women, sees
    his wife playing with the infant, and sees his sister nursing it.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: lines 12724-12727
  quote_or_summary: He asks which of the two seduced the other, and his sister says
    the wife persuaded her to elope.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: lines 12727-12730
  quote_or_summary: The infant continually cries, looks like a football, and has no
    bones because a woman had begotten it.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:19
  type: summary
  locator: lines 12730-12738
  quote_or_summary: The man kills the child, orders the women home, sends his sister
    ahead near camp, kills his wife with a knife, and severs her limbs; the sister
    asks a man to save the wife, but he arrives too late.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:20
  type: summary
  locator: lines 12738-12740
  quote_or_summary: The man does not kill his sister, and although the slain woman
    has many relatives, none avenges her death.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:21
  type: note
  locator: footnote 1 near line 12740
  quote_or_summary: Lowie notes that the equivalence of gambling and fighting is also
    the closing sentiment of a Blackfoot myth cited to Wissler and Duvall, p. 133.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized note.
- id: ev:22
  type: note
  locator: footnote 2 near line 12741
  quote_or_summary: 'Lowie adds a comparison for the ''Lesbian Love'' tale: Jones,
    p. 151, identified as Fox.'
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized note.
