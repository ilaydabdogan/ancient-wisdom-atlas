canonical_text:
  quote: ''
  summary: The passage includes the close of one Assiniboine narrative in which a
    chief's son retaliates against his older brother, a young man reports receiving
    a new dance from prairie-dogs in an underground lodge, the Big Dog dance society
    is established, and Crow states that gambling should cease while scalping and
    warfare should continue. It then begins a separate narrative in which a man’s
    wife elopes with his sister, the two women have an infant, and the man kills the
    infant and his wife but spares his sister.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During a buffalo chase, the chief’s son knocks down his older brother and
    tells the people not to help him, saying the brother had thrown him away and he
    will now throw him away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the hunt, people return with meat, dry it for several days, dance, and
    later pitch camp again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A young man tells the chief’s son that he is going to make a new dance and
    first explains how he obtained it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The young man reports hearing a man and a woman singing beyond a hill and
    then seeing a male and female prairie-dog coming along.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The male prairie-dog says he is coming to show people a new dance and leads
    the young man into a big hole containing a lodge with a smoke-hole.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Inside the underground lodge, ropes are stretched across and feathered dance
    ornaments hang from them.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Young men enter the prairie-dog lodge, sing several songs, put on ornaments,
    and dance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The prairie-dog tells the young man to go home and get up the dance, and many
    young men are then taught the songs of the new dance.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The young men are told to bring guns and arrows, each is assigned to kill
    a particular bird or animal, and they bring back hawks, crows, owls, gophers,
    prairie-dogs, badgers, and buffalo-hoofs.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Animal skins are dried, tanned, cut into strips, and hung on ropes for the
    dance.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: After the performance, the dancers take off their apparel and give it away;
    the master of ceremonies calls the performance the Big Dog dance, and many people
    join the society.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Crow tells the chief’s son that they must not gamble any more but must scalp
    as long as people live; the passage states that warfare originated in this way.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: In the following narrative, a woman wishes to have intercourse with her sister-in-law
    and elopes with her while her husband is hunting.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The husband searches for the two women, concludes that they have been killed,
    grieves, and later goes hunting in midwinter while still thinking of them.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: The husband ascends a hill, hears a noise, and approaches without weapons
    because he wishes to die if his wife and sister are dead.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: Near sunset he sees his sister, smoke among bushes, a child by a fireplace,
    and his wife playing with the infant while his sister nurses it.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: The husband asks which woman seduced the other, and the sister answers that
    his wife persuaded her to elope.
  category: speech
  evidence_refs:
  - ev:17
- id: obs:18
  text: The infant is described as continually crying, looking like a football, and
