candidate_motifs:
- id: motif:1
  label: Animal beings reveal a ceremonial dance to a human
  taxonomy_refs:
  - initiation
  basis: The young man is led by speaking prairie-dogs into their lodge, observes
    songs, ornaments, and dancing, and is instructed to establish the dance among
    people.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:11
  confidence: medium
  cautions: The taxonomy reference to initiation is approximate; the passage describes
    instruction and establishment of a society, but does not explicitly use initiation
    terminology.
- id: motif:2
  label: Underground animal lodge as source of ritual knowledge
  taxonomy_refs:
  - wisdom
  basis: The new dance and its songs and ornaments are learned in a lodge inside a
    big hole from prairie-dog figures.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage frames the episode as origin of a dance, not as a general
    wisdom quest.
- id: motif:3
  label: Origin of a dance society
  taxonomy_refs:
  - sacred_exchange
  basis: After receiving the dance, young men learn songs, prepare animal-skin ornaments,
    perform, give away apparel, and many people join the society.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: The taxonomy reference is cautious because exchange is present in the
    apparel giveaway, while the main passage emphasis is institutional origin.
- id: motif:4
  label: Origin of warfare through substitution of scalping for gambling
  taxonomy_refs: []
  basis: Crow says they must not gamble any more but must scalp as long as people
    live, followed by the statement that warfare originated.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: No supplied taxonomy family directly names warfare origin.
- id: motif:5
  label: Punitive killing after same-sex elopement and abnormal birth
  taxonomy_refs: []
  basis: The wife elopes with the sister, an abnormal boneless infant is found, and
    the husband kills the infant and wife while sparing his sister.
  evidence_refs:
  - ev:13
  - ev:17
  - ev:18
  - ev:19
  confidence: high
  cautions: The label follows the passage’s sequence without endorsing its moral framing.
- id: motif:6
  label: Abnormal child from prohibited union
  taxonomy_refs: []
  basis: The infant is described as boneless and football-like because a woman had
    begotten it.
  evidence_refs:
  - ev:18
  confidence: medium
  cautions: The passage gives an etiological explanation for the child’s form, but
    no broader taxonomy reference is supplied.
comparison_claims:
- id: claim:1
  claim: The passage’s note explicitly compares the equivalence of gambling and fighting
    in this narrative with the closing sentiment of a Blackfoot myth.
  claim_level: same_function
  target: Blackfoot myth noted by Lowie via Wissler and Duvall, p. 133
  evidence_refs:
  - ev:21
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides only a footnote-level comparison and does not
    quote or summarize the Blackfoot myth itself.
- id: claim:2
  claim: The passage’s note directs comparison of the 'Lesbian Love' narrative with
    a Fox text in Jones, p. 151.
  claim_level: same_motif
  target: Fox narrative cited as Jones, p. 151
  evidence_refs:
  - ev:22
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supplies only a bibliographic cross-reference and no details
    of the Fox parallel.
