canonical_text:
  quote: ''
  summary: The passage contains the end of one tale in which an abandoned son-in-law
    or boy, his wife, and an old foster-grandmother are freed by a dog, after which
    the boy uses a sweat-lodge to transform rags into garments and himself into a
    handsome hunter who can become a moose. It then gives a tale of a rejected poor
    orphan, later named Sore-Belly, who becomes a successful hunter and food-provider;
    after people violate his taboo against stepping over meat, the moose leave, he
    retrieves them once, but after a second violation he goes after them and does
    not return, having turned into a moose. Footnotes mention Cree and Kootenay parallels
    or recording contexts.
  language: English
  quote_policy: summarized
