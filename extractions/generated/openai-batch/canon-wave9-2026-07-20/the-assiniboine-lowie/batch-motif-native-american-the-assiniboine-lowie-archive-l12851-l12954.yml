canonical_text:
  quote: ''
  summary: 'The passage contains several short Assiniboine narratives: a sexual transgressor
    is captured, punished, mocked, and later retaliates; Big-Frog kills kin, is opposed
    by Buffalo, feigns death, and loses his family and friends; a badger traps a youth
    who tries to pull it from its hole; a bear kills one of two hunters at a buffalo-meat
    camp; and a lone man captures a woman and two horses by frightening their riders.'
  language: English with occasional Latin phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man with many wives has one wife sexually assaulted at night by a young
    intruder; the woman holds the intruder and the household seizes him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband orders a humiliating punishment; the intruder’s genitalia and
    arms are tied, and he is released.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The punished young man stays on a hill for several days, becomes an object
    of laughter, receives the name Big-Laugh-Maker, and is eventually relieved by
    his brother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Later, the punished young man and his friends sexually assault the same woman
    and declare themselves even with her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Big-Frog is described as a crazy old man who plays tricks; he hides his two
    sons at a road-parting and kills his son-in-law.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Big-Frog kills his brother-in-law despite his sister’s plea; the sister asks
    others to kill Big-Frog.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Buffalo confronts Big-Frog, shoots arrows that kill Big-Frog’s sons, and suspects
    Big-Frog is only pretending to be dead after two boys test the supposed corpse.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Big-Frog runs away; his wife approaches Buffalo with an axe while pretending
    affection, but Buffalo is not deceived and kills her; Big-Frog’s friends are slain.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A badger making a hole cannot be pulled out by two comrades; it catches one
    youth’s hand and holds him all night until the next sunset.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Two hunters camp near a killed buffalo, prepare pemmican, hear something eating
    outside, discover a bear, flee, and one man is killed by the bear.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A lone traveler tracks people from an old camp-site, frightens a woman’s horse
    and captures the woman and horse, then frightens a second horse carrying her husband
    and returns home with the woman and two horses.
  category: sequence
  evidence_refs:
  - ev:8
