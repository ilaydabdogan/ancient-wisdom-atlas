canonical_text:
  quote: ''
  summary: A male youth or protagonist thinks about a comrade, encounters or goes
    with a girl at a white man's house, and later escapes being detained by her. He
    takes an iron dog, commands it to search, and the dog tracks or scents a trail.
    The protagonist encounters two elk near trees, builds a fire, follows through
    brush, and settles at a fireplace for the night. An old woman appears and warms
    herself at the fire. The youth addresses her as grandmother, feigns sleep while
    watching, and ignores her repeated warnings about fire-sparks. The old woman unties
    a medicine bag, applies medicine to a stick point, and reaches toward him; he
    suddenly seizes her wrist. While held, she asks to be saved and gives information
    concerning his friend and a dog.
  language: English with Assiniboine terms and interlinear glosses
  quote_policy: summarized
