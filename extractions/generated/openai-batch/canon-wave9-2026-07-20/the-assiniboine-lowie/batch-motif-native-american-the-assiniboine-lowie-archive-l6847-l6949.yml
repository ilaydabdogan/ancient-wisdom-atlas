canonical_text:
  quote: ''
  summary: 'A sequence of Assiniboine myth episodes describes Inktu''mni or Sitcon''ski
    in comic and punitive situations: missing eggs lead to punishment of personified
    buttocks and accidental self-eating; Sitcon''ski approaches sleeping animals,
    is seized by a lynx, and encounters fighting mice and a weasel; he twice encounters
    mice dancing inside a buffalo skull and becomes trapped; he imitates eye-throwing
    games performed by birds and boys, with loss or threatened loss of eyes. Editorial
    footnotes compare some episodes to other Indigenous traditions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The buttocks awaken Inktu'mni and report that someone has come; Inktu'mni
    discovers that eggs have been broken or eaten and that all the eggs are gone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inktu'mni builds a large fire, straddles it to punish his buttocks, burns
    them to grease, walks in a circle, mistakes his own track for another's, and eats
    the burnt buttocks before recognizing them as his own.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sitcon'ski touches a sleeping female marten and tells her he thought she was
    dead; later he smells his hand and comments on its odor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sitcon'ski approaches a sleeping lynx for sexual gratification; the lynx wakes,
    seizes him, and releases him after he begs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sitcon'ski sees a weasel and mice fighting; a mouse asks him to tell them
    to stop, and the fighters agree to stop if given berries.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sitcon'ski follows dancing and drumming, finds mice dancing inside a buffalo
    skull, asks to enter, is refused, puts his head in, falls asleep, and wakes unable
    to remove his head.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In one buffalo-skull version, Sitcon'ski cannot see, walks with the skull
    on his head, falls into a river, stays there two days, and finally removes the
    skull.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In another buffalo-skull version, the mice chew Sitcon'ski's hair, leave him
    stuck in the skull, and he breaks the skull against rocks near a gully, discovering
    that he is bald.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Birds play by removing their eyes, throwing them onto a tree, and making them
    return; Sitcon'ski imitates them despite warning, loses his eyes, and makes new
    eyes from pitch.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Inkton'mi sees four boys playing around a pine by throwing their eyes up into
    the tree and receiving them back into their sockets.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The boys allow Inkton'mi to join their eye game and instruct him to throw
    up his right eye while watching its descent; the visible portion reports that
    his right eye returns to its socket and that he next throws the left eye.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Editorial footnotes in the supplied passage direct comparison of the buffalo-skull
    episode and the eye-game episode to several other traditions and sources.
  category: other
  evidence_refs:
  - ev:9
  - ev:10
