canonical_text:
  quote: ''
  summary: Lowie compares police or constabulary functions among Plains and neighboring
    tribal organizations. He describes punitive powers exercised by warrior or age-related
    bodies, especially in camp, during travel, and during buffalo hunts. He argues
    that such police functions often belong to mature-men or warrior groups and do
    not necessarily indicate a progressive ceremonial age-society system.
  language: English
  quote_policy: summarized
literal_observations:
