  text: The passage says that the Braves punished young men who did unspecified acts,
    if caught, by damaging blankets, taking property, and sometimes whipping them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Arapaho, the biitahanwu dancers or Bitahi'nena are described as
    a constabulary performing police duty in camp, during travel, and on hunts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Arapaho Bitahi'nena enforced chiefs' orders and could punish violations
    by killing dogs, destroying tipis, or, in extreme cases, shooting ponies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On hunting expeditions, the Arapaho Bitahi'nena kept the party together and
    prevented anyone from killing buffalo before ceremonies were performed and the
    chief gave the order.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: For the Village tribes, the author states that it is doubtful whether the
    police body coincided with one of the ceremonial age-groups.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Arikara Black-Mouths are said to appear, from Clark's fuller statement,
