canonical_text:
  quote: ''
  summary: Inkton'mi and animal helpers travel east to the end of the snow. After
    a bird scout confirms that good weather is kept in an east-facing lodge, Inkton'mi
    sends Fox to steal the bag containing summer. The bag is relayed among animal
    helpers and finally carried away by the fast-flying Tcedan' bird. Inkton'mi deceives
    the owner and later opens the bag, causing snow to disappear and leaves to sprout;
    when he ties it again, snow returns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A party led by Inkton'mi travels east for many months and reaches the end
    of the snow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inkton'mi plants a long pole, places the fast-flying Tcedan' bird on top,
    and arranges several animal helpers on summer-ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Inkton'mi instructs the owl-like Kata'pknadada to inspect an east-facing lodge
    through the smoke-hole and see whether good weather is tied up inside.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The lodge owner sees the scout bird, burns its nose with a firebrand, and
    orders a servant to build a fire outside and keep watch.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The scout reports that the good weather is in the lodge and that its owner
    is seated under it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Inkton'mi tells Fox to steal the bag containing summer while Inkton'mi distracts
    or blocks the servant's view.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Inkton'mi closes the servant's mouth with glue, chokes him, and throws him
    into the fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Fox snatches the bag and is pursued by the owner; Inkton'mi uses a trailing
    fox-skin breechclout to confuse the owner about the thief's whereabouts.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The bag is passed from Fox to Wolf, Red-Fox, Coyote, Jack-Rabbit, and finally
    to Tcedan', who flies away with the heat.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The animal helpers disappear underground, a place where the owner has no power.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: Inkton'mi sprinkles water on his face and pretends to be perspiring from efforts
    made on the owner's behalf.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: When Inkton'mi opens the bag, snow disappears, bare ground is revealed, and
    leaves sprout on the trees; when he ties the bag again, snow covers the ground.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
