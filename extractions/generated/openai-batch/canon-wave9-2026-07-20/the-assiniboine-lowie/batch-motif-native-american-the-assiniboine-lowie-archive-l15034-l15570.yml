canonical_text:
  quote: ''
  summary: The passage contains interlinear Stoney/Assiniboine myth text and English
    glosses. It includes a buffalo-hunt episode involving a blind starving man, his
    wife, a water bird, and restored sight; a longer episode in which a woman associated
    with a moose and snakes is decapitated, her head pursues children, and the children
    ascend and become the seven stars of the Dipper; and the opening of another text
    about parents and seven youths on earth considering what they should become.
  language: English with Stoney/Assiniboine terms and interlinear glosses
