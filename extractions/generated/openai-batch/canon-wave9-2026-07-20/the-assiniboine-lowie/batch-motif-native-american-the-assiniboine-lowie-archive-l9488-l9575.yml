canonical_text:
  quote: ''
  summary: 'The passage concludes an episode in which an animate dung-man courts a
    girl, melts in warm wind, and is exposed as dung. It then begins the tale ''The
    Giants'': seven young men hunt; several disappear near a hill; a fourth is drawn
    by a shining spear-trap, captured by a giant, and escapes by tricking the giant.
    The youth substitutes a log and rotten wood for himself, blinds the giant with
    mud, stabs him with the spear, and the giant later returns to his lodge with the
    spear stuck in his head.'
  language: English
  quote_policy: summarized
