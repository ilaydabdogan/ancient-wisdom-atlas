canonical_text:
  quote: ''
  summary: A young man seeking his former wife confronts a chief and four guardians
    in a center lodge. He defeats them in contests involving boiling water, an iron
    post, and a red-hot pit, then kills the chief and guardians, burns their bodies,
    and becomes chief. He leads his people home across two seas by making temporary
    land from sprinkled dirt, gives gifts to earlier elders, and then visits his wolf
    helper's underground home. The wolf says he helped recover the wife and guided
    the hero, but now withdraws the power he had given.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man goes to a center lodge and finds the chief, his former wife, and four
    guardians there.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief states that if the man beats his guardians he may have his wife
    and kill the chief; otherwise the chief will kill him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A large bucket responds to the chief's command by going to the creek, fetching
    water, setting itself on the fire, and boiling the water.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: One guardian enters the boiling water and emerges unhurt; the young man then
    stays longer in the boiling bucket, asks for a bigger fire, and escapes when the
    caldron bursts and he disappears underground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a shooting contest, a guardian breaks off part of an iron post with a gun,
    while the young man breaks the post in two with a blunt arrow that returns without
    touching the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In a heated-pit ordeal, two helpers stand among red-hot rocks and iron; the
    hero enters the pit and repeatedly escapes underground, appearing at a distance
    and later in the chief's lodge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the guardians are defeated, the young man kills the four helpers and
    the chief with arrows, has the corpses burned, and becomes chief of the tribe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The new chief says anyone may make a slave of his former wife, gives instructions
    to the half-breed Crees about remaining with their animals, and takes his people
    home.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: At two seas, the new chief ties on mink-skins, sprinkles dirt while walking
    on the water, and the dirt becomes temporary land for the people to cross before
    disappearing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The people give robes to an old man and an old woman, and the chief tells
    them what has happened during his adventures.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The wolf announces that he will leave the hero and no longer accompany him
    underground; the hero thanks the wolf and asks to visit the wolf's home.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Below a big rock is an underground hall where the wolf's ten sons and old
    wolf parents are found; the hero gives flannel and bells to the wolves.
  category: setting
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The wolf says he helped the hero recover his wife and guided him, then says
    he takes away the power he had given; the chief accepts this and returns above
    ground to camp.
  category: speech
  evidence_refs:
  - ev:10
