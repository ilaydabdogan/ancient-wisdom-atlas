canonical_text:
  quote: ''
  summary: 'The passage contains connected Assiniboine trickster episodes: Hkto/Inktu''mni
    resists drinking water after a warning, is seized by Turtle at a reed-covered
    water-hole, uses heat and fire to force Turtle to release him and promise not
    to bite people; later Inktu''mni is outwitted by Fox in a race for cooked geese
    and fails to burn him; a following episode begins with Inktu''mni telling his
    buttocks to guard cooked eggs, which an unnamed man eats while silencing the watcher.'
  language: English
  quote_policy: summarized
