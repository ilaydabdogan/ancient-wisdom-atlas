canonical_text:
  quote: ''
  summary: 'A sequence of Sitcon''ski episodes: Beaver retaliates after Sitcon''ski
    steals and eats a young beaver; an animate rock pursues and pins Sitcon''ski until
    Thunder splits it; Sitcon''ski breaks a marriage prohibition, the girl disappears,
    and he later enters a buffalo-related episode ending in his death in a pound;
    young wolverenes steal his beaver-skin coat and he later burns one wolverene''s
    hair; a final bear-by-river episode begins but is cut off in this passage.'
  language: English with one Latin sentence
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In spring, Beaver makes a hole in the ice and comes out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: While Beaver is away for willows, Sitcon'ski steals the young beaver, runs
    away, roasts it, and eats it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Beaver finds Sitcon'ski by water, repeatedly prevents him from drinking, catches
    his lips, and bites his face.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sitcon'ski asks a large rock between two big trees to move and declares that
    whichever of them gets up first shall be killed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After several days Sitcon'ski leaves; the rock pursues him over a hill and
    across a river, finds his tracks, splits a tree he climbs, and pins him down.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sitcon'ski cries to Thunder that the rock wants to kill Thunder too, and Thunder
    splits the rock into pieces.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A father permits Sitcon'ski to marry a pretty girl on the condition that he
    not embrace her for four nights.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Sitcon'ski disobeys the marriage condition; the girl disappears and his genitals
    become stuck to ice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The father-in-law tells Sitcon'ski to go away because he has disobeyed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: Sitcon'ski follows woman's tracks, meets a buffalo-cow, pursues her to her
    camp, and the buffalo chief orders her to stay with him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Indians make a buffalo pound, catch buffalo and Sitcon'ski, release him once,
    and kill him the next time he is caught with the animals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Sitcon'ski finds two young wolverenes in his tent and calls them thieves.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The wolverenes steal Sitcon'ski's beaver-skin coat; he tries to mislead them
    with reversed snowshoe points and later becomes trapped among roots while trying
    to recover the coat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: After winter suffering and renewed pursuit in spring, Sitcon'ski finds the
    wolverenes' lodge, seizes one wolverene, and burns off its hair in the fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: A note reports another Stoney version in which Sitcon'ski promises a rock
