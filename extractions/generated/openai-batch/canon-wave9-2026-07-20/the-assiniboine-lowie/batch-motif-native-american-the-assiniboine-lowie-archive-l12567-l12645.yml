canonical_text:
  quote: ''
  summary: A lost son is received and adopted by a childless chief, then asks the
    chief's band to accompany him back to the place where he had been beaten in a
    game. At a rock near the gambling site he meets Crow, who carries the boy's scalp
    on a pole, and they smoke pipes. The boy seeks a rider for a horse-race, offering
    food, women, horses, and other rewards; all refuse until a poor orphan living
    with his grandmother accepts the pipe. During the race the orphan blows a whistle,
    becomes a hawk, clears the dangerous bank, and wins. The boy recovers his scalp,
    scalps Crow, takes Crow's property, strips Crow's people, rewards the orphan and
    redistributes property, then spares Crow with horses and game. The victor rejects
    an older brother's offered horse because the brother had previously thrown him
    down.
  language: English
  quote_policy: summarized
