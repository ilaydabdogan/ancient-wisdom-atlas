canonical_text:
  quote: ''
  summary: 'A set of Assiniboine myth abstracts: a magical orphan rescues his kidnapped
    sister; abandoned children survive a cannibal witch and later gain aid through
    magic and a dog; two brothers are separated and one becomes wolf-like while the
    other uses animal transformations and disguises; Iema'' undertakes an underground
    rescue and returns by eagle after betrayal; and two Potiphar-labeled variants
    involve wrongful sexual or domestic accusation, abandonment or attempted killing,
    and escape or revenge.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An orphan boy uses magic to obtain game, build a lodge, pursue kidnappers
    on a magic steed, kill them, and rescue his sister.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In “The Deserted Children,” children are abandoned after a wrongful accusation
    connected with beads and excrement.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A cannibal witch kills nearly all the abandoned children, but a girl is spared
    after warning from her little brother and an offer to perform menial duties.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A skull counsels the girl and answers the witch in her place while the girl
    flees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Swans allow the children to cross a stream over their necks, but raise their
    heads when the abusive witch attempts the same crossing, causing her to drown.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the children return, only a kind old woman houses them; they are tied
    to a tree and abandoned again, but the old woman’s dog liberates them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The boy secures game by magic, transforms himself by sweating into a well-sized
    youth, builds a fine lodge, and kills a big bear and a giant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In “The Two Brothers,” an old paddler decoys the older brother into a canoe
    and takes him away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The kidnapped youth marries the younger daughter of his abductor, kills his
    father-in-law’s manitou helpers, and then kills the old man.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The hero finds his younger brother living with wolves and half wolf himself;
    the hero transforms into a moose and catches him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the wolf-brother disappears, an eagle reports that dog-fish are playing
    with the wolf-brother’s skin.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The hero kills dog-fish, intercepts and flays a toad physician, puts on the
    toad’s skin, and kills wounded patients while posing as the physician.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In “The Underground Journey,” a woman abducted by a bear gives birth to Iema',
    flees with the child, and returns to camp.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Iema' revives Wood-Twister and Timber-Hauler after an ogre kills them, and
    later kills the ogre himself.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Iema' descends in a box to rescue a chief’s daughters from a subterranean
    captor, kills guardians, sends the girls up with tokens, is betrayed by his companions,
    ascends on an eagle’s back, proves his identity, and marries the daughters.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: A fragmentary version of the underground-journey abstract is explicitly identified
    as a version of the preceding account.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:17
  text: Under the heading “POTIPHAR,” a young man wrongfully accused by his father’s
    second wife is abandoned on an island, puts on a gull’s skin, flies across a lake,
    returns, and kills his father with heat after pulling down sunbeams.
  category: sequence
  evidence_refs:
  - ev:12
  - ev:14
- id: obs:18
  text: Teze'xnin is wrongly accused by his older brother’s wife after she unsuccessfully
    attempts to seduce him; the older brother cuts down a tree Teze'xnin has climbed
    so that he falls into the water, but he escapes and becomes strong.
  category: sequence
  evidence_refs:
  - ev:13
  - ev:14
