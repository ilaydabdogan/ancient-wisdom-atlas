canonical_text:
  quote: ''
  summary: The passage contains editorial comparison notes followed by part of a tale
    about Icma', Plenty-of-Hair. Icma' is born with abundant body hair, escapes a
    bear's cave with his mother, leaves home after killing playmates, travels with
    Wood-Twister and Timber-Hauler, revives companions attacked by a lodge monster,
    kills the monster, descends to an underground country to recover three stolen
    daughters, defeats their guardians, receives tokens, and is betrayed when Wood-Twister
    cuts the rope during the ascent.
  language: English
  quote_policy: summarized
