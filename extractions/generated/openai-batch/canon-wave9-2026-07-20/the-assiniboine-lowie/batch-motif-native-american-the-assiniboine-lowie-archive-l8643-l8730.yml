  limitations: The note gives citations only; it does not describe the compared episode
    details in the supplied passage.
- id: claim:2
  claim: The editor labels a tale as European and points to Greek/Albanian, Shoshone,
    and Omaha comparative references.
  claim_level: same_motif
  target: J. G. von Hahn Greek and Albanian Märchen; Lowie Shoshone; J. O. Dorsey
