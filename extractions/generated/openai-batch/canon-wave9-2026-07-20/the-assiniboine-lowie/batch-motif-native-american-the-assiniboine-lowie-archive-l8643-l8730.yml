candidate_motifs:
- id: motif:1
  label: Unusual strong child escapes animal captor's cave
  taxonomy_refs:
  - miraculous_child
  basis: Icma' is born with abundant body hair, is named for it, lifts the large stone
    blocking the cave, and carries his exhausted mother during the escape from the
    bear.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage states that the child was begotten by the woman's first husband,
    so the birth itself is not explicitly miraculous.
- id: motif:2
  label: Departure after dangerous strength harms others
  taxonomy_refs:
  - departure
  basis: After killing other boys with single blows, Icma' says he does not want to
    kill more boys and leaves to travel.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The departure is practical and self-motivated; the passage does not frame
    it as a formal exile or ritual initiation.
- id: motif:3
  label: Restoration of dead or dying companions
  taxonomy_refs:
  - resurrection
  basis: Icma' restores Timber-Hauler after he is killed and restores Wood-Twister
    after he is found dying.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The method of restoration is not described in the passage.
- id: motif:4
  label: Turn-taking lodge monster test
  taxonomy_refs: []
  basis: The companions take turns staying at the lodge; the monster overcomes the
    first two, while Icma' stays home on the third day and kills it.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: No external taxonomy reference is supplied for this local pattern.
- id: motif:5
  label: Hero descent to underground country
  taxonomy_refs:
  - hero_descent
  basis: Icma' is lowered in a box through a hole in the ground and reaches an underground
    country where the stolen girls are held.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The excerpt ends before Icma's successful return from below is shown.
- id: motif:6
  label: Stolen daughters promised as wives to rescuer
  taxonomy_refs:
  - stolen_beloved
  basis: The chief's three daughters are stolen by a subterranean being, and the chief
    promises all three in marriage to whoever brings them back.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The women are stolen daughters rather than pre-existing beloveds of the
    hero.
- id: motif:7
  label: Triple guarded rescue
  taxonomy_refs: []
  basis: 'Each of the three girls is guarded by a distinct opponent: a mountain-lion,
