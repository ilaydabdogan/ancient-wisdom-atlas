canonical_text:
  quote: "“Whatever you say, happens.”"
  summary: An orphan boy’s spoken wishes and predictions are followed by the appearance
    of lodges, horses, and by the abduction and rescue of his sister. He summons a
    speaking horse, kills the abductors, restores provisions, arranges his sister’s
    marriage, and is later received near a chief’s lodge with gifts and a marriage
    offer. The passage then begins another tale in which a young man produces beads
    while defecating and accuses girls who picked them up of dangerous magic, proposing
    that they be abandoned.
  language: English
  quote_policy: quoted
