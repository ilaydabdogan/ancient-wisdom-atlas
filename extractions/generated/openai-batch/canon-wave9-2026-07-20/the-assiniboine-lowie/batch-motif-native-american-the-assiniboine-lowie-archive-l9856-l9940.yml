canonical_text:
  quote: ''
  summary: The passage first recounts a man who reaches Thunder’s mountain house,
    is hidden by a young bird, is discovered by old Thunder, and is thrown from the
    eyrie with the young bird; the mother-bird retrieves her son. A note compares
    this item with Gros Ventre and Omaha materials. The passage then begins the tale
    of two sisters who wish to marry stars, are separated from their moving camp,
    are taken to the sky by star-men, disobey a prohibition against digging near trees,
    see the earth below, ask Spider for help returning, are stranded in a cottonwood
    by opening their eyes too soon, and are rescued by a wolverene who demands marriage
    and whose existing wives warn them to flee.
  language: English
  quote_policy: summarized
