canonical_text:
  quote: ''
  summary: The passage gives several variants concerning an uncared-for poor or ugly
    boy, named Sore-Belly or Teze'xnin in some versions. He produces food, punishes
    thieves, receives or is linked to the chief's daughter, is recognized through
    an infant paternity test, and becomes handsome through sweating or a sweat-lodge.
    Another version begins with an old woman whose moose-skin scrapings turn into
    a rapidly growing boy. Editorial notes compare these incidents with a Teton Poor
    Boy tale, a Chipewyan Crow-Head incident, and a wider deformed-transformed motif.
  language: English with a short Latin passage in version (c)
  quote_policy: summarized
