canonical_text:
  quote: ''
  summary: The passage contains a brief account of a child born with two faces who
    dies from shame, an account of the Stoneys' first meeting with the Cree after
    two neglected boys are fed by birds and adopted by a Cree party, and two accounts
    of first meetings with White people involving Inktu'mni's voyage and trade for
    cloth, and a Stoney hunter's fearful encounter with a White man, a handshake,
    and a gun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman gives birth to a child with one face in front and another behind;
    the rear face does not speak.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: People stare at the child; the child is ashamed and dies without being sick.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nearly all the Stoneys become sick; the sick are placed in one lodge, most
    die, the dead are left unburied, and the camp is abandoned.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the abandonment, an old couple and two boys unrelated to them remain
    at the camp.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old man kills beavers with help from the boys, but the old woman gives
    the boys little or no food, so they nearly starve.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boys travel, the older boy has a knife, and they kill birds for food while
    returning periodically to the old couple.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At a big lake, birds are heard laughing and singing; their chief says the
    poor boys should be given food, and one bird falls at the boys' feet to be eaten.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A white goose later hears the boys and supplies them with food in the same
    way as the earlier bird.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boys hear shooting, find horse tracks and buffalo meat, follow the tracks,
    and meet a Cree party making a buffalo-pen.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Cree adopt the boys; when the old couple tracks them and asks for them,
    the Cree refuse because the old couple had not fed them well.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The account states that this is how the Stoneys first met the Cree.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Inktu'mni travels with many Indians, reaches the Saskatchewan River, kills
    five large moose-bucks, skins them, and makes a boat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Inktu'mni descends the river, passes falls, reaches the sea, ties five canoes
    together, travels eight days, and reaches an island.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: On the island Inktu'mni meets the first White people seen by the Indians,
    trades with them, returns, and after this the Indians have cloth garments instead
    of only buckskin garments.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: A Stoney hunter walking eastward meets a White man with a gun; he is frightened
    by the man's beard and runs away, but the White man calls him back and shakes
    hands with him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The White man gives the Stoney a gun and powder, brings him to three other
    White men, and tries to teach him to shoot; the report of the gun repeatedly terrifies
    the Stoney and makes him run away.
  category: action
  evidence_refs:
  - ev:10
