canonical_text:
  quote: ''
  summary: A deserted girl and her brother set up a lodge. The boy repeatedly predicts
    food and shelter that appear by morning, grows rapidly after praying in a sweat-lodge,
    then makes arrows and defeats a dangerous bear and a giant. Later starving people
    come to the siblings; the girl feeds a thin brother and a good old woman with
    her dog, refuses others, and strikes her begging father with hard dry meat. The
    passage then begins the next tale, titled “The Two Brothers,” with an opening
    reference to two orphan brothers traveling together.
