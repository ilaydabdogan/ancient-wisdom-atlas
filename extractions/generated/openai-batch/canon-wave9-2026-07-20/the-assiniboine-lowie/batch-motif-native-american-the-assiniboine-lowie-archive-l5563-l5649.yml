canonical_text:
  quote: ''
  summary: 'The passage first notes an Omaha coyote-dance in which men imitate coyote
    actions while carrying rattles, bows, and quivers. It then presents Keating’s
    account of the Dakota Nanpashe''n''e or No-Flight society: a closed war association
    formed by founders, entered through a restricted lodge, marked by dress preparation,
    songs, dances, strict fasting, smoking the war pipe, lifelong obligation, a pledge
    not to retreat, dangerous action in war, suspension after a member’s death, and
    eventual disappearance when all members have died.'
  language: English
  quote_policy: summarized
