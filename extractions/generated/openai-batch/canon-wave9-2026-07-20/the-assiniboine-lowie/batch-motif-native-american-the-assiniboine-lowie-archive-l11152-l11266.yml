canonical_text:
  quote: ''
  summary: The passage concludes a Snake and Bear-wife episode in which a Bear father-in-law
    explains the Snake's origin after a world-burning, directs a winter stay, and
    gives bear-related taboos. It then gives two Beaver-Man variants involving dreams,
    lake or underwater beaver houses, marriage with beaver-women, and human return
    or loss. A following Buffalo-Wife episode begins with a man seeking eagle feathers,
    being carried to a mountain by Big-Eagle, receiving feathers, and using them in
    encounters with buffalo before a buffalo cow takes him as husband.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman asks the Snake to go see her father; the Snake agrees, though he sleeps
    little because he fears his wife's magical powers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father-in-law appears as a large bear and tells the Snake that when everything
    was burnt up the Snake lived alone in the water, then came out and was named lomesese,
    Snake.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old Bear directs the Snake and his wife to spend the winter in the next
    coulee, gives rules about finding houses and robes, and says the winter will seem
    like one night.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the winter the Snake and his wife stay close together; the Snake becomes
    more like a bear every morning; in spring his wife announces from outside the
    cave that it is time to go out, and they join many bears.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before the Snake and his wife return to their former camp, the old Bear warns
    them not to eat bear flesh or drink bear blood and says a bear should be killed
    gently if a bear-skin is wanted; the pair later wake in their old lodge.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Beaver-Man variant (a), a dreaming young man warns his father not to walk
    near a lake; the father forgets, meets a beaver-woman who wants to marry him,
    undresses, and follows her to her house below.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Beaver-Man variant (a), people dream about what has happened; the young
    man helps his father get out, while another man with dreams enters the beaver-woman's
    lake house and never returns.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Beaver-Man variant (b), a man hears beavers laughing like women and wants
    to marry them; the old beaver requires that he be given beaver-grease to paint
    his body so he can stay in the water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Beaver-Man variant (b), the man lives with the beavers for a year, has
    a child by one of his wives, and lives in a strong house in the water; later the
    people kill all the beavers except the beaver-man and one female.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Buffalo-Wife episode, a man seeking eagle-feathers plucks the wings
    of young eagles and kills an attacking old eagle; Big-Eagle then carries him to
    a mountain-top, leaves him hungry for ten days, returns with feathers, and gives
    instructions about buffalo encounters.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The man places eagle feathers in the heads of dangerous buffalo bulls as instructed;
    a buffalo cow later appears after he speaks about eating kidneys and buffalo feet,
    and she takes him to camp as her husband.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A note to The Beaver-Man says the tale was found by Mr. Skinner among the
    Cree.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: A note to The Piqued Buffalo-Wife cites versions or parallels among Blackfoot,
    Arapaho, Cheyenne, Crow, Arikara, and Pawnee sources.
  category: other
  evidence_refs:
  - ev:8
