canonical_text:
  quote: ''
  summary: 'A sequence of Assiniboine trickster episodes: Sitcon''ski/Inktu''mni uses
    transformation and forbidden food to kill Eagle; asks geese to carry him and is
    dropped into a mud-hole; is trapped by an animate rock and freed by birds after
    a false promise; traps and kills Bear in a sweat-lodge; is again caught by a rock
    while animals eat the bear meat and is freed by birds after another false promise;
    and begins an episode in which Fisher, in a tree, is mistaken for his reflection
    in clear water.'
  language: English
  quote_policy: summarized
