canonical_text:
  quote: ''
  summary: A chief's married daughter disappears with a stranger after saying she
    would go north. Her husband goes north to find her, gains a wolf helper, receives
    aid and objects from supernatural grandparents, crosses expanses of water by means
    of mink-skins and mud, and reaches a camp where his wife dwells under a powerful
    wakan master who wins people in games and is protected by four wakan servants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A large Indian camp is introduced; its chief has a married daughter whose
    husband returns home and finds her gone.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband asks his father-in-law and repeatedly questions people; on the
    fourth inquiry a visitor reports that a stranger had stayed with him and disappeared,
    leading them to conclude that the stranger eloped with the chief's daughter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife had previously told her husband during quarrels that she would leave
    him, go north, and never return.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The husband packs his belongings, sets out northward, kills a buffalo, and
    is approached by a big wolf who offers to accompany him and help find the wife
    if fed and cared for.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wolf scouts ahead from a high hill and reports that several bad places
    lie on the route; the man says his holy grandmothers, described as female manitous,
    may help him through them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: In a little lodge, an old grandmother says the wife was taken through two
    days earlier and gives the man dried mink-skins to put on his feet for crossing
    a large body of water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At another little lodge, the man's grandfather gives him a bow and arrows,
    and the wolf gives him a bunch of his hair.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the water, the wolf crosses by digging under it, while the man ties mink-skins
    to his feet and slides over the water; mud dropped from the man's bag becomes
    an island where he sleeps before reaching shore.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A second expanse of water is crossed in the same manner.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The wolf says the camp where the wife dwells lies beyond a big hill; he warns
    that her present master is very wakan and wins people who are staked in games
    against him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The man enters the camp at night and goes to the smallest lodge while the
    wolf says he will remain underground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: An old woman says the chief has four wakan servants who know if anyone enters
    his lodge and that the man will be tested the next day; if he loses, he becomes
    a slave, and if he wins, he wins half the people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The young man says he will kill the chief and his guardians, or beat him at
    a wakan performance.
  category: speech
  evidence_refs:
  - ev:5
