canonical_text:
  quote: ''
  summary: The passage contains the end of one mythic episode and the beginning of
    another. In the first, Wise-One rejects proposed forms or places such as earth,
    trees, rocks, water, night, and day because they are mortal, break apart, dry
    up, or pass away. He identifies the space above the blue sky as imperishable and
    living, and a smallest one carries the group upward one by one on a spider web.
    The ascent ends with an arrangement of three on each side and one in the middle;
    the web is broken halfway up, thrown down, and given to Spider. In the next episode,
    two youths are comrades. One goes visiting, marries at a white man's house, hunts
    ducks, pursues elk into brush at night, becomes lost, makes a fire at a fireplace,
    and encounters an old woman who calls him grandson, warns him, and touches him
    with medicine and a stick. Afterward, things are said to be different, and a youth
    and girl speak about the absent or transformed comrade.
  language: English translation with Assiniboine interlinear text
  quote_policy: summarized
