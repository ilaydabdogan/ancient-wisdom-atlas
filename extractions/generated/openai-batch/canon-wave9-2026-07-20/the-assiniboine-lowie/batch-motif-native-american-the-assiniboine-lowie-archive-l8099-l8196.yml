  quote: ''
  summary: The passage contains the end of a tale about a poor boy who obtains animals
    and meat by wishing and supplies people with buffalo, followed by the beginning
    of 'The Orphan Brother and Sister,' in which an orphan boy uses medicine to hunt
    beavers, cures injuries he caused, protects his sister from abductors by using
    a shell and arrows, and later kills a singing bear.
  language: English
  quote_policy: summarized
