canonical_text:
  quote: ''
  summary: Two fleeing sisters encounter a crying infant that becomes a wolverene
    attacker, whom they kill. They then seek their mother, are diverted by Diver in
    a canoe to a river camp, and the younger sister is transformed after looking at
    a forbidden animal dance. The sisters flee using ants and bees as decoys, but
    Diver pursues and kills them. Diver deceives the people with false grief and a
    staged suicide, hides in a lake, and escapes when a shell-fish that has drunk
    up the lake water is broken by a bird.
  language: English with brief Latin and Indigenous terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two girls flee for four nights, hear a sound, and find a clean, fat, crying
    baby lying on its back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The older girl passes the baby by and warns the younger girl, but the younger
    girl takes the infant; the child moves its feet and opens her dress.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The baby suddenly becomes a wolverene, throws the younger woman down, and
    is ultimately killed after both girls struggle with him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The girls go to look for their mother, reach a river, and ask canoe-men to
    ferry them across.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man in a boat with a tail lets the girls leap in, but follows the other
    canoes instead of taking them to the opposite bank.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At a camp near the river bank, people say Old Diver has brought two women,
    while Diver points behind him and denies that the name is his.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Diver orders the women not to look at the night dance; the younger girl follows
    to see it and becomes a diver. The dancers are ducks and geese.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The transformed younger woman returns to her sister, urges flight, and the
    sisters place bees and ants under blankets in their own places before running
    away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Diver returns from the dance, lies under the blankets, is bitten by ants and
    bees, and becomes angry.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Diver pursues the fugitives and kills both women with bow and arrows while
    they are lying on their bellies to drink water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Diver tells the people he could not find the women, but the people later detect
    the corpses.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Diver feigns grief by a lake, and the narrative explains that this is why
    divers make mournful sounds today.
  category: other
  evidence_refs:
  - ev:5
- id: obs:13
  text: Diver fills animal guts with blood and pierces them with an arrow at a distance
    so the people think he is killing himself; he then plunges into the water and
    emerges unseen elsewhere.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Diver is later heard saying that he killed his wives himself, and the people
    decide in council to kill him.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:15
  text: Because Diver hides in a large lake, the people ask Tosna', a shell-fish,
    to drink up the lake water; Tosna' swells to the size of a hill and exposes Diver
    when little water remains.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Before Diver can be killed with stones, a bird breaks Tosna's shell, the water
    returns to the lake, and Diver escapes.
  category: sequence
  evidence_refs:
  - ev:6
