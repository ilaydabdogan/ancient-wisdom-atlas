canonical_text:
  quote: ''
  summary: Inktomi uses a bag to alter snow and bare ground, ascends with it, and
    gives it to Otee'giyeya'bi, who makes summer and summons animals and birds to
    discuss weather. Inktomi judges debates about winter, summer, human lifespan,
    mortality, and the souls of the dead. Frog proposes six months of winter and six
    months of summer; after being struck and helped, his proposal is accepted, Frost
    is sent north, and animals receive fat for warmth. A separate etiological note
    describes Inktomi leaving body impressions in rocks near Old-Man River. Another
    narrative describes men and women first meeting near Porcupine Hill and Old-Man
    River, discovering cohabitation, and a chieftainess selecting Siteon'ski, who
    refuses her.
  language: English
  quote_policy: summarized
