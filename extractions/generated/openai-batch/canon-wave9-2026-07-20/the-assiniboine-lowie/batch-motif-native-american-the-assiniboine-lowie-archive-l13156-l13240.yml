canonical_text:
  quote: ''
  summary: Two related Assiniboine narrative variants describe a winter lack of arrow
    feathers, a journey to an uncle or brother’s camp to obtain feathers, a warning
    against taking a woman, the abduction of a woman despite warnings, pursuit or
    magical retaliation, the deaths of the visiting men, and a surviving relative
    who returns with news. In the first variant, the survivor later joins an attack
    of revenge, mistakenly saves the enemy instead of his own father, tortures the
    enemy, and kills himself in grief. In the second variant, a fast adopted boy escapes
    unharmed, reports the deaths, and brings back the feathers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the first variant, people were winter camping and lacked feathers for their
    arrows.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old man sent his three sons and son-in-law to get feathers from his brother
    in another camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the way, the travelers found feathers where geese had been killed and encountered
    a crane’s head that made a noise when struck.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The youngest man interpreted the crane’s head as warning that they could get
    feathers at the camp but must not touch a lame girl or they would be killed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: One man abducted the lame woman despite a warning from his brother-in-law,
    and the group was pursued by their hosts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pursuing hosts caught the group on a frozen lake and killed the oldest
    and second brothers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The youth associated with the crane dream could not be pierced by a spear,
    but asked to die after his brothers were dead; his little fingers were cut, killing
    him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The son-in-law was the only one to return home and eventually reported that
    his brothers-in-law had been killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The bereaved old man sent the son-in-law to other bands with tobacco, and
    people came to his camp.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The enemy old man camped near the lake watched in all directions except toward
    the lake, so canoe-borne attackers approached unobserved.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The son-in-law tried to spare his father by arranging for him to hide in a
    dog-house, but in the dark he warned the enemy old man instead.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The attackers killed their enemies; the son-in-law killed more than anyone
    else, but his own father was also killed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The hidden enemy old man was pulled from the dog-house and cut apart limb
    by limb at the son-in-law’s instruction.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The son-in-law mourned his father’s death and killed himself with his knife.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: In the second variant, a man with six sons and an adopted boy sent the sons
    to get feathers from his younger brother, who lived with another tribe.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: In the second variant, the boys crossed a big lake, obtained feathers from
    their uncle, and one visitor wanted to steal the youngest wife of a powerful man.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The visitor seized the youngest wife while she carried her husband’s headdress;
    the other wives kept the headdress and told their husband.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: The powerful old man called on his spirits, and his magic caused the boys
    to become stuck in the middle of the lake.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: The boys asked the fastest among them, who wore a jack-rabbit tail, to run
    home for help while they were using up their arrows.
  category: action
  evidence_refs:
  - ev:11
- id: obs:20
  text: The fast runner was shot at but not hurt, ran for two days, reached his father’s
    camp, and eventually reported his brothers’ deaths and the cause.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:21
  text: The fast runner also brought back the feathers.
  category: object
  evidence_refs:
  - ev:11
