candidate_motifs:
- id: motif:1
  label: Quest for needed arrow feathers
  taxonomy_refs:
  - departure
  basis: Both variants begin with a shortage of arrow feathers and a journey to a
    kinsman’s camp or tribe to obtain them.
  evidence_refs:
  - ev:1
  - ev:9
  confidence: medium
  cautions: The available taxonomy has no specific feather-procurement motif; the
    departure tag is general.
- id: motif:2
  label: Warning ignored before abducting a woman
  taxonomy_refs:
  - stolen_beloved
  basis: In the first variant, a crane-head warning and a brother-in-law’s warning
    forbid touching a lame woman, yet she is abducted; in the second, other boys warn
    a visitor before he seizes a powerful man’s wife.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:10
  confidence: high
  cautions: The passage presents abduction or seizure, not a mutual romantic elopement.
- id: motif:3
  label: Animal-related omen or warning
  taxonomy_refs: []
  basis: The youngest man hears or interprets a warning from a crane’s head that makes
    a noise when struck.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage does not explain the nature of the crane’s speech or power
    beyond the warning.
- id: motif:4
  label: Supernatural or magical retaliation after transgression
  taxonomy_refs: []
  basis: The second variant explicitly says a man with mysterious power calls on spirits
    and uses magic to trap the boys in the lake after his wife is seized.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The first variant’s retaliation is pursuit and killing; only the second
    explicitly names spirits and magic.
- id: motif:5
  label: Sole survivor returns with death news
  taxonomy_refs:
  - return
  basis: The son-in-law in the first variant and the fast runner in the second return
    alone or as the survivor and report the deaths of the others.
  evidence_refs:
  - ev:5
  - ev:11
  confidence: high
  cautions: The return is primarily tragic reportage rather than a completed heroic
    return.
- id: motif:6
  label: Revenge attack by summoned allies
  taxonomy_refs: []
  basis: After the son-in-law reports the killings, the old man sends tobacco to other
    bands, who come and attack the enemy camp.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: This motif is present only in the first variant within the supplied passage.
- id: motif:7
  label: Mistaken warning saves the enemy instead of kin
  taxonomy_refs: []
  basis: The son-in-law intends to warn his father to hide during the attack but,
    in darkness, warns the enemy old man instead.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: No taxonomy reference is available for this specific mistaken-identity
    episode.
- id: motif:8
  label: Grief-driven self-killing after kin death
  taxonomy_refs:
  - sacrifice
  basis: After his father is killed, the son-in-law mourns and kills himself with
    his knife.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The text depicts self-killing in grief; labeling it as sacrifice is tentative
    because no ritual or offering frame is stated.
- id: motif:9
  label: Fast runner escapes unharmed to carry news
  taxonomy_refs: []
  basis: The fastest boy, wearing a jack-rabbit tail, is shot at without injury, runs
    for two days, and reports the deaths.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage does not explicitly say whether the jack-rabbit tail causes
    the speed or invulnerability.
