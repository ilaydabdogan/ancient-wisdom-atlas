canonical_text:
  quote: ''
  summary: The passage contains the close of a Wolverene-and-wolves episode in which
    wolves teach Wolverene a fire-making jump, steal his flint, and mock him; the
    tale “Skunk,” where a formerly giant Skunk who killed people is disabled, killed,
    burned, and becomes the source of present small skunks; and the beginning and
    main action of “The Blind Dupe,” where a blind hunter deserted by his wife is
    cured by diving three times in a lake on the advice of a mno'za, then finds and
    kills his wife, later remarries, dies in war, and his second wife and child are
    captured and then spared by Stoneys.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The wolves make fire by piling up wood and jumping across it, and they teach
    Wolverene the method while warning him not to play too much.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wolverene repeats the fire-making trick as he travels, falls through thin
    ice on a river, becomes cold, and then cannot make fire by jumping.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wolverene looks for flint and cannot find any because the wolves have stolen
    it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wolves deny seeing Wolverene's flint, cover him with their tails, break
    wind, deny doing so, and tell him he can look elsewhere for fire if he dislikes
    being there.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wolverene is angry but remains with the wolves all winter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Long ago Skunk was larger than a horse, could kill anyone, had killed many
    people, and survivors were fleeing from him.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: An old marten unable to run fast enough pretends to be dead when Skunk approaches;
    Skunk tests the body and concludes the marten died that day.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Skunk meets Wolverene near a beaver-dam, they quarrel over smoking, and Skunk
    is about to kill Wolverene with his filth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Wolverene goes close to Skunk and closes Skunk's anus so he cannot void filth;
    Fox sees this and reports to the other people that Skunk cannot defecate.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Lynx tells the others to take Skunk into the timber, climbs a tree, seizes
    Skunk with his legs while the others hold him, and bites through Skunk's neck,
    killing him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The people burn Skunk in a large fire; present-day small skunks develop from
    small spots on his corpse, explaining why skunks are now small.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A man living with his wife and child is the best hunter, then suddenly becomes
    blind, and teaches his wife to shoot.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The wife shoots a buffalo, pretends she has caught no game, and leaves her
