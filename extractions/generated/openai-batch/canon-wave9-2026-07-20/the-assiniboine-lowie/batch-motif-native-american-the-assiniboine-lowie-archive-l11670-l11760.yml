candidate_motifs:
- id: motif:1
  label: learned fire-making trick repeated after warning
  taxonomy_refs: []
  basis: Wolverene is taught a fire-making jump with a warning not to play too much,
    repeats it several times, and then suffers exposure after falling through ice.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents the actions directly but does not state a moral lesson.
- id: motif:2
  label: theft of a fire-making implement
  taxonomy_refs:
  - sacred_theft
  basis: Wolverene cannot find his flint after falling into the river; the text states
    that the wolves had stolen it, and they keep access to fire while denying the
    theft.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The object is a flint connected with making fire, but the passage does
    not call it sacred or frame it as a cosmic theft.
- id: motif:3
  label: animal host's false shelter and humiliation
  taxonomy_refs: []
  basis: The wolves invite Wolverene to sit under their covering, cover him with their
    tails, break wind, deny it, and tell him to seek fire elsewhere if he dislikes
    it.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is a local comic or humiliating episode; broader classification is
    not explicit in the passage.
- id: motif:4
  label: giant dangerous animal reduced to present species form
  taxonomy_refs: []
  basis: Skunk is once larger than a horse and deadly; after being killed and burned,
    small spots on his corpse become the small skunks of today.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: No available taxonomy reference precisely names etiological animal-size
    reduction.
- id: motif:5
  label: defeating a monster by blocking its bodily weapon
  taxonomy_refs: []
  basis: Skunk's lethal power is his filth; Wolverene prevents him from voiding it,
    enabling the others and Lynx to kill him.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The bodily mechanism is literal in the passage; any broader symbolic reading
    would require external evidence.
- id: motif:6
  label: restoration of sight through three dives in a lake
  taxonomy_refs: []
  basis: The mno'za instructs the blind man to dive three times in the lake, and after
    the third plunge he regains full sight.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not explicitly call the water sacred or medicinal.
- id: motif:7
  label: abandoned disabled spouse aided by animal helper
  taxonomy_refs: []
  basis: A blind man abandoned by his wife is approached by a mno'za, receives information
    and healing instructions, and later finds the wife who left him.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The figure is given as mno'za with a parenthetical uncertainty “gull?”;
