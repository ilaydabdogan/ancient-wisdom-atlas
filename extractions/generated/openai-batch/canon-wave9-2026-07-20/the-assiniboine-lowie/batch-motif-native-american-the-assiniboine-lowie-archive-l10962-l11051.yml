  confidence: high
  cautions: The opening paragraph is a summarized variant rather than a full tale
    in this passage.
- id: motif:2
  label: Human transformation into buffalo by animal gift
  taxonomy_refs:
  - shapeshifter
  basis: The boy can transform into a buffalo by putting on a buffalo scalp and rolling
    on the ground.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The transformation method is reported only for the second Stoney version
    summarized here.
- id: motif:3
  label: Medicine object gives travel direction
  taxonomy_refs: []
  basis: The medicine pipe turns at night to show the direction for the boy's next
    day's journey.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No broader ritual context is provided in the passage.
- id: motif:4
  label: Wounded animal repays human aid with guidance
  taxonomy_refs: []
  basis: After the woman removes a stick from the bear's paw, the bear warns her about
    a dangerous camp and directs her toward friends.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives a single compact version of the episode.
- id: motif:5
  label: Refuge in animal cave
  taxonomy_refs: []
  basis: The fleeing woman hides and sleeps in an old bear-cave before encountering
    the bear.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The cave functions as a setting; further symbolic meaning is not stated.
- id: motif:6
  label: Bear cub nursed with human child
  taxonomy_refs: []
  basis: A woman nurses a bear cub together with her own baby, and the two children
    wrestle.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No explicit transformation or ritual status is stated for the foster relationship.
- id: motif:7
  label: Bear abducts woman and fathers a cub
  taxonomy_refs: []
  basis: The young Bear seizes a berry-gathering woman, lives with her in a cave,
    and she bears a cub.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage frames the union as seizure and cohabitation, not as a voluntary
    marriage.
- id: motif:8
  label: Animal-human offspring avenges slain animal parent
  taxonomy_refs: []
  basis: The bear-child kills boys and is described as trying to avenge his father's
