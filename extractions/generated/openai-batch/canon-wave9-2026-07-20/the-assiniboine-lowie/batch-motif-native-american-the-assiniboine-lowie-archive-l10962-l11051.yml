canonical_text:
  quote: ''
  summary: The passage includes a summarized Stoney buffalo-boy variant, the tale
    of a woman aided by a bear after removing a stick from its paw, a tale of a bear
    cub raised with a human child who later seizes a woman and fathers a cub, and
    the beginning of a bear-wife tale in which a chief's son embraces a sleeping she-bear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A baby boy strapped to a travois is lost, raised by a buffalo, and later recaptured
    by Indians.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The buffalo-raised boy wears a buffalo robe with a horn headdress, eats grass
    for a long time, and says he prefers buffalo life.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In another Stoney version, buffalo give the boy a buffalo scalp and a medicine
    pipe.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The medicine pipe turns at night to indicate the direction of the boy's next
    day's journey.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: By putting on the buffalo scalp and rolling on the ground, the boy can transform
    into a buffalo and flee enemies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: After returning to his parents, the boy eats grass at night, becomes chief
    of the buffalo-pen, and his descendants inherit the office.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:7
  text: A maltreated wife flees from her husband and sleeps in an empty old bear-cave
    near a creek and brush.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: A bear enters the cave, shows the woman a paw pierced by a stick, and the
    woman pulls the stick out with her teeth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: At daylight the bear tells the woman to hide from a camp of bad people and
    to continue to a later camp where she will find friends.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The woman follows the bear's directions and encounters two horsemen, one of
    whom is her brother.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: A woman dreams that she has a young bear, asks her husband to bring her a
    cub, and nurses the cub with her own baby.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The bear cub and the human baby wrestle; after being whipped, the cub runs
    away and lives on berries.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The young bear seizes a berry-gathering woman, keeps her with him, and they
    live through the winter in a cave where they have plenty of food.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The woman bears a cub, later flees with it while the Bear is away, reaches
    her people, and the people kill the Bear.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The bear-child kills several boys while playing and says he is avenging his
    father's death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The bear-child cannot injure a powerful older boy, breaks his own claws, and
    afterwards stops attacking people.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: The bear-child later stays by himself eating berries, meets a big bear, and
    dwells with that bear.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: A chief's son and his companion find a sleeping she-bear near a big rock;
