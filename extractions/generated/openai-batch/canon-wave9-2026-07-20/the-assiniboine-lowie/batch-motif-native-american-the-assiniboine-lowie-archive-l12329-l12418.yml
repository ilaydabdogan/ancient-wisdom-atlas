canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which a woman is bound and watched,
    swims away, becomes a bear, returns with bear and beaver features, and dies; her
    husband cuts up her corpse. It then gives the tale “The Reformed Adulteress,”
    in which a crow tells a husband where his missing wife is, helps him recover her
    by disguise, watches her afterward, warns about the rival, and advises confinement
    in a tree. The husband later subjects the wife to another ordeal with a rock until
    she promises to behave, after which the couple live happily and the crow leaves.
  language: English
  quote_policy: summarized
