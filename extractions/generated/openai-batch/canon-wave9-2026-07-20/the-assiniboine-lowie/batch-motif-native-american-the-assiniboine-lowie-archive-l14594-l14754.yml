  quote: ''
  summary: This passage gives brief abstracts of multiple Assiniboine/Stoney myths,
    including a boy’s gambling contest with Crow, sexual and marital transgression
    tales, animal and monstrous attacks, anomalous births, personified body parts,
    theft and rivalry episodes, starvation survivors adopted by Cree, and first meetings
    with Whites.
  language: English with some Latin phrases
  quote_policy: summarized
