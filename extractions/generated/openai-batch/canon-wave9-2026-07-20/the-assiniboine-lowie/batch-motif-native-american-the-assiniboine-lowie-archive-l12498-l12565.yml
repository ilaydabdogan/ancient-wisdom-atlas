canonical_text:
  quote: ''
  summary: A young man travels on the prairie and repeatedly encounters a man named
    Crow at buffalo kills; each has shot the same animal, and they cook and exchange
    portions. Crow later proposes a game after an exchange of pipes. Near a rock they
    play with a netted wheel or hoop and darts, wagering clothing and finally scalps.
    Crow wins the final game, scalps the boy, covers him with a buffalo robe, and
    agrees to meet again after eight days. The boy returns home and goes to another
    chief sitting before a fire.
  language: English
  quote_policy: summarized
