  quote_or_summary: The old father tells his son to make a bow and arrows using ie'mbin
    feathers; the man wagers a race with his former wife, all buffalo come to the
    Indian camp, and he ties an ie'mbin head to his own before racing around a lake.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:2
  type: summary
  locator: lines 12243-12254
  quote_or_summary: During the race the buffalo-woman defecates to make the man slip;
    he shoots above her, flies as a bird, defecates on her back, wins, and buffalo
    are killed. A second race with higher stakes is held before sunrise and he wins
    again.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: lines 12254-12269
  quote_or_summary: The buffalo-woman proposes a trial of strength. Her husband knows
    she is vulnerable in the anus and neck, makes one hundred arrows, and kills her
    by shooting arrows at her neck so they pass through to the anus.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 12269-12273
  quote_or_summary: Before death she asks for her feet to be turned toward the mountains;
    instead they are turned toward the plains, which the passage gives as the reason
    buffalo are plentiful on the plains.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 12274-12282
  quote_or_summary: The man burns her body and finds much iron inside. A knife blade
    leaps from the fire; a child takes it despite warning, hides it, and is killed
    by it.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 12282-12288
  quote_or_summary: The man burns the iron again, after which buffalo no longer kill
    people. He finds one piece of bone and restores his wife from it to human form,
    then takes her to his father-in-law.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 12288-12294
  quote_or_summary: The man tells the old man it was hard to recover his wife and
    that he was nearly killed by ashes she put on his neck. The old man permits him
    to do what he likes; the man cuts off her nose and breasts and kills her.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 12296-12308
  quote_or_summary: In “The Abducted Wife,” people camp together; one man steals another
    man’s wife. The couple live by a creek, later in timber, become better supplied,
    and the woman gives birth to a child. Her brother later lives with her.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 12308-12315
  quote_or_summary: While the woman fetches water in the dark, she mistakes the road
    and is caught by something that pulls her beneath the water; her husband and brother
    run up but cannot find her.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 12316-12323
  quote_or_summary: The husband moves to the river with the crying baby and searches
    from a hill. The brother calls his sister by the water; something comes up, walks
    on the waves, and is recognized as the sister. She says she will nurse her boy.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 12323-12327
  quote_or_summary: The woman tells her brother she is human only down to her waist.
    After nursing the baby, she returns to the water, and her brother notices she
    has a beaver-tail.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 12327-end of supplied excerpt
  quote_or_summary: The woman’s father proposes catching the beaver and seizing the
    woman. They dry up the water at the dam, find the beaver-houses, break in the
    door, and find many beavers surrounding the woman; she says the beaver wants her
    for one more year.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/the-assiniboine-lowie.md
