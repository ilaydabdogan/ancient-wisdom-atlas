canonical_text:
  quote: ''
  summary: The passage contains the end of a buffalo-woman narrative, in which a man
    defeats his former buffalo-wife in races and combat, burns her body, handles iron
    found inside it, restores her from bone to human form, and then kills her. It
    then begins a narrative titled “The Abducted Wife,” in which a man steals another
    man’s wife; after she bears a child, she is pulled beneath water, later appears
    partly human and partly beaver, nurses her child, and is found among beavers in
    a beaver-house after her kin drain the water.
  language: English
  quote_policy: summarized
