candidate_motifs:
- id: motif:1
  label: human and animal wife contest
  taxonomy_refs:
  - shapeshifter
  basis: The man’s former wife is a buffalo-woman; he uses bird-associated means to
    fly during races, and she is later restored to human form from bone.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  confidence: medium
  cautions: The passage gives only the ending of the larger buffalo-woman narrative,
    so the origin of her buffalo form is not present here.
- id: motif:2
  label: wagered race with lives at stake
  taxonomy_refs: []
  basis: The man and buffalo-woman race twice, staking buffalo lives against Indian
    lives, and buffalo are slain after his victories.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: No broader taxonomy reference is assigned because the available list has
    no exact race-wager family.
- id: motif:3
  label: vulnerable spot known by spouse
  taxonomy_refs: []
  basis: The husband knows the buffalo-woman is vulnerable only in the anus and neck,
    and he kills her by shooting arrows through those vulnerable places.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explain how he learned this vulnerability.
- id: motif:4
  label: body orientation explains animal distribution
  taxonomy_refs: []
  basis: The buffalo-woman’s feet are turned toward the plains rather than the mountains,
    and the passage states this is why buffalo are plentiful in the plains.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is an etiological pattern, but no exact available taxonomy reference
    is provided.
- id: motif:5
  label: dangerous object taken despite warning
  taxonomy_refs: []
  basis: A child takes the knife blade from the fire despite the man’s warning and
    is killed by it.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This is a warning-disobedience pattern rather than a direct instance of
    the available forbidden-knowledge category.
- id: motif:6
  label: restoration from a remaining bone
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: After the body is burned, the man finds one piece of bone and restores his
    wife to human form from it.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage says she is restored to human form, but the surrounding condition
    of life, death, and transformation is compressed in this excerpt.
- id: motif:7
  label: stolen or abducted wife
  taxonomy_refs:
  - stolen_beloved
  basis: The narrative is titled “The Abducted Wife”; a man first steals another man’s
    wife, and later the woman is pulled beneath the water and found with beavers.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:12
  confidence: high
  cautions: The passage is fragmentary and ends before the outcome of the beaver-house
    episode.
- id: motif:8
  label: woman changed into partly animal water being
  taxonomy_refs:
  - shapeshifter
  basis: After being pulled under the water, the woman appears walking on waves, says
    she is human only to the waist, and is seen with a beaver-tail.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage shows partial animal form but does not explicitly describe
    a voluntary act of shape-shifting.
- id: motif:9
  label: recovery attempt by draining water-being dwelling
