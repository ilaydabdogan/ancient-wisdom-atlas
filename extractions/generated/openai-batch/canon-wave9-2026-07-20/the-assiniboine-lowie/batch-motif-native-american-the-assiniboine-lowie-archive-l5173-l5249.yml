canonical_text:
  quote: ''
  summary: Lowie discusses the comparison of Plains age-societies, religious or mystical
    societies, and related ceremonial associations. He argues against grouping rites
    only by ostensible purpose or admission basis, gives examples involving buffalo-calling
    ceremonies, Cheyenne and Arapaho lance-bearing societies, Hoof-Rattle ritual objects,
    and notes a close connection between Cheyenne and Arapaho Dog organizations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Schurtz is summarized as treating organizations with mystical foundations,
    their own customs and dances, and admission by choice and payment as replacements
    or transition forms beyond age-associations.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lowie states that mystic experiences and the conception of a transferable
    ritual are fundamental features of Plains culture.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lowie states that rites cannot be compared reliably on the basis of ostensible
    significance alone and that formal identity is treated as stronger evidence of
    historical relation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A buffalo ceremony is described as occurring among both Mandan and Pawnee
    for the purpose of calling buffalo.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lowie does not assert a direct historical connection between religious societies
    and age-societies, but says both seem to derive from basic Plains cultural features.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In both the Cheyenne Hoof-Rattle society and the Arapaho biitahanwu, two men
    carry feathered and fur-wrapped lance-crooks while the rank and file carry straight
    lances.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Lowie says a common origin for crooked lances used by various Plains societies
    is extremely probable and Cheyenne-Arapaho borrowing is possible.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hoof-Rattle warriors carry dew-claw rattles and have a grooved elk-horn instrument
    in the form of a snake as an emblem.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: One function of the Hoof-Rattle society is charming large game, and Lowie
    says the dew-claw rattles, snake-form emblem, and game-charming function are lacking
    in the Arapaho biitahanwu.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Cheyenne Dog society is said to present clear indications of close connection
    with the Arapaho Dog lodge.
  category: relationship
  evidence_refs:
  - ev:7
