canonical_text:
  quote: ''
  summary: The passage contains two narrative units. In the first, an orphan boy living
    with his sister snares the sun with a sinew string, causing darkness; after he
    cannot release it because of heat, a small mouse gnaws the sinew and restores
    daylight. In the second, a hostile raid kills a Stoney camp except for a girl
    and her little brother, who hide, leave to seek another band, endure hunger, make
    weapons, and the boy grows rapidly while becoming able to kill game.
  language: English
  quote_policy: summarized
