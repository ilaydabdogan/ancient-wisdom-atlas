    and uses the disguise in a scheme involving the chief's daughter.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage does not explicitly call Sitcon'ski a trickster; the label
    is inferred from repeated deception within the episode.
- id: motif:2
  label: false elopement and humiliating remnant
  taxonomy_refs:
  - trickster_boundary
  basis: The chief's daughter agrees to go with Sitcon'ski, but he vanishes and leaves
    a weasel-skin legging that turns into excrement; the episode ends with her shame.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No broader comparative claim is made beyond the local pattern of deception
    and humiliation.
