canonical_text:
  quote: ''
  summary: 'The passage contains several Assiniboine tale episodes: Sitcon''ski uses
    transformed clothing and disguise to fool a chief''s daughter; a disguised husband
    watches Hktumni fail to steal his wife; Sitcon''ski crosses a muskeg with a stick,
    later cheats a bear while berrying, and is outwitted by a beaver that takes and
    returns his tobacco-pouch; a following Teze''xnin episode begins with an orphaned
    boy and grandmother being expelled, the boy hunting successfully, having meat
    stolen, being given a chief''s daughter in marriage, and piercing a bag of moose
    blood carried by his wife.'
  language: English
  quote_policy: summarized
