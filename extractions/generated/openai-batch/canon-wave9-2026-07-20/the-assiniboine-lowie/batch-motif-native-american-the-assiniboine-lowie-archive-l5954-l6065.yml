  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In another version, the whole earth is flooded with water, animals dive unsuccessfully
    for dirt, and Muskrat comes up dead with dirt in its claws.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Inktonmi takes dirt brought up by Muskrat and makes the earth out of it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
