comparison_claims:
- id: claim:1
  claim: The editor explicitly compares the earth-making from Muskrat's mud/dirt with
    versions in Cree, Blackfoot, Gros Ventre, Arapaho, Crow, Ojibwa, Menomini, and
    Fox sources, and also notes a Henry version involving flood, a twig-canoe, animal
    pairs, and Muskrat diving for earth.
  claim_level: same_motif
  target: earth-diver and flood earth-making episodes in cited Native North American
    traditions
  evidence_refs:
  - ev:1
  - ev:3
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The footnotes list comparanda but provide little narrative detail for
    most cited sources within this passage.
- id: claim:2
  claim: The editor notes that the Muskrat-Beaver tail exchange is also recorded in
    a Cree myth.
  claim_level: same_motif
  target: Cree Muskrat-Beaver tail exchange incident
  evidence_refs:
  - ev:2
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: Only the existence of a similar incident is stated; the Cree narrative
    context is not given here.
