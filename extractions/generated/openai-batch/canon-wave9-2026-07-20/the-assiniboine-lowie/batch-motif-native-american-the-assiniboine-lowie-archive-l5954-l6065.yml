canonical_text:
  quote: ''
  summary: The passage presents Assiniboine myth material in which Sitcon'ski/Inktonmi
    makes earth from mud retrieved by Muskrat after a flood, causes Muskrat and Beaver
    to exchange tails, sets the length of winter after Frog objects, creates humans
    and horses from dirt, instructs the Assiniboine about horse-stealing, and is commissioned
    by sky beings to steal summer weather from an eastern owner.
  language: English
  quote_policy: summarized
