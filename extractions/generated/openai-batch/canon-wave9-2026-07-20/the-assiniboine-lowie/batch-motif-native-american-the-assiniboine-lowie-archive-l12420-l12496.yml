canonical_text:
  quote: ''
  summary: The passage contains the end of one hunting tale, the complete tale “The
    Meeting in a Cave,” and the opening of “The Gambling Contests.” A young son-in-law
    first steals moose meat and is exposed, then later proves he has killed game himself.
    A Blood Indian and a Kootenay meet in a cave, communicate by signs, become comrades,
    and later wager property, scalps, and lives in wrestling until the Kootenay kills
    the Blood. In the next tale, a chief’s younger son is humiliated by his older
    brother during a fox-dance setting and leaves camp after taking moccasins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man lives with his son-in-law, who goes hunting every day but cannot
    get game.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man sees another man skinning a moose, steals the covered meat,
    moves it, and makes a moose-track with one of the legs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man brings the meat home and says he killed it by the spring; the
    old man rejoices and begins roasting the meat while women dress the skin.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The owner of the moose appears with his wives, claims the property, asks only
    for the skin, and allows the old man’s household to keep the meat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young man later returns with game he says he truly killed; the old man
    checks the tracks, believes him, and the young man thereafter becomes a good hunter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A Blood Indian and a Kootenay, both traveling alone, enter the same cave at
    night and remain there until daylight.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Because they do not understand each other’s language, the Blood and the Kootenay
    communicate by signs and learn each other’s tribal identity.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The two travelers spread a blanket, smoke, and agree to stay together as comrades.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Blood and the Kootenay wrestle while wagering property, scalps, and then
    lives; the Kootenay ultimately kills the Blood and returns home across the mountains.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: In a camp circle, a chief has two sons, and the older son cares greatly for
    the fox-dance.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The younger brother takes the older brother’s horse to watch the fox-dance,
    and the older brother pushes him off, saying only he should ride it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Ashamed, the younger brother goes home, takes moccasins made for the older
