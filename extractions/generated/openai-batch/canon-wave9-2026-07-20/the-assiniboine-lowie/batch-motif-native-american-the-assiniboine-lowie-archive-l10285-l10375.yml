  text: In an alternate narrative, a husband notices that his wife dresses and combs
    her hair carefully and wonders for whom she does this.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The husband follows his wife's wood-gathering tracks to a large stump with
    a small round hole, from which a snake emerges; he kills the snake.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The husband collects the snake's blood, makes soup from it, makes his wife
    eat it, and tells her it is her lover's blood.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The wife runs to the stump, sees the snake's corpse, threatens the husband,
    and is beheaded by him when she puts her head through the lodge-door.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: In Bear-Woman variant (a), a woman has daily intercourse with a bear, and
    the people kill the bear.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: The woman asks for bear leg-skin, makes a complete skin from it, covers herself
    with it, and kills all the people except her parents and sister.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: In variant (a), attacks do not injure the bear-woman until her right paw is
    identified as the vulnerable place.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:12
  text: Two brothers return from hunting, learn the vulnerable place from their little
    sister, shoot the right paw, kill the bear-woman, pulverize her dried heart, sprinkle
    it on fireplaces, and the slain people wake again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:13
  text: In Bear-Woman variant (b), girls invite another girl to play; she warns them
    not to play with her anus, then becomes larger and more bear-like as they play.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: The bear-woman in variant (b) kills girls and camp people, but spares her
