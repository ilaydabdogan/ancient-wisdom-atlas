canonical_text:
  quote: ''
  summary: The passage includes a sky-escape episode in which children playing ball
    become the Dipper; an alternate snake-paramour episode ending in the husband's
    revenge; and two Bear-Woman variants in which a woman becomes bear-like, kills
    people, is defeated through a revealed vulnerable spot, and the slain are revived
    by powdered remains sprinkled on fireplaces.
  language: English
  quote_policy: summarized
