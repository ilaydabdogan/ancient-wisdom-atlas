canonical_text:
  quote: ''
  summary: 'A sequence of Assiniboine myth abstracts involving boys, hunters, women,
    and animal-persons: eagles, bears, snake, beavers, buffalo, moose, wolf, antelope,
    hawks, and Frog. The abstracts include animal capture or marriage, caves and underwater
    houses, transformation into animals, animal gifts or instructions, races and trials,
    deaths and revivals, and protective or destructive uses of power.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy who catches eagles is punished by an eagle, placed on a mountain top,
    later taken down, and given feathers with instructions for their use.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy presents the feathers to buffalo, is not harmed by them, is transformed
    into a buffalo, returns home, and eats grass like a buffalo for four days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A straying boy is taken by a grizzly to its cave; in spring, Indians reach
    the cave, shoot the bear, and find the boy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A maltreated woman flees to an empty bear-cave; a returning bear has a stick
    removed from a wound and directs her to her family’s camp in return.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A bear captures a woman; she escapes, her people kill the pursuing bear, and
    her cub later kills several boys before another Indian boy defeats it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In two Bear-Wife variants, a young man embraces a sleeping bear, the bear
    comes to or takes him to a cave, and a child connected with the bear becomes a
    chief or great warrior.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After a conflagration, Snake finds and marries a bear-woman; by magic she
    creates a lodge and brings him to her father.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The old bear instructs Snake not to eat his flesh, while allowing him to kill
    bears and take their skins.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: In one Beaver-Man variant, a young man warns his father not to walk close
    to a lake, but the father is tempted by a beaver and taken below the water surface.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In Beaver-Man variants, beaver-women take a man to their house; marriage with
    beaver-women occurs, and people later kill beavers except for their tribesman.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In Piqued Buffalo-Wife variants, eagle punishment on a mountain and the gift
    of feathers recur before the hero encounters buffalo and gives them feathers.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The hero or Magpie has buffalo and moose wives whose rivalry includes a race;
    Moose causes Buffalo to get stuck in mud, and Buffalo leaves with her calf.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: In two Buffalo-Wife variants, the husband is killed by buffalo and restored
    to life by a brother or helper.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: Magpie makes or turns a lodge into an iron house, and the attacking buffalo
    fail to harm those inside.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:15
  text: In a Jack-Rabbit variant, Jack-Rabbit kills an invulnerable chieftainess,
    impregnates a girl, repeatedly kills a woman who revives, and later lives with
    her.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Jack-Rabbit must identify his son among calves; after choosing wrongly he
    is killed, and the calf resuscitates him by shooting arrows into the air.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Jack-Rabbit uses frost and pulled-down sunbeams against the buffalo chief.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: A man dreams of a she-wolf, marries her, later marries another woman, and
    the wolf kills the other wife.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:19
  text: The wolf gives birth to a boy who becomes a great hunter.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:20
  text: A man hunting antelope finds a beautiful woman who turns into an antelope,
    lures him away, and he is transformed into a male antelope.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:21
  text: Red Hawk and Black Hawk have a trial of skill, and Black Hawk wins.
  category: action
  evidence_refs:
  - ev:14
- id: obs:22
  text: Frog abducts a handsome boy; the boy’s father recaptures him and frightens
    Frog into the water.
  category: sequence
  evidence_refs:
  - ev:15
