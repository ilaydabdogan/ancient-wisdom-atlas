canonical_text:
  quote: ''
  summary: 'The passage contains several Assiniboine animal tales: Frog steals and
    raises a handsome child and flees into water after the child is recovered; Crane
    entrusts her weak young to Otter, Cold kills Otter and abuses the young crane,
    Thunder destroys Cold, and Crane rewards Otter-kind with winter immunity; a man
    kills an elk that carried him across a river and later becomes the bird Wi''skedidi''n
    after Wolf covers him and the meat with a skin; Bald-Headed Eagle and Loon taunt
    each other until Eagle pursues Loon through several lakes, becomes Thunder, and
    kills him with lightning. A fragment of the next tale introduces wolves and a
    wolverene in winter.'
  language: English
  quote_policy: summarized
