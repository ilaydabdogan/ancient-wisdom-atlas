  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stolen boy's father recaptures him; Frog, frightened by the father's anger,
    goes into the water, explaining why frogs now live there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The crane is said to hatch last, leaving the young crane too weak to fly when
    ducks and geese leave for warmer country.
  category: setting
  evidence_refs:
  - ev:2
