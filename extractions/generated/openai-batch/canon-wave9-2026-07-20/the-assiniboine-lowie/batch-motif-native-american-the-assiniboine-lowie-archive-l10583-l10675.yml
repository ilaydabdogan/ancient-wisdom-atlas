canonical_text:
  quote: ''
  summary: The passage contains the end of a witch episode, where dangerous women
    kill visitors with awls and possess harmful medicine, and a man tricks them into
    killing each other. It then gives variants of “The Comrades’ Pranks,” in which
    traveling comrades frighten and injure one another through sharpened legs and
    animal transformations, restore each other, and eventually reconcile; a second
    variant has north-south comrades transforming into bear and buffalo after eating
    animal tongues.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women invite visitors inside and kill people who try to leave by piercing
    them with awls kept at their elbows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man tells the women to sit back to back and not look at him, places a rolled
    blanket where they think he is sitting, and the women stab and kill each other.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The women have bad medicine tied with pointed sticks; touching a person with
    it turns the person into a rotten stick, and the man uses it on the women to prevent
    their recovery.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two boys living together as comrades leave their parents and travel to look
    for people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At a separate night camp, one comrade sees the other sharpening his legs to
    a point and flees in fear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sharpened-Leg pursues his comrade, splits a tree the fugitive has climbed,
    pierces him repeatedly, and then cures him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: On another night the other comrade becomes a large buffalo, pursues Sharpened-Leg,
    knocks down the tree he climbs, and nearly kills him by hooking and ripping his
    body.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sharpened-Leg later turns into a large elk, pursues the buffalo-man, uproots
    a tree, knocks him down repeatedly, nearly kills him, and then makes him well
    again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The other comrade appears as a grizzly or bear, pursues Sharpened-Leg, falls
    from a tree with him, bites off half of his nose, and finally restores him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The comrades argue about stopping the pranks, agree to live together as friends,
    and travel on in peace after the bear-man helps Sharpened-Leg set his feet back
    on.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: In another version, a southern man dreams of a northern man, seeks him out,
    and the two travel together as comrades.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Southerner kills a bear, eats its tongue, changes into a bear, pursues
    his friend, plays with him without biting him, and then becomes human again.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Northerner kills a buffalo, eats its tongue, changes into a buffalo, pursues
    his friend, hooks him so that only his clothes are ripped, and resumes human shape.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: A note says the theme is popular among the Stoneys, that several versions
    were obtained, that the Sharpened-Leg incident appears elsewhere in the volume,
    and that an Arapaho comparison is cited.
  category: other
  evidence_refs:
  - ev:12
