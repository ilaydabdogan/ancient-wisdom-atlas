canonical_text:
  quote: Ten women were living together in a lodge.
  summary: Inkton'mi deceives ten women by pretending to save them from Disease, disguises
    himself, and has intercourse with them. In a second episode he makes songs, distributes
    songs and ceremonial powers to animals and birds, instructs them to appear in
    dreams, and then goes to the sky and orders it kept open while forbidding return.
    In a third episode he rescues a buffalo calf from mire; the calf grows by rolling
    over, helps Inkton'mi transform into a buffalo, and leads him toward a buffalo
    camp where a white cow is stolen and Inkton'mi approaches the painted lodge of
    the buffalo-chief.
  language: English
  quote_policy: quoted
