  cautions: The passage presents the episode literally; broader classification depends
    on comparison beyond the local text.
- id: motif:2
  label: Cleansing and sweat-lodge restoration after contamination
  taxonomy_refs: []
  basis: After the old woman is removed, the youth is washed and doctored in a sweat-lodge,
    restoring him to his former condition.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not elaborate ritual meaning beyond restoration.
- id: motif:3
  label: Ascent to the sky forming the Dipper
  taxonomy_refs:
  - ascent
  basis: A footnoted Stoney variant says the brothers play ball, ascend to the sky,
    and form the Dipper.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This occurs in an editorially summarized variant, not in the main tale
    ending in this passage.
- id: motif:4
  label: Eating snake flesh transforms the eater into a snake
  taxonomy_refs:
  - serpent
  - shapeshifter
  basis: Both Snake-Man variants describe a man eating snake flesh and gradually becoming
    a large snake.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  - ev:11
  confidence: high
  cautions: The variants differ in details of color, setting, and the prior state
    of the snake meat.
- id: motif:5
  label: Ignored warning against dangerous food
  taxonomy_refs: []
  basis: In version (a) the companion tries to dissuade the eater; in version (b)
