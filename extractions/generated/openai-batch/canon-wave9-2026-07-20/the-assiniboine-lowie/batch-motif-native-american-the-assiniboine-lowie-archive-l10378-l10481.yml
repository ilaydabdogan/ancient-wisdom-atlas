candidate_motifs:
- id: motif:1
  label: Adhesive spouse or forced marital burden
  taxonomy_refs: []
  basis: The old woman sticks to the youth's back, cannot be removed by ordinary attempts,
    and declares herself his wife.
  evidence_refs:
