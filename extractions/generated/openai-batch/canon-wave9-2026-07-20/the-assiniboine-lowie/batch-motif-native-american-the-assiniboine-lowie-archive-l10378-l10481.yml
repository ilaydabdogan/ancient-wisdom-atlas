canonical_text:
  quote: ''
  summary: The passage includes the end of a tale in which a rejected girl's grandmother
    attaches herself to a handsome youth as a wife-claimant until two girls remove
    and kill her, cleanse the youth, and marry him. Footnotes give a Stoney variant
    ending with ascent to the sky as the Dipper and state a symbolic association with
    the frog's nuptial embrace. The passage then gives two variants of 'The Snake-Man,'
    in which a man eats burnt snake flesh despite warning or dissuasion, gradually
    turns into a snake, and remains in a river; one variant adds Thunder seeking the
    snake and turtles arising from its skin spots.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A handsome youth refuses marriage with women, including a good-looking girl
    who then complains to her grandmother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The angry grandmother remains behind when camp moves and asks the youth to
    carry her on his back.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: After being carried near camp, the old woman sticks tightly to the youth's
    back, cannot be thrown off, and repeatedly claims to be his wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women attempt and fail to remove the old woman; the youth's father says whoever
    pulls her off may marry his son.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Two good-looking girls pull four times; on the last attempt they remove the
    old woman and kill her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The youth's back is fouled by the woman's urine; the two girls wash him, doctor
    him in a sweat-lodge, restore him, and have him as husband.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A footnoted Stoney variant has a girl make a ball from a robe piece; her brothers
    play ball in a circle, ascend to the sky, and form the Dipper.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A footnote states that this story was said to symbolize the tenacity of the
    frog's nuptial embrace and cites other traditions for comparison.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Snake-Man version (a), two travelers reach a big mountain where a large
    snake lies in their path; they burn the middle of its body to make a passage,
    and one man eats the cooked snake flesh despite his companion's attempt to dissuade
    him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In version (a), the snake-eater gradually changes into a yellow snake and
    finally tells his friend he will stay in the river.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In version (a), Thunder wishes to kill the snake but finds only turtles on
    the bank, said to have developed from the snake's skin spots.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In Snake-Man version (b), two hungry travelers find burnt snake-meat; one
    says old people call it bad, but the other eats it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: In version (b), the eater's body becomes progressively white until he turns
    into a big snake, stays in the river, and his companion reports the event to camp.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: A footnote to 'The Snake-Man' lists comparable versions or references in Mandan,
    Hidatsa, Gros Ventre, Arapaho, Crow, Omaha, and Ankara materials.
  category: relationship
  evidence_refs:
  - ev:12
