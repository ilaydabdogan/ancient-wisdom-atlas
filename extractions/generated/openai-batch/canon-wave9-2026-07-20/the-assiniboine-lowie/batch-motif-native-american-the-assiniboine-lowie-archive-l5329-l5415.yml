canonical_text:
  quote: ''
  summary: The passage analyzes Plains age-societies and argues that they cannot be
    explained simply as age classes. It proposes, cautiously and hypothetically, that
    some graded societies may have developed from ranked warrior organizations with
    youth imitation and collective progression. The author warns against generalized
    evolutionary schemes and distinguishes military features from ceremonial and religious
    functions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that a simple explanation of age-societies as everyday age
    classification applied to ceremonial life is not adequate for the data discussed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reduces several reported society lists to smaller core sets, including
    four well-defined Arapaho and Gros Ventre societies and four societies with police
    functions after exclusions from Maximilian's list.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The remaining societies are said not to correspond to natural age divisions,
    with examples from Piegan and Arapaho organizations that are close in age or both
    composed of middle-aged married men.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author suspects that a principle of gradation other than age may have
    been more important, with age possibly subordinate.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: A hypothetical development is proposed in which four Arapaho warrior organizations,
    compared to Crow and Cheyenne organizations, become differentiated by rank through
    martial distinction.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the same hypothesis, boys imitate elders, form an all-inclusive age-class,
    and pass collectively through graded societies up to the highest.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The author explicitly states that the hypothesis is not asserted as the actual
    historical evolution of any order and cautions against generalized evolutionary
    schemes.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The military character of some societies is said to appear in battle obligations
    and martial insignia borne by dancers.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says that not all age-societies have a military aspect and identifies
    the Arapaho Crazy Dance society as ceremonial and religious rather than a warrior
    association.
  category: relationship
  evidence_refs:
  - ev:9
