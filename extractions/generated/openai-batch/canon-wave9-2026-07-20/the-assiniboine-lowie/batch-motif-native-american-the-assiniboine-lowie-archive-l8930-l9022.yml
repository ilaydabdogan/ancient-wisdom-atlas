canonical_text:
  quote: ''
  summary: A boy meets an animal-led woman identified as Horned-One's wife, gives
    her a scalp, and follows her instructions concerning a skunk whose unbroken bones
    allow it to live again. He returns to camp, reveals himself to grieving parents,
    rescues his abused sister by killing her medicine-man husband, and kills Red-Boat
    during a lethal heat while protecting relatives with water. The passage then begins
    a separate tale in which Sitcon'ski tests a son-in-law by burning moccasins, but
    the youth has exchanged them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two tigers and two bears come over a hill ahead of a woman, who orders the
    animals to stop and spare the boy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy gives a second scalp to the woman; she is identified as Horned-One's
    wife, wears a scalp-robe, and is grateful because the offered scalp fits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman instructs the boy to travel toward the camp, to kill and eat the
    last animal he meets, and not to break its bones.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The last animal is a fat young skunk; the young man kills, skins, roasts,
    and eats it without breaking the bones, wraps the bones in the skin, and the skunk
    gets up alive again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young man reaches a hill near a camp, waits in a coulee until dark, and
    hears his sister crying in the central lodge where the medicine-man lives.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The young man enters his parents' lodge; they do not recognize him, and he
    identifies himself as one who has come back to life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The medicine-man is described as chief, a great medicine man, wakan, abusive
    to the sister, and very hard to kill.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
- id: obs:8
  text: The young man instructs that when the husband beats the sister again, she
    should seize him by the hair and pull him outside the lodge.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the medicine-man is pulled outside, the young man breaks his back with
    a bone weapon; heated rocks are cast into a pit, and the medicine-man dies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before killing Red-Boat, the young man orders his relatives to gather baskets
    of water, set them in their lodge, and remain there.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The next day is so hot that water boils, many people are burnt, and Red-Boat
    burns to death outside his brother's door; Red-Boat's wife is saved and some hidden
    people reappear when it cools.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The young man scratches Red-Boat's wife's back with badger claws and she becomes
    a slave of his parents.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the following tale opening, Sitcon'ski has a beautiful daughter; a young
    man marries her, and she warns him that her father kills young men and has already
    killed three.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: During winter travel, Sitcon'ski and the son-in-law hang wet moccasins over
    a fire; the youth exchanges the pairs while Sitcon'ski sleeps, so Sitcon'ski burns
    his own moccasins while intending to burn the youth's.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
