candidate_motifs:
- id: motif:1
  label: bird-assisted ascent requiring food and self-flesh
  taxonomy_refs:
  - ascent
  - sacrifice
  basis: Icma' is carried above ground by a bird, feeds it stored moose meat, and
    then supplies his own flesh to complete the upward journey.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage states self-cutting to feed the bird; broader ritual or salvific
    meanings should not be inferred without other evidence.
- id: motif:2
  label: returning rescuer proves truth with tokens
  taxonomy_refs:
  - return
  basis: Icma' returns at the attempted marriage, the false friend flees, and the
    handkerchief, tie, and ring identify him as the rescuer.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The tokens are recognition evidence in the story; no taxonomy-specific
    sacred exchange is explicit.
- id: motif:3
  label: descent to an underground inhabited world by rope and pail
  taxonomy_refs:
  - hero_descent
  - ascent
  basis: Stick-Twister and a second man descend through a hole in a pail by rope,
    encounter underground people, and are hauled back up.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage calls the place underground but does not identify it as an
    afterlife realm.
- id: motif:4
  label: restricted water and punishment for water theft
  taxonomy_refs:
  - sacred_theft
  basis: The old woman says water must be bought and that anyone stealing water is
    killed by being thrown to the mountain-lion.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage frames the act as theft of water, but does not explicitly
    call the water sacred.
- id: motif:5
  label: quest for hidden technical knowledge from underground people
  taxonomy_refs:
  - forbidden_knowledge
  basis: The second man descends to learn how guns or iron are made and receives the
    answer that iron is made from stone juice, but flees under threat.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The knowledge is sought and guarded by hostile people, but it is not explicitly
    forbidden.
- id: motif:6
  label: false sexual accusation against a stepson
  taxonomy_refs: []
  basis: The stepmother attributes partridge scratches to an alleged attempted seduction
    by her stepson, causing the father’s anger.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage itself labels the section 'Potiphar,' but the taxonomy list
