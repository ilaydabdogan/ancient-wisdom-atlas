- id: motif:7
  label: abandoned child aided by bird disguise and animal instruction
  taxonomy_refs:
  - shapeshifter
  - initiation
  basis: The boy is abandoned on an island, dons gull skin and feathers, learns to
    fly, and follows the gull’s directions through chasm trials.
  evidence_refs:
