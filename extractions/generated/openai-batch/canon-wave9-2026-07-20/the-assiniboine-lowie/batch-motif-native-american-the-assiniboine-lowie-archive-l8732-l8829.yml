canonical_text:
  quote: ''
  summary: 'The passage contains three adjacent narrative units: Icma'' escapes upward
    with a bird, proves he rescued three girls, and wins them as wives; Stick-Twister
    and another man descend by pail and rope into an underground inhabited world threatened
    by a mountain-lion; and the opening of a Potiphar-type tale in which a stepmother
    falsely accuses a boy, his father abandons him on an island, and a gull teaches
    him to fly and cross dangerous chasms.'
  language: English
  quote_policy: summarized
