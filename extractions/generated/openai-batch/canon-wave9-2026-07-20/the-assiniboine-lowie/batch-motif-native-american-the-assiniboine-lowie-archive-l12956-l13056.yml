candidate_motifs:
- id: motif:1
  label: animal attacker dies from delayed reciprocal wound
  taxonomy_refs: []
  basis: The buffalo kills the old man but later falls dead because the old man's
    shot had struck it after all.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not state a moral or ritual meaning for the white buffalo
    or the delayed death.
- id: motif:2
  label: obscene defilement followed by bodily punishment
  taxonomy_refs:
  - trickster_boundary
  basis: A trapper defecates into others' traps and is castrated and killed; another
    defecates into a fly nest and is bitten in the rump and scrotum before dying.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The boundary-transgression pattern is clear, but no explicit trickster
    figure is named.
- id: motif:3
  label: failed appeal to a helper related to the pursuer
  taxonomy_refs: []
  basis: The fleeing men ask Skunk to kill the pursuing fish, but Skunk is related
    to the fish and kills the men instead.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives the relationship but does not explain its wider significance.
- id: motif:4
  label: sexual rivalry escalates into retaliatory insect attack and mutual killing
  taxonomy_refs:
  - trickster_boundary
  basis: A rival excluded from the lodge throws a fly nest at the lovers' genitals,
    holds the door, and later both rivals kill each other.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The sexual and retaliatory boundary violation is explicit, but the taxonomy
    link is cautious because no trickster is identified.
- id: motif:5
  label: animal combat with survivor avenging herd
  taxonomy_refs: []
  basis: A bear drowns three buffaloes, but the oldest surviving bull kills the bear
    by repeated hooking.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage presents the fight as witnessed action without stated symbolic
    interpretation.
- id: motif:6
  label: personified natural force kills a hunter
  taxonomy_refs: []
  basis: Wa, identified as Snow, wrestles with and kills the missing hunter.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No broader seasonal or cosmological explanation is provided in the passage.
- id: motif:7
  label: personified body parts aid escape after persuasion
  taxonomy_refs: []
  basis: The traveler's feet are angry, but after he speaks to them they run rapidly
    and help him escape pursuers.
  evidence_refs:
