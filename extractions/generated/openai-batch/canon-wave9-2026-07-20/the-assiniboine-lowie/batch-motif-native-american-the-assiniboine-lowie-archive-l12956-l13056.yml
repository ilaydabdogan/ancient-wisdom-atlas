canonical_text:
  quote: ''
  summary: 'The passage contains several short narratives: a white buffalo kills an
    old man and later dies from his shot; four trappers die after trap defilement,
    fly attack, and a fish-and-Skunk episode; two rivals injure lovers with biting
    flies and then kill each other; a bear drowns buffaloes but is killed by an old
    bull; Snow wrestles and kills a hunter; and a traveler escapes pursuers after
    persuading his offended feet to run.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Many Stoneys are away on the plains searching for buffalo, leaving one old
    man at home.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A buffalo signals with a mirror that he intends to kill the old man, runs
    to camp, and is pursued by dogs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man shoots at the buffalo; the buffalo hooks him repeatedly, tears
    his body and heart apart, and later falls dead from the shot.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The buffalo is described as a white buffalo, and the women take the man's
    flesh home and pile it in a heap.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: In 'The Four Trappers,' a fourth trapper, unsuccessful at catching beaver,
    defecates into the others' traps; one trap closes on him, cuts off his testicles,
    and kills him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Another trapper defecates into a nest of 'bull-dog' flies; the flies bite
    his rump and scrotum, his body swells, and he dies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The two remaining trappers encounter a large fish jumping among dead logs
    and splitting them; the fish scents them, roars, and pursues them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The two men ask Skunk to kill the fish, but Skunk is related to the fish,
    kills the men, and the fish eats them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In 'The Rivals,' two young men both desire the same young girl, and one prevents
    the other from entering after he has gone in first.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The excluded rival throws a nest of biting flies at the lovers' genitals and
    holds the door so that the lodge occupants cannot escape.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the fly attack, the two young men raise their guns and kill each other.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In 'The Bear and the Buffalo,' an Indian hunter sees a bear drown three buffaloes
    in a lake.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The oldest surviving bull bellows, shakes mud from his body, makes a drum-like
    noise while walking, and hooks the bear repeatedly until the bear dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: In 'Snow,' a wife dreams that she tracks her missing husband by very small
