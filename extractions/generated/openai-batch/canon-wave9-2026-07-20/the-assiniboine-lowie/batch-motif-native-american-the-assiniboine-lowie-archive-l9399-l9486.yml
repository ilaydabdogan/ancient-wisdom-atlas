canonical_text:
  quote: ''
  summary: The passage contains the end of one tale in which a youth destroys thunder-causing
    sisters, cures his parents, and wakes the dead; a brief note on orphan children
    and the sun-catcher; the tale of a witch who kills one twin and is killed by the
    other, who revives his brother; and the beginning of a tale in which offended
    excrement gathers into a man-like suitor, transforms discarded materials into
    clothing, and enters a camp.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The youth is told that his sisters will appear at noon in a black cloud and
    that they cause thunder.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The youth calls on birds, fashions a rock jutting from the water into an eagle,
    and the stone eagle seizes the sisters after they have gone up a tree and then
    lit on the rock.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy kills the women, burns and pulverizes their flesh, takes his parents
    into a sweat-lodge, and cures their blindness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After hair is gathered from every lodge, the young man calls on the dead to
    get up and build a fire, and all wake up.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young man tells the people they will have no more trouble, then goes away
    to the sea and marries.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A parenthetical note says orphan children nearly starved because they did
    not initially know how to make fire, and that the orphan boy is identified with
    the sun-catcher.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the witch tale, a woman’s dog says she will give birth to two pintos; the
    woman and the dog simultaneously give birth to twins, and the boys and pintos
    grow quickly.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: One twin, while riding his pinto, builds a fire; an old woman appears across
    the fire, later applies medicine to him while he sleeps, and kills him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The second twin finds his brother’s corpse, remains awake when the old woman
    comes, seizes her, kills her with her own poison medicine, and restores his brother
    with another medicine.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the faeces-as-suitor tale, a young woman refuses suitors, eats restricted
    buffalo meat, produces white faeces, then eats tongue and produces black excrement,
    which she insults.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the camp moves in spring, the insulted black excrements speak, summon
    other faeces, gather into a man-sized heap, and follow the people in human guise.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The dung-man picks up small discarded skins, cloth, and paint, enlarges or
    transforms them into clothing and adornment, and comes to look like a handsome
    Indian.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The dung-man tracks the camp, is taken for a visitor from another camp, is
    invited by the girl’s father, and is offered hot animal-blood soup by the old
    chief while the girl listens from a menstrual hut.
  category: sequence
  evidence_refs:
  - ev:12
