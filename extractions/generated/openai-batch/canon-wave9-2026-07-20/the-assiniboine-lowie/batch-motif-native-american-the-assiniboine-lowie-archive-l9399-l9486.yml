  label: revival of the dead after destruction of dangerous women
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: After killing, burning, and pulverizing the women’s flesh, the youth cures
    his parents and calls the dead to wake and build a fire; all wake up.
