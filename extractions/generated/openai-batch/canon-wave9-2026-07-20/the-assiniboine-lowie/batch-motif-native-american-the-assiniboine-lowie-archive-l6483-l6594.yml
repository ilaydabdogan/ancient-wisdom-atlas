canonical_text:
  quote: ''
  summary: 'The passage recounts several Inktu''mni/Sitcon''ski episodes: Fisher tricks
    him with stolen meat and a knife, after which he revives; he mistakes reflected
    berries in river water for real berries; a hen frightens him into a river; he
    uses a ruse involving fish and is then deprived of the fish by Mink; he asks Thunder
    to make a destructive flood, survives by making a wing and ascending a tree, and
    later helps restore dead animals; finally he deceives geese into a shut-eye dance-lodge
    and kills some before the survivors escape.'
  language: English
  quote_policy: summarized
