candidate_motifs:
- id: motif:1
  label: Dream-aided survival or escape
  taxonomy_refs: []
  basis: The one Shuswap who survives Saddle’s father’s battle is said to have escaped
    because of his many dreams.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage states the causal link to dreams but does not describe the
    dreams or how they protect him.
- id: motif:2
  label: Hero’s specific feared substance
  taxonomy_refs: []
  basis: The Shuswap knows Saddle fears dried wood and uses a dried-wood club, causing
    Saddle to flee.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The reason for Saddle’s fear is not explained in the supplied passage.
- id: motif:3
  label: Animated headless body with creatures inside
  taxonomy_refs: []
  basis: After decapitation, the Shuswap’s body stands headless, bleeds heavily, and
    is described as containing snakes and frogs.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explicitly classify this as resurrection or rebirth.
- id: motif:4
  label: Refusal of hospitality before revenge
  taxonomy_refs: []
  basis: The avenging young man refuses offered water and pipe before the chief reveals
    the dead friend’s heads and violence follows.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage gives the actions but does not explain the social or ritual
    significance of refusing water and pipe.
- id: motif:5
  label: Animal transformation used for escape
  taxonomy_refs:
  - shapeshifter
  basis: The pursued young man turns into an antelope and escapes.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: Only one transformation is described, and no broader shapeshifting pattern
    is given in this passage.
- id: motif:6
  label: War-name and place-name etiology
  taxonomy_refs: []
  basis: The passage explains that the Stoneys are called Hopa'maksa because they
    cut enemies’ throats and gives a creek name tied to the killing of Cree there.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is an etymological or place-name explanation embedded in a war narrative,
    not a cosmological origin account.
- id: motif:7
  label: Stranded women survive winter and are restored to kin
  taxonomy_refs: []
  basis: Two Kootenay women stray from their people, survive winter in deprivation,
    and are found and provided with food and clothing in spring.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The episode is narrated plainly and contains little explicit supernatural
    content.
- id: motif:8
  label: Stolen child captive attempts return
  taxonomy_refs: []
  basis: A Kootenay steals a Piegan’s son, holds him for a year, and the youth plans
    to return to his people and starts fleeing at night.
  evidence_refs:
