canonical_text:
  quote: ''
  summary: 'A set of Assiniboine/Stoney war and captivity narratives: Saddle pursues
    and decapitates a long-haired Shuswap whose headless body remains animate and
    contains snakes and frogs; Stoneys fight and defeat Cree attackers; a young man
    avenges a slain comrade and escapes by turning into an antelope; two stranded
    Kootenay women survive winter and are rescued; and a Kootenay captive-holder steals
    a Piegan boy, who begins an escape attempt in the incomplete final episode.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Saddle is identified as a Stoney; his father had killed six Shuswap in battle,
    while one Shuswap escaped because of his many dreams.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Saddle follows his brother and finds that the Shuswap has taken the brother’s
    knives and pushed them into his sides.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Saddle pursues the Shuswap with a knife tied to each hand, but the Shuswap
    uses a dried-wood club because he knows Saddle fears dried wood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a steep mountain, a Stoney slashes the Shuswap repeatedly; Saddle later
    cuts off the Shuswap’s head and long hair and takes the scalp.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: After decapitation, the Shuswap’s headless body stands up, emits much blood,
    and is described as containing many snakes and frogs; the eyes of the severed
    head remain open.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Stoneys and Cree fight over women; seven Cree hide near a Stoney camp, attack
    a lone Stoney, and later wound Jacob Bear’s-Paw.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Cree make an enclosure, but the Stoneys leap in, knife them, and kill
    all the Cree; the passage explains a Stoney name and a creek name from the killing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: One of two comrades travels away and does not return because he has been killed;
    the surviving comrade goes on a war expedition and enters the enemy chief’s lodge.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The chief’s wife offers water and the chief offers a pipe, but the visiting
    young man refuses both before being shown his dead friend’s heads.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The chief offers a knife and says, “Kill me,” then stabs the guest; the guest
    pulls out the blade, kills the chief, kills others, flees, turns into an antelope,
    and escapes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After Kootenay are repulsed by Stoneys, two Kootenay women, one blind, stray
    from their people and survive winter by picking discarded buffalo bones.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In spring the Kootenay find the two women; one has no clothes and uses a coating
    of mud in place of moccasins; both are given food and clothes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A Kootenay steals a Piegan’s son, takes him across the mountains, and keeps
    him for a year; the youth plans to return in summer and begins to flee at night,
    but the supplied passage breaks off mid-episode.
  category: sequence
  evidence_refs:
  - ev:8
