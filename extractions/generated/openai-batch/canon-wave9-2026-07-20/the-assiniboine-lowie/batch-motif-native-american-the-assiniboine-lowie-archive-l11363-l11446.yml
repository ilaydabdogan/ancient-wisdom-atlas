canonical_text:
  quote: ''
  summary: The passage continues a Magpie-and-buffalo episode in which Magpie is restored
    to life from a small hair remnant, marks buffalo hair with fire, and later protects
    his family by transforming a lodge into heavy iron during a buffalo attack. A
    separate Jack-Rabbit episode describes an invulnerable Stoney warrior with a jack-rabbit
    tail and bone knife, his killing of Porcupine, a rabbit-to-man transformation,
    an unusual conception and birth, repeated killing and return of a woman who becomes
    his wife, and a fragmentary buffalo-woman sequence ending in failed recognition
    tests and Jack-Rabbit's death.
  language: English with a short Latin sentence
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A brother hears his nephew crying, learns that Magpie has been trampled to
    pieces, finds a small bit of Magpie's hair, wraps it in a blanket, blows smoke
    at the blanket, says "Wake up," and restores Magpie to life.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Magpie becomes angry at the buffalo, seizes one by the horns, and makes a
    fire that burns the buffalo's hair; the passage explains this as the reason buffalo
    have curly hair.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Buffalo come to attack the lodge where Magpie, the moose, and Magpie's parents
    are staying; everyone is terrified except Magpie, who continues sleeping for a
    time.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Magpie asks for water, washes himself, asks for iron, finds a small piece,
    chews it, and transforms the lodge into heavy iron.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The buffalo run against the iron lodge without destroying it, while Magpie
    sits on the roof and shoots many buffalo; Sitcon'ski joins the buffalo with iron
    horns but says he was only joking when Magpie notices him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Jack-Rabbit is described as a Stoney boy with a beaded jack-rabbit tail in
    his head and a bone knife; both his people and enemies fear him, enemy shots do
    not hurt him, and he cuts off enemies' heads.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: An enemy chieftainess named Porcupine warns Jack-Rabbit not to go near the
    camp, but he follows her and hides in a coulee by the camp.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Jack-Rabbit kills Porcupine; when people look for the killer, they find only
    a rabbit in the hiding place, and after they leave he re-transforms into a man
    and enters the camp.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: An old woman advises Jack-Rabbit to leave or be killed, but he says no one
    can kill him and stays; another man from a great distance becomes his comrade.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A Latin sentence says the comrade tells Jack-Rabbit that a virgin becomes
    pregnant by urinating where a young man has urinated; Jack-Rabbit and the virgin
    do this, and later the girl gives birth to a child.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Jack-Rabbit repeatedly hears the woman speaking to her child, kills her while
    sparing the child, burns her after another killing, and later stops trying to
    kill her and says he will marry her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: When the boy is grown, the woman says Jack-Rabbit's comrade is always angry
    and goes back home across the mountains; Jack-Rabbit follows but cannot overtake
    her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: 'The final parenthetical describes a fragmentary buffalo-woman episode: a
    calf points out a spring, prepares his father for tests, six buffalo dance with
    him, he must identify his son among calves, the son helps by closing one eye and
    lowering one ear, but Jack-Rabbit fails the last test and is killed.'
  category: sequence
  evidence_refs:
  - ev:7
