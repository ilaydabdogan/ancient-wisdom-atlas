canonical_text:
  quote: ''
  summary: The passage contains the end of a Jack-Rabbit and buffalo episode, followed
    by the short narratives “The Wolf-Wife,” “The Antelope-Woman,” and “The Red Hawk
    and the Black Hawk,” and ends at the heading “Frog.” In these stories, Jack-Rabbit
    is revived from hair and takes revenge on buffalo with frost and sun-heat; a she-wolf
    wife kills a rival and bears a partly wolf-like child; an antelope-woman lures
    a hunter who becomes a male antelope; and Black Hawk defeats Red Hawk in a hunting
    contest and teaches starving people to hunt.
  language: English
  quote_policy: summarized
