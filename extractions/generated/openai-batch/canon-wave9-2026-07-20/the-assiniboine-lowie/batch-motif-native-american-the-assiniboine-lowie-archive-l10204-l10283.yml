canonical_text:
  quote: "“The blue sky above is never dead, it is always in existence.”"
  summary: 'The passage first recounts seven youths who debate changing into various
    perishable forms before choosing to become shining beings in the enduring sky
    and being raised there by a spider-web. It then begins the tale titled “The Dipper”:
    a wife has intercourse with a snake, the husband kills the snakes and feeds her
    their blood, then beheads her; her rolling head pursues their seven children,
    who flee with magically produced obstacles and cross a river on cranes’ necks.'
  language: English
  quote_policy: quoted
