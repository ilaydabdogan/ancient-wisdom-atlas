canonical_text:
  quote: Then the youth, his dog, his gun, and all his other property were transformed
    into trees.
  summary: One of two close comrades marries at a white man's house, hunts elk, becomes
    lost, and is transformed into a tree by an old woman with medicines. His comrade
    follows, is mistaken for the husband by the wife, tracks the lost man with an
    iron dog, feigns sleep when the old woman appears, seizes her, takes her medicines,
    transforms her into a tree, and restores the victims. On the way home, the restored
    man becomes jealous, shoots the rescuer, later learns the truth, and revives him
    with life-medicine. The passage ends with the opening lines of the next tale,
    'The Wakan Girl.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Two youths are described as always staying together; one visits a white man's
    house, marries there, and goes hunting on horseback with a double-barreled gun
    and a small iron dog.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first youth follows two elk into brush, is still without them by nightfall,
    does not know where he is, and makes a fire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old woman appears at the fire, warms herself, calls the youth her grandson,
    tells him to sleep, and warns that his feet will burn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman unties a medicine-bag, rubs medicine on the youth with a stick,
    and the youth, his dog, his gun, and his other property become trees.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The second youth follows his comrade to the white man's house; the wife mistakes
    him for her husband, tries to keep him there, and he finally escapes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The second youth commands his iron dog to search for the lost friend; the
    dog searches, scents, and follows tracks to a place with two elk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The second youth pursues the elk into the brush, darkness comes, he builds
