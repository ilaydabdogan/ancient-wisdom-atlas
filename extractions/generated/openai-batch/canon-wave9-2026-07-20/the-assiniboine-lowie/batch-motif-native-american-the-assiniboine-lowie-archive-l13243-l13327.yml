canonical_text:
  quote: ''
  summary: A fragmentary tale tells of boys sent for feathers, a dead gull skull that
    foretells woman-stealing and battle, a charge that the boys stole a girl, and
    gulls killing the boys and taking the woman back. A continuation describes a large
    revenge expedition, a river crossing, an enemy wild dog that kills many attackers,
    an adopted boy divided between sides, and mistaken killing. The following war
    tales recount Stoney raids, Kootenay flight and captive-taking, Shuswap involvement,
    escape of captives, starvation, marriage, and suicide.
  language: English
  quote_policy: summarized
