  quote: ''
  summary: The passage gives brief abstracts of Assiniboine myths involving animal
    helpers and antagonists, transformations, theft or loss of powers, marital abduction
    or betrayal, restoration, contests of strength, and a cave encounter ending in
    death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Crane entrusts her child to Otter for the winter; Cold kills Otter and mistreats
    the young bird; Crane returns in spring, kills Cold, and rewards the Otter species.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man crosses a river on a fat elk, kills the elk, is covered with skin and
    food by a wolf, becomes bloodied while trying to escape, and turns into the bird
    Wis'kedidi'n.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Loon abuses Bald-Headed Eagle; Eagle pursues Loon and kills him with lightning
    after Loon repeatedly dives and resurfaces for air.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wolves teach Wolverene a fire-making trick; Wolverene overuses it and loses
    his power; the wolves steal his flint; he freezes and is mocked when the wolves
    offer to cover him with their tails.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wolverene angers Skunk and prevents him from voiding filth; Lynx kills Skunk;
    Skunk’s body is burned, and later skunks develop from spots on the corpse.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A blind man’s wife hides the fact that she has shot a buffalo and abandons
    him; a bird instructs him to dive into a lake; he recovers sight and kills his
    wife.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A witch transforms a sleeping young man into a tree; his comrade avoids the
    same fate, enchants the witch with her own charm, and disenchants victims; later
    the rescued man kills and then restores the comrade to life.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A wealthy youth marries a poor girl who has wakan' power; she calls buffalo
    and gives the power to her husband.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A husband pursues his eloped wife with help from a wolf and an old woman’s
    mink-skins that allow river crossing; he wins contests, kills the opposing chief
    and helpers, becomes chief, rewards the wolf, and the father-in-law kills the
    wife.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A buffalo steals a man’s wife; the wife betrays the husband to the buffalo;
    the hero later races and contests with the buffalo-woman, kills her at her vulnerable
    spot, restores his wife from a bone to human form, mutilates her, and kills her.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: A woman abducted by a beaver partly becomes beaver-shaped, nurses her baby
    from the water, is retrieved, runs away, turns into a bear and bears cubs, returns
    in a mixed human-beaver-bear form, and commits suicide.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: A crow tells a husband where his disappeared wife has gone and guards her
    while he hunts; the husband rewards the crow and treats the wife cruelly until
    she promises fidelity.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: During a famine, a young man steals a successful hunter’s game and falsely
    claims to have shot it; the hunter exposes him to his father-in-law.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: A Blood and a Kootenay meet in a cave, become friends, then wager property,
    scalps, and lives in contests of strength; the Kootenay wins and kills the Blood.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: The passage ends with only the title “The Gambling Contests” and no abstracted
    action in the supplied range.
  category: other
  evidence_refs:
  - ev:15
