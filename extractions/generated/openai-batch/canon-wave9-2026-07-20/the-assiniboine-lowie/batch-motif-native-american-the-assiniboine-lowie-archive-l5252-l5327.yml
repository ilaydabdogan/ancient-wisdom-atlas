- id: obs:2
  text: The compared organizations share hoof-rattles, feather headdresses, eagle-bone
    whistles, and an identity of name, which the author treats as corroborative evidence
    for common origin.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author frames a question about whether the society with the listed traits
    began as one in a series of age-societies or existed independently and was later
    graded.
  category: other
  evidence_refs:
  - ev:2
