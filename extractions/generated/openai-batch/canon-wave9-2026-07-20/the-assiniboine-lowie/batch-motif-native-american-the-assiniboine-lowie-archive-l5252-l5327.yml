canonical_text:
  quote: ''
  summary: Lowie compares Plains ceremonial and age-graded societies, noting shared
    regalia and obligations in unnamed organizations, discussing whether societies
    originated as age-classes or became graded later, and citing examples from Arapaho,
    Cheyenne, Hidatsa, Mandan, Arikara, Omaha, Assiniboine, Kiowa, Blackfoot, Pawnee,
    and war-parties.
  language: English
  quote_policy: summarized
