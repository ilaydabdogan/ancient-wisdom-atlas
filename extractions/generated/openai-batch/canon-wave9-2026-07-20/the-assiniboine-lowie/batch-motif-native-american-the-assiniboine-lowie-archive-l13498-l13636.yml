    than the real berries.'
  category: sequence
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:13
  text: One abstract says Sitcon'ski calls on Thunder, Thunder causes a flood, all
    unwinged animals perish, Thunder stops the rain, and Sitcon'ski revives the animals.
  category: sequence
  evidence_refs:
  - ev:14
