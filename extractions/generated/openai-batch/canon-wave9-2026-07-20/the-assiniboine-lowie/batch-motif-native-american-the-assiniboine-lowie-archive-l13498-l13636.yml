canonical_text:
  quote: ''
  summary: The passage gives numbered abstracts from a Trickster Cycle. The abstracts
    include flooded-earth creation from mud brought by Muskrat, season and mortality
    decisions, retrieval of summer from a bag, discovery of women’s camps, failed
    flight with birds, rock-capture episodes, reflection deceptions, animal-killing
    dances, food theft, flood destruction, animal revival, and encounters with Turtle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In two opening abstracts, the earth is flooded or receives mud from Muskrat,
    and a named trickster figure fashions or shapes the earth from that mud.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: One abstract says Sitcon'ski makes Muskrat and Beaver change tails.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: One abstract says Inkton'mi debates Frog about the length of winter, agrees
    to seven winter months, and creates men and horses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One abstract says summer is kept in a bag tied to a medicine-man’s lodge-pole;
    Fox steals the summer, it is passed among animal helpers, and Pkton'mi makes summer
    by opening the bag.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The same summer-bag abstract includes a council about winter length, a debate
    about whether humans should return to life after death, and a decision that humans
    are to die forever.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: One abstract says Pktu'mni plays with rocks and leaves the impress of his
    body on them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: An unnumbered abstract after abstract 4 says Sitcon'ski finds women who have
    never seen men; the women choose husbands, but Sitcon'ski refuses the chieftainess
    and remains single.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Another abstract says Pkton'mi paddles with a young man, discovers a women’s
    camp, explains sexual matters to chieftainesses and other women, and eventually
    escapes from women who hold him back.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Several abstracts describe the trickster wishing to travel or fly with geese
    or Eagle and then being dropped, abandoned, or left stuck in mud, swamp, or on
    a mountain-top sequence.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
- id: obs:10
  text: In the Eagle episode, Sitcon'ski turns into a moose to lure Eagle down and
    then kills Eagle after Eagle eats the meat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Multiple abstracts describe a rock seizing or holding the trickster fast,
    followed by birds shattering or breaking up the rock.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
  - ev:16
- id: obs:12
  text: 'Two abstracts describe deception by reflections in water: Sitcon''ski dives
