canonical_text:
  quote: ''
  summary: An orphan woman prepares a crow and a calf-skin, directs followers to build
    a buffalo corral, and uses repeated ritual actions to call and decoy buffalo into
    the enclosure. She later transfers the power to her husband, who repeats the calling
    and leads hunts under a stated limit. The woman explains that she dreamed her
    buffalo-calling power and describes other waka powers and the people's dependence
    on buffalo meat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The orphan girl asks her husband to obtain a crow, prepares it, and secures
    a calf-skin from an old woman who used it for storing berries.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: She orders people to follow her southward to a timbered place and announces
    that she is going to corral buffalo.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the chosen spot, she has men bring logs for a buffalo-drive, which is constructed
    in one day, and orders all dogs tied inside the lodges.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: She sends out a crow, which flies through the smoke-hole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: She dresses in a flannel shawl with eagle-feathers and goes out carrying the
    calf-skin.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: From a hill she sees a buffalo herd, gets ahead of it, waves her flannel four
    times, and calls the buffalo three times.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the fourth calling, she turns the calf-skin into a live calf; the calf
    runs toward the buffalo and then back toward her, decoying the herd into the corral.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: She picks up the calf, runs through the south-facing entrance, climbs a lofty
    tree inside the enclosure, and sings while the buffalo enter.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After she stops singing, sharpshooters kill selected buffalo; the fattest
    animals desired by the orphan are selected and the remainder is divided among
    the people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The husband later calls buffalo after receiving the power from his wife, repeating
    the crow, dress, flannel-waving, calf-skin transformation, tree, and shooting
    sequence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: For a buffalo chase, the husband fills a pipe, points the stem toward the
    buffalo, prays about the power received from his wife, asks how many buffalo he
    is to kill, and announces that only twenty are allowed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The young woman says she dreamed the power to call buffalo, says her waka
    powers make her superior to her husband, claims powers of distant hearing and
    wind-making, and says people can subsist on buffalo.
  category: speech
  evidence_refs:
  - ev:7
