canonical_text:
  quote: ''
  summary: 'The passage contains several Sitcon''ski episodes: he escapes a bear by
    wearing a buffalo skull; avoids mosquitoes by running into brush; is chased by
    an old buffalo after repeatedly abusing a skull and finally appeases it with tobacco;
    a Rabbit and Inktumni episode involving a sleeping-sex challenge and small rabbits
    emerging afterward; and the beginning of a tale in which four Cree travel to Sitcon''ski
    by the sea seeking immortality, marriage, and medicine, with one transformed into
    stone.'
  language: English with some Latin in one episode
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sitcon'ski shoots bad arrows at a bear; the arrows break, and he flees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sitcon'ski puts an old moss-covered buffalo skull on his head and faces the
    bear as if to hook it with horns; the bear flees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mosquitoes attack Sitcon'ski's face, nose, and eyes; attempts with a lodge,
    stick, fan, and smudge fail, but the mosquitoes do not follow him into brush.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A buffalo skull lying by a river returns to the same place after Sitcon'ski
    kicks it into water and after he burns and pounds it into powder.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sitcon'ski hears buffalo-like footsteps and snorting before seeing an old
    buffalo preparing to hook him.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: During the buffalo pursuit, Sitcon'ski enters a cracked rock that closes,
    shelters in a hollow stump, uses a willow as a swing, and plunges into a lake.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The buffalo licks the rock down, splits the tree, breaks the willow, and laps
    up the lake until Sitcon'ski is left on mud.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sitcon'ski offers tobacco; the buffalo says Sitcon'ski had kicked its skull,
    accepts willow-bark tobacco, lights it by holding it toward the sun, and leaves
    him alone.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Rabbit and Inktumni agree that the first to sleep will be sexually used by
    the other; Inktumni sleeps first, and Rabbit acts on the agreement while Inktumni
    sleeps.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Afterward Inktumni feels pain and small rabbits emerge when he defecates;
    an attempt to catch a later rabbit with a robe results only in soiling the robe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Four Cree travel to visit Sitcon'ski by the sea and hear drumming and singing
    for several nights before arriving on the fourth evening.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: 'The four Cree ask Sitcon''ski for different things: one wants to live forever,
    one wants to marry Sitcon''ski''s daughter, and two ask for medicine.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Sitcon'ski makes smoke, puts it on his hands, rubs the first Cree, and turns
    him into a stone.
  category: action
  evidence_refs:
  - ev:8
