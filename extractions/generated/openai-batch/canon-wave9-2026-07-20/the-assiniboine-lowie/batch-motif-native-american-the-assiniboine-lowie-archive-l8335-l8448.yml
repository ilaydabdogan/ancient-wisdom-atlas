canonical_text:
  quote: ''
  summary: A band abandons children, who encounter a cannibal witch. A surviving girl
    and her little brother escape after receiving instructions from a speaking buffalo
    skull and crossing a river on a bridge made by two swans. The pursuing witch fails
    the swans' test and drowns. The girl and brother return to the people but are
    again rejected; a benevolent old woman and her dog Muskrat help them retain a
    tipi after another abandonment attempt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people pack their travois, muzzle their dogs, and run away while the girls
    and other children are unaware of what has happened.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The children try to follow the people but cannot find the tracks, although
    an old woman who pitied them has hung up moss to point the way.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The children come to an old cannibal witch; the bead-maker has dreamt of her
    and promised her the children for food.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The witch invites the tired children to sleep near the fire, boils water in
    a kettle, beheads most of them, cooks them, and eats them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: One girl carrying her little brother survives because the boy wakes her after
    seeing the witch kill the children, and the girl pleads to live by working for
    the witch.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When ordered to fetch better firewood, the surviving girl takes her brother
    with her and finds a buffalo skull that speaks to her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The buffalo skull tells the children to run after their parents, go to a big
    river, find two white swans, pick and chew lice from a swan's head, and say that
    the lice are sweet.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The children follow the skull's instructions, and the swans put their necks
    together to form a bridge for them to cross the river.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The skull answers the witch's calls in place of the fugitive girl, delaying
    the witch; when discovered, it resists being split by the witch's axe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The witch asks the swans to let her cross, performs the lice-chewing task,
    but says the lice stink; the swans make a bridge with their backs and then raise
    their heads so that she falls into the river and drowns.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The girl catches up with the people, but her mother and father refuse to let
    her stay; the old woman who had hung up moss allows the girl and her brother to
    sleep in her lodge.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In a later abandonment attempt, the old woman instructs her dog Muskrat to
    return after the people are gone, untie the children, and let them have the tipi;
    the passage says the dog stays behind and later appears without the lodge.
  category: sequence
  evidence_refs:
  - ev:7
