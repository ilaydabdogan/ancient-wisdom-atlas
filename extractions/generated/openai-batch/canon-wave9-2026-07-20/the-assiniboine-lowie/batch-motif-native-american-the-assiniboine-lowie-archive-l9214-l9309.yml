canonical_text:
  quote: ''
  summary: 'A young husband and wife evade the wife’s mother through aid from the
    husband’s grandmother, transformations into birds and insects, hiding in animal
    holes, and protection by flies. A separate tale follows two boys: one wins a chief’s
    daughter by bringing dogs; the other is captured by an ogre, aided by a mule whose
    sweat protects him from fire, survives a fire ordeal, tricks the ogre into burning,
    wins the second daughter with a beautiful dog, and later becomes chief by retrieving
    cattle from the sea.'
  language: English
  quote_policy: summarized
