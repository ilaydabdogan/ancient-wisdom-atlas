candidate_motifs:
- id: motif:1
  label: Kin helper substitutes performers to evade a marital prohibition
  taxonomy_refs: []
  basis: The grandmother sends others to dance in the lodge while the young couple
    sleeps together despite the mother-in-law’s restriction.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives the episode briefly and does not explain the social
    or ritual reason for the dancing restriction.
- id: motif:2
  label: Fleeing couple evade a murderous pursuer through repeated animal transformations
  taxonomy_refs:
  - shapeshifter
  basis: The husband transforms himself and his wife into birds, and later the fugitives
    turn into prairie-chickens, mosquitoes, and grouse during the pursuit.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: Only the husband is explicitly said to perform the first transformation;
    later transformations are stated collectively.
- id: motif:3
  label: Animal refuges and helpers conceal fugitives’ tracks
  taxonomy_refs: []
  basis: The fugitives hide in a snake-hole, use a gopher hole while gophers cover
    tracks, and take shelter at a flies’ nest where the flies block the pursuer.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not state whether the snake-hole contains active animal
    helpers.
- id: motif:4
  label: Animal helper grants fire immunity through a protective substance
  taxonomy_refs: []
  basis: The mule instructs the boy to bathe in its white sweat so that the ogre cannot
    burn him, and the boy survives repeated passages through fire.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The taxonomy list has no specific fire-ordeal helper category; the motif
    label is descriptive.
- id: motif:5
  label: Ogre destroyed by tricked imitation of the hero’s ordeal
  taxonomy_refs:
  - trickster_boundary
  basis: After the boy survives the fire, he gives the ogre false instructions about
    the mule’s sweat, and the ogre burns up when he enters the fire.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The boy’s deception is clear, but the broader trickster classification
    is an interpretive fit rather than a named role in the passage.
- id: motif:6
  label: Bride won by fulfilling animal-gift condition
  taxonomy_refs: []
  basis: The chief offers daughters to whoever brings a handsome dog; one boy brings
    small dogs and the second later brings a beautiful dog, each receiving a daughter.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage does not clarify why dogs are the required marriage gift.
- id: motif:7
  label: Dangerous magical animal must be handled according to instructions
  taxonomy_refs: []
  basis: The mule tells the boy not to ride it too much and to feed it well; later
    another man insists on using the mule in a fire passage and is burned up, after
    which people fear the mule.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The exact mechanism of the later man’s death is not explained beyond the
    fire passage.
- id: motif:8
  label: Underwater cattle quest confers chieftaincy
  taxonomy_refs:
  - royal_legitimacy
  basis: The chief promises his chieftaincy to whoever gets cattle from the sea; the
    mule-owner brings up four cattle and becomes chief.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The elevation to chief is explicit, but the taxonomy reference is broad
    because the passage presents a task-based succession rather than a formal royal
    ideology.
