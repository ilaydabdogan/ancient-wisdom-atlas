canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which an old father-in-law demonstrates
    that winter springs contain game animals, causing moose and a bear to emerge and
    be killed for food. It then begins “The Buffaloes’ Ward”: an orphan baby is lost
    after a dog runs off with a travois; buffaloes find, carry, nurse, and raise him
    in their lodge, later return him near his human camp, where his grandparents reclaim
    him. The boy then prepares a ceremony to call four buffaloes called his grandfathers,
    with a central lodge and gifts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man has blood on his snowshoes but says he only passed through a red
    spring and found no game tracks or signs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father-in-law strips bark from two trees, puts bark at both ends of the
    spring, pokes with a stick, calls moose out, and a doe, a young moose, and a buck
    emerge and are shot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a bear spring, the old man says a bear is inside; after he uses bark and
    pokes the ground, a big black bear appears and is killed by the young man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The old man states that every spring has some kind of game in it during winter,
    after which the young man hunts for a spring every day and the people are no longer
    in want.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: An orphan boy is raised by his grandfather and grandmother; while the grandmother
    fetches wood, a dog chases a jackrabbit and runs away with the baby strapped to
    a travois frame, and the baby is lost.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A buffalo bull with cows and calves finds the lost baby; the bull carries
    him, a cow later carries and nurses him, and the buffaloes take turns carrying
    him to a large lodge where they raise him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A buffalo tells the boy he is different from buffaloes because he lacks fur
    and hoofs, explains that he was born among Indians, and says he ought to see his
    own people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The buffaloes travel with the boy near the camp; people discover him, his
    grandparents question him, and he tells them the story before they take him home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At night a voice exhorts the boy to do what he was told; later he announces
    that he will call four buffaloes, asks for a lodge in the middle of the camp-circle
    and gifts inside it, calls four buffaloes from the herd that raised him, and the
    buffaloes approach in single file.
  category: sequence
  evidence_refs:
  - ev:8
