canonical_text:
  quote: ''
  summary: 'The passage contains three narrative episodes: a presumed-dead son returns
    to his abused mother and kills his father by pulling down the sun; a younger brother
    is falsely accused by his brother''s wife and betrayed by the older brother but
    survives after falling into water; and an abandoned younger brother receives aid
    from a horned water-being, escapes a giant mosquito, and kills it with a bone
    implement.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy approaches his father's camp, hears his mother crying while chopping
    wood, and a little bird tells her that her son is present; she says her son has
    long been dead and then embraces him when he approaches.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother shows the boy sore spots on her body and tells him that her husband
    has been abusing her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy tells his mother to bring the other wife's baby, throw it into the
    fire, run from the lodge, and cry for her son; she follows these instructions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband follows the woman and threatens to kill her, but stops when he
    sees his son waiting behind a tree.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father and son agree to a trial of strength; the father cannot overcome
    the son.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boy catches sunbeams, pulls them down like ropes, brings the sun down,
    and the father dies from the heat after fat used as shelter melts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In a two-brother episode, the older brother is married, and the wife tries
    to seduce the younger brother, who refuses her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The wife asks the younger brother to bring her a live chicken, uses it to
    scratch her legs, and later says the younger brother tried to ravish her and scratched
    her.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The older brother believes his wife, takes the younger brother to a large
    eagle's nest near a river, has him climb the tree, and then chops down the tree
    so that the younger brother falls into the water.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The wife admits that she lied, and Tezexnin gets out of the water and afterwards
    becomes very strong.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the island episode, Red-Boat has abandoned his brother on an island, where
    the young man kills and scalps an enemy.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: A being called the Horned-One rises from the water with a long body and two
    horns; after receiving a piece of scalp as a present, it says it will save the
    boy.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The boy rides between the Horned-One's horns, pursues Red-Boat, exchanges
    threats with him, and is instructed to watch for a cloud below the noon sun and
    to use a large log.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: A huge mosquito attacks the boy; its sting goes through the log, and the boy
    kills it with a piece of bone received with instructions from the water-animal.
  category: action
  evidence_refs:
  - ev:13
