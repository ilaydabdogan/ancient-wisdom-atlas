candidate_motifs:
- id: motif:1
  label: stolen or abducted wife by animal being
  taxonomy_refs:
  - stolen_beloved
  basis: The young woman goes for water, disappears, and is found to have been kidnapped
    by a buffalo; her husband attempts to recover her.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage identifies abduction and a husband’s recovery attempt, but
    the woman later aligns with the buffalo rather than simply remaining a passive
    abductee.
- id: motif:2
  label: human woman transforms into buffalo-cow
  taxonomy_refs:
  - shapeshifter
  basis: The former wife makes fire and then turns into a buffalo-cow.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: Only this transformation is stated in the passage; no broader transformation
    cycle is described here.
- id: motif:3
  label: animal rival captures and tortures human husband
  taxonomy_refs: []
  basis: The buffalo rival strips the husband, ties him to a tree stump, and the wife
    burns his flesh with ashes.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:16
  confidence: medium
  cautions: This is a local narrative pattern in the passage rather than a supplied
    taxonomy family.
- id: motif:4
  label: dangerous boundary between human and buffalo camps
  taxonomy_refs: []
  basis: A large lake lies between the Indian and buffalo camps, and the buffalo-woman
    lures people across or toward her camp where buffalo kill them.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: medium
  cautions: The boundary function is inferred from the spatial separation and events;
    the passage does not explicitly call the lake a ritual or cosmological boundary.
- id: motif:5
  label: punitive dismemberment of wife by her father
  taxonomy_refs: []
  basis: The father binds his daughter to a post, rebukes her for running away from
    her husband, dismembers her, and disposes of the fragments in a pit.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: This belongs to the preceding tale fragment and is not linked by the passage
    to the buffalo-woman narrative.
