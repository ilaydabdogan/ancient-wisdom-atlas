canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which a man returns with followers,
    his father-in-law executes the man’s former wife for running away, and later offers
    a younger daughter as a replacement wife. It then begins the tale “The Woman Stolen
    by the Buffalo,” in which a woman fetching water is taken by a buffalo, betrays
    her husband when he tries to recover her, transforms into a buffalo-cow, helps
    torment him, and later kills people while trying unsuccessfully to recapture him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A returning man orders the camp broken, travels until sunset, and reaches
    the chief’s old home with many subjects.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father-in-law resolves to butcher his daughter alive after hearing that
    the man is coming.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fine articles are gathered and distributed among relatives of the deceived
    husband and the false wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The condemned woman is stripped, tied to a post, and bound with sinews before
    her father approaches with a large knife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The father rebukes his daughter for troubling his son-in-law and running away,
    and she does not answer.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The father cuts off the woman’s hands, arms, legs, and head, kicks the head,
    and has her body fragments thrown into a pit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The father sends a messenger offering his son-in-law a younger daughter as
    a wife; the man says she is too small but marries her after a year.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the next tale, an old man lives with his wife, daughter, and son-in-law,
    while his seven sons live apart.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The young woman goes for water and does not return; searchers find that a
    buffalo has kidnapped her.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Her husband hides where the buffalo get water, catches his wife at sunset,
    and asks her to come home.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The woman asks to go back for her bag, then informs the buffalo that her husband
