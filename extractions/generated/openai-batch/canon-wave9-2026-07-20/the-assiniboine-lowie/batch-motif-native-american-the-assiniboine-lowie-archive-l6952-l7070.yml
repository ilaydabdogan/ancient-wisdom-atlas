candidate_motifs:
- id: motif:1
  label: Trickster imitates restricted magical powers and loses them
  taxonomy_refs:
  - trickster_boundary
  basis: Inkton'mi receives powers under warnings and conditions, uses them alone
    or too often, is rescued, and has the powers removed; the footnote explicitly
    names trickster unsuccessful imitation.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The taxonomy mapping is based on the passage's explicit trickster-imitation
    note and on the narrative pattern; local terminology for the motif is given only
    in the editorial footnote.
- id: motif:2
  label: Sharpened-Leg hunting with return to life
  taxonomy_refs:
  - death_rebirth
  basis: The boys and later Inkton'mi cut off feet, sharpen legs, call animals, enter
    the brush, and in successful cases return to life in connection with slain game.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: medium
  cautions: The return to life is part of a hunting-power episode, not a full cosmological
    death-and-rebirth narrative.
- id: motif:3
  label: Removable eyes trapped by overuse
  taxonomy_refs:
  - trickster_boundary
  basis: Inkton'mi repeatedly throws his eyes despite warnings; the eyes lodge in
    a tree, causing distress until the boys restore them and remove the power.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: No external taxonomy label for eye-juggling is supplied; the boundary
    motif is inferred from misuse after warning.
- id: motif:4
  label: Failed sexual pursuit of Beaver with animal intermediary
  taxonomy_refs: []
  basis: Sitconski sees Beaver sleeping and uses a bird in an attempted sexual act,
    but the bird's actions fail and Beaver escapes into the water.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The key action is reported partly in Latin; the extraction summarizes
    rather than quotes it.
- id: motif:5
  label: Mink succeeds where Sitconski fails
  taxonomy_refs: []
  basis: Mink mates with a she-beaver in the water, while Sitconski observes and seeks
    a comparable act that leads back to the failed pattern of story 24.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage says a version of story 24 follows but does not reproduce
    the full repeated version.
- id: motif:6
  label: Offense against Beaver followed by water-denial and thirst death
  taxonomy_refs:
  - trickster_boundary
  basis: After Sitconski defecates in Beaver's house and steals the young beavers,
    Beaver enters the water when he approaches; he is afraid to drink and dies of
    thirst.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage does not explicitly state a causal speech by Beaver; the sequence
    suggests retaliation but should be reviewed.
- id: motif:7
  label: Death by thirst followed by awakening through Magpie's speech
  taxonomy_refs:
  - resurrection
  basis: Sitconski perishes from thirst, then after a bird defecates on his head Magpie
    tells him to wake, and he awakes saying he has slept a long time.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The narrative frames the return as waking from sleep after stating he
    perished, so the exact status of resurrection is ambiguous.
- id: motif:8
  label: Winter residence with Beaver under thick ice
  taxonomy_refs: []
  basis: The next tale opens with Sitconski offering to stay with Beaver and Beaver
    warning that winter is hard when the ice is thick.
  evidence_refs:
