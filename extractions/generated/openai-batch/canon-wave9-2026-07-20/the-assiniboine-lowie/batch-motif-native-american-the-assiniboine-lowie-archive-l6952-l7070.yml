canonical_text:
  quote: ''
  summary: The passage completes a tale in which Inkton'mi receives magical eye-throwing
    and sharpened-leg hunting powers from four boys, ignores their restrictions, is
    rescued, and loses the powers. It then gives short numbered tales involving Sitconski,
    Beaver, Mink, birds, stolen young beavers, death from thirst, and awakening by
    Magpie, followed by the opening of a winter-stay episode with Beaver. Editorial
    footnotes compare the Sharpened-Leg motif to Gro Ventre and Arapaho materials
    and note a Crow parallel for one episode.
  language: English with embedded Latin in stories 24-25
  quote_policy: summarized
