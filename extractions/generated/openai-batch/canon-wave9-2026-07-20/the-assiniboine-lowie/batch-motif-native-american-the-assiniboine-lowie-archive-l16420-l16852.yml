canonical_text:
  quote: Medicine-bag he untied; one (medicine) could restore life.
  summary: A medicine user opens a medicine bag containing life-restoring medicine,
    touches several beings and restores them to life, sends restored people back to
    their homes, travels with a comrade, and the narrative then recounts an encounter
    at a white man's house, a shooting of a friend or partner, later revival by medicine,
    and a father's rebuke. The interlinear text is fragmentary and some pronoun references
    are unclear.
  language: Assiniboine with English interlinear translation
  quote_policy: quoted
