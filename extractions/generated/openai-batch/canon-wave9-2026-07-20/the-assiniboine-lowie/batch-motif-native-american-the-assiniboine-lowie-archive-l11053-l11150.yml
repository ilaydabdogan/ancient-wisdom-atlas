canonical_text:
  quote: ''
  summary: The passage gives bear-wife narratives in which a man mates with a she-bear,
    adorns or visits her, and receives a human-shaped son with bear-derived powers
    who becomes a successful warrior or chief. It then begins a separate tale, “Snake
    and Bear-Woman,” where a burned country leaves Snake and Bear-Woman as apparent
    survivors; they camp together, and Bear-Woman creates and moves a lodge while
    Snake hunts deer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bear comes to a youth at night while others are sleeping; the youth wakes
    his father and asks him to build a fire, saying the bear would already have hurt
    him if she intended harm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The youth requests eagle-feathers, red flannel, and shells; these are obtained
    from the camp and presented to the bear, who decorates herself and departs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The following year, the two comrades find a shy boy on a hill; the companion
    identifies him as the youth’s son, and he is taken home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bear returns, receives adornments again, and communicates that the human
    father should keep the boy because his flesh is human; she says the boy will aid
    him with mysterious powers and that she has given the boy all her power.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The boy grows up, obtains horses and scalps, kills enemies, becomes a great
    chief, wears a large bear robe, and carries a shield and two large knives.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In a variant, two men find a sleeping she-bear; one man flees in fear while
    the other embraces and sleeps with her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The she-bear invites the man to her cave, which is furnished like a lodge
    and contains abundant food.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The bear-wife later visits the man’s lodge at night; his parents are frightened
    and leave for another tent.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The man later visits his bear-wife, who gives birth to a human-shaped boy;
    whatever the boy says happens, and he cannot be killed in fights.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: In “Snake and Bear-Woman,” the whole country has been burned, and Snake, feeling
    lonely, encounters a woman who is a bear and says she is the only person left.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Snake and Bear-Woman agree to camp together; Bear-Woman says there will be
    a tent by sunset and asks Snake to hunt.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: After Snake kills deer, Bear-Woman has made a fine lodge, moves it to the
    place Snake selects, dries meat, and dresses skins.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
