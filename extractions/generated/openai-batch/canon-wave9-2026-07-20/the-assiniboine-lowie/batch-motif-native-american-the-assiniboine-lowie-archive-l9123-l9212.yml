canonical_text:
  quote: ''
  summary: 'A son-in-law and father-in-law travel in winter; through an exchange of
    moccasins and delayed return, the old man is left without adequate fire and is
    later found frozen. The old woman then tries to marry the son-in-law by drowning
    her daughter with a sabotaged swing; a big fish seizes the daughter, who later
    emerges fish-bodied to nurse her baby. The husband learns the truth, transforms
    into a stick, seizes his wife, cuts away the fish part, and brings her home. A
    new tale begins: a grandson seeks a wife despite his grandmother’s warning, reaches
    the father of an only daughter, and must face tasks including cutting trees, eating
    a whole cow, and a pistol contest; with help and deception he prevails and kills
    the father.'
  language: English
  quote_policy: summarized
