- id: obs:3
  text: The stranger tells the woman to put food on her belly, eats from it, cuts
    open her belly, removes two children, circles the lodge-posts with her, and descends
    underground through the fireplace.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The returning hunter finds twin sons crying, calls wolves, sets up a lodge
    for them, and tells the wolves to guard the children while he pursues his wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The hunter circles the lodge-posts, descends through the fireplace, later
    emerges above ground, and reaches a camp by a lake where his wife's lodge is present.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: An old woman tells the hunter that the people at the lake are bad, will not
    give up his wife, and will try to kill him with their manitous.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hostile people require the hunter to dive in the lake and shake a post;
    he survives the first trial and later returns at night after a second dive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Before being cooked by his enemies, the hunter instructs the old woman to
    gather his bones and hair, cover them with a blanket, and wake him; after this
    is done, he stands up sound.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The hunter tells the old woman and his wife to hold his clothes when sunlight
    enters the lodge; he then pulls down the sun, causing heat that kills his enemies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The hunter takes his wife home, and the twins are old enough to be beginning
    to run about; the woman raises them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the Thunder-Bird account, three camps are by a large lake with an island
    called the old woman's home; during stormy weather, lightning strikes the island
    and something is drawn up from it.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The drawn-up being is described as an animal writhing like a snake, and the
    thunder-bird lifts it into the clouds amid thunder.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: While the monster is lifted, onlookers' hair, horses' manes, and loose light
    objects rise; afterward snow falls, the lake dries up, and animals die.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: A parenthetical report says the narrator later found a human-sized turtle
    skeleton, horned-animal remnants, and feathers; an aged witness added that the
    thunder-bird dropped the enemy three times, each time with a blaze of fire.
  category: other
  evidence_refs:
