canonical_text:
  quote: ''
  summary: The passage contains the end of one narrative and the beginning of a Thunder-Bird
    narrative. In the first, a hunter warns his pregnant wife not to heed a caller.
    A stranger enters, eats food placed on her belly, cuts her open, removes two children,
    and takes her underground by a route involving the lodge-posts and fireplace.
    The hunter leaves the twin sons with wolves, follows his wife underground to a
    lake-side camp, survives hostile tests, is cooked and restored from bones and
    hair by an old woman, pulls down the sun to kill his enemies, and brings his wife
    home. In the Thunder-Bird account, thunder and lightning draw a snake-like water
    animal from an island in a large lake; the thunder-bird lifts it into the clouds,
    and the storm is followed by snow, a dried lake, dead animals, and reported remains
    and unusual visual signs at the site.
  language: English
  quote_policy: summarized
