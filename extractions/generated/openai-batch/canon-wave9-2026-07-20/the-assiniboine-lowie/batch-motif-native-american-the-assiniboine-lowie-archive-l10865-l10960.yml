canonical_text:
  quote: ''
  summary: The passage closes one buffalo episode in which a boy rewards rescuers,
    reassures frightened people when buffalo fill the camp, distributes goods to buffalo,
    and then vanishes. It then gives tale 31, in which a Blood youth who overhunts
    eagles is carried by a red eagle to a mountain, returned with guiding feathers,
    led to buffalo beings in a pit, given a buffalo blanket, transformed into a buffalo,
    and later returns to his mourning family before resuming ordinary human food.
    The passage then begins tale 32, in which a lost boy is sheltered by a grizzly
    bear through summer and winter in a cave; hunters kill the bear, and the boy’s
    father recognizes the boy.
  language: English
  quote_policy: summarized
