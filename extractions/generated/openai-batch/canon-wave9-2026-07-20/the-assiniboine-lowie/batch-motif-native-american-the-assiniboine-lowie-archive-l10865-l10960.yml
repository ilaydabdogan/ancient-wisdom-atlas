candidate_motifs:
- id: motif:1
  label: reciprocal gift exchange with animal beings
  taxonomy_refs:
  - sacred_exchange
  basis: The opening boy rewards rescuers and distributes goods to buffalo visitors;
    in tale 31 the youth offers feathers and sweet-grass to buffalo and receives a
    blanket from an old buffalo.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not explicitly call the exchanges ritual or sacred; the
    motif label is based on repeated gift-giving between humans and animal beings.
- id: motif:2
  label: animal-guided ordeal and journey
  taxonomy_refs:
  - initiation
  - mystical_quest
  basis: The youth is carried by the eagle to a mountain, endures four days without
    food or drink, receives guiding feathers, follows directions to a pit, and encounters
    buffalo beings.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The text does not explicitly describe the sequence as an initiation; the
    classification rests on the ordeal, guidance, and transformative outcome.
- id: motif:3
  label: ascent to mountain followed by entry into the ground
  taxonomy_refs:
  - ascent
  - hero_descent
  basis: The eagle carries the youth to a mountain crag, then later instructs him
    to enter a hole in the ground where he meets buffalo beings.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage gives literal upward and downward movement; broader cosmological
    meaning is not stated.
- id: motif:4
  label: human transformed into buffalo by animal blanket
  taxonomy_refs:
  - shapeshifter
  basis: An old buffalo gives the youth a blanket and instructions; after putting
    it on, lying down, turning over, and shaking himself, he turns into a buffalo.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The transformed youth later resumes ordinary human food, but the passage
    does not clearly state a complete return from buffalo form.
- id: motif:5
  label: return of one presumed dead
  taxonomy_refs:
  - return
  basis: The youth returns home after his disappearance; his parents thought he had
    died, had cut their hair, and were lamenting him.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage says he was presumed dead, not that he literally died and
    revived.
- id: motif:6
  label: animal guardian shelters a lost child
  taxonomy_refs: []
  basis: The grizzly bear invites the lost boy to stay, lives with him through summer,
    winters with him in a cave, hides him from hunters, and the boy loves the bear.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No supplied taxonomy reference directly names this animal-guardian pattern.
- id: motif:7
  label: protective animal death
  taxonomy_refs:
  - sacrifice
  basis: The bear understands that hunters intend to kill him, tells the boy not to
    be frightened, hides him, lies down, and is shot; the boy grieves for the dead
    bear.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage does not explicitly say the bear intentionally sacrifices
    himself, so the sacrifice taxonomy is tentative.
- id: motif:8
  label: seasonal cave seclusion with bear
  taxonomy_refs:
  - seasonal_cycle
  basis: The boy stays with the bear through summer, the bear seeks a hibernation
    place in fall, they spend winter in a cave, and the bear speaks at the coming
    of spring.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The sequence is clearly seasonal, but the passage does not present a full
    cosmic or agricultural seasonal-cycle myth.
