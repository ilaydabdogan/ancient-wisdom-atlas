candidate_motifs:
- id: motif:1
  label: hostile father-in-law imposes lethal tests on sons-in-law
  taxonomy_refs:
  - initiation
  basis: The father-in-law figures repeatedly send sons-in-law into dangerous tasks
    involving an island, spring, mountain-lion, elk, and abandonment.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  - ev:7
  - ev:10
  confidence: medium
  cautions: The passage frames the acts as hostility rather than formal initiation,
    so the taxonomy reference is only a broad ordeal pattern.
- id: motif:2
  label: animal adversaries as dream-helpers
  taxonomy_refs: []
  basis: The old man is a dreamer who kills by power, and after the mountain-lion
    and elk fail or are defeated he is said to weaken because two dream-helpers failed.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:10
  confidence: high
  cautions: The passage explicitly names dream-helpers only after their failure; it
    does not separately explain the status of each animal before that point.
- id: motif:3
  label: bird disguise or transformation enables escape and reversal
  taxonomy_refs:
  - shapeshifter
  basis: One stranded son-in-law wears a gull skin and flies home; another is changed
    into a bird by a bird helper and also flies home before the father-in-law.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:11
  confidence: high
  cautions: The first episode uses a worn skin, while the second uses transformation
    by another bird; they are related but not identical actions.
- id: motif:4
  label: animal helper enables hidden attack on dangerous beast
  taxonomy_refs:
  - sacred_exchange
  basis: The fourth husband calls the mouse grandmother, asks for a tunnel, promises
    the mouse all the meat if helped, and uses the tunnel to kill the elk.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The exchange is explicit as a promise of meat, but the passage does not
    call it sacred.
- id: motif:5
  label: frozen person restored by fire
  taxonomy_refs:
  - resurrection
  basis: A man found frozen stiff is restored by a big fire.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is a brief opening fragment of a preceding incident, so narrative
    context is incomplete.
- id: motif:6
  label: dangerous animal appeased by kinship address
  taxonomy_refs:
  - wisdom
  basis: The third husband calls the spring mountain-lion grandfather and is not killed
