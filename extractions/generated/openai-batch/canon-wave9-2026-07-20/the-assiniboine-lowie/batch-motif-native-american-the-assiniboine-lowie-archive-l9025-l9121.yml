canonical_text:
  quote: ''
  summary: The passage gives the end of one son-in-law test episode and a second version.
    Hostile father-in-law figures send sons-in-law into lethal tasks involving firewood,
    an island, a spring, a mountain-lion, and an elk. Successful sons-in-law survive
    through disguise or animal help, return before the father-in-law, and shame him
    from above in bird form.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man piles up only a few sticks of firewood, delays four days in returning
    home, and later an old woman finds her husband frozen stiff; a big fire restores
    him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man’s wife warns that he will be tested again.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sitcon'ski takes his son-in-law by canoe to an island to gather eggs, then
    secretly paddles home and abandons him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The abandoned young man kills a gull, puts on its skin, takes his eggs, and
    flies over the lake with the gulls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bird-form son-in-law defecates on Sitcon'ski four times, and Sitcon'ski
    remarks that the bird’s excrement has a human odor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The young man reaches home first, removes the gull skin, and is seen with
    the eggs; Sitcon'ski is angry but stops troubling him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the second version, an old man dislikes his son-in-law and is described
    as a powerful dreamer who kills people by his power.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The old man sends successive husbands to drink from a spring before cutting
    willow-sticks; a mountain-lion emerges from the spring and kills the first two.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A third husband addresses the mountain-lion as grandfather and survives that
    test, but later dies when a big elk charges and hooks him.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: A fourth husband survives the spring test and asks a little old mouse, whom
    he calls grandmother, to make a tunnel for him beneath the elk’s resting-place.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The mouse digs the tunnel and gnaws away hair around the elk’s heart; the
    young man shoots the elk from below, kills it, and brings the antlers to his father-in-law.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The old man becomes weak because two dream-helpers have failed, has his wife
    make a sweat-lodge, and sweats before proposing another island trip.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: On the island feather-gathering trip, the old man runs back to the canoe,
    paddles away, and tells the abandoned son-in-law he will die there because he
    killed the old man’s helpers.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: A bird changes the abandoned son-in-law into a bird; he flies home, defecates
    in the old man’s eye from above, and arrives home before him.
  category: sequence
  evidence_refs:
  - ev:11
