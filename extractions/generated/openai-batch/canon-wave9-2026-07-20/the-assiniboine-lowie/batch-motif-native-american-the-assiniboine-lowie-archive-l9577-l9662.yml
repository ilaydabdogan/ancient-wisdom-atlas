canonical_text:
  quote: ''
  summary: 'The passage concludes one tale in which Inkton''mi is summoned as a wise
    helper for an injured man, gives directions that lead to the patient''s death
    when not followed, and gains a horse. A young man then enters the giants'' camp,
    is accepted through fictive kinship by a giantess, her husband, and Inkton''mi,
    receives food and gifts, and escapes only after obeying an instruction not to
    look back before crossing a hill. The passage then begins another tale: a young
    man elopes with the youngest wife of an old dreamer-husband, the lovers escape
    pursuit by changing into ants, grass, and cottonwoods, and the grandmother helps
    delay the pursuer with tobacco.'
  language: English, with one Latin sentence
  quote_policy: summarized
