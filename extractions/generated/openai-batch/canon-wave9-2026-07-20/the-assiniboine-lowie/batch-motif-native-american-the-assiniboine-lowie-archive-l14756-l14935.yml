canonical_text:
  quote: ''
  summary: Abstract (a) tells of four young men who set out to get feathers from a
    neighboring band, receive a warning from a crane's head not to touch a lame girl,
    and suffer lethal retaliation after one of them kidnaps her. A surviving brother-in-law
    reports the deaths, prompting the slain boys' father to organize a war expedition.
    An intended warning to a relative in the hostile camp is mistakenly delivered
    to a bad old man, who hides in a kennel and is later killed, while the intended
    man is killed in the attack. Abstract (b) is described as similar and adds that
    the bad old man has a ferocious dog that kills many enemies.
  language: English
  quote_policy: summarized
