  summary: The passage surveys Plains examples of obligatory or votive bravery in
    warrior and ceremonial organizations, including vows not to retreat, risk-bearing
    regalia, and first-strike rivalry. It then compares Omaha war-party formation
    with military society organization, noting invitations, feasts, dances, prayers
    to the Thunder deity, fasting, body marking, badges, offices, and messenger roles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Sioux society described by Lewis and Clark had members who vowed never to
    retreat from danger; examples include a member deliberately entering a hole in
    ice on the Missouri and battle casualties among members fighting the Crow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author treats direct derivation from the Crow Crazy Dog couple as unclear
    and instead argues that votive bravery was probably present in several Plains
    organizations.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Crow, the Big Dogs and Foxes attempted to outdo each other in striking
    the first blow at an enemy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among the Teton/Ogallala, Brave Hearts had four lance-bearers who incurred
    risks associated with their regalia.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among the Omaha, T’e'gaxe dancers went prepared to fall in battle and two
    men bore a feathered staff; the No-Flight society vowed not to flee, blackened
    themselves with charcoal, and included members who fought using deer’s-claw rattles
    with iron points.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A footnote reports Flathead leaders walking unarmed into an enemy camp with
    rattles and medicines, and the main passage notes a buffalo-headdress ceremony
    limited to very brave men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author concludes that obligatory bravery was widely distributed across
    age-societies, military societies, and other organizations; in the Crow sun-dance,
    certain individuals seated on lodge-poles became obligated never to flee from
    an enemy.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: An Omaha small war-party began when a proposer notified a friend; if the friend
    agreed, messengers invited others, participants assembled in the hosts’ lodge,
    plans and intentions were declared, chants and dances were performed, a feast
    was served, prayers were made to the Thunder deity, preparations continued for
    four days, and the warriors left camp at night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Omaha small war-party blackened their faces, wore buffalo robes plastered
    with white clay, had messengers with plumes and women’s pack-straps, fasted for
    four days, washed their faces, and had captains select two brave young men as
    lieutenants.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The author states that the Omaha small war-party showed traits suggestive
    of military societies, including a religious element, a badge, differentiated
    leaders, feasting, singing, dancing, and distinctive messenger decoration.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: An Omaha large war-party had two principal leaders, two minor captains, four
    messengers, and a police force commanded by two special officers.
  category: sequence
  evidence_refs:
  - ev:9
