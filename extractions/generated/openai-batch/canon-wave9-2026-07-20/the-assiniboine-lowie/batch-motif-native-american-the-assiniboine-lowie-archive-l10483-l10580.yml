canonical_text:
  quote: ''
  summary: The passage contains two related Assiniboine myth episodes involving Thunder,
    mountain lodges, iron ogres, serpents, turtles, and siblings or companions. In
    the first, a lonely younger brother is taken by Thunder to a mountain house, kills
    an iron monster for Thunder, and is helped to find his lost brother, who appears
    as snake, turtle, and man. In the second, Sitcon/ski, renamed Caribou, is taken
    by Thunder to a mountain-top lodge, kills a horned two-faced iron ogre, later
    eats a large snake, transforms into a river serpent demanding gifts from crossers,
    and is eventually killed in turtle form by frogs made by his friend. The line
    range also begins the next tale, “The Awl-Elbow Witches,” and includes editorial
    comparative footnotes.
  language: English
  quote_policy: summarized
