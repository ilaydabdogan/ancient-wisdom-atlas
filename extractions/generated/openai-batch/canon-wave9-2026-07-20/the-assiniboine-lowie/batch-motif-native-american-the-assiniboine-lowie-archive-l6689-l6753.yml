canonical_text:
  quote: ''
  summary: Inkton'mi cooks ducks and sends Coyote repeatedly to a cut-bank to borrow
    different buckets from a man inside the bank, intending to exhaust him. Coyote
    feigns lameness and later exhaustion. Inkton'mi cooks the fowl but becomes stuck
    to a rock; Coyote summons wolves and coyotes to eat all the food. Inkton'mi persuades
    white-spotted-wing birds to break the rock apart in exchange for white marks on
    their wings. After being freed, Inkton'mi finds no food left, and Coyote declares
    that he has fooled him.
  language: English
  quote_policy: summarized
