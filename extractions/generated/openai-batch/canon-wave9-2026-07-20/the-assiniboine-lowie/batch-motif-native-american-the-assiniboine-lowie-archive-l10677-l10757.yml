canonical_text:
  quote: ''
  summary: The passage contains a Sharpened-Leg episode involving two traveling companions,
    a tree that answers and later helps trap the leg-sharpener, a chief's bravery
    test at a river-bank, a second tale titled “Sharpened-Leg” in which a leg-sharpener
    kills his companion and then dies caught in a tree, a footnote comparing this
    tale with Gros Ventre, Arapaho, and Cheyenne sources, and the opening of “The
    Magic Springs,” where a winter hunter crosses an unfrozen spring and returns with
    blood on his snowshoes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two traveling companions continue for a long distance; the Southerner kills
    a moose, proposes two night fires, gives half the meat to his companion, and both
    eat and crack bones for marrow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Northerner claims to have broken all the bones, asks for marrow, and says
    they will play at kicking if the Southerner will not give him any.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Southerner becomes frightened, chops off his feet, and sharpens his legs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Northerner tells a tree of his own age to answer “No” if spoken to, and
    then runs away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tree repeatedly answers “No”; Sharpened-Leg later finds only a stump,
    becomes angry, splits the tree, and pursues his companion while holding his feet
    in his arms.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When Sharpened-Leg catches up, the Northerner climbs a tree and asks it to
    hold him; the tree obeys, and Sharpened-Leg gets stuck when he strikes the trunk
    with his sharpened leg.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Northerner refuses at first to free Sharpened-Leg, then releases him and
    sets his feet for him after Sharpened-Leg agrees to stop the pranks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A chief tests the bravery of the two companions by putting them on horseback
    and having the horses led to a steep river-bank; the leg-sharpener is frightened
    near the water, while the other man drives his horse onward.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: In the tale titled “Sharpened-Leg,” two young men live together; one sees
    the other sharpening his leg after cutting off his feet and flees for a night
    and a day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Sharpened-Leg pursues the fleeing comrade, splits the tree the comrade had
    climbed, finds him on the ground, and kills him by kicking him with the pointed
    leg.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Sharpened-Leg later kicks other trees, gets his leg stuck, and dies; the slain
    man's father follows the tracks and finds both the son's corpse and the tree where
    Sharpened-Leg is caught.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage names Sharpened-Leg as Canskar, translated Ground-Hog, and his
    comrade as Umbis'ka, translated Eagle.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: At the beginning of “The Magic Springs,” an old man lives with his son, daughter,
