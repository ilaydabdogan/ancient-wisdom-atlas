canonical_text:
  quote: ''
  summary: An old paddler tricks and carries off an older brother in a canoe. The
    captive becomes husband to the old man’s younger daughter and eventually weakens
    the old man by killing his manitou helpers. The older brother searches for his
    younger brother, who has become associated with wolves, lures him by transforming
    into a dead moose, and seizes him. Later, during a moose hunt, the wolf-brother
    disappears in a lake; an eagle reports that dogfish are playing with a wolf-skin.
    The hunter kills and wounds dogfish, then impersonates a toad doctor and kills
    more of them. The passage then begins another tale in which a bear abducts a pregnant
    woman to a cave.
  language: English
  quote_policy: summarized
