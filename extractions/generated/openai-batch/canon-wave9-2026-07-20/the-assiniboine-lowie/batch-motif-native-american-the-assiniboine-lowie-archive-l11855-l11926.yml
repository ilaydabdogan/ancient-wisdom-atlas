canonical_text:
  quote: ''
  summary: A well-to-do youth refuses many would-be wives and seeks a poor orphan
    girl. He finds an impoverished young woman living with her grandmother, brings
    gifts and food, proposes marriage, helps clothe and adorn her, and establishes
    a household with her. A rejected woman complains but is later admitted as a second
    wife at the young bride’s suggestion. The bride declares that she is wakan, cannot
    be killed, will lead the people, will have a son who will also be a leader, and
    will show the people how to get buffalo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young girl is described as pretty, long-haired, raggedly clothed, and
    living in a poor lodge with inadequate coverings, poles, and food.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A youth with well-to-do parents refuses many girls who want to marry him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The youth asks his family to find a very poor girl with no relatives and later
    says he has found such a girl himself.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The youth sits on a hill by a creek, watches women fetching water, and sees
    the poor girl outside a small lodge near the end of the camp.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The youth brings cloth, moccasins, blankets, a toilet-bag, clothes for the
    old woman, pemmican, and other gifts to the poor lodge.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The youth builds a fire outside the lodge and asks the old woman and her granddaughter
    to rise before declaring his wish to marry the girl if she accepts him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The girl agrees to the marriage and says that marrying him may also help the
    old woman.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The youth combs the girl’s hair, provides cloth and ornaments, and she sews
    new clothing for herself; the grandmother receives clothing and pemmican, and
    they feast through the night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A woman who wanted the youth as a husband enters the poor lodge, scolds him
    for choosing the poorest girl, and says he should have married her instead.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The orphan girl cries after the jealous woman’s speech, and the youth sends
    the woman away and wipes his bride’s tears.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The youth’s parents bring a lodge and furnishings to their son, the couple
    move into it, and the grandmother is given a new lodge by others.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The young wife tells her husband he may also marry the eager woman, but he
    initially refuses because he fears the woman might kill her rival.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The young wife says nothing can kill her, identifies herself as wakan, and
    says her husband is the first person she has told.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The young wife predicts that she will lead the whole people, that their first
    child will be a boy and a leader, that all the people will depend on them, and
    that she will show the people how to get buffalo.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: After the youth marries the older woman, the young wife tells the co-wife
    they will both be wives, assigns her lodge care, warns against maltreatment, and
    again contrasts her own wakan status with the other woman’s lack of it.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: The three spouses live together after the arrangement with the second wife.
  category: relationship
  evidence_refs:
  - ev:9
