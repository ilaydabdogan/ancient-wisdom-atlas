canonical_text:
  quote: ''
  summary: The passage contains two trickster episodes. In the first, Fox feigns a
    swollen leg, induces Sitcon'ski to race around a lake while weighted with stones,
    and eats the cooked geese. In the second, hungry Inkton'mi deceives ducks and
    Turtle with a revenge story and a dance, orders the ducks to keep their eyes closed,
    kills many of them, marks the survivors' eyes red, kills Turtle, and cooks the
    ducks. Notes compare the trickster race and hoodwinked-dancer tale with versions
    in other Native American traditions.
  language: English
  quote_policy: summarized
