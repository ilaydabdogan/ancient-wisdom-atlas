canonical_text:
  quote: ''
  summary: The passage contains the end of a Ball-Girl episode, in which a girl and
    her brother flee an old man, the girl uses a quill ball marked with directions
    and celestial signs to control buffalo and defeat the pursuer, and she escapes
    upward into the sky. It then gives the Morning-Star episode, in which a pregnant
    woman’s lover removes her child, the lovers flee underground and later turn into
    snakes in a hollow tree, and the husband climbs the tree to the sky and becomes
    Morning-Star.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl tells her brother that she killed the old man and his sons, and the
    brother says they must flee because the old man may return to life and pursue
    them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The brother and sister lift a big rock, go down beneath it, replace it, and
    the old man cannot find their tracks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man returns to his lodge, thinks his sons may have been transformed
    into bugs, cannot find them, and cries.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The girl tells her brother to go north and find Inkton'm, while she will go
    east; they lift the rock and separate.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The girl dives into the ground and comes up again four times while the old
    man pursues her and vows to kill her.
  category: sequence
  evidence_refs:
  - ev:2
