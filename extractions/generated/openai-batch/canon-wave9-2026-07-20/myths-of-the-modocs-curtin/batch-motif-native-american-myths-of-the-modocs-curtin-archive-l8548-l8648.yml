canonical_text:
  quote: ''
  summary: A group of sisters visits Blaiwas' village seeking husbands. Tusasis insults
    them and stirs fear, while several men hide. Village speakers warn that the sisters
    have great power and have displaced Lok from his mountain. The youngest sister's
    husband stays with her, but she returns home with her sisters. Tusasis mocks their
    departure; the sisters return looking like men, circle Blaiwas' house, and dance
    a war dance. They then return home and beat their father for sending them to seek
    husbands. Kulta's son grieves for his wife, and the kiuks Witkitkis foretells
    his death if he follows her. The sisters have their father make five bark sticks,
    build fires around the mountain, and command the sticks to draw the mocking men
    to them; the youngest sister declines to speak to her stick, then her bowstring
    breaks and she feels an approaching event.
  language: English
  quote_policy: summarized
