canonical_text:
  quote: ''
  summary: Ktilistinak and his sister become tired of the singing required for his
    medicines. Skoks and the other medicines withdraw their support, leaving Ktilistinak
    without curing power; he sickens, dies, and is burned with beads and mats. Blaiwas
    blames the sister for careless speech about medicines. The sister burns her house
    and leaves. Ktilistinak's grandmother mourns, appears with red and black tears,
    announces that she and the sister will no longer be people, and both become birds.
  language: English
  quote_policy: summarized
