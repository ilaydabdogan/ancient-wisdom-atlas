canonical_text:
  quote: ''
  summary: A powerful blue, gold, and green young man approaches Litkakawas at dawn,
    using underground travel as his father advised. Litkakawas knows he is watching
    and is pleased because he does not mock her. Her five brothers prepare to move
    the household to an island. The young man dazzles her, later invisibly delays
    their canoe, then follows it in the form of a beautiful salmon. A brother spears
    the salmon; it turns back into the young man and dies. Litkakawas mourns, the
    brothers burn household goods with the body, and a sun-bright disk remains in
    the ashes as the crown of the young man's head. The excerpt breaks off as the
    spearer tells Litkakawas to take the disk to Kumush.
  language: English
  quote_policy: summarized
