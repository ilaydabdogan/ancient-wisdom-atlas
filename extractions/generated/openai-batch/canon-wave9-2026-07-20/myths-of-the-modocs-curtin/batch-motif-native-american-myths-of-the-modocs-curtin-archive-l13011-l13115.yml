canonical_text:
  quote: ''
  summary: Kowe is challenged over a boy others say she stole. She hides him and raises
    him among her daughters. After a daughter says he is not their brother, the boy
    later shoots a long-legged bird, Tsiwididik, who tells him Kowe is not his mother
    and that his true parents mourned and searched for him. The boy grows, becomes
    a gambler, wins beads and shells, leaves by night, meets Tcooks by the river,
    and then transforms himself and his possessions before entering another village,
    where Ndukis' daughter recognizes him as young and takes him home.
  language: English
  quote_policy: summarized
