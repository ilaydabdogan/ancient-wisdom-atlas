canonical_text:
  quote: ''
  summary: The passage opens a story titled as Cedar-bird's daughters marrying Bull
    Snake, lists animal-named characters, and introduces the lakeside setting. Ndukis
    lives by Klamath Lake near old man Tcooks; Wiskak and her two daughters live on
    the south side. The daughters visit the Shasta people with presents, dig roots
    on their way home, and are noticed for their looks and work. Witkatkis visits
    his kin Ndukis; Ndukis' wife praises the sisters as workers and advises that one
    be sought as a wife. The passage ends with directions to the sisters' big house
    and the sisters camping after another return from Shasta.
  language: English
  quote_policy: summarized
