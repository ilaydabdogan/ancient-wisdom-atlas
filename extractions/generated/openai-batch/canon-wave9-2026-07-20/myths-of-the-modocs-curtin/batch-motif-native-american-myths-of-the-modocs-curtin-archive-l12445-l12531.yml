canonical_text:
  quote: ''
  summary: Won and a girl encounter Dunwa, a dangerous rock-woman who knows thoughts
    and changes form between day and night. Won and the girl flee to a river, where
    old man Tcooks helps them cross by stretching his leg across the water. When Dunwa
    follows, Tcooks shakes her into deep water, where she drowns; Won and the girl
    remain with Tcooks.
