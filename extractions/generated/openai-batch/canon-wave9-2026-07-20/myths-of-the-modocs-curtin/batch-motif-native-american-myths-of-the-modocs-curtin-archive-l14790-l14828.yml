canonical_text:
  quote: ''
  summary: Djaudjau returns from hunting with ten deer, alarming or angering his brother-in-law.
    His wife urges departure, and they leave at night. At a high mountain swimming
    place, Djaudjau uses green twigs and asks the earth to take away bad thoughts
    brought from the brother-in-law; he swims and speaks with the mountain, which
    answers like a living person. Back home, five Wulkutska brothers claim the child.
    Old woman Djiudjau objects. The young woman rebukes the brothers and declares
    that they will travel slowly, sweat, and no longer be persons. The brothers answer
    that she, her husband, and his kin will be Djdudjaus roaming the mountains, and
    the change is confirmed.
  language: English
  quote_policy: summarized
