canonical_text:
  quote: ''
  summary: Yahyahaas disputes a broken pipe with the elder boy, tries unsuccessfully
    to break the boy's pipe, and challenges him to wrestle beside a fire where the
    loser will be burned. The elder brother sends the younger ahead and says Yahyahaas's
    spirit will follow. The elder boy breaks Yahyahaas's leg, burns his body, and
    flees. Yahyahaas's spirit pursues the brothers, calls after them, later appears
    ahead with a deer and again tries to break the boy's pipe, then follows them toward
    a river crossing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yahyahaas accuses the elder boy of breaking his pipe; the boy says the pipe
    fell apart after he drew a whiff.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yahyahaas takes the boy's pipe as compensation, smokes it, strikes and pounds
    it with rocks, and throws it against a great rock, but it does not break and rolls
    back to its owner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yahyahaas builds a fire and says he and the boy will wrestle, with the beaten
    one to be thrown into the fire and burned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elder brother tells the younger brother to take their quivers and bows,
    run without looking back, cross a high mountain, and wait for him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The elder brother says he will kill Yahyahaas and burn his body, but that
    Yahyahaas's spirit will follow them as far as they go.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: During the wrestling, Yahyahaas nearly kills the elder boy several times,
    but the elder boy clings to him, bends him back, breaks off his leg, throws the
    leg and body into the fire, and runs toward the mountain.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Yahyahaas's spirit calls after the elder boy to return and wrestle, and calls
    to the younger boy claiming the elder brother has been thrown into the fire; the
    younger boy does not turn.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After many days of travel, Yahyahaas's spirit goes ahead, turns back toward
    the brothers, looks exactly like Yahyahaas, and carries a deer on his back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The brothers cannot turn aside because they are always going east.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The spirit stops on the trail, removes the deer, builds a fire, and proposes
    smoking rather than offering meat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the elder brother smokes the spirit's pipe, it breaks; the spirit then
    asks for the elder brother's pipe and tries unsuccessfully to break it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The spirit asks the elder brother to stop and wrestle, mentions a bad man
    living straight west on the road, pretends to go back, and then secretly follows
