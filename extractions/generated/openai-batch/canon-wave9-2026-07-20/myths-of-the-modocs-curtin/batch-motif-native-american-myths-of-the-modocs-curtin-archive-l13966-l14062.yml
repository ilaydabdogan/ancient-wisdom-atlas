canonical_text:
  quote: ''
  summary: A daughter refuses a proposed marriage to Wtilkutska. After a youngest
    blue-haired brother asks to be hidden from a sister who uncovers his basket, his
    eldest brother conceals him on a small ocean island, with the little sister helping
    guard him. The elder sister searches for the hidden siblings, threatens the family,
    and searches the island. The little sister escapes with the brother in a hollowed
    tula-grass canoe under the water. In anger the elder sister rolls on the sand
    and calls out, causing fire to blaze along her trail and around the village. Some
    named beings escape by turning into birds or going underground; most others, including
    the girl's family except the little sister, burn. The elder sister takes her brothers'
    hearts on a string, returns to the island, and later the little sister watches
    her swimming and calling like birds or animals while still appearing as a woman.
  language: English
  quote_policy: summarized
