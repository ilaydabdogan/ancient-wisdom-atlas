canonical_text:
  quote: ''
  summary: Kahkaas tells two brothers seeking a wife to go west. While the brothers
    are away, Pitoiois goes east to dig roots. Wus changes into a handsome young man,
    restrains her, and puts his head in her lap while she cries her own name. The
    youngest of five Wiilkutska brothers hears her cry while hunting. The brothers
    later follow the cry, see Pitoiois with Wus, and decide the youngest brother may
    have her if they save her. The youngest shoots an arrow near Wus, seizes Pitoiois,
    and springs with her over five mountains as Wus turns into a fox and flees.
  language: English
  quote_policy: summarized
