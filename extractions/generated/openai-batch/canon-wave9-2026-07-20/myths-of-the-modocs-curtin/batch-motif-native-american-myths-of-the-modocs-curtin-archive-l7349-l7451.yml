canonical_text:
  quote: ''
  summary: Wus stays with Natcaktcokaskit, whose one-legged travel, thought-reading,
    and manipulation of burdens and space are displayed. She bears children in rapidly
    growing pairs; Wus makes a boy toy arrows despite her warning, and the children
    begin to fight. Wus leaves, declares that half the people in the world will fight
    the other half, then reaches a village where a fool taunts him. Wus slashes the
    fool, who dies after villagers refuse him shelter; Wus regrets the act and calls
    Gak, who steps over the body five times and revives the man with a good mind.
  language: English
  quote_policy: summarized
