canonical_text:
  quote: ''
  summary: The passage first contains a brief preceding fragment about a powerful
    medicine associated with rain-making and seeing through a body. It then introduces
    Old Man Lulus-Dewieas, his son, daughter-in-law, and grandchildren living where
    the lava beds are now. The son repeatedly instructs his wife to feed the old man
    before anyone else, warning of misfortune if she does not. Before leaving to hunt
    deer in early winter, the son reports a bad dream in which his home has become
    a deep hole and warns that the children must not bother their grandfather. On
    reaching a mountain, he looks back toward the house, feels frightened and lonely,
    and continues hunting.
  language: English
