- id: motif:4
  label: Magical production of wealth for visiting kin
  taxonomy_refs:
  - sacred_exchange
  basis: Tskel produces buckskin shirts from powdered material, and Tcuskai produces
    beads and blankets from hair bones and a panther-skin blanket for kin and guests.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The taxonomy reference is broad; the passage presents social gift-giving
