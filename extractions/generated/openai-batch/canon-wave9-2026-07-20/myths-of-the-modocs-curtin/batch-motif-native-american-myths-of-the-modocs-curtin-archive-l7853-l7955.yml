canonical_text:
  quote: ''
  summary: A being identified as Yahyahaas is burned under a rock and his spirit flies
    upward as a big bird. Tcuskai revives a dead woman and receives gifts and the
    chief's daughter as wife. At home, Skouks, Tskel, and Tcuskai enlarge the house
    and produce gifts for visiting kin. After Tcuskai's wife says she wants to return
    home, Skouks transforms her into a bird, and old man Gak/Oak, in crow form, transforms
    her village people into birds and creeping things.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed male reports that he found a male figure under a rock and instructs
    villagers to pile wood and dry grass around the rock, set it on fire, and throw
    fallen sticks and coals back into the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the burning, there is a terrible noise, the surrounding land shakes,
    Yahyahaas bursts, the rock breaks into small pieces, and a big bird identified
    as Yahyahaas' spirit flies up to the sky.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tcuskai steps five times over a dead woman; she gets up, and the chief gives
    Tcuskai gifts and his daughter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Skouks arrives wearing a Shasta dress, carrying Shasta things in a bundle,
    with a baby on top of the bundle.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tskel tells Tcuskai not to be silly and later says his little brother will
    become a strong man.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: At Tcuskai's instruction, Skouks walks in a large circle around the house
    and puts her foot down hard at each step; when she completes the circle, the house
    has become large.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The bride's mother ties two small bones into Tcuskai's hair, and Skouks feeds
    guests deer meat and puts Shasta caps on the women.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tskel pounds a buckskin shirt into powder, rolls the powder in a deer skin,
    wets it, thinks hard, and draws out enough buckskin shirts for the men.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the mother-in-law's sister complains, Tcuskai breaks small pieces from
    the bones in his hair until he has a pile of beads, then bites his panther-skin
    blanket five times and obtains five blankets.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Tcuskai's wife says she is lonesome, was not made to live in the mountains,
    and wants to go home; Tcuskai tells her to go home and never think of him again.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Skouks throws dirt into the air and says the woman should become a bird; after
    a second handful is thrown toward her, the woman flies away to the mountains as
    a bird.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Tskel says old man Gak lives on a mountain in the east and can turn the woman's
    village people into birds; Gak/Oak goes to the village as a crow and commands
    the people to become birds and creeping things.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
