canonical_text:
  quote: ''
  summary: The passage summarizes and comments on myths about Isis or Aisis, Yaulilik's
    daughters, Kumush, Cogitkis, and comparative examples. It describes Isis's parentage
    through Ldtkakdwas, Kumush, the disk, and the sun; gives Isis's hunting, running,
    hair, fire-smoke, and solar attributes; states that Kumush impersonates Isis and
    deceives Yaulilik's elder daughter; notes a recurrent two-sister warning pattern;
    describes Cogitkis's hair-based powers; recounts Isis drawing the life-breath
    of his younger child into himself; and adds Wintu, Samson, and Algonkin comparisons.
  language: English
  quote_policy: summarized
