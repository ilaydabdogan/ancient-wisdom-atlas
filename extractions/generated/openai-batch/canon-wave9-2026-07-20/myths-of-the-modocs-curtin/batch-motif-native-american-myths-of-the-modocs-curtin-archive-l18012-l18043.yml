canonical_text:
  quote: ''
  summary: A warning instructs women not to answer returning voices, or only hearts
    will remain in a basket. When water boils, spirits of men whose hearts are in
    the basket enter the house and speak to the silent women. The men return to their
    places by the fire. An old woman says she mourned them as dead with ashes on her
    head. The eldest Wus says their brother had power and could save them. The sister
    reports mistreatment by hostile men, and the eldest brother says such people sometimes
    make captives eat the hearts of their own kin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prior instruction says voices will ask questions and demand food, but the
    women must not answer; if they do, only hearts will be in the basket.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the water begins to boil, the spirits of the men whose hearts are in
    the basket begin speaking in the brush outside the house and then enter the house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The women do not look up or speak, even when the spirits push and scold them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a period of noise, laughter, and talking, each man takes his place by
    the fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old woman tells the men they made her lonesome, says they had been dead,
    and says she put ashes on her head and mourned for them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The eldest Wus says their brother had power, that nobody could kill him, and
    that he could save them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The sister says hostile men treated her badly, denied her food, and threw
    her back and forth across the fire.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The eldest brother says those people sometimes make captives eat the hearts
    of their own brothers and kin.
  category: speech
  evidence_refs:
  - ev:7
