canonical_text:
  quote: ''
  summary: 'A boy is instructed by his grandmother how to pass a Skoks, a cold-producing
    supernatural being. In the encounter, the boy and Skoks fall and their bodies
    turn to rock while their spirits emerge. The boy''s spirit returns home as a young
    man, warmth and summer arrive, and the people make him chief. Later, after northern
    people refuse compensation for a killing, the chief uses Skoks as his medicine:
    he shouts like Skoks, freezes the enemies, and kills many with an obsidian knife.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The grandmother instructs the boy not to let the Skoks pass on the right side
    and to keep his left shoulder toward him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each time the Skoks shouts, the effect is compared to ice entering the house,
    and Tusasas cries out from cold.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The grandmother tells the boy to carry ordure in his hand and throw it if
    the Skoks tries to make him go on the wrong side.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Skoks has a head reaching the sky, appears to carry clouds, has one side
    painted white and the other black, and comes very fast.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The boy and Skoks fall; their bodies turn to rock, their spirits come out
    of the rocks, and the ordure also turns to rock.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The boy's spirit returns home the next morning as a young man wearing a panther-skin
    blanket, with the note that a person who meets a Skoks loses the old body.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: When the young man gets home, the place becomes warm, fires burn, it becomes
    summer, and the people make him chief.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two men go north to visit kin; one is killed, and the chief says compensation
    should be demanded and punishment given if it is refused.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The chief takes a long obsidian knife and says the Skoks is getting mad and
    ready to move; the passage identifies Skoks as the chief's medicine.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chief shouts like Skoks, his own people fall to the ground, the enemies
    become freezing cold, and the chief kills many with his obsidian knife.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Afterward, the northern people avoid further trouble because they recognize
    a powerful chief in the south.
  category: sequence
  evidence_refs:
  - ev:10
