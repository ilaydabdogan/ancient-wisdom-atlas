canonical_text:
  quote: ''
  summary: Two sisters look for Blaiwas after being told he flies without moving his
    wings. Ndukis imitates Blaiwas and deceives the elder sister, though the younger
    sister questions the identification. Ndukis has his mother receive the sisters
    and tries to act like Blaiwas. He is called to divide meat for Blaiwas and the
    head men, who throw unwanted pieces of meat into his mouth. To feed the girls,
    Ndukis cuts meat from his own legs. The younger sister rejects the meat and maintains
    that he is not Blaiwas. The sisters later follow Ndukis to a large house, see
    the real Blaiwas, and realize the deception. Blaiwas and Ndukis pursue the sisters,
    quarrel, and their brothers join in a fight.
  language: English
  quote_policy: summarized
