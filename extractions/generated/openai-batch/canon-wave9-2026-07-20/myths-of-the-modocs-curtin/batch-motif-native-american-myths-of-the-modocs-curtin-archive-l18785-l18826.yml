canonical_text:
  quote: ''
  summary: The passage introduces characters, then describes a woman and her little
    grandson living near Knekuks after the boy's parents have been killed. The boy
    secretly visits a village where some people pity him, some reject him, and one
    man jokes that the boy may want to kill him. The grandmother warns that the villagers
    will kill him when he grows older. On a later evening the boy steps on an old
    dry spear of tula grass; it screams like a hurt person, he picks up the pieces,
    and immediately falls because the grass is the spirit of a skoks.
  language: English
  quote_policy: summarized
