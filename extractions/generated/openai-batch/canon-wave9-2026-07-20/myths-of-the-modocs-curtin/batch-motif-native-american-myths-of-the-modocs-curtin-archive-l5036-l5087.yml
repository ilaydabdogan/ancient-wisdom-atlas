canonical_text:
  quote: ''
  summary: The passage introduces West Wind, his two wives South Wind and North Wind,
    and West Wind's younger brother. South Wind is mild and brings pleasant weather,
    food, and thawing warmth; North Wind is stormy and brings cold, snow, and ice
    when she is alone in the house. After South Wind returns from visiting her father,
    North Wind becomes jealous, takes beads and marriage goods, and returns north,
    though she comes to her husband once each year until South Wind comes home again.
  language: English
  quote_policy: summarized
