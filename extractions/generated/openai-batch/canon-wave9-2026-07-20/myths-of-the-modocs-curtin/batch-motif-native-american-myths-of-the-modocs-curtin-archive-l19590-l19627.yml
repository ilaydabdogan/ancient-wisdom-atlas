canonical_text:
  quote: ''
  summary: The passage presents elemental wind figures. Tdiskai, associated with spring,
    fails against North Wind. Tskel kills South Wind, uses his skin as a cap, and
    kills North Wind; present north and south winds are explained as the spirits of
    those winds. A Warm Spring Oregon myth is summarized in which Southwest Wind kills
    Tekstye's brothers, strikes Tekstye into water, and declares that she will freeze
    things only until Southwest Wind and Rain overpower her and green the ground.
    A following note describes Giukos, the moon, fearing big-mouthed grizzly-bear/cloud
    beings, relying on Weketas for protection and revival, and connects this to eclipse
    beliefs in which an animal tries to swallow the sun or moon.
  language: English
  quote_policy: summarized
