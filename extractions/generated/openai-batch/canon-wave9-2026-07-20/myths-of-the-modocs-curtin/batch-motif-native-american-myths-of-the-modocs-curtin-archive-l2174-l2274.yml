- id: obs:3
  text: The sisters are at the foot of Mlaiksi when the younger sister asks where
    water can be found.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The younger sister sees a green place high on the mountain, climbs upward,
    digs in moist ground, finds a little water, and both sisters drink and fill their
    water baskets.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The younger sister hears a strange sound, feels drawn toward it, returns the
    next day, and hears a weak voice saying that they are drinking tears.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The younger sister follows the sound, finds a bright red hair on the ground,
