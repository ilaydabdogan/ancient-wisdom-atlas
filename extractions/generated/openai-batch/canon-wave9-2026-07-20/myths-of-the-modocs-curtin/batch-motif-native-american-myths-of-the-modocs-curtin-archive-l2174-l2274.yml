canonical_text:
  quote: You are drinking nothing but tears.
  summary: Two sisters gather seeds near Mlaiksi. The younger sister searches the
    mountain for water, hears a strange sound, finds a red hair and the skeleton of
    Isis with living eyes, and carries the bones away despite her elder sister's fear
    and anger. She rubs the skeleton with deer fat until it becomes a living man again.
    Cogatkis repeatedly reports what he sees to his mother, and animals dance around
    Isis in different scenes.
  language: English; includes a brief transcribed phrase glossed in English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The younger sister says they have only a few seeds and proposes staying all
    night so they can fill their baskets in the morning.
