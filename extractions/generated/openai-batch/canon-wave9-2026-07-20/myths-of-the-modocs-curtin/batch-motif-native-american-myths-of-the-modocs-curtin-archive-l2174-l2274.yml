  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: In a smooth, level place without grass or weeds, the sisters find Isis' skeleton;
    the bones are dead but the eyes are living.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says thousands of deer had danced around the man who killed many
    of their people and had stamped the ground level with their hoofs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The elder sister is frightened by the skeleton and wants to run away, while
    the younger sister spreads out her wolf skin blanket and places the skeleton on
    it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The younger sister says she will bring the skeleton to life; the elder sister
    objects, saying it smells bad and later saying she wants to pound and burn the
    bones.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The younger sister rubs the skeleton with deer fat, pushes fat between the
    teeth, works over it all night, and by midday the skeleton is a man again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After Isis is restored, the younger sister feeds him and the elder sister
    gathers seeds for him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Isis drinks water, lies down, and sleeps; while he sleeps, porcupines dance
