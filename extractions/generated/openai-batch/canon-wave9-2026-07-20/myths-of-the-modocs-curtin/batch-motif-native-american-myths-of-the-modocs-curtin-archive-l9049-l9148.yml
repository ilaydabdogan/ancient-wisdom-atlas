- id: obs:1
  text: Goshgoise looks down from a mountain or high place and sees women digging
    roots below; among them is his father's sister, whose head is covered with pitch
    because she is mourning her husband.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The aunt recognizes Goshgoise as her nephew, tells him to go away because
    the place is bad, asks how he passed the Yaukul brothers, and he says that he
    killed them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The aunt says that the five Kaudokis brothers live there, make the women work,
    and would cut off the captives' legs or ears and make them eat those parts if
    they did not work.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The aunt identifies the eldest Kaudokis brother's wife as a beautiful bright
    woman who looks like the moon.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Goshgoise says that he has come for a wife, wants the bright woman, and is
