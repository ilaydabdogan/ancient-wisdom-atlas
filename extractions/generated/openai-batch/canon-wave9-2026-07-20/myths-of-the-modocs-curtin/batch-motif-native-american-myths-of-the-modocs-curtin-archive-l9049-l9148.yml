canonical_text:
  quote: ''
  summary: Goshgoise reaches a place where captive women, including his mourning aunt,
    work under the five Kaudokis brothers. He seeks the eldest brother's bright wife,
    calls on Mole as his medicine-helper to dig holes, kills the brothers as they
    fall into the holes, takes their elk-skin blankets, and declares that their souls
    will become worms. He takes the eldest brother's wife, frees the captives, sends
    them to his grandmother, and continues toward another village where a brother
    is said to kill suitors of his sister. He later camps on a mountain and sees a
    river valley with women gathering roots, including another aunt, Skola.
  language: English
  quote_policy: summarized
