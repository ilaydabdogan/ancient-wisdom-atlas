    leave.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Kaudokis brothers wear untanned elk-skin blankets; the approaching eldest
    brother is heard with the noise of running and pounding a dry hide, and later
    brothers come with spears.
  category: attribute
  evidence_refs:
