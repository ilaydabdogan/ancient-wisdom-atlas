canonical_text:
  quote: We are leaving the world, but each year we shall see our father's country.
  summary: Two brothers travel past the one-legged man's house and repeatedly encounter
    Yahyahaas' spirit, who asks for their pipe, appears with deer and in different
    painted forms, and pursues them across mountains. The brothers evade him by becoming
    black coals carried by a whirlwind. At the eastern ocean, the elder brother uses
    a pipe contest and wrestling to destroy Yahyahaas, throws him into the water,
    and declares that he will no longer be a person but only something that entices
    and fools people without strength.
  language: English
  quote_policy: quoted
