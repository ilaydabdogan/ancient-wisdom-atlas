canonical_text:
  quote: ''
  summary: The passage gives a character list and introduces Old Kuja, his five daughters,
    their mountain hunting practices with fire, their shifting appearances, their
    exclusive control of hunting grounds, Blaiwas's warning about them, and Yahyahaas's
    stated intention to approach them as a wife-seeking challenger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The character list identifies Blaiwas as Eagle and Yahyahaas as the One-legged
    Man.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old Kuja and his five daughters live in mountains east of Tula Lake; the old
    man does not hunt or leave the house.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The five daughters are hunters; when preparing to hunt they remove their clothes,
    become red from the waist up, put on breech clouts, and go out as men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One sister builds a ring of fires around the mountain to be hunted; the fire
    and smoke drive deer toward the top, where the other sisters shoot them with arrows.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: People can tell which sister built a fire by the smoke; the youngest sister's
    smoke rises highest and straightest, while the eldest sister's smoke is least
    and spreads everywhere.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Kuja sisters alone hunt on those mountains; when they find a man there,
    they encircle the mountain with fires, drive him to the top, and kill him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Old Kuja's house contains sacks of dried meat and white roots; when the sisters
    dig roots they carry baskets and digging sticks and look like old women.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Blaiwas has a house in a large village southwest of the Kuja hunting area
    and is chief of that village.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Men in Blaiwas's village discuss going to see the Kuja sisters; other men
    warn that the sisters are wise and can turn themselves or others into anything
    they want.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Blaiwas warns people to keep away and says he once tried to get near the sisters,
    but their distant fire made him feel as if he were burning.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Blaiwas says the sisters do not want to marry, cannot be approached closely
    enough to see how they live, look like men while hunting, and look like ugly old
    women while digging roots.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Yahyahaas says he came for a wife, suggests taking one of the Kuja sisters,
    and later says he can go see them and take their bows and arrows.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The next morning the sisters build a fire around Lokiumsis, a mountain in
    the west, and men point it out to Yahyahaas.
  category: sequence
  evidence_refs:
  - ev:9
