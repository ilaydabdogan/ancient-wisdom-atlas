  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: White settlers entered the Modoc country, a fort was established, and the
    Modocs could no longer subsist by fishing and hunting; they were eventually forced
    to sign the Treaty of 1864.
  category: sequence
  evidence_refs:
  - ev:7
