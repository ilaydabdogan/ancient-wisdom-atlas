canonical_text:
  quote: ''
  summary: The introduction describes the Modoc homeland, its volcanic and lake landscape,
    and Modoc beliefs that Kumush created and named the world’s features, transformed
    earlier beings into natural forms, created the Modoc and other tribes, assigned
    them homes, and established the present order. It also summarizes the sacred status
    of the homeland and the historical displacement, treaty, attack, retreat to lava
    beds, and use of the Ben Wright cave during the Modoc War.
  language: English
  quote_policy: summarized
