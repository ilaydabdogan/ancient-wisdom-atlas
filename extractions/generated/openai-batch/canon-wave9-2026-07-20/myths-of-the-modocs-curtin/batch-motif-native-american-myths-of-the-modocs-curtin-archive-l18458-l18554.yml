canonical_text:
  quote: ''
  summary: Kai Rabbit goes with his younger brother Goshgoise to Natanatas' house
    because Kai wants to marry Natanatas' daughter. Old man Natanatas plans to kill
    Kai for his sons to eat, tricks him into a fishing trip, and tries to drown him
    by making wind while pretending to sleep in the canoe. A speaking white eagle
    feather warns Kai and instructs him to escape using five strands of seaweed. Kai
    returns safely, and Natanatas finds him asleep by the fire. Natanatas then begins
    another task involving reeds for arrows; Kai's wife warns him that her father
    kills every man who comes there, and the passage ends as white eagle feathers
    call to Kai near the lake.
  language: English
  quote_policy: summarized
