canonical_text:
  quote: ''
  summary: 'Opening of ''The Bad Brother'': after a character roster, an unnamed mother
    with a son and daughter lives at Yani. The mother gives different foods to the
    boy and the little girl. The boy becomes jealous, tells his sister their mother
    loves her better, returns with her to the house, tells her to look out, sings
    a phrase glossed ''Up, up!'', and asks what their mother is doing.'
  language: English
