canonical_text:
  quote: ''
  summary: Tcuskai steals Gak's fire-drill, tries to damage it, and Gak dies. Tskel
    finds the fire-drill, kills Tcuskai, and arranges a restoration rite in which
    the fire-drill is painted red and placed on Gak's head; Gak revives, and Tskel
    then revives Tcuskai by stepping over him five times. Later Tcuskai disobeys Tskel,
    interferes with old Kewe's deerskin chewing, and pulls out nearly all of Kewe's
    teeth, leading Kewe to pronounce lasting effects on deerskins and Kewe people.
    The passage also begins an episode in which Wus, a deerskin chewer for the Kaiutois
    brothers, is frightened after a coal burns a deerskin, is mocked and given the
    skin, and later becomes poor and hungry with his mother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kewe lives near Tskel and chews deerskins for him; Tskel gives Gak a deerskin
    after Gak finds the deer.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tcuskai steals Gak's fire-drill, takes it to a muddy place, sticks it in the
    ground, and tries to break it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the fire-drill is stolen and handled in this way, Gak falls backward,
    blood comes from his mouth, and he dies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tskel sees that Gak's fire-drill is missing and finds Tcuskai at a spring
    trying to catch fish with it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tskel drags Tcuskai into the house, pounds him until he is dead, and asks
    the Kaiutois brothers how Gak can be brought to life.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tskel says that if Gak comes back to life, his brother will live again, but
    if Gak remains dead, his brother will remain dead.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tskel gives boiled red paint to the youngest brother and tells him to paint
    Gak's fire-drill red; the fire-drill is then laid on Gak's head.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After a long time the fire-drill brings Gak to life; Gak sings to the earth
    and wind and tries to cure himself.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: When Gak is alive, Tskel steps five times over Tcuskai's body, and Tcuskai
    revives.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tskel tells Tcuskai to stay in the house and not go bother Kewe, but Tcuskai
    slips out and goes to Kewe's house.
  category: sequence
  evidence_refs:
