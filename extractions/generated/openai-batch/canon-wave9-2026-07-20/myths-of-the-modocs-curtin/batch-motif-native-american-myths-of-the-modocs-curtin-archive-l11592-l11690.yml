canonical_text:
  quote: ''
  summary: A bear-like child plays roughly among village children and is shot; the
    child's mother, Lok Snewedjas, arrives as a destructive whirlwind. A knowledgeable
    orphan girl with a red-painted double-pointed stick stops the storm and leaves
    the woman dead or overcome. The young man revives the boy with a medicine basket
    but cannot revive the woman. An old woman whose medicine is Skoks recalls the
    woman's spirit from near the sunset, restoring her to life. The woman later returns
    to the mountain with her husband and child.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The child was set down among children, ran in a bear-like way, slapped and
    pushed other children, and the children thought he was a real bear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tusasas warned that a bear was eating the children; Tusasis shot the child
    under the arm with bow and arrow, and the child immediately became a little boy
    again and died.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The father called out that the child was his, but he was too late; the mother
    was coming toward the scene and knew harm would happen before she arrived.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The mother came roaring; the earth trembled, trees were pulled up, rocks were
    thrown, houses fell, and a dark dirt-and-wind storm surrounded her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two orphans, a boy and a girl, lived in the village; the girl was small but
    strong, knew things, and carried a long stick sharp at both ends.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The orphan girl had the stick painted red, red lines were painted on parts
    of her body, and she sat before Lok Snewedjas as she came twisting and tearing
    up the earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Lok Snewedjas turned to the right, the orphan girl thrust the stick into
    the middle of the whirlwind; the storm stopped, and a beautiful young woman lay
    on the ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A note reports that the relator said telling the story would bring heavy wind
    because the story always brought a wind-storm.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: The young man said he had killed his wife and child by not doing as instructed;
    he put Gak's medicine basket on the boy and stepped over him, after which the
    child came to life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The same method did not revive Lok Snewedjas; Blaiwas offered deerskins, shells,
    and porcupine quills to anyone who could bring her to life.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The young man stepped over the woman five times, then ten times, then twenty
    times; she moved only a little.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: People suggested an old woman among rocks by the lake whose medicine was Skoks;
    when she came, she asked for someone to scream and said the woman's spirit had
    nearly reached where the sun goes down.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: Skoks entered a man and screamed loudly; the old woman reported that the spirit
    turned back, arrived, and entered its body, and the young woman stood up bright,
    beautiful, and well.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The revived woman said the orphan girl would not have killed her without the
    storm; after three days she went back to the mountain with her husband and child.
  category: sequence
  evidence_refs:
  - ev:8
