canonical_text:
  quote: Sickness was a person and owned fire.
  summary: The notes place the Modoc dead in an underground house in the West and
    state that Kumush traveled on Sun's road to the middle of the sky and built his
    house there. The passage then introduces the tale “Stealing Fire” as part of a
    first cycle of myth-tales about pre-human beings and phenomena. In the tale setup,
    Sickness and Sun own fire, a council of the first people sends Wus to obtain fire
    for future people, and the first people know another race is coming and that they
    will be changed. A comparative note mentions other mythologies of fire theft and
    gives a Nosa example involving Ahalamila stealing coals from Au Mujaupa.
  language: English
  quote_policy: quoted
