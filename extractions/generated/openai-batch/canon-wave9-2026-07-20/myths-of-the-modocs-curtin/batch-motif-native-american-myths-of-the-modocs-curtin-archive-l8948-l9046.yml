canonical_text:
  quote: ''
  summary: Goshgoise refuses to surrender his blanket and quiver, kills the Yaukul
    brothers in successive combats, curses them to become water fowls, kills their
    old mother, takes the daughter as wife, finds captive kin, sends the captives
    to his grandmother's place, and begins traveling toward another dangerous place
    described by his mother.
