canonical_text:
  quote: ''
  summary: The passage introduces Lok, Kekina, and Wus figures, describes the Lok
    siblings living near Klamath Lake and old woman Wus living nearby with her orphaned
    Kekina nephews. Their parents were killed by the Lok brothers. Wus had the children
    store roots in a tree for winter; the younger Kekina boy climbs for roots and
    calls that spring is coming. Lok's sister hoards roots underground, watches Wus,
    and rebukes the younger boy's spring announcement while threatening social danger
    through her brothers. The elder Kekina brother makes poison arrows and warns Wus
    and the younger brother not to answer Lok.
  language: English
  quote_policy: summarized
