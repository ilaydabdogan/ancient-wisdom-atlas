canonical_text:
  quote: ''
  summary: A fragment first describes Kumush being recognized when a scar is exposed.
    Isis then returns after sweating and after being rescued and cured by Kols and
    Wilwilegas. He confronts Kumush, summons wives who had stayed with Kumush, burns
    their feet, and turns them into ducks and water birds. Isis burns Kumush to ashes,
    but a disk remains, and the morning star, called Kumush's medicine, revives him.
    Isis later rejects Kumush as father, Kumush goes to Tula Lake, and Isis transforms
    three faithful wives into a butterfly, a badger, and a wren before living alone
    on Tcutgosi, a high mountain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wind raises Kumush's blanket while he stoops for a ball, revealing a scar;
    people recognize him, shout, laugh, stop the game, and gather around him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After sweating, Isis travels ahead of Kols and Wilwilegas and sets fire to
    grass; smoke rises straight up, people identify him by the smoke, and Kumush becomes
    frightened.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tcikas is camping, digging roots, and mourning for Isis; a child sees Isis,
    calls him father, and Tcikas initially says the father is dead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Tcikas sees Isis, she is glad and asks where he had been and how he returned.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Isis says Wilwilegas and Kols, described as wives he had not cared for, saved
    him; he recounts being found in an eagle's nest, carried home, and cured.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the gambling place, Kumush wants to talk with Isis and be friendly, but
    Isis is angry and does not let Kumush come near him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Isis has Kols and Wilwilegas gather wood and build a large fire, then calls
    to his wives who are with Kumush; when they refuse from fear, he wills them to
    come and they are compelled.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Isis burns the feet of the wives who had been with Kumush, makes the feet
    red, and declares that they will become birds scattered over the world and good
    for people to eat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The wives who had been with Kumush turn into ducks and water birds and fly
    away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Isis throws Kumush into the fire, covers him with burning wood, and burns
    him to ashes; a disk remains in the ashes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The next morning, the morning star, called Kumush's medicine, speaks to the
    disk; immediately Kumush is alive, and the passage says he will last as long as
    the disk and the morning star.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Isis understands that Kumush will never die and that nothing can kill him;
    Isis wanders among mountains singing a beautiful song that others can imitate
    but not repeat or understand.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Kumush follows Isis for years and finally overtakes him; Isis refuses reconciliation,
    says Kumush is not his father, and hopes future fathers will not treat sons as
    Kumush treated him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Kumush goes to live at Tula Lake; Isis turns three faithful wives into a butterfly,
    a badger, and a wren, then goes to live alone on Tcutgosi, a high mountain.
  category: sequence
  evidence_refs:
  - ev:10
