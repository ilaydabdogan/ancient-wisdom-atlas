canonical_text:
  quote: ''
  summary: Kalaslakkas is directed by Old Ktsitco and his grandmother to visit remote
    mountain swimming places, rub his body with ashes, pile stones, swim, keep dreams
    secret, and listen for words from the water. At the swimming places he dreams
    of a beautiful woman, grows tall with long hair, hears gambling sounds beneath
    an ice-covered pond, dreams of the chief of gamblers, and is drawn underwater
    to a bright shell-filled house where a man shows him a beautiful woman. His grandmother
    says the earth and mountains have taught him and that more places will give strength.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old Ktsitco says that on a mountain in the East there is an underground swimming
    place where Kalaslakkas can pile stones, swim, gain wisdom and power, grow quickly,
    and obtain a girl for a wife.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grandmother is distressed but rubs Kalaslakkas's body with ashes and gives
    him a rabbit-skin blanket before he starts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the first mountain place, Kalaslakkas piles stones, enters a water-filled
    hole leading to a pond, swims for a long time, lies on stones, and sleeps.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In sleep he dreams of a voice asking whether he would like a beautiful woman
    in the South for a wife; when he wakes, he is tall and has beautiful long hair.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: His grandmother tells him not to tell a dream and, if it was good, to stay
    outdoors and not talk to anyone.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The grandmother sends him to Yomaka, an ice-covered swimming pond that opens
    a place to swim if it likes the visitor.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Yomaka he hears men singing and gambling under the water and ground, the
    ice melts, he swims, hears a great shouting noise, and sees only stones when looking
    down into the water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After swimming at Yomaka, he sleeps and dreams of a man with a long white
    feather in his hair who says he is the chief of gamblers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: His grandmother says the earth and mountains have taught him many things and
    that he will be a strong man and a great gambler.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The grandmother tells him to go to another swimming place without looking
    back or around, to sit by the pond, and to listen until words come from the water.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: At the next pond, after piling stones and listening, Kalaslakkas hears someone
    in the water ask what he wants and invite him to swim.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: While swimming, Kalaslakkas feels something draw him under until he reaches
    a beautiful bright house filled with bright shells; a man is with him, opens a
    skin door, and asks whether he wants to see a beautiful woman.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After Kalaslakkas looks at the woman, he feels himself rising to the surface;
    the man tells him to dive five times and go home.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: When he returns near his grandmother's house, she asks whether the earth was
    glad to see him and says there are more places from which he will get strength.
  category: speech
  evidence_refs:
  - ev:10
