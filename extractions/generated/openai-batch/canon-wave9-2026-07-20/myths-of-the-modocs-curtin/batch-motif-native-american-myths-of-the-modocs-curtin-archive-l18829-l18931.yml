canonical_text:
  quote: ''
  summary: A small orphaned boy encounters a tula spirit or cane, suffers a crisis
    associated with becoming a doctor, dreams instructions for making a medicine cane,
    is mocked and threatened in the village, receives a new hairstyle, red paint,
    and the name Sapkokis, and later uses the tula cane to kill his father's killer
    and hostile men while sparing one man who had been kind to him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy loses his mind and is nearly dead after hearing the spirit say that
    he has broken its back and should fix it and use it as a cane against enemies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the boy regains his mind, his mouth is bloody, and the passage states
    that this happens when a child is going to be a doctor.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy dreams that the tula cane tells him how to make a regular medicine
    cane, which he makes and later carries to the village.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Several village figures mock or threaten the boy, including Tusasas and the
    man who killed the boy's father.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The boy asks his grandmother to fix his head; she shaves his hair except for
    a braided tuft, paints his head and face red, and he gives himself the name Sapkokis.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sapkokis places his medicine cane over his sleeping place and says that if
    it falls, it will be a sign that he is in trouble.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Old woman Ndukis warns Sapkokis that the man who killed his father will kill
    him, tears a hole in her house, and tells him to crawl out and run home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Sapkokis strikes the man who killed his father with the tula cane, and the
    man falls into two pieces.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The people shoot at Sapkokis but cannot hit him; he strikes men with the tula
    cane, killing each man he hits, but he spares one man who says he had always been
    kind to him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sapkokis goes to the mountain and stands in high grass by the trail; many
    men come to kill him, but his cane kills every man.
  category: sequence
  evidence_refs:
  - ev:9
