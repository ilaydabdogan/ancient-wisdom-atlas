canonical_text:
  quote: He was like the moon; his body was changed and he was bright and beautiful.
  summary: Gaukos returns home transformed and carrying gifts. Lisgaga, his little
    sister, receives him with a mat and food, while the elder sister first treats
    him as a desirable stranger and later behaves toward him in ways he rejects as
    inappropriate for a sister. After the elder sister ties strands of her hair to
    his hair at night, Gaukos says he will leave, and Lisgaga advises him to go east
    for safety and help.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Gaukos takes a unique seamless beaded buckskin dress for his little sister
    and a less fine buckskin dress for the elder sister.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Gaukos approaches the village, the little sister goes down the ladder
    into the house, the villagers wonder who the stranger is, and his changed body
    is described as moonlike, bright, and beautiful.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lisgaga spreads a tula grass mat she made, and the mat becomes bright and
    beautiful; the elder sister takes it for the stranger to sit on because she thinks
    he may be coming to marry her, but Lisgaga reclaims it as made for her brother.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The elder sister brings water from the spring and pounds seeds for the stranger,
