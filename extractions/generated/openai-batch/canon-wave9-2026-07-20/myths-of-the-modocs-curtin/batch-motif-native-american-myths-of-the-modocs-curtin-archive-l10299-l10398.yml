canonical_text:
  quote: '"I can turn to a snake, but I am a man"'
  summary: A snake-being named Wamanik reveals himself as an earth spirit who can
    become a man and wants the younger daughter of Wiskak as a wife. He becomes the
    husband of Wiskak's daughters, comes to them at night from underground, and is
    described as bright, powerful, a hunter, and a dweller under earth, mountains,
    and water. A rival named Tusasas boasts about marrying the girls and is punished
    with severe itching. Wamanik later reassures Wiskak's fearful kin, feeds them,
    and says he can hear distant speech. The passage ends with Wiskak worrying about
    the daughters' work and Kekina claiming the wives do not love Wamanik.
  language: English
  quote_policy: quoted
