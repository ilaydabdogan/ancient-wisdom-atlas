canonical_text:
  quote: ''
  summary: Natanatas repeatedly tries to kill his son-in-law Kai through deer hunts,
    transformed fish, and river-race traps. Kai survives with help from Goshgoise
    and white eagle feathers, reverses the attacks, and Natanatas is eaten by his
    own sons before his spirit escapes and he becomes alive again.
  language: English
  quote_policy: summarized
