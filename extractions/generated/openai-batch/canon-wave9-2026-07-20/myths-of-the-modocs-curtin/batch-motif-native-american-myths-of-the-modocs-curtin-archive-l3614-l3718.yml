canonical_text:
  quote: ''
  summary: Keis disobeys advice and goes to the Gletcowas brothers' snares, where
    a fat deer is caught. After injuring his mouth while trying to take the deer,
    he disputes ownership with the brothers, goes home angry, and makes poison, fever,
    black vomit, sores, pains, and sickness. Snoutiss warns that these things may
    spread and trouble future people, then confirms with the brothers that they had
    offered Keis meat. Snoutiss sees Keis's house filled with sickness and leaves
    for his uncle Wewenkee, who goes to inspect the house but cannot remain because
    of the smell.
  language: English
  quote_policy: summarized
